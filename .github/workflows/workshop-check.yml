# Ask Steam, once a day, whether any mod this repository keeps a copy of has
# been updated — and say so in an issue when one has.
#
# This is the half of the loop a machine can do on its own. The other half, the
# files, cannot: workshop content for this game refuses an anonymous download
# (`steamcmd +login anonymous +workshop_download_item 3450310 <id>` answers
# `Download item failed (Failure)`), so only a machine logged in as somebody who
# owns EU5 can fetch it. That is the owner's box, and `tools/sync_workshop.ps1`
# is the one command there.
#
# What runs here needs no key, no account and no secret: Steam's public
# GetPublishedFileDetails, compared against reference/workshop_generated_state.json.
name: workshop update check

on:
  schedule:
    # 06:20 UTC. Not on the hour — GitHub drops scheduled runs at busy minutes.
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    # On the default branch only: a branch that is still being worked on should
    # not open an issue about a mod nobody has decided to bring in yet.
    branches: [main]
    paths:
      - tools/workshop_mods.txt
      - reference/workshop_generated_state.json

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: `workshop.py status` asks git when each
          # reference copy was last committed, and on a shallow clone that
          # question has no answer.
          fetch-depth: 0

      - name: What the workshop has
        id: check
        run: |
          set +e
          python3 tools/workshop.py status > report.txt 2>&1
          echo "stale=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Say so, in the one issue that exists for this
        if: steps.check.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Workshop updates waiting to be copied in"
          body=$(
            echo "\`tools/workshop.py status\`, $(date -u '+%Y-%m-%d %H:%M UTC'):"
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Steam will not hand these to GitHub — the files come from a machine that owns the game:"
            echo
            echo '```powershell'
            echo '.\tools\sync_workshop.ps1'
            echo '```'
            echo
            echo "That copies them into \`reference/\`, rebuilds everything generated from them, commits and pushes."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          )

          # One issue, reopened and commented on, rather than one a day.
          gh label create workshop --color BFD4F2 --description "Steam Workshop copies in reference/" 2>/dev/null || true
          number=$(gh issue list --label workshop --state all --limit 1 --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue reopen "$number" 2>/dev/null || true
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label workshop --body "$body"
          fi

      - name: Close it when everything here is current
        if: steps.check.outputs.stale == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh issue list --label workshop --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            body=$(
              echo "Every tracked mod here is the version the workshop has."
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            )
            gh issue close "$number" --comment "$body"
          fi
