l_russian:
 OYE: "Ойо"
 OYE_ADJ: "ойоский"
 OYE_f: "Империя Ойо"
 OYE_f_desc: "Империя Ойо была самым могущественным государством йоруба и одной из крупнейших держав Западной Африки, прославленной грозной конницей и продуманным государственным устройством, уравновешивавшим власть алаафина советом Ойо Меси. Объединяя коренные земли йоруба под главенством Ойо-Иле, эта империя с XV до начала XIX века господствовала на торговых путях между лесной зоной и саванной."
