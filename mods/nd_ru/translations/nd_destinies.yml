l_russian:
 rule_nd_destinies_rule: "Древа национальных судеб"
 setting_nd_destinies_enabled: "Включено"
 setting_nd_destinies_enabled_desc: "Каждая образуемая страна получает после образования ветвящееся древо судьбы (корневое улучшение и два пути по три ступени), построенное на системе [advances|e], со всплывающими окнами [dynamic_historical_event|e] и венчающими зданиями, привязанными к отдельным улучшениям."
 setting_nd_destinies_disabled: "Отключено"
 setting_nd_destinies_disabled_desc: "Улучшения судьбы после образования страны не появляются. События образования и временные модификаторы по-прежнему работают; древа улучшений наследия, бюрократии и особые войска, здания и ополчения остаются включёнными."
