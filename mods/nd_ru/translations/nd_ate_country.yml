l_russian:
 ATE: "Ашанти"
 ATE_ADJ: "ашантийский"
 ATE_f: "Конфедерация Ашанти"
 ATE_f_desc: "Конфедерация Ашанти объединила народы акан под Золотым табуретом, создав могущественное царство с центром в Кумаси. Держа в руках торговлю золотом и опираясь на развитую военную организацию, асантехене мог простирать свою власть по всему Золотому Берегу и вглубь Западной Африки."
