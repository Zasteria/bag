l_russian:
 SVB: "Суварнабхуми"
 SVB_ADJ: "суварнабхумийский"
 SVB_f: "Суварнабхуми"
 SVB_f_desc: "Суварнабхуми («Золотая земля» буддийских сутр и каменных надписей) — собственное имя материка, общетхеравадинская империя, о которой поочерёдно мечтали кхмерские чаккаватти, аютийские боги-цари, завоеватели Таунгу и лаосские владыки мандал. Для образования Суварнабхуми нужно держать все четыре цивилизационных якоря материковой Юго-Восточной Азии: ваты Ангкора, золотые чеди Аюттхаи, усеянную ступами равнину Багана и Тхатлуанг Вьентьяна. Под одним шафраново-золотым знаменем колеса дхармы четыре культурных ядра материкового Индокитая отвечают единому буддийскому вселенскому монарху, исполняя замысел, что ненадолго удержал Байиннаун и что рассыпался с его смертью."
