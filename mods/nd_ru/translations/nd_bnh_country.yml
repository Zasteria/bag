l_russian:
 BNH: "Бет-Нахрин"
 BNH_ADJ: "нахринский"
 BNH_f: "Бет-Нахрин"
 BNH_f_desc: "Бет-Нахрин («Земля между реками» по-сирийски) возрождает Месопотамию под властью христианских наследников Ниневии и Эдессы. Патриархи Церкви Востока по-прежнему окормляют паству от Тигра до Китая; монастыри Тур-Абдина пережили монгольских, мамлюкских и туркменских владык, сохранив свою самостоятельность; графство Эдесское доказало, что латино-сирийское государство способно удержать верхнюю Джазиру. Образование Бет-Нахрина сводит эти нити в единое арамеоязычное христианское государство с центром в Мосуле, древней резиденции патриархата, где Тур-Абдин и Эдесса служат ему духовными лёгкими."
