l_russian:
 VJN: "Карната"
 VJN_ADJ: "карнатский"
 VJN_f: "Империя Карната"
 VJN_f_desc: "Верните имперское достоинство Виджаянагару, великой индуистской империи юга. Закалённая в противостоянии деканским султанатам и вознесённая на вершину Кришнадеварайей, Карната Раджья объединяет дравидийские народы под кабаньим знаменем Варахи: хранителя дхармы, покровителя храмов и владыки берегов, торгующих пряностями."
