l_russian:
 TBT: "Тибет"
 TBT_ADJ: "тибетский"
 TBT_f: "Тибетская империя"
 TBT_f_desc: "Возродите ярлунгскую империю (Бод-ченпо) Сонгцэна Гампо, Трисонга Дэцэна и Ралпачана, когда тибетские войска доходили от Лхасы до танского рубежа и удерживали Таримский бассейн против Китая. Это воинско-имперский Тибет каменных стел с эдиктами и бон-буддийского синтеза, а не позднейшая гелугская теократия лам. От Поталы до Самье знамя ценпо вновь поднимается над Крышей мира."
