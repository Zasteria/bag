l_russian:
 TKT: "Рыцари Храма"
 TKT_ADJ: "тамплиерский"
 TKT_f: "Рыцари Храма"
 TKT_f_desc: "Восстановите Pauperes Commilitones Christi Templique Salomonici как суверенный духовно-рыцарский орден, отвергнув роспуск 1312 года и получив в наследство иберийские банкирские дома, атлантический флот и обитель Томар, которые история оставила лишь ордену Христа. Тамплиерское суверенное государство — первая международная банкирская корпорация католического мира, обращённая в державу: обращённая к Атлантике рыцарская республика казначеев, мореходов и тихих еретиков, чей тайный капитул отвечает лишь перед папой, отменившим буллу Климента V."
