l_russian:
 MAP: "Вальмапу"
 MAP_ADJ: "мапучский"
 MAP_f: "Вальмапу"
 MAP_f_desc: "Сплотите разрозненные лоф, реве и айярреве народа мапуче в единую суверенную конфедерацию. От лесов Нгулумапу до степей Пуэльмапу рече, повернувшие вспять инков и разбившие испанцев при Куралабе, заявляют права на признанное королевство по всей земле между кордильерой и морем. Токи поведёт федерацию на войну, мачи сохранит её дух, и ни одна чужая корона не ступит южнее Био-Био без спроса."
