l_russian:
 NUM: "Команчерия"
 NUM_ADJ: "команчский"
 NUM_f: "Команчерия"
 NUM_f_desc: "Образуйте Нуману Сукобиту, страну команчей, как суверенную конную империю Равнин. Из сердца Льяно-Эстакадо параибо и теквунивапи сводят подразделения пенатека, ямпарика, куахади, нокони и коцотека в единую конфедерацию, взимая дань с пограничья и обращая бизонье хозяйство в основание континентальной силы. Это империя команчей, какой её описал Пекка Хямяляйнен: коренное государство, полтора века навязывавшее свою волю Южным Равнинам, — сделанное постоянным."
