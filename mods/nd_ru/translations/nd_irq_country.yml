l_russian:
 IRQ: "Ирак"
 IRQ_ADJ: "иракский"
 IRQ_f: "Ирак"
 IRQ_f_desc: "Ирак возрождает Савад — орошаемую землю между Тигром и Евфратом, некогда дававшую пятую часть доходов халифата, — как суверенное мусульманское государство с престолом в Багдаде. Великие каналы вышли из строя задолго до прихода монголов: Нахраван был прорван во время междоусобицы 937 года и толком не восстановлен, и последующие века Месопотамия провела окраинной провинцией того, кто держал Тебриз, Каир или Стамбул. Султаны Джалаиридов с 1330-х годов держали в Багдаде настоящий двор — довод, что страна способна править собой. Образование Ирака довершает эту работу: каналы отрыты заново, Басра и торговля Залива в руках, Куфа и города святынь под защитой, а Багдад восстановлен как столица, никому не подотчётная."
