l_russian:
 MRL: "Махарлика"
 MRL_ADJ: "махарликский"
 MRL_f: "Махарлика"
 MRL_f_desc: "Махарлика — воинское благородное сословие тагальского общества, свободные люди, носившие оружие рядом со своими дату и раджами. Их родня — тимава Висайев, магиноо прибрежных государств Лусона и багани Минданао — составляла воинский хребет каждого филиппинского народа от Апарри до Сулу. Махарлика — это общеархипелажная нация, которой история так и не создала: единое коренное государство, связывающее Лусон, Висайи и Минданао идеалом свободного человека ещё до того, как испанские галеоны смогли достичь Себу. Образуйте Махарлику, чтобы выковать филиппинскую цивилизацию, изгнавшую или попросту пережившую всякое европейское, голландское и брунейское вторжение."
