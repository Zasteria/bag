l_russian:
 YMP: "Ямато"
 YMP_ADJ: "императорский японский"
 YMP_f: "Империя Ямато"
 YMP_f_desc: "Мечта, за которой Тоётоми Хидэёси гнался до самой смерти. В 1592 году он бросил самурайские армии объединённой Японии на Корею и дальше, на минский Китай, замыслив не меньше чем японскую империю над всей Восточной Азией; лишь его смерть в 1598-м обрушила поход и дала Токугаве повод для двух с половиной веков затворничества. Империя Ямато — другой исход: бакуфу отвергает сакоку, Имджинская война удаётся, и хризантемовый трон простирается от Хоккайдо через Хансон до Янцзы. Японские замки поднимаются над Пхеньяном, самураи становятся офицерским корпусом континентального порядка, а микадо правит восточноазиатской империей, выстроенной из честолюбия Эдо, а не из его затворничества."
