l_russian:
 ARC: "Киликийская Армения"
 ARC_ADJ: "киликийско-армянский"
 ARC_f: "Киликийская Армения"
 ARC_f_desc: "Восстановите Армянское королевство Киликии под короной Хетумидов — средиземноморскую державу, два столетия связывавшую апостольское христианство с латинским крестоносным миром из своей столицы в Сисе. Если нагорная Багратидская Армения смотрит на восток, к Кавказу, то Киликийская Армения обращена к морю: королевство купеческих портов, итальянских торговых концессий и рыцарей в восточных накидках. Создайте армянскую талассократию вдоль левантийского побережья, овладейте Кипром и путями пряностей и докажите, что королевство, сломленное мамлюками в 1375 году, могло бы их пережить."
