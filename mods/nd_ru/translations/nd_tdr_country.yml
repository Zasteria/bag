l_russian:
 TDR: "Боспор"
 TDR_ADJ: "боспорский"
 TDR_f: "Боспорское царство"
 TDR_f_desc: "Заново выкуйте утраченную державу Понтийского берега: греко-готское царство с опорой в Мангупе, наследник князей Феодоро, а до них — древних боспорских властителей. Примет ли оно вид ромейского Regnum Bospori или Киммерийского Боспора готских королей, зависит от того, какую линию предпочтёт чтить его двор."
