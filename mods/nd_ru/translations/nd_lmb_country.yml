l_russian:
 LMB: "Ломбардия"
 LMB_ADJ: "ломбардский"
 LMB_f: "Ломбардия"
 LMB_f_desc: "Заявите права на Железную корону старого regnum Langobardorum и поднимите долину По до собственного королевства, венчаясь в Монце или Павии, как венчались средневековые короли Италии. От коммун Ломбардской лиги, смиривших Барбароссу при Леньяно, до герцогов Висконти, стоявших в одном походе от королевского титула, когда в 1402 году ударила чума, Ломбардия всегда была сердцем северной Италии: её банкирам, её ткацким станкам и её амвросианской церкви недостаёт лишь короны под стать. Ломбардская держава, владеющая и Миланом, и Павией, может сделать этот последний шаг."
