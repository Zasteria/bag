l_russian:
 DNM: "Дунайская монархия"
 DNM_ADJ: "дунайский"
 DNM_f: "Дунайская монархия"
 DNM_f_desc: "Дунайская монархия — империя, которую дом Габсбургов создаёт, отказавшись от Рейха. Для императора Священной Римской империи германская гегемония и дунайское сверхгосударство были навсегда несовместимы: государь, связанный имперским сеймом, курфюрстами и рейхстагом, никогда не сумел бы свести Австрию, Богемию и Венгрию в одну послушную корону. Образование Дунайской монархии разрешает это противоречие единственным возможным способом — разрывом. Вы отрекаетесь от императорского достоинства, выводите наследственные, чешские и венгерские земли из Священной Римской империи и заново учреждаете их как собственную суверенную империю, подотчётную никакому сейму, кроме вашего двора. Немецкие князья остаются со своим Рейхом; вы берёте Дунай. Это не Австро-Венгрия, дуалистический компромисс, до которого история дошла лишь через век потрясений, а централизованная многонациональная монархия, к которой Габсбурги всегда тянулись и которой так и не удержали."
