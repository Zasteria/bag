l_russian:
 LBE: "Луба"
 LBE_ADJ: "лубский"
 LBE_f: "Империя Луба"
 LBE_f_desc: "Империя Луба была могущественным центральноафриканским государством в котловине Упемба и верховьях Луалабы. Прославленная своей системой балопве — священного царствования, образцом правления настолько удачным, что его переняли соседние народы саванны, — держава Луба сплачивала разные общины священной властью, торговлей медью и покровительством ремёслам."
