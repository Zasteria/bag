l_russian:
 KWS: "Килва"
 KWS_ADJ: "килвийский"
 KWS_f: "Килвийский султанат"
 KWS_f_desc: "Килвийский султанат был богатейшим и сильнейшим из городов-государств суахилийского побережья и с XII по XVI век держал в руках торговлю золотом из глубин юго-восточной Африки в Индийский океан. Объединив суахилийские торговые города под одним знаменем, правитель может возродить морскую торговую империю Килвы и вновь господствовать на путях Индийского океана."
