l_russian:
 KHL: "Халифат"
 KHL_ADJ: "халифатский"
 KHL_f: "Халифат"
 KHL_f_desc: "Вселенский суннитский халифат, восстановленный после тысячелетия династического дробления. От аль-Андалуса до Синда, от Атласа до Инда одному халифу подчиняется вся умма; Мекка, Медина, Каир, Дамаск, Багдад и престолы старых омейядского и аббасидского миров отвечают одному трону. Это халифат не какой-то одной династии — не Омейядов, Аббасидов, Фатимидов, Альмохадов или Османов, — а воплощённый идеал Рашидун: вселенская община верующих под одним знаменем. Чёрный стяг Пророка вновь реет над миром, единым в вере."
