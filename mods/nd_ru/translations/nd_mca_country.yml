l_russian:
 MCA: "Муиска"
 MCA_ADJ: "муискский"
 MCA_f: "Конфедерация муисков"
 MCA_f_desc: "Конфедерация муисков объединяет горные вождества альтиплано Кундибойясенсе под единой политической властью. Сведя вместе владения сипы в Бакате и саке в Унсе вместе со священной округой Суамокс, конфедерация искусных златокузнецов и торговцев изумрудами становится главной силой колумбийского нагорья."
