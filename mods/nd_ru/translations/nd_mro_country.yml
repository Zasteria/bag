l_russian:
 MRO: "Минданао"
 MRO_ADJ: "моросский"
 MRO_f: "Султанат Моро"
 MRO_f_desc: "Султанат Моро — несостоявшаяся общеисламская конфедерация Минданао и Сулу: султан-халиф, которому соперничающие султанаты Сулу, Магинданао, Ланао и Буаян, раджи Бутуана и дату Замбоанги и побережья иранун приносят одну общую присягу. Его воинская знать носит волнистые крисы и калисы; его флотилии винта под латинским парусом, быстрее любого галеона, треплют испанских, голландских и английских пришельцев от моря Сулу до Висайев. Для образования нужно объединить Минданао под суннитской верой и посадить единого халифа в Маимбунге и Кута-Ватту: то, чего южные острова так и не приняли вместо трёх веков колониального завоевания."
