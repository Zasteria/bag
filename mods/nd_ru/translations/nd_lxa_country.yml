l_russian:
 LXA: "Лансанг"
 LXA_ADJ: "лансангский"
 LXA_f: "Лансанг"
 LXA_f_desc: "Королевство Лансанг, Земля миллиона слонов, — великое единое лаосское государство, основанное Фа Нгумом в 1354 году. Простираясь от плато Корат до северных нагорий верхнего Меконга, оно было одним из крупнейших королевств Юго-Восточной Азии, пока распри не раскололи его в 1707 году на соперничающие Луангпхабанг, Вьентьян и Тямпасак. Лаосский правитель, владеющий обеими древними столицами, может возродить эту некогда могучую державу."
