l_russian:
 DRR: "Дуррани"
 DRR_ADJ: "дурранийский"
 DRR_f: "Дурранийская империя"
 DRR_f_desc: "Создайте возглавляемую пуштунами империю на перекрёстке Персии, Средней Азии и Индостана — в духе лойя-джирги Ахмад-шаха Дуррани в Кандагаре в 1747 году. Дурранийская империя была второй по величине мусульманской державой своего времени и связала афганскую племенную конфедерацию, Хорасан, Синд и Пенджаб в одно государство под знаменем Абдали."
