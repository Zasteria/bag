 nd_dnm_ga_cede_tt: "Разрешает кризис наследования на унизительных условиях: малая потеря [stability|e] и уступленная Санкция вместо тяжёлой потери и сломанной Санкции, которые несёт крах"
 nd_dnm_break_the_leagues: "Разбить национальные лиги"
 nd_dnm_break_the_leagues_desc: "Власть над коренными землями отвоёвана. Лиги, питавшие кризис, можно разбить поодиночке, как только у двора достанет воли."
 action_nd_dnm_break_the_leagues: "Разбить национальные лиги"
 action_nd_dnm_break_the_leagues_desc: "Власть над коренными землями отвоёвана. Лиги, питавшие кризис, можно разбить поодиночке, как только у двора достанет воли."
 nd_dnm_offer_the_compromise: "Предложить компромисс"
 nd_dnm_offer_the_compromise_desc: "Две равноправные державы, один венценосец, одна армия, одна внешняя политика. Аусглейх привязывает народы к империи их же согласием, и предложить его можно, как только короне начнут верить."
 action_nd_dnm_offer_the_compromise: "Предложить компромисс"
 action_nd_dnm_offer_the_compromise_desc: "Две равноправные державы, один венценосец, одна армия, одна внешняя политика. Аусглейх привязывает народы к империи их же согласием, и предложить его можно, как только короне начнут верить."
 nd_dnm_concede_the_crowns: "Уступить короны"
 nd_dnm_concede_the_crowns_desc: "Вопрос признаётся неразрешимым, и корона перестаёт на него отвечать. Одна из корон-составляющих пойдёт своим путём, и составная монархия станет меньше."
 action_nd_dnm_concede_the_crowns: "Уступить короны"
 action_nd_dnm_concede_the_crowns_desc: "Вопрос признаётся неразрешимым, и корона перестаёт на него отвечать. Одна из корон-составляющих пойдёт своим путём, и составная монархия станет меньше."
 nd_dnm_nq_control_met_tt: "Контроль над коренным регионом достиг уровня, нужного кризису для восстановления власти"
 nd_dnm_nq_compromise_ready_tt: "Был избран путь Gesamtmonarchie, либо у короны неотрицательная стабильность и законность не ниже 50"
 nd_dnm_ga_reassert_tt: "Разрешает Национальный вопрос восстановлением центральной власти: единое государство"
 nd_dnm_ga_ausgleich_tt: "Разрешает Национальный вопрос компромиссом: Аусглейх и Австро-Венгрия"
 nd_dnm_ga_concede_tt: "Разрешает Национальный вопрос уступкой: одна из корон-составляющих становится независимой"
 nd_dnm.1.t: "Короны Дуная"
 nd_dnm.1.d: "Свершилось. Наследственные земли, корона святого Вацлава и корона святого Стефана вместе вышли из Священной Римской империи, а императорское достоинство сложено. Курфюрсты собираются без нас; папские легаты едут в Вену с укорами; в немецких землях Рейх оставлен князьям. У нас есть то, чего не мог удержать ни один император, связанный рейхстагом: Австрия, Богемия и Венгрия как одна суверенная держава, подотчётная никакому сейму, кроме нашего двора.\n\nНо держава немцев, чехов, мадьяр, хорватов, словаков и ещё дюжины народов — ещё не монархия. Что её свяжет?\n\n#bold Antemurale Christianitatis#! делает Дунай щитом христианского мира: Военная граница, поселения солдат-граничар, нескончаемая война с османами, дающая каждой короне общего врага и общее дело.\n\n#bold Gesamtmonarchie#! делает Дунай одним телом: Гофкаммер, Гофкригсрат, Прагматическая санкция, сваривающие три канцелярии в единое послушное государство.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_dnm.1.a: "Antemurale Christianitatis: быть оплотом христианского мира"
 nd_dnm.1.b: "Gesamtmonarchie: сварить три короны в одно тело"
 nd_dnm.2.t: "Военная граница"
 nd_dnm.2.d: "Вдоль Савы, Дравы и нижнего Дуная складывается общество нового рода. Сербские, хорватские и влашские семьи селят на границе на наследственном землевладении: свободные от феодальных повинностей, свободные в вере, но связанные от мала до велика вечной военной службой. Militaergrenze — не линия крепостей, а живая стена солдат-земледельцев, самое многочисленное военизированное население Европы, стерегущее османский рубеж от колыбели до могилы. Вопрос в том, что делать с войском, которое никогда не распускается."
 nd_dnm.2.a: "Остриё: двигать границу на юг, в османские земли"
 nd_dnm.2.b: "Щит: селить границу вглубь и дать ей кормить себя самой"
 nd_dnm.3.t: "Белая Гора"
 nd_dnm.3.d: "Ноябрьским утром под Прагой войско чешских сословий разбито за один день. Зимний король бежит; двадцать семь вождей восстания казнены на Староместской площади; выборная монархия святого Вацлава упразднена Обновлённым земским уложением, а корона объявлена наследственной, католической и габсбургской. Треть чешской земли меняет хозяев. Ни один день не сделал больше для создания составной монархии и не оставил в ней раны глубже."
 nd_dnm.3.a: "Окатоличить указом: одна вера, наложенная сверху"
 nd_dnm.3.b: "Связать новую знать: верность, купленная конфискованной землёй"
 nd_dnm.4.t: "Прагматическая санкция"
 nd_dnm.4.d: "У Карла VI нет сына, и он не допустит, чтобы труд двух столетий разделили после его смерти. Корона за короной, сейм за сеймом Прагматическая санкция утверждается: габсбургские земли переходят #italic indivisibiliter ac inseparabiliter#! (нераздельно и неразлучно) как одно тело единому наследнику, дочери или сыну. Впервые Австрия, Богемия и Венгрия — не три короны в одной руке, а одно юридическое лицо. Это конституционный хребет Gesamtmonarchie. Это же и документ, из-за которого будет вестись следующая война."
 nd_dnm.4.a: "Одна держава, один наследник, нераздельно и неразлучно"
 nd_dnm.5.t: "Терезианские реформы"
 nd_dnm.5.d: "Силезия потеряна, и потеря эта — приговор: держава, не умеющая собирать подати и учить войска, не может себя защитить. Из Вены реформа накатывает волной: единое казначейство, Директориум, рекрутские кантоны, Терезианум для подготовки тех, кто всем этим будет управлять. Там, где Мария Терезия строит машину, Иосиф II гонит её за пределы возможного: Патент о веротерпимости, единый язык канцелярии, крестьянин, освобождённый указом. На одно поколение составная монархия становится — почти — государством."
 nd_dnm.5.a: "Камералистская машина: обложенная, вымуштрованная, управляемая из центра"
 nd_dnm.5.b: "Иосифинский размах: веротерпимость, грамотность, единая бюрократия"
 STATIC_MODIFIER_NAME_nd_dnm_antemurale_christianitatis: "Antemurale Christianitatis"
 STATIC_MODIFIER_DESC_nd_dnm_antemurale_christianitatis: "Щит христианского мира на Дунае. Военная граница и поселения солдат-граничар обращают державу в стену людей против османов, а положение оплота веры приносит уважение по всей католической Европе — ценою двора, навеки занятого снабжением границы."
 STATIC_MODIFIER_NAME_nd_dnm_gesamtmonarchie: "Gesamtmonarchie"
 STATIC_MODIFIER_DESC_nd_dnm_gesamtmonarchie: "Всецелая монархия. Гофкаммер, Гофкригсрат и Прагматическая санкция сваривают три короны в одно послушное управляемое тело, обложенное податями и подчинённое Вене, — ценою недовольства сословий и имперского сейма централизующим двором."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_spearhead: "Остриё границы"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_spearhead: "Военная граница, обращённая вовне: граничары как копьё отвоевания, теснящее османский рубеж на юг."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_shield: "Щит границы"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_shield: "Военная граница, заселённая вглубь и кормящая себя сама, — несокрушимая стена, что сама себя питает и пополняет."
 STATIC_MODIFIER_NAME_nd_dnm_verneuerte_ordnung: "Verneuerte Landesordnung"
 STATIC_MODIFIER_DESC_nd_dnm_verneuerte_ordnung: "Чешская церковь и устройство, перекроенные императорским патентом: Контрреформация, наложенная сверху."
 STATIC_MODIFIER_NAME_nd_dnm_loyal_aristocracy: "Верная аристократия"
 STATIC_MODIFIER_DESC_nd_dnm_loyal_aristocracy: "Новое служилое дворянство, привязанное к короне конфискованными поместьями мятежников Белой Горы."
 STATIC_MODIFIER_NAME_nd_dnm_indivisible_realm: "Нераздельная держава"
 STATIC_MODIFIER_DESC_nd_dnm_indivisible_realm: "Прагматическая санкция, утверждённая короной за короной: габсбургские земли — одно юридическое тело, одно наследство, одна верность."
 STATIC_MODIFIER_NAME_nd_dnm_theresian_machine: "Терезианская машина"
 STATIC_MODIFIER_DESC_nd_dnm_theresian_machine: "Камералистская реформа Марии Терезии: единое казначейство, Директориум, рекрутские кантоны — составная монархия, управляемая как одно государство."
 STATIC_MODIFIER_NAME_nd_dnm_josephine_reach: "Иосифинский размах"
 STATIC_MODIFIER_DESC_nd_dnm_josephine_reach: "Просвещённый размах Иосифа II: Патент о веротерпимости, единый язык канцелярии, грамотная многонациональная бюрократия."
 nd_dnm_bella_gerant_alii: "Bella Gerant Alii"
 nd_dnm_bella_gerant_alii_desc: "«Пусть воюют другие; ты, счастливая Австрия, заключай браки». Бургундия, Кастилия, Богемия и Венгрия достались дому Габсбургов наследством и браком, а не завоеванием. Династическая дипломатия — основополагающее орудие дунайского государства."
 nd_dnm_hofkammer: "Венский Гофкаммер"
 nd_dnm_hofkammer_desc: "Центральная придворная палата, учреждённая в 1527 году, свела нижнеавстрийское, тирольское, чешское и венгерское казначейства в одну руку в Вене: первый финансовый хребет составной монархии. Открывает Гофкаммер."
 nd_dnm_hofkriegsrat: "Гофкригсрат"
 nd_dnm_hofkriegsrat_desc: "Придворный военный совет 1556 года, первое постоянное центральное военное управление в Европе: он планировал войну с османами, строил крепости и из одной канцелярии платил войску трёх корон."
 nd_dnm_huszar: "Венгерский гусар"
 nd_dnm_huszar_desc: "Лёгкая конница венгерской короны, поднятая против османских акынджи и к 1700 году перенятая всеми армиями Европы. Открывает ополчение венгерских гусар."
 nd_dnm_danube_staple: "Дунайское складочное право"
 nd_dnm_danube_staple_desc: "Средневековое Stapelrecht Вены заставляло всякое судно на реке разгружаться и торговать в имперской столице: установление, обратившее Дунай в единую торговую артерию. Открывает Донау-Штапель."
 nd_dnm_militaergrenze: "Militaergrenze"
 nd_dnm_militaergrenze_desc: "Военная граница: сербские, хорватские и влашские колонисты, поселённые по линии Савы и Дравы на наследственном держании за вечную пограничную службу. Открывает пограничный округ и ополчение граничар."
 nd_dnm_kleinkrieg: "Доктрина Kleinkrieg"
 nd_dnm_kleinkrieg_desc: "Малая война пограничья: засада, набег и стычка на изрезанной дунайской местности — то нерегулярное ремесло, из-за которого граничар, гайдуков и пандуров боялись от Савы до Баната."
 nd_dnm_jesuit_colleges: "Конфессиональная граница"
 nd_dnm_jesuit_colleges_desc: "Контрреформация поднималась вверх по Дунаю на плечах иезуитских коллегий Вены, Граца, Оломоуца и Трнавы, которые окатоличивали и просвещали возвращённые короны. Открывает иезуитскую коллегию."
 nd_dnm_donau_flottille: "Донау-Флотилле"
 nd_dnm_donau_flottille_desc: "Имперская дунайская военная флотилия: галеры-чайки, бившиеся с османским речным флотом от Комарома до Белграда. Открывает ополчение чаек."
 nd_dnm_renewed_constitution: "Обновлённое земское уложение"
 nd_dnm_renewed_constitution_desc: "Verneuerte Landesordnung 1627 года: после Белой Горы чешская корона была сделана наследственной габсбургской, католической и управляемой по-немецки, а выборная монархия упразднена. Основополагающий акт централизации составной монархии."
 nd_dnm_kuerassier: "Габсбургский кирасир"
 nd_dnm_kuerassier_desc: "Тяжёлая гвардейская конница в стальных латах, решающая ударная сила имперского войска от Лютцена до османского поля. Открывает ополчение кирасир."
 nd_dnm_kaiserliche_armee: "Постоянная имперская армия"
 nd_dnm_kaiserliche_armee_desc: "Kaiserliche Armee: первое на континенте постоянное многонациональное войско, оплачиваемое Гофкаммером и обучаемое Гофкригсратом. Открывает имперский арсенал."
 nd_dnm_erblande_mercantilism: "Меркантилизм наследственных земель"
 nd_dnm_erblande_mercantilism_desc: "Камералистское развитие наследственных земель: линцская шерстяная мануфактура, идрийская ртуть, штирийское железо Эрцберга, спускаемое по Дунаю на рынки державы."
 nd_dnm_pragmatic_sanction: "Прагматическая санкция"
 nd_dnm_pragmatic_sanction_desc: "Указ 1713 года, утверждённый короной за короной: габсбургские земли переходят indivisibiliter ac inseparabiliter как одно тело единому наследнику. Конституционный хребет Gesamtmonarchie."
 nd_dnm_theresian_reforms: "Терезианские реформы"
 nd_dnm_theresian_reforms_desc: "Реформа, последовавшая за потерей Силезии: единое казначейство, Директориум и рекрутские кантоны обратили составную монархию в управленческую машину."
 nd_dnm_theresianum: "Терезианум"
 nd_dnm_theresianum_desc: "Камеральная академия, основанная в Вене в 1746 году, чтобы готовить многонациональную бюрократию Gesamtmonarchie в единой управленческой манере и на едином канцелярском языке. Открывает Терезианум."
 nd_dnm_banat_colonization: "Заселение Баната"
 nd_dnm_banat_colonization_desc: "Schwabenzuege: великое переселение дунайских швабов в отвоёванные и обезлюдевшие Банат и Бачку после Пожаревацкого мира, вернувшее опустошённое пограничье к возделыванию."
 nd_dnm_liechtenstein_artillery: "Лихтенштейнская артиллерия"
 nd_dnm_liechtenstein_artillery_desc: "Артиллерийская реформа князя Йозефа Венцеля Лихтенштейнского: единообразная подвижная система орудий, сделавшая имперский парк лучше обслуживаемым, чем любой в Европе. Открывает ополчение артиллерийского парка."
 nd_dnm_grenzer_line: "Konzivilisation"
 nd_dnm_grenzer_line_desc: "Перевод пограничных полков в регулярную линию: граничары, переделанные в обученную европейскую пехоту — нечто среднее между лёгкой и линейной, ценимое на всяком театре имперских войн."
 nd_dnm_united_chancellery: "Объединённая придворная канцелярия"
 nd_dnm_united_chancellery_desc: "Vereinigte Hofkanzlei: попытка слить австрийскую и чешскую канцелярии в один управленческий орган, высшая точка централизаторского замысла."
 nd_dnm_danube_steam: "Дунайское пароходство"
 nd_dnm_danube_steam_desc: "Erste Donau-Dampfschiffahrts-Gesellschaft, пароходное общество, обратившее реку в хребет единого промышленного дунайского хозяйства от Регенсбурга до Железных Ворот. Открывает дунайскую пароходную верфь."
 a_nd_dnm_huszar_levy: "Венгерский гусар"
 a_nd_dnm_huszar_levy_desc: "Лёгкая конница венгерской короны: быстрые, далеко ходящие налётчики, рождённые пограничной войной с османами, грабящие и прикрывающие на скорости, недоступной тяжёлой коннице."
 a_nd_dnm_grenzer_levy: "Граничар"
 a_nd_dnm_grenzer_levy_desc: "Солдаты-колонисты Военной границы. Сербские, хорватские и влашские пограничники, мастера засады и стычки на изрезанной местности Савы и Дравы, воюющие налегке и живущие малым."
 n_nd_dnm_tschaike_levy: "Чайка"
 n_nd_dnm_tschaike_levy_desc: "Речная галера малой осадки дунайской военной флотилии, ходившая под началом чайкистов и бившаяся с османским флотом от Комарома вниз до Белграда."
 a_nd_dnm_kuerassier_levy: "Габсбургский кирасир"
 a_nd_dnm_kuerassier_levy_desc: "Тяжёлая гвардейская конница в стальных латах, решающая ударная сила имперского войска: удар латного дворянства, наносимый в точке надлома строя."
 a_nd_dnm_artillery_train_levy: "Лихтенштейнский артиллерийский парк"
 a_nd_dnm_artillery_train_levy_desc: "Единообразная подвижная имперская система орудий лихтенштейнской реформы, к Наполеоновским войнам — лучше всех обслуживаемая артиллерия Европы."
 nd_dnm_hofkammer_building: "Гофкаммер"
 nd_dnm_hofkammer_building_desc: "Центральная придворная палата, Вена, 1527 год: казначейство, собравшее палаты всех корон в одну руку. Финансовый хребет Gesamtmonarchie."
 nd_dnm_donau_stapel: "Донау-Штапель"
 nd_dnm_donau_stapel_desc: "Дунайский складочный двор, где венское Stapelrecht заставляло всякое судно разгружаться и торговать, обращая реку в единую торговую артерию."
 nd_dnm_militaergrenze_building: "Militaergrenze"
 nd_dnm_militaergrenze_building_desc: "Округ Военной границы: поселения солдат-колонистов на наследственном держании за вечную пограничную службу, самое многочисленное военизированное общество Европы раннего Нового времени."
 nd_dnm_jesuit_college: "Иезуитская коллегия"
 nd_dnm_jesuit_college_desc: "Коллегия Общества Иисуса (Вена, Грац, Оломоуц, Трнава), двигатель Контрреформации и школа возвращённых корон."
 nd_dnm_imperial_arsenal: "Имперский арсенал"
 nd_dnm_imperial_arsenal_desc: "Kaiserliches Zeughaus: центральный арсенал и литейная постоянного имперского войска, отливающая пушки и хранящая мушкеты трёх корон."
 nd_dnm_theresianum_building: "Терезианум"
 nd_dnm_theresianum_building_desc: "Камеральная академия Вены 1746 года, готовившая многонациональную бюрократию составной монархии в единой управленческой манере."
 nd_dnm_danube_steam_yard: "Дунайская пароходная верфь"
 nd_dnm_danube_steam_yard_desc: "Заведение Дунайского пароходного общества, обращающее реку в хребет единого промышленного дунайского хозяйства от Регенсбурга до Железных Ворот."
 nd_dnm_destiny: "Дунайская судьба"
 nd_dnm_destiny_desc: "Три короны скованы в одну державу; чем эта держава станет, ещё не решено. Выбор при основании (оплот христианского мира или всецелая монархия) открывает путь, которым династия будет идти столетиями."
 nd_dnm_dest_sava_line: "Долгая турецкая война"
 nd_dnm_dest_sava_line_desc: "Оттеснить османский рубеж к слиянию Савы и Дуная: построить Militaergrenze, затем взять Белград и Смедерево, ключи к речной линии, которую однажды будет держать Евгений Савойский (путь Antemurale)."
 nd_dnm_dest_balkan_drive: "Поход на Балканы"
 nd_dnm_dest_balkan_drive_desc: "Вынести остриё граничар за реки, вглубь османских земель: Сараево в Боснии, Ниш на Мораве и София за Балканским хребтом, — с действительно принятой доктриной Kleinkrieg, малой войны пограничья. Оплот, обращённый в наступление."
 nd_dnm_dest_eastern_crusade: "Восточный крестовый поход"
 nd_dnm_dest_eastern_crusade_desc: "Оплот становится завоевателем: взять дунайские княжества в Бухаресте и Тырговиште, донести войну до самого Константинополя и оставить державу султана сломленной или преклонённой перед Веной. Открывает бастион Antemurale."
 nd_dnm_dest_cameral_foundation: "Камеральное основание"
 nd_dnm_dest_cameral_foundation_desc: "Централизация, измеряемая канцеляриями, а не завоеваниями: принять банковское дело и профессиональные армии и запустить Kameralhoheit, собственную бюрократию венского фиска (путь Gesamtmonarchie)."
 nd_dnm_dest_united_treasury: "Единое казначейство"
 nd_dnm_dest_united_treasury_desc: "Гофкаммер, сделанный полновластным: венская придворная палата поставлена над тремя коронами, а серебро карпатских рудников течёт в единый фиск."
 nd_dnm_dest_total_monarchy: "Всецелая монархия"
 nd_dnm_dest_total_monarchy_desc: "Вершина централизаторского замысла: устойчивое, просвещённое, единообразно управляемое дунайское государство, где разом работают оба столпа, податный и конфессиональный, — Kameralhoheit и Reformationskommission. Открывает Штаатсканцлей. (Компромисс двуединой монархии достигается не здесь: этот расчёт принадлежит Национальному вопросу.)"
 nd_dnm_dest_josephine_triumph: "Иосифинское торжество"
 nd_dnm_dest_josephine_triumph_desc: "Один патент, один свод — от Влтавы до Тисы: единообразное управляемое государство, доведённое до конца там, где историческая программа Иосифа II была сведена вничью, и завершённое там, где Объединённая канцелярия лишь попыталась. Невозможно для короны, уже потерявшей одно из королевств-составляющих. Открывает реформу «Единый патент»."
 nd_dnm_dest_estates_endure: "Сословия устоят"
 nd_dnm_dest_estates_endure_desc: "Другой ответ на тот же вопрос: право быть спрошенными по Золотой булле не упразднено, а оформлено. Landstaende, собственный аппарат сословных собраний, должен действительно работать. Открывает реформу «Сейм в совете»."
 nd_dnm_amb_root_tt: "Уния держится сама (стабильность не ниже 75)"
 nd_dnm_amb_sava_tt: "Граница построена, и Белград отвечает Вене, а не Константинополю (взят корень судьбы)"
 nd_dnm_amb_balkan_tt: "Доктрина малой войны выносит граничар за реки, в Боснию и долину Моравы (удержана линия Савы и принята доктрина Kleinkrieg)"
 nd_dnm_amb_crusade_tt: "Престол султана пуст или подчинён Вене: балканский поход завершён, а османская держава более не существует или является нашим [subject|e]"
 nd_dnm_amb_cameral_tt: "Предписания Гофкаммера действительно исполняются (взят корень судьбы и работает бюрократия Kameralhoheit)"
 nd_dnm_amb_treasury_tt: "Серебро идёт через один коронный фиск, а не через три (заложено камеральное основание и взято улучшение «Венский Гофкаммер»)"
 nd_dnm_amb_total_tt: "Фиск и конфессиональная комиссия отвечают одной руке (единое казначейство завершено; работают обе бюрократии — Kameralhoheit и Reformationskommission)"
 nd_dnm_amb_patent_tt: "Один патент, один свод — от Влтавы до Тисы (работает бюрократия Директориума и не потеряно ни одно королевство-составляющая)"
 nd_dnm_amb_diet_tt: "Ландтаги сохраняют своё старое право быть спрошенными (работает бюрократия Landstaende)"
 nd_dnm_uniform_patent_reform: "Единый патент"
 nd_dnm_uniform_patent_reform_desc: "Единый управленческий свод и единый канцелярский язык по всем коронным землям, наложенные патентом из Вены. То, что Иосиф II указал, а сословия отвергли, эта корона сумела удержать.\n\nДаёт +10% к законодательной действенности и +15% к скорости ассимиляции; дворянские сословия никогда не простят попрания своих привилегий."
 nd_dnm_diet_in_council_reform: "Сейм в совете"
 nd_dnm_diet_in_council_reform_desc: "Старое право быть спрошенными, ius resistendi Золотой буллы, оформленное как постоянный конституционный орган вместо упразднения, навязанного в Пресбурге в 1687 году. Сеймы заседают в совете, и корона законодательствует вместе с ними, а не через их голову.\n\nДаёт -8% к сепаратизму и +10% к верности вассалов; коронное законодательство идёт медленнее, потому что с сеймами приходится действительно советоваться."
 nd_dnm.6.t: "Судьба Дуная"
 nd_dnm.6.d: "Держава выкована, и выбор при основании сделан. Отсюда дорога длинна: столетия своего правления династия потратит на то, чтобы оправдать избранное при основании. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.d.hun: "Держава выкована, и выковала её корона святого Стефана. Старейшая из трёх корон, та, чья Золотая булла научила своё дворянство праву сопротивления, собрала Австрию и Богемию под собственные установления. Дорога впереди длинна, и венгерские сеймы будут ждать, что их спросят на каждом её шагу. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.d.boh: "Держава выкована, и выковала её корона святого Вацлава. Богемия вынесла своё курфюршеское достоинство из Рейха, чтобы построить на Дунае нечто большее, и покинутая ею коллегия из-за этого недосчиталась голоса. Дорога впереди длинна. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.a: "Да начнётся работа"
 nd_dnm.7.t: "Граница восстановлена"
