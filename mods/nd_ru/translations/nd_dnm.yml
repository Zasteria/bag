 action_nd_dnm_petition_estate_loyalty_desc: "Магната одной из возвращённых корон можно склонить на свою сторону за достойную сумму, а он приведёт за собой соседей. Кошелёк династии — цена публичного ответа на вопрос о наследовании."
 nd_dnm_undertake_sanction_tour: "Объехать земли ради санкции"
 nd_dnm_undertake_sanction_tour_desc: "Государь покидает Вену и лично объезжает коронные земли: Прага, Пресбург, Буда, — представляя дело династии сеймам и магнатам лицом к лицу. Странствующий двор дорог, но такой символ ничем не заменить."
 action_nd_dnm_undertake_sanction_tour: "Объехать земли ради санкции"
 action_nd_dnm_undertake_sanction_tour_desc: "Государь покидает Вену и лично объезжает коронные земли: Прага, Пресбург, Буда, — представляя дело династии сеймам и магнатам лицом к лицу. Странствующий двор дорог, но такой символ ничем не заменить."
 nd_dnm_seek_foreign_recognition: "Добиваться признания за рубежом"
 nd_dnm_seek_foreign_recognition_desc: "Санкцию признают за границей, если дипломатические уступки будут достаточно велики. Признание хотя бы одной великой державы лишает коалицию уверенности, но династия, торгующаяся за законность, платит за это своим весом."
 action_nd_dnm_seek_foreign_recognition: "Добиваться признания за рубежом"
 action_nd_dnm_seek_foreign_recognition_desc: "Санкцию признают за границей, если дипломатические уступки будут достаточно велики. Признание хотя бы одной великой державы лишает коалицию уверенности, но династия, торгующаяся за законность, платит за это своим весом."
 nd_dnm_press_the_succession_claim: "Настаивать на праве наследования"
 nd_dnm_press_the_succession_claim_desc: "Корона объявляет — открыто и бесповоротно на этот срок, — что доведёт спор до конца. Объявление ничего не успокаивает, война тянется дальше, но при дворе никто больше не смеет заговорить об уступках."
 action_nd_dnm_press_the_succession_claim: "Настаивать на праве наследования"
 action_nd_dnm_press_the_succession_claim_desc: "Корона объявляет — открыто и бесповоротно на этот срок, — что доведёт спор до конца. Объявление ничего не успокаивает, война тянется дальше, но при дворе никто больше не смеет заговорить об уступках."
 nd_dnm_sue_for_succession_terms: "Просить условий по наследованию"
 action_nd_dnm_sue_for_succession_terms: "Просить условий по наследованию"
 nd_dnm_sue_for_succession_terms_desc: "Войну не выиграть, и корона предпочитает договариваться сейчас, пока ей ещё есть чем торговаться, чем позже принимать чужую волю. Исход скромнее победы и куда мягче краха."
 action_nd_dnm_sue_for_succession_terms_desc: "Войну не выиграть, и корона предпочитает договариваться сейчас, пока ей ещё есть чем торговаться, чем позже принимать чужую волю. Исход скромнее победы и куда мягче краха."
