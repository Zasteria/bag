l_russian:
 EDO: "Бенин"
 EDO_ADJ: "бенинский"
 EDO_f: "Королевство Бенин"
 EDO_f_desc: "Королевство Бенин было одним из самых могущественных и развитых государств доколониальной Западной Африки, средоточием народа эдо и города Бенин. Правимое обой, оно славилось централизованным управлением, грозным войском и необычайным придворным искусством — знаменитыми бенинскими бронзами. Правитель эдо, сплотивший коренные земли Бенина и низовья Нигера, способен вернуть королевству былое величие."
