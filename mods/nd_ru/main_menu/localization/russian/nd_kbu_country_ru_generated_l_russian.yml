l_russian:
 KBU: "Канем-Борну"
 KBU_ADJ: "канемский"
 KBU_f: "Канем-Борну"
 KBU_f_desc: "Империей Канем-Борну более семи столетий правила династия Сайфава: она господствовала в бассейне озера Чад и держала в руках важнейшие транссахарские торговые пути. Воссоединив исконные земли Канема с владениями Борну, империя вновь готова утвердить своё превосходство в центральном Сахеле."
