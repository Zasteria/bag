l_russian:
 NZO: "Наньчжао"
 NZO_ADJ: "наньчжаоский"
 NZO_f: "Наньчжао"
 NZO_f_desc: "Наньчжао — великое царство бай и и с центром у озера Эрхай в Юньнани, объединившее шесть чжао под одним престолом с 738 по 902 год. В пору расцвета оно соперничало с династией Тан, покорив южную Сычуань, западную Гуйчжоу и города-государства пью в верхней Бирме. Возрождённое Наньчжао вернёт себе эту многонациональную горную империю на перекрёстке Китая, Тибета и Юго-Восточной Азии."
