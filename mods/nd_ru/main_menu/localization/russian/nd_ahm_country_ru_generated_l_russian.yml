l_russian:
 AHM: "Ахом"
 AHM_ADJ: "ахомский"
 AHM_f: "Ахомское царство"
 AHM_f_desc: "Верните сваргадео власть над долиной Брахмапутры. Шесть столетий правления тай-ахомов удерживали этот угол Южной Азии против каждой волны завоевателей: Моголов отбрасывали семнадцать раз, а горы, долину и реку связывали воедино придворные хроники «Буранджи», трудовая повинность паик и вера, вплетавшая тайский анимизм в шиваитское и вишнуитское благочестие. Непокорённое царство Чарайдео возрождается."
