l_russian:
 DNM: "Дунайская монархия"
 DNM_ADJ: "дунайский"
 DNM_f: "Дунайская монархия"
 DNM_f_desc: "Дунайская монархия — государство, которое дом Габсбургов создаёт, когда Австрия, Богемия и Венгрия отвечают перед одним двором: та централизованная многонациональная монархия, к которой Габсбурги всегда тянулись и которой так и не удержали. Для императора Священной Римской империи германская гегемония и дунайское сверхгосударство всегда были в противоречии: государь, связанный имперским сеймом, курфюрстами и рейхстагом, не мог просто свести три короны в одну. Образование Дунайской монархии ставит это противоречие выбором. Остаться в Рейхе, как Габсбурги и делали три столетия, и править им с Дуная по имперскому праву, с рейхстагом, который утверждает вашу Санкцию, и с короной святого Стефана, попрекающей всякую связь с Империей. Или порвать с Рейхом, вывести имперские земли вместе с притязанием императора на них и заново учредить три короны как суверенную империю, подотчётную никакому сейму, кроме вашего собственного. Это не Австро-Венгрия, дуалистический компромисс, до которого история дошла лишь через век потрясений, а составная монархия в тот миг, когда она выбирает, чем ей быть."
