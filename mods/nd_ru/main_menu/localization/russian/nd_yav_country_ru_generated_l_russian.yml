l_russian:
 YAV: "Явана"
 YAV_ADJ: "яванский"
 YAV_f: "Империя Явана"
 YAV_f_desc: "Империя Явана — возрождение древних индогреческих царств, некогда цветших в землях Синда и Гандхары. Слово «явана», которым индийские источники называли греков и их потомков, вызывает в памяти необычайный греко-буддийский синтез, породивший одни из величайших произведений искусства и мысли субконтинента. Под властью саммитийского буддийского государя синдского происхождения это возрождение сплавляет эллинистические политические традиции с дхармической культурой долины Инда, возвращая наследие Менандра и Деметрия."
