l_russian:
 SOE: "Сонгай"
 SOE_ADJ: "сонгайский"
 SOE_f: "Империя Сонгай"
 SOE_f_desc: "Империя Сонгай была крупнейшим государством в истории Африки и господствовала на излучине Нигера и транссахарских торговых путях из своей столицы в Гао. При Сонни Али и Аскии Мухаммаде она вобрала в себя остатки Мали, держала легендарные города Томбукту и Дженне и стала средоточием исламской учёности. Возродить эту империю — значит вновь объединить Сахель под властью Сонгая."
