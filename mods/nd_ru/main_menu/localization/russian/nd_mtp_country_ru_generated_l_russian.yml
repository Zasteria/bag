l_russian:
 MTP_f: "Империя Мутапа"
 MTP_f_desc: "Царство Мутапа было основано Ньятсимбой Мутотой, когда каранга-шона двинулись от Большого Зимбабве на север, в долину Замбези, в поисках соли и новых земель. В пору расцвета Мутапа держала в руках торговлю золотом юго-восточной Африки, направляя богатства внутренних земель через Софалу к купцам суахилийского побережья. Возродить Мутапу — значит воссоединить исконные земли шона и вернуть себе власть над легендарными богатствами края."
