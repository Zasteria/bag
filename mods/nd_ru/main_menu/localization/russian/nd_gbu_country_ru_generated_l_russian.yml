l_russian:
 GBU: "Великая Бургундия"
 GBU_ADJ: "бургундский"
 GBU_f: "Великая Бургундия"
 GBU_f_desc: "Возрождённое Срединное королевство бургундов. Выкованная из полосы богатств, которую Филипп Добрый и Карл Смелый сварили в единое составное государство, Великая Бургундия соединяет фламандские города, валлонские марки, Лотарингию, Франш-Конте и герцогское ядро в суверенное королевство, не отвечающее ни Парижу, ни Империи. Корона, которой Карл добивался в Трире, наконец возлагается на бургундское чело, а рыцарским хребтом ей служит орден Золотого руна."
