l_russian:
 rule_nd_ai_formables_rule: "ИИ образует страны"
 setting_nd_ai_formables_off: "Выключено"
 setting_nd_ai_formables_off_desc: "Страны под управлением ИИ никогда сами не образуют новых стран: обычное поведение игры, где образование страны по сути доступно только игроку."
 setting_nd_ai_formables_opportunistic: "При случае"
 setting_nd_ai_formables_opportunistic_desc: "Страна под управлением ИИ, уже отвечающая требованиям крупной образуемой страны, образует её: Испанию, Россию, Великобританию, Скандинавию, Могольскую империю, Дунайскую монархию, Германию, Италию или Нидерланды. Военное поведение ИИ не меняется. Это лишь позволяет ИИ взять то, что он уже заслужил."
 setting_nd_ai_formables_ambitious: "Честолюбиво"
 setting_nd_ai_formables_ambitious_desc: "Как «При случае», и вдобавок страна под управлением ИИ, всерьёз идущая к Испании, России, Великобритании, Скандинавии или Могольской империи, будет намеренно предпочитать войны против стран, владеющих недостающими ей землями. Делает мир жёстче и подвижнее."
