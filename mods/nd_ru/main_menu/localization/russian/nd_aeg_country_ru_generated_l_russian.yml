l_russian:
 AEG: "Эгиптус"
 AEG_ADJ: "эгиптский"
 AEG_f: "Эгиптус"
 AEG_f_desc: "Выкуйте возрождённую империю Нила, соединив мамлюкскую военную легитимность с фараоновской династической преемственностью, на которую притязали султаны Каира. Эгиптус связывает Нижний и Верхний Нил, Левант, Хиджаз, Нубию и Киренаику под идеологией султана-фараона, ведущей свою линию от Мемфиса через Вавилон Египетский к цитадели Салах ад-Дина. От Кирены до Мекки и Хартума размах Нового царства возрождается под знаменем исламского фараона."
