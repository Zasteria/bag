l_russian:
 OUT: "Утремер"
 OUT_ADJ: "утремерский"
 OUT_f: "Утремер"
 OUT_f_desc: "Одна латинская корона от Нила до Тигра, от Кипра до устья Красного моря: крестовый поход, каким его только и мечтали видеть. Провозгласить его может любая католическая держава, донёсшая это дело до Востока, — через Иерусалим, Латинскую империю, крестоносную Африку или суверенный военный орден, — но лишь пока католики остаются меньшинством среди её собственных подданных. Утремер не столько завоевание, сколько постоянная задача управления: франкская правящая каста замков, портов и паломничьих дорог, поставленная над мусульманскими, восточнохристианскими, иудейскими и самаритянскими общинами, которые сохраняют своих старейшин, свои суды и свою веру, и которых облагают податью, а не обращают."
