l_russian:
 PNT: "Пинтадос"
 PNT_ADJ: "пинтадосский"
 PNT_f: "Конфедерация Пинтадос"
 PNT_f_desc: "Когда воины-аристократы Паная, Себу, Самара, Лейте, Бохоля и Негроса отложат распри и объединятся, расписанные люди островов поднимутся как единая цивилизация. Связанные тушью своих сплошных татуировок, молитвами жриц-бабайлан и длинными корпусами балангаев, что несут их набеговые флотилии по внутренним морям, дату складывают свою честь под одно союзное знамя: Кабисайян, Пинтадос, легендарные расписанные. Испанцы, давшие им это имя, найдут не разрозненные вождества, которые можно растащить поодиночке, а морскую воинскую нацию, спаянную общей кровью всех висайских островов."
