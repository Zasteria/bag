l_russian:
 GOT: "Готия"
 GOT_ADJ: "вестготский"
 GOT_f: "Королевство готов"
 GOT_f_desc: "Короли Астурии, Леона и Кастилии никогда не говорили, что завоёвывают Иберию. Они утверждали, что восстанавливают её, считая себя законными наследниками готских королей Толедо, — и именно этот довод о преемстве сделал Реконкисту делом права, а не аппетита. Кастильская или леонская корона, вернувшая себе полуостров, взявшая Гранаду и перешагнувшая Пиренеи до Нарбона, может перестать называть это отвоеванием и просто довести дело до конца: Толедо восстановлен как королевский город, «Книга приговоров» вновь издана как закон всего государства, а Септимания снова готская. Это более древняя и более странная замена Испании: корона, стоящая на церковных соборах, писаном кодексе и готском преемстве, а не на браке двух династий."
