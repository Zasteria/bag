l_russian:
 CPT: "Коптский Египет"
 CPT_ADJ: "коптский"
 CPT_f: "Коптский Египет"
 CPT_f_desc: "Образуется миафизитским государством, правящим Нилом из Каира, где коптские писцы и финансисты веками вели податные книги Египта. Окно было узким и закрывалось: погромы и волны разрушения церквей 1301 и 1321 годов оставались свежей памятью в 1337-м, а обращение из коптской церкви после этого лишь ускорилось. Поэтому Коптский Египет надо было брать во время мамлюкского развала, последовавшего за смертью ан-Насира Мухаммада в 1341 году, опираясь на податную бюрократию, монастыри Вади-эн-Натрун, христианские царства Нубии выше по течению и болота Дельты, некогда укрывавшие башмурские восстания."
