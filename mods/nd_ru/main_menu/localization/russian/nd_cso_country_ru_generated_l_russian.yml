l_russian:
 CSO_f: "Сун"
 CSO_f_desc: "Династия Сун — это торговый и технологический золотой век Китая. Хотя Южная Сун потеряла северные равнины, отданные чжурчжэньской Цзинь, она выстроила непревзойдённую морскую торговую экономику с центром в дельте Янцзы и великом порту Ханчжоу. Возродить Сун — значит отказаться от континентальной империи ради компактной и богатой державы, живущей торговлей, изобретательством и морской мощью."
