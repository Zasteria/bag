l_russian:
 NIN: "Ассирия"
 NIN_ADJ: "ассирийский"
 NIN_f: "Ассирийская империя"
 NIN_f_desc: "Атур возрождённый. Там, где патриархат Востока и монашеские сети Тур-Абдина дают политическую преемственность, саргонидский имперский образец даёт форму: Ниневия как столица, постоянное профессиональное войско, арамейская гражданская служба и управление через переселение и включение, некогда связавшее Вавилон, Левант и Мемфис под одной короной. Вот как могла бы выглядеть Новоассирийская держава, если бы она уцелела через католикосат Селевкии-Ктесифона, — умозрительное возрождение вершины 671 года до н. э. при Асархаддоне и Ашшурбанипале, пропущенное через средневековые сирийские христианские установления и увенчанное в Ниневии."
