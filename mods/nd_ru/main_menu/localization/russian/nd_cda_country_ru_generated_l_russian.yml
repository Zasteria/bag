l_russian:
 CDA: "Каталония-Арагон"
 CDA_ADJ: "каталано-арагонский"
 CDA_f: "Арагонская империя"
 CDA_f_desc: "Выкуйте каталано-арагонскую средиземноморскую талассократию, что ненадолго связала Иберию с Италией под одним государем: путь объединения, оборвавшийся, когда Кастилия поглотила Арагон в 1469 году. Восстановите многокоронную личную унию Альфонсо V Великодушного, держа королевские престолы Барселоны, Неаполя и Палермо и правя Арагоном, Каталонией, Валенсией, Балеарами, Сардинией, Сицилией и Меццоджорно из странствующего двора. Морская торговая империя каталонских консульств, наёмников-альмогаваров, Consolat de Mar и королевской Сеньеры: тот Арагон, что смотрел за море на восток, а не на запад, к Кастилии."
