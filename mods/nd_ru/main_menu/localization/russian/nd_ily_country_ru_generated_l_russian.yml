l_russian:
 ILY: "Иллирия"
 ILY_ADJ: "иллирийский"
 ILY_f: "Иллирия"
 ILY_f_desc: "Хорватские и далматинские гуманисты, прелаты и городские патриции три столетия называли свой язык иллирийским, а себя иллирийцами, прежде чем это слово позаимствовал хоть один националист. Образуемая католической славянской державой, что собирает под одной короной далматинские коммуны, хорватские марки, Славонию и боснийское предгорье, Иллирия обращает эту учёную притязательность в государство: наследницу по усыновлению классического Иллирика, славянской литургии глаголическим письмом, дозволенной Римом епископам Адриатики, и иллирийских коллегий Рима и Лорето. Это восточная Адриатика, отвечающая сама себе, а не федерация всех южных славян."
