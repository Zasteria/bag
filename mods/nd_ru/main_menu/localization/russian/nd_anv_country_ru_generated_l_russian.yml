l_russian:
 ANV: "Анжу"
 ANV_ADJ: "анжуйский"
 ANV_f: "Анжуйская империя"
 ANV_f_desc: "Заново выкуйте державу Генриха II Плантагенета по обе стороны Ла-Манша, связав королевство Английское с герцогствами Нормандия и Аквитания и графством Анжу под одной короной. Католическое государство англо-нормандцев, французов, нормандцев и окситанцев, Анжуйская империя была крупнейшим владением Западной Европы XII века, и её восстановление подорвало бы самые основания нынешнего французского королевства."
