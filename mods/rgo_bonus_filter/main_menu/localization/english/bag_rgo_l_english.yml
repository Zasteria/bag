l_english:
 search_filter_bag_rgo_local_bonus_name: "Local Raw Materials"
 search_filter_bag_rgo_local_bonus_desc: "Only buildings that gain #P production efficiency#! from raw materials produced anywhere in this province — the ones marked with the shovel."
 search_filter_bag_rgo_local_bonus_here_name: "Local Raw Materials (This Location)"
