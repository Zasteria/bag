 search_filter_bag_rgo_build_local_bonus_name: "Local Raw Materials For This Building"
 search_filter_bag_rgo_build_local_bonus_desc: "Only locations where the chosen building gains #P production efficiency#! from raw materials in its province."
 search_filter_bag_rgo_build_local_bonus_here_name: "Local Raw Materials Here (This Location)"
 search_filter_bag_rgo_build_local_bonus_here_desc: "Stricter: only locations that work the raw materials themselves, rather than sharing a province with them."
 bag_rgo_name: "RGO Bonus Filter"
 bag_rgo_desc: "Adds building list filters for buildings that gain production efficiency from locally available raw materials."
