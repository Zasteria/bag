l_russian:
 bag_wtp2_name: "Где производить 2"
 bag_wtp2_desc: "Планировщик, собранный заново. Сейчас в нём работает только выбор земли: рамка на странице мода, точный выбор — на карте. Оба расчёта ещё не построены."
 bag_wtp2__zone_name: "Земля"
 bag_wtp2__plan_name: "Расчёты"
 bag_wtp2__tech_name: "Техническая"
 bag_wtp2__zone__continent_name: "Континент"
 bag_wtp2__continent_name: "Континент"
 bag_wtp2__continent_item_column_name: "Континент"
 bag_wtp2__continent__pick_name: "Взять"
 bag_wtp2__continent__pick_desc: "Где вообще смотреть. Это грубая рамка: точный выбор делается дальше, на карте.\n\nЕсли не отмечено ничего, рамка — весь мир."
 bag_wtp2__plan__open_name: "Открыть"
 bag_wtp2__plan_a_name: "План 1"
 bag_wtp2__plan_a_desc: "Открыть окно первого расчёта.\n\n#Y Что он считает, ещё не решено.#! Окно открывается, держит выбор земли и говорит, что расчёта нет."
 bag_wtp2__plan_a_text: "Открыть"
 bag_wtp2__plan_b_name: "План 2"
 bag_wtp2__plan_b_desc: "Открыть окно второго расчёта.\n\n#Y Что он считает, ещё не решено.#! Второе окно открывается вместо первого, а не рядом с ним: два окна с рядами стоят дороже, чем одно."
 bag_wtp2__plan_b_text: "Открыть"
 bag_wtp2__tech__tech_name: "Техническое"
 bag_wtp2__diag_name: "Диагностика"
 bag_wtp2__diag_desc: "Одно нажатие — всё, что мод знает, в #Y debug.log#!, заголовок ещё и в #Y error.log#!.\n\nСборка: #Y [Localize('bag_wtp2_build')]#!. Нажатий за эту игру: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_diag_runs')|0].\n\nНичего не меняет и не пересчитывает — нажимать можно в любой момент."
 bag_wtp2__diag_text: "Записать"
 bag_wtp2_plan_a_title: "План 1"
 bag_wtp2_plan_b_title: "План 2"
 bag_wtp2_plan_a_empty: "#Y Расчёта здесь пока нет.#!\n\nОкно существует, открывается своей кнопкой и держит выбор земли. Чем оно будет считать — решается отдельно.\n\nЗемля выбирается тут же: кнопки выше открывают карту, и клик по ней добавляет или убирает. Второе нажатие на ту же землю отменяет первое, так что «готово» — это просто закрыть панель."
 bag_wtp2_plan_b_empty: "#Y Расчёта здесь пока нет.#!\n\nВторое окно — второй вопрос к той же земле, а не другой вид первого. Земля у обоих окон одна и та же."
 bag_wtp2_ground_head: "Земля"
 bag_wtp2_ground_summary: "Выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_picked')|0] лок."
 bag_wtp2_ground_summary_tt: "Сколько локаций сейчас в выборе.\n\nРамка: континентов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_zone')|0], регионов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_region')|0] — отмечены на вкладке «Земля». Пусто в обоих значит весь мир.\n\nВыбор живёт до тех пор, пока его не очистят, и переживает сохранение."
 bag_wtp2_picker_hint: "Клик добавляет, повторный клик убирает. Панель закрывается после каждого выбора — это её собственное поведение, а не поломка."
 bag_wtp2_map_pick_area: "Область"
 bag_wtp2_map_pick_area_desc: "Выбрать на карте целую область — все её сухопутные локации разом."
 bag_wtp2_map_pick_province: "Провинция"
 bag_wtp2_map_pick_province_desc: "Выбрать на карте провинцию — все её сухопутные локации разом."
 bag_wtp2_map_pick_location: "Локация"
 bag_wtp2_map_pick_location_desc: "Выбрать на карте одну локацию."
 bag_wtp2_map_pick_market: "Рынок"
 bag_wtp2_map_pick_market_desc: "Выбрать на карте рынок — все его сухопутные локации разом. Предлагаются все рынки мира, а не только те, где вы присутствуете: соседский рынок — ровно то, что нужно тому, кто планирует завоевание."
 bag_wtp2_pick_my_land: "Моя земля"
 bag_wtp2_pick_my_land_tt: "Добавить в выбор всю землю, которой держава владеет — в пределах отмеченной рамки.\n\nОбычная кнопка, а не действие на карте: щёлкать не по чему, ответ уже известен."
 bag_wtp2_clear: "Очистить"
 bag_wtp2_clear_tt: "Убрать из выбора всё — и то, что сейчас не на экране.\n\n#Y Это важно:#! выбор, сделанный под одной рамкой, переживает смену рамки и молча расширил бы следующий расчёт."
 bag_wtp2_choose_location: "Выбрать локацию"
 bag_wtp2_choose_location_tt: "Добавить эту локацию в выбор или убрать её из него."
 bag_wtp2_choose_province: "Выбрать провинцию"
 bag_wtp2_choose_province_tt: "Добавить все сухопутные локации этой провинции или убрать их."
 bag_wtp2_choose_area: "Выбрать область"
 bag_wtp2_choose_area_tt: "Добавить все сухопутные локации этой области или убрать их."
 bag_wtp2_choose_market: "Выбрать рынок"
 bag_wtp2_choose_market_tt: "Добавить все сухопутные локации этого рынка или убрать их."
 bag_wtp2_no_markets: "Ни один рынок не попадает в отмеченную рамку."
 mapmode_bag_wtp2_selection_name: "Где производить 2"
 mapmode_bag_wtp2_selection_desc: "Ярким — выбранная земля, тусклым — то, из чего выбираете."
 bag_wtp2_map_picked_tt: "В выборе."
 bag_wtp2_map_browsable_tt: "Внутри рамки, но не выбрано."
 bag_wtp2_map_outside_tt: "Вне отмеченной рамки."
 bag_wtp2_map_legend_picked: "Выбрано"
 bag_wtp2_map_legend_browsable: "Внутри рамки"
 bag_wtp2__zone__region_europe_name: "Европа"
 bag_wtp2__region_europe_name: "Европа"
 bag_wtp2__region_europe_item_column_name: "Регион"
 bag_wtp2__region_europe__pick_name: "Взять"
 bag_wtp2__region_europe__pick_desc: "Держать этот регион в рамке. Регион — точная рамка, континент — грубая; отмечать можно и то и другое."
