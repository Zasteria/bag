 bag_wtp2_plan_a_title: "Plan — town rights"
 bag_wtp2_tr_now: "Current age"
 bag_wtp2_tr_now_tt: "#Y Score by what is available now.#!\n\nOnly methods whose building the country can already build, and which nothing has replaced yet.\n\nOnly the chosen ground, and only on this press."
 bag_wtp2_tr_end: "Last age"
 bag_wtp2_tr_end_tt: "#Y Score by how it ends.#!\n\nOnly methods whose building nothing replaces. Advances are not asked at all: a plan is a target, not an inventory.\n\nThe answer differs, and not slightly: along the ladder a good's #Y inputs#! move, not only its output."
 bag_wtp2_tr_summary: "Provinces: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_tr_show_rows')|0], locations: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_tr_show_locs')|0]"
 bag_wtp2_tr_summary_tt: "How many province definitions are listed and how many locations were scored.\n\nThe list holds the best two hundred; everything chosen is scored.\n\nPasses this game: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_tr_show_runs')|0]."
 bag_wtp2_tr_head_prov: "Province"
 bag_wtp2_tr_head_right: "Right"
 bag_wtp2_tr_head_pct: "Coverage"
 bag_wtp2_tr_right_cell: "[Location.Custom('bag_wtp2_tr_right_name')]"
 bag_wtp2_tr_pct_cell: "[GuiScope.SetRoot(Location.MakeScope).ScriptValue('bag_wtp2_tr_show_pct')|0]%"
 bag_wtp2_tr_pct_tt: "#Y How far this ground feeds what the right boosts.#!\n\n100% means the best recipe of each of the right's goods has every input an RGO could ever supply growing in this province.\n\nCounted over the #Y whole province definition#!: a raw material worked in any of its locations counts for all of them."
 bag_wtp2_tr_expand_mark: "+"
 bag_wtp2_tr_expand_tt: "Show this province's locations, or hide them."
 bag_wtp2_tr_empty: "Nothing scored yet.\n\nChoose ground with the buttons above, then press Current age or Last age."
 bag_wtp2_tr_map_tt: "The best town right for this location."
 bag_wtp2_tr_map_empty_tt: "No specialization right gives this location anything."
 mapmode_bag_wtp2_rights_name: "Town rights"
 mapmode_bag_wtp2_rights_desc: "Which specialization right suits a location best. Only what the last pass of the town-rights plan scored is painted."
