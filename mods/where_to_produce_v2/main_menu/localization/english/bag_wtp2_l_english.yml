l_english:
 bag_wtp2_name: "Where To Produce 2"
 bag_wtp2_desc: "A planner, rebuilt. Only the land picker works so far: the frame on this page, the exact choosing on the map. Neither plan is built yet."
 bag_wtp2__zone_name: "Land"
 bag_wtp2__plan_name: "Plans"
 bag_wtp2__tech_name: "Technical"
 bag_wtp2__zone__continent_name: "Continent"
 bag_wtp2__continent_name: "Continent"
 bag_wtp2__continent_item_column_name: "Continent"
 bag_wtp2__continent__pick_name: "Include"
 bag_wtp2__continent__pick_desc: "Where to look at all. This is the blunt frame: the exact choosing happens on the map.\n\nNothing ticked means the whole world."
 bag_wtp2__plan__open_name: "Open"
 bag_wtp2__plan_a_name: "Plan 1"
 bag_wtp2__plan_a_desc: "Open the first plan's window.\n\n#Y What it computes is not decided yet.#! The window opens, carries the land picker and says there is no pass."
 bag_wtp2__plan_a_text: "Open"
 bag_wtp2__plan_b_name: "Plan 2"
 bag_wtp2__plan_b_desc: "Open the second plan's window.\n\n#Y What it computes is not decided yet.#! It opens instead of the first rather than beside it: two windows of rows cost more than one."
 bag_wtp2__plan_b_text: "Open"
 bag_wtp2__tech__tech_name: "Technical"
 bag_wtp2__diag_name: "Diagnosis"
 bag_wtp2__diag_desc: "One press, everything the mod knows, into #Y debug.log#!, with the headline in #Y error.log#! besides.\n\nBuild: #Y [Localize('bag_wtp2_build')]#!. Presses this game: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_diag_runs')|0].\n\nChanges nothing and recomputes nothing — safe at any moment."
 bag_wtp2__diag_text: "Write"

 bag_wtp2_plan_b_title: "Plan 2"
 bag_wtp2_plan_a_empty: "#Y There is no pass here yet.#!\n\nThe window exists, opens from its own button and carries the land picker. What it will compute is decided separately.\n\nThe ground is chosen here: the buttons above open the map, and a click adds or removes. A second click on the same ground undoes the first, so «done» is simply closing the panel."
 bag_wtp2_plan_b_empty: "#Y There is no pass here yet.#!\n\nThe second window is a second question about the same ground, not another view of the first. Both windows share one selection."
 bag_wtp2_ground_head: "Land"
 bag_wtp2_ground_summary: "Chosen: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_picked')|0] loc."
 bag_wtp2_ground_summary_tt: "How many locations are in the selection.\n\nFrame: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_zone')|0] continents, [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp2_show_region')|0] regions, ticked on the Land tab. Neither means the whole world.\n\nThe selection lives until it is cleared and outlives a save."
 bag_wtp2_picker_hint: "A click adds, another click removes. The panel closes after each pick — that is its own behaviour, not a fault."
 bag_wtp2_map_pick_area: "Area"
 bag_wtp2_map_pick_area_desc: "Pick a whole area on the map — every land location of it at once."
 bag_wtp2_map_pick_province: "Province"
 bag_wtp2_map_pick_province_desc: "Pick a province on the map — every land location of it at once."
 bag_wtp2_map_pick_location: "Location"
 bag_wtp2_map_pick_location_desc: "Pick one location on the map."
 bag_wtp2_map_pick_market: "Market"
 bag_wtp2_map_pick_market_desc: "Pick a market on the map — every land location of it at once. Every market in the world is offered, not only the ones you are present in: the neighbour's market is exactly what somebody planning a conquest wants."
 bag_wtp2_pick_my_land: "My land"
 bag_wtp2_pick_my_land_tt: "Add every location the country owns, inside the ticked frame.\n\nA plain button rather than a map action: there is nothing to click, the answer is already known."
 bag_wtp2_clear: "Clear"
 bag_wtp2_clear_tt: "Remove everything from the selection, including what is not on screen.\n\n#Y This matters:#! a selection made under one frame outlives a change of frame and would quietly widen the next pass."
 bag_wtp2_choose_location: "Choose a location"
 bag_wtp2_choose_location_tt: "Add this location to the selection, or take it out."
 bag_wtp2_choose_province: "Choose a province"
 bag_wtp2_choose_province_tt: "Add every land location of this province, or take them out."
 bag_wtp2_choose_area: "Choose an area"
 bag_wtp2_choose_area_tt: "Add every land location of this area, or take them out."
 bag_wtp2_choose_market: "Choose a market"
 bag_wtp2_choose_market_tt: "Add every land location of this market, or take them out."
 bag_wtp2_no_markets: "No market falls inside the ticked frame."
 mapmode_bag_wtp2_selection_name: "Where To Produce 2"
 mapmode_bag_wtp2_selection_desc: "Bright is the chosen ground, dim is what you are choosing from."
 bag_wtp2_map_picked_tt: "In the selection."
