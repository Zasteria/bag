l_russian:
 bgt_name: "Цель по товарам"
 bgt_desc: "Достраивает производителей отмеченных товаров, пока строительство всего остального не станет настолько дешёвым, насколько позволяет игра. Дополнение к Construction Manager."
 bgt__main_name: "Цель по товарам"
 bgt__main__goal_name: "Желаемая скидка"
 bgt__target_discount_name: "Целевая скидка"
 bgt__target_discount_desc: "Насколько дешёвым должно стать строительство, прежде чем мод остановится; отрицательное число. Больше -33% движок не засчитывает, и то лишь когда товар составляет весь рецепт."
 bgt__log_readings_name: "Писать замеры в журнал"
 bgt__log_readings_desc: "Раз в месяц записывать отмеченные товары в журнал фреймворка.\n\nСейчас на рынке столицы:\n\n@lumber! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_lumber')|1]%\n@masonry! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_masonry')|1]%\n@glass! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_glass')|1]%\n@sand! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_sand')|1]%\n@stone! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_stone')|1]%"
 bgt__main__goods_name: "Товары"
 bgt__goods_item_column_name: "Товар"
 bgt__goods__build_name: "Строить"
 bgt__goods__build_desc: "Достраивать производителей этого товара, пока не будет достигнута целевая скидка, не считаясь с правилами прибыльности, которые иначе это остановят.\n\nПока ничего не строится: на этом шаге галочка только запоминается."
 bgt__goods__subsidise_name: "Субсидии"
 bgt__goods__subsidise_desc: "Держать производителей этого товара на субсидии, чтобы ушедшие в убыток вслед за ценой не теряли рабочих.\n\nПока ничего не субсидируется: на этом шаге галочка только запоминается."
 bgt_log_watching: "«Цель по товарам» следит за товарами:"
 bgt_log_good: "«Цель по товарам»: строит ради"
 bgt_log_subsidise: "«Цель по товарам»: субсидирует"
