l_russian:
 bgt_name: "Цель по товарам"
 bgt_desc: "Достраивает производителей отмеченных товаров, пока те не подешевеют до заданного. Дополнение к Construction Manager."
 bgt__main_name: "Цель по товарам"
 bgt__main__goal_name: "Состояние"
 bgt__log_readings_name: "Писать в журнал"
 bgt__log_readings_desc: "Раз в месяц называть отмеченные товары в журнале фреймворка.\n\nЧто мод успел сделать:\n\nМесячных проверок было: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_pulses')|0]\nОтмечено на постройку: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_watched')|0]\nОтмечено на субсидии: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_subsidised')|0]\n\nЭти три числа считает сама месячная проверка, то есть это галочки такими, какими их видит скрипт. Если первое так и осталось нулём после смены месяца, значит и всё остальное здесь не работает."
 bgt_log_pulse: "«Цель по товарам»: месячная проверка"
 bgt_log_good: "«Цель по товарам»: строит ради"
 bgt_log_subsidise: "«Цель по товарам»: субсидирует"
 bgt__main__construction_name: "Товары, которыми платят за стройку"
 bgt__construction_item_column_name: "Товар"
 bgt__construction__build_name: "Строить"
 bgt__construction__build_desc: "Достраивать производителей этого товара, пока не будет достигнута его цель, не считаясь с правилами прибыльности, которые иначе это остановят.\n\nПока ничего не строится: на этом шаге галочка только запоминается."
 bgt__construction__subsidise_name: "Субсидии"
 bgt__construction__subsidise_desc: "Держать производителей этого товара на субсидии, чтобы ушедшие в убыток вслед за ценой не теряли рабочих.\n\nПока ничего не субсидируется: на этом шаге галочка только запоминается."
 bgt__construction__target_name: "Цель"
 bgt__construction__target_desc: "Насколько ниже обычной цены нужно опустить этот товар, в процентах.\n\nЧисло рядом с товаром — где он сейчас. Для товаров, которыми оплачивается стройка, это ещё и скидка на строительство; для остальных — только цена.\n\nБольше -33% движок не засчитывает, и то лишь там, где товар составляет весь рецепт."
 bgt__main__other_name: "Остальные товары"
 bgt__other_item_column_name: "Товар"
 bgt__other__build_name: "Строить"
 bgt__other__build_desc: "Достраивать производителей этого товара, пока не будет достигнута его цель, не считаясь с правилами прибыльности, которые иначе это остановят.\n\nПока ничего не строится: на этом шаге галочка только запоминается."
 bgt__other__subsidise_name: "Субсидии"
 bgt__other__subsidise_desc: "Держать производителей этого товара на субсидии, чтобы ушедшие в убыток вслед за ценой не теряли рабочих.\n\nПока ничего не субсидируется: на этом шаге галочка только запоминается."
 bgt__other__target_name: "Цель"
 bgt__other__target_desc: "Насколько ниже обычной цены нужно опустить этот товар, в процентах.\n\nЧисло рядом с товаром — где он сейчас. Для товаров, которыми оплачивается стройка, это ещё и скидка на строительство; для остальных — только цена.\n\nБольше -33% движок не засчитывает, и то лишь там, где товар составляет весь рецепт."
