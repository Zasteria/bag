l_english:
 bgt_name: "Goods Target"
 bgt_desc: "Keeps building the producers of the goods you tick until construction of everything else is as cheap as the game will allow. An addon to Construction Manager."
 bgt__main_name: "Goods Target"
 bgt__main__goal_name: "Discount Goal"
 bgt__target_discount_name: "Target discount"
 bgt__target_discount_desc: "How cheap construction should get before this stops building, as a negative percentage. The engine credits at most -33%, and only where the good in question is the whole recipe."
 bgt__log_readings_name: "Write readings to the log"
 bgt__log_readings_desc: "Once a month, put the ticked goods in the framework's log.\n\nRight now, in your capital's market:\n\n@lumber! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_lumber')|1]%\n@masonry! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_masonry')|1]%\n@glass! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_glass')|1]%\n@sand! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_sand')|1]%\n@stone! [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_impact_stone')|1]%"
 bgt__main__goods_name: "Goods"
 bgt__goods_item_column_name: "Good"
 bgt__goods__build_name: "Build"
 bgt__goods__build_desc: "Keep building this good's producers until the target discount is reached, ignoring the profitability rules that would otherwise stop it.\n\nNothing is built yet: this step only records the tick."
 bgt__goods__subsidise_name: "Subsidise"
 bgt__goods__subsidise_desc: "Keep this good's producers subsidised, so the ones that fall into loss as the price drops do not lose their workers.\n\nNothing is subsidised yet: this step only records the tick."
 bgt_log_watching: "Goods Target is watching goods:"
 bgt_log_good: "Goods Target: building for"
 bgt_log_subsidise: "Goods Target: subsidising"
