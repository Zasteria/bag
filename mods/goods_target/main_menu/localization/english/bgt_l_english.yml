l_english:
 bgt_name: "Goods Target"
 bgt_desc: "Keeps building the producers of the goods you tick until they are as cheap as you asked. An addon to Construction Manager."
 bgt__main_name: "Goods Target"
 bgt__main__goal_name: "Status"
 bgt__log_readings_name: "Write to the log"
 bgt__log_readings_desc: "Once a month, name the ticked goods in the framework's log.\n\nWhat the mod has actually done so far:\n\nMonthly checks seen: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_pulses')|0]\nGoods ticked to build: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_watched')|0]\nGoods ticked to subsidise: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bgt_subsidised')|0]\n\nThose three are counted by the monthly check itself, so they are the ticks as the script sees them. If the first stays at zero after a month has passed, nothing else here is running either."
 bgt_log_pulse: "Goods Target: monthly check"
 bgt_log_good: "Goods Target: building for"
 bgt_log_subsidise: "Goods Target: subsidising"
 bgt__main__construction_name: "Goods Construction Is Paid In"
 bgt__construction_item_column_name: "Good"
 bgt__construction__build_name: "Build"
 bgt__construction__build_desc: "Keep building this good's producers until its target is reached, ignoring the profitability rules that would otherwise stop it.\n\nNothing is built yet: this step only records the tick."
 bgt__construction__subsidise_name: "Subsidise"
 bgt__construction__subsidise_desc: "Keep this good's producers subsidised, so the ones that fall into loss as the price drops do not lose their workers.\n\nNothing is subsidised yet: this step only records the tick."
 bgt__construction__target_name: "Target"
 bgt__construction__target_desc: "How far below its default price this good should be driven, as a percentage.\n\nThe figure beside each good is where it stands now. For the goods construction is charged in, that figure is also the discount it earns on building; for the rest it is only the price.\n\nThe engine credits at most -33%, and a single good reaches that only where it is the whole recipe."
 bgt__main__other_name: "Other Goods"
 bgt__other_item_column_name: "Good"
 bgt__other__build_name: "Build"
 bgt__other__build_desc: "Keep building this good's producers until its target is reached, ignoring the profitability rules that would otherwise stop it.\n\nNothing is built yet: this step only records the tick."
 bgt__other__subsidise_name: "Subsidise"
 bgt__other__subsidise_desc: "Keep this good's producers subsidised, so the ones that fall into loss as the price drops do not lose their workers.\n\nNothing is subsidised yet: this step only records the tick."
