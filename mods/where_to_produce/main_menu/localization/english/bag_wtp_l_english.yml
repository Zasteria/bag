l_english:
 bag_wtp_name: "Where To Produce"
 bag_wtp_desc: "A planning tool. Tick the regions you are planning for, pick a building and the production method you mean to run it on, and read off which locations inside those borders the raw materials favour."

 bag_wtp__plan_name: "Planning"

 # The group headers each list and setting sits under. A list is filed under a
 # group named after itself, so these are not duplicates of the setting names.
 bag_wtp__plan__what_name: "Building and Method"
 bag_wtp__plan__zone_africa_name: "Africa"
 bag_wtp__plan__zone_america_name: "America"
 bag_wtp__plan__zone_asia_name: "Asia"
