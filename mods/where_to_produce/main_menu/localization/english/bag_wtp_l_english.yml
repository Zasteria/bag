 bag_wtp_right_method_2: "[Location.MakeScope.GetVariable('bag_wtp_r_bt_2').GetBuildingType.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_bt_2').GetBuildingType.GetName]: [Location.MakeScope.GetVariable('bag_wtp_r_pm_2').GetProductionMethod.GetName]  ×[Location.MakeScope.GetVariable('bag_wtp_r_out_2').GetValue|2]"
 bag_wtp_right_goods_count_2: "[GetDataModelSize(Location.MakeScope.GetList('bag_wtp_r_goods_2'))]/[Location.MakeScope.GetVariable('bag_wtp_r_goods_all_2').GetValue|0]"
