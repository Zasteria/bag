 bag_wtp__show_name: "Show the best ground for one good or right"
 bag_wtp__show_text: "Open"
 bag_wtp__show_desc: "Opens the ranking window: the good or the urban right is picked there, on a circle of its own, and so are «now» / «end of game» and the buildable filter. «Find locations» in the window runs the pass.\n\nOne row per province, naming the building and which of its methods won, with the raw materials the bonus is made of beside it. A row opens into the province's locations."

 bag_wtp_right_window_title: "Where to produce — urban rights"
 bag_wtp_right_window_empty: "Nothing here. Tick an urban right above, choose some ground and press «Find locations».\n\nIf you have: nowhere in this ground can make anything the right favours."
 bag_wtp_right_head_total: "Worth"
 bag_wtp_right_head_good: "Good"
 bag_wtp_right_total_value: "[Location.MakeScope.GetVariable('bag_wtp_r_value').GetValue|2]"
 bag_wtp_right_total_tt: "What one level of every building in this right's bundle would earn here: for each good, the best method available to you, times what that good sells for, times the bonus that method earns from the province's raw materials, times the right's own percentage.\n\nIt is a price and not a count on purpose. Four books a level and a third of a masonry a level are not comparable, and ranking on the count alone is the same mistake as putting a forest village above a weapon guild.\n\nThe right's percentage is in the number but changes no order — it is the same percentage everywhere. What separates these provinces is the bundle: a province can supply lumber and not dyes."
 bag_wtp_right_good_1: "[Location.MakeScope.GetVariable('bag_wtp_r_good_1').GetGoods.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_good_1').GetGoods.GetName]"
 bag_wtp_right_bonus_1: "[Location.MakeScope.GetVariable('bag_wtp_r_bonus_1').GetValue|2]%"
 bag_wtp_right_method_1: "[Location.MakeScope.GetVariable('bag_wtp_r_bt_1').GetBuildingType.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_bt_1').GetBuildingType.GetName]: [Location.MakeScope.GetVariable('bag_wtp_r_pm_1').GetProductionMethod.GetName]  ×[Location.MakeScope.GetVariable('bag_wtp_r_out_1').GetValue|2]"
 bag_wtp_right_goods_count_1: "[GetDataModelSize(Location.MakeScope.GetList('bag_wtp_r_goods_1'))]/[Location.MakeScope.GetVariable('bag_wtp_r_goods_all_1').GetValue|0]"
 bag_wtp_right_good_2: "[Location.MakeScope.GetVariable('bag_wtp_r_good_2').GetGoods.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_good_2').GetGoods.GetName]"
