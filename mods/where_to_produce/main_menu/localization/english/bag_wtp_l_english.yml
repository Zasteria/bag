 bag_wtp_result_head_expand: "+"
 bag_wtp_result_head_rank: "#"
 bag_wtp_result_head_province: "Province"
 bag_wtp_result_head_area: "Area"
 bag_wtp_result_head_bonus: "Now"
 bag_wtp_result_head_bonus_tt: "The production efficiency this method gains from local raw materials, for the best building you could put up today.\n\nThe game computes it as 10% × (the method's inputs this province supplies) ÷ (all of the method's inputs). Everything counts towards the denominator, including inputs no mine or farm can ever supply — tools, for one — which is why some methods top out well below ten percent.\n\nIt is counted over the whole province. While a border cuts it the game scores your half alone and today's figure is lower; this is the figure you get once the province is yours."
 bag_wtp_result_head_end: "At the end"
 bag_wtp_result_head_mid: "On the way"
 bag_wtp_result_head_mid_tt: "The best this ground ever feeds — in any age, whether the building is unlocked for you or not — and the last age it can still be built in.\n\nThis is the column that decides a plan when «At the end» is 0.00% everywhere. Fine cloth is the case: from wool it stops at the workshop, because the manufactory and the mill take only silk or cloth. A wool province is then ten percent until the fifth age and nothing after it, and «5» is what that says.\n\n«Calculate for the end of the game» orders the table by «At the end» and breaks its ties on this column, so the first row is the province that ends best and, of those, does best on the way there."
 bag_wtp_result_head_method: "Building and method (× per level)"
 bag_wtp_result_head_goods: "Made of"

 bag_wtp_result_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_rank').GetValue|0]"
 bag_wtp_result_rank_tt: "Where this province came in the ranking. Rank 1 is the best effective output the pass found.\n\nIt is printed rather than left to the row's position because the two are not the same promise: the ranking is done in script and the window draws the list in whatever order it holds. If these numbers do not run 1, 2, 3 down the window, it is the list that is out of order and not the ranking.\n\nWhat the ranking sorted on here: [Location.MakeScope.GetVariable('bag_wtp_best').GetValue|2] — the method's output per level times a thousand, with the bonus applied. The same figure for the last age is [Location.MakeScope.GetVariable('bag_wtp_end_best').GetValue|2], and clicking the «At the end» header is what makes the ranking obey that one instead. If two rows are out of order and these two numbers say they should not be, the sort is the fault and not the copy."
 bag_wtp_result_pass_summary: "Walked [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] · found [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0] · re-ranked [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_live')|0]×"
 bag_wtp_result_pass_tt: "What the last pass did: how many locations it walked, how many provinces it found a row for, and how many times a pick has re-ranked the table since the game loaded.\n\nThe third number is the one to watch after choosing on the map. If it does not go up, the pick never reached the pass and the table below is the answer to an older question."
 bag_wtp_result_province_tt: "The whole province, both sides of whatever border cuts it today. You build in one of its locations — open the row."
 bag_wtp_result_bonus_tt: "The production efficiency this method gains from local raw materials.\n\nThe game computes it as 10% × (the method's inputs this province supplies) ÷ (all of the method's inputs). Everything counts towards the denominator, including inputs no mine or farm can ever supply — tools, for one — which is why some methods top out well below ten percent.\n\nIt is counted over the whole province. While a border cuts it the game scores your half alone and today's figure is lower; this is the figure you get once the province is yours."
 bag_wtp_result_method_tt: "The building, the production method that turned out best here among those available to you now, and «×», what it produces per building level.\n\nThe upper line is the built-up buildings, the lower one the villages. They are scored apart on purpose: a village wants one raw material and so reaches 10% easily, but it produces a fifth as much, and in one list it buried the guilds.\n\nThe ranking is by output with the bonus applied — by what the method would really give here."
 bag_wtp_result_goods_tt: "The raw materials this province supplies to the method — what the bonus is made of.\n\nThe figure on the left is how many of the method's raw inputs the province supplies, out of how many it could. Whatever is missing the province does not produce anywhere, and the bonus falls short of the method's ceiling by exactly that share."
 bag_wtp_result_expand_tt: "Show the province's locations."
 bag_wtp_result_head_end_tt: "What the same province would give once every advance is in — the best of the methods nothing makes obsolete.\n\nThe game's own ladder is guild → workshop → manufactory → mill, and along it the recipe's inputs move, not merely its output. Bronze cannons want copper and tin; the cannon factory that replaces them wants lead and saltpetre. Paper starts on cloth and ends on pure lumber. Fourteen of the forty-two goods shift their inputs along the ladder and five change them outright — and for those the province that suits the guild is not the province that suits the mill.\n\n0.00% is an answer too, and a common one: it means no recipe that survives to the last age can be fed from this ground. Fine cloth from wool is the example — the manufactory and the mill take only silk or cloth, so a wool province simply stops having a fine cloth answer once the workshop is obsolete."
 bag_wtp_result_end_tt: "What this province gives in the last age: [Location.MakeScope.GetVariable('bag_wtp_end_bt').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out').GetValue|2] per level, at [Location.MakeScope.GetVariable('bag_wtp_end_bonus').GetValue|2]% — made of [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods'))] of the [Location.MakeScope.GetVariable('bag_wtp_end_goods_all').GetValue|0] raw materials it wants.\n\nThis building is not gated on your ages here: it is what will stand once nothing obsoletes it. The column to its left is what you could build now.\n\nAt 0.00% the ground supplies nothing this recipe wants — it would run on imports, and the game would more likely run another recipe."
 bag_wtp_result_end_tt_rural: "What this village ground gives in the last age: [Location.MakeScope.GetVariable('bag_wtp_end_bt_rural').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm_rural').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out_rural').GetValue|2] per level, at [Location.MakeScope.GetVariable('bag_wtp_end_bonus_rural').GetValue|2]% — made of [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods_rural'))] of the [Location.MakeScope.GetVariable('bag_wtp_end_goods_all_rural').GetValue|0] raw materials it wants.\n\nUsually empty: a village is obsoleted by nothing, so the answer it gives now is the answer it gives at the end."
 bag_wtp_result_collapse_tt: "Hide the province's locations."


 bag_wtp_log_run: "Where To Produce: ranked the locations"

 bag_wtp_select_summary: "Chosen: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] location(s) in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] province(s)"
 bag_wtp_picker_hint: "A click toggles. The panel closes after each pick -- that is how the game builds it, not a fault. The results window behind it re-ranks itself after every one."

 bag_wtp_map_pick_area: "Choose an area"
 bag_wtp_map_pick_area_desc: "The area picker: a searchable list and a click on the map. Clicking toggles — the area goes into the plan or comes out of it."
 bag_wtp_map_pick_province: "Choose a province"
 bag_wtp_map_pick_province_desc: "The same, one province at a time. A click toggles all of its land locations at once."
 bag_wtp_map_pick_location: "Choose a location"
 bag_wtp_map_pick_location_desc: "The same, one location at a time, for trimming the edges of a plan drawn in areas."
 bag_wtp_map_pick_market: "Choose a market"
