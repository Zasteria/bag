 bag_wtp_right_method_1: "[Location.MakeScope.GetVariable('bag_wtp_r_bt_1').GetBuildingType.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_bt_1').GetBuildingType.GetName]: [Location.MakeScope.GetVariable('bag_wtp_r_pm_1').GetProductionMethod.GetName]  ×[Location.MakeScope.GetVariable('bag_wtp_r_out_1').GetValue|2]"
 bag_wtp_right_goods_count_1: "[GetDataModelSize(Location.MakeScope.GetList('bag_wtp_r_goods_1'))]/[Location.MakeScope.GetVariable('bag_wtp_r_goods_all_1').GetValue|0]"
 bag_wtp_right_good_2: "[Location.MakeScope.GetVariable('bag_wtp_r_good_2').GetGoods.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_good_2').GetGoods.GetName]"
