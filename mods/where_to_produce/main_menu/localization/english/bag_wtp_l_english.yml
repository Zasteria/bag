 bag_wtp__result_name: "Best Locations"
 bag_wtp__result_item_column_name: "Location"
 bag_wtp__result_desc: "Locations inside the ticked regions, best first.\n\nThe figure is the production efficiency the chosen method would gain from raw materials, and the pair after it is how many of the materials that method wants the province supplies, out of how many it wants in all.\n\nThe game credits a raw material worked anywhere in the province, not only in the location itself, so every location of one province reads the same. The ceiling for this method is [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ceiling')|2]%, which is what a province supplying all of them would reach.\n\nThe table holds fifty rows and no more."

 bag_wtp_log_run: "Where To Produce: ranked the locations"

 bag_wtp_select_window_title: "Where To Produce — choosing the ground"
 bag_wtp_select_window_desc: "The provinces of the regions you ticked. Expand one to reach its locations, or take the whole province in at once.\n\nThe raw-material bonus is credited per province, so every location of one province scores the same — the choice between them is about building slots, which this version does not model."
 bag_wtp_select_summary: "Chosen: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] location(s) in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] province(s)"
 bag_wtp_add_location: "Add"
 bag_wtp_add_location_tt: "Take this location into the plan."
 bag_wtp_remove_location: "Remove"
 bag_wtp_remove_location_tt: "Take this location out of the plan."
 bag_wtp_toggle_province: "Whole province"
 bag_wtp_toggle_province_tt: "Take every location of this province in, or — if they are all in already — take them all out."
 bag_wtp_expand_tt: "Show this province's locations."
 bag_wtp_collapse_tt: "Hide this province's locations."
 bag_wtp_pick_all: "Take everything"
 bag_wtp_pick_all_tt: "Take every location of every province listed here into the plan."
 bag_wtp_clear_all: "Clear the choice"
 bag_wtp_clear_all_tt: "Empty the plan — everywhere, not only what is listed here, so a choice made under other regions cannot survive out of sight."
 bag_wtp_selection: "Where To Produce"
 bag_wtp_map_picked_tt: "Chosen for the plan."
 bag_wtp_map_browsable_tt: "Inside the ticked regions, not chosen."
 bag_wtp_map_outside_tt: "Outside the ticked regions."
 bag_wtp_map_legend_picked: "Chosen"
 bag_wtp_map_legend_browsable: "To choose from"

 bag_wtp_map_pick_area: "Choose areas on the map"
 bag_wtp_map_pick_area_desc: "Opens the game's own target picker for areas: a searchable list, the map highlighted, and a click on either picking the same thing.\n\nEvery click toggles — an area not in the plan goes in, one already in comes out — so keep clicking until the ground is right and then close the panel. There is nothing to save."
 bag_wtp_map_pick_province: "Choose provinces on the map"
 bag_wtp_map_pick_province_desc: "The same picker, one province at a time. Every click toggles the whole province's land locations."
 bag_wtp_map_pick_location: "Choose locations on the map"
 bag_wtp_map_pick_location_desc: "The same picker, one location at a time, for trimming the edges of a plan drawn in areas."
 bag_wtp_choose_area: "Choose an area"
 bag_wtp_choose_area_tt: "Click an area on the map or in the list. It goes into the plan, or comes out of it if it was already in."
 bag_wtp_choose_province: "Choose a province"
 bag_wtp_choose_province_tt: "Click a province on the map or in the list. Its land locations go into the plan, or come out of it if they were already in."
 bag_wtp_choose_location: "Choose a location"
 bag_wtp_choose_location_tt: "Click a location on the map or in the list. It goes into the plan, or comes out of it if it was already in."
 bag_wtp_picker_hint: "Clicking toggles, so pick as many as you like and close when the plan is right — nothing needs saving. Ticked regions narrow what is offered; with none ticked the whole world is."

 bag_wtp__plan__good_name: "1. What You Want Made"
 bag_wtp__good_name: "Good"
 bag_wtp__good_item_column_name: "Good"
 bag_wtp__good__pick_name: "This one"
 bag_wtp__good__pick_desc: "The good you want produced. Ticking one fills the list below with every way the game makes it.\n\nOnly one at a time — ticking another moves the tick."
 bag_wtp__plan__recipe_name: "2. Which Building, On Which Method"
 bag_wtp__recipe_name: "Building and method"
 bag_wtp__recipe_item_column_name: "Building — method"
 bag_wtp__recipe__pick_name: "This one"
 bag_wtp__recipe__pick_desc: "The building and the production method you mean to run it on. The rows are the ways the good above is made; picking one is what the ranking answers for.\n\nThe game's own build panel ranks by the best method a building could ever use. This ranks by the one you actually intend."
