 bag_wtp__plan__zone_oceania_name: "Oceania"
 bag_wtp__plan__zone_ocean_continent_name: "Atlantic and Pacific Islands"
 bag_wtp__plan__result_name: "Best Locations"

 bag_wtp__what_name: "Building and Method"
 bag_wtp__buildable_only_name: "Only where it can be built today"
 bag_wtp__buildable_only_desc: "Leave this off while planning for land you do not hold yet.\n\nThe game answers 'can this be built here' for the location as it stands, and an unowned location fails that question whatever its raw materials are. With this off the table ranks the ground itself, which is the point of planning ahead of a conquest.\n\nTurn it on once the land is yours and you want the list narrowed to what you could start today."
 bag_wtp__select_name: "Choose the locations"
 bag_wtp__select_text: "Choose"
 bag_wtp__select_desc: "Opens a window listing the provinces of the ticked regions, each one expandable into its locations, with every location in or out of the plan.\n\nYou do not have to. Left alone, the ranking answers for the whole of the ticked regions; this narrows it.\n\nWhat is chosen is also painted on the map: in the Geography map modes, pick \"Where To Produce\". Bright locations are chosen, dim ones are what you are choosing from.\n\nChosen now: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] location(s), out of [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] province(s) to choose from."
 bag_wtp__run_name: "Rank the locations"
 bag_wtp__run_text: "Rank"
 bag_wtp__run_desc: "Walk every location of every ticked region and fill the table below.\n\nWhat the last run saw:\n\nRegions ticked: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_regions')|0]\nLocations considered: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nRows filled: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0]\n\nThose three are counted by the pass itself. If the first stays at zero after ticking a region, nothing below it ran either."

