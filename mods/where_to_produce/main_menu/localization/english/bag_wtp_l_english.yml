 bag_wtp_result_window_title: "Where To Produce — results"
 bag_wtp_result_window_desc: "Provinces, best first. A row holds two answers: the best of the built-up buildings above, the best village below — and each of them in two ages, what you could build now and what the province gives once every advance is in. The ranking is by what a method actually produces — the percentage is an efficiency bonus and the «×» after the method is its output per level, and a village makes a fifth of what a workshop does at the same percentage.\n\nA province counts whole, even where a border cuts it today. Open a row for its locations, what each works, and who holds it."
 bag_wtp_result_window_empty: "Nothing here. Tick a good on the Goods tab, some ground on the Land tab, and press Rank.\n\nIf you have: nowhere in the chosen ground supplies a single raw material any of this good's recipes want, in either age. A recipe the ground cannot feed is not offered — it would be a row at 0.00%, and the game would run a different recipe anyway — so «nothing here» means the good belongs somewhere else."

