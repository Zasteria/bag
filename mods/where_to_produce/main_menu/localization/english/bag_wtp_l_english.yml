 bag_wtp_map_pick_market: "Choose a market"
 bag_wtp_map_pick_market_desc: "A whole market's land at once, from a list of the markets your country is in. A market is not drawn on the map, so this one has no map click. For a realm large enough to hold several markets, where each one wants its own balance of production."
 bag_wtp_choose_area: "Choose an area"
