 bag_wtp_right_method_3: "[Location.MakeScope.GetVariable('bag_wtp_r_bt_3').GetBuildingType.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_bt_3').GetBuildingType.GetName]: [Location.MakeScope.GetVariable('bag_wtp_r_pm_3').GetProductionMethod.GetName]  ×[Location.MakeScope.GetVariable('bag_wtp_r_out_3').GetValue|2]"
