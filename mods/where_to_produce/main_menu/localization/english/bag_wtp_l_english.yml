 bag_wtp__plan__plan_name: "4. The Whole Plan"
 bag_wtp__plan_cap_rural_name: "Goods per rural location"
 bag_wtp__plan_cap_rural_desc: "How many buildings the plan may put in one rural location.\n\nThe game has no building-slot count for a mod to read — a building's «max levels» is its own ladder, not a limit on how many buildings stand beside it — so this is your figure and not the game's. Choose it by what it buys: the plan button below prints the capacity of the chosen ground against the number of goods asking for room in it."
 bag_wtp__plan_cap_urban_name: "Goods per town or city"
 bag_wtp__plan_cap_urban_desc: "The same for everything that is not a rural settlement. A town holds more rows of houses than a village does, which is why it is a number of its own."
 bag_wtp__plan_max_name: "Cap: provinces one good may take"
 bag_wtp__plan_max_desc: "A ceiling on how far one good may spread, and off at 0, which is the default.\n\nThe plan fills the ground: it keeps handing provinces their next-best good until no list has room left, so no location it can feed is left empty. This is for the case where one good has spread further than you want and you would rather the ground went to the next thing in line."
 bag_wtp__plan_rights_name: "Plan the towns with urban rights"
 bag_wtp__plan_rights_desc: "On, and by default. An urban right favours two or three goods at once, which is exactly the shape of a town's list, so a right does not compete with goods for room — it takes a province's whole town list, and it takes it before any good is placed.\n\nWhich right a province gets is asked of the province rather than of the rights: there are twelve rights and rarely that many provinces, so letting them take turns would decide the outcome by turn order alone. Each town province gets the right its ground suits best, and the rights nothing here wanted go unused.\n\nOff: towns are planned out of single goods like the villages."
 bag_wtp__plan_run_name: "Plan the whole map"
 bag_wtp__plan_run_text: "Plan"
 bag_wtp__plan_run_desc: "Every good at once over the chosen ground, under the caps above.\n\nThis does not read the tick on the Goods tab: it plans all of them.\n\n**The plan is chosen per province and spent per location.** A province gets two short lists — one for its towns, one for its villages, each as long as that side's cap — and then every location of it builds its side's list entire. So a province reads as one answer, its villages repeat each other, and nothing the ground can feed is left empty.\n\nEach good is scored over the ground the way a single ranking scores one, then divided by its own best here — so a province worth 10% to one good and 5% to another, which are their ceilings, is a perfect fit for both and the plan compares them honestly. Where two goods want the same province, the better fit takes the slot and the other is served in the same round at its own next province.\n\nWhat the last plan did:\n\nLocations considered: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nRoom in them: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0]\nGoods this ground can make: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0]\nBuildings placed: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0]\nLocations used: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0]\n\nThose five are counted by the pass itself, and the first zero among them is the diagnosis.\n\nIt is the expensive button: a single ranking reads about five recipes on each location, this one reads every recipe in the game on each of them."
 bag_wtp__plan_show_name: "Show the plan"
 bag_wtp__plan_show_text: "Open"
 bag_wtp__plan_show_desc: "Opens the last plan in its own window: one row per location that got anything, the most crowded first, with the goods it was given.\n\nThe same answer is on the map — in the Economy map modes, pick «Where To Produce — plan»."

 bag_wtp_plan_window_title: "Where To Produce — the whole plan"
 bag_wtp_plan_window_desc: "Every good placed at once over the chosen ground. A row is a location, but the answer is a province's: each province picks a short list of goods for its towns and another for its villages, and every location of it builds its side's list. So the villages of one province repeat each other, and what separates them from the next province is the ground.\n\nProvinces come in the order of how much the plan put in each, with their locations together and the towns first. What a location already digs up is beside its name, because that is half of why the plan put what it put there."
 bag_wtp_plan_window_empty: "Nothing here. Choose some ground on the Land tab and press Plan.\n\nIf you have: nothing in the chosen ground can make anything at all — which for a whole region would mean the ground never reached the pass."
 bag_wtp_plan_head_rank: "#"
 bag_wtp_plan_head_location: "Location"
 bag_wtp_plan_head_province: "Province"
 bag_wtp_plan_head_area: "Area"
 bag_wtp_plan_head_load: "Built"
 bag_wtp_plan_head_rgo: "RGO"
 bag_wtp_plan_head_goods: "What the plan puts here"
 bag_wtp_plan_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_plan_rank').GetValue|0]"
 bag_wtp_plan_rank_tt: "The row's place in the table. Provinces come in the order of how much the plan put in each, and a province's locations stay together — its towns first, then its villages.\n\nIt is printed rather than left to the row's position because the two are not the same promise: the order is decided in script and the window draws the list in whatever order it holds."
 bag_wtp_plan_load_value: "[Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0]"
 bag_wtp_plan_load_tt: "How many buildings the plan puts in this location — the length of its province's list for this side, which is at most the cap you gave it: three for a rural settlement and four for a town, unless you changed them.\n\nShort of the cap means the ground could not feed enough different goods to fill the list, not that the plan gave up on it."
 bag_wtp_plan_province_tt: "The whole province, both sides of whatever border cuts it today. The bonus is counted over it, so a good is worth the same in every location of it — which is why the plan chooses per province and every location of it builds the same list."
 bag_wtp_plan_goods_tt: "What the plan would build here. Hover an icon for the good.\n\nIt is the province's list for this side of it — towns get the town list, villages the village one — so the other locations of this province of the same kind carry the same goods. Two locations of one province cannot always build the same thing; terrain and a building's own requirements are not asked yet."
 bag_wtp_plan_pass_summary: "Locations [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] (towns [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_towns')|0]) · provinces [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provn')|0] · room [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] · goods [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0] · list entries [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_lists')|0] · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] building(s) in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0] location(s) · caps [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_rural')|0]/[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_urban')|0] · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_sweeps')|0] round(s)"
 bag_wtp_plan_pass_tt: "What the last plan did, counted by the pass itself, and it is written to be read left to right: **the first zero is the diagnosis.**\n\nNo locations — the ground never reached the pass. No towns, or every location a town — the town/village test is the fault and nothing else can be. No provinces — the province walk is. No goods — nothing here can make anything. No list entries — the provinces were reached but no good was ever accepted into a list. Entries but no buildings — the lists were never spent on the locations.\n\n«Room» is every considered location's cap added up, which is also what a finished plan comes to. Buildings short of room means the ground could not feed enough different goods to fill every list, not that the plan stopped early.\n\n«Rounds» is how many sweeps over every good it took before nothing more could be added. It stops on its own.\n\nThe window draws at most 150 rows; «locations» is the whole count."
 bag_wtp_log_plan: "Where To Produce: planned the whole map"

 mapmode_bag_wtp_plan_name: "Where To Produce — plan"
 mapmode_bag_wtp_plan_desc: "Whether the plan filled each location or fell short. Green is filled to its cap, yellow and orange are short of it — the ground could not feed enough different goods to make up a list — and red is ground inside the plan that got nothing at all."
 bag_wtp_plan_map_built_tt: "The plan puts [Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0] building(s) here. Which ones is in the plan window."
 bag_wtp_plan_map_empty_tt: "In the plan's ground, and the plan put nothing here. Nothing this location could hold can be made from what its province works."
 bag_wtp_plan_map_outside_tt: "Outside the ground the plan was made for."
 bag_wtp_plan_map_water_tt: "Water."

 bag_wtp_plan_legend_full: "Filled to the cap"
 bag_wtp_plan_legend_part: "Short of the cap"
 bag_wtp_plan_legend_one: "One building only"
 bag_wtp_plan_legend_none: "Nothing here"
 bag_wtp_plan_rank_button_tt: "What the plan counts this location as, and a click changes it: town → village → back to the game's own rank.\n\nThe game's rank is only what is true today. A village you mean to raise is still a village to the game, and the mod cannot guess which of them you will raise — so this is where you tell it.\n\nNothing is re-planned on the click: a rank change moves a location between two lists that are decided per province, so press «План» again."
 bag_wtp_plan_forced_town: "§Yг§!"
 bag_wtp_plan_forced_rural: "§Yс§!"
 bag_wtp_plan_reselect_tt: "Choosing on the map does not redraw the plan. The pass reads every recipe in the game on every location, about fifty times what a single ranking costs, so a plan that redrew itself on every click would make the picker unusable.\n\nChoose the ground, then press «План» again."