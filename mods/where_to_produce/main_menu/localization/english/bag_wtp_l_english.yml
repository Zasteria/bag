 bag_wtp__plan__plan_name: "4. The Whole Plan"
 bag_wtp__plan_cap_rural_name: "Goods per rural location"
 bag_wtp__plan_cap_rural_desc: "How many buildings the plan may put in one rural location.\n\nThe game has no building-slot count for a mod to read — a building's «max levels» is its own ladder, not a limit on how many buildings stand beside it — so this is your figure and not the game's. Choose it by what it buys: the plan button below prints the capacity of the chosen ground against the number of goods asking for room in it."
 bag_wtp__plan_cap_urban_name: "Goods per town or city"
 bag_wtp__plan_cap_urban_desc: "The same for everything that is not a rural settlement. A town holds more rows of houses than a village does, which is why it is a number of its own."
 bag_wtp__plan_rights_name: "Plan the towns with urban rights"
 bag_wtp__plan_rights_desc: "On, and by default. An urban right favours two or three goods at once, which is exactly the shape of a town's list, so a right does not compete with goods for room — it takes the town's list first, ahead of any single good.\n\n**Every town gets one.** Not «if it fits»: a town is a town, so it has a right. It gets whichever right its ground suits best among those your country could grant at all and of which the town can make at least one good.\n\n**The bundle goes up as far as the ground allows.** A bundle good that cannot be built here — cannons without the advance, say — simply does not go up, and its slot falls to an ordinary good. A town is never left with empty slots.\n\nWhich right a town gets is asked of the town rather than of the rights: there are a dozen and usually more towns than that, so letting the rights take turns would decide the outcome by turn order alone. A right granted many times is worth less each time, so the rights spread over the ground instead of collapsing onto one charter.\n\nOff: towns are planned out of single goods like the villages."
 bag_wtp__plan_run_name: "Plan the whole map for now"
 bag_wtp__plan_run_text: "Plan"
 bag_wtp__plan_run_desc: "Every good at once over the chosen ground, under the caps above. This does not read the tick on the Goods tab: it plans all of them.\n\n**How it decides, in order.**\n\n1. Score every good in every location: the best method whose building may actually stand there, that the ground feeds, and that you could build — output times the bonus its raw materials earn.\n2. Divide each good by its own best in this ground, so a good that tops out at 5% compares fairly with one that tops out at 10%. Then divide again by how much of it this province already holds: every location of a province is worth exactly the same to a good, so without that a good takes its best province whole and the province's locations come out identical.\n3. Grant urban rights, in towns only, but to every town and always: a town takes the right its ground suits best and gets every building of its bundle. A right grants +20…50% output where the whole raw-material bonus is a 10% band, so it is the largest thing in a town. Where the bundle does not fit the cap, the town ends there and it shows.\n4. Work out the quota: the room left over, divided by the goods this ground can make, less the RGOs of that good already standing, and never below one. Then hand out the rest in rounds, scarce goods first: a good only a few locations can hold takes its place before a common one takes a second. Each good takes one location a round and stops at its quota; a last pass lifts the quota and fills what is still empty.\n5. A location holds one building of a type, so a good whose building is already standing there is not offered again — but the next location along may take the same building running another method.\n6. Rounds continue until one adds nothing anywhere, so nothing the ground can feed is left empty.\n\nWhat the last plan did:\n\nLocations considered: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nRoom in them: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0]\nGoods this ground can make: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0]\nUrban rights granted: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rightn')|0]\nBuildings placed: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0]\nLocations used: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0]\n\nThose are counted by the pass itself, and the first zero among them is the diagnosis."
 bag_wtp__plan_show_name: "Show the plan"
 bag_wtp__plan_show_text: "Open"
 bag_wtp__plan_show_desc: "Opens the last plan in its own window: one row per location that got anything, the most crowded first, with the goods it was given.\n\nThe same answer is on the map — in the Economy map modes, pick «Where To Produce — plan»."
 bag_wtp__edit_open_name: "Edit the plan"
 bag_wtp__edit_open_text: "Editor"
 bag_wtp__edit_open_desc: "Opens the plan editor in a window of its own: three save slots, the goods this ground can make as icons, and «+1» / «−1» beside each one you pick.\n\nEverything it does changes the plan that already exists, one building at a time. Nothing in it replans.\n\nBuildings in the working copy: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_saved')|0]"
 bag_wtp_edit_window_title: "Where To Produce — editing a plan"
 bag_wtp_edit_window_desc: "A plan already made, changed a building at a time. Pick a good below and press «+1»: one building of it goes into the location where that costs least, whatever stood there worst comes out, and nothing else on the map moves. «−1» does the reverse and gives the room to whichever good suits it best.\n\nA good's last building on the whole ground is never taken out, and neither is one belonging to the bundle of a charter granted in that town."
 bag_wtp_edit_slots_head: "Slots:"
 bag_wtp_edit_slot_tt: "A slot holds a whole plan — the goods on every location it touched, the load, the charter. Saving over one loses what was in it; there are three so that planning other ground need not."
 bag_wtp_edit_store: "Save"
 bag_wtp_edit_store_tt: "Puts the plan as it stands into this slot, and makes it the baseline «show changes» counts from."
 bag_wtp_edit_recall: "Load"
 bag_wtp_edit_recall_tt: "Puts this slot's plan back on the map in place of the one there now, and makes it the baseline. An empty slot does nothing.\n\nThe building each good uses is read off the location, so a slot saved before the ground was rescored comes back scored the way it is now."
 bag_wtp_edit_slot1_full: "Slot 1 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot1')|0] in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot1_locs')|0] loc."
 bag_wtp_edit_slot1_empty: "Slot 1 · empty"
 bag_wtp_edit_slot2_full: "Slot 2 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot2')|0] in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot2_locs')|0] loc."
 bag_wtp_edit_slot2_empty: "Slot 2 · empty"
 bag_wtp_edit_slot3_full: "Slot 3 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot3')|0] in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot3_locs')|0] loc."
 bag_wtp_edit_slot3_empty: "Slot 3 · empty"
 bag_wtp_edit_pool_head: "Goods this ground can make — [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_pooln')|0] of them:"
 bag_wtp_edit_pool_tt: "Only the goods some location of the chosen ground could actually produce are here. Every one of them has its «−1» and «+1» in place; nothing has to be clicked first."
 bag_wtp_edit_pool_empty: "Nothing here yet — make a plan first, and this fills with the goods that ground can produce."
 bag_wtp_edit_plus: "+1"
 bag_wtp_edit_plus_tt: "One more building of this good, in the location where it costs least. A free room costs nothing; a full one costs the gain of the building that comes out."
 bag_wtp_edit_minus: "−1"
 bag_wtp_edit_minus_tt: "One building of this good out — the one standing worst — and the room to whichever good suits it best."
 bag_wtp_edit_last_done: "Last press: done."
 bag_wtp_edit_last_empty: "Last press: the building is out, and nothing this ground makes can take the room it left."
 bag_wtp_edit_last_refill: "Last press: the good could not be placed, and nothing changed — the building that was making room for it went back."
 bag_wtp_edit_last_refused: "Last press: nothing changed — a rule refused it, or the good fits nowhere on this ground."
 bag_wtp_edit_last_lost: "Last press: the good never reached the effect — the button is wired wrong, not the rule."
 bag_wtp_edit_last_nowhere: "Last press: nowhere left — this good already stands in every location this ground can make it in."
 bag_wtp_edit_last_novictim: "Last press: there is room for it, but nothing there may be taken out — only last buildings and charter bundles stand beside it."
 bag_wtp_edit_last_lastone: "Last press: that is the good's last building on the whole ground, and the last one is never taken."
 bag_wtp_edit_last_allcharter: "Last press: every building of this good belongs to a charter's bundle, and those are never taken."
 bag_wtp_edit_last_tt: "«+1» does nothing when no location on this ground can hold the good and no building may be taken out for it. «−1» does nothing when the good is down to its last building, or when every one of them belongs to a charter's bundle."
 bag_wtp_edit_changes: "Show the changes"
 bag_wtp_edit_changes_tt: "Opens the list of every location where the plan now differs from the one that was saved, and nothing else. After one edit that is one line."
 bag_wtp_edit_no_plan: "No plan on the map. Press «Plan» on the mod page, or load a slot above."
 bag_wtp_edit_open_button: "Editor"
 bag_wtp_edit_open_tt: "Opens the editor in its own window: the slots, the goods as icons, «+1» and «−1»."
 bag_wtp_plan_save_head: "Save to:"
 bag_wtp_plan_save_slot1: "Slot 1"
 bag_wtp_plan_save_slot2: "Slot 2"
 bag_wtp_plan_save_slot3: "Slot 3"
 bag_wtp_chg_window_title: "Where To Produce — what the editing changed"
 bag_wtp_chg_window_empty: "Nothing has moved since the plan was saved."
 bag_wtp_chg_moved: "Locations changed: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_moved')|0]"
 bag_wtp_chg_moved_tt: "Counted against the saved plan. A plan just made is its own baseline, so this is zero until something is edited — and one «+1» should move one location or two, not the whole ground."
 bag_wtp_chg_head_out: "out:"
 bag_wtp_chg_head_in: "in:"
 bag_wtp_chg_out_tt: "What the saved plan had here and the plan now does not."
 bag_wtp_chg_in_tt: "What the plan now has here and the saved one did not."
 bag_wtp__plan_ticks_name: "Clear the town/village ticks"
 bag_wtp__plan_ticks_text: "Clear"
 bag_wtp__plan_ticks_desc: "Removes «count as a town» and «count as a village» from every location in the world at once.\n\nThe tick lives on the location and outlives a save, so clearing the rows you can see is not clearing them. Widen the ground and locations ticked earlier come into the plan and sort to the top as towns, which looks exactly as though the ticks came back on their own.\n\nCleared last time: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ticks')|0]\n\nIt starts no re-plan, and neither do the ticks themselves: the next «Re-plan» is the moment any of it becomes true."
 bag_wtp__diag_name: "Diagnostics"
 bag_wtp__diag_text: "Collect"
 bag_wtp__diag_desc: "Writes everything the mod knows about the last pass into the log, in one press and in plain text.\n\n«Plan» first, then this. It changes nothing: it only reads what the pass already parked on the locations.\n\nIt opens no window — the report is too long to read off a screen, and it is not for you but for the session. What the last collect saw is here:\n\nCollects since loading: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_runs')|0]\nLocations walked: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_locs')|0]  (towns among them: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_towns')|0])\nRoom left: in towns [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_freet')|0], in villages [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_freer')|0]\nBuildings placed: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] of [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] rooms\n\nIf «collects» rises and «locations walked» is zero, there was no plan: press «Plan» first.\n\nTo get the text out: mods.bat, «Забрать диагностику из игры», which pulls the last report and copies it to the clipboard. By hand: Documents/Paradox Interactive/Europa Universalis V/logs/debug.log\n\nThis is a temporary instrument. It comes out with the fault it finds."

 bag_wtp_plan_window_title: "Where To Produce — the whole plan"
 bag_wtp_plan_window_desc: "Every good placed at once over the chosen ground, one location at a time.\n\nEvery location of a province is worth the same to a good — the bonus is counted over the whole province — so a province the plan likes keeps coming back, and its locations come out looking alike. That is something that happens rather than something imposed: where the ground is tight the plan will vary them, and a market village in one location can make pottery while the next makes jewelry.\n\nProvinces come in the order of how much the plan put in each, with their locations together and the towns first."
 bag_wtp_plan_window_empty: "Nothing here. Choose some ground on the Land tab and press Plan.\n\nIf you have: nothing in the chosen ground can make anything at all — which for a whole region would mean the ground never reached the pass."
 bag_wtp_plan_head_rank: "#"
 bag_wtp_plan_head_location: "Location"
 bag_wtp_plan_head_province: "Province"
 bag_wtp_plan_head_area: "Area"
 bag_wtp_plan_head_load: "Built"
 bag_wtp_plan_head_rgo: "RGO"
 bag_wtp_plan_head_goods: "What the plan puts here"
 bag_wtp_plan_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_plan_rank').GetValue|0]"
 bag_wtp_plan_rank_tt: "The row's place in the table. Provinces come in the order of how much the plan put in each, and a province's locations stay together — its towns first, then its villages.\n\nIt is printed rather than left to the row's position because the two are not the same promise: the order is decided in script and the window draws the list in whatever order it holds."
 bag_wtp_plan_load_value: "[Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0]"
 bag_wtp_plan_load_tt: "How many buildings the plan puts in this location, at most the cap you gave it.\n\nShort of the cap means the ground could not feed enough **different buildings** that may stand here. That is stricter than different goods: a location holds one building of a type, so a place rich in one building's recipes still gets one entry out of them."
 bag_wtp_plan_province_tt: "The whole province, both sides of whatever border cuts it today. The bonus is counted over it, so a good is worth the same in every location of it — which is why the plan chooses per province and every location of it builds the same list."
 bag_wtp_plan_goods_tt: "What the plan would build here: the good on top, and under it the building that would make it. Hover either for its name.\n\n**One entry is one building.** A location holds one building of a type and a building runs one production method, so two goods off the same building cannot both be built here — though the next location along may take that building running the other method.\n\n**And every building here can actually stand here.** The plan asks the game's own «can this be built in this location» for each: its terrain, its rank and whatever else it requires."
 bag_wtp_plan_pass_summary: "Locations [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] (towns [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_towns')|0]) · provinces [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provn')|0] · room [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] · goods [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0] · quota [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_quota')|0] · rights [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rightn')|0] · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] building(s) in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0] location(s) ([GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_shown')|0] in rows) · caps [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_rural')|0]/[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_urban')|0] · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_sweeps')|0] sweep(s)"
 bag_wtp_plan_pass_tt: "What the last plan did, counted by the pass itself, and written to be read left to right: **the first zero is the diagnosis.**\n\nNo locations — the ground never reached the pass. No towns, or every location a town — the town/village test is at fault. No provinces — the province walk is. No goods — nothing here can be made by any building that may stand here. No rights with the switch on — no town could make a whole bundle, which is what all-or-nothing means. No buildings with goods standing — the sweeps placed nothing.\n\n«Room» is every location's cap added up. Buildings short of it means the ground could not feed enough different buildings, not that the plan stopped early.\n\n«Sweeps» counts every round across all the scarcity tiers.\n\n«In rows» is how many locations were laid out into the window's pages. The window draws 150 rows at a time and the buttons under this line page through them; «locations» is the whole count, and the plan built on all of them."
 bag_wtp_log_plan: "Where To Produce: planned the whole map"

 mapmode_bag_wtp_plan_name: "Where To Produce — plan"
 mapmode_bag_wtp_plan_desc: "Whether the plan filled each location or fell short. Green is filled to its cap, yellow and orange are short of it — the ground could not feed enough different goods to make up a list — and red is ground inside the plan that got nothing at all."
 bag_wtp_plan_map_built_tt: "The plan puts [Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0] building(s) here. Which ones is in the plan window."
 bag_wtp_plan_map_empty_tt: "In the plan's ground, and the plan put nothing here. Nothing this location could hold can be made from what its province works."
 bag_wtp_plan_map_outside_tt: "Outside the ground the plan was made for."
 bag_wtp_plan_map_water_tt: "Water."

 bag_wtp_plan_legend_full: "Filled to the cap"
 bag_wtp_plan_legend_part: "Short of the cap"
 bag_wtp_plan_legend_one: "One building only"
 bag_wtp_plan_legend_none: "Nothing here"
 bag_wtp_plan_rank_button_tt: "What the plan counts this location as, and a click changes it: §Yauto§! (the game's own rank) → §Ytown§! → §Yvillage§! → auto again.\n\nThe game's rank is only what is true today. A village you mean to raise into a town is still a village to the game, and the mod cannot guess which of them you will raise — so this is where you tell it. A town builds from the town list, a village from the village one, and they are different lists of different buildings.\n\nNothing is re-planned on the click. Flip as many as you like, then press «Re-plan»."
 bag_wtp_plan_forced_town: "town"
 bag_wtp_plan_forced_rural: "village"
 bag_wtp_plan_reselect_tt: "Choosing on the map does not redraw the plan. The pass reads every recipe in the game on every location, about fifty times what a single ranking costs, so a plan that redrew itself on every click would make the picker unusable.\n\nChoose the ground, then press «План» again."
 bag_wtp_plan_rank_auto: "auto"
 bag_wtp_plan_head_rank_kind: "Counts as"
 bag_wtp_plan_head_right: "Urban right"
 bag_wtp_plan_no_right: "—"
 bag_wtp_plan_right_tt: "The urban right the plan gives this town, and the reason it holds the goods it does — a right favours two or three goods at once, so it is the town's whole list rather than one entry in it.\n\n**Every town has one.** It gets whichever right its ground suits best among those the country could grant and of which it can make at least one good. A bundle good that cannot be built here simply does not go up, and its slot falls to an ordinary good.\n\nA dash means no right: either the switch on the mod page is off, or nothing this town can make suited any right the country could ever hold. Villages never carry one."
 bag_wtp_plan_page_label: "Page [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_page')|0] of [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_pages')|0] · rows [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_from')|0]–[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_to')|0] of [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_shown')|0]"
 bag_wtp_plan_page_tt: "Which part of the plan is on screen.\n\nThe window draws 150 rows at a time — that is what it costs, not the size of the answer: the plan builds over the whole of the chosen ground and the rows are simply paged. «Of» is how many locations the plan laid out into pages; where that is short of the location count on the line above, the ground was larger than the mod keeps pages for.\n\nTurning a page re-plans nothing — the answer is already worked out and the buttons only change what is drawn."
 bag_wtp_plan_page_prev: "Back"
 bag_wtp_plan_page_next: "Forward"
 bag_wtp_plan_page_prev_tt: "The previous page of the plan."
 bag_wtp_plan_page_next_tt: "The next page of the plan."
 bag_wtp_plan_refresh: "Re-plan"
 bag_wtp_plan_refresh_tt: "Run the plan again, on the ground and the settings as they stand now.\n\nNothing else re-plans: not a pick on the map, and not the «Counts as» buttons — the pass reads every recipe in the game on every location, and a plan that redrew itself on each click would be unusable when you mean to flip a dozen of them first. The moment is yours."
 bag_wtp__plan_run_end_name: "Plan the whole map for the end of the game"
 bag_wtp__plan_run_end_text: "For the end"
 bag_wtp__plan_run_end_desc: "The same plan, made out of the buildings that stand once every advance is in, rather than the ones you could put up today.\n\nThis is the button a plan actually wants. Along the game's ladder — guild, workshop, manufactory, mill — a recipe's *inputs* move and not merely its output, so for a third of the goods the province that suits the guild is not the one that suits the mill. A plan you build once and never rebuild should be made for the end.\n\n«Re-plan» in the window keeps whichever of the two you last pressed."
 bag_wtp_result_head_fit: "Fits"
 bag_wtp_result_fit_value: "[Location.MakeScope.GetVariable('bag_wtp_fit').GetValue|0]/[Location.MakeScope.GetVariable('bag_wtp_fit_of').GetValue|0]"
 bag_wtp_result_fit_tt: "How many of this province's locations can actually hold the building above, out of how many were looked at.\n\nEvery location of a province is worth the same to a good — the bonus is counted over the whole province — but they are not interchangeable: the game's own «can this be built here» asks the terrain, the rank and whatever else the building requires. Sauerland has seven locations and one of them is flat, so a quarry answers for six of them.\n\nOpen the row to see which."
