 # Group headers. A list is filed under a group named after itself, so these are
 # not duplicates of the setting names.
 bag_wtp__plan__what_name: "3. The Answer"
 bag_wtp__plan__result_name: "Best Locations"

 bag_wtp__good_raw_name: "Raw materials"
 bag_wtp__good_raw_item_column_name: "Good"
 bag_wtp__good_raw__pick_name: "This one"
 bag_wtp__good_raw__pick_desc: "The good you want produced.\n\nThese are the ones an RGO also makes — stone, salt, lumber, clay. Such a good can be dug up or made in a workshop; this answers for the workshop.\n\nOne good at a time across both lists: ticking another moves the tick."
 bag_wtp__good_made_name: "Manufactures"
 bag_wtp__good_made_item_column_name: "Good"
 bag_wtp__good_made__pick_name: "This one"
 bag_wtp__good_made__pick_desc: "The good you want produced.\n\nThese are the ones no RGO ever yields — tools, weapons, cloth, glass.\n\nOne good at a time across both lists: ticking another moves the tick."

 bag_wtp__continent_name: "Continent"
 bag_wtp__continent_item_column_name: "Continent"
 bag_wtp__continent__pick_name: "Look here"
 bag_wtp__continent__pick_desc: "Where to look at all. This is the rough frame; the fine choosing happens on the map afterwards.\n\nWith nothing ticked the whole world is offered."

 bag_wtp__buildable_only_name: "Only where the building could stand at all"
 bag_wtp__buildable_only_desc: "Off, and by default: every location of the chosen ground is ranked, yours and anybody else's. That is the planning mode, and it is what this mod is for.\n\nOn: the location has to pass the game's own «can this be built here», which is about the location and not about you — its rank, its terrain, what the building needs. A province with no town in it drops out; a province across a border does not. Ownership is not part of it.\n\nUntil 2026-08-31 this tick did nothing at all: the trigger behind it was written with an effect's `if` and came back true everywhere."

 bag_wtp__select_name: "Choose the ground on the map"
 bag_wtp__select_text: "Choose"
 bag_wtp__select_desc: "Opens a window with three map-picking buttons — by area, by province, by location — and a list of what is already chosen, for taking single locations back out.\n\nIt is not a required step. Choose nothing and the ranking answers for the ticked continents entire.\n\nWhat is chosen is painted on the map: in the Geography map modes, pick \"Where To Produce\".\n\nChosen now: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] location(s) in [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] province(s)."

 bag_wtp__run_name: "Find the best locations"
 bag_wtp__run_text: "Rank"
 bag_wtp__run_desc: "Walk the chosen locations, find each one the best methods for making the chosen good, and open the results window.\n\nYou do not pick the method: which recipe suits which ground is the question this mod exists to answer. Two are found — the best built-up building and the best village, scored apart.\n\nWhat the last run saw:\n\nContinents ticked: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_regions')|0]\nLocations considered: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nProvinces found: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0]\n\nThose three are counted by the pass itself. The first zero among them is the diagnosis."


 bag_wtp__run_end_name: "Find the best places for the end of the game"
 bag_wtp__run_end_text: "For the end"
 bag_wtp__run_end_desc: "The same pass, ordered by what the ground gives once every advance is in — and, wherever that cannot tell two provinces apart, by what it gives on the way there.\n\nThis is the button for a plan: build once, never rebuild. «Считать» beside it is the fast answer — the best you can put up this decade.\n\nBoth fill the same three columns; only the order differs."
 bag_wtp__show_name: "Show the results window"
 bag_wtp__show_text: "Open"
 bag_wtp__show_desc: "Opens the last run in a window of this mod's own: one row per province, naming the building and which of its methods won, with the raw materials the bonus is made of beside it. A row opens into the province's locations, each with what it works now and a button to take it into the plan.\n\nPressing Rank opens this window anyway; this button is for coming back to it."

 bag_wtp__goods__right_common_name: "Urban rights"
 bag_wtp__right_common_name: "Urban rights"
 bag_wtp__right_common_item_column_name: "Right"
 bag_wtp__right_common__pick_name: "This one"
 bag_wtp__goods__right_unique_name: "Unique rights"
 bag_wtp__right_unique_name: "Unique rights"
 bag_wtp__right_unique_item_column_name: "Right"
 bag_wtp__right_unique__pick_name: "This one"
 bag_wtp__right_common__pick_desc: "An urban right instead of a single good. A right favours two or three goods at once, and the answer is the ground that is best at all of them together — a different question from «where do I make books», and it opens a window of its own.\n\nThe right's own percentage is the same in every location in the world, so it changes no order; what the ranking is really made of is the bundle and the market prices of what is in it.\n\nOne answer across all three lists: ticking a right drops the good, and ticking a good drops the right."
 bag_wtp__right_unique__pick_desc: "Only the ones your country could ever hold: a right that belongs to another country or culture carries its own condition, and this asks that rather than deciding for itself."
 bag_wtp_right_window_title: "Where to produce — urban rights"
 bag_wtp_right_window_desc: "Provinces for a whole urban right, best first. A row is the right's bundle: one line per good, each with the best method available to you there, that method's bonus, and the raw materials the bonus is made of.\n\n«Worth» is what one level of every building in the bundle would earn here — output times the market price of what it makes, with the bonus and the right's own percentage applied. That is what the rows are ranked on, because four books and a third of a masonry are not one number without a price.\n\nA province counts whole, even where a border cuts it today."
 bag_wtp_right_window_empty: "Nothing here. Tick an urban right on the Goods tab, some ground on the Land tab, and press Rank.\n\nIf you have: nowhere in the chosen ground can make anything the right favours."
 bag_wtp_right_head_total: "Worth"
 bag_wtp_right_head_good: "Good"
 bag_wtp_right_total_value: "[Location.MakeScope.GetVariable('bag_wtp_r_value').GetValue|2]"
 bag_wtp_right_total_tt: "What one level of every building in this right's bundle would earn here: for each good, the best method available to you, times what that good sells for, times the bonus that method earns from the province's raw materials, times the right's own percentage.\n\nIt is a price and not a count on purpose. Four books a level and a third of a masonry a level are not comparable, and ranking on the count alone is the same mistake as putting a forest village above a weapon guild.\n\nThe right's percentage is in the number but changes no order — it is the same percentage everywhere. What separates these provinces is the bundle: a province can supply lumber and not dyes."
 bag_wtp_right_good_1: "[Location.MakeScope.GetVariable('bag_wtp_r_good_1').GetGoods.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_r_good_1').GetGoods.GetName]"
