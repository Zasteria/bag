 bag_wtp_result_window_title: "Где производить — результат"
 bag_wtp_result_window_desc: "Провинции, лучшие сверху. Строка — это два ответа: сверху лучшее из городских зданий, снизу лучшее сельское, — и каждый из них в двух эпохах: что можно построить сейчас и что провинция даст, когда открыто уже всё. Сортировка по выхлопу: процент — это прибавка к эффективности, а «×» после метода — сколько метод производит за уровень, и деревня даёт впятеро меньше мастерской при том же процентe.\n\nПровинция считается целиком, даже если сейчас она поделена границей. Раскройте строку — там локации, их сырьё и нынешний владелец каждой."
 bag_wtp_result_window_empty: "Пусто. Отметьте товар на вкладке «Товар», землю — на вкладке «Земля», и нажмите «Считать».\n\nЕсли всё отмечено — значит на выбранной земле нигде нет ни одного сырья, которое нужно методам этого товара. Галка «Показывать провинции без местной прибавки» на вкладке «Ответ» покажет их всё равно."

