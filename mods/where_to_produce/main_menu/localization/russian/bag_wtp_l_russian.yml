 bag_wtp__region_europe__pick_name: "Искать здесь"
 bag_wtp__region_europe__pick_desc: "Искать внутри этого региона. Регион — точная рамка, континент — грубая; отмечать можно и то и другое, отмеченный регион берёт верх."
