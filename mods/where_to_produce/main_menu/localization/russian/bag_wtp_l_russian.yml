 bag_wtp__what_name: "Здание и метод"
 bag_wtp__buildable_only_name: "Только там, где уже можно строить"
 bag_wtp__buildable_only_desc: "Держите это выключенным, пока планируете на землю, которой ещё не владеете.\n\nИгра отвечает на вопрос «можно ли здесь строить» про локацию как она есть сейчас, и чужая локация проваливает эту проверку независимо от своего сырья. С выключенной галкой таблица ранжирует саму землю — ради этого планирование до завоевания и затевается.\n\nВключайте, когда земля уже ваша и список надо сузить до того, что можно начать сегодня."
 bag_wtp__select_name: "Выбрать локации"
 bag_wtp__select_text: "Выбрать"
 bag_wtp__select_desc: "Открывает окно со списком провинций отмеченных регионов; каждая раскрывается в свои локации, каждую локацию можно взять в план или убрать.\n\nЭто не обязательный шаг. Если ничего не трогать, расчёт отвечает за все отмеченные регионы целиком, а выбор его сужает.\n\nВыбранное вдобавок закрашивается на карте: в режимах карты «География» выберите «Где производить». Ярким — выбранное, тусклым — то, из чего выбираете.\n\nСейчас выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. из [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров., доступных для выбора."
 bag_wtp__run_name: "Ранжировать локации"
 bag_wtp__run_text: "Считать"
 bag_wtp__run_desc: "Обойти все локации всех отмеченных регионов и заполнить таблицу ниже.\n\nЧто увидел последний расчёт:\n\nОтмечено регионов: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_regions')|0]\nРассмотрено локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nЗаполнено строк: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0]\n\nЭти три числа считает сам расчёт. Если первое осталось нулём после того, как регион отмечен, то и всё, что ниже, не выполнялось."

