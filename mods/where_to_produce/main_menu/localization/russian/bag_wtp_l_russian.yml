 bag_wtp__result_name: "Лучшие локации"
 bag_wtp__result_item_column_name: "Локация"
 bag_wtp__result_desc: "Локации внутри отмеченных регионов, лучшие сверху.\n\nЧисло — эффективность производства, которую выбранный метод получит от сырья, а пара после него — сколько нужного этому методу сырья даёт провинция из скольких нужных всего.\n\nИгра засчитывает сырьё, добываемое где угодно в провинции, а не только в самой локации, поэтому все локации одной провинции читаются одинаково. Потолок этого метода — [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ceiling')|2]%, столько получила бы провинция, дающая всё сразу.\n\nВ таблице пятьдесят строк и не больше."

 bag_wtp_log_run: "Где производить: локации ранжированы"

 bag_wtp_select_window_title: "Где производить — выбор земли"
 bag_wtp_select_window_desc: "Провинции отмеченных вами регионов. Раскройте провинцию, чтобы добраться до локаций, или возьмите её целиком.\n\nБонус от сырья засчитывается по провинции, поэтому все локации одной провинции дают одинаковое число — выбор между ними это уже строительные слоты, которых эта версия не считает."
 bag_wtp_select_summary: "Выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."
