 bag_wtp__result_name: "Лучшие локации"
 bag_wtp__result_item_column_name: "Локация"
 bag_wtp__result_desc: "Локации внутри отмеченных регионов, лучшие сверху.\n\nЧисло — эффективность производства, которую выбранный метод получит от сырья, а пара после него — сколько нужного этому методу сырья даёт провинция из скольких нужных всего.\n\nИгра засчитывает сырьё, добываемое где угодно в провинции, а не только в самой локации, поэтому все локации одной провинции читаются одинаково. Потолок этого метода — [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ceiling')|2]%, столько получила бы провинция, дающая всё сразу.\n\nВ таблице пятьдесят строк и не больше."

 bag_wtp_log_run: "Где производить: локации ранжированы"

 bag_wtp_select_window_title: "Где производить — выбор земли"
 bag_wtp_select_window_desc: "Провинции отмеченных вами регионов. Раскройте провинцию, чтобы добраться до локаций, или возьмите её целиком.\n\nБонус от сырья засчитывается по провинции, поэтому все локации одной провинции дают одинаковое число — выбор между ними это уже строительные слоты, которых эта версия не считает."
 bag_wtp_select_summary: "Выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."
 bag_wtp_add_location: "Добавить"
 bag_wtp_add_location_tt: "Взять эту локацию в план."
 bag_wtp_remove_location: "Убрать"
 bag_wtp_remove_location_tt: "Убрать эту локацию из плана."
 bag_wtp_toggle_province: "Всю провинцию"
 bag_wtp_toggle_province_tt: "Взять в план все локации провинции, а если все уже взяты — убрать их все."
 bag_wtp_expand_tt: "Показать локации провинции."
 bag_wtp_collapse_tt: "Скрыть локации провинции."
 bag_wtp_pick_all: "Взять всё"
 bag_wtp_pick_all_tt: "Взять в план все локации всех перечисленных здесь провинций."
 bag_wtp_clear_all: "Очистить выбор"
 bag_wtp_clear_all_tt: "Очистить план целиком — везде, а не только в показанном списке, чтобы выбор, сделанный при других регионах, не уцелел незаметно."
 bag_wtp_selection: "Где производить"
 bag_wtp_map_picked_tt: "Выбрано в план."
 bag_wtp_map_browsable_tt: "Внутри отмеченных регионов, не выбрано."
 bag_wtp_map_outside_tt: "Вне отмеченных регионов."
 bag_wtp_map_legend_picked: "Выбрано"
 bag_wtp_map_legend_browsable: "Можно выбрать"

 bag_wtp_map_pick_area: "Выбрать области на карте"
 bag_wtp_map_pick_area_desc: "Открывает собственную панель выбора цели игры для областей: список с поиском, подсветка на карте, и клик по любому из двух выбирает одно и то же.\n\nКаждый клик переключает — область не в плане входит в него, уже входящая выходит, — так что кликайте, пока земля не будет та, и закрывайте панель. Сохранять ничего не нужно."
 bag_wtp_map_pick_province: "Выбрать провинции на карте"
 bag_wtp_map_pick_province_desc: "Та же панель, по одной провинции. Каждый клик переключает все сухопутные локации провинции разом."
 bag_wtp_map_pick_location: "Выбрать локации на карте"
 bag_wtp_map_pick_location_desc: "Та же панель, по одной локации — чтобы подровнять края плана, нарисованного областями."
 bag_wtp_choose_area: "Выберите область"
 bag_wtp_choose_area_tt: "Кликните по области на карте или в списке. Она войдёт в план, а если уже входила — выйдет."
 bag_wtp_choose_province: "Выберите провинцию"
 bag_wtp_choose_province_tt: "Кликните по провинции на карте или в списке. Её сухопутные локации войдут в план, а если уже входили — выйдут."
 bag_wtp_choose_location: "Выберите локацию"
 bag_wtp_choose_location_tt: "Кликните по локации на карте или в списке. Она войдёт в план, а если уже входила — выйдет."
 bag_wtp_picker_hint: "Клик переключает, поэтому выбирайте сколько нужно и закрывайте, когда план готов, — сохранять ничего не надо. Отмеченные регионы сужают предлагаемое; если не отмечено ничего, предлагается весь мир."

 bag_wtp__plan__good_name: "1. Что хотите производить"
 bag_wtp__good_name: "Товар"
 bag_wtp__good_item_column_name: "Товар"
 bag_wtp__good__pick_name: "Этот"
 bag_wtp__good__pick_desc: "Товар, который хотите производить. Отметка заполняет список ниже всеми способами, которыми игра его делает.\n\nТолько один за раз — отметка другого переносит галку."
 bag_wtp__plan__recipe_name: "2. Каким зданием и каким методом"
 bag_wtp__recipe_name: "Здание и метод"
 bag_wtp__recipe_item_column_name: "Здание — метод"
 bag_wtp__recipe__pick_name: "Этот"
 bag_wtp__recipe__pick_desc: "Здание и метод производства, на котором собираетесь его держать. Строки — это способы сделать выбранный выше товар; выбранный здесь и есть то, за что отвечает расчёт.\n\nСобственная панель строительства ранжирует по лучшему методу, который здание вообще может получить. Здесь — по тому, который вы действительно намерены включить."
