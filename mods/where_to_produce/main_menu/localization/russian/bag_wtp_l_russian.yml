 bag_wtp__any_method_name: "Показывать методы, до которых ещё не дошла эпоха"
 bag_wtp__any_method_desc: "Выключено: мод считает только те методы производства, здание которых вам уже доступно, — рекомендация из шестой эпохи это не рекомендация.\n\nВключите, если планируете на несколько эпох вперёд."

 # Заголовки групп. Список хранится в группе, названной его же именем, поэтому
 # это не дубликаты названий настроек.
 bag_wtp__plan__what_name: "3. Расчёт"
 bag_wtp__plan__result_name: "Лучшие локации"

 bag_wtp__good_raw_name: "Сырьё"
 bag_wtp__good_raw_item_column_name: "Товар"
 bag_wtp__good_raw__pick_name: "Этот"
 bag_wtp__good_raw__pick_desc: "Товар, который хотите производить.\n\nЗдесь то, что даёт и РГО: камень, соль, лес, глина. Такой товар можно и добывать, и делать в мастерской — мод отвечает на вопрос про мастерскую.\n\nТолько один товар за раз, в обоих списках вместе: отметка другого переносит галку."
 bag_wtp__good_made_name: "Изделия"
 bag_wtp__good_made_item_column_name: "Товар"
 bag_wtp__good_made__pick_name: "Этот"
 bag_wtp__good_made__pick_desc: "Товар, который хотите производить.\n\nЗдесь то, что РГО не даёт никогда: инструменты, оружие, ткань, стекло.\n\nТолько один товар за раз, в обоих списках вместе: отметка другого переносит галку."

 bag_wtp__continent_name: "Континент"
 bag_wtp__continent_item_column_name: "Континент"
 bag_wtp__continent__pick_name: "Искать здесь"
 bag_wtp__continent__pick_desc: "Где вообще смотреть. Это грубая рамка: тонкий выбор делается дальше, на карте.\n\nЕсли не отмечено ничего, предлагается весь мир."

 bag_wtp__buildable_only_name: "Только там, где уже можно строить"
 bag_wtp__buildable_only_desc: "Держите это выключенным, пока планируете на землю, которой ещё не владеете.\n\nИгра отвечает на вопрос «можно ли здесь строить» про локацию как она есть сейчас, и чужая локация проваливает эту проверку независимо от своего сырья. С выключенной галкой таблица ранжирует саму землю — ради этого планирование до завоевания и затевается.\n\nВключайте, когда земля уже ваша и список надо сузить до того, что можно начать сегодня."

 bag_wtp__select_name: "Выбрать землю на карте"
 bag_wtp__select_text: "Выбрать"
 bag_wtp__select_desc: "Открывает окно с тремя кнопками выбора по карте — по области, по провинции, по локации — и списком того, что уже выбрано, чтобы убрать лишнее поштучно.\n\nЭто не обязательный шаг. Если ничего не выбрать, расчёт отвечает за отмеченные континенты целиком.\n\nВыбранное закрашивается на карте: в режимах карты «География» выберите «Где производить».\n\nСейчас выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."

 bag_wtp__run_name: "Найти лучшие локации"
 bag_wtp__run_text: "Считать"
 bag_wtp__run_desc: "Пройти по выбранным локациям, подобрать каждой лучший метод производства выбранного товара и заполнить таблицу ниже.\n\nМетод выбирать не нужно: какой рецепт подходит какой земле — это и есть вопрос, на который мод отвечает.\n\nЧто увидел последний расчёт:\n\nОтмечено континентов: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_regions')|0]\nРассмотрено локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nЗаполнено строк: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0]\n\nЭти три числа считает сам расчёт. Первый ноль среди них и есть диагноз."

 bag_wtp__result_name: "Лучшие локации"
 bag_wtp__result_item_column_name: "Провинция — прибавка — здание: метод"
 bag_wtp__result_desc: "Провинции, лучшие сверху. Число — прибавка к эффективности производства, которую лучший здесь метод получит от местного сырья; дальше — здание и тот метод, которым он этого добивается.\n\nПровинция берётся целиком, даже если сейчас её режет граница: игра считает куски порознь, но после захвата счёт пойдёт по всей провинции, и мод отвечает сразу этим числом.\n\nЗдесь пятьдесят строк и не больше: это потолок списка Мод-меню. Значки сырья, локации провинции с их сырьём и владельцами — в окне результата, кнопкой «Открыть»."

 bag_wtp__show_name: "Показать окно результата"
 bag_wtp__show_text: "Открыть"
 bag_wtp__show_desc: "Открыть окно с последним расчётом: строка на провинцию, в ней здание и тот самый метод, который выиграл, и значки сырья, из которого сложился процент. Плюсом строка раскрывается в локации провинции — с их собственным сырьём и кнопкой взять локацию в план.\n\nКнопка «Считать» открывает это окно сама; эта нужна, чтобы вернуться к посчитанному."

 bag_wtp_result_window_title: "Где производить — результат"
 bag_wtp_result_window_desc: "Провинции, лучшие сверху. Процент — прибавка к эффективности производства, которую метод получит от сырья провинции; значки справа — то сырьё, из которого он сложился.\n\nПровинция считается целиком, даже если сейчас она поделена границей: игра называет куски «Молдавская провинция Бессарабия» и считает их порознь, но как только провинция станет вашей, счёт пойдёт по всем её локациям. Раскройте строку — там локации, их сырьё и нынешний владелец каждой."
 bag_wtp_result_window_empty: "Пока пусто. Отметьте товар на вкладке «Товар», землю — на вкладке «Земля», и нажмите «Считать»."

 bag_wtp_result_bonus_value: "[Location.MakeScope.GetVariable('bag_wtp_best').GetValue|2]%"
 bag_wtp_result_method_value: "[Location.MakeScope.GetVariable('bag_wtp_bt').GetBuildingType.GetIcon] [Location.MakeScope.GetVariable('bag_wtp_bt').GetBuildingType.GetName]: [Location.MakeScope.GetVariable('bag_wtp_pm').GetProductionMethod.GetName]"

 bag_wtp_result_unowned: "Ничья земля"
 bag_wtp_result_goods_count: "[GetDataModelSize(Location.MakeScope.GetList('bag_wtp_goods'))]/[Location.MakeScope.GetVariable('bag_wtp_goods_all').GetValue|0]"
 bag_wtp_result_head_province: "Провинция"
 bag_wtp_result_head_area: "Область"
 bag_wtp_result_head_bonus: "Прибавка"
 bag_wtp_result_head_method: "Здание и метод"
 bag_wtp_result_head_goods: "Из чего"

 bag_wtp_result_province_tt: "Провинция целиком, обе её половины, если она сейчас поделена границей. Строит игрок в одной из её локаций — раскройте строку."
 bag_wtp_result_bonus_tt: "Прибавка к эффективности производства от местного сырья.\n\nИгра считает её так: 10% × (сырьё метода, которое даёт провинция) ÷ (всё сырьё метода). В знаменатель входит и то, что рудник или ферма выдать не могут — инструменты, например, — поэтому у иных методов потолок заметно ниже десяти процентов.\n\nСчитается по всей провинции. Пока она поделена границей, игра считает вашу половину отдельно и число сегодня будет меньше; это же число вы получите, когда провинция станет вашей целиком."
 bag_wtp_result_method_tt: "Здание и тот метод производства, который здесь оказался лучшим из доступных вам сейчас.\n\nЕсли у здания несколько методов, выбран не первый, а тот, чьё сырьё эта провинция кормит лучше всех."
 bag_wtp_result_goods_tt: "Сырьё, которое провинция даёт этому методу, — то, из чего сложилась прибавка.\n\nЧисло слева: сколько видов сырья метода провинция даёт из скольких могла бы. Чего здесь нет, того провинция не добывает нигде, и ровно на эту долю прибавка ниже потолка метода."
 bag_wtp_result_expand_tt: "Показать локации провинции."
 bag_wtp_result_collapse_tt: "Скрыть локации провинции."

 bag_wtp_result_tt_area: "Область"
 bag_wtp_result_tt_method: "Здание и метод"
 bag_wtp_result_tt_window: "Значки сырья и локации провинции — в окне результата, кнопкой «Открыть»."

 bag_wtp_log_run: "Где производить: локации ранжированы"

 bag_wtp_select_window_title: "Где производить — выбор земли"
 bag_wtp_select_window_desc: "Кнопки открывают собственную панель выбора игры: список с поиском, подсветка на карте, и клик по карте выбирает то же, что строка. Клик переключает — второй клик по той же земле её убирает.\n\nНиже перечислено то, что уже выбрано, — чтобы убрать поштучно."
 bag_wtp_select_summary: "Выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."
 bag_wtp_picker_hint: "Клик переключает. Панель закрывается после каждого выбора — это её устройство, а не ошибка: чтобы взять несколько кусков, выбирайте областями, их немного."

 bag_wtp_map_pick_area: "Выбрать область"
 bag_wtp_map_pick_area_desc: "Панель выбора области: список с поиском и клик по карте. Клик переключает — область входит в план или выходит из него."
 bag_wtp_map_pick_province: "Выбрать провинцию"
 bag_wtp_map_pick_province_desc: "То же, по одной провинции. Клик переключает все её сухопутные локации разом."
 bag_wtp_map_pick_location: "Выбрать локацию"
 bag_wtp_map_pick_location_desc: "То же, по одной локации — чтобы подровнять края плана, нарисованного областями."
 bag_wtp_choose_area: "Выберите область"
 bag_wtp_choose_area_tt: "Кликните по области на карте или в списке. Она войдёт в план, а если уже входила — выйдет."
 bag_wtp_choose_province: "Выберите провинцию"
 bag_wtp_choose_province_tt: "Кликните по провинции на карте или в списке. Её сухопутные локации войдут в план, а если уже входили — выйдут."
 bag_wtp_choose_location: "Выберите локацию"
 bag_wtp_choose_location_tt: "Кликните по локации на карте или в списке. Она войдёт в план, а если уже входила — выйдет."

 bag_wtp_add_location: "Добавить"
 bag_wtp_add_location_tt: "Взять эту локацию в план."
 bag_wtp_remove_location: "Убрать"
 bag_wtp_remove_location_tt: "Убрать эту локацию из плана."
 bag_wtp_toggle_province: "Всю провинцию"
 bag_wtp_toggle_province_tt: "Взять в план все локации провинции, а если все уже взяты — убрать их все."
 bag_wtp_expand_tt: "Показать локации провинции."
 bag_wtp_collapse_tt: "Скрыть локации провинции."
 bag_wtp_pick_all: "Взять всё"
 bag_wtp_pick_all_tt: "Взять в план все локации всех перечисленных здесь провинций."
 bag_wtp_clear_all: "Очистить выбор"
 bag_wtp_clear_all_tt: "Очистить план целиком."

 mapmode_bag_wtp_selection_name: "Где производить"
 mapmode_bag_wtp_selection_desc: "Ярким — выбранное в план, тусклым — то, из чего выбираете."
 bag_wtp_map_picked_tt: "Выбрано в план."
 bag_wtp_map_browsable_tt: "Внутри отмеченных континентов, не выбрано."
 bag_wtp_map_outside_tt: "Вне отмеченных континентов."
 bag_wtp_map_legend_picked: "Выбрано"
 bag_wtp_map_legend_browsable: "Можно выбрать"
