 bag_wtp__plan_ticks_name: "Сбросить пометки город/село"
 bag_wtp__plan_ticks_text: "Сбросить"
 bag_wtp__plan_ticks_desc: "Снимает пометку «считать городом» и «считать селом» со всех локаций мира разом.\n\nПометка живёт на самой локации и переживает сохранение, поэтому снять её на строках, которые видно в окне, — это не «снять везде». Расширив область, вы приведёте в план локации, помеченные когда-то раньше, и они встанут наверх списка городами: со стороны это выглядит так, будто пометки вернулись сами.\n\nСнято в прошлый раз: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ticks')|0]\n\nПересчёт эта кнопка не запускает — как и сами пометки. Следующее «Пересчитать» и есть момент, когда всё станет правдой."
 bag_wtp__diag_name: "Диагностика"
 bag_wtp__diag_text: "Собрать"
 bag_wtp__diag_desc: "Записывает в лог всё, что мод знает о последнем расчёте, — одним нажатием и обычным текстом.\n\nСначала «Считать план», потом эта кнопка. Ничего в плане она не меняет: только читает то, что расчёт уже разложил по локациям.\n\nОкна она не открывает — отчёт слишком велик, чтобы читать его с экрана, и он не для вас, а для сессии. Что кнопка увидела в последний раз, видно прямо здесь:\n\nСборов с загрузки: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_runs')|0]\nПройдено локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_locs')|0]  (из них городов: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_towns')|0])\nОсталось места: в городах [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_freet')|0], в сёлах [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_diag_freer')|0]\nПоставлено зданий: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] из [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] мест\n\nЕсли «сборов» растёт, а «пройдено локаций» ноль — плана не было: нажмите сначала «Считать план».\n\nЗабрать текст: mods.bat, пункт 8 «Забрать диагностику из игры» — он сам достанет последний отчёт и скопирует в буфер обмена. Вручную: Documents/Paradox Interactive/Europa Universalis V/logs/debug.log\n\nЭто временный инструмент. Он уйдёт вместе с ошибкой, которую найдёт."

 bag_wtp_plan_window_title: "Где производить — общий план"
 bag_wtp_plan_window_desc: "Все товары, размещённые разом по выбранной земле, по одной локации за раз.\n\nВсе локации провинции стоят для товара одинаково — бонус считается по всей провинции, — поэтому в понравившуюся провинцию план возвращается снова и снова, и её локации выходят похожими. Это следствие, а не правило: где земли мало, план их разведёт, и торговая деревня в одной локации может делать керамику, пока соседняя делает ювелирку.\n\nПровинции идут в порядке того, сколько план в каждую вложил, локации одной провинции держатся вместе, города первыми."
 bag_wtp_plan_window_empty: "Здесь пусто. Выберите землю на вкладке «Земля» и нажмите «План».\n\nЕсли выбрали: на выбранной земле нельзя сделать вообще ничего — а для целого региона это значило бы, что земля до прохода не дошла."
 bag_wtp_plan_head_rank: "№"
 bag_wtp_plan_head_location: "Локация"
 bag_wtp_plan_head_province: "Провинция"
 bag_wtp_plan_head_area: "Область"
 bag_wtp_plan_head_load: "Зданий"
 bag_wtp_plan_head_rgo: "РГО"
 bag_wtp_plan_head_goods: "Что ставит план"
 bag_wtp_plan_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_plan_rank').GetValue|0]"
 bag_wtp_plan_rank_tt: "Место строки в таблице. Провинции идут в порядке того, сколько план в каждую вложил, а локации одной провинции держатся вместе: сначала её города, потом сёла.\n\nМесто печатается, а не выводится из положения строки, потому что это разные обещания: порядок решается в скрипте, а окно рисует список в том порядке, в каком его держит."
 bag_wtp_plan_load_value: "[Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0]"
 bag_wtp_plan_load_tt: "Сколько зданий план ставит в эту локацию, но не больше выданного вами лимита.\n\nМеньше лимита означает, что земля не прокормила достаточно **разных зданий**, которые тут вообще могут стоять. Это строже, чем разные товары: в локации стоит одно здание каждого типа, так что место, богатое рецептами одного здания, получит из них одну запись."
 bag_wtp_plan_province_tt: "Вся провинция, обе стороны любой границы, которая её сегодня режет. Бонус считается по ней целиком, поэтому товар стоит одинаково в любой её локации — потому план и выбирает по провинции, а все её локации строят один и тот же список."
 bag_wtp_plan_goods_tt: "Что план построил бы здесь: сверху товар, под ним — здание, которое его делает. Наведите на любой значок, чтобы увидеть название.\n\n**Одна запись — это одно здание.** В локации стоит одно здание каждого типа, а здание работает по одному методу производства, поэтому два товара с одного здания здесь одновременно не построить — зато соседняя локация может взять то же здание с другим методом.\n\n**И каждое здание здесь действительно может тут стоять.** План спрашивает у самой игры «можно ли это построить в этой локации» для каждого: рельеф, ранг и всё прочее, что здание требует."
 bag_wtp_plan_pass_summary: "Локаций [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] (городских [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_towns')|0]) · провинций [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provn')|0] · мест [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] · товаров [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0] · норма [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_quota')|0] · прав выдано [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rightn')|0] · зданий [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0] локациях (в строках [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_shown')|0]) · лимиты [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_rural')|0]/[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_urban')|0] · кругов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_sweeps')|0]"
 bag_wtp_plan_pass_tt: "Что сделал последний план — всё это считает сам проход, и строка написана так, чтобы читаться слева направо: **первый ноль и есть диагноз.**\n\nНет локаций — земля до прохода не дошла. Нет городских, или городскими оказались все — виноват тест «город или село». Нет провинций — виноват обход провинций. Нет товаров — здесь ничего нельзя сделать ни одним зданием, которое тут может стоять. Нет прав при включённой галочке — ни один город не смог сделать связку целиком, а право даётся только целиком. Нет зданий при ненулевых товарах — круги ничего не разместили.\n\n«Мест» — сумма лимитов всех локаций. Зданий меньше — значит земля не прокормила достаточно разных зданий, а не что план остановился раньше.\n\n«Кругов» — все круги по всем ступеням дефицита.\n\n«В строках» — сколько локаций разложено по страницам окна. Окно рисует 150 строк за раз и листается кнопками под этой строкой; «локаций» — полное число, и план застроил их все."
 bag_wtp_log_plan: "Где производить: составлен общий план"

 mapmode_bag_wtp_plan_name: "Где производить — план"
 mapmode_bag_wtp_plan_desc: "Заполнил ли план каждую локацию или недобрал. Зелёное — заполнено до лимита, жёлтое и оранжевое — недобор: земля не прокормила достаточно разных товаров, чтобы собрать список. Красное — земля внутри плана, которой не досталось ничего."
 bag_wtp_plan_map_built_tt: "План ставит здесь зданий: [Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0]. Какие именно — в окне плана."
 bag_wtp_plan_map_empty_tt: "В земле плана, и план сюда ничего не поставил: из того, что добывает эта провинция, здесь нельзя сделать ничего."
 bag_wtp_plan_map_outside_tt: "Вне земли, для которой считался план."
 bag_wtp_plan_map_water_tt: "Вода."

 bag_wtp_plan_legend_full: "Заполнено до лимита"
 bag_wtp_plan_legend_part: "Недобор"
 bag_wtp_plan_legend_one: "Только одно здание"
 bag_wtp_plan_legend_none: "Пусто"
 bag_wtp_plan_rank_button_tt: "Чем план считает эту локацию, и клик это меняет: §Yавто§! (ранг самой игры) → §Yгород§! → §Yсело§! → снова авто.\n\nРанг игры — это только то, что верно сегодня. Село, которое вы собираетесь поднять до города, для игры всё ещё село, и мод не может угадать, какое именно вы поднимете, — поэтому здесь вы говорите ему сами. Город строит из городского списка, село из сельского, а это разные списки из разных зданий.\n\nПо клику ничего не пересчитывается. Переключайте сколько нужно, потом нажмите «Пересчитать»."
 bag_wtp_plan_forced_town: "город"
 bag_wtp_plan_forced_rural: "село"
 bag_wtp_plan_reselect_tt: "Выбор на карте план не перерисовывает. Проход читает все рецепты игры на каждой локации — это раз в пятьдесят дороже обычного ранжирования, — и план, который перерисовывался бы на каждый клик, сделал бы выбор земли невыносимым.\n\nВыберите землю и нажмите «План» ещё раз."
 bag_wtp_plan_rank_auto: "авто"
 bag_wtp_plan_head_rank_kind: "Считать"
 bag_wtp_plan_head_right: "Городское право"
 bag_wtp_plan_no_right: "—"
 bag_wtp_plan_right_tt: "Городское право, которое план даёт этому городу, и причина, по которой он держит именно эти товары: право поднимает два-три товара сразу, поэтому оно и есть весь городской список, а не одна запись в нём.\n\n**Право есть у каждого города.** Городу достаётся то, которому его земля подходит лучше всего среди тех, что держава может выдать и из которых он может сделать хотя бы один товар. Товар связки, который здесь построить нельзя, просто не встанет, а его ячейку займёт обычный товар.\n\nПрочерк означает, что права нет: либо галочка на странице мода выключена, либо ничего из того, что город может делать, не подошло ни одному праву этой страны. У сёл права не бывает никогда."
 bag_wtp_plan_page_label: "Страница [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_page')|0] из [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_pages')|0] · строки [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_from')|0]–[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_to')|0] из [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_shown')|0]"
 bag_wtp_plan_page_tt: "Какая часть плана сейчас на экране.\n\nОкно рисует 150 строк за раз — это его цена, а не размер ответа: план застраивает всю выбранную землю, а строки просто листаются. «Из скольких» — сколько локаций план разложил по страницам; если это меньше числа локаций в строке выше, значит земля оказалась больше, чем мод хранит страницами.\n\nСтраница не пересчитывает план: он уже посчитан, кнопки только меняют то, что показано."
 bag_wtp_plan_page_prev: "Назад"
 bag_wtp_plan_page_next: "Вперёд"
 bag_wtp_plan_page_prev_tt: "Предыдущая страница плана."
 bag_wtp_plan_page_next_tt: "Следующая страница плана."
 bag_wtp_plan_refresh: "Пересчитать"
 bag_wtp_plan_refresh_tt: "Пересчитать план по земле и настройкам, как они сейчас.\n\nБольше ничто план не пересчитывает: ни выбор на карте, ни кнопки «Считать» в строках. Проход читает все рецепты игры на каждой локации, и план, который перерисовывался бы на каждый клик, был бы невыносим, когда вы собираетесь переключить десяток. Момент выбираете вы."
 bag_wtp__plan_run_end_name: "Составить общий план на конец игры"
 bag_wtp__plan_run_end_text: "На конец"
 bag_wtp__plan_run_end_desc: "Тот же план, но собранный из зданий, которые стоят, когда все технологии взяты, а не из тех, что можно поставить сегодня.\n\nЭто та кнопка, которая плану и нужна. По лестнице игры — гильдия, мастерская, мануфактура, фабрика — у рецепта меняются *входы*, а не только выход, поэтому для трети товаров провинция, подходящая гильдии, — не та, что подходит фабрике. План, который строят один раз и не перестраивают, надо делать на конец.\n\n«Пересчитать» в окне сохраняет ту из двух кнопок, что вы нажали последней."
 bag_wtp_result_head_fit: "Подходит"
 bag_wtp_result_fit_value: "[Location.MakeScope.GetVariable('bag_wtp_fit').GetValue|0]/[Location.MakeScope.GetVariable('bag_wtp_fit_of').GetValue|0]"
 bag_wtp_result_fit_tt: "Сколько локаций этой провинции реально могут держать здание из строки выше — из скольких рассмотренных.\n\nВсе локации провинции стоят для товара одинаково: бонус считается по всей провинции. Но взаимозаменяемыми они не являются — игра спрашивает про рельеф, ранг и всё, что здание требует. В Зауэрланде семь локаций, и одна из них равнина, поэтому каменоломня отвечает за шесть.\n\nРаскройте строку, чтобы увидеть какие."
