l_russian:
 bag_wtp_name: "Где производить"
 bag_wtp_desc: "Инструмент планирования. Выберите товар и землю — мод сам подберёт для каждой локации лучший доступный метод производства и отранжирует локации по тому, сколько он выжмет из местного сырья."


