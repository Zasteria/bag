l_russian:
 bag_wtp_name: "Где производить"
 bag_wtp_desc: "Инструмент планирования. Отметьте регионы, внутри которых планируете, выберите здание и метод производства, на котором собираетесь его держать, и прочитайте, каким локациям внутри этих границ благоволит сырьё."

 bag_wtp__plan_name: "Планирование"

