 bag_wtp__region_america__pick_desc: "Искать внутри этого региона. Регион — точная рамка, континент — грубая; отмечать можно и то и другое, отмеченный регион берёт верх."
 bag_wtp__zone__region_oceania_name: "Океания"
 bag_wtp__region_oceania_name: "Океания"
 bag_wtp__region_oceania_item_column_name: "Регион"
 bag_wtp__region_oceania__pick_name: "Искать здесь"
 bag_wtp__region_oceania__pick_desc: "Искать внутри этого региона. Регион — точная рамка, континент — грубая; отмечать можно и то и другое, отмеченный регион берёт верх."
 bag_wtp__any_method_name: "Показывать методы, до которых ещё не дошла эпоха"
 bag_wtp__any_method_desc: "Выключено: мод считает только те методы производства, здание которых вам уже доступно, — рекомендация из шестой эпохи это не рекомендация.\n\nВключите, если планируете на несколько эпох вперёд."
 bag_wtp__rank_by_end_name: "Ранжировать по последней эпохе"
 bag_wtp__rank_by_end_desc: "Выключено, и так по умолчанию: таблица упорядочена по тому, что можно построить сейчас.\n\nВключено: она упорядочена по колонке «В конце» — по тому, что провинция даст, когда открыто уже всё. Это и есть порядок, который нужен плану: провинция, которая первая с гильдией и сороковая с мельницей, обходится в перестройку на пол-игры, и увидеть её можно, только если что-то сортирует по дальней колонке.\n\nОба числа стоят в каждой строке в любом случае; галка решает только, какому из них подчиняется ранжирование."

 # Заголовки групп. Список хранится в группе, названной его же именем, поэтому
 # это не дубликаты названий настроек.
 bag_wtp__plan__what_name: "3. Расчёт"
 bag_wtp__plan__result_name: "Лучшие локации"

 bag_wtp__good_raw_name: "Сырьё"
 bag_wtp__good_raw_item_column_name: "Товар"
 bag_wtp__good_raw__pick_name: "Этот"
 bag_wtp__good_raw__pick_desc: "Товар, который хотите производить.\n\nЗдесь то, что даёт и РГО: камень, соль, лес, глина. Такой товар можно и добывать, и делать в мастерской — мод отвечает на вопрос про мастерскую.\n\nТолько один товар за раз, в обоих списках вместе: отметка другого переносит галку."
 bag_wtp__good_made_name: "Изделия"
 bag_wtp__good_made_item_column_name: "Товар"
 bag_wtp__good_made__pick_name: "Этот"
 bag_wtp__good_made__pick_desc: "Товар, который хотите производить.\n\nЗдесь то, что РГО не даёт никогда: инструменты, оружие, ткань, стекло.\n\nТолько один товар за раз, в обоих списках вместе: отметка другого переносит галку."

 bag_wtp__continent_name: "Континент"
 bag_wtp__continent_item_column_name: "Континент"
 bag_wtp__continent__pick_name: "Искать здесь"
 bag_wtp__continent__pick_desc: "Где вообще смотреть. Это грубая рамка: тонкий выбор делается дальше, на карте.\n\nЕсли не отмечено ничего, предлагается весь мир."

 bag_wtp__buildable_only_name: "Только там, где здание вообще может стоять"
 bag_wtp__buildable_only_desc: "Выключено, и так по умолчанию: ранжируется вся выбранная земля — и ваша, и чужая. Это режим планирования, ради которого мод и существует.\n\nВключено: локация должна пройти игровое «можно ли здесь это построить», а этот вопрос про локацию, а не про вас — её ранг, её местность, требования здания. Провинция без единого города выпадет; провинция за границей — нет. Владение здесь ни при чём.\n\nДо 31.08.2026 галка не делала вообще ничего: триггер за ней был написан через `if` от эффектов и возвращал «да» везде."

 bag_wtp__select_name: "Выбрать землю на карте"
 bag_wtp__select_text: "Выбрать"
 bag_wtp__select_desc: "Открывает окно с тремя кнопками выбора по карте — по области, по провинции, по локации — и списком того, что уже выбрано, чтобы убрать лишнее поштучно.\n\nЭто не обязательный шаг. Если ничего не выбрать, расчёт отвечает за отмеченные континенты целиком.\n\nВыбранное закрашивается на карте: в режимах карты «География» выберите «Где производить».\n\nСейчас выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."

 bag_wtp__run_name: "Найти лучшие локации"
 bag_wtp__run_text: "Считать"
 bag_wtp__run_desc: "Пройти по выбранным локациям, подобрать каждой лучшие методы производства выбранного товара и открыть окно результата.\n\nМетод выбирать не нужно: какой рецепт подходит какой земле — это и есть вопрос, на который мод отвечает. Ищутся два: лучшее городское здание и лучшее сельское, порознь.\n\nЧто увидел последний расчёт:\n\nОтмечено континентов: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_regions')|0]\nРассмотрено локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nНайдено провинций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0]\n\nЭти три числа считает сам расчёт. Первый ноль среди них и есть диагноз."


 bag_wtp__show_name: "Показать окно результата"
 bag_wtp__show_text: "Открыть"
 bag_wtp__show_desc: "Открыть окно с последним расчётом: строка на провинцию, в ней здание и тот самый метод, который выиграл, и значки сырья, из которого сложился процент. Плюсом строка раскрывается в локации провинции — с их собственным сырьём и кнопкой взять локацию в план.\n\nКнопка «Считать» открывает это окно сама; эта нужна, чтобы вернуться к посчитанному."

 bag_wtp__goods__right_common_name: "Городские права"
 bag_wtp__right_common_name: "Городские права"
 bag_wtp__right_common_item_column_name: "Право"
 bag_wtp__right_common__pick_name: "Это"
 bag_wtp__goods__right_unique_name: "Уникальные права"
 bag_wtp__right_unique_name: "Уникальные права"
 bag_wtp__right_unique_item_column_name: "Право"
 bag_wtp__right_unique__pick_name: "Это"
 bag_wtp__right_common__pick_desc: "Городское право вместо одного товара. Право поднимает выхлоп сразу двум-трём товарам, и ответом будет земля, которая хороша по всем ним вместе — это другой вопрос, чем «где делать книги», и он открывает своё окно.\n\nСобственный процент права одинаков в любой локации мира и потому не меняет порядок; ранжирование на самом деле строится на наборе товаров и их рыночных ценах.\n\nОдин ответ на все три списка: отметив право, вы снимаете товар, и наоборот."
 bag_wtp__right_unique__pick_desc: "Только те, которые ваша страна может получить: у прав чужих стран и культур есть собственное условие, и мод спрашивает именно его, а не решает сам."
 bag_wtp_right_window_title: "Где производить — городские права"
 bag_wtp_right_window_desc: "Провинции под целое городское право, лучшие сверху. Строка — это набор права: по строке на каждый товар, в каждой лучший доступный вам здесь метод, его прибавка и сырьё, из которого прибавка складывается.\n\n«Ценность» — сколько заработал бы один уровень каждого здания набора здесь: выхлоп на рыночную цену того, что он делает, с учётом прибавки и собственного процента права. По этому числу строки и отсортированы: четыре книги и треть кладки не складываются в одно число без цены.\n\nПровинция считается целиком, даже если сейчас она поделена границей."
 bag_wtp_right_window_empty: "Пусто. Отметьте городское право на вкладке «Товар», землю — на вкладке «Земля», и нажмите «Считать».\n\nЕсли всё отмечено — значит на выбранной земле нельзя произвести ничего из того, чему это право помогает."
 bag_wtp_right_head_total: "Ценность"
 bag_wtp_right_head_good: "Товар"
 bag_wtp_right_total_value: "[Location.MakeScope.GetVariable('bag_wtp_r_value').GetValue|2]"
 bag_wtp_right_total_tt: "Сколько заработал бы один уровень каждого здания из набора этого права: по каждому товару — лучший доступный вам метод, умноженный на цену товара, на прибавку, которую метод получает от сырья провинции, и на собственный процент права.\n\nЭто намеренно цена, а не количество. Четыре книги за уровень и треть кладки за уровень несравнимы, а ранжировать по одному количеству — та же ошибка, что ставить лесную деревню выше оружейной гильдии.\n\nПроцент права в числе учтён, но порядок он не меняет — он одинаков везде. Провинции разделяет именно набор: провинция может давать дерево и не давать красители."
