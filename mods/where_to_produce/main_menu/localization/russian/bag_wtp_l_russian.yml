 bag_wtp_result_head_area: "Область"
 bag_wtp_result_head_bonus: "Сейчас"
 bag_wtp_result_head_bonus_tt: "Прибавка к эффективности от местного сырья — для лучшего здания, которое можно поставить уже сегодня.\n\nИгра считает её как 10% × (входы метода, которые даёт эта провинция) ÷ (все входы метода). В знаменатель идёт всё, включая то, чего не даст ни одна шахта и ни одно поле — например, инструменты, — поэтому потолок у многих методов сильно ниже десяти процентов.\n\nСчитается по всей провинции целиком. Пока её режет граница, игра считает только вашу половину и сегодняшнее число меньше; здесь — то, что вы получите, когда провинция станет вашей."
 bag_wtp_result_head_end: "В конце"
 bag_wtp_result_head_mid: "По пути"
 bag_wtp_result_head_mid_tt: "Лучшее, что эта земля вообще кормит — в любую эпоху, открыто вам здание или ещё нет, — и последняя эпоха, в которую его ещё можно построить.\n\nЭта колонка и решает, когда «В конце» везде 0.00%. Тонкое сукно — как раз такой случай: из шерсти оно заканчивается на мастерской, потому что мануфактура и фабрика берут только шёлк или сукно. Шерстяная провинция даёт десять процентов до пятой эпохи и ничего после — «5» об этом и говорит.\n\nКнопка «На конец» упорядочивает таблицу по «В конце» и разводит ничьи по этой колонке: сверху окажется провинция, которая лучше всех в конце, а среди равных — та, что лучше по дороге туда."
 bag_wtp_result_head_method: "Здание и метод (× за уровень)"
 bag_wtp_result_head_goods: "Из чего"

 bag_wtp_result_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_rank').GetValue|0]"
 bag_wtp_result_rank_tt: "Место, которое эта провинция заняла в ранжировании. Первое место — лучший эффективный выхлоп из найденных.\n\nНомер напечатан, а не подразумевается порядком строк, потому что это две разные вещи: ранжирует скрипт, а окно рисует список в том порядке, в каком список его хранит. Если номера не идут 1, 2, 3 сверху вниз — сбился список, а не ранжирование.\n\nЧисло, по которому сортировали эту строку: [Location.MakeScope.GetVariable('bag_wtp_best').GetValue|2] — выхлоп метода за уровень, умноженный на тысячу, с учётом прибавки. То же число для последней эпохи — [Location.MakeScope.GetVariable('bag_wtp_end_best').GetValue|2], а нажатие на заголовок «В конце» заставляет ранжирование слушать именно его. Если две строки стоят не по порядку, а эти два числа говорят, что должны, — виновата сортировка, а не копия."
 bag_wtp_result_pass_summary: "Обошёл [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] · нашёл [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0] · пересчётов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_live')|0]"
 bag_wtp_result_pass_tt: "Что сделал последний проход: сколько локаций обошёл, для скольких провинций нашёл строку и сколько раз выбор на карте пересчитывал таблицу с момента загрузки.\n\nТретье число — то, за чем стоит следить после выбора на карте. Если оно не растёт, выбор до пересчёта не дошёл, и таблица ниже отвечает на старый вопрос."
 bag_wtp_result_province_tt: "Провинция целиком, обе её половины, если она сейчас поделена границей. Строит игрок в одной из её локаций — раскройте строку."
 bag_wtp_result_bonus_tt: "Прибавка к эффективности производства от местного сырья.\n\nИгра считает её так: 10% × (сырьё метода, которое даёт провинция) ÷ (всё сырьё метода). В знаменатель входит и то, что рудник или ферма выдать не могут — инструменты, например, — поэтому у иных методов потолок заметно ниже десяти процентов.\n\nСчитается по всей провинции. Пока она поделена границей, игра считает вашу половину отдельно и число сегодня будет меньше; это же число вы получите, когда провинция станет вашей целиком."
 bag_wtp_result_method_tt: "Здание и тот метод производства, который здесь оказался лучшим из доступных вам сейчас, а «×» — сколько он производит за уровень здания.\n\nВерхняя строка — городские здания, нижняя — сельские (деревни). Считаются они порознь нарочно: у деревни один вид сырья и оттого лёгкие 10%, но производит она впятеро меньше, и в общем списке она затирала гильдии.\n\nСортировка идёт по выхлопу с учётом прибавки — по тому, сколько метод здесь на самом деле даст."
 bag_wtp_result_goods_tt: "Сырьё, которое провинция даёт этому методу, — то, из чего сложилась прибавка.\n\nЧисло слева: сколько видов сырья метода провинция даёт из скольких могла бы. Чего здесь нет, того провинция не добывает нигде, и ровно на эту долю прибавка ниже потолка метода."
 bag_wtp_result_expand_tt: "Показать локации провинции."
 bag_wtp_result_head_end_tt: "Что та же провинция даст, когда открыто уже всё, — лучший из методов, которые ничто не устаревает.\n\nЛестница у игры своя: гильдия → мастерская → мануфактура → мельница, и вдоль неё меняется не только выпуск, но и сырьё. Бронзовым пушкам нужны медь и олово; пушечной фабрике, которая их заменит, — свинец и селитра. Бумага начинает с сукна, а заканчивает чистым лесом. У 14 товаров из 42 состав входов вдоль лестницы сдвигается, у 5 — меняется полностью, и для них провинция под гильдию и провинция под мельницу — разные провинции.\n\n0.00% — это тоже ответ, и частый: значит ни один рецепт, доживающий до последней эпохи, этой землёй не кормится. Пример — тонкое сукно из шерсти: мануфактура и мельница берут только шёлк или сукно, так что у шерстяной провинции ответа по тонкому сукну просто не остаётся, как только мастерская устареет."
 bag_wtp_result_end_tt: "Что провинция даст в последнюю эпоху: [Location.MakeScope.GetVariable('bag_wtp_end_bt').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out').GetValue|2] за уровень, при [Location.MakeScope.GetVariable('bag_wtp_end_bonus').GetValue|2]% — собрано из [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods'))] сырья из [Location.MakeScope.GetVariable('bag_wtp_end_goods_all').GetValue|0], которые методу нужны.\n\nЭто здание здесь не проверяется на ваши эпохи: это то, что будет стоять, когда его ничто не устареет. Колонка слева — то, что можно построить сейчас.\n\nЕсли стоит 0.00% — земля не даёт этому рецепту ничего: он работал бы на привозном, и игра скорее запустит другой."
 bag_wtp_result_end_tt_rural: "Что даст сельская земля в последнюю эпоху: [Location.MakeScope.GetVariable('bag_wtp_end_bt_rural').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm_rural').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out_rural').GetValue|2] за уровень, при [Location.MakeScope.GetVariable('bag_wtp_end_bonus_rural').GetValue|2]% — собрано из [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods_rural'))] сырья из [Location.MakeScope.GetVariable('bag_wtp_end_goods_all_rural').GetValue|0].\n\nОбычно пусто: деревню ничто не устаревает, так что её сегодняшний ответ и есть ответ в конце игры."
 bag_wtp_result_collapse_tt: "Скрыть локации провинции."


 bag_wtp_log_run: "Где производить: локации ранжированы"

 bag_wtp_select_summary: "Выбрано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_picked')|0] лок. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_browse')|0] пров."
 bag_wtp_picker_hint: "Клик переключает. Панель закрывается после каждого выбора — это её устройство, а не ошибка. Окно результата под ней пересчитывается само после каждого клика."

 bag_wtp_map_pick_area: "Выбрать область"
 bag_wtp_map_pick_area_desc: "Панель выбора области: список с поиском и клик по карте. Клик переключает — область входит в план или выходит из него."
 bag_wtp_map_pick_province: "Выбрать провинцию"
 bag_wtp_map_pick_province_desc: "То же, по одной провинции. Клик переключает все её сухопутные локации разом."
 bag_wtp_map_pick_location: "Выбрать локацию"
 bag_wtp_map_pick_location_desc: "То же, по одной локации — чтобы подровнять края плана, нарисованного областями."
 bag_wtp_map_pick_market: "Выбрать рынок"
 bag_wtp_map_pick_market_desc: "Вся земля рынка разом, из списка рынков, в которые входит ваша страна. Рынок на карте не нарисован, поэтому у этой кнопки клика по карте нет. Для державы, в которой рынков несколько и баланс производства хочется держать по каждому отдельно."
 bag_wtp_choose_area: "Выберите область"
 bag_wtp_choose_area_tt: "Кликните по области на карте или в списке. Она войдёт в план, а если уже входила — выйдет."
 bag_wtp_choose_province: "Выберите провинцию"
 bag_wtp_choose_province_tt: "Кликните по провинции на карте или в списке. Её сухопутные локации войдут в план, а если уже входили — выйдут."
 bag_wtp_choose_location: "Выберите локацию"
 bag_wtp_choose_location_tt: "Кликните по локации на карте или в списке. Она войдёт в план, а если уже входила — выйдет."
 bag_wtp_choose_market: "Выберите рынок"
 bag_wtp_choose_market_tt: "Выберите рынок из списка. Все его сухопутные локации войдут в план, а если уже входили — выйдут."
 bag_wtp_no_markets: "Ваша страна не входит ни в один рынок."


 bag_wtp_add_location: "Добавить"
 bag_wtp_add_location_tt: "Взять эту локацию в план."
 bag_wtp_remove_location: "Убрать"
 bag_wtp_remove_location_tt: "Убрать эту локацию из плана."
 bag_wtp_clear_all: "Очистить выбор"
 bag_wtp_clear_all_tt: "Очистить план целиком."

 mapmode_bag_wtp_selection_name: "Где производить"
 mapmode_bag_wtp_selection_desc: "Ярким — выбранное в план, тусклым — то, из чего выбираете."
 bag_wtp_map_picked_tt: "Выбрано в план."
 bag_wtp_map_browsable_tt: "Внутри отмеченных континентов, не выбрано."
 bag_wtp_map_outside_tt: "Вне отмеченных континентов."
 bag_wtp_map_legend_picked: "Выбрано"
 bag_wtp_map_legend_browsable: "Можно выбрать"


 bag_wtp__plan__plan_name: "4. Общий план"
 bag_wtp__plan_cap_rural_name: "Товаров на сельскую локацию"
 bag_wtp__plan_cap_rural_desc: "Сколько зданий план ставит в одну сельскую локацию.\n\nВ игре нет числа слотов, которое мод мог бы прочитать: «макс. уровней» у здания — это его собственная линейка, а не предел на то, сколько зданий стоит рядом. Так что это ваша цифра, а не игры. Выбирайте её по тому, что она даёт: кнопка ниже печатает вместимость выбранной земли рядом с числом товаров, которые в неё просятся."
 bag_wtp__plan_cap_urban_name: "Товаров на город"
 bag_wtp__plan_cap_urban_desc: "То же для всего, что не является сельской местностью. В городе умещается больше линеек домиков, чем в деревне, — поэтому это отдельное число."
 bag_wtp__plan_rights_name: "Планировать города по городским правам"
 bag_wtp__plan_rights_desc: "Включено по умолчанию. Городское право поднимает два-три товара сразу — а это ровно форма городского списка, поэтому право не соревнуется с товарами за места: оно забирает городской список первым, раньше любого отдельного товара.\n\n**Право получает каждый город.** Не «если повезёт»: есть город — есть и право. Городу достаётся то право, которому его земля подходит лучше всего среди тех, что ваша держава вообще может выдать и из которых город может сделать хотя бы один товар.\n\n**Связка ставится целиком, насколько земля позволяет.** Товар связки, который здесь построить нельзя — скажем, пушки без нужной технологии, — просто не встанет, и его ячейка уйдёт обычному товару. Город не остаётся с пустыми ячейками никогда.\n\nКакое право достанется городу, спрашивается у города, а не у прав: их дюжина, а городов в плане обычно больше, и очередь между правами решала бы всё сама по себе. Одно и то же право, выданное много раз, дешевеет — поэтому права расходятся по земле, а не сваливаются в одну грамоту.\n\nВыключено: города планируются отдельными товарами, как и сёла."
 bag_wtp__plan_run_name: "Составить общий план на сейчас"
 bag_wtp__plan_run_text: "План"
 bag_wtp__plan_run_desc: "Все товары сразу по выбранной земле, в пределах лимитов выше. Галочка на вкладке «Товар» здесь не читается: план считается по всем.\n\n**Как он решает, по шагам.**\n\n1. Оценить каждый товар в каждой локации: лучший метод, чьё здание там действительно может стоять, который земля кормит и который вам доступен, — выход, умноженный на бонус от местного сырья.\n2. Поделить каждый товар на его же лучший результат на этой земле, чтобы товар с потолком в 5% честно сравнивался с товаром с потолком в 10%. И поделить ещё раз — на то, сколько этого товара план уже поставил в эту провинцию: все локации провинции стоят для товара ровно одинаково, поэтому без этого деления товар забирает всю лучшую провинцию целиком, а её локации выходят одинаковыми.\n3. Раздать городские права — только городам, но каждому и обязательно: город берёт то право, под которое его земля подходит лучше всего, и получает все здания его связки. Право даёт +20…50% выхода там, где весь бонус от сырья — это полоса в 10%, так что в городе это самое крупное, что есть. Если связка в лимит не влезает — город кончается на ней, и это видно.\n4. Посчитать норму: сколько мест осталось, делённое на число товаров, которые тут вообще можно делать, минус уже стоящие РГО этого товара, но не меньше единицы. Дальше раздавать кругами, дефицитные товары первыми: товар, который влезает лишь в пару мест, занимает своё место раньше, чем распространённый возьмёт второе. Каждый товар берёт по одной локации за круг и останавливается на своей норме; последний проход снимает норму и добивает пустое.\n5. В локации стоит одно здание каждого типа, поэтому товар, чьё здание там уже стоит, второй раз не предлагается — но соседняя локация может взять то же здание с другим методом производства.\n6. Круги идут, пока очередной не добавит ничего нигде, — чтобы ничего, что земля может прокормить, не осталось пустым.\n\nЧто сделал последний план:\n\nЛокаций рассмотрено: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0]\nМест в них: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0]\nТоваров, которые тут можно делать: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0]\nГородских прав выдано: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rightn')|0]\nЗданий размещено: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0]\nЛокаций занято: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0]\n\nЭто считает сам проход, и первый ноль среди них — это и есть диагноз."
 bag_wtp__plan_show_name: "Показать план"
 bag_wtp__plan_show_text: "Открыть"
 bag_wtp__plan_show_desc: "Открывает последний план в своём окне: по строке на каждую локацию, куда что-то поставлено, самые загруженные сверху, с товарами, которые им достались.\n\nТот же ответ есть на карте — в режимах карты «Экономика» выберите «Где производить — план»."
 bag_wtp__plan__edit_name: "Правка готового плана"
 bag_wtp__edit_add_name: "Добавить домик"
 bag_wtp__edit_add_text: "+1"
 bag_wtp__edit_add_desc: "Ставит **один** домик выбранного товара — и больше не меняет ничего.\n\nМод перебирает все локации и спрашивает у каждой, во что обойдётся туда этот товар: свободная комната обходится бесплатно, занятая — в выгоду того домика, который придётся снять. Побеждает самая дешёвая. Один домик за нажатие, весь остальной план остаётся на месте.\n\n**Снять нельзя два вида домиков:** последний домик своего товара на всей земле и домик из связки грамоты, выданной этому городу.\n\nПлан не пересчитывается. Изменилось локаций с прошлого сохранения: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_moved')|0]"
 bag_wtp__edit_drop_name: "Убрать домик"
 bag_wtp__edit_drop_text: "−1"
 bag_wtp__edit_drop_desc: "Снимает **один** домик выбранного товара — тот, где он стоит хуже всего, — и отдаёт освободившуюся комнату тому товару, которому она подходит лучше прочих.\n\nПоследний домик товара не снимается никогда."
 bag_wtp__edit_changes_name: "Показать изменения"
 bag_wtp__edit_changes_text: "Показать"
 bag_wtp__edit_changes_desc: "Пишет в лог список локаций, где план отличается от сохранённого, и ничего кроме них. Достать: `mods.bat → 8`.\n\nПосле одной правки это две строки. После «Пересчитать» — ни одной: свежий план сохраняется сам и становится новой точкой отсчёта.\n\nОтличается локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_moved')|0]"
 bag_wtp__edit_save_name: "Сохранить план"
 bag_wtp__edit_save_text: "Сохранить"
 bag_wtp__edit_save_desc: "Запоминает план как он есть сейчас. С этого момента «Показать изменения» считает от него, а «Вернуть сохранённое» возвращает именно его.\n\nСвежий план сохраняется сам, так что эта кнопка нужна, когда вы хотите закрепить уже отредактированное.\n\nВ сохранении домиков: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_saved')|0]"
 bag_wtp__edit_restore_name: "Вернуть сохранённое"
 bag_wtp__edit_restore_text: "Вернуть"
