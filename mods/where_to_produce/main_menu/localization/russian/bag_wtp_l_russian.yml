 bag_wtp_result_rank_value: "[Location.MakeScope.GetVariable('bag_wtp_rank').GetValue|0]"
 bag_wtp_result_rank_tt: "Место, которое эта провинция заняла в ранжировании. Первое место — лучший эффективный выхлоп из найденных.\n\nНомер напечатан, а не подразумевается порядком строк, потому что это две разные вещи: ранжирует скрипт, а окно рисует список в том порядке, в каком список его хранит. Если номера не идут 1, 2, 3 сверху вниз — сбился список, а не ранжирование.\n\nЧисло, по которому сортировали эту строку: [Location.MakeScope.GetVariable('bag_wtp_best').GetValue|2] — выхлоп метода за уровень, умноженный на тысячу, с учётом прибавки. То же число для последней эпохи — [Location.MakeScope.GetVariable('bag_wtp_end_best').GetValue|2], и галка «Ранжировать по последней эпохе» на вкладке «Ответ» заставляет ранжирование слушать именно его. Если две строки стоят не по порядку, а эти два числа говорят, что должны, — виновата сортировка, а не копия."
 bag_wtp_result_pass_summary: "Обошёл [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] · нашёл [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_found')|0] · пересчётов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_live')|0]"
 bag_wtp_result_pass_tt: "Что сделал последний проход: сколько локаций обошёл, для скольких провинций нашёл строку и сколько раз выбор на карте пересчитывал таблицу с момента загрузки.\n\nТретье число — то, за чем стоит следить после выбора на карте. Если оно не растёт, выбор до пересчёта не дошёл, и таблица ниже отвечает на старый вопрос."
 bag_wtp_result_province_tt: "Провинция целиком, обе её половины, если она сейчас поделена границей. Строит игрок в одной из её локаций — раскройте строку."
 bag_wtp_result_bonus_tt: "Прибавка к эффективности производства от местного сырья.\n\nИгра считает её так: 10% × (сырьё метода, которое даёт провинция) ÷ (всё сырьё метода). В знаменатель входит и то, что рудник или ферма выдать не могут — инструменты, например, — поэтому у иных методов потолок заметно ниже десяти процентов.\n\nСчитается по всей провинции. Пока она поделена границей, игра считает вашу половину отдельно и число сегодня будет меньше; это же число вы получите, когда провинция станет вашей целиком."
 bag_wtp_result_method_tt: "Здание и тот метод производства, который здесь оказался лучшим из доступных вам сейчас, а «×» — сколько он производит за уровень здания.\n\nВерхняя строка — городские здания, нижняя — сельские (деревни). Считаются они порознь нарочно: у деревни один вид сырья и оттого лёгкие 10%, но производит она впятеро меньше, и в общем списке она затирала гильдии.\n\nСортировка идёт по выхлопу с учётом прибавки — по тому, сколько метод здесь на самом деле даст."
 bag_wtp_result_goods_tt: "Сырьё, которое провинция даёт этому методу, — то, из чего сложилась прибавка.\n\nЧисло слева: сколько видов сырья метода провинция даёт из скольких могла бы. Чего здесь нет, того провинция не добывает нигде, и ровно на эту долю прибавка ниже потолка метода."
 bag_wtp_result_expand_tt: "Показать локации провинции."
 bag_wtp_result_head_end_tt: "Что та же провинция даст, когда открыто уже всё, — лучший из методов, которые ничто не устаревает.\n\nЛестница у игры своя: гильдия → мастерская → мануфактура → мельница, и вдоль неё меняется не только выпуск, но и сырьё. Бронзовым пушкам нужны медь и олово; пушечной фабрике, которая их заменит, — свинец и селитра. Бумага начинает с сукна, а заканчивает чистым лесом. У 14 товаров из 42 состав входов вдоль лестницы сдвигается, у 5 — меняется полностью, и для них провинция под гильдию и провинция под мельницу — разные провинции.\n\nПусто — значит обе эпохи согласны: здесь и сейчас, и в конце выигрывает один и тот же метод.\n\nГалка «Ранжировать по последней эпохе» на вкладке «Ответ» сортирует таблицу по этой колонке."
 bag_wtp_result_end_tt: "Что провинция даст в последнюю эпоху: [Location.MakeScope.GetVariable('bag_wtp_end_bt').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out').GetValue|2] за уровень, при [Location.MakeScope.GetVariable('bag_wtp_end_bonus').GetValue|2]% — собрано из [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods'))] сырья из [Location.MakeScope.GetVariable('bag_wtp_end_goods_all').GetValue|0], которые методу нужны.\n\nЭто здание здесь не проверяется на ваши эпохи: это то, что будет стоять, когда его ничто не устареет. Левая колонка — то, что можно построить сейчас."
 bag_wtp_result_end_tt_rural: "Что даст сельская земля в последнюю эпоху: [Location.MakeScope.GetVariable('bag_wtp_end_bt_rural').GetBuildingType.GetName], [Location.MakeScope.GetVariable('bag_wtp_end_pm_rural').GetProductionMethod.GetName], ×[Location.MakeScope.GetVariable('bag_wtp_end_out_rural').GetValue|2] за уровень, при [Location.MakeScope.GetVariable('bag_wtp_end_bonus_rural').GetValue|2]% — собрано из [GetDataModelSize(Location.MakeScope.GetList('bag_wtp_end_goods_rural'))] сырья из [Location.MakeScope.GetVariable('bag_wtp_end_goods_all_rural').GetValue|0].\n\nОбычно пусто: деревню ничто не устаревает, так что её сегодняшний ответ и есть ответ в конце игры."
 bag_wtp_result_collapse_tt: "Скрыть локации провинции."


