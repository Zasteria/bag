 eu5ab_new_template_plus_button: "+ Новый шаблон"
 eu5ab_custom_empty_detail: "Выберите свой шаблон слева или создайте новый."
 eu5ab_template_intro_title: "Редактор шаблонов"
 eu5ab_automation_buildings_intro: "Свои шаблоны можно править и назначать как угодно. Встроенные наборы дают рекомендованные правила только для чтения; чтобы править, скопируйте набор в свой шаблон."
 eu5ab_player_templates_button: "Шаблоны игрока"
 eu5ab_copy_preset_to_player_button: "Скопировать в шаблон игрока"
 eu5ab_delete_template_button: "Удалить шаблон"
 eu5ab_delete_template_tooltip: "Открыть подтверждение удаления. Подтверждение удалит этот свой шаблон и снимет его со всех привязанных локаций."
 eu5ab_delete_template_confirm_prompt: "Удалить текущий шаблон?"
 eu5ab_delete_template_confirm_button: "Удалить"
 eu5ab_delete_template_confirm_tooltip: "Безвозвратно удалить текущий шаблон и все его привязки к локациям. Отменить это будет нельзя."
 eu5ab_delete_template_cancel_button: "Отмена"
 eu5ab_delete_template_cancel_tooltip: "Отменить удаление и вернуться к действиям с шаблоном."
 eu5ab_pause_template_button: "Приостановить шаблон"
 eu5ab_resume_template_button: "Возобновить шаблон"
 eu5ab_template_paused_badge: " (приостановлен)"
 eu5ab_pause_template_tooltip: "Временно приостановить или возобновить этот шаблон. Приоритеты зданий и привязки локаций сохраняются, но автостроительство их не использует."
 eu5ab_select_template_tooltip: "Выбрать этот шаблон и посмотреть подробности его правил."
 eu5ab_preset_readonly_desc: "Этот встроенный набор доступен только для чтения, но его можно приостанавливать, возобновлять и назначать отдельно. Чтобы править приоритеты зданий, скопируйте его в свой шаблон. Общие правила меняются в настройках модов Community Mod Framework."
 eu5ab_template_name_pencil_hint: "Название шаблона"
 eu5ab_template_name_click_hint: "Нажмите на название, чтобы переименовать"
 eu5ab_template_name_click_tooltip: "Введите новое название текущего шаблона."
 eu5ab_template_rename_desc: "Введите новое название текущего шаблона. Свой текст показывается только в этой сессии; остальные настройки шаблона сохраняются."
 eu5ab_template_rename_input: "Название шаблона"
 eu5ab_template_rename_accept: "Подтвердить"
 eu5ab_template_rename_cancel: "Отмена"
 eu5ab_target_location_title: "Целевая локация"
 eu5ab_target_location_desc: "Действия «очистить» и «отвязать» открывают выбор локации. Чтобы применить шаблон, используйте кнопки выбора на его карточке."
 eu5ab_template_editor_desc: "Назовите шаблон и настройте приоритеты зданий. Общие правила бюджета, рынка, рабочей силы и предохранителей — в настройках модов Community Mod Framework."
 eu5ab_template_auto_save_hint: "Изменения сохраняются сразу. Закройте окно, чтобы вернуться."
 eu5ab_rules_tab_finance: "Финансы и строительство"
 eu5ab_rules_tab_automation: "Рабочая сила и предпочтения по зданиям"
 eu5ab_rules_tab_diagnostics: "Ход работы"
 eu5ab_template_editor_sections_title: "Данные шаблона"
 eu5ab_template_editor_sections_desc: "Шаблон хранит только состояние, охват и приоритеты зданий; диагностика работы открывается отдельно."
 eu5ab_open_buildings_editor_button: "Правила застройки"
 eu5ab_open_rules_editor_button: "Диагностика работы"
 eu5ab_edit_template_button: "Правка"
 eu5ab_copy_to_slot_button: "Скопировать в этот слот"
 eu5ab_policy_section_title: "Правила шаблона"
 eu5ab_cash_section_title: "Резерв казны"
 eu5ab_cash_short_desc: "Минимальный остаток, который должен остаться в казне."
 eu5ab_cash_label: "Резерв казны"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] золота"
 eu5ab_cash_help: "Резерв казны — это минимальный остаток, который должен сохраниться после начала стройки; отдельно он не списывается. Проект отклоняется, если после его оплаты в казне осталось бы меньше этой суммы. Пример: в казне 1050 золота, резерв 1000, проект стоит 100 — стройка не начнётся."
 eu5ab_budget_section_title: "Годовой бюджет стратегии"
 eu5ab_budget_short_desc: "Либо фиксированная сумма, либо привязка к месячному доходу; режимы исключают друг друга."
 eu5ab_budget_mode_fixed: "Фиксированный бюджет"
 eu5ab_budget_mode_income: "Привязка к доходу"
 eu5ab_budget_multiplier_4: "×4, осторожно"
 eu5ab_budget_multiplier_6: "×6, рекомендуется"
 eu5ab_budget_multiplier_8: "×8, активно"
 eu5ab_budget_effective_label: "Бюджет этого года"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] золота"
 eu5ab_budget_label: "Годовой бюджет"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] золота в год"
 eu5ab_budget_cash_comparison: "Годовой бюджет стратегии ограничивает, сколько мод готов потратить за год; резерв казны ограничивает, как мало денег может остаться у страны. Выполняться должны оба условия."
 eu5ab_budget_reset_note: "Фиксированный режим и привязка к доходу исключают друг друга. Бюджет обновляется при первой январской проверке и списывается только после того, как проект попал в очередь."
 eu5ab_budget_help: "Все встроенные наборы и свои шаблоны делят один общий годовой запас на страну. Выберите фиксированную сумму за год или месячный совокупный доход, умноженный на 4, 6 или 8. Сумма при привязке к доходу берётся при первой январской проверке и остаётся неизменной весь год. Для обычных зданий берётся настоящая цена игры, для добычи сырья — базовая цена, сверенная с ванильной таблицей цен при генерации. Бюджет списывается только после того, как проект попал в очередь строительства."
 eu5ab_quota_section_title: "Предел одновременных строек мода"
 eu5ab_quota_short_desc: "Сколько гражданских проектов мод может вести одновременно сверх базового места."
 eu5ab_hard_cap_label: "Дополнительные одновременные проекты"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] проектов (общий предел — это число + 1)"
 eu5ab_quota_help: "0 означает, что мод ведёт не больше 1 гражданского проекта одновременно, 599 — не больше 600. Эти места занимают только проекты, подтверждённые модом и ещё строящиеся; ручные стройки, дороги и проекты других модов не учитываются. Каждая месячная проверка заполняет только оставшиеся места самого мода. Реальное число начатых строек может оказаться меньше из-за охвата, годового бюджета, резерва казны, состояния финансов и требований зданий. Мод ведёт не больше одного проекта на локацию, а на добычу сырья отдельного месячного предела нет."
 eu5ab_template_cash_value: "Резерв казны: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_step_dec_10k: "-10K"
 eu5ab_step_dec_1k: "-1K"
 eu5ab_step_inc_1k: "+1K"
 eu5ab_step_inc_10k: "+10K"
 eu5ab_step_dec_10: "-10"
 eu5ab_step_dec_1: "-1"
 eu5ab_step_inc_1: "+1"
 eu5ab_step_inc_10: "+10"
 eu5ab_step_dec_5: "-5"
 eu5ab_step_inc_5: "+5"
 eu5ab_step_dec_100: "-100"
 eu5ab_step_inc_100: "+100"
 eu5ab_building_rules_title: "Правила застройки"
 eu5ab_building_rules_desc: "Верхний ряд отбирает по рабочей силе, нижний — по эпохе открытия. Приоритет — от 0.0 до 10.0 с шагом 0.1; 0 запрещает стройку. На вкладке «Особые» показаны только особые здания, которые страна действительно может построить хотя бы в одной своей локации."
 eu5ab_allow_button: "Разрешить"
 eu5ab_ban_button: "Запретить"
 eu5ab_priority_decrease: "−"
 eu5ab_priority_increase: "+"
 eu5ab_priority_scale_hint: "0.0 — запрещено; 0.1–10.0 — разрешено и ранжируется по значению"
 eu5ab_priority_low: "Низкий"
 eu5ab_priority_medium: "Средний"
 eu5ab_priority_high: "Высокий"
 eu5ab_priority_high_icon: "↑"
 eu5ab_priority_medium_icon: "–"
 eu5ab_priority_low_icon: "↓"
 eu5ab_ban_icon: "×"
 eu5ab_filter_all: "Все"
 eu5ab_filter_rural: "Сельские"
 eu5ab_filter_laborers: "Работники"
 eu5ab_filter_burghers: "Горожане"
 eu5ab_filter_soldiers: "Военные"
 eu5ab_filter_special: "Особые"
 eu5ab_age_all: "Все эпохи"
 eu5ab_building_age_1: "Эпоха традиций"
 eu5ab_building_age_2: "Эпоха Возрождения"
 eu5ab_building_age_3: "Эпоха открытий"
 eu5ab_building_age_4: "Эпоха Реформации"
 eu5ab_building_age_5: "Эпоха абсолютизма"
 eu5ab_building_age_6: "Эпоха революций"
 eu5ab_status_enabled: "#G Включено#!"
 eu5ab_status_disabled: "#L Выключено#!"
 eu5ab_status_currently_available: "#G Доступно#!"
 eu5ab_operating_rules_title: "Правила строительства"
 eu5ab_operating_rules_short_desc: "Настройка особых зданий, застройки поставщиков и нехватки сырья."
 eu5ab_operating_rules_help: "Особые здания всё равно должны удовлетворять условиям стройки самой игры. Если включено «Строить поставщиков при нехватке сырья», мод ищет среди разрешённых шаблоном зданий поставщика для того сырья, из-за нехватки которого запланированное обычное здание не прошло. Если включено «Останавливать расширение при критической нехватке сырья», проекты со слишком большим риском по сырью не начинаются."
 eu5ab_rgo_section_title: "Добыча сырья"
 eu5ab_rgo_allow: "Разрешить этому шаблону расширять добычу сырья"
 eu5ab_rgo_short_desc: "Добыча сырья всё равно проходит проверки самой игры, загруженности, бюджета и резерва."
 eu5ab_rgo_utilization_label: "Минимальная загруженность"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "«Разрешить расширение добычи» решает, рассматривает ли этот шаблон сырьевые проекты. Добыча всё равно должна проходить правила стройки самой игры, минимальную загруженность, годовой бюджет и резерв казны. Когда именно проверяется добыча, задаёт порядок автостроительства. Локации добычи ранжируются напрямую по нехватке сырья, цене, загруженности и стратегической нужде — без отдельного веса и без месячного предела. Минимальная загруженность не даёт расширять добычу, которой и так не хватает работников."
 eu5ab_toggle_special_buildings: "Разрешить особые здания"
 eu5ab_toggle_auto_build_input_sources: "Строить поставщиков при нехватке сырья"
 eu5ab_toggle_pause_low_workforce: "Приостанавливать расширение при нехватке рабочей силы"
 eu5ab_workforce_section_title: "Рабочая сила"
 eu5ab_pause_workforce_short_desc: "Решает, запрещает ли риск по рабочей силе расширение полностью."
 eu5ab_job_fill_deadline_label: "Срок заполнения рабочих мест"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_value: "Срок заполнения рабочих мест: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_desc: "Срок заполнения — это самое долгое ожидание, которое система допускает для новых рабочих мест; настраивается от 0 до 96 месяцев. 0 месяцев означает, что принимаются только проекты, которые тянет нынешняя рабочая сила. Если приостановка по рабочей силе включена, проекты, выходящие за срок, не начинаются. Если выключена — риск по рабочей силе лишь понижает их приоритет."
 eu5ab_deadline_0: "0 мес."
 eu5ab_deadline_3: "3 мес."
 eu5ab_deadline_6: "6 мес."
 eu5ab_deadline_12: "12 мес."
 eu5ab_toggle_stop_input_shortage: "Останавливать расширение при критической нехватке сырья"
 eu5ab_prediction_status_label: "Прогноз рабочей силы"
 eu5ab_status_promotion_forecast: "#G Прогноз перехода населения на выбранный срок#!"
 eu5ab_status_conservative_fallback: "#L Запасной расчёт по нынешней рабочей силе#!"
 eu5ab_prediction_promotion_short_desc: "Учитывает и тех, кто успеет перейти в нужный тип населения в пределах выбранного срока, но не дальше 96 месяцев."
 eu5ab_prediction_unavailable_short_desc: "Берёт осторожную оценку по уже доступным работникам, а не выдуманные будущие цифры перехода населения и миграции."
 eu5ab_workforce_help: "Если приостановка по рабочей силе включена, проект не начинается, когда его рабочие места, по расчёту, не заполнятся к сроку; если выключена — тот же риск лишь понижает приоритет стройки. Прогноз на 0–96 месяцев исходит из уже доступных работников, а затем учитывает местную и общегосударственную скорость перехода населения, коэффициент перехода нужного типа населения и запас подходящего исходного населения. Прогноз ограничен этим реальным запасом и не рассчитывает на будущую миграцию, поэтому остаётся осторожным."
 eu5ab_native_input_section_title: "Предпочтение местному сырью"
 eu5ab_native_input_short_desc: "Поднимает производственные здания, чьё сырьё есть в той же провинции."
 eu5ab_native_input_priority_label: "Приоритет местного сырья"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Приоритет местного сырья: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Местное — это провинция, в которой стоит здание. Система смотрит, какое сырьё требует рецепт здания и есть ли в этой провинции подходящая добыча; чем большую долю рецепта занимает найденное сырьё, тем больше очков в ранжировании. 0 — не смотреть на местное сырьё вовсе, 5 — значение по умолчанию, 10 — наибольший вес. Настройка меняет только ранжирование проектов, поэтому из-за других нехваток, прибыли, рабочей силы или условий стройки победить всё равно может другое здание. Проверяется само наличие подходящей добычи, а не её уровень и не реальный выход. Нехватка сырья, плохой доступ к рынку и низкий контроль уменьшают прибавку. Самой добыче сырья она не даётся."
 eu5ab_price_section_title: "Диапазон цен"
 eu5ab_price_short_desc: "Отбирает и ранжирует производственные здания по рыночной цене."
 eu5ab_price_min_label: "Минимальная цена"
 eu5ab_price_max_label: "Максимальная цена"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Цена измеряется в процентах от базовой цены товара. Производственное здание отбрасывается, если цена его товара ниже минимума, и получает прибавку за дефицит, если цена выше максимума. Инфраструктуру без собственного товара этот диапазон не отсекает."
 eu5ab_active_cash_value: "Резерв казны: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Минимальная цена: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Максимальная цена: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Минимальная цена: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Максимальная цена: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Правила автостроительства"
 eu5ab_prediction_diagnostics_title: "Прогноз рабочей силы и ход работы"
 eu5ab_prediction_section_body: "Мод перебирает улучшения, расширения обычных зданий, расширения добычи сырья и новые здания в заданном порядке автостроительства. Он не переходит к следующему типу, пока у текущего есть проект, который можно начать. Когда еда, по расчёту, кончается или её осталось 25% и меньше, продовольственные проекты идут прежде остальных, а обычным продовольственным зданиям не нужно давать выбранную отдачу. Сильная нехватка стройматериалов, военных товаров в войну или сырья для стратегического производства тоже может снять требование отдачи с подходящих зданий, но вперёд других типов стройки их не выводит. Годовой бюджет, резерв казны, стройматериалы, рабочая сила и правила стройки самой игры действуют всегда. Рассматривается только новейший открытый уровень, а у улучшений считаются только новые рабочие места."
 eu5ab_diagnostics_title: "Ход работы"
 eu5ab_diagnostics_snapshot_note: "Настройки сохраняются сразу; данные о работе обновляются после месячной проверки."
 eu5ab_diagnostics_snapshot_help: "Настройки сохраняются сразу, но на этой странице показана предыдущая проверка, завершённая 22-го числа, а не текущие данные. Указаны точный год, месяц и дата проверки. После изменения охвата, очереди или настроек дождитесь следующей месячной проверки — тогда обновятся лимиты, результаты, отказы и порядок проектов."
