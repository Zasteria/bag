 eu5ab_diag_result_help: "Когда еда, по расчёту, кончается или её осталось 25% и меньше, продовольственные проекты проверяются первыми. В остальное время проекты проверяются в заданном порядке автостроительства. Если обычное здание не проходит по цене, отдаче или условиям стройки самой игры, мод ищет другой проект того же типа. Расширение добычи сырья проверяет ванильные условия стройки и резервирует базовую цену, сверенную с ванильной таблицей цен при генерации; локации добычи ранжируются по нехватке сырья, цене, загруженности и стратегической нужде. Проект считается успешным и тратит бюджет и одно из одновременных мест мода только после того, как он действительно попал в очередь строительства."
 eu5ab_diag_failure_short_desc: "Очищается каждой месячной проверкой; хранится только предыдущая."
 eu5ab_diag_failure_help: "На этой странице показана только прошлая месячная проверка; счётчики не переносятся на следующие месяцы. Отдельно учитываются проекты, отклонённые из-за рабочей силы, сырья для производства, перепроизводства, бюджета, резерва казны, отдачи ниже выбранной, слишком дорогих или уже разобранных в этом месяце стройматериалов и правил стройки самой игры."
