 eu5ab_scope_map_other_tt: "Эта локация использует другой шаблон этого мода."
 eu5ab_scope_map_unassigned_tt: "У этой локации нет шаблона из этого мода."
 eu5ab_template_conflict_replace_desc: "В выборе показаны только те единицы, которые ещё не привязаны к правилам этого мода. Уже назначенное внутри провинции или области остаётся как есть и не показывается."
 eu5ab_open_panel_tooltip: "Открыть панель правил развития региона."
 eu5ab_open_regional_development_policy: "Этот мод: управление автостроительством"
 eu5ab_open_regional_development_policy_desc: "Выберите «Продвинутое автостроительство» в настройках модов Community Mod Framework."
 eu5ab_set_cash_reserve_0: "Этот мод: резерв казны 0"
 eu5ab_set_cash_reserve_0_desc: "Установить для автостроительства в этой локации резерв казны 0."
 eu5ab_set_cash_reserve_500: "Этот мод: резерв казны 500"
 eu5ab_set_cash_reserve_500_desc: "Установить для автостроительства в этой локации резерв казны 500."
 eu5ab_set_cash_reserve_1000: "Этот мод: резерв казны 1000"
 eu5ab_set_cash_reserve_1000_desc: "Установить для автостроительства в этой локации резерв казны 1000."
 eu5ab_set_cash_reserve_2000: "Этот мод: резерв казны 2000"
 eu5ab_set_cash_reserve_2000_desc: "Установить для автостроительства в этой локации резерв казны 2000."
 eu5ab_enable_special_buildings_for_location: "Этот мод: разрешить особые здания"
 eu5ab_enable_special_buildings_for_location_desc: "Разрешить автостроительству возводить и улучшать особые здания в выбранной локации."
 eu5ab_disable_special_buildings_for_location: "Этот мод: запретить особые здания"
 eu5ab_disable_special_buildings_for_location_desc: "Запретить автостроительству возводить и улучшать особые здания в выбранной локации."
 eu5ab_decouple_selected_location: "Этот мод: отвязать локацию"
 eu5ab_decouple_selected_location_desc: "Перестать применять к выбранной локации обновления шаблона её провинции."
 eu5ab_clear_selected_location_policy: "Этот мод: снять правила с локации"
 eu5ab_clear_selected_location_policy_desc: "Выберите локацию, чтобы убрать из этого мода её шаблон, резерв казны, правила застройки и правила работы."
 eu5ab_regional_development_name: "Продвинутое автостроительство"
 eu5ab_regional_development_desc: "Общие для страны правила работы, действующие для всех встроенных наборов и своих шаблонов. Сам шаблон хранит только состояние, охват и приоритеты зданий."
 eu5ab_regional_development__general_name: "Главные переключатели и пределы"
 eu5ab_regional_development__finance_name: "Финансы и рынок"
 eu5ab_regional_development__automation_name: "Предохранители и ранжирование"
 eu5ab_regional_development__performance_name: "Оптимизация быстродействия"
 eu5ab_regional_development__performance__preset_name: "Набор быстродействия"
 eu5ab_regional_development__performance__preset_desc: "Выберите профиль обхода. Если менять расширенную настройку вручную, набор переключится на «Свой». Изменения вступают в силу со следующего обхода."
 eu5ab_regional_development__performance__advanced_name: "Расширенные настройки"
 eu5ab_regional_development__performance__advanced_desc: "Управление независимыми задачами по локациям, дневной работой, пределом добавлений за проход и досрочной остановкой, когда запас кандидатов уже достаточен."
 eu5ab_regional_development__general__limits_name: "Главные переключатели и предел одновременных строек"
 eu5ab_regional_development__general__limits_desc: "Работает ли мод вообще и сколькими гражданскими проектами он может заниматься одновременно."
 eu5ab_regional_development__general__returns_name: "Правила отдачи и аварийные послабления"
 eu5ab_regional_development__general__returns_desc: "Какая отдача требуется от обычных производственных зданий и может ли нехватка еды, стройматериалов, военных товаров или стратегического сырья её смягчить."
 eu5ab_regional_development__finance__budget_name: "Общий годовой бюджет"
 eu5ab_regional_development__finance__budget_desc: "Все встроенные шаблоны, свои шаблоны, здания и добыча сырья делят один общегосударственный годовой запас."
 eu5ab_regional_development__finance__market_name: "Диапазон рыночных цен"
 eu5ab_regional_development__finance__market_desc: "Общие проценты минимальной и высокой цены, считая от цены по умолчанию."
 eu5ab_regional_development__automation__safety_name: "Предохранители строительства"
 eu5ab_regional_development__automation__safety_desc: "Общее обращение с особыми зданиями, застройкой поставщиков, рабочей силой и нехваткой сырья."
 eu5ab_regional_development__automation__rgo_name: "Расширение добычи сырья"
 eu5ab_regional_development__automation__rgo_desc: "Общее разрешение на добычу сырья и её минимальная загруженность. Локации ранжируются сами — по нехватке, цене, загруженности и стратегической нужде."
 eu5ab_regional_development__automation__workforce_name: "Прогноз рабочей силы"
 eu5ab_regional_development__automation__workforce_desc: "Общий срок прогноза на заполнение новых рабочих мест."
 eu5ab_regional_development__automation__ranking_name: "Порядок стройки и местное сырьё"
 eu5ab_regional_development__automation__ranking_desc: "Порядок улучшений, расширений, добычи сырья и новых зданий, а также то, насколько местное сырьё влияет на ранжирование внутри одного типа стройки."
 eu5ab_regional_development__automation__candidate_priority_name: "Порядок автостроительства"
 eu5ab_regional_development__automation__candidate_priority_desc: "Перетащите четыре типа в нужный порядок. Мод перебирает в текущем типе все проекты, которые может начать, и только потом переходит к следующему; если проект начать не удалось, он ищет другой того же типа. При нехватке еды продовольственные проекты идут первыми, но внутри всё равно следуют этому порядку."
 eu5ab_regional_development__candidate_priority_name: "Порядок автостроительства"
 eu5ab_regional_development__candidate_priority_desc: "Перетаскиванием задайте порядок: улучшения зданий, расширения обычных зданий, расширения добычи сырья, новые обычные здания."
 eu5ab_regional_development__candidate_priority_item_column_name: "Тип стройки"
 eu5ab_regional_development__candidate_priority_i1_name: "Улучшать здания"
 eu5ab_regional_development__candidate_priority_i1_desc: "Заменить устаревшее здание новейшим открытым уровнем в его цепочке улучшений."
 eu5ab_regional_development__candidate_priority_i2_name: "Расширять существующие здания"
 eu5ab_regional_development__candidate_priority_i2_desc: "Добавить уровень к уже стоящему обычному зданию, не считая замен и добычи сырья."
 eu5ab_regional_development__candidate_priority_i3_name: "Расширять сырьевые локации"
 eu5ab_regional_development__candidate_priority_i3_desc: "Расширить местную добычу сырья, сохраняя проверки загруженности, годового бюджета, резерва казны и прочие."
 eu5ab_regional_development__candidate_priority_i4_name: "Строить новые здания"
 eu5ab_regional_development__candidate_priority_i4_desc: "Построить обычное здание с нуля там, где его ещё нет."
 eu5ab_regional_development__enabled_name: "Включить автостроительство"
 eu5ab_regional_development__enabled_desc: "Если выключено, шаблоны и привязки сохраняются, но ежемесячное автостроительство прекращается."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Дополнительные одновременные проекты"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Сколько гражданских проектов мод может вести одновременно сверх базового места. 0 означает 1 проект всего, 599 — 600; ручные стройки, дороги и проекты других модов этот предел не тратят."
 eu5ab_regional_development__budget_mode_name: "Режим годового бюджета"
 eu5ab_regional_development__budget_mode_desc: "Фиксированная сумма или общий годовой запас, получаемый умножением месячного совокупного дохода."
 eu5ab_regional_development__budget_mode_option_1_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__budget_mode_option_2_name: "Месячный доход ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Месячный доход ×6 (рекомендуется)"
 eu5ab_regional_development__budget_mode_option_4_name: "Месячный доход ×8"
 eu5ab_regional_development__economic_metric_name: "Мерило отдачи для автостроительства"
 eu5ab_regional_development__economic_metric_desc: "Какую отдачу должно давать обычное производственное здание, чтобы его начали строить. «Доход» и «Прибыль» требуют положительной месячной величины; «Окупаемость» — не меньше 5% годовых, то есть примерно двадцатилетней окупаемости. Инфраструктура без собственного товара от этого освобождена, а добыча сырья по-прежнему считается по загруженности, цене и стратегической нужде."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Доход"
 eu5ab_regional_development__economic_metric_option_1_desc: "Начинать обычное производственное здание, только если игра предсказывает положительный месячный доход."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Прибыль"
 eu5ab_regional_development__economic_metric_option_2_desc: "Начинать обычное производственное здание, только если игра предсказывает положительную месячную прибыль."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Окупаемость по доходу"
 eu5ab_regional_development__economic_metric_option_3_desc: "Ставить обычное производственное здание в очередь, только если ожидаемый доход даёт не меньше 5% годовых от стоимости стройки."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Окупаемость по прибыли"
 eu5ab_regional_development__economic_metric_option_4_desc: "Ставить обычное производственное здание в очередь, только если прибыль даёт не меньше 5% годовых от стоимости стройки."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Еда скоро кончится: строить первым делом, отдачу не требовать"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Когда на рынке ожидается исчерпание еды, продовольственные проекты идут первыми, и от обычных продовольственных зданий не требуется выбранная отдача. Внутри они всё равно следуют порядку автостроительства, а правила бюджета, казны, рабочей силы, сырья, материалов и стройки самой игры остаются в силе."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Еды 25% и меньше: строить первым делом, отдачу не требовать"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Пока еды на рынке 25% и меньше, продовольственные проекты идут первыми, и от обычных продовольственных зданий не требуется выбранная отдача. Внутри они всё равно следуют порядку автостроительства, а все прочие правила стройки остаются в силе."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Стройматериалов меньше 65%: отдачу не требовать"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Когда основного стройматериала поставляется меньше 65% от нужного, зданиям, которые его производят, выбранная отдача не требуется. Все прочие правила стройки действуют."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Военных товаров в войну меньше 65%: отдачу не требовать"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Пока идёт война, если военного товара поставляется меньше 65% от нужного, зданиям, которые его производят, выбранная отдача не требуется. Все прочие правила стройки действуют."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Стратегическому производству не хватает сырья: не требовать отдачи от поставщиков"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Когда товара-поставщика поставляется меньше 65% от нужного и из-за этой нехватки встало отечественное продовольственное, строительное или военное здание, производителям этого товара выбранная отдача не требуется. Все прочие правила стройки действуют."
 eu5ab_regional_development__fixed_annual_budget_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__fixed_annual_budget_desc: "Используется только в фиксированном режиме; эту сумму делят все шаблоны."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Минимальный резерв казны"
 eu5ab_regional_development__min_cash_reserve_desc: "Золото, которое должно остаться в казне после начала проекта."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Процент минимальной цены"
 eu5ab_regional_development__price_min_desc: "Товар дешевле этого процента от цены по умолчанию обычно считается избыточным."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Процент высокой цены"
 eu5ab_regional_development__price_max_desc: "Товар дороже этого процента от цены по умолчанию получает прибавку в ранжировании."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Разрешить особые здания"
 eu5ab_regional_development__allow_special_buildings_desc: "Разрешить автостроительству рассматривать особые здания; требования стройки самой игры при этом действуют."
 eu5ab_regional_development__auto_build_input_sources_name: "Строить поставщиков при нехватке"
 eu5ab_regional_development__auto_build_input_sources_desc: "Если запланированное здание не начать из-за нехватки сырья, попробовать разрешённого поставщика этого сырья."
 eu5ab_regional_development__pause_low_workforce_name: "Пауза при нехватке рабочей силы"
 eu5ab_regional_development__pause_low_workforce_desc: "Не строить проект, если его рабочие места не заполнятся в пределах срока прогноза."
 eu5ab_regional_development__stop_input_shortage_name: "Останавливать при критической нехватке сырья"
 eu5ab_regional_development__stop_input_shortage_desc: "Не строить связанные проекты, пока критически нужного сырья на рынке не хватает."
 eu5ab_regional_development__allow_rgo_name: "Разрешить расширение добычи сырья"
 eu5ab_regional_development__allow_rgo_desc: "Разрешить всем шаблонам рассматривать расширение сырьевых локаций."
 eu5ab_regional_development__rgo_min_utilization_name: "Минимальная загруженность добычи"
 eu5ab_regional_development__rgo_min_utilization_desc: "Не расширять добычу, загруженную меньше этого."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Срок заполнения мест (месяцев)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Срок прогноза на переход местного населения в новые рабочие места."
 eu5ab_regional_development__native_input_priority_name: "Приоритет местного сырья"
 eu5ab_regional_development__native_input_priority_desc: "От 0 до 10; чем выше, тем охотнее строятся здания, которым сырьё может дать та же провинция."
 eu5ab_regional_development__performance_preset_name: "Набор быстродействия"
 eu5ab_regional_development__performance_preset_desc: "Набор выставляет расширенные настройки ниже разом. «Свой» оставляет их текущие значения."
 eu5ab_regional_development__performance_preset_option_1_name: "Осторожный"
 eu5ab_regional_development__performance_preset_option_1_desc: "Независимые задачи по локациям вкл.; 10 локаций в день; не больше 30 добавлений за проход; досрочная остановка вкл."
 eu5ab_regional_development__performance_preset_option_2_name: "Сбалансированный"
 eu5ab_regional_development__performance_preset_option_2_desc: "Независимые задачи по локациям вкл.; 20 локаций в день; не больше 50 добавлений за проход; досрочная остановка вкл."
 eu5ab_regional_development__performance_preset_option_3_name: "Максимальная пропускная способность"
 eu5ab_regional_development__performance_preset_option_3_desc: "По умолчанию. Независимые задачи по локациям вкл.; 30 локаций в день; без предела добавлений за проход; досрочная остановка вкл."
 eu5ab_regional_development__performance_preset_option_4_name: "Свой"
 eu5ab_regional_development__performance_preset_option_4_desc: "Использовать текущие расширенные настройки."
 eu5ab_regional_development__parallel_location_scan_name: "Независимые задачи по локациям"
 eu5ab_regional_development__parallel_location_scan_desc: "Разбивать расчёт по локациям на отдельные событийные задачи. Это не значит, что игра задействует несколько ядер. Сведение данных по стране, диагностика, бюджет и стройка остаются детерминированными."
 eu5ab_regional_development__daily_location_task_limit_name: "Предел задач по локациям в день"
 eu5ab_regional_development__daily_location_task_limit_desc: "Сколько локаций в день отправляется на подробный расчёт кандидатов, от 1 до 30."
 eu5ab_regional_development__max_additions_per_run_name: "Предел добавлений за проход"
 eu5ab_regional_development__max_additions_per_run_desc: "Ограничить ожидаемое число добавлений за один проход, от 0 до 600. Ноль означает «без предела»."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Останавливаться, когда кандидатов достаточно"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Перестать раздавать новые задачи по локациям, когда последовательно сведённый запас вдвое превысил ожидаемое число добавлений за этот проход."
 eu5ab_diagnostics_cmm_hint: "Правила, общие для всех шаблонов, меняются в настройках модов Community Mod Framework. На этой странице — последний результат автостроительства."
 CMM_NUMERIC_INCREASE_MAX: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), 'eu5ab_cmm_shift_increase_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_increase_1000', 'eu5ab_cmm_shift_increase_max'))]"
 CMM_NUMERIC_DECREASE_MIN: "[SelectLocalization(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__monthly_build_hard_cap'), 'eu5ab_cmm_shift_decrease_10', SelectLocalization(Or(EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__fixed_annual_budget'), EqualTo_string(Scope.GetFlagName, 'eu5ab_regional_development__min_cash_reserve')), 'eu5ab_cmm_shift_decrease_1000', 'eu5ab_cmm_shift_decrease_min'))]"
 eu5ab_cmm_shift_increase_10: "Прибавить 10"
 eu5ab_cmm_shift_decrease_10: "Убавить 10"
 eu5ab_cmm_shift_increase_1000: "Прибавить 1000"
