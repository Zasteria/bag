l_russian:
 search_filter_bag_rgo_local_bonus_name: "Местное сырьё"
 search_filter_bag_rgo_local_bonus_desc: "Только сооружения, получающие #P производственную эффективность#! от сырья, добываемого где угодно в этой провинции, — те, что отмечены лопаткой."
 search_filter_bag_rgo_local_bonus_here_name: "Местное сырьё (эта локация)"
 search_filter_bag_rgo_local_bonus_here_desc: "Строже: только сооружения, чьё сырьё добывается в самой этой локации, а не где-то в провинции."
 search_filter_bag_rgo_build_local_bonus_name: "Местное сырьё для этого здания"
 search_filter_bag_rgo_build_local_bonus_desc: "Только локации, где выбранное сооружение получит #P производственную эффективность#! от сырья своей провинции."
 search_filter_bag_rgo_build_local_bonus_here_name: "Местное сырьё здесь (эта локация)"
 search_filter_bag_rgo_build_local_bonus_here_desc: "Строже: только локации, которые сами добывают нужное сырьё, а не просто делят с ним провинцию."
 bag_rgo_name: "Фильтр по бонусу сырья"
 bag_rgo_desc: "Добавляет в списки сооружений фильтры по зданиям, получающим производственную эффективность от местного сырья."
