l_english:
 wtp_open_name: "Where To Produce"
 wtp_open_icon: "@good!"
 wtp_open_color: "blue"
 wtp_open_tooltip: "Pick a good and see the best provinces in your realm to produce it."
 wtp_name: "Where To Produce"
 wtp_desc: "Shortlists the provinces where a good is worth producing, by how much of the recipe local raw materials cover and by what that turns out."
 wtp__plan_name: "Plan"
 wtp__plan__goods_name: "Good"
 wtp__plan__display_name: "Display"
 wtp__pick_rgo_name: "Raw materials"
 wtp__pick_basic_name: "Basic industry"
 wtp__pick_consumer_name: "Consumer goods"
 wtp__pick_weapons_name: "Weapons industry"
 wtp__plan__recipes_name: "Recipes"
 wtp__recipes_desc: "Every way to make the chosen good. Hover a row for what it consumes and what it turns out. All of them count towards the shortlist; untick the ones you are not interested in."
 wtp__recipes__pick_name: "Use"
 wtp__recipes__ceiling_name: "Best %"
 wtp__recipes__ceiling_desc: "The most this recipe could ever take from raw materials in one province — with every one of them present."
 wtp__recipes__ceiling_postfix: "%"
 wtp__recipes__peak_name: "Best out"
 wtp__recipes__peak_desc: "What the recipe turns out at that best percentage. Efficiency multiplies output, so this is what compares one recipe against another."
 wtp__recipes_item_column_name: "Recipe"
 wtp__plan__provinces_name: "Best provinces"
 wtp__provinces_desc: "Where the ticked recipes gain most. Each row names the one that does best there."
 wtp__provinces__bonus_name: "Local %"
 wtp__provinces__bonus_desc: "What that recipe takes from the raw materials of this province."
 wtp__provinces__bonus_postfix: "%"
 wtp__provinces__volume_name: "Output"
 wtp__provinces__volume_desc: "What the recipe turns out here, counting the local raw materials and nothing else."
 wtp__provinces_item_column_name: "Province"
 wtp__filter_name: "Only what I can build"
 wtp__filter_desc: "Hides recipes this country has no use for: buildings another tag, culture or reform keeps to itself, buildings that are not built in the ordinary way, and recipes whose raw materials are worked nowhere in the realm."
 wtp__sort_name: "Rank by"
 wtp__sort_desc: "Local coverage favours whichever recipe the province supplies best. Output favours whichever turns out most, which is usually a bigger recipe at a smaller percentage."
 wtp__sort_option_1_name: "Local %"
 wtp__sort_option_2_name: "Output"
 wtp__shortlist_size_name: "Provinces Shown"
 wtp__shortlist_size_desc: "How many provinces to list, up to ten."
 WTP_PICK_NONE: "— none —"
 WTP_IN: "Consumes:"
 WTP_OUT: "Produces:"
 WTP_FROM_RGO: "From the province:"
 # Neither a province nor a recipe has a localization key a row label could be
 # pointed at, so each shortlist row parks both in globals and reads them back
 # here. Ten keys because the list never grows past ten rows.
 wtp__provinces_i1_name: "[GetGlobalVariable('wtp_prov_row_1').GetProvince.GetName] — [GetGlobalVariable('wtp_meth_row_1').GetFlagName]"
