l_english:
 wtp_name: "Where To Produce"
 wtp_desc: "For one province of your realm, what is worth building in it — ranked by how much of the recipe its own raw materials cover, and by what that turns out."
 wtp__plan_name: "Plan"
 wtp__plan__display_name: "Display"
 wtp__plan__regions_name: "Region"
 wtp__plan__areas_name: "Area"
 wtp__plan__provinces_name: "Province"
 wtp__plan__top_name: "Worth building here"
 wtp__regions_desc: "The regions you hold land in. Tick one."
 wtp__regions_item_column_name: "Region"
 wtp__regions__pick_name: "Pick"
 wtp__areas_desc: "The areas of that region you hold land in."
 wtp__areas_item_column_name: "Area"
 wtp__areas__pick_name: "Pick"
 wtp__provinces_desc: "The provinces of that area you hold land in."
 wtp__provinces_item_column_name: "Province"
 wtp__provinces__pick_name: "Pick"
 wtp__top_desc: "What this province's own raw materials are worth to each building. Hover a row for the recipe behind the figure."
 wtp__top_item_column_name: "Building"
 wtp__top__local_name: "Local %"
 wtp__top__local_desc: "How much of the building's recipe the raw materials of this province cover."
 wtp__top__local_postfix: "%"
 wtp__top__output_name: "Output"
 wtp__top__output_desc: "What the building turns out here, counting the local raw materials and nothing else. Efficiency multiplies output, so this is what compares a mill against a village workshop."
 wtp__half_name: "Show"
 wtp__half_desc: "Town buildings are staffed by burghers and go in towns and cities; rural ones are staffed by labourers, peasants or slaves. They are built in different kinds of location, so it is usually one or the other you are planning."
 wtp__half_option_1_name: "Everything"
 wtp__half_option_2_name: "Town"
 wtp__half_option_3_name: "Rural"
 wtp__sort_name: "Rank by"
 wtp__sort_desc: "Local coverage favours whichever building this province supplies best. Output favours whichever turns out most, which is usually a bigger building at a smaller percentage."
 wtp__sort_option_1_name: "Local %"
 wtp__sort_option_2_name: "Output"
 wtp__unlocked_name: "Only what I have now"
 wtp__unlocked_desc: "Hides buildings this country has not reached yet, and ones a successor has already replaced. Asks the game itself, so it moves with your advances and ages. If the list comes up empty, this is the toggle to turn off."
 wtp__filter_name: "Only what I can build"
 wtp__filter_desc: "Hides buildings this country has no use for: ones another tag, culture or reform keeps to itself, ones that are not built in the ordinary way, and ones whose raw materials are worked nowhere in your realm."
 wtp__shortlist_size_name: "Buildings Shown"
 wtp__shortlist_size_desc: "How many to list, up to twelve."
 WTP_IN: "Consumes:"
 WTP_OUT: "Produces:"
 WTP_FROM_RGO: "From the province:"
 # Neither a region, an area nor a province has a localization key a row label
 # could be pointed at, so each row parks its own in a global and reads it back
 # here. The answer needs none of this: a building type's key is its own
 # localization key, so the flag standing for the candidate labels the row.
