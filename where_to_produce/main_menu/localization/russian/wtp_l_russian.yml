l_russian:
 wtp_open_name: "Где производить"
 wtp_open_icon: "@good!"
 wtp_open_color: "blue"
 wtp_open_tooltip: "Выберите товар и увидите лучшие провинции державы для его производства."
 wtp_name: "Где производить"
 wtp_desc: "Отбирает провинции, где товар выгодно производить: по доле рецепта, покрытой местным сырьём, и по тому, сколько это даёт на выходе."
 wtp__plan_name: "План"
 wtp__plan__goods_name: "Товар"
 wtp__plan__display_name: "Отображение"
 wtp__pick_rgo_name: "Базовые ресурсы"
 wtp__pick_basic_name: "Основные ресурсы"
 wtp__pick_consumer_name: "Потребительские товары"
 wtp__pick_weapons_name: "Оружейная промышленность"
 wtp__plan__recipes_name: "Методы производства"
 wtp__recipes_desc: "Все способы получить выбранный товар. Наведите на строку, чтобы увидеть, что метод тратит и что даёт. В подборе провинций учитываются все отмеченные; снимите галочку с ненужных."
 wtp__recipes__pick_name: "Учёт"
 wtp__recipes__ceiling_name: "Максимум %"
 wtp__recipes__ceiling_desc: "Больше этого метод с местного сырья не возьмёт никогда — это его доля при всём сырье сразу."
 wtp__recipes__ceiling_postfix: "%"
 wtp__recipes__peak_name: "Максимум выхода"
 wtp__recipes__peak_desc: "Сколько метод выдаёт при этом максимуме. Эффективность умножает выход, поэтому именно объём и сравнивает разные методы между собой."
 wtp__recipes_item_column_name: "Метод"
 wtp__plan__provinces_name: "Лучшие провинции"
 wtp__provinces_desc: "Где отмеченные методы берут больше всего. В строке назван тот, который здесь лучший."
 wtp__provinces__bonus_name: "Местное %"
 wtp__provinces__bonus_desc: "Сколько этот метод берёт с сырья именно этой провинции."
 wtp__provinces__bonus_postfix: "%"
 wtp__provinces__volume_name: "Выход"
 wtp__provinces__volume_desc: "Сколько метод даёт здесь, считая только местное сырьё и ничего больше."
 wtp__provinces_item_column_name: "Провинция"
 wtp__filter_name: "Только доступное мне"
 wtp__filter_desc: "Скрывает методы, которые этой державе ни к чему: здания, закреплённые за другим тегом, культурой или реформой; здания, которые обычным порядком не строятся; и рецепты, сырьё которых в державе не добывается нигде."
 wtp__sort_name: "Сортировка"
 wtp__sort_desc: "По проценту — вперёд выходит метод, который провинция снабжает полнее всего. По выходу — тот, который даёт больше товара, а это обычно крупный метод с меньшим процентом."
 wtp__sort_option_1_name: "По местному %"
 wtp__sort_option_2_name: "По выходу"
 wtp__shortlist_size_name: "Провинций в списке"
 wtp__shortlist_size_desc: "Сколько провинций показывать, максимум десять."
 WTP_PICK_NONE: "— не выбрано —"
 WTP_IN: "Тратит:"
 WTP_OUT: "Даёт:"
 WTP_FROM_RGO: "Со своей провинции:"
 # Ни у провинции, ни у метода нет ключа локализации, на который можно указать
 # подпись строки, поэтому каждая строка хранит и то и другое в глобальных
 # переменных и читает их обратно здесь. Ключей десять — больше десяти строк
 # в списке не бывает.
