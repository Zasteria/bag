l_russian:
 wtp_name: "Где производить"
 wtp_desc: "Для одной вашей провинции — что в ней стоит строить, по доле рецепта, покрытой её собственным сырьём, и по тому, сколько это даёт на выходе."
 wtp__plan_name: "План"
 wtp__plan__display_name: "Отображение"
 wtp__plan__regions_name: "Регион"
 wtp__plan__areas_name: "Область"
 wtp__plan__provinces_name: "Провинция"
 wtp__plan__top_name: "Что здесь строить"
 wtp__regions_desc: "Регионы, где у вас есть земли. Отметьте один."
 wtp__regions_item_column_name: "Регион"
 wtp__regions__pick_name: "Выбор"
 wtp__areas_desc: "Области этого региона, где у вас есть земли."
 wtp__areas_item_column_name: "Область"
 wtp__areas__pick_name: "Выбор"
 wtp__provinces_desc: "Провинции этой области, где у вас есть земли."
 wtp__provinces_item_column_name: "Провинция"
 wtp__provinces__pick_name: "Выбор"
 wtp__top_desc: "Чего стоит собственное сырьё этой провинции для каждого здания. Наведите на строку — увидите рецепт, из которого взято число."
 wtp__top_item_column_name: "Здание"
 wtp__top__local_name: "Местное %"
 wtp__top__local_desc: "Какую долю рецепта здания покрывает сырьё этой провинции."
 wtp__top__local_postfix: "%"
 wtp__top__ceiling_name: "Максимум %"
 wtp__top__ceiling_desc: "Больше этого метод с местного сырья не возьмёт никогда — это его доля при всём сырье сразу. Если «Местное %» дошло до этой цифры, провинция даёт зданию всё, что оно вообще может получить."
 wtp__top__ceiling_postfix: "%"
 wtp__top__output_name: "Выход"
 wtp__top__output_desc: "Сколько здание даёт здесь, считая только местное сырьё и ничего больше. Эффективность умножает выход, поэтому именно объём и сравнивает мануфактуру с деревенской мастерской."
 wtp__half_name: "Показывать"
 wtp__half_desc: "Городские здания работают бюргерами и ставятся в городках и городах; сельские — работягами, крестьянами или рабами. Ставятся они в разные места, так что обычно планируешь что-то одно."
 wtp__half_option_1_name: "Всё"
 wtp__half_option_2_name: "Город"
 wtp__half_option_3_name: "Село"
 wtp__sort_name: "Сортировка"
 wtp__sort_desc: "По проценту — вперёд выходит здание, которое провинция снабжает полнее всего. По выходу — то, которое даёт больше товара, а это обычно крупное здание с меньшим процентом."
 wtp__sort_option_1_name: "По местному %"
 wtp__sort_option_2_name: "По выходу"
 wtp__unlocked_name: "Только уже открытое"
 wtp__unlocked_desc: "Скрывает здания, до которых держава ещё не дошла, и те, что уже заменены преемником. Спрашивает саму игру, поэтому двигается вместе с вашими открытиями и эпохами. Если список окажется пустым — выключать надо этот переключатель."
 wtp__filter_name: "Только доступное мне"
 wtp__filter_desc: "Скрывает здания, которые этой державе ни к чему: закреплённые за другим тегом, культурой или реформой; те, что обычным порядком не строятся; и те, чьё сырьё в державе не добывается нигде."
 wtp__shortlist_size_name: "Зданий в списке"
 wtp__shortlist_size_desc: "Сколько показывать, максимум двенадцать."
 WTP_IN: "Тратит:"
 WTP_OUT: "Даёт:"
 WTP_FROM_RGO: "Со своей провинции:"
 # Ни у региона, ни у области, ни у провинции нет ключа локализации, на который
 # можно указать подпись строки, поэтому каждая строка хранит своё в глобальной
 # переменной и читает обратно здесь. Ответу это не нужно: у типа здания ключ
 # локализации — он сам, поэтому флаг кандидата подписывает строку напрямую.
