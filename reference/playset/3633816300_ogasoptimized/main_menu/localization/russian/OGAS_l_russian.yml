l_russian:
 OGAS: "OGAS"
 OGAS_desc: "OGAS"
 OGAS_Complete_desc: "[proximity]: [THIS.GetLocation.GetProximityToOwnerCapital|2W]\nNo further roads required"
 OGAS_Ongoing_desc: "[proximity]: [THIS.GetLocation.GetProximityToOwnerCapital|2W] (Current) / [THIS.GetLocation.MakeScope.GetVariable('OGAS_Predicted').GetValue|2W] (Optimal)\nTarget: $build_roads$ toward [THIS.GetLocation.MakeScope.GetVariable('OGAS_Parent').GetLocation.GetName]\nScore: [THIS.GetLocation.MakeScope.GetVariable('OGAS_Value').GetValue|2W]"
 OGAS_Cannot_Reach_desc: "Cannot raise [proximity] above 0"
 OGAS_Complete_Market_Access_desc: "@market![THIS.GetLocation.GetMarket.GetName]\n[market_access]: [THIS.GetLocation.GetMarketAccess|2%V]\nNo further roads required"
 OGAS_Ongoing_Market_Access_desc: "@market![THIS.GetLocation.GetMarket.GetName]\n[market_access]: [THIS.GetLocation.GetMarketAccess|2%V] (Current) / [THIS.GetLocation.MakeScope.GetVariable('OGAS_Predicted').GetValue|2%V] (Optimal)\nTarget: $build_roads$ toward [THIS.GetLocation.MakeScope.GetVariable('OGAS_Parent').GetLocation.GetName]\nScore: [THIS.GetLocation.MakeScope.GetVariable('OGAS_Value').GetValue|2W]"
 OGAS_Cannot_Reach_Market_Access_desc: "@market![THIS.GetLocation.GetMarket.GetName]\nCannot raise [market_access] above 0"
 OGAS_Introduction_Title: "OGAS"
 OGAS_Introduction: "OGAS evaluates every owned [location|e] and creates a [road|e] plan for the selected mode. When automation is enabled, it $build_roads$ by score while respecting your gold reserve.\nThe road plan recalculates at the selected refresh frequency, and can always be refreshed immediately.\nNote: Hover [locations] to preview the road plan."
 OGAS_Auto_Road_Initialize_Button: "Refresh [road] Plan Now"
 OGAS_Auto_Road_Initialize_TT: "Recalculate the current [road|e] plan immediately. Use this after major [proximity|e], [market_access|e], or [road] [advance|e] changes."
 OGAS_Auto_Road_Proximity_Button: "[proximity] Mode"
 OGAS_Auto_Road_Market_Access_Button: "[market_access] Mode"
 OGAS_Auto_Road_Construct_Button_Text: "Automate Road Construction"
 OGAS_Auto_Road_Construct_Toggle_Enable: "Automate your road construction"
 OGAS_Auto_Road_Construct_Toggle_Disable: "Deactivate automation of your road construction"
 OGAS_Auto_Road_Min_Gold_Text: "Gold to Save: [GetPlayer.MakeScope.GetVariable('OGAS_Gold_Reserve').GetValue|0Y]@gold!"
 OGAS_Auto_Road_Refresh_Interval_Text: "Refresh Every: [GetPlayer.MakeScope.GetVariable('OGAS_Refresh_Interval').GetValue|0Y] months"
 OGAS_Auto_Road_Plan_Refresh_Title: "Road Plan Refresh Interval"
 OGAS_Auto_Road_Refresh_Never: "Manual Only"
 OGAS_Auto_Road_Refresh_1_Month: "Monthly"
 OGAS_Auto_Road_Refresh_3_Months: "3 Months"
 OGAS_Auto_Road_Refresh_6_Months: "6 Months"
 OGAS_Auto_Road_Refresh_12_Months: "Yearly"
 OGAS_Auto_Road_Refresh_Never_TT: "Do not automatically refresh the [road|e] plan. Recalculate only when the refresh button is clicked."
 OGAS_Auto_Road_Refresh_1_Month_TT: "Automatically refresh the [road|e] plan every month."
 OGAS_Auto_Road_Refresh_3_Months_TT: "Automatically refresh the [road|e] plan every 3 months."
 OGAS_Auto_Road_Refresh_6_Months_TT: "Automatically refresh the [road|e] plan every 6 months."
 OGAS_Auto_Road_Refresh_12_Months_TT: "Automatically refresh the [road|e] plan every 12 months."
