l_english:
 # Mod
 atd_name: "Autonomous Diplomats"
 atd_desc: "Automate your diplomatic actions."

 # Improve Relations (improve_relations) Tab
 atd__improve_relations_name: "Improve Relations"
 ## Automation (automation) Group
 atd__improve_relations__automation_name: "Automation"
 atd__improve_relations_enabled_name: "Improve Relations"
 atd__improve_relations_enabled_desc: "Send diplomats to improve relations with countries in the categories below."
 ## Limits (limits) Group
 atd__improve_relations__limits_name: "Limits"
 atd__max_relations_name: "Maximum Relations"
 atd__max_relations_desc: "Stop improving relations with countries once their opinion of you reaches this value, cancelling any improvement in progress. At 200+ there is no limit."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Maximum Antagonism"
 atd__max_antagonism_desc: "Do not improve relations with countries that have more antagonism towards you than this. At 200+ there is no limit."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd__improve_relations__improve_relations_name: "Improve Relations"
 atd__improve_relations__improve_relations_desc: "Categories higher in the list are prioritized first."
 atd__improve_relations_item_column_name: "Category"
 atd__improve_relations_i1_name: "HRE Imperial Circle Leaders"
 atd__improve_relations_i1_desc: "Improve relations with the leaders of Imperial Circles in the Holy Roman Empire."
 atd__improve_relations_i2_name: "HRE Electors"
 atd__improve_relations_i2_desc: "Improve relations with Holy Roman Empire electors."
 atd__improve_relations_i3_name: "HRE Members"
 atd__improve_relations_i3_desc: "Improve relations with Holy Roman Empire members."
 atd__improve_relations_i4_name: "Neighboring Countries"
 atd__improve_relations_i4_desc: "Improve relations with countries that border you."
 atd__improve_relations_i5_name: "Own Subject Countries"
 atd__improve_relations_i5_desc: "Improve relations with your subject countries."
 atd__improve_relations_i6_name: "Outraged Countries"
 atd__improve_relations_i6_desc: "Improve relations with countries that have at least 25 antagonism towards you, targeting the most outraged first. Cancels the improvement once their antagonism drops below 5."
 atd__improve_relations_i7_name: "Allies"
 atd__improve_relations_i7_desc: "Improve relations with your allies and defensive league members."
 atd__improve_relations_i8_name: "Threatening Countries"
 atd__improve_relations_i8_desc: "Improve relations with countries that threaten you, targeting the greatest threats first."
 atd__improve_relations_i9_name: "Market Owners"
 atd__improve_relations_i9_desc: "Improve relations with countries that own a market."
 atd__improve_relations_i10_name: "Kingdoms and Empires"
 atd__improve_relations_i10_desc: "Improve relations with kingdoms and empires."
 atd__improve_relations_i11_name: "Largest Nations"
 atd__improve_relations_i11_desc: "Improve relations with the largest nations within your diplomatic range that you have discovered, starting with the biggest."
 atd__improve_relations__count_name: "Diplomats"

 # Interactions (interactions) Tab
 atd__interactions_name: "Auto Interactions"
 atd__interactions__auto_interactions_name: "Auto Interactions"
 atd__interactions__auto_interactions_desc: "Automatically performed interactions, run each month from the top of the list down."
 atd__auto_interactions_item_column_name: "Interaction"
 atd__auto_interactions__paused_name: "Paused"
 atd__auto_interactions__paused_desc: "Pause this entry without removing it from the queue."
 atd__auto_interactions__cancel_name: "Cancel"
 atd__auto_interactions__cancel_text: "Cancel"
 atd__auto_interactions__cancel_desc: "Remove this entry from the queue."
 atd__auto_interactions__status_name: "Status"
 atd__auto_interactions__status_desc: "What this entry is currently waiting on or doing."
 # Queue row interactions
 atd_cmm_interaction_send_gift: "Send Gift"
 # Status column states
 atd_cmm_status_pending: "Going to send"
 atd_cmm_status_no_diplomats: "Waiting for diplomats"
 atd_cmm_status_no_gold: "Waiting for gold"
 atd_cmm_status_paused: "Paused"
 atd_cmm_status_blocked: "Unavailable"
 atd_cmm_status_cooldown: "In cooldown"
 atd_cmm_status_cooldown_years_left: "years left"
 ## Reserve (reserve) Group
 atd__interactions__reserve_name: "Reserve"
 atd__min_gold_name: "Minimum Gold"
 atd__min_gold_desc: "Keep at least this much gold in the treasury. An auto-interaction is skipped when paying for it would drop your treasury below this."

 # Subjects (subjects) Tab
 atd__subjects_name: "Subjects"
 atd__subjects__enforce_name: "Enforce"
 atd__enforce_item_column_name: "Action"
 atd__enforce_i1_name: "Enforce Religion"
 atd__enforce_i2_name: "Enforce Culture"
 atd__enforce__enabled_name: "Enabled"

 # Settings (settings) Tab
 atd__settings_name: "Settings"
 ## Automation (automation) Group
 atd__settings__automation_name: "Automation"
 atd__enabled_name: "Enabled"
 atd__enabled_desc: "Enable Autonomous Diplomats. Also toggles the game's Diplomacy Interactions automation."
 ## Reserve (reserve) Group
 atd__settings__reserve_name: "Reserve"
 atd__min_diplomats_name: "Minimum Diplomats Reserve"
 atd__min_diplomats_desc: "Minimum number of banked diplomats to keep in reserve. Shared with the Minimum Monthly Diplomats slider on the Diplomacy Interactions automation card."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd__min_diplomat_gain_name: "Minimum Diplomat Gain"
 atd__min_diplomat_gain_desc: "Improving relations is paused while your monthly diplomat gain is below this value. It does not apply to enforcing on subjects or to auto-gifting."

 # Automation Panel
 atd_automation_open_settings: "Open Autonomous Diplomats"
 atd_automation_improve_opinion_tooltip: "Send diplomats to improve relations with countries in the configured categories. Configure categories and priorities in the Autonomous Diplomats settings."
 atd_automation_diplomat_reserve_tooltip: "Automation will only send [diplomats|e] when the current banked amount exceeds this reserve, leaving the remainder available for your manual use. This reserve also applies to Autonomous Diplomats."

 # Country Interactions
 # Note to translators: keep the @CATEGORY_ATD_ACTIONS! icon reference at the start of the category name.
 CATEGORY_ATD_ACTIONS: "@CATEGORY_ATD_ACTIONS! Autonomous Diplomats"
 # Note to translators: the "#B #!" and "#D #!" prefixes on the interaction names only order them at the top of the category; leave them as is.
 atd_block_autonomous_improving: "#B #!Block Auto-Improve"
 atd_block_autonomous_improving_act: "Block Auto-Improve with [SCOPE.sCountry('recipient').GetName]"
 atd_block_autonomous_improving_desc: "Stop automatically improving relations with [SCOPE.sCountry('recipient').GetName]. Any improvement already in progress will finish on its own."
 atd_block_autonomous_improving_effect_text: "Stop automatically improving relations with [SCOPE.sCountry('recipient').GetName]"
 atd_block_autonomous_improving_effect_text_past: "Stopped automatically improving relations with [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_atd_block_autonomous_improving: "Block auto-improve with $RECIPIENT$?"
 atd_allow_autonomous_improving: "#B #!Allow Auto-Improve"
 atd_allow_autonomous_improving_act: "Allow Auto-Improve with [SCOPE.sCountry('recipient').GetName]"
 atd_allow_autonomous_improving_desc: "Resume automatically improving relations with [SCOPE.sCountry('recipient').GetName]."
 atd_allow_autonomous_improving_effect_text: "Resume automatically improving relations with [SCOPE.sCountry('recipient').GetName]"
 atd_allow_autonomous_improving_effect_text_past: "Resumed automatically improving relations with [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_atd_allow_autonomous_improving: "Allow auto-improve with $RECIPIENT$?"
 atd_start_auto_gifting: "#D #!Start Auto-Gifting"
 atd_start_auto_gifting_act: "Start Auto-Gifting [SCOPE.sCountry('recipient').GetName]"
 atd_start_auto_gifting_desc: "Automatically send [SCOPE.sCountry('recipient').GetName] the largest possible gift whenever the ten-year cooldown ends, earning favors and opinion. Manage and prioritize queued countries in the Autonomous Diplomats settings."
 atd_start_auto_gifting_effect_text: "Start automatically sending gifts to [SCOPE.sCountry('recipient').GetName]"
 atd_start_auto_gifting_effect_text_past: "Started automatically sending gifts to [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_atd_start_auto_gifting: "Start auto-gifting $RECIPIENT$?"
 atd_stop_auto_gifting: "#D #!Stop Auto-Gifting"
 atd_stop_auto_gifting_act: "Stop Auto-Gifting [SCOPE.sCountry('recipient').GetName]"
 atd_stop_auto_gifting_desc: "Stop automatically sending gifts to [SCOPE.sCountry('recipient').GetName]."
 atd_stop_auto_gifting_effect_text: "Stop automatically sending gifts to [SCOPE.sCountry('recipient').GetName]"
 atd_stop_auto_gifting_effect_text_past: "Stopped automatically sending gifts to [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_atd_stop_auto_gifting: "Stop auto-gifting $RECIPIENT$?"

