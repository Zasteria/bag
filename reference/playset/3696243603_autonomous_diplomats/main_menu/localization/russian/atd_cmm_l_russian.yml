l_russian:
 # Mod
 atd_name: "Автономные дипломаты"
 atd_desc: "Автоматизируйте свои дипломатические действия."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Минимальный резерв дипломатов"
 atd__min_diplomats_desc: "Минимальное количество накопленных дипломатов, которые должны оставаться в резерве. Связано с ползунком «Минимальное количество дипломатов в месяц» на карточке автоматизации дипломатических взаимодействий."
 atd__min_diplomat_gain_name: "Минимальный прирост дипломатов"
 atd__min_diplomat_gain_desc: "Улучшение отношений приостанавливается, пока ваш ежемесячный прирост дипломатов ниже этого значения. Это не относится к принуждению субъектов или автоподаркам."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Категория"
 atd__improve_relations_i1_name: "Лидеры имперских округов СРИ"
 atd__improve_relations_i2_name: "Курфюрсты СРИ"
 atd__improve_relations_i3_name: "Члены СРИ"
 atd__improve_relations_i4_name: "Соседние страны"
 atd__improve_relations_i5_name: "Собственные зависимые страны"
 atd__improve_relations__count_name: "Дипломаты"

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__min_diplomats: "atd__min_diplomats"
 atd__min_diplomat_gain: "atd__min_diplomat_gain"
 atd__improve_relations: "atd__improve_relations"
 atd__improve_relations__count: "atd__improve_relations__count"
 atd__improve_relations_name: "Улучшение отношений"
 atd__improve_relations__improve_relations_name: "Улучшить отношения"
 atd__improve_relations__improve_relations_desc: "Категории, находящиеся выше в списке, имеют приоритет."
 atd__improve_relations_i1_desc: "Улучшить отношения с лидерами имперских округов в Священной Римской империи."
 atd__improve_relations_i2_desc: "Улучшить отношения с курфюрстами Священной Римской империи."
 atd__improve_relations_i3_desc: "Улучшить отношения с членами Священной Римской империи."
 atd__improve_relations_i4_desc: "Улучшайте отношения с граничащими с вами странами."
 atd__improve_relations_i5_desc: "Улучшите отношения со своими субъектами."
 atd__improve_relations_i6_name: "Возмущённые страны"
 atd__improve_relations_i6_desc: "Улучшать отношения со странами, чей антагонизм по отношению к вам составляет не менее 25, в первую очередь выбирая наиболее враждебные. Улучшение прекращается, когда уровень их антагонизма опускается ниже 5."
 atd__improve_relations_i7_name: "Союзники"
 atd__improve_relations_i7_desc: "Улучшите отношения со своими союзниками и членами оборонительных лиг."
 atd__subjects_name: "Субъекты"
 atd__subjects__enforce_name: "Навязать"
 atd__enforce_item_column_name: "Действие"
 atd__enforce_i1_name: "Навязать религию"
 atd__enforce_i2_name: "Навязать культуру"
 atd__enforce__enabled_name: "Включено"
 atd__settings_name: "Настройки"
 atd__settings__reserve_name: "Резерв"
 atd__improve_relations__improve_relations: "atd__improve_relations__improve_relations"
 atd__subjects: "atd__subjects"
 atd__subjects__enforce: "atd__subjects__enforce"
 atd__enforce: "atd__enforce"
 atd__enforce__enabled: "atd__enforce__enabled"
 atd__settings: "atd__settings"
 atd__settings__reserve: "atd__settings__reserve"
 atd__improve_relations__automation_name: "Автоматизация"
 atd__improve_relations_enabled_name: "Улучшить отношения"
 atd__improve_relations_enabled_desc: "Отправьте дипломатов для улучшения отношений со странами из категорий ниже."
 atd__settings__automation_name: "Автоматизация"
 atd__enabled_name: "Включено"
 atd__enabled_desc: "Включить автономных дипломатов. Также переключает автоматизацию дипломатических взаимодействий."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "Открыть автономных дипломатов"
 atd_automation_improve_opinion_tooltip: "Отправляйте дипломатов для улучшения отношений со странами из выбранных категорий. Настройте категории и приоритеты в меню настроек автономных дипломатов."
 atd_automation_diplomat_reserve_tooltip: "Автоматизация будет отправлять [diplomats|e] только тогда, когда накопленная сумма превысит этот резерв, оставляя остаток для вашего использования вручную. Этот резерв также распространяется на автономных дипломатов."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "Угрожающие державы"
 atd__improve_relations_i8_desc: "Улучшайте отношения со странами, которые представляют для вас угрозу, начиная с самых серьезных."
 atd__improve_relations_i9_name: "Владельцы рынков"
 atd__improve_relations_i9_desc: "Улучшить отношения со странами, владеющими рынком."
 atd__improve_relations_i10_name: "Королевства и империи"
 atd__improve_relations_i10_desc: "Улучшить отношения с королевствами и империями."
 atd__improve_relations_i11_name: "Крупнейшие державы"
 atd__improve_relations_i11_desc: "Улучшать отношения с крупнейшими из известных вам стран в пределах вашей дипломатической дистанции, начиная с самых больших."
 atd__improve_relations__limits_name: "Лимиты"
 atd__max_relations_name: "Максимум отношений"
 atd__max_relations_desc: "Прекращать улучшение отношений со странами, когда их мнение о вас достигнет этого значения, отменяя текущее улучшение. При значении 200+ ограничения нет."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Максимальный антагонизм"
 atd__max_antagonism_desc: "Не улучшать отношения с державами, чей антагонизм по отношению к вам выше этого значения. При 200+ ограничение отсутствует."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd_block_autonomous_improving: "#B #!Заблокировать автоулучшение"
 atd_block_autonomous_improving_desc: "Прекратить автоматически улучшать отношения с [SCOPE.sCountry('recipient').GetName]. Любое уже начатое улучшение завершится само по себе."
 atd_allow_autonomous_improving: "#B #!Разрешить автоматическое улучшение"
 atd_allow_autonomous_improving_desc: "Возобновить автоматическое улучшение отношений с [SCOPE.sCountry('recipient').GetName]."
