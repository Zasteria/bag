l_russian:
 STATIC_MODIFIER_NAME_nd_rule_britannia: "Правило Британией" #NT!
 STATIC_MODIFIER_DESC_nd_rule_britannia: "Акт о Союзе создал морскую сверхдержаву. Благодаря объединенному флоту Англии и Шотландии и манящим богатствам мирового океана Британия будет господствовать на морях, защищать свои торговые пути и распространять мощь во всех уголках земного шара." #NT!
 STATIC_MODIFIER_NAME_nd_workshop_of_the_world: "Мастерская Мира" #NT!
 STATIC_MODIFIER_DESC_nd_workshop_of_the_world: "Союз Англии и Шотландии создает не просто политическое образование, но и экономический двигатель. Обладая богатыми природными ресурсами, растущими учебными заведениями и культурой практических инноваций, Великобритания должна стать мастерской, которая снабжает мир." #NT!
 nd_gbr.1.t: "Акт Союза" #NT!
 nd_gbr.1.d: "Акты об унии объединили королевства Англия и Шотландия в единое суверенное государство — Великобританию. Парламент Шотландии и английский парламент распускаются, их место занимает парламент Великобритании в Вестминстере. Это не просто завоевание; это союз, основанный на переговорах, рожденный на основе общей протестантской веры, экономической необходимости и тяжелых уроков столетия гражданских войн.\n\nТеперь вопрос в том, какой нацией станет эта объединенная Британия. Объединенный Королевский флот уже может соперничать с любым флотом на плаву, а зарегистрированные торговые компании простираются от островов Спайс до Америки. Но на этих островах находятся угольные пласты, месторождения железа и население изобретателей, ремесленников и предпринимателей, чья энергия, если ее правильно использовать, может изменить саму природу производства.\n\nЧто будет определять эту новую Британию?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_gbr.1.a: "Британия будет править волнами." #NT!
 nd_gbr.1.b: "Мы будем кузницей наций." #NT!
 nd_gbr.2.t: "Банк Англии" #NT!
 nd_gbr.2.d: "В 1694 году Уильям Патерсон убедил парламент учредить новое учреждение: национальный банк, который будет ссужать деньги правительству под проценты, финансируемые по открытой подписке. Банк Англии оказался революционным. Предоставляя Короне надежный кредит по разумным ставкам, он освободил Британию от зависимости от иностранных банкиров и позволил обеспечить устойчивое финансирование как войны, так и торговли.\n\nБанки Банка циркулируют наряду с монетами, а его способность управлять государственным долгом дает Британии финансовую устойчивость, которой ее конкуренты могут только позавидовать. Но как это учреждение может лучше всего послужить нации? Разумная денежно-кредитная политика стабилизирует цены и вознаградит бережливость. Альтернативно, щедрые кредиты могли бы стимулировать торговые предприятия и строительные проекты по всему королевству." #NT!
 nd_gbr.2.a: "Надежные деньги являются основой длительного процветания." #NT!
 nd_gbr.2.b: "Кредит является жизненной силой торговли." #NT!
 nd_gbr.3.t: "Хайлендские полки" #NT!
 nd_gbr.3.d: "Умиротворение Шотландского нагорья после восстания якобитов представило Британии как вызов, так и возможность. Жестокие воинские традиции кланов Хайленда (разрушительные атаки с использованием палаша и таржа, выносливость, воспитанная горной жизнью) могут быть превращены из источника восстания в столп имперской мощи.\n\nСоздание независимых горских рот, позже объединенных с Черным Дозором и другими полками, направляет этот боевой дух на службу Короне. Солдаты горцев уже доказали свою эффективность от Фонтенуа до форта Тикондерога, их храбрость и свирепость заслужили уважение даже у врагов.\n\nСледуем ли нам сосредоточиться на полной интеграции этих гордых людей в британское общество или сохранить их особые боевые традиции как оружие империи?" #NT!
 nd_gbr.3.a: "Приветствуйте их как равноправных подданных Короны." #NT!
 nd_gbr.3.b: "Пусть атака Хайленда напугает наших врагов." #NT!
 nd_gbr.4.t: "Ост-Индская компания" #NT!
 nd_gbr.4.d: "То, что начиналось как скромное акционерное предприятие по торговле восточными специями, превратилось в самое мощное коммерческое предприятие, которое когда-либо видел мир. Ост-Индская компания теперь имеет свои собственные армии, управляет обширными территориями и ведет дипломатию с суверенными правителями, от императора Великих Моголов до султана Сулу.\n\nОт складов Сурата до счетных домов Калькутты агенты компании торгуют хлопком, шелком, индиго, чаем и опиумом. Доходы, возвращающиеся в Лондон, питают инвестиции, питают Казначейство за счет таможенных пошлин и приносят состояния акционерам. «Ост-Индианец», эти огромные вооруженные торговые суда, курсирующие по пути в Индию, стали коммерческой опорой Британской империи." #NT!
 nd_gbr.4.a: "Торговля — это основа империи." #NT!
 nd_gbr.5.t: "Первые ставки линии" #NT!
 nd_gbr.5.d: "Первоклассный линейный корабль представляет собой вершину деревянного военного кораблестроения. Эти плавучие крепости, оснащенные сотней и более орудий на трех палубах, могут нанести сокрушительный залп, способный ослабить любое сопротивление осколкам. «Виктори», «Королевский Соверен», «Британия» — сами их названия говорят о военно-морском превосходстве.\n\nСтроительство и обслуживание таких судов требует колоссальных ресурсов: тысячи дубов для корпуса, мили веревок и брезента, тонны железа для арматуры и орудий, а также экипажи численностью восемьсот человек и более. Только страна с британскими верфями, запасами древесины, обученными моряками и финансовыми институтами может поддерживать флот таких левиафанов. Они являются в равной степени свидетельством промышленного и организационного потенциала, а также военно-морских амбиций." #NT!
 nd_gbr.5.a: "Деревянные стены Англии." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_sound_money: "Звуковые деньги" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_sound_money: "Банк Англии проводит политику денежной стабильности, поддерживая стоимость фунта стерлингов и предоставляя короне надежный кредит по выгодным ставкам." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_mercantile_credit: "Товарный кредит" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_mercantile_credit: "Банк Англии предоставляет щедрые кредиты как торговцам, так и строителям, способствуя буму коммерческих предприятий и строительных проектов по всей стране." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_highland_integration: "Хайлендская интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_highland_integration: "Кланы Хайленда приветствуются как равноправные подданные Короны, их культура уважается, а их люди интегрированы в более широкую структуру британского общества." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_martial_tradition: "Хайлендские боевые традиции" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_martial_tradition: "Жестокие воинские традиции Шотландского нагорья сохраняются и прославляются, направляясь в элитные полки, которые наводят ужас на врагов Британии на полях сражений по всему миру." #NT!
 nd_gbr_staple_ports: "Штапельные порты" #NT!
 nd_gbr_staple_ports_desc: "Система производства шерсти направляет английскую торговлю через определенные порты, создавая регулируемые рынки, которые концентрируют коммерческую деятельность и обеспечивают надежные таможенные доходы." #NT!
 nd_gbr_admiralty_courts: "Адмиралтейские суды" #NT!
 nd_gbr_admiralty_courts_desc: "Специализированные суды адмиралтейской юрисдикции разрешают морские споры, обеспечивают соблюдение закона о призах и обеспечивают правовую основу для расширяющегося военно-морского ведомства." #NT!
 nd_gbr_new_model_army: "Новая модель армии" #NT!
 nd_gbr_new_model_army_desc: "Революционное нововведение Оливера Кромвеля: профессиональная постоянная армия, организованная на основе заслуг, а не социального ранга, обученная строгой дисциплине и преданная делу, а не отдельным командирам." #NT!
 nd_gbr_chartered_companies: "Чартерные компании" #NT!
 nd_gbr_chartered_companies_desc: "Королевские хартии предоставляют акционерным компаниям монопольные права на торговлю в отдаленных регионах, сочетая частный капитал с общественной целью расширить британское коммерческое присутствие по всему миру." #NT!
 nd_gbr_race_built_galleon: "Гоночные галеоны" #NT!
 nd_gbr_race_built_galleon_desc: "Революционный дизайн корабля сэра Джона Хокинса: ниже в воде, длиннее по ширине и быстрее, чем высокие испанские галеоны, для борьбы с которыми они были построены." #NT!
 nd_gbr_english_dragoons: "Английские драгуны" #NT!
 nd_gbr_english_dragoons_desc: "Конная пехота, которая отправляется в бой, но сражается пешим путем, сочетая стратегическую мобильность кавалерии с огневой мощью мушкетеров." #NT!
 nd_gbr_royal_dockyards: "Королевские верфи" #NT!
 nd_gbr_royal_dockyards_desc: "Крупные военно-морские верфи в Чатеме, Портсмуте и Дептфорде составляют промышленную основу Королевского флота, способную строить, оснащать и ремонтировать военные корабли в беспрецедентных масштабах." #NT!
 nd_gbr_sloop_warfare: "Шлюповая война" #NT!
 nd_gbr_sloop_warfare_desc: "Небольшие, быстрые военные шлюпы патрулируют береговую линию и торговые пути, охотятся на пиратов, сопровождают конвои и поддерживают британское военно-морское присутствие в водах, слишком мелких или слишком удаленных для линейных кораблей." #NT!
 nd_gbr_bank_of_england: "Банк Англии" #NT!
 nd_gbr_bank_of_england_desc: "Создание национального банка в 1694 году произвело революцию в государственных финансах, обеспечив надежный кредит, стабилизировав валюту и дав Британии финансовое преимущество, с которым ее конкуренты не могут сравниться." #NT!
 nd_gbr_highland_regiments: "Горные полки" #NT!
 nd_gbr_highland_regiments_desc: "Свирепые воинские традиции Шотландского нагорья используются для имперской службы, поскольку воины кланов организованы в дисциплинированные полки, сочетающие в себе свирепость горцев с британской строевой подготовкой." #NT!
 nd_gbr_east_india_trade: "Ост-Индская торговля" #NT!
 nd_gbr_east_india_trade_desc: "Вооруженные торговые суда Ост-Индской компании, «Ост-Индийцы», курсируют по маршруту в Индию и за ее пределы, сочетая огромные военно-морские возможности с огромной грузоподъемностью." #NT!
 nd_gbr_royal_marines: "Королевская морская пехота" #NT!
 nd_gbr_royal_marines_desc: "Пеший морской полк герцога Йоркского и Олбани, созданный в 1664 году, создает постоянный корпус солдат, обученных для корабельного боя, абордажных действий и десантных операций." #NT!
 nd_gbr_turnpike_trusts: "Магистральные трасты" #NT!
 nd_gbr_turnpike_trusts_desc: "Частные магистральные трасты взимают плату за содержание и улучшение дорог, создавая сеть надежных всепогодных маршрутов, которые значительно сокращают время в пути и транспортные расходы по Великобритании." #NT!
 nd_gbr_frigate_design: "Дизайн британского фрегата" #NT!
 nd_gbr_frigate_design_desc: "Фрегат пятого ранга становится самым универсальным военным кораблем Королевского флота: достаточно быстрым, чтобы вести разведку боевого флота, достаточно мощным, чтобы сражаться с вражескими торговыми судами, и достаточно мореходным, чтобы действовать самостоятельно в обширных океанах." #NT!
 nd_gbr_first_rate_ships: "Первоклассные корабли" #NT!
 nd_gbr_first_rate_ships_desc: "Первоклассный линейный корабль, оснащенный сотней или более орудий на трех палубах, представляет собой высшее выражение деревянного военного корабля и военно-морской мощи." #NT!
 nd_gbr_horse_guards: "Конная гвардия" #NT!
 nd_gbr_horse_guards_desc: "Домашняя кавалерия, лейб-гвардия и королевская конная гвардия служат личным конным телохранителем государя и элитной тяжелой кавалерией на поле боя." #NT!
 nd_gbr_charity_schools: "Благотворительные школы" #NT!
 nd_gbr_charity_schools_desc: "Общество по распространению христианских знаний открывает благотворительные школы по всей Великобритании, предоставляя базовое образование детям бедных слоев населения и закладывая основы грамотной рабочей силы." #NT!
 nd_gbr_coal_and_iron: "Уголь и железо" #NT!
 nd_gbr_coal_and_iron_desc: "Обильные угольные пласты и месторождения железа в Британии в сочетании с инновациями в плавке и металлообработке создают сырьевую базу для промышленной трансформации, которая изменит мир." #NT!
 n_nd_gbr_race_built_ship: "Гоночный галеон" #NT!
 n_nd_gbr_race_built_ship_desc: "Революционный дизайн английского военного корабля с более низким профилем, более длинным корпусом и превосходными мореходными качествами по сравнению с высокими галеонами конкурирующих флотов." #NT!
 n_nd_gbr_sloop: "Военный шлюп" #NT!
 n_nd_gbr_sloop_desc: "Небольшой быстроходный патрульный корабль, предназначенный для сопровождения конвоев, операций по борьбе с пиратством и прибрежного патрулирования." #NT!
 n_nd_gbr_east_indiaman: "Ост-Индианец" #NT!
 n_nd_gbr_east_indiaman_desc: "Мощное вооруженное торговое судно Ост-Индской компании, предназначенное для долгого и опасного плавания в Индию и на Дальний Восток." #NT!
 n_nd_gbr_frigate: "Британский фрегат" #NT!
 n_nd_gbr_frigate_desc: "Универсальный военный корабль пятого ранга Королевского флота, достаточно быстрый для разведки и достаточно мощный, чтобы самостоятельно сражаться в мировом океане." #NT!
 n_nd_gbr_first_rate: "Первый курс" #NT!
 n_nd_gbr_first_rate_desc: "Высшее воплощение деревянного военного корабля: трехпалубная плавучая крепость со сотней орудий, способная вести разрушительный бортовой залп." #NT!
 a_nd_gbr_pikemen_levy: "Новая модель пикинеров" #NT!
 a_nd_gbr_pikemen_levy_desc: "Дисциплинированные профессиональные солдаты традиций Армии Новой Модели, обученные стойко стоять под огнем и толкать пики с механической точностью." #NT!
 a_nd_gbr_dragoon_levy: "Английские драгуны" #NT!
 a_nd_gbr_dragoon_levy_desc: "Конная пехота, которая отправляется в бой, но спешивается, чтобы сражаться, сочетая стратегическую мобильность с огневой мощью." #NT!
 a_nd_gbr_marines: "Королевская морская пехота" #NT!
 a_nd_gbr_marines_desc: "Профессиональные солдаты, обученные корабельному бою, абордажу и высадке десанта. Морские солдаты Короны." #NT!
 a_nd_gbr_horse_guards: "Конная гвардия" #NT!
 a_nd_gbr_horse_guards_desc: "Элитная домашняя кавалерия британского монарха, сочетающая церемониальное великолепие с разрушительными боевыми возможностями." #NT!
 nd_gbr_royal_dockyard: "Королевская верфь" #NT!
 nd_gbr_royal_dockyard_desc: "Крупнейшее военно-кораблестроительное и ремонтное предприятие, способное строить боевые корабли всех классов и поддерживать флот в боевом состоянии." #NT!
 nd_gbr_trading_factory: "Торговая фабрика" #NT!
 nd_gbr_trading_factory_desc: "Коммерческий склад и торговый пост, управляемый дипломированными торговцами, концентрирующий торговую деятельность и расширяющий британские торговые сети." #NT!
 nd_gbr_turnpike_road: "Магистраль Роуд" #NT!
 nd_gbr_turnpike_road_desc: "Платная дорога, обслуживаемая частным фондом, обеспечивает надежный всепогодный транспорт, соединяющий рынки и сокращающий время в пути." #NT!
 nd_gbr_charity_school: "Благотворительная школа" #NT!
 nd_gbr_charity_school_desc: "Школа, финансируемая за счет благотворительной подписки, предназначена для обучения детей бедняков, распространения грамотности и полезных знаний среди трудящихся классов." #NT!
 nd_gbr_admiralty_office: "Адмиралтейство" #NT!
 nd_gbr_admiralty_office_desc: "Региональный офис военно-морской администрации, который координирует операции флота, управляет набором моряков и ведет морской учет." #NT!
 nd_gbr_dockyard_maintenance: "Операции на верфи" #NT!
 nd_gbr_dockyard_maintenance_desc: "Непрерывные поставки древесины, военно-морских запасов и инструментов, необходимых для строительства и обслуживания военных кораблей на королевской верфи." #NT!
 nd_gbr_factory_maintenance: "Заводские операции" #NT!
 nd_gbr_factory_maintenance_desc: "Ткань, красители и бумажные пластинки продаются и потребляются фабрикой, обеспечивая ее коммерческую деятельность." #NT!
 nd_gbr_turnpike_maintenance: "Содержание магистрали" #NT!
 nd_gbr_turnpike_maintenance_desc: "Камень, древесина и инструменты, необходимые для ухода за дорожным покрытием, ремонта мостов и содержания в порядке платных шлагбаумов." #NT!
 nd_gbr_school_maintenance: "Школьные принадлежности" #NT!
 nd_gbr_school_maintenance_desc: "Бумага и книги необходимы для работы благотворительной школы, оснащения учеников инструментами грамотности." #NT!
 nd_gbr_admiralty_maintenance: "Адмиралтейские операции" #NT!
 nd_gbr_admiralty_maintenance_desc: "Бумага для корреспонденции, военно-морские запасы продовольствия и прекрасное сукно для униформы офицеров и чиновников, выполняющих административные функции адмиралтейства." #NT!
 nd_gbr_formed_tt: "Великобритания была образована" #NT!
 nd_gbr_path_a_tt: "Выбрать правило Британии" #NT!
 nd_gbr_path_b_tt: "Выбрал Мастерскую Мира" #NT!
 nd_gbr_dest_narrow_seas: "Командуйте узкими морями" #NT!
 nd_gbr_dest_narrow_seas_desc: "Морская судьба Британии начинается дома. Обезопасьте Ирландию, чтобы объединить архипелаг, захватите Кале, чтобы доминировать над Ла-Маншем, и создайте силы, достойные военно-морской державы. Только тогда Королевский флот сможет продемонстрировать силу за пределами этих вод." #NT!
 nd_gbr_dest_caribbean: "Карибская станция" #NT!
 nd_gbr_dest_caribbean_desc: "Сахарные острова Карибского моря и стратегический бастион Бермудские острова станут якорем британской военно-морской мощи в Новом Свете. Захватите Гавану у Испании и укрепите Атлантику, обеспечив безопасность торговых путей, которые обогащают Корону." #NT!
 nd_gbr_dest_pax_britannica: "Пакс Британская" #NT!
 nd_gbr_dest_pax_britannica_desc: "Высшее выражение британского военно-морского превосходства: контролируйте жизненно важные точки мира. Гибралтар контролирует Средиземное море, Аден охраняет Красное море, Бомбей закрепляет власть в Индии, а Сингапур обеспечивает проход на Восток." #NT!
 nd_gbr_dest_united_kingdom: "Соединенное Королевство" #NT!
 nd_gbr_dest_united_kingdom_desc: "Прежде чем Британия сможет изменить мир, она должна сначала консолидировать свои родные острова. Присоедините Ирландию к союзу, укрепите внутреннюю стабильность и обеспечьте потоки угля, топлива грядущей эпохи, через британские рынки." #NT!
 nd_gbr_dest_city_of_london: "Лондонский Сити" #NT!
 nd_gbr_dest_city_of_london_desc: "Квадратная миля лондонского Сити станет финансовой столицей мира. Накопите богатство великой державы, используйте современные банковские учреждения и превратите королевство в непревзойденный экономический двигатель." #NT!
 nd_gbr_dest_industrial_revolution: "Промышленная революция" #NT!
 nd_gbr_dest_industrial_revolution_desc: "От хлопчатобумажных фабрик Манчестера до кузниц Бирмингема Британия станет пионером эпохи машин. Примите участие в индустриализации, развивайте великие промышленные города и постройте нацию, чей производственный потенциал превосходит всех конкурентов." #NT!
 nd_gbr_destiny: "Британская судьба" #NT!
 nd_gbr_destiny_desc: "Великобритания едина. Вопрос, определяющий ее будущее: будет ли она править морями или создавать новый мир посредством промышленности, требует ответа. Судьба этих островов и мира, который они будут формировать, начинается здесь." #NT!
 nd_gbr.6.t: "Британская судьба" #NT!
 nd_gbr.6.d: "Великобритания выкована. Англия и Шотландия больше не соперники, а партнеры в союзе необычайного потенциала. Объединенные ресурсы этих островов (верфи Темзы, угольные пласты Мидлендса, выносливые моряки Корнуолла и Хайленда) создают нацию непревзойденной универсальности.\n\nНо потенциал сам по себе не создает величия. Путь, который выберет Великобритания, определит, станет ли она хозяином мирового океана или мастерской, преобразующей саму цивилизацию. Оба пути ведут к превосходству, но они требуют разных жертв и разных добродетелей." #NT!
 nd_gbr.6.a: "Наша судьба ждет." #NT!
 nd_gbr.7.t: "Командование узких морей" #NT!
 nd_gbr.7.d: "Ла-Манш и Ирландское море теперь являются британскими водами на самом деле, а не только в мечтах. Поскольку Дублин захвачен, а Кале находится в руках Великобритании, никакой флот не может угрожать этим островам, и ни одно торговое судно не может пройти без разрешения Великобритании.\n\nУзкие моря — это ворота в большой мир. С этой позиции неприступной внутренней обороны Британия теперь может проецировать свою военно-морскую мощь вовне, в Карибское море, в Средиземное море, в далекие воды Индийского океана." #NT!
 nd_gbr.7.a: "Канал наш." #NT!
 nd_gbr.8.t: "Карибский вокзал" #NT!
 nd_gbr.8.d: "Британские военные корабли теперь патрулируют бирюзовые воды Карибского моря, а «Юнион Джек» пролетает над Гаваной и Бермудскими островами. Сахарные острова производят баснословные богатства, стратегические гавани служат местом стоянки для эскадр, которые могут нанести удар в любую точку Америки, а торговые пути домой защищены от всех желающих.\n\nНо чему в конечном итоге послужит это карибское владычество? Богатство плантаций сахара, рома и табака может способствовать беспрецедентному процветанию британского торгового класса. Альтернативно, карибские станции могут стать передовыми оперативными базами флота, предназначенного для контроля над всеми океанами." #NT!
 nd_gbr.8.a: "Пусть торговля сахаром перетечет в Лондон." #NT!
 nd_gbr.8.b: "Наш флот будет контролировать каждый горизонт." #NT!
 nd_gbr.9.t: "Пакс Британская" #NT!
 nd_gbr.9.d: "Гибралтар. Аден. Бомбей. Сингапур. Четыре имени, которые вместе означают мировое господство. Британия теперь контролирует все жизненно важные точки между Европой и Востоком, контролируя Средиземноморский проход, путь Красного моря, Индийский океан и Малаккский пролив.\n\nНи один флот не может двигаться, ни один торговец не может торговать, ни одна империя не может продемонстрировать свою мощь без разрешения Великобритании. Это Pax Britannica, мир, поддерживаемый непревзойденной мощью Королевского флота. Но как использовать это беспрецедентное превосходство? Посредством прямого применения силы подчинить соперников британской воле? Или путем терпеливого строительства имперской системы, объединяющей подчиненные народы в федерацию, служащую Лондону?" #NT!
 nd_gbr.9.a: "Пусть канонерские лодки несут нашу дипломатию." #NT!
 nd_gbr.9.b: "Мы свяжем империю воедино." #NT!
 nd_gbr.10.t: "Соединенное Королевство" #NT!
 nd_gbr.10.d: "Акт о союзе с Ирландией завершает объединение Британских островов в единое политическое образование — Соединенное Королевство Великобритании и Ирландии. Когда внутренняя стабильность обеспечена, а уголь, который приведет в действие революцию, свободно течет по британским рынкам, основы экономического превосходства заложены.\n\nРодные острова больше не представляют собой совокупность враждующих королевств, а представляют собой единое экономическое пространство с исключительным производственным потенциалом. То, что когда-то было лоскутным одеялом региональных экономик, становится единым интегрированным рынком, крупнейшим и наиболее развитым в Европе." #NT!
 nd_gbr.10.a: "Одно королевство, один рынок, одна судьба." #NT!
 nd_gbr.11.t: "Лондонский Сити" #NT!
 nd_gbr.11.d: "Лондонский Сити, эта древняя квадратная миля внутри старых римских стен, стал бесспорной финансовой столицей мира. Банк Англии устанавливает процентные ставки, которые колеблются по континентам, Lloyd's страхует каждое судно на плаву, а Королевская биржа устанавливает цены на товары со всех уголков земного шара.\n\nЭта концентрация финансовой мощи дает Британии рычаги воздействия, которые не могут обеспечить в одиночку армии. Но влияние Города может быть направлено по-разному. Будет ли он служить фондовой биржей, направляя капитал в продуктивные предприятия и снижая стоимость строительства по всему миру? Или он должен развиваться как рынок страхования и разведки, где информация, проходящая через Lloyd's и счетные палаты, дает Британии непревзойденное дипломатическое преимущество?" #NT!
 nd_gbr.11.a: "Капитал построит эту нацию." #NT!
 nd_gbr.11.b: "Информация – это истинная валюта власти." #NT!
 nd_gbr.12.t: "Промышленная революция" #NT!
 nd_gbr.12.d: "Мир никогда не будет прежним. На хлопчатобумажных фабриках Манчестера и чугунолитейных заводах Бирмингема происходит революция, которая преобразует человеческую цивилизацию глубже, чем любое завоевание. Паровые двигатели выкачивают воду из шахт, приводят в движение ткацкие станки, которые производят ткань в сто раз быстрее, чем ручные ткачи, и электрические сильфоны, которые выплавляют железо в количествах, ранее невообразимых.\n\nВ эпицентре этой трансформации находится Британия. Но что в конечном итоге будет означать промышленная революция для британского общества? Чистая производительная сила пара может быть направлена ​​на военное и логистическое превосходство, что позволит ускорить мобилизацию и передвижение армий. Или социальные потрясения, вызванные индустриализацией, можно использовать посредством парламентской реформы, расширения избирательных прав, отмены старой несправедливости и построения более стабильного общества." #NT!
 nd_gbr.12.a: "Steam обеспечит наше превосходство." #NT!
 nd_gbr.12.b: "Реформа укрепит наше общество." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_sugar_trade: "Торговля сахаром" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_sugar_trade: "Сахарные плантации Карибского бассейна приносят огромное богатство, обогащая британский торговый класс и концентрируя коммерческую власть в крупных торговых домах, хотя расходы на содержание отдаленных гарнизонов обременяют армейский бюджет." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_colonial_fleet: "Колониальный флот" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_colonial_fleet: "Специально построенные эскадрильи быстрых, устойчивых к погодным условиям кораблей патрулируют Атлантику и Карибский бассейн, перебрасывая британскую военно-морскую мощь через океан и обеспечивая безопасность всех торговых путей Короны." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_gunboat_diplomacy: "Дипломатия канонерок" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_gunboat_diplomacy: "Британский военный корабль в гавани говорит громче, чем любой посол. Королевский флот обеспечивает соблюдение договоров, открывает рынки и разрешает споры, подразумевая неявную угрозу разрушительной огневой мощи." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_imperial_federation: "Имперская Федерация" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_imperial_federation: "Обширные территории Британской империи связаны общими институтами, общим правом и невидимыми нитями торговли и управления, хотя такое обширное владычество порождает опасное самоуспокоение." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_stock_exchange: "Фондовая биржа" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_stock_exchange: "Лондонская фондовая биржа направляет частный капитал в продуктивные инвестиции, снижая стоимость строительства и укрепляя финансовое положение Короны посредством культуры инноваций и спекуляций." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_insurance_market: "Страховой рынок" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_insurance_market: "Лондонский Ллойд и разведывательные сети Сити предоставляют Британии непревзойденные знания о мировых делах, улучшая дипломатические отношения и обеспечивая свободное движение торговли на открытых рынках." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_steam_power: "Сила пара" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_steam_power: "Паровой двигатель преобразует не только промышленность, но и военное дело. Более быстрый набор персонала, улучшение логистики и концентрация производственных мощностей в крупных городах Великобритании дают нации решающее военно-промышленное преимущество." #NT!
 STATIC_MODIFIER_NAME_nd_gbr_dest_reform_acts: "Реформа действует" #NT!
 STATIC_MODIFIER_DESC_nd_gbr_dest_reform_acts: "Парламентская реформа расширяет избирательные права, упраздняет гнилые районы и решает социальные потрясения, вызванные индустриализацией. Более представительное правительство требует большей лояльности и снижает привлекательность сепаратизма и революции." #NT!
 nd_gbr_royal_arsenal: "Королевский Арсенал" #NT!
 nd_gbr_royal_arsenal_desc: "Огромный военно-промышленный комплекс, объединяющий судостроение, артиллерийское производство и гарнизонные объекты, способный оснащать и содержать как военно-морские, так и сухопутные силы в масштабах, с которыми не может сравниться ни один конкурент." #NT!
 nd_gbr_industrial_works: "Промышленные работы" #NT!
 nd_gbr_industrial_works_desc: "Механизированное производство, работающее на паре и угле, производящее продукцию со скоростью и в таких масштабах, которые преобразуют местную экономику и привлекают рабочих со всего региона." #NT!
 nd_gbr_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_gbr_arsenal_maintenance_desc: "Железные и военно-морские запасы, необходимые для поддержания в рабочем состоянии литейных цехов и эллингов арсенала." #NT!
 nd_gbr_works_maintenance: "Промышленные операции" #NT!
 nd_gbr_works_maintenance_desc: "Уголь и железо питают печи и паровые молоты промышленных предприятий, производя сталь для страны, находящейся в процессе трансформации." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_gbr_bureaucracy_authority: "Вестминстерский аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_gbr_bureaucracy_authority: "Институциональный механизм британского государства (Тайный совет, Казначейство, суды в Вестминстер-холле и постоянная государственная служба) превратился в слаженный аппарат, способный поддерживать несколько специализированных ведомств рядом друг с другом." #NT!
  
 justices_of_the_peace_bureaucracy: "Мировые судьи" #NT!
 justices_of_the_peace_bureaucracy_desc: "Официально оформленные Законом о мировых судьях 1361 года, мирские судьи графств стали опорой местного правительства Тюдоров. Набранные из землевладельцев, JP рассматривали уголовные преступления на квартальных сессиях, применяли законы о бедных, собирали ополчение и эффективно управляли английскими графствами до реформированных советов графств в 19 веке. Их власть принадлежит Короне, но их интересы, несомненно, совпадают с интересами оруженосцев." #NT!
  
 star_chamber_bureaucracy: "Суд Звездной палаты" #NT!
 star_chamber_bureaucracy_desc: "Находясь в раскрашенном звездами зале Вестминстерского дворца со времен Закона о Звездной палате Генриха VII 1487 года до его отмены Длинным парламентом в 1641 году, этот прерогативный суд Королевского совета обходил присяжных по общему праву и принуждал к повиновению всемогущих подданных. Под канцлерством кардинала Уолси Звездная палата стала огромной; при первых Стюартах он стал олицетворением королевского абсолютизма, и цена, которую потребовала от короны его закрытие, была уплачена в 1649 году." #NT!
  
 exchequer_bureaucracy: "Казначейство" #NT!
 exchequer_bureaucracy_desc: "Учрежденное Генрихом I в начале XII века и названное в честь клетчатой ​​ткани, на которой велись счета шерифов, Казначейство дважды в год проверяло все поступления и выплаты Короны. Трубочные валки, производимые его баронами, служили якорем английского финансового управления на семь столетий, пока официальное прекращение деятельности этого департамента Законом о казначействе и аудиторских департаментах 1833 года не оставило после себя только казначейский счет Банка Англии." #NT!
  
 royal_mint_bureaucracy: "Королевский монетный двор" #NT!
 royal_mint_bureaucracy_desc: "Чеканка Генриха II в Тилби 1158 года установила стандарт стерлингового серебра на уровне 92,5 процента пробы, эталон сохранялся с печально известными ухудшениями качества до 1920 года. Монетный двор, размещенный в лондонском Тауэре под управлением королевского пробирного мастера, ежегодно проверялся в ходе «Испытания Пикса», старейшего процесса непрерывного контроля качества в королевстве. Надежная монета является гарантией как уверенности торговца в торговле на дальние расстояния, так и репутации Короны как честной компании." #NT!
  
 navy_board_bureaucracy: "Совет ВМФ" #NT!
 navy_board_bureaucracy_desc: "Созданный на основании патента Генриха VIII 24 апреля 1546 года как Морской совет, Военно-морской совет сделал Королевский флот постоянным учреждением, а не флотом, нанимаемым от кампании к кампании. Казначей, геодезист, контролер и служащий военно-морского флота управляли верфями в Дептфорде, Вулидже и Портсмуте и управляли каждым контрактом на поставку древесины, веревок и литья оружия. С 1628 года он подчинялся Адмиралтейству, но опыт его верфи пережил любую реорганизацию." #NT!
  
 bank_of_england_bureaucracy: "Банк Англии" #NT!
 bank_of_england_bureaucracy_desc: "Учрежденный 27 июля 1694 года в соответствии с Законом о тоннаже по плану Чарльза Монтегю, управляющий и компания Банка Англии ссудили 1,2 миллиона фунтов стерлингов военному правительству Вильгельма III в обмен на привилегии выпуска банкнот и управление консолидированным долгом. Преобразовав краткосрочные военные займы в бессрочные аннуитеты по предсказуемым ставкам, Банк предоставил Великобритании устойчивый кредит, на котором были построены финансово-военное государство и долгие войны 18-го века с Францией." #NT!
  
 westminster_parliament_bureaucracy: "Парламент Вестминстера" #NT!
 westminster_parliament_bureaucracy_desc: "Акты Союза 1707 года распустили Эдинбургский и английский парламенты и созвали единый парламент Великобритании в Вестминстере с представителями шотландских пэров в палате лордов и 45 шотландскими членами в палате общин. Его законодательное превосходство после 1689 года сделало его незаменимым гарантом военно-фискального государства: парламентские налоги обеспечили государственный кредит и сделали устав Банка Англии надежным. Ценой было постоянное ослабление королевских прерогатив." #NT!
