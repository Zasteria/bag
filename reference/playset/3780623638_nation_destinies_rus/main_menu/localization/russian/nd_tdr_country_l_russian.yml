 TDR: "Боспорское царство" #NT!
 TDR_ADJ: "Боспор" #NT!
 TDR_f: "Боспорское царство" #NT!
 TDR_f_desc: "Восстановите утраченное королевство на понтийском побережье: греко-готическое королевство, стоящее на якоре в Мангупе, наследник князей Феодорита и древних боспорских династий до них. Примет ли он форму римского Regnum Bospori или Киммерийского Боспора готских королей, зависит от того, какую родословную решит уважать его двор." #NT!
