l_russian:
 STATIC_MODIFIER_NAME_nd_defender_of_the_faith: "Защитник веры" #NT!
 STATIC_MODIFIER_DESC_nd_defender_of_the_faith: "Иерусалимское королевство выступает как щит христианского мира на Востоке, оплот против неверных, поддерживаемый верой и мечами его рыцарей." #NT!
 STATIC_MODIFIER_NAME_nd_crossroads_of_commerce: "Перекресток торговли" #NT!
 STATIC_MODIFIER_DESC_nd_crossroads_of_commerce: "Порты и рынки Святой Земли направляют богатства Востока и Запада, делая Иерусалим центром, вокруг которого вращается средиземноморская торговля." #NT!
 STATIC_MODIFIER_NAME_nd_koj_assizes_legacy: "Наследие присяжных" #NT!
 STATIC_MODIFIER_DESC_nd_koj_assizes_legacy: "Кодификация иерусалимских присяжных обеспечивает всеобъемлющую правовую основу, которая мудро и прецедентно управляет делами Утремера." #NT!
 STATIC_MODIFIER_NAME_nd_koj_walls_of_outremer: "Стены Утремера" #NT!
 STATIC_MODIFIER_DESC_nd_koj_walls_of_outremer: "Великие концентрические крепости Святой Земли представляют собой вершину оборонительной архитектуры, а их многослойные стены и места для убийств — урок, высеченный из камня." #NT!
 nd_koj.1.t: "Королевство восстановлено" #NT!
 nd_koj.1.d: "Иерусалим наш. Святой Город, за который столько людей сражалось и погибло, взят под знамя Креста. Паломники плачут при виде Гроба Господня, рыцари преклоняют колени в молитве на Храмовой горе, а торговцы с едва скрываемой жадностью взирают на шумные порты Акры и Тира. Иерусалимское королевство провозглашается заново, но какое это будет царство? Будем ли мы крепостью веры, воинственным государством, призванным защищать самые святые места христианского мира? Или нам следует занять свое положение на перекрестке трех континентов, богатея за счет торговли, проходящей через наши порты и караван-сараи?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_koj.1.a: "Мы Меч и Щит Христа!" #NT!
 nd_koj.1.b: "Пусть богатства Востока и Запада текут через наши руки." #NT!
 nd_koj.2.t: "Присяжные Иерусалима" #NT!
 nd_koj.2.d: "Юристы королевства завершили великую работу по кодификации. Опираясь на обычаи франкских поселенцев, традиции итальянских коммун и практические потребности управления разрозненным королевством во враждебных землях, они составили Иерусалимские ассизы — наиболее полный юридический кодекс христианского мира к востоку от Константинополя. Верховный суд и Суд буржуазии теперь имеют четкий письменный прецедент, которым они могут руководствоваться в своих обсуждениях, от вопросов феодальных обязательств и землевладения до регулирования торговли и прав горожан. Должны ли мы усилить власть короны с помощью этого нового юридического инструмента или использовать его для стабилизации государства?" #NT!
 nd_koj.2.a: "Закон является основой хорошего правительства." #NT!
 nd_koj.2.b: "Хорошие законы привлекают хороших поселенцев." #NT!
 nd_koj.3.t: "Концентрическая крепость" #NT!
 nd_koj.3.d: "Наши инженеры усовершенствовали революционный подход к обогащению. Воспользовавшись горькими уроками осадной войны против сарацинских саперов и осадных машин, они построили концентрический замок, множество колец навесных стен, каждое из которых контролирует предыдущее, с башнями, расположенными так, чтобы пересекать огневые поля. Внутренние стены возвышаются над внешними, так что защитники могут стрелять по своим товарищам внизу. Изогнутые входы, ямы для убийств и механизация превращают каждый подход в поле убийств. Крак де Шевалье, Бельвуар и Маргат являются памятниками этого нового искусства защиты. Будем ли мы продолжать инвестировать в эти могучие крепости?" #NT!
 nd_koj.3.a: "Постройте стены, которые устоят до Судного Дня." #NT!
 nd_koj.3.b: "Эти стены сломают любую осаду." #NT!
 nd_koj_feudal_outremer: "Феодальный Утремер" #NT!
 nd_koj_feudal_outremer_desc: "Франкские поселенцы создали феодальную администрацию, адаптированную к реалиям управления узким прибрежным королевством, окруженным враждебными державами, сочетая западные обычаи с местной практикой." #NT!
 nd_koj_arriere_ban: "Аррьер-Бан из Утремера" #NT!
 nd_koj_arriere_ban_desc: "В отличие от Европы, где феодальная служба ограничивалась сорока днями, короли Иерусалима требовали от своих вассалов полного года военной службы, необходимость, порожденная постоянной экзистенциальной угрозой." #NT!
 nd_koj_turcopole_tradition: "Тюркопольская традиция" #NT!
 nd_koj_turcopole_tradition_desc: "Туркополы представляли собой набранную на месте легкую кавалерию, которая служила разведчиками, конными лучниками и застрельщиками. Часто набранные из христианизированных сельджуков или сирийских христиан, они составляли до половины конных сил королевства." #NT!
 nd_koj_pilgrim_roads: "Паломнические дороги" #NT!
 nd_koj_pilgrim_roads_desc: "Защита и налогообложение паломников, направляющихся к святым местам, стали основным источником дохода королевства: население Иерусалима удвоилось во время летнего сезона паломничества." #NT!
 nd_koj_sugar_estates: "Сахарные плантации Леванта" #NT!
 nd_koj_sugar_estates_desc: "Крестоносцы обнаружили, что сахарный тростник уже выращивается в Леванте, и резко расширили его производство. Большая часть сахара, потреблявшегося в Европе тринадцатого века, происходила из государств крестоносцев.\n\n#italic Доступно в: $nd_koj_sugar_press$#!" #NT!
 nd_koj_concentric_fortification: "Концентрическое укрепление" #NT!
 nd_koj_concentric_fortification_desc: "Концентрический замок с его многочисленными кольцами навесных стен и взаимосвязанными огневыми полями был усовершенствован в государствах крестоносцев как ответ на передовые методы осады их мусульманских противников." #NT!
 nd_koj_acre_entrepot: "Акко-перевалка" #NT!
 nd_koj_acre_entrepot_desc: "Акко заменила Александрию в качестве самого важного торгового порта в восточном Средиземноморье, принимая торговцев из Византии, Северной Африки, Аравии и итальянских морских республик." #NT!
 nd_koj_italian_quarter: "Итальянский квартал" #NT!
 nd_koj_italian_quarter_desc: "Итальянские морские республики Венеция, Генуя и Пиза имели автономные торговые кварталы в портах Утремера, их финансовые ресурсы и военно-морская мощь были необходимы для выживания королевства." #NT!
 nd_koj_templar_banking: "Банковское дело тамплиеров" #NT!
 nd_koj_templar_banking_desc: "Рыцари-тамплиеры разработали раннюю систему банковского дела и кредита, позволяющую паломникам вносить средства в Европу и снимать их на Святой Земле, финансовая инновация, рожденная практической необходимостью." #NT!
 nd_koj_assizes_of_jerusalem: "Присяжные Иерусалима" #NT!
 nd_koj_assizes_of_jerusalem_desc: "Иерусалимские ассизы представляли собой наиболее полный феодальный правовой кодекс средневекового периода, регулирующий все, от землевладения и феодальных обязательств до коммерческого регулирования и прав горожан." #NT!
 nd_koj_outremer_navy: "Военно-морской флот Аутремера" #NT!
 nd_koj_outremer_navy_desc: "Хотя Иерусалимское королевство зависело от итальянских военно-морских сил, оно содержало собственный флот военных галер для патрулирования побережья Леванта, защиты торгового судоходства и поддержки десантных операций." #NT!
 nd_koj_holy_land_relics: "Реликвии Святой Земли" #NT!
 nd_koj_holy_land_relics_desc: "Торговля святыми реликвиями, сувенирами и религиозными артефактами была прибыльной отраслью в государствах крестоносцев, питая ненасытный аппетит европейского христианского мира к осязаемым связям со священными местами.\n\n#italic Доступно в: $nd_koj_levantine_fondaco$#!" #NT!
 nd_koj_desert_warfare: "Война в пустыне" #NT!
 nd_koj_desert_warfare_desc: "Поколения войн против Айюбидов и мамлюков научили крестоносцев адаптировать свою тактику к засушливой местности Леванта, научиться управлять запасами воды, избегать засад и сражаться в палящую жару." #NT!
 nd_koj_hospitaller_medicine: "Госпитальерская медицина" #NT!
 nd_koj_hospitaller_medicine_desc: "Рыцари-госпитальеры содержали большой госпиталь Св. Иоанна в Иерусалиме, где врачи, опирающиеся как на европейские, так и на арабские медицинские традиции, лечили больных и раненых независимо от религии и ранга." #NT!
 nd_koj_crossroads_diplomacy: "Перекресток дипломатии" #NT!
 nd_koj_crossroads_diplomacy_desc: "Расположенное на стыке трех континентов, Иерусалимское королевство поддерживало сложные дипломатические отношения с Византией, итальянскими республиками, папством, а иногда даже со своими мусульманскими соседями." #NT!
 nd_koj_frankish_chivalry: "Франкское рыцарство" #NT!
 nd_koj_frankish_chivalry_desc: "Атака тяжелой кавалерии франков была самым грозным оружием в арсенале крестоносцев: рыцари в доспехах на конях врезались во вражеские порядки с инерцией железной лавины." #NT!
 nd_koj_levantine_commerce: "Левантийская торговля" #NT!
 nd_koj_levantine_commerce_desc: "К более позднему периоду существования королевства коммерческие доходы затмили феодальную ренту в качестве основного источника королевских доходов, а порты Акры и Тира служили жизненно важными каналами для торговли между Востоком и Западом." #NT!
 nd_koj_holy_land_garrison: "Гарнизон Святой Земли" #NT!
 nd_koj_holy_land_garrison_desc: "Постоянная гарнизонная система государств крестоносцев, поддерживаемая военными приказами и феодальными обязательствами, позволяла небольшому христианскому населению удерживать огромные территории против численно превосходящих врагов." #NT!
 nd_koj_crusader_legacy: "Наследие крестоносцев" #NT!
 nd_koj_crusader_legacy_desc: "Наследие Королевства крестоносцев сохранилось в огромных замках, которые все еще стоят, в правовых традициях, которые повлияли на европейскую юриспруденцию, и в культурном обмене между Востоком и Западом, которому оно способствовало." #NT!
 nd_koj_kingdom_restored: "Королевство восстановлено" #NT!
 nd_koj_kingdom_restored_desc: "Иерусалимское королевство возрождается в новую эпоху, его древние претензии на Священный город получили новую жизнь и новую цель." #NT!
 nd_koj_eastern_diplomacy: "Восточная дипломатия" #NT!
 nd_koj_eastern_diplomacy_desc: "Навигация по сложной паутине союзов и соперничества на современном Ближнем Востоке требует тех же дипломатических навыков, которые когда-то поддерживали узкую полоску христианской территории среди моря мусульманских держав." #NT!
 nd_koj_holy_city_renown: "Слава Святого города" #NT!
 nd_koj_holy_city_renown_desc: "Иерусалим — город, священный для трех религий, и его правитель занимает положение непревзойденного культурного и религиозного значения, вызывая внимание и уважение всего мира." #NT!
 a_nd_koj_turcopoles: "Туркополи" #NT!
 a_nd_koj_turcopoles_desc: "Набираемая на месте легкая кавалерия в качестве разведчиков, конных лучников и застрельщиков. Часто набранные из христианизированных сельджуков или сирийских христиан, они были незаменимы в полевых армиях крестоносцев." #NT!
 a_nd_koj_crusader_sergeants: "Сержанты-крестоносцы" #NT!
 a_nd_koj_crusader_sergeants_desc: "Конные воины, составлявшие костяк полевых армий крестоносцев. Лучше оснащенные, чем обычные рекруты, но не рыцарского ранга, они составляли устойчивое пехотное ядро ​​в каждом сражении." #NT!
 n_nd_koj_outremer_galley: "Аутремер Галлей" #NT!
 n_nd_koj_outremer_galley_desc: "Военная галера, построенная и укомплектованная экипажем в портах Святой Земли, адаптированная к особым требованиям левантийской прибрежной войны и защиты торговых путей." #NT!
 a_nd_koj_frankish_knights: "Франкские рыцари" #NT!
 a_nd_koj_frankish_knights_desc: "Элитная тяжелая кавалерия Утремера, рыцари в доспехах на могучих конях, с юности обученные военному искусству и посвятившие себя защите Святой Земли." #NT!
 nd_koj_hall_of_justice: "Зал правосудия крестоносцев" #NT!
 nd_koj_hall_of_justice_desc: "Суд, управляющий работой присяжных в Иерусалиме, где обычаи франкских поселенцев кодифицированы и применяются к управлению Утремером." #NT!
 nd_koj_concentric_fortress: "Концентрическая крепость" #NT!
 nd_koj_concentric_fortress_desc: "Революционная многокольцевая крепость с перекрывающимися полями огня, усовершенствованная инженерами крестоносцев в ответ на передовые методы осады их мусульманских противников." #NT!
 nd_koj_levantine_fondaco: "Левантийский Фондако" #NT!
 nd_koj_levantine_fondaco_desc: "Торговый склад и торговый пост в итальянском стиле, где товары с Востока и Запада переходят из рук в руки, укомплектованный специалистами из великих морских республик." #NT!
 nd_koj_sugar_press: "Сахарный Пресс" #NT!
 nd_koj_sugar_press_desc: "Водяная мельница для измельчения сахарного тростника, выращенного в поместьях крестоносцев. Сахарная промышленность Леванта входила в число наиболее прибыльных предприятий латинских королевств." #NT!
 nd_koj_mill_upkeep: "Мельничные операции" #NT!
 nd_koj_mill_upkeep_desc: "Древесина, инструменты и жернова для водяного колеса, валков и кипящих чанов сахарного пресса." #NT!
 nd_koj_hospitaller_infirmary: "Госпитальерский лазарет" #NT!
 nd_koj_hospitaller_infirmary_desc: "Больница, построенная в традициях рыцарей-госпитальеров, где врачи, обученные европейской и арабской медицине, лечат больных и раненых." #NT!
 nd_koj_royal_palace: "Королевский дворец Иерусалима" #NT!
 nd_koj_royal_palace_desc: "Место восстановленной монархии крестоносцев, дворец, достойный правителя, владеющего самым священным городом христианского мира." #NT!
 nd_koj_sugar_processing: "Переработка сахара" #NT!
 nd_koj_sugar_processing_desc: "Дробление левантийского сахарного тростника с помощью волокнистого прессового материала и кипячение его сока для получения экспортного сахара — прибыльная отрасль, унаследованная от арабов и расширенная крестоносцами." #NT!
 nd_koj_relic_trade: "Торговля реликвиями" #NT!
 nd_koj_relic_trade_desc: "Производство и продажа святых реликвий, паломнических сувениров и религиозных артефактов на ненасытный рынок европейского христианского мира." #NT!
 nd_koj_justice_maintenance: "Администрация суда" #NT!
 nd_koj_justice_maintenance_desc: "Ведение юридических записей, административной переписки и официальных облачений суда крестоносцев." #NT!
 nd_koj_fortress_maintenance: "Содержание крепости" #NT!
 nd_koj_fortress_maintenance_desc: "Поддержание массивных каменных стен, башен, оружейных и столярных изделий концентрической крепости." #NT!
 nd_koj_fondaco_maintenance: "Фондако Операции" #NT!
 nd_koj_fondaco_maintenance_desc: "Управление торговым складом в итальянском стиле, управление торговлей товарами и оформление договоров со средиземноморскими партнерами." #NT!
 nd_koj_infirmary_maintenance: "Содержание лазарета" #NT!
 nd_koj_infirmary_maintenance_desc: "Обеспечение госпитальерского лазарета лекарствами, медицинскими принадлежностями и чистым бельем." #NT!
 nd_koj_palace_maintenance: "Содержание дворца" #NT!
 nd_koj_palace_maintenance_desc: "Поддержание каменных стен, прекрасной мебели и сокровищницы королевского дворца." #NT!
 STATIC_MODIFIER_NAME_nd_koj_outremer_settlement: "Поселение Утремер" #NT!
 STATIC_MODIFIER_DESC_nd_koj_outremer_settlement: "Хорошие законы и справедливое управление привлекают поселенцев на Святую Землю, создавая стабильную базу населения, которая поддерживает королевство за счет колонизации, а не только за счет завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_koj_castle_doctrine: "Замковая доктрина" #NT!
 STATIC_MODIFIER_DESC_nd_koj_castle_doctrine: "Концентрические крепости Утремера — это больше, чем просто стены; это доктрина защиты, система опорных пунктов, делающая королевство почти неприступным." #NT!
 nd_koj_formed_tt: "Образовано Иерусалимское королевство." #NT!
 nd_koj_path_a_tt: "Избранный защитник веры" #NT!
 nd_koj_path_b_tt: "Выбрали «Перекресток торговли»" #NT!
 nd_koj_destiny: "Судьба Иерусалима" #NT!
 nd_koj_destiny_desc: "Иерусалимское королевство было восстановлено. Теперь ему предстоит выбрать свою судьбу: отправиться в крестовый поход за веру или построить торговую империю." #NT!
 nd_koj_dest_crusader_states: "Государства крестоносцев" #NT!
 nd_koj_dest_crusader_states_desc: "Воссоедините исторические государства крестоносцев под одной короной. Обеспечьте безопасность Антиохии и графства Триполи, чтобы создать единый христианский фронт в Леванте." #NT!
 nd_koj_dest_march_east: "Марш на Восток" #NT!
 nd_koj_dest_march_east_desc: "Несите Крест в сердце Ислама. Великие города Дамаск и Алеппо должны пасть, чтобы завершить владычество крестоносцев над Сирией." #NT!
 nd_koj_dest_new_crusade: "Новый крестовый поход" #NT!
 nd_koj_dest_new_crusade_desc: "Начните решающий крестовый поход на юг, в Египет, и далее к священным городам Аравии. Ни один христианский король никогда не достиг того, что вы сейчас пытаетесь." #NT!
 nd_koj_dest_levantine_ports: "Левантийские порты" #NT!
 nd_koj_dest_levantine_ports_desc: "Обеспечьте безопасность великих торговых портов восточного Средиземноморья. Кипр и Бейрут являются ключами к контролю над морскими путями Леванта." #NT!
 nd_koj_dest_silk_road: "Западный Шелковый путь" #NT!
 nd_koj_dest_silk_road_desc: "Черпайте богатства Востока через свои рынки. Шелк и благовония должны течь через руки крестоносцев, превращая Иерусалим в западную конечную точку великих торговых путей." #NT!
 nd_koj_dest_emporium: "Торговый центр трех континентов" #NT!
 nd_koj_dest_emporium_desc: "Постройте коммерческую империю, простирающуюся от Александрии до Константинополя. Контролируйте перекресток, где встречаются Европа, Азия и Африка." #NT!
 nd_koj.4.t: "Судьба Иерусалима" #NT!
 nd_koj.4.d: "Корона Иерусалима сидит на челе, несущем бремя пророчества. Мы восстановили Царство, но какое царство нам построить? Выбор, сделанный при нашем основании, отражается в истории, и теперь путь разворачивается перед нами. Будь то защитники веры или мастера торговли, мы высечем свою судьбу на камне веков." #NT!
 nd_koj.4.a: "Наша судьба ждет." #NT!
 nd_koj.5.t: "Государства крестоносцев воссоединились" #NT!
 nd_koj.5.d: "Знамена Антиохии и Триполи снова развеваются рядом с Иерусалимским крестом. Впервые со времен первых крестовых походов христианские государства Леванта объединились под единой короной. Антиохийское княжество, основанное Боэмундом, и графство Триполи, созданное Раймоном Тулузским, были возвращены в лоно. То, что было разрушено мусульманским завоеванием и франкским разделением, было восстановлено." #NT!
 nd_koj.5.a: "Франки Утремера снова стали одним народом." #NT!
 nd_koj.6.t: "Марш на Восток" #NT!
 nd_koj.6.d: "Дамаск пал. Алеппо пал. Великие мусульманские города Сирии, которые на протяжении столетия сопротивлялись амбициям крестоносцев, теперь склоняются перед Иерусалимским крестом. Сам Саладин не смог удержать то, что мы захватили, и владения Атабега разрушены. Вопрос теперь в том, как мы распорядимся этой беспрецедентной силой. Продвигаемся ли мы вперед, как молот Божий, все глубже проникая в земли неверных? Или мы консолидируемся, строя прочный мир на землях, которые мы уже завоевали?" #NT!
 nd_koj.6.a: "Мы молот Божий. Пусть никто не устоит." #NT!
 nd_koj.6.b: "Постройте мир в Иерусалиме над всей Сирией." #NT!
 nd_koj.7.t: "Новый триумфальный крестовый поход" #NT!
 nd_koj.7.d: "Каир пал перед Крестом. Священные города Аравии находятся под нашей защитой. То, чего еще не достиг ни один крестовый поход, о чем только мечтал Ричард Львиное Сердце, уже осуществлено. Сердце Айюбидов, оплот мамлюков, священные города самого ислама — все они подчиняются короне Иерусалима. Мир смотрит с удивлением. Будем ли нас помнить как Меч Христов, непобедимых воинов, покоривших Восток? Или как архитекторы нового Царства Небесного, царства, где священное наследие Святой Земли преображает все, к чему прикасается?" #NT!
 nd_koj.7.a: "Мы — Меч Христа, и никто не сможет ему сопротивляться." #NT!
 nd_koj.7.b: "Мы построим Царство Небесное на земле." #NT!
 nd_koj.8.t: "Левантийские порты под защитой" #NT!
 nd_koj.8.d: "Фамагуста и Бейрут, две жемчужины восточного Средиземноморья, теперь несут знамя Иерусалима. Поскольку Кипр находится под нашим контролем, ни один корабль не пересекает Левантийское море без нашего разрешения. Древняя гавань Бейрута, которая когда-то была гордостью Финикии, теперь передает богатство трех континентов через руки крестоносцев. Итальянские купцы, которые когда-то держали нас в заложниках со своими флотами, теперь приходят как просители, выпрашивая причалы в наших переполненных гаванях." #NT!
 nd_koj.8.a: "Морские пути Леванта — наши." #NT!
 nd_koj.9.t: "Западный Шелковый путь" #NT!
 nd_koj.9.d: "Шелк из Катая, благовония из Аравии, специи из Индии — все это течет по рынкам Святой Земли. Мы стали тем, чем только мечтали стать Венеция и Генуя: настоящими посредниками между Востоком и Западом. Наши караван-сараи переполнены товарами, наши конторы звенят золотом, а наши предприятия расположены в каждом порту от Кипра до Константинополя. Должны ли мы продвигаться дальше по караванным путям, становясь хозяевами сухопутной торговли? Или нам следует создать сеть агентов и факторов, контролирующих торговлю посредством знаний и связей, а не территории?" #NT!
 nd_koj.9.a: "Контролируйте караваны, и мы будем контролировать Восток." #NT!
 nd_koj.9.b: "Наши агенты должны знать все секреты рынка." #NT!
 nd_koj.10.t: "Торговый центр трех континентов" #NT!
 nd_koj.10.d: "Александрия и Константинополь, два величайших торговых города древнего мира, теперь подчиняются Иерусалимской короне. Мы находимся на перекрестке, где встречаются Европа, Азия и Африка, и каждый важный торговый путь проходит через наши владения. Мечта о всеобщей средиземноморской торговле, управляемой из Святой Земли, осуществилась. Какое наследие будет иметь это достижение? Станем ли мы жемчужиной Востока, морской державой, господствующей на морях? Или золотой мост между цивилизациями, царство, где образование и процветание свободно текут между всеми народами?" #NT!
 nd_koj.10.a: "Управляйте морями, и весь мир станет нашим." #NT!
 nd_koj.10.b: "Соедините цивилизации. Пусть обучение процветает." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_hammer_of_god: "Молот Бога" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_hammer_of_god: "Армии Иерусалима маршируют без отдыха, являясь неудержимым орудием божественного гнева. Однако непрерывная кампания утомляет дух королевства." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_pax_hierosol: "Пакс Иеросолимитана" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_pax_hierosol: "Иерусалимский мир распространяется на всю Сирию. Покоренные народы объединяются посредством справедливого управления и терпеливой интеграции." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_sword_of_christ: "Меч Христа" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_sword_of_christ: "Иерусалимское королевство обладает самой мощной армией в христианском мире, хотя содержание его обширных крепостей отягощает казну." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_kingdom_of_heaven: "Царство Небесное" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_kingdom_of_heaven: "Царство гармонии и великолепия, где священное наследие Святой Земли вдохновляет на художественные достижения и социальную стабильность." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_caravan_lords: "Лорды караванов" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_caravan_lords: "Сухопутные торговые пути Востока проходят через руки крестоносцев, доставляя шелка и предметы роскоши на рынки Святой Земли." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_factor_kings: "Короли счетной палаты" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_factor_kings: "Обширная сеть агентов и факторов дает королевству непревзойденную коммерческую информацию, хотя развитие сельского хозяйства страдает от пренебрежения." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_pearl_of_orient: "Жемчужина Востока" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_pearl_of_orient: "Военно-морская мощь Иерусалима управляет восточным Средиземноморьем, а его военные корабли и торговые суда — хозяевами всех морских путей." #NT!
 STATIC_MODIFIER_NAME_nd_koj_dest_golden_bridge: "Золотой мост" #NT!
 STATIC_MODIFIER_DESC_nd_koj_dest_golden_bridge: "Космополитическое царство, где знания Востока и Запада свободно смешиваются, хотя поток богатства несет в себе инфляционное давление." #NT!
 nd_koj_church_militant: "Церковь воинствующая" #NT!
 nd_koj_church_militant_desc: "Укрепленное командование военных орденов, полуцерковь-полукрепость, где монахи тренируются как воины и управляют обращением завоеванных земель." #NT!
 nd_koj_church_militant_maintenance: "Командирские операции" #NT!
 nd_koj_church_militant_maintenance_desc: "Содержание арсенала, часовни и гарнизона командования военного ордена на Святой Земле." #NT!
 nd_koj_eastern_exchange: "Восточная биржа" #NT!
 nd_koj_eastern_exchange_desc: "Грандиозная коммерческая биржа, где купцы с трех континентов торгуют под одной крышей, памятник положению Иерусалимского королевства на перекрестке мира." #NT!
 nd_koj_exchange_maintenance: "Обменные операции" #NT!
 nd_koj_exchange_maintenance_desc: "Управление крупной коммерческой биржей с ведением учета, обменом валюты и управлением складами в нескольких торговых залах." #NT!
 AUTO_MODIFIER_NAME_nd_koj_bureaucracy_authority: "Административный орган крестоносцев" #NT!
 AUTO_MODIFIER_DESC_nd_koj_bureaucracy_authority: "Возрожденное Иерусалимское королевство унаследовало многоуровневый аппарат Латинского Востока: Верхний двор баронов, Буржуазный суд латинских простолюдинов, Патриархат Гроба Господня, параллельные командования военных орденов и кодифицированные ассисы. Помимо постоянного места в столице, Иерусалим может поддерживать еще две бюрократии по своему выбору." #NT!
 koj_haute_cour_bureaucracy: "Верхний Кур" #NT!
 koj_haute_cour_bureaucracy_desc: "Высокий суд Иерусалима, феодальный трибунал главных арендаторов королевства. Созданный при Готфриде Бульонском после 1099 года и кодифицированный Иоанном Ибеленом в Livre des Assises de la Haute Cour около 1265 года, он рассматривал дела, связанные с вассалами короля, выносил решения по спорам о феодальных владениях и дани, ратифицировал преемственность и (согласно доктрине conjuratio) мог заставить самого короля соблюдать феодальный договор под страхом освобождения от присяги. Верхний Кур был конституционным двигателем Латинского Востока: короли правили с его согласия, и великие баронские войны тринадцатого века велись от его имени." #NT!
 koj_cour_des_bourgeois_bureaucracy: "Кур де Буржуа" #NT!
 koj_cour_des_bourgeois_bureaucracy_desc: "Бюргерский суд, городской трибунал латинских простолюдинов королевства. Кодифицированный в Livre des Assises de la Cour des Bourgeois около 1240 года (после утерянного оригинала около 1150 года), он обладал юрисдикцией в отношении собственности, долгов, наследства и мелких преступлений среди буржуазии: ремесленников, торговцев, сержантов и поселенцев-паломников. Жюри из двенадцати горожан заседало под руководством королевского виконта; коммерческие дела последовали за Lex Mercatoria. В Акре, Тире, Яффе, Кесарии, Наблусе и Иерусалиме был свой собственный Двор буржуазии, отличный от феодального Верхнего двора, находившегося над ними." #NT!
 koj_latin_patriarchate_bureaucracy: "Латинский Патриархат Иерусалима" #NT!
 koj_latin_patriarchate_bureaucracy_desc: "Латинский Патриархат Иерусалима, созданный при Даймберте Пизанском в 1099 году для замены греческой иерархии в завоеванном Гробе Господнем. Патриарх владел Кварталом Патриарха (отдельной городской юрисдикцией в священном городе), управлял десятиной королевства и председательствовал в церковных судах, под юрисдикцией которых находились франкские браки и завещания. После 1291 года престол сохранялся в титульной форме в Акре, а затем и на Кипре. Патриархат был духовным противовесом Верхнему Куру и юридическим мостом к каноническому аппарату Рима." #NT!
 koj_military_orders_charter_bureaucracy: "Хартия военных орденов" #NT!
 koj_military_orders_charter_bureaucracy_desc: "Королевская хартия, управляющая орденами тамплиеров, госпитальеров и (позже) Тевтонского ордена внутри королевства. Военные ордена владели обширными поместьями (Крак де Шевалье, Маргат, Атлит, Бельвуар) вне обычных феодальных обязательств, подчинялись только своим Великим Магистрам и Папе и снабжали самые надежные постоянные армии королевства. Их параллельный административный аппарат, состоявший из комендатур, казначейств и лазаретов, управлял государством в государстве; Хартия определяла, чем ордены были обязаны королевству, а от чего они были освобождены." #NT!
 koj_assises_de_jerusalem_bureaucracy: "Ассисы Иерусалима" #NT!
 koj_assises_de_jerusalem_bureaucracy_desc: "Кодифицированный феодальный закон королевства, первоначально записанный в «Lettres du Sepulcre», хранившемся в Гробе Господнем и утраченном, когда Саладин взял Иерусалим в 1187 году. Этот свод был реконструирован по памяти юристами в изгнании (Жан Ибелен «Livre des Assises» около 1265 года, Филипп Новарский, Джеймс Ибелен) и сохранился как правовая основа Кипрского королевства и, в адаптированной форме, Ассисы де Романи Франкской Греции. Ассисы кодифицировали феодальный договор, уголовные дела короля и юрисдикцию судов королевства." #NT!
