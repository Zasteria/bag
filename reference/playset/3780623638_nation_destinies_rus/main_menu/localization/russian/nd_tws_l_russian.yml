l_russian:
 STATIC_MODIFIER_NAME_nd_crown_of_the_mezzogiorno: "Корона Меццоджорно" #NT!
 STATIC_MODIFIER_DESC_nd_crown_of_the_mezzogiorno: "Королевство Обеих Сицилий объединено под единой сильной короной. От Неаполя до Палермо королевская власть простирается непрерывно, подавляя баронскую фракционность и устанавливая централизованную администрацию, которая наводит порядок на беспокойном юге. Меццоджорно должен знать один закон, одного короля, одну судьбу." #NT!
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_mediterranean: "Перекресток Средиземноморья" #NT!
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_mediterranean: "Наследник нормандских, греческих, арабских и латинских традиций, Королевство Обеих Сицилий осознает себя как великое место встречи цивилизаций. Там, где другие видят разделение, мы видим возможности: в каждом иностранном торговце, прибывающем в порт Неаполя, в каждом ремесленнике, занимающемся своим ремеслом в Палермо, в каждом ученом, обучающемся в наших академиях." #NT!
 nd_tws.1.t: "Две Сицилии вместе" #NT!
 nd_tws.1.d: "Наконец древние королевства Неаполя и Сицилии объединились под одной короной. На протяжении веков за Меццоджорно воевали норманны, Гогенштауфены, анжуйцы и арагонцы: каждый из них оставил свой след на этой земле и ее людях. Теперь мы должны решить, чем станет это королевство.\n\nЮжные земли обладают самыми богатыми сельскохозяйственными угодьями в Италии, самыми оживленными портами Средиземноморья и населением, сформированным каждой цивилизацией, коснувшейся этих берегов. Но они также страдают от могущественных баронов, бросающих вызов королевской власти, от набегов корсаров, угрожающих нашим побережьям, и от древнего соперничества между островом и материком.\n\nСможем ли мы создать централизованное королевство под твердой королевской властью, сломив власть баронов и построив современное государство? Или мы должны принять наше наследие как перекресток Средиземноморья, где греческие, арабские, нормандские и латинские традиции смешиваются, чтобы создать нечто большее, чем может достичь любая отдельная культура?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tws.1.a: "Одна корона, один закон, одно королевство." #NT!
 nd_tws.1.b: "Мы – место встречи цивилизаций." #NT!
 STATIC_MODIFIER_NAME_nd_tws_vespers_independence: "Дух вечерни" #NT!
 STATIC_MODIFIER_DESC_nd_tws_vespers_independence: "Память о Сицилийской вечерне горит ярко: люди, которые восстали против иностранного гнета и завоевали свободу благодаря своей решимости." #NT!
 STATIC_MODIFIER_NAME_nd_tws_vespers_diplomacy: "Вечерняя дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_tws_vespers_diplomacy: "Сицилийская вечерня продемонстрировала, что умелая дипломатия и иностранные союзы могут достичь того, чего не может достичь само по себе восстание: остров обеспечил свою свободу, пригласив на защиту Арагонскую корону." #NT!
 nd_tws.2.t: "Наследие вечерни" #NT!
 nd_tws.2.d: "В пасхальный понедельник 1282 года колокола церкви Святого Духа недалеко от Палермо прозвенели к вечерне. И на острове вспыхнуло восстание. В течение шести недель все французы на Сицилии были убиты или бежали. Сицилийская вечерня была больше, чем резней: это была декларация о том, что народом этой страны не будут управлять иностранцы, которые его презирали.\n\nПоследствия восстания изменили Средиземноморье. Карл Анжуйский потерял свое островное королевство. Петр Арагонский получил корону. А сама Сицилия усвоила тяжелый урок о цене независимости: свободу, завоеванную кровью, нужно защищать либо силой, либо хитростью.\n\nИзучая это наследие, какой урок мы можем из него извлечь?" #NT!
 nd_tws.2.a: "Свободу завоевывают те, кто за нее борется." #NT!
 nd_tws.2.b: "Умные союзы переживут любое восстание." #NT!
 STATIC_MODIFIER_NAME_nd_tws_bourbon_enlightenment: "Бурбонское Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_tws_bourbon_enlightenment: "Прогрессивные реформы монархов Бурбонов принесли в королевство современную администрацию, государственное образование и рациональное управление." #NT!
 STATIC_MODIFIER_NAME_nd_tws_bourbon_industry: "Промышленная программа бурбона" #NT!
 STATIC_MODIFIER_DESC_nd_tws_bourbon_industry: "Программа короны по развитию королевских мануфактур и инфраструктуры преобразует экономический потенциал королевства." #NT!
 nd_tws.3.t: "Реформы Бурбона" #NT!
 nd_tws.3.d: "Монархи Бурбонов приступили к реализации амбициозной программы реформ, которая преобразит королевство. Фердинанд основал королевскую колонию Сан-Леучио, где работники шелководства пользуются преимуществами, неслыханными где-либо еще в Европе: обязательное образование как для мальчиков, так и для девочек, сокращенный рабочий день, водопровод в каждом доме и коммунальное обеспечение для больных и пожилых людей.\n\nНо реформы выходят далеко за пределы одной колонии. Новые правовые кодексы, основанные на принципах Просвещения, призваны заменить лоскутное одеяло феодальных, нормандских и испанских законов. Королевские мануфактуры возникают, чтобы бросить вызов доминированию северной итальянской и французской промышленности. Вопрос в том, следовать ли интеллектуальным обещаниям этих реформ (модернизация образования, права и управления) или сосредоточиться на их промышленном потенциале, строительстве мануфактур и инфраструктуры, которые могли бы сделать Меццоджорно экономической державой." #NT!
 nd_tws.3.a: "Просветите умы нашего народа." #NT!
 nd_tws.3.b: "Стройте мастерские будущего." #NT!
 nd_tws_norman_feudalism: "Нормандская феодальная кавалерия" #NT!
 nd_tws_norman_feudalism_desc: "Нормандские завоеватели южной Италии принесли с собой феодальные военные традиции северной Франции: рыцари в доспехах, составлявшие самую грозную кавалерию в средиземноморском мире." #NT!
 nd_tws_masseria_system: "Система Массерия" #NT!
 nd_tws_masseria_system_desc: "Огромные укрепленные усадьбы Меццоджорно, массери, являются основой сельскохозяйственного богатства южной Италии: обширные поместья, производящие зерно, оливки и домашний скот, который кормит Средиземноморье." #NT!
 nd_tws_scuola_medica: "Скуола Медика Салернитана" #NT!
 nd_tws_scuola_medica_desc: "Школа Салерно — старейшая медицинская школа в западном мире, где своими знаниями делятся греческие, латинские, арабские и еврейские врачи. Его выпускники практикуют медицину по всей Европе." #NT!
 nd_tws_coastal_torre_network: "Прибрежная сеть Торре" #NT!
 nd_tws_coastal_torre_network_desc: "Цепь сторожевых башен вдоль побережья Сицилии и южной Италии обеспечивает раннее предупреждение о набегах берберийских корсаров и служит скоординированной сетью обороны." #NT!
 nd_tws_sicilian_vespers_legacy: "Наследие Сицилийской вечерни" #NT!
 nd_tws_sicilian_vespers_legacy_desc: "Память о восстании 1282 года против анжуйской тирании вселяет в народ Обеих Сицилий ожесточенное сопротивление иностранному господству." #NT!
 nd_tws_mediterranean_granary: "Средиземноморское зернохранилище" #NT!
 nd_tws_mediterranean_granary_desc: "Южная Италия и Сицилия были житницей Средиземноморья со времен Римской империи, экспортируя через море огромное количество пшеницы, оливок и других продуктов питания.\n\n#italic Доступно в: $nd_tws_masseria$#!" #NT!
 nd_tws_tercio_tradition: "Терсио ди Наполи" #NT!
 nd_tws_tercio_tradition_desc: "Под испанским влиянием королевства Неаполя и Сицилии приняли систему терсио: дисциплинированные пехотные формирования, сочетающие пику и дробь, которые доминировали на европейских полях сражений." #NT!
 nd_tws_studium_naples: "Студия Неаполя" #NT!
 nd_tws_studium_naples_desc: "Неаполитанский университет, основанный императором Фридрихом II в 1224 году, является старейшим государственным университетом в мире: преднамеренный вызов папским университетам севера." #NT!
 nd_tws_mezzogiorno_commerce: "Меццоджорно Коммерция" #NT!
 nd_tws_mezzogiorno_commerce_desc: "Порты Неаполя, Палермо и Мессины обрабатывают огромный объем средиземноморской торговли, соединяя сельскохозяйственное богатство юга с рынками по всему известному миру." #NT!
 nd_tws_galeazza_tradition: "Галеацца Реале" #NT!
 nd_tws_galeazza_tradition_desc: "Обе Сицилии имеют мощный флот военных галер, специально разработанных для боевых действий в Средиземноморье: они тяжелее и лучше вооружены, чем стандартные галеры, и способны доминировать в спорных водах между Италией и Северной Африкой." #NT!
 nd_tws_baronial_suppression: "Баронское подавление" #NT!
 nd_tws_baronial_suppression_desc: "Недовольные бароны Меццоджорно, веками подрывавшие королевскую власть, наконец, были вынуждены подчиниться систематическим правовым и политическим мерам." #NT!
 nd_tws_san_leucio_silk: "Шелковый завод Сан-Леучио" #NT!
 nd_tws_san_leucio_silk_desc: "Королевская колония Сан-Леучио недалеко от Казерты представляет собой революционный эксперимент в промышленном производстве: шелковая мануфактура, где рабочие пользуются прогрессивными условиями труда, обязательным образованием и общественным благосостоянием." #NT!
 nd_tws_real_marina: "Реал Марина" #NT!
 nd_tws_real_marina_desc: "Королевский флот Обеих Сицилий, Настоящая Марина, расширяется и модернизируется при Бурбонах, выставляя на вооружение фрегаты и линейные корабли для защиты обширной береговой линии королевства." #NT!
 nd_tws_bourbon_legal_reforms: "Правовые реформы Бурбона" #NT!
 nd_tws_bourbon_legal_reforms_desc: "Монархи Бурбонов заменили лоскутное одеяло нормандских, анжуйских и испанских правовых кодексов единой современной правовой системой, вдохновленной принципами Просвещения." #NT!
 nd_tws_mezzogiorno_industry: "Меццоджорно Промышленность" #NT!
 nd_tws_mezzogiorno_industry_desc: "Промышленное развитие южной Италии, движимое королевскими мануфактурами и инвестициями в инфраструктуру, начинает бросать вызов традиционному доминированию экономики северной Италии." #NT!
 nd_tws_carbonari_legacy: "Наследие карбонариев" #NT!
 nd_tws_carbonari_legacy_desc: "Тайные общества карбонариев, угольщиков, распространяли революционные идеалы конституционного правления и национальной идентичности по всему королевству, формируя политическое сознание поколения." #NT!
 a_nd_tws_norman_cavaliere: "Норман Кавальер" #NT!
 a_nd_tws_norman_cavaliere_desc: "Рыцари в доспехах норманнских традиций, эти тяжелые кавалеристы происходят от воинов, завоевавших южную Италию и Сицилию в 11 веке. Их обвинение остается разрушительным." #NT!
 a_nd_tws_tercio_napolitano: "Терсио Наполитано" #NT!
 a_nd_tws_tercio_napolitano_desc: "Дисциплинированная пехота Неаполитанского терсио, объединившая копейщиков и аркебузиров в грозное испанское соединение, которое доминировало в европейских войнах более века." #NT!
 n_nd_tws_galeazza_reale: "Галеацца Реале" #NT!
 n_nd_tws_galeazza_reale_desc: "Тяжелая военная галера флота Обеих Сицилий, более крупная и более тяжеловооруженная, чем стандартные средиземноморские галеры, предназначенная для проецирования мощи в оспариваемых водах центрального Средиземноморья." #NT!
 n_nd_tws_fregata_reale: "Фрегата Реале" #NT!
 n_nd_tws_fregata_reale_desc: "Быстроходный парусный фрегат Королевского флота Бурбонов, легче линейного корабля, но достаточно быстрый, чтобы патрулировать обширную береговую линию королевства и защищать его торговый флот." #NT!
 nd_tws_torre_costiera: "Торре Костьера" #NT!
 nd_tws_torre_costiera_desc: "Прибрежная сторожевая башня в традициях torri Costiere, которые усеивают береговую линию Сицилии и южной Италии: часть интегрированной защитной сети, которая использует сигналы огня и дыма для предупреждения о приближающихся набегах корсаров." #NT!
 nd_tws_masseria: "Массерия" #NT!
 nd_tws_masseria_desc: "Укрепленное сельскохозяйственное поместье Меццоджорно, объединяющее сельскохозяйственные угодья, загоны для скота и оборонительные стены в самодостаточную экономическую единицу, которая на протяжении веков питала Средиземноморье." #NT!
 nd_tws_reale_seteria: "Реале Сетерия" #NT!
 nd_tws_reale_seteria_desc: "Королевская шелковая мануфактура в традициях Сан-Леучио, где опытные ткачи производят прекрасные шелковые ткани, способные конкурировать с лучшими мастерскими Лиона и Флоренции." #NT!
 nd_tws_torre_garrison: "Торре Гаррисон" #NT!
 nd_tws_torre_garrison_desc: "Небольшой гарнизон поддерживает сторожевую башню, держит оружие наготове и готовит сигнальные огни на случай вторжения корсаров." #NT!
 nd_tws_grain_export: "Экспортная торговля зерном" #NT!
 nd_tws_grain_export_desc: "Излишки зерна и оливкового масла массерии перерабатываются и упаковываются для экспорта через Средиземноморье, превращая сельскохозяйственное сырье в коммерческое богатство." #NT!
 nd_tws_silk_weaving: "Шелковое Ткачество" #NT!
 nd_tws_silk_weaving_desc: "Мастера-ткачи превращают шелк-сырец и драгоценные красители в прекрасные ткани исключительного качества, продолжая традицию, берущую свое начало со времен захвата нормандцами византийских мастеров по производству шелка." #NT!
 levy_nd_tws_norman_cavaliere: "Норман Кавальер Леви" #NT!
 levy_nd_tws_norman_cavaliere_desc: "Феодальная кавалерия, выросшая из норманнских дворянских семей Меццоджорно, ответила на королевский призыв к оружию, как это делали их предки со времен Роже де Отвиля." #NT!
 nd_tws_formed_tt: "Образовались Две Сицилии." #NT!
 nd_tws_path_a_tt: "Выбрали Корону Меццоджорно" #NT!
 nd_tws_path_b_tt: "Выбрали «Перекресток Средиземноморья»" #NT!
 nd_tws_destiny: "Судьба Обеих Сицилий" #NT!
 nd_tws_destiny_desc: "Королевство Обеих Сицилий было создано. Теперь его правители должны доказать, что достойны короны, принеся стабильность в это беспокойное, но плодородное царство." #NT!
 nd_tws_dest_crown_south: "Корона Юга" #NT!
 nd_tws_dest_crown_south_desc: "Подобно императорам Гогенштауфенам до нас, мы расширим нашу власть на север. Рим, Вечный город, должен признать власть южной короны. Захватите Рим и создайте армию, достойную наших амбиций." #NT!
 nd_tws_dest_peninsula: "Хозяин полуострова" #NT!
 nd_tws_dest_peninsula_desc: "Рим обеспечен, и дорога в центральную Италию открыта. Флоренция, жемчужина Тосканы, должна попасть под нашу власть. Развивайте наши земли и расширяйте свои силы, чтобы соответствовать великим северным державам." #NT!
 nd_tws_dest_rex_italiae: "Рекс Италия" #NT!
 nd_tws_dest_rex_italiae_desc: "Главный приз: господство над всей Италией. Возьмите Милан, резиденцию Железной Короны, и Геную, ворота в западное Средиземноморье. Только тогда Обе Сицилии смогут претендовать на титул короля Италии." #NT!
 nd_tws_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_tws_dest_mare_nostrum_desc: "Норманны Сицилии когда-то правили от Палермо до Туниса. Мы вернем это морское наследие. Захватите Тунис и сделайте шелк краеугольным камнем нашей средиземноморской торговой сети." #NT!
 nd_tws_dest_ionian_routes: "Ионические торговые пути" #NT!
 nd_tws_dest_ionian_routes_desc: "Контроль над Корфу контролирует проход между Адриатикой и Средиземноморьем. Благодаря современным банковским учреждениям и переполненной казне наши купцы могут доминировать на Ионических торговых путях." #NT!
 nd_tws_dest_emporium: "Торговый центр Средиземноморья" #NT!
 nd_tws_dest_emporium_desc: "От Сардинии до Крита, от Неаполя до Туниса наши торговые дома охватывают все Средиземноморье. Это кульминация нашей морской судьбы: коммерческая империя, соперничающая с Венецией и Генуей в период их расцвета." #NT!
 nd_tws.4.t: "Судьба двух королевств" #NT!
 nd_tws.4.d: "Обе Сицилии едины и стабильны. Древние королевства Неаполя и Сицилии, когда-то разделенные узким Мессинским проливом и более широкой пропастью соперничающих амбиций, теперь маршируют вместе под одним знаменем. Вопрос перед нами больше не в том, сможем ли мы выжить, а в том, кем мы станем.\n\nМеццоджорно богат зерном, шелком и оливковым маслом. Наши порты контролируют центральное Средиземноморье. Наш народ несет в себе кровь и традиции каждой цивилизации, соприкасавшейся с этими берегами. Фундамент заложен. Теперь мы должны опираться на них." #NT!
 nd_tws.4.a: "Наша судьба ждет." #NT!
 nd_tws.5.t: "Южная корона претендует на Рим" #NT!
 nd_tws.5.d: "Рим попал под нашу власть. Впервые с тех пор, как Фридрих II носил одновременно императорскую и сицилийскую короны, Вечный город удерживает южноитальянская держава. Папа может протестовать, северные штаты могут трепетать, но идея ясна: Обе Сицилии — это не просто региональное королевство.\n\nНаши солдаты доказали свою ценность, и наши администраторы уже распространяют королевский закон на недавно приобретенные территории. Север наблюдает с растущим беспокойством." #NT!
 nd_tws.5.a: "Пусть Рим узнает, кто сейчас правит Италией." #NT!
 nd_tws.6.t: "Железная Корона или Сенат" #NT!
 nd_tws.6.d: "Флоренция подчинилась южной короне. Плодородные земли Тосканы, мастерские долины Арно и банкирские дома города Медичи теперь служат нашему королевству. Центральная Италия наша.\n\nНо по мере того, как мы продвигаемся дальше на север, перед нами стоит выбор. Будем ли мы маршировать со скоростью и силой, которые несли норманнов от Отвиля до Палермо, подчеркивая военную мобильность и феодальный набор, который является военной основой нашего королевства? Или мы последуем римской модели, ассимилируя завоеванные народы, развивая их земли и создавая прочную империю посредством процветания, а не только с помощью меча?" #NT!
 nd_tws.6.a: "Маршируйте на север под Железной Короной." #NT!
 nd_tws.6.b: "Стройте так, как строили римляне." #NT!
 nd_tws.7.t: "Рекс Италия" #NT!
 nd_tws.7.d: "Милан пал. Генуя открыла свои ворота. От Альп до Сицилии, от Адриатики до Тирренского моря Италия объединена под короной Обеих Сицилий. Со времен Римской империи на полуострове не было ни одного хозяина, и мы добились этого с юга, из тех самых земель, которые другие считали отсталым Меццоджорно.\n\nФридрих II, Ступор Мунди, поразивший мир своим сицилийским двором, признал бы то, что мы построили. Но как нам консолидировать эту обширную территорию? Благодаря военному престижу, который завоевал его, выступая в роли великой военной державы, которой никто не смеет бросить вызов? Или за счет инвестиций в саму землю, что сделает Италию самым продуктивным и процветающим королевством в Европе?" #NT!
 nd_tws.7.a: "Мы — возрожденный Stupor Mundi." #NT!
 nd_tws.7.b: "Пусть Меццоджорно накормит всю Италию." #NT!
 nd_tws.8.t: "Норманны возвращаются в Африку" #NT!
 nd_tws.8.d: "Тунис наш. Граф Роджер Сицилийский впервые совершил набег на эти побережья в 11 веке; теперь мы держим их навсегда. Римская житница, ворота в торговлю с Сахарой ​​и ключ к контролю над узкой полосой Средиземного моря — все это принадлежит Обеим Сицилиям.\n\nНаши галеры патрулируют воды между Сицилией и Ифрикией. Набеги корсаров на наши берега станут воспоминанием. А поскольку шелк проходит через наши рынки, коммерческие основы нашей морской империи прочно утвердились." #NT!
 nd_tws.8.a: "Море между нашими берегами принадлежит нам." #NT!
 nd_tws.9.t: "Владычество над Ионическим морем" #NT!
 nd_tws.9.d: "Имея Корфу в своих руках, мы контролируем пролив, отделяющий Адриатическое море от Ионического. Каждый корабль, курсирующий между Венецией и восточным Средиземноморьем, должен плыть под бдительным оком наших крепостей. Наши банковские учреждения являются предметом зависти Юга, и наша казна переполнена.\n\nСможем ли мы использовать это положение для установления военно-морского превосходства, доминирования на Адриатике и распространения силы на восточное Средиземноморье, даже ценой пренебрежения нашими сухопутными силами? Или мы станем великим посредником, морским шелковым путем, где сходятся все торговые пути и каждый купец находит прибыль?" #NT!
 nd_tws.9.a: "Управляйте морями силой." #NT!
 nd_tws.9.b: "Пусть торговля течет через наши порты." #NT!
 nd_tws.10.t: "Торговый центр Средиземноморья" #NT!
 nd_tws.10.d: "От Сардинии до Крита, от Мессинского пролива до берегов Ифрикии Обе Сицилии создали торговую империю, охватывающую все центральное и восточное Средиземноморье. Наши фонды (великие торговые дома, созданные в каждом крупном порту) осуществляют объем торговли, который может соперничать с золотым веком Венеции.\n\nТеперь вопрос в том, будем ли мы использовать наше преимущество на море, создавая неоспоримый флот, который защитит эти маршруты от всех конкурентов, или консолидируем наши достижения с помощью финансовых учреждений и дипломатических сетей, которые сделают наших торговцев желанными гостями в каждом порту от Барселоны до Александрии." #NT!
 nd_tws.10.a: "Наш флот будет править этими водами." #NT!
 nd_tws.10.b: "Богатство – самая истинная сила." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_iron_crown: "Марш Железной Короны" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_iron_crown: "Южные армии маршируют со скоростью и решимостью, которые когда-то вели норманнских рыцарей из Калабрии к воротам Рима. Наши рекруты пополняются людьми, желающими служить короне Италии." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_roman_legacy: "Наследие Цезарей" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_roman_legacy: "Подобно римлянам, которые первыми объединили Италию, мы ассимилируем завоеванные народы в наше царство, развивая их земли и создавая процветание, превосходящее завоевания." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_stupor_mundi: "Ступор Мунди" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_stupor_mundi: "«Удивление мира» (титул, когда-то присвоенный Фридриху II) теперь принадлежит королевству, которое он любил больше всего. Наш военный престиж пользуется уважением во всей Европе, хотя наш флот страдает от пренебрежения." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_mezzogiorno_ascendant: "Меццоджорно Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_mezzogiorno_ascendant: "Юг поднимается. Инвестиции в сырье, инфраструктуру и рост населения превращают Меццоджорно из самого бедного региона Италии в самый продуктивный." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_adriatic_dominion: "Адриатический Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_adriatic_dominion: "Наши военные корабли господствуют в Адриатическом и Ионическом морях. Каждое торговое судно, плавающее в этих водах, делает это с нашего разрешения, хотя наша приверженность военно-морской мощи ограничивает наши возможности содержать сухопутные силы." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_silk_road_sea: "Шелковый путь моря" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_silk_road_sea: "Наши порты стали великими перевалочными пунктами Средиземноморья, куда свободно текут шелк, специи и разведданные. Богатство приносит комфорт: возможно, даже слишком большой комфорт." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_thalassocracy: "Сицилийская талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_thalassocracy: "Обе Сицилии достигли того, о чем Венеция и Генуя только мечтали: истинного морского превосходства в центральном Средиземноморье с возможностью проецировать мощь на отдаленные берега." #NT!
 STATIC_MODIFIER_NAME_nd_tws_dest_emporium_mundi: "Эмпориум Мунди" #NT!
 STATIC_MODIFIER_DESC_nd_tws_dest_emporium_mundi: "Рынок мира. Наши банковские дома предлагают лучшие процентные ставки, наши дипломатические связи открывают все двери, а наше тщательное управление торговлей надежно держит инфляцию под контролем." #NT!
 nd_tws_reggia: "Реджа-Реале" #NT!
 nd_tws_reggia_desc: "Великолепный королевский дворец в традициях Реджиа-ди-Казерта, резиденция централизованной власти, из которой король управляет своими обширными итальянскими владениями, соперничая с Версалем по величию и амбициям." #NT!
 nd_tws_reggia_court: "Администрация Королевского суда" #NT!
 nd_tws_reggia_court_desc: "Штат писцов, придворных и администраторов поддерживает сложную бюрократию централизованного итальянского королевства из королевского дворца." #NT!
 nd_tws_fondaco: "Фондако деи Мерканти" #NT!
 nd_tws_fondaco_desc: "Величественный торговый дом в традициях венецианских фондов, укрепленный склад, биржа и таможня вместе взятые, служащий центром средиземноморской торговли в наших портах." #NT!
 nd_tws_fondaco_trade: "Средиземноморский обмен" #NT!
 nd_tws_fondaco_trade_desc: "Клерки управляют векселями, таможенники обрабатывают товары, а брокеры договариваются о сделках между торговцами со всего Средиземноморья." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_tws_bureaucracy_authority: "Королевская Канчеллерия" #NT!
 AUTO_MODIFIER_DESC_nd_tws_bureaucracy_authority: "От нормандской Великой курии в Палермо до министерств Бурбонов в Неаполе — канцелярия королевства превратилась в постоянный административный аппарат. В настоящее время в королевстве существуют прочные институты (юридические кодексы, финансовые суды, таможни, парламенты, советы), с помощью которых управляются Обе Сицилии." #NT!
  
 tws_constitutions_of_melfi_bureaucracy: "Конституции Мелфи" #NT!
 tws_constitutions_of_melfi_bureaucracy_desc: "Обнародованная Фридрихом II в Мельфи 1 сентября 1231 года, Liber Augustalis представляла собой всеобъемлющую кодификацию римского права администрации Реньо, реформу Арианских ассизов Роджера II (1140 г.) и собственных ассизов Капуи Фридриха (1220 г.), составленную совместно с Петрусом де Винеа и болонскими мастерами. Своими 219 конституциями Фридрих связал великих феодалов с королевскими судами, регулировал чеканку монет и торговлю и поставил императора-рекса выше всех других властей. Эрнст Канторович назвал это «свидетельством о рождении современного административного государства»; он оставался основой сицилийского права до принятия наполеоновских кодексов." #NT!
  
 tws_camera_della_sommaria_bureaucracy: "Камера делла Соммария" #NT!
 tws_camera_della_sommaria_bureaucracy_desc: "Regia Camera della Sommaria, основанная Альфонсо V Арагонским в Неаполе в 1444 году на базе старой курии магистрорум рациональной, была высшим финансовым судом Неаполитанского королевства. Под председательством luogotenente и укомплектованного razionali (юристами и бухгалтерами, в основном из городской юридической буржуазии), он проверял королевские и муниципальные счета, преследовал по суду за финансовые злоупотребления и выносил решения по баронским relevi (наследным сборам). С 1596 года он был разделен на две роты, рассматривавшие гражданские и уголовные финансовые споры, и оставался основным инструментом финансовой дисциплины королевства до тех пор, пока его не заменил Корте деи Конти в 1807 году." #NT!
  
 tws_dogana_delle_pecore_bureaucracy: "Регия Догана делле Пекоре" #NT!
 tws_dogana_delle_pecore_bureaucracy_desc: "Основанная в Лучере в 1447 году Альфонсо V и переведенная в Фоджиа в 1468 году, Королевская таможня погона овец регулировала масштабные сезонные перегоны скота между высокогорными районами Абруцца и зимними пастбищами Тавольер-делле-Пулье. Созданный по образцу кастильской Месты, он взимал восемь дукатов фида за сотню овец в обмен на выделенные пастбища, контролировал траттури от навязчивого земледелия и создавал один из двух основных источников дохода Неаполитанского королевства. Его монополия на Тавольере на протяжении веков замораживала обширные территории в качестве зимних пастбищ; Жозеф Бонапарт отменил его 21 мая 1806 года." #NT!
  
 tws_caricatori_grain_monopoly_bureaucracy: "Карикатори дель Реньо" #NT!
 tws_caricatori_grain_monopoly_bureaucracy_desc: "Королевские порты Сицилии для погрузки зерна (в основном Шакка, Джиргенти, Ликата и Термини-Имерезе), где пшеница из латифонди складировалась под королевской печатью и отправлялась только торговцам, имеющим тратте - экспортные лицензии, продаваемые короной. Maestri portulani проверяли каждую партию, а генуэзские факторы конкурировали на лицензионном рынке за право отправлять излишки в Геную, Неаполь, Рим и Левант. Эта система обеспечила золотой век Сицилии как житницы Средиземноморья и дала короне финансовый рычаг, который зависел от баронских поместий, производивших зерно, но в то же время и ограничивал их." #NT!
  
 tws_sicilian_parliament_bureaucracy: "Парламент Сицилии" #NT!
 tws_sicilian_parliament_bureaucracy_desc: "Парламент Сицилии, впервые созванный в Мазаре Роджером I в 1097 году и заседавший в Палермо с 1130 года во Палаццо Норманни, является одним из старейших законодательных органов Европы. Он собрался в трех ветвях: феодальную ветвь графов и баронов, церковную ветвь архиепископов, аббатов и архимандритов и деманиальную ветвь представителей 42 королевских городов. Его основная функция заключалась в голосовании донатива королю в обмен на подтверждение привилегий, и на протяжении семи столетий он ограничивал королевские налоги посредством консультаций, которые пережили даже испанский абсолютизм. Отменен в 1812 году согласно вдохновленной Великобританией конституции Сицилии и окончательно упразднен вместе с сицилийской автономией в 1816 году." #NT!
  
 tws_consiglio_collaterale_bureaucracy: "Совет обеспечения" #NT!
 tws_consiglio_collaterale_bureaucracy_desc: "Созданный при испанских вице-королях в Неаполе для фланга (поддержки) наместника в вопросах правительства, правосудия и финансов, Consiglio Col Laterale состоял из пяти регентов (обычно испанских и неаполитанских юристов), которые обрабатывали указы и курировали великие суды королевства. Его судебная часть, Канчеллерия, была намеренно усилена наместниками, чтобы сжать старый Sacro Regio Consiglio (верховный суд Арагонского Неаполя), передав власть от автономной магистратуры совету, члены которого служили по усмотрению Мадрида. Оно стало основным инструментом, с помощью которого Габсбурги, а затем и Бурбоны, привлекли тогати (городскую легальную буржуазию) к центральному управлению за счет крупных феодальных домов." #NT!
