l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_the_prophet: "Меч Пророка" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_prophet: "Объединенное арабское государство будет выковано мечом веры, а его кавалерия пронесется по пустыне, чтобы собрать разрозненные племена под одним знаменем. От Мекки до самых дальних оазисов разнесется призыв к оружию." #NT!
 STATIC_MODIFIER_NAME_nd_cradle_of_civilization: "Колыбель цивилизации" #NT!
 STATIC_MODIFIER_DESC_nd_cradle_of_civilization: "Аравия стоит на перекрестке трех континентов, наследница маршрутов благовоний, паломнической торговли и научных традиций, которые освещали мир от Багдада до Кордовы. Это наследие торговли и обучения должно стать основой великого государства." #NT!
 STATIC_MODIFIER_NAME_nd_aia_mocha_trade_boom: "Торговый бум мокко" #NT!
 STATIC_MODIFIER_DESC_nd_aia_mocha_trade_boom: "Порт Мокко кипит от торговли, поскольку купцы из Европы, Индии и Африки собираются, чтобы торговать темными ароматными бобами, покорившими вкус всего мира." #NT!
 STATIC_MODIFIER_NAME_nd_aia_wahhabi_zeal: "Ваххабитское рвение" #NT!
 STATIC_MODIFIER_DESC_nd_aia_wahhabi_zeal: "Строгое реформистское послание распространилось по полуострову, избавляясь от того, что его приверженцы считают инновациями, и возвращая верующих к первозданным практикам самых ранних поколений." #NT!
 STATIC_MODIFIER_NAME_nd_aia_wahhabi_pragmatism: "Прагматическая реформа" #NT!
 STATIC_MODIFIER_DESC_nd_aia_wahhabi_pragmatism: "Стремление к религиозному обновлению сдерживается политическим реализмом, создавая государство, которое ценит доктринальную ясность, сохраняя при этом дипломатическую гибкость, необходимую для управления разнообразным полуостровом." #NT!
 nd_aia.1.t: "Объединение Аравии" #NT!
 nd_aia.1.d: "После нескольких поколений племенной раздробленности Аравийский полуостров объединился под одним знаменем впервые со времен ранних халифатов. Священные города Мекка и Медина, благовонные порты Йемена, богатые жемчугом берега Персидского залива и обширные внутренние районы Неджди — все они подчиняются одному правителю.\n\nЭто момент глубокого значения. Земля, породившая ислам и служившая перекрестком древних торговых путей, вновь стала целостной. Но каким путем пойдет эта возрожденная Аравия? Поднимет ли оно знамя джихада и отправится распространять веру силой оружия, как это делали первые халифы? Или ему следует смотреть внутрь себя, развивая торговые сети и научные традиции, которые сделали Аравию предметом зависти империй?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_aia.1.a: "Идите вперед под знаменем веры!" #NT!
 nd_aia.1.b: "Мы снова станем перекрестком мира." #NT!
 nd_aia.2.t: "Кофе Мокко" #NT!
 nd_aia.2.d: "Порт Мокка на побережье Красного моря стал центром новой и необычной торговли. Кофе, впервые выращенный в высокогорьях Йемена суфийскими мистиками, стремившимися бодрствовать во время ночных молитв, покорил вкусы всего мира. Европейские, индийские и османские купцы толпятся в гавани, их корабли гружены серебром и товарами, которые можно обменять на мешки темных ароматных зерен.\n\nКофейни возникли по всей Аравии и за ее пределами, становясь центрами разговоров, торговли и политических дебатов. Губернаторы Мокко богатеют за счет экспортных пошлин, а горные фермеры ревниво заботятся о своих драгоценных растениях, запрещая экспорт плодородных семян, чтобы помешать соперникам основать свои собственные плантации." #NT!
 nd_aia.2.a: "Мокко станет жемчужиной нашей торговой империи." #NT!
 nd_aia.2.b: "Контролируйте плантации, контролируйте богатство." #NT!
 nd_aia.3.t: "Ваххабитская Реформация" #NT!
 nd_aia.3.d: "Религиовед из Неджда Мухаммад ибн Абд аль-Ваххаб положил начало движению, которое преобразует полуостров. Проповедуя возврат к тому, что он считает чистыми, оригинальными практиками ислама, он осуждает почитание святых, сложные ритуалы суфийских орденов и то, что он считает веками накапливавшимися суевериями и нововведениями.\n\nЕго союз с местным правителем создал грозное религиозно-политическое движение. Воины, вдохновленные его учением, проносятся по пустыне, свергая святыни и требуя подчинения своему суровому видению веры. Энергия движения неоспорима, но его жесткая интерпретация доктрины рискует оттолкнуть как умеренных подданных, так и соседние державы.\n\nКак нам реагировать на этот переворот духа?" #NT!
 nd_aia.3.a: "Примите очищающий огонь реформ." #NT!
 nd_aia.3.b: "Направляйте реформы с прагматичным управлением." #NT!
 nd_aia.4.t: "Восстание Ихванов" #NT!
 nd_aia.4.d: "В поселениях пустыни Неджди возникла новая порода воинов. Ихваны, «Братья», — бывшие представители бедуинского племени, отказавшиеся от своего кочевого образа жизни в сельскохозяйственных общинах, занимающихся религиозным изучением и военной подготовкой.\n\nДвижимые сильными религиозными убеждениями, они сочетают в себе выносливость в пустыне и навыки верховой езды своих предков с фанатичной дисциплиной, которая делает их устрашающими на поле боя. Они сражаются не ради грабежа или родовой чести, а во славу Божию и распространение истинной веры. Их поселения, хиджры, служат одновременно военными гарнизонами и центрами религиозного обучения." #NT!
 nd_aia.4.a: "Эти воины станут авангардом нашей судьбы." #NT!
 nd_aia_bedouin_raiders: "Бедуинские набеговые традиции" #NT!
 nd_aia_bedouin_raiders_desc: "Бедуинская раззия, молниеносный набег через пустыню, является одновременно искусством войны и образом жизни, отточенным столетиями межплеменных конфликтов на арабских пустошах." #NT!
 nd_aia_incense_route: "Маршрут благовоний" #NT!
 nd_aia_incense_route_desc: "На протяжении тысячелетий богатства южной Аравии текли на север по караванным путям, доставляя ладан и мирру из рощ Дофара и Хадрамаута на рынки Средиземноморья." #NT!
 nd_aia_falaj_irrigation: "Фаладж Ирригация" #NT!
 nd_aia_falaj_irrigation_desc: "Гениальная система фаладж направляет воду из подземных водоносных горизонтов через туннели с гравитационной подачей для поддержания сельского хозяйства в засушливом арабском ландшафте. Эта технология совершенствовалась на протяжении тысячелетий." #NT!
 nd_aia_tribal_confederacy: "Племенная Конфедерация" #NT!
 nd_aia_tribal_confederacy_desc: "Аравийское управление опирается на хрупкий баланс племенных союзов, где верховный шейх поддерживает власть посредством личного престижа, взаимных обязательств и распределения добычи, полученной от набегов." #NT!
 nd_aia_pearl_diving: "Жемчужный дайвинг" #NT!
 nd_aia_pearl_diving_desc: "На мелководье Персидского залива добывается жемчуг необычайного блеска, добываемый дайверами, которые спускаются на морское дно, не имея ничего, кроме утяжеленного камня и кожаных напальчников." #NT!
 nd_aia_desert_navigation: "Навигация по пустыне" #NT!
 nd_aia_desert_navigation_desc: "Бедуинские мореплаватели читают пустыню, как моряки читают море, по звездам, по ветрам на песке и по тонким изменениям рельефа, которые отмечают пути между далекими оазисами." #NT!
 nd_aia_dhow_shipbuilding: "Судостроение дау" #NT!
 nd_aia_dhow_shipbuilding_desc: "Характерное дау с латунным вооружением, обшитым дощатым корпусом и небольшой осадкой идеально приспособлено к муссонным ветрам Индийского океана и мелководьям Персидского залива." #NT!
 nd_aia_hajj_economy: "Экономика хаджа" #NT!
 nd_aia_hajj_economy_desc: "Миллионы паломников, ежегодно отправляющихся в Мекку и Медину, создают огромный экономический механизм из караван-сараев, поставщиков продовольствия, гидов и торговцев, который поддерживает Хиджаз." #NT!
 nd_aia_qadi_courts: "Кади суды" #NT!
 nd_aia_qadi_courts_desc: "Кади, изучавший исламскую юриспруденцию, выступает в качестве судьи в гражданских и уголовных спорах, обеспечивая основу правопорядка, основанную на Коране и хадисах." #NT!
 nd_aia_date_palm_groves: "Выращивание финиковой пальмы" #NT!
 nd_aia_date_palm_groves_desc: "Финиковая пальма — дерево жизни в Аравии, дающее пищу, древесину, волокно для веревок и тень для других культур. Его выращивание в орошаемых оазисах является основой оседлой арабской жизни.\n\n#italic Доступно в: $nd_aia_falaj_system$#!" #NT!
 nd_aia_arabian_horse_breeding: "Арабское коневодство" #NT!
 nd_aia_arabian_horse_breeding_desc: "Чистокровная арабская лошадь, выведенная за выносливость, преданность и скорость на протяжении тысячелетий селекционного ухода, является самой ценной кавалерийской лошадью в мире. Бедуинские племена охраняют родословную своих кобыл так же ревностно, как и свою честь." #NT!
 nd_aia_sufi_mysticism: "Суфийский мистицизм" #NT!
 nd_aia_sufi_mysticism_desc: "Мистические ордена ислама имеют глубокие корни в Аравии, где суфийские шейхи возглавляют общины в духовных упражнениях, поэзии и стремлении к божественному знанию посредством непосредственного опыта." #NT!
 nd_aia_mocha_coffee: "Кофе Мокко Трейд" #NT!
 nd_aia_mocha_coffee_desc: "Порт Мокко в Йемене стал единственными воротами мировых поставок кофе, товара, породившего глобальную сеть кофеен и прибыльную монополию." #NT!
 nd_aia_indian_ocean_trade: "Морская торговля в Индийском океане" #NT!
 nd_aia_indian_ocean_trade_desc: "Арабские дау на протяжении веков плавали по муссонным маршрутам, соединяя Красное море и Персидский залив с Индией, Восточной Африкой и островами специй Юго-Восточной Азии." #NT!
 nd_aia_imamate_governance: "Управление Имаматом" #NT!
 nd_aia_imamate_governance_desc: "Имамат Ибади в Омане и имамат Заиди в Йемене представляют собой отличительные арабские традиции религиозно-политической власти, где имам сочетает духовное лидерство с светским управлением." #NT!
 nd_aia_desert_fortresses: "Пустынные крепости" #NT!
 nd_aia_desert_fortresses_desc: "Каср, укрепленная цитадель в пустыне из сырцового кирпича и камня, охраняет торговые пути и водные источники внутри страны, служа одновременно военным гарнизоном и центром племенной власти." #NT!
 nd_aia_spice_middlemen: "Посредники специй" #NT!
 nd_aia_spice_middlemen_desc: "Арабские купцы издавна служили посредниками в торговле пряностями, закупая перец, корицу и гвоздику у производителей из Индии и Юго-Восточной Азии и продавая их с огромной наценкой европейским и османским покупателям." #NT!
 nd_aia_musket_adoption: "Принятие арабского огнестрельного оружия" #NT!
 nd_aia_musket_adoption_desc: "Внедрение огнестрельного оружия арабскими воинами меняет боевые действия в пустыне, сочетая мобильность конных кочевников с разрушительной огневой мощью фитильных мушкетов." #NT!
 nd_aia_sharif_authority: "Шарифская власть" #NT!
 nd_aia_sharif_authority_desc: "Шарифы Мекки, заявляющие о своем происхождении от Пророка Мухаммеда, обладают властью, выходящей за пределы племенных границ, обеспечивая легитимность любому правителю, который может заручиться их поддержкой." #NT!
 nd_aia_aden_entrepot: "Аденский перевалочный пункт" #NT!
 nd_aia_aden_entrepot_desc: "Естественная гавань Адена, контролирующая пролив между Красным морем и Индийским океаном, с древних времен была важным перевалочным пунктом для морской торговли." #NT!
 nd_aia_tribal_cavalry_reform: "Реформа племенной кавалерии" #NT!
 nd_aia_tribal_cavalry_reform_desc: "Традиционный стиль набегов бедуинов формализован в дисциплинированные кавалерийские формирования, сохраняющие мобильность и искусство верховой езды в пустыне, но добавляющие тактическую координацию и стратегическую цель." #NT!
 nd_aia_camel_corps: "Верблюжий корпус" #NT!
 nd_aia_camel_corps_desc: "Дромадер, способный преодолевать огромные расстояния без воды, позволяет создавать воинские подразделения, способные преодолевать местности, непроходимые для обычных армий." #NT!
 nd_aia_wahhabi_reform: "Ваххабитское реформаторское движение" #NT!
 nd_aia_wahhabi_reform_desc: "Союз между религиозным реформатором Мухаммадом ибн Абд аль-Ваххабом и Домом Саудов в 1744 году создает мощное религиозно-политическое движение, преобразующее Аравийский полуостров." #NT!
 nd_aia_ikhwan_warriors: "Ихванские воины" #NT!
 nd_aia_ikhwan_warriors_desc: "Ихваны, оседлые воины-бедуины, посвятившие себя религиозному изучению и военной службе, сочетают в себе выносливость кочевников пустыни с дисциплиной мотивированных фанатиков." #NT!
 nd_aia_arabian_modernization: "Арабская модернизация" #NT!
 nd_aia_arabian_modernization_desc: "Контакты с османскими и европейскими державами привносят на полуостров новые идеи управления, технологий и образования, стимулируя усилия по модернизации, не отказываясь от традиций." #NT!
 nd_aia_oasis_agriculture: "Оазис Сельское Хозяйство" #NT!
 nd_aia_oasis_agriculture_desc: "Передовые методы орошения превращают разбросанные оазисы в продуктивные сельскохозяйственные центры, поддерживая большее население и обеспечивая экономическую базу для централизованного государства.\n\n#italic Доступно в: $nd_aia_falaj_system$#!" #NT!
 nd_aia_pearl_trade_boom: "Бум торговли жемчугом" #NT!
 nd_aia_pearl_trade_boom_desc: "Ненасытный мировой спрос на жемчуг Персидского залива превратил прибрежные поселения в процветающие торговые центры, где торговцы жемчугом владеют богатством, соперничающим с богатством великих караванных торговцев.\n\n#italic Доступно в: $nd_aia_pearl_house$#!" #NT!
 nd_aia_gulf_patrol: "Военно-морской патруль Персидского залива" #NT!
 nd_aia_gulf_patrol_desc: "Вооруженные патрульные корабли охраняют жизненно важные морские пути Персидского залива и Красного моря, защищая арабскую торговлю от пиратов и проецируя силу через морскую границу." #NT!
 nd_aia_modern_arab_army: "Современная арабская армия" #NT!
 nd_aia_modern_arab_army_desc: "Создание постоянной армии, обученной европейским военным методам, знаменует собой трансформацию Аравии из конфедерации племенных воинов в современное государство, способное проецировать централизованную власть." #NT!
 nd_aia_arab_nationalism: "Арабское национальное пробуждение" #NT!
 nd_aia_arab_nationalism_desc: "Новое сознание общей арабской идентичности, укорененное в общем языке, истории и культуре, вдохновляет движение за политическое единство и самоопределение на всем полуострове." #NT!
 nd_aia_port_modernization: "Модернизация порта" #NT!
 nd_aia_port_modernization_desc: "Модернизация арабских портов с доками, складами и ремонтными предприятиями европейского типа соединяет полуостров с глобальной экономикой индустриальной эпохи." #NT!
 nd_aia_desert_infrastructure: "Инфраструктура пустыни" #NT!
 nd_aia_desert_infrastructure_desc: "Строительство дорог и коммуникаций на обширных внутренних территориях Аравии впервые объединяет разбросанные оазисы и племенные территории в единое государство." #NT!
 nd_aia_tribal_conscription: "Племенной призыв" #NT!
 nd_aia_tribal_conscription_desc: "Традиционная племенная обязанность предоставлять воинов по требованию формализована в системе призыва, гарантирующей, что каждое поселение вносит вклад в защиту единого государства." #NT!
 nd_aia_unified_arab_state: "Единое арабское государство" #NT!
 nd_aia_unified_arab_state_desc: "Кульминация многовековых усилий – централизованное арабское государство, преодолевшее племенные разногласия и объединившее различные народы под общим управлением и общей идентичностью." #NT!
 a_nd_aia_bedouin_raider: "Бедуинский налетчик" #NT!
 a_nd_aia_bedouin_raider_desc: "Молниеносная пустынная кавалерия, собранная из племенных рекрутов, знатоков разции, традиционного набега бедуинов, который с незапамятных времен терроризировал караваны и оседлые народы." #NT!
 a_nd_aia_musketeer: "Арабский мушкетер" #NT!
 a_nd_aia_musketeer_desc: "Дисциплинированная пехота, вооруженная мушкетами с фитильными замками, обученная наносить сокрушительные залпы, прежде чем обнажить изогнутые мечи для ближнего боя в соответствии с арабской традицией." #NT!
 a_nd_aia_najdi_cavalry: "Наджди Кавалерия" #NT!
 a_nd_aia_najdi_cavalry_desc: "Реформированная племенная кавалерия из центра Неджда, сочетающая традиционное искусство верховой езды в пустыне с дисциплинированными тактическими формированиями. Верховный в засушливой и пустынной войне." #NT!
 a_nd_aia_camel_rider: "Всадник на верблюде" #NT!
 a_nd_aia_camel_rider_desc: "Эти вспомогательные войска, оседланные на выносливых дромадерах, могут пересекать огромные пространства безводной пустыни, выступая в качестве разведчиков, носителей снабжения и легких истребителей там, где не могут последовать никакие конные силы." #NT!
 a_nd_aia_ikhwan: "Ихван Воин" #NT!
 a_nd_aia_ikhwan_desc: "Фанатически преданная пехота, набранная из оседлых бедуинских общин, Ихваны сражаются с пылом, рожденным глубокими религиозными убеждениями, что делает их грозными ударными отрядами." #NT!
 a_nd_aia_modern_infantry: "Современная арабская пехота" #NT!
 a_nd_aia_modern_infantry_desc: "Регулярная пехота, обученная европейским военным методам, оснащенная современным оружием и организованная в дисциплинированные формирования, способные вести длительные кампании." #NT!
 a_nd_aia_tribal_conscript: "Племенной призывник" #NT!
 a_nd_aia_tribal_conscript_desc: "Призванные воины из оседлых племенных общин составляли массовую пехоту, необходимую для защиты расширенного арабского государства." #NT!
 n_nd_aia_dhow: "Арабский дау" #NT!
 n_nd_aia_dhow_desc: "Знаменитое торговое судно арабского мира с латунным вооружением, быстрое и маневренное в муссонных ветрах, хотя и легко вооруженное по сравнению с европейскими военными кораблями." #NT!
 n_nd_aia_ocean_dhow: "Индийский океан Дау" #NT!
 n_nd_aia_ocean_dhow_desc: "Более крупный океанский вариант традиционного дау, способный преодолевать длинные муссонные маршруты между Аравией, Индией и Восточной Африкой." #NT!
 n_nd_aia_patrol_ship: "Патрульный корабль Персидского залива" #NT!
 n_nd_aia_patrol_ship_desc: "Вооруженное прибрежное судно, предназначенное для патрулирования мелководья Персидского залива и Красного моря, защиты торговых путей от пиратов и иностранных нарушителей." #NT!
 nd_aia_incense_warehouse: "Склад благовоний" #NT!
 nd_aia_incense_warehouse_desc: "Укрепленное хранилище драгоценных смол ладана и мирры, древних богатств южной Аравии, которые когда-то текли по караванным путям в Средиземноморье." #NT!
 nd_aia_falaj_system: "Фаладж Ирригация" #NT!
 nd_aia_falaj_system_desc: "Подземный канал, который использует гравитацию для доставки воды из отдаленных водоносных горизонтов на возделываемые поля, что позволяет вести сельское хозяйство в одном из самых засушливых ландшафтов на Земле." #NT!
 nd_aia_hajj_caravanserai: "Хадж Караван-сарай" #NT!
 nd_aia_hajj_caravanserai_desc: "Перевалочный пункт на пути паломничества в Мекку, обеспечивающий едой, водой, кровом и торговыми возможностями нескончаемый поток верующих, совершающих хадж." #NT!
 nd_aia_coffeehouse: "Кофейня Мокко" #NT!
 nd_aia_coffeehouse_desc: "Место сбора, где торговцы, ученые и путешественники обмениваются новостями и идеями за чашечкой темного ароматного кофе из высокогорных районов Йемена." #NT!
 nd_aia_desert_qasr: "Пустыня Каср" #NT!
 nd_aia_desert_qasr_desc: "Укрепленная крепость в пустыне из сырцового кирпича и камня, охраняющая торговые пути и водные источники внутренних территорий Аравии от налетчиков и захватчиков." #NT!
 nd_aia_entrepot: "Перевалочный склад" #NT!
 nd_aia_entrepot_desc: "Крупный торговый склад в портовом городе, где хранятся, сортируются и перепродаются товары из Индии, Африки и Европы, образуя основу арабской морской торговли." #NT!
 nd_aia_pearl_house: "Жемчужный дайвинг-хаус" #NT!
 nd_aia_pearl_house_desc: "Торговый дом, специализирующийся на торговле жемчугом Персидского залива, сортировке, оценке и продаже блестящих драгоценных камней, которые на протяжении тысячелетий были основным богатством аравийского побережья." #NT!
 nd_aia_modern_port: "Современный порт" #NT!
 nd_aia_modern_port_desc: "Портовый комплекс, оснащенный современными доками, кранами и ремонтными мастерскими, соединяющий Аравию с паровой морской торговлей индустриальной эпохи." #NT!
 nd_aia_pearl_harvest: "Жемчужный урожай" #NT!
 nd_aia_pearl_harvest_desc: "Дайверы спускаются к устричным залежам Персидского залива, собирая блестящий жемчуг, который на протяжении тысячелетий делал побережье Персидского залива богатым." #NT!
 nd_aia_date_processing: "Обработка даты" #NT!
 nd_aia_date_processing_desc: "Сбор, сушка и упаковка фиников из обширных пальмовых рощ полуострова для торговли по всему исламскому миру." #NT!
 nd_aia_oasis_farming: "Оазис Сельское Хозяйство" #NT!
 nd_aia_oasis_farming_desc: "Передовое орошаемое земледелие в пустынных оазисах с использованием металлических инструментов и тяги животных, производство пшеницы, овощей и кормов в избытке, что позволяет поддерживать более крупные оседлые поселения." #NT!
 nd_incense_storage: "Хранение благовоний" #NT!
 nd_incense_storage_desc: "Хранение и сортировка ладана и мирры на торговых путях Аравии с использованием тканевых оберток, сохраняющих драгоценные смолы для экспорта." #NT!
 nd_falaj_maintenance: "Техническое обслуживание Фаладжа" #NT!
 nd_falaj_maintenance_desc: "Поддержание подземных водных каналов с каменной облицовкой и деревянными опорами." #NT!
 nd_hajj_provisions: "Условия хаджа" #NT!
 nd_hajj_provisions_desc: "Снабжение караванов паломников скотом и зерном для путешествия в Мекку." #NT!
 nd_coffee_service: "Кофейный сервиз" #NT!
 nd_coffee_service_desc: "Приобретение и обжарка кофейных зерен из мокко, которые подаются в керамических чашках торговцам и ученым, часто посещающим кофейню." #NT!
 nd_qasr_garrison: "Каср Гарнизон" #NT!
 nd_qasr_garrison_desc: "Вооружение и снабжение укреплённого гарнизона крепости в пустыне оружием, камнем для ремонта стен и кожей для обслуживания брони и оборудования." #NT!
 nd_entrepot_operations: "Перевалочные операции" #NT!
 nd_entrepot_operations_desc: "Управление хранением и перераспределением импортного текстиля, керамики и консервированных товаров на крупном торговом перевалочном пункте, где соль сохраняет грузы от длительного морского путешествия." #NT!
 nd_pearl_sorting: "Сортировка жемчуга" #NT!
 nd_pearl_sorting_desc: "Сортировка, сортировка и полировка жемчуга Персидского залива тонкой тканью с использованием инструментов дайвера для подготовки его к продаже международным торговцам." #NT!
 nd_port_operations: "Портовые операции" #NT!
 nd_port_operations_desc: "Эксплуатация современного портового комплекса с лесными доками и военно-морскими складами." #NT!
 STATIC_MODIFIER_NAME_nd_aia_coffee_monopoly: "Кофейная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_aia_coffee_monopoly: "Строгий контроль над кофейными плантациями высокогорных районов Йемена и экспортными мощностями в Мокко создает монополию на самый модный товар в мире." #NT!
 nd_aia_formed_tt: "была образована Аравия." #NT!
 nd_aia_path_a_tt: "Выбрать Меч Пророка" #NT!
 nd_aia_path_b_tt: "Выбрали колыбель цивилизации" #NT!
 nd_aia_destiny: "Судьба Аравии" #NT!
 nd_aia_destiny_desc: "Когда Аравия объединилась, вопрос ее будущего становится ярким. Будет ли полуостров обращен в сторону завоеваний и веры или вовнутрь, в сторону торговли и цивилизации? Прежде чем идти по любому пути, необходимо сначала обеспечить стабильность королевства." #NT!
 nd_aia_dest_crescent: "Плодородный полумесяц" #NT!
 nd_aia_dest_crescent_desc: "Земли Плодородного полумесяца, Дамаск, резиденция Омейядов, и Багдад, город Аббасидов, когда-то были центром арабской цивилизации. Чтобы восстановить халифат, Аравия должна сначала вернуть себе эти древние столицы и создать армию, достойную выполнения этой задачи." #NT!
 nd_aia_dest_jihad: "Джихад правоверных" #NT!
 nd_aia_dest_jihad_desc: "Священный город Иерусалим и древняя земля Египта должны быть приведены под знамя восстановленного арабского государства. Благодаря богатству Каира и святости Иерусалима претензии халифата на лидерство в мусульманском мире становятся неоспоримыми." #NT!
 nd_aia_dest_caliphate: "Халифат восстановлен" #NT!
 nd_aia_dest_caliphate_desc: "От Алеппо до Басры, от Мосула до края пустыни — весь первоначальный халифат должен быть воссоединен под властью арабов. Это высшая цель – новый золотой век исламской цивилизации, управляемой из Аравии и способной обеспечить ее соблюдение." #NT!
 nd_aia_dest_gulf: "Хозяева Персидского залива" #NT!
 nd_aia_dest_gulf_desc: "Ормузский пролив и порты Омана контролируют торговый поток между Индийским океаном и Персидским заливом. Чтобы стать перекрестком мира, Аравия должна сначала взять под контроль эти жизненно важные узкие места и накопить богатство, которое они генерируют." #NT!
 nd_aia_dest_monsoon: "Муссонные маршруты" #NT!
 nd_aia_dest_monsoon_desc: "Арабские купцы тысячелетиями плыли по муссонным ветрам, но современная торговля требует современных институтов. Банковское дело, развитые рынки и благовония, которые когда-то сделали Аравию богатой, — все это должно быть использовано для построения торговой цивилизации, которая может соперничать с любой другой в мире." #NT!
 nd_aia_dest_crossroads: "Перекресток континентов" #NT!
 nd_aia_dest_crossroads_desc: "Аден контролирует проход между Красным морем и Индийским океаном, точку соединения трех континентов. Приняв глобальные торговые институты и накопив огромные богатства, Аравия может претендовать на свою окончательную судьбу не как завоеватель, а как незаменимый центр, через который должна течь мировая торговля." #NT!
 nd_aia.5.t: "Восходящая Аравия" #NT!
 nd_aia.5.d: "Полуостров един, племена присягнули на верность, а святые города находятся под нашей защитой. Впервые за столетия арабское государство пользуется уважением среди держав мира. Вопрос теперь не в том, поднимется ли Аравия, а в том, насколько высоко." #NT!
 nd_aia.5.a: "Наша судьба ждет." #NT!
 nd_aia.6.t: "Полумесяц восстановлен" #NT!
 nd_aia.6.d: "Дамаск и Багдад, жемчужины-близнецы арабской цивилизации, снова подчиняются арабскому суверену. Великие мечети, которые отражали указы халифов прошлого, снова будут отражать авторитет обновленного арабского государства. Плодородный полумесяц, житница империй, питает наши амбиции, как когда-то кормил Аббасидов." #NT!
 nd_aia.6.a: "Древние столицы снова наши." #NT!
 nd_aia.7.t: "Святая Земля в безопасности" #NT!
 nd_aia.7.d: "Иерусалим находится под нашей защитой, и богатства Египта текут в нашу сокровищницу. Восстановленное арабское государство теперь контролирует как духовную власть святых мест, так и материальные ресурсы долины Нила. Однако возникает вопрос: будем ли мы продвигаться вперед с воинственным рвением, штурмуя каждую крепость на нашем пути? Или нам следует закрепить эти огромные завоевания с помощью гарнизонов и терпения, позволяя нашей силе расти за укрепленными стенами?" #NT!
 nd_aia.7.a: "Беспощадно атакуйте!" #NT!
 nd_aia.7.b: "Укрепляйте то, что мы держим, и становитесь сильнее." #NT!
 nd_aia.8.t: "Возрождение Халифата" #NT!
 nd_aia.8.d: "От берегов Средиземного моря до истоков Тигра, от пустынь Синая до гор Курдистана халифат снова оживает. Никогда со времен Харуна ар-Рашида арабский правитель не управлял такими обширными владениями. Мир наблюдает, как Аравия занимает свое место среди великих империй истории.\n\nНо как будет определять себя этот восстановленный халифат? Как меч, расширяющий веру силой оружия? Или как справедливый правитель, который мудро управляет разными народами и завоевывает их лояльность честными делами?" #NT!
 nd_aia.8.a: "Мечом Божьим мы победим!" #NT!
 nd_aia.8.b: "Справедливость и мудрость станут нашим наследием." #NT!
 nd_aia.9.t: "Хозяева пролива" #NT!
 nd_aia.9.d: "Великий перевалочный пункт Ормуза принадлежит нам, а древний порт Маскат стоит под арабским флагом. Каждое судно, проходящее между Индийским океаном и Персидским заливом, теперь должно признать превосходство Аравии. Богатства Индии, Персии и Восточной Африки текут через воды, которыми мы располагаем." #NT!
 nd_aia.9.a: "Персидский залив – Аравийское море." #NT!
 nd_aia.10.t: "Муссонные ветры" #NT!
 nd_aia.10.d: "Наши торговцы путешествуют на муссонных ветрах из Персидского залива в Индию и за ее пределы, а наши банки финансируют торговлю, проходящую через наши порты. Древние маршруты благовоний уступили место современной торговой сети, но Аравия остается в ее центре.\n\nДолжны ли мы построить флот, чтобы силой защищать и укреплять наше морское владычество? Или нам следует сосредоточиться на торговых институтах, банках, биржах, торговых домах, которые делают наши порты незаменимыми независимо от того, кто командует морями?" #NT!
 nd_aia.10.a: "Командуйте морями с помощью арабских военных кораблей!" #NT!
 nd_aia.10.b: "Стройте институты, которые сделают нас богатыми." #NT!
 nd_aia.11.t: "Перекресток мира" #NT!
 nd_aia.11.d: "Аравия находится на пересечении трех континентов, и мировая торговля проходит через наши порты. От Адена до Ормуза, от Джидды до Маската арабские купцы соединяют Европу с Азией и Африку с Востоком. Наши банковские дома финансируют предприятия за океаном, а наши рынки устанавливают цены, которые отзываются эхом в далеких столицах.\n\nЭто зенит арабской торговли. Будем ли мы использовать эту позицию для содействия новому золотому веку искусства, образования и дипломатии? Или мы должны максимально использовать наши коммерческие преимущества, гарантируя, что Аравия останется незаменимым перекрестком, через который должна проходить вся торговля?" #NT!
 nd_aia.11.a: "Вступайте в новый золотой век!" #NT!
 nd_aia.11.b: "Мы — перекресток. Мир платит нам." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_militant_jihad: "Воинствующий джихад" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_militant_jihad: "Воины халифата штурмуют укрепления с фанатической отвагой, подавляя защитников посредством чистой агрессии и тактической инициативы." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_caliphal_garrison: "Калифский гарнизон" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_caliphal_garrison: "Сеть укреплённых гарнизонов защищает обширные новые территории халифата, а укреплённые стены и дисциплинированные войска поддерживают порядок на завоеванных землях." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_sword_of_islam: "Меч Ислама" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_sword_of_islam: "Военная машина халифата действует с безжалостной эффективностью, поддерживая кампании на огромных расстояниях, в то время как верующие сражаются с неутомимой преданностью." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_just_caliph: "Справедливый халиф" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_just_caliph: "Халиф правит мудро и справедливо, завоевывая лояльность различных народов благодаря справедливому управлению и проницательным разведывательным сетям." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_maritime_dominion: "Морской Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_maritime_dominion: "Арабские военные корабли обеспечивают контроль над жизненно важными морскими путями, блокируя соперников и защищая торговые флоты, перевозящие богатства трех континентов." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_trading_empire: "Торговая империя" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_trading_empire: "Обширная сеть торговых судов соединяет арабские порты с рынками Индийского океана, поддерживаемая опытными капитанами и выгодными банковскими соглашениями." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_golden_age: "Золотой век арабского мира" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_golden_age: "Возрождение искусства, образования и дипломатии исходит от Аравийского полуострова, поскольку богатство торговли финансирует ученых, художников и послов по всему известному миру." #NT!
 STATIC_MODIFIER_NAME_nd_aia_dest_worlds_crossroads: "Перекресток мира" #NT!
 STATIC_MODIFIER_DESC_nd_aia_dest_worlds_crossroads: "Аравия стала незаменимым связующим звеном глобальной торговли, где сходятся все торговые пути и каждый торговец должен отдавать дань уважения стражам пролива." #NT!
 nd_aia_caliphal_diwan: "Халифальный Диван" #NT!
 nd_aia_caliphal_diwan_desc: "Центральное административное бюро восстановленного халифата, где писцы записывают указы, ведутся налоговые регистры, а управление огромной империей ведется с методической точностью." #NT!
 nd_aia_trade_exchange: "Арабская торговая биржа" #NT!
 nd_aia_trade_exchange_desc: "Грандиозный рынок, где торговцы с трех континентов ведут бизнес, с постоянными торговыми залами, охраняемыми складами и резидентами, представляющими коммерческие интересы от Индии до Европы." #NT!
 nd_aia_diwan_administration: "Администрация Дивана" #NT!
 nd_aia_diwan_administration_desc: "Для работы халифальной бюрократии требуются стопки бумаг для записей, тонкая ткань для мантий чиновников и пчелиный воск для печатей, удостоверяющих подлинность императорских указов." #NT!
 nd_aia_exchange_operations: "Обменные операции" #NT!
 nd_aia_exchange_operations_desc: "Для управления крупной торговой биржей требуется бумага для контрактов и бухгалтерских книг, ткань для упаковки товаров и инструменты для взвешивания, измерения и фиксации товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_aia_bureaucracy_authority: "Панарабская администрация" #NT!
 AUTO_MODIFIER_DESC_nd_aia_bureaucracy_authority: "Институты полуострова (Шарифат Двух Святилищ, имаматы Саада и Низва, дирах пустынных племен, прибрежные таможни и религиозно-политические договоры центра Наджди) теперь могут навсегда утвердиться в качестве институциональной основы единой Аравии. Капитал обеспечивает основу; Дальнейшие институциональные возможности отражают широту бюрократического аппарата, который может поддерживать единое государство." #NT!
  
 aia_sharifate_haramain_bureaucracy: "Опека над двумя священными мечетями" #NT!
 aia_sharifate_haramain_bureaucracy_desc: "Основанный в 1201 году, когда Шариф Катада ибн Идрис захватил Мекку у Бану Такиф, Хашимитский Шарифат управлял Хиджазом под последовательными господствами (Мамлюк, затем Османская империя после 1517 года) до 1925 года. Шариф черпал свою религиозную легитимность из происхождения Пророка через аль-Хасана ибн Али и осуществлял практическую сидану Каабы и Мечеть Пророка. Османские султаны называли себя Хадимом аль-Харамайн аш-Шарифайн после завоевания Египта Селимом I; сурра золота, ежегодно отправляемая из Дамаска и Каира, распределялась офисом Шарифа среди местных улемов, крупных пожертвований вакфа и бедняков Двух Святилищ." #NT!
  
 aia_zaydi_imamate_bureaucracy: "Зайди Имамат Саада" #NT!
 aia_zaydi_imamate_bureaucracy_desc: "В сентябре 1597 года аль-Мансур аль-Касим, зайди-сайид линии Рассидов, провозгласил имамат в Сааде против навязывания Османской империей ханафитского фикха в горах Йемена. К 1608 году касимидские имамы вернули себе горные районы и подписали десятилетнее перемирие с Портой; к 1636 году они изгнали османские гарнизоны Мокки и Тихамы. Имамат управлял через сада (сайидов-ученых-судей, заявляющих о хашимитском происхождении), которые распространяли судебную практику Зайди-Хадави из районных центров в Сааде, Сане и Шихаре, вызывая племенные сборы по религиозному призыву, а не по феодальному владению." #NT!
  
 aia_ibadi_imamate_bureaucracy: "Ибади Имамат Низвы" #NT!
 aia_ibadi_imamate_bureaucracy_desc: "Ибадийский Имамат Омана, впервые провозглашенный в 750 г. н.э. и возрождавшийся в 793 г. и много раз после этого, был выборной теократией. Имам избирался собранием улемов (ахл аль-холл ва-ль-акд) и мог быть свергнут тем же органом, если бы он был признан в этом ненужным. Столица попеременно находилась между Низвой и Рустаком; провинциальные вали были названы имамом из числа ученых семей. Имамат считал, что абсолютная политическая и военная власть никогда не должна принадлежать одному человеку, создавая заметно децентрализованное правительство, которое просуществовало в двадцатом веке наряду с прибрежным султанатом Маскат." #NT!
  
 aia_dirah_pasture_bureaucracy: "Дира и Хима" #NT!
 aia_dirah_pasture_bureaucracy_desc: "Дира была обычной племенной территорией конфедераций Неджди и бедуинов: это была не фиксированная граница, а гибкие претензии на пастбища, водопои и сезонные пастбища, подкрепленные набегами (газу) и арбитражем шейхлы. В заповедниках хима в определенные сезоны отведено место для содержания названных животных; колодцы были помечены, долги за кровь рассматривались в меджлисе, а доступ к ним обсуждался между шейхами на нейтральных ярмарках. Ни одно центральное государство не могло функционировать в Неджде, не связав великие конфедерации (Анаиза, Шаммар, Мутаир, Кахтан) субсидиями или оружием; устоявшиеся режимы, игнорировавшие дирах, потеряли свои доходы от окраин пустыни в течение одного поколения." #NT!
  
 aia_mocha_customs_bureaucracy: "Таможенное управление Мокко" #NT!
 aia_mocha_customs_bureaucracy_desc: "После османского завоевания Йемена в 1538 году каждый корабль Красного моря по указу был обязан заходить в Мокку и платить там таможню. На протяжении семнадцатого века через его склады ежегодно проходило около 10 000 тонн зерен, высушенных или обжаренных перед экспортом, чтобы предотвратить прорастание за пределы Йемена. После 1636 года имамы Касимидов унаследовали должность нахуда аль-бундука и продолжили османский режим: диван из трех чиновников (вали, мухтасиба и нахуда аль-бахра), устанавливающих пошлины на импорт в размере от пяти до десяти процентов и фиксированный тариф за бахар кофе. Европейские фабрики в Мокко (английские, голландские, французские) платили такую ​​же плату и в восемнадцатом веке." #NT!
  
 aia_diriyah_pact_bureaucracy: "Пакт Дирия" #NT!
 aia_diriyah_pact_bureaucracy_desc: "В 1744 году (1157 г. хиджры) в городе-оазисе Ад-Дирия в Неджде Мухаммад ибн Абд аль-Ваххаб и местный эмир Мухаммад ибн Сауд поклялись во взаимном байа: религиовед будет руководить доктриной и призывом, эмир будет обеспечивать оружие и политическое руководство. В результате договора было создано Первое Саудовское государство (1744-1818 гг.) и объединенный религиозно-политический аппарат, в котором мутаввиун ехал вместе с саудовскими командирами, кади, назначаемые Домом аль-Шейха, применяли строгую ханбалитскую юриспруденцию, а доходы извлекались в виде закята с завоеванных племен. Братства Ихван, возникшие в результате этого договора, к началу девятнадцатого века распространили ваххабитскую доктрину по всему полуострову." #NT!
