l_russian:
 TAB: "Табор" #NT!
 TAB_ADJ: "Таборит" #NT!
 TAB_f: "Таборская республика" #NT!
 TAB_f_desc: "Создайте суверенное гуситское содружество из радикального крыла гуситских войн: крестьянско-солдатского братства, народной церкви-чаши и четырех статей Праги, принятых законом. Там, где Богемия пошла на компромисс в Липанах, табориты институционализировали свою боевую милицию, женское духовенство и выборное общинное правление в постоянное государство." #NT!
