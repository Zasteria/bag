l_russian:
 STATIC_MODIFIER_NAME_nd_gre_megali_idea: "Идея Мегали" #NT!
 STATIC_MODIFIER_DESC_nd_gre_megali_idea: "Мечта о восстановлении суверенитета Греции над землями Византийской империи ярко горит. Константинополь манит: город наших предков, колыбель православной цивилизации, ждет своих законных наследников." #NT!
 STATIC_MODIFIER_NAME_nd_gre_hellenic_enlightenment: "Эллинское Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_gre_hellenic_enlightenment: "Греция находится в авангарде новой эпохи разума и обучения. Опираясь на мудрость своих античных предков и интеллектуальные течения современной Европы, греческие ученые создают нацию, построенную на образовании, морском предпринимательстве и демократических идеалах древнего полиса." #NT!
 STATIC_MODIFIER_NAME_nd_gre_fire_ship_legacy: "Наследие огненных кораблей" #NT!
 STATIC_MODIFIER_DESC_nd_gre_fire_ship_legacy: "Смелые подвиги капитанов греческих боевых кораблей вселили ужас во вражеские флоты по всему Эгейскому морю. Эта традиция смелой морской войны, где храбрость и изобретательность побеждают численное превосходство, определяет греческий подход к морской мощи." #NT!
 STATIC_MODIFIER_NAME_nd_gre_phanariot_diplomacy: "Дипломатические сети фанариотов" #NT!
 STATIC_MODIFIER_DESC_nd_gre_phanariot_diplomacy: "Образованные греческие семьи Фанарского района наладили сеть дипломатических связей, простирающихся от Константинополя до дворов Европы. Их лингвистические таланты и политическая хватка служат греческому делу изнутри." #NT!
 STATIC_MODIFIER_NAME_nd_gre_phanariot_commerce: "Коммерческая империя фанариотов" #NT!
 STATIC_MODIFIER_DESC_nd_gre_phanariot_commerce: "Торговые князья Фанара использовали свое привилегированное положение для создания торговых сетей, охватывающих Османскую империю и за ее пределами. Греческие торговые дома доминируют в торговле зерном от Черного моря до Средиземного моря." #NT!
 nd_gre.1.t: "Рождение Эллады" #NT!
 nd_gre.1.d: "После столетий иностранного господства греческое государство вновь возрождается из пепла древности. Сине-белое знамя реет над Афинами, и вопрос, который преследовал греческую нацию на протяжении поколений, теперь требует ответа: чем станет эта возрожденная Эллада?\n\nНекоторые смотрят на восток, в сторону Константинополя и утраченной славы Римской империи греков. Идея Мегали, Великая Идея, призывает ни к чему иному, как к восстановлению суверенитета Греции над землями, где когда-то процветала греческая цивилизация. Это путь амбиций, православной судьбы, пути возвращения того, что было взято.\n\nДругие смотрят в будущее, а не в прошлое. Ученые греческого Просвещения, такие как Ригас Ферайос и Адамантиос Кораис, видят современную республику, маяк образования и торговли в Восточном Средиземноморье. Это путь разума, морского предпринимательства, доказательства того, что наследники Перикла могут построить новую цивилизацию, достойную своих предков.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_gre.1.a: "Константинополь снова станет нашим!" #NT!
 nd_gre.1.b: "Мы будем светом новой эпохи." #NT!
 nd_gre.2.t: "Огонь на воде" #NT!
 nd_gre.2.d: "Безлунной ночью к вражескому флагману подползает небольшой корабль, набитый порохом и горючими материалами. Экипаж, добровольцы, которые знают, что могут не выжить, ведут свой летающий ад сквозь тьму. Когда брандер находит свою цель, взрыв освещает море: судно вражеского адмирала взрывается столбом пламени, видимым на многие мили.\n\nЭто греческий способ ведения морской войны. Матросы Гидры, Спецеса и Псары, превосходящие численностью и вооружением, превратили брандер в произведение искусства. Там, где у османов есть военные корабли, построенные для сражения, у греков есть торговые суда, смелые капитаны и готовность превратить свои корабли в оружие. Эта тактика оказалась разрушительно эффективной; Вражеские флоты теперь не решаются встать на якорь у греческих вод, зная, что любая безлунная ночь может вызвать огонь из тьмы." #NT!
 nd_gre.2.a: "Пусть они боятся нашего пламени!" #NT!
 nd_gre.3.t: "Возвышение фанариотов" #NT!
 nd_gre.3.d: "В тени Вселенского Патриархата великие семьи Фанарского района приобрели необычайное влияние. Эти образованные, многоязычные греческие дворяне, фанариоты, служат драгоманами, врачами и администраторами на самых высоких уровнях османского управления. Они управляют Дунайскими княжествами, переводят дипломатическую корреспонденцию и пользуются уважением при каждом дворе от Вены до Санкт-Петербурга.\n\nОднако у этой власти есть выбор. Фанариоты могут использовать свое положение для создания дипломатических сетей, которые служат национальным интересам Греции: глаза и уши в каждой столице, союзы, создаваемые в коридорах власти. Или они могут обратить свое внимание на торговлю, используя свой привилегированный доступ к османским рынкам для строительства греческих торговых домов, которые доминируют на торговых путях Восточного Средиземноморья." #NT!
 nd_gre.3.a: "Перо сильнее меча." #NT!
 nd_gre.3.b: "Торговля – это истинный путь к власти." #NT!
 nd_gre.4.t: "Общество друзей" #NT!
 nd_gre.4.d: "В скромном доме в Одессе трое греческих купцов (Николаос Скуфас, Эммануил Ксантос и Афанасиос Цакалов) основали тайное общество, занимающееся освобождением греческой нации. Они называют его Филики Этерия, Общество Друзей.\n\nОрганизованное по принципу масонства и карбонариев, с четырьмя уровнями посвящения и сложной системой кодов и сигналов, Общество быстро распространяется среди греческой диаспоры. Купцы в каждом крупном порту, священники в каждом приходе, капитаны на каждом острове: сеть становится невидимой для османских глаз. Члены пополняют военный бюджет, занимаются контрабандой оружия и готовят почву для революции.\n\nПриближается день расплаты. Когда будет дан сигнал, весь греческий мир восстанет как единое целое." #NT!
 nd_gre.4.a: "Свобода или смерть!" #NT!
 nd_gre_mountain_strongholds: "Горные крепости" #NT!
 nd_gre_mountain_strongholds_desc: "Суровые горы Греции всегда были последним прибежищем свободных. Укрепленные позиции в высокогорье обеспечивают убежище от захватчиков и служат базами для бойцов сопротивления." #NT!
 nd_gre_orthodox_identity: "Православная идентичность" #NT!
 nd_gre_orthodox_identity_desc: "Греческая православная вера служит объединяющей силой эллинской идентичности, сохраняя язык, образование и национальное сознание на протяжении веков иностранного правления." #NT!
 nd_gre_olive_cultivation: "Выращивание оливок" #NT!
 nd_gre_olive_cultivation_desc: "Оливковое дерево является основой греческого сельского хозяйства, обеспечивая нефть, продукты питания и торговые товары, которые поддерживали средиземноморские цивилизации с древних времен." #NT!
 nd_gre_armatoloi_tradition: "Арматолийская традиция" #NT!
 nd_gre_armatoloi_tradition_desc: "Арматолы, отряды христианских ополченцев, которым поручено охранять горные перевалы, составляют ядро ​​греческой военной мощи, сочетая официальную власть с боевыми навыками горных воинов." #NT!
 nd_gre_aegean_seamanship: "Эгейское мореплавание" #NT!
 nd_gre_aegean_seamanship_desc: "Поколения греческих моряков освоили коварные воды Эгейского моря, его внезапные штормы и скалистые каналы, создав непревзойденную традицию мореплавания среди островных сообществ." #NT!
 nd_gre_monastic_learning: "Монашеское обучение" #NT!
 nd_gre_monastic_learning_desc: "Монастыри Афона и других греческих святынь хранят не только православную веру, но и весь корпус греческой науки: рукописи, философию и семена будущего национального пробуждения." #NT!
 nd_gre_klepht_warfare: "Клефт Война" #NT!
 nd_gre_klepht_warfare_desc: "Клефты, горные бандиты, отказывающиеся от власти Османской империи, совершенствуют искусство партизанской войны: устраивают засады, совершают набеги и исчезают в горах. Их тактика «нападай и беги» оказывается более эффективной, чем европейские линейные формирования в гористой местности." #NT!
 nd_gre_diaspora_trade_networks: "Торговые сети диаспоры" #NT!
 nd_gre_diaspora_trade_networks_desc: "Греческие купеческие сообщества, разбросанные по Средиземному и Черному морям, создают взаимосвязанную коммерческую сеть, направляя богатство и информацию обратно на родину Греции." #NT!
 nd_gre_millet_governance: "Управление Милле" #NT!
 nd_gre_millet_governance_desc: "В рамках османской системы проса греческая православная община осуществляет значительное самоуправление в сфере образования, религии и личного права, сохраняя административные традиции, которые однажды послужат восстановленному греческому государству." #NT!
 nd_gre_phanariot_patronage: "Покровительство фанариотов" #NT!
 nd_gre_phanariot_patronage_desc: "Богатые семьи фанариотов в Константинополе создают академии и школы, которые зажигают современное греческое Просвещение, готовя поколение ученых, которые будут формулировать аргументы в пользу греческой государственности." #NT!
 nd_gre_island_shipyards: "Островные верфи" #NT!
 nd_gre_island_shipyards_desc: "Верфи Гидры, Спецеса и Псары производят маневренные суда с опытными моряками: торговый флот, который в случае необходимости может стать грозной военно-морской силой." #NT!
 nd_gre_guerrilla_doctrine: "Партизанская доктрина" #NT!
 nd_gre_guerrilla_doctrine_desc: "Греческие бойцы систематизировали тактику ведения войны в горах, выработанную за столетия сопротивления: контролировать возвышенность, наносить удары по линиям снабжения, никогда не вступать в бой на условиях врага." #NT!
 nd_gre_merchant_marine: "Торговый флот" #NT!
 nd_gre_merchant_marine_desc: "К концу восемнадцатого века греческий торговый флот стал доминировать в судоходстве восточного Средиземноморья: более тысячи судов несли греческие цвета и восемнадцать тысяч опытных моряков были готовы к работе." #NT!
 nd_gre_fire_ship_tactics: "Тактика пожарного корабля" #NT!
 nd_gre_fire_ship_tactics_desc: "Греческие военно-морские командиры оттачивают разрушительную тактику брандеров: небольшие суда, начиненные порохом и горючими материалами, таранятся во вражеские военные корабли экипажами добровольцев, которые в последний момент спасаются на весельных лодках." #NT!
 nd_gre_patriarchal_schools: "Патриаршие школы" #NT!
 nd_gre_patriarchal_schools_desc: "Под патронажем Вселенского Патриархата греческие школы сохраняют и передают классическое образование, создавая грамотное население, превосходящее своих османских правителей в образовании." #NT!
 nd_gre_greek_enlightenment: "Греческое Просвещение" #NT!
 nd_gre_greek_enlightenment_desc: "Греческие интеллектуалы, такие как Евгениос Вулгарис и Ригас Ферайос, синтезируют классическую греческую философию с современной европейской мыслью, закладывая интеллектуальные основы независимости и государственности Греции." #NT!
 nd_gre_aegean_trade_ascendancy: "Эгейское торговое господство" #NT!
 nd_gre_aegean_trade_ascendancy_desc: "Греческие купцы используют последовательные европейские войны, чтобы бросить вызов западному доминированию в средиземноморской торговле. Продукция из смородины, зерна и оливок поступает из греческих портов на рынки Европы.\n\n#italic Доступно в: $nd_gre_olive_press$#!" #NT!
 nd_gre_filiki_eteria: "Филики Этерия" #NT!
 nd_gre_filiki_eteria_desc: "Общество друзей, тайная революционная организация, основанная в 1814 году в Одессе, объединяет греческих купцов, духовенство, военачальников и интеллектуалов в заговор, который потрясет Османскую империю до основания." #NT!
 nd_gre_philhellene_corps: "Филэллинский корпус" #NT!
 nd_gre_philhellene_corps_desc: "Европейские добровольцы, вдохновленные классической греческой цивилизацией, филэллины, привносят современную военную подготовку и романтический идеализм в дело Греции, формируя элитные подразделения, которые сражаются бок о бок с греческими нерегулярными формированиями." #NT!
 nd_gre_aegean_brig_design: "Эгейский Бриг Дизайн" #NT!
 nd_gre_aegean_brig_design_desc: "Греческие кораблестроители совершенствуют быстрый, хорошо вооруженный бриг в качестве своего фирменного военного корабля: достаточно маневренного, чтобы обогнать линейные корабли противника, но при этом обладающего достаточной огневой мощью, чтобы доминировать в усеянных островами водах Эгейского моря." #NT!
 nd_gre_national_awakening: "Национальное пробуждение" #NT!
 nd_gre_national_awakening_desc: "Греческое национальное сознание кристаллизуется в мощную политическую силу, объединяющую общины диаспоры, островных торговцев, горных воинов и образованных фанариотов ради мечты о независимом греческом государстве." #NT!
 nd_gre_constitution_of_epidaurus: "Конституция Эпидавра" #NT!
 nd_gre_constitution_of_epidaurus_desc: "Временная конституция 1822 года, разработанная в Эпидавре, закладывает основы греческого демократического управления: революционный документ, провозглашающий суверенитет греческого народа и гарантирующий права личности." #NT!
 nd_gre_hellenic_university: "Греческий университет" #NT!
 nd_gre_hellenic_university_desc: "Создание греческих высших учебных заведений превращает Афины в центр науки и культуры, готовящий администраторов, учителей и интеллектуалов, которые построят современное греческое государство." #NT!
 nd_gre_modern_navy: "Современный флот" #NT!
 nd_gre_modern_navy_desc: "Традиция греческого торгового флота превращается в профессиональные военно-морские силы, сочетающие мореходное мастерство островных сообществ с современной европейской военно-морской доктриной и технологиями." #NT!
 nd_gre_irredentist_spirit: "Ирредентистский дух" #NT!
 nd_gre_irredentist_spirit_desc: "Вера в то, что миллионы греков все еще живут под властью иностранцев, питает экспансионистский национальный дух: убежденность в том, что границы Греции должны охватывать все земли, где укоренилась греческая цивилизация." #NT!
 a_nd_gre_armatoloi: "Арматолой" #NT!
 a_nd_gre_armatoloi_desc: "Бойцы христианского ополчения, набранные в горах Греции, знатоки горной войны и партизанской тактики. Арматолы охраняют горные перевалы и служат военной опорой греческого сопротивления." #NT!
 a_nd_gre_klephts: "Клефты" #NT!
 a_nd_gre_klephts_desc: "Горные бандиты стали борцами за свободу, Клефты — мастера засад и набегов. Быстрые и неуловимые, они наносят удары с высокогорья и исчезают прежде, чем враг успевает ответить." #NT!
 n_nd_gre_fire_ship: "Гидриотовый пожарный корабль" #NT!
 n_nd_gre_fire_ship_desc: "Небольшое торговое судно, набитое порохом и горючими материалами, с экипажем отважных добровольцев, которые таранят его на вражеские военные корабли. Недостаток прочности компенсируется разрушительной наступательной мощью." #NT!
 a_nd_gre_philhellene_guard: "Филэллинская гвардия" #NT!
 a_nd_gre_philhellene_guard_desc: "Элитная пехота, обученная современным европейским военным методам, сочетающим в себе как греческий боевой дух, так и филэллинскую военную дисциплину. Эти войска представляют будущее греческого оружия." #NT!
 n_nd_gre_aegean_brig: "Эгейский Бриг" #NT!
 n_nd_gre_aegean_brig_desc: "Быстрое, хорошо вооруженное судно, спроектированное на верфях греческих островов. Бриг «Эгейское море» сочетает в себе скорость и огневую мощь, превосходно справляясь с патрулированием, блокадой и торговыми рейдами в усеянных островами водах восточного Средиземноморья." #NT!
 nd_gre_mountain_refuge: "Горный заповедник Клефт" #NT!
 nd_gre_mountain_refuge_desc: "Укрепленное убежище в горах Греции, служащее убежищем для бойцов сопротивления и служащее базой для партизанских операций против захватчиков." #NT!
 nd_gre_athonite_monastery: "Афонский монастырь" #NT!
 nd_gre_athonite_monastery_desc: "Центр православного образования, созданный по образцу великих монастырей Афона, сохраняющий рукописи, обучающий ученых и служащий маяком греческой культурной самобытности." #NT!
 nd_gre_merchant_house: "Греческий Торговый Дом" #NT!
 nd_gre_merchant_house_desc: "Торговое заведение, управляемое греческой диаспорой, соединяющее местные рынки с более широкой торговой сетью Средиземноморья. Греческие торговые дома доминируют в торговле зерном и предметами роскоши в восточном Средиземноморье." #NT!
 nd_gre_hydriote_shipyard: "Верфь Гидриот" #NT!
 nd_gre_hydriote_shipyard_desc: "Специализированная верфь, соответствующая традициям великих островных центров судостроения (Гидра, Спецес и Псара), производящая быстрые, хорошо построенные суда с экипажем опытных эгейских моряков." #NT!
 nd_gre_phanariot_academy: "Академия фанариотов" #NT!
 nd_gre_phanariot_academy_desc: "Учебное заведение, основанное богатыми покровителями-фанариотами, предлагающее образование в области классической философии, современной науки и европейских языков: колыбель греческого Просвещения." #NT!
 nd_gre_olive_press: "Оливковый пресс" #NT!
 nd_gre_olive_press_desc: "Традиционное греческое предприятие по переработке оливок, перерабатывающее урожай древних рощ в масло, продукты питания и экспортные товары, которые поддерживают экономику Средиземноморья." #NT!
 nd_gre_naval_academy: "Греческая военно-морская академия" #NT!
 nd_gre_naval_academy_desc: "Современное учебное заведение для греческого военно-морского флота, сочетающее многовековые традиции эгейского мореплавания с европейской военно-морской наукой для подготовки офицеров, достойных морского наследия Греции." #NT!
 nd_gre_refuge_upkeep: "Содержание горного гарнизона" #NT!
 nd_gre_refuge_upkeep_desc: "Оружие, скот, ткань и кожа для вооружения и поддержки горного гарнизона." #NT!
 nd_gre_monastery_maintenance: "Монашеское содержание" #NT!
 nd_gre_monastery_maintenance_desc: "Бумага, пчелиный воск, ткань и стекло для копирования рукописей, богослужебные свечи, облачения и окна." #NT!
 nd_gre_merchant_operations: "Торговые операции" #NT!
 nd_gre_merchant_operations_desc: "Ткань, бумага, соль и пчелиный воск, потребляемые в повседневной деятельности и торговле греческого торгового дома." #NT!
 nd_gre_shipyard_maintenance: "Операции верфи" #NT!
 nd_gre_shipyard_maintenance_desc: "Древесина, гудрон и военно-морские материалы для строительства и ремонта судов." #NT!
 nd_gre_academy_costs: "Операции Академии" #NT!
 nd_gre_academy_costs_desc: "Бумага, книги, стекло и пчелиный воск расходуются на научные занятия, обслуживание библиотек и вечерние занятия." #NT!
 nd_gre_olive_pressing: "Производство оливкового масла" #NT!
 nd_gre_olive_pressing_desc: "Традиционное прессование греческих оливок в масло, основной продукт средиземноморской торговли и кухни с древних времен." #NT!
 nd_gre_currant_export: "Экспортная торговля смородиной" #NT!
 nd_gre_currant_export_desc: "Переработка и экспорт греческой смородины, роскошного сухофрукта, ценимого во всей Европе и одного из самых ценных сельскохозяйственных экспортных товаров Греции." #NT!
 nd_gre_naval_academy_costs: "Операции Военно-морской академии" #NT!
 nd_gre_naval_academy_costs_desc: "Оружие, бумага, военно-морские принадлежности и инструменты для тренировок, обучения навигации и практического мореплавания." #NT!
 levy_nd_gre_armatoloi: "Арматолой Леви" #NT!
 levy_nd_gre_armatoloi_desc: "Горное ополчение, составленное из греческих крестьян и солдат, обученных традициям горной войны Арматолоев." #NT!
 nd_gre_formed_tt: "была образована Греция." #NT!
 nd_gre_path_a_tt: "Выбрали идею Мегали" #NT!
 nd_gre_path_b_tt: "Выбрал эллинское Просвещение." #NT!
  # ===== DESTINY LOCALIZATION ===== 
  # Destiny advance names and descriptions 
 nd_gre_destiny: "Судьба Эллады" #NT!
 nd_gre_destiny_desc: "Греция стоит на перепутье. Нация, давшая миру демократию, философию и Олимпийские игры, теперь должна проложить свой путь через эпоху империй. Достигните стабильности, чтобы начать путешествие." #NT!
 nd_gre_dest_straits: "Вернуть проливы" #NT!
 nd_gre_dest_straits_desc: "Босфор и Дарданеллы — ключи к судьбе Греции. Константинополь, город желаний мира, должен быть вырван из рук иностранцев. Возьмите древнюю столицу и охраняющие ее проливы и создайте армию, которая сможет их удержать." #NT!
 nd_gre_dest_ionian: "Ионический берег" #NT!
 nd_gre_dest_ionian_desc: "Западное побережье Анатолии было греческим в течение двух тысяч лет, прежде чем оно стало чем-то еще. От Смирны до Трапезунда греческие общины все еще находятся под властью иностранцев. Верните эти земли и развивайте империю, которая их поддерживает." #NT!
 nd_gre_dest_megali: "Мегали выполнено" #NT!
 nd_gre_dest_megali_desc: "Великая Идея достигает своей кульминации. От Антиохии до Кипра земли Восточного Средиземноморья объединены под эллинским знаменем. Это восстановление, о котором мечтали поколения греков: полный расцвет возрожденной православной цивилизации." #NT!
 nd_gre_dest_republic: "Учёная Республика" #NT!
 nd_gre_dest_republic_desc: "Греция должна стать республикой ученых и торговцев, а не бледной имитацией исчезнувших империй. Примите новые знания, пополните казну за счет торговли и защитите Крит, чтобы закрепить греческую морскую державу в центральном Средиземноморье." #NT!
 nd_gre_dest_maritime: "Морской Доминион" #NT!
 nd_gre_dest_maritime_desc: "Греческие корабли доминируют на торговых путях Восточного Средиземноморья. Шелк течет через греческие порты, греческие купцы устанавливают цены на каждом базаре от Александрии до Венеции. Развивайте нацию и обеспечивайте престиж, достойный наследников Перикла." #NT!
 nd_gre_dest_light: "Свет Нового времени" #NT!
 nd_gre_dest_light_desc: "Греция становится тем, чем всегда представляли себе мыслители Просвещения: маяком образования, науки и республиканского управления, освещающим путь всему миру. Примите научную революцию, накопите богатство, чтобы поддержать великое государство, и докажите, что факел цивилизации горит ярче всего там, где он был впервые зажжен." #NT!
  # Destiny event titles, descriptions, and options 
 nd_gre.5.t: "Судьба Эллады" #NT!
 nd_gre.5.d: "Греческое государство достигло стабильности, необходимой для достижения великой судьбы. Независимо от того, лежит ли эта судьба в восстановлении утраченных земель или в построении новой цивилизации, основы теперь в безопасности. Предстоящий путь простирается далеко, но Эллада никогда не испытывала недостатка в амбициях." #NT!
 nd_gre.5.a: "Наша судьба ждет." #NT!
 nd_gre.6.t: "Крест через проливы" #NT!
 nd_gre.6.d: "Греческие солдаты стоят там, где когда-то маршировали легионы Юстиниана. Огромный купол собора Святой Софии, оскверненный на протяжении веков, очищается и вновь освящен. Вселенский Патриарх возвращается на свое древнее место, и колокола Константинополя звонят над Босфором впервые за долгое время.\n\nДарданеллы тоже находятся в руках Греции: узкий проход, соединяющий Черное море со Средиземным, самый стратегический водный путь в мире. Ни один корабль не пройдет без разрешения Греции. Мечта поколений становится реальностью." #NT!
 nd_gre.6.a: "Город снова наш!" #NT!
 nd_gre.7.t: "Возвращение в Ионию" #NT!
 nd_gre.7.d: "Греческий триколор реет над набережной Смирны, где греческие купцы торгуют со времен Гомера. На востоке Трапезунд (последний форпост Римской империи, продержавшийся восемь лет после падения самого Константинополя) снова принадлежит Греции.\n\nНо управление этими отвоеванными землями требует выбора. Военный императив требует сильных гарнизонов и эффективного набора персонала для удержания обширной границы. Духовный императив призывает к восстановлению православия в странах, где вера подавлялась на протяжении веков, воссоединению греческого мира под одной церковью и одной цивилизацией." #NT!
 nd_gre.7.a: "Гарнизон на границах." #NT!
 nd_gre.7.b: "Восстановите веру." #NT!
 nd_gre.8.t: "Великая идея реализована" #NT!
 nd_gre.8.d: "От Адриатики до Евфрата, от Черного моря до Кипра, земли, где греческий язык когда-то был языком империи, снова объединились. Это то, что Колеттис провозгласил с трибуны в Афинах (Идея Мегали, Великая Идея), и это было реализовано в полной мере.\n\nЧто теперь? Некоторые видят новую Византию: империю тронов и армий, государство-преемник Рима, построенного Константином. Другие видят щит православия: священное содружество, целью которого является защита и распространение истинной веры. Империя построена. Его характер еще предстоит определить." #NT!
 nd_gre.8.a: "Мы наследники Византии." #NT!
 nd_gre.8.b: "Мы — щит христианского мира." #NT!
 nd_gre.9.t: "Республика обучения" #NT!
 nd_gre.9.d: "Банковские дома Афин и Салоник кипят от активности. Греческие купцы воспользовались новыми финансовыми инструментами, охватившими Европу, а казна пополнилась доходами от морской торговли. Крит, великий остров, охраняющий южную часть Эгейского моря, развевается под греческим флагом, его гавани укрывают торговый флот, который является истинным источником греческой власти.\n\nЭто та Греция, которую представлял Кораис: процветающая, образованная, современная. Не возрождение древних империй, а нечто новое: нация, которая доказывает классические добродетели разума и предприимчивости, может процветать в современном мире." #NT!
 nd_gre.9.a: "Знания – это истинное богатство." #NT!
 nd_gre.10.t: "Хозяева морских путей" #NT!
 nd_gre.10.d: "Греческие корабли везут шелк и специи с рынков Востока в гавани Запада. Торговый флот, который когда-то торговал смородиной и оливковым маслом, теперь доминирует в торговле предметами роскоши во всем Восточном Средиземноморье. Греческие торговые дома устанавливают цены, греческие капитаны знают каждое течение и мелководье, греческие посредники работают в каждом порту от Марселя до Александрии.\n\nКак распорядиться этим морским владычеством? Некоторые отдают предпочтение стратегии коммерческого флота: расширению производства сырья и использованию дипломатического обаяния для заключения выгодных торговых соглашений по всему Средиземноморью. Другие выступают за политику свободных портов: сокращение затрат на строительство крупных гаваней, привлечение вассальной торговли посредством щедрых условий, признание того, что военная готовность может пострадать." #NT!
 nd_gre.10.a: "Торговля и дипломатия идут рука об руку." #NT!
 nd_gre.10.b: "Откройте наши порты для всех, кто торгует." #NT!
 nd_gre.11.t: "Свет Нового времени" #NT!
 nd_gre.11.d: "Греция достигла того, о чем философы Просвещения могли только мечтать. Научная революция процветает в греческих университетах. Афины снова стали центром обучения, который может соперничать с любой столицей Европы. Богатство нации поддерживает великие институты, а престиж греческого государства вызывает уважение во всех дворах и конторах мира.\n\nДва видения соревнуются за душу этой просвещенной республики. Наследники Перикла выступают за афинскую демократию: государство, которое объединяет свои народы, управляет народной волей и расширяется посредством дипломатического убеждения, а не завоеваний. Наследники Фемистокла выступают за морскую империю: военно-морскую державу, которая распространяет силу по морям, нанимает лучших солдат, которых можно купить за деньги, и строит флот, который контролирует каждый пролив и гавань." #NT!
 nd_gre.11.a: "Урна для голосования, а не меч." #NT!
 nd_gre.11.b: "Господствовать на морях." #NT!
  # Destiny timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_gre_dest_imperial_garrisons: "Имперские гарнизоны" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_imperial_garrisons: "Отвоеванные земли Ионии охраняются сетью греческих гарнизонов, обеспечивая быстрый набор персонала и надежные линии снабжения через расширенную границу, хотя затраты на содержание этой военной инфраструктуры напрягают казну." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_orthodox_restoration: "Православная реставрация" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_orthodox_restoration: "Греческая церковь восстанавливает свою древнюю роль в Ионии и Понте. Общины, пережившие столетия иностранного правления, вновь приветствуются в рядах православных, и ассимиляция происходит быстро, хотя сосредоточенность на духовном обновлении замедляет материальное строительство." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_new_byzantium: "Новая Византия" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_new_byzantium: "Греция провозглашает себя преемницей Римской империи Востока. Имперская легитимность, огромная армия и престиж Константинополя — все это вызывает трепет у соперников, хотя акцент на сухопутной мощи означает, что флот должен обходиться меньшими затратами." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_shield_orthodoxy: "Щит Православия" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_shield_orthodoxy: "Греция посвящает себя защитнику православной веры. Преданность высока, и нация ведет переговоры с позиции морального авторитета, хотя затраты на поддержание священного содружества создают некоторое инфляционное давление." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_commercial_fleet: "Коммерческий флот" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_commercial_fleet: "Греческие торговые суда курсируют по всем торговым маршрутам Средиземноморья, расширяя добычу сырья и укрепляя дипломатическую репутацию посредством прибыльной торговли, хотя коммерческая ориентация оставляет армию на втором плане." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_free_port: "Политика свободного порта" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_free_port: "Греческие порты приветствуют всех желающих минимальными тарифами и щедрыми субсидиями на строительство. Вассальные государства извлекают выгоду из коммерческой инфраструктуры Греции и платят ей лояльностью, хотя открытая экономика усложняет военные поставки." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_athenian_democracy: "Афинская демократия возрождается" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_athenian_democracy: "Дух афинской агоры снова живет в современной греческой республике. Государство объединяет свои народы посредством гражданства, управляет посредством народного согласия и предпочитает дипломатическое поглощение завоеваниям." #NT!
 STATIC_MODIFIER_NAME_nd_gre_dest_maritime_empire: "Морская империя Эгейского моря" #NT!
 STATIC_MODIFIER_DESC_nd_gre_dest_maritime_empire: "Греция командует морями, как Фемистокл когда-то командовал флотом при Саламине. Тяжелые военные корабли распространяют мощь Греции по всему Средиземноморью, а иностранные наемники дополняют набор граждан, хотя бремя морской империи порождает усталость от войны." #NT!
  # Destiny building names and descriptions 
 nd_gre_imperial_basilica: "Императорская базилика" #NT!
 nd_gre_imperial_basilica_desc: "Величественная православная базилика, построенная в традициях собора Святой Софии: памятник восстановленной Эллинской империи и непреходящей вере, которая поддерживала греческий народ на протяжении веков иностранного господства." #NT!
 nd_gre_basilica_maintenance: "Содержание базилики" #NT!
 nd_gre_basilica_maintenance_desc: "Пчелиный воск для литургических свечей, ладан для кадильниц, ткань для священнических облачений и мрамор для бесконечной реставрации священных мозаик." #NT!
 nd_gre_hellenic_lyceum: "Греческий лицей" #NT!
 nd_gre_hellenic_lyceum_desc: "Центр обучения в традициях первоначального Лицея Аристотеля: сочетание естественной философии, математики и современной науки в учреждении, которое стремится продвигать человеческие знания, как это когда-то делали древние." #NT!
 nd_gre_lyceum_maintenance: "Лицей Операции" #NT!
 nd_gre_lyceum_maintenance_desc: "Бумага, книги, стеклянные инструменты и инструменты для научных экспериментов, философских исследований и подготовки следующего поколения греческих ученых." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_gre_bureaucracy_authority: "Греческая бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_gre_bureaucracy_authority: "При формировании [GRE.GetName] многоуровневое институциональное наследие греческих земель (коммунальная юрисдикция Патриархата, драгоманат фанариотов, знать Коджабаши, пакт арматоли-клефт, автономия Афонской горы и централизующие секретариаты Каподистриаса) становится доступным в качестве переключаемой бюрократии эллинского государства." #NT!
  
  
 gre_patriarchikon_bureaucracy: "Патриархикон" #NT!
 gre_patriarchikon_bureaucracy_desc: "Назначение Мехмедом II Геннадия II Схолария 6 января 1454 года сделало Вселенского патриарха Константинополя миллет-баси Рума, наделив церковь гражданской юрисдикцией в отношении семейного права, разрешения споров и православного образования для каждого православного христианина, находящегося под властью Османской империи. Священный Синод двенадцати митрополитов и Постоянный национальный смешанный собор, утвержденные Генеральными постановлениями 1862 года, сделали Патриархию светским и духовным правительством православного государства, которое надолго пережило Империю, которая его назначила." #NT!
  
 gre_phanariotai_bureaucracy: "Фанариоты" #NT!
 gre_phanariotai_bureaucracy_desc: "С 1669 по 1821 год греческие династии Константинопольского квартала Фанар (Маврокордат, Ипсилантис, Суцос, Каллимахи) монополизировали четыре великие должности Блистательной Порты: Великий драгоман Порты, Великий драгоман флота, а в 1711-1714 гг. господараты Молдавии и Валахии. Обученные классическим знаниям и османскому государственному управлению, они переводили договоры, вели имперскую дипломатию и управляли Дунайскими княжествами от имени султана, пока греческая революция 1821 года и российская оккупация 1828 года не завершили их эпоху." #NT!
  
 gre_kodjabashides_bureaucracy: "Коджабашидес" #NT!
 gre_kodjabashides_bureaucracy_desc: "Христианские приматы (proestoi, prokritoi, demogerontes) Османской Греции после завоевания Пелопоннеса в 1715 году объединились в наследственную олигархию землевладельцев-откупщиков. Официально оформленные около 1747 года, коджабашиды собирали чизе и другие поборы с православной рея, заседали в османских провинциальных советах и ​​осуществляли де-факто судебную автономию в своих округах. Их привилегии порождали прагматическую лояльность, которую возмущали клефты и арматолии, но которую культивировала Блистательная Порта." #NT!
  
 gre_armatoliki_bureaucracy: "Арматолики" #NT!
 gre_armatoliki_bureaucracy_desc: "С середины XV века, начиная с первых арматоликов, предоставленных в хребте Аграфа в Фессалии, османы поручали греческим капетаниям (часто бывшим капитанам-клефтам) охранять кишащие разбойниками горные районы в Македонии, Эпире, Акарнании и Этолии. Граница между санкционированными арматолами и клефтами-преступниками была вопросом покровительства, а не принципа: когда благосклонность Османской империи испортилась, капитаны скрылись в высокогорье и снова присоединились к тому самому бандитизму, за подавление которого им заплатили их преемники, создав сеть ополченцев, которая сформировала ядро ​​​​революции 1821 года." #NT!
  
 gre_hagion_oros_bureaucracy: "Хагион Орос" #NT!
 gre_hagion_oros_bureaucracy_desc: "Получив полную автономию и освобождение от налогов Алексием I Комнином около 1095 года и подтвержденный фирманом Мурада II от 1430 года в обмен на ежегодную дань, монашеский полуостров Афон управляется через Святую Общину двадцати правящих монастырей, которая собирается в Кариесе. На протяжении четырех столетий османского владычества афонская скриптория сохраняла греческое классическое и святоотеческое наследие, иконописные мастерские поддерживали византийскую художественную преемственность, а запрет на женщин и феодалов сохранял Святую Гору суверенным островом православной духовности вне какой-либо временной юрисдикции." #NT!
  
 gre_kapodistriaka_grammateia_bureaucracy: "Каподистриака Грамматия" #NT!
 gre_kapodistriaka_grammateia_bureaucracy_desc: "Прибыв в Нафплион 7 января 1828 года, Иоаннис Каподистрия приостановил действие конституции Трезена и управлял через пять централизованных секретариатов (внутренних дел, финансов, церковных дел и народного просвещения, юстиции, войны и флота), поддерживаемых консультативным советом Панелиниона. Он основал Национальный банк, отчеканил феникса, основал первую эллинскую военную академию, распустил Пелопоннесский сенат и арестовал Маниот-бея Петробея Мавромихалиса, сыновья которого убили его в церкви Святого Спиридона 27 сентября 1831 года: цена навязывания единого государства капитанам кланов, выигравшим войну." #NT!
