l_russian:
 STATIC_MODIFIER_NAME_nd_maz_piast_legacy: "Наследие последних Пястов" #NT!
 STATIC_MODIFIER_DESC_nd_maz_piast_legacy: "Герцогский дом Мазовии, последний из династии Пястов, опирается на многовековую династическую память, чтобы создать царство, основанное на благородной службе и защите границ." #NT!
 STATIC_MODIFIER_NAME_nd_maz_gate_of_the_vistula: "Ворота Вислы" #NT!
 STATIC_MODIFIER_DESC_nd_maz_gate_of_the_vistula: "Варшава контролирует великую переправу через реку, по которой зерно, древесина и янтарь перетекают из внутренних районов страны в Балтийское море, и герцогство намерено получать прибыль от каждой проходящей баржи." #NT!
 nd_maz.1.t: "Восходящее герцогство" #NT!
 nd_maz.1.d: "Мазовецкие земли объединены под нашим знаменем, и Варшава стоит как жемчужина Вислы. На протяжении поколений мазовецкие князья Пястов балансировали между независимостью и вассальной зависимостью, между воинскими традициями мелкого дворянства и торговыми перспективами речной торговли. Теперь герцогству предстоит выбрать свой путь. Должны ли мы обратиться к наследию родословной Пястов, сплотив нашу многочисленную знать с оружием в руках и отстояв наши древние династические права? Или нам следует посмотреть вдоль Вислы, осознав потенциал Варшавы как великого перекрестка торговли и образования?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_maz.1.a: "Мы наследники Пястов: наша кровь — наша сила." #NT!
 nd_maz.1.b: "Висла течет золотом: Варшава будет нашими воротами." #NT!
 nd_maz.2.t: "Под мазовецкими знаменами под Грюнвальдом" #NT!
 nd_maz.2.d: "Летом 1410 года мазовецкий отряд выступил вместе с войсками короля Владислава Ягайло против Тевтонского ордена под Грюнвальдом. Герцог Семовит Мазовецкий повел своих рыцарей в величайшую битву, которую когда-либо видел регион, и Тевтонское государство было разрушено. В тот день с честью развевались мазовецкие знамена, и память об этом общем триумфе с тех пор связывает дворянство герцогства воинственной гордостью. Наши рыцари доказали, что мазовецкая доблесть не уступает доблести христианского мира." #NT!
 nd_maz.2.a: "Честь Грюнвальда живет в наших знаменах." #NT!
 nd_maz.3.t: "Варшава: новая столица" #NT!
 nd_maz.3.d: "Князь Януш I перенес герцогскую резиденцию из Черска в Варшаву, признавая, во что превратилась переправа через реку. Когда-то скромная рыбацкая деревушка получила Магдебургские права, Варшава превратилась в процветающий город ремесленников, торговцев и мелкой знати. Завершение строительства собора Св. Иоанна придало ему духовную значимость; переезд герцогского суда дает ему политический авторитет. На берегу Вислы расположены зернохранилища и пристани, а новый город простирается за пределы старых стен. То, что когда-то было периферийным, стало центральным." #NT!
 nd_maz.3.a: "Благодаря этому городу Мазовия будет процветать." #NT!
 nd_maz.4.t: "Зернохранилища Вислы" #NT!
 nd_maz.4.d: "Мазовецкая рожь поступает на речные склады в Варшаве и Плоцке, загружается на плоскодонные баржи, которые следуют по Висле на север, в порты Балтики. Торговля зерном изменила экономику герцогства, обогатив мелкую знать, выращивающую урожай, и бюргеров, занимающихся торговлей. Каждый урожай теперь связывает Мазовию с остальным миром, рожь, которая растет на наших полях, питает города от Гданьска до Амстердама." #NT!
 nd_maz.4.a: "Наш урожай поддерживает нации." #NT!
 STATIC_MODIFIER_NAME_nd_maz_grunwald_valor: "Грюнвальдская доблесть" #NT!
 STATIC_MODIFIER_DESC_nd_maz_grunwald_valor: "Память о мазовецких знаменах, развевающихся над Грюнвальдом, вселяет боевое мужество во все герцогство." #NT!
 STATIC_MODIFIER_NAME_nd_maz_warsaw_ascendant: "Варшавский Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_maz_warsaw_ascendant: "Перенос герцогской резиденции в Варшаву ускорил рост города как центра управления и обучения." #NT!
 nd_maz_piast_strongholds: "Крепости Пястов" #NT!
 nd_maz_piast_strongholds_desc: "Деревянные укрепленные поселения вдоль мазовецких рек, сохранившиеся со времен первых князей Пястов, составляют основу пограничной обороны." #NT!
 nd_maz_szlachta_horsemen: "Шляхтские всадники" #NT!
 nd_maz_szlachta_horsemen_desc: "Мелкая мазовецкая знать ездит в виде легкой кавалерии, недостаточно богатой для тяжелых доспехов, но зато опытных всадников, которые в необычайном количестве отвечают на герцогский зов." #NT!
 nd_maz_rye_fields: "Мазовецкие ржаные поля" #NT!
 nd_maz_rye_fields_desc: "Низинные почвы Мазовии дают обильные урожаи ржи, основного зерна, которое кормит герцогство и питает его растущую экспортную торговлю.\n\n#italic Доступно в: $nd_maz_grod$#!" #NT!
 nd_maz_ducal_court_plock: "Герцогский двор в Плоцке" #NT!
 nd_maz_ducal_court_plock_desc: "Двор Пястов в Плоцке управляет герцогством, сочетая польские обычаи и местные мазовецкие традиции." #NT!
 nd_maz_parish_churches: "Приходские церкви Мазовии" #NT!
 nd_maz_parish_churches_desc: "Сеть каменных и деревянных церквей объединяет мазовецкую деревню под католической верой." #NT!
 nd_maz_grunwald_banners: "Грюнвальдские знамена" #NT!
 nd_maz_grunwald_banners_desc: "Отряд мазовецких рыцарей, принимавший участие в Грюнвальдской битве в 1410 году, укрепил военную репутацию герцогства." #NT!
 nd_maz_czersk_castle: "Черский замок" #NT!
 nd_maz_czersk_castle_desc: "Кирпичная готическая крепость в Черске, построенная князем Янушем I, является архитектурным символом мазовецкого княжества." #NT!
 nd_maz_warsaw_capital: "Варшава: новая столица" #NT!
 nd_maz_warsaw_capital_desc: "Перенос князем Янушем I герцогской резиденции в Варшаву в 1413 году ознаменовал превращение города из переправы через реку в политический центр." #NT!
 nd_maz_vistula_granaries: "Вислинские зернохранилища" #NT!
 nd_maz_vistula_granaries_desc: "На складах речных портов в Варшаве и Плоцке хранится зерно герцогства для транспортировки по Висле на рынки Балтии." #NT!
 nd_maz_dense_nobility: "Плотное дворянство" #NT!
 nd_maz_dense_nobility_desc: "Более двадцати процентов населения Мазовии претендует на дворянский статус, уникальный по численности дворянский класс, обеспечивающий рабочую силу сверх того, что можно предположить по размеру герцогства." #NT!
 nd_maz_magdeburg_charters: "Магдебургские чартеры" #NT!
 nd_maz_magdeburg_charters_desc: "Принятие Магдебургского закона предоставляет мазовецким городам самоуправление, кодифицированные юридические права и структурированное рыночное регулирование." #NT!
 nd_maz_pospolite_ruszenie: "Посполитое русение" #NT!
 nd_maz_pospolite_ruszenie_desc: "Общий сбор мелкого дворянства Мазовии, посполитическое русение, собирает непропорционально большое ополчение из густонаселенного дворянского сословия герцогства." #NT!
 nd_maz_timber_rafting_advance: "Сплав древесины" #NT!
 nd_maz_timber_rafting_advance_desc: "Мазовецкую древесину собирают в огромные плоты и плывут по Висле в Гданьск, соединяя леса герцогства с судостроительной торговлей Балтийского моря.\n\n#italic Доступно в: $nd_maz_vistula_wharf$#!" #NT!
 nd_maz_dozynki_tradition: "Дозинки Традиция" #NT!
 nd_maz_dozynki_tradition_desc: "Праздники урожая Мазовии объединяют помещиков и крестьян общим праздником, укрепляя социальные связи и культурную преемственность." #NT!
 nd_maz_warsaw_new_town: "Варшава Новый город" #NT!
 nd_maz_warsaw_new_town_desc: "Расширение Варшавы за пределы ее средневековых стен с появлением новых пригородов для пивоваров, ткачей и ремесленников свидетельствует о растущей жизнеспособности города.\n\n#italic Доступно в: $nd_maz_vistula_wharf$#!" #NT!
 nd_maz_crown_integration: "Коронная интеграция" #NT!
 nd_maz_crown_integration_desc: "Включение Мазовии в состав Польской короны после исчезновения мужской линии Пястов в 1526 году принесло новые административные связи." #NT!
 nd_maz_grain_fleet: "Вислинский зерновой флот" #NT!
 nd_maz_grain_fleet_desc: "Организованные конвои речных барж доставляют мазовецкое зерно в Балтийское море, что делает герцогство ключевым звеном в экспортной торговле зерном Польши." #NT!
 nd_maz_szlachta_privileges: "Шляхтские привилегии" #NT!
 nd_maz_szlachta_privileges_desc: "Золотые свободы польско-литовской шляхты особенно укореняются в Мазовии, где численность мелкого дворянства придает ей огромный политический вес." #NT!
 nd_maz_sejm_sessions: "Заседания Варшавского сейма" #NT!
 nd_maz_sejm_sessions_desc: "Проведение заседаний Сейма в Варшаве закрепляет роль города как фактической политической столицы Содружества.\n\n#italic Доступно в: $nd_maz_kancelaria$#!" #NT!
 nd_maz_agricultural_reforms: "Сельскохозяйственные реформы" #NT!
 nd_maz_agricultural_reforms_desc: "Модернизированные методы ведения сельского хозяйства и управление поместьями повышают урожайность на Мазовецкой низменности.\n\n#italic Доступно в: $nd_maz_szlachta_manor$#!" #NT!
 nd_maz_river_customs: "Речные таможни" #NT!
 nd_maz_river_customs_desc: "Платные станции вдоль Вислы получают доход от бесконечного потока барж, везущих в море зерно, лес и товары." #NT!
 nd_maz_mazovian_resilience: "Мазовецкая устойчивость" #NT!
 nd_maz_mazovian_resilience_desc: "Несмотря на потрясения, связанные с разделами и иностранным господством, мазовецкая идентичность сохраняется, упорная, практичная и укорененная в земле." #NT!
 nd_maz_warsaw_enlightenment: "Варшавское Просвещение" #NT!
 nd_maz_warsaw_enlightenment_desc: "Интеллектуальное брожение Просвещения достигает Варшавы, вдохновляя новые школы, типографии и реформаторские движения." #NT!
 nd_maz_industrial_vistula: "Промышленная Висла" #NT!
 nd_maz_industrial_vistula_desc: "Первые мануфактуры возникают вдоль Вислы, используя речную энергию и торговые связи для первых шагов промышленного производства." #NT!
 nd_maz_national_identity: "Мазовецкая национальная идентичность" #NT!
 nd_maz_national_identity_desc: "В эпоху империй и революций самобытный мазовецкий характер (его диалект, обычаи и дворянские традиции) кристаллизуется в осознанную региональную идентичность." #NT!
 nd_maz_warsaw_urban_growth: "Варшавский городской рост" #NT!
 nd_maz_warsaw_urban_growth_desc: "Население Варшавы увеличивается по мере того, как город превращается в настоящий мегаполис, привлекая мигрантов со всего региона своими институтами и возможностями." #NT!
 a_nd_maz_szlachta_cavalry: "Мазовецкая шляхта-кавалерия" #NT!
 a_nd_maz_szlachta_cavalry_desc: "Легкие всадники, набранные из густонаселенной мелкой знати Мазовии, не бронированные в тяжелых доспехах, но многочисленные и опытные наездники, которые в необычайном количестве отвечают на герцогский зов." #NT!
 a_nd_maz_rycerz: "Мазовецкий Рыцерж" #NT!
 a_nd_maz_rycerz_desc: "Рыцари Пястов в доспехах, доказавшие свою доблесть в Грюнвальде, эти тяжелые кавалеристы составляют боевую элиту Мазовецкого герцогства." #NT!
 a_nd_maz_pospolite: "Посполитская милиция" #NT!
 a_nd_maz_pospolite_desc: "Общий набор мелкой мазовецкой знати, стойких защитников, сражающихся за свои фермы и семьи, требующих небольшого снабжения из княжеской казны." #NT!
 nd_maz_grod: "Герцогский Грод" #NT!
 nd_maz_grod_desc: "Укрепленное деревянное поселение пястовской традиции, сочетающее в себе гарнизон, зернохранилище и административный центр вдоль мазовецких рек." #NT!
 nd_maz_vistula_wharf: "Вислинская пристань" #NT!
 nd_maz_vistula_wharf_desc: "Склад и пристань на берегу реки, где зерно, лес и товары загружаются на баржи для транспортировки по Висле." #NT!
 nd_maz_kancelaria: "Мазовецкая Канцелария" #NT!
 nd_maz_kancelaria_desc: "Герцогская канцелярия, где применяется Магдебургское право и дела герцогства регистрируются все более систематически." #NT!
 nd_maz_rye_cultivation: "Выращивание ржи" #NT!
 nd_maz_rye_cultivation_desc: "Систематическое выращивание ржи на Мазовецкой низменности подходит для песчаных почв и холодных зим региона." #NT!
 nd_maz_timber_rafting: "Сплав древесины" #NT!
 nd_maz_timber_rafting_desc: "Мазовецкие бревна связывали в огромные плоты и сплавляли по Висле на балтийские верфи." #NT!
 nd_maz_grod_upkeep: "Грод Техническое обслуживание" #NT!
 nd_maz_grod_upkeep_desc: "Деревянные частоколы и оружейные склады требуют постоянного ухода." #NT!
 nd_maz_wharf_operations: "Причальные операции" #NT!
 nd_maz_wharf_operations_desc: "Ежедневная работа по погрузке барж, обслуживанию причалов и управлению потоками речной торговли." #NT!
 nd_maz_chancellery_costs: "Канцелярские операции" #NT!
 nd_maz_chancellery_costs_desc: "Бумага, чернила и писцы для ведения административных отчетов герцогства." #NT!
 levy_nd_maz_szlachta_cavalry: "Шляхтский кавалерийский сбор" #NT!
 levy_nd_maz_szlachta_cavalry_desc: "Мелкая знать Мазовии отправляется на войну по призыву герцога, образуя легкую кавалерию поразительной плотности." #NT!
 a_nd_maz_pancerni: "Мазовецкие Панчерни" #NT!
 a_nd_maz_pancerni_desc: "Среднебронированная кавалерия, набранная из мазовецкой шляхты, универсальные всадники, которые служат мостом между легкими рейдерами и тяжелыми уланами." #NT!
 nd_maz_pancerni_tradition: "Традиция панцернской кавалерии" #NT!
 nd_maz_pancerni_tradition_desc: "Мазовецкие панцерны, бронированные, но ловкие кавалеристы, представляют собой эволюцию устоявшихся традиций мелкого дворянства." #NT!
 nd_maz_toll_station: "Платная станция Висла" #NT!
 nd_maz_toll_station_desc: "Таможенный пост на берегу реки, где сборщики пошлин взимают пошлину с каждой баржи, проходящей через мазовецкие воды." #NT!
 nd_maz_toll_operations: "Сбор платы за проезд" #NT!
 nd_maz_toll_operations_desc: "Бюрократический аппарат речной таможни, бухгалтерские книги, печати и чиновники, обеспечивающие получение Короной своей доли." #NT!
 nd_maz_szlachta_manor: "Усадьба Шляхта" #NT!
 nd_maz_szlachta_manor_desc: "Скромное поместье мелкого мазовецкого дворянина, скорее ферма, чем дворец, но являющееся основой рабочей силы герцогства." #NT!
 nd_maz_manor_upkeep: "Усадебные операции" #NT!
 nd_maz_manor_upkeep_desc: "Зерно и домашний скот поддерживают дворянский дом и его слуг." #NT!
 nd_maz_printing_house: "Варшавская типография" #NT!
 nd_maz_printing_house_desc: "Центр просветительского издательского дела, выпускавший книги, брошюры и газеты, распространявшие новые идеи по Мазовии." #NT!
 nd_maz_printing_costs: "Печатные операции" #NT!
 nd_maz_printing_costs_desc: "Бумага и красители используются в печатных машинах в качестве чернил и сырья для производства книг и брошюр для растущей варшавской читательской аудитории." #NT!
 nd_maz_mead_brewing: "Медоварение" #NT!
 nd_maz_mead_brewing_desc: "Традиционная мазовецкая медовуха, сваренная из местного пчелиного воска и зерна, подходит как для крестьянских посиделок, так и для дворянских застолий." #NT!
 nd_maz_sejm_records: "Парламентские отчеты" #NT!
 nd_maz_sejm_records_desc: "Систематическая документация заседаний Сейма, законов и дебатов, проводимых в Варшаве." #NT!
 nd_maz_market_trade: "Варшавская рыночная торговля" #NT!
 nd_maz_market_trade_desc: "Оживленная торговля расширенного рыночного квартала Варшавы: торговцы тканями, гончары и ремесленники обслуживают растущий город." #NT!
 nd_maz_formed_tt: "Образовано Мазовское воеводство." #NT!
 nd_maz_path_a_tt: "Выбрал «Наследие последних Пястов»" #NT!
 nd_maz_path_b_tt: "Выбрали ворота Вислы" #NT!
 nd_maz_destiny: "Мазовецкая судьба" #NT!
 nd_maz_destiny_desc: "Герцогство сформировано, и перед нами открывается его будущее. Судьба Мазовии ждет тех, у кого есть стабильность и видение, чтобы следовать ей." #NT!
 nd_maz_dest_border_march: "Пограничный марш Пяста" #NT!
 nd_maz_dest_border_march_desc: "Тевтонская граница уже давно угрожает Мазовии. Захватить Хелмненскую землю и Торунь для создания укрепленного пограничного марша под властью Пяста." #NT!
 nd_maz_dest_crusade: "Мазовецкий крестовый поход" #NT!
 nd_maz_dest_crusade_desc: "Когда граница обеспечена, пришло время полностью разрушить Тевтонское государство. Возьмите Мариенбург и Кенигсберг, чтобы разрушить власть Ордена." #NT!
 nd_maz_dest_piast_shield: "Щит Пястов" #NT!
 nd_maz_dest_piast_shield_desc: "Династия Пястов стоит как щит северной границы христианского мира. Доберитесь до Риги, чтобы контролировать все восточное побережье Балтийского моря и закрепить военное превосходство Мазовии." #NT!
 nd_maz_dest_baltic_outlet: "Балтийский Аутлет" #NT!
 nd_maz_dest_baltic_outlet_desc: "Мазовецкое зерно стекает по Висле, но другие наживаются в устье реки. Возьмите Гданьск, чтобы контролировать выход из Балтийского моря и сохранить богатство в руках Мазовии." #NT!
 nd_maz_dest_vistula_commerce: "Висла Коммерция" #NT!
 nd_maz_dest_vistula_commerce_desc: "Обеспечив выход из Балтики, превратите Варшаву в крупный торговый центр. Развивайте банковское дело, привлекайте янтарь на рынок капитала и постройте торговую империю вдоль реки." #NT!
 nd_maz_dest_vistula_crown: "Корона Вислы" #NT!
 nd_maz_dest_vistula_crown_desc: "Командуйте всем течением Вислы от Кракова до Гданьска. Освойте глобальную торговлю и накопите богатство, чтобы сделать Варшаву бесспорным центром торговли Центральной Европы." #NT!
 nd_maz.5.t: "Мазовецкая судьба" #NT!
 nd_maz.5.d: "Мазовия едина и стабильна. Знамя Пястов реет над Варшавой, и будущее герцогства зависит от нас. Мечом или золотом, Мазовия оставит свой след в мире." #NT!
 nd_maz.5.a: "Наша судьба начинается сейчас." #NT!
 nd_maz.6.t: "Пограничный марш обеспечен" #NT!
 nd_maz.6.d: "Мазовецкие знамена теперь реют над Торунем и Хелмненской землей. На протяжении поколений Тевтонский орден беспокоил нашу северную границу, требуя дань и совершая набеги на наши деревни. Больше не надо. Граница обеспечена, и мелкая шляхта, отправившаяся на войну, возвращается домой героями. Военная репутация герцогства растет, и в сердцах мазовецкой знати пробуждаются еще большие амбиции." #NT!
 nd_maz.6.a: "Граница наша." #NT!
 nd_maz.7.t: "Тевтонское государство распалось" #NT!
 nd_maz.7.d: "Мариенбург пал. Кенигсберг подчиняется. Некогда грозный Тевтонский орден, веками терроризировавший наших предков, теперь сломлен мазовецким оружием. Величественные замки Ордена теперь служат целям Мазовии, а богатства янтарного побережья Пруссии перетекают в нашу сокровищницу. Как нам закрепить это с таким трудом завоеванное завоевание?" #NT!
 nd_maz.7.a: "Разграбьте замки Ордена для нашей защиты." #NT!
 nd_maz.7.b: "Соберите всех дворян, которые могут присоединиться к нашему делу." #NT!
 nd_maz.8.t: "Щит Пястов" #NT!
 nd_maz.8.d: "От Варшавы до Риги восточная Балтика склоняется перед Мазовецкой державой. То, что начиналось как скромное герцогство на Висле, превратилось в военное государство, простирающееся на северных равнинах. Династия Пястов, последняя из своей древней линии, создала империю благодаря дисциплине и мужеству своей густонаселенной шляхетской кавалерии. Как история запомнит это достижение?" #NT!
 nd_maz.8.a: "Как завоеватели, диктующие условия королям." #NT!
 nd_maz.8.b: "Как оплот, удерживающий северную границу." #NT!
 nd_maz.9.t: "Балтийский аутлет под защитой" #NT!
 nd_maz.9.d: "Гданьск наш. Великий порт в устье Вислы, куда всегда направлялись мазовецкие зерно и древесина, теперь развевается под пястовским знаменем. Иностранные купцы больше не устанавливают условия торговли нашим урожаем. Баржи, отправляющиеся из Варшавы, прибывают в наши доки, и богатство, которое когда-то обогащало ганзейских чужаков, теперь наполняет мазовецкую казну." #NT!
 nd_maz.9.a: "Наконец-то богатства реки притекли к нам." #NT!
 nd_maz.10.t: "Мастера вислинской торговли" #NT!
 nd_maz.10.d: "Рынки Варшавы кипят от торговли. Через нашу столицу текут янтарь и зерно, банкиры кредитуют купцов всего региона, а Висла стала самой прибыльной торговой артерией в Центральной Европе. Наше коммерческое влияние простирается далеко за пределы того, что можно было бы предположить из-за скромных размеров герцогства. Как мы можем использовать эту позицию?" #NT!
 nd_maz.10.a: "Наше зерно кормит нации: пусть дипломатия последует за ним." #NT!
 nd_maz.10.b: "Проведите все дороги в Варшаву через торговлю и договоры." #NT!
 nd_maz.11.t: "Корона Вислы" #NT!
 nd_maz.11.d: "От соляных шахт Кракова до гавани Гданьска, весь Вислинский коридор отвечает за мазовецкую торговлю. То, чего другие народы добились путем завоеваний, мы построили с помощью счетных домов и зернохранилищ. Варшава является великим торговым центром Центральной Европы, куда приезжают торговцы от Балтики до Черного моря. Знамя Пястов стало символом не войны, а процветания." #NT!
 nd_maz.11.a: "Варшава станет торговым центром Севера." #NT!
 nd_maz.11.b: "Мы возглавим союз городов Вислы." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_teutonic_spoils: "Тевтонские трофеи" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_teutonic_spoils: "Захваченные укрепления и арсеналы Тевтонского ордена были перепрофилированы для обороны Мазовии." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_szlachta_banners: "Развернутые знамена шляхты" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_szlachta_banners: "Каждый мелкий дворянин в Мазовии откликается на призыв к оружию, пополняя наши ряды, но истощая казну." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_piast_hegemony: "Пястовская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_piast_hegemony: "Династия Пястов диктует условия своим соседям с позиции неприступной военной мощи." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_frontier_bulwark: "Пограничный оплот" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_frontier_bulwark: "Мазовия является непоколебимым оплотом на северной границе, привлекая наемников и припасы со всего королевства." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_grain_fortune: "Зерновая удача" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_grain_fortune: "Богатство, полученное от торговли зерном на Висле, открывает дипломатические двери и финансирует разведывательные сети по всей Европе." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_amber_road: "Янтарная дорога" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_amber_road: "Контроль над торговыми путями янтаря привлекает иностранных купцов и вассалов на коммерческую орбиту Варшавы." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_warsaw_emporium: "Варшавский торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_warsaw_emporium: "Статус Варшавы как крупного торгового центра обеспечивает дипломатическое влияние, хотя поддержание коммерческой инфраструктуры отвлекает ресурсы от военных." #NT!
 STATIC_MODIFIER_NAME_nd_maz_dest_vistula_league: "Вислинская лига" #NT!
 STATIC_MODIFIER_DESC_nd_maz_dest_vistula_league: "Конфедерация торговых городов Вислы под руководством Мазовии расширяет наши дипломатические возможности, хотя управление такой лигой порождает самоуспокоенность." #NT!
 nd_maz_arsenal: "Мазовецкий Арсенал" #NT!
 nd_maz_arsenal_desc: "Централизованный склад вооружения и арсенал, снабжающий военную машину Пястов вооружением, броней и осадной техникой." #NT!
 nd_maz_arsenal_upkeep: "Арсенал Операции" #NT!
 nd_maz_arsenal_upkeep_desc: "Оружейники и оружейники трудятся над тем, чтобы войска герцогства были оснащены лучшим оружием." #NT!
 nd_maz_kontora: "Висла Контора" #NT!
 nd_maz_kontora_desc: "Большая счетная палата и торговая биржа, где купцы договариваются об условиях торговли на Висле в соответствии с мазовецким законодательством." #NT!
 nd_maz_kontora_operations: "Администрация Конторы" #NT!
 nd_maz_kontora_operations_desc: "Клерки, фактористы и писцы управляют книгами и контрактами самой оживленной торговой биржи Вислы." #NT!
  
 # ===== BUREAUCRACIES ===== 
 maz_statuty_mazowieckie_bureaucracy: "Статуя Мазовецкое" #NT!
 maz_statuty_mazowieckie_bureaucracy_desc: "Уголовно-процессуальный кодекс герцога Семовита III, обнародованный в Сохачеве 27 апреля 1377 г. и пересмотренный в 1390 г. Статуты регулировали вергельд за убийство влодыки или зажиточного крестьянина, определяли условия законной вражды и связывали герцогские суды письменной процедурой. Принятие Мазовией статутного права за полвека до собственных систематических кодификаций Короны дало кадетскому герцогству Семовита юридическую власть, непропорциональную его территории, и сделало текст Сохачева референтом для мазовецких земельных судов спустя долгое время после присоединения к Польской Короне в 1526 году." #NT!
  
 maz_mazovian_sejmiki_bureaucracy: "Сеймики Черска и Варшавы" #NT!
 maz_mazovian_sejmiki_bureaucracy_desc: "Мазовецкие дворянские собрания, ратифицировавшие первую общую земельную привилегию герцогства в Нове-Място 21 июня 1414 года, были предоставлены совместно шляхте Черского и Варшавского округов Янушем I. Сеймики сохранили за собой право давать согласие на чрезвычайные налоги и военные сборы, закрепив консультативный обычай, который пережил присоединение к Короне в 1526 году и позже предоставил Мазовецкому дворянству воеводства с их особой предсеймовской позицией в конституционной жизни Польши." #NT!
  
 maz_ksiegi_ziemskie_bureaucracy: "Ксеги Земские Мазовецкие" #NT!
 maz_ksiegi_ziemskie_bureaucracy_desc: "Серия записей о земельном дворе, которую по поручению мазовецких князей поручили вести по округам со второго десятилетия пятнадцатого века, с отдельными томами, открытыми в Розани в 1412 году, Макове в 1413 году, а также в Черском и Варшавском округах с 1414 года. Ксеги записывали наследство, продажу земли, ипотеку и приданое в реестры, с которыми наследники и кредиторы могли консультироваться в областном суде; как для шляхты, так и для городов Вислы письменные списки превратили собственность из устной памяти в юридически обязательный титул." #NT!
  
 maz_plock_chapter_bureaucracy: "Глава Плоцкого кафедрального собора" #NT!
 maz_plock_chapter_bureaucracy_desc: "Каноническая коллегия, обслуживающая Успенский собор в Плоцке, организованная под руководством Владислава Германа из бенедиктинской общины Святого Лаврентия и возведенная в полноценный капитул под руководством митрополита Гнезно. Согласно хартии Конрада Мазовецкого 1239 года, капитул совместно управлял примерно 240 виллами и двадцатью предиями епископской земли; Каноники предоставили грамотных канцелярских служащих герцогства, хранили епископский архив и короновали восемь первых князей Пястов в нефе собора, где они также были погребены рядом с мазовецкими князьями." #NT!
  
 maz_ducal_chancery_bureaucracy: "Герцогская канцелярия Варшавы" #NT!
 maz_ducal_chancery_bureaucracy_desc: "Пястовскую канцелярию Януш I перенес из Черского замка в Варшаву после принятия единоличного правления Восточным герцогством в 1413 году, откуда он с 1414 года передал большой корпус мазовецких привилегий. Канцелярия нанимала нотариусов Плоцкого капитула, прошедших кафедральное образование, поддерживала герцогскую печать, составляла мандаты и подтверждения, а также поставляла юридический персонал, который открывал книги окружных судов по всему Мазовии. После образования в 1526 году его персонал обустроил новое Мазовецкое воеводство, не нарушая административной рутины." #NT!
  
 # ===== BUREAUCRACY AUTHORITY ===== 
 AUTO_MODIFIER_NAME_nd_maz_bureaucracy_authority: "Бюрократическая власть Мазовии" #NT!
 AUTO_MODIFIER_DESC_nd_maz_bureaucracy_authority: "Провозглашение [MAZ.GetName] по линии кадетов Пястов устанавливает институциональный аппарат герцогства, унаследованный от Плоцка, Черска и Варшавы: статуты Сохачева, сеймики восточных округов, мазовецкие земельные судебные книги, соборный капитул в Плоцке и герцогскую канцелярию, перенесенную в Варшаву Янушем I. Два дополнительных бюрократических места предоставляются помимо столичного универсального. один." #NT!
