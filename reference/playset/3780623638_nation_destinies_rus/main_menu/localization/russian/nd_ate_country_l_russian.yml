 ATE: "Ашанти" #NT!
 ATE_ADJ: "Ашанти" #NT!
 ATE_f: "Конфедерация Ашанти" #NT!
 ATE_f_desc: "Конфедерация Ашанти объединила народы Акан под Золотой Табуреткой, создав могущественное королевство с центром в Кумаси. Благодаря контролю над торговлей золотом и сложной военной организации Асантехены могли распространять власть на Золотом Берегу и вглубь внутренней части Западной Африки." #NT!
