l_russian:
  
  # Shared National Destinies marker variable (set in every formation event). 
  # One key covers all formables; tooltip text for the hidden set_variable. 
 nd_formed_tt: "Национальная судьба сбылась" #NT!
  
  # === Governance advances === 
 nd_provincial_governance: "Провинциальное управление" #NT!
 nd_provincial_governance_desc: "Передать управление отдаленными внутренними провинциями дворянским поместьям. Открывает бюрократию управления провинцией, которая разрешает строительство провинциального поместья." #NT!
 nd_maritime_governance: "Морское управление" #NT!
 nd_maritime_governance_desc: "Распространите королевскую власть через воду на заморские гавани через назначенных портовых чиновников. Открывает бюрократию морского управления, которая позволяет построить командование порта." #NT!
  
  # === Governance bureaucracies === 
 nd_provincial_governance_bureaucracy: "Провинциальное управление" #NT!
 nd_provincial_governance_bureaucracy_desc: "Провинциальные поместья, укомплектованные дворянским персоналом, управляют отдаленными внутренними районами от имени короны, что позволяет построить одно провинциальное поместье. Провинции, финансируемые должным образом, находятся под контролем; испытывая нехватку ресурсов, дворянство позволяет внутренним регионам спуститься с поводка: сельский контроль рушится, сепаратизм растет, а восстание гноится." #NT!
 nd_maritime_governance_bureaucracy: "Морское управление" #NT!
 nd_maritime_governance_bureaucracy_desc: "Командование портов распространяет королевскую власть через воду на заморские гавани, что позволяет построить одно командование порта. Ухоженные, они обогащают казну и укомплектовывают флот; При недостаточном финансировании губернаторы портов становятся контрабандистами и пиратами, побережья становятся неуправляемыми, а торговля истекает кровью." #NT!
