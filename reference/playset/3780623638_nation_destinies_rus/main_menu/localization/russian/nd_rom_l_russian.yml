 AUTO_MODIFIER_NAME_nd_rom_bureaucracy_authority: "Римская имперская власть" #NT!
 AUTO_MODIFIER_DESC_nd_rom_bureaucracy_authority: "С образованием [ROM.GetName] унаследованные институциональные традиции римского сената, папской курии, болонских юристов и финансовой машины Рима становятся доступными в качестве переключаемой бюрократии восстановленной империи." #NT!
