l_russian:
 STATIC_MODIFIER_NAME_nd_rom_imperium_restitutum: "Империум Романум Реститутум" #NT!
 STATIC_MODIFIER_DESC_nd_rom_imperium_restitutum: "Римская империя была восстановлена ​​не как идея, а как реальность стали и закона. С семи холмов Рима орлы снова летают над владениями, простирающимися от океана до океана. Легионы снова маршируют (дисциплинированные, неустанные, непреодолимые), и мир вспоминает, что значит бросить вызов Риму. Универсальный закон связывает каждую провинцию с центром, и власть Императора не терпит разногласий." #NT!
 STATIC_MODIFIER_NAME_nd_rom_lux_aeterna: "Люкс Этерна" #NT!
 STATIC_MODIFIER_DESC_nd_rom_lux_aeterna: "Рим выживает не благодаря своим легионам, а благодаря тому, что он представляет. Быть римлянином — значит быть цивилизованным: знать законы, ценить знания, строить дороги и акведуки, которые переживут века. Эта восстановленная империя не просто завоевывает; оно трансформируется. Каждому народу, которого он касается, дается дар римской цивилизации, а взамен Рим впитывает в них все самое лучшее. Вечный свет Caput Mundi освещает мир." #NT!
 nd_rom.1.t: "SPQR: Сенат Народного Романа" #NT!
 nd_rom.1.d: "Это сделано. То, ради чего трудились столетиями амбиций, крови и преданности, теперь очевидно: Римская империя возродилась. Древняя резиденция Цезарей в Риме принадлежит нам. Стены Константинополя склоняются под наше знамя. Это владычество охватывает весь известный мир: от форумов, где Цицерон говорил, до гаваней, куда когда-то плавали корабли с зерном.\n\nСенат и народ Рима (эти древние слова, полузабытые в долгой темноте после падения) снова звучат в мраморных залах. Ученые плачут. Солдаты преклоняют колени перед орлами. Простой народ шепчет, что пророчество исполнилось: Рим вечен.\n\nНо восстановленная империя должна выбрать свою душу. Древние римляне знали два пути к величию, и вопрос, который отделял Цезаря от Августа, Траяна от Адриана, теперь стоит перед нами. Будет ли Рим править посредством непреодолимой силы своих легионов, наводя всеобщий порядок силой? Или же Рим будет править посредством непреодолимой силы своей цивилизации, заставляя все народы желать называть себя римлянами?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rom.1.a: "Орлы затмят каждый горизонт." #NT!
 nd_rom.1.b: "Пусть свет Рима освещает каждую землю." #NT!
  # ===== DESTINY LOCALIZATION ===== 
  
  # Variable tooltips 
 nd_rom_formed_tt: "была образована Римская империя" #NT!
 nd_rom_path_a_tt: "Выберите судьбу #bold Imperium Romanum Restitutum#!." #NT!
 nd_rom_path_b_tt: "Выбери судьбу #bold Lux Aeterna#!" #NT!
  
  # Destiny Root 
 nd_rom_destiny: "SPQR восстановлен" #NT!
 nd_rom_destiny_desc: "Римская империя возрождается. Стабилизируйте королевство и выберите путь, который определит этот новый Рим на века." #NT!
  
  # Path A: Imperium Romanum Restitutum 
 nd_rom_dest_pax_imposita: "Пакс Романа Импозита" #NT!
 nd_rom_dest_pax_imposita_desc: "Мир Риму не дан: он навязан. Распространите орлов за пределы старых границ. Священные города Аравии и германского Рейна должны подчиниться римской власти." #NT!
 nd_rom_dest_limes_ultimus: "Лаймс Ультимус" #NT!
 nd_rom_dest_limes_ultimus_desc: "Старые липы были линией отступления. Новые лаймы — это линия наступления. Расширьте границу до самого сердца России и высокогорья Персии. Пусть мир узнает, что нет такой земли, которой Рим не мог бы достичь." #NT!
 nd_rom_dest_orbis_terrarum: "Орбис Террарум" #NT!
 nd_rom_dest_orbis_terrarum_desc: "Обитаемый мир, orbis terrarum, — это Рим. От зеленых холмов Ирландии до базаров Самарканда, от новгородских лесов до пустынь Аравии — ни один уголок земли не находится вне досягаемости легионов." #NT!
  
  # Path B: Lux Aeterna 
 nd_rom_dest_renovatio_studii: "Реноватио Студии" #NT!
 nd_rom_dest_renovatio_studii_desc: "Обновление обучения. Банковские учреждения Рима и торговля шелком финансируют новый золотой век науки. Богатство цивилизации, а не меч, привяжет мир к Риму." #NT!
 nd_rom_dest_mare_mercator: "Маре Нострум Меркатор" #NT!
 nd_rom_dest_mare_mercator_desc: "Средиземное море снова стало поистине «нашим морем»: не как римское озеро военных кораблей, а как величайший рынок, который когда-либо знал мир. Римские печатные станки распространяли знания так же, как римские корабли распространяли товары." #NT!
 nd_rom_dest_caput_mundi: "Капут Мунди" #NT!
 nd_rom_dest_caput_mundi_desc: "Глава мира. Рим — это не просто город или даже империя: это источник самой цивилизации. Научная революция вытекает из римских академий. Каждая нация меряет себя по римскому стандарту." #NT!
  
  # Destiny Events 
 nd_rom.2.t: "Сенат созывает" #NT!
 nd_rom.2.d: "Впервые за более чем тысячу лет римский сенат собирается в своем древнем зале. В мраморных залах царит оживленная дискуссия, когда сенаторы, собранные со всех уголков этой возрожденной империи, обсуждают будущее Рима. Орлы были подняты. Вопрос теперь не в том, выстоит ли Рим, а в том, как он выживет." #NT!
 nd_rom.2.a: "Рома Этерна!" #NT!
  
 nd_rom.3.t: "Пакс Романа Импозита" #NT!
 nd_rom.3.d: "Легионы пересекли границы, о которых даже Траян только мечтал. Священные города Аравии пали. Германские племена за Рейном, эти вечные занозы на глазу Рима, наконец-то были подчинены. Римские форты теперь стоят там, где раньше не летал ни один римский орел. Первый этап нового завоевания завершен, и мир обращает внимание: это не церемониальная реставрация. Это Рим, каким он всегда должен был быть." #NT!
 nd_rom.3.a: "Орлы летят куда хотят." #NT!
  
 nd_rom.4.t: "За старыми границами" #NT!
 nd_rom.4.d: "Легионы достигли того, чего раньше не удавалось ни одной римской армии. Москва и Исфахан (города, которые древние римляне никогда не видели и даже не представляли себе) теперь несут римский штандарт. Граница простирается от замерзших лесов России до обожженных солнцем плато Персии.\n\nНо такая империя требует выбора в том, как организованы ее солдаты. Сохраним ли мы старую римскую традицию небольшой, в высшей степени дисциплинированной профессиональной армии? Или нам следует принять реальность наших обширных границ и расширить limitanei, систему пограничных гарнизонов, чтобы защищать каждую милю лаймов?" #NT!
 nd_rom.4.a: "Качество важнее количества. Тренируйте лучших." #NT!
 nd_rom.4.b: "Расширить пограничные гарнизоны." #NT!
  
 nd_rom.5.t: "Мир – это Рим" #NT!
 nd_rom.5.d: "Это сделано. От зеленых холмов Ирландии до древних перекрестков Самарканда, от замерзших рек Новгорода до обжигающих песков Аравии: все дороги ведут в Рим. orbis terrarum, круг известного мира, принадлежит римлянам.\n\nФилософы спорят, следует ли использовать это беспрецедентное господство для обеспечения постоянного мира, или же природа Рима требует вечного расширения. Легионы ждут приказов." #NT!
 nd_rom.5.a: "Наша сила гарантирует вечный мир." #NT!
 nd_rom.5.b: "Голод Рима никогда не сможет быть утолен." #NT!
  
 nd_rom.6.t: "Реноватио Студии" #NT!
 nd_rom.6.d: "Наступает новый золотой век обучения. Римские банки финансируют строительство великих библиотек и академий по всей империи. Ученые из всех провинций (греческие философы, египетские математики, персидские астрономы) собираются в Риме, чтобы поделиться своими знаниями. Шелк, который течет по римским рынкам, служит платой за рукописи, которые переживут империи. Это истинный дар Рима миру: не меч, а книга." #NT!
 nd_rom.6.a: "Пусть знание станет нашим величайшим завоеванием." #NT!
  
 nd_rom.7.t: "Римский рынок" #NT!
 nd_rom.7.d: "Средиземноморье, Mare Nostrum, бурлит торговлей, чего не было со времен расцвета старой империи. Римские торговые пути простирались от Атлантики до Индийского океана. Печатный станок, самое революционное из изобретений, распространяет римское право, римские знания и римские цены во все уголки известного мира.\n\nЭто беспрецедентное процветание поднимает вопрос: должен ли Рим инвестировать в своих ученых и университеты, создавая самую образованную цивилизацию, которую когда-либо видел мир? Или ему следует кодифицировать свое коммерческое право, сделав римские рынки стандартом, по которому оцениваются все остальные?" #NT!
 nd_rom.7.a: "Инвестируйте в ученых и университеты." #NT!
 nd_rom.7.b: "Кодификация римского коммерческого права." #NT!
  
 nd_rom.8.t: "Капут Мунди" #NT!
 nd_rom.8.d: "Рим — глава мира: не благодаря завоеваниям, а благодаря непреодолимой силе цивилизации. Научная революция, меняющая мир, исходит из римских академий. Каждая нация, желающая называться цивилизованной, принимает римские институты, римские законы, римские стандарты обучения.\n\nЭто цивилизационное превосходство предлагает Риму окончательный выбор. Примет ли он универсальный гуманизм, сделав все народы равными по римскому праву, независимо от вероисповедания? Или же оно расширит свою дипломатическую сеть, чтобы сделать Рим незаменимым арбитром всех наций, империей без конца, связанной не силой, а необходимостью?" #NT!
 nd_rom.8.a: "Универсальный гуманизм по римскому праву." #NT!
 nd_rom.8.b: "Империя без конца." #NT!
  
  # Timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_rom_dest_praetorian_discipline: "Преторианская дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_praetorian_discipline: "Армии Рима обучены до уровня совершенства, которому позавидовала бы древняя преторианская гвардия. Эти солдаты, менее многочисленные, но не имеющие себе равных по навыкам, удерживают границы благодаря чистому профессиональному совершенству." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_limitanei_expansion: "Расширение Лимитаней" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_limitanei_expansion: "Значительно расширена система пограничных гарнизонов. Каждую милю лип защищают оседлые солдаты-фермеры, прекрасно знающие свою территорию. Сепаратизм угасает там, где стоят легионы." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_pax_imperialis: "Пакс Империалис" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_pax_imperialis: "Мир в Риме абсолютен. Ни одна нация не осмелится бросить вызов империи, простирающейся по всему известному миру. Римские подданные лояльны, потому что не знают альтернативы, а подавляющая сила Рима делает сопротивление бесполезным." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_bellum_perpetuum: "Беллум Вечный" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_bellum_perpetuum: "Рим — это машина завоеваний, которую невозможно остановить. Война питает казну за счет грабежа, а казна финансирует новые войны. Этот цикл является самоподдерживающимся, хотя постоянные кампании приводят к постоянному росту цен." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_collegium_doctorum: "Коллегиум Докторум" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_collegium_doctorum: "Великие колледжи Рима являются предметом зависти всего мира. Ученые из каждой страны стремятся к поступлению, и знания, которые они производят, способствуют беспрецедентному процветанию. Стоимость содержания этих институтов означает меньше денег для легионов." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_lex_mercatoria: "Лекс Меркатория" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_lex_mercatoria: "Римское торговое право, Lex Mercatoria, является стандартом, согласно которому ведется вся торговля. Римские купцы пользуются непревзойденными преимуществами на каждом рынке, а римские торговые центры доминируют на экономическом ландшафте." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_universitas_romana: "Университет Романа" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_universitas_romana: "Римская университетская система достигла чего-то беспрецедентного: поистине универсального стандарта обучения и управления. Римский гуманизм учит, что все народы равны перед законом, хотя эта терпимость означает меньшее рвение к религиозному обращению." #NT!
 STATIC_MODIFIER_NAME_nd_rom_dest_imperium_sine_fine: "Империум Синус Файн" #NT!
 STATIC_MODIFIER_DESC_nd_rom_dest_imperium_sine_fine: "Империя без конца: древнее пророчество исполнилось, но посредством дипломатии, а не завоеваний. Рим — незаменимая нация, арбитр всех споров, центр всех союзов. Цена этого дипломатического превосходства – ослабление прямой королевской власти." #NT!
  
  # Building names and descriptions 
 nd_rom_castra_aeterna: "Кастра Этерна" #NT!
 nd_rom_castra_aeterna_desc: "Вечная крепость легионеров: постоянный военный объект, построенный по римским инженерным стандартам, с гарнизоном профессиональных солдат, которые живут и умирают на границе. Эти крепости распространяют римскую власть на огромные расстояния." #NT!
 nd_rom_forum_universale: "Универсальный форум" #NT!
 nd_rom_forum_universale_desc: "Грандиозный общественный центр, сочетающий в себе рынок, библиотеку и академию в римском стиле. Здесь купцы торгуют в соответствии с римским законодательством, а ученые учатся в римских университетах, создавая центр цивилизации, притягивающий весь мир к Риму." #NT!
  
  # Production method names 
 nd_rom_castra_maintenance: "Легионерский запас" #NT!
 nd_rom_castra_maintenance_desc: "Оружие, камень для стен и инструменты для инженеров, поддерживающих крепость в рабочем состоянии." #NT!
 nd_rom_forum_maintenance: "Администрация форума" #NT!
 nd_rom_forum_maintenance_desc: "Бумага для пластинок, ткань для украшения, стекло для окон и мрамор для колоннад." #NT!
  
 # ===== BUREAUCRACIES ===== 
 rom_senatus_renovatus_bureaucracy: "Сенат Романус Реноватус" #NT!
 rom_senatus_renovatus_bureaucracy_desc: "В Пятидесятницу 1144 года, после смерти Папы Иннокентия II, римское население под руководством Джордано Пьерлеони провозгласило renovatio senatus, избрав пятьдесят шесть сенаторов от Капитолия для управления городом вопреки папскому светскому правлению. Лангобардский реформатор Арнольд Брешиа стал интеллектуальным лидером коммуны и изгнал Папу Евгения III в изгнание в 1146 году, прежде чем его повесили в 1155 году. Варианты сенаторской коммуны сохранялись и в период позднего средневековья, закрепляя гражданско-аристократическое правительство против кардиналов." #NT!
 rom_curia_romana_bureaucracy: "Курия Романа" #NT!
 rom_curia_romana_bureaucracy_desc: "Созданная Папой Урбаном II (годы правления 1088-1099) по образцу Клюнийских монашеских правил и королевского совета Капетингов, Римская курия стала самым сложным административным судом латинского христианского мира. Священная коллегия кардиналов, собиравшаяся на регулярных консисториях, служила постоянным папским советом; Отделы канчеллярии, датарии и сигнатуры возглавлял кардинал. Канонические юристы, получившие образование в Болонье, такие как Хостиенсис, превратили Курию в континентальную координационную палату по церковным и политическим вопросам." #NT!
 rom_camera_apostolica_bureaucracy: "Камера Апостольская" #NT!
 rom_camera_apostolica_bureaucracy_desc: "Папская казна, возглавляемая Камерленго Священной Римской Церкви. Должность камерариуса была учреждена Папой Урбаном II и к середине XII века стала постоянным членом курии. После Иннокентия III (1198-1216) регулярное взимание налогов крестовых походов создало первую систему трансграничных доходов в Латинской христианском мире, а Камера способствовала переходу в 13 веке от платежей натурой к монетным деньгам по всей Средиземноморской Европе." #NT!
 rom_corpus_iuris_civilis_bureaucracy: "Корпус Юрис Цивилис" #NT!
 rom_corpus_iuris_civilis_bureaucracy_desc: "Повторное открытие и преподавание юридического сборника Юстиниана шестого века началось в Болонье в 1080-х годах, когда графиня Матильда Каносская пригласила юриста Ирнериуса (lucerna iuris) прочитать лекцию по Дигестам. Его школа глоссаторов основала то, что стало Болонским университетом в 1088 году, и образовавшаяся коммуна ius объединила римское и каноническое право в общую правовую грамматику Латинской Европы, заменив местные феодальные обычаи в торговых городах полуострова." #NT!
 rom_rota_romana_bureaucracy: "Сакра Рота Романа" #NT!
 rom_rota_romana_bureaucracy_desc: "Апостольский апелляционный суд возник на базе Audientia Sacri Palatii курии XII века и был официально оформлен 16 сентября 1331 года конституцией Папы Иоанна XXII Ratio iuris. Действующая сначала в Авиньоне, а затем в Апостольском дворце, коллегия ротных аудиторов стала высшим апелляционным судом латинского христианского мира как по церковным, так и по гражданским делам. Это старейший постоянно действующий суд в Европе." #NT!
 rom_banco_santo_spirito_bureaucracy: "Банко ди Санто Спирито" #NT!
 rom_banco_santo_spirito_bureaucracy_desc: "Основанный Папой Павлом V 13 декабря 1605 года в Палаццо дель Банко, построенном при Льве X на Виа дей Банки, Банк Святого Духа был первым центральным банком в Европе, действовавшим выше уровня города-государства. Подчиненный архиепископу Санто-Спирито (основан в 1201 г.), он был первым эмитентом бумажных денег в 1786 г. при Пии VI и оставался основным источником кредита для церковного и коммерческого строительства в папских государствах на протяжении почти четырех столетий." #NT!
 rom_pontifex_maximus_bureaucracy: "Великий Понтифик" #NT!
 rom_pontifex_maximus_bureaucracy_desc: "Титул главного первосвященника римской государственной религии, который принадлежал Августу и его преемникам до тех пор, пока Грациан не передал его в 383 году римскому епископу Дамасию. Скрытый для большей части средневекового папства, этот титул был возрожден в пятнадцатом веке папами-гуманистами (Николай V, Пий II и, прежде всего, Юлий II) как целенаправленная программа, представляющая римского понтифика как наследника императорского достоинства цезарей и объединяющая классическую древность с воинствующей церковью." #NT!
  
