l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_babur: "Меч Бабура" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_babur: "Империя Великих Моголов родилась в результате завоеваний. Бабур спустился с афганского нагорья с закаленной армией и желанием создать династию на равнинах Индостана. Этот дух неустанной военной экспансии сейчас наполняет наши армии, побуждая их завоевывать то, чего меньшие империи могли только желать." #NT!
 STATIC_MODIFIER_NAME_nd_light_of_akbar: "Свет Акбара" #NT!
 STATIC_MODIFIER_DESC_nd_light_of_akbar: "Там, где другие правят только мечом, Акбар понимал, что империя, охватывающая сотню народов, должна быть построена на чем-то более глубоком, чем страх. Его политика сульх-и-кул, всеобщего мира, сплела индуистов, мусульман, джайнов и зороастрийцев в единый имперский гобелен. Эта традиция синтеза теперь ведет наше царство к мудрости и процветанию." #NT!
 nd_mug.1.t: "Трон Великих Моголов" #NT!
 nd_mug.1.d: "Павлиний Трон стоит в собранном виде, его драгоценные камни отражают свет субконтинента, объединенного под нашим знаменем. Теперь наша власть простирается от заснеженных перевалов Гиндукуша до знойных равнин Ганга. Но что это будет за империя? Бабур победил с помощью грома и всадников: его наследие требует, чтобы мы всегда продвигались вперед, подчиняя всех, кто сопротивляется стандартам Великих Моголов. Тем не менее, Акбар показал другой путь: царство, где индуисты и мусульмане служат бок о бок, где Ибадат Хана отражает скорее дебаты, чем догмы. Выбор, стоящий перед нами, определит не только наше правление, но и душу самой империи.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mug.1.a: "Мы победим, как победил Бабур!" #NT!
 nd_mug.1.b: "Мы просветим, как просветил Акбар." #NT!
 nd_mug.2.t: "Гром Панипата" #NT!
 nd_mug.2.d: "Когда небольшая армия Бабура столкнулась с огромным войском Ибрагима Лоди у Панипата в 1526 году, он применил оружие, которое Индостан никогда не видел столь решительно: массированную полевую артиллерию за баррикадой из повозок. Слоны и кавалерия Лоди разбились о повозки, а пушки Великих Моголов прорвались сквозь их ряды. За одно утро Делийский султанат был разрушен. Наши военные ученые сейчас с новым усердием изучают тактику Бабура. Сможем ли мы овладеть огневой мощью, которая завоевала нам Индию, или усовершенствовать кавалерийскую атаку, которая проломила фланги Лоди?" #NT!
 nd_mug.2.a: "Пусть наши пушки сотрясут землю." #NT!
 nd_mug.2.b: "Пусть наши всадники прочесывают поле." #NT!
 nd_mug.3.t: "Сулх-и-Куль: Всеобщий мир" #NT!
 nd_mug.3.d: "В 1575 году император Акбар основал Ибадат-хану в Фатехпур-Сикри: Дом поклонения, где суннитские улемы дискутировали вместе с индуистскими браминами, джайнскими монахами, миссионерами-иезуитами и зороастрийскими священниками. В результате этих дискуссий возникла сульх-и-кул, доктрина Акбара о всеобщем мире. Он отменил джизью, назначил индусов на высшие мансабы и заявил, что ни один человек не должен подвергаться притеснениям из-за его веры. Ученые империи теперь бьются над последствиями. Должны ли мы принять эту радикальную толерантность в качестве нашей руководящей философии или направить энергию реформ на укрепление мускулов государства?" #NT!
 nd_mug.3.a: "Все религии найдут убежище под нашим сенью." #NT!
 nd_mug.3.b: "Реформа укрепит руку Падшаха." #NT!
 nd_mug.4.t: "Большая Магистральная Дорога" #NT!
 nd_mug.4.d: "Протянувшаяся более чем на две тысячи миль от Читтагонга в Бенгальском заливе до Кабула в афганском нагорье, Великая Магистральная Дорога является основой Империи Великих Моголов. Первоначально построенный Шер Шахом Сури и расширенный под властью Великих Моголов, он соединяет величайшие города империи (Дели, Агра, Лахор, Пешавар) через сеть сараев, караван-сараев и платных станций. Торговцы путешествуют по всему этому маршруту, привозя муслин из Дакки, специи из Гуджарата, лошадей из Центральной Азии и серебро из Бенгалии. Наши инженеры уже завершили значительные улучшения дорожной системы, создав сеть имперских перевалочных станций, которые ускоряют как торговлю, так и перемещение имперских указов." #NT!
 nd_mug.4.a: "Дорога связывает империю воедино." #NT!
 STATIC_MODIFIER_NAME_nd_mug_panipat_gunpowder: "Наследие Панипата: Огневая мощь" #NT!
 STATIC_MODIFIER_DESC_nd_mug_panipat_gunpowder: "Наш артиллерийский корпус продвигает разрушительные инновации, благодаря которым была выиграна битва при Панипате." #NT!
 STATIC_MODIFIER_NAME_nd_mug_panipat_cavalry: "Наследие Панипата: Всадники" #NT!
 STATIC_MODIFIER_DESC_nd_mug_panipat_cavalry: "Наша кавалерия воплощает в себе тактику быстрого окружения, которая разбила войско Лоди при Панипате." #NT!
 STATIC_MODIFIER_NAME_nd_mug_sulh_i_kul_peace: "Сулх-и-Куль: Мир со всеми" #NT!
 STATIC_MODIFIER_DESC_nd_mug_sulh_i_kul_peace: "Доктрина Акбара о всеобщей терпимости привлекает лояльность самых разных народов субконтинента." #NT!
 STATIC_MODIFIER_NAME_nd_mug_sulh_i_kul_reform: "Сулх-и-Куль: имперская реформа" #NT!
 STATIC_MODIFIER_DESC_nd_mug_sulh_i_kul_reform: "Энергия реформ Акбара была направлена ​​на укрепление имперской администрации и власти короны." #NT!
 nd_mug_timurid_legacy: "Тимуридское наследие" #NT!
 nd_mug_timurid_legacy_desc: "Моголы ведут свою родословную от Тимура и Чингисхана: наследие огромных завоеваний и имперских амбиций, которые сформировали их подход к управлению Индостаном." #NT!
 nd_mug_chagatai_court: "Чагатайская придворная культура" #NT!
 nd_mug_chagatai_court_desc: "Моголы принесли в Индию изысканную персидскую литературную традицию дворов Чагатая, основав космополитическую культуру поэзии, каллиграфии и куртуазного этикета." #NT!
 nd_mug_central_asian_horsemanship: "Среднеазиатское искусство верховой езды" #NT!
 nd_mug_central_asian_horsemanship_desc: "Степные традиции коневодства и конной войны, принесенные Моголами из Центральной Азии, дали им прочное преимущество на равнинах Индостана." #NT!
 nd_mug_persian_admin: "Персидское административное наследие" #NT!
 nd_mug_persian_admin_desc: "Бюрократия Великих Моголов во многом опиралась на персидские модели управления: систему диванов, отчеты о доходах от земли и профессиональный класс администраторов, писавших персидским шрифтом." #NT!
 nd_mug_sufi_devotion: "Суфийская религиозная традиция" #NT!
 nd_mug_sufi_devotion_desc: "Суфийские святые и их ханки служили мостами между исламом и разнообразным духовным ландшафтом Индии, привлекая верующих посредством преданности и поэзии, а не силы." #NT!
 nd_mug_gunpowder_revolution: "Пороховая революция Бабура." #NT!
 nd_mug_gunpowder_revolution_desc: "Решительное развертывание Бабуром полевой артиллерии османского типа в Панипате в 1526 году открыло новую эру пороховой войны на Индийском субконтиненте." #NT!
 nd_mug_karkhana_tradition: "Кархана Традиция" #NT!
 nd_mug_karkhana_tradition_desc: "Карханы Великих Моголов представляли собой императорские мастерские, производившие все, от парчового текстиля и украшений до оружия и седел, и все это под руководством Мир Самана." #NT!
 nd_mug_mansabdari_origins: "Система Мансабдари" #NT!
 nd_mug_mansabdari_origins_desc: "Система мансабдари Акбара присваивала числовые ранги (мансабы) военным и гражданским чиновникам, определяя их зарплату, воинские обязанности и статус в имперской иерархии." #NT!
 nd_mug_patronage_of_learning: "Покровительство обучению" #NT!
 nd_mug_patronage_of_learning_desc: "Двор Великих Моголов привлекал ученых, историков и ученых со всего исламского мира, финансируя переводы санскритских текстов на персидский язык и развивая астрономию, математику и медицину." #NT!
 nd_mug_miniature_painting: "Миниатюрная живопись Великих Моголов" #NT!
 nd_mug_miniature_painting_desc: "Школа миниатюрной живописи Великих Моголов сочетала персидскую точность с индийской живостью, создавая шедевры под патронажем императоров от Хумаюна до Шах-Джахана.\n\n#italic Доступно в: $nd_mug_karkhana$#!" #NT!
 nd_mug_urban_planning: "Городское планирование Великих Моголов" #NT!
 nd_mug_urban_planning_desc: "Моголы построили запланированные города (Фатехпур-Сикри, Шахджаханабад) с симметричными садами, общественными фонтанами, хаммамами и сложными системами управления водными ресурсами." #NT!
 nd_mug_barqandaz_corps: "Корпус Баркандаза" #NT!
 nd_mug_barqandaz_corps_desc: "Баркандазы были профессиональными мушкетерами с фитильными замками, часто набираемыми из определенных кланов и общин, которые составляли основу огневой мощи пехоты Великих Моголов." #NT!
 nd_mug_topkhana_corps: "Корпус Топхана" #NT!
 nd_mug_topkhana_corps_desc: "Топхана была централизованным имперским артиллерийским командованием, уникальным среди родов войск Великих Моголов, поскольку оно находилось непосредственно под контролем императора, а не было распределено между мансабдарами." #NT!
 nd_mug_revenue_reforms: "Реформы доходов" #NT!
 nd_mug_revenue_reforms_desc: "Министр финансов Акбара Тодар Мал представил систему забта: стандартизированную оценку доходов от земли, основанную на измеренных площадях и средней урожайности, заменяющую произвольную дань предсказуемым налогообложением." #NT!
 nd_mug_sulh_i_kul: "Сулх-и-Куль" #NT!
 nd_mug_sulh_i_kul_desc: "Принцип Акбара сульх-и-кул, мир со всеми, отменил налог джизья для немусульман, назначил индуистов на высокие посты и учредил Ибадат-хану для межконфессионального диалога." #NT!
 nd_mug_grand_trunk_road: "Гранд Транк Роуд" #NT!
 nd_mug_grand_trunk_road_desc: "Великая магистральная дорога протянулась более чем на 2500 километров от Читтагонга до Кабула, соединяя рынки империи через цепочку сараев, платных станций и караван-сараев." #NT!
 nd_mug_dhaka_muslin: "Дакка Муслин" #NT!
 nd_mug_dhaka_muslin_desc: "Муслины из Дакки были настолько тонкими, что их называли «тканым ветром»: один болт можно было протянуть через кольцо на пальце. Европейские торговцы заплатили целые состояния за эту ткань, которую не сможет повторить ни один ткацкий станок на Западе.\n\n#italic Доступно в: $nd_mug_sarai$#!" #NT!
 nd_mug_ahadi_guard: "Ахади Гвардия" #NT!
 nd_mug_ahadi_guard_desc: "Ахади были элитными солдатами-джентльменами, служившими личной охраной императора, отобранными за их навыки владения оружием и личной преданностью и не подчинявшимися ни одному мансабдару, кроме самого падшаха." #NT!
 nd_mug_mughal_engineering: "Могольская инженерия" #NT!
 nd_mug_mughal_engineering_desc: "От массивных стен форта Агры из красного песчаника до сложных водных каналов садов Шалимар, инженеры Великих Моголов освоили как военное укрепление, так и гидротехнику." #NT!
 nd_mug_jharokha_darshan: "Джарокха-и-Даршан" #NT!
 nd_mug_jharokha_darshan_desc: "Каждое утро император Великих Моголов появлялся у окна Джарокхи, чтобы принять собравшееся население: ритуал, который укреплял священную связь между правителем и подданным, несмотря на религиозные различия." #NT!
 nd_mug_banduqchi_reforms: "Реформы Бандукчи" #NT!
 nd_mug_banduqchi_reforms_desc: "Когда европейская военная организация проникла в Индию, более поздние командиры Великих Моголов приняли на вооружение более дисциплинированные мушкетерские формирования, бандукчи, обученные залповому огню и скоординированному маневрированию." #NT!
 nd_mug_textile_empire: "Текстильная империя Великих Моголов" #NT!
 nd_mug_textile_empire_desc: "К XVIII веку на долю индийского текстиля приходилось примерно четверть мирового промышленного производства. Мастерские Великих Моголов производили шелковую парчу, тонкий муслин, ситец и бязь, которые одевали Европу, Африку и Юго-Восточную Азию.\n\n#italic Доступно в: $nd_mug_sarai$#!" #NT!
 nd_mug_provincial_autonomy: "Провинциальное управление" #NT!
 nd_mug_provincial_autonomy_desc: "Навабы, низамы и субадары, которые управляли провинциями Великих Моголов, создавали все более сложные местные администрации: палка о двух концах, которая поддерживала порядок, одновременно обеспечивая возможную автономию." #NT!
 nd_mug_renaissance_of_letters: "Ренессанс письма" #NT!
 nd_mug_renaissance_of_letters_desc: "Даже когда военная мощь империи пошла на убыль, ее литературные и научные традиции процветали: поэзия урду, персидские истории и арабские богословские труды продолжали выходить при дворах Великих Моголов и в медресе." #NT!
 nd_mug_indigo_opium_trade: "Индиго и торговля опиумом" #NT!
 nd_mug_indigo_opium_trade_desc: "Плантации индиго в Индии Великих Моголов и производство опиума стали основными экспортными отраслями промышленности, питая европейские текстильные красители и расширяющийся азиатский рынок опиума через порты Сурат и Калькутта." #NT!
 a_nd_mug_barqandaz: "Баркандаз" #NT!
 a_nd_mug_barqandaz_desc: "Профессиональные мушкетеры с фитильными замками, набранные из специализированных сообществ, баркандазы составляли огневую основу пехоты Великих Моголов. Их ровные залпы прикрывали продвижение императорской кавалерии." #NT!
 a_nd_mug_barqandaz_levy: "Баркандаз Леви" #NT!
 a_nd_mug_barqandaz_levy_desc: "Набранная пехота с фитильными ружьями, взятая из мушкетерских традиций империи." #NT!
 a_nd_mug_topkhana: "Топхана" #NT!
 a_nd_mug_topkhana_desc: "Имперская Топхана представляла собой артиллерийский корпус Великих Моголов: тяжелые бронзовые и железные пушки, укомплектованные специализированными артиллеристами под прямым имперским командованием, разрушительные как в осаде, так и в полевых условиях." #NT!
 a_nd_mug_ahadi: "Ахади Гвардия" #NT!
 a_nd_mug_ahadi_desc: "Элитная домашняя кавалерия, присягнувшая лично императору, Ахади представляла собой солдат-джентльменов, отобранных за боевые навыки и преданность, служивших ударной кавалерией в бою и конной охраной императора." #NT!
 a_nd_mug_ahadi_levy: "Ахади Леви" #NT!
 a_nd_mug_ahadi_levy_desc: "Набрана кавалерия императорской гвардии традиции Ахади." #NT!
 a_nd_mug_banduqchi: "Бандукчи" #NT!
 a_nd_mug_banduqchi_desc: "Реформированная мушкетерская пехота, обученная залповому огню в европейском стиле и линейной тактике, бандукчи представляла собой адаптацию вооруженных сил Великих Моголов к меняющемуся характеру войны в 18 веке." #NT!
 nd_mug_karkhana: "Императорская Кархана" #NT!
 nd_mug_karkhana_desc: "Государственная мастерская по производству роскошного текстиля, изделий из металла и вооружения под императорским надзором. Система карханы централизовала ремесленное производство для двора и армии." #NT!
 nd_mug_karkhana_maintenance: "Кархана Операции" #NT!
 nd_mug_karkhana_maintenance_desc: "Императорская мастерская ткет из шелка, красителей и ткани изысканные ткани для двора и экспорта." #NT!
 nd_mug_sarai: "Императорский Сарай" #NT!
 nd_mug_sarai_desc: "Укрепленная перевалочная станция вдоль сети имперских дорог, предоставляющая приют, свежих лошадей и доступ к рынку торговцам и официальным курьерам, путешествующим по Великой Магистральной дороге." #NT!
 nd_mug_sarai_maintenance: "Содержание Сарай" #NT!
 nd_mug_sarai_maintenance_desc: "Обеспечение путешественников скотом, зерном и солью, а также содержание путевых станций на императорской дороге." #NT!
 nd_mug_maktab: "Мактаб" #NT!
 nd_mug_maktab_desc: "Начальная исламская школа, где дети учатся читать Коран, изучают персидскую грамматику и получают базовые инструкции по арифметике и каллиграфии: основа грамотности Великих Моголов." #NT!
 nd_mug_maktab_maintenance: "Мактаб Операции" #NT!
 nd_mug_maktab_maintenance_desc: "Обеспечение бумагой, книгами и свечами из пчелиного воска для продолжения учебы в школе." #NT!
 nd_mug_hammam: "Императорский Хаммам" #NT!
 nd_mug_hammam_desc: "Общественная баня в персидской традиции, служащая одновременно местом гигиены и социальным учреждением, где смешивались все классы: отличительная черта городской цивилизации Великих Моголов." #NT!
 nd_mug_hammam_maintenance: "Хаммам Операции" #NT!
 nd_mug_hammam_maintenance_desc: "Отопление бани дровяным топливом, очистка солью, снабжение глиняной посудой для купания." #NT!
 nd_mug_topkhana_arsenal: "Топхана Арсенал" #NT!
 nd_mug_topkhana_arsenal_desc: "Централизованное предприятие по литью пушек, производству огнестрельного оружия и хранению пороха: логистическая основа грозной артиллерийской армии империи Великих Моголов." #NT!
 nd_mug_topkhana_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_mug_topkhana_arsenal_maintenance_desc: "Продолжающееся производство и хранение имперских артиллерийских орудий и боеприпасов." #NT!
 nd_mug_muslin_weaving: "Муслиновое плетение" #NT!
 nd_mug_muslin_weaving_desc: "Легендарное производство тонкого текстиля в Индии Великих Моголов, производившее настолько тонкую ткань, что ее называли «тканой ветром»." #NT!
 nd_mug_parchin_kari: "Парчин Кари" #NT!
 nd_mug_parchin_kari_desc: "Искусство Великих Моголов инкрустации мрамора полудрагоценными камнями: техника создания потрясающих декоративных панелей Тадж-Махала и других имперских памятников." #NT!
 nd_mug_zarb_khana: "Императорская Зарб-хана" #NT!
 nd_mug_zarb_khana_desc: "Имперский монетный двор, где чеканились стандартные монеты Великих Моголов из золота, серебра и меди: основа денежной системы, которая способствовала торговле на всем субконтиненте." #NT!
 nd_mug_zarb_khana_maintenance: "Чеканка монет" #NT!
 nd_mug_zarb_khana_maintenance_desc: "Обработка серебра и меди с помощью ударных инструментов для производства стандартизированной имперской валюты." #NT!
 nd_mug_silk_brocade: "Плетение шелковой парчи" #NT!
 nd_mug_silk_brocade_desc: "Роскошное производство шелковой парчи, переплетенной золотой и серебряной нитью, с использованием специальных инструментов и красок: отличительная черта придворной моды Великих Моголов и ценный экспортный товар." #NT!
 levy_nd_mug_ahadi: "Ахади Страж Леви" #NT!
 levy_nd_mug_ahadi_desc: "Элитная домашняя кавалерия, набранная по традиции Ахади: солдаты-джентльмены, присягнувшие непосредственно императору, служащие одновременно телохранителями и ударной кавалерией." #NT!
 levy_nd_mug_barqandaz: "Баркандаз Леви" #NT!
 levy_nd_mug_barqandaz_desc: "Мушкетеры с фитильными ружьями, набранные из общин баркандазов империи: устойчивая огневая мощь пехоты, которая укрепляла боевые линии Великих Моголов." #NT!
 nd_mug_formed_tt: "Империя Великих Моголов была образована" #NT!
 nd_mug_path_a_tt: "Выбрать Меч Бабура" #NT!
 nd_mug_path_b_tt: "Выбрал Свет Акбара" #NT!
 nd_mug_destiny: "Судьба Великих Моголов" #NT!
 nd_mug_destiny_desc: "Была провозглашена Империя Великих Моголов. Независимо от того, идем ли мы по пути завоевания или просвещения, сначала необходимо обеспечить стабильность королевства, прежде чем мы сможем определить его судьбу." #NT!
 nd_mug_dest_deccan: "Подчинить Декан" #NT!
 nd_mug_dest_deccan_desc: "Деканские султанаты Голконда и Биджапур представляют собой независимые державы на нашей южной границе. Чтобы выполнить завоевательное наследие Бабура, мы должны подчинить их стандарту Великих Моголов и обеспечить богатство юга." #NT!
 nd_mug_dest_bengal: "Покорить Бенгалию" #NT!
 nd_mug_dest_bengal_desc: "Богатая дельта Бенгалии (Сонаргаон, Читтагонг) контролирует доступ к Бенгальскому заливу и производит лучшие в мире ткани. Империя-завоеватель должна захватить это богатство." #NT!
 nd_mug_dest_timur: "Верните Тимуридское сердце" #NT!
 nd_mug_dest_timur_desc: "Бабур оплакивал Самарканд, драгоценность, потерянную его семьей. Конечная цель династии Великих Моголов — вернуть себе исконные столицы Тимуридов (Самарканд, Герат и Кандагар) и объединить империю Тимура с империей Индостана." #NT!
 nd_mug_dest_gujarat: "Жемчужина Гуджарата" #NT!
 nd_mug_dest_gujarat_desc: "Гуджарат и его крупный порт Сурат являются воротами в торговлю в Индийском океане. Обеспечение безопасности этого региона и распространение шелка на наших рынках заложат коммерческую основу для процветающей империи." #NT!
 nd_mug_dest_workshop: "Мастерская Мира" #NT!
 nd_mug_dest_workshop_desc: "Индия производит четверть мировых промышленных товаров. Чтобы реализовать этот потенциал, империя должна использовать современные финансовые институты и развивать свои обширные территории, выходя за рамки простой добычи." #NT!
 nd_mug_dest_padshah: "Падшах-и-Хинд" #NT!
 nd_mug_dest_padshah_desc: "Титул Падшаха-и-Хинда, Императора всей Индии, остается желанным до тех пор, пока указ Великих Моголов не распространится от Малабарского побережья до кончика субконтинента. Мадурай и Кожикоде должны признать наше превосходство." #NT!
 nd_mug.5.t: "Судьба Великих Моголов" #NT!
 nd_mug.5.d: "Трон Великих Моголов в безопасности, в королевстве мир. От Дели до Лахора, от Агры до горных перевалов наше слово — закон. Но великая империя не стоит на месте: она растет или угасает. Вопрос сейчас не в том, будем ли мы действовать, а в том, в каком направлении нас поведут наши амбиции." #NT!
 nd_mug.5.a: "Наша судьба ждет." #NT!
 nd_mug.6.t: "Декан подчинился" #NT!
 nd_mug.6.d: "Султанаты Декана, эти гордые остатки королевства Бахмани, наконец оказались под властью Великих Моголов. Голконда с ее алмазными рудниками и Биджапур с плодородными полями теперь отдают дань Павлиньему трону. Наши армии доказали, что горные барьеры центральной Индии не являются защитой от решимости Великих Моголов." #NT!
 nd_mug.6.a: "Юг преклоняет колени." #NT!
 nd_mug.7.t: "Завоевание Бенгалии" #NT!
 nd_mug.7.d: "Бенгалия пала в руки Великих Моголов. Дельта великой реки (источник лучшего муслина, богатейших урожаев риса и выхода к восточным морям) принадлежит нам. Наши генералы сейчас обсуждают, как лучше всего закрепить эти завоевания. Некоторые выступают за железный кулак: агрессивную экспансию, подпитываемую военными трофеями. Другие советуют строить военные дороги и цепочки поставок, которые обеспечат дальнейшие кампании на огромных расстояниях империи." #NT!
 nd_mug.7.a: "Пусть меч говорит за империю." #NT!
 nd_mug.7.b: "Стройте дороги, которые питают армии." #NT!
 nd_mug.8.t: "Возвращение в Самарканд" #NT!
 nd_mug.8.d: "Наконец, император Великих Моголов стоит на Регистане Самарканда, исполняя мечту, которую Бабур унес в свою могилу. Земли предков Тимура, от минаретов Герата до крепости Кандагара, снова несут знамя Великих Моголов. Это вершина империи, союз двух миров: утонченная цивилизация Индостана соединилась с военным наследием Центральной Азии. Как мы будем использовать эту беспрецедентную силу?" #NT!
 nd_mug.8.a: "Мы – завоеватели мира." #NT!
 nd_mug.8.b: "Мы — императоры эпохи." #NT!
 nd_mug.9.t: "Гуджарат обеспечен" #NT!
 nd_mug.9.d: "Порт Сурат теперь соответствует стандартам Великих Моголов, и вместе с ним торговля Аравийского моря поступает в нашу казну. Торговые сообщества Гуджарата (индуистские баниасы, мусульманские бохры, торговцы-парсы) доставляют товары со всего мира к нашему порогу. Шелк, специи и серебро переходят из рук в руки на оживленных рынках, которые приносят богатство, превосходящее то, что можно было бы получить в одиночку." #NT!
 nd_mug.9.a: "Богатства мира проходят через наши руки." #NT!
 nd_mug.10.t: "Асцендент Мастерской" #NT!
 nd_mug.10.d: "Индийские ремесленники и торговцы превратили Империю Великих Моголов в производственный центр известного мира. Наши ткани одевают Европу и Африку, наши краски индиго окрашивают их ткани, а наши специи приправляют их столы. Вопрос в том, как лучше всего воспитать это экономическое чудо. Должны ли мы продолжать культурный синтез: привлекать к себе на службу лучшие умы всех традиций? Или мы должны расширить возможности наших ремесленных гильдий и открыть наши рынки для всего мира?" #NT!
 nd_mug.10.a: "Синтез всех традиций под нашей крышей." #NT!
 nd_mug.10.b: "Пусть наши ремесленники свободно торгуют со всем миром." #NT!
 nd_mug.11.t: "Падшах-и-Хинд" #NT!
 nd_mug.11.d: "От заснеженных перевалов Кашмира до окаймленного пальмами побережья Малабара, от базаров Сурата до храмов Мадурая: весь индийский субконтинент признает императора Великих Моголов Падшах-и-Хиндом, императором всей Индии. Ни одно государство в мире не обладает таким богатством, таким разнообразием народов и такой глубиной цивилизации. Суд Великих Моголов сейчас обсуждает, как освятить это достижение. Построим ли мы империю духовной гармонии, где под нашей защитой процветают все религии? Или мы станем великим рынком мира, куда все народы приходят торговать?" #NT!
 nd_mug.11.a: "Империя гармонии под небесами." #NT!
 nd_mug.11.b: "Рынок всех наций." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_iron_fist: "Железный кулак" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_iron_fist: "Импульс завоеваний ведет нас вперед. Войны объявляются быстро, и истощение кампаний менее тяжело сказывается на людях, привыкших к победам." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_iron_road: "Железная дорога" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_iron_road: "Военные дороги и склады снабжения обеспечивают поддержку наших армий на огромных расстояниях, хотя упор на логистику оставляет меньше места для дипломатических тонкостей." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_conqueror: "Завоеватель мира" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_conqueror: "Военная машина Великих Моголов действует с разрушительной эффективностью: штурмует крепости, добивается преимуществ и доводит сражения до быстрого завершения." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_emperor: "Император эпохи" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_emperor: "Огромные масштабы и административный охват империи позволяют ей выставлять на вооружение огромные армии, сводя к минимуму потери при проведении кампаний на разнообразной территории." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_synthesis: "Имперский Синтез" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_synthesis: "Двор Великих Моголов привлекает ученых, художников и мистиков всех традиций, распространяя культурное влияние по всему региону: хотя поддержание этого космополитического двора обходится недешево." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_artisans: "Ремесленная свобода" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_artisans: "Освободившись от ограничительной монополии гильдий, ремесленники Великих Моголов занимаются инновациями и открыто торгуют, способствуя восстановлению и росту рынков империи." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_golden_age: "Золотой век гармонии" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_golden_age: "Империя Великих Моголов является маяком межконфессиональной гармонии. Под защитой императора мечети, храмы и церкви процветают бок о бок, привлекая новообращенных посредством убеждения, а не принуждения." #NT!
 STATIC_MODIFIER_NAME_nd_mug_dest_world_market: "Мировой рынок" #NT!
 STATIC_MODIFIER_DESC_nd_mug_dest_world_market: "Империя Великих Моголов стала центром глобальной торговли, управляя обширными торговыми сетями, требующими сложных финансовых инструментов. И затраты, которые с ними связаны." #NT!
 nd_mug_elephant_battery: "Батарея боевых слонов" #NT!
 nd_mug_elephant_battery_desc: "Общевойсковой комплекс, где боевые слоны тренируются вместе с артиллерийскими расчетами, создавая разрушительные артиллерийские платформы, установленные на слонах, которые были отличительной чертой военных инноваций Великих Моголов." #NT!
 nd_mug_elephant_battery_maintenance: "Содержание слоновой батареи" #NT!
 nd_mug_elephant_battery_maintenance_desc: "Содержание боевых слонов, их бронированных хауда, пушек, которые они несут, и кожаных упряжей, связывающих все это воедино." #NT!
 nd_mug_diwan_i_am: "Диван-и-Ам" #NT!
 nd_mug_diwan_i_am_desc: "Зал общественных аудиенций: большой павильон, где император восседает на возвышенном троне, чтобы вершить правосудие, принимать петиции и демонстрировать великолепие суверенитета Великих Моголов всем, кто предстает перед Павлиньим троном." #NT!
 nd_mug_diwan_i_am_maintenance: "Работа зрительского зала" #NT!
 nd_mug_diwan_i_am_maintenance_desc: "Поддержание великолепия императорского зала аудиенций с помощью прекрасного текстиля, административных записей, резной мебели и ароматных благовоний." #NT!
 mug_mansabdari_bureaucracy: "Мансабдари" #NT!
 mug_mansabdari_bureaucracy_desc: "Высокопоставленная военная аристократия Акбара, учрежденная в 1574 году и усовершенствованная при Шах-Джахане и Аурангзебе. Каждый офицер империи имеет двойное звание: зат (его личный оклад) и савар (кавалерийский контингент, который он обязан содержать), причем звания варьируются от десяти тысяч мансабдаров до семитысячных великих командиров. Эта система объединяет традиции персидских и тюркских отрядов с централизованно оплачиваемым государством, превращая всю знать в сменяемых, передаваемых и увольняемых офицеров трона. Его упадок в конце семнадцатого века (раздутые рулоны бумаги, нехватка джагиров, фракция при дворе) — это хрестоматийная история краха позднемогольской эпохи." #NT!
 mug_dahsala_bureaucracy: "Поселение Дахсала" #NT!
 mug_dahsala_bureaucracy_desc: "Десятилетняя система доходов Раджи Тодара Мала, Айн-и-Дахсала, обнародованная в 1582 году, фиксирует земельный налог на десятилетие на основе средней урожайности за предыдущие десять лет, выраженной в серебряных плотинах и конвертированной в рупии. Это первое на субконтиненте единообразное, централизованно проверяемое и основанное на наличных деньгах исследование доходов, измеряемое на местах карори (агентами короны, которые исследуют активы в бигхах имперского стандарта). Предсказуемая оценка подрывает переговорную силу заминдаров и в обязательном порядке питает имперскую казну, но оставляет крестьянский райат во власти жесткого серебряного графика, когда урожай неурожай." #NT!
 mug_diwan_i_khalsa_bureaucracy: "Диван-и-Хальса" #NT!
 mug_diwan_i_khalsa_bureaucracy_desc: "Сокровищница земель императорской короны, отличная от Диван-и-Тана, который выплачивает зарплату мансабдару. Территория Хальсы находится в прямом владении (никогда не выделялась в качестве джагира), а доходы перетекают прямо в имперскую хазану под контролем Диван-и-Ала. Акбар резко расширил долю халсы за счет уступок; Войны Аурангзеба в Декане меняют эту тенденцию, лишая хальсу голода, чтобы обеспечить выполнение обязательств джагира. Размер хальсы как части королевства является прямым показателем соотношения центральной и аристократической власти, и умара это знают." #NT!
 mug_jagirdari_bureaucracy: "Джагирдари" #NT!
 mug_jagirdari_bureaucracy_desc: "Передача прав на получение дохода от участка земли мансабдару вместо денежной зарплаты, передаваемой по усмотрению императора, обычно каждые три-четыре года. По замыслу Акбари, джагиры никогда не передаются по наследству; ротация не позволяет знати пустить корни на местном уровне и держит умара в зависимости от продолжающейся благосклонности трона. К концу периода Аурангзеба империя имела больше мансабдаров, чем можно было назначить джагиров, и кризис беджагири породил фракционность, поглотившую восемнадцатый век. Система вознаграждает дворянский класс, одновременно перекладывая затраты на чрезмерную добычу на крестьян хозяйства, которое правопреемник вскоре покинет." #NT!
 mug_mir_bakshi_bureaucracy: "Офис Мира Бакши" #NT!
 mug_mir_bakshi_bureaucracy_desc: "Генеральный казначей империи, глава Диван-и-Арза, который поддерживает даг (клеймение лошади) и чехру (описательный список каждого солдата и его скакуна), на которые опирается система, чтобы удержать мансабдаров от предоставления одолженных лошадей при сборе. Мир Бакши проверяет каждый офицерский контингент, руководит имперской разведывательной службой вакиа-навис (писателей событий), ежедневно сообщающих о каждом суба, и представляет офицеров императору для повышения по службе. Функционирующий Мир Бакши — это разница между армией, которую обещают бумажные рулоны, и армией, которую трон действительно может выставить в Панипате." #NT!
 mug_karkhana_bureaucracy: "Императорский Карханас" #NT!
 mug_karkhana_bureaucracy_desc: "Сеть государственных мануфактур (на момент смерти Акбара их было тридцать восемь, согласно «Айн-и-Акбари» Абу'л-Фазла), производящих оружие, доспехи, изысканные ткани, ювелирные изделия, иллюминированные рукописи и великолепные придворные товары, которые определяют величие Великих Моголов. Буютат-и-Хас управляет ими под руководством Хан-и-Самана, хозяина императорского дома; ткачи из Гуджарата, каллиграфы из Ирана и огранщики драгоценных камней из Голконды привозятся в Агру и Дели, чтобы укомплектовать их штатами. Карханы стандартизируют качество по всей империи и поглощают лучшие руки с базаров, но их привилегированные контракты на поставку и нанятые мастера вытесняют свободные городские гильдии Индостана." #NT!
 mug_sadr_us_sudur_bureaucracy: "Садр-ус-Судур" #NT!
 mug_sadr_us_sudur_bureaucracy_desc: "Главный садр империи, верховный судья в вопросах исламского права и надзиратель за существованием Мадад-и-Мааша предоставляет: бесплатную землю ученым, сайидам, мечетям и медресе, а после реформ Акбара также индуистским храмам и джайнским аскетам. При Акбаре и Джахангире этот офис является орудием политики сульх-и-кул ​​(всеобщий мир), распределяя покровительство немусульманскому духовенству наряду с улемами. При Аурангзебе оно возвращается к более строгой ханафитской ориентации, отозвав многие прежние гранты. Уровень терпимости садра напрямую определяет отношения империи с ее индуистскими, джайнскими, сикхскими и христианскими подданными." #NT!
 mug_jharokha_i_darshan_bureaucracy: "Джарокха-и-Даршан" #NT!
 mug_jharokha_i_darshan_bureaucracy_desc: "Ежедневный ритуал публичного выступления, установленный Акбаром в восточной джарокхе, решетчатом окне императорского дворца с видом на Ямуну в Агре. Каждый рассвет падшах предстает перед собравшейся толпой, мгновенно вершит правосудие по петициям, поступившим от толпы, и своей регулярной видимостью демонстрирует, что трон жив, наблюдателен и доступен. Аурангзеб приостанавливает эту практику на одиннадцатом году своего правления как неисламское проявление квазибожества; современники отмечают приостановку как момент утраты троном своей прямой связи с народом. Ритуал полностью игнорирует иерархию вакиль и умара." #NT!
 AUTO_MODIFIER_NAME_nd_mug_bureaucracy_authority: "Императорские диваны Индостана" #NT!
 AUTO_MODIFIER_DESC_nd_mug_bureaucracy_authority: "Падшах Великих Моголов командует самым сложным административным аппаратом на субконтиненте: многоуровневой системой диванов, бахши и садров, усовершенствованной от Акбара до Аурангзеба. Трон может учредить до трех великих бюрократий Великих Моголов в дополнение к тем, кто проживает в столице империи, выбирая, какая институциональная рука будет управлять Индостаном." #NT!
