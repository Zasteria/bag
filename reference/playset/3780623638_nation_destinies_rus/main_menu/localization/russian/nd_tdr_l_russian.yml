l_russian:
  # ============================================================ 
  # Country name overrides (set via change_country_name) 
  # ============================================================ 
 TDR_REGNUM: "Регнум Боспори" #NT!
 TDR_REGNUM_ADJ: "Царственный Боспор" #NT!
 TDR_CIMMERIAN: "Царство Киммерийского Боспора" #NT!
 TDR_CIMMERIAN_ADJ: "Киммерийский" #NT!
  
  # ============================================================ 
  # Variable tooltips (referenced by hidden_effect set_variable lines) 
  # ============================================================ 
 nd_tdr_formed_tt: "Образовано Боспорское царство." #NT!
 nd_tdr_path_a_tt: "Выбрал Regnum Bospori." #NT!
 nd_tdr_path_b_tt: "Выбрал Киммерийский Боспор" #NT!
  
  # ============================================================ 
  # Formation event nd_tdr.1 
  # ============================================================ 
 nd_tdr.1.t: "Наследник Понтийского берега" #NT!
 nd_tdr.1.d: "После нескольких поколений удержания скальной крепости Мангуп против генуэзцев, татар и османов, наши князья созывают совет. Под их владениями спят кости двух государств: древнего Боспорского царства Спартокидов, греческого полиса, основанного на Киммерийском проливе двадцать столетий назад, и крымско-готского княжества Феодоро, защищавшего понтийское православие со времен Юстиниана I.\n\nКакое наследие новое царство должно чтить как свою основополагающую выдумку? Суд раскололся. Греческие архонты выступают за римский Regnum Bospori, наследника Евпатора и Митридата, который мог бы говорить с Константинополем и Венецией на равных. Готские приматы и династы скальных деревень спорят за Киммерийский Боспор Иоанна Готского, горное царство смешанных народов, связанных православной верой и железом Мангупа.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tdr.1.a: "Regnum Bospori: наследники Митридата и Рима" #NT!
 nd_tdr.1.b: "Боспор Киммерийский: царство горных народов" #NT!
  
  # ============================================================ 
  # Formation timed modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_tdr_regnum_bospori: "Регнум Боспори" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_regnum_bospori: "Двор объявляет себя наследником древних боспорских царей и позднеримского протектората над киммерийским побережьем. В Мангупе собираются средиземноморские дипломаты и православные купцы." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_cimmerian_bosporus: "Киммерийский Боспор" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_cimmerian_bosporus: "Гот, Грек, Алан и Половец вместе ругаются на скале Мангуп. Горные гарнизоны держат приграничное королевство, открытое для всех, кто исповедует понтийское православие." #NT!
  
  # ============================================================ 
  # DHE event nd_tdr.2: The Cliff of Mangup 
  # ============================================================ 
 nd_tdr.2.t: "Утес Мангуп" #NT!
 nd_tdr.2.d: "Наши каменщики поднимаются по козлиным тропам на плато над Хоросом и Табана-Дере, отмечая линию великой Юстиниановой куртины. Циклопические камни все еще находятся на том месте, где инженеры василевса Юстиниана I заложили их в 540-х годах; С тех пор здесь укрылись целые поколения беженцев. Новые укрепления удваивают куртину, поднимают бастионы Табана-Дере и размещают постоянный гарнизон в Восьмиугольной Цитадели над кварталом Караимов.\n\nВ цистернах и высеченных в скалах казармах задается вопрос: будет ли скала воротами, удерживающими линию, где готы и греки встречаются со степью, или очагом, убежищем, ворота которого открыты для всех, кто набегает в гору?" #NT!
 nd_tdr.2.a: "Держите линию: скальные укрепления и постоянный гарнизон" #NT!
 nd_tdr.2.b: "Откройте ворота: приют для беженцев из степи и моря" #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_cliff_garrison: "Клифф Гаррисон Мангупа" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_cliff_garrison: "Постоянные гарнизоны в скальных крепостях превращают нагорье в смертельную ловушку для любого захватчика, пытающегося подняться." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_refugee_haven: "Клифф-Убежище" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_refugee_haven: "Плато собирает беженцев от набегов и голода, смешивая народы и заселяя равнинные деревни." #NT!
  
  # ============================================================ 
  # DHE event nd_tdr.3: The Komnenoid Inheritance 
  # ============================================================ 
 nd_tdr.3.t: "Комненоидное наследование" #NT!
 nd_tdr.3.d: "Суд Габраса в Мангупе поручает провести генеалогию, прослеживающуюся через Комненодукаев: от основателя Деметриоса Палеолога-Габраса, обратно через понтийских комнинов Трапезунда и, наконец, назад к Алексиосу I и самому императорскому дому Константинополя. Линия по крови или по усыновлению остается написанной.\n\nСуд должен решить, как ею распорядиться. Некоторые выступают за то, чтобы закрепить притязания императорскими церемониями, облачив мангупских князей в пурпур в качестве мелких василей, проецируя внутренний престиж. Другие утверждают, что это валюта, которая будет потрачена на двоюродные браки с трапезунтинскими Комнинами, токками Эпира, крымскотатарской знатью и итальянскими домами на понтийском побережье." #NT!
 nd_tdr.3.a: "Оденьте принцев в императорский пурпур." #NT!
 nd_tdr.3.b: "Женитесь на линии во всех дворах Понтийского побережья." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_purple_lineage: "Фиолетовая родословная" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_purple_lineage: "Мангупский двор ритуализирует свое происхождение от Комнинов как небольшую римскую базилею." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dynastic_marriages: "Династические браки" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dynastic_marriages: "Феодоритские принцессы выходят замуж за татарских, итальянских и понтийских греческих дворов, сплетая королевство в паутину кузенов." #NT!
  
  # ============================================================ 
  # DHE event nd_tdr.4: The Tauric Emporion 
  # ============================================================ 
 nd_tdr.4.t: "Эмпорион Таврический" #NT!
 nd_tdr.4.d: "Херсон, Кафа, Солдая, Авлита: снова гудят портовые города Таврического побережья. Генуэзские галеры перевозят зерно, венецианские караки — икру и пчелиный воск, татарские караваны — русские меха и рабов, направляющихся на рынки Каира. Таможенники боспорского царя сидят во фундуке в Каффе вместе со своими греческими писцами и генуэзскими коллегами, а книги пошлин Мангупа с каждым сезоном становятся все толще.\n\nКакую жилу царство впахнет глубже всего? Зерновой флот в Константинополь и на Эгейское море, поддерживающий хлебом понтийское православие? Или караванный путь в степь и дальше, влекущий через Таврические рынки русские, волжские и персидские товары?" #NT!
 nd_tdr.4.a: "Зерновой флот в Эгейское море" #NT!
 nd_tdr.4.b: "Караваны в степь" #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_grain_fleet: "Таврический Зерновой Флот" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_grain_fleet: "Крымская пшеница по объему поддерживает Эгейский греческий мир; Боспорские корабли плывут с зерном и возвращаются с серебром." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_steppe_caravans: "Степные караваны" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_steppe_caravans: "Дорога из Кафы в Сарай и далее ведет через Боспорские таможни русские и персидские товары." #NT!
  
  # ============================================================ 
  # DHE event nd_tdr.5: The Crimean Gothic Tongue 
  # ============================================================ 
 nd_tdr.5.t: "Крымско-готический язык." #NT!
 nd_tdr.5.d: "Посол Габсбургского двора, фламандский гуманист Ожье Гизелин де Бусбек однажды запишет в Блистательной Порте список слов, собранный от двух крымчан. Рейди для отца, мое для луны, бар для ребенка: позднее, полузадушенное эхо готской Библии Вульфилы в устах жителей горных деревень через восемь столетий после того, как Теодорих Великий поехал на запад.\n\nПока крымско-готическая речь сохраняется в скальных деревнях вокруг Мангупа, и суд должен принять меры. Будет ли оно поднято как воинское наследие (готы Иоанна Готского, федераты Юстиниана) или объединено в более широкий вселенский двор греков, готов, татар, алан и итальянцев под руководством понтийского патриарха?" #NT!
 nd_tdr.5.a: "Поднимите готский отряд" #NT!
 nd_tdr.5.b: "Объедините все народы в один понтийский двор." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_gothic_warband: "Готический отряд" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_gothic_warband: "Слуги деревеньки на скалах идут тяжелым отрядом под своими старыми знаменами." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_ecumenical_court: "Вселенский суд" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_ecumenical_court: "Мангупский двор принимает греков, готов, алан, татар и итальянцев под одной крышей понтийских православных." #NT!
  
  # ============================================================ 
  # DHE event nd_tdr.6: The Cave Monasteries 
  # ============================================================ 
 nd_tdr.6.t: "Печерский Синод" #NT!
 nd_tdr.6.d: "Игумены Инкерманский, Эски-Керменский и Чуфут-Кале встречаются в скальной церкви Святого Утеса в Мангупе. Они унаследовали многовековую монашескую жизнь, высеченную прямо в известняке: часовни, кельи, трапезные, высеченные долотом из костей плато. Теперь, когда царство восстановлено, синод признает единую Понтийско-Крымскую митрополию с высеченной в скале Мангупской кафедрой во главе по согласованию с Константинопольским патриархом.\n\nИконы, написанные в пещерных часовнях, распространяются вплоть до Трапезундя и Москвы. Монахи переписывают псалтыри при свечах из пчелиного воска." #NT!
 nd_tdr.6.a: "Созвать синод при патриархе" #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_pontic_synod: "Понтийский Крымский Синод" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_pontic_synod: "Пещерные монастыри проповедуют энергичное понтийское православие, которое привлекает новообращенных и укрепляет верующих королевства." #NT!
  
  # ============================================================ 
  # Advances 
  # ============================================================ 
 nd_tdr_mangup_citadel: "Скальная крепость Мангуп" #NT!
 nd_tdr_mangup_citadel_desc: "Восстановите и заново разместите гарнизон в стенах Юстиниана на Мангупском плато. Открывает доступ к зданию Мангупской скальной цитадели." #NT!
  
 nd_tdr_drungaroi_levy: "Друнгари из скальных деревень" #NT!
 nd_tdr_drungaroi_levy_desc: "Горные деревни Феодоро обязаны гарнизонной службой скальным крепостям. Открывает набор Мангуп Друнгароев." #NT!
  
 nd_tdr_bosporan_liburnae: "Боспорские Либурны" #NT!
 nd_tdr_bosporan_liburnae_desc: "Унаследуйте небольшие быстрые эскортные галеры позднеримского Понта Эвксина. Открывает доступ к легкому кораблю «Боспор-Либурна»." #NT!
  
 nd_tdr_pontic_icons: "Понтийская иконографическая школа" #NT!
 nd_tdr_pontic_icons_desc: "Пещерные часовни и скальные скиты хранят самобытную крымскую иконографическую традицию, восшедшую от каппадокийских и трапезунтийских мастеров." #NT!
  
 nd_tdr_cherson_trade: "Таврический Эмпорион" #NT!
 nd_tdr_cherson_trade_desc: "Вновь откройте великие греческие торговые гавани Таврического побережья. Открывает здание Таврического Эмпориона и улучшает морскую торговлю." #NT!
  
 nd_tdr_cave_monasteries: "Пещерная монашеская традиция" #NT!
 nd_tdr_cave_monasteries_desc: "Высеченные в скалах церкви и кельи Инкермана, Эски-Кермена и Чуфут-Кале становятся центрами понтийской православной грамотности. Открывает здание Пещерного монастыря." #NT!
  
 nd_tdr_gabras_inheritance: "Наследство Габраса" #NT!
 nd_tdr_gabras_inheritance_desc: "Князья Габраса заявляют о своем происхождении от комненов Трапезунда и Константинополя, повышая престиж и культурное влияние Мангупского трона." #NT!
  
 nd_tdr_caffa_factor: "Каффа Фактор" #NT!
 nd_tdr_caffa_factor_desc: "Икра понтийского осетра, засоленная и выдержанная в бочках в Каффе, становится предметом роскоши, который ценится в Константинополе, Генуе и Каире. Открывает Понтийский лечебный завод и метод производства икры." #NT!
  
 nd_tdr_tauric_stratiotes: "Таврические стратиоты" #NT!
 nd_tdr_tauric_stratiotes_desc: "Прибрежные греки и всадники-готы собираются в качестве легкой кавалерии, поздних потомков комнатских стратиотов. Открывает отряд Таврических стратиотов." #NT!
  
 nd_tdr_gothic_heritage: "Крымское готическое наследие" #NT!
 nd_tdr_gothic_heritage_desc: "Прославляется сохранение крымско-готского языка, и королевство формально охватывает многоэтническую идентичность греков, готов, алан, половцев и итальянцев." #NT!
  
 nd_tdr_komnenoid_court: "Комненоидная придворная культура" #NT!
 nd_tdr_komnenoid_court_desc: "Мангуп покровительствует иконописцам, гимнографам и народным греческим поэтам, подражая трапезунтинскому комнатенскому двору." #NT!
  
 nd_tdr_steppe_truces: "Степные перемирия" #NT!
 nd_tdr_steppe_truces_desc: "Крымские татары, ногайцы и волжские наследники Золотой Орды — все едут в Мангуп по перемирию, а боспорские князья выступают в качестве честных посредников." #NT!
  
 nd_tdr_phanariot_links: "Ссылки на фанариотов" #NT!
 nd_tdr_phanariot_links_desc: "Боспорские дипломаты присоединяются к греческим православным купеческим домам Константинополя, Смирны и Венеции." #NT!
  
 nd_tdr_mountain_warfare: "Доктрина горной войны" #NT!
 nd_tdr_mountain_warfare_desc: "Укрепленные перевалы, цепи блокпостов и складская логистика превращают каждую кампанию на Крымском нагорье в изматывающее испытание для оккупанта." #NT!
  
 nd_tdr_taurican_admiralty: "Таврическое Адмиралтейство" #NT!
 nd_tdr_taurican_admiralty_desc: "Потомки экипажей понтийских либурн имеют небольшой, но быстрый эскортный флот, построенный на тактике галер, унаследованной от позднеримского Черноморского флота." #NT!
  
 nd_tdr_pontic_iconography: "Понтийская иконография" #NT!
 nd_tdr_pontic_iconography_desc: "Традиция понтийской иконописи достигает своей зрелой формы: мастерские в Инкермане и Мангупе производят книги и панно для православного мира. Открывает метод производства икон-скриптория в Пещерном монастыре." #NT!
  
 nd_tdr_pontic_revival: "Понтийское зерновое возрождение" #NT!
 nd_tdr_pontic_revival_desc: "Крымские зернокомбинаты ведут торговлю грубым спиртом по Причерноморью и степным путям. Открывает метод производства зернового спирта на Понтийских лечебных заводах." #NT!
  
 nd_tdr_neo_byzantine_theology: "Неовизантийское богословие" #NT!
 nd_tdr_neo_byzantine_theology_desc: "Константинопольский патриархат и крымские митрополиты подтверждают духовную центральность Таврического полуострова." #NT!
  
 nd_tdr_komnenoid_absolutism: "Комненоидный абсолютизм" #NT!
 nd_tdr_komnenoid_absolutism_desc: "Династия Комненоидов централизует налоги в Мангупской канцелярии и организует наемную дворцовую бюрократию по римскому образцу." #NT!
  
 nd_tdr_grain_combine: "Таврический зерновой комбинат" #NT!
 nd_tdr_grain_combine_desc: "Реформы таможни и централизованное хранение в Кафе и Херсоне позволяют боспорской пшенице доминировать на черноморском зерновом рынке." #NT!
  
  # ============================================================ 
  # Custom units 
  # ============================================================ 
 a_nd_tdr_mangup_drungaroi: "Мангуп Друнгарои" #NT!
 a_nd_tdr_mangup_drungaroi_desc: "Тяжелая пехота гарнизонов скалы Феодорита. Медленный, изнуряющий, и его трудно выбить из каменистой земли." #NT!
  
 a_nd_tdr_tauric_stratiotes: "Таврические стратиоты" #NT!
 a_nd_tdr_tauric_stratiotes_desc: "В бою шла легкая кавалерия, набранная из прибрежных греков и всадников-готов с Крымского нагорья." #NT!
  
 n_nd_tdr_bosporan_liburnian: "Боспорское либурне" #NT!
 n_nd_tdr_bosporan_liburnian_desc: "Небольшая быстроходная галера сопровождения, созданная по образцу позднеримских либурн Черного моря, идеально подходящая для сопровождения зерновых конвоев и прибрежного патрулирования." #NT!
  
 n_nd_tdr_pontic_galley: "Понтийская галера" #NT!
 n_nd_tdr_pontic_galley_desc: "Тяжелая черноморская боевая галера, поздний потомок экипажей понтийских либурн. Быстрее ванильных галер и имеет более тяжелый корпус, подходящий для условий Черного моря." #NT!
  
  # ============================================================ 
  # Custom levies 
  # ============================================================ 
 levy_nd_tdr_mangup_drungaroi: "Мангуп Друнгарой Леви" #NT!
 levy_nd_tdr_mangup_drungaroi_desc: "Набор тяжелой пехоты из горных деревень Феодоро." #NT!
  
  # ============================================================ 
  # Custom buildings 
  # ============================================================ 
 nd_tdr_cliff_citadel: "Мангупская скальная цитадель" #NT!
 nd_tdr_cliff_citadel_desc: "Циклопические куртины и восьмиугольная цитадель Мангупского плато, перестроенные на юстиниановских фундаментах." #NT!
  
 nd_tdr_cave_monastery: "Пещерный монастырь" #NT!
 nd_tdr_cave_monastery_desc: "Высеченные в скалах часовни, кельи и трапезные, высеченные в известняковых скалах Инкермана и Эски-Кермена, центров понтийского монашеского образования." #NT!
  
 nd_tdr_tauric_emporion: "Таврический Эмпорион" #NT!
 nd_tdr_tauric_emporion_desc: "Укрепленный торговый квартал на побережье Таврического, где по боспорским обычаям сходятся греческие, итальянские, понтийские и татарские торговцы." #NT!
  
  # ============================================================ 
  # Production methods (named so they don't show as auto-generated) 
  # ============================================================ 
 nd_tdr_citadel_maintenance: "Содержание Клиффа Гарнизона" #NT!
 nd_tdr_citadel_maintenance_desc: "Камень, древесина и оружие, чтобы поддерживать навесные стены и постоянный гарнизон в боевом порядке." #NT!
  
 nd_tdr_cave_monastery_maintenance: "Пещерный монастырский офис" #NT!
 nd_tdr_cave_monastery_maintenance_desc: "Свечи из пчелиного воска, бумага и книги для ежедневных офисов и скриптория." #NT!
  
 nd_tdr_icon_scriptorium: "Икона Скрипторий" #NT!
 nd_tdr_icon_scriptorium_desc: "Свечи из пчелиного воска и пергамент служат топливом для иконописных мастерских пещерных часовен и иллюминаторов рукописей." #NT!
  
 nd_tdr_emporion_cooperage: "Таврический бондарный завод" #NT!
 nd_tdr_emporion_cooperage_desc: "Бондарный квартал эмпориона готовит бочки и конопатиные корпуса для зернового флота, потребляя соленую рыбу и зерновые запасы." #NT!
  
 nd_tdr_pontic_workshop: "Понтийские лечебные работы" #NT!
 nd_tdr_pontic_workshop_desc: "Прибрежные коптильни и винокуренные заводы на Таврическом берегу. Генуэзский фактор в Каффе связал Понтийский полуостров со средиземноморской торговлей роскошью и продовольствием; это производственное дополнение к торговому Tauric Emporion." #NT!
  
 nd_tdr_caviar_works: "Понтийский икорный завод" #NT!
 nd_tdr_caviar_works_desc: "Икру понтийского осетра солят и отправляют в бочки в Каффе для торговли предметами роскоши в Константинополе, Генуе и Каире." #NT!
  
 nd_tdr_grain_spirits: "Понтийские зерновые спиртные напитки" #NT!
 nd_tdr_grain_spirits_desc: "Спирт грубого помола перегоняют из крымской пшеницы и отправляют по Причерноморью и в степную торговлю." #NT!
  
  # ============================================================ 
  # DESTINY TREE 
  # ============================================================ 
  
  # ===== Destiny advances ===== 
 nd_tdr_destiny: "Судьба Киммерийского берега" #NT!
 nd_tdr_destiny_desc: "Совет Мангупа берет на себя долгосрочный проект возрождения государства. Перед басилевсом открыты две дороги: Понтийский гегемон, шагающий по кольцу Черного моря, или Таврическая Империя, уходящая глубоко в степь." #NT!
  
 nd_tdr_dest_pontic_reach: "Понтийский пролив" #NT!
 nd_tdr_dest_pontic_reach_desc: "Возьмите южные черноморские перевалочные пункты Синопу и Амасру, чтобы разомкнуть кольцо Митридата вокруг Евксинского Понта." #NT!
  
 nd_tdr_dest_black_sea_mastery: "Черноморское мастерство" #NT!
 nd_tdr_dest_black_sea_mastery_desc: "Подчините Трапезунд и Варну боспорским обычаям, удерживая восточный и западный фланги Причерноморья." #NT!
  
 nd_tdr_dest_mithridates_heir: "Наследник Митридата" #NT!
 nd_tdr_dest_mithridates_heir_desc: "Сядьте в Константинополе и замкните древнее кольцо Митридата Евпатора. Открывает доступ к зданию Митридатического адмиралтейства." #NT!
  
 nd_tdr_dest_steppe_frontier: "Степной рубеж" #NT!
 nd_tdr_dest_steppe_frontier_desc: "Взять донские и волжские ворота у Таны и Сарай-эль-Джадида, открыв караванную дорогу из Крыма в ордынские земли." #NT!
  
 nd_tdr_dest_ruthenian_outreach: "Русинская пропаганда" #NT!
 nd_tdr_dest_ruthenian_outreach_desc: "Дойти до Киева и по Днепровской дороге, втянув русинскую хлебную сеть в Мангупскую канцелярию." #NT!
  
 nd_tdr_dest_ecumenical_throne: "Вселенский престол" #NT!
 nd_tdr_dest_ecumenical_throne_desc: "Шагайте по дорогам Волги и Днепра как многоэтническое королевство греков, готов, татар, алан и русинов. Открывает доступ к Императорской канцелярии Мангупа." #NT!
  
  # ===== Destiny event nd_tdr.7: root ===== 
 nd_tdr.7.t: "Долгая дорога из Мангупа" #NT!
 nd_tdr.7.d: "Работа по формированию королевства завершена. Начинается работа по его выращиванию. В высеченном в скале зале базилики в Мангупе собирается совет королевства в полном составе: династы скальной деревни, стратеги Феодоро, митрополит и его игумены, караимы и итальянские купцы Таврического побережья.\n\nСпорят о двух судьбах. Первый, озвученный греческими архонтами, — это Понтийский гегемон: талассократия по модели Митридата, объединяющая в единое боспорское кольцо гавани Синопы, Трапезундя, Варны и, наконец, сам Константинополь. Второе, озвученное династами готов и аланов и зернохранилищами фанариотов, — это Таврическая Империя: многоэтническое сухопутное царство, простирающееся от Мангупа до Таны, Сарая и Киева, объединяющее все народы понтийской степи в одно царство под властью патриарха.\n\nОбе дороги длинные. Королевство предано судьбе." #NT!
 nd_tdr.7.a: "Начинается работа поколений" #NT!
  
  # ===== Destiny event nd_tdr.8: A1 Pontic Reach ===== 
 nd_tdr.8.t: "Кольцо Митридата" #NT!
 nd_tdr.8.d: "Хлебное знамя боспорского царя реет над кастроном Синопы и гаванью Амасры. Южный берег Эвксинского Понта, отданный Риму с того дня, как Мехмед Османский взял город Трапезунд, снова стал таможенной границей эллинского короля. Рыбаки Синопы целуют руку новым стратегам и платят пошлину серебром и сушеным скумбром.\n\nНа совете стратеги отмечают следующий участок: Трапезунд на востоке, Варна на западе, а за ними сам Константинополь, где кольцо замыкается." #NT!
 nd_tdr.8.a: "Отметьте следующие гавани на карте стратега." #NT!
  
  # ===== Destiny event nd_tdr.9: A2 Black Sea Mastery ===== 
 nd_tdr.9.t: "Трапезунд и Варна" #NT!
 nd_tdr.9.d: "Два фланга кольца Митридата взяты. Трапезунд, последний оплот Комненской базилеи, открывает свои ворота боспорскому базилевсу как родственнику по происхождению, а не как завоевателю. Племянник Мегаса Комнина скачет в стремени короля. В Варне западная гавань признает ту же корону, и таможня Каффы назначает клерка для надзора за новыми книгами пошлин.\n\nТеперь вопрос в том, направить ли новые доходы в зерновой флот, который плывет в Эгейское море, или в таможни, которые облагают налогом проходящих через него торговцев. Купцы Генуи склоняются одновременно к обоим." #NT!
 nd_tdr.9.a: "Налейте серебро в зерновой флот" #NT!
 nd_tdr.9.b: "Постройте таможни толстыми" #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_grain_convoy: "Понтийский конвой зерна" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_grain_convoy: "Боспорское зерно, идущее к Эгейскому морю, сопровождают легкие эскадрильи, которые одновременно выполняют функцию прибрежного блокадного флота. Милиция жалуется, что призывники садятся на весла." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_customs: "Понтийская таможня" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_customs: "Боспорские таможни расположены в каждой крупной гавани Черного моря. Клерки богатеют, а воинские поместья становятся беспокойными и скучными." #NT!
  
  # ===== Destiny event nd_tdr.10: A3 Heir of Mithridates ===== 
 nd_tdr.10.t: "Наследник Митридата Евпатора" #NT!
 nd_tdr.10.d: "Базилевс Киммерийского берега вступает в Константинопольский Августейон. Через две тысячи лет после того, как Митридат VI Евпатор, последний царь Понта и повелитель Черного моря, прошел по этим камням, под куполом церкви Юстиниана восседает басилевс его старой страны. Собор Святой Софии снова поют на греческом языке. Патриарх коронует нового императора одновременно как василевса римлян и царя Боспора.\n\nКакую форму примет новый Понтийский орден? Большой военный флот, чтобы превратить внутреннее море в Боспорское озеро по образцу адмиралов Митридата; или мягкая гегемония договоров и мирных конгрессов, объединяющая Трапезунд, Афины, Смирну и Каффу в одно торговое государство?" #NT!
 nd_tdr.10.a: "Военный флот, чтобы запереть внутреннее море" #NT!
 nd_tdr.10.b: "Мир среди понтийских гаваней" #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_mithridatic_fleet: "Митридатовый военный флот" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_mithridatic_fleet: "Тяжелые галеры патрулируют Понтийское кольцо под знаменами новых боспорских базилей, поздних потомков адмиралов Митридата." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_basileia: "Понтийская Базилея" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_basileia: "Договоры и мирные конгрессы связывают понтийские гавани мягкой гегемонией. Цена — более медленная, но законная война, и поместья воинов изнашиваются." #NT!
  
  # ===== Destiny event nd_tdr.11: B1 Steppe Frontier ===== 
 nd_tdr.11.t: "Тана и Сарай" #NT!
 nd_tdr.11.d: "Мангупский басилевс едет на север и на восток, и степные дороги склоняются перед ним. В Тане генуэзский фактор платит свою старую дань в новую казну. В Сарай аль-Джадид, новой столице Волжского улуса, боспорец сидит на базаре со своими греческими и татарскими писцами. Караваны зерна от Кафы до Волги свободно движутся под одной таможней.\n\nОт этих ворот дорога идет дальше: в Киев на Днепре, в Бельямен на излучине Дона и, наконец, ко двору, который держит под одной короной греков, готов, татар и русинов." #NT!
 nd_tdr.11.a: "Отметьте дорогу на север в сторону Киева" #NT!
  
  # ===== Destiny event nd_tdr.12: B2 Ruthenian Outreach ===== 
 nd_tdr.12.t: "Днепровская дорога" #NT!
 nd_tdr.12.d: "Киев на Днепре признает василевса Мангупа. Караваны зерна, питавшие Константинополь во времена Херсона и Тмутаракани, снова ходят. Фанариотские хлебозаводы Таврического берега посылают факторы к киевским причалам, а киевский митрополит направляет делегацию к Константинопольскому патриарху через Мангуп, восстанавливая старую Понтийско-Русскую церковную дорогу.\n\nКакую жилу будет пахать царство? Открыть контракты со степными капитанами и русинскими казаками, привлечь их на боспорскую службу для предстоящих длительных кампаний? Или фанариотская канцелярия в Мангупе, связывающая хлебные дома и киевское духовенство с постоянной администрацией царства?" #NT!
 nd_tdr.12.a: "Открытые контракты на степных и казачьих капитанов" #NT!
 nd_tdr.12.b: "Постройте канцелярию фанариотов." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_dnieper_road: "Капитаны Днепровского пути" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_dnieper_road: "Степные капитаны и русинские казаки едут за басилевсом на длительных контрактах. Суд в Мангупе кажется далеким и провинциальным, когда войны ведутся далеко на севере." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_phanariot_chancery: "Канцелярия фанариотов" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_phanariot_chancery: "Мангупскую канцелярию обслуживают греческие купеческие дома и киевское духовенство. Цена – это настроение беспокойных амбиций в более богатых провинциях." #NT!
  
  # ===== Destiny event nd_tdr.13: B3 Ecumenical Throne ===== 
 nd_tdr.13.t: "Вселенский престол" #NT!
 nd_tdr.13.d: "Греки, готы, татары, аланы, половцы, русины, итальянцы: каждый народ длинной понтийской степи признает василевса Мангупа. В скаловом зале Восьмиугольной Цитадели чин прославления читается на семи языках, а митрополит благословляет трон на древнепонтийском греческом языке пещерных монастырей.\n\nКакой характер примет империя? Комниноидная канцелярия, наемная дворцовая бюрократия по римскому образцу, собирающая обученные пешие полки под скалистым знаменем Феодоро? Или степная базилея, собирающая конные отряды татарских и половецких воинов под знаменами старых ханов и новой царской печатью и правящая как наследница Митридата и Чингиса одновременно?" #NT!
 nd_tdr.13.a: "Комненоидная канцелярия и обученные пешие полки" #NT!
 nd_tdr.13.b: "Степная базилея конных компаний." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_komnenoid_chancery: "Комненоидная канцелярия" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_komnenoid_chancery: "Наемная дворцовая бюрократия на скале в Мангупе тренирует пешие полки и руководит осадными операциями на римских позициях." #NT!
  
 STATIC_MODIFIER_NAME_nd_tdr_dest_steppe_basileia: "Степная Базилея" #NT!
 STATIC_MODIFIER_DESC_nd_tdr_dest_steppe_basileia: "Под печатью василевса скачут конные роты татарских и половцевских воинов, а в скальный штандарт вышиты ханские знамена." #NT!
  
  # ===== Destiny capstone buildings ===== 
 nd_tdr_mithridatic_admiralty: "Митридатовое Адмиралтейство" #NT!
 nd_tdr_mithridatic_admiralty_desc: "Укрепленная верфь, парусный чердак и система канатных дорог по позднеримской понтийской модели. Место базирования Боспорского военного флота, замыкающего Митридатово кольцо." #NT!
  
 nd_tdr_imperial_chancery: "Мангупская Императорская Канцелярия" #NT!
 nd_tdr_imperial_chancery_desc: "Наемная дворцовая бюрократия, сидящая на скале Мангупа. Греческая, готская, татарская, аланская и русинская элиты скручены в единую канцелярию по Комниноидному типу." #NT!
  
 nd_tdr_admiralty_maintenance: "Обслуживание Понтийского флота" #NT!
 nd_tdr_admiralty_maintenance_desc: "Древесина, военно-морские припасы, деготь и инструменты для поддержания военного флота Митридатического Адмиралтейства в порядке." #NT!
  
 nd_tdr_chancery_maintenance: "Канцелярия" #NT!
 nd_tdr_chancery_maintenance_desc: "Бумага, тонкая ткань, мебель, книги и инструменты для штатных служащих Мангупской канцелярии." #NT!
  
  # ============================================================ 
  # Bureaucracies 
  # ============================================================ 
 AUTO_MODIFIER_NAME_nd_tdr_bureaucracy_authority: "Боспорское бюрократическое управление" #NT!
 AUTO_MODIFIER_DESC_nd_tdr_bureaucracy_authority: "Воссозданное Боспорское царство, наследник Феодоро и покойного Комнина, осуществляет полную административную власть над своими крымскими владениями и может принять на своей территории исторические учреждения побережья Таврического." #NT!
  
 tdr_komnenoid_chancery_bureaucracy: "Комненоидная канцелярия" #NT!
 tdr_komnenoid_chancery_bureaucracy_desc: "С конца четырнадцатого века правители Мангупа называли себя Комненодукай, и их канцелярия раздавала византийскую титулатуру (себастос, протостратор, епарх, мегадукс) слугам, степным посредникам и генуэзским факторам. Разрабатывая греческие хартии в канцелярии поздней империи Палеологов, семья проводила брачную дипломатию, которая связывала крымский двор с Трапезунда, Валахией, Москвой и сохранившимися комнатанскими линиями. Достоинство раздувалось быстрее, чем росло государство, но оно связывало царство в единую церемониальную пирамиду, спускающуюся с Мангупского трона." #NT!
  
 tdr_cliff_monastery_synod_bureaucracy: "Синод Клифф-Монастыря" #NT!
 tdr_cliff_monastery_synod_bureaucracy_desc: "Понтийское православное духовное учреждение Крыма было организовано вокруг пещерных монастырей Инкерман, Эски-Кермен, Чуфут-Кале и скальных часовен Мангупа, восходящих к юстиниановым фундаментам VI века. Синод регулировал приходскую дисциплину, лицензировал крымскую иконописную школу каппадокийского и трапезунтского происхождения и размещал греческие школы, обучавшие жителей горных деревень читать. Караимские, армянские и католические генуэзские общины побережья жили в условиях де-факто религиозной терпимости, даже когда Константинопольский патриархат запрещал это." #NT!
  
 tdr_tauric_customs_house_bureaucracy: "Таврическая таможня" #NT!
 tdr_tauric_customs_house_bureaucracy_desc: "Портово-таможенный аппарат, регулирующий космополитические торговые центры Таврического побережья: Херсон под византийцами, Каффа под генуэзцами, Солдая под Венецией, а затем Генуя, Воспоро по обе стороны Киммерийского пролива. Боспорское возрождение параллельно наследует генуэзскую коммерцию и византийскую коммерцию, взимая адвалорные пошлины на транзитное зерно, соленую рыбу, икру, рабов, воск и шелк. Корона и великие греческие и итальянские купеческие дома процветают вместе; горные крестьяне, питающие порты, платят едой, которую они не едят." #NT!
  
 tdr_gothic_upland_council_bureaucracy: "Совет Готической возвышенности" #NT!
 tdr_gothic_upland_council_bureaucracy_desc: "Консультативное собрание крымских горных деревень, поздних потомков готов Вульфилы, чей язык Ожье де Бусбек все еще записывал при османском дворе в 1562 году. Старейшины деревень сезонно собирались на Мангупском плато и в Эски-Кермене, чтобы распределить гарнизонные службы по скальным крепостям, выделить пастбища для отгонного животноводства вдоль Крымских гор и представить жалобы грекоязычному двору внизу. Признание Готского совета связало горных арендаторов и их мелких лордов с королевством как вооруженных союзников, а не подданных, но оно связало руки короне в вопросах налогов, воинской повинности и землевладения в половине ее внутренних районов." #NT!
