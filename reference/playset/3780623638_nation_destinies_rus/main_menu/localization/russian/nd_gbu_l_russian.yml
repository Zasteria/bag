l_russian:
  # === Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_gbu_frankish_imperial_kingdom: "Франко-Императорское королевство" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_frankish_imperial_kingdom: "Корона, которую Карл Смелый искал в Трире, наконец возложена на чело бургундца. Compagnies d'Ordonnance стремятся к суверенному королю, Орден Золотого руна - к двору с самыми рыцарскими претензиями в христианском мире. Бургундия наносит удар с позиции военного престижа." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_estates_kingdom: "Королевство сословий" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_estates_kingdom: "Etats Generaux de Bourgogne является истинным партнером короны. Суконные цеха Брюгге и Гента, брабантские купцы, валлонские мастера по производству железа — все присылают своих депутатов. Королевство управляется совместно с его городами, и его богатство течет из их ткацких станков и прилавков." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_elite: "Рыцари Золотого руна" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_elite: "Золотой Toison d'Or сохранился в том виде, в каком его задумал Филипп Добрый: тридцать один рыцарь, великие дома Бургундии, связанные присягой герцогу. инкрустированный драгоценностями воротник; элитный кавалерийский корпус; рыцарский престиж самого щедрого двора христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_broad: "Расширенный флис" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_broad: "Орден открыт для младших дворян и верных капитанов. Руно становится национальным рыцарским институтом, а не замкнутым династическим кругом, привлекая широкую знать на службу королю и проецируя бургундскую честь по всей Европе." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_flemish_cloth_charter: "Фламандский тканевый устав" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_flemish_cloth_charter: "Гильдии мануфактуристов Гента, Брюгге и Ипра получают письменные привилегии: право проверять ткани, ставить знаки качества, защищать свою монополию. Ткацкие станки удваивают свою производительность." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_estates_general: "Генеральные штаты созваны" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_estates_general: "Etats Generaux собираются в Брюгге. Дворяне, духовенство и горожане всех герцогств и графств говорят с герцогом в один голос. Налоговые гранты поступают легче; королевство приобретает конституционный голос, которым пока не обладает ни одна конкурирующая монархия." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_trier_imperial: "Трирский конкордат" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_trier_imperial: "Император коронует герцога Бургундского королём в Трире. Королевский титул признан по всей Империи и за ее пределами. Христианский мир признает восстановленное Бургундское Среднее королевство." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_trier_unilateral: "Корона Брюсселя" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_trier_unilateral: "Император останавливается; герцог нет. Корона выкована в Брюсселе и помещена без разрешения императора. Суверенитет провозглашается делом, а не письмом, и сословия подтверждают то, что не осмеливается оспаривать ни одна иностранная канцелярия." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_gendarme_reform: "Компании d'Ordonnance" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_gendarme_reform: "Постоянная армия Карла Смелого обретает форму: оплачиваемые роты жандармов в полном вооружении, с копьями и конями в доспехах, выстроенные в тактическом порядке. Самая дисциплинированная тяжелая кавалерия того времени." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_militia_mobilization: "Бюргерское ополчение мобилизовано" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_militia_mobilization: "Тканевые города поднимают свои пикинистые ополчения на защиту королевства. Брюгге, Гент, Брюссель, Льеж отправляют на поле боя свои бюргерские роты. Численность компенсирует размножение." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_croix_de_bourgogne: "Круа де Бургундия" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_croix_de_bourgogne: "Солдат Святого Андрея, грубый красный крест из узловатых ветвей, становится полевым штандартом каждого бургундского батальона. Воинство марширует под одним знаменем и осознает себя за один народ." #NT!
  
  # === Formation Event === 
 nd_gbu.1.t: "Бургундская Корона" #NT!
 nd_gbu.1.d: "От Брюгге до Дижона, от Фризских дюн до водораздела Юры — длинная дуга бургундской власти наконец консолидирована под единой суверенной короной. Герцогство Бургундское и Свободное графство, Фландрия и Брабант, Пикардия и Голландия, Лотарингия и Эльзас — все земли, которые Филипп Добрый и Карл Смелый объединили в единое государство, теперь составляют одно королевство, не подчиняющееся ни Парижу, ни Империи. Лотарингское среднее королевство возрождается.\n\nНо какое это должно быть королевство?\n\nКарл мечтал о суверенном троне, высеченном из императорского достоинства, дворе самого щедрого рыцарства в Европе, постоянной армии жандармов и бомбардировщиков. Ордонансские компании, Золотой орден, полевые штандарты Святого Андрея — это регалии франкского имперского королевства, государства военного престижа.\n\nОднако богатством Бургундии всегда были ее города. Брюгге и Гент, Брюссель и Антверпен, Мехелен и Льеж: суконные цеха, конторы, бюргерские ополчения крупных городских коммун. Генеральные штаты уже собираются, чтобы предоставить или отказать в финансировании герцога. Королевством можно было управлять совместно со своими городами, что является конституционным партнерством, в отличие от любой другой короны в Европе.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_gbu.1.a: "Франко-Императорское королевство: двор, жандарм и императорское достоинство" #NT!
 nd_gbu.1.b: "Королевство сословий: суконные цеха, горожане и городское содружество" #NT!
  
  # === DHE: Order of the Golden Fleece === 
 nd_gbu.2.t: "Орден Золотого Руна" #NT!
 nd_gbu.2.d: "Десятого января 1430 года в большом зале своего дворца в Брюгге Филипп Добрый объявляет об основании нового рыцарского ордена в день своей свадьбы с Изабеллой Португальской. Он называет его Toison d'Or, в честь золотого руна Ясона и аргонавтов, а также в честь шерсти, которая сделала Бургундию богатой. Двадцать четыре рыцаря допущены к основанию, великие дома королевства связаны присягой герцогу. Они носят ошейник из драгоценных камней и золотых звеньев: на каждом свисает руно.\n\nОрден — самый эксклюзивный в христианском мире. Это также политический инструмент: каждый великий дворянин, присоединяющийся к династии, несет перед династией личный долг рыцарской преданности. Но основание поднимает вопрос, который определит форму королевства. Останется ли Руно замкнутым кругом, задуманным Филиппом, состоящим всего из тридцати одного рыцаря? Или он должен вырасти, стать более широким институтом, привлекающим более широкую знать, проецируя бургундскую честь по всей Европе?" #NT!
 nd_gbu.2.a: "Придерживайтесь устава: тридцать один рыцарь, элитный круг." #NT!
 nd_gbu.2.b: "Откройте Орден: превратите руно в национальное рыцарское учреждение." #NT!
  
  # === DHE: Flemish Cloth Charter === 
 nd_gbu.3.t: "Тканевая хартия" #NT!
 nd_gbu.3.d: "Торговцы тканями Гента, Брюгге и Ипра ходатайствуют перед короной о выдаче хартии. Они ткали из английской шерсти и красителей Пикардии вот уже два столетия. Они хотят письменного права: проверять ткань на ткацком станке, маркировать ее городским клеймом качества, запрещать иностранным купцам покупать нештампованные товары. Корона предоставляет хартию. В Нидерландах ткацкие станки работают вдвое быстрее, валяльные станы работают день и ночь, а фламандские ткани, отмеченные печатью шерстяной гильдии, продаются по самым высоким ценам в Европе." #NT!
 nd_gbu.3.a: "Тканевые цеха процветают." #NT!
  
  # === DHE: Estates General Convocation === 
 nd_gbu.4.t: "Генеральный созыв штатов" #NT!
 nd_gbu.4.d: "Филипп Добрый впервые созывает Etats Generaux в 1464 году в Брюгге: дворяне, духовенство и горожане всех бургундских земель собрались, чтобы выплатить налоги, выслушать жалобы и в один голос обратиться к герцогу. Это первое подобное собрание в Европе, объединяющее депутатов стольких герцогств и графств под одной короной. Состояния Фландрии и Брабанта, Голландии и Эно, Бургундии и Франш-Конта совещаются вместе. С этого момента королевство управляется не только герцогским указом, но и путем переговоров между короной и составляющими ее землями: конституционный принцип, который переживет любую династию, удерживающую трон." #NT!
 nd_gbu.4.a: "Пусть сословия будут услышаны." #NT!
  
  # === DHE: Trier Coronation === 
 nd_gbu.5.t: "Корона в Трире" #NT!
 nd_gbu.5.d: "Осенью 1473 года Карл Смелый едет в Трир с двумя тысячами коней и сундуком с золотом, чтобы встретиться с императором Фридрихом III. Он требует признания королевства: короны, королевского титула, возвышения Бургундского государства до суверенного равенства с Францией и Империей. Фредерик сговорчив; переговоры продвинулись; саму корону привозят в город. Брак сына Фридриха Максимилиана с дочерью Карла Марией предлагается в качестве династической печати.\n\nВ первоначальном ходе событий Фредерик ночью бежал из Трира, и сделка сорвалась. Здесь сделка не разваливается. Но королю все равно предстоит сделать выбор: будет ли получена корона из рук императора, что станет актом признания всего христианского мира, связывающим Бургундию с Империей долгом достоинства? Или же на него будут претендовать в одностороннем порядке, выкованные дома и установленные только руками бургундцев, на суверенитет, который ничем не обязан ни одному другому принцу?" #NT!
 nd_gbu.5.a: "Получите корону из рук Императора, признанную во всем христианском мире." #NT!
 nd_gbu.5.b: "Куйте корону в Брюсселе: суверенитет Бургундии ни к чему не обязывает" #NT!
  
  # === DHE: Burgundian Wars === 
 nd_gbu.6.t: "Час Бургундских войн" #NT!
 nd_gbu.6.d: "Швейцарская Конфедерация наносит удар с юга; Лотарингские повстанцы в центре; Король Франции Людовик собирает свои знамена на западной границе. В королевстве идут Бургундские войны. Чарльз собирает свои артиллерийские роты в Нанси. Открыты два пути.\n\nПервый: углубить реформу постоянной армии. Влейте золото в жандармов, в бомбардировочные поезда, в дисциплинированные эскадроны наемной конницы. Ордонансные роты Шарля — самая профессиональная кавалерия в Европе; пусть они станут непобедимыми.\n\nВторое: поднять ополчение тканевых городов. Брюгге, Гент, Брюссель, Льеж могут выставить на поле тысячи копейщиков за сезон. Пики, городской общинный сбор, уже побеждали феодальную конницу: при Куртре, при Стиклестаде, при Земпахе. Пусть города защищают королевство, выросшее из них." #NT!
 nd_gbu.6.a: "Реформа жандармерии: влейте все в артиллерийские роты" #NT!
 nd_gbu.6.b: "Ополченская мобилизация: поднимите суконные города под ружье" #NT!
  
  # === DHE: Croix de Bourgogne === 
 nd_gbu.7.t: "Сальтира Святого Андрея" #NT!
 nd_gbu.7.d: "Над каждым бургундским батальоном теперь воздвигнут один и тот же красный крест: две грубые ветви, связанные в сальтир, крест Святого Андрея. Там, где капитаны Габсбургов однажды пролетят на нем через полмира, здесь он сначала полетит в Бургундию. Копье каждого жандарма, знамя каждого копейщика, китель каждого артиллериста украшены Бургундским крестом. Воинство марширует под одним знаком и осознает себя за одну нацию." #NT!
 nd_gbu.7.a: "Пусть сальтира летает." #NT!
  
  # === Advance Names === 
 nd_gbu_flemish_weaving_guilds: "Фламандские ткацкие гильдии" #NT!
 nd_gbu_flemish_weaving_guilds_desc: "Торговцы тканями Брюгге, Гента и Ипра организуют торговлю шерстью в гильдии, контролируемые городом. Их ткани, сотканные из английского флиса, окрашенные пикардской мареной и отмеченные знаком качества города, доминируют на рынках Европы." #NT!
 nd_gbu_burgundian_court_ceremonial: "Церемониал Бургундского двора" #NT!
 nd_gbu_burgundian_court_ceremonial_desc: "В Куденберге в Брюсселе и Принсенхофе в Брюгге бургундские герцоги содержат самый впечатляющий двор Европы пятнадцатого века. Банкеты, турниры, шествия и Орден Золотого руна повышают престиж династии во всем христианском мире." #NT!
 nd_gbu_bruges_kontor: "Брюгге Контор" #NT!
 nd_gbu_bruges_kontor_desc: "Ганзейский прилавок в Брюгге находится на равных с Любеком позициях. Бургундские купцы ведут переговоры как принципалы, а не как поставщики; рынок Брюгге обгоняет рынок Ганзы в Бергене и Новгороде." #NT!
 nd_gbu_burgundian_crossbow: "Бургундские арбалетные сборы" #NT!
 nd_gbu_burgundian_crossbow_desc: "В тканевых городах существуют гильдии арбалетчиков: братства Синт-Йорис и Синт-Себастьян в Брюгге и Генте. Их члены еженедельно стреляют в попинджей и готовы взять стену на войну." #NT!
 nd_gbu_order_of_the_golden_fleece: "Орден Золотого Руна" #NT!
 nd_gbu_order_of_the_golden_fleece_desc: "Золотой орден, основанный в Брюгге в 1430 году Филиппом Добрым, является самым эксклюзивным рыцарским орденом в христианском мире. Тридцать один рыцарь, связанный присягой династии, отличающийся воротником из украшенного драгоценными камнями руна." #NT!
 nd_gbu_flemish_pikeman: "Фламандские пикинеры-наборы" #NT!
 nd_gbu_flemish_pikeman_desc: "Городские ополчения тканевых городов служат в пиковых формированиях. Те же самые люди, которые сломили французское рыцарство при Куртре, теперь стоят наготове, как пики эпохи Возрождения." #NT!
 nd_gbu_flemish_cloth_charter_advance: "Тканевая хартия" #NT!
 nd_gbu_flemish_cloth_charter_advance_desc: "Гильдии мануфактуристов получают от короны письменные привилегии: право проверять ткань, маркировать ее, защищать свою монополию от иностранных купцов. Фламандский ткацкий станок становится стандартом европейского текстильного производства." #NT!
 nd_gbu_estates_general_advance: "Генеральный созыв сословий" #NT!
 nd_gbu_estates_general_advance_desc: "Собираются Генеральные государства Бургундии: дворяне, духовенство и горожане всех герцогств и графств говорят в один голос. Первое объединенное парламентское учреждение в Европе." #NT!
 nd_gbu_compagnies_dordonnance: "Компании d'Ordonnance" #NT!
 nd_gbu_compagnies_dordonnance_desc: "Карл Смелый реформирует бургундское войско по французской модели: постоянные отряды наемных латников, обученных в строю, ротируемых по гарнизонам и полям, получающие оплату из казны, а не из феодальных сборов." #NT!
 nd_gbu_burgundian_gendarme: "Бургундский жандарм" #NT!
 nd_gbu_burgundian_gendarme_desc: "Тяжелая кавалерия артиллерийских рот: полный доспех, конь в доспехах, копье и тактическая реформа. Жандармы Карла — самая профессиональная ударная кавалерия в христианском мире." #NT!
 nd_gbu_coulevrinier_corps: "Корпус Кулевринье" #NT!
 nd_gbu_coulevrinier_corps_desc: "Бургундские пистолетчики, вооруженные кулеврином, первым пороховым огнестрельным оружием. Их набирают из числа городских ополченцев и стоят рядом с арбалетчиками на линии боя." #NT!
 nd_gbu_trier_crown: "Трирская Корона" #NT!
 nd_gbu_trier_crown_desc: "Королевство обеспечивает королевское признание, о котором Карл договорился с императором Фридрихом III в Трире в 1473 году. Бургундия является суверенной монархией, признанной во всем христианском мире." #NT!
 nd_gbu_croix_de_bourgogne_advance: "Круа де Бургундия" #NT!
 nd_gbu_croix_de_bourgogne_advance_desc: "Сальтир Святого Андрея, грубый красный крест из узловатых ветвей, принят в качестве полевого штандарта каждого бургундского батальона. Хозяин марширует под одним знаменем." #NT!
 nd_gbu_mechelen_foundry_advance: "Мехеленский пушечный завод" #NT!
 nd_gbu_mechelen_foundry_advance_desc: "Мехелен становится континентальным центром вооружений. Бургундский артиллерийский поезд, организованный в традициях великих бомбардировщиков Карла Смелого, доставляет литые бронзовые пушки в армию короля." #NT!
 nd_gbu_grand_privilege: "Великая привилегия" #NT!
 nd_gbu_grand_privilege_desc: "Сословия закрепляют конституционные ограничения короны: право давать согласие на уплату налогов, созывать собственное собрание, отказываться от иностранных назначений. Королевством управляют путем переговоров, а не указов." #NT!
 nd_gbu_low_countries_urbanism: "Урбанизм Нидерландов" #NT!
 nd_gbu_low_countries_urbanism_desc: "Самая плотная урбанизация северной Европы: Антверпен, Брюссель, Гент, Брюгге, Амстердам, Льеж. Бургундские Нидерланды владеют третью всех городов королевства и производят большую часть его богатства." #NT!
 nd_gbu_antwerp_exchange: "Антверпенская биржа" #NT!
 nd_gbu_antwerp_exchange_desc: "Биржа Антверпена, основанная как первая в мире товарная биржа. Бургундские купцы устанавливали европейскую цену на перец, медь, серебро и векселя. Биржа становится финансовым центром европейской торговли." #NT!
 nd_gbu_burgundian_inheritance: "Бургундская наследственная дипломатия" #NT!
 nd_gbu_burgundian_inheritance_desc: "Бургундская династическая сеть простирается от Клева до Габсбургов, от Лотарингии до Англии. Брачная стратегия королевства делает его династической опорой европейской политики." #NT!
 nd_gbu_embellished_court: "Украшенный двор" #NT!
 nd_gbu_embellished_court_desc: "Куденберг превратился в настоящий королевский дворец; придворный церемониал Бургундии пятнадцатого века перенесся в эпоху барокко как суверенная традиция, а не как испанско-габсбургский импорт." #NT!
 nd_gbu_lotharingian_industry: "Лотарингская промышленность" #NT!
 nd_gbu_lotharingian_industry_desc: "Раннепромышленный пояс бельгийских провинций: каменный уголь Валлонии, металлообработка Льежа, железо Шарлеруа. Королевство проводит индустриализацию раньше всех среди континентальных держав." #NT!
 nd_gbu_belgian_textile_revolution: "Бельгийская текстильная революция" #NT!
 nd_gbu_belgian_textile_revolution_desc: "Механизированные хлопчатобумажные фабрики в Генте по британскому образцу; механизированная шерсть в Вервье; Промышленная революция приходит в Нидерланды. Суконные залы средневекового города теперь служат галереями над работающими днем ​​и ночью мельницами." #NT!
 nd_gbu_constitutional_estates: "Конституционные сословия" #NT!
 nd_gbu_constitutional_estates_desc: "Генеральные штаты полностью институционализировались как конституционный партнер короны. Парламентаризм девятнадцатого века на бургундских условиях: непрерывная традиция, восходящая к Филиппу Доброму." #NT!
  
  # === Building Names === 
 nd_gbu_flemish_cloth_hall: "Фламандский Суконный зал" #NT!
 nd_gbu_flemish_cloth_hall_desc: "Большой общественный зал гильдий шерстяных гильдий, построенный по образцу Лакенхалле в Ипре и Суконных рядов в Брюгге. Ткань проверяется, штампуется, облагается налогом и продается под одной крышей." #NT!
 nd_gbu_court_palace: "Бургундский придворный дворец" #NT!
 nd_gbu_court_palace_desc: "Герцогский дворец (Куденберг, Принсенхоф, Хоф тен Валле), где самый зрелищный двор Европы пятнадцатого века проводит свои банкеты, турниры и рыцарские церемонии." #NT!
 nd_gbu_hanseatic_counter: "Ганзейский счетчик" #NT!
 nd_gbu_hanseatic_counter_desc: "Торговая стойка по модели Брюгге, работающая с Ганзейским союзом на равных. Бургундские купцы торгуют в качестве принципалов по всему Северному морю и Балтийскому морю." #NT!
 nd_gbu_toison_dor_chapter_house: "Дом капитула Toison d'Or" #NT!
 nd_gbu_toison_dor_chapter_house_desc: "Дом капитула Ордена Золотого Руна. Рыцари ордена собираются здесь для собраний капитула, присяги верности и великих рыцарских праздников." #NT!
 nd_gbu_gendarme_drill_yard: "Жандармская тренировочная площадка" #NT!
 nd_gbu_gendarme_drill_yard_desc: "Учебный полигон роты ордонанса: постоянные роты наемных солдат, обученных в строю и готовых к действию. Первая настоящая постоянная армия континентального Запада." #NT!
 nd_gbu_mechelen_foundry: "Мехеленский пушечный завод" #NT!
 nd_gbu_mechelen_foundry_desc: "Бронзовый завод Мехелена, отливающий пушки для бургундского артиллерийского эшелона. Континентальный центр вооружений и поставщик бомбардировщиков по всей Европе." #NT!
 nd_gbu_antwerp_bourse: "Антверпенская биржа" #NT!
 nd_gbu_antwerp_bourse_desc: "Первая в мире настоящая товарная биржа. Здесь котируются векселя, облигации, медь, перец и тысячи других товаров, ежедневно устанавливающих европейскую цену." #NT!
 nd_gbu_belgian_textile_mill: "Бельгийская текстильная фабрика" #NT!
 nd_gbu_belgian_textile_mill_desc: "Механизированная хлопчатобумажная или шерстяная фабрика по британскому образцу. Гент, Вервье и Рубе возглавили промышленную революцию в Нидерландах." #NT!
  
  # === PM Names === 
 nd_gbu_chapter_house_upkeep: "Обслуживание заказов" #NT!
 nd_gbu_chapter_house_upkeep_desc: "Торжественное содержание Ордена: воротники, плащи, банкеты, регалии рыцарской присяги." #NT!
 nd_gbu_cloth_hall_weaving: "Фламандское шерстяное ткачество" #NT!
 nd_gbu_cloth_hall_weaving_desc: "Из шерсти пряли, красили и ткали знаменитое фламандское сукно, на котором ставили печать гильдии." #NT!
 nd_gbu_cloth_hall_fine_weaving: "Производство тонких тканей" #NT!
 nd_gbu_cloth_hall_fine_weaving_desc: "Лучшие сорта фламандского сукна, сотканные из импортной шелковой нити и окрашенные в самые глубокие цвета, для европейской знати." #NT!
 nd_gbu_court_palace_upkeep: "Придворный церемониал" #NT!
 nd_gbu_court_palace_upkeep_desc: "Организация банкетов, турниров, шествий и ежедневных церемоний бургундского двора." #NT!
 nd_gbu_kontor_upkeep: "Контор Операции" #NT!
 nd_gbu_kontor_upkeep_desc: "Ежедневная деятельность ганзейского прилавка: бухгалтерские книги, упаковка, отгрузка и складские помещения." #NT!
 nd_gbu_drill_yard_upkeep: "Техническое обслуживание компании" #NT!
 nd_gbu_drill_yard_upkeep_desc: "Зарплата, средства передвижения, оборудование и полевая подготовка постоянных рот ордонанса." #NT!
 nd_gbu_mechelen_cannons: "Литье бронзовых пушек" #NT!
 nd_gbu_mechelen_cannons_desc: "Отливка бронзовых пушек для бургундского артиллерийского поезда: бомбарды, серпантины и фальконеты по образцу Мехелена." #NT!
 nd_gbu_bourse_upkeep: "Биржевой клиринг" #NT!
 nd_gbu_bourse_upkeep_desc: "Клиринг векселей, облигаций и счетов на Антверпенской бирже, где ежедневно устанавливается европейская цена на каждый продаваемый товар." #NT!
 nd_gbu_textile_mill_weaving: "Механизированная ткань" #NT!
 nd_gbu_textile_mill_weaving_desc: "Механизированное прядение и ткачество из хлопка или шерсти в промышленных масштабах в традициях Гента и Вервье." #NT!
  
  # === Unit Names === 
 a_nd_gbu_crossbowman: "Бургундский арбалетчик" #NT!
 a_nd_gbu_crossbowman_desc: "Городской арбалетчик гильдии Синт-Йорис. Дисциплинированная, хорошо оснащенная стрелковая пехота тканевых городов, каждое воскресенье тренирующаяся в Попинджае и готовая взять стену в бою." #NT!
 a_nd_gbu_flemish_pikeman: "Фламандский пикинер" #NT!
 a_nd_gbu_flemish_pikeman_desc: "Городское пикинное ополчение Нидерландов. Та же самая общинная пехота, которая сломила французское рыцарство при Куртре, теперь тренировалась на площади эпохи Возрождения." #NT!
 a_nd_gbu_gendarme: "Бургундский жандарм" #NT!
 a_nd_gbu_gendarme_desc: "Тяжелая кавалерия роты ордонанса: полный доспех, конь в доспехах, копье наготове. Гордость Карла Смелого и самая профессиональная ударная кавалерия конца пятнадцатого века." #NT!
 a_nd_gbu_coulevrinier: "Кулевринье" #NT!
 a_nd_gbu_coulevrinier_desc: "Бургундский стрелок, вооруженный кулевриной: ранняя аркебуза на длинном прикладе. Набранный из городского ополчения, мост между арбалетом и мушкетом." #NT!
  
  # === Levy Names === 
 levy_nd_gbu_crossbowman: "Арбалет Леви" #NT!
 levy_nd_gbu_crossbowman_desc: "Сбор от городских гильдий арбалетчиков тканевых городов." #NT!
 levy_nd_gbu_flemish_pikeman: "Пикимен Леви" #NT!
 levy_nd_gbu_flemish_pikeman_desc: "Сбор с бюргерских ополчений Нидерландов." #NT!
  
  # === Variable Tooltip Localization === 
 nd_gbu_formed_tt: "Образована Большая Бургундия" #NT!
 nd_gbu_path_a_tt: "Путь Франко-Имперского королевства" #NT!
 nd_gbu_path_b_tt: "Путь Королевства поместий" #NT!
  
  # === Additional advance loc === 
 nd_gbu_burgundian_painting: "Фламандская живопись" #NT!
 nd_gbu_burgundian_painting_desc: "Гентский алтарь Ван Эйка, портреты Ван дер Вейдена, Мемлинг и Баутс, фламандские примитивисты создают континентальную школу искусства, реализм, техника масла и религиозная интенсивность которой становятся стандартом европейской живописи." #NT!
 nd_gbu_dunkirk_privateers: "Каперы Бургундского канала" #NT!
 nd_gbu_dunkirk_privateers_desc: "Каперские грамоты, выданные в Дюнкерке, Остенде и Ньюпорте. Бургундские корсары преследуют английские и французские корабли в Ла-Манше и Северном море, прикрывая торговлю королевства во время войны." #NT!
  
  # === Walloon Coal Basin === 
 nd_gbu_walloon_coal: "Валлонский угольный бассейн" #NT!
 nd_gbu_walloon_coal_desc: "Угольный пояс Самбре-Маас: Шарлеруа, Монс, Боринаж. Богатейшее угольное месторождение континентальной Европы и основа тяжелой промышленности Бельгии." #NT!
 nd_gbu_walloon_coalworks: "Угольный завод Самбре-Маас" #NT!
 nd_gbu_walloon_coalworks_desc: "Карьер индустриальной эпохи, добывающий уголь из Валлонского бассейна. Шарлеруа, Монс и Боринаж стимулируют индустриализацию королевства." #NT!
 nd_gbu_walloon_coal_mining: "Добыча угля" #NT!
 nd_gbu_walloon_coal_mining_desc: "Карьерная добыча битуминозного угля из пластов Самбре-Маас, сердце континентального промышленного топлива." #NT!
  
  # === Destiny Tree === 
 nd_gbu_destiny: "Лотарингский вопрос" #NT!
 nd_gbu_destiny_desc: "Корона поставлена; Королевство образовано. Но длинная дуга власти Бургундии предполагает две судьбы. Восстановите Лотарингское Срединное королевство в качестве государства-преемника Франкской империи, оспаривая имперский титул за Рейном, или расширьте королевство в сторону моря, превратив его в финансовый центр Атлантической Европы, биржу бирж. Поддерживайте стабильность, пока королевство выбирает свой курс." #NT!
  
 nd_gbu_dest_rhineland_frontier: "Рейнская граница" #NT!
 nd_gbu_dest_rhineland_frontier_desc: "Держите хребет старого Срединного царства Лотаря. Трир, где когда-то был воздвигнут пурпур Константина; Ахен, где похоронен Карл Великий и где коронуются короли Священной Римской империи. Два города, один проект: сердце Каролингов, возвращенное бургундской короной." #NT!
 nd_gbu_dest_imperial_march: "Имперский марш" #NT!
 nd_gbu_dest_imperial_march_desc: "Вгоните бургундские штандарты глубже в имперскую землю. Кёльн, великий вольный город на Рейне; Майнц, резиденция выборщика-архиепископа; Клеве, удерживающий Нижний Рейн от моря. Королевство становится доминирующей Рейнской державой." #NT!
 nd_gbu_dest_imperial_title: "Корона Цезаря Лотария" #NT!
 nd_gbu_dest_imperial_title_desc: "Удерживайте города, в которых создана Империя: Франкфурт – избирательный центр, Вормс – диетический город, Нюрнберг – хранитель Рейхскляйнодиен. Бургундская корона больше не является королевством среди королевств, а является наследницей самой Франкской Империи. Цезарь Лотарий едет во главе войска, и печатные станки поют ему хвалу по всему христианскому миру." #NT!
  
 nd_gbu_dest_channel_mastery: "Мастерство канала" #NT!
 nd_gbu_dest_channel_mastery_desc: "Состязайтесь в западных водах. Дувр командует проливом; Руан Сена; Портсмут Солент. Бургундский морской флот утверждает господство над путями, по которым одежда Нидерландов доставляется на все рынки Атлантической Европы." #NT!
 nd_gbu_dest_atlantic_outposts: "Атлантические аванпосты" #NT!
 nd_gbu_dest_atlantic_outposts_desc: "Установите бургундский флаг на островах за западным горизонтом. Азорские острова посреди океана; Мадейра на африканском побережье. Королевство берет свои первые колонии с видом на океан и вступает в Эпоху Великих географических открытий на своих условиях, имея за собой суконные цеха и Антверпен в качестве биржи." #NT!
 nd_gbu_dest_world_bourse: "Всемирная биржа" #NT!
 nd_gbu_dest_world_bourse_desc: "Антверпен становится финансовым сердцем Атлантической Европы. Перец из Индии и шелк с Востока продаются на бургундской бирже; векселя, выписанные в Генуе и Флоренции, оплачиваются здесь по бургундским курсам. Королевство стало тем, чем оно всегда хотело быть: торговцем торговцев, мировой расчетной палатой." #NT!
  
  # === Destiny DHE Events === 
 nd_gbu.8.t: "Корона Лотаря восстановлена" #NT!
 nd_gbu.8.d: "Церемония присоединения завершена; корона наконец покоится на бургундском челе. В каждой суконной галерее и в каждой жандармской казарме, на бюргерских рынках Антверпена и винных погребах Бона королевство подводит итоги. Столетие терпеливых собраний (Филиппа Смелого, Иоанна Бесстрашного, Филиппа Доброго, Карла Смелого) наконец привело к созданию суверенного государства.\n\nОднако теперь долгий путь разветвляется. Царство должно выбрать свою судьбу." #NT!
 nd_gbu.8.a: "Позвольте выбранному пути раскрыться." #NT!
  
 nd_gbu.9.t: "Каролингский Хартленд" #NT!
 nd_gbu.9.d: "Трир и Аахен взяты. Константин Великий когда-то заседал двор в Порта Нигра; кости Карла Великого лежат под куполом Палатинской капеллы. Над обоими городами развеваются бургундские штандарты. Хроника королевства теперь читается как хроника старого Поднебесной: земли Лотаря I восстановлены, императорская мантия надета на бургундское плечо. Compagnies d'ordonnance едут на восток по римским дорогам." #NT!
 nd_gbu.9.a: "Лотарингская корона поднимается." #NT!
  
 nd_gbu.10.t: "Имперский марш" #NT!
 nd_gbu.10.d: "Кельн, Майнц и Клеве падают под натиском бургундцев. Вольный город на Рейне, резиденция выборщика-архиепископа и епископство Нижнего Рейна объединены в королевство. Императорский сейм находится в панике; Посланники Габсбургов разъезжают между дворами в поисках союзников; Коллегия выборщиков дрожит.\n\nКороль должен решить, как управлять этим завоеванным маршем. Налейте золото в военный сундук: продвиньте кампанию глубже, возьмите Империю штурмом. Или начать переговоры с сеймом: предложить побежденным принцам места в высшем суде Бургундии, интегрировать их посредством политической сделки, а не меча." #NT!
 nd_gbu.10.a: "Военный сундук: продвигайте кампанию на восток." #NT!
 nd_gbu.10.b: "Увертюра к сейму: связать побежденных князей сделкой." #NT!
  
 nd_gbu.11.t: "Цезарь Лотарий коронован" #NT!
 nd_gbu.11.d: "Франкфурт, Вормс и Нюрнберг летают по бургундскому маршруту. Вольные города Империи удерживаются; избирательным местом, на котором избираются короли Священной Римской империи, является Бургундский; Reichskleinodien (императорские регалии) находятся в руках Бургундии. Цезарь Лотарий — это новый стиль: бургундско-лотарингский наследник Карла Великого, Цезарь восстановленного Франкского Срединного королевства.\n\nКоронация — дело нескольких месяцев. Будет ли это отмечено как триумф оружия, когда роты жандармов разъезжают по ликующим улицам Франкфурта? Или в качестве триумфа власти воздвигнута в Аахене небная капелла, а бургундский двор станет новой императорской резиденцией?" #NT!
 nd_gbu.11.a: "Триумф оружия: парад хозяина по Франкфурту." #NT!
 nd_gbu.11.b: "Триумф власти: в Аахене установлен небный двор." #NT!
  
 nd_gbu.12.t: "Мастерство канала" #NT!
 nd_gbu.12.d: "Взяты Дувр, Руан и Портсмут. Дуврский пролив, устье Сены, Солент и западный Ла-Манш: во всех трех местах бургундский флот стоит на якоре. Ткань, вино, рыба и векселя теперь передвигаются под бургундским конвоем из Ла-Манша в Северное море. Королевство стало морской державой." #NT!
 nd_gbu.12.a: "Бургундский канал." #NT!
  
 nd_gbu.13.t: "Атлантические аванпосты" #NT!
 nd_gbu.13.d: "Азорские острова и Мадейра летают на корабле Святого Андрея. Бургундские факторы ведут бухгалтерию в Понта-Делгада; Бургундские сахарные заводы измельчают тростник в Фуншале. Королевство вступило в эпоху Великих географических открытий, за которым следуют суконные цеха и Антверпен в качестве биржи.\n\nКак будут управляться новые аванпосты? В качестве королевских экспедиций: бургундские аргонавты под командованием короны, морские исследователи на королевской службе. Или что касается чартерной торговли: буржуазные инвесторы в руках сословий, которые могут свободно расширять территорию королевства настолько, насколько ветер несет их корабли." #NT!
 nd_gbu.13.a: "Аргонавты: морские экспедиции под короной." #NT!
 nd_gbu.13.b: "Уставы: буржуазные торговые концерны при сословиях." #NT!
  
 nd_gbu.14.t: "Мировая биржа" #NT!
 nd_gbu.14.d: "Антверпен – это координационная палата Атлантики. Перец, шелк, серебро, медь, сахар и векселя проходят клиринг на Бургундской бирже. Итальянские банкирские дома продолжают считать офисы на Меире; корреспонденты Фуггера в Аугсбурге следят за ценами в Антверпене; испанский серебряный флот переходит к бургундским факторам.\n\nПоследний вопрос: должна ли биржа стать настоящей расчетной палатой всей Европы (надежным расчетным механизмом для долгов каждого принца и векселей купцов) или же она станет штаб-квартирой атлантической флорибунды, королевства, расширяющего свое колониальное влияние настолько, насколько позволит его флот?" #NT!
 nd_gbu.14.a: "Клиринговая палата: биржа рассчитывает долги Европы." #NT!
 nd_gbu.14.b: "Атлантическая флорибунда: колониальная территория растет в сторону моря." #NT!
  
  # === Destiny Timed Modifiers === 
 STATIC_MODIFIER_NAME_nd_gbu_dest_rhineland_war_chest: "Рейнский военный сундук" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_rhineland_war_chest: "Казначейство, монетный двор и сборщики налогов — все поддержали имперскую кампанию. Жандармские роты едут на новые сборы; Бомбардировочный поезд катится на восток. Королевство платит за войну монетами и инфляцией, но война выигрывается." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_dest_imperial_diet_overture: "Увертюра к императорскому сейму" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_imperial_diet_overture: "Побежденные принцы вызываются в высокий суд Бургундии. Гарнизоны удерживают города; хартии и клятвы объединяют местную знать путем сделки, а не меча. Марш связан с королевством политической вязью, а не только военной силой." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_dest_caesar_lotharius: "Цезарь Лотарий" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_caesar_lotharius: "Бургундский король носит императорское достоинство. Хозяин марширует по Франкфурту под салтиром; бомбардировки объявляют о победе на каждом избирательном участке; хроники пишут о Цезаре Лотарии как о возрожденном Карле Великом." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_dest_palatine_court: "Палатинский суд" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_palatine_court: "Палатинская капелла Ахена восстановлена ​​как новая императорская резиденция. Бургундский двор обосновался среди останков Карла Великого; строительные площадки по всему королевству возводят соответствующие дворцы." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_dest_burgundian_argonauts: "Бургундские аргонавты" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_burgundian_argonauts: "Королевские экспедиции плывут под парусами: исследователи на королевской службе, военно-морские эскадры, составляющие карты Атлантики. Флот тренируется, верфи работают, королевство поворачивается лицом к западному горизонту." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_charters: "Атлантические Чартеры" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_charters: "Буржуазные инвесторы Антверпена и Брюгге приобретают королевские грамоты и создают собственные предприятия. Торговый диапазон расширяется; Торговые дома хранят книги за тремя океанами. Влияние королевства растет благодаря частному капиталу, хотя отдаленные аванпосты ослабляют узы лояльности." #NT!
  
 STATIC_MODIFIER_NAME_nd_gbu_dest_clearing_house_europa: "Информационная палата Европы" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_clearing_house_europa: "Антверпен погашает долги Европы. Итальянские банкиры, аугсбургские купцы, испанский серебряный флот, английские торговцы — все ведут здесь счета. Биржа является надежным механизмом расчетов по векселям каждого принца." #NT!
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_floribunda: "Атлантическая Флорибунда" #NT!
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_floribunda: "Королевство расцветает за Атлантикой. Бургундские паруса заполонили колониальные маршруты; коренное население аванпостов вовлечено в торговлю королевства. Новые земли поглощают армии, но богатство, которое они приносят, не поддается учету." #NT!
  
  # === Destiny Buildings === 
 nd_gbu_carolingian_palatium: "Каролингский дворец" #NT!
 nd_gbu_carolingian_palatium_desc: "Палатинская капелла и королевская резиденция в каролингском стиле: восьмиугольный неф, мраморные колонны, мозаика византийского образца. Создан по образцу дворца Карла Великого в Ахене и стал архитектурной печатью восстановленной Лотарингской Империи." #NT!
 nd_gbu_world_bourse: "Всемирная биржа" #NT!
 nd_gbu_world_bourse_desc: "Расширение Антверпенской биржи в настоящую глобальную клиринговую палату. Здесь ежедневно проходят векселя, облигации, товары и денежные переводы серебра из трех океанов. Биржа является финансовой опорой атлантического мира." #NT!
  
  # === Destiny PMs === 
 nd_gbu_palatium_upkeep: "Содержание Палатина" #NT!
 nd_gbu_palatium_upkeep_desc: "Торжественное содержание императорской палатинской капеллы: свечи, облачения, процессионные регалии и ежедневная литургия бургундского цезаря." #NT!
 nd_gbu_world_bourse_upkeep: "Мировая очистка" #NT!
 nd_gbu_world_bourse_upkeep_desc: "Клиринг векселей, облигаций и счетов на Всемирной бирже, где рассчитывается европейская цена каждого торгуемого товара и каждого долга принца." #NT!
  
  # === Bureaucracies === 
 AUTO_MODIFIER_NAME_nd_gbu_bureaucracy_authority: "Бургундская композитная администрация" #NT!
 AUTO_MODIFIER_DESC_nd_gbu_bureaucracy_authority: "Бургундское государство объединяет семнадцать провинций под одной судебной канцелярией. Королевский совет может содержать два постоянных учреждения в дополнение к учреждению столицы." #NT!
  
 gbu_etats_generaux_bureaucracy: "Etats Generaux de Bourgogne" #NT!
 gbu_etats_generaux_bureaucracy_desc: "Постоянный представительный сейм Бургундской дуги, впервые созванный в Брюгге Филиппом Добрым в январе 1464 года как единое собрание трех сословий всех его земель. Там, где Генеральные штаты Франции заседали по призыву короля и расходились по его желанию, бургундские Генеральные штаты стали постоянным конституционным партнером: король не мог нанимать помощников без их согласия, а Великая привилегия 1477 года закрепила их право созывать себя самостоятельно. Это учреждение было прямым предшественником Генеральных штатов Голландской Республики." #NT!
  
 gbu_toison_dor_bureaucracy: "Орден Золотой Туазон" #NT!
 gbu_toison_dor_bureaucracy_desc: "Орден Золотого руна, основанный в Брюгге 10 января 1430 года Филиппом Добрым в день его свадьбы с Изабеллой Португальской. Двадцать четыре рыцаря при основании (до тридцати одного в 1432 году и до пятидесяти одного при Карле V), каждый великий дом бургундского наследства был связан с династией личной рыцарской клятвой. Гербовый реестр ведет Герольдмейстер; Статуты регулируют отделения, изгнание и наследование киосков. Одновременно рыцарский корпус, дипломатический инструмент и политический механизм привязки высшей знати к магистратскому дому." #NT!
  
 gbu_chambre_des_comptes_bureaucracy: "Счетная палата Лилля" #NT!
 gbu_chambre_des_comptes_bureaucracy_desc: "Бургундская финансовая счетная палата, основанная в Лилле в 1386 году Филиппом Смелым (брюссельская палата была добавлена ​​в 1404 году для Брабантских владений, а с 1473 года аудиторская работа постепенно централизовалась в Мехелене при Карле Смелом). Его аудиторы и казначеи проверяют все доходы поместий, таможенных ферм и феодальных помощников во всех королевских землях; Серебряная монета Бургундии гросс устанавливает денежный стандарт всего королевства. К середине пятнадцатого века это была одна из самых дисциплинированных казначейских бюрократий в Латинской Европе." #NT!
  
 gbu_grand_conseil_malines_bureaucracy: "Большой совет Малина" #NT!
 gbu_grand_conseil_malines_bureaucracy_desc: "Высший судебный совет и канцелярия Бургундских Нидерландов, созданный указом Карла Смелого от 8 декабря 1473 года в Мехелене в качестве центрального суда последней инстанции для семнадцати провинций. Он рассматривает апелляции провинциальных советов Голландии, Брабанта, Фландрии и Эно; скрепляет постановления магистратов; и обходит сеньорские суды высшего дворянства. Институциональный предшественник брюссельских центральных советов Габсбургских Нидерландов." #NT!
