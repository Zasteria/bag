l_russian:
 STATIC_MODIFIER_NAME_nd_lords_of_the_calendar: "Лорды календаря" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_calendar: "Майя — хранители самого времени. Благодаря поколениям астрономических наблюдений и математической точности наши дневные хранители наносили на карту движения Венеры, предсказывали затмения и вплетали священный календарь во все аспекты управления и повседневной жизни. Это мастерство небесных знаний ведет наш народ вперед." #NT!
 STATIC_MODIFIER_NAME_nd_confederation_of_the_halach_uinic: "Конфедерация Галах-Уйник" #NT!
 STATIC_MODIFIER_DESC_nd_confederation_of_the_halach_uinic: "Истинные властители земель майя высказались в один голос. Под властью Халаха Уйника, Истинного Человека, разбросанные города-государства объединились в конфедерацию с общей целью. Наши голканские воины готовы, наши военные лидеры Накома выбраны, и по белым дорогам идут марши объединенных армий." #NT!
 nd_may.1.t: "Воссоединение майя" #NT!
 nd_may.1.d: "На протяжении поколений мир майя представлял собой мозаику соперничающих городов-государств, наследие краха Майяпана, войн между киче и какчикелями, амбиций дюжины мелких лордов. Теперь, благодаря завоеваниям и дипломатии, разбросанные государства майя были объединены под единой властью. Дороги сакбе соединяют наши города, обсерватории отслеживают звезды, а хранители кодексов записывают наши законы. Но какое видение будет руководить этим воссоединившимся царством майя? Будем ли нас помнить как наследников небесной мудрости наших предков, цивилизации, чьи календарь, письменность и астрономические знания сделали их учеными Америки? Или нам стоит создать военную конфедерацию в традициях великого Халаха Уйника, объединив наших воинов в армию, которая сможет защитить сердце майя от любого, кто бросит нам вызов?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_may.1.a: "Мы – хранители времени и знаний." #NT!
 nd_may.1.b: "Истинные Люди будут править как один." #NT!
 nd_may.2.t: "Наследие Пополь Вух" #NT!
 nd_may.2.d: "Пополь Вух, Книга Общины, была сохранена и преподана новому поколению. Это священное повествование майя киче повествует о сотворении мира, подвигах героев-близнецов Хунахпу и Шбаланке в подземном мире Шибальбы и о происхождении народа киче из белой и желтой кукурузы. Это больше, чем история, это основа космологии, морали и идентичности майя. Хранители этой мудрости теперь задаются вопросом, как она должна формировать нашу нацию. Будет ли «Пополь-Вух» служить источником знаний, а его астрономические наблюдения, сельскохозяйственная мудрость и философские идеи будут продвигать наших ученых вперед? Или оно должно послужить объединяющим вероучением, мифом о его создании и героическим сказаниями, объединяющими наши разнообразные народы в одну идентичность?" #NT!
 nd_may.2.a: "Пусть его мудрость осветит наших ученых." #NT!
 nd_may.2.b: "Пусть его истории свяжут наш народ воедино." #NT!
 nd_may.3.t: "Обновление Лиги" #NT!
 nd_may.3.d: "Лига Майяпана когда-то объединила великие семьи Юкатана под общим советом: Коком, Сю, Чел и другие, собиравшиеся вместе, чтобы разрешать споры, координировать торговлю и планировать защиту от посторонних. Когда около 1448 года Майяпан пал из-за внутреннего предательства, Лига распалась на шестнадцать соперничающих провинций, и последовало столетие братоубийственной войны. Теперь, когда города майя воссоединились, возникает вопрос: восстановим ли мы централизованную власть Лиги с единой правящей палатой, управляющей делами всех провинций? Или нам следует принять более свободную федерацию, в которой каждая провинция сохраняет свою автономию под управлением общего совета равных?" #NT!
 nd_may.3.a: "Один дом должен руководить всеми остальными." #NT!
 nd_may.3.b: "Совет равных выстоит." #NT!
 nd_may.4.t: "Лорды какао" #NT!
 nd_may.4.d: "Для майя какао — это больше, чем просто урожай: это валюта, ритуальное подношение, дипломатический подарок и напиток королей. Огромные плантации какао в Табаско и на побережье Соконуско сделали своих лордов сказочно богатыми, а какао-бобы циркулируют в качестве денег по всей Мезоамерике. Морские торговцы побережья Юкатана везут какао на своих огромных каноэ из Шикаланго в Гондурас и за его пределы. Теперь наше объединенное королевство должно решить, как использовать это богатство какао. Должны ли мы сделать приоритетом экспортную торговлю, отправив наше какао на зарубежные рынки и привлекая их товары к нашим берегам? Или нам следует официально оформить какао-бобы в качестве официальной валюты королевства, стабилизируя нашу экономику с помощью этого универсально ценимого товара?" #NT!
 nd_may.4.a: "Пусть наши каноэ несут какао по всему миру." #NT!
 nd_may.4.b: "Какао станет валютой королевства." #NT!
 nd_may.5.t: "Зов Холкана" #NT!
 nd_may.5.d: "Холканы, каста профессиональных воинов майя, ведут свои традиции в глубь веков. В отличие от призывников-фермеров, которые сражаются в большинстве армий, голканы являются полноправными солдатами: с юности обучены военному искусству, организованы под командованием избранных военных лидеров Наком и удостоены статуса, который ставит их в число элиты общества майя. Их стеганые из хлопка доспехи ичкауипилли доказали свою эффективность против обсидиановых клинков и европейских мушкетных пуль на близком расстоянии. Их тактика ведения войны в джунглях, засады в густых лесах, скоординированные ночные рейды, разрушительное использование копьеметов атлатль расстраивали захватчиков на протяжении нескольких поколений. С образованием государства майя традиция Холканов официально стала основой нашей армии." #NT!
 nd_may.5.a: "Холкан защитит наш народ." #NT!
 STATIC_MODIFIER_NAME_nd_may_popol_vuh_wisdom: "Мудрость героев-близнецов" #NT!
 STATIC_MODIFIER_DESC_nd_may_popol_vuh_wisdom: "Астрономические и философские идеи Пополь Вух ведут наших ученых к более глубокому пониманию." #NT!
 STATIC_MODIFIER_NAME_nd_may_popol_vuh_unity: "Дети кукурузы" #NT!
 STATIC_MODIFIER_DESC_nd_may_popol_vuh_unity: "История создания киче, согласно которой человечество было создано из белой и желтой кукурузы, объединяет наши разнообразные народы общей идентичностью." #NT!
 STATIC_MODIFIER_NAME_nd_may_league_centralize: "Восстановленная власть" #NT!
 STATIC_MODIFIER_DESC_nd_may_league_centralize: "Централизованная власть единого правящего дома приносит порядок и стабильность в провинциях майя." #NT!
 STATIC_MODIFIER_NAME_nd_may_league_federate: "Совет равных" #NT!
 STATIC_MODIFIER_DESC_nd_may_league_federate: "Федерация автономных провинций, объединенных общим советом, сохраняет разнообразие и лояльность народов майя." #NT!
 STATIC_MODIFIER_NAME_nd_may_cacao_export: "Торговые пути какао" #NT!
 STATIC_MODIFIER_DESC_nd_may_cacao_export: "Наши морские и сухопутные торговцы доставляют какао на рынки Мезоамерики и за ее пределы." #NT!
 STATIC_MODIFIER_NAME_nd_may_cacao_currency: "Стандарт бобов" #NT!
 STATIC_MODIFIER_DESC_nd_may_cacao_currency: "Какао-бобы служат универсальным средством обмена, стабилизируя торговлю во всем нашем мире." #NT!
 nd_may_holcan_tradition: "Холканские воины" #NT!
 nd_may_holcan_tradition_desc: "Холканы — профессиональная каста воинов майя, солдаты, обученные с юности, вооруженные обсидиановым оружием и защищенные хлопчатобумажными доспехами." #NT!
 nd_may_sacbe_trade_roads: "Торговые дороги Сакбе" #NT!
 nd_may_sacbe_trade_roads_desc: "Сакбе, возвышенные известняковые дороги, соединяют города майя через джунгли, позволяя торговым караванам путешествовать даже в сезон дождей." #NT!
 nd_may_milpa_agriculture: "Милпа Сельское хозяйство" #NT!
 nd_may_milpa_agriculture_desc: "Система совмещения кукурузы, фасоли и тыквы милпа поддерживает плотную популяцию майя в тропических низменностях." #NT!
 nd_may_hieroglyphic_writing: "Иероглифическое письмо" #NT!
 nd_may_hieroglyphic_writing_desc: "Иероглифическое письмо майя, единственная полностью развитая система письменности доколумбовой Америки, записывает историю, астрономию и законы о каменных памятниках и кодексах из коры бумаги." #NT!
 nd_may_astronomical_tradition: "Астрономическая традиция" #NT!
 nd_may_astronomical_tradition_desc: "Астрономы майя отслеживают циклы Венеры, предсказывают затмения и калибруют священный календарь с поразительной точностью с помощью специальных каменных обсерваторий." #NT!
 nd_may_halach_uinic_governance: "Управление Халах-Уйник" #NT!
 nd_may_halach_uinic_governance_desc: "Халах Уиник, Истинный Человек, управляет государством майя по совету знати Ах Куч Каб, уравновешивая власть лордов городов-государств." #NT!
 nd_may_ichcahuipilli_craft: "Ичкауипилли Ремесло" #NT!
 nd_may_ichcahuipilli_craft_desc: "Оружейники майя производят ичкауипилли — стеганые хлопковые бронежилеты, пропитанные рассолом, которые обеспечивают эффективную защиту от обсидианового оружия и даже раннего огнестрельного оружия." #NT!
 nd_may_obsidian_mastery: "Обсидиановое мастерство" #NT!
 nd_may_obsidian_mastery_desc: "Оружейники майя достигают мастерства в изготовлении из обсидиана острых как бритва лезвий для макуауитля — разрушительного меча с зубцами из вулканического стекла." #NT!
 nd_may_mayapan_league: "Лига Маяпана" #NT!
 nd_may_mayapan_league_desc: "Лига Майяпана объединила великие семьи Юкатана под общим советом, обеспечив коллективное управление торговлей, обороной и законом." #NT!
 nd_may_maritime_canoes: "Морские военные каноэ" #NT!
 nd_may_maritime_canoes_desc: "Огромные каноэ майя, способные перевозить сорок человек и огромное количество торговых товаров, господствуют в прибрежных водах от Шикаланго до Гондураса." #NT!
 nd_may_popol_vuh: "Пополь Вух" #NT!
 nd_may_popol_vuh_desc: "Священная Книга Сообщества хранит повествование о творении киче, подвигах героев-близнецов и генеалогию лордов майя." #NT!
 nd_may_cacao_economy: "Какао Экономика" #NT!
 nd_may_cacao_economy_desc: "Какао-бобы служат одновременно валютой, ритуальным подношением и предметом роскоши, основой коммерческой жизни майя." #NT!
 nd_may_pyramid_architecture: "Пирамидальная архитектура" #NT!
 nd_may_pyramid_architecture_desc: "Великие ступенчатые пирамиды майя служат храмами, астрономическими обсерваториями и символами божественной власти, связанными с небесными событиями." #NT!
 nd_may_nacom_command: "Командование Наком" #NT!
 nd_may_nacom_command_desc: "Наком, избранные военные лидеры, избирающиеся на трехлетний срок, руководят военными кампаниями майя и председательствуют на ежегодных военных обрядах в месяце Пакс." #NT!
 nd_may_kiche_expansion: "Расширение Киче" #NT!
 nd_may_kiche_expansion_desc: "Агрессивное государство Киче завоевало большую часть горной местности Гватемалы посредством быстрых военных кампаний, создав модель имперской войны майя." #NT!
 nd_may_atlatl_warfare: "Атлатль Война" #NT!
 nd_may_atlatl_warfare_desc: "Копьемет атлатл позволяет застрельщикам майя метать дротики с разрушительной силой и точностью, укрывшись в густых джунглях." #NT!
 nd_may_codex_tradition: "Кодекс традиции" #NT!
 nd_may_codex_tradition_desc: "Писцы майя записывали астрономические таблицы, религиозные ритуалы и исторические хроники на кодексах из коровой бумаги, сложенных, как ширмы аккордеона." #NT!
 nd_may_highland_diplomacy: "Хайлендская дипломатия" #NT!
 nd_may_highland_diplomacy_desc: "Сложная сеть союзов, браков и соперничества между горными королевствами майя, Киче, Какчикель, Цутуджил и Мам, усовершенствовала искусство государственного управления майя." #NT!
 nd_may_coastal_trade_ports: "Прибрежные торговые порты" #NT!
 nd_may_coastal_trade_ports_desc: "Такие порты, как Тулум, Ксикаланго и Нако, служат перевалочными пунктами, где сходятся морские и сухопутные торговые пути, через которые проходят обсидиан, нефрит, соль и какао." #NT!
 nd_may_fortified_acropolis: "Укрепленный Акрополь" #NT!
 nd_may_fortified_acropolis_desc: "Города майя строят укрепленные акрополи, возвышенные цитадели с оборонительными стенами и башнями, чтобы защитить свои правящие семьи и храмовые комплексы." #NT!
 nd_may_holcan_veterans_tradition: "Холканская ветеранская традиция" #NT!
 nd_may_holcan_veterans_tradition_desc: "Самые опытные голканские воины составляют элитный состав, их боевые знания передаются через тщательную подготовку в бою в джунглях и обороне от осады." #NT!
 nd_may_jungle_resistance: "Сопротивление джунглей" #NT!
 nd_may_jungle_resistance_desc: "Густые джунгли центра майя становятся оружием против захватчиков, болезни, жара и засады поглощают армии, которые осмеливаются войти без приглашения." #NT!
 nd_may_batab_administration: "Администрация Батаба" #NT!
 nd_may_batab_administration_desc: "Батаб, местные губернаторы, назначаемые Халахом Уиником, отправляют правосудие, собирают дань и поддерживают порядок в каждой провинции майя." #NT!
 nd_may_salt_trade_expansion: "Расширение торговли солью" #NT!
 nd_may_salt_trade_expansion_desc: "Соляные пласты северного побережья Юкатана производят продукт, необходимый для каждой мезоамериканской кухни, что делает торговцев солью одними из самых богатых в мире майя." #NT!
 nd_may_defensive_confederacy: "Оборонительная Конфедерация" #NT!
 nd_may_defensive_confederacy_desc: "Столкнувшись с внешними угрозами, города-государства майя официально заключают пакты о взаимной обороне, объединяя свои войска под общим командованием, когда на кого-либо из членов нападает." #NT!
 nd_may_calendar_keepers: "Хранители календаря" #NT!
 nd_may_calendar_keepers_desc: "Дневные хранители поддерживают священные 260-дневные календари Цолькин и 365-дневный Хааб, синхронизируя их с 52-летним календарным циклом, который управляет ритуальной и политической жизнью." #NT!
 nd_may_itza_independence: "Ица Независимость" #NT!
 nd_may_itza_independence_desc: "Ица-майя в Таясале на озере Петен-Ица ​​сохраняли свою независимость до 1697 года, последнего непокоренного государства майя, что является свидетельством устойчивости цивилизации майя." #NT!
 nd_may_lacustrine_warfare: "Озерная война" #NT!
 nd_may_lacustrine_warfare_desc: "Майя, живущие на озерах Петен, мастерски ведут войну на воде, используя флот каноэ, чтобы контролировать берега озер и не давать захватчикам использовать водные пути." #NT!
 nd_may_tribute_system: "Система дани" #NT!
 nd_may_tribute_system_desc: "Подчиненные сообщества доставляют в правящий город какао, хлопок, нефрит, перья и рабочую силу, поддерживая элиту майя и финансируя общественные работы." #NT!
 nd_may_forest_fortifications: "Лесные укрепления" #NT!
 nd_may_forest_fortifications_desc: "Частоколы, рвы и скрытые оборонительные сооружения сливаются с лесным ландшафтом, создавая многоуровневые укрепления, использующие ландшафт джунглей." #NT!
 nd_may_ch_orti_military: "Чорти Военный" #NT!
 nd_may_ch_orti_military_desc: "Чорти-майя, живущие в юго-восточных нагорьях, сохраняют жестокие военные традиции, их воины славятся дисциплинированной пехотной тактикой и боевыми действиями в горах." #NT!
 nd_may_syncretic_adaptation: "Синкретическая адаптация" #NT!
 nd_may_syncretic_adaptation_desc: "Прагматичные лидеры майя интегрируют иностранные идеи и практики в свои собственные традиции, сохраняя основную идентичность и одновременно адаптируясь к меняющемуся миру." #NT!
 nd_may_cultural_endurance: "Культурная выносливость" #NT!
 nd_may_cultural_endurance_desc: "Несмотря на столетия внешнего давления, язык майя, календарь, традиции ткачества и управление общиной остаются живой практикой, а не просто памятью." #NT!
 nd_may_modern_confederation: "Современная Конфедерация" #NT!
 nd_may_modern_confederation_desc: "Государство майя включает в себя современные структуры управления, сохраняя при этом принцип принятия решений на основе советов, который служил майя на протяжении тысячелетий." #NT!
 nd_may_agricultural_renewal: "Обновление сельского хозяйства" #NT!
 nd_may_agricultural_renewal_desc: "Новые методы ведения сельского хозяйства дополняют древнюю систему милпа, повышая урожайность и сохраняя при этом мудрость фермеров майя по совмещению культур." #NT!
 nd_may_maya_national_identity: "Национальная идентичность майя" #NT!
 nd_may_maya_national_identity_desc: "Чувство общей идентичности майя выходит за рамки старого соперничества между городами и государствами, объединяя разнообразные языковые сообщества под общим цивилизационным наследием." #NT!
 nd_may_reforged_army: "Перекованная армия" #NT!
 nd_may_reforged_army_desc: "Военные майя применяют современную тактику и методы обучения, сохраняя при этом традиции ведения войны в джунглях, которые определяли боевые действия майя на протяжении веков." #NT!
 nd_may_trade_revival: "Возрождение торговли" #NT!
 nd_may_trade_revival_desc: "Древние торговые сети майя, когда-то перевозившие обсидиан, нефрит и какао по дорогам сакбе и прибрежным маршрутам каноэ, восстанавливаются и расширяются." #NT!
 a_nd_may_holcan_warriors: "Холканские воины" #NT!
 a_nd_may_holcan_warriors_desc: "Профессиональные воины майя, вооруженные копьями с обсидиановыми наконечниками и защищенные хлопчатобумажными доспехами, закаленными солью. Мастера засад в джунглях и ближнего боя." #NT!
 a_nd_may_obsidian_macemen: "Обсидиановая булава" #NT!
 a_nd_may_obsidian_macemen_desc: "Ударная пехота, владеющая макуауитлем, устрашающим деревянным мечом, усыпанным обсидиановыми лезвиями, способным обезглавить лошадь. Они наносят сильный удар, но носят легкую броню." #NT!
 a_nd_may_kiche_eagles: "Киче' Иглз" #NT!
 a_nd_may_kiche_eagles_desc: "Элитные воины военной традиции киче, известные быстрыми фланговыми перемещениями по труднопроходимой местности и молниеносными набегами на позиции противника." #NT!
 n_nd_may_war_canoe: "Боевое каноэ майя" #NT!
 n_nd_may_war_canoe_desc: "Огромные долбленые каноэ, способные вместить сорок воинов и их припасы. Быстрые и маневренные в прибрежных водах, они доминируют на торговых путях Карибского побережья." #NT!
 a_nd_may_holcan_veterans: "Холкан Ветераны" #NT!
 a_nd_may_holcan_veterans_desc: "Опытные голканские воины, пережившие множество кампаний. Их опыт ведения войны в джунглях, защиты от осад и скоординированных ночных рейдов делает их грозными противниками." #NT!
 a_nd_may_atlatl_skirmishers: "Атлатльские застрельщики" #NT!
 a_nd_may_atlatl_skirmishers_desc: "Легкие застрельщики, вооруженные копьеметалом атлатл, способным метать дротики со смертельной точностью, укрывшись в густом подлеске джунглей." #NT!
 levy_nd_may_holcan_warriors: "Холкан Воин Леви" #NT!
 levy_nd_may_holcan_warriors_desc: "Профессиональные голканские воины, выросшие из солдат и крестьян, вооруженные обсидиановым оружием и хлопчатобумажными доспехами." #NT!
 levy_nd_may_atlatl_skirmishers: "Атлатль-стрелок Леви" #NT!
 levy_nd_may_atlatl_skirmishers_desc: "Легкие застрельщики, набранные из крестьян, обученные использованию копьемета атлатль для ведения боевых действий в джунглях." #NT!
 levy_nd_may_holcan_veterans: "Холкан Ветеран Леви" #NT!
 levy_nd_may_holcan_veterans_desc: "Элитные воины-ветераны, выросшие из касты солдат, десятилетия боевого опыта в джунглях сделали их грозными защитниками." #NT!
 nd_may_sacbe_station: "Станция Sacbe Road" #NT!
 nd_may_sacbe_station_desc: "Перевалочная станция на возвышенных известняковых дамбах, соединяющих города майя, облегчающая торговлю и общение даже в сезон дождей." #NT!
 nd_may_observatory: "Обсерватория Майя" #NT!
 nd_may_observatory_desc: "Каменная башня с узкими окнами, расположенная по крайним положениям Венеры на горизонте, использовалась астрономами майя для калибровки священного календаря." #NT!
 nd_may_cacao_house: "Цех по переработке какао" #NT!
 nd_may_cacao_house_desc: "Завод, где какао-бобы ферментируют, сушат, обжаривают и измельчают в горькую шоколадную пасту, которая ценится во всей Мезоамерике как напиток, валюта и ритуальное подношение." #NT!
 nd_may_temple_pyramid: "Храм-Пирамида" #NT!
 nd_may_temple_pyramid_desc: "Массивная ступенчатая пирамида, увенчанная храмовым святилищем, связанная с астрономическими событиями и служащая религиозным и политическим центром города майя." #NT!
 nd_may_obsidian_workshop: "Обсидиановая мастерская" #NT!
 nd_may_obsidian_workshop_desc: "Мастерская, где опытные мастера придают импортированному вулканическому обсидиану острые как бритва лезвия, наконечники стрел и зубья боевого меча макуауитль." #NT!
 nd_may_cenote_shrine: "Сенот-святилище" #NT!
 nd_may_cenote_shrine_desc: "Священная святыня, построенная рядом с сенотом, естественной воронкой, обнажающей уровень подземных вод, где приносятся подношения богу дождя Чааку и его предкам." #NT!
 nd_may_ballcourt: "Майя Боллкорт" #NT!
 nd_may_ballcourt_desc: "Каменная площадка для священной игры в мяч, где команды соревнуются в ритуальном состязании, символизирующем победу Героев-близнецов над лордами Шибальбы. Политические союзы и споры разрешаются посредством священного спорта." #NT!
 nd_may_coastal_post: "Прибрежный торговый пост" #NT!
 nd_may_coastal_post_desc: "Портовый комплекс, где огромные каноэ загружаются какао, солью, обсидианом и хлопком для торговли вдоль Карибского и Тихоокеанского побережий Мезоамерики." #NT!
 nd_may_defensive_wall: "Защитная стена майя" #NT!
 nd_may_defensive_wall_desc: "Каменные стены и земляные валы, окружающие акрополь, укрепленные башнями и воротами, защищают правящую элиту и храмовый комплекс от осады." #NT!
 nd_may_salt_works: "Соляной завод" #NT!
 nd_may_salt_works_desc: "Прибрежные пруды-испарители и перерабатывающие предприятия, которые добывают соль из морской воды, продукта, необходимого для сохранения продуктов питания на всей территории Мезоамерики." #NT!
 nd_may_milpa_terrace: "Терраса Милпа" #NT!
 nd_may_milpa_terrace_desc: "Террасные участки на склоне холма, на которых используется древняя система совмещения кукурузы, фасоли и тыквы милпа, дополненная современными методами орошения." #NT!
 nd_may_forest_palisade: "Лесной Частокол" #NT!
 nd_may_forest_palisade_desc: "Скрытый оборонительный периметр из острых кольев и рвов, скрытый в джунглях, предназначенный для направления и замедления вторгающихся армий в подготовленные зоны поражения." #NT!
 nd_may_scribes_archive: "Архив писцов" #NT!
 nd_may_scribes_archive_desc: "Библиотека и школа, где писцов майя обучают иероглифическому письму и где хранятся рукописные кодексы, записывающие астрономию, историю и ритуалы." #NT!
 nd_may_sacbe_maintenance: "Техническое обслуживание Сакбе" #NT!
 nd_may_sacbe_maintenance_desc: "Уход за приподнятыми известняковыми дорогами требует постоянной замены покрытия жижей и штукатуркой, чтобы предотвратить вторжение джунглей." #NT!
 nd_may_observatory_upkeep: "Содержание обсерватории" #NT!
 nd_may_observatory_upkeep_desc: "Для обсерватории требуется каменный уход, корявая бумага для записи астрономических наблюдений и календарных расчетов, а также стекло для точных визиров." #NT!
 nd_may_cacao_processing: "Переработка какао" #NT!
 nd_may_cacao_processing_desc: "Сырые стручки какао ферментируют, сушат и измельчают в товарную пасту, хранят в керамических сосудах и маркируют красками для оценки." #NT!
 nd_may_temple_offerings: "Храмовые подношения" #NT!
 nd_may_temple_offerings_desc: "Храм-пирамида требует регулярных подношений благовоний, красок и ритуальных сосудов для поддержания благосклонности богов." #NT!
 nd_may_obsidian_knapping: "Обсидиан" #NT!
 nd_may_obsidian_knapping_desc: "Опытные мастера сжимают чешуйки вулканического обсидиана в острые как бритва лезвия и зубы макуауитлей, создавая устрашающее оружие." #NT!
 nd_may_cenote_offerings: "Предложения сенотов" #NT!
 nd_may_cenote_offerings_desc: "Ритуальные подношения в виде керамических сосудов и благовоний бросают в священный сенот, чтобы умилостивить бога дождя Чаака и обеспечить обильный урожай." #NT!
 nd_may_ballcourt_upkeep: "Содержание площадки для игры в мяч" #NT!
 nd_may_ballcourt_upkeep_desc: "Каменная площадка для игры в мяч требует регулярной замены покрытия и древесины для резных маркеров, оборудования для резиновых мячей и ритуальных приспособлений для священной игры." #NT!
 nd_may_canoe_harbor: "Каноэ-Харбор" #NT!
 nd_may_canoe_harbor_desc: "Большим каноэ-долбленам требуется древесина для строительства и ремонта, инструменты для тесла и долота, придающие форму корпусам, а также смола для гидроизоляции корпусов, поддерживающая флот, соединяющий прибрежные общины майя." #NT!
 nd_may_wall_maintenance: "Уход за стенами" #NT!
 nd_may_wall_maintenance_desc: "Оборонительные стены требуют постоянного ремонта камнем и деревом, а гарнизон должен быть оснащен оружием, чтобы противостоять осадным работам противника." #NT!
 nd_may_salt_processing: "Обработка соли" #NT!
 nd_may_salt_processing_desc: "Морская вода направляется в испарительные пруды и кипятится на дровах для производства соли для торговли по всей Мезоамерике." #NT!
 nd_may_milpa_upkeep: "Содержание Милпы" #NT!
 nd_may_milpa_upkeep_desc: "На террасных участках милпа выращивают кукурузу, фасоль и тыкву благодаря древней системе совмещения культур, дополненной ирригацией." #NT!
 nd_may_palisade_upkeep: "Содержание частокола" #NT!
 nd_may_palisade_upkeep_desc: "Деревянный частокол требует регулярной замены гниющих кольев, инструментов для оборонительного периметра и кожи для доспехов и снаряжения гарнизона в джунглях." #NT!
 nd_may_codex_production: "Производство Кодекса" #NT!
 nd_may_codex_production_desc: "Для изготовления коро-бумажных кодексов требуется переработка коры амата в бумагу и минеральные красители для иероглифических иллюстраций." #NT!
 nd_may_formed_tt: "Майя была создана" #NT!
 nd_may_path_a_tt: "Выбрать Лордов календаря" #NT!
 nd_may_path_b_tt: "Выбрал Конфедерацию Галаха Уйника" #NT!
 nd_may_destiny: "Судьба майя" #NT!
 nd_may_destiny_desc: "Майя воссоединились под одним знаменем. Теперь вопрос в том, в каком направлении пойдет эта возрожденная цивилизация: пойдет ли она по пути небесных знаний или военной конфедерации?" #NT!
 nd_may_dest_calendar_wisdom: "Календарь мудрости" #NT!
 nd_may_dest_calendar_wisdom_desc: "Захватите астрономические центры Мезоамерики. Контролируя великий храм Чолулы и пирамиды Теотиуакана, хранители календаря майя впитают в себя знания всех цивилизаций." #NT!
 nd_may_dest_venus_tables: "Таблицы Венеры" #NT!
 nd_may_dest_venus_tables_desc: "Астрономы майя усовершенствовали Таблицы Венеры с беспрецедентной точностью, предсказывая движения утренней звезды на столетия вперед. Эти знания определяют сельскохозяйственное планирование, торговые циклы и управление государством." #NT!
 nd_may_dest_new_baktun: "Новый Бактун" #NT!
 nd_may_dest_new_baktun_desc: "Начался новый великий цикл Длинного Счета. Майя стоят на пороге возрождения цивилизации, впитывая знания каждого народа, с которым они столкнулись, и превращая их во что-то большее." #NT!
 nd_may_dest_holcan_march: "Холканский марш" #NT!
 nd_may_dest_holcan_march_desc: "Расширьте территорию действия армий Халаха Уйника на Гондурас и Сальвадор, поставив южные торговые пути под военный контроль майя." #NT!
 nd_may_dest_jade_throne: "Нефритовый Трон" #NT!
 nd_may_dest_jade_throne_desc: "Направляйте Холкан в долину Мехико и захватите сам Теночтитлан. Майя объявят величайший город Америки своим." #NT!
 nd_may_dest_fourth_creation: "Четвертое творение" #NT!
 nd_may_dest_fourth_creation_desc: "В Пополь-Вух говорится о трёх неудавшихся творениях, прежде чем боги создали человечество из кукурузы. Теперь майя создадут Четвертое Творение: империю, простирающуюся от Кубы до тарасковского нагорья." #NT!
 nd_may.6.t: "Судьба воссоединившихся майя" #NT!
 nd_may.6.d: "Впервые за столетия мир майя говорит в один голос. Раздробленные города-государства, враждующие провинции Юкатана, горные королевства Гватемалы — все были объединены под единой властью. Дороги сакбе перевозят торговцев и послов между городами, которые когда-то стояли напротив друг друга, через баррикады. Вопрос теперь не в том, смогут ли майя выжить, а в том, кем они станут." #NT!
 nd_may.6.a: "Для майя наступает новая эра." #NT!
 nd_may.7.t: "Библиотеки побежденных" #NT!
 nd_may.7.d: "Наши хранители календаря посетили великие храмы Мексиканской долины: высокую пирамиду Чолулы, древние обсерватории Теотиуакана. Там, где другие завоеватели сожгли бы эти места, наши ученые с благоговением каталогизировали свои астрономические записи, свои математические системы и свою историю. Традиция знаний майя всегда была синкретической, поглощая и совершенствуя знания других. Теперь накопленная мудрость всей Мезоамерики перетекает в наши школы писцов." #NT!
 nd_may.7.a: "Их знания обогащают наши собственные." #NT!
 nd_may.8.t: "Уточнение таблиц Венеры" #NT!
 nd_may.8.d: "Наши астрономы достигли чего-то замечательного. Сравнивая древние записи Теотиуакана с нашими собственными многовековыми наблюдениями за Венерой, они усовершенствовали таблицы Дрезденского кодекса, чтобы предсказать восход и заход утренней звезды с погрешностью менее двух часов на протяжении пяти столетий. Это не просто академическое достижение: цикл Венеры управляет нашим сельскохозяйственным календарем, нашими торговыми графиками и временем войны и мира. Направим ли мы эти знания на развитие науки и инфраструктуры или на расширение наших торговых сетей?" #NT!
 nd_may.8.a: "Пусть наши ученые будут опираться на этот фундамент." #NT!
 nd_may.8.b: "Пусть наши торговцы извлекут выгоду из этих знаний." #NT!
 nd_may.9.t: "Рассвет Нового Бактуна" #NT!
 nd_may.9.d: "Дневные хранители объявили об этом: календарь Длинного Счета перешел к новому Бактуну, великому циклу продолжительностью примерно 394 года. В последний раз, когда это произошло, классическая цивилизация майя находилась в зените своего развития, строя Тикаль и Паленке. Теперь майя снова стали великой державой, их знания охватывают мудрость всех мезоамериканских цивилизаций. Священники спорят о значении этого нового цикла. Некоторые видят в этом время гармонии, когда разнообразные народы нашего царства станут одним целым. Другие видят в этом время обновления, когда мы должны восстановить и расширить физические основы нашей цивилизации." #NT!
 nd_may.9.a: "Это век согласия между народами." #NT!
 nd_may.9.b: "Это эпоха строительства и обновления." #NT!
 nd_may.10.t: "Марш Холкана" #NT!
 nd_may.10.d: "Воины Холкана вынесли знамя Халаха Уиника за пределы традиционного центра майя. Гондурас и Сальвадор (земли, куда когда-то путешествовали торговцы майя с согласия местных правителей) теперь подчиняются конфедерации. Великий торговый центр Нако, где какао, обсидиан и нефрит переходили из рук в руки торговцев Майя, Ленка и Пипил, теперь находится под нашим контролем. Южные подходы к миру майя безопасны." #NT!
 nd_may.10.a: "Холканы доказали свою ценность." #NT!
 nd_may.11.t: "Падение Теночтитлана перед майя" #NT!
 nd_may.11.d: "Немыслимое было достигнуто. Холканы вошли в долину Мехико и захватили Теночтитлан: величайший город Америки, построенный на острове среди озера, соединенный дамбами с материком, где расположены рынки, поражающие воображение. Нефритовый Трон Халаха Уиника теперь управляет данью бывшего сердца ацтекского мира. Как мы будем управлять этой огромной новой территорией? Мы можем требовать систематической дани от завоеванных народов, добывая богатство посредством управления, а не террора. Или мы можем править посредством страха, гарантируя, что ни один подданный не посмеет даже подумать о восстании." #NT!
 nd_may.11.a: "Добывайте дань через администрацию." #NT!
 nd_may.11.b: "Правило через страх перед Холканом." #NT!
 nd_may.12.t: "Четвертое творение" #NT!
 nd_may.12.d: "В «Пополь-Вух» рассказывается, что боги предприняли три неудачные попытки создать человечество, прежде чем добились успеха с помощью кукурузы. Теперь майя завершили свой собственный акт творения: империю, которая простирается от Карибских островов до Тарасканского нагорья, от побережья Персидского залива до склонов Тихого океана. Это Четвертое Творение, новый мир, созданный руками Майя. Халах Уиник восседает на Нефритовом Троне Теночтитлана, получая дань от ста народов. Будет ли эта империя поддерживаться за счет тактического превосходства и профессионального оружия, гарантируя, что наши силы смогут подавить любое восстание? Или нам следует сосредоточиться на политической машине доминирования, создавая административные и дипломатические инструменты, чтобы удержать то, что мы выиграли?" #NT!
 nd_may.12.a: "Наши воины будут поддерживать мир." #NT!
 nd_may.12.b: "Наши администраторы свяжут империю." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_venus_scholars: "Ученые «Утренней звезды»" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_venus_scholars: "Астрономы майя применяют предсказания цикла Венеры для долгосрочного планирования торговли и сбора разведывательной информации, хотя научный фокус отвлекает ресурсы от военного содержания." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_venus_merchants: "Торговцы Утренней Звезды" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_venus_merchants: "Торговцы майя приурочивают свои путешествия к циклу Венеры, обеспечивая выгодные кредиты и более быстрое строительство кораблей, в то время как их общины быстро восстанавливаются после неудач." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_baktun_harmony: "Бак'тун Гармонии" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_baktun_harmony: "Новый великий цикл приносит готовность и единство народу майя, обостряя его боевую инициативу и вербовку, хотя дух гармонии затрудняет оправдание агрессивных войн." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_baktun_renewal: "Бак'тун обновления" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_baktun_renewal: "Новый великий цикл вдохновляет на экспансию через моря и границы, улучшая логистику и десантный потенциал, хотя комфорт обновления порождает определенное самоуспокоение." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_jade_tribute: "Дань Нефритовому Трону" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_jade_tribute: "Покоренные народы центральной Мексики систематически отдают дань Нефритовому Трону, поддерживаемому сильными гарнизонами и дисциплинированной армией, которая быстро восстанавливается после неудач." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_jade_terror: "Ужас Холкана" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_jade_terror: "Грозная репутация Холканов обеспечивает их послушание посредством опустошительных атак и кавалерийских атак, хотя их сухопутная доктрина пренебрегает операциями по морской блокаде." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_fourth_sun: "Воины Четвертого Солнца" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_fourth_sun: "Профессиональная армия Четвертого Творения доминирует на суше и на море благодаря огневой мощи флота и дешевым наемникам, хотя огромный военный истеблишмент требует более крупного правительства." #NT!
 STATIC_MODIFIER_NAME_nd_may_dest_fourth_dominion: "Владычество Четвертого Творения" #NT!
 STATIC_MODIFIER_DESC_nd_may_dest_fourth_dominion: "Флот майя проецирует мощь по всему Карибскому региону, одновременно создавая военно-морские традиции, хотя религиозное разнообразие империи затрудняет ведение священных войн." #NT!
 nd_may_astronomical_academy: "Астрономическая Академия" #NT!
 nd_may_astronomical_academy_desc: "Грандиозное учреждение, в котором астрономы, математики и хранители календарей майя синтезируют астрономические знания всех мезоамериканских цивилизаций в единую систему небесных предсказаний." #NT!
 nd_may_academy_maintenance: "Обслуживание Академии" #NT!
 nd_may_academy_maintenance_desc: "Академии требуется постоянный запас бумаги для записей, справочных книг и стекла для точных приборов наблюдения." #NT!
 nd_may_jaguar_war_lodge: "Военный домик Ягуара" #NT!
 nd_may_jaguar_war_lodge_desc: "Элитная военная академия, где лучшие голканские воины обучаются ведению осадной войны, общевойсковой тактике и командованию многоэтническими армиями, собранными со всей империи." #NT!
 nd_may_lodge_maintenance: "Обслуживание лоджа" #NT!
 nd_may_lodge_maintenance_desc: "Военному домику требуется оружие для тренировок, кожа для доспехов и камень для тренировочных укреплений, где воины оттачивают свое осадное мастерство." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_may_bureaucracy_authority: "Власть Галаха Уйника" #NT!
 AUTO_MODIFIER_DESC_nd_may_bureaucracy_authority: "Воссоединенное государство майя подтверждает свою институциональную основу: офис Халах Уиник, жречество Ах Кин и советы домов Кучкабале. Корона теперь может устанавливать бюрократию и регулировать ее содержание с трона." #NT!
  
 may_halach_uinik_bureaucracy: "Галач Уйник" #NT!
 may_halach_uinik_bureaucracy_desc: "Халах Уйник (Истинный Человек) обладает судебной, военной и ритуальной властью над Кучкабалом городских старост Батаба. В «Relacion» Диего де Ланды (1566 г.) записано, что Галах Уиник назначал батабов подчиненными городами и разрешал споры между ними. Эта должность передается по наследству в благородном происхождении; Коком Майяпана проследил его до Хунака Сила. Централизация Кучкабала под руководством одного Халаха Уйника концентрирует лояльность за счет автономии городов, а слабый Галах Уйник приглашает Батаб к вражде." #NT!
  
 may_holpop_council_bureaucracy: "Совет Холпопа" #NT!
 may_holpop_council_bureaucracy_desc: "Холпоп («глава циновки») созывает попольный совет, на котором совещаются батабы и старшие советники. Холпоп держит в руках плетеную служебную циновку, попол, а совет уравновешивает власть Халаха Уйника посредством обычного права на консультации. Киче-Кумаркадж сохранил тот же институт, что и совет четырех наследственных линий (Кавек, Ниджаиб, Сакик и Тамуб), чьи обсуждения записаны в Пополь Вух. Работающий Холпоп производит прочное законодательство; его распад порождает раскол." #NT!
  
 may_ah_kin_priesthood_bureaucracy: "Ах Кин Священство" #NT!
 may_ah_kin_priesthood_bureaucracy_desc: "Ах Кин («Солнце») образуют иерархическое жречество в государствах майя. Под руководством Ах Кин Май из Маяпана жречество включает в себя прорицателей Чилама (чьи пророчества заполняют книги Чилам Балам Чумаэля и Тизимина), жертвоприносителей Накома, жрецов дождя Чак и лесных жрецов Ах К'ин К'акс диких рощ. Они ведут 260-дневный отсчет Цолькин и 365-дневный счетчик Хааб, выбирают даты посадки и руководят церемониями Нового огня в каждом календарном раунде." #NT!
  
 may_kaxan_codex_bureaucracy: "Сеть Кодексов Каксан'ала" #NT!
 may_kaxan_codex_bureaucracy_desc: "Ах Циб («тот, кто пишет») — класс грамотных писцов, работающих с кодексами, сделанными из коры бумаги. Сохранились четыре кодекса до завоевания (Дрезден, Мадрид, Париж и Кодекс майя Мексики, бывший Гролье); Остальное Диего де Ланда сжег на аутодафе Мани в 1562 году. В кодексах записаны астрономические таблицы, гадательные альманахи, ритуальные расписания и династические истории. Сеть писцов связана с жречеством Ах Кин, но отличается от нее: математико-архивная профессия со своими собственными мастерскими, обеспечивающими трон грамотными администраторами." #NT!
  
 may_mayapan_league_bureaucracy: "Лига Маяпана" #NT!
 may_mayapan_league_bureaucracy_desc: "Примерно с 1200 по 1441 год в городе Маяпан находился объединенный совет Кучкабале: Коком (правящая линия), Тутул-Сю, изгнанная из Ушмаля, Ица, изгнанная из Чичена, Купул, Чел, Печ, Ах-Канул и Тутул-Сиу из Мани. Халах Уиник каждого дома должен был проживать в Маяпане, в системе, которую испанские наблюдатели сравнивали с лигой заложников. Восстание Сю 1441 года положило конец лиге; его возрождение вновь привязывает благородные дома к столице, но правление должно осуществляться на основе консенсуса пэров." #NT!
  
 may_itza_tribute_bureaucracy: "Флотилия дани Ицы" #NT!
 may_itza_tribute_bureaucracy_desc: "Ица Таясал в Ной-Петен на озере Петен-Ица ​​управляла озерной и речной сетью дани, которая пережила все остальные государства майя и перешла только в 1697 году к Мартину де Урсуа. Флотилия торговых каноэ курсировала по системе Пасион-Усумасинта и центральным озерам Петен, собирая какао, соль, нефрит, обсидиан и перья из подчиненных городов. Ковой восточных озер управлял параллельной системой. Флотилия имеет двойное назначение: те же каноэ, которые мирно собирают дань, собирают воинов при необходимости." #NT!
