l_russian:
 STATIC_MODIFIER_NAME_nd_thalassocracy_of_the_eastern_seas: "Талассократия Восточных морей" #NT!
 STATIC_MODIFIER_DESC_nd_thalassocracy_of_the_eastern_seas: "Судьба Борнео лежит на волнах. От пахнущих камфарой портов Брунея до перечных причалов Банджармасина — наши султанаты контролируют морские пути, связывающие Острова пряностей с Китаем и Индией. Пусть каждый пролив и устье реки отвечают нашему флагу." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_rainforest: "Лорды тропического леса" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_rainforest: "Внутренняя часть Борнео представляет собой неприступную крепость из джунглей, рек и гор. Народы даяки, владеющие этой местностью, — непревзойденные воины: их мечи мандау и духовые ружья с отравленными наконечниками отбросили назад каждого захватчика, осмелившегося двинуться вверх по течению. Мы объединим эти кланы в армию, которой мир еще не видел." #NT!
 STATIC_MODIFIER_NAME_nd_bno_banjarmasin_pepper_boom: "Банджармасин Перцовый Бум" #NT!
 STATIC_MODIFIER_DESC_nd_bno_banjarmasin_pepper_boom: "Торговля перцем из Банджармасина достигла своего апогея: торговцы со всего архипелага и за его пределами конкурируют за доступ к нашему урожаю." #NT!
 STATIC_MODIFIER_NAME_nd_bno_diamond_rush: "Алмазная лихорадка" #NT!
 STATIC_MODIFIER_DESC_nd_bno_diamond_rush: "Аллювиальные алмазные месторождения Ландак и Чемпака привлекли горняков и торговцев со всего острова, способствуя всплеску процветания." #NT!
 nd_bno.1.t: "Объединение Борнео" #NT!
 nd_bno.1.d: "Великий остров Борнео, третий по величине в мире, наконец-то оказался под единым суверенитетом. На протяжении веков прибрежные султанаты от Брунея на севере до Банджармасина на юге конкурировали с внутренними конфедерациями даяков за контроль над огромными ресурсами острова: камфора на вес серебра, алмазы из древних аллювиальных полей Ландака, перец, привлекавший торговцев из Китая и Индии, и железное дерево, закалённое тысячелетиями тропического роста.\n\nТеперь впервые морские амбиции прибрежных султанов и Доблесть джунглей внутренних народов объединилась под одним знаменем. Но это новое государство должно выбрать свой характер. Должны ли мы посмотреть на море Сулу и Макассарский пролив, построив талассократию, способную соперничать с золотым веком Брунея при султане Болкиахе? Или нам следует обратиться внутрь себя, используя грозных воинов длинных домов и неисчерпаемые ресурсы старейшего тропического леса в мире?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bno.1.a: "Управляйте морями: наша судьба – на волнах" #NT!
 nd_bno.1.b: "Покорите джунгли: ни одна армия не сможет сравниться с нами в наших лесах" #NT!
 nd_bno.2.t: "Торговля перцем в Банджармасине" #NT!
 nd_bno.2.d: "При султане Мустайне Биллахе султанат Банджармасин достиг пика своей коммерческой мощи в начале семнадцатого века. Плантации перца распространились по долинам южных рек, и Банджармасин стал доминирующим торговым центром между Малаккским проливом и островами специй Малуку. Купцы из Явы, Китая, Индии и даже Европы боролись за доступ к причалам Банджармасина, где перец измерялся тоннами, а контракты скреплялись клятвами, принесенными на Коране.\n\nЭто богатство не досталось без затрат: контроль над торговлей перцем означал контроль над реками, и военные корабли султана патрулировали каждый приток. Однако сейчас перед нами стоит выбор: как инвестировать эту награду: будем ли мы расширять наши коммерческие сети или направим прибыль на разработку наших алмазных и минеральных богатств?" #NT!
 nd_bno.2.a: "Расширить торговые пути перца через архипелаг." #NT!
 nd_bno.2.b: "Инвестируйте в алмазные месторождения и добычу полезных ископаемых." #NT!
 nd_bno.3.t: "Брунейская талассократия" #NT!
 nd_bno.3.d: "При султане Болкиахе, пятом султане Брунея, султанат превратился из прибрежного торгового поста в настоящую талассократию: морскую империю. Право Брунея распространялось от побережий Саравака и Сабаха до южных Филиппин, охватывая архипелаг Сулу и достигая Манильского залива. Это была империя не территории, а торговых путей: Бруней взимал пошлины со всего водного транспорта, проходящего через его сферу, а камфора, оптовая стоимость которой равнялась ее весу в серебре, привлекала торговцев даже из Средиземноморья.\n\nДвор султана стал центром исламского образования и малайской литературной культуры, привлекая ученых и торговцев, которые распространяли веру вдоль каждого побережья, которого касался султанат. Золотой век Брунея продемонстрировал, что островное государство может проецировать свою мощь на огромные пространства океана посредством торговли, дипломатии и разумного развертывания военных сил." #NT!
 nd_bno.3.a: "Золотой век, достойный памяти" #NT!
 nd_bno.4.t: "Рейды Ибанского морского даяка" #NT!
 nd_bno.4.d: "Народ ибан, известный посторонним как морские даяки, заработал свою устрашающую репутацию в результате многих поколений морских набегов на реки Саравака. Их бангконгские военные каноэ, некоторые длиной более девяноста футов, могли перевозить десятки воинов, вооруженных мечами мандау и духовыми трубками с железными наконечниками. Ибан разработал сложную военно-морскую тактику: небольшие, плохо укомплектованные каноэ отправлялись вперед в качестве приманки, увлекая вражеские суда в преследование, пока они не проходили укрытые позиции, где основной флот ждал в засаде.\n\nК девятнадцатому веку Сарибас Ибан мог собирать пиратские флоты из двухсот бангконгов, сея ужас по всему северо-западному побережью Борнео. Об их ночных атаках с использованием двухметровых духовых трубок, приносящих бесшумную смерть в темноте, ходили легенды. Даже хорошо вооруженные корабли европейских колониальных держав научились уважать рейдеров-даяков, знавших каждую реку, риф и течение этих вод." #NT!
 nd_bno.4.a: "Реки и моря Борнео принадлежат нам." #NT!
 nd_bno.5.t: "Алмазные поля Ландака" #NT!
 nd_bno.5.d: "Аллювиальные месторождения алмазов в районе Ландак, недалеко от западного побережья Борнео, являются одними из старейших известных источников в мире: добыча здесь началась как минимум с 600 года нашей эры, что делает Борнео одним из первых источников алмазов человечества наряду с Индией. Огромный алмаз Матан весом 367 каратов был обнаружен на этих месторождениях рабочим-даяком в 1787 году. Это самый крупный необработанный алмаз ювелирного качества, когда-либо найденный на Калимантане.\n\nНо алмазы были лишь одним из аспектов минерального богатства Борнео. Золото из рек Самбас и Бау, сурьма с холмов Саравака, железная руда из внутренних гор: все это питало горнодобывающую экономику, которая привлекла в семнадцатом веке китайские компании конгси, организованные в совместные горнодобывающие предприятия, которые изменили ландшафт. Богатство, добываемое на земле Борнео, на протяжении веков формировало политику острова." #NT!
 nd_bno.5.a: "Земля отдает свои сокровища тем, кто знает, где искать." #NT!
 nd_bno.6.t: "Сопротивление европейскому посягательству" #NT!
 nd_bno.6.d: "Когда европейские колониальные державы ужесточили контроль над архипелагом (голландцы с юга и востока, британцы с северо-запада), народы Борнео оказали ожесточенное сопротивление. Символом этого неповиновения стал Пангеран Антасари, банджарский принц, который возглавил Банджарскую войну 1859–1863 годов против голландцев. Он координировал сопротивление, невзирая на этнические различия, занимаясь контрабандой огнестрельного оружия из Кутайского султаната и привлекая к своему делу как банджарских малайцев, так и даякских воинов.\n\nСами джунгли стали союзником. Голландские колонны, продвигавшиеся вверх по реке, обнаружили, что их линии снабжения растянуты до предела, солдаты убиты тропическими болезнями, а их фланги подвергаются преследованиям воинов, которые после каждой засады таяли обратно в лес. Хотя колониальная власть в конечном итоге одержала верх благодаря чистому материальному преимуществу, дух сопротивления формировал идентичность Борнео на протяжении нескольких поколений." #NT!
 nd_bno.6.a: "Наши леса и реки — наши величайшие укрепления." #NT!
 nd_bno_headhunting_rites: "Обряды охоты за головами" #NT!
 nd_bno_headhunting_rites_desc: "Традиция охоты за головами у даяков была не просто дикостью, а глубоко духовной практикой: считалось, что голова побежденного врага захватывает силу его души, давая общине силу и защиту." #NT!
 nd_bno_longhouse_tradition: "Традиция Лонгхауса" #NT!
 nd_bno_longhouse_tradition_desc: "Огромные длинные дома Борнео, возведенные на сваях из железного дерева и простирающиеся на триста метров, служат общественными крепостями, где десятки семей живут, работают и защищаются вместе." #NT!
 nd_bno_riverine_navigation: "Речное судоходство" #NT!
 nd_bno_riverine_navigation_desc: "Реки Борнео — это его автомагистрали. Мастерство речного судоходства (чтение течения, преодоление порогов и строительство судов, пригодных как для реки, так и для открытого моря) является основой всей островной власти." #NT!
 nd_bno_jungle_ironworking: "Джунгли Металлообработка" #NT!
 nd_bno_jungle_ironworking_desc: "Кузнецы-даяки выковывают меч мандау из железной руды, собранной во внутренних горах, сочетая в себе корпус из мягкого железа, предотвращающий поломку, и более твердое железное лезвие, обеспечивающее разрушительную остроту." #NT!
 nd_bno_animist_spiritualism: "Анимистический спиритуализм" #NT!
 nd_bno_animist_spiritualism_desc: "До прихода ислама народы Борнео практиковали анимистические традиции, основанные на духах леса, рек и предках: верования, которые до сих пор лежат в основе культурной самобытности даяков." #NT!
 nd_bno_forest_product_trade: "Торговля лесной продукцией" #NT!
 nd_bno_forest_product_trade_desc: "Леса Борнео содержат не только древесину, но и сокровища: ротанг, пчелиный воск, слоновую кость птиц-носорогов и птичьи гнезда, которые ценятся во всей Восточной Азии за их предполагаемые лечебные свойства." #NT!
 nd_bno_sumpit_mastery: "Мастерство сампита" #NT!
 nd_bno_sumpit_mastery_desc: "Сампит, духовая трубка Даяк, представляет собой оружие ужасающей точности. Дротики, наполненные ядом дерева ипох, могут принести смерть от одной царапины, а опытные охотники могут поражать цели на расстоянии более тридцати метров." #NT!
 nd_bno_bangkong_warcraft: "Бангконг Варкрафт" #NT!
 nd_bno_bangkong_warcraft_desc: "Бангконгское военное каноэ — оружие морских даяков: быстрое и маневренное судно, вырезанное из одного огромного дерева, способное перевозить десятки воинов по рекам и через открытое море." #NT!
 nd_bno_camphor_monopoly: "Камфорная монополия" #NT!
 nd_bno_camphor_monopoly_desc: "Камфора Борнео, собранная с деревьев дриобаланопс во внутренних лесах, на международных рынках продавалась по ценам, эквивалентным ее весу в серебре.\n\n#italic Доступно в: $nd_bno_camphor_post$#!" #NT!
 nd_bno_brunei_thalassocracy: "Бруней Талассократия" #NT!
 nd_bno_brunei_thalassocracy_desc: "При султане Болкиахе Султанат Бруней стал настоящей морской империей, контролирующей торговые пути из Саравака на юг Филиппин.\n\n#italic Доступно в: $nd_bno_camphor_post$#!" #NT!
 nd_bno_malay_court_culture: "Малайская придворная культура" #NT!
 nd_bno_malay_court_culture_desc: "Суды султанатов Борнео переняли изысканные традиции малайской аристократической культуры: сложные церемонии, куртуазную литературу и иерархический социальный порядок." #NT!
 nd_bno_kutai_hindu_legacy: "Кутайское индуистское наследие" #NT!
 nd_bno_kutai_hindu_legacy_desc: "Королевство Кутай, основанное в четвертом веке, было самым ранним индуистским государством в Ост-Индии. Его каменные надписи письмом Паллава являются одними из старейших свидетельств индийского культурного влияния в Юго-Восточной Азии.\n\n#italic Доступно в: $nd_bno_camphor_post$#!" #NT!
 nd_bno_island_fortification: "Островное укрепление" #NT!
 nd_bno_island_fortification_desc: "Устья рек и прибрежные мысы Борнео представляют собой естественные оборонительные позиции, которые, будучи укреплены деревянными частоколами и артиллерийскими установками, могут контролировать доступ ко всей береговой линии." #NT!
 nd_bno_iban_sea_dayak_raids: "Рейды Ибанского морского даяка" #NT!
 nd_bno_iban_sea_dayak_raids_desc: "Ибанские морские даяки являются одними из самых грозных воинов морской Юго-Восточной Азии: их бангконгский флот, скоординированная тактика засад и ночные атаки с помощью духовых трубок сломили волю гораздо более крупных сил." #NT!
 nd_bno_spice_island_routes: "Маршруты по Острову специй" #NT!
 nd_bno_spice_island_routes_desc: "Борнео расположен на перекрестке между островами специй Малуку, рынками Китая и торговыми путями в Индию: это положение дает огромное коммерческое преимущество для тех, кто может его обеспечить." #NT!
 nd_bno_landak_diamond_fields: "Алмазные месторождения Ландак" #NT!
 nd_bno_landak_diamond_fields_desc: "Аллювиальные месторождения алмазов Ландак, разрабатываемые по крайней мере с 600 года нашей эры, делают Борнео одним из старейших источников алмазов в мире. Здесь был найден великий алмаз Матан весом 367 карат.\n\n#italic Доступно в: $nd_bno_diamond_workshop$#!" #NT!
 nd_bno_banjarmasin_sultanate_rise: "Возвышение Банджармасинского султаната" #NT!
 nd_bno_banjarmasin_sultanate_rise_desc: "Султанат Банджар, основанный в 1526 году после падения Негара-Дахи, принес исламское управление и коммерческие сети на юг Борнео." #NT!
 nd_bno_islamization_of_borneo: "Исламизация Борнео" #NT!
 nd_bno_islamization_of_borneo_desc: "Распространение ислама на побережьях Борнео изменило политический ландшафт острова, создав сеть султанатов, связанных верой, торговлей и династическим браком." #NT!
 nd_bno_sulu_sea_dominance: "Сулу Морское Доминирование" #NT!
 nd_bno_sulu_sea_dominance_desc: "Контроль над морем Сулу означает контроль над торговыми путями, связывающими Борнео, Филиппины и острова Пряностей: морское владычество, поддерживаемое военными праху." #NT!
 nd_bno_rattan_ironwood_exports: "Экспорт ротанга и железной древесины" #NT!
 nd_bno_rattan_ironwood_exports_desc: "Борнейское железное дерево, практически не поддающееся разрушению и устойчивое к термитам и соленой воде, стоит дороже. В сочетании с экспортом ротанга эти лесные продукты составляют основу внутренней экономики.\n\n#italic Доступно в: $nd_bno_camphor_post$#!" #NT!
 nd_bno_sultanate_naval_reform: "Военно-морская реформа султаната" #NT!
 nd_bno_sultanate_naval_reform_desc: "Султанаты Борнео модернизируют свои боевые праху, установив пушечные установки и утяжелив конструкцию, создав галерный флот, способный защищать обширную береговую линию острова." #NT!
 nd_bno_banjarmasin_pepper_trade: "Банджармасин Перец Трейд" #NT!
 nd_bno_banjarmasin_pepper_trade_desc: "При султане Мастейне Биллахе Банджармасин стал доминирующим центром торговли перцем между Малаккой и Малуку, причем за доступ к нему боролись купцы из Явы, Китая и Индии." #NT!
 nd_bno_anti_piracy_patrols: "Антипиратские патрули" #NT!
 nd_bno_anti_piracy_patrols_desc: "Организованные военно-морские патрули подавляют повсеместное пиратство в прибрежных водах Борнео, защищая торговлю и демонстрируя авторитет единого островного государства." #NT!
 nd_bno_chinese_kongsi_mining: "Китайская компания Kongsi Mining" #NT!
 nd_bno_chinese_kongsi_mining_desc: "Китайские горнодобывающие конгси, кооперативные компании, организованные кланами из Гуандуна и Фуцзянь, привносят передовые технологии добычи полезных ископаемых и организацию труда на золотые и алмазные месторождения Борнео.\n\n#italic Доступно в: $nd_bno_diamond_workshop$#!" #NT!
 nd_bno_dayak_confederation: "Конфедерация даяков" #NT!
 nd_bno_dayak_confederation_desc: "Разнообразные народы даяков внутренних районов (ибан, бидаю, каян, кения и многие другие) организованы в свободную военную конфедерацию, в состав которой входят специализированные воины каждого племени." #NT!
 nd_bno_court_of_the_sultan: "Суд султана" #NT!
 nd_bno_court_of_the_sultan_desc: "Суд султаната в Брунее или Банджармасине становится центром управления, правосудия и дипломатии, опираясь как на исламскую юриспруденцию, так и на законы адатов коренных народов." #NT!
 nd_bno_islamic_scholarship: "Исламская стипендия" #NT!
 nd_bno_islamic_scholarship_desc: "Мечети и медресе распространяли исламское образование в прибрежных регионах Борнео, создавая грамотный класс ученых, судей и администраторов." #NT!
 nd_bno_banjarmasin_naval_arsenal: "Банджармасинский военно-морской арсенал" #NT!
 nd_bno_banjarmasin_naval_arsenal_desc: "Реки южного Борнео обеспечивают древесину и железные изделия для галерного флота с пушечным вооружением, сочетающего местные традиции судостроения с пороховыми технологиями." #NT!
 nd_bno_european_resistance: "Европейское сопротивление" #NT!
 nd_bno_european_resistance_desc: "Сопротивление Пангерана Антасари голландской колониальной экспансии продемонстрировало, что джунгли и реки Борнео могут обескровить даже армии индустриальной эпохи." #NT!
 nd_bno_gold_antimony_mines: "Золотые и сурьмяные рудники" #NT!
 nd_bno_gold_antimony_mines_desc: "Золотые прииски Самбас и Бау в сочетании с месторождениями сурьмы на холмах Саравака способствуют развитию горнодобывающей экономики, которая меняет внутреннюю часть острова.\n\n#italic Доступно в: $nd_bno_diamond_workshop$#!" #NT!
 nd_bno_pangeran_antasari_legacy: "Наследие Пангерана Антасари" #NT!
 nd_bno_pangeran_antasari_legacy_desc: "Банджарский принц, который возглавил Банджарскую войну, стал символом сопротивления: он координировал силы малайцев и даяков, занимался контрабандой оружия из Кутая и вел партизанскую кампанию, которая длилась годы." #NT!
 nd_bno_strait_toll_system: "Система взимания платы за пролив" #NT!
 nd_bno_strait_toll_system_desc: "Контроль над проливами и устьями рек вокруг Борнео позволяет взимать пошлины со всех морских перевозок: эту систему впервые ввел султанат Брунея на пике своего могущества." #NT!
 nd_bno_borneo_interior_roads: "Внутренние дороги Борнео" #NT!
 nd_bno_borneo_interior_roads_desc: "Дороги, проложенные через густые внутренние тропические леса Борнео, соединяют побережье с богатыми минералами внутренними районами, позволяя эффективно добывать и управлять ранее изолированными регионами.\n\n#italic Доступно в: $nd_bno_camphor_post$#!" #NT!
 nd_bno_banjar_war_resistance: "Банджарское военное сопротивление" #NT!
 nd_bno_banjar_war_resistance_desc: "Уроки Банджарской войны (партизанская тактика на плотной местности, межэтническое военное сотрудничество и использование внутренних линий снабжения) формируют современную военную доктрину." #NT!
 nd_bno_modern_pepper_plantations: "Современные плантации перца" #NT!
 nd_bno_modern_pepper_plantations_desc: "Выращивание перца в промышленных масштабах превращает долины рек на юге Борнео в один из крупнейших в мире регионов по производству специй." #NT!
 nd_bno_unified_island_administration: "Единая администрация острова" #NT!
 nd_bno_unified_island_administration_desc: "Впервые единая административная система объединяет различные прибрежные султанаты Борнео и внутренние конфедерации под скоординированным управлением." #NT!
 nd_bno_coastal_modernization: "Прибрежная модернизация" #NT!
 nd_bno_coastal_modernization_desc: "Современные верфи, маяки и портовые сооружения превращают прибрежные города Борнео из традиционных торговых пунктов в центры региональной торговли." #NT!
 nd_bno_diamond_trade_reform: "Реформа алмазной торговли" #NT!
 nd_bno_diamond_trade_reform_desc: "Рационализация практики добычи и торговли выводит алмазную промышленность Борнео в современную эпоху, соединяя древние месторождения Ландак с глобальными рынками драгоценных камней." #NT!
 nd_bno_borneo_sovereignty: "Суверенитет Борнео" #NT!
 nd_bno_borneo_sovereignty_desc: "Объединенное Борнео утверждает свой суверенитет как великая островная держава: признанная соседними государствами и вызывающая уважение благодаря своему богатству, военной мощи и культурному наследию." #NT!
 a_nd_bno_dayak_headhunters: "Даяк Охотники за головами" #NT!
 a_nd_bno_dayak_headhunters_desc: "Вооруженные мандау воины из общин длинных домов, чьи традиции охоты за головами выковывают бесстрашных бойцов, вселяющих ужас во всех, кто сталкивается с ними в джунглях." #NT!
 a_nd_bno_blowgunners: "Борнео Блоуганнерс" #NT!
 a_nd_bno_blowgunners_desc: "Застрельщики, вооруженные духовыми пистолетами, стреляют дротиками из бамбука и железа с ядовитыми наконечниками. Одна царапина от их отравленных ипохом дротиков может привести к смерти за считанные минуты." #NT!
 a_nd_bno_iban_sea_raiders: "Ибан Си Рейдерс" #NT!
 a_nd_bno_iban_sea_raiders_desc: "Воины-амфибии традиции Морских Даяков, одинаково уверенно совершающие набеги на военных каноэ Бангконга или сражающиеся в густых джунглях, известные своей разрушительной тактикой засад." #NT!
 n_nd_bno_prahu_bangkong: "Праху Бангконг" #NT!
 n_nd_bno_prahu_bangkong_desc: "Быстрое боевое каноэ народа даяков: легкое, маневренное, вырезанное из цельного огромного дерева. Недостаток вооружения компенсируется скоростью и свирепостью экипажа." #NT!
 n_nd_bno_sultanate_war_prahu: "Султанат Войны Праху" #NT!
 n_nd_bno_sultanate_war_prahu_desc: "Более тяжелая вооруженная галера, разработанная прибрежными султанатами, на которой установлены пушки наряду с традиционной абордажной тактикой. Эти суда патрулируют проливы и устья рек Борнео." #NT!
 n_nd_bno_pepper_trader: "Торговец перцем Борнео" #NT!
 n_nd_bno_pepper_trader_desc: "Быстрое торговое судно, оптимизированное для маршрутов специй между Борнео, Малуку и остальным архипелагом. Скорость — величайшая защита от эндемического пиратства в этих водах." #NT!
 n_nd_bno_banjarmasin_cannon_boat: "Банджармасинский пушечный катер" #NT!
 n_nd_bno_banjarmasin_cannon_boat_desc: "Речная галера, вооруженная тяжелой пушкой, разработанная для патрулирования водных путей южного Борнео. Небольшая осадка позволяет ему плавать по притокам, куда не могут следовать более крупные суда." #NT!
 nd_bno_longhouse: "Даяк Длинный дом" #NT!
 nd_bno_longhouse_desc: "Огромное общественное жилище, воздвигнутое на сваях из железного дерева, в котором под одной крышей проживали десятки семей. Длинный дом служит крепостью, зернохранилищем, оружейным складом и центром общественной жизни." #NT!
 nd_bno_longhouse_upkeep: "Содержание длинного дома" #NT!
 nd_bno_longhouse_upkeep_desc: "Сохранение массивной конструкции традиционного длинного дома из железного дерева и бамбука." #NT!
 nd_bno_camphor_post: "Торговый пост камфоры" #NT!
 nd_bno_camphor_post_desc: "Торговая база, специализирующаяся на камфоре Борнео, ароматической смоле, собираемой с деревьев дриобаланопс, цена которой равна ее весу в серебре." #NT!
 nd_bno_camphor_processing: "Обработка камфоры" #NT!
 nd_bno_camphor_processing_desc: "Сбор и обработка камфорной смолы в лесах внутренних районов." #NT!
 nd_bno_diamond_workshop: "Мастерская алмазного рудника" #NT!
 nd_bno_diamond_workshop_desc: "Аллювиальная добыча алмазов из речного гравия с использованием традиционных методов промывки и шлюзования, отточенных на протяжении веков в районе Ландак." #NT!
 nd_bno_alluvial_mining: "Аллювиальная добыча" #NT!
 nd_bno_alluvial_mining_desc: "Извлечение алмазов и драгоценных камней из речного гравия с использованием традиционных методов промывки и промывки." #NT!
 nd_bno_pepper_estate: "Поместье перцевых плантаций" #NT!
 nd_bno_pepper_estate_desc: "Управляемая плантация перца вдоль южных речных долин Борнео, производящая специи, которые сделали Банджармасин одним из крупнейших торговых портов архипелага." #NT!
 nd_bno_pepper_cultivation: "Выращивание перца" #NT!
 nd_bno_pepper_cultivation_desc: "Выращивание и сбор перца на виноградных плантациях во влажных речных долинах южного Борнео." #NT!
 nd_bno_sultanate_mosque: "Султанатская мечеть" #NT!
 nd_bno_sultanate_mosque_desc: "Центр исламского образования и юриспруденции, сочетающий в себе функции мечети, медресе и суда. Эти учреждения распространяют грамотность и административный потенциал по прибрежным султанатам." #NT!
 nd_bno_mosque_maintenance: "Обслуживание мечети" #NT!
 nd_bno_mosque_maintenance_desc: "Поддержание каменной кладки и библиотеки султанатской мечети и медресе." #NT!
 nd_bno_forest_products_pm: "Переработка лесной продукции" #NT!
 nd_bno_forest_products_pm_desc: "Переработка ротанга, смолы и других недревесных лесных продуктов, заготовленных во внутренних районах Борнео." #NT!
 nd_bno_ironwood_processing_pm: "Обработка железной древесины" #NT!
 nd_bno_ironwood_processing_pm_desc: "Сбор и обработка борнейской железной древесины: практически неразрушимой древесины, которая ценится в строительстве и судостроении." #NT!
 nd_bno_sago_processing_pm: "Обработка саго" #NT!
 nd_bno_sago_processing_pm_desc: "Извлечение крахмала из саговых пальм: основного продукта питания жителей внутренних районов Борнео." #NT!
 nd_bno_beeswax_processing_pm: "Обработка пчелиного воска" #NT!
 nd_bno_beeswax_processing_pm_desc: "Сбор и переработка пчелиного воска из полога тропических лесов на экспорт: ценный торговый товар." #NT!
 nd_bno_birds_nest_pm: "Сбор птичьего гнезда" #NT!
 nd_bno_birds_nest_pm_desc: "Сбор съедобных гнезд ласточек в известняковых пещерах Борнео: они ценятся в китайской кухне за предполагаемые лечебные свойства." #NT!
 nd_bno_gold_panning_pm: "Операции по промыванию золота" #NT!
 nd_bno_gold_panning_pm_desc: "Промывка россыпного золота из рек Борнео с использованием методов, усовершенствованных китайскими горняками конгси." #NT!
 nd_bno_antimony_smelting_pm: "Плавка сурьмы" #NT!
 nd_bno_antimony_smelting_pm_desc: "Переплавка сурьмяной руды с холмов Саравака в металлические инструменты и сплавы." #NT!
 nd_bno_prahu_yard_pm: "Праху Судостроение" #NT!
 nd_bno_prahu_yard_pm_desc: "Строительство военных праху и торговых судов из железного дерева Борнея и местной древесины." #NT!
 levy_nd_bno_dayak_headhunters: "Отряд даяков-охотников за головами" #NT!
 levy_nd_bno_dayak_headhunters_desc: "Свирепые воины-даяки из внутренних длинных домов: охотники за головами с мандау, которые вселяют ужас в прибрежных захватчиков." #NT!
 levy_nd_bno_iban_sea_raiders: "Ибанский морской рейдерский флот" #NT!
 levy_nd_bno_iban_sea_raiders_desc: "Воины-амфибии-ибаны, совершающие набеги по рекам и морям: их быстрые атаки на баркасах внушают страх по всему побережью Борнео." #NT!
 nd_bno_formed_tt: "Борнео был образован" #NT!
 nd_bno_path_a_tt: "Выбрали Талассократию Восточных морей" #NT!
 nd_bno_path_b_tt: "Выбрали Лордов тропического леса" #NT!
 nd_bno_destiny: "Судьба Борнео" #NT!
 nd_bno_destiny_desc: "Великий остров един. Теперь мы должны доказать, что Борнео может существовать не только как совокупность речных султанатов и конфедераций длинных домов. Прежде чем выбирать путь вперед, стабилизируйте королевство." #NT!
 nd_bno_dest_sulu: "Морской Доминион Сулу" #NT!
 nd_bno_dest_sulu_desc: "Захватите архипелаг Сулу и сделайте Борнео доминирующей морской державой в восточных морях. Контроль над Сулу открывает торговые пути на Филиппины и острова специй. Требуется контроль над Маймбунгом и доступ к торговле перцем." #NT!
 nd_bno_dest_straits: "Хозяин проливов" #NT!
 nd_bno_dest_straits_desc: "Управляйте великими морскими узкими местами Юго-Восточной Азии. Под нашим знаменем Малакка и Тернате каждый корабль, курсирующий между Индийским океаном и Тихим океаном, должен отдавать дань уважения Борнео." #NT!
 nd_bno_dest_archipelago: "Архипелаговая Империя" #NT!
 nd_bno_dest_archipelago_desc: "От Манильского залива до Макассарского пролива островной мир Юго-Восточной Азии соответствует Борнео. Это морская империя, о которой султан Брунея Болкиах мог только мечтать, талассократия, охватывающая весь архипелаг." #NT!
 nd_bno_dest_interior: "Сердце джунглей" #NT!
 nd_bno_dest_interior_desc: "Превратите обширные внутренние районы Борнео в источник непревзойденного богатства. Золото из рек, алмазы из земли и железное дерево из древних лесов: тропический лес — неисчерпаемая сокровищница для тех, кто знает его тайны." #NT!
 nd_bno_dest_rivers: "Лорд тысячи рек" #NT!
 nd_bno_dest_rivers_desc: "Распространите речную власть Борнео за пределы острова. Палембанг, великий речной султанат Суматры, разделяет нашу модель доминирования на внутренних водных путях. Покорите его и докажите, что повелители тропических лесов могут распространить свою власть через моря." #NT!
 nd_bno_dest_sovereignty: "Суверенитет Зеленого Царства" #NT!
 nd_bno_dest_sovereignty_desc: "Внутренняя часть Борнео (самого старого тропического леса на Земле) становится резиденцией великой державы. От центра Явы до покрытых джунглями гор внутри страны, Повелители тропических лесов построили империю, в которую не может проникнуть ни одна колониальная держава." #NT!
 nd_bno.7.t: "Единое Борнео" #NT!
 nd_bno.7.d: "Советы длинных домов и суды султанатов наконец признали единую суверенную власть над третьим по величине островом в мире. От мангровых болот на юге до горных лесов хребта Крокер, от дельт рек Саравака до алмазных полей Ландака — Борнео говорит одним голосом.\n\nЭто немалое достижение. Огромные размеры острова, непроницаемая внутренняя часть и ошеломляющее культурное разнообразие (дайяк, малайцы, кутаи, банджары, ибаны и многие другие) провалили все предыдущие попытки объединения. Вопрос сейчас не в том, сможем ли мы удержать это царство вместе, а в том, что мы из него сделаем." #NT!
 nd_bno.7.a: "Борнео Юнайтед выступает как единое целое" #NT!
 nd_bno.8.t: "Падение Сулу" #NT!
 nd_bno.8.d: "Архипелаг Сулу, цепь островов, простирающаяся между Борнео и Минданао, долгое время был владением независимых султанов и вождей пиратов, которые безнаказанно охотились на морских путях. Наши военные праху сломили их сопротивление. Гавань Маймбунг, резиденция султаната Сулу, теперь развевается под нашим знаменем.\n\nС Сулу в наших руках мы контролируем морские пути, соединяющие Борнео с Филиппинами и островами пряностей за их пределами. Торговцы перцем, которым когда-то приходилось вести переговоры с дюжиной мелких правителей, теперь имеют дело с одной властью. Это первый шаг к истинной талассократии восточных морей." #NT!
 nd_bno.8.a: "Морские дороги нам открыты" #NT!
 nd_bno.9.t: "Командование проливами" #NT!
 nd_bno.9.d: "Два наиболее стратегически важных пункта во всей Юго-Восточной Азии теперь подчиняются Борнео. Малакка, древние ворота между Индийским океаном и Южно-Китайским морем, направляет через наши таможни богатства Индии, Аравии и Восточной Африки. Тернате, вулканический остров специй, который когда-то подтолкнул европейские державы к войне, добавляет к нашим владениям гвоздику и мускатный орех.\n\nЭто талассократия не только побережий, но и узких мест. Каждое торговое судно, каждый военный флот, каждая дипломатическая миссия, проходящая через эти воды, должны считаться с досягаемостью Борнео. Вопрос в том, как распорядиться этой силой: разбогатеем ли мы на пошлинах и торговых соглашениях или создадим военно-морские силы, чтобы еще больше распространить свою власть?" #NT!
 nd_bno.9.a: "Установите мытарства на каждом проливе" #NT!
 nd_bno.9.b: "Стройте флоты, чтобы укрепить нашу монополию на специи." #NT!
 nd_bno.10.t: "Империя Архипелага" #NT!
 nd_bno.10.d: "Манильский залив и Макассарский пролив (северные и южные ворота островного мира) теперь плавают под флагом Борнео. То, чего достиг султан Болкиах в золотой век Брунея, было всего лишь прелюдией. Мы построили нечто гораздо большее: морскую империю, охватывающую Филиппины, острова Пряностей, Малайский полуостров и огромный остров Борнео.\n\nНаши военные праху патрулируют воды, простирающиеся на три тысячи миль. Наши купцы торгуют от Бенгальского залива до берегов Новой Гвинеи. Эта держава построена не на завоеваниях континента, а на господстве над ветром, волнами и тысячами островов, которые усеивают моря между Азией и Австралией. Должны ли мы консолидировать эту территорию посредством дипломатии и интеграции или сохранить ее посредством подавляющего превосходства на море?" #NT!
 nd_bno.10.a: "Правило посредством дипломатии и общего процветания" #NT!
 nd_bno.10.b: "Управляйте флотом: наши праху — закон" #NT!
 nd_bno.11.t: "Сокровища интерьера" #NT!
 nd_bno.11.d: "Пока меньшие державы спорят из-за прибрежных торговых постов, мы обратили внимание на истинное богатство Борнео: его внутренние районы. Алмазные поля Ландака, разрабатываемые еще до эпохи Пророка, дают драгоценные камни, которые могут конкурировать с любыми алмазами из Индии. Золотая пыль собирается в каждом излучине реки. Железные леса, некоторым деревьям, которым уже тысяча лет, дают древесину, которую не может перегрызть ни один термит, а соленая вода не может гнить.\n\nНаши улучшения в дорогах и реках теперь соединяют побережье с сердцем джунглей. Там, где когда-то решались только самые смелые торговцы-даяки, теперь к побережью течет регулярная торговля золотом, алмазами, камфорой и пчелиным воском. Тропический лес не является препятствием. Это наш самый большой актив." #NT!
 nd_bno.11.a: "Джунгли отдают свои богатства тем, кто их уважает." #NT!
 nd_bno.12.t: "Речные королевства" #NT!
 nd_bno.12.d: "Палембанг пал. Великий речной султанат Суматры, который когда-то контролировал внутренние водные пути южной Суматры, как мы контролируем реки Борнео, теперь признает наш суверенитет. Это завоевание было не просто стратегическим, но и символическим: мы доказали, что модель речной мощи Борнео (контроль над реками, контроль над сушей) может быть распространена и на моря.\n\nНаши армии, закаленные в боях в джунглях и речных боях, показали свое превосходство над любыми силами, опирающимися на дороги и открытую местность. Вопрос в том, как закрепить эту победу: будем ли мы управлять с помощью военной силы или использовать наши минеральные богатства, чтобы купить лояльность огромной внутренней империи?" #NT!
 nd_bno.12.a: "Управляйте силой нашего речного флота" #NT!
 nd_bno.12.b: "Пусть алмазное богатство купит лояльность подданных" #NT!
 nd_bno.13.t: "Суверенитет Зеленого Царства" #NT!
 nd_bno.13.d: "Внутренняя часть Явы (самого густонаселенного острова архипелага) оказалась под нашим контролем. Матарам, резиденция великих яванских королевств, теперь подчиняется Лордам тропического леса. Это достижение, которое казалось невозможным вождям длинных домов даяков столетие назад: империя, простирающаяся от старейшего тропического леса на Земле до самых богатых сельскохозяйственных угодий тропиков.\n\nМы построили эту державу не за счет превосходства на море, а за счет мастерства внутренних войн, освоения наших минеральных богатств и терпеливого поглощения народов, населяющих наш остров и архипелаг. Должны ли мы чтить наследие сопротивления Пангерана Антасари, создавая армию, которую невозможно победить, или создать новую идентичность даяков, которая объединит всех жителей внутренних районов?" #NT!
 nd_bno.13.a: "Почтите наследие сопротивления Антасари" #NT!
 nd_bno.13.b: "Создайте новую империю даяков из народов джунглей." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_strait_tolls: "Доходы от платы за проезд в проливе" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_strait_tolls: "«Узкие места» Юго-Восточной Азии приносят стабильный поток доходов от пошлин с каждого судна, проходящего через наши воды, хотя поддержание этих огромных морских владений напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_spice_fleets: "Превосходство флота специй" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_spice_fleets: "Наши военные флоты обеспечивают монополию на торговлю пряностями, вынуждая соседние государства принять наши условия. Постоянное усиление военно-морской мощи происходит за счет престижа королевства на суше." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_island_empire: "Администрация Островной Империи" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_island_empire: "Сложная административная система объединяет обширные острова нашей морской империи, объединяя различные народы под общей короной." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_sea_of_prahus: "Море Прахуса" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_sea_of_prahus: "Наши военные флоты праху патрулируют каждый пролив и гавань, демонстрируя подавляющую военно-морскую силу, которая позволяет нам наносить удары по любой точке архипелага с разрушительной скоростью." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_river_lords: "Доминион Речных Лордов" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_river_lords: "Наше мастерство ведения речной войны и внутренней логистики позволяет нам атаковать любые укрепления на водных путях, хотя прибрежный флот страдает от концентрации внутри страны." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_diamond_throne: "Алмазный Трон" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_diamond_throne: "Огромные минеральные богатства внутренних территорий Борнео позволяют создать большую армию, чем может создать любой сосед, хотя сосредоточенность внутри страны ограничивает наши дипломатические возможности." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_pangeran_legacy: "Наследие Пангерана Антасари" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_pangeran_legacy: "Партизанские традиции сопротивления Пангерана Антасари живут в нашей кавалерии и бойцах джунглей, которые могут быстро пополняться и действовать при минимальном финансировании." #NT!
 STATIC_MODIFIER_NAME_nd_bno_dest_dayak_empire: "Империя Даяков" #NT!
 STATIC_MODIFIER_DESC_nd_bno_dest_dayak_empire: "Разнообразные народы даяков были объединены в единую имперскую идентичность с быстрой вербовкой, минимальным истощением запасов и стабильной экономикой." #NT!
 nd_bno_strait_citadel: "Пролив Цитадель" #NT!
 nd_bno_strait_citadel_desc: "Укрепленный портовый комплекс, контролирующий один из морских узких мест Юго-Восточной Азии. Каменные бастионы и артиллерийские позиции защищают якорную стоянку, а таможни взимают пошлину с каждого проходящего судна." #NT!
 nd_bno_citadel_upkeep: "Обслуживание Цитадели" #NT!
 nd_bno_citadel_upkeep_desc: "Поддержание каменных укреплений, военно-морских запасов и таможенной инфраструктуры проливной цитадели." #NT!
 nd_bno_ironwood_fortress: "Крепость Айронвуд" #NT!
 nd_bno_ironwood_fortress_desc: "Массивная внутренняя крепость, построенная из борнейского железного дерева: древесина настолько плотная, что тонет в воде и веками сопротивляется гниению. Эти крепости контролируют речные системы внутренних территорий, распространяя мощь глубоко в джунгли." #NT!
 nd_bno_fortress_upkeep: "Обслуживание крепости" #NT!
 nd_bno_fortress_upkeep_desc: "Уход за палисадами из железного дерева, сторожевыми башнями и цепями, блокирующими реки, во внутренней крепости." #NT!
 AUTO_MODIFIER_NAME_nd_bno_bureaucracy_authority: "Трон Борнейских султанатов" #NT!
 AUTO_MODIFIER_DESC_nd_bno_bureaucracy_authority: "От кабинета из четырех визирей Брунея до пангеранских губернаторов алмазных и золотых округов, от Туай Рума в верховьях реки до адмиралтейства северных морей — институциональное наследие каждого прибрежного султаната и каждого внутреннего договора собрано под одним троном. Единое государство обладает аппаратом, позволяющим сделать из себя нечто большее, чем просто сумму своих султанатов." #NT!
 bno_wazir_council_bureaucracy: "Вазирский совет Брунея" #NT!
 bno_wazir_council_bureaucracy_desc: "Гражданский кабинет с четырьмя столпами, который придал Брунейскому султанату административную форму со времен правления султана Болкиаха (годы правления 1485–1524) до XIX века. Пенгиран Бендахара управлял канцелярией и был старшим из четырех; Пенгиран Ди-Гадонг владел казной и таможней в устье реки Бруней; Пенгиран Пеманча управлял землями султана и верховьями реки; Пенгиран Теменггунг командовал военным праху и дворцовой стражей. Набранные из благородных кланов Берунай по султанскому назначению, вазиры на практике занимали должности в благородных родословных, и совет, заседавший в истане, мог перевешивать любого отдельного султана. Каждый второй султанат Борнея копировал этот образец в миниатюре." #NT!
 bno_pangeran_mining_bureaucracy: "Пангеранские горнодобывающие районы" #NT!
 bno_pangeran_mining_bureaucracy_desc: "Дипломированные наследственные губернаторы алмазных месторождений Ландак и Чемпака, золотых приисков Бау и Самбас и сурьмяных пластов верхнего Саравака. Пангераны Самбаса, Мемпавы и Ландака выдавали концессии на добычу полезных ископаемых, получали фиксированную долю добычи (обычной была десятая часть) и разрешали споры между братствами конгси горняков Хакка (Республика Ланфанг в Мандоре с 1777 года, Хешун Цзунтин в Монтерадо, Даганг в Мемпаве), трудовыми резервами даяков и прибрежной малайской столицей. Пангераны самбы иногда были богаче, чем их номинальные повелители Брунея, но эта должность закрепила трон, признав самоуправление конгси и демографическое преобладание хакка в горнодобывающих районах." #NT!
 bno_tuai_rumah_compact_bureaucracy: "Компактный длинный дом Tuai Rumah" #NT!
 bno_tuai_rumah_compact_bureaucracy_desc: "Традиционное признание вождя длинного дома Ибана и Бидаю (Туай Румах, со старшими региональными вождями, именуемыми Пенгулу и верховным Теменггонгом морских даяков) в качестве тронного собеседника для верховых общин Сунгай Раджанг, Сунгай Саравак и Сунгаи Сарибас. Каждый Туай Румах был избранным старостой своего длинного дома билек (от тридцати до шестидесяти домов под одной крышей из железного дерева), ответственным за постановления адата, распределение подземных участков и отправку воинов на зов султана. Договор дал прибрежному трону то, чего никогда не достигала прямая администрация: рекруты с гор, посредничество в мире между враждующими длинными домами и признанный канал для лесной дани в обмен на невмешательство в адат." #NT!
 bno_lanun_admiralty_bureaucracy: "Адмиралтейство морских рейдеров Лануна" #NT!
 bno_lanun_admiralty_bureaucracy_desc: "Институционализированный режим пиратства в морях Сулу и северной части Борнея, согласно которому султаны Брунея и Сулу и (после ок. 1768 г.) мелкие датусы Темпасука, залива Маруду и Пандасана лицензировали круизы Ирануна и Баланини против испанского, голландского и бугисского судоходства в обмен на опубликованную долю рабов, выкупов и товаров. Флоты ланун (иногда численностью в 200 праху, с экипажами, набранными из Ирануна на юге Минданао и Баланини Самала в Тави-Тави) курсировали с апреля по октябрь во время юго-западного муссона, совершали набеги до Явы и Целебеса и привозили пойманных людей домой для султанского суда и перепродажи на рынке Джоло в Сулу. Это учреждение сделало северное побережье богатым и внушающим страх, а также сдержало европейское вторжение на два поколения сверх того, что позволила бы голая слабость." #NT!
 bno_basanga_tribute_bureaucracy: "Басанга Форест-Дань" #NT!
 bno_basanga_tribute_bureaucracy_desc: "Обычный адат - дань лесной продукции, с помощью которой народы бидаю, пенан и внутренние даяки доставляли ротанг, камфору (ценный барус Борнео), орлиную древесину гахару, пчелиный воск, смолу крови дракона, съедобные птичьи гнезда и безоаровые камни прибрежным агентам Малайзии и Брунея в обмен на соль, железные инструменты и торговую ткань. Басанга оценивалась главами округов в отношении каждого длинного дома, собиралась на прибрежных торговых постах (пасар) во главе Сунгаи Самбаса и Сунгаи Саравака и отправлялась султанату в качестве тронной доли горных продуктов. Эта система была действующей экономикой досовременных внутренних территорий: камфора баруса Борнео продавалась в Алеппо и Каире на вес серебра, а птичьи гнезда Ниаха до сих пор служат источником состояния Саравака. Но это зависело от холдинга торгово-почтовой системы." #NT!
