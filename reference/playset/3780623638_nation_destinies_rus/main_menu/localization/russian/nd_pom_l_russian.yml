l_russian:
 STATIC_MODIFIER_NAME_nd_pom_griffins_dominion: "Доминион Грифона" #NT!
 STATIC_MODIFIER_DESC_nd_pom_griffins_dominion: "Под железной волей герцогов Грифонов капризные города Померании и беспокойные бароны были поставлены под контроль. Герцогство говорит одним голосом — голосом герцога." #NT!
 STATIC_MODIFIER_NAME_nd_pom_wendish_quarter: "Вендишский квартал" #NT!
 STATIC_MODIFIER_DESC_nd_pom_wendish_quarter: "Померания прониклась ганзейским духом. Ее города управляются сами собой, ее купцы свободно плавают, а ее богатство течет из счетных домов Штральзунда и Штеттина, а не из герцогского двора." #NT!
 STATIC_MODIFIER_NAME_nd_pom_hanseatic_zenith: "Ганзейский Зенит" #NT!
 STATIC_MODIFIER_DESC_nd_pom_hanseatic_zenith: "Поморские купцы стоят на вершине балтийской торговли, их кораблям и конторам могут позавидовать северные моря." #NT!
 STATIC_MODIFIER_NAME_nd_pom_ducal_assertion: "Герцогское утверждение" #NT!
 STATIC_MODIFIER_DESC_nd_pom_ducal_assertion: "Герцог Грифон восстановил контроль над ганзейскими городами, поставив их доходы под герцогский надзор." #NT!
 nd_pom.1.t: "Знамя Грифона" #NT!
 nd_pom.1.d: "Красный грифон расправляет крылья по Померании. В течение пяти столетий Дом Грифонов правил этими балтийскими берегами, лавируя между амбициями Бранденбурга на юге и автономией великих ганзейских городов в пределах их собственных границ. Теперь, когда Померания объединена, необходимо сделать выбор относительно будущего герцогства.\n\nГерцоги Грифона уже давно изо всех сил пытаются навязать свою власть таким городам, как Штральзунд и Штеттин, чьи ганзейские привилегии предоставляют им почти независимость. Сможет ли герцог отстоять свои древние права и создать централизованное государство? Или он должен принять коммерческую республику в своем королевстве, правя в партнерстве с торговыми олигархами, чьи богатства создали эти берега?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pom.1.a: "Слово Грифона – закон в Померании." #NT!
 nd_pom.1.b: "Пусть ганзейские города будут нашей силой" #NT!
 nd_pom.2.t: "Торговый центр Одера" #NT!
 nd_pom.2.d: "Штеттин закрепил за собой позицию ворот Одера. Зерно из Бранденбурга и Великой Польши течет вниз по реке в порты Померании, а соль и сельдь возвращаются вглубь страны. Сорок гильдий города и шумные доки свидетельствуют о его богатстве. Но это процветание приносит свою собственную напряженность: будет ли коммерческое будущее герцогства определяться коллективной дисциплиной лиги или прямой рукой герцога?" #NT!
 nd_pom.2.a: "Ганза обеспечивает наше процветание" #NT!
 nd_pom.2.b: "Герцог будет управлять торговлей" #NT!
 nd_pom.3.t: "Стены Штральзунда" #NT!
 nd_pom.3.d: "Альбрехт фон Валленштейн, самый могущественный полководец Империи, привел свою армию к стенам Штральзунда. Городской совет отказался капитулировать Францбурга, и теперь имперское войско разбивает лагерь перед одиннадцатью воротами и тридцатью сторожевыми башнями. Сообщается, что Валленштейн поклялся, что возьмет город, даже если он будет прикован к небу.\n\nНо Штральзунд выстоит. Датские и шведские корабли прорывают блокаду, чтобы обеспечить снабжение гарнизона. Бюргеры занимают стены вместе с профессиональными солдатами. После нескольких недель бесплодных атак имперская армия отступает. Штральзунд доказал, что хорошо укрепленный город, защищенный решительными гражданами, может противостоять даже самой мощной армии Европы." #NT!
 nd_pom.3.a: "Грифон бросает вызов даже небесным цепям" #NT!
 nd_pom.4.t: "Университет в Грайфсвальде" #NT!
 nd_pom.4.d: "17 октября 1456 года герцог Померании-Вольгаста Вартислав IX открыл новый университет в Грайфсвальде, основанный по инициативе и щедрому покровительству мэра города Генриха Рубенова. Получив одобрение Папы, учреждение открывает свои двери как один из немногих учебных центров во всем Балтийском регионе.\n\nУниверситет привлекает студентов со всего Ганзейского мира, скандинавов, ливонцев и немцев, которые собираются изучать право, теологию и искусство. В течение первых десятилетий через его залы пройдут сотни иностранных ученых, что сделает Грайфсвальд маяком знаний среди торговли Вендишской Ганзы." #NT!
 nd_pom.4.a: "Пусть знания процветают на этих берегах Балтийского моря." #NT!
 nd_pom_wendish_shores: "Вендиш Шорс" #NT!
 nd_pom_wendish_shores_desc: "Славянские поморцы с незапамятных времен ловили рыбу в этих водах Балтики и добывали янтарь с ее берегов." #NT!
 nd_pom_griffin_dukedom: "Герцогство Грифона" #NT!
 nd_pom_griffin_dukedom_desc: "Дом Грифона, носящий своего красного геральдического зверя с XII века, установил герцогскую власть над поморскими землями." #NT!
 nd_pom_christianization: "Христианизация Померании" #NT!
 nd_pom_christianization_desc: "Обращение поморских славян привело герцогство в латинский христианский мир, основав епископства и монастыри вдоль побережья." #NT!
 nd_pom_town_charters: "Городские чартеры" #NT!
 nd_pom_town_charters_desc: "Поморские герцоги предоставили муниципальные права прибрежным поселениям, что спровоцировало рост городов, которые впоследствии стали центрами Ганзейской власти." #NT!
 nd_pom_hanseatic_membership: "Ганзейское членство" #NT!
 nd_pom_hanseatic_membership_desc: "Поморские города присоединились к Вендскому кварталу Ганзейского союза, связав свое состояние с крупнейшей торговой сетью в Северной Европе." #NT!
 nd_pom_stralsund_emporium: "Штральзундский торговый центр" #NT!
 nd_pom_stralsund_emporium_desc: "Штральзунд стал вторым городом Ганзы, 300 кораблей которого несут знамя через Балтийское море." #NT!
 nd_pom_herring_trade: "Ярмарки сельди" #NT!
 nd_pom_herring_trade_desc: "Великие ярмарки сельди на Балтийском побережье сделали поморские порты центром северной рыбной торговли.\n\n#italic Доступно в: $nd_pom_hansekontor$#!" #NT!
 nd_pom_greifswald_university: "Грайфсвальдский университет" #NT!
 nd_pom_greifswald_university_desc: "Грайфсвальдский университет, основанный в 1456 году герцогом Вартиславом IX, является одним из старейших в Северной Европе, привлекая ученых со всего Ганзейского мира." #NT!
 nd_pom_baltic_fleet: "Балтийский флот" #NT!
 nd_pom_baltic_fleet_desc: "Поморские кораблестроители расширили флот герцогства, превратив побережье в центр морской мощи." #NT!
 nd_pom_stettin_emporium: "Торговый центр Штеттина" #NT!
 nd_pom_stettin_emporium_desc: "Штеттин доминирует в торговле на реке Одер: зерно из внутренних районов и соль с побережья проходят через его шумные пристани." #NT!
 nd_pom_amber_craft: "Балтийский Янтарный Ремесло" #NT!
 nd_pom_amber_craft_desc: "Поморские мастера возвели обработку янтаря в высокое искусство, создавая ювелирные изделия и религиозные предметы, которые ценятся во всей Европе." #NT!
 nd_pom_burgher_autonomy: "Бюргерская автономия" #NT!
 nd_pom_burgher_autonomy_desc: "Ганзейские города получили юридические привилегии, которые ограничивают вмешательство герцогов, создавая уникальный баланс между феодальным и торговым управлением.\n\n#italic Доступно в: $nd_pom_hansekontor$#!" #NT!
 nd_pom_kaperfahrt: "Каперфарт" #NT!
 nd_pom_kaperfahrt_desc: "Поморская знать и даже некоторые герцоги занимались санкционированным государством пиратством, захватывая конкурирующие суда, чтобы установить морской контроль над южной Балтикой." #NT!
 nd_pom_stralsund_defenses: "Штральзундская оборона" #NT!
 nd_pom_stralsund_defenses_desc: "Легендарные стены Штральзунда, одиннадцать ворот и тридцать сторожевых башен оказались неприступными даже против императорской армии Валленштейна в 1628 году." #NT!
 nd_pom_evangelical_reform: "Евангелическая реформа" #NT!
 nd_pom_evangelical_reform_desc: "Померания рано приняла протестантскую Реформацию, превратив свои церкви и университеты в центры лютеранской науки.\n\n#italic Доступно в: $nd_pom_greifswalder_kollegium$#!" #NT!
 nd_pom_last_griffin: "Последний грифон" #NT!
 nd_pom_last_griffin_desc: "Герцог Богислав XIV, последний из пятивековой династии Грифонов, умело вел невозможную политику Тридцатилетней войны." #NT!
 nd_pom_wartime_resilience: "Устойчивость во время войны" #NT!
 nd_pom_wartime_resilience_desc: "Хотя Тридцатилетняя война уничтожила две трети населения Померании, уцелевшие общины восстановились с мрачной решимостью." #NT!
 nd_pom_urban_reconstruction: "Городская реконструкция" #NT!
 nd_pom_urban_reconstruction_desc: "После опустошения Тридцатилетней войны поморские города медленно восстанавливали свою инфраструктуру и торговые сети.\n\n#italic Доступно в: $nd_pom_coastal_bastion$#!" #NT!
 nd_pom_junker_estates: "Юнкер Эстейтс" #NT!
 nd_pom_junker_estates_desc: "Поморское землевладение консолидировало крупные сельскохозяйственные поместья, направляя производство зерна на экспорт через порты Балтии." #NT!
 nd_pom_baltic_admiralty: "Балтийское Адмиралтейство" #NT!
 nd_pom_baltic_admiralty_desc: "Под шведским, а затем и прусским управлением Померания сохранила свои военно-морские традиции, готовя моряков для Балтийского флота." #NT!
 nd_pom_academic_renaissance: "Академический Ренессанс" #NT!
 nd_pom_academic_renaissance_desc: "Университет Грайфсвальда, ныне старейший университет Швеции, переживает научный ренессанс под просвещенным патронажем." #NT!
 nd_pom_enlightenment_scholarship: "Стипендия Просвещения" #NT!
 nd_pom_enlightenment_scholarship_desc: "Ученые Грайфсвальда вносят вклад в эпоху Просвещения, создавая работы по натурфилософии, юриспруденции и региональной истории Балтии." #NT!
 nd_pom_stettin_industrialization: "Индустриализация Штеттина" #NT!
 nd_pom_stettin_industrialization_desc: "Порт Штеттина на реке Одер индустриализируется: верфи, литейные заводы и промышленные предприятия превращают средневековый торговый город в современный город.\n\n#italic Доступно в: $nd_pom_amber_workshop$#!" #NT!
 nd_pom_modern_shipyards: "Современные верфи" #NT!
 nd_pom_modern_shipyards_desc: "Поморские верфи внедряют современные технологии строительства, строя более быстрые и функциональные суда для балтийской торговли." #NT!
 nd_pom_economic_integration: "Экономическая интеграция" #NT!
 nd_pom_economic_integration_desc: "Померания интегрируется в более широкую экономическую сферу Германии, ее порты соединяют сельскохозяйственные районы с мировыми рынками." #NT!
 a_nd_pom_coastal_militia: "Поморское прибрежное ополчение" #NT!
 a_nd_pom_coastal_militia_desc: "Вооруженные горожане и прибрежные крестьяне, обученные защищать свои города-крепости, эти ополчения являются основой самообороны Померании." #NT!
 n_nd_pom_kogge: "Померанский Когге" #NT!
 n_nd_pom_kogge_desc: "Крепкий ганзейский винтик, рабочая лошадка балтийской торговли. Эти широкополосные суда перевозят огромные грузы через неспокойные северные воды и могут быть вооружены для войны." #NT!
 n_nd_pom_stralsund_frigate: "Штральзундский фрегат" #NT!
 n_nd_pom_stralsund_frigate_desc: "Специально построенный корабль береговой обороны на верфях Штральзунда, предназначенный для патрулирования узких проливов и защиты померанских гаваней." #NT!
 nd_pom_hansekontor: "Хансеконтор" #NT!
 nd_pom_hansekontor_desc: "Торговый пост Ганзейского союза, где купцы хранят товары, заключают контракты и координируют потоки балтийской торговли." #NT!
 nd_pom_greifswalder_kollegium: "Грайфсвальдский колледж" #NT!
 nd_pom_greifswalder_kollegium_desc: "Коллегиальное здание Грайфсвальдского университета, одного из старейших учебных центров Северной Европы." #NT!
 nd_pom_coastal_bastion: "Прибрежный бастион" #NT!
 nd_pom_coastal_bastion_desc: "Укрепленная оборонительная система гавани, вдохновленная легендарными стенами Штральзунда, призвана защищать померанские порты от морских атак." #NT!
 nd_pom_amber_workshop: "Янтарная мастерская" #NT!
 nd_pom_amber_workshop_desc: "Мастерская ремесленников, где балтийский янтарь обрабатывается, полируется и вставляется в изысканные ювелирные изделия для продажи через торговую сеть Ганзы." #NT!
 nd_pom_oder_warehouse: "Одерский склад" #NT!
 nd_pom_oder_warehouse_desc: "Коммерческий склад вдоль доков реки Одер, где хранится зерно, соль и другие товары, проходящие через оживленную торговую сеть Штеттина." #NT!
 nd_pom_hansekontor_maintenance: "Содержание Контора" #NT!
 nd_pom_hansekontor_maintenance_desc: "Регулярные расходы на содержание ганзейского торгового фактория, лес для ремонта, ткань для парусов и тентов, бумага для счетов." #NT!
 nd_pom_herring_processing: "Переработка сельди" #NT!
 nd_pom_herring_processing_desc: "Балтийскую сельдь чистят, солят и упаковывают в бочки, а рыба и соль расходуются на поддержание деятельности контора по торговле селедкой." #NT!
 nd_pom_grain_export: "Экспорт зерна" #NT!
 nd_pom_grain_export_desc: "Зерно реки Одер хранится, сортируется и готовится к экспорту на ганзейские рынки, потребляя пшеницу и пиломатериалы для хранения и бочки." #NT!
 nd_pom_kollegium_maintenance: "Содержание Коллегиума" #NT!
 nd_pom_kollegium_maintenance_desc: "Затраты на содержание университета, бумага для рукописей, книги для библиотеки, пчелиный воск для свечей." #NT!
 nd_pom_scholarly_printing: "Научная печать" #NT!
 nd_pom_scholarly_printing_desc: "Университетская типография работает на бумаге, чернилах и свинцовом шрифте для печати научных работ, распространяемых по всему Ганзейскому миру." #NT!
 nd_pom_bastion_maintenance: "Содержание Бастиона" #NT!
 nd_pom_bastion_maintenance_desc: "Для поддержания береговых укреплений необходим камень для стен, железо для ворот и вооружение для гарнизона." #NT!
 nd_pom_harbor_watch: "Гавань Дозор" #NT!
 nd_pom_harbor_watch_desc: "Расширенный гарнизон следит за подходами к гавани, обеспечивая военно-морские запасы и огнестрельное оружие для защиты померанских портов." #NT!
 nd_pom_amber_workshop_maintenance: "Содержание мастерской" #NT!
 nd_pom_amber_workshop_maintenance_desc: "Для содержания янтарной мастерской необходимы инструменты для резьбы, пчелиный воск для полировки и пиломатериалы для верстаков." #NT!
 nd_pom_amber_jewelry: "Янтарные украшения" #NT!
 nd_pom_amber_jewelry_desc: "Мастера-ремесленники превращают необработанный балтийский янтарь в изысканные украшения, четки и декоративные предметы, которые жаждут богатые люди по всей Европе." #NT!
 nd_pom_warehouse_maintenance: "Содержание склада" #NT!
 nd_pom_warehouse_maintenance_desc: "Для содержания склада на берегу реки требуется древесина для доков, камень для фундамента и гудрон для гидроизоляции." #NT!
 nd_pom_formed_tt: "Померания была образована" #NT!
 nd_pom_path_a_tt: "Выберите судьбу #bold Короны Грифона#!" #NT!
 nd_pom_path_b_tt: "Выберите судьбу #bold Вендишской Лиги#!" #NT!
 nd_pom_destiny: "Судьба Грифона" #NT!
 nd_pom_destiny_desc: "Объединенная Померания стоит на перепутье. Красный грифон должен выбрать свое будущее: герцогская власть, выкованная в железе, или ганзейское богатство, основанное на янтаре и соли." #NT!
 nd_pom_dest_iron_crown: "Железная Корона" #NT!
 nd_pom_dest_iron_crown_desc: "Обезопасьте Шверин и утвердите власть Грифона над соседними герцогствами. Поморский герцог должен доказать, что он больше, чем номинальный глава: он командует армиями, а не просто считает дома." #NT!
 nd_pom_dest_march_south: "Мартовский Юг" #NT!
 nd_pom_dest_march_south_desc: "Прорвитесь в Бранденбург и захватите Берлин и Росток. Одер — река Поморья; весь его путь должен протекать через земли Грифона." #NT!
 nd_pom_dest_baltic_dominion: "Балтийский Доминион" #NT!
 nd_pom_dest_baltic_dominion_desc: "Создайте настоящее Балтийское королевство, простирающееся от Магдебурга до Кенигсберга. Династия Грифонов будет править величайшим княжеством между Эльбой и Вислой." #NT!
 nd_pom_dest_amber_road: "Янтарная дорога" #NT!
 nd_pom_dest_amber_road_desc: "Захватите столицу Ганзы Любек и установите торговое господство Померании. Балтийский янтарь, золото севера, потечет через наши порты." #NT!
 nd_pom_dest_counting_houses: "Счетные палаты" #NT!
 nd_pom_dest_counting_houses_desc: "Овладейте институтами современных финансов и обеспечьте поток соли (жизненной силы торговли селедкой) через рынок капитала." #NT!
 nd_pom_dest_mare_balticum: "Маре Балтикум" #NT!
 nd_pom_dest_mare_balticum_desc: "Доминируйте в балтийской торговле от Любека до Висбю. Освойте глобальную торговлю и создайте флот, чтобы укрепить монополию Вендишской лиги на северные моря." #NT!
 nd_pom.5.t: "Судьба Грифона" #NT!
 nd_pom.5.d: "Померания объединилась: красный грифон теперь расправляет крылья над побережьем Балтийского моря. Но что это за царство? Судьба Дома Грифона еще не написана. Нам предстоит выбрать путь, который будет определять Померанию на века вперед." #NT!
 nd_pom.5.a: "Наша судьба ждет" #NT!
 nd_pom.6.t: "Железная Корона" #NT!
 nd_pom.6.d: "Шверин пал под руками померанцев. Герцоги Мекленбурга, которые когда-то смотрели на Грифонов свысока как на простых прибрежных лордов, теперь преклоняют колени перед нашим знаменем. Имея под нашим командованием профессиональную армию и доходы от ганзейских портов, финансирующие наши амбиции, герцог Грифон больше не является первым среди равных: он по-настоящему суверен." #NT!
 nd_pom.6.a: "Грифон командует, а север подчиняется" #NT!
 nd_pom.7.t: "Мартовский Юг" #NT!
 nd_pom.7.d: "Берлин и Росток наши. Одер от истоков до моря теперь протекает через территорию Грифона. Лорды Бранденбурга были унижены, и померанский герцог смотрит на юг, через земли, которые когда-то казались невероятно далекими. Как нам закрепить эти завоевания: с помощью постоянной армии, подчиняющейся только герцогу, или с помощью пограничных маршей, которые проецируют нашу мощь наружу?" #NT!
 nd_pom.7.a: "Создайте профессиональную герцогскую армию." #NT!
 nd_pom.7.b: "Установить укрепленные пограничные марши" #NT!
 nd_pom.8.t: "Балтийский Доминион" #NT!
 nd_pom.8.d: "От Эльбы до Вислы красный грифон одинаково пролетает над крепостью и над городом. Магдебург и Кенигсберг (резиденции архиепископов и великих магистров) теперь подчиняются Померании. То, что начиналось как скромное прибрежное герцогство, превратилось в доминирующую державу Северо-Германской равнины. Династия Грифонов достигла того, что казалось невозможным. Будем ли мы править посредством военной мощи или через институты управления?" #NT!
 nd_pom.8.a: "Наши армии — основа нашей мощи" #NT!
 nd_pom.8.b: "Мы создадим институты управления" #NT!
 nd_pom.9.t: "Янтарная дорога" #NT!
 nd_pom.9.d: "Любек, королева Ганзы, несет знамя Грифона. Крупнейший торговый город Северной Европы теперь является поморским владением. Янтарь, соль, зерно и сельдь проходят через наши порты в количествах, которые потрясли бы наших предков. Вендская Ганза нашла своего защитника: не союз ссорящихся купцов, а единое герцогство, способное при необходимости обеспечить свободную торговлю на острие меча." #NT!
 nd_pom.9.a: "Янтарная дорога ведет в Померанию" #NT!
 nd_pom.10.t: "Счетные палаты" #NT!
 nd_pom.10.d: "Счетные палаты Штеттина и Штральзунда превратились в полноценные банковские учреждения, занимающиеся аккредитивами и обменом по всему Прибалтике. Соль из Люнебурга и Кольберга течет через наш столичный рынок, сохраняя сельдь, которая является основным продуктом северной торговли. Будем ли мы консолидировать это богатство посредством монополистического контроля или посредством зарегистрированных гильдий, привлекающих таланты со всей Европы?" #NT!
 nd_pom.10.a: "Установить монопольный контроль над ключевыми профессиями" #NT!
 nd_pom.10.b: "Чартерные гильдии для содействия процветанию" #NT!
 nd_pom.11.t: "Маре Балтикум" #NT!
 nd_pom.11.d: "Балтийское море – это Поморское озеро. От Любека до Висби великие перевалочные пункты северной торговли подчиняются Вендской лиге под покровительством Грифона. Наши купцы торгуют во всех портах от Бергена до Новгорода. Наш флот обеспечивает мир в торговле. Богатство севера течет через руки померанцев. Откроем ли мы наши порты миру или торговые князья будут править как суверенные лорды торговли?" #NT!
 nd_pom.11.a: "Объявить поморские порты свободными и открытыми" #NT!
 nd_pom.11.b: "Пусть торговые князья управляют" #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_ducal_army: "Герцогская армия" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_ducal_army: "Герцог Грифон создал профессиональную постоянную армию, заменив ненадежные феодальные рекруты войсками, подчиняющимися только герцогской короне." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_border_march: "Пограничный марш" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_border_march: "Укрепленные пограничные марши защищают расширенные границы Померании, распространяя власть Грифона на соседние земли." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_iron_scepter: "Железный скипетр" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_iron_scepter: "Военная машина Померании — это ужас Северной Европы, ее ветераны, закаленные десятилетиями завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_griffin_throne: "Трон Грифона" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_griffin_throne: "Династия Грифонов правит посредством сложного управления, связывая вассалов и подданных институциональной лояльностью, а не одним только страхом." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_salt_monopoly: "Соляная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_salt_monopoly: "Поморский контроль над торговлей солью в Балтийском море дал герцогству непревзойденные коммерческие рычаги, привлекая людей и товары на свои рынки." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_guild_charter: "Устав гильдии" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_guild_charter: "Дипломированные гильдии привлекают квалифицированных мастеров со всей Европы в померанские города, хотя стоимость содержания вооруженных сил в мирное время возрастает." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_free_port: "Свободный порт" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_free_port: "Поморские порты объявлены открытыми для всех стран, привлекая торговцев, шпионов и новаторов со всех уголков известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_pom_dest_merchant_prince: "Торговый принц" #NT!
 STATIC_MODIFIER_DESC_nd_pom_dest_merchant_prince: "Великие купеческие семьи Штральзунда и Штеттина управляют как торговые князья, их богатство и влияние скрепляют королевство." #NT!
 nd_pom_griffinburg: "Гриффинбург" #NT!
 nd_pom_griffinburg_desc: "Могучая герцогская крепость-дворец, увенчанная красным грифоном, олицетворяющая военную власть династии Грифонов над ее балтийскими владениями." #NT!
 nd_pom_griffinburg_maintenance: "Содержание Гриффинбурга" #NT!
 nd_pom_griffinburg_maintenance_desc: "Для поддержания герцогской крепости необходим камень для стен, оружие для гарнизона, железо для ворот и инструменты для ремонта." #NT!
 nd_pom_stapelhaus: "Стапельхаус" #NT!
 nd_pom_stapelhaus_desc: "Величественный ганзейский главный дом, где товары хранятся, взвешиваются и облагаются налогом перед реэкспортом, коммерческий центр Вендишской лиги." #NT!
 nd_pom_stapelhaus_maintenance: "Содержание Стапельхауса" #NT!
 nd_pom_stapelhaus_maintenance_desc: "Для работы основного дома требуются древесина для хранения, ткань для упаковки, бумага для счетов и соль для хранения товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
 pom_pomeranian_landtag_bureaucracy: "Поморский ландтаг" #NT!
 pom_pomeranian_landtag_bureaucracy_desc: "Сословное собрание Померанского герцогства, включающее прелатов капитула Каммин, местную знать восточных и западных кругов Передней Померании, а также депутатов от ганзейских городов Штеттин, Штральзунд, Грайфсвальд, Анклам и Штаргард. Герцоги Грайфена созвали Ландтаг, чтобы ратифицировать денежное налогообложение, финансирование войны и церковную политику; его вето на чрезвычайные сборы обязало каждого герцога прийти к согласию, и 13 декабря 1534 года в Трептов-ан-дер-Рега состоялось редкое унитарное заседание, на котором сословия совместно приняли лютеранскую Реформацию, основополагающее политическое событие Померании шестнадцатого века." #NT!
  
 pom_wolgast_hofgericht_bureaucracy: "Хофгерихт цу Вольгаст" #NT!
 pom_wolgast_hofgericht_bureaucracy_desc: "Высокий герцогский суд Филипп I учредил в своей резиденции в Вольгасте в 1530-х годах, в котором сам герцог выносил приговор, что было преднамеренным утверждением княжеской справедливости в отношении Patrimonialgerichte благородного Риттергутера. Hofgericht записывал земельные споры, уголовные заявления о герцогских интересах и апелляции ганзейских городских судов; его письменные списки стали юридическим архивом, с которым канцелярия Грайфена все еще консультировалась при Богиславе XIV столетие спустя, и институциональной основой, которую и Трибунал Шведской Померании в Грайфсвальде, и Бранденбургско-Прусский Хофгерихт унаследовали в нетронутом виде после 1648 года." #NT!
  
 pom_wendish_hanse_quarter_bureaucracy: "Вендишский Ганзейский квартал" #NT!
 pom_wendish_hanse_quarter_bureaucracy_desc: "Федерация Штральзунда, Штеттина, Грайфсвальда, Анклама, Деммина, Кольберга и Штаргарда в составе вендской трети Ганзейского союза с конца тринадцатого века предоставила свое собственное представительство в Ганзетаге в Любеке. Один только Штральзунд в четырнадцатом веке выставил под своим флагом около трехсот судов, уступая только Любеку на Балтике. Патрицианские городские советы сохраняли jus civitatis, привилегии монетного двора и адмиралтейство над своими внутренними районами, платя герцогу за защиту, а не подчиняясь ему, - конституционная аномалия, которая периодически выливалась в открытое восстание против Грайфенов, как во время Штральзундских восстаний 1391 и 1407 годов." #NT!
  
 pom_kirchenordnung_bureaucracy: "Бугенхаген Кирхенорднунг" #NT!
 pom_kirchenordnung_bureaucracy_desc: "Конституция лютеранской церкви, разработанная доктором Помераном Иоганнесом Бугенхагеном Воллинским по просьбе герцогов Барнима XI и Филиппа I в 1534–1535 годах и окончательно введенная в действие в 1563 году. Она распустила старое наследие капитула Каммина, передала доходы епископства в руки герцога в качестве светского фонда и реорганизовала приходскую жизнь под руководством суперинтендантов, ответственных за помощь бедным, школьное обучение и катехизическое обследование каждого дома. Поморская Реформация была в равной степени актом государственного управления и богословия, привязав лютеранское духовенство к герцогскому двору и снабдив герцогство грамотной приходской инфраструктурой, которая столетие спустя превратила Грайфсвальд и Штральзунд в рассадники пиетистского учения." #NT!
  
 pom_rittergut_gutsherrschaft_bureaucracy: "Риттергут Гутшерршафт" #NT!
 pom_rittergut_gutsherrschaft_bureaucracy_desc: "Манориальный режим поморских рыцарских поместий, в котором юнкер-помещик осуществлял Gutsherrschaft над закрепощенным крестьянством: регулировал браки, добивался принудительного Gesindezwangsdienst от младших сыновей и обрабатывал владения напрямую барщинным трудом для отправки балтийского зерна на запад через ганзейские порты. Крестьянско-пастушеское положение 1616 г. закрепило самую суровую форму системы, и четверть всех рыцарских поместий после 1648 г. перешла к шведским дворянам, не потревожив ни единой крестьянской обузы. Риттергютер поставлял кавалерийский набор и офицерский корпус; их лорды ожидали и получили почти полную юрисдикционную автономию от герцога." #NT!
  
  # ===== BUREAUCRACY AUTHORITY ===== 
 AUTO_MODIFIER_NAME_nd_pom_bureaucracy_authority: "Бюрократическая власть Померании" #NT!
 AUTO_MODIFIER_DESC_nd_pom_bureaucracy_authority: "Провозглашение [POM.GetName] унитарным наследником герцогов Грайфенов устанавливает институциональный аппарат балтийского приграничья: Ландтаг сословий, Вольгаст Хофгерихт, Вендский ганзейский квартал, Бугенхаген Кирхенорднунг и Риттергут Гутшерршафт. Помимо столичного универсального, предоставляется еще одно бюрократическое место." #NT!
