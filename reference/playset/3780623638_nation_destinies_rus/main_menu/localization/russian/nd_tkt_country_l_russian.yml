l_russian:
 TKT: "Рыцари Храма" #NT!
 TKT_ADJ: "Тамплиер" #NT!
 TKT_f: "Рыцари Храма" #NT!
 TKT_f_desc: "Восстановить Pauperes Commilitones Christi Templique Salomonici как суверенный религиозно-военный орден, отказавшись от роспуска 1312 года и унаследовав иберийские банковские дома, Атлантический флот и монастырь Томар, которые история позволила сохранить только Ордену Христа. Суверенное государство тамплиеров представляет собой первую в католическом мире международную банковскую корпорацию, преобразованную в государство, рыцарскую республику казначеев, мореплавателей и тихих еретиков, обращенную к Атлантическому океану, чье секретное отделение подчиняется только папе, поднявшему буллу Климента V." #NT!
