l_russian:
 STATIC_MODIFIER_NAME_nd_tenka_fubu: "Тенка Фубу" #NT!
 STATIC_MODIFIER_DESC_nd_tenka_fubu: "Царство под одним мечом. Из пепла Сэнгоку Дзидай восстает Япония, объединенная военным превосходством, где сильнейший клан наводит порядок с помощью силы оружия и владения комбинированной тактикой пехоты и огнестрельного оружия." #NT!
 STATIC_MODIFIER_NAME_nd_pax_tokugawa: "Пакс Токугава" #NT!
 STATIC_MODIFIER_DESC_nd_pax_tokugawa: "Долгий мир. После того, как воюющие государства были покорены, Япония сосредоточилась на освоении своих владений. Рисовые поля расширяются, города-замки процветают, а торговый класс процветает в условиях стабильного порядка централизованного правления." #NT!
 STATIC_MODIFIER_NAME_nd_land_of_rising_sun: "Страна восходящего солнца" #NT!
 STATIC_MODIFIER_DESC_nd_land_of_rising_sun: "Отдельная цивилизация. Объединенная Япония утверждает свою уникальную культурную самобытность: совершенство чайной церемонии, утонченность бусидо и расцвет искусств, которые будут определять японскую цивилизацию на протяжении веков." #NT!
 nd_jap.1.t: "Сэнгоку заканчивается" #NT!
 nd_jap.1.d: "Последние угли Сэнгоку Дзидай погасли. По провинциям Японии больше не развеваются знамена соперничающих кланов. Их сносили, сжигали или заново приносили в залог победившему дому. Император, как всегда, заседает в Киото, но реальная власть теперь исходит только из одного источника.\n\nОбъединитель стоит перед выбором, который будет формировать поколения. Методы завоевания (массированные асигару, осады замков, безжалостное подчинение соперников) можно обратить вовне, превратив Японию в военную державу, доминирующую в Восточной Азии. Или меч можно вложить в ножны, перенаправив энергию нации на внутреннее развитие, мир и процветание, которое придет за два столетия без войн. Или, возможно, этот момент требует чего-то более высокого: возвышения самой японской цивилизации, культурного расцвета, который делает острова предметом зависти всего известного мира.\n\nКакой путь определит новую Японию?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_jap.1.a: "Тенка Фубу: царство под одним мечом." #NT!
 nd_jap.1.b: "Ищите Пакс Токугава: процветание через мир." #NT!
 nd_jap.1.c: "Мы — Страна восходящего солнца. Пусть наша культура сияет." #NT!
 STATIC_MODIFIER_NAME_nd_jap_sword_hunt_decree: "Указ Катанагари" #NT!
 STATIC_MODIFIER_DESC_nd_jap_sword_hunt_decree: "Великая охота с мечом лишила крестьянство оружия, консолидировав инструменты насилия в руках только класса самураев. Порядок восстановлен, и вероятность восстания становится гораздо менее вероятной." #NT!
 nd_jap.2.t: "Великая охота за мечом" #NT!
 nd_jap.2.d: "После объединения во всех провинциях провозглашается указ: все мечи, короткие мечи, луки и огнестрельное оружие, находящиеся в руках простого народа, должны быть конфискованы. Официальная причина заключается в том, что металл будет переплавлен для выковки гвоздей и болтов для великой статуи Будды: благочестивая выдумка, в которую мало кто верит, но все подчиняются.\n\nИстинная цель безошибочна. Разоружением крестьянства новый порядок проводит непреодолимую линию между классом воинов и всеми остальными. Никогда больше фермеры не возьмутся за оружие в восстаниях икки или не сплотятся вокруг амбициозных местных лордов. Охота на мечах меняет социальный порядок Японии так же глубоко, как и любое сражение, устанавливая монополию на насилие, которая сохранится на века." #NT!
 nd_jap.2.a: "Пусть мечи будут собраны." #NT!
 nd_jap.3.t: "Провозглашен Санкин-Котай" #NT!
 nd_jap.3.d: "Придуман мастерский инструмент контроля: система поочередного присутствия. Каждый даймё в Японии теперь должен иметь резиденцию как в Эдо, так и в своем родном владении, путешествуя между ними по фиксированному графику. Их жены и дети навсегда остаются в Эдо, почетные гости, оказавшиеся заложниками.\n\nФинансовое бремя ошеломляет. Процессии каждого даймё (сотни или тысячи вассалов, все в парадной одежде) должны путешествовать по великим дорогам с огромными затратами. Жилье, подарки и содержание величественных особняков Эдо истощают казну княжества. То золото, которое могло быть потрачено на армии и укрепления, вместо этого течет в дороги, гостиницы и казну торговцев Эдо.\n\nЭто, возможно, самая элегантная система политического контроля, когда-либо придуманная. Даймё сохраняют верность не угрозой применения силы, а постоянной потерей своего богатства." #NT!
 nd_jap.3.a: "Система, достойная восхищения." #NT!
 nd_jap.4.t: "Возрождение Гэнроку" #NT!
 nd_jap.4.d: "В условиях длительного мира японская культура достигла небывалых высот. В Эдо, Осаке и Киото торговый класс покровительствует искусствам, которые были невообразимы во времена хаоса Сэнгоку. Театр Кабуки собирает переполненные аудитории, хайку достигает своего совершенства в стихах странствующих поэтов, а гравюры на дереве запечатлевают плавучий мир удовольствий и природных красот.\n\nЧайная церемония превратилась из простого ритуала в сложную философию эстетики. Керамическое искусство производит изделия, которые ищут коллекционеры по всей Восточной Азии. Кукольный театр Бунраку достигает драматической утонченности, которая может соперничать с любой сценой мира. Даже боевые искусства, освобожденные от срочности реальной войны, превращаются в формализованные школы фехтования и стрельбы из лука.\n\nЭто парадокс мира Токугава: воинское общество, которому запрещено сражаться, направляет свою энергию на создание одной из самых совершенных цивилизаций в истории человечества." #NT!
 nd_jap.4.a: "Пусть расцветают тысячи цветов." #NT!
 STATIC_MODIFIER_NAME_nd_jap_sakoku_consolidation: "Объединение Сакоку" #NT!
 STATIC_MODIFIER_DESC_nd_jap_sakoku_consolidation: "Поскольку иностранное влияние тщательно контролируется, Япония замыкается в себе. Стабильность изоляции позволяет внутренним институтам развиваться без внешнего вмешательства." #NT!
 STATIC_MODIFIER_NAME_nd_jap_sakoku_rangaku: "Окно Рангаку" #NT!
 STATIC_MODIFIER_DESC_nd_jap_sakoku_rangaku: "Через крошечное окошко Дэдзимы обучение голландскому языку проникает в Японию. Медицинские тексты, астрономические карты и натурфилософия просачиваются через горстку переводчиков, говорящих на языке рыжеволосых варваров." #NT!
 nd_jap.5.t: "Сакоку: закрытая страна" #NT!
 nd_jap.5.d: "Указы были провозглашены: Япония должна закрыть свои двери для мира. Португальские миссионеры изгнаны. Испанские торговцы запрещены. Английская фабрика в Хирадо закрыта. Только голландцам и китайцам разрешено торговать, и только на крошечном искусственном острове Дэдзима в гавани Нагасаки под строжайшим надзором.\n\nЯпонским подданным запрещено выезжать за границу под страхом смерти. Те, кто уже находится за границей, могут никогда не вернуться. Огромные океанские корабли приказано уничтожить и заменить их прибрежными судами, слишком маленькими, чтобы пересекать открытую воду.\n\nОднако закрытие не является абсолютным. Через Дэдзиму продолжает течь ручеек западных знаний, книг по медицине, астрономии и военной науке, которые небольшой круг ученых изучает как рангаку, голландское учение. Вопрос в том, будет ли Япония использовать эту изоляцию для совершенствования своей собственной цивилизации или же она отстанет от западных держав, которые даже сейчас осваивают земной шар." #NT!
 nd_jap.5.a: "Закройте границы: наша цивилизация не нуждается во внешнем влиянии." #NT!
 nd_jap.5.b: "Поддерживайте голландское окно. Знания не знают границ." #NT!
 nd_jap.6.t: "Рангаку: изучение голландского языка" #NT!
 nd_jap.6.d: "На протяжении нескольких поколений небольшая группа ученых в Нагасаки корпела над голландскими текстами, кропотливо переводя работы по анатомии, астрономии, ботанике и военному делу. То, что началось как праздное любопытство, переросло в серьезное интеллектуальное движение.\n\nПрорыв произошел с переводом голландского текста по анатомии, когда японские врачи обнаружили, что их традиционные китайские медицинские карты пронизаны ошибками, в то время как западные диаграммы соответствуют тому, что они фактически наблюдали при вскрытиях. Последствия были глубокими: варвары, несмотря на все свои грубые манеры, обладали подлинными знаниями, которых не хватало Японии.\n\nСейчас школы рангаку распространяются по всей стране. Лорды доменов спонсируют ученых для изучения западного артиллерийского дела и фортификации. Врачи перенимают западные хирургические методы. Астрономы исправляют веками накапливавшиеся ошибки. Идет тихая революция в знаниях: она подготовит Японию к шоку насильственной открытости, который ждет впереди." #NT!
 nd_jap.6.a: "Знания – величайшее оружие." #NT!
 STATIC_MODIFIER_NAME_nd_jap_restoration_imperial: "Имперская реставрация" #NT!
 STATIC_MODIFIER_DESC_nd_jap_restoration_imperial: "Император был восстановлен как истинный правитель Японии. Легитимность вновь исходит от Хризантемового Трона, и централизованное государство черпает силу из этого древнего источника власти." #NT!
 STATIC_MODIFIER_NAME_nd_jap_restoration_modernize: "Бунмей Кайка" #NT!
 STATIC_MODIFIER_DESC_nd_jap_restoration_modernize: "Цивилизация и просвещение! Япония отбрасывает старые ограничения и принимает участие в массовой модернизации. Западная наука, промышленность и институты внедряются с головокружительной скоростью." #NT!
 nd_jap.7.t: "Фукоку Кёхей" #NT!
 nd_jap.7.d: "Обогащайте страну, укрепляйте армию: этот лозунг эхом разносится по Японии на заре новой эры. Старый порядок рушится, будь то внутреннее давление или угроза иностранных канонерских лодок, что имеет меньшее значение, чем ответные меры. Япония должна трансформироваться или быть уничтожена.\n\nСоперничают два видения. Первый смотрит на Трон Хризантем: император, на протяжении веков отстраненный сёгунатом, может служить объединяющим символом централизованного современного государства. Восстановление империи сосредоточит власть, сметет фрагментированную систему доменов и направит национальную энергию под единую суверенную волю.\n\nВторое видение смотрит на Запад. Японии нужно не просто новое руководство, но и новые знания: науки, промышленность и институты, которые сделали западные державы доминирующими. Отправляйте студентов за границу. Нанимайте иностранных консультантов. Стройте железные дороги и телеграфные линии. Выживет нация, которая модернизируется быстрее всех.\n\nВозможно, оба пути ведут к одному и тому же пункту назначения. Но акцент, выбранный сейчас, будет формировать характер Японии на многие поколения." #NT!
 nd_jap.7.a: "Восстановите Императора: Сонно Джой!" #NT!
 nd_jap.7.b: "Ищите цивилизацию и просвещение: Бунмей Кайка!" #NT!
 nd_jap_za_merchant_guilds: "За Торговые Гильдии" #NT!
 nd_jap_za_merchant_guilds_desc: "Создание дза, монополистических торговых гильдий, действующих под покровительством храмов, святилищ и благородных домов в эпоху Муромати." #NT!
 nd_jap_tachi_forging: "Тачи Ковка" #NT!
 nd_jap_tachi_forging_desc: "Искусство ковки тати: длинный изогнутый меч конного самурая, предшественник катаны и символ класса воинов." #NT!
 nd_jap_shoen_estates: "Шоен Эстейтс" #NT!
 nd_jap_shoen_estates_desc: "Система частных владений аристократов, храмов и домов воинов, составляющая экономическую основу средневековой Японии." #NT!
 nd_jap_shugo_administration: "Администрация Сюго" #NT!
 nd_jap_shugo_administration_desc: "Назначение военных губернаторов, сюго, для управления провинциями от имени сёгуната, создающее основу для централизованного контроля." #NT!
 nd_jap_wokou_traditions: "Традиции Вокоу" #NT!
 nd_jap_wokou_traditions_desc: "Традиции морских набегов пиратов вокоу, терроризировавших побережья Кореи и Китая, положили начало первым военно-морским возможностям Японии." #NT!
 nd_jap_nanbokucho_legacy: "Нанбокучо Наследие" #NT!
 nd_jap_nanbokucho_legacy_desc: "Непреходящее наследие периода Северного и Южного дворов: эпоха разделения, которая, тем не менее, установила легитимность имперской преемственности и политические структуры, которые сформировали Японию." #NT!
 nd_jap_muromachi_culture: "Культура Муромати" #NT!
 nd_jap_muromachi_culture_desc: "Расцвет искусств под влиянием дзэн при сёгунах Асикага: живопись тушью, театр Но, чайная церемония и сухие ландшафтные сады, которые определяют японскую эстетику." #NT!
 nd_jap_yari_ashigaru: "Яри ​​Асигару" #NT!
 nd_jap_yari_ashigaru_desc: "Организация крестьянских пехотинцев в дисциплинированные формирования, вооруженные длинными копьями яри, превращающая боевые действия из индивидуального самурайского боя в тактику массовой пехоты." #NT!
 nd_jap_za_expansion: "Расширение За" #NT!
 nd_jap_za_expansion_desc: "Рост торговых гильдий за пределами своих храмовых покровителей, развитие независимого монополистического контроля над производством, транспортировкой и продажей ключевых товаров." #NT!
 nd_jap_yamashiro_fortification: "Укрепление Ямасиро" #NT!
 nd_jap_yamashiro_fortification_desc: "Строительство горных крепостей ямасиро, которые используют пересеченную местность Японии для создания почти неприступных оборонительных позиций." #NT!
 nd_jap_tally_trade: "Талли Трейд" #NT!
 nd_jap_tally_trade_desc: "Система регулируемой морской торговли с Минским Китаем с использованием официальных учетных сертификатов, устанавливающая положение Японии в торговой сети Восточной Азии." #NT!
 nd_jap_sohei_tradition: "Традиции Сохэй" #NT!
 nd_jap_sohei_tradition_desc: "Традиция монахов-воинов великих буддийских монастырей, грозных бойцов, владеющих нагинатой для защиты своих храмов и веры." #NT!
 nd_jap_tanegashima_firearms: "Танегасима огнестрельное оружие" #NT!
 nd_jap_tanegashima_firearms_desc: "Принятие на вооружение португальских ружей с фитильными замками, танегасима, и их быстрое массовое производство японскими кузнецами навсегда изменили характер японской войны." #NT!
 nd_jap_nanban_trade: "Нанбан Трейд" #NT!
 nd_jap_nanban_trade_desc: "Торгуйте с «южными варварами»: португальскими и испанскими купцами, которые привозят к берегам Японии огнестрельное оружие, христианство и экзотические товары." #NT!
 nd_jap_castle_revolution: "Замок Революции" #NT!
 nd_jap_castle_revolution_desc: "Превращение горных крепостей в равнинные замки с массивными каменными стенами, широкими рвами и высокими крепостями: архитектурный знак эпохи Сэнгоку." #NT!
 nd_jap_sekibune_patrol: "Патрульный флот Сэкибуне" #NT!
 nd_jap_sekibune_patrol_desc: "Быстроходные прибрежные патрульные корабли, охраняющие обширную береговую линию Японии от пиратов, контрабандистов и иностранных злоумышленников." #NT!
 nd_jap_ikko_ikki_suppression: "Подавление Икко-Икки" #NT!
 nd_jap_ikko_ikki_suppression_desc: "Систематическое подавление воинствующих буддийских восстаний Икко-икки, положившее конец эпохе религиозно мотивированных крестьянских восстаний и укрепив светскую власть." #NT!
 nd_jap_daiku_tradition: "Традиция Дайку" #NT!
 nd_jap_daiku_tradition_desc: "Традиция мастера-плотника, дайку, чьи навыки столярного дела, строительства замков и храмов представляют собой одни из лучших результатов обработки дерева в мире." #NT!
 nd_jap_tamahagane_smithing: "Тамахагане Кузнечное дело" #NT!
 nd_jap_tamahagane_smithing_desc: "Искусство плавки железного песка в печи татара для производства тамахаганэ: драгоценной стали, из которой выковываются японские клинки." #NT!
 nd_jap_sword_hunt: "Охота за мечом" #NT!
 nd_jap_sword_hunt_desc: "Катанагари: систематическая конфискация оружия у крестьян для укрепления монополии самураев на насилие." #NT!
 nd_jap_kenchi_land_survey: "Земельное обследование Кенчи" #NT!
 nd_jap_kenchi_land_survey_desc: "Комплексные кадастровые исследования, измеряющие каждое рисовое поле и поле, создают рациональную основу для налогообложения и управления доменами." #NT!
 nd_jap_atakebune_warship: "Боевые корабли Атакебуне" #NT!
 nd_jap_atakebune_warship_desc: "Массивные весельные военные корабли с деревянной броней — плавучие крепости, господствующие в прибрежных водах Японии." #NT!
 nd_jap_korea_invasion: "Корейские кампании" #NT!
 nd_jap_korea_invasion_desc: "Крупномасштабные военные экспедиции на Корейский полуостров, амбициозные кампании, которые проверяли объединенную военную мощь Японии против континентальных держав." #NT!
 nd_jap_christian_expulsion: "Христианское изгнание" #NT!
 nd_jap_christian_expulsion_desc: "Систематическое преследование и изгнание христианских миссионеров и новообращенных, утверждение религиозного суверенитета Японии и устранение предполагаемой угрозы общественному порядку." #NT!
 nd_jap_sankin_kotai: "Санкин-Котай" #NT!
 nd_jap_sankin_kotai_desc: "Система поочередного посещения, требующая от даймё иметь резиденции в Эдо и регулярно путешествовать туда, опустошая свою казну и одновременно обогащая столицу." #NT!
 nd_jap_controlled_trade: "Контролируемая торговля" #NT!
 nd_jap_controlled_trade_desc: "Ограничение внешней торговли определенными портами под строгим контролем правительства, сохранение суверенитета при сохранении доступа к товарам первой необходимости." #NT!
 nd_jap_hatamoto_guard: "Хатамото Страж" #NT!
 nd_jap_hatamoto_guard_desc: "Непосредственные вассалы сёгуна, элитные воины, составляющие профессиональное ядро ​​военного ведомства Токугава." #NT!
 nd_jap_genroku_culture: "Культура Гэнроку" #NT!
 nd_jap_genroku_culture_desc: "Золотой век искусства периода Эдо: театр кабуки, поэзия хайку, гравюры на дереве укиё-э и изысканная эстетика чайной церемонии." #NT!
 nd_jap_temple_schools: "Храмовые школы" #NT!
 nd_jap_temple_schools_desc: "Теракойя, общественные школы при буддийских храмах и самураях-пенсионерах, которые обучают детей простолюдинов чтению, письму и арифметике." #NT!
 nd_jap_machi_bugyou: "Мачи Бугё" #NT!
 nd_jap_machi_bugyou_desc: "Система городских магистратов, эффективные городские администраторы, которые поддерживают порядок, разрешают споры и управляют оживленной коммерческой жизнью крупнейших городов Японии." #NT!
 nd_jap_rangaku_studies: "Исследования Рангаку" #NT!
 nd_jap_rangaku_studies_desc: "Систематическое изучение западной науки и техники с помощью голландских текстов, закладывающее интеллектуальную основу для будущей модернизации Японии." #NT!
 nd_jap_kaibogaku_defense: "Кайбогаку Защита" #NT!
 nd_jap_kaibogaku_defense_desc: "Исследования береговой обороны, сочетающие традиционные укрепления с западной военной наукой, готовят Японию к угрозе иностранной военно-морской мощи." #NT!
 nd_jap_han_reforms: "Ханьские реформы" #NT!
 nd_jap_han_reforms_desc: "Административная модернизация системы доменов, рационализация налогообложения, бюрократическая эффективность и финансовая реформа под руководством прогрессивных даймё." #NT!
 nd_jap_proto_industry: "Протоиндустриализация" #NT!
 nd_jap_proto_industry_desc: "Появление надомных предприятий, заводов по производству сакэ и текстильных мастерских, которые начинают трансформировать экономику Японии от чистого сельского хозяйства к производству." #NT!
 nd_jap_fukoku_kyohei: "Фукоку Кёхей" #NT!
 nd_jap_fukoku_kyohei_desc: "Обогащайте страну, укрепляйте армию: сплоченный клич модернизаторов Японии, которые стремятся построить нацию, способную стоять в ряду великих держав." #NT!
 nd_jap_meiji_precursors: "Предшественники Мэйдзи" #NT!
 nd_jap_meiji_precursors_desc: "Интеллектуальные и политические движения, которые предвещают Реставрацию Мэйдзи, призывают к имперскому правлению, западному обучению и превращению Японии в централизованное современное государство." #NT!
 n_nd_jap_kobaya: "Кобая" #NT!
 n_nd_jap_kobaya_desc: "Быстроходные рейдовые суда, используемые пиратами вокоу, легкие и маневренные суда, созданные для скорости в прибрежных водах и быстрых ударов по торговому судоходству." #NT!
 a_nd_jap_yari_ashigaru: "Яри ​​Асигару" #NT!
 a_nd_jap_yari_ashigaru_desc: "Крестьянские пехотинцы, вооруженные длинными копьями-яри, сражаются в дисциплинированных фаланговых построениях. То, чего им не хватает в боевой подготовке, они компенсируют массой и размахом." #NT!
 a_nd_jap_sohei: "Сохей" #NT!
 a_nd_jap_sohei_desc: "Буддийские монахи-воины, сражающиеся с фанатизмом набожных. Вооруженные древковым оружием нагината и закаленные аскетической практикой, они грозны на поле боя." #NT!
 a_nd_jap_ashigaru_teppo: "Асигару Тэппо" #NT!
 a_nd_jap_ashigaru_teppo_desc: "Крупная крестьянская пехота, вооруженная ружьями танегасима с фитильными замками. Недостаток индивидуальных боевых навыков они компенсируют разрушительным залповым огнём, способным разбить даже самую сильную самурайскую атаку." #NT!
 n_nd_jap_sekibune: "Секибуне" #NT!
 n_nd_jap_sekibune_desc: "Быстроходный патрульный корабль, созданный для скорости и маневренности в прибрежных водах Японии. Идеально подходит для охоты на пиратов и перехвата контрабандистов." #NT!
 n_nd_jap_atakebune: "Атакебуне" #NT!
 n_nd_jap_atakebune_desc: "Массивные плавучие крепости с веслами, покрытые деревянной броней. Эти броненосные предшественники доминируют в прибрежных водах благодаря своему тяжелому вооружению и почти непроницаемому корпусу." #NT!
 a_nd_jap_hatamoto: "Хатамото" #NT!
 a_nd_jap_hatamoto_desc: "Знаменосцы, прямые вассалы сёгуна, набранные из наиболее преданных воинских семей. Эти элитные солдаты сочетают в себе дисциплину профессиональных войск с боевыми традициями самураев." #NT!
 levy_nd_jap_sohei: "Сохей Леви" #NT!
 levy_nd_jap_sohei_desc: "Буддийские монахи-воины, выросшие из храмовых общин, чтобы сражаться с фанатизмом набожных людей, вооруженные древковым оружием нагината." #NT!
 levy_nd_jap_yari_ashigaru: "Яри ​​Асигару Леви" #NT!
 levy_nd_jap_yari_ashigaru_desc: "Крестьяне-копейщики, набранные из фермерских общин и солдат гарнизонов, вооруженные длинными копьями-яри и сражающиеся в массированных формированиях." #NT!
 nd_jap_za_guild_hall: "За зал гильдии" #NT!
 nd_jap_za_guild_hall_desc: "Штаб-квартира торговой гильдии, где управляются торговые монополии, хранятся товары и взимаются сборы с членов, действующих под защитой гильдии." #NT!
 nd_jap_zen_garden: "Дзен-сад" #NT!
 nd_jap_zen_garden_desc: "Созерцательный сад с гравием, тщательно уложенными камнями и местами для медитации, примыкающими к храмовому комплексу дзен. Место художественной утонченности и душевного спокойствия." #NT!
 nd_jap_yamashiro: "Ямасиро" #NT!
 nd_jap_yamashiro_desc: "Горная крепость, использующая пересеченную местность Японии, узкие подходы, крутые склоны и укрепленные дворы, которые делают нападение почти самоубийственным для атакующих сил." #NT!
 nd_jap_jokamachi: "Джокамати" #NT!
 nd_jap_jokamachi_desc: "Город-замок: административное и коммерческое сердце домена. Под стенами крепости лорда торговцы, ремесленники и слуги-самураи создают процветающий городской центр." #NT!
 nd_jap_tamahagane_forge: "Кузница Тамахагане" #NT!
 nd_jap_tamahagane_forge_desc: "Традиционная печь татара, в которой железный песок выплавляется в тамахаганэ: высокоуглеродистую сталь, из которой выковываются легендарные японские клинки и доспехи." #NT!
 nd_jap_dejima: "Торговый пост Дэдзима" #NT!
 nd_jap_dejima_desc: "Контролируемый иностранный торговый пост, где голландские и китайские торговцы могут вести бизнес под строгим контролем правительства. Крошечное окошко во внешний мир." #NT!
 nd_jap_terakoya: "Теракойя" #NT!
 nd_jap_terakoya_desc: "Храмовая школа, где буддийские монахи и ученые-пенсионеры обучают детей простолюдинов чтению, письму и арифметике. Основа удивительно высокого уровня грамотности в Японии." #NT!
 nd_jap_daiba_battery: "Батарея Дайба" #NT!
 nd_jap_daiba_battery_desc: "Береговая артиллерийская установка западного типа, построенная для защиты гаваней от иностранных военных кораблей. Сочетание импортных пушек с традиционным опытом фортификации." #NT!
 nd_jap_tachi_smithing: "Тачи Кузнечное дело" #NT!
 nd_jap_tachi_smithing_desc: "Производство мечей тати — длинных изогнутых клинков, выкованных мастерами-кузнецами с использованием традиционных технологий, передавалось из поколения в поколение." #NT!
 nd_jap_sake_brewing: "Производство сакэ" #NT!
 nd_jap_sake_brewing_desc: "Традиционное производство рисового вина, краеугольный камень японской культуры и экономики." #NT!
 nd_jap_lacquerware: "Лаковые изделия Уруси" #NT!
 nd_jap_lacquerware_desc: "Производство лакированных изделий: мисок, шкатулок и предметов интерьера, покрытых очищенным древесным соком, обеспечивающим блестящую и прочную поверхность, ценимую во всей Восточной Азии." #NT!
 nd_jap_textile_weaving: "Текстильное Ткачество" #NT!
 nd_jap_textile_weaving_desc: "Протоиндустриальные мастерские по ткачеству шелка и хлопка, символизирующие переход Японии от аграрной экономики к производству." #NT!
 nd_jap_za_guild_hall_maintenance: "Обслуживание гильдии" #NT!
 nd_jap_za_guild_hall_maintenance_desc: "Эксплуатационные расходы торговой гильдии за, шелк для торговых образцов, бумага для бухгалтерских книг и корреспонденции, а также керамика для демонстрации и обмена." #NT!
 nd_jap_zen_garden_maintenance: "Уход за садом" #NT!
 nd_jap_zen_garden_maintenance_desc: "Поддержание каменных композиций и гравийных узоров в созерцательном саду дзен со свечами и каллиграфическими материалами для медитации и церемоний." #NT!
 nd_jap_yamashiro_maintenance: "Содержание крепости" #NT!
 nd_jap_yamashiro_maintenance_desc: "Уход за деревянными частоколами, каменными стенами и гарнизонным вооружением горной крепости." #NT!
 nd_jap_jokamachi_maintenance: "Содержание Замкового города" #NT!
 nd_jap_jokamachi_maintenance_desc: "Поддержание каменных стен, административных помещений и документации замкового города." #NT!
 nd_jap_forge_maintenance: "Кузнечные операции" #NT!
 nd_jap_forge_maintenance_desc: "Плавка железного песка в традиционной печи татара для производства стали тамахагане." #NT!
 nd_jap_dejima_maintenance: "Содержание торгового поста" #NT!
 nd_jap_dejima_maintenance_desc: "Управление контролируемым обменом шелка, фарфора и иностранных товаров на торговом посту с торговыми книгами и документацией для таможенного контроля." #NT!
 nd_jap_terakoya_maintenance: "Содержание Храмовой школы" #NT!
 nd_jap_terakoya_maintenance_desc: "Обеспечение бумагой, свечами и учебными пособиями для приходской храмовой школы, где монахи обучают детей простолюдинов чтению и письму." #NT!
 nd_jap_daiba_maintenance: "Обслуживание аккумулятора" #NT!
 nd_jap_daiba_maintenance_desc: "Содержание береговой артиллерии, пороховых складов, каменных укреплений и ремонтных средств на батарее гавани." #NT!
 nd_jap_formed_tt: "Япония была образована" #NT!
 nd_jap_path_a_tt: "Выбрал Тенка Фубу" #NT!
 nd_jap_path_b_tt: "Выбрал Пакса Токугаву" #NT!
 nd_jap_path_c_tt: "Выбрал Страну восходящего солнца" #NT!
 nd_jap_destiny: "Судьба Японии" #NT!
 nd_jap_destiny_desc: "Япония объединилась впервые за многие поколения. Гарнизоны укрепляются, владения консолидируются. Теперь вопрос: чем станет эта новая Япония?" #NT!
 nd_jap_dest_northern_pacification: "Северное умиротворение" #NT!
 nd_jap_dest_northern_pacification_desc: "Защитите дикую северную границу Эзо и стратегический плацдарм Цусиму. Контроль над этими территориями устанавливает военные границы Японской империи. Требуется владение Исикари и Цусимой со значительной армией." #NT!
 nd_jap_dest_korean_expedition: "Корейская экспедиция" #NT!
 nd_jap_dest_korean_expedition_desc: "Начать полномасштабное вторжение на Корейский полуостров, захватив столицу Хансон и южный порт Кёнджу. Японские армии должны доказать, что они могут сражаться и побеждать на континентальной земле. Требуется завоевание Кореи и профессиональные армии." #NT!
 nd_jap_dest_greater_sphere: "Большая азиатская сфера" #NT!
 nd_jap_dest_greater_sphere_desc: "Военные амбиции Японии достигают своего апогея. От Филиппин до Тайваня острова Тихого океана и побережья Азии находятся под японской гегемонией. Это кульминация Тенка Фубу в континентальном масштабе. Требуется Тондо, Формоза, огромная армия и высокое развитие." #NT!
 nd_jap_dest_domain_economy: "Экономика домена" #NT!
 nd_jap_dest_domain_economy_desc: "Богатство объединенной Японии течет через рынки шелка и золотые запасы. Консолидируйте экономику доменов в последовательную торговую систему, которая обогатит центральную власть. Требуются значительные запасы золота, высокая стабильность и шелк на рынке." #NT!
 nd_jap_dest_floating_world: "Плавающий мир" #NT!
 nd_jap_dest_floating_world_desc: "В условиях длительного мира города Японии наполняются торговцами, ремесленниками и художниками. Укиё (плавающий мир кварталов развлечений, театров кабуки и гравюр на дереве) становится предметом зависти цивилизаций. Требует высокого развития, банковского дела и национального престижа." #NT!
 nd_jap_dest_eastern_workshop: "Восточная мастерская" #NT!
 nd_jap_dest_eastern_workshop_desc: "Япония превращается из аграрного общества в индустриальную державу. Заводы, верфи и конгломераты дзайбацу ускоряют модернизацию с головокружительной скоростью. Требует индустриализации, ресурсов Хоккайдо, высокого развития и угля на рынке." #NT!
 nd_jap.8.t: "Судьба Японии" #NT!
 nd_jap.8.d: "Последние конкурирующие знамена упали. Япония одна. Но единство – это не пункт назначения; это начало. Вопрос, который сейчас стоит перед правящим домом, так же стар, как сама цивилизация: что великая нация делает со своей властью?\n\nОтвет определит не только будущее Японии, но и сам ее характер. Будет ли меч, объединивший острова, обращен наружу, вырезая империю на побережьях Азии? Или его следует прятать, а его энергию направить на построение цивилизации, настолько утонченной и процветающей, что завоевания станут ненужными?" #NT!
 nd_jap.8.a: "Наша судьба ждет." #NT!
 nd_jap.9.t: "Северная граница под защитой" #NT!
 nd_jap.9.d: "Дикие земли Эдзо оказались под властью Японии. Народы айны, которые когда-то беспрепятственно бродили по этим северным территориям, теперь подчиняются японским администраторам. Цусима, узкая ступенька между Японией и континентом, развевается под знаменем единого государства.\n\nЭти завоевания представляют собой нечто большее, чем просто территориальные присоединения. Леса, рыбные запасы и потенциальные сельскохозяйственные угодья Эзо представляют собой обширную новую ресурсную базу. Положение Цусимы между Японией и Кореей делает ее бесценным стратегическим активом: передовой базой для любых будущих континентальных амбиций.\n\nВоенная машина, которая завоевала эти территории, теперь проверена, закалена и жаждет более серьезных испытаний. Континент манит." #NT!
 nd_jap.9.a: "Граница безопасна. Что лежит за пределами?" #NT!
 nd_jap.10.t: "Восходящее солнце над Кореей" #NT!
 nd_jap.10.d: "Японские армии пересекли пролив и водрузили свои знамена на континентальной земле. Хансон, столица Кореи, находится в руках Японии. Кёнджу, место древней славы Силлы, признает превосходство Японии. Вторжение, которое многие считали невозможным, удалось.\n\nНо удержание завоеванной территории отличается от ее захвата. Представляются два подхода. Первый предпочитает грубую военную мощь, поддерживая постоянный самурайский авангард на полуострове, готовый сокрушить любое сопротивление и продвинуться дальше в Маньчжурию. Второй использует более тонкий подход, создавая систему дани, которая сохраняет местное управление, одновременно получая дань и повиновение.\n\nОдин требует больше крови. Другой требует больше терпения." #NT!
 nd_jap.10.a: "Сделайте наших самураев постоянным авангардом." #NT!
 nd_jap.10.b: "Установить систему данников вассальных государств." #NT!
 nd_jap.11.t: "Большая азиатская сфера" #NT!
 nd_jap.11.d: "От Формозы до Филиппин, от Кореи до южных морей сфера влияния Японии охватывает обширную территорию Азии. То, что началось с объединения родных островов, переросло в то, что ни один японский правитель никогда не мог себе представить: морскую империю, способную конкурировать с империей европейских держав.\n\nДва видения этой империи конкурируют. Военно-морская фракция утверждает, что судьба Японии лежит на волнах: тихоокеанское владычество, соединенное морскими путями, защищенное флотом и обогащенное торговлей. Континентальная фракция возражает, что истинная сила заключается в территории: Япония должна обеспечить свое положение на материковой Азии посредством подавляющей военной мощи.\n\nОт выбора будет зависеть, станет ли Япония талассократией или сухопутной империей." #NT!
 nd_jap.11.a: "Наша судьба лежит на волнах Тихого океана." #NT!
 nd_jap.11.b: "Истинная сила измеряется количеством удерживаемой земли." #NT!
 nd_jap.12.t: "Экономика доменов процветает" #NT!
 nd_jap.12.d: "Экономическая реорганизация Японии приносит свои плоды. Лорды владений, когда-то мелкие военачальники, которые финансировали свои амбиции только за счет налогов на рис, теперь контролируют диверсифицированную местную экономику. Шелк течет из Нисидзина, золото наполняет казну менял Эдо, а великие дороги, соединяющие замковые города, кипят от торгового движения.\n\nЦентральная власть, получающая доходы от этой растущей коммерческой сети, оказывается богаче, чем любой сёгунат в истории. Торговые центры в Осаке, Сакаи и Хакате обрабатывают товары со всего королевства. Банковские дома предоставляют кредиты, которые смазывают колеса торговли.\n\nЭкономика Японии, когда-то раздробленная среди сотен враждующих владений, превратилась в последовательную национальную систему. Долгий мир приносит дивиденды." #NT!
 nd_jap.12.a: "Процветание – это самый верный показатель хорошего управления." #NT!
 nd_jap.13.t: "Плавающий мир" #NT!
 nd_jap.13.d: "Длительный мир привел к трансформации, которой не смог бы достичь ни один генерал. Города Японии (Эдо, Осака, Киото) являются одними из крупнейших и самых сложных в мире. В кварталах развлечений и театральных кварталах возникла яркая городская культура, которую воины Сэнгоку не узнали.\n\nДва аспекта этого культурного расцвета конкурируют за покровительство. Торговые дома Осаки и Сакаи сказочно разбогатели, их торговые сети простираются по всей Восточной Азии. Они финансируют театр кабуки, спонсируют художников и незаметно накапливают реальную власть, получаемую от контроля над денежными потоками.\n\nТем временем художники и поэты укиё, плавучего мира, создают произведения потрясающей красоты. Гравюры на дереве, поэзия хайку и представления кабуки определяют цивилизацию на ее культурном пике.\n\nКакой аспект должно поощрять государство?" #NT!
 nd_jap.13.a: "Расширьте возможности торговых домов Осаки." #NT!
 nd_jap.13.b: "Покровительствуйте искусству летающего мира." #NT!
 nd_jap.14.t: "Восточная мастерская" #NT!
 nd_jap.14.d: "Япония достигла того, что казалось невозможным: промышленной революции на своих условиях. Угольные шахты Хоккайдо питают доменные печи. Верфи запускают современные суда. Железные дороги соединяют города, которые когда-то были разделены неделями. Дзайбацу, крупные промышленно-финансовые конгломераты, стали двигателями национальной трансформации.\n\nПредставляются две модели промышленного развития. Подход, основанный на дзайбацу, концентрирует экономическую власть в руках нескольких крупных компаний (Mitsui, Mitsubishi, Sumitomo), которые объединяют банковское дело, торговлю и производство под единой корпоративной крышей. Они безжалостно эффективны, но создают опасную концентрацию частной власти.\n\nАльтернативой является политика кокусан: национальное производство, управляемое государством, создание стратегических отраслей промышленности под государственным контролем, чтобы гарантировать, что модернизация Японии служит национальным интересам, а не частной прибыли." #NT!
 nd_jap.14.a: "Пусть дзайбацу возглавит модернизацию Японии." #NT!
 nd_jap.14.b: "Национальное производство ради национальных интересов." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_samurai_vanguard: "Самурайский авангард" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_samurai_vanguard: "Постоянный гарнизон элитных самураев, дислоцированный на Корейском полуострове, готовый подавить сопротивление и продвинуться глубже на континент. Цена усталости от войны реальна, но не менее реален и военный потенциал." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_tributary_system: "Приточная система" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_tributary_system: "Сеть вассалов и данников, признающая японское превосходство, сохраняя при этом местное управление. Дань течет в Японию; следует послушание. Благодаря этому установленному порядку легче оправдать новые войны." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_pacific_dominion: "Тихоокеанский Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_pacific_dominion: "Япония господствует на Тихом океане благодаря превосходству на море. Имперский флот доминирует на морских путях от Тайваня до Филиппин, хотя поддержание таких огромных морских сил требует ресурсов от армии." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_continental_hegemon: "Континентальный гегемон" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_continental_hegemon: "Японские армии являются доминирующей сухопутной силой в Восточной Азии. Крепости и линии снабжения поддерживают операции в глубине континента, хотя флот страдает от отвлечения ресурсов в армию." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_merchant_houses: "Торговые дома Осаки" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_merchant_houses: "Крупные торговые дома контролируют потоки денег и товаров по всей Японии. Их богатство финансирует шпионские сети и коммерческие предприятия, хотя приток капитала приводит к инфляционному давлению." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_ukiyo_culture: "Культура Укиё" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_ukiyo_culture: "Плавающий мир искусства, театра и поэзии достигает своего апогея. Культурный престиж Японии сохраняется, а ее утонченная репутация улучшает дипломатические отношения. Однако искусство наемничества недостойно такой культурной нации." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_zaibatsu_power: "Дзайбацу Сила" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_zaibatsu_power: "Промышленно-финансовые конгломераты с безжалостной эффективностью стимулируют модернизацию Японии. Их глобальное влияние расширяет коммерческий диапазон Японии, а их богатство привлекает талантливых наемников, хотя быстрое расширение создает нагрузку на каналы поставок." #NT!
 STATIC_MODIFIER_NAME_nd_jap_dest_kokusan_policy: "Политика Кокусана" #NT!
 STATIC_MODIFIER_DESC_nd_jap_dest_kokusan_policy: "Национальное производство, управляемое государством, гарантирует, что промышленный потенциал Японии служит национальным интересам. Дипломатическое влияние растет, и нация ведет переговоры с позиции самодостаточной силы." #NT!
 nd_jap_gunbatsu_hq: "Штаб-квартира Гунбацу" #NT!
 nd_jap_gunbatsu_hq_desc: "Командный центр военного ведомства Японии, где планируются континентальные кампании, организуются армии и координируется логистика империи." #NT!
 nd_jap_zaibatsu: "Дзайбацу" #NT!
 nd_jap_zaibatsu_desc: "Промышленно-финансовый конгломерат, объединяющий банковское дело, торговлю и производство под единой корпоративной крышей. Двигатель модернизации Японии и основа ее экономической мощи." #NT!
 nd_jap_gunbatsu_maintenance: "Содержание военного командования" #NT!
 nd_jap_gunbatsu_maintenance_desc: "Ведение складов оружия, административного учета, средств связи и конюшен штаба военного командования." #NT!
 nd_jap_zaibatsu_maintenance: "Промышленные операции" #NT!
 nd_jap_zaibatsu_maintenance_desc: "Управление угольными печами, сталелитейными заводами, административными офисами и промышленным оборудованием конгломерата дзайбацу." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_jap_bureaucracy_authority: "Административный орган Бакухана" #NT!
 AUTO_MODIFIER_DESC_nd_jap_bureaucracy_authority: "Объединенная Япония унаследовала многоуровневый административный аппарат бакуфу, владений хань и императорского двора в Киото. В королевстве может действовать институциональная бюрократия с двумя дополнительными слотами за пределами столицы." #NT!
  
 jap_bakuhan_taisei_bureaucracy: "Бакухан-Тайсей" #NT!
 jap_bakuhan_taisei_bureaucracy_desc: "Конституционная основа государства Эдо, кодифицированная после Сэкигахара (1600 г.) и ратифицированная перемирием в Генне 1615 г. Система бакухан разделяла власть между центральным Эдо Бакуфу (который ведал иностранными делами, чеканкой монет, землями Пяти Кайдо и Тенрё) и примерно 270 даймё, которые управляли своим ханом с широкой финансовой и судебной автономией в обмен на клятвы верности и сбор с урожая риса кокудака. Это была федерация по стратификации, а не по договору." #NT!
  
 jap_sankin_kotai_bureaucracy: "Санкин-Котай" #NT!
 jap_sankin_kotai_bureaucracy_desc: "Система поочередного посещения, формализованная Токугавой Иэмицу в редакции Букэ Сёхатто 1635 года. Каждый даймё должен был иметь постоянное место жительства ясики в Эдо, оставляя там свою жену и наследника в качестве фактических заложников, и ежегодно менять свое место жительства между Эдо и своими владениями. Процессии вдоль Пяти Кайдо разорили великие дома, населили Эдо потребителями-самураями и привязали даймё к глазу сёгуна." #NT!
  
 jap_roju_wakadoshiyori_bureaucracy: "Родзю и Вакадосийори" #NT!
 jap_roju_wakadoshiyori_bureaucracy_desc: "Исполнительное сердце Эдо Бакуфу. Четыре-пять старших советников (Родзю), набранных из лоялистов даймё фудайо, управляли королевством с ежемесячной ротацией; Младшие советники (Вакадосиёри) занимались делами знаменосцев хатамото сёгуна. В кризисных ситуациях назначался сменяющийся Тайро (Великий старейшина). К концу семнадцатого века система советников заменила личное правление первых сёгунов коллегиальной бюрократией камергеров." #NT!
  
 jap_hyojosho_bureaucracy: "Хёдзёсё" #NT!
 jap_hyojosho_bureaucracy_desc: "Верховный суд Эдо Бакуфу, созывающий три магистратуры (Дзиша-бугё для храмов и святилищ, Мачи-бугё для города Эдо и Кандзё-бугё для казначейства) под председательством старшего Родзю. Хёдзёсё рассматривал дела, выходящие за рамки юрисдикции, апелляции хана и вопросы, связанные с капиталом, затрагивающие интересы бакуфу. Его кодификация 1742 года под руководством Кудзиката Осадамегаки впервые дала государству Токугава единую судебную процедуру." #NT!
  
 jap_buke_shohatto_bureaucracy: "Буке Шохатто" #NT!
 jap_buke_shohatto_bureaucracy_desc: "Кодекс из тринадцати статей, регулирующий деятельность даймё и их вассалов-самураев, обнародованный Токугавой Хидэтада в 1615 году и пересмотренный Иэмицу в 1635 году. Статьи ограничивали строительство замков, брачные союзы, фракционные контакты и размер вооруженных свит; Кодекс зачитывался вслух в начале правления каждого сёгуна. Буке Сёхатто определил класс воинов как законную собственность королевства и оставил законное насилие только за сёгуном." #NT!
  
 jap_sakoku_nagasaki_bugyo_bureaucracy: "Сакоку и Нагасаки Бугё" #NT!
 jap_sakoku_nagasaki_bugyo_bureaucracy_desc: "Режим закрытой страны, установленный указами Иэмицу от 1633 по 1639 год, который изолировал Японию от иностранных контактов, за исключением четырех узких каналов: голландской фабрики в Дэдзиме, китайских джонок в Нагасаки, корейских посольств через Цусиму и дани Рюкюань через Сацуму. Нагасаки Бугё, магистрат, назначаемый бакуфу, контролировал обмен Дэдзима, подвергал цензуре западные книги и получал ежегодные отчеты голландской разведки фусецугаки. Сакоку сохранил внутреннюю стабильность ценой отрезания Японии от европейской революции вооружений." #NT!
  
 jap_kuge_shohatto_bureaucracy: "Куге Шохатто" #NT!
 jap_kuge_shohatto_bureaucracy_desc: "Кодекс 1615 года, регулирующий императорский двор Киото, который сочетался с Буке Шохатто. Дворянство кугэ, сосредоточенное вокруг Тэнно, было ограничено ученостью и ритуалами, а все придворные дела направлялись через назначенного бакуфу связного, Киото Сёсидай. Эта договоренность сохраняла теологическую легитимность императора как источника мандата сёгуна, лишая при этом суд какой-либо практической власти. Двойная резиденция легитимности в Киото и власти в Эдо определяла государство Эдо до 1868 года." #NT!
  
 jap_dochu_bugyo_bureaucracy: "Дочу Бугё и пятеро Кайдо" #NT!
 jap_dochu_bugyo_bureaucracy_desc: "Офис магистрата шоссе, управляющий пятью Кайдо (Токайдо, Накасендо, Косю Кайдо, Ошу Кайдо и Никко Кайдо), которые расходились от моста Нихонбаси в Эдо. 248 почтовых станций вдоль этих дорог предоставляли лошадей, носильщиков и ночлег чиновникам, даймё гёрэцу и лицензированным путешественникам. Дорожная сеть поддерживала санкин-котай, перевозила курьеров бакуфу и налоговый рис, а также обеспечивала массовые гражданские путешествия, которые породили культуру плавучего мира Хокусая и Хиросигэ." #NT!
