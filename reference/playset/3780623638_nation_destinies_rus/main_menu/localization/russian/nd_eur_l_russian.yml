l_russian:
 STATIC_MODIFIER_NAME_nd_eur_universal_empire: "Универсальная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_eur_universal_empire: "От Карла Великого до Наполеона мечта о единой европейской империи, одном законе, одной армии и одной цели формировала континент. Согласно этому видению, Европа говорит единым голосом, ее разнообразные народы объединены в единую цивилизацию централизованной властью и непреодолимой волей." #NT!
 STATIC_MODIFIER_NAME_nd_eur_concert_of_sovereigns: "Концерт государей" #NT!
 STATIC_MODIFIER_DESC_nd_eur_concert_of_sovereigns: "Идеал Просвещения о добровольной федерации, суверенных нациях, связанных не завоеваниями, а общим законом, взаимной выгодой и рациональным сотрудничеством. Каждый участник сохраняет свою идентичность; вместе они составляют порядок, больший, чем любая империя. Это Европа, какой ее представлял Кант: вечный мир через добровольное объединение." #NT!
 nd_eur.1.t: "Объединение Европы" #NT!
 nd_eur.1.d: "То, чего не достиг ни император, ни папа, ни завоеватель, мы достигли. Европейский континент, от берегов Атлантического океана до границ Урала, от ледяного севера до средиземноморского солнца, стоит единым под одним знаменем. Это кульминация тысячелетней совместной цивилизации: соборы, пронизывающие каждый горизонт, университеты, освещающие каждый город, торговые пути, связывающие каждый рынок.\n\nНо способ этого союза еще предстоит решить. Будет ли Европа объединена в единую империю, а ее народы будут объединены под одним троном и одним законом, как мечтали Карл Великий и Наполеон? Или это станет концертом суверенных наций, добровольно связанных общими принципами и взаимным уважением, как это представляли себе философы Просвещения?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_eur.1.a: "Один трон, один закон, одна Европа" #NT!
 nd_eur.1.b: "Концерт свободных наций, связанных разумом" #NT!
 nd_eur.2.t: "Республика писем" #NT!
 nd_eur.2.d: "По всему нашему единому континенту произошла революция разума. Ученые, философы и естествоиспытатели свободно переписываются, несмотря на то, что когда-то было враждебными границами. Из салонов Парижа в кофейни Вены, из лабораторий Лондона в обсерватории Падуи знания текут беспрепятственно.\n\nЭта «Республика литературы», сообщество интеллекта, превосходящее язык и вероисповедание, представляет собой нечто беспрецедентное в истории человечества. Накопленная мудрость всех европейских народов, свободно распространяемая и развиваемая, привела к такому взрыву открытий, которого ни одна нация не смогла бы достичь в одиночку." #NT!
 nd_eur.2.a: "Пусть знания свободно перетекают через все границы" #NT!
 nd_eur.3.t: "Конгресс Наций" #NT!
 nd_eur.3.d: "Великие державы нашего европейского государства собрались в конгрессе, чтобы обсудить вопросы, представляющие общий интерес. Эпоха двусторонней дипломатии уступает место новой системе, коллективному обсуждению стран континента.\n\nПрецедент, созданный в Вестфалии, усовершенствованный в Утрехте и Вене, превратился в нечто более грандиозное: постоянную основу для разрешения споров, управления торговлей и координации политики на всем континенте. Но природа этого конгресса остается спорной." #NT!
 nd_eur.3.a: "Дипломатия и совместное управление должны преобладать" #NT!
 nd_eur.3.b: "Порядок должен наводить сильный" #NT!
 nd_eur.4.t: "Промышленная конвергенция" #NT!
 nd_eur.4.d: "Преобразования, начавшиеся в отдельных цехах и рудниках, стали континентальным явлением. Железные дороги теперь соединяют все крупные города. Заводы работают по общим стандартам. Сырье течет с периферии в промышленные центры, а промышленные товары возвращаются, создавая интегрированную экономическую систему беспрецедентного масштаба.\n\nЭта промышленная конвергенция предлагает два пути вперед: мы можем направить эту энергию на расширение наших производственных мощностей, создание инфраструктуры, которая еще теснее связывает континент, или мы можем сосредоточиться на расширении нашего коммерческого охвата, создании европейских торговых сетей, охватывающих весь земной шар." #NT!
 nd_eur.4.a: "Постройте промышленный фундамент континента" #NT!
 nd_eur.4.b: "Расширьте наши коммерческие сети по всему миру" #NT!
 STATIC_MODIFIER_NAME_nd_eur_republic_of_letters_flourishing: "Процветающая республика букв" #NT!
 STATIC_MODIFIER_DESC_nd_eur_republic_of_letters_flourishing: "Свободный обмен знаниями через европейские границы привел к беспрецедентному ускорению открытий и обучения." #NT!
 STATIC_MODIFIER_NAME_nd_eur_congress_diplomacy: "Дипломатия Конгресса" #NT!
 STATIC_MODIFIER_DESC_nd_eur_congress_diplomacy: "Система конгрессов создала основу для коллективного обсуждения и дипломатического принятия решений, которая объединяет страны Европы." #NT!
 STATIC_MODIFIER_NAME_nd_eur_imposed_order: "Навязанный континентальный порядок" #NT!
 STATIC_MODIFIER_DESC_nd_eur_imposed_order: "Сильные наводят порядок на континенте, обеспечивая стабильность посредством дисциплинированной власти, а не консенсуса путем переговоров." #NT!
 nd_eur_industrial_convergence_modifier: "Промышленная конвергенция" #NT!
 nd_eur_industrial_convergence_modifier_desc: "Промышленный потенциал континента растет по мере того, как общие стандарты и подключенная инфраструктура создают интегрированную экономическую систему." #NT!
 STATIC_MODIFIER_NAME_nd_eur_commercial_expansion: "Континентальное коммерческое расширение" #NT!
 STATIC_MODIFIER_DESC_nd_eur_commercial_expansion: "Европейские торговые сети простираются по всему миру, доставляя продукцию континентальной промышленности во все уголки мира." #NT!
 nd_eur_latin_christendom: "Латинский христианский мир" #NT!
 nd_eur_latin_christendom_desc: "Общее религиозное наследие средневековой Европы, выраженное в соборных школах, монашеском обучении и универсальном языке латыни, заложило основы общеевропейской идентичности." #NT!
 nd_eur_champagne_fairs: "Ярмарки шампанского" #NT!
 nd_eur_champagne_fairs_desc: "Крупные торговые ярмарки Шампани, Фландрии и Рейнской области создали первые общеевропейские торговые сети, связавшие итальянских купцов с фламандскими ткачами и ганзейскими торговцами." #NT!
 nd_eur_gothic_cathedrals: "Готические соборы" #NT!
 nd_eur_gothic_cathedrals_desc: "Великие готические соборы (Шартр, Кельн, Реймс, Бургос) представляют собой первое по-настоящему континентальное архитектурное движение в Европе. Построенные на протяжении поколений странствующими мастерами-строителями, они выражали общую веру в камень и свет." #NT!
 nd_eur_feudal_host: "Феодальное войско" #NT!
 nd_eur_feudal_host_desc: "Феодальная система военной повинности, при которой вассалы обязаны были служить своим лордам, создала бронетанковую кавалерию, которая доминировала на европейских полях сражений на протяжении веков." #NT!
 nd_eur_studia_generalia: "Студия Генералия" #NT!
 nd_eur_studia_generalia_desc: "Средневековые университеты Болоньи, Парижа и Оксфорда, studia Generalia, признанные папой и императором, создали общеевропейскую интеллектуальную элиту, которая преодолевала границы, преподавала на латыни и заложила основы современной науки." #NT!
 nd_eur_urban_communes: "Городские коммуны" #NT!
 nd_eur_urban_communes_desc: "Самоуправляющиеся городские коммуны, процветавшие от городов Ганзы до итальянских городов-государств, создали отчетливо европейскую традицию гражданской автономии, торгового регулирования и буржуазного процветания.\n\n#italic Доступно в: $nd_eur_trade_fair$#!" #NT!
 nd_eur_renaissance_humanism: "Ренессансный гуманизм" #NT!
 nd_eur_renaissance_humanism_desc: "Новое открытие классического образования, начавшееся в Италии и распространившееся по всему континенту, изменило европейское искусство, философию и управление. Ученые-гуманисты восстановили тексты Цицерона и Аристотеля, положив начало культурной революции." #NT!
 nd_eur_banking_revolution: "Банковская революция" #NT!
 nd_eur_banking_revolution_desc: "Великие банкирские дома (Флорентийские Медичи, Аугсбургские Фуггеры, Нюрнбергские Вельзеры) изобрели современные финансы. Векселя, двойная бухгалтерия и международные кредитные сети сделали возможной континентальную торговлю." #NT!
 nd_eur_pike_and_shot: "Щука и выстрел" #NT!
 nd_eur_pike_and_shot_desc: "Сочетание массированных формирований пик с пороховым оружием изменило европейскую войну. Эта тактическая революция, от швейцарских копейщиков до испанских терсиос, положила конец эпохе рыцарей в доспехах." #NT!
 nd_eur_age_of_exploration: "Эпоха исследований" #NT!
 nd_eur_age_of_exploration_desc: "Европейские моряки (португальцы, испанцы, англичане, голландцы) вышли за пределы известного мира, обогнули Африку, пересекли Атлантику и совершили кругосветное плавание. Их суда открыли морские пути, соединявшие континенты." #NT!
 nd_eur_printing_press_revolution: "Революция печатного станка" #NT!
 nd_eur_printing_press_revolution_desc: "Печатный станок Гутенберга с подвижным шрифтом, изобретенный в Майнце около 1440 года, за десятилетия распространился по Европе. К 1500 году было напечатано более двадцати миллионов томов, что демократизировало знания и способствовало Реформации, научной революции и Просвещению.\n\n#italic Доступно в: $nd_eur_universitas$#!" #NT!
 nd_eur_court_magnificence: "Придворное великолепие" #NT!
 nd_eur_court_magnificence_desc: "Культивирование придворного великолепия, от тщательно продуманных церемоний бургундского двора до покровительства Медичи художникам, установило отчетливо европейскую традицию государственного престижа, выраженную через архитектуру, искусство и ритуалы." #NT!
 nd_eur_trace_italienne: "След Италии" #NT!
 nd_eur_trace_italienne_desc: "Угловые, низкопрофильные звездообразные крепости, построенные итальянскими военными инженерами в ответ на пороховую артиллерию, изменили европейскую войну. Эти укрепления, позже усовершенствованные Вобаном, изменили границы и продлили осады по всему континенту." #NT!
 nd_eur_professional_diplomacy: "Профессиональная дипломатия" #NT!
 nd_eur_professional_diplomacy_desc: "Развитие постоянных посольств, профессиональных послов и дипломатического протокола, инициированное итальянскими городами-государствами и усовершенствованное Францией, создало европейскую систему международных отношений, которая существует и по сей день." #NT!
 nd_eur_joint_stock_companies: "Акционерные общества" #NT!
 nd_eur_joint_stock_companies_desc: "Акционерные компании, от Casa di San Giorgio до великих Ост-Индских компаний, позволили объединить капитал тысяч инвесторов. Это нововведение финансировало европейские исследования, колонизацию и глобальную торговлю." #NT!
 nd_eur_military_revolution: "Военная революция" #NT!
 nd_eur_military_revolution_desc: "Трансформация европейских армий от феодальных рекрутов к дисциплинированным формированиям из пик и мушкетов изменила облик войны. Испанское терсио, голландский контрмарш и полковая организация создали профессиональные армии, которые доминировали в мире." #NT!
 nd_eur_cuius_regio: "Куиус Реджио" #NT!
 nd_eur_cuius_regio_desc: "Принцип «чье царство – их религия», установленный в Аугсбургском мире 1555 года и подтвержденный в Вестфалии, стал с трудом завоеванным компромиссом Европы после нескольких поколений религиозных войн. Оно признало разнообразие как факт европейской жизни." #NT!
 nd_eur_scientific_method: "Научный метод" #NT!
 nd_eur_scientific_method_desc: "Системный подход к пониманию мира природы посредством наблюдения, гипотез и экспериментов возник в результате интеллектуального брожения европейских университетов и академий. Галилей, Кеплер и Харвей заложили основы современной науки.\n\n#italic Доступно в: $nd_eur_colonial_exchange$#!" #NT!
 nd_eur_broadside_warfare: "Залповая война" #NT!
 nd_eur_broadside_warfare_desc: "Развитие парусного военного корабля с бортовым вооружением, от карака до галеона, дало европейским военно-морским силам господство над мировым океаном. Тактика боя концентрировала разрушительную огневую мощь в скоординированных залпах." #NT!
 nd_eur_westphalian_order: "Вестфальский орден" #NT!
 nd_eur_westphalian_order_desc: "Вестфальский мир 1648 г. установил основополагающие принципы европейских международных отношений: государственный суверенитет, невмешательство во внутренние дела и разрешение споров посредством дипломатического конгресса." #NT!
 nd_eur_standing_armies: "Постоянные армии" #NT!
 nd_eur_standing_armies_desc: "Переход от феодальных наборов и наемных компаний к постоянным профессиональным регулярным армиям изменил европейское государство. Единая подготовка, регулярная оплата и профессиональные офицеры создали дисциплинированные силы, которые сформировали современный мир." #NT!
 nd_eur_republic_of_letters: "Республика букв" #NT!
 nd_eur_republic_of_letters_desc: "Общеевропейская сеть научной переписки, процветавшая с XVII века и объединявшая мыслителей от Лондона до Константинополя. Через письма, журналы и академические общества Республика литературы создала наднациональное сообщество знаний." #NT!
 nd_eur_mercantilist_manufactures: "Меркантилистские мануфактуры" #NT!
 nd_eur_mercantilist_manufactures_desc: "Направляемая государством индустриализация в рамках меркантилистской политики создала королевские мануфактуры, арсеналы и государственные предприятия, которые преобразовали европейскую экономику, от гобеленов Кольбера до фарфоровых фабрик Фридриха." #NT!
 nd_eur_vauban_fortifications: "Укрепления Вобан" #NT!
 nd_eur_vauban_fortifications_desc: "Совершенство звездной крепости маршала Вобана с ее геометрическими бастионами, крытыми проходами и переплетенными огневыми полями представляло собой вершину европейской военной инженерии. Его методы были скопированы по всему континенту.\n\n#italic Доступно в: $nd_eur_star_fortress$#!" #NT!
 nd_eur_baroque_splendor: "Великолепие Барокко" #NT!
 nd_eur_baroque_splendor_desc: "Движение барокко охватило всю Европу, от Рима Бернини до дворцов Вены и Версаля. Этот континентальный культурный феномен выразил мощь и уверенность европейского государства через монументальную архитектуру, музыку и искусство." #NT!
 nd_eur_global_maritime_reach: "Глобальный морской охват" #NT!
 nd_eur_global_maritime_reach_desc: "Европейские военно-морские силы, вооруженные линейными кораблями залпа, установили контроль над мировым океаном. От Карибского моря до Южно-Китайского моря европейские морские державы проецировали континентальное влияние по всему миру." #NT!
 nd_eur_enlightenment_philosophy: "Философия Просвещения" #NT!
 nd_eur_enlightenment_philosophy_desc: "Просвещение, от Локка и Вольтера до Канта и Монтескье, произвело революцию в европейской мысли. Идеи естественных прав, разделения властей и общественного договора изменили управление на всем континенте." #NT!
 nd_eur_congress_of_nations: "Конгресс Наций" #NT!
 nd_eur_congress_of_nations_desc: "Эволюция европейской дипломатии от заключения двусторонних договоров к системе конгрессов, где великие державы коллективно обсуждали вопросы, вызывающие обеспокоенность континента, от Вестфалии через Утрехт до Вены." #NT!
 nd_eur_grande_armee: "Гранде Арме" #NT!
 nd_eur_grande_armee_desc: "Наполеоновская модель большой армии, огромные гражданские армии, организованные в самодостаточные корпуса, объединяющие пехоту, кавалерию и артиллерию в единый разрушительный инструмент, изменили определение европейской войны." #NT!
 nd_eur_academy_of_sciences_tradition: "Академия наук" #NT!
 nd_eur_academy_of_sciences_tradition_desc: "Великие европейские академии, Лондонское королевское общество, Академия наук в Париже, академии Берлина, Санкт-Петербурга и Стокгольма институционализировали научные исследования и создали инфраструктуру для развития знаний." #NT!
 nd_eur_imperial_arsenal_tradition: "Императорский Арсенал" #NT!
 nd_eur_imperial_arsenal_tradition_desc: "Стандартизированное производство вооружений, впервые начатое арсеналами Венеции, оружейными заводами Льежа и пушечными заводами Швеции, дало европейским армиям технологическое преимущество, которое изменило баланс мировых сил." #NT!
 nd_eur_first_rate_supremacy: "Первоклассное превосходство" #NT!
 nd_eur_first_rate_supremacy_desc: "Первоклассный линейный корабль, несущий на трех орудийных палубах 100 или более орудий, был самой мощной мобильной орудийной платформой в истории человечества. Европейские верфи производили эти плавучие крепости в масштабах, не имеющих аналогов нигде в мире." #NT!
 nd_eur_perpetual_peace: "Вечный мир" #NT!
 nd_eur_perpetual_peace_desc: "Представление Канта о вечном мире через федерацию свободных республик, добровольных, космополитических, связанных универсальным законом, а не имперской силой, представляет собой высшее стремление Просвещения к европейской цивилизации." #NT!
 nd_eur_industrial_convergence: "Промышленная конвергенция" #NT!
 nd_eur_industrial_convergence_desc: "Распространение промышленных технологий по всему континенту, от британских инноваций до бельгийских, французских, немецких и других, создало интегрированную европейскую индустриальную экономику, связанную железными дорогами, телеграфом и общими стандартами." #NT!
 STATIC_MODIFIER_NAME_nd_eur_industrial_convergence: "Промышленная конвергенция" #NT!
 STATIC_MODIFIER_DESC_nd_eur_industrial_convergence: "Распространение промышленных технологий по всему континенту, от британских инноваций до бельгийских, французских, немецких и других, создало интегрированную европейскую индустриальную экономику, связанную железными дорогами, телеграфом и общими стандартами." #NT!
 nd_eur_citizen_army: "Гражданская армия" #NT!
 nd_eur_citizen_army_desc: "Дамба Французской революции в массовом порядке изменила ход войны: вся нация мобилизовалась для защиты, создав массовые армии граждан-солдат, одушевленных патриотическим рвением. Каждая европейская держава была вынуждена принять ту или иную форму этого революционного новшества." #NT!
 nd_eur_ius_gentium: "Юс Гентиум" #NT!
 nd_eur_ius_gentium_desc: "Закон наций Гуго Гроция, ius gentium, заложил основы современного международного права. Правила, регулирующие войну, дипломатию, торговлю и права народов, создали правовую основу европейского и глобального порядка." #NT!
 nd_eur_continental_telegraph: "Континентальный телеграф" #NT!
 nd_eur_continental_telegraph_desc: "Электрический телеграф соединил европейские столицы за считанные минуты, а не дни. Эта революция в области коммуникаций позволила быстро координировать политику, торговлю и военные операции на всем континенте.\n\n#italic Доступно в: $nd_eur_continental_railway$#!" #NT!
 nd_eur_universal_education: "Всеобщее образование" #NT!
 nd_eur_universal_education_desc: "Идеал Просвещения о всеобщем образовании, реализованный через системы государственных школ и публичных библиотек, создал самые грамотные общества в истории человечества и заложил основу индустриальной современности." #NT!
 nd_eur_ironclad_fleet: "Броненосный флот" #NT!
 nd_eur_ironclad_fleet_desc: "Переход от деревянных парусных судов к броненосным военным кораблям с паровым двигателем в одночасье сделал многовековые военно-морские традиции устаревшими. Европейские верфи возглавили эту трансформацию, производя бронетанковые флоты, которые доминировали на морях мира." #NT!
 nd_eur_grand_exhibition: "Большая выставка" #NT!
 nd_eur_grand_exhibition_desc: "Великие выставки, лондонский Хрустальный дворец в 1851 году, Париж в 1855 году и их преемники, продемонстрировали миру достижения европейской промышленности, науки и искусства. Они представляли собой вершину европейской уверенности в прогрессе и цивилизации." #NT!
 a_nd_eur_man_at_arms: "Европейский боец" #NT!
 a_nd_eur_man_at_arms_desc: "Тяжелобронированные конные воины из феодальной знати, представляющие лучшие средневековые европейские рыцарские традиции." #NT!
 a_nd_eur_pikeman: "Европейский пикинер" #NT!
 a_nd_eur_pikeman_desc: "Дисциплинированная пехота, вооруженная длинными пиками, обученная удерживать строй от атак кавалерии. Основа революции стрелкового оружия." #NT!
 n_nd_eur_exploration_carrack: "Исследование Каррака" #NT!
 n_nd_eur_exploration_carrack_desc: "Прочное океанское судно, предназначенное для дальних исследований. Более быстрые и маневренные, чем стандартные караки, эти корабли открыли морские пути в Новый Свет и Ост-Индию." #NT!
 a_nd_eur_tercio: "Европейский Терсио" #NT!
 a_nd_eur_tercio_desc: "Комбинированные формирования из пики и мушкетов, терцио были доминирующим пехотным формированием шестнадцатого века. Эти дисциплинированные поля сочетали в себе защитную стойкость и наступательную огневую мощь." #NT!
 n_nd_eur_galleon: "Европейский галеон" #NT!
 n_nd_eur_galleon_desc: "Передовой океанский военный корабль, сочетающий тяжелое вооружение с улучшенными мореходными качествами. Галеон доминировал как на торговых путях Атлантического океана, так и в военно-морских войнах в эпоху Великих географических открытий." #NT!
 a_nd_eur_line_infantry: "Европейская линейная пехота" #NT!
 a_nd_eur_line_infantry_desc: "Профессиональные солдаты обучались линейной тактике, ведя залповый огонь дисциплинированными рядами. Постоянные армии великих держав Европы были построены на основе этих надежных, хорошо обученных формирований." #NT!
 n_nd_eur_ship_of_the_line: "Линейный корабль" #NT!
 n_nd_eur_ship_of_the_line_desc: "Мощный боевой корабль бортового залпа, предназначенный для ведения боя на линии боя и наносящий разрушительные скоординированные залпы. Эти корабли составляли основу военно-морского флота каждой великой европейской державы." #NT!
 a_nd_eur_grenadier: "Европейский гренадер" #NT!
 a_nd_eur_grenadier_desc: "Элитная ударная пехота, отобранная по размеру и храбрости, изначально обученная бросать гранаты в укрепления. Гренадерские роты стали ведущими штурмовыми отрядами европейских армий." #NT!
 n_nd_eur_first_rate: "Первоклассный корабль" #NT!
 n_nd_eur_first_rate_desc: "Самый большой и хорошо вооруженный военный корабль на плаву: трехпалубный, на борту которого находится более сотни орудий. Эти плавучие крепости были непомерно дорогими, и только величайшие военно-морские державы могли позволить себе их строительство и содержание." #NT!
 a_nd_eur_fusilier: "Европейский стрелок" #NT!
 a_nd_eur_fusilier_desc: "Граждане-солдаты революционной Европы, вооруженные современными мушкетами и одушевленные патриотическим пылом. Призванные в огромном количестве, они сражались с решимостью свободных людей, защищающих свою родину." #NT!
 n_nd_eur_ironclad: "Европейский броненосец" #NT!
 n_nd_eur_ironclad_desc: "Военный корабль с паровым двигателем, одетый в железную броню, что делает деревянные парусные флоты устаревшими. Броненосец представлял собой передовой образец европейской промышленной и военно-морской техники." #NT!
 nd_eur_trade_fair: "Торговая ярмарка" #NT!
 nd_eur_trade_fair_desc: "Постоянный рыночный зал на пересечении основных торговых путей, где проходят сезонные ярмарки, на которых торговцы со всего континента обмениваются товарами, рассчитываются и заключают контракты." #NT!
 nd_eur_great_cathedral: "Большой собор" #NT!
 nd_eur_great_cathedral_desc: "Монументальный готический собор, чьи высокие своды, контрфорсы и витражи отражают общее религиозное и художественное наследие европейской цивилизации." #NT!
 nd_eur_universitas: "Университеты" #NT!
 nd_eur_universitas_desc: "Самоуправляющееся сообщество ученых и студентов, созданное по образцу великих средневековых университетов Болоньи, Парижа и Оксфорда, где обучение выходит за рамки национальных границ." #NT!
 nd_eur_banking_house: "Банковский Дом" #NT!
 nd_eur_banking_house_desc: "Финансовое учреждение, управляющее международными кредитными сетями, выпускающее векселя и финансирующее торговлю и государственные предприятия по всему континенту." #NT!
 nd_eur_grand_palace: "Большой дворец" #NT!
 nd_eur_grand_palace_desc: "Великолепная королевская резиденция в традициях барокко, служащая одновременно резиденцией правительства и демонстрацией государственной власти посредством архитектуры, садов и художественного покровительства." #NT!
 nd_eur_star_fortress: "Звездная крепость" #NT!
 nd_eur_star_fortress_desc: "Угловое укрепление, способное противостоять артиллерийским обстрелам, с невысокими бастионами, широкими рвами и переплетающимися полями огня. Итальянский след, усовершенствованный Вобаном." #NT!
 nd_eur_colonial_exchange: "Колониальный обмен" #NT!
 nd_eur_colonial_exchange_desc: "Прибрежный торговый дом, где товары заморских империй принимаются, сортируются и распределяются на континентальные рынки, специи с Востока, серебро с Америки, меха с Севера." #NT!
 nd_eur_state_manufactory: "Государственная мануфактура" #NT!
 nd_eur_state_manufactory_desc: "Государственное производство, где квалифицированные мастера производят стандартизированные товары в соответствии с меркантилистскими принципами, гобелены, фарфор, часы и изысканные изделия из металла." #NT!
 nd_eur_academy_of_sciences: "Академия наук" #NT!
 nd_eur_academy_of_sciences_desc: "Научное общество, занимающееся развитием естественной философии, математики и механических искусств, созданное по образцу Королевского общества и Академии наук." #NT!
 nd_eur_imperial_arsenal: "Императорский Арсенал" #NT!
 nd_eur_imperial_arsenal_desc: "Огромный оружейный завод, производящий стандартизированные пушки, мушкеты и боеприпасы для армий и флотов объединенной Европы." #NT!
 nd_eur_continental_railway: "Континентальная железная дорога" #NT!
 nd_eur_continental_railway_desc: "Железная дорога, соединяющая города Европы, обеспечивающая быстрое перемещение товаров, людей и армий по континенту." #NT!
 nd_eur_exhibition_hall: "Выставочный зал" #NT!
 nd_eur_exhibition_hall_desc: "Грандиозный павильон, демонстрирующий промышленные, научные и художественные достижения европейской цивилизации, привлекающий посетителей и престиж со всего мира." #NT!
 nd_eur_fair_goods_processing: "Ярмарка обработки товаров" #NT!
 nd_eur_fair_goods_processing_desc: "Ремесленники на выставке перерабатывают необработанный текстиль в готовую ткань, повышая ее ценность за счет технологий крашения и отделки." #NT!
 nd_eur_fair_maintenance: "Честное содержание" #NT!
 nd_eur_fair_maintenance_desc: "Обслуживание выставочных стендов, складов и объектов общего пользования." #NT!
 nd_eur_cathedral_maintenance: "Обслуживание собора" #NT!
 nd_eur_cathedral_maintenance_desc: "Бесконечная работа по содержанию великого собора, ремонту каменной кладки, замене стекла и сохранению структуры здания." #NT!
 nd_eur_printed_works: "Печатные работы" #NT!
 nd_eur_printed_works_desc: "Университетские ученые и печатники выпускают переплетенные тома классических текстов, научных трактатов и богословских работ для распространения по всей Европе." #NT!
 nd_eur_universitas_maintenance: "Содержание университета" #NT!
 nd_eur_universitas_maintenance_desc: "Снабжение университета бумагой, книгами и свечами для его залов и библиотек." #NT!
 nd_eur_banking_maintenance: "Банковские операции" #NT!
 nd_eur_banking_maintenance_desc: "Ведение бухгалтерских книг, корреспонденции и физической инфраструктуры международного банковского дома." #NT!
 nd_eur_palace_maintenance: "Содержание дворца" #NT!
 nd_eur_palace_maintenance_desc: "Поддержание величия дворца в стиле барокко требует постоянных инвестиций в материалы и квалифицированную рабочую силу." #NT!
 nd_eur_bastion_maintenance: "Обслуживание Бастиона" #NT!
 nd_eur_bastion_maintenance_desc: "Поддержание стен, бастионов, вооружения и снабжения гарнизона звездной крепости." #NT!
 nd_eur_scientific_instruments: "Научные инструменты" #NT!
 nd_eur_scientific_instruments_desc: "Квалифицированные мастера изготавливают точные инструменты (телескопы, микроскопы, навигационные инструменты) для европейских ученых и исследователей." #NT!
 nd_eur_exchange_maintenance: "Обменное обслуживание" #NT!
 nd_eur_exchange_maintenance_desc: "Управление складами, офисами и причалами колониальной биржи." #NT!
 nd_eur_manufactory_production: "Производство мануфактуры" #NT!
 nd_eur_manufactory_production_desc: "Государственное производство стандартизированных инструментов и орудий с использованием железа, угля и древесины." #NT!
 nd_eur_manufactory_maintenance: "Содержание мануфактуры" #NT!
 nd_eur_manufactory_maintenance_desc: "Содержание оборудования, запасов топлива и сырья государственного завода." #NT!
 nd_eur_academy_maintenance: "Содержание Академии" #NT!
 nd_eur_academy_maintenance_desc: "Снабжение академии наук книгами, бумагой и лабораторным оборудованием." #NT!
 nd_eur_arsenal_production: "Арсенал Продакшн" #NT!
 nd_eur_arsenal_production_desc: "Отливка бронзовых и железных пушек в императорском арсенале, поставка стандартизированного вооружения европейским войскам." #NT!
 nd_eur_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_eur_arsenal_maintenance_desc: "Поддержание кузниц, мастерских и складов имперского арсенала." #NT!
 nd_eur_telegraph_relay: "Телеграфное реле" #NT!
 nd_eur_telegraph_relay_desc: "Действующие телеграфные станции вдоль железнодорожной сети, обеспечивающие быструю связь по всему континенту." #NT!
 nd_eur_railway_maintenance: "Железнодорожное обслуживание" #NT!
 nd_eur_railway_maintenance_desc: "Содержание путей, мостов, станций и подвижного состава континентальной железной дороги." #NT!
 nd_eur_exhibition_maintenance: "Содержание выставки" #NT!
 nd_eur_exhibition_maintenance_desc: "Уход за павильонами, экспозициями и территорией большого выставочного зала." #NT!
 nd_eur_formed_tt: "Европа стала единой" #NT!
 nd_eur_path_a_tt: "Выберите судьбу #bold Вселенской Империи#!" #NT!
 nd_eur_path_b_tt: "Выбери судьбу #bold Концерта Соверенов#!" #NT!
 nd_eur_destiny: "Судьба Европы" #NT!
 nd_eur_destiny_desc: "Континент един. Теперь наступает настоящее испытание: какой цивилизацией станет эта Европа? Сохраняйте стабильность, выбирая путь, который определит новую эру человеческой истории." #NT!
 nd_eur_dest_imperium: "Империум Мунди" #NT!
 nd_eur_dest_imperium_desc: "Наследники Рима и Карла Великого смотрят на восток и юг. Константинополь и Иерусалим, древние центры империи и веры, должны попасть под европейскую эгиду. Только когда эти легендарные города склонятся под нашим знаменем, Вселенская Империя сможет претендовать на свое наследие." #NT!
 nd_eur_dest_global_reach: "Глобальный Империум" #NT!
 nd_eur_dest_global_reach_desc: "Владычество Европы должно простираться за пределы континента. Установите наше знамя в древних столицах ацтекского и китайского миров. От Теночтитлана до Гуанчжоу европейская мощь должна охватывать каждый океан и каждый континент." #NT!
 nd_eur_dest_pax_europaea: "Пакс Европы" #NT!
 nd_eur_dest_pax_europaea_desc: "Окончательное выражение Всемирной Империи: неоспоримый европейский мир, установленный по всему миру. От Ганга до Карибского моря, от Малаккского пролива до Великих равнин европейское оружие должно гарантировать порядок повсюду. Только высшая военная сила может поддерживать такой мир." #NT!
 nd_eur_dest_common_market: "Общий рынок" #NT!
 nd_eur_dest_common_market_desc: "Концерт государей начинается с торговли. Постройте континентальный рынок, где свободно текут предметы роскоши со всего мира: шелк с Востока, изысканные ткани из наших собственных мастерских. Европе, связанной торговлей, не нужны будут цепи." #NT!
 nd_eur_dest_enlightened_continent: "Континентальное Просвещение" #NT!
 nd_eur_dest_enlightened_continent_desc: "Свет разума должен осветить каждый уголок континента. Примите научную революцию, накопите богатство с помощью мирной промышленности и заработайте престиж самой развитой цивилизации в мире." #NT!
 nd_eur_dest_eternal_peace: "Вечный мир" #NT!
 nd_eur_dest_eternal_peace_desc: "Мечта Канта стала реальностью: федерация свободных народов, индустриализированных и просвещенных, связанных законом, а не силой. Примите как промышленную революцию, так и гражданскую армию не для завоеваний, а как двойную основу цивилизации, которая будет существовать вечно." #NT!
 nd_eur.5.t: "Судьба Европы" #NT!
 nd_eur.5.d: "Объединение Европы завершено, но настоящая работа только началась. Континент разнообразных народов, языков и традиций встал под одним знаменем впервые после падения Рима. От того, как мы будем управлять этим беспрецедентным достижением, будет зависеть, достигнет ли европейская цивилизация своего полного потенциала или снова распадется на враждующие королевства.\n\nОсновы заложены. Теперь мы должны опираться на них." #NT!
 nd_eur.5.a: "Судьбу Европы нам предстоит выковать" #NT!
 nd_eur.6.t: "Наследство Рима" #NT!
 nd_eur.6.d: "Наши армии вошли в Константинополь и Иерусалим, города, которые когда-то определяли границы цивилизованного мира. Собор Святой Софии и Храм Гроба Господня теперь находятся в наших границах. То, что начал Рим, то, что пытался Карл Великий, то, о чем мечтали крестоносцы, мы совершили.\n\nДревние имперские столицы — наши. Вселенская Империя унаследовала мантию всех империй, существовавших до нее." #NT!
 nd_eur.6.a: "Мы наследники всей цивилизации" #NT!
 nd_eur.7.t: "Континентальный рынок" #NT!
 nd_eur.7.d: "Первое великое достижение «Концерта государей» — это не военная победа, а экономическая. Шелк и изысканные ткани текут через наши рынки капитала, предметы роскоши со всего мира доступны нашим гражданам не через завоевания, а через торговлю. Торговцы из каждой европейской страны свободно торгуют в соответствии с общими законами и стандартами.\n\nЭто основа, на которой строится прочный мир: взаимное процветание." #NT!
 nd_eur.7.a: "Процветание свяжет то, что сила не может" #NT!
 nd_eur.8.t: "Глобальный Империум" #NT!
 nd_eur.8.d: "Европейские знамена реют над Теночтитланом и Гуанчжоу. Великие цивилизации Америки и Азии оказались в нашей сфере. Теперь вопрос в том, как управлять этими огромными новыми владениями.\n\nСможем ли мы распространить нашу военно-морскую мощь через океаны, построив морскую империю, которая будет контролировать мировые морские пути? Или мы сосредоточим нашу военную мощь в центре континента, создав непобедимую армию, которой не сможет бросить вызов ни одна держава на земле?" #NT!
 nd_eur.8.a: "Управляйте морями, и мир последует за ними" #NT!
 nd_eur.8.b: "Наши легионы будут непобедимы на суше" #NT!
 nd_eur.9.t: "Континентальное Просвещение" #NT!
 nd_eur.9.d: "Научная революция укоренилась по всей Европе. Наши академии, университеты и научные общества произвели взрыв знаний, не имеющий аналогов в истории человечества. Богатство, накопленное благодаря мирной торговле, способствует дальнейшим открытиям, а престиж нашей цивилизации привлекает ученых со всех уголков мира.\n\nКак нам направить эту интеллектуальную энергию?" #NT!
 nd_eur.9.a: "Откройте наши рынки и стройте свободно" #NT!
 nd_eur.9.b: "Подготовьте новое поколение дипломатов" #NT!
 nd_eur.10.t: "Пакс Европаеа" #NT!
 nd_eur.10.d: "От Дели до Темасека, от Гаваны до дальних уголков каждого континента европейская мощь не имеет себе равных. Величайшая военная сила, когда-либо созданная, готова обеспечить мир во всем мире. Это вершина Всемирной Империи, Pax Europaea.\n\nНо как сохранить этот мир? Через подавляющую наступательную мощь, подавляющую любое сопротивление? Или через терпеливую работу по интеграции, включающую покоренные народы в европейское сообщество?" #NT!
 nd_eur.10.a: "Наступательное превосходство обеспечивает прочный мир" #NT!
 nd_eur.10.b: "Интегрировать и цивилизовать мир" #NT!
 nd_eur.11.t: "Вечный мир" #NT!
 nd_eur.11.d: "Кант писал о вечном мире, достигнутом посредством федерации свободных республик. Мы превзошли даже его видение. Концерт Суверенов, индустриализированных, просвещенных, связанных общим законом и взаимным уважением, представляет собой самую развитую цивилизацию в истории человечества.\n\nДва последних видения соревнуются за душу этого достижения. Построим ли мы промышленный рай, управляемый просвещенными республиканскими принципами? Или нам следует создать всемирный конгресс, экспортируя нашу модель кооперативной цивилизации в каждую страну на земле?" #NT!
 nd_eur.11.a: "Постройте республику прогресса" #NT!
 nd_eur.11.b: "Созвать конгресс всех наций" #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_colonial_supremacy: "Колониальное превосходство" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_colonial_supremacy: "Европейские военно-морские силы контролируют все океаны. Наши блокады нерушимы, наши моряки неисчерпаемы, хотя содержание такого флота требует напряжения даже наших огромных ресурсов." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_continental_domination: "Континентальное господство" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_continental_domination: "Европейская армия – самая мощная сила на земле. Обширные рекруты и элитная кавалерия усиливают имперскую волю на всех границах, хотя стоимость таких армий подпитывает инфляцию." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_universal_monarchy: "Универсальная монархия" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_universal_monarchy: "Единственный трон управляет величайшей военной машиной в мире. Европейские командиры захватывают инициативу в каждом бою, их войска восстанавливаются после неудач с поразительной скоростью." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_roman_peace: "Римский мир" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_roman_peace: "Как и Рим до этого, Европейская империя поглощает завоеванные народы в свою цивилизацию. Интеграция и преобразование происходят с беспрецедентной скоростью в духе инноваций." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_free_exchange: "Бесплатный обмен" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_free_exchange: "«Концерт суверенов» снизил барьеры для торговли и строительства на всем континенте. Корабли строятся быстрее, здания стоят дешевле, и преобладает дух свободной торговли." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_diplomatic_academy: "Дипломатическая академия" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_diplomatic_academy: "Континентальная традиция профессиональной дипломатии укоренилась. Аннексия осуществляется посредством умелых переговоров и престижа короны, хотя дипломатический истеблишмент обходится недешево." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_industrial_harmony: "Индустриальная Гармония" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_industrial_harmony: "«Концерт суверенов» достиг того, о чем мечтали философы: гармоничной индустриальной республики, в которой прогресс и свобода развиваются вместе." #NT!
 STATIC_MODIFIER_NAME_nd_eur_dest_world_congress: "Всемирный Конгресс" #NT!
 STATIC_MODIFIER_DESC_nd_eur_dest_world_congress: "Модель европейского сотрудничества была экспортирована в мир. Культурное влияние распространяется наружу, а дух примирения и межконфессиональной гармонии управляет международными отношениями." #NT!
 nd_eur_imperial_command: "Имперское командование" #NT!
 nd_eur_imperial_command_desc: "Высший военный штаб Всемирной Империи, координирующий армии и гарнизоны по всему миру из единого укрепленного комплекса военных комнат, конюшен и сигнальных башен." #NT!
 nd_eur_congress_hall: "Конгресс-холл" #NT!
 nd_eur_congress_hall_desc: "Грандиозное гражданское здание, где представители Концерта суверенов обсуждают вопросы континентального управления, регулирования торговли и развития знаний." #NT!
 nd_eur_command_maintenance: "Командное обслуживание" #NT!
 nd_eur_command_maintenance_desc: "Содержание систем сигнализации, конюшен, картографических помещений и административных помещений высшего военного штаба." #NT!
 nd_eur_congress_maintenance: "Обслуживание Конгресса" #NT!
 nd_eur_congress_maintenance_desc: "Поддержание палат, архивов и дипломатических помещений континентального конгресс-холла." #NT!
  
  # ===== BUREAUCRACIES ===== 
 eur_imperial_diet_bureaucracy: "Императорский сейм" #NT!
 eur_imperial_diet_bureaucracy_desc: "Созданный по образцу Рейхстага Священной Римской империи (1495–1806 гг.), постоянно действующего собрания избирателей, князей и свободных имперских городов, которое принимало законы путем консенсуса сословий, а не имперских указов. Самый устойчивый федеральный прецедент на континенте: законотворчество посредством консультативного голоса великих домов." #NT!
 eur_aulic_council_bureaucracy: "Аулический совет" #NT!
 eur_aulic_council_bureaucracy_desc: "Созданный по образцу Рейхшофрата, созданного Максимилианом I в 1497 году и кодифицированного Фердинандом I в 1559 году, личный верховный суд императора выносил решения по феодальным спорам и непосредственным имперским подданным. Обошел собственный Reichskammergericht сословий и сконцентрировал судебную власть в исполнительной власти." #NT!
 eur_concert_of_powers_bureaucracy: "Концерт держав" #NT!
 eur_concert_of_powers_bureaucracy_desc: "Создано по образцу венской системы 1814–1815 годов, когда Каслри, Меттерних и царь Александр I создали управление из пяти держав для управления континентальными спорами посредством конгресса, а не войны. «Концерт» поддержал постнаполеоновский порядок с 1815 по 1914 год посредством аристократической дипломатии ценой подавления националистических и народных движений." #NT!
 eur_hanseatic_chamber_bureaucracy: "Ганзейская палата" #NT!
 eur_hanseatic_chamber_bureaucracy_desc: "По образцу Ганзетаг, проходившего в Любеке с 1356 года, где представители торговых городов обсуждали таможенные споры, иностранные привилегии и коллективное принуждение к нарушителям. Федеральный орган торговых городов, а не династий, управляемый единогласно через вендские, вестфальские и ливонские советы дриттелей." #NT!
 eur_ecumenical_council_bureaucracy: "Вселенский Совет" #NT!
 eur_ecumenical_council_bureaucracy_desc: "По образцу католической соборной традиции: Констанция (1414–1418) положила конец западному расколу, Трент (1545–1563) систематизировал Контрреформацию. Епископы со всего латинско-христианского мира собрались для принятия законов о доктринах и дисциплинах, обязательных для всего континента, что стало наиболее устойчивым реальным прецедентом общеевропейской совещательной власти." #NT!
 eur_continental_parliament_bureaucracy: "Континентальный парламент" #NT!
 eur_continental_parliament_bureaucracy_desc: "Создано по образцу «Опыта о настоящем и будущем мире в Европе» Уильяма Пенна 1693 года, в котором предлагался европейский парламент, сидящий за круглым столом, чтобы предотвратить споры о приоритете, с распределением делегатов в зависимости от годовой стоимости производства каждого штата. Уточнено в «Реорганизации» Сен-Симона 1814 года, которая настаивала на том, чтобы грамотный гражданский класс был естественным электоратом парламента." #NT!
 eur_monetary_union_bureaucracy: "Валютный союз" #NT!
 eur_monetary_union_bureaucracy_desc: "Создан по образцу Латинского валютного союза от 23 декабря 1865 года, который связал Францию, Бельгию, Италию и Швейцарию общим биметаллическим франком стоимостью 4,5 грамма чистого серебра. Монеты-члены свободно обращались через границы, но биметаллический стандарт оказался неустойчивым к шокам цен на серебро, что предвещало центральную напряженность в каждой последующей монетарной федерации." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_eur_bureaucracy_authority: "Федеральный бюрократический орган" #NT!
 AUTO_MODIFIER_DESC_nd_eur_bureaucracy_authority: "При формировании [EUR.GetName] получает полномочия размещать общеевропейские федеральные учреждения, основанные на исторических прецедентах имперских диет, вселенских соборов, Европейского концерта, Ганзейского союза и предложений эпохи Просвещения о создании континентального парламента." #NT!
