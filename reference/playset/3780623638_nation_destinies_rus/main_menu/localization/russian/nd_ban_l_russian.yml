l_russian:
 STATIC_MODIFIER_NAME_nd_pepper_emporium: "Перцовый магазин Востока" #NT!
 STATIC_MODIFIER_DESC_nd_pepper_emporium: "Склады Бантена переполнены лучшим перцем на архипелаге. Торговцы из Китая, Индии, Персии и Европы борются за доступ к нашим рынкам, а Зондский пролив направляет их богатства через наши порты." #NT!
 STATIC_MODIFIER_NAME_nd_sunda_strait_guardians: "Стражи Зондского пролива" #NT!
 STATIC_MODIFIER_DESC_nd_sunda_strait_guardians: "Зондский пролив — это ворота между двумя океанами, и ключ к ним принадлежит Бантену. Наши патрульные флоты контролируют эти воды, гарантируя, что ни одно судно не пройдет мимо без нашего ведома и согласия." #NT!
 STATIC_MODIFIER_NAME_nd_ban_golden_age_tirtayasa: "Золотой век Тиртайасы" #NT!
 STATIC_MODIFIER_DESC_nd_ban_golden_age_tirtayasa: "При султане Агенге Тиртайасе Бантен достигает зенита своего могущества. Пренебрежение султана иностранными монополиями и его видение независимого морского государства вдохновляют целое поколение воинов и государственных деятелей." #NT!
 STATIC_MODIFIER_NAME_nd_ban_pepper_diplomacy: "Перцовая дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_ban_pepper_diplomacy: "Бантен использует свой перец как дипломатическое оружие, развивая торговые отношения по всему известному миру. Там, где другие полагаются на армии, султан отправляет корабли с черным золотом." #NT!
 nd_ban.1.t: "Султанат Бантен" #NT!
 nd_ban.1.d: "Знамя ислама реет над портами западной Явы. Там, где индуистское королевство Сунда когда-то торговало перцем с португальцами, теперь султанат Бантен контролирует Зондский пролив: узкий проход между Явой и Суматрой, через который должна проходить вся торговля между Индийским океаном и Яванским морем.\n\nНаши склады ломятся от перца из Лампунга, наша гавань изобилует китайскими джонками и индийскими дау, а призыв к молитве эхом раздается с минаретов Масджид Агунг. Перед нами стоит вопрос, как распорядиться этим наследием. Станем ли мы величайшим торговым центром восточных морей, привлекающим к нашим берегам всех купцов? Или нам следует построить флот для патрулирования наших вод, гарантируя, что пролив останется нашей территорией и нашей судьбой?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ban.1.a: "Дайте волю перцу: сделайте Бантен мировым рынком." #NT!
 nd_ban.1.b: "Пролив принадлежит нам: никто не пройдет без нашего разрешения." #NT!
 nd_ban.2.t: "Неповиновение султана Агенга" #NT!
 nd_ban.2.d: "Султан Агенг Тиртайаса восходит на трон Бантена в тот момент, когда Голландская Ост-Индская компания усиливает контроль над архипелагом. В то время как другие правители уступают требованиям VOC об эксклюзивных торговых правах, Агенг отказывается. Он строит флот по европейскому образцу, открывает порты Бантена для английских, датских и китайских купцов и отправляет торговцев в Персию, Индию, Сиам и Японию.\n\nВ 1656 году хрупкий мир рушится. Бантенские войска совершают набеги на районы Батавии, устраивают засады на голландские патрули и убивают их командиров. ЛОС блокирует порт, но Агенг продолжает сражаться. Его правление знаменует собой золотой век Бантена: султаната, который осмелился бросить вызов европейской монополии и какое-то время одерживал победу.\n\nНо неповиновение Агенга имеет свою цену. Суд разделил мнение на тех, кто будет сопротивляться, и на тех, кто ищет компромисса с голландцами. Как мы будем чтить его наследие?" #NT!
 nd_ban.2.a: "Бросьте вызов монополистам: Бантен никогда не склонится." #NT!
 nd_ban.2.b: "Торговля со всеми странами. Пусть перец будет нашим щитом." #NT!
 nd_ban.3.t: "Масджид Агунг в Бантене" #NT!
 nd_ban.3.d: "Великая мечеть Бантен возвышается над портовым городом, ее пятиъярусная крыша представляет собой сплав яванских, китайских и исламских архитектурных традиций. Ступенчатая линия крыши мечети, построенной султаном Мауланой Хасануддином, перекликается как со священными горами индуистской Явы, так и с пагодами китайских торговых партнеров, а ее четыре колонны сака-гуру закрепляют молитвенный зал в геометрической точности исламского дизайна.\n\nМасджид Агунг становится больше, чем местом поклонения: это духовное сердце султаната, где улемы дают советы султану, где благословляются договоры и где собираются верующие. По пятницам молиться о процветании торговли перцем. Позже новообращенный голландец Хендрик Лукаас Кардил спроектирует пристройку тиямах, двухэтажное здание в голландском стиле, которое станет свидетельством космополитического характера Бантена." #NT!
 nd_ban.3.a: "Памятник и вере, и торговле." #NT!
 nd_ban.4.t: "Перечные сады Лампунга" #NT!
 nd_ban.4.d: "На другом берегу Зондского пролива, на южной оконечности Суматры, провинция Лампунг становится источником богатства Бантена. По султанскому указу каждый подданный старше шестнадцати лет должен сажать и поддерживать пятьсот стеблей перца. Покрытые виноградниками холмы Туланг Баванг, Сепутих и Секампунг становятся крупнейшим регионом по производству перца на архипелаге.\n\nКитайские посредники собирают урожай и отправляют его на склады Бантена, откуда он поступает на мировой рынок. Горошины черного перца из Лампунга, ценимые за остроту и качество, продаются по высоким ценам от Лиссабона до Кантона. Такое систематическое выращивание превращает Бантен из торгового порта в производственный центр." #NT!
 nd_ban.4.a: "Пятьсот стеблей на предмет: воля Султана будет сделана." #NT!
 nd_ban_sunda_pepper_heritage: "Сунда Перец Наследие" #NT!
 nd_ban_sunda_pepper_heritage_desc: "Древнее королевство Сунда выращивало перец на западе Явы на протяжении веков до прихода ислама. Бантен унаследовал эти устоявшиеся торговые сети и методы выращивания." #NT!
 nd_ban_islamic_conversion: "Исламизация Бантена" #NT!
 nd_ban_islamic_conversion_desc: "Под руководством Сунан Гунунг Джати и султаната Демак индуистский порт Сунда превращается в исламский султанат Бантен, принося новое религиозное единство и связи в более широкий мусульманский торговый мир." #NT!
 nd_ban_strait_raiders: "Проливные рейдеры" #NT!
 nd_ban_strait_raiders_desc: "Бантенские моряки на своих торговых судах «джонг» патрулируют Зондский пролив, контролируя проход между Индийским океаном и Яванским морем." #NT!
 nd_ban_port_foundations: "Фонды портового города" #NT!
 nd_ban_port_foundations_desc: "Создание Бантена как крупного порта с постоянной складской инфраструктурой для хранения и торговли перцем." #NT!
 nd_ban_debus_tradition: "Боевые традиции Дебуса" #NT!
 nd_ban_debus_tradition_desc: "Практикующие Дебус в Бантене сочетают суфийский мистицизм с боевыми искусствами, совершая подвиги, демонстрирующие их духовную неуязвимость. Эти воины служат ударными отрядами, чей пыл в бою нервирует врагов." #NT!
 nd_ban_coastal_subsistence: "Прибрежная жизнь" #NT!
 nd_ban_coastal_subsistence_desc: "Прибрежные деревни западной Явы поддерживают себя за счет выращивания риса и рыболовства, обеспечивая продовольственную базу, поддерживающую городское население Бантена." #NT!
 nd_ban_surosowan_tradition: "Традиции дворца Суросован" #NT!
 nd_ban_surosowan_tradition_desc: "Строительство дворцового комплекса Суросован, занимающего более тридцати тысяч квадратных метров с бассейнами для купания, фонтанами-павильонами и впечатляющей системой акведуков, подчеркивает архитектурное величие бантенского двора." #NT!
 nd_ban_sultanate_founding: "Основание Султаната" #NT!
 nd_ban_sultanate_founding_desc: "Маулана Хасануддин основывает Бантенский султанат в 1527 году, сочетая военные завоевания с распространением ислама, чтобы создать новое исламское государство на руинах индуистского королевства Сунда." #NT!
 nd_ban_chinese_quarter: "Квартал Печинан" #NT!
 nd_ban_chinese_quarter_desc: "Китайские торговцы основывают постоянный квартал в Бантене, выполняя роль важных посредников, которые собирают перец у производителей Лампунга и продают его на зарубежных рынках." #NT!
 nd_ban_masjid_agung: "Масджид Агунг" #NT!
 nd_ban_masjid_agung_desc: "Большая мечеть Бантена с ее характерной пятиярусной крышей, сочетающей яванские, китайские и исламские архитектурные традиции, становится духовным центром султаната." #NT!
 nd_ban_pepper_entrepot: "Перец Антрепо" #NT!
 nd_ban_pepper_entrepot_desc: "На рынках Бантена разрабатываются сложные системы обработки, сортировки и классификации перца на экспорт, что повышает ценность сырья из садов Лампунга.\n\n#italic Доступно в: $nd_ban_pepper_gudang$#!" #NT!
 nd_ban_european_contacts: "Европейские контакты" #NT!
 nd_ban_european_contacts_desc: "Прибытие португальских, голландских, английских и датских торговцев открывает новые рынки для перца Бантена и знакомит султанат с европейской дипломатией и технологиями." #NT!
 nd_ban_patrol_fleet: "Патрульный флот пролива" #NT!
 nd_ban_patrol_fleet_desc: "Специально построенные легкие корабли патрулируют Зондский пролив, обеспечивая контроль Бантена над этим жизненно важным узким проходом и перехватывая контрабандистов и конкурентов." #NT!
 nd_ban_lampung_plantations: "Плантации Лампунг" #NT!
 nd_ban_lampung_plantations_desc: "Систематическая организация выращивания перца в Лампунге, требующая от каждого субъекта посадить пятьсот стеблей перца, превращает провинцию в крупнейшего производителя перца на архипелаге.\n\n#italic Доступно в: $nd_ban_pepper_gudang$#!" #NT!
 nd_ban_strait_tolls: "Сборы по Зондскому проливу" #NT!
 nd_ban_strait_tolls_desc: "Бантен вводит официальный сбор пошлин с судов, проходящих через Зондский пролив, превращая свое географическое преимущество в стабильный поток доходов." #NT!
 nd_ban_cosmopolitan_port: "Космополитический порт" #NT!
 nd_ban_cosmopolitan_port_desc: "Гавань Бантена принимает торговцев со всей Азии и Европы: мусульмане, индуисты, буддисты и христиане бок о бок торгуют на рынках султаната, защищенные терпимостью султана." #NT!
 nd_ban_naval_expansion: "Военно-морская экспансия" #NT!
 nd_ban_naval_expansion_desc: "Строительство военных пра, более тяжелых боевых галер, предназначенных для морской войны, а не для торговли, знаменует собой переход Бантена из торгового порта в морскую державу." #NT!
 nd_ban_manuscript_tradition: "Рукописная традиция" #NT!
 nd_ban_manuscript_tradition_desc: "Бантенские ученые создают рукописи по исламскому праву, суданской литературе и морскому судоходству, создавая литературную традицию, которая сохраняет знания султаната для будущих поколений." #NT!
 nd_ban_pepper_diplomacy_advance: "Перцовая дипломатия" #NT!
 nd_ban_pepper_diplomacy_advance_desc: "Бантен использует свое положение ведущего мирового поставщика перца для налаживания дипломатических отношений по всему миру, предлагая выгодные торговые условия в обмен на политическую поддержку." #NT!
 nd_ban_port_fortification: "Портовое укрепление" #NT!
 nd_ban_port_fortification_desc: "Каменные бастионы и береговые батареи защищают гавань Бантена от морских атак, защищая коммерческие пути султаната." #NT!
 nd_ban_ageng_tirtayasa: "Султан Агенг Тиртайаса" #NT!
 nd_ban_ageng_tirtayasa_desc: "Султан Агенг Тиртайаса ведет Бантен через его золотой век, строя флот европейского типа, расширяя торговлю с Персией и Японией и бросая вызов стремлению Голландской Ост-Индской компании к монополии." #NT!
 nd_ban_fleet_modernization: "Модернизация флота" #NT!
 nd_ban_fleet_modernization_desc: "При султане Агенге Бантен строит галеры по европейским образцам, используя более тяжелое вооружение и более надежные методы строительства, полученные от английских и датских союзников." #NT!
 nd_ban_anti_monopoly: "Антимонопольное сопротивление" #NT!
 nd_ban_anti_monopoly_desc: "Политика Бантена по торговле со всеми странами (английской, датской, китайской, персидской) напрямую бросает вызов амбициям VOC монополизировать торговлю специями на архипелаге." #NT!
 nd_ban_kaibon_court: "Кайбонская придворная культура" #NT!
 nd_ban_kaibon_court_desc: "Дворец Кайбон, резиденция королевы-матери, становится центром изысканной придворной культуры, где суданские художественные традиции сочетаются с исламскими и космополитическими влияниями." #NT!
 nd_ban_debus_elite: "Элитный страж Дебуса" #NT!
 nd_ban_debus_elite_desc: "Личная гвардия султана, состоящая из мастеров Дебус, чьи проявления духовной неуязвимости и боевых навыков заставляют их бояться на поле боя и уважать при дворе." #NT!
 nd_ban_international_network: "Международная торговая сеть" #NT!
 nd_ban_international_network_desc: "Купцы Бантена торгуют с Персией, Индией, Сиамом, Вьетнамом, Китаем, Филиппинами и Японией, создавая торговую сеть, охватывающую весь Индийский океан и Тихоокеанский регион." #NT!
 nd_ban_pepper_refinement: "Очистка перца" #NT!
 nd_ban_pepper_refinement_desc: "Передовые методы сортировки, сортировки и упаковки перца гарантируют, что экспорт Бантена продается по самым высоким ценам на мировых рынках.\n\n#italic Доступно в: $nd_ban_pepper_gudang$#!" #NT!
 nd_ban_centralized_sultanate: "Централизованный султанат" #NT!
 nd_ban_centralized_sultanate_desc: "Консолидация султанской власти над провинциями, судами и рынками Бантена, создание эффективного административного аппарата для управления торговлей перцем и военно-морскими силами." #NT!
 nd_ban_coastal_defense: "Сеть береговой обороны" #NT!
 nd_ban_coastal_defense_desc: "Комплексная система батарей, сторожевых вышек и военно-морских патрулей защищает береговую линию Бантена и Зондский пролив от иностранной агрессии." #NT!
 nd_ban_maritime_projection: "Морская проекция" #NT!
 nd_ban_maritime_projection_desc: "Флот Бантена выходит за пределы Зондского пролива, проецируя морскую мощь через Яванское море и в Индийский океан." #NT!
 nd_ban_pepper_monopoly: "Перцовая монополия" #NT!
 nd_ban_pepper_monopoly_desc: "Посредством контроля над производством в Лампунге и распределения через склады Бантена султанат консолидирует почти монополию на лучший перец в Юго-Восточной Азии." #NT!
 nd_ban_islamic_scholarship: "Исламская стипендия" #NT!
 nd_ban_islamic_scholarship_desc: "Школы песантрен и библиотеки мечетей Бантена становятся центрами исламского образования, привлекающими ученых со всего малайского мира и выпускающими комментарии по праву, теологии и мистицизму." #NT!
 nd_ban_modern_patrol_fleet: "Современный патрульный флот" #NT!
 nd_ban_modern_patrol_fleet_desc: "Быстроходные фрегаты заменяют стареющий флот прау, давая флоту Бантена скорость и огневую мощь для патрулирования Зондского пролива против современных угроз." #NT!
 nd_ban_governance_reform: "Реформа управления" #NT!
 nd_ban_governance_reform_desc: "Административные реформы модернизируют бюрократию султаната, вводя систематический учет, кодифицированное налогообложение и профессиональных государственных служащих." #NT!
 nd_ban_industrial_pepper: "Промышленная переработка перца" #NT!
 nd_ban_industrial_pepper_desc: "Механизированные перерабатывающие предприятия преобразовывают промышленность перца Бантена, повышая качество и стабильность продукции, одновременно снижая потребность в рабочей силе.\n\n#italic Доступно в: $nd_ban_modern_harbor$#!" #NT!
 nd_ban_modern_port: "Современная портовая инфраструктура" #NT!
 nd_ban_modern_port_desc: "Современные доки, краны и склады заменяют традиционную набережную, позволяя Бантену обслуживать более крупные корабли и большие объемы продукции индустриальной эпохи." #NT!
 nd_ban_national_awakening: "Национальное пробуждение" #NT!
 nd_ban_national_awakening_desc: "Возрождение суданской культурной самобытности находит выражение в литературе, искусстве и политической мысли, поскольку народ Бантена определяет свое место в меняющемся мире." #NT!
 nd_ban_modern_navy: "Современный флот" #NT!
 nd_ban_modern_navy_desc: "Паровые корветы и современная военно-морская доктрина дают Бантену возможность защитить свои воды от великих держав индустриальной эпохи." #NT!
 nd_ban_sundanese_heritage: "Суданское наследие" #NT!
 nd_ban_sundanese_heritage_desc: "Сохранение и прославление суданского языка, обычаев и самобытности, обеспечение того, чтобы культурные традиции западной Явы выдержали потрясения современной эпохи." #NT!
 n_nd_ban_jong: "Чон" #NT!
 n_nd_ban_jong_desc: "Чонг — традиционное суданское торговое судно, приспособленное для ведения войны. Быстрые и маневренные в узких водах Зондского пролива, эти корабли составляют основу первых военно-морских сил Бантена." #NT!
 a_nd_ban_debus_warriors: "Дебус Воины" #NT!
 a_nd_ban_debus_warriors_desc: "Практикующие мистическое боевое искусство Дебус, эти воины демонстрируют свою духовную силу, демонстрируя кажущуюся неуязвимость, прежде чем вступить в бой с устрашающим моральным духом." #NT!
 a_nd_ban_debus_elite: "Султанская гвардия Дебуса" #NT!
 a_nd_ban_debus_elite_desc: "Элитная личная охрана султана, эти мастера-практики Дебус сочетают духовную дисциплину с профессиональной военной подготовкой, служа ударной пехотой." #NT!
 n_nd_ban_strait_patrol: "Патрульный корабль пролива" #NT!
 n_nd_ban_strait_patrol_desc: "Специально построенные легкие суда, предназначенные для скорости и перехвата в Зондском проливе. Небольшая осадка и тонкие паруса позволяют им преследовать контрабандистов и пиратов в узких водах архипелага." #NT!
 n_nd_ban_war_prau: "Война Прау" #NT!
 n_nd_ban_war_prau_desc: "Более тяжелая галера, построенная для морских боев, боевая прау имеет больше орудий и более крупный экипаж, чем торговые суда, и предназначена для обеспечения контроля Бантена над Зондским проливом силой оружия." #NT!
 n_nd_ban_modern_galley: "Бантенезе Галера" #NT!
 n_nd_ban_modern_galley_desc: "Построенные по европейским моделям с помощью английских и датских корабелов, эти модернизированные галеры сочетают в себе местное мореплавание с западной военно-морской архитектурой, давая флоту султана Агенга огневую мощь, чтобы бросить вызов ЛОС." #NT!
 n_nd_ban_frigate_patrol: "Пролив Фрегат" #NT!
 n_nd_ban_frigate_patrol_desc: "Быстроходный патрульный фрегат, оптимизированный для операций по перехвату и блокаде Зондского пролива. Эти суда быстрее стандартных военных кораблей и могут догонять торговые суда и опережать более тяжелые линейные корабли." #NT!
 n_nd_ban_modern_corvette: "Бантенезе Корвет" #NT!
 n_nd_ban_modern_corvette_desc: "Шустрый современный военный корабль, построенный для береговой обороны и патрулирования проливов. Корвет жертвует тяжелым вооружением ради скорости и маневренности, что идеально подходит для закрытых вод между Явой и Суматрой." #NT!
 nd_ban_pepper_gudang: "Перец Гуданг" #NT!
 nd_ban_pepper_gudang_desc: "Складской комплекс для хранения, сортировки и реализации перца. Гуданг — коммерческое сердце порта Бантен, где горошины черного перца из Лампунга готовят для экспорта по всему миру." #NT!
 nd_ban_surosowan_palace: "Дворец Суросован" #NT!
 nd_ban_surosowan_palace_desc: "Великолепный дворцовый комплекс султанов Бантена с бассейнами для купания, фонтанами-павильонами, системой акведуков и залами для аудиенций, где султан принимает иностранных послов." #NT!
 nd_ban_pecinan_quarter: "Квартал Печинан" #NT!
 nd_ban_pecinan_quarter_desc: "Китайский торговый квартал Бантен, где торговцы из Фуцзянь и Гуандун имеют постоянные места жительства и склады, выступая важными посредниками в торговле перцем." #NT!
 nd_ban_grand_mosque: "Масджид Агунг" #NT!
 nd_ban_grand_mosque_desc: "Большая мечеть Бантен, ее характерная пятиярусная крыша, символизирующая пять столпов ислама, является духовным центром султаната и шедевром яванско-исламской архитектуры." #NT!
 nd_ban_strait_tollhouse: "Пролив Толлхаус" #NT!
 nd_ban_strait_tollhouse_desc: "Административный форпост, где чиновники Бантена взимают пошлины с судов, проходящих транзитом Зондский пролив, превращая географическое преимущество в доход." #NT!
 nd_ban_coastal_bastion: "Прибрежный бастион" #NT!
 nd_ban_coastal_bastion_desc: "Каменные укрепления, защищающие гавань Бантена, предназначенные для отражения морских атак и защиты торговых путей султаната." #NT!
 nd_ban_coastal_battery: "Береговая батарея" #NT!
 nd_ban_coastal_battery_desc: "Современная артиллерийская установка, защищающая береговую линию с помощью тяжелых орудий, способная поражать боевые корабли противника на расстоянии и сдерживать высадку десанта." #NT!
 nd_ban_modern_harbor: "Современная гавань" #NT!
 nd_ban_modern_harbor_desc: "Модернизированный портовый комплекс с глубоководными причалами, механическими кранами и обширными складскими мощностями, способный обрабатывать объемы торговли индустриальной эпохи." #NT!
 nd_ban_gudang_upkeep: "Гудан Техническое обслуживание" #NT!
 nd_ban_gudang_upkeep_desc: "Стоимость содержания складов перца Бантена: древесина для ремонта, бумага для торговых записей и керамика для мер и весов." #NT!
 nd_ban_palace_upkeep: "Обслуживание дворца" #NT!
 nd_ban_palace_upkeep_desc: "Содержание дворцового комплекса Суросован: камень и древесина для акведука, бассейнов и залов, прекрасная ткань для придворных зрителей и обстановка." #NT!
 nd_ban_pecinan_upkeep: "Квартальное обслуживание" #NT!
 nd_ban_pecinan_upkeep_desc: "Стоимость содержания инфраструктуры и торговых объектов китайского торгового квартала." #NT!
 nd_ban_mosque_upkeep: "Обслуживание мечети" #NT!
 nd_ban_mosque_upkeep_desc: "Эксплуатационные расходы Большой мечети: благовония для богослужений, ткань для молитвенных ковриков и бумага для рукописей Корана и научных текстов." #NT!
 nd_ban_toll_collection: "Сбор платы за проезд" #NT!
 nd_ban_toll_collection_desc: "Административные расходы на эксплуатацию системы взимания пошлин в Зондском проливе: древесина для сборной, бумага для судовых регистров и керамические жетоны, используемые в качестве квитанций об оплате пошлины." #NT!
 nd_ban_bastion_upkeep: "Обслуживание Бастиона" #NT!
 nd_ban_bastion_upkeep_desc: "Расходы на содержание каменных береговых укреплений и их гарнизона." #NT!
 nd_ban_battery_upkeep: "Обслуживание аккумулятора" #NT!
 nd_ban_battery_upkeep_desc: "Расходы на содержание огневых точек береговой артиллерии и боекомплекта к ним." #NT!
 nd_ban_harbor_upkeep: "Обслуживание порта" #NT!
 nd_ban_harbor_upkeep_desc: "Стоимость содержания современной портовой инфраструктуры: доков, кранов и складов." #NT!
 nd_ban_pepper_processing: "Переработка перца" #NT!
 nd_ban_pepper_processing_desc: "Сортировка, сушка и первичная сортировка сырого перца: красители для маркировки качества, волокнистые мешки для расфасовки и инструменты для перерабатывающего оборудования." #NT!
 nd_ban_lampung_cultivation: "Выращивание лампунга" #NT!
 nd_ban_lampung_cultivation_desc: "Организованная система выращивания перца в Лампунге, где деревянные каркасы поддерживают вьющиеся лозы перца, а железные инструменты перекапывают почву." #NT!
 nd_ban_pepper_grading: "Классификация перца" #NT!
 nd_ban_pepper_grading_desc: "Расширенный контроль качества сортирует перец по экспортным сортам, при этом лучшие горошины черного перца продаются по повышенным ценам." #NT!
 nd_ban_industrial_processing: "Промышленная переработка" #NT!
 nd_ban_industrial_processing_desc: "Механизированные комплексы по переработке перца в промышленных масштабах с использованием современного оборудования для очистки, сортировки и упаковки." #NT!
 levy_nd_ban_debus_elite: "Султанская гвардия Дебуса" #NT!
 levy_nd_ban_debus: "Дебус Воины" #NT!
 levy_nd_ban_jong: "Чон Флит" #NT!
 levy_nd_ban_debus_elite_desc: "Личная охрана султана практиков Дебуса: неуязвимые духовные воины, служащие элитной охраной двора Бантен." #NT!
 levy_nd_ban_debus_desc: "Добровольцы-мастера боевых искусств Дебус из деревни Бантен: духовные воины, владеющие ножами и железными цепями." #NT!
 levy_nd_ban_jong_desc: "Флот традиционных торговых судов «джонг» поступил на военно-морскую службу: их экипажи состоят из моряков из прибрежных общин Бантена." #NT!
 nd_ban_formed_tt: "Бантен был основан" #NT!
 nd_ban_path_a_tt: "Выбрал Pepper Emporium of the East" #NT!
 nd_ban_path_b_tt: "Выбрали стражей Зондского пролива" #NT!
 nd_ban_destiny: "Судьба Бантена" #NT!
 nd_ban_destiny_desc: "Султанат Бантен восстал из пепла индуистского королевства Сунда. Теперь султан должен выбрать путь, который определит будущее нации: богатство перца или мощь флота." #NT!
 nd_ban_dest_pepper_empire: "Перцовая Империя" #NT!
 nd_ban_dest_pepper_empire_desc: "Захватите контроль над Палембангом, конкурирующим центром производства перца на юге Суматры. Только доминируя по обе стороны Зондского пролива, торговцы перцем Бантена смогут господствовать на мировом рынке." #NT!
 nd_ban_dest_spice_crossroads: "Перекресток торговли специями" #NT!
 nd_ban_dest_spice_crossroads_desc: "Расширить коммерческую деятельность Бантена на Малакку и Темасек. Контроль над Малаккским проливом наряду с Зондским проливом сделал бы Бантена бесспорным хозяином морской торговли в Юго-Восточной Азии." #NT!
 nd_ban_dest_world_market: "Мировой рынок перца" #NT!
 nd_ban_dest_world_market_desc: "Поглотите перцовый султанат Ачех и торговый порт Кедах, гарантируя, что каждый регион-производитель перца от Лампунга до северной Суматры подчиняется Бантену. Благодаря тому, что перец циркулирует на нашем рынке капитала, Бантен становится ведущей мировой биржей специй." #NT!
 nd_ban_dest_strait_command: "Командование проливами" #NT!
 nd_ban_dest_strait_command_desc: "Завоюйте Чиребон и Демак, чтобы закрепить позиции Бантена на Яве. Контроль над северным побережьем Яваны не позволяет соперникам бросить вызов нашему господству в Зондском проливе." #NT!
 nd_ban_dest_eastern_seas: "Владение восточными морями" #NT!
 nd_ban_dest_eastern_seas_desc: "Направьте бантенскую военно-морскую мощь в Макассарский пролив и через Яванское море на Бали. Морские королевства восточной Индонезии должны признать превосходство Бантена." #NT!
 nd_ban_dest_archipelago_hegemon: "Архипелаг Гегемон" #NT!
 nd_ban_dest_archipelago_hegemon_desc: "Расширьте владения Бантена до островов пряностей Тернате и портов Брунея. От Зондского пролива до Молуккских островов ни один флот не плавает в этих водах без согласия бантенцев." #NT!
 nd_ban.5.t: "Возрождение султаната" #NT!
 nd_ban.5.d: "Образование Султаната Бантен знаменует собой поворотный момент в истории западной Явы. Старые индуистские торговые сети были поглощены новым исламским государством, которое контролирует Зондский пролив: узкий проход, через который должна проходить вся торговля между Индийским океаном и Яванским морем.\n\nСултан смотрит со стен Суросована на гавань, заполненную иностранными судами. Китайские джонки соседствуют с индийскими дау и, все чаще, со странными кораблями европейцев с квадратным вооружением. Каждый приносит серебро; каждый лист начинен перцем. Вопрос не в том, разбогатеет ли Бантен, а в том, как лучше всего направить это богатство в прочную власть." #NT!
 nd_ban.5.a: "Будущее принадлежит тем, кто его захватит." #NT!
 nd_ban.6.t: "Палембангские перцовые войны" #NT!
 nd_ban.6.d: "Палембанг долгое время был главным соперником Бантена за контроль над торговлей перцем на юге Суматры. Там, где Бантен доминирует на западном побережье и Лампунге, Палембанг контролирует бассейн реки Муси и ее доступ к перечным садам внутри страны. Теперь, когда Палембанг находится под нашей властью, торговля перцем с юга Суматры протекает через единственный канал: наши склады в Бантене.\n\nУ торговцев, которые когда-то играли в Бантене и Палембанге друг против друга, теперь нет альтернативы. Цена на перец установлена ​​в наших гудангах, и она установлена ​​в нашу пользу." #NT!
 nd_ban.6.a: "Все перцовые дороги ведут в Бантен." #NT!
 nd_ban.7.t: "Бантен на перепутье" #NT!
 nd_ban.7.d: "Завоевание Малакки и Темасека превращает Бантен из региональной державы перца в глобальный торговый центр. Если когда-то торговцы могли обходить наши порты через Малаккский пролив, то теперь оба великих прохода между Индийским океаном и Тихим океаном находятся под контролем бантенов.\n\nИностранные купцы появляются в наших гаванях с новым почтением. Англичане, датчане, персы — все ищут выгодных условий от султаната, владеющего ключами от двух океанов. Вопрос в том, как использовать эту беспрецедентную позицию." #NT!
 nd_ban.7.a: "Стройте торговые сети по всему известному миру." #NT!
 nd_ban.7.b: "Крепче хватаемся за прямые проходы." #NT!
 nd_ban.8.t: "Мировой рынок перца" #NT!
 nd_ban.8.d: "От Лампунга до Ачеха, каждый крупный регион по производству перца на архипелаге теперь подчиняется султану Бантена. Черный перец, которого жаждет Европа, которым Китай приправляет свою кухню, которым торгуют индийские купцы через Аравийское море: все это проходит через наши склады и наши рынки.\n\nБантен достиг того, чего не удавалось ни одному предыдущему султанату: почти монополии на самую ценную в мире специю. Теперь вопрос заключается в том, использовать ли эту монополию как инструмент королевского обогащения или объявить Бантен свободным портом, привлекающим к нашим берегам всю мировую торговлю посредством обещания честной торговли." #NT!
 nd_ban.8.a: "Султан будет королем перца." #NT!
 nd_ban.8.b: "Объявить Бантен свободным портом для всех стран." #NT!
 nd_ban.9.t: "Яванская кампания" #NT!
 nd_ban.9.d: "Падение Чиребона и Демака обеспечивает безопасность восточного фланга Бантена на Яве. Северное побережье Яваны (ее порты, верфи, богатые рисом внутренние районы) теперь поддерживает амбиции султана, а не угрожает им.\n\nПатрульные корабли Бантена свободно курсируют вдоль побережья, а военные прау, которые когда-то охраняли только Зондский пролив, теперь проецируют мощь на Яванское море. Адмиралы говорят о далеких завоеваниях: Макассаре, Бали и даже легендарных островах специй." #NT!
 nd_ban.9.a: "Яванское море будет нашим владением." #NT!
 nd_ban.10.t: "Восточные завоевания" #NT!
 nd_ban.10.d: "Бантенский военный флот достиг того, что казалось невозможным: завоевания Макассара и подчинения балийских королевств. Восточные моря, которые когда-то были владениями бугинских пиратов и независимых раджей, теперь подпадают под власть султана.\n\nМаршруты специй от Молуккских островов до Явы теперь проходят через воды, патрулируемые бантенскими галерами. Наши купцы основывают предприятия в завоеванных портах, а наши администраторы навязывают султанские законы народам, никогда не знавшим суданского правления. Вопрос в том, как закрепить эти обширные завоевания." #NT!
 nd_ban.10.a: "Правило посредством превосходства на море." #NT!
 nd_ban.10.b: "Объедините яванские народы под одним знаменем." #NT!
 nd_ban.11.t: "Гегемон архипелага" #NT!
 nd_ban.11.d: "От Зондского пролива до Молуккских островов, от Брунея до Бали — султанат Бантен навязал свою волю всему архипелагу. Легендарные острова специй Тернате, источник гвоздики, которую европейцы ценят выше золота, теперь развевают знамя султана. Порты Брунея, ворот в Южно-Китайское море, подчиняются власти Бантена.\n\nНи одна европейская компания, ни один конкурирующий султанат, ни одна коалиция раджей не может бросить вызов господству Бантена над этими водами. Флот султана является крупнейшим в Юго-Восточной Азии, а гарнизоны его армии расположены в портах от Суматры до Молуккских островов. Это империя, о которой мечтал султан Агенг Тиртаяса: морское государство, не подчиняющееся ни одной иностранной державе." #NT!
 nd_ban.11.a: "Управляйте морями с помощью железного флота." #NT!
 nd_ban.11.b: "Правьте как Император островов." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_malacca_network: "Малакканская торговая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_malacca_network: "Купцы Бантена создали торговые сети, простирающиеся от завоеванного порта Малакка, соединяя перцовые рынки архипелага с остальным миром." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_strait_monopoly: "Монополия Твин Стрейтс" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_strait_monopoly: "Контроль над Зондским и Малаккским проливами дает Бантену эффективную монополию на морскую торговлю между Индийским океаном и Тихим океаном." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_pepper_king: "Король перца" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_pepper_king: "Султан Бантен обладает почти полной монополией на мировые поставки перца, устанавливая цены от Лиссабона до Кантона и безмерно обогащая султанат." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_free_port: "Свободный порт Востока" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_free_port: "Бантен объявил себя свободным портом, открытым для всех стран, привлекающим торговцев со всех уголков земного шара обещаниями честных сделок и низких тарифов." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_makassar_conquest: "Завоеватель Макассара" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_makassar_conquest: "Завоевание Макассара открывает восточные моря для бантенской военно-морской мощи, обеспечивая безопасность маршрутов пряностей и распространяя власть султана в самое сердце архипелага." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_java_unifier: "Объединитель Java" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_java_unifier: "Яванские королевства были объединены под одним знаменем. От Бантена до Сурабаи остров, который когда-то был разделен между конкурирующими султанатами, теперь служит одному хозяину." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_spice_admiral: "Адмирал специй" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_spice_admiral: "Адмиралы Бантена командуют самым могущественным флотом на архипелаге, их галеры и военные корабли патрулируют морские пути от Зондского пролива до Молуккских островов." #NT!
 STATIC_MODIFIER_NAME_nd_ban_dest_island_emperor: "Император островов" #NT!
 STATIC_MODIFIER_DESC_nd_ban_dest_island_emperor: "Султан Бантена правит как император обширными морскими владениями, его подданные охватывают десятки островов, а его вассалы правят от Брунея до Тернате." #NT!
 nd_ban_global_pepper_exchange: "Глобальная биржа перца" #NT!
 nd_ban_global_pepper_exchange_desc: "Огромный торговый комплекс, где перец со всего архипелага продается с аукциона торговцам из всех торговых стран мира. Биржа устанавливает мировую цену на черный перец." #NT!
 nd_ban_exchange_upkeep: "Обслуживание обмена" #NT!
 nd_ban_exchange_upkeep_desc: "Стоимость содержания Глобальной биржи перца: бумага для торговых книг, тонкая ткань для аукционных залов и инструменты для весового оборудования." #NT!
 nd_ban_admiralty_citadel: "Адмиралтейская цитадель" #NT!
 nd_ban_admiralty_citadel_desc: "Укрепленный военно-морской штаб, из которого адмиралы султана координируют операции флота по всему архипелагу. В цитадели находятся навигационные карты, сигнальные станции и арсенал для флота." #NT!
 nd_ban_citadel_upkeep: "Обслуживание Цитадели" #NT!
 nd_ban_citadel_upkeep_desc: "Стоимость содержания Адмиралтейской цитадели: камень для укреплений, военно-морские припасы для арсенала и вооружение для гарнизона." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_ban_bureaucracy_authority: "Бюрократическая власть Султаната" #NT!
 AUTO_MODIFIER_DESC_nd_ban_bureaucracy_authority: "Султан Бантена, уверенно восседающий на своем троне в Сурасоан Каратоне, теперь может учреждать формальные институты для управления королевством. Столица предоставляет одно бюрократическое место; этот орган добавляет еще два." #NT!
  
 ban_surasoan_karaton_bureaucracy: "Сурасоан Каратон" #NT!
 ban_surasoan_karaton_bureaucracy_desc: "Дворцовый комплекс султана, обнесенный стеной, в Бантен-ламе, начатый Мауланой Хасануддином в 1552 году и развивавшийся каждым последующим правителем, вплоть до реконструкции султана Агенга под руководством итальянского ренегата Кардил в 1670-х годах. Каратон окружает личный далем султана, зал для аудиенций пендопо, зал совета Панчагати и парадную площадь алун-алун: институциональный театр, в котором главный кади, сьябандары, туменггунги и приезжие посланники - все ведут дела султаната. Уединение султана за семью дворами придает достоинство, отличающее правителя Бантена от любого провинциального яванского лорда." #NT!
  
 ban_syahbandariate_bureaucracy: "Сяхбандариат Бантена" #NT!
 ban_syahbandariate_bureaucracy_desc: "Многонациональная система начальников портов, которая управляла портом Бантен с конца 16 века до оккупации ЛОС в 1682 году. Султан назначил отдельного сьяхбандара над каждой иностранной общиной: китайцев над Печинаном, гуджаратцев над кварталом Келинг, малайцев над грузоотправителями архипелага и (после 1596 и 1602 годов) европейских факторов, чьи голландские и английские фабрики платили трону пошлины. Каждый сьяхбандар собирал якорные стоянки и таможню в своей юрисдикции и совместно подчинялся главному министру султана, делая Бантен свободным портом по образцу Бантен-Ачех-Макассар: не свободным от пошлин, но свободным от монополии какой-либо отдельной общины." #NT!
  
 ban_tumenggung_tributary_bureaucracy: "Приточная система Туменггунг" #NT!
 ban_tumenggung_tributary_bureaucracy_desc: "Цепочка потомственных военных губернаторов (туменггунгов по яванскому образцу Матарам-Демак), которые управляли внутренними районами Лампунг, производящими перец, через Зондский пролив и внутренние районы Бантена от имени султана. Каждый Туменггунг командовал небольшим кавалерийским отрядом прияи, контролировал перцовые плантации через деревенских старост пасирах и переправлял даньский перец в порт Бантен для продажи сьяхбандарам. Система дала Бантену почти монополию на перец архипелага с ок. 1620 г. по договору VOC 1682 г. и завещал центробежные тенденции, характерные для каждого яванского прибрежного султаната." #NT!
  
 ban_pesantren_hierarchy_bureaucracy: "Султан-халиф и иерархия песантренов" #NT!
 ban_pesantren_hierarchy_bureaucracy_desc: "Институциональная форма бантенского ислама после того, как султан Абулмафахир Махмуд Абдулкадир получил в 1638 году фирман от Шарифа Мекки, признающий правителя Бантена султаном, что стало первым мекканским признанием любого яванского суверена. Грант объединил трон с сетью песантренов, производной от Чиребона, линии вали санга, и повысил должность главного кади при дворе Сурасоан, который курировал брачное право, благотворительные фонды и пятничную хутбу в Большой мечети Бантен-ламы. При султане Агенге (годы правления 1651–1683) иерархия приобрела отчетливо оппозиционный характер, поддерживая длительное антиголландское сопротивление вплоть до XVIII века." #NT!
  
 ban_polyglot_corps_bureaucracy: "Корпус наемников полиглотов" #NT!
 ban_polyglot_corps_bureaucracy_desc: "Бугинские, макасарские, балийские, мадагаскарские и (в меньшем количестве) европейские домашние войска, которые султан Агенг Тиртаяса нанял во время реформированной армии, чтобы разрушить монополию на кавалерию прияи. После Бонгайского договора 1667 года, который разбросал макасарских ветеранов бугис-макассаров по всему архипелагу, Бантен стал основным работодателем этих перемещенных бойцов: полков бугисских копейщиков, макассарских аркебузиров, балийских крис-носильщиков и малагасийских мушкетеров, расквартированных в Каранганту и Пакаумане, прошедших подготовку в европейских формированиях под командованием Карделя и его преемников. Корпус вел осаду Бантен-ламы ЛОС в 1682 году почти до тупика, но это зависело от постоянных денежных выплат из доходов от продажи перца." #NT!
