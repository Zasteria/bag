l_russian:
 STATIC_MODIFIER_NAME_nd_nus_mandala_thalassocracy: "Мандала Талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_nus_mandala_thalassocracy: "Нусантара правит как морская мандала, концентрические кольца суверенитета простираются от священной Явы через десять тысяч островов, каждый вассал связан торговлей и данью с центром." #NT!
 STATIC_MODIFIER_NAME_nd_nus_spice_archipelago: "Архипелаг специй" #NT!
 STATIC_MODIFIER_DESC_nd_nus_spice_archipelago: "Гвоздика Тернате, мускатный орех Банда, перец Бантен, Нусантара контролирует источники самых желанных товаров в мире, и каждое торговое судно, проходящее через эти воды, обогащает архипелаг." #NT!
 nd_nus.1.t: "Объединение Нусантары" #NT!
 nd_nus.1.d: "Мечта Гаджи Мады осуществилась заново. От рисовых полей Явы до пряных рощ Молуккских островов, от торговых портов Суматры до берегов Сулавеси — разрозненные острова архипелага подчиняются одной власти. Концепция Нусантары, всего островного царства между морями, больше не является видением поэта, а политической реальностью.\n\nНо какое это должно быть царство? Могущество архипелага можно распространить за пределы архипелага через флоты, которые контролируют каждый пролив и морской путь, связывая вассалов господством на море, как это когда-то делал Шривиджая. Или его можно повернуть внутрь себя, взращивая необычайное богатство, которое проистекает из контроля над источником самых ценных в мире специй, делая Нусантару не покорителем морей, а незаменимым рынком, к которому должен стремиться весь мир.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_nus.1.a: "Наши флоты будут контролировать каждый пролив" #NT!
 nd_nus.1.b: "Мир придет к нам за пряностями" #NT!
 nd_nus.2.t: "Золотой век Маджапахита" #NT!
 nd_nus.2.d: "В 1365 году придворный поэт Прапанча составил «Нагаракретагаму», описывающую царство, простиравшееся от Суматры до Папуа, от Борнео до Бали. В ее центре сидел король Хайям Вурук в столице Тровулане, городе каналов и храмов, из красного кирпича канди, возвышающемся над рисовыми равнинами восточной Явы.\n\nНо истинным архитектором этой империи был Махапатих Гаджа Мада, который принес легендарную клятву Палапы: он не вкусит пряностей, пока весь архипелаг не объединится под знаменем Маджапахита. Благодаря сочетанию военных кампаний, дипломатических браков и торговых союзов он сдержал свое слово. Теперь вопрос заключается в том, следовать ли его пути завоеваний за пределы страны или совершенствовать цивилизацию, которую он построил у себя дома." #NT!
 nd_nus.2.a: "Мы чтим клятву Гаджи Мады; архипелаг наш по праву" #NT!
 nd_nus.2.b: "Троулан затмит любую столицу мира" #NT!
 STATIC_MODIFIER_NAME_nd_nus_oath_of_gajah_mada: "Клятва Гаджи Мады" #NT!
 STATIC_MODIFIER_DESC_nd_nus_oath_of_gajah_mada: "Как Гаджа Мада однажды поклялся объединить всю Нусантару под одним знаменем, так и теперь королевство стремится к осуществлению своего видения посредством военной силы и праведных завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_nus_trowulan_splendor: "Великолепие Тровулана" #NT!
 STATIC_MODIFIER_DESC_nd_nus_trowulan_splendor: "Столица сияет величием из красного кирпича сотен храмов канди. Поэты, архитекторы и ученые собираются во дворе, который может соперничать со всеми в известном мире." #NT!
 nd_nus.3.t: "Осада Батавии султаном Агунгом" #NT!
 nd_nus.3.d: "В 1628 году султан Агунг из Матарама собрал самую большую яванскую армию на памяти живущих и двинулся на Батавию, укрепленный торговый пост ЛОС, который без приглашения обосновался на северном побережье Явы. Его силы исчислялись десятками тысяч человек, их поддерживали боевые слоны и бронзовые пушки «четбанг». Осада представляла собой титаническое столкновение между суверенитетом Явы и европейским коммерческим империализмом.\n\nХотя первая осада провалилась из-за трудностей со снабжением и голландского военно-морского превосходства, Агунг предпринял вторую попытку в 1629 году, на этот раз пытаясь построить рисовые зернохранилища вдоль маршрута. Кампании выявили как военный потенциал, так и логистические проблемы сопротивления военно-морской державе с наземной базы. Наследие Агунга живо: он доказал, что Нусантара не сдастся без боя." #NT!
 nd_nus.3.a: "Мы извлекем уроки из кампаний Агунга и нанесем еще больший удар." #NT!
 nd_nus.3.b: "Агунг поступил мудро, укрепив город. Пусть ни один захватчик не удержит нашу землю" #NT!
 STATIC_MODIFIER_NAME_nd_nus_agung_military_reform: "Военная реформа Агунга" #NT!
 STATIC_MODIFIER_DESC_nd_nus_agung_military_reform: "Кампании султана Агунга против Батавии продемонстрировали, что защита Нусантары требует наступательных способностей: способности проецировать силу, выдерживать осады и изгонять иностранных захватчиков с архипелага." #NT!
 STATIC_MODIFIER_NAME_nd_nus_agung_consolidation: "Объединение Агунга" #NT!
 STATIC_MODIFIER_DESC_nd_nus_agung_consolidation: "Урок Батавии заключается не в том, что осада провалилась, а в том, что ни одной иностранной крепости вообще нельзя было позволить воздвигнуться. За каждым побережьем необходимо следить, за каждым подходом защищаться, за каждым захватчиком должна быть обескровлена ​​истощение." #NT!
 nd_nus.4.t: "Мастера торговли специями" #NT!
 nd_nus.4.d: "На протяжении веков крошечные вулканические острова Молуккских островов производили единственные в мире гвоздику и мускатный орех. Острова Банда, едва заметные точки в огромном океане, поставляли в Венецию каждое зернышко мускатного ореха и мускатного ореха, потребляемое из Китая. И именно купцы и султаны Нусантары контролировали первые и наиболее прибыльные звенья в этой цепочке, покупая у производителей, храня их на огромных складах в Гуданге и продавая арабским, индийским и китайским торговцам с огромной наценкой.\n\nТеперь эта монополия консолидирована под единой политической властью. Там, где когда-то дюжина конкурирующих султанатов подрывают друг друга, Нусантара говорит одним голосом и устанавливает одну цену. У мира нет другого выбора, кроме как заплатить за это." #NT!
 nd_nus.4.a: "Пряность должна течь только через наши руки." #NT!
 nd_nus.5.t: "Пробуждение Нусантары" #NT!
 nd_nus.5.d: "От Ачеха до Папуа, от гор Суматры до пряных рощ Тернате проникает новая идея: архипелаг — это не просто совокупность королевств и султанатов, а единая цивилизация, связанная общими морями, переплетенной торговлей и столетиями культурного обмена. Яванцы, сунданцы, малайцы, бугисцы, балийцы, молуккцы: народов на островах много, но океан, соединяющий их, один.\n\nЭто пробуждение сознания Нусантары, осознание того, что единство не требует единообразия, что тысяча островов может разделить одну судьбу, не отказываясь от своей индивидуальности. Готонг ройонг – древняя традиция коллективного труда и взаимопомощи – становится философской основой современного государства." #NT!
 nd_nus.5.a: "Бхиннека Тунггал Ика, единство в разнообразии" #NT!
 nd_nus_srivijaya_legacy: "Шривиджая Морское Наследие" #NT!
 nd_nus_srivijaya_legacy_desc: "Традиции Шривиджая, первой великой талассократической империи архипелага, живут в мореплавании и морской торговле Нусантары." #NT!
 nd_nus_sawah_irrigation: "Савах Ирригация" #NT!
 nd_nus_sawah_irrigation_desc: "Система водных храмов Субак управляет сложными террасными рисовыми полями, которые кормят густонаселенное население Явы и Бали." #NT!
 nd_nus_spice_knowledge: "Древние знания о специях" #NT!
 nd_nus_spice_knowledge_desc: "Поколения выращивания и торговли гвоздикой, мускатным орехом и перцем дают Нусантаре непревзойденный опыт работы с самыми ценными сырьевыми товарами в мире." #NT!
 nd_nus_silat_tradition: "Боевая традиция Силат" #NT!
 nd_nus_silat_tradition_desc: "Пенчак силат, местное боевое искусство архипелага, обучает воинов плавным приемам ближнего боя, разработанным за столетия межостровных войн." #NT!
 nd_nus_mandala_statecraft: "Мандала Государственное управление" #NT!
 nd_nus_mandala_statecraft_desc: "Модель управления мандалой связывает вассалов через концентрические кольца влияния, исходящие из священного центра, позволяя управлять архипелагом без жестких границ." #NT!
 nd_nus_majapahit_golden_age: "Золотой век Маджапахита" #NT!
 nd_nus_majapahit_golden_age_desc: "При Хаяме Вуруке и Гадже Маде Маджапахит объединил архипелаг со столицей Тровулан, создав модель политического единства Нусантары." #NT!
 nd_nus_kris_tradition: "Крис Воин Традиция" #NT!
 nd_nus_kris_tradition_desc: "Крис, яванский кинжал с асимметричным волнистым лезвием, является одновременно священной реликвией и оружием войны, которым владеют элитные воины, обученные искусству силата." #NT!
 nd_nus_candi_tradition: "Традиция храма Канди" #NT!
 nd_nus_candi_tradition_desc: "Храмы канди из красного кирпича на востоке Явы олицетворяют столетия индуистско-буддийского архитектурного мастерства, центры обучения и преданности." #NT!
 nd_nus_pasar_tradition: "Торговая традиция Пасара" #NT!
 nd_nus_pasar_tradition_desc: "На огромных рынках пасар Нусантары сходятся товары тысячи островов: специи с востока, текстиль с запада, рис из центра Явы." #NT!
 nd_nus_archipelagic_navigation: "Архипелажное судоходство" #NT!
 nd_nus_archipelagic_navigation_desc: "Для навигации по десяти тысячам островов требуется мастерство управления течениями, муссонными ветрами и звездными путями, передаваемыми поколениями мореплавателей." #NT!
 nd_nus_prahu_raiders: "Прахуский рейдерский флот" #NT!
 nd_nus_prahu_raiders_desc: "Prahu с двойной опорой — самое быстрое судно в островных водах, идеально подходящее для рейдов, прибрежного патрулирования и преследования вражеских кораблей через узкие проливы." #NT!
 nd_nus_islamic_scholarship: "Исламская стипендия" #NT!
 nd_nus_islamic_scholarship_desc: "Ислам мирно распространился по архипелагу через суфийских торговцев и ученых. Школы-интернаты песантрена стали центрами как религиозного обучения, так и интеллектуальной жизни Явана." #NT!
 nd_nus_spice_monopoly: "Монополия специй" #NT!
 nd_nus_spice_monopoly_desc: "Контроль над молуккскими источниками специй, единственными в мире поставщиками гвоздики и мускатного ореха, дает Нусантаре беспрецедентные рычаги влияния в мировой торговле." #NT!
 nd_nus_cetbang_foundries: "Цетбангский бронзовый литейный завод" #NT!
 nd_nus_cetbang_foundries_desc: "Яванская пушка «четбанг», отлитая из бронзы, демонстрирует местную пороховую традицию, возникшую еще до контактов европейцев с архипелагом." #NT!
 nd_nus_shipbuilding_mastery: "Мастерство кораблестроения" #NT!
 nd_nus_shipbuilding_mastery_desc: "Королевские верфи Галанган Капал производят джонг, праху и кора-кора в количествах, которые делают Нусантару военно-морской державой, с которой нужно считаться." #NT!
 nd_nus_sultanate_governance: "Управление Султаната" #NT!
 nd_nus_sultanate_governance_desc: "Исламские султанаты формализуют управление архипелагами через шариатские суды, капитанов портов и бюрократию, адаптированную к реалиям островного правления." #NT!
 nd_nus_kora_kora_fleet: "Кора-Корский военный флот" #NT!
 nd_nus_kora_kora_fleet_desc: "Кора-кора — это огромная молуккская военная галера с сотнями воинов, предназначенная для абордажных операций и ближнего морского боя в островной войне." #NT!
 nd_nus_pepper_exports: "Экспорт перца и специй" #NT!
 nd_nus_pepper_exports_desc: "Бантен, Ачех и дюжина других портов направляют перец, гвоздику и мускатный орех архипелага в артерии глобальной торговли." #NT!
 nd_nus_wayang_arts: "Придворное искусство Ваянга" #NT!
 nd_nus_wayang_arts_desc: "Кукольный театр теней Ваянг Кулит передает эпические истории Рамаяны и Махабхараты, объединяя разные народы общим культурным наследием." #NT!
 nd_nus_fortress_resistance: "Крепость Сопротивления" #NT!
 nd_nus_fortress_resistance_desc: "Прибрежные и внутренние укрепления бэнтенга возникают для защиты Нусантары от европейских колониальных вторжений и утверждения суверенитета над архипелагом." #NT!
 nd_nus_sultan_agung_campaigns: "Кампании султана Агунга" #NT!
 nd_nus_sultan_agung_campaigns_desc: "Осада Батавии султаном Агунгом Матарамским в 1628–1629 годах продемонстрировала как военный потенциал, так и ожесточенную решимость яванского сопротивления колониализму." #NT!
 nd_nus_phinisi_tradition: "Парусная традиция Финиси" #NT!
 nd_nus_phinisi_tradition_desc: "Пиниси, двухмачтовое парусное судно конструкции Бугис-Макассар, представляет собой вершину индонезийского судостроения, быстрое, мореходное и предназначенное для дальних плаваний." #NT!
 nd_nus_bugis_diaspora: "Бугис Диаспора" #NT!
 nd_nus_bugis_diaspora_desc: "Народы буги и макасар на Сулавеси — величайшие мореплаватели, торговцы, наемники и колонисты архипелага, основавшие общины от Борнео до Малайского полуострова." #NT!
 nd_nus_mataram_statecraft: "Матарам Управление государством" #NT!
 nd_nus_mataram_statecraft_desc: "Султанат Матарам централизует политическую власть Явы, сочетая исламское управление с ранее существовавшими яванскими административными традициями." #NT!
 nd_nus_anti_colonial_resistance: "Антиколониальное сопротивление" #NT!
 nd_nus_anti_colonial_resistance_desc: "От Ачеха до Тернате, от Бантена до Матарама народы Нусантары организуют устойчивое сопротивление европейским колониальным посягательствам." #NT!
 nd_nus_archipelagic_awakening: "Пробуждение Нусантары" #NT!
 nd_nus_archipelagic_awakening_desc: "Появляется новое сознание: архипелаг — это не просто совокупность королевств, а единая цивилизация, объединенная общими морями и переплетенными судьбами." #NT!
 nd_nus_spice_industrialization: "Индустриализация специй" #NT!
 nd_nus_spice_industrialization_desc: "Современные методы обработки, упаковки и экспорта превращают древнюю торговлю специями на архипелаге в промышленное предприятие мирового масштаба." #NT!
 nd_nus_maritime_sovereignty: "Морской суверенитет" #NT!
 nd_nus_maritime_sovereignty_desc: "Нусантара утверждает суверенный контроль над водами между своими островами, море — это не граница, а соединительная ткань нации." #NT!
 nd_nus_gotong_royong: "Готонг Ройонг" #NT!
 nd_nus_gotong_royong_desc: "Древняя индонезийская традиция коллективной взаимопомощи становится господствующей философией, государство процветает, когда все его народы трудятся вместе ради общего блага." #NT!
 nd_nus_pancasila_foundations: "Фонды Панчасила" #NT!
 nd_nus_pancasila_foundations_desc: "Единство в разнообразии, философский принцип, согласно которому нация сотен культур, языков и вероисповеданий может сосуществовать при общей приверженности толерантности и взаимному уважению." #NT!
 a_nd_nus_kris_warriors: "Крис Уорриорс" #NT!
 a_nd_nus_kris_warriors_desc: "Элитная яванская пехота, владеющая священным кинжалом крис, обученная древнему боевому искусству пенчак силат. В их боевом стиле упор делается на внезапные, разрушительные удары с близкого расстояния." #NT!
 a_nd_nus_kris_levy: "Крис Леви Уорриорз" #NT!
 a_nd_nus_kris_levy_desc: "Войска новобранцев, вооруженные традиционными крисами, набираются из деревень и рисовых полей Явы." #NT!
 a_nd_nus_cetbang: "Четбангская артиллерия" #NT!
 a_nd_nus_cetbang_desc: "Бронзовые пушки, отлитые в яванских традициях, появились раньше европейского порохового оружия на архипелаге. Цетбанг стреляет каменными или железными снарядами со смертельной точностью." #NT!
 n_nd_nus_prahu: "Праху Рейдер" #NT!
 n_nd_nus_prahu_desc: "Быстрое судно с двумя выносными опорами, созданное для скорости и маневренности на мелководье и в узких проливах архипелага. Идеально подходит для прибрежных рейдов и преследования." #NT!
 n_nd_nus_kora_kora: "Кора-Корская военная галера" #NT!
 n_nd_nus_kora_kora_desc: "Огромная молуккская военная галера, предназначенная для абордажных операций и ближнего морского боя, с экипажем из сотен воинов с островов пряностей." #NT!
 n_nd_nus_kora_kora_levy: "Кора-Кора Галера Леви" #NT!
 n_nd_nus_kora_kora_levy_desc: "Боевые галеры с экипажем из набранных островитян из прибрежных поселений Нусантары." #NT!
 n_nd_nus_phinisi: "Финиси" #NT!
 n_nd_nus_phinisi_desc: "Знаменитое двухмачтовое парусное судно конструкции Бугис-Макассар, построенное для дальних океанских путешествий. Быстрый и мореходный корабль «Пиниси» доминировал в морской торговле и войне в Индонезии поздней эпохи." #NT!
 nd_nus_candi: "Храм Канди" #NT!
 nd_nus_candi_desc: "Индо-буддийский храмовый комплекс из красного кирпича в восточно-яванской традиции, служащий центром религиозной преданности, культурного обучения и покровительства искусству." #NT!
 nd_nus_pasar_agung: "Пасар Агунг" #NT!
 nd_nus_pasar_agung_desc: "Большой рынок, центральный базар, где сходятся товары десяти тысяч островов. Через его прилавки продаются специи, ткани, драгоценные металлы и керамика." #NT!
 nd_nus_galangan_kapal: "Галанган Капал" #NT!
 nd_nus_galangan_kapal_desc: "Королевская верфь в яванских и бугисских традициях, производящая джонг, праху, кора-кора и пиниси для торгового и военного флотов Нусантары." #NT!
 nd_nus_benteng: "Бентенг Перлаванан" #NT!
 nd_nus_benteng_desc: "Крепость сопротивления, прибрежные и внутренние укрепления, построенные для отражения колониальных захватчиков и утверждения суверенитета Нусантары над своей территорией." #NT!
 nd_nus_pesantren: "Песантрен" #NT!
 nd_nus_pesantren_desc: "Исламская школа-интернат яванской традиции, где учащиеся изучают Коран наряду с яванской литературой, математикой и натуральной философией." #NT!
 nd_nus_sawah: "Савах Терасеринг" #NT!
 nd_nus_sawah_desc: "Орошаемые рисовые террасы, управляемые системой водных храмов Субак, чудом сельскохозяйственной техники, поддерживающим густонаселенность Явы." #NT!
 nd_nus_padepokan: "Падепокан Силат" #NT!
 nd_nus_padepokan_desc: "Тренировочный полигон древнего боевого искусства пенчак силат, где воины осваивают плавные боевые приемы архипелага." #NT!
 nd_nus_gudang_rempah: "Гуданг Ремпах" #NT!
 nd_nus_gudang_rempah_desc: "Склад специй, где хранятся, сортируются и готовятся к экспорту на мировые рынки гвоздика, мускатный орех, перец и другие ценные товары." #NT!
 nd_nus_pendopo_wayang: "Пендопо Ваянг" #NT!
 nd_nus_pendopo_wayang_desc: "Зал под открытым небом, где кукольник из Даланга представляет ваянг кулит, кукольный театр теней, передающий великие эпосы и объединяющий культуры архипелага." #NT!
 nd_nus_pelabuhan: "Пелабухан Ниага" #NT!
 nd_nus_pelabuhan_desc: "Великий торговый порт в традициях Шривиджая, служащий перевалочным пунктом, через который товары из Индийского океана и Южно-Китайского моря переходят из рук в руки." #NT!
 nd_nus_candi_maintenance: "Содержание храма" #NT!
 nd_nus_candi_maintenance_desc: "Камень и древесина для поддержания священных территорий храма Канди." #NT!
 nd_nus_spice_bazaar: "Операции на базаре специй" #NT!
 nd_nus_spice_bazaar_desc: "Керамические сосуды и красители для работы большого рынка." #NT!
 nd_nus_shipyard_operations: "Операции верфи" #NT!
 nd_nus_shipyard_operations_desc: "Пиломатериалы, военно-морские припасы, инструменты и деготь, потребляемые на строительство и обслуживание королевской верфи Чонг и Праху." #NT!
 nd_nus_benteng_upkeep: "Содержание крепости" #NT!
 nd_nus_benteng_upkeep_desc: "Камень для стен, оружие и кожа для вооружения гарнизона, а также пшеница, чтобы кормить солдат бэнтенгов." #NT!
 nd_nus_pesantren_upkeep: "Содержание школы" #NT!
 nd_nus_pesantren_upkeep_desc: "Бумага, письменные принадлежности и ткань для религиозных ученых и студентов песантрена." #NT!
 nd_nus_irrigation_upkeep: "Выращивание риса Савах" #NT!
 nd_nus_irrigation_upkeep_desc: "Террасы, управляемые субаком, дают обильные урожаи риса, поддерживаемые бамбуковыми и деревянными ирригационными каналами." #NT!
 nd_nus_padepokan_upkeep: "Содержание тренировочной площадки" #NT!
 nd_nus_padepokan_upkeep_desc: "Оружие, кожаная обивка и ткань для тренировочного снаряжения и униформы силатов." #NT!
 nd_nus_spice_storage: "Хранение специй" #NT!
 nd_nus_spice_storage_desc: "Керамические сосуды и запасы перца хранятся на огромном складе специй." #NT!
 nd_nus_wayang_performances: "Ваянгские выступления" #NT!
 nd_nus_wayang_performances_desc: "Краски для расписных кожаных кукол, пиломатериалы для сцены и ткани для костюмов придворных артистов." #NT!
 nd_nus_port_operations: "Портовые операции" #NT!
 nd_nus_port_operations_desc: "Военно-морские припасы, древесина и соль, потребляемые для повседневной деятельности торгового порта и снабжения судов." #NT!
 levy_nd_nus_kris_warriors: "Крис Уорриор Леви" #NT!
 levy_nd_nus_kris_warriors_desc: "Набрана вооруженная крисами пехота из деревень Явы." #NT!
 levy_nd_nus_kora_kora: "Кора-Кора Леви" #NT!
 levy_nd_nus_kora_kora_desc: "Набранные военные галеры с экипажем островитян Нусантары." #NT!
 nd_nus_formed_tt: "Нусантара была основана" #NT!
 nd_nus_path_a_tt: "Выбрали Мандалу Талассократию" #NT!
 nd_nus_path_b_tt: "Выбрал архипелаг специй" #NT!
 nd_nus_destiny: "Мандат Нусантары" #NT!
 nd_nus_destiny_desc: "Когда архипелаг объединился под одним знаменем, мандат небес падает на Нусантару. Стабильность должна сохраняться как основа для достижения больших амбиций." #NT!
 nd_nus_dest_strait_masters: "Хозяева пролива" #NT!
 nd_nus_dest_strait_masters_desc: "Захватить контроль над Малаккским проливом, узким проходом, через который должна проходить вся торговля между Индийским океаном и Южно-Китайским морем. Малайский полуостров должен подчиниться воле Нусантары." #NT!
 nd_nus_dest_champa_seas: "Владычество над морями Чампа" #NT!
 nd_nus_dest_champa_seas_desc: "Обезопасив Малакку, направьте морскую мощь Нусантары на север, в воды Чампы и Сиамского залива. Установить военно-морское господство над всем Южно-Китайским морем." #NT!
 nd_nus_dest_samudra_raja: "Самудра Раджа" #NT!
 nd_nus_dest_samudra_raja_desc: "Властелин морей. Поместив знамя Нусантары на самом материке, от дельты Меконга до Чао Прайи, морская империя расширяет свое влияние за пределы архипелага. Создайте прибрежную команду Бентенг-Лаут, чтобы закрепить это доминион." #NT!
 nd_nus_dest_spice_sources: "Управляйте источниками специй" #NT!
 nd_nus_dest_spice_sources_desc: "Гвоздичные деревья Тернате и мускатные рощи Банды производят самые ценные товары в мире. Возьмите эти далекие молуккские султанаты под твердый контроль Нусантары." #NT!
 nd_nus_dest_emporium: "Величайший торговый центр" #NT!
 nd_nus_dest_emporium_desc: "Превратите Нусантару из производителя специй в крупнейший в мире торговый центр. Развивайте экономику, внедряйте современное банковское дело и создавайте инфраструктуру, достойную глобального рынка." #NT!
 nd_nus_dest_bumi_rempah: "Буми Ремпах" #NT!
 nd_nus_dest_bumi_rempah_desc: "Страна специй. Каждое торговое судно на земле, от Лиссабона до Кантона, зависит от товаров, произрастающих только на этих островах. Постройте Пасар Дунию, Мировой Рынок, и пусть все народы придут в Нусантару с золотом в руках." #NT!
 nd_nus.6.t: "Мандат Нусантары" #NT!
 nd_nus.6.d: "Разрозненные королевства и султанаты архипелага собрались под одной короной. От вулканических вершин Явы до коралловых атоллов восточных морей Нусантара представляет собой единое королевство впервые со времен золотого века Маджапахита.\n\nНо единство само по себе не является судьбой. Мандат на управление десятью тысячами островов требует большего, чем просто военное завоевание, он требует стабильности, легитимности и видения того, каким может стать это беспрецедентное архипелажное государство. Фундамент заложен. Теперь начинается настоящая работа." #NT!
 nd_nus.6.a: "Мандат архипелага принадлежит нам." #NT!
 nd_nus.7.t: "Хозяева пролива" #NT!
 nd_nus.7.d: "Флаги Нусантары теперь развеваются над Малаккой и Кедой, узкими местами самого оживленного морского торгового пути в мире. Каждая китайская джонка, перевозящая шелк на запад, каждое арабское дау, нагруженное ладаном, каждое индийское судно с тканями и драгоценными камнями — все должно проходить через воды, которыми управляет Нусантара.\n\nШривиджая понял эту силу семь веков назад. Малаккский султанат построил на нем империю. Теперь Нусантара унаследовала их наследие и превзошла его, поскольку ни одна предыдущая морская держава не контролировала одновременно обе стороны пролива, одновременно командуя обширным архипелагом на юге и востоке." #NT!
 nd_nus.7.a: "Все, кто плывет по этим водам, плывут с нашего разрешения." #NT!
 nd_nus.8.t: "Кампания в Южно-Китайском море" #NT!
 nd_nus.8.d: "Военный флот Нусантары теперь патрулирует воды, простирающиеся от дельты Меконга до Сиамского залива. Старое королевство Чампа, малайские прибрежные города и торговые порты материка признают превосходство военно-морского флота архипелага.\n\nВопрос в том, как укрепить это обширное морское владычество. Некоторые адмиралы выступают за агрессивное передовое развертывание, поддерживая боевые флоты в отдаленных водах, готовые продемонстрировать мощь в любой момент. Другие советуют использовать более тонкий подход, используя узкие места пролива в качестве рычага для дипломатической гегемонии, связывая материковые государства посредством торговой зависимости, а не оккупации." #NT!
 nd_nus.8.a: "Наши военные флоты будут патрулировать все морские пути." #NT!
 nd_nus.8.b: "Пусть проливы сделают за нас нашу работу" #NT!
 nd_nus.9.t: "Самудра Раджа: Повелитель морей" #NT!
 nd_nus.9.d: "От рисовых равнин Чао Прайя до пряных рощ Молуккских островов, от Малаккского пролива до Тиморского моря — власть Нусантары охватывает величайшие морские владения, которые когда-либо видел мир. Никакая военно-морская держава, ни португальский, ни голландский, ни китайский флот сокровищ, не сможет бросить вызов нашему господству в этих водах.\n\nСамудра Раджа, Властелин морей, стоит перед окончательным выбором. Империю можно защитить за счет превосходящей военно-морской и военной силы, модернизируя вооруженные силы, чтобы сокрушить любого соперника. Или же оно может быть закреплено в постоянных учреждениях, гарнизонах в каждом проливе, крепостях в каждой гавани, в сети военно-морских баз, которая переживет любого отдельного правителя." #NT!
 nd_nus.9.a: "Модернизируйте и сокрушите всех соперников" #NT!
 nd_nus.9.b: "Постройте постоянные институты империи" #NT!
 nd_nus.10.t: "Острова специй под одной короной" #NT!
 nd_nus.10.d: "Тернате и Банда, эти крошечные вулканические острова в восточных морях, на протяжении веков были единственным источником гвоздики и мускатного ореха на земле. Местные султаны сказочно разбогатели, натравливая друг против друга португальских, испанских и голландских торговцев, в то время как за один мешок гвоздики можно было купить корабль в Венеции.\n\nТеперь эти легендарные острова специй подчиняются Нусантаре. Посредники устранены. Производители, склады, корабли и порты находятся под единой властью. Впервые вся цепочка поставок специй, от дерева до корабля, контролируется одной силой." #NT!
 nd_nus.10.a: "Пряность течет только через наши руки" #NT!
 nd_nus.11.t: "Торговый центр Востока" #NT!
 nd_nus.11.d: "Порты Нусантары стали перекрестком мира. Китайские купцы привозят фарфор и шелк, индийские торговцы везут ткани и драгоценные камни, арабские путешественники предлагают ладан и лошадей, а европейские корабли прибывают с серебром. Все приходят, чтобы купить то, что производят только эти острова, и все уходят, заплатив цену Нусантары.\n\nПри дворе соревнуются две философии. Монополисты выступают за жесткий картель, контролируют поставки, фиксируют цены, наказывают контрабандистов и извлекают максимальную прибыль из каждой крупинки пряности. Свободные торговцы возражают, что открытый торговый центр привлекает больше торговцев, больше товаров, больше идей и, в конечном итоге, больше богатства, чем любая монополия могла бы выжать из ограниченного рынка." #NT!
 nd_nus.11.a: "Контролируйте предложение и фиксируйте цену" #NT!
 nd_nus.11.b: "Приветствуем всех торговцев в наших открытых портах" #NT!
 nd_nus.12.t: "Буми Ремпах: Страна специй" #NT!
 nd_nus.12.d: "Нусантара – это не просто страна, которая торгует специями: это ЭТО пряности. Экономика всего известного мира зависит от товаров, которые растут только на этих островах. Ни одно европейское колониальное предприятие, ни одна китайская дань-миссия, ни один арабский торговый флот не могут функционировать без того, что производит Нусантара. Страна Специй стала незаменимой нацией.\n\nЭто высшее экономическое положение можно использовать по-разному. Некоторые советуют построить величайший в мире рынок, постоянный институт, куда все страны должны приходить для торговли, обогащая архипелаг за счет огромного объема торговли. Другие выступают за культурную и политическую гегемонию, используя экономические рычаги для проецирования цивилизации Нусантары за пределы страны, интегрируя различные народы в постоянно расширяющуюся сферу влияния." #NT!
 nd_nus.12.a: "Постройте величайшую в мире торговую площадку" #NT!
 nd_nus.12.b: "Наше богатство должно проецировать нашу цивилизацию" #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_fleet_projection: "Доктрина проецирования флота" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_fleet_projection: "Военный флот Нусантары имеет постоянные базы в отдаленных водах, готовый в любой момент продемонстрировать мощь. Война дешева и решительна для тех, кто контролирует море." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_strait_hegemony: "Проливная гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_strait_hegemony: "Вместо того, чтобы силой патрулировать каждый морской путь, Нусантара использует свой контроль над узкими проходами в качестве дипломатического рычага, связывая материковые государства посредством разведывательных сетей и торговой зависимости." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_naval_supremacy: "Доктрина военно-морского превосходства" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_naval_supremacy: "Модернизация вооруженных сил Нусантары обеспечивает тактическое превосходство над любым соперником, хотя расходы на содержание таких сил отягощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_samudra_imperium: "Учреждения Самудры" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_samudra_imperium: "Постоянная сеть гарнизонов и военно-морских баз укрепляет морскую империю Нусантары, хотя стоимость империи увеличивает стоимость займов." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_spice_cartel: "Картель специй" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_spice_cartel: "Нусантара обеспечивает жесткую монополию на мировую торговлю специями, контролирует поставки, фиксирует цены и расширяет свое коммерческое присутствие на отдаленных рынках." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_open_emporium: "Открытый торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_open_emporium: "Порты Нусантары приветствуют торговцев всех наций, привлекая космополитическое население торговцев, поселенцев и наемников, хотя в этой атмосфере торговли военные становятся мягкими." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_world_market: "Всемирный рынок" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_world_market: "Пасар Дуния – это учреждение, не имеющее аналогов, постоянный рынок, куда все страны приходят для торговли. Архипелаг легко пропитывает себя, хотя содержание укреплений для защиты этого богатства обходится дорого." #NT!
 STATIC_MODIFIER_NAME_nd_nus_dest_spice_empire: "Империя специй" #NT!
 STATIC_MODIFIER_DESC_nd_nus_dest_spice_empire: "Экономическое превосходство становится культурной гегемонией. Богатство Нусантары способствует расширению цивилизационного влияния, интеграции различных народов и распространению культуры архипелага по всему региону." #NT!
 nd_nus_benteng_laut: "Бентенг Лаут" #NT!
 nd_nus_benteng_laut_desc: "Прибрежная военно-морская командная крепость, сочетающая в себе защиту гавани, якорную стоянку флота и гарнизонные помещения для проецирования морской власти Нусантары на дальние моря и проливы." #NT!
 nd_nus_benteng_laut_maintenance: "Содержание военно-морской крепости" #NT!
 nd_nus_benteng_laut_maintenance_desc: "Оружие, камень и военно-морские припасы для поддержания обороны, доков и гарнизона берегового командования." #NT!
 nd_nus_pasar_dunia: "Пасар Дуния" #NT!
 nd_nus_pasar_dunia_desc: "Мировой рынок — огромный постоянный торговый комплекс, где торговцы из всех стран сходятся, чтобы покупать и продавать самые желанные товары в мире. Высшее выражение экономического превосходства Нусантары." #NT!
 nd_nus_pasar_dunia_maintenance: "Операции на мировом рынке" #NT!
 nd_nus_pasar_dunia_maintenance_desc: "Бумага для контрактов и бухгалтерских книг, керамика для сосудов для хранения и прекрасная ткань для торговых витрин на большом мировом рынке." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_nus_bureaucracy_authority: "Императорская власть Нусантары" #NT!
 AUTO_MODIFIER_DESC_nd_nus_bureaucracy_authority: "Единое архипелажное государство может институционализировать практику, которая связывала Маджапахит, султанаты Пасисир и Матарам, в постоянные органы управления. Предоставляются два бюрократических места; столица добавляет треть." #NT!
  
 nus_pamget_tributary_bureaucracy: "Приточный аппарат Пэмгета" #NT!
 nus_pamget_tributary_bureaucracy_desc: "В реестре пальмовых листьев Негаракертагамы 1365 года, составленном придворным поэтом Мпу Прапанчей для короля Хаяма Вурука, перечислены внешние страны Манканагара и собственно острова Нусантара как градуированная мандала притоков. Каждый год послы доставляли в Троулан грузы золота, рабов, гвоздики и ароматного дерева; взамен внешние правители были вписаны в королевские реестры и утверждены на своих тронах. Система расширила сферу влияния Маджапахита от Малайского полуострова через Сулавеси до западной части Новой Гвинеи, но ее легкость (ежегодная дань, а не гарнизоны) означала, что королевская слабость в любом месте цепи вызывала восстание по всей ней." #NT!
  
 nus_sumpah_palapa_bureaucracy: "Придворный ритуал Сумпа Палапа" #NT!
 nus_sumpah_palapa_bureaucracy_desc: "Патих Гаджа Мада, вступивший в должность в 1336 году, поклялся перед мальчиком-королем Хаямом Вуруком, что не будет пробовать ни специй, ни палапы, пока архипелаг не будет объединен под властью Маджапахита. Клятва была закреплена на ежегодном фестивале Чайтра в Тровулане, где каждый принц Бхре и раджа-данник в придворных одеждах подтверждали свою верность, в то время как патих читал территориальную литанию Нусантара. Объединив индуистско-буддийскую королевскую церемонию со светской доктриной панархипелажного суверенитета, этот ритуал подчинил великих региональных царей единой ритуальной оси: краеугольному камню каждой последующей риторики Нусантары." #NT!
  
 nus_pasisir_confederation_bureaucracy: "Прибрежная конфедерация Пасисир" #NT!
 nus_pasisir_confederation_bureaucracy_desc: "Цепь портовых султанатов Северной Явы (Демак основал около 1475 года, затем Чиребон, Бантен, Тубан и Гресик), чьи начальники портов сяхбандары и магистраты бандаров управляли космополитическим населением яванских, малайских, хоккиенских, гуджаратских, арабских и бугисских торговцев. После свержения Маджапахита Демаком примерно в 1527 году пасисир имел политический вес на Яве. Свободный совет султанов координировал сопровождение конвоев, тарифные ставки и пятничные рынки, которые привлекали молуккскую торговлю пряностями к побережью Явы, причем власть принадлежала торговым султанам и известным торговцам-улемам, противостоящим старой внутренней аристократии." #NT!
  
 nus_wali_songo_bureaucracy: "Миссионерская сеть Вали Сонго" #NT!
 nus_wali_songo_bureaucracy_desc: "Девять святых Явы (Сунан Калиджага, Сунан Бонанг, Сунан Гири и их собратья) вплели ислам в яванскую культуру примерно с 1450 по 1550 год посредством кукольного театра ваянг, музыки гамелана и постепенного преобразования дворов Демака, Чиребона и Матарама. Они основали религиозные школы песантрен, сочинили сулукскую мистическую поэзию и построили гробницы-святыни, которые до сих пор привлекают паломников. Основанные ими духовные линии кьяи стали религиозной основой яванского ислама, но их популистское благочестие встревожило индуистско-буддийскую аристократию прияи, чьи суды определяли высокую культуру Явана на протяжении тысячи лет." #NT!
  
 nus_tumenggung_regency_bureaucracy: "Регентская система Туменггунг" #NT!
 nus_tumenggung_regency_bureaucracy_desc: "Султан Агунг Матарамский, правивший с 1613 по 1645 год, заменил старые кадетские княжества Бхре во внутренних районах Явана регентами туменггунг: назначенными короной чиновниками, набранными из королевских родственников и доверенных командиров сантри, которым было поручено получать провинциальные доходы, дорожную барщину и набор праджуритской пехоты для войн Матарама. Система перенесла административный вес вглубь страны от побережья Пасисира, навязала единую яванскую придворную культуру по всему центру страны и на короткое время сделала Матарам сильнейшей сухопутной державой на архипелаге, но она также отодвинула на второй план купеческих султанов, чье богатство финансировало обращение Явы в ислам." #NT!
  
 nus_kapitan_magistracy_bureaucracy: "Капитан Этническая магистратура" #NT!
 nus_kapitan_magistracy_bureaucracy_desc: "В Малакке, Бантене, Ачехе, Макассаре и Пасисире Матарам султан назначал капитана (капитана от португальского capitão), который управлял каждой иностранной или немусульманской общиной в соответствии с ее собственным обычным правом. Капитан Сина возглавлял хоккиенские и кантонские кварталы; Капитан Клинг выступал от имени тамильских и гуджаратских торговцев; Капитан Бугис возглавлял поселенцев-мигрантов в немалайских судах. Капитан регистрировал рождения, улаживал споры, собирал подушный налог и отвечал за свою общину перед шахбандаром: своеобразным архипелажным институтом, который освобождал султана от прямого управления диаспорами, привязывая их богатство к трону." #NT!
