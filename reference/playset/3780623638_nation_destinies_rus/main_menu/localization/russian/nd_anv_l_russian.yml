l_russian:
  # === Formation Event === 
 nd_anv.1.t: "Корона двух королевств" #NT!
 nd_anv.1.d: "От суровых скал Нортумбрии до нагретых солнцем виноградников Гаронны, львы Плантагенетов теперь правят одним домом владений. Наследство Генриха, полученное в результате наследства, брака и завоеваний, бросает вызов любой карте христианского мира: империя, которая не знает языка и не отвечает ни перед кем.\n\nТем не менее, Анжуйская империя не является королевством в любом общепринятом смысле этого слова. В Лондоне говорят на грубом английском языке саксонских графств; Руан и Кан говорят на langue d'oil нормандских баронов; Пуатье и Бордо поют трубадуров на окситанском языке; Анже подчиняется анжуйскому стюарду; Дублин и Уэксфорд отвечают норманнскому лорду через валлийских марширующих капитанов. Чтобы управлять всеми ими, король должен выбрать, как он будет править.\n\nНекоторые при дворе призывают к созданию королевства одного закона: королевского указа, королевской скамьи, Вестминстерского казначейства, простирающегося через Ла-Манш, короны, которая сводит обычаи к единому общему праву. Другие, возглавляемые великими баронами Нормандии, Аквитании и Марки, призывают к созданию феодальной федерации: король как верховный сюзерен среди пэров, его королевство — это гобелен феодальных судов, турниров и добровольных почестей.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_anv.1.a: "Один король, один закон, один указ через Ла-Манш." #NT!
 nd_anv.1.b: "Конфедерация баронов под рыцарской короной" #NT!
  
  # === Formation Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_anv_common_law_crown: "Общее право Короны" #NT!
 STATIC_MODIFIER_DESC_nd_anv_common_law_crown: "Королевские указы, судьи Эйра и Вестминстерское казначейство объединяют герцогства в единую юрисдикцию. Таможня подчиняется королевскому закону." #NT!
 STATIC_MODIFIER_NAME_nd_anv_chivalric_confederation: "Рыцарская Конфедерация" #NT!
 STATIC_MODIFIER_DESC_nd_anv_chivalric_confederation: "Король правит как сюзерен среди магнатов. Турниры, клятвы дани и феодальные войска делают это королевство грозным в вооружении, даже несмотря на то, что оно остается лоскутным одеялом обычаев." #NT!
  
  # === DHE Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_anv_assize_clarendon: "Присяга Кларендона" #NT!
 STATIC_MODIFIER_DESC_nd_anv_assize_clarendon: "Королевские дворы циркулируют по королевству; Присяжные выявляют скрытых злоумышленников. Порядок путешествует вместе с королевскими судьями." #NT!
 STATIC_MODIFIER_NAME_nd_anv_constitutions_clarendon: "Конституции Кларендона" #NT!
 STATIC_MODIFIER_DESC_nd_anv_constitutions_clarendon: "Духовенство, нарушающее королевский мир, сталкивается с королевским законом. Корона выступает против привилегий Церкви." #NT!
 STATIC_MODIFIER_NAME_nd_anv_courts_of_love: "Суды любви" #NT!
 STATIC_MODIFIER_DESC_nd_anv_courts_of_love: "Двор Элеоноры в Пуатье меняет нравы христианского мира. Трубадуры, романтика и куртуазная любовь преображают рыцарский идеал." #NT!
 STATIC_MODIFIER_NAME_nd_anv_great_charter: "Великая Хартия" #NT!
 STATIC_MODIFIER_DESC_nd_anv_great_charter: "Раннимид предоставил хартию свобод. Бароны клянутся в верности в обмен на письменные ограничения королевского произвола." #NT!
 STATIC_MODIFIER_NAME_nd_anv_baronial_reaction: "Баронская реакция" #NT!
 STATIC_MODIFIER_DESC_nd_anv_baronial_reaction: "Корона твердо сопротивляется требованиям баронов. Королевская власть сохраняется ценой обиженной аристократии." #NT!
  
  # === Advances: Age 1 Traditions === 
 nd_anv_exchequer_of_westminster: "Казначейство Вестминстера" #NT!
 nd_anv_exchequer_of_westminster_desc: "Трубочные валки и клетчатая ткань: казначейство Роджера Солсберийского превратило королевские счета в самый сложный финансовый инструмент в Европе двенадцатого века." #NT!
 nd_anv_assize_courts: "Суды присяжных и королевские судьи" #NT!
 nd_anv_assize_courts_desc: "Реформы Генриха II заставили королевских судей оседлать королевство. Споры по поводу земли, убийств и воровства теперь доходят до короны, а не рассеиваются в сеньорских палатах." #NT!
 nd_anv_marcher_castles: "Замки Марчер" #NT!
 nd_anv_marcher_castles_desc: "Цепи каменных крепостей вдоль валлийских границ и нормандской границы. Концентрическое укрепление, принесенное с Востока Плантагенетами и их норманнскими инженерами." #NT!
 nd_anv_welsh_archers: "Валлийские лучники на королевской службе" #NT!
 nd_anv_welsh_archers_desc: "Лучники из Гвинта и Поуиса заключили королевский контракт со времен валлийских кампаний. Стрелы с черным оперением, пронзающие французскую кольчугу на каждом поле Плантагенетов." #NT!
 nd_anv_norman_chivalry: "Нормандское рыцарство" #NT!
 nd_anv_norman_chivalry_desc: "Конные воины в длинных кольчугах, отпрыски нормандской аристократии-завоевателя. Ударная рука хозяина Плантагенета." #NT!
 nd_anv_forest_law: "Лесное право" #NT!
 nd_anv_forest_law_desc: "Королевские леса, обширные заповедники, находящиеся под прямой юрисдикцией короны. Вердереры, рефереры и суровые лесные дворы приносят ненавистные доходы и беспрецедентные королевские владения." #NT!
  
  # === Advances: Age 2 Renaissance === 
 nd_anv_brabancons_routiers: "Брабансоны и Рутье" #NT!
 nd_anv_brabancons_routiers_desc: "Роты фламандских и низинных наемников, сражавшиеся за Анжуйского покупателя, предложившего самую высокую цену. Дисциплинированный, профессиональный и внушающий страх, передовой край армии Плантагенетов." #NT!
 nd_anv_gascon_crossbowmen: "Гасконские арбалетчики" #NT!
 nd_anv_gascon_crossbowmen_desc: "Арбалетные ополчения Бордо, Байонны и гасконьских портов. Пешие арбалетчики, прикрывавшие винный флот и удерживавшие южные марши." #NT!
 nd_anv_courtly_love: "Куртуазная любовь и трубадуры" #NT!
 nd_anv_courtly_love_desc: "Двор Элеоноры Аквитанской в ​​Пуатье: Мария де Франс, Бернар де Вентадорн, Кретьен де Труа. Рыцарский роман усовершенствовался и распространился по всему христианскому миру." #NT!
 nd_anv_winchester_assize: "Присяга по оружию" #NT!
 nd_anv_winchester_assize_desc: "Гербовая ассиза 1181 года: каждый свободный человек должен быть экипирован согласно своему сословию. Основа национальной милиции на три столетия раньше любой другой." #NT!
 nd_anv_bordeaux_wine_trade: "Бордо Винная Торговля" #NT!
 nd_anv_bordeaux_wine_trade_desc: "Флоты, которые доставляют гасконский кларет из Бордо в Лондон, — торговля, охватывающая Ла-Манш, которая связывает Аквитанию с английской короной не только клятвой, но и серебром." #NT!
 nd_anv_cinque_ports: "Конфедерация пяти портов" #NT!
 nd_anv_cinque_ports_desc: "Гастингс, Сэндвич, Дувр, Ромни, Хайт: города поклялись предоставить королю корабли в обмен на хартии самоуправления. Флот Ла-Манша по феодальному контракту." #NT!
  
  # === Advances: Age 3 Discovery === 
 nd_anv_charter_towns: "Чартерные города и бургомистры" #NT!
 nd_anv_charter_towns_desc: "Генрих II и его сыновья предоставляют городские права по всему королевству. Самоуправляющиеся купеческие коммуны под королевской защитой, рассадник городской свободы." #NT!
 nd_anv_long_bowmen: "Тактика массового использования длинного лука" #NT!
 nd_anv_long_bowmen_desc: "Доктрина обстрела наступающей кавалерии, отработанная при Фолкерке, была усовершенствована при Креси. Дисциплинированный лучник с длинным луком в глубоких рядах." #NT!
 nd_anv_aquitanian_estates: "Поместья Аквитании" #NT!
 nd_anv_aquitanian_estates_desc: "Обычные парламенты Бордо, Пуатье и Сента, где гасконская знать, прелаты и горожане соглашались на герцогское налогообложение. Конституционный прецедент." #NT!
 nd_anv_chancellors_writ: "Приказ канцлера" #NT!
 nd_anv_chancellors_writ_desc: "Стандартизированный королевский приказ действует по всей Англии и герцогствам. Бюрократия Королевской канцелярии становится основой управления за Ла-Маншем." #NT!
 nd_anv_anglo_norman_ships: "Винтики Анжуйского канала" #NT!
 nd_anv_anglo_norman_ships_desc: "Клинкерные винтики Ла-Манша Сэндвича и Руана, рабочие лошадки талассократического торгового флота, перевозящие английскую шерсть, гасконское вино и норманнскую сельдь." #NT!
 nd_anv_writ_of_summons: "Приказ о вызове" #NT!
 nd_anv_writ_of_summons_desc: "Магнаты, созванные поименно для участия в королевском совете. Семя парламентской традиции, которая переживет само Анжуйское государство." #NT!
  
  # === Advances: Age 4 Reformation === 
 nd_anv_anglo_norman_law_schools: "Англо-нормандские юридические школы" #NT!
 nd_anv_anglo_norman_law_schools_desc: "Судебные гостиницы и юридические факультеты Кана и Анжера, юриспруденция, преподаваемая на латыни и англо-нормандском языке, готовят магистратов двух корон." #NT!
 nd_anv_calais_staple: "Основа шерсти" #NT!
 nd_anv_calais_staple_desc: "Вся сырая английская шерсть проходила через единую королевскую штапель, запечатывалась и облагалась налогом, прежде чем попасть на ткацкие станки Фландрии. Самая прибыльная монополия короны." #NT!
 nd_anv_garrisons_pale: "Гарнизоны Белой черты" #NT!
 nd_anv_garrisons_pale_desc: "Маршевые капитаны и королевские гарнизоны держат Ирландию, Валлийское княжество и норманнскую границу как цепочку укрепленных округов под управлением наместников." #NT!
 nd_anv_great_council: "Великий Совет" #NT!
 nd_anv_great_council_desc: "Magnum concilium магнатов и прелатов, постоянный анжуйский консультативный орган, который со временем дает начало парламенту и Генеральным штатам." #NT!
  
  # === Advances: Age 5 Absolutism === 
 nd_anv_admiralty_at_arms: "Адмиралтейство под оружием" #NT!
 nd_anv_admiralty_at_arms_desc: "Единое адмиралтейство Плантагенетов: эскадры Ла-Манша, конвои Бискайского залива, патрули Ирландского моря. Единый флот для двух королевств, разделенных соленой водой." #NT!
 nd_anv_garde_du_roi: "Гард-дю-Руа" #NT!
 nd_anv_garde_du_roi_desc: "Королевские дворовые войска: господа пенсионеры, йомены гвардии, дворовая кавалерия. Постоянное ядро ​​профессиональных солдат, преданных только короне." #NT!
 nd_anv_two_jurisdictions: "Две юрисдикции, одна корона" #NT!
 nd_anv_two_jurisdictions_desc: "Английское общее право на острове, писанное гражданское право в герцогствах, преднамеренная асимметричная юриспруденция, которая уважает обычаи, сохраняя при этом суверенную целостность." #NT!
 nd_anv_atlantic_woollens: "Атлантическая шерсть" #NT!
 nd_anv_atlantic_woollens_desc: "Английское сукно сотканное, валяное и окрашенное дома, больше не экспортируется в сыром виде. Вертикальная интеграция текстильной экономики Плантагенетов." #NT!
  
  # === Advances: Age 6 Revolutions === 
 nd_anv_redcoat_drill: "Красная мундирная дрель" #NT!
 nd_anv_redcoat_drill_desc: "Натренированная линия мушкетов и штыков красного цвета, дисциплинированный залповый огонь анжуйских регулярных войск, усиленный англо-нормандскими офицерскими школами." #NT!
 nd_anv_rule_at_sea: "Правило на море" #NT!
 nd_anv_rule_at_sea_desc: "Деревянные стены Ла-Манша, Атлантики и Средиземного моря, доктрина линейного корабля, которая делает анжуйский флаг хозяином трех морей одновременно." #NT!
 nd_anv_constitutional_fusion: "Конституциональный синтез" #NT!
 nd_anv_constitutional_fusion_desc: "Двухпалатное собрание лордов и общин, заседающее поочередно в Вестминстере и Руане, ратифицирует письменную конституцию, связывающую корону, пэров и народ." #NT!
  
  # === DHE Events === 
 nd_anv.2.t: "Присяга Кларендона" #NT!
 nd_anv.2.d: "На совете Кларендона Генри созвал епископов, баронов и королевских судей в охотничий домик в Уилтшире. Клетчатое полотно казначейства развернуто. Судьям в Эйре поручено управлять государством: присяжными присяжными расследовать скрытые убийства, грабежи и похитителей злоумышленников. С этого часа закон Короля действует там, где действует приказ Короля.\n\nЗа последнее поколение ни один королевский двор не проник так глубоко в графства; на протяжении столетия никакое королевское правосудие не связало герцогства континента единой судебной практикой. Судьи разъезжаются по своим местам до того, как догорят свечи." #NT!
 nd_anv.2.a: "Пусть закон короля проникнет в каждый графство" #NT!
  
 nd_anv.3.t: "Конституции Кларендона" #NT!
 nd_anv.3.d: "Генрих призвал своих епископов записать обычаи правления своего деда. Конституции возвращаются, чтобы увенчать суд над клерками, совершившими уголовные преступления, обращение епископов в Рим только с королевского разрешения, голос короля при выборах прелатов. Томас Беккет поставил свою печать, а затем забрал ее обратно.\n\nСсора между алтарем и троном - давняя проблема в латинском христианском мире, но ни один король до Генриха не осмеливался так явно кодифицировать привилегии короны против иммунитетов церкви. Где теперь находится преимущество короля?" #NT!
 nd_anv.3.a: "Нажимайте на указ короны: король назначает прелатов так же, как он делает графов" #NT!
 nd_anv.3.b: "Заключите конкордат: король, который побеждает Церковь, выигрывает все" #NT!
 STATIC_MODIFIER_NAME_nd_anv_clarendon_press: "Эрастийская Корона" #NT!
 STATIC_MODIFIER_DESC_nd_anv_clarendon_press: "Корона утверждает себя над прелатством. Епископы – царские офицеры в митре." #NT!
 STATIC_MODIFIER_NAME_nd_anv_clarendon_concord: "Конкордат Кларендона" #NT!
 STATIC_MODIFIER_DESC_nd_anv_clarendon_concord: "Король и Церковь говорят в один голос. Духовенство проповедует корону." #NT!
  
 nd_anv.4.t: "Суд в Пуатье" #NT!
 nd_anv.4.d: "Элеонора (королева Англии, герцогиня Аквитанская, графиня Пуату) перевезла свою семью в свой город Пуатье. Вокруг нее собираются трубадуры юга: Бернар де Вентадорн, изысканная Мария де Франс, молодой Кретьен де Труа. Они поют о #italic fin amor#!: о возвышенной, почти ритуальной любви между рыцарем и дамой, которая подчиняет феодальное насилие куртуазной грации.\n\nРыцарская культура Пуатье отправится обратно через Ла-Манш вместе с камергерами и менестрелями королевы. Из этого двора родятся цикл «Артур и Святой Грааль», правила турнира, сам словарь романтики. Мир феодально-христианского мира учтиво переделывается." #NT!
 nd_anv.4.a: "Совершенствуйте наше рыцарство: рыцарство, как того хотела бы королева" #NT!
  
 nd_anv.5.t: "Раннимид" #NT!
 nd_anv.5.d: "На лугу в Раннимиде, между Виндзором и Стейнсом, король встретил собравшихся с оружием в руках баронов королевства. После Бувина и потери Нормандии магнаты больше не будут принуждены; они составили хартию свобод: шестьдесят три пункта, гарантирующие баронский совет, привилегии церкви, лондонские обычаи, свободу торговцев и законное суждение пэров.\n\nДарит ли корона хартию, примет ли пределы своих прерогатив и привяжет ли магнатов к вере? Или он сделает ставку на королевское оружие, выступит против требований и подвергнет империю испытанию войной?" #NT!
 nd_anv.5.a: "Установите печать в Раннимиде." #NT!
 nd_anv.5.b: "Отвергни устав: корона сама себе мера" #NT!
  
 nd_anv.6.t: "Битва за Ла-Манш" #NT!
 nd_anv.6.d: "У скал Южного Форленда анжуйский флот Пяти Портов встретил врага в узком море. Когти Сэндвича и Хайта, черные паруса на фоне осеннего неба, гонят вражеские корабли в белый меловой прибой. Отныне Ла-Манш принадлежит анжуйскому адмиралу.\n\nНи один король Запада не владел обоими берегами Узкого моря со времен римлян. Теперь соленая вода, которая когда-то разделяла царство Плантагенетов, становится его внутренней магистралью." #NT!
 nd_anv.6.a: "Овладейте Ла-Маншем: пусть шерстяной флот плавает беспрепятственно" #NT!
  
 nd_anv.7.t: "Шерстяная мастерская в Кале" #NT!
 nd_anv.7.d: "По королевскому указу ни одно руно английской шерсти не может попасть на ткацкие станки Фландрии, кроме как через королевскую штапельную продукцию. Запечатанные тюки облагаются налогом в кассе скобяного товара; цену на шерсть устанавливают королевские купцы; Доходы короны от шерсти в хорошие годы превышают все остальные королевские доходы вместе взятые.\n\nФламандские ткачи ворчат. Итальянские банкиры предоставляют дальнейшие кредиты под залог основного продукта. Английские портные постепенно начинают ткать шерсть дома. Кошелек Плантагенета еще никогда не был таким тяжелым." #NT!
 nd_anv.7.a: "Шерсть Англии, серебро Фландрии." #NT!
  
  # === Custom Buildings === 
 nd_anv_exchequer_hall: "Казначейство" #NT!
 nd_anv_exchequer_hall_desc: "Клетчатая ткань, рулоны трубок и повестки о повестке дня. Королевские счета рассчитываются по счетчикам на клетчатом столе; шерифы представляют свои фермы королевским баронам дважды в год." #NT!
 nd_anv_concentric_castle: "Концентрический замок" #NT!
 nd_anv_concentric_castle_desc: "Концентрические стены, фресковые башни, задние ворота и огромный донжон — замок Плантагенетов, усовершенствованный в Дувре, Шато Гайяр и Бомарис. Самые грозные укрепления Европы двенадцатого века." #NT!
 nd_anv_assize_court: "Суд присяжных" #NT!
 nd_anv_assize_court_desc: "Королевский зал, где королевские судьи рассматривают дела о земле, убийствах и посягательствах на чужие владения. Правосудие короны, принесенное в графство приказом и печатью." #NT!
 nd_anv_chivalric_tournament_field: "Поле рыцарского турнира" #NT!
 nd_anv_chivalric_tournament_field_desc: "Списки, шатры, герольды в гербах. Лицензированная площадка для турниров, где рыцарство королевства тренируется в оружии и соревнуется за честь и выкуп." #NT!
 nd_anv_chartered_borough: "Чартерный Боро" #NT!
 nd_anv_chartered_borough_desc: "Самоуправляющийся город, подчиняющийся королевской хартии, со своей собственной торговой гильдией, двором пирогов и городской фермой. Горожане платят корону напрямую вместо сеньоральных пошлин." #NT!
 nd_anv_gascon_winery: "Гасконская винодельня" #NT!
 nd_anv_gascon_winery_desc: "Виноградники Гаронны и Дордони: Бордо, Сент-Эмильон, Каор. Кларет и красное вино востребованы на рынке Ла-Манша и во дворах западного христианского мира." #NT!
 nd_anv_cinque_port_yard: "Чинкве Портовый Двор" #NT!
 nd_anv_cinque_port_yard_desc: "Зафрахтованный порт конфедерации пяти портов, поклявшийся предоставлять королю винтики и экипажи в обмен на самоуправление и адмиралтейский суд." #NT!
 nd_anv_anglo_norman_law_school: "Англо-нормандская юридическая школа" #NT!
 nd_anv_anglo_norman_law_school_desc: "Гостиница при суде или на юридическом факультете, где параллельно преподают общее право Англии и обычное право Нормандии. Магистраты двойного царства Плантагенетов обучались под одной крышей." #NT!
  
  # === PM Loc === 
 nd_anv_exchequer_upkeep: "Учет рулонов труб" #NT!
 nd_anv_exchequer_upkeep_desc: "Жетоны, рулоны трубок, пергамент, воск и зарплата кассиров." #NT!
 nd_anv_concentric_castle_upkeep: "Обслуживание гарнизона замка" #NT!
 nd_anv_concentric_castle_upkeep_desc: "Камень для ремонта, оружие для стражи, еда для гарнизона и зарплата констеблям и сержантам." #NT!
 nd_anv_assize_court_upkeep: "Заседания суда присяжных" #NT!
 nd_anv_assize_court_upkeep_desc: "Воск для печатей, бумага для свитков с заявлениями о признании вины, гостеприимство для королевских судей, разъезжающих по округе." #NT!
 nd_anv_tournament_upkeep: "Патронаж турнира" #NT!
 nd_anv_tournament_upkeep_desc: "Содержание рыцарского зрелища: шатры, знамена, вооружение, прекрасная ткань для сюрко и ливреи герольдов." #NT!
 nd_anv_chartered_borough_upkeep: "Общие сборы района" #NT!
 nd_anv_chartered_borough_upkeep_desc: "Расходы горожанской коммуны: мощение, регулирование рынка, охрана и охрана, а также сбор королевской фермы." #NT!
 nd_anv_gascon_wine_production: "Гасконское вино Винтаж" #NT!
 nd_anv_gascon_wine_production_desc: "Прессование винограда Гаронны: вино для флотов Ла-Манша и дворов христианского мира." #NT!
 nd_anv_cinque_port_yard_upkeep: "Принадлежности для двора и веревки" #NT!
 nd_anv_cinque_port_yard_upkeep_desc: "Военно-морские припасы, пиломатериалы и снасти для винтиков эскадры «Пять портов»." #NT!
 nd_anv_law_school_upkeep: "Стипендия юридического факультета" #NT!
 nd_anv_law_school_upkeep_desc: "Книги, бумага и стипендии врачей общего и обычного права." #NT!
  
  # === Custom Units === 
 a_nd_anv_welsh_archers: "Валлийские лучники" #NT!
 a_nd_anv_welsh_archers_desc: "Лучники Гвинта и Поуиса, воспитанные по контракту Плантагенета. Их стрелы длиной в ярд с черным оперением пробивают кольчугу и уничтожают кавалерийские атаки." #NT!
 a_nd_anv_norman_chivalry: "Норман Найтс" #NT!
 a_nd_anv_norman_chivalry_desc: "Конные воины в длинных кольчугах, потомки норманнских завоевателей. Ударная рука хозяина Плантагенета." #NT!
 a_nd_anv_brabancons: "Брабансоны" #NT!
 a_nd_anv_brabancons_desc: "Фламандская и Брабантская наемная пехота, нанятая короной. Дисциплинированный, профессиональный и внушающий страх от Уэльса до Лимузена." #NT!
 a_nd_anv_gascon_crossbowmen: "Гасконские арбалетчики" #NT!
 a_nd_anv_gascon_crossbowmen_desc: "Арбалетные ополчения Бордо, Байонны и гасконьских портов. Дисциплинированная городская пехота удерживает южные марши." #NT!
 a_nd_anv_longbowmen: "Плантагенеты с длинными лучниками" #NT!
 a_nd_anv_longbowmen_desc: "Массированная пехота с длинными луками, обученная по королевскому контракту, дисциплинированный штурм войск Плантагенетов. Ужас французского рыцарства, начиная с Креси." #NT!
 a_nd_anv_household_cavalry: "Домашняя кавалерия" #NT!
 a_nd_anv_household_cavalry_desc: "Господа пенсионеры и йомены гвардии, постоянная домашняя лошадь короля, кольчуга по последнему слову техники и верная только короне." #NT!
 n_nd_anv_channel_cog: "Шестерня канала" #NT!
 n_nd_anv_channel_cog_desc: "Клинкерный зубец Ла-Манша в Сэндвиче и Руане, широкий в лучах и высокий с боков. Рабочая лошадка торгового флота Плантагенетов." #NT!
 n_nd_anv_great_ship: "Великий линейный корабль" #NT!
 n_nd_anv_great_ship_desc: "Первоклассный линейный корабль Анжуйского адмиралтейства с бортовым вооружением, построенный для господства в узких морях и Бискайском заливе." #NT!
  
  # === Levies === 
 levy_nd_anv_welsh_archers: "Валлийские лучники" #NT!
 levy_nd_anv_welsh_archers_desc: "Сбор за длинные луки, собранный в графствах Уэльса." #NT!
 levy_nd_anv_norman_chivalry: "Норман Найтс" #NT!
 levy_nd_anv_norman_chivalry_desc: "Набор тяжелой кавалерии из нормандской аристократии с обоих берегов Ла-Манша." #NT!
 levy_nd_anv_gascon_crossbowmen: "Гасконские арбалетчики" #NT!
 levy_nd_anv_gascon_crossbowmen_desc: "Городской арбалетный сбор из гасконьских портов и бастид." #NT!
 levy_nd_anv_longbowmen: "Плантагенеты с длинными лучниками" #NT!
 levy_nd_anv_longbowmen_desc: "Обученный массовый набор луков из английских графств." #NT!
  
  # === Variable tooltips === 
 nd_anv_formed_tt: "Анжуйская империя образовалась" #NT!
 nd_anv_path_a_tt: "Выбран путь общего права Короны" #NT!
 nd_anv_path_b_tt: "Выбран путь Рыцарской Конфедерации" #NT!
  
  # === Age 6 industrial advance === 
 nd_anv_industrial_plantagenet: "Промышленный Плантагенет" #NT!
 nd_anv_industrial_plantagenet_desc: "Железо Уэльских маршей, уголь Черной страны, водяные мельницы вдоль каждой реки. Доминионы Плантагенетов вступили в индустриальную эпоху с железом и паром." #NT!
  
  # === Destiny Tree === 
 nd_anv_destiny: "Долгий путь Плантагенета" #NT!
 nd_anv_destiny_desc: "Корона Двух Царств связана наследственностью, но ее долгая судьба еще не определена. Повернёт ли царство Плантагенетов на запад, к соленому морю и Британским островам, или на юг и восток, в сердце Франции? Выбор, сделанный при формировании, теперь требует программы." #NT!
  
  # Path A: Insular Atlantic Power 
 nd_anv_dest_isles_pacified: "Умиротворение Британских островов" #NT!
 nd_anv_dest_isles_pacified_desc: "Общее право не может действовать там, где не действуют королевские указы. Приведите Лотиан и Мюнстер под юрисдикцию Плантагенетов, усмирите Эдинбург и Корк и свяжите весь архипелаг под единой короной." #NT!
 nd_anv_dest_narrow_seas: "Хозяйка Узких морей" #NT!
 nd_anv_dest_narrow_seas_desc: "Удерживайте Ла-Манш от пяти портов до фламандского побережья: возьмите Антверпен и Дюнкерк, два якоря торговли тканями, и убедитесь, что ни один флот не пройдет между ними, не заплатив пошлину королю Англии. Постройте военный сундук и развивайте богатство королевства." #NT!
 nd_anv_dest_atlantic_crown: "Атлантическая Корона" #NT!
 nd_anv_dest_atlantic_crown_desc: "Посадите леопардов Англии на островах Атлантики. Возьмите Мадейру и Азорские острова, примите участие в институтах глобальной торговли и создайте адмиралтейство, эскадры которого простираются по глубокому океану от ядра Чинкве-Портс до Саргассова моря." #NT!
  
  # Path B: Continental Plantagenet 
 nd_anv_dest_lost_duchies: "Верните утраченные герцогства" #NT!
 nd_anv_dest_lost_duchies_desc: "Турень и Мэн принадлежали Генриху по праву его отца, проигранные Капету при Бувине. Восстановите Тур и Ле-Ман и восстановите сердце анжуйского наследия." #NT!
 nd_anv_dest_empire_of_loire: "Империя Луары" #NT!
 nd_anv_dest_empire_of_loire_desc: "Возьмите сам Париж и королевский город Орлеан. Вызовите армию из пятидесяти тысяч рыцарей, сержантов и рутьеров и доведите мощь королевства до уровня, достойного императора Запада." #NT!
 nd_anv_dest_crown_christendom: "Корона христианского мира" #NT!
 nd_anv_dest_crown_christendom_desc: "Тулуза, Дижон, Реймс: Лангедок, центр Бургундии и город коронации французских королей. Выставьте войско Плантагенетов, с которым не сможет сравниться ни одна континентальная держава. Возглавьте рыцарскую империю, которая унижает каждого соседа." #NT!
  
  # === Destiny Events === 
 nd_anv.8.t: "Королевская произвольная программа" #NT!
 nd_anv.8.d: "Канцелярия подготовила длинный меморандум о перспективах царства Плантагенетов. Все высказали свои советы на ближайшие годы: клерки Вестминстера, прелаты Руана, сенешали Аквитании.\n\nКороль уходит в отставку со своими ближайшими советниками, чтобы взвесить, чем Корона Двух Королевств будет заниматься помимо непосредственных забот об управлении государством. Длинная программа, написанная собственноручно королем и скрепленная львами, занимает свое место в архиве канцелярии Вестминстера." #NT!
 nd_anv.8.a: "Направьте львов на долгий путь" #NT!
  
 nd_anv.9.t: "Умиротворение островов" #NT!
 nd_anv.9.d: "Лотиан подчинилась приказу короля; Окружность лорда-юстициара теперь простирается до Мюнстера. От скал мыса Гнева до атлантических гаваней Корка одна и та же королевская печать удостоверяет хартию, одни и те же судьи в стране выслушивают заявления о нарушении границ, на рынках течет одна и та же монета.\n\nБританские острова больше не представляют собой запутанный клубок границ. Это одно царство, связанное одним общим законом под единой короной." #NT!
 nd_anv.9.a: "Один архипелаг, одна корона" #NT!
  
 nd_anv.10.t: "Узкие моря" #NT!
 nd_anv.10.d: "От Южного Форленда до дюн Фландрии, от Сэндвича до Антверпена — узкое море теперь превратилось в озеро Плантагенетов. Зубцы Чинкве-Портс беспрепятственно конвоируют флот шерсти; Королевский адмирал взимает пошлину с каждого когге Ганзы, идущего вдоль пролива.\n\nКогда-то Канал был границей с соленой водой, разделявшей царство Плантагенетов. Теперь это его внутреннее шоссе. Как Корона распорядится своим адмиралтейством?" #NT!
 nd_anv.10.a: "Создайте эскадрильи Королевского канала." #NT!
 nd_anv.10.b: "Поднимите главный продукт Кале до королевской монополии" #NT!
  
 nd_anv.11.t: "За пределами западных подходов" #NT!
 nd_anv.11.d: "Леопарды теперь порхают на снастях каравелл, стоящих в гавани Фуншала; серебро и золото Азорской торговли стекается в бристольскую таможню. Институты глобальной торговли укоренились в Вестминстере и Руане. Адмиралтейство Плантагенетов управляет морской империей, размеры которой не мог себе представить ни один средневековый король.\n\nПри таких масштабах приходится трудный выбор. Будет ли король строить глубоководный боевой флот на западных подходах или сплести сеть торговых фабрик вдоль Атлантического побережья?" #NT!
 nd_anv.11.a: "Глубоководный боевой флот" #NT!
 nd_anv.11.b: "Сеть торговых фабрик" #NT!
  
 nd_anv.12.t: "Сердце Анжу восстановлено" #NT!
 nd_anv.12.d: "Тур, город Сен-Мартен; Ле-Ман, город рождения Генриха. Анжуйское наследие (Турень и Мэн, сердце наследия Плантагенетов) возвращено семейной линии.\n\nКоролевский герольд читает дань уважения на трёх языках. Колокола каждой приходской церкви звонят от Анже до Ренна. Рыцарство королевства едет на север от Бордо и на юг от Кана на турнир, проводимый самим королем в Ле-Мане." #NT!
 nd_anv.12.a: "По праву наследования и оружию" #NT!
  
 nd_anv.13.t: "Париж и Орлеан" #NT!
 nd_anv.13.d: "Иль-де-ла-Сите, Собор Парижской Богоматери, Сент-Шапель. Орлеан на Луаре, сердце королевской Франции. Наследие Капетингов находится в руках Плантагенетов; Король Франции — пленник Плантагенета, его вассал или беглец.\n\nНи один король Запада не владел обеими коронами со времен Карла Великого. Должны ли Плантагенеты навсегда смирить род Капетов или сохранить долину Луары как рыцарский двор, где великие вассалы королевства воздают должное в манере Элеоноры?" #NT!
 nd_anv.13.a: "Смирите Капета: лишите короны Франции" #NT!
 nd_anv.13.b: "Двор Луары, палатины и почтение" #NT!
  
 nd_anv.14.t: "Корона христианского мира" #NT!
 nd_anv.14.d: "От Тулузы в Лангедоке до Дижона в Бургундии и коронационного города Реймса король правит как сюзерен Запада. Леопарды стоят рядом с орлом Империи как равные, а возможно, и как высшие силы. Рыцарство трех корон движется под знаменем Плантагенетов.\n\nЭто империя оружия, военная империя Плантагенетов, которая унижает каждую континентальную державу, или феодальное господство небных вассалов, скрепленных клятвами почтения и турнирами, проводимыми в руках короля?" #NT!
 nd_anv.14.a: "Император Запада силой оружия" #NT!
 nd_anv.14.b: "Феодальное владение небным почитанием" #NT!
  
  # === Destiny Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_anv_dest_channel_admiralty: "Канал Адмиралтейство" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_channel_admiralty: "Объединенные эскадрильи Сэндвича, Портсмута и Гавра. Корабли и галеры двух побережий под командованием одного лорда-верховного адмирала." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_staple_monopoly: "Основная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_staple_monopoly: "Все это проходит через королевские товары: английскую шерсть, гасконское вино, фландрийскую ткань. Купцы короны установили цены трех королевств." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_western_approaches: "Западные подходы" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_western_approaches: "Линейные эскадрильи простираются от Бреста до Бискайского залива и далее. Флаг Плантагенета — хозяин глубин океана, хотя марши армии становятся все длиннее." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_atlantic_factories: "Атлантические Фабрики" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_atlantic_factories: "Торговые фабрики в Фуншале, Понта-Делгада и на Кабо-Вердесе. Купцы-плантагенеты используют атлантические поставки рабов, сахара и золота." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_capet_humbled: "Капет смирился" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_capet_humbled: "Королевская геральдическая лилия лежит в пыли в Вестминстере. Хозяин Плантагенетов движется с импульсом кампании, которую невозможно остановить." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_loire_courts: "Суды Луары" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_loire_courts: "Долина Луары становится дворцом небной дани. Великие вассалы королевства присягают на верность, как в Пуатье, хотя горожане ворчат, что их игнорируют." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_western_imperator: "Император Запада" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_western_imperator: "Помазанный в Реймсе, Плантагенет стоит рядом с императором Священной Римской империи как равный. Рыцарство Запада идет под его знаменем." #NT!
 STATIC_MODIFIER_NAME_nd_anv_dest_palatines_homage: "Посвящение Палатинам" #NT!
 STATIC_MODIFIER_DESC_nd_anv_dest_palatines_homage: "Небные графы Тулузы, Бургундии и Лангедока кланяются при дворе короля. Их рекруты и сокровища текут в Вестминстер медленными, но неумолимыми темпами." #NT!
  
  # === Destiny Buildings === 
 nd_anv_dest_admiralty_house: "Адмиралтейский дом" #NT!
 nd_anv_dest_admiralty_house_desc: "Резиденция лорда-верховного адмирала: сухие доки, продовольственные склады, парусные чердаки и военно-морское ведомство. На подходе объединенное адмиралтейство Плантагенетов с эскадрами Ла-Манша, Бискайского залива и Атлантики." #NT!
 nd_anv_dest_admiralty_upkeep: "Операции Адмиралтейского двора" #NT!
 nd_anv_dest_admiralty_upkeep_desc: "Военно-морские припасы, пиломатериалы, деготь и инструменты для королевских доков и продовольственных складов." #NT!
 nd_anv_dest_chivalric_palatinate: "Рыцарский Пфальц" #NT!
 nd_anv_dest_chivalric_palatinate_desc: "Большой зал небного почитания, созданный по образцу Палатина Честерского графства и герцогского двора Аквитании в Бордо. Палатинские графы присягают на верность королю и выезжают по его зову со своим полным феодальным войском." #NT!
 nd_anv_dest_palatinate_upkeep: "Обслуживание Палатинского суда" #NT!
 nd_anv_dest_palatinate_upkeep_desc: "Прекрасные ткани, оружие, мебель и воск для большого зала небных почестей и рыцарских церемоний." #NT!
  
  # === Bureaucracies === 
 nd_anv_bureaucracy_authority: "Администрация Плантагенета" #NT!
 AUTO_MODIFIER_NAME_nd_anv_bureaucracy_authority: "Администрация Плантагенета" #NT!
 AUTO_MODIFIER_DESC_nd_anv_bureaucracy_authority: "Административные органы Анжуйского королевства (странствующая царская курия, канцелярия и казначейство Вестминстера, сенешаль Аквитании и зарегистрированные порты Ла-Манша) превратились в постоянный институциональный аппарат. Корона двух королевств теперь управляет не только посредством династического присутствия, но и посредством указов, проверок и постоянных привилегий, возобновляемых с приходом каждого монарха." #NT!
  
 nd_anv_curia_regis_itinerant_bureaucracy: "Странствующий Курия Регис" #NT!
 nd_anv_curia_regis_itinerant_bureaucracy_desc: "Королевский двор, состоявший из судей, констеблей, камергеров и клерков, путешествовал вместе с правителями Плантагенетов между Вестминстером, Руаном, Каном, Ле-Маном, Анжером, Шиноном и Пуатье. В «Диалоге Скакарио» Ричарда ФицНила (около 1179 г.) описывается курия, которая занималась финансовым аудитом, королевскими просьбами, иностранной перепиской и династическими делами взаимозаменяемо, где бы ни находился король. Это был институт движения: предшественник сидячих Общих апелляций и Королевской скамьи, которые разветвились только после реформ 1234 года. Несмотря на то, что курия хорошо финансируется, она связывает королевство, пересекающее Ла-Манш, в единый политический орган; когда им пренебрегают, королевский двор становится удобным местом жительства, и великие бароны начинают возмущаться каждым его посещением." #NT!
  
 nd_anv_clarendon_apparatus_bureaucracy: "Конституция аппарата Кларендона" #NT!
 nd_anv_clarendon_apparatus_bureaucracy_desc: "Пакет административных инструментов, кодифицированных на Совете Кларендона в январе 1164 года: шестнадцать статей, утверждающих королевскую юрисдикцию над преступными клерками, ассизе утрум, передающее земельные дела в королевские суды, королевский лесной закон, администрируемый королевскими лесниками и лесниками, и система канцелярских приказов, которая созвала подданных под королевскую печать. Ссора с Беккетом из-за статьи о преступных клерках была ожесточенной и закончилась мученической смертью в Кентербери, но более широкий аппарат удержался: правительство Плантагенетов стало приказным государством. Пока сохраняется, королевская власть достигает подданных напрямую через пергамент, а не через посредничество лорда; Несмотря на пренебрежение, церковь помнит Беккета, и стабильность рушится." #NT!
  
 nd_anv_aquitanian_curia_bureaucracy: "Кур Пленьер д'Аквитания" #NT!
 nd_anv_aquitanian_curia_bureaucracy_desc: "Великая курия герцога-короля в Пуатье, а затем в Бордо, где аквитанские магнаты (графы Ангулем, Перигор, Ла Марш, Арманьяк и сеньор Альбре) давали советы, слушали апелляции и подтверждали обычное право герцогства. Элеонора Аквитанская поддержала двор Пуатье после 1168 года; Ричард I, как граф Пуату, сделал его своим политическим центром; при более поздних анжуйцах в отсутствие короля председательствовал сенешаль Гаскони. В отличие от приказного государства Англии, герцогская Аквитания по своему характеру оставалась федеральной: провинция Плантагенетов, магнаты которой говорили как пэры, а не подданные, чьи вина напитывали королевское войско и чья лояльность зависела от достоинства их консультаций." #NT!
  
 nd_anv_cinque_ports_bureaucracy: "Конфедерация пяти портов" #NT!
 nd_anv_cinque_ports_bureaucracy_desc: "Сделка Плантагенетов с военно-морскими городами Ла-Манша Гастингсом, Нью-Ромни, Хайтом, Дувром и Сэндвичем, к которым позже присоединились древние города Рай и Винчелси. В обмен на службу пятидесяти семи судов в течение пятнадцати дней каждый год порты получили широкие свободы согласно Хартии 1278 года: собственный адмиралтейский суд в Шепуэе, освобождение от королевских налогов и таможенных пошлин, право посылать баронов нести балдахин на коронациях и эффективный иммунитет от королевских указов внутри своих стен. Корона купила постоянный флот самого дешевого типа; бюргеры получили автономию, которой не было ни в одном другом английском районе. Сделка действовала до тех пор, пока Генрих VIII, наконец, не переоборудовал королевский флот на других условиях." #NT!
