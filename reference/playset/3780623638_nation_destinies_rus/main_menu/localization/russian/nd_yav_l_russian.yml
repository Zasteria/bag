l_russian:
 yavana_culture: "Явана" #NT!
 STATIC_MODIFIER_NAME_nd_yav_phalanx_reborn: "Фаланга Возрождается" #NT!
 STATIC_MODIFIER_DESC_nd_yav_phalanx_reborn: "Вооруженная сариссами фаланга снова поднялась на землях между Индом и Гиндукушем. То, что преемники Александра принесли на Восток, мы сделали своим." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dharma_of_the_yavana: "Дхарма Яваны" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dharma_of_the_yavana: "Там, где греческая философия встречается с буддийской мудростью, расцветает новая цивилизация. На наших монетах изображены два письма, на наших храмах — две традиции, а наши учёные говорят со всем миром." #NT!
 STATIC_MODIFIER_NAME_nd_yav_questions_of_milinda: "Вопросы Милинды" #NT!
 STATIC_MODIFIER_DESC_nd_yav_questions_of_milinda: "В традиции диалогов царя Менандра с монахом Нагасеной наш двор придерживается союза разума и просвещения." #NT!
 STATIC_MODIFIER_NAME_nd_yav_rational_inquiry: "Рациональный запрос" #NT!
 STATIC_MODIFIER_DESC_nd_yav_rational_inquiry: "Греческий метод систематического расспроса, примененный к тайнам мира, приводит к открытиям, которых не могла достичь ни одна традиция в отдельности." #NT!
 STATIC_MODIFIER_NAME_nd_yav_fourfold_array: "Четырехкратный массив" #NT!
 STATIC_MODIFIER_DESC_nd_yav_fourfold_array: "Пехота, кавалерия, слоны и лучники действуют как единая скоординированная сила в эллинистической традиции общевойскового боя." #NT!
 nd_yav.1.t: "Восстановление Яваны" #NT!
 nd_yav.1.d: "На протяжении веков имя Яваны эхом повторялось в индийских хрониках: греки, пришедшие из-за гор, чеканившие монеты на двух языках и поклонявшиеся Просветленному в мраморных храмах. Теперь буддийский правитель синдхи решился на то, что никто не считал возможным: возрождение Индо-греческого царства.\n\nОт Татты в дельте Инда до Пешавара в тени Хайберского перевала древние владения Яваны снова подчиняются единому трону. Но что это будет за состояние? Фаланга сверлит во дворах гандхарских монастырей, а торговцы чеканят двуязычные монеты в мастерских, пахнущих благовониями и оливковым маслом.\n\nПеред восстановленной Империей Явана лежат два пути: один — к военному гению наследников Александра, другой — к философскому синтезу, который сделал эти королевства уникальными среди всех мировых цивилизаций.\n\n#bold Этот выбор открывает путь судьбы в Традициях. таб.#!" #NT!
 nd_yav.1.a: "Мы возродим фалангу, покорившую полмира" #NT!
 nd_yav.1.b: "Наша дхарма мудро соединяет Восток и Запад." #NT!
 nd_yav.2.t: "Вопросы Милинды" #NT!
 nd_yav.2.d: "В древнем тексте, известном как «Милиндапанха», греческий царь Менандр (на языке пали «Милинда») провел с буддийским монахом Нагасеной серию глубоких философских диалогов. Царь задавал глубочайшие вопросы о природе личности, кармы и самого существования, а монах отвечал притчами и острой, как бритва, логикой.\n\nЭта традиция диалога между греческим рациональным исследованием и буддийской созерцательной мудростью была интеллектуальной основой индо-греческих царств. Теперь наши учёные возродили эти методы, организовав публичные дебаты между философами всех школ в гимназиях и вихарах наших городов.\n\nСледуем ли мы подчеркнуть духовное измерение этой традиции или её вклад в рациональное познание?" #NT!
 nd_yav.2.a: "Пусть диалог осветит путь к нирване" #NT!
 nd_yav.2.b: "Пусть разум станет нашим проводником к пониманию мира" #NT!
 nd_yav.3.t: "Художественная школа Гандхары" #NT!
 nd_yav.3.d: "В мастерских Гандхары произошло нечто необыкновенное. Наши скульпторы, прошедшие обучение в греческой традиции натуралистического изображения человека, применили свои навыки к буддийским сюжетам. Впервые в истории Будда изображен не как абстрактный символ (колесо, дерево, набор следов), а как безмятежная человеческая фигура, задрапированная в тогу, с волосами, уложенными волнами, напоминающими Аполлона.\n\nЭти изображения несут в себе эмоциональную силу, с которой чисто символическое искусство не может сравниться. Паломники плачут перед сострадательным ликом Просветленного. Искусство распространяется по торговым путям во всех направлениях, а вместе с ним и слава яванской цивилизации." #NT!
 nd_yav.3.a: "Наше искусство должно нести Дхарму на край земли." #NT!
 nd_yav.4.t: "Четверной массив" #NT!
 nd_yav.4.d: "Милинда Панха описывает армию Менандра как четырехстороннюю силу: слоны, кавалерия, лучники и пехотинцы. Наши генералы формализовали эту древнюю доктрину в комплексную систему общевойсковой войны.\n\nФаланга удерживает центр своими сариссами, нерушимой стеной из железных наконечников. На флангах конные лучники преследуют и заслоняют противника. За линией фронта в резерве ждут боевые слоны: живые осадные башни, которые разрушают вражеские порядки в решающий момент. Застрельщики и легкие войска заполняют бреши, поддерживая контакт между четырьмя родами войск.\n\nНи одна армия в Индии не сражается так. Это не чисто греческое и не чисто индийское явление, а нечто новое и разрушительное." #NT!
 nd_yav.4.a: "Пусть четырехкратный массив унесет все перед собой" #NT!
 nd_yav_culture_conversion_tt: "Все синдхи в принадлежащих провинциях перенимают культуру яваны." #NT!
 nd_yav_formed_tt: "Образована Империя Явана" #NT!
 nd_yav_path_a_tt: "Путь Фаланги" #NT!
 nd_yav_path_b_tt: "Путь Дхармы" #NT!
 nd_yav_phalanx_revival: "Возрождение Фаланги" #NT!
 nd_yav_phalanx_revival_desc: "Македонская фаланга, приведённая в Индию преемниками Александра, заново муштруется во дворах Синда. Тяжелая пехота, вооруженная пиками сарисса, составляет основу армии Яваны." #NT!
 nd_yav_gandhara_monasteries: "Гандхарские монастыри" #NT!
 nd_yav_gandhara_monasteries_desc: "Буддийские монастыри, построенные в греческом архитектурном стиле, служат центрами обучения и поклонения, сохраняя тексты как на греческом, так и на пракритском языках." #NT!
 nd_yav_bilingual_administration: "Двуязычная администрация" #NT!
 nd_yav_bilingual_administration_desc: "Государственные документы выдаются как на греческом, так и на пракритском языках, что гарантирует беспрепятственное общение эллинистической бюрократии и индийских подданных." #NT!
 nd_yav_elephant_corps: "Слоновий корпус" #NT!
 nd_yav_elephant_corps_desc: "Индо-греческие королевства с энтузиазмом приняли индийских боевых слонов, снабдив их броней и установив боевые платформы на вершинах этих живых крепостей." #NT!
 nd_yav_indus_trade: "Индусские торговые сети" #NT!
 nd_yav_indus_trade_desc: "Контроль над рекой Инд и горными перевалами, соединяющими Индию с Центральной Азией, дает государству Явана контроль над некоторыми из самых прибыльных торговых путей в древнем мире." #NT!
 nd_yav_bilingual_coinage: "Двуязычная чеканка" #NT!
 nd_yav_bilingual_coinage_desc: "Монеты отчеканены с изображением греческого языка на одной стороне и харости на другой, что является отличительной чертой индо-греческой цивилизации, которая облегчает торговлю через языковые границы." #NT!
 nd_yav_gajasena_tradition: "Гаджасена Традиция" #NT!
 nd_yav_gajasena_tradition_desc: "Формализованная доктрина ведения войны на слонах, совместная тренировка зверей и погонщиков с использованием скоординированной тактики, которая максимизирует устрашающий эффект атакующей линии слонов." #NT!
 nd_yav_milindapanha: "Диалоги Милиндапанхи" #NT!
 nd_yav_milindapanha_desc: "Философские диалоги между греческим рационализмом и буддийским созерцанием по образцу легендарных бесед царя Менандра с монахом Нагасеной." #NT!
 nd_yav_gandhara_art: "Художественная школа Гандхары" #NT!
 nd_yav_gandhara_art_desc: "Греческие скульптурные техники, примененные к буддийским религиозным предметам, создали первые человеческие изображения Будды и установили художественную традицию, которая распространится по всей Азии." #NT!
 nd_yav_strategoi_governance: "Стратегическое управление" #NT!
 nd_yav_strategoi_governance_desc: "Эллинистическая система управления провинциями посредством военно-гражданских стратегов, адаптированная к индийским условиям и обеспечивающая как защиту границ, так и административную эффективность." #NT!
 nd_yav_hellenistic_gymnasium: "Эллинистическая гимназия" #NT!
 nd_yav_hellenistic_gymnasium_desc: "Греческая гимназическая традиция физического воспитания в сочетании с философским образованием создавала граждан, тренированных как телом, так и разумом." #NT!
 nd_yav_combined_arms: "Общевойсковая доктрина" #NT!
 nd_yav_combined_arms_desc: "Систематическая координация пехотной фаланги, боевых слонов, конных лучников и легких стрелков в единую гибкую боевую силу, не чисто греческую и не чисто индийскую." #NT!
 nd_yav_syncretic_markets: "Синкретические рынки" #NT!
 nd_yav_syncretic_markets_desc: "Рынки, где греческое коммерческое право соответствует индийским торговым обычаям, под надзором агораноми, который обеспечивает соблюдение справедливых мер и весов в двуязычной торговой среде.\n\n#italic Доступно в: $nd_yav_agora_bazaar$#!" #NT!
 nd_yav_dharma_statecraft: "Дхарма государственного управления" #NT!
 nd_yav_dharma_statecraft_desc: "Буддийские этические принципы, применимые к эллинистическому управлению, философии справедливого правления, основанной как на указах Ашоки, так и на «Политике» Аристотеля." #NT!
 nd_yav_taxila_tradition: "Традиции университета Таксила" #NT!
 nd_yav_taxila_tradition_desc: "Древний университет в Таксиле, где ученые со всей Азии собирались для изучения медицины, математики и философии, возрождается как интеллектуальное сердце государства Явана." #NT!
 nd_yav_hippotoxotai_tradition: "Гиппотоксотайская традиция" #NT!
 nd_yav_hippotoxotai_tradition_desc: "Конные лучники, сочетающие греческое искусство верховой езды с техникой использования сложных луков, характерной для среднеазиатских степей, составляют быстродвижущуюся кавалерию армии Яваны." #NT!
 nd_yav_greco_buddhist_patronage: "Греко-буддийский покровительство" #NT!
 nd_yav_greco_buddhist_patronage_desc: "Спонсируемый государством религиозный синкретизм, при котором греческие божества отождествляются с буддийскими и индуистскими деятелями, а храмы обслуживают поклонников различных традиций под одной крышей." #NT!
 nd_yav_imperial_administration: "Императорская администрация" #NT!
 nd_yav_imperial_administration_desc: "Централизованная эллинистическая бюрократия епархов, диикетов и гипархов приспособилась управлять субконтинентальной империей, собирая налоги и отправляя правосудие на двух языках." #NT!
 nd_yav_silk_road_entrepot: "Перевалочный пункт Шелкового пути" #NT!
 nd_yav_silk_road_entrepot_desc: "Империя Явана расположена на стыке сухопутных путей из Китая, морских путей из Средиземноморья и речных путей вниз по Инду, обладая чрезвычайной коммерческой мощью.\n\n#italic Доступно в: $nd_yav_bilingual_mint$#!" #NT!
 nd_yav_syntagma_reform: "Реформа Синтагмы" #NT!
 nd_yav_syntagma_reform_desc: "Синтагма (тактическая единица реформированной фаланги) становится основой профессиональной постоянной армии, обученной по эллинистическим стандартам и финансируемой из имперской казны." #NT!
 nd_yav_universal_dharma: "Универсальная Дхарма" #NT!
 nd_yav_universal_dharma_desc: "Зрелая философия религиозной толерантности, основанная на буддийском сострадании и греческом космополитизме, предлагающая гражданство и достоинство всем народам, независимо от их вероисповедания." #NT!
 nd_yav_standing_army: "Реформы постоянной армии" #NT!
 nd_yav_standing_army_desc: "Переход от сезонной рекрутской войны к постоянным профессиональным силам поддерживался круглый год в соответствии с эллинистической моделью наемных солдат, обязанных быть лояльными государству." #NT!
 nd_yav_gandharan_renaissance: "Гандхарский ренессанс" #NT!
 nd_yav_gandharan_renaissance_desc: "Расцвет художественного творчества: техники Гандхары применяются в скульптуре, живописи, работе с металлом и архитектуре по всей империи." #NT!
 nd_yav_grand_vihara_network: "Сеть Гранд Вихара" #NT!
 nd_yav_grand_vihara_network_desc: "Сеть монастырских университетов, охватывающая всю империю, где монахи копируют тексты, преподают математику и медицину и служат интеллектуальной опорой государства.\n\n#italic Доступно в: $nd_yav_gandhara_vihara$#!" #NT!
 nd_yav_enlightened_syncretism: "Просвещенный синкретизм" #NT!
 nd_yav_enlightened_syncretism_desc: "Философская кульминация многовекового греко-буддийского диалога, зрелая интеллектуальная традиция, свободно опирающаяся на греческую, индийскую и центральноазиатскую мысль." #NT!
 nd_yav_modern_phalanx: "Современная Фаланга" #NT!
 nd_yav_modern_phalanx_desc: "Древняя традиция фаланги развивается в дисциплинированную линейную пехоту, способную вести залповый огонь, сохраняя эллинистический акцент на дисциплине построения в эпоху пороха." #NT!
 nd_yav_industrial_crossroads: "Промышленный перекресток" #NT!
 nd_yav_industrial_crossroads_desc: "Географическое положение, которое когда-то делало штат Явана торговым перекрестком, теперь стимулирует промышленное развитие, поскольку сырье поступает сюда со всех направлений." #NT!
 nd_yav_yavana_legacy: "Явана Наследие" #NT!
 nd_yav_yavana_legacy_desc: "Непреходящее наследие индо-греческого синтеза, цивилизации, которая доказала, что Восток и Запад могут объединиться в нечто большее, чем каждый из них по отдельности.\n\n#italic Доступно в: $nd_yav_gymnasium$#!" #NT!
 a_nd_yav_pezhetairoi: "Пежетайрой" #NT!
 a_nd_yav_pezhetairoi_desc: "Тяжелая пехота, вооруженная пикой-сариссой, возрождает традицию македонской фаланги, покорившей известный мир при Александре." #NT!
 a_nd_yav_gajasena: "Гаджасена" #NT!
 a_nd_yav_gajasena_desc: "Бронированные боевые слоны с боевыми башнями, сочетающие индийское слоноводство с греческой военной инженерией, создали самое устрашающее оружие на поле боя." #NT!
 a_nd_yav_thureophoroi: "Туреофоры" #NT!
 a_nd_yav_thureophoroi_desc: "Универсальная средняя пехота, несущая щит-туреос и вооруженная дротиками и мечами, обученная сражаться как в греческом порядке, так и в индийской тактике перестрелок." #NT!
 a_nd_yav_hippotoxotai: "Гиппотоксотай" #NT!
 a_nd_yav_hippotoxotai_desc: "Конные лучники, сочетающие дисциплину греческой кавалерии с техникой среднеазиатских составных луков, быстрые рейдеры, которые беспокоят вражеские фланги и прикрывают продвижение армии." #NT!
 a_nd_yav_syntagma_guard: "Синтагма Страж" #NT!
 a_nd_yav_syntagma_guard_desc: "Элитная профессиональная тяжелая пехота реформированной фаланги, наемные солдаты, обученные сражаться как единый организм в формировании синтагмы." #NT!
 nd_yav_gandhara_vihara: "Гандхара Вихара" #NT!
 nd_yav_gandhara_vihara_desc: "Буддийский монастырь, построенный в греко-буддийском архитектурном стиле, с коринфскими колоннами, обрамляющими залы для медитации, и скульпторами, получившими образование в Греции, создающими изображения Будды." #NT!
 nd_yav_bilingual_mint: "Явана Мята" #NT!
 nd_yav_bilingual_mint_desc: "Чеканная мастерская чеканит характерные двуязычные монеты государства Явана: греческие легенды на одной стороне и Харости на другой." #NT!
 nd_yav_hastisala: "Хастисала" #NT!
 nd_yav_hastisala_desc: "Комплекс для тренировки слонов и конюшни, где погонщики и животные вместе обучаются военному искусству, поддерживая корпус слонов Явана." #NT!
 nd_yav_gymnasium: "Гимназия" #NT!
 nd_yav_gymnasium_desc: "Эллинистический тренировочный полигон, где граждане тренируют тело и разум, изучая философию и риторику, а также борьбу и метание копья." #NT!
 nd_yav_agora_bazaar: "Агора-Базар" #NT!
 nd_yav_agora_bazaar_desc: "Синкретический рынок, где греческая коммерческая практика и индийские торговые обычаи сливаются под бдительным оком двуязычных чиновников рынка." #NT!
 nd_yav_vihara_scriptorium: "Вихара Скрипторий" #NT!
 nd_yav_vihara_scriptorium_desc: "Монашеские писцы копируют буддийские тексты и греческие философские труды на пальмовые листья и кору бумаги." #NT!
 nd_yav_vihara_endowment: "Фонд Вихара" #NT!
 nd_yav_vihara_endowment_desc: "Регулярные пожертвования благовоний, ткани и риса поддерживают монахов и их научную деятельность." #NT!
 nd_yav_coin_striking: "Чеканка монет" #NT!
 nd_yav_coin_striking_desc: "Чеканка двуязычных монет из меди и серебра — многовековая индо-греческая традиция, способствующая межкультурной торговле." #NT!
 nd_yav_mint_operations: "Монетный двор" #NT!
 nd_yav_mint_operations_desc: "Инструменты, металлы и административные принадлежности, необходимые для работы монетного двора Яваны." #NT!
 nd_yav_elephant_upkeep: "Содержание слоновьего корпуса" #NT!
 nd_yav_elephant_upkeep_desc: "Боевым слонам требуется огромное количество еды, специальной древесины для строительства хауда и постоянный запас животных на замену." #NT!
 nd_yav_stable_maintenance: "Стабильное обслуживание" #NT!
 nd_yav_stable_maintenance_desc: "Древесина, фураж и рис для содержания конюшни слонов и корма их огромных подопечных." #NT!
 nd_yav_philosophical_academy: "Философская Академия" #NT!
 nd_yav_philosophical_academy_desc: "Передовая школа греко-буддийской философии, создающая научные тексты, синтезирующие восточные и западные интеллектуальные традиции." #NT!
 nd_yav_gymnasium_operations: "Операции в гимназии" #NT!
 nd_yav_gymnasium_operations_desc: "Бумага для философских текстов, ткань для спортивной одежды и оливковое масло для традиционной греческой практики помазания." #NT!
 nd_yav_market_operations: "Рыночные операции" #NT!
 nd_yav_market_operations_desc: "Ткани, керамика и бумага для оживленного синкретического рынка." #NT!
 nd_yav_destiny: "Вернуть Бактрию" #NT!
 nd_yav_destiny_desc: "Империя Явана должна вернуть себе древнюю греко-бактрийскую территорию за пределами Гиндукуша (Кабул, Кандагар и Газни), чтобы восстановить в полной мере восточное наследие Александра." #NT!
 nd_yav_dest_bactrian_march: "Бактрийский марш" #NT!
 nd_yav_dest_bactrian_march_desc: "Отправьте вооруженную сариссами фалангу на север, к Балху и Герату, великим городам древней Бактрии, и создайте армию, достойную преемников Александра." #NT!
 nd_yav_dest_sarissa_empire: "Империя Сарисса" #NT!
 nd_yav_dest_sarissa_empire_desc: "Перенесите эллинистическую военную традицию в Самарканд на севере и Дели на востоке, создав континентальную империю, скрепленную несокрушимой фалангой." #NT!
 nd_yav_dest_alexanders_dream: "Мечта Александра" #NT!
 nd_yav_dest_alexanders_dream_desc: "Дойти до Ганга у Варанаси и Патны было лишено цели самому Александру. Создайте величайшую общевойсковую армию, которую когда-либо видел мир, и завершите завоевание, которое он начал." #NT!
 nd_yav_dest_bamiyan_light: "Свет Бамиана" #NT!
 nd_yav_dest_bamiyan_light_desc: "Защитите великие статуи Будды в Бамиане и инвестируйте в процветание империи. Примите меритократическое управление, чтобы построить цивилизацию, достойную как греческой философии, так и буддийской мудрости." #NT!
 nd_yav_dest_silk_dharma: "Шелковая Дхарма" #NT!
 nd_yav_dest_silk_dharma_desc: "Доставляйте шелк на столичные рынки и развивайте земли империи, пока царство Явана не станет интеллектуальным и торговым перекрестком Азии." #NT!
 nd_yav_dest_universal_light: "Универсальный Свет" #NT!
 nd_yav_dest_universal_light_desc: "Распространите греко-буддийское обучение на Матхуру и Удджайн, священные города в центре Ганги. Развивайте процветание империи и используйте современное банковское дело для финансирования величайшей синкретической цивилизации в истории." #NT!
 nd_yav.5.t: "Возвращение в Бактрию" #NT!
 nd_yav.5.d: "Наши армии пересекли Гиндукуш и установили знамя Яваны в древних городах Бактрии. Кабул, где когда-то стоял лагерем сам Александр. Кандагар, носящий его имя в искаженном виде. Газни, ворота на иранское нагорье.\n\nВпервые после падения Греко-Бактрийского царства единая эллинистическая держава контролирует и долину Инда, и афганское нагорье. Горные перевалы, соединяющие Индию с Центральной Азией, принадлежат нам. Торговые пути, которые несли греческую культуру на восток и буддийскую мудрость на запад, теперь проходят через наши таможни.\n\nЭто только начало." #NT!
 nd_yav.5.a: "Горы снова отвечают фаланге" #NT!
 nd_yav.6.t: "Бактрийский марш" #NT!
 nd_yav.6.d: "Балх, древняя столица Бактрии («мать городов», как ее называли арабы), развевает знамя Яваны. Герат, жемчужина Хорасана, пал под натиском нашей фаланги. Вооруженная сариссами пехота, впервые появившаяся на этих равнинах две тысячи лет назад при Александре, вернулась.\n\nНаши стратеги управляют провинциями, простирающимися от дельты Инда до ворот Персии. Общевойсковая доктрина слонов, кавалерии и фаланги доказала свою эффективность против любого врага. На базарах Балха торговцы чеканят двуязычные монеты с греческими легендами и письмом Харости.\n\nЗавоевание Большой Бактрии завершено. Остается решить, как далеко пойдет фаланга." #NT!
 nd_yav.6.a: "Пусть сарисса поднимет наше знамя еще дальше" #NT!
 nd_yav.7.t: "Империя Сарисса" #NT!
 nd_yav.7.d: "От легендарных рынков Самарканда до стен Дели фаланга Явана создала империю, которая затмевает все, чего достигли первоначальные индо-греческие цари. Менандр плакал бы от гордости.\n\nНаша армия — лучшая в Азии: дисциплинированная пехота, прикрытие конных лучников, громоподобные атаки слонов, и все это координируется стратегами, обученными общевойсковым традициям. Но даже самой великой армии необходима доктрина для ее дальнейшего роста.\n\nДолжны ли мы расширять наши силы за счет массовых наборов и быстрого маневра, подавляя наших врагов численностью и скоростью? Или нам следует инвестировать в профессиональную подготовку и оборонительные укрепления, чтобы каждый солдат стоил десяти вражеских?" #NT!
 nd_yav.7.a: "Наводните поле сариссами и слонами" #NT!
 nd_yav.7.b: "Обучите каждого солдата сражаться с железной дисциплиной" #NT!
 nd_yav.8.t: "Мечта Александра сбылась" #NT!
 nd_yav.8.d: "Ганг. Александр плакал, потому что у него больше не было миров, которые он мог бы завоевывать, по крайней мере, так гласит легенда. На самом деле его армия подняла мятеж в Гифазисе, отказавшись идти дальше на восток. Чего не смог достичь Александр, того достигла Империя Явана.\n\nНаши знамена развеваются над Варанаси, самым священным городом индусов, и Патной, древней Паталипутрой, где Чандрагупта Маурья когда-то принимал послов Селевкидов. Сарисса и боевой слон доставили греческое оружие в самое сердце Индии.\n\nЭто вершина эллинистической военной мощи. Как нам закрепить это достижение навечно?" #NT!
 nd_yav.8.a: "Наши кампании никогда не прекратятся" #NT!
 nd_yav.8.b: "Мы будем диктовать условия миру" #NT!
 nd_yav.9.t: "Свет Бамиана" #NT!
 nd_yav.9.d: "Великие Будды Бамиана с безмятежным состраданием смотрят на наших солдат, когда перед ними поднимается знамя Яваны. Эти колоссальные статуи, вырезанные из живой скалы Гиндукуша, олицетворяют все, к чему стремится наша цивилизация: союз греческого художественного мастерства и буддийской духовной глубины.\n\nНаши учёные основали новую вихару в тени Бамиана, где монахи обсуждают философию на греческом и пракритском языках, а скульпторы, обученные в гандхарской традиции, вырезают изображения, которые будут вдохновлять паломников на многие столетия вперед.\n\nПуть дхармы простирается вперед." #NT!
 nd_yav.9.a: "Пусть свет мудрости озарит все земли" #NT!
 nd_yav.10.t: "Шелковая Дхарма" #NT!
 nd_yav.10.d: "Караваны с китайским шелком прибывают на рынки нашей столицы вместе с торговцами, везущими римское стекло, среднеазиатских лошадей и индийские специи. Империя Явана расположена на перекрестке крупнейших торговых путей мира, и наше процветание отражает это.\n\nНаши города растут. Наши ученые размножаются. Вихары и гимназии, расположенные вдоль наших дорог, в равной мере производят монахов, философов, врачей и торговцев. Но процветание создает свой собственный выбор.\n\nДолжны ли мы инвестировать это богатство в материальное благополучие наших подданных, уменьшая волнения и создавая удовлетворенное население? Или мы должны использовать его, чтобы привлечь ученых и дипломатов со всего мира, сделав наш двор самым космополитичным в Азии?" #NT!
 nd_yav.10.a: "Пусть наши люди процветают в соответствии с Дхармой" #NT!
 nd_yav.10.b: "Пусть ученые мира соберутся при нашем дворе" #NT!
 nd_yav.11.t: "Универсальный Свет" #NT!
 nd_yav.11.d: "Матхура, священная для буддистов и индуистов, и Удджайн, древняя астрономическая столица Индии, теперь являются убежищем для университетов Яваны, где греческая логика встречается с буддийской медитацией и индуистской математикой. Наша империя стала тем, чего не достигла ни одна другая цивилизация в истории: живым синтезом Востока и Запада.\n\nУчёные приезжают из Средиземноморья, чтобы учиться в наших академиях. Наши двуязычные тексты копируются в монастырях от Шри-Ланки до Согдианы. Традиция искусства Гандхары распространила образ Будды по половине мира. И в наших судах философы всех школ свободно дискутируют под защитой государства, которое ценит мудрость выше догмы.\n\nЭто кульминация видения Яваны. Как нам его сохранить?" #NT!
 nd_yav.11.a: "Через стипендию, которая переживет империи" #NT!
 nd_yav.11.b: "Через толерантность, охватывающую все вероисповедания" #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_sarissa_tide: "Прилив Сариссаса" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_sarissa_tide: "Массовые наборы и быстрый маневр сокрушают наших врагов огромным весом фаланги Яваны." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_iron_discipline: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_iron_discipline: "Профессиональная подготовка и укрепленные позиции делают каждого солдата Яваны достойным десяти врагов." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_phalanx_ascendant: "Фаланга Асцендента" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_phalanx_ascendant: "Военная машина Яваны действует с неустанной эффективностью, запуская кампании быстрее и поддерживая их дольше, чем любой соперник." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_world_conqueror: "Завоеватель мира" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_world_conqueror: "Империя Явана диктует миру условия с позиции подавляющего военного превосходства." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_dharma_prosperity: "Дхарма процветания" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_dharma_prosperity: "Буддийская этика удовлетворенности и хорошего управления уменьшают волнения и сепаратизм по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_cosmopolitan_court: "Космополитический суд" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_cosmopolitan_court: "Двор Яваны привлекает ученых и дипломатов со всего известного мира, интегрируя вассальные государства посредством культурного магнетизма." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_living_synthesis: "Живой синтез" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_living_synthesis: "Слияние греческих и буддийских интеллектуальных традиций порождает цивилизацию, привлекающую лучшие умы мира." #NT!
 STATIC_MODIFIER_NAME_nd_yav_dest_tolerant_empire: "Толерантная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_yav_dest_tolerant_empire: "Государство, основанное на религиозной терпимости и синкретической мудрости, где все религии приветствуются и ни одна не преследуется." #NT!
 nd_yav_strategos_akademia: "Стратегос Академия" #NT!
 nd_yav_strategos_akademia_desc: "Элитная военная академия, где командиров обучают общевойсковой доктрине фаланги, слона и кавалерии, создавая стратегов, достойных наследия Александра." #NT!
 nd_yav_mahasanghika_university: "Университет Махасангика" #NT!
 nd_yav_mahasanghika_university_desc: "Великий центр синкретического обучения, где греческая философия, буддийская мудрость и индуистская математика изучаются вместе, выпуская ученых, которые соединяют интеллектуальные традиции Востока и Запада." #NT!
 nd_yav_akademia_training: "Академическое обучение" #NT!
 nd_yav_akademia_training_desc: "Оружие, каменные укрепления, кожаные доспехи и инструменты для обучения следующего поколения военачальников Яваны." #NT!
 nd_yav_university_scholarship: "Университетская стипендия" #NT!
 nd_yav_university_scholarship_desc: "Бумага для рукописей, краски для освещения и благовония для медитации поддерживают научную работу университета." #NT!
 nd_yav_university_endowment: "Университетский фонд" #NT!
 nd_yav_university_endowment_desc: "Бумага, благовония, ткань и пчелиный воск для поддержания повседневной деятельности университета и поддержки его постоянных ученых." #NT!
  
  # ===== BUREAUCRACIES ===== 
 yav_eparchia_strategoi_bureaucracy: "Епархия Стратегои" #NT!
 yav_eparchia_strategoi_bureaucracy_desc: "Индо-греческое сатрапское правление заимствовано из практики Ахеменидов и Селевкидов. Каждую епархию возглавлял стратег, военный губернатор, который сочетал эллинистическую командную власть с полномочиями по сбору гражданских доходов. Надпись на реликварии Шинкот называет меридарха Теодора, а медная пластина Таксилы Патики подтверждает стратега, служившего под индо-греческой гегемонией. Это учреждение централизует королевскую власть посредством постоянных провинциальных командований за счет касты земельной кавалерии гиппархов." #NT!
 yav_sangha_patronage_bureaucracy: "Покровительство Сангхи" #NT!
 yav_sangha_patronage_bureaucracy_desc: "Королевский аппарат пожертвований, направляющий доходы короны в пользу буддийского ордена. Покровительство Менандра I сангхе записано в Милиндапанхе и физически засвидетельствовано в надписях реликварий Шинкот, Баджаур и Бимаран, где индо-греческие офицеры и царская семья посвящают ступы и монашеские дары. Позаимствовав офис Ашока Дхамма-махаматры, аппарат размещает постоянных королевских чиновников в греко-буддийских вихарах для управления пожертвованиями и надзора за дисциплиной." #NT!
 yav_polis_asty_council_bureaucracy: "Совет Полис-Асты" #NT!
 yav_polis_asty_council_bureaucracy_desc: "Эллинистическое гражданское управление распространялось на индо-греческие города. Сагала, Таксила и Пушкалавати сохранили форму греческого полиса: совет (буле) граждан, архонтов и астиномов, регулирующих рынки, суды и гражданское ополчение под царской гегемонией. Гражданские монетные дворы чеканили тетрадрахмы аттического веса с городскими знаками, подтверждая корпоративную власть над чеканкой монет. Власть переходит к городским торговцам, структурно ослабляя сельскую кавалерийскую аристократию." #NT!
 yav_bilingual_chancery_bureaucracy: "Двуязычная канцелярия" #NT!
 yav_bilingual_chancery_bureaucracy_desc: "Секретариат с двойным алфавитом, который подготовил официальные тексты на параллельном греческом языке и Карошти-Пракрите: легенды на монетах, королевские указы, посвящения реликвариев и отчеты о доходах. Столп Гелиодора в Беснагаре, надпись Рех и легенды на аверсе и реверсе каждой индо-греческой тетрадрахмы документируют действующую канцелярию, писцы которой были обучены двум письменностям. Это учреждение способствует распространению грамотности как в греческих гарнизонных городах, так и в индийской сельской местности, но его расходы ложатся на плечи городского купеческого класса, который укомплектовывает его кадрами." #NT!
  
 AUTO_MODIFIER_NAME_nd_yav_bureaucracy_authority: "Постоянный административный аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_yav_bureaucracy_authority: "Возрожденное государство Явана унаследовало многослойный эллинистически-индийский институциональный субстрат: сатрапские епархии, гражданские полисы, королевское покровительство сангхе и двуязычную канцелярию индо-греческих царей. Этот постоянный административный фонд предоставляет два бюрократических места, а столица предоставляет третье." #NT!
