l_russian:
  
  # Government Reforms: Administrative Doctrines 
 nd_patrimonial_doctrine: "Родовое учение" #NT!
 nd_patrimonial_doctrine_desc: "Бюрократические должности рассматриваются как унаследованные права самого королевства. Старые институты накапливаются, не будучи отменены, и однажды созданные, их практически невозможно разрушить. Государство платит большие текущие расходы, чтобы поддерживать их работоспособность, но пользуется постоянством, с которым не может сравниться ни один конкурент.\n\nПредоставляет [bureaucracies|e] +1 слот, +10% стоимости обслуживания, -15% стоимости удаления." #NT!
  
 nd_oligarchic_doctrine: "Олигархическая доктрина" #NT!
 nd_oligarchic_doctrine_desc: "Бюрократические учреждения управляются крупными сословиями как их собственное достояние. Магнаты берут на себя большую часть операционных расходов в обмен на влияние, но каждое изменение мандата бюро провоцирует переговоры между его благородными покровителями.\n\nДает [bureaucracies|e] +1 слот, -10% стоимости обслуживания, +5% стоимости изменения." #NT!
  
 nd_meritocratic_doctrine: "Меритократическая доктрина" #NT!
 nd_meritocratic_doctrine_desc: "Бюрократические должности заполняются путем экзаменов и обученного обслуживания, а не патронажа. Удержание профессионального персонала обходится немного дороже, но их учреждения быстро укореняются и достигают полной эффективности гораздо быстрее, чем конкурирующие системы.\n\nДает [bureaucracies|e] +1 слот, +5% стоимости обслуживания, +15% скорости укрепления." #NT!
  
  # Law: Bureaucratic Funding 
 nd_bureaucratic_funding_law: "Бюрократическое финансирование" #NT!
 nd_bureaucratic_funding_law_desc: "Как на самом деле оплачивается государственный аппарат? Каждая политика обязывает сферу использовать другую модель финансирования, что влияет на то, насколько дешевыми будут создаваться институты, насколько легко можно будет перетасовать их мандаты и как быстро они укоренятся." #NT!
  
 nd_tax_farming_policy: "Налоговое земледелие" #NT!
 nd_tax_farming_policy_desc: "Права на сбор налогов продаются частным агентам, которые финансируют бюрократию из своей доли. Открытие новых офисов обходится дешево, и упразднить их так же легко, но дворянство незаметно кладет сбережения в карман.\n\nГрантирует -25% [bureaucracy|e] стоимость внедрения, -15% стоимость удаления. В одобрении [ShowEstateTypeName('nobles_estate')]." #NT!
  
 nd_crown_coffers_policy: "Коронные сундуки" #NT!
 nd_crown_coffers_policy_desc: "Казначейство напрямую финансирует каждое бюро из королевского кошелька. Установка достаточно дешева, и (что особенно важно) институты достигают своего полного институционального веса гораздо быстрее, чем при любой другой модели.\n\nГранты -15% [bureaucracy|e] стоимость внедрения, +20% скорость внедрения. В одобрении [ShowEstateTypeName('crown_estate')]." #NT!
  
 nd_estate_subvention_policy: "Субвенция по недвижимости" #NT!
 nd_estate_subvention_policy_desc: "Каждое сословие финансирует те учреждения, которые ему приносят пользу. Бюро обслуживают узкие группы избирателей, но сословия берут на себя политические издержки изменения фокуса бюро, поэтому перенастройка ползунка становится очень дешевой.\n\nГранты -25% [bureaucracy|e] стоимость изменения формы. В одобрении [ShowEstateTypeName('clergy_estate')]." #NT!
  
 nd_treasury_bureau_policy: "Казначейское бюро" #NT!
 nd_treasury_bureau_policy_desc: "Современное бюджетное бюро выделяет каждому учреждению средства с единого государственного счета, постатейно. Незначительно лучший в реализации, изменении и укреплении, но политически невообразим до эпохи абсолютизма.\n\nДает -15% [bureaucracy|e] стоимость внедрения, -15% стоимость изменения, +10% скорость укрепления. В одобрении [ShowEstateTypeName('burghers_estate')]." #NT!
