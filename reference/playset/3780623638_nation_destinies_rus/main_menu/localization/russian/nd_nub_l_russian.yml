l_russian:
 STATIC_MODIFIER_NAME_nd_nub_land_of_the_bow: "Земля Лука" #NT!
 STATIC_MODIFIER_DESC_nd_nub_land_of_the_bow: "Древние египтяне называли эту землю Та-Сети, Земля Лука. На протяжении тысячелетий нубийских лучников боялись во всем древнем мире, их использовали в качестве наемников от Египта до Персии. Теперь, когда Нубия вновь возрождается, ее воинские традиции возрождаются. Лук – это больше, чем оружие; это символ народа, который никогда по-настоящему не был завоеван." #NT!
 STATIC_MODIFIER_NAME_nd_nub_golden_corridor: "Золотой Коридор" #NT!
 STATIC_MODIFIER_DESC_nd_nub_golden_corridor: "Нубия расположена по обе стороны единственного безопасного маршрута между странами Африки к югу от Сахары и Средиземноморьем – Нильского коридора. Золото, слоновая кость, черное дерево, благовония и экзотические животные текут на север через руки нубийцев, а зерно, лен и промышленные товары текут на юг. Королевство, контролирующее этот коридор, контролирует богатства двух миров." #NT!
 nd_nub.1.t: "Восстановление Нубии" #NT!
 nd_nub.1.d: "Разбросанные нубийские земли снова объединились. На протяжении веков королевства Макурия и Алодия направляли богатства Африки на север вдоль Нила, их лучники наводили ужас на любого, кто осмелился вторгнуться, их церкви были украшены картинами, которые могли соперничать с Константинополем. Хотя эти королевства пали из-за внутренних распрей и иностранного давления, нубийский народ выстоял. Теперь начинается новая глава. Сможет ли Нубия восстановить себя как военная держава, чьи лучники заставляют дрожать империи, или как незаменимый торговый коридор, связывающий богатства Африки с остальным миром?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_nub.1.a: "Мы наследники Та-Сети: пусть наши стрелы затмят небо." #NT!
 nd_nub.1.b: "Золото, слоновая кость и ладан: Нил принесет нашу удачу." #NT!
 nd_nub.2.t: "Слава Фараса" #NT!
 nd_nub.2.d: "Собор в Фарасе когда-то был жемчужиной христианской Нубии. На его стенах были великолепные картины: архангелы с темными нубийскими чертами лица, епископы в великолепных облачениях, Дева Мария, выполненная в стиле, сочетающем византийскую иконографию с отчетливо африканской чувственностью. Мастера Фараса разработали уникальную для средневекового мира школу искусства, в которой священные фигуры поворачивались к смертным поклонникам, а не наоборот. Эта традиция художественного совершенства определяет культурную самобытность Нубии. Должны ли мы восстановить Фарас как живой центр веры или почтить его наследие как маяк обучения и художественных достижений?" #NT!
 nd_nub.2.a: "Восстановите собор: пусть вера будет нашим фундаментом." #NT!
 nd_nub.2.b: "Мастера Фарас вдохновляют новую эру нубийских знаний." #NT!
 nd_nub.3.t: "Наследие Бакта" #NT!
 nd_nub.3.d: "В 652 году королевство Мукурия подписало Бакт с арабскими правителями Египта, один из самых давних договоров в истории. На протяжении более шести столетий это соглашение гарантировало мир вдоль Нила: Нубия отправляла на север рабов, жирафов и экзотические товары, а Египет взамен поставлял зерно, вино и ткани. Бакт был не просто торговым соглашением, а дипломатическим шедевром, который сдерживал армии халифата, когда они побеждали все на своем пути. Эта традиция проницательной дипломатии остается частью наследия Нубии. Должны ли мы чтить наследие Бакта как дипломатическую традицию или как основу наших коммерческих сетей?" #NT!
 nd_nub.3.a: "Бакт учит нас, что мудрый договор стоит больше, чем тысяча солдат." #NT!
 nd_nub.3.b: "Торговые пути Бакта сделают нас сверх меры богатыми." #NT!
 nd_nub.4.t: "Синтез Фунджа" #NT!
 nd_nub.4.d: "Когда в 1504 году к власти пришли люди Фундж, они построили новый султанат в Сеннаре на руинах христианской Алодии. Однако Фунджи не просто заменили одну цивилизацию другой. Несмотря на принятие ислама, они сохранили наряду со своей новой верой африканские обычаи и доисламские ритуалы. Европейские путешественники описывали «африканскую империю с мусульманским фасадом», царство, где исламские ученые преподавали в медресе, а традиционные церемонии продолжались в сельской местности. Этот синтез старого и нового, африканского и исламского создал уникальную суданскую идентичность. Примет ли Нубия ортодоксальное исламское обновление или прославит синкретическое наследие, которое делает ее культуру самобытной?" #NT!
 nd_nub.4.a: "Пусть свет истинной веры озарит нашу землю." #NT!
 nd_nub.4.b: "Наша сила – в смешении традиций." #NT!
 nd_nub.5.t: "Сакия преображает Нил" #NT!
 nd_nub.5.d: "Сакья, водяное колесо, приводимое в движение быком, произвело революцию в нубийском сельском хозяйстве. В отличие от Египта, где ежегодные разливы Нила орошают землю естественным путем, сельское хозяйство Нубии полностью зависит от механического орошения. Одна сакия, перерабатываемая в течение дня, может оросить два гектара пахотных земель на берегу реки. По мере того как сакии размножаются вдоль Нила, деревни расширяются, население растет, а узкая полоска зелени вдоль берегов реки расширяется. Ритмичный скрип водяного колеса стал сердцебиением нубийской жизни." #NT!
 nd_nub.5.a: "Река дает жизнь всем, кто умеет из нее черпать." #NT!
 STATIC_MODIFIER_NAME_nd_nub_faras_restored: "Фарас восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_nub_faras_restored: "Собор в Фарасе был восстановлен как центр нубийской христианской молитвы, его стены снова украшены великолепными картинами, которые когда-то вызывали трепет у паломников со всего христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_nub_faras_beacon: "Маяк Нила" #NT!
 STATIC_MODIFIER_DESC_nd_nub_faras_beacon: "Художественные и научные традиции Фараса были возрождены как центр обучения, где методы старых мастеров вдохновляют новые поколения нубийских ученых и художников." #NT!
 STATIC_MODIFIER_NAME_nd_nub_baqt_diplomacy: "Бактская традиция" #NT!
 STATIC_MODIFIER_DESC_nd_nub_baqt_diplomacy: "Дипломатическое наследие Нубии, созданное многовековым Бактским договором с Египтом, дает ее посланникам инстинктивное понимание того, как вести переговоры с позиции культурного доверия." #NT!
 STATIC_MODIFIER_NAME_nd_nub_baqt_commerce: "Торговля бакта" #NT!
 STATIC_MODIFIER_DESC_nd_nub_baqt_commerce: "Торговые сети, созданные в рамках исторического соглашения Бакта, продолжают переправлять товары между странами Африки к югу от Сахары и Средиземноморьем через руки нубийцев." #NT!
 STATIC_MODIFIER_NAME_nd_nub_funj_islamic_renewal: "Исламское обновление" #NT!
 STATIC_MODIFIER_DESC_nd_nub_funj_islamic_renewal: "Ортодоксальная исламская наука укоренилась в Нубии, где святые люди и ученые основали учебные школы, которые связывают эту землю с более широким исламским миром." #NT!
 STATIC_MODIFIER_NAME_nd_nub_funj_syncretic_heritage: "Синкретическое наследие" #NT!
 STATIC_MODIFIER_DESC_nd_nub_funj_syncretic_heritage: "Нубия объединяет свою многослойную идентичность, христианские, исламские и африканские традиции, сплетенные воедино в культуру, которая выходит за рамки любой отдельной веры." #NT!
 nd_nub_ta_seti_archery: "Та-Сети Стрельба из лука" #NT!
 nd_nub_ta_seti_archery_desc: "Лучников Та-Сети, «Земли лука», боялись во всем древнем мире. Эта традиция превосходной стрельбы из лука сохраняется среди нубийских воинов, которые с детства тренируются обращаться с большим длинным луком." #NT!
 nd_nub_gold_mining: "Вади Аллаки Голд" #NT!
 nd_nub_gold_mining_desc: "Золотые месторождения Вади Аллаки и Восточной пустыни были источником богатства Нубии со времен фараонов. Систематические операции по добыче полезных ископаемых добывают драгоценный металл, который финансирует королевства." #NT!
 nd_nub_saqia_expansion: "Сакья Орошение" #NT!
 nd_nub_saqia_expansion_desc: "Водяное колесо, приводимое в движение быком, сакья, превращает узкую пойму Нила в продуктивные сельскохозяйственные угодья, превращая пустыню в зелень по одному полю за раз." #NT!
 nd_nub_painted_pottery: "Нубийская расписная керамика" #NT!
 nd_nub_painted_pottery_desc: "Нубийские гончары производят уникальные изделия, украшенные христианскими символами (рыбами, голубями, крестами и пальмовыми листьями) в стилях, сочетающих африканские и средиземноморские традиции." #NT!
 nd_nub_nile_corridor: "Нильский коридор Торговля" #NT!
 nd_nub_nile_corridor_desc: "Нубия контролирует Нильский коридор, единственный безопасный путь для африканской экзотики в Средиземное море. Через руки нубийцев проходят слоновая кость, черное дерево, благовония и экзотические животные.\n\n#italic Доступно в: $nd_nub_nile_fortress$#!" #NT!
 nd_nub_coptic_roots: "Коптские корни" #NT!
 nd_nub_coptic_roots_desc: "Обращение Нубии в христианство до 600 года нашей эры установило глубокие связи с коптским Египтом и всем христианским миром, создав духовное наследие, которое сохраняется на протяжении веков." #NT!
 nd_nub_fortress_building: "Нильские укрепления" #NT!
 nd_nub_fortress_building_desc: "Укрепленные города и сторожевые башни расположены вдоль Нила, защищая нубийские поселения от набегов пустыни и иностранных захватчиков. Эти каменные крепости контролируют узкие места реки." #NT!
 nd_nub_pitati_tradition: "Питати Боумен" #NT!
 nd_nub_pitati_tradition_desc: "Питати были элитным отрядом нубийских лучников, настолько известным, что египетские фараоны реквизировали их поименно. Эта традиция профессиональной стрельбы из лука порождает воинов необычайного мастерства." #NT!
 nd_nub_makurian_cavalry: "Макурские всадники" #NT!
 nd_nub_makurian_cavalry_desc: "Конница Макурии патрулирует Нильский коридор верхом на лошадях, вооруженная копьями и луками. Эти всадники являются первой линией защиты от вторжений бедуинов и иностранных армий." #NT!
 nd_nub_monastic_centers: "Монастырские центры" #NT!
 nd_nub_monastic_centers_desc: "Крупнейшие монастыри Нубии (Бангаарти, Газали и др.) служат центрами обучения, паломничества и художественного творчества, сохраняя грамотность на греческом, коптском и древненубийском языках." #NT!
 nd_nub_faras_tradition: "Фарасский собор Традиция" #NT!
 nd_nub_faras_tradition_desc: "Художественные достижения мастеров Фарасского собора, их уникальный стиль настенной росписи, сочетающий византийскую иконографию с африканской человечностью, представляют собой вершину нубийского культурного самовыражения." #NT!
 nd_nub_ivory_trade: "Торговые сети слоновой кости" #NT!
 nd_nub_ivory_trade_desc: "Нубийские купцы контролируют торговлю слоновой костью из внутренних районов Африки на рынки Средиземноморья, управляя складами и караванами, которые перевозят этот драгоценный товар по древним путям." #NT!
 nd_nub_desert_leathercraft: "Кожевенное дело пустыни" #NT!
 nd_nub_desert_leathercraft_desc: "Нубийские кожевники превращают шкуры животных в прекрасные изделия (седла, щиты, контейнеры и декоративные предметы), используя методы, отточенные поколениями в пустынном климате.\n\n#italic Доступно в: $nd_nub_ivory_warehouse$#!" #NT!
 nd_nub_dongola_court: "Суд Старой Донголы" #NT!
 nd_nub_dongola_court_desc: "Административные традиции Старой Донголы, столицы Макурии на протяжении более семи веков, обеспечивают основу для организованного управления вдоль Нила." #NT!
 nd_nub_baqt_legacy: "Наследие Бакта" #NT!
 nd_nub_baqt_legacy_desc: "Бакт, договор между Мукурией и арабскими правителями Египта, который длился более шести столетий, укрепил репутацию Нубии как дипломатической державы, которая могла вести переговоры о мире с самыми могущественными империями." #NT!
 nd_nub_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_nub_citadel_garrison_desc: "В укреплённых городах Нила имеются профессиональные гарнизонные войска, обученные защищать каменные стены и переправы через реки, а также тяжёлая пехота, способная противостоять любому нападению." #NT!
 nd_nub_red_sea_incense: "Благовония Красного моря" #NT!
 nd_nub_red_sea_incense_desc: "Торговые пути благовоний, соединяющие Африканский Рог с побережьем Красного моря, проходят через территорию, контролируемую нубийцами, принося ароматные богатства из далеких земель.\n\n#italic Доступно в: $nd_nub_ivory_warehouse$#!" #NT!
 nd_nub_four_scripts: "Четыре сценария" #NT!
 nd_nub_four_scripts_desc: "Нубийские писцы владеют четырьмя системами письма (старонубийской, греческой, коптской и арабской), что дает им доступ к научным традициям как христианского, так и исламского мира." #NT!
 nd_nub_cataract_defenses: "Защита от катаракты" #NT!
 nd_nub_cataract_defenses_desc: "Потоки Нила образуют естественные узкие проходы, которые нубийские защитники укрепляют и используют. Любая армия, продвигающаяся вверх по реке, должна пройти через эти смертоносные узкие места под дождем стрел." #NT!
 nd_nub_funj_synthesis: "Синтез Фунджа" #NT!
 nd_nub_funj_synthesis_desc: "Султанат Фундж создал уникальное культурное сочетание: исламская вера наслаивалась на африканские традиции, создавая суданскую идентичность, выходящую за границы любой отдельной цивилизации." #NT!
 nd_nub_sennar_scholarship: "Стипендия Сеннара" #NT!
 nd_nub_sennar_scholarship_desc: "Город Сеннар становится центром исламского образования, а медресе привлекает ученых со всей долины Нила и за ее пределами." #NT!
 nd_nub_caravan_trade: "Караван Трейд" #NT!
 nd_nub_caravan_trade_desc: "Дальние караванные маршруты соединяют Нубию с рынками Египта, Африканского Рога и Сахеля, доставляя рабов, золото и сельскохозяйственную продукцию отдаленным покупателям.\n\n#italic Доступно в: $nd_nub_ivory_warehouse$#!" #NT!
 nd_nub_sultanate_authority: "Султанатская власть" #NT!
 nd_nub_sultanate_authority_desc: "Султаны Фунджа консолидируют власть над различными народами долины Нила, устанавливая централизованное управление ранее независимыми вождями и племенными территориями." #NT!
 nd_nub_butana_cavalry: "Бутанские всадники" #NT!
 nd_nub_butana_cavalry_desc: "Степь Бутаны между Нилом и рекой Атбара порождает выносливых лошадей и более свирепых наездников. Эти конные воины путешествуют по открытым лугам, совершая набеги и патрулируя огромные расстояния." #NT!
 nd_nub_kordofan_expansion: "Кордофанское расширение" #NT!
 nd_nub_kordofan_expansion_desc: "Нубийская власть распространяется на запад, в высокогорье Кордофана и Нубийские горы, включая новые народы и ресурсы во владения королевства." #NT!
 nd_nub_sennar_firearms: "Сеннарские мушкетеры" #NT!
 nd_nub_sennar_firearms_desc: "Султанат Фундж применяет технологию огнестрельного оружия, вооружая пехоту мушкетами, приобретенными в результате торговых контактов на Красном море. Начинается новая эра нубийской военной мощи." #NT!
 nd_nub_sennar_golden_age: "Золотой век Сеннара" #NT!
 nd_nub_sennar_golden_age_desc: "При покойных султанах Фунджа Сеннар достигает своего расцвета как процветающая столица, город рынков, мечетей и особняков, где смешиваются африканские, арабские и османские влияния.\n\n#italic Доступно в: $nd_nub_ivory_warehouse$#!" #NT!
 nd_nub_blue_nile_agriculture: "Голубой Нил Сельское хозяйство" #NT!
 nd_nub_blue_nile_agriculture_desc: "Плодородные земли вдоль Голубого Нила, обогащенные сезонными наводнениями, дают обильные урожаи зерна и хлопка, которые поддерживают растущее население султаната." #NT!
 nd_nub_hamaj_regency: "Хамадж Ридженси" #NT!
 nd_nub_hamaj_regency_desc: "Регенты Хамаджа, которые стали доминировать в покойном суде Фунджа, проводят административные реформы, которые упрощают управление, даже несмотря на то, что они низводят самих султанов до номинальных глав." #NT!
 nd_nub_suakin_trade: "Суакин шлюз" #NT!
 nd_nub_suakin_trade_desc: "Порт Суакин на Красном море соединяет Нубию с торговым миром Индийского океана, принося богатство с маршрутов специй и обеспечивая доступ к рынкам по всей Аравии и за ее пределами." #NT!
 nd_nub_military_reform: "Военная реформа" #NT!
 nd_nub_military_reform_desc: "Военные реформы позднего периода повысили профессионализм нубийской армии, введя в нее строевую подготовку, стандартизированное снаряжение и тактическую дисциплину, дополняющие традиционную воинскую храбрость." #NT!
 nd_nub_nubian_identity: "Нубийская идентичность" #NT!
 nd_nub_nubian_identity_desc: "Возобновленная гордость за нубийскую культурную самобытность (ее уникальное искусство, язык и традиции) становится основой современного нубийского национального сознания." #NT!
 nd_nub_modern_irrigation: "Современное орошение" #NT!
 nd_nub_modern_irrigation_desc: "Передовые методы орошения преобразовывают долину Нила, расширяя пахотные земли далеко за пределы того, что могла достичь древняя сакия, и поддерживая растущее население." #NT!
 nd_nub_resistance_tradition: "Традиция Сопротивления" #NT!
 nd_nub_resistance_tradition_desc: "Нубия имеет тысячелетнюю традицию сопротивления иностранному господству, от Ассирии до Рима и арабских халифатов. Это неповиновение является не упрямством, а глубоким культурным убеждением в том, что суверенитет Нубии не подлежит обсуждению." #NT!
 nd_nub_sufi_networks: "Суфийские сети" #NT!
 nd_nub_sufi_networks_desc: "Суфийские ордена распространились по сельской местности Нубии, обеспечивая духовное руководство, социальные услуги и объединяющую народную религию, преодолевающую племенные и этнические границы.\n\n#italic Доступно в: $nd_nub_ivory_warehouse$#!" #NT!
 nd_nub_nile_mercantile: "Нил Торговый" #NT!
 nd_nub_nile_mercantile_desc: "Межкультурные торговые сети связывают нубийских торговцев с рынками Африки и Ближнего Востока, создавая коммерческий класс, преодолевающий религиозные и этнические границы." #NT!
 nd_nub_modern_governance: "Современное управление" #NT!
 nd_nub_modern_governance_desc: "Административная модернизация приносит централизованный учет, стандартизированное налогообложение и профессиональную бюрократию в королевство, которое когда-то управлялось посредством личной власти и племенных обычаев." #NT!
 a_nd_nub_nubian_archers: "Нубийские лучники" #NT!
 a_nd_nub_nubian_archers_desc: "Легендарные лучники Та-Сети, вооруженные огромными длинными луками из выдержанного пальмового дерева. Обученные с детства, эти лучники могут поражать цели с ошеломляющей точностью на расстояниях, которые поражают иностранных наблюдателей." #NT!
 a_nd_nub_pitati: "Питати Боумен" #NT!
 a_nd_nub_pitati_desc: "Элитные профессиональные лучники, названные в честь египетского термина, обозначающего контингенты нубийских лучников. Питати сочетают традиционное нубийское владение луком с организованной военной дисциплиной." #NT!
 a_nd_nub_nile_horsemen: "Нильские всадники" #NT!
 a_nd_nub_nile_horsemen_desc: "Макурская кавалерия, вооруженная копьями и луками, патрулирует Нильский коридор на крепких лошадях. Эти всадники чувствуют себя в седле так же комфортно, как и пешие, и способны сражаться как конные лучники или ударная кавалерия." #NT!
 a_nd_nub_dongola_guard: "Донгольские гвардейцы" #NT!
 a_nd_nub_dongola_guard_desc: "Тяжелая пехота, взятая из гарнизонных традиций Старой Донголы и укреплённых городов Нила. Эти солдаты обучены удерживать стены и переправы через реки, несмотря на превосходящие силы противника." #NT!
 a_nd_nub_sennar_musketeers: "Сеннарские мушкетеры" #NT!
 a_nd_nub_sennar_musketeers_desc: "Пороховая пехота султаната Фундж, оснащенная мушкетами, приобретенными в результате торговли на Красном море. Они представляют собой эволюцию нубийских военных традиций в эпоху огнестрельного оружия." #NT!
 nd_nub_saqia: "Водяное колесо Сакия" #NT!
 nd_nub_saqia_desc: "Водяное колесо, приводимое в движение быком, которое поднимает речную воду для орошения полей в узкой пойме Нила. Сакия является основой всего сельского хозяйства Нубии." #NT!
 nd_nub_nile_fortress: "Нильская крепость" #NT!
 nd_nub_nile_fortress_desc: "Укрепленная крепость из камня и сырцового кирпича, занимающая стратегическую позицию вдоль Нила. Эти крепости контролируют речное движение и служат убежищем от набегов пустыни." #NT!
 nd_nub_monastery: "Нубийский монастырь" #NT!
 nd_nub_monastery_desc: "Центр христианской преданности и обучения, где монахи хранят рукописи на греческом, коптском и старнубийском языках. Скрипторий монастыря и расписанная часовня привлекают паломников со всего христианского мира." #NT!
 nd_nub_gold_camp: "Лагерь по переработке золота" #NT!
 nd_nub_gold_camp_desc: "Горнодобывающий лагерь в Восточной пустыне, где золотосодержащий кварц дробят и промывают для извлечения драгоценного металла, который сделал Нубию богатой со времен фараонов." #NT!
 nd_nub_ivory_warehouse: "Склад слоновой кости" #NT!
 nd_nub_ivory_warehouse_desc: "Укреплённый склад, где собирают, сортируют и готовят бивни из слоновой кости из внутренних районов Африки для продажи средиземноморским торговцам. Положение Нубии на берегу Нила делает ее естественным перевалочным пунктом для торговли предметами роскоши." #NT!
 nd_nub_pottery_workshop: "Гончарная мастерская" #NT!
 nd_nub_pottery_workshop_desc: "Мастерская, производящая характерную для Нубии расписную керамику, сосуды, украшенные христианскими символами и геометрическими узорами в стиле, уникальном для долины Нила." #NT!
 nd_nub_madrasa: "Нубийское медресе" #NT!
 nd_nub_madrasa_desc: "Исламская школа обучения, основанная в период Фунджа, где ученые преподают теологию, право и естественные науки, соединяя Нубию с более широким интеллектуальным миром ислама." #NT!
 nd_nub_saqia_operation: "Операция Сакия" #NT!
 nd_nub_saqia_operation_desc: "Для обслуживания водяного колеса с приводом от быков требуется домашний скот для привода механизма и древесина для ремонта деревянных шестерен и ведер." #NT!
 nd_nub_fortress_upkeep: "Содержание крепости" #NT!
 nd_nub_fortress_upkeep_desc: "Для содержания каменных укреплений Нила необходим постоянный запас тесаного камня для ремонта и оружия для вооружения гарнизона." #NT!
 nd_nub_monastery_maintenance: "Содержание монастыря" #NT!
 nd_nub_monastery_maintenance_desc: "Монастырю требуется пчелиный воск для свечей и богослужений, а также бумага для скриптория, где монахи копируют рукописи." #NT!
 nd_nub_gold_processing: "Обработка золота" #NT!
 nd_nub_gold_processing_desc: "Древесина служит топливом для костров, используемых для нагревания золотосодержащих пород перед дроблением и извлечения драгоценного металла, который сделал Нубию богатой со времен фараонов." #NT!
 nd_nub_ivory_storage: "Хранение слоновой кости" #NT!
 nd_nub_ivory_storage_desc: "Хранение и защита ценных бивней из слоновой кости требует надежных складов древесины и тщательного обращения." #NT!
 nd_nub_pottery_production: "Гончарное производство" #NT!
 nd_nub_pottery_production_desc: "Нубийские гончары лепят из местной глины сосуды и украшают их характерными расписными узорами с использованием красителей, создавая знаменитую керамику долины Нила." #NT!
 nd_nub_madrasa_upkeep: "Содержание медресе" #NT!
 nd_nub_madrasa_upkeep_desc: "Медресе необходим постоянный запас бумаги для рукописей, учебников и студенческих упражнений." #NT!
 nd_nub_nile_trade: "Нильский коридор Торговля" #NT!
 nd_nub_nile_trade_desc: "Переработка экзотических африканских товаров (меха, шкуры и красители) для продажи средиземноморским купцам через торговый коридор Нила." #NT!
 nd_nub_leatherworking: "Нубийское кожевенное дело" #NT!
 nd_nub_leatherworking_desc: "Преобразование шкур домашнего скота в изысканные изделия из кожи с использованием красителей и технологий, отточенных поколениями в условиях пустынного климата." #NT!
 nd_nub_incense_trade: "Обработка благовоний" #NT!
 nd_nub_incense_trade_desc: "Переработка и упаковка ароматических смол Африканского Рога для продажи через торговые сети Красного моря." #NT!
 levy_nd_nub_archers: "Нубийский лучник Леви" #NT!
 levy_nd_nub_archers_desc: "Крестьяне и солдаты, обученные традиционному нубийскому искусству владения большим длинным луком, были призваны к оружию в трудную минуту." #NT!
 levy_nd_nub_horsemen: "Нильские всадники Леви" #NT!
 levy_nd_nub_horsemen_desc: "Дворяне и солдаты Нильского коридора, верхом на крепких лошадях и вооруженные копьями и луками, собирались в качестве кавалерийских рекрутов." #NT!
 nd_nub_metalworking: "Нубийская металлообработка" #NT!
 nd_nub_metalworking_desc: "Переработка железной и медной руды из Восточной пустыни с использованием традиционных нубийских технологий плавки." #NT!
 nd_nub_date_wine: "Обработка финикового вина" #NT!
 nd_nub_date_wine_desc: "Ферментация фиников из пальм долины Нила в вино — традиция производства напитков, уходящая корнями в эпоху фараонов." #NT!
 nd_nub_cotton_weaving: "Нубийское хлопковое ткачество" #NT!
 nd_nub_cotton_weaving_desc: "Ткачество из хлопка-сырца тонкой ткани, окрашенной в яркие цвета, — текстильная традиция, которая связывает нубийских мастеров с рынками Африки и Ближнего Востока." #NT!
 nd_nub_sennar_commerce: "Сеннарская рыночная торговля" #NT!
 nd_nub_sennar_commerce_desc: "Шумные рынки Сеннара торгуют серебром и экзотическими товарами, соединяя Нубию с более широким торговым миром." #NT!
 nd_nub_nile_metalwork: "Нил Металлоконструкции" #NT!
 nd_nub_nile_metalwork_desc: "Нубийские кузнецы перерабатывают железо и медь из Восточной пустыни в инструменты, оружие и декоративные предметы, поддерживая сельское хозяйство и войну вдоль Нила.\n\n#italic Доступно в: $nd_nub_nile_fortress$#!" #NT!
 nd_nub_formed_tt: "Нубия была образована" #NT!
 nd_nub_path_a_tt: "Выбрал страну лука" #NT!
 nd_nub_path_b_tt: "Выбрал Золотой Коридор" #NT!
 nd_nub_destiny: "Судьба Нубии" #NT!
 nd_nub_destiny_desc: "Нубийские земли снова объединились. Будь то лук или торговый путь, судьба королевства ждет вас." #NT!
 nd_nub_dest_upper_nile: "Верхний Нил под защитой" #NT!
 nd_nub_dest_upper_nile_desc: "Завоюйте Верхний Египет и обеспечьте безопасность коридора Нила от водопадов до подступов к дельте. Требуется владение Асуаном и Кусом и 30-тысячная армия." #NT!
 nd_nub_dest_horn_march: "Марш за пределами" #NT!
 nd_nub_dest_horn_march_desc: "Распространите нубийскую военную мощь на Эфиопское нагорье и Кордофанскую степь. Требуется владение Аксумом и Эль-Обейдом, армия численностью 50 000 человек и престиж 50." #NT!
 nd_nub_dest_pharaoh: "Фараон Куша" #NT!
 nd_nub_dest_pharaoh_desc: "Осуществите мечту 25-й династии, управляйте Египтом из Каира и командуйте священными городами Аравии. Требуется владение Каиром и Меккой, армия численностью 75 000 человек, престиж 75 и 3 000 золота." #NT!
 nd_nub_dest_ivory_road: "Дорога слоновой кости" #NT!
 nd_nub_dest_ivory_road_desc: "Сделать Нубию воротами для выхода африканской слоновой кости на мировые рынки. Требуется 1000 золота, банковское учреждение и слоновая кость, продаваемая на национальном рынке." #NT!
 nd_nub_dest_red_sea: "Ворота Красного моря" #NT!
 nd_nub_dest_red_sea_desc: "Захватить порт Массауа и соединить Нильский коридор с Индийским океаном. Требуется владение Массавой, 2000 золота, общее развитие 1000 и жемчуг на рынке капитала." #NT!
 nd_nub_dest_crossroads: "Перекресток мира" #NT!
 nd_nub_dest_crossroads_desc: "Контролируйте торговые пути, связывающие Африку, Аравию и Индийский океан. Требуется владение Джиддой и Аденом, 3000 золота и престиж 75." #NT!
 nd_nub.6.t: "Судьба Нубии" #NT!
 nd_nub.6.d: "Нубийское королевство воссоединилось, его народ гордится собой, а границы безопасны. Древнее наследие Куша, Мероэ, Макурии и Алодии живет в каждой каменной крепости вдоль Нила и в каждой молитве в каждой церкви и мечети. Теперь вопрос переходит от выживания к амбициям. Какой след оставит в мире восстановленная Нубия?" #NT!
 nd_nub.6.a: "Наша судьба ждет." #NT!
 nd_nub.7.t: "Верхний Нил под защитой" #NT!
 nd_nub.7.d: "Нубийские армии двинулись на север за водопады и захватили Асуан и Кус. Впервые со времен великих фараонов 25-й династии кушитские солдаты стоят на страже Верхнего Египта. Древние храмы Филе и Эдфу, построенные в те времена, когда нубийские короли носили двойную корону, снова находятся под защитой нубийского государства. Феллахи долины Нила поднимают головы со своих полей и видят темнокожих воинов, чьи предки когда-то правили от Мемфиса до Напаты." #NT!
 nd_nub.7.a: "Потоки склоняются перед нами." #NT!
 nd_nub.8.t: "Марш за пределами" #NT!
 nd_nub.8.d: "Армии Нубии достигли того, чего не удавалось ни одному нильскому королевству на протяжении веков. На западе Кордофанская степь с ее богатством скота и железа подчиняется власти Нубии. На юге пал древний соперник Аксум, в его горных крепостях теперь стоят нубийские войска. Стратегическое положение королевства является грозным. Он контролирует Нил, побережье Красного моря и подходы к Египту и Африканскому Рогу.\n\nНо способ нашей экспансии определяет наш характер. Должны ли мы оседлать ярость наших воинов, неустанно продвигаясь вперед? Или нам следует консолидировать наши достижения посредством тщательной логистики, создавая инфраструктуру прочной империи?" #NT!
 nd_nub.8.a: "Ярость и импульс: пусть ничто не встанет перед нами." #NT!
 nd_nub.8.b: "Укрепляйте, снабжайте, консолидируйте: затем продвигайтесь вперед." #NT!
 nd_nub.9.t: "Фараон Куша" #NT!
 nd_nub.9.d: "Это сделано. Нубийский король сидит в Каире, как когда-то Пийе и Тахарка сидели в Мемфисе. Пирамиды Гизы и пирамиды Мероэ объединены под единой короной впервые за более чем две тысячи лет. Священный город Мекка признает сюзеренитет Нубии. От Средиземного до Красного моря, от водопадов до Аравийской пустыни, на земле, которую Египет когда-то называл «несчастным Куш», возникла новая империя.\n\nКак фараон Куша будет управлять этими обширными владениями? Как завоеватель, чьи армии сохраняют мир превосходящей силой? Или как божественный правитель, чья легитимность вытекает из древних традиций нубийских и египетских царств?" #NT!
 nd_nub.9.a: "Мы победители: наши армии — наш закон." #NT!
 nd_nub.9.b: "Мы божественный правитель двух земель." #NT!
 nd_nub.10.t: "Дорога слоновой кости" #NT!
 nd_nub.10.d: "Торговцы слоновой костью в Нубии создали коммерческую сеть, простирающуюся от слоновьих угодий во внутренних районах Африки до банковских домов Средиземноморья. Бивни, которые когда-то продавались горсткой на деревенских рынках, теперь тоннами проходят через нубийские склады, сортируются, обрабатываются и отправляются покупателям по всему известному миру. Банковское учреждение укоренилось, и золото течет в казну Нубии так же уверенно, как Нил течет на север." #NT!
 nd_nub.10.a: "Дороги из слоновой кости сделают нас сверх меры богатыми." #NT!
 nd_nub.11.t: "Ворота Красного моря" #NT!
 nd_nub.11.d: "Порт Массауа наш, а вместе с ним и контроль над западным берегом Красного моря. Нубия теперь контролирует как Нильский коридор, так и морской путь к Индийскому океану. Жемчуг из Красного моря, специи из Индии и шелк из Китая проходят через гавани, контролируемые нубийцами, наряду со слоновой костью, золотом и благовониями, которые всегда были предметом торговли королевства.\n\nНо Красное море — это спорные воды. Должны ли мы инвестировать в контроль над самими морскими путями, создавая флот для обеспечения нашей морской торговли? Или нам следует сосредоточиться на том, чтобы сделать наши порты наиболее эффективными и иметь лучшие связи в регионе, привлекая торговлю за счет институционального совершенства?" #NT!
 nd_nub.11.a: "Управляйте морскими путями: наш флот будет охранять наши богатства." #NT!
 nd_nub.11.b: "Постройте лучшие порты на Красном море." #NT!
 nd_nub.12.t: "Перекресток мира" #NT!
 nd_nub.12.d: "Нубийские торговцы работают в Джидде и Адене. Королевство, которое когда-то контролировало лишь узкую полоску Нила, теперь контролирует узел, где сходятся торговые пути Африки, Аравии и Индийского океана. Золото из Восточной пустыни, слоновая кость из внутренних районов, ладан из Рога, жемчуг из Красного моря, специи из Индии: все проходит через руки нубийцев. Коммерческий класс Сеннара и Суакина стал одним из самых богатых в регионе.\n\nСможем ли мы расширить свое влияние через Индийский океан, создав военно-морское присутствие, которое распространит нубийскую мощь на отдаленные берега? Или нам следует обратиться внутрь себя, используя наше богатство для создания инфраструктуры, которая сделает Нубию незаменимым центром, где сходятся все дороги?" #NT!
 nd_nub.12.a: "Наши корабли пойдут в Индию и за ее пределы." #NT!
 nd_nub.12.b: "Все дороги ведут через Нубию." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_warrior_fury: "Ярость лучников" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_warrior_fury: "Импульс нубийских завоеваний способствует быстрому усилению и резкому восстановлению морального духа, хотя гордость воинов порождает самоуспокоенность дома." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_logistic_war: "Логистика Империи" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_logistic_war: "Эффективные линии снабжения и быстрый набор персонала создают военную машину, которая поддерживает расширение, хотя стоимость постоянной мобилизации напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_nile_conqueror: "Покоритель Нила" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_nile_conqueror: "Фараон Куша правит, используя подавляющую военную силу, поддерживая дешевые армии и наемников и одновременно объявляя войну по своему желанию." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_divine_pharaoh: "Божественный фараон" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_divine_pharaoh: "Фараон Куша опирается на древние традиции божественного царствования, требуя лояльности подданных и уважения соперников за столом переговоров." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_sea_lanes: "Доминион Красного моря" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_sea_lanes: "Нубийские флоты патрулируют Красное море, обеспечивая безопасность торговых путей и блокируя соперников, хотя сосредоточенность на море приводит к тому, что сухопутные силы на марше истощаются." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_port_mastery: "Порт мира" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_port_mastery: "Нубийские порты становятся центрами институционального обмена и разведки, привлекая как ученых, так и шпионов, хотя космополитический характер подрывает традиционный престиж." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_indian_ocean: "Индийский океан" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_indian_ocean: "Нубийские торговые суда и военные корабли курсируют по Индийскому океану, проецируя свое влияние посредством торговли и военно-морской силы через постоянно расширяющуюся дипломатическую сеть." #NT!
 STATIC_MODIFIER_NAME_nd_nub_dest_continental_hub: "Континентальный Нексус" #NT!
 STATIC_MODIFIER_DESC_nd_nub_dest_continental_hub: "Нубия инвестирует свои торговые богатства в инфраструктуру и интеграцию, создавая континентальный перекресток, на котором товары и люди сходятся с минимальными затратами." #NT!
 nd_nub_throne_of_kush: "Трон Куша" #NT!
 nd_nub_throne_of_kush_desc: "Величественный военный командный центр и королевская резиденция, созданная по образцу древних дворцов Напата и Мероэ, из которых фараон Куша руководит армиями восстановленной империи." #NT!
 nd_nub_throne_provisioning: "Королевская оружейная палата" #NT!
 nd_nub_throne_provisioning_desc: "Оружие, боевые кони, тесаный камень для укреплений и кожаная сбруя поддерживают гарнизон и снабжают армии кушитской короны." #NT!
 nd_nub_nile_emporium: "Нил Эмпориум" #NT!
 nd_nub_nile_emporium_desc: "Огромный торговый комплекс, где под одной крышей продаются слоновая кость, благовония, золото и экзотические товары с трех континентов, жемчужина торговой империи Нубии." #NT!
 nd_nub_emporium_trade: "Операции в торговом центре" #NT!
 nd_nub_emporium_trade_desc: "Слоновая кость, благовония, тонкая ткань и бумага текут по складам и счетным домам торгового центра." #NT!
 nub_eparchate_of_nobadia_bureaucracy: "Епархат Нобадии" #NT!
 nub_eparchate_of_nobadia_bureaucracy_desc: "Высший провинциальный офис Кристиана Макурии, наместника, управляющего северными нубадийскими землями от Фараса, а затем от Касра Ибрима. Епарх (в своих письмах именуемый «Владыкой горы», а в греческой переписке — «доместикос») курировал египетскую границу, регулировал выдачу разрешений на проезд через водопады, контролировал обмен бактов и подчинялся непосредственно королю Старой Донголы. Офис задокументирован в древненубийских письмах и записях канцелярии мамлюков VIII-XIII веков." #NT!
 nub_baqt_treaty_bureaucracy: "Система договора Бакта" #NT!
 nub_baqt_treaty_bureaucracy_desc: "Уникальный дипломатическо-торговый пакт, заключенный около 652 года между Мукурией и арабскими правителями Египта, продлившийся более шести столетий, стал самым давним договором между мусульманской державой и христианским государством в средневековом мире. Ежегодный обмен отправлял рабов, слоновую кость и жирафов на север в обмен на зерно, вино, ткани и лошадей на юг, проводимый наемными нубийскими агентами и торговцами-зимми по королевскому ордеру. Функционально являясь постоянным министерством иностранных дел, Бакт также поддерживал постоянный мир, в отличие от всех остальных христианских соседей халифата." #NT!
 nub_faras_bishopric_bureaucracy: "Фарасская епархия" #NT!
 nub_faras_bishopric_bureaucracy_desc: "Кафедральный собор Пахораса (Фараса), резиденция назначенного коптами митрополита Нубии. В его скриптории производились древненубийские литургические рукописи; его расписные стены (архангелы, изображения Рождества и епископы на синкретической византийско-африканской идиоме, обнаруженной археологами в 1961 году) узаконивали как королей, так и духовенство. Епископство управляло церковными землями на севере, вело календарь и обучало грамотного духовенства, которое укомплектовывало все остальные учреждения христианского Нубийского государства." #NT!
 nub_sennar_palace_bureaucracy: "Администрация Сеннарского дворца" #NT!
 nub_sennar_palace_bureaucracy_desc: "Двор султана Фунджа в Сеннаре (основанный в 1504 г.) был организован вокруг наследника-визиря манджила, кади аль-куды и иерархии дворцовых офисов, укомплектованных солдатами-рабами из Джеллабы и писцами Джаалийин. Он заменил королевскую власть христианской эпохи исламским абсолютистским двором, сохранив при этом старые африканские церемониалы. Шотландский путешественник Джеймс Брюс, достигший Сеннара в 1772 году, назвал его «африканской империей с мусульманским фасадом»." #NT!
 nub_hamaj_regency_bureaucracy: "Хамадж Ридженси" #NT!
 nub_hamaj_regency_bureaucracy_desc: "После переворота 1761 года регенты-визири Хамаджа, набранные из знати Фундж-Джаалийин, затмили султанов Сеннара и правили через совет глав племенных линий. Корона сохранилась только номинально; реальная власть перешла к великим кланам Бутана и конфедерации Джаалийин. Эта договоренность стабилизировала царство в его упадке, предоставив благородно-племенной аристократии формальный голос, но подорвало центральную власть до тех пор, пока египетское вторжение 1820 года не положило конец султанату." #NT!
 AUTO_MODIFIER_NAME_nd_nub_bureaucracy_authority: "Постоянный административный аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_nub_bureaucracy_authority: "Многослойное институциональное наследие Нубии (христианский епархат водопадов, дипломатический аппарат Бакта, кафедральный собор, а также более поздний дворец Фундж и регентство Хамадж) обеспечивает основу для двух постоянных бюрократий, а столица предоставляет третью." #NT!
