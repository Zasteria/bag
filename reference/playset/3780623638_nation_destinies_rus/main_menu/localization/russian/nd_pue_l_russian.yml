l_russian:
 STATIC_MODIFIER_NAME_nd_path_of_pope: "Путь Папе" #NT!
 STATIC_MODIFIER_DESC_nd_path_of_pope: "В духе Попе, лидера тева, который объединил пуэбло против испанской тирании, «Объединенные пуэбло» придерживаются воинских традиций. Никакая иностранная держава не сможет снова подчинить себе эти земли." #NT!
 STATIC_MODIFIER_NAME_nd_path_of_the_kiva: "Путь Кивы" #NT!
 STATIC_MODIFIER_DESC_nd_path_of_the_kiva: "Кива, как всегда, остается под землей. Благодаря церемониям, священным знаниям, а также узам клана и общины объединенные пуэбло сохранят свои древние обычаи и процветут в мудрости." #NT!
 nd_pue.1.t: "Объединенное восстание пуэбло" #NT!
 nd_pue.1.d: "На протяжении поколений народы юго-западной пустыни жили в своих многоэтажных глинобитных поселениях: керес в Акоме и Лагуне, таноанцы вдоль реки Рио-Гранде, зуни в своей древней крепости, хопи на далеких горах. Каждый пуэбло управлялся посредством советов старейшин и матерей клана, объединенных традициями качина, связывающими землю с небом. Теперь впервые пуэбло решили объединиться как одна нация. Вопрос, стоящий перед советом, заключается не в том, объединяться ли, а в том, чем станет Объединенное Пуэбло. Некоторые вспоминают Папе, чья узловатая веревка однажды сплотила всех пуэбло против общего врага. Другие говорят о киве: подземном сердце, где сохраняются знания и проводятся церемонии, поддерживающие мир. Оба пути ведут к силе, но разные.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pue.1.a: "Мы будем, как Папа Римский, непреклонны в защите нашего народа." #NT!
 nd_pue.1.b: "Кива терпит. Наша сила проистекает из священной традиции." #NT!
 STATIC_MODIFIER_NAME_nd_pue_revolt_spirit_unified: "Дух восстания, единства" #NT!
 STATIC_MODIFIER_DESC_nd_pue_revolt_spirit_unified: "Скоординированное восстание сплотило пуэбло в единую боевую силу, готовую защитить свою родину от любого агрессора." #NT!
 STATIC_MODIFIER_NAME_nd_pue_revolt_spirit_restored: "Дух восстания, восстановления" #NT!
 STATIC_MODIFIER_DESC_nd_pue_revolt_spirit_restored: "С разрушенными чужеземными алтарями и возвращением к свету масок качина древние обычаи вернулись на свое законное место." #NT!
 STATIC_MODIFIER_NAME_nd_pue_turquoise_road_wealth: "Бирюзовая дорога, Торговля" #NT!
 STATIC_MODIFIER_DESC_nd_pue_turquoise_road_wealth: "Возрождение древних торговых путей из бирюзы приносит богатство через мастерские и рынки индейцев." #NT!
 STATIC_MODIFIER_NAME_nd_pue_turquoise_road_prestige: "Бирюзовая Дорога, Престиж" #NT!
 STATIC_MODIFIER_DESC_nd_pue_turquoise_road_prestige: "Отличительный сине-зеленый камень пуэбло стал знаком статуса и изысканности в торговых сетях, возвысив имя пуэбло." #NT!
 nd_pue.2.t: "Завязанный шнур" #NT!
 nd_pue.2.d: "Летом 1680 года вождь Попе послал в каждый пуэбло гонцов с завязанными веревками. Каждый узел отмечал день, оставшийся до скоординированного восстания против испанского колониального правления. Когда шнуры кончились, пуэбло поднялись как один. Попе, знахарь племени Тева из Окай-Овинге, которого выпороли и заключили в тюрьму за исповедание старой религии, создал тайный союз, охватывающий сотни миль, от Таоса на севере до столовых гор хопи далеко на западе. Восстание убило четыреста испанцев и вытеснило оставшиеся две тысячи поселенцев на юг, в Эль-Пасо. В течение двенадцати лет пуэбло управляли сами собой: сносили церкви, восстанавливали кивы и возрождали церемонии качина, которые испанцы пытались уничтожить. Это было самое успешное восстание коренных народов против европейского колониализма в Америке.\n\nДух того дня живёт. Как мы будем чтить наследие Папе и воинов, сражавшихся рядом с ним?" #NT!
 nd_pue.2.a: "Завязанная веревка по-прежнему связывает нас: наше единство — наше оружие." #NT!
 nd_pue.2.b: "Мы боролись за восстановление наших священных путей. Пусть они снова процветают." #NT!
 nd_pue.3.t: "Бирюзовая дорога" #NT!
 nd_pue.3.d: "Задолго до того, как пуэбло носили свои нынешние названия, древние народы каньона Чако построили торговую сеть, простирающуюся на сотни миль. Только в стенах Пуэбло Бонито было найдено более пятидесяти тысяч кусочков бирюзы, больше, чем на любом другом археологическом объекте на Юго-Западе вместе взятом. Сине-зеленый камень путешествовал по удивительно прямым и широким дорогам, соединяя отдаленные поселения с церемониальным центром. Перья ара пришли на север из Мезоамерики; снаряды прибыли с побережья Тихого океана; медные колокольчики из далеких мастерских.\n\nХотя сам Чако замолчал много веков назад, знания об этих дорогах и искусство обработки бирюзы никогда не исчезали. Ремесленники-пуэбло из Кереса, Зуни и Хопи поддерживают традицию огранки и полировки камня с использованием методов, передаваемых из поколения в поколение. Возрождение этих торговых связей предлагает выбор." #NT!
 nd_pue.3.a: "Бирюза – богатство. Пусть торговля течет и обогащает наш народ." #NT!
 nd_pue.3.b: "Бирюзовый – это наследие. Пусть его красота расскажет миру о нашем имени." #NT!
 nd_pue.4.t: "Танец Качин" #NT!
 nd_pue.4.d: "Глубоко в подземной киве появились танцоры в масках. Церемония качина (цикл танцев, приносящий дождь полям, здоровье людям и гармонию между живыми и духами) достигла своего полного выражения во всем объединенном пуэбло. В западных пуэбло танцоры хопи и зуни носят искусно вырезанные и раскрашенные маски, изображающие сотни различных духов качина, каждый из которых играет определенную роль в космическом порядке. В восточных пуэбло вдоль Рио-Гранде церемонии приобретают свой собственный характер, смешиваясь с системой общин, разделяющей каждую общину на взаимодополняющие половины.\n\nТрадиция качина — это больше, чем просто религия. Это механизм, с помощью которого вновь прибывшие интегрируются в жизнь пуэбло, споры разрешаются посредством ритуалов, а не насилия, и поддерживается сельскохозяйственный календарь. Появление танцоров из кивы — это возникновение порядка из хаоса, общности из разбросанных семей." #NT!
 nd_pue.4.a: "Качины танцуют. Мир обновляется." #NT!
 nd_pue_defensive_architecture: "Оборонительная архитектура Пуэбло" #NT!
 nd_pue_defensive_architecture_desc: "Древние строители-пуэбло строили многоэтажные глинобитные комплексы без дверей и окон на уровне земли. Вход осуществлялся по лестницам через люки в крыше, которые можно было поднять во время атак." #NT!
 nd_pue_desert_archery: "Пустынная стрельба из лука" #NT!
 nd_pue_desert_archery_desc: "Воины-луки пуэбло разработали методы, подходящие для засушливого ландшафта, используя местность гор, каньонов и арройо для максимального защитного преимущества." #NT!
 nd_pue_acequia_irrigation: "Ирригация Асекии" #NT!
 nd_pue_acequia_irrigation_desc: "Общественные оросительные каналы с самотеком отводили воду из Рио-Гранде и ее притоков на поля кукурузы, фасоли, тыквы, хлопка и табака." #NT!
 nd_pue_kiva_tradition: "Кива Традиция" #NT!
 nd_pue_kiva_tradition_desc: "Кива, подземная церемониальная палата, служила религиозным, политическим и социальным сердцем каждого пуэбло, где сохранялись и передавались священные знания." #NT!
 nd_pue_turquoise_trade: "Бирюзовый Трейд" #NT!
 nd_pue_turquoise_trade_desc: "Ремесленники-пуэбло унаследовали традиции обработки бирюзы каньона Чако, производя украшения, подвески и инкрустированные предметы для торговли на юго-западе и за его пределами." #NT!
 nd_pue_clan_governance: "Управление кланом" #NT!
 nd_pue_clan_governance_desc: "Сообщества пуэбло управлялись посредством взаимосвязанных систем кланов и группировок. Решения принимались советами старейшин, представляющих каждый клан, обеспечивая стабильность путем консенсуса." #NT!
 nd_pue_multistory_pueblos: "Многоэтажные Пуэбло" #NT!
 nd_pue_multistory_pueblos_desc: "Архитекторы Пуэбло усовершенствовали методы строительства четырех- и пятиэтажных жилых комплексов из самана и песчаника, в которых проживают сотни семей в интегрированных сообществах." #NT!
 nd_pue_pottery_mastery: "Мастерство гончарного дела Пуэбло" #NT!
 nd_pue_pottery_mastery_desc: "Отличительные традиции черно-белой и полихромной керамики пуэбло достигли новых высот мастерства, при этом в каждой деревне развивались узнаваемые стили." #NT!
 nd_pue_communal_militia: "Коммунальная милиция" #NT!
 nd_pue_communal_militia_desc: "Защита пуэбло была организована через систему фракций, где каждая половина общины отвечала за воспитание и подготовку воинов для защиты поселения." #NT!
 nd_pue_waffle_gardens: "Вафельные сады" #NT!
 nd_pue_waffle_gardens_desc: "Зуни усовершенствовали вафельный сад: заглубленные решетчатые грядки, окруженные низкими земляными стенами, которые улавливали и сохраняли драгоценную влагу в засушливом ландшафте." #NT!
 nd_pue_kachina_ceremonies: "Церемонии Качина" #NT!
 nd_pue_kachina_ceremonies_desc: "Сложный цикл танцев качина в масках представлял сотни духовных существ, каждое из которых связано с определенными аспектами дождя, плодородия, исцеления и космического порядка." #NT!
 nd_pue_pueblo_trade_fairs: "Ярмарки Пуэбло" #NT!
 nd_pue_pueblo_trade_fairs_desc: "Сезонные собрания в крупных пуэбло служили торговыми ярмарками, на которых керамика, бирюза, хлопчатобумажные ткани, продукты питания и товары из отдаленных регионов переходили из рук в руки." #NT!
 nd_pue_warrior_societies: "Общества воинов" #NT!
 nd_pue_warrior_societies_desc: "В каждом пуэбло существовали воинские общества, связанные с традицией качина. Посвященные проходили тщательное обучение и церемониальную подготовку, прежде чем стать хранителями сообщества." #NT!
 nd_pue_mesa_scouts_tradition: "Традиция скаутов Месы" #NT!
 nd_pue_mesa_scouts_tradition_desc: "Быстрые бегуны и разведчики обучались перемещаться по обширной пустынной местности между пуэбло, выступая одновременно в качестве посыльных и разведывательных сил против приближающихся угроз." #NT!
 nd_pue_pueblo_diplomacy: "Дипломатия Пуэбло" #NT!
 nd_pue_pueblo_diplomacy_desc: "Несмотря на то, что пуэбло говорили на нескольких несвязанных языках, они поддерживали дипломатические отношения посредством общих церемониальных традиций, торгового партнерства и смешанных браков между кланами." #NT!
 nd_pue_oral_traditions: "Устные традиции" #NT!
 nd_pue_oral_traditions_desc: "Священные повествования, астрономические знания, сельскохозяйственные календари и историческая память сохранялись благодаря сложным устным традициям, передаваемым от старейшин к посвященным внутри кив." #NT!
 nd_pue_cotton_weaving: "Хлопковое Ткачество" #NT!
 nd_pue_cotton_weaving_desc: "Ткачи-пуэбло выращивали хлопок на орошаемых полях и производили ткани замечательного качества, используя натуральные красители и сложные узоры как для домашнего использования, так и для торговли." #NT!
 nd_pue_inter_pueblo_council: "Интер-Пуэбло Совет" #NT!
 nd_pue_inter_pueblo_council_desc: "По мере того как пуэбло сближались, представители каждой общины начали собираться в формальный совет для координации обороны, управления общими водными ресурсами и разрешения споров." #NT!
 nd_pue_mesa_fortification: "Укрепление Месы" #NT!
 nd_pue_mesa_fortification_desc: "Хопи и другие западные пуэбло строили свои поселения на отвесных горах, создавая естественные крепости, доступные только по крутым узким тропам, которые легко защитить от любого нападения." #NT!
 nd_pue_pueblo_revolt: "Восстание пуэбло" #NT!
 nd_pue_pueblo_revolt_desc: "В 1680 году Папа Окай Овинге организовал самое успешное восстание коренных народов в американской истории, координируя нападения на десятки пуэбло, чтобы изгнать испанское колониальное господство." #NT!
 nd_pue_spiritual_restoration: "Духовное восстановление" #NT!
 nd_pue_spiritual_restoration_desc: "После восстания Попе путешествовал из одного пуэбло в другой, приказывая разрушить церкви, восстановить кивы и возродить запрещенные церемонии качина." #NT!
 nd_pue_guerrilla_tactics: "Партизанская тактика" #NT!
 nd_pue_guerrilla_tactics_desc: "Восстание продемонстрировало мастерство пуэбло в партизанской войне, одновременных атаках, выжженной земле и использовании пустынной местности, по которой не могла пройти ни одна иностранная армия." #NT!
 nd_pue_horse_adoption: "Усыновление лошади" #NT!
 nd_pue_horse_adoption_desc: "Отступление испанцев оставило после себя лошадей, которые изменили мобильность пуэбло. Воины-пуэбло быстро освоили конную войну, объединив ее с имеющимися у них знаниями ведения боя в пустыне." #NT!
 nd_pue_confederacy: "Конфедерация Пуэбло" #NT!
 nd_pue_confederacy_desc: "Альянс нескольких пуэбло, созданный в результате восстания Попе (охватывающий Тева, Тива, Това, Керес, Зуни и хопи), доказал, что автономные пуэбло могут действовать как единая нация, когда этого требует выживание." #NT!
 nd_pue_trade_restoration: "Восстановление торговли" #NT!
 nd_pue_trade_restoration_desc: "После снятия колониальных ограничений традиционные торговые сети между пуэбло и соседними народами были восстановлены, восстановив поток бирюзы, керамики, текстиля и продуктов питания." #NT!
 nd_pue_unified_council: "Единый Совет" #NT!
 nd_pue_unified_council_desc: "Постоянный совет представителей всех пуэбло официально превратил специальные союзы эпохи восстания в постоянный институт коллективного управления." #NT!
 nd_pue_enduring_resistance: "Устойчивое сопротивление" #NT!
 nd_pue_enduring_resistance_desc: "Память о восстании и последовавших за ним двенадцати годах самоуправления привили традицию дисциплинированного и непреклонного сопротивления любой внешней угрозе." #NT!
 nd_pue_advanced_irrigation: "Расширенное орошение" #NT!
 nd_pue_advanced_irrigation_desc: "Расширенная сеть асекии, улучшенные контрольные дамбы и усовершенствованные методы управления водными ресурсами позволили пуэбло поддерживать большее количество населения на засушливом юго-западе." #NT!
 nd_pue_artistic_renaissance: "Пуэбло Художественный Ренессанс" #NT!
 nd_pue_artistic_renaissance_desc: "Новые стили керамики, изделия из серебра, полученные и преобразованные на основе испанских техник, а также инновации в ткачестве ознаменовали расцвет художественного самовыражения пуэбло." #NT!
 nd_pue_mounted_tradition: "Традиция конного воина" #NT!
 nd_pue_mounted_tradition_desc: "Заимствование лошадей из испанского отступления породило новую традицию конной войны в пустыне, сочетающую знание пуэбло местности с мобильностью кавалерии." #NT!
 nd_pue_territorial_defense: "Территориальная оборона" #NT!
 nd_pue_territorial_defense_desc: "Интегрированная система сторожевых вышек, сигнальных огней, опорных пунктов в горах и скоординированные действия ополченцев превратили разрозненные пуэбло в сплоченную оборонительную сеть." #NT!
 nd_pue_diplomatic_pragmatism: "Дипломатический прагматизм" #NT!
 nd_pue_diplomatic_pragmatism_desc: "Лидеры пуэбло научились натравливать колониальные державы друг против друга, добиваться выгодных условий путем переговоров и поддерживать автономию посредством проницательной дипломатии, а не только силы." #NT!
 nd_pue_sovereignty: "Суверенитет Пуэбло" #NT!
 nd_pue_sovereignty_desc: "Утверждение государственности пуэбло (права на самоуправление, территориальную целостность и культурное самоопределение) как вопрос устоявшегося принципа, а не стремления." #NT!
 nd_pue_cultural_preservation: "Культурное сохранение" #NT!
 nd_pue_cultural_preservation_desc: "Перед лицом модернизации и внешнего давления пуэбло взялись за сознательное сохранение языка, церемоний, ремесленных традиций и общинного землевладения." #NT!
 nd_pue_modern_economy: "Современная экономика пуэбло" #NT!
 nd_pue_modern_economy_desc: "Традиционные ремесла (керамика, украшения из бирюзы, тканые ткани) нашли новые рынки и новое признание, сформировав основу устойчивой экономики, основанной на культурной самобытности." #NT!
 nd_pue_land_rights: "Права на землю и воду" #NT!
 nd_pue_land_rights_desc: "Обеспечение официального признания общинного землевладения и исконных прав на воду вдоль реки Рио-Гранде и ее притоков, обеспечение материальной основы жизни пуэбло." #NT!
 nd_pue_confederal_constitution: "Конфедеративная конституция" #NT!
 nd_pue_confederal_constitution_desc: "Письменная структура, кодифицирующая отношения между автономными пуэбло, создающая общие институты, сохраняя при этом право каждой общины на самоуправление." #NT!
 nd_pue_standing_army: "Постоянная армия" #NT!
 nd_pue_standing_army_desc: "Эволюция воинских обществ пуэбло в профессиональные силы обороны, сочетающие традиционные знания ведения войны в пустыне с современной военной организацией." #NT!
 a_nd_pue_bow_warriors: "Пуэбло Лук Воины" #NT!
 a_nd_pue_bow_warriors_desc: "Эти воины, опытные лучники пустыни, эксплуатирующие плоскогорья, каньоны и ручьи юго-запада, со смертельной точностью защищают поселения пуэбло." #NT!
 a_nd_pue_revolt_warriors: "Воины восстания" #NT!
 a_nd_pue_revolt_warriors_desc: "Партизаны, вдохновленные духом восстания Папе 1680 года, специализирующиеся на скоординированных засадах и освоении пустынной местности." #NT!
 a_nd_pue_pueblo_levy: "Пуэбло Леви Уорриорз" #NT!
 a_nd_pue_pueblo_levy_desc: "Коммунальная милиция, сформированная из поселений пуэбло через систему фракций. Упрямые защитники, которые сражаются сильнее всего, защищая свои дома." #NT!
 a_nd_pue_kachina_guardians: "Качина Стражи" #NT!
 a_nd_pue_kachina_guardians_desc: "Элитные воины из церемониальных обществ воинов, освященные ритуалом качина. Их присутствие на поле боя вселяет необыкновенное мужество." #NT!
 a_nd_pue_mesa_scouts: "Скауты Месы" #NT!
 a_nd_pue_mesa_scouts_desc: "Быстрые бегуны по пустыне, преодолевающие огромные расстояния между пуэбло, выступая в роли разведчиков и посыльных. Они знают каждый каньон, арройо и скрытый источник воды." #NT!
 a_nd_pue_mounted_warriors: "Конные воины Пуэбло" #NT!
 a_nd_pue_mounted_warriors_desc: "Кавалерия пуэбло обучалась традициям ведения войны в пустыне, сочетая наследственные знания местности с мобильностью лошадей, приобретенными после отступления испанцев." #NT!
 nd_pue_kiva: "Кива" #NT!
 nd_pue_kiva_desc: "Подземная церемониальная палата, где исполняются священные танцы, принимаются политические решения и устные традиции, связывающие общину, передаются каждому новому поколению." #NT!
 nd_pue_turquoise_workshop: "Бирюзовая мастерская" #NT!
 nd_pue_turquoise_workshop_desc: "Ремесленный центр, где бирюза, ракушки и медь перерабатываются в подвески, бусы и инкрустированные украшения с использованием техник, унаследованных от мастеров каньона Чако." #NT!
 nd_pue_granary: "Зернохранилище Пуэбло" #NT!
 nd_pue_granary_desc: "Общие помещения для хранения продуктов в многоэтажном глинобитном комплексе, изолированные от паразитов и влаги. Общее зернохранилище гарантирует, что ни одна семья не останется голодной, если урожай неурожайный." #NT!
 nd_pue_fortress: "Крепость Пуэбло" #NT!
 nd_pue_fortress_desc: "Многоэтажный глинобитный оборонительный комплекс без наземных входов. Доступ осуществляется по лестнице через люки в крыше, которые можно поднять за считанные секунды, превратив всю конструкцию в крепость." #NT!
 nd_pue_pottery_workshop: "Гончарная мастерская" #NT!
 nd_pue_pottery_workshop_desc: "Центр производства черно-белой и полихромной керамики Пуэбло, где ремесленники формируют, раскрашивают и обжигают керамику, используя методы, отточенные веками." #NT!
 nd_pue_cotton_hall: "Зал хлопкового ткачества" #NT!
 nd_pue_cotton_hall_desc: "Центр текстильного производства Пуэбло, где хлопок, выращенный на орошаемых полях, прядут и ткут ткани с использованием натуральных красителей и сложных геометрических узоров." #NT!
 nd_pue_watchtower: "Сторожевая башня Меса" #NT!
 nd_pue_watchtower_desc: "Каменная наблюдательная вышка, расположенная на вершине холма, является частью сети сигнальных станций, которая позволяет пуэбло координировать свою оборону на огромных расстояниях." #NT!
 nd_pue_trade_fair: "Торгово-выставочная площадка" #NT!
 nd_pue_trade_fair_desc: "Сезонное место сбора, где пуэбло и соседние народы обмениваются керамикой, бирюзой, хлопчатобумажными тканями, продуктами питания и товарами из разных торговых сетей." #NT!
 nd_pue_kiva_ceremonies: "Подношения для церемонии Кива" #NT!
 nd_pue_kiva_ceremonies_desc: "Регулярный цикл танцев качина и ритуалов очищения требует свечей из пчелиного воска, благовоний и глиняных сосудов, используемых в качестве священных подношений." #NT!
 nd_pue_turquoise_processing: "Бирюзовый гранильный станок" #NT!
 nd_pue_turquoise_processing_desc: "Искусство огранки, шлифовки и полировки бирюзы для изготовления украшений требует медных инструментов и серебряных оправ." #NT!
 nd_pue_granary_upkeep: "Обслуживание зернохранилища" #NT!
 nd_pue_granary_upkeep_desc: "Для поддержания общественных зернохранилищ в хорошем состоянии требуется древесина для балок, камень для саманной штукатурки и инструменты для текущего ремонта." #NT!
 nd_pue_fortress_maintenance: "Содержание крепости" #NT!
 nd_pue_fortress_maintenance_desc: "Массивные глинобитные стены необходимо постоянно защищать от эрозии, требуя камня для ремонта, древесины для поддержки конструкции и инструментов для работы." #NT!
 nd_pue_pottery_firing: "Обжиг керамики" #NT!
 nd_pue_pottery_firing_desc: "Местной глине придают форму, окрашивают минеральными пигментами и обжигают в тщательно управляемых открытых печах для производства характерной черно-белой и полихромной керамики Пуэбло." #NT!
 nd_pue_cotton_processing: "Переработка хлопка" #NT!
 nd_pue_cotton_processing_desc: "Хлопковые волокна, выращиваемые на орошаемых полях, прядут, окрашивают минеральными и растительными пигментами и ткут ткани замечательного качества." #NT!
 nd_pue_watchtower_upkeep: "Содержание Сторожевой Башни" #NT!
 nd_pue_watchtower_upkeep_desc: "Сторожевые башни на вершине холма требуют древесины для замены балок, камня для ремонта конструкций и инструментов для поддержания наблюдательных постов в рабочем состоянии." #NT!
 nd_pue_trade_fair_costs: "Обеспечение выставок" #NT!
 nd_pue_trade_fair_costs_desc: "Для проведения сезонных торговых ярмарок требуется домашний скот для совместного пиршества, керамика в качестве товаров для обмена и соль для сохранения продуктов питания и бартера." #NT!
 nd_pue_waffle_garden: "Фермерство вафельного сада" #NT!
 nd_pue_waffle_garden_desc: "Техника зуни: заглубленные решетчатые гряды, ограниченные низкими глиняными стенами, требующие деревянного каркаса, глины для земляных бордюров и инструментов для поддержания геометрии орошения." #NT!
 nd_pue_acequia_method: "Ирригация Асекии" #NT!
 nd_pue_acequia_method_desc: "Коммунальные системы каналов с самотеком, которые отводят речную воду на поля, требуют камня для облицовки каналов, древесины для шлюзов и инструментов для текущего обслуживания." #NT!
 nd_pue_silverwork: "Пуэбло Серебро" #NT!
 nd_pue_silverwork_desc: "Искусство изготовления ювелирных изделий из серебра и бирюзы, заимствованное из испанских техник обработки металлов и преобразованное в самобытную традицию Пуэбло." #NT!
 nd_pue_herbal_medicine: "Пуэбло Фитотерапия" #NT!
 nd_pue_herbal_medicine_desc: "Традиционное лечение использует домашний скот, части диких животных и волокна пустынных растений для приготовления лекарств, сохраняемых медицинскими обществами посредством церемониальной инициации." #NT!
 levy_nd_pue_kachina_guardians: "Качина Страж Леви" #NT!
 levy_nd_pue_kachina_guardians_desc: "Элитные воины из церемониальных обществ, выросшие, когда пуэбло столкнулись с реальной угрозой." #NT!
 levy_nd_pue_pueblo_levy: "Сбор ополчения Пуэбло" #NT!
 levy_nd_pue_pueblo_levy_desc: "Коммунальная милиция, набранная из поселений пуэбло, организованная по традиционной системе фракций." #NT!
 nd_pue_modern_crafts: "Современные ремесла пуэбло" #NT!
 nd_pue_modern_crafts_desc: "Интеграция традиционных методов гончарного дела, ткачества и изготовления ювелирных изделий с более широкими коммерческими сетями, выводящая искусство пуэбло на новые рынки." #NT!
 nd_pue_formed_tt: "Объединенный Пуэбло был сформирован." #NT!
 nd_pue_path_a_tt: "Выбрал путь Папе" #NT!
 nd_pue_path_b_tt: "Выбрал путь Кивы" #NT!
 nd_pue_destiny: "Судьба объединенного пуэбло" #NT!
 nd_pue_destiny_desc: "Пуэбло едины. Обеспечив стабильность, совет должен определить путь вперед: либо через силу наследия Папы, либо через мудрость кивы." #NT!
 nd_pue_dest_warpath: "Тропа войны" #NT!
 nd_pue_dest_warpath_desc: "Обезопасьте земли Дине и Нде. Ни один народ, угрожающий пуэбло, не останется безнаказанным на границах нашей родины. Возьмите Динету и сердце апачей под контроль Пуэбло." #NT!
 nd_pue_dest_warchiefs: "Совет военачальников" #NT!
 nd_pue_dest_warchiefs_desc: "Большой каньон Колорадо и восточные равнины должны перейти под власть пуэбло. Наши военачальники требуют армию, достойную конфедерации и уважения наших соседей." #NT!
 nd_pue_dest_turquoise_eagle: "Бирюзовый орел" #NT!
 nd_pue_dest_turquoise_eagle_desc: "Орел парит над всем Юго-Западом. Присоединить к конфедерации переправу Мохаве, сердце Акимеля и южные охотничьи угодья. Только великая армия может удержать такую ​​империю." #NT!
 nd_pue_dest_sacred_way: "Священный путь" #NT!
 nd_pue_dest_sacred_way_desc: "Танцоры качина Орайви сохранили древнейшие церемонии. Присоедините столовые горы хопи к конфедерации и создайте богатство, необходимое для поддержания священных традиций." #NT!
 nd_pue_dest_artisan_age: "Эпоха ремесленников" #NT!
 nd_pue_dest_artisan_age_desc: "Керамика пуэбло ценится в торговых сетях. Обеспечить потоки керамики через наши рынки, наполнить казну и использовать новые методы банковского дела для финансирования ремесленного возрождения." #NT!
 nd_pue_dest_eternal_kiva: "Вечная Кива" #NT!
 nd_pue_dest_eternal_kiva_desc: "Постройте Великую Киву, церемониальный центр, достойный нации. Защитите Халона Идивана, наполните казну, заслужите уважение мира и примите письменное слово, чтобы сохранить священные знания на все времена." #NT!
 nd_pue.5.t: "Судьба объединенного пуэбло" #NT!
 nd_pue.5.d: "Огни советов ярко горят в каждом пуэбло от Рио-Гранде до далеких гор. Впервые за всю историю автономные сообщества решили действовать как одна нация. Старейшины поспорили, матери клана высказались, и решение принято. Объединенное Пуэбло выживет, но его судьба еще не написана. Путь, выбранный при формировании, теперь разворачивается перед нами." #NT!
 nd_pue.5.a: "Наша судьба ждет." #NT!
 nd_pue.6.t: "Тропа войны пуэбло" #NT!
 nd_pue.6.d: "Воины Объединённых пуэбло взяли под контроль приграничные земли. Динета, родина дина, и территория апачей на юге теперь находятся под защитой конфедерации. Узел Папы связывает не только пуэбло с пуэбло, но и простирается за пределы, охватывая всех, кто хотел бы жить в мире под властью совета. Тех, кто совершает набеги на наши поля и угрожает нашему народу, заставили повиноваться." #NT!
 nd_pue.6.a: "Пограничье в безопасности." #NT!
 nd_pue.7.t: "Священный путь открывается" #NT!
 nd_pue.7.d: "Меса хопи (Орайви, Валпи, Шунгопави) присоединились к конфедерации, принеся с собой самые древние и сложные традиции качина на Юго-Западе. Сокровищница растет по мере того, как бирюза и керамика текут через торговые сети. Священный Путь простирается вперед: путь мудрости, церемоний и терпеливого накопления богатства и знаний." #NT!
 nd_pue.7.a: "Нас приветствуют танцоры качина." #NT!
 nd_pue.8.t: "Военный совет пустыни" #NT!
 nd_pue.8.d: "Военные вожди каждого пуэбло собрались на совет. Воины Конфедерации вышли за пределы центра страны, захватив великий каньон и восточные равнины. Армия становится сильнее с каждой кампанией. Теперь совет должен решить, как воспользоваться этим преимуществом. Некоторые выступают за рейды вглубь вражеской территории, обогащая пуэбло захваченными товарами. Другие призывают к созданию защитной сети (сторожевых башен и крепостей в горах), чтобы удержать завоеванное." #NT!
 nd_pue.8.a: "Мы рейдируем. Добыча укрепит наш народ." #NT!
 nd_pue.8.b: "Мы укрепляем. Сама пустыня будет нашим щитом." #NT!
 nd_pue.9.t: "Ренессанс ремесленников Пуэбло" #NT!
 nd_pue.9.d: "Мастерские Объединения пуэбло процветают. Керамика, расписанная древними символами, бирюзовая оправа в серебре, хлопчатобумажная ткань с замысловатыми узорами: ремесла индейцев стали источником богатства и гордости. Банковские учреждения теперь финансируют гильдии ремесленников. Совет должен решить, как направить это возрождение. Некоторые выступают за расширение торговых сетей, чтобы доставлять товары пуэбло на отдаленные рынки. Другие хотят привлечь иностранных ученых и ремесленников, осваивая новые методы, сохраняя при этом основные традиции." #NT!
 nd_pue.9.a: "Наши ремесла будут известны на каждом рынке." #NT!
 nd_pue.9.b: "Мы будем учиться у всех народов." #NT!
 nd_pue.10.t: "Бирюзовый орел" #NT!
 nd_pue.10.d: "Теперь конфедерация простирается от переправы Мохаве на западе до равнин на востоке, от великого каньона на севере до земель Акимеля на юге. Армия беспрецедентного размера для пуэбло готова. Бирюзовый орел (символ власти пуэбло и неба пустыни) летает над империей. Совет должен определить характер этой новой власти. Станет ли Объединенное Пуэбло боевым орлом, вселяющим страх во всех, кто ему противостоит? Или его силой станет несокрушимая выносливость, которая поддерживала пуэбло на протяжении веков?" #NT!
 nd_pue.10.a: "Мы — боевой орел. Никто не устоит против нас." #NT!
 nd_pue.10.b: "Мы терпим. Это наша самая большая сила." #NT!
 nd_pue.11.t: "Вечная Кива" #NT!
 nd_pue.11.d: "Великая Кива стоит целой, монументальный церемониальный центр, не похожий ни на что, построенное со времен каньона Чако. Под землей, в священной комнате, танцоры качина проводят церемонии, обновляющие мир. Выше писцы впервые записывают устные традиции в письменной форме, сохраняя знания, которые передавались из уст в уши на протяжении тысячи лет. Собирается совет, чтобы освятить это достижение. Будет ли Вечная Кива маяком духовной гармонии, приветствующим все народы? Или это станет доказательством того, что образ управления и сообщества пуэбло привел к чему-то действительно великому?" #NT!
 nd_pue.11.a: "Кива приветствует всех, кто ищет гармонии." #NT!
 nd_pue.11.b: "Пуэбло доказало свое мастерство." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_raiders_mesa: "Рейдеры Месы" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_raiders_mesa: "Военные отряды пуэбло наносят удары вглубь вражеской территории, возвращаясь с добычей, которая обогащает конфедерацию, хотя приток иностранных товаров приводит к росту цен." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_desert_shield: "Пустынный щит" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_desert_shield: "Сеть крепостей и сторожевых башен на горе делает центральную часть Пуэбло практически неприступной, хотя поддержание этой защиты напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_war_eagle: "Боевой орел" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_war_eagle: "Бирюзовый орел вселяет ужас в врагов пуэбло. Иностранные державы признают военную мощь конфедерации и предоставляют ей выгодные условия за столом переговоров." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_indomitable: "Неукротимый дух" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_indomitable: "Дух выносливости, который поддерживал пуэбло в течение столетий трудностей, теперь проявляется как непреклонная оборонительная традиция. Союзники сплачиваются под знаменем неукротимых пуэбло." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_ceramic_masters: "Мастера керамики" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_ceramic_masters: "Керамика пуэбло имеет высокие цены на рынках по всему континенту, привлекая торговцев и расширяя дипломатическое влияние конфедерации, хотя успех порождает определенную самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_desert_scholars: "Ученые пустыни" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_desert_scholars: "В пуэбло приветствуются иностранные ремесленники и ученые, которые привносят новые методы и идеи, которые сочетаются с древними традициями и создают замечательные инновации." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_eternal_ceremonies: "Вечные церемонии" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_eternal_ceremonies: "Церемонии качина Великой Кивы привлекают паломников из всех народов. Духовная гармония пуэбло становится образцом мирного сосуществования различных народов." #NT!
 STATIC_MODIFIER_NAME_nd_pue_dest_pueblo_mastery: "Мастерство Пуэбло" #NT!
 STATIC_MODIFIER_DESC_nd_pue_dest_pueblo_mastery: "Великая Кива является доказательством того, что путь пуэбло (общинное управление, священные традиции, терпеливое ремесло) создал цивилизацию, достойную уважения во всем мире." #NT!
 nd_pue_war_council: "Зал Военного совета" #NT!
 nd_pue_war_council_desc: "Укрепленный зал совета, где собираются военачальники каждого пуэбло, чтобы координировать военные кампании конфедерации, планировать оборону и мобилизовать воинов по всему юго-западу." #NT!
 nd_pue_great_kiva: "Великая Кива" #NT!
 nd_pue_great_kiva_desc: "Монументальный подземный церемониальный зал, способный соперничать с огромными кивами древнего каньона Чако, где исполняются самые священные танцы и сохраняются устные традиции каждого пуэбло." #NT!
 nd_pue_war_council_upkeep: "Обслуживание Военного Совета" #NT!
 nd_pue_war_council_upkeep_desc: "Для содержания Зала Военного совета требуется вооружение для гарнизона, кожа для снаряжения, инструменты для ремонта и камень для глинобитных стен." #NT!
 nd_pue_great_kiva_ceremonies: "Великие церемонии Кива" #NT!
 nd_pue_great_kiva_ceremonies_desc: "Сложный церемониальный цикл Великой Кивы требует пчелиного воска для свечей, глины для священных сосудов, красителей для ритуальных красок и благовоний для очищения." #NT!
  
 AUTO_MODIFIER_NAME_nd_pue_bureaucracy_authority: "Бюрократический орган Федерации" #NT!
 AUTO_MODIFIER_DESC_nd_pue_bureaucracy_authority: "Провозгласив федерацию пуэбло в духе скоординированного восстания По'пая, Объединенные пуэбло теперь могут создать формальную бюрократию для управления высокогорным царством пустыни. Столица пуэбло предоставляет одно бюрократическое место; этот орган добавляет еще два." #NT!
 pue_cacique_war_captain_bureaucracy: "Касик и военный капитан" #NT!
 pue_cacique_war_captain_bureaucracy_desc: "Структурное разделение власти пуэбло на внутреннего ритуально-политического вождя (касика в Тева по'квингех) и внешнего военного вождя (военный капитан в Тева т'ова э'). Касик занимал эту должность пожизненно, был утвержден религиозными обществами и занимался церемониальным календарем, посадкой и сбором урожая, а также внутренним миром пуэбло. Военный капитан выбирался ежегодно (часто касиком с советом фратратов), обладал правами воинов и охраной порядка в деревне и выходил на поле боя в сезон набегов на апачей, навахо и испанских захватчиков. Две должности проверяли друг друга: военный капитан не мог начать войну без согласия касика и ритуальной санкции общества, а касик не мог контролировать деревню без руки военного капитана." #NT!
 pue_kiva_council_chamber_bureaucracy: "Зал Совета Кива" #NT!
 pue_kiva_council_chamber_bureaucracy_desc: "Подземная церемониальная комната, служившая политико-религиозным сердцем каждого пуэбло. В кива входили по лестнице через отверстие в крыше, которое символизировало выход из сипапу. В кива размещались религиозные общества (культ качина, общества медицины, братства воинов), и здесь касик созвал старейшин деревни для решения важных вопросов: календаря праздников, распределения поливной воды, осуждения серьезных обид, ратификации войны. У каждого пуэбло было несколько кив, разделенных по группам или по членству в обществе; большие кивы, построенные в эпоху Чако (Пуэбло Бонито, Ацтек, Каса Ринконада), вмещали более сотни. Кива была одновременно священным местом, залом совета, ткацкой мастерской и мужским домиком." #NT!
 pue_moiety_dual_system_bureaucracy: "Двойная система Moiety" #NT!
 pue_moiety_dual_system_bureaucracy_desc: "Социально-политическое разделение каждого пуэбло на две взаимодополняющие половины, которые чередовали власть в зависимости от сезона. Среди пуэбло тева были «Летний народ» и «Зимний народ», каждый со своим касиком, своей кивой и собственным календарем праздников. У хопи аналогичное подразделение существовало в Сквош/Бирюзовом. Полномочия в общественных делах пуэбло (распределение полей, создание рабочих групп, организация охоты) переходили от одной фракции к другой в дни равноденствия, так что ни одна фракция не удерживала деревню круглый год. Фракции были экзогамными: Летний мужчина женился на Зимней женщине, и дети принимали материнскую фратуру, сплетая деревню воедино по родству, сохраняя при этом чередование ее публичных лиц." #NT!
 pue_knotted_cord_runner_network_bureaucracy: "Сеть для бегунов с завязанным шнуром" #NT!
 pue_knotted_cord_runner_network_bureaucracy_desc: "Институт координации межпуэбло произошел от организации По'пая, устроившей восстание пуэбло 1680 года. Из своего убежища в Таосе религиозный лидер Тева отправил бегунов на юг и запад с завязанными веревками из волокон юкки с узлом на каждый день, оставшийся до восхода солнца; пуэбло принимали веревку, по очереди развязывая узлы. В согласованный день, 10 августа 1680 года, Тева, Тива, Това, Кересан, Зуни и пуэбло хопи вместе поднялись против испанцев от Таоса до столовых гор хопи, трехсот миль пустыни, соединенных узловатой веревкой. Федерация сохраняет сеть бегунов как постоянный институт: корпус быстрых бегунов, обучавшихся с детства в каждом пуэбло, завязанные веревки в качестве средства призыва между пуэбло и координационный совет в таосском пуэбло." #NT!
 pue_pecos_plains_trade_bureaucracy: "Пекос Плейнс Трейд" #NT!
 pue_pecos_plains_trade_bureaucracy_desc: "Институт восточной границы, с помощью которого самые восточные пуэбло (в частности, Пекос, Куартелехо и Пикурис) выступали посредниками в обмене между сельскохозяйственным миром пуэбло и народами южных равнин, охотящимися на бизонов. На осенних торговых ярмарках, проходивших в Пекосе в октябре и в Таосе летом, Апач-де-Куартелехо, Хикарилья и с ок. 1700 г. Команчи и Уичито привезли шкуры бизонов, сушеное мясо, жир, пленников и рабов в обмен на кукурузу, бобы, кабачки, тканые хлопчатобумажные манты, молотый пигмент и бирюзу, добытую в Серрильосе. Пуэбло взимали плату за проезд и процент от сквозного трафика; Пекос разбогател, став воротами между двумя мирами. Испанские губернаторы неоднократно пытались подавить ярмарки, но неоднократно терпели неудачу." #NT!
