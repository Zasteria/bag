l_russian:
 STATIC_MODIFIER_NAME_nd_yua_six_tumen_order: "Орден Шести Туменов" #NT!
 STATIC_MODIFIER_DESC_nd_yua_six_tumen_order: "Реорганизация Даян-ханом восточномонгольских племен в шесть туменских дивизий восстановила централизованное военное управление в степи. Каждый тумен подчиняется борджигинскому князю, но все подчиняются Великому Хану." #NT!
 STATIC_MODIFIER_NAME_nd_yua_borjigin_autonomy: "Борджигинская автономия" #NT!
 STATIC_MODIFIER_DESC_nd_yua_borjigin_autonomy: "Вместо того, чтобы навязывать жесткую централизацию, Великий Хан предоставил своим родственникам-борджигинам широкую свободу управления своими владениями. Эта конфедерация князей, связанных кровью и верностью, а не бюрократической иерархией, сохраняет степную традицию правления по обоюдному согласию." #NT!
 STATIC_MODIFIER_NAME_nd_yua_dharma_raja: "Дхарма Раджа Степи" #NT!
 STATIC_MODIFIER_DESC_nd_yua_dharma_raja: "Принятие тибетского буддизма в качестве государственной религии изменило духовный ландшафт монгольского мира. В степи возвышаются монастыри, а связь между ламой и ханом узаконивает правление через духовную и светскую власть." #NT!
 STATIC_MODIFIER_NAME_nd_yua_tengrism_endures: "Тенгризм выстоит" #NT!
 STATIC_MODIFIER_DESC_nd_yua_tengrism_endures: "Старые обычаи Вечного Синего Неба не заброшены. В то время как иностранные религии имеют свое место, монгольская воинская традиция черпает свою силу из почитания Тенгри, открытого неба и духов предков." #NT!
 nd_yua.1.t: "Восстановление Шести Туменов" #NT!
 nd_yua.1.d: "В конце пятнадцатого века молодой принц из рода Борджигин вышел из безвестности, чтобы воссоединить раздробленные монгольские племена. Взяв имя Даян-хан, «Хан Великого Юаня», Батумонгке подчинил конкурирующие кланы и реорганизовал восточные монгольские племена в шесть туменов, каждый из которых представлял собой дивизию из десяти тысяч воинов, разделенных на левое и правое крыло. Вместе с королевой-воином Мандухай Хатун, сражавшейся на его стороне, Даян-хан разгромил ойратскую конфедерацию и восстановил такое единство, которого не было со времен падения Даду.\n\nТеперь вопрос в том, как следует управлять этим восстановленным порядком. Централизованное командование под непосредственным руководством Великого Хана создало бы дисциплинированную военную машину, но степью всегда управляли на основе консенсуса равных, и князья Борджигина ожидают автономии над своим собственным туменом.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_yua.1.a: "Шесть Туменов будут подчиняться одному Хану." #NT!
 nd_yua.1.b: "Пусть каждый принц управляет своими владениями по-борджигински." #NT!
 nd_yua.2.t: "Встреча в Чабчиале" #NT!
 nd_yua.2.d: "В 1578 году Алтан-хан монголов Тумед пригласил Третьего Далай-ламу Сонама Гьяцо на историческую встречу в Чабчиял. Эта встреча изменила обе стороны: Алтан-хан даровал титул «Далай-лама» Сонаму Гьяцо, который, в свою очередь, признал в монгольском правителе реинкарнацию Хубилай-хана. Этот обмен легитимностью (светская власть, освящающая духовную власть, духовная власть, освящающая светскую власть) привел в движение массовое обращение монголов в тибетский буддизм.\n\nВ степи начали появляться монастыри, монахи заменили шаманов в качестве духовных наставников знати, а жестокие обычаи традиционной кочевой жизни смягчились под влиянием буддизма. Однако не все приветствовали эту трансформацию. Старые традиции тенгристов глубоко укоренились в крови степных воинов, и некоторые считали новую религию иностранным навязыванием, которое истощит боевой дух монгольской нации." #NT!
 nd_yua.2.a: "Дхарма осветит степь." #NT!
 nd_yua.2.b: "Вечное голубое небо не нуждается в замене." #NT!
 nd_yua.3.t: "Вызов Лигдан-хана" #NT!
 nd_yua.3.d: "Лигдан-хан, последний, носивший титул Великого хана монголов, поднял своих чахарских воинов в отчаянном вызове растущей маньчжурской власти. Со своим корпусом из трехсот баатуров, элитных воинов, присягнувших на личную верность, Лигдан пытается централизовать власть над капризным монгольским туменом, в то время как одно племя за другим переходит под знамя Хун Тайцзи.\n\nСоперничество неравное: маньчжуры сочетают монгольские кавалерийские традиции с китайской административной эффективностью, в то время как жесткая централизация Лигдана толкает его собственных союзников в объятия врага. Однако его неповиновение представляет собой последнее утверждение независимого суверенитета Монголии, отказ признать, что наследие Чингисхана перешло в иностранные руки." #NT!
 nd_yua.3.a: "Кровь Чингисхана не преклоняет колени." #NT!
 nd_yua.4.t: "Торговля лошадьми и чаем" #NT!
 nd_yua.4.d: "После десятилетий набегов и репрессий между степью и оседлым миром было достигнуто соглашение. Открылись приграничные рынки, где монгольские лошади, меха и шкуры обмениваются на китайский чай, шелк и зерно. Мины называют это «торговлей данью», чтобы сохранить лицо; монголы называют это тем, чем оно является, торговлей между равными.\n\nТорговля конским чаем преобразует экономику степи. Если раньше единственным способом приобретения китайских товаров был грабеж, то теперь монгольские пастухи могут обменивать излишки скота на товары, которые делают жизнь в степи сносной. В частности, чай стал основным продуктом питания, без него монотонная мясная и молочная диета практически невыносима." #NT!
 nd_yua.4.a: "Торговля обогащает и степь, и сельскохозяйственные угодья." #NT!
 nd_yua_keshig_tradition: "Кешигская традиция" #NT!
 nd_yua_keshig_tradition_desc: "Кешиг, императорская охрана, созданная самим Чингисханом, служила одновременно личной охраной и школой подготовки монгольской элиты. Набранные из сыновей верных вассалов, воины-кешиги получили лучшее снаряжение и подготовку." #NT!
 nd_yua_imperial_relay: "Имперская ретрансляционная сеть" #NT!
 nd_yua_imperial_relay_desc: "Почтовая ретрансляционная система Ям, которая когда-то соединяла огромную Монгольскую империю, продолжает функционировать, доставляя сообщения и официальных лиц через степь с поразительной скоростью." #NT!
 nd_yua_dual_administration: "Двойное администрирование" #NT!
 nd_yua_dual_administration_desc: "Юань объединил управление монгольскими племенами с китайской бюрократической администрацией, создав гибридную систему, в которой Тайный совет управлял военными делами, а Центральный секретариат решал гражданские вопросы." #NT!
 nd_yua_great_yuan_mandate: "Великий мандат юаня" #NT!
 nd_yua_great_yuan_mandate_desc: "Притязания на династическое имя Великого Юаня, Да Юань, несут в себе вес наследия Хубилай-хана и его мандата править всем под небом." #NT!
 nd_yua_border_provisioning: "Пограничное обеспечение" #NT!
 nd_yua_border_provisioning_desc: "Зернохранилища и склады снабжения вдоль степно-аграрной границы гарантируют, что кочевое население сможет пережить суровые зимы и выдержать военные кампании." #NT!
 nd_yua_genghisid_legitimacy: "Легитимность Чингизидов" #NT!
 nd_yua_genghisid_legitimacy_desc: "У монголов только потомки Чингисхана через его сына Джучи, Чагатая, Угэдэя или Толуя могут носить ханский титул. Этот принцип Чингизидов является основой политической легитимности Северного Юаня." #NT!
 nd_yua_tammachi_garrisons: "Гарнизоны Таммачи" #NT!
 nd_yua_tammachi_garrisons_desc: "Таммачи представляли собой гарнизонные силы, дислоцированные на завоеванных территориях, представляющие собой смесь монгольской военной дисциплины и местного набора персонала, что обеспечивало постоянную оборонительную способность." #NT!
 nd_yua_silk_road_tribute: "Дань Шелковому пути" #NT!
 nd_yua_silk_road_tribute_desc: "Контроль над участками древнего торгового пути Шелкового пути позволяет Северному юаню собирать дань с проходящих караванов, поддерживая казну даже при сокращении территориальных владений." #NT!
 nd_yua_khubilai_bureaucracy: "Бюрократия Хубилая" #NT!
 nd_yua_khubilai_bureaucracy_desc: "Административный аппарат, созданный Хубилай-ханом и адаптированный на основе китайских моделей, сохраняется в традициях правления Юань, проведении переписи населения, сборе налогов и управлении провинцией назначенными должностными лицами.\n\n#italic Доступно в: $nd_yua_secretariat$#!" #NT!
 nd_yua_chao_currency: "Валютная система Чао" #NT!
 nd_yua_chao_currency_desc: "Династия Юань стала пионером в использовании бумажных денег, чао, подкрепленных императорским указом, а не драгоценным металлом. Это радикальное для своего времени нововведение облегчило торговлю между обширными монгольскими владениями." #NT!
 nd_yua_composite_bow_workshops: "Мастер-классы по изготовлению композитных луков" #NT!
 nd_yua_composite_bow_workshops_desc: "Монгольский составной лук, изготовленный из слоев рога, сухожилий и дерева, остается самым смертоносным оружием дальнего боя в степи. Специализированные мастерские обеспечивают постоянные поставки этого оружия.\n\n#italic Доступно в: $nd_yua_yam_station$#!" #NT!
 nd_yua_imperial_court_culture: "Императорский двор Культура" #NT!
 nd_yua_imperial_court_culture_desc: "При дворе Юань смешались монгольские, китайские, тибетские и персидские культурные традиции в космополитический синтез, не имеющий аналогов в средневековом мире." #NT!
 nd_yua_yuan_heavy_cavalry: "Юаньская тяжелая кавалерия" #NT!
 nd_yua_yuan_heavy_cavalry_desc: "Опираясь как на монгольское искусство верховой езды, так и на традиции китайских катафрактов, тяжелая кавалерия Юань сочетает в себе мобильность степной войны с ударной мощью бронированных улан." #NT!
 nd_yua_steppe_retreat: "Тактика отступления в степи" #NT!
 nd_yua_steppe_retreat_desc: "Потеряв Китай, Северный Юань усовершенствовал искусство стратегического отхода в обширную степь, используя бесконечные луга как щит и убежище." #NT!
 nd_yua_dayan_khan_revival: "Возрождение Даяна Хана" #NT!
 nd_yua_dayan_khan_revival_desc: "Воссоединение монгольских племен Батумонгке Даян-ханом в конце пятнадцатого века восстановило централизованную власть и военную эффективность раздробленной степной конфедерации." #NT!
 nd_yua_six_tumen_reform: "Шесть тюменских реформ" #NT!
 nd_yua_six_tumen_reform_desc: "Реорганизация восточномонгольских племен в шесть туменов (Три левых крыла (Чахар, Халха, Уриянгхан) и Три правых крыла (Ордос, Тумед, Ёншебу)) восстановили десятичную военную систему Чингисхана." #NT!
 nd_yua_horse_tea_trade: "Лошадино-чайная торговля" #NT!
 nd_yua_horse_tea_trade_desc: "Формализованный обмен монгольских лошадей на китайский чай стал экономической линией жизни Северного Юаня, заменив набеги регулярной торговлей на определенных приграничных рынках." #NT!
 nd_yua_mongol_script_revival: "Возрождение монгольской письменности" #NT!
 nd_yua_mongol_script_revival_desc: "Возрождение и стандартизация традиционной монгольской вертикальной письменности сохраняет литературное наследие степных народов — от «Сокровенной истории монголов» до буддийских сутр." #NT!
 nd_yua_gelugpa_conversion: "Преобразование в гелугпа" #NT!
 nd_yua_gelugpa_conversion_desc: "Принятие школы Гелугпа (Желтая шляпа) тибетского буддизма в качестве доминирующей религии монголов, чему способствовала историческая встреча Алтан-хана с Третьим Далай-ламой в 1578 году." #NT!
 nd_yua_khorchin_alliance: "Хорчин Альянс" #NT!
 nd_yua_khorchin_alliance_desc: "Хорчин-монголы, населявшие восточные равнины, служили важнейшими военными союзниками, а их легкая кавалерия-разведчики обеспечивала разведку и прикрытие основной армии." #NT!
 nd_yua_steppe_law_code: "Степной Кодекс законов" #NT!
 nd_yua_steppe_law_code_desc: "Основываясь на Ясе Чингисхана, более поздние правители Северного Юаня кодифицировали обычное право степей в формальные правовые кодексы, регулирующие собственность, брак и уголовное правосудие." #NT!
 nd_yua_altan_khan_diplomacy: "Дипломатия Алтан-хана" #NT!
 nd_yua_altan_khan_diplomacy_desc: "Дипломатическое начало Алтан-хана с династией Мин в 1571 году положило конец десятилетиям приграничных войн и установило регулярные торговые отношения, доказав, что перо может добиться того, чего не удалось мечу.\n\n#italic Доступно в: $nd_yua_border_market$#!" #NT!
 nd_yua_dharma_patronage: "Покровительство Дхарме" #NT!
 nd_yua_dharma_patronage_desc: "Королевский покровительство буддийским монастырям и ученым создавало по всей степи центры обучения, где монахи переводили священные писания, занимались медициной и сохраняли астрономические знания." #NT!
 nd_yua_tumen_commanders: "Тюменские командиры" #NT!
 nd_yua_tumen_commanders_desc: "Традиция назначения проверенных воинов командирами туменов, десятитысячными лидерами, гарантировала, что военное командование остается привязанным к продемонстрированной компетентности на поле боя." #NT!
 nd_yua_chakhar_baaturs: "Чахар Баатурс" #NT!
 nd_yua_chakhar_baaturs_desc: "Баатуры, воины-чемпионы Чахара, составляли личную гвардию Лигдан-хана, последнего великого хана монголов. Триста человек, это были лучшие всадники и бойцы степи." #NT!
 nd_yua_ligdan_centralization: "Централизация Лигдана" #NT!
 nd_yua_ligdan_centralization_desc: "Попытка Лигдан-хана восстановить прямую имперскую власть над всеми монгольскими племенами посредством назначенных чиновников и централизованного налогообложения - смелая, но в конечном итоге вызывающая разногласия реформа." #NT!
 nd_yua_last_khan_defiance: "Вызов последнего хана" #NT!
 nd_yua_last_khan_defiance_desc: "Несмотря на то, что маньчжурская угроза растет, а союзники отступают, боевой дух последних монгольских ханов отказывается сдаваться. Каждая проигранная битва только укрепляет решимость сопротивляться." #NT!
 nd_yua_nomadic_adaptation: "Кочевая адаптация" #NT!
 nd_yua_nomadic_adaptation_desc: "Столетия существования Северного Юаня доказали, что кочевая экономика могла адаптироваться и процветать, включая торговые товары и сельскохозяйственную продукцию в традиционный скотоводческий цикл.\n\n#italic Доступно в: $nd_yua_steppe_granary$#!" #NT!
 nd_yua_great_seal_preservation: "Сохранение Большой печати" #NT!
 nd_yua_great_seal_preservation_desc: "Нефритовая печать Великой династии Юань, физический символ имперского мандата, сохранялась сменявшими друг друга ханами как доказательство существования законной династии в степи." #NT!
 nd_yua_steppe_modernization: "Степная модернизация" #NT!
 nd_yua_steppe_modernization_desc: "Контакты с соседними цивилизациями и внутреннее давление стимулируют реформы в производстве и производстве, адаптируя устоявшиеся технологии к потребностям степной экономики.\n\n#italic Доступно в: $nd_yua_tibetan_temple$#!" #NT!
 nd_yua_chinggisid_renaissance: "Чингисидский Ренессанс" #NT!
 nd_yua_chinggisid_renaissance_desc: "Культурное возрождение, прославляющее наследие Чингисхана и Великой Монгольской Империи (в литературе, праве и искусстве) как основу особой монгольской национальной идентичности." #NT!
 nd_yua_eternal_mandate: "Вечный мандат" #NT!
 nd_yua_eternal_mandate_desc: "Мандат Великого Юаня, переданный по родословной Борджигин от Чингисхана до наших дней, является не просто политическим заявлением, но и космической истиной, Вечное Голубое Небо выбрало эту линию для правления." #NT!
 nd_yua_cavalry_reformation: "Реформация кавалерии" #NT!
 nd_yua_cavalry_reformation_desc: "Древние степные кавалерийские традиции реформируются для современной эпохи, интегрируя новую тактику и методы обучения, сохраняя при этом основные монгольские преимущества мобильности и стрельбы из лука." #NT!
 nd_yua_great_yuan_legacy: "Великое наследие Юаня" #NT!
 nd_yua_great_yuan_legacy_desc: "Наследие Великого Юаня, империи, которая когда-то простиралась от Кореи до Венгрии, остается источником вдохновения и стремления для монгольской нации." #NT!
 a_nd_yua_keshig_guard: "Кешиг Страж" #NT!
 a_nd_yua_keshig_guard_desc: "Элитные императорские телохранители Великого Хана, кешиги, набраны из сыновей верных борджигинских дворян и обучены как конной стрельбе из лука, так и тяжелому кавалерийскому бою. Их лояльность абсолютна." #NT!
 a_nd_yua_yuan_lancer: "Юань Лансер" #NT!
 a_nd_yua_yuan_lancer_desc: "Тяжелая кавалерия в броне, сочетающая монгольское искусство верховой езды с традициями китайских катафрактов. Эти уланы вооружены как копьем, так и композитным луком, способным наносить разрушительные заряды, за которыми следует конная стрельба из лука." #NT!
 a_nd_yua_chakhar_baatur: "Чахар Баатур" #NT!
 a_nd_yua_chakhar_baatur_desc: "Баатуры, воины-чемпионы племени Чахар, служащие личной охраной последнего Великого Хана. Свирепые в нападении и непоколебимые в защите, они олицетворяют последний огонь независимости Монголии." #NT!
 a_nd_yua_tammachi: "Таммачи" #NT!
 a_nd_yua_tammachi_desc: "Гарнизонные войска набраны из оседлого монголо-китайского приграничного населения. Таммачи сочетают пехотную дисциплину со знанием местности, защищая границу между степью и сельскохозяйственными угодьями." #NT!
 a_nd_yua_khorchin_scout: "Хорчин Разведчик" #NT!
 a_nd_yua_khorchin_scout_desc: "Легкая кавалерия восточных хорчинских монголов, мастера разведки, набегов и притворного отступления. Они ездят на самых быстрых лошадях и наносят удар там, где враг меньше всего ожидает." #NT!
 nd_yua_yam_station: "Станция Императорский Ям" #NT!
 nd_yua_yam_station_desc: "Ретрансляционный пост в системе Яма, сети перевалочных пунктов Монгольской империи, которая позволяла посланиям и чиновникам пересекать степь с необычайной скоростью." #NT!
 nd_yua_secretariat: "Юань Секретариат" #NT!
 nd_yua_secretariat_desc: "Административное бюро, адаптированное из китайского Чжуншу Шэн, укомплектовано грамотными чиновниками, которые управляют гражданскими делами, налогообложением и переписью населения в традиции Юань." #NT!
 nd_yua_steppe_granary: "Степное зернохранилище" #NT!
 nd_yua_steppe_granary_desc: "Хранилища продовольствия на степно-аграрной границе, гарантирующие, что кочевое население и гарнизонные силы смогут пережить суровые зимы и выдержать военные действия." #NT!
 nd_yua_tibetan_temple: "Тибетский буддийский храм" #NT!
 nd_yua_tibetan_temple_desc: "Монастырь школы Гелугпа, где тибетские монахи обучают Дхарме новообращенных монголов. Эти храмы служат центрами грамотности, медицины и культурного обмена." #NT!
 nd_yua_border_market: "Пограничный торговый пост" #NT!
 nd_yua_border_market_desc: "Специальный рынок на степно-аграрной границе, где монгольские лошади, меха и шкуры обмениваются на китайский чай, шелк и зерно." #NT!
 nd_yua_yam_upkeep: "Обслуживание реле Ям" #NT!
 nd_yua_yam_upkeep_desc: "Свежие лошади, домашний скот и инструменты для поддержания имперской ретрансляционной сети, замены изношенных скакунов, снабжения всадников и поддержания в ремонте почтовых станций." #NT!
 nd_yua_secretariat_staff: "Администрация Секретариата" #NT!
 nd_yua_secretariat_staff_desc: "Бумага, чернила и тонкая ткань для офисных мантий, принадлежности и официальная одежда, необходимые для бюрократических операций административной системы Юань." #NT!
 nd_yua_grain_storage: "Управление зерновыми резервами" #NT!
 nd_yua_grain_storage_desc: "Запасы зерна, древесины и инструментов для степных амбаров, поддержание построек и управление запасами, которые поддерживают приграничное население в суровые зимы." #NT!
 nd_yua_temple_offerings: "Храмовые подношения" #NT!
 nd_yua_temple_offerings_desc: "Шелк, красители, благовония и бумага, предлагаемые буддийским монастырям, шелка для драпировок алтарей, пигменты для картин тханка, благовония для ритуалов и бумага для копирования сутр." #NT!
 nd_yua_horse_tea_exchange: "Лошадино-чайная биржа" #NT!
 nd_yua_horse_tea_exchange_desc: "Регулярный обмен степных лошадей и домашнего скота на китайский чай с использованием бумаги для торговых записей и соглашений — источник жизненной силы приграничной экономики между кочевниками и фермерами." #NT!
 levy_nd_yua_tammachi: "Таммачи Гарнизон Леви" #NT!
 levy_nd_yua_tammachi_desc: "Гарнизонная пехота, набранная из приграничных поселений, сочетающая монгольские военные традиции с местными оборонными знаниями." #NT!
 levy_nd_yua_khorchin_scout: "Хорчин Разведчик Леви" #NT!
 levy_nd_yua_khorchin_scout_desc: "Легкие кавалерийские разведчики из хорчинских племен, воспитанные в рамках традиционных монгольских рекрутских повинностей." #NT!
 nd_yua_formed_tt: "Юань был сформирован" #NT!
 nd_yua_path_a_tt: "Выбрал Орден Шести Туменов" #NT!
 nd_yua_path_b_tt: "Выбрал Борджигинскую автономию" #NT!
 AUTO_MODIFIER_NAME_nd_yua_bureaucracy_authority: "Бюрократическая власть Великого Юаня" #NT!
 AUTO_MODIFIER_DESC_nd_yua_bureaucracy_authority: "После восстановления Великого Юаня династия разблокирует бюрократическую систему и может создать до трех исторических учреждений, созданных из центрального секретариата Чжуншу Шэн, тайного совета Шуми Юань, цензората Юши Тай, этнической кастовой иерархии Сему, письменного аппарата Фагс-па и соляной монополии Янчжоу." #NT!
 yua_zhongshu_sheng_bureaucracy: "Чжуншу Шэн" #NT!
 yua_zhongshu_sheng_bureaucracy_desc: "Центральный секретариат (Чжуншу Шэн), основанный Хубилай-ханом в 1260 году и официально оформленный в 1271 году, был высшим гражданским органом государства Юань. Ее правым и левым канцлерами почти всегда были монголы или сэмурэни, но никогда Хань-жэнь, а ее отраслевые секретариаты (Син Чжуншу Шэн) институционализировали то, что было специальной полевой администрацией, став прямыми предками китайской провинции. Шесть министерств подчинялись Чжуншу Шэну, а не пользовались автономией, которую они имели при предыдущих династиях. Это был институциональный мост, с помощью которого степные завоевания превратились в управляемую континентальную империю." #NT!
 yua_shumi_yuan_bureaucracy: "Шуми Юань" #NT!
 yua_shumi_yuan_bureaucracy_desc: "Бюро по военным делам (Шуми Юань), перестроенное ханом Хубилаем в 1263 году, представляло собой исключительно монголо-сэмурэнский заповедник. В то время как Чжуншу Шэн допускал участие Хань в гражданских делах, Шуми Юань командовал отрядами кешиг, пограничными гарнизонами таммачи и имперскими туменами, без Хань-жэня в старшем ранге в течение первого столетия династии. К 1287 году он подчинялся только хану, равному гражданскому секретариату. Этот институт отражал структурный принцип Юаня: оружие остается в руках народа-завоевателя." #NT!
 yua_yushi_tai_bureaucracy: "Юши Тай" #NT!
 yua_yushi_tai_bureaucracy_desc: "Указ Хубилай-хана от 1268 года возвел Цензорат (Юши Тай) на положение, которого не предоставляла ни одна более ранняя династия: полный уровень Чжуншу Шэна и Шуми Юаня, третьего великого правительства королевства. Главный цензор мог увековечить трон против любого чиновника, включая самих канцлеров; Цензоры провинций в Шанду и Цзяннане координировали полномочия по импичменту. В монгольской практике цензорат ценился как средство контроля хана над его собственной администрацией, но цензоры постоянно сталкивались с монгольской знатью, чьи орток-предприятия они расследовали." #NT!
 yua_semu_caste_bureaucracy: "Иерархия каст сему" #NT!
 yua_semu_caste_bureaucracy_desc: "Определяющим политическим нововведением правления Юаня была формальная четырехуровневая этническая классификация: монголы, затем семурэни («разноглазые люди»: персы, тангуты, тибетцы, уйгуры, турки, европейцы), затем хань-жэнь из бывшего Цзинь, затем Нан-жэнь из бывшей Южной Сун. Уровни определяли доступ к высшим должностям, судебному статусу, привилегиям в отношении оружия и начислению налогов. Система дала трону огромное количество лоялистов иностранного происхождения, которые были всем обязаны династии, и спровоцировала восстания Хань-жэнь, положившие конец правлению Юаня." #NT!
 yua_phags_pa_script_bureaucracy: "Скриптовый аппарат Phags-pa" #NT!
 yua_phags_pa_script_bureaucracy_desc: "В 1269 году Хубилай-хан поручил молодому тибетскому ламе Дрогону Чогьялу Пхагпе создать единое фонетическое письмо, которое могло бы транскрибировать все языки империи (монгольский, китайский, тибетский, санскрит, уйгурский, персидский) единым набором букв в квадрате. Императорский указ сделал его официальным письмом династии: государственные печати, монеты и указы Бюро национальных языков с параллельными текстами - все было снабжено буквами Фагс-па. Бюро также служило институциональной опорой для роли Пхагпы в качестве императорского наставника (Диши), связывая трон Юань с монастырем Са-скья в Тибете." #NT!
 yua_yan_zheng_bureaucracy: "Ян Чжэн" #NT!
 yua_yan_zheng_bureaucracy_desc: "Фискальная политика юаня зависела от соляной монополии (Янь Чжэн), управляемой из Янчжоу. Под давлением министров Лу Ши-жуна (казнен в 1285 г.) и Сангхи (казнен в 1291 г.) комиссия Янь Юнь Си монополизировала производство на прибрежных солеварнях Лян-чжэ и Лян-хуай, распространяла продукцию через лицензированных торговцев, которым платили сертификатами-ордантами Ян-инь, и переводила доходы непосредственно в императорское казначейство. В период пика соль составляла до восьмидесяти процентов доходов центрального правительства. Зависимость была силой и слабостью династии: когда восстания Янцзы 1350-х годов прервали добычу соли на юге, доходы центра рухнули в течение десятилетия." #NT!
