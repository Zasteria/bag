l_russian:
 STATIC_MODIFIER_NAME_nd_chi_celestial_authority: "Небесная власть" #NT!
 STATIC_MODIFIER_DESC_nd_chi_celestial_authority: "Сын Неба правит всем Под небом. Мандат восстановлен, имперская бюрократия проникла в каждую провинцию, каждую префектуру, каждую деревню. Экзаменационные залы заполняются учеными, цензоры искореняют коррупцию, а авторитет Трона Дракона сияет наружу, как само солнце. Все народы внутри королевства склоняются к центру." #NT!
 STATIC_MODIFIER_NAME_nd_chi_maritime_ascendancy: "Морское господство" #NT!
 STATIC_MODIFIER_DESC_nd_chi_maritime_ascendancy: "Флоты с сокровищами Поднебесной снова отправляются в путь, их паруса затемняют горизонт от Южно-Китайского моря до берегов Африки. Верфи Нанкина и Лунцзяна гремят строительством, купцы Кантона и Цюаньчжоу жиреют на прибылях от морского шелкового пути, а Знамя Дракона реет над гаванями, которые никогда не видели ничего подобного." #NT!
 nd_chi.1.t: "Мандат восстановлен" #NT!
 nd_chi.1.d: "Раздробленные земли Китая снова объединены под единым сувереном. Мандат Небес, этот древний договор между правителем и космосом, перешел к династии, которая доказала свою ценность как завоеваниями, так и управлением. Среднее царство восстановлено. Но остается вопрос о том, как распорядиться этой огромной властью.\n\nБюрократические традиции тысячелетий предлагают один путь: усовершенствовать имперскую администрацию, расширить систему экзаменов, передать всю власть Трону Дракона. Государства-данники признают небесное превосходство, а царством будут управлять учёные, изучающие классику.\n\nНо моря зовут с другим обещанием. Верфи побережья могут спустить на воду флоты, которые затмевают все, что видел мир. Морской шелковый путь доставляет фарфор, шелк и чай до каждого берега. Богатство Китая не должно ограничиваться его границами. Он может течь наружу во время прилива.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_chi.1.a: "Трон Дракона командует всем Поднебесной." #NT!
 nd_chi.1.b: "Пусть флот сокровищ донесет нашу цивилизацию до каждого берега." #NT!
 nd_chi.2.t: "Батальон Божественных Машин" #NT!
 nd_chi.2.d: "Шэньцзиин, батальон божественных машин, представляет собой революцию в военной организации. Это элитное формирование, созданное для использования разрушительного потенциала порохового оружия, изобретенного самим Китаем, объединяет аркебузиров, ракетчиков и артиллеристов в дисциплинированную боевую силу, не похожую ни на что, что видел мир.\n\nОгненное копье, первое в мире пороховое оружие, было китайским изобретением. Теперь его потомки (ручная пушка, фитильное ружье, залповое ружье) организованы в постоянные воинские подразделения со стандартным вооружением и регулярной тренировкой. «Хуолунцзин», «Руководство Огненного Дракона», систематизирует это оружие и его тактическое применение. Вопрос в том, стоит ли полностью посвятить себя этой революции огнестрельного оружия или сохранить ее как один из многих инструментов." #NT!
 nd_chi.2.a: "Шэньцзин станет авангардом наших армий." #NT!
 nd_chi.2.b: "Достойное дополнение к нашей военной традиции" #NT!
 nd_chi.3.t: "Реформа единого кнута" #NT!
 nd_chi.3.d: "Великий министр Чжан Цзючжэн предложил радикальную трансформацию имперской налоговой системы. Нынешний лабиринт земельных налогов, трудовых обязательств и дани (взимаемой с зерна, шелка, серебра и барщинного труда по десяткам отдельных категорий) будет объединен в единый платеж серебром. Регистры рыбной чешуи будут переработаны, земля заново обследована, а уклонению от уплаты налогов дворянами будет противодействовать напрямую.\n\nЦифры говорят сами за себя: доходы от серебра могут почти утроиться в течение десятилетия. Но эта реформа наносит удар по привилегиям землевладельцев, того самого класса, который укомплектовывает бюрократию. А привязка всех налогов к серебру делает империю зависимой от потока иностранного серебра через морскую торговлю: уязвимость, которая может оказаться опасной, если этот поток когда-либо будет нарушен." #NT!
 nd_chi.3.a: "Внедрить «Единый Кнут» во всех провинциях" #NT!
 nd_chi.3.b: "Реформа в принципе правильная" #NT!
 nd_chi.4.t: "Движение за самоусиление" #NT!
 nd_chi.4.d: "Унижения последних десятилетий болезненно прояснили одну вещь: военные технологии Поднебесной отстают от западных варваров. Коалиция реформаторски настроенных чиновников (Ли Хунчжан, Цзэн Гофань, Цзо Цзунтан) выступают за программу выборочной модернизации. «Китайское обучение основным принципам, западное обучение ради практического применения», — утверждают они.\n\nЦзянаньский арсенал в Шанхае, верфь Фучжоу, Тяньцзиньская военная академия: эти учреждения представляют собой новый Китай, который осваивает иностранные технологии, не отказываясь от собственной цивилизации. Но консерваторы в суде задаются вопросом, могут ли западные методы быть приняты без того, чтобы западные идеи не следовали за ними. Сможет ли империя модернизировать свое вооружение, сохранив при этом конфуцианский порядок?" #NT!
 nd_chi.4.a: "Перенять западные методы: империя должна быть сильной" #NT!
 nd_chi.4.b: "Сохранить основные принципы нашей цивилизации" #NT!
 STATIC_MODIFIER_NAME_nd_chi_shenjiying_legacy: "Наследие Шэньцзина" #NT!
 STATIC_MODIFIER_DESC_nd_chi_shenjiying_legacy: "Инновации Батальона Божественных Машин в области пороховой войны продолжают влиять на китайскую военную доктрину." #NT!
 STATIC_MODIFIER_NAME_nd_chi_single_whip_efficiency: "Эффективность одного хлыста" #NT!
 STATIC_MODIFIER_DESC_nd_chi_single_whip_efficiency: "Объединение налогов в единый платеж серебром упростило сбор доходов по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_chi_self_strengthening_momentum: "Импульс самоусиления" #NT!
 STATIC_MODIFIER_DESC_nd_chi_self_strengthening_momentum: "Арсеналы и академии Движения самоусиления способствуют быстрой модернизации китайской промышленности и вооруженных сил." #NT!
 STATIC_MODIFIER_NAME_nd_chi_yangwu_traditionalism: "Янву Традиционализм" #NT!
 STATIC_MODIFIER_DESC_nd_chi_yangwu_traditionalism: "Сохранение конфуцианских принципов наряду с выборочной модернизацией поддерживает культурный авторитет Поднебесной." #NT!
 nd_chi_junk_tradition: "Мусорная традиция" #NT!
 nd_chi_junk_tradition_desc: "Морское наследие Китая насчитывает тысячелетия. Океанская джонка (с ее водонепроницаемыми отсеками, сбалансированным рулем и парусами с латами) является самым совершенным судном своего времени. От морских побед династии Сун до прибрежных торговых путей — китайское судостроение представляет собой непрерывную традицию морской техники." #NT!
 nd_chi_keju_system: "Экзаменационная система Кеджу" #NT!
 nd_chi_keju_system_desc: "Имперская экзаменационная система отбирает чиновников посредством тщательной проверки классического образования, литературного творчества и политического анализа. Этот меритократический институт, оттачивавшийся на протяжении веков, порождает правящий класс учёных-бюрократов, чья лояльность связана с троном, а не с региональными лордами." #NT!
 nd_chi_silk_weaving: "Традиция шелководства" #NT!
 nd_chi_silk_weaving_desc: "Китайское производство шелка, совершенствовавшееся на протяжении четырех тысячелетий, остается непревзойденным нигде в мире. Спонсируемые государством ткацкие мастерские в Сучжоу, Ханчжоу и Нанкине производят ткани исключительного качества, которые продаются по высоким ценам на каждом торговом пути от степи до Средиземноморья." #NT!
 nd_chi_treasure_fleet: "Флот сокровищ" #NT!
 nd_chi_treasure_fleet_desc: "Грандиозные верфи Лунцзяна и Нанкина спускают на воду самые большие суда, которые когда-либо видел мир. Флот сокровищ, сотни кораблей, перевозящих тысячи моряков и солдат, распространяет китайскую мощь через Индийский океан, от Юго-Восточной Азии до побережья Африки." #NT!
 nd_chi_naval_levy: "Система военно-морского сбора" #NT!
 nd_chi_naval_levy_desc: "Прибрежное население Фуцзянь, Чжэцзян и Гуандун обеспечивает императорский флот опытными моряками и корабелами. Эти морские сообщества с их многолетними традициями мореплавания составляют основу военно-морской мощи Китая." #NT!
 nd_chi_imperial_kilns: "Императорские печи" #NT!
 nd_chi_imperial_kilns_desc: "Императорский фарфоровый завод в Цзиндэчжэне, основанный при императоре Хунву, превращает город в фарфоровую столицу мира. Печи, находящиеся под непосредственным управлением двора, производят изделия беспрецедентного качества: один императорский заказ может потребовать сотни тысяч изделий." #NT!
 nd_chi_yongle_grandeur: "Юнлэ Величие" #NT!
 nd_chi_yongle_grandeur_desc: "Амбициозная программа строительства императора Юнлэ (Запретный город, восстановление Большого канала, расширение Пекина) представляет собой наиболее концентрированный взрыв имперского строительства со времен династии Цинь. Эти проекты меняют физический ландшафт самого Китая." #NT!
 nd_chi_divine_machine: "Батальон божественных машин" #NT!
 nd_chi_divine_machine_desc: "Шэньцзин, одно из трех элитных подразделений столичного гарнизона, полностью занимается операциями с огнестрельным оружием. Вооруженные ручными пушками, реактивными системами залпового огня и прототипами мушкетов, описанными в «Хуолунцзин», эти войска представляют собой передовой край пороховой войны." #NT!
 nd_chi_firearm_levies: "Сборы за огнестрельное оружие" #NT!
 nd_chi_firearm_levies_desc: "Успех модели Шэньцзиин вдохновляет на распространение обучения обращению с огнестрельным оружием на более широкую систему сборов. Провинциальные гарнизоны все активнее оснащают свои войска пороховым оружием, создавая общенациональный резерв подготовленных операторов огнестрельного оружия." #NT!
 nd_chi_haijin_defense: "Береговая оборона Хайджина" #NT!
 nd_chi_haijin_defense_desc: "Политика запрета на морское судоходство в Хайджине, каковы бы ни были ее последствия для торговли, стимулирует строительство обширной сети береговой обороны. Укрепленные сторожевые башни, военно-морские патрульные посты и гарнизонные посты окружают побережье от Ляодуна до Гуандуна, образуя защитную цепь от пиратов вокоу и иностранных вторжений." #NT!
 nd_chi_canal_mastery: "Мастерство Гранд-канала" #NT!
 nd_chi_canal_mastery_desc: "Восстановленный Большой канал, протянувшийся более чем на 1700 километров от Ханчжоу до Пекина, является самой длинной искусственной водной артерией в мире. Миллионы рабочих поддерживают шлюзы, насыпи и питающие каналы. Это чудо инженерной мысли связывает воедино север и юг Китая, доставляя в столицу зерно, шелк и фарфор и связывая экономику империи в единую ткань." #NT!
 nd_chi_single_whip_reform: "Реформа единого кнута" #NT!
 nd_chi_single_whip_reform_desc: "Широкая налоговая реформа Чжан Цзючжэна объединяет ошеломляющее множество налогов эпохи Мин (земельный налог, трудовая повинность, местные сборы, дани) в единый платеж серебром. Комплексное землеустроительное обследование, пересмотренные реестры рыбной чешуи и прямой сбор серебра почти утроили государственные доходы за десятилетие." #NT!
 nd_chi_fuchuan_warship: "Фучуаньский военный корабль" #NT!
 nd_chi_fuchuan_warship_desc: "Фучуань, «благословенный корабль», является основой китайского океанского флота. Эти большие плоскодонные суда несут тяжелое вооружение, вмещают большой экипаж и могут плавать как на прибрежных мелководьях, так и в открытом океане. Вооруженный бронзовыми пушками и огненными стрелами, фучуань представляет военно-морскую мощь Китая в эпоху парусного спорта." #NT!
 nd_chi_porcelain_trade: "Доминирование в торговле фарфором" #NT!
 nd_chi_porcelain_trade_desc: "Китайский фарфор, «белое золото» для европейцев, которые его жаждут, доминирует в мировой торговле предметами роскоши. Печи Цзиндэчжэня производят миллионы изделий ежегодно, которые экспортируются через Кантон и морской шелковый путь на рынки Японии, Юго-Восточной Азии, Ближнего Востока и Европы. Ни один конкурент не может сравниться по качеству, масштабу и разнообразию с китайской керамической продукцией." #NT!
 nd_chi_mandarin_duck: "Формирование утки-мандаринки" #NT!
 nd_chi_mandarin_duck_desc: "Инновационное формирование генерала Ци Цзигуана «утка-мандаринка» из двенадцати человек объединяет пикинеров, мечников, щитовиков и владельцев волчьих зарослей в гибкое тактическое подразделение, предназначенное для противодействия быстродвижущимся рейдерам вокоу. Этот общевойсковой подход, закрепленный в военных трактатах Ци, представляет собой новый стандарт тактического совершенства." #NT!
 nd_chi_canton_system: "Кантонская система" #NT!
 nd_chi_canton_system_desc: "Ограничение правительством Цин всей внешней морской торговли единственным портом Кантона создает контролируемую коммерческую среду, в которой Тринадцать фабрик, лицензированные китайские торговые дома, служат посредниками между западными торговцами и внутренними районами Китая. Система генерирует огромные таможенные доходы, сохраняя при этом иностранное влияние.\n\n#italic Доступно в: $nd_chi_porcelain_kiln$#!" #NT!
 nd_chi_banner_integration: "Интеграция баннеров" #NT!
 nd_chi_banner_integration_desc: "Расширение системы Восьми Знамен за счет включения в нее подразделений монголов и ханьцев создает многонациональную имперскую армию. Двадцать четыре знамени (восемь маньчжурских, восемь монгольских, восемь ханьских) образуют постоянные гарнизонные силы, дислоцированные в стратегических городах по всей империи, объединяя разнообразные воинские традиции в единую командную структуру." #NT!
 nd_chi_literary_compilations: "Энциклопедические сборники" #NT!
 nd_chi_literary_compilations_desc: "Масштабные литературные проекты двора Цин («Словарь Канси», «Полная библиотека четырех сокровищниц», «Собрание статутов») представляют собой самую амбициозную программу компиляции знаний в истории человечества. Только «Сику Цюаньшу» насчитывает более 36 000 томов, сохраняя и систематизируя все китайское интеллектуальное наследие." #NT!
 nd_chi_self_strengthening: "Самоусиливающееся движение" #NT!
 nd_chi_self_strengthening_desc: "Движение Янву, «движение за международные отношения», представляет собой первую систематическую попытку Китая провести военную и промышленную модернизацию. Цзяннаньский арсенал в Шанхае, судостроительный завод в Фучжоу, Тяньцзиньская военная академия и десятки более мелких предприятий приносят западные промышленные технологии на китайскую землю в соответствии с принципом «Китайская сущность, западные методы»." #NT!
 nd_chi_tongzhi_restoration: "Реставрация Тунчжи" #NT!
 nd_chi_tongzhi_restoration_desc: "Реставрация Тунчжи представляет собой согласованные усилия по возрождению династии Цин посредством возврата к конфуцианским принципам управления в сочетании с практической административной реформой. Подавление восстаний тайпинов и нянь, реорганизация провинциальной администрации и возрождение экзаменационной системы демонстрируют, что старый порядок сохраняет как жизнеспособность, так и легитимность." #NT!
 nd_chi_maritime_customs: "Модернизация морской таможни" #NT!
 nd_chi_maritime_customs_desc: "Создание Имперской морской таможенной службы под иностранным контролем, но принадлежащим Китаю, вводит современный учет, стандартизированные тарифы и эффективный сбор доходов в портовой системе Китая. Таможенные доходы становятся надежным источником дохода для центрального правительства и моделью административной модернизации." #NT!
 nd_chi_reform_spirit: "Дух реформ" #NT!
 nd_chi_reform_spirit_desc: "Дух реформ, который оживил «Сто дней 1898 года», пусть и кратко, представляет собой видение всеобъемлющей институциональной модернизации: современная система образования, конституционное правительство, индустриальная экономика. Хотя первоначальное движение было подавлено, его идеи нельзя игнорировать. Джин реформы, однажды выпущенный на свободу, меняет все последующие политические дебаты." #NT!
 a_nd_chi_shenjiying: "Шэньцзиин" #NT!
 a_nd_chi_shenjiying_desc: "Батальон божественных машин: элитная пороховая пехота, вооруженная ручными пушками, фитильными ружьями и ракетными установками. Основанная как одна из трех элитных дивизий столичного гарнизона, Шэньцзин представляет собой мастерство Китая в изобретенной им революции огнестрельного оружия." #NT!
 a_nd_chi_shenjiying_levy: "Шэньцзин Леви" #NT!
 a_nd_chi_shenjiying_levy_desc: "Войска провинциального гарнизона обучались шэньцзинским традициям ведения пороховой войны." #NT!
 n_nd_chi_war_junk: "Военный мусор" #NT!
 n_nd_chi_war_junk_desc: "Тяжеловооруженная океанская джонка, созданная для морских боев. Обладая водонепроницаемыми отсеками, большими помещениями для экипажа и тяжелым вооружением, военная джонка является основой китайской военно-морской мощи." #NT!
 n_nd_chi_war_junk_levy: "Военный мусор Леви" #NT!
 n_nd_chi_war_junk_levy_desc: "Набранная военная джонка с экипажем из прибрежного населения с многолетними традициями мореплавания." #NT!
 n_nd_chi_fuchuan: "Фучуань" #NT!
 n_nd_chi_fuchuan_desc: "«Благословенный корабль»: большой военный корабль с плоским дном, вооруженный бронзовыми пушками и огненными стрелами. «Фучуань» может плавать как на прибрежных мелководьях, так и в открытом океане, имея на борту более крупный экипаж и более тяжелое вооружение, чем стандартные военные корабли." #NT!
 nd_chi_examination_hall: "Императорский экзаменационный зал" #NT!
 nd_chi_examination_hall_desc: "Управляемый государством комплекс, где кандидаты сдают имперские экзамены, соревнуясь за должности на государственной службе посредством владения конфуцианской классикой, литературным сочинением и политическим анализом." #NT!
 nd_chi_examination_upkeep: "Экзаменационная администрация" #NT!
 nd_chi_examination_upkeep_desc: "Бумага, книги и прекрасная ткань для ученых: регулярное проведение имперских экзаменов требует постоянного снабжения письменными материалами, классическими текстами и подходящей одеждой как для экзаменаторов, так и для кандидатов." #NT!
 nd_chi_porcelain_kiln: "Императорская фарфоровая печь" #NT!
 nd_chi_porcelain_kiln_desc: "Государственный печной комплекс, производящий фарфор высочайшего качества для императорского использования и экспорта. Разделение труда (с отдельными специалистами по формованию, глазурованию, покраске и обжигу) позволяет производить продукцию в промышленных масштабах." #NT!
 nd_chi_porcelain_production: "Операции с печью" #NT!
 nd_chi_porcelain_production_desc: "Тонкая каолиновая глина, обработанная и обожженная в печах-драконах для производства фарфора императорского качества." #NT!
 nd_chi_coastal_defense: "Форт береговой обороны" #NT!
 nd_chi_coastal_defense_desc: "Укреплённое береговое сооружение, сочетающее в себе сторожевую башню, гарнизонные казармы и патрульную станцию ​​ВМФ. Часть цепи морской защиты империи от пиратства и иностранного вторжения." #NT!
 nd_chi_coastal_garrison_upkeep: "Обслуживание прибрежного гарнизона" #NT!
 nd_chi_coastal_garrison_upkeep_desc: "Вооружение, камень для укреплений и инструменты обеспечивают вооружение гарнизона береговой обороны и ремонт ее стен." #NT!
 nd_chi_grand_shipyard: "Гранд Верфь" #NT!
 nd_chi_grand_shipyard_desc: "Огромный судостроительный завод, способный строить самые большие суда в мире. Множество сухих доков, лесных складов и достроечных причалов позволяют одновременно строить военные джонки и корабли с сокровищами." #NT!
 nd_chi_shipyard_maintenance: "Операции верфи" #NT!
 nd_chi_shipyard_maintenance_desc: "Древесина, военно-морские запасы и инструменты корабелов обеспечивают постоянное строительство и оснащение военных джонок и кораблей с сокровищами." #NT!
 nd_chi_nanjing_arsenal: "Нанкинский Арсенал" #NT!
 nd_chi_nanjing_arsenal_desc: "Современный оружейный завод, производящий огнестрельное оружие, артиллерию и боеприпасы с использованием западных промышленных методов. Этот арсенал отражает приверженность Движения самоусиления военной модернизации." #NT!
 nd_chi_arsenal_operations: "Арсенал Производство" #NT!
 nd_chi_arsenal_operations_desc: "Огнестрельное оружие, артиллерия, железный инвентарь и уголь для печей обеспечивают непрерывное производство современного оружия и боеприпасов в арсенале." #NT!
 levy_nd_chi_shenjiying: "Шэньцзин Леви" #NT!
 levy_nd_chi_shenjiying_desc: "Войска, вооруженные порохом, сформированные из солдат гарнизона в традициях Шэньцзина." #NT!
 levy_nd_chi_war_junk: "Военный мусор Леви" #NT!
 levy_nd_chi_war_junk_desc: "Военные джонки с экипажами прибрежных общин и морских рабочих." #NT!
 nd_chi_canton_export: "Кантонские экспортные операции" #NT!
 nd_chi_canton_export_desc: "Экспортно-ориентированный фарфор, украшенный цветными надглазурными эмалями для западных рынков, производимый по Кантонской системе на Тринадцати фабриках." #NT!
 nd_chi_formed_tt: "Китай был образован" #NT!
 nd_chi_path_a_tt: "Выбрал Небесную Власть" #NT!
 nd_chi_path_b_tt: "Выбрали морское господство" #NT!
 nd_chi_destiny: "Мандат сохраняется" #NT!
 nd_chi_destiny_desc: "Китай воссоединен и Небесный Мандат закреплен. Сейчас Срединное Царство стоит на распутье: обратится ли оно вовнутрь, чтобы усовершенствовать свое небесное управление, или вовне, чтобы распространить свою цивилизацию через моря? Стабильность имеет первостепенное значение: прежде чем начнется великая работа, в королевстве должен быть мир." #NT!
 nd_chi_dest_pacify: "Умиротворение границ" #NT!
 nd_chi_dest_pacify_desc: "Кочевая степь и южные королевства уже давно бросают вызов имперской власти. Поднимите Каракорум под Знамя Дракона и распространите мандат на Дай Вьет. Только когда границы будут в безопасности, империя сможет обратить внимание на более масштабные амбиции." #NT!
 nd_chi_dest_nine_prov: "Объединение девяти провинций" #NT!
 nd_chi_dest_nine_prov_desc: "Древний идеал Девяти Провинций охватывал все цивилизованные земли под небом. Включите Тибет и Самарканд в имперскую сферу, чтобы продемонстрировать, что ни один уголок мира не находится за пределами досягаемости Трона Дракона. Развивайте королевство до тех пор, пока его богатство не будет соответствовать его территориальным амбициям." #NT!
 nd_chi_dest_all_under: "Все под небом" #NT!
 nd_chi_dest_all_under_desc: "Тянься, «Все под небом», — это не просто фраза, а судьба. Когда Трон Дракона господствует от Дели до Каракорума, когда ни один соперник не может сравниться с империей по развитию или военной мощи, Небесный Мандат становится универсальным фактом. Постройте Запретный дворец как резиденцию вечной администрации." #NT!
 nd_chi_dest_sea_routes: "Открытие морских путей" #NT!
 nd_chi_dest_sea_routes_desc: "Ограничения в Хайцзине задушили естественное морское преимущество Китая. Измените эту изоляцию: захватите контрольно-пропускной пункт в Малакке и обеспечьте потоки шелка через рынки, находящиеся под имперским влиянием. Морские пути, по которым когда-то перевозился флот Чжэн Хэ, должны быть вновь открыты для китайской торговли." #NT!
 nd_chi_dest_treasure: "Восходящий флот сокровищ" #NT!
 nd_chi_dest_treasure_desc: "Путешествия Чжэн Хэ доказали, что Китай может проецировать свою мощь через Индийский океан. Теперь сделайте эту проекцию постоянной. Обезопасьте Палембанг и Каликут, ворота на острова Пряностей и Малабарское побережье, и привлеките современные финансовые институты для финансирования этого океанского предприятия." #NT!
 nd_chi_dest_dragon_shore: "Знамя Дракона над каждым берегом" #NT!
 nd_chi_dest_dragon_shore_desc: "От Ормуза в устье Персидского залива до Могадишо на африканском побережье и до Темасека на перекрестке всей азиатской торговли: Знамя Дракона должно развеваться над каждым крупным портом морского мира. Постройте Пристань Сокровищ, чтобы поддержать это беспрецедентное военно-морское предприятие." #NT!
 nd_chi.5.t: "Мандат сохраняется" #NT!
 nd_chi.5.d: "Поднебесная снова едина. Раздробленные воюющие государства были подчинены, мандат обеспечен как завоеваниями, так и мудростью. Трон Дракона стоит над самой густонаселенной и продуктивной цивилизацией на земле.\n\nНо для превосходства необходимо руководство. Ресурсы империи огромны, но не бесконечны. Вопрос, который преследовал каждую династию со времен Первого Императора, теперь стоит перед нами: в каком направлении будет расти Поднебесная?" #NT!
 nd_chi.5.a: "Мандат в безопасности: на данный момент" #NT!
 nd_chi.6.t: "Границы умиротворены" #NT!
 nd_chi.6.d: "Степные кочевники, тысячелетиями преследовавшие Китай, оказались под имперской властью. Южные королевства признают Трон Дракона. Впервые за столетия границы империи по-настоящему безопасны.\n\nГенералы, одержавшие эти победы, теперь обращаются ко двору за получением следующих приказов. Бюрократия уже расширяет свое влияние на недавно умиротворенные территории, создавая экзаменационные залы и налоговые регистры там, где когда-то царил только хаос." #NT!
 nd_chi.6.a: "Пограничные генералы заслужили свои награды" #NT!
 nd_chi.7.t: "Объединение девяти провинций" #NT!
 nd_chi.7.d: "Древняя мечта о девяти провинциях, всех цивилизованных землях под властью одного суверена, приближается к реальности. Монастыри Тибета и базары Самарканда теперь действуют под защитой Знамени Дракона. Империя простирается от крыши мира до берегов Окса.\n\nЭто достижение требует выбора в управлении. Некоторые министры выступают за укрепление мандата за счет дипломатического престижа и лояльных подданных, а также использования растущей шпионской сети империи для предотвращения восстания до его начала. Другие выступают за программу военного укрепления: создать на границах гарнизоны с постоянными силами, инвестировать в осадные возможности и сделать империю буквально неприступной." #NT!
 nd_chi.7.a: "Правило через моральный авторитет мандата" #NT!
 nd_chi.7.b: "Укрепляйте каждую границу и ставьте гарнизоны на каждом перевале." #NT!
 nd_chi.8.t: "Все под небом" #NT!
 nd_chi.8.d: "Тянься достигнута. Трон Дракона управляет империей беспрецедентных размеров: от субконтинентальных равнин до среднеазиатских степей, от тропического юга до замерзшего севера. Ни одна династия в истории Китая не правила так долго и так твердо.\n\nУченые при дворе спорят о значении этого достижения. «Ястребы» утверждают, что универсальная империя требует всеобщей готовности: армейские традиции, дипломатический аппарат, механизмы войны должны быть усовершенствованы, чтобы сохранить это господство навсегда. Конфуцианские идеалисты возражают, что истинное универсальное правление требует гармонии, и что империя должна исцелить завоеванные земли, построить свой престиж посредством культурных достижений и позволить одному только весу своей цивилизации сделать восстание немыслимым." #NT!
 nd_chi.8.a: "Универсальная империя требует всеобщей бдительности" #NT!
 nd_chi.8.b: "Пусть небесная гармония управляет всем Поднебесной" #NT!
 nd_chi.9.t: "Морские пути вновь открыты" #NT!
 nd_chi.9.d: "Малаккский пролив, узкий проход, через который должна проходить половина мировой торговли, теперь подчиняется Трону Дракона. Китайские купцы, освобожденные от ограничений Хайдзина, уже создают торговые посты и склады в каждом порту от Явы до Сиама.\n\nШёлк, который когда-то путешествовал по суше на спинах верблюдов, теперь перемещается по морю в трюмах джонок, быстрее и в гораздо большем количестве. Морской шелковый путь возрождается, и на этот раз он развевается под Знаменем Дракона." #NT!
 nd_chi.9.a: "Флот сокровищ снова плывет" #NT!
 nd_chi.10.t: "Восходящий флот сокровищ" #NT!
 nd_chi.10.d: "Китайская военно-морская мощь теперь простирается от островов Пряностей до Малабарского побережья. Палембанг и Каликут, двойные ворота Индийского океана, находятся под властью империи. Флот сокровищ достиг того, что мог только продемонстрировать Чжэн Хэ: постоянного китайского господства над морским миром.\n\nСеребро, которое течет в Китай из этой океанической империи, ошеломляет. Вопрос в том, как это направить. Некоторые выступают за реинвестирование в саму торговую сеть: улучшение разведки, увеличение дипломатических связей, сеть коммерческих отношений, которая делает китайскую торговлю незаменимой. Другие настаивают на чистом и простом военно-морском превосходстве: более быстрые корабли, лучше обученные экипажи, флот, способный проецировать мощь где угодно." #NT!
 nd_chi.10.a: "Серебряный прилив обогащает все королевство" #NT!
 nd_chi.10.b: "Господство на флоте обеспечивает безопасность торговых путей" #NT!
 nd_chi.11.t: "Знамя Дракона над каждым берегом" #NT!
 nd_chi.11.d: "От Персидского залива до побережья Африки, от проливов Юго-Восточной Азии до гаваней Индии: каждый крупный порт морского мира теперь признает китайское превосходство. Флот с сокровищами затмевает любой конкурирующий флот. Китайские торговцы доминируют на каждом рынке, на который они выходят.\n\nЭто достижение, не имеющее исторических аналогов. Теперь вопрос заключается в том, использовать ли это превосходство на море в военных целях (проецирование мощи империи на все театры военных действий, снижение стоимости ведения войны за рубежом) или в экономических целях, используя морской шелковый путь как торговую магистраль, которая обогащает королевство за счет торговли и вербовки наемников, а не завоеваний." #NT!
 nd_chi.11.a: "Сам океан является владением империи." #NT!
 nd_chi.11.b: "Пусть морской шелковый путь свяжет мир" #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_mandate_vigor: "Энергия Мандата" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_mandate_vigor: "Моральный авторитет Трона Дракона требует лояльности подданных и уважения иностранных дворов. Имперские агенты следят за каждой провинцией на предмет признаков нелояльности." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_frontier_garrisons: "Пограничные гарнизоны" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_frontier_garrisons: "Постоянные военные гарнизоны вдоль каждой границы делают империю неприступной. Осадные инженеры готовы разрушить любую крепость, которая осмелится противостоять имперской власти." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_universal_empire: "Универсальная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_universal_empire: "Механизмы всемирного господства совершенствуются: профессиональная военная традиция, эффективный дипломатический аппарат и власть диктовать условия любому противнику." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_celestial_harmony: "Небесная Гармония" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_celestial_harmony: "Империя управляет посредством гармонии, а не силы. Опустошенные земли быстро восстанавливаются под великодушным управлением, а престиж династии сохраняется из поколения в поколение." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_silver_tide: "Серебряный прилив" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_silver_tide: "Поток серебра по торговым путям, контролируемым Китаем, обогащает каждый уголок королевства. Сырье поступает из заморских территорий, а дипломатические связи растут." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_fleet_dominance: "Превосходство флота" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_fleet_dominance: "Легкие эскадрильи Флота сокровищ патрулируют все морские пути. Быстродвижущиеся военно-морские силы проецируют мощь далеко от дома, хотя сухопутным силам уделяется меньше внимания." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_ocean_sovereign: "Океан Суверен" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_ocean_sovereign: "Империя проецирует военную мощь через все океаны. Зарубежные кампании начинаются с легкостью, а линии снабжения простираются на край земли." #NT!
 STATIC_MODIFIER_NAME_nd_chi_dest_silk_road_sea: "Шелковый путь моря" #NT!
 STATIC_MODIFIER_DESC_nd_chi_dest_silk_road_sea: "Морской Шелковый путь приносит такое богатство, что империя может позволить себе наемные армии и сократить военные расходы. Единственная опасность – это самоуспокоенность, которую порождает богатство." #NT!
 nd_chi_forbidden_palace: "Запретный дворец" #NT!
 nd_chi_forbidden_palace_desc: "Высший административный комплекс вселенской империи: обширный дворцовый комплекс, из которого Сын Неба управляет всем Поднебесной. В его залах находится самая разветвленная бюрократия в истории человечества, в его архивах хранятся записи каждой провинции, а в экзаменационных палатах готовятся учёные-чиновники, которые управляют империей, не имеющей себе равных." #NT!
 nd_chi_palace_upkeep: "Администрация дворца" #NT!
 nd_chi_palace_upkeep_desc: "Бумага для бесконечных архивов, прекрасная ткань для придворных церемоний, мебель для тысяч комнат и инструменты для постоянного обслуживания: Запретный дворец потребляет ресурсы, подобающие резиденции вселенской империи." #NT!
 nd_chi_treasure_wharf: "Пристань Сокровищ" #NT!
 nd_chi_treasure_wharf_desc: "Массивный военно-морской комплекс, специально построенный для флота с сокровищами: множество сухих доков, складов древесины, парусных лофтов и причалов для оснащения, способных строить и обслуживать самые большие военные корабли и торговые суда, которые когда-либо видел мир. С этой пристани Знамя Дракона разносят на каждый берег." #NT!
 nd_chi_wharf_operations: "Причальные операции" #NT!
 nd_chi_wharf_operations_desc: "Древесина из южных лесов, военно-морские запасы с побережья, деготь для гидроизоляции и инструменты для корабелов: Причал Сокровищ требует постоянного притока материалов для поддержания мореходных качеств флота." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_chi_bureaucracy_authority: "Императорская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_chi_bureaucracy_authority: "Совокупный вес прецедента Суй-Тан, административного усовершенствования Сун и консолидации Юань-Мин создает постоянный институциональный аппарат. Постоянные министерства, экзаменационные комиссии, цензурные бюро и дворцовые бюро образуют самоподдерживающееся правительство: самую обширную бюрократию на земле. Рядом с неявным местом столицы открываются два институциональных места, что позволяет династии закрепить за собой три своих великих офиса." #NT!
  
 chi_keju_examinations_bureaucracy: "Имперская экзаменационная система" #NT!
 chi_keju_examinations_bureaucracy_desc: "Систематизированная Суй в 605 году и доведенная до зрелости при Тан и Сун, Кэджу отбирала чиновников путем конкурсного письменного экзамена по конфуцианской классике. Степени Шэн-юань, Цзюрен и Цзиньши определяли класс грамотных ученых-чиновников, лояльных трону, по сравнению с потомственными аристократами. Мин усилил систему в 1370 году, а Цин поддерживал ее до ее формальной отмены в 1905 году, создав меритократическое гражданское правительство, но навсегда запретив великим кланам занимать высшие должности и поощряя повсеместное мошенничество, фракционность и продажу ученых степеней в периоды упадка." #NT!
  
 chi_six_ministries_bureaucracy: "Шесть министерств" #NT!
 chi_six_ministries_bureaucracy_desc: "Лю Бу (министерства кадров, доходов, обрядов, войны, юстиции и труда) формировали административную основу имперского Китая, начиная со структуры Тан Саньшэн Любу. Каждое министерство, возглавляемое шаншу, вело дела королевства в стандартизированной мемориальной форме. Хорошо финансируемые министерства планировали единообразное управление во всех восемнадцати провинциях; из-за недостаточного финансирования они превратились в соперничающие баронства, ссорящиеся из-за юрисдикции, в то время как местное процветание пришло в упадок." #NT!
  
 chi_censorate_bureaucracy: "Цензорат" #NT!
 chi_censorate_bureaucracy_desc: "Ю-ши-тай при Тане, Ду Ча Юань при Мин и Цин: Цензорат действовал как независимое следственное подразделение параллельно Шести министерствам. Цензоры имели право на прямое поминовение трона и могли привлечь к ответственности любого чиновника, включая великих секретарей. Энергичный цензорат поддерживал честность чиновников и стабилизировал династию; захваченный или проигнорированный позволял провинциальным чиновникам действовать безнаказанно и ускорял династический упадок." #NT!
  
 chi_hanlin_academy_bureaucracy: "Академия Ханлинь" #NT!
 chi_hanlin_academy_bureaucracy_desc: "Ханьлинь Юань, основанный при Тане и возведенный Сун, был элитным литературным институтом империи. Набранные из числа выпускников высших учебных заведений дзинши, его члены составляли проекты императорских указов, составляли династические истории, обучали наследника и поддерживали ортодоксальность. Академия придавала трону непревзойденную культурную легитимность, но изнеженный класс академиков имел тенденцию кристаллизоваться во фракционные клики, чья поддержка действий императора становилась все более пустой." #NT!
  
 chi_grand_secretariat_bureaucracy: "Большой Секретариат" #NT!
 chi_grand_secretariat_bureaucracy_desc: "Основанный императором Юнлэ в 1402 году после того, как он упразднил канцлерство Чжуншу, Нэй Гэ начинался как специальный совет ученых Ханьлинь, которые заранее готовили памятники для трона. В течение столетия это был фактический кабинет Мин и ранней Цин, в котором старшие великие секретари обладали властью, подобной канцлеру. Ограниченный столичным судом, он ускорил принятие решений и централизовал власть. Но такой сильный старший секретарь, как Чжан Цзючжэн, мог затмить самого императора." #NT!
  
 chi_eunuch_bureau_bureaucracy: "Управление императорских евнухов" #NT!
 chi_eunuch_bureau_bureaucracy_desc: "Сы-ли Цзянь, возглавляемый церемониальным директором, возник в эпоху Юнлэ как бюро евнухов, хранящее императорскую печать. Евнухи, будучи лояльными только трону, позволяли императорам обходить ученую бюрократию и управлять параллельной администрацией. Система создала безжалостно эффективные автократии под руководством Чжэндэ и Ваньли. Но также и пресловутые диктатуры Ван Чжэня, Лю Цзиня и Вэй Чжунсяна, которые дискредитировали династию и ускорили крах Мин." #NT!
  
 chi_lifan_yuan_bureaucracy: "Лифан Юань" #NT!
 chi_lifan_yuan_bureaucracy_desc: "Основанный Хун Тайцзи в 1638 году и возведенный Цин в министерский ранг, Лифань Юань, Суд по колониальным делам, управлял Монголией, Тибетом, а затем и Синьцзяном через отдельный от Шести министерств аппарат. Действуя на монгольском, тибетском и маньчжурском, а также на китайском языках, он управлял лигами и знаменами, контролировал двор Далай-ламы и структурировал отношения данников с государствами Внутренней Азии. Его двойное пограничное управление сохраняло лояльность степи до тех пор, пока династия оставалась энергичной; пренебрежение привело к джунгарскому восстанию и долгому разрушению имперской границы." #NT!
