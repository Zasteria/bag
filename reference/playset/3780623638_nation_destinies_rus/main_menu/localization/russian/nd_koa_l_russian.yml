l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_the_cross: "Меч Креста" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_cross: "Знамя Христа реет над Африкой. Наши рыцари-крестоносцы — закаленные ветераны священной войны, сражающиеся с пылом людей, верящих, что Бог марширует на их стороне. Крепости, которые мы построим, станут оплотом христианского мира на враждебном берегу." #NT!
 STATIC_MODIFIER_NAME_nd_african_emporium: "Африканский торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_african_emporium: "Порты Туниса и Триполи контролируют узкие места Средиземного моря. Под христианским руководством эти древние торговые города снова процветают. Генуэзские, венецианские и каталонские купцы наполняют наши фонды товарами с трех континентов, а через наши таможни проходят богатства Африки." #NT!
 STATIC_MODIFIER_NAME_nd_koa_bulwark_of_faith: "Оплот веры" #NT!
 STATIC_MODIFIER_DESC_nd_koa_bulwark_of_faith: "Сеть укреплённых президиумов охраняет каждый подход к нашим африканским владениям. За их стенами христианские поселенцы живут в безопасности, и ни одна группа набегов не проходит мимо них беспрепятственно." #NT!
 nd_koa.1.t: "Крест на берегу" #NT!
 nd_koa.1.d: "Древние порты Северной Африки (Карфаген, Тунис, Триполи) наши. Там, где когда-то армии Людовика Святого погибли в песках, где рыцари Берберийского крестового похода подняли свои знамена перед Махдией, теперь на африканской земле стоит христианское королевство. Средиземное море больше не граница, а озеро, южный берег которого охраняется Крестом. Однако нас тяготит вопрос о том, чем станет это царство. Наши военные ордена обладают закаленными гарнизонами и могучими крепостями, в то время как торговые республики Италии следят за нашими портами с нескрываемой алчностью. Станем ли мы оружием христианского мира в Африке, несокрушимым оплотом против неверных? Или мы станем мостом между континентами, торговым центром, где на наших базарах смешиваются богатства Африки, Европы и Востока?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_koa.1.a: "Деус вульт! Наши крепости никогда не падут!" #NT!
 nd_koa.1.b: "Торговля обогащает там, где завоевание просто разрушает." #NT!
 nd_koa.2.t: "Сеть Президио" #NT!
 nd_koa.2.d: "Прибрежные укрепления Африки крестоносцев превратились из грубых частоколов в грозную систему звездных фортов и обнесенных стеной президиумов. От Ла-Голетты, охраняющей подступы к Тунису, до бастионов Триполи, возвышающихся над гаванью, каждая крепость контролирует свой участок береговой линии с переплетающимися полями огня. Командиры гарнизонов ежедневно тренируют своих мушкетеров, а стены достаточно толстые, чтобы выдержать обстрел самых тяжелых османских осадных орудий. Местные новообращенные служат вместе с европейскими солдатами, связанные общей верой и знанием того, что сдача означает смерть или рабство. Эта сеть президиумов является основой христианской Африки, пока стоят эти стены, и королевство будет существовать." #NT!
 nd_koa.2.a: "Пусть они разобьются о наши стены, как волны о берег." #NT!
 nd_koa.2.b: "Превратите наши крепости в торговые фактории." #NT!
 nd_koa.3.t: "Морские пехотинцы Ордена" #NT!
 nd_koa.3.d: "Военные ордена крестоносцев Африки давно осознали, что выживание их королевства зависит от господства на море. Был сформирован новый корпус морской пехоты Ордена, элитные солдаты обучены сражаться от корабля до берега, взбираться на крепостные стены с баркасов, штурмовать береговую оборону и проводить десантные рейды вдоль враждебных береговых линий. Эти морские пехотинцы, состоящие из самых молодых и сильнейших кандидатов ордена, сочетают в себе фанатичную храбрость рыцарей-крестоносцев с практическим мореходным искусством средиземноморских моряков. Они — кулак Ордена, наносящий удар туда, где враг меньше всего ожидает." #NT!
 nd_koa.3.a: "От моря к берегу продвигается Крест." #NT!
 nd_koa_order_commanderies: "Орден Командорства" #NT!
 nd_koa_order_commanderies_desc: "Военные ордена крестового похода создают укрепленные командования на завоеванной территории, объединяя замок, казармы и монастырь в единый комплекс." #NT!
 nd_koa_outremer_sergeants: "Аутремерские сержанты" #NT!
 nd_koa_outremer_sergeants_desc: "Традиция тяжелых пехотных сержантов, составляющих костяк полевых армий и гарнизонных сил крестоносцев." #NT!
 nd_koa_crusader_zeal: "Рвение крестоносца" #NT!
 nd_koa_crusader_zeal_desc: "Религиозный пыл, который движет государством крестоносцев, делает войны против язычников более дешевыми и более популярными среди верующих." #NT!
 nd_koa_pilgrim_routes: "Паломнические маршруты" #NT!
 nd_koa_pilgrim_routes_desc: "Создание паломнических приютов и промежуточных станций на маршрутах к святым местам Северной Африки, в том числе к руинам древнего Карфагена." #NT!
 nd_koa_order_discipline: "Дисциплина заказа" #NT!
 nd_koa_order_discipline_desc: "Строгая монашеская дисциплина военных орденов, где ежедневная молитва и муштра воспитывают солдат исключительной стойкости." #NT!
 nd_koa_turcopole_tradition: "Тюркопольская традиция" #NT!
 nd_koa_turcopole_tradition_desc: "Практика набора местных новообращенных и всадников смешанного происхождения в качестве легкой кавалерии, продолжающая традицию, впервые заложенную в государствах крестоносцев Леванта." #NT!
 nd_koa_fondaco_network: "Сеть Фондако" #NT!
 nd_koa_fondaco_network_desc: "Система торговых кварталов и торговых домов в итальянском стиле в портовых городах королевства, предоставляющая торговые привилегии европейским торговым республикам." #NT!
 nd_koa_african_diocese: "Африканская епархия" #NT!
 nd_koa_african_diocese_desc: "Установление формальной католической церковной иерархии в Северной Африке, возрождение древних епископств Карфагена и Гиппона, в число которых когда-то входил Августин." #NT!
 nd_koa_feudal_settlement: "Феодальное поселение" #NT!
 nd_koa_feudal_settlement_desc: "Систематическое расселение европейских колонистов на феодальных владениях, предоставленных короной, с созданием земельной аристократии, лояльной королевству крестоносцев." #NT!
 nd_koa_coral_trade: "Торговля африканскими кораллами" #NT!
 nd_koa_coral_trade_desc: "Добыча и экспорт драгоценных средиземноморских красных кораллов из вод Берберийского побережья — предмета роскоши, пользующегося спросом в Европе и на Востоке.\n\n#italic Доступно в: $nd_koa_fondaco$#!" #NT!
 nd_koa_presidio_system: "Президио Система" #NT!
 nd_koa_presidio_system_desc: "Сеть укреплённых прибрежных опорных пунктов с гарнизонами из профессиональных солдат, контролирующих гавани и подходы к городам королевства." #NT!
 nd_koa_corsair_fleet: "Корсарский флот" #NT!
 nd_koa_corsair_fleet_desc: "Флот быстрых галер с веслами, действующих из портов Туниса и Триполи, патрулирующих узкие места Средиземного моря и совершающих набеги на вражеские суда." #NT!
 nd_koa_mediterranean_trade: "Средиземноморское торговое доминирование" #NT!
 nd_koa_mediterranean_trade_desc: "Контроль над центральным Средиземноморьем дает крестоносцам в Африке рычаги влияния на торговлю между восточными и западными бассейнами моря." #NT!
 nd_koa_olive_export: "Экспорт оливкового масла" #NT!
 nd_koa_olive_export_desc: "Плодородные земли Ифрикии дают обильные урожаи оливок, а маслобойни королевства поставляют ламповое масло и кулинарный жир на рынки Средиземноморья.\n\n#italic Доступно в: $nd_koa_fondaco$#!" #NT!
 nd_koa_papal_patronage: "Папский патронаж" #NT!
 nd_koa_papal_patronage_desc: "Будучи последним активным государством крестоносцев, Крестоносцы Африки поддерживают особые отношения со Святым Престолом, получая финансовую и дипломатическую поддержку со стороны Рима." #NT!
 nd_koa_local_militia: "Местная милиция" #NT!
 nd_koa_local_militia_desc: "Организация местных новообращенных и поселенцев второго поколения в милицейские роты для гарнизонной службы и территориальной обороны." #NT!
 nd_koa_confessional_state: "Конфессиональное государство" #NT!
 nd_koa_confessional_state_desc: "Королевство удваивает свою католическую идентичность в эпоху Реформации, позиционируя себя как бастион ортодоксии на фоне религиозных потрясений в Европе." #NT!
 nd_koa_trans_mediterranean: "Транссредиземноморская торговля" #NT!
 nd_koa_trans_mediterranean_desc: "Порты королевства служат перевалочными пунктами для товаров, перемещающихся между атлантической экономикой и торговлей Леванта, получая прибыль от каждого обмена." #NT!
 nd_koa_order_reform: "Реформа военного порядка" #NT!
 nd_koa_order_reform_desc: "Военные ордена претерпевают внутренние реформы, повышающие профессионализм их управления и разделяющие их военные, благотворительные и коммерческие функции." #NT!
 nd_koa_star_fortification: "Звездное укрепление" #NT!
 nd_koa_star_fortification_desc: "Итальянские военные инженеры модернизируют оборону королевства в соответствии с современными принципами, заменяя средневековые стены наклонными бастионами, отражающими пушечные ядра." #NT!
 nd_koa_order_marines: "Приказ морской пехоты" #NT!
 nd_koa_order_marines_desc: "Элитный корпус солдат-амфибий, обученных морским атакам, прибрежным рейдам и операциям по штурму крепостей." #NT!
 nd_koa_colonial_administration: "Колониальная администрация" #NT!
 nd_koa_colonial_administration_desc: "Переход от пограничного военного правительства к зрелой колониальной администрации с гражданскими судами, сборщиками налогов и губернаторами провинций." #NT!
 nd_koa_naval_supremacy: "Африканское военно-морское превосходство" #NT!
 nd_koa_naval_supremacy_desc: "Флот королевства доминирует в центральном Средиземноморье, его военные корабли патрулируют от Сицилии до ливийского побережья." #NT!
 nd_koa_latin_culture: "Латинская культурная миссия" #NT!
 nd_koa_latin_culture_desc: "Королевство крестоносцев продвигает европейское образование, основывая школы и библиотеки, которые обслуживают как поселенцев, так и местных новообращенных." #NT!
 nd_koa_modern_fortifications: "Современные укрепления" #NT!
 nd_koa_modern_fortifications_desc: "Инженеры королевства используют новейшие европейские военные достижения, создавая многоуровневые оборонительные сооружения, способные противостоять продолжительным бомбардировкам и массированным нападениям." #NT!
 nd_koa_african_granary: "Африканское зернохранилище" #NT!
 nd_koa_african_granary_desc: "Сельскохозяйственные районы Туниса, когда-то житницы Рима, восстановлены до полной продуктивности благодаря систематическим европейским методам ведения сельского хозяйства." #NT!
 nd_koa_enlightened_order: "Просвещенный Орден" #NT!
 nd_koa_enlightened_order_desc: "Военные ордена воплощают в себе принципы рационального управления, научных исследований и институциональных реформ Просвещения, сохраняя при этом свои религиозные основы." #NT!
 nd_koa_mediterranean_union: "Средиземноморский союз" #NT!
 nd_koa_mediterranean_union_desc: "Уникальное положение королевства как моста между Европой и Африкой позволяет ему заключать дипломатические соглашения и способствовать сотрудничеству в Средиземноморье." #NT!
 a_nd_koa_sergeant: "Крестоносец-сержант" #NT!
 a_nd_koa_sergeant_desc: "Сержанты в доспехах, составляющие костяк гарнизона крестоносцев. Вооруженные кольчугами, щитами и мечами, они дисциплинированные защитники африканского аванпоста христианского мира." #NT!
 a_nd_koa_turcopole: "Африканский Туркополь" #NT!
 a_nd_koa_turcopole_desc: "Разведчики легкой кавалерии набираются из местных новообращенных и поселенцев смешанного происхождения. Быстрые, хорошо знакомые с местностью и смертоносные, владеющие луком и копьем, они служат глазами и ушами королевства." #NT!
 a_nd_koa_presidio_musketeer: "Президио Мушкетер" #NT!
 a_nd_koa_presidio_musketeer_desc: "Профессиональная гарнизонная пехота, вооруженная фитильными мушкетами, обученная защищать крепости президио от нападения и совершать вылазки для прорыва осады." #NT!
 n_nd_koa_corsair_galley: "Корсар Галера" #NT!
 n_nd_koa_corsair_galley_desc: "Быстрая, тяжеловооруженная галера, созданная для рейдов и прибрежного патрулирования. Эти суда, более быстрые, чем стандартные галеры и оснащенные дополнительными преследователями, являются ужасом для вражеского судоходства." #NT!
 a_nd_koa_order_marine: "Заказать Морской" #NT!
 a_nd_koa_order_marine_desc: "Элитная десантная пехота военных орденов, обученная сражаться от корабля до берега. Они штурмуют пляжи, взбираются на крепостные стены с лодок и совершают рейды в глубокий тыл врага." #NT!
 n_nd_koa_order_xebec: "Заказать Шебек" #NT!
 n_nd_koa_order_xebec_desc: "Быстрый военный корабль с латунным вооружением, сочетающий в себе галеру и парусник. Популярный среди средиземноморских флотов за свою скорость и маневренность, он превосходно справляется с патрулированием, преследованием и преследованием прибрежных районов." #NT!
 a_nd_koa_african_spearman: "Африканский Леви Спирмен" #NT!
 a_nd_koa_african_spearman_desc: "Местные рекруты, вооруженные копьями и щитами, из числа обращенного населения и поселенцев. Им не хватает экипировки, как у европейских регуляров, но они знают землю и сражаются за свои дома." #NT!
 nd_koa_commandery: "Орден командования" #NT!
 nd_koa_commandery_desc: "Укрепленный комплекс, служащий замком, казармами и монастырем, находящийся в ведении военных орденов. Рыцари тренируются в его стенах, паломники отдыхают в хосписе, а в часовне ежедневно проходят службы." #NT!
 nd_koa_fondaco: "Фондако" #NT!
 nd_koa_fondaco_desc: "Торговый квартал и торговый дом в итальянском стиле, предлагающий складские, жилые и коммерческие помещения европейским купцам, работающим в портах королевства." #NT!
 nd_koa_crusader_cathedral: "Собор крестоносцев" #NT!
 nd_koa_crusader_cathedral_desc: "Величественная церковь, построенная в романском или готическом стиле, резиденция епископа и центр католической миссии в Африке. В его школах преподают латынь, скрипторий копирует рукописи, а колокола призывают верующих к молитве." #NT!
 nd_koa_presidio: "Крепость Президио" #NT!
 nd_koa_presidio_desc: "Прибрежная крепость в форме звезды с гарнизоном профессиональных солдат, контролирующая гавань или стратегический подход. Его наклонные бастионы и взаимосвязанные огневые поля делают его практически неуязвимым для обычного нападения." #NT!
 nd_koa_pilgrim_hospice: "Паломнический хоспис" #NT!
 nd_koa_pilgrim_hospice_desc: "Дом отдыха, обслуживаемый религиозными орденами для паломников, путешественников и больных. Он обеспечивает еду, кров и базовую медицинскую помощь на дорогах Крестоносцев Африки." #NT!
 nd_koa_grain_warehouse: "Зерновой склад" #NT!
 nd_koa_grain_warehouse_desc: "Укрепленное хранилище для урожая пшеницы королевства, облегчающее оптовый экспорт через Средиземноморье. Торговля зерном сделала римскую Африку богатой, и крестоносцы возродили ее." #NT!
 nd_koa_african_academy: "Африканская академия" #NT!
 nd_koa_african_academy_desc: "Учебное заведение, основанное реформированными военными орденами, сочетающее европейскую ученость с практическим обучением навигации, инженерному делу и естественной философии." #NT!
 nd_koa_coral_harvesting: "Сбор кораллов" #NT!
 nd_koa_coral_harvesting_desc: "Дайверы и рыболовы-неводы добывают драгоценные красные кораллы со дна Средиземного моря у Берберийского побережья, потребляя рыбу в качестве продовольствия, керамику для сосудов для хранения и инструменты для водолазного снаряжения и сетей." #NT!
 nd_koa_olive_pressing: "Прессование оливкового масла" #NT!
 nd_koa_olive_pressing_desc: "Каменные прессы перемалывают обильный урожай оливок Ифрикии в масло на экспорт, потребляя оливки из садов, керамические амфоры для масла и инструменты для обслуживания прессового оборудования." #NT!
 levy_nd_koa_turcopole: "Африканский туркопольский сбор" #NT!
 levy_nd_koa_turcopole_desc: "Легкая кавалерия, собранная из местных новообращенных и поселенцев смешанного происхождения, служила разведчиками и застрельщиками в армиях крестоносцев." #NT!
 levy_nd_koa_african_spearman: "Африканский копейщик Леви" #NT!
 levy_nd_koa_african_spearman_desc: "Пехота ополчения, набранная из оседлого новообращенного населения, вооруженная копьями и щитами для гарнизонной и территориальной защиты." #NT!
 nd_koa_commandery_maintenance: "Командирское содержание" #NT!
 nd_koa_commandery_maintenance_desc: "Содержание укреплений, арсенала и гарнизона военно-религиозного командования, поставка камня для ремонта, оружия для арсенала и кожи для солдатского снаряжения." #NT!
 nd_koa_fondaco_operations: "Фондако Операции" #NT!
 nd_koa_fondaco_operations_desc: "Управление торговым домом, управление импортом тканей и красок из Средиземноморья и ведение торговых записей на бумаге." #NT!
 nd_koa_cathedral_maintenance: "Содержание собора" #NT!
 nd_koa_cathedral_maintenance_desc: "Поддержание каменной кладки, литургических нужд и научной деятельности собора крестоносцев, требующее камня для строительства, бумаги для скриптория и пчелиного воска для свечей, которые горят на каждом алтаре." #NT!
 nd_koa_presidio_upkeep: "Содержание Президио" #NT!
 nd_koa_presidio_upkeep_desc: "Содержание тяжелых укреплений и гарнизонного арсенала президиума береговой обороны." #NT!
 nd_koa_hospice_operations: "Хосписные операции" #NT!
 nd_koa_hospice_operations_desc: "Предоставление шерстяных одеял, пшеничного хлеба и приюта при свечах для паломников и больных в придорожном хосписе вдоль дорог Африки крестоносцев." #NT!
 nd_koa_warehouse_operations: "Складские операции" #NT!
 nd_koa_warehouse_operations_desc: "Хранение и распределение зерна для средиземноморской торговли, потребление пшеницы в качестве хранимого товара, пиломатериалов для ящиков и бочек, а также соли для сохранения зерна в длительных морских путешествиях." #NT!
 nd_koa_academy_operations: "Операции Академии" #NT!
 nd_koa_academy_operations_desc: "Предоставление книг, бумаги и стеклянных инструментов для академии Просвещения, сочетающей европейскую ученость с обучением навигации, инженерному делу и естественной философии." #NT!
 STATIC_MODIFIER_NAME_nd_koa_presidio_trade: "Президио Трейд" #NT!
 STATIC_MODIFIER_DESC_nd_koa_presidio_trade: "Прибрежные президиумы служат двойной цели: их стены защищают не только солдат, но и торговцев, а их гавани становятся процветающими торговыми центрами, где африканские и европейские товары переходят из рук в руки." #NT!
 nd_koa_formed_tt: "Крестоносец Африки был сформирован" #NT!
 nd_koa_path_a_tt: "Выбрать Меч Креста" #NT!
 nd_koa_path_b_tt: "Выбрал африканский торговый центр" #NT!
 nd_koa_destiny: "Судьба крестоносца Африки" #NT!
 nd_koa_destiny_desc: "Королевство крестоносцев было выковано кровью и верой. Теперь судьба манит, будь то мечом или бухгалтерской книгой, Крестоносец Африка оставит свой след в мире." #NT!
 nd_koa_dest_sicily: "Сицилийский плацдарм" #NT!
 nd_koa_dest_sicily_desc: "Сицилия и Мальта контролируют узкие места Средиземного моря. Захватите их, и ни один флот не плавает между востоком и западом без нашего разрешения. Контролируйте Сиракузы и Мальту с помощью сильной армии, чтобы обеспечить безопасность центрального Средиземноморья." #NT!
 nd_koa_dest_outremer: "Аутремер Реборн" #NT!
 nd_koa_dest_outremer_desc: "Королевство крестоносцев простирается за пределы Африки. Кипр, последний форпост старой династии Лузиньянов, должен нести наше знамя. Возьмите Фамагусту и Никосию, чтобы основать новый Утремер, простирающийся от Африки до берегов Леванта." #NT!
 nd_koa_dest_jerusalem: "Иерусалимское королевство" #NT!
 nd_koa_dest_jerusalem_desc: "Главный приз каждого крестового похода — сам Святой город. От Африки до Антиохии воздвигните Крест на стенах Иерусалима, Акры и Антиохии, чтобы осуществить крестовый поход, начавшийся в Клермоне." #NT!
 nd_koa_dest_narrows: "Мастер узких мест" #NT!
 nd_koa_dest_narrows_desc: "Порты Туниса и Триполи расположены на талии Средиземного моря, где должны проходить все торговые пути. Принесите шелк на свои рынки, наполните свою казну и докажите, что торговля сильнее меча." #NT!
 nd_koa_dest_banking: "Африканская биржа" #NT!
 nd_koa_dest_banking_desc: "Итальянские банкирские дома открыли филиалы в наших портах, и через нашу таможню проходят богатства трех континентов. Откройте для себя банковское учреждение и развивайте свои земли, чтобы стать финансовым центром Средиземноморья." #NT!
 nd_koa_dest_emporium: "Эмпориум Мунди" #NT!
 nd_koa_dest_emporium_desc: "Древняя мечта об универсальном торговом центре, где товары Африки, Азии и Европы переходят из рук в руки на едином рынке. Захватите Александрию, привлеките торговлю благовониями, накопите огромное состояние и превратите свои владения в самое богатое королевство на берегу Средиземного моря." #NT!
 nd_koa.4.t: "Кованое королевство" #NT!
 nd_koa.4.d: "Крестоносец Африки стоит. Там, где вандалы, византийцы и норманны пытались и потерпели неудачу, мы создали прочное христианское королевство на берегах Ифрикии. Наши знамена реют на стенах Туниса, наши колокола звонят на минаретах, которые мы освятили в церкви, и сам Папа благословил наше предприятие. Это не временный плацдарм; это государство со своими законами, землями и собственной судьбой." #NT!
 nd_koa.4.a: "Наша судьба только начинается." #NT!
 nd_koa.5.t: "Падение Сицилии" #NT!
 nd_koa.5.d: "Великая островная крепость Сицилия пала перед нашими войсками. Сиракузы, где Архимед бросил вызов Риму, теперь открывает свои ворота Африканскому Кресту. Мальта, эта бесплодная скала в узком переулке, тоже наша, а вместе с ней и контроль над всеми морскими путями между восточным и западным Средиземноморьем. Капитаны наших галер сообщают, что ни один вражеский флот не сможет пройти через сицилийские узкие места без нашего ведома и согласия. Центральное море наше." #NT!
 nd_koa.5.a: "Узости принадлежат Христу." #NT!
 nd_koa.6.t: "Шелковый путь моря" #NT!
 nd_koa.6.d: "Шелк с Востока, перевозимый генуэзскими и венецианскими торговцами, проходит теперь через наши порты. Таможни Туниса и Триполи заполнены тюками блестящей ткани, предназначенной для рынков христианского мира. Наше положение на талии Средиземноморья дает нам рычаги влияния на каждый торговый путь, а наша казна пополняется пошлинами, которые мы собираем." #NT!
 nd_koa.6.a: "Пусть богатства мира течет через наши порты." #NT!
 nd_koa.7.t: "Новый Аутремер" #NT!
 nd_koa.7.d: "Кипр наш. Остров, где когда-то Ричард Львиное Сердце водрузил свое знамя, где короли Лузиньянов построили свое обреченное королевство, где венецианцы разбогатели на сахаре и вине, — все это теперь принадлежит африканскому крестовому походу. Наша цепь крепостей простирается от Триполи до Фамагусты, непрерывная линия христианской стали через Средиземное море. Вопрос теперь в том, как использовать эту силу. Некоторые советы, к которым мы должны приступить немедленно, поддерживая динамику священной войны. Другие утверждают, что нам следует окопаться, укрепить то, что мы держим, и построить гарнизоны, которые будут удерживать эти острова на протяжении веков." #NT!
 nd_koa.7.a: "Продолжайте крестовый поход вперед без пауз." #NT!
 nd_koa.7.b: "Укрепляйте и ставьте гарнизоны при каждом подходе." #NT!
 nd_koa.8.t: "Ломбардная связь" #NT!
 nd_koa.8.d: "Итальянские банкирские дома (Флорентийские, Генуэзские, Сиенские) открыли постоянные представительства в наших портах, привлеченные объемом торговли, проходящей через африканские узкие места. Их аккредитивы и векселя смазывают колеса нашей торговли, а их капитал финансирует новые склады, доки и рыночные залы. Мы стоим на распутье в том, как управлять этим богатством. Мы могли бы полностью принять итальянскую банковскую модель, переняв ее сложные финансовые инструменты и разумную денежно-кредитную политику. Или мы могли бы более агрессивно использовать нашу военно-морскую позицию, используя наш корсарский флот для защиты и налогообложения средиземноморских морских путей." #NT!
 nd_koa.8.a: "Откройте для себя итальянское банковское дело и надежные финансы." #NT!
 nd_koa.8.b: "Пусть наш флот сделает морские пути прибыльными." #NT!
 nd_koa.9.t: "Крест над Святым городом" #NT!
 nd_koa.9.d: "Иерусалим. Одно только слово стоит больше тысячи аргументов. Город, по которому ходил Христос, где Соломон построил свой храм, где Готфрид Бульонский плакал слезами радости на его стенах, — он наш. Африканский крестовый поход, начавшийся как невероятный плацдарм на берегах Туниса, достиг того, чего не удавалось ни одной христианской державе со времен завоевания Саладина. Акко, Антиохия, Иерусалим, весь Утремер возрождается под знаменем крестоносцев Африки. Теперь возникает вопрос: что будет означать это достижение? Вечная война за расширение Царства Небесного на Земле? Или прочный мир, Pax Christiana, где меч вложен в ножны, а Крест правит посредством справедливости?" #NT!
 nd_koa.9.a: "Крестовый поход никогда не заканчивается. Деус вульт!" #NT!
 nd_koa.9.b: "Давайте построим прочный мир на Святой Земле." #NT!
 nd_koa.10.t: "Торговый центр мира" #NT!
 nd_koa.10.d: "Древняя мечта осуществилась. Гавань Александрии, которая когда-то была воротами к богатствам Востока, теперь развевается под нашим флагом. Благовония из Аравии, специи из Индии, шелк из Китая — все это проходит через наши таможни на пути к голодным рынкам Европы. Наши порты — самые загруженные в Средиземноморье, наши торговцы — самые богатые, а нашим банкам — самые надежные. Вопрос теперь в том, как использовать эту позицию. Мы могли бы объявить наши порты свободными, открытыми для всех стран, освобожденными от мелких пошлин и торговых войн, которые подрывают торговлю в других странах. Или мы могли бы использовать наше монопольное положение для финансирования колониальных предприятий за пределами Средиземноморья, достигая богатств Атлантики и Индийского океана." #NT!
 nd_koa.10.a: "Объявите наши порты открытыми для всего мира." #NT!
 nd_koa.10.b: "Финансируйте колониальные предприятия за пределами моря." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_crusade_momentum: "Импульс крестового похода" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_crusade_momentum: "Священная война набирает неудержимый темп, армии быстро пополняются, верующие с радостью несут военные расходы, а королевство устойчиво выдерживает напряжение постоянных кампаний." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_garrison_doctrine: "Гарнизонная доктрина" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_garrison_doctrine: "Каждая завоеванная территория немедленно укрепляется и размещается гарнизон, а линии снабжения протягиваются для поддержания новых позиций. Военно-морскому флоту пренебрегают в пользу этого подхода, ориентированного на сухопутные цели." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_kingdom_of_heaven: "Царство Небесное" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_kingdom_of_heaven: "Королевство крестоносцев претендует на божественный мандат вести священную войну везде, где господствуют неверные. Войны дешевле объявлять, и причины для войны легче найти, хотя постоянный милитаризм порождает определенное самоуспокоение при дворе." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_pax_christiana: "Пакс Кристиана" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_pax_christiana: "Королевство крестоносцев навязывает христианский мир по всему Леванту, опираясь на дипломатические рычаги и обширную разведывательную сеть, которая выводит потенциальных соперников из равновесия." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_lombard_banking: "Ломбардное банковское дело" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_lombard_banking: "Итальянский финансовый опыт стабилизирует экономику королевства, предлагая выгодные условия кредитования и сдерживая инфляцию, одновременно связывая подчиненные территории экономической зависимостью." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_corsair_commerce: "Корсар Коммерция" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_corsair_commerce: "Военные корабли королевства служат одновременно торговым эскортом и таможенной службой, гарантируя, что морские пути останутся прибыльными и что разрушения, вызванные пиратством, будут быстро устранены." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_free_port: "Свободный порт Африки" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_free_port: "Порты Крестоносцев Африки объявлены открытыми для всех стран, привлекая торговцев со всех уголков Средиземноморья обещаниями низких тарифов и дипломатического нейтралитета." #NT!
 STATIC_MODIFIER_NAME_nd_koa_dest_colonial_enterprise: "Колониальное предприятие" #NT!
 STATIC_MODIFIER_DESC_nd_koa_dest_colonial_enterprise: "Богатство средиземноморской торговли финансирует колониальные предприятия за пределами привычного моря, сокращая расходы на содержание отдаленных аванпостов и расширяя коммерческое присутствие королевства на новых рынках." #NT!
 nd_koa_holy_land_command: "Командование Святой Земли" #NT!
 nd_koa_holy_land_command_desc: "Высший военный штаб орденов крестоносцев на отвоеванной Святой Земле, координирующий оборону гарнизонов, набор рекрутов и укрепление завоеванных территорий по всему Утремеру." #NT!
 nd_koa_command_maintenance: "Командное содержание" #NT!
 nd_koa_command_maintenance_desc: "Поддержание укреплений, арсенала и командного состава верховного штаба крестоносцев, требующего камня для стен, вооружения и огнестрельного оружия для арсенала и кожи для снаряжения." #NT!
 nd_koa_mediterranean_exchange: "Средиземноморский обмен" #NT!
 nd_koa_mediterranean_exchange_desc: "Грандиозная коммерческая биржа, на которой торговцы со всего Средиземноморья ведут дела, обменивают валюту и заключают контракты. Его мраморные залы и счетные залы являются сердцем африканской торговли." #NT!
 nd_koa_exchange_operations: "Обменные операции" #NT!
 nd_koa_exchange_operations_desc: "Управляет крупной коммерческой биржей, требующей бумаги для контрактов и бухгалтерских книг, ткани для торговых витрин, стекла для счетных комнат и мебели для торговых залов." #NT!
