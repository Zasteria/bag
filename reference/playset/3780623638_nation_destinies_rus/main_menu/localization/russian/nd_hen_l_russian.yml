l_russian:
 STATIC_MODIFIER_NAME_nd_hen_yr_awen: "Юр Авен" #NT!
 STATIC_MODIFIER_DESC_nd_hen_yr_awen: "Божественное поэтическое вдохновение вновь струится через бардов Старого Севера. Там, где Синфейрдды когда-то воспевали героев, новое поколение сохраняет камбрийский язык и древние законы бриттского народа." #NT!
 STATIC_MODIFIER_NAME_nd_hen_cleddyf_y_gogledd: "Кледдиф и Гогледд" #NT!
 STATIC_MODIFIER_DESC_nd_hen_cleddyf_y_gogledd: "Меч Севера снова обнажен. Подобно тому, как Уриен однажды изгнал англов с берегов Линдисфарна, воины Хен Огледда маршируют, чтобы вернуть себе все холмы и долины, которые когда-то были Бриттонией." #NT!
 STATIC_MODIFIER_NAME_nd_hen_gododdin_recited: "Герои Катрата" #NT!
 STATIC_MODIFIER_DESC_nd_hen_gododdin_recited: "Стихи Y Gododdin звучат в каждом зале. Триста человек отправились в Катрат и почти все пали, но их жертва стала бессмертным стандартом, по которому измеряются все воины Старого Севера." #NT!
 STATIC_MODIFIER_NAME_nd_hen_rock_of_clyde: "Скала Клайда" #NT!
 STATIC_MODIFIER_DESC_nd_hen_rock_of_clyde: "Альт-Клут снова стал неприступным оплотом британской власти. Там, где Дамбартон-Рок возвышается над рекой, ни один захватчик не может пройти беспрепятственно." #NT!
 nd_hen.1.t: "Возрождение Старого Севера" #NT!
 nd_hen.1.d: "Разрозненные британские королевства севера (Регед, Гододдин, Стратклайд, Элмет) были воссоединены под единой короной впервые со времен Уриена и Талиесина. На языке Камбрика говорят от Ферт-оф-Форта до Хамбера, и древние генеалогии Гвир-и-Гогледда связывают это королевство воедино.\n\nНо что это за царство? Барды, хранившие память о Старом Севере на протяжении веков саксонского и норвежского господства, теперь обращаются к нам за советом. Будем ли мы хранителями возрожденной древней культуры, взращивающей поэтические и правовые традиции, которые отличают нас? Или мы станем мстителями за Катрат, владеющими мечом, чтобы создать королевство, достойное наследия Уриена?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_hen.1.a: "Пусть Авен ведет нас: мы хранители пламени" #NT!
 nd_hen.1.b: "Меч Севера не должен оставаться в ножнах" #NT!
 nd_hen.2.t: "И Гододдин" #NT!
 nd_hen.2.d: "В большом зале при свете камина поднимается бард, чтобы прочитать древнейшие и самые священные стихи бриттского народа. Y Гододдин: элегия Анейрина тремстам воинам, которые ехали из Дин Эйдина в Катрат, чтобы сражаться там с превосходящими силами англов. Почти все они были убиты, но их имена живут в бессмертных стихах.\n\nВступительные строки стихотворения известны каждому воину в королевстве: «Gwyr a aeth Gatraeth oedd ffraeth eu llu»: «Люди отправились в Катрат, воинство их было сильным». Это не просто памятник, но священная связь между прошлым и настоящим, напоминающая всем, кто его слышит, что мужество перед лицом разрушения — высшая добродетель Старого Севера.\n\nСегодня вечером воины, которые слушают, клянутся быть достойными этих древних героев." #NT!
 nd_hen.2.a: "Их жертва никогда не будет забыта" #NT!
 nd_hen.3.t: "Скала Клайда" #NT!
 nd_hen.3.d: "Скала Думбартон (на старом языке «Скала Клайда») была средоточием британской власти на севере с незапамятных времен. Его базальтовая вершина, возвышающаяся на двести сорок футов над рекой, никогда не была взята прямым штурмом. Когда скандинавские короли Амлайб и Имар осадили ее в 870 году, им потребовалось четыре месяца и прекращение подачи воды, чтобы заставить ее подчиниться.\n\nТеперь крепость была расширена и усилена новейшими оборонительными сооружениями. Вершину окружает новая навесная стена, а гарнизон увеличился вдвое. С этого неприступного насеста правители Хен-Огледда могут командовать всем течением Клайда и контролировать все движение между Шотландской низменностью и западным морем." #NT!
 nd_hen.3.a: "Alt Clut будет стоять вечно" #NT!
 nd_hen_gododdin_legacy: "И Гододдин" #NT!
 nd_hen_gododdin_legacy_desc: "Древняя поэма Анейрина, посвященная бриттским воинам, павшим в битве при Катрате, вдохновляет солдат Хен Огледда рассказами о самоотверженной доблести." #NT!
 nd_hen_teulu_warband: "Теулу" #NT!
 nd_hen_teulu_warband_desc: "Личный отряд короля, состоящий из конных вассалов, связанных клятвой и родством, образует элитное ядро ​​британских военных традиций." #NT!
 nd_hen_cattle_lords: "Повелители стад" #NT!
 nd_hen_cattle_lords_desc: "Пастушеское скотоводческое хозяйство британского севера, где богатство измеряется скотом, а власть королевского двора исходит от его стад." #NT!
 nd_hen_cynfeirdd: "Синфейрдд" #NT!
 nd_hen_cynfeirdd_desc: "Самые ранние поэты (в первую очередь Талиесин и Анейрин), воспевавшие деяния британских королей и сохранявшие культурную самобытность Старого Севера на протяжении столетий конфликтов." #NT!
 nd_hen_cumbric_law: "Закон Камбрика" #NT!
 nd_hen_cumbric_law_desc: "Юридические обычаи британского севера, сочетающие древнюю племенную практику с остатками римской администрации в своеобразную юриспруденцию.\n\n#italic Доступно в: $nd_hen_llys$#!" #NT!
 nd_hen_alt_clut_fortress: "Альтернативный Клат" #NT!
 nd_hen_alt_clut_fortress_desc: "Скала Клайд, скала Думбартон, где британские короли держали двор после ухода римских легионов. Его базальтовая вершина веками сопротивлялась осаде." #NT!
 nd_hen_brythonic_smiths: "Британское кузнечное дело" #NT!
 nd_hen_brythonic_smiths_desc: "Мастера по металлу Старого Севера производят прекрасные мечи, щиты и гривны по традиции, восходящей к бриттам железного века.\n\n#italic Доступно в: $nd_hen_dinas$#!" #NT!
 nd_hen_clyde_trade: "Клайд Трейд" #NT!
 nd_hen_clyde_trade_desc: "Река Клайд служит торговой артерией западного Старого Севера, соединяя внутренние районы ирландских и континентальных торговцев.\n\n#italic Доступно в: $nd_hen_llys$#!" #NT!
 nd_hen_cumbric_church: "Камбрикская церковь" #NT!
 nd_hen_cumbric_church_desc: "Христианство Старого Севера следует островным традициям, отличным от Рима и Кентербери, со своими собственными монашескими обычаями и календарем." #NT!
 nd_hen_frontier_spearmen: "Пограничные копейщики" #NT!
 nd_hen_frontier_spearmen_desc: "В приграничных землях Хен Огледда рождаются дисциплинированные копейщики, закаленные постоянными пограничными войнами против англов, гэлов и норвежцев." #NT!
 nd_hen_wool_trade: "Северная Шерстяная Торговля" #NT!
 nd_hen_wool_trade_desc: "На горных пастбищах Пеннин и Южных возвышенностей производят высококачественную шерсть, которую британские ткачи превращают в востребованные ткани.\n\n#italic Доступно в: $nd_hen_llys$#!" #NT!
 nd_hen_northern_alliance: "Северный Альянс" #NT!
 nd_hen_northern_alliance_desc: "Следуя примеру Уриена Регедского по созданию коалиций между британскими королями против общего врага, Старый Север овладевает искусством союзной дипломатии." #NT!
 nd_hen_border_strongholds: "Пограничные крепости" #NT!
 nd_hen_border_strongholds_desc: "Сеть укреплений на вершине холма охраняет границы Хен Огледда, каждая крепость взаимно поддерживает своих соседей и контролирует перевалы.\n\n#italic Доступно в: $nd_hen_dinas$#!" #NT!
 nd_hen_manuscript_tradition: "Рукописная традиция" #NT!
 nd_hen_manuscript_tradition_desc: "Бардские залы Старого Севера производят иллюминированные рукописи, сохраняющие для потомков поэзию, законы и историю бриттского народа.\n\n#italic Доступно в: $nd_hen_neuadd_y_beirdd$#!" #NT!
 nd_hen_border_riders: "Пограничные всадники" #NT!
 nd_hen_border_riders_desc: "Стремительные конные рейдеры, патрулирующие приграничные марши, являющиеся экспертами в тактике нападения и бегства на пересеченной местности приграничной страны." #NT!
 nd_hen_bardic_preservation: "Бардское сохранение" #NT!
 nd_hen_bardic_preservation_desc: "Бардские школы Старого Севера систематически сохраняют и преподают камбрийский язык, гарантируя, что устные традиции и правовые кодексы выдержат давление окружающих культур.\n\n#italic Доступно в: $nd_hen_neuadd_y_beirdd$#!" #NT!
 nd_hen_kingdom_reunited: "Королевство воссоединилось" #NT!
 nd_hen_kingdom_reunited_desc: "Отдельные британские королевства севера объединяются под единой короной, что положило конец многовековой фрагментации и воплотило в жизнь идею единого Старого Севера." #NT!
 nd_hen_pennine_mines: "Пеннинские шахты" #NT!
 nd_hen_pennine_mines_desc: "Месторождения свинца и угля на Пеннинских холмах разрабатывались еще со времен Римской империи. Под британским управлением организованная добыча полезных ископаемых приносит новые богатства Старому Северу." #NT!
 nd_hen_standing_army: "Милвир и Гогледд" #NT!
 nd_hen_standing_army_desc: "Старая система отрядов теулу уступает место постоянной постоянной армии (Солдатам Севера), обученной и оснащенной в соответствии с современными стандартами, сохраняя при этом боевой дух воинов Гододдина." #NT!
 nd_hen_coastal_trade: "Прибрежная торговля" #NT!
 nd_hen_coastal_trade_desc: "Порты Клайда, Солуэя и побережья Нортумбрии превращаются в процветающие центры прибрежной и перекрестной торговли с Ирландией, Скандинавией и континентом." #NT!
 nd_hen_council_of_the_north: "Совет Севера" #NT!
 nd_hen_council_of_the_north_desc: "Опираясь на британские традиции совета и согласия, формальный совет дает советы короне и формирует управление королевством." #NT!
 nd_hen_northern_industry: "Северная промышленность" #NT!
 nd_hen_northern_industry_desc: "Угольные и железные месторождения Старого Севера поддерживают растущую протоиндустриальную экономику, создавая оружие, инструменты и материальные основы современной власти." #NT!
 nd_hen_cumbric_revival: "Камбрикское возрождение" #NT!
 nd_hen_cumbric_revival_desc: "Литературный и культурный ренессанс избавляет язык Камбрика от многовековой маргинализации, создавая новую поэзию, истории и юридические тексты, вдохновленные традицией Синфейрдд." #NT!
 nd_hen_industrial_north: "Индустриальный Север" #NT!
 nd_hen_industrial_north_desc: "Северные угольные месторождения и речные долины стали центром промышленной революции, где мельницы, литейные заводы и фабрики изменили ландшафт Хен Огледда." #NT!
 nd_hen_clyde_shipyards: "Клайд Верфи" #NT!
 nd_hen_clyde_shipyards_desc: "На берегах реки Клайд, когда-то располагавшихся простыми рыбацкими деревнями, теперь расположены огромные верфи, которые отправляют суда для торговли и войны через мировой океан." #NT!
 nd_hen_democratic_tradition: "Демократическая традиция" #NT!
 nd_hen_democratic_tradition_desc: "Древняя британская практика управления по совету и согласию развивается в современную демократическую традицию, давая право голоса простым людям Старого Севера." #NT!
 a_nd_hen_teulu: "Теулу" #NT!
 a_nd_hen_teulu_desc: "Личный отряд короля, состоящий из конных вассалов, теулу — элитная ударная кавалерия Старого Севера. Связанные клятвами верности и вдохновленные героями Y Gododdin, они бросаются в бой с безрассудной доблестью." #NT!
 a_nd_hen_gosgordd: "Госгордд" #NT!
 a_nd_hen_gosgordd_desc: "Пограничные копейщики Хен Огледда, госгордды, — это закаленная пехота, обученная на пересеченной местности пограничных маршей. Они превосходно удерживают позиции против превосходящих сил на холмах и горных перевалах." #NT!
 a_nd_hen_border_rider: "Пограничный Райдер" #NT!
 a_nd_hen_border_rider_desc: "Стремительные конные налетчики, знающие каждый перевал, брод и скрытую долину приграничной страны. Они наносят быстрый удар, быстро грабят и исчезают прежде, чем враг успевает ответить." #NT!
 a_nd_hen_milwyr: "Милвир и Гогледд" #NT!
 a_nd_hen_milwyr_desc: "«Солдаты Севера» — дисциплинированные постоянные пехотные силы, заменяющие старые отряды профессиональными войсками, оснащенными современным оружием и тактикой." #NT!
 levy_nd_hen_teulu: "Отряд Теулу" #NT!
 levy_nd_hen_teulu_desc: "Присягнувшие королю конные слуги, связанные клятвой сопровождать его в бою." #NT!
 levy_nd_hen_gosgordd: "Госгордские копейщики" #NT!
 levy_nd_hen_gosgordd_desc: "Пограничная пехота, набранная из приграничных общин, закаленная конфликтами поколений." #NT!
 levy_nd_hen_border_rider: "Пограничный Райдер Леви" #NT!
 levy_nd_hen_border_rider_desc: "Легкие всадники, набранные на пограничных маршах, опытные разведчики и рейдеры." #NT!
 nd_hen_llys: "Ллис" #NT!
 nd_hen_llys_desc: "Королевский зал суда британского короля, где вершится правосудие, собирается дань скоту, а барды воспевают генеалогии правящего дома." #NT!
 nd_hen_neuadd_y_beirdd: "Нойадд и Бейрдд" #NT!
 nd_hen_neuadd_y_beirdd_desc: "Бардский зал, где поэтические традиции Талиесина и Анейрина преподаются новым поколениям, а язык Камбрика сохраняется посредством стихов и песен." #NT!
 nd_hen_dinas: "Динас" #NT!
 nd_hen_dinas_desc: "Крепость на вершине холма в британских традициях, возвышающаяся над окружающей местностью. Эти крепости, построенные на естественных обнажениях скал, практически неуязвимы для атак." #NT!
 nd_hen_court_of_justice: "Суд" #NT!
 nd_hen_court_of_justice_desc: "Ллис отправляет правосудие в соответствии с правовыми обычаями Камбрика, разрешая споры и собирая дань со всего королевства." #NT!
 nd_hen_cattle_tithe: "Десятина для скота" #NT!
 nd_hen_cattle_tithe_desc: "Пасторальное богатство Старого Севера течет через Ллис в виде скота и шкур, поддерживая двор и производя прекрасную кожу для торговли." #NT!
 nd_hen_wool_weaving: "Шерстяное Ткачество" #NT!
 nd_hen_wool_weaving_desc: "Горные стада дают сырую шерсть, которую мастерицы Старого Севера прядут и ткут в тонкую ткань." #NT!
 nd_hen_bardic_training: "Бардское обучение" #NT!
 nd_hen_bardic_training_desc: "Neuadd y Beirdd поддерживает строгие традиции бардского образования, обучая поэтов-учеников сложным размерам и генеалогиям традиции Камбрика." #NT!
 nd_hen_manuscript_copying: "Копирование рукописи" #NT!
 nd_hen_manuscript_copying_desc: "Барды создают иллюминированные рукописи, сохраняющие для потомков поэзию, законы и историю Старого Севера." #NT!
 nd_hen_garrison_upkeep: "Пограничный гарнизон" #NT!
 nd_hen_garrison_upkeep_desc: "Гарнизон Динаса наблюдает за пограничными маршами, потребляя оружие, провиант и строительные материалы." #NT!
 nd_hen_forge_work: "Бритонская кузница" #NT!
 nd_hen_forge_work_desc: "Кузнецы Динаса производят прекрасное оружие в традициях бриттской металлообработки, куя мечи, наконечники копий и щиты." #NT!
 nd_hen_formed_tt: "Сформирован #bold Хен Огледд#!" #NT!
 nd_hen_path_a_tt: "Выбери судьбу #bold года Авен#!" #NT!
 nd_hen_path_b_tt: "Выберите судьбу #bold Cleddyf y Gogledd#!" #NT!
 nd_hen_destiny: "Старый Север Объединенный" #NT!
 nd_hen_destiny_desc: "Британские королевства воссоединились под одной короной. Стабильность должна быть сохранена, прежде чем королевство сможет следовать своей великой судьбе." #NT!
 nd_hen_dest_cumbric_schools: "Школы Синфейрдда" #NT!
 nd_hen_dest_cumbric_schools_desc: "Создайте центры британского обучения, приняв меритократическое управление и обеспечив запас бумаги для писцов и ученых, которые будут продвигать традицию Камбрика." #NT!
 nd_hen_dest_brythonic_union: "Британский союз" #NT!
 nd_hen_dest_brythonic_union_desc: "Воссоединитесь с валлийскими британцами, захватив Кармартен, древнюю резиденцию Деейбарта. Благодаря печатному станку, распространяющему литературу Камбрика и золото для финансирования проекта, все британские народы могут быть собраны под одним знаменем." #NT!
 nd_hen_dest_prifysgol: "Прифисголь и Гогледд" #NT!
 nd_hen_dest_prifysgol_desc: "Основал Университет Севера, великий центр британских наук, способный соперничать с любыми европейскими учеными. Для этого необходимы процветающее государство, высокий престиж и научная революция, чтобы укорениться." #NT!
 nd_hen_dest_london: "Каэр Лудд" #NT!
 nd_hen_dest_london_desc: "Возьмите Лондон (Каэр Лудд на старом языке, город, основанный королем Лудом согласно британской легенде). Для завоевания величайшего города Англии потребуется грозная армия." #NT!
 nd_hen_dest_celtic_seas: "Хозяева кельтских морей" #NT!
 nd_hen_dest_celtic_seas_desc: "Контролируйте Ирландское море, захватив Дублин и Корнуолл, объединив кельтские народы Ирландии, Уэльса и Старого Севера под британским владычеством." #NT!
 nd_hen_dest_bretagne: "Сыновья Брута" #NT!
 nd_hen_dest_bretagne_desc: "Согласно Джеффри Монмутскому, бритты происходят от Брута Трои. Пересеките Ла-Манш и доберитесь до Нормандии, заявив о своем родстве с бретонцами и господстве над обоими берегами. Это вершина британской военной мощи." #NT!
 nd_hen.4.t: "Старый Север Объединенный" #NT!
 nd_hen.4.d: "Хен Огледд стоит твердо. Старые королевства Регед, Гододдин и Стратклайд впервые за столетия подчиняются одной короне. Царство стабильно, границы защищены, и люди ждут от своего короля руководства.\n\nВопрос, который преследовал британский север с момента падения римского порядка, наконец-то получил ответ: Старый Север выстоит. Теперь возникает более сложный вопрос: чем оно станет?" #NT!
 nd_hen.4.a: "Старый Север выстоит" #NT!
 nd_hen.5.t: "Школы Синфейрдда" #NT!
 nd_hen.5.d: "По всему королевству школы Синфейрдд претерпели изменения. То, что когда-то было неформальными собраниями бардов, передающих устные традиции, превратилось в организованные учебные заведения. Молодые ученые теперь изучают не только замысловатые метры поэзии Камбрика, но также философию, право, математику и естественные науки.\n\nБумага (некогда являвшаяся редкой роскошью) течет через рынки Старого Севера. Работы Талиесина и Анейрина копируются, изучаются и расширяются. Новые трактаты на языке Камбрика конкурируют со всем, что написано на латыни или французском языке. Интеллектуальные основы британского возрождения были заложены." #NT!
 nd_hen.5.a: "Авен освещает всех, кто ищет знания" #NT!
 nd_hen.6.t: "Британский союз" #NT!
 nd_hen.6.d: "Кармартен пал к нам или, вернее, вернулся к нам. Древний город Деейбарт, центр валлийской бриттской цивилизации, впервые с постримской эпохи объединился со Старым Севером. Ученые Севера и барды Уэльса обнаруживают, что у них есть нечто большее, чем общий языковой предок: они разделяют видение восстановленной бриттской цивилизации.\n\nТеперь печатный станок разносит камбрикские и валлийские тексты во все уголки королевства. Но как нам направить этот культурный импульс? Через большие собрания поэтов и ученых, прославляющих наше общее наследие? Или через восстановление древних британских правовых кодексов, которые когда-то управляли всем Придейном?" #NT!
 nd_hen.6.a: "Созвать Eisteddfod: фестиваль искусств." #NT!
 nd_hen.6.b: "Восстановление Сафраита: закон бриттов" #NT!
 nd_hen.7.t: "Прифисголь и Гогледд" #NT!
 nd_hen.7.d: "Университет Севера открывает свои двери. Построенный в британских научных традициях, но охватывающий новые научные методы, охватившие Европу, он является доказательством того, что язык, когда-то считавшийся речью пастухов и погонщиков скота, может служить средством высшего образования.\n\nУченые со всего кельтского мира (Уэльса, Ирландии, Корнуолла, Бретани) стекаются в Прифисгол. Вопрос теперь в том, что будет определять характер этого института. Будет ли оно смотреть вовне, создавая сети торговли и дипломатии, которые распространят британские идеи по всей Европе? Или ему следует обратить внимание на себя, взращивая поэтические и литературные традиции, которые делают мир Камбрика уникальным?" #NT!
 nd_hen.7.a: "Внешне: пусть наши учёные ходят среди народов" #NT!
 nd_hen.7.b: "Вовнутрь: пусть Авен говорят в новую эпоху" #NT!
 nd_hen.8.t: "Падение Лондона" #NT!
 nd_hen.8.d: "Каэр Лудд пал. Лондон (величайший город Англии, сердце англосаксонской власти) развевает знамя Хен Огледда. Город, который британцы-британцы уступили саксам в мрачные столетия после Рима, был возвращен их потомкам.\n\nПо словам Джеффри Монмутского, Лондон был основан королем Лудом, который назвал его Каэр Лудд. Правдива ли легенда, имеет меньшее значение, чем то, что она собой представляет: город принадлежит бриттам по праву древнего наследства. Воины Старого Севера маршируют по улицам, по которым их предки в последний раз ходили тысячу лет назад.\n\nАнглосаксонские летописцы писали, что британцы навсегда бежали на запад. Они ошибались." #NT!
 nd_hen.8.a: "Каэр Лудд снова наш" #NT!
 nd_hen.9.t: "Хозяева кельтских морей" #NT!
 nd_hen.9.d: "Дублин и Корнуолл наши. Ирландское море теперь является британским озером, и кельтские народы трех островов (Британии, Ирландии и рассеянных атлантических сообществ) смотрят на Старый Север как на своего защитника.\n\nНо природа этой гегемонии еще предстоит определить. Сможем ли мы создать конфедерацию кельтских народов, связав их союзом и общими целями, уважая при этом их самобытность? Или нам следует укрепить наши островные владения и превратить их в неприступный бастион, сделав саму Британию величайшей крепостью в мире?" #NT!
 nd_hen.9.a: "Конфедерация кельтских народов" #NT!
 nd_hen.9.b: "Островная крепость, непобедимая" #NT!
 nd_hen.10.t: "Сыновья Брута" #NT!
 nd_hen.10.d: "Руан пал. Знамя Хен Огледда развевается над континентом. Бриттский народ, отступивший из Бретани на окраины Британии, вернулся, чтобы заявить о своем древнем родстве с бретонцами и не только.\n\nГефрид Монмутский писал, что Брут Троянский основал Британию и дал ей свое имя. Будь то миф или память, это утверждение имеет вес: британцы доказали, что они — народ судьбы, способный завоевать не просто остров, но и пересечь море. Вопрос теперь в том, как распорядиться этой беспрецедентной силой." #NT!
 nd_hen.10.a: "В духе Уриена: завоевания и слава" #NT!
 nd_hen.10.b: "Кельтская империя, связанная кровью и языком" #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_eisteddfod: "Айстедвод" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_eisteddfod: "Великие фестивали поэзии, музыки и науки привлекают художников со всего британского мира, распространяя культурное влияние и залечивая шрамы вековых конфликтов." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_cyfraith: "Cyfraith и Brythoniaid" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_cyfraith: "Древние правовые кодексы британцев были восстановлены и кодифицированы, обеспечивая справедливую и толерантную основу для управления разнообразным народом." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_enlightened_north: "Просвещенный Север" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_enlightened_north: "Ученые Прифисгола и Гогледда строят сети по всей Европе, неся британские идеи в более широкий мир и восстанавливая торговые и дипломатические связи." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_age_of_verse: "Эпоха стихов" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_age_of_verse: "Золотой век поэзии и песни Камбрика. Бардская традиция достигает высот, невиданных со времен Талиесина, а культурный престиж британского мира привлекает новообращенных и поклонников." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_celtic_alliance: "Кельтский Альянс" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_celtic_alliance: "Конфедерация кельтских народов под руководством британцев, объединенная общим языком и целями. Подчиненные страны — это лояльные партнеры, а не завоеванные провинции." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_island_fortress: "Островная крепость" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_island_fortress: "Британия превратилась в неприступный бастион. Земля обеспечивает собственную защиту, хотя менталитет крепости ограничивает внешнюю торговлю." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_urien_reborn: "Уриен Возрожденный" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_urien_reborn: "Дух Уриена Регедского снова живет в короле-завоевателе. Армии Старого Севера дисциплинированы и многочисленны, хотя бесконечные кампании истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_hen_dest_celtic_empire: "Кельтская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_hen_dest_celtic_empire: "Панкельтское царство, простирающееся от Шотландии до Бретани, связанное кровью и языком. Право диктовать условия мира достигается за счет постоянной готовности к войне." #NT!
 nd_hen_prifysgol: "Прифисголь и Гогледд" #NT!
 nd_hen_prifysgol_desc: "Университет Севера, великий центр британского образования, где бардская традиция встречается с новой наукой. Ученые со всего кельтского мира изучают поэзию, право, натурфилософию и математику на языке Камбрика." #NT!
 nd_hen_caer_ludd: "Каэр Лудд" #NT!
 nd_hen_caer_ludd_desc: "Легендарная британская крепость Лондона, перестроенная в военную цитадель завоевательного кельтского народа. Его массивные стены и гарнизон контролируют Темзу и окружающую местность." #NT!
 nd_hen_university_upkeep: "Техническое обслуживание университета" #NT!
 nd_hen_university_upkeep_desc: "Ученым, писцам и лекторам Прифисгола требуется постоянный запас книг, бумаги, пчелиного воска для освещения свечей и ткани для своих облачений." #NT!
 nd_hen_caer_ludd_garrison: "Цитадель Гарнизон" #NT!
 nd_hen_caer_ludd_garrison_desc: "Гарнизону Каэр Лудда требуется оружие, камень для ремонта, железо для укреплений и провиант для поддержания своей готовности." #NT!
  
  # ===== BUREAUCRACIES ===== 
 cyfraith_hywel_bureaucracy: "Сайфрейт Хивел" #NT!
 cyfraith_hywel_bureaucracy_desc: "Кодекс законов Уэльса, приписываемый Хивелу Дда в середине десятого века, сохранился в редакциях Йорверта, Сифнерта и Блегиврида. Он кодифицирует галаны (цену родственной крови), сархад (штраф за оскорбление) и мах (присягу), применяемые через общие суды Учелвира. Духовенство сохранило рукописи; законы отдавали предпочтение дифференцированным штрафам, а не вражде, что возмущало великих родственников." #NT!
 llys_a_maerdref_bureaucracy: "Ллис в Мердрефе" #NT!
 llys_a_maerdref_bureaucracy_desc: "Королевский двор (ллис) и связанная с ним деревня-владение (маэрдреф), где крепостные тэогионы обрабатывали королевское плато, а маер собирал утреннюю еду. Король совершил свой обход через маэрдрефи, поедая рендеры лично. Странствующее королевство поддерживало отряды в движении, но привязывало рабов к земле на многие поколения." #NT!
 penteulu_bureaucracy: "Пентеулу" #NT!
 penteulu_bureaucracy_desc: "Капитан королевского конного отряда (теулу), второй придворный чиновник после эдлинга. Теулу из ста двадцати связанных присягой вассалов, набранных из знатных семей, служили ударным отрядом и телохранителями короля. Ю Гододдин вспоминает такой отряд, триста человек, которые отправились на юг, чтобы умереть в Катрате." #NT!
 bardd_teulu_bureaucracy: "Бард Теулу и Фенсердд" #NT!
 bardd_teulu_bureaucracy_desc: "Орден бардов, формально разделенный Законами Хивела на пенсердд (мастер-бард, оплачиваемый по итогам конкурса), бард теулу (поэт военного отряда, поемый перед битвой) и меньший серддорион. Барды сохраняли родословные королей, воспевали династии и могли узаконить или свергнуть правителя своими стихами. Их язык был камбрийским, и через них бриттский язык носил вес за пределами границ." #NT!
 cwmwd_courts_bureaucracy: "Cwmwd судебная система" #NT!
 cwmwd_courts_bureaucracy_desc: "Каждый cwmwd представлял собой автономную юридически-территориальную единицу, состоящую из половины или трети кантрефа, со своим собственным судом учельвира под председательством раглава (юрисконсульта) и рингиллом (судебным приставом). К тринадцатому веку общий суд затмил кантрефский суд как основное место рассмотрения дел по валлийскому праву. Местное правосудие, местная власть и тысяча местных лордов." #NT!
 clas_communities_bureaucracy: "Классовые сообщества" #NT!
 clas_communities_bureaucracy_desc: "Материнские церкви бриттской христианской традиции, управляемые потомственными священнослужителями, где аббатство переходило от отца к сыну или от дяди к племяннику. Гован, Глазго и класо Камбрии служили религиозно-административными центрами на обширных территориях. Их наследственный характер сохранил британскую образованность, но сопротивлялся римской реформе; духовенство и знатные родственники свободно вступали в брак." #NT!
 galanas_cenedl_bureaucracy: "Родственная ответственность Галанаса" #NT!
 galanas_cenedl_bureaucracy_desc: "При Сафрайте Хивеле единицей юридической ответственности был сенедл (родственники по отцовской линии в четырех поколениях). Цена крови Галаны за убийство была выплачена и получена коллективно, с таблицей, отсортированной по статусу. Преступления разрешались между Сенедлау, а не между подданным и королем. Сородичи защищали своих; трон, не имея монополии на правосудие, научился управлять через них, а не над ними." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_hen_bureaucracy_authority: "Британская придворная традиция" #NT!
 AUTO_MODIFIER_DESC_nd_hen_bureaucracy_authority: "Хен Огледд унаследовал институциональный словарь Cyfraith Hywel и британских дворов: cwmwd, llys, teulu, clas. При формировании королевство получает основу для размещения исторической бюрократии Старого Севера." #NT!
