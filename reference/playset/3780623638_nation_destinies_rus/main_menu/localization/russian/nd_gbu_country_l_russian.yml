l_russian:
 GBU: "Большая Бургундия" #NT!
 GBU_ADJ: "бургундский" #NT!
 GBU_f: "Большая Бургундия" #NT!
 GBU_f_desc: "Возродилось Бургундское Среднее королевство. Выкованная из коридора богатства, который Филипп Добрый и Карл Смелый объединили в единое государство, Большая Бургундия объединяет фламандские города, валлонские марши, Лотарингию, Свободное графство и герцогский центр в суверенное королевство, не подчиняющееся ни Парижу, ни Империи. Корона, которую Карл искал в Трире, наконец возложена на бургундские брови, а орден Золотого руна — на его рыцарскую основу." #NT!
