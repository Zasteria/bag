l_russian:
 STATIC_MODIFIER_NAME_nd_tus_palazzo_dei_medici: "Палаццо Медичи" #NT!
 STATIC_MODIFIER_DESC_nd_tus_palazzo_dei_medici: "Медичи строили свою власть не с помощью оружия, а с помощью бухгалтерской книги и долота. От контор на Виа де Барди до мастерских Брунеллески, Флоренция доказала, что богатство, направленное на красоту, может изменить мир." #NT!
 STATIC_MODIFIER_NAME_nd_tus_porto_franco_spirit: "Дух Порто Франко" #NT!
 STATIC_MODIFIER_DESC_nd_tus_porto_franco_spirit: "Ворота Ливорно открыты для всех наций и всех вероисповеданий. Евреи-сефарды, армянские купцы, английские торговцы и греческие судовладельцы смешиваются на площадях этого космополитичного порта, превращая Тоскану в перекресток средиземноморской торговли." #NT!
 STATIC_MODIFIER_NAME_nd_tus_santo_stefano_crusaders: "Крестоносное рвение Санто-Стефано" #NT!
 STATIC_MODIFIER_DESC_nd_tus_santo_stefano_crusaders: "Рыцари Санто-Стефано несут крест в бой против берберийских корсаров, их галеры очищают морские пути от пиратов-неверных." #NT!
 STATIC_MODIFIER_NAME_nd_tus_mediterranean_patrol: "Средиземноморский патруль" #NT!
 STATIC_MODIFIER_DESC_nd_tus_mediterranean_patrol: "Вместо того, чтобы вести священную войну, рыцари Санто-Стефано служат стражами тосканской торговли, их патрули обеспечивают безопасный проход торговых судов через кишащие пиратами воды." #NT!
 nd_tus.1.t: "Великое Герцогство Тоскана" #NT!
 nd_tus.1.d: "От башен Сан-Джиминьяно до мраморных фасадов Флоренции — земли Тосканы объединены под одним знаменем. Но остается вопрос: какое это должно быть государство? Наследие Медичи предлагает один путь: государство-покровитель, где банковское богатство питает художественный гений, а политический контроль осуществляется через культурное превосходство. Дворцы Флоренции, ее академии и банки станут инструментами власти.\n\nОднако процветающий порт Ливорно предполагает другую судьбу. Хартия свободного порта, приветствующая торговцев всех вероисповеданий и наций, создала космополитический торговый центр, непохожий ни на один другой в Италии. Открытые двери и религиозная терпимость могут сделать Тоскану торговым центром Средиземноморья.\n\nВеликий герцог должен выбрать душу нового государства.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tus.1.a: "Флоренция – величайший покровитель мира. Пусть правят наши банки и художники." #NT!
 nd_tus.1.b: "Ливорно показывает будущее. Откройте наши порты для всех, кто будет торговать." #NT!
 nd_tus.2.t: "Рыцари Санто-Стефано" #NT!
 nd_tus.2.d: "В 1561 году великий герцог Козимо I основал Орден Святого Стефана, военно-религиозный орден со штаб-квартирой в великолепном Пизанском Палаццо деи Кавальери. Рыцари под командованием самого великого герцога управляют специальным галерным флотом из Портоферрайо на Эльбе и растущего порта Ливорно. Их галеры уже наносили удары по берберийским пиратам при осаде Мальты и в битве при Лепанто.\n\nЦель ордена ясна: бороться с османскими и берберийскими угрозами в Средиземноморье. Но великий князь должен определить акценты приказа. Должны ли рыцари вести агрессивную крестоносную войну, совершая набеги на побережье Северной Африки во имя христианского мира? Или им следует сосредоточиться на дисциплинированном патрулировании и сопровождении, защищая тосканское торговое судоходство от нападений корсаров?" #NT!
 nd_tus.2.a: "Крест требует оскорбления. Пусть рыцари совершат набег на побережье Берберии!" #NT!
 nd_tus.2.b: "Нашим торговцам нужна безопасная вода. Патрулируйте торговые пути." #NT!
 nd_tus.3.t: "Кодекс Леопольдина" #NT!
 nd_tus.3.d: "30 ноября 1786 года великий герцог Пётр Леопольд провозгласил то, что мир узнает как Кодекс Леопольдина: революционную реформу уголовного права, вдохновленную работами Чезаре Беккариа о преступлениях и наказаниях. Тоскана стала первым суверенным государством в современном мире, отменившим смертную казнь и применение пыток.\n\nКодекс не ограничивается отменой. Он реорганизует всю систему уголовного правосудия: стандартизирует процедуры, требует публичных судебных процессов, устанавливает пропорциональные приговоры и прекращает практику конфискации имущества преступников. Новый кодекс отражает убежденность Просвещения в том, что наказание должно реформировать, а не разрушать.\n\nПо всей Европе философы и реформаторы прославляют Тоскану как маяк просвещенного управления." #NT!
 nd_tus.3.a: "Справедливость, умеренная разумом, станет нашим наследием." #NT!
 nd_tus.4.t: "Медичи и эпоха Возрождения" #NT!
 nd_tus.4.d: "Под патронажем Козимо Медичи и его внука Лоренцо Великолепного Флоренция стала бесспорной культурной столицей Европы. Купол Брунеллески венчает собор, картины Боттичелли украшают церкви, а Марсилио Фичино переводит Платона в садах виллы Кареджи.\n\nЭто не просто любовь к красоте. Медичи понимают, что покровительство искусству — это политическая власть, ставшая видимой. Каждая фреска, каждая скульптура, каждая заказанная рукопись провозглашают превосходство Флоренции как для приезжих послов, так и для конкурирующих дворов. Платоническая академия, мастерские Верроккьо, библиотеки Сан-Марко: это инструменты, с помощью которых Тоскана меняет мировоззрение." #NT!
 nd_tus.4.a: "Красота – это сила, а Флоренция – ее трон." #NT!
 nd_tus_commune_tradition: "Коммуна Традиция" #NT!
 nd_tus_commune_tradition_desc: "Тосканские города-государства управлялись посредством выборных советов и общинных хартий задолго до появления князей, установив традицию гражданского участия и республиканского управления." #NT!
 nd_tus_arte_della_seta: "Арте делла Сета" #NT!
 nd_tus_arte_della_seta_desc: "Гильдия шелка Флоренции, унаследовавшая ремесленные традиции Лукки после ее разграбления в 1314 году, превратила Тоскану в ведущего европейского производителя роскошного шелка." #NT!
 nd_tus_tower_defense: "Тосканские дома-башни" #NT!
 nd_tus_tower_defense_desc: "Каменные дома-башни Сан-Джиминьяно, Вольтерры и Флоренции служили одновременно аристократическими резиденциями и укрепленными опорными пунктами во время фракционных войн средневековой Тосканы." #NT!
 nd_tus_pisan_maritime: "Пизанское морское наследие" #NT!
 nd_tus_pisan_maritime_desc: "До того, как ее затмили Венеция и Генуя, Пиза была одной из ведущих морских республик Италии, ее галеры доминировали в западном Средиземноморье, а ее купцы торговали от Барселоны до Туниса." #NT!
 nd_tus_medici_banking: "Медичи Банковское дело" #NT!
 nd_tus_medici_banking_desc: "Банк Медичи, основанный в 1397 году Джованни ди Биччи де Медичи, стал пионером в двойной бухгалтерии, вексельном письме и холдинговой компании — нововведениях, которые сделали Флоренцию финансовой столицей Европы." #NT!
 nd_tus_renaissance_patronage: "Покровительство эпохи Возрождения" #NT!
 nd_tus_renaissance_patronage_desc: "Медичи превратили политическое богатство в культурное превосходство, поручив Брунеллески, Донателло, Боттичелли и Микеланджело создать произведения, определившие эпоху Возрождения." #NT!
 nd_tus_condottiere_tradition: "Кондотьерская традиция" #NT!
 nd_tus_condottiere_tradition_desc: "От Белой роты Джона Хоквуда до пехоты с черными полосами Джованни далле Банде Нере, Тоскана находилась в центре итальянских традиций наемнической войны." #NT!
 nd_tus_florentine_diplomacy: "Флорентийская дипломатия" #NT!
 nd_tus_florentine_diplomacy_desc: "Дипломатия Лоренцо Медичи по обеспечению баланса сил поддерживала мир между итальянскими государствами на протяжении десятилетий, что принесло ему титул «Великолепного» и сделало Флоренцию дипломатическим арбитром Италии." #NT!
 nd_tus_santo_stefano_order: "Рыцари Санто-Стефано" #NT!
 nd_tus_santo_stefano_order_desc: "Основанный Козимо I в 1561 году, этот крестоносный военно-морской орден действовал из Пизы и Портоферрайо, его галеры сражались с османскими и берберийскими угрозами по всему Средиземноморью." #NT!
 nd_tus_livorno_free_port: "Свободный порт Ливорно" #NT!
 nd_tus_livorno_free_port_desc: "Фердинандо I объявил Ливорно свободным портом в 1590-х годах, принимая преследуемых евреев-сефардов, армянских купцов и торговцев всех вероисповеданий, создав самый космополитичный город в Италии." #NT!
 nd_tus_trace_italienne: "След Италии" #NT!
 nd_tus_trace_italienne_desc: "Тосканские военные архитекторы первыми создали звездный форт: Фортецца да Бассо во Флоренции и бастионы Портоферрайо на Эльбе представляют собой передовой край ренессансных укреплений." #NT!
 nd_tus_tuscan_printing: "Тосканская печать" #NT!
 nd_tus_tuscan_printing_desc: "Флорентийские печатники распространяли гуманистическую и народную литературу по всей Европе, сделав тосканский итальянский язык престижным языком науки и литературы." #NT!
 nd_tus_grand_ducal_state: "Великогерцогское государство" #NT!
 nd_tus_grand_ducal_state_desc: "Консолидация власти Козимо I (поглощение Сиены, централизация управления, создание герцогских судов) превратила лоскутное одеяло тосканских коммун в современное территориальное государство." #NT!
 nd_tus_elba_naval_base: "Военно-морская база Эльба" #NT!
 nd_tus_elba_naval_base_desc: "Козимо I купил Эльбу у Генуи в 1548 году и превратил Портоферрайо в укрепленную военно-морскую базу, распространяющую тосканскую мощь через Тирренское море." #NT!
 nd_tus_carrara_marble: "Каррарский мрамор" #NT!
 nd_tus_carrara_marble_desc: "Белый мрамор Каррары, добываемый еще со времен Римской империи, послужил источником Давида Микеланджело, шедевров Бернини и бесчисленных зданий эпохи Возрождения, что сделало Тоскану мастерской европейской архитектуры." #NT!
 nd_tus_crusca_academy: "Академия делла Круска" #NT!
 nd_tus_crusca_academy_desc: "Основанная в 1583 году, Академия делла Круска создала первый словарь народного языка, сделав тосканский язык стандартной формой итальянского языка и моделью для лингвистических академий по всей Европе." #NT!
 nd_tus_leopoldine_code: "Леопольдинский кодекс" #NT!
 nd_tus_leopoldine_code_desc: "Уголовный кодекс великого герцога Петра Леопольда 1786 года первым в современном мире отменил смертную казнь и пытки, что сделало Тоскану маяком юриспруденции эпохи Просвещения." #NT!
 nd_tus_maremma_drainage: "Дренаж Мареммы" #NT!
 nd_tus_maremma_drainage_desc: "Систематическое осушение малярийных болот Мареммы, начатое при Медичи и расширенное Домом Лотарингии, превратило обширные участки болот в продуктивные сельскохозяйственные угодья." #NT!
 nd_tus_tuscan_viticulture: "Тосканское Виноградарство" #NT!
 nd_tus_tuscan_viticulture_desc: "Тосканские винодельческие поместья, Fattorie, усовершенствовали производство Кьянти, Верначча и Вино Нобиле, благодаря чему тосканские вина прославились во всех дворах Европы." #NT!
 nd_tus_risorgimento_spirit: "Тосканское Рисорджименто" #NT!
 nd_tus_risorgimento_spirit_desc: "Традиции просвещенных реформ и конституционных экспериментов Великого Герцогства сделали Тоскану благодатной почвой для идей итальянского национального пробуждения." #NT!
 nd_tus_straw_hat_industry: "Индустрия соломенных шляп" #NT!
 nd_tus_straw_hat_industry_desc: "Флорентийские соломенные шляпы стали основной экспортной отраслью в 18 и 19 веках: тосканские крестьянки плели косы из пшеничной соломы в модные головные уборы, продаваемые по всей Европе." #NT!
 nd_tus_scientific_legacy: "Тосканское научное наследие" #NT!
 nd_tus_scientific_legacy_desc: "От телескопических наблюдений Галилея до барометра Торричелли и экспериментального метода Академии дель Чименто Тоскана стояла в авангарде научной революции." #NT!
 a_nd_tus_bande_nere: "Банде Нере" #NT!
 a_nd_tus_bande_nere_desc: "Элитная ударная пехота произошла от знаменитых рот Джованни далле Банде Нере, известных своей агрессией и скоростью боя." #NT!
 n_nd_tus_santo_stefano_galley: "Галера Санто-Стефано" #NT!
 n_nd_tus_santo_stefano_galley_desc: "Быстрые, хорошо вооруженные галеры рыцарей Санто-Стефано, предназначенные для набегов на берберийских корсаров и патрулирования Тирренского моря." #NT!
 nd_tus_silk_workshop: "Шелковая мастерская" #NT!
 nd_tus_silk_workshop_desc: "Setificio во флорентийских традициях: плетение из сырого шелка и красителей лучшей ткани в Европе." #NT!
 nd_tus_silk_weaving: "Тосканское шелковое ткачество" #NT!
 nd_tus_silk_weaving_desc: "Искусство ткачества шелка, унаследованное от лукканских мастеров и усовершенствованное флорентийской гильдией Arte della Seta." #NT!
 nd_tus_casa_torre: "Каса Торре" #NT!
 nd_tus_casa_torre_desc: "Укрепленный каменный дом-башня в тосканском стиле, служащий одновременно дворянской резиденцией и оборонительным опорным пунктом." #NT!
 nd_tus_tower_upkeep: "Тауэрский гарнизон" #NT!
 nd_tus_tower_upkeep_desc: "Защиту башни поддерживает небольшой гарнизон, вооруженный мечами, арбалетами и огнестрельным оружием." #NT!
 nd_tus_banco_medici: "Банко Медичи" #NT!
 nd_tus_banco_medici_desc: "Филиал великого флорентийского банкирского дома, предлагающий депозиты, переводные письма и займы как купцам, так и принцам." #NT!
 nd_tus_banking_operations: "Банковские операции" #NT!
 nd_tus_banking_operations_desc: "Клерки ведут бухгалтерские книги, обрабатывают векселя и принимают клиентов в красивой одежде, управляя потоком капитала через сеть банка." #NT!
 nd_tus_porto_franco: "Порто Франко" #NT!
 nd_tus_porto_franco_desc: "Свободный порт в традициях Ливорнии, где купцы всех наций и вероисповеданий торгуют без таможенных барьеров." #NT!
 nd_tus_free_port_operations: "Свободные портовые операции" #NT!
 nd_tus_free_port_operations_desc: "Склады и счетные палаты обслуживают разнообразные купеческие сообщества, снабжая тканью, бумажными документами и солью для сохранности грузов." #NT!
 nd_tus_fortezza: "Фортецца" #NT!
 nd_tus_fortezza_desc: "Современный итальянский форт-звезда в тосканском стиле с наклонными бастионами, предназначенными для отражения пушечных ядер." #NT!
 nd_tus_fortezza_upkeep: "Крепостной гарнизон" #NT!
 nd_tus_fortezza_upkeep_desc: "Бастионы укомплектованы профессиональным гарнизоном, имеющим артиллерию, холодное оружие и мушкеты для защиты итальянской трассы." #NT!
 nd_tus_naval_arsenal: "Тосканский военно-морской арсенал" #NT!
 nd_tus_naval_arsenal_desc: "Укрепленная верфь в традициях Портоферрайо, где строится и обслуживается великокняжеский флот." #NT!
 nd_tus_arsenal_upkeep: "Арсенал Операции" #NT!
 nd_tus_arsenal_upkeep_desc: "Корабелы поддерживают арсенал в рабочем состоянии, используя древесину, военно-морские запасы и железные инструменты, строя и ремонтируя галеры тосканского флота." #NT!
 nd_tus_marble_quarry: "Каррарский карьер" #NT!
 nd_tus_marble_quarry_desc: "Место добычи легендарного белого каррарского мрамора, ценимого скульпторами и архитекторами с древности." #NT!
 nd_tus_marble_extraction: "Добыча мрамора" #NT!
 nd_tus_marble_extraction_desc: "Бригады карьеристов добывают блоки мрамора в Апуанских Альпах, разрезают их и придают им форму для транспортировки в мастерские и на строительные площадки." #NT!
 nd_tus_fattoria: "Фаттория" #NT!
 nd_tus_fattoria_desc: "Тосканское сельскохозяйственное поместье, занимающееся виноградарством, производящее знаменитые вина Кьянти и окружающих холмов." #NT!
 nd_tus_wine_production: "Производство вина" #NT!
 nd_tus_wine_production_desc: "Виноград собирают, прессуют и ферментируют в соответствии с многовековой тосканской винодельческой традицией." #NT!
 nd_tus_cappelleria: "Каппеллерия" #NT!
 nd_tus_cappelleria_desc: "Мастерская по производству знаменитых флорентийских соломенных шляп, сотканных из местной пшеничной соломы и окрашенных в модные цвета." #NT!
 nd_tus_hat_making: "Изготовление Шляп" #NT!
 nd_tus_hat_making_desc: "Ремесленники плетут соломку, придают шляпам форму и наносят отделочные красители для производства легких шляп, пользующихся популярностью на европейских рынках." #NT!
 levy_nd_tus_bande_nere: "Банде Нере Леви" #NT!
 levy_nd_tus_bande_nere_desc: "Набрана пехота в традициях рот с черными полосами Джованни далле Банде Нере." #NT!
 nd_tus_osservatorio: "Оссерваторио" #NT!
 nd_tus_osservatorio_desc: "Астрономическая обсерватория и научная академия в традициях Галилея, оснащенная телескопами и инструментами для естественной философии." #NT!
 nd_tus_observatory_upkeep: "Операции обсерватории" #NT!
 nd_tus_observatory_upkeep_desc: "Линзы, бумага и чернила поддерживают программу обсерватории по наблюдению за небесами и научным публикациям." #NT!
 nd_tus_formed_tt: "Тоскана была образована" #NT!
 nd_tus_path_a_tt: "Выбрал Палаццо Медичи." #NT!
 nd_tus_path_b_tt: "Выбрать дух Порто Франко" #NT!
 nd_tus_destiny: "Тосканская судьба" #NT!
 nd_tus_destiny_desc: "Великое Герцогство создано, но каким оно станет? Стабильность и цель должны руководить новым государством, прежде чем оно сможет реализовать свои амбиции." #NT!
 nd_tus_dest_dominio_1: "Завоевание Сиены" #NT!
 nd_tus_dest_dominio_1_desc: "Поглощение Козимо I Республики Сиены в 1559 году ознаменовало истинное объединение Тосканы. Расширьте власть Медичи над Перуджей и Урбино, чтобы обеспечить господство в центральной Италии." #NT!
 nd_tus_dest_dominio_2: "Ключи Святого Петра" #NT!
 nd_tus_dest_dominio_2_desc: "Два Медичи восседали на троне Святого Петра. Теперь подчините Рим самому Тоскане, выполнив главную амбицию династии — управлять как светской, так и духовной властью в Италии." #NT!
 nd_tus_dest_dominio_3: "Рекс Италия" #NT!
 nd_tus_dest_dominio_3_desc: "От Неаполитанского залива до гавани Генуи, от башен Болоньи до холмов Флоренции — объедините итальянский полуостров под тосканской короной и претендуйте на древний титул короля Италии." #NT!
 nd_tus_dest_commercio_1: "Ливорнское чудо" #NT!
 nd_tus_dest_commercio_1_desc: "Свободный портовый устав Фердинандо I превратил рыбацкую деревню в самый космополитичный город Италии. Используйте современное банковское дело и обеспечьте потоки шелка через рынки Тосканы, чтобы повторить это чудо по всему королевству." #NT!
 nd_tus_dest_commercio_2: "Торговый центр Наций" #NT!
 nd_tus_dest_commercio_2_desc: "Склады Ливорно ломятся от тканей из Фландрии, специй из Леванта и кораллов с Сардинии. Развивайте инфраструктуру Тосканы и обеспечьте, чтобы ткань доходила до каждого рынка, чтобы превратить Великое герцогство в торговый перекресток." #NT!
 nd_tus_dest_commercio_3: "Перевалочный пункт Средиземноморья" #NT!
 nd_tus_dest_commercio_3_desc: "Контролируйте морские пути от Корсики до итальянского побережья, освойте институты мировой торговли и наполните казну до отказа. Тоскана станет торговым центром всего Средиземноморья." #NT!
 nd_tus.5.t: "Новая глава Тосканы" #NT!
 nd_tus.5.d: "Разрозненные коммуны и владения Тосканы объединились в единое государство. Знамя великого герцога развевается над каждой колокольней, и сокровища Флоренции, Пизы и Сиены наконец объединены. Но объединение — это всего лишь фундамент; именно то, что мы на нем построим, определит наше наследие. Великое княжество стоит на перепутье истории, и предстоящий выбор определит судьбу нашего народа на столетия вперед." #NT!
 nd_tus.5.a: "Наша судьба ждет." #NT!
 nd_tus.6.t: "Центральная Италия обеспечена" #NT!
 nd_tus.6.d: "Знамена великого герцогства теперь реют над Перуджей и Урбино. Там, где когда-то Папская область и мелкие лорды господствовали над зелеными холмами Умбрии и Марке, теперь безраздельно господствует власть Тосканы. Дорога в Рим открыта, и древняя мечта об объединении Италии под единой короной с каждым годом приближается к реальности." #NT!
 nd_tus.6.a: "Сердце Италии бьется во Флоренции." #NT!
 nd_tus.7.t: "Рим переходит к великому герцогу" #NT!
 nd_tus.7.d: "Вечный город, резиденция пап и цезарей, теперь подчиняется великому герцогу Тосканы. Два папы Медичи когда-то правили христианским миром из этих залов; теперь династия претендует на Рим по праву оружия, а не по конклаву. Но правление Римом требует выбора. Должен ли великий герцог установить власть в Тоскане посредством военной оккупации и прямого контроля, сокрушая остатки папской независимости? Или он будет править тонко, используя древний престиж города, чтобы узаконить власть Тосканы посредством дипломатической ловкости?" #NT!
 nd_tus.7.a: "Рим должен знать тосканский железный кулак." #NT!
 nd_tus.7.b: "Бархатная перчатка скрывает истинную руку власти." #NT!
 nd_tus.8.t: "Король Италии" #NT!
 nd_tus.8.d: "От дымящихся склонов Везувия до гаваней Лигурийского побережья, от богатых равнин Эмилии до родных мраморных карьеров, Италия объединена под тосканской короной. Ни одно итальянское государство не добилось этого со времен Римской республики. Теперь великий князь должен решить характер этого нового итальянского королевства. Будет ли она выкована из железа, как военная держава, вызывающая уважение силой своих армий? Или он должен охватывать разнообразные народы полуострова, управляя посредством интеграции и общего процветания в истинном Pax Italica?" #NT!
 nd_tus.8.a: "Италия будет объединена мечом и сохранена им." #NT!
 nd_tus.8.b: "Прочный мир требует согласия, а не просто завоевания." #NT!
 nd_tus.9.t: "Чудо Ливорно" #NT!
 nd_tus.9.d: "Рынки Тосканы гудят от шелеста шелка и звона флоринов. Банкиры Флоренции освоили современные финансовые инструменты, а ткацкие станки Лукки и Прато прядут золото из ниток. Купцы со всего Средиземноморья стекаются в порты Тосканы, привлеченные обещаниями честных сделок и открытой торговли. То, что Фердинандо I начал с Leggi Livornine, переросло в коммерческую революцию." #NT!
 nd_tus.9.a: "Наше богатство – это наша сила." #NT!
 nd_tus.10.t: "Перекресток торговли" #NT!
 nd_tus.10.d: "Великое княжество стало настоящим торговым центром наций. Тосканские ткани продаются из Лондона в Константинополь, а склады Ливорно переполнены товарами со всех уголков известного мира. Теперь великий князь должен решить характер этой торговой империи. Должна ли Тоскана инвестировать в склады, мастерские и физическую инфраструктуру, чтобы справиться с потоком торговли? Или ему следует разработать сложные финансовые инструменты (банковское дело, страхование и кредит) для управления растущей сложностью торговли в Средиземноморье?" #NT!
 nd_tus.10.a: "Стройте склады. Пусть товары текут через Тоскану." #NT!
 nd_tus.10.b: "Уточните счетную палату. Пусть золото работает на нас." #NT!
 nd_tus.11.t: "Сердце Средиземноморья" #NT!
 nd_tus.11.d: "От набережных Ливорно до контор Флоренции, от Корсиканских проливов до мраморных гаваней родины, Тоскана управляет торговыми артериями Средиземноморья. Корабли всех стран стремятся в тосканские порты, а таможенники великого герцога собирают пошлины с половины торговли между Востоком и Западом. Великое герцогство должно теперь определить свою коммерческую философию. Будет ли оно отстаивать свободную торговлю, открывая все рынки и уменьшая барьеры для создания максимально возможного объема торговли? Или ему следует придерживаться космополитического видения, инвестируя в разнообразные сообщества, которые делают тосканские порты уникальными, и превращая культурную открытость в конкурентное преимущество?" #NT!
 nd_tus.11.a: "Свободная торговля обогащает всех. Опустите все барьеры." #NT!
 nd_tus.11.b: "Наше разнообразие – наша сила. Воспитывайте каждое сообщество." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_iron_fist: "Железный кулак Медичи" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_iron_fist: "Тосканская власть устанавливается силой оружия. Солдаты великого герцога разместили гарнизоны в каждом городе, и сопротивление правлению Медичи встречает быстрое возмездие." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_velvet_glove: "Бархатная перчатка" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_velvet_glove: "Великий князь правит посредством разведки и интриг. Флорентийские шпионы следят за каждым двором в Италии, а тосканские дипломаты добиваются выгодных договоров благодаря обаянию и хитрости." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_imperial_crown: "Императорская Корона Италии" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_imperial_crown: "Тосканская армия – инструмент итальянского единства. Закаленные десятилетиями кампаний на полуострове, его ветераны составляют основу военной мощи, которая может соперничать с великими королевствами Европы." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_pax_italica: "Пакс Италика" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_pax_italica: "Великий герцог управляет объединенной Италией не посредством страха, а посредством общего процветания. Подчиненные народы находят уважение к своим обычаям, а их общины интегрированы в структуру тосканского государства." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_warehouse: "Склад Наций" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_warehouse: "Тосканские порты переполнены физическими товарами половины мира. Склады, мастерские и мануфактуры перерабатывают сырье со всех уголков Средиземноморья в готовую продукцию для европейских рынков." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_counting_house: "Флорентийская счетная палата" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_counting_house: "Банкиры Флоренции усовершенствовали искусство заставить деньги работать. Векселя, морское страхование и сложные кредитные инструменты обеспечивают бесперебойную торговлю Тосканы." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_free_trade: "Чемпионы свободной торговли" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_free_trade: "Тоскана открыла свои порты для всех народов. Приверженность великого герцога неограниченной торговле привлекает торговцев со всех уголков мира, а тосканские корабли свободно курсируют по каждому морскому пути." #NT!
 STATIC_MODIFIER_NAME_nd_tus_dest_cosmopolitan: "Космополитическое видение" #NT!
 STATIC_MODIFIER_DESC_nd_tus_dest_cosmopolitan: "Великое герцогство процветает благодаря талантам своего разнообразного населения. Сефардские финансисты, армянские купцы, греческие моряки и английские факторы – все они вносят свой вклад в яркую картину коммерческой жизни Тосканы." #NT!
 nd_tus_palazzo_ducale: "Палаццо Дукале" #NT!
 nd_tus_palazzo_ducale_desc: "Дворец великого герцога, резиденция Медичи, где в мраморных залах, украшенных лучшими произведениями искусства эпохи Возрождения, решается судьба Италии." #NT!
 nd_tus_ducal_court: "Герцогский суд" #NT!
 nd_tus_ducal_court_desc: "Писцы, придворные и министры посещают великого князя в покоях, обставленных лучшими шелками и резной мебелью, обеспечивая управление королевством." #NT!
 nd_tus_fondaco: "Фондако" #NT!
 nd_tus_fondaco_desc: "Международный торговый склад и биржа в венецианских традициях, где купцы всех наций хранят товары, заключают контракты и ведут расчеты." #NT!
 nd_tus_fondaco_operations: "Фондако Операции" #NT!
 nd_tus_fondaco_operations_desc: "Складщики управляют запасами ткани и соли, клерки записывают операции на бумаге, а слесари-инструментальщики обслуживают механическое оборудование биржи." #NT!
  
  # ===== BUREAUCRACIES ===== 
 tus_signoria_bureaucracy: "Синьория делле Арти" #NT!
 tus_signoria_bureaucracy_desc: "Исполнительные приоры Флорентийской коммуны, избираемые по жребию из главных и второстепенных гильдий на двухмесячный срок. Ordinamenti di Giustizia 1293 года Джано делла Белла формализовал Синьорию девяти человек и запретил кланам магнатов занимать свои должности. При режимах Альбицци и Медичи это учреждение просуществовало до тех пор, пока Алессандро Медичи не стал потомственным герцогом в 1532 году, определив флорентийскую республиканскую идентичность на два с половиной столетия." #NT!
 tus_otto_di_guardia_bureaucracy: "Отто ди Гуардиа и Балия" #NT!
 tus_otto_di_guardia_bureaucracy_desc: "Постоянная магистратура общественной безопасности Флоренции, основанная 2 сентября 1378 года после восстания Чомпи и ставшая постоянной 21 января 1380 года. Восемь граждан, набранных из гильдий, преследовали по суду политические преступления, кражи и беспорядки во Флоренции и ее contado из Палаццо дель Подеста. После 1537 года Козимо I превратил его в центральный уголовный суд Великого Герцогства и главный инструмент контроля Медичи над Тосканой." #NT!
 tus_pupilli_bureaucracy: "Магистрат деи Пупилли" #NT!
 tus_pupilli_bureaucracy_desc: "Должностные лица по делам подопечных и взрослых, созданные 30 июля 1393 года для того, чтобы взять на себя функции должностных лиц Монте по защите сирот, чьи отцы умерли, не оставив завещания, вдов и взрослых с умственными или физическими недостатками. Магистратура управляла имениями, оформляла завещания и рассматривала гражданские и уголовные дела, в которых участвовали ее подопечные. Начиная с Республики через Принципато и заканчивая реформами Лотарингии, это было отчетливо гражданское флорентийское учреждение." #NT!
 tus_monte_comune_bureaucracy: "Монте-Комуне" #NT!
 tus_monte_comune_bureaucracy_desc: "Флорентийский консолидированный государственный долг был основан в 1343 году путем слияния престанцев (принудительных займов) в единый фонд, выплачивающий пять процентов в переводных луоги. Это был первый настоящий государственный долг в христианской Европе и финансовый двигатель республиканских войн. Монте-делле-Доти, добавленный в 1425 году, позволял отцам отдавать приданое для будущих дочерей под сложные проценты, подлежащие выкупу при вступлении в брак. Вместе Монти связали состояние флорентийских семей с платежеспособностью коммуны." #NT!
 tus_banco_mediceo_bureaucracy: "Банко Медичео" #NT!
 tus_banco_mediceo_bureaucracy_desc: "Банк Медичи, основанный Джованни ди Биччи 1 октября 1397 года и доведенный до своего апогея Козимо иль Веккьо между 1429 и 1464 годами. На пике своего развития он имел филиалы в Риме, Венеции, Женеве, Лионе, Брюгге, Лондоне, Авиньоне, Пизе и Милане, служил главным банкиром папства и гарантировал шерстяную и шелковую промышленность. Ее крах из-за плохого управления Лоренцо в 1494 году ослабил династию, но созданная ею тосканская финансовая сеть продолжала служить образцом для банковского аппарата Великого Герцога." #NT!
 tus_mercanzia_bureaucracy: "Трибунале Мерканции" #NT!
 tus_mercanzia_bureaucracy_desc: "Торговый трибунал Флоренции, созданный в 1308 году для разрешения споров между членами пяти крупнейших гильдий, а также между флорентийцами и иностранными купцами. Его судьи, набранные из Арти, применяли купеческие обычаи (lex mercatoria) к гражданскому праву в вопросах страхования, товарищества, банкротства и векселей. Universita Мерканции придал флорентийской торговле юридическую предсказуемость, которая сделала возможным существование Banco Mediceo и тосканской торговли текстилем во всем латинско-христианском мире." #NT!
 tus_studio_pisano_bureaucracy: "Студия в Пизе" #NT!
 tus_studio_pisano_bureaucracy_desc: "Тосканский университет. Булла Бонифация VIII от 3 сентября 1343 года учредила Studium Generale в Пизе, и Лоренцо Медичи воссоздал ее 1 ноября 1473 года, переведя большинство факультетов из Студии Фиорентино, намеренно объединив тосканское высшее образование в одном месте. Галилей занимал кафедру математики с 1589 по 1592 год, а Козимо II назначил его придворным философом в 1610 году; Юридический и медицинский факультеты Студии сформировали поколение итальянских юристов и врачей." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_tus_bureaucracy_authority: "Тосканская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_tus_bureaucracy_authority: "При формировании [TUS.GetName] получает право сохранять свои исторические институты: магистратуры, монти и советы, унаследованные от флорентийской коммуны и средневековых коммун Тосканы." #NT!
