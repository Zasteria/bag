l_russian:
 STATIC_MODIFIER_NAME_nd_great_law_of_peace: "Великий Закон Мира" #NT!
 STATIC_MODIFIER_DESC_nd_great_law_of_peace: "Кайэнере'ко:ва связывает Пять Народов под Древом Великого Мира, его корни простираются во всех направлениях. Споры разрешаются советом, а не войной между нами. Сила Длинного дома — в единстве." #NT!
 STATIC_MODIFIER_NAME_nd_war_road_of_the_longhouse: "Дорога войны в Длинном доме" #NT!
 STATIC_MODIFIER_DESC_nd_war_road_of_the_longhouse: "Хауденосауни расширяют свое влияние по военным дорогам, их воины перемещаются далеко, чтобы доставить пленников, меха и дань обратно в Длинный дом. Военные партии выполняют то, что решает совет." #NT!
 nd_iro.1.t: "Конфедерация Юнайтед" #NT!
 nd_iro.1.d: "Пять огней Хауденосауни горят как один. От восточной двери Каниенкехаки до западной двери Онондоваги народы собрались под Древом Великого Мира в Онондаге, где Великий Миротворец Деганавида посадил его несколько поколений назад. Пятьдесят сахемов Великого Совета сидят на своих местах, белые корни мира распространяются во всех направлениях.\n\nНо конфедерация должна выбрать свой путь. Сможем ли мы расширить корни мира посредством дипломатии и советов, связывая другие страны с нашим законом? Или мы пойдем дорогами войны, и наши воины несут имя Длинного Дома на край света?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_iro.1.a: "Пусть корни мира распространятся на все народы." #NT!
 nd_iro.1.b: "Дороги войны пронесут наше имя далеко." #NT!
 nd_iro.2.t: "Бобровые войны" #NT!
 nd_iro.2.d: "Торговля мехом изменила мир Великих озер. Европейские торговцы жаждут бобровых шкурок, а хауденосауни стоят на перекрестке между голландцами в форте Ориндж и обширными охотничьими угодьями внутренних районов. Но наши соперники (Вендаты, Нейтралы, Эри) контролируют западные бобровые территории.\n\nС 1640-х годов наши воины носят мушкеты рядом со своими боевыми дубинками, нанося глубокие удары по вражеской территории с разрушительным эффектом. Конфедерация Вендат разбита, выжившие рассеяны. Перед нами открыты Великие озера. Но с доминированием приходит выбор: захватим ли мы контроль над торговыми путями силой или станем незаменимыми посредниками, натравливая европейцев друг против друга, в то время как мы богатеем на транзите мехов?" #NT!
 nd_iro.2.a: "Мы будем доминировать в торговле мехом силой." #NT!
 nd_iro.2.b: "Мы будем посредниками между всеми странами." #NT!
 nd_iro.3.t: "Цепь Ковенанта" #NT!
 nd_iro.3.d: "Между Хауденосауни и английской короной была выкована серебряная цепь: три звена, символизирующие мир, дружбу и уважение. Эта Цепь Завета — не просто договор, а живые отношения, оттачиваемые и обновляемые на регулярных советах, где выслушиваются обиды и обмениваются подарками. Через Цепь хауденосауни говорят от имени многих наций, передавая заботы западных народов англичанам и получая взамен европейские торговые товары.\n\nЦепь дает нам рычаги воздействия, которыми не обладает ни одна другая коренная нация. Но кредитное плечо — это инструмент, который действует в обе стороны. Свяжем ли мы себя более тесно с английским союзом, приобретая их оружие и торговлю, или мы сохраним нашу независимость, натравливая англичан против французов, как мы всегда делали?" #NT!
 nd_iro.3.a: "Отполируйте серебряную цепочку. Наш союз делает нас сильными." #NT!
 nd_iro.3.b: "Мы не отвечаем ни одному европейскому королю. Наша независимость – наша сила." #NT!
 nd_iro.4.t: "Шестая нация" #NT!
 nd_iro.4.d: "Тускарора прибыли с юга, беженцы от разрушительной войны с английскими колонистами Каролины. Они говорят на языке, похожем на наш, и их страдания требуют нашего ответа. Матери клана обсудили, и Великий Совет согласился: Тускарора должна быть принята в Конфедерацию под защитой Онейды, сидящей рядом с младшими братьями Длинного дома.\n\nИз пяти огней нас становится шесть. Длинный дом становится длиннее, его сила обновляется теми, кто ищет убежища под его стропилами. В этом гений Конфедерации: не завоевание, а усыновление. Не разрушение, а инкорпорация. Дерево пустило новые корни." #NT!
 nd_iro.4.a: "Длинный дом становится все длиннее." #NT!
 nd_iro.5.t: "Религия Длинного дома" #NT!
 nd_iro.5.d: "Красавчик Лейк, сахем Сенека, тяжело заболевший, получил видения от Создателя. В своем Кодексе он проповедует против зла, которое проникло в жизнь хауденосауни после контактов с европейцами: алкоголя, колдовства, домашнего насилия. Но он также призывает вернуться к древним церемониям, Дню благодарения, сезонным праздникам, которые поддерживали жителей Длинного дома с незапамятных времен.\n\nРелигия Длинного дома, как называют ее последователи, не является ни чисто традиционной, ни чисто новой. Он адаптирует древние обычаи к реалиям изменившегося мира, предлагая хауденосауни путь к культурному выживанию, когда старые обычаи подвергаются осаде со всех сторон. Из пепла отчаяния возродился духовный огонь." #NT!
 nd_iro.5.a: "Слово Создателя будет вести нас вперед." #NT!
 STATIC_MODIFIER_NAME_nd_iro_beaver_wars_dominance: "Доминирование в торговле мехом" #NT!
 STATIC_MODIFIER_DESC_nd_iro_beaver_wars_dominance: "Воины хауденосауни разрушили соперничающие конфедерации и захватили контроль над торговлей мехом в районе Великих озер, направляя бобровые шкуры через свою территорию на европейские рынки." #NT!
 STATIC_MODIFIER_NAME_nd_iro_beaver_wars_diplomacy: "Брокеры по торговле мехом" #NT!
 STATIC_MODIFIER_DESC_nd_iro_beaver_wars_diplomacy: "Вместо того, чтобы монополизировать торговлю силой, хауденосауни позиционировали себя как незаменимые посредники между европейскими торговцами и народами внутренних районов." #NT!
 STATIC_MODIFIER_NAME_nd_iro_covenant_chain_alliance: "Цепочка Серебряного Завета" #NT!
 STATIC_MODIFIER_DESC_nd_iro_covenant_chain_alliance: "Налаженная цепочка союзов с английской короной дает Хауденосауни привилегированный доступ к торговым товарам, дипломатическому признанию и военному сотрудничеству." #NT!
 STATIC_MODIFIER_NAME_nd_iro_covenant_chain_independence: "Суверен между империями" #NT!
 STATIC_MODIFIER_DESC_nd_iro_covenant_chain_independence: "Хауденосауни сохраняют свою независимость, отказываясь от постоянной верности какой-либо европейской державе, используя угрозу смены альянса, чтобы добиться уступок как со стороны Франции, так и Англии." #NT!
 nd_iro_great_law: "Великий Закон Мира" #NT!
 nd_iro_great_law_desc: "Кайанереко:ва, устная конституция Конфедерации Хауденосауни, устанавливает управление на основе консенсуса среди пятидесяти сахемов Великого Совета." #NT!
 nd_iro_longhouse_governance: "Управление Лонгхаусом" #NT!
 nd_iro_longhouse_governance_desc: "Длинный дом служит как общественным жилищем, так и политической единицей, где матери клана выбирают сахемов, а несколько семей делят ресурсы под одной крышей." #NT!
 nd_iro_mourning_wars: "Траурная военная традиция" #NT!
 nd_iro_mourning_wars_desc: "Когда смерть ослабляет клан, военные отряды совершают набеги на соседние народы, чтобы захватить замену, которую усыновят в семью, восстанавливая духовное равновесие." #NT!
 nd_iro_three_sisters_agriculture: "Три сестры сельское хозяйство" #NT!
 nd_iro_three_sisters_agriculture_desc: "Кукуруза, фасоль и тыква («Три сестры») сажаются вместе в холмиках, причем каждое растение поддерживает другие: кукуруза дает стебли, по которым бобы могут взбираться, фасоль фиксирует азот для кукурузы, а тыква затеняет почву." #NT!
 nd_iro_canoe_warfare: "Каноэ Война" #NT!
 nd_iro_canoe_warfare_desc: "Военные отряды хауденосауни путешествуют на каноэ из коры, днем ​​топят свои суда под скалами, а ночью гребут, чтобы нанести удар далеко от дома, прежде чем отступить." #NT!
 nd_iro_palisade_defense: "Частоколовое укрепление" #NT!
 nd_iro_palisade_defense_desc: "Деревни хауденосауни окружены тремя рядами заостренных кольев, переплетенных с корой, с платформами, на которых закреплены камни и кувшины с водой для отражения нападавших." #NT!
 nd_iro_wampum_diplomacy: "Вампумская дипломатия" #NT!
 nd_iro_wampum_diplomacy_desc: "Нити и пояса из бус из ракушек служат дипломатическими полномочиями, записями договоров и мнемоническими устройствами, кодирующими соглашения в узорах фиолетового и белого цвета." #NT!
 nd_iro_forest_tactics: "Тактика лесного воина" #NT!
 nd_iro_forest_tactics_desc: "Воины тренировались в лесном бою, устраивая засады среди деревьев, используя свои глубокие знания местности, чтобы перехитрить более крупные силы." #NT!
 nd_iro_clan_mothers: "Власть Матери Клана" #NT!
 nd_iro_clan_mothers_desc: "Матери клана обладают правом назначать и свергать сахемов, утверждать объявления войны и распределять урожай: истинная политическая власть Длинного дома." #NT!
 nd_iro_condolence_ceremony: "Церемония соболезнования" #NT!
 nd_iro_condolence_ceremony_desc: "Когда умирает сахем, Церемония Соболезнования очищает умы скорбящих, вытирает их слезы и назначает нового вождя, чтобы занять пустующее место в Большом Совете." #NT!
 nd_iro_council_fire_tradition: "Огонь Совета" #NT!
 nd_iro_council_fire_tradition_desc: "Центральный огонь Онондаги никогда не гаснет. Здесь пятьдесят сахемов собираются, чтобы обсудить вопросы, затрагивающие все страны, и их решения являются обязательными для всей Конфедерации." #NT!
 nd_iro_fur_trade_network: "Торговая сеть меха" #NT!
 nd_iro_fur_trade_network_desc: "Охотники и торговцы хауденосауни действуют через обширную сеть, простирающуюся от Атлантического побережья до Великих озер, обменивая бобровые шкурки на европейские промышленные товары." #NT!
 nd_iro_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_iro_firearms_adoption_desc: "Благодаря торговле с голландцами в форте Ориндж воины Хауденосауни получают мушкеты и учатся использовать их в традиционной тактике засад и набегов." #NT!
 nd_iro_war_chief_system: "Система военачальников" #NT!
 nd_iro_war_chief_system_desc: "Вызывающие соболезнования военачальники, воспитанные церемониями и проверенные в боях, возглавляют дисциплинированные дружины опытных воинов в кампаниях далеко за пределами границ Конфедерации." #NT!
 nd_iro_beaver_wars: "Бобровые войны" #NT!
 nd_iro_beaver_wars_desc: "Хауденосауни ведут десятилетнюю кампанию по контролю над торговлей мехом в Великих озерах, разрушая соперничающие конфедерации и устанавливая господство на огромной территории." #NT!
 nd_iro_two_row_wampum: "Двухрядный вампум" #NT!
 nd_iro_two_row_wampum_desc: "Гусвента, два параллельных ряда фиолетовых бусинок на белом поле, представляет собой два судна, движущихся бок о бок, не мешая друг другу. Это основа суверенитета Хауденосауни." #NT!
 nd_iro_advanced_fortifications: "Передовые укрепления" #NT!
 nd_iro_advanced_fortifications_desc: "Инженеры Хауденосауни включили европейские оборонительные концепции в традиционные конструкции частокола, создав грозную деревенскую оборону с многочисленными стенами и бастионами." #NT!
 nd_iro_adoption_system: "Система принятия" #NT!
 nd_iro_adoption_system_desc: "Военнопленных предлагают скорбящим семьям в качестве замены погибшим. Усыновленные становятся полноправными членами клана, их прежняя идентичность растворяется, когда они берут новое имя и роль." #NT!
 nd_iro_lacrosse_tradition: "Лакросс Традиция" #NT!
 nd_iro_lacrosse_tradition_desc: "Игра Создателя (лакросс) служит одновременно церемониальным состязанием и тренировкой воинов: в матчах между деревнями иногда участвуют сотни игроков в жестоких спортивных соревнованиях." #NT!
 nd_iro_covenant_chain: "Цепь Ковенанта" #NT!
 nd_iro_covenant_chain_desc: "Серия союзных соглашений между Хауденосауни и английской короной, символизируемая серебряной цепью из трех звеньев: Мир, Дружба и Уважение." #NT!
 nd_iro_musket_mastery: "Мастерство мушкета" #NT!
 nd_iro_musket_mastery_desc: "Воины хауденосауни полностью адаптировали европейское огнестрельное оружие к своему стилю ведения войны, сочетая убойную силу мушкета с традиционной мобильностью и навыками ведения боя в лесу." #NT!
 nd_iro_tuscarora_adoption: "Усыновление Тускароры" #NT!
 nd_iro_tuscarora_adoption_desc: "Тускарора, родственный народ, говорящий на ирокезском языке, изгнанный со своей родины в Каролине в результате колониальной войны, принят в Конфедерацию как шестая нация." #NT!
 nd_iro_wampum_trade_expansion: "Расширение торговли вампумом" #NT!
 nd_iro_wampum_trade_expansion_desc: "Производство вампума выходит за рамки церемониального и дипломатического использования и становится средством обмена в растущей торговле между местными и европейскими общинами." #NT!
 nd_iro_gantowisas: "Гантовисас" #NT!
 nd_iro_gantowisas_desc: "Гантовиса, женские советы, обладают решающей властью в вопросах войны и мира, распределения продовольствия и выбора лидеров по всей Конфедерации." #NT!
 nd_iro_balance_of_power: "Баланс сил" #NT!
 nd_iro_balance_of_power_desc: "Хауденосауни используют соперничество между французскими и английскими колониями, меняя лояльность и натравливая одну державу против другой, чтобы получить максимальное преимущество." #NT!
 nd_iro_land_management: "Контролируемое горение" #NT!
 nd_iro_land_management_desc: "Намеренное сжигание подлеска создает открытые парковые леса, которые улучшают охоту, облегчают путешествия и обогащают почву для следующего посевного сезона." #NT!
 nd_iro_grand_council_reforms: "Реформы Большого совета" #NT!
 nd_iro_grand_council_reforms_desc: "Большой совет адаптирует свои процедуры для решения проблем меняющегося мира, оптимизируя процесс принятия решений, сохраняя при этом принцип консенсуса." #NT!
 nd_iro_neutrality_policy: "Политика нейтралитета" #NT!
 nd_iro_neutrality_policy_desc: "Признавая опасность выбора стороны в европейских конфликтах, Большой совет принимает политику вооруженного нейтралитета, отказываясь связывать Конфедерацию с каким-либо постоянным союзом." #NT!
 nd_iro_military_adaptation: "Военная адаптация" #NT!
 nd_iro_military_adaptation_desc: "Воины хауденосауни сочетают европейскую военную дисциплину с традиционной тактикой, создавая универсальные силы, способные как к партизанской войне, так и к стандартным сражениям." #NT!
 nd_iro_portage_control: "Управление переносом" #NT!
 nd_iro_portage_control_desc: "Контроль над транспортными путями между Великими озерами и речными системами дает Хауденосауни мертвую хватку на потоке товаров между внутренними районами и побережьем." #NT!
 nd_iro_orenda: "Оренда" #NT!
 nd_iro_orenda_desc: "Оренда, духовная сила, которая течет через все живые существа, поддерживает церемонии и традиции, которые связывают Хауденосауни вместе на протяжении поколений." #NT!
 nd_iro_brant_diplomacy: "Дипломатия Бранта" #NT!
 nd_iro_brant_diplomacy_desc: "Джозеф Брант, военный вождь могавков Тайенданегеа, едет в Лондон, чтобы вести переговоры напрямую с Короной, демонстрируя, что Хауденосауни - суверенная нация, способная к дипломатии на мировой арене." #NT!
 nd_iro_constitutional_influence: "Конституциональное влияние" #NT!
 nd_iro_constitutional_influence_desc: "Принципы Великого Закона (федерализм, разделение властей, сдержки и противовесы) влияют на мыслителей эпохи Просвещения и создателей новых республиканских конституций." #NT!
 nd_iro_buffalo_creek_council: "Совет Баффало-Крик" #NT!
 nd_iro_buffalo_creek_council_desc: "Совет в Баффало-Крик служит новым дипломатическим центром Хауденосауни, где страны ведут переговоры с молодой американской республикой о сохранении своих земель и суверенитета." #NT!
 nd_iro_handsome_lake: "Религия Длинного дома" #NT!
 nd_iro_handsome_lake_desc: "Гайвио на Красивом озере сочетает в себе древние церемонии Хауденосауни с новыми моральными учениями, предлагая путь культурного обновления во времена кризиса и лишений собственности." #NT!
 nd_iro_agricultural_modernization: "Модернизация сельского хозяйства" #NT!
 nd_iro_agricultural_modernization_desc: "Фермеры хауденосауни адаптируют традиционные методы поликультуры к требованиям рыночной экономики, продавая излишки кукурузы, фасоли и тыквы соседним поселениям." #NT!
 nd_iro_cultural_preservation: "Культурное сохранение" #NT!
 nd_iro_cultural_preservation_desc: "Благодаря самоотверженным усилиям хранителей традиций церемонии, языки и истории Хауденосауни сохраняются, гарантируя, что Длинный дом будет стойко противостоять ветрам перемен." #NT!
 nd_iro_grand_river: "Поселение Гранд-Ривер" #NT!
 nd_iro_grand_river_desc: "Поселение Шести Наций вдоль Гранд-Ривер становится центром жизни хауденосауни, где народы восстанавливают свои общины и сохраняют свои конфедеративные традиции." #NT!
 a_nd_iro_war_party: "Военная партия" #NT!
 a_nd_iro_war_party_desc: "Небольшие группы воинов, которые путешествуют ночью, наносят удары из засады и отступают до того, как противник сможет организовать сопротивление. Их скорость и свирепость делают их разрушительными рейдерами." #NT!
 a_nd_iro_forest_warriors: "Лесные воины" #NT!
 a_nd_iro_forest_warriors_desc: "Опытные бойцы, обученные ведению боя в лесу, одинаково хорошо владеющие боевой дубинкой и мушкетом. Они сражаются из-за деревьев и в оврагах, используя лес как щит и оружие." #NT!
 a_nd_iro_war_chief_retinue: "Свита вождя" #NT!
 a_nd_iro_war_chief_retinue_desc: "Личные последователи военачальника, которому соболезнуют, ветераны многих кампаний, доказавшие свою храбрость и преданность. Они составляют дисциплинированное ядро ​​любой армии Хауденосауни." #NT!
 a_nd_iro_musket_warriors: "Мушкетные воины" #NT!
 a_nd_iro_musket_warriors_desc: "Воины, полностью освоившие европейское огнестрельное оружие, сохранившие при этом традиционную мобильность и боевое мастерство. Они сочетают в себе разрушительную огневую мощь и способность исчезать в лесу." #NT!
 a_nd_iro_canoe_raiders: "Каноэ Рейдеры" #NT!
 a_nd_iro_canoe_raiders_desc: "Речные рейдовые группы, которые путешествуют на огромные расстояния на каноэ, перевозя припасы и оружие по водным путям, чтобы поразить цели вдали от дома." #NT!
 nd_iro_longhouse: "Длинный дом" #NT!
 nd_iro_longhouse_desc: "Знаменитое общественное жилище Хауденосауни: деревянное строение, покрытое корой, под одной крышей вмещающее целый клан, с общими очагами, кладовыми и спальными платформами." #NT!
 nd_iro_palisade: "Частоколовое укрепление" #NT!
 nd_iro_palisade_desc: "Тройной ряд заостренных кольев, переплетенных корой, окружал деревню грозной стеной. Платформы наверху содержат груды камней и кувшины с водой для защитников." #NT!
 nd_iro_council_fire: "Совет Огня" #NT!
 nd_iro_council_fire_desc: "Церемониальное и политическое сердце Конфедерации, где сахемы собираются вокруг священного огня, который никогда не должен гаснуть, и обсуждают вопросы, затрагивающие все народы." #NT!
 nd_iro_wampum_workshop: "Мастерская вампума" #NT!
 nd_iro_wampum_workshop_desc: "Мастерская, где мастера сверлят, придают форму и нанизывают бусины из ракушек на веревки и пояса вампума, которые служат дипломатическими полномочиями, историческими записями и единицами обмена." #NT!
 nd_iro_three_sisters_garden: "Сад Трех Сестер" #NT!
 nd_iro_three_sisters_garden_desc: "Поликультурный сад, где кукуруза, фасоль и кабачки растут вместе в холмиках: каждое растение поддерживает другие в системе, которая производит больше продуктов питания на акр, чем европейская монокультура." #NT!
 nd_iro_longhouse_maintenance: "Содержание длинного дома" #NT!
 nd_iro_longhouse_maintenance_desc: "Уход за длинным домом требует регулярной замены обшивки из коры вяза, конструкционных пиломатериалов, инструментов для ремонта, а также волокна для найтовов и веревок." #NT!
 nd_iro_palisade_upkeep: "Содержание частокола" #NT!
 nd_iro_palisade_upkeep_desc: "Стены с тройным частоколом требуют постоянного ремонта и укрепления свежей древесиной, камнем и инструментами для заточки и повторной установки кольев." #NT!
 nd_iro_council_fire_ceremony: "Церемонии Совета" #NT!
 nd_iro_council_fire_ceremony_desc: "Ритуалы и церемонии Великого Совета требуют пчелиного воска для факелов, бумаги для записи решений и мехов в качестве подарков и дани на официальных советах." #NT!
 nd_iro_wampum_crafting: "Создание вампума" #NT!
 nd_iro_wampum_crafting_desc: "Ремесленники обрабатывают бусины из ракушек и камней, которые составляют основу дипломатии и ведения учета Хауденосауни, используя костяные и каменные инструменты для сверления бус и волоконный шнур для их нанизывания." #NT!
 nd_iro_polyculture_upkeep: "Поликультурное обслуживание" #NT!
 nd_iro_polyculture_upkeep_desc: "Семена кукурузы необходимо зарезервировать каждый урожай для посадки садов «Трех сестер» в следующем сезоне, а пиломатериалы используются для строительства насыпей и инструментов для выращивания." #NT!
 nd_iro_fur_processing: "Обработка меха" #NT!
 nd_iro_fur_processing_desc: "Обработка шкур бобра и оленя традиционными методами дубления и подготовки для европейской пушной торговли." #NT!
 nd_iro_improved_palisade: "Улучшенная конструкция частокола" #NT!
 nd_iro_improved_palisade_desc: "Усовершенствованные оборонительные стены, основанные на европейских инженерных принципах, с традиционным трехстоечным частоколом, для строительства которых требуются деревянные, каменные и железные инструменты." #NT!
 nd_iro_warrior_training: "Спортивная подготовка воина" #NT!
 nd_iro_warrior_training_desc: "Игра Создателя и другие спортивные соревнования служат тщательной физической подготовкой воинов, где наготове хранятся деревянные клюшки для лакросса и тренировочное оружие." #NT!
 nd_iro_wampum_trade: "Вампум Трейд" #NT!
 nd_iro_wampum_trade_desc: "Крупномасштабное производство бус вампума для использования в качестве валюты в растущей торговле между местными и европейскими общинами, причем окрашенный вампум имеет более высокую стоимость, а бумажные записи отслеживают транзакции." #NT!
 nd_iro_controlled_burns: "Управление лесами" #NT!
 nd_iro_controlled_burns_desc: "Контролируемое сжигание подлеска создает открытые парковые зоны, которые улучшают охотничьи угодья и обогащают сельскохозяйственную почву, требуя дров и инструментов для безопасного управления пожарами." #NT!
 nd_iro_portage_trade: "Перевозка Маршрут Торговля" #NT!
 nd_iro_portage_trade_desc: "Контроль и управление сухопутными маршрутами между судоходными водными путями, с использованием мехов в качестве основной торговой валюты и инструментов для перевозки каноэ и товаров." #NT!
 nd_iro_european_diplomacy: "Европейская дипломатическая миссия" #NT!
 nd_iro_european_diplomacy_desc: "Послы хауденосауни взаимодействуют с европейскими судами и колониальными правительствами как представители суверенной конфедерации, вручая верительные грамоты в изысканных тканях и украшениях вампума, сохраняя при этом письменную переписку." #NT!
 nd_iro_treaty_negotiation: "Договорный совет" #NT!
 nd_iro_treaty_negotiation_desc: "Официальные дипломатические процедуры в соответствии с протоколом Хауденосауни, с обменом вампумами, ритуалами соболезнования, зажженными пчелиным воском, тщательно записанными соглашениями на бумаге и мехами, переданными в качестве подарков для скрепления соглашения." #NT!
 nd_iro_modern_agriculture: "Рыночное сельское хозяйство" #NT!
 nd_iro_modern_agriculture_desc: "Традиционная поликультура адаптирована для производства излишков: кукуруза продается в соседние поселения, железные орудия повышают урожайность, а излишки глиняной посуды хранятся на рынке." #NT!
 levy_nd_iro_war_party: "Сбор военной партии Хауденосауни" #NT!
 levy_nd_iro_war_party_desc: "Воины клана, призванные в набег по траурной военной традиции, путешествуют налегке и быстро наносят удары, прежде чем раствориться обратно в лес." #NT!
 levy_nd_iro_canoe_raiders: "Каноэ Рейдер Леви" #NT!
 levy_nd_iro_canoe_raiders_desc: "Речные вспомогательные силы, которые преодолевают огромные расстояния на каноэ с корой, перевозя припасы и оружие по водным путям для поддержки рейдовых групп." #NT!
 nd_iro_formed_tt: "Хауденосауни был основан" #NT!
 nd_iro_path_a_tt: "Выберите Великий Закон Мира" #NT!
 nd_iro_path_b_tt: "Выбрали Военную дорогу Длинного дома" #NT!
 nd_iro_destiny: "Судьба Конфедерации" #NT!
 nd_iro_destiny_desc: "Конфедерация Хауденосауни была создана заново. Дерево Великого Мира возвышается в Онондаге, и пятьдесят сахемов Великого Совета ждут, в каком направлении пойдет их народ." #NT!
 nd_iro_dest_condolence: "Дипломатия соболезнования" #NT!
 nd_iro_dest_condolence_desc: "Распространите церемонию соболезнования за пределы Конфедерации. Примите принципы меритократического управления и накопите богатство для финансирования дипломатических миссий на северо-востоке." #NT!
 nd_iro_dest_silver_chain: "Серебряная цепь" #NT!
 nd_iro_dest_silver_chain_desc: "Создайте дипломатическую сеть, простирающуюся от Катараки на озере Онтарио до Шакамаксона на Делавэре. Контролируйте торговый перекресток, который делает Хауденосауни незаменимым для всех держав региона." #NT!
 nd_iro_dest_great_binding: "Великий обязательный закон" #NT!
 nd_iro_dest_great_binding_desc: "Кайанереко:ва становится образцом управления на всем континенте. Достигните такого престижа, что даже далекие народы стремятся изучить Великий Закон. Постройте Древо Великого Мира как вечный памятник управлению Конфедерации." #NT!
 nd_iro_dest_mourning_raids: "Траурные рейды" #NT!
 nd_iro_dest_mourning_raids_desc: "Перенесите траурную войну в центр Вендатов, в Каиагу. Создайте армию, достойную военных дорог, и заполните пустующие места Длинного дома пленниками с севера." #NT!
 nd_iro_dest_beaver_conquest: "Завоевание Бобровых войн" #NT!
 nd_iro_dest_beaver_conquest_desc: "Разрушьте оставшихся соперников. Возьмите Детройт и страну Сандаски, чтобы контролировать западные бобровые угодья и южный берег Великих озер." #NT!
 nd_iro_dest_longhouse_empire: "Империя Длинного дома" #NT!
 nd_iro_dest_longhouse_empire_desc: "Расширьте военные дороги до Чекагу и Макинака, самых дальних проливов Великих озер. Постройте Военную Ложу как резиденцию военной державы, которая доминирует внутри континента." #NT!
 nd_iro.6.t: "Путь Конфедерации" #NT!
 nd_iro.6.d: "Хауденосауни стоят на перепутье. Пятьдесят сахемов собрались у Огня Совета, народы объединились под одной крышей. Белые корни мира простираются во всех направлениях, но направление роста Конфедерации зависит от решений, принятых на этом совете. Запомнят ли жителей Длинного дома как мастеров дипломатии или как завоевателей, чьи военные дороги дошли до краев мира?" #NT!
 nd_iro.6.a: "Огонь Совета горит ярко." #NT!
 nd_iro.7.t: "Соболезнования достигают большего" #NT!
 nd_iro.7.d: "То, что началось как церемония оплакивания погибших и воскрешения новых вождей, стало основой дипломатической традиции, не похожей ни на одну другую. Когда Хауденосауни отправляют делегации соболезнований далеким народам, они несут не просто слова утешения, но и целую систему управления: идею о том, что горе может трансформироваться в политическое обновление, что траур может создать союзы, более сильные, чем любой военный договор. Нации, которые когда-то боялись Длинного дома, теперь отправляют свои делегации в Онондагу, стремясь научиться искусству совета и консенсуса." #NT!
 nd_iro.7.a: "Мы очищаем разум всех скорбящих." #NT!
 nd_iro.8.t: "Полировка цепи" #NT!
 nd_iro.8.d: "Дипломатическая сеть превратилась в нечто беспрецедентное: сеть союзов, торговых соглашений и взаимных обязательств, простирающаяся по всему северо-востоку. Серебряная цепь, соединяющая хауденосауни с европейскими державами и другими местными конфедерациями, должна постоянно полироваться и обновляться посредством советов, обмена подарками и осторожных переговоров.\n\nНо есть два способа поддерживать такую ​​цепь. Мы можем более тесно связать себя с нашими партнерами, став незаменимым центром великой системы альянсов. Или мы можем сохранить нашу независимость, используя цепь не для того, чтобы связывать, а для баланса, натравливая каждого партнера против других, в то время как Хауденосауни богатеют на напряженных отношениях между ними." #NT!
 nd_iro.8.a: "Завяжите цепочку покрепче. Альянс – это сила." #NT!
 nd_iro.8.b: "Мы стоим суверенно между всеми народами." #NT!
 nd_iro.9.t: "Живая Конституция" #NT!
 nd_iro.9.d: "Путешественники приезжают из дальних стран, чтобы изучить Великий Закон. Они восхищаются балансом сил внутри Конфедерации: матери кланов, которые выбирают сахемов, Большой совет, который обсуждает вопросы войны и мира, принцип консенсуса, который гарантирует, что ни одна нация не будет побеждена волей большинства. Философы пишут, что хауденосауни достигли того, о чем европейские мыслители могут только теоретизировать.\n\nЭто признание представляет собой выбор. Мы можем принять на себя роль первопроходцев конституционного права, создавая институты, которые сделают Великий Закон видимым и долговечным. Или мы можем обратиться внутрь себя, используя силу Великого Закона для обновления культуры Хауденосауни изнутри, кормления наших людей, обучения наших лидеров и обеспечения того, чтобы Длинный дом продолжал существовать как живая цивилизация, а не как любопытство философа." #NT!
 nd_iro.9.a: "Пусть мир учится на Великом Законе." #NT!
 nd_iro.9.b: "Закон существует для того, чтобы поддержать наш народ." #NT!
 nd_iro.10.t: "Дороги войны открыты" #NT!
 nd_iro.10.d: "Военачальники высказались. Траурные войны больше не будут ограничиваться небольшими рейдами за пленниками. Они станут завоевательными кампаниями. Вендат, Нейтралы, Петун: все, кто блокирует расширение Длинного дома, будут сметены. Их города будут сожжены, их люди усыновлены или рассеяны, их охотничьи угодья поглощены обширной территорией Хауденосауни. Дороги войны простираются на север и запад от родины, и воины точат свое оружие в мерцающем свете костра." #NT!
 nd_iro.10.a: "В Длинном зале не должно быть пустых мест." #NT!
 nd_iro.11.t: "Хозяева бобровых угодий" #NT!
 nd_iro.11.d: "Детройт пал. Страна Сандаски наша. Если когда-то конкурирующие народы контролировали западную торговлю бобрами, то теперь охотники хауденосауни свободно перемещаются по водоразделу Великих озер. Меха проходят через наши руки к европейским торговцам, и каждая проходящая шкура обогащает Конфедерацию.\n\nНо завоевания создают свои собственные дилеммы. Мы победили эти народы, но пустые земли никому не нужны. Ведем ли мы тотальную войну, ломая выживших настолько полностью, что сопротивление становится невозможным? Или мы следуем древнему пути усыновления, приводя побежденных в Длинный дом в качестве новых членов кланов, превращая врагов в братьев и заполняя пустые места вокруг наших костров?" #NT!
 nd_iro.11.a: "Разбейте их окончательно. Дорога войны не знает пощады." #NT!
 nd_iro.11.b: "Усыновите побежденных в Длинный дом." #NT!
 nd_iro.12.t: "Длинный дом простирается до горизонта" #NT!
 nd_iro.12.d: "От пролива Макино до болот Чекагу, от долины могавков до страны Огайо — Конфедерация Хауденосауни контролирует внутреннюю часть континента. Никакой мех не шевелится без нашего разрешения. Ни одна армия не пересекает нашу территорию без нашего разрешения. Европейские прибрежные колонии смотрят вглубь страны и видят Длинный дом: огромный, мощный и, казалось бы, вечный.\n\nЭто вершина военной мощи, но даже на вершине есть выбор. Останемся ли мы вечными воинами, совершенствующими искусство войны до тех пор, пока ни одна сила на этом континенте не сможет противостоять нам? Или мы используем наше военное превосходство для принятия и объединения, строя империю не только завоеваний, но и ассимиляции: Длинный дом становится все длиннее, принимая в свои объятия новые народы?" #NT!
 nd_iro.12.a: "Дороги войны вечны. Мы продолжаем сражаться." #NT!
 nd_iro.12.b: "Каждый побежденный народ становится нашим." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_chain_polished: "Альянс полированных цепей" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_chain_polished: "Хауденосауни тесно связали себя со своими дипломатическими партнерами, создав сеть альянсов, которая усиливает их влияние за счет постоянного дипломатического обслуживания." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_chain_sovereign: "Суверенные посредники" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_chain_sovereign: "Хауденосауни сохраняют свою независимость между всеми фракциями, используя свое положение честных посредников для получения уступок со всех сторон, не отвечая ни на что." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_law_constitution: "Архитекторы управления" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_law_constitution: "Великий Закон вдохновляет институциональные реформы по всему континенту. Хауденосауни становятся строителями и планировщиками, их конституционный гений выражается в физических структурах управления." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_law_renewal: "Обновление длинного дома" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_law_renewal: "Великий Закон обращен внутрь себя, поддерживая культуру Хауденосауни, кормя людей, обучая следующее поколение и сохраняя мудрость старейшин, даже несмотря на то, что внешний мир становится все более угрожающим." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_total_war: "Война без пощады" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_total_war: "Хауденосауни ведут тотальную войну против своих соперников, сломив сопротивление врага посредством беспощадных осад и нападений. Выжившие скорее разбросаны, чем приняты." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_adopt_vanquished: "Принять побежденных" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_adopt_vanquished: "Покоренные народы попадают в Длинный дом через систему усыновления, их воины присоединяются к военным отрядам Хауденосауни, а их семьи пополняют кланы." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_empire_warpath: "Вечная дорога войны" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_empire_warpath: "Хауденосауни совершенствуют искусство войны по всей континентальной империи, их воины набираются опыта в постоянных кампаниях ценой пренебрежения развитием сельского хозяйства." #NT!
 STATIC_MODIFIER_NAME_nd_iro_dest_empire_adoption: "Империя усыновления" #NT!
 STATIC_MODIFIER_DESC_nd_iro_dest_empire_adoption: "Длинный дом становится все длиннее по мере того, как покоренные народы принимаются в Конфедерацию. Бывшие враги становятся верными воинами, а сила империи заключается в объединении, а не в разрушении." #NT!
 nd_iro_peace_tree: "Дерево Великого Мира" #NT!
 nd_iro_peace_tree_desc: "Белая Сосна Мира, посаженная Великим Миротворцем Деганавидой, четыре белых корня которой простираются до краев земли. Под его ветвями собирается Большой Совет, чтобы управлять посредством консенсуса, а не силы." #NT!
 nd_iro_peace_tree_ceremonies: "Церемонии Дерева Мира" #NT!
 nd_iro_peace_tree_ceremonies_desc: "Для церемоний Великого Мира требуются факелы из пчелиного воска для ритуала соболезнования, бумага для записи решений совета и прекрасная ткань для дипломатического обмена подарками." #NT!
 nd_iro_war_lodge: "Военная Ложа" #NT!
 nd_iro_war_lodge_desc: "Укрепленный советский дом, где военачальники планируют кампании, воины готовятся к дальним набегам, а трофеи завоеваний выставляются напоказ, чтобы вдохновить новое поколение бойцов." #NT!
 nd_iro_war_lodge_maintenance: "Содержание военной ложи" #NT!
 nd_iro_war_lodge_maintenance_desc: "Ложе Войны требуется постоянный запас оружия для своих воинов, кожа для их снаряжения, древесина для стен и инструменты для обслуживания и ремонта." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_iro_bureaucracy_authority: "Бюрократический орган Лиги" #NT!
 AUTO_MODIFIER_DESC_nd_iro_bureaucracy_authority: "Конфедерация, объявив свою институциональную основу под Древом Мира, теперь может нанять формальную бюрократию для управления Длинным домом. Пожар столицы дает одно бюрократическое место; этот орган добавляет еще два." #NT!
  
 iro_grand_council_at_onondaga_bureaucracy: "Большой совет в Онондаге" #NT!
 iro_grand_council_at_onondaga_bureaucracy_desc: "Совещательная вершина Конфедерации. Пятьдесят наследственных титулов сахема, распределенных между Пятью Народами (9-й могавк, 9-й Онейда, 14-й Онондага, 10-й Каюга, 8-й Сенека), собирались вокруг центрального костра в Онондаге всякий раз, когда перед ними вставали вопросы войны, мира или дела лиги. Мохоки и сенека сидели как старшие братья по одну сторону костра, онейда и кайюга как младшие братья - с другой, а онондага как хранители огня сохраняли решающий голос на случай тупиковой ситуации. Для действий лиги требовался консенсус; одна нация могла отказаться, и дело было решено. Этот институт был закреплен в Кайанереко:ва, Великом Законе Мира, который произносился вампумом при каждом соболезновании." #NT!
  
 iro_clan_mother_council_bureaucracy: "Совет Матери Клана" #NT!
 iro_clan_mother_council_bureaucracy_desc: "Матрилинейная основа управления Хауденосауни. Каждый клан (Волк, Медведь, Черепаха, Олень, Бобр, Ястреб, Угорь, Бекас, Цапля) держал свои титулы сахема в доверительном управлении через своих старших матрон. Мать клана назначала обладателя каждого титула, представляла его для утверждения и могла отозвать его за проступок, трусость или невнимание к советам женщин. Она также имела право начинать траурные войны для замены умерших членов клана и запрещать войну, предложенную ее воинами, отказываясь от мокасин, сушеной кукурузы и сушеной еды, необходимых для кампании. Это учреждение было той опорой, на которой вращалась политика Хауденосауни." #NT!
  
 iro_wampum_record_office_bureaucracy: "Бюро регистрации вампума" #NT!
 iro_wampum_record_office_bureaucracy_desc: "Хранители яркой памяти лиги. Вампум, полированные бусины из трубача и куахога, просверленные в длинные нити и вплетенные в пояса с изображениями, служили юридическим, ритуальным и дипломатическим документом Пяти Народов. Пояс Гайаваты зафиксировал учредительный союз лиги; Двухрядный вампум записал голландский завет 1613 года; пояса Цепи Завета зафиксировали союз с Англией после 1677 года. Назначенные хранители веры держали вампум, читали на совете слова, прикрепленные к каждому поясу, и обучали своих преемников текстам. Пока что-то не было вампумировано, оно не было сделано; после того, как вампум был, он оставался привязным до тех пор, пока сохранялся пояс." #NT!
  
 iro_covenant_chain_protocol_bureaucracy: "Протокол цепочки заветов" #NT!
 iro_covenant_chain_protocol_bureaucracy_desc: "Дипломатическая система, которая связывала Конфедерацию с колониальными державами с 1613 года. Начиная с переговоров о двухрядном вампуме (Касвента), заключенном с голландскими торговцами в Тавагонши в 1613 году, Конфедерация считала, что ее союзы с европейскими державами представляют собой два параллельных ряда: коренные и европейские народы путешествуют по одной и той же реке на разных судах, не управляя ни одним другим. Голландская цепь перешла к англичанам после капитуляции Нью-Йорка в 1664 году и была возобновлена ​​в Олбани в 1677 году как формальная Цепь Завета, ежегодно шлифовавшаяся делегациями Конфедерации и комиссарами короны до 1755 года. Ирокез Теаногин, а затем Джозеф Брант провели цепь по всем колониям и навязывали свои условия угрозой вывода." #NT!
  
 iro_mourning_war_apparatus_bureaucracy: "Траурный военный аппарат" #NT!
 iro_mourning_war_apparatus_bureaucracy_desc: "Институциональный механизм захвата и усыновления в плен, который поддерживал население Хауденосауни во время Бобровых войн (ок. 1640–1701) и истощения оспы в семнадцатом веке. Мать клана умершего Хауденосауни развязала войну, выложив имя умершего на полу длинного дома; военачальники собрали добровольцев, развернули кампанию против внешнего государства и вернулись с пленными. Некоторые пленники были ритуально казнены в качестве официальной кровной мести; другие были усыновлены именами умерших, учитывая их местонахождение в длинном доме и их родственники, и объединены как полные Хауденосауни. К 1660 году, возможно, треть населения Конфедерации была усыновленной, а не родившейся Хауденосауни." #NT!
  
 iro_false_face_society_bureaucracy: "Общество ложных лиц" #NT!
 iro_false_face_society_bureaucracy_desc: "Братство врачей в масках, проводивших церемонии исцеления, обновления в середине зимы и сезонные праздники года Хауденосауни. Члены группы вырезали свои живые маски из липы, не срубая ее (дух дерева соглашался на резьбу), а затем носили маски в длинном доме, чтобы изгонять болезни, злых духов и плохое лекарство с помощью сильного сотрясения погремушек из черепашьего панциря и разбрасывания табака и пепла. Общество действовало наряду с Большим советом, но отдельно от него, имея собственную преемственность, собственное посвящение и собственный сезонный календарь; Husk Faces и Общество Faces разделяли эту медицинскую экономику. Матери клана координировали свои действия с Ложными Лицами по поводу болезней в длинном доме, а хранители веры консультировались с ними по календарю праздников." #NT!
