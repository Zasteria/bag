l_russian:
 STATIC_MODIFIER_NAME_nd_khalsa_raj: "Хальса Радж" #NT!
 STATIC_MODIFIER_DESC_nd_khalsa_raj: "Хальса Радж провозглашает суверенитет посредством силы Панта. Каждый сикх — солдат, каждый солдат — святой, и Пенджаб един под обоюдоострым мечом Кханды." #NT!
 STATIC_MODIFIER_NAME_nd_five_rivers_prosperity: "Процветание пяти рек" #NT!
 STATIC_MODIFIER_DESC_nd_five_rivers_prosperity: "Земля между пятью реками всегда была местом обитания великих цивилизаций. Благодаря терпимости ко всем вероисповеданиям и владению ирригацией и торговлей Пенджаб процветает как перекресток торговли и культуры." #NT!
 STATIC_MODIFIER_NAME_nd_pun_baptism_of_steel: "Стальное крещение" #NT!
 STATIC_MODIFIER_DESC_nd_pun_baptism_of_steel: "Кханде ки Пахул превратил Хальсу в воинов, которым нет равных. Каждый посвященный сикх носит с собой сталь и готов защищать веру до смерти." #NT!
 STATIC_MODIFIER_NAME_nd_pun_brotherhood_of_the_pure: "Братство Чистых" #NT!
 STATIC_MODIFIER_DESC_nd_pun_brotherhood_of_the_pure: "Хальса – это больше, чем армия. Это братство равных, связанных преданностью, где каста не имеет значения, и каждый член служит обществу самоотверженным служением." #NT!
 STATIC_MODIFIER_NAME_nd_pun_lion_of_lahore: "Лев Лахора" #NT!
 STATIC_MODIFIER_DESC_nd_pun_lion_of_lahore: "Махараджа привнес европейскую дисциплину в армию Хальсы. Обладая обученной французами пехотой, реформированной артиллерией и объединенным командованием, Империя сикхов располагает лучшей местной армией на субконтиненте." #NT!
 STATIC_MODIFIER_NAME_nd_pun_sarkar_i_khalsa: "Саркар-и-Хальса" #NT!
 STATIC_MODIFIER_DESC_nd_pun_sarkar_i_khalsa: "Правительство Хальсы приносит стабильность и процветание Пенджабу. Под просвещенным правлением пять рек питают землю торговли, культуры и религиозной гармонии." #NT!
 nd_pun.1.t: "Образование Пенджаба" #NT!
 nd_pun.1.d: "Земля пяти рек объединена под одним знаменем. От плодородных Доабов, орошаемых реками Джелум, Ченаб, Рави, Беас и Сатледж, до древних стен Лахора, Пенджаб всегда был перекрестком захватчиков и торговцев, религий и культур, Востока и Запада. Теперь впервые пенджабское государство пользуется лояльностью всех этих земель.\n\nНо каким же должен быть этот Пенджаб? Военные традиции Хальсы призывают к созданию государства воинов, где меч и Священное Писание владеют как единое целое, а Пант защищает свой суверенитет силой оружия. Или Пенджабу придется принять наследие своих пяти рек, землю изобилия и терпимости, где торговля течет так же свободно, как воды, и люди всех вероисповеданий находят приют?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pun.1.a: "Хальса Радж: суверенитет Чистого" #NT!
 nd_pun.1.b: "Пять рек будут питать всех, кто здесь живет." #NT!
 nd_pun.2.t: "Крещение обоюдоострого меча" #NT!
 nd_pun.2.d: "В день Вайсакхи, перед многотысячным собранием в Анандпуре, Гуру призвал добровольцев, готовых предложить свои головы за веру. Вперед вышли пятеро мужчин: водонос, фермер, прачка, цирюльник и повар. Ни воинов-кшатриев, ни священников-брахманов. Гуру крестил их подслащенной водой, размешанной обоюдоострым мечом, и они стали Пандж Пьяре, Пятью Возлюбленными. Затем, разрушив все условности каст и иерархии, Гуру преклонил колени и попросил Пятерых крестить его по очереди.\n\nРодилось Хальса, братство, в котором самые низшие становились высшими, где каждый член был одновременно святым и солдатом, где фамилия Сингх провозглашала, что каста отменена и каждый сикх стоит равным перед Всемогущим. Это была не просто военная реформа, но социальная революция. Как Хальса определит себя?" #NT!
 nd_pun.2.a: "Мы выкованы из стали: меч – наше Священное Писание" #NT!
 nd_pun.2.b: "Мы чисты: наше братство – наша сила" #NT!
 nd_pun.3.t: "Лев Пенджаба" #NT!
 nd_pun.3.d: "От одноглазого мальчика, потерявшего отца в двенадцать лет, до неоспоримого хозяина Пенджаба, восхождение Махараджи овеяно легендами. Он объединил капризных мислов не только кровопролитием, но и хитрой дипломатией, стратегическими браками и силой своей личности. Он захватил Лахор в девятнадцать лет, не сделав ни единого выстрела.\n\nТеперь Махараджа обращает свой взор на армию. Он нанял европейских офицеров, ветеранов кампаний Наполеона, для обучения своей пехоты на французский манер и организации артиллерии на современных принципах. Его образцовая бригада «Фаудж-и-Хас» уже может соперничать с любой силой на субконтиненте. Древняя пушка Замзама, захваченная у афганцев, стоит перед воротами Лахора как символ власти сикхов.\n\nВопрос в том, послужит ли эта военная революция завоеванию или консолидации." #NT!
 nd_pun.3.a: "Лев рычит: пусть наши враги дрожат" #NT!
 nd_pun.3.b: "Саркар-и-Хальса будет править мудро." #NT!
 nd_pun.4.t: "Вечный Гуру" #NT!
 nd_pun.4.d: "Был составлен Ади Грантх, священное писание, не похожее ни на одно другое. Он содержит не только гимны сикхских гуру, но и слова индуистских святых-бхакти и мусульманских суфийских мистиков, написанные на разных языках и в разных музыкальных стилях. Гуру Арджан заявил, что Грантх будет находиться в Хармандир-Сахиб в Амритсаре, открытом для всех, кто ищет мудрости, независимо от касты или вероисповедания.\n\nСо временем десятый Гуру объявит это писание вечным, живым Гуру сикхов, вечным учителем, превосходящим любую власть смертных. Гуру Грантх Сахиб воплощает революционный сикхский принцип, согласно которому божественная истина не принадлежит ни одному народу, языку или традиции, но говорит через них всех." #NT!
 nd_pun.4.a: "Слово — наш Гуру, сейчас и навсегда" #NT!
 nd_pun_five_rivers_irrigation: "Орошение пяти рек" #NT!
 nd_pun_five_rivers_irrigation_desc: "Земли Доаба между пятью реками Пенджаба приносят исключительные урожаи при правильном орошении с помощью систем каналов и персидских колес." #NT!
 nd_pun_lahore_learning: "Школы обучения Лахора" #NT!
 nd_pun_lahore_learning_desc: "При Газневидах и Делийском султанате Лахор стал известным центром персидской поэзии, исламской юриспруденции и научного обмена." #NT!
 nd_pun_doab_horsemen_tradition: "Доабские всадники" #NT!
 nd_pun_doab_horsemen_tradition_desc: "Плоские равнины между реками Пенджаба являются местом обитания превосходной кавалерии, быстрых всадников, привыкших к набегам и пограничным войнам." #NT!
 nd_pun_persian_wheel_tradition: "Персидская технология колес" #NT!
 nd_pun_persian_wheel_tradition_desc: "Появление персидского колеса преобразило сельское хозяйство Пенджаба, поднимая воду из рек для орошения полей вдали от их берегов.\n\n#italic Доступно в: $nd_pun_doab_canal$#!" #NT!
 nd_pun_khyber_crossroads: "Перекресток Хайбера" #NT!
 nd_pun_khyber_crossroads_desc: "Пенджаб охраняет восточную оконечность Хайберского перевала, через который проходят как завоеватели, так и караваны. Контроль над этими воротами означает контроль над торговлей между Центральной Азией и Индией." #NT!
 nd_pun_sultanate_garrison: "Традиции султанатского гарнизона" #NT!
 nd_pun_sultanate_garrison_desc: "Города Пенджаба (Лахор, Мултан, Сиалкот) на протяжении веков служили городами-крепостями на северо-западной границе Султаната." #NT!
 nd_pun_guru_nanaks_message: "Сообщение Гуру Нанака" #NT!
 nd_pun_guru_nanaks_message_desc: "В 1469 году в пенджабской деревне Талванди родился Гуру Нанак. Его послание («Нет индуиста, нет мусульманина») провозгласило единство всего человечества под одним Богом, заложив основу сикхизма." #NT!
 nd_pun_guru_ka_langar: "Гуру Ка Лангар" #NT!
 nd_pun_guru_ka_langar_desc: "Традиция общественной кухни, установленная сикхскими гуру, обеспечивает бесплатное питание всем посетителям, независимо от касты, вероисповедания или социального положения, что является радикальной декларацией равенства." #NT!
 nd_pun_mughal_lahore: "Могол Лахор" #NT!
 nd_pun_mughal_lahore_desc: "При Великих Моголов Лахор становится одним из величайших городов мира. Сады Шалимар, мечеть Бадшахи и форт Лахора превращают город в жемчужину индо-исламской цивилизации." #NT!
 nd_pun_multan_indigo: "Мултан Индиго" #NT!
 nd_pun_multan_indigo_desc: "В южном Пенджабе вокруг Мултана растут обширные плантации индиго, производящие ценный синий краситель для экспорта по всему субконтиненту и за его пределы." #NT!
 nd_pun_gurmukhi_script: "Сценарий Гурмухи" #NT!
 nd_pun_gurmukhi_script_desc: "Гуру Ангад, второй сикхский гуру, стандартизирует сценарий гурмукхи для записи пенджаби. Это литературное нововведение гарантирует, что сикхские писания доступны простым людям, а не запертым в санскрите элите." #NT!
 nd_pun_gatka_tradition: "Гатка Традиция" #NT!
 nd_pun_gatka_tradition_desc: "Сикхское боевое искусство гатка обучает воинов владению мечом, щитом, посохом и копьем. Это становится центральным элементом боевой идентичности Хальсы." #NT!
 nd_pun_guru_granth_sahib: "Гуру Грантх Сахиб" #NT!
 nd_pun_guru_granth_sahib_desc: "Сборник Ади Грантх, позже возведенный в ранг Гуру Грантх Сахиб, объединяет гимны сикхских гуру, индуистских святых-бхакти и мусульманских суфиев в писании беспрецедентной инклюзивности." #NT!
 nd_pun_harmandir_sahib: "Хармандир Сахиб" #NT!
 nd_pun_harmandir_sahib_desc: "Фундамент Золотого храма в Амритсаре создает духовное сердце сикхизма: храм, построенный ниже, чем его окрестности, чтобы учить смирению, с дверями, открытыми со всех четырех сторон, чтобы приветствовать всех." #NT!
 nd_pun_miri_piri: "Доктрина Мири-Пири" #NT!
 nd_pun_miri_piri_desc: "Гуру Харгобинд носит два меча: Мири — для светской власти, Пири — для духовной власти. Доктрина устанавливает, что сикхи должны быть готовы защищать свою веру силой оружия." #NT!
 nd_pun_sikh_dharamsalas: "Сикх Дхарамсалас" #NT!
 nd_pun_sikh_dharamsalas_desc: "Сети дхарамсал, домов отдыха и общественных центров разбросаны по Пенджабу, предлагая приют и средства к существованию путешественникам и паломникам всех вероисповеданий." #NT!
 nd_pun_akal_takht: "Акал Тахт" #NT!
 nd_pun_akal_takht_desc: "Трон Вневременного, установленный в Амритсаре Гуру Харгобиндом, становится высшим местом светской власти сикхов, институтом, из которого Пантх издает политические и духовные указы." #NT!
 nd_pun_five_rivers_trade: "Торговля пяти рек" #NT!
 nd_pun_five_rivers_trade_desc: "Реки Пенджаба являются торговыми артериями. Торговля течет вдоль их берегов и через города Доаба, соединяя рынки Центральной Азии с богатствами Гангской равнины." #NT!
 nd_pun_khalsa_formation: "Формация Хальса" #NT!
 nd_pun_khalsa_formation_desc: "В 1699 году Гуру Гобинд Сингх учредил Хальсу, Орден Чистых. Посредством церемонии Ханде ки Пахул сикхи крестятся как святые воины, связанные общей идентичностью, выходящей за рамки касты." #NT!
 nd_pun_misl_cavalry_tradition: "Мисльская кавалерия" #NT!
 nd_pun_misl_cavalry_tradition_desc: "Двенадцать мислов Конфедерации сикхов выставляют на вооружение быстроходную кавалерию, которая превосходно ведет партизанскую войну, совершая набеги на линии снабжения Великих Моголов и Афганистана через равнины Пенджаба." #NT!
 nd_pun_dal_khalsa: "Дал Хальса" #NT!
 nd_pun_dal_khalsa_desc: "Дал Хальса объединяет сикхское военное собрание. Хотя мислы остаются независимыми, они собираются под знаменем объединенной Хальсы для проведения крупных кампаний." #NT!
 nd_pun_khalsa_coinage: "Чеканка Хальсы" #NT!
 nd_pun_khalsa_coinage_desc: "Конфедерация сикхов чеканит свои собственные монеты, рупию Нанакшахи, носящие имена Гуру, а не какого-либо светского суверена, утверждая денежный суверенитет сикхов." #NT!
 nd_pun_rakhi_system: "Система Рахи" #NT!
 nd_pun_rakhi_system_desc: "Сикхские мислы взимают ракхи, налог на защиту деревень в обмен на защиту от рейдеров и захватчиков. Это становится финансовой основой территориального контроля сикхов." #NT!
 nd_pun_akali_warriors: "Акали Воины" #NT!
 nd_pun_akali_warriors_desc: "Акали, «Последователи Вневременного», — бесстрашный авангард Хальсы. Вооруженные традиционным оружием, они отказываются от европейской подготовки и сражаются с яростью религиозной преданности." #NT!
 nd_pun_ranjit_singhs_empire: "Империя Ранджита Сингха" #NT!
 nd_pun_ranjit_singhs_empire_desc: "Махараджа Ранджит Сингх объединяет двенадцать мислов под своим личным правлением, основывая Империю сикхов со столицей в Лахоре. Его правление приносит Пенджабу беспрецедентную стабильность, религиозную терпимость и военную мощь." #NT!
 nd_pun_fauj_i_khas_advance: "Фаудж-и-Хас" #NT!
 nd_pun_fauj_i_khas_advance_desc: "Фаудж-и-Хас — это элитная образцовая бригада армии Хальсы, состоящая из обученной французами пехоты, кавалерии по образцу Великобритании и артиллерийского отряда под командованием европейских офицеров. Это лучшая местная сила на субконтиненте." #NT!
 nd_pun_lahore_foundry: "Лахорский литейный завод" #NT!
 nd_pun_lahore_foundry_desc: "Под контролем Европы Пенджаб развивает современные артиллерийские заводы в Лахоре. Орудийные расчеты Хальсы достигают необычайной точности, способной соперничать с любой артиллерией мира." #NT!
 nd_pun_shawl_trade: "Амритсар Шаль Трейд" #NT!
 nd_pun_shawl_trade_desc: "Амритсар становится центром торговли кашмирскими платками. Более ста тысяч мастеров ткут, красят и вышивают прекрасные шали для экспорта в Европу и во дворы Азии.\n\n#italic Доступно в: $nd_pun_shawl_karkhana$#!" #NT!
 nd_pun_khalsa_modernization: "Модернизация Хальсы" #NT!
 nd_pun_khalsa_modernization_desc: "Империя сикхов набирает европейских офицеров, ветеранов наполеоновских войн, для модернизации обучения, логистики и тактики. Ранджит Сингх превращает феодальную кавалерию в современную общевойсковую армию.\n\n#italic Доступно в: $nd_pun_khalsa_training_ground$#!" #NT!
 nd_pun_golden_temple: "Золотой Храм" #NT!
 nd_pun_golden_temple_desc: "Махараджа Ранджит Сингх покрывает верхние этажи Хармандир-Сахиб 750 килограммами чистого золота, превращая духовное сердце сикхизма в одно из самых великолепных религиозных сооружений в мире." #NT!
 nd_pun_khalsa_regular_army: "Регулярная армия Хальсы" #NT!
 nd_pun_khalsa_regular_army_desc: "Современная армия Хальсы имеет хорошо обученных регулярных солдат, оснащенных европейскими мушкетами и штыками, организованных в батальоны с профессиональными унтер-офицерами." #NT!
 nd_pun_punjabi_industry: "Пенджабская промышленность" #NT!
 nd_pun_punjabi_industry_desc: "Мастерские и кузницы Лахора и Амритсара расширяются до протопромышленного производства, производства оружия, текстиля и изделий из металла." #NT!
 nd_pun_sikh_governance: "Сикхское конституционное управление" #NT!
 nd_pun_sikh_governance_desc: "Традиция Гурматы, коллективного принятия решений Хальса Пантхом в Акал Тахте, развивается в сложную систему управления, балансирующую военную, религиозную и гражданскую власть." #NT!
 nd_pun_breadbasket: "Пенджабская житница" #NT!
 nd_pun_breadbasket_desc: "Плодородные земли Доаба и расширенные каналы орошения Пенджаба делают его житницей субконтинента, кормя миллионы людей и производя излишки сельскохозяйственной продукции на экспорт.\n\n#italic Доступно в: $nd_pun_doab_canal$#!" #NT!
 nd_pun_martial_legacy: "Сикхское военное наследие" #NT!
 nd_pun_martial_legacy_desc: "Боевые традиции Хальсы передаются из поколения в поколение. Дух сикхского воина (мужество, дисциплина и готовность к самопожертвованию) становится легендарным во всем мире." #NT!
 nd_pun_punjabi_renaissance: "Пенджабский ренессанс" #NT!
 nd_pun_punjabi_renaissance_desc: "Расцвет пенджабской литературы, музыки и художественного творчества основан на письменности гурмукхи и культурном синтезе, которому способствовали столетия сосуществования сикхов, индуистов и мусульман." #NT!
 a_nd_pun_doab_horsemen: "Доабские всадники" #NT!
 a_nd_pun_doab_horsemen_desc: "Быстрые кавалеристы с равнин между реками Пенджаба, опытные в набегах и приграничных стычках." #NT!
 a_nd_pun_lahori_garrison: "Лахори Гарнизон" #NT!
 a_nd_pun_lahori_garrison_desc: "Дисциплинированная гарнизонная пехота, набранная из городов-крепостей Пенджаба, обученная обороне стен и цитаделей." #NT!
 a_nd_pun_nihang: "Нихан Уорриорз" #NT!
 a_nd_pun_nihang_desc: "Бесстрашные ударные войска Акали Хальсы, хорошо вооруженные традиционным оружием и движимые непоколебимой религиозной преданностью." #NT!
 a_nd_pun_misl_cavalry: "Мисльская кавалерия" #NT!
 a_nd_pun_misl_cavalry_desc: "Быстрые партизанские всадники Конфедерации сикхов, эксперты в фланговых маневрах и молниеносных рейдах." #NT!
 a_nd_pun_fauj_i_khas: "Фаудж-и-Хас" #NT!
 a_nd_pun_fauj_i_khas_desc: "Элитная пехота армии Хальсы, обученная европейскими офицерами современной тактике и обученная по самым высоким стандартам." #NT!
 a_nd_pun_khalsa_artillery: "Хальса Артиллерия" #NT!
 a_nd_pun_khalsa_artillery_desc: "Модернизированные артиллерийские расчеты Империи Сикхов, обученные французскими и итальянскими офицерами для достижения исключительной точности." #NT!
 a_nd_pun_khalsa_regulars: "Халса Регулярные посетители" #NT!
 a_nd_pun_khalsa_regulars_desc: "Хорошо обученная современная пехота реформированной армии Хальсы, оснащенная европейскими мушкетами и организованная в профессиональные батальоны." #NT!
 nd_pun_doab_canal: "Канал Доаб" #NT!
 nd_pun_doab_canal_desc: "Оросительный канал, собирающий воду из рек Пенджаба для питания плодородных земель Доаба между ними." #NT!
 nd_pun_gurdwara: "Гурдвара" #NT!
 nd_pun_gurdwara_desc: "Сикхский храм с общественной кухней, где всем посетителям подают бесплатную еду, воплощая сикхские принципы равенства и бескорыстного служения." #NT!
 nd_pun_lahore_arsenal: "Лахор Арсенал" #NT!
 nd_pun_lahore_arsenal_desc: "Военный литейный завод и арсенал, производящий современное огнестрельное оружие и артиллерию для армии Хальсы." #NT!
 nd_pun_shawl_karkhana: "Шаль Кархана" #NT!
 nd_pun_shawl_karkhana_desc: "Текстильная мастерская, где мастера ткут, красят и вышивают прекрасные шали для экспортной торговли предметами роскоши." #NT!
 nd_pun_dharamsala: "Дхарамсала" #NT!
 nd_pun_dharamsala_desc: "Сикхский дом отдыха и общественный центр, предлагающий приют и питание для путешественников и паломников любого происхождения." #NT!
 nd_pun_khalsa_training_ground: "Тренировочный полигон Хальса" #NT!
 nd_pun_khalsa_training_ground_desc: "Современная военная академия, где обученные в Европе офицеры обучают армию Хальсы общевойсковой тактике." #NT!
 nd_pun_canal_maintenance: "Обслуживание каналов" #NT!
 nd_pun_canal_maintenance_desc: "Содержание оросительных каналов требует регулярного проведения дноуглубительных работ, ремонта берегов и обслуживания шлюзовых затворов." #NT!
 nd_pun_langar_provisions: "Лангарские положения" #NT!
 nd_pun_langar_provisions_desc: "Общественная кухня требует постоянного снабжения зерном, рисом и топливом, чтобы накормить всех, кто приходит в поисках еды." #NT!
 nd_pun_arsenal_production: "Арсенал Продакшн" #NT!
 nd_pun_arsenal_production_desc: "Литейный завод потребляет железо, инструменты и существующее вооружение для изготовления современного оружия и боеприпасов для армии Хальсы." #NT!
 nd_pun_shawl_weaving: "Плетение шали" #NT!
 nd_pun_shawl_weaving_desc: "Ремесленники ткут качественную шерсть с использованием импортных красителей для производства изысканных шалей, которые ценятся во всем мире." #NT!
 nd_pun_dharamsala_upkeep: "Содержание Дхарамсалы" #NT!
 nd_pun_dharamsala_upkeep_desc: "Для содержания домов отдыха требуется зерно для гостей, пиломатериалы для ремонта и благовония для молитв и ритуалов." #NT!
 nd_pun_training_provisions: "Условия обучения" #NT!
 nd_pun_training_provisions_desc: "Военным учебным заведениям требуется огнестрельное оружие для тренировок, лошади для обучения кавалерии и кожа для шорно-седельного снаряжения и снаряжения." #NT!
 nd_pun_persian_wheel: "Персидское колесо орошения" #NT!
 nd_pun_persian_wheel_desc: "Персидское колесо поднимает воду из рек Пенджаба для орошения полей по всему Доабу, превращая маргинальные земли в продуктивные сельскохозяйственные угодья." #NT!
 nd_pun_indigo_cultivation: "Выращивание Индиго" #NT!
 nd_pun_indigo_cultivation_desc: "Растения индиго, выращиваемые на юге Пенджаба, перерабатываются в ценный синий краситель для текстильной торговли." #NT!
 nd_pun_khalsa_mint: "Хальса Мятный" #NT!
 nd_pun_khalsa_mint_desc: "Сикхские монетные дворы потребляют серебро, медь и чеканочные инструменты для производства рупии Нанакшахи, утверждая денежный суверенитет и стабилизируя торговлю в Пенджабе." #NT!
 nd_pun_nihang_training: "Боевая тренировка Нихан" #NT!
 nd_pun_nihang_training_desc: "Для обучения воинов Ниханга требуется оружие для тренировок, зерно для поддержания воинов-аскетов и кожа для их отличительных доспехов и щитов." #NT!
 levy_nd_pun_nihang: "Ниханг Леви" #NT!
 levy_nd_pun_nihang_desc: "Религиозные воины Акали, выросшие из верующих сикхов, сражаются традиционным оружием и непоколебимой преданностью." #NT!
 levy_nd_pun_doab_horsemen: "Доаб Всадники Леви" #NT!
 levy_nd_pun_doab_horsemen_desc: "Легкая кавалерия, набранная из крестьян и солдат речных равнин Пенджаба." #NT!
 nd_pun_rakhi_post: "Рахи Пост" #NT!
 nd_pun_rakhi_post_desc: "Станция защиты сикхов, где сбор ракхи собирается из деревень в обмен на защиту от рейдеров и бандитов." #NT!
 nd_pun_rakhi_collection: "Коллекция Ракхи" #NT!
 nd_pun_rakhi_collection_desc: "Вооруженные сикхские патрули собирают налоги на защиту с окрестных деревень, требуя оружие, лошадей для конного прикрытия и кожу для патрульного снаряжения." #NT!
 nd_pun_canal_agriculture: "Сельское хозяйство канальной колонии" #NT!
 nd_pun_canal_agriculture_desc: "Современное сельское хозяйство, питаемое каналами, превращает земли Доаба Пенджаба в поместья с интенсивным выращиванием пшеницы." #NT!
 nd_pun_formed_tt: "был образован Пенджаб." #NT!
 nd_pun_path_a_tt: "Выбрал Хальса Радж" #NT!
 nd_pun_path_b_tt: "Выбрал процветание пяти рек" #NT!
 nd_pun_destiny: "Судьба Пенджаба" #NT!
 nd_pun_destiny_desc: "Пенджаб един. Земля пяти рек выбрала свой путь, и теперь ее предстоит выковать действиями, завоеваниями и трудолюбием." #NT!
 nd_pun_dest_sword_of_the_panth: "Меч Панта" #NT!
 nd_pun_dest_sword_of_the_panth_desc: "Защитите северную границу, завоевав Кашмир и создав армию, достойную Хальсы. Завладейте Сринагаром, имея под ружьем не менее 30 000 солдат." #NT!
 nd_pun_dest_march_to_kabul: "Марш в Кабул" #NT!
 nd_pun_dest_march_to_kabul_desc: "Несите знамя Хальсы в Афганистан, завоевывая древний центр власти Газневидов. Собственный Кабул с высоким развитием и престижем." #NT!
 nd_pun_dest_empire_of_the_khalsa: "Империя Хальса" #NT!
 nd_pun_dest_empire_of_the_khalsa_desc: "Постройте величайшую сикхскую империю, которую когда-либо видел мир, простирающуюся от Кандагара до Дели. Владейте обоими городами с огромной казной и армией." #NT!
 nd_pun_dest_rivers_of_gold: "Реки золота" #NT!
 nd_pun_dest_rivers_of_gold_desc: "Превратите хлопковое богатство Пенджаба в коммерческое господство. Накопите золото и обеспечьте поток хлопка через рынок капитала." #NT!
 nd_pun_dest_crossroads_of_faith: "Перекресток веры" #NT!
 nd_pun_dest_crossroads_of_faith_desc: "Сделайте Пенджаб маяком обучения и толерантности, используя современные банковские учреждения и развивая землю между пятью реками." #NT!
 nd_pun_dest_breadbasket_of_nations: "Хлебница наций" #NT!
 nd_pun_dest_breadbasket_of_nations_desc: "Станьте коммерческим сердцем субконтинента. Используйте печатный станок, защитите торговый порт Синда Татта и накопите огромное богатство." #NT!
 nd_pun.5.t: "Судьба Пенджаба" #NT!
 nd_pun.5.d: "Пять рек текут вечно, но государство, которое ими управляет, должно доказать, что оно достойно постоянства. Пенджаб стоит на перепутье не только географии, где перевалы Центральной Азии встречаются с равнинами Индостана, но и самой судьбы. От сделанного сейчас выбора будет зависеть, станет ли эта нация сноской в ​​хрониках великих империй или же она вырежет свое имя в камне истории.\n\nПуть выбран. Теперь надо пройтись." #NT!
 nd_pun.5.a: "Пенджаб выстоит" #NT!
 nd_pun.6.t: "Меч обнаженный" #NT!
 nd_pun.6.d: "Кашмирская долина захвачена войсками Пенджаба. Там, где когда-то правители Великих Моголов и афганские военачальники оспаривали этот рай гор и озер, теперь знамя Хальсы реет над Шринагаром. Северная граница обеспечена, но это только начало.\n\nГоры, которые когда-то защищали врагов Пенджаба, теперь являются его валом. С этих высот воины Панта смотрят на запад, в сторону Кабула, и на юг, в сторону Дели. Меч Хальсы, однажды обнаженный, не успокоится, пока не исполнится его предназначение." #NT!
 nd_pun.6.a: "Граница наша: теперь мы смотрим за ее пределы" #NT!
 nd_pun.7.t: "Падение Кабула" #NT!
 nd_pun.7.d: "Древний город Кабул (резиденция Газневидов, которые когда-то разграбили Пенджаб, оплот дуррани, терроризировавших Лахор) пал под властью Хальсы. Ирония не ускользнула от ветеранов кампании: потомки тех, кто пострадал от набегов афганских захватчиков, донесли свое знамя до самого сердца Афганистана.\n\nЗахват Кабула превращает Пенджаб из региональной державы в субконтинентальную. Но с завоеванием возникает вопрос, как управлять этими новыми территориями. Будет ли армия продвигаться вперед с импульсом победы или же на расширяющейся границе будет наведена дисциплина и порядок?" #NT!
 nd_pun.7.a: "Используйте преимущество: авангард лидирует" #NT!
 nd_pun.7.b: "Дисциплина превыше всего: укрепляйте границы" #NT!
 nd_pun.8.t: "Империя без равных" #NT!
 nd_pun.8.d: "От перевалов Кандагара до стен Дели, от снегов Кашмира до пустынь Синда империя Хальса теперь простирается по всей широте северо-запада субконтинента. Ни одна держава на земле не могла сравниться с этим достижением: империя, созданная не на основе династического наследия, а на основе коллективной воли Панта.\n\nПушка Замзама, «Огнедышащий дракон», стоит перед воротами Лахора как символ того, что сотворил Хальса. Но каждая империя стоит перед выбором между мечом, который побеждает, и рукой, которая правит. Должен ли Пенджаб проецировать свою военную мощь наружу, требуя подчинения от своих соседей? Или разведка и дипломатия империи скрепят ее завоевания в прочное господство?" #NT!
 nd_pun.8.a: "Лев рычит: пусть дрожат" #NT!
 nd_pun.8.b: "Гром Замзамы заставляет повиноваться" #NT!
 nd_pun.9.t: "Реки приносят свое богатство" #NT!
 nd_pun.9.d: "Огромные караваны хлопка Пенджаба начали течь с полей Доаба на рынки столицы, от прялок Мултана к торговым домам Лахора. Хлопок — это белое золото, и Пенджаб расположен на вершине его океана.\n\nПять рек, давших этой земле название, — это больше, чем просто водные пути для орошения и судоходства. Это торговые артерии, несущие сырьевые богатства внутренних районов на рынки мира. Купец, контролирующий слияние, контролирует торговлю половины континента." #NT!
 nd_pun.9.a: "Реки сделают нас богатыми" #NT!
 nd_pun.10.t: "Где встречаются все религии" #NT!
 nd_pun.10.d: "Пенджаб стал тем, что задумал Гуру Нанак, страной, где индуисты и мусульмане, сикхи и христиане, торговцы и мистики находят общий язык. Развитие современного банковского дела превратило базары Лахора и Амритсара в центры международных финансов. Деньги, как вода, текут туда, где каналы самые глубокие, и каналы Пенджаба действительно глубоки.\n\nТеперь вопрос в том, как использовать это процветание. Будет ли богатство Доаба способствовать росту самой земли, превратив Пенджаб в сад изобилия? Или же общественная кухня Лангара будет питать не только тела, но и интеграцию всех народов в единую пенджабскую идентичность?" #NT!
 nd_pun.10.a: "Доаб переполнится изобилием" #NT!
 nd_pun.10.b: "Лангар кормит всех, кто приходит" #NT!
 nd_pun.11.t: "Сердце субконтинента" #NT!
 nd_pun.11.d: "Купцы Татты преклоняются перед торговыми домами Пенджаба. Типографии Лахора распространяли знания на дюжине языков. От соляных шахт Хевра до хлопковых полей Мултана, от мастерских по производству шалей в Амритсаре до речных портов пяти Доабов, Пенджаб стал незаменимым перекрестком южноазиатской торговли.\n\nЭто не империя меча, а империя бухгалтерской книги и меры зерна, и от этого она не менее могущественна. Остается вопрос, будет ли Пенджаб проецировать эту коммерческую мощь за пределы страны через дипломатию и торговлю, или же он усовершенствует свою внутреннюю экономику, чтобы стать самоподдерживающейся цивилизацией." #NT!
 nd_pun.11.a: "Наши купцы дойдут до любого суда" #NT!
 nd_pun.11.b: "Наши ткацкие станки и поля кормят мир" #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_khalsa_vanguard: "Хальса Авангард" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_khalsa_vanguard: "Авангард Хальсы продвигается вперед, быстро пополняя и грабя богатства завоеванных земель, чтобы питать дальнейшие кампании." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_frontier_discipline: "Пограничная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_frontier_discipline: "Железная дисциплина поддерживает Хальсу на афганской границе, уменьшая усталость от войны и привлекая наемников под знамя; хотя успех порождает определенную степень самоуспокоенности." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_lion_of_punjab: "Лев Пенджаба" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_lion_of_punjab: "Лев Пенджаба диктует условия побежденным врагам, аннексирует территории с меньшими затратами и объявляет войны с доверием непобежденных." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_zamzama_thunder: "Замзама Гром" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_zamzama_thunder: "Гром Замзамы эхом разносится по империи, связывая подданных лояльностью и разведывательными сетями; хотя стоимость империи напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_doab_abundance: "Доаб Изобилие" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_doab_abundance: "Плодородные земли Доаба дают такое изобилие, что сепаратизм угасает и открываются новые дипломатические каналы, вовлекая соседей в орбиту Пенджаба." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_langar_of_nations: "Лангар Наций" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_langar_of_nations: "Легендарное гостеприимство Пенджаба объединяет различные народы и привлекает наемников за небольшие деньги, хотя комфорт процветания притупляет преимущество армии в кампании." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_five_rivers_emporium: "Торговый центр Five Rivers" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_five_rivers_emporium: "Дипломаты Пенджаба и торговцы скотом доходят до каждого суда на субконтиненте, хотя приверженность страны толерантности делает религиозные войны политически дорогостоящими." #NT!
 STATIC_MODIFIER_NAME_nd_pun_dest_cultural_synthesis: "Культурный синтез" #NT!
 STATIC_MODIFIER_DESC_nd_pun_dest_cultural_synthesis: "Слияние сикхских, индуистских и мусульманских традиций превращает мастерские Пенджаба в двигатели производства, а экспорт шерсти и соли поддерживает обширные сети поставок." #NT!
 nd_pun_dest_khalsa_durbar: "Хальса Дурбар" #NT!
 nd_pun_dest_khalsa_durbar_desc: "Суверенный двор Империи Хальса, где военные командиры и гражданские администраторы встречаются под властью Панта, чтобы управлять огромными владениями сикхов." #NT!
 nd_pun_dest_durbar_administration: "Администрация Дурбара" #NT!
 nd_pun_dest_durbar_administration_desc: "Имперский двор потребляет оружие для охраны, бумагу для административных записей и ткань для церемониальных атрибутов суверенитета." #NT!
 nd_pun_dest_doab_mandi: "Доаб Манди" #NT!
 nd_pun_dest_doab_mandi_desc: "Большой рынок на переправе через реки, где товары Центральной Азии, Гангской равнины и Декана сходятся в коммерческих объятиях Пенджаба." #NT!
 nd_pun_dest_mandi_operations: "Манди Операции" #NT!
 nd_pun_dest_mandi_operations_desc: "На рынке требуется ткань для торговых образцов, бумага для контрактов, соль для консервации и инструменты для взвешивания и измерения товаров." #NT!
  
 # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_pun_bureaucracy_authority: "Хальса Диванс" #NT!
 AUTO_MODIFIER_DESC_nd_pun_bureaucracy_authority: "Административный аппарат Пенджаба (великое собрание сикхов в Акал Тахте, конфедерация всадников мисл, Хальса Пантх, Лахорский Дурбар Махараджи и налоговые книги Дафтара) превратился в постоянную институциональную структуру. Власть осуществляется через реестры и собрания, а не через одного правителя, и королевство теперь функционирует как институт, а не суд." #NT!
  
 pun_sarbat_khalsa_bureaucracy: "Сарбат Халса" #NT!
 pun_sarbat_khalsa_bureaucracy_desc: "Собрание всей Хальсы, проводимое раз в два года, созывается в Амритсаре в Байсахи и Дивали. Сидя в Акал Тахте лицом к лицу с Хармандиром Сахибом, вожди мислов, грантхи и Акали джатедары разрешали споры и издавали гурматы (декреты, принятые в присутствии Гуру Грантха Сахиба) о войне, договорах и отлучении от церкви. Именно гурматы 1733 года избрали Капура Сингха лидером Дал Хальсы; Благодаря таким собраниям сикхи XVIII века поддерживали политическое единство без центрального государства. Ранджит Сингх незаметно прекратил созывать Сарбат Хальсу после 1805 года, признав, что ее авторитет несовместим с его собственным." #NT!
  
 pun_misl_confederacy_bureaucracy: "Конфедерация Мисл" #NT!
 pun_misl_confederacy_bureaucracy_desc: "Двенадцать кавалерийских конфедераций, разделивших Пенджаб между ок. 1716 и 1799 годы: Сукерчакия, Бханги, Ахлувалия, Рамгархия, Пхулкиан, Сингпурия, Крора Сингхия, Наккаи, Файзуллапурия, Карор Сингхия, Нишанвалия и Даллевалия. Каждый мисл представлял собой аристократический военный отряд, чьи сардары владели территорией в соответствии с системой ракхи: рента за защиту, выплачиваемая деревнями отряду, всадники которого патрулировали их поля. Конфедерация могла выставить десятки тысяч кавалеристов против вторжений Ахмад-шаха Абдали, но не подчинялась ни одному монарху; Ранджит Сингх покорил мислов одного за другим между 1799 и 1809 годами, лишив тех, кто не подчинился, и объединив остальных в свою постоянную армию." #NT!
  
 pun_khalsa_panth_bureaucracy: "Хальса Пантх" #NT!
 pun_khalsa_panth_bureaucracy_desc: "Орден чистых, основанный Гуру Гобинд Сингхом в Анандпуре на Байсакхи в 1699 году с началом Пандж Пьяре и учреждением амрит пахула. Хальса сочетала в себе религиозную преданность и военную службу: каждый инициированный сикх становился Сингхом или Кауром, связанным пятью какарами и кодексом Рахита Марьяды и обязанным носить оружие для защиты дхармы. Пантх поддерживал сикхское сопротивление во время геноцидных преследований Великих Моголов в 1740-х и 1750-х годах, когда Банда Сингх Бахадур и Дал Хальса сражались в лесах Лакхи Джангала, и после этого оставались моральной основой каждого сикхского военного формирования." #NT!
  
 pun_lahore_durbar_bureaucracy: "Лахор Дурбар" #NT!
 pun_lahore_durbar_bureaucracy_desc: "Центральный суд Махараджи Ранджита Сингха, основанный в Лахоре после его коронации в 1801 году, под председательством вакил-и-мутлака Дхиан Сингха Догра. Дурбар издавал фирманы, проверял доходы провинций, выступал посредником между сардарами поглощенных мислов и распространял власть махараджи на многоконфессиональное пенджабское государство, простирающееся от Пешавара до Сатледжа. Через Дурбар Ранджит Сингх собрал индуистских братьев Догра, пенджабского мусульманина Факира Азизуддина и группу европейских советников в единый административный аппарат. Это учреждение пережило его лишь ненадолго: цареубийственная борьба 1839–1843 годов разрушила его за четыре года." #NT!
  
 pun_fauj_i_khas_bureaucracy: "Фаудж-и-Хас" #NT!
 pun_fauj_i_khas_bureaucracy_desc: "Образцовая бригада, сформированная Ранджитом Сингхом в 1822 году и обученная на французском и итальянском образцах ветеранами армий Наполеона. Жан-Франсуа Аллар организовал кавалерию, Жан-Батист Вентура — пехоту, Клод-Огюст Кур — артиллерию, а Паоло ди Авитабиле — жандармерию Хайберской границы. Элитная дивизия армии Хальса обучалась на трех языках, сражалась дисциплинированными линиями и колоннами и располагала конной артиллерией, с которой в Азии могла бы конкурировать только Ост-Индская компания. Хари Сингх Налва владел Фаудж-и-Хасом при завоевании Мултана, Кашмира и Пешавара, прервав трехвековое господство Афганистана на Инде перед своей смертью в Джамруде в 1837 году." #NT!
  
 pun_daftar_i_bahi_bureaucracy: "Дафтар-и-Бахи" #NT!
 pun_daftar_i_bahi_bureaucracy_desc: "Система реестра доходов, администрируемая из Лахора Диваном Саваном Малом из Мултана и Диваном Диной Натхом, которые основывались на джагирдари позднего Моголов, но регистрировали каждый грант в постоянной бахи (книге учета). Сикх-джагиры были закреплены за военной службой, а не по наследственному праву: сардар, не сумевший доставить свой отряд всадников, лишался назначения обратно на земли халсы. Писцы Дафтара были набраны из пенджабских бюргеров-кхатри и из класса браминов-пандитов и одновременно вели ведомости доходов на персидском, пенджабском и ландском алфавитах, что позволяло махарадже облагать налогом многоконфессиональное царство из единой казны." #NT!
  
 pun_akali_nihangs_bureaucracy: "Акали Нихангс" #NT!
 pun_akali_nihangs_bureaucracy_desc: "Бессмертные воины Акал Тахт, облачённого в синее аскетического ордена, основанного Гуру Харгобиндом в 1606 году для воплощения принципа мири-пири: светского и духовного меча в одном. Ниханги составляли ортодоксальную гвардию Хальсы, служили проводниками на сикхских полях сражений от Чамкаура (1704 г.) до англо-сикхских войн и, как известно, сражали джатедари Акали Пхулы Сингха против самого Ранджита Сингха в Лахорском Дурбаре 1819 года, когда джатедар Акали публично оштрафовал махараджу за моральные упущения. Орден подчинялся Гуру Грантху Сахибу и рахиту, а не суду, и его независимость была гарантом сикхской ортодоксальности против королевских уступок." #NT!
