l_russian:
 STATIC_MODIFIER_NAME_nd_confederation_of_the_sword: "Конфедерация Меча" #NT!
 STATIC_MODIFIER_DESC_nd_confederation_of_the_sword: "Объединенные шаньские монгы сплотились под единым военным знаменем. От высокогорья до долины Иравади савбы маршировали как один, их кавалерия с грохотом проносилась через горные перевалы, как это делали их предки, когда они разгромили королевства Сагаинг и Пинья." #NT!
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_plateau: "Перекресток плато" #NT!
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_plateau: "Шанское нагорье находится на стыке цивилизаций. Караваны из Юньнани везут чай и шелк на юг, а сиамские торговцы привозят товары с побережья. Саубва контролируют процветающую торговую сеть, которая обогащает каждого человека, к которому она прикасается." #NT!
 STATIC_MODIFIER_NAME_nd_heirs_of_mong_mao: "Наследники Монг Мао" #NT!
 STATIC_MODIFIER_DESC_nd_heirs_of_mong_mao: "Боевой дух древней конфедерации Тай живёт. Шанская кавалерия едет с горящей в их сердцах памятью о завоеваниях Монг Мао." #NT!
 STATIC_MODIFIER_NAME_nd_council_of_sawbwas: "Совет Саубваса" #NT!
 STATIC_MODIFIER_DESC_nd_council_of_sawbwas: "Вместо того, чтобы править только с помощью силы, шанские князья предпочли править посредством консенсуса. Совет саубвас обсуждает государственные вопросы, уравновешивая амбиции каждого монга на благо всех." #NT!
 STATIC_MODIFIER_NAME_nd_caravan_prosperity: "Караван Процветания" #NT!
 STATIC_MODIFIER_DESC_nd_caravan_prosperity: "Торговые пути через Кенгтун полны активности. Ежегодно через него проезжает восемь тысяч мулов, нагруженных китайскими товарами, и Шанские города, расположенные вдоль маршрута, жиреют от торговли." #NT!
 nd_sha.1.t: "Шанские Штаты США" #NT!
 nd_sha.1.d: "Горные княжества Шаня наконец объединились под одним знаменем. На протяжении веков саубва, князья монгов, управляли своими владениями независимо, иногда воюя между собой, иногда объединяясь против внешних угроз. Теперь, от туманных долин Кенгтун до городов-крепостей Хсенви, народ Шан стоит как один.\n\nНо единство — это только начало. Вопрос, который эхом звучит в суде каждого сабвы, заключается в следующем: кем станут Соединенные Штаты Шана? Военная конфедерация, которая доминирует в горной местности с помощью силы оружия, как это когда-то сделал Монг Мао, когда разрушил королевства Иравади? Или великий торговый перекресток, позволяющий использовать положение Шанского плато между Китаем и Сиамом для создания богатства и влияния, с которыми не сможет сравниться ни одна армия?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sha.1.a: "Мы наследники Монг Мао. Пусть наши враги трепещут." #NT!
 nd_sha.1.b: "Наше плато соединяет империи. Пусть торговля будет нашей силой." #NT!
 nd_sha.2.t: "Конфедерация восстает" #NT!
 nd_sha.2.d: "Дух великой Шанской конфедерации вновь пробуждается. В 1527 году Савлон, наследник королевской линии Монг Мао, возглавил коалицию Шань Монг против ослабленного королевства Ава. Раздоры бирманского двора, раздираемые внутренним соперничеством, не могли противостоять объединенной горской кавалерии. Ава пала, и в течение почти трех десятилетий Шанская конфедерация управляла Верхней Бирмой с самого трона своих бывших повелителей.\n\nТеперь Шанская конфедерация стоит перед выбором, который эхом отдается сквозь века. Должны ли мы чтить военные традиции, которые привели наших предков к воротам Авы, сохраняя кавалерийские войска и воинскую культуру, которые наводили страх на шанов по всей долине Иравади? Или нам стоит опираться на политическую мудрость системы советов савбва, управляя посредством консенсуса и дипломатии, как это делали наши предки в своих горных владениях?" #NT!
 nd_sha.2.a: "Наточите дха и оседлайте лошадей. Мы ездим так, как делали наши предки." #NT!
 nd_sha.2.b: "Совет саубвас должен рассмотреть вопрос. Сила приходит от единства." #NT!
 nd_sha.3.t: "Караваны Кенгтуна" #NT!
 nd_sha.3.d: "Кенгтунг стал одним из крупнейших торговых перекрестков материковой Юго-Восточной Азии. Ежегодно около восьми тысяч мулов, нагруженных товарами из южного Китая, пересекают высокогорные перевалы, перевозя камфару, финики, шелк, чай и грецкие орехи на юг, в Сиам. Они возвращаются на север, нагруженные хлопком, лаковыми изделиями, драгоценными металлами и табаком.\n\nЮньнаньские купцы, возглавляющие эти караваны, стали знакомыми фигурами в каждом торговом городе Шаня. Некоторым нравятся такие близкие отношения с местными саубва, что они остаются в самом дворце во время своих визитов. Китайские торговцы поселились на постоянной основе в городах Шаня, и мусульмане Пантай среди них стали отличительной частью многоэтнического гобелена горной местности. Богатство, протекающее по этим маршрутам, обогащает каждого человека, к которому они прикасаются." #NT!
 nd_sha.3.a: "Горные дороги – артерии нашего процветания." #NT!
 nd_sha.4.t: "Шанское национальное пробуждение" #NT!
 nd_sha.4.d: "Новое сознание пробуждается среди народа Шан. На протяжении поколений саубва управляли своими отдельными монгами, мало задумываясь об общей шанской идентичности, выходящей за рамки языка и веры. Но по мере наступления современного мира с его национальными государствами и требованиями централизованной власти, шань начали рассматривать себя не просто как подданных того или иного саубва, но как народ с общим наследием, общей буддийской верой и правом определять свою собственную судьбу.\n\nУченые собирают старые хроники. Поэты сочиняют шанским письмом. В монастырях монахи преподают не только Дхарму, но и историю великой конфедерации Монг Мао и славные дни, когда Шан правил из самой Авы. Это пробуждение — больше, чем ностальгия; это заявление о том, что народ Шан намерен оставаться хозяевами своего горного дома." #NT!
 nd_sha.4.a: "Дух Шана сохранится в этих горах." #NT!
 nd_sha_tai_highland_warfare: "Тай Хайленд Война" #NT!
 nd_sha_tai_highland_warfare_desc: "Народы тай, заселившие Шанское нагорье, принесли с собой традиции конной войны, адаптированные к горной местности. В отличие от равнинной конницы, которая полагалась на скорость передвижения по открытым равнинам, шанские всадники научились преодолевать крутые перевалы и узкие долины." #NT!
 nd_sha_highland_irrigation: "Хайленд Ирригация" #NT!
 nd_sha_highland_irrigation_desc: "Шанцы вырезали рисовые террасы на горных склонах, направляя горные потоки через хитроумные ирригационные системы для поддержания своих поселений в долинах." #NT!
 nd_sha_mong_system: "Система Монг" #NT!
 nd_sha_mong_system_desc: "Политической единицей мира Шан является монг: княжество, сосредоточенное в долине и окружающем ее нагорье, которым управляет саубва. Эта децентрализованная система позволяла шанам управлять разнообразным населением на труднопроходимой местности." #NT!
 nd_sha_theravada_foundations: "Фонды Тхеравады" #NT!
 nd_sha_theravada_foundations_desc: "Буддизм Тхеравады глубоко укоренился среди народа Шан, смешавшись с более древними анимистическими традициями поклонения духам. В каждом моге монастыри становились центрами обучения и общественной жизни." #NT!
 nd_sha_mong_mao_legacy: "Наследие Монг Мао" #NT!
 nd_sha_mong_mao_legacy_desc: "Память о Монг Мао, великой федерации Тай, которая разрушила королевства Сагаин и Пинья в 1364 году, остается определяющей военной традицией Шанского нагорья." #NT!
 nd_sha_silver_craft: "Шан Сильвер Крафт" #NT!
 nd_sha_silver_craft_desc: "Шанские серебряные мастера известны во всей Юго-Восточной Азии своими замысловатыми узорами. Серебряные чаши, украшения и обрядовые предметы, украшенные буддийскими мотивами, производятся в мастерских по всему высокогорью." #NT!
 nd_sha_dha_warriors_tradition: "Воины Дха" #NT!
 nd_sha_dha_warriors_tradition_desc: "Дха, однолезвийный меч Шаня, является одновременно инструментом и оружием. Воины Дха, с юности обучавшиеся горным боевым искусствам, составляли костяк армий саубва во время великих кампаний Конфедерации." #NT!
 nd_sha_sawbwa_courts: "Суды Савбвы" #NT!
 nd_sha_sawbwa_courts_desc: "Хау, или дворец савбвы, является политическим и культурным центром каждого монга. Здесь князь вершит суд, отправляет правосудие и получает дань как от своих подданных, так и от приезжих купцов." #NT!
 nd_sha_shan_monasticism: "Шанское монашество" #NT!
 nd_sha_shan_monasticism_desc: "Шанские буддийские монастыри, кьяунг, служат школами, общественными центрами и хранилищами знаний. Отличительная монашеская архитектура Шана отражает влияние как бирманцев, так и лан-на-тай." #NT!
 nd_sha_caravan_crossroads: "Караван Перекресток" #NT!
 nd_sha_caravan_crossroads_desc: "Шанское нагорье расположено по обе стороны древних торговых путей, соединяющих Юньнань с Сиамом. Вдоль этих маршрутов возникли караванные стоянки и торговые города, превратившие монгов в торговые центры." #NT!
 nd_sha_multi_ethnic_governance: "Многоэтническое управление" #NT!
 nd_sha_multi_ethnic_governance_desc: "Шаньмонги никогда не были этнически однородными. Палаунг, Па-О, Качин, Ва, Лису и многие другие народы жили под властью савбвы. Управление этой мозаикой требовало терпимости и прагматизма, которые стали отличительной чертой шансского государственного управления." #NT!
 nd_sha_shan_confederation: "Шанская Конфедерация" #NT!
 nd_sha_shan_confederation_desc: "В 1527 году Савлон возглавил коалицию Шанмонгов, захватившую королевство Ава. Почти три десятилетия Конфедерация шанских государств управляла Верхней Бирмой, самой мощной политической силой в долине Иравади." #NT!
 nd_sha_sawbwa_patronage: "Патронаж Савбвы" #NT!
 nd_sha_sawbwa_patronage_desc: "Более богатые саубва стали великими покровителями буддийского искусства и архитектуры, построив элегантные монастыри и создав характерные изображения Будды в шанском стиле, характеризующиеся своей высокой и стройной грацией." #NT!
 nd_sha_elephant_warfare: "Слоновья война" #NT!
 nd_sha_elephant_warfare_desc: "Шанские саубва содержали боевых слонов как символы королевской власти и орудия войны. Бронированные слоны-охранники составляли тяжелый ударный элемент шансских армий, наводя ужас на противников в узких горных долинах." #NT!
 nd_sha_textile_mastery: "Шанское текстильное мастерство" #NT!
 nd_sha_textile_mastery_desc: "Ткачи Шаня производили ткани, известные во всей Юго-Восточной Азии своими яркими цветами и замысловатыми узорами. Это ремесло достигло своего апогея с развитием шелка лотоса: чрезвычайно трудоемкой ткани, сотканной из волокон стеблей растения лотоса." #NT!
 nd_sha_plateau_mining: "Плато Горное дело" #NT!
 nd_sha_plateau_mining_desc: "Плато Шан хранило огромные минеральные богатства: рубины и сапфиры на севере, серебро и свинец в земле внизу. Горнодобывающие предприятия, хотя и небольшие по масштабам, производили драгоценные камни и металлы, которые обогащали дворы саубва." #NT!
 nd_sha_mong_cavalry_tradition: "Кавалерийские традиции Монг" #NT!
 nd_sha_mong_cavalry_tradition_desc: "Тяжелая кавалерия конфедеративных монгов представляла собой элитную ударную силу шансских армий. Набранные из знатных семей каждого княжества, эти всадники сочетали в себе подвижность степных традиций со знанием горной местности." #NT!
 nd_sha_kengtung_crossroads: "Кенгтун Перекресток" #NT!
 nd_sha_kengtung_crossroads_desc: "Кенгтун стал первым пунктом назначения на территории Шаня для караванов, идущих из южного Китая. Оттуда маршруты разветвлялись на юг, в сторону Сиама. Ежегодно через него проезжало восемь тысяч мулов, перевозивших торговлю империй." #NT!
 nd_sha_shan_buddhist_art: "Шаньское буддийское искусство" #NT!
 nd_sha_shan_buddhist_art_desc: "Шань разработала особую школу буддийского искусства. Их изображения Будды (высокие, стройные и изящные, с вытянутыми линиями и ощущением невесомости) отражали как мон-бирманские традиции, так и эстетику Лан На Тай." #NT!
 nd_sha_highland_defense: "Доктрина обороны Хайленда" #NT!
 nd_sha_highland_defense_desc: "Гористая местность Шанского нагорья обеспечивала естественную защиту, которую поколения сабов научились использовать. Армии вторжения обнаружили, что их линии снабжения растянуты через трудные горные перевалы." #NT!
 nd_sha_highland_autonomy: "Хайлендская автономия" #NT!
 nd_sha_highland_autonomy_desc: "Даже под сюзеренитетом Бирмы Шанский сауб сохранял значительную автономию. Удаленность и сложность горной местности сделали прямое правление непрактичным, сохраняя систему монгов на протяжении веков номинального подчинения." #NT!
 nd_sha_lacquerware_tradition: "Шань Лаковые изделия" #NT!
 nd_sha_lacquerware_tradition_desc: "Шанская традиция лакирования производила функциональные и декоративные предметы невероятной красоты. Ремесленники наносили несколько слоев лака на бамбуковые или деревянные основы, создавая сосуды и контейнеры, которые ценятся во всем регионе." #NT!
 nd_sha_gemstone_commerce: "Торговля драгоценными камнями" #NT!
 nd_sha_gemstone_commerce_desc: "Рубины и сапфиры Шанского плато вошли в расширяющиеся мировые торговые сети. Драгоценные камни, добытые в высокогорье, попали в суды и на рынки от Индии до Китая." #NT!
 nd_sha_religious_scholarship: "Религиозная стипендия" #NT!
 nd_sha_religious_scholarship_desc: "Шанские монастыри стали центрами буддийской науки Тхеравады. Монахи сохраняли и изучали палийский канон, а также вели хроники истории Шаня и генеалогии линий саубва." #NT!
 nd_sha_border_diplomacy: "Пограничная дипломатия" #NT!
 nd_sha_border_diplomacy_desc: "Находясь между великими державами Бирмы, Китая и Сиама, Шанские саубвы стали мастерами пограничной дипломатии, платя дань одновременно нескольким повелителям, натравливая соперников друг против друга." #NT!
 nd_sha_shan_law_codification: "Кодификация Шанского права" #NT!
 nd_sha_shan_law_codification_desc: "Обычные законы, регулирующие жизнь в монгах, были собраны и систематизированы, установив стандартизированные правовые принципы во всем Шанском нагорье. Эти законы регулировали наследование, землевладение и обязательства между савбвой и подданными." #NT!
 nd_sha_plateau_musketeers: "Плато Мушкетеров" #NT!
 nd_sha_plateau_musketeers_desc: "Огнестрельное оружие попадало в Шанское нагорье по караванным путям из Китая и через контакты с европейскими торговцами. Шанские воины приспособили мушкеты для ведения войны в горах, используя местность для укрытия и засад." #NT!
 nd_sha_reformed_administration: "Реформированная администрация" #NT!
 nd_sha_reformed_administration_desc: "По мере модернизации мира дальновидные саубва начали реформировать администрацию своих монгов. Письменные записи заменили устные традиции, и появились более систематические структуры налогообложения и управления." #NT!
 nd_sha_renewed_independence: "Обновленная независимость" #NT!
 nd_sha_renewed_independence_desc: "В периоды ослабления центральной власти Бирмы шаньмонги воспользовались возможностью восстановить свою независимость. Горную местность всегда было легче удержать, чем завоевать." #NT!
 nd_sha_shan_court_culture: "Шаньский двор Культура" #NT!
 nd_sha_shan_court_culture_desc: "Дворы более богатых саубов стали центрами утонченной культуры. Музыка, танцы, поэзия и изобразительное искусство процветали под покровительством князя, сочетая в себе влияние Шаня, Бирмы и Таиланда." #NT!
 nd_sha_highland_fortifications: "Хайлендские укрепления" #NT!
 nd_sha_highland_fortifications_desc: "Шанцы усилили свою естественную горную оборону построенными укреплениями. Частоколы, сторожевые башни и укрепленные перевалы превратили высокогорье в грозную оборонительную сеть." #NT!
 nd_sha_tea_trade: "Хайленд Чай Трейд" #NT!
 nd_sha_tea_trade_desc: "Прохладные, туманные высокогорья оказались идеальными для выращивания чая. Шанский чай, обработанный традиционными методами и продаваемый через караванные сети, стал важным источником дохода." #NT!
 nd_sha_federal_assembly: "Федеральное Собрание" #NT!
 nd_sha_federal_assembly_desc: "Опираясь на многовековую традицию советов савбва, народ Шан перешел к более формальному федеральному собранию. Представители каждого мона встретились, чтобы обсудить вопросы, затрагивающие все Шанские государства." #NT!
 nd_sha_modernized_mining: "Модернизированная горная промышленность" #NT!
 nd_sha_modernized_mining_desc: "Новые методы и инструменты преобразили древние рудники Шанского плато. В частности, рудник Бодуин стал одним из крупнейших в мире источников серебра и свинца." #NT!
 nd_sha_shan_printing: "Шаньская печать" #NT!
 nd_sha_shan_printing_desc: "Внедрение технологии печати позволило более широко распространить буддийские тексты, хроники и правовые кодексы, написанные шанским письмом. Грамотность распространилась за пределы монастырей среди широких слоев населения." #NT!
 nd_sha_commercial_modernization: "Коммерческая модернизация" #NT!
 nd_sha_commercial_modernization_desc: "Древние караванные пути были дополнены современной торговой инфраструктурой. Рыночные города расширялись, в торговые сети поступали новые товары, и экономика Шаня начала свою трансформацию." #NT!
 nd_sha_highland_defense_reform: "Реформа обороны Хайленда" #NT!
 nd_sha_highland_defense_reform_desc: "Военные реформы модернизировали Шанские вооруженные силы, сохранив при этом их опыт ведения войны в горах. Дисциплинированная пехота, обученная современной тактике, дополняла традиционную кавалерию." #NT!
 nd_sha_national_awakening: "Национальное пробуждение" #NT!
 nd_sha_national_awakening_desc: "Общая идентичность Шана кристаллизовалась среди монгов. Ученые, монахи и поэты сформулировали видение народа Шан как нации с общим наследием, буддийской верой и правом на самоопределение." #NT!
 a_nd_sha_highland_cavalry: "Шанская горная кавалерия" #NT!
 a_nd_sha_highland_cavalry_desc: "Горные всадники, обученные на высокогорных перевалах плато Шан, могут перемещаться по местности, которая могла бы остановить низинную кавалерию." #NT!
 a_nd_sha_dha_warriors: "Воины Дха" #NT!
 a_nd_sha_dha_warriors_desc: "Элитные фехтовальщики, владеющие традиционным Шандха, однолезвийным клинком, в ближнем бою. Их яростные атаки сломили защитников Авы." #NT!
 a_nd_sha_elephant_guard: "Слоновья гвардия Савбвы" #NT!
 a_nd_sha_elephant_guard_desc: "Боевые слоны содержатся судами саубва как символы королевской власти и орудия войны. Их атака в узких горных долинах была разрушительной." #NT!
 a_nd_sha_mong_cavalry: "Монгская кавалерия" #NT!
 a_nd_sha_mong_cavalry_desc: "Тяжелая кавалерия, набранная из благородных семей конфедеративных монгов. Эти всадники составляли решающую ударную силу объединенных шанских армий." #NT!
 a_nd_sha_plateau_musketeers: "Плато Мушкетеров" #NT!
 a_nd_sha_plateau_musketeers_desc: "Шанские воины обучались обращению с огнестрельным оружием, приобретенным по торговым путям Китай-Сиам. Они приспособили мушкеты для ведения войны в горах, используя высокогорную местность для укрытия и засад." #NT!
 nd_sha_haw: "Хау" #NT!
 nd_sha_haw_desc: "Дворец шанского савбвы, служащий политическим и культурным центром монгов. Здесь князь вершит суд, вершит правосудие и управляет делами своего княжества." #NT!
 nd_sha_kyaung: "Шан Кьяунг" #NT!
 nd_sha_kyaung_desc: "Буддийский монастырь в характерном шанском архитектурном стиле, сочетающем в себе влияние Мон-Бирмы и Лан-На-Тай. Служит центром обучения, поклонения и общественной жизни." #NT!
 nd_sha_caravan_halt: "Остановка каравана" #NT!
 nd_sha_caravan_halt_desc: "Остановка для отдыха и торговый пост на высокогорных караванных путях, соединяющих Китай и Сиам. Торговцы находят убежище, продовольствие и рынок для своих товаров." #NT!
 nd_sha_silverworks: "Шанский серебряный завод" #NT!
 nd_sha_silverworks_desc: "Мастерская, где серебряные мастера Шаня производят замысловатые серебряные чаши, украшения и церемониальные предметы, которыми славится высокогорье." #NT!
 nd_sha_terrace_fields: "Террасные поля" #NT!
 nd_sha_terrace_fields_desc: "Орошаемые рисовые террасы, высеченные на горных склонах, направляют горные ручьи для поддержания сельского хозяйства на пересеченной местности Шанского плато." #NT!
 nd_sha_weaving_workshop: "Шаньская ткацкая мастерская" #NT!
 nd_sha_weaving_workshop_desc: "Мастерская, производящая яркие ткани и редкий лотосовый шелк, которыми славятся ткачи Шаня во всей Юго-Восточной Азии." #NT!
 nd_sha_gemstone_mine: "Драгоценный рудник" #NT!
 nd_sha_gemstone_mine_desc: "Горнодобывающая операция по добыче рубинов, сапфиров и других драгоценных камней, найденных в богатой минералами земле плато Шан." #NT!
 nd_sha_haw_upkeep: "Содержание дворца" #NT!
 nd_sha_haw_upkeep_desc: "Шелковые драпировки, фарфоровые сосуды и другая мебель поддерживают достоинство двора саубвы." #NT!
 nd_sha_kyaung_upkeep: "Монашеское содержание" #NT!
 nd_sha_kyaung_upkeep_desc: "Бумага для буддийских текстов и пчелиный воск для свечей поддерживают религиозные функции монастыря." #NT!
 nd_sha_caravan_halt_upkeep: "Остановить техническое обслуживание" #NT!
 nd_sha_caravan_halt_upkeep_desc: "Корм для вьючных животных и древесина для ремонта обеспечивают работоспособность стоянки караванов." #NT!
 nd_sha_silverworks_upkeep: "Серебряное дело" #NT!
 nd_sha_silverworks_upkeep_desc: "Шанские серебряные мастера обрабатывают серебро и медь замысловатыми украшениями, чашами и церемониальными предметами, известными во всей Юго-Восточной Азии." #NT!
 nd_sha_terrace_upkeep: "Выращивание риса" #NT!
 nd_sha_terrace_upkeep_desc: "Орошаемые террасы, высеченные на горных склонах, производят рис, поддерживаемый деревянными каналами, которые направляют горные ручьи к рисовым полям." #NT!
 nd_sha_weaving_upkeep: "Шелковое Ткачество" #NT!
 nd_sha_weaving_upkeep_desc: "Ткачи Шаня превращают шелковую нить и яркие красители в прекрасные ткани, прославившиеся во всей Юго-Восточной Азии своими замысловатыми узорами." #NT!
 nd_sha_mine_upkeep: "Добыча драгоценных камней" #NT!
 nd_sha_mine_upkeep_desc: "Шахтеры добывают рубины и сапфиры из богатой минералами земли, используя деревянные опоры и инструменты для разработки горных месторождений." #NT!
 nd_sha_lacquerware_pm: "Шань Лаковые изделия" #NT!
 nd_sha_lacquerware_pm_desc: "Изготовление лакированных изделий из бамбука и дерева в традиционных шанских техниках. Несколько слоев лака создают прочные и красивые изделия." #NT!
 nd_sha_tea_processing_pm: "Переработка Хайлендского чая" #NT!
 nd_sha_tea_processing_pm_desc: "Чайные кусты, выращиваемые в прохладных высокогорьях Шаня, собирают и обрабатывают традиционными методами, производя готовый чай на экспорт через караванные сети." #NT!
 levy_nd_sha_mong_cavalry: "Монг Кавалерийский Леви" #NT!
 levy_nd_sha_mong_cavalry_desc: "Тяжелая кавалерия, набранная из благородных семей конфедеративных монгов, отвечает на призыв саубва к оружию." #NT!
 levy_nd_sha_highland_cavalry: "Набор горной кавалерии" #NT!
 levy_nd_sha_highland_cavalry_desc: "Горные всадники из горных общин Шаня, владеющие навыками навигации по труднопроходимой местности." #NT!
 nd_sha_highland_stockade: "Хайлендский частокол" #NT!
 nd_sha_highland_stockade_desc: "Деревянное укрепление, защищающее ключевые горные перевалы Шанского нагорья. Сторожевые башни и частоколы направляли захватчиков на места убийства." #NT!
 nd_sha_stockade_upkeep: "Обслуживание частокола" #NT!
 nd_sha_stockade_upkeep_desc: "Древесина и камень для ремонта и укрепления частокола и земляных валов высокогорного частокола." #NT!
 nd_sha_diplomatic_gifts_pm: "Дипломатический обмен подарками" #NT!
 nd_sha_diplomatic_gifts_pm_desc: "Традиция обмена дарами в виде шелка и серебра с соседними державами для поддержания хрупкого баланса горской дипломатии." #NT!
 nd_sha_court_entertainments_pm: "Придворные развлечения" #NT!
 nd_sha_court_entertainments_pm_desc: "Музыка, танцы и театральные представления, украшающие дворы богатых савбва, сочетают в себе шанские, бирманские и тайские художественные традиции." #NT!
 nd_sha_modern_commerce_pm: "Современная коммерция" #NT!
 nd_sha_modern_commerce_pm_desc: "Модернизированная торговая инфраструктура и методы бухгалтерского учета превращают древние караванные пути в эффективные торговые сети." #NT!
 nd_sha_fortification_pm: "Обслуживание укреплений" #NT!
 nd_sha_fortification_pm_desc: "Древесина и оружие для поддержания горной оборонительной сети частоколов, сторожевых вышек и укрепленных перевалов." #NT!
 nd_sha_legal_admin_pm: "Юридическое управление" #NT!
 nd_sha_legal_admin_pm_desc: "Писцы и судебные чиновники, которые поддерживают кодифицированное обычное право Шаня, записывая судебные решения и прецеденты." #NT!
 nd_sha_river_trade: "Речные торговые пути" #NT!
 nd_sha_river_trade_desc: "Реки, протекавшие через Шанское нагорье, служили ранними торговыми артериями, соединяя горные общины с низинными рынками долины Иравади." #NT!
 nd_sha_formed_tt: "были образованы Шанские государства." #NT!
 nd_sha_path_a_tt: "Выбрал Конфедерацию Меча" #NT!
 nd_sha_path_b_tt: "Выбрал перекресток плато" #NT!
 nd_sha_destiny: "Судьба Шанских государств" #NT!
 nd_sha_destiny_desc: "Шанские княжества наконец-то объединились. Стабильность в высокогорье знаменует собой начало больших амбиций, но путь вперед зависит от уже сделанного выбора." #NT!
 nd_sha_dest_seize_pinya: "Схватить Пиню" #NT!
 nd_sha_dest_seize_pinya_desc: "Королевство Пинья перешло к Шанской конфедерации в 1527 году, когда кавалерия Савлона устремилась с высокогорья. Чтобы пойти по его стопам, покорите Пинья и Сагаинг, столицы-близнецы Верхней Бирмы." #NT!
 nd_sha_dest_march_on_pagan: "Марш на Пэган" #NT!
 nd_sha_dest_march_on_pagan_desc: "Пэган, место древней бирманской славы, должен признать превосходство Шаня. Идите на юг, чтобы заявить права на сердце Иравади и продемонстрировать, что горная конфедерация является доминирующей силой в материковой части Юго-Восточной Азии." #NT!
 nd_sha_dest_lord_irrawaddy: "Лорд Иравади" #NT!
 nd_sha_dest_lord_irrawaddy_desc: "Конечная цель Шанской конфедерации: господство над всей Бирмой от горной границы до прибрежных портов. Захватите Пегу, Мартабан и Таунгу, чтобы контролировать всю долину Иравади и проходящие через нее торговые пути." #NT!
 nd_sha_dest_highland_commerce: "Хайленд Коммерс" #NT!
 nd_sha_dest_highland_commerce_desc: "Плато Шан находится на перекрестке цивилизаций. Развивайте торговлю горным чаем и накапливайте богатство, необходимое для превращения монгов из изолированных княжеств в процветающую коммерческую сеть." #NT!
 nd_sha_dest_lanna_link: "Лан На Ссылка" #NT!
 nd_sha_dest_lanna_link_desc: "Чиангмай, сердце королевства Лан На, является естественной южной конечной точкой горных караванных маршрутов. Перенесите его в сферу Шан и используйте современное банковское дело для финансирования расширения торговли по всему плато." #NT!
 nd_sha_dest_jewel_highlands: "Жемчужина высокогорья" #NT!
 nd_sha_dest_jewel_highlands_desc: "На плато Шан производят лучшие рубины и сапфиры в Азии, а его положение между Китаем и Сиамом дает ему доступ к шелку обеих империй. Постройте коммерческое царство такого богатства и развития, что горные монги станут предметом зависти материка." #NT!
 nd_sha.5.t: "Судьба начинается" #NT!
 nd_sha.5.d: "Разрозненные монги на плато Шан наконец обрели свое единство. Если когда-то каждый савбва смотрел только на свою долину и свои интересы, то теперь все стоят вместе под одним знаменем. Вопрос больше не в том, смогут ли Шань объединиться, а в том, что они будут делать со своей вновь обретенной силой.\n\nПеред нами простираются высокогорья: царство туманных долин, нефритовых рек и горных перевалов, соединяющих великие цивилизации мира. То, что мы построим на этом плато, запомнится поколениям." #NT!
 nd_sha.5.a: "Государства Шан выстоят." #NT!
 nd_sha.6.t: "Падение Пиньи" #NT!
 nd_sha.6.d: "Древние стены Пиньи пали под руками Шаня. Подобно тому, как в 1527 году кавалерия Савлона устремилась с высокогорья, чтобы разрушить враждующий бирманский двор, так и наши войска доказали, что горная конфедерация является истинным хозяином Верхней Бирмы. Столицы-близнецы Пинья и Сагаинг теперь несут знамя Соединенных Штатов Шан.\n\nБирманская знать, которая когда-то смотрела на горные народы с презрением, теперь преклоняет колени перед нашей савбвой. Перед нами открыта долина Иравади." #NT!
 nd_sha.6.a: "Как Савлон победил, так и мы." #NT!
 nd_sha.7.t: "Язычество под властью Шаня" #NT!
 nd_sha.7.d: "Древние храмы Пагана стоят в тени Шанских знамен. Этот город, когда-то являвшийся сердцем великой бирманской империи, теперь подчиняется горной конфедерации. Наши армии шли туда, куда ступали только самые могущественные завоеватели.\n\nНо править язычником — это не то же самое, что завоевывать его. Вопрос теперь в том, как мы удержим то, что взяли. Должны ли мы разместить гарнизон в этом древнем городе и восстановить то, что разрушила война, установив постоянную власть Шана над сердцем Иравади? Или мы возьмем то богатство, которое предлагает Пэган, и продолжим двигаться вперед, используя импульс победы для дальнейшего завоевания?" #NT!
 nd_sha.7.a: "Укрепите город гарнизоном и восстановите порядок." #NT!
 nd_sha.7.b: "Возьмите добычу и идите вперед." #NT!
 nd_sha.8.t: "Лорд Иравади" #NT!
 nd_sha.8.d: "От туманных горных перевалов до тропического побережья долина Иравади подчиняется власти Шаня. Пегу, Мартабан, Таунгу — великие города Нижней Бирмы — все были взяты под знамя конфедерации. Мы достигли того, о чем древний Шан Монг Мао мог только мечтать.\n\nТеперь возникает вопрос, который формирует империи: как мы будем управлять этой огромной территорией? Централизованная горная империя управлялась с единого трона, а сауб служили губернаторами провинций под королевским командованием? Или федерация монгов, каждый из которых сохранит свою автономию, но связан договором и общими целями с большим государством Шан?" #NT!
 nd_sha.8.a: "Один трон, одно царство: империя Шан восходит." #NT!
 nd_sha.8.b: "Федерация свободных монгов: вместе сильнее." #NT!
 nd_sha.9.t: "Караваны прибывают" #NT!
 nd_sha.9.d: "Первый большой караван сезона прибыл на высокогорные рынки. Мулы, нагруженные китайским чаем и шелком, спускаются через горные перевалы, а торговцы из южных низменностей привозят в обмен хлопок, соль и изделия из металла. Богатство империй течет через наши долины.\n\nСабы мудро инвестировали в рыночную инфраструктуру, остановки караванов и торговые соглашения. Чайные сады на горных склонах теперь производят достаточно, чтобы снабжать торговцев, доставляющих товары Шана до дворов Аюттхая. Торговля — это источник жизненной силы плато." #NT!
 nd_sha.9.a: "Торговые пути – наше сокровище." #NT!
 nd_sha.10.t: "Связь с Чиангмаем" #NT!
 nd_sha.10.d: "Чиангмай, жемчужина королевства Лан На, теперь связан с коммерческой сетью Шаня. Караванные пути, которые когда-то заканчивались на высокогорной границе, теперь простираются глубоко в низменность Тай, соединяя китайские товары с сиамскими рынками через плато Шан. Банковские дома открылись в крупных городах, и объем торговли резко возрос.\n\nНо как следует управлять этой расширенной сетью? Некоторые саубвы выступают за королевскую монополию, контролирующую потоки товаров, чтобы максимизировать долю казны. Другие выступают за свободное открытие рынков, полагая, что возникающий в результате бум в торговле обогатит всех." #NT!
 nd_sha.10.a: "Корона будет контролировать караваны." #NT!
 nd_sha.10.b: "Пусть все торговцы торгуют свободно." #NT!
 nd_sha.11.t: "Жемчужина высокогорья" #NT!
 nd_sha.11.d: "Плато Шан стало одним из крупнейших торговых центров Азии. Рубины и сапфиры, добытые в высокогорных землях, привлекают покупателей из Индии, Китая и других стран. Шелк двух империй проходит через наши рынки, обогащается и реэкспортируется с наценкой. Развитие городов-монгов соперничает с развитием низинных столиц.\n\nБогатство горной местности привлекло внимание всего мира. Должны ли мы принять на себя роль королей драгоценных камней Азии, инвестируя наши минеральные богатства в культурный престиж и связанную с ним безопасность? Или нам следует превратить плато в огромный торговый центр: торговый центр, где встречаются товары всех стран?" #NT!
 nd_sha.11.a: "Мы – короли драгоценных камней Азии." #NT!
 nd_sha.11.b: "Плато станет торговым центром наций." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_pagan_garrison: "Гарнизон Пэгана" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_pagan_garrison: "Солдаты Шан поддерживают порядок в древней бирманской столице, восстанавливая то, что было разрушено войной, и устанавливая постоянную власть в горах." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_pagan_plunder: "Трофеи Пагана" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_pagan_plunder: "Богатство древнего Язычества подпитывает военную машину конфедерации Шан, поскольку сокровища текут на север, чтобы вооружить новые армии для дальнейших завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_highland_imperium: "Хайленд Империум" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_highland_imperium: "Централизованная империя Шан правила с единого трона, при этом саубвы выступали в качестве лояльных губернаторов провинций под верховной властью горного суда." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_federation_of_mong: "Федерация Монг" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_federation_of_mong: "Децентрализованная конфедерация свободных монгов, каждая из которых сохраняет свою автономию, но связана договором и общими целями. Дипломатия и интеллект, а не грубая сила, скрепляют федерацию." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_caravan_monopoly: "Караван Монополия" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_caravan_monopoly: "Корона контролирует горные караванные маршруты, получая максимальный доход от каждого поезда мулов, проходящего через территорию Шаня." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_open_markets: "Открытые рынки" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_open_markets: "Шанские рынки открыты для всех желающих. Купцы из Китая, Сиама, Индии и других стран свободно общаются друг с другом, и вызванный этим бум в торговле обогащает каждого мона." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_gem_kings: "Короли драгоценных камней Азии" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_gem_kings: "Минеральные богатства Шанского плато сделали горных савбов самыми богатыми князьями в материковой части Юго-Восточной Азии. Рубины, сапфиры и серебро текут из рудников Шана во дворы мира." #NT!
 STATIC_MODIFIER_NAME_nd_sha_dest_plateau_emporium: "Торговый центр Плато" #NT!
 STATIC_MODIFIER_DESC_nd_sha_dest_plateau_emporium: "Плато Шан стало великим местом встречи азиатской торговли. Товары из Китая, Индии и Сиама сходятся на горных рынках, конкурирующих с прибрежными перевалочными пунктами." #NT!
 nd_sha_war_pavilion: "Военный павильон" #NT!
 nd_sha_war_pavilion_desc: "Горный командный центр, из которого савбва руководит своими армиями Конфедерации. Сторожевые башни обследуют горные перевалы, а арсеналы и казармы готовы к следующей кампании." #NT!
 nd_sha_war_pavilion_upkeep: "Содержание павильона" #NT!
 nd_sha_war_pavilion_upkeep_desc: "Оружие, древесина и кожа для содержания высокогорного военного павильона и его гарнизона из шанских солдат." #NT!
 nd_sha_gem_exchange: "Обмен драгоценных камней" #NT!
 nd_sha_gem_exchange_desc: "Официальный торговый дом, где рубины, сапфиры и другие драгоценные камни из Шанских рудников сортируются, оцениваются и продаются торговцам со всей Азии." #NT!
 nd_sha_gem_exchange_upkeep: "Обменные операции" #NT!
 nd_sha_gem_exchange_upkeep_desc: "Бумага для бухгалтерских книг, драгоценные камни для демонстрации и серебро для транзакций поддерживают работу горной биржи драгоценных камней." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_sha_bureaucracy_authority: "Учреждения Шан Монг" #NT!
 AUTO_MODIFIER_DESC_nd_sha_bureaucracy_authority: "Соединенные Штаты Шан унаследовали институциональную структуру, сотканную столетиями правления саофа, советов саубва, покровительства сангхи и собраний муанг. Трон может учредить до двух великих шанских бюрократий в дополнение к тем, кто проживает в столице, выбирая, какая институциональная рука будет управлять горной местностью." #NT!
  
 sha_saopha_court_bureaucracy: "Хоу Саофы" #NT!
 sha_saopha_court_bureaucracy_desc: "Каждым Шаньмонгом управляет саофа (Тай «сао хпа», или Владыка Неба), чья власть исходит от небесного прародителя и чья личность связана с землей ритуальной клятвой, а не назначением какой-либо высшей силы. Саофа держит двор в хоу, обнесенном стеной дворце в центре своего княжества, в окружении министров-аматов, капелланов паньи и главной супруги маха-деви, чья родословная часто старше его собственной. Этот институт придает каждому княжеству сплоченность и достоинство, но каждая саофа является сувереном в миниатюре и сопротивляется подчинению чему-либо верховному." #NT!
  
 sha_sawbwa_council_bureaucracy: "Совет Савбвы" #NT!
 sha_sawbwa_council_bureaucracy_desc: "Периодическая конфедерация саоф под верховным правителем, засвидетельствованная при Монг Мао в четырнадцатом и начале пятнадцатого веков, когда Сао Хкун Хкам и его преемники привлекли окружающих монгов в подчиненную федерацию. Совет собирается для координации набора военных, разрешения межмонгульских споров и открытия объединенных посольств в Юньнани, Аве и Ланне. Каждый саофа присутствует лично (доверенные лица не допускаются), что поддерживает политическое участие каждого лорда, но не дает верховному власти власти свергать своих коллег." #NT!
  
 sha_pongyi_kyaung_bureaucracy: "Понгьи-Кьяунг Сангха" #NT!
 sha_pongyi_kyaung_bureaucracy_desc: "Сеть деревень и монастырей, через которую буддизм Тхеравады, пришедший в Шанское нагорье в четырнадцатом веке через контакты с Ланной и Бирмой, вытеснила старую религию духов Сатсана Пхи. Понги (старший монах) руководит кьяунгом в каждой деревне любого размера, обучая мальчиков читать палийскую и шанскую письменность, копируя рукописи и разрешая местные споры с помощью дхаммы. Королевское покровительство финансирует шведагоны и платформы рукоположения, обеспечивая самый высокий уровень грамотности среди мужчин в материковой части Юго-Восточной Азии, но обращение постепенно отталкивает анимистические народы холмов Ва, Палаунг и Лаху." #NT!
  
 sha_muang_irrigation_bureaucracy: "Ирригационная ассамблея Муанг" #NT!
 sha_muang_irrigation_bureaucracy_desc: "Муанг сам по себе представляет собой гидравлическую концепцию: государство Тай, определяемое его общими ирригационными сооружениями, плотинами Май-Фай и питающими каналами Лай-Муанг, которые орошают террасированные рисовые долины плато Шан. Собрание земледельцев кэн-муанг под руководством мастера по водоснабжению фай-муанг, избранного из числа деревенских глав, устанавливает календарь посадок, распределяет доли воды и набирает предмуссонную барщину для ремонта плотин. Система обеспечивает надежные излишки риса для поддержки хау и сангхи, но ограничивает возможности саофы по сбору сверх обычной доли." #NT!
