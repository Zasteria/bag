l_russian:
 STATIC_MODIFIER_NAME_nd_ukr_sich_republic: "Республика Сечь" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_sich_republic: "Рада высказалась. Малороссия будет управляться так, как задумали предки-казаки, путем свободного собрания воинов, где каждый будет иметь при себе саблю и голос. Сечевая традиция жива." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_breadbasket: "Хлебная корзина Европы" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_breadbasket: "Черная земля дарит свою щедрость. От Днепра до Днестра русинское зерно питает континент, а богатство урожая создает цивилизацию, которая выживет." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_cossack_autonomy: "Казачья автономия" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_cossack_autonomy: "Гетманщина стоит независимо. Казачье войско не подчиняется ни одному иностранному государю, а рада управляет так, как того требуют древние свободы." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_pereiaslav_compact: "Переяслав Компакт" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_pereiaslav_compact: "Благодаря союзу с великой державой Гетманщина защищает свои границы и получает доступ к ресурсам, которые ни одно приграничное государство не могло собрать в одиночку." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_orthodox_scholarship: "Православная стипендия" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_orthodox_scholarship: "Академия становится крепостью православного обучения, подготовки духовенства и ученых, защищающих веру разумом и эрудицией." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_western_learning: "Западное обучение" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_western_learning: "Приняв иезуитский метод и латинскую учебную программу, Академия соединяет Восток и Запад, привнося европейские знания в православный мир." #NT!
 nd_ukr.1.t: "Рождение Малороссии" #NT!
 nd_ukr.1.d: "Киев снова стал столицей русинского государства. От порогов Днепра до лесов Волыни разрозненные княжества и казачьи войска объединились под одним знаменем. Но что это будет за нация? Запорожская традиция призывает к созданию воинской республики, земли, где каждый казак равен в раде и где сабли Сечи охраняют границу от всех желающих. Однако чернозем обещает другое: это самая богатая почва в Европе, способная прокормить империи. Чем будет определяться Русь: саблей или плугом?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ukr.1.a: "Пусть правит Сечевая Рада. Мы прежде всего воины!" #NT!
 nd_ukr.1.b: "Черная земля будет нашим богатством и нашей судьбой." #NT!
 nd_ukr.2.t: "Хмельницкое восстание" #NT!
 nd_ukr.2.d: "Казачье войско восстало. При Богдане Хмельницком запорожские казаки разбили посланные для их подчинения войска, одерживая победу за победой при Желтых Водах, Корсуни и Пилявцах. Старый порядок разрушен. Впервые казачья Гетманщина управляет независимым государством в самом сердце Европы. Но этот триумф несет в себе вопрос, который будет звучать эхом в течение нескольких поколений: сможет ли Гетманщина выстоять в одиночку против окружающих ее империй, или она должна искать защиты у более великой державы? В Переяславе послы предлагают союз, который защитит границы, но свяжет судьбу нации с другим троном." #NT!
 nd_ukr.2.a: "Гетманщина устоит своими силами!" #NT!
 nd_ukr.2.b: "Подпишите договор. Наши границы нуждаются в гарантиях." #NT!
 nd_ukr.3.t: "Киево-Могилянская академия" #NT!
 nd_ukr.3.d: "В 1632 году митрополит Петр Могила превратил скромную братскую школу в нечто невиданное — первое православное высшее учебное заведение во всех восточнославянских землях. Взяв за образец иезуитские коллегии Польши, Могила создал учебную программу, сочетающую латинские знания с православным богословием. Библиотека Академии насчитывает восемь тысяч томов, почти все на латыни, открывая окно в западную философию, науку и литературу, которого раньше не предлагало ни одно православное учреждение. Выпускники продолжают возглавлять церкви, давать советы гетманам и распространять знания по всей Восточной Европе. Вопрос в том, чему будет служить это обучение: защите православной традиции или принятию западных инноваций?" #NT!
 nd_ukr.3.a: "Академия должна быть оплотом православной веры." #NT!
 nd_ukr.3.b: "Давайте поучимся у Запада и превзойдем их." #NT!
 nd_ukr.4.t: "Чайкинский флот" #NT!
 nd_ukr.4.d: "С днепровских порогов отправляется флот чайок — легких, быстрых лодок, вырезанных из цельных стволов деревьев и снабженных фальконетами. Каждый несет в себе пятьдесят воинов, обученных искусству морской засады. Эти казачьи налетчики стали грозой Черного моря, нанося удары по османским портам от Трабзона до Синопа и даже появляясь у стен самого Стамбула. В 1615 году восемьдесят чайк с четырьмя тысячами казаков переправились через Черное море и сожгли предместья османской столицы. Адмиралы султана, командующие галерами втрое большего размера, не могут поймать этих призраков, которые нападают на рассвете и исчезают с наступлением темноты." #NT!
 nd_ukr.4.a: "Черное море трепещет при виде наших парусов!" #NT!
 nd_ukr.5.t: "Золотой век Мазепы." #NT!
 nd_ukr.5.d: "При гетмане Иване Мазепе Гетманщина вступает в свой золотой век. Покровитель необыкновенного видения, Мазепа вкладывает деньги в церкви, монастыри и Киево-Могилянскую академию, число студентов в которой превышает две тысячи. Самобытная архитектура украинского барокко, яркая, красочная, дерзкая, возвышается над землей. Суды Гетманщины отправляют правосудие, ее типографии публикуют богословские и научные труды, а ее казачьи офицеры превращаются в культурную элиту, которая соперничает по утонченности с польской шляхтой. Это краткий, блестящий расцвет русинской цивилизации." #NT!
 nd_ukr.5.a: "Пусть этот золотой век продлится!" #NT!
 nd_ukr_ruthenian_principalities: "Русинские княжества" #NT!
 nd_ukr_ruthenian_principalities_desc: "Раздробленные русинские княжества (Галицкое, Волынское, Киевское) несут наследие Киевской Руси, сохраняя славянские традиции княжеского управления и междинастической дипломатии." #NT!
 nd_ukr_frontier_warriors: "Пограничные воины" #NT!
 nd_ukr_frontier_warriors_desc: "На степных границах русинские воины развивают навыки конного боя, которые на протяжении веков будут определять казачьи военные традиции." #NT!
 nd_ukr_black_earth: "Черная Земля" #NT!
 nd_ukr_black_earth_desc: "Чернозем, чернозем русинской степи — самая богатая сельскохозяйственная почва в Европе, способная давать урожаи, которые кормят целые империи." #NT!
 nd_ukr_kyivan_heritage: "Киевское наследие" #NT!
 nd_ukr_kyivan_heritage_desc: "Духовное наследие Крещения Руси и великих киевских церквей сохраняется, связывая русинские земли с их православной христианской идентичностью." #NT!
 nd_ukr_steppe_horsemanship: "Степное искусство верховой езды" #NT!
 nd_ukr_steppe_horsemanship_desc: "Русинские всадники перенимают технику верховой езды степных кочевников, выращивают выносливых скакунов и тренируют легкую кавалерию, способную преодолевать большие расстояния по лугам." #NT!
 nd_ukr_sich_democracy: "Сечевая демократия" #NT!
 nd_ukr_sich_democracy_desc: "Запорожская Сечь развивает уникальную в Европе военную демократию, республику воинов, где общее собрание избирает всех офицеров и самого гетмана." #NT!
 nd_ukr_chumak_routes: "Чумакские маршруты" #NT!
 nd_ukr_chumak_routes_desc: "Чумаки, странствующие казачьи торговцы, гоняют по степи свои повозки, запряженные волами, везя соль из Крыма и зерно из внутренних районов по налаженным торговым коридорам." #NT!
 nd_ukr_rada_tradition: "Рада Традиция" #NT!
 nd_ukr_rada_tradition_desc: "Казачья рада, общий военный совет, создает прецеденты коллективного принятия решений, которые сдерживают даже самых могущественных гетманов." #NT!
 nd_ukr_kuren_system: "Система Курень" #NT!
 nd_ukr_kuren_system_desc: "Курин, основная казачья рота, насчитывающая от пятидесяти до ста воинов, служит одновременно воинской единицей и общественным институтом, каждый из которых избирает своего атамана." #NT!
 nd_ukr_dnipro_fisheries: "Днепровское рыбное хозяйство" #NT!
 nd_ukr_dnipro_fisheries_desc: "Днепр и его притоки изобилуют рыбой и водоплавающей птицей, поддерживая казацкий образ жизни и поддерживая традицию медоварения из степного меда.\n\n#italic Доступно в: $nd_ukr_medovarnia$#!" #NT!
 nd_ukr_border_militia: "Пограничная милиция" #NT!
 nd_ukr_border_militia_desc: "Организованные пограничные войска защищают русинские поселения от татарских набегов, укомплектовывая сечевые укрепления вдоль степной границы.\n\n#italic Доступно в: $nd_ukr_sich_fortification$#!" #NT!
 nd_ukr_chaika_raiders: "Чайка Рейдерс" #NT!
 nd_ukr_chaika_raiders_desc: "Чайка, легкая военная лодка, вырезанная из цельного ствола и вооруженная фальконетами, позволяет казачьим набегам наносить удары по османским портам на Черном море с разрушительной скоростью." #NT!
 nd_ukr_black_sea_raids: "Черноморские рейды" #NT!
 nd_ukr_black_sea_raids_desc: "Казачьи флотилии численностью до трехсот чаек терроризируют османское побережье Черного моря, совершая набеги от Трабзона до пригородов самого Стамбула." #NT!
 nd_ukr_tabor_warfare: "Таборская война" #NT!
 nd_ukr_tabor_warfare_desc: "Табор, мобильная крепость из прикованных повозок, позволяет казачьим армиям защищаться от превосходящих сил кавалерии, создавая мгновенные полевые укрепления.\n\n#italic Доступно в: $nd_ukr_tabor_encampment$#!" #NT!
 nd_ukr_brotherhood_schools: "Школы Братства" #NT!
 nd_ukr_brotherhood_schools_desc: "Православные братства открывают школы в городах России, обучая грамоте, богословию и классическим языкам, чтобы защитить веру от католического прозелитизма." #NT!
 nd_ukr_salt_trade: "Соль Трейд" #NT!
 nd_ukr_salt_trade_desc: "Крымская соль, перевозимая на север чумакскими караванами, становится основным продуктом русской торговли, обогащая торговые города вдоль Днепра." #NT!
 nd_ukr_zaporozhian_fleet: "Запорожский флот" #NT!
 nd_ukr_zaporozhian_fleet_desc: "Организованные военно-морские силы Войска Запорожского имеют вдоль Днепра постоянные верфи, способные совершать рейдовые экспедиции по Черному морю." #NT!
 nd_ukr_khmelnytsky_uprising: "Хмельницкое восстание" #NT!
 nd_ukr_khmelnytsky_uprising_desc: "Восстание Богдана Хмельницкого в 1648 году разрушает старый порядок и создает независимое казацкое Гетманство, первое русинское государство за многие столетия." #NT!
 nd_ukr_registered_cossack_army: "Реестровое казачье войско" #NT!
 nd_ukr_registered_cossack_army_desc: "Система реестрового казачества превращает иррегулярных пограничников в дисциплинированную постоянную армию, организованную в полки под руководством профессиональных полковников." #NT!
 nd_ukr_hetmanate_governance: "Управление Гетманщиной" #NT!
 nd_ukr_hetmanate_governance_desc: "Казачья Гетманщина развивает сложную административную систему с выборными должностными лицами, писаными сводами законов и военной бюрократией." #NT!
 nd_ukr_mohyla_learning: "Традиции Могилянской академии" #NT!
 nd_ukr_mohyla_learning_desc: "Киево-Могилянская академия, первое православное высшее учебное заведение в восточнославянском мире, готовит духовенство, дипломатов и ученых, которые формируют интеллектуальную жизнь России." #NT!
 nd_ukr_orthodox_brotherhoods: "Православные Братства" #NT!
 nd_ukr_orthodox_brotherhoods_desc: "Православные братства мирян организуют школы, типографии и благотворительную деятельность, защищая веру посредством образования и общественной солидарности.\n\n#italic Доступно в: $nd_ukr_brotherhood_school$#!" #NT!
 nd_ukr_grain_export: "Экспорт зерна" #NT!
 nd_ukr_grain_export_desc: "Русинское зерно, добываемое в ошеломляющих количествах из чернозема, попадает на европейские рынки через Днепр и сухопутные торговые пути.\n\n#italic Доступно в: $nd_ukr_chernozem_estate$#!" #NT!
 nd_ukr_mazepa_golden_age: "Золотой век Мазепы." #NT!
 nd_ukr_mazepa_golden_age_desc: "При гетмане Иване Мазепе Гетманщина переживает необыкновенный культурный расцвет, по всей стране множатся церкви, академии, типографии." #NT!
 nd_ukr_regimental_system: "Полковая система" #NT!
 nd_ukr_regimental_system_desc: "Полковая система, полково-территориальная система, организует Гетманщину на военно-административные округа, каждый из которых обеспечивает войска и управление." #NT!
 nd_ukr_sloboda_settlement: "Слобода поселок" #NT!
 nd_ukr_sloboda_settlement_desc: "Слобода, свободные от налогов поселения, привлекают переселенцев на границу, заселяя пустующие степные земли земледельческими общинами." #NT!
 nd_ukr_cossack_constitution: "Казачья Конституция" #NT!
 nd_ukr_cossack_constitution_desc: "Конституция Филиппа Орлика 1710 года, одна из первых в Европе, кодифицирует права казаков и ограничивает власть гетмана посредством конституционных принципов." #NT!
 nd_ukr_steppe_cavalry_tactics: "Тактика степной конницы" #NT!
 nd_ukr_steppe_cavalry_tactics_desc: "Развивающаяся тактика казачьей кавалерии сочетает в себе традиции степных кочевников с европейской военной наукой, создавая легких всадников исключительной скорости и ударной мощи." #NT!
 nd_ukr_national_awakening: "Национальное пробуждение" #NT!
 nd_ukr_national_awakening_desc: "Русинское национальное пробуждение означает, что поэты, ученые и историки заново открывают и прославляют особую русинскую идентичность, язык и культурное наследие." #NT!
 nd_ukr_modern_agriculture: "Современное сельское хозяйство" #NT!
 nd_ukr_modern_agriculture_desc: "Научные методы земледелия, примененные к несравненному чернозему, превращают Малороссию в житницу Европы, а экспорт зерна питает континент." #NT!
 nd_ukr_kobzar_tradition: "Кобзарская традиция" #NT!
 nd_ukr_kobzar_tradition_desc: "Кобзари, слепые странствующие менестрели, поющие эпические думы, хранят память о казачьей славе и способствуют пробуждению национального самосознания.\n\n#italic Доступно в: $nd_ukr_mohyla_academy$#!" #NT!
 nd_ukr_university_reform: "Университетская реформа" #NT!
 nd_ukr_university_reform_desc: "Опираясь на традиции Могилянской академии, российские университеты внедряют современную науку, готовя новое поколение интеллектуалов и профессионалов." #NT!
 nd_ukr_haidamaka_rising: "Восхождение Хайдамаки" #NT!
 nd_ukr_haidamaka_rising_desc: "Восстания в Гайдамаке направляют боевой дух казаков в народные восстания, демонстрируя, что традиция вооруженного сопротивления жива в сердце Руси." #NT!
 a_nd_ukr_zaporozhian: "Запорожский казак" #NT!
 a_nd_ukr_zaporozhian_desc: "Легкая кавалерия Запорожской Сечи, опытные рейдеры и всадники, быстро наносящие удары и исчезающие в степи." #NT!
 a_nd_ukr_registered_cossack: "Реестровый казак" #NT!
 a_nd_ukr_registered_cossack_desc: "Профессиональные казачьи солдаты были организованы в полки, сочетая в себе стойкость на границе с военной дисциплиной." #NT!
 a_nd_ukr_cossack_light_horse: "Казачья легкая кавалерия" #NT!
 a_nd_ukr_cossack_light_horse_desc: "Стремительные конные воины Гетманщины, потомки степной традиции мобильной войны." #NT!
 n_nd_ukr_chaika: "Чайка" #NT!
 n_nd_ukr_chaika_desc: "Легкая военная лодка, вырезанная из цельного ствола дерева, вооруженная фальконетами и с экипажем из пятидесяти казачьих рейдеров. Быстрый и с мелкой осадкой, идеально подходит для речных и прибрежных операций." #NT!
 n_nd_ukr_war_chaika: "Боевая Чайка" #NT!
 n_nd_ukr_war_chaika_desc: "Усовершенствованная версия казачьей чайки, способная вести устойчивые операции на Черном море против османских кораблей." #NT!
 nd_ukr_sich_fortification: "Сечевое укрепление" #NT!
 nd_ukr_sich_fortification_desc: "Укрепленный казачий лагерь по образцу легендарной Запорожской Сечи, земляные валы, частоколы и казармы, защищающие границу." #NT!
 nd_ukr_chumak_post: "Торговый пост Чумак" #NT!
 nd_ukr_chumak_post_desc: "Перевалочный пункт на торговых путях Чумака, где останавливаются караваны, запряженные волами, и обмениваются солью, зерном и другими товарами." #NT!
 nd_ukr_mohyla_academy: "Киево-Могилянская академия" #NT!
 nd_ukr_mohyla_academy_desc: "Первое православное высшее учебное заведение в восточнославянском мире, где преподают латынь, философию, теологию и гуманитарные науки." #NT!
 nd_ukr_chernozem_estate: "Черноземная усадьба" #NT!
 nd_ukr_chernozem_estate_desc: "Фермерское поместье на легендарных черноземах русинской степи, производящее зерно в количествах, которые удивляют европейских гостей." #NT!
 nd_ukr_tabor_encampment: "Таборский лагерь" #NT!
 nd_ukr_tabor_encampment_desc: "Оборонительная позиция из прикованных повозок, наполненных землей и вооруженными людьми, казачий ответ на превосходство кавалерии противника." #NT!
 nd_ukr_brotherhood_school: "Школа Братства" #NT!
 nd_ukr_brotherhood_school_desc: "Школа, основанная православным братством для обучения грамоте, богословию и классическим языкам в защиту веры." #NT!
 nd_ukr_sloboda: "Слобода поселок" #NT!
 nd_ukr_sloboda_desc: "Свободное приграничное поселение, где колонисты получают налоговые льготы в обмен на заселение и защиту пустующих степных земель." #NT!
 nd_ukr_medovarnia: "Медоварния" #NT!
 nd_ukr_medovarnia_desc: "Медовый завод, производящий медовуху и ликеры из обильных продуктов пчеловодства в русинских степях и лесах." #NT!
 nd_ukr_sich_garrison: "Сечевый гарнизон" #NT!
 nd_ukr_sich_garrison_desc: "Вооруженные воины поддерживают оборону укреплений Сечи, потребляя оружие, скот для провизии и инструменты для содержания." #NT!
 nd_ukr_chumak_operations: "Чумак Операции" #NT!
 nd_ukr_chumak_operations_desc: "Сухопутная торговля солью, скотом и изделиями из кожи по чумакским караванным путям с использованием повозок, запряженных волами, требующих кожаных упряжей и приспособлений." #NT!
 nd_ukr_academy_operations: "Операции Академии" #NT!
 nd_ukr_academy_operations_desc: "Научная деятельность Могилянской академии, потребляющая бумагу, книги, стекло для окон и научных инструментов." #NT!
 nd_ukr_grain_processing: "Переработка зерна" #NT!
 nd_ukr_grain_processing_desc: "Переработка обильной русской пшеницы в пиво для местного потребления и экспорта." #NT!
 nd_ukr_tabor_supply: "Табор Поставка" #NT!
 nd_ukr_tabor_supply_desc: "Поддержание обороны мобильного форта с повозками лесом для ремонта повозок, оружием для гарнизона и скотом для продовольствия и транспорта." #NT!
 nd_ukr_school_operations: "Школьные операции" #NT!
 nd_ukr_school_operations_desc: "Преподавательская и полиграфическая деятельность братской школы, потребление бумаги, пчелиного воска для свечей и ткани для одежды и мебели." #NT!
 nd_ukr_sloboda_farming: "Слободское фермерское хозяйство" #NT!
 nd_ukr_sloboda_farming_desc: "Приграничное земледелие в слободских поселках, выращивание пшеницы, животноводство, использование орудий для обработки чернозема." #NT!
 nd_ukr_mead_brewing: "Медоварение" #NT!
 nd_ukr_mead_brewing_desc: "Варим традиционные русинские медовухи и ликеры из степного меда и зерна." #NT!
 levy_nd_ukr_cossack_light_horse: "Казачий легкий кавалерийский сбор" #NT!
 levy_nd_ukr_cossack_light_horse_desc: "Мобилизация быстроходных казачьих всадников из сельских округов Гетманщины." #NT!
 levy_nd_ukr_war_chaika: "Война Чайка Леви" #NT!
 levy_nd_ukr_war_chaika_desc: "Мобилизация казачьих боевых катеров для рейдовых операций на Черном море." #NT!
 nd_ukr_formed_tt: "была образована Малороссия." #NT!
 nd_ukr_path_a_tt: "Выбрал Республику Сечь" #NT!
 nd_ukr_path_b_tt: "Выбрали житницу Европы" #NT!
 nd_ukr_destiny: "Русская судьба" #NT!
 nd_ukr_destiny_desc: "Малороссия восстала из пепла раздробленности. Теперь, когда Киев обеспечен, а стабильность восстановлена, нация теперь должна выбрать свой путь: сабля или плуг, завоевание или возделывание земли." #NT!
 nd_ukr_dest_black_sea_gate: "Черноморские ворота" #NT!
 nd_ukr_dest_black_sea_gate_desc: "Захватить ворота к Черному морю. Захватите крымский порт Каффа и закрепите запорожские пороги у Кичкаса, чтобы начать движение казаков на юг." #NT!
 nd_ukr_dest_crimean_conquest: "Крымское завоевание" #NT!
 nd_ukr_dest_crimean_conquest_desc: "Разрушение Крымского ханства. Захватите Перекопские ворота и Азовскую крепость, чтобы доминировать на северном побережье Черного моря." #NT!
 nd_ukr_dest_black_sea_empire: "Черноморская Империя" #NT!
 nd_ukr_dest_black_sea_empire_desc: "Осуществите казачью мечту: овладейте обоими берегами Черного моря. Возьмите османский порт Синоп и Таманский полуостров, чтобы создать империю рейдеров и воинов." #NT!
 nd_ukr_dest_grain_port: "Зерновой порт" #NT!
 nd_ukr_dest_grain_port_desc: "Обеспечьте безопасность участка Хаджибея на побережье Черного моря, будущего шлюза для российского зерна на европейские рынки. Создайте казну, достойную растущей аграрной державы." #NT!
 nd_ukr_dest_black_earth_wealth: "Черноземное богатство" #NT!
 nd_ukr_dest_black_earth_wealth_desc: "Освойте современное банковское дело и развивайте центральную часть Руси, чтобы раскрыть весь потенциал легендарного чернозема." #NT!
 nd_ukr_dest_breadbasket_empire: "Хлебная Империя" #NT!
 nd_ukr_dest_breadbasket_empire_desc: "Доминируйте в мировой торговле, став незаменимой житницей континента. Нация, которая кормит Европу, командует Европой." #NT!
 nd_ukr.6.t: "Русская судьба" #NT!
 nd_ukr.6.d: "Земля Руси снова объединилась. От предгорий Карпат до порогов Днепра из разрозненных княжеств и казачьих войск сложилась нация. Рада собралась, знамена подняты, и Киев гордится. То, что было разрушено монгольским приливом, восстановлено. Теперь вопрос не в том, выживет ли Русь, а в том, какой она станет." #NT!
 nd_ukr.6.a: "Наша судьба ждёт!" #NT!
 nd_ukr.7.t: "Ворота Черного моря" #NT!
 nd_ukr.7.d: "Кафа пала под руками казаков. Огромный невольничий рынок Крыма, где на протяжении веков ханские налетчики продавали пленных русинов в османское рабство, принадлежит нам. У Кичкаса под нашими лодками гремят запорожские пороги. Ворота в Черное море открыты. Рейды, терроризировавшие наш народ на протяжении поколений, теперь потекут в противоположном направлении." #NT!
 nd_ukr.7.a: "Крым познает наш гнев!" #NT!
 nd_ukr.8.t: "Порт Хаджибей" #NT!
 nd_ukr.8.d: "Там, где Днестр впадает в Черное море, взят под контроль порт Хаджибей. Эта скромная якорная стоянка расположена в богатейшем сельскохозяйственном районе Европы, на черноземе, который бесконечно простирается на север и восток. По дорогам уже стоят повозки с волами, груженные зерном. Там, где когда-то по суше бродили чумакские фургоны, теперь корабли будут доставлять русинскую пшеницу на голодные рынки Средиземноморья. Будущее написано зерном." #NT!
 nd_ukr.8.a: "Наш урожай накормит мир!" #NT!
 nd_ukr.9.t: "Падение Крыма" #NT!
 nd_ukr.9.d: "Крымское ханство распалось. Перекоп, узкий перешеек, веками защищавший полуостров, подвергся штурму. У Азова капитулировала крепость, охранявшая устье Дона. Впервые на памяти русинская власть простирается до берегов Черного моря без тени татарских набегов. Вопрос теперь в том, что делать с этой победой. Некоторые выступают за снос всех крепостей и изгнание остатков населения, что станет окончательной расплатой за столетия набегов рабов. Другие рекомендуют заселение и ассимиляцию, превращая степь в русинские сельскохозяйственные угодья." #NT!
 nd_ukr.9.a: "Разрушьте ханство, отплатите за столетия страданий!" #NT!
 nd_ukr.9.b: "Заселите степь, сделайте ее своей плугом и делом." #NT!
 nd_ukr.10.t: "Банковская революция" #NT!
 nd_ukr.10.d: "Русинское зерно сейчас продается по премиальным ценам на европейских рынках, а казначейство пополняется серебром. Возникает вопрос: как распорядиться этим богатством? Одна фракция выступает за государственный банк под властью гетмана, централизованный инструмент для финансирования армий, строительства дорог и связывания подчиненных народов посредством финансовой зависимости. Другая фракция, киевские и львовские купцы, выступают за открытые рынки, позволяют торговцам устанавливать цены, позволяют свободно течь капиталу, а природные богатства Малороссии будут привлекать инвестиции со всего континента." #NT!
 nd_ukr.10.a: "Государство должно распоряжаться кошельком." #NT!
 nd_ukr.10.b: "Освободите рынки. Процветание следует за свободой." #NT!
 nd_ukr.11.t: "Хозяева Черного моря" #NT!
 nd_ukr.11.d: "Синоп пал. Османский порт, куда когда-то совершали набеги флотилии «Чайка», теперь развевается под русинским знаменем. На Таманском полуострове обеспечены кубанские ворота. Черное море, когда-то османское озеро, а затем оспариваемая граница, теперь является владением Руси. От Днепра до побережья Анатолии суда казачьей постройки патрулируют воды, которые их деды пересекали в качестве рейдеров. Перед нацией простирается империя воды и степи. Некоторые призывают высвободить флот, чтобы доминировать над каждым берегом. Другие видят в этих завоеваниях основу новой Понтийской империи, великой державы, созданной на море." #NT!
 nd_ukr.11.a: "Дайте волю рейдерам. Море – наше охотничье угодье!" #NT!
 nd_ukr.11.b: "Мы построим Понтийскую империю, способную соперничать с древними." #NT!
 nd_ukr.12.t: "Зернохранилище Европы" #NT!
 nd_ukr.12.d: "Преобразование завершено. Русинское зерно кормит половину континента. На биржевых площадках Хаджибея и Киева торговцы заключают контракты, от которых зависит, будут ли города процветать или голодать. Черноземье оказалось сильнее любой армии, страны, которые когда-то смотрели на Русь как на отсталую границу, теперь добиваются ее благосклонности. Остается вопрос: послужит ли это сельскохозяйственное превосходство мостом к миру, связывающим страны за общим столом? Или урожай будет индустриализирован, а его доходы направлены на модернизацию, которая сделает Русию самодостаточной во всех отношениях?" #NT!
 nd_ukr.12.a: "Накормите континент, привяжите народы к нашему столу." #NT!
 nd_ukr.12.b: "Индустриализация урожая, создание нашего собственного будущего." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_raze_khanate: "Месть Сечи" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_raze_khanate: "Крымские невольничьи рынки горят. Столетия набегов окупились одной кампанией праведной ярости." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_settle_steppe: "Степное поселение" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_settle_steppe: "Завоеванную степь колонизируют русинские поселенцы, превращая пастбища кочевников в упорядоченные сельскохозяйственные угодья." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_pontic_raiders: "Понтийские рейдеры" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_pontic_raiders: "Черное море принадлежит казачьим рейдерам, чьи десантные корабли безнаказанно наносят удары по обоим берегам." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_pontic_empire: "Понтийская империя" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_pontic_empire: "На Черном море возникает новая морская империя, созданная завоеваниями и поддерживаемая военно-морскими традициями." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_state_banking: "Государственный банкинг" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_state_banking: "Казначейство гетмана управляет потоком капитала, финансирует расширение и связывает подданных посредством финансовой власти." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_free_markets: "Свободные рынки" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_free_markets: "Открытые рынки и свободная торговля привлекают инвестиции со всего континента, хотя бюрократические издержки торгового государства оказывают давление на суд." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_feed_continent: "Накормить континент" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_feed_continent: "Русинская зерновая дипломатия привязывает нации к одному столу, хотя приоритет пахаря оставляет армию недостаточной." #NT!
 STATIC_MODIFIER_NAME_nd_ukr_dest_industrial_harvest: "Промышленный урожай" #NT!
 STATIC_MODIFIER_DESC_nd_ukr_dest_industrial_harvest: "Модернизированное сельское хозяйство способствует самодостаточности и расширению, хотя ориентация на внутренние районы игнорирует флот." #NT!
 nd_ukr_cossack_arsenal: "Казачий Арсенал" #NT!
 nd_ukr_cossack_arsenal_desc: "Крупный казачий оружейный завод, производивший вооружение, боеприпасы и технику для армий и флотов Черноморской империи." #NT!
 nd_ukr_grain_exchange: "Зерновая биржа" #NT!
 nd_ukr_grain_exchange_desc: "Международный торговый зал зерна, где торговцы заключают контракты, от которых зависит, будут ли отдаленные города процветать или умирать от голода." #NT!
 nd_ukr_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_ukr_arsenal_maintenance_desc: "Производство оружия требует переработки оружия, железа для выплавки, инструментов для производства и селитры для боеприпасов." #NT!
 nd_ukr_exchange_operations: "Обменные операции" #NT!
 nd_ukr_exchange_operations_desc: "Административные операции зерновой биржи, расходование бумаги для контрактов, ткани для мебели и инструментов для весового оборудования." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_ukr_bureaucracy_authority: "Гетманщина" #NT!
 AUTO_MODIFIER_DESC_nd_ukr_bureaucracy_authority: "Гетманская булава, Генеральная старшина и полковые полковники вместе осуществляют верховную власть над казачьими землями. Рядом со столицей открываются два бюрократических места для учреждений казачьего государства." #NT!
  
 ukr_zaporizhian_sich_bureaucracy: "Запорожская Сечь" #NT!
 ukr_zaporizhian_sich_bureaucracy_desc: "Крепость-республика на Днепровских порогах, Сечевая Рада которой (собрание всех казаков) избирала на годичный срок Кошского атамана и снабжала армию Хмельницкого из своих куринных рот. Сечь представляла собой образец прямой демократии рядового казачества: атаман правил путем одобрения и мог быть свергнут на любом совете. Его эгалитарный обычай устанавливал постоянные ограничения на претензии старшины на дворянский статус." #NT!
  
 ukr_polkovnyk_regimental_bureaucracy: "Полковникское полковое управление" #NT!
 ukr_polkovnyk_regimental_bureaucracy_desc: "Территориальные полки (польки), в которые Богдан Хмельницкий организовал освобожденные земли после 1648 года. Каждым из десяти полков управлял полковник, назначаемый гетманом и утверждаемый полковыми казаками; полковник командовал полком на войне, председательствовал полковым судом в мирное время и управлял полковыми городами и селами. Военная и гражданская власть, слитая в одном офицере, сделала полк основной единицей управления Гетманщины." #NT!
  
 ukr_heneralna_starshyna_bureaucracy: "Генеральная Старшина" #NT!
 ukr_heneralna_starshyna_bureaucracy_desc: "Главный офицерский штаб, служивший с середины XVII века постоянным кабинетом гетмана. В его состав входили генеральный обозный (квартирмейстер), два генеральных суда (генеральные судьи), генеральный пысар (канцлер), генеральный подкарби (казначей), два генеральных осавула, бунцужний (булавоносец) и хорунжий (знаменосец). Из Глухова после 1708 года Старшина управляла государственными исполнительными учреждениями." #NT!
  
 ukr_heneralnyi_sud_bureaucracy: "Генеральный Суд" #NT!
 ukr_heneralnyi_sud_bureaucracy_desc: "Генеральный суд Гетманщины, апелляционная коллегия, под председательством двух генеральных судей с 1654 года. Он применял многоуровневый правовой порядок: Литовский статут 1588 года в польском издании 1648 года для дворянских и шляхетских казаков, Магдебургское городское право в уставных городах, включая Киев, и казачье обычное право в военных вопросах. Суд объезжал круги, рассматривал смешанные казачье-российские дела и наказывал полки через Генеральный военный трибунал." #NT!
  
 ukr_kyiv_mohyla_academy_bureaucracy: "Киево-Могилянская академия" #NT!
 ukr_kyiv_mohyla_academy_bureaucracy_desc: "Основан в 1632 году, когда митрополит Петр Могила объединил Киевское братское училище с Печерской лаврской школой по иезуитскому коллегиальному образцу. После Гадяча 1658 г. оно получило формальное академическое звание и обучало грамотную православную элиту Гетманщины. Здесь учились будущие гетманы Выговский, Самойлович, Мазепа и Полуботок. При Мазепе набор превысил две тысячи, и академия поставляла писцов в каждый полк." #NT!
  
 ukr_pacta_et_constitutiones_bureaucracy: "Пакты и конституции" #NT!
 ukr_pacta_et_constitutiones_bureaucracy_desc: "Многоуровневая конституционная основа, определявшая автономию Гетманщины. В Переяславских статьях 1654 г. перечислялись права, сохранявшиеся за казачьим войском при царе; Гадячский мирный договор (1658 г.) предусматривал создание Великого княжества Русского в качестве третьего партнера Речи Посполитой; Бендерская конституция Пилипа Орлика (1710 г.) разделила законодательную, исполнительную и судебную власть в рамках генерального совета, проводимого раз в три года. Каждый новый гетман присягал на новую редакцию: живую конституцию, которая сковывала защитника." #NT!
