l_russian:
 STATIC_MODIFIER_NAME_nd_bgp_rhone_corridor: "Ронский коридор" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_rhone_corridor: "От Авиньона до Лиона Рона — это наша великая артерия, несущая вино, шелк и культуру по всему миру. Мы — наследники трубадуров и папского двора, цивилизации, которая ценит красоту, образованность и искусство жить хорошо." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_alpine_gatekeepers: "Альпийские привратники" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_alpine_gatekeepers: "Мы командуем высокими перевалами, где и армии, и торговцы должны платить за нас. Горы — наши валы, колонны — наши ворота. То, что пересекает Альпы, пересекает нас в свое удовольствие, и каждый поезд мулов, спускающийся в Италию, обогащает нашу сокровищницу." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_papal_patronage: "Папский патронаж" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_papal_patronage: "Наследие авиньонского папства продолжает жить в наших дворах: традиция церковного великолепия, художественного творчества и научных исследований, которые возвышают наше королевство над соседями." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_salt_monopoly: "Соляная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_salt_monopoly: "Белое золото Франш-Конте течет из наших солей и кормит половину Европы. Эта монополия на самый важный товар природы наполняет нашу казну и привязывает соседние кантоны к нашей торговле." #NT!
 nd_bgp.1.t: "Королевство восстановлено" #NT!
 nd_bgp.1.d: "Старое королевство Бургундия, королевство Арль, снова оживает. На протяжении веков это королевство существовало только как воспоминание, его земли были разделены между французскими королями, савойскими герцогами и претендентами на империю. Теперь единая корона объединяет долину Роны от альпийских перевалов до побережья Средиземного моря, от виноградников Прованса до соляных копей Юры.\n\nНо что это за королевство? Ронский коридор тянется на юг к морю, являясь естественным шоссе для торговли и культуры. Папское наследие Авиньона и дворы трубадуров открывают путь к изысканности, торговле и средиземноморской изысканности. В качестве альтернативы, наши альпийские центры дают нам контроль над каждым перевалом между Францией и Италией: рай для сборщиков пошлин и горная крепость, которую не может легко преодолеть ни одна армия.\n\nЭтот выбор определит нашу династию.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bgp.1.a: "Рона — наша дорога. Пусть вино и песни текут на юг, к морю." #NT!
 nd_bgp.1.b: "Мы – хранители Альп. Никто не пройдет без нашего разрешения." #NT!
 nd_bgp.2.t: "Наследие папского двора" #NT!
 nd_bgp.2.d: "На семьдесят лет папы сделали Авиньон центром христианского мира. Хотя Святой Престол вернулся в Рим в 1377 году, отпечаток папского покровительства над Провансом неизгладим. Папский дворец до сих пор возвышается над Роной, крупнейший готический дворец в Европе: памятник художественным амбициям пап Климента V, Иоанна XXII и их преемников.\n\nПод покровительством папы Симона Мартини привезла в Авиньон сиенскую живопись. Маттео Джованнетти покрыл стены часовни замысловатыми фресками. Папская библиотека стала одной из лучших в Европе. Папа Иоанн XXII посадил виноградники Шатонеф-дю-Пап и усовершенствовал виноградарство всего региона.\n\nЭто наследие художественного и интеллектуального покровительства остается источником нашего двора." #NT!
 nd_bgp.2.a: "Мы будем достойными наследниками папского наследия." #NT!
 nd_bgp.3.t: "Белое золото Саленса" #NT!
 nd_bgp.3.d: "На заводе Grande Saline в Сален-ле-Бен соль добывается уже более тысячи лет. В средневековый период он стал экономической столицей Франш-Конте, восемьсот рабочих трудились в его огромных подземных галереях, добывая рассол из колодцев, погружающихся глубоко в юрские породы. Соль питала Бургундию, Франш-Конте и половину швейцарских кантонов.\n\nСоляные соли приносят половину дохода региона. Контроль над этим белым золотом дает нам рычаги влияния на наших соседей и надежный источник богатства, который не смогут легко разрушить ни война, ни голод. Было бы разумно расширить и модернизировать наши соляные заводы." #NT!
 nd_bgp.3.a: "Соленые воды — сокровищница нашего королевства." #NT!
 nd_bgp.4.t: "Артиллерийские компании" #NT!
 nd_bgp.4.d: "По примеру бургундских герцогов мы издали подробные военные указы, стандартизирующие экипировку, подготовку и организацию наших солдат. Старое феодальное войско, где каждый лорд приводил с собой столько людей, сколько он мог собрать, с любым оружием, которое у него было, уступает место артиллерийским ротам: постоянным формированиям из латников, лучников, копейщиков и ручных стрелков, действующих под единой цепочкой командования.\n\nКаждая рота из девятисот человек организована в эскадроны, с тяжелой кавалерией, поддерживаемой конными лучниками и пехотинцами в дисциплинированных общевойсковых формированиях. Униформа, стандартизированное оружие и регулярные тренировки превращают феодальную толпу в профессиональную силу." #NT!
 nd_bgp.4.a: "Дисциплина и организованность будут нашей сильной стороной." #NT!
 nd_bgp_troubadour_courts: "Трубадурские суды" #NT!
 nd_bgp_troubadour_courts_desc: "При дворах Прованса и долины Роны зародилась традиция трубадуров: первая крупная часть светской лирической поэзии на народном европейском языке, прославляющая куртуазную любовь, рыцарскую добродетель и утонченность окситанскоязычной знати." #NT!
 nd_bgp_alpine_toll_mastery: "Мастерство альпийского платного сбора" #NT!
 nd_bgp_alpine_toll_mastery_desc: "Контроль над ключевыми альпийскими перевалами (Большой Сен-Бернар, Мон-Сени и Симплон) позволяет взимать пошлину с каждого торгового каравана, колонны паломников и военной экспедиции, пересекающих Францию ​​и Италию." #NT!
 nd_bgp_rhone_viticulture: "Виноградарство Роны" #NT!
 nd_bgp_rhone_viticulture_desc: "На залитых солнцем террасах долины Роны производили вино еще со времен Римской империи. Монашеские общины на протяжении веков совершенствовали искусство виноградарства, создавая традиции, которые в конечном итоге привели к производству одних из лучших вин Европы." #NT!
 nd_bgp_montagnard_tradition: "Монтаньярские традиции" #NT!
 nd_bgp_montagnard_tradition_desc: "Савойская горная кавалерия, выносливые наездники, выросшие в альпийских долинах, уникально приспособлены к пересеченной местности, где терпят неудачу низинные всадники. Они служат разведчиками, рейдерами и защитниками проходов." #NT!
 nd_bgp_arpitan_identity: "Арпитан Идентичность" #NT!
 nd_bgp_arpitan_identity_desc: "Арпитанские и окситанские языковые традиции объединяют разнообразные народы Бургундско-Провансальского королевства, от франко-провансальских носителей альпийских долин до провансальских трубадуров средиземноморского побережья." #NT!
 nd_bgp_comital_courts: "Комитальные суды" #NT!
 nd_bgp_comital_courts_desc: "Комитальные суды Савойи установили традицию централизованного управления, которая сохранялась на протяжении веков, при этом графы, а затем и герцоги сохраняли эффективную юрисдикцию над своими фрагментированными альпийскими владениями." #NT!
 nd_bgp_avignon_legacy: "Авиньонское наследие" #NT!
 nd_bgp_avignon_legacy_desc: "Семьдесят лет авиньонского папства (1309–1377) оставили неизгладимый след в Провансе: Папский дворец, художественные традиции Симоны Мартини и Маттео Джованнетти, а также космополитичная научная культура, которая сохранялась еще долгое время после возвращения пап в Рим." #NT!
 nd_bgp_chateauneuf: "Шатонеф-дю-Пап" #NT!
 nd_bgp_chateauneuf_desc: "Папа Иоанн XXII посадил виноградники, которые будут носить имя его замка Шатонеф-дю-Пап. К 1344 году почти половина окрестных земель была отведена под виноградарство, производящее вина, которые могли конкурировать с лучшими в Европе. Папская санкция возвела виноделие Роны в искусство." #NT!
 nd_bgp_grande_saline: "Гранде Салин" #NT!
 nd_bgp_grande_saline_desc: "Соляные заводы Сален-ле-Бен во Франш-Конте: один из крупнейших промышленных комплексов Европы, производящий 14 000 тонн соли в год и насчитывающий более 800 рабочих. Это белое золото кормило половину восточной Франции и швейцарские кантоны." #NT!
 nd_bgp_savoyard_chancery: "Савойская канцелярия" #NT!
 nd_bgp_savoyard_chancery_desc: "Административный аппарат Савойского государства: профессиональная канцелярия, укомплектованная обученными писцами и нотариусами, которые поддерживали юридический и дипломатический аппарат королевства, расположенного между Альпами." #NT!
 nd_bgp_provencal_galleys: "Провансальские галеры" #NT!
 nd_bgp_provencal_galleys_desc: "В портах Марселя и Тулона были запущены галеры, которые патрулировали западную часть Средиземноморья, защищая торговые пути Прованса и распространяя мощь вдоль побережья от дельты Роны до лигурийского побережья." #NT!
 nd_bgp_burgundian_drill: "Бургундская дрель" #NT!
 nd_bgp_burgundian_drill_desc: "Военные реформы бургундских герцогов делали упор на регулярное обучение, стандартизированное снаряжение и дисциплинированные формирования: нововведения, которые превратили средневековое войско в нечто, приближающееся к профессиональной армии." #NT!
 nd_bgp_ordonnance_reform: "Реформа артиллерийского вооружения" #NT!
 nd_bgp_ordonnance_reform_desc: "Артиллерийские роты: постоянные воинские формирования численностью 900 человек, организованные в общевойсковые эскадрильи, состоящие из латников, лучников, пикинеров и ручных стрелков. Впервые учрежденные указами Карла Смелого 1471–1473 годов, они представляют собой революцию в европейской военной организации." #NT!
 nd_bgp_rhone_trade_system: "Торговая система Роны" #NT!
 nd_bgp_rhone_trade_system_desc: "Рона служит естественной коммерческой магистралью, соединяющей Средиземноморье с сердцем Франции. Речная торговля, справедливые привилегии и развитые торговые сети делают долину Роны одним из самых процветающих коридоров в Западной Европе." #NT!
 nd_bgp_mountain_fortresses: "Горные крепости" #NT!
 nd_bgp_mountain_fortresses_desc: "Бастилии Савойи, каменные крепости, господствующие над альпийскими перевалами и узкими местами в долинах, превращают любое вторжение в королевство в кошмар осадной войны на враждебной местности." #NT!
 nd_bgp_literary_renaissance: "Литературный Ренессанс" #NT!
 nd_bgp_literary_renaissance_desc: "Литературные традиции Прованса переживают период возрождения: суды покровительствуют ученым, поэтам и первопечатникам, которые распространяют знания как на латыни, так и на окситанском языке." #NT!
 nd_bgp_order_annunciation: "Орден Благовещения" #NT!
 nd_bgp_order_annunciation_desc: "Высший орден Святейшего Благовещения, основанный Амадеем VI Савойским в 1362 году, входит в число самых престижных рыцарских орденов Европы. Членство связывает высшую знать с Савойей и повышает дипломатический престиж во всем христианском мире." #NT!
 nd_bgp_silk_introduction: "Шелковые мастер-классы" #NT!
 nd_bgp_silk_introduction_desc: "Появление шелкоткачества в долине Роны, первоначально находившейся под итальянским влиянием, в конечном итоге сделало Лион одним из крупнейших шелковых центров Европы. Это ремесло требует навыков, капитала и доступа к шелку-сырцу с Востока." #NT!
 nd_bgp_confessional_crossroads: "Конфессиональный перекресток" #NT!
 nd_bgp_confessional_crossroads_desc: "Расположенное между католической Францией, реформированной Женевой и конфессионально разделенной Империей, Бургундско-Провансальское королевство должно вести религиозные войны с прагматической терпимостью или решительным союзом." #NT!
 nd_bgp_savoyard_infantry: "Савойская пехота" #NT!
 nd_bgp_savoyard_infantry_desc: "Профессиональная савойская пехота, обученная в традициях стрельбы из пик и выстрелов и находящаяся под влиянием как итальянских кондотьеров, так и бургундских методов артиллерийского вооружения, составляет основу постоянной армии." #NT!
 nd_bgp_centralized_administration: "Централизованное администрирование" #NT!
 nd_bgp_centralized_administration_desc: "Централизованный административный аппарат, сосредоточенный в столице Шамбери, обеспечивает согласованное управление на различных территориях королевства, от альпийских долин до средиземноморских портов." #NT!
 nd_bgp_toll_modernization: "Модернизация платных дорог" #NT!
 nd_bgp_toll_modernization_desc: "Стандартизация системы сборов и таможенных пошлин на всех альпийских перевалах и переходах через реку Рона, заменяющая лоскутное одеяло местных сборов рациональной системой доходов, которая максимизирует доходы, одновременно уменьшая трения для авторитетных торговцев." #NT!
 nd_bgp_marseille_port: "Марсельский порт" #NT!
 nd_bgp_marseille_port_desc: "Расширение военно-морских баз в Марселе превращает древний порт в настоящий арсенал, способный строить и обслуживать военные корабли для операций в Средиземноморье." #NT!
 nd_bgp_university_tradition: "Университетские традиции" #NT!
 nd_bgp_university_tradition_desc: "Авиньонский университет, основанный в 1303 году, и другие учебные заведения по всему королевству культивируют традиции юридических и теологических исследований, которые поддерживают административную компетентность и интеллектуальную жизнеспособность." #NT!
 nd_bgp_absolutist_state: "Абсолютистское государство" #NT!
 nd_bgp_absolutist_state_desc: "Централизация королевской власти по французской модели, объединение лоскутного одеяла феодальных юрисдикций, автономных коммун и церковных свобод в единое абсолютистское государство." #NT!
 nd_bgp_standing_army: "Постоянная армия" #NT!
 nd_bgp_standing_army_desc: "Профессионализация армии в постоянные постоянные силы линейной пехоты, замена сезонных наборов и рот наемников прежних столетий круглогодичными солдатами, обученными современной строевой подготовке." #NT!
 nd_bgp_fortress_modernization: "Модернизация крепости" #NT!
 nd_bgp_fortress_modernization_desc: "Модернизация сети альпийских крепостей по принципам Вобана: звездные форты с угловыми бастионами заменяют средневековые навесные стены, обновленные, чтобы выдерживать артиллерийские обстрелы." #NT!
 nd_bgp_wine_appellations: "Наименования вин" #NT!
 nd_bgp_wine_appellations_desc: "Кодификация стандартов производства вина и региональных наименований, предшественник современной системы AOC, которая станет подарком Франции виноградарству. Контроль качества и географическое обозначение защищают репутацию и ценность бургундских и провансальских вин." #NT!
 nd_bgp_arsenal_expansion: "Расширение Арсенала" #NT!
 nd_bgp_arsenal_expansion_desc: "Расширение военно-морского потенциала Средиземноморья за счет строительства фрегатов для торговой защиты и прибрежного патрулирования, создания надлежащих военно-морских сил для защиты морских интересов Прованса." #NT!
 nd_bgp_salon_culture: "Салон Культуры" #NT!
 nd_bgp_salon_culture_desc: "Просвещение приходит в салоны Лиона, Авиньона и Шамбери (собрания философов, ученых и литературных деятелей), которые обсуждают натурфилософию, политические реформы и права человека." #NT!
 nd_bgp_modern_viticulture: "Современное виноградарство" #NT!
 nd_bgp_modern_viticulture_desc: "Протоиндустриальные методы превращают производство вина из кустарного ремесла в систематическую индустрию: крупные поместья, использующие современные сельскохозяйственные технологии, контролируемое брожение и организованные экспортные сети." #NT!
 nd_bgp_constitutional_reform: "Конституционная реформа" #NT!
 nd_bgp_constitutional_reform_desc: "Представительное управление и конституционные принципы заменяют абсолютистское правление, создавая законодательные собрания, кодифицируя права и административную рационализацию по всему королевству." #NT!
 nd_bgp_citizen_levy: "Гражданин Леви" #NT!
 nd_bgp_citizen_levy_desc: "Альпийские егеря, элитная горная пехота, набранная из выносливого населения альпийских долин, обученная для ведения войны в самой сложной местности Европы." #NT!
 nd_bgp_alpine_infrastructure: "Альпийская инфраструктура" #NT!
 nd_bgp_alpine_infrastructure_desc: "Современное строительство дорог и туннелей в Альпах: инженерные достижения, которые уменьшают изоляцию горных долин и ускоряют торговый поток через самые огромные естественные барьеры королевства." #NT!
 nd_bgp_national_consciousness: "Национальное сознание" #NT!
 nd_bgp_national_consciousness_desc: "Появляется отчетливая бургундско-провансальская национальная идентичность (не полностью французская, ни итальянская, ни швейцарская), а уникальная средиземноморско-альпийская цивилизация, уходящая корнями в поэзию трубадуров, винную культуру, независимость гор и память о древнем королевстве Арль." #NT!
 a_nd_bgp_montagnard_cavalry: "Монтаньярская кавалерия" #NT!
 a_nd_bgp_montagnard_cavalry_desc: "Выносливые савойские всадники из альпийских долин, выращенные на горных тропах, где низинная кавалерия не может действовать. Они служат разведчиками, защитниками перевалов и рейдерами в высокогорной местности." #NT!
 a_nd_bgp_ordonnance_lance: "Артиллерийское копье" #NT!
 a_nd_bgp_ordonnance_lance_desc: "Профессиональные общевойсковые кавалерийские роты, организованные в соответствии с бургундскими военными постановлениями. Каждое копье состоит из воинов, лучников и поддерживающей пехоты, действующих как дисциплинированное общевойсковое подразделение." #NT!
 a_nd_bgp_savoyard_tercios: "Савойский Терсиос" #NT!
 a_nd_bgp_savoyard_tercios_desc: "Профессиональная савойская стрелковая пехота, сочетающая итальянское тактическое мастерство с бургундской организационной дисциплиной. Обучены как для открытого боя, так и для ведения боевых действий в горах." #NT!
 a_nd_bgp_line_infantry: "Линейная пехота" #NT!
 a_nd_bgp_line_infantry_desc: "Профессиональные солдаты постоянной армии обучены современной линейной тактике, образуя надежную основу вооруженных сил королевства." #NT!
 a_nd_bgp_chasseurs_alpins: "Егеря Альпины" #NT!
 a_nd_bgp_chasseurs_alpins_desc: "Элитная горная пехота: легкая, быстрая и безжалостно эффективная в альпийской местности. Набранные из самых выносливых горных жителей, они являются лучшими горными войсками в Европе." #NT!
 n_nd_bgp_provencal_galley: "Провансальский камбуз" #NT!
 n_nd_bgp_provencal_galley_desc: "Маневренные средиземноморские военные галеры, построенные в портах Прованса, быстрее стандартных галер и оптимизированы для прибрежных операций в западном Средиземноморье." #NT!
 n_nd_bgp_frigate: "Провансальский фрегат" #NT!
 n_nd_bgp_frigate_desc: "Быстроходные патрульные фрегаты, предназначенные для защиты торговли в Средиземноморье, способные перехватывать пиратов и обеспечивать соблюдение морских интересов Прованса вдоль побережья." #NT!
 nd_bgp_cort_damor: "Корт д'Амор" #NT!
 nd_bgp_cort_damor_desc: "Двор любви, где трубадуры исполняют свои кансо и тенсоны, благородные дамы решают вопросы куртуазной преданности, а изысканная литературная культура окситанского мира процветает под покровительством аристократов." #NT!
 nd_bgp_cort_damor_patronage: "Покровительство Трубадура" #NT!
 nd_bgp_cort_damor_patronage_desc: "Обеспечение литературной деятельности двора: пергамент для стихов, свечи для вечерних представлений, вино для придворных торжеств, изысканное сукно для благородных нарядов, подарки для заезжих трубадуров." #NT!
 nd_bgp_col_toll_house: "Кол Толл Хаус" #NT!
 nd_bgp_col_toll_house_desc: "Укрепленный таможенный пост на альпийском перевале, где каждый торговый караван, паломнический поезд и военная колонна должны остановиться и заплатить пошлину, прежде чем продолжить путь через горы." #NT!
 nd_bgp_toll_collection: "Сбор платы за проезд" #NT!
 nd_bgp_toll_collection_desc: "Административные расходы на работу таможенного поста: бухгалтерские книги, печати, образцы ткани и соли, взимаемые в качестве натуральных пошлин, и небольшая бюрократия, которая регистрирует каждый проход и собирает каждый дукат." #NT!
 nd_bgp_vignoble: "Виднобль" #NT!
 nd_bgp_vignoble_desc: "Террасный виноградник в залитой солнцем долине Роны, производящий вина из винограда, выращенного на склонах, лозы которых известны еще со времен Римской империи." #NT!
 nd_bgp_rhone_winemaking: "Виноделие Роны" #NT!
 nd_bgp_rhone_winemaking_desc: "Традиционные методы виноделия в долине Роны, усовершенствованные на протяжении веков: сбор, прессование и выдержка вин в дубовых бочках для получения крепких красных вин и ароматных роз, которыми славится этот регион." #NT!
 nd_bgp_papal_vintages: "Папский винтаж" #NT!
 nd_bgp_papal_vintages_desc: "Технологии виноделия премиум-класса, разработанные под патронажем Папы, с использованием тщательно отобранных сортов винограда и изысканных методов производства для создания вин, достойных стола понтифика." #NT!
 nd_bgp_palais_des_papes: "Папский дворец" #NT!
 nd_bgp_palais_des_papes_desc: "Самый большой готический дворец в Европе, построенный для авиньонских пап. Его высокие залы, часовни с фресками и обширная библиотека воплощают культурные амбиции средневекового папства и продолжают вдохновлять церковные и научные усилия." #NT!
 nd_bgp_papal_palace_maintenance: "Содержание Папского дворца" #NT!
 nd_bgp_papal_palace_maintenance_desc: "Обслуживание обширного дворцового комплекса, ремонт камня, освещение его многочисленных покоев, вино для церковных церемоний и поддержка писцов и ученых, работающих в его стенах." #NT!
 nd_bgp_saline: "солевой раствор" #NT!
 nd_bgp_saline_desc: "Соляные заводы, подземные галереи направляют природный рассол на поверхность, где он испаряется в огромных котлах над дровяными кострами. Белое золото Франш-Конте питало восточную Францию ​​на протяжении тысячелетия." #NT!
 nd_bgp_salt_extraction: "Добыча соли" #NT!
 nd_bgp_salt_extraction_desc: "Систематическая добыча соли из подземных рассолов, забор соленой воды через глубокие колодцы, а затем ее выпаривание над костром из дров и угля для производства кристаллической соли для торговли." #NT!
 nd_bgp_chancery: "Канцелярия" #NT!
 nd_bgp_chancery_desc: "Административное сердце управления Савойи: профессиональная канцелярия, где обученные нотариусы разрабатывают законы, ведут учет и управляют дипломатической корреспонденцией королевства." #NT!
 nd_bgp_chancery_upkeep: "Канцелярские операции" #NT!
 nd_bgp_chancery_upkeep_desc: "Эксплуатационные расходы канцелярии, бумага для документов, воск для печатей, ткань для официальной формы, книги законов и прецедентов, а также свечи для долгих часов административной работы." #NT!
 nd_bgp_bastille_savoyarde: "Бастилия Савойская" #NT!
 nd_bgp_bastille_savoyarde_desc: "Грозная горная крепость, построенная для контроля над альпийской долиной или перевалом, ее толстые каменные стены и командное положение делали ее практически неуязвимой для атак в эпоху, когда еще не было тяжелой артиллерии." #NT!
 nd_bgp_fortress_garrison: "Горный гарнизон" #NT!
 nd_bgp_fortress_garrison_desc: "Постоянный гарнизон горной крепости, вооруженные люди, поддерживающие стены, оружие, огнестрельное оружие и инструменты, необходимые для того, чтобы выдержать длительную осаду на враждебной альпийской местности." #NT!
 nd_bgp_silk_workshop: "Шелковая мастерская" #NT!
 nd_bgp_silk_workshop_desc: "Мастерская по ткачеству тонких тканей из шелка, основанная на технологиях, привезенных из Италии, и шелка-сырца, импортированного с Востока. Начало того, что впоследствии стало одной из крупнейших текстильных отраслей Европы." #NT!
 nd_bgp_silk_weaving: "Шелковое Ткачество" #NT!
 nd_bgp_silk_weaving_desc: "Искусство плетения тонких тканей из необработанных шелковых нитей с использованием все более совершенных ткацких станков для производства тканей, способных конкурировать с лучшими итальянскими мастерскими." #NT!
 nd_bgp_provencal_arsenal: "Провансальский Арсенал" #NT!
 nd_bgp_provencal_arsenal_desc: "Средиземноморский военно-морской арсенал, верфь, склады древесины, канатные дороги и сухие доки для строительства и ремонта военных кораблей, защищающих морскую торговлю Прованса." #NT!
 nd_bgp_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_bgp_arsenal_maintenance_desc: "Поддержание военно-морского арсенала, древесины для корпусов, военно-морских запасов и дегтя для такелажа и уплотнения, а также инструментов для корабелов и мастеров, которые поддерживают флот в готовности к выходу в море." #NT!
 nd_bgp_grand_domaine: "Гранд Домен" #NT!
 nd_bgp_grand_domaine_desc: "Современное винодельческое хозяйство, использующее протоиндустриальные методы, систематическое выращивание, контролируемую ферментацию и организованные экспортные сети, которые превращают традиционное виноградарство в коммерческое предприятие." #NT!
 nd_bgp_estate_winemaking: "Виноделие поместья" #NT!
 nd_bgp_estate_winemaking_desc: "Крупномасштабное коммерческое виноделие на современном поместье, использующее улучшенные сельскохозяйственные технологии и организованный труд для производства вина для национального и международного рынков." #NT!
 levy_nd_bgp_chasseurs_alpins: "Шассёрс Альпинс Леви" #NT!
 levy_nd_bgp_chasseurs_alpins_desc: "Горная пехота, набираемая из выносливого населения альпийских долин." #NT!
 levy_nd_bgp_montagnard_cavalry: "Монтаньярский кавалерийский сбор" #NT!
 levy_nd_bgp_montagnard_cavalry_desc: "Легкая кавалерия, набранная из горной знати Савойи." #NT!
 nd_bgp_formed_tt: "Образовалась Бургундия-Прованс." #NT!
 nd_bgp_path_a_tt: "Выбрал коридор Роны" #NT!
 nd_bgp_path_b_tt: "Выбирайте альпийских привратников" #NT!
 nd_bgp_destiny: "Королевство Арль возрождается" #NT!
 nd_bgp_destiny_desc: "Древнее королевство Бургундия снова оживает. Обеспечив стабильность, новое царство должно выбрать свой путь вперед: либо охватывать Средиземноморский мир, либо овладевать альпийскими перевалами." #NT!
 nd_bgp_dest_rhone_commerce: "Рона Коммерция" #NT!
 nd_bgp_dest_rhone_commerce_desc: "Расширьте коммерческую зону Ронского коридора на запад до Монпелье, обеспечив безопасность побережья Лангедока и сделав шелк основным продуктом торговли нашей столицы. Требуется 1000 золота в казне." #NT!
 nd_bgp_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_bgp_dest_mare_nostrum_desc: "Захватите Геную, жемчужину средиземноморской торговли, и интегрируйте ее торговые сети в нашу растущую коммерческую империю. Развивайте наше королевство до общего развития 1500 и достигайте престижа 50." #NT!
 nd_bgp_dest_rhone_apex: "Большой торговый центр" #NT!
 nd_bgp_dest_rhone_apex_desc: "Приведите Барселону под наше знамя, завершив наше господство над богатейшими портами западного Средиземноморья. Накопите 3000 золота, достигните 75-го уровня престижа и вступите в институт глобальной торговли." #NT!
 nd_bgp_dest_alpine_mastery: "Альпийское мастерство" #NT!
 nd_bgp_dest_alpine_mastery_desc: "Расширьте наш контроль над швейцарскими кантонами, захватив Цюрих, ключ к центральной Швейцарии. Поддерживайте армию минимум в 30 полков и стабильность в 75." #NT!
 nd_bgp_dest_piedmont_control: "Пьемонт Контроль" #NT!
 nd_bgp_dest_piedmont_control_desc: "Пересеките Альпы и захватите Турин, ворота на итальянский полуостров. Постройте армию из 50 полков и развивайте королевство до 1500 общего развития." #NT!
 nd_bgp_dest_alpine_hegemony: "Альпийская гегемония" #NT!
 nd_bgp_dest_alpine_hegemony_desc: "Возьмите Милан, богатейший город северной Италии, завершающий наше господство по обе стороны Альп. Выставьте 75 полков, добейтесь 75-го престижа и примите артиллерийский институт." #NT!
 nd_bgp.5.t: "Королевство восстановлено" #NT!
 nd_bgp.5.d: "Корона Королевства Арля снова сидит на нашем челе. То, что было разлучено столетиями разделения, теперь воссоединилось: от альпийских вершин до берегов Средиземного моря королевство снова живет. История наблюдает за тем, что мы будем делать с этим наследием." #NT!
 nd_bgp.5.a: "Королевство выстоит." #NT!
 nd_bgp.6.t: "Рона течет на юг" #NT!
 nd_bgp.6.d: "Наши купцы и галеры теперь курсируют по маршруту, простирающемуся от Лиона до Монпелье и далее. Коридор Роны становится тем, чем его всегда задумала природа: коммерческой магистралью, соединяющей сердце Европы со Средиземноморьем. Шелк с Востока поступает на наши рынки; вино из наших виноградников течет в каждый порт. Доходы уже преображают наше королевство." #NT!
 nd_bgp.6.a: "Пусть коммерция течет." #NT!
 nd_bgp.7.t: "Генуя под нашим знаменем" #NT!
 nd_bgp.7.d: "Великолепная Республика (La Superba) принадлежит нам. Банковские дома Генуи, ее флот, ее обширные торговые посты от Черного моря до Атлантики теперь служат нашей короне. Генуэзские купеческие князья, как всегда прагматичные, уже приспосабливаются к нашему правлению. Вопрос в том, как лучше всего использовать эту неожиданную удачу.\n\nМы могли бы интегрировать торговые сети Генуи в единую торговую систему Леванта, направляя восточные товары через наши порты. В качестве альтернативы мы могли бы опираться на военно-морские традиции Генуи и создать собственную талассократию: морскую державу, вызывающую уважение на каждом море." #NT!
 nd_bgp.7.a: "Интегрируйте генуэзские торговые сети." #NT!
 nd_bgp.7.b: "Создайте военно-морскую державу, которая сможет соперничать с любой другой морской державой." #NT!
 nd_bgp.8.t: "Большой торговый центр Запада" #NT!
 nd_bgp.8.d: "Барселона, Генуя, Марсель, Монпелье, величайшие порты западного Средиземноморья, несут наше знамя. Наше королевство стало тем, о чем когда-то мечтали римляне: единой торговой цивилизацией, простирающейся вдоль всего северного побережья Средиземного моря. Товары текут с трех континентов через наши порты.\n\nЭту беспрецедентную коммерческую мощь можно направить на строительство: инвестиции в инфраструктуру, снижение затрат и создание процветающего мира. Или это может способствовать культурному ренессансу, который заставил бы трубадуров плакать от радости: расцвет искусства, дипломатии и влияния, который укрепляет наше место среди великих держав Европы." #NT!
 nd_bgp.8.a: "Постройте величайшее торговое царство в христианском мире." #NT!
 nd_bgp.8.b: "Пусть наши дворы соперничают с Флоренцией и Римом." #NT!
 nd_bgp.9.t: "Мастер пропусков" #NT!
 nd_bgp.9.d: "Цюрих захвачен нашими войсками. Швейцарские кантоны теперь обращают внимание на нашу корону, а не на свою капризную конфедерацию. Благодаря этому завоеванию мы контролируем всю ширину альпийского барьера: каждый крупный проход от Симплона до Сен-Готарда зависит от наших сборщиков пошлин и наших гарнизонов. Ни одна армия не пересекает горы без нашего ведома; ни один купец не пересечет границу, не заплатив причитающегося нам налога." #NT!
 nd_bgp.9.a: "Альпы – наша крепость и наша сокровищница." #NT!
 nd_bgp.10.t: "Спуск в Италию" #NT!
 nd_bgp.10.d: "Турин наш. Мечта Савойи о господстве над обоими склонами Альп осуществилась: мы контролируем перевалы сверху и равнину Пьемонта снизу. Перед нами открыты богатые города северной Италии, их богатство является искушением для любого амбициозного принца.\n\nКомандиры наших гарнизонов выступают за систему железной дисциплины: укреплённые позиции, быстрое подкрепление и армия, которая восстанавливается после неудач быстрее, чем любой соперник. Другие предлагают другой подход: использовать наше стратегическое положение для получения уступок посредством дипломатии, подкрепленной угрозой силы, заставляя каждый мирный договор и каждый повод к войне служить нашей экспансии." #NT!
 nd_bgp.10.a: "Дисциплина и быстрое подкрепление — наши сильные стороны." #NT!
 nd_bgp.10.b: "Стратегическая позиция — наше величайшее оружие." #NT!
 nd_bgp.11.t: "Альпийская Империя" #NT!
 nd_bgp.11.d: "Милан (бьющееся сердце Ломбардии, богатейший город к северу от Рима) склоняется перед нашей короной. Мы достигли того, чего не удавалось ни одной державе со времен Карла Великого: единого королевства, контролирующего как Альпийский барьер, так и Ломбардскую равнину, расположенного между великим водоразделом между Северной и Южной Европой.\n\nЭта гегемония может принять форму военного превосходства: агрессивная позиция, которая использует наше стратегическое положение для аннексии территории и проецирования силы по всему континенту. В качестве альтернативы мы можем объединить наше горное королевство в неприступное и самодостаточное царство, интегрируя покоренные народы и создавая логистические сети, которые сделают наши армии неутомимыми." #NT!
 nd_bgp.11.a: "Мы завоеватели. Пусть Италия дрожит." #NT!
 nd_bgp.11.b: "Объедините наше горное царство в крепость." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_levant_routes: "Левантийские маршруты" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_levant_routes: "Интеграция генуэзских торговых сетей направляет восточные товары через порты Прованса, обогащая наше королевство сырьем со всего Средиземноморья." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_provencal_thalassocracy: "Провансальская талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_provencal_thalassocracy: "Наши военно-морские силы доминируют в западной части Средиземноморья, обеспечивая безопасность торговых путей и проецируя мощь от Каталонии до Лигурийского побережья." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_grand_emporium: "Большой торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_grand_emporium: "Королевство стало крупнейшим торговым центром западного Средиземноморья: обширным торговым пространством, где деньги текут свободно, а затраты на строительство минимальны." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_troubadour_renaissance: "Трубадур Ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_troubadour_renaissance: "Культурный расцвет, достойный традиции трубадуров: наши дворы привлекают художников, дипломатов и ученых, а наше культурное влияние распространяется по всей Европе." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_iron_garrison: "Железный гарнизон" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_iron_garrison: "Наши горные гарнизоны являются образцом военной дисциплины: быстрое пополнение и высокий моральный дух делают наши оборонительные позиции практически нерушимыми." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_toll_imperium: "Толл Империум" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_toll_imperium: "Наше стратегическое положение по обе стороны альпийских перевалов дает нам непревзойденные дипломатические рычаги воздействия, превращая любые переговоры и каждый повод для войны в нашу пользу." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_alpine_imperator: "Альпийский Император" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_alpine_imperator: "Агрессивная военная позиция, использующая наше положение в Альпах: наши армии быстро побеждают, дешево аннексируют и взимают дань с побежденных." #NT!
 STATIC_MODIFIER_NAME_nd_bgp_dest_mountain_kingdom: "Горное Королевство" #NT!
 STATIC_MODIFIER_DESC_nd_bgp_dest_mountain_kingdom: "Неприступное горное царство, где покоренные народы быстро интегрируются, линии снабжения работают эффективно, а суровая альпийская среда скорее укрепляет, чем ослабляет наши силы." #NT!
 nd_bgp_maison_de_commerce: "Дом коммерции" #NT!
 nd_bgp_maison_de_commerce_desc: "Величественный средиземноморский торговый дом: объединенный склад, биржа и счетная палата, служащая нервным центром нашей торговой империи, переправляющая товары и золото из-за моря." #NT!
 nd_bgp_trading_house_maintenance: "Деятельность Торгового Дома" #NT!
 nd_bgp_trading_house_maintenance_desc: "Эксплуатационные расходы большого торгового дома: бумага для контрактов и бухгалтерских книг, ткань для демонстрации образцов, соль как торговый стандарт и стекло для окон и витрин." #NT!
 nd_bgp_alpine_citadel: "Альпийская цитадель" #NT!
 nd_bgp_alpine_citadel_desc: "Неприступный горный комплекс-крепость, господствующий над стратегической альпийской долиной: многочисленные оборонительные кольца, глубокие склады и укрепления, способные противостоять самой тяжелой артиллерии. Высшее достижение бургундско-провансальской военной инженерии." #NT!
 nd_bgp_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_bgp_citadel_garrison_desc: "Элитный гарнизон альпийской цитадели: тяжеловооруженные защитники, поддерживающие оружие, стены и припасы для длительной осады в враждебной горной местности." #NT!
  
  # ===== BUREAUCRACIES ===== 
 bgp_golden_fleece_bureaucracy: "Орден Золотого Руна" #NT!
 bgp_golden_fleece_bureaucracy_desc: "Основан Филиппом Добрым в Брюгге 10 января 1430 года в честь его брака с Изабеллой Португальской, с постоянной резиденцией в Дижоне в 1432 году. Двадцать четыре (позже тридцать, затем пятьдесят) рыцарей Ордена присягают на личную верность герцогу и разрешают свои споры только в капитуле; его ежегодные праздники Святого Андрея объединяют высшую знать всех бургундских земель в единый рыцарский союз. Пока он сохраняется, это самый престижный рыцарский орден в христианском мире; хотя его притязания игнорируются, его притязания обходятся дороже в виде субсидий бюргерам, чем они приобретают благородную лояльность." #NT!
 bgp_chambre_des_comptes_bureaucracy: "Счетная палата Дижона" #NT!
 bgp_chambre_des_comptes_bureaucracy_desc: "Герцогская счетная палата, официально оформленная указом Филиппа Смелого от 11 июля 1386 года и расположенная рядом с дворцом с 1460 года. Аудиторы (gens des comptes) регистрируют каждое дарственное письмо, каждое служебное положение и каждое отчуждение домена, прежде чем оно вступит в силу; их профессиональный персонал образует грамотный буржуазный обслуживающий класс, работающий по реестрам и двойной записи. Выдерживает любую смену режима с 1386 по 1791 год. Доступен везде, где находится Дижон." #NT!
 bgp_estates_of_burgundy_bureaucracy: "Поместья Бургундии" #NT!
 bgp_estates_of_burgundy_bureaucracy_desc: "Провинциальные сословия (духовенство, дворянство и дипломированные Bonnes Villes) собираются на регулярные сессии с момента присяги в 1361 году и соглашаются на налогообложение как даровой дон. Их избирательные комиссии, Общие Избранные, распоряжаются тем, что они предоставляют. Собрания Бургундии, Комтуа, Прованса и Дофинуа сохраняют свою собственную конституцию. Королевство функционирует как pays d'etat, процветающее и лояльное, пока у него спрашивают согласие; мятежник и сепаратист, когда это не так." #NT!
 bgp_vigueries_provence_bureaucracy: "Вигерии Прованса" #NT!
 bgp_vigueries_provence_bureaucracy_desc: "Унаследованные от Каролингов местной юстиции и объединенные Карлом I Анжуйским после 1246 года, провансальские вигерии делегируют гражданскую и уголовную юрисдикцию ежегодно сменяемому вигье, судье-заседателю и клавиру-казначею в каждом зарегистрированном городе. Эта система является неотъемлемой частью каждого торгового города от Экса до Йера, минуя сеньорские замки. Кодифицированный исследованиями 1252, 1298 и 1333 годов, он сохранился в нетронутом виде во французском королевском аппарате после 1481 года." #NT!
 bgp_apostolic_camera_bureaucracy: "Апостольская камера Авиньона" #NT!
 bgp_apostolic_camera_bureaucracy_desc: "Папский финансовый аппарат был реорганизован Иоанном XXII после 1316 года: более 650 наемных чиновников занимались аннатами, сервитиями и поручениями легатов из города клерков. Архив Папского дворца, апелляционный механизм Роты и партнерские отношения с банковскими домами Барди, Перуцци и Спини сохраняются еще долгое время после возвращения курии в Рим в 1377 году. Какое бы королевство ни принадлежало Авиньону, он унаследует самую централизованную церковную бюрократию христианского мира." #NT!
 bgp_lyon_fairs_bureaucracy: "Лионские ярмарки" #NT!
 bgp_lyon_fairs_bureaucracy_desc: "В письмах Людовика XI от августа 1463 года четыре ежегодные ярмарки Лиона (Богоявленская, Пасхальная, Августовская ярмарка, Всех Святых) были закреплены как привилегированная коммерческая франшиза королевства, намеренно отвлекающая торговлю от Женевы. Conservation des Foires (королевская судебная комиссия с сокращенной апелляционной процедурой) защищает торговцев, обеспечивает соблюдение переводных векселей через границы и превращает Августовскую ярмарку в расчетную палату для ренты и военных займов. К 1530-м годам банки Каппони, Строцци и Гонди превратили Лион в центр европейской платежной системы." #NT!
 bgp_grande_saunerie_bureaucracy: "Гранд Сонери де Сален" #NT!
 bgp_grande_saunerie_bureaucracy_desc: "Соляная монополия на юрские соляные скважины в Сален-ле-Бен, находившаяся под общим контролем с тех пор, как Жан де Шалон-Арле приобрел баронство в 1237 году. Карл Смелый консолидировал 419 акций Petite Saline между 1463 и 1477 годами; Габсбурги завершили выкуп в 1571 году. К 1590 году баня приносила 60 процентов доходов от владений графства Бургундия. Его величественные, укрепленные залы и постоянная инспекция представляют собой государственный аппарат в миниатюре: самое прибыльное отдельное королевское право в королевстве." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_bgp_bureaucracy_authority: "Бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_bgp_bureaucracy_authority: "При формировании [BGP.GetName] получает способность принимать историческую бюрократию, каждая из которых моделирует реальный институциональный слой Арелата, Бургундского государства Валуа, графа де Бургундии и провансальских земель." #NT!
