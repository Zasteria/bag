l_russian:
  # ============================================================ 
  # Variables (tooltip strings shown when set_variable fires) 
  # ============================================================ 
 nd_pnt_formed_tt: "Была создана Конфедерация Пинтадос." #NT!
 nd_pnt_path_a_tt: "Основана как Федерация Датус." #NT!
 nd_pnt_path_b_tt: "Основано как Братство Какарлонг." #NT!
 nd_pnt_path_c_tt: "Основана как Морская Конфедерация." #NT!
  
  # ============================================================ 
  # Static Modifiers: Formation Choices 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_pnt_federation_of_datus: "Федерация Датус" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_federation_of_datus: "Каждый дату Панай, Себу, Самара, Лейте, Бохола и Негроса отдал часть своей чести знамени совета. Совет объединяет свою власть в единое целое: королевства больше не враждуют, и острова говорят в один голос." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_kakarlong_brotherhood: "Братство Какарлонг" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_kakarlong_brotherhood: "Мастера татуировки нанесли основополагающие знаки на грудь каждого дату и поклялись воинам островов объединиться в одно братство мангаяу. Разрисованные люди жаждут испытать новое знамя на южных побережьях и северных морях." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_maritime_confederation: "Морская Конфедерация" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_maritime_confederation: "Триста корпусов балангая заложены на верфях Себу, Илоило и Таклобана. Внутренние моря Висайских островов теперь принадлежат одному народу, и их купцы будут возить жемчуг и золото из Сулу в Чампу под знаменем Пинтадоса." #NT!
  
  # ============================================================ 
  # Static Modifiers: Advance Event Choices 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_pnt_maragtas_law: "Кодифицированные Марагтас" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_maragtas_law: "Хроника десяти дат и законы Сумаквела написаны шрифтом байбайн и зачитываются вслух на каждом совете. Обычай становится законом." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_oral_memory: "Бинукот поют прошлое" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_oral_memory: "Уединенные знатные женщины сохраняют летопись как живое песнопение. «Марагтас» остается заученной песней, а не фиксированным текстом, и каждое поколение меняет ее под свое время." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_southern_seas: "Южный Мангаяв" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_southern_seas: "Рейдовые флоты поворачивают на юг, против побережья Сулу и Борнейского месторождения. Золото, рабы и невесты возвращаются в муниципальные дома." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_northern_seas: "Северный Мангаяу" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_northern_seas: "Рейдовый флот повернул на север, как это произошло в 1169 году, когда висайские татуированные воины пали на китайском побережье. Летописи династии Сун будут перечитываться с новым страхом." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_babaylan_order: "Орден Бабайлана" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_babaylan_order: "Жрицы диваты организованы в конфедеративный орден. Поклонение Анито теперь официально преподается с новичками, мастерами и наследием пения." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_diwata_pluralism: "Дивата Плюрализм" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_diwata_pluralism: "Каждый барангай хранит свою наследственную дивату. На островах не навязывается никакая вера, и странные верования иностранных торговцев терпятся наряду с местными духами." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_balangay_merchants: "Балангайские торговцы" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_balangay_merchants: "Капитаны бюргеров управляют внутренними морскими маршрутами от Себу до Илоило и Таклобана с ответвлениями на Миндоро и Минданао. Пан-Висайская экономика укрепляется." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_pintados_trade_office: "Торговый офис Пинтадос" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_pintados_trade_office: "Единая торговая организация, имеющая государственную лицензию на Себу, оценивает, взвешивает и тарифицирует каждую сделку между островами. Купцов раздражают налоги, но казна совета раздувается, и кредиты поступают из одной доверенной руки." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_defiance_of_mactan: "Вызов Мактана" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_defiance_of_mactan: "Имя Лапу-Лапу выгравировано на каждом прибрежном форте. Запад может принести свои паруса и свое железо, но нарисованные люди не преклонят колени." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_lessons_of_the_west: "Уроки Запада" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_lessons_of_the_west: "Пинтадос ведет торговлю с капитанами карабелл. Пушки поступают в арсеналы совета, а корабелы каракоа изучают иностранные корпуса." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_three_tongues_flourish: "Три языка процветают" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_three_tongues_flourish: "Грамматики хилигайнона, кебуано и варая печатаются рядом, все три формы сохранены правильно. Нарисованные острова сохраняют три голоса и называют всех трех Пинтадо." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_council_vernacular: "Язык Совета" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_council_vernacular: "Единая речь Пинтадоса состоит из трех висайских языков. И двор, и рынок, и барангай изучают новый разговорный язык; нарисованные люди становятся одним языком и одним знаменем." #NT!
  
  # ============================================================ 
  # Formation Event 
  # ============================================================ 
 nd_pnt.1.t: "Раскрашенное знамя над внутренними морями" #NT!
 nd_pnt.1.d: "Данные Панай дошли до Араута. Раджи Себу отплыли из Сугбо. Капитаны мореплавателей Самара и Лейте прибыли с восточных берегов. Вокруг костра совета сидят разрисованные люди Негроса и Бохола, а бабайланские жрицы скандируют имена каждого дивата, которого они оскорбят, если эта клятва будет нарушена.\n\nИспанцы уже говорят о висайцах только как о Лос-Пинтадос, Раскрашенных, как будто татуировки, записывающие каждую битву, каждый набег, каждого убитого врага, были нашей единственной меткой. Сегодня мы делаем эти татуировки баннером. Королевства, воевавшие друг с другом на протяжении двух столетий, объединяют свою честь под единой печатью Конфедерации: Кабисай-ан, нарисованные острова, суверенные и объединившиеся.\n\nСовет обсуждает, как эта новая нация скажет свое первое слово.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pnt.1.a: "Федерация Датус: связать совет клятвенным законом" #NT!
 nd_pnt.1.b: "Братство Какарлонг: объедините раскрашенных людей в один мангаяу." #NT!
 nd_pnt.1.c: "Морская Конфедерация: пусть балангайские корпуса несут наш флаг" #NT!
  
  # ============================================================ 
  # Advance Events 
  # ============================================================ 
 nd_pnt.2.t: "Марагты в Доме Совета" #NT!
 nd_pnt.2.d: "Обычаи Дату Сумаквела сохранились в пении бинукот, уединенных женщин знатного происхождения, чьи голоса хранят законы. Совет обсуждает, закрепить ли Марагтас письмом байбайн в качестве писаного закона или же жизнь хроники заключается в ее пении." #NT!
 nd_pnt.2.a: "Вырежьте законы на бамбуке" #NT!
 nd_pnt.2.b: "Пусть пение останется законом" #NT!
  
 nd_pnt.3.t: "Совет Мангаяу" #NT!
 nd_pnt.3.d: "Молодые воины Себу, Бохола и Самара требуют великого мангаяу, морского рейда, достойного надписи на каждом сундуке. Совет должен выбрать свой океан: юг против золота Сулу и Борнео или север против богатых берегов Поднебесной, как говорят хроники, сделали наши предки в 1169 году." #NT!
 nd_pnt.3.a: "Юг: золотые берега Сулу и Борнео." #NT!
 nd_pnt.3.b: "Север: место, где наши предки совершили набег на Сун" #NT!
  
 nd_pnt.4.t: "Бабайланский вопрос" #NT!
 nd_pnt.4.d: "На всех островах жрицы-бабайланы служат тысячам местных диват, у каждого барангая свой пантеон. Совет должен решить, объединить ли жриц в единый конфедеративный орден с послушниками и мастерами и фиксированным пением, или оставить каждому барангаю свободу сохранять своих собственных духов предков." #NT!
 nd_pnt.4.a: "Орден Бабайлана" #NT!
 nd_pnt.4.b: "Каждый барангай хранит свою дивату." #NT!
  
 nd_pnt.5.t: "Договор о Внутреннем море" #NT!
 nd_pnt.5.d: "Капитаны-бюргеры из всех портов Висайи требуют от совета ратифицировать их договор. Купцы хотят единого внутреннего морского рынка; совет должен решить, как им управлять.\n\nТорговцы Себу и Илоило выступают за хартию свободного прохода, позволяющую загружать каждый балангай данных в любую гавань, находящуюся под властью Пинтадоса. Казначейство Себу выступает за создание единого торгового офиса Pintados с государственной лицензией, который оценивает, взвешивает и тарифицирует каждую транзакцию." #NT!
 nd_pnt.5.a: "Договор о свободном проходе: торговцы любого дату могут свободно торговать." #NT!
 nd_pnt.5.b: "Торговый офис Пинтадос в Себу: одна лицензированная торговая организация." #NT!
  
 nd_pnt.6.t: "Паруса на Мактане" #NT!
 nd_pnt.6.d: "Странные корабли прибыли. Их капитан Магальяйнс требует дату от раджи Себу и угрожает огнём любому дату, который откажется. Лапу-Лапу Мактана отвечает сталью.\n\nСовет должен решить, какими будут нарисованные острова, когда разразится шторм западных парусов: врагом, который смиряет их на каждом берегу, или учеником, который возьмет их пушки и карабеллы и направит их на их собственные берега." #NT!
 nd_pnt.6.a: "Неповиновение: укрепите против них все берега." #NT!
 nd_pnt.6.b: "Учись: бери их железо и их корпуса" #NT!
  
 nd_pnt.7.t: "Висайский синтез" #NT!
 nd_pnt.7.d: "Три народа, один язык на совете: хилигайнон Панай, кебуано центральных островов и варай Самара и Лейте начали разделять нечто большее, чем просто нарисованное знамя. Песни пересекаются. Кастрюли крестовые. Диалекты сближаются друг с другом на рынках и на скамьях гребцов.\n\nТипографии на Себу задали шрифт. Совет обсуждает, стоит ли поставить три висайские грамматики рядом и позволить всем трем формам называться правильными, или создать единый советский жаргон и назвать его речью Пинтадоса." #NT!
 nd_pnt.7.a: "Напечатайте три грамматики: пусть языки процветают" #NT!
 nd_pnt.7.b: "Создайте один советский жаргон из всех трех" #NT!
  
  # ============================================================ 
  # Advances 
  # ============================================================ 
 nd_pnt_balangay_shipwrights: "Балангайские корабелы" #NT!
 nd_pnt_balangay_shipwrights_desc: "Лодка с выносными опорами из досок и нервюр висайских мореплавателей, балангай, является основной единицей идентичности на островах: каждая прибрежная деревня может заложить такую ​​лодку, а каждый капитан может иметь ее экипаж. Специализированные верфи теперь выпускают более крупные корпуса, способные пересекать открытое море." #NT!
 nd_pnt_datu_council: "Совет Датуса" #NT!
 nd_pnt_datu_council_desc: "Каждый значительный остров отправляет свои данные в большой советский дом. Власть объединяется, а не сдается: совет решает вопросы войны и договора, и его постановления имеют вес все присутствовавшие на нем данные." #NT!
 nd_pnt_maragtas_codex: "Кодекс Марагтас" #NT!
 nd_pnt_maragtas_codex_desc: "Основополагающим мифом конфедерации становится хроника Дату Сумаквела и десяти дату Борнео, бежавших на север, в Панай, купивших низменности у царя Ати Марикудо за золотой садок." #NT!
 nd_pnt_timawa_freemen: "Тимава Фримен" #NT!
 nd_pnt_timawa_freemen_desc: "Между датусом и орипуном стоит тимава: свободные воины-простолюдины, владеющие оружием, несущие службу на войне, но не в сельском хозяйстве, и образующие копье каждого барангая. Конфедерация делает тимаву признанным классом на всех островах." #NT!
 nd_pnt_baybayin_visayan: "Висаян Байбаин" #NT!
 nd_pnt_baybayin_visayan_desc: "Индийское письмо байбайн адаптировано к группам согласных хилигайнон, кебуано и варай. Писцы совета могут записывать решения совета, бракосочетание бинукот и золото, причитающееся в качестве выкупа за невесту." #NT!
 nd_pnt_kakarlong_orders: "Какарлонг Приказы" #NT!
 nd_pnt_kakarlong_orders_desc: "Ордена татуированных воинов официально оформлены на всех островах. Каждая татуировка фиксирует подвиг: убитый враг, успешный рейд, защищенная деревня. Полностью татуированный воин — это ходячая книга доблести, и совет, который собирает таких людей, сам по себе вызывает страх." #NT!
 nd_pnt_mangayaw_fleets: "Рейдовые флоты Мангаяу" #NT!
 nd_pnt_mangayaw_fleets_desc: "Мангаяу, великий морской набег, официально оформлен как практика Конфедерации, а не как частное приключение. Целые флоты балангаев плывут под раскрашенным знаменем, и каждое успешное возвращение поднимает честь всей конфедерации." #NT!
 nd_pnt_babaylan_synod: "Бабайланский Синод" #NT!
 nd_pnt_babaylan_synod_desc: "Жрицы диваты, целители и оракулы островов собираются в конфедеративный синод. Анитизм становится признанной религией с формальным обучением, преемственностью и межостровным признанием старшинства жрицы." #NT!
 nd_pnt_pearl_divers: "Сулу Перл Дайверс" #NT!
 nd_pnt_pearl_divers_desc: "Висайские фридайверы и жемчужный флот Сулу работают на рифах внутренних морей. Жемчуг кормит ювелиров Себу и Илоило и платит за шелк и фарфор, которые муниципалитет покупает на китайских джонках." #NT!
 nd_pnt_inner_sea_trade: "Внутренняя морская торговая сеть" #NT!
 nd_pnt_inner_sea_trade_desc: "Парийские рынки Себу, Илоило и Таклобана связаны общим бюргерским договором. Висайское море больше не является серией независимых местных экономик, а представляет собой единый кругооборот хлопка, риса, жемчуга, золота и шелка." #NT!
 nd_pnt_lapu_lapu_legacy: "Наследие Лапу-Лапу" #NT!
 nd_pnt_lapu_lapu_legacy_desc: "Утром 27 апреля 1521 года дату Мактана встретил Магальяеша в прибое и убил его тысячей своих тимава. Раскрашенные человечки доказали, что западное железо не неуязвимо. Каждый прибрежный форт перестраивается с учетом этого утра." #NT!
 nd_pnt_visayan_goldsmiths: "Висайские ювелиры" #NT!
 nd_pnt_visayan_goldsmiths_desc: "Пандайские кузнецы Себу и Бутуана унаследовали тысячелетнюю историю зернения, репуса и золотониточного плетения. Висайские украшения периода Высокой Конфедерации известны от Чампы до Брунея и Макао." #NT!
 nd_pnt_visayan_synthesis: "Висайский синтез" #NT!
 nd_pnt_visayan_synthesis_desc: "Хилигайнон на Панайе, кебуано на центральных островах и Варай на Самаре и Лейте начинают объединяться под знаменем Конфедерации. Торговые пиджины прочно вошли в общий словарный запас, на островах проводятся общие фестивали, и появляется узнаваемая идентичность Пинтадос, которая не принадлежит ни одному из трех, а всем им." #NT!
 nd_pnt_lipong_warriors: "Липонг Ветераны" #NT!
 nd_pnt_lipong_warriors_desc: "Липонг — воин, настолько покрытый татуировками, что нетронутой кожи не остается. Каждая отметка отражает выжившую битву. Совет резервирует звание липонг для ветеранов трех кампаний Конфедерации и делает их ударным оружием каждой армии." #NT!
 nd_pnt_visayan_admiralty: "Висайское Адмиралтейство" #NT!
 nd_pnt_visayan_admiralty_desc: "Создается управление адмиралтейства, которое координирует флоты балангаев и каракоа на каждом острове, направляет великий мангаяу и назначает блокадные станции каждой эскадре Конфедерации." #NT!
 nd_pnt_archipelagic_governance: "Архипелажное управление" #NT!
 nd_pnt_archipelagic_governance_desc: "Конфедеративная модель масштабируется: провинциальные советы являются посредниками между данными острова и великим советом, а реестр тимава и орипуна ведется по всему архипелагу. Нарисованные люди учатся управлять государством, а не федерацией распрей." #NT!
 nd_pnt_karakoa_fleets: "Каракоа Флоты" #NT!
 nd_pnt_karakoa_fleets_desc: "Каракоа — это огромный висайский военный корабль с выносными опорами: 100 гребцов, боевые палубы из приподнятых досок, высокий нос и имя, выкрикиваемое дату, который им командует. Флагманы Каракоа возглавляют каждую эскадру флота Конфедерации." #NT!
 nd_pnt_visayan_militia: "Барангайская милиция" #NT!
 nd_pnt_visayan_militia_desc: "Каждая прибрежная деревня становится оборонительным узлом, где настороже находятся сторожевые вышки, сигнальные костры и обученные тимавы. Нарисованные острова защищаются не от одной столицы, а сразу от тысячи барангаев." #NT!
 nd_pnt_visayan_diaspora: "Висайская диаспора" #NT!
 nd_pnt_visayan_diaspora_desc: "Висайские поселенцы переправляются на Палаван, на северное побережье Минданао, в Сабах и на архипелаг Сулу. Раскрашенное знамя становится эталоном эмигрантского народа, который носит свои татуировки и свой балангай везде, где бы они ни поставили барангай." #NT!
 nd_pnt_pintados_arsenal: "Пинтадос Арсенал" #NT!
 nd_pnt_pintados_arsenal_desc: "Арсенальный комплекс Конфедерации охватывает Илоило и Себу, где отливают пушки, куют огнестрельное оружие и обучают артиллеристов. Раскрашенные мужчины, которые впервые познакомились с порохом у китайских и борнейских торговцев, теперь изготавливают его самостоятельно." #NT!
 nd_pnt_visayan_letters: "Висайские письма" #NT!
 nd_pnt_visayan_letters_desc: "Процветает хилигайнонская и кебуанская народная печать. Издания Марагтас, циклы песнопений бабайлан, хроники дату и даже свод законов совета широко читаются. Нарисованные люди становятся грамотными на своих трех языках." #NT!
 nd_pnt_modernised_kakarlong: "Модернизированный Какарлонг" #NT!
 nd_pnt_modernised_kakarlong_desc: "Традиция воинов-татуировок сочетается с мушкетом и дисциплинированной линией. Ветераны Липонга проходят строевую подготовку вместе с молодыми новобранцами, а отметина на груди солдата теперь свидетельствует как о древних подвигах, так и о современных кампаниях." #NT!
 nd_pnt_visayan_navy: "Пинтадос ВМФ" #NT!
 nd_pnt_visayan_navy_desc: "Регулярный флот Конфедерации патрулирует внутренние моря под одним флагом, а не как коалиция флотов данных. К флагманам Каракоа присоединяются артиллерийские фрегаты европейского дизайна, все они несут нарисованные знамена." #NT!
 nd_pnt_kabisayan_nation: "Кабисай-Нация" #NT!
 nd_pnt_kabisayan_nation_desc: "В эпоху национального пробуждения нарисованные острова артикулируют себя как единый народ Кабисай: гражданская нация, объединенная языком, традициями татуировок, марагтами и долгой памятью о совете." #NT!
 nd_pnt_island_industrialists: "Островные промышленники" #NT!
 nd_pnt_island_industrialists_desc: "Висайские острова вступают в индустриальную эпоху как федерация портовых городов. Текстильные фабрики Илоило, металлургические заводы Себу и верфи Таклобана образуют островной промышленный коридор, ведущий экспорт через Азию." #NT!
 nd_pnt_pintados_steam_navy: "Пинтадос Steam Navy" #NT!
 nd_pnt_pintados_steam_navy_desc: "Верфи Себу заложили броненосцы рядом с последним каракоа. Раскрашенное знамя теперь развевается на стальных корпусах, патрулирующих внутренние моря, Южно-Китайское море и протяженные побережья висайской диаспоры." #NT!
 nd_pnt_kabisayan_universities: "Кабисаянские университеты" #NT!
 nd_pnt_kabisayan_universities_desc: "Университеты основаны в Себу, Илоило и Таклобане. Грамотная элита разрисованных мужчин, обученная трем висайским языкам, а также испанскому и английскому, становится мостом между азиатским и европейским образованием." #NT!
  
  # ============================================================ 
  # Units 
  # ============================================================ 
 a_nd_pnt_timawa: "Тимава Фримен" #NT!
 a_nd_pnt_timawa_desc: "Свободные воины-простолюдины, которые владеют оружием и обязаны служить на войне, но не в полевых условиях. Основа линии копий и щитов каждого барангая." #NT!
 a_nd_pnt_kakarlong: "Какарлонгские воины" #NT!
 a_nd_pnt_kakarlong_desc: "Покрытые татуировками ударные отряды приняли присягу в братство Конфедерации. Они обвиняют в выкрикивании имени каждого дивата, который станет свидетелем их деяний." #NT!
 a_nd_pnt_lipong: "Липонг Ветераны" #NT!
 a_nd_pnt_lipong_desc: "Подошвы их ног покрыты татуировками, каждая из которых является знаком пережитой битвы. Липонги — это ударное оружие армий Конфедерации, и у врага, который видит их приближение, есть причины бояться." #NT!
 n_nd_pnt_balangay_raider: "Балангайский рейдер" #NT!
 n_nd_pnt_balangay_raider_desc: "Длиннокилевая рейдовая галера с одинарной мачтой, вытянутой боевой палубой и гребцами класса тимава. На этих корпусах ездят флоты мангаяу." #NT!
 n_nd_pnt_karakoa: "Каракоа" #NT!
 n_nd_pnt_karakoa_desc: "Огромный висайский военный корабль, гигант с выносными опорами на 100 гребцов, чьи поднятые боевые палубы и высокий нос превращают его в плавучий форт. Каждая каракоа названа в честь дату, который ею командует." #NT!
 n_nd_pnt_ironclad: "Пинтадос Броненосец" #NT!
 n_nd_pnt_ironclad_desc: "Железный паровой фрегат спущен на воду с верфей Себу. Раскрашенные мужчины переносят традицию балангая в эпоху пара." #NT!
 n_nd_pnt_balangay: "Балангай" #NT!
 n_nd_pnt_balangay_desc: "Базовая опора из досок и ребер любой прибрежной деревни Висайи. Дешевый в строительстве, быстрый, в большом количестве набранный у бюргерских капитанов." #NT!
  
  # ============================================================ 
  # Levies 
  # ============================================================ 
 levy_nd_pnt_kakarlong_warriors: "Какарлонг Леви" #NT!
 levy_nd_pnt_kakarlong_warriors_desc: "Братство Тату-воинов, выросшее из солдатского сословия." #NT!
 levy_nd_pnt_timawa_freemen: "Тимава Леви" #NT!
 levy_nd_pnt_timawa_freemen_desc: "Свободные воины-простолюдины, призванные из крестьян и солдатского сословия." #NT!
 levy_nd_pnt_balangay: "Балангай Леви" #NT!
 levy_nd_pnt_balangay_desc: "Лодки с выносными опорами, принадлежащие бюргерам, с крестьянами и рабочими гребцами, поднятые прибрежными деревнями конфедерации." #NT!
  
  # ============================================================ 
  # Buildings 
  # ============================================================ 
 nd_pnt_balangay_yard: "Балангайский двор" #NT!
 nd_pnt_balangay_yard_desc: "Прибрежная верфь, специализирующаяся на производстве длиннокилевых аутригеров Visayan. Строит и ремонтирует флот конфедерации." #NT!
 nd_pnt_council_house: "Дом Совета Дату" #NT!
 nd_pnt_council_house_desc: "Большой зал, в котором заседают советы представителей каждого острова. Принятые здесь решения связывают нарисованные острова." #NT!
 nd_pnt_babaylan_shrine: "Храм Бабайлан" #NT!
 nd_pnt_babaylan_shrine_desc: "Центр анитистского поклонения и обучения бабайлану. Целители, оракулы и жрицы поднимаются сюда по приказу синода." #NT!
 nd_pnt_parian_market: "Парийский рынок" #NT!
 nd_pnt_parian_market_desc: "Обнесенная стеной внутриморская биржа, где торговцы из Висаи, Китая, Борнея и Сулу торгуют жемчугом, золотом, хлопком и рисом в соответствии с общим парийским договором." #NT!
 nd_pnt_panday_workshop: "Мастерская Пандай" #NT!
 nd_pnt_panday_workshop_desc: "Район ювелиров, где производятся грануляционные изделия, репуссированные пластины и ткачество с золотой нитью в соответствии с давними традициями Себу-Буту." #NT!
 nd_pnt_kabisayan_arsenal: "Кабисаян Арсенал" #NT!
 nd_pnt_kabisayan_arsenal_desc: "Комплекс Пан-Висайского военного арсенала по литью пушек, ковке огнестрельного оружия и обучению артиллерийских расчетов армий Конфедерации." #NT!
 nd_pnt_kabisayan_university: "Кабисаянский университет" #NT!
 nd_pnt_kabisayan_university_desc: "Высшее учебное заведение с преподаванием на висайском языке, сочетающее местную правовую традицию с европейскими и китайскими буквами." #NT!
  
  # ============================================================ 
  # Production methods 
  # ============================================================ 
 nd_pnt_panday_jewelry: "Висайское ювелирное дело" #NT!
 nd_pnt_panday_jewelry_desc: "Грануляция, репуссирование и золотониточное плетение в традиции пандая с использованием местного жемчуга и золота." #NT!
 nd_pnt_balangay_yard_maintenance: "Уход за двором" #NT!
 nd_pnt_balangay_yard_maintenance_desc: "Пиломатериалы, военно-морские припасы, смола и волокно, чтобы верфь занималась распиловкой корпусов." #NT!
 nd_pnt_council_house_maintenance: "Обслуживание Совета" #NT!
 nd_pnt_council_house_maintenance_desc: "Древесина, каменная кладка, пчелиный воск и бумага для поддержки собранных данных и их писцов." #NT!
 nd_pnt_babaylan_shrine_maintenance: "Подношения святыни" #NT!
 nd_pnt_babaylan_shrine_maintenance_desc: "Свечи из пчелиного воска, благовония, тканая ткань и ритуальная керамика для диват." #NT!
 nd_pnt_parian_market_maintenance: "Обслуживание рынка" #NT!
 nd_pnt_parian_market_maintenance_desc: "Ткань, керамика, рис и рыба закупаются в париане для торгового договора." #NT!
 nd_pnt_kabisayan_arsenal_maintenance: "Техническое обслуживание Арсенала" #NT!
 nd_pnt_kabisayan_arsenal_maintenance_desc: "Вооружение, огнестрельное оружие, лесоматериалы и железо хранятся для обучения артиллерийских расчетов конфедерации." #NT!
 nd_pnt_kabisayan_university_maintenance: "Техническое обслуживание университета" #NT!
 nd_pnt_kabisayan_university_maintenance_desc: "Бумага, книги, свечи из пчелиного воска и керамика для школ, библиотек и типографий университетов." #NT!
  
  # ============================================================ 
  # Destiny Tree 
  # ============================================================ 
  
  # --- Destiny Advances --- 
 nd_pnt_destiny: "Апекс нарисованного знамени" #NT!
 nd_pnt_destiny_desc: "Пан-Висайская конфедерация проходит путь от основания до вершины. Знамя совета теперь без вопросов летит из Панай в Самар, и нарисованные люди начинают спорить о том, какой будет их нация в следующем столетии." #NT!
  
 nd_pnt_dest_united_council: "Объединенный совет Раскрашенных островов" #NT!
 nd_pnt_dest_united_council_desc: "Передать все четыре второстепенных якорных острова (Самар, Бохол, Негрос и Масбате) полностью под власть совета. С Баси, Бо-олом, Баго и Масбате, заседающими в совете, Висайский архипелаг подчиняется одному знамени." #NT!
  
 nd_pnt_dest_visayan_renaissance: "Визайский Ренессанс" #NT!
 nd_pnt_dest_visayan_renaissance_desc: "Примите легализм, возьмите Тондо на Лусоне и накопите золото (2000 г.) и престиж (50 г.) для финансирования конфедеративной культурной эпохи. Нарисованные мужчины становятся покровителями литературы, искусства и индийского образования." #NT!
  
 nd_pnt_dest_kabisayan_apex: "Кабисай-ан Апекс" #NT!
 nd_pnt_dest_kabisayan_apex_desc: "Охватите печатную прессу, удерживайте Бутуан (центр ювелирных мастерских Минданао) и Майнилу и достигните золота 3000, престижа 75. Гражданская висайская нация полностью сформирована: грамотная, торговая, федеративная, окрашенная. Открывает Зал Большого Совета." #NT!
  
 nd_pnt_dest_sulu_mastery: "Сулу Морское Мастерство" #NT!
 nd_pnt_dest_sulu_mastery_desc: "Завоюйте Маймбунг и Бонгао на архипелаге Сулу и выставьте не менее 30 полков. Открывается южная граница рейда, и раскрашенные люди заменяют раджу Сулу в качестве хозяев моря между ними." #NT!
  
 nd_pnt_dest_borneo_beachheads: "Плацдармы Борнео" #NT!
 nd_pnt_dest_borneo_beachheads_desc: "Возьмите Беруне (столицу Брунея) и Суригао на северном побережье Минданао. Выставьте 50 полков и удерживайте 2000 золотых. Флоты мангаяу высаживаются там, где хроники позволяют им только совершать набеги." #NT!
  
 nd_pnt_dest_spice_talassocracy: "Талассократия Моря Пряностей" #NT!
 nd_pnt_dest_spice_talassocracy_desc: "Удерживайте Тернате и Тидоре, острова специй Малуку. Выставьте 75 полков при престиже 75. Зона Пинтадос Сулу достигает островов специй; нарисованное знамя реет над внутренним морем, морем Сулу и Молуккскими островами. Открывает рейдовую якорь Пинтадос." #NT!
  
  # --- Destiny Events --- 
  
 nd_pnt.8.t: "Апекс нарисованного знамени" #NT!
 nd_pnt.8.d: "Огонь совета в Арауте горит ярче, чем любой другой на памяти живущих. Датус каждого острова, бабайлан каждого барангая, капитаны тимава каждой прибрежной деревни пришли, чтобы заявить, что нарисованная нация больше не является формирующейся федерацией: это федерация в действительности.\n\nСейчас совет обсуждает, какой нацией станет." #NT!
 nd_pnt.8.a: "Раскрашенные острова возвышаются как один" #NT!
  
 nd_pnt.9.t: "Совет Четырех островов" #NT!
 nd_pnt.9.d: "Бэйси говорит от имени Самара. Бо-ол говорит от имени Бохола. Баго говорит от имени негров. Масбате говорит само за себя. Поскольку раджи Панай и Себу уже заняли свои места, каждый выход на берег Висайцев теперь подчиняется единому совету.\n\nТеперь совет должен решить, какую форму примет его власть. Некоторые требуют принятия закона Конфедерации, изложенного в байбайне: письменного кодекса, который скрепляет все данные клятвой и законом. Вместо этого старейшины выступают за сандуго, записанный в хрониках кровный договор: верность, связанную ритуалом и личной честью, как десять данных Борнео связали себя Марикудо." #NT!
 nd_pnt.9.a: "Привязка данных к писаному закону Конфедерации" #NT!
 nd_pnt.9.b: "Связать данные с помощью кровяного сгустка Сандуго" #NT!
  
 nd_pnt.10.t: "Ренессанс нарисованных людей" #NT!
 nd_pnt.10.d: "Караваны с данью Тондо прибывают на Себу. В казне достаточно средств, чтобы выполнить все, что пожелает совет. Бабайланский синод встречается с писцами Хилигайнона в зале трех языков, и вспыхивает ссора: будет ли этот золотой век судом покровителей или грамотным гражданским порядком конфедерации?" #NT!
 nd_pnt.10.a: "Покровитель бинукота, пандая, художника" #NT!
 nd_pnt.10.b: "Выведите три висайские грамматики и код совета." #NT!
  
 nd_pnt.11.t: "Кабисайан, «Нарисованная одна нация»" #NT!
 nd_pnt.11.d: "Серебро Майнилы, золото Бутуана, жемчуг Себу и хлопок Илоило числятся в одном муниципальном реестре. Типографии работают одновременно в Хилигайноне, Себуано и Варае. Нарисованные острова — это уже не три народа, а один гражданский Кабисай — нация с грамотной элитой, федеративным собранием и торговыми домами, достигающими Чампы, Макао и Брунея.\n\nКакую форму примет эта вершина?" #NT!
 nd_pnt.11.a: "Висайская гражданская конституция" #NT!
 nd_pnt.11.b: "Паназиатская торговая федерация." #NT!
  
 nd_pnt.12.t: "Море Сулу замолкает" #NT!
 nd_pnt.12.d: "Флаг раджи Сулу спущен в Маймбунге. Пиратские данные Бонгао выплывают под охраной. Знамя Пинтадоса теперь реет над южным морем.\n\nПленные капитаны Ирануна преклоняют колени перед советом. Они снова поплывут. Вопрос только в том, по чьему приказу. Некоторые советники выступают за каперские грамоты: оставьте корсарам их команды и флот и позвольте им плавать под управлением Пинтадо. Другие требуют прямой интеграции: их корпуса разобраны на верфи Совета, их экипажи переведены в стандартизированные эскадрильи под королевское жалованье." #NT!
 nd_pnt.12.a: "Выдавать корсарские поручения капитанам Ирануна." #NT!
 nd_pnt.12.b: "Интегрируйте флот Сулу в адмиралтейство совета." #NT!
  
 nd_pnt.13.t: "Земля Мангаяу в Брунее" #NT!
 nd_pnt.13.d: "Беруне горит под нарисованным знаменем. Побережье Суригаонон на Минданао склоняется перед знаменем совета. Хроники северного набега 1169 года читаются у каждого костра, но на этот раз флот не вернулся. Они остались.\n\nКак совет сможет узаконить это завоевание, помимо рейда?" #NT!
 nd_pnt.13.a: "Постоянный десантный корпус Какарлонга" #NT!
 nd_pnt.13.b: "Постоянные рейды каракоа" #NT!
  
 nd_pnt.14.t: "Лук Островов специй" #NT!
 nd_pnt.14.d: "Султан Тернате преклоняет колени на носу каракоа «Пинтадос». Под раскрашенным баннером стоят склады специй Тидоре. От Сулу до Молуккских островов каждая гавань платит дань одному совету. Зона Сулу теперь является зоной Пинтадос, и хроники южных грабителей написаны висайскими чернилами.\n\nКак будет управляться империя специй?" #NT!
 nd_pnt.14.a: "Светлость похитителя специй: перец, сахар, лезвие." #NT!
 nd_pnt.14.b: "Владычество на Внутреннем море: дань, флот, знамя." #NT!
  
  # --- Destiny Static Modifiers --- 
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_patron_arts: "Покровители живописного искусства" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_patron_arts: "Муниципальные дома становятся патронатными судами. Песня Бинукот, золото пандай и художники Себу рисуют мигрантов со всего архипелага, в то время как на старых буровых площадках Тимавы тихо." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_three_tongues: "Три языка образовали буквы" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_three_tongues: "Печатные грамматики хилигайнонского, кебуанского и варайского языков распространяются в каждом муниципальном доме. Появляется грамотный гражданский класс, и нарисованные острова начинают говорить как один народ на трех языках." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_civic_nation: "Гражданская висайская нация" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_civic_nation: "Совет становится парламентом. Места дату передаются по наследству, но проверяются, свободные жители тимава посылают делегатов, а ассамблея управляет нарисованными островами как конституционная конфедерация." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_mercantile_federation: "Торговая федерация Пинтадос" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_mercantile_federation: "Торговые дома Pintados закреплены в Макао, Малакке и Брунее. Раскрашенное знамя становится кредитной маркой на морских рынках Азии." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_kakarlong_landing_corps: "Десантный корпус Какарлонга" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_kakarlong_landing_corps: "Татуированные братства реорганизуются в постоянный десантный корпус для межостровной войны. Они тренируются усерднее, быстрее восстанавливаются, и совет платит за их инициативу, но с дипломатами не консультируются." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_karakoa_lanes: "Рейдовые переулки Каракоа" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_karakoa_lanes: "Постоянные эскадрильи каракоа патрулируют Сулу, Борнео и Миндоро по фиксированным маршрутам рейдов. Галеры дешевле содержать в море, а раскрашенное знамя украшает каждую карту южных вод." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_spice_reaver_lords: "Лорды-похитители специй" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_spice_reaver_lords: "В Себу всыпаем перец Малуку и сахар. Раскрашенные корпуса становятся жестче с призовыми деньгами. Но рисовые поля на родных островах истощаются, поскольку слишком много молодых людей гоняются за экономикой с пряностями и лезвиями через южные моря." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_inner_sea_dominion: "Доминион Внутреннего Моря" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_inner_sea_dominion: "От Сулу до Малуку каждая гавань отдает дань уважения совету Пинтадоса. Иностранные послы признают нарисованное знамя крупной азиатской державой, а флоты, выплачивающие дань, становятся постоянным атрибутом внутренних морей." #NT!
  
 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sworn_law: "Совет связан клятвенным законом" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sworn_law: "Данные приносят клятву верности письменному кодексу Конфедерации, записанному в байбайне и зачитываемому вслух на каждом сеансе. Совет становится судом, а также собранием вождей." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sandugo: "Совет, связанный Сандуго" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sandugo: "Данные связывают себя сандуго, записанным в хрониках кровным заговором: чаша вина, смешанная с кровью каждого вождя, выпивается по очереди. Верность носит личный, ритуальный характер и передается по наследству от отца к сыну." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_dest_iranun_commission: "Иранунские каперские грамоты" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_iranun_commission: "Захваченные в плен капитаны-корсары Сулу снова отправляются в плавание, на этот раз под каперскими грамотами совета. Их добыча возвращается на Себу, но испанцы, жители Борнея и макасарцы выражают новые претензии к нарисованному знамени." #NT!
 STATIC_MODIFIER_NAME_nd_pnt_dest_sulu_admiralty: "Совет Адмиралтейства Сулу" #NT!
 STATIC_MODIFIER_DESC_nd_pnt_dest_sulu_admiralty: "Захваченный флот Сулу разбит; их корпуса снабжают верфи Себу и Илоило, их экипажи получают королевскую зарплату и переводятся в стандартизированные эскадрильи. Дисциплина заменяет грабеж как закон южного моря." #NT!
  
  # --- Destiny Buildings --- 
 nd_pnt_dest_grand_council_hall: "Зал Большого Совета" #NT!
 nd_pnt_dest_grand_council_hall_desc: "Высший муниципальный дом федеративных Висайских островов. Зал конституционного собрания из камня и дерева, где каждый делегат дату, тимава и представитель горожан имеет место по федеральному праву." #NT!
  
 nd_pnt_dest_raid_anchorage: "Пинтадос Рейд Анкоридж" #NT!
 nd_pnt_dest_raid_anchorage_desc: "Укрепленная военно-морская база рейдовой империи Пинтадос. Здесь зимуют флагманы Каракоа, десантный корпус Какарлонг тренируется на пляже, а призовые корабли закапываются и переоборудуются для следующего мангаяу." #NT!
  
 nd_pnt_dest_grand_council_hall_maintenance: "Обслуживание зала Совета" #NT!
 nd_pnt_dest_grand_council_hall_maintenance_desc: "Бумага, тонкая ткань, свечи из пчелиного воска и глиняная посуда позволяют федеративному собранию работать круглый год." #NT!
  
 nd_pnt_dest_raid_anchorage_maintenance: "Техническое обслуживание Анкориджа" #NT!
 nd_pnt_dest_raid_anchorage_maintenance_desc: "Древесина, военно-морские припасы, деготь и вооружение для поддержания готовности рейдового флота и вооружения десантных корпусов." #NT!
  
  # ===== BUREAUCRACIES ===== 
 pnt_datu_council_bureaucracy: "Дату Совет Маджа-аса" #NT!
 pnt_datu_council_bureaucracy_desc: "Конфедерация верховных данных, основанная в легендах Дату Сумаквелом, объединяет висайских кедатуанов в единый орган, который узаконивает распри, распределяет добычу, полученную при набегах, и дисциплинирует непокорных вождей. При этом совет подчиняется Аклану; если не обращать внимания, длинный дом каждого датау становится собственным двором." #NT!
 pnt_babaylan_order_bureaucracy: "Бабайлан Дух-Средний Орден" #NT!
 pnt_babaylan_order_bureaucracy_desc: "Бабайлан - жрицы-анитистки, которые исцеляют больных, санкционируют сбор урожая и ходатайствуют перед диватой; в отсутствие данных они берут на себя временную власть над барангаем. Спонсируемый государством, орден образует последовательную ритуальную линию; заброшенные, отколовшиеся культы множатся, и грань между колдовством и поклонением стирается." #NT!
 pnt_lipong_brotherhood_bureaucracy: "Татуированное Братство Липонг" #NT!
 pnt_lipong_brotherhood_bureaucracy_desc: "Липонги — самые многочисленные татуированные воины-бинатаканы, каждая из которых получена за подвиги в рейдах на мангаяу; татуировки на лице принадлежат только проверенным убийцам. Как учреждение братство поддерживает постоянный ветеранский корпус; забытые, липонги попадают в частные банды, враждующие из-за чести и добычи." #NT!
 pnt_mangayaw_fleet_bureaucracy: "Флот Каракоа-Мангаяу" #NT!
 pnt_mangayaw_fleet_bureaucracy_desc: "Абай — это скоординированный флот каракоа и балангая, который каждый сезон ходит по Висайским морям, чтобы забирать пленников, головы и дань. Получив финансирование, он возвращается с рабами и золотом для капитанов тимава; заброшенные, бездействующие команды становятся пиратами или продаются конкурирующим данным, и название королевства становится синонимом рейда." #NT!
 pnt_oripun_bondage_bureaucracy: "Реестр Орипуна Совета" #NT!
 pnt_oripun_bondage_bureaucracy_desc: "Висайское обычное право позволяло долгам ввергать свободного человека в рабство урипона, при этом обязательства передавались его детям. Государственные реестры, хранящиеся в каждом длинном доме данных, сдерживают самые разрушительные злоупотребления со стороны влиятельных вождей и кодифицируют ограничения на то, что может требовать кредитор, но они не могут отменить систему, вплетенную в доколониальное богатство. Не получив принуждения, орипуны скрываются в лесах, дань бухи не выплачивается, и сельские властелины разрешают споры путем набегов." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_pnt_bureaucracy_authority: "Бюрократический орган Пинтадоса" #NT!
 AUTO_MODIFIER_DESC_nd_pnt_bureaucracy_authority: "При формировании [PNT.GetName] получает право размещать исторические учреждения Пинтадоса. Место первостепенного значения в столице предоставляет одно место; этот орган добавляет еще два." #NT!
