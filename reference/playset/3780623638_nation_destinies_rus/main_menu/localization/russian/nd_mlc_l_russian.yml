l_russian:
 nd_mlc_jong_tradition: "Малайский Джонг" #NT!
 nd_mlc_jong_tradition_desc: "«Джонг» был крупнейшим судном в водах Юго-Восточной Азии, многомачтовым торговым судном, способным перевозить сотни тонн груза и вооруженным десятками вертлюжных орудий. Корабелы малайского джонга строили суда, которые по размерам могли соперничать с китайскими джонками, соединяя Малакку со всеми портами от Гуджарата до Гуанчжоу." #NT!
 nd_mlc_gajah_perang: "Гаджа Перанг" #NT!
 nd_mlc_gajah_perang_desc: "Корпус боевых слонов малакканских султанов составлял основу сухопутной обороны королевства. Во время осады 1511 года султан Махмуд Шах лично повел двадцать боевых слонов против португальских захватчиков. Гаджа перанги были бронированы железными пластинами и несли хауда для лучников, их грохочущие заряды разрывали вражеские порядки." #NT!
 nd_mlc_undang_undang: "Унданг-Унданг Малака" #NT!
 nd_mlc_undang_undang_desc: "Комплексный правовой кодекс Малаккского султаната, сочетающий исламскую юриспруденцию с малайским обычным правом адата. Составленная при султане Мухаммад-шахе и усовершенствованная Бендахарой, она регулировала гражданские споры, уголовное правосудие, правила торговли и права правителя - одна из самых ранних письменных конституций в Юго-Восточной Азии." #NT!
 nd_mlc_gateway_of_islam: "Ворота Ислама" #NT!
 nd_mlc_gateway_of_islam_desc: "Малакка служила основным каналом распространения ислама по всему морскому региону Юго-Восточной Азии. Суфийские учителя, арабские и индийские купцы и малайские миссионеры несли веру из молитвенных залов сурау Малакки на Суматру, Яву, Борнео и Филиппины. Обращение часто сопровождало торговлю: стать мусульманином означало присоединиться к самой мощной торговой сети в Индийском океане." #NT!
 nd_mlc_emporium: "Торговый центр Востока" #NT!
 nd_mlc_emporium_desc: "В период своего расцвета Малакка была крупнейшим перевалочным пунктом между Индией и Китаем. Португальский аптекарь Томе Пирес писал, что «тот, кто владеет Малаккой, держит руку на горле Венеции». На его рынках говорили на восьмидесяти четырех языках, где китайский шелк сочетался с индийским текстилем, молуккскими специями и арабскими духами." #NT!
 nd_mlc_kris_forging: "Крис Форгинг Традиция" #NT!
 nd_mlc_kris_forging_desc: "Крис, кинжал с волнистым лезвием малайского мира, был гораздо большим, чем просто оружием. Считалось, что каждое лезвие обладает духом, выкованным в ходе ритуалов мастерами-кузнецами пандай-беси с использованием метеоритного железа и многослойной стали. Количество изгибов клинка имело духовное значение, а крис султана был символом его суверенитета.\n\n#italic Доступно в: $nd_mlc_pandai_besi$#!" #NT!
 nd_mlc_laksamana_command: "Лаксамана военно-морское командование" #NT!
 nd_mlc_laksamana_command_desc: "Лаксамана был верховным военно-морским командующим Малакки, хранителем пролива и главным посланником султана. Самым известным обладателем этого титула был Ханг Туах, воин-полиглот, говоривший на арабском, персидском, мандаринском, тамильском и сиамском языках и защитивший Пролив от пиратов благодаря неустанному патрулированию и быстрому правосудию." #NT!
 nd_mlc_tun_perak_expansion: "Расширение Тун Перака" #NT!
 nd_mlc_tun_perak_expansion_desc: "Бендахара Тун Перак служил четырем султанам и превратил Малакку из торгового порта в подчиненную империю. Под его руководством влияние Малакки распространилось на весь Малайский полуостров и восточную Суматру, при этом Паханг, Теренггану, Джохор, Сиак и Кампар оказались под сюзеренитетом Малакки." #NT!
 nd_mlc_tin_networks: "Сети по добыче олова" #NT!
 nd_mlc_tin_networks_desc: "Оловянные месторождения Перака и Кедаха были одними из самых богатых в мире. Малакка контролировала экспорт этого жизненно важного металла, необходимого для изготовления бронзы, олова и торговых товаров, направляя его через пролив китайским, индийским, а затем и европейским покупателям." #NT!
 nd_mlc_multi_faith_quarters: "Многоконфессиональные кварталы" #NT!
 nd_mlc_multi_faith_quarters_desc: "Порт Малакки был разделен на четыре отдельных квартала, каждый из которых управлялся шахбандаром, который контролировал торговцев и собирал налоги. Квартал Гуджарати, квартал Келинг (южно-индийский), яванский квартал и китайский квартал сосуществовали под защитой султана - модель космополитического управления, редко встречающаяся в средневековом мире." #NT!
 nd_mlc_successor_resilience: "Устойчивость государства-преемника" #NT!
 nd_mlc_successor_resilience_desc: "Когда Малакка пала под властью португальцев в 1511 году, малайская политическая традиция не умерла. Султан Махмуд Шах отступил на юг и основал Джохор, а его сын Музаффар Шах был приглашен править Пераком. Эти султанаты-преемники сохранили малакканские законы, судебный протокол и идеал малайского суверенитета несмотря на столетия европейского вторжения." #NT!
 nd_mlc_ghali_besar: "Гали Бесар" #NT!
 nd_mlc_ghali_besar_desc: "Гали бесар, «большая галера», представлял собой большой весельный военный корабль с поворотными орудиями, на борту которого находились сотни бойцов. Эти суда были основой малайской военно-морской мощи в узких водах пролива, где их малая осадка и маневренность давали им преимущества перед глубококилевыми европейскими кораблями." #NT!
 nd_mlc_literary_golden_age: "Литературный золотой век" #NT!
 nd_mlc_literary_golden_age_desc: "«Седжара Мелаю», «Малайские анналы», — одно из лучших литературных произведений Юго-Восточной Азии, придворная хроника, в которой прослеживается история Малаккской династии от ее мифического происхождения до падения города. Наряду с эпическими традициями хикаята и религиозными текстами китабов, он сделал малайский литературным и дипломатическим языком архипелага." #NT!
 nd_mlc_perak_tin_boom: "Перакская оловянная стрела" #NT!
 nd_mlc_perak_tin_boom_desc: "К концу 16 века спрос на олово в Европе привел к беспрецедентному расширению рудников Перака. Открытие россыпных месторождений олова в долине Кинта привлекло китайских горняков, малайских рабочих и европейских купцов, что сделало Перак одним из самых богатых штатов на полуострове." #NT!
 nd_mlc_silat_codification: "Кодификация Силата" #NT!
 nd_mlc_silat_codification_desc: "Силат, боевое искусство малайского мира, было формализовано из различных деревенских боевых традиций в стандартизированные школы. Мастера пендекара тренировались с крисом, керамбитом и голыми руками, разрабатывая систему, в которой особое внимание уделялось плавным движениям, замкам суставов и внезапным взрывным ударам. Мастерство пендекара измерялось не грубой силой, а экономией движений." #NT!
 nd_mlc_bugis_alliance: "Альянс воинов Бугис" #NT!
 nd_mlc_bugis_alliance_desc: "Буги Сулавеси были известны на всем архипелаге как воины, торговцы и мореплаватели. Начиная с 17 века, искатели приключений Буги служили наемниками и создателями королей при малайских дворах, в конечном итоге основав свои собственные правящие дома в Селангоре и Риау. Их военная доблесть дополняла малайские коммерческие сети." #NT!
 nd_mlc_strait_sovereignty: "Суверенитет Пролива" #NT!
 nd_mlc_strait_sovereignty_desc: "Малаккский пролив остается самым важным морским узлом в мире, через который проходит четверть всей мировой торговли. Контроль над этим узким проходом, ширина которого в самом узком месте составляет всего лишь 65 километров, был определяющим стратегическим активом каждой державы, которая его удерживала, от малакканских султанов до современности." #NT!
 nd_mlc_national_consciousness: "Малайское национальное сознание" #NT!
 nd_mlc_national_consciousness_desc: "Память о славе Малакки стала основой малайской национальной идентичности. Концепция «мелайу», общей идентичности, основанной на языке, исламе и обычаях малакканского двора, объединила различные народы полуострова против колониального господства и вдохновила движения за независимость во всем малайском мире." #NT!
 nd_mlc_modern_tin_industry: "Современная оловянная промышленность" #NT!
 nd_mlc_modern_tin_industry_desc: "К 19 веку Малайский полуостров производил более половины мирового олова. Современные технологии плавки, железнодорожный транспорт от рудников до портов и дноуглубительные работы в промышленных масштабах преобразили ландшафт Перака, Селангора и Паханга, создав огромное богатство и привлекая волны иммиграции из Китая и Индии.\n\n#italic Доступно в: $nd_mlc_modern_smeltery$#!" #NT!
 nd_mlc_constitutional_sultanate: "Конституционный султанат" #NT!
 nd_mlc_constitutional_sultanate_desc: "Традиционный малайский султанат адаптировался к давлению современности, приняв конституционные рамки, которые сохраняли королевскую власть и в то же время вводили представительное управление. Султан оставался олицетворением малайского суверенитета и защитником ислама, хотя государственные советы и консультативные органы разделяли бремя управления." #NT!
 nd_mlc.1.t: "Унданг-Унданг Малакка" #NT!
 nd_mlc.1.d: "По мудрому совету Бендахары наш султан обнародовал всеобъемлющий свод законов — Унданг-Унданг Малакка. Этот кодекс, сочетающий в себе предписания исламской юриспруденции с древними обычаями адата нашего народа, регулирует все вопросы, от уголовного правосудия до коммерческих споров, от прав правителя до обязанностей шахбандара.\n\nТем не менее, кодекс имеет два различных аспекта. Хукум Канун Малака занимается управлением, моралью и общественным порядком на суше, а товарищ Унданг-Унданг Лаут Малака, составленный нашими судовладельцами, регулирует все вопросы морской торговли, навигации и обязанности капитанов на море. Какому своду законов мы должны уделять больше внимания и ресурсов?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mlc.1.a: "Закон страны должен быть нашей основой." #NT!
 nd_mlc.1.b: "Морское право будет руководить нашими кораблями." #NT!
 nd_mlc.2.t: "Имперское видение Тун Перака" #NT!
 nd_mlc.2.d: "Бендахара Тун Перак служил нашему султанату с непревзойденным блеском. Под его руководством Малакка превратилась из процветающего торгового порта в центр подчиненной империи, простирающейся от Теренггану до Кампара. Паханг, Джохор и государства реки Суматран признают наш сюзеренитет.\n\nНо наследие Тун Перака предлагает два пути вперед. Его военные кампании обеспечили безопасность этих территорий силой оружия, угрозой малакканского флота и маршем боевых слонов. Однако его дипломатический гений был не менее огромен: он организовывал королевские браки, заключал соглашения о дани и настраивал конкурирующие государства друг против друга. Какой аспект его государственного управления будет определять наше царство?" #NT!
 nd_mlc.2.a: "Меч, который победил, продолжит править." #NT!
 nd_mlc.2.b: "Перо, скрепляющее договоры, скрепит нашу империю." #NT!
 nd_mlc.3.t: "Седжара Мелайу" #NT!
 nd_mlc.3.d: "При нашем дворе был создан шедевр малайской литературы — «Седжара Мелайу», «Малайские анналы». В этой необычной хронике прослеживается происхождение нашей династии от Искандара Зулькарнайна, самого Александра Великого, до основания Сингапура Санг Нила Утамой, обращения в ислам в Малакке и славы нашего султаната.\n\nСеджара Мелаю — это не просто история, а принципы малайского королевского правления: правитель должен быть справедливым, верность между королем и подданным — это священный завет, что наш язык и обычаи образуют цивилизацию, достойную памяти. Его будут читать и копировать в судах по всему архипелагу на протяжении столетий." #NT!
 nd_mlc.3.a: "Наша история должна вдохновить поколения." #NT!
 nd_mlc.4.t: "Ворота Ислама" #NT!
 nd_mlc.4.d: "Малакка стала бьющимся сердцем ислама в Приморской Юго-Восточной Азии. Из наших молитвенных залов и медресе сурау ученые учителя, многие из которых являются суфиями из Индии и Аравии, несут веру в самые отдаленные уголки архипелага. Обращение правителей Малакки придало исламу престиж; обращение купцов в ислам дало возможность распространить ислам.\n\nТорговцы, принимающие веру, получают доступ к обширной торговой сети, простирающейся от Красного моря до Южно-Китайского моря. Короли, принявшие ислам, получают легитимность и доступ к богатствам торговли в Индийском океане. И так вера распространяется не с помощью меча, а с помощью книги и молитвенного коврика, от Ачеха до Манилы, от Брунея до Молуккских островов." #NT!
 nd_mlc.4.a: "Свет веры освещает моря." #NT!
 n_nd_mlc_jong: "Малай Джонг" #NT!
 n_nd_mlc_jong_desc: "«Джонг» был крупнейшим судном в водах Юго-Восточной Азии, многомачтовым торговым судном, вооруженным десятками поворотных орудий и способным перевозить сотни тонн грузов через Индийский океан." #NT!
 a_nd_mlc_gajah_perang: "Гаджа Перанг" #NT!
 a_nd_mlc_gajah_perang_desc: "Боевые слоны Малакканского султаната, бронированные железными пластинами и несущие хауда лучников. Их грохочущие атаки могли разбить любой пехотный строй." #NT!
 n_nd_mlc_penjajap: "Пенджаджап" #NT!
 n_nd_mlc_penjajap_desc: "Быстрая малайская военная галера с мелкой осадкой, предназначенная для патрулирования и перехвата в узких водах пролива. Быстрый и маневренный, идеально подходящий для преследования пиратов и укрепления власти султана." #NT!
 n_nd_mlc_ghali_besar: "Гали Бесар" #NT!
 n_nd_mlc_ghali_besar_desc: "Большая весельная боевая галера с поворотными орудиями, на которой находились сотни бойцов. Небольшая осадка «Гали бесара» давала ему преимущество перед глубококилевыми европейскими судами в замкнутых водах пролива." #NT!
 a_nd_mlc_pendekar: "Пендекар" #NT!
 a_nd_mlc_pendekar_desc: "Мастера силата, малайского боевого искусства. Эти элитные воины сражаются крисом, керамбитом и голыми руками, используя плавные движения и взрывные удары, чтобы сокрушить своих противников." #NT!
 a_nd_mlc_bugis_warrior: "Бугис Воины" #NT!
 a_nd_mlc_bugis_warrior_desc: "Свирепые воины из Сулавеси, буги служили наемниками и творцами королей по всему малайскому миру. Известны своей дисциплиной и агрессивностью в бою." #NT!
 nd_mlc_surau: "Сурау" #NT!
 nd_mlc_surau_desc: "Исламский молитвенный зал и учебный центр, где суфийские учителя обучают верующих и готовят миссионеров для распространения веры по всему архипелагу." #NT!
 nd_mlc_gudang_rempah: "Гуданг Ремпах" #NT!
 nd_mlc_gudang_rempah_desc: "Большой склад специй в порту, где хранятся молуккские гвоздика, мускатный орех и перец для перераспределения торговцам из Индии, Аравии и Китая." #NT!
 nd_mlc_pandai_besi: "Пандай Беси" #NT!
 nd_mlc_pandai_besi_desc: "Мастерская оружейная кузница, где кузнецы пандай-беси создают легендарные малайские крисы посредством ритуалов огня и сложенной стали." #NT!
 nd_mlc_tin_mine_office: "Офис оловянного рудника" #NT!
 nd_mlc_tin_mine_office_desc: "Административный центр, контролирующий добычу и налогообложение олова из богатых аллювиальных месторождений полуострова." #NT!
 nd_mlc_modern_smeltery: "Современный плавильный завод" #NT!
 nd_mlc_modern_smeltery_desc: "Промышленный завод по выплавке олова, использующий современные технологии для переработки руды в беспрецедентных масштабах." #NT!
 nd_mlc_pm_surau_upkeep: "Религиозное обучение" #NT!
 nd_mlc_pm_surau_upkeep_desc: "Постоянное предоставление текстов и материалов для исламского образования." #NT!
 nd_mlc_pm_spice_storage: "Хранение специй" #NT!
 nd_mlc_pm_spice_storage_desc: "Содержание складских помещений для хранения сыпучих специй в контролируемых условиях." #NT!
 nd_mlc_pm_kris_forging: "Крис Форгинг" #NT!
 nd_mlc_pm_kris_forging_desc: "Мастера-кузнецы выковывают легендарные клинки крис из многослойного железа, создавая оружие как военного, так и духовного значения." #NT!
 nd_mlc_pm_tin_administration: "Оловянная администрация" #NT!
 nd_mlc_pm_tin_administration_desc: "Ведение учета и административный надзор за добычей олова." #NT!
 nd_mlc_pm_tin_smelting: "Выплавка олова" #NT!
 nd_mlc_pm_tin_smelting_desc: "При промышленной плавке производят рафинированное олово с использованием угольных печей и железного оборудования." #NT!
 STATIC_MODIFIER_NAME_nd_mlc_law_of_the_sultanate: "Закон Султаната" #NT!
 STATIC_MODIFIER_DESC_nd_mlc_law_of_the_sultanate: "Хукум Канун Малакки обеспечивает всеобъемлющую основу для управления, правосудия и социального порядка во всем королевстве." #NT!
 STATIC_MODIFIER_NAME_nd_mlc_maritime_law: "Морское право Малакки" #NT!
 STATIC_MODIFIER_DESC_nd_mlc_maritime_law: "Унданг-Унданг Лаут Малакка кодифицирует права и обязанности судовладельцев, капитанов и торговцев, наводя порядок на самых оживленных морских путях в мире." #NT!
 STATIC_MODIFIER_NAME_nd_mlc_tun_perak_sword: "Меч Тун Перака" #NT!
 STATIC_MODIFIER_DESC_nd_mlc_tun_perak_sword: "Военное наследие Бендахары Тун Перака, экспансия силой оружия, угроза флота и атака боевых слонов." #NT!
 STATIC_MODIFIER_NAME_nd_mlc_tun_perak_statecraft: "Управление государством Тун Перака" #NT!
 STATIC_MODIFIER_DESC_nd_mlc_tun_perak_statecraft: "Дипломатический гений Бендахары Тун Перака, связывающий вассалов браком, данью и тонким искусством натравливать соперников друг на друга." #NT!
 levy_nd_mlc_gajah_perang: "Боевой слон Леви" #NT!
 levy_nd_mlc_gajah_perang_desc: "Бронированные боевые слоны, выращенные из дома султана и знати." #NT!
 levy_nd_mlc_pendekar: "Пендекар Леви" #NT!
 levy_nd_mlc_pendekar_desc: "Мастера силата происходили из простых людей и солдат." #NT!
 nd_mlc_formed_tt: "Малакка была образована" #NT!
 nd_mlc_path_a_tt: "Выбрал закон султаната" #NT!
 nd_mlc_path_b_tt: "Выбрал морское право Малакки" #NT!
 AUTO_MODIFIER_NAME_nd_mlc_bureaucracy_authority: "Аппарат трона Бертама" #NT!
 AUTO_MODIFIER_DESC_nd_mlc_bureaucracy_authority: "Четырехстолпное чиновничество Малаккского султаната — Бендахара, Пенгулу Бендахари, Теменггунг и Лаксамана — управляет королевством совместно с имперской концессией Букит-Китай и аппаратом дани негери, который связывает меньшие малайские государства. Из истаны на реке Сунгай-Бертам трон теперь обладает институциональным влиянием, позволяющим превратить Малакку в перевалочный пункт Индийского океана, а не просто в удачливый рыболовный порт." #NT!
 mlc_penghulu_bendahari_bureaucracy: "Пенгулу Бендахари" #NT!
 mlc_penghulu_bendahari_bureaucracy_desc: "Третий столп чиновничества Малакки, казначей королевства и хозяин таможни. Бендахари управляли королевской казной, мерами и весами (мелаканские кати в 605 граммов и бахара в 200 кати стали эталонными стандартами для Индийского океана), доходами сьяхбандаров от четырех иностранных кварталов и офисом капитана порта, который взвешивал каждый груз перца, гвоздики, олова и золотого песка, пересекающий пристань. Томе Пирес (Сума Ориентал, ок. 1515 г.) описывает таможенную администрацию Малакки как наиболее рационально организованную во всей Индии, с опубликованными ставками в размере 3–6% адвалорной ставки и единым пунктом оплаты в офисе Бендахари." #NT!
 mlc_temenggung_bench_bureaucracy: "Скамейка Теменггунг" #NT!
 mlc_temenggung_bench_bureaucracy_desc: "Четвертый столп чиновничества Малакки, начальник дворцовой безопасности и судья по тяжким преступлениям. Там, где Бендахара руководила гражданской администрацией, а Бендахари занимались финансовыми вопросами, Теменггунг командовал телохранителем истаны - хулубалангом, управлял королевской тюрьмой и председательствовал в высшем суде за преступления, отнесенные адатом к удовольствию султана, измену, оскорбление величества и дурхаку за неповиновение трону. Его приказ прошел через керис его заместителей-хулубалангов, которые следили за городом, подавляли рыночные беспорядки и вводили в действие правила в отношении роскоши, запрещающие простолюдинам носить желтое или ездить в носилках, предназначенных для членов королевской семьи." #NT!
 mlc_bukit_china_concession_bureaucracy: "Букит, Китайская императорская концессия" #NT!
 mlc_bukit_china_concession_bureaucracy_desc: "Узел притока Мин располагался на холме Букит-Китай к северу от Сунгай-Мелаки, подаренном (согласно Седжара Мелаю) султаном Мансур Шахом принцессе Ханг Ли По и ее свите из пятисот человек после ее замужества с султаном в 1459 году. Холм стал резиденцией китайских данников: резиденцией посланников Мин, которые передавали патенты императоров Юнлэ и Сюандэ последующим султаны, квартал поселенцев Синке и дипломатическо-торговые ворота, через которые Малакка обеспечивала защиту династии Мин от сиамских вторжений. В семи путешествиях Чэн Хо (1405–1433 гг.) Малакка использовалась в качестве перевалочной базы в Индийском океане, оставив постоянные договорные отношения, которые продолжались до португальского завоевания." #NT!
 mlc_negeri_tributary_bureaucracy: "Аппарат притока Негери" #NT!
 mlc_negeri_tributary_bureaucracy_desc: "Институциональная сеть, с помощью которой султан Мансур Шах (годы правления 1459–1477) и Бендахара Тун Перак связывали меньшие малайские государства с троном Малакки под статусом негери (вассального королевства): Паханг с 1454 г., Кедах с ок. 1470 г., Келантан и Тренгану с 1460-х гг., Индрагири и Кампар на Суматре и Пасай с 1470 г. под косвенной данью после экспедиции Тун Перака 1474 года. Раджа каждого негери сохранял свой трон в обмен на ежегодную дань бунга мас дан перак (небольшое дерево из чеканного золота и серебра, символического веса, но с тяжелыми ритуальными обязательствами), военно-морской сбор во время войны и принятие Бендахары из Малакки в качестве окончательного арбитра в спорах о престолонаследии. Аппаратом управляли странствующие бентары (глашатаи) и постоянные посланники, поселившиеся в истане Бертам, представляющие каждый подчиненный суд." #NT!
