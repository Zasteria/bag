l_russian:
 nd_map_formed_tt: "Wallmapu был подделан" #NT!
 nd_map_path_a_tt: "Путь выносливости Валмапу" #NT!
 nd_map_path_b_tt: "Путь копья Пиллана" #NT!
  # ===== Static Modifiers ===== 
 STATIC_MODIFIER_NAME_nd_map_wallmapu_endurance: "Стенмапу Выносливость" #NT!
 STATIC_MODIFIER_DESC_nd_map_wallmapu_endurance: "Кордильеры и Вальдивские леса — наши стены. Уинка, вошедшая в них, не возвращается. Нам не нужны их города, их золото или их бог. Нам нужна только земля, которая нас родила." #NT!
 STATIC_MODIFIER_NAME_nd_map_pillan_spear: "Копье Пиллана" #NT!
 STATIC_MODIFIER_DESC_nd_map_pillan_spear: "То, что Лаутаро начал в Тукапеле, федерация должна завершить. Токи движется на север, болеадора поворачивает на восток, и испанец узнает, что нет границы, которую мапуче не могли бы пересечь, когда поднято копье Пиллана." #NT!
 STATIC_MODIFIER_NAME_nd_map_curalaba_legacy: "Наследие Куралабы" #NT!
 STATIC_MODIFIER_DESC_nd_map_curalaba_legacy: "Засада Пелантару в Куралабе сломила испанского губернатора и стерла с карты завоеваний семь городов. Урок остается неизменным: Валмапу — это не провинция, которой нужно управлять, а народ, которого следует бояться." #NT!
 STATIC_MODIFIER_NAME_nd_map_quilin_compact: "Компакт Килина" #NT!
 STATIC_MODIFIER_DESC_nd_map_quilin_compact: "На берегу реки в Килине испанская корона поставила свое имя рядом с нашим как равноправные монархи. Био-Био — признанная граница, Парламент — признанный обычай, а Валмапу — признанная нация." #NT!
 STATIC_MODIFIER_NAME_nd_map_quilin_unbroken: "Био-Био Несломленный" #NT!
 STATIC_MODIFIER_DESC_nd_map_quilin_unbroken: "Федерация отказывается от договора как от ловушки, замаскированной дружбой. Река не является границей: это временная линия перемирия, и кона готовы к тому дню, когда хуинка порвет свою собственную бумагу." #NT!
 STATIC_MODIFIER_NAME_nd_map_lautaro_doctrine: "Доктрина Лаутаро" #NT!
 STATIC_MODIFIER_DESC_nd_map_lautaro_doctrine: "Молодой Токи, служивший конюхом Вальдивии, вернулся с секретом: лошадь — не испанское оружие. Это оружие. Под его именем выступает первый кавалерийский корпус мапуче." #NT!
 STATIC_MODIFIER_NAME_nd_map_steed_seizure: "Захваченное стадо" #NT!
 STATIC_MODIFIER_DESC_nd_map_steed_seizure: "Стадо мапуче, украденное, подвергшееся набегам и выращенное из сломанных испанских стад, растет в пампасах Пуэльмапу. Через поколение Рече ездят так же, как любой конкистадор, и по лучшей местности." #NT!
  
  # ===== Formation Event ===== 
 nd_map.1.t: "Совет Всех Земель" #NT!
 nd_map.1.d: "От Пикуна до Вилличе, от Вальдивского леса до сухих равнин за Кордильерами лонко и токи проехали до одного-единственного поля нгиллатун. Здесь заканчиваются четыре столетия разбросанного Лофа и федеративного Айлареве. Барабан культруна вызывает обман федерации, и необходимо провозгласить Токи Мапу (военного лидера всей земли).\n\nСпор не идет о том, стоит ли сражаться. Это наша битва. Старший лонкос советует проявить терпение: Валмапу удерживает Кордильеры на протяжении семидесяти двух поколений, потому что отказывается покинуть ее. Молодые токи (всадники на новой лошади, грабители испанских поселений в Куйо) советуют, что мапуче никогда не были такими сильными и что копье Пиллана теперь должно быть поднято над каждой землей, на которую претендует хуинка к югу от Лимы.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_map.1.a: "Wallmapu Endurance: Кордильер достаточно" #NT!
 nd_map.1.b: "Копье Пиллана: загнать гуинку в море." #NT!
  
  # ===== DHE: Curalaba Uprising ===== 
 nd_map.2.t: "Катастрофа Куралабы" #NT!
 nd_map.2.d: "В ночь на 23 декабря у брода Куралаба «Токи Пелантару» устроил засаду на губернатора Мартина Гарсиа Оньеса де Лойолу. Губернатор умер, погибли его пятьдесят всадников, и в течение шести лет все испанские города к югу от Био-Био (Вальдивия, Империал, Ангол, Вильяррика, Санта-Крус, Сан-Бартоломе, Осорно) были сровнены с землей восставшими воинами. Разрушение семи городов является крупнейшим территориальным изменением территории, когда-либо перенесенным Испанской империей в Америке. С этого момента дорога конкистадора на юг заканчивается у реки." #NT!
 nd_map.2.a: "Валмапу следует измерять не в лигах, а в мертвых губернаторах." #NT!
  
  # ===== DHE: Treaty of Quilín ===== 
 nd_map.3.t: "Куилин Парламенто" #NT!
 nd_map.3.d: "На поле Килина в 1641 году маркиз де Байдес (губернатор Чили, представитель испанской короны) ставит свое имя на договоре с собравшимися лонкосами федерации. Это первый и единственный договор, который Испанская империя когда-либо подпишет с коренным народом Америки на равных правах. Условия признают суверенитет Валмапу к югу от Био-Био, учреждают ежегодный парламент для возобновления мира и запрещают испанские поселения за рекой. Лонкос должен решить: будем ли мы считать федерацию этим документом настоящим договором или будем относиться к нему как к временной передышке между войнами?" #NT!
 nd_map.3.a: "Соблюдайте договор: парламент должен соблюдаться" #NT!
 nd_map.3.b: "Био-Био — это линия перемирия, а не граница." #NT!
  
  # ===== DHE: Lautaro's Doctrine ===== 
 nd_map.4.t: "Лаутаро и Первая кавалерия" #NT!
 nd_map.4.d: "Фелипе Лаутаро служил конюхом Педро де Вальдивии и изучил все слабости испанской лошади: как она утомляется, как ее кормят, как ее наездник ест и отдыхает. Он перешел на сторону своего народа, принял титул Токи и вернулся во главе войска, которое разрушило Вальдивию в Тукапеле и собственными руками убило завоевателя. Результатом его кампании стал первый кавалерийский корпус мапуче, а благодаря его методам — каждая победа мапуче в последующие два столетия." #NT!
 nd_map.4.a: "Лошадь больше не принадлежит только гуинкам." #NT!
  
  # ===== DHE: Captured Steed ===== 
 nd_map.5.t: "Стадо за рекой" #NT!
 nd_map.5.d: "То, что началось с набегов на одинокие аванпосты, теперь превратилось в непрерывную переброску конины: мапуче украли, сломали и вырастили достаточно скота, чтобы оседлать собственную пехоту, а за Кордильерами в Пуэльмапу стада федерации пасутся на траве, на которой не ездил ни один испанец. К следующему поколению ни одна европейская кавалерия не будет иметь преимущества в мобильности против Рече на его собственной земле." #NT!
 nd_map.5.a: "Пампасы принадлежат нам." #NT!
  
  # ===== Advances ===== 
 nd_map_lof_confederation: "Конфедерация Лофов" #NT!
 nd_map_lof_confederation_desc: "Лоф (домохозяйство по родству) является основой политической жизни мапуче. Из лофа возникает реве (совет девяти), а из реве - айлареве (федерация девяти советов). Ни короля, ни двора, но каждый человек и каждая лошадь имели значение." #NT!
 nd_map_aillarewe_federation: "Федерация Айлареве" #NT!
 nd_map_aillarewe_federation_desc: "Девять реве образуют aillarewe; девять айлареве образуют буталмапу; четыре буталмапу образуют Валмапу. Структура фрактальная, произвольная и удивительно устойчивая: у нее нет головы, которую можно было бы отрезать." #NT!
 nd_map_ngillatun_ceremony: "Церемония Нгиллатун" #NT!
 nd_map_ngillatun_ceremony_desc: "Каждые четыре года федерация собирается на священном поле нгиллатун: четырехдневный ритуал плодородия, мира и политического саммита. Танец, чича и переговоры между айларевами неразделимы." #NT!
 nd_map_valdivian_forest: "Мастерство Вальдивского леса" #NT!
 nd_map_valdivian_forest_desc: "Тропические леса Нгулумапу умеренного пояса (деревья койуэ, кедр и ульмо возрастом до четырех тысяч лет) нанесены на карту, названы и известны каждому воину-мапуче так, как не может сравниться ни один испанский гид." #NT!
 nd_map_toki_council: "Совет Токи" #NT!
 nd_map_toki_council_desc: "Токи (носитель боевого топора токи-кура) избирается на время кампании и полностью ему подчиняется, пока длится кампания. После этого он возвращается в свой лоф. Нет постоянного короля, которого можно захватить, нет столицы, которую можно разграбить, нет суда, который можно развращать." #NT!
 nd_map_inca_repulse: "Отпор Мауле" #NT!
 nd_map_inca_repulse_desc: "Когда армия инков Тупака Юпанки пересекла Мауле в 1480-х годах, промаука и мапуче встретились с ними в битве при Мауле. После трех дней безвыходного положения инка повернул назад. Южная граница Тавантинсую была установлена ​​у Мауле, и Валмапу остался непокоренным." #NT!
 nd_map_machi_shamans: "Мачи Шаманы" #NT!
 nd_map_machi_shamans_desc: "Мачи (чаще всего женщина) — шаман мапуче, целитель, пророк и ритуалист на поле боя. Она выступает посредником между живыми и Пилланом, и ее голос может перевесить даже Токи в вопросах духовного значения." #NT!
 nd_map_ruka_settlement: "Поселок Рука" #NT!
 nd_map_ruka_settlement_desc: "Рука (домик с соломенной крышей из тростника колигуэ и тростниковой крышей тотора) строится коллективно за один день и ориентирована на рассвет. Деревня мапуче — это созвездие рук, а не город с площадью." #NT!
 nd_map_lautaro_doctrine: "Доктрина Лаутаро" #NT!
 nd_map_lautaro_doctrine_desc: "Тактическое наследие Лаутаро: смена свежих всадников, ложное отступление в подготовленные засады и преднамеренное истощение испанских колонн перед контактом. На основе его доктрины родился первый кавалерийский корпус мапуче." #NT!
 nd_map_tucapel_triumph: "Триумф Тукапеля" #NT!
 nd_map_tucapel_triumph_desc: "В день Рождества 1553 года войска Лаутаро уничтожили Педро де Вальдивию и его армию в Тукапеле. Завоеватель Чили был убит (по некоторым сведениям, ему в горло залили расплавленное золото). Южное наступление Испании погибло вместе с ним." #NT!
 nd_map_curalaba_uprising: "Восстание Куралабы" #NT!
 nd_map_curalaba_uprising_desc: "Засада Пелантару в Куралабе в 1598 году положила начало шестилетнему разрушению семи городов. Все испанские поселения к югу от Био-Био были сожжены. Дорога конкистадора заканчивается у реки." #NT!
 nd_map_captured_steed: "Пленный конь" #NT!
 nd_map_captured_steed_desc: "К началу 17 века мапуче совершали набеги, разводили и обучали достаточное количество лошадей, которых хватило на две трети боевых действий. Они сделали то, что не удалось ни одному другому народу Америки: сравнялись с конкистадором в кавалерии." #NT!
 nd_map_cordilleran_ambush: "Кордильерская засада" #NT!
 nd_map_cordilleran_ambush_desc: "Заранее расставленные ловушки из деревянных шипов, спрятанные в пологе метатели болеадор и глубокое знание кордильерских троп: мапуче превращают каждое ущелье между Био-Био и Толтеном в коридор для засад." #NT!
 nd_map_bio_bio_frontier: "Био-био граница" #NT!
 nd_map_bio_bio_frontier_desc: "После разрушения семи городов Био-Био становится укрепленной линией: Мапуче-пукара на южном берегу, испанские форты на севере. В течение двух столетий ни одна из сторон не продвигалась вперед." #NT!
 nd_map_pehuenche_alliance: "Пеуэнш Альянс" #NT!
 nd_map_pehuenche_alliance_desc: "Пеуэнче (собиратели кедровых орехов пеуэн в высоких Андах) официально присоединяются к федерации. Их высокогорные перевалы становятся территорией мапуче, а сама Кордильера становится активом федерации." #NT!
 nd_map_treaty_of_quilin: "Квилинский договор" #NT!
 nd_map_treaty_of_quilin_desc: "Квилинский договор 1641 года: единственный договор, когда-либо подписанный Испанской империей с коренным американским народом на равных правах. Био-Био признана суверенной границей. Рождается институт парламента." #NT!
 nd_map_malon_raids: "Малонские рейды" #NT!
 nd_map_malon_raids_desc: "Малон (от Mapudungun Maleu, «причинять вред») — это быстрый конный рейд за скотом, лошадьми, оружием и пленниками. Лиентур совершенствует ее как устойчивую стратегию; к 18 веку испанская граница от Куйо до Буэнос-Айреса живет в страхе перед облаком пыли." #NT!
 nd_map_parlamento_general: "Генеральный парламент" #NT!
 nd_map_parlamento_general_desc: "Ежегодный парламент в Тапиуэ или Негрете: сотни лонко и испанских губернаторов собрались для пересмотра переговоров, обмена подарками и обновления Килина. Федерация ведет дипломатию как коллега империи." #NT!
 nd_map_puelmapu_expansion: "Расширение Пуэлмапу" #NT!
 nd_map_puelmapu_expansion_desc: "Носители языка мапудунгун пересекают Кордильеры и попадают в аргентинскую пампу, поглощая или вытесняя банды теуэльче и хет. Спустя столетие степь от Мендосы до Рио-Негро стала территорией мапуче." #NT!
 nd_map_wenteche_horsemanship: "Вентечская верховая езда" #NT!
 nd_map_wenteche_horsemanship_desc: "Венече («люди центральной долины») развивают тяжелую атаку копьями против испанских формирований. Разведывательные ширмы, бросающие болеадору; улан разрывает строй." #NT!
 nd_map_boqueador_raiders: "Бокеадор Рейдерс" #NT!
 nd_map_boqueador_raiders_desc: "Бокеадор (следопыт и разведчик) проводит колонны федерации через кордильерские бокеты (перевалы). Каждая испанская карательная экспедиция, которая следует за ним в горы, возвращается меньше или вообще не возвращается." #NT!
 nd_map_salinas_grandes: "Салинас Грандес" #NT!
 nd_map_salinas_grandes_desc: "Обширные солончаки аргентинской пампы — это экономические легкие федерации: соль для сохранения скота, скот для кормления малонов и торговые пути, ведущие как в Буэнос-Айрес, так и в Консепсьон." #NT!
 nd_map_pillan_worship: "Поклонение Пиллану реформировано" #NT!
 nd_map_pillan_worship_desc: "Федерация кодифицирует поклонение Пиллану и Нгенечену (духу-творцу и силе-предку) как единую конфессиональную систему. Миссии иезуитов вежливо отвергаются; мачи остаются хранителями священного." #NT!
 nd_map_standing_warband: "Постоянный отряд" #NT!
 nd_map_standing_warband_desc: "Первые постоянные казармы мапуче: постоянный профессиональный отряд конас, а не сезонный набор. Федерация впервые в своей истории начинает содержать регулярную армию." #NT!
 nd_map_mapudungun_literacy: "Мапудунгун Грамотность" #NT!
 nd_map_mapudungun_literacy_desc: "Грамматика мапудунгуна отца Луиса де Вальдивии (написанная иезуитом, но на родном языке народа) используется учеными-мапуче. К 19 веку мапудунгун печатается в брошюрах и текстах договоров." #NT!
 nd_map_pacification_resistance: "Сопротивление умиротворению" #NT!
 nd_map_pacification_resistance_desc: "Чилийская и аргентинская кампании «умиротворения» 1860-1880-х годов являются самой продолжительной войной в истории федерации. Захватив в ходе рейдов казнозарядные винтовки, лонко мапуче превращают каждый километр Кордильер в кладбище полков новых республик." #NT!
 nd_map_wallmapu_sovereignty: "Суверенитет Валмапу" #NT!
 nd_map_wallmapu_sovereignty_desc: "Признано государством в международной системе: Валмапу отправляет посольства в Буэнос-Айрес, Лиму, Мадрид и Лондон. Федерация сделала то, чего не удавалось ни одной другой коренной американской нации: она выжила как суверен." #NT!
 nd_map_trapil_orature: "Трапиль Оратура" #NT!
 nd_map_trapil_orature_desc: "Трапил (устная история в переплете, хранимая лонкосами) предназначена для печати. Генеалогии, предвыборные песни, речи в каждом парламенте, начиная с Килина, теперь находятся в архиве." #NT!
 nd_map_industrial_reche: "Индустриальный Рече" #NT!
 nd_map_industrial_reche_desc: "Паровые мельницы, телеграфные станции и стрелковые мастерские в Темуко. Федерация индустриализируется на своих собственных условиях: лоф продолжает оставаться политической единицей, но товары, которые он потребляет, теперь производятся ею же собственными машинами." #NT!
 nd_map_pampa_horse_trade: "Торговля лошадьми в Пампе" #NT!
 nd_map_pampa_horse_trade_desc: "Экспорт лошадей и крупного рогатого скота из Патагонии становится визитной карточкой федерации. Из Салинас-Грандеса стада переезжают в Буэнос-Айрес, Вальпараисо и на рынок Лимы, скот мапуче кормит три иностранные столицы." #NT!
  
  # ===== Units ===== 
 a_nd_map_kona_warband_unit: "Отряд Кона" #NT!
 a_nd_map_kona_warband_unit_desc: "Набор лофов копьями и дубинками: каждое родственное семейство вносит своих молодых людей. Необученные, но с местными корнями, опустошительные в лесах, в которых выросли." #NT!
 a_nd_map_kona_spearmen_unit: "Кона Копейщики" #NT!
 a_nd_map_kona_spearmen_unit_desc: "Дисциплинированные копейщики Федерации, центральная пехота боевой линии мапуче. Несет длинную щуку мапуче, адаптированную из наблюдаемых испанских терций." #NT!
 a_nd_map_malon_rider_unit: "Малон Райдер" #NT!
 a_nd_map_malon_rider_unit_desc: "Нанимали знатных всадников для быстрых грабительских набегов. Носит с собой копье, болу и веревку сменных средств передвижения." #NT!
 a_nd_map_kona_lancer: "Кона Лансер" #NT!
 a_nd_map_kona_lancer_desc: "Первый кавалерийский корпус мапуче Лаутаро, легкие уланы едут в плен и разводят испанский скот. Тактика инициативы и ложного отступления, почерпнутая из службы Лаутаро в конюшнях Вальдивии." #NT!
 a_nd_map_malon_lancer: "Малон Лансер" #NT!
 a_nd_map_malon_lancer_desc: "Конный грабитель, быстрый, легкобронированный, оснащенный бола. Ужас на испанской границе от Мендосы до Консепсьона." #NT!
 a_nd_map_wenteche_lancer: "Вентече Лансер" #NT!
 a_nd_map_wenteche_lancer_desc: "Тяжелая ударная кавалерия центральной долины, защищённая кирасами, добытыми у испанцев, верхом на самых крупных лошадях, которых может вырастить Валмапу. Молот федерации." #NT!
 a_nd_map_boqueador: "Бокеадор" #NT!
 a_nd_map_boqueador_desc: "Следопыт и разведчик. Знает все бокеты в Кордильерах и может провести колонну по тропе, существование которой не признает ни один испанский гид." #NT!
 a_nd_map_winka_rifleman: "Винка Стрелок" #NT!
 a_nd_map_winka_rifleman_desc: "Стрелок-мапуче эпохи сопротивления, вооруженный казнозарядными винтовками, захваченными или проданными у хуинка, сражающийся на своей территории против армий умиротворения." #NT!
  
  # ===== Levies ===== 
 levy_nd_map_kona_warband: "Сбор отряда Кона" #NT!
 levy_nd_map_kona_spearmen: "Копейщики Кона Леви" #NT!
 levy_nd_map_malon_riders: "Малон Райдерс Леви" #NT!
  
  # ===== Buildings ===== 
 nd_map_ngillatun_field: "Поле Нгиллатун" #NT!
 nd_map_ngillatun_field_desc: "Священная церемониальная площадка для четырехлетнего нгиллатуна. Как храм, так и политическая вершина, поле расположено вокруг священного шеста для плетения." #NT!
 nd_map_lof_clanhouse: "Дом клана Лоф" #NT!
 nd_map_lof_clanhouse_desc: "Дом родства мапуче, где лонко принимает посетителей, выступает посредником в спорах и хранит ловушку: связанную устную историю своей линии." #NT!
 nd_map_pillan_sanctuary: "Святилище Пиллан" #NT!
 nd_map_pillan_sanctuary_desc: "Храм Нгенечена и предков Пилланов. Мачи хранит здесь священный огонь и культрунский барабан и не допускает жреца хуинка." #NT!
 nd_map_ruka_compound: "Комплекс Рука" #NT!
 nd_map_ruka_compound_desc: "Поселение, состоящее из традиционных жилищ мапуче: стены из тростника колигуэ, крыша из тростника тотора, центральный очаг. Построен коллективно за один день." #NT!
 nd_map_cordilleran_path: "Кордильерский путь" #NT!
 nd_map_cordilleran_path_desc: "Скрытая лесо-горная тропа с заранее расставленными точками для засад. Федерация поддерживает эти пути как защитную инфраструктуру: каждое ущелье становится местом убийства." #NT!
 nd_map_konas_guardhouse: "Караул Конас" #NT!
 nd_map_konas_guardhouse_desc: "Постоянные профессиональные казармы для постоянного отряда конас, первый объект регулярной армии федерации, нарушающий традицию сезонного набора воинов." #NT!
  
  # ===== PM keys ===== 
 nd_map_ngillatun_maintenance: "Техническое обслуживание месторождения Нгиллатун" #NT!
 nd_map_ngillatun_maintenance_desc: "Домашний скот для четырехлетнего праздника, волокно для церемониальной ткани и пчелиный воск для вотивных свечей." #NT!
 nd_map_clanhouse_maintenance: "Содержание кланового дома" #NT!
 nd_map_clanhouse_maintenance_desc: "Дрова для бревенчатого зала, скот для стола лонко и шерсть для родственных одеял, свисающих со стен." #NT!
 nd_map_sanctuary_maintenance: "Содержание святилища" #NT!
 nd_map_sanctuary_maintenance_desc: "Пчелиный воск для священного огня, древесина для шеста, волокна урожая для церемониальной ткани и дичь для лечебных обрядов мачи." #NT!
 nd_map_ruka_maintenance: "Содержание Рука" #NT!
 nd_map_ruka_maintenance_desc: "Древесина и тростник для стен, волокнистые культуры для веревок и рыба из рек и побережья." #NT!
 nd_map_path_maintenance: "Обслуживание Кордильерского пути" #NT!
 nd_map_path_maintenance_desc: "Древесина для ловушек с шипами, оружие для спрятанного оружия и лошади для эстафетных всадников, которые несут предупреждение по тропе." #NT!
 nd_map_guardhouse_maintenance: "Содержание гауптвахты" #NT!
 nd_map_guardhouse_maintenance_desc: "Оружие, лошади, скот для стола конаса и пиломатериалы для казарменного зала." #NT!
 nd_map_machi_rite: "Обряд Мачи" #NT!
 nd_map_machi_rite_desc: "Кодифицированная ритуальная практика Нгенечен: пчелиный воск для священного огня, церемониальная одежда и дичь для лечебных обрядов мачи." #NT!
 nd_map_konas_drilling: "Конас Дрилл" #NT!
 nd_map_konas_drilling_desc: "Непрерывное обучение постоянного отряда: современное обучение обращению с огнестрельным оружием дополняет традиционную учебную программу по оружию и лошадям." #NT!
  
  # ===== Destiny Tree ===== 
 nd_map_destiny: "Великий проект Федерации" #NT!
 nd_map_destiny_desc: "Четыре буталмапу выехали на одно поле, культрун был поражен, а Токи мапу получил признание. Федерация сделала то, чего раньше не удавалось ни одному поколению мапуче: она, как один народ, выбрала, каким будет ее долгое столетие. Работа начинается сейчас." #NT!
  
 nd_map_dest_codified_parlamento: "Кодифицированный парламент" #NT!
 nd_map_dest_codified_parlamento_desc: "Ежегодные парламенты в Тапиуэ и Негрете кодифицированы в постоянный законодательный цикл. Лонкос, мачи и токи призываются к фиксированному календарю; дебаты федерации становятся законом. Требуется учреждение законничества и казна в 1000 дукатов." #NT!
 nd_map_dest_free_republic: "Свободная Республика Рече" #NT!
 nd_map_dest_free_republic_desc: "Федерация реорганизуется в республику Рече, государство свободных людей, управляемое путем выборов и согласия, без короля и суда. Требуется учреждение профессиональных армий, 50 престижа и 1500 общего развития." #NT!
 nd_map_dest_recognized_nation: "Признанный среди народов" #NT!
 nd_map_dest_recognized_nation_desc: "Валмапу отправляет посольства в Мадрид, Лондон, Париж и Буэнос-Айрес. Мировые канцелярии признают то, что Био-Био знало на протяжении веков: коренную американскую республику, суверенную и признанную. Требуется глобальная торговля, 75 престижа, 3000 дукатов и стабильность." #NT!
  
 nd_map_dest_march_toki_mapu: "Марш Токи Мапу" #NT!
 nd_map_dest_march_toki_mapu_desc: "Токи Мапу (военный лидер всех Валмапу) движется на север, в центральную долину, нарушая границу Пикумче и захватывая центральную часть Аконкагуа. Требуется владение Вальпараисо и вулканом Аконкагуа." #NT!
 nd_map_dest_cordillera_crossed: "Кордильеры пересеклись" #NT!
 nd_map_dest_cordillera_crossed_desc: "Колонны федерации поднимаются на бокеты и спускаются в Куйо и земли Диагуита в северной пампе. Анды больше не стена. Это коридор. Требуется владение Куйо и Кильмесом и казна в 2000 дукатов." #NT!
 nd_map_dest_toki_apu: "Токи Апу всех земель" #NT!
 nd_map_dest_toki_apu_desc: "От Сальты до холмов Тандил, от Кордильер до Атлантики реализуется имперская конфедерация мапуче. Токи Апу (верховный военачальник континента) заседает на постоянной ассамблее. Требуется владение Сальтой и Тандилом, армия из 75 полков, общее развитие 2000 и стабильность." #NT!
  
 nd_map_dest_imperial_toki: "Императорский Токи" #NT!
 nd_map_dest_pampa_dominion: "Пампа Доминион" #NT!
  
  # ===== Destiny Static Modifiers ===== 
 STATIC_MODIFIER_NAME_nd_map_dest_lonko_senate: "Сенат Лонко" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_lonko_senate: "Лонко четырех буталмапу представляют собой постоянный законодательный орган. Власть, которая когда-то распространялась только через избирательные кампании, теперь течет через календарь сессий сената, и на этом основывается легитимность федерации." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_machi_judiciary: "Судебная система Мачи" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_machi_judiciary: "Где лонкос принимают законы, а мачи судят. Споры между лофом, между айлареве, а также между гражданином и федерацией рассматриваются в святилище Пиллана, и решения выполняются беспрекословно." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_atlantic_embassies: "Посольства в Атлантике" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_atlantic_embassies: "Послов Валмапу принимают в Мадриде, Лондоне и Париже. Федерация ведет дипломатию наравне с атлантическими державами, а торговля следует за знаменем посольства." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_continental_compact: "Континентальный договор народов" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_continental_compact: "Валмапу созывает континентальный парламент коренных народов (Теуэльче, Диагита, Пеуэнче, наследники Тавантинсую) и предлагает договор о взаимном признании. Свободная республика становится стандартом, а век завоевателя подвергается порицанию." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_huinca_road: "Дорога Уинка перевернута" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_huinca_road: "Дорога, построенная конкистадором из Лимы (настоящий путь), теперь идет в противоположном направлении. Токи Мапу движется на север так же быстро, как Вальдивия двигалась на юг." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_pehuenche_passes: "Пеуэншские стражи проходов" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_pehuenche_passes: "Каждый кордильерский букет держат гиды Пеуэнш. Колонны федерации движутся через Анды, как по ровной земле; Колонны хуинка устраивают засады." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_imperial_toki: "Императорский Токи" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_imperial_toki: "Токи Апу провозглашается на постоянной сессии уже не избранным лидером одной кампании, а постоянным военачальником имперской федерации. Лофы направляют к нему свои копья." #NT!
 STATIC_MODIFIER_NAME_nd_map_dest_pampa_dominion: "Пампа Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_map_dest_pampa_dominion: "Степь для скота от Салинас-Грандес до Атлантики — это пастбища мапуче. Владельцы ранчо, пастухи и поселенцы-рече свободно передвигаются по пампасам, и Кордильеры больше не являются границей федерации. Это его позвоночник." #NT!
  
  # ===== Destiny Events ===== 
 nd_map.6.t: "Великий проект" #NT!
 nd_map.6.d: "На поле Валмапу культрун был разбит на дальнюю дорогу. Федерация выбрала свой век. Лонко и токи едут домой с совета с одним и тем же словом на устах: работа начинается сейчас." #NT!
 nd_map.6.a: "Федерация выбрала свой путь." #NT!
  
 nd_map.7.t: "Постоянный календарь" #NT!
 nd_map.7.d: "Ежегодные парламенты в Тапиуэ и Негрете (когда-то собрания по пересмотру переговоров между испанским губернатором и мапуче-лонко) теперь являются сессиями федерального законодательного органа. Календарь фиксированный. Лонко встречаются не тогда, когда зовет хуинка, а когда зовет Рече. Парламент стал сенатом." #NT!
 nd_map.7.a: "Пусть сенат заседает." #NT!
  
 nd_map.8.t: "Провозглашена Свободная Республика" #NT!
 nd_map.8.d: "Федерация объявляет себя республикой Рече, государством свободных людей. Вопрос в том, какая это будет республика: Сенат Лонко, состоящий из глав законодательных органов, или Судебная власть Мачи, состоящая из духовных юристов? Оба мапуче. Ни то, ни другое не имеет прецедентов на континенте." #NT!
 nd_map.8.a: "Лонкос принимают законы." #NT!
 nd_map.8.b: "Машины будут судить." #NT!
  
 nd_map.9.t: "Республика признала" #NT!
 nd_map.9.d: "Валмапу сделал то, чего не удавалось ни одной коренной американской нации: он стал суверенной республикой, признанной атлантическими державами. Теперь вопрос о ее дипломатической позиции: будет ли она обращена вовне, к атлантическим столицам, или внутрь, к континентальному договору свободных народов?" #NT!
 nd_map.9.a: "Посольства в Мадриде, Лондоне и Париже." #NT!
 nd_map.9.b: "Континентальный договор свободных народов." #NT!
  
 nd_map.10.t: "Токи Мапу едет на север" #NT!
 nd_map.10.d: "Эстафеты лошадей несут зов от границы Пикумче до хребтов Аконкагуана: Токи Мапу пересекла Мауле. Граница, которая сдерживала Тупака Юпанки в 1480 году, теперь является центром федерации, а не ее пределом. Трассы достигают моря в Вальпараисо." #NT!
 nd_map.10.a: "Мауле больше не является границей." #NT!
  
 nd_map.11.t: "За пределами Кордильер" #NT!
 nd_map.11.d: "Колонны федерации пересекли Анды: по дороге, построенной хуинками, или по бокетам, известным пеуэнче. Куйо кланяется, страна Диагита открывается, и мапуче сделали то, чего не достиг ни один народ Анд: они сражаются по обе стороны Кордильер как один." #NT!
 nd_map.11.a: "Езжайте по дороге конкистадора на север." #NT!
 nd_map.11.b: "Пеуэнш должен удерживать каждый проход." #NT!
  
 nd_map.12.t: "Токи Апу с континента" #NT!
 nd_map.12.d: "Четыре буталмапу превратились в пять, затем в семь. От Сальты до холмов Тандил, от хребта Кордильер до атлантических дюн проносится знамя федерации. Теперь Токи Апу должен выбрать свой стиль: имперский военачальник признанного доминиона или стадный король континентального государства-пампы?" #NT!
 nd_map.12.a: "Приветствуйте имперского Токи Апу." #NT!
 nd_map.12.b: "Сохраняйте пампу сердцем федерации." #NT!
  
  # ===== Destiny Buildings ===== 
 nd_map_parlamento_permanente: "Постоянный парламент" #NT!
 nd_map_parlamento_permanente_desc: "Постоянное республиканское собрание Рече. Там, где когда-то парламент созывался испанскими губернаторами в Килине или Негрете, теперь у федерации есть постоянная палата: бумага, чернила и избранные лонко на непрерывных заседаниях." #NT!
 nd_map_parlamento_maintenance: "Содержание Парламента" #NT!
 nd_map_parlamento_maintenance_desc: "Бумага для законодательных протоколов, тонкая ткань для сенаторских мантий лонкос, мебель для зала собраний и инструменты для писцовских станков." #NT!
 nd_map_toki_apu_hall: "Постоянный зал Токи Апу" #NT!
 nd_map_toki_apu_hall_desc: "Постоянное местопребывание императора Токи — не предвыборная палатка, построенная после войны, а постоянный зал вождя всех земель. Конас стоит на страже, лонкос платят дань, а копья висят вдоль стен." #NT!
 nd_map_toki_apu_maintenance: "Содержание постоянного зала" #NT!
 nd_map_toki_apu_maintenance_desc: "Оружие для арсенала конас, лошади для эстафетных конюшен, скот для императорского стола и пиломатериалы для постоянно расширяющегося зала." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_map_bureaucracy_authority: "Федеральный орган Валмапу" #NT!
 AUTO_MODIFIER_DESC_nd_map_bureaucracy_authority: "Федерации Айлареве Валмапу провозгласили федерацию, и четыре институциональных совета готовы к преобразованию в постоянные органы: военное собрание Токи Апу, региональная федерация Айлареве, сестричество транс-судей Мачи и (после Килина) Генеральный парламент. Два слота открываются рядом с неявным слотом столицы, что позволяет закрепить три из четырех, в то время как четвертый остается экстренным созывом по старому обычаю федерации." #NT!
  
 map_toki_apu_council_bureaucracy: "Совет Токи Апу" #NT!
 map_toki_apu_council_bureaucracy_desc: "Собрание военачальников. В обычное время каждый лоф отвечал своему лонко, а каждое реве — своему совету; только когда Айлареве собрались для проведения кампании, они избрали Токи (носителя топора), и только когда несколько Айлареве объединились в федерацию, они собрали Токи Апу из всех боевых отрядов. Лаутаро удерживал это звание против Вальдивии в Тукапеле; Пелантару против Онеса де Лойолы в Куралабе. Институционализация совета дает федерации единый мобилизующий кулак ценой беспокойства ульменов великого дома, которые предпочитают свое собственное благо приказу топора." #NT!
  
 map_aillarewe_federation_bureaucracy: "Федерация Айлареве" #NT!
 map_aillarewe_federation_bureaucracy_desc: "Региональная конфедерация из девяти регионов, которая является институциональной основой Валмапу. Каждый айллареве (Пикунче, Вентече, Нагче, Лафкенче, Певенче, Вуллуче) представлял собой постоянную федерацию из девяти советов, которые объединяли споры, организовывали зимние церемонии нгиллатун и поддерживали пограничные списки между родословными. Дела Конфедерации велись ульменами, сидящими у камня, а не центральным судом. Превращение Айлареве в постоянный институт сохраняет местную автономию лофов ценой любого стремления к централизованному Токи Мапу." #NT!
  
 map_machi_sisterhood_bureaucracy: "Сестричество Мачи" #NT!
 map_machi_sisterhood_bureaucracy_desc: "Орден двухдуховных шаманов-женщин и мачи-вей, служивших целителями, судьями и летописцами линий передачи. Мачи председательствовали на обрядах плодородия нгиллатун-реве, допрашивали подозреваемых колдунов векуфу на кальку-судах и хранили генеалогии, необходимые этим линиям для обоснования земельных претензий. Их власть находится за пределами воинской иерархии: ульмены боятся кальку-суда, лонкос подчиняются церемонии транса. Поддержанный порядок объединяет федерацию общим ритуалом; пренебрегая, он становится хищным, обвиняя соперников в трансе." #NT!
  
 map_parlamento_general_bureaucracy: "Генеральный парламент" #NT!
 map_parlamento_general_bureaucracy_desc: "Официальный совет, который испанские губернаторы Чили были вынуждены созвать с лонкосами Айлареве: в Килине в 1641 году, затем в Негрете, Тапиуэ и в других местах на протяжении семнадцатого и восемнадцатого веков. После поражения Куралабы Корона Кастилии признала федерацию суверенным контрагентом; Парламент издавал двуязычные тексты договоров, устанавливал границу Био-Био, обменивался пленниками и регулировал приграничную торговлю. Это единственный институт коренных американцев, признанный в атлантической дипломатической системе до восемнадцатого века, и единственный институт мапуче, к которому старые реве-линии относятся с подозрением, как к месту, где их автономия отторгается." #NT!
 STATIC_MODIFIER_NAME_nd_map_toki_federation: "Федерация Совета Токи" #NT!
 STATIC_MODIFIER_DESC_nd_map_toki_federation: "Федеральное управление Валмапу: айлларевес из девяти кланов Лоф, каждый из которых представлен миротворческим вождем Лонко; военный вождь токи избирается только тогда, когда федерация выступает с оружием в руках; Парламентская ассамблея Койактуна связывает федерацию советом. Наследственного короля не существует. Валмапу — это федерация родов, а не мантия вождя королевства." #NT!
