l_russian:
 STATIC_MODIFIER_NAME_nd_catholic_shield: "Католический щит" #NT!
 STATIC_MODIFIER_DESC_nd_catholic_shield: "Бавария является главным защитником католической веры в Империи, ее армии закалены религиозными убеждениями, а ее люди объединены ревностной ортодоксальностью." #NT!
 STATIC_MODIFIER_NAME_nd_wittelsbach_inheritance: "Наследство Виттельсбахов" #NT!
 STATIC_MODIFIER_DESC_nd_wittelsbach_inheritance: "Династия Виттельсбахов овладела искусством династической политики, сплетая сеть браков, союзов и культурного покровительства, которая расширяет влияние Баварии далеко за ее пределы." #NT!
 STATIC_MODIFIER_NAME_nd_bavarian_catholic_league_arms: "Оружие Католической лиги" #NT!
 STATIC_MODIFIER_DESC_nd_bavarian_catholic_league_arms: "Военный аппарат Католической лиги обеспечивает Баварию дисциплинированной пехотой и достаточным количеством рабочей силы для защиты веры." #NT!
 STATIC_MODIFIER_NAME_nd_bavarian_jesuit_diplomacy: "Иезуитская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_bavarian_jesuit_diplomacy: "Общество Иисуса служит дипломатическим инструментом Баварии, его колледжи обучают лояльных администраторов, а его миссии расширяют баварское влияние по всей католической Европе." #NT!
 STATIC_MODIFIER_NAME_nd_bavarian_primogeniture_law: "Закон о первородстве" #NT!
 STATIC_MODIFIER_DESC_nd_bavarian_primogeniture_law: "Закон неделимости гарантирует, что баварские земли перейдут в целости и сохранности к одному наследнику, положив конец многовековому разрушительному разделу." #NT!
 STATIC_MODIFIER_NAME_nd_bavarian_landtag_compact: "Ландтаг Компакт" #NT!
 STATIC_MODIFIER_DESC_nd_bavarian_landtag_compact: "Сословия Баварии заключили договор с герцогом, обменивая послушание на представительство и создавая стабильную систему управления." #NT!
 nd_bav.1.t: "Объединение Баварии" #NT!
 nd_bav.1.d: "Раздробленные земли баварских герцогств наконец-то объединились под одним знаменем. Мюнхен, обогащенный торговлей солью и благословленный церковью, готов возглавить королевство, простирающееся от альпийских перевалов до равнин Дуная. Вопрос теперь в том, какую Баварию мы построим. Должны ли мы выковать себя мечом католической веры, собрав наши армии как щит ортодоксии против ереси? Или мы последуем путем наших предков Виттельсбахов, мастеров династических интриг, покровителей искусства и образования, заключающих союзы посредством брака и культуры, а не завоеваний?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bav.1.a: "Мы – Щит Веры!" #NT!
 nd_bav.1.b: "Виттельсбахи выживут благодаря государственному управлению." #NT!
 nd_bav.2.t: "Воссоединение Баварии" #NT!
 nd_bav.2.d: "Ландсхутская война за наследство закончилась. После многих лет конфликта между соперничающими линиями Виттельсбахов Бавария-Мюнхен и Бавария-Ландсхут земли династии воссоединяются впервые за многие поколения. Герцог Альбрехт IV одержал победу, но цена была тяжелой: имперский арбитраж лишил некоторых территорий, а поместья требуют уступок. Теперь герцог предлагает революционную меру: закон о первородстве, который сделает герцогство навсегда неделимым. Сословия, собравшиеся на собрание, взвешивают свой ответ. Должно ли герцогство принять строгое первородство, сосредоточив всю власть в одной линии? Или же сословия должны потребовать заключения договора, обменивая свое согласие на гарантированные права представительства?" #NT!
 nd_bav.2.a: "Один герцог, одна Бавария: неделимая и вечная." #NT!
 nd_bav.2.b: "Ландтаг имеет право голоса." #NT!
 nd_bav.3.t: "Католическая лига" #NT!
 nd_bav.3.d: "Протестантские князья создают свой Союз, а ересь распространяется по всей Империи, герцог Максимилиан I Баварский ответил основанием Католической лиги. Этот союз католических имперских принцев, финансируемый баварским богатством и возглавляемый баварской решимостью, представляет собой мощнейшую военную силу в католической Германии. Под блестящим командованием графа Тилли 25-тысячная армия Лиги (хорошо обученная, хорошо снабженная и горящая исповедальным рвением) уже зарекомендовала себя на поле боя. Вопрос в том, как Бавария будет использовать этот грозный инструмент: как молот военной силы, чтобы сокрушить протестантское сопротивление, или как дипломатический инструмент, подкрепленный убеждениями иезуитов, для возвращения душ посредством образования и обращения?" #NT!
 nd_bav.3.a: "Пусть армии Тилли говорят от имени веры." #NT!
 nd_bav.3.b: "Иезуиты будут нашим лучшим оружием." #NT!
 nd_bav.4.t: "Барокко Мюнхен" #NT!
 nd_bav.4.d: "В Мюнхене происходят перемены. Театинская церковь возвышается над горизонтом, ее фасад в итальянском стиле барокко является свидетельством амбиций династии. В Нимфенбурге среди садов, соперничающих с Версалем, формируется летний дворец поразительного величия. Двор Виттельсбахов стал маяком художественного покровительства: итальянские архитекторы, фламандские художники и немецкие музыканты стекаются в столицу Баварии. С каждым поколением строителей Резиденция становится все более великолепной. То, что когда-то было скромной герцогской резиденцией среди многих в Империи, превратилось в одну из ведущих культурных столиц Европы, ее здания провозглашают баварскую мощь и католическое великолепие всем, кто их видит." #NT!
 nd_bav.4.a: "Мюнхен будет конкурировать с великими судами Европы." #NT!
 nd_bav_salt_road_tradition: "Традиция Соленой дороги" #NT!
 nd_bav_salt_road_tradition_desc: "Древние соляные дороги из Райхенхолла и Берхтесгадена через Мюнхен в Аугсбург сделали Баварию богатой. Контроль над этими маршрутами является основой баварской торговли." #NT!
 nd_bav_alpine_passes: "Укрепление Альпийского перевала" #NT!
 nd_bav_alpine_passes_desc: "Южная граница Баварии проходит по альпийским перевалам, естественным узким местам, которые с незапамятных времен были укреплены для контроля торговли и отражения захватчиков." #NT!
 nd_bav_hofbrau_tradition: "Хофброй Традиция" #NT!
 nd_bav_hofbrau_tradition_desc: "Традиция придворного пивоварения, кульминацией которой стало основание Хофбройхауса, отражает как баварскую экономическую изобретательность, так и социальную значимость общественных мест." #NT!
 nd_bav_wittelsbach_court: "Придворная культура Виттельсбахов" #NT!
 nd_bav_wittelsbach_court_desc: "Династия Виттельсбахов культивирует изысканный вкус и космополитические амбиции, привлекая художников и ученых со всей Европы." #NT!
 nd_bav_landshut_reunification: "Воссоединение Ландсхута" #NT!
 nd_bav_landshut_reunification_desc: "Ландсхутская война за наследство положила конец многовековому разделу Баварии. Согласно закону Альбрехта IV о первородстве 1506 года, герцогство стало навсегда неделимым." #NT!
 nd_bav_munich_staple_rights: "Основные права Мюнхена" #NT!
 nd_bav_munich_staple_rights_desc: "Основное право Мюнхена требует, чтобы вся соль, проходящая через город, выставлялась на продажу, прежде чем продолжить свой путь, обогащая столицу и укрепляя ее роль как коммерческого центра Баварии." #NT!
 nd_bav_rentmeister_system: "Система Рентмейстер" #NT!
 nd_bav_rentmeister_system_desc: "Разделение Баварии на административные округа, возглавляемые рентмейстерами, создало эффективную систему сбора налогов и регионального управления." #NT!
 nd_bav_catholic_league: "Католическая лига" #NT!
 nd_bav_catholic_league_desc: "Католическая лига, основанная Максимилианом I в 1609 году, объединила католических имперских князей под руководством Баварии, выставив на вооружение одну из самых грозных армий Тридцатилетней войны." #NT!
 nd_bav_jesuit_colleges: "Иезуитские колледжи" #NT!
 nd_bav_jesuit_colleges_desc: "Общество Иисуса основало колледжи по всей Баварии, которые служили инструментом как образования, так и контрреформации, готовя лояльных администраторов и обращая протестантское население." #NT!
 nd_bav_maximilian_reforms: "Фискальные реформы Максимилиана" #NT!
 nd_bav_maximilian_reforms_desc: "Герцог Максимилиан I с беспрецедентной строгостью реорганизовал баварские финансы, создав военный фонд, который финансировал Католическую лигу и сделал Баварию сильнейшим католическим княжеством." #NT!
 nd_bav_standing_army: "Баварская постоянная армия" #NT!
 nd_bav_standing_army_desc: "Постоянная Баварская армия, основанная курфюрстом Максимилианом II Эмануэлем в 1682 году, заменила временные рекруты профессиональными солдатами, в том числе отличительной кавалерией шеволегеров." #NT!
 nd_bav_baroque_patronage: "Барокко Меценатство" #NT!
 nd_bav_baroque_patronage_desc: "Курфюрсты Виттельсбахов превратили Мюнхен в шедевр барокко, построив Театральную церковь, дворец Нимфенбург и расширив Резиденцию." #NT!
 nd_bav_salt_monopoly: "Соляная монополия" #NT!
 nd_bav_salt_monopoly_desc: "Герцогская монополия на добычу баварской соли сконцентрировала огромные богатства в руках государства, финансируя как военные авантюры, так и покровительство культуре." #NT!
 nd_bav_montgelas_reforms: "Реформы Монгеласа" #NT!
 nd_bav_montgelas_reforms_desc: "Граф Монгелас модернизировал Баварию с 1799 года, отменив феодальные привилегии, секуляризовав церковные земли, введя гражданское равенство и создав современное бюрократическое государство." #NT!
 nd_bav_kingdom_sovereignty: "Суверенитет Королевства" #NT!
 nd_bav_kingdom_sovereignty_desc: "Возведенная Наполеоном в 1806 году в королевство, Бавария впервые обрела полный суверенитет, реорганизовав свою армию в соответствии с современными тенденциями и утвердившись в качестве самостоятельной европейской державы." #NT!
 nd_bav_reinheitsgebot_industry: "Райнхайтсгебот Промышленность" #NT!
 nd_bav_reinheitsgebot_industry_desc: "Индустриализация баварского пивоварения сочетает в себе многовековой опыт соблюдения закона о чистоте пива с современными технологиями, угольными солодовенными печами, механическими процессами и железнодорожным транспортом для производства пива в беспрецедентных масштабах." #NT!
 a_nd_bav_ritter: "Баварский Риттер" #NT!
 a_nd_bav_ritter_desc: "Тяжелая кавалерия в доспехах, набранная из представителей мелкой баварской знати, Риттеры атакуют с разрушительной силой в традициях феодальных имперских рыцарей." #NT!
 a_nd_bav_kreisinfanterie: "Крайзинфантерие" #NT!
 a_nd_bav_kreisinfanterie_desc: "Дисциплинированная пехота Имперского круга, обученная в соответствии с испанской традицией терсио и закаленная религиозными войнами. Они сражаются с убежденностью людей, защищающих свою веру." #NT!
 a_nd_bav_chevaulegers: "Баварские шеволегеры" #NT!
 a_nd_bav_chevaulegers_desc: "Легкая кавалерия постоянной баварской армии, обученная разведке, преследованию и быстрым фланговым маневрам в традициях баварской армии, находящейся под французским влиянием." #NT!
 nd_bav_salzkontor: "Зальцконтор" #NT!
 nd_bav_salzkontor_desc: "Торговый дом соли, который занимается закупкой, хранением и распространением самого ценного товара Баварии по древним соляным дорогам." #NT!
 nd_bav_jesuitenkolleg: "Иезуитский колледж" #NT!
 nd_bav_jesuitenkolleg_desc: "Колледж Общества Иисуса, сочетающий строгое классическое образование с теологией Контрреформации для подготовки лояльных католических администраторов и ученых." #NT!
 nd_bav_hofbrauhaus: "Хофбройхаус" #NT!
 nd_bav_hofbrauhaus_desc: "Придворная пивоварня служит одновременно экономическим предприятием и социальным учреждением, производящим прекрасное баварское пиво и одновременно являющимся местом собраний, способствующим укреплению гражданской лояльности." #NT!
 nd_bav_barockschloss: "Барокшлосс" #NT!
 nd_bav_barockschloss_desc: "Великолепный дворец в стиле барокко в традициях Виттельсбахов, провозглашающий культурные амбиции династии посредством итальянской архитектуры, формальных садов и роскошного внутреннего убранства." #NT!
 nd_bav_salt_processing: "Обработка соли" #NT!
 nd_bav_salt_processing_desc: "Для переработки и распространения альпийской соли требуются каменные склады, древесина в качестве топлива и ткань для мешков и хранения." #NT!
 nd_bav_jesuit_curriculum: "Иезуитская учебная программа" #NT!
 nd_bav_jesuit_curriculum_desc: "Ratio Studiorum требует постоянного снабжения печатными учебниками и богословскими трактатами, а также свечами из пчелиного воска для освещения вечерних занятий." #NT!
 nd_bav_court_brewing: "Корт Пивоварение" #NT!
 nd_bav_court_brewing_desc: "Герцогская пивоварня солодит пшеницу, а бондари заготавливают бочки для производства прекрасного баварского пива." #NT!
 nd_bav_baroque_upkeep: "Барокко" #NT!
 nd_bav_baroque_upkeep_desc: "Для содержания дворца в стиле барокко требуется камень для ремонта, тонкая ткань для гобеленов и прекрасная мебель для парадных покоев." #NT!
 nd_bav_salzwerk: "Зальцверк" #NT!
 nd_bav_salzwerk_desc: "Соляной завод, перерабатывающий альпийскую каменную соль путем выпаривания и очистки, поставляет самый прибыльный товар для торговли в Баварии." #NT!
 nd_bav_brauerei: "Браурей" #NT!
 nd_bav_brauerei_desc: "Пивоварня промышленного масштаба, производящая пиво в соответствии с законом о чистоте Reinheitsgebot, потребляющая огромное количество пшеницы и угля." #NT!
 nd_bav_salt_refining: "Очистка соли" #NT!
 nd_bav_salt_refining_desc: "Альпийская каменная соль обрабатывается путем выпаривания и очистки в каменных печах, работающих на древесине, в результате чего получается рафинированная соль для продажи." #NT!
 nd_bav_industrial_brewing: "Промышленное пивоварение" #NT!
 nd_bav_industrial_brewing_desc: "Промышленное пивоварение под управлением Reinheitsgebot использует угольные солодовенные печи и огромное количество пшеницы для производства пива в беспрецедентных объемах." #NT!
 levy_nd_bav_ritter: "Баварский Риттер Леви" #NT!
 levy_nd_bav_ritter_desc: "Благородная кавалерия, собранная из представителей мелкой баварской аристократии, служила тяжелыми ударными войсками." #NT!
 nd_bav_formed_tt: "была образована Бавария." #NT!
 nd_bav_path_a_tt: "Выбрал католический щит" #NT!
 nd_bav_path_b_tt: "Выбрали наследство Виттельсбахов" #NT!
 nd_bav_destiny: "Баварская судьба" #NT!
 nd_bav_destiny_desc: "«Юнайтед Бавария» стоит на перепутье. Судьба королевства Виттельсбахов, выкованного ли в огне католического рвения или сформированного династической хитростью, теперь находится в наших руках." #NT!
 nd_bav_dest_salzburg_crusade: "Зальцбургский крестовый поход" #NT!
 nd_bav_dest_salzburg_crusade_desc: "Защитите великое католическое епископство Зальцбург и имперский город Аугсбург, чтобы закрепить позиции Баварии как главного защитника веры на юге Германии." #NT!
 nd_bav_dest_palatinate_claim: "Иск Пфальца" #NT!
 nd_bav_dest_palatinate_claim_desc: "Захватите Гейдельберг и электорат Пфальца, как это сделал Максимилиан I после битвы при Белой горе, сделав Баварию главной военной державой среди католических князей." #NT!
 nd_bav_dest_catholic_supremacy: "Католическое превосходство" #NT!
 nd_bav_dest_catholic_supremacy_desc: "Приведите Прагу и Вену под власть Баварии, затмив самих Габсбургов как высшую католическую власть в Центральной Европе." #NT!
 nd_bav_dest_golden_treasury: "Золотая сокровищница" #NT!
 nd_bav_dest_golden_treasury_desc: "Создайте финансовые основы Баварии, приняв современное банковское дело и накопив огромную казну, достойную амбиций Виттельсбаха." #NT!
 nd_bav_dest_cultural_metropolis: "Культурный мегаполис" #NT!
 nd_bav_dest_cultural_metropolis_desc: "Превратите Мюнхен в культурную столицу, привлекая на свои рынки предметы роскоши, такие как шелк, используя печатный станок и развивая международную репутацию." #NT!
 nd_bav_dest_wittelsbach_zenith: "Виттельсбах Зенит" #NT!
 nd_bav_dest_wittelsbach_zenith_desc: "Достигните вершины власти Виттельсбахов, огромной казны, непревзойденного престижа, процветающего королевства и владения глобальными торговыми сетями." #NT!
 nd_bav.5.t: "Баварская судьба" #NT!
 nd_bav.5.d: "Бавария сформирована, и выбранный нами путь лежит впереди. Традиции наших предков направляют нас, но именно мы должны ковать будущее. Будь то меч или государственное управление, имя Виттельсбаха будет эхом звучать в веках." #NT!
 nd_bav.5.a: "Наша судьба ждет." #NT!
 nd_bav.6.t: "Соль и меч" #NT!
 nd_bav.6.d: "Зальцбург, древнее княжество-епископство, чьи соляные шахты когда-то могли соперничать с нашими, теперь развевается под баварским знаменем. И Аугсбург (тот великий имперский город, где было прочитано роковое Исповедание, где католики и протестанты впервые провели свои богословские боевые линии) оказался в наших рядах. Благодаря богатству зальцбургских рудников и коммерческой мощи аугсбургских банкиров положение Баварии как католического защитника юга не подлежит сомнению. Соляные дороги и дороги-мечи теперь едины." #NT!
 nd_bav.6.a: "У веры есть свой щит." #NT!
 nd_bav.7.t: "Пфальцский электорат" #NT!
 nd_bav.7.d: "Гейдельберг пал. Местонахождение Пфальца, некогда оплота кальвинистской ереси и искры, разжигавшей великие религиозные войны, теперь принадлежит нам. Как Максимилиан I отобрал избирательное достоинство у Фридриха V после битвы при Белой горе, так и мы потребовали того, что по праву принадлежало католической доблести. Вопрос в том, как мы закрепим этот триумф. Должны ли мы подражать молоту Тилли, превращая наши армии в неудержимый инструмент завоевания? Или нам следует высоко поднять знамя Лиги, вдохновляя католических принцев по всей Империи сплотиться на нашей стороне?" #NT!
 nd_bav.7.a: "Снова выковать молот Тилли." #NT!
 nd_bav.7.b: "Соберите князей под наше знамя." #NT!
 nd_bav.8.t: "Католический Империум" #NT!
 nd_bav.8.d: "Прага и Вена склоняются перед баварским львом. Дефенестрация Праги когда-то погрузила Европу в десятилетия войны, теперь шпили этого города сияют под властью Виттельсбахов. А Вена, резиденция Габсбургов на протяжении веков, уступила место более мощной католической державе. Бавария достигла того, о чем даже самые амбициозные из ее герцогов не смели мечтать: господства над всем католическим центром Центральной Европы. Должны ли мы построить империю крепостей и линий снабжения, чтобы удерживать эти обширные завоевания, или следовать стратегии быстрых войн и решающих побед, чтобы постоянно держать наших врагов вне равновесия?" #NT!
 nd_bav.8.a: "Постройте крепость христианского мира." #NT!
 nd_bav.8.b: "Ударьте стремительно, как у Белой Горы." #NT!
 nd_bav.9.t: "Казначейство Виттельсбахов" #NT!
 nd_bav.9.d: "Хранилища Мюнхена переполнены. Благодаря умелому внедрению современной банковской практики и бережному управлению ресурсами нашего королевства Бавария накопила богатство, на которое обратили бы внимание сами Фуггеры. Доходы от соли, прибыль от пивоварения, тщательное управление герцогскими поместьями — все это внесло свой вклад в казну, которая дает Виттельсбахам возможности, которые одна только грубая военная сила никогда не могла бы предоставить. Золото открывает двери, которые не могут открыть мечи." #NT!
 nd_bav.9.a: "Богатство – основа всякой власти." #NT!
 nd_bav.10.t: "Мюнхенский Асцендент" #NT!
 nd_bav.10.d: "Торговцы шелком из Венеции и Константинополя теперь часто посещают рынки Мюнхена. Типографии Баварии печатают тексты, которые ищут ученые по всей Европе. Двор Виттельсбахов стал магнитом для художников, философов и ученых. Мюнхен больше не является просто столицей немецкого герцогства. Он становится самостоятельным европейским культурным центром. Должны ли мы сосредоточиться на превращении Мюнхена в настоящий академический город, привлекающий к нашему двору лучшие умы? Или нам следует расширить дипломатическую сеть Виттельсбахов, сплетая союзы и династические связи по всему континенту?" #NT!
 nd_bav.10.a: "Мюнхен должен стать академией для всей Европы." #NT!
 nd_bav.10.b: "Расширьте сеть альянсов Виттельсбахов." #NT!
 nd_bav.11.t: "Виттельсбах Зенит" #NT!
 nd_bav.11.d: "Династия Виттельсбахов достигла своего расцвета. Сокровищница, переполненная золотом, царство непревзойденного престижа и развития, господство глобальных торговых сетей: Бавария преодолела свое происхождение как приграничное герцогство и стала одной из великих держав Европы благодаря культуре, дипломатии и экономической мощи, а не только завоеваниям. Представление короля Людвига о Мюнхене как об «Афинах на Изаре» уже не мечта, а реальность. Глиптотека и Пинакотека являются памятниками цивилизации, которая предпочла строить, а не разрушать. Должны ли мы увенчать это достижение золотым веком искусства и городского великолепия или реализовать грандиозную династическую концепцию, которая изменит политическую карту Европы?" #NT!
 nd_bav.11.a: "Пусть Мюнхен станет Афинами на Изаре." #NT!
 nd_bav.11.b: "Видение Виттельсбаха изменит Европу." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_tilly_hammer: "Молот Тилли" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_tilly_hammer: "Армия превратилась в инструмент разрушительной эффективности, обученный методам великого графа Тилли, быстрого набора и неустанного морального духа, хотя стоимость такой военной машины напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_league_banner: "Знамя Лиги" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_league_banner: "Под знаменем Католической лиги армии Баварии быстро пополняются и сражаются с яростью людей, которые верят, что Бог на их стороне." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_catholic_imperium: "Католический Империум" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_catholic_imperium: "Обширная сеть крепостей защищает католическую империю Баварии, а линии снабжения простираются через Центральную Европу; хотя дипломатическое мастерство было принесено в жертву военному господству." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_white_mountain: "Доктрина Белой Горы" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_white_mountain: "Доктрина быстрой и решительной войны, практикуемая в битве при Белой горе, позволяет Баварии быстро выдвигать претензии и вести переговоры, используя силу, хотя внутреннее строительство страдает от военной направленности." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_munich_academy: "Мюнхенская академия" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_munich_academy: "Академии и салоны Мюнхена привлекают ученых и художников со всей Европы, распространяя баварское культурное влияние и ассимилируя новое население в лоно Виттельсбахов." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_wittelsbach_network: "Сеть Виттельсбаха" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_wittelsbach_network: "Дипломатическая сеть Виттельсбахов охватывает весь континент, связывая союзников и подданных Баварии браками, договорами и взаимными обязательствами; хотя поддержание такой сети оставляет меньше денег для наемников." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_athens_on_isar: "Афины на Изаре" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_athens_on_isar: "Мюнхен превратился в Афины на Изаре, город великолепной архитектуры, эффективного управления и культурного великолепия, хотя у ученых двора мало терпения к военной логистике." #NT!
 STATIC_MODIFIER_NAME_nd_bav_dest_ludwig_vision: "Видение Людвига" #NT!
 STATIC_MODIFIER_DESC_nd_bav_dest_ludwig_vision: "Великое видение короля Людвига о процветающей, стабильной и самодостаточной Баварии было реализовано, королевстве, где сепаратизм неизвестен, а люди сыты, хотя пацифистская репутация нации делает войну дорогостоящим предприятием." #NT!
 nd_bav_mariensaule: "Мариенсауле" #NT!
 nd_bav_mariensaule_desc: "Высокая колонна Марии, возведенная в самом центре города, провозглашает преданность Баварии Деве Марии и ее победу над ересью, чумой и иностранным вторжением." #NT!
 nd_bav_marian_devotion: "Мэриан Преданность" #NT!
 nd_bav_marian_devotion_desc: "Регулярные обряды и шествия вокруг Мариенсаула требуют пчелиного воска для свечей, камня для ухода и ткани для облачений и знамен." #NT!
 nd_bav_glyptothek: "Глиптотека" #NT!
 nd_bav_glyptothek_desc: "Неоклассический музей, в котором хранится великолепная коллекция греческой и римской скульптуры, воплощающая видение короля Людвига I о Мюнхене как о культурной столице Европы." #NT!
 nd_bav_sculpture_collection: "Коллекция скульптур" #NT!
 nd_bav_sculpture_collection_desc: "Для поддержания коллекции классической скульптуры Глиптотеки требуется камень для ремонта, бумага для каталогов и стекло для витрин." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_bav_bureaucracy_authority: "Административный орган Виттельсбаха" #NT!
 AUTO_MODIFIER_DESC_nd_bav_bureaucracy_authority: "Канцелярия Мюнхена достаточно зрела, чтобы управлять институциональными министерствами: помимо постоянного места в столице, государство Виттельсбахов может содержать еще две бюрократии по своему выбору." #NT!
  
 bav_geheimer_rat_bureaucracy: "Гехаймер Крыса" #NT!
 bav_geheimer_rat_bureaucracy_desc: "Основанный Альбертом IV в 1488 году и реорганизованный Альбертом V в 1570 году, Geheimer Rat стал центральным исполнительным советом Баварского герцогства. Небольшая группа обученных юристов готовила указы для герцога, руководила канцелярией и с 1620 года управляла военным правительством Максимилиана I, заменив старого Хофрата в качестве резиденции исполнительной власти в Мюнхене." #NT!
  
 bav_hofkammer_bureaucracy: "Хофкамер" #NT!
 bav_hofkammer_bureaucracy_desc: "Аулическая палата Мюнхена, реорганизованная Вильгельмом IV в 1530-х годах и снова Максимилианом I после 1598 года, управляла регалиями Виттельсбахов: соляной монополией Райхенхалле и Траунштайном, таможней в Вассербурге и Бургхаузене, герцогом Мунцамтом и доходами от коронных поместий. Его дисциплинированные счета сделали доходы от баварской соли одними из самых богатых королевских доходов в Империи и послужили источником финансирования Католической лиги." #NT!
  
 bav_landstaende_bureaucracy: "Баварский Ландштенде" #NT!
 bav_landstaende_bureaucracy_desc: "Баварский сословный сейм прелатов, дворян и городских депутатов, который нерегулярно собирался в Мюнхене и Ландсхуте с четырнадцатого века. Ландтаг 1577 года издал Landesfreiheitserklarung — территориальную хартию, оформляющую права собственности на согласие на чрезвычайное налогообложение. Сейм управлял герцогством совместно с его герцогами до тех пор, пока военные чрезвычайные ситуации Максимилиана I не отодвинули его на второй план после 1620 года, и оно было окончательно распущено реформами Монгеласа в 1808 году." #NT!
  
 bav_geistlicher_rat_bureaucracy: "Гейстлихер Крыса" #NT!
 bav_geistlicher_rat_bureaucracy_desc: "Церковный совет, учрежденный Альбертом V в 1570 году, чтобы направить герцогство в сторону контрреформации. Укомплектованный советниками, прошедшими обучение иезуитами, он контролировал назначение епископов, лицензировал типографии, управлял баварскими семинариями и курировал сеть иезуитских колледжей в Ингольштадте, Мюнхене, Диллингене и Ландсхуте. При Максимилиане I Бавария стала интеллектуальным арсеналом Католической лиги." #NT!
  
 bav_hofmark_bureaucracy: "Хофмаркен" #NT!
 bav_hofmark_bureaucracy_desc: "Баварская система родовой сеньоральной юрисдикции, закрепленная в Landrecht 1518 года и последующих Landgerichtsordnungen, согласно которой аббатства, рыцари и знатные землевладельцы осуществляли суды низшей инстанции, полицейские полномочия и сбор налогов со своих арендаторов. Рентмейстер координировал действия, но ежедневным правосудием руководили Хофмаркшеррены, и система пережила все реформы вплоть до ее отмены баварской конституцией 1818 года." #NT!
