l_russian:
 STATIC_MODIFIER_NAME_nd_sia_warrior_kings: "Наследие королей-воинов" #NT!
 STATIC_MODIFIER_DESC_nd_sia_warrior_kings: "От завоеваний Рамкхамхенга до освобождения Наресуана короли Сиама всегда вели войну с фронта. Основание этого королевства продолжает военную традицию, заработанную столетиями войн против Бирмы, Камбоджи и малайских государств." #NT!
 STATIC_MODIFIER_NAME_nd_sia_venice_of_the_east: "Венеция Востока" #NT!
 STATIC_MODIFIER_DESC_nd_sia_venice_of_the_east: "Плавучие рынки, иностранные кварталы и королевские торговые дома Аюттхая привлекали торговцев из Китая, Японии, Персии и Европы. Богатство королевства текла через его реки, а терпимость к иностранным верованиям и обычаям сделала его торговым перекрестком Юго-Восточной Азии." #NT!
 nd_sia.1.t: "Объединение Сиама" #NT!
 nd_sia.1.d: "Тайские земли объединены под одной короной. От рисовых полей Чао Прайя до горных долин на севере Сиамское королевство управляет царством огромной стратегической важности, расположенным по обе стороны торговых путей, связывающих Китай с Индией, благословленным плодородными речными равнинами и защищенным горными перевалами и реками, питаемыми муссонами.\n\nНо что это будет за королевство? Воинские традиции Сукотаи и боевая слава дуэли Наресуана против Бирмы на слонах манят к военному превосходству. Однако космополитическое наследие Аюттхая, где японские самураи служили вместе с персидскими купцами и португальскими торговцами, указывает на другую судьбу: Сиам как великий перевалочный пункт Востока.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sia.1.a: "Мы будем королями войны, какими был Наресуан." #NT!
 nd_sia.1.b: "Мы станем королями торговли, какими была Аюттхая." #NT!
 STATIC_MODIFIER_NAME_nd_sia_naresuan_military: "Военные реформы Наресуана" #NT!
 STATIC_MODIFIER_DESC_nd_sia_naresuan_military: "По примеру короля Наресуана армия реорганизуется вокруг профессиональных солдат и постоянных сил, а не из сезонных барщинных наборов." #NT!
 STATIC_MODIFIER_NAME_nd_sia_naresuan_commerce: "Торговое наследие Наресуана" #NT!
 STATIC_MODIFIER_DESC_nd_sia_naresuan_commerce: "Мир, достигнутый благодаря победам Наресуана, открывает королевство для расширения торговли, а Аюттхая становится одним из величайших торговых центров в Азии." #NT!
 nd_sia.2.t: "Слоновья дуэль Нонг Сарай" #NT!
 nd_sia.2.d: "В изнуряющей жаре битвы при Нонг Сарае настал момент, который определит Сиам на века. Наследный принц Бирмы Мингьи Сва верхом на своем боевом слоне вызвал сиамского короля на единоборство, поединок чести между правителями в древней традиции.\n\nСиамский чемпион принимает вызов. В грохоте схватки боевых слонов бирманский принц пал. С его смертью власть Бирмы над Сиамом рушится. Королевство освобождено, и имя Наресуана становится бессмертным. Но как использовать эту победу? Сам Наресуан обратился к военной реформе, создав постоянные силы, способные нанести удар вглубь вражеской территории. Другие воспользуются передышкой для расширения торговых сетей Аюттхая по всей Азии." #NT!
 nd_sia.2.a: "Реформируйте армии: Сиам никогда больше не будет завоеван." #NT!
 nd_sia.2.b: "Расширяйте торговые дома. Пусть победа принесет процветание." #NT!
 STATIC_MODIFIER_NAME_nd_sia_chakri_centralization: "Централизация чакри" #NT!
 STATIC_MODIFIER_DESC_nd_sia_chakri_centralization: "Короли Чакри консолидируют королевскую власть, взяв провинциальных лордов и отдаленных данников под твердый контроль Бангкока." #NT!
 STATIC_MODIFIER_NAME_nd_sia_chakri_openness: "Открытость Чакри" #NT!
 STATIC_MODIFIER_DESC_nd_sia_chakri_openness: "Суд Чакри взаимодействует с европейской наукой, технологиями и дипломатией, позиционируя Сиам как современное государство, способное противостоять колониальным державам." #NT!
 nd_sia.3.t: "Основание династии Чакри" #NT!
 nd_sia.3.d: "Пепел Аюттхая осел, но на его основе возрождается новый порядок. Генерал Чакри, блестящий полководец, который помог воссоединить королевство, основал новую династию и перенес столицу через реку в Раттанакосин, место, которое впоследствии станет Бангкоком.\n\nРама I, как называет себя новый король, сталкивается с задачей восстановления не просто города, но и цивилизации. Разрушение Аюттайи бирманцами уничтожило столетия юридических кодексов, религиозных текстов и административных документов. Новый король заказывает полный пересмотр Трипитаки, заново кодифицирует законы и строит великолепный Храм Изумрудного Будды.\n\nСможет ли династия Чакри централизовать власть в новой столице, создав более сильное и более единое государство? Или же оно откроет Сиам миру, приняв иностранные знания и торговлю, необходимые для выживания в эпоху европейской экспансии?" #NT!
 nd_sia.3.a: "Централизуйте королевство под троном Чакри." #NT!
 nd_sia.3.b: "Откройте двери: Сиам должен учиться у мира." #NT!
 nd_sia_sangha_tradition: "Традиция Сангхи" #NT!
 nd_sia_sangha_tradition_desc: "Буддийская Сангха составляет духовную основу сиамского общества. Королевское покровительство монастырям и рукоположение монахов поддерживают социальную гармонию и религиозную преданность во всем королевстве." #NT!
 nd_sia_phrai_corvee: "Система барщины Пхрай" #NT!
 nd_sia_phrai_corvee_desc: "Система Пхрай призывает простых людей на шестимесячную ежегодную службу короне в качестве солдат, чернорабочих или ремесленников. У каждого мужчины есть татуировка, обозначающая его отдел и обязанности." #NT!
 nd_sia_rice_granary_system: "Королевские рисовые зернохранилища" #NT!
 nd_sia_rice_granary_system_desc: "Централизованные зернохранилища собирают и перераспределяют урожай риса королевства, обеспечивая продовольственную безопасность и позволяя мобилизовать армии, не вызывая голода в провинциях." #NT!
 nd_sia_sakdina_hierarchy: "Сакдина Иерархия" #NT!
 nd_sia_sakdina_hierarchy_desc: "Система Сакдина присваивает каждому человеку числовой ранг, измеряемый в единицах рисовых полей, от короля до самого низкого простолюдина. Эта иерархия определяет барщинные обязательства, правовой статус и доступ к королевской благосклонности." #NT!
 nd_sia_khlong_engineering: "Кхлонг Канал Инжиниринг" #NT!
 nd_sia_khlong_engineering_desc: "Сети каналов, хлонгов, пересекают дельту Чао Прайя, орошая рисовые поля, транспортируя товары и соединяя общины. Эти водные пути являются артериями сиамской цивилизации." #NT!
 nd_sia_thai_silk_tradition: "Тайская шелковая традиция" #NT!
 nd_sia_thai_silk_tradition_desc: "Сиамское шелковое ткачество производит ткани исключительного качества и рисунка, которые ценятся во всей Азии. Сочетание местного выращивания шелковицы и квалифицированных ремесленников создает роскошный экспортный товар, имеющий непреходящую ценность." #NT!
 nd_sia_royal_fleet: "Королевские военные баржи" #NT!
 nd_sia_royal_fleet_desc: "Сиамский королевский флот военных барж патрулирует Чао Прайю и Сиамский залив, демонстрируя королевскую власть на водных путях королевства и прибрежных торговых путях." #NT!
 nd_sia_phraklang_system: "Торговые дома Фракланг" #NT!
 nd_sia_phraklang_system_desc: "Фракланг, министр королевского казначейства, курирует всю внешнюю торговлю через специализированные бюро: одно для западных купцов, другое для восточных. Эта королевская монополия направляет огромные богатства в казну короны.\n\n#italic Доступно в: $nd_sia_phraklang$#!" #NT!
 nd_sia_cosmopolitan_court: "Космополитический суд" #NT!
 nd_sia_cosmopolitan_court_desc: "Сиамский двор приветствует торговцев, искателей приключений и ученых со всего известного мира. Японские самураи служат королевской гвардией, китайские купцы доминируют в речной торговле, персидские дипломаты ведут государственные дела, а европейские миссионеры свободно проповедуют." #NT!
 nd_sia_devaraja_tradition: "Божественное Царство Девараджи" #NT!
 nd_sia_devaraja_tradition_desc: "Опираясь на кхмерские традиции, сиамский король посвящается в божественное существо на земле посредством индуистской церемонии Раджабхисекха. Концепция Девараджи возвышает монарха над всей земной властью." #NT!
 nd_sia_artisan_guilds: "Королевские гильдии ремесленников" #NT!
 nd_sia_artisan_guilds_desc: "Королевский двор покровительствует гильдиям искусных мастеров, производящих лаковые изделия, сусальное золото и декоративные изделия из металла. Эти предметы роскоши служат как дипломатическими подарками, так и товарами для торговли.\n\n#italic Доступно в: $nd_sia_phraklang$#!" #NT!
 nd_sia_palatine_law: "Кодификация Палатинского права" #NT!
 nd_sia_palatine_law_desc: "Кодекс «Трех печатей» устанавливает всеобъемлющую правовую основу, регулирующую наследование, собственность, уголовное правосудие и обязательства системы Пхрай. Написанная на рукописях из пальмовых листьев и скрепленная королевскими печатями, она наводит порядок в королевстве." #NT!
 nd_sia_krom_asa_guards: "Кром Аса Королевская гвардия" #NT!
 nd_sia_krom_asa_guards_desc: "Кром Аса — это профессиональные солдаты короля, не сезонные барщинные рекруты, а постоянные воины, содержащиеся за королевский счет. Они составляют элитное ядро ​​сиамской армии, обученное рукопашному бою и личной преданности трону." #NT!
 nd_sia_junk_fleet: "Сиамский мусорный флот" #NT!
 nd_sia_junk_fleet_desc: "Джонки китайского типа, построенные на сиамских верфях под контролем Китая, перевозят сиамские торговые товары через Южно-Китайское море. Быстрые, маневренные и хорошо вооруженные для своего размера, они одинаково эффективны как торговцы и рейдеры." #NT!
 nd_sia_liberation_wars: "Освободительные войны" #NT!
 nd_sia_liberation_wars_desc: "Столетия бирманского господства заканчиваются тем, что сиамские короли отказываются подчиняться. Освободительные войны, от поединка на слонах Наресуана до защиты Аюттхая, формируют национальную идентичность, определяемую сопротивлением и суверенитетом." #NT!
 nd_sia_pom_fortification: "Пограничные укрепления Пом" #NT!
 nd_sia_pom_fortification_desc: "Сиамские крепости (пом) охраняют западные перевалы от бирманского вторжения, а южные подходы — от малайских набегов. Построенные из кирпича и земли, они закрепляют оборонительные линии вдоль рек и горных ущелий." #NT!
 nd_sia_foreign_quarters: "Администрация Иностранного квартала" #NT!
 nd_sia_foreign_quarters_desc: "Специально выделенные кварталы для японцев, китайцев, португальцев, голландцев и других иностранных общин позволяют Аюттайе управлять своим космополитическим населением. Каждая община управляется своим старостой, но подчиняется сиамской королевской власти." #NT!
 nd_sia_royal_monopoly: "Королевская торговая монополия" #NT!
 nd_sia_royal_monopoly_desc: "Сиамская корона претендует на эксклюзивное право на торговлю ключевыми товарами: оловом, тиком, оленьими шкурами и ароматическими породами древесины. Иностранные торговцы должны вести дела через королевских агентов, чтобы король оставался самым богатым торговцем королевства." #NT!
 nd_sia_golden_age: "Золотой век Аюттхая" #NT!
 nd_sia_golden_age_desc: "На пике своего развития Аютия может соперничать с любым городом мира по богатству и великолепию. Шпили его храмов пронзают небо, каналы изобилуют торговлей, а двор ослепляет иностранных послов тщательно продуманными церемониями и дипломатической изысканностью." #NT!
 nd_sia_rice_export: "Экономика экспорта риса" #NT!
 nd_sia_rice_export_desc: "Плодородная дельта Чао Прайя производит излишки риса, который кормит не только Сиам, но и соседние королевства и торговых партнеров. Рис становится основой сиамской экспортной экономики, обмениваясь на предметы роскоши со всей Азии." #NT!
 nd_sia_thahan_suea_tradition: "Традиция Тахан Суэа" #NT!
 nd_sia_thahan_suea_tradition_desc: "Солдаты-тигры, Тахан Суэа, представляют собой модернизацию сиамских вооруженных сил. Не ограничиваясь слоновьей войной и барщинными сборами, эти профессиональные завсегдатаи тренируются в обращении с огнестрельным оружием и дисциплине европейского образца." #NT!
 nd_sia_taksin_reconquest: "Реконкиста Таксина" #NT!
 nd_sia_taksin_reconquest_desc: "После катастрофического падения Аюттайи под власть Бирмы в 1767 году генерал Таксин собирает разрозненные тайские силы и в течение одного десятилетия отвоевывает все утраченные территории, воссоединяя королевство со своей новой столицей Тонбури." #NT!
 nd_sia_chakri_founding: "Основание династии Чакри" #NT!
 nd_sia_chakri_founding_desc: "Генерал Чакри основывает новую династию и переносит столицу в Раттанакосин, Бангкок, размещая ее для защиты за речными и канальными барьерами. Величественный дворец и Храм Изумрудного Будды становятся символами обновленной тайской цивилизации." #NT!
 nd_sia_tripitaka_revision: "Трипитака Библейское возрождение" #NT!
 nd_sia_tripitaka_revision_desc: "Рама I заказывает полную переработку и переписывание буддийской Трипитаки, собирая монахов со всего королевства для восстановления священных текстов, уничтоженных при падении Аюттхая. Этот монументальный научный труд сохраняет учение Тхеравады для будущих поколений." #NT!
 nd_sia_bowring_treaty: "Договор Боуринга" #NT!
 nd_sia_bowring_treaty_desc: "Договор 1855 года с Великобританией отменяет королевскую торговую монополию и открывает Сиам для свободной торговли. Хотя это ограничивает сиамский суверенитет над тарифами, оно также модернизирует экономику, превращая Сиам из полузакрытого королевства в участника глобального рынка." #NT!
 nd_sia_diplomatic_balance: "Дипломатический баланс" #NT!
 nd_sia_diplomatic_balance_desc: "Выживание Сиама в эпоху колониализма зависит от игры британцев против французов, голландцев против американцев. Опытные дипломаты бороздят эти коварные воды, уступая периферийные территории, чтобы сохранить независимость королевства." #NT!
 nd_sia_modernization_reforms: "Реформы модернизации" #NT!
 nd_sia_modernization_reforms_desc: "Короли Чакри проводят радикальные реформы: современная бюрократия заменяет феодальные должности, наемные чиновники заменяют барщинных администраторов, а западные правовые кодексы принимаются наряду с традиционным правом. Сиам трансформируется изнутри, чтобы избежать трансформации со стороны посторонних." #NT!
 nd_sia_uncolonized_sovereignty: "Непокоренный суверенитет" #NT!
 nd_sia_uncolonized_sovereignty_desc: "Единственный среди государств Юго-Восточной Азии, Сиам никогда не был колонизирован. Благодаря дипломатической хитрости, военному сдерживанию и своевременной модернизации Сиамское королевство сохраняет свой суверенитет, в то время как все его соседи переходят под власть европейских империй." #NT!
 a_nd_sia_phrai_luang: "Прай Луанг" #NT!
 a_nd_sia_phrai_luang_desc: "Барщинские призывники, набираемые из простого населения по системе Пхрай. У каждого есть татуировка, обозначающая назначенный ему отдел и обязательную службу короне." #NT!
 n_nd_sia_royal_war_barge: "Королевская военная баржа" #NT!
 n_nd_sia_royal_war_barge_desc: "Богато украшенные, но смертоносные боевые баржи сиамского королевского флота, предназначенные для речного боя и прибрежного патрулирования вдоль Чао Прайя и Сиамского залива." #NT!
 a_nd_sia_krom_asa: "Кром Аса" #NT!
 a_nd_sia_krom_asa_desc: "Профессиональные королевские гвардейцы содержались за личный счет короля. В отличие от барщинных рекрутов, Кром Аса служат круглый год, составляя элитное ядро ​​сиамской армии." #NT!
 n_nd_sia_trade_junk: "Сиамский торговый барахло" #NT!
 n_nd_sia_trade_junk_desc: "Торговые джонки в китайском стиле, построенные на сиамских верфях, способные выполнять функции торговых судов и легких военных кораблей. Быстро и уверенно они перевозят сиамские товары через Южно-Китайское море." #NT!
 a_nd_sia_thahan_suea: "Тахан Суа" #NT!
 a_nd_sia_thahan_suea_desc: "Солдаты-тигры, модернизированные сиамские регулярные войска, обученные обращению с огнестрельным оружием и дисциплинированные формирования, представляют собой переход от традиционной войны к современной." #NT!
 nd_sia_wat: "Ват" #NT!
 nd_sia_wat_desc: "Буддийский храмовый комплекс Тхеравады, служащий духовным, образовательным и социальным центром сиамских общин. Королевский патронаж Сангхи поддерживает систему ват по всему королевству." #NT!
 nd_sia_khlong: "Канал Клонг" #NT!
 nd_sia_khlong_desc: "Инженерный канал, соединяющий водные пути через дельту Чао Прайя и служащий оросительным каналом, транспортным маршрутом и инфраструктурой борьбы с наводнениями." #NT!
 nd_sia_phraklang: "Торговый Дом Фракланг" #NT!
 nd_sia_phraklang_desc: "Офис королевской торговой администрации, где иностранные торговцы должны регистрироваться, платить пошлины и вести переговоры через агентов министра Фракланга о доступе на сиамские рынки." #NT!
 nd_sia_pom: "Крепость Пом" #NT!
 nd_sia_pom_desc: "Сиамское пограничное укрепление из кирпича, земли и дерева, охраняющее переправы через реки и горные перевалы от вторжения." #NT!
 nd_sia_rong_si: "Ронг Си" #NT!
 nd_sia_rong_si_desc: "Королевская рисовая житница, где собирают, хранят и перераспределяют урожай королевства, обеспечивая продовольственную безопасность и позволяя проводить военную мобилизацию." #NT!
 nd_sia_wat_maintenance: "Содержание Вата" #NT!
 nd_sia_wat_maintenance_desc: "Уход за храмовыми зданиями, буддийскими статуями и церемониальными площадками с использованием местной древесины, керамики, пчелиного воска для священных ламп и благовоний для ритуальных подношений." #NT!
 nd_sia_khlong_maintenance: "Обслуживание Кхлонга" #NT!
 nd_sia_khlong_maintenance_desc: "Продолжающиеся дноуглубительные работы, ремонт и расширение сетей каналов для поддержания потока воды и судоходства требуют использования древесины для шлюзовых ворот, камня для насыпей и инструментов для рабочих." #NT!
 nd_sia_phraklang_maintenance: "Администрация Фракланга" #NT!
 nd_sia_phraklang_maintenance_desc: "Административные расходы на содержание королевских торговых домов, включая ведение записей на бумаге, окраску официальных документов, проверку пошлин на соль и прекрасную ткань в качестве церемониальных подарков иностранным купцам." #NT!
 nd_sia_pom_maintenance: "Пом Гаррисон" #NT!
 nd_sia_pom_maintenance_desc: "Содержание крепостных стен и снабжение гарнизона: камень для ремонта, вооружение и огнестрельное оружие для солдат, инструменты для постоянного содержания обороны." #NT!
 nd_sia_rong_si_maintenance: "Зернохранилище" #NT!
 nd_sia_rong_si_maintenance_desc: "Затраты на сбор, хранение и распределение риса из королевских зернохранилищ, требующие пиломатериалов для поддержания конструкции, инструментов для рабочих и глиняных кувшинов для хранения зерна." #NT!
 nd_sia_silk_weaving: "Тайское шелковое ткачество" #NT!
 nd_sia_silk_weaving_desc: "Традиционное производство сиамского шелка с использованием импортной шелковой нити и красителей, ткущее на ткацких станках со специальными инструментами, производя ткани, ценимые во всех дворах Азии." #NT!
 nd_sia_lacquerware: "Тайская лаковая посуда" #NT!
 nd_sia_lacquerware_desc: "Искусство нанесения слоев лака на деревянные предметы, придания им формы и обработки с помощью специальных инструментов, позволяющее создавать прочные и красивые декоративные изделия, ценимые во всех дворах Азии." #NT!
 levy_nd_sia_phrai_luang: "Прай Луанг Леви" #NT!
 levy_nd_sia_phrai_luang_desc: "Призывники-барщины, несущие обязательную службу короне по системе Пхрай." #NT!
 nd_sia_formed_tt: "Сиам был образован" #NT!
 nd_sia_path_a_tt: "Выберите «Наследие королей-воинов»" #NT!
 nd_sia_path_b_tt: "Выбрал Венецию Востока." #NT!
 nd_sia_destiny: "Судьба Сиама" #NT!
 nd_sia_destiny_desc: "Королевство основано и стабильно. Теперь сиамская корона должна определить путь, который определит ее наследие среди стран Азии." #NT!
 nd_sia_dest_khorat: "Покорение плато Корат" #NT!
 nd_sia_dest_khorat_desc: "Обширное плато Корат за горами Донг Пхая Йен является воротами в Индокитай. Захватите Пимаи и Чампасак, чтобы установить власть над землями Меконга и создать армию, достойную завоевания." #NT!
 nd_sia_dest_angkor: "Падение Кхмерской империи" #NT!
 nd_sia_dest_angkor_desc: "Древние храмы Ангкора представляют собой последнюю великую конкурирующую цивилизацию на материковой части Юго-Восточной Азии. Возьмите Ангкор и Баттамбанг, чтобы положить конец независимости кхмеров и поглотить их империю Сиамом." #NT!
 nd_sia_dest_pegu: "Завоевание Пегу" #NT!
 nd_sia_dest_pegu_desc: "Последнее испытание сиамского оружия: завоевать Пегу, Мартабан и побережье Тенассерима. Только сломив власть Бирмы в ее сердце, Сиам сможет претендовать на господство над всем Индокитаем." #NT!
 nd_sia_dest_banking: "Расцвет Торгового Королевства" #NT!
 nd_sia_dest_banking_desc: "Реки и порты Сиама являются торговыми артериями. Используйте новые финансовые институты, обеспечьте потоки шелка через рынки капитала и накопите богатство, необходимое для построения великого торгового государства." #NT!
 nd_sia_dest_thammarat: "Южный торговый путь" #NT!
 nd_sia_dest_thammarat_desc: "Накхонситхаммарат на протяжении веков был воротами между Сиамским заливом и Индийским океаном. Контролируйте этот жизненно важный южный порт, развивайте экономику королевства и расширяйте коммерческое влияние Сиама." #NT!
 nd_sia_dest_entrepot: "Перевалочный пункт Востока" #NT!
 nd_sia_dest_entrepot_desc: "Захватить Малакку, краеугольный камень азиатской морской торговли. Благодаря драгоценным камням, текущим через сиамские рынки, и сокровищнице, переполненной золотом, Сиам становится торговой столицей восточного мира." #NT!
 nd_sia.4.t: "Судьба королевства" #NT!
 nd_sia.4.d: "Сиамское королевство стоит на прочном фундаменте. Наши храмы приносят гармонию, наши поля — изобилие, а наши границы прочны. Теперь вопрос переходит от выживания к величию.\n\nКакое королевство нам построить? Путь вперед мы сами выбираем, и последствия будут отражаться в веках." #NT!
 nd_sia.4.a: "Наша судьба ждет." #NT!
 nd_sia.5.t: "Плато Корат взято под контроль" #NT!
 nd_sia.5.d: "Сиамская армия пересекла горы Донг Пхая Йен и водрузила королевский штандарт над плато Корат. Пхимай с руинами древнего кхмерского храма и город Чампасак на реке Меконг теперь подчиняются сиамской короне.\n\nДорога к империи открыта. На востоке — разрушающиеся остатки кхмерского государства. На севере вдоль Меконга обитают капризные лаосские муанги. Короли-воины Сиама доказали, что старые военные традиции живы." #NT!
 nd_sia.5.a: "Пусть завоевание продолжается." #NT!
 nd_sia.6.t: "Торговая Корона" #NT!
 nd_sia.6.d: "Казна королевства переполнена. Сиамский шелк имеет высокие цены на азиатских рынках, а внедрение современной банковской системы превратило королевскую казну в коммерческий двигатель.\n\nИностранные торговцы, которые когда-то проходили через него по пути в Китай, теперь задерживаются в сиамских портах, привлеченные выгодными условиями и выгодными возможностями. Венеция Востока – это не просто название. Это становится реальностью." #NT!
 nd_sia.6.a: "Пусть коммерция будет нашей силой." #NT!
 nd_sia.7.t: "Храмы Ангкора" #NT!
 nd_sia.7.d: "Сиамские солдаты стоят среди башен Ангкор-Вата, величайшего храмового комплекса, когда-либо построенного руками человека. Кхмерская империя, которая когда-то управляла всей материковой частью Юго-Восточной Азии, пала в руки сиамцев.\n\nРисовые поля Баттамбанга и древний престиж Ангкора теперь принадлежат нам. Но управление этими завоеванными народами требует выбора. Должны ли мы впитать их в состав сиамской нации, обучая их нашему языку и обычаям? Или мы будем править как повелители, собирая дань, оставляя при этом местных правителей?" #NT!
 nd_sia.7.a: "Они станут сиамцами по языку и обычаям." #NT!
 nd_sia.7.b: "Пусть местные лорды правят от нашего имени." #NT!
 nd_sia.8.t: "Ворота в Индийский океан" #NT!
 nd_sia.8.d: "Накхонситхаммарат, древний портовый город, расположенный на сухопутном мосту между Сиамским заливом и Андаманским морем, принадлежит нам. Отсюда сиамские купцы могут использовать богатства торговых путей Южно-Китайского моря и Индийского океана.\n\nЭкономика королевства процветает, и теперь вопрос в том, как направить это богатство. Должна ли корона построить большие склады и инфраструктуру для прямой торговли? Или мы должны свободно открыть наши порты, приглашая сюда торговцев со всего мира и обогащая себя за счет огромных объемов торговли?" #NT!
 nd_sia.8.a: "Постройте королевские склады, чтобы контролировать потоки." #NT!
 nd_sia.8.b: "Откройте порты и позвольте торговле течь свободно." #NT!
 nd_sia.9.t: "Падение Пегу" #NT!
 nd_sia.9.d: "Древняя бирманская столица Пегу пала. Мартабан, крупный торговый порт Мон, развевается под сиамским флагом. Побережье Тенассерим, ворота в Индийский океан, под защитой. Впервые в истории единое королевство Тай контролирует всю территорию материковой Юго-Восточной Азии от Меконга до Иравади.\n\nЭто кульминация многовековой войны между Сиамом и Бирмой. Мечта королей-воинов сбылась. Но как управлять этой огромной империей? Через военные гарнизоны и прямой контроль? Или через сеть речных провинций, связанных торговлей и общим управлением?" #NT!
 nd_sia.9.a: "Управляйте силой наших гарнизонов." #NT!
 nd_sia.9.b: "Свяжите империю через ее великие реки." #NT!
 nd_sia.10.t: "Малаккский пролив" #NT!
 nd_sia.10.d: "Малакка, великий перевалочный пункт, через который должна проходить половина мировой торговли, подчиняется сиамской короне. Драгоценные камни и специи, шелк и фарфор текут по рынкам, которые теперь развеваются под нашим флагом. Сокровищница настолько огромна, что невозможно себе представить.\n\nСиам достиг того, о чем купцы Аюттхая могли только мечтать: не просто процветающего торгового королевства, но и контроля над морским узлом, соединяющим Восток и Запад. Вопрос теперь в том, как распорядиться этой властью. Сможем ли мы доминировать в проливе посредством превосходства на море, контролируя, кто может пройти? Или нам следует использовать наше положение для распространения дипломатического влияния и коммерческого влияния по всему известному миру?" #NT!
 nd_sia.10.a: "Командуйте проливом с помощью наших военных кораблей." #NT!
 nd_sia.10.b: "Пусть наша торговля достигнет каждого берега." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_khmer_assimilation: "Кхмерская ассимиляция" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_khmer_assimilation: "Покоренное кхмерское население поглощается сиамским государством, изучая тайский язык и обычаи под руководством губернаторов, назначенных короной." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_khmer_tributaries: "Кхмерская приточная система" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_khmer_tributaries: "Местные кхмерские лорды управляют своими провинциями как сиамские данники, поддерживая порядок, пока их земли восстанавливаются после завоевания." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_royal_warehouses: "Королевские склады" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_royal_warehouses: "Контролируемые Короной склады и строительные проекты направляют торговлю и развитие через королевские учреждения, создавая коммерческую инфраструктуру королевства." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_free_trade_ports: "Порты свободной торговли" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_free_trade_ports: "Открытые порты привлекают иностранных торговцев и моряков, увеличивая морские возможности королевства, хотя они делают наступательные войны более дорогостоящими для оправдания." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_siamese_hegemony: "Сиамская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_siamese_hegemony: "Военные гарнизоны по всей империи демонстрируют сиамскую мощь, а арсеналы быстро производят оружие, хотя военно-морскому флоту пренебрегают в пользу сухопутных войск." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_five_rivers: "Империя пяти рек" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_five_rivers: "Великие реки (Чао Прайя, Меконг, Салуин, Иравади и их притоки) связывают империю воедино, обеспечивая быстрое подкрепление и сокращение истощения на огромных расстояниях." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_strait_masters: "Хозяева пролива" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_strait_masters: "Сиамские военные корабли патрулируют Малаккский пролив, проецируя военно-морскую мощь на торговые пути. Развитая разведывательная сеть защищает от конкурентов, стремящихся подорвать господство Сиама." #NT!
 STATIC_MODIFIER_NAME_nd_sia_dest_siam_enthroned: "Сиам на троне" #NT!
 STATIC_MODIFIER_DESC_nd_sia_dest_siam_enthroned: "Дипломатический престиж и торговые сети Сиама простираются по всему известному миру, от островов специй до дворов далеких королевств. Сиамских купцов и посланников приветствуют повсюду." #NT!
 nd_sia_khlang_supha: "Кланг Суфа" #NT!
 nd_sia_khlang_supha_desc: "Королевский арсенал и завод по производству боеприпасов, где производится и хранится оружие, огнестрельное оружие и военная техника для сиамской императорской армии." #NT!
 nd_sia_khlang_supha_maintenance: "Арсенал Операции" #NT!
 nd_sia_khlang_supha_maintenance_desc: "Непрерывное производство и обслуживание оружия и военной техники, расходующее железо для вооружения, порох для огнестрельного оружия, камень для фортификации и инструменты для мастеров." #NT!
 nd_sia_talat_yai: "Талат Яй" #NT!
 nd_sia_talat_yai_desc: "Большой базар и коммерческая биржа, где купцы со всей Азии собираются, чтобы торговать предметами роскоши, заключать контракты и рассчитываться под бдительным оком Фракланга." #NT!
 nd_sia_talat_yai_maintenance: "Базарные операции" #NT!
 nd_sia_talat_yai_maintenance_desc: "Административные расходы на эксплуатацию большого базара, включая прекрасную ткань для торговых витрин, бумагу для торговых контрактов, проверку пошлин на соль и импортный перец в качестве образцов товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
 sia_chatusadom_bureaucracy: "Чатусадом" #NT!
 sia_chatusadom_bureaucracy_desc: "Палатинский закон короля Трайлоканата 1454 года реорганизовал Аюттхая вокруг четырех центральных министерств: Вианг (город), Ван (дворец), Кхланг (казначейство и торговля) и На (сельское хозяйство и ирригация). Чатусадом заменил старых правителей муангов департаментами, подчинявшимися непосредственно трону, став структурным стержнем каждого тайского правительства, от Трайлока до Реформации Чакри 1892 года." #NT!
 sia_phra_khlang_sinkha_bureaucracy: "Пхра Кланг Синкха" #NT!
 sia_phra_khlang_sinkha_bureaucracy_desc: "Департамент королевских складов управлял внешней торговлей Аюттхая как государственная монополия. Китайские джонки пришвартовывались к причалам Кланга, королевские агенты устанавливали цены на олово, саппан и перец, а европейские чартерные компании вели переговоры через офис Пхра Кланга, а не с частными торговцами. Возвышение Константина Фаулкона на пост главы ведомства при короле Нарае (годы правления 1656–1688) на короткое время сделало его самой влиятельной должностью в королевстве." #NT!
 sia_sakdina_bureaucracy: "Регистр Сакдиной" #NT!
 sia_sakdina_bureaucracy_desc: "Кодифицированная Трайлоканатом в 1454 году, Сакдина, или система власти рисовых полей, присваивала каждому подданному числовой ранг, измеряемый в раях рисовой земли, от 5 сакдин раба до 100 000 Маха Упарата. В реестрах Крома фиксировались звания и барщинные обязанности каждого человека; число определяет старшинство суда, цвет мантии, размер дома и наказания, налагаемые в соответствии с Законом о трех печатях. Рама V окончательно отменил эту систему в 1932 году." #NT!
 sia_phrai_suay_bureaucracy: "Трибьют-роллы Phrai Suay" #NT!
 sia_phrai_suay_bureaucracy_desc: "Горные народы и приграничные меньшинства платили суай (натуральную дань в виде лесных продуктов, таких как саппан, слоновая кость, орлиное дерево, кардамон, олово и золотой песок) вместо барщины. Свитки Крома выделили каждому горному сообществу квоту и тайского офицера-покровителя для ее добычи. Система значительно обогатила трон и его дворян, но номинально оставила нетайские народы подданными, не интегрируя их, порождая хронические восстания в Лан На, на плато Корат и на юге Малайзии." #NT!
 sia_maha_sangharaja_bureaucracy: "Иерархия Маха Сангхараджи" #NT!
 sia_maha_sangharaja_bureaucracy_desc: "Маха Сангхараджа (Верховный Патриарх) возглавляет Тайскую Сангху и назначается королем. Под его руководством монастыри, зарегистрированные царем, сдавали своим монахам девять экзаменов Пали Париятти по Типитаке, тех же экзаменов, которые подготовили грамотных гражданско-религиозный класс, укомплектовывающий низшую бюрократию. Очистительный совет Рамы I 1788 года изменил определение ортодоксальной практики во всем королевстве на следующие два столетия." #NT!
 sia_three_seal_law_bureaucracy: "Закон о трёх печатях" #NT!
 sia_three_seal_law_bureaucracy_desc: "Котмай Тра Сам Дуанг, известный как Закон Трех Печатей, является бюрократической основой тайского правосудия. Созданный при Трайлоканате как Пхра Айякан, опустошенный, когда бирманцы разграбили Аюттайю в 1767 году, и восстановленный в 1805 году Рамой I из сохранившихся фрагментов, отпечатанных печатями Кхланга, Махаттая и Калахома, он определяет уголовный процесс, право собственности и ранговые наказания при Сакдине, резко ограничивая дворянскую юрисдикцию над простолюдинами." #NT!
  
  # ===== BUREAUCRACY AUTHORITY (slot grant on formation) ===== 
 AUTO_MODIFIER_NAME_nd_sia_bureaucracy_authority: "Бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_sia_bureaucracy_authority: "После объединения Сиама трон получает административные полномочия для размещения исторических институтов Аюттхая и Раттанакосин: два бюрократических места в дополнение к слоту, который предоставляет каждая столица." #NT!
