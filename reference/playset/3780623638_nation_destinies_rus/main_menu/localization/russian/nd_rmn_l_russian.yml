l_russian:
 STATIC_MODIFIER_NAME_nd_rmn_antemurale_christianitatis: "Антемурале христианитатис" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_antemurale_christianitatis: "Румыния выступает оплотом христианского мира против османского прилива, страной-крепостью, чьи горы и реки образуют естественный щит для всей Европы." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_danubian_prosperity: "Дунайское процветание" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_danubian_prosperity: "Расположенная на перекрестке трех империй, Румыния использует богатства Дуная (его зерно, скот и соль) для построения процветающего и культурного королевства." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_painted_monasteries_legacy: "Наследие расписных монастырей" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_painted_monasteries_legacy: "Расписные монастыри Молдавии являются памятниками православной преданности и художественного гения, вызывая культурную гордость среди объединенных княжеств." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_press_the_advantage: "Нажмите на преимущество" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_press_the_advantage: "В духе Михаила Храброго румынские армии продвигаются вперед, чтобы заявить права на то, что принадлежит румынскому народу по праву крови и меча." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_consolidate_the_realm: "Объединение королевства" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_consolidate_the_realm: "Вместо того, чтобы чрезмерно расширять свои границы, как это когда-то сделал Михаил, Румыния закрепляет свою власть над тремя княжествами, связывая их законом и общими целями." #NT!
 nd_rmn.1.t: "Румынское королевство" #NT!
 nd_rmn.1.d: "Три земли румын (Валахия, Молдавия и Трансильвания) наконец объединены под единой короной. На протяжении веков румынский народ оставался подданным, разделенным между вассальной зависимостью от Османской империи, господством Габсбургов и шаткой независимостью. Теперь, из Бухареста, новое королевство смотрит на свои Карпаты и плодородную Дунайскую равнину с вопросом, который определяет каждого румынского правителя со времен Басараба: будем ли мы щитом, который держит линию, или перекрестком, на котором богатеют все, кто проходит?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rmn.1.a: "Мы — оплот: последняя крепость христианского мира." #NT!
 nd_rmn.1.b: "Мы — перекресток: самое богатое царство Дуная." #NT!
 nd_rmn.2.t: "Раскрашенные монастыри" #NT!
 nd_rmn.2.d: "На холмах Молдавии монастыри, построенные Стефаном Великим и его преемниками, превратились в нечто беспрецедентное. Их внешние стены сияют фресками, изображающими святых, библейские сцены и осаду Константинополя, целые богословские библиотеки расписаны для чтения неграмотным прихожанам. В Воронце особый оттенок синего, использованный художниками, стал известен во всем православном мире, цвет, который невозможно воспроизвести. В Humor, Moldovita и Sucevita продолжается та же традиция. Это не просто церкви, а декларации веры, выполненные из красок и гипса, построенные так, чтобы выдерживать как непогоду, так и завоевания. Папа Сикст IV однажды назвал Стефана «Атлетой Христа», и эти монастыри являются его вечным завещанием." #NT!
 nd_rmn.2.a: "Наследие в красках и камне." #NT!
 nd_rmn.3.t: "Первое объединение" #NT!
 nd_rmn.3.d: "В 1600 году Михаил Храбрый совершил то, чего до него не удавалось ни одному румынскому правителю. Он объединил Валахию, Трансильванию и Молдавию под единой короной. Разгромив османов в Калугарени силами всего лишь 16 000 человек против сил Синан-паши, он повернул на север. При Селимбаре он победил трансильванского принца Андреаса Батори. К маю 1600 года его армии захватили и Молдавию. На один краткий, яркий момент три румынские земли стали одной. Но Габсбурги и поляки не потерпели такого единства. В течение года Михаил был предан и убит в Кампиа-Турзи. Союз распался так же быстро, как и был создан. Теперь, спустя столетия, мечта снова оживает. Вопрос в том, что с этим делать." #NT!
 nd_rmn.3.a: "Двигайтесь вперед: закончите то, что начал Майкл." #NT!
 nd_rmn.3.b: "Консолидация: сделайте этот союз долговечным." #NT!
 nd_rmn.4.t: "Война за независимость" #NT!
 nd_rmn.4.d: "В Плевне, Гривице и Рахове румынские солдаты доказали, что эта страна может стоять среди держав Европы. Доробанти, крестьянские солдаты, собранные из каждой деревни королевства, удерживали оборону против османских регулярных войск и кровью и мужеством заслужили независимость Румынии. Великие державы, которые когда-то относились к Дунайским княжествам как к пешкам, теперь должны считаться с суверенным королевством. 9 мая 1877 года румынский парламент провозгласил полную независимость, и армия переправилась через Дунай, чтобы воплотить это заявление в жизнь. Королевство Румыния признано Берлинским договором и больше не вассал, не пешка, а самостоятельная нация." #NT!
 nd_rmn.4.a: "Румыния свободна." #NT!
 nd_rmn_voivodal_tradition: "Воеводская традиция" #NT!
 nd_rmn_voivodal_tradition_desc: "Система воеводы, военного вождя и князя закрепляет румынское управление как на военной власти, так и на землевладельческих обычаях." #NT!
 nd_rmn_battle_of_posada: "Наследие Посады" #NT!
 nd_rmn_battle_of_posada_desc: "В битве при Посаде в 1330 году Басараб I устроил засаду и уничтожил значительно превосходящую венгерскую армию на горном перевале, установив независимость Валахии благодаря кавалерийскому мастерству и знанию местности." #NT!
 nd_rmn_salt_wealth: "Карпатское соляное богатство" #NT!
 nd_rmn_salt_wealth_desc: "Обширные соляные месторождения Карпат разрабатывались с древних времен, обеспечивая румынским княжествам надежный источник богатства и важнейший торговый товар." #NT!
 nd_rmn_mountain_fortresses: "Горные крепости" #NT!
 nd_rmn_mountain_fortresses_desc: "От Поенари до Брана крепости, охраняющие Карпатские перевалы, составляют основу обороны Румынии от захватчиков со всех направлений." #NT!
 nd_rmn_orthodox_foundation: "Православный фонд" #NT!
 nd_rmn_orthodox_foundation_desc: "Учреждение православных митрополичьих кафедр в Валахии и Молдавии дало княжествам духовную независимость, соответствующую их политической автономии." #NT!
 nd_rmn_boyar_estates: "Боярские усадьбы" #NT!
 nd_rmn_boyar_estates_desc: "Класс бояр-землевладельцев составлял основу румынского управления, отправляя правосудие и собирая доходы по княжествам." #NT!
 nd_rmn_fortified_churches: "Укрепленные церкви" #NT!
 nd_rmn_fortified_churches_desc: "Более 150 укреплённых церквей в Трансильвании служили одновременно местами отправления культа и общественными убежищами от татарских, османских и других налётчиков." #NT!
 nd_rmn_danubian_trade: "Дунайская торговля" #NT!
 nd_rmn_danubian_trade_desc: "Дунай и его притоки доставляли румынское зерно, соль, скот и шкуры на рынки Центральной Европы и Черного моря." #NT!
 nd_rmn_order_of_the_dragon: "Орден Дракона" #NT!
 nd_rmn_order_of_the_dragon_desc: "Влад Цепеш использовал террор как государственное оружие, пронзая землю, выжженную землю, а ночная атака на Тырговиште продемонстрировала, что превосходящий по численности защитник может сломить волю более крупного захватчика." #NT!
 nd_rmn_athleta_christi: "Атлета Кристи" #NT!
 nd_rmn_athleta_christi_desc: "Стефан Великий из Молдавии выиграл 46 из своих 48 сражений, получив титул «Защитника Христа» от Папы Сикста IV за защиту христианского мира в битве при Васлуе." #NT!
 nd_rmn_painted_monasteries: "Расписные монастыри" #NT!
 nd_rmn_painted_monasteries_desc: "После каждой победы Стефан Великий основывал монастырь. Его преемники покрыли стены потрясающими фресками, создав «Расписные монастыри Буковины»." #NT!
 nd_rmn_princely_authority: "Княжеская власть" #NT!
 nd_rmn_princely_authority_desc: "Укрепление воеводской власти над боярским советом усилило центральное управление румынскими княжествами." #NT!
 nd_rmn_pastoral_wealth: "Пастырское богатство" #NT!
 nd_rmn_pastoral_wealth_desc: "Румынская шерсть, шкуры и домашний скот в огромных количествах экспортировались в Трансильванию, Польшу и Османскую империю, составляя экономическую основу княжеств." #NT!
 nd_rmn_lefegii_tradition: "Лефеги Традиция" #NT!
 nd_rmn_lefegii_tradition_desc: "Профессиональная наемная пехота, лефегии, дополняла феодальные наборы княжеств, предоставляя опытные пограничные войска, владеющие навыками ведения войны в горах." #NT!
 nd_rmn_calarasi_tradition: "Кэлэрашь Традиция" #NT!
 nd_rmn_calarasi_tradition_desc: "Калараси представляли собой валашскую пограничную кавалерию, конных разведчиков и патрульных всадников, которые охраняли границы и доставляли депеши через обширную Дунайскую равнину." #NT!
 nd_rmn_scorched_earth: "Доктрина выжженной земли" #NT!
 nd_rmn_scorched_earth_desc: "Румынские защитники систематически отказывали захватчикам в ресурсах, отравляли колодцы, перенаправляли реки и отступали в горы, чтобы измотать превосходящие силы путем истощения." #NT!
 nd_rmn_curtea_de_arges: "Куртя-де-Арджеш" #NT!
 nd_rmn_curtea_de_arges_desc: "Монастырь Куртя-де-Арджеш, построенный Неагое Басарабом в 1517 году, представляет собой вершину румынской церковной архитектуры и научного покровительства." #NT!
 nd_rmn_grain_trade: "Дунайская торговля зерном" #NT!
 nd_rmn_grain_trade_desc: "Плодородная Дунайская равнина и Валашская низменность производили излишки пшеницы и шкуры скота, которые кормили и одевали рынки от Константинополя до Центральной Европы." #NT!
 nd_rmn_chancellery_reform: "Реформа канцелярии" #NT!
 nd_rmn_chancellery_reform_desc: "Модернизация княжеских канцелярий ввела систематический учет и административные процедуры по образцу византийской и польской практики." #NT!
 nd_rmn_first_unification: "Первое объединение" #NT!
 nd_rmn_first_unification_desc: "В 1600 году Михаил Храбрый ненадолго объединил Валахию, Трансильванию и Молдавию, впервые всеми тремя румынскими землями управлял один князь." #NT!
 nd_rmn_confessional_resilience: "Конфессиональная устойчивость" #NT!
 nd_rmn_confessional_resilience_desc: "В то время как Трансильвания стала полем битвы Реформации и Контрреформации, румынское православие продолжало оставаться объединяющей культурной силой во всех трех княжествах." #NT!
 nd_rmn_host_reform: "Реформа Хозяина" #NT!
 nd_rmn_host_reform_desc: "Превращение Оастеи из феодального набора в более профессиональную силу с наемными солдатами и стандартизированным снаряжением, заменяющими старые боярские дружины." #NT!
 nd_rmn_seimeni_guards: "Сейменская гвардия" #NT!
 nd_rmn_seimeni_guards_desc: "Сеймены были профессиональными охранниками, набранными молдавскими и валашскими князьями, постоянной пехотой, получавшей оплату деньгами и землей, и составляли надежное ядро, вокруг которого было организовано феодальное войско." #NT!
 nd_rmn_transylvanian_mines: "Трансильванские шахты" #NT!
 nd_rmn_transylvanian_mines_desc: "Серебряные и медные рудники Трансильвании, особенно в окрестностях Бая-Маре и Розии-Монтана, обеспечивали минеральные богатства, которые привлекали саксонских поселенцев и стимулировали региональную торговлю." #NT!
 nd_rmn_pravila: "Правила" #NT!
 nd_rmn_pravila_desc: "Кодификация обычного права в письменных правовых кодексах, Pravilele, привнесла последовательность в управление княжествами, заменив устную традицию письменным законом." #NT!
 nd_rmn_cultural_awakening: "Культурное пробуждение" #NT!
 nd_rmn_cultural_awakening_desc: "Появление литературы, хроник и религиозных текстов на румынском языке способствовало возникновению общей идентичности среди румын трех княжеств." #NT!
 nd_rmn_phanariote_reform: "Реформа фанариотов" #NT!
 nd_rmn_phanariote_reform_desc: "Хотя эпоха фанариотов привела из Константинополя грекоязычных губернаторов, она также привела к административным реформам, правовой кодификации и связям с идеями Просвещения." #NT!
 nd_rmn_rosiori_tradition: "Розиори Традиция" #NT!
 nd_rmn_rosiori_tradition_desc: "Росиори, «красные», были элитой легкой кавалерии Румынии, отличавшейся красной униформой и навыками разведки, набегов и преследования." #NT!
 nd_rmn_vanatori_tradition: "Ванатори де Мунте" #NT!
 nd_rmn_vanatori_tradition_desc: "Ванатори, румынские горные охотники, были специалистами легкой пехоты, обученными в Карпатском нагорье, экспертами в засадах, ведении войны в горах и самостоятельных операциях на пересеченной местности." #NT!
 nd_rmn_organic_statute: "Органический статут" #NT!
 nd_rmn_organic_statute_desc: "Органический регламент 1831–1832 гг. установил современную конституционную основу для Дунайских княжеств, реформировав налогообложение, юстицию и государственное управление." #NT!
 nd_rmn_breadbasket: "Хлебница Востока" #NT!
 nd_rmn_breadbasket_desc: "Обширное производство пшеницы в Румынии сделало ее житницей юго-восточной Европы, а экспорт зерна идет через Брэилу и Галац на рынки Средиземноморья." #NT!
 nd_rmn_border_modernization: "Модернизация границ" #NT!
 nd_rmn_border_modernization_desc: "В ходе модернизации пограничной обороны Румынии средневековые крепости были заменены современными укреплениями, приспособленными для артиллерийской войны." #NT!
 nd_rmn_war_of_independence: "Война за независимость" #NT!
 nd_rmn_war_of_independence_desc: "В Плевне, Гривице и Рахове в 1877–1878 годах румынские солдаты сражались бок о бок с русскими войсками, чтобы добиться полной независимости от османского сюзеренитета." #NT!
 nd_rmn_national_awakening: "Национальное пробуждение" #NT!
 nd_rmn_national_awakening_desc: "Трансильванская школа и последующие интеллектуальные движения стандартизировали румынский язык, возродили письменность на латинице и сформировали современное национальное сознание." #NT!
 nd_rmn_cuza_reforms: "Реформы Кузы" #NT!
 nd_rmn_cuza_reforms_desc: "Радикальные реформы Александру Иоана Кузы (перераспределение земли, секуляризация монастырей, всеобщее образование) превратили Румынию из феодального общества в современное государство." #NT!
 nd_rmn_oil_industry: "Нефтяная промышленность" #NT!
 nd_rmn_oil_industry_desc: "Румыния была одним из первых в мире производителей нефти: нефтеперерабатывающие заводы в Плоешти работали с 1850-х годов. К 1900 году Румыния была крупнейшим экспортером нефти в Европе." #NT!
 nd_rmn_paris_of_east: "Париж Востока" #NT!
 nd_rmn_paris_of_east_desc: "Превращение Бухареста в космополитическую столицу (с бульварами во французском стиле, неоклассической архитектурой и процветающими интеллектуальными салонами) принесло ему прозвище «Micul Paris»." #NT!
 nd_rmn_modern_army: "Современная румынская армия" #NT!
 nd_rmn_modern_army_desc: "Реорганизация румынской армии по прусскому образцу с современным оборудованием, офицерскими академиями и воинской повинностью создала боеспособные национальные силы." #NT!
 a_nd_rmn_viteji: "Витеджи" #NT!
 a_nd_rmn_viteji_desc: "Элитная придворная кавалерия румынских княжеств. Витежи были мелкой знатью с постоянными военными обязанностями, быстрыми и опытными всадниками, которые преуспели в набегах и засадах на Карпатских перевалах." #NT!
 a_nd_rmn_viteji_levy: "Витеджи" #NT!
 a_nd_rmn_viteji_levy_desc: "Дворянская конница набиралась из боярских вотчин княжеств." #NT!
 a_nd_rmn_lefegii: "Лефегии" #NT!
 a_nd_rmn_lefegii_desc: "Профессиональная наемная пехота румынских княжеств. Опытные пограничники, владеющие навыками ведения войны в горах, обороны укреплений и ведения боевых действий на труднопроходимой местности." #NT!
 a_nd_rmn_calarasi: "Кэлэрашь" #NT!
 a_nd_rmn_calarasi_desc: "Валашская пограничная кавалерия, конные разведчики и патрульные всадники, охранявшие границы княжеств, разносившие депеши и совершавшие набеги на линии снабжения противника." #NT!
 a_nd_rmn_seimeni: "Сеймени" #NT!
 a_nd_rmn_seimeni_desc: "Профессиональная постоянная пехота румынских княжеств. Оплачиваемые деньгами и земельными грантами, сеймены сформировали дисциплинированное ядро ​​гвардии, лояльное воеводе, а не боярскому совету." #NT!
 a_nd_rmn_rosiori: "Розиори" #NT!
 a_nd_rmn_rosiori_desc: "Элитная румынская легкая кавалерия, Росиори, «Красные», выполняла разведывательные, рейдерские и преследующие функции. Отличаются красной униформой и превосходным искусством верховой езды." #NT!
 a_nd_rmn_vanatori: "Ванатори де Мунте" #NT!
 a_nd_rmn_vanatori_desc: "Румынские горные охотники, специалисты легкой пехоты, обученные ведению войны в горах, эксперты по засадам и самостоятельным операциям в Карпатском нагорье." #NT!
 a_nd_rmn_dorobanti: "Доробанти" #NT!
 a_nd_rmn_dorobanti_desc: "Костяк современной румынской армии. Доробанти представляли собой территориальную пехоту, набранную из крестьянских общин по всему королевству, доказавшую свою ценность в Плевне и Гривице во время Войны за независимость." #NT!
 a_nd_rmn_dorobanti_levy: "Доробанти" #NT!
 a_nd_rmn_dorobanti_levy_desc: "Территориальная пехота, набранная из румынских крестьянских общин." #NT!
 a_nd_rmn_panduri: "Пандури" #NT!
 a_nd_rmn_panduri_desc: "Балканские нерегулярные партизаны из гор Олтении. Пандури специализировались на засадах, набегах и тактике выжженной земли против османских захватчиков." #NT!
 nd_rmn_curtea_domneasca: "Куртя Домняска" #NT!
 nd_rmn_curtea_domneasca_desc: "Княжеский двор, резиденция воеводской власти, где собираются бояре, чтобы давать советы князю, отправлять правосудие и координировать управление королевством." #NT!
 nd_rmn_fortificatie: "Горная крепость" #NT!
 nd_rmn_fortificatie_desc: "Карпатская горная крепость, охраняющая проходы между княжествами и составляющая основу обороны Румынии от османских, венгерских и татарских захватчиков." #NT!
 nd_rmn_biserica_fortificata: "Укрепленная церковь" #NT!
 nd_rmn_biserica_fortificata_desc: "Уникальное трансильванское учреждение: церкви, построенные с оборонительными стенами, башнями и зернохранилищами для укрытия целых общин во время набегов." #NT!
 nd_rmn_ocna_de_sare: "Соляной завод" #NT!
 nd_rmn_ocna_de_sare_desc: "Румынские соляные шахты в Прайде, Турде и Сланике разрабатывались с древности. Соль была настолько ценной, что на протяжении веков служила валютой и финансировала княжескую казну." #NT!
 nd_rmn_han_comercial: "Хан Коммерческий" #NT!
 nd_rmn_han_comercial_desc: "Дунайский торговый постоялый двор, где отдыхают и обмениваются товарами купцы, погонщики и речные торговцы, коммерческие узлы румынских торговых сетей." #NT!
 nd_rmn_vie_domneasca: "Ви Домняска" #NT!
 nd_rmn_vie_domneasca_desc: "Княжеский виноградник и винодельня. Румынское виноградарство восходит к дакийским временам: в регионах Деалу-Маре и Котнари производятся вина, которые ценятся во всей Юго-Восточной Европе." #NT!
 nd_rmn_scoala: "Румынская школа" #NT!
 nd_rmn_scoala_desc: "Учреждение румынского образования, созданное во время национального пробуждения для обучения на родном языке и формирования грамотных, национально сознательных граждан." #NT!
 nd_rmn_stana: "Стана" #NT!
 nd_rmn_stana_desc: "Горная овчарня и пастушеская станция. Румынские пастухи с незапамятных времен перегоняли свои стада через Карпатские перевалы, добывая шерсть, сыр и шкуры для торговли." #NT!
 nd_rmn_tabara_militara: "Военный лагерь" #NT!
 nd_rmn_tabara_militara_desc: "Профессиональный гарнизон и тренировочный центр для реформированной румынской армии, пришедший на смену специальным феодальным сборам средневекового Воинства." #NT!
 nd_rmn_rafinarie: "нефтеперерабатывающий завод" #NT!
 nd_rmn_rafinarie_desc: "Первый нефтеперерабатывающий завод, перерабатывающий богатую сырую нефть Румынии. Нефтеперерабатывающие заводы в Плоешти были одними из первых в мире, что сделало Румынию пионером нефтяного века." #NT!
 nd_rmn_tabacarie: "Кожевенный завод" #NT!
 nd_rmn_tabacarie_desc: "Дубильный цех, перерабатывающий шкуры огромного румынского скота в изделия из кожи для внутреннего использования и экспорта в Дунай." #NT!
 nd_rmn_court_maintenance: "Обслуживание суда" #NT!
 nd_rmn_court_maintenance_desc: "Содержание княжеского двора, сукно и тонкая ткань для ливрей, пчелиный воск для освещения и бумага для корреспонденции канцелярии." #NT!
 nd_rmn_fortress_upkeep: "Крепостной гарнизон" #NT!
 nd_rmn_fortress_upkeep_desc: "Содержание гарнизона и оборонительных сооружений, камень для ремонта, оружие для солдат, инструменты для содержания и древесина для частоколов и построек." #NT!
 nd_rmn_church_upkeep: "Содержание церкви" #NT!
 nd_rmn_church_upkeep_desc: "Обслуживание укрепленной церкви, свечи из пчелиного воска для богослужений, камень для ремонта, ткань для облачений и древесина для общественного зернохранилища." #NT!
 nd_rmn_salt_extraction: "Добыча соли" #NT!
 nd_rmn_salt_extraction_desc: "Добыча и переработка каменной соли из месторождений Карпат." #NT!
 nd_rmn_han_operations: "Хан Операции" #NT!
 nd_rmn_han_operations_desc: "Обеспечение торгового постоялого двора, пшеница и домашний скот для кухни, соль для консервации и бумага для торговых записей и торговой корреспонденции." #NT!
 nd_rmn_wine_production: "Производство вина" #NT!
 nd_rmn_wine_production_desc: "Выращивание и прессование винограда на княжеских виноградниках." #NT!
 nd_rmn_school_operations: "Школьные операции" #NT!
 nd_rmn_school_operations_desc: "Школьные принадлежности, бумага и книги для обучения, свечи из пчелиного воска для вечерних занятий, а также ткань для парт и мебели для классов." #NT!
 nd_rmn_pastoral_operations: "Пастырская деятельность" #NT!
 nd_rmn_pastoral_operations_desc: "Горное пастушество и переработка шерсти." #NT!
 nd_rmn_camp_maintenance: "Обслуживание лагеря" #NT!
 nd_rmn_camp_maintenance_desc: "Обеспечение военного лагеря оружием и кожей для солдатского вооружения и снаряжения, пшеницей для пайков и тканью для обмундирования и палаток." #NT!
 nd_rmn_oil_refining: "Нефтепереработка" #NT!
 nd_rmn_oil_refining_desc: "Переработка сырой нефти в продукты нефтепереработки." #NT!
 nd_rmn_tanning: "Дубление кожи" #NT!
 nd_rmn_tanning_desc: "Переработка шкур в изделия из кожи для торговли." #NT!
 levy_nd_rmn_viteji: "Витеджи Кавалерия" #NT!
 levy_nd_rmn_viteji_desc: "Дворянская конница набиралась из боярских имений." #NT!
 levy_nd_rmn_panduri: "Пандури Нерегулярные войска" #NT!
 levy_nd_rmn_panduri_desc: "Горные партизаны, набранные из ольтенских крестьян." #NT!
 levy_nd_rmn_dorobanti: "Доробанти Пехота" #NT!
 levy_nd_rmn_dorobanti_desc: "Территориальная пехота, набираемая из крестьянских общин." #NT!
 nd_rmn_formed_tt: "была образована Румыния." #NT!
 nd_rmn_path_a_tt: "Выбрал Antemurale Christianitatis" #NT!
 nd_rmn_path_b_tt: "Выбрали процветание Дуная" #NT!
 nd_rmn_destiny: "Судьба Румынии" #NT!
 nd_rmn_destiny_desc: "Наконец объединившись, Румынское королевство теперь должно выбрать свой путь. Будет ли это щит, охраняющий христианский мир, или перекресток, на котором богатеют все, кто проходит?" #NT!
 nd_rmn_dest_fortress: "Крепость Дуная" #NT!
 nd_rmn_dest_fortress_desc: "Дунайские крепости Видин и Никополь должны быть вырваны из рук Османской империи, чтобы обезопасить южную границу Румынии и утвердить ее претензии как защитника христианского мира." #NT!
 nd_rmn_dest_crescent: "Сокрушение полумесяца" #NT!
 nd_rmn_dest_crescent_desc: "Когда линия Дуная будет обеспечена, кампания должна будет продвинуться глубже на территорию Османской империи. Возьмите Эдирне, бывшую столицу Османской империи в Европе, и докажите, что ситуация изменилась." #NT!
 nd_rmn_dest_restorer: "Восстановитель христианского мира" #NT!
 nd_rmn_dest_restorer_desc: "Главный приз: сам Константинополь. Возьмите город, павший в 1453 году, и верните его в руки христиан. Судьба Румынии как Antemurale Christianitatis будет исполнена." #NT!
 nd_rmn_dest_gateway: "Черноморские ворота" #NT!
 nd_rmn_dest_gateway_desc: "Порт Констанца и побережье Добруджи являются ключом к коммерческому будущему Румынии. Контролируйте черноморские ворота, и зерновые богатства Дунайской равнины потекут на все рынки Средиземноморья." #NT!
 nd_rmn_dest_breadbasket: "Хлебница трёх империй" #NT!
 nd_rmn_dest_breadbasket_desc: "Румыния должна расширить свою дунайскую торговую сеть, захватив Русе, важный пункт пересечения нижнего Дуная, и превратив сельскохозяйственный центр в житницу Юго-Восточной Европы." #NT!
 nd_rmn_dest_paris: "Париж Балкан" #NT!
 nd_rmn_dest_paris_desc: "Поскольку Варна и побережье Черного моря находятся под контролем Румынии, Бухарест может превратиться в космополитическую столицу, способную конкурировать с любой европейской столицей, Микулским Парижем Востока." #NT!
 nd_rmn.5.t: "Судьба Румынии" #NT!
 nd_rmn.5.d: "Три земли объединены, корона закреплена, и в королевстве на данный момент царит мир. Но Румыния находится на перекрестке империй, и до следующей бури мир никогда не бывает дальше, чем через поколение. Карпаты нас приютят, Дунай нас кормит, православная вера нас поддерживает. Теперь вопрос не в том, выживет ли Румыния, а в том, какой она станет. Нам предстоит выковать судьбу румынского народа." #NT!
 nd_rmn.5.a: "Румыния выстоит." #NT!
 nd_rmn.6.t: "Крепость Дуная" #NT!
 nd_rmn.6.d: "Крепости Видин и Никополь, которые когда-то были плацдармом османских кампаний в сердце Европы, теперь несут румынский штандарт. Эти древние крепости на южном берегу Дуная были воротами, через которые вторжения за вторжениями проникали на Балканы. Больше никогда. Румынские гарнизоны теперь занимают стены, которые не смогли удержать поколения христианских королевств. Дунайская линия наша, а вместе с ней и первое доказательство того, что Румыния может быть чем-то большим, чем просто буферным государством. Это может быть оплотом." #NT!
 nd_rmn.6.a: "Дунай — наш щит." #NT!
 nd_rmn.7.t: "Сокрушение полумесяца" #NT!
 nd_rmn.7.d: "Эдирне пала. Город, который служил османской столицей до Константинополя, где Мурад I построил свой первый европейский дворец и откуда султаны начали завоевания Балкан, теперь находится в руках Румынии. Символизм безошибочен: волна османского могущества в Европе была сломлена не коалицией великих держав, а страной, которая пострадала от нее больше всего. Наши армии стоят глубоко во Фракии, и перед нами стоит вопрос, как использовать это преимущество." #NT!
 nd_rmn.7.a: "Штурмуйте каждую стену: не давайте им покоя." #NT!
 nd_rmn.7.b: "Держитесь на своем: позвольте времени сделать свое дело." #NT!
 nd_rmn.8.t: "Восстановитель христианского мира" #NT!
 nd_rmn.8.d: "Крест реет над собором Святой Софии. Константинополь (город Константина, Второй Рим, трофей, ускользнувший от каждого крестового похода) был возвращен в руки христиан румынским оружием. То, что разрушил Четвертый крестовый поход и что требовали османы, Румыния вернула себе. Это значение одинаково отражается как в христианском мире, так и в исламском мире. Румынский гарнизон удерживает Феодосиевы стены. Румынские корабли контролируют Босфор. Вопрос теперь в том, что Румыния будет делать с этим удивительным наследием." #NT!
 nd_rmn.8.a: "Провозгласить новый Рим под защитой Румынии." #NT!
 nd_rmn.8.b: "Крестовый поход не закончится и никогда не закончится." #NT!
 nd_rmn.9.t: "Черноморские ворота" #NT!
 nd_rmn.9.d: "Порт Констанца и продуваемое всеми ветрами побережье Добруджи теперь принадлежат Румынии. Если когда-то генуэзцы и венецианцы боролись за торговые привилегии на Черном море, а османы контролировали весь доступ к морю, то теперь румынские купцы загружают зерно, соль и шерсть на корабли, направляющиеся в каждый уголок Средиземноморья. Древнегреческая колония Томис, где Овидий провел свое изгнание, возродилась как окно Румынии в море. Богатство Дунайской равнины больше не течет только на рынки Османской империи или Габсбургов. Она течет туда, куда ее направляет Румыния." #NT!
 nd_rmn.9.a: "Море — наш рынок." #NT!
 nd_rmn.10.t: "Хлебница трёх империй" #NT!
 nd_rmn.10.d: "Когда Русе захвачено, а нижний Дунай находится под твердым контролем Румынии, сельскохозяйственный центр княжеств превратился в житницу, которая кормит три империи. Румынская пшеница течет вниз по реке к Черному морю и через Средиземное море. Соль из карпатских рудников попадает на рынки, которые когда-то зависели от отдаленных поставщиков. Боярские поместья и крестьянские хозяйства Валахии производят излишки, которые питают растущий торговый класс в Бухаресте и придунайских городах. Румыния процветает, но процветание привлекает внимание." #NT!
 nd_rmn.10.a: "Продавайте всем: пусть излишки будут нашим оружием." #NT!
 nd_rmn.10.b: "Сначала постройте дороги, мосты и склады." #NT!
 nd_rmn.11.t: "Париж Балкан" #NT!
 nd_rmn.11.d: "Варна присоединилась к черноморскому побережью Румынии, а Бухарест преобразился. Город, который когда-то был грязным валашским торговым городком, теперь стал столицей бульваров, академий и дипломатических салонов. Французские архитекторы спроектировали его общественные здания. Румынские интеллектуалы дебатируют в кофейнях, что было бы неуместно на Левом берегу. Иностранные послы борются за влияние при королевском дворе. «Micul Paris», «Маленький Париж», как его называют европейцы, и на этот раз лесть не совсем пуста. Вопрос в том, как использовать этот новый статус." #NT!
 nd_rmn.11.a: "Откройте наши двери миру." #NT!
 nd_rmn.11.b: "Командуйте черноморскими торговыми путями." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_storm_walls: "Штурмовать стены" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_storm_walls: "Армии Румынии проводят каждую осаду с яростной агрессией, штурмуя укрепления, вместо того, чтобы ждать, пока голод сделает свое дело." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_hold_line: "Не вешайте трубку" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_hold_line: "Румыния ведет долгую войну, дешево поддерживая свои армии, постепенно восполняя потери и изматывая врага терпением и выносливостью." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_new_rome: "Новый Рим" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_new_rome: "Румыния провозглашает себя защитницей христианского Востока, строя новый имперский порядок с Константинополем в качестве духовного центра и Бухарестом в качестве политического центра." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_eternal_crusade: "Вечный крестовый поход" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_eternal_crusade: "Румыния обязуется вести бесконечную священную войну, поддерживая сети шпионов и наемников для поддержания бесконечной кампании против врагов христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_export_surplus: "Экспортный профицит" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_export_surplus: "Румынское зерно, соль и домашний скот наводняют рынки Юго-Восточной Европы, обогащая торговцев королевства, хотя процветание порождает определенную самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_invest_infra: "Инвестируйте в инфраструктуру" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_invest_infra: "Вместо того, чтобы экспортировать сырье, Румыния инвестирует в дороги, мосты и административную реформу, чтобы интегрировать свои разнообразные территории в единое экономическое целое." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_cosmopolitan: "Космополитическая столица" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_cosmopolitan: "Бухарест становится центром дипломатии и культуры, привлекая ко двору Румынского королевства иностранных посланников, купцов и интеллектуалов." #NT!
 STATIC_MODIFIER_NAME_nd_rmn_dest_black_sea_trade: "Хозяин Черного моря" #NT!
 STATIC_MODIFIER_DESC_nd_rmn_dest_black_sea_trade: "Румыния строит торговый флот, чтобы доминировать на торговых путях Черного моря, защищать свои конвои с зерном и утвердиться в качестве морской державы западной части Черного моря." #NT!
 nd_rmn_citadela_crestina: "Цитадела Крестина" #NT!
 nd_rmn_citadela_crestina_desc: "Великая христианская цитадель, крепость-собор, олицетворяющая роль Румынии как щита христианского мира, с гарнизоном лучших солдат королевства и благословленным православным патриархом." #NT!
 nd_rmn_bursa_comerciala: "Коммерческая бурса" #NT!
 nd_rmn_bursa_comerciala_desc: "Крупная коммерческая биржа, на которой дунайские торговцы зерном, черноморские торговцы и трансильванские горнодобывающие агенты сходятся, чтобы покупать, продавать и финансировать торговлю Юго-Восточной Европы." #NT!
 nd_rmn_citadel_upkeep: "Цитадель Гарнизон" #NT!
 nd_rmn_citadel_upkeep_desc: "Поддержание христианской цитадели, камня для стен и башен, оружия для гарнизона, инструментов для ремонта и древесины для построек и частоколов." #NT!
 nd_rmn_exchange_operations: "Обменные операции" #NT!
 nd_rmn_exchange_operations_desc: "Управление коммерческой биржей, бумага для контрактов и бухгалтерских книг, ткань для торговых палаток и мебели, соль для торговли товарами и инструменты для обслуживания складов." #NT!
  
  # ===== BUREAUCRACIES ===== 
 rmn_sfatul_domnesc_bureaucracy: "Сфатул Домнеск" #NT!
 rmn_sfatul_domnesc_bureaucracy_desc: "Княжеский Совет великих бояр, засвидетельствованный в Валахии от Басараба I и в Молдавии от Богдана I. Мареле логофат, ворник, вистьер, спатар и постельник регистрируют каждую грамоту, подписываемую воеводой; династия правит только с их согласия. При полном инвестировании совет связывает великие семьи с троном; пренебрегая, он распадается на соперничающие боярские партии (Крайовешть, Мовилешты), которые свергают князей снизу." #NT!
 rmn_mitropolia_bureaucracy: "Митрополия" #NT!
 rmn_mitropolia_bureaucracy_desc: "Две румынские митрополии: Унгро-Валахия, подтвержденная Константинополем в 1359 году при Ячинте Вичинском, Молдавия получила статус митрополии в 1401 году при Иосифе. Митрополиты коронуют каждого князя, регистрируют святых государства и связывают княжества с афонско-греческим миром через ставропигиальные монастыри (Тисмана, Путна, Куртя-де-Арджеш, Нямц). Когда их посвященные монастыри прекращают свое существование, доходы перекачиваются на Афон, Синай и Иерусалим." #NT!
 rmn_pravila_mare_bureaucracy: "Правила Маре" #NT!
 rmn_pravila_mare_bureaucracy_desc: "Indreptarea legii, напечатанная в Тырговиште в 1652 году при Матее Басарабе, опираясь на византийскую базилику и патриархальные каноны; в Молдавии ту же работу уже проделала «Романская карта инвататуры» Василе Лупу (Яссы, 1646 г.). Впервые законы о наследстве, приданом, уголовном процессе и церковной юрисдикции были изложены на румынском языке и напечатаны кириллицей на княжеских печатных машинах, преподавались в монастырских школах и читались на скамьях мещанских судов." #NT!
 rmn_phanariot_administration_bureaucracy: "Администрация фанариотов" #NT!
 rmn_phanariot_administration_bureaucracy_desc: "Между 1711 (Молдавия) и 1716 (Валахия) и греческой революцией 1821 года Порта сдала оба трона в аренду константинопольским семьям фанариотов: Маврокордата, Гики, Ипсиланти, Суту, Караджи и Каллимачи. Двухлетние контракты, оплачиваемые за счет гонораров мукарреров, вынудили принцев компенсировать свои затраты за счет откупщиков. Они грецизировали канцелярию, превратили диван в министерский Despartiri, отменили крепостное право (1746/1749) и основали греческие школы в Бухаресте и Яссах, но высшее боярство ненавидело их как иностранцев, и крестьянство было вынуждено согласиться на контракт." #NT!
 rmn_asezamint_mavrocordat_bureaucracy: "Асезаминтул луи Маврокордат" #NT!
 rmn_asezamint_mavrocordat_bureaucracy_desc: "Константин Маврокордат занимал каждый трон шесть раз в период с 1730 по 1769 год и использовал эти сроки для продвижения румынской просвещенной финансовой реформы: русумат (фиксированный ежеквартальный подушный налог, заменяющий произвольные распределения цислы), восстановленный кадастровый катастиф, отмена личного подневольного состояния (Румыния отменена в Валахии 5 августа 1746 года; векиния в Молдавии). 6 апреля 1749 г.), а также превращение боярина из домованиала в наемного государственного чиновника." #NT!
 rmn_regulamentul_organic_bureaucracy: "Регуламентул Органик" #NT!
 rmn_regulamentul_organic_bureaucracy_desc: "Разработанная смешанными боярскими комиссиями в Бухаресте и Яссах под руководством российского генерал-губернатора Павла Киселева, обнародованная в Валахии 1 июля 1831 года и Молдавии 1 января 1832 года. Две почти идентичные квазиконституции устанавливали единое избираемое Генеральное собрание для каждого княжества, государственный бюджет, разделение судебных и исполнительных функций, министерства (внутренних дел, финансов, юстиции, иностранных дел, войны), единый барщинный график 12 дней и отмена таможенных барьеров между Валахией и Молдавией: институциональная основа, позволившая создать союз 1859 года." #NT!
  
  # ===== BUREAUCRACY AUTHORITY (auto-modifier on formation) ===== 
 AUTO_MODIFIER_NAME_nd_rmn_bureaucracy_authority: "Бюрократическая власть Соединенных Княжеств" #NT!
 AUTO_MODIFIER_DESC_nd_rmn_bureaucracy_authority: "При формировании [RMN.GetName] средневековое валашско-молдавское институциональное наследие (Сфатул Домнеск, митрополичьи кафедры, Правила и постфанариотские административные реформы) становится доступным в качестве банка исторической бюрократии, которую князь может реализовать по своему желанию." #NT!
