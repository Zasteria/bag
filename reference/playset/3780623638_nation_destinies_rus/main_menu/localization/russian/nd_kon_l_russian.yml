l_russian:
 STATIC_MODIFIER_NAME_nd_kon_christian_diplomacy: "Христианская дипломатия Конго" #NT!
 STATIC_MODIFIER_DESC_nd_kon_christian_diplomacy: "Маниконго приняло веру Рима, открыв каналы дипломатии с судами Европы. Конголезские посланники отправляются в Лиссабон и Ватикан, а миссионеры и ученые привозят знания и методы в Мбанза Конго." #NT!
 STATIC_MODIFIER_NAME_nd_kon_strength_of_ancestors: "Сила предков" #NT!
 STATIC_MODIFIER_DESC_nd_kon_strength_of_ancestors: "Маниконго черпает авторитет из традиций основателей: мастеров-кузнецов, выковавших королевство. Барабаны войны эхом разносятся по провинциям, и воины со щитами готовы защитить каждую границу." #NT!
 STATIC_MODIFIER_NAME_nd_kon_antonine_fervor: "Антонин Фервор" #NT!
 STATIC_MODIFIER_DESC_nd_kon_antonine_fervor: "Учение пророчицы распространилось по всей стране, провозглашая, что священные корни королевства уходят глубже, чем любое иностранное вероучение. Люди сплачиваются вокруг этого видения явно конголезской веры." #NT!
 STATIC_MODIFIER_NAME_nd_kon_national_renaissance: "Конголезский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_kon_national_renaissance: "Новое чувство конголезской идентичности распространяется по королевству, поскольку люди заново открывают для себя и прославляют традиции, искусство и системы управления, которые делают их цивилизацию уникальной." #NT!
 nd_kon.1.t: "Королевство Конго возрождается" #NT!
 nd_kon.1.d: "Великая работа завершена. От берегов могучей Нзади, реки, которую иностранцы называют Конго, до берегов западного океана, разбросанные провинции снова подчиняются единому трону. Мбанза Конго является сердцем воссоединенного королевства, его каменные церкви и древние дома духов являются свидетельством королевства, соединяющего миры.\n\nМаниконго теперь должно выбрать путь вперед. Должны ли мы воспользоваться связями, налаженными с заморскими королевствами, использовать их веру и учиться, чтобы укрепить нашу собственную? Или нам стоит заглянуть внутрь себя, к железным традициям и древней мудрости, которые построили это королевство задолго до того, как на нашем горизонте появился какой-либо иностранный корабль?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_kon.1.a: "Мы прогуляемся по Риму и Лиссабону." #NT!
 nd_kon.1.b: "Наша сила – в кузнице и предках." #NT!
 nd_kon.2.t: "Пророчица Конго" #NT!
 nd_kon.2.d: "Молодая женщина благородного происхождения восстала из пепла десятилетий гражданской войны, утверждая, что ею одержим дух святого Антония. Но ее учение не является простым повторением европейской доктрины: донья Беатрис Кимпа Вита провозглашает, что Иисус Христос родился в Мбанза Конго, что Богородица была конголезской женщиной и что святые были предками конголезского народа.\n\nЕе движение Антонинов охватывает сельскую местность, давая надежду людям, измученным войной. Она призывает к воссоединению королевства и восстановлению заброшенной столицы. Тысячи людей стекаются под ее знамя, а старые державы, как конголезские, так и европейские, наблюдают с тревогой." #NT!
 nd_kon.2.a: "Пусть ее послание объединит наш народ." #NT!
 nd_kon.2.b: "Направьте рвение ее последователей на служение королевству." #NT!
 nd_kon.3.t: "Конголезская идентичность" #NT!
 nd_kon.3.d: "В то время как эпоха революций меняет мир, народ Конго с новой гордостью смотрит на свое наследие. Узоры на тканях из рафии, которые когда-то служили валютой, традиции ковки железа, породившие королей, барабанные сигналы, которые координировали действия армий на огромных расстояниях: это не пережитки исчезнувшего прошлого, а живые традиции, которые определяют, кто такие конголезцы.\n\nУченые и старейшины работают над сохранением и прославлением уникального культурного наследия королевства, гарантируя, что самобытность Конго сохранится независимо от того, какие изменения может принести будущее." #NT!
 nd_kon.3.a: "Наши традиции – наша сила." #NT!
 nd_kon.3.b: "Гордость нашего народа станет нашей силой в оружии." #NT!
 nd_kon_iron_tradition: "Железное мастерство" #NT!
 nd_kon_iron_tradition_desc: "Основателями Конго были мастера кузницы, а кузнец остается фигурой духовного и политического авторитета. Железные инструменты, оружие и символы королевской власти производятся в конголезских кузницах." #NT!
 nd_kon_shield_warriors: "Воины со щитом" #NT!
 nd_kon_shield_warriors_desc: "Тяжелая пехота Конго несет в бой большие щиты и мечи, образуя дисциплинированное ядро, которое поглощает атаки противника, прежде чем контратаковать с близкого расстояния." #NT!
 nd_kon_nzo_a_nkisi_tradition: "Традиция Нзо а Нкиси" #NT!
 nd_kon_nzo_a_nkisi_tradition_desc: "Дома духов Конго являются хранилищами нкиси: священных предметов, наделенных духовной силой. Эти святыни закрепляют общины и укрепляют авторитет местных лидеров." #NT!
 nd_kon_raffia_weaving: "Плетение из рафии" #NT!
 nd_kon_raffia_weaving_desc: "Конголезские ткачи превращают пальмовые волокна рафии в роскошные ткани с плотным переплетением и замысловатыми узорами, окрашенные и вышитые в соответствии со стандартами, которые делают ткань надежным средством обмена." #NT!
 nd_kon_nzimbu_currency: "Валюта Нзимбу Шелл" #NT!
 nd_kon_nzimbu_currency_desc: "Спиральные раковины нзимбу из Луанды служат стандартной валютой королевства. Сотня купит курицу, две тысячи — козу: сложная денежная система, облегчающая торговлю по всему королевству." #NT!
 nd_kon_pombo_scouts: "Помбо Скауты" #NT!
 nd_kon_pombo_scouts_desc: "Элитные разведывательные войска армии Конго, помбо обучены не отставать от пеших конных всадников. Они служат глазами и ушами королевства, преследуя убегающих врагов и разведывая вражеские позиции." #NT!
 nd_kon_stone_masonry: "Каменная кладка" #NT!
 nd_kon_stone_masonry_desc: "При Афонсу I конголезские рабочие изучали европейские методы каменного строительства, возводя церкви и дворцы, в которых импортированные методы сочетались с местными особенностями: физическое свидетельство культурного синтеза королевства." #NT!
 nd_kon_royal_school: "Королевская школа Мбанза Конго" #NT!
 nd_kon_royal_school_desc: "К 1516 году более тысячи учеников посещали королевскую школу в Мбанза Конго, а в провинциях были открыты дополнительные школы. Результатом стал полностью грамотный дворянский класс, беспрецедентный в странах Африки к югу от Сахары." #NT!
 nd_kon_mbanza_capital: "Мбанза Конго" #NT!
 nd_kon_mbanza_capital_desc: "Столица королевства превращается в настоящий город, его улицы имеют названия, каменные соборы и часовни возвышаются рядом с традиционными постройками. Мбанза Конго — политическое, духовное и экономическое сердце королевства." #NT!
 nd_kon_provincial_dukes: "Провинциальные герцоги" #NT!
 nd_kon_provincial_dukes_desc: "Шесть великих провинций (Нсунди, Мпангу, Мбата, Сойо, Мбамба и Мпемба) организованы под руководством назначаемых губернаторов, носящих герцогские титулы европейского образца, создавая структурированную иерархию управления." #NT!
 nd_kon_copper_trade: "Медная торговля" #NT!
 nd_kon_copper_trade_desc: "Залежи меди в регионе питают торговлю обработанным металлом, которая распространяется по всей Центральной Африке и за ее пределами, обеспечивая королевство ценным товаром наряду с экспортом текстиля и слоновой кости." #NT!
 nd_kon_musket_regiment: "Мушкетный полк" #NT!
 nd_kon_musket_regiment_desc: "Конголезские войска, обученные использованию европейского огнестрельного оружия, образуют организованные мушкетные полки, сочетающие импортированные военные технологии с местными тактическими традициями." #NT!
 nd_kon_atlantic_diplomacy: "Атлантическая дипломатия" #NT!
 nd_kon_atlantic_diplomacy_desc: "Посланники королевства управляют сложной политикой атлантического мира, взаимодействуя с португальскими, голландскими и папскими дворами. Послы Конго принимаются в Лиссабоне и Риме, что делает королевство признанной суверенной державой." #NT!
 nd_kon_cloth_market_tradition: "Традиции тканевого рынка" #NT!
 nd_kon_cloth_market_tradition_desc: "В городах королевства появляются специализированные рынки для торговли тканью рафии, где либонго, стандартизированная тканевая валюта, переходит из рук в руки наряду с импортными европейскими и региональными товарами.\n\n#italic Доступно в: $nd_kon_cloth_market$#!" #NT!
 nd_kon_missionary_education: "Миссионерское образование" #NT!
 nd_kon_missionary_education_desc: "Миссионеры-иезуиты и капуцины открывают в королевстве колледжи, в которых преподают чтение, письмо, теологию и европейские науки. Образовавшийся в результате класс грамотных людей устраняет разрыв между конголезскими и европейскими традициями знаний." #NT!
 nd_kon_battle_drums: "Боевые барабаны и сигналы" #NT!
 nd_kon_battle_drums_desc: "Сложная система барабанов, горнов и вымпелов позволяет конголезским командирам координировать свои силы на поле боя, точно направляя центр и два крыла своих боевых порядков." #NT!
 nd_kon_battle_formations: "Тактика трех дивизионов" #NT!
 nd_kon_battle_formations_desc: "Конголезские армии развертываются в сложном построении из трех дивизий: сильный центр, окруженный двумя мобильными крыльями, координация которых осуществляется с помощью сложной системы барабанных сигналов и боевых флагов." #NT!
 nd_kon_fortress_walls: "Укрепления Мбанзы" #NT!
 nd_kon_fortress_walls_desc: "Ключевые города и стратегические позиции получают оборонительные укрепления, сочетающие строительство частоколов с технологиями, полученными в европейской военной инженерии." #NT!
 nd_kon_syncretic_faith: "Синкретическая вера" #NT!
 nd_kon_syncretic_faith_desc: "Конголезская христианская практика включает в себя элементы традиционных верований, создавая особую религиозную культуру, признающую как крест, так и нкиси. Этот синтез укрепляет социальную сплоченность различных сообществ." #NT!
 nd_kon_lucanzos_tradition: "Лукансос" #NT!
 nd_kon_lucanzos_tradition_desc: "Специальные отряды, называемые луканцос, обучаются рейдам, засадам и нетрадиционным методам ведения войны. Эти элитные войска действуют независимо, нанося удары там, где противник наиболее слаб, и отступая перед решающим столкновением." #NT!
 nd_kon_long_distance_trade: "Международная торговля" #NT!
 nd_kon_long_distance_trade_desc: "Конголезские торговцы расширяют свои сети вглубь страны, торгуя тканями, медью, солью и слоновой костью по маршрутам, соединяющим Атлантическое побережье с сердцем Центральной Африки." #NT!
 nd_kon_antonine_movement: "Антониновое движение" #NT!
 nd_kon_antonine_movement_desc: "Движение Антонинов доньи Беатрис Кимпа Вита провозглашает отчетливо конголезское христианство, учит, что священные фигуры веры были конголезцами. Хотя его пророчица приняла мученическую смерть, послание движения о культурной гордости живо." #NT!
 nd_kon_civil_war_resilience: "Устойчивость к гражданской войне" #NT!
 nd_kon_civil_war_resilience_desc: "Королевство переживает пятьдесят лет разрушительной гражданской войны после битвы при Мбвиле. Несмотря на потертости, идея Конго как единого королевства никогда не умирает, и стойкость людей помогает им пережить самые мрачные годы." #NT!
 nd_kon_restored_kingdom: "Восстановленное Королевство" #NT!
 nd_kon_restored_kingdom_desc: "После десятилетий раздробленности королевство постепенно воссоединяется под обновленной королевской властью. Провинции вновь признают центральное Маниконго, и механизм управления перестраивается." #NT!
 nd_kon_coastal_defense: "Береговая оборона" #NT!
 nd_kon_coastal_defense_desc: "Поскольку европейские державы становятся все более агрессивными вдоль побережья, Конго укрепляет свои границы и стратегические позиции, делая любое вторжение дорогостоящим предложением для потенциальных завоевателей." #NT!
 nd_kon_ivory_export: "Экспорт слоновой кости" #NT!
 nd_kon_ivory_export_desc: "Слоновая кость становится одним из самых прибыльных предметов экспорта королевства, ее обрабатывают и продают европейским купцам, которые ценят этот материал для изготовления предметов роскоши. Торговля обогащает казну королевства и поддерживает его экономику.\n\n#italic Доступно в: $nd_kon_cloth_market$#!" #NT!
 nd_kon_national_identity: "Конголезская идентичность" #NT!
 nd_kon_national_identity_desc: "В эпоху революционных перемен народ Конго вновь подтверждает свое уникальное культурное наследие: текстильное искусство, традиции изготовления железа, язык барабанов и системы управления, которые определяют их цивилизацию." #NT!
 nd_kon_modern_army: "Современная армия" #NT!
 nd_kon_modern_army_desc: "Конголезские военные используют современные методы обучения, тактику и организацию, создавая профессиональные силы, способные защитить суверенитет королевства в меняющемся мире." #NT!
 nd_kon_independence_spirit: "Дух независимости" #NT!
 nd_kon_independence_spirit_desc: "По мере того, как колониальное давление нарастает по всей Африке, конголезцы опираются на многовековой гордый суверенитет, чтобы противостоять иностранному господству, сохраняя независимость и территориальную целостность королевства." #NT!
 nd_kon_palm_oil_economy: "Экономика пальмового масла" #NT!
 nd_kon_palm_oil_economy_desc: "Переход на пальмовое масло в качестве основного экспортного товара диверсифицирует экономику королевства, обеспечивая устойчивый источник дохода, поскольку традиционные модели торговли меняются в индустриальную эпоху.\n\n#italic Доступно в: $nd_kon_palm_oil_press$#!" #NT!
 a_nd_kon_shield_warriors: "Воины со щитом" #NT!
 a_nd_kon_shield_warriors_desc: "Тяжелая конголезская пехота, вооруженная большими щитами и мечами. Эти дисциплинированные войска составляют оборонительную основу армии, поглощая залпы противника перед тем, как сблизиться для решающего рукопашного боя." #NT!
 a_nd_kon_pombo_scouts: "Помбо Скауты" #NT!
 a_nd_kon_pombo_scouts_desc: "Элитные отряды преследования обучены не отставать от пеших всадников. Помбо служат разведчиками, застрельщиками и преследователями, используя свою исключительную скорость и знание местности, чтобы перехитрить врага." #NT!
 a_nd_kon_musket_regiment: "Конголезский мушкетный полк" #NT!
 a_nd_kon_musket_regiment_desc: "Организованные мушкетные войска, сочетающие европейское огнестрельное оружие с конголезской тактической дисциплиной. К семнадцатому веку Конго выставила на вооружение сотни обученных мушкетеров наряду с традиционными силами." #NT!
 a_nd_kon_lucanzos: "Лукансос" #NT!
 a_nd_kon_lucanzos_desc: "Войска специального назначения обучены рейдам, засадам и нетрадиционным методам ведения войны. Луканцо наносят быстрые удары и исчезают, нарушая линии снабжения противника и сея замешательство на враждебной территории." #NT!
 a_nd_kon_modern_infantry: "Современная конголезская пехота" #NT!
 a_nd_kon_modern_infantry_desc: "Профессионально обученная конголезская пехота, оснащенная современным оружием и тактикой, представляет собой адаптацию королевства к военным реалиям индустриальной эпохи." #NT!
 nd_kon_iron_forge: "Железная Кузница" #NT!
 nd_kon_iron_forge_desc: "Традиционная конголезская кузница, где мастера-кузнецы производят оружие, инструменты и железные символы королевской власти. Кузница – это одновременно мастерская и священное место." #NT!
 nd_kon_nzo_a_nkisi: "Нзо а Нкиси" #NT!
 nd_kon_nzo_a_nkisi_desc: "Традиционный конголезский дом духов, содержащий нкиси: священные предметы, которые, как полагают, передают духовную силу. Эти святыни служат центрами общественной жизни и укреплением местной власти." #NT!
 nd_kon_stone_church: "Каменная церковь" #NT!
 nd_kon_stone_church_desc: "Церковь, построенная в стиле Афонсу I, сочетающем европейскую каменную кладку с конголезскими архитектурными особенностями. Эти здания являются одновременно молитвенными домами и символами взаимодействия королевства с остальным миром." #NT!
 nd_kon_cloth_market: "Тканевый рынок" #NT!
 nd_kon_cloth_market_desc: "Специальный рынок для торговли тканью рафии, где валюта либонго переходит из рук в руки, и купцы со всего королевства собираются для обмена товарами." #NT!
 nd_kon_jesuit_college: "Иезуитский колледж" #NT!
 nd_kon_jesuit_college_desc: "Учебное заведение, основанное миссионерами-иезуитами, обучающее грамоте, теологии и европейским наукам сыновей конголезской знати." #NT!
 nd_kon_mbanza_fortress: "Крепость Мбанза" #NT!
 nd_kon_mbanza_fortress_desc: "Оборонительное укрепление, сочетающее в себе строительство частоколов и европейскую военную инженерию, защищающее ключевые города и стратегические позиции королевства." #NT!
 nd_kon_antonine_shrine: "Храм Антонина" #NT!
 nd_kon_antonine_shrine_desc: "Место поклонения, посвященное традиции Антонинов, где сохраняется и прославляется учение Кимпа Вита о том, что священные фигуры христианства были конголезцами." #NT!
 nd_kon_palm_oil_press: "Пресс для пальмового масла" #NT!
 nd_kon_palm_oil_press_desc: "Завод по переработке пальмовых плодов в масло на экспорт, символизирующий экономическую адаптацию королевства к новым моделям глобальной торговли." #NT!
 nd_kon_raffia_cloth_production: "Производство тканей рафия" #NT!
 nd_kon_raffia_cloth_production_desc: "Систематическое плетение из пальмовых волокон рафии узорчатой ​​ткани - ремесло, которое производит как торговые товары, так и тканевую валюту либонго." #NT!
 nd_kon_copper_working: "Медная обработка" #NT!
 nd_kon_copper_working_desc: "Региональная медь перерабатывается в декоративные украшения, браслеты и товары, которые ценятся по всей Центральной Африке." #NT!
 nd_kon_ivory_processing: "Торговля слоновой костью" #NT!
 nd_kon_ivory_processing_desc: "Слоновая кость из внутренних районов проходит через рынок, обрабатывается с помощью инструментов и превращается в готовые изделия, которые ценятся в атлантической торговле." #NT!
 nd_kon_forge_maintenance: "Кузнечное производство" #NT!
 nd_kon_forge_maintenance_desc: "Конголезские кузнецы перерабатывают из железа и древесного угля инструменты, оружие и железные символы королевской власти." #NT!
 nd_kon_shrine_offerings: "Подношения святыни" #NT!
 nd_kon_shrine_offerings_desc: "Ритуальные подношения глиняной посуды, ткани и пчелиного воска для поддержания духовной силы нкиси и поддержки сообщества, собравшегося вокруг святыни." #NT!
 nd_kon_church_maintenance: "Обслуживание церкви" #NT!
 nd_kon_church_maintenance_desc: "Для содержания каменных церковных зданий требуется камень для ремонта, пиломатериалы для строительных лесов и мебели, а также инструменты для каменщиков, работающих в конголезско-европейском стиле." #NT!
 nd_kon_cloth_market_operation: "Рыночные операции" #NT!
 nd_kon_cloth_market_operation_desc: "Ежедневная деятельность рынка тканей, включая закупку окрашенной ткани из рафии для торговли." #NT!
 nd_kon_college_upkeep: "Содержание колледжа" #NT!
 nd_kon_college_upkeep_desc: "Бумага, книги и другие материалы, необходимые для поддержания образовательных программ иезуитского колледжа." #NT!
 nd_kon_fortress_garrison: "Крепостной гарнизон" #NT!
 nd_kon_fortress_garrison_desc: "Оружие, строительные материалы и кожаное снаряжение, необходимые для вооружения и содержания гарнизона крепости." #NT!
 nd_kon_antonine_offerings: "Антонин Посвящения" #NT!
 nd_kon_antonine_offerings_desc: "Благовония и ткань, используемые в отличительных практиках поклонения движения Антонинов, наполняют святыню ароматом преданности и цветами конголезской веры." #NT!
 nd_kon_oil_processing: "Переработка нефти" #NT!
 nd_kon_oil_processing_desc: "Плоды пальмы прессуют на дровах и перерабатывают в масло, используемое для приготовления пищи, мыла и лекарств: универсальный товар, ценимый в региональной и атлантической торговле." #NT!
 levy_nd_kon_shield_warriors: "Щит Воин Леви" #NT!
 levy_nd_kon_shield_warriors_desc: "Тяжелая пехота, собранная из провинций, вооруженная большими щитами и мечами в соответствии с конголезской традицией." #NT!
 levy_nd_kon_lucanzos: "Лукансос Леви" #NT!
 levy_nd_kon_lucanzos_desc: "Специальные отряды, созданные для рейдов и нетрадиционных боевых действий, набранные из самых опытных бойцов королевства." #NT!
 STATIC_MODIFIER_NAME_nd_kon_antonine_mobilization: "Антонин Мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_kon_antonine_mobilization: "Рвение движения Антонинов направляется на службу королевству, поскольку последователи Кимпа Вита с преданностью верующих сплачиваются под знаменем Маниконго." #NT!
 STATIC_MODIFIER_NAME_nd_kon_national_mobilization: "Национальная мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_kon_national_mobilization: "Возобновившаяся гордость конголезского народа выражается в военной готовности, поскольку воины, сражающиеся за свое культурное наследие, сражаются с решимостью, рожденной глубокой идентичностью." #NT!
 nd_kon_formed_tt: "Конго было образовано" #NT!
 nd_kon_path_a_tt: "Выбрал христианскую дипломатию Конго" #NT!
 nd_kon_path_b_tt: "Выбери силу предков" #NT!
 nd_kon_destiny: "Воссоединенное Королевство" #NT!
 nd_kon_destiny_desc: "Разрозненные провинции снова подчиняются единому Маниконго. Теперь королевству предстоит выбрать свой путь: наружу, в более широкий мир, или внутрь, к кузнице и предкам." #NT!
 nd_kon_dest_embassy: "Посольство в Риме" #NT!
 nd_kon_dest_embassy_desc: "Сделайте Конго признанным христианским королевством, установив дипломатические и институциональные связи с Европой. Используйте банковское дело и развивайте торговлю слоновой костью, чтобы финансировать эти амбиции." #NT!
 nd_kon_dest_atlantic: "Атлантическая торговая сеть" #NT!
 nd_kon_dest_atlantic_desc: "Расширьте конголезский контроль над Атлантическим побережьем, обеспечив безопасность острова Сан-Томе и порта Габун, создав торговую сеть, которая соединит внутренние районы страны с миром." #NT!
 nd_kon_dest_christendom: "Конго и христианский мир" #NT!
 nd_kon_dest_christendom_desc: "Достигните окончательного выражения дипломатического видения Конго: возьмите сам Лиссабон, овладейте мировой торговлей и докажите, что Маниконго стоит на равных среди монархов христианского мира." #NT!
 nd_kon_dest_interior: "Мастер внутренних дел" #NT!
 nd_kon_dest_interior_desc: "Вытеснить конголезскую власть за пределы традиционных шести провинций во внутреннюю часть бассейна Конго, подчинив Теке и установив контроль над регионом Пул в Боме." #NT!
 nd_kon_dest_lunda: "Лундский марш" #NT!
 nd_kon_dest_lunda_desc: "Маршируйте в богатое медью сердце Лунды, захватывая Муссумбу и регион Катанги. Богатство внутренних территорий будет подпитывать амбиции империи." #NT!
 nd_kon_dest_heart: "Сердце Африки" #NT!
 nd_kon_dest_heart_desc: "Управляйте всем бассейном Конго от водопадов Ньянгве до северных районов Банги. Создайте величайшую империю, которую когда-либо видела Центральная Африка." #NT!
 nd_kon.4.t: "Королевство восстановлено" #NT!
 nd_kon.4.d: "Барабаны звучат от Мбанзы Конго до самых отдаленных провинций. Маниконго восседает на троне, который никогда по-настоящему не терялся, а лишь оспаривался. Теперь королевство снова объединилось, готовое написать следующую главу своей долгой истории." #NT!
 nd_kon.4.a: "Пусть барабаны несут наш триумф." #NT!
 nd_kon.5.t: "Посланники за морем" #NT!
 nd_kon.5.d: "Послов Конго принимали при дворах Европы, преподнося подарки из слоновой кости и тонкой ткани из рафии. Ученые Мбанза Конго сейчас изучают банковские системы и институты Запада, адаптируя то, что служит королевству, и отказываясь от того, что не служит. Маниконго признано сувереном среди суверенов." #NT!
 nd_kon.5.a: "Наш голос слышен в залах власти." #NT!
 nd_kon.6.t: "Мастера Атлантического побережья" #NT!
 nd_kon.6.d: "Конголезские корабли и торговцы теперь доминируют на торговых путях от Сан-Томе до побережья Габуна. Слоновая кость, медь и изысканные ткани утекают наружу, в то время как европейские товары, знания и валюта притекают. Теперь вопрос в том, как использовать это богатство: построить торговый флот, способный конкурировать с любым флотом в Атлантике, или инвестировать в школы и институты, которые обеспечат будущее королевства на несколько поколений." #NT!
 nd_kon.6.a: "Постройте флот и наполните его слоновой костью." #NT!
 nd_kon.6.b: "Инвестируйте в школы и институты." #NT!
 nd_kon.7.t: "Маниконго в Лиссабоне" #NT!
 nd_kon.7.d: "То, что когда-то было немыслимо, теперь стало реальностью: знамя Конго реет над самим Лиссабоном, а посол Маниконго ходит по залам Ватикана как равный. Королевство, которому португальцы когда-то думали покровительствовать, превзошло своих потенциальных наставников. Теперь вопрос заключается в том, закрепить ли это новое положение посредством папского признания и дипломатического престижа или использовать его в качестве основы для торговой империи, охватывающей Атлантику." #NT!
 nd_kon.7.a: "Добивайтесь официального признания Папы." #NT!
 nd_kon.7.b: "Наши купцы станут принцами." #NT!
 nd_kon.8.t: "За пределами шести провинций" #NT!
 nd_kon.8.d: "Армии Маниконго пересекли границы традиционных шести провинций и водрузили знамя королевства на землях Теке и народов региона Пула великой реки. Перед нами открывается недра, и богатства бассейна Конго находятся в пределах досягаемости." #NT!
 nd_kon.8.a: "Кузница требует больше железа." #NT!
 nd_kon.9.t: "Богатство Лунды" #NT!
 nd_kon.9.d: "Великий поход во внутренние районы достиг медных земель Лунды. Муссумба, резиденция Мвата Ямво, попала в руки конголезцев, а рудники Катанги теперь питают королевскую казну. Это богатство можно извлечь в качестве дани для дальнейшего расширения, или ветеранов, завоевавших его, можно уважать и сохранять в качестве элитного корпуса, закаленного годами кампаний в джунглях." #NT!
 nd_kon.9.a: "Добудьте медную дань." #NT!
 nd_kon.9.b: "Честь наших ветеранов джунглей." #NT!
 nd_kon.10.t: "Империя Конго" #NT!
 nd_kon.10.d: "От водопадов Ньянгве до северных пределов Банги, от атлантического побережья до медных рудников в дальних глубинах: Маниконго управляет империей, охватывающей самое сердце Африки. Ни одно королевство к югу от Сахары никогда не объединяло под одним троном столь обширную территорию. Железная корона кузнецов-основателей теперь восседает на лбу истинного императора. Как будет управляться эта империя: посредством абсолютной власти железного трона или через сеть рек, связывающую это обширное царство воедино?" #NT!
 nd_kon.10.a: "Правьте с железного трона." #NT!
 nd_kon.10.b: "Управляйте реками, управляйте царством." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_ivory_fleet: "Флот Слоновой Кости" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_ivory_fleet: "Конголезские торговые суда, груженные слоновой костью, медью и тканью из рафии, курсируют по торговым путям Атлантического океана, обогащая казну королевства и расширяя его коммерческое влияние." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_mission_schools: "Миссионерские школы" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_mission_schools: "Школы, созданные в рамках партнерства с европейскими миссионерами, распространяют грамотность и институциональные знания в провинциях Конго." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_papal_recognition: "Папское признание" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_papal_recognition: "Папа официально признал Маниконго суверенным христианским монархом, предоставив Конго дипломатический статус, вызывающий уважение во всем христианском мире." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_merchant_princes: "Торговые принцы Конго" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_merchant_princes: "Торговая элита Конго достигла огромного влияния, ее торговые сети охватывают Атлантику и приносят богатство, которое меняет экономику королевства." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_copper_tribute: "Медная дань" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_copper_tribute: "Завоеванные территории Лунды платят дань медью и другими металлами, обогащая королевскую казну за счет дипломатической доброй воли с соседями." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_jungle_veterans: "Ветераны джунглей" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_jungle_veterans: "Ветераны изнурительных кампаний в лесах бассейна Конго стали элитной боевой силой, закаленной годами войн в джунглях и полностью преданной Маниконго." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_iron_throne: "Железный Трон" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_iron_throne: "Маниконго правит как абсолютный император с железного трона, древнего символа мастеров-кузнецов, основавших королевство, превратившегося в резиденцию континентальной власти." #NT!
 STATIC_MODIFIER_NAME_nd_kon_dest_river_kings: "Ривер Кингс" #NT!
 STATIC_MODIFIER_DESC_nd_kon_dest_river_kings: "Империя управляется через сеть рек, соединяющих ее обширные территории, а региональные губернаторы контролируют водные пути, которые служат шоссе, соединяющими королевство." #NT!
 nd_kon_embassy_house: "Посольский дом" #NT!
 nd_kon_embassy_house_desc: "Величественная дипломатическая резиденция, где встречаются конголезские и иностранные посланники, сочетающая в себе элементы европейской архитектуры и конголезский дизайн. Он служит одновременно посольством и культурной витриной." #NT!
 nd_kon_embassy_maintenance: "Операции посольства" #NT!
 nd_kon_embassy_maintenance_desc: "Для содержания посольского дома необходима бумага для корреспонденции, тонкая ткань для дипломатических подарков и мебель для приема высоких гостей." #NT!
 nd_kon_royal_forge: "Королевская кузница" #NT!
 nd_kon_royal_forge_desc: "Высшая кузница Маниконго, где из лучшего железа и меди перерабатывают оружие, регалии и инструменты империи. Мастера-кузнецы совершают священные ритуалы, обрабатывая металлы, символизирующие королевскую власть." #NT!
 nd_kon_royal_forge_maintenance: "Операции Королевской кузницы" #NT!
 nd_kon_royal_forge_maintenance_desc: "Мастера-кузнецы обрабатывают железо и медь с использованием древесного угля из лесных складов, куют оружие и железные регалии королевской власти, которые символизируют конголезскую власть." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_kon_bureaucracy_authority: "Бюрократическое управление Конго" #NT!
 AUTO_MODIFIER_DESC_nd_kon_bureaucracy_authority: "При формировании королевству предоставляются рамки постоянного административного офиса. В сочетании с постоянной канцелярией в Мбанза Конго это открывает три места, в которых правитель может устанавливать исторические институты управления." #NT!
  
 kon_mwene_provinces_bureaucracy: "Провинции Мвене" #NT!
 kon_mwene_provinces_bureaucracy_desc: "Маниконго делит королевство на шесть провинций (Сойо, Мпемба, Мбамба, Мпангу, Мбата и Нсунди), каждая из которых управляется мани, назначаемым и сменяемым по усмотрению трона. Мани-губернаторы обладают делегированными военными, финансовыми и судебными полномочиями, но остаются наемными агентами короля. Система дала Афонсу I беспрецедентный административный контроль над бассейном Конго; остались без поддержки, губернаторы укрепились в соперничающих дворах, как это сделал Сойо с конца семнадцатого века." #NT!
  
 kon_kanda_council_bureaucracy: "Совет Канда" #NT!
 kon_kanda_council_bureaucracy_desc: "Аристократия мвисиконго была организована в матрилинейные линии канда, старшие главы которых (выдающиеся среди них Мвене Вунда, Мвене Мбата и Мвене Сойо) имели право избирать каждое новое Маниконго. Преемственность в Конго была выборной, а не строго наследственной, и совет связывал трон с великими кланами. Когда совет распался в битве при Мбвиле в 1665 году, королевство погрузилось в сорокалетнюю гражданскую войну между претендентами на Кимпанзу и Кинлазу." #NT!
  
 kon_nzimbu_monopoly_bureaucracy: "Королевская монополия Нзимбу" #NT!
 kon_nzimbu_monopoly_bureaucracy_desc: "Нзимбу, небольшие раковины морских улиток, добытые в рамках королевской монополии на острове залива Луанда, служили валютой королевства, измерялись и пересчитывались в горшки фиксированного номинала. Маниконго взимало ежегодный подушный налог в нзимбу с каждого взрослого мужчины и перераспределяло ракушки в качестве титулов, зарплаты и дани. Захват Луанды португальцами в 1576 году и наводнение рынка бразильскими каури уничтожили монополию за одно поколение." #NT!
  
 kon_royal_chancery_bureaucracy: "Королевская канцелярия Мбанза Конго" #NT!
 kon_royal_chancery_bureaucracy_desc: "Афонсу I Мвемба а Нзинга (годы правления 1509–1542) основал постоянную грамотную канцелярию в Мбанза Конго, которая подготовила более четырехсот сохранившихся португальских и латинских писем королям Португалии, папам в Риме и губернаторам провинций Конго. Канцелярия, укомплектованная обученными миссией конголезскими писцами и небольшим корпусом португальских священнослужителей, архивировала договоры, составляла проекты королевских указов и поддерживала посольства в Лиссабоне. Во время правления Гарсии II (1641–1661) он вёл прямые переговоры с голландскими и испанскими Габсбургами." #NT!
  
 kon_sao_salvador_confraternities_bureaucracy: "Братства Сан-Сальвадора" #NT!
 kon_sao_salvador_confraternities_bureaucracy_desc: "После возведения собора Мбанза Конго в епископство в 1596 году переименованная столица Сан-Сальвадор создала густую сеть католических братств-мирян: среди них Святого Духа, Богоматери Розария и Святого Антония. Братства организовывали шествия, финансировали содержание собора, выкупали порабощенных членов и занимались благотворительностью для городской бедноты. Дворяне Мвисиконго боролись за офицерские должности, превращая братства в параллельный гражданский институт, где статус членства имел такое же значение, как и родовой ранг." #NT!
