l_russian:
 STATIC_MODIFIER_NAME_nd_hau_walls_of_amina: "Стены Амины" #NT!
 STATIC_MODIFIER_DESC_nd_hau_walls_of_amina: "Следуя традициям королевы Амины Заззау, мы будем расширять наши владения силой оружия, возводя стены вокруг каждого завоеванного нами города и защищая торговые пути с помощью кавалерии и железа." #NT!
 STATIC_MODIFIER_NAME_nd_hau_crossroads_of_the_sahel: "Перекресток Сахеля" #NT!
 STATIC_MODIFIER_DESC_nd_hau_crossroads_of_the_sahel: "Богатство наций течет через наши рынки. От золотых приисков юга до соляных рудников Сахары, каждый караван, пересекающий Сахель, обогащает нашу казну и распространяет нашу славу." #NT!
 STATIC_MODIFIER_NAME_nd_hau_chronicle_of_kings: "Хроника королей" #NT!
 STATIC_MODIFIER_DESC_nd_hau_chronicle_of_kings: "Письменные записи нашей истории придают авторитет нашей династии и вселяют гордость в наш народ. Наши дела сохранены для потомков." #NT!
 STATIC_MODIFIER_NAME_nd_hau_rumfa_reforms: "Просветление Румфы" #NT!
 STATIC_MODIFIER_DESC_nd_hau_rumfa_reforms: "Следуя модели Мухаммеда Румфы, наша приверженность исламскому образованию и хорошему управлению подняла нашу цивилизацию и привлекла ученых со всего мусульманского мира." #NT!
 nd_hau.1.t: "Объединение Хаусаленда" #NT!
 nd_hau.1.d: "Древние Хауса Баквай, семь настоящих городов-государств, рожденных из легенды Баяджидды, наконец-то оказались под одним правлением. Кано, Кацина, Заззау, Даура, Гобир, Рано и Бирам: каждый известен своими сильными сторонами, каждый теперь является частью большего целого. Вопрос, который стоит перед нами, заключается в том, какую нацию мы построим из этих гордых городов. Должны ли мы пойти по пути королевы Амины, расширяя наши границы мечом и защищая наш народ стенами из земли и железа? Или нам следует направить нашу энергию на большие рынки и торговые пути, которые уже сделали наши города объектом зависти в Сахеле, став торговым центром Западной Африки?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_hau.1.a: "Постройте стены. Покатайтесь на лошадях. Завоевывать." #NT!
 nd_hau.1.b: "Караваны приносят больше богатства, чем любая армия." #NT!
 nd_hau.2.t: "Хроники Кано" #NT!
 nd_hau.2.d: "Наши учёные составили хронику королей Кано, прослеживая родословную наших правителей от легендарного Багауда до наших дней. Написанный арабской вязью, этот замечательный документ описывает взлет и падение династий, приход ислама, великие войны и союзы, сформировавшие нашу нацию, а также деяния королей, как мудрых, так и глупых. Это одно из величайших исторических произведений нашего континента, свидетельство того, что у нашей цивилизации есть история, которую стоит рассказать и сохранить на века." #NT!
 nd_hau.2.a: "Пусть нашу историю помнят." #NT!
 nd_hau.3.t: "Реформы Мухаммеда Румфы" #NT!
 nd_hau.3.d: "Мухаммад Румфа, Сарки из Кано, превратил наш величайший город в центр исламского обучения и управления. Он построил мечети и медресе, пригласил ученых из Египта, Туниса и Марокко и поручил великому ученому аль-Магили написать трактат об обязанностях мусульманских правителей. Такаддум, кодекс управления Румфы, устанавливает рыночные правила, судебные протоколы и основы справедливого исламского государства. Это не просто реформа управления; это возвышение всей нашей цивилизации." #NT!
 nd_hau.3.a: "Встаньте на путь обучения и веры." #NT!
 nd_hau.3.b: "Централизуйте власть в суде Сарки." #NT!
 nd_hau_wall_building_tradition: "Укрепление Бирни" #NT!
 nd_hau_wall_building_tradition_desc: "Строительство массивных земляных стен вокруг городов хауса, создающих укрепленные городские центры, способные выдержать длительную осаду." #NT!
 nd_hau_bayajidda_legacy: "Наследие Баяджидды" #NT!
 nd_hau_bayajidda_legacy_desc: "Основополагающий миф о хауса бакваи, семи городах-государствах, произошедших от героя Баяджидды, обеспечивает культурную основу для политической идентичности хауса." #NT!
 nd_hau_sahel_agriculture: "Сельское хозяйство Сахеля" #NT!
 nd_hau_sahel_agriculture_desc: "Разработка сельскохозяйственных технологий, подходящих для условий Сахеля, с упором на выращивание зерновых, хлопка, овощей и животноводства, а также металлообработку для производства инструментов, необходимых для земледелия." #NT!
 nd_hau_spread_of_islam: "Распространение ислама" #NT!
 nd_hau_spread_of_islam_desc: "Приход ислама через транссахарских торговцев изменил городское общество хауса, привнося грамотность, правовые традиции и связи с более широким исламским миром." #NT!
 nd_hau_equestrian_nobility: "Конное дворянство" #NT!
 nd_hau_equestrian_nobility_desc: "Аристократия хауса развила культуру верховой езды, которая стала основой их военной мощи, с переработкой зерна, чтобы кормить как всадников, так и лошадей." #NT!
 nd_hau_kano_chronicle: "Хроники Кано" #NT!
 nd_hau_kano_chronicle_desc: "Один из самых важных исторических документов Африки, «Хроники Кано», описывает историю города от его легендарного основания до правления его королей." #NT!
 nd_hau_indigo_dyeing: "Крашение Индиго" #NT!
 nd_hau_indigo_dyeing_desc: "Основание знаменитых красильных ям Кано, производящих яркие ткани, окрашенные в цвет индиго, которые стали одним из самых ценных экспортных товаров Хаусаленда.\n\n#italic Доступно в: $nd_hau_kofar_mata$#!" #NT!
 nd_hau_yan_lifida_tradition: "Ян Лифида Традиция" #NT!
 nd_hau_yan_lifida_tradition_desc: "Развитие Ян Лифида, элитной тяжелой кавалерии, носящей многослойные стеганые хлопчатобумажные доспехи с кольчугой, в качестве главной военной силы штата хауса." #NT!
 nd_hau_rumfa_reforms_advance: "Реформы Румфы" #NT!
 nd_hau_rumfa_reforms_advance_desc: "Преобразующие реформы управления Мухаммада Румфы из Кано, который построил мечети и медресе, установил рыночные правила и превратил Кано в центр исламской науки." #NT!
 nd_hau_trans_saharan_links: "Транссахарские связи" #NT!
 nd_hau_trans_saharan_links_desc: "Создание Кано и Кацины в качестве основных узлов транссахарской торговой сети, соединяющей золотодобывающие регионы с Северной Африкой." #NT!
 nd_hau_queen_amina: "Кампании королевы Амины" #NT!
 nd_hau_queen_amina_desc: "Королева Амина из Заззау вела 34-летнюю завоевательную кампанию, расширив территорию хауса от Баучи до Нупе и построив крепостные стены по всей стране." #NT!
 nd_hau_sarauta_governance: "Управление Сараута" #NT!
 nd_hau_sarauta_governance_desc: "Формализация системы управления сараута, организация управления через Сарки и совет девяти старейшин, представляющих королевские, клерикальные и коммерческие интересы." #NT!
 nd_hau_leather_exports: "Экспорт кожи" #NT!
 nd_hau_leather_exports_desc: "Развитие кожевенного производства хауса в крупную экспортную отрасль с промышленной обработкой индиго для окраски кожи и тканей, что прославило Кано.\n\n#italic Доступно в: $nd_hau_kofar_mata$#!" #NT!
 nd_hau_artisan_guilds: "Гильдии ремесленников" #NT!
 nd_hau_artisan_guilds_desc: "Организация ремесленников хауса в специализированные гильдии (кузнецы, ткачи, красильщики, кожевники и строители), каждая из которых имеет внутреннее управление и рыночные привилегии." #NT!
 nd_hau_gobir_frontier: "Гобир Фронтир" #NT!
 nd_hau_gobir_frontier_desc: "В самом северном штате хауса Гобир имелось постоянное военное учреждение для защиты хаусаленда от иностранных захватчиков из Сахары." #NT!
 nd_hau_gunpowder_adoption: "Принятие пороха" #NT!
 nd_hau_gunpowder_adoption_desc: "Внедрение огнестрельного оружия через транссахарскую торговлю, создание мушкетерской пехоты (Ян Биндига) в дополнение к традиционным кавалерийским силам." #NT!
 nd_hau_leather_trade: "Маджема Кожевничество" #NT!
 nd_hau_leather_trade_desc: "Усовершенствование кожевенного дела хауса ремесленниками маджема с использованием дубления на растительной основе со стручками багарува для производства изысканных кожаных изделий на экспорт." #NT!
 nd_hau_market_competition: "Рыночная конкуренция" #NT!
 nd_hau_market_competition_desc: "Соперничество между Кациной и Кано за доминирование в транссахарской торговле заставляет оба города развивать сложные рыночные институты." #NT!
 nd_hau_ajami_scholarship: "Стипендия Аджами" #NT!
 nd_hau_ajami_scholarship_desc: "Развитие хауса-аджами, письменности на языке хауса арабской графикой, создание грамотного научного класса, создавшего юридические, исторические и религиозные труды." #NT!
 nd_hau_zango_networks: "Занго Сети" #NT!
 nd_hau_zango_networks_desc: "Основание занго, торговых поселений хауса, вдоль основных торговых путей от лесного пояса до Сахары, расширяющее коммерческое влияние далеко за пределы Хаусаленда.\n\n#italic Доступно в: $nd_hau_zango_post$#!" #NT!
 nd_hau_centralized_sarauta: "Централизованная Сараута" #NT!
 nd_hau_centralized_sarauta_desc: "Консолидация королевской власти под властью сильного Сарки, который централизовал сбор налогов и военное командование, укрепив государственный аппарат." #NT!
 nd_hau_urban_growth: "Рост городов" #NT!
 nd_hau_urban_growth_desc: "Расширение городов хауса в крупные городские центры, при этом Кано и Кацина конкурируют с Тимбукту по численности населения и коммерческой деятельности." #NT!
 nd_hau_cotton_industry: "Хлопковая промышленность" #NT!
 nd_hau_cotton_industry_desc: "Развитие хлопкового земледелия и текстильного ткачества как основной отрасли промышленности: ткани хауса продаются по всей Западной Африке.\n\n#italic Доступно в: $nd_hau_zango_post$#!" #NT!
 nd_hau_standing_army: "Постоянная армия" #NT!
 nd_hau_standing_army_desc: "Эволюция военной организации хауса от специальных наборов до постоянных постоянных сил в крупных городах-государствах.\n\n#italic Доступно в: $nd_hau_zango_post$#!" #NT!
 nd_hau_sahel_diplomacy: "Сахельская дипломатия" #NT!
 nd_hau_sahel_diplomacy_desc: "Дипломатические традиции хауса в переговорах и построении союзов между городами-государствами, управление сложным балансом сил в Сахеле." #NT!
 nd_hau_defense_of_autonomy: "Защита автономии" #NT!
 nd_hau_defense_of_autonomy_desc: "Защита независимости города-государства хауса от внешнего давления, сохранение традиций самоуправления, которые определяли хаусаленд." #NT!
 nd_hau_commercial_sophistication: "Коммерческая сложность" #NT!
 nd_hau_commercial_sophistication_desc: "Продолжающееся совершенствование коммерческих учреждений хауса, при этом рыночные города служат центрами региональной и междугородной торговли.\n\n#italic Доступно в: $nd_hau_zango_post$#!" #NT!
 nd_hau_cultural_resilience: "Культурная устойчивость" #NT!
 nd_hau_cultural_resilience_desc: "Сохранение и развитие культурной самобытности хауса посредством устных традиций, самобытной архитектуры и специализированного ремесленного производства." #NT!
 nd_hau_sahel_stewardship: "Управление Сахеля" #NT!
 nd_hau_sahel_stewardship_desc: "Расширение сельскохозяйственных технологий для управления хрупкой окружающей средой Сахеля и поддержания растущего городского населения." #NT!
 nd_hau_maliki_jurisprudence: "Малики Юриспруденция" #NT!
 nd_hau_maliki_jurisprudence_desc: "Развитие правовой системы, сочетающей исламскую юриспруденцию школы Малики с обычным правом хауса, создавая прагматичную структуру управления." #NT!
 a_nd_hau_yan_lifida: "Ян Лифида" #NT!
 a_nd_hau_yan_lifida_desc: "Элитная тяжелая кавалерия хауса в многослойных стеганых хлопчатобумажных доспехах (лифида) и кольчугах (сулке), верхом на бронированных лошадях. Эти грозные воины служили телохранителями эмира и ударной силой армий хауса." #NT!
 a_nd_hau_yan_lifida_levy: "Ян Лифида (Леви)" #NT!
 a_nd_hau_yan_lifida_levy_desc: "Тяжелая кавалерия, набранная из числа аристократов хауса, экипированная стегаными доспехами и кольчугами в традициях Ян Лифида." #NT!
 a_nd_hau_yan_bindiga: "Ян Биндига" #NT!
 a_nd_hau_yan_bindiga_desc: "Мушкетеры хауса, вооруженные огнестрельным оружием, приобретенным в результате транссахарской торговли. Эта пороховая пехота обеспечивала разрушительную огневую мощь, дополняя традиционную кавалерийскую атаку." #NT!
 a_nd_hau_yan_bindiga_levy: "Ян Биндига (Леви)" #NT!
 a_nd_hau_yan_bindiga_levy_desc: "Набранные на призыв мушкетеры, вооруженные торговым огнестрельным оружием, набранные из рядовых солдат городов-государств хауса." #NT!
 nd_hau_birni_walls: "Стены Бирни" #NT!
 nd_hau_birni_walls_desc: "Массивные земляные крепостные стены, окружающие целые города хауса и прилегающие к ним сельскохозяйственные районы. Одни только стены Кано протянулись на 23 километра, достигая высоты 15 метров при толщине основания 12 метров." #NT!
 nd_hau_kofar_mata: "Красильные ямы Кофар Мата" #NT!
 nd_hau_kofar_mata_desc: "Круглые красильные ямы, производящие яркую ткань, окрашенную в цвет индиго, которая прославила Кано на всю Западную Африку и по всей Сахаре. Пурпурный хлопок Кано когда-то мог соперничать с легендарными богатствами Тимбукту." #NT!
 nd_hau_tsangaya: "Школа Цангая" #NT!
 nd_hau_tsangaya_desc: "Исламский учебный центр, где преподают изучение Корана и арабскую грамотность, создавая грамотный ученый класс, который управляет городами-государствами и ведет юридические и исторические записи." #NT!
 nd_hau_sarauta_hall: "Зал Совета Сараута" #NT!
 nd_hau_sarauta_hall_desc: "Место управления хауса, где Сарки и его совет из девяти старейшин обсуждают государственные вопросы, балансируя интересы короны, духовенства и торговых гильдий." #NT!
 nd_hau_zango_post: "Торговый пост Занго" #NT!
 nd_hau_zango_post_desc: "Торговая станция диаспоры хауса, где местные купцы служат перевалочной станцией для караванов и центрами коммерческой разведки, расширяя торговые сети хауса далеко за пределы родины." #NT!
 nd_hau_majema_tannery: "Маджема Кожевенный завод" #NT!
 nd_hau_majema_tannery_desc: "Мастерская кожевников Маджема, использующая традиционное растительное дубление с использованием стручков багарува для производства мягких кожаных изделий, которые прославили Хаусаленд в Сахаре и за ее пределами." #NT!
 nd_hau_birni_maintenance: "Уход за стеной Бирни" #NT!
 nd_hau_birni_maintenance_desc: "Постоянное обслуживание массивных земляных укреплений, защищающих наши города." #NT!
 nd_hau_dyepit_operations: "Операции на красильной яме" #NT!
 nd_hau_dyepit_operations_desc: "Крашение сырой ткани индиго в знаменитых красильных ямах Кано для производства ярких изысканных тканей, продаваемых по всей Сахаре." #NT!
 nd_hau_school_upkeep: "Содержание школы" #NT!
 nd_hau_school_upkeep_desc: "Расходы на содержание школ цангая, включая бумагу и письменные принадлежности для обучения, ткань для одежды ученых и пчелиный воск для ламп, используемых во время вечерних занятий." #NT!
 nd_hau_council_upkeep: "Администрация Совета" #NT!
 nd_hau_council_upkeep_desc: "Административные расходы на содержание совета Сараута, включая бумагу для ведения учета, ткань для официальной одежды и прекрасную ткань для церемониальных назначений в зале совета." #NT!
 nd_hau_zango_upkeep: "Содержание Занго" #NT!
 nd_hau_zango_upkeep_desc: "Эксплуатационные расходы на содержание торгового сообщества диаспоры хауса, включая расходы на местных торговцев." #NT!
 nd_hau_tanning_process: "Процесс загара" #NT!
 nd_hau_tanning_process_desc: "Дубление шкур до получения эластичной кожи с использованием традиционных методов багарува, усовершенствованных мастерами маджема." #NT!
 nd_hau_blacksmith_tradition: "Хауса Металлообработка" #NT!
 nd_hau_blacksmith_tradition_desc: "Традиционные кузнецы хауса куют из железа и дерева сельскохозяйственные инструменты, оружие и доспехи." #NT!
 nd_hau_indigo_processing: "Обработка Индиго" #NT!
 nd_hau_indigo_processing_desc: "Переработка красителя индиго и необработанных волокон в тонкую окрашенную ткань в коммерческих масштабах для экспорта через Сахель." #NT!
 nd_hau_cotton_weaving: "Хлопковое ткачество Хауса" #NT!
 nd_hau_cotton_weaving_desc: "Производство тонких хлопчатобумажных тканей с использованием традиционных техник ткачества и крашения хауса." #NT!
 nd_hau_refined_leatherwork: "Изысканная кожаная работа" #NT!
 nd_hau_refined_leatherwork_desc: "Передовая обработка шкур для производства изысканных кожаных изделий прославила ремесленников хауса на торговых путях Африки." #NT!
 nd_hau_grain_processing: "Переработка зерна в Сахеле" #NT!
 nd_hau_grain_processing_desc: "Переработка злаков Сахеля в пиво, основной напиток, который поддерживает как города, так и кавалерийские гарнизоны Хаусаланда." #NT!
 nd_hau_lifida_armoring: "Лифида Бронирование" #NT!
 nd_hau_lifida_armoring_desc: "Производство многослойных стеганых хлопчатобумажных доспехов и кольчужной арматуры для тяжелой кавалерии Ян Лифида, сочетая местное текстильное ремесло с импортными изделиями из железа." #NT!
 nd_hau_military_provisioning: "Военное снабжение" #NT!
 nd_hau_military_provisioning_desc: "Организованное снабжение продовольствием и фуражом постоянных вооруженных сил, гарантирующее, что армии и их средства передвижения остаются в боевой готовности." #NT!
 levy_nd_hau_yan_lifida: "Ян Лифида Леви" #NT!
 levy_nd_hau_yan_lifida_desc: "Благородная кавалерия, набранная из аристократии хауса, ездящая на бронированных лошадях и носящая характерные стеганые доспехи лифида с кольчугой." #NT!
 levy_nd_hau_yan_bindiga: "Ян Биндига Леви" #NT!
 levy_nd_hau_yan_bindiga_desc: "Мушкетерская пехота, набранная из рядовых солдат, вооруженная огнестрельным оружием, приобретенным через транссахарские торговые сети." #NT!
 STATIC_MODIFIER_NAME_nd_hau_political_centralization: "Политическая централизация" #NT!
 STATIC_MODIFIER_DESC_nd_hau_political_centralization: "Реформы Мухаммеда Румфы концентрируют власть в руках суда Сарки, создавая более эффективную администрацию, которая может управлять сложными делами растущего государства." #NT!
 nd_hau_formed_tt: "Хаусаленд был основан" #NT!
 nd_hau_path_a_tt: "Выбрать Стены Амины" #NT!
 nd_hau_path_b_tt: "Выбрал перекресток Сахеля" #NT!
 nd_hau_destiny: "Судьба Хаусаленда" #NT!
 nd_hau_destiny_desc: "Хауса Баквай объединены под одним знаменем. Теперь мы должны доказать, что этот союз был не случайностью истории, а началом чего-то большего. Стабильность и порядок – первые требования." #NT!
 nd_hau_dest_sword_1: "Меч движется на юг и север" #NT!
 nd_hau_dest_sword_1_desc: "Следуя традициям королевы Амины, мы расширим наши владения за пределы центра хауса. Королевства Нупе на юге и туареги Воздуха на севере должны признать наше превосходство." #NT!
 nd_hau_dest_sword_2: "Завоевание Борну и Ойо" #NT!
 nd_hau_dest_sword_2_desc: "Великие конкурирующие королевства Борну и Ойо являются единственным препятствием на пути гегемонии хауса в западном Судане. Их столицы должны перейти в руки наших армий." #NT!
 nd_hau_dest_sword_3: "Империя Сахеля" #NT!
 nd_hau_dest_sword_3_desc: "От Тимбукту до Бенина, от излучины Нигера до южных лесов империя хауса объединит западный Судан под одной короной. Это кульминация видения Амины." #NT!
 nd_hau_dest_caravan_1: "Хлопок и караваны" #NT!
 nd_hau_dest_caravan_1_desc: "Наше богатство начинается с хлопковых полей и красильных ям, которые прославили ткань Кано на всем континенте. Мы должны обеспечить, чтобы хлопок поступал через наши рынки и чтобы наша казна была полна." #NT!
 nd_hau_dest_caravan_2: "Перекресток империй" #NT!
 nd_hau_dest_caravan_2_desc: "Хаусаленд расположен на пересечении всех основных торговых путей в западном Судане. Охватывая новые финансовые институты и развивая наши города, мы можем стать коммерческим сердцем Африки." #NT!
 nd_hau_dest_caravan_3: "Большой рынок" #NT!
 nd_hau_dest_caravan_3_desc: "Пусть о Кано и Кацине говорят наряду с крупнейшими рынками мира. Когда соль из Сахары течет через наши рынки и наша казна переполнена, мы построим коммерческую империю, которая переживет любого завоевателя." #NT!
 nd_hau.4.t: "Судьба Хаусаленда" #NT!
 nd_hau.4.d: "Семь истинных государств объединены, и единый Сарки правит из величайшего города западного Судана. Но единство – это только начало. Мир за нашими стенами огромен, и путь, который мы выберем сейчас, будет определять судьбу нашего народа на многие поколения. Фундамент заложен. Теперь нам надо строить." #NT!
 nd_hau.4.a: "Наша судьба начинается сегодня." #NT!
 nd_hau.5.t: "Нупе и Эйр Submit" #NT!
 nd_hau.5.d: "Наша кавалерия двинулась на юг к берегам Нигера и на север к оазисам Эйра. Принцы нупе и вожди туарегов усвоили то, чему королева Амина учила своих предков столетия назад: хауса едут, куда хотят, а те, кто сопротивляется, сломлены. Торговые пути на юг и караванные пути на север теперь проходят через территорию, находящуюся под нашей защитой." #NT!
 nd_hau.5.a: "Меч открывает все дороги." #NT!
 nd_hau.6.t: "Падение Борну и Ойо" #NT!
 nd_hau.6.d: "Два великих соперничающих королевства, которые веками теснили Хаусаленд, оказались подчинёнными. Нгазаргаму, крепость-столица империи Борну, открыла свои ворота нашим войскам. На западе великий город Ойо-Иле, резиденция алаафинов, признает верховенство хауса. Мы являемся доминирующей державой западного Судана. Как мы будем управлять этими завоеваниями?" #NT!
 nd_hau.6.a: "Правило посредством дани и признания." #NT!
 nd_hau.6.b: "Сковайте побежденных в единую армию." #NT!
 nd_hau.7.t: "Империя Сахеля" #NT!
 nd_hau.7.d: "От древних библиотек Тимбукту до бронзовых мастерских Бенина, от научных мечетей Дженне до огромных рынков Кано — империя хауса теперь простирается по всему западному Судану. Ни одна держава не управляла такой территорией в Западной Африке со времен Сонгая и Мали. Мы осуществили замысел королевы Амины и превзошли его во сто крат. Как история запомнит это достижение?" #NT!
 nd_hau.7.a: "Мы будем мудро управлять этой империей." #NT!
 nd_hau.7.b: "Завоевание никогда не заканчивается." #NT!
 nd_hau.8.t: "Хлопковая дорога" #NT!
 nd_hau.8.d: "Рынки Кано переполнены хлопком: сырым с полей, спряденным в нити, сотканным из ткани и окрашенным в глубокий цвет индиго, который стал нашей торговой маркой. Караваны везут наши ткани на север через Сахару и на юг, в лесные королевства. Богатство, которое течет через наши руки, доказывает, что тюк хлопка может стоить больше, чем захваченный город. Наша казна растет, а вместе с ней и наше влияние." #NT!
 nd_hau.8.a: "Богатство – самая истинная сила." #NT!
 nd_hau.9.t: "Расцвет Перекрестка" #NT!
 nd_hau.9.d: "Хаусаленд стал тем, чем всегда обещала его география: незаменимым перекрестком западноафриканской торговли. Через наши города проходит каждый караван из Сахары, каждый торговый конвой из лесополосы, каждый торговец, ищущий золото, соль, кожу или ткани. Наши банковские учреждения стали зрелыми, наши рынки развиты, а наши города богатеют благодаря потоку товаров. Во что мы будем инвестировать?" #NT!
 nd_hau.9.a: "Инвестируйте в наших торговцев и рынки." #NT!
 nd_hau.9.b: "Инвестируйте в ученых и дипломатические связи." #NT!
 nd_hau.10.t: "Большой рынок Кано" #NT!
 nd_hau.10.d: "Говорят, что все в мире можно купить на огромном рынке Кано: соль из Сахары, колу из лесов, кожу, обработанную настолько хорошо, что европейцы называют ее марокканской кожей, не зная, что ее производят на наших кожевенных заводах, ткани, окрашенные в глубокий цвет индиго, железные инструменты, лошадей, книги и товары из стран, о которых большинство людей никогда не слышало. Наша коммерческая империя является предметом зависти Африки. Как нам использовать это богатство?" #NT!
 nd_hau.10.a: "Расширьте наш коммерческий охват." #NT!
 nd_hau.10.b: "Станьте покровителями образования и искусства." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_conqueror_of_nations: "Завоеватель народов" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_conqueror_of_nations: "Подчинение соперничающих королевств власти хауса дало нам опыт управления покоренными народами и сбора дани." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_iron_discipline: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_iron_discipline: "Постоянные боевые действия на границах закалили наши войска и научили наших командиров искусству содержания укреплений с минимальными затратами." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_sahelian_imperium: "Сахельская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_sahelian_imperium: "Управление огромной сахельской империей требует сложной разведывательной сети и способности быстро проецировать власть. Цена империи — вечная бдительность." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_eternal_conquest: "Вечное завоевание" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_eternal_conquest: "Военная машина хауса стала самоподдерживающимся двигателем экспансии, вербующим новых солдат по мере завоевания провинций. Дипломатия – это второстепенная мысль." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_merchant_princes: "Крупные торговые дома Кано и Кацина вложили значительные средства в производство хлопка, используя свое богатство для формирования политики. Военные расходы остаются небольшими." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_scholarly_exchange: "Научный обмен" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_scholarly_exchange: "Поток ученых и дипломатов через города хауса укрепил наши связи с остальным миром и принес новые знания нашим дворам." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_emporium_of_africa: "Торговый центр Африки" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_emporium_of_africa: "Хаусаленд стал незаменимым торговым центром Западной Африки, его купцы и дипломаты приветствуются при каждом дворе, его рынки привлекают торговцев со всего известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_hau_dest_patron_of_learning: "Покровитель обучения" #NT!
 STATIC_MODIFIER_DESC_nd_hau_dest_patron_of_learning: "Инвестиции в стипендию и исламское обучение расширили наш кругозор и углубили наше понимание мира, хотя наша военная готовность несколько пострадала." #NT!
 nd_hau_gidan_sarki: "Гидан Сарки" #NT!
 nd_hau_gidan_sarki_desc: "Императорский дворец Сарки всего Хаусаленда, великолепный комплекс, сочетающий в себе величие королевского двора с военной командной инфраструктурой, необходимой для управления континентальной империей. Его стены перекликаются с авторитетом наследников Амины." #NT!
 nd_hau_gidan_sarki_upkeep: "Администрация дворца" #NT!
 nd_hau_gidan_sarki_upkeep_desc: "Расходы на содержание императорского дворца, включая вооружение королевской гвардии, прекрасную ткань для торжественных случаев и бумагу для бюрократии." #NT!
 nd_hau_fatauci_house: "Дом Фатаучи" #NT!
 nd_hau_fatauci_house_desc: "Большой торговый зал фатаучи, главного торговца торговой сети хауса. Из этого здания координируются огромные караванные пути, простирающиеся от Сахары до лесов, заключаются сделки и подсчитываются богатства народов." #NT!
 nd_hau_fatauci_operations: "Деятельность Торгового Дома" #NT!
 nd_hau_fatauci_operations_desc: "Повседневная деятельность Дома Фатаучи требует ткани для упаковки торговых товаров, сахарской соли в качестве средства обмена и бумаги для ведения коммерческого учета." #NT!
  
  # ===== BUREAUCRACIES ===== 
 hau_sarauta_bureaucracy: "Совет Сараута" #NT!
 hau_sarauta_bureaucracy_desc: "Разрядная группа титулованных должностных лиц, окружавшая сарки хауса бирни: Галадима в качестве администратора столицы и старшего советника; Мадаваки как командующий кавалерией; вазири в качестве президента совета; Саркин Яки в качестве фельдмаршала; Магаджин Гари и май унгува в качестве старейшин прихода. Титулы были назначающими, а не строго наследственными, и совет девяти создателей королей (в Кано, Тара-та-Кано) утверждал каждого нового сарки из числа подходящих принцев. Система дала государству хауса действующую аристократию без права первородства, но она также держала правителя в постоянной зависимости от согласия его великих титулованных людей." #NT!
 hau_alkali_court_bureaucracy: "Щелочной суд" #NT!
 hau_alkali_court_bureaucracy_desc: "Главный судья (щелочной алкалай) возглавлял иерархию Малики кади, чьи суды выносили решения по вопросам наследования, контрактов, семьи и вакфа в соответствии с Мухтасаром Халила ибн Исхака и Рисалой Ибн Аби Зайда. Юриспруденция Малики достигла городов хауса через ученых Вангара в пятнадцатом веке и благодаря связям Кацины с традицией Санкоре Тимбукту; при Мухаммаду Корау (ок. 1445–1493 гг.) Кацина стала основным центром исламской юридической науки в Хаусаленде. Алкативные суды действовали параллельно с правосудием сараута для немусульман, создавая продуктивное напряжение, которое продолжалось до джихада." #NT!
 hau_kano_chronicle_bureaucracy: "Офис хроники Кано" #NT!
 hau_kano_chronicle_bureaucracy_desc: "Постоянно обновляемая династическая хроника на арабском языке, хранящаяся при дворе Сарки, в которой перечислены все правители Кано, начиная с легендарного Багауда (ок. 999 г.), с указанием даты вступления на престол, военных подвигов и великих событий правления. Хроника была не пассивной записью, а рабочим инструментом легитимности, который читался при каждом новом сооружении и с которым проводились консультации для решения вопросов ранга и старшинства. Через баквай к ней присоединились сестринские хроники (Кацинская хроника, Песнь о Багауде, Вангарская хроника, Раудат ал-афкар). Однажды укрепившийся авторитет хроники трудно отбросить, даже если ее переписчики стали неосторожными." #NT!
 hau_wangara_diaspora_bureaucracy: "Вангарава Компакт" #NT!
 hau_wangara_diaspora_bureaucracy_desc: "Постоянное присутствие купцов-ученых Сонинке-Вангара на больших рынках хауса, чьи караваны связывали Хаусаленд с излучиной реки Нигер, соляными копями Тагазы и кольскими лесами Гонджи. В «Хрониках Кано» записано, что при Сарки Яджи (1349–1385 гг.) Вангарава, возможно, около ста шестидесяти человек под руководством шейха Абдуррахмана Зайте, поселились в Кано и принесли с собой ислам. Их преемники закрепили Кацину и Кано как саракуман касува («короли рынка»), выступая в качестве коммерческих агентов, ростовщиков и наемных священнослужителей. Договор основан на легком налогообложении и судебной защите иностранных торговцев; коренная знать хауса возмущалась каждой уступкой." #NT!
 hau_birnin_walls_bureaucracy: "Орден Бирнина" #NT!
 hau_birnin_walls_bureaucracy_desc: "Порядок города-крепости, согласно которому огромные земляные валы хауса биране окружали королевский дворец, центральный рынок и густонаселенные районы, находящиеся под властью глав приходов (mai unguwa). Стены Кано, строительство которых началось при Гидзимасу (1095–1134 гг.) и было завершено при Канаджеджи, местами возвышались на десять-двенадцать метров и считались одними из крупнейших в Африке. Бирнин Заззау, частично приписываемый царице Зарии Амине (ок. 1576 г.), и стены Кацины и Дауры сохранили модель. Май унгува сообщила о налогах, набрала ополчение и охраняла ворота по ночам, превратив укрепленный корпус в действующий гражданский порядок." #NT!
 hau_maguzawa_compact_bureaucracy: "Магузава Компакт" #NT!
 hau_maguzawa_compact_bureaucracy_desc: "Неписаное соглашение, согласно которому немусульманским деревням хауса (магузава, «тех, кто бежал» от обращения в христианство пятнадцатого века) было разрешено сохранять свои святыни бори, свои исконные вожди и свои сезонные фестивали в пределах биране, управляемого мусульманами. Взамен они платили дань зерном, тканью и железом, а также поставляли рекруты на войны сарки. Договор был прочным: он пережил исламизацию судов, появление щелочных судов и долгие войны Борну. Только джихад Сокото 1804 года, который классифицировал магузаву как отступников, а не как зимми, положил этому конец." #NT!
  
 AUTO_MODIFIER_NAME_nd_hau_bureaucracy_authority: "Бакава из Бирни" #NT!
 AUTO_MODIFIER_DESC_nd_hau_bureaucracy_authority: "Бакава (большие титулованные учреждения города-государства хауса, от галадимы столицы до маи унгува каждого округа) превратились в постоянный институциональный аппарат. Сарки теперь могут поддерживать суды, хроники и торговые договоры, которые отличают настоящего бирни от сельского вождя." #NT!
