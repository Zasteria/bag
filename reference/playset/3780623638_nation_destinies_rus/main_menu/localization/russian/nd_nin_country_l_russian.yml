l_russian:
 NIN: "Ассирийская империя" #NT!
 NIN_ADJ: "ассирийский" #NT!
 NIN_f: "Ассирийская империя" #NT!
 NIN_f_desc: "Атур возродился. Там, где Восточный Патриархат и монашеские сети Тур Абдина обеспечивают политическую преемственность, имперский шаблон Саргонидов обеспечивает форму: Ниневия как столица, профессиональная постоянная армия, арамейская государственная служба и администрация депортации и интеграции, которая когда-то связывала Вавилон, Левант и Мемфис под одной короной. Вот как могла бы выглядеть Неоассирийская империя, если бы она пережила католикат Селевкии-Ктесифон, контрфактическое возрождение пика 671 г." #NT!
