l_russian:
 STATIC_MODIFIER_NAME_nd_spa_universal_monarchy: "Универсальная монархия" #NT!
 STATIC_MODIFIER_DESC_nd_spa_universal_monarchy: "Испания выступает защитником христианского мира, ее tercios — лучшими солдатами Европы, а ее вера — непоколебимым фундаментом охватывающей весь мир империи." #NT!
 STATIC_MODIFIER_NAME_nd_spa_empire_of_the_indies: "Империя Индии" #NT!
 STATIC_MODIFIER_DESC_nd_spa_empire_of_the_indies: "От Севильи до Манилы флоты Испании объединяют глобальную коммерческую империю, ее гавани изобилуют богатствами двух полушарий." #NT!
 nd_spa.1.t: "Рождение Испании" #NT!
 nd_spa.1.d: "Короны объединены, мавры изгнаны из своего последнего оплота, а знамя Испании реет над землями, которые наши предки едва могли себе представить. В Севилье и Вальядолиде, в Барселоне и Толедо народы Иберии смотрят на общую судьбу. Однако путь вперед перед нами разделяется. Будет ли Испания мечом католической Европы, наша терция — ужасом еретиков и неверных, наша инквизиция — гарантом православия, наш король — защитником всемирного христианского порядка? Или нам стоит посмотреть на запад, где наши каравеллы нашли Новый Мир с невообразимыми богатствами, построив не просто королевство, но глобальную империю торговли, колоний и флотов с сокровищами, которые сделают Севилью центром мира?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_spa.1.a: "Мы — меч христианского мира." #NT!
 nd_spa.1.b: "Богатство Индии будет нашим." #NT!
 STATIC_MODIFIER_NAME_nd_spa_reconquista_triumphant: "Триумфальная Реконкиста" #NT!
 STATIC_MODIFIER_DESC_nd_spa_reconquista_triumphant: "Семисотлетняя борьба за Иберию выиграна. Христианское оружие победило, и пыл крестового похода пылает ярко." #NT!
 STATIC_MODIFIER_NAME_nd_spa_convivencia_legacy: "Наследие Конвивенсии" #NT!
 STATIC_MODIFIER_DESC_nd_spa_convivencia_legacy: "Столетия сосуществования христианских, мусульманских и еврейских общин оставили Испанию резервуаром разнообразных знаний и культурной сложности." #NT!
 nd_spa.2.t: "Падение Гранады" #NT!
 nd_spa.2.d: "Во второй день января Боабдил, последний эмир Гранады, передал ключи от Альгамбры католическим монархам Фердинанду и Изабелле. Семь веков Реконкисты завершились. На каждой башне Иберии выбит мавританский полумесяц, замененный крестом и знаменем Кастилии и Арагона. На улицах Гранады верующие празднуют шествия и Te Deums. И все же, несмотря на ликование, остается вопрос. Завоеванное мавританское и еврейское население обладает навыками, знаниями и торговыми сетями, которые на протяжении поколений обогащали Иберию. Должны ли мы двигаться вперед с религиозной чистотой, изгоняя или обращая всех, кто не разделяет истинную веру, или сохранять интеллектуальное наследие convivencia, традицию сосуществования, которая сделала Аль-Андалус маяком обучения?" #NT!
 nd_spa.2.a: "Чистота веры превыше всего." #NT!
 nd_spa.2.b: "Сохраняйте мудрость сосуществования." #NT!
 STATIC_MODIFIER_NAME_nd_spa_tercio_combined_arms: "Терсио: общевойсковая доктрина" #NT!
 STATIC_MODIFIER_DESC_nd_spa_tercio_combined_arms: "Терсио сражаются как единый организм: пикинеры прикрывают аркебузиров, мечники закрывают бреши, каждый человек доверяет формированию свою жизнь." #NT!
 STATIC_MODIFIER_NAME_nd_spa_tercio_expeditionary: "Терцио: Экспедиционная доктрина" #NT!
 STATIC_MODIFIER_DESC_nd_spa_tercio_expeditionary: "Испанские терции научились сражаться вдали от дома, на болотах Фландрии, в горах Италии, в лесах Нового Света, адаптируя свою тактику к любой местности." #NT!
 nd_spa.3.t: "Великая капитанская революция" #NT!
 nd_spa.3.d: "Во время итальянских войн Гонсало Фернандес де Кордова, Эль Гран Капитан, изменил военное искусство. В то время как другие армии полагаются на массы копейщиков или дорогую наемную кавалерию, Кордова создала новый тип формирования: терцио. Три тысячи человек, пикинеры, фехтовальщики, вооруженные устрашающими эспада ропера, и аркебузиры, тренируются вместе, как единое общевойсковое подразделение. При Чериньоле в 1503 году это революционное формирование разгромило французскую жандармерию, доказав, что дисциплинированная пехота может победить лучшую тяжелую кавалерию в Европе. Терсио будет доминировать на европейских полях сражений в течение следующих полутора столетий. Должны ли мы усовершенствовать терсио как общевойсковой инструмент шока и дисциплины или отточить его для долгих маршей и далеких кампаний, которых требует обширная испанская империя?" #NT!
 nd_spa.3.a: "Совершенствуйте искусство общевойскового боя." #NT!
 nd_spa.3.b: "Создавайте солдат, которые смогут сражаться где угодно." #NT!
 STATIC_MODIFIER_NAME_nd_spa_treasure_fleet_monopoly: "Монополия на королевские сокровища" #NT!
 STATIC_MODIFIER_DESC_nd_spa_treasure_fleet_monopoly: "Вся колониальная торговля протекает через Casa de Contratacion в Севилье. Монополия Короны гарантирует, что каждая унция серебра и каждый тюк индиго обогащают королевскую казну." #NT!
 STATIC_MODIFIER_NAME_nd_spa_treasure_fleet_commerce: "Свободная торговля Индии" #NT!
 STATIC_MODIFIER_DESC_nd_spa_treasure_fleet_commerce: "Ослабляя монополию и позволяя более широкое участие в колониальной торговле, торговля Индии течет более свободно, обогащая купцов и производителей по всей Испании." #NT!
 nd_spa.4.t: "Флот сокровищ" #NT!
 nd_spa.4.d: "Дважды в год собираются огромные конвои: «Флота Индии» отправляется из Севильи в порты Веракрус, Портобело и Картахена и возвращается с грузом серебра Потоси, золота Новой Гранады, индиго и кошенили Мексики. Casa de Contratacion контролирует каждый грузовой манифест, каждый список пассажиров, каждый реал серебра, проходящий через набережную Севильи. Это величайшая организованная система трансокеанской торговли, которую когда-либо видел мир. Однако монополия, которая делает его прибыльным, одновременно делает его жестким. Купцы в Кадисе и Барселоне агитируют за право свободной торговли с колониями. Сохраним ли мы железный контроль Короны над колониальной торговлей, максимизируя королевские доходы, но ограничивая частное предпринимательство, или же откроем торговлю для более широкого участия, соглашаясь на более низкие доходы Короны в обмен на более динамичную экономику?" #NT!
 nd_spa.4.a: "Монополия Короны абсолютна." #NT!
 nd_spa.4.b: "Позвольте коммерции течь свободно." #NT!
 nd_spa_reconquista_fortress_tradition: "Традиция крепости Реконкисты" #NT!
 nd_spa_reconquista_fortress_tradition_desc: "Столетия приграничных войн создали сеть укрепленных замков, алькасаров, кастильо и башен, которые определили иберийский военный ландшафт." #NT!
 nd_spa_mesta_privilege: "Места Привилегия" #NT!
 nd_spa_mesta_privilege_desc: "Почетный совет Месты имеет королевскую хартию на перегон своих стад по древним отгонным маршрутам Кастилии, Canadas Reales." #NT!
 nd_spa_military_orders: "Иберийские военные ордена" #NT!
 nd_spa_military_orders_desc: "Ордены Сантьяго, Калатравы и Алькантары, воины-монахи, которые охраняли границу и чьи Великие Магистры управляли обширными поместьями и верными рекрутами." #NT!
 nd_spa_fueros_and_cortes: "Фуэрос и Кортес" #NT!
 nd_spa_fueros_and_cortes_desc: "Fueros предоставляют местные свободы и привилегии, в то время как ассамблеи кортесов Кастилии, Арагона и Каталонии дают право голоса сословиям королевства." #NT!
 nd_spa_jinete_tradition: "Хинете Традиция" #NT!
 nd_spa_jinete_tradition_desc: "Хинеты, легкие кавалеристы, едущие в стиле джинета с короткими стременами и легкими копьями, являются типичными иберийскими всадниками, наследниками традиций, разделяемых христианскими и мавританскими наездниками." #NT!
 nd_spa_burgos_wool_market: "Рынок шерсти в Бургосе" #NT!
 nd_spa_burgos_wool_market_desc: "Крупные ярмарки шерсти в Бургосе направляют шерсть кастильского мериноса на ткацкие станки Фландрии и Италии, делая шерсть первым крупным экспортным товаром Испании." #NT!
 nd_spa_catholic_monarchs: "Католические монархи" #NT!
 nd_spa_catholic_monarchs_desc: "Фердинанд Арагонский и Изабелла Кастильская объединили короны, подчинили дворянство, реформировали администрацию и направили Испанию на путь к империи." #NT!
 nd_spa_reconquista_culmination: "Кульминация Реконкисты" #NT!
 nd_spa_reconquista_culmination_desc: "Падение Гранады в 1492 году завершило многовековое завоевание христианами Пиренейского полуострова у мусульман." #NT!
 nd_spa_inquisition: "Испанская инквизиция" #NT!
 nd_spa_inquisition_desc: "Основанная в 1478 году, инквизиция служила инструментом Короны для обеспечения религиозного соответствия и искоренения ереси, распространяя свое влияние на все испанские территории." #NT!
 nd_spa_iberian_exploration: "Иберийские исследования" #NT!
 nd_spa_iberian_exploration_desc: "Испанские мореплаватели вышли за пределы известного мира, Колумб — на запад, Магеллан — по всему земному шару, руководствуясь достижениями в картографии, астрономии и кораблестроении." #NT!
 nd_spa_medina_del_campo: "Медина-дель-Кампо Ярмарки" #NT!
 nd_spa_medina_del_campo_desc: "Великие ярмарки Медины-дель-Кампо привлекали купцов со всей Европы, став одним из главных центров банковского дела, обмена и международной торговли на континенте." #NT!
 nd_spa_rise_of_the_tercio: "Восстание Терцио" #NT!
 nd_spa_rise_of_the_tercio_desc: "Терсио, революционное общевойсковое пехотное формирование Испании, состоящее из пикинеров, фехтовальщиков и аркебузиров, доминировало на европейских полях сражений от Чериньолы до Рокруа." #NT!
 nd_spa_colonial_trade_infrastructure: "Колониальная торговая инфраструктура" #NT!
 nd_spa_colonial_trade_infrastructure_desc: "Casa de Contratacion в Севилье регулировал всю торговлю с Индией, лицензируя суда, проверяя грузы, обучая мореплавателей и направляя богатства империи." #NT!
 nd_spa_mission_system: "Система миссий" #NT!
 nd_spa_mission_system_desc: "Францисканские, доминиканские и иезуитские миссионеры создали обширную сеть миссий по всей Америке, обращая коренные народы и расширяя испанское культурное влияние." #NT!
 nd_spa_galley_fleet: "Средиземноморский галерный флот" #NT!
 nd_spa_galley_fleet_desc: "Испанские галерас-реалы патрулировали Средиземное море, защищая торговые пути, сражаясь с османскими корсарами и распространяя арагонско-каталонскую мощь от Барселоны до Неаполя." #NT!
 nd_spa_treasure_fleet_system: "Система флота сокровищ" #NT!
 nd_spa_treasure_fleet_system_desc: "Flota de Indias, организованные конвои, курсировавшие между Севильей, Карибским морем и Тихим океаном, представляли собой величайшую систему трансокеанской торговли в раннем современном мире." #NT!
 nd_spa_spanish_galleon: "Испанский галеон" #NT!
 nd_spa_spanish_galleon_desc: "Галеон, спроектированный в 1550-х годах Педро Менендесом де Авилесом и Альваро де Базаном, сочетал в себе тяжелое вооружение и грузоподъемность, служа одновременно военным кораблем и перевозчиком сокровищ." #NT!
 nd_spa_potosi_silver: "Потоси Серебряный Эконом" #NT!
 nd_spa_potosi_silver_desc: "Серебряные рудники Потоси и Сакатекас хлынули потоком драгоценного металла в испанскую казну, финансируя армии и флоты и одновременно изменяя мировую экономику." #NT!
 nd_spa_manila_galleon: "Маршрут манильского галеона" #NT!
 nd_spa_manila_galleon_desc: "С 1565 года Манильский галеон связывал Акапулько с Филиппинами, доставляя китайский шелк, фарфор и специи на запад, а американское серебро — на восток через Тихий океан." #NT!
 nd_spa_armada_tradition: "Армада Традиция" #NT!
 nd_spa_armada_tradition_desc: "Испания содержала самый большой военно-морской флот в Атлантике, ее армады сопровождали флоты с сокровищами, проецировали мощь через океаны и охраняли подступы к империи.\n\n#italic Доступно в: $nd_spa_casa_de_contratacion$#!" #NT!
 nd_spa_bourbon_arsenal_reforms: "Реформы Бурбонского арсенала" #NT!
 nd_spa_bourbon_arsenal_reforms_desc: "Династия Бурбонов основала Королевские фабрики по производству оружия, судостроения, стекла и фарфора, финансируемые государством мануфактуры для модернизации промышленной базы Испании." #NT!
 nd_spa_infanteria_de_marina: "Инфантерия де Марина" #NT!
 nd_spa_infanteria_de_marina_desc: "Испанская морская пехота, основанная в 1537 году как Терсио де Галерас, является старейшим корпусом морской пехоты в мире, сражающимся на борту военных кораблей и участвующим в десантных операциях по всему миру." #NT!
 nd_spa_bourbon_centralization: "Централизация Бурбона" #NT!
 nd_spa_bourbon_centralization_desc: "Декреты Новой Планты отменили отдельные законы Арагона, Валенсии и Каталонии, заменив их кастильской администрацией и создав централизованное унитарное государство." #NT!
 nd_spa_colonial_plantations: "Система колониальных плантаций" #NT!
 nd_spa_colonial_plantations_desc: "Испанские колониальные гасиенды и плантации производили табак, сахар, какао и индиго для европейских рынков, поддерживая трансатлантическую экономику." #NT!
 nd_spa_cadiz_constitution: "Конституция Кадиса" #NT!
 nd_spa_cadiz_constitution_desc: "Конституция 1812 года, разработанная в осажденном Кадисе во время наполеоновского вторжения, провозгласила народный суверенитет, разделение властей и всеобщее избирательное право для мужчин, что стало маяком либерального конституционализма." #NT!
 nd_spa_guerrilla_tradition: "Партизанская традиция" #NT!
 nd_spa_guerrilla_tradition_desc: "Полуостровная война дала миру слово «партизанская», маленькая война. Испанские нерегулярные войска безжалостно преследовали армии Наполеона, доказывая, что народное сопротивление может обескровить сверхдержаву." #NT!
 nd_spa_economic_societies: "Экономические общества" #NT!
 nd_spa_economic_societies_desc: "Sociedades Economicas de Amigos del Pais, Экономические общества друзей страны, способствовали улучшению сельского хозяйства, промышленным инновациям и научному образованию по всей Испании." #NT!
 nd_spa_imperial_legacy: "Имперское наследие" #NT!
 nd_spa_imperial_legacy_desc: "Три столетия управления глобальной империей оставили Испанию непревзойденным опытом колониального управления, дипломатических переговоров и многоконтинентального управления." #NT!
 a_nd_spa_rodelero: "Роделеро" #NT!
 a_nd_spa_rodelero_desc: "Пехота с мечами и баклерами, свирепые бойцы ближнего боя, которые атаковали строем пики, чтобы рубить врага с близкого расстояния, традиция, зародившаяся во время Реконкисты." #NT!
 a_nd_spa_jinete: "Хинете" #NT!
 a_nd_spa_jinete_desc: "Легкие кавалеристы верхом а-ля джинета, короткие стремена, легкие копья, круглые щиты — наследники иберийской конной традиции, разделяемой христианскими и мавританскими всадниками." #NT!
 a_nd_spa_tercio: "Терсио" #NT!
 a_nd_spa_tercio_desc: "Легендарное общевойсковое пехотное соединение Испании: пикинеры, фехтовальщики и аркебузиры сражаются как дисциплинированное целое. Ужас на полях сражений Европы на протяжении более столетия." #NT!
 n_nd_spa_galera_real: "Галера Реал" #NT!
 n_nd_spa_galera_real_desc: "Королевская военная галера испанского средиземноморского флота, более тяжелая и вооруженная, чем стандартные галеры, с солдатским составом для абордажа." #NT!
 n_nd_spa_galleon: "Испанский галеон" #NT!
 n_nd_spa_galleon_desc: "Тяжеловооруженный парусный военный корабль, предназначенный для сопровождения конвоев с сокровищами через Атлантику, сочетающий в себе огромную огневую мощь и значительную грузоподъемность." #NT!
 a_nd_spa_infanteria_de_marina: "Инфантерия де Марина" #NT!
 a_nd_spa_infanteria_de_marina_desc: "Старейший морской пехотный корпус в мире, произошедший от Терсио де Галерас. Специалисты по корабельному бою и морскому десантированию." #NT!
 nd_spa_alcazar: "Алькасар" #NT!
 nd_spa_alcazar_desc: "Укрепленный дворец, сочетающий в себе военную оборону и королевскую администрацию, архитектурное наследие веков приграничных войн между христианским и мавританским королевствами." #NT!
 nd_spa_mesta_sheepwalk: "Места Шипволк" #NT!
 nd_spa_mesta_sheepwalk_desc: "Перевалочная станция на Канадском реале, древних маршрутах отгонного животноводства, по которым миллионы овец-мериносов мигрируют между летними и зимними пастбищами в соответствии с королевской хартией Месты." #NT!
 nd_spa_colonial_mission: "Колониальная миссия" #NT!
 nd_spa_colonial_mission_desc: "Францисканский или доминиканский миссионерский комплекс, церковь, школа, мастерская и общежитие, созданные для обращения и обучения коренных народов Испанской Америки." #NT!
 nd_spa_casa_de_contratacion: "Каса де Контратасьон" #NT!
 nd_spa_casa_de_contratacion_desc: "Дом торговли, учреждение Севильи, регулирующее всю торговлю с Индией, лицензирующее мореплавателей, проверяющее грузы и собирающее долю короны в колониальном богатстве." #NT!
 nd_spa_silver_minting_house: "Чеканка серебра" #NT!
 nd_spa_silver_minting_house_desc: "Королевский монетный двор перерабатывал колониальное серебро в монеты, реалы де очо, монеты по восемь штук, которые стали первой по-настоящему глобальной валютой." #NT!
 nd_spa_royal_foundry: "Королевский литейный завод" #NT!
 nd_spa_royal_foundry_desc: "Спонсируемая государством мануфактура, созданная в рамках реформ Бурбонов, занимающаяся литьем пушек, ковкой оружия и производством техники, поддерживающей военную мощь Испании." #NT!
 nd_spa_camino_real: "Камино Реал" #NT!
 nd_spa_camino_real_desc: "Королевская дорога, часть радиальной дорожной системы Карла III, соединяющей Мадрид со всеми крупными городами, улучшающая торговлю, связь и управление по всему королевству." #NT!
 nd_spa_alcazar_garrison: "Алькасар Гарнизон" #NT!
 nd_spa_alcazar_garrison_desc: "Постоянный гарнизон алькасара, снабженный оружием и продовольствием для защиты крепости и демонстрации королевской власти." #NT!
 nd_spa_merino_wool_processing: "Переработка мериносовой шерсти" #NT!
 nd_spa_merino_wool_processing_desc: "Кастильская мериносовая шерсть, ценимая во всей Европе за свою тонкость, сортируется, очищается и подготавливается для экспорта на ткацкие станки Фландрии и Италии." #NT!
 nd_spa_mission_upkeep: "Операции миссии" #NT!
 nd_spa_mission_upkeep_desc: "Ежедневная работа миссии: преподавание катехизиса, поддержание церкви, обработка полей и производство товаров для окружающего сообщества." #NT!
 nd_spa_trade_house_operations: "Операции Торгового Дома" #NT!
 nd_spa_trade_house_operations_desc: "Ежедневная работа Casa de Contratacion: регистрация судов, проверка манифестов, лицензирование лоцманов и обеспечение соблюдения правил Короны." #NT!
 nd_spa_fleet_provisioning: "Обеспечение флота" #NT!
 nd_spa_fleet_provisioning_desc: "Снабжение Армады веревками, парусиной, дегтем и провиантом, логистической основой океанской военно-морской мощи Испании." #NT!
 nd_spa_silver_minting: "Чеканка серебра" #NT!
 nd_spa_silver_minting_desc: "Колониальное серебро анализируется, очищается и чеканится на королевском монетном дворе, в результате чего получаются легендарные монеты из восьми экземпляров." #NT!
 nd_spa_cannon_founding: "Основание пушки" #NT!
 nd_spa_cannon_founding_desc: "Железо выплавляется и отливается в артиллерийские орудия на Королевском литейном заводе, снабжающем испанскую армию и укрепления современными вооружениями." #NT!
 nd_spa_road_maintenance: "Содержание дорог" #NT!
 nd_spa_road_maintenance_desc: "Бригады рабочих поддерживают мощеные покрытия, мосты и дренаж Камино-Реал, сохраняя артерии королевства открытыми для торговли и курьеров." #NT!
 levy_nd_spa_rodelero: "Роделеро Леви" #NT!
 levy_nd_spa_rodelero_desc: "Бойцы с мечами и баклерами, воспитанные в приграничных иберийских общинах, продолжают традиции ближнего боя Реконкисты." #NT!
 levy_nd_spa_jinete: "Хинете Леви" #NT!
 levy_nd_spa_jinete_desc: "Легкие кавалеристы, поднятые с иберийских границ, едущие в стиле джинета, быстрые, ловкие и смертоносные в перестрелках и преследовании." #NT!
 nd_spa_formed_tt: "была образована Испания." #NT!
 nd_spa_path_a_tt: "Выбрали универсальную монархию" #NT!
 nd_spa_path_b_tt: "Выбрал Индийскую империю" #NT!
  
  # ===== DESTINY TREE LOCALIZATION ===== 
  
  # Advance names and descriptions 
 nd_spa_destiny: "Испанская судьба" #NT!
 nd_spa_destiny_desc: "Испания стоит на перепутье. Корона едина, королевство в безопасности, теперь нас манит великая судьба. Достигните стабильности и определите курс испанской нации." #NT!
 nd_spa_dest_italian_wars: "Итальянские войны" #NT!
 nd_spa_dest_italian_wars_desc: "Богатство и престиж Италии вовлекают Испанию в великую борьбу за полуостров. Захватите Неаполь и Милан, чтобы установить господство Испании над Италией." #NT!
 nd_spa_dest_army_of_flanders: "Армия Фландрии" #NT!
 nd_spa_dest_army_of_flanders_desc: "Досягаемость Испании простирается на север. Возьмите Антверпен, сердце богатейшей провинции Европы, поддержите огромную армию и используйте профессиональную военную организацию." #NT!
 nd_spa_dest_defender_of_christendom: "Защитник христианского мира" #NT!
 nd_spa_dest_defender_of_christendom_desc: "Испания стремится стать универсальным поборником католической веры. Контролируйте Рим, Тунис и Сицилию, сохраняя при этом стабильность и возглавьте весь христианский мир." #NT!
 nd_spa_dest_caribbean_foothold: "Карибский плацдарм" #NT!
 nd_spa_dest_caribbean_foothold_desc: "Новый Свет манит. Создайте базу в Гаване и обеспечьте потоки сахара через ваши рынки, что станет первым шагом на пути к глобальной колониальной империи." #NT!
 nd_spa_dest_pacific_link: "Тихоокеанское соединение" #NT!
 nd_spa_dest_pacific_link_desc: "От Мексики до Манилы проложите величайший торговый путь, который когда-либо видел мир. Контролируйте Теночтитлан и Манилу, соединяя богатства Азии с Америкой." #NT!
 nd_spa_dest_global_empire: "Глобальная Империя" #NT!
 nd_spa_dest_global_empire_desc: "Завершите завоевание величайшей империи коренных народов Америки, развивайте обширные колониальные владения и займитесь производством, чтобы построить империю, охватывающую весь земной шар." #NT!
  
  # Destiny event localization 
 nd_spa.5.t: "Краун Юнайтед" #NT!
 nd_spa.5.d: "Королевства Иберии объединены под единой короной. Реконкиста — живая память, вера сильна, а испанское оружие пользуется уважением во всем христианском мире. Из дворов Толедо и Вальядолида, из портов Барселоны и Севильи формируются амбиции великой нации. Будь то меч верующих или богатства далеких земель, Испания оставит свой след в мире." #NT!
 nd_spa.5.a: "Наша судьба ждет." #NT!
  
 nd_spa.6.t: "Премия Италии" #NT!
 nd_spa.6.d: "Знамена Испании реют над Неаполем и Миланом. То, за что боролись поколения итальянских принцев, французских королей и немецких императоров, теперь находится в руках Испании. Терции маршируют по улицам городов, которые когда-то подчинялись только своим лордам, а испанские наместники управляют богатейшими землями Европы. Италия принадлежит нам, а вместе с ней и ключ к господству в Средиземноморье и европейской гегемонии." #NT!
 nd_spa.6.a: "Италия склоняется перед испанской короной." #NT!
  
 nd_spa.7.t: "Армия Фландрии" #NT!
 nd_spa.7.d: "Испанская дорога, легендарный коридор, протянувшийся от Милана через Савойю и Франш-Конте до Нидерландов, теперь несет на север непрерывный поток людей, денег и боеприпасов. В Антверпене, самом богатом городе Европы, испанские губернаторы контролируют коммерческую империю, соперничающую с колониальной. Армия Фландрии, этот грозный инструмент власти Габсбургов, держит Нидерланды железной хваткой. Однако содержание этой далекой армии требует напряжения даже огромных ресурсов Испании. Совершенствуем ли мы военную машину, вкладывая средства в дисциплину и укрепления? Или использовать наши династические связи, используя дипломатию, чтобы справиться с тем, чего одна сила не может выдержать?" #NT!
 nd_spa.7.a: "Дисциплина и сталь удержат Фландрию." #NT!
 nd_spa.7.b: "Династические узы связывают крепче железа." #NT!
  
 nd_spa.8.t: "Защитник христианского мира" #NT!
 nd_spa.8.d: "От берегов Туниса до холмов Рима, от гаваней Сицилии до крепостей Фландрии, мощь Испании окружает Средиземноморье и доминирует в Европе. Ни один король в христианском мире не командует такими армиями, ни один принц не защищает веру с таким рвением, ни одно королевство не простирается на такие расстояния. Мечта о всемирной христианской монархии, впервые увиденная Карлом V, когда он преклонил колени перед Папой Римским в Болонье, вполне достижима. Будет ли Испания защитником католической ортодоксальности, крестоносной державой, чьи армии являются мечом Церкви? Или мы должны построить империю Габсбургов, династию, чья сеть союзов и владений делает ее арбитром европейских дел?" #NT!
 nd_spa.8.a: "Мы – меч Святой Церкви." #NT!
 nd_spa.8.b: "Дом Габсбургов будет править всем." #NT!
  
 nd_spa.9.t: "Жемчужина Антильских островов" #NT!
 nd_spa.9.d: "Гавана является воротами в Новый Свет, крепостью-портом, где собираются флоты с сокровищами, где сахарный тростник освежает воздух и где богатства двух континентов проходят через руки испанцев. Из этой карибской крепости маршруты расходятся в разные стороны: на юг к богатствам Перу, на запад к серебру Мексики, на восток к ожидающим рынкам Севильи. Колония больше не является экспериментом, это основа глобальной империи." #NT!
 nd_spa.9.a: "Индия – наше право по рождению." #NT!
  
 nd_spa.10.t: "Манильский галеон" #NT!
 nd_spa.10.d: "Невозможное было достигнуто. Испанские корабли теперь пересекают Тихий океан, соединяя серебро Мексики с шелком и специями Азии. В Маниле китайские джонки заполняют гавань рядом с испанскими галеонами, обменивая фарфор и лаковые изделия на американское серебро. Ежегодное прибытие Манильского галеона в Акапулько вызывает ажиотаж в торговле, привлекающий торговцев со всей Америки. Ни одна другая страна не создала такой связи, единого торгового пути, опоясывающего земной шар. Должна ли корона ужесточить контроль над этой океанской монополией, создавая флот, который будет доминировать в Тихом океане? Или же нам следует открыть порты, позволив частному предпринимательству приумножать богатство, которое течет по этому замечательному маршруту?" #NT!
 nd_spa.10.a: "Корона контролирует тихоокеанскую торговлю." #NT!
 nd_spa.10.b: "Откройте порты для всех, кто будет торговать." #NT!
  
 nd_spa.11.t: "Империя, над которой никогда не заходит солнце" #NT!
 nd_spa.11.d: "От Анд до Филиппин, от Карибского моря до Средиземного моря — Испанская империя охватывает все континенты и все океаны. Древние города инков теперь несут знамя Кастилии, и в каждом уголке этого обширного владения укореняются испанские законы, испанская вера и испанский язык. Ни одна империя в истории не управляла таким разнообразием народов на таких расстояниях. Должны ли мы централизовать этого колосса через систему наместников и аудиенций, связывая империю едиными законами и администрацией? Или мы позволим серебру, которое течет из Потоси и Сакатекаса, стать основой экономической мощи Испании, вкладывая богатство империи во флот, укрепления и общественные работы?" #NT!
 nd_spa.11.a: "Один закон, одна вера, одна империя." #NT!
 nd_spa.11.b: "Серебро будет нашей основой." #NT!
  
  # Timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_spa_dest_iron_discipline: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_iron_discipline: "Армия Фландрии непрерывно учится, ее гарнизоны укрепляются, а новобранцы закаляются суровыми условиями службы на севере, хотя внутренняя экономика несет издержки бесконечной войны." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_habsburg_diplomacy: "Габсбургская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_habsburg_diplomacy: "Посредством браков, союзов и тщательного управления династическими притязаниями Габсбурги плетут сеть влияния по всей Европе, хотя каждое новое обязательство втягивает Испанию все глубже в дорогостоящие войны." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_catholic_champion: "Католический Чемпион" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_catholic_champion: "Испания выступает как вооруженный защитник католической веры, ее армии посвящены служению Церкви, ее войны благословлены самим Папой." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_habsburg_imperium: "Габсбургская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_habsburg_imperium: "Династия Габсбургов восседает верхом на Европе, ее престиж не имеет себе равных, а ее дипломатический вес имеет решающее значение в любых переговорах, хотя интеллектуальная жизнь разросшейся империи страдает от требований управления." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_crown_fleet: "Коронный флот" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_crown_fleet: "Королевский флот доминирует на тихоокеанских морских путях, его блокады душат соперников, а его традиции мореплавания не имеют себе равных, хотя одержимость короны океанской торговлей вытягивает ресурсы из родины." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_free_ports: "Свободные порты Индии" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_free_ports: "Открытие колониальных портов для более широкой торговли обеспечивает свободный поток сырья и процветание торговцев, хотя содержание постоянной армии, испытывающей недостаток монопольных доходов, становится все более дорогостоящим." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_centralized_viceroyalties: "Централизованные вице-королевства" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_centralized_viceroyalties: "Система наместников, аудиенций и интендантов связывает империю единым законом. Колониальное население интегрируется, местные чиновники подчиняются короне, а эффективность управления достигает новых высот." #NT!
 STATIC_MODIFIER_NAME_nd_spa_dest_silver_standard: "Серебряный стандарт" #NT!
 STATIC_MODIFIER_DESC_nd_spa_dest_silver_standard: "Богатство Потоси и Сакатекаса направляется на военные корабли, укрепления и общественные работы. Серебро финансирует флот, который доминирует в океанах, и армию, большую, чем может сравниться любой соперник." #NT!
  
  # Building names and descriptions 
 nd_spa_escorial: "Эль Эскориал" #NT!
 nd_spa_escorial_desc: "Великий монастырь-дворец Сан-Лоренцо-де-Эль-Эскориал, одновременно королевская резиденция, монастырь, библиотека и мавзолей, архитектурное воплощение претензий Испании на роль защитника христианского мира." #NT!
 nd_spa_escorial_administration: "Администрация Эскориала" #NT!
 nd_spa_escorial_administration_desc: "Обширная бюрократия монастыря-дворца обрабатывает корреспонденцию со всех уголков империи, его клерки и писцы, одетые в прекрасные ткани, ведут записи всемирной монархии среди богато обставленных залов." #NT!
 nd_spa_real_audiencia: "Реал Аудиенсия" #NT!
 nd_spa_real_audiencia_desc: "Королевский апелляционный суд, высший судебный и административный институт колониального управления, обеспечивающий соблюдение испанского законодательства и прав короны на обширных территориях Индии." #NT!
 nd_spa_audiencia_operations: "Операции Аудиенсии" #NT!
 nd_spa_audiencia_operations_desc: "Ежедневная работа Аудиенсии: рассмотрение дел, запись судебных решений, издание указов и ведение юридической переписки и справочных томов, которые связывают отдаленные провинции с испанской короной, ее судьи облачены в изысканные одежды." #NT!
  
  # ===== BUREAUCRACY UNLOCK ===== 
 AUTO_MODIFIER_NAME_nd_spa_bureaucracy_authority: "Габсбургское соборное правительство" #NT!
 AUTO_MODIFIER_DESC_nd_spa_bureaucracy_authority: "Советы, собравшиеся в Вальядолиде, Мадриде и Севилье, превратились в постоянный государственный аппарат: юристы летрадо, королевские магистраты и уполномоченные трибуналы, связывающие полуостровную Испанию и ее заморские владения волей короля. На этой соборной основе своеобразные институты латиноамериканского управления обретают прочную форму." #NT!
  
  # ===== BUREAUCRACIES ===== 
 spa_consejo_real_bureaucracy: "Совет Реал" #NT!
 spa_consejo_real_bureaucracy_desc: "Реформированный в 1480 году Изабеллой I в кортесах Толедо, Королевский совет Кастилии стал высшим административным и судебным органом королевства, уступающим только монарху. Состоявший из прелата, трех кабальеро и восьми-десяти летрадо из университетов Саламанки и Вальядолида, он лишил крупных магнатов права голоса и проводил повседневные дела управления посредством обязательных консультаций. К 1516 году совет сохранил юрисдикцию только над Кастилией, в то время как Карл I передал другие свои владения параллельным советам, закрепив соборную систему на два столетия." #NT!
  
 spa_casa_de_contratacion_bureaucracy: "Дом Контратасьон" #NT!
 spa_casa_de_contratacion_bureaucracy_desc: "Основанная в Севилье 20 января 1503 года католическими монархами, Торговая палата обладала исключительным правом лицензировать, инспектировать и облагать налогом каждое судно, направляющееся в Индию или из Индии. Трое его чиновников, назначенных короной (контадор, казначей и фактор), регистрировали грузы, обучали лоцманов на Падрон-Реале и переправляли серебро Потоси через единственную севильскую пристань. Поступления от драгоценных металлов выросли с миллиона песо в 1530 году до тридцати пяти миллионов к 1595 году, но бюрократический упадок и продажность чиновников привели это учреждение к церемониальной форме задолго до его переезда в Кадис в 1717 году." #NT!
  
 spa_consejo_de_indias_bureaucracy: "Совет Индии" #NT!
 spa_consejo_de_indias_bureaucracy_desc: "Созданный Карлом V в 1524 году по соборной модели Совета Кастилии, Совет Индии управлял заморской империей Испании от Мадрида до 1834 года. Его шесть-десять королевских назначенцев разрабатывали все колониальные законы, назначались наместниками и судьями-аудиенциями, проверяли резиденции уходящих губернаторов и заседали в качестве верховного апелляционного суда Нового Света. Ни одно крупное предприятие в Индии (кампания, реформа, церковное назначение) не осуществлялось без письменной консультации с королем." #NT!
  
 spa_mesta_bureaucracy: "Онрадо Консехо де ла Места" #NT!
 spa_mesta_bureaucracy_desc: "Получивший привилегию Альфонсо X Кастильского в 1273 году и подтвержденный всеми его преемниками вплоть до 1836 года, Почетный совет Месты управлял огромными отгонными стадами, чья мериносовая шерсть приносила кастильскому экспортному богатству. Каждую весну и осень его члены гоняли своих овец по королевским каньядам, пересекающим королевство; Места имели право выпасать пастбища в каждом городе и лесу вдоль маршрута, а кастильским крестьянам было запрещено ограждать поля на пути стад. Освобождение от налога с продаж в конце XV века возвысило корпорацию и сделало ее крупных владельцев (дома Бехара, Инфантадо и военные ордена) привилегированным интересом, противостоящим любой реформе кастильского сельского хозяйства." #NT!
  
 spa_inquisicion_bureaucracy: "Трибунал дель Санто Официо" #NT!
 spa_inquisicion_bureaucracy_desc: "Уполномоченная Сикстом IV в 1478 году и открытая католическими монархами в 1480 году, Священная канцелярия инквизиции действовала вне папского контроля через четырнадцать местных трибуналов в Кастилии, Арагоне и Индии. Назначенные короной инквизиторы насаждали ортодоксальность conversos и moriscos, судили ведьм и ученых-гуманистов, подвергали цензуре прессу посредством Индекса и проводили аутодафе как публичный театр монархической власти. Конфискация имущества осужденных наполнила королевскую казну, но этот институт разъедал коммерческие сети converso, на которые опиралась кастильская торговля, и охладил открытую интеллектуальную жизнь испанских университетов." #NT!
  
 spa_encomienda_bureaucracy: "Энкомьенда" #NT!
 spa_encomienda_bureaucracy_desc: "Определенная законом в 1503 году, энкомьенда предоставляла конкистадору или поселенцу право собирать дань и труд от определенной индийской общины в обмен на защиту и христианское обучение. Система почти в мгновение ока привела к появлению класса испанских лордов в Новом Свете, но обвинения Лас Касаса и дебаты в Вальядолиде вынудили Карла V обнародовать Новые законы 1542 года, запрещающие новые гранты и отменяющие наследование. Колониальное восстание (убийство вице-короля Нуньеса Вела в Перу) отложило исполнение, и энкомьенда превратилась в ротационный repartimiento: трудовой призыв, администрируемый короной, но повсеместно злоупотребляемый местными чиновниками и приходскими священниками." #NT!
  
 spa_corregimiento_bureaucracy: "Коррегимьенто" #NT!
 spa_corregimiento_bureaucracy_desc: "Королевские магистраты, назначаемые в муниципалитеты Кастилии с 1480 года, коррегидоры набирались исключительно из неблагородных летрадо юридических школ. Каждый коррегидор председательствовал в кабильдо, рассматривал дела первой инстанции, собирал королевские налоги и следил за границей между юрисдикцией короны и иммунитетом церкви, сеньора и дипломированного города. После подавления восстания комунеров в 1520–1521 годах corregimiento стало главным рычагом, с помощью которого корона Габсбургов сломала муниципальную автономию и включила старые города Старой Кастилии в единое управление королевством." #NT!
