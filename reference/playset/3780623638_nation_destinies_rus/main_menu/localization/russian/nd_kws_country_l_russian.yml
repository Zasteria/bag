l_russian:
 KWS: "Килва Султанат" #NT!
 KWS_ADJ: "Килван" #NT!
 KWS_f: "Килва Султанат" #NT!
 KWS_f_desc: "Султанат Килва был самым богатым и могущественным из городов-государств на побережье Суахили, контролировавшим торговлю золотом от внутренних районов юго-восточной Африки до Индийского океана с 12 по 16 века. Объединив торговые города суахили под одним знаменем, правитель может восстановить морскую коммерческую империю Килвы и снова доминировать на торговых путях Индийского океана." #NT!
