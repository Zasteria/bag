l_russian:
 STATIC_MODIFIER_NAME_nd_sil_crossroads_of_crowns: "Перекресток Трех Корон" #NT!
 STATIC_MODIFIER_DESC_nd_sil_crossroads_of_crowns: "Силезия издавна стояла на пересечении польского, чешского и немецкого миров. Вместо того, чтобы раздираться этими конкурирующими притязаниями, мы превратили наше многоэтническое наследие в источник силы, приветствуя поселенцев, выступая посредниками в спорах и управляя посредством компромисса." #NT!
 STATIC_MODIFIER_NAME_nd_sil_linen_and_silver: "Лен и серебряная земля" #NT!
 STATIC_MODIFIER_DESC_nd_sil_linen_and_silver: "Богатство Силезии исходит из станков ее ткачей и недр ее рудников. Наша льняная ткань поступает на рынки Амстердама и Лондона, а силезское серебро и свинец питают монетные дворы Центральной Европы. Это земля, построенная на промышленности и предпринимательстве." #NT!
 nd_sil.1.t: "Герцогство Силезское" #NT!
 nd_sil.1.d: "Разрозненные Силезские герцогства наконец объединились под одним знаменем. На протяжении веков эта земля была разделена между конкурирующими ветвями Пястов, каждый мелкий герцог охранял свой участок долины Одера. Теперь обнесенные крепостями города Бреслау, Швайдниц и Лигниц подчиняются одной власти.\n\nНо какую Силезию мы построим? Наше герцогство находится на перекрестке, где смешиваются польская, богемская и немецкая культуры, в месте множества языков и традиций, где Магдебургское право управляет городами, а силезское белье достигает отдаленных рынков. Должны ли мы принять это разнообразие как нашу определяющую силу, управляя посредством дипломатии и многоэтнической толерантности? Или нам следует обратить внимание на ткацкие станки и шахты, которые всегда были истинным источником богатства Силезии, создавая промышленный центр, который может соперничать с Фландрией и Саксонией?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sil.1.a: "Мы — мост между тремя королевствами." #NT!
 nd_sil.1.b: "Наше богатство соткано из ткани и выкопано из камня." #NT!
 STATIC_MODIFIER_NAME_nd_sil_mongol_resilience: "Устойчивость Легницы" #NT!
 STATIC_MODIFIER_DESC_nd_sil_mongol_resilience: "Память о герцоге Генрихе Благочестивом и его жертве против монгольской орды закаляет наших защитников. То, что было разрушено, было восстановлено сильнее." #NT!
 STATIC_MODIFIER_NAME_nd_sil_mongol_remembrance: "Мученичество Генриха Благочестивого" #NT!
 STATIC_MODIFIER_DESC_nd_sil_mongol_remembrance: "Смерть герцога Генриха в Легнице сделала его христианским мучеником и символом силезского неповиновения. Его жертва принесла паломникам, престижу и возобновлению преданности защите нашей земли." #NT!
 nd_sil.2.t: "Тень Легницы" #NT!
 nd_sil.2.d: "Весной 1241 года монгольские тумены пронеслись по Силезии, как лесной пожар. В Легнице герцог Генрих II Благочестивый собрал все силы, какие мог: силезских рыцарей, братьев тамплиеров, баварских шахтеров, ставших солдатами, и выехал навстречу орде. Бой обернулся катастрофой. Генрих был убит, его голова была выставлена ​​напоказ на монгольском копье. Однако монголы не остались. Повернуты ли они назад из-за своих потерь или призваны на восток после смерти Великого Хана, они отступили, оставив Силезию опустошенной, но непокоренной.\n\nПамять о Легнице горит в сознании силезцев. Должны ли мы почтить жертву Генриха, настолько укрепив нашу оборону, что ни один захватчик никогда больше не сможет ее прорвать? Или нам следует сделать замученного герцога символом нашего вечного неповиновения, сплоченным кличем, привлекающим под наше знамя как воинов, так и паломников?" #NT!
 nd_sil.2.a: "Никогда больше Силезия не падет." #NT!
 nd_sil.2.b: "Жертва Генриха вдохновит поколения." #NT!
 STATIC_MODIFIER_NAME_nd_sil_protestant_zeal: "Силезский протестантский пыл" #NT!
 STATIC_MODIFIER_DESC_nd_sil_protestant_zeal: "Реформация охватила церкви Бреслау со страстью истинного убеждения. Проповеди Иоганна Гесса звучат в каждом приходе, и верующие смотрят на Силезию как на бастион новой веры." #NT!
 STATIC_MODIFIER_NAME_nd_sil_silesian_tolerance: "Силезский религиозный плюрализм" #NT!
 STATIC_MODIFIER_DESC_nd_sil_silesian_tolerance: "В стране, где католический Соборный остров и протестантские торговые кварталы находятся в одном городе, Силезия поняла, что сосуществование порождает процветание. Наши ученые дискутируют свободно, а наши трейдеры приветствуют всех." #NT!
 nd_sil.3.t: "Реформация в Бреслау" #NT!
 nd_sil.3.d: "В 1523 году городской совет Бреслау единогласно назначил пастором церкви Святой Марии Магдалины Иоганна Гесса, студента Виттенберга и близкого друга Меланхтона. За несколько лет почти все церкви Бреслау стали протестантскими, за исключением древнего собора на острове. Город стал маяком Реформации на востоке, привлекая ученых и проповедников со всей Империи.\n\nОднако религиозная география Силезии сложна. Католические ордена все еще удерживают свои монастыри, мистики Швенкфельдера проповедуют в сельской местности, а правители Габсбургов наблюдают за этим протестантским всплеском с растущей тревогой. Примем ли мы Реформацию с евангельским рвением, превратив Бреслау в крепость новой веры? Или же мы последуем силезскому инстинкту приспособления, позволив протестантам и католикам, мистикам и рационалистам сосуществовать в стране, которая всегда процветала благодаря многообразию?" #NT!
 nd_sil.3.a: "Бреслау станет городом истинной веры." #NT!
 nd_sil.3.b: "Пусть все, кто ищет истину, найдут здесь добро." #NT!
 STATIC_MODIFIER_NAME_nd_sil_weavers_concessions: "Ткацкий компакт" #NT!
 STATIC_MODIFIER_DESC_nd_sil_weavers_concessions: "Восстание силезских ткачей заставило нас действовать, но уступки трудящейся бедноте могут оказаться еще более разумным путем. Довольные сотрудники работают быстрее и лучше." #NT!
 STATIC_MODIFIER_NAME_nd_sil_industrial_discipline: "Промышленный заказ" #NT!
 STATIC_MODIFIER_DESC_nd_sil_industrial_discipline: "Восстание ткачей подавлено. В цехах должен поддерживаться порядок, а ткацкие станки не должны молчать. Силезская ткань продолжит поступать на все рынки Европы." #NT!
 nd_sil.4.t: "Восстание силезских ткачей" #NT!
 nd_sil.4.d: "В холмистой местности вокруг Петерсвальдау и Лангенбилау в отчаянной ярости восстали ткачи льна. На протяжении нескольких поколений эти надомные рабочие были основой процветания Силезии, их одежда экспортировалась в Англию, Нидерланды и отдаленные колонии. Но механизированная конкуренция со стороны британских фабрик привела к падению цен, в то время как торговцы сжимают все сильнее. Ткачи, получившие нищенскую зарплату, разбили купеческие дома и уничтожили их бухгалтерские книги.\n\nВосстание подавлено прусскими войсками, но основная напряженность сохраняется. Должны ли мы пойти на уступки работающим беднякам, повысить заработную плату, регулировать условия, признав, что удовлетворенная рабочая сила является продуктивной? Или мы должны восстановить порядок железной рукой, гарантируя, что силезская промышленность сохранит дисциплину и конкурентоспособность на мировом рынке?" #NT!
 nd_sil.4.a: "Даруйте ткачам достоинство, и они будут ткать с гордостью." #NT!
 nd_sil.4.b: "Ткацкие станки Силезии не должны быть остановлены беспорядками." #NT!
 nd_sil_piast_fortifications: "Пястовские укрепления" #NT!
 nd_sil_piast_fortifications_desc: "Силезские герцоги Пясты воздвигли каменные крепости в своих герцогствах, от замка Вроцлава до городищ в предгорьях Судет, создав сеть оборонительных позиций против монголов, гуситов и конкурирующих претендентов." #NT!
 nd_sil_legnica_legacy: "Наследие Легницы" #NT!
 nd_sil_legnica_legacy_desc: "Битва при Легнице в 1241 году определила военную идентичность Силезии. Кавалерийская атака герцога Генриха Благочестивого против монгольского авангарда, хотя и была обречена, продемонстрировала пястовскую традицию конной войны, которая характеризовала силезскую военную культуру." #NT!
 nd_sil_oder_commerce: "Одерская коммерция" #NT!
 nd_sil_oder_commerce_desc: "Река Одер формирует коммерческую основу Силезии, неся зерно, древесину и ткани вниз по течению в балтийские порты и доставляя соль, сельдь и иностранные предметы роскоши вверх по течению на оживленные рынки Бреслау." #NT!
 nd_sil_magdeburg_law: "Силезское Магдебургское право" #NT!
 nd_sil_magdeburg_law_desc: "Герцоги Пястов пригласили немецких поселенцев в Силезию в соответствии с Магдебургским законодательством, предоставив городам самоуправление, рыночные права и судебную независимость. Эта правовая база превратила силезские поселения в процветающие городские центры." #NT!
 nd_sil_piast_fragmentation: "Фрагментация Пяста" #NT!
 nd_sil_piast_fragmentation_desc: "Разделение Силезии между конкурирующими ветвями Пястов, в какой-то момент насчитывавшими семнадцать отдельных герцогств, породило своеобразную политическую культуру: бесконечные переговоры, гибкая лояльность и талант управления многообразием, которые хорошо служили Силезии в условиях более крупных империй." #NT!
 nd_sil_linen_weaving: "Силезское льняное ткачество" #NT!
 nd_sil_linen_weaving_desc: "Начиная с шестнадцатого века, силезский лен стал ценным товаром во всей Европе. Деревенские ткачи в предгорьях Судет производили ткани, которые могли конкурировать с фламандским и ирландским льном, и экспортировались через торговые сети на рынки вплоть до Америки.\n\n#italic Доступно в: $nd_sil_linen_workshop$#!" #NT!
 nd_sil_urban_militia: "Традиция городской милиции" #NT!
 nd_sil_urban_militia_desc: "В обнесенных стеной городах Силезии существовало гражданское ополчение, вооруженное арбалетами, а затем и пистолетами. Эти бюргеры защищали свои рыночные привилегии с таким же упорством, как и в торговле, образуя надежную силу городской обороны." #NT!
 nd_sil_breslau_emporium: "Торговый центр Бреслау" #NT!
 nd_sil_breslau_emporium_desc: "Бреслау располагался на пересечении Янтарной дороги и Виа Регия, что делало его одним из крупнейших торговых городов Центральной Европы. Его суконные лавки, соляные рынки и товарные биржи соединяли Балтику со Средиземноморьем." #NT!
 nd_sil_hussite_defenses: "Гуситская оборона" #NT!
 nd_sil_hussite_defenses_desc: "Разрушительные набеги гуситов 1420-х и 1430-х годов, в результате которых было разрушено более тридцати силезских городов, потребовали комплексной перестройки городских укреплений. Каменные стены, усиленные ворота и постоянные гарнизоны стали стандартом для всего герцогства." #NT!
 nd_sil_crown_land_admin: "Королевская земельная администрация" #NT!
 nd_sil_crown_land_admin_desc: "Когда в 1335 году Силезия перешла под власть Богемской короны, а затем к Габсбургам, ее управление было реорганизовано в рамках централизованной административной системы, которая обеспечила финансовую эффективность и юридическое единообразие ранее раздробленному герцогству." #NT!
 nd_sil_silver_lead_mines: "Серебряные и свинцовые рудники" #NT!
 nd_sil_silver_lead_mines_desc: "В горах Верхней Силезии были обнаружены богатые месторождения серебра и свинца, которые опытные горняки разрабатывали с использованием все более сложных технологий. Тарновиц и другие шахтерские города стали центрами металлургического мастерства." #NT!
 nd_sil_oder_trade_tradition: "Одерская торговая сеть" #NT!
 nd_sil_oder_trade_tradition_desc: "Положение Бреслау на реке Одер в сочетании с его членством в Ганзейском союзе создало обширную торговую сеть, связывающую силезские ткани и минеральные богатства с балтийской торговлей, богемскими рынками и итальянскими банковскими домами." #NT!
 nd_sil_landsknechte_tradition: "Силезский ландскнехте" #NT!
 nd_sil_landsknechte_tradition_desc: "Силезские города предоставили имперским армиям дисциплинированную стрелковую пехоту, опираясь на немецкую военную традицию ландскнехтов. Эти профессиональные солдаты привнесли в Силезскую войну новейшие тактические инновации." #NT!
 nd_sil_three_crown_diplomacy: "Дипломатия трех корон" #NT!
 nd_sil_three_crown_diplomacy_desc: "Положение Силезии между польской, чешской и императорской коронами требовало исключительного дипломатического искусства. Силезские герцоги и городские советы научились натравливать одного сюзерена на другого, добиваясь привилегий путем тщательных переговоров." #NT!
 nd_sil_silesian_printing: "Силезская типография" #NT!
 nd_sil_silesian_printing_desc: "Появление книгопечатания в Бреслау в конце пятнадцатого века стало катализатором интеллектуальной жизни Силезии. Протестантские трактаты, научные труды и коммерческие отчеты выходили из силезских типографий, что делало герцогство центром центральноевропейского образования." #NT!
 nd_sil_breslau_reformation: "Реформация Бреслау" #NT!
 nd_sil_breslau_reformation_desc: "Назначение Иоганна Гесса в 1523 году превратило Бреслау в восточный бастион протестантизма. Церкви города массово перешли в другую веру, и Силезия стала одной из самых религиозно оспариваемых территорий Империи." #NT!
 nd_sil_mountain_jaegers: "Силезские горные егеря" #NT!
 nd_sil_mountain_jaegers_desc: "Лесистые горы Судетского хребта породили опытных охотников и лесников, которые, обученные тактике боевых действий, стали эффективной легкой пехотой. Эти силезские егеря преуспели в засадах и нерегулярных боях на пересеченной местности." #NT!
 nd_sil_linen_export_boom: "Бум экспорта льна" #NT!
 nd_sil_linen_export_boom_desc: "К семнадцатому веку силезский лен доминировал на европейских рынках. Купцы из Швайдница организовали сеть закупок, охватывающую каждый ткацкий станок в горных деревнях, а агенты по экспорту отправляли ткани в Голландию, Англию, Испанию и их колониальные империи.\n\n#italic Доступно в: $nd_sil_breslau_kontor$#!" #NT!
 nd_sil_habsburg_governance: "Габсбургское управление" #NT!
 nd_sil_habsburg_governance_desc: "Под управлением Габсбургов с 1526 года Силезия была включена в сложный бюрократический аппарат Австрийской монархии. Имперские чиновники, сборщики налогов и правовые реформы привели к централизованному управлению бывшими автономными княжествами." #NT!
 nd_sil_religious_coexistence: "Силезское религиозное сосуществование" #NT!
 nd_sil_religious_coexistence_desc: "Альтранштадтский договор 1707 года закрепил права протестантов на богослужение в Силезии, закрепив традицию религиозного сосуществования, имевшую глубокие корни в многоэтническом характере герцогства. Католическая, протестантская и швенкфельдерская общины научились жить в одних и тех же долинах." #NT!
 nd_sil_upper_silesian_coal: "Верхнесилезский уголь" #NT!
 nd_sil_upper_silesian_coal_desc: "Обширные угольные месторождения Верхней Силезии начали систематически разрабатываться в конце восемнадцатого века с помощью первых паровых двигателей в регионе. Это черное богатство превратило Силезию в одну из крупнейших промышленных зон Центральной Европы." #NT!
 nd_sil_fusilier_tradition: "Силезские фузилёрские традиции" #NT!
 nd_sil_fusilier_tradition_desc: "Силезские войны между Пруссией и Австрией превратили герцогство в тигель военных инноваций. Силезские полки, обученные по Фредерицианской системе, стали одними из лучших линейных пехотных полков в Европе." #NT!
 nd_sil_breslau_university: "Университет Бреслау" #NT!
 nd_sil_breslau_university_desc: "Иезуитский университет, основанный в 1702 году, и его позднее слияние с протестантской Виадриной в 1811 году создали мощный образовательный центр, привлекший ученых со всего немецкоязычного мира.\n\n#italic Доступно: $nd_sil_protestant_academy$#!" #NT!
 nd_sil_contested_borderland: "Оспариваемая граница" #NT!
 nd_sil_contested_borderland_desc: "Три Силезские войны между Фридрихом Великим и Марией Терезией сделали герцогство самой конфликтной территорией Европы. Эта постоянная милитаризация сформировала закаленное население, привыкшее к требованиям войны." #NT!
 nd_sil_linen_monopoly: "Силезская льняная монополия" #NT!
 nd_sil_linen_monopoly_desc: "На пике своего развития силезский лен экспортировался в Англию, Нидерланды, Францию, Испанию, Португалию, Скандинавию, Россию, Турцию и даже на рынки Африки и Америки, что было протоиндустриальным достижением, конкурирующим с любым другим в Европе." #NT!
 nd_sil_industrial_silesia: "Промышленная Силезия" #NT!
 nd_sil_industrial_silesia_desc: "Механизация силезской промышленности, паровые ткацкие станки заменили кустарных ткачей, угольные печи заменили древесный уголь, превратили герцогство в один из крупнейших промышленных регионов Европы девятнадцатого века." #NT!
 nd_sil_weavers_revolt: "Восстание ткачей" #NT!
 nd_sil_weavers_revolt_desc: "Отчаянное восстание силезских ткачей льна в 1844 году, подавленное прусскими войсками, стало символом человеческой цены индустриализации и вдохновило поколения социальных реформаторов и профсоюзных организаторов." #NT!
 nd_sil_iron_and_steel: "Силезский металлургический завод" #NT!
 nd_sil_iron_and_steel_desc: "Сочетание месторождений угля, железной руды и цинка в Верхней Силезии создало тяжелый промышленный комплекс, конкурирующий с Руром. Сталелитейные и литейные заводы изменили ландшафт и привлекли рабочих со всей Центральной Европы.\n\n#italic Доступно в: $nd_sil_coal_works$#!" #NT!
 nd_sil_enlightened_breslau: "Просвещенный Бреслау" #NT!
 nd_sil_enlightened_breslau_desc: "Салоны, театры и издательства Бреслау сделали его одной из культурных столиц восточной Германии. Город взрастил поэтов, философов и ученых, которые внесли свой вклад в широкое Просвещение." #NT!
 nd_sil_national_awakening: "Силезское национальное пробуждение" #NT!
 nd_sil_national_awakening_desc: "Девятнадцатый век принес в Силезию конкурирующие польские и немецкие национальные движения, каждое из которых претендовало на наследие герцогства. Это пробуждение национального сознания изменило силезскую идентичность и ее отношения с соседними государствами." #NT!
 a_nd_sil_piast_lancers: "Силезские Пястовые Уланы" #NT!
 a_nd_sil_piast_lancers_desc: "Легкая кавалерия происходила из свиты герцога Пястов, искушенной в набегах и разведке в долине Одера." #NT!
 a_nd_sil_crossbowmen: "Силезские арбалетчики" #NT!
 a_nd_sil_crossbowmen_desc: "Бюргерское ополчение, вооруженное арбалетами, набранное из укрепленных городов Бреслау, Швайдниц и Лигниц." #NT!
 a_nd_sil_jaegers: "Силезские егеря" #NT!
 a_nd_sil_jaegers_desc: "Легкие пехотные застрельщики, набранные из охотников и лесников Судетских горных лесов." #NT!
 a_nd_sil_fusiliers: "Силезские фузилёры" #NT!
 a_nd_sil_fusiliers_desc: "Линейная пехота, обученная в строгих традициях силезских кампаний Фридриха, устойчивая под огнем и точная в залпе." #NT!
 nd_sil_ducal_stronghold: "Силезская герцогская крепость" #NT!
 nd_sil_ducal_stronghold_desc: "Укрепленная резиденция князей Пястов, совмещавшая административный центр с военным гарнизоном. Эти опорные пункты обеспечивали оборону Силезии от вторжений монголов, гуситов и соперников." #NT!
 nd_sil_ducal_stronghold_upkeep: "Обслуживание гарнизона" #NT!
 nd_sil_ducal_stronghold_upkeep_desc: "Камень, оружие и инструменты для поддержания гарнизона и обороны герцогской крепости." #NT!
 nd_sil_linen_workshop: "Силезская льняная мастерская" #NT!
 nd_sil_linen_workshop_desc: "Ткацкая мастерская по производству тонких силезских льняных тканей на экспорт. Деревенские ткацкие станки и городские отделочные мастерские работают вместе для создания текстиля, который ценится на европейских рынках." #NT!
 nd_sil_linen_workshop_upkeep: "Производство льна" #NT!
 nd_sil_linen_workshop_upkeep_desc: "Льняные волокна и красители превращались на деревенских ткацких станках в силезское льняное полотно." #NT!
 nd_sil_mining_pit: "Силезский карьер" #NT!
 nd_sil_mining_pit_desc: "Предприятие по добыче серебра и свинца в горах Верхней Силезии, где работают опытные горняки и применяются все более сложные методы добычи." #NT!
 nd_sil_mining_pit_upkeep: "Горные работы" #NT!
 nd_sil_mining_pit_upkeep_desc: "Древесина для подпорок карьеров и железо для инструментов поддерживают горнодобывающие операции." #NT!
 nd_sil_breslau_kontor: "Бреслау Трейд Контор" #NT!
 nd_sil_breslau_kontor_desc: "Торговый дом в ганзейских традициях, осуществляющий торговлю с востока на запад, протекающую через позицию Бреслау на перекрестке Янтарной дороги и Виа Регия." #NT!
 nd_sil_breslau_kontor_upkeep: "Торговые операции" #NT!
 nd_sil_breslau_kontor_upkeep_desc: "Ткань, бумага и соль расходуются на ведение коммерческого учета, выборочных запасов и торговых операций." #NT!
 nd_sil_protestant_academy: "Силезская протестантская академия" #NT!
 nd_sil_protestant_academy_desc: "Образовательное учреждение, рожденное в эпоху Реформации, обучающее духовенство, учителей и общественных лидеров протестантскому богословию и гуманистическому обучению." #NT!
 nd_sil_protestant_academy_upkeep: "Академические расходы" #NT!
 nd_sil_protestant_academy_upkeep_desc: "Бумага, книги и свечи для обучения, научной переписки и публикации протестантских трактатов." #NT!
 nd_sil_coal_works: "Силезский угольный завод" #NT!
 nd_sil_coal_works_desc: "Ранняя промышленная добыча угля в Верхней Силезии с разработкой обширных месторождений, которые сделали этот регион одной из крупнейших промышленных зон Центральной Европы." #NT!
 nd_sil_coal_works_upkeep: "Горное оборудование" #NT!
 nd_sil_coal_works_upkeep_desc: "Древесина и железо для опор, инструментов и паровых машин, качающих воду из глубоких шахт." #NT!
 nd_sil_mechanized_mill: "Силезская механизированная мельница" #NT!
 nd_sil_mechanized_mill_desc: "Текстильная фабрика с паровым приводом, олицетворяющая переход силезской промышленности от кустарного ткачества к механизированному производству." #NT!
 nd_sil_mechanized_mill_upkeep: "Заводские операции" #NT!
 nd_sil_mechanized_mill_upkeep_desc: "Паровые двигатели, работающие на угле, приводят в движение механизированные ткацкие станки, которые ткут ткань из льняных волокон в промышленных масштабах." #NT!
 levy_nd_sil_piast_lancers: "Силезские Пястовые Уланы" #NT!
 levy_nd_sil_piast_lancers_desc: "Конные вассалы силезских князей Пястов, состоящие из дворян и профессиональных солдат." #NT!
 levy_nd_sil_crossbowmen: "Силезские городские арбалетчики" #NT!
 levy_nd_sil_crossbowmen_desc: "Городское ополчение, сформированное из бюргеров и солдат гарнизонов укреплённых торговых городов Силезии." #NT!
 nd_sil_linen_finishing: "Силезская льняная отделка" #NT!
 nd_sil_linen_finishing_desc: "Тонкие методы отбеливания и отделки, которые придают силезскому льну его неповторимое качество и блеск." #NT!
 nd_sil_beer_brewing: "Силезское пивоварение" #NT!
 nd_sil_beer_brewing_desc: "Традиционное силезское пивоварение с использованием местного зерна и древесины, производство эля и лагера, которые обеспечивают рабочие места и наполняют таверны." #NT!
 nd_sil_glassmaking: "Силезское стеклоделие" #NT!
 nd_sil_glassmaking_desc: "Судетские горные стеклодувы изготавливают сосуды, окна и декоративные предметы из лесной древесины, песка и местных минералов." #NT!
 nd_sil_iron_smelting: "Силезская выплавка чугуна" #NT!
 nd_sil_iron_smelting_desc: "Угольный металлургический завод, перерабатывающий верхнесилезскую руду в чугун и сталь для строительства, вооружения и промышленности." #NT!
 nd_sil_formed_tt: "была образована Силезия." #NT!
 nd_sil_path_a_tt: "Выбрали Перекресток Трех Корон" #NT!
 nd_sil_path_b_tt: "Выбрали страну льна и серебра" #NT!
 nd_sil_destiny: "Силезская судьба" #NT!
 nd_sil_destiny_desc: "Объединенная Силезия готова проложить свой курс. Расколотые герцогства Пястов были скованы в единое государство, и теперь вопрос в том, какой державой станет Силезия." #NT!
 nd_sil_dest_three_crowns_1: "Польская Корона" #NT!
 nd_sil_dest_three_crowns_1_desc: "Старейшие связи Силезии проходят на юг и восток с Краковом, резиденцией королей Пястов, которые когда-то правили этими землями. Чтобы проявить себя в качестве моста между королевствами, мы должны сначала вернуть себе город, где началась история Силезии и Польши." #NT!
 nd_sil_dest_three_crowns_2: "Богемская Корона" #NT!
 nd_sil_dest_three_crowns_2_desc: "Прага манит. Чешская корона претендовала на Силезию с 1335 года, и теперь мы изменим эти отношения. Контролируйте золотой город и его банкирские дома, и центральноевропейская политика подчинится силезской дипломатии." #NT!
 nd_sil_dest_three_crowns_3: "Императорская Корона" #NT!
 nd_sil_dest_three_crowns_3_desc: "Вена, резиденция Габсбургов и императорского сейма, — главный приз. Только передав все три коронных города под власть Силезии, мы сможем выполнить судьбу перекрестного государства, не подданного империй, а их арбитра." #NT!
 nd_sil_dest_industry_1: "Богемное серебро" #NT!
 nd_sil_dest_industry_1_desc: "Легендарные серебряные рудники Кутной Горы на протяжении веков финансировали чешских королей. Расширение Силезского контроля над этими рудниками объединило бы самые богатые горнодобывающие районы Центральной Европы под одной администрацией." #NT!
 nd_sil_dest_industry_2: "Балтийская Трейд" #NT!
 nd_sil_dest_industry_2_desc: "Одер несет наше белье на север, но в балтийской торговле доминируют Любек и его ганзейские партнеры. Чтобы стать настоящей торговой державой, Силезия должна захватить ворота Балтийского моря и контролировать всю цепочку от ткацкого станка до корабля." #NT!
 nd_sil_dest_industry_3: "Индустриальный Хартленд" #NT!
 nd_sil_dest_industry_3_desc: "Лейпцигские ярмарки привлекают торговцев со всей Европы. В сочетании с силезским углем, железом и льном контроль над этим торговым центром превратит наш промышленный центр в мастерскую Центральной Европы." #NT!
 nd_sil.5.t: "Силезская судьба" #NT!
 nd_sil.5.d: "Герцогство едино, и наш курс определен. Будь то дипломатия между коронами или богатство ткацких станков и шахт, Силезия должна полностью раскрыть свой потенциал. Традиции герцогов Пястов, их сила духа, их предприимчивость, их талант управлять многообразием приведут нас вперед в новую эпоху." #NT!
 nd_sil.5.a: "Силезия исполнит свое предназначение." #NT!
 nd_sil.6.t: "Краков пал в Силезском оружии" #NT!
 nd_sil.6.d: "Древняя столица королей Пястов теперь развевается под силезским знаменем. Краков, где был коронован Болеслав Храбрый и где судили поколения польских монархов, перешел под нашу власть. Это мощный символ: ветвь династии Пястов, правившая Силезией, теперь вернула себе резиденцию своих предков.\n\nПольская корона, некогда правившая Силезией, теперь должна считаться с силезским государством, которое контролирует верховья Одера и Вислы." #NT!
 nd_sil.6.a: "Наследие Пястов восстановлено." #NT!
 nd_sil.7.t: "Прага под Силезским сюзеренитетом" #NT!
 nd_sil.7.d: "Две из трех корон — наши. Прага, золотой город на Молдау, чьи чешские короли когда-то призывали силезских герцогов отдать дань уважения, теперь подчиняется Бреслау. Переход от вассала к сюзерену за несколько поколений является необычайным.\n\nС Прагой приходят ее канцелярия, банкирские дома и многовековые административные традиции. Должны ли мы поглотить богемный бюрократический аппарат, чтобы точно управлять нашим растущим царством? Или нам стоит принять военное наследие гуситских войн, опираясь на проверенные военные традиции Богемии, чтобы создать армию, которая сможет бросить вызов любой державе в Центральной Европе?" #NT!
 nd_sil.7.a: "Поглотите чешскую канцелярию." #NT!
 nd_sil.7.b: "Примите гуситское военное наследие." #NT!
 nd_sil.8.t: "Арбитр Трех Корон" #NT!
 nd_sil.8.d: "Вена наша. Центр власти Габсбургов, столица Священной Римской империи, город, который на протяжении веков диктовал политику Центральной Европы, и все это под знаменем Силезии. От Кракова до Праги и Вены — три короны, которые когда-то боролись за контроль над Силезией, теперь отвечают этому требованию.\n\nЭто беспрецедентный случай. Герцогство, некогда разделенное между семнадцатью мелкими князьями, превратилось в высшую державу Центральной Европы. Будем ли мы использовать это положение, чтобы стать верховным арбитром Империи, разрешая споры от Балтики до Адриатики посредством дипломатии? Или мы должны принять реальность нашей новой власти и создать центральноевропейскую гегемонию, подкрепленную подавляющей военной мощью?" #NT!
 nd_sil.8.a: "Мы будем справедливым арбитром Империи." #NT!
 nd_sil.8.b: "Центральная Европа склоняется перед Силезской мощью." #NT!
 nd_sil.9.t: "Шахты Кутна Гора" #NT!
 nd_sil.9.d: "Силезские горняки теперь работают вместе со своими чешскими коллегами на легендарных серебряных рудниках Кутна Гора. На протяжении веков гроши, отчеканенные из этого серебра, финансировали чешских королей и платили имперским армиям. Теперь, когда богатство течет через силезские банки и силезские счетные палаты.\n\nВ сочетании с нашими собственными рудниками в Тарновице и Злоторые Силезия теперь контролирует самый богатый минеральный пояс в Центральной Европе. Ткацкие станки и шахты, две опоры Силезского процветания, вместе крепнут." #NT!
 nd_sil.9.a: "Серебро из Богемии, лен из Силезии." #NT!
 nd_sil.10.t: "Силезские корабли в гавани Любека" #NT!
 nd_sil.10.d: "Великий ганзейский порт Любек отвечает Силезии. Впервые льну и минералам, текущим по Одеру, не нужно проходить через посредников, чтобы попасть на атлантические рынки; наши собственные купцы контролируют всю цепочку от мастерской до пристани.\n\nДолжны ли мы потребовать для себя старые ганзейские торговые привилегии, открыв наши рынки для свободного потока балтийской торговли? Или мы воспользуемся своей монополией на судоходном пути по Одеру, облагая налогом каждый тюк ткани и бочку товара, проходящие между Силезией и морем?" #NT!
 nd_sil.10.a: "Требуйте ганзейских привилегий." #NT!
 nd_sil.10.b: "Монополизировать судоходный маршрут по Одеру." #NT!
 nd_sil.11.t: "Семинар Центральной Европы" #NT!
 nd_sil.11.d: "Крупнейшие ярмарки Лейпцига — Михайловская ярмарка, Пасхальная ярмарка и Новогодняя ярмарка — теперь служат выставочным залом для силезской промышленности. Уголем из Верхней Силезии топят печи, железом питают кузницы, а льняные драпировки прилавков. Наш промышленный центр простирается от Судетских гор до Саксонской равнины.\n\nЭто вершина Силезского экономического чуда. Должны ли мы доверить этот огромный промышленный комплекс владельцам фабрик и операторам шахт, позволив их капиталу и амбициям стимулировать неустанный рост? Или нам следует поощрять дух торгового предпринимательства, сохраняя открытость торговли, дешевизну кредитов и конкурентоспособность рынков?" #NT!
 nd_sil.11.a: "Позвольте владельцам заводов возглавить наш рост." #NT!
 nd_sil.11.b: "Торговля и предпринимательство должны быть нашим путем." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_bohemian_chancellery: "Чешская канцелярия" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_bohemian_chancellery: "Административный аппарат чешской короны был интегрирован в силезское управление, привнося многовековой бюрократический опыт в наше растущее царство." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_hussite_alliance: "Гуситское военное наследие" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_hussite_alliance: "Военные традиции гуситских войн были впитаны в силезскую военную доктрину. Форты с повозками, агрессивная тактика осады и боевой дух наследников Жижки укрепляют наши армии." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_imperial_arbitrator: "Имперский арбитр" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_imperial_arbitrator: "Контроль Силезии над всеми тремя королевскими городами делает ее естественным арбитром центральноевропейских споров. Наши дипломаты решают конфликты от Балтики до Альп." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_central_european_hegemon: "Центральноевропейский гегемон" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_central_european_hegemon: "Объединенные силы и ресурсы трех королевств поддерживают военный истеблишмент, которому не может бросить вызов ни одна центральноевропейская держава. Силезская гегемония поддерживается мечом." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_hanseatic_privileges: "Ганзейские привилегии" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_hanseatic_privileges: "Старые ганзейские торговые права и рыночные привилегии теперь служат силезским купцам, открывая порты Балтики для нашего полотна, полезных ископаемых и промышленных товаров." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_oder_shipping_monopoly: "Монополия по доставке Одера" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_oder_shipping_monopoly: "Контроль над всем водным путем Одера от истока до моря дает Силезии мертвую хватку в торговле между севером и югом Центральной Европы. Каждый купец платит силезскую пошлину." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_factory_lords: "Фабричные Лорды" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_factory_lords: "Великие промышленники Верхней Силезии ведут неустанную экспансию, строя фабрики, проходя шахты и привлекая рабочих со всей Центральной Европы. Рост достигается ценой социального самоуспокоения." #NT!
 STATIC_MODIFIER_NAME_nd_sil_dest_merchant_republic_spirit: "Дух Торговой Республики" #NT!
 STATIC_MODIFIER_DESC_nd_sil_dest_merchant_republic_spirit: "Старая традиция торгового самоуправления Бреслау распространилась на промышленный центр Силезии. Дешевый кредит, защита наемников и либеральная торговля способствуют устойчивому процветанию." #NT!
 nd_sil_diplomatic_residence: "Силезская дипломатическая резиденция" #NT!
 nd_sil_diplomatic_residence_desc: "Роскошная резиденция в самом сердце Бреслау, принимающая послов со всей Центральной Европы. Это величественное здание служит нейтральной площадкой, где решаются дела трёх корон." #NT!
 nd_sil_diplomatic_residence_upkeep: "Дипломатические расходы" #NT!
 nd_sil_diplomatic_residence_upkeep_desc: "Прекрасные ткани, бумага и мебель потреблялись в ходе постоянных дипломатических приемов и переговоров." #NT!
 nd_sil_trade_hall: "Силезский торговый зал" #NT!
 nd_sil_trade_hall_desc: "Крупная коммерческая биржа, на которой силезские ткани, минералы и промышленные товары торгуются наряду с балтийскими товарами. Бьющееся сердце экономики Центральной Европы." #NT!
 nd_sil_trade_hall_upkeep: "Коммерческие операции" #NT!
 nd_sil_trade_hall_upkeep_desc: "Бумажные записи, образцы ткани и инструменты для взвешивания и измерения поддерживают повседневную работу биржи." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_sil_bureaucracy_authority: "Schlesische Verwaltung" #NT!
 AUTO_MODIFIER_DESC_nd_sil_bureaucracy_authority: "Силезия унаследовала многоуровневый институциональный инструментарий приграничья чешской короны: Фюрстентаг герцогов и королевских городов в Бреслау, Оберамт чешского губернатора, временное княжество Вроцлавского епископства над Ныса-Гродкувом, печатный кодекс горнодобывающей промышленности, который управлял серебряно-свинцовым бумом Тарновиц, и лоскутное одеяло Пястовских кадетских герцогств. Выбирайте, какие учреждения оставить в живых." #NT!
  
 sil_furstentag_bureaucracy: "Шлезишер Фюрстентаг" #NT!
 sil_furstentag_bureaucracy_desc: "Сейм силезских князей, созванный в Бреслау, собрал герцогов кадетских герцогств Пястов и Эрбфюрстен, князя-епископа Вроцлавского и депутатов шести королевских силезских городов. Фюрстентаг взимал налоги, повышал территориальные сборы и разрешал споры между герцогствами. По сравнению с Богемией или Саксонией, силезские поместья были необычайно раздроблены, но, соответственно, чешскому королю было трудно принудить их. Они относились к короне как к внешнему партнеру и существовали как настоящий сдерживающий фактор королевской власти до реформ Фердинанда II после 1629 года." #NT!
  
 sil_oberamt_bureaucracy: "Шлезиш Оберамт" #NT!
 sil_oberamt_bureaucracy_desc: "Главный офис Богемской короны в Силезии, возглавляемый Оберландшауптманом во Вроцлаве. Первый держатель, епископ Конрад Ольский, был назначен 16 апреля 1422 года королем Сигизмундом для организации защиты от гуситов. При Матиасе Корвине эта должность стала постоянной в 1474 году, превзойдя по рангу территориальных губернаторов герцогств и осуществляя добровольную юрисдикцию над принцами. После 1629 года император Фердинанд II превратил Оберамт из представительного органа в чисто имперскую бюрократию и главный инструмент габсбургской централизации в Силезии." #NT!
  
 sil_bischofsamt_bureaucracy: "Бистум Бреслау" #NT!
 sil_bischofsamt_bureaucracy_desc: "Князь-епископство Вроцлавское как светское государство. Епископ Опольский Ярослав получил Нысу от своего отца Болеслава I в 1198 году; в 1290 году герцог Генрих IV подтвердил суверенитет епископа над Нысой и Оттмахау, а епископ Пшецлав Погожельский купил Гродковское герцогство в 1342 году. После этого епископы Бреслау управляли Ныса-Гродковским герцогством самостоятельно, имели приоритет над другими силезскими правителями и управляли сетью католических школ, которая защищала провинцию от лютеранства. вторжение со стороны соседних Саксонии и Богемии." #NT!
  
 sil_bergordnung_bureaucracy: "Тарновицер Бергорднунг" #NT!
 sil_bergordnung_bureaucracy_desc: "Горный кодекс Верхней Силезии. Галена (серебросодержащая свинцовая руда) была обнаружена в Тарновице около 1490 года; в 1526 году герцог Ян II Ополе и маркграф Георгий Бранденбург-Ансбахский издали Акт Wolności Górniczej о предоставлении Bergfreiheit, а в 1528 году Ordunek Górny кодифицировал права свободных горняков, доли руды и сменную дисциплину. К середине 16 века Тарновские Горы были крупнейшим рудным центром в Восточно-Центральной Европе (около семи тысяч карьеров и семи дренажных штолен), привлекая горняков со всей Империи и превращая Верхнюю Силезию в финансовый актив Габсбургов, который сохранялся нетронутым до завоевания Фридриха II в 1742 году." #NT!
  
 sil_erbfurstentumer_bureaucracy: "Schlesische Erbfürstentümer" #NT!
 sil_erbfurstentumer_bureaucracy_desc: "Наследственные кадетские герцогства Пястов. По Завещанию Болеслава III в 1138 году Силезия была разделена между потомками Владислава II Изгнанника и постепенно раскололась на Лигниц, Бриг, Швайдниц-Яуер, Глогау, Саган, Мюнстерберг-Оэльс, Тешен и дюжину меньших княжеств. Каждое герцогство сохраняло свой герцогский двор и домашнее управление; последний силезский Пяст, Георг Вильгельм Лигницкий, умер в 1675 году. Эта система умножила дворянские должности и создала более богатую гражданско-правовую традицию, чем централизованные немецкие княжества, но она также фрагментировала суверенитет таким образом, что чешская корона три столетия пыталась обратить вспять." #NT!
