l_russian:
 STATIC_MODIFIER_NAME_nd_thunder_of_sango: "Гром Санго" #NT!
 STATIC_MODIFIER_DESC_nd_thunder_of_sango: "Обожествленный Алаафин Санго, повелитель грома и молний, ​​охраняет наших всадников. Во имя его кавалерийские атаки, потрясшие саванну, прозвучат еще раз." #NT!
 STATIC_MODIFIER_NAME_nd_voice_of_the_oyo_mesi: "Голос Ойо Меси" #NT!
 STATIC_MODIFIER_DESC_nd_voice_of_the_oyo_mesi: "Семь советников говорят от имени народа. Благодаря мудрости Башорунов и уравновешенности Огбони ни один тиран не сможет бесконтрольно править в Ойо." #NT!
 nd_oye.1.t: "Империя Ойо расцветает" #NT!
 nd_oye.1.d: "Разрозненные королевства йоруба были объединены под единым алаафином. От священного города Иль-Ифе до приграничных границ Империя Ойо теперь пользуется поддержкой миллионов. Но что это будет за империя? Память о Санго (третьем алаафине, обожествленном как бог грома) призывает к военной славе и превосходству кавалерии. Тем не менее, Ойо Меси, совет семи, напоминает нам, что истинная сила Ойо заключается не в управлении только всадниками, а в конституционном балансе, который не позволяет какой-либо одной руке удерживать слишком много власти. Башорун ждет нашего ответа. Старейшины Огбони наблюдают. Решение, которое мы примем сейчас, отзовется эхом в веках.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_oye.1.a: "Пусть гром говорит! Санго едет с нашей кавалерией." #NT!
 nd_oye.1.b: "Ойо Меси будет вести нас. Ни один король не правит в одиночку." #NT!
 nd_oye.2.t: "Эсо Икойи" #NT!
 nd_oye.2.d: "В казармах Икойи семьдесят младших военачальников официально были преобразованы в Эсо: элитный кавалерийский корпус империи. Назначенные Ойо Меси и утвержденные Алаафинами, эти воины живут по кодексу, сравнимому с рыцарскими орденами далеких земель. Эсо составят основу наших армий, но возникает вопрос: должны ли они оставаться отдельным элитным корпусом, подотчетным только алаафинам, или их следует распределить по провинциальным армиям для усиления целого?" #NT!
 nd_oye.2.a: "Эсо принадлежат Алаафинам: на расстоянии одного меча." #NT!
 nd_oye.2.b: "Разложите их пошире. Каждая армия выиграет от их мастерства." #NT!
 STATIC_MODIFIER_NAME_nd_oye_eso_spirit: "Дух Эсо" #NT!
 STATIC_MODIFIER_DESC_nd_oye_eso_spirit: "Семьдесят военачальников Икойи объединяются в элитный кавалерийский корпус, чья самоотверженность внушает трепет." #NT!
 STATIC_MODIFIER_NAME_nd_oye_cavalry_integration: "Кавалерийская интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_oye_cavalry_integration: "Опыт Эсо был распространен по всей армии, повышая качество каждого формирования." #NT!
 nd_oye.3.t: "Восходящий Башорун" #NT!
 nd_oye.3.d: "Авторитет Башоруна, главы Ойо Меси, возрос. Будучи премьер-министром империи, Башорун теперь обладает влиянием, которое соперничает с самим Алаафином. В самых крайних случаях традиция наделяет Башоруна ужасной силой калебаса: правом преподносить алаафинам яйца попугаев, принуждая к ритуальному отречению, если его правление перешло в тиранию. В этом конституционный гений Ойо: власть сдерживается властью, власть уравновешивается подотчетностью. Но в какую сторону склонится баланс?" #NT!
 nd_oye.3.a: "Башорун говорит от имени народа. Укрепите совет." #NT!
 nd_oye.3.b: "Алаафины суверенны. Восстановите королевскую власть." #NT!
 STATIC_MODIFIER_NAME_nd_oye_bashorun_power: "Возвышение Башоруна" #NT!
 STATIC_MODIFIER_DESC_nd_oye_bashorun_power: "Башорун и Ойо Меси осуществляют строгий надзор, обеспечивая подотчетное управление ценой решительных действий королевской власти." #NT!
 STATIC_MODIFIER_NAME_nd_oye_alaafin_reassertion: "Алаафин Возрождающийся" #NT!
 STATIC_MODIFIER_DESC_nd_oye_alaafin_reassertion: "Алаафины вновь подтвердили божественный мандат трона, сосредоточив власть для быстрого и решительного правления." #NT!
 nd_oye.4.t: "Дагомея покорена" #NT!
 nd_oye.4.d: "После многих лет кампании Королевство Дагомея было вынуждено принять сюзеренитет Ойо. Ежегодная дань в виде ракушек каури, ткани и рабов будет течь на север, ко двору Алаафинов. Что еще более важно, Ойо теперь контролирует маршруты к прибрежным портам (Аджасе, Бадагри и городам в лагуне), открывая империю для атлантической торговли. Короли фонов, возможно, и раздражаются под нашим игом, но сейчас конница Эсо высказалась, а Дагомея прислушалась." #NT!
 nd_oye.4.a: "Пусть дань течет. Территория Ойо простирается до моря." #NT!
 nd_oye.5.t: "Ааре-Она-Каканфо" #NT!
 nd_oye.5.d: "Был создан новый институт: Ааре-Она-Каканфо, верховный главнокомандующий всеми действующими армиями Ойо. По традиции Ааре-Она-Каканфо должны проживать в приграничной провинции, что позволяет держать величайшего воина империи вдали от столицы и любого искушения захватить трон. Он лично командует каждой кампанией, и его авторитет на поле боя абсолютен. Это ответ Ойо на вечную дилемму военных государств: как сохранить мощную армию, не позволяя ее командиру стать угрозой для государства." #NT!
 nd_oye.5.a: "Граница никогда не должна оставаться без охраны." #NT!
 nd_oye_sacred_origins: "Священные истоки Иль-Ифе" #NT!
 nd_oye_sacred_origins_desc: "Духовное наследие Иль-Ифе, колыбели народа йоруба, наполняет нашу империю божественной целью и культурной глубиной." #NT!
 nd_oye_mounted_traditions: "Установленные традиции" #NT!
 nd_oye_mounted_traditions_desc: "Контакты с народами Нупе и Сахары научили йоруба искусству конной войны, положив начало кавалерийской традиции, которая определила военную идентичность Ойо." #NT!
 nd_oye_ogboni_authority: "Администрация Огбони" #NT!
 nd_oye_ogboni_authority_desc: "Тайное общество Огбони, состоящее из старших свободных людей, служит судебным сдерживающим фактором как для алаафинов, так и для ойо меси." #NT!
 nd_oye_yoruba_guilds: "Ремесленные гильдии йоруба" #NT!
 nd_oye_yoruba_guilds_desc: "Специализированные гильдии ремесленников производят ткани, изделия из железа, бисер и керамику замечательного качества как для местного использования, так и для экспорта." #NT!
 nd_oye_walled_towns: "Города-крепости" #NT!
 nd_oye_walled_towns_desc: "Массивные земляные укрепления, оди, окружают города йоруба, обеспечивая мощную защиту от набегов и конкурирующих королевств." #NT!
 nd_oye_yam_cultivation: "Выращивание батата" #NT!
 nd_oye_yam_cultivation_desc: "Интенсивное выращивание ямса и зерновых поддерживает густонаселенность городов йоруба." #NT!
 nd_oye_oyo_mesi: "Совет Ойо Меси" #NT!
 nd_oye_oyo_mesi_desc: "Семь главных советников империи служат одновременно коллегией выборщиков и законодательным органом, представляя голос нации." #NT!
 nd_oye_eso_training: "Кавалерийская подготовка Эсо" #NT!
 nd_oye_eso_training_desc: "В казармах Икойи семьдесят военачальников Эсо обучают элитную кавалерию империи искусству верхового боя." #NT!
 nd_oye_afin_tradition: "Традиция дворца Афин" #NT!
 nd_oye_afin_tradition_desc: "Афин, дворцовый комплекс Алаафинов, служит церемониальным и административным центром Империи Ойо." #NT!
 nd_oye_sango_cult: "Культ Санго" #NT!
 nd_oye_sango_cult_desc: "Поклонение Санго, обожествленному третьему алаафину и повелителю грома, укрепляет королевскую легитимность и вдохновляет преданность." #NT!
 nd_oye_horse_trade: "Транссахарская торговля лошадьми" #NT!
 nd_oye_horse_trade_desc: "Кавалерия Ойо зависит от постоянных поставок лошадей, импортируемых через Сахару и обмениваемых на орехи кола, ткани и другие товары." #NT!
 nd_oye_textile_expansion: "Текстильная промышленность" #NT!
 nd_oye_textile_expansion_desc: "Ткачи йоруба производят знаменитую ткань асо-оке, роскошный текстиль, который продается по всей Западной Африке и за ее пределами." #NT!
 nd_oye_bashorun_system: "Башорунский институт" #NT!
 nd_oye_bashorun_system_desc: "Башорун, глава Ойо Меси, является премьер-министром и имеет право сдерживать даже самого алаафина." #NT!
 nd_oye_tributary_system: "Приточная система" #NT!
 nd_oye_tributary_system_desc: "Благодаря военному давлению и дипломатическому мастерству Ойо создал сеть подчиненных государств, включая могущественное Королевство Дагомея." #NT!
 nd_oye_market_networks: "Королевские рыночные сети" #NT!
 nd_oye_market_networks_desc: "Оджа Оба, королевские рынки, регулируемые властью Алаафинов, служат торговыми артериями империи." #NT!
 nd_oye_ifa_divination: "Ифа Гадание" #NT!
 nd_oye_ifa_divination_desc: "Оракул Ифа, которым управляют жрецы Орунмилы, хранит обширный корпус священных стихов, кодирующих знания и мудрость йоруба." #NT!
 nd_oye_mounted_archer_corps: "Корпус конных лучников" #NT!
 nd_oye_mounted_archer_corps_desc: "Разведчики легкой кавалерии, обученные стрельбе из лука, расширяют территорию империи через саванну, прикрывая тяжелую кавалерию и совершая набеги на линии снабжения противника." #NT!
 nd_oye_ajase_trade: "Аджасе Атлантик Трейд" #NT!
 nd_oye_ajase_trade_desc: "Через прибрежный порт Аджасе Ойо соединяется с торговым миром Атлантического океана, обмениваясь товарами с европейскими и американскими торговцами." #NT!
 nd_oye_egungun_tradition: "Эгунгунская традиция" #NT!
 nd_oye_egungun_tradition_desc: "Культ-маскарад Эгунгун чтит ушедших предков, укрепляя социальные связи и культурную самобытность по всей империи." #NT!
 nd_oye_aare_ona_kakanfo: "Ааре-Она-Каканфо" #NT!
 nd_oye_aare_ona_kakanfo_desc: "Верховный военачальник, вынужденный жить на границе, воплощает гениальное решение Ойо проблемы военной мощи, угрожающей политической стабильности." #NT!
 nd_oye_vassal_administration: "Вассальная администрация" #NT!
 nd_oye_vassal_administration_desc: "Сложная система данников Ойо извлекает богатство и лояльность из подчиненных королевств, одновременно предоставляя им значительную автономию." #NT!
 nd_oye_kola_dominance: "Доминирование кольского ореха" #NT!
 nd_oye_kola_dominance_desc: "Контроль над торговлей орехами кола, стимулятором, ценящимся в Сахеле и за его пределами, дает Ойо огромные экономические рычаги." #NT!
 nd_oye_constitutional_balance: "Конституционный баланс" #NT!
 nd_oye_constitutional_balance_desc: "Трехсторонний баланс Алаафина, Ойо Меси и Огбони гарантирует, что ни одно учреждение не сможет доминировать в управлении Ойо." #NT!
 nd_oye_ogun_smithing: "Огун Металлообработка" #NT!
 nd_oye_ogun_smithing_desc: "Под покровительством Огуна, божества железа и войны, кузнецы йоруба куют оружие и инструменты исключительного качества." #NT!
 nd_oye_yoruba_urbanization: "Урбанизация йоруба" #NT!
 nd_oye_yoruba_urbanization_desc: "Плотные, процветающие города Йорубаленда являются одними из крупнейших в Западной Африке центров ремесла, торговли и культурной жизни." #NT!
 nd_oye_indigo_trade: "Красители индиго Торговля" #NT!
 nd_oye_indigo_trade_desc: "Красильщики йоруба владеют искусством индиго, производя яркие ткани, которые продаются по премиальным ценам на региональных рынках." #NT!
 nd_oye_balogun_system: "Система Балогун" #NT!
 nd_oye_balogun_system_desc: "Провинциальные военачальники, Балогун, командуют профессиональными армиями, обеспечивая дисциплинированную военную иерархию под руководством Ааре-Она-Каканфо." #NT!
 nd_oye_diplomatic_craft: "Дипломатическое ремесло" #NT!
 nd_oye_diplomatic_craft_desc: "Дипломаты Ойо умело выстраивают сложные отношения с европейскими торговцами, соседними королевствами и государствами-данниками." #NT!
 nd_oye_agricultural_reform: "Сельскохозяйственная реформа" #NT!
 nd_oye_agricultural_reform_desc: "Улучшенные методы ведения сельского хозяйства и землепользования поддерживают растущее население империи и городские центры." #NT!
 nd_oye_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_oye_firearms_adoption_desc: "Европейское огнестрельное оружие интегрировано в вооруженные силы Ойо наряду с традиционной кавалерией, создавая универсальные общевойсковые силы." #NT!
 nd_oye_atlantic_commerce: "Атлантическая коммерция" #NT!
 nd_oye_atlantic_commerce_desc: "Порт Аджасе процветает как ворота Ойо в атлантический мир, направляя богатства от межконтинентальной торговли." #NT!
 nd_oye_royal_jurisprudence: "Королевская юриспруденция" #NT!
 nd_oye_royal_jurisprudence_desc: "Кодификация обычного права йоруба укрепляет правовую основу империи и расширяет королевскую власть." #NT!
 nd_oye_political_resilience: "Политическая устойчивость" #NT!
 nd_oye_political_resilience_desc: "Конституционные традиции Ойо доказывают свою ценность во времена кризиса, позволяя империи пережить внутренние потрясения." #NT!
 nd_oye_military_adaptation: "Военная адаптация" #NT!
 nd_oye_military_adaptation_desc: "Империя адаптирует свои военные традиции к меняющемуся характеру войны, сочетая кавалерийское мастерство с современной тактикой." #NT!
 nd_oye_cultural_renaissance: "Культурный ренессанс йоруба" #NT!
 nd_oye_cultural_renaissance_desc: "Расцвет искусства, литературы и философии йоруба укрепляет культурную самобытность в эпоху глобальных преобразований." #NT!
 nd_oye_market_modernization: "Модернизация рынка" #NT!
 nd_oye_market_modernization_desc: "Традиционные рынки йоруба превращаются в сложные коммерческие центры, интегрирующие новые товары и методы торговли." #NT!
 nd_oye_confederal_reform: "Конфедеративная реформа" #NT!
 nd_oye_confederal_reform_desc: "Децентрализованное управление позволяет различным народам сохранять свою идентичность, одновременно способствуя укреплению империи." #NT!
 nd_oye_diaspora_traditions: "Традиции диаспоры" #NT!
 nd_oye_diaspora_traditions_desc: "Культурное влияние йоруба распространяется далеко за пределы империи, распространяемое торговцами, учеными и течениями истории." #NT!
 a_nd_oye_ilari: "Королевская гвардия Илари" #NT!
 a_nd_oye_ilari_desc: "Илари — личные телохранители Алаафинов, которых можно узнать по полубритым головам. Набранные из дворцового двора, они служат одновременно стражами и посланниками королевской власти." #NT!
 a_nd_oye_heavy_cavalry: "Тяжелая кавалерия Ойо" #NT!
 a_nd_oye_heavy_cavalry_desc: "Бронированные всадники верхом на крупных лошадях, привезенных со всей Сахары. Эта тяжелая кавалерия наносит сокрушительные удары, разрушающие вражеские порядки." #NT!
 a_nd_oye_heavy_cavalry_levy: "Тяжелая кавалерия Ойо" #NT!
 a_nd_oye_heavy_cavalry_levy_desc: "Благородные кавалеристы, воспитанные по системе набора, сражаются в традициях тяжелой кавалерии Империи Ойо." #NT!
 a_nd_oye_balogun_guard: "Балогун Страж" #NT!
 a_nd_oye_balogun_guard_desc: "Профессиональная пехота, служащая под началом провинциальных военачальников. Гвардия Балогун представляет собой эволюцию вооруженных сил Ойо от доминирования кавалерии к общевойсковой войне." #NT!
 a_nd_oye_mounted_archers: "Конные лучники Ойо" #NT!
 a_nd_oye_mounted_archers_desc: "Быстрая легкая кавалерия, вооруженная луками, специализирующаяся на разведке, флангах и преследовании вражеских сил в открытой саванне." #NT!
 nd_oye_afin: "Афин" #NT!
 nd_oye_afin_desc: "Дворцовый комплекс Алаафинов — обширное соединение дворов, залов для аудиенций и ритуальных помещений, служащее политическим и церемониальным центром империи." #NT!
 nd_oye_oja_oba: "Оджа Оба" #NT!
 nd_oye_oja_oba_desc: "Королевский рынок, регулируемый властью Алаафинов, где торговцы со всей Западной Африки торгуют орехами кола, текстилем, домашним скотом и предметами роскоши." #NT!
 nd_oye_oko_oba: "Око Оба" #NT!
 nd_oye_oko_oba_desc: "Королевская усадьба для организованного выращивания батата. Ямс был основой питания населения Ойо и сельскохозяйственными излишками, поддерживавшими его имперские амбиции." #NT!
 nd_oye_farm_upkeep: "Фермерские операции" #NT!
 nd_oye_farm_upkeep_desc: "Древесина и инструменты для изготовления ручек мотыг, сараев для хранения и ограждений вокруг полей королевского ямса." #NT!
 nd_oye_ogboni_lodge: "Огбони Лодж" #NT!
 nd_oye_ogboni_lodge_desc: "Место встреч тайного общества Огбони, где старшие свободные граждане обсуждают вопросы справедливости, религии и надлежащих пределов королевской власти." #NT!
 nd_oye_ile_ikoyi: "Иль Икойи" #NT!
 nd_oye_ile_ikoyi_desc: "Казармы и тренировочные полигоны кавалерийского корпуса Эсо в Икойи, где семьдесят младших военачальников оттачивают свои навыки в конном бою." #NT!
 nd_oye_sango_shrine: "Храм Санго" #NT!
 nd_oye_sango_shrine_desc: "Храм, посвященный Санго, обожествленному Алаафину и повелителю грома, где преданные почитают божество барабанами бата и ритуальными подношениями." #NT!
 nd_oye_ile_ise: "Иль Исэ" #NT!
 nd_oye_ile_ise_desc: "Ремесленная мастерская йоруба, где опытные мастера производят ткани, изделия из металла, бисероплетение и керамику в соответствии с традициями гильдии." #NT!
 nd_oye_odi: "Оди" #NT!
 nd_oye_odi_desc: "Массивная земляная крепостная стена, окружающая город йоруба, построенная из утрамбованной земли и укрепленная древесиной. Эти стены могли достигать высоты двадцати футов." #NT!
 nd_oye_ile_bata: "Иль-Бата" #NT!
 nd_oye_ile_bata_desc: "Барабанная мастерская, где мастера-барабанщики изготавливают и играют на священных барабанах бата, используемых в поклонении Санго и в качестве системы связи на большие расстояния по всей империи." #NT!
 nd_oye_aso_oke_weaving: "Ткачество Асо-окэ" #NT!
 nd_oye_aso_oke_weaving_desc: "Традиционное искусство йоруба — плетение ткани асо-оке из хлопка местного производства и импортных красителей." #NT!
 nd_oye_kola_processing: "Кольская переработка" #NT!
 nd_oye_kola_processing_desc: "Переработка орехов колы в лекарственные стимуляторы, расфасованные в керамические сосуды для караванной торговли через Сахару." #NT!
 nd_oye_indigo_dyeing: "Крашение Индиго" #NT!
 nd_oye_indigo_dyeing_desc: "Мастерство йоруба в экстракции индиго и окраске тканей, производстве тканей насыщенных цветов ценится во всей Западной Африке." #NT!
 nd_oye_horse_breeding: "Коневодство" #NT!
 nd_oye_horse_breeding_desc: "Содержание и разведение кавалерийских ездовых животных из поголовья, импортированного через Сахару, для чего требуется домашний скот, имеющиеся лошади и зерно в качестве фуража." #NT!
 nd_oye_ogun_ironwork: "Огун Металлургическое производство" #NT!
 nd_oye_ogun_ironwork_desc: "Священная обработка металлов под покровительством Огуна, божества железа, потребляющая железную руду, древесный уголь, пиломатериалы и готовое оружие в кузнице." #NT!
 nd_oye_yam_farming: "Ямс Фермерство" #NT!
 nd_oye_yam_farming_desc: "Интенсивное выращивание ямса и зерна, основных продуктов питания Йорубаленда, дает излишки для растущих городов империи." #NT!
 nd_oye_ajase_port_ops: "Операции порта Аджасе" #NT!
 nd_oye_ajase_port_ops_desc: "Прибрежная торговая логистика в порту Ахасе, обработка товаров, направляющихся на рынки Атлантического океана." #NT!
 nd_oye_ifa_consultation: "Консультация Ифа" #NT!
 nd_oye_ifa_consultation_desc: "Священное искусство гадания Ифа, сохранение и передача знаний йоруба через устный сборник сотен стихов." #NT!
 nd_oye_modern_manufacturing: "Йоруба Производство" #NT!
 nd_oye_modern_manufacturing_desc: "Современные методы производства применяются в традиционных отраслях промышленности йоруба, сочетая наследственные навыки с новыми технологиями." #NT!
 nd_oye_afin_maintenance: "Содержание дворца" #NT!
 nd_oye_afin_maintenance_desc: "Ткань, красители, бумага, мебель и тонкая ткань расходуются на поддержание великолепия дворца Алаафинов и его административных функций." #NT!
 nd_oye_market_maintenance: "Рыночные операции" #NT!
 nd_oye_market_maintenance_desc: "Скот и ткань, потребляемые при работе и снабжении королевского рынка." #NT!
 nd_oye_ogboni_maintenance: "Содержание домика" #NT!
 nd_oye_ogboni_maintenance_desc: "Ритуальные материалы, используемые в церемониях Огбони и обслуживании ложи." #NT!
 nd_oye_ikoyi_maintenance: "Содержание казарм" #NT!
 nd_oye_ikoyi_maintenance_desc: "Лошади, оружие и кожа тратились на содержание кавалерийских казарм Эсо и экипировку воинов." #NT!
 nd_oye_shrine_maintenance: "Подношения святыни" #NT!
 nd_oye_shrine_maintenance_desc: "Домашний скот и ритуальные материалы, потребляемые в честь Санго в его святилище." #NT!
 nd_oye_craft_maintenance: "Производство тканей" #NT!
 nd_oye_craft_maintenance_desc: "Ремесленники йоруба ткут из окрашенной шерсти ткани замечательного качества в традициях мастерских гильдий." #NT!
 nd_oye_odi_maintenance: "Уход за стенами" #NT!
 nd_oye_odi_maintenance_desc: "Древесина, камень и инструменты, используемые для поддержания земляных крепостных стен городов йоруба." #NT!
 nd_oye_drum_maintenance: "Материалы барабанов" #NT!
 nd_oye_drum_maintenance_desc: "Дерево и кожа расходуются на изготовление и обслуживание священных барабанов бата." #NT!
 levy_nd_oye_ilari: "Королевская гвардия Илари" #NT!
 levy_nd_oye_ilari_desc: "Личный телохранитель Алаафина, воспитанный из солдат дворцового двора." #NT!
 levy_nd_oye_heavy_cavalry: "Тяжелая кавалерия Ойо" #NT!
 levy_nd_oye_heavy_cavalry_desc: "Кавалерия знатного происхождения, воспитанная посредством системы набора, сражается в традициях Ойо, связанных с конной бронетехникой." #NT!
 nd_oye_formed_tt: "Империя Ойо была основана" #NT!
 nd_oye_path_a_tt: "Выбрал Гром Санго" #NT!
 nd_oye_path_b_tt: "Выбрал Голос Ойо Меси" #NT!
 nd_oye_destiny: "Судьба Империи Ойо" #NT!
 nd_oye_destiny_desc: "Была провозглашена Империя Ойо. Прежде чем империя сможет реализовать свои большие амбиции, необходимо заложить прочный фундамент." #NT!
 nd_oye_dest_nupe_conquest: "Покорение Нупе" #NT!
 nd_oye_dest_nupe_conquest_desc: "Королевство Нупе уже давно соперничает с Ойо за контроль над Средним Нигером. Завоюйте Биду и Локою, чтобы обезопасить северный фланг империи и открыть дорогу в Сахель." #NT!
 nd_oye_dest_hausa_campaign: "Кампания Хауса" #NT!
 nd_oye_dest_hausa_campaign_desc: "После разрушения Нупе манят богатые города-государства хауса Кано и Кацина. Их рынки, красильные ямы и кожевенные мастерские представляют собой самые богатые сокровища западного Судана." #NT!
 nd_oye_dest_lord_of_sahel: "Лорд Сахеля" #NT!
 nd_oye_dest_lord_of_sahel_desc: "От лесов Йорубаленда до песков Сахеля — империя Ойо затмит старые империи Мали и Сонгай. Тимбукту и Гао должны признать гром Санго." #NT!
 nd_oye_dest_coastal_access: "Прибрежный простор" #NT!
 nd_oye_dest_coastal_access_desc: "Видение Ойо Меси требует контроля над побережьем. Обезопасьте Аджасе и Аккру, чтобы наладить морскую торговлю империи и соединить рынки йоруба с атлантическим миром." #NT!
 nd_oye_dest_trade_ascendancy: "Торговое господство" #NT!
 nd_oye_dest_trade_ascendancy_desc: "Обеспечив безопасность прибрежных портов, империя должна создать сложные финансовые институты и обеспечить потоки слоновой кости через наши рынки. Освойте банковское дело и доминируйте в торговле слоновой костью." #NT!
 nd_oye_dest_merchant_empire: "Торговая Империя" #NT!
 nd_oye_dest_merchant_empire_desc: "Конституционный гений Ойо Меси построил торговую империю. Расширьте наши торговые сети на Кумаси и Дженне, крупные торговые города Западной Африки." #NT!
 nd_oye.6.t: "Судьба Ойо" #NT!
 nd_oye.6.d: "Алаафины восседают на троне стабильной империи. От священных рощ Иль-Ифе до приграничных городов народ Ойо с ожиданием смотрит на своего повелителя. То, что началось как союз королевств йоруба, теперь готово стать чем-то большим. Вопрос не в том, поднимется ли Ойо, а в том, насколько высоко." #NT!
 nd_oye.6.a: "Судьба Ойо написана звездами." #NT!
 nd_oye.7.t: "Покоренный Нупе" #NT!
 nd_oye.7.d: "Кавалерия Эсо прогремела через Нигер и сломила мощь королевства Нупе. Бида, их древняя столица, теперь развевается под знаменем Алаафинов. Средний Нигер, долгое время оспариваемый, принадлежит нам. Контроль над Локойей в месте слияния рек Нигер и Бенуэ дает нам контроль над великими водными путями. Дорога в Сахель открыта." #NT!
 nd_oye.7.a: "Нупе должны научиться служить Алаафинам." #NT!
 nd_oye.8.t: "Падение Кано" #NT!
 nd_oye.8.d: "Великие стены Кано пали под натиском кавалерии Ойо. Города-государства хауса, известные своим богатством, карьерами, красящими индиго, и своей ролью в транссахарской торговле, теперь подчиняются власти алаафинов. Это завоевание беспрецедентно в истории йоруба. Но как нам управлять этими далекими богатыми городами? Генералы спорят: добиться преимущества с неустанной скоростью или консолидировать наши линии снабжения для предстоящей долгой кампании?" #NT!
 nd_oye.8.a: "Куйте железо, пока горячо. Скорость – наше оружие." #NT!
 nd_oye.8.b: "Обеспечьте безопасность наших линий снабжения. Саванна обширна." #NT!
 nd_oye.9.t: "Лорд Сахеля" #NT!
 nd_oye.9.d: "От лесов Йорубаленда до излучины Нигера, от библиотек Тимбукту до речного порта Гао — империя Ойо теперь управляет владениями, которые затмевают старые империи Мали и Сонгай. Имя Алаафина произносят с трепетом от побережья Атлантического океана до края Сахары. Гром Санго эхом разносится по западному Судану. Будем ли мы править этой обширной территорией посредством божественной власти или посредством прагматичного управления установившейся гегемонией?" #NT!
 nd_oye.9.a: "Гром Санго требует повиновения." #NT!
 nd_oye.9.b: "Прочная империя требует прочных институтов." #NT!
 nd_oye.10.t: "Порты Атлантики" #NT!
 nd_oye.10.d: "Стратегия Ойо Меси приносит свои плоды. Аджасе и прибрежные города Золотого Берега теперь подчиняются торговцам Алаафина. Каноэ, нагруженные тканью, орехами кола и слоновой костью, плывут по лагунам, чтобы встретить на побережье европейских и американских торговцев. Внутренние районы йоруба, долгое время изолированные от моря, теперь имеют окно в мир Атлантического океана. Конституционные архитекторы Ойо Меси доказали, что богатство легче перетекает к тем, кто торгует, чем к тем, кто просто завоевывает." #NT!
 nd_oye.10.a: "Море принесет богатство Ойо в мир." #NT!
 nd_oye.11.t: "Рынки слоновой кости" #NT!
 nd_oye.11.d: "Рынки Ойо стали перекрестком торговли Западной Африки. Слоновая кость из внутренних районов, ткани с ткацких станков йоруба, орехи кола из лесов и европейские товары с побережья — все это проходит через наши регулируемые рынки под бдительным присмотром Ойо Меси. Банковские учреждения укоренились, а финансовая развитость империи может соперничать с отдаленными торговыми державами. Но как нам применить эту коммерческую мощь? Должны ли мы строить великие рыночные города или инвестировать в дороги и отношения, поддерживающие торговлю?" #NT!
 nd_oye.11.a: "Стройте рынки. Пусть к нам приходят торговцы." #NT!
 nd_oye.11.b: "Инвестируйте в дороги. Торговля следует по этому пути." #NT!
 nd_oye.12.t: "Торговая Империя" #NT!
 nd_oye.12.d: "От Кумаси на западе до Дженне на Нигере купцы Ойо доминируют в торговле Западной Африки. Конституционное видение Ойо Меси создало нечто беспрецедентное: империю, построенную не на кавалерийских атаках, а на договорном праве, регулируемых рынках и дипломатическом утончении. Алаафины правят, но не правят в одиночку; Совет управляет, но не может переусердствовать. Этот баланс, отточенный на протяжении поколений, создал империю поразительной стабильности и процветания. Каково будет его окончательное выражение?" #NT!
 nd_oye.12.a: "Мудрость совета — сила империи." #NT!
 nd_oye.12.b: "Откройте ворота. Ойо торгует со всем миром." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_cavalry_supremacy: "Превосходство кавалерии" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_cavalry_supremacy: "Кавалерия Эсо наносит удары с разрушительной скоростью, подавляя защитников прежде, чем они успевают организовать ответный удар." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_scorched_savanna: "Выжженная саванна" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_scorched_savanna: "Логистическое мастерство Ойо в саванне гарантирует, что наши армии будут прокормлены, пока враг голодает, хотя затраты на поддержание удаленных линий снабжения напрягают казну." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_sango_dominion: "Доминион Санго" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_sango_dominion: "Божественная власть Санго требует быстрого повиновения. Покоренные народы подчиняются избранникам бога грома, и под знамена Алаафинов стекаются новые воины." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_sahel_hegemony: "Сахельская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_sahel_hegemony: "Обширный Сахель был умиротворен и интегрирован в стабильную имперскую администрацию, а укрепленные города обеспечивают мир." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_market_mastery: "Мастерство рынка" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_market_mastery: "Регулируемые рынки Ойо стали коммерческим двигателем Западной Африки, хотя растущая бюрократия требует своей доли." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_ivory_roads: "Дороги Слоновой Кости" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_ivory_roads: "Торговые пути, исходящие из Ойо, доставляют слоновую кость, ткань и орехи кола на отдаленные рынки, объединяя разные народы в общую коммерческую культуру." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_oyo_mesi_ascendant: "Ойо Меси Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_oyo_mesi_ascendant: "Конституционное господство Ойо Меси создало империю законов, дорог и дипломатической изощренности, не имеющую себе равных в Западной Африке." #NT!
 STATIC_MODIFIER_NAME_nd_oye_dest_atlantic_gateway: "Атлантические ворота" #NT!
 STATIC_MODIFIER_DESC_nd_oye_dest_atlantic_gateway: "Прибрежные порты Ойо соединяют внутренние районы с Атлантическим миром, направляя богатства межконтинентальной торговли в сердце империи." #NT!
 nd_oye_ile_ogun: "Иль-Огун" #NT!
 nd_oye_ile_ogun_desc: "Священный военный храм, посвященный Огуну, божеству железа и войны, служащий одновременно арсеналом и духовным центром военных кампаний империи." #NT!
 nd_oye_ogun_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_oye_ogun_arsenal_maintenance_desc: "Оружие, железо, кожа и лошади расходовались на поддержание священного арсенала Огуна и оснащение армий империи." #NT!
 nd_oye_ile_owu: "Иль-Оу" #NT!
 nd_oye_ile_owu_desc: "Величественная торговая гильдия, где торговцы йоруба, подчиняющиеся коммерческим правилам Ойо Меси, координируют обширные торговые сети империи." #NT!
 nd_oye_owu_maintenance: "Операции гильдии" #NT!
 nd_oye_owu_maintenance_desc: "Ткань, слоновая кость, бумага и керамика, использованные для управления домом торговой гильдии и ведения коммерческого учета." #NT!
  
  # ===== BUREAUCRACIES ===== 
 oye_oyo_mesi_bureaucracy: "Ойо Меси" #NT!
 oye_oyo_mesi_bureaucracy_desc: "Семь наследственных вождей метрополии Ойо (Басорун, Агбаакин, Саму, Алапини, Лагуна, Акинику и Асипа), чьи офисы находились в семи определенных кланах столицы. Они ратифицировали вступление каждого Алаафина на престол, проверяли казну и обладали конституционным правом преподнести королю калебас из яиц попугая, который приказал ему покончить жизнь самоубийством. Башорун Гаха последовательно пользовался этой прерогативой с 1750-х годов, пока Алаафин Абиодун не сверг его в 1774 году." #NT!
 oye_ogboni_society_bureaucracy: "Общество Огбони" #NT!
 oye_ogboni_society_bureaucracy_desc: "Тайное инициатическое братство старших мужчин, присягнувших земному божеству Ониле, отличающееся парными бронзовыми статуэтками эдан, которые носят на шее. Ложа иледи функционировала как городской суд последней инстанции по делам, караемым смертной казнью, и выносила метафизический вердикт, необходимый для свержения любого короля йоруба. Магистраты Огбони эффективно управляли Эгба Абеокутой после 1830 года, а параллельные ложи Осугбо управляли Иджебу вплоть до колониальной эпохи." #NT!
 oye_eso_kakanfo_bureaucracy: "Эсо и Ааре-Она-Каканфо" #NT!
 oye_eso_kakanfo_bureaucracy_desc: "Семьдесят титулованных кавалерийских офицеров Эсо, лично назначенных алаафинами, служили под началом Ааре-Она-Каканфо, верховного полевого генерала, которому по Конституции было запрещено расквартировываться в столице. Каканфо был связан клятвой побеждать в битвах или совершать самоубийство, а его провинциальная резиденция (Икойи, затем Ивое и, наконец, Илорин) предназначалась для предотвращения военных переворотов. В 1817 году Ааре Афонья изменил план, когда восстал против Илорина и разрушил Старый Ойо." #NT!
 oye_ilari_corps_bureaucracy: "Илари-Титулоносцы" #NT!
 oye_ilari_corps_bureaucracy_desc: "Несколько сотен королевских чиновников (некоторые мужчины, некоторые женщины, все с бритой головой с одной стороны и окрашенной в цвет индиго или камвуда с другой) были набраны из королевских рабов, пленников и клиентов, а не из столичных свободных кланов. Они служили посланниками алаафинов, сборщиками дани, постоянными посланниками и исполнителями королевских приказов. Поскольку их должности были личными и отзывными, корпус Илари был бюрократическим противовесом трона власти Ойо Меси, основанной на родословной." #NT!
 oye_ajele_residency_bureaucracy: "Провинциальная резиденция Аджеле" #NT!
 oye_ajele_residency_bureaucracy_desc: "Старшие Илари размещались в качестве постоянных жителей при дворах королей-данников империи Эгба, Эгбадо, Онко, Иджебу, Кету, Ову и, что наиболее важно, королевства Фон в Дагомее, которое платило ежегодную дань Ойо с 1730 по 1818 год. слоновая кость в Ойо-Иле. Их вымогательства стали основной движущей силой восстаний 1817–1836 годов, положивших конец империи." #NT!
 oye_babalawo_ifa_bureaucracy: "Совет Бабалаво Ифа" #NT!
 oye_babalawo_ifa_bureaucracy_desc: "Коллегия старших бабалаво («отцов тайн»), которые консультировались с предсказаниями Ифа по каждому важному королевскому решению: выбору нового алаафина из числа подходящих принцев, выбору времени для войн, умилостивлению, необходимому для прекращения голода, знакам против лояльности данника. Читая слепок из шестнадцати пальмовых орехов против корпуса из 256 стихов Оду, авторитет Аво распространялся на все королевства йоруба и пользовался уважением Фон (как Фа) и Эдо. Их ежегодные консультации в Иль-Ифе связывали религиозную жизнь империи с единой гадательной традицией." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_oye_bureaucracy_authority: "Бюрократическая власть Ойо" #NT!
 AUTO_MODIFIER_DESC_nd_oye_bureaucracy_authority: "При формировании Империя Ойо получает право принимать у себя исторические институты имперского управления йоруба: меси, огбони, эсо, илари, аджеле и совет Бабалаво Ифа." #NT!
