l_russian:
 STATIC_MODIFIER_NAME_nd_golden_throne_of_niani: "Золотой трон Ниани" #NT!
 STATIC_MODIFIER_DESC_nd_golden_throne_of_niani: "Богатства Империи Манден текут по нашим рынкам, как воды Нигера. Золотая пыль и соль наполняют нашу казну, и имя нашей Мансы с почтением произносят от Тимбукту до Каира." #NT!
 STATIC_MODIFIER_NAME_nd_mandate_of_the_gbara: "Мандат Гбары" #NT!
 STATIC_MODIFIER_DESC_nd_mandate_of_the_gbara: "Великое Собрание высказалось. Тон-тигуи готовы, корпус фарари выступает под нашим командованием, а шестнадцать мастеров колчанов клянутся в своей верности. Империя будет удерживаться силой оружия Мандена." #NT!
 STATIC_MODIFIER_NAME_nd_keepers_of_timbuktu: "Хранители Тимбукту" #NT!
 STATIC_MODIFIER_DESC_nd_keepers_of_timbuktu: "Библиотеки Тимбукту хранят мудрость веков, рукописи по юриспруденции, астрономии, медицине и истории заполняют полки Санкоре. Мы являемся хранителями этих знаний." #NT!
 STATIC_MODIFIER_NAME_nd_trade_of_timbuktu: "Торговля Тимбукту" #NT!
 STATIC_MODIFIER_DESC_nd_trade_of_timbuktu: "Тимбукту стоит на перекрестке миров. Караваны из Сахары встречаются с речными торговцами из Нигера, а товары трех континентов переходят из рук в руки на наших рынках." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_caravan: "Лорды каравана" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_caravan: "По нашему приказу огромные караваны из тысячи верблюдов пересекают раскаленные пески. Соль из Тагазы, золото из Буре, кола из леса — все проходит через территорию Мандена и наполняет кошельки Мандена." #NT!
 nd_mal.1.t: "Восстановление Империи Манден" #NT!
 nd_mal.1.d: "Осколки великой империи, основанной Сундиатой Кейтой, вновь собрались под одним знаменем. От берегов Нигера до окраин Сахары народ манден снова объединился. Гбара, великое собрание вождей кланов, собирается в Кангабе, чтобы определить направление развития восстановленной империи.\n\nПойдем ли мы по стопам Мансы Мусы, чье золотое паломничество ослепило дворы Каира и Мекки, сделав Мали самым богатым царством в известном мире? Или нам следует прислушаться к наследию Сундиаты, Короля Льва, чьи воины создали империю в саванне, и построить нашу силу на мощи тон-тигуи и грозной кавалерии фарари?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mal.1.a: "Пусть золото говорит громче мечей." #NT!
 nd_mal.1.b: "Империю завоевали воины, и воины ее сохранят." #NT!
 nd_mal.2.t: "Рукописи Тимбукту" #NT!
 nd_mal.2.d: "В медресе Тимбукту укоренился замечательный расцвет науки. Ученые Санкоре собрали обширную коллекцию рукописей, текстов по исламской юриспруденции, астрономии, математике, медицине и истории Сахеля. Ученые приезжают из Феса и Каира, чтобы учиться вместе с нашими улемами, а рукописи Тимбукту становятся известными как одно из величайших интеллектуальных сокровищ исламского мира.\n\nЭти рукописи представляют собой огромное богатство, как интеллектуальное, так и материальное. Должны ли мы инвестировать в сохранение и расширение этой научной традиции или использовать славу Тимбукту для привлечения большего количества торговцев и коммерции на наши рынки?" #NT!
 nd_mal.2.a: "Знания – самое настоящее богатство. Сохраните рукописи." #NT!
 nd_mal.2.b: "Пусть слава Тимбукту наполнит наши рынки торговцами." #NT!
 nd_mal.3.t: "Великие караваны Сахары" #NT!
 nd_mal.3.d: "Транссахарские торговые пути, которые на протяжении поколений обогащали нашу империю, продолжают процветать. Огромные караваны из тысячи и более верблюдов пересекают горящую пустыню под руководством берберских мореплавателей, которые читают звезды, как моряки читают море. В Тагазе из земли вырезают огромные куски соли и грузят их на верблюдов для долгого путешествия на юг. В Буре и Бамбуке золотой песок взвешивают и обменивают на соль, которая равна весу драгоценного металла.\n\nНаша империя сидит по обе стороны этих путей, как паук в центре своей паутины. Каждый караван, проходящий через нашу территорию, отдает дань Мансе, и богатство народов течет через руки Мандена." #NT!
 nd_mal.3.a: "Мы — хозяева караванных дорог." #NT!
 nd_mal.4.t: "Великая мечеть Джингербера" #NT!
 nd_mal.4.d: "Мечеть Джингеребер, построенная по заказу самого Мансы Мусы и спроектированная андалузским архитектором Абу Эс Хаком эс Сахели, является жемчужиной судано-сахелианской архитектуры. Построенная из банко, высушенного на солнце сырцового кирпича, армированного пальмовым деревом, мечеть возвышается над Тимбукту, ее три внутренних двора, два минарета и молитвенные залы служат одновременно молитвенным домом и центром обучения.\n\nМечеть стала образцом исламской архитектуры во всей Западной Африке. Его особый стиль, органичный, монументальный и идеально адаптированный к климату Сахеля, представляет собой уникальный синтез творчества Мандена и исламской преданности, который определяет нашу цивилизацию." #NT!
 nd_mal.4.a: "Памятник, достойный славы Мансы." #NT!
 nd_mal.5.t: "Реформы Хартии Мандена" #NT!
 nd_mal.5.d: "Курукан Фуга, великая хартия, провозглашенная в Курукан Фуга после победы Сундиаты в битве при Крине, служила конституционной основой нашей империи с момента ее основания. Его сорок четыре указа создали федерацию кланов мандинка, кодифицировали права собственности, обязали защищать окружающую среду и гарантировали индивидуальные свободы, включая отмену рабства среди манден.\n\nТеперь новое поколение лидеров стремится адаптировать эти древние принципы к вызовам меняющегося мира. Акцент хартии на консенсусном управлении через ассамблею Гбары, признание автономии ремесленных гильдий и положения о социальной мобильности создают основу для более современной администрации." #NT!
 nd_mal.5.a: "Мудрость основателей бессмертна." #NT!
 nd_mal_griot_tradition: "Устная традиция гриотов" #NT!
 nd_mal_griot_tradition_desc: "Гриоты, джали в Мандене, являются хранителями истории, генеалогии и закона. Через песни и декламации они сохраняют эпос о Сундиате и деяния Мансайи." #NT!
 nd_mal_niani_trade_tradition: "Торговая традиция Ниани" #NT!
 nd_mal_niani_trade_tradition_desc: "Столица Ниани расположена на пересечении торговых путей Нигера, где товары из леса, саванны и пустыни сходятся на оживленных рынках." #NT!
 nd_mal_clan_governance: "Управление кланом Манден" #NT!
 nd_mal_clan_governance_desc: "Политическая система Мандена основана на федерации кланов, созданной Курукан Фуга, а собрание Гбара обеспечивает советы и консенсус." #NT!
 nd_mal_islam_of_the_mansa: "Ислам Мансы" #NT!
 nd_mal_islam_of_the_mansa_desc: "Мансайя рано приняли ислам, смешав его с традициями мандена, чтобы создать особую западноафриканскую исламскую цивилизацию." #NT!
 nd_mal_timbuktu_manuscripts: "Рукописи Тимбукту" #NT!
 nd_mal_timbuktu_manuscripts_desc: "В огромных библиотеках и медресе Тимбукту хранятся сотни тысяч рукописей по юриспруденции, астрономии и истории — интеллектуальное сокровище исламского мира." #NT!
 nd_mal_trans_saharan_caravans: "Транссахарские караваны" #NT!
 nd_mal_trans_saharan_caravans_desc: "Огромные караваны из тысячи верблюдов пересекают пустыню, неся соль на юг и золото на север. Мали находится в центре этой торговли.\n\n#italic Доступно в: $nd_mal_salt_depot$#!" #NT!
 nd_mal_hajj_of_the_mansa: "Хадж Мансы" #NT!
 nd_mal_hajj_of_the_mansa_desc: "Легендарное паломничество Мансы Мусы в Мекку в 1324 году поразило дворы Египта и Аравии своей демонстрацией богатства, укрепив репутацию Мали во всем известном мире." #NT!
 nd_mal_djinguereber_mosque: "Мечеть Джингеребер" #NT!
 nd_mal_djinguereber_mosque_desc: "Эта великая мечеть, построенная по заказу Мансы Мусы и спроектированная андалузским архитектором Абу Эс Хаком эс Сахели, определяет судано-сахельскую архитектурную традицию." #NT!
 nd_mal_wangara_gold_trade: "Вангара Голд Трейд" #NT!
 nd_mal_wangara_gold_trade_desc: "Торговая сеть Вангара контролирует золотые прииски Буре и Бамбук через систему молчаливой торговли, что делает Мали источником большей части мирового золота." #NT!
 nd_mal_saharan_musket_trade: "Сахарская торговля мушкетами" #NT!
 nd_mal_saharan_musket_trade_desc: "Огнестрельное оружие, приобретенное в результате транссахарской торговли с государствами Северной Африки, начинает трансформировать манденскую войну, дополняя традиционную тактику лука и копья." #NT!
 nd_mal_niger_river_fleet: "Речной флот Нигера" #NT!
 nd_mal_niger_river_fleet_desc: "Военные каноэ и торговые суда курсируют по реке Нигер, жизненному пути империи, перевозя товары и воинов между великими торговыми городами." #NT!
 nd_mal_manden_reforms: "Реформы Хартии Мандена" #NT!
 nd_mal_manden_reforms_desc: "Принципы Курукан Фуга, консенсусное управление, автономия ремесленных гильдий и социальная мобильность адаптированы к вызовам новой эпохи." #NT!
 nd_mal_gold_dust_economy: "Экономика золотой пыли" #NT!
 nd_mal_gold_dust_economy_desc: "Золотой песок служит валютой по всей империи и взвешивается в стандартизированных мерах. На рынках золота Ниани и Тимбукту устанавливаются цены, которые колеблются по всей Африке и за ее пределами." #NT!
 nd_mal_sankore_scholars: "Ученые Санкоре" #NT!
 nd_mal_sankore_scholars_desc: "Ученые медресе Санкоре представляют интеллектуальную вершину западноафриканского ислама, создавая работы по юриспруденции Малики, которые изучаются от Сахеля до Магриба." #NT!
 nd_mal_tonjon_cavalry: "Тон-Джон Кавалерия" #NT!
 nd_mal_tonjon_cavalry_desc: "Тон-джон, изначально бывшие рабы, которым был присвоен статус воина, превратились в профессиональную кавалерию, служащую Мансе как верный военный инструмент, выходящий за рамки клановой политики." #NT!
 nd_mal_mande_cloth_weaving: "Ткачество ткани Манде" #NT!
 nd_mal_mande_cloth_weaving_desc: "Боголан, глиняная ткань, традиции и полосатый текстиль народа манде являются художественными самобытными и коммерчески ценными во всей Западной Африке.\n\n#italic Доступно в: $nd_mal_sahel_caravanserai$#!" #NT!
 nd_mal_maliki_jurisprudence: "Малики Юриспруденция" #NT!
 nd_mal_maliki_jurisprudence_desc: "Школа исламского права Малики, доминирующая в Сахеле, обеспечивает всеобъемлющую правовую основу, регулирующую торговлю, наследование и социальные отношения по всей империи." #NT!
 nd_mal_provincial_farimba: "Провинциальная Фаримба" #NT!
 nd_mal_provincial_farimba_desc: "Фарима, губернаторы провинций, состоящие из воинской аристократии, управляют обширными провинциями империи, собирая дань и поддерживая порядок от имени мансы." #NT!
 nd_mal_kola_trade_routes: "Кольские торговые пути" #NT!
 nd_mal_kola_trade_routes_desc: "Кольские орехи из южных лесов являются ценным стимулятором во всем исламском мире. Контроль над этими торговыми путями добавляет еще одно измерение коммерческому доминированию Мали.\n\n#italic Доступно в: $nd_mal_sahel_caravanserai$#!" #NT!
 nd_mal_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_mal_firearms_adoption_desc: "Огнестрельное оружие, приобретенное в результате транссахарской торговли и местного производства, начинает трансформировать состав армий Мандена, создавая новый класс пехоты, вооруженной мушкетами." #NT!
 nd_mal_tata_fortifications: "Укрепления Тата" #NT!
 nd_mal_tata_fortifications_desc: "Тата, укрепленные сооружения из высушенного на солнце кирпича, защищают поселения манденов от набегов. Их толстые стены и оборонительные башни адаптированы к условиям Сахеля." #NT!
 nd_mal_imperial_centralization: "Имперская централизация" #NT!
 nd_mal_imperial_centralization_desc: "Административные реформы укрепляют власть мансы над провинциями, сокращая автономию местных вождей и создавая более единую имперскую бюрократию." #NT!
 nd_mal_niger_trade_network: "Торговая сеть Нигера" #NT!
 nd_mal_niger_trade_network_desc: "Река Нигер служит коммерческой магистралью, соединяющей крупные города империи. Контроль над речной торговлей дополняет сухопутные караванные пути." #NT!
 nd_mal_mande_diaspora: "Манде Диаспора" #NT!
 nd_mal_mande_diaspora_desc: "Торговцы, ремесленники и ученые, говорящие на языке манде, основали сообщества по всей Западной Африке, распространяя язык, культуру и торговлю далеко за пределы границ империи." #NT!
 nd_mal_sofa_reform: "Диван Военная Реформа" #NT!
 nd_mal_sofa_reform_desc: "Традиция диванных воинов модернизируется с помощью европейской подготовки и организации, создавая дисциплинированные профессиональные пехотные силы нового века." #NT!
 nd_mal_secular_education: "Мактаб Образование" #NT!
 nd_mal_secular_education_desc: "Основываясь на традиции медресе, сеть школ мактабов распространяет грамотность и обучение за пределы научной элиты на более широкий сегмент общества." #NT!
 nd_mal_groundnut_economy: "Арахисовая экономика" #NT!
 nd_mal_groundnut_economy_desc: "Выращивание и экспорт арахиса преобразует сельскохозяйственную экономику, обеспечивая товарную культуру, которая интегрирует Мали в глобальные товарные рынки." #NT!
 nd_mal_modern_governance: "Современное управление" #NT!
 nd_mal_modern_governance_desc: "Для управления империей применяются современные административные методы, сочетающие манденские традиции консенсусного правления с бюрократической эффективностью." #NT!
 nd_mal_epic_tradition: "Эпическая традиция" #NT!
 nd_mal_epic_tradition_desc: "Устные традиции гриотов, «Эпос о Сундиате», хроники Мансайи — это живое культурное наследие, определяющее идентичность Мандена на протяжении веков." #NT!
 a_nd_mal_saharan_musketeer: "Сахарский мушкетер" #NT!
 a_nd_mal_saharan_musketeer_desc: "Пехота, вооруженная мушкетами, приобретенными в результате транссахарской торговли, сочетающая традиционную тактическую дисциплину Мандена с технологией огнестрельного оружия." #NT!
 a_nd_mal_tonjon_horseman: "Тон-Джон Всадник" #NT!
 a_nd_mal_tonjon_horseman_desc: "Профессиональные кавалерийские воины из класса воинов тон-джон, славящиеся своей скоростью, свирепостью в набегах и абсолютной преданностью Манса." #NT!
 a_nd_mal_mande_arquebusier: "Манде Аркебузир" #NT!
 a_nd_mal_mande_arquebusier_desc: "Пехота Мандена обучалась обращению с аркебузами, что символизирует развитие огнестрельного оружия в Сахеле." #NT!
 n_nd_mal_niger_canoe: "Нигерское военное каноэ" #NT!
 n_nd_mal_niger_canoe_desc: "Прочные каноэ, построенные для речных войн и торговли на Нигере, с командой опытных речников, знающих каждый изгиб и песчаную косу великой реки." #NT!
 a_nd_mal_reformed_sofa: "Реформированный диван" #NT!
 a_nd_mal_reformed_sofa_desc: "Традиция диванных воинов была преобразована с помощью современной подготовки и дисциплины, создав профессиональные пехотные силы, продолжающие военное наследие старого Мали." #NT!
 nd_mal_griot_pavilion: "Гриот Павильон" #NT!
 nd_mal_griot_pavilion_desc: "Место сбора, где гриоты, потомственные хранители устной истории, исполняют эпосы и генеалогии, которые объединяют общество Мандена." #NT!
 nd_mal_sahel_caravanserai: "Сахель Караван-сарай" #NT!
 nd_mal_sahel_caravanserai_desc: "Укрепленная остановка для отдыха на транссахарских торговых путях, обеспечивающая убежище, воду и рынки для огромных караванов, пересекающих пустыню." #NT!
 nd_mal_madrasa: "Медресе Тимбукту" #NT!
 nd_mal_madrasa_desc: "Исламское высшее учебное заведение, созданное по образцу великих медресе Санкоре, где преподают юриспруденцию, астрономию, математику и изучение Корана." #NT!
 nd_mal_salt_depot: "Соляной склад" #NT!
 nd_mal_salt_depot_desc: "Склад и рынок для торговли солью. Огромные куски каменной соли из Тагазы хранятся, разделяются и продаются торговцам, направляющимся на юг." #NT!
 nd_mal_sudano_sahelian_mosque: "Судано-Сахельская мечеть" #NT!
 nd_mal_sudano_sahelian_mosque_desc: "Монументальная мечеть, построенная в характерном для Сахеля стиле банко из сырцового кирпича, служащая одновременно центром поклонения и обучения." #NT!
 nd_mal_gold_dust_market: "Рынок золотого песка" #NT!
 nd_mal_gold_dust_market_desc: "Специализированный рынок, где золотой песок взвешивается, оценивается и продается. Рынки золота Мали устанавливают цены, которые влияют на торговлю в Африке и Средиземноморье." #NT!
 nd_mal_tata_fortress: "Крепость Тата" #NT!
 nd_mal_tata_fortress_desc: "Укрепленный комплекс из высушенного на солнце кирпича с оборонительными башнями, адаптированный к ландшафту Сахеля. Традиция тата защищает поселения от набегов и вторжений." #NT!
 nd_mal_maktab: "Школа Мактаб" #NT!
 nd_mal_maktab_desc: "Школа, обеспечивающая базовую грамотность и кораническое образование для широких слоев населения, расширяя традицию медресе за пределы научной элиты." #NT!
 nd_mal_griot_upkeep: "Покровительство Гриота" #NT!
 nd_mal_griot_upkeep_desc: "Поддержка гриотов красками для церемониальной одежды, керамикой для инструментов и тканью для костюмов для выступлений." #NT!
 nd_mal_caravanserai_upkeep: "Караван-сарай Продовольствие" #NT!
 nd_mal_caravanserai_upkeep_desc: "Снабжение караван-сарая скотом, зерном и солью для торговцев и их животных на переходе через пустыню." #NT!
 nd_mal_madrasa_upkeep: "Расходы на библиотеку медресе" #NT!
 nd_mal_madrasa_upkeep_desc: "Бумага и книги для рукописей и учебных материалов ученых медресе, благовония для молитвенных залов." #NT!
 nd_mal_salt_depot_upkeep: "Хранение соли" #NT!
 nd_mal_salt_depot_upkeep_desc: "Поддержание запасов соли на складе, пиломатериалов для стеллажей и керамических контейнеров для раздачи торговцам." #NT!
 nd_mal_mosque_upkeep: "Обслуживание мечети" #NT!
 nd_mal_mosque_upkeep_desc: "Глина и пиломатериалы для ежегодной штукатурки и ремонта строения из сырцового кирпича банка, а также благовония для богослужений." #NT!
 nd_mal_gold_market_upkeep: "Рыночные операции" #NT!
 nd_mal_gold_market_upkeep_desc: "Инструменты и керамика для взвешивания и измерения золотого песка, а также бумага для бухгалтерских книг и торговых записей." #NT!
 nd_mal_tata_upkeep: "Содержание крепости" #NT!
 nd_mal_tata_upkeep_desc: "Глина и пиломатериалы для ремонта сырцовых стен банка и деревянных частоколов, а также оружие для вооружения гарнизона." #NT!
 nd_mal_maktab_upkeep: "Школьные принадлежности" #NT!
 nd_mal_maktab_upkeep_desc: "Бумага и книги для учащихся и преподавателей мактаба, ткань для письменных принадлежностей и униформа учащихся." #NT!
 nd_mal_salt_trade_pm: "Транссахарская торговля солью" #NT!
 nd_mal_salt_trade_pm_desc: "Обработка и распределение соли из огромных рудников пустыни для торговли по всему Сахелю." #NT!
 nd_mal_bogolan_cloth_pm: "Производство ткани Боголан" #NT!
 nd_mal_bogolan_cloth_pm_desc: "Ремесленники производят боголан, отличительную грязевую ткань Манде, окрашивая местный хлопок ферментированной грязью и натуральными пигментами, создавая изысканный текстиль, который ценится во всей Западной Африке." #NT!
 levy_nd_mal_tonjon_horseman: "Тон-Джон Всадник Леви" #NT!
 levy_nd_mal_tonjon_horseman_desc: "Профессиональная кавалерия, выросшая из класса воинов тон-джон." #NT!
 levy_nd_mal_reformed_sofa: "Реформированный диван Леви" #NT!
 levy_nd_mal_reformed_sofa_desc: "Модернизированная диванная пехота, воспитанная из крестьянско-солдатского сословия." #NT!
 nd_mal_kola_trade_pm: "Кольский Орех Трейд" #NT!
 nd_mal_kola_trade_pm_desc: "Переработка и доставка орехов кола из южных лесов для торговли по всему Сахелю с использованием тюков ткани и керамических сосудов для упаковки и транспортировки." #NT!
 nd_mal_formed_tt: "Мали была образована" #NT!
 nd_mal_path_a_tt: "Выбрать Золотой Трон Ниани" #NT!
 nd_mal_path_b_tt: "Выбрал мандат Гбары" #NT!
 nd_mal_destiny: "Судьба Мандена" #NT!
 nd_mal_destiny_desc: "Восстановленная империя готова проложить свой путь. Будь то золото или железо, воля Мансы определит будущее Сахеля." #NT!
 nd_mal_dest_crossroads: "Перекресток Сахары" #NT!
 nd_mal_dest_crossroads_desc: "Обезопасьте великие торговые города Тимбукту и Дженне, жемчужины-близнецы Нигерской излучины, где караваны из пустыни встречаются с речными торговцами с юга." #NT!
 nd_mal_dest_salt_gold: "Соль и золото" #NT!
 nd_mal_dest_salt_gold_desc: "Распространите наш контроль на соляные шахты Тагазы и создайте банковские учреждения для управления огромными богатствами, текущими через наши рынки." #NT!
 nd_mal_dest_empire_gold: "Империя золота" #NT!
 nd_mal_dest_empire_gold_desc: "Завершите золотую цепь от Сиджилмасы на севере до золотых приисков на юге. Пусть о богатстве Мандена будут говорить от Марракеша до Каира." #NT!
 nd_mal_dest_march_gao: "Марш на Гао" #NT!
 nd_mal_dest_march_gao_desc: "Сонгайский город Гао уже давно соперничает с властью Мандена в Нигере. Подчините его власти Мансы и обеспечьте безопасность восточной границы." #NT!
 nd_mal_dest_hausa_campaigns: "Кампании хауса" #NT!
 nd_mal_dest_hausa_campaigns_desc: "Богатые города-государства Хаусаленд, Кано и Кацина контролируют торговые пути на восток к Борну и за его пределы. Покорите их, чтобы распространить гегемонию Мандена на весь Сахель." #NT!
 nd_mal_dest_gold_coast: "Лорд Золотого Берега" #NT!
 nd_mal_dest_gold_coast_desc: "Золотые прииски Акан вокруг Кумаси и Боно Мансо являются источником золота, сделавшего Мали легендарным. Захватите эти земли и контролируйте богатство у самого его источника." #NT!
 nd_mal.6.t: "Судьба Мандена" #NT!
 nd_mal.6.d: "Империя восстановлена, но наша работа только началась. Гбара собирается, чтобы объявить видение Манса будущего Мандена. Путь, который мы выбираем сейчас, отзовется эхом в веках." #NT!
 nd_mal.6.a: "Пусть воля Мансы будет сделана." #NT!
 nd_mal.7.t: "Перекресток Сахары" #NT!
 nd_mal.7.d: "Тимбукту и Дженне наши. Нигерский изгиб, этот огромный полумесяц, где река поворачивает на юг через край пустыни, теперь полностью находится под контролем Мандена. Караваны, прибывающие с севера, встречают сборщиков налогов Мандена, ожидающих у каждых ворот, а ученые Санкоры кланяются покровителю Мандена." #NT!
 nd_mal.7.a: "Изгиб реки отвечает только Мансе." #NT!
 nd_mal.8.t: "Мастера соли и золота" #NT!
 nd_mal.8.d: "Соляные шахты Тагазы принадлежат нам, что завершает наш контроль над двумя сырьевыми товарами, которые являются движущей силой транссахарской торговли. Соль с севера и золото с юга теперь проходят через руки Мандена. Наши банкиры переняли методы великих торговых домов, и казна Мансы переполнена.\n\nВложим ли мы это богатство в монополизацию самой торговли солью или в покровительство учёным и учреждениям, которые делают Тимбукту интеллектуальной столицей Африки?" #NT!
 nd_mal.8.a: "Монополизировать торговлю солью." #NT!
 nd_mal.8.b: "Покровительствуйте ученым Тимбукту." #NT!
 nd_mal.9.t: "Империя золота" #NT!
 nd_mal.9.d: "От Сиджилмасы в Магрибе до золотых приисков на юге – вся золотая цепочка находится под контролем Мандена. Ни одна империя в Африке, а возможно, и в мире не обладает таким богатством. Имя Мансы с трепетом произносят при дворах Европы, во дворцах Каира и на базарах Багдада.\n\nБудем ли мы использовать эту золотую империю для доминирования посредством дипломатии и аннексии, или же инвестируем в создание прочного культурного наследия, которое будет определять Западную Африку на протяжении веков?" #NT!
 nd_mal.9.a: "Пусть золото говорит в каждом суде." #NT!
 nd_mal.9.b: "Создайте наследие, которое переживет золото." #NT!
 nd_mal.10.t: "Марш на Гао" #NT!
 nd_mal.10.d: "Столица Сонхая, Гао, пала в руки Мандена. На протяжении поколений сонгайцы соперничали с Мали за господство в Нигере, совершая набеги на наши восточные провинции и бросая вызов власти мансы. Эта эпоха закончилась. Восточная граница обеспечена, и дорога к дальнейшим завоеваниям открыта." #NT!
 nd_mal.10.a: "Гао кланяется наследникам Короля Льва." #NT!
 nd_mal.11.t: "Кампании хауса" #NT!
 nd_mal.11.d: "Наши армии пронеслись через Хаусаланд, приведя под знамя Мансы великие города-государства Кано и Кацина. Эти древние торговые центры, имеющие связи с Борну, Египтом и далеким востоком, теперь отдают дань уважения Мандену.\n\nИспользуем ли мы этот импульс для реформирования нашей кавалерии и продвижения дальнейших завоеваний или систематически собираем дань для финансирования профессиональной постоянной армии?" #NT!
 nd_mal.11.a: "Реформируйте кавалерию для дальнейших кампаний." #NT!
 nd_mal.11.b: "Собирайте дань и создайте постоянную армию." #NT!
 nd_mal.12.t: "Лорд Золотого Берега" #NT!
 nd_mal.12.d: "Кумаси и золотые прииски Акан — наши. Мы достигли того, на что не осмелилась ни одна манса до нас, контролируя не только торговлю золотом, но и сами рудники. Империя Сундиата была побеждена. От солончаков Сахары до лесов Золотого Берега власть Мансы беспрепятственно распространяется.\n\nБудем ли мы использовать эту непревзойденную силу для дальнейшего военного господства или объединим наши обширные завоевания в прочный Пакс Мандинка?" #NT!
 nd_mal.12.a: "Меч Сундиаты не знает покоя." #NT!
 nd_mal.12.b: "Создайте прочный мир в наших владениях." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_salt_monopoly: "Соляная монополия Мансы" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_salt_monopoly: "Манса контролирует торговлю солью от шахт до рынка, устанавливая цены, которые обогащают казну и финансируют амбиции империи." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_timbuktu_patronage: "Покровительство Тимбукту" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_timbuktu_patronage: "Щедрая поддержка Мансы ученых и медресе Тимбукту сделала город маяком знаний, привлекающим лучшие умы со всего исламского мира." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_gold_emperor: "Золотой Император" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_gold_emperor: "Богатство и дипломатическое влияние Мансы не имеют себе равных. Золото покупает союзников, вассалов и влияние во всем известном мире." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_mansa_legacy: "Наследие Мансы" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_mansa_legacy: "Манса решил инвестировать в наследие, которое не будет завоевано, в цивилизацию обучения, искусства и культуры, которая будет определять Западную Африку на протяжении веков." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_savanna_riders: "Саванна Райдерс" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_savanna_riders: "Реформированная кавалерия Мандена с разрушительной скоростью проносится по открытой саванне, набирая и обучая воинов на завоеванных землях." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_hausa_tribute: "Дань Хаусаленду" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_hausa_tribute: "Систематическое взимание дани с богатых городов-государств хауса финансирует профессиональную армию и обеспечивает союзников-наемников." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_sword_of_sundiata: "Меч Сундиаты" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_sword_of_sundiata: "Военная мощь Мансы абсолютна. Ни одна крепость не сможет противостоять объединению пехоты, кавалерии и осады Мандена." #NT!
 STATIC_MODIFIER_NAME_nd_mal_dest_pax_mandinka: "Пакс Мандинка" #NT!
 STATIC_MODIFIER_DESC_nd_mal_dest_pax_mandinka: "Мир мансы простирается по всему Сахелю и за его пределы. Измученные войной земли восстанавливаются под стабильным управлением Мандена, а болезни и разрушения отступают." #NT!
 nd_mal_house_of_gold: "Дом золота" #NT!
 nd_mal_house_of_gold_desc: "Великая сокровищница и торговый дворец, где взвешиваются, хранятся и перераспределяются богатства транссахарской торговли. Лучшие купцы и банкиры Западной Африки ведут свой бизнес под его золотыми куполами." #NT!
 nd_mal_sundiata_hall: "Зал Сундиаты" #NT!
 nd_mal_sundiata_hall_desc: "Укрепленный дворец-крепость в честь основателя империи, где манса держит суд со своими военачальниками и чествуют величайших воинов империи." #NT!
 nd_mal_house_of_gold_upkeep: "Казначейские операции" #NT!
 nd_mal_house_of_gold_upkeep_desc: "Золото для казначейских резервов, драгоценности для дипломатических подарков, бумага для торговых книг и прекрасная ткань для высокопоставленных лиц, ведущих дела внутри страны." #NT!
 nd_mal_sundiata_hall_upkeep: "Холл Гарнизон" #NT!
 nd_mal_sundiata_hall_upkeep_desc: "Оружие и доспехи для элитной гвардии, камень для крепостных стен, кожа для военного снаряжения и лошади для расквартированной внутри кавалерии." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_mal_bureaucracy_authority: "Императорский аппарат Мандена" #NT!
 AUTO_MODIFIER_DESC_nd_mal_bureaucracy_authority: "Курукан Фуга 1236 года объединил двенадцать королевств мандинка в единую федерацию под властью Мансы, в которой собрание Гбара, губернаторы дьямана, торговая сеть Вангара, ученые Санкоре, корпорации касты ниамакала и кавалерийские ордена тон-тиги - все они объединились в слаженную имперскую машину. Рядом со столицей открываются два бюрократических места для институтов государства Манден." #NT!
  
 mal_gbara_assembly_bureaucracy: "Ассамблея Гбары" #NT!
 mal_gbara_assembly_bureaucracy_desc: "Великий совет, учрежденный Хартией Курукан Фуга 1236 года, в котором около тридцати мест представляли федерацию кланов Мандинка: шестнадцать воинских родов тон-тиги, четыре хранителя веры мори-канда-лолоу для исламских советов, четыре кастовых клана ниамакала для ремесленно-корпоративных вопросов и четыре клана джели как мастера речи и исторических записей. Гбара консультировали Мансу, ратифицировали преемственность и воплощали в жизнь федеральный договор, который связывал двенадцать вассальных королевств с Ниани. Его консенсус был в равной степени залогом легитимности и тормозом на троне." #NT!
  
 mal_dyamana_government_bureaucracy: "Правительство провинции Дьямана" #NT!
 mal_dyamana_government_bureaucracy_desc: "Мали представляла собой федерацию из двенадцати составных королевств под властью Мансы, каждым из которых правил дьямани-тигуи (хозяин провинции), утвержденный императорским двором, но выбираемый в соответствии с местными обычаями: выборы, наследование или ротация среди признанных родословных. Завоеванные территории за пределами ядра Мандена были переданы под управление военного губернатора фарба, назначаемого непосредственно мансой, который собирал дань и таможню и обладал местной судебной властью. Двойная структура консенсусного федерализма в центре и прямого правления на периферии отличала Малийскую империю от ее подчиненной преемницы Сонгай." #NT!
  
 mal_sankore_madrasa_bureaucracy: "Комплекс медресе Санкоре" #NT!
 mal_sankore_madrasa_bureaucracy_desc: "К 14 веку в Тимбукту располагались три великих конгрегационалистских медресе: Джингеребер, построенный в 1327 году при Мансе Мусе по проекту андалузца Эс-Сахели; Сиди Яхья, основанный около 1440 года; и более старая мечеть Санкоре, которая превратилась в центр маликитской юриспруденции, математики, астрономии и грамматики. На пике своего развития комплекс принимал около двадцати пяти тысяч студентов и класс юристов в черных одеждах, чьи фетвы разыскивались от Каира до Марракеша. Библиотечная культура, которую они поддерживали, пережила марокканское завоевание 1591 года, находилась в частных руках и была рассеяна по пустыне ко дню возвращения." #NT!
  
 mal_wangara_diaspora_bureaucracy: "Вангарская торговая диаспора" #NT!
 mal_wangara_diaspora_bureaucracy_desc: "Мусульманские торговцы, работающие на дальние расстояния, известные как Вангара в Сахеле и Дьюла в южных лесах, набранные из племен сонинке и мандинка и связанные общим обрядом Малики. С четырнадцатого века Вангара организовывала разведку и транспортировку золота из Бамбука, Буре и страны Акан, соляные караваны из Тагазы, обмен орехами колы из Конга и сахарскую торговлю бумагой и книгами. Их децентрализованная сеть колоний торговых кварталов в немусульманских торговых городах (Бего, Конг, Бобо-Диуласо, Бондуку) расширила коммерческую сферу Мандена далеко за пределы формальных политических границ империи." #NT!
  
 mal_niamakala_castes_bureaucracy: "Кастовые корпорации Ниамакала" #NT!
 mal_niamakala_castes_bureaucracy_desc: "Энгамные касты ремесленников были официально оформлены в Курукан Фуге 1236 года: кузнецы нуму, которые одни могли работать с железом, кожевники гаранке, барды-джели-гриоты, обучавшие принцев и ведшие хронику империи, и веселые исламские певцы хвалы. Каждый клан обладал наследственной монополией на свое ремесло и признанным местом при дворе Мансы. Строгая эндогамия и ритуальные табу отделяли ниамакалу от свободнорожденных хоронов, но взамен касты обладали корпоративной властью над своими профессиями, которую не мог легко отменить ни один королевский указ: институциональная основа ремесла и памяти Мандена." #NT!
  
 mal_ton_tigi_cavalry_bureaucracy: "Кавалерийский орден Тон-тиги" #NT!
 mal_ton_tigi_cavalry_bureaucracy_desc: "Носители колчана, шестнадцать воинских родов, которым в Курукан Фуга было предоставлено право носить оружие во имя Мансы. Фарари (храбрые люди) тон-тиги, верхом на сахельских лошадях, привезенных через транссахарскую торговлю и оснащенные импортными кольчугами и копьями, были ударной силой империи и личной свитой манса в походе. Их наследственные привилегии, включая право удерживать пленников в качестве королевских рабов дионов, сделали их незаменимой, но капризной аристократической основой военной мощи Мандена и, в конечном итоге, ее уничтожением." #NT!
