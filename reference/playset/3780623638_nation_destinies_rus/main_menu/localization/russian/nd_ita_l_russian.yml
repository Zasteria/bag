l_russian:
 STATIC_MODIFIER_NAME_nd_ita_patria_unita: "Патрия Юнита" #NT!
 STATIC_MODIFIER_DESC_nd_ita_patria_unita: "Италия превратилась в единое национальное государство с централизованным правлением. Мечта Мадзини и Гарибальди стала реальностью: один народ, одно правительство, одна судьба." #NT!
 STATIC_MODIFIER_NAME_nd_ita_repubblica_delle_citta: "Республика города Читта" #NT!
 STATIC_MODIFIER_DESC_nd_ita_repubblica_delle_citta: "Италия восприняла свое наследие как созвездие великих городов (Венеция, Флоренция, Милан, Неаполь), каждый из которых внес свой гений в федеративную республику, которая превыше всего ценит свободу, торговлю и образование." #NT!
 STATIC_MODIFIER_NAME_nd_ita_arsenale_naval_supremacy: "Арсенал «Морское превосходство»" #NT!
 STATIC_MODIFIER_DESC_nd_ita_arsenale_naval_supremacy: "Огромные арсеналы Италии производят военные галеры с непревзойденной скоростью в Средиземноморье, и наши капитаны знают, как ими пользоваться." #NT!
 STATIC_MODIFIER_NAME_nd_ita_arsenale_merchant_fleet: "Торговый флот Арсенале" #NT!
 STATIC_MODIFIER_DESC_nd_ita_arsenale_merchant_fleet: "Традиция итальянского судостроения была обращена в сторону коммерции, создавая торговый флот, который доставляет товары из Леванта во Фландрию." #NT!
 STATIC_MODIFIER_NAME_nd_ita_irredenta_march: "Италия Ирредента Март" #NT!
 STATIC_MODIFIER_DESC_nd_ita_irredenta_march: "По всему полуострову горят огни национального пробуждения. Добровольцы стекаются под знамя единой Италии, маршируя, чтобы вернуть себе каждый дюйм италоязычной территории." #NT!
 STATIC_MODIFIER_NAME_nd_ita_nation_building: "Национальное здание" #NT!
 STATIC_MODIFIER_DESC_nd_ita_nation_building: "Мечта об итальянской государственности была завоевана на поле боя; теперь его необходимо закрепить с помощью школ, железных дорог и институтов, которые объединят полуостров в настоящую нацию." #NT!
 nd_ita.1.t: "Рождение Италии" #NT!
 nd_ita.1.d: "Наконец итальянский полуостров объединился под одним знаменем. На протяжении веков земля Данте, Макиавелли и да Винчи была разделена между враждующими городами-государствами, иностранными повелителями и папскими территориями. Теперь с этой фрагментацией покончено.\n\nНо единство поднимает фундаментальный вопрос: какой это должна быть Италия? Традиции полуострова тянутся в двух направлениях. Один путь ведет к централизованному королевству, современному национальному государству с едиными законами, национальной армией и единой столицей, созданному по образцу великих держав Европы. Другой путь прославляет итальянского гения гражданского самоуправления, традицию коммуны, которая создала Флоренцию, Венецию и Геную, каждая из которых является республикой беспрецедентного богатства и культуры.\n\nЭтот выбор определит судьбу Италии на многие поколения.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ita.1.a: "Одна неделимая нация: создайте Королевство Италия." #NT!
 nd_ita.1.b: "Республика великих городов: пусть каждый внесёт свой гений." #NT!
 nd_ita.2.t: "Арсенал Республики" #NT!
 nd_ita.2.d: "Огромные арсеналы Италии достигли вершины производительности. В Венеции Арсенал, занимающий сорок пять гектаров восточного побережья города, может за один день оборудовать целую военную галеру — промышленный подвиг, не имеющий аналогов нигде в Европе. В его стенах трудятся шестнадцать тысяч арсеналотти, организованных в специализированные гильдии пилорезов, конопаток, изготовителей весел и прядильных машин.\n\nЭта традиция промышленного судостроения распространилась на другие итальянские порты. Генуя, Неаполь и Ливорно создали свои собственные арсеналы, каждая из которых учится на венецианской модели. Теперь вопрос в том, как использовать этот морской потенциал." #NT!
 nd_ita.2.a: "Расширяйте флот: Средиземное море – наше море." #NT!
 nd_ita.2.b: "Инвестируйте в торговое судоходство: коммерция – наша сила." #NT!
 nd_ita.3.t: "Банкиры Флоренции" #NT!
 nd_ita.3.d: "В счетных домах Флоренции революция в финансах изменила способ ведения бизнеса в Европе. Великие банкирские семьи (Медичи, Барди, Перуцци, Строцци) изобрели кредитные инструменты, которые позволяют перемещать богатство на огромные расстояния, даже не прикасаясь к золотой монете.\n\nВекселя, аккредитивы и sistema di partita doppia, двойная бухгалтерия, позволяют итальянским банкирам отслеживать каждую транзакцию с математической точностью. Их филиальная сеть простирается от Лондона до Константинополя, а флорин стал валютой международной торговли. И короли, и папы в равной степени зависят от итальянского кредита для финансирования своих амбиций." #NT!
 nd_ita.3.a: "Богатство наций течет через наши банки." #NT!
 nd_ita.4.t: "Рисорджименто" #NT!
 nd_ita.4.d: "Великое пробуждение охватывает Итальянский полуостров. В тайных ложах и на площадях, в брошюрах и стихах загорелась мечта об итальянской государственности. Движение Джузеппе Мадзини «Молодая Италия» посеяло семя; теперь оно приносит плоды в форме массового политического движения, выходящего за пределы старых границ королевства и герцогства.\n\nЗаговорщики-карбонарии, добровольцы Краснорубашечников Гарибальди, дипломатическая хитрость Кавура: все они сошлись к одной цели. Иноземное иго сброшено, мелкие княжества распались. Италия, земля, давшая миру эпоху Возрождения и римское право, теперь возвращает себе место среди великих наций.\n\nЭто момент, который требует видения будущего." #NT!
 nd_ita.4.a: "Марш вперед! Италия ирредента должна быть возвращена." #NT!
 nd_ita.4.b: "Стройте нацию: школы, железные дороги и институты." #NT!
 nd_ita.5.t: "Галеас на войне" #NT!
 nd_ita.5.d: "Итальянские военно-морские инженеры усовершенствовали галеас — революционный военный корабль, сочетающий в себе маневренность галеры с огневой мощью парусного военного корабля. Эти плавучие крепости, оснащенные тяжелыми орудиями на сплошной палубе над гребцами, могут наносить сокрушительные залпы, сохраняя при этом способность действовать в мелких, изменчивых ветрах водах Средиземного моря.\n\nВ великой битве при Лепанто в 1571 году шесть венецианских галеасов поставили на якорь христианскую линию, их сосредоточенный артиллерийский огонь разбил османские порядки еще до того, как флот приблизился к абордажу. Галеас доказал, что решающим фактором в морском сражении может стать огневая мощь, а не только таран и абордаж." #NT!
 nd_ita.5.a: "Наши корабли — стены Италии." #NT!
 nd_ita_communal_governance: "Коммунальное управление" #NT!
 nd_ita_communal_governance_desc: "Итальянская коммуна, самоуправляющаяся городская республика, является одним из наиболее выдающихся политических нововведений средневекового мира. В таких городах, как Флоренция, Сиена и Лукка, были развиты сложные системы выборных советов, письменных конституций и гражданских судей." #NT!
 nd_ita_maritime_republics: "Морские республики" #NT!
 nd_ita_maritime_republics_desc: "Венеция, Генуя, Пиза и Амальфи — четыре морские республики, чьи торговые флоты и военные галеры на протяжении веков доминировали в средиземноморской торговле, создавая торговые посты и колонии от Черного моря до Атлантики." #NT!
 nd_ita_guelf_ghibelline: "Гвельф и Гибеллин" #NT!
 nd_ita_guelf_ghibelline_desc: "Великая фракционная борьба между папскими гвельфами и имперскими гибеллинами формировала итальянскую политику на протяжении двух столетий, формируя традицию жесткой гражданской лояльности и политической изощренности, рожденную в результате постоянных переговоров между конкурирующими державами." #NT!
 nd_ita_florentine_banking: "Флорентийское банковское дело" #NT!
 nd_ita_florentine_banking_desc: "Великие банкирские дома Флоренции (Медичи, Барди и Перуцци) изобрели современные финансы: векселя, двойную бухгалтерию и международные сети филиалов, которые перемещали капитал по Европе." #NT!
 nd_ita_silk_trade: "Итальянская торговля шелком" #NT!
 nd_ita_silk_trade_desc: "Шелковые мастерские Лукки, Флоренции и Венеции производили ткани легендарного качества, сочетая импортируемый с Востока шелк-сырец с итальянскими технологиями крашения и ткачества для создания самого востребованного текстиля в Европе." #NT!
 nd_ita_condottiero_tradition: "Кондотьеро Традиция" #NT!
 nd_ita_condottiero_tradition_desc: "Кондотьеры, профессиональные капитаны-наемники и их роты, превратили итальянскую войну в изысканное искусство. Такие лидеры, как Сфорца, Коллеони и Хоквуд, командовали армиями улан и арбалетчиков в доспехах по контракту с городом-государством, предложившим самую высокую цену." #NT!
 nd_ita_venetian_shipcraft: "Венецианское кораблестроение" #NT!
 nd_ita_venetian_shipcraft_desc: "Арсенал Венеции был крупнейшим промышленным комплексом в доиндустриальном мире, способным произвести полностью оборудованный военный корабль за один день. Его конвейерные методы предвосхитили промышленную революцию на четыре столетия." #NT!
 nd_ita_humanist_learning: "Гуманистическое обучение" #NT!
 nd_ita_humanist_learning_desc: "Studia humanitatis (изучение классических латинских и греческих текстов, риторики, истории и моральной философии) началась в Италии с Петраркой и Боккаччо, создав интеллектуальное движение, изменившее европейскую цивилизацию." #NT!
 nd_ita_galleass_warfare: "Галлеасская война" #NT!
 nd_ita_galleass_warfare_desc: "Галеас, разработанный в Венецианском арсенале, представлял собой революционный военный корабль, оснащенный тяжелой бортовой артиллерией над рядами весел. В битве при Лепанто в 1571 году шесть венецианских галеасов разрушили строй османского флота еще до того, как флоты сомкнулись." #NT!
 nd_ita_murano_glasscraft: "Ремесло из муранского стекла" #NT!
 nd_ita_murano_glasscraft_desc: "Производители стекла Мурано, изолированные на своем острове для защиты коммерческой тайны, разработали непревзойденные по сложности технологии (хрустальное стекло, миллефиори, латтимо), которые сделали венецианское стекло самым ценным предметом роскоши в Европе." #NT!
 nd_ita_commedia_dell_arte: "Комедия дель Арте" #NT!
 nd_ita_commedia_dell_arte_desc: "Итальянская театральная традиция импровизационной комедии с ее стандартными персонажами (Арлекино, Коломбина, Панталоне, Дотторе) распространилась по Европе, сделав итальянских исполнителей самыми знаменитыми артистами континента." #NT!
 nd_ita_palazzo_civic_tradition: "Палаццо Гражданская Традиция" #NT!
 nd_ita_palazzo_civic_tradition_desc: "Palazzo pubblico, гражданский дворец, был архитектурным выражением итальянского общинного управления. От Палаццо Веккьо во Флоренции до Дворца дожей в Венеции — в этих зданиях размещались советы, суды и архивы, управлявшие самыми сложными городскими властями в Европе." #NT!
 nd_ita_counter_reformation: "Контрреформация" #NT!
 nd_ita_counter_reformation_desc: "Италия находилась в центре католической контрреформации. Тридентский собор (1545–1563), основание ордена иезуитов и римская инквизиция — все они возникли на итальянской земле, подтвердив католическую ортодоксальность и начав кампанию духовного обновления." #NT!
 nd_ita_accademia_tradition: "Академия Традиций" #NT!
 nd_ita_accademia_tradition_desc: "Италия стала пионером современной академии: Академия делла Круска стандартизировала итальянский язык, Академия Линчеи развивала естественные науки (включая Галилея среди ее членов), а бесчисленные художественные академии готовили лучших художников и скульпторов Европы." #NT!
 nd_ita_grand_tour: "Гранд-тур" #NT!
 nd_ita_grand_tour_desc: "К 18 веку образование ни одного европейского джентльмена не было полным без Гранд-тура по Италии. Руины Рима, искусство Флоренции, музыка Неаполя и каналы Венеции привлекали тысячи богатых путешественников, делая Италию культурной столицей цивилизованного мира." #NT!
 nd_ita_enlightened_reforms: "Просвещенные реформы" #NT!
 nd_ita_enlightened_reforms_desc: "Итальянские мыслители эпохи Просвещения («О преступлениях и наказаниях» Чезаре Беккариа, «Наука о законодательстве» Гаэтано Филанджери) изменили европейское мышление о справедливости, управлении и правах личности. Их идеи повлияли на реформаторов от Екатерины Великой до Томаса Джефферсона." #NT!
 nd_ita_risorgimento: "Рисорджименто" #NT!
 nd_ita_risorgimento_desc: "Великое движение за национальное объединение Италии (движимое идеализмом Мадзини, военным гением Гарибальди и дипломатической хитростью Кавура) превратило «географическое выражение» в национальное государство. Ее символом стали Берсальери, элитная легкая пехота в характерных шляпах с перьями." #NT!
 nd_ita_carbonari_networks: "Сети карбонариев" #NT!
 nd_ita_carbonari_networks_desc: "Карбонарии, «угольщики», были самым влиятельным тайным революционным обществом Италии. Действуя посредством закодированных ритуалов и тайных ячеек по всему полуострову, они организовали восстания против иностранного правления и посеяли семена итальянского национализма." #NT!
 nd_ita_industrial_awakening: "Промышленное пробуждение" #NT!
 nd_ita_industrial_awakening_desc: "Пьемонт и Ломбардия возглавили промышленную трансформацию Италии: программа строительства железных дорог Кавура, сталелитейный завод Ансальдо в Генуе и текстильные фабрики долины По принесли современную промышленность в страну, долгое время определяемую сельским хозяйством и ремеслом." #NT!
 nd_ita_national_education: "Национальное образование" #NT!
 nd_ita_national_education_desc: "Закон Казати 1859 года и последующие реформы образования создали единую итальянскую школьную систему, борясь с крайней региональной неграмотностью на полуострове и формируя общую национальную идентичность посредством преподавания стандартного итальянского языка." #NT!
 nd_ita_irredentism: "Италия Ирредента" #NT!
 nd_ita_irredentism_desc: "Доктрина Italia Irredenta, «неискупленной Италии», требовала включения всех италоязычных территорий, особенно Трентино, Триеста, Истрии и Далмации, в состав итальянского государства, стимулируя дипломатические амбиции и военное планирование." #NT!
 a_nd_ita_condottiero_lances: "Кондотьеро Лансес" #NT!
 a_nd_ita_condottiero_lances_desc: "Тяжелая кавалерия в традициях кондотьеров, эти бронированные уланы служат по контракту и известны своими разрушительными атаками и тактической гибкостью." #NT!
 a_nd_ita_condottiero_lances_levy: "Кондотьеро Лансес" #NT!
 a_nd_ita_condottiero_lances_levy_desc: "Кавалерия-наемница, воспитанная в традициях итальянских кондотьеров, представляет собой всадников в доспехах, опирающихся на многовековой опыт наемнической войны." #NT!
 n_nd_ita_galleass: "Галеас" #NT!
 n_nd_ita_galleass_desc: "Массивный военный корабль, сочетающий в себе мощь весел и бортовую артиллерию. Разработанный в Венеции, галеас оснащен тяжелыми пушками на сплошной орудийной палубе над гребцами, обеспечивая разрушительную огневую мощь, сохраняя при этом маневренность в водах Средиземного моря." #NT!
 a_nd_ita_bersaglieri: "Берсальери" #NT!
 a_nd_ita_bersaglieri_desc: "Элитная легкая пехота эпохи Рисорджименто, известная своей скоростью, меткостью и агрессивной тактикой. Их можно отличить по характерным широкополым шляпам, украшенным перьями глухаря." #NT!
 nd_ita_banco: "Банко" #NT!
 nd_ita_banco_desc: "Итальянский банковский дом, придерживающийся флорентийских традиций, содействующий международной торговле посредством векселей, аккредитивов и сети филиалов, простирающейся по всей Европе." #NT!
 nd_ita_setificio: "Сетифисио" #NT!
 nd_ita_setificio_desc: "Итальянская шелковая мастерская, где мастера-ткачи превращают шелк-сырец и красители в прекрасные ткани исключительного качества, продолжая традиции, усовершенствованные в Лукке, Флоренции и Венеции." #NT!
 nd_ita_arsenale: "Арсенале" #NT!
 nd_ita_arsenale_desc: "Огромный комплекс верфей, созданный по образцу венецианского арсенала, где тысячи специализированных мастеров производят военные и торговые суда с непревзойденной в мире эффективностью." #NT!
 nd_ita_palazzo_comunale: "Палаццо Комунале" #NT!
 nd_ita_palazzo_comunale_desc: "Гражданский дворец, в котором размещаются органы общинного управления (избираемые советы, суды и административные архивы), олицетворяющий итальянскую традицию городского самоуправления." #NT!
 nd_ita_accademia: "Академия" #NT!
 nd_ita_accademia_desc: "Академия искусств и наук в итальянской традиции, где ученые, художники и натурфилософы развивают человеческие знания и совершенствуют итальянский язык и культуру." #NT!
 nd_ita_vetreria: "Ветрерия" #NT!
 nd_ita_vetreria_desc: "Стекольный завод в муранском стиле, где мастера производят кристалло, миллефиори и латтимо, используя тщательно охраняемые венецианские технологии." #NT!
 nd_ita_manifattura: "Манифаттура" #NT!
 nd_ita_manifattura_desc: "Итальянская промышленная мануфактура, производящая сталь и готовую продукцию, олицетворяющая промышленную трансформацию, сопровождавшую национальное объединение." #NT!
 nd_ita_carbonari_lodge: "Карбонари Лодж" #NT!
 nd_ita_carbonari_lodge_desc: "Тайное место встреч революционного общества карбонариев, где собираются патриоты, чтобы заговорить против иностранного господства и продвигать дело итальянской государственности." #NT!
 nd_ita_silk_weaving: "Итальянское шелковое ткачество" #NT!
 nd_ita_silk_weaving_desc: "Известная итальянская техника плетения из шелка-сырца и красок тонких тканей исключительного качества, усовершенствованная в мастерских Флоренции, Лукки и Венеции." #NT!
 nd_ita_banking_operations: "Банковские операции" #NT!
 nd_ita_banking_operations_desc: "Административный аппарат итальянского банковского дома: служащие, ведущие книги двойной бухгалтерии, обработка векселей и ведение международной корреспонденции в тонких записях в тканевых переплетах." #NT!
 nd_ita_arsenale_maintenance: "Техническое обслуживание Арсенала" #NT!
 nd_ita_arsenale_maintenance_desc: "Постоянные поставки древесины, смолы, инструментов и военно-морских запасов требовались для поддержания работоспособности огромного верфевого комплекса и строительства военных кораблей." #NT!
 nd_ita_venetian_glassmaking: "Венецианское стеклоделие" #NT!
 nd_ita_venetian_glassmaking_desc: "Тайное искусство изготовления муранского стекла: производство кристалло, миллефиори и других изысканных изделий из стекла с использованием технологий, тщательно охраняемых венецианскими властями." #NT!
 nd_ita_palazzo_upkeep: "Содержание Палаццо" #NT!
 nd_ita_palazzo_upkeep_desc: "Камень, административные документы и изысканная тканевая мебель, необходимые для поддержания палаццо-коммунале и его бюрократических функций в должном гражданском достоинстве." #NT!
 nd_ita_accademia_upkeep: "Академическое содержание" #NT!
 nd_ita_accademia_upkeep_desc: "Книги, бумага и стеклянные научные инструменты, необходимые для поддержания академических исследований, от телескопов Галилея до аптечных аппаратов." #NT!
 nd_ita_steel_forging: "Итальянская стальная ковка" #NT!
 nd_ita_steel_forging_desc: "Современное производство стали с использованием итальянских методов, сочетающее традиции ломбардской обработки железа с промышленными технологиями для производства высококачественной стали для строительства и вооружения." #NT!
 nd_ita_carbonari_upkeep: "Содержание карбонариев" #NT!
 nd_ita_carbonari_upkeep_desc: "Брошюры, манифесты и вино, которые поддерживают сеть революционных ячеек, патриоты встречаются в тавернах, обсуждая освобождение над книгами по политической философии." #NT!
 levy_nd_ita_condottiero_lances: "Кондотьеро Леви Лансес" #NT!
 levy_nd_ita_condottiero_lances_desc: "Кавалерия-леви, воспитанная в традициях итальянских кондотьеров." #NT!
 nd_ita_formed_tt: "Италия была образована" #NT!
 nd_ita_path_a_tt: "Выберите судьбу #bold Patria Unita#!" #NT!
 nd_ita_path_b_tt: "Выберите судьбу #bold Repubblica delle Citta#!." #NT!
 nd_ita_destiny: "Итальянская судьба" #NT!
 nd_ita_destiny_desc: "Италия едина, но единство — это только начало. Полуостров, давший миру Рим, эпоху Возрождения и основы современной цивилизации, теперь должен выбрать свое будущее среди великих держав. Стабилизируйте новую нацию и наметьте свой курс." #NT!
 nd_ita.6.t: "Итальянская судьба" #NT!
 nd_ita.6.d: "Мечта об итальянском единстве осуществилась. От Альп до Сицилии, от Лигурийского побережья до Адриатического побережья полуостров един. Но остается главный вопрос: чем станет Италия?\n\nОсновы заложены. Теперь мы должны опираться на них целенаправленно, амбициозно и осознавая, что мы являемся наследниками как Рима, так и Ренессанса. Будущее Средиземноморья, а возможно, и самой Европы, зависит от выбора, который мы сделаем в этот решающий час." #NT!
 nd_ita.6.a: "Судьба Италии начинается сейчас." #NT!
 nd_ita.7.t: "Неискупленные земли" #NT!
 nd_ita.7.d: "Наконец триколор пролетает над Триестом и Тренто. На протяжении десятилетий итальянские патриоты говорили о terre rerrente, неискупленных землях, где говорили по-итальянски, но развевались иностранные флаги. Теперь они итальянцы.\n\nАрмия, совершившая этот подвиг, закалена в горниле ирредентистской войны. Наши солдаты знают, что значит бороться за национальную честь, а генеральный штаб доказал свою способность к общевойсковым операциям против великой европейской державы. Италия объявила о своем выходе на историческую сцену." #NT!
 nd_ita.7.a: "Каждый дюйм итальянской земли принадлежит нам." #NT!
 nd_ita.8.t: "Четвертый берег" #NT!
 nd_ita.8.d: "Итальянские сапоги ступают по пескам Северной Африки. Тунис и Триполитания, земли, которые когда-то составляли житницу Римской империи, теперь переходят под итальянский флаг. Средиземноморье больше не барьер, а мост, соединяющий метрополию с ее новыми африканскими провинциями.\n\nНо заморская империя требует выбора. Некоторые выступают за быстрое наращивание военной мощи, набор колониальных полков, создание гарнизонов и подготовку к следующей войне за расширение. Другие видят ценность военно-морского господства, контроля над морскими путями, соединяющими Италию с ее новыми владениями, и проецирования силы через флот, а не через казармы." #NT!
 nd_ita.8.a: "Поднимите легионы: Африке нужны солдаты." #NT!
 nd_ita.8.b: "Управляйте морем: флот – наша сила." #NT!
 nd_ita.9.t: "Маре Нострум" #NT!
 nd_ita.9.d: "Mare Nostrum, Наше Море. Слова древних римлян вновь звучат правдоподобно. От Мальты до берегов Египта, от Салоник до побережий Ливии итальянский флаг вызывает уважение по всему Средиземноморью.\n\nЭто не просто империя территории, но и империя влияния, торговых путей и узких мест, культурного престижа и военной мощи. Италия достигла того, чего не удавалось ни одному итальянскому государству со времен падения Рима: господства над внутренним морем.\n\nТеперь вопрос в том, как владеть этой властью. Некоторые призывают к новой римской империи, централизованной власти, массовым наборам войск и дипломатическому весу истинно великой державы. Другие выступают за стратегию крепостей, делающую позиции Италии в Средиземноморье неприступными благодаря итальянским укреплениям, впервые созданным итальянскими инженерами." #NT!
 nd_ita.9.a: "Восстановить римскую империю." #NT!
 nd_ita.9.b: "Укрепляйте каждую позицию: Италия неприступна." #NT!
 nd_ita.10.t: "Стато да Мар" #NT!
 nd_ita.10.d: "Лев Святого Марка однажды пролетал над торговыми факториями Адриатики и крепостями Ионического побережья. Теперь Италия наследует это наследие не как единая морская республика, а как конфедерация великих городов, каждый из которых вносит свой вклад в общую коммерческую судьбу.\n\nВенецианские купцы занимаются торговлей пряностями, генуэзские банкиры финансируют предприятия, флорентийские мастерские перерабатывают шелк-сырец в тонкую ткань, а неаполитанские корабелы строят галеры, которые перевозят все это. Доминио-да-Мар снова оживает, это итальянское Средиземноморье, где царит торговля." #NT!
 nd_ita.10.a: "Море — наш рынок." #NT!
 nd_ita.11.t: "Банк Италии" #NT!
 nd_ita.11.d: "Итальянское банковское дело вернуло себе древнее превосходство. Традиции Медичи и Барди продолжают жить в современной форме: единая итальянская банковская система, которая управляет потоком капитала по Европе. Векселя, выписанные на итальянские дома, принимаются от Лондона до Константинополя, а золотые запасы Банка Италии могут соперничать с запасами любой страны.\n\nПосле того, как Крит, величайший перевалочный пункт центрального Средиземноморья, обеспечен, итальянские торговые сети теперь тянутся непрерывно от западного Средиземноморья до Леванта. Вопрос в том, как использовать эту финансовую мощь." #NT!
 nd_ita.11.a: "Дипломатия и влияние: путь Медичи." #NT!
 nd_ita.11.b: "Монополизируйте маршруты: контролируйте торговлю." #NT!
 nd_ita.12.t: "Всемирный Ренессанс" #NT!
 nd_ita.12.d: "Цифры не лгут. Итальянские города лидируют в мире по численности населения, богатству, производству товаров, как изысканных, так и обычных. Итальянские банки контролируют поток капитала из стран Балтии в Левант. Итальянские учебные заведения устанавливают стандарты, которых стремятся достичь все остальные.\n\nЭто не просто процветание. Это второй Ренессанс. Если первое Rinascimento возродило искусство и литературу древности, то это Rinascimento Universale создало нечто новое: цивилизацию торговли, культуры и инноваций, которая распространилась за пределы итальянского полуострова, чтобы преобразовать мир. Вопрос теперь в том, как сохранить этот золотой век." #NT!
 nd_ita.12.a: "Инвестируйте в знания: идеи вечны." #NT!
 nd_ita.12.b: "Постройте инфраструктуру процветания." #NT!
 nd_ita_fortezza_moderna: "Фортецца Модерна" #NT!
 nd_ita_fortezza_moderna_desc: "Современный итальянский крепостной комплекс, включающий в себя Trace Italienne, угловатую конструкцию бастиона, которую впервые разработали итальянские военные инженеры и которая произвела революцию в оборонительной войне по всей Европе." #NT!
 nd_ita_fortezza_maintenance: "Обслуживание крепости" #NT!
 nd_ita_fortezza_maintenance_desc: "Камень, железо и огнестрельное оружие, необходимые для поддержания современной итальянской крепости в боевой готовности." #NT!
 nd_ita_conservatorio: "Консерватория" #NT!
 nd_ita_conservatorio_desc: "Итальянская консерватория музыки и искусств, где композиторы, музыканты и исполнители обучаются традициям, породившим Вивальди, Монтеверди и оперную форму, покорившую сцены Европы." #NT!
 nd_ita_conservatorio_upkeep: "Содержание консерватории" #NT!
 nd_ita_conservatorio_upkeep_desc: "Бумага, тонкая ткань и стеклянные инструменты, необходимые для поддержания консерватории и ее артистов в итальянских традициях." #NT!
 nd_ita_dest_irredenta: "Италия Ирредента" #NT!
 nd_ita_dest_irredenta_desc: "Земля ирреденте (Триест, Тренто и италоязычные земли, все еще находящиеся под иностранным правлением) должна быть возвращена. Соберите армию, достойную этого дела, и отправляйтесь в поход, чтобы освободить каждый дюйм итальянской земли." #NT!
 nd_ita_dest_quarta_sponda: "Четвертый берег" #NT!
 nd_ita_dest_quarta_sponda_desc: "Южное побережье Средиземного моря, Тунис и Триполитания, когда-то питали Римскую империю. Имея за нашей спиной профессиональную армию, Италия сможет создать свою африканскую империю и контролировать центральное Средиземноморье." #NT!
 nd_ita_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_ita_dest_mare_nostrum_desc: "Mare Nostrum, Наше Море. От Салоник до Александрии, от Смирны до Мессинского пролива Италия должна контролировать весь Средиземноморский бассейн. Только тогда наследники Рима действительно восстановят империю." #NT!
 nd_ita_dest_stato_da_mar: "Стато-да-Мар" #NT!
 nd_ita_dest_stato_da_mar_desc: "Венецианское Стато-да-Мар, морское государство, было построено на основе торгового превосходства Адриатики. Обезопасьте Рагузу, обеспечьте поток итальянского шелка через наши рынки и заложите основу для коммерческой империи, которая может соперничать со Светлейшей." #NT!
 nd_ita_dest_banca_italia: "Банк Италии" #NT!
 nd_ita_dest_banca_italia_desc: "Итальянское банковское дело должно вернуть себе превосходство эпохи Медичи. Обеспечьте безопасность Крита как ключевого пункта в центральном Средиземноморье, наполните казну и примите участие в банковской революции, пионерами которой стали итальянские финансисты." #NT!
 nd_ita_dest_rinascimento: "Универсальное восстановление" #NT!
 nd_ita_dest_rinascimento_desc: "В результате всеобщего возрождения Италия должна стать самой богатой, самой развитой и наиболее коммерчески связанной страной в мире. Освойте глобальную торговлю, наполните казну и развивайте полуостров, пока он не станет бесспорным центром цивилизации." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_legioni_africane: "Легиони Африканский" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_legioni_africane: "Итальянские африканские легионы и колониальные полки набирались, обучались и располагались гарнизонами для удержания Четвертого берега и подготовки к дальнейшей экспансии по побережью Средиземного моря." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_dominio_dei_mari: "Доминио дей Мари" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_dominio_dei_mari: "Итальянский флот управляет волнами между Сицилией и африканским побережьем, проецируя свою мощь за счет военно-морского господства, а не гарнизонов — морская стратегия, достойная венецианских и генуэзских традиций." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_imperium_romanum: "Новая Империя Романум" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_imperium_romanum: "Новая Римская империя, Италия, обладает агрессивной военной мощью настоящего средиземноморского гегемона, быстро распространяя силу по своим владениям, хотя напряжение постоянных кампаний берет свое." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_traccia_italiana: "Трачча Италияна" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_traccia_italiana: "Trace italienne, угловатые бастионные укрепления, впервые созданные итальянскими военными инженерами, превращают каждую итальянскую позицию по всему Средиземноморью в неприступную цитадель, защищенную современной артиллерией." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_diplomazia_medicea: "Диплом Медиа" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_diplomazia_medicea: "Путь Медичи: влияние через финансы, дипломатия через щедрость, власть через воспитание друзей. Итальянских послов приветствуют при каждом дворе, а итальянский кредит открывает каждую дверь." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_monopolio_rotte: "Монополио делле Ротте" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_monopolio_rotte: "Итальянские купцы и банкиры захватили самые выгодные торговые пути в Средиземноморье, извлекая богатство из каждой сделки; хотя такая агрессивная торговля приводит к росту цен." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_rinascimento_universale: "Универсальное восстановление" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_rinascimento_universale: "Всеобщее возрождение, итальянские институты, академии и мастерские способствуют развитию человеческих знаний, привлекая таланты со всего мира и гарантируя, что идеи, рожденные в Италии, изменят цивилизацию." #NT!
 STATIC_MODIFIER_NAME_nd_ita_dest_crocevia_continenti: "Крочевия дей Континенти" #NT!
 STATIC_MODIFIER_DESC_nd_ita_dest_crocevia_continenti: "Италия стоит на перекрестке континентов, космополитическая коммерческая империя, где приветствуются разные народы, инфраструктура построена на длительный срок, а лояльность подданных зарабатывается процветанием, а не силой." #NT!
  
  # ===== BUREAUCRACIES ===== 
 ita_consiglio_dei_dieci_bureaucracy: "Консильо деи Диечи" #NT!
 ita_consiglio_dei_dieci_bureaucracy_desc: "Основанный 25 июня 1310 года после провала заговора Тьеполо и ставший постоянным в 1335 году, Венецианский совет десяти управлял республиканской разведкой и трибуналом по политическим преступлениям. Анонимные обвинения проскользнули через bocche di leone, минуя более медленный Maggior Consiglio, предоставив государству быстрый инструмент против измены ценой негодования патрициев." #NT!
 ita_casa_di_san_giorgio_bureaucracy: "Каса ди Сан Джорджио" #NT!
 ita_casa_di_san_giorgio_bureaucracy_desc: "Основанный 23 апреля 1407 года для консолидации растущих военных долгов Генуи перед Венецией, Casa delle compere e dei Banchi di San Giorgio управлял передаваемыми акциями луоги, соляной монополией и налоговыми фермами республики. Провозглашенный первым в мире современным государственным банком, он предшествовал Банку Англии почти на три столетия и поддерживал генуэзский кредит до подавления Наполеоном в 1805 году." #NT!
 ita_santo_uffizio_bureaucracy: "Сант-Уффицио" #NT!
 ita_santo_uffizio_bureaucracy_desc: "Булла Папы Павла III Licet ab initio от 21 июля 1542 года учредила Высшую Священную Конгрегацию Римской и Всемирной инквизиции под руководством кардинала Карафы. Святая канцелярия действовала через епархиальные трибуналы по всему полуострову, управляла Индексом запрещенных книг с 1559 года и служила доктринальным судом Контрреформации." #NT!
 ita_arsenale_di_venezia_bureaucracy: "Арсенале Венеции" #NT!
 ita_arsenale_di_venezia_bureaucracy_desc: "Венецианская государственная верфь, нынешняя структура которой датируется 1104 годом при доже Орделафо Фальеро, была расширена Арсенале Нуово в 1320 году. На пике своего развития в начале 16 века на ней работало 16 000 арсеналотти, и она могла оборудовать галеру в день на линии по производству стандартизированных деталей, что сделало флот Республики двигателем ее торговой империи по всему Стато-да-Мар." #NT!
 ita_condotta_bureaucracy: "Система делла Кондотта" #NT!
 ita_condotta_bureaucracy_desc: "Итальянская система капитуляции, посредством которой города-государства 14-го и 15-го веков нанимали профессиональных кондотьеров по стандартным контрактам, в которых определялись ферма (период службы), оплата и апетто (интервал продления). Когда кондотта истекла, капитан не мог воевать со своим бывшим работодателем в течение двух лет. Система заменила гражданские ополчения благородными капитанами по контракту и доминировала в итальянской войне до вторжения Карла VIII в 1494 году." #NT!
 ita_accademie_bureaucracy: "Академия" #NT!
 ita_accademie_bureaucracy_desc: "Научные общества, институционализировавшие итальянскую высокую культуру: Академия делла Круска, основанная во Флоренции в 1583 году, закрепила литературный язык посредством своего словаря 1612 года, модели для более поздней Французской академии Ришелье; Accademia dei Lincei, основанная в Риме 17 августа 1603 года принцем Федерико Чези, была первой в мире научной академией, одним из первых членов которой был Галилео Галилей." #NT!
 ita_parlamento_siciliano_bureaucracy: "Парламент Сицилиано" #NT!
 ita_parlamento_siciliano_bureaucracy_desc: "Сицилийский парламент, восходящий к Курии Регис Рожера II в Мазаре в 1130 году и кодифицированный конституциями Фридриха II 1232 года. Три его brazos, militare (дворяне), ecclesiastico (духовенство) и demaniale (королевские города), встретились, чтобы предоставить пожертвования короне. Пережив правление арагонцев, испанцев и Бурбонов до 1816 года, это был самый долгоживущий парламентский институт на полуострове." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_ita_bureaucracy_authority: "Итальянская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_ita_bureaucracy_authority: "При формировании [ITA.GetName] унаследованные институциональные традиции Венеции, Генуи, Флоренции, Папской области и южных королевств становятся доступными в качестве переключаемой бюрократии единого государства." #NT!
