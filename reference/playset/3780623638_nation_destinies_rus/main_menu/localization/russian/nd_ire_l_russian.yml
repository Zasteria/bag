l_russian:
 STATIC_MODIFIER_NAME_nd_ire_gaelic_resurgence: "Гэльское возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_ire_gaelic_resurgence: "Верховный король восстановил древние законы и обычаи гэльского ордена. Судьи Брегона разрешают споры, фили сохраняют генеалогии, а кланы объединяются в суверенную Ирландию, свободную от иностранного вмешательства." #NT!
 STATIC_MODIFIER_NAME_nd_ire_atlantic_kingdom: "Атлантическое королевство" #NT!
 STATIC_MODIFIER_DESC_nd_ire_atlantic_kingdom: "Положение Ирландии на берегу Атлантического океана делает ее естественными воротами между Европой и остальным миром. Новое королевство строит корабли, привлекает иностранных торговцев и смотрит на запад, к открытому океану." #NT!
 nd_ire.1.t: "Верховное королевство Ирландии" #NT!
 nd_ire.1.d: "Кланы объединились, и Светлости Ирландии больше нет. Впервые за столетия один Верховный король говорит от имени всей Эрин. Но характер этого нового королевства еще предстоит определить. Судьи Брегона еще помнят старые законы, фили поют о древней славе, а люди все еще живут ритмами клановой системы. Тем не менее, Атлантика простирается далеко за пределы наших западных берегов, а порты Голуэй, Уотерфорд и Дублин кишат торговлей из-за моря.\n\nБудем ли мы искать в себе восстановление гэльского порядка, который поддерживал наших предков, или же вовне, к океану, который соединяет нас с миром?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ire.1.a: "Восстановить законы Брегона" #NT!
 nd_ire.1.b: "Постройте Атлантическое королевство" #NT!
 nd_ire.2.t: "Возрождение закона Брегона" #NT!
 nd_ire.2.d: "Правовая традиция Брегона, которая управляла ирландским обществом более тысячи лет, находится на перепутье. Эти законы (составленные судьями Брейтехема и передаваемые из поколения в поколение учеными-юристами) регулировали все: от землевладения до брака, от цены чести до лечения больных. Под давлением Англии брегонское право отступило за пределы черты оседлости, но оно никогда не умерло.\n\nТеперь возникает вопрос: должны ли мы формализовать и укрепить эти местные суды или постепенно перенять практику общего права, которая доминирует у наших соседей и облегчает международную торговлю?" #NT!
 nd_ire.2.a: "Укрепление судов Брехонов" #NT!
 nd_ire.2.b: "Принять практику общего права" #NT!
 nd_ire.3.t: "Девятилетняя война" #NT!
 nd_ire.3.d: "Великие гэльские лорды Хью О'Нил, граф Тайрон, и красный Хью О'Доннелл вели ожесточенную борьбу против английского вторжения. В битве при Желтом Форде в 1598 году силы О'Нила уничтожили английскую армию, доказав, что ирландские войска могут противостоять своим противникам в открытом бою благодаря дисциплине, использованию огнестрельного оружия и тактических инноваций. О'Нил обучил своих кернов обращению с пикой и мушкетом, создав первую современную ирландскую армию.\n\nХотя историческая кампания закончилась поражением при Кинсейле, военные уроки сохраняются. Ирландская война никогда не будет прежней." #NT!
 nd_ire.3.a: "Уроки Желтого Форда сохраняются" #NT!
 nd_ire.4.t: "Полет диких гусей" #NT!
 nd_ire.4.d: "После потрясений войны тысячи ирландских солдат отправились на континент, поступив на службу в армии Франции, Испании, Австрии и других стран. Эти «Дикие гуси» несут ирландские боевые традиции во все уголки Европы. Ирландская бригада на французской службе заслужит известность в Фонтенуа, а полки Ультония и Хиберния служат Испании от Фландрии до Америки.\n\nЭта диаспора представляет собой одновременно потерю и возможность. Солдаты, которые возвращаются, приносят с собой континентальный военный опыт, а те, кто остается за границей, налаживают связи, которые приносят пользу ирландской торговле и дипломатии." #NT!
 nd_ire.4.a: "Приветствуем наших ветеранов дома" #NT!
 nd_ire.4.b: "Развивайте связи с нашей диаспорой" #NT!
 STATIC_MODIFIER_NAME_nd_ire_brehon_courts: "Брехонские суды восстановлены" #NT!
 STATIC_MODIFIER_DESC_nd_ire_brehon_courts: "Древним бреонским судам была восстановлена ​​официальная власть, и они разрешают споры на основе местной ирландской правовой традиции." #NT!
 STATIC_MODIFIER_NAME_nd_ire_common_law_adoption: "Принятие общего права" #NT!
 STATIC_MODIFIER_DESC_nd_ire_common_law_adoption: "Практика английского общего права была принята наряду с местными традициями, что способствовало международным отношениям и стандартизации управления." #NT!
 STATIC_MODIFIER_NAME_nd_ire_continental_veterans: "Континентальные ветераны" #NT!
 STATIC_MODIFIER_DESC_nd_ire_continental_veterans: "Солдаты, возвращающиеся с континентальной службы, приносят с собой военную дисциплину и тактические знания лучших армий Европы." #NT!
 STATIC_MODIFIER_NAME_nd_ire_diaspora_bonds: "Облигации диаспоры" #NT!
 STATIC_MODIFIER_DESC_nd_ire_diaspora_bonds: "Ирландцы за рубежом поддерживают тесные связи со своей родиной, направляя торговые связи и дипломатическое влияние обратно в Ирландию." #NT!
 nd_ire_tower_house_tradition: "Традиция Тауэрского дома" #NT!
 nd_ire_tower_house_tradition_desc: "Пейзаж Ирландии усеян тысячами домов-башен: укрепленных каменных резиденций, которые служили одновременно резиденциями кланов и оборонительными опорными пунктами." #NT!
 nd_ire_brehon_law: "Брехон Лоу" #NT!
 nd_ire_brehon_law_desc: "Древний правовой кодекс гэльской Ирландии, управляемый судьями Брейтехема, регулирующий землю, брак, честь и социальные обязательства." #NT!
 nd_ire_cattle_lords: "Повелители крупного рогатого скота" #NT!
 nd_ire_cattle_lords_desc: "Крупный рогатый скот — основа богатства Ирландии. Лорды измеряли свой статус стадами, а набеги скота были как экономическими, так и политическими актами." #NT!
 nd_ire_tanistry: "Танистри" #NT!
 nd_ire_tanistry_desc: "Гэльская система выборной преемственности, при которой танист выбирается из числа подходящих родственников, чтобы стать преемником вождя." #NT!
 nd_ire_bardic_tradition: "Бардские школы" #NT!
 nd_ire_bardic_tradition_desc: "Бардские школы Ирландии обучают фили, поэтов-ученых, которые сохраняют генеалогию, право и историю посредством строгих устных и литературных традиций." #NT!
 nd_ire_tower_house_defense: "Оборона Башенного Дома" #NT!
 nd_ire_tower_house_defense_desc: "Башенные дома Ирландии улучшены с помощью машин, нор и более толстых стен, создавая сеть грозных опорных пунктов.\n\n#italic Доступно в: $nd_ire_tower_house$#!" #NT!
 nd_ire_gaelic_confederation: "Гэльская Конфедерация" #NT!
 nd_ire_gaelic_confederation_desc: "Великие гэльские лорды образуют конфедерацию под руководством Верховного короля, балансируя между клановой автономией и коллективной защитой." #NT!
 nd_ire_monastic_schools: "Монашеские школы" #NT!
 nd_ire_monastic_schools_desc: "Монашеская традиция Ирландии, которая когда-то принесла ей титул «Остров святых и ученых», продолжает способствовать обучению и грамотности." #NT!
 nd_ire_redshank_tradition: "Красноногие традиции" #NT!
 nd_ire_redshank_tradition_desc: "Шотландские наемники, известные как красноногие, уже давно пополняют ирландские армии. Их жестокая репутация и мобильность по морю делают их ценными союзниками." #NT!
 nd_ire_atlantic_fisheries: "Атлантическое рыболовство" #NT!
 nd_ire_atlantic_fisheries_desc: "Западное побережье Ирландии предлагает богатые рыболовные угодья, которые поддерживают прибрежные общины и обучают выносливых моряков." #NT!
 nd_ire_manuscript_tradition: "Рукописная традиция" #NT!
 nd_ire_manuscript_tradition_desc: "Традиция иллюминированных рукописей и научного копирования, зародившаяся в таких монастырях, как Келлс и Клонмакнойз, продолжается в бардских школах Ирландии.\n\n#italic Доступно: $nd_ire_bardic_school$#!" #NT!
 nd_ire_gaelic_lordship: "Гэльское светлость" #NT!
 nd_ire_gaelic_lordship_desc: "Консолидация гэльских владений под королевской властью уменьшает внутренние конфликты и укрепляет королевство перед внешними угрозами." #NT!
 nd_ire_atlantic_raiders: "Атлантические Рейдеры" #NT!
 nd_ire_atlantic_raiders_desc: "Ирландские каперы охотятся на вражескую торговлю на атлантических морских путях, превращая прибрежное положение Ирландии в стратегическое преимущество." #NT!
 nd_ire_nine_years_war: "Реформы девятилетней войны" #NT!
 nd_ire_nine_years_war_desc: "Военные инновации Хью О'Нила (обучение керна обращению с пикой и мушкетом, принятие европейской тактики) трансформируют ирландскую войну." #NT!
 nd_ire_wool_trade: "Ирландская торговля шерстью" #NT!
 nd_ire_wool_trade_desc: "Ирландские овцы производят превосходную шерсть, и экспортная торговля неуклонно растет, поскольку английские и континентальные торговцы ищут ирландскую шерсть.\n\n#italic Доступно в: $nd_ire_wool_cottage$#!" #NT!
 nd_ire_hedge_schools: "Хедж-школы" #NT!
 nd_ire_hedge_schools_desc: "Когда формальное образование подавляется, ирландцы открывают подпольные школы на открытом воздухе, где ученые преподают латынь, ирландский язык, математику и катехизис." #NT!
 nd_ire_wild_geese: "Дикие гуси" #NT!
 nd_ire_wild_geese_desc: "Ирландские солдаты, служащие в континентальных армиях, образуют элитные полки, известные своей храбростью. Ирландская бригада становится легендой на европейских полях сражений." #NT!
 nd_ire_linen_industry: "Льняная промышленность" #NT!
 nd_ire_linen_industry_desc: "Производство льна трансформирует ирландскую экономику. Выращивание и отбеливание льна быстро расширяются, что делает ирландский лен известным во всей Европе." #NT!
 nd_ire_provision_trade: "Продовольственная торговля" #NT!
 nd_ire_provision_trade_desc: "Ирландский экспорт соленой говядины, масла и свинины снабжает Атлантический мир, от военно-морских сил Европы до плантаций Карибского бассейна.\n\n#italic Доступно в: $nd_ire_bleach_green$#!" #NT!
 nd_ire_penal_resistance: "Уголовное сопротивление" #NT!
 nd_ire_penal_resistance_desc: "Несмотря на ограничительные законы, ирландские институты продолжают существовать благодаря подпольным сетям духовенства, ученых и общественных лидеров." #NT!
 nd_ire_whiskey_tradition: "Дистилляция виски" #NT!
 nd_ire_whiskey_tradition_desc: "Ирландский виски, дистиллированный из ячменя и выдержанный в дубе, становится одним из самых знаменитых экспортных товаров Ирландии и символом национальной идентичности." #NT!
 nd_ire_parliamentary_tradition: "Парламентская традиция" #NT!
 nd_ire_parliamentary_tradition_desc: "Ирландский парламент, вдохновленный Граттаном и волонтерами, утверждает независимость законодательной власти и право на самоуправление." #NT!
 nd_ire_diaspora_networks: "Сети диаспоры" #NT!
 nd_ire_diaspora_networks_desc: "Ирландская диаспора охватывает весь атлантический мир, создавая сети торговли, влияния и солидарности, которые соединяют Ирландию со всеми крупными портами." #NT!
 nd_ire_revolutionary_spirit: "Революционный дух" #NT!
 nd_ire_revolutionary_spirit_desc: "Традиции Вулфа Тона и Объединенных ирландцев вдохновляют поколение, готовое бороться за свободу, равенство и национальный суверенитет." #NT!
 nd_ire_tower_house: "Тауэрский дом" #NT!
 nd_ire_tower_house_desc: "Укрепленная каменная башня, обычно четырехэтажная и более, служащая резиденцией и опорным пунктом главы клана. Ирландия построила их больше, чем где-либо еще на Британских островах." #NT!
 nd_ire_tower_house_maintenance: "Уход за домом в башне" #NT!
 nd_ire_tower_house_maintenance_desc: "Поддержание каменных стен, оборонительных сооружений и гарнизона дома-башни." #NT!
 nd_ire_garrison_muster: "Гарнизонный сбор" #NT!
 nd_ire_garrison_muster_desc: "Оснащение и содержание конного гарнизона для защиты дома-башни и прилегающих к нему земель." #NT!
 nd_ire_bardic_school: "Бардская школа" #NT!
 nd_ire_bardic_school_desc: "Школа для фили, потомственных поэтов-ученых гэльской Ирландии, где ученики проводят годы, осваивая тонкости стихов, генеалогии и права." #NT!
 nd_ire_bardic_upkeep: "Бардское покровительство" #NT!
 nd_ire_bardic_upkeep_desc: "Поддержка резидентов-фили письменными принадлежностями, свечами и благовониями, сопровождающими их чтения." #NT!
 nd_ire_manuscript_production: "Освещение рукописей" #NT!
 nd_ire_manuscript_production_desc: "Кропотливое ремесло изготовления иллюминированных рукописей в традициях Келлской книги." #NT!
 nd_ire_bleach_green: "Отбеливатель льна зеленый" #NT!
 nd_ire_bleach_green_desc: "Заведение под открытым небом, где тканая льняная ткань расстилается на траве и отбеливается солнцем и водой, создавая знаменитое белое ирландское белье." #NT!
 nd_ire_bleach_green_maintenance: "Уход за Блич-Зеленым" #NT!
 nd_ire_bleach_green_maintenance_desc: "Обслуживание сушильных рам, корыт для мытья и хранения хлорной зелени." #NT!
 nd_ire_linen_processing: "Льняное Ткачество" #NT!
 nd_ire_linen_processing_desc: "Переработка льняных волокон в тонкую льняную ткань с использованием традиционных ирландских ткацких технологий." #NT!
 nd_ire_distillery: "Завод по производству виски" #NT!
 nd_ire_distillery_desc: "Винокурня, производящая уисце беату, воду жизни. Медные перегонные кубы превращают солодовый ячмень в мягкий ирландский виски." #NT!
 nd_ire_distillery_maintenance: "Содержание ликеро-водочного завода" #NT!
 nd_ire_distillery_maintenance_desc: "Обслуживание медных перегонных кубов, дубовых бочек и солодовенных печей, в которых производят прекрасный ирландский виски." #NT!
 nd_ire_whiskey_production: "Дистилляция виски" #NT!
 nd_ire_whiskey_production_desc: "Дистилляция зерна и воды для получения гладкого ирландского виски традиционным методом перегонного куба." #NT!
 nd_ire_wool_cottage: "Шерстяной коттедж" #NT!
 nd_ire_wool_cottage_desc: "Сельский коттедж, где ирландские семьи прядут, расчесывают и перерабатывают шерсть в ткань. Надомное производство поддерживает многие фермерские хозяйства." #NT!
 nd_ire_wool_cottage_maintenance: "Уход за шерстяным коттеджем" #NT!
 nd_ire_wool_cottage_maintenance_desc: "Обслуживание прялок, ткацких станков и складов для шерстяной промышленности." #NT!
 nd_ire_wool_processing: "Обработка шерсти" #NT!
 nd_ire_wool_processing_desc: "Расчесывание, прядение и плетение ткани из ирландской шерсти для внутреннего использования и экспорта." #NT!
 a_nd_ire_redshanks: "Красноногий" #NT!
 a_nd_ire_redshanks_desc: "Шотландско-ирландская наемная пехота, известная своими отличительными леггинсами из недубленной оленьей кожи. Быстрые, агрессивные бойцы, испытанные на пересеченной местности высокогорья и ирландских болот." #NT!
 levy_nd_ire_redshanks: "Красноногий" #NT!
 levy_nd_ire_redshanks_desc: "Набор шотландско-ирландских красноногих наемников, свирепая легкая пехота, чувствующая себя как дома на пересеченной местности." #NT!
 a_nd_ire_irish_pike: "Ирландская щука" #NT!
 a_nd_ire_irish_pike_desc: "Дисциплинированная пехота, обученная по образцу реформированной армии Хью О'Нила. Сочетание традиционной ирландской свирепости с континентальной тактикой стрельбы." #NT!
 levy_nd_ire_irish_pike: "Ирландская щука" #NT!
 levy_nd_ire_irish_pike_desc: "Набор ирландских пикинеров, обученных реформированной континентальной тактике О'Нила, дисциплинированных и стойких в построении." #NT!
 a_nd_ire_wild_geese: "Дикие гуси" #NT!
 a_nd_ire_wild_geese_desc: "Ирландские солдаты, которые служили в армиях континентальной Европы и вернулись с дисциплиной и тактической изощренностью профессиональной войны. Их опыт службы во Франции, Испании и Австрии делает их грозными ветеранами." #NT!
 n_nd_ire_privateer: "Ирландский капер" #NT!
 n_nd_ire_privateer_desc: "Быстрое и маневренное рейдерское судно, созданное для торговых войн в Атлантике. Ирландские каперы используют положение острова по обе стороны основных морских путей, чтобы наживаться на торговле противника." #NT!
 nd_ire_formed_tt: "Ирландия была #bold образована#!" #NT!
 nd_ire_path_a_tt: "Выбери судьбу #bold Гэльской Империи#!" #NT!
 nd_ire_path_b_tt: "Выберите судьбу #bold Атлантического Доминиона#!." #NT!
 nd_ire_destiny: "Ирландская судьба" #NT!
 nd_ire_destiny_desc: "Ирландия объединена под властью одного Верховного короля. Судьба Эрин (будь то восстановление гэльского мира или создание Атлантической империи) ждет." #NT!
 nd_ire_dest_ri_na_ngael: "Ри на нГаэль" #NT!
 nd_ire_dest_ri_na_ngael_desc: "Захватите остров Мэн и Внутренние Гебриды, чтобы объединить все гэльские народы под властью Верховного короля. Гэльский мир простирается за пределы берегов Ирландии." #NT!
 nd_ire_dest_gaelic_reconquest: "Гэльское завоевание" #NT!
 nd_ire_dest_gaelic_reconquest_desc: "Верните себе гэльское сердце Шотландии. Возьмите Аргайл и Эдинбург, чтобы создать пангэльское королевство, охватывающее оба острова." #NT!
 nd_ire_dest_imperium: "Империум Скотторум" #NT!
 nd_ire_dest_imperium_desc: "Завоюйте Лондон и объедините эти острова под властью гэлов. Станьте верховной державой Британских островов с империей, достойной наследия Брайана Бору." #NT!
 nd_ire_dest_galway_merchants: "Торговые принцы Голуэя" #NT!
 nd_ire_dest_galway_merchants_desc: "Сделать Ирландию торговой державой в Атлантическом океане. Наращивайте золотой запас, развивайте торговлю шерстью и сделайте Голуэй равным любому европейскому порту." #NT!
 nd_ire_dest_western_passage: "Западный проход" #NT!
 nd_ire_dest_western_passage_desc: "Пересеките Атлантику, достигните Азорских островов и далее. Обеспечьте безопасность банковских учреждений и постройте корабли, необходимые для океанской торговли." #NT!
 nd_ire_dest_emerald_dominion: "Изумрудный Доминион" #NT!
 nd_ire_dest_emerald_dominion_desc: "Постройте трансатлантическую коммерческую империю. Удерживайте Бермудские острова, накопите огромное богатство и превратите Ирландию в процветающую морскую державу." #NT!
 nd_ire.5.t: "Ирландская судьба" #NT!
 nd_ire.5.d: "Верховное королевство восстановлено, и впервые за столетия Ирландия заговорила в один голос. Кланы, которые когда-то воевали друг с другом, теперь смотрят наружу, объединенные под властью правителя, который командует верностью всей Эрин.\n\nВопрос не в том, будет ли Ирландия великой, а в том, какую форму примет это величие. Гэльский мир простирается за пределы этих берегов: до Гебридских островов, до Мана, до высокогорья Шотландии, где наши родственники все еще говорят на нашем языке. Или, возможно, наша судьба лежит не на землях наших предков, а в самой Атлантике, где ирландские корабли могут доставлять ирландские товары в любой порт известного мира." #NT!
 nd_ire.5.a: "Эрин, хвастайся." #NT!
 nd_ire.6.t: "Король гэлов" #NT!
 nd_ire.6.d: "Остров Мэн и Внутренние Гебриды перешли под власть Верховного короля. Впервые после норвежских вторжений гэльоязычный мир Ирландского моря объединен под единым правителем. Рыбаки Мэна, воины Айлея и кланы Ирландии — все признают одного суверена.\n\nЭто первый шаг к великому видению: воссоединению всех гэльских народов, от болот Керри до высокогорья Шотландии, под одной короной." #NT!
 nd_ire.6.a: "Ирландское море — гэльское озеро." #NT!
 nd_ire.7.t: "Гэльское завоевание" #NT!
 nd_ire.7.d: "Эдинбург пал. Гэльский Верховный король теперь правит от Дублина до Лотиана, командуя королевством, охватывающим древние гэльские центры Ирландии и Шотландии. Кланы Аргайла, жители Гебридских островов и вожди Хайленда сплотились под знаменем, обещающим восстановление гэльской цивилизации на обоих островах.\n\nНо это завоевание может принимать разные формы. Военный союз с кланами Хайленда создал бы нерушимую военную традицию, превратив жестокую независимость гэльских воинов в дисциплинированную боевую силу. С другой стороны, союз ирландского и шотландского образования может спровоцировать гэльский культурный ренессанс, возродив научные традиции, которые когда-то сделали гэльский мир светом западного христианского мира." #NT!
 nd_ire.7.a: "Создайте альянс горцев." #NT!
 nd_ire.7.b: "Разожгите гэльский ренессанс." #NT!
 nd_ire.8.t: "Империя гэлов" #NT!
 nd_ire.8.d: "Сам Лондон находится в руках ирландцев. Верховный король Ирландии теперь командует величайшей империей, которую когда-либо знали эти острова: построенной не нормандскими лордами или саксонскими королями, а гэльскими народами, которые жили здесь раньше всех. От болот Коннахта до берегов Темзы право Ард Ри беспрепятственно распространяется.\n\nЭто момент высшего триумфа, но также и момента выбора. Меч, завоевавший эту империю, сможет сохранить ее: направив дух Брайана Бору в династию воинов, которая удерживает свои завоевания посредством военного превосходства. Или же Верховный король может обратиться к более старой традиции Ирландии, к монашескому обучению, которое когда-то принесло ей титул «Остров святых и ученых», и построить империю разума, которая переживет любую империю меча." #NT!
 nd_ire.8.a: "Пусть меч Брайана Бору защитит нас." #NT!
 nd_ire.8.b: "Мы снова станем святыми и учеными." #NT!
 nd_ire.9.t: "Торговые принцы Голуэя" #NT!
 nd_ire.9.d: "Четырнадцать племен Голуэя (великие купеческие семьи, которые на протяжении поколений доминировали в торговле города) теперь действуют под покровительством Верховного короля. Гавань Голуэя, обращенная к открытой Атлантике, стала торговым центром Ирландии. Шерсть, шкуры и рыба вытекают наружу; вино, специи и предметы роскоши поступают из Иберии, Франции и Средиземноморья.\n\nПри королевской поддержке и стабильном управлении торговые принцы строят нечто беспрецедентное: ирландскую коммерческую сеть, способную конкурировать с великими торговыми городами Европы." #NT!
 nd_ire.9.a: "Голуэй станет нашей жемчужиной." #NT!
 nd_ire.10.t: "Западный проход" #NT!
 nd_ire.10.d: "Ирландские корабли достигли Азорских островов, водрузив зеленое знамя на островах в Атлантическом океане, которые служат ступеньками к более широкому миру. Банковские учреждения были привлечены, что дало Ирландии финансовые возможности для финансирования океанских предприятий. Атлантика, некогда преграда, становится ирландской магистралью.\n\nЭто поворотный момент. Мореплаватели, проложившие эти маршруты, могут стать новой традицией: они обучают следующее поколение ирландских мореплавателей дальнейшим исследованиям и упорным сражениям в открытом океане. Альтернативно, коммерческие возможности Азорского маршрута могут быть развиты через факторные дома: постоянные ирландские торговые посты, которые собирают разведданные, налаживают контакты и перенаправляют товары обратно в Ирландию." #NT!
 nd_ire.10.a: "Чтите традиции мореплавателей." #NT!
 nd_ire.10.b: "Создавать фабричные дома за рубежом." #NT!
 nd_ire.11.t: "Изумрудный Доминион" #NT!
 nd_ire.11.d: "От Голуэя до Бермудских островов, от Азорских островов до рыбацких берегов Атлантики — Ирландия построила коммерческую империю, охватывающую океан. Ирландские купцы торгуют во всех крупных портах, ирландские корабли перевозят товары на тысячи миль по открытой воде, а ирландское золото наполняет казну королевства, которое когда-то считалось захолустьем.\n\nИзумрудный Доминион может принять одну из двух окончательных форм. Продовольственный флот (организованный экспорт ирландской говядины, масла и сельскохозяйственных излишков) может снабжать флоты и колонии атлантического мира, делая Ирландию незаменимым поставщиком продовольствия морской цивилизации. Или Ирландия может объявить свои порты открытыми для всех желающих, создав свободные порты, привлекающие торговцев из всех стран, сделав остров нейтральным центром мировой торговли." #NT!
 nd_ire.11.a: "Мы накормим атлантический мир." #NT!
 nd_ire.11.b: "Объявите наши порты открытыми для всех стран." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_highland_alliance: "Хайленд Альянс" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_highland_alliance: "Гэльские кланы Ирландии и Шотландии связаны военным союзом, их совместная традиция набегов дает возможность вести осадную войну и грабежи, хотя затраты на поддержание таких союзов отягощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_gaelic_renaissance: "Гэльский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_gaelic_renaissance: "Союз ирландского и шотландского образования вызывает возрождение гэльской науки, распространяя институты и процветание, одновременно ускоряя строительство новой цивилизации." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_sword_of_brian: "Меч Брайана Бору" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_sword_of_brian: "Боевые традиции Брайана Бору продолжают жить. Ирландские армии двигаются быстро и атакуют укрепления с ужасающей яростью, хотя такая агрессивная война не оставляет времени для тонкостей придворного престижа." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_saints_and_scholars: "Остров святых и ученых" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_saints_and_scholars: "Монашеские и научные традиции Ирландии возрождаются в имперском масштабе, способствуя росту населения и снижая стоимость строительства, хотя мирный характер двора означает более высокий уровень военного содержания." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_navigator_tradition: "Навигаторская традиция" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_navigator_tradition: "Ирландские моряки обучены традициям атлантического мореплавания, продолжают исследовать и упорнее сражаться в открытом океане, хотя морская ориентация отвлекает мужчин от наземной службы." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_factor_houses: "Фактор Хаусс" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_factor_houses: "Постоянные ирландские торговые посты за рубежом расширяют дипломатический охват и сбор разведданных, хотя высокие прибыли порождают определенное самоуспокоение при дворе." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_provision_fleet: "Провизионный флот" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_provision_fleet: "Сельскохозяйственная щедрость Ирландии питает флоты и колонии атлантического мира. Сырье поступает свободно, а расходы на военно-морской флот сокращаются, хотя зависимость королевства от мирной торговли делает войну более дорогостоящей." #NT!
 STATIC_MODIFIER_NAME_nd_ire_dest_free_port: "Свободный порт Ирландии" #NT!
 STATIC_MODIFIER_DESC_nd_ire_dest_free_port: "Ирландские порты объявлены открытыми для всех стран, что улучшает международные отношения и связывает подданных ближе к короне, хотя открытый характер королевства означает, что армии страдают от большего истощения за рубежом." #NT!
 nd_ire_high_cross: "Высокий Крестовоздвиженский монастырь" #NT!
 nd_ire_high_cross_desc: "Огромный монастырский комплекс, построенный на богато украшенном каменном высоком кресте, служащий маяком гэльского образования, веры и культурного авторитета в традициях Клонмакнойза и Глендалоха." #NT!
 nd_ire_high_cross_maintenance: "Монашеское содержание" #NT!
 nd_ire_high_cross_maintenance_desc: "Поддержание скриптории, реликвариев и каменной резьбы монашеской общины." #NT!
 nd_ire_atlantic_exchange: "Атлантическая биржа" #NT!
 nd_ire_atlantic_exchange_desc: "Специально созданная коммерческая биржа, на которой ирландские, иберийские и атлантические купцы ведут трансатлантическую торговлю, конкурируя с любой биржей в Европе." #NT!
 nd_ire_exchange_maintenance: "Обменные операции" #NT!
 nd_ire_exchange_maintenance_desc: "Клерки, регистраторы и управляющие поддерживают функционирование биржи, обеспечивая поток товаров между атлантическим и европейским рынками." #NT!
  
  # ===== BUREAUCRACIES ===== 
 brehon_law_bureaucracy: "Брехон Лоу" #NT!
 brehon_law_bureaucracy_desc: "Обычная правовая система гэльской Ирландии, названная в честь брейтема (судьи), которой управляют потомственные ученые семьи, такие как МакИганы и О'Даворены. Кодекс был скорее гражданским, чем уголовным, и разрешал споры посредством платы чести (энекланн) и компенсации (эрик), а не государственного наказания. Его терпимость к местному арбитражу была объявлена ​​​​вне закона поэтапно, от Статута Килкенни (1366 г.) до решения Королевской скамьи по делу Танистри (1607 г.)." #NT!
 tanistry_bureaucracy: "Танистри" #NT!
 tanistry_bureaucracy_desc: "Гэльская система выборной преемственности, в которой танаист, названный при жизни короля, выбирался из дербфина: группы родственников по отцовской линии из четырех поколений, имеющих общего прадеда. Отдав предпочтение доказанным способностям над первородством, танистрия создала эффективных военачальников, но также и хронические кризисы преемственности. Английская королевская скамья отменила его в деле о танистрии 1607 года." #NT!
 bardic_schools_bureaucracy: "Бардские школы" #NT!
 bardic_schools_bureaucracy_desc: "Наследственные школы филидов, ученого класса гэльской Ирландии, поддерживаемые аристократическим покровительством примерно между 1250 и 1650 годами. Учащиеся учились до двенадцати лет, чтобы освоить строгие слоговые размеры Дэна Дирича, генеалогии великих домов и знания закона Бреона. Школы рухнули вместе со своими покровителями, когда плантации и войны семнадцатого века разрушили гэльский порядок." #NT!
 coyne_and_livery_bureaucracy: "Койн и Ливери" #NT!
 coyne_and_livery_bureaucracy_desc: "Коинмхедх — это buannacht: гэльское требование, с помощью которого лорд размещал свои компании кернов, виселиц и боннахтов у сельского населения, получая еду, жилье и фураж без оплаты. Система поддерживала постоянную военную силу без каких-либо затрат для казны лорда, но солдаты сами взимали налоги с крестьянства, что часто приводило к разорению. Неоднократно объявлялся вне закона англо-ирландскими парламентами и неоднократно игнорировался лордами." #NT!
 pale_administration_bureaucracy: "Администрация Пэйла" #NT!
 pale_administration_bureaucracy_desc: "Канцелярия лорда-депутата, казначейство и аппарат Дублинского замка, управляющий четырьмя графствами английской черты оседлости (Лаут, Мит, Дублин и Килдэр). С 1471 года эту должность почти постоянно занимали графы Килдэр, которые управляли Ирландией через сеть союзов в гэльском стиле от имени Короны. Ирландский парламент созывался только тогда, когда лорду-депутату требовались новые законы или новые налоги." #NT!
 surrender_and_regrant_bureaucracy: "Сдача и возвращение" #NT!
 surrender_and_regrant_bureaucracy_desc: "Политика Тюдоров, разработанная при Томасе Кромвеле и проводившаяся с 1540-х годов, согласно которой гэльские и гэльизированные лорды передавали свои земли и традиционные титулы Короне и получали их обратно по королевской хартии в соответствии с английским первородством. Состав Коннахта 1585 года расширил систему на запад, заменив многочисленные гэльские дани единым земельным налогом и превратив tricha céts в баронства. Он одним росчерком пера разрушил танистры и владение Брегоном." #NT!
  
  # ===== BUREAUCRACY UNLOCK ===== 
 AUTO_MODIFIER_NAME_nd_ire_bureaucracy_authority: "Постоянный административный аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_ire_bureaucracy_authority: "Двойная административная традиция Ирландии (гэльский орден брехонов, филидов и клановых собраний и англо-ирландская канцелярия Дублинского замка) обеспечивает основу для двух постоянных бюрократий, а столица предоставляет третью." #NT!
