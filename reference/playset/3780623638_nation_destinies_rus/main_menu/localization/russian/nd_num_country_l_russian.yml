l_russian:
 NUM: "Команчерия" #NT!
 NUM_ADJ: "Команчи" #NT!
 NUM_f: "Команчерия" #NT!
 NUM_f_desc: "Сформировать Нумуну Сукобиту, страну команчей, как суверенную империю равнинных лошадей. Из центра Льяно-Эстакадо параибо и теквунивапи объединяют дивизии Пенатека, Ямпарика, Квахади, Нокони и Котсотека в единую конфедерацию, собирая дань с приграничных земель и превращая зубровую экономику в основу континентальной державы. Это Империя команчей, как ее описал Пекка Хямяляйнен: государство коренных народов, которое навязывало свою волю Южным равнинам в течение полутора веков и стало постоянным." #NT!
