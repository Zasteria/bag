l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_zion: "Меч Сиона" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_zion: "Эфиопский престол является резиденцией избранной Богом династии, происходящей от Соломона и царицы Савской. Наши армии маршируют под знаменем Льва Иуды, защитников христианской веры в Африке. Пусть мир трепещет перед Мечом Сиона." #NT!
 STATIC_MODIFIER_NAME_nd_light_of_aksum: "Свет Аксума" #NT!
 STATIC_MODIFIER_DESC_nd_light_of_aksum: "От древних обелисков Аксума до высеченных в скале церквей Лалибелы — Эфиопия с древних времен была маяком цивилизации. Наше письмо геэз, наши рукописи, наши дипломатические связи с далекими королевствами — вот сокровища, которые отличают нас. Пусть Свет Аксума осветит мир." #NT!
 STATIC_MODIFIER_NAME_nd_portuguese_arms: "Португальское оружие" #NT!
 STATIC_MODIFIER_DESC_nd_portuguese_arms: "Португальская экспедиция снабдила наши армии фитильными мушкетами и пушками. Эфиопские солдаты теперь тренируются с применением огнестрельного оружия наряду со своим традиционным оружием, создавая грозную гибридную боевую силу." #NT!
 STATIC_MODIFIER_NAME_nd_highland_defense: "Хайленд Дефенс" #NT!
 STATIC_MODIFIER_DESC_nd_highland_defense: "Горы – наша крепость. Горькие уроки Войны Адала научили нас использовать высокогорную местность как наше величайшее оружие, превращая каждый горный перевал в поле битвы для захватчиков." #NT!
 STATIC_MODIFIER_NAME_nd_imperial_restoration: "Имперская реставрация" #NT!
 STATIC_MODIFIER_DESC_nd_imperial_restoration: "Хаос Эры Принцев закончился. Император снова пользуется лояльностью провинций, и машина централизованного правительства приходит в движение. Эфиопия больше не будет разделена." #NT!
 STATIC_MODIFIER_NAME_nd_princely_compromise: "Княжеский компромисс" #NT!
 STATIC_MODIFIER_DESC_nd_princely_compromise: "Вместо того, чтобы сокрушить региональных лордов, император добился тщательного баланса сил. Автономия провинций сохраняется в обмен на верность трону, создавая разнообразное, но стабильное королевство." #NT!
 STATIC_MODIFIER_NAME_nd_tewodros_vision: "Видение Теодроса" #NT!
 STATIC_MODIFIER_DESC_nd_tewodros_vision: "Король бандитов, ставший императором, имеет видение современной Эфиопии, страны с профессиональной постоянной армией, современными дорогами и централизованной администрацией. Старый феодальный порядок должен согнуться или сломаться." #NT!
 nd_eth.1.t: "Восстановление Соломонова престола" #NT!
 nd_eth.1.d: "Нагорья Рога снова объединены под знаменем Льва Иуды. Династия Соломоновых островов, претендующая на непрерывное происхождение от царя Соломона и царицы Савской через Кебра Нагаст, теперь правит объединенной Эфиопией. От древних стел Аксума до высеченных в скалах церквей Лалибелы, от побережья Красного моря до высокогорья Шева — наши владения охватывают одну из древнейших христианских цивилизаций на Земле.\n\nНо что это будет за империя? Негуса Нагаст, король царей, должен выбрать путь, который будет определять Эфиопию для поколений. Будем ли мы воинственными защитниками нашей веры, мечом, поднятым против всех, кто угрожает христианскому миру в Африке? Или мы воспользуемся древней мудростью Аксума, став маяком обучения, дипломатии и торговли, вызывающим уважение благодаря культурному величию, а не только копью?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_eth.1.a: "Мы Меч Сиона. Пусть никто не бросает вызов вере!" #NT!
 nd_eth.1.b: "Мы — Свет Аксума. Пусть наша цивилизация процветает!" #NT!
 nd_eth.2.t: "Слава королей" #NT!
 nd_eth.2.d: "Писцы при императорском дворе завершили важную работу: «Кебра Нагаст», «Слава королей». В этом грандиозном сборнике прослеживается происхождение нашей династии от самого царя Соломона через его сына Менелика I, который привез Ковчег Завета из Иерусалима в Аксум. Текст объединяет библейское повествование, эфиопские легенды и политическую теологию в шедевр, который узаконивает притязания династии Соломоновых Островов на правление.\n\nКебра Нагаст — это больше, чем просто пропаганда, утверждающая Эфиопию как избранную нацию с божественным мандатом. Иностранные послы, услышавшие его претензии, относятся к нашему королевству с новым почтением, в то время как наш народ находит в нем глубокий источник национальной идентичности и целей." #NT!
 nd_eth.2.a: "Слава королей станет Священным Писанием нашей страны." #NT!
 nd_eth.3.t: "Адальская война" #NT!
 nd_eth.3.d: "Африканский Рог дрожит. Имам Ахмад ибн Ибрагим аль-Гази, известный как Грагн, «Левша», натравил армии султаната Адал на Эфиопское нагорье. Его войска, вооруженные османским огнестрельным оружием и горящие религиозным пылом, захватывают провинцию за провинцией, грабят церкви, сжигают рукописи многовековой давности и предают мечу христианские общины.\n\nЭто экзистенциальная борьба за выживание Эфиопии. Императрица отчаянно искала помощи из-за границы, и в Массаву прибыла португальская экспедиция под командованием Кристовау да Гамы с четырьмя сотнями солдат, вооруженных фитильными мушкетами и пушками — оружием, которого Эфиопия никогда не видела. Вопрос теперь в том, как восстановиться после этого опустошения." #NT!
 nd_eth.3.a: "Принять на вооружение португальское огнестрельное оружие. Давайте овладеем оружием будущего." #NT!
 nd_eth.3.b: "Доверьтесь нашим горам; само нагорье — наша величайшая крепость." #NT!
 nd_eth.4.t: "Великолепие Гондара" #NT!
 nd_eth.4.d: "Император Фасилидес сделал то, чего не достиг ни один эфиопский правитель до него: он основал постоянную столицу. В Гондаре, к северу от озера Тана, возвышается Фасил-Гебби, королевский комплекс из каменных замков, который не выглядел бы неуместно в Европе. Созданные под влиянием португальских, индийских и местных архитектурных традиций, эти сооружения из коричневого базальта и туфа винного цвета представляют собой новую главу в эфиопской цивилизации.\n\nНа протяжении веков эфиопские императоры правили из передвижных лагерей, исчерпав каждый регион, прежде чем двигаться дальше. Гондар меняет все. Постоянная столица означает постоянные институты, постоянный суд, устоявшиеся рынки, постоянных дипломатов и растущее городское население, которые изменят эфиопское общество в следующем столетии." #NT!
 nd_eth.4.a: "Гондэр станет жемчужиной Африки." #NT!
 nd_eth.5.t: "Эпоха принцев" #NT!
 nd_eth.5.d: "Убийство императора Иоаса I расом Микаэлем Сехулом в 1769 году погрузило Эфиопию в Земенский Месафинт, эпоху принцев. Императоры Соломоновых островов по-прежнему восседают на своем троне в Гондаре, но они марионетки, их власть сведена к церемониальным жестам, в то время как региональные лорды, Рас и Дежазмач, ведут свои собственные войны, взимают собственные налоги и управляют своими территориями как независимые феодальные владения.\n\nЧерез восемьдесят шесть лет трон займут двадцать три императора, большинство из которых будут просто номинальными главами, устанавливаемыми и смещенными по прихоти любого военачальника. контролирует Гондар. Эфиопия стоит перед выбором: восстановит ли сильный император центральную власть и сокрушит региональных правителей, или же королевство обретет стабильность благодаря согласованному балансу сил?" #NT!
 nd_eth.5.a: "Восстановите власть трона, положите конец этому хаосу!" #NT!
 nd_eth.5.b: "Ведите переговоры с принцами, стабильность через компромисс." #NT!
 nd_eth.6.t: "Возвышение Теодроса" #NT!
 nd_eth.6.d: "Из хаоса Земенского Месафинта появляется маловероятный спаситель. Касса Хайлу, вождь бандитов из приграничных земель Квары, победил всех конкурирующих военачальников и провозгласил себя императором Теодросом II, взяв имя из пророчества, предсказывающего праведного царя, который восстановит славу Эфиопии.\n\nТеодрос мечтает не что иное, как полное преобразование Эфиопии. Он распускает феодальные поборы и создает постоянную постоянную армию, верную только короне. Он строит дороги, соединяющие провинции. Он заказывает отливку пушек в своей горной крепости Магдала. Он пытается отменить работорговлю и уменьшить власть Церкви. Никогда со времен Амды Сейона эфиопский император не проявлял столь яростных амбиций и такой готовности порвать со старым порядком." #NT!
 nd_eth.6.a: "Эфиопия возродится по образу Теодроса." #NT!
 nd_eth_geez_literary_tradition: "Литературная традиция Геэза" #NT!
 nd_eth_geez_literary_tradition_desc: "Развитие уникального письма геэз в Эфиопии и его монашеской традиции копирования рукописей, создавших одну из старейших непрерывных литературных культур в Африке." #NT!
 nd_eth_shotelai_tradition: "Шотелайская кавалерия" #NT!
 nd_eth_shotelai_tradition_desc: "Традиция конных горных воинов, вооруженных изогнутым мечом-шотелем и умеющих фланговые маневры на Эфиопском нагорье." #NT!
 nd_eth_aksumite_heritage: "Аксумское наследие" #NT!
 nd_eth_aksumite_heritage_desc: "Непреходящее наследие древнего Аксумского королевства, его стел, чеканки монет, торговых связей с Римом и Индией придает эфиопской цивилизации престиж, не имеющий себе равных в Африке к югу от Сахары." #NT!
 nd_eth_tej_production: "Тедж Продакшн" #NT!
 nd_eth_tej_production_desc: "Древняя эфиопская традиция приготовления теджа — медового вина, играющего центральную роль в социальных ритуалах, религиозных церемониях и повседневной жизни в высокогорье." #NT!
 nd_eth_amba_fortification: "Укрепление Амба" #NT!
 nd_eth_amba_fortification_desc: "Эфиопская практика укрепления горных столовых гор с плоскими вершинами (амбас) как почти неприступных естественных крепостей, используемых для заключения в тюрьму соперников, хранения сокровищ и защиты стратегических перевалов." #NT!
 nd_eth_amole_trade_network: "Торговая сеть Амол" #NT!
 nd_eth_amole_trade_network_desc: "Сложная торговая система построена на соляных слитках амоле, добытых в Данакильской впадине и используемых в качестве валюты на всей территории Эфиопского нагорья и за его пределами." #NT!
 nd_eth_kebra_nagast: "Кебра Нагаст" #NT!
 nd_eth_kebra_nagast_desc: "Сборник «Кебра Нагаст», «Слава царей», основополагающего текста, прослеживающего происхождение династии Соломоновых островов от царя Соломона и устанавливающего божественное право Эфиопии на Ковчег Завета." #NT!
 nd_eth_shotelai_renaissance: "Шотелай Ренессанс" #NT!
 nd_eth_shotelai_renaissance_desc: "Эволюция тактики эфиопской кавалерии в эпоху Возрождения, сочетающая традиционный шотель с улучшенной броней и методами скоординированной атаки." #NT!
 nd_eth_solomonic_admin: "Соломонова администрация" #NT!
 nd_eth_solomonic_admin_desc: "Имперская административная система династии Соломоновых островов, сосредоточенная на Негусе Нагасте и назначенных им губернаторах, сохраняла контроль над обширным горным царством." #NT!
 nd_eth_shamma_tradition: "Шамма Ткачество" #NT!
 nd_eth_shamma_tradition_desc: "Самобытная эфиопская традиция ткачества ткани шамма — одежды из белого хлопка с декоративной каймой, которую носят все классы эфиопского общества, от крестьян до императоров.\n\n#italic Доступно в: $nd_eth_amole_market$#!" #NT!
 nd_eth_red_sea_trade: "Красное Море Коммерция" #NT!
 nd_eth_red_sea_trade_desc: "Доступ Эфиопии к прибыльной торговой сети Индийского океана через порты Массауа и Зейла на Красном море, где происходит обмен золота, слоновой кости и рабов на лошадей, ткани и оружие." #NT!
 nd_eth_zagwe_architecture: "Архитектурное наследие Загве" #NT!
 nd_eth_zagwe_architecture_desc: "Необычайная архитектурная традиция, высеченная в скале, унаследованная от династии Загве, примером которой являются одиннадцать монолитных церквей Лалибелы, высеченных непосредственно из живого камня." #NT!
 nd_eth_portuguese_alliance: "Португальский Альянс" #NT!
 nd_eth_portuguese_alliance_desc: "Дипломатические связи с Португалией, возникшие на основе взаимной христианской солидарности против ислама, принесли Эфиопии европейские военные технологии и дипломатическое признание." #NT!
 nd_eth_adal_war_veterans: "Ветераны войны Адаль" #NT!
 nd_eth_adal_war_veterans_desc: "Поколение закаленных в боях солдат, выкованных в экзистенциальной войне против султаната Адал Имама Ахмада Грагна, воинов, которые научились сражаться как мечом, так и фитильным ружьем." #NT!
 nd_eth_danakil_route: "Соляной маршрут Данакиль" #NT!
 nd_eth_danakil_route_desc: "Контроль над маршрутами добычи соли из впадины Данакиль, где жестокая жара самой низкой точки Африки дает слитки амола, которые служат основной валютой Эфиопии.\n\n#italic Доступно в: $nd_eth_amole_market$#!" #NT!
 nd_eth_gondarine_splendor: "Гондариновое великолепие" #NT!
 nd_eth_gondarine_splendor_desc: "Создание Гондэра как первой постоянной столицы Эфиопии, увенчанной великолепным королевским дворцом Фасил-Гебби с каменными замками, в которых сочетаются архитектурные влияния Эфиопии, Португалии и Индии.\n\n#italic Доступно в: $nd_eth_fasil_ghebbi$#!" #NT!
 nd_eth_chewa_tradition: "Имперская гвардия Чева" #NT!
 nd_eth_chewa_tradition_desc: "Система элитных военных колоний Чева, где профессиональные солдаты, расселенные в стратегических провинциях, служат постоянной армией и личной охраной императора." #NT!
 nd_eth_gult_system: "Система Гульта" #NT!
 nd_eth_gult_system_desc: "Эфиопская система предоставления земель, при которой император наделяет дворян и военачальников правами верховной власти, предоставляя им полномочия по сбору налогов в обмен на обязательства по военной службе." #NT!
 nd_eth_gondarine_artillery: "Гондаринская артиллерия" #NT!
 nd_eth_gondarine_artillery_desc: "Принятие на вооружение эфиопской армии пороховой артиллерии, основанной на технологиях, внедренных во время португальского союза и усовершенствованных в период Гондарина." #NT!
 nd_eth_beta_israel: "Бета Израильская толерантность" #NT!
 nd_eth_beta_israel_desc: "Признание Бета-Исраэль, эфиопских евреев, которые ведут свою веру от соратников Менелика I, как защищенной общины, интегрирующей свои навыки обработки металлов, ткачества и гончарного дела в эфиопское общество." #NT!
 nd_eth_oromo_integration: "Интеграция Оромо" #NT!
 nd_eth_oromo_integration_desc: "Постепенное поглощение народов оромо эфиопским государством, привнесение их превосходных кавалерийских традиций и скотоводческой экономики в обогащение военного и культурного разнообразия империи." #NT!
 nd_eth_zemene_mesafint: "Земене Месафинт" #NT!
 nd_eth_zemene_mesafint_desc: "Тяжелые уроки Земенского Месафинта, Эры князей, когда региональные военачальники превратили императоров в марионеток, научили Эфиопию хрупкости централизованной власти." #NT!
 nd_eth_coffee_ceremony: "Эфиопская кофейная церемония" #NT!
 nd_eth_coffee_ceremony_desc: "Ритуализация употребления кофе (буна по-амхарски) превратилась в сложную эфиопскую кофейную церемонию, превращающую стимулирующий напиток в краеугольный камень общественной жизни и торговли." #NT!
 nd_eth_manuscript_school: "Гондаринская школа рукописей" #NT!
 nd_eth_manuscript_school_desc: "Расцвет эфиопских иллюминированных рукописей в гондаринский период привел к созданию ярких раскрашенных библий и житий, которые представляют собой вершину эфиопского изобразительного искусства." #NT!
 nd_eth_tewodros_reunification: "Воссоединение Теодроса" #NT!
 nd_eth_tewodros_reunification_desc: "Военная и административная революция императора Теодроса II, положившая конец Земенскому Месафинту, создала национальную постоянную армию и предполагала современное централизованное эфиопское государство." #NT!
 nd_eth_modernization: "Эфиопская модернизация" #NT!
 nd_eth_modernization_desc: "Более широкую программу модернизации, инициированную Теодросом II, строительство дорог, производство оружия, административную реформу, продолжили его преемники Йоханнес IV и Менелик II." #NT!
 nd_eth_sovereignty: "Абиссинский суверенитет" #NT!
 nd_eth_sovereignty_desc: "Утверждение независимости Эфиопией в эпоху европейского колониализма, которая стала единственным африканским государством, которое успешно сопротивлялось борьбе за Африку и сохранило свой суверенитет." #NT!
 a_nd_eth_shotelai: "Шотелай" #NT!
 a_nd_eth_shotelai_desc: "Горная кавалерия вооружена шотэлом — изогнутым серповидным мечом, предназначенным для обхода щита противника. Имеет навыки фланговых маневров на Эфиопском нагорье." #NT!
 a_nd_eth_shotelai_ren: "Ренессанс Шотелай" #NT!
 a_nd_eth_shotelai_ren_desc: "Улучшенные всадники Шотелая с лучшей броней и скоординированной тактикой, сохраняющие свое традиционное фланговое мастерство и адаптирующиеся к меняющемуся облику войны." #NT!
 a_nd_eth_adal_veterans: "Ветераны войны Адаль" #NT!
 a_nd_eth_adal_veterans_desc: "Закаленная в боях пехота, закаленная в опустошительной войне против сил Адала Имама Ахмада Грагна. Они сражаются с отчаянной решимостью солдат, столкнувшихся с национальным уничтожением." #NT!
 a_nd_eth_chewa_guard: "Имперская гвардия Чева" #NT!
 a_nd_eth_chewa_guard_desc: "Элитная домашняя кавалерия Негуса Нагаст, набранная из военных колоний, расселенных по всей империи. Присягнувшие только императору, они являются самыми дисциплинированными солдатами Эфиопии." #NT!
 a_nd_eth_oromo_horsemen: "Оромо Всадники" #NT!
 a_nd_eth_oromo_horsemen_desc: "Интегрированная кавалерия оромо, которая привносит в императорскую армию Эфиопии скорость и агрессивность традиций пасторальных набегов. Быстрый, бесстрашный и разрушительный на открытой местности." #NT!
 a_nd_eth_tewodros_fusiliers: "Теодрос Стрелки" #NT!
 a_nd_eth_tewodros_fusiliers_desc: "Современная эфиопская пехота, реформированная при императоре Теодросе II, оснащенная мушкетами и обученная европейским учениям, представляет собой первую по-настоящему профессиональную эфиопскую постоянную армию." #NT!
 a_nd_eth_gondarine_cannon: "Гондариновая пушка" #NT!
 a_nd_eth_gondarine_cannon_desc: "Эфиопские артиллерийские расчеты управляют пушками, заимствованными из португальской технологии, усовершенствованными в период Гондарина для ведения осадной войны в горной местности." #NT!
 nd_eth_debra: "Дебра" #NT!
 nd_eth_debra_desc: "Эфиопская монашеская церковь и скрипторий, где монахи копируют рукописи шрифтом геэз, сохраняя религиозные тексты, хроники и литературное наследие одной из древнейших цивилизаций Африки." #NT!
 nd_eth_amole_market: "Рынок Амоле" #NT!
 nd_eth_amole_market_desc: "Торговый центр, построенный вокруг обмена слитков амоловой соли, блоков каменной соли, добытых из впадины Данакиль, которые служат валютой по всему Эфиопскому нагорью." #NT!
 nd_eth_fasil_ghebbi: "Фасил Гебби" #NT!
 nd_eth_fasil_ghebbi_desc: "Королевская ограда в стиле замкового комплекса Гондара, сочетающая архитектурные традиции Эфиопии, Португалии и Индии в комплекс крепости и дворца из коричневого базальта." #NT!
 nd_eth_buna_bet: "Буна Бет" #NT!
 nd_eth_buna_bet_desc: "Эфиопская кофейня, где тщательно продуманная церемония буна, обжарка, помол и заваривание кофейных зерен, служит центром общественной жизни, торговых переговоров и общественных собраний." #NT!
 nd_eth_amba: "Крепость Амба" #NT!
 nd_eth_amba_desc: "Укреплённое горное плато с плоской вершиной, использующее впечатляющий высокогорный рельеф Эфиопии для создания естественной крепости, доступной только по узким, легко защищаемым тропам." #NT!
 nd_eth_tej_bet: "Тедж Бет" #NT!
 nd_eth_tej_bet_desc: "Заведение по производству и продаже теджа, эфиопского медового вина, напитка, имеющего центральное значение в эфиопской культуре, который употребляют как на праздниках, религиозных церемониях, так и в повседневной трапезе." #NT!
 nd_eth_gult_estate: "Гульт Эстейт" #NT!
 nd_eth_gult_estate_desc: "Земельное поместье, пожалованное императором лояльной знати, где обладатель награды собирает налоги и взимает военные сборы в обмен на присягу на службу Соломонову трону." #NT!
 nd_eth_manuscript_copying: "Копирование рукописи" #NT!
 nd_eth_manuscript_copying_desc: "Монахи трудятся над копированием религиозных текстов и хроник древним письмом геэз, поддерживая литературные традиции Эфиопии." #NT!
 nd_eth_salt_exchange: "Соляная биржа" #NT!
 nd_eth_salt_exchange_desc: "Оживленная торговля слитками амоловой соли, которые взвешивали, сортировали и обменивали в качестве валюты на товары со всего региона." #NT!
 nd_eth_palace_upkeep: "Содержание дворца" #NT!
 nd_eth_palace_upkeep_desc: "Уход за каменными замками, садами и церемониальными помещениями королевской резиденции." #NT!
 nd_eth_coffee_roasting: "Обжарка кофе" #NT!
 nd_eth_coffee_roasting_desc: "Обжарка и помол эфиопских кофейных зерен в рамках традиционной церемонии, наполняющей воздух характерным ароматом буна." #NT!
 nd_eth_amba_garrison: "Амба Гарнизон" #NT!
 nd_eth_amba_garrison_desc: "Вооруженные солдаты поддерживают оборону крепости на вершине горы, охраняя узкие подходы." #NT!
 nd_eth_tej_brewing: "Тедж Пивоварение" #NT!
 nd_eth_tej_brewing_desc: "Ферментация меда и листьев гешо для производства теджа, любимого медового вина Эфиопии." #NT!
 nd_eth_gult_obligations: "Гультовые обязательства" #NT!
 nd_eth_gult_obligations_desc: "Поток дани от фермеров-арендаторов к держателю: скот, зерно и рабочая сила в обмен на военную защиту." #NT!
 nd_eth_rock_hewn_masonry: "Каменная кладка" #NT!
 nd_eth_rock_hewn_masonry_desc: "Необыкновенная эфиопская техника вырезания церквей и палат непосредственно из живого камня, унаследованная от шедевров Лалибелы династии Загве." #NT!
 nd_eth_shamma_weaving: "Шамма Ткачество" #NT!
 nd_eth_shamma_weaving_desc: "Производство ткани шамма, характерной белой хлопчатобумажной одежды с красочной каймой, которую носят все слои эфиопского общества." #NT!
 nd_eth_danakil_extraction: "Добыча соли Данакила" #NT!
 nd_eth_danakil_extraction_desc: "Жестокий труд по добыче соляных блоков из впадины Данакиль, одного из самых жарких мест на Земле, для использования в качестве валюты в высокогорье." #NT!
 levy_nd_eth_shotelai: "Шотелай Леви" #NT!
 levy_nd_eth_shotelai_desc: "Горские всадники, собранные из дворянских поместий, вооруженные традиционным изогнутым мечом-шотелом." #NT!
 levy_nd_eth_shotelai_ren: "Ренессанс Шотелай Леви" #NT!
 levy_nd_eth_shotelai_ren_desc: "Улучшенная кавалерия Шотелай, набранная из провинциальной знати, сочетающая традиционное оружие с лучшими доспехами." #NT!
 levy_nd_eth_chewa_guard: "Чева Страж Леви" #NT!
 levy_nd_eth_chewa_guard_desc: "Элитная кавалерия, набранная из военных колоний Чева, присягнувшая императору и сохраняемая в качестве постоянной боевой силы." #NT!
 nd_eth_formed_tt: "была образована Эфиопия." #NT!
 nd_eth_path_a_tt: "Выберите судьбу #bold Меча Сиона#!." #NT!
 nd_eth_path_b_tt: "Выберите судьбу #bold Свет Аксума#!" #NT!
 nd_eth_destiny: "Соломонов мандат" #NT!
 nd_eth_destiny_desc: "Когда нагорье объединилось под властью Льва Иуды, Негуса Нагаст должен укрепить имперскую власть. Стабилизируйте королевство, чтобы подготовиться к великой судьбе, ожидающей трон Соломона." #NT!
 nd_eth_dest_horn: "Завоевание Рога" #NT!
 nd_eth_dest_horn_desc: "Мусульманские крепости Харар и Бербера доминируют на восточных подступах к Эфиопскому нагорью. Захватите их, чтобы сломить исламскую власть на Роге и открыть путь к морю." #NT!
 nd_eth_dest_red_sea: "Хозяева Красного моря" #NT!
 nd_eth_dest_red_sea_desc: "Контроль над Аденом и Суакином ставит все Красное море под власть Соломоновых Островов. Создайте могучую армию и захватите эти ворота, чтобы контролировать пролив между Африкой и Аравией." #NT!
 nd_eth_dest_new_jerusalem: "Новый Иерусалим" #NT!
 nd_eth_dest_new_jerusalem_desc: "Исполните Соломоново пророчество. Возьмите Иерусалим и Мекку, доказывая, что потомки Соломона вернулись, чтобы заявить права на свое божественное наследие. Заслужите престиж, достойный пресвитера Джона." #NT!
 nd_eth_dest_crossroads: "Перекресток Индийского океана" #NT!
 nd_eth_dest_crossroads_desc: "Эфиопия находится на стыке Африки и Аравии. Перенесите богатства торговли Индийского океана на высокогорные рынки, кофе с наших плато, слоновую кость из внутренних районов и наполните сокровищницу золотом." #NT!
 nd_eth_dest_gold_routes: "Золотые маршруты" #NT!
 nd_eth_dest_gold_routes_desc: "Распространите коммерческие амбиции аксумцев на побережье Суахили. Возьмите Могадишо, используйте современное банковское дело и развивайте это царство до тех пор, пока эфиопские купцы не станут конкурировать с торговцами любой другой страны." #NT!
 nd_eth_dest_crown_nile: "Корона Нила" #NT!
 nd_eth_dest_crown_nile_desc: "Захватите Каир, величайший город Нила, и постройте коммерческую империю, простирающуюся от высокогорных истоков Голубого Нила до Средиземноморья. Охватите глобальную торговлю и развивайте королевство в полной мере." #NT!
 nd_eth.7.t: "Соломонов мандат" #NT!
 nd_eth.7.d: "Придворные астрологи и сам Абун сходятся во мнении: знаки благоприятны. В высокогорье мир, казна в порядке, а власть Негуса Нагаста неоспорима от Тыграя до Шева. Эфиопия готова исполнить любую судьбу, которую Бог предназначил наследникам Соломона.\n\nКнижники записывают этот момент в царской хронике: в этот день был продлен мандат Соломона, и империя направила свое лицо к величию." #NT!
 nd_eth.7.a: "Мандат Соломона возобновляется." #NT!
 nd_eth.8.t: "Меч нисходит на рог" #NT!
 nd_eth.8.d: "Харар, эта крепость ислама на нашей восточной границе, пал в руках Эфиопии. Полумесяц снесен с минаретов, а на его месте поднят крест. Бербера тоже подчиняется, ее купцы теперь платят дань Льву Иуды, а не сомалийским султанам.\n\nЗавоевание Рога посылает послание каждому мусульманскому государству от Адена до Каира: Эфиопия больше не довольствуется простой защитой своих гор. Меч Сиона сейчас простирается наружу, и он не будет вложен в ножны, пока амбиции Негуса Нагаста не будут реализованы." #NT!
 nd_eth.8.a: "Рог наш. Что лежит за этим?" #NT!
 nd_eth.9.t: "Хозяева Красного моря" #NT!
 nd_eth.9.d: "Эфиопские знамена реют над Аденом и Суакином. Великий пролив, соединяющий Средиземноморье с Индийским океаном, теперь прочно находится в руках Соломона. Ни один корабль не пройдет через Баб-эль-Мандеб без разрешения Эфиопии.\n\nЭто трансформация горной империи, которая когда-то вообще не имела береговой линии. Эфиопские губернаторы теперь управляют тропическими портами, собирают пошлины на индийские специи и контролируют снабжение флота продовольствием. Вопрос в том, создавать ли военно-морскую мощь для господства в этих водах или продвигать священную войну еще глубже в земли ислама." #NT!
 nd_eth.9.a: "Постройте флот, достойный морской империи." #NT!
 nd_eth.9.b: "Начните священную войну: этого хочет Бог!" #NT!
 nd_eth.10.t: "Новый Иерусалим" #NT!
 nd_eth.10.d: "Невозможное было достигнуто. Эфиопские солдаты стоят как в Иерусалиме, так и в Мекке. Соломоново пророчество сбылось: потомки Менелика I вернулись в земли своего предка. Ковчег Завета, долгое время хранившийся в Аксуме, теперь покоится на земле, простирающейся от его происхождения до обещанного места назначения.\n\nХристианская Европа поражена. Легенда о пресвитере Иоанне, могущественном христианском короле за пределами исламских земель, стала реальностью. Послы приезжают из Рима, Константинополя, от всех дворов Европы, жаждущие договориться с этим африканским императором, который совершил то, чего не смогли крестоносцы. Как Эфиопия сможет распорядиться этой необычайной силой?" #NT!
 nd_eth.10.a: "Приветствуем послов. Мы Престер Джон." #NT!
 nd_eth.10.b: "Нам не нужно одобрение из-за границы. Лев побеждает." #NT!
 nd_eth.11.t: "Перекресток Индийского океана" #NT!
 nd_eth.11.d: "Эфиопский кофе и слоновая кость сейчас текут по рынкам столицы, привлекая торговцев из Аравии, Индии и других стран. Горные плато, которые когда-то казались изолированными от мировой торговли, превратились в перекресток. Дау везут наш кофе в Аден и Ормуз. Караваны из слоновой кости из внутренних районов заканчиваются на наших рынках. Золото накапливается в королевской казне такими темпами, которые удивили бы аксумских королей.\n\nДревняя мечта Аксума — стать торговой цивилизацией, соединяющей Африку и мир Индийского океана, снова оживает. И в отличие от Аксума, мы контролируем кофе, которого мир учится жаждать." #NT!
 nd_eth.11.a: "Пусть богатства океана текут через наши руки." #NT!
 nd_eth.12.t: "Золотые маршруты" #NT!
 nd_eth.12.d: "Могадишо, жемчужина побережья Суахили, теперь подчиняется Негуса Нагаст. Ее древние торговые дома, привыкшие торговать золотом, слоновой костью и специями, открыли свои бухгалтерские книги эфиопским купцам. Благодаря развитию банковских учреждений и устойчивому развитию наших горных провинций Эфиопия превратилась из горной крепости в коммерческую державу.\n\nТеперь вопрос в том, как распорядиться этим богатством. Должна ли Эфиопия монополизировать маршруты пряностей, чтобы максимизировать доходы, или вложить свои богатства в обучение и реформы, которые продлятся еще долго после того, как пассаты изменятся?" #NT!
 nd_eth.12.a: "Монополизировать маршруты пряностей и золота." #NT!
 nd_eth.12.b: "Инвестируйте богатство в обучение и реформы." #NT!
 nd_eth.13.t: "Корона Нила" #NT!
 nd_eth.13.d: "Каир пал перед войсками Эфиопии. Величайший город Нила, резиденция фараонов и халифов, теперь подчиняется Негуса Нагасту. Эфиопия контролирует все течение священной реки от ее горных истоков до дельты Средиземного моря, являясь страной, развитой и процветающей вне всякого прецедента.\n\nЭто империя, не имеющая себе равных в африканской истории. Ни аксумиты, ни фараоны, ни халифы не имели власти над таким богатством и такой широтой торговли. Эфиопские ученые спорят о том, больше ли это царство напоминает легендарные владения царицы Савской или что-то совершенно новое, цивилизацию, соединяющую Африку, Аравию и Средиземноморский мир." #NT!
 nd_eth.13.a: "Правьте с мудростью Македы, царицы Савской." #NT!
 nd_eth.13.b: "Соломонов престол вечен и неделим." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_bab_el_mandeb: "Стражи пролива" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_bab_el_mandeb: "Эфиопские военно-морские силы патрулируют Баб-эль-Мандеб, контролируя проход между Красным морем и Индийским океаном. Горная империя превратилась в морскую державу." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_crusade_onward: "Крестовый поход без конца" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_crusade_onward: "Священная война продвигается вперед по землям ислама. Эфиопские миссионеры следуют за армиями, обращая в свою веру побежденных, хотя стоимость бесконечных кампаний истощает казну." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_prester_john: "Престер Иоанн открылся" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_prester_john: "Легенда о пресвитере Иоанне, могущественном христианском короле за пределами исламских земель, стала реальностью. Европейские послы стекаются ко дворам Эфиопии, а агенты Эфиопии свободно перемещаются по дворам христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_lion_conquers: "Лев побеждает" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_lion_conquers: "Лев Иуды оказался сильнее любой силы, выступившей против него. Эфиопские армии действуют с устрашающей скоростью и тактическим мастерством, диктуя условия побежденным." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_spice_monopoly: "Монополия специй" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_spice_monopoly: "Эфиопские купцы монополизировали торговлю кофе, слоновой костью и специями на побережье Индийского океана. Сосредоточение внимания на торговле означает, что содержание армий становится дороже, но богатство с лихвой компенсирует это." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_invest_learning: "Аксумский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_invest_learning: "Богатство торговли в Индийском океане течет в школы, библиотеки и правовую реформу. Эфиопские ученые создают работы, которые могут соперничать с работами Каира или Константинополя." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_queen_sheba: "Мудрость Македы" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_queen_sheba: "Подобно царице Савской, которая отправилась в Иерусалим в поисках мудрости, Эфиопия теперь привлекает к своему двору мудрейшие умы трех континентов. Негуса Нагаст правит посредством дипломатии и знаний." #NT!
 STATIC_MODIFIER_NAME_nd_eth_dest_eternal_throne: "Вечный Трон" #NT!
 STATIC_MODIFIER_DESC_nd_eth_dest_eternal_throne: "Династия Соломоновых островов восседает на троне, простирающемся от Нила до Индийского океана. Легитимность короны абсолютна, а ее флот патрулирует моря огромной торговой империи." #NT!
 nd_eth_tabernacle: "Скиния Сиона" #NT!
 nd_eth_tabernacle_desc: "Монументальное святилище, построенное для хранения Ковчега Завета по образцу Храма Соломона и отражающее претензии Эфиопии как хранителя самой святой реликвии христианского мира. Его духовенство несет вечное бдение." #NT!
 nd_eth_ark_guardians: "Стражи Ковчега" #NT!
 nd_eth_ark_guardians_desc: "Жреческий орден, посвященный охране Скинии, курению благовоний и хранению священных реликвий Соломонова завета." #NT!
 nd_eth_house_of_aksumite_learning: "Дом аксумского учения" #NT!
 nd_eth_house_of_aksumite_learning_desc: "Грандиозная академия, где сходятся научные традиции Эфиопии, Египта, Индии и суахили. Купцы и ученые собираются для обмена знаниями, создавая центр обучения и торговли, не имеющий себе равных в Африке." #NT!
 nd_eth_scholarly_exchange: "Научный обмен" #NT!
 nd_eth_scholarly_exchange_desc: "Ученые со всей Эфиопской империи и за ее пределами изучают, переводят и создают рукописи в этом великом образовательном центре." #NT!
  
 # ===== BUREAUCRACY ===== 
 AUTO_MODIFIER_NAME_nd_eth_bureaucracy_authority: "Соломонов аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_eth_bureaucracy_authority: "Институты Соломонового государства (странствующая катама, митрополичья кафедра Абуна, власть Ечеге над монастырями, Фетха-Нагаст как высший закон и двойное гультистское правление, связывающее дворян и крестьян с царством) превратились в последовательный административный аппарат. На этом фундаменте своеобразные институты христианского королевства Эфиопии начинают принимать свою прочную форму." #NT!
  
 eth_solomonic_katama_bureaucracy: "Соломонова катама" #NT!
 eth_solomonic_katama_bureaucracy_desc: "Укрепленный странствующий королевский лагерь вокруг Негуса Нагаста, концентрически построенный вокруг императорского павильона и королевских часовен. Со времен правления Амды Сейона (1314–1344) и до тех пор, пока Фасилид не основал столицу в Гондаре в 1636 году, император и его двор постоянно путешествовали по королевству: проводили высший суд, принимали иностранные посольства и проецировали власть Соломона посредством личного присутствия, а не письменных указов. Катама была политическим центром государства, и ее присутствие в регионе само по себе было гарантией верности." #NT!
  
 eth_abun_metropolitanate_bureaucracy: "Митрополия Абун" #NT!
 eth_abun_metropolitanate_bureaucracy_desc: "Эфиопскую церковь Тевахедо возглавлял Абуна, коптский египетский монах, посвященный в сан Александрийского патриарха и отправленный на юг, в Аксум. С момента обращения короля Эзаны в 4 веке до автокефалии в 1959 году Абуна всегда был иностранцем. Соглашение связывало Эфиопию с коптским Каиром для епископской преемственности и давало церкви некоторую независимость от королевского вмешательства, но также делало это назначение вечным козырем в переговорах с мамлюкскими султанами, которые могли десятилетиями удерживать нового Абуна, чтобы вымогать уступки." #NT!
  
 eth_echege_debre_libanos_bureaucracy: "Эчеге Дебре Либанос" #NT!
 eth_echege_debre_libanos_bureaucracy_desc: "Настоятель великого монастыря Шеван, основанного святым Текле Хайманотом в XIII веке, который с XV века носил титул Эчеге и власть над всеми эфиопскими монастырями. Второй по церковному рангу после иностранного Абуна, Эчеге всегда был коренным эфиопом, и в те длительные периоды, когда место Абуна было вакантно, он становился фактическим главой церкви. Эта договоренность давала негу внутренний клерикальный рычаг, которым не мог быть назначенный коптами Абуна." #NT!
  
 eth_fetha_nagast_bureaucracy: "Фета Нагаст" #NT!
 eth_fetha_nagast_bureaucracy_desc: "Закон королей, юридический кодекс геэза, переведенный в 15 веке из арабско-коптского сборника Абу'л-Фадаила ибн аль-Ассаля (около 1240 г.). Опираясь на Корпус Юстиниана, каноны Никеи и Антиохии, а также Пятикнижие Моисея, Фетха Нагаст оставался высшим законом Эфиопии до 1931 года. Его первая половина регулировала церковную дисциплину; его вторая половина управляла семьей, долгом и гражданской администрацией. Только духовенство могло читать его, и поэтому они были юристами королевства: профессия, из которой воинская знать была структурно исключена." #NT!
  
 eth_gult_rist_tenure_bureaucracy: "Гульт и Рист" #NT!
 eth_gult_rist_tenure_bureaucracy_desc: "Два столпа земельного законодательства Эфиопии. Гульт был феодальным правом, ненаследственным грантом от негуса или его губернаторов, который давал право собирать дань и рабочую силу с определенного населения; владелец был держателем феодального владения, а не землевладельцем, и корона могла отозвать грант в любое время. Рист представлял собой неотъемлемое наследственное право пользования, принадлежавшее каждому потомку предка-первого владельца, распределявшееся амбилинально между поколениями. Вместе они привязывали дворян к короне по землевладению, а крестьян — по родословной." #NT!
  
 eth_chewa_regiments_bureaucracy: "Полки Чева" #NT!
 eth_chewa_regiments_bureaucracy_desc: "Христианские военные колонии были созданы во время правления Амды Сейона (1314–1344 гг.) и реорганизованы под руководством великого кодификатора Зара Якоба (1434–1468 гг.). Каждый полк чева представлял собой профессиональную армию численностью в несколько тысяч человек, выполнявшую свое собственное задание, с детства обученную владению изогнутым мечом шоталай и копьем и поддерживаемую трудом окружающего крестьянства. Полк Абе Лама, основанный в 14 веке, выстоял в боях при Адве в 1896 году, спустя пять с половиной столетий после своего создания." #NT!
  
 eth_ras_bitwoded_government_bureaucracy: "Правительство Раса" #NT!
 eth_ras_bitwoded_government_bureaucracy_desc: "Региональное аристократическое правительство, сформировавшееся во время Земенского Месафинта (1769-1855), когда император Соломоновых островов в Гондаре был низведен до номинального главы, а реальная власть принадлежала премьер-министрам Рас-Битводеда из Тыграя, Йеджу, Годжама и Шева. Двадцать три императора заняли трон за восемьдесят шесть лет; Семьи Рас назначали и смещали их по своему желанию, и владения Раса управлялись как его собственные. Эта договоренность сохранила королевство, передав власть тем, кто мог обеспечить ее соблюдение на местном уровне, за счет постоянной цены центральной легитимности." #NT!
