l_russian:
 STATIC_MODIFIER_NAME_nd_usa_revolutionary_republic: "Дух 76-го" #NT!
 STATIC_MODIFIER_DESC_nd_usa_revolutionary_republic: "Революционный пыл, породивший Республику, течет по венам нации. Дух свободы, самоуправления и сопротивления тирании вдохновляет каждого гражданина-солдата защищать новый порядок." #NT!
 STATIC_MODIFIER_NAME_nd_usa_manifest_destiny: "Манифест судьбы" #NT!
 STATIC_MODIFIER_DESC_nd_usa_manifest_destiny: "Убежденность в том, что Провидение предопределило американскую экспансию от моря к сияющему морю, гонит поселенцев на запад, с каждым годом превращая дикую природу в цивилизацию." #NT!
 STATIC_MODIFIER_NAME_nd_usa_city_on_a_hill: "Город на холме" #NT!
 STATIC_MODIFIER_DESC_nd_usa_city_on_a_hill: "Американский эксперимент с республиканским правительством сияет миру как маяк. Сильные институты, демократическое управление и верховенство закона делают эту новую страну образцом для подражания." #NT!
 STATIC_MODIFIER_NAME_nd_usa_federalist_vision: "Федералистское видение" #NT!
 STATIC_MODIFIER_DESC_nd_usa_federalist_vision: "Сильное центральное правительство с перечисленными полномочиями объединяет штаты в более совершенный союз. Финансовая система Гамильтона и прецеденты Вашингтона придают республике институциональную силу." #NT!
 STATIC_MODIFIER_NAME_nd_usa_states_rights: "Дух антифедералистов" #NT!
 STATIC_MODIFIER_DESC_nd_usa_states_rights: "Суверенитет отдельных государств и права народа служат защитой от тирании. Местное управление и религиозная свобода процветают при децентрализованной власти." #NT!
 STATIC_MODIFIER_NAME_nd_usa_second_war_independence: "Вторая война за независимость" #NT!
 STATIC_MODIFIER_DESC_nd_usa_second_war_independence: "Победа над бывшей метрополией доказала, что американская военно-морская мощь может бросить вызов величайшему флоту в мире. «Олд Айронсайдс» и его родственные фрегаты заслужили бессмертную славу." #NT!
 STATIC_MODIFIER_NAME_nd_usa_era_national_unity: "Эра национального единства" #NT!
 STATIC_MODIFIER_DESC_nd_usa_era_national_unity: "Успешная защита республики от иностранной агрессии сформировала новое чувство национальной идентичности. Американцы больше не являются в первую очередь жителями Вирджинии или Нью-Йорка, они — американцы." #NT!
 STATIC_MODIFIER_NAME_nd_usa_hemispheric_shield: "Полусферический щит" #NT!
 STATIC_MODIFIER_DESC_nd_usa_hemispheric_shield: "Америка закрыта для дальнейшей европейской колонизации. Будучи хранителем Западного полушария, Соединенные Штаты заявляют о своем праве выступать против любого вмешательства Старого Света в дела Нового Света." #NT!
 STATIC_MODIFIER_NAME_nd_usa_splendid_isolation: "Великолепная изоляция" #NT!
 STATIC_MODIFIER_DESC_nd_usa_splendid_isolation: "Свободная от запутанных европейских союзов, республика обращается к себе, чтобы развивать свои огромные ресурсы. Мир за рубежом и процветание внутри страны являются двумя столпами американской политики." #NT!
 nd_usa.1.t: "Рождение Республики" #NT!
 nd_usa.1.d: "Невозможное было достигнуто. Из тринадцати враждебных колоний, цепляющихся за Атлантическое побережье, возникла новая нация — Соединенные Штаты Америки. Старые монархии Европы смотрят на это со смесью презрения и беспокойства, поскольку эта республика родилась не в результате династического наследия, а на основе революционного принципа. Конституция, разработанная в изнуряющую жару лета в Филадельфии, устанавливает правительство, непохожее ни на одно другое, что видел мир: власть разделена, права перечислены, а суверенитет принадлежит самим людям.\n\nНо работа по построению нации только началась. Граница тянется бесконечно на запад. Казначейство пусто, а долги войны остаются неоплаченными. Бывшие союзники и враги в равной степени проверяют решимость этой молодой республики. Вопрос теперь не в том, сможет ли Америка завоевать свою независимость и эта битва выиграна, а в том, какой нацией она станет.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_usa.1.a: "Дерево свободы необходимо поливать." #NT!
 nd_usa.1.b: "От моря до сияющего моря." #NT!
 nd_usa.1.c: "Правительство законов, а не людей." #NT!
 nd_usa.2.t: "Конституционный Конвент" #NT!
 nd_usa.2.d: "Летом 1787 года пятьдесят пять делегатов собрались в Филадельфии, чтобы обсудить фатальные недостатки Статей Конфедерации. То, что появилось после четырех месяцев ожесточенных дебатов, было не пересмотром, а революцией, совершенно новой структурой правления. Великий компромисс между большими и малыми штатами, разделение властей между тремя равноправными ветвями власти и хрупкий баланс между федеральной властью и суверенитетом штата позволили создать документ, который окажется удивительно прочным.\n\nНо Конституция не была всеобще одобрена. Федералисты во главе с Гамильтоном, Мэдисоном и Джеем страстно выступали за ратификацию в серии блестящих эссе. Антифедералисты, подозрительно относящиеся к централизованной власти, потребовали Билля о правах для защиты индивидуальных свобод. Фундаментальный вопрос о том, сколько власти должно принадлежать национальному правительству по сравнению с штатами, будет определять американскую политику на протяжении поколений." #NT!
 nd_usa.2.a: "Сильный профсоюз требует сильного правительства." #NT!
 nd_usa.2.b: "Лучше всего правит правительство, наиболее близкое к народу." #NT!
 nd_usa.3.t: "Война 1812 года" #NT!
 nd_usa.3.d: "Когда молодая республика вступила в войну с Великобританией в 1812 году, многие ожидали быстрого унижения. Королевский флот беспрепятственно господствовал на волнах, а британская армия только что разгромила маршалов Наполеона в Испании. Однако война принесла неожиданные победы. Корабль военного корабля США «Конституция» с корпусом из живого дуба, отмахивающимся от британских пушечных ядер, заслужил бессмертное прозвище «Старый Железнобокий» и доказал, что американские фрегаты могут стоять лицом к лицу с лучшими военными кораблями на плаву.\n\nРешающая победа Эндрю Джексона в Новом Орлеане, одержанная, по иронии судьбы, уже после подписания мира в Генте, изменила национальный моральный дух. Сожжение Вашингтона было отомщено, и республика обрела новую уверенность. Должна ли эта война вдохновить великую военно-морскую традицию или возродить дух национального единства – это вопрос, стоящий перед нацией." #NT!
 nd_usa.3.a: "Старый Айронсайдс показал путь. Постройте флот, достойный республики." #NT!
 nd_usa.3.b: "Республика восстановлена. Пусть национальная гордость скрепит единство." #NT!
 nd_usa.4.t: "Доктрина Монро" #NT!
 nd_usa.4.d: "В своем ежегодном послании Конгрессу в 1823 году президент Джеймс Монро сформулировал принцип, который изменит геополитику Западного полушария. Он заявил, что Америка больше не открыта для европейской колонизации. Любая попытка держав Старого Света распространить свою систему на любую часть этого полушария будет рассматриваться как опасная для американского мира и безопасности.\n\nДоктрина Монро, первоначально поддержанная скорее британскими военно-морскими силами, чем американской мощью, тем не менее, установила смелое заявление: Соединенные Штаты будут служить хранителем всего Западного полушария. Критики увидели перенапряжение; Сторонники видели естественное продолжение республиканских принципов. Эта доктрина могла бы послужить щитом для обороны полушария или оправданием для обращения вовнутрь и мирного освоения обширных внутренних территорий Америки." #NT!
 nd_usa.4.a: "Америка будет свободна от европейского вмешательства." #NT!
 nd_usa.4.b: "Пусть Старый Свет держится при себе, а мы при своем." #NT!
 nd_usa.5.t: "Корпус открытий" #NT!
 nd_usa.5.d: "В мае 1804 года Мериуэзер Льюис и Уильям Кларк покинули Сент-Луис с группой из тридцати трех человек, поднявшись по реке Миссури в неизведанную глубь континента. В течение следующих двух лет Корпус открытий преодолеет восемь тысяч миль, пересечет Скалистые горы и достигнет Тихого океана. По пути они задокументировали сотни видов растений и животных, неизвестных западной науке, установили контакты с десятками индейских народов и составили первые точные карты внутренних районов Америки.\n\nЭкспедиция открыла шлюзы для экспансии на запад. Подробные дневники Льюиса и Кларка сделали огромную территорию между Миссисипи и Тихим океаном осязаемой в воображении американцев: она перестала быть пустым местом на карте, а стала страной рек, гор и безграничных возможностей." #NT!
 nd_usa.5.a: "Запад открыт." #NT!
 nd_usa.6.t: "Американская система производства" #NT!
 nd_usa.6.d: "В Спрингфилдской оружейной палате в Массачусетсе тихая революция изменила саму природу производства. Вместо того, чтобы полагаться на квалифицированных мастеров для ручной установки каждого компонента, американские производители первыми начали использовать взаимозаменяемые детали, стандартизированные компоненты, обработанные с такими точными допусками, что любая деталь могла заменить любую другую того же типа. То, что началось с производства мушкетов, быстро распространилось на часы, швейные машины и, в конечном итоге, на все уголки американской промышленности.\n\nЕвропейские посетители восхищались этой «американской системой производства», которая приносила в жертву индивидуальное мастерство ремесленника ради чего-то более мощного: способности производить огромные количества надежных, поддающихся ремонту товаров. В сочетании с хлопкоочистительной машиной Эли Уитни и быстрым расширением сетей каналов и дорог американское производство было готово преобразовать экономику континента." #NT!
 nd_usa.6.a: "Наступает век машин." #NT!
 nd_usa_atlantic_commerce: "Атлантическая коммерция" #NT!
 nd_usa_atlantic_commerce_desc: "Сеть колониальных торговых путей, связывающих американские порты с рынками Европы и Карибского бассейна, перевозящих табак, лесоматериалы, рыбу и ром через океан." #NT!
 nd_usa_town_meeting_tradition: "Традиция городского собрания" #NT!
 nd_usa_town_meeting_tradition_desc: "Практика прямого демократического управления Новой Англии на местном уровне, когда свободные граждане собирались для обсуждения и решения вопросов общественной важности." #NT!
 nd_usa_colonial_militia_tradition: "Традиция колониальной милиции" #NT!
 nd_usa_colonial_militia_tradition_desc: "Колониальная практика, согласно которой каждый трудоспособный мужчина держит оружие и тренируется в местной милиции, устанавливая традицию гражданина-солдата, которая определила американскую военную культуру.\n\n#italic Доступно в: $nd_usa_colonial_warehouse$#!" #NT!
 nd_usa_triangular_trade: "Треугольная торговля" #NT!
 nd_usa_triangular_trade_desc: "Трехсторонняя коммерческая сеть, соединяющая винокуренные заводы Новой Англии, африканские невольничьи рынки и сахарные плантации Карибского бассейна, прибыльный, хотя и морально чреватый двигатель колониального богатства." #NT!
 nd_usa_frontier_defense: "Пограничная оборона" #NT!
 nd_usa_frontier_defense_desc: "Цепь укрепленных частоколов и поселений вдоль западной границы, защищающая поселенцев от набегов и обозначающая наступающую границу американской цивилизации." #NT!
 nd_usa_minuteman_tradition: "Минитменская традиция" #NT!
 nd_usa_minuteman_tradition_desc: "Традиция элитного ополчения, зародившаяся в Массачусетсе, где избранные мужчины регулярно тренировались и давали клятву быть готовыми в любую минуту вступить в бой в защиту свободы." #NT!
 nd_usa_colonial_shipbuilding: "Колониальное судостроение" #NT!
 nd_usa_colonial_shipbuilding_desc: "Верфи Новой Англии, благословленные обильным лесом и квалифицированными мастерами, производили суда, которые могли конкурировать с любыми судами в мире, и заложили основу американской военно-морской мощи." #NT!
 nd_usa_no_taxation: "Никакого налогообложения без представительства" #NT!
 nd_usa_no_taxation_desc: "Основополагающий принцип Американской революции: ни одно правительство не может взимать налоги с людей, которые не имеют права голоса в ее решениях." #NT!
 nd_usa_plantation_economy: "Плантационная экономика" #NT!
 nd_usa_plantation_economy_desc: "Крупномасштабная сельскохозяйственная система южных колоний, производящая табак, рис, индиго, а затем хлопок для экспорта на европейские рынки." #NT!
 nd_usa_continental_congress: "Континентальный Конгресс" #NT!
 nd_usa_continental_congress_desc: "Первый единый руководящий орган американских колоний, в котором делегаты из тринадцати отдельных колоний собрались вместе, чтобы выработать общий ответ на британскую тиранию." #NT!
 nd_usa_constitutional_convention: "Конституционное собрание" #NT!
 nd_usa_constitutional_convention_desc: "Собрание лучших политических умов Америки в Филадельфии, где обсуждалась, разрабатывалась и подписывалась Конституция, высший закон страны." #NT!
 nd_usa_continental_army: "Континентальная армия" #NT!
 nd_usa_continental_army_desc: "Профессиональная военная сила, созданная Континентальным Конгрессом и обученная бароном фон Штойбеном в Вэлли-Фордж, довела до тупика Британскую империю и завоевала независимость Америки." #NT!
 nd_usa_continental_dragoons: "Континентальные драгуны" #NT!
 nd_usa_continental_dragoons_desc: "Конные войска Континентальной армии, возглавляемые такими офицерами, как «Легкая кавалерия Гарри» Ли, которые служили разведчиками, рейдерами и ударной кавалерией во время Революции." #NT!
 nd_usa_six_frigates: "Оригинальные шесть фрегатов" #NT!
 nd_usa_six_frigates_desc: "Шесть тяжелых фрегатов, утвержденных Законом о военно-морском флоте 1794 года, Конституцией, Соединенными Штатами, Созвездием, Президентом, Конгрессом и Чесапиком, которые основали ВМС США." #NT!
 nd_usa_privateer_tradition: "Каперская традиция" #NT!
 nd_usa_privateer_tradition_desc: "Американская традиция использования частных судов для ведения коммерческой войны против кораблей противника, которая дополняла небольшой Континентальный флот сотнями вооруженных рейдеров." #NT!
 nd_usa_springfield_armory: "Спрингфилдская оружейная палата" #NT!
 nd_usa_springfield_armory_desc: "Первый национальный арсенал, основанный в 1777 году в Спрингфилде, штат Массачусетс, который стал центром американского оружейного производства и родиной взаимозаменяемых деталей." #NT!
 nd_usa_navy_yard_tradition: "Традиции военно-морской верфи" #NT!
 nd_usa_navy_yard_tradition_desc: "Сеть федеральных верфей (Бостон, Филадельфия, Норфолк, Портсмут), на которых строились, ремонтировались и достраивались к эксплуатации американские военные корабли." #NT!
 nd_usa_customs_revenue_system: "Система таможенных доходов" #NT!
 nd_usa_customs_revenue_system_desc: "Система тарифов и таможенных пошлин, которую Александр Гамильтон разработал для финансирования федерального правительства и защиты зарождающейся американской промышленности от иностранной конкуренции." #NT!
 nd_usa_lewis_clark_expedition: "Экспедиция Льюиса и Кларка" #NT!
 nd_usa_lewis_clark_expedition_desc: "Эпическое путешествие Корпуса открытий из Сент-Луиса к Тихому океану, составившее карту внутренней части континента и открывшее путь для экспансии на запад." #NT!
 nd_usa_war_of_1812_tradition: "Война 1812 года Традиция" #NT!
 nd_usa_war_of_1812_tradition_desc: "Военные традиции зародились во время второй войны Америки против Британии, от морских дуэлей фрегатов до победы Эндрю Джексона в Новом Орлеане." #NT!
 nd_usa_monroe_doctrine: "Доктрина Монро" #NT!
 nd_usa_monroe_doctrine_desc: "Заявление президента Монро о том, что Западное полушарие закрыто для дальнейшей европейской колонизации, — смелое утверждение американского влияния на весь Новый Свет." #NT!
 nd_usa_frontiersman_tradition: "Традиция пограничника" #NT!
 nd_usa_frontiersman_tradition_desc: "Традиции американского пограничника Дэниела Буна, Дэви Крокетта и бесчисленных безымянных поселенцев, опытных стрелков и лесников, которые укротили дикую природу с помощью винтовки и топора." #NT!
 nd_usa_american_shipbuilding: "Американское судостроение" #NT!
 nd_usa_american_shipbuilding_desc: "Развитие американского военно-морского строительства, строительство военных кораблей из живого дуба и белой сосны, которые могли сравниться с лучшими кораблями любого европейского военно-морского флота." #NT!
 nd_usa_revenue_cutter_service: "Служба сокращения доходов" #NT!
 nd_usa_revenue_cutter_service_desc: "Флот быстрых катеров, созданный Александром Гамильтоном для обеспечения соблюдения таможенного законодательства на американском побережье, предшественник Береговой охраны США." #NT!
 nd_usa_american_system_manufactures: "Американская система производства" #NT!
 nd_usa_american_system_manufactures_desc: "Революционный метод производства с использованием взаимозаменяемых деталей и станков, впервые примененный в Спрингфилдской оружейной палате, который изменил американскую промышленность.\n\n#italic Доступно в: $nd_usa_federal_armory$#!" #NT!
 nd_usa_judicial_review: "Судебный пересмотр" #NT!
 nd_usa_judicial_review_desc: "Принцип, установленный главным судьей Джоном Маршаллом в деле Марбери против Мэдисона, согласно которому Верховный суд имеет право отменять законы, нарушающие Конституцию." #NT!
 nd_usa_internal_improvements: "Внутренние улучшения" #NT!
 nd_usa_internal_improvements_desc: "Обширная программа строительства каналов, дорог и инвестиций в инфраструктуру, объединяющая отдаленные регионы расширяющейся республики." #NT!
 a_nd_usa_minuteman: "Минитмен" #NT!
 a_nd_usa_minuteman_desc: "Отобранные из лучших людей колониальной милиции, минитмены регулярно тренируются и обязуются собираться в любую минуту. Их скорость реакции и знание местной местности делают их грозными защитниками американской свободы." #NT!
 a_nd_usa_continental_line: "Континентальная линейная пехота" #NT!
 a_nd_usa_continental_line_desc: "Дисциплинированные регулярные войска Континентальной армии, обученные европейской линейной тактике у барона фон Штойбена в Вэлли-Фордж. Они являются основой профессиональной армии Америки." #NT!
 a_nd_usa_continental_dragoon: "Континентальный драгун" #NT!
 a_nd_usa_continental_dragoon_desc: "Универсальные конные войска, которые могут сражаться верхом на лошадях или спешиваться, чтобы служить пехотой. Возглавляемые лихими кавалеристами, такими как «Легкая Лошадь Гарри» Ли, они превосходны в разведке и фланговых маневрах." #NT!
 n_nd_usa_frigate: "Американский фрегат" #NT!
 n_nd_usa_frigate_desc: "Американские фрегаты, построенные из живого дуба и обшитые медью корпусами, быстрее, крепче и лучше вооружены, чем их европейские коллеги. Военный корабль США «Конституция» «Олд Айронсайдс» — самый известный корабль этого класса." #NT!
 n_nd_usa_privateer_schooner: "Каперская шхуна" #NT!
 n_nd_usa_privateer_schooner_desc: "Быстрые и маневренные шхуны, предназначенные для каперов и охотящихся на вражескую торговлю. Эти корабли полагаются на скорость, а не на огневую мощь, бросаясь в атаку, чтобы захватить трофеи до того, как более тяжелые военные корабли смогут ответить." #NT!
 a_nd_usa_frontiersman: "Стрелок-пограничник" #NT!
 a_nd_usa_frontiersman_desc: "Опытные стрелки с американской границы, вооруженные длинными винтовками поразительной точности. Эти выносливые лесники знают каждую тропу и брод, а их разрушительный прицельный огонь может сломить боевой дух любого противника." #NT!
 n_nd_usa_ship_of_the_line: "Американский линейный корабль" #NT!
 n_nd_usa_ship_of_the_line_desc: "Первоклассный военный корабль, построенный на верфях американского военно-морского флота из лучших пород живого дуба, на котором установлено более сотни орудий. Эти суда представляют собой развитие американской военно-морской мощи." #NT!
 n_nd_usa_revenue_cutter: "резак доходов" #NT!
 n_nd_usa_revenue_cutter_desc: "Быстрые и маневренные катера, которыми управляет налоговая служба для обеспечения соблюдения таможенных законов, борьбы с пиратством и патрулирования побережья Америки. Предшественник береговой охраны США." #NT!
 nd_usa_town_meeting_hall: "Городской конференц-зал" #NT!
 nd_usa_town_meeting_hall_desc: "Общественный зал, где собираются свободные граждане, чтобы управлять своим сообществом посредством прямой демократии, обсуждая налоги, выбирая должностных лиц и принимая местные постановления." #NT!
 nd_usa_colonial_warehouse: "Колониальный склад" #NT!
 nd_usa_colonial_warehouse_desc: "Прочный склад на набережной, где хранятся товары для атлантической торговли: бочки с табаком, вязанки меха, бочки с ромом, готовые к погрузке на торговые суда." #NT!
 nd_usa_frontier_stockade: "Пограничный частокол" #NT!
 nd_usa_frontier_stockade_desc: "Укрепленное деревянное ограждение на западной границе, служащее убежищем для поселенцев во время набегов и служащее базой для операций ополчения." #NT!
 nd_usa_federal_armory: "Федеральная оружейная палата" #NT!
 nd_usa_federal_armory_desc: "Национальный оружейный завод, производящий мушкеты, винтовки и боеприпасы с использованием унифицированных деталей, входит в арсенал республики." #NT!
 nd_usa_navy_yard: "Федеральная военно-морская верфь" #NT!
 nd_usa_navy_yard_desc: "Государственная верфь для строительства, ремонта и оснащения военных кораблей ВМС США." #NT!
 nd_usa_customs_house: "Федеральная таможня" #NT!
 nd_usa_customs_house_desc: "Внушительное федеральное здание, где таможенники определяют пошлины на импортируемые товары — основной источник дохода молодой республики." #NT!
 nd_usa_cotton_gin_workshop: "Мастерская хлопкоочистительной машины" #NT!
 nd_usa_cotton_gin_workshop_desc: "Механизированная мастерская, в которой находится хлопкоочистительная машина Эли Уитни, которая с революционной скоростью отделяет хлопковые волокна от семян, преобразуя сельское хозяйство Юга." #NT!
 nd_usa_federal_courthouse: "Здание Федерального суда" #NT!
 nd_usa_federal_courthouse_desc: "Местонахождение федеральной судебной власти, где интерпретируется Конституция и поддерживается верховенство закона, физическое воплощение судебного надзора." #NT!
 nd_usa_town_hall_upkeep: "Управление городским собранием" #NT!
 nd_usa_town_hall_upkeep_desc: "Бумага для протоколов и уведомлений, пиломатериалы для содержания зала, книги для городских отчетов и юридических справок." #NT!
 nd_usa_warehouse_upkeep: "Складские операции" #NT!
 nd_usa_warehouse_upkeep_desc: "Пиломатериалы для ящиков и ремонта конструкций, бумага для манифестов и торговых книг." #NT!
 nd_usa_stockade_upkeep: "Гарнизон частокола" #NT!
 nd_usa_stockade_upkeep_desc: "Древесина для ремонта частокола, вооружение для гарнизона и инструменты для постоянного содержания приграничных укреплений." #NT!
 nd_usa_armory_production: "Производство оружейной продукции" #NT!
 nd_usa_armory_production_desc: "Железо, пиломатериалы и инструменты перековываются в стандартизированные мушкеты и винтовки в национальном арсенале." #NT!
 nd_usa_navy_yard_upkeep: "Операции верфи" #NT!
 nd_usa_navy_yard_upkeep_desc: "Древесина, военно-морские запасы и железо расходуются при строительстве и ремонте военных кораблей." #NT!
 nd_usa_customs_upkeep: "Таможенное управление" #NT!
 nd_usa_customs_upkeep_desc: "Бумага для регистров и бланков, тонкая ткань для униформы таможенников, инструменты для взвешивания и измерения импортных товаров." #NT!
 nd_usa_cotton_gin_inputs: "Переработка хлопка" #NT!
 nd_usa_cotton_gin_inputs_desc: "Сырое волокно подается через механизмы железоочистительной машины, производя очищенный хлопок для текстильной промышленности." #NT!
 nd_usa_courthouse_upkeep: "Администрация суда" #NT!
 nd_usa_courthouse_upkeep_desc: "Бумага для юридических документов и приказов, книги для юридических библиотек, необходимых федеральным судам, а также мебель для залов судебных заседаний и палат." #NT!
 nd_usa_tobacco_curing: "Лечение табака" #NT!
 nd_usa_tobacco_curing_desc: "Медленная сушка табачного листа Вирджинии в деревянных сараях, производящая ароматический экспорт, построивший колониальную экономику." #NT!
 nd_usa_rum_distilling: "Производство рома" #NT!
 nd_usa_rum_distilling_desc: "Винокурни Новой Англии перерабатывают карибский сахар и патоку в ром, топливо трехсторонней торговли." #NT!
 nd_usa_interchangeable_parts: "Взаимозаменяемые детали" #NT!
 nd_usa_interchangeable_parts_desc: "Железо и уголь являются основой революционной технологии производства стандартизированного огнестрельного оружия со взаимозаменяемыми компонентами, обеспечивающей массовое производство и легкий ремонт." #NT!
 nd_usa_formed_tt: "были образованы Соединенные Штаты" #NT!
 nd_usa_path_a_tt: "Выбрал дух 76-го года" #NT!
 nd_usa_path_b_tt: "Выбрал манифестную судьбу" #NT!
 nd_usa_path_c_tt: "Выбрал город на холме" #NT!
 nd_usa_destiny: "Американская судьба" #NT!
 nd_usa_destiny_desc: "Соединенные Штаты вышли из революции и обрели государственность. Вопрос теперь в том, какую судьбу будет преследовать эта республика: континентальная империя от моря до сияющего моря или маяк свободы и институциональной силы, который преобразует мир своим примером." #NT!
 nd_usa_dest_frontier: "Граница манит" #NT!
 nd_usa_dest_frontier_desc: "Выйдите за пределы Аппалачей в обширные внутренние районы. Заявите свои права на Блэк-Хилс и границу Техаса — первые шаги в судьбе континента, которая не остановится, пока американский флаг не развевается над каждым горизонтом." #NT!
 nd_usa_dest_pacific: "Тихоокеанская судьба" #NT!
 nd_usa_dest_pacific_desc: "Золотые берега Калифорнии находятся в пределах досягаемости. Обезопасьте залив Сан-Франциско, создайте военный фонд для финансирования наступления на запад и соберите армию, достойную континентальной державы." #NT!
 nd_usa_dest_hemisphere: "Полушарный гегемон" #NT!
 nd_usa_dest_hemisphere_desc: "Высшее выражение Manifest Destiny: американское владычество от Карибского бассейна до северо-запада Тихого океана. Куба, Панама и пролив Нутка должны признать превосходство Америки." #NT!
 nd_usa_dest_republic: "Республиканский эксперимент" #NT!
 nd_usa_dest_republic_desc: "Постройте нацию не через завоевания, а через институты. Освойте современное банковское дело, наполните казну и докажите, что республика, управляемая законами, может процветать без меча." #NT!
 nd_usa_dest_industry: "Американская промышленная революция" #NT!
 nd_usa_dest_industry_desc: "От хлопчатобумажных фабрик до чугунолитейных заводов американская промышленность будет конкурировать с любой страной на земле. Развивайте национальную экономику, используйте печатный станок и постройте цивилизацию беспрецедентной производительности." #NT!
 nd_usa_dest_beacon: "Маяк Свободы" #NT!
 nd_usa_dest_beacon_desc: "Американский эксперимент достигает своего апогея: богатая, инновационная, научно развитая республика, хлопок которой поступает на глобальные рынки и чьи институты являются предметом зависти всего мира." #NT!
 nd_usa.7.t: "Республика выстоит" #NT!
 nd_usa.7.d: "Несмотря ни на что, американский эксперимент пережил свое зачаточное состояние. Конституция действует, штаты остаются едиными, а механизм республиканского правительства работает с возрастающей уверенностью. Иностранные державы, которые когда-то отвергли эту выскочку, теперь считаются с ее растущей силой.\n\nРеспублика выстоит, и теперь она должна решить, какой нацией она станет." #NT!
 nd_usa.7.a: "E Pluribus Unum." #NT!
 nd_usa.8.t: "Граница обеспечена" #NT!
 nd_usa.8.d: "Американские поселенцы и солдаты продвинулись глубоко во внутренние районы континента. Черные холмы, священные для лакота и богатые серебром, теперь находятся в пределах досягаемости республики. В Восточном Техасе старое поселение Каддо в Накогдочесе отмечает самый дальний предел американской власти на юго-западе.\n\nГраница, которая когда-то казалась невероятно далекой, теперь является задним двором республики. Но Тихий океан остается на расстоянии континента, и дорога на запад проходит через враждебную территорию, непроходимые пустыни и горные хребты, которые заставят остановиться любую армию." #NT!
 nd_usa.8.a: "На запад движется империя." #NT!
 nd_usa.9.t: "Орегонская тропа" #NT!
 nd_usa.9.d: "Американский флаг развевается над заливом Сан-Франциско, золотыми воротами в Тихий океан. Поезда с повозками, искатели золота и поселенцы проложили маршруты по всему континенту, и то, что когда-то было путешествием на невероятные расстояния, теперь превратилось в проторенную дорогу.\n\nОткрытие золота в Калифорнии вызвало безумие, которое могло изменить экономику страны в одночасье, но за счет инфляции и спекулятивного избытка. Альтернативно, тихоокеанские порты могли бы стать основой великой морской торговой сети, соединяющей американскую торговлю с обширными рынками Азии." #NT!
 nd_usa.9.a: "Золото! В этих холмах золото!" #NT!
 nd_usa.9.b: "Тихий океан является новым рубежом торговли Америки." #NT!
 nd_usa.10.t: "Колосс Нового Света" #NT!
 nd_usa.10.d: "От Кубы до залива Нутка, от Панамского перешейка до Великих равнин американская республика установила неоспоримое господство над Западным полушарием. Ни одна европейская держава не осмелится бросить вызов американскому превосходству в этих водах или на этом континенте.\n\nЭта гегемония полушария может служить разным целям. Республика может стать арсеналом демократии: нацией солдат-граждан, готовых мобилизоваться в любой момент, ее гарнизоны и фабрики — щитом свободы. Или же он может проецировать силу посредством дипломатии канонерок, своих военных кораблей и разведывательных сетей, заставляя подчиняться любому, кто бросает вызов американским интересам." #NT!
 nd_usa.10.a: "Республика вооружается для любого вызова." #NT!
 nd_usa.10.b: "Американские военные корабли будут обеспечивать соблюдение нашей воли." #NT!
 nd_usa.11.t: "Республиканский эксперимент" #NT!
 nd_usa.11.d: "Американский эксперимент по самоуправлению выдержал свое первое серьезное испытание. Прочные финансовые институты, растущая казначейская деятельность и внедрение современной банковской системы дали молодой республике экономическую основу, вызывающую уважение за рубежом.\n\nГрамотность распространяется через обычные школы, а верховенство закона распространяется на каждый уголок страны. Это не хрупкое революционное государство, а функционирующая республика, которая год за годом доказывает, что правительство народа не обязательно должно быть правительством толпы." #NT!
 nd_usa.11.a: "Эксперимент удался." #NT!
 nd_usa.12.t: "Американская промышленная революция" #NT!
 nd_usa.12.d: "Американские фабрики и мастерские изменили экономический ландшафт республики. От текстильных фабрик Новой Англии до чугунолитейных заводов Пенсильвании — новая индустриальная цивилизация куется в горячем печи и в ритме машин.\n\nЭта промышленная революция может принимать разные формы. Фабричная система делает упор на инновации, образование и культурное развитие, создавая цивилизацию беспрецедентной сложности. Или страна может инвестировать во внутренние улучшения (каналы, магистрали, а затем и железные дороги), объединяя огромную территорию и интегрируя различные народы в единый национальный рынок." #NT!
 nd_usa.12.a: "Американская изобретательность изменит мир." #NT!
 nd_usa.12.b: "Стройте каналы и дороги, которые связывают нацию." #NT!
 nd_usa.13.t: "Маяк Свободы" #NT!
 nd_usa.13.d: "Американская республика достигла того, чего не удавалось ни одной стране в истории: богатой, инновационной, научно развитой демократии, которая возглавляет мир не посредством завоеваний, а посредством силы своего примера. Хлопок течет через глобальные рынки, учебные заведения производят открытия, которые меняют человеческое понимание, а угнетенные люди мира смотрят на Америку как на доказательство того, что свобода работает.\n\nЭтот маяк может осветить мир по-разному. Арсенал знаний: университеты, исследовательские институты и военные академии, которые выпускают лучшие умы и самых способных офицеров в мире. Или образец дипломатии: нация, чей моральный авторитет и терпимость вызывают восхищение народов всего мира, чьи дипломаты приветствуются при каждом дворе." #NT!
 nd_usa.13.a: "Знание – самая истинная форма власти." #NT!
 nd_usa.13.b: "Пусть пример Америки вдохновит мир." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_gold_rush: "Золотая лихорадка" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_gold_rush: "Открытие золота привлекло искателей удачи со всего мира. Быстро развивающиеся города возникают в мгновение ока, а прилив богатства (пусть и спекулятивного) способствует быстрому освоению новых территорий." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_pacific_trade: "Тихоокеанская торговля" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_pacific_trade: "Американские клиперы и торговые суда курсируют по Тихому океану, открывая торговые пути в Азию и превращая республику в морскую державу первого порядка." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_arsenal_democracy: "Арсенал демократии" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_arsenal_democracy: "Республика мобилизует свои огромные промышленные и демографические ресурсы, создавая гарнизоны по всему полушарию и поддерживая военную базу, которая может быть развернута где угодно в любой момент." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_gunboat_diplomacy: "Дипломатия канонерок" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_gunboat_diplomacy: "Американские военные корабли патрулируют все морские пути Западного полушария. Разведывательные сети и военно-морские силы республики вынуждают подчиняться любую державу, которая угрожает американским интересам." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_factory_system: "Заводская система" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_factory_system: "Систематическое применение машин и разделение труда сделали американское производство чудом индустриальной эпохи. Культурное развитие следует за экономическим прогрессом, поскольку республика строит цивилизацию, достойную своих идеалов." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_internal_canals: "Внутренние улучшения" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_internal_canals: "Обширная сеть каналов, магистралей и улучшенных дорог связывает воедино отдаленные районы республики. Интеграция и дипломатия имеют приоритет над военными авантюрами." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_arsenal_knowledge: "Арсенал знаний" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_arsenal_knowledge: "Американские университеты и военные академии выпускают офицеров, инженеров и ученых высочайшего уровня. Институциональная легитимность республики не подлежит сомнению, а ее военная тактика отражает лучшее профессиональное образование." #NT!
 STATIC_MODIFIER_NAME_nd_usa_dest_diplomatic_paragon: "Дипломатический идеал" #NT!
 STATIC_MODIFIER_DESC_nd_usa_dest_diplomatic_paragon: "Американская республика подает моральный пример. Ее терпимость, ее дипломатия и эффективное содержание ее флота демонстрируют, что свободный народ может управлять собой с мудростью и силой." #NT!
 nd_usa_west_point_academy: "Академия Вест-Пойнт" #NT!
 nd_usa_west_point_academy_desc: "Военная академия США в Вест-Пойнте обучает офицерский корпус республики военному искусству, фортификации и военной инженерии." #NT!
 nd_usa_land_grant_college: "Земельный колледж" #NT!
 nd_usa_land_grant_college_desc: "Государственное высшее учебное заведение, наделенное федеральными земельными грантами, обучающее сельскому хозяйству, инженерному делу и механическому искусству граждан расширяющейся республики." #NT!
 nd_usa_west_point_upkeep: "Операции Академии" #NT!
 nd_usa_west_point_upkeep_desc: "Книги для библиотеки, бумага для лекций и экзаменов, оружие для тренировок и инструменты для инженерного обучения." #NT!
 nd_usa_land_grant_upkeep: "Деятельность колледжа" #NT!
 nd_usa_land_grant_upkeep_desc: "Бумага для научных публикаций, книги для библиотеки колледжа и инструменты для практического обучения студентов сельскому хозяйству и инженерному делу." #NT!
  
 AUTO_MODIFIER_NAME_nd_usa_bureaucracy_authority: "Федеральный аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_usa_bureaucracy_authority: "Федеральное правительство Соединенных Штатов (кабинет министров в Вашингтоне, Капитолий, Верховный суд и исполнительные департаменты, созданные при Гамильтоне, Джефферсоне, Ноксе и Рэндольфе) превратилось в слаженный национальный аппарат, способный поддерживать несколько специализированных институтов, работающих рядом друг с другом." #NT!
  
 usa_continental_congress_bureaucracy: "Континентальный Конгресс" #NT!
 usa_continental_congress_bureaucracy_desc: "Однопалатное собрание делегатов штатов, которое провело Войну за независимость, провозгласило независимость в 1776 году и ратифицировало Статьи Конфедерации в 1781 году. В соответствии со статьями Конгресс мог издавать законы, но не мог облагать налогами, напрямую собирать армии или регулировать торговлю: Соединенные Штаты были лигой суверенных государств, политика которых зависела от согласия тринадцати ревнивых законодательных органов." #NT!
  
 usa_federal_constitution_bureaucracy: "Федеральная конституция" #NT!
 usa_federal_constitution_bureaucracy_desc: "Разработанная в Филадельфии в 1787 году и ратифицированная в следующем году, Конституция заменила статьи перечисленным федеральным правительством: унитарная исполнительная власть, двухпалатный законодательный орган и Верховный суд. Билль о правах 1791 года закрепил обязательные к исполнению индивидуальные свободы. Торговцы-федералисты отстаивали новую структуру; Антифедералистское дворянство, выступающее за права штатов, возмущалось его централизацией." #NT!
  
 usa_hamiltonian_treasury_bureaucracy: "Гамильтоновское казначейство" #NT!
 usa_hamiltonian_treasury_bureaucracy_desc: "Министерство финансов Александра Гамильтона, организованное в 1789 году, взяло на себя долги штатов во время войны за независимость и финансировало их по номинальной стоимости, построило Таможенную службу, которая обеспечивала большую часть федеральных доходов до гражданской войны, и зафрахтовал производственную и коммерческую инфраструктуру капиталистической республики. Джефферсонианцы осуждали это как финансовую аристократию, охотящуюся на фермеров-йоменов." #NT!
  
 usa_marshall_supreme_court_bureaucracy: "Верховный суд Маршалла" #NT!
 usa_marshall_supreme_court_bureaucracy_desc: "Джон Маршалл занимал пост главного судьи с 1801 по 1835 год, превратив слабую третью ветвь власти в арбитра конституционного значения. Марбери против Мэдисона (1803 г.) установил судебный контроль над федеральными законами; Маккалок против Мэриленда (1819 г.) закрепил верховенство федерального правительства над штатами; Дело Гиббонс против Огдена (1824 г.) поставило торговлю между штатами под федеральную власть. Престиж Суда был куплен за счет законодательной автономии штата." #NT!
  
 usa_land_ordinance_bureaucracy: "Система земельных постановлений" #NT!
 usa_land_ordinance_bureaucracy_desc: "Постановление о земле 1785 года установило прямоугольную сетку поселков шесть на шесть миль на каждом акре федеральной территории; Северо-западный указ 1787 года определил, как эти территории получили равноправную государственность. Вместе они произвели упорядоченное и продуманное расширение республики поселенцев по всему континенту и создали юридический механизм, с помощью которого коренные народы были лишены собственности." #NT!
  
 usa_bank_of_united_states_bureaucracy: "Банк Соединенных Штатов" #NT!
 usa_bank_of_united_states_bureaucracy_desc: "Первый банк (1791–1811) и Второй банк (1816–1836) служили федеральным финансовым агентом, храня государственные депозиты, регулируя рост числа зарегистрированных государством банков и выпуская стабильную национальную бумажную валюту. Гамильтон спроектировал Первый; Эндрю Джексон разрушил Второй банк своим вето в 1832 году и отменой депозитов в 1833 году, назвав банк денежным монстром, обходящим демократический контроль." #NT!
  
 usa_west_point_corps_bureaucracy: "Офицерский корпус Вест-Пойнта" #NT!
 usa_west_point_corps_bureaucracy_desc: "Основанная Томасом Джефферсоном в 1802 году и реформированная под руководством Сильвануса Тайера в 1817 году, Военная академия США в Вест-Пойнте подготовила профессиональный офицерский корпус регулярной армии: инженеров, артиллеристов и лучших военнослужащих с научной подготовкой в ​​Америке. Постоянный класс федеральных офицеров обеспечивал лояльность национальной командной структуре, а не ополченцам штата и их командирам-полковникам." #NT!
