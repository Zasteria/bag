l_russian:
 ALM: "Альмохадский халифат" #NT!
 ALM_ADJ: "Альмохад" #NT!
 ALM_f: "Альмохадский халифат" #NT!
 ALM_f_desc: "Халифат Альмохадов (аль-Мувахидун, «те, кто утверждает божественное единство») был берберской мусульманской империей, которая пришла на смену Альморавидам и объединила Магриб и Аль-Андалус под единым правлением из своей столицы в Марракеше. Основанное на движении религиозных реформ Ибн Тумарта и консолидированное Абд аль-Мумином, на пике своего развития при Якубе аль-Мансуре оно простиралось от атлантических берегов Марокко до Триполитании и на север до Иберии, где Севилья служила его полуостровным центром. Магрибскому суннитскому государству с Марракешем и Фесом в качестве ядра требуется ядро ​​Альмохадов в Северной Африке; воссоединение Аль-Андалуса является прерогативой халифа, а не его обязательным условием." #NT!
