l_russian:
  # ===== ADVANCES: Age 1 ===== 
 nd_bah_sultanate_foundations: "Фонды Султаната" #NT!
 nd_bah_sultanate_foundations_desc: "Султанат Бахмани, возникший в результате восстания против далекого правления Дели, основал первое независимое мусульманское государство на плато Декан. При Ала-уд-Дине Хасане Бахман-шахе новая династия заявила о своей легитимности и централизованной власти во всех своих обширных владениях." #NT!
 nd_bah_gulbarga_fortress: "Укрепления Гульбарги" #NT!
 nd_bah_gulbarga_fortress_desc: "Великая крепость Гульбарга, окруженная двойным рвом и пятнадцатью башнями, служила неприступным сердцем раннего государства Бахмани. Его стены защищали первую столицу и распространяли власть Султаната на западный Декан." #NT!
 nd_bah_persianate_darbar: "Персидский суд" #NT!
 nd_bah_persianate_darbar_desc: "Двор Бахмани сознательно копировал персидские традиции, импортируя ученых, поэтов и администраторов из Ирана и Центральной Азии. Зал дарбар стал центром изысканной культуры, где персидский этикет определял государственные дела." #NT!
 nd_bah_deccani_horsemen: "Декканские всадники" #NT!
 nd_bah_deccani_horsemen_desc: "Султаны Бахмани вложили значительные средства в кавалерию, импортируя арабских и персидских лошадей через западные порты. Конные совары составляли ударную часть армий Султаната на плато Декан." #NT!
 nd_bah_arabian_horse_trade: "Торговля арабскими лошадьми" #NT!
 nd_bah_arabian_horse_trade_desc: "Контроль над портами западного побережья, такими как Чаул, а затем и Гоа, дал бахмани прямой доступ к торговле арабскими лошадьми. Этот импорт поддерживал кавалерийское превосходство Султаната над их соперниками из Виджаянагара." #NT!
 nd_bah_bahmani_legal_code: "Юридический кодекс Бахмани" #NT!
 nd_bah_bahmani_legal_code_desc: "Ранние султаны Бахмани создали систематическую правовую основу, опираясь на исламскую юриспруденцию и персидскую административную традицию, внося порядок в управление своими разнообразными владениями." #NT!
 nd_bah_deccan_plateau_farming: "Сельское хозяйство плато Декана" #NT!
 nd_bah_deccan_plateau_farming_desc: "Черноземная почва Деканского плато, обогащенная сезонными муссонами, способствовала развитию экстенсивного сельского хозяйства. Хлопок, просо и бобовые кормили растущее население Султаната и питали его экономику." #NT!
  # ===== ADVANCES: Age 2 ===== 
 nd_bah_gawan_reforms: "Административные реформы Гавана" #NT!
 nd_bah_gawan_reforms_desc: "Великий визирь Махмуд Гаван реорганизовал государство Бахмани на восемь провинций, каждая из которых подчинялась тарафдару с фиксированными обязанностями. Его реформы ограничили дворянскую власть и усилили центральную власть в сборе налогов и военных делах." #NT!
 nd_bah_gawan_madrasa: "Медресе Махмуда Гавана" #NT!
 nd_bah_gawan_madrasa_desc: "Великолепное медресе в Бидаре, построенное Махмудом Гаваном в 1472 году, имело трехэтажное здание с библиотекой из трех тысяч рукописей. Он стал маяком исламской науки, привлекая студентов и ученых со всего мусульманского мира." #NT!
 nd_bah_bidriware_craft: "Металлообработка" #NT!
 nd_bah_bidriware_craft_desc: "Под патронажем Бахмани ремесленники Бидара усовершенствовали уникальную технику обработки металла: отливали сосуды из сплава цинка и меди, а затем инкрустировали их серебром в замысловатых арабесках. Готовые изделия, почерневшие от почвенной пасты, смешанной с хлоридом аммония, стали цениться во всем мире Индийского океана.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
 nd_bah_early_gunpowder: "Деканский порох" #NT!
 nd_bah_early_gunpowder_desc: "Султанат Бахмани, вероятно, был первым индийским штатом, применившим пороховую артиллерию. К 1460-м годам в стенах крепости Кальяна были встроены орудийные порты, и артиллеристы-топчи участвовали в каждой крупной кампании." #NT!
 nd_bah_dabhol_trade: "Порт Дабхол" #NT!
 nd_bah_dabhol_trade_desc: "Захват Дабхола, а затем и Гоа дал бахманцам прямой доступ к морской торговле с Персией, Аравией и Восточной Африкой. Эти порты стали каналами для импорта лошадей, предметов роскоши и персидского культурного влияния.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
 nd_bah_persian_literary_tradition: "Персидский литературный суд" #NT!
 nd_bah_persian_literary_tradition_desc: "Двор Бахмани культивировал персидский язык как язык управления и высокой культуры. Поэты, историки и ученые из Ирана нашли покровительство в Гульбарге и Бидаре, создав яркую персидскую литературную традицию на индийской земле." #NT!
 nd_bah_caravanserai_network: "Сеть Караван-сараев" #NT!
 nd_bah_caravanserai_network_desc: "Сеть караван-сараев вдоль основных торговых путей обеспечивала безопасное жилье, воду и защиту торговцам, пересекавшим Декан. Эти дома отдыха способствовали сухопутной торговле и помогли связать обширные провинции Султаната.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
  # ===== ADVANCES: Age 3 ===== 
 nd_bah_vijayanagara_wars: "Войны против Виджаянагара" #NT!
 nd_bah_vijayanagara_wars_desc: "Борьба между султанатом Бахмани и империей Виджаянагара определила столетие истории Декани. Контроль над Райчур Доабом, плодородной землей между реками Кришна и Тунгабхадра, был вечным призом, за который стоило бороться." #NT!
 nd_bah_siege_artillery: "Корпус осадной артиллерии" #NT!
 nd_bah_siege_artillery_desc: "Под командованием Махмуда Гавана бахмани разработали специальные методы осады, включая минирование и направленный артиллерийский огонь. Во время осады Белгаума в 1472 году преданные своему делу пожарные прорывали укрепления, используя методы, никогда ранее не применявшиеся на Декане." #NT!
 nd_bah_afaqi_deccani_balance: "Баланс Афаки-Деккани" #NT!
 nd_bah_afaqi_deccani_balance_desc: "Султанат был постоянно разделен между дворянами Афаки (персы, турки и арабы иностранного происхождения, имевшие влияние при дворе) и Декканисами, местными мусульманами и вольноотпущенниками Хабши, которые контролировали провинции. Обеспечение этого баланса было главной задачей государственного управления Бахмани." #NT!
 nd_bah_deccan_textiles: "Декан Текстиль Трейд" #NT!
 nd_bah_deccan_textiles_desc: "Традиции хлопкового ткачества Декана позволили производить прекрасные ткани, пользующиеся спросом во всем мире Индийского океана. Контроль Султаната как над производственными центрами, так и над западными прибрежными портами сделал текстильную промышленность краеугольным камнем процветания Бахмани.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
 nd_bah_polygon_bastions: "Полигональные бастионы" #NT!
 nd_bah_polygon_bastions_desc: "Приспосабливаясь к эпохе пороха, военные инженеры Бахмани спроектировали укрепления с угловатыми бастионами, способными устанавливать пушки в перекрывающихся полях огня. К 1460-м годам эти нововведения изменили оборонительный ландшафт Декана." #NT!
 nd_bah_sultanate_diplomacy: "Султанатская дипломатия" #NT!
 nd_bah_sultanate_diplomacy_desc: "Султаны Бахмани поддерживали дипломатические связи со всем исламским миром, обмениваясь послами с мамлюками, тимуридами и Османской империей. Эти отношения обеспечили рекрутов, культурный обмен и политическую легитимность." #NT!
  # ===== ADVANCES: Age 4 ===== 
 nd_bah_successor_state_legacy: "Государственное наследие-преемник" #NT!
 nd_bah_successor_state_legacy_desc: "Хотя государство Бахмани распалось после 1518 года, его административные традиции, военные инновации и культурные достижения продолжились в султанатах-преемниках. Институты, построенные Махмудом Гаваном, оказались более долговечными, чем сама династия." #NT!
 nd_bah_tofangchi_musketeers: "Мушкетеры Тофангчи" #NT!
 nd_bah_tofangchi_musketeers_desc: "Обученная пехота с фитильными ружьями стала основным продуктом армий Декани. Эти тофангчи, многие из которых были набраны из персидских и среднеазиатских иммигрантов, привнесли на поле боя дисциплинированную тактику огнестрельного оружия." #NT!
 nd_bah_diamond_mines: "Добыча алмазов" #NT!
 nd_bah_diamond_mines_desc: "На плато Декан находятся одни из самых продуктивных месторождений алмазов в мире. В шахтах Голконды добывались камни легендарного качества, в том числе то, что позже стало известно как Алмаз Надежды и Кох-и-Нур.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
 nd_bah_deccani_miniatures: "Миниатюрная живопись Деккани" #NT!
 nd_bah_deccani_miniatures_desc: "В султанатах Декана процветала своеобразная школа миниатюрной живописи, сочетающая персидские, индийские и даже европейские влияния в уникальную эстетику Декана, отмеченную яркими цветами и фантастическими образами." #NT!
 nd_bah_revenue_taraf_system: "Система доходов и тарифов" #NT!
 nd_bah_revenue_taraf_system_desc: "Система доходов провинции Бахмани разделила королевство на тарафы, в каждом из которых был организован систематизированный сбор налогов, контролируемый назначенными из центра должностными лицами. Эта система, оттачивавшаяся на протяжении поколений, обеспечивала стабильный приток доходов в казну Султаната." #NT!
 nd_bah_deccani_syncretism: "Декканский синкретизм" #NT!
 nd_bah_deccani_syncretism_desc: "Столетия сосуществования мусульман и индуистов на Декане породили своеобразную синкретическую культуру. Суфийские святые привлекали индуистских верующих, храмовые танцоры выступали в мусульманских дворах, а совместные фестивали стирали границы между общинами." #NT!
  # ===== ADVANCES: Age 5 ===== 
 nd_bah_nizam_administration: "Администрация Низама" #NT!
 nd_bah_nizam_administration_desc: "Административные традиции государства Бахмани нашли свое наиболее полное выражение в управлении Низам-уль-Мулька. Систематическая бюрократия, регулярная оценка доходов и провинциальная организация поддерживали порядок по всему Декану." #NT!
 nd_bah_european_military_contact: "Европейский военный контакт" #NT!
 nd_bah_european_military_contact_desc: "Контакты с европейскими военными советниками и торговцами привели к появлению новых методов обучения, проектирования укреплений и развертывания артиллерии. Правители Деккани выборочно приняли эти нововведения для модернизации своих вооруженных сил." #NT!
 nd_bah_deccani_water_works: "Водопроводные сооружения Деккани" #NT!
 nd_bah_deccani_water_works_desc: "Сложные ступенчатые колодцы, акведуки и ирригационные каналы, построенные по всему Декану, доставляли воду в засушливые регионы и способствовали развитию сельского хозяйства. Эти общественные работы представляли собой значительные государственные инвестиции в инфраструктуру." #NT!
 nd_bah_reformed_sipahi: "Реформатский Сипахи" #NT!
 nd_bah_reformed_sipahi_desc: "Адаптируясь к меняющемуся характеру войны, тяжелая кавалерия Деккани подверглась реформе. Реформированные сипахи сочетали традиционную ударную тактику с тактикой применения пистолета, подходящей для поля боя с порохом." #NT!
 nd_bah_deccani_trade_maturity: "Торговая зрелость Декани" #NT!
 nd_bah_deccani_trade_maturity_desc: "К эпохе абсолютизма торговые сети Декана превратились в сложную систему сухопутных и морских торговых путей, соединяющих внутреннее плато с побережьями и за его пределами." #NT!
  # ===== ADVANCES: Age 6 ===== 
 nd_bah_modern_administration: "Современная администрация" #NT!
 nd_bah_modern_administration_desc: "Административные реформы эпохи Просвещения принесли систематизированный учет, упорядоченное налогообложение и рационализацию провинциального управления в государствах-преемниках традиции Бахмани." #NT!
 nd_bah_deccani_cultural_legacy: "Культурное наследие Деккани" #NT!
 nd_bah_deccani_cultural_legacy_desc: "Культурные достижения эпохи Бахмани (посуда Бидри, миниатюрная живопись Декани, архитектура под персидским влиянием и литературная традиция Дахани) остались непреходящим наследием цивилизации Декани." #NT!
 nd_bah_cultural_synthesis: "Культурный синтез" #NT!
 nd_bah_cultural_synthesis_desc: "Длительное сосуществование мусульманских, индуистских и других традиций на Декане привело к уникальному для субконтинента культурному синтезу, обогатившему музыку, кухню, язык и искусство гибридными формами." #NT!
 nd_bah_industrial_workshops: "Промышленные мастерские" #NT!
 nd_bah_industrial_workshops_desc: "Традиционные текстильные ремесла и традиции обработки металлов Декана послужили основой для первых промышленных мастерских, когда возникла механизированная обработка хлопка и изготовление металлов.\n\n#italic Доступно в: $nd_bah_bandargah$#!" #NT!
 nd_bah_modern_field_guns: "Современные полевые орудия" #NT!
 nd_bah_modern_field_guns_desc: "Основываясь на многовековом опыте производства пороха, арсеналы Деккани производили современную полевую артиллерию, сочетающую европейские принципы проектирования с местными производственными возможностями." #NT!
  # ===== UNITS ===== 
 a_nd_bah_deccani_sowar: "Деккани Совар" #NT!
 a_nd_bah_deccani_sowar_desc: "Совары Декани, оснащенные конницей на импортированных арабских лошадях, были ударным оружием армий Бахмани. Быстрые, дисциплинированные и воспитанные для открытого плато, они доминировали на поле боя." #NT!
 a_nd_bah_topchi: "Топчи" #NT!
 a_nd_bah_topchi_desc: "Самый ранний корпус пороховой артиллерии на Индийском субконтиненте. Артиллеристы Бахмани-топчи были укомплектованы пушками, импортированными из Османской и Персидской Империи или вдохновленными ими, обеспечивая разрушительную огневую мощь при осаде и в полевых условиях." #NT!
 a_nd_bah_siege_topchi: "Осада Топчи" #NT!
 a_nd_bah_siege_topchi_desc: "Специализированные бригады осадной артиллерии, сочетавшие артиллерийскую стрельбу с минными работами. Под командованием Махмуда Гавана эти инженеры прорвали укрепления, используя методы, никогда ранее не применявшиеся на Декане." #NT!
 a_nd_bah_tofangchi: "Тофангчи" #NT!
 a_nd_bah_tofangchi_desc: "Обученная пехота с фитильными ружьями, многие из которых набраны из персидских и среднеазиатских иммигрантов. Тофангчи принесли дисциплинированный залповый огонь на поле битвы Деккани, дополняя традиционную кавалерию Султаната." #NT!
 a_nd_bah_reformed_sipahi: "Реформатский Сипахи" #NT!
 a_nd_bah_reformed_sipahi_desc: "Тяжелая кавалерия была преобразована в эпоху пороха, сочетая традицию ударной атаки с тактикой пистолетного оружия. Эти элитные всадники сыграли решающую роль в последующих войнах Декани." #NT!
 a_nd_bah_field_gun: "Полевое орудие Деккани" #NT!
 a_nd_bah_field_gun_desc: "Современная полевая артиллерия, основанная на многовековом опыте компании Deccani в области производства пороха. Более легкие и мобильные, чем осадные орудия, эти орудия обеспечивали разрушительную огневую мощь на поле боя." #NT!
  # ===== BUILDINGS ===== 
 nd_bah_qila: "Кила" #NT!
 nd_bah_qila_desc: "Деканская крепость на вершине холма в традициях Бахмани, построенная из местного базальта и рассчитанная на длительную осаду. Его башни и стены возвышаются над окружающим плато." #NT!
 nd_bah_darbar_hall: "Дарбар Холл" #NT!
 nd_bah_darbar_hall_desc: "Зал суда, построенный в персидских традициях, где султан проводит приемы, а государственные дела ведутся в соответствии с изысканным этикетом персидского двора." #NT!
 nd_bah_taraf_office: "Офис Тараф" #NT!
 nd_bah_taraf_office_desc: "Провинциальный административный центр, реализующий реформы Махмуда Гавана, где назначенные чиновники управляют сбором налогов, военными сборами и перепиской с центральным судом." #NT!
 nd_bah_madrasa: "Медресе" #NT!
 nd_bah_madrasa_desc: "Исламский учебный центр по образцу великолепного медресе Махмуда Гавана в Бидаре. Студенты изучают теологию, право, математику и астрономию под руководством ученых со всего исламского мира." #NT!
 nd_bah_bidri_workshop: "Мастерская Бидри" #NT!
 nd_bah_bidri_workshop_desc: "Специализированное ателье по металлообработке, где мастера практикуют технику бидриваре: отливают сосуды из сплава цинка и меди, гравируют сложные узоры и инкрустируют их чистым серебром перед чернением поверхности." #NT!
 nd_bah_bandargah: "Бандарга" #NT!
 nd_bah_bandargah_desc: "Прибрежный торговый порт в традициях Бахмани, облегчающий морскую торговлю с Персией, Аравией и Восточной Африкой. Склады, таможни и торговые кварталы расположены вдоль набережной." #NT!
 nd_bah_bastion: "Полигон Бастион" #NT!
 nd_bah_bastion_desc: "Угловое укрепление, спроектированное для эпохи пороха, с бастионами, обеспечивающими перекрывающиеся поля артиллерийского огня. Эти инновации Deccani предшествовали аналогичным европейским разработкам." #NT!
 nd_bah_revenue_office: "Налоговое управление" #NT!
 nd_bah_revenue_office_desc: "Провинциальный центр сбора доходов, где чиновники рассчитывают налоги, ведут земельный учет и перечисляют доходы в центральное казначейство в соответствии с системой тарафа." #NT!
 nd_bah_baoli: "Баоли" #NT!
 nd_bah_baoli_desc: "Ступенчатый колодец, спроектированный для доступа к глубокому грунту Декана. Эти монументальные сооружения служат общественными источниками воды, прохладными убежищами и местами для собраний." #NT!
  # ===== PRODUCTION METHODS ===== 
 nd_bah_horse_import_pm: "Импорт арабских лошадей" #NT!
 nd_bah_horse_import_pm_desc: "Систематический импорт арабских и персидских лошадей через западные прибрежные порты, поддерживающий кавалерию Султаната." #NT!
 nd_bah_bidriware_pm: "Производство бидриверов" #NT!
 nd_bah_bidriware_pm_desc: "Литье, гравировка и инкрустация серебром сосудов из цинк-медного сплава в уникальной технике Bidriware." #NT!
 nd_bah_caravan_pm: "Караван Трейд" #NT!
 nd_bah_caravan_pm_desc: "Сухопутная торговля через сеть караван-сараев Султаната, перемещающая товары через плато Декан." #NT!
 nd_bah_textile_pm: "Деканское текстильное ткачество" #NT!
 nd_bah_textile_pm_desc: "Ткачество тонких хлопчатобумажных тканей ценится в торговой сети Индийского океана." #NT!
 nd_bah_diamond_pm: "Добыча алмазов" #NT!
 nd_bah_diamond_pm_desc: "Добыча и огранка алмазов из легендарных месторождений Декана с использованием железа и инструментов для работы на рудниках." #NT!
 nd_bah_cotton_mill_pm: "Хлопковое фрезерование" #NT!
 nd_bah_cotton_mill_pm_desc: "Механизированная переработка хлопка-сырца в готовую ткань промышленным способом." #NT!
  # ===== BUILDING PMs (inline) ===== 
 nd_bah_qila_maintenance: "Крепостной гарнизон" #NT!
 nd_bah_qila_maintenance_desc: "Камень и оружие для гарнизона крепости." #NT!
 nd_bah_darbar_upkeep: "Содержание суда" #NT!
 nd_bah_darbar_upkeep_desc: "Шелк и красители для персидского двора." #NT!
 nd_bah_taraf_upkeep: "Административные расходы" #NT!
 nd_bah_taraf_upkeep_desc: "Бумага и ткань для чиновников тарафа, управляющих администрацией провинции." #NT!
 nd_bah_madrasa_upkeep: "Научные материалы" #NT!
 nd_bah_madrasa_upkeep_desc: "Бумага и книги для ученых медресе и растущей библиотеки рукописей." #NT!
 nd_bah_bidri_inputs: "Создание бидриверов" #NT!
 nd_bah_bidri_inputs_desc: "Ремесленники отливали сосуды из медно-цинкового сплава и инкрустировали их серебром замысловатыми арабесками, создавая ценные декоративные изделия." #NT!
 nd_bah_port_upkeep: "Обслуживание порта" #NT!
 nd_bah_port_upkeep_desc: "Лесоматериалы и военно-морские поставки для прибрежного порта." #NT!
 nd_bah_bastion_upkeep: "Бастионный гарнизон" #NT!
 nd_bah_bastion_upkeep_desc: "Камень и вооружение для крепости-бастиона." #NT!
 nd_bah_revenue_upkeep: "Управление доходами" #NT!
 nd_bah_revenue_upkeep_desc: "Бумага для записей и ткань для чиновников областной налоговой службы." #NT!
 nd_bah_baoli_upkeep: "Обслуживание скважин" #NT!
 nd_bah_baoli_upkeep_desc: "Камень и инструменты для ухода за ступенчатым колодцем и его водными каналами." #NT!
  # ===== LEVIES ===== 
 levy_nd_bah_deccani_sowar: "Деккани Совар Леви" #NT!
 levy_nd_bah_deccani_sowar_desc: "Конная кавалерия, набираемая из дворянских и солдатских сословий, верхом на привозных арабских лошадях." #NT!
  # ===== STATIC MODIFIERS (timed, from advance events) ===== 
 STATIC_MODIFIER_NAME_nd_bah_gawan_centralization: "Централизация Гавана" #NT!
 STATIC_MODIFIER_DESC_nd_bah_gawan_centralization: "Реформы великого визиря укрепили центральную власть, ограничив автономию провинций и систематизировав сбор доходов по тарафам." #NT!
 STATIC_MODIFIER_NAME_nd_bah_gawan_tolerance: "Космополитическое видение Гавана" #NT!
 STATIC_MODIFIER_DESC_nd_bah_gawan_tolerance: "Политика толерантности Махмуда Гавана и его покровительство ученым самого разного происхождения обогатили двор и расширили дипломатические горизонты Султаната." #NT!
 STATIC_MODIFIER_NAME_nd_bah_deccan_sword: "Меч Декана" #NT!
 STATIC_MODIFIER_DESC_nd_bah_deccan_sword: "Победа на поле боя укрепила решимость Султаната. Наши армии закалены в боях, наша артиллерия внушает страх, а наши осадные орудия проверены против самых мощных крепостей." #NT!
 STATIC_MODIFIER_NAME_nd_bah_deccan_fortifier: "Щит Плато" #NT!
 STATIC_MODIFIER_DESC_nd_bah_deccan_fortifier: "Уроки вечной войны были обращены на оборону. Наши крепости ощетинены пушками, наши гарнизоны дисциплинированы, а наши пограничные позиции неприступны." #NT!
 STATIC_MODIFIER_NAME_nd_bah_afaqi_ascendancy: "Возвышение Афаки" #NT!
 STATIC_MODIFIER_DESC_nd_bah_afaqi_ascendancy: "Дворяне иностранного происхождения одержали верх, выведя на передний план дел Султаната свои персидские связи, торговые сети и космополитическое мировоззрение." #NT!
 STATIC_MODIFIER_NAME_nd_bah_deccani_roots: "Декканские корни" #NT!
 STATIC_MODIFIER_DESC_nd_bah_deccani_roots: "Местная знать укрепила свои позиции, прочно укоренив Султанат в почве Декана. Их глубокая связь с землей обеспечивает стабильность и обильные поборы." #NT!
  # ===== EVENTS ===== 
 nd_bah.1.t: "Реформы Махмуда Гавана" #NT!
 nd_bah.1.d: "Махмуд Гаван, блестящий визирь персидского происхождения, десятилетиями служивший Султанату, провел радикальные административные реформы. Четыре провинции королевства были реорганизованы в восемь тарафов, каждая из которых подчиняется тарафдару, назначаемому централизованно. Дворянские поместья были сокращены, доходы систематизированы, а великолепное медресе султаната в Бидаре стало памятником его видению.\n\nОднако эти реформы углубили линию разлома в самом сердце государства Бахмани. Дворяне Афаки (персы, турки и арабы, пришедшие к власти вслед за Гаваном) теперь имеют власть при дворе. Дворяне Декани, рожденные на этой земле, кипят от своего перемещения. Султан должен выбрать путь какой фракции следовать.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bah.1.a: "Укрепите центральную власть: тарафы будут подчиняться трону." #NT!
 nd_bah.1.b: "Примите космополитическое видение Гавана: пусть мир предстанет перед нами." #NT!
 nd_bah.2.t: "Войны против Виджаянагара" #NT!
 nd_bah.2.d: "Борьба между Султанатом и великой индуистской империей Виджаянагара определила целое поколение. Плодородный Райчур Доаб, земля между реками Кришна и Тунгабхадра, является вечным призом, переходящим из рук в руки вместе с военной удачей. Наши артиллеристы-топчи доказали свою эффективность в борьбе с могучей кавалерией Виджаянагара, а осада Белгаума продемонстрировала, что ни одна крепость не может долго противостоять фейерверкам Бахмани.\n\nТеперь вопрос в том, как закрепить наши достижения. Будем ли мы добиваться преимущества с помощью наступательной мощи или укреплять границу от неизбежной контратаки?" #NT!
 nd_bah.2.a: "Продолжайте атаку: меч Декана не успокоится." #NT!
 nd_bah.2.b: "Укрепляйте границу: ни один враг не сможет прорвать наши бастионы." #NT!
 nd_bah.3.t: "Кризис Афаки-Деккани" #NT!
 nd_bah.3.d: "Напряженность, которая на протяжении поколений кипела в сердце Султаната, достигла критической точки. Афаки (дворяне иностранного происхождения из Персии, Турции и Аравии) контролируют двор, казну и дипломатическую службу. Они говорят на персидском языке, ведут переписку с дворами Исфахана и Константинополя и поддерживают торговые сети, которые доставляют в Султанат лошадей, предметы роскоши и рекрутов.\n\nДеканис (местные мусульмане, новообращенные и вольноотпущенники-хабши из Абиссинии) контролируют провинции, командуют гарнизонами и черпают свои силы из самой земли. Они говорят на языке дахани, знают местность и обладают преданностью простого солдата.\n\nОбе фракции служили Султанату, но обе не могут им управлять. Султан должен решить, какая фракция будет определять будущее Бахмани." #NT!
 nd_bah.3.a: "Афаки: их персидские связи обогащают всех нас." #NT!
 nd_bah.3.b: "Деканис: наша сила – в почве, на которой мы стоим." #NT!
 nd_bah.4.t: "Искусство Бидри" #NT!
 nd_bah.4.d: "Под патронажем Султаната ремесленники Бидара усовершенствовали технику обработки металла необычайной красоты и мастерства. Сосуды отливаются из сплава цинка и меди, затем гравируются замысловатыми узорами, арабесками, каллиграфией, цветами и геометрическими узорами. В канавки вбивается проволока из чистого серебра, а поверхность обрабатывается пастой из почвы и хлорида аммония, уникальной для почвы самого Бидара.\n\nРезультат поразителен: почерневший металл, украшенный блестящим серебром, детали, которые одновременно являются функциональными сосудами и произведениями искусства. Bidriware уже ценится коллекционерами и торговцами от Персии до Юго-Восточной Азии. Это ремесло могло зародиться только здесь, на Декане, где персидские традиции обработки металлов встретились с индийским мастерством и уникальной почвой Бидара." #NT!
 nd_bah.4.a: "Сокровище Декана, которое сохранится на века." #NT!
 nd_bah.5.t: "Гром на Декане" #NT!
 nd_bah.5.d: "Крепость Кальяна является доказательством военной революции султаната. Порты для орудий были встроены прямо в его стены, это первая подобная конструкция на плато Декан. Звук пушечной стрельбы, когда-то чуждый этой земле, теперь эхом разносится по плато, когда наши артиллеристы-топчи тренируются со своим устрашающим оружием.\n\nСултанат Бахмани стал первым индийским государством, систематически применяющим пороховую артиллерию. Наши фейерверки могут пробить любую стену, наши пушки – любой заряд. Военный баланс Декана изменился навсегда. Если раньше исход сражения зависел от веса кавалерии, то теперь он зависит от грохота орудий, и громче всех говорят наши орудия." #NT!
 nd_bah.5.a: "Пусть грохот наших орудий провозгласит превосходство Бахмани." #NT!
 nd_bah_formed_tt: "Образован Бахманийский султанат." #NT!
 nd_bah_path_a_tt: "Выбрал централизацию Гавана" #NT!
 nd_bah_path_b_tt: "Выбрал космополитическое видение Гавана" #NT!
  # ===== BUREAUCRACIES ===== 
 bah_wakil_us_sultanat_bureaucracy: "Вакиль-ус-Султанат" #NT!
 bah_wakil_us_sultanat_bureaucracy_desc: "Вакил-ус-Султанат был наместником султана Бахмани, единым крупным офисом, который сочетал в себе управление домашним хозяйством, инспекцию кавалерийских списков и командование центральной армией, когда султан не выступал лично. Хасан Гангу укомплектовал его иранскими и иракскими эмигрантами, а не выходцами из Туглуков; Мухаммад Шах I использовал его, чтобы возглавить кампании против Виджаянагара и Телинганы. Сосредоточение военных, домашних и инспекционных функций в одном офисе обеспечило сплоченность первых бахмани и сделало офис Вакиля настоящим призом каждой борьбы между фракциями в Гулбарге." #NT!
 bah_madrasa_mahmud_gawan_bureaucracy: "Медресе Махмуд Гаван" #NT!
 bah_madrasa_mahmud_gawan_bureaucracy_desc: "Трехэтажное медресе Махмуда Гавана, построенное в Бидаре в 1472 году, было крупнейшим научным учреждением индийских султанатов пятнадцатого века. Его план (двор, окруженный 100 студенческими кельями, двумя минаретами, библиотекой, мечетью и лекционными залами) был построен по образцу медресе Харгирд в Хорасане; в его состав входили ученые Гаван, набранные лично из Самарканда, Шираза и Герата. Библиотека, в которой, как говорят, хранится три тысячи рукописей, была крупнейшей на юге Индии до того, как в 1696 году взорвался пороховой склад." #NT!
 bah_sufi_tariqa_patronage_bureaucracy: "Покровительство Суфийского Тариката" #NT!
 bah_sufi_tariqa_patronage_bureaucracy_desc: "Мастер Чишти Сайид Мухаммад аль-Хусайни Гесудараз прибыл в Гульбаргу в 1397 году по приглашению Фируз-шаха Бахмани; его дарга, построенная вокруг места его смерти в 1422 году, стала центром паломничества суфийских кругов Декана. Вокруг него бахмани покровительствовали святилищам Джунаиди в Даулатабаде, резиденциям Кадири в Бидаре после 1430 года и ордену Шаттари в Манду. Предоставление вакфов этим тарикатам закрепило легитимность султаната среди мусульман Декани; Султаны Бахмани были похоронены рядом со своими шейхами в Хулдабаде и Гульбарге, а не в придворных мавзолеях." #NT!
 bah_daulatabad_mint_bureaucracy: "Королевский монетный двор Даулатабада" #NT!
 bah_daulatabad_mint_bureaucracy_desc: "Золотые танки Бахмани и серебряные дирхемы чеканились в основном в Даулатабаде, с дополнительными монетными дворами в Гулбарге, а после 1430 года — в Бидаре. Продукция монетного двора оплачивала арабскую торговлю лошадьми через Гоа, Чаул и Дабхол (необходимый трубопровод для кавалерии, которую Бахмани выставили против Виджаянагара и Хандеша) и обеспечивала стипендии кавалерии Пардези, которые привязывали иранскую и иракскую знать к трону. Стандартизированная танка, вес которой соответствовал дирхаму Халифата, позволила принять валюту Бахмани в Индийском океане." #NT!
 AUTO_MODIFIER_NAME_nd_bah_bureaucracy_authority: "Бюрократия султаната Бахмани" #NT!
 AUTO_MODIFIER_DESC_nd_bah_bureaucracy_authority: "Султанат Бахмани унаследовал институциональный репертуар Индо-Персидского Декана: достаточно правящих традиций династии-основателя, чтобы укомплектовать один постоянный бюрократический офис за пределами столицы." #NT!
