l_russian:
 CDA: "Арагонская империя" #NT!
 CDA_ADJ: "Каталанско-арагонский" #NT!
 CDA_f: "Арагонская империя" #NT!
 CDA_f_desc: "Создать каталонско-арагонскую средиземноморскую талассократию, которая на короткое время связала Иберию с Италией под единым сувереном: альтернативный путь объединения, который закончился, когда Кастилия поглотила Арагон в 1469 году. Восстановить личный союз нескольких королевств Альфонсо V Великодушного, занимающего королевские места в Барселоне, Неаполе и Палермо и управляющего Арагоном, Каталонией, Валенсией, Балеарскими островами, Сардинией, Сицилией и Меццоджорно из странствующего двора. Морская торговая империя каталонских консульств, наемников Альмогавара, Консолат де Мар и Королевской Сеньеры: Арагон, который смотрел на восток через море, а не на запад, в сторону Кастилии." #NT!
