l_russian:
  # === Advances === 
  # Age 1 
 nd_mtm_sawah_agriculture: "Выращивание влажного риса в Савахе" #NT!
 nd_mtm_sawah_agriculture_desc: "Плодородные вулканические почвы Центральной Явы поддерживают интенсивную систему выращивания влажного риса. Террасные рисовые поля направляют горную воду через сложную ирригационную сеть, производя обильные урожаи, которые кормят растущее население." #NT!
 nd_mtm_majapahit_heritage: "Наследие суда Маджапахита" #NT!
 nd_mtm_majapahit_heritage_desc: "Матарам унаследовал культурное наследие великой империи Маджапахит: ее придворные протоколы, литературные традиции и концепции священного королевского сана, которые лежат в основе политической власти Явы." #NT!
 nd_mtm_empu_smithing: "Эмпу Керис Кузнечное дело" #NT!
 nd_mtm_empu_smithing_desc: "Эмпу — мастера-кузнецы, которые куют керис: священный асимметричный кинжал Явы. Сочетая в сотнях складок железо, никель и метеоритный металл, они создают клинки, которые, как полагают, обладают духовной силой." #NT!
 nd_mtm_javanese_islam: "Яванский исламский синтез" #NT!
 nd_mtm_javanese_islam_desc: "Ислам пришел на Яву не как замена существующим традициям, а как наложение на них. Вали Сонго, девять исламских святых, распространяли веру, включив ее в яванский танец, кукольный театр и придворные ритуалы." #NT!
 nd_mtm_keris_militia: "Керис-вооруженная милиция" #NT!
 nd_mtm_keris_militia_desc: "Каждый яванский мужчина носит с собой керис. Во время войны деревенские общины создают ополчение, вооруженное этими священными кинжалами и бамбуковыми копьями, сражаясь с духовной уверенностью, что их клинки защищают их." #NT!
 nd_mtm_inland_trade: "Внутренние торговые пути" #NT!
 nd_mtm_inland_trade_desc: "Внутренние рынки Центральной Явы соединяют равнины, где выращивают рис, с горными производителями специй, металлов и лесной продукции. Сухопутная торговля поддерживает аграрную экономику, которую султаны Матарама ценят выше морской торговли." #NT!
  # Age 2 
 nd_mtm_kraton_tradition: "Кратон Палас Традиция" #NT!
 nd_mtm_kraton_tradition_desc: "Кратон – это больше, чем дворец: это космологический центр Яванского королевства, правитель которого выступает посредником между небом и землей. Его концентрические стены отражают космический порядок, узаконивающий королевскую власть." #NT!
 nd_mtm_batik_codification: "Кодификация текстиля батик" #NT!
 nd_mtm_batik_codification_desc: "Под покровительством двора техника воскового окрашивания батика возводится из ремесла в высокое искусство. Мастера-ремесленники создают сложные геометрические и натуралистические узоры, каждый из которых несет символическое значение в яванской космологии." #NT!
 nd_mtm_court_arts: "Гамелан и Ваянг Кулит" #NT!
 nd_mtm_court_arts_desc: "Бронзовые ударные оркестры гамелана и кожаные теневые кукольные театры ваянг кулит достигают своих классических форм под покровительством Матарама. Эти искусства передают эпосы Рамаяны и Махабхараты, внедряя индуистскую мифологию в исламский мир." #NT!
 nd_mtm_tumenggung_system: "Администрация Туменггунг" #NT!
 nd_mtm_tumenggung_system_desc: "Султан управляет через назначенных туменггунгов: региональных лордов, которые управляют территориями, собирают налоги и собирают войска от имени трона. Их лояльность обеспечивается раздачей удельных земель." #NT!
 nd_mtm_priyayi_class: "Бюрократический класс Прияи" #NT!
 nd_mtm_priyayi_class_desc: "Новый класс образованных чиновников, прияи, появляется для обслуживания двора Матарама. Получив аристократический статус благодаря королевскому назначению, а не рождению, они составляют административную основу расширяющегося султаната." #NT!
 nd_mtm_port_suppression: "Консолидация доходов портов" #NT!
 nd_mtm_port_suppression_desc: "Опасаясь независимого богатства, которое морская торговля приносит прибрежным лордам, правители Матарама перенаправляют экономическую деятельность вглубь страны. Доходы портов передаются через суд, укрепляя центральную власть за счет морской власти." #NT!
 nd_mtm_pesantren_network: "Сеть Песантрен" #NT!
 nd_mtm_pesantren_network_desc: "Сельские исламские школы-интернаты, песантрен, распространились по Яве, обучая молодежь чтению Корана, арабской каллиграфии и яванскому письму. Они создают грамотный класс, преданный и вере, и султану." #NT!
  # Age 3 
 nd_mtm_agung_conquests: "Завоевания султана Агунга" #NT!
 nd_mtm_agung_conquests_desc: "Неустанные военные кампании султана Агунга объединили почти всю Яву под знаменем Матарама. Пятилетняя осада Сурабаи и покорение прибрежных королевств восточной Явы знаменуют зенит яванской военной мощи." #NT!
 nd_mtm_siege_tradition: "Яванская осадная традиция" #NT!
 nd_mtm_siege_tradition_desc: "Завоевание Сурабаи продемонстрировало мастерство Матарама в длительной осадной войне. Перекрыв плотиной реку Брантас и отравив запасы воды, силы султана Агунга заставили укрепленные города подчиниться голоду без прямого нападения." #NT!
 nd_mtm_calendar_reform: "Реформа яванского календаря" #NT!
 nd_mtm_calendar_reform_desc: "В 1633 году султан Агунг вводит революционный календарь, который объединяет солнечную систему индуистских саков с исламским лунным исчислением. Этот синтез отражает более широкий проект Матарама по гармонизации индуистского прошлого Явы с ее исламским настоящим." #NT!
 nd_mtm_tax_reform: "Административная налоговая реформа" #NT!
 nd_mtm_tax_reform_desc: "Султан Агунг реструктурирует налоговый кодекс на завоеванных территориях, заменяя специальную дань рационализированной системой оценки земель. Суды и судебные разбирательства приведены в большее соответствие с предписаниями Корана." #NT!
 nd_mtm_batavia_campaign: "Батавская кампания" #NT!
 nd_mtm_batavia_campaign_desc: "В 1628–1629 годах султан Агунг отправляет около 14 000 солдат для осады голландской крепости ЛОС в Батавии. Хотя осада провалилась из-за проблем с путями снабжения и болезней, она демонстрирует готовность Матарама бросить вызов европейским нарушителям." #NT!
 nd_mtm_irrigation_expansion: "Расширение ирригации" #NT!
 nd_mtm_irrigation_expansion_desc: "Растущее население и военные амбиции Матарама требуют все больших урожаев риса. Новые террасы савах высечены в лесу и на склоне холма, расширяя ирригационную сеть, которая питает армии и дворы султаната.\n\n#italic Доступно в: $nd_mtm_sawah_terrace$#!" #NT!
 nd_mtm_judicial_reform: "Кораническая судебная реформа" #NT!
 nd_mtm_judicial_reform_desc: "Султан Агунг приводит суды султаната в соответствие с исламской юриспруденцией, вводя правовые кодексы, основанные на шариате, которые дополняют традиционные яванские законы адата. Эта двойная система усиливает как религиозную легитимность, так и административный контроль." #NT!
  # Age 4 
 nd_mtm_trunajaya_aftermath: "Наследие восстания Трунаджайи" #NT!
 nd_mtm_trunajaya_aftermath_desc: "Разрушительное восстание Трунаджайи 1670-х годов почти уничтожило Матарам. Мадурские повстанцы захватывают столицу Плеред, вынуждая султана обратиться за помощью к ЛОС: роковая сделка, которая сохраняет трон, но уступает суверенитет." #NT!
 nd_mtm_kraton_guard: "Дворцовая стража Кратона" #NT!
 nd_mtm_kraton_guard_desc: "После травм, нанесенных восстанием Трунаджайи, султаны создают постоянный корпус дворцовой стражи: элитные солдаты, набранные из классов прияи и солдат, вооруженные и обученные защищать кратон от будущих узурпаторов." #NT!
 nd_mtm_batik_larangan: "Батик Ларанган" #NT!
 nd_mtm_batik_larangan_desc: "Султаны систематизировали батик ларанган: запрещенные узоры, предназначенные исключительно для королевского использования. Мотив паранг русак становится высшим символом королевской власти, а его ношение простыми людьми наказывается как оскорбление космического порядка.\n\n#italic Доступно в: $nd_mtm_batik_workshop$#!" #NT!
 nd_mtm_pesantren_expansion: "Научное расширение Песантрена" #NT!
 nd_mtm_pesantren_expansion_desc: "Сеть песантрен углубляет свою научную миссию, создавая класс кяи: исламских учителей, которые обладают как религиозным авторитетом, так и лояльностью общества во всей яванской сельской местности.\n\n#italic Доступно в: $nd_mtm_pesantren$#!" #NT!
 nd_mtm_voc_diplomacy: "Дипломатическое взаимодействие VOC" #NT!
 nd_mtm_voc_diplomacy_desc: "Султаны Матарама выстраивают все более сложные отношения с Голландской Ост-Индской компанией: обменивают уступки на военную поддержку, натравливают фракции ЛОС друг против друга и поддерживают видимость суверенитета над уменьшающимися владениями." #NT!
 nd_mtm_granary_system: "Зернохранилище Лумбунг" #NT!
 nd_mtm_granary_system_desc: "Сеть королевских зернохранилищ (lumbung) хранит запасы риса, собранного в сезон дождей. Эти резервы поддерживают армии в ходе военных действий, защищают от голода и дают султану экономические рычаги влияния на своих подданных и соперников." #NT!
 nd_mtm_road_network: "Дорожная сеть Центральной Явы" #NT!
 nd_mtm_road_network_desc: "Основные маршруты, соединяющие кратон со столицами провинций, сохраняются и расширяются, что позволяет ускорить передвижение войск и сбор налогов по внутренним территориям Матарама." #NT!
  # Age 5 
 nd_mtm_succession_reforms: "Реформы преемственности" #NT!
 nd_mtm_succession_reforms_desc: "Три разрушительные войны за престол преподнесли двору Матарама тяжелые уроки упорядоченной передачи власти. Новые протоколы пытаются упорядочить преемственность, хотя реальность яванской судебной политики остается коварной." #NT!
 nd_mtm_wayang_wong: "Танцевально-драма Ваянг Вонг" #NT!
 nd_mtm_wayang_wong_desc: "Придворная культура достигает своего золотого века благодаря ваянг вонгу: живой танцевальной драме, в которой люди-исполнители разыгрывают те же эпические события, что и теневые марионетки. Зрительный зал пендопо становится сценой для уникального для Центральной Явы вида искусства." #NT!
 nd_mtm_modern_prajurit: "Модернизированный Праюрит" #NT!
 nd_mtm_modern_prajurit_desc: "Традиционные пехотные полки Матарама используют европейское огнестрельное оружие и методы обучения, изученные за десятилетия контактов с силами ЛОС. Эти модернизированные праюриты сочетают яванский боевой дух с новой тактической дисциплиной." #NT!
 nd_mtm_cultural_rivalry: "Соперничество Суракарта-Джокьякарта" #NT!
 nd_mtm_cultural_rivalry_desc: "Разделение Матарама в 1755 году на соперничающие дворы в Суракарте и Джокьякарте вызвало необычайное культурное соревнование. Каждый двор покровительствует своим стилям гамелана, танца, батика и литературы, что удваивает творческий потенциал яванской цивилизации." #NT!
 nd_mtm_batik_manufacturing: "Передовое производство батика" #NT!
 nd_mtm_batik_manufacturing_desc: "Новые техники окрашивания и усовершенствование восковой ручки позволяют создавать все более сложные узоры батика. Ткань становится основным экспортным товаром, который ценится из малайского мира в Европу.\n\n#italic Доступно в: $nd_mtm_batik_workshop$#!" #NT!
 nd_mtm_teak_exploitation: "Эксплуатация тикового леса" #NT!
 nd_mtm_teak_exploitation_desc: "Обширные тиковые леса Явы обеспечивают древесину для строительства, судостроения и экспорта. Систематическая эксплуатация в условиях королевской монополии приносит доход и обеспечивает материалы, необходимые для строительства дворцов, фортов и торговых судов." #NT!
  # Age 6 
 nd_mtm_serat_tradition: "Серат Литературный Ренессанс" #NT!
 nd_mtm_serat_tradition_desc: "Яванские придворные поэты создают расцвет литературы, серат, переплетая воедино историческую хронику, моральную философию и мистическую поэзию. Эти работы сохраняют яванскую идентичность и мудрость в эпоху европейского колониального вторжения." #NT!
 nd_mtm_anti_colonial: "Антиколониальное сопротивление" #NT!
 nd_mtm_anti_colonial_desc: "Начиная с Яванской войны Дипонегоро 1825–1830 годов, наследие Матарама вдохновляет вооруженное сопротивление голландскому колониальному правлению. Эти движения опираются на яванские военные традиции и исламское рвение бросить вызов европейскому господству." #NT!
 nd_mtm_modern_administration: "Современное административное государство" #NT!
 nd_mtm_modern_administration_desc: "Яванские администраторы адаптируют современные бюрократические методы, сохраняя при этом традицию прияи. Результатом является административная система, которая сочетает в себе иерархию коренных народов с рациональным управлением, подходящим для современной эпохи." #NT!
 nd_mtm_plantation_economy: "Плантационная экономика" #NT!
 nd_mtm_plantation_economy_desc: "Плодородные вулканические почвы Явы идеально подходят для выращивания сахара, табака и кофе в промышленных масштабах. Плантационное сельское хозяйство превращает остров в одну из самых продуктивных колониальных экономик в мире." #NT!
 nd_mtm_national_awakening: "Яванское национальное пробуждение" #NT!
 nd_mtm_national_awakening_desc: "Новое поколение образованных яванцев вновь обретает гордость за свое культурное наследие. Наследие дворов Матарама (их батик, гамелан и литература) становится основой зарождающейся национальной идентичности." #NT!
 nd_mtm_batik_export: "Батик Экспортная Экономика" #NT!
 nd_mtm_batik_export_desc: "Методы промышленного производства позволяют производить батик в масштабах для мировых рынков, сохраняя при этом художественное качество, благодаря которому яванский текстиль ценится во всем мире.\n\n#italic Доступно в: $nd_mtm_batik_workshop$#!" #NT!
  # === Units === 
 a_nd_mtm_keris_prajurit: "Керис Праюрит" #NT!
 a_nd_mtm_keris_prajurit_desc: "Деревенское ополчение вооружено священными кинжалами керис и бамбуковыми копьями. Недостаток формального обучения они компенсируют духовной убежденностью в том, что клинки делают их неуязвимыми." #NT!
 a_nd_mtm_agung_prajurit: "Праюрит Агунга" #NT!
 a_nd_mtm_agung_prajurit_desc: "Победоносная пехота в кампаниях султана Агунга: дисциплинированные солдаты, которые осадили Сурабаю и пронесли знамя Матарама через Яву." #NT!
 a_nd_mtm_sentana_cavalry: "Сентана Кавалерия" #NT!
 a_nd_mtm_sentana_cavalry_desc: "Члены королевской семьи и знать верхом на яванских пони служили мобильной ударной группой султана. Их стремительные набеги нарушают линии снабжения и коммуникации противника." #NT!
 a_nd_mtm_kraton_guard: "Кратон Страж" #NT!
 a_nd_mtm_kraton_guard_desc: "Элитная дворцовая пехота, поклявшаяся защищать кратон. Вооруженные керисом и пикой, они стоят последней линией между султаном и теми, кто хочет захватить трон." #NT!
 a_nd_mtm_modern_prajurit: "Современный Праюрит" #NT!
 a_nd_mtm_modern_prajurit_desc: "Яванская пехота обучена европейскому огнестрельному оружию и тактическому построению. Они сочетают в себе традиционную боевую храбрость праюритов с мушкетными залпами и дисциплинированной тренировкой современной эпохи." #NT!
 a_nd_mtm_pemberontak: "Пемберонтак" #NT!
 a_nd_mtm_pemberontak_desc: "Бойцы антиколониального сопротивления, обученные партизанской тактике. Используя густые джунгли и рисовые поля Явы в своих интересах, они наносят удары по колониальным силам и растворяются в сельской местности." #NT!
  # === Buildings === 
 nd_mtm_sawah_terrace: "Савах Терраса" #NT!
 nd_mtm_sawah_terrace_desc: "Тщательно спроектированные рисовые поля, которые направляют вулканическую родниковую воду через выложенные камнями каналы и затопляют террасные поля. Система Сава на Яве поддерживает одно из самых густонаселенных сельскохозяйственных поселений в мире." #NT!
 nd_mtm_empu_forge: "Эмпу Кузница" #NT!
 nd_mtm_empu_forge_desc: "Мастерская мастера-кузнеца эмпу, где посредством ритуальной обработки металла выковывают священный керис. Каждый клинок требует сотен складок молота и духовной подготовки, чтобы создать оружие, воплощающее яванскую культурную самобытность." #NT!
 nd_mtm_kraton_palace: "Кратон Палас" #NT!
 nd_mtm_kraton_palace_desc: "Укреплённый дворцовый комплекс, служащий космологическим и политическим центром Яванского королевства. Его концентрические стены отражают структуру вселенной с султаном в божественном центре." #NT!
 nd_mtm_batik_workshop: "Мастерская Батика" #NT!
 nd_mtm_batik_workshop_desc: "Специализированная мастерская, где мастера наносят замысловатые узоры из расплавленного воска, а затем окрашивают ткань в натуральный индиго и сога-коричневый цвет. Получаемый текстиль в стиле батик является одновременно повседневной одеждой и регалией придворного двора." #NT!
 nd_mtm_pesantren: "Песантрен" #NT!
 nd_mtm_pesantren_desc: "Исламская школа-интернат, где ученики живут под руководством учителя кьяи, изучая Коран наряду с яванской литературой и письменностью. Песантрен является основой сельского образования по всей Яве." #NT!
 nd_mtm_benteng_fort: "Форт Бентенг" #NT!
 nd_mtm_benteng_fort_desc: "Яванское внутреннее укрепление из утрамбованной земли и камня, построенное для контроля над переправами через реки и горными перевалами. Осадный опыт Матарама отражен в оборонительных сооружениях, способных противостоять той самой тактике, которую применяли его собственные армии." #NT!
 nd_mtm_lumbung_granary: "Лумбунгское зернохранилище" #NT!
 nd_mtm_lumbung_granary_desc: "Характерное приподнятое деревянное хранилище с изогнутым коньком, предназначенное для сохранения риса сухим во время влажного сезона дождей. Королевские зернохранилища образуют стратегический резерв, который поддерживает армии и защищает от голода." #NT!
 nd_mtm_pendopo_hall: "Пендопо Холл" #NT!
 nd_mtm_pendopo_hall_desc: "Открытый зрительный зал с высокой крышей, поддерживаемой массивными тиковыми колоннами. Пендопо — это место, где султан держит двор, выступают оркестры гамелана, а танцы ваянг вонг оживляют эпосы." #NT!
 nd_mtm_plantation_complex: "Плантационный комплекс" #NT!
 nd_mtm_plantation_complex_desc: "Сельскохозяйственный комплекс промышленного масштаба, объединяющий сахарные заводы, сушилки и перерабатывающие предприятия. Вулканическая почва Явы и тропический климат делают ее идеальной для выращивания товарных культур." #NT!
  # === Production Methods === 
 nd_mtm_sawah_maintenance: "Савах Ирригация" #NT!
 nd_mtm_sawah_maintenance_desc: "Поддержание сложной системы каналов, плотин и террас, позволяющих выращивать влажный рис, требует постоянных инвестиций в древесину и камень." #NT!
 nd_mtm_keris_forging: "Керис Форжинг" #NT!
 nd_mtm_keris_forging_desc: "Выковывает священные кинжалы керис из сплавов железа и меди посредством ритуальной обработки металлов, создавая своеобразное яванское оружие." #NT!
 nd_mtm_palace_upkeep: "Обслуживание дворца" #NT!
 nd_mtm_palace_upkeep_desc: "Кратон требует постоянного ухода: древесина для тиковых павильонов, камень для стен и тонкая ткань для церемониальной обстановки." #NT!
 nd_mtm_batik_dyeing: "Крашение батика" #NT!
 nd_mtm_batik_dyeing_desc: "Превращает обычную ткань в узорчатый текстиль в стиле батик с помощью традиционного процесса воскового окрашивания, производя прекрасную ткань, которая ценится во всей Юго-Восточной Азии." #NT!
 nd_mtm_pesantren_upkeep: "Песантрен Операция" #NT!
 nd_mtm_pesantren_upkeep_desc: "Исламским школам-интернатам нужна бумага для рукописей, рис для питания учеников и преданность учителей кяи." #NT!
 nd_mtm_benteng_upkeep: "Обслуживание Форта" #NT!
 nd_mtm_benteng_upkeep_desc: "Для поддержания каменных стен и гарнизона бэнтенга необходимы постоянные поставки камня, древесины и оружия." #NT!
 nd_mtm_granary_maintenance: "Обслуживание зернохранилища" #NT!
 nd_mtm_granary_maintenance_desc: "Поддержание складов в хорошем состоянии и запасов риса в свежем виде требует постоянных инвестиций в севооборот древесины и зерна." #NT!
 nd_mtm_pendopo_upkeep: "Обслуживание Пендопо" #NT!
 nd_mtm_pendopo_upkeep_desc: "Большой зал для аудиенций требует замены тикового дерева и церемониальных драпировок, чтобы оставаться подходящим местом для придворной культуры." #NT!
 nd_mtm_sugar_processing: "Переработка сахара" #NT!
 nd_mtm_sugar_processing_desc: "Измельчает сахарный тростник и варит сироп на лесных мельницах, производя сахар-сырец для внутреннего потребления и на экспорт." #NT!
 nd_mtm_kyai_instruction: "Кьяй Инструкция" #NT!
 nd_mtm_kyai_instruction_desc: "Продвинутое научное обучение под руководством опытных учителей кяи, требующее дополнительной бумаги для рукописей и риса для поддержки расширенного состава студентов." #NT!
 nd_mtm_expanded_irrigation: "Расширенное орошение" #NT!
 nd_mtm_expanded_irrigation_desc: "Новые террасы савах, высеченные на склонах холмов и лесных полянах, расширяют сеть выращивания влажного риса по всей Центральной Яве." #NT!
 nd_mtm_royal_batik: "Роял Батик Продакшн" #NT!
 nd_mtm_royal_batik_desc: "Придворные ремесленники производят батик ларанган из шелка и редких красителей: ограниченные мотивы, включая священный узор паранг русак, создают лучшие ткани на Яве." #NT!
 nd_mtm_fine_batik: "Производство тонкого батика" #NT!
 nd_mtm_fine_batik_desc: "Передовые методы кантинга с использованием восковой ручки позволяют создавать батик необычайной сложности из ткани и красок, из которого получаются прекрасные ткани для экспорта во дворы Юго-Восточной Азии." #NT!
 nd_mtm_industrial_batik: "Производство промышленного батика" #NT!
 nd_mtm_industrial_batik_desc: "Методы печати медным штампом и массового крашения позволяют производить прекрасный текстиль в стиле батик в промышленных масштабах, сочетая традиционную эстетику с современной эффективностью." #NT!
  # === Levies === 
 levy_nd_mtm_kraton_guard: "Кратон-страж Леви" #NT!
 levy_nd_mtm_kraton_guard_desc: "Элитные защитники дворца, выросшие из солдат и знати, защищали кратон султана." #NT!
 levy_nd_mtm_keris_prajurit: "Керис Праюрит Леви" #NT!
 levy_nd_mtm_keris_prajurit_desc: "Деревенское ополчение, вооруженное священными кинжалами керис, набранное из крестьянского и солдатского населения." #NT!
  # === Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_mtm_agung_military_legacy: "Наследие меча Агунга" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_agung_military_legacy: "Султан Агунг объединил Яву посредством военного завоевания. Его наследие вдохновляет наши армии продолжать наступление: захватить то, чего требует меч султана." #NT!
 STATIC_MODIFIER_NAME_nd_mtm_agung_administrative_legacy: "Наследие закона Агунга" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_agung_administrative_legacy: "Величайшим достижением султана Агунга было не завоевание, а административная система, которая скрепляла его завоевания. Его реформы направляют наше управление." #NT!
 STATIC_MODIFIER_NAME_nd_mtm_batavia_resolve: "Решимость Батавии" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_batavia_resolve: "Осада Батавии доказала, что Ява не подчинится смиренно иностранным захватчикам. Хотя стены устояли, готовность сражаться горит ярче, чем когда-либо." #NT!
 STATIC_MODIFIER_NAME_nd_mtm_batavia_lessons: "Уроки Батавии" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_batavia_lessons: "Неудачная осада преподала тяжелые уроки в области логистики и снабжения. Будущие кампании будут лучше подготовлены и более тщательно спланированы." #NT!
 STATIC_MODIFIER_NAME_nd_mtm_internal_vigilance: "Внутренняя бдительность" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_internal_vigilance: "Травма, вызванная восстанием Трунаджайи, требует вечной бдительности. Трон должен обнаружить и нейтрализовать угрозы, прежде чем они перерастут в открытое восстание." #NT!
 STATIC_MODIFIER_NAME_nd_mtm_reconsolidation: "Реконсолидация власти" #NT!
 STATIC_MODIFIER_DESC_nd_mtm_reconsolidation: "После подавления восстания султан приступает к восстановлению основ королевской власти: вновь подтверждая клятвы верности, восстанавливая порядок и подтверждая божественное право на трон." #NT!
  # === Events === 
 nd_mtm.1.t: "Завоевания султана Агунга" #NT!
 nd_mtm.1.d: "Султан Агунг Матарамский, величайший из исламских правителей Явы, потратил два десятилетия на то, чтобы привести остров под свою власть. Из плодородных рисовых земель Центральной Явы его армии двинулись на восток, чтобы покорить гордую Сурабаю посредством пятилетней осады, перегородив реку Брантас плотиной и заморив город голодом. К западу от кратона прибрежные королевства Пасисира склонились перед его знаменем.\n\nТеперь Матарам является бесспорным хозяином Явы. Но султан стоит перед выбором, который определит его наследие. Будет ли энергия, завоевавшая Яву, направлена ​​наружу в дальнейших военных кампаниях или направлена ​​внутрь, чтобы построить административную основу, которая сможет скрепить это огромное царство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mtm.1.a: "Меч, который выковал Яву, сохранит ее." #NT!
 nd_mtm.1.b: "Закон и порядок важнее завоеваний." #NT!
 nd_mtm.2.t: "Новый яванский календарь" #NT!
 nd_mtm.2.d: "В смелом акте культурного синтеза Султан Агунг объявляет о введении революционно нового календаря для всей Явы. Старый индуистский солнечный календарь саков, отсчитывающий годы с 78 г. н. э., отныне будет следовать исламскому лунному циклу, сохраняя при этом сакскую нумерацию лет. Традиционный яванский пятидневный рыночный цикл пасаран сохраняется наряду с семидневной исламской неделей, создавая уникальный в мире тридцатипятидневный цикл ветонана.\n\nЭто больше, чем просто хронометраж: это заявление о том, что яванский ислам не должен отказываться от своего индуистско-буддийского прошлого, но может вплести его во что-то совершенно новое. Ученые Кратона фиксируют это изменение, а фермеры Савы корректируют свои посевные циклы в соответствии с новыми расчетами." #NT!
 nd_mtm.2.a: "Календарь цивилизации между мирами." #NT!
 nd_mtm.3.t: "Осада Батавии" #NT!
 nd_mtm.3.d: "В 1628 году султан Агунг отправляет многотысячную армию на запад, к голландской крепости Батавия. Эта кампания является самой амбициозной в истории Явы: попытка изгнать европейских оккупантов, обосновавшихся на северо-западном побережье Явы. Первое нападение терпит неудачу, и в 1629 году прибывает вторая армия, насчитывающая около 14 000 солдат под командованием Дипати Укура и Адипати Джумины.\n\nСилы Матарама осаждают город и отравляют реку Чиливунг, вызывая чуму холеры, убивающую самого голландского генерал-губернатора Яна Питерсоона Коэна. Однако линии снабжения Матарама тянутся слишком далеко, яванский лагерь опустошает болезнь, и осада в конечном итоге проваливается.\n\nПоражение требует расплаты. Как Матарам отреагирует на эту неудачу перед технологически продвинутым противником?" #NT!
 nd_mtm.3.a: "Мы вернемся с большей силой." #NT!
 nd_mtm.3.b: "Мы должны научиться сражаться по-другому." #NT!
 nd_mtm.4.t: "Трунаджайское восстание" #NT!
 nd_mtm.4.d: "Мадурский принц Трунаджайя поднял разрушительное восстание, которое почти уничтожило султанат Матарам. Пользуясь всеобщим гневом по поводу бесчинств султана Амангкурата I, чьи чистки унесли тысячи жизней и чьи барщинные требования сковали крестьянство, силы Трунаджаи разбивают королевскую армию в Гегодоге в 1676 году, захватывают северное побережье и захватывают столицу Плеред в 1677 году.\n\nАмангкурат II принимает судьбоносное решение запросить военную помощь ЛОС, обещая финансовые уступки и территориальные уступки. С помощью голландцев Матарам отвоевывает утраченные территории и захватывает Трунаджаю в его крепости Кедири в 1678 году.\n\nТрон спасен, но какой ценой? Теперь султан должен решить, как восстанавливать страну: путем укрепления внутренней безопасности или путем реконсолидации институтов королевской власти." #NT!
 nd_mtm.4.a: "Никогда больше мы не будем застигнуты врасплох." #NT!
 nd_mtm.4.b: "Восстановите основы королевской власти." #NT!
 nd_mtm_formed_tt: "Матарам был сформирован" #NT!
 nd_mtm_path_a_tt: "Выбрать «Наследие меча Агунга»" #NT!
 nd_mtm_path_b_tt: "Выбрать «Наследие закона Агунга»" #NT!
  # === Bureaucracies === 
 mtm_patih_lebet_bureaucracy: "Кепатихан из Патих Лебет" #NT!
 mtm_patih_lebet_bureaucracy_desc: "Патих лебет был великим визирем султана и главой центральной администрации кепатихана, официально оформленной султаном Агунгом в Керте и расширенной после 1680 года в Картасуре. Под его руководством корпус секретарей-наяка и дублера патих-анома отвечали за сбор налогов, правосудие и набор провинциальных войск, обходя региональных лордов-адипати. Аристократия прияи возмущалась централизацией, но не могла ее свергнуть." #NT!
 mtm_negaragung_mancanegara_bureaucracy: "Негарагунг и Манканегара" #NT!
 mtm_negaragung_mancanegara_bureaucracy_desc: "Территория Матарама была организована в виде концентрических колец: королевский округ Кутагара, сердце Негарагунга, возделываемое непосредственно для короля, внешние яванские провинции Манканегара под управлением регентов-адипати и северное побережье пасисиров под надзором туменггунга. Каждый адипати должен был платить ежегодную дань, барщину кратону и выступать перед публикой в ​​пасевакане. Система привлекла рабочую силу и зерно внутрь, но обескровила крестьянство, вызвав восстания от Трунаджайи (1674 г.) до Мангкубуми (1746 г.)." #NT!
 mtm_pajeksan_cadaster_bureaucracy: "Паджексанский земельный кадастр" #NT!
 mtm_pajeksan_cadaster_bureaucracy_desc: "Паджексан султана Агунга представлял собой королевский корпус налоговых инспекторов, который провел первое систематическое землеустройство центральной Явы, записывая каждое поле сава и жилой комплекс в реестры пальмовых листьев, хранящиеся в архиве кепатихана. Каждая домашняя единица какаха учитывалась в земельной ведомости адипати и облагалась налогом в виде риса и барщинных дней. Система значительно увеличила королевские доходы, но сильно обременяла земледельцев: квота кака падала независимо от того, был ли собран урожай или нет." #NT!
 mtm_imogiri_tomb_shrine_bureaucracy: "Королевская гробница-храм Имогири" #NT!
 mtm_imogiri_tomb_shrine_bureaucracy_desc: "В 1632 году султан Агунг начал строительство королевского погребального комплекса в Имогири на холмах к югу от своей столицы по образцу старых святынь Гирилойо и святых могил Вали Сонго. Здесь был похоронен каждый султан Матарама, начиная с Агунга, и после 1755 года Суракарта и Джокьякарта поочередно делили святыню, единственное совместное учреждение, сохранившееся разделенной династией. Культ соединил суфийское почитание гробниц с более древним индуистско-яванским поклонением предкам, сакрализуя трон таким образом, что даже султаны, навязанные ЛОС, должны были чтить." #NT!
 mtm_bedhaya_court_arts_bureaucracy: "Бедхая Корт Артс" #NT!
 mtm_bedhaya_court_arts_bureaucracy_desc: "Султан Агунг заказал Бедхая Кетаванг, священный придворный танец для девяти танцовщиц, который исполнялся только в годовщину коронации короля, к которому Кандженг Рату Кидул (дух-королева южного моря) присоединилась в качестве десятой невидимой танцовщицы. Вокруг него кристаллизовались музыканты гамелан секатен, кукловоды даланг из ваянг кулит и кузнецы эмпу кратон. Комплекс возвысил класс аристократов-администраторов прияи как единственных носителей высокой яванской культуры, но его содержание легло на плечи крестьян-негарагунгов." #NT!
 mtm_surakarta_yogyakarta_dual_bureaucracy: "Двойной суд Суракарта-Джокьякарта" #NT!
 mtm_surakarta_yogyakarta_dual_bureaucracy_desc: "Гиянтский договор от 13 февраля 1755 года завершил Третью яванскую войну за наследство, официально разделив Матарам между Сусухунаном Пакубувоно III в Суракарте и султаном Хаменгкубувоно I в Джокьякарте, каждый со своим кратоном и кепатиханом. Культурное соперничество привело к замечательному расцвету: элегантный стиль Суракарты «алус» и литературное наследие Ясадипура; Энергичный стиль Джокьякарты и отличный сценарий. Но двойная администрация удвоила стоимость управления, и ЛОС на протяжении столетия вели судебные разбирательства друг против друга." #NT!
  
