 AUTO_MODIFIER_NAME_nd_mtm_bureaucracy_authority: "Бюрократический орган Матарама" #NT!
 AUTO_MODIFIER_DESC_nd_mtm_bureaucracy_authority: "Реформированный аппарат кратона (кепатихан, паджексан и корпус секретарей-наяка) предоставляет Матараму институциональную способность управлять своим царством через формальную бюрократию." #NT!
