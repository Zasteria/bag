l_russian:
 STATIC_MODIFIER_NAME_nd_mtp_golden_trade: "Золото Софалы" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_golden_trade: "Реки несут золото, а торговцы — ткани. Через фейры Софала, Сена и Тете богатства плато утекают в Индийский океан, а знания о мире возвращаются обратно." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_mwari_sovereignty: "Голос Мвари" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_mwari_sovereignty: "Говорят оракулы холмов Матобо, и идут дожди. Мвенемутапа правит не потому, что иностранцы приносят безделушки, а потому, что Мвари дарует урожай. Сила королевства – в его собственной земле и копьях его собственных сыновей." #NT!
 nd_mtp.1.t: "Восстановление Мутапы" #NT!
 nd_mtp.1.d: "Огромные каменные дома наших предков стоят обновленными. Из оград на вершине холма, где когда-то заседал двор Мвенемутапа, снова по всему плато раздаются барабаны, призывающие провинции к единству. Народы шона и каланга смотрят на нас как на преемников Великого Зимбабве, королевства, построенного на золоте, железе и благосклонности Мвари.\n\nНо мир за плато приближается. Купцы-суахили и португальские торговцы наводняют речные города, жаждущие нашего золота. Их ткань, стеклянные бусы и огнестрельное оружие полезны, но их амбиции безграничны. Используем ли мы эту торговлю, чтобы построить нечто большее, чем представляли себе наши предки? Или мы смотрим внутрь себя, на силу, которая сделала возможным Великий Зимбабве, на труд наших фермеров, мастерство наших кузнецов и духовный авторитет культа Мвари?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mtp.1.a: "Пусть золото течет, и пусть мир придет к нам." #NT!
 nd_mtp.1.b: "Мвари предоставляет все, что нам нужно. Наша сила – это наша собственная сила." #NT!
 nd_mtp.2.t: "Отрыв Розви" #NT!
 nd_mtp.2.d: "Принц крови Чангамире Домбо вырвался из двора Мвенемутапы и силой оружия захватил древний центр Бутуа. Его воины, называющие себя Розви, «разрушителями», смели как ослабевшие гарнизоны старого королевства, так и португальских празейрос, разбогатевших на торговле с Замбези. В битве при Маунгве силы Домбо уничтожили объединенную армию Португалии и Мутапы, доказав, что военная мощь Шона не должна зависеть от иностранного огнестрельного оружия.\n\nДомбо правит из Ками, недалеко от руин самого Великого Зимбабве, и его государство Розви угрожает полностью затмить Мутапу. Однако его успех также демонстрирует, чего может достичь военная дисциплина Шона, освободившись от португальских манипуляций. Вопрос в том, направить ли дух Розви на постоянную военную реформу или использовать этот кризис для консолидации политической власти." #NT!
 nd_mtp.2.a: "Встаньте на путь воинов Розви." #NT!
 nd_mtp.2.b: "Объедините королевство, пока не прошла буря." #NT!
 nd_mtp.3.t: "Португальское вторжение" #NT!
 nd_mtp.3.d: "В 1561 году португальский иезуит по имени Гонсалу да Силвейра обратил Мвенемутапа Ногомо в христианство, но несколько дней спустя был задушен собственной королевской гвардией по настоянию мусульманских купцов, опасавшихся португальской монополии. Лиссабон использовал мученическую смерть как предлог для полномасштабного военного вторжения. В 1569 году Франсиско Баррето повел тысячу солдат вверх по Замбези, стремясь захватить золотые прииски внутри страны.\n\nОни так и не достигли их. Малярия, дизентерия и явная враждебность местности поглотили силы Баррето. Выжившие вернулись к побережью, и португальцы выместили свое недовольство на торговцах-суахили, до которых им удалось добраться, убив их в Сене и Тете. Мвенемутапа наблюдал, взимал свой пятидесятипроцентный тариф с выживших и взимал дань с каждого нового португальского капитана, осмелившегося вступить в должность в Мозамбике.\n\nВторжение провалилось, но иностранцы остались. Как мы реагируем?" #NT!
 nd_mtp.3.a: "Укрепите плато. Пусть сама земля будет нашим щитом." #NT!
 nd_mtp.3.b: "Торгуйте с ними на наших условиях. Золото покупает больше, чем кровь." #NT!
 nd_mtp.4.t: "Великий корпус" #NT!
 nd_mtp.4.d: "Стены Великого Зимбабве до сих пор стоят из гранита без строительного раствора, подогнанного так точно, что между камнями не может пройти даже лезвие. Великое ограждение, крупнейшее древнее сооружение в Африке к югу от Сахары, возвышается на одиннадцать метров и простирается на двести пятьдесят метров вокруг, окружая коническую башню, где зернохранилище Мвенемутапы провозглашало свою щедрость по отношению к своему народу.\n\nЭто не просто руины. Они являются свидетельством того, чего цивилизация Шона достигла без строительного раствора, без иностранных архитекторов, без каких-либо технологий, которые не были рождены на этом плато. Дзимба-дземабве, каменные дома, — это наша декларация того, что здесь возникла великая цивилизация, построенная нашими руками, поддержанная нашим трудом и благословленная Мвари." #NT!
 nd_mtp.4.a: "Камни говорят сами за себя." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_rozvi_warriors: "Розви Воины" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_rozvi_warriors: "Воинская традиция Чангамире Домбо, «разрушители», изгнавшие португальцев из внутренних районов страны." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_rozvi_consolidation: "Розви Консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_rozvi_consolidation: "Политическая стабильность, которая последовала за воссоединением Чангамире Домбо центральной части Шоны." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_fortress_of_sovereignty: "Крепость Суверенитета" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_fortress_of_sovereignty: "Само плато защищает королевство, его болезни, расстояния и враждебная местность побеждают захватчиков, чего не могут сделать копья Шона." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_controlled_trade: "Контролируемая коммерция" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_controlled_trade: "Мвенемутапа диктует условия торговли, взимая пошлины с каждого торговца, въезжающего в королевство." #NT!
 nd_mtp_great_enclosure_tradition: "Джимба Дземабве" #NT!
 nd_mtp_great_enclosure_tradition_desc: "Гранитная архитектура Великого Зимбабве без раствора, уникальная строительная традиция в Африке к югу от Сахары." #NT!
 nd_mtp_njanja_iron_smelting: "Выплавка чугуна в Ньяндже" #NT!
 nd_mtp_njanja_iron_smelting_desc: "Технология печи с принудительной тягой клана Ньянджа, позволяющая производить высококачественные железные инструменты и оружие." #NT!
 nd_mtp_pfumo_tradition: "Королевские копейщики Пфумо" #NT!
 nd_mtp_pfumo_tradition_desc: "Элитная пехота, вооруженная копьями пфумо и большими щитами из воловьей кожи, составляет основу армий Мутапа." #NT!
 nd_mtp_mwari_cult: "Культ Мвари" #NT!
 nd_mtp_mwari_cult_desc: "Поклонение Мвари, верховному божеству дождя и плодородия, чьи оракулы на холмах Матобо определяют политические и сельскохозяйственные решения." #NT!
 nd_mtp_alluvial_gold_tradition: "Промывка аллювиального золота" #NT!
 nd_mtp_alluvial_gold_tradition_desc: "Сезонная добыча золота в руслах рек, семьи промывают золото после сбора урожая, питая торговый путь Софалы." #NT!
 nd_mtp_cattle_wealth: "Крупный рогатый скот плато" #NT!
 nd_mtp_cattle_wealth_desc: "Домашний скот как основа социальной иерархии шона, крупный рогатый скот — это богатство, статус и валюта выкупа за невесту." #NT!
 nd_mtp_plateau_trade_routes: "Торговые пути плато" #NT!
 nd_mtp_plateau_trade_routes_desc: "Древние торговые пути, соединяющие плато Зимбабве с побережьем Суахили, по которым везут золото, слоновую кость и железо." #NT!
 nd_mtp_provincial_governors: "Губернаторы провинций" #NT!
 nd_mtp_provincial_governors_desc: "Смелая судебная система, провинциальные судьи и губернаторы, которые вершат закон и собирают дань от имени Мвенемутапа." #NT!
 nd_mtp_sofala_trade_network: "Торговая сеть Софала" #NT!
 nd_mtp_sofala_trade_network_desc: "Регулируемый обмен золота на ткань, стеклянные бусы и другие товары через суахилиский порт Софала.\n\n#italic Доступно в: $nd_mtp_feira$#!" #NT!
 nd_mtp_nhare_scouts_tradition: "Скауты Нхаре" #NT!
 nd_mtp_nhare_scouts_tradition_desc: "Быстрые разведывательные отряды, названные в честь канн, мастеров засад и быстрого преследования по плато." #NT!
 nd_mtp_ivory_cotton_export: "Экспорт слоновой кости и хлопка" #NT!
 nd_mtp_ivory_cotton_export_desc: "Два великих предмета экспорта королевства Мутапа, помимо золота, резной слоновой кости и хлопчатобумажной ткани.\n\n#italic Доступно в: $nd_mtp_feira$#!" #NT!
 nd_mtp_royal_court: "Суд Мвенемутапы" #NT!
 nd_mtp_royal_court_desc: "Подробный церемониальный протокол суда Мвенемутапы, где вожди провинций платят дань, а иностранцы подают ходатайства о торговых правах." #NT!
 nd_mtp_masonry_renaissance: "Традиция каменной кладки" #NT!
 nd_mtp_masonry_renaissance_desc: "Продолжаем совершенствовать методы строительства из безрастворного гранита, унаследованные от Великого Зимбабве.\n\n#italic Доступно в: $nd_mtp_njanja_forge$#!" #NT!
 nd_mtp_portuguese_contact: "Португальский контакт" #NT!
 nd_mtp_portuguese_contact_desc: "Дипломатическое взаимодействие с португальцами, прибывшими в Софалу в 1505 году с целью монополизировать торговлю золотом." #NT!
 nd_mtp_muzinda_garrisons: "Гарнизоны Музинды" #NT!
 nd_mtp_muzinda_garrisons_desc: "В каждом провинциальном центре Музинды размещены постоянные гарнизонные силы, обученные ведению оборонительной войны." #NT!
 nd_mtp_gold_taxation: "Налогообложение золота" #NT!
 nd_mtp_gold_taxation_desc: "Пятипроцентный тариф Мвенемутапы на все торговые товары, ввозимые в королевство, — смелое утверждение финансового суверенитета.\n\n#italic Доступно в: $nd_mtp_gold_works$#!" #NT!
 nd_mtp_feira_markets: "Рыночная система Фейры" #NT!
 nd_mtp_feira_markets_desc: "Регулируемые торговые посты, где под надзором Мвенемутапы обмениваются золотом, слоновой костью и тканью." #NT!
 nd_mtp_oracular_network: "Оракулярная сеть" #NT!
 nd_mtp_oracular_network_desc: "Сеть жрецов и духов-медиумов культа Мвари, служащая одновременно религиозным авторитетом и политическим интеллектом.\n\n#italic Доступно в: $nd_mtp_mwari_shrine$#!" #NT!
 nd_mtp_shaft_mining: "Шахтное добыча" #NT!
 nd_mtp_shaft_mining_desc: "Более глубокие методы добычи, выходящие за рамки поверхностного промывания, позволяют исследовать подземные золотоносные рифовые месторождения." #NT!
 nd_mtp_changamire_revolt: "Восстание Чангамира" #NT!
 nd_mtp_changamire_revolt_desc: "Откол Чангамире Домбо и его воинов Розви, изгнавших португальцев и установивших новый военный порядок." #NT!
 nd_mtp_portuguese_resistance: "Португальское сопротивление" #NT!
 nd_mtp_portuguese_resistance_desc: "Успешная защита от вторжения Баррето в 1569 году, болезней, местности и решимости Шоны нанесла поражение европейскому оружию." #NT!
 nd_mtp_cattle_festival: "Большой фестиваль крупного рогатого скота" #NT!
 nd_mtp_cattle_festival_desc: "Массовые церемониальные собрания, на которых Мвенемутапа раздает зерно и скот, скрепляя королевство щедростью." #NT!
 nd_mtp_cloth_currency: "Валюта ткани Мачира" #NT!
 nd_mtp_cloth_currency_desc: "Стандартизированная хлопчатобумажная ткань, используемая в качестве средства обмена по всему королевству и его торговым сетям.\n\n#italic Доступно в: $nd_mtp_feira$#!" #NT!
 nd_mtp_zambezi_corridor: "Торговый коридор Замбези" #NT!
 nd_mtp_zambezi_corridor_desc: "Маршрут реки Сена-Тете как торговая артерия, соединяющая внутреннее плато с прибрежными портами.\n\n#italic Доступно в: $nd_mtp_zambezi_wharf$#!" #NT!
 nd_mtp_mass_mobilization: "Провинциальная мобилизация" #NT!
 nd_mtp_mass_mobilization_desc: "Способность Мвенемутапы собрать 300 000 человек из провинций - система мобилизации, способная конкурировать с любой современной африканской державой." #NT!
 nd_mtp_rozvi_ascendancy: "Возвышение Розви" #NT!
 nd_mtp_rozvi_ascendancy_desc: "Военные реформы династии Чангамире, в результате которых была создана дисциплинированная пехота, способная победить европейские вооруженные силы." #NT!
 nd_mtp_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_mtp_firearms_adoption_desc: "Войска шона, вооруженные мушкетами, приобретенными португальцами, интегрируют огнестрельное оружие в традиционную тактику боя." #NT!
 nd_mtp_matopos_center: "Духовный центр Матопос" #NT!
 nd_mtp_matopos_center_desc: "Холмы Матобо — непреходящая резиденция культа Мвари, священный ландшафт с пещерами, наскальными рисунками и святилищами оракулов." #NT!
 nd_mtp_ivory_expansion: "Расширение торговли слоновой костью" #NT!
 nd_mtp_ivory_expansion_desc: "Промышленная обработка слоновой кости и экспорт на рынки Европы и Индийского океана." #NT!
 nd_mtp_khami_tradition: "Хами Архитектура" #NT!
 nd_mtp_khami_tradition_desc: "Отличительный стиль стен Хами, столицы Розви: ряды из декоративного камня, построенные на платформах из натурального гранита." #NT!
 nd_mtp_gold_monopoly: "Монополия на экспорт золота" #NT!
 nd_mtp_gold_monopoly_desc: "Королевский контроль над всем золотом, покидающим королевство, никакая торговая торговля без разрешения Мвенемутапы." #NT!
 nd_mtp_cultural_resilience: "Культурная устойчивость Шоны" #NT!
 nd_mtp_cultural_resilience_desc: "Сохранение идентичности шона благодаря вторжениям нгуни, вмешательству Португалии и колониальному давлению." #NT!
 nd_mtp_modern_governance: "Современное управление" #NT!
 nd_mtp_modern_governance_desc: "Централизованная административная реформа новой эпохи, адаптирующая систему действий к современным государственным требованиям." #NT!
 nd_mtp_anti_colonial_resistance: "Антиколониальное сопротивление" #NT!
 nd_mtp_anti_colonial_resistance_desc: "Организованная военная оппозиция иностранному господству, опирающаяся на многовековые военные традиции Шона." #NT!
 nd_mtp_mineral_sovereignty: "Минеральный суверенитет" #NT!
 nd_mtp_mineral_sovereignty_desc: "Утверждение национального контроля над золотыми, медными и железными богатствами плато Зимбабве." #NT!
 nd_mtp_chimurenga_spirit: "Дух Чимуренги" #NT!
 nd_mtp_chimurenga_spirit_desc: "Непреходящая традиция шона вооруженного сопротивления угнетению, чимуренга означает «революционная борьба»." #NT!
 nd_mtp_pan_shona_unity: "Пан-Шона Единство" #NT!
 nd_mtp_pan_shona_unity_desc: "Культурная консолидация народов Каланга, Корекоре, Зезуру, Маньика и Ндау под общей идентичностью Шона." #NT!
 a_nd_mtp_pfumo_spearmen: "Пфумо Копейщики" #NT!
 a_nd_mtp_pfumo_spearmen_desc: "Элитная пехота Шона, вооруженная копьями пфумо и большими щитами из воловьей кожи. Эти королевские войска составляют дисциплинированное ядро ​​армий Мутапа, обученных в сомкнутых оборонительных построениях." #NT!
 a_nd_mtp_nhare_scouts: "Скауты Нхаре" #NT!
 a_nd_mtp_nhare_scouts_desc: "Быстрые разведывательные отряды названы в честь канны. Мастера засад и быстрого преследования, они прикрывают продвижение армии и преследуют отступающих врагов по плато." #NT!
 a_nd_mtp_muzinda_garrison: "Музинда Гаррисон" #NT!
 a_nd_mtp_muzinda_garrison_desc: "Войска провинциальных крепостей набраны из административных мест музинды. Обученные оборонительной войне и сопротивлению осадам, они удерживают каменные стены королевства." #NT!
 a_nd_mtp_rozvi_warriors: "Розви Воины" #NT!
 a_nd_mtp_rozvi_warriors_desc: "Ударная пехота династии Чангамире. Розви, «разрушители», — агрессивные наступательные войска, доказавшие в битве при Маунгве, что оружие шона может победить португальские мушкеты." #NT!
 a_nd_mtp_musketmen: "Мутапа-мушкетеры" #NT!
 a_nd_mtp_musketmen_desc: "Солдаты шона, вооруженные огнестрельным оружием, приобретенным португальцами. Эти войска сочетают в себе европейские технологии вооружения и боевую дисциплину Мутапа." #NT!
 nd_mtp_dzimba: "Джимба Дземабве" #NT!
 nd_mtp_dzimba_desc: "Величественные каменные ограды в традициях Зимбабве, гранитные стены, изготовленные без строительного раствора, установлены с такой точностью, что между камнями не может пройти лезвие. Они служат королевскими дворами, зернохранилищами и символами цивилизации Шона." #NT!
 nd_mtp_dzimba_upkeep: "Уход за каменным вольером" #NT!
 nd_mtp_dzimba_upkeep_desc: "Сохранение безрастворных гранитных стен и расширение огороженного комплекса." #NT!
 nd_mtp_dare: "Дэйр Корт" #NT!
 nd_mtp_dare_desc: "Королевский судебный суд, в котором губернаторы провинций отправляют правосудие, собирают дань и поддерживают власть Мвенемутапы над округами королевства." #NT!
 nd_mtp_dare_upkeep: "Содержание суда" #NT!
 nd_mtp_dare_upkeep_desc: "Сохранение провинциального суда и его административных функций." #NT!
 nd_mtp_njanja_forge: "Ньянджа Фордж" #NT!
 nd_mtp_njanja_forge_desc: "Передовой шонский чугунолитейный завод. Клан Ньянджа строит батареи печей с принудительной тягой, каждая из которых имеет парные сильфоны и задние фурмы, производящие железо исключительного качества для инструментов и оружия." #NT!
 nd_mtp_forge_upkeep: "Выплавка железа" #NT!
 nd_mtp_forge_upkeep_desc: "Печи Ньянджи плавили железную руду с использованием древесного угля, производя инструменты исключительного качества." #NT!
 nd_mtp_mwari_shrine: "Храм Мвари" #NT!
 nd_mtp_mwari_shrine_desc: "Священное место-пророчество, посвященное Мвари, верховному божеству дождя, плодородия и урожая. Жрецы интерпретируют голос Мвари по эху пещеры и произносят благословения или проклятия на земле." #NT!
 nd_mtp_mwari_upkeep: "Подношения святыни" #NT!
 nd_mtp_mwari_upkeep_desc: "Ритуальные подношения скота и церемониальное обслуживание священных пещерных святилищ." #NT!
 nd_mtp_feira: "Торговый пост Фейра" #NT!
 nd_mtp_feira_desc: "Регулируемый торговый рынок, где золотая пыль с плато встречается с тканью, стеклянными бусинами и фарфором из Индийского океана. Агенты Мвенемутапы контролируют каждый обмен." #NT!
 nd_mtp_feira_upkeep: "Содержание торгового поста" #NT!
 nd_mtp_feira_upkeep_desc: "Поддержание помещений рынка фейра и хранения товаров." #NT!
 nd_mtp_gold_works: "Россыпное золото" #NT!
 nd_mtp_gold_works_desc: "Организованы работы по добыче и промыванию золота по берегам рек. Семьи добывают золото из россыпных месторождений после сезона сбора урожая, питая экспортную экономику королевства." #NT!
 nd_mtp_gold_works_upkeep: "Промывка золота" #NT!
 nd_mtp_gold_works_upkeep_desc: "Семьи промывают золото в руслах рек, используя деревянные шлюзы и люльки, извлекая россыпное золото из отложений." #NT!
 nd_mtp_ivory_processing: "Подготовка слоновой кости" #NT!
 nd_mtp_ivory_processing_desc: "Обработка и резьба из слоновой кости для экспорта в торговую сеть Индийского океана." #NT!
 nd_mtp_cotton_weaving: "Хлопковое Ткачество" #NT!
 nd_mtp_cotton_weaving_desc: "Производство хлопкового текстиля Шона, создающее особую ткань, используемую как в качестве валюты, так и в качестве торгового товара." #NT!
 levy_nd_mtp_rozvi_warriors: "Розви Леви" #NT!
 levy_nd_mtp_rozvi_warriors_desc: "Наборы воинов Розви, основанные на боевых традициях династии Чангамире." #NT!
 levy_nd_mtp_pfumo_spearmen: "Пфумо Леви" #NT!
 levy_nd_mtp_pfumo_spearmen_desc: "Копейщики, набранные из крестьян Шона, вооруженные пфумо и щитом из воловьей кожи." #NT!
 nd_mtp_cattle_herding: "Выпас скота" #NT!
 nd_mtp_cattle_herding_desc: "Крупный рогатый скот, управляющий огромными стадами пастбищ Гуруусва, является мерилом богатства общества Шона." #NT!
 nd_mtp_gold_preparation: "Подготовка золота" #NT!
 nd_mtp_gold_preparation_desc: "Очистка, взвешивание и упаковка золотого песка с помощью прецизионных инструментов для экспортной торговли Софалы." #NT!
 nd_mtp_machira_production: "Производство тканей Мачира" #NT!
 nd_mtp_machira_production_desc: "Стандартизированное производство хлопчатобумажных тканей для использования в качестве валюты по всему королевству." #NT!
 nd_mtp_zambezi_transport: "Речной транспорт Замбези" #NT!
 nd_mtp_zambezi_transport_desc: "Перевозка товаров на каноэ по Замбези, соединяющая внутренние районы страны с прибрежными портами." #NT!
 nd_mtp_shrine_ceremonies: "Храмовые церемонии" #NT!
 nd_mtp_shrine_ceremonies_desc: "Ритуальные подношения и церемонии в пророческих святилищах Мвари, домашний скот и благовония в честь верховного божества." #NT!
 nd_mtp_granite_quarrying: "Добыча гранита" #NT!
 nd_mtp_granite_quarrying_desc: "Извлечение и придание формы гранитным блокам в обтесанную кладку для каменных ограждений без раствора в соответствии с традициями Зимбабве." #NT!
 nd_mtp_kraal_stockade: "Крааль частокол" #NT!
 nd_mtp_kraal_stockade_desc: "Укреплённый скотный двор, служащий опорным пунктом обороны провинции. Толстый деревянный частокол служит укрытием для скота и служит местом сбора местной милиции против захватчиков." #NT!
 nd_mtp_kraal_upkeep: "Содержание частокола" #NT!
 nd_mtp_kraal_upkeep_desc: "Уход за древесиной для защиты частокола крааля." #NT!
 nd_mtp_zambezi_wharf: "Замбези Уорф" #NT!
 nd_mtp_zambezi_wharf_desc: "Речной торговый пост вдоль коридора Замбези, облегчающий перемещение золота, слоновой кости и импортных товаров между плато и побережьем." #NT!
 nd_mtp_wharf_upkeep: "Содержание пристани" #NT!
 nd_mtp_wharf_upkeep_desc: "Содержание речной пристани и флота каноэ." #NT!
 nd_mtp_formed_tt: "Образовалась империя Мутапа." #NT!
 nd_mtp_path_a_tt: "Выбрал золото Софалы" #NT!
 nd_mtp_path_b_tt: "Выбрал Голос Мвари" #NT!
 nd_mtp_destiny: "Судьба Мутапы" #NT!
 nd_mtp_destiny_desc: "Прозвучали барабаны построения, и Мвенемутапа снова восседает на троне. Теперь королевству предстоит доказать, что оно достойно наследия своих предков. Достигните стабильности, и путь вперед откроется сам собой." #NT!
 nd_mtp_dest_kilwa_trade: "Связь с Килвой" #NT!
 nd_mtp_dest_kilwa_trade_desc: "Килва-Кисивани — жемчужина побережья Суахили, крупнейший торговый город к югу от Момбасы. Контролировать его — значит держать ключ к торговле золотом в Индийском океане. Захватите Килву и накопите богатство, чтобы доказать коммерческую мощь Мутапы." #NT!
 nd_mtp_dest_zanzibar_reach: "Занзибар и Замбези" #NT!
 nd_mtp_dest_zanzibar_reach_desc: "После обеспечения безопасности Килвы торговая сеть должна распространиться как на север до Занзибара, так и вглубь страны через коридор Замбези. Контролируйте эти маршруты и накапливайте богатство, чтобы стать бесспорной коммерческой силой юго-восточной Африки." #NT!
 nd_mtp_dest_indian_ocean: "Торговый центр Юга" #NT!
 nd_mtp_dest_indian_ocean_desc: "Последний шаг: Момбаса, великий северный порт, должен попасть под влияние Мутапы. С фарфором, проходящим через ваши рынки, и золотом в вашей сокровищнице, вы построите торговую империю, простирающуюся от плато до Индийского океана." #NT!
 nd_mtp_dest_southern_march: "Южный марш" #NT!
 nd_mtp_dest_southern_march_desc: "Земли к югу от Лимпопо, высокогорья Свази и территории Тсвана уже давно находятся за пределами досягаемости Мутапы. Сильная армия может изменить это. Идите на юг, захватите Мапулану и Бакгатлу и установите границы великой империи Шона." #NT!
 nd_mtp_dest_highveld_conquest: "Завоевание Хайвельда" #NT!
 nd_mtp_dest_highveld_conquest_desc: "Продвигайтесь глубже в южные интерьеры. Здесь ждут скотные угодья Квененг и золотоносные поля Лейвелепутсвы. Развивайте завоеванную территорию и поддерживайте мощную армию, чтобы удержать захваченное." #NT!
 nd_mtp_dest_imperium: "Империум Плато" #NT!
 nd_mtp_dest_imperium_desc: "Конечная цель: расширить владения Шоны до западной границы пустыни в Дамаре. Обладая огромной армией, высоким престижем и развитой империей, Мвенемутапа будет править величайшим государством, которое когда-либо видела Южная Африка." #NT!
 nd_mtp.5.t: "Мутапа восстановлен" #NT!
 nd_mtp.5.d: "Каменные стены наших предков обновлены, и провинции снова подчиняются некоему Мвенемутапе. Королевство, построившее Великий Зимбабве, снова возродилось, но подъем – это только начало. Мир наблюдает, чтобы увидеть, кем мы станем.\n\nВыйдем ли мы наружу, к океанским путям, которые несут золото в далекие страны? Или мы направим силу наших копий на народы за пределами наших границ, построив империю, которая затмевает все, что могли себе представить наши предки? Выбор сделан. Теперь идет работа." #NT!
 nd_mtp.5.a: "Работа начинается." #NT!
 nd_mtp.6.t: "Золото для торговцев Килвы" #NT!
 nd_mtp.6.d: "Килва Кисивани, островной город из кораллового камня и золота, уже давно стал воротами, через которые богатство внутренних районов достигает мира. На протяжении веков купцы-суахили везли золото Мутапы на север через гавани Килвы в Аравию, Индию и за ее пределы. Теперь эти ворота наши.\n\nПоскольку Килва находится под контролем Мутапы, посредники стали нашими подданными. Золотая пыль больше не переходит из рук в руки трижды, прежде чем попасть на корабль; она течет прямо от шахт плато к дау Индийского океана. Прибыли, которые когда-то обогащали султанов Суахили, теперь наполняют казну Мвенемутапы." #NT!
 nd_mtp.6.a: "Теперь золото течет на наших условиях." #NT!
 nd_mtp.7.t: "Мастера Восточного побережья" #NT!
 nd_mtp.7.d: "От Келимане в дельте Замбези до острова специй Занзибар, восточное побережье Африки соответствует Мвенемутапе. Торговые города суахили, когда-то независимые, теперь действуют в коммерческой сфере, в которой доминируют мутапы. Корабли из Гуджарата, Омана и Малабарского побережья заходят в порты, где чиновники Шоны собирают пошлины.\n\nТакая беспрецедентная морская протяженность поднимает вопрос: сотрудничаем ли мы с устоявшимся торговым классом суахили, используя их многовековой опыт в Индийском океане? Или мы навязываем монополию Мутапы напрямую, гарантируя, что каждая раковина прибыли от каури поступает в королевскую казну?" #NT!
 nd_mtp.7.a: "Сотрудничайте с торговцами суахили." #NT!
 nd_mtp.7.b: "Мвенемутапа забирает свою законную долю." #NT!
 nd_mtp.8.t: "Золотая Арка" #NT!
 nd_mtp.8.d: "Золотая дуга завершается от глубоких шахт плато Зимбабве, через речные коридоры и прибрежные порты до великой гавани Момбасы. Мутапа достиг того, чего не достигло ни одно африканское государство к югу от Египта: торговая империя, простирающаяся от внутренних районов континента до Индийского океана.\n\nФарфор из Китая украшает стол Мвенемутапы. Шелк из Гуджарата украшает его двор. За все это платит золото сотен рудников. Вопрос теперь в том, как сохранить это богатство из поколения в поколение. Инвестируем ли мы в торговую инфраструктуру, которая сделала это возможным, создавая постоянную коммерческую машину? Или мы используем это богатство, чтобы превратить сам двор в центр обучения и космополитической культуры?" #NT!
 nd_mtp.8.a: "Постройте золотую дугу, которая будет длиться вечно." #NT!
 nd_mtp.8.b: "Пусть богатство преобразует нашу цивилизацию." #NT!
 nd_mtp.9.t: "Спирс к югу от Лимпопо" #NT!
 nd_mtp.9.d: "Армии Мвенемутапы пересекли Лимпопо и двинулись в земли за ее пределами, на территории, которые никогда не были частью старого королевства Мутапа. Горные районы Свази и вожди Тсвана пали под ударами копий Шона, и новые губернаторы провинций занимают свои места в завоеванных музиндах.\n\nЭто что-то новое. Старое королевство Мутапа было плато, ограниченным гранитными вершинами и золотоносными реками Зимбабве. Теперь мы становимся чем-то большим, империей, поглощающей народы, не говорящие на языке шона, не поклоняющиеся мвари, имеющие свои собственные традиции управления. Задача управления ими только началась." #NT!
 nd_mtp.9.a: "Граница продвигается." #NT!
 nd_mtp.10.t: "Лорды Хайвельда" #NT!
 nd_mtp.10.d: "Великие луга внутренних районов, Хайвельд, принадлежат нам. От богатых скотом равнин Квененга до золотоносных полей Лейвелепутсвы, владения Мутапы теперь простираются далеко за пределы всего, что могли себе представить основатели Великого Зимбабве. Развитие этих завоеванных территорий началось всерьез.\n\nНо управление отдаленными провинциями требует выбора. Размещаем ли мы гарнизонные поселения солдат Шоны на каждой завоеванной территории, создавая постоянные военные колонии, которые будут удерживать границу? Или мы собираем дань с существующих местных вождей, управляя через подчиненных, знающих землю?" #NT!
 nd_mtp.10.a: "Размещайте гарнизоны на завоеванных землях." #NT!
 nd_mtp.10.b: "Правило через дань и местную власть." #NT!
 nd_mtp.11.t: "Империум исполнен" #NT!
 nd_mtp.11.d: "От побережья Индийского океана до границ пустыни, от Замбези до Хайвельда, Мвенемутапа правит империей, более обширной, чем любая другая, возникшая на юге Африки. На местах сбора столичных армий, которые заставили бы передохнуть любую европейскую колониальную державу. Престиж династии Шона эхом разносится по всему континенту.\n\nЭто момент выбора, который определяет все империи в их зените. Придерживаемся ли мы традиции короля-воина, наследия Чангамира в виде военной мощи, которая сохраняет целостность империи силой оружия? Или мы инвестируем в вечные камни, в строительные традиции, пережившие все династии, в памятники, которые будут говорить о цивилизации Шона еще долго после того, как армии обратятся в прах?" #NT!
 nd_mtp.11.a: "Мы — короли-воины." #NT!
 nd_mtp.11.b: "Камни будут говорить за нас." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_swahili_partnership: "Суахили Партнерство" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_swahili_partnership: "Партнерство с признанным торговым классом суахили, использование их опыта в Индийском океане для расширения коммерческого охвата Мутапы." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_monopoly_trade: "Торговая монополия Мутапы" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_monopoly_trade: "Прямая монополия Мвенемутапы на прибрежную торговлю, поддерживаемая военно-морскими патрулями и портовыми чиновниками." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_golden_arc: "Золотая Арка" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_golden_arc: "Полный торговый путь от шахт на плато до портов Индийского океана, создающий богатство, которое дает Мутапе непревзойденную силу на переговорах." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_cosmopolitan_court: "Космополитический суд" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_cosmopolitan_court: "Двор, обогащенный торговлей в Индийском океане, привлекающий иностранных ремесленников, ученых и солдат на службу Мвенемутапе." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_settler_garrisons: "Поселенческие гарнизоны" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_settler_garrisons: "Военные колонии Шона располагались на завоеванных территориях, удерживая границу посредством постоянного вооруженного присутствия." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_tribute_provinces: "Дань провинциям" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_tribute_provinces: "Завоеванные территории управляются местными вождями, которые платят дань Мвенемутапе, сохраняя существующие структуры под властью Шона." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_warrior_kings: "Короли-воины" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_warrior_kings: "Традиция военного превосходства Чангамира, империя, скрепленная мечом, и личное военное мастерство Мвенемутапы." #NT!
 STATIC_MODIFIER_NAME_nd_mtp_dest_eternal_stones: "Вечные камни" #NT!
 STATIC_MODIFIER_DESC_nd_mtp_dest_eternal_stones: "Строительная традиция Великого Зимбабве жива, каменные памятники переживают династии и провозглашают цивилизацию Шона на века." #NT!
 nd_mtp_indian_ocean_emporium: "Торговый центр Индийского океана" #NT!
 nd_mtp_indian_ocean_emporium_desc: "Вершина коммерческих амбиций Мутапы, крупный торговый дом, где товары из Китая, Индии, Аравии и внутренних районов Африки сходятся под властью Мвенемутапы." #NT!
 nd_mtp_emporium_upkeep: "Обслуживание торгового центра" #NT!
 nd_mtp_emporium_upkeep_desc: "Поддержание торговой инфраструктуры и складских помещений торгово-развлекательного центра Индийского океана." #NT!
 nd_mtp_royal_mustering_ground: "Королевский сборный полигон" #NT!
 nd_mtp_royal_mustering_ground_desc: "Центральный плац, где Мвенемутапа проводит смотр своих армий. Воины Розви, копейщики Пфумо и мушкетеры тренируются бок о бок под королевским знаменем." #NT!
 nd_mtp_mustering_upkeep: "Сбор наземного обслуживания" #NT!
 nd_mtp_mustering_upkeep_desc: "Поддержание плацев, оружейных и тренировочных баз королевского сбора." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 mhondoro_oracle_bureaucracy: "Сеть оракулов Мхондоро" #NT!
 mhondoro_oracle_bureaucracy_desc: "Мхондоро были духами-медиумами королевских предков, которыми обладал умерший Мвене Мутапас, чтобы говорить через живых свикиро. Из великих святилищ Матонжени и Матопоса пророческие пророчества узаконивали указы короля, устанавливали календари вызывания дождя и подтверждали преемственность. Этот институт связывал монархию с параллельной священной администрацией; Вожди линий, пытавшиеся посоветоваться со своими предками, обнаружили, что королевский мхондоро говорит громче." #NT!
  
 kuronzera_clientship_bureaucracy: "Клиентство крупного рогатого скота Куронзера" #NT!
 kuronzera_clientship_bureaucracy_desc: "В соответствии с системой куронзера Мвене Мутапа ссужал королевский скот простолюдинам и меньшим вождям, которые взамен получали труд, военную службу и долю телят. Стада пронизывали королевство тысячами личных уз, идущих прямо к трону, минуя наследственную власть рода. Засуха, чума крупного рогатого скота или королевская жадность могут в одночасье разрушить сеть, отбросив клиентов обратно к их бывшим руководителям." #NT!
  
 curva_tribute_bureaucracy: "Ежегодная дань Curva" #NT!
 curva_tribute_bureaucracy_desc: "Каждый год Мвене Мутапа проводил курву — церемонию, на которой вассальные вожди и их вожди приносили слоновую кость, золото, мотыги и ткань, чтобы возобновить свою клятву подчинения. Португальский летописец Жоау душ Сантуш описал этот обряд в 1609 году как центральное событие имперского календаря: отсутствие на курве рассматривалось как восстание. Король перераспределил подарки, чтобы вернуть вождей в иерархию, но бремя дани легло тяжелее всего на земледельцев, стоящих ниже них." #NT!
  
 mukomohasha_captaincy_bureaucracy: "Мукомохаша Капитанство" #NT!
 mukomohasha_captaincy_bureaucracy_desc: "Мукомохаша был верховным капитаном армий Мвене Мутапы, должность, занимаемая по назначению, а не по наследству, и отличалась от великих вождей линий передачи. Португальские источники конца шестнадцатого века описывают, как он ехал во главе королевского войска с подчиненными ему капитанами, собранными со всего королевства. Капитанство дало трону постоянную военную силу, независимую от краалей и земледельцев, снабжавших марширующую колонну продовольствием." #NT!
  
 AUTO_MODIFIER_NAME_nd_mtp_bureaucracy_authority: "Офис Мвене Мутапы" #NT!
 AUTO_MODIFIER_DESC_nd_mtp_bureaucracy_authority: "При формировании двор в Звонгомбе формализует свой административный аппарат, кодифицируя должности, окружающие великого короля, и открывая постоянные институциональные каналы, через которые осуществляется управление королевством." #NT!
