l_russian:
  
 # ===== STATIC MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_drr_loya_jirga: "Лойя джирга Кандагара" #NT!
 STATIC_MODIFIER_DESC_nd_drr_loya_jirga: "Великое собрание пуштунских вождей связало племена клятвой. Рабочая сила течет из каждой долины Абдали, Гильджи и Таджикистана, а знамя нового шаха чтится от Герата до Хайбера." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_sword_of_khorasan: "Меч Хорасана" #NT!
 STATIC_MODIFIER_DESC_nd_drr_sword_of_khorasan: "Армия шаха марширует в традициях Надира, спускаясь с афганского нагорья в сторону Персии и Индостана. Империя строится саблей за саблей, каждая кампания оплачивается грабежом." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_panipat_press: "После Панипата" #NT!
 STATIC_MODIFIER_DESC_nd_drr_panipat_press: "Маратхи разбиты на поле Панипат. Шах приказывает продолжить кампанию до того, как хиндустанские принцы смогут сплотиться." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_panipat_consolidate: "Дань Панипату" #NT!
 STATIC_MODIFIER_DESC_nd_drr_panipat_consolidate: "Армия возвращается в Кандагар с Кох-и-Нуром и годом грабежа. Империя обращается к управлению, интегрируя побежденных в царство шаха." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_pass_tribute: "Дань Рахдари" #NT!
 STATIC_MODIFIER_DESC_nd_drr_pass_tribute: "Каждый караван, проходящий через Хайбер и Болан, платит пошлину монетами. Царская казна растет благодаря великой торговле между Персией, Тураном и Индостаном." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_pass_free_passage: "Открытые пропуска" #NT!
 STATIC_MODIFIER_DESC_nd_drr_pass_free_passage: "Караваны свободно передвигаются по имперским дорогам, платя лишь скромные пошлины. Бухарские и индийские купцы стекаются на афганские рынки, а базары Кабула и Пешавара разрастаются." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_unity: "Накшбандийское единство" #NT!
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_unity: "Шейхи Муджаддиди проповедуют обновленную ортодоксальность в ханаках Кабула и Пешавара. Суфийское руководство связывает соплеменника, крестьянина и горожанина единой конфессиональной целью." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_cosmopolitan: "Космополитический Тарикат" #NT!
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_cosmopolitan: "Суфийские ордена учат широкой терпимости, охватывая торговцев хиндки, соседей Кызылбаша и подданных сикхов. Мечеть, храм и гурдвара находятся под контролем шаха." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_sadozai_centralize: "Корона Садозай" #NT!
 STATIC_MODIFIER_DESC_nd_drr_sadozai_centralize: "Наследование определяется силой оружия. Дом Садозай централизует королевство, разрушая мятежные сардары и утверждая указ шаха от Герата до Лахора." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_sadozai_sardars: "Совет Сардаров" #NT!
 STATIC_MODIFIER_DESC_nd_drr_sadozai_sardars: "Правопреемство определяется консенсусом. Вожди племен утверждаются в своих землях и наборе рекрутов, а Империя продолжает существовать как федерация пуштунских лордов, верных первому среди равных." #NT!
  
 # ===== FORMATION EVENT ===== 
 nd_drr.1.t: "Лойя джирга в Кандагаре" #NT!
 nd_drr.1.d: "Октябрь 1747 года. Святилище Шер-э-Сурх возле Кандагара переполнено вождями всех пуштунских племен. Абдали, Гильджи, Юсуфзай, Моманд; кызылбашские капитаны, таджикская знать, купцы-хиндки. Надир-шах мертв, его армия рассеяна, а сокровища Персии вернулись домой в Афганистан в седельных сумках всадников Абдали, которые когда-то служили ему.\n\nВ течение девяти дней джирга спорила. У одних будет совет равных, у других — шах. Эту проблему решил мистик Сабир Шах Кабули: он кладет сноп пшеницы в тюрбан молодого полководца Абдали и провозглашает его падшахом. Отныне Абдали будут называть Дуррани, Жемчужиной Жемчуга.\n\nТеперь выбор падает за новое царство: будет ли это империя племен или империя меча?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_drr.1.a: "По единодушному мнению джирги, мы станем империей племен." #NT!
 nd_drr.1.b: "Под знаменем Ахмад Шаха мы победим от Мешхеда до Дели." #NT!
  
 # ===== ADVANCE EVENTS ===== 
  
 nd_drr.2.t: "Третья битва при Панипате" #NT!
 nd_drr.2.d: "14 января 1761 года. На пыльной равнине к северу от Дели вооруженная кавалерия шаха, его союзники-рохиллы и две тысячи поворотных верблюжьих шутарналов противостоят войску Конфедерации маратхов. К сумеркам шестьдесят тысяч врагов лежат мертвыми. Садашиврао Бхау убит; наследник пешвы убит; Продвижение маратхов к Инду прервано на целое поколение. Шах удерживает поле боя, но его афганские солдаты, которым не платят зарплату в течение двух лет, восстают и жаждут прохлады Кандагара." #NT!
 nd_drr.2.a: "Нажмите на преимущество; пусть хиндустанские принцы знают, кто правит севером." #NT!
 nd_drr.2.b: "Вернитесь в Кандагар с добычей; править тем, что мы уже выиграли." #NT!
  
 nd_drr.3.t: "Обычаи Хайбера" #NT!
 nd_drr.3.d: "Через наши перевалы проходит великая трансазиатская торговля. Бухарские караваны привозят прекрасных лошадей, ляпис-лязури и рабов; Индийские караваны привозят пряности, шелк и индиго; Персидские купцы привозят ковры и шафран. Офицеры Рахдара, дислоцированные у ворот Хайбера, Болана и Кабула, сообщают о росте дорожного движения. Вопрос в том, насколько высоким будет этот налог." #NT!
 nd_drr.3.a: "Облагайте налогом каждую загрузку. Казна должна быть наполнена." #NT!
 nd_drr.3.b: "Держите взносы легкими. Сама торговля обогащает империю." #NT!
  
 nd_drr.4.t: "Свет Муджаддиди" #NT!
 nd_drr.4.d: "Тарикат Накшбанди-Муджаддиди, обновленный шахом Валиуллой Дели и его афганскими учениками, распространился по ханакам Кабула, Пешавара и Кандагара. Ее шейхи проповедуют трезвую суннитскую ортодоксальность и дисциплину сердца. Их сочинения распространяются от Волги до Декана. Как империя примет их?" #NT!
 nd_drr.4.a: "Примите их ортодоксальность как конфессиональный стандарт империи." #NT!
 nd_drr.4.b: "Примите их широкий гуманизм; многие конфессии разделяют это царство." #NT!
  
 nd_drr.5.t: "После шаха" #NT!
 nd_drr.5.d: "Ахмад Шах мертв, а Тимур Шах после него. Сыновья династии соперничают в Кабуле, Пешаваре и Кандагаре; сардары Баракзаев и Попалзаев решают, какого принца поддержать. Сикхи активизируются в Пенджабе, персы давят на Мешхед, а границы Империи ослабевают. Выбор состоит в том, править ли короной или советом." #NT!
 nd_drr.5.a: "Раздавить сардаров; пусть трон диктует племенам." #NT!
 nd_drr.5.b: "Управляйте через сардаров; империя — это их федерация, а не королевская." #NT!
  
 nd_drr.6.t: "Пуштунвали" #NT!
 nd_drr.6.d: "Неписаный кодекс пуштунов появился еще до Империи и пережил каждую династию. Нанаватай, право на убежище; мелмастия, обязанность гостеприимства; бадал, обязанность мести; нанг, требование чести. Ни один кази не обеспечивает соблюдение этих законов, ни один шах не может отменить их, но каждый пуштун, от самого высокого сардара до самого низкого соплеменника, живет по ним. Мудрость шаха заключается в том, чтобы править согласно кодексу, а не против него." #NT!
 nd_drr.6.a: "То же будет и среди пуштунов." #NT!
  
 nd_drr.7.t: "Бала Хисар в Кабуле" #NT!
 nd_drr.7.d: "На скалистом склоне над Кабулом со времен индуистских шахов стоит Бала-Хисар. Бабур укрепил его, Моголы разместили в нем гарнизон, а теперь его бастионы перестроены для двора Дуррани. Сестринские цитадели возвышаются над Кандагаром, Газни и Гератом. Из этих крепостей шах командует высокими перевалами; враг, захвативший низменности, ничего не выиграет, если Бала-Хисар останется." #NT!
 nd_drr.7.a: "Высокие цитадели — это хребет империи." #NT!
  
 # ===== ADVANCES ===== 
 nd_drr_pashtunwali: "Кодекс пуштунвали" #NT!
 nd_drr_pashtunwali_desc: "Неписаный кодекс чести пуштунов, обязывающий каждого соплеменника соблюдать нанаватай, мелмастия, бадал и нанг. Империя правит согласно кодексу, а не против него." #NT!
  
 nd_drr_bala_hissar: "Бала-Хиссарские укрепления" #NT!
 nd_drr_bala_hissar_desc: "Над перевалами господствуют горные цитадели Кабул, Кандагар, Газни и Герат. Из своих бастионов шах удерживает возвышенность, даже когда низменности потеряны." #NT!
  
 nd_drr_mountain_raiders: "Горные рейдеры" #NT!
 nd_drr_mountain_raiders_desc: "Соплеменники-пуштуны знают каждое ущелье Гиндукуша. Как легкая пехота, они преследуют, устраивают засады и обескровливают любого захватчика, который забирается на их холмы." #NT!
  
 nd_drr_kandahari_horses: "Кандахарская торговля лошадьми" #NT!
 nd_drr_kandahari_horses_desc: "Кандагар — это большой конный рынок на перекрестке дорог, где туркменские, персидские и индийские покупатели борются за лучшие афганские лошади." #NT!
  
 nd_drr_pass_tolls: "Таможня Рахдари" #NT!
 nd_drr_pass_tolls_desc: "Офицеры Рахдара устанавливают пошлины у ворот Хайбера, Болана и Кабула, облагая налогом каждый караван, пересекающий Индостан, Персию и Туран." #NT!
  
 nd_drr_sufi_networks: "Сети суфийских святынь" #NT!
 nd_drr_sufi_networks_desc: "Приказы Накшбанди и Кадири связывают племя и корону через ханаки и дарги, которые усеивают дороги империи." #NT!
  
 nd_drr_hindki_merchants: "Торговые сообщества хиндки" #NT!
 nd_drr_hindki_merchants_desc: "Индуистские и сикхские торговые семьи Кабула, Пешавара и Мултана находятся под королевской защитой. Их сети простираются до Бухары, Лхасы и Банараса." #NT!
  
 nd_drr_khorasan_revival: "Хорасанское возрождение" #NT!
 nd_drr_khorasan_revival_desc: "Персидская поэзия, индо-персидская историография и придворные письма дари процветают в диване Дуррани. Империя является наследницей Хорасана, а также Паштунхвы." #NT!
  
 nd_drr_jirga_councils: "Советы Джирги" #NT!
 nd_drr_jirga_councils_desc: "Собрания племен решают местные вопросы консенсусом. Шах правит посредством совета, а не указов, и Империя держится вместе, потому что каждый вождь чувствует себя услышанным." #NT!
  
 nd_drr_hotaki_revival: "Возрождение Хотаки" #NT!
 nd_drr_hotaki_revival_desc: "Память о восстании Мирваиса Хотака против Сефевидов закаляет афганское оружие. Пуштуны однажды захватили Исфахан; они могут сделать это снова." #NT!
  
 nd_drr_sistan_qanats: "Систан Канац" #NT!
 nd_drr_sistan_qanats_desc: "Ирригация Кареза и Каната возрождает бассейн Гильменда и пустоши Систана. Зернохранилища империи заполняются там, где на протяжении веков паслись только кочевники." #NT!
  
 nd_drr_naqshbandi_tariqa: "Тарикат Накшбанди-Муджаддиди" #NT!
 nd_drr_naqshbandi_tariqa_desc: "Обновленный суфийский орден Сирхинди распространяется по империи. Его шейхи проповедуют дисциплинированную суннитскую ортодоксальность и связывают племена единой конфессиональной целью." #NT!
  
 nd_drr_jezail_tradition: "Джезайльская винтовочная традиция" #NT!
 nd_drr_jezail_tradition_desc: "Оружейники Хайбера производят длинноствольные фитильные замки, обеспечивающие дальность стрельбы, с которой не может сравниться ни один европейский мушкет. Пуштунские стрелки доминируют в разбитой стране." #NT!
  
 nd_drr_indo_persian_court: "Индо-Персидский суд" #NT!
 nd_drr_indo_persian_court_desc: "Диван Дуррани сочетает в себе персидскую администрацию с формами суда хиндустани. Мунши, мирзы и пандиты — все служат шаху." #NT!
  
 nd_drr_tribal_sardars: "Совет Сардаров" #NT!
 nd_drr_tribal_sardars_desc: "Наследственные вожди девяти великих племен Дуррани образуют постоянный совет шаха, взимая сборы и выступая в роли арбитра между кланами." #NT!
  
 nd_drr_abdali_heritage: "Абдали Наследие" #NT!
 nd_drr_abdali_heritage_desc: "По благословению Сабир-шаха Абдали переименовали в Дуррани: Жемчужину из жемчуга. Династия пользуется престижем своего основания." #NT!
  
 nd_drr_loya_jirga_advance: "Традиция Лойя джирги" #NT!
 nd_drr_loya_jirga_advance_desc: "Великое собрание всех пуштунских племен является конституционной основой Империи. Он приветствует каждого нового шаха; каждая великая война санкционирована ею." #NT!
  
 nd_drr_ghulam_khana: "Гулам Хана" #NT!
 nd_drr_ghulam_khana_desc: "Королевская гвардия, состоящая из ветеранов пуштунов, таджиков и кызылбашей. Отправили по почте улан, верных только шаху." #NT!
  
 nd_drr_zamburak_corps: "Корпус Замбурака" #NT!
 nd_drr_zamburak_corps_desc: "Установленные на верблюдах поворотные орудия быстро преодолевают пустыню и степь. В Панипате две тысячи замбураки прорвали линию маратхов." #NT!
  
 nd_drr_panipat_doctrine: "Панипатская доктрина" #NT!
 nd_drr_panipat_doctrine_desc: "Дурранский способ войны: тяжелая кольчужная конница на флангах, джезаильчи в схватке, замбураки в мобильном резерве. Доктрина, выкованная во время великих индийских кампаний." #NT!
  
 nd_drr_kandahar_treasury: "Кандагарское казначейство" #NT!
 nd_drr_kandahar_treasury_desc: "Королевский монетный двор и хранилище дани в Кандагаре принимает добычу Дели, обычаи Хайбера и дань Синда." #NT!
  
 nd_drr_sadozai_succession: "Наследие Садозай" #NT!
 nd_drr_sadozai_succession_desc: "Династический кризис после Тимур-шаха, когда князья Садозаи соперничают в Кабуле, Пешаваре и Герате. То, как империя преодолевает этот кризис, определяет ее столетие." #NT!
  
 nd_drr_frontier_defense: "Пограничная оборона" #NT!
 nd_drr_frontier_defense_desc: "Длительное отступление из Пенджаба и Синда учит империю обороняться. Каждое ущелье Гиндукуша становится крепостью." #NT!
  
 nd_drr_modernization: "Модернизация Дуррани" #NT!
 nd_drr_modernization_desc: "Предварительные реформы при покойном Садозае и раннем Баракзае-шахе: печатный станок в Кабуле, артиллерийская школа, обследование королевства." #NT!
  
 nd_drr_lashkar_reform: "Реформа Лашкара" #NT!
 nd_drr_lashkar_reform_desc: "Племенной набор реорганизован для современной войны, с постоянными полками, набранными из пуштунских долин, и стандартизированным вооружением." #NT!
  
 # ===== UNITS ===== 
 a_nd_drr_pashtun_lashkar: "Пуштун Лашкар" #NT!
 a_nd_drr_pashtun_lashkar_desc: "Племенной отряд, набираемый через Лойя джиргу. Каждый приносит с собой свой джезаил или талвар; вместе они являются основой армии Империи и ужасом в своих родных горах." #NT!
  
 a_nd_drr_jezailchi: "Джезайлчи" #NT!
 a_nd_drr_jezailchi_desc: "Длинноствольный стрелок с фитильными ружьями из хайберских деревень оружейников. Известен тем, что убивал офицеров с дистанции, до которой не может добраться ни один европейский мушкет, и тем, что снова исчезал в скалах." #NT!
  
 a_nd_drr_ghulam_khana: "Гулам Хана" #NT!
 a_nd_drr_ghulam_khana_desc: "Королевская домашняя тяжелая кавалерия. Посланные по почте уланы, набранные из пуштунских, таджикских и кызылбашских ветеранов, лично присягнувших шаху." #NT!
  
 a_nd_drr_zamburak: "Замбурак" #NT!
 a_nd_drr_zamburak_desc: "Поворотное ружье, установленное на коленопреклоненном верблюде. Быстро преодолевая пустыню и каменистую почву, опустошая с близкого расстояния, сломив маратхов в Панипате." #NT!
  
 a_nd_drr_zamburak_levy: "Замбурак Леви" #NT!
 a_nd_drr_zamburak_levy_desc: "Племенные вертушки, воспитанные на базе солдат и соплеменников Империи. Дешевле, чем обычный корпус замбураков, но сражается с таким же грозным жалом." #NT!
  
 # ===== LEVIES ===== 
 levy_nd_drr_pashtun_lashkar: "Пуштун Лашкар" #NT!
 levy_nd_drr_pashtun_lashkar_desc: "Племенной отряд, мобилизованный по призыву Лойя джирги, набранный из крестьян, соплеменников и солдатского сословия." #NT!
  
 levy_nd_drr_zamburak: "Замбурак Леви" #NT!
 levy_nd_drr_zamburak_desc: "Верблюжьи поворотные артиллеристы, собранные из солдат Империи и соплеменников для быстрой и эффективной полевой службы." #NT!
  
 # ===== BUILDINGS ===== 
 nd_drr_bala_hissar_fort: "Бала Хисар" #NT!
 nd_drr_bala_hissar_fort_desc: "Горная цитадель, господствующая над городом и его перевалами. Бала-Хиссар в Кабуле, Арг в Кандагаре и Цитадель Герата следуют этому образцу." #NT!
  
 nd_drr_bala_hissar_upkeep: "Цитадель Гарнизон" #NT!
 nd_drr_bala_hissar_upkeep_desc: "Камень, оружие, древесина и деготь, чтобы поддерживать бастионы и артиллерийские порты Бала Хисара в боевом порядке." #NT!
  
 nd_drr_rahdari_post: "Рахдари Пост" #NT!
 nd_drr_rahdari_post_desc: "Таможенный пост на императорских караванных дорогах. Офицеры Рахдара регистрируют караваны, взимают пошлины и отправляют конный эскорт." #NT!
  
 nd_drr_rahdari_upkeep: "Администрация платных дорог" #NT!
 nd_drr_rahdari_upkeep_desc: "Лошади для сопровождения радара, бумага для реестров, кожа и ткань для палаток и седел таможенных всадников." #NT!
  
 nd_drr_jezail_workshop: "Мастерская Джезайла" #NT!
 nd_drr_jezail_workshop_desc: "Хайберский оружейный дом, производящий длинноствольные фитильные ружья. Стволы выкованы из сварного железа и оснащены изящно изогнутой ложей." #NT!
  
 nd_drr_jezail_forging: "Длинноствольная ковка" #NT!
 nd_drr_jezail_forging_desc: "Селитра, железо и инструменты объединены в знаменитую винтовку Хайбер-джезайль, которая ценится во всей Азии." #NT!
  
 nd_drr_jezail_maintenance: "Техническое обслуживание мастерской" #NT!
 nd_drr_jezail_maintenance_desc: "Уголь, железо, древесина и инструменты, чтобы поддерживать работу кузниц и прокормить мастеров-оружейников." #NT!
  
 nd_drr_kandahar_treasury_bld: "Королевское казначейство" #NT!
 nd_drr_kandahar_treasury_bld_desc: "Королевский монетный двор и хранилище дани в Кандагаре. Построенный для хранения Кох-и-Нура и добычи Дели, он стал финансовой опорой Империи." #NT!
  
 nd_drr_treasury_upkeep: "Управление казначейства" #NT!
 nd_drr_treasury_upkeep_desc: "Бумага для регистров, серебро и драгоценные камни для пробирщиков, книги для имперских бухгалтеров." #NT!
  
 # ===== EVENT VARIABLE TOOLTIPS ===== 
 nd_drr_formed_tt: "Основана империя Дуррани." #NT!
 nd_drr_path_a_tt: "Путь Лойя джирги выбран" #NT!
 nd_drr_path_b_tt: "Выбран путь Меча Хорасана" #NT!
  
 # ===== ADDITIONAL UNITS ===== 
 a_nd_drr_ghazi: "Гази" #NT!
 a_nd_drr_ghazi_desc: "Пуштунские пограничные воины возрождения Хотаки, призванные к джихаду против Сефевидов и маратхов. Тяжелая ударная пехота, которая с религиозным рвением сражается в разрушенной стране." #NT!
  
 a_nd_drr_kohistani: "Кохистанская легкая пехота" #NT!
 a_nd_drr_kohistani_desc: "Модернизированная горная пехота позднего периода Садозай и Баракзай. Бурят по-европейски, но все еще чувствуют себя как дома в ущельях Гиндукуша." #NT!
  
 # ===== ADDITIONAL LEVY ===== 
 levy_nd_drr_ghazi: "Гази Леви" #NT!
 levy_nd_drr_ghazi_desc: "Религиозные добровольцы, собранные через поместья солдат и соплеменников, мобилизованные памятью Хотаки и призывом суфийских шейхов." #NT!
  
 # ===== ADDITIONAL BUILDINGS ===== 
 nd_drr_horse_market: "Конный рынок Кандахари" #NT!
 nd_drr_horse_market_desc: "Крупнейшая региональная ярмарка лошадей, на которой туркменские, персидские и индийские покупатели борются за лучшие афганские лошади. Казначейство процветает за счет пошлин." #NT!
  
 nd_drr_horse_fair_upkeep: "Обслуживание конной ярмарки" #NT!
 nd_drr_horse_fair_upkeep_desc: "Скот, лошади, кожа и зерно, чтобы великая конная ярмарка работала каждый сезон." #NT!
  
 nd_drr_khanaqah: "Суфийская Ханака" #NT!
 nd_drr_khanaqah_desc: "Домик Накшбанди или Кадири, объединяющий храм, семинарию и общежитие для странствующих дервишей. Шейхи привязывают как соплеменников, так и горожан к религиозной жизни Империи." #NT!
  
 nd_drr_khanaqah_upkeep: "Ханака Эндаумент" #NT!
 nd_drr_khanaqah_upkeep_desc: "Бумага для рукописей, книги для семинарии, благовония и пчелиный воск для ритуалов дарги." #NT!
  
 nd_drr_hindki_quarter: "Квартал Хиндки" #NT!
 nd_drr_hindki_quarter_desc: "Индуистский и сикхский торговый анклав под королевским фирманом. Их семейные связи достигают Бухары, Лхасы и Банараса, осуществляя торговлю через базары Империи." #NT!
  
 nd_drr_hindki_upkeep: "Техническое обслуживание квартала Хиндки" #NT!
 nd_drr_hindki_upkeep_desc: "Ткань, бумага, керамика и благовония для повседневной жизни и торговли общины хиндки." #NT!
  
 nd_drr_kabul_press: "Кабулская литографическая пресса" #NT!
 nd_drr_kabul_press_desc: "Первая афганская типография, созданная под патронажем Баракзая в Кабуле. Книги на дари и пушту способствуют распространению грамотности и закладывают основу современной афганской общественности." #NT!
  
 nd_drr_press_upkeep: "Пресс-служба" #NT!
 nd_drr_press_upkeep_desc: "Бумага, книги и инструменты для нанесения чернил на литографские камни и хранения шрифтов." #NT!
  
 # ===== DESTINY ADVANCES ===== 
 nd_drr_destiny: "Долгая дорога Империи" #NT!
 nd_drr_destiny_desc: "Лойя джирга короновала шаха; теперь империя должна выбрать свой долгий путь. Либо внутрь, к Хорасану, либо наружу, к Индостану." #NT!
  
 nd_drr_dest_khorasan_restored: "Хорасан восстановлен" #NT!
 nd_drr_dest_khorasan_restored_desc: "Верните себе сердце Персии. Возьмите Мешхед и Нишапур и стабилизируйте страну; центр тяжести империи возвращается туда, где встречаются Хорасан, Систан и Гиндукуш." #NT!
  
 nd_drr_dest_pearls_federation: "Жемчужины Федерации" #NT!
 nd_drr_dest_pearls_federation_desc: "Превратите центр Хорасани в экономический центр империи. Возьмите Мерв и Бухару, поднимите общее развитие до имперского уровня и наполните казну. Канатный контур — это хребет империи." #NT!
  
 nd_drr_dest_sunni_imamate: "Суннитский имамат Хорасана" #NT!
 nd_drr_dest_sunni_imamate_desc: "Станьте суннитским имаматом Хорасана: наследником Саманидов, соперником престола Сефевидов и покровителем сети монастырей-канатов. Возьмите Самарканд и Исфахан и откройте сеть Канат Хорасани в качестве своей имперской ирригационной системы." #NT!
  
 nd_drr_dest_march_indus: "Марш на Инд" #NT!
 nd_drr_dest_march_indus_desc: "Продолжайте вторжения Ахмад Шаха. Возьмите Лахор и Мултан; собрать тридцатитысячную армию. Богатство и население Индостана находятся в пределах досягаемости шаха." #NT!
  
 nd_drr_dest_loot_delhi: "Грабеж Дели" #NT!
 nd_drr_dest_loot_delhi_desc: "Разграбить Дели и Доаб. Возьмите Дели, Агру и Сирхинд; вернуть добычу столицы Великих Моголов. Павлиний трон принадлежит вам по праву завоевания." #NT!
  
 nd_drr_dest_pearl_of_pearls: "Жемчужина жемчуга коронована" #NT!
 nd_drr_dest_pearl_of_pearls_desc: "Сделайте Инд своей рекой, а Кабул — своей имперской резиденцией. Удерживайте Шринагар, Татту и Пешавар; выставить большую армию; пусть Бала Хисар Кабула возвысится как Императорский Диван, мантия Великих Моголов, воспринятая всерьез." #NT!
  
 # ===== DESTINY EVENT TEXT ===== 
  
 nd_drr.8.t: "Долгая дорога Империи" #NT!
 nd_drr.8.d: "Шах заседает в совете в Бала Хисаре. Лойя джирга высказалась; стандарт повышен; казна полна. Но вопрос в том, какой это будет империя: империя Хорасана, обращенная внутрь, на свое горное плато и персоязычный мир, или империя Индостана, обращенная вовне, на богатства Инда и Ямуны. Сардары утверждают, цитируют казы, что купцы-хиндки взвешивают свои бухгалтерские книги. Дорога должна быть выбрана." #NT!
 nd_drr.8.a: "Дорога будет принадлежать нам." #NT!
  
 nd_drr.9.t: "Хорасан возвращается в Жемчужину" #NT!
 nd_drr.9.d: "Мешхед и Нишапур наши. Храм Имама Резы снова находится под управлением суннитов; базары Нишапура отправляют свои ковры, шафран и бирюзу в Кандагар. Персидскоязычная знать Хорасана приезжает к шахскому дивану, и хорасанская культура, которая всегда была языком-близнецом империи, теперь становится ее административной основой. Пустоши бассейна Гильменда и сады Герата принадлежат нам по праву и истории." #NT!
 nd_drr.9.a: "Хорасан – душа империи." #NT!
  
 nd_drr.10.t: "Канатская трасса" #NT!
 nd_drr.10.d: "Мерв и Бухара взяты. Мирабы империи обследуют линии каналов от Систана до Хорезма; банкиры-хиндки гарантируют сто новых этапов караванов; хазарейские крестьяне по царскому приказу роют новый кярез. Дел больше, чем рук. Диван шаха должен решить: будет ли каналат расширяться за счет барщины, труда королевства, втиснутого в имперские работы? Или сама торговля будет финансировать работы, а караваны будут привозить серебро, которым платят землекопам?" #NT!
 nd_drr.10.a: "Нажмите барщину. Канат построен самим королевством." #NT!
 nd_drr.10.b: "Облагайте налогом караваны. Сама торговля будет финансировать работы." #NT!
  
 nd_drr.11.t: "Имам Сунны" #NT!
 nd_drr.11.d: "Самарканд и Исфахан взяты. Империя простирается от Аральской степи до Персидского залива, и теперь шах является непревзойденным покровителем суннитского Хорасана, в его руках находятся святыня Имама Резы, гробница Тамерлана и пятничная мечеть Исфахана. От накшбандийских шейхов до хиндских банкиров, каждый голос империи задает один и тот же вопрос: будет ли шах имамом Сунны, защитником ортодоксальной веры и соперником шиитской мантии Сефевидов? Или ему следует сохранить «Горизонт Дуррани», широкую терпимость персидской ойкумены?" #NT!
 nd_drr.11.a: "Я Имам Сунны; ортодоксальное вероучение — мой стандарт." #NT!
 nd_drr.11.b: "Горизонт Дуррани: множество религий под одной персидской крышей." #NT!
  
 nd_drr.12.t: "Марш на Инд" #NT!
 nd_drr.12.d: "Лахор и Мултан пали. Армия шаха стоит на Инде и смотрит на восток, где претендент на власть Великих Моголов удерживает Дели только благодаря терпению, маратхи совершают набеги на Доаб, сикхи нападают на Пенджаб, а джаты удерживают Ямуну. Ни одна из этих сил не может выставить то, что выставили мы. Равнина Хиндустани открыта. Кампания продолжается." #NT!
 nd_drr.12.a: "Далее в Дели." #NT!
  
 nd_drr.13.t: "Грабеж Дели" #NT!
 nd_drr.13.d: "Пали Дели, Агра и Сирхинд. Император Великих Моголов сидит как наш пенсионер; Павлиний трон разобран и отправлен в Кандагар; Кох-и-Нур находится в седельной сумке шаха. Было обещано 40 крор дани. Однако Доаб неспокоен, а конфедерация маратхов еще не распалась. В диване соперничают два голоса: наказать мятежных принцев мечом или управлять ими через хиндустанских администраторов в форме Великих Моголов?" #NT!
 nd_drr.13.a: "Наказывайте их. Меч — единственный язык, который знают принцы." #NT!
 nd_drr.13.b: "Правило через диван Ямуны; пусть мунши управляют." #NT!
  
 nd_drr.14.t: "Падшах-э Хинд" #NT!
 nd_drr.14.d: "Сринагар в Кашмире, Татта в Синде, Пешавар в Хайбере и великая армия, участвующая в учениях в Кабуле. Шах — прославленный Падшах-е Хинд, повелитель всех земель от Окса до Ямуны. Бала-Хисар в Кабуле возвышается как новая императорская резиденция по образцу Красного форта с диванами для пуштунской знати, хиндустанских мунши, хиндских банкиров и персидских поэтов. Теперь вопрос: править как мантию Великих Моголов, взятую целиком, или править из Кабула как столицы империи Дуррани, в отличие от прошлого Великих Моголов?" #NT!
 nd_drr.14.a: "Я беру мантию Великих Моголов. Я Падшах-э Хинд." #NT!
 nd_drr.14.b: "Кабул – имперская резиденция. Царство Дуррани принадлежит самому себе." #NT!
  
 # ===== DESTINY BUILDINGS ===== 
  
 nd_drr_dest_qanat_network: "Сеть Хорасани Канат" #NT!
 nd_drr_dest_qanat_network_desc: "Имперские ирригационные работы, объединяющие кярезскую и канатную линии от Систана до Хорезма. Мирабы дивана каждый сезон обследуют новые шахты; сады Герата, Мешхеда и Бухары питают империю." #NT!
  
 nd_drr_dest_qanat_upkeep: "Канат Техническое обслуживание" #NT!
 nd_drr_dest_qanat_upkeep_desc: "Камень, инструменты и пиломатериалы для валов и каналов канатной дороги. Пшеница, чтобы кормить землекопов и мирабов королевства." #NT!
  
 nd_drr_dest_imperial_diwan: "Императорский Диван Кабула" #NT!
 nd_drr_dest_imperial_diwan_desc: "Бала-Хисар в Кабуле перестроен в императорскую резиденцию по образцу Красного форта в Дели. Пуштунские сардары, хиндустанские мунши, банкиры-хиндки и персидские поэты — все они посещают шаха в его зале аудиенций." #NT!
  
 nd_drr_dest_diwan_upkeep: "Диван Операции" #NT!
 nd_drr_dest_diwan_upkeep_desc: "Бумага для фирманов, тонкая ткань для дурбара, мебель для диван-и-ама, инструменты для императорских мастерских." #NT!
  
 # ===== DESTINY TIMED MODIFIERS ===== 
  
 STATIC_MODIFIER_NAME_nd_drr_dest_qanat_corvee: "Канат Корве" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_qanat_corvee: "Труд империи втиснут в канатные заводы. Новые шахты идут от Систана до Хорезма; деревни процветают во главе новых каналов. Царство растет за счет воды и камня." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_caravan_circuit: "Караванная трасса" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_caravan_circuit: "Торговля окупается. По Хорасанской цепи проходят бухарские, индийские и персидские караваны; Кабул, Герат и Кандагар наполняются новыми торговцами и базарами. Диван рассылает своих дипломатов далеко." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_imam_of_sunna: "Имам Сунны" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_imam_of_sunna: "Шах является признанным имамом Сунны. Святыни Имама Резы, Тамерлана, Накшбанда находятся под его покровительством; его армии сражаются под зеленым знаменем ортодоксальности, и империя является соперником любого шиитского трона." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_durrani_horizon: "Горизонт Дуррани" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_durrani_horizon: "Империя представляет собой широкую терпимую персидскую ойкумену поэтов, мистиков, торговцев и ученых. Хиндкийский банкир, накшбандийский шейх, кызылбашский капитан, хазарейский мираб — все они ходят под одним имперским небом." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_chastise_doab: "Наказать Доаба" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_chastise_doab: "Князья Доава учатся мечом. Тяжелая пехота империи, застрельщики джезаилчи и корпус замбураков готовятся к следующей кампании; Форты повстанцев рушатся быстрее, чем их удается поднять." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_yamuna_diwan: "Ямуна Диван" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_yamuna_diwan: "Хиндустанские мунши и администраторы, прошедшие обучение в Великих Моголов, обслуживают новый императорский диван на Ямуне. Империя интегрирует свои завоевания посредством бумаги, реестра и фирмана." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_padshah_e_hind: "Падшах-э Хинд" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_padshah_e_hind: "Шах серьезно относится к мантии Великих Моголов. От Окса до Ямуны знаменем империи является Падшах-э Хинд, а тяжелая пуштунская кавалерия скачет под новым имперским солнцем." #NT!
  
 STATIC_MODIFIER_NAME_nd_drr_dest_kabul_diwan: "Кабульский Диван" #NT!
 STATIC_MODIFIER_DESC_nd_drr_dest_kabul_diwan: "Столицей империи является Кабул, а не Дели. Бала-Хиссар возвышается как императорский диван с зрительным залом, зрительным садом и библиотекой; послы всех стран посещают шаха в высокой цитадели." #NT!
  
 # ===== DESTINY VARIABLE TOOLTIPS ===== 
 # (formed_tt and path tooltips already defined above; no duplicates needed) 
  
 # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_drr_bureaucracy_authority: "Императорский аппарат Садозай" #NT!
 AUTO_MODIFIER_DESC_nd_drr_bureaucracy_authority: "При формировании Кандагарской Лойя джирги [DRR.GetName] унаследовал многоуровневые институциональные традиции своей границы: пуштунский племенной совет, канцелярию персидского вазира, банкирские дома хиндки в Инде и клерикальную иерархию Накшбанди-Муджаддиди. Предоставляет два слота бюрократии, чтобы игрок мог управлять до тремя историческими учреждениями Дуррани (с универсальным слотом капитала)." #NT!
  
 drr_loya_jirga_bureaucracy: "Лойя Джирга" #NT!
 drr_loya_jirga_bureaucracy_desc: "Великое собрание пуштунских вождей. В октябре 1747 года, после убийства Надир-шаха, в результате девятидневных дебатов в святилище Шер-и Сурх в Кандагаре Ахмад-шах Абдали (позже Дуррани) был избран падшах-и дурр-и-дурраном (жемчужиной). Каждая преемственность Садозая после его смерти подтверждалась на аналогичной джирге, и ожидалось, что ханы Абдали, Гильджи, Таджикский и Хазарейский будут услышаны. Этот институт ограничивал шаха, но обязал каждое племя присягой подчиняться имперскому стандарту; Рабочая сила текла из долин, вождей которых нельзя было принудить, но можно было почитать." #NT!
  
 drr_diwan_ala_bureaucracy: "Диван-и-Ала" #NT!
 drr_diwan_ala_bureaucracy_desc: "Верховная канцелярия вазира, построенная по образцу высоких диванов Сефевидов и Великих Моголов. Шах Вали Хан Бамизай, визирь Ахмад Шаха с 1761 года, управлял имперскими финансами, составлял фирмы и контролировал провинциальные субадары Кашмира, Пенджаба, Синда и Хорасана. Его языком был персидский, а его служащих — индо-персидский мунши. Диван был противовесом пуштунским сардарам, чья лояльность была в первую очередь племенной; когда канцелярия функционировала, поступали доходы и фирманам подчинялись. Когда она потерпела неудачу (как это произошло во время кризиса престолонаследия после 1772 года при сыновьях Тимур-шаха), империя распалась по линиям, для подавления которых был построен диван." #NT!
  
 drr_hindki_sarrafs_bureaucracy: "Хиндки Саррафс" #NT!
 drr_hindki_sarrafs_bureaucracy_desc: "Банковские дома Мултани, Шикарпури и Хатри, управлявшие кредитными сетями хунди от Астрахани до Хайдарабада. Индуистские и сикхские сарафы и архатии владели имперскими доходными контрактами Пенджаба, Синда и трансиндуских перевалов; их хунди финансировали восемь вторжений Ахмад-шаха в Индостан, включая победу полевой армии при Панипате в 1761 году. Маликитски настроенные улемы возмущались глубиной участия зимми в имперских финансах и иногда настаивали на введении джизьи. Империя их проигнорировала: артиллеристам-замбуракам и коням-кызылбашам нельзя было платить фетвами." #NT!
  
 drr_naqshbandi_mashaikh_bureaucracy: "Накшбанди-Муджаддиди Машаих" #NT!
 drr_naqshbandi_mashaikh_bureaucracy_desc: "Суфийский тарикат, основанный имамом Раббани Сирхинди (ум. 1624 г.) и продолженный шахом Валиуллой Дели (ум. 1762 г.). Накшбандийские пиры из линии Муджаддиди пересекли пуштунский пояс, благословив вторжения Ахмад-шаха в Индостан в качестве защиты уммы от маратхов и сикхов и привязав сельские племена к трону через их ханаки в Пешаваре, Кабуле и Кандагаре. Машейх дал Садозай религиозную легитимность, независимую от Могол-Дели, но духовенство, которое могло предать анафеме своенравного шаха так же легко, как оно короновало его." #NT!
