l_russian:
 STATIC_MODIFIER_NAME_nd_obas_divine_authority: "Божественная власть Оба" #NT!
 STATIC_MODIFIER_DESC_nd_obas_divine_authority: "Оба правит как божественное воплощение государства Эдо, его закон слова, его дворец — центр всей власти. Наследственные вожди служат по его усмотрению, а гильдии воинов маршируют по его приказу." #NT!
 STATIC_MODIFIER_NAME_nd_city_of_guilds: "Город Гильдий" #NT!
 STATIC_MODIFIER_DESC_nd_city_of_guilds: "Бенин-Сити процветает как мегаполис организованных ремесленных гильдий, каждая из которых осваивает наследственное ремесло под королевским патронажем. Литейщики меди, резчики по слоновой кости, кожевники и ткачи составляют экономическую и культурную основу королевства." #NT!
 nd_edo.1.t: "Королевство Бенин" #NT!
 nd_edo.1.d: "Народ Эдо объединился под одним знаменем. Бенин-Сити с его массивными земляными укреплениями и широкими проспектами, вдоль которых расположены мастерские гильдий, считается одним из величайших городов Западной Африки. Дворец Оба возвышается над горизонтом, его стены украшены бронзовыми табличками, изображающими историю королевства.\n\nНо характер этого нового королевства еще предстоит определить. Сможет ли Оба утвердить абсолютную божественную власть, сосредоточив всю военную и политическую власть во дворце? Или сила королевства будет проистекать из его необычной системы гильдий (литейщики с улицы Игун, резчики по слоновой кости, кузнецы), чьи наследственные ремесла прославили Бенин во всем известном мире?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_edo.1.a: "Оба — это королевство; вся власть исходит из дворца." #NT!
 nd_edo.1.b: "Гильдии — это королевство; их ремесло — наша сила." #NT!
 STATIC_MODIFIER_NAME_nd_edo_ewuare_conqueror: "Эвуаре Завоеватель" #NT!
 STATIC_MODIFIER_DESC_nd_edo_ewuare_conqueror: "Следуя модели Оба Эвуаре, королевство проводит агрессивную экспансию, подчиняя соседние народы и требуя дань в виде пленников и ресурсов." #NT!
 STATIC_MODIFIER_NAME_nd_edo_ewuare_builder: "Эвуаре Строитель" #NT!
 STATIC_MODIFIER_DESC_nd_edo_ewuare_builder: "Следуя модели Оба Эвуаре, королевство инвестирует в восстановление столицы, расширение земляных валов и покровительство искусству и фестивалям, которые определяют идентичность Эдо." #NT!
 nd_edo.2.t: "Наследие Эвуаре" #NT!
 nd_edo.2.d: "Оба Эвуаре Великий превратил королевство Эдо из совокупности слабо связанных между собой общин в имперское государство. Он переименовал королевство, перестроил Бенин-Сити с широкими улицами, расходящимися от дворца, реформировал политическую иерархию, назначив наследного принца Эдайкена седьмым членом совета Узамы, и возглавил военные экспедиции на восток против королевства Игала в Иде и на запад, чтобы подчинить города йоруба Ово и Иданре.\n\nЕго кампании расширили территорию Бенина до более чем 5000 квадратных миль, создав сеть даннические отношения, которые подпитывали экономику королевства за счет набора рабочей силы и ресурсов. Но Эвуаре также был покровителем искусств и фестивалей, основав церемонию Иге и гильдию мастеров по костюмам и бисеру.\n\nПойдем ли мы по пути Эвуаре-завоевателя или Эвуаре-строителя?" #NT!
 nd_edo.2.a: "Его меч разрушил наше владычество." #NT!
 nd_edo.2.b: "Его видение построило нашу столицу." #NT!
 STATIC_MODIFIER_NAME_nd_edo_portuguese_arms: "Португальская торговля оружием" #NT!
 STATIC_MODIFIER_DESC_nd_edo_portuguese_arms: "Европейское огнестрельное оружие и военные поставки проходят через порты Бенина, укрепляя вооруженные силы королевства и обеспечивая быструю военную модернизацию." #NT!
 STATIC_MODIFIER_NAME_nd_edo_portuguese_trade: "Португальский коммерческий альянс" #NT!
 STATIC_MODIFIER_DESC_nd_edo_portuguese_trade: "Коммерческие связи с португальскими купцами открыли новые рынки для бенинского перца, слоновой кости и пальмового масла, обогащая казну королевства и расширяя его торговые сети." #NT!
 nd_edo.3.t: "Прибытие португальцев" #NT!
 nd_edo.3.d: "Португальские моряки появились на побережье недалеко от Бенин-Сити, привезя странные товары и странные обычаи. Их делегации усердно добиваются заключения коммерческих договоров с Оба, признавая Бенин самым могущественным государством в регионе.\n\nПозиции Оба сильны. Он запретил продажу рабов-мужчин, они нужны ему для собственной армии, и ввел строгий контроль над всей торговлей посредством королевской монополии. Португальцы предлагают огнестрельное оружие, латунные слитки для литейщиков бронзы и доступ к отдаленным рынкам. Взамен они ищут перец, слоновую кость, ткань и бусы.\n\nВопрос не в том, торговать ли, а в том, что расставить по приоритетам. Должны ли мы сосредоточиться на приобретении европейского оружия для укрепления нашей армии или на построении прочных коммерческих отношений, которые обогатят королевство на многие поколения?" #NT!
 nd_edo.3.a: "Их оружие сделает наших воинов непобедимыми." #NT!
 nd_edo.3.b: "Их рынки сделают наших торговцев богатыми." #NT!
 nd_edo.4.t: "Мастера потерянного воска" #NT!
 nd_edo.4.d: "Игун Эронмвон, гильдия литейщиков на улице Игун, достигла необычайного уровня мастерства. Используя древнюю технику выплавки, когда расплавленный металл заливают в точно вырезанные формы из воска и глины, они создают портретные головы, памятные доски и церемониальные предметы с удивительным натурализмом и детализацией.\n\nИх работа служит не только художественным, но и политическим целям. Бронзовые таблички, украшающие стены дворца, изображают историю королевства, деяния прошлых Обасов и надлежащий порядок в мире. Каждая мемориальная доска — это заявление о власти, легитимности и культурной самобытности. Наследственное членство в гильдии гарантирует сохранение ее секретов из поколения в поколение, а ее статус самой высокопоставленной гильдии ремесленников в Бенине отражает понимание королевством того, что художественное мастерство неотделимо от политической власти." #NT!
 nd_edo.4.a: "Их искусство увековечивает наше королевство." #NT!
 nd_edo.5.t: "Двор королевы-матери" #NT!
 nd_edo.5.d: "Институт йоба, королевы-матери, стал важной опорой политической структуры Бенина. Иёба командует своим собственным дворцом, своим двором и, что самое примечательное, своим собственным военным полком. Это не просто церемониальная честь.\n\nПолк Иёбы предоставляет Оба верную военную силу, отдельную от гильдий воинов и благородных свит, в противовес любой фракции, которая может угрожать королевской власти. Ее политическое влияние распространяется через ее собственную сеть советников и агентов, давая монархии второй центр власти, который укрепляет всю структуру.\n\nСоздание этого института представляет собой утонченное понимание управления, согласно которому концентрированная власть менее стабильна, чем распределенная лояльность." #NT!
 nd_edo.5.a: "Иёба укрепляет нас всех." #NT!
 nd_edo_ogiso_legacy: "Огисо Наследие" #NT!
 nd_edo_ogiso_legacy_desc: "Традиции древней династии Огисо, «правителей неба», составляют духовную основу идентичности Эдо и поклонения предкам." #NT!
 nd_edo_iya_fortifications: "Укрепления Ия" #NT!
 nd_edo_iya_fortifications_desc: "Массивная система земляных рвов и валов, окружающая Бенин-Сити, начавшаяся под Оба Огуолой, достигла высоты 18 метров и окружила всю столицу." #NT!
 nd_edo_early_guilds: "Ранняя организация гильдий" #NT!
 nd_edo_early_guilds_desc: "Первая организация ремесленных гильдий Бенина под королевским патронажем, установившая наследственные ремесленные традиции, которые определили экономику королевства." #NT!
 nd_edo_warrior_guilds: "Традиция Гильдии Воинов" #NT!
 nd_edo_warrior_guilds_desc: "Организованные воинские гильдии Бенина, вооруженные мечами, копьями и щитами из слоновой или крокодиловой кожи, славились своей дисциплиной по всему побережью Гвинеи." #NT!
 nd_edo_oral_histories: "Устные истории Эдо" #NT!
 nd_edo_oral_histories_desc: "Богатые устные традиции, сохраняющие генеалогию Оба, деяния предков и правовые обычаи народа Эдо из поколения в поколение." #NT!
 nd_edo_ewuare_reforms: "Реформы Эвуаре" #NT!
 nd_edo_ewuare_reforms_desc: "Радикальные политические реформы Оба Эвуаре Великого, который централизовал королевскую власть, реорганизовал совет Узамы и превратил Бенин в имперское государство." #NT!
 nd_edo_eben_tradition: "Эбенская традиция меча" #NT!
 nd_edo_eben_tradition_desc: "Мастерство владения эбеном, традиционным коротким мечом Эдо, которым владеют воинские гильдии в дисциплинированных формированиях, иностранные наблюдатели выгодно сравнивали с любым мечом в Гвинее." #NT!
 nd_edo_uzama_reform: "Реформа Узамы" #NT!
 nd_edo_uzama_reform_desc: "Реформация потомственной знати Узама, в результате которой традиционные создатели королей оказались под более твердым королевским контролем и уменьшена их независимая власть." #NT!
 nd_edo_regional_trade: "Региональные торговые сети" #NT!
 nd_edo_regional_trade_desc: "Роль Бенина как посреднического торговца между западноафриканскими королевствами, обменивающего рыбу, соль, ямс, хлопок и бусы из полудрагоценных камней в регионе Нижнего Нигера." #NT!
 nd_edo_expanded_earthworks: "Расширенные земляные работы" #NT!
 nd_edo_expanded_earthworks_desc: "Расширение оборонительных земляных валов Бенина за пределы города, создавая взаимосвязанную систему рвов и валов, охватывающую тысячи квадратных километров." #NT!
 nd_edo_court_arts: "Покровительство придворным искусствам" #NT!
 nd_edo_court_arts_desc: "Покровительство Оба наследственным гильдиям ремесленников, производившим резьбу по слоновой кости, бронзовые скульптуры, изделия из коралловых бус и тщательно украшенные ткани для королевского двора." #NT!
 nd_edo_portuguese_contact: "Португальский контакт" #NT!
 nd_edo_portuguese_contact_desc: "Прибытие португальских торговцев около 1486 года открыло Бенин для атлантической торговли и принесло новые товары, технологии и дипломатические отношения." #NT!
 nd_edo_igun_eronmwon: "Игун Эронмвон Мастерство" #NT!
 nd_edo_igun_eronmwon_desc: "Литейщики с улицы Игун владеют техникой выплавки, создавая бронзовые таблички, портретные головы и церемониальные предметы, которые определяют художественное наследие Бенина.\n\n#italic Доступно в: $nd_edo_market_house$#!" #NT!
 nd_edo_guild_warrior_tradition: "Традиция воина гильдии" #NT!
 nd_edo_guild_warrior_tradition_desc: "Превращение организованных гильдий воинов Бенина в дисциплинированную военную силу, оснащенную мечами, копьями и отравленными стрелами, способную мобилизовать 20 000 солдат за один день." #NT!
 nd_edo_royal_monopoly: "Королевская торговая монополия" #NT!
 nd_edo_royal_monopoly_desc: "Строгий контроль Оба над всей внешней торговлей, создание королевских монополий на перец, слоновую кость и пальмовое масло, что дало Бенину сильную позицию на переговорах с европейскими купцами.\n\n#italic Доступно в: $nd_edo_market_house$#!" #NT!
 nd_edo_pepper_trade: "Экспортная торговля перцем" #NT!
 nd_edo_pepper_trade_desc: "Систематический экспорт перца и слоновой кости на европейские рынки, при этом Оба контролирует цены и количество для максимизации прибыли королевства.\n\n#italic Доступно в: $nd_edo_market_house$#!" #NT!
 nd_edo_lower_niger_control: "Администрация Нижнего Нигера" #NT!
 nd_edo_lower_niger_control_desc: "Расширение административного влияния Бенина на территорию Нижнего Нигера, установление подчиненных отношений с соседними государствами посредством сочетания военной силы и дипломатии." #NT!
 nd_edo_iyoba_institution: "Институт Иёба" #NT!
 nd_edo_iyoba_institution_desc: "Создание Иёба, Королевы-матери, как политического института с собственным дворцом, двором и военным полком, в противовес благородным фракциям." #NT!
 nd_edo_palace_societies: "Дворцовые общества" #NT!
 nd_edo_palace_societies_desc: "Дворцовые общества Ивебо, Ивегуэ и Ибиве, которые управляли гардеробом, регалиями и домашним хозяйством Оба соответственно, образуя профессиональную бюрократию внутри королевского двора." #NT!
 nd_edo_ivory_exports: "Мастерство экспорта слоновой кости" #NT!
 nd_edo_ivory_exports_desc: "Пик торговли слоновой костью в Бенине: опытные резчики изготавливают сложные бивни, нарукавники и декоративные предметы как для внутреннего использования, так и для европейского рынка." #NT!
 nd_edo_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_edo_firearms_adoption_desc: "Интеграция европейского огнестрельного оружия в вооруженные силы Бенина, сначала через торговлю с Португалией, а затем через голландских и британских торговцев." #NT!
 nd_edo_benin_city_planning: "Городское планирование Бенина" #NT!
 nd_edo_benin_city_planning_desc: "Сложная городская организация Бенин-Сити с широкими улицами, расходящимися от дворца Оба, специализированными кварталами гильдий и запланированными жилыми районами." #NT!
 nd_edo_isekpokin_guild: "Гильдия Исэкпокин" #NT!
 nd_edo_isekpokin_guild_desc: "Гильдия мастеров по изготовлению щитов и кожи Исекпокин, производящая уникальные щиты из кожи слона и крокодила, которые воины Бенина несли в бой." #NT!
 nd_edo_absolute_monarchy: "Абсолютная монархия" #NT!
 nd_edo_absolute_monarchy_desc: "Зенит абсолютной власти Оба, где все аспекты политической, экономической, военной и религиозной жизни сосредоточены в королевском дворце." #NT!
 nd_edo_musketeer_regiments: "Мушкетерские полки Эдо" #NT!
 nd_edo_musketeer_regiments_desc: "Реорганизация гильдий кузнецов Бенина для производства легкого огнестрельного оружия на местном уровне, что снижает зависимость от европейского импорта военной техники." #NT!
 nd_edo_palm_oil_trade: "Торговля пальмовым маслом" #NT!
 nd_edo_palm_oil_trade_desc: "Расширение экспорта пальмового масла как основного торгового товара, дополняющее снижение торговли перцем и слоновой костью в более поздний период." #NT!
 nd_edo_european_diplomacy: "Европейская дипломатия" #NT!
 nd_edo_european_diplomacy_desc: "Сложные дипломатические маневры Бенина между конкурирующими европейскими державами, Португалией, Голландией и Великобританией, натравливающие соперников друг против друга ради сохранения независимости." #NT!
 nd_edo_defensive_warfare: "Доктрина оборонительной войны" #NT!
 nd_edo_defensive_warfare_desc: "Сдвиг королевства в сторону оборонительной военной стратегии, использующей массивные земляные укрепления и знание местной местности для защиты от иностранных вторжений." #NT!
 nd_edo_military_manpower: "Военный кадровый резерв" #NT!
 nd_edo_military_manpower_desc: "Запрет Оба на продажу рабов-мужчин, сохранение рабочей силы королевства для собственных военных нужд и обеспечение большого резерва воинов." #NT!
 nd_edo_guild_codification: "Кодификация гильдий" #NT!
 nd_edo_guild_codification_desc: "Формальная систематизация традиций, техник и наследственных прав гильдий, сохраняющая веками накопленные знания в области литья латуни, резьбы по слоновой кости и текстильного производства.\n\n#italic Доступно в: $nd_edo_market_house$#!" #NT!
 nd_edo_local_firearms: "Местное производство огнестрельного оружия" #NT!
 nd_edo_local_firearms_desc: "Развитие местного производства огнестрельного оружия реорганизованными гильдиями кузнецов, достижение частичной независимости от европейского импорта оружия." #NT!
 nd_edo_sovereignty_defense: "Защита суверенитета" #NT!
 nd_edo_sovereignty_defense_desc: "Решительное сопротивление королевства европейским колониальным вторжениям, опирающееся на многовековые военные традиции и естественные преимущества земляных укреплений." #NT!
 nd_edo_trade_diversification: "Диверсификация торговли" #NT!
 nd_edo_trade_diversification_desc: "Диверсификация экспортной экономики Бенина за пределы традиционной торговли перцем, слоновой костью и пальмовым маслом, включая промышленные товары и переработанные материалы." #NT!
 nd_edo_cultural_resilience: "Культурная устойчивость" #NT!
 nd_edo_cultural_resilience_desc: "Непреходящая сила культурной самобытности Эдо, традиции гильдий, ритуалы Оба, наследие бронзового литья, сохраняющееся на протяжении столетий внешнего давления и перемен." #NT!
 a_nd_edo_eben_warriors: "Эбен Уорриорз" #NT!
 a_nd_edo_eben_warriors_desc: "Дисциплинированная пехота, владеющая мечом Эдо, владеющая традиционным коротким мечом эбен и щитами из слоновьей кожи. Иностранные наблюдатели отметили, что их организация превосходит любые другие силы на побережье Гвинеи." #NT!
 a_nd_edo_guild_warriors: "Гильдия воинов" #NT!
 a_nd_edo_guild_warriors_desc: "Организованные гильдии воинов Бенина, вооруженные мечами, копьями и отравленными стрелами. Способен мобилизовать двадцать тысяч человек за один день под командованием Оба." #NT!
 a_nd_edo_iyoba_guard: "Иёба Страж" #NT!
 a_nd_edo_iyoba_guard_desc: "Полк королевы-матери, верный военный отряд, которым лично командует Иёба. Они служат противовесом дворянским свитам и фракциям гильдий воинов." #NT!
 a_nd_edo_musketeers: "Эдо Мушкетеры" #NT!
 a_nd_edo_musketeers_desc: "Бенинские мушкетерские полки, вооруженные местными жителями и оснащенные огнестрельным оружием, произведенным реорганизованными гильдиями кузнецов королевства, снижают зависимость от европейского импорта оружия." #NT!
 nd_edo_igun_workshop: "Мастерская на улице Игун" #NT!
 nd_edo_igun_workshop_desc: "Мастерские гильдии Игун Эронмвон на улице Игун, где потомственные литейщики по латуни производят знаменитые бенинские бронзы, используя древнюю технику выплавляемого воска." #NT!
 nd_edo_market_house: "Рыночный дом Оба" #NT!
 nd_edo_market_house_desc: "Королевский торговый дом, где вся внешняя торговля находится под монополией Оба. Перец, слоновая кость и пальмовое масло взвешиваются, облагаются налогом и распределяются королевскими агентами." #NT!
 nd_edo_iya_earthwork: "Ия Земляные работы" #NT!
 nd_edo_iya_earthwork_desc: "Часть массивной системы рвов и валов, которая когда-то окружала Бенин-Сити и прилегающие к нему территории, достигала высоты 18 метров и имела соединяющиеся круги рвов и валов для свалок." #NT!
 nd_edo_warrior_barracks: "Казармы Гильдии Воинов" #NT!
 nd_edo_warrior_barracks_desc: "Тренировочные площадки и арсеналы организованных гильдий воинов, где солдаты тренируются в использовании эбенского меча, копья и лука под руководством потомственных военачальников." #NT!
 nd_edo_ogiso_shrine: "Родовое святилище Огисо" #NT!
 nd_edo_ogiso_shrine_desc: "Храм, посвященный древней династии Огисо, «правителям неба», предшествовавшим династии Оба и чье духовное наследие лежит в основе религиозной практики и культурной самобытности Эдо." #NT!
 nd_edo_storyteller_hall: "Зал Рассказчика" #NT!
 nd_edo_storyteller_hall_desc: "Место сбора, где гриоты и устные историки сохраняют и передают генеалогии, законы и эпические повествования народа Эдо посредством искусства рассказывания историй." #NT!
 nd_edo_admin_hall: "Административный зал Оба" #NT!
 nd_edo_admin_hall_desc: "Зал управления, где назначенные Оба чиновники управляют сбором дани, территориальной администрацией и сложной иерархией наследственных и назначаемых вождей." #NT!
 nd_edo_palace_hall: "Дворцовый зал общества" #NT!
 nd_edo_palace_hall_desc: "Штаб-квартиры дворцовых обществ Ивебо, Ивегуэ и Ибиве, профессиональных организаций, управляющих гардеробом, регалиями и церемониальными функциями королевского дома." #NT!
 nd_edo_obas_court: "Суд Оба" #NT!
 nd_edo_obas_court_desc: "Великолепный королевский двор Оба, центр политической власти, культурного покровительства и дипломатического приема для всего королевства." #NT!
 nd_edo_brass_casting: "Латунное литье" #NT!
 nd_edo_brass_casting_desc: "Процесс литья по выплавляемым моделям гильдии Игун Эронмвон, придающий медным слиткам и краскам форму бронзовых бляшек, портретных голов и церемониальных предметов, украшающих дворец Оба." #NT!
 nd_edo_pepper_trade_pm: "Торговля перцем и слоновой костью" #NT!
 nd_edo_pepper_trade_pm_desc: "Королевская монополия на торговлю перцем и слоновой костью, управляемая агентами Оба, которые контролируют цены, количество и доступ к европейским торговцам." #NT!
 nd_edo_earthwork_maintenance: "Техническое обслуживание земляных работ" #NT!
 nd_edo_earthwork_maintenance_desc: "Для постоянного содержания системы рвов и валов требуются пиломатериалы для облицовки, камень для укрепления и организованные рабочие бригады под руководством чиновников Оба." #NT!
 nd_edo_guild_training: "Военная подготовка гильдии" #NT!
 nd_edo_guild_training_desc: "Гильдии воинов поддерживают свою готовность посредством регулярных тренировок в бою на мечах, копьях и луках, потребляя оружие и провизию, чтобы поддерживать свои ряды в боевой готовности." #NT!
 nd_edo_ancestral_rites: "Родовые обряды" #NT!
 nd_edo_ancestral_rites_desc: "Регулярные церемонии в честь предков Огисо требуют принесения в жертву домашнего скота и пчелиного воска для церемониальных свечей, что поддерживает духовную основу общества Эдо." #NT!
 nd_edo_lost_wax_casting: "Литье по выплавляемым моделям" #NT!
 nd_edo_lost_wax_casting_desc: "Расплавленная латунь разливается в точно вырезанные формы из воска и глины, создавая скульптуры и декоративные произведения необычайного натурализма." #NT!
 nd_edo_ivory_carving: "Резьба по Слоновой Кости" #NT!
 nd_edo_ivory_carving_desc: "Опытные резчики вырезают из слоновой кости искусно украшенные бивни, браслеты и декоративные предметы для королевского двора и внешней торговли." #NT!
 nd_edo_coral_beadwork: "Коралловые работы из бисера" #NT!
 nd_edo_coral_beadwork_desc: "Придворные ремесленники изготавливают из окрашенных коралловых бус и ткани изысканные регалии и декоративные украшения для Оба и его вождей." #NT!
 nd_edo_guild_processing: "Обработка мастерской гильдии" #NT!
 nd_edo_guild_processing_desc: "Первые гильдии ремесленников перерабатывали необработанную медь и пиломатериалы в инструменты и утилитарные изделия из металла под королевским покровительством." #NT!
 nd_edo_codified_methods: "Кодифицированные методы гильдии" #NT!
 nd_edo_codified_methods_desc: "Формально стандартизированные методы литья латуни, резьбы по слоновой кости и текстильных гильдий, гарантирующие качество и сохраняющие веками накопленные ремесленные знания." #NT!
 nd_edo_storytelling: "Традиция рассказывания историй" #NT!
 nd_edo_storytelling_desc: "Устным историкам, сохраняющим наследие Эдо, нужна бумага для записей и краски для иллюстрированных историй, поддерживающих живую память о королевстве." #NT!
 nd_edo_court_administration: "Администрация суда" #NT!
 nd_edo_court_administration_desc: "Бюрократическому аппарату правительства Оба требуется бумага для записей и ткань для официального облачения, поддерживая сложную иерархию назначаемых вождей." #NT!
 nd_edo_palace_upkeep: "Содержание Дворцового общества" #NT!
 nd_edo_palace_upkeep_desc: "Три дворцовых общества поддерживают гардероб и регалии Оба, требуя тонких тканей и красок для сложных церемониальных одежд, которые носили при дворе." #NT!
 nd_edo_royal_upkeep: "Содержание Королевского двора" #NT!
 nd_edo_royal_upkeep_desc: "Великолепный двор Оба требует прекрасных тканей и красок для королевского гардероба, дипломатических подарков и тщательно продуманных церемоний, демонстрирующих королевскую власть." #NT!
 levy_nd_edo_iyoba_guard: "Иёба Страж" #NT!
 levy_nd_edo_iyoba_guard_desc: "Личный полк королевы-матери, сформированный из солдат и крестьян, верных дому Иёба." #NT!
 nd_edo_formed_tt: "Образовано Королевство Бенин." #NT!
 nd_edo_path_a_tt: "Выбрать Божественную власть Оба" #NT!
 nd_edo_path_b_tt: "Выбрать Город Гильдий" #NT!
 nd_edo_destiny: "Судьба Бенина" #NT!
 nd_edo_destiny_desc: "Королевство Бенин было создано. Теперь Оба должны решить, каким будет дальнейший путь: станет ли это королевство военной империей или экономическим центром, управляемым гильдиями?" #NT!
 nd_edo_dest_western_wars: "Западные войны" #NT!
 nd_edo_dest_western_wars_desc: "Подчините центральную часть йоруба в Ойо-Иле и захватите торговый порт Калабар, чтобы установить военное господство Оба над Нижним Нигером и за его пределами." #NT!
 nd_edo_dest_northern_reach: "Северный Предел" #NT!
 nd_edo_dest_northern_reach_desc: "Распространите власть Оба на штаты хауса, завоевав Кано и столицу Борну Нгазаргаму, в результате чего великие торговые города Сахеля оказались под властью Бенина." #NT!
 nd_edo_dest_imperial_dominion: "Имперский Доминион" #NT!
 nd_edo_dest_imperial_dominion_desc: "Армии Оба должны достичь золотых приисков Кумаси и легендарного города Тимбукту, сделав Бенин верховной державой Западной Африки." #NT!
 nd_edo_dest_guild_wealth: "Богатство гильдии" #NT!
 nd_edo_dest_guild_wealth_desc: "Система гильдий должна генерировать достаточно профицита, чтобы наполнить казну Оба, охватывая банковские учреждения, чтобы формализовать растущую экономическую сложность королевства." #NT!
 nd_edo_dest_artisan_power: "Ремесленная сила" #NT!
 nd_edo_dest_artisan_power_desc: "Мастерские гильдий должны способствовать развитию всего королевства, в то время как слоновая кость, обработанная мастерами-резчиками королевства, течет через столичные рынки в далекие страны." #NT!
 nd_edo_dest_guild_imperium: "Гильдия Империум" #NT!
 nd_edo_dest_guild_imperium_desc: "Система гильдий Бенина должна достичь своего апогея: богатое, развитое королевство, контролирующее священный город Ифе, где традиция литья из латуни зародилась в искусстве предков йоруба." #NT!
 nd_edo.6.t: "Судьба Королевства" #NT!
 nd_edo.6.d: "Королевство Бенин стоит на перепутье. Дворец Оба возвышается над городом с широкими проспектами и мастерскими гильдий, его стены украшены бронзовыми досками, изображающими деяния прошлых правителей. Земляные укрепления тянутся на многие мили во всех направлениях.\n\nНо стабильное королевство — это только начало. Путь, выбранный при основании королевства, теперь манит, будь то меч или мастерская, судьба Бенина ждет." #NT!
 nd_edo.6.a: "Наша судьба написана в бронзе." #NT!
 nd_edo.7.t: "Западные кампании" #NT!
 nd_edo.7.d: "Воины Оба двинулись на запад и восток, взяв под власть Бенина древний город Ойо-Иле и торговый порт Калабар. Йоруба и народы Кросс-Ривер теперь признают превосходство Оба.\n\nЭти завоевания отражают кампании самого Оба Эвуаре, который первым распространил власть Бенина за пределы его центральной части. Гильдии воинов доказали свою ценность, и границы королевства теперь охватывают огромную территорию с разнообразными народами и ресурсами." #NT!
 nd_edo.7.a: "Меч Оба достигает далеко." #NT!
 nd_edo.8.t: "Доминион над Севером" #NT!
 nd_edo.8.d: "Великие города-крепости хауса, Кано с его красильными ямами и кожаными рынками, а также Нгазаргаму, столица империи Борну, теперь несут знамя Бенина. Армии Оба пересекли обширную саванну, чтобы подчинить себе эти богатые торговые центры.\n\nЭто империя беспрецедентных размеров для королевства, родившегося в лесах Нижнего Нигера. Вопрос теперь в том, как закрепить эти завоевания. Сформирует ли Оба из своих воинов еще более грозную боевую силу или создаст систему данников, которая обогатит королевство и умиротворит побежденных?" #NT!
 nd_edo.8.a: "Наши воины — лучшие в Западной Африке." #NT!
 nd_edo.8.b: "Пусть притоки наполнят нашу казну." #NT!
 nd_edo.9.t: "Империя Оба" #NT!
 nd_edo.9.d: "От золотых приисков Кумаси до легендарных библиотек Тимбукту — владения Оба простираются по всей Западной Африке. Ни один правитель в истории региона не владел такой огромной территорией, и это военное достижение удивило бы португальских торговцев, которые первыми пришли сюда за перцем и слоновой костью.\n\nБронзовые таблички во дворце должны быть расширены, чтобы запечатлеть эти триумфы. Но характер военной мощи этой империи еще предстоит решить. Должны ли Оба инвестировать в профессиональную имперскую армию, опирающуюся на все завоеванные народы, или же преследовать грандиозную стратегию дипломатического запугивания, подкрепленную подавляющей силой?" #NT!
 nd_edo.9.a: "Создайте величайшую армию, которую когда-либо видела Западная Африка." #NT!
 nd_edo.9.b: "Пусть наша репутация предшествует нашим армиям." #NT!
 nd_edo.10.t: "Сокровищница гильдий" #NT!
 nd_edo.10.d: "Система гильдий принесла необычайное богатство. Литейщики латуни, резчики по слоновой кости, ткачи и кожевенники производят товары, которые продаются по более высоким ценам на ближних и дальних рынках. Казначейство Оба переполнено доходами от королевской монопольной торговли, а принятие королевством формальной банковской практики придало ему финансовую изощренность, беспрецедентную в регионе.\n\nБенин-Сити процветает как мегаполис организованной промышленности, где каждая улица принадлежит гильдии и каждое ремесло совершенствуется из поколения в поколение." #NT!
 nd_edo.10.a: "Гильдии — богатство королевства." #NT!
 nd_edo.11.t: "Мастера своего дела" #NT!
 nd_edo.11.d: "Мастерские гильдий стали двигателями развития, стимулирующими рост по всему королевству. Слоновая кость, вырезанная мастерами Бенина, течет через рынки столицы покупателям со всего мира. Развитие королевства опережает его соседей, оно основано на наследственных ремесленных знаниях, отточенных веками.\n\nГильдии теперь стоят на перепутье. Некоторые мастера гильдий настаивают на все большем художественном совершенстве, грамотности, образовании, сохранении техник письма, а не только памяти. Другие видят будущее в торговле, расширении дипломатических связей, открытии новых рынков, использовании богатства системы гильдий для распространения влияния за рубежом." #NT!
 nd_edo.11.a: "Мастерство ремесла требует владения знаниями." #NT!
 nd_edo.11.b: "Наши торговцы будут доставлять товары гильдии в каждый порт." #NT!
 nd_edo.12.t: "Гильдия Империум" #NT!
 nd_edo.12.d: "Бенин достиг того, чего не удалось ни одному другому западноафриканскому королевству: империя, построенная в первую очередь не на завоеваниях, а на производительной мощи своей системы гильдий. Богатство королевства, его культурное влияние, дипломатические связи — все это исходит из мастерских на улице Игун и их аналогов по всему королевству.\n\nСвященный город Ифе, где художественная традиция бронзового литья впервые укоренилась среди йоруба, теперь признает культурное превосходство Бенина. Круг замкнулся, искусство пришло из Ифе, и для мастеров Ифе Бенин теперь является доказательством того, что может построить это искусство.\n\nКак эта империя проявит свою мощь в предстоящие годы?" #NT!
 nd_edo.12.a: "Постройте город, который может соперничать с любым городом в мире." #NT!
 nd_edo.12.b: "Пусть наша культура достигнет каждого берега." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_warriors_of_oba: "Воины Оба" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_warriors_of_oba: "Гильдии воинов Оба превратились в самую грозную боевую силу в Западной Африке, их боевой дух непоколебим, а тактика отточена в ходе кампаний по саванне." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_tributaries_of_oba: "Притоки Оба" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_tributaries_of_oba: "Обширная сеть подчиненных государств поддерживает военную машину Оба, сокращая расходы на содержание армий, в то время как компании наемников дополняют гильдии воинов." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_imperial_army: "Имперская армия Оба" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_imperial_army: "Профессиональная имперская армия, собирающая кавалерию и артиллерию со всех завоеванных территорий, объединенная под верховным командованием Оба в силу разрушительной скорости и мощи." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_grand_strategy: "Большая стратегия Бенина" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_grand_strategy: "Репутация Оба как обладателя подавляющей военной силы опережает его армии, позволяя быстро аннексировать соперников, в то время как обширная шпионская сеть защищает империю от внутренних угроз." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_master_craftsmen: "Мастера-ремесленники" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_master_craftsmen: "Мастера гильдий подняли свои наследственные ремесла до уровня высокого искусства, распространяя культурное влияние и грамотность по всему королевству, хотя акцент на мастерских, а не на поле боя, делает кампании более дорогостоящими." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_merchant_princes: "Появился новый класс богатых торговцев гильдий, обладающих дипломатическим влиянием и финансовой хваткой, которые открывают рынки и создают альянсы во всем торговом мире." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_artisan_metropolis: "Ремесленный Метрополис" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_artisan_metropolis: "Бенин-Сити превратился в настоящий мегаполис организованной промышленности, где эффективное городское планирование и мощные торговые центры привлекают торговлю из далеких стран." #NT!
 STATIC_MODIFIER_NAME_nd_edo_dest_cultural_renaissance: "Культурный Ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_edo_dest_cultural_renaissance: "Богатство системы гильдий позволило финансировать морскую экспансию, строительство кораблей и обучение моряков, чтобы доставлять знаменитые ремесленные товары Бенина в порты вдоль всего побережья Западной Африки и за его пределами." #NT!
 nd_edo_war_palace: "Военный дворец Оба" #NT!
 nd_edo_war_palace_desc: "Укрепленный командный центр императорской армии Оба, сочетающий в себе традиционную дворцовую архитектуру Бенина с военными казармами, оружейными складами и военными советами, построенными на завоеванных территориях." #NT!
 nd_edo_guild_masters_hall: "Зал Мастеров гильдий" #NT!
 nd_edo_guild_masters_hall_desc: "Большой зал собраний мастеров гильдий Бенина, где встречаются главы каждой гильдии наследственных ремесленников, чтобы координировать производство, устанавливать стандарты качества и управлять обширными торговыми сетями, поддерживающими богатство королевства." #NT!
 nd_edo_war_palace_maintenance: "Содержание военного дворца" #NT!
 nd_edo_war_palace_maintenance_desc: "Имперскому военному дворцу необходимы постоянные поставки оружия, строительных материалов и продовольствия для поддержания гарнизона и структуры военного командования Оба." #NT!
 nd_edo_guild_masters_maintenance: "Содержание зала гильдии" #NT!
 nd_edo_guild_masters_maintenance_desc: "Залу мастеров гильдий требуется медь для демонстраций, слоновая кость для демонстрационных работ, ткань для церемониальных случаев и бумага для записей стандартов гильдии и торговых соглашений." #NT!
  
  # ===== BUREAUCRACIES ===== 
 edo_uzama_nihinron_bureaucracy: "Узама Нихинрон" #NT!
 edo_uzama_nihinron_bureaucracy_desc: "Семь наследственных вождей столичного Бенина (Олиха, Эдоэн, Эдзомо, Эро, Эхоло н'Ире, Олотон и Ихаза), чьи должности появились еще до появления самой династии Оба. Традиция гласит, что Узама пригласил Оранмияна из Ифе прислать сына, чтобы править ими около 1200 года, основав линию Эвека I. Они сохраняют конституционное право устанавливать каждого нового Оба: ни один король не может быть законным без коронации в Усаме, где Олиха возлагает на его голову бисерную корону. После реформ Эвуаре около 1440 года они были лишены административной власти, но сохранили за собой роль создателя королей, что сделало их постоянным противовесом королевской власти." #NT!
 edo_eghaevbo_nogbe_bureaucracy: "Эгаевбо-н'Огбе" #NT!
 edo_eghaevbo_nogbe_bureaucracy_desc: "Эвуаре Великий (ок. 1440–1473 гг.) реорганизовал управление Бенином вокруг трех дворцовых обществ, штаб-квартира каждого из которых располагалась в своем квартале резиденции Оба: Ивебо (вожди регалий, латуни и слоновой кости), Ивегуаэ (главы королевской особы и домашнего хозяйства) и Ибиве (вожди гарема и королевских детей). Каждое общество допускало мужчин по королевскому назначению, а не по рождению; их титулованные члены коллективно сформировали Эгаевбо н'Огбе, дворцовых вождей, орган, специально созданный для того, чтобы дать Оба административную власть, независимую от Узамы и городских вождей." #NT!
 edo_igun_eronmwon_bureaucracy: "Гильдия латуни Игун-Эронмвон" #NT!
 edo_igun_eronmwon_bureaucracy_desc: "Гильдия литейщиков латуни на Игун-стрит в Бенин-Сити владела королевской монополией на литье по выплавляемым моделям памятных досок, голов и статуэток, ныне известных как бенинские бронзы (на самом деле это свинцовый латунный сплав из транссахарской, а затем и атлантической торговли медью). Мастер гильдии, Инне н'Игун-Эронмвон, считался старшим вождем ивебо. Параллельная гильдия, резчики по слоновой кости Игбесанмван, поставляла резные бивни для королевских алтарей. Вместе они создали долговечную запись династической истории, которую двор Эдо считал своим архивом, выполненную из металла и слоновой кости." #NT!
 edo_igue_festival_bureaucracy: "Фестиваль Иге" #NT!
 edo_igue_festival_bureaucracy_desc: "Кодифицированный Эвуаре около 1440 года и до сих пор соблюдаемый в современном Бенине, Иге является ежегодным фестивалем королевского обновления. Цикл обрядов (Аге, Отуэ, Уги Эрха Оба, Уги Оро, собственно Иге и заключительный Железный День) длится несколько недель каждый декабрь и требует от каждого титулованного вождя королевства посетить дворец Оба, принести дань, принести годовую клятву верности и претерпеть умилостивительные жертвы, которые возобновляют мистическую власть короля. Иге — это одновременно календарный ритуал, выплата дани и конституционный пересмотр: неявившийся вождь считается нарушившим клятву верности." #NT!
 edo_iyase_warcommand_bureaucracy: "Иясе н'Оде" #NT!
 edo_iyase_warcommand_bureaucracy_desc: "Старший из Эгхаевбо н'Оре (глав города) и конституционный военачальник государства Эдо, Иясэ возглавляет армии Оба в полевых условиях, в то время как сам король ритуально остается во дворце. Офис сочетает в себе оперативное командование, набор региональных рекрутов и право отказаться от войны, которую Иясэ считает невыигрышной: проверка, которая привела к восстаниям Иясэ-н'Оде и Иясэ Эсебо в XVIII веке. Амбивалентность титула (главный генерал трона и, скорее всего, военный мятежник трона) отражает напряжение в государстве Эдо между священным царствованием и реальностью поля битвы." #NT!
 edo_ologboona_residency_bureaucracy: "Резиденция Ологбонна" #NT!
 edo_ologboona_residency_bureaucracy_desc: "По мере того как империя Бенина расширялась на запад и север в 15-м и 16-м веках под властью Эвуаре, Озолуа и Эсиги, Оба разместили Ологбона (называемого Олаэном в некоторых западных округах), королевских жителей, набранных из дворцовых обществ, во дворы Акуре, Ово, городов Экити, Махина и прибрежных оснований Эдо, которые стали Лагосом. Каждая Ологбона взимала ежегодную дань в виде рабов, слоновой кости, ткани и соли и отправляла денежные переводы в Бенин-Сити. Резиденция позволила данной системе Бенина функционировать, но вымогательство, задокументированное в записях Акуре и Ово, вызвало хроническое недовольство, которое вылилось в восстания 17-го века." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_edo_bureaucracy_authority: "Полномочия суда Оба" #NT!
 AUTO_MODIFIER_DESC_nd_edo_bureaucracy_authority: "При формировании [EDO.GetName] получает возможность размещать исторические институты государства Эдо: создателя королей Узаму, дворцовые общества Ивебо, Ивегуэ и Ибиве, гильдию меднолитейщиков, календарь божественного королевства Иге, военное командование Иясэ и резиденции над городами-данниками." #NT!
