l_russian:
 STATIC_MODIFIER_NAME_nd_northern_dominion: "Северный Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_northern_dominion: "От моря до моря мы можем приручить обширную северную дикую местность. Наши поселенцы продвигаются все дальше на запад, вытесняя цивилизацию из северных лесов и прерий, поддерживаемые железной волей приграничных народов, которые научились терпеть то, что не смогла ни одна другая нация." #NT!
 STATIC_MODIFIER_NAME_nd_great_trading_nation: "Великая торговая нация" #NT!
 STATIC_MODIFIER_DESC_nd_great_trading_nation: "Реки и транспортные пути, пересекающие этот континент, являются торговыми артериями, и мы контролируем их все. Наши торговцы создали торговую империю, соединяющую две культуры и охватывающую целый континент, от меховых постов во внутренних районах до рыболовных флотов Гранд-Банков." #NT!
 nd_can.1.t: "Рождение Канады" #NT!
 nd_can.1.d: "Новая нация зарождается в северных пределах Америки. Там, где когда-то стояли разбросанные колонии соперничающих европейских держав, теперь начала формироваться единая канадская идентичность, выкованная общим опытом суровых зим, огромных расстояний и бесконечной щедрости дикой природы, которая требует как сотрудничества, так и устойчивости. Вопрос, который сейчас стоит перед нами, является фундаментальным: какой нацией станет Канада? Будем ли мы доминионом поселенцев и солдат, постоянно расширяющим наши границы через прерии и горы? Или мы пойдем по рекам и торговым путям, которые впервые привели европейцев на эти берега, построив коммерческую империю, основанную на толерантности и прагматизме, которые всегда определяли жизнь на границе?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_can.1.a: "Мы освоим эту северную землю." #NT!
 nd_can.1.b: "Наше богатство течет по водным путям." #NT!
 STATIC_MODIFIER_NAME_nd_can_chartered_monopoly: "Дипломированная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_can_chartered_monopoly: "Крупнейшие зарегистрированные компании, среди которых главная компания Гудзонова залива, получили исключительные права на огромные территории. Их торговые посты и предприятия контролируют торговлю целых речных систем, с безжалостной эффективностью добывая меха внутри страны." #NT!
 STATIC_MODIFIER_NAME_nd_can_free_enterprise: "Свободное предпринимательство" #NT!
 STATIC_MODIFIER_DESC_nd_can_free_enterprise: "Эпоха монополии уступила место открытой конкуренции. Независимые торговцы, свободные торговцы и конкурирующие компании теперь соперничают за богатства внутренних районов Канады, и возникшая в результате энергия вызвала волну коммерческих инноваций по всей колонии." #NT!
 nd_can.2.t: "Компания Гудзонова залива" #NT!
 nd_can.2.d: "В 1670 году король Карл II предоставил королевскую хартию губернатору и компании английских авантюристов, торгующих в Гудзоновом заливе, документ, который фактически передал суверенитет над Землей Руперта, всем водосборным бассейном Гудзонова залива, частной корпорации. Торговые посты Компании, от фабрики Йорк на замерзшем берегу залива до отдаленных внутренних районов, образуют сеть торговли и управления, не похожую ни на что другое в колониальном мире. Факторами и слугами Компании являются судьи, торговцы и губернаторы в одном лице, управляющие территориями, которые затмевают большинство европейских королевств. Теперь возникает вопрос: принимаем ли мы эту монопольную модель, направляя торговлю через зарегистрированные компании для максимального контроля? Или мы откроем границы свободного предпринимательства, позволив энергии независимых трейдеров стимулировать экономический рост?" #NT!
 nd_can.2.a: "Предоставьте им монополию." #NT!
 nd_can.2.b: "Пусть свободное предпринимательство восторжествует." #NT!
 STATIC_MODIFIER_NAME_nd_can_light_infantry_legacy: "Наследие легкой пехоты" #NT!
 STATIC_MODIFIER_DESC_nd_can_light_infantry_legacy: "Традиции канадских вольтижеров и их преемников привили нашим армиям мастерство ведения нерегулярной войны. Наша легкая пехота превосходно справляется с перестрелками, засадами и боями на труднопроходимой местности — навыки, рожденные в бескрайних лесах и суровых зимах на канадской границе." #NT!
 STATIC_MODIFIER_NAME_nd_can_garrison_defense: "Традиции обороны гарнизона" #NT!
 STATIC_MODIFIER_DESC_nd_can_garrison_defense: "Уроки защиты обширной границы от численно превосходящего соседа были учтены в нашей военной доктрине. Наши гарнизоны созданы для того, чтобы выстоять, наши укрепления — для сопротивления, а сама наша местность служит нашим величайшим союзником." #NT!
 nd_can.3.t: "Канадские вольтижеры" #NT!
 nd_can.3.d: "В апреле 1812 года подполковник Шарль-Мишель де Салаберри сформировал в Нижней Канаде корпус легкой пехоты — Voltigeurs Canadiens. Набранные из ополчения, обученные в соответствии с обычными стандартами и являющиеся экспертами в пограничной войне, которая определила канадский военный опыт со времен Новой Франции, Вольтижеры представляют собой нечто беспрецедентное: отчетливо канадскую военную традицию. В битве при Шатоге в октябре 1813 года Салаберри и его вольтижеры вместе с союзниками-могавками и абенаками отбросили американские силы численностью четыре тысячи человек с менее чем пятьюстами защитников. Победу одержали не цифры, а знание местности, зимняя дисциплина и мужество, рожденное в защите собственной земли. Как эта традиция повлияет на будущее нашей армии?" #NT!
 nd_can.3.a: "Обучайте больше легкой пехоты." #NT!
 nd_can.3.b: "Укрепите оборону нашего гарнизона." #NT!
 STATIC_MODIFIER_NAME_nd_can_dominion_unity: "Доминион Единство" #NT!
 STATIC_MODIFIER_DESC_nd_can_dominion_unity: "Великий проект Конфедерации объединил провинции и народы, которые когда-то стояли отдельно. Благодаря федеральному компромиссу и конституционной изобретательности была создана структура, которая учитывает языковое, религиозное и региональное разнообразие в пределах одного трансконтинентального государства." #NT!
 STATIC_MODIFIER_NAME_nd_can_sovereign_destiny: "Суверенная судьба" #NT!
 STATIC_MODIFIER_DESC_nd_can_sovereign_destiny: "Канада вышла на мировую арену как самостоятельное суверенное государство. Доминион уже не просто совокупность колониальных зависимостей, он пользуется международным уважением и институтами, позволяющими определять свой собственный курс среди стран мира." #NT!
 nd_can.4.t: "Конфедерация" #NT!
 nd_can.4.d: "Первого июля 1867 года Закон о Британской Северной Америке создал Доминион Канада, федерацию провинций, простирающуюся от Атлантического побережья до Великих озер, с обещанием расширения до Тихого океана и за его пределами. Конфедерация была не романтическим революционным актом, а трезвой политической сделкой, вызванной страхом перед американской экспансией, крахом взаимной торговли с Соединенными Штатами и ошеломляющими затратами на защиту тысяч миль границ. Однако в этом прагматизме кроется нечто примечательное: нация, построенная не на крови и почве, а на переговорах, компромиссах и общей убежденности в том, что разными народами можно управлять вместе в рамках одной конституционной структуры. Вопрос сейчас в том, укрепим ли мы этот союз посредством внутренних уз лояльности и управления или смело заявим о нашем новом суверенитете на международной арене." #NT!
 nd_can.4.a: "Единство через компромисс." #NT!
 nd_can.4.b: "Его ждет суверенная судьба." #NT!
 nd_can_fur_trade_foundations: "Фонды торговли мехом" #NT!
 nd_can_fur_trade_foundations_desc: "Шкура бобра – это валюта канадской дикой природы. Сеть торговли мехом, объединяющая местных охотников, французских курьеров и столичных торговцев, создала экономическую инфраструктуру, от которой зависит вся колониальная Канада." #NT!
 nd_can_coureurs_tradition: "Курьер де Буа" #NT!
 nd_can_coureurs_tradition_desc: "Эти нелицензированные торговцы дикой природой отправляются глубоко вглубь страны, живут среди коренных народов, изучают их языки и навыки выживания, а затем возвращаются с каноэ, нагруженными мехами премиум-класса. Они разведчики, переводчики и передовые агенты канадской экспансии." #NT!
 nd_can_grand_banks: "Рыболовство Гранд-Бэнкс" #NT!
 nd_can_grand_banks_desc: "Мелководье Гранд-Бэнкс изобилует треской в ​​количествах, которые кажутся неисчерпаемыми. Европейские рыбаки пересекали Атлантику ради этих рыболовных угодий с конца 15 века, а сушеная и соленая треска, которую они производят, кормит половину католической Европы.\n\n#italic Доступно в: $nd_can_trading_post$#!" #NT!
 nd_can_canot_du_maitre: "Кано-дю-Мэтр" #NT!
 nd_can_canot_du_maitre_desc: "Огромные монреальские каноэ длиной тридцать шесть футов, построенные из бересты на кедровом каркасе, могут перевозить четыре тонны торговых товаров от реки Святого Лаврентия до внутренних постов. Они являются источником жизненной силы пушной торговли, а путешественники, которые на них ездят, являются самыми легендарными речниками в Америке." #NT!
 nd_can_seigneurial_system: "Сеньорическая система" #NT!
 nd_can_seigneurial_system_desc: "Сеньорическая система делит долину Святого Лаврентия на длинные узкие полосы сельскохозяйственных угодий, идущие перпендикулярно реке. Каждый сеньор имеет феодальные обязательства перед Короной; каждый житель должен сеньору арендную плату, рабочую силу и зерно. Это неэффективно, но заселяет землю." #NT!
 nd_can_fortress_new_france: "Крепость Новая Франция" #NT!
 nd_can_fortress_new_france_desc: "Цепь укреплений от Луисбурга на берегу Атлантического океана до форта Фронтенак на озере Онтарио охраняет подходы к центру острова Святого Лаврентия. Эти каменные и земляные укрепления являются военной основой Новой Франции." #NT!
 nd_can_hudsons_bay: "Компания Гудзонова залива" #NT!
 nd_can_hudsons_bay_desc: "Старейшая зарегистрированная акционерная торговая компания в англоязычном мире. Получив королевскую хартию в 1670 году, Компания распространяется на Землю Руперта, площадь в 1,5 миллиона квадратных миль, дренированную реками, впадающими в Гудзонов залив." #NT!
 nd_can_compagnies_franches: "Компании Франш де ла Марин" #NT!
 nd_can_compagnies_franches_desc: "Колониальные регулярные войска, набранные в Новой Франции и обученные как европейской строевой подготовке, так и ведению лесной войны среди коренных народов. Compagnies Franches сочетают в себе дисциплину профессиональных солдат с передовыми навыками людей, рожденных в канадской дикой местности." #NT!
 nd_can_milice_tradition: "Милис Канадиенн" #NT!
 nd_can_milice_tradition_desc: "Каждый житель Новой Франции мужского пола в возрасте от шестнадцати до шестидесяти лет подлежит службе в милиции. Эти солдаты-граждане защищают сеньоры, патрулируют границы и образуют массу колониальной военной силы, когда регулярные войска не могут быть повсюду одновременно." #NT!
 nd_can_jesuit_missions: "Иезуитские миссии" #NT!
 nd_can_jesuit_missions_desc: "Общество Иисуса отправило своих самых ревностных членов в пустыню Канады, чтобы обратить коренные народы. «Связи иезуитов», их опубликованные письма домой, стали основным источником знаний о внутренней части Северной Америки." #NT!
 nd_can_timber_beginnings: "Начало торговли древесиной" #NT!
 nd_can_timber_beginnings_desc: "Обширные леса Канады производят военно-морские запасы, мачты, рангоут, деготь и поташ, в которых отчаянно нуждаются Королевский флот и верфи Европы. То, что когда-то было побочным продуктом расчистки земель, теперь становится отдельной отраслью." #NT!
 nd_can_treaty_of_utrecht: "Утрехтский договор Наследие" #NT!
 nd_can_treaty_of_utrecht_desc: "Утрехтский договор 1713 года изменил карту Северной Америки, уступив Великобритании Акадию, Ньюфаундленд и территорию Гудзонова залива. Это соглашение заложило рамки франко-британского сосуществования, которые будут определять канадскую политику на протяжении веков." #NT!
 nd_can_battle_of_quebec: "Наследие битвы за Квебек" #NT!
 nd_can_battle_of_quebec_desc: "Падение Квебека в 1759 году положило конец французскому владычеству над Канадой, но не положило конец франко-канадскому народу. Закон Квебека 1774 года гарантировал их язык, религию и гражданское право, что стало прецедентом для учета культурных различий, которые стали определяющей характеристикой Канады." #NT!
 nd_can_voltigeur_tradition: "Канадская вольтижерская традиция" #NT!
 nd_can_voltigeur_tradition_desc: "Канадские вольтижеры, созданные Шарлем-Мишелем де Салаберри в 1812 году, доказали, что канадские солдаты могут сравниться с любой армией мира, сражаясь на своей земле. Их победа при Шатоге с значительно превосходящими силами противника вошла в национальную легенду." #NT!
 nd_can_war_of_1812: "Война 1812 года" #NT!
 nd_can_war_of_1812_desc: "Американское вторжение в Канаду в 1812–1814 годах было отражено коалицией британских регулярных войск, канадской милиции и союзников из числа коренных народов. Война сформировала отчетливую канадскую идентичность, отдельную как от Великобритании, так и от Соединенных Штатов, и доказала, что северные колонии могут защитить себя." #NT!
 nd_can_timber_barons: "Лесные бароны" #NT!
 nd_can_timber_barons_desc: "Континентальная блокада Наполеона отрезала Великобританию от балтийских лесов, и Канада заполнила этот пробел. К 1830-м годам пиломатериалы были ведущей статьей экспорта Канады. Лесные бароны, контролировавшие великие речные потоки, перевозившие миллионы досок древесины по Оттаве и Св. Лаврентию, стали самыми богатыми людьми колонии.\n\n#italic Доступно в: $nd_can_timber_slide$#!" #NT!
 nd_can_provincial_marine: "Провинциальный морской пехотинец" #NT!
 nd_can_provincial_marine_desc: "Провинциальная морская пехота — это военно-морские силы Великих озер, флот шлюпов, шхунов и вооруженных судов, которые патрулируют внутренние моря, разделяющие британскую и американскую территории. Контроль над озерами означает контроль над границей." #NT!
 nd_can_rideau_canals: "Каналы Ридо" #NT!
 nd_can_rideau_canals_desc: "Канал Ридо, построенный в 1832 году, связывает Оттаву с Кингстоном на озере Онтарио через цепь шлюзов, плотин и каналов. Построенный как безопасный маршрут военного снабжения в обход уязвимой границы Святого Лаврентия, он превратился в торговую артерию, соединяющую внутренние районы страны с морем." #NT!
 nd_can_constitutional_act: "Конституционный акт" #NT!
 nd_can_constitutional_act_desc: "Конституционный акт 1791 года разделил Канаду на Верхнюю и Нижнюю провинции, каждая со своим избранным собранием. Оно было несовершенным, собраниям не хватало истинной власти, но оно посеяло семя представительного правительства, которое в конечном итоге переросло в ответственное самоуправление." #NT!
 nd_can_confederation: "Конфедерация" #NT!
 nd_can_confederation_desc: "Закон о Британской Северной Америке 1867 года объединил провинции Канады, Новой Шотландии и Нью-Брансуика в Доминион Канады. Федеративная система была разработана, чтобы сбалансировать интересы англичан и французов, протестантов и католиков, морских и континентальных." #NT!
 nd_can_responsible_government: "Ответственное правительство" #NT!
 nd_can_responsible_government_desc: "Достижение ответственного правительства, в котором исполнительная власть подчиняется избранному собранию, а не отдаленной имперской власти, было достигнуто не революцией, а упорной политической агитацией. Отчет лорда Дарема 1839 года и последовавшие за ним реформы установили принцип, согласно которому канадцы будут управлять сами." #NT!
 nd_can_national_policy: "Национальная политика" #NT!
 nd_can_national_policy_desc: "Национальная политика сэра Джона А. Макдональда 1879 года ввела защитные тарифы для развития канадского производства, построила трансконтинентальную железную дорогу, чтобы связать провинции вместе, и способствовала иммиграции для заселения западных прерий. Это было государственное строительство по экономическому замыслу.\n\n#italic Доступно в: $nd_can_trading_post$#!" #NT!
 nd_can_pacific_railway: "Канадская Тихоокеанская железная дорога" #NT!
 nd_can_pacific_railway_desc: "7 ноября 1885 года Дональд Смит пробил последний столб в Крейгеллачи, завершив Канадскую Тихоокеанскую железную дорогу — стальную ленту, протянувшуюся от Монреаля до побережья Тихого океана. Железная дорога выполнила обещание, данное Британской Колумбии при Конфедерации, и превратила западные прерии из пустынной пустыни в заселенные сельскохозяйственные угодья." #NT!
 nd_can_mounted_police_tradition: "Северо-западная конная полиция" #NT!
 nd_can_mounted_police_tradition_desc: "Северо-Западная конная полиция, созданная в 1873 году, навела закон и порядок на обширных западных территориях. Верхом на лошадях, одетым в свои характерные алые туники, монти стали символом канадского суверенитета на границе, уникальными в мире полицейскими силами." #NT!
 nd_can_wheat_boom: "Прерийный пшеничный бум" #NT!
 nd_can_wheat_boom_desc: "Завершение строительства железной дороги и прибытие сотен тысяч иммигрантов превратили канадские прерии в одну из величайших житниц мира. Пшеница маркиз, выращенная так, чтобы созреть в короткий северный вегетационный период, сделала жизнеспособным крупномасштабное сельское хозяйство в прериях." #NT!
 nd_can_bicultural_compromise: "Бикультурный компромисс" #NT!
 nd_can_bicultural_compromise_desc: "Определяющим политическим достижением Канады является размещение двух ее основополагающих культур, французской и английской, в единых конституционных рамках. Это никогда не было легко, всегда вызывало споры, но приверженность двухкультурному сосуществованию привела к тому, что общество стало более терпимым к разнообразию, чем большинство других." #NT!
 a_nd_can_coureurs_des_bois: "Курьер де Буа" #NT!
 a_nd_can_coureurs_des_bois_desc: "Нелицензированные франко-канадские лесники, которые отправляются вглубь дикой местности, чтобы торговать с коренными народами. Опытные разведчики, каноисты и специалисты по выживанию, которые знают реки и переправы внутри страны лучше, чем любая карта." #NT!
 a_nd_can_compagnies_franches: "Компании Франшизы" #NT!
 a_nd_can_compagnies_franches_desc: "Колониальная регулярная пехота, воспитанная в Новой Франции и обученная как европейской линейной тактике, так и ведению лесной войны коренных народов. Они сражаются в лесу как профессионалы — сочетание, с которым не может сравниться ни одна европейская армия на этом континенте." #NT!
 a_nd_can_milice: "Милис Канадиенн" #NT!
 a_nd_can_milice_desc: "Сеньорское ополчение, набранное из жителей Новой Франции. Каждый мужчина в возрасте от шестнадцати до шестидесяти лет обязан служить. Они хорошо знают свою родную местность и сражаются с отчаянным мужеством людей, защищающих свои фермы и семьи." #NT!
 a_nd_can_voltigeurs: "Канадские вольтижеры" #NT!
 a_nd_can_voltigeurs_desc: "Элитная легкая пехота, обученная Шарлем-Мишелем де Салаберри в традициях приграничной войны. Опытные стрелки, стрелки и разведчики, доказавшие в Шатоге, что канадские солдаты могут победить армию, в десять раз превышающую их численность." #NT!
 a_nd_can_mounted_police: "Северо-западная конная полиция" #NT!
 a_nd_can_mounted_police_desc: "Одетые в алые всадники Северо-Западной конной полиции патрулируют обширные западные территории, обеспечивая соблюдение закона, выступая посредниками в спорах и представляя канадский суверенитет на землях, до которых не может добраться ни одно другое учреждение." #NT!
 n_nd_can_canot_du_maitre: "Кано-дю-Мэтр" #NT!
 n_nd_can_canot_du_maitre_desc: "Огромное монреальское каноэ длиной тридцать шесть футов из бересты и кедра, на котором гребет команда путешественников. Эти суда перевозят четыре тонны торговых товаров на тысячи миль по рекам и волокам, соединяя поселения Святого Лаврентия с меховыми постами внутренних районов." #NT!
 n_nd_can_provincial_sloop: "Провинциальный морской шлюп" #NT!
 n_nd_can_provincial_sloop_desc: "Быстрый мелкосидящий шлюп, предназначенный для патрулирования Великих озер. Эти суда, вооруженные легкими пушками и укомплектованные озерными моряками, обеспечивают канадский контроль над внутренними морями, образующими границу." #NT!
 nd_can_trading_post: "Торговый пост меха" #NT!
 nd_can_trading_post_desc: "Пограничная застава, где европейские товары обмениваются на меха коренных народов. Торговый пост — это одновременно склад, рынок и площадка для дипломатических встреч, основной институт канадской торговли мехом." #NT!
 nd_can_timber_slide: "Деревянная горка" #NT!
 nd_can_timber_slide_desc: "Спроектированный канал, который позволяет брусу обходить пороги и водопады во время великих речных переходов. Эти конструкции необходимы для лесной промышленности, позволяя транспортировать миллионы футов досок из внутренних лесов на лесопилки и экспортные причалы ниже по течению." #NT!
 nd_can_canal_lock: "Шлюз канала" #NT!
 nd_can_canal_lock_desc: "Шлюзовая камера, которая поднимает или опускает суда между разными уровнями воды, позволяя перемещаться по внутренним территориям Канады. Система каналов соединяет Великие озера с рекой Святого Лаврентия, создавая непрерывный коммерческий водный путь от центра страны к морю." #NT!
 nd_can_pelt_processing: "Обработка шкур" #NT!
 nd_can_pelt_processing_desc: "Подготовка, сортировка и прессование бобра и других мехов для экспорта на европейские рынки. Качественная обработка шкур требует премиальных цен в домах моды Лондона и Парижа." #NT!
 nd_can_log_driving: "Вождение журнала" #NT!
 nd_can_log_driving_desc: "Опасное искусство перевозки брусчатки по канадским рекам к лесопилкам и экспортным докам. Речные водители, плотовщики и лесопромышленники в Оттаве и Св. Лаврентии рискуют своей жизнью, проводя миллионы досок через пороги и заторы." #NT!
 nd_can_canal_tolls: "Плата за канал" #NT!
 nd_can_canal_tolls_desc: "Доходы, полученные от коммерческих судов, проходящих через систему шлюзов канала. Плата за проезд финансирует содержание водных путей, а сам канал стимулирует торговлю, соединяя внутренние рынки с прибрежными портами." #NT!
 nd_can_cod_curing: "Лечение трески" #NT!
 nd_can_cod_curing_desc: "Засолка и сушка атлантической трески, добытой на промысле Гранд-Бэнкс. Соленая треска — это прочный, богатый белком продукт питания, который кормит католическую Европу во время Великого поста и поддерживает колониальное население в течение долгих зим." #NT!
 nd_can_potash_production: "Производство калия" #NT!
 nd_can_potash_production_desc: "Производство поташа из золы лиственных пород, расчищенной под сельскохозяйственные угодья. Этот ценный промышленный химикат используется в мыловарении, производстве стекла и удобрений, превращая отходы расчистки земель в экспортный товар." #NT!
 nd_can_maple_sugar: "Переработка кленового сахара" #NT!
 nd_can_maple_sugar_desc: "Сбор кленового сока весной и вываривание его в сахар и сироп. Обработка клена, полученная от коренных народов, дает подсластитель местного производства, который снижает зависимость от импортного тростникового сахара из стран Карибского бассейна." #NT!
 levy_nd_can_milice: "Милис Канадиенн" #NT!
 levy_nd_can_milice_desc: "Сеньорский ополченский сбор взимался с земледельческих жителей поселений Святого Лаврентия. Эти пограничники знают свою Родину и стойко сражаются, когда их призывают на службу." #NT!
 nd_can_formed_tt: "была образована Канада" #NT!
 nd_can_path_a_tt: "Выбрал Северный Доминион" #NT!
 nd_can_path_b_tt: "Выберите великую торговую нацию" #NT!
 nd_can_destiny: "Канадская судьба" #NT!
 nd_can_destiny_desc: "Канада сформирована, и ее ждет новая судьба. Обширная северная дикая местность простирается от Атлантики до Тихого океана, земля безграничных возможностей. Стабилизируйте молодую нацию и подготовьтесь к предстоящим великим начинаниям." #NT!
 nd_can_dest_pacific: "Тихоокеанский предел" #NT!
 nd_can_dest_pacific_desc: "Тихоокеанское побережье манит. Расширьте канадский суверенитет на западное побережье, закрепив залив Нутка на острове Ванкувер, доказав, что северный доминион охватывает континент от моря до моря." #NT!
 nd_can_dest_klondike: "Клондайк" #NT!
 nd_can_dest_klondike_desc: "Северная граница хранит несметные богатства. Вторгнитесь в Юкон и заявите права Канады на золотые прииски Клондайка, превратив дикий север в источник национального богатства и престижа." #NT!
 nd_can_dest_dominion: "Континентальный Доминион" #NT!
 nd_can_dest_dominion_desc: "Явная судьба Канады – господство на континенте. Управляйте континентом от Гудзона до Персидского залива, захватив Нью-Йорк и дельту Миссисипи, превратив северный доминион в главную державу в Америке." #NT!
 nd_can_dest_atlantic: "Североатлантическая торговля" #NT!
 nd_can_dest_atlantic_desc: "Северная Атлантика является естественным коммерческим пространством Канады. Расширьте торговую сеть на юг, обеспечив безопасность китобойных угодий Нантакета, установив канадское доминирование над богатейшими рыбными промыслами в мире." #NT!
 nd_can_dest_caribbean: "Карибская торговля" #NT!
 nd_can_dest_caribbean_desc: "Сахарные острова и торговые центры Карибского бассейна предлагают богатство, превосходящее то, что может обеспечить северная торговля мехом. Обезопасьте Гавану, чтобы закрепить южную торговую сеть и привлечь современные финансовые институты." #NT!
 nd_can_dest_emporium: "Глобальная торговая империя" #NT!
 nd_can_dest_emporium_desc: "Реки Канады когда-то несли только меха. Теперь они должны нести товары мира. Постройте коммерческую империю, настолько обширную, что даже шелк с Востока течет через канадские рынки, превращая северную страну в центр мировой торговли." #NT!
 nd_can.5.t: "Канадская судьба" #NT!
 nd_can.5.d: "Нация родилась в северной пустыне. От рыбацких деревень на атлантическом побережье до меховых застав внутри страны, Канада достигла стабильности, необходимой для реализации более грандиозных амбиций. Вопрос уже не в том, сможет ли эта страна выжить, а в том, какой она станет. Путь вперед требует мужества, дальновидности и готовности построить нечто, чего никогда раньше не существовало, — трансконтинентальную нацию, высеченную на втором по величине участке суши в мире." #NT!
 nd_can.5.a: "Наша судьба ждет." #NT!
 nd_can.6.t: "Тихоокеанский берег" #NT!
 nd_can.6.d: "Канадский суверенитет теперь распространяется на Тихий океан. В Нутка-Саунде, где испанские и британские мореплаватели когда-то оспаривали побережье, канадский флаг развевается над землей, которая завершает образ трансконтинентальной нации. Леса острова Ванкувер дают древесину непревзойденного качества, а защищенные гавани северо-запада Тихого океана открывают пути на рынки Азии. От моря до моря северное владычество является реальностью." #NT!
 nd_can.6.a: "От моря до сияющего моря." #NT!
 nd_can.7.t: "Мастера Северной Атлантики" #NT!
 nd_can.7.d: "Китобойный промысел и промысел трески в Северной Атлантике теперь прочно вошли в коммерческую сферу Канады. От Гранд-Бэнкс до Нантакета канадские корабли и торговцы владеют богатейшими морскими ресурсами в мире. Богатство моря всегда поддерживало эту северную нацию, и теперь ее господство является абсолютным." #NT!
 nd_can.7.a: "Океан дает." #NT!
 nd_can.8.t: "Золото в Клондайке" #NT!
 nd_can.8.d: "Открытие золота на Юконе вызвало поток старателей, искателей приключений и искателей удачи на канадский север. Золотые месторождения Клондайка — самые богатые россыпные месторождения, когда-либо обнаруженные, и теперь вопрос в том, как Канада распорядится этими непредвиденными доходами. Один из подходов состоит в том, чтобы позволить ажиотажу идти своим чередом: безумие добычи наполнит казну, даже если это приведет к инфляции и хаосу. Другой — навести порядок на границе, методично интегрируя новые территории в состав канадского государства, создавая институты, которые просуществуют еще долго после того, как закончится золото." #NT!
 nd_can.8.a: "Пусть золотая лихорадка разгуляется." #NT!
 nd_can.8.b: "Наведите порядок на границе." #NT!
 nd_can.9.t: "Карибские связи" #NT!
 nd_can.9.d: "Поскольку Гавана находится под влиянием Канады, торговые сети Карибского бассейна открыты для эксплуатации. Сахар, табак и тропические товары направляются на север, а канадские пиломатериалы, рыба и промышленные товары направляются на юг. Это новый вид канадской торговли: не торговля мехом в дикой местности, а трехсторонняя торговля империй. Канада может построить военно-морской торговый флот, чтобы силой доминировать на этих маршрутах, или она может создать свободные порты и дипломатические соглашения, которые привлекут торговлю за счет открытости, а не принуждения." #NT!
 nd_can.9.a: "Постройте треугольную сделку." #NT!
 nd_can.9.b: "Создать свободные порты." #NT!
 nd_can.10.t: "Континентальное превосходство" #NT!
 nd_can.10.d: "От Арктики до Мексиканского залива, от Атлантики до Тихого океана мощь Канады распространяется по всему континенту. Великие города восточного побережья и плантации дельты Миссисипи признают господство Канады. Это вершина северного доминиона, континентальной империи, построенной нацией, которая начиналась с нескольких постов по торговле мехом вдоль реки Святого Лаврентия. Теперь вопрос заключается в том, сохранять ли эту империю с помощью военной мощи, выставляя на вооружение армии, которые могут проецировать мощь в любой точке континента, или консолидировать ее посредством управления и дипломатии, строя континентальный мир." #NT!
 nd_can.10.a: "Армия доминиона марширует." #NT!
 nd_can.10.b: "Канадский мир для континента." #NT!
 nd_can.11.t: "Мировой торговый центр" #NT!
 nd_can.11.d: "Шелк на рынках Канады. Сама эта идея показалась бы абсурдной курьерам леса, которые гребли на своих берестяных каноэ по дикой местности в поисках бобровых шкурок. И все же мы здесь, торговая нация, настолько обширная и настолько связанная, что предметы роскоши Востока проходят через наши торговые сети наряду с мехами, рыбой и древесиной, которые построили эту страну. Канада стала тем, чем всегда обещала география: мостом между Атлантическим и Тихоокеанским мирами, торговым перекрестком, где каждый товар находит своего покупателя, а каждый торговец находит возможности." #NT!
 nd_can.11.a: "Управляйте рынками." #NT!
 nd_can.11.b: "Дипломатия открывает все двери." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_gold_rush: "Безумная золотая лихорадка" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_gold_rush: "Золотая лихорадка в Клондайке высвободила поток богатства и амбиций. Десятки тысяч старателей стекаются на Юкон, а золотая пыль течет на юг, наполняя национальную казну, но безумие приводит к инфляции, поскольку золото удешевляет валюту." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_orderly_frontier: "Упорядоченная граница" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_orderly_frontier: "Канадский подход к северной границе носит методический и институциональный характер. В то время как другие страны могут позволить старателям разгуляться, Канада отправляет сначала конную полицию, затем геодезистов, а затем поселенцев. Заказ предшествует прибыли." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_army_dominion: "Армия Доминиона" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_army_dominion: "Канадская армия превратилась в континентальную силу, способную проецировать мощь на огромные расстояния Северной Америки. Штурмовые дивизии, быстрая мобилизация и агрессивная стратегическая доктрина характеризуют эту армию как военную мощь первого порядка, хотя стоимость содержания такой армии обременяет финансы страны." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_pax_canadiana: "Пакс Канадиана" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_pax_canadiana: "Канада достигла континентального господства не посредством бесконечных завоеваний, а благодаря построению прочного мира. Сильные институты, довольные поместья и структура управления, учитывающая многообразие, гарантируют, что то, что было завоевано мечом, останется за пером." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_sugar_triangle: "Сахарный треугольник" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_sugar_triangle: "Канадские купцы построили трехстороннюю торговлю, соединяющую сахарные острова Карибского бассейна, северные рыболовные промыслы и рынки Европы. Королевский военно-морской флот Канады защищает эти морские пути с растущей уверенностью и мастерством." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_free_port: "Дипломатия свободного порта" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_free_port: "Вместо того, чтобы доминировать в карибской торговле с помощью военно-морских сил, Канада создала свободные порты и развивает дипломатические отношения, которые привлекают торговлю за счет открытости. Такой подход обходится дешевле и способствует созданию более прочных коммерческих партнерств." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_commercial_hegemony: "Коммерческая гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_commercial_hegemony: "Канадская коммерческая империя контролирует глобальные рынки. Тяжелые торговые суда под канадским флагом торгуют во всех океанах, и престиж северной торговой нации никогда не был выше, хотя успех порождает самоуспокоенность в правительстве." #NT!
 STATIC_MODIFIER_NAME_nd_can_dest_diplomatic_ascendancy: "Дипломатическое господство" #NT!
 STATIC_MODIFIER_DESC_nd_can_dest_diplomatic_ascendancy: "Коммерческий успех Канады сопровождался дипломатическим мастерством. Послов торговой нации приветствуют во всех судах, к ней обращаются за добрыми услугами в каждом споре, а условия аннексии достаточно щедры, чтобы добиться добровольного подчинения." #NT!
 nd_can_frontier_garrison: "Пограничный гарнизон" #NT!
 nd_can_frontier_garrison_desc: "Укрепленный военный пост, призванный проецировать канадский суверенитет на обширную границу. Эти гарнизоны обеспечивают территориальный контроль северного доминиона, в них размещаются солдаты, обученные как для обычной обороны, так и для ведения пограничной войны." #NT!
 nd_can_garrison_supply: "Гарнизонное снабжение" #NT!
 nd_can_garrison_supply_desc: "Цепочка поставок, обеспечивающая работоспособность пограничных гарнизонов, оружие для солдат, камень для ремонта укреплений и инструменты для бесконечной работы по содержанию военного аванпоста в дикой местности." #NT!
 nd_can_commercial_exchange: "Коммерческая биржа" #NT!
 nd_can_commercial_exchange_desc: "Специально построенный торговый зал, где торговцы со всего мира ведут бизнес в соответствии с канадским законодательством. Биржа концентрирует коммерческую деятельность, стандартизирует контракты и делает канадский рынок наиболее эффективным и надежным в полушарии." #NT!
 nd_can_exchange_operations: "Обменные операции" #NT!
 nd_can_exchange_operations_desc: "Ежедневные операции коммерческого обмена, бумага для контрактов и бухгалтерских книг, ткань для торговых образцов и инструменты для взвешивания и измерения товаров в соответствии со строгими стандартами канадской торговли." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_can_bureaucracy_authority: "Бюрократическая власть Доминиона" #NT!
 AUTO_MODIFIER_DESC_nd_can_bureaucracy_authority: "Англо-французский доминион, объявив о своей институциональной основе, теперь может создать формальную бюрократию для управления королевством. Столица предоставляет одно бюрократическое место; этот орган добавляет еще два." #NT!
  
 can_quebec_act_settlement_bureaucracy: "Урегулирование по Закону Квебека" #NT!
 can_quebec_act_settlement_bureaucracy_desc: "22 июня 1774 года Вестминстерский парламент принял Квебекский акт — имперское соглашение, определившее Канаду на протяжении двух поколений. Закон, составленный по совету губернатора сэра Гая Карлтона, гарантировал свободное исповедание римско-католической религии, восстанавливал право духовенства на сбор десятины, признавал сеньорское владение и Парижский Coutume de Paris в имущественных и гражданских вопросах, а также заменил обещанное выборное собрание в английском стиле назначенным Законодательным советом. Американские колонисты осудили это как один из нетерпимых действий; «Канадиенс», напротив, оставались верными в 1775–1776 годах и снова в 1812 году. Поселение обменяло представительные институты на институциональное сохранение Новой Франции." #NT!
  
 can_hbc_charter_bureaucracy: "Устав компании Гудзонова залива" #NT!
 can_hbc_charter_bureaucracy_desc: "Основанная Карлом II 2 мая 1670 года в качестве губернатора и компании авантюристов Англии, торгующих в Гудзоновом заливе, HBC управляла Землей Руперта (территорией, большей, чем континентальная Европа) от Йоркской фабрики, Мус-фабрики, форта Олбани и Черчилля до 1869 года. После реорганизации сэра Джорджа Симпсона в 1821 году, поглотившей Монреальскую северо-западную компанию, компания управляла частным государством со своими собственными судами. магистраты и легендарная валюта Made Beaver, поддерживаемая лодочниками с Оркнейских островов, ирокезскими гребцами на каноэ из Коннаваги и возчиками-метисами с Ред-Ривер. Книга дивидендов в Лондоне была мерой управления империей во внутренних районах Северной Америки." #NT!
  
 can_family_compact_bureaucracy: "Family Compact и Chateau Clique" #NT!
 can_family_compact_bureaucracy_desc: "Между 1791 и 1841 годами Верхняя и Нижняя Канада на практике управлялись двумя взаимосвязанными назначенными олигархиями. В Верхней Канаде «Семейный договор» собрался вокруг епископа Торонто Джона Страчана, семей Робинсонов и Бултонов, Банка Верхней Канады и истеблишмента англиканской тори, который управлял резервами духовенства. В Нижней Канаде клика Шато (названная в честь резиденции губернатора Шато Сент-Луис в Квебеке) собралась вокруг сеньорских семей, англиканского епископа и шотландских монреальских купцов Джона Молсона и Банка Монреаля. Обе клики доминировали в назначенных Законодательных советах, которые накладывали вето на законы о выборных собраниях и были объектами реформистской агитации, кульминацией которой стало восстание 1837 года." #NT!
  
 can_seigneurial_tenure_bureaucracy: "Сеньорское владение" #NT!
 can_seigneurial_tenure_bureaucracy_desc: "Принесенная в Новую Францию ​​Compagnie des Cent-Associes в 1627 году и подтвержденная земельной политикой кардинала Ришелье, сеньорская система предоставляла полосы фасада Святого Лаврентия сеньорам, которые, в свою очередь, уступали фермерские участки жителям в обмен на ценсы, ренты, барщину и баналиты мельниц, печей и прессов. После капитуляции 1760 года британцы сохранили систему, предусмотренную статьей 4 капитуляции и Актом о Квебеке, а сеньоры (Лотбиньеры, Ташеро, де Салаберри, де Лери) образовывали франко-канадскую половину шато-клики до тех пор, пока Закон об отмене сеньориального владения 1854 года окончательно не выкупил права." #NT!
  
 can_captain_of_militia_bureaucracy: "Капитан милиции" #NT!
 can_captain_of_militia_bureaucracy_desc: "Учрежденный в Новой Франции интендантом Жаном Талоном в 1669 году и оставленный британскими военными губернаторами после 1760 года, капитан де милис был королевским офицером в каждом приходе: выбирался из числа состоятельных жителей, утверждался губернатором и получал задание читать королевские прокламации с церковной паперти по воскресеньям, набирать барщину для королевских дорог, регистрировать приходскую перепись и возглавлять свою приходскую компанию в Милис Канадиенн. Британцы сочли этот офис настолько полезным, что сохранили его во время дивизии 1791 года, мобилизации 1812 года и восстаний 1837–1838 годов; он прекратил свое существование только с профессионализацией муниципального управления в 1850-х годах. Победа Шарля де Салаберри при Шатоге в 1813 году была одержана в основном приходскими компаниями под руководством своих капитанов." #NT!
  
 can_constitutional_assemblies_bureaucracy: "Собрания конституционных актов" #NT!
 can_constitutional_assemblies_bureaucracy_desc: "К 31 Гео. III в. 31 января 1791 года Вестминстерский парламент разделил старую провинцию Квебек вдоль реки Оттава, предоставив каждой новой колонии назначенный Законодательный совет и избранное Законодательное собрание. Это были первые всенародно избранные парламенты к северу от Флориды. Право собственности в размере сорока шиллингов не требовало никаких религиозных тестов, поэтому католики в Нижней Канаде и методисты в Верхней Канаде проголосовали и присутствовали на первых всеобщих выборах. Собрания собирались в Квебеке и Ньюарке (позже Йорке) и отражали политическую карьеру каждого знатного человека той эпохи: Луи-Жозефа Папино в Квебеке, Роберта Болдуина в Торонто, Уильяма Лайона Маккензи в баре Палаты представителей. Они были средоточием политики ответственного правительства до Союза 1841 года." #NT!
