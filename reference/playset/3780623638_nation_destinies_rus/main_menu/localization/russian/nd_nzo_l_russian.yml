l_russian:
 STATIC_MODIFIER_NAME_nd_tiger_banner_of_the_black_mywa: "Тигровое знамя Чёрной Мивы" #NT!
 STATIC_MODIFIER_DESC_nd_tiger_banner_of_the_black_mywa: "Каста воинов Чёрная Майва, из которой произошли правители Наньчжао, вновь подтвердила своё военное господство. Лодзюцзы, Сыны Тигра, снова маршируют в авангарде, их красные шлемы пылают огнем над горной местностью. На каждые сто человек приходится один Сын-Тигр, а каждый Сын-Тигр стоит десяти обычных солдат." #NT!
 STATIC_MODIFIER_NAME_nd_southern_silk_road: "Южный Шелковый путь" #NT!
 STATIC_MODIFIER_DESC_nd_southern_silk_road: "Наньчжао находится на перекрестке империй. Дорога Чайной Лошади доставляет чай Пуэр в Тибет и возвращает лошадей; Южный Шелковый путь соединяет Бирму, Индию и Китай через горные перевалы Юньнани. Купцы и ремесленники Бай превращают это географическое благословение в прочное процветание." #NT!
 STATIC_MODIFIER_NAME_nd_tiger_sons_resurgent: "Возрождение Сынов Тигра" #NT!
 STATIC_MODIFIER_DESC_nd_tiger_sons_resurgent: "Дух победы в войне на Тяньбао пылает в армиях Наньчжао. Сыны Тигра лидируют впереди, и меньшие люди находят смелость в их примере." #NT!
 STATIC_MODIFIER_NAME_nd_diplomatic_equilibrium: "Дипломатическое равновесие" #NT!
 STATIC_MODIFIER_DESC_nd_diplomatic_equilibrium: "Доказав, что даже Тан не может сокрушить королевство силой, Наньчжао ведет переговоры с позиции силы. Баланс между великими державами – это щит Юньнани." #NT!
 STATIC_MODIFIER_NAME_nd_blessings_of_chongsheng: "Благословение Чуншэна" #NT!
 STATIC_MODIFIER_DESC_nd_blessings_of_chongsheng: "Три Пагоды являются вечными хранителями веры и мира. Паломники со всей Азии едут в Чуншэн, и их преданность обогащает как духовную, так и светскую власть королевства." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_irrawaddy: "Лорды Иравади" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_irrawaddy: "Завоевание Пю продемонстрировало способность Наньчжао проецировать власть далеко за пределы своего высокогорного центра. Долина Иравади находится под сенью Знамени Тигра." #NT!
 STATIC_MODIFIER_NAME_nd_pyu_tributary_network: "Приточная сеть Пью" #NT!
 STATIC_MODIFIER_DESC_nd_pyu_tributary_network: "Вместо того, чтобы править только мечом, Наньчжао втягивает завоеванные города Пю в сеть подчиненных отношений. Их богатство течет вверх по течению, а их автономия покупает их лояльность." #NT!
 STATIC_MODIFIER_NAME_nd_tea_horse_prosperity: "Чайная Лошадь Процветания" #NT!
 STATIC_MODIFIER_DESC_nd_tea_horse_prosperity: "Дорога Чайной Лошади — это жизненно важный путь для горной торговли. Юньнаньский чай для тибетских лошадей, китайский шелк для бирманских драгоценностей: караваны никогда не отдыхают, и доходы от пошлин никогда не прекращаются." #NT!
 nd_nzo.1.t: "Восстановление Наньчжао" #NT!
 nd_nzo.1.d: "Разрозненные народы Юньнани вновь объединены под одним знаменем. От берегов озера Эрхай до перевалов гор Айлао королевство, которое когда-то бросило вызов династии Тан и завоевало города Иравади, возрождается.\n\nНо характер этого восстановления еще предстоит определить. Аристократия воинов Черной Мива готова создать королевство посредством завоеваний, как это сделали их предки, когда Лоюцзы, Сыны Тигра, привели армии Наньчжао к победам, которые потрясли величайшую империю на земле. Третьи указывают на положение Юньнани на перекрестке цивилизаций, где сходятся Южный Шелковый путь и Чайная Лошадиная дорога, и утверждают, что торговля и культура создадут более прочное наследие, чем любой меч.\n\nКакой дух будет определять возрожденное королевство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_nzo.1.a: "Поднимите знамя Тигра. Пусть Черная Мива отправится на войну!" #NT!
 nd_nzo.1.b: "Откройте горные перевалы. Пусть караваны принесут процветание!" #NT!
 nd_nzo.2.t: "Наследие войны Тяньбао" #NT!
 nd_nzo.2.d: "В 751 году, когда танский губернатор Цзяннани направил 80 000 солдат в Юньнань, чтобы наказать того, кого он считал мятежным вассалом, король Гелуофэн встретил вторжение в Сягуане. Битва была решающей: танская армия была уничтожена, их губернатор убит, а их амбиции по подчинению Наньчжао были разбиты на целое поколение.\n\nПобеда эхом разнеслась по всей Азии. Это доказало, что высокогорное королевство опытных воинов, сражающееся на знакомой местности, способно подчинить себе даже самую могущественную империю. Война Тяньбао стала основополагающим мифом о независимости Наньчжао: моментом, когда конфедерация горных племен доказала свою суверенную власть.\n\nКак мы будем чтить это наследие?" #NT!
 nd_nzo.2.a: "Сыны Тигра всегда будут вести вперед." #NT!
 nd_nzo.2.b: "Сила приносит уважение, а уважение приносит мир." #NT!
 nd_nzo.3.t: "Три пагоды Чуншэна" #NT!
 nd_nzo.3.d: "Король Цюань Фэнъю заказал величайшее архитектурное достижение в истории Юньнани: Три пагоды храма Чуншэн. Центральная пагода Цяньсюнь возвышается в небо почти на семьдесят метров: это одно из самых высоких сооружений во всем Китае. Вместе с храмовым комплексом из 890 комнат и 11 400 статуй Будды он считается духовным сердцем королевства.\n\nБуддизм Ажали, уникальная тантрическая школа Юньнани, находит здесь свое величайшее выражение. Поклонение Авалокитешваре, Великому Чёрному Дэву и Царю-Хранителю Севера привлекает паломников со всего буддийского мира. Монахи монастыря сохраняют ученость, практикуют медицину и дают советы престолу." #NT!
 nd_nzo.3.a: "Пусть Три Пагоды простоят десять тысяч лет." #NT!
 nd_nzo.4.t: "Завоевание городов-государств Пю" #NT!
 nd_nzo.4.d: "В 830-х годах армии Наньчжао двинулись с высокогорья в долину Иравади, где на протяжении веков процветала древняя цивилизация Пью. Один за другим великие города Пью (Шри Кшетра, Халинги, Биннака) пали под Знаменем Тигра. Королевство Пью, ослабленное внутренними разногласиями, не смогло противостоять натиску.\n\nЭто был не просто набег. Наньчжао увез с собой опытных ремесленников, музыкантов и ученых, обогатив свою культуру достижениями Пю. Завоевание открыло дорогу в Бирму и Индийский океан, превратив Наньчжао из горной державы в региональную империю.\n\nКак мы будем управлять нашими новыми владениями?" #NT!
 nd_nzo.4.a: "Установите Знамя Тигра на берегу Иравади." #NT!
 nd_nzo.4.b: "Свяжите Пью данниками: их богатство служит нам лучше, чем их разорение." #NT!
 nd_nzo.5.t: "Доминион Чайной Лошадиной дороги" #NT!
 nd_nzo.5.d: "Древние караванные пути через Юньнань превратились в одну из величайших торговых артерий Азии. Дорога Чайной Лошади несет чай Пуэр на север, в Тибет и Сычуань, где его обменивают на лошадей, соль и серебро. Южный Шелковый путь соединяет Китай с Бирмой, Индией и другими странами, причем Юньнань является незаменимым промежуточным пунктом.\n\nКараван-сараи усеивают горные перевалы. Купцы Бай ведут торговлю на десятке языков. Доходы от дорожных сборов и транзитные налоги пополняют королевскую казну, а положение Юньнани как посредника между цивилизациями делает ее богаче, чем можно было бы предположить по ее скромной территории." #NT!
 nd_nzo.5.a: "Караваны никогда не будут отдыхать." #NT!
 nd_nzo_luojuzi_tradition: "Традиция Лоюцзы" #NT!
 nd_nzo_luojuzi_tradition_desc: "Лоцзюцзы, «Сыны Тигра», были элитным авангардом Наньчжао. На каждую сотню воинов выбирали сильнейшего. Они носили красные шлемы, кожаные доспехи и бронзовые щиты, но сражались босиком ради скорости и ловкости." #NT!
 nd_nzo_salt_extraction: "Добыча соли в Юньнани" #NT!
 nd_nzo_salt_extraction_desc: "Соляные колодцы усеивали ландшафт Юньнани, обеспечивая важнейший источник дохода, контролируемый короной. Соль и золото добывали во многих частях королевства." #NT!
 nd_nzo_mywa_caste_system: "Кастовая система Мива" #NT!
 nd_nzo_mywa_caste_system_desc: "Общество Наньчжао разделилось на административную Белую Мива на западе Юньнани и милитаристскую Черную Мива на востоке. Эта двухкастовая система обеспечивала как управление, так и военное мастерство." #NT!
 nd_nzo_six_zhaos_legacy: "Наследие Шести Чжао" #NT!
 nd_nzo_six_zhaos_legacy_desc: "В 738 году Пилуоге объединил Шесть Чжао, шесть княжеств западной Юньнани, в единое королевство под признанием Тан. Это объединение создало основу могущества Наньчжао." #NT!
 nd_nzo_azhali_buddhism: "Ажали Буддизм" #NT!
 nd_nzo_azhali_buddhism_desc: "Эзотерическая тантрическая школа, известная как буддизм Ажали, была уникальной для Юньнани и сочетала в себе индийские традиции Ваджраяны с местными духовными практиками и преданностью Авалокитешваре." #NT!
 nd_nzo_highland_warfare: "Хайленд Война" #NT!
 nd_nzo_highland_warfare_desc: "Воины Наньчжао использовали пересеченную местность Юньнани (горные перевалы, долины джунглей и речные ущелья), чтобы побеждать армии, во много раз превосходящие их по численности." #NT!
 nd_nzo_bai_weaving: "Традиция ткачества Бай" #NT!
 nd_nzo_bai_weaving_desc: "Народ Бай разработал особую технику окрашивания хлопчатобумажных и шелковых тканей, создавая узоры, которые стали известны во всем регионе." #NT!
 nd_nzo_elephant_warfare: "Слоновья война" #NT!
 nd_nzo_elephant_warfare_desc: "Вожди Наньчжао отправлялись в бой на боевых слонах. Лакированные доспехи королевства из слоновой шкуры ценились во всем регионе как почти неуязвимые для стрел." #NT!
 nd_nzo_zhunu_crossbows: "Жуну-арбалетные стражники" #NT!
 nd_nzo_zhunu_crossbows_desc: "Красные арбалетчики, Жуну, гвардейские подразделения владели мощными конными арбалетами, которые могли сбить кавалерию на большом расстоянии. Во время осады арбалетный огонь со стен вырубил сотни нападавших." #NT!
 nd_nzo_tianbao_war_legacy: "Наследие войны Тяньбао" #NT!
 nd_nzo_tianbao_war_legacy_desc: "Решающая победа над вторжением Тан в 751 году доказала, что Наньчжао может противостоять самой могущественной империи на земле. Это наследие неповиновения определило идентичность королевства." #NT!
 nd_nzo_three_pagodas: "Три пагоды Чуншэна" #NT!
 nd_nzo_three_pagodas_desc: "Пагода Цяньсюнь и храмовый комплекс Чуншэн с 890 комнатами и 11 400 статуями Будды представляют собой вершину духовных и архитектурных достижений Наньчжао." #NT!
 nd_nzo_copper_mining: "Юньнань Медный горнодобывающий" #NT!
 nd_nzo_copper_mining_desc: "Юньнань обладает крупнейшими запасами меди в Китае. Добыча и выплавка меди была основной отраслью промышленности, производившей сырье для изготовления монет, оружия и церемониальных предметов." #NT!
 nd_nzo_imperial_court: "Императорский двор Культура" #NT!
 nd_nzo_imperial_court_desc: "Когда король Шилун провозгласил себя императором и переориентировал королевство на буддизм, он установил придворную культуру, сочетающую утонченность Тан с традициями Бай." #NT!
 nd_nzo_pyu_conquest: "Завоевание Пью" #NT!
 nd_nzo_pyu_conquest_desc: "В 830-х годах Наньчжао уничтожил древние города-государства Пью в долине Иравади, захватив в плен ремесленников, ученых и музыкантов, которые обогатили культуру королевства." #NT!
 nd_nzo_meng_cavalry_tradition: "Кавалерийские традиции Мэн" #NT!
 nd_nzo_meng_cavalry_tradition_desc: "Клан Мэнше, из которого произошли правители Наньчжао, разводил горных лошадей и обучал кавалерию, искусную в горной войне и быстрых фланговых маневрах." #NT!
 nd_nzo_tea_horse_road: "Дорога Чайной Лошади" #NT!
 nd_nzo_tea_horse_road_desc: "Древний караванный путь, по которому чай Пуэр доставлялся в Тибет и возвращался обратно с лошадьми, стал одной из крупнейших торговых артерий Азии, а Юньнань стал ее незаменимым центром." #NT!
 nd_nzo_lacquered_armor_tradition: "Традиция лакированных доспехов" #NT!
 nd_nzo_lacquered_armor_tradition_desc: "Дали изготовил одни из лучших лакированных кожаных доспехов в Азии, сделанных из слоновой шкуры и обработанных до тех пор, пока они не стали почти такими же твердыми, как железо. Наборы были отправлены ко двору Сун в качестве дипломатических подарков." #NT!
 nd_nzo_yunnan_silversmithing: "Юньнань Серебряное дело" #NT!
 nd_nzo_yunnan_silversmithing_desc: "Серебряные рудники Юньнани и традиции сложной филиграни позволяют производить ювелирные изделия и церемониальные предметы, которые ценятся во всем регионе." #NT!
 nd_nzo_bai_literary_tradition: "Байская литературная традиция" #NT!
 nd_nzo_bai_literary_tradition_desc: "Поэзия и проза Бай, написанные под влиянием китайской литературной традиции, но написанные на языке Бай, достигли выдающихся высот в период Дали." #NT!
 nd_nzo_highland_fortification: "Хайлендское укрепление" #NT!
 nd_nzo_highland_fortification_desc: "Горные крепости Наньчжао использовали естественную местность (узкие перевалы, отвесные скалы и речные ущелья) для создания оборонительных позиций, которые умножали преимущество обороняющихся." #NT!
 nd_nzo_dali_marble_craft: "Дали Мраморное Ремесло" #NT!
 nd_nzo_dali_marble_craft_desc: "Уникальный мрамор, добытый недалеко от Дали, с его уникальными природными узорами ценился в строительстве и художественных целях на юге Китая." #NT!
 nd_nzo_standing_army_reform: "Реформа постоянной армии" #NT!
 nd_nzo_standing_army_reform_desc: "На пике своего развития Наньчжао содержал постоянную армию из 100 000 опытных солдат, подчинявшихся строгим военным законам: выдающееся достижение для горного королевства." #NT!
 nd_nzo_salt_monopoly: "Соляная монополия" #NT!
 nd_nzo_salt_monopoly_desc: "Королевский контроль над соляными колодцами Юньнани обеспечивал надежный источник доходов, который финансировал как двор, так и армию." #NT!
 nd_nzo_multi_ethnic_governance: "Многоэтническое управление" #NT!
 nd_nzo_multi_ethnic_governance_desc: "Разнообразное население Юньнани (бай, И, тай, тибетцы и другие) требовало гибкого управления, которое учитывало бы различные обычаи, сохраняя при этом центральную власть." #NT!
 nd_nzo_puer_tea_mastery: "Мастерство чая Пуэр" #NT!
 nd_nzo_puer_tea_mastery_desc: "Юньнаньский чай Пуэр, выдержанный и спрессованный в кирпичи для транспортировки по Чайной лошадиной дороге, стал одним из самых ценных торговых товаров в Азии." #NT!
 nd_nzo_avalokitesvara_devotion: "Преданность Авалокитешвары" #NT!
 nd_nzo_avalokitesvara_devotion_desc: "Преданность Авалокитешваре (Гуаньинь, богине милосердия) занимала центральное место в буддизме Ажали. Государственная религия объединила различные народы Юньнани под общей духовной идентичностью." #NT!
 nd_nzo_mountain_pass_control: "Контроль горного перевала" #NT!
 nd_nzo_mountain_pass_control_desc: "Горные перевалы Юньнани были естественными перевалочными пунктами как для армий, так и для торговли. Контролировать их означало контролировать доступ ко всей юго-западной границе." #NT!
 nd_nzo_lacquer_guard_tradition: "Лаковая охрана Традиция" #NT!
 nd_nzo_lacquer_guard_tradition_desc: "Элитные войска, облаченные в знаменитые лакированные доспехи из слоновой шкуры, представляли собой вершину военного мастерства Наньчжао, воины были такими же закаленными, как и доспехи, которые они носили." #NT!
 nd_nzo_centralized_administration: "Централизованное администрирование" #NT!
 nd_nzo_centralized_administration_desc: "Корона укрепила контроль над разнообразными провинциями Юньнани, заменив рыхлую конфедерацию раннего периода более централизованным бюрократическим аппаратом." #NT!
 nd_nzo_yunnan_mining_boom: "Юньнаньский горнодобывающий бум" #NT!
 nd_nzo_yunnan_mining_boom_desc: "Обширные месторождения серебра и меди в Юньнани способствовали экономическому буму. Производство серебра в провинции в конечном итоге внесет миллионы таэлей в национальный объем производства Китая." #NT!
 nd_nzo_tea_trade_expansion: "Расширение торговли чаем" #NT!
 nd_nzo_tea_trade_expansion_desc: "По мере того как спрос на чай из Юньнани распространялся по всей Азии, сеть караванных маршрутов расширялась, соединяя все более отдаленные рынки со складами чая Пуэр." #NT!
 nd_nzo_highland_defense_doctrine: "Доктрина обороны Хайленда" #NT!
 nd_nzo_highland_defense_doctrine_desc: "Столетия войн в горах кристаллизовались в формальную доктрину: используйте местность, беспокойте линии снабжения, избегайте генеральных сражений на открытой местности и позвольте горам сражаться за вас." #NT!
 nd_nzo_bai_artistic_renaissance: "Бай Художественный Ренессанс" #NT!
 nd_nzo_bai_artistic_renaissance_desc: "Под централизованным патронажем художники Бай достигли новых высот в живописи, скульптуре, обработке металлов и архитектуре, синтезируя влияния Китая, Тибета и Юго-Восточной Азии." #NT!
 nd_nzo_modern_governance: "Современное управление" #NT!
 nd_nzo_modern_governance_desc: "Традиционные институты Юньнани реформируются, чтобы ответить на вызовы меняющегося мира, балансируя наследие кастовой системы Майва с современной административной эффективностью." #NT!
 nd_nzo_industrial_mining: "Промышленная добыча" #NT!
 nd_nzo_industrial_mining_desc: "Современные технологии преобразуют древнюю горнодобывающую промышленность Юньнани, значительно увеличивая производство меди, серебра, олова и свинца." #NT!
 nd_nzo_bai_scholarship: "Стипендия Бай" #NT!
 nd_nzo_bai_scholarship_desc: "Новое поколение ученых Бай сочетает литературные традиции своих предков с современными методами исследования, создавая работы, имеющие непреходящее значение." #NT!
 nd_nzo_commercial_modernization: "Коммерческая модернизация" #NT!
 nd_nzo_commercial_modernization_desc: "Древние караванные маршруты модернизируются за счет более качественных дорог, стандартизированных мер и весов и официальных коммерческих договоров." #NT!
 nd_nzo_modern_military: "Современная военная техника" #NT!
 nd_nzo_modern_military_desc: "Традиции горной обороны дополняются современной строевой подготовкой, организацией и тактикой, создавая армию, сочетающую в себе опыт работы в горах с современной дисциплиной." #NT!
 nd_nzo_national_identity: "Национальная идентичность Наньчжао" #NT!
 nd_nzo_national_identity_desc: "Разнообразные народы Юньнани формируют общее национальное сознание, опираясь на наследие шести объединенных чжао, Трех пагод и Чайной лошадиной дороги." #NT!
 a_nd_nzo_luojuzi: "Лоюцзы" #NT!
 a_nd_nzo_luojuzi_desc: "Сыны Тигра, элитный авангард Наньчжао. Из каждой сотни солдат выбираются по одному, они носят красные шлемы, кожаные доспехи и бронзовые щиты и сражаются босиком за скорость." #NT!
 a_nd_nzo_war_elephant: "Боевой слон Наньчжао" #NT!
 a_nd_nzo_war_elephant_desc: "Вожди отправлялись в бой на бронированных слонах, их лакированные доспехи из слоновой шкуры отражали стрелы и копья. Одно только психологическое воздействие было разрушительным." #NT!
 a_nd_nzo_crossbow_guard: "Жуну-Арбалетный Страж" #NT!
 a_nd_nzo_crossbow_guard_desc: "Гвардейцы Красного Арбалета, вооруженные мощными конными арбалетами, преуспели как в полевом бою, так и в обороне при осаде в горах Юньнани." #NT!
 a_nd_nzo_meng_cavalry: "Мэн Кавалерия" #NT!
 a_nd_nzo_meng_cavalry_desc: "Горные всадники правящего клана Мэнше, обученные ведению горной войны. Быстрые фланкеры, которые используют местность, которая вредит более тяжелой кавалерии." #NT!
 a_nd_nzo_yunnan_garrison: "Юньнаньский гарнизон пехоты" #NT!
 a_nd_nzo_yunnan_garrison_desc: "Профессиональные солдаты постоянной армии Наньчжао, экипированные и обученные в соответствии со строгими военными законами. Выносливые горные бойцы, которые устоят перед любым нападением." #NT!
 a_nd_nzo_lacquer_guard: "Дали Лак Гард" #NT!
 a_nd_nzo_lacquer_guard_desc: "Элитная пехота, облаченная в знаменитые лакированные доспехи из слоновой шкуры, почти такие же твердые, как железо, но более легкие и гибкие. Лучшие солдаты Юньнани." #NT!
 nd_nzo_salt_wells: "Солт-Уэллс" #NT!
 nd_nzo_salt_wells_desc: "Объекты по добыче богатых соляных месторождений Юньнани, важнейшего источника дохода, контролируемого короной со времен первых королей Наньчжао." #NT!
 nd_nzo_chongsheng_monastery: "Монастырь Чуншэн" #NT!
 nd_nzo_chongsheng_monastery_desc: "Величественный буддийский храмовый комплекс, созданный по образцу исторического храма Чуншэн с тремя пагодами: духовное сердце королевств Наньчжао и Дали." #NT!
 nd_nzo_copper_smelter: "Медеплавильный завод" #NT!
 nd_nzo_copper_smelter_desc: "Объекты по добыче и плавке огромных медных месторождений Юньнани: крупнейшие запасы в Китае, удовлетворяющие ненасытный спрос на монеты и оружие." #NT!
 nd_nzo_silver_workshop: "Серебряная мастерская" #NT!
 nd_nzo_silver_workshop_desc: "Ремесленная мастерская Бай, специализирующаяся на замысловатых серебряных филигранных украшениях: ремесленная традиция, которая прославила Дали в провинции Юньнань и за ее пределами." #NT!
 nd_nzo_workshop_upkeep: "Базовое серебро" #NT!
 nd_nzo_workshop_upkeep_desc: "Простые серебряные изделия, изготовленные мастерами Бай с использованием угольных печей и традиционной техники ковки." #NT!
 nd_nzo_caravanserai: "Караван-сарай" #NT!
 nd_nzo_caravanserai_desc: "Остановки для отдыха и торговые посты вдоль Чайного пути и Южного Шелкового пути, где купцы из Китая, Тибета, Бирмы и Индии обмениваются товарами и информацией." #NT!
 nd_nzo_lacquer_armory: "Лаковая Оружейная палата" #NT!
 nd_nzo_lacquer_armory_desc: "Мастерские, производящие знаменитые лакированные доспехи Дали из слоновой шкуры: обработанные и закаленные до такой же прочности, как железо, но при этом более легкие и гибкие." #NT!
 nd_nzo_puer_warehouse: "Склад чая Пуэр" #NT!
 nd_nzo_puer_warehouse_desc: "Хранилища для выдержки и прессования ценного чая Пуэр в Юньнани в кирпичи для транспортировки по Чайной Лошадиной дороге." #NT!
 nd_nzo_azhali_temple: "Храм Ажали" #NT!
 nd_nzo_azhali_temple_desc: "Уникальный для Юньнани храм тантрической буддийской школы Ажали, посвященный Авалокитешваре и Великому Чёрному Дэву." #NT!
 nd_nzo_salt_processing_pm: "Соль Кипящая" #NT!
 nd_nzo_salt_processing_pm_desc: "Рассол из соляных колодцев кипятят на дровах в глиняных испарителях для получения кристаллов соли." #NT!
 nd_nzo_monastery_maintenance: "Монашеское содержание" #NT!
 nd_nzo_monastery_maintenance_desc: "Для поддержания храмового комплекса необходимы постоянные поставки обработанного камня, древесины, свечей из пчелиного воска и бумаги для Священных Писаний." #NT!
 nd_nzo_smelting_pm: "Медеплавильное производство" #NT!
 nd_nzo_smelting_pm_desc: "Сырая медная руда выплавляется в облицованных камнем угольных печах традиционным юньнаньским методом." #NT!
 nd_nzo_caravan_supply_pm: "Обеспечение караванов" #NT!
 nd_nzo_caravan_supply_pm_desc: "Обеспечение вьючными животными, зерновым фуражом, солевым пайком и кожаными шорными изделиями для торговых караванов, пересекающих горные перевалы." #NT!
 nd_nzo_lacquer_workshop_pm: "Лаковая броня" #NT!
 nd_nzo_lacquer_workshop_pm_desc: "Слоновью шкуру разрезают, дублят красками и лаком, а затем закаливают в броневые пластины, пригодные для оружия с бронзовыми наконечниками." #NT!
 nd_nzo_tea_aging_pm: "Выдержка чая" #NT!
 nd_nzo_tea_aging_pm_desc: "Листья чая Пуэр прессуют в кирпичи с помощью деревянных инструментов, хранят в глиняных кувшинах и выдерживают, чтобы приобрести характерный аромат." #NT!
 nd_nzo_temple_offerings_pm: "Храмовые подношения" #NT!
 nd_nzo_temple_offerings_pm_desc: "Благовония, свечи из пчелиного воска и алтарные украшения из тонкой ткани поддерживают ежедневные ритуалы и церемонии буддийского поклонения Азали." #NT!
 nd_nzo_bai_tiedye_pm: "Бай Тай-Дай" #NT!
 nd_nzo_bai_tiedye_pm_desc: "Отличительная техника окраски тай-дай Бай связывает ткани с помощью резистивных волокон, погружает их в натуральные красители и создает узорчатые ткани, передаваемые из поколения в поколение." #NT!
 nd_nzo_silver_filigree_pm: "Серебряная Филигрань" #NT!
 nd_nzo_silver_filigree_pm_desc: "Мастера-серебряники создают замысловатые филигранные украшения и церемониальные предметы, превращая богатое серебро Юньнани в ценные произведения искусства." #NT!
 nd_nzo_marble_working_pm: "Дали Мраморная обработка" #NT!
 nd_nzo_marble_working_pm_desc: "Мрамор с уникальным рисунком, добытый недалеко от Дали, разрезается железными инструментами и деревянными лесами, а затем полируется и превращается в строительные материалы и декоративные детали." #NT!
 levy_nd_nzo_luojuzi: "Луоюзи Леви" #NT!
 levy_nd_nzo_luojuzi_desc: "Сыны Тигра, выросшие из простых солдат: самый сильный из каждой сотни." #NT!
 levy_nd_nzo_meng_cavalry: "Кавалерийский сбор Мэн" #NT!
 levy_nd_nzo_meng_cavalry_desc: "Горные всадники, выросшие из благородного класса воинов правящего клана Мэнше." #NT!
 nd_nzo_crown_salt_pm: "Администрация королевской соли" #NT!
 nd_nzo_crown_salt_pm_desc: "Контролируемое государством производство соли с использованием методов интенсивного кипячения и глиняных выпарных котлов - королевская монополия, которая финансирует как двор, так и армию." #NT!
 nd_nzo_devotional_crafts_pm: "Религиозные ремесла" #NT!
 nd_nzo_devotional_crafts_pm_desc: "Ритуальные благовония, серебряные церемониальные предметы, свечи из пчелиного воска и изысканные тканевые облачения поддерживают ежедневные обряды буддийского поклонения Ажали." #NT!
 nd_nzo_tea_brick_pm: "Обработка чайного кирпича" #NT!
 nd_nzo_tea_brick_pm_desc: "Листья чая Пуэр обрабатываются паром, прессуются в кирпичи с помощью деревянных прессов, заворачиваются в бумагу для экспорта и выдерживаются на Чайной Лошадиной дороге." #NT!
 nd_nzo_bai_painting_pm: "Бай Живопись" #NT!
 nd_nzo_bai_painting_pm_desc: "Художественная традиция Бай живописи на шелке и бумаге, сочетающая китайский, тибетский и местный стили." #NT!
 nd_nzo_formed_tt: "Наньчжао был основан" #NT!
 nd_nzo_path_a_tt: "Выбрать Тигровое знамя Черной Мивы" #NT!
 nd_nzo_path_b_tt: "Выбрали Южный шелковый путь" #NT!
 nd_nzo_destiny: "Судьба Наньчжао" #NT!
 nd_nzo_destiny_desc: "Королевство возрождается, но его судьба еще не написана. Стабилизируйте королевство и выберите путь, который будет определять Наньчжао для поколений." #NT!
 nd_nzo_dest_shan_conquest: "Завоевание Шанских государств" #NT!
 nd_nzo_dest_shan_conquest_desc: "Шанское нагорье к востоку от Юньнани раздроблено мелкими правителями. Чтобы расширить охват Знамени Тигра, возьмите Кенгтун и Хсенви под власть Наньчжао и соберите армию, достойную Черной Мива." #NT!
 nd_nzo_dest_irrawaddy_empire: "Империя Иравади" #NT!
 nd_nzo_dest_irrawaddy_empire_desc: "Древние города Пью в долине Иравади однажды пали перед армиями Наньчжао. Повторите этот подвиг, завоевав Пэган и Татон, построив империю, простирающуюся от нагорья Юньнани до моря." #NT!
 nd_nzo_dest_tiger_empire: "Империя Тигров" #NT!
 nd_nzo_dest_tiger_empire_desc: "Окончательное видение Черной Мивы: империя, которая доминирует как в плодородном бассейне Сычуани, так и в низменностях Иравади. Возьмите Чэнду и Сагаинг, чтобы контролировать две великие речные системы материка." #NT!
 nd_nzo_dest_tea_horse_dominion: "Чайная Лошадь Доминион" #NT!
 nd_nzo_dest_tea_horse_dominion_desc: "Дорога Чайной Лошади соединяет Юньнань с Тибетом, неся чай Пуэр на север, а лошадей на юг. Расширьте коммерческое влияние Наньчжао до самой Лхасы и накопите сокровищницу, достойную Южного Шелкового пути." #NT!
 nd_nzo_dest_crossroads_of_asia: "Перекресток Азии" #NT!
 nd_nzo_dest_crossroads_of_asia_desc: "Юньнань находится на стыке цивилизаций Китая, Индии, Тибета и Юго-Восточной Азии. Расширьте торговую сеть до Ангкора, освойте современное банковское дело и превратите королевство в коммерческий перекресток Азии." #NT!
 nd_nzo_dest_emporium_of_asia: "Торговый центр Азии" #NT!
 nd_nzo_dest_emporium_of_asia_desc: "Южный Шелковый путь от Вьентьяна до Гуанчжоу соединяет Индийский океан с Южно-Китайским морем. Контролируйте обе конечные точки, развивайте королевство, превосходя всех конкурентов, и постройте величайшую торговую империю, которую когда-либо видела материковая Азия." #NT!
 nd_nzo.6.t: "Судьба Наньчжао" #NT!
 nd_nzo.6.d: "Королевство восстановлено, его народ объединился под старым знаменем. Фундамент заложен, теперь вопрос в том, что на нем строить. Воины Черной Мива точат свои клинки, а торговцы Бай считают свое серебро. Оба пути ведут к славе, но совершенно разной." #NT!
 nd_nzo.6.a: "Наша судьба начинается сейчас." #NT!
 nd_nzo.7.t: "Шанские государства подчиняются" #NT!
 nd_nzo.7.d: "Раздробленные княжества Шан были поставлены под контроль. От долин Кенгтунга до высокогорья Хсенви теперь развевается Знамя Тигра там, где когда-то дюжина мелких лордов ссорилась из-за объедков. Вожди Шан преклоняют колени перед троном Наньчжао, и их воины пополняют наши ряды.\n\nЭто только начало. Долина Иравади манит на юг: древняя дорога к империи, по которой шли наши предки, когда они уничтожили Пью и потрясли основы мира." #NT!
 nd_nzo.7.a: "Шанцы поклоняются Знамени Тигра." #NT!
 nd_nzo.8.t: "Знамя Тигра над Бирмой" #NT!
 nd_nzo.8.d: "Пэган пал. Тэтон пал. Великие города долины Иравади, которые когда-то принадлежали Пью, прежде чем наши предки стерли их с лица земли, снова принадлежат нам. Призрак короля Цюань Фэню улыбается с небес, когда Знамя Тигра водружается на берегах реки, питающей Бирму.\n\nИмперия теперь простирается от высокогорья Юньнани до низменностей дельты Иравади. Но империями нужно управлять, а также завоевывать их. Как нам консолидировать эти огромные новые территории?" #NT!
 nd_nzo.8.a: "Двигайтесь вперед: Сыны Тигра останавливаются напрасно." #NT!
 nd_nzo.8.b: "Укрепить то, что мы держим, и нарастить силу." #NT!
 nd_nzo.9.t: "Империя Тигров" #NT!
 nd_nzo.9.d: "Чэнду и Сагаинг стоят под Знаменем Тигра. Плодородный бассейн Сычуани, житница Китая, питает нашу казну, а низменности Иравади обеспечивают наше господство над материковой Юго-Восточной Азией. Ни одно высокогорное королевство в истории не достигло того, что построил Наньчжао: империи, охватывающей две великие речные системы материковой Азии.\n\nЧерные Мива мечтали об этом на протяжении поколений. Теперь мы должны определить характер империи, которую мы создали. Останется ли меч нашим инструментом, или институты управления закалят клинок?" #NT!
 nd_nzo.9.a: "Меч построил эту империю: меч поддержит ее." #NT!
 nd_nzo.9.b: "Империя требует управления, а не просто завоеваний." #NT!
 nd_nzo.10.t: "Чайная конная дорога — наша" #NT!
 nd_nzo.10.d: "Лхаса, крыша мира, теперь торгуется через наши руки. Дорога Чайной Лошади, древняя артерия, по которой чай Пуэр в Тибет возвращает лошадей и серебро, полностью принадлежит Наньчжао. От чайных плантаций Симао до монастырей центрального Тибета — каждый кирпичик прессованного чая и каждый тибетский пони проходят через нашу территорию.\n\nКараван-сараи полны, мытарства переполнены, а торговцы Бай улыбаются, подсчитывая выгоды от географии." #NT!
 nd_nzo.10.a: "Караваны принесут нам богатства мира." #NT!
 nd_nzo.11.t: "Перекресток Азии" #NT!
 nd_nzo.11.d: "То, что началось с контроля горного королевства над несколькими караванными путями, превратилось в нечто экстраординарное. Торговая сеть Наньчжао теперь простирается от чайных плантаций Юньнани до храмов Ангкора. Китайский шелк, тибетское серебро, бирманские драгоценные камни и кхмерские специи проходят через наши рынки.\n\nКупцы Бай ведут торговлю на дюжине языков. Банковские дома столицы держат депозиты трейдеров со всего континента. Юньнань стал тем, чем всегда была задумана география: перекрестком Азии." #NT!
 nd_nzo.11.a: "Расширяйте сеть: больше торговцев, больше маршрутов." #NT!
 nd_nzo.11.b: "Инвестируйте в наших ремесленников и интегрируйте наши народы." #NT!
 nd_nzo.12.t: "Торговый центр Азии" #NT!
 nd_nzo.12.d: "От Вьентьяна до Гуанчжоу Южный Шелковый путь принадлежит нам. Через территорию Наньчжао проходит крупнейшая торговая артерия материковой Азии, соединяющая торговлю Индийского океана с Южно-Китайским морем. Ни один торговец не пересекает наши границы, не оставив после себя серебра.\n\nТорговая диаспора Бай охватывает весь континент. Наши рынки устанавливают цены, которые должны принимать торговцы в Кантоне и Калькутте. Королевство, зародившееся как шесть горных вождей, стало торговым центром Азии." #NT!
 nd_nzo.12.a: "Пусть все страны придут торговать на наши рынки." #NT!
 nd_nzo.12.b: "Купцы разделят власть с троном." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_tiger_march: "Тигровый марш" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_tiger_march: "Сыны Тигра без пауз ведут армию вперед. Враги подчиняются или отбрасываются в сторону. Темп завоеваний напрягает казну и людей, но Черные Мива не знают другого пути." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_highland_consolidation: "Хайленд Консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_highland_consolidation: "Империя делает паузу, чтобы переварить свои завоевания. Прибывают подкрепления, создаются гарнизоны, а наемники пополняют армию, пока горное ядро ​​восстанавливается." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_sword_emperor: "Меч Императора" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_sword_emperor: "Император правит мечом и посредством воинской знати. Благородные рекруты пополняют армию, и новое боевое оружие гремит по полю битвы, хотя стоимость бесконечного расширения истощает казну." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_highland_mandate: "Хайленд Мандат" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_highland_mandate: "Империя принимает атрибуты законного управления. Король-воин становится императором с мандатом, которого признают и боятся все великие державы мира." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_merchant_network: "Торговая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_merchant_network: "Торговцы Бай расходятся по всему континенту, открывая торговые посты и дипломатические связи. Каждый новый маршрут приносит новые партнерские отношения, а влияние Юньнани распространяется через серебро, а не сталь." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_artisan_guilds: "Гильдии ремесленников" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_artisan_guilds: "Королевство инвестирует в свое разнообразное население. Серебряные мастера Бай, ткачи И, гончары Тай: все они находят себе место в процветающих гильдиях, которые укрепляют социальную структуру и одновременно обогащают казну." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_world_emporium: "Всемирный торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_world_emporium: "Рынки Наньчжао приветствуют торговцев всех наций и вероисповеданий. Буддийские монастыри благославляют торговлю, компании наемников защищают дороги, а исследователи королевства ищут все более отдаленных партнеров." #NT!
 STATIC_MODIFIER_NAME_nd_nzo_dest_merchant_kings: "Торговые короли" #NT!
 STATIC_MODIFIER_DESC_nd_nzo_dest_merchant_kings: "Старая воинственная знать уступает место новой торговой аристократии. Богатство бюргеров и власть гильдий меняют институты королевства, а храмовое духовенство выступает посредником между короной и торговлей." #NT!
 nd_nzo_imperial_war_camp: "Имперский военный лагерь" #NT!
 nd_nzo_imperial_war_camp_desc: "Укрепленный командный пункт для координации кампаний по всей обширной Империи Тигров, сочетающий в себе дизайн горной крепости с логистикой, необходимой для проецирования силы от Юньнани до Сычуани и Иравади." #NT!
 nd_nzo_war_camp_maintenance: "Операции в военном лагере" #NT!
 nd_nzo_war_camp_maintenance_desc: "Для содержания имперского военного лагеря необходимы постоянные поставки оружия, боевых коней, древесины для укреплений и кожи для снаряжения." #NT!
 nd_nzo_crossroads_emporium: "Торговый центр «Перекресток»" #NT!
 nd_nzo_crossroads_emporium_desc: "Большой торговый зал, где купцы из Китая, Тибета, Бирмы, Индии и Юго-Восточной Азии сходятся для обмена товарами под защитой Наньчжао и получения прибыли." #NT!
 nd_nzo_emporium_maintenance: "Операции в торговом центре" #NT!
 nd_nzo_emporium_maintenance_desc: "Для работы торгового центра требуется ткань для рыночных прилавков, бумага для бухгалтерских книг и контрактов, чай для торговцев и инструменты для взвешивания и измерения." #NT!
  
 qingping_council_bureaucracy: "Совет Цинпин" #NT!
 qingping_council_bureaucracy_desc: "Цинпин гуань (шесть главных министров, выбранных из ведущих кланов конфедерации Шести Чжао) сформировали высший консультативный кабинет королей Наньчжао, созданный по образцу практики канцелярии Тан, но адаптированный к реалиям горной аристократии. Совет обсуждал вопросы войны, налогообложения и посольства, ревниво исключая торговцев и посторонних из централизованного принятия решений. Его сила заключалась в легитимизации королевских указов посредством аристократического консенсуса; его слабость заключалась в замедлении распространения контроля короны на низменности и счетные палаты." #NT!
  
 acharya_master_state_bureaucracy: "Ачарья-Господин-Государство" #NT!
 acharya_master_state_bureaucracy_desc: "Тантрические буддийские мастера Ажали (阿吒力) служили Королевству Дали в 937–1253 годах не только в качестве служителей ритуалов, но и в качестве писцов, архивариусов и канцелярских клерков, укомплектовавших королевскую администрацию. Их власть протекала по линии передачи мастер-ученик, а не по рождению, нарушая монополию старых аристократических кланов на грамотные должности. Поддерживаемое государство ачарьев распространяет грамотность и объединяет покоренные народы посредством общих ритуалов; пренебрегая, он просто укрепляет духовенство, которое вытеснило дворян, не управляя вместо них." #NT!
  
 tusi_chieftaincy_bureaucracy: "Система вождя Туси" #NT!
 tusi_chieftaincy_bureaucracy_desc: "Система туси (土司), формализованная при Юане и усиленная Мин, признавала потомственных местных вождей народов И, Бай, Хмонг и Тай местными администраторами королевства в обмен на дань и сборы. Система создала грозные горные армии и дешево умиротворила границы, но каждое поколение подтвержденного наследства превращало вождей в параллельную власть, которую трон не мог безопасно разрушить. Разрушение системы не ослабляет вождей: это просто истощает центральные регистры, которые когда-то отслеживали их." #NT!
  
 chamasi_tea_horse_office_bureaucracy: "Офис Чай-Хорс (Чамаси)" #NT!
 chamasi_tea_horse_office_bureaucracy_desc: "С конца Тан до эпохи Мин чамаси (茶馬司) была государственной монополией, регулирующей трансграничную торговлю чаем за лошадей вдоль Чайной лошадиной дороги через Юньнань. Чиновники облагали налогом караваны, устанавливали обменные курсы между кирпичным чаем и приграничными горами и лицензировали одобренные торговые дома, захватывая для трона богатства одного из самых прибыльных торговых путей средневековой Азии. Действующий чамаси превращает Южный Шелковый путь в финансовую артерию; упадок порождает сети контрабанды, пограничные набеги на недостаточно охраняемые караваны и потерю пошлин." #NT!
  
 AUTO_MODIFIER_NAME_nd_nzo_bureaucracy_authority: "Бюрократическое управление Наньчжао" #NT!
 AUTO_MODIFIER_DESC_nd_nzo_bureaucracy_authority: "При формировании королевству предоставляются рамки постоянного административного офиса. В сочетании с постоянной столичной канцелярией это открывает два места, в которых правитель может устанавливать исторические институты управления." #NT!
