l_russian:
  
  # === FORMATION EVENT === 
 nd_cth.1.t: "Возрождение Карфагена" #NT!
 nd_cth.1.d: "Древний город возрождается вновь. Там, где когда-то финикийские торговцы построили талассократию, которая могла соперничать с самим Римом, теперь новый Карфаген господствует на перекрестке Средиземноморья. Древние котонские гавани, возможно, лежат в руинах, но дух Баал-Хаммона и наследие Ганнибала Барки волнуются в сердцах нашего народа.\n\nДва видения борются за душу этой возрожденной нации. Сможем ли мы вернуть моря, как это сделали наши предки: мастера торговли, кораблестроения и морского владычества от Геркулесовых столбов до берегов Сицилии? Или нам следует создать континентальную империю, достойную генералов Баркидов, опираясь на разнообразные народы Африки и Иберии, как это всегда делал Карфаген: не с помощью гражданских армий, а с помощью дисциплинированной силы рекрутированных наций?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_cth.1.a: "Управляйте морями, как это делали наши предки" #NT!
 nd_cth.1.b: "Постройте империю, достойную Баркидов." #NT!
  
  # === FORMATION CHOICE MODIFIERS === 
 STATIC_MODIFIER_NAME_nd_cth_thalassocracy: "Пуническая талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_cth_thalassocracy: "Карфаген управляет Средиземноморьем с помощью тех же инструментов, которые построили первоначальную Пуническую империю: непревзойденное мореплавание, обширные торговые сети и коммерческое богатство, которое они создают." #NT!
 STATIC_MODIFIER_NAME_nd_cth_punic_imperium: "Пуническая Империя" #NT!
 STATIC_MODIFIER_DESC_nd_cth_punic_imperium: "Следуя традициям Гамилькара и Ганнибала, новый Карфаген строит свою мощь за счет военного мастерства: набирает лучших воинов из подчиненных народов и превращает их в дисциплинированный инструмент завоевания." #NT!
  
  # === ADVANCE EVENT 2: TOPHET === 
 nd_cth.2.t: "Освящение Тофета" #NT!
 nd_cth.2.d: "На древнем участке Саламбо, где до сих пор стоят тысячи стел с надписью Баал-Хаммон и Танит, снова горит священное пламя. Тофет (самый священный и наиболее обсуждаемый из карфагенских институтов) был восстановлен как духовное сердце возрожденной нации.\n\nНезависимо от того, хранили ли урны когда-то прах принесенных в жертву первенцев или просто мертворожденных детей, отданных богам, сила Тофета как символа пунической преданности не подлежит сомнению. Треугольный знак Танит, высеченный на свежем камне, возвещает всем прохожим: Карфаген помнит своих богов." #NT!
 nd_cth.2.a: "Боги Карфагена охраняют нас" #NT!
  
  # === ADVANCE EVENT 3: COTHON DOCKS === 
 nd_cth.3.t: "Возрождение пунической инженерии" #NT!
 nd_cth.3.d: "Древний котон (чудо карфагенского инженерного искусства) был восстановлен. Первоначальные гавани Карфагена были чудом древнего мира: внешний прямоугольный бассейн для торговых судов и внутренняя круглая гавань для военного флота, способные принять двести двадцать военных кораблей на крытых причалах, расположенных вокруг центрального адмиралтейского острова.\n\nНаши инженеры изучили то, что осталось от этих сооружений, и заново применили их принципы. Хотя масштабы могут быть разными, гениальность одна и та же: защищенные внутренние гавани, где корабли можно строить, ремонтировать и спускать на воду со скоростью и эффективностью, с которыми не может сравниться ни один открытый рейд." #NT!
 nd_cth.3.a: "Котон снова поднимается" #NT!
  
  # === ADVANCE EVENT MODIFIERS === 
 STATIC_MODIFIER_NAME_nd_cth_baal_hammon_blessing: "Благословение Баал-Хаммона" #NT!
 STATIC_MODIFIER_DESC_nd_cth_baal_hammon_blessing: "Древние боги Карфагена улыбаются восстановленному Тофету. Религиозная преданность укрепляет связи пунического общества." #NT!
 STATIC_MODIFIER_NAME_nd_cth_punic_engineering: "Пуническое инженерное наследие" #NT!
 STATIC_MODIFIER_DESC_nd_cth_punic_engineering: "Возрождение строительства котонских гаваней дает Карфагену преимущество в строительстве и судостроении, что отражает его древнее морское превосходство." #NT!
  
  # === DESTINY VARIABLES === 
 nd_cth_formed_tt: "Карфаген возродился" #NT!
 nd_cth_path_a_tt: "Путь Талассократии" #NT!
 nd_cth_path_b_tt: "Путь Пунической Империи" #NT!
  
  # === ADVANCES === 
 nd_cth_tophet_cult: "Культ Баал-Хаммона" #NT!
 nd_cth_tophet_cult_desc: "Восстановление Тофета как центра пунического поклонения, почитающего древних богов Баал-Хаммона и Танит посредством ритуалов и преданности." #NT!
 nd_cth_sacred_band_tradition: "Традиция Священного оркестра" #NT!
 nd_cth_sacred_band_tradition_desc: "Опираясь на наследие элитных гражданских солдат Карфагена, Священного отряда, сражавшегося в составе тяжелой пехоты в древних фаланговых формированиях." #NT!
 nd_cth_tyrian_purple: "Тириан Пурпурный" #NT!
 nd_cth_tyrian_purple_desc: "Возрождение древнего финикийского ремесла по извлечению пурпурного красителя из морских улиток-мюрекс и производству легендарной тирийской пурпурной ткани, которая когда-то стоила дороже золота." #NT!
 nd_cth_triple_wall: "Тройные стены укреплений" #NT!
 nd_cth_triple_wall_desc: "Мощные тройные стены, которые когда-то защищали Карфаген (три концентрические стены с конюшнями для боевых слонов и казармами внутри), вдохновляют на создание укреплений нового поколения." #NT!
 nd_cth_cothon_docks: "Котон Харбор Инжиниринг" #NT!
 nd_cth_cothon_docks_desc: "Реконструкция котона: защищенной системы внутренней гавани, которая была жемчужиной карфагенской военно-морской техники, с крытыми причалами и ремонтными мастерскими." #NT!
 nd_cth_numidian_cavalry: "Нумидийская кавалерийская традиция" #NT!
 nd_cth_numidian_cavalry_desc: "Набор и обучение нумидийских легких всадников, которые ездят без узды и метают копья со смертельной точностью: лучшая легкая кавалерия древнего Средиземноморья." #NT!
 nd_cth_phoenician_glass: "Финикийское стеклоделие" #NT!
 nd_cth_phoenician_glass_desc: "Финикийцы были легендарными мастерами по стеклу, и Карфаген унаследовал их методы, производя полупрозрачные стеклянные сосуды, цветные бусы и декоративные изделия, ценимые во всем Средиземноморье." #NT!
 nd_cth_council_of_elders: "Совет старейшин" #NT!
 nd_cth_council_of_elders_desc: "Карфагенский сенат (Совет старейшин) управлял путем обсуждения и консенсуса, обеспечивая стабильное управление и тщательное государственное управление." #NT!
 nd_cth_libyan_infantry_reforms: "Реформы ливийской пехоты" #NT!
 nd_cth_libyan_infantry_reforms_desc: "Реорганизация подчиненной ливийской пехоты в дисциплинированные копейные формирования, оснащенные бронзовыми шлемами и щитами из асписов на манер старой пунической тяжелой пехоты." #NT!
 nd_cth_naval_rams: "Тактика военно-морского тарана" #NT!
 nd_cth_naval_rams_desc: "Развитие квинкеремы (пятигранного военного корабля, являвшегося визитной карточкой Карфагена), вооруженного разрушительным бронзовым тараном на носу." #NT!
 nd_cth_punic_literacy: "Пуническая литературная традиция" #NT!
 nd_cth_punic_literacy_desc: "Хотя большая часть пунической литературы была уничтожена вместе с Карфагеном, возрождение пунического письма и научной традиции сохраняет знания сельскохозяйственных трактатов Маго и путешествий Ганнона." #NT!
 nd_cth_carthaginian_diplomacy: "Карфагенская дипломатия" #NT!
 nd_cth_carthaginian_diplomacy_desc: "Дипломатическая традиция Карфагена: сеть договоров, торговых соглашений и разведывательных сетей, которые когда-то простирались от Оловянных островов до побережья Западной Африки." #NT!
 nd_cth_royal_purple_monopoly: "Королевская фиолетовая монополия" #NT!
 nd_cth_royal_purple_monopoly_desc: "Государственный контроль над прибыльной торговлей фиолетовыми красками, обеспечивающий монополию Карфагена на самый престижный предмет роскоши в средиземноморском мире." #NT!
 nd_cth_mediterranean_dominance: "Средиземноморское военно-морское господство" #NT!
 nd_cth_mediterranean_dominance_desc: "Карфагенское господство в центральном Средиземноморье, контроль над морскими путями между Африкой, Сицилией и Сардинией посредством превосходного мореплавания и тактики галер." #NT!
 nd_cth_punic_urban_planning: "Пуническое городское планирование" #NT!
 nd_cth_punic_urban_planning_desc: "Систематическая планировка карфагенских городов: регулярная сетка улиц, многоэтажные острова, сложная дренажная система и тщательное зонирование коммерческих и жилых районов." #NT!
 nd_cth_mercenary_reforms: "Реформы наемной армии" #NT!
 nd_cth_mercenary_reforms_desc: "Реструктуризация полиглотических наемных сил Карфагена в организованные контингенты со стандартизированной логистикой, привлекающие иберийских, галльских, ливийских и нумидийских рекрутов." #NT!
 nd_cth_punic_military_reform: "Пуническая военная реформа" #NT!
 nd_cth_punic_military_reform_desc: "Комплексная реструктуризация карфагенской армии, переход от использования банд наемников к созданию профессиональных постоянных сил со стандартным оборудованием и подготовкой." #NT!
 nd_cth_barcid_legacy: "Наследие Барцидов" #NT!
 nd_cth_barcid_legacy_desc: "Память о династии Баркидов (Гамилькар, Гасдрубал и, прежде всего, Ганнибал) вдохновляет новую эру военно-морских амбиций и стратегической смелости." #NT!
 nd_cth_punic_institutions: "Пуническое институциональное возрождение" #NT!
 nd_cth_punic_institutions_desc: "Систематическое восстановление карфагенских административных институтов (суффетов, казначейства, переписи населения и судов), обеспечивающее основу для современного управления." #NT!
 nd_cth_siege_engineering: "Пуническая осадная инженерия" #NT!
 nd_cth_siege_engineering_desc: "Опираясь на инженерные традиции, на которых построены массивные укрепления Карфагена, пунические эксперты по осаде разрабатывают методы строительства и разрушения мощнейших стен." #NT!
 nd_cth_punic_constitution: "Пуническая конституционная реформа" #NT!
 nd_cth_punic_constitution_desc: "Аристотель хвалил карфагенскую конституцию как одну из лучших в древнем мире. Его возрождение устанавливает сбалансированную систему магистратов, советов и народных собраний." #NT!
 nd_cth_carthaginian_renaissance: "Карфагенский культурный ренессанс" #NT!
 nd_cth_carthaginian_renaissance_desc: "Расцвет пунического искусства, науки и литературы, опирающийся на богатое наследие финикийской и карфагенской цивилизаций, создает самобытную культурную самобытность." #NT!
 nd_cth_modern_punic_fleet: "Современный Пунический флот" #NT!
 nd_cth_modern_punic_fleet_desc: "Преобразование карфагенского флота от галерной войны к современному кораблестроению с сохранением мореходного искусства и тактических традиций древнего флота." #NT!
 nd_cth_neo_punic_industry: "Неопуническая индустрия" #NT!
 nd_cth_neo_punic_industry_desc: "Промышленное развитие карфагенских территорий, основанное на многовековом опыте ремесел в металлообработке, производстве стекла, производстве текстиля и переработке сельскохозяйственной продукции." #NT!
  
  # === UNITS === 
 a_nd_cth_sacred_band: "Священный оркестр" #NT!
 a_nd_cth_sacred_band_desc: "Элитная гражданская тяжелая пехота, набранная из самых богатых семей Карфагена, с юности обученная фаланговой войне. Священный отряд служит основой гражданской армии." #NT!
 a_nd_cth_numidian_horse: "Нумидийская легкая кавалерия" #NT!
 a_nd_cth_numidian_horse_desc: "Быстрые нумидийские кавалеристы, которые едут без узды и седла, метая копья со смертельной точностью, прежде чем уехать. Мастера преследования и ведения войны в пустыне." #NT!
 n_nd_cth_war_galley: "Галера Пунической войны" #NT!
 n_nd_cth_war_galley_desc: "Специально построенный военный корабль в карфагенских традициях, более быстрый и маневренный, чем стандартные галеры, предназначенный для тарана и абордажа." #NT!
 a_nd_cth_libyan_spearmen: "Ливийские копейщики" #NT!
 a_nd_cth_libyan_spearmen_desc: "Дисциплинированная африканская пехота, вооруженная длинными копьями, бронзовыми шлемами и круглыми щитами. Эти подчиненные солдаты составляют надежное ядро ​​карфагенских сухопутных армий." #NT!
 n_nd_cth_quinquereme: "Пуническая квинкверема" #NT!
 n_nd_cth_quinquereme_desc: "Могучая квинкерема: пятигранный военный корабль, вооруженный разрушительным бронзовым тараном. Знаменитый корабль карфагенской военно-морской мощи, способный победить в любом морском сражении." #NT!
  
  # === BUILDINGS === 
 nd_cth_tophet: "Храм Тофет" #NT!
 nd_cth_tophet_desc: "Священное место, посвященное Баал-Хаммону и Танит, где воздвигнуты стелы и принесены жертвы в соответствии с древней пунической религиозной традицией." #NT!
 nd_cth_punic_shipyard: "Пуническая верфь" #NT!
 nd_cth_punic_shipyard_desc: "Защищенный портовый комплекс, построенный по принципу «котона»: крытые причалы, ремонтные доки и спусковые рампы, позволяющие быстро строить и обслуживать военные корабли." #NT!
 nd_cth_glassworks: "Пунический стекольный завод" #NT!
 nd_cth_glassworks_desc: "Мастерская, специализирующаяся на древнем финикийском искусстве изготовления стекла, производящая цветные сосуды, бусы и декоративное стекло, ценимое во всех торговых сетях Средиземноморья." #NT!
 nd_cth_dye_works: "Пунические красильные работы" #NT!
 nd_cth_dye_works_desc: "Прибрежный завод по добыче и переработке пурпурного красителя мюрекс: легендарного тирского пурпура, который когда-то был монополией финикийских купцов." #NT!
 nd_cth_punic_citadel: "Пуническая цитадель" #NT!
 nd_cth_punic_citadel_desc: "Массивное укрепление, вдохновленное тройными стенами древнего Карфагена, с толстыми каменными валами, глубокими рвами и внутренними помещениями для хранения припасов." #NT!
 nd_cth_emporium: "Пунический торговый центр" #NT!
 nd_cth_emporium_desc: "Укрепленный прибрежный торговый пост в карфагенском стиле, где купцы со всего Средиземноморья собираются для обмена товарами под защитой Пунического права." #NT!
 nd_cth_fondouk: "Пунический Фондук" #NT!
 nd_cth_fondouk_desc: "Укрепленный торговый дом в карфагенском стиле, предоставлявший жилье, складские и коммерческие помещения различным купцам средиземноморских торговых сетей." #NT!
 nd_cth_suffete_court: "Суффет Корт" #NT!
 nd_cth_suffete_court_desc: "Резиденция суффетов (пары магистратов, управлявших Карфагеном), восстановленная как центр гражданского управления, правосудия и государственного учета." #NT!
  
  # === PRODUCTION METHODS === 
 nd_cth_tophet_maintenance: "Подношения Тофета" #NT!
 nd_cth_tophet_maintenance_desc: "Благовония, жертвенные животные и камень для стел — традиционные подношения для поддержания священного участка." #NT!
 nd_cth_shipyard_maintenance: "Операции верфи" #NT!
 nd_cth_shipyard_maintenance_desc: "Древесина, военно-морские припасы и железная арматура, необходимые для поддержания котонской верфи в боевой готовности." #NT!
 nd_cth_glass_production: "Финикийское стеклоделие" #NT!
 nd_cth_glass_production_desc: "Превращение песка и минеральных красителей в готовые стеклянные сосуды с использованием техник, унаследованных от финикийских мастеров." #NT!
 nd_cth_glassworks_maintenance: "Содержание стекольного завода" #NT!
 nd_cth_glassworks_maintenance_desc: "Топливо и печные материалы, необходимые для поддержания рабочей температуры стекловаренных печей." #NT!
 nd_cth_purple_cloth_production: "Тирианское фиолетовое крашение" #NT!
 nd_cth_purple_cloth_production_desc: "Трудоемкое извлечение пурпурного красителя из улиток-мюрекс и нанесение его на ткани, в результате чего получается легендарная тирская пурпурная тонкая ткань, ценимая во всем Средиземноморье." #NT!
 nd_cth_dye_maintenance: "Содержание красильного цеха" #NT!
 nd_cth_dye_maintenance_desc: "Керамические чаны, соль для консервации и топливо для поддержания процесса экстракции красителя." #NT!
 nd_cth_citadel_maintenance: "Цитадель Гарнизон" #NT!
 nd_cth_citadel_maintenance_desc: "Камень для ремонта, оружие для гарнизона и железное укрепление для поддержания оборонительной силы цитадели." #NT!
 nd_cth_emporium_maintenance: "Операции в торговом центре" #NT!
 nd_cth_emporium_maintenance_desc: "Ткань для торговых витрин, керамика для торговых товаров и древесина для содержания торгового поста и его складских помещений." #NT!
 nd_cth_fondouk_maintenance: "Фондук Операции" #NT!
 nd_cth_fondouk_maintenance_desc: "Текстиль, керамика для демонстрации торговых товаров, лес для содержания торгового дома и его складских помещений." #NT!
 nd_cth_suffete_maintenance: "Администрация суда" #NT!
 nd_cth_suffete_maintenance_desc: "Бумага для записей, ткань для служебного облачения и камень для содержания гражданских построек при дворе суффете." #NT!
  
  # ===== DESTINY ADVANCES ===== 
 nd_cth_destiny: "Судьба Карфагена" #NT!
 nd_cth_destiny_desc: "Основы возрожденного Карфагена прочны. Из этой основы стабильности манит великая судьба, но какая это будет судьба?" #NT!
  
 nd_cth_dest_sardinian_sea: "Командование Сардинским морем" #NT!
 nd_cth_dest_sardinian_sea_desc: "Закрепите Сардинию и Корсику, чтобы доминировать в центральном Средиземноморье. Управляйте этими островными бастионами и пополняйте казну, чтобы финансировать дальнейшее расширение. Требуется выбор талассократического пути." #NT!
 nd_cth_dest_pillars_of_hercules: "Столпы Геркулеса" #NT!
 nd_cth_dest_pillars_of_hercules_desc: "Управляйте проливом, где Средиземное море встречается с Атлантикой. Захватите Кадис, Гибралтар и Картахену, чтобы контролировать западные морские пути и древние Пунические торговые пути." #NT!
 nd_cth_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_cth_dest_mare_nostrum_desc: "Превратите все Средиземноморье в Пуническое озеро. Управляйте Генуей, Александрией и Критом (тремя углами средиземноморской торговли) и постройте империю беспрецедентного богатства." #NT!
  
 nd_cth_dest_african_hegemony: "Африканская гегемония" #NT!
 nd_cth_dest_african_hegemony_desc: "Обеспечьте господство над западной частью Северной Африки, завоевав Фес и Танжер. Создайте армию, которая вынесет пунические амбиции за пределы Африки. Требуется выбрать путь Barcid Imperium." #NT!
 nd_cth_dest_iberian_campaign: "Иберийская кампания" #NT!
 nd_cth_dest_iberian_campaign_desc: "Пересеките пролив, как это сделал когда-то Гамилькар. Завоюйте Гранаду, Кордову и Севилью, богатые города южной Иберии, которые финансировали первоначальные кампании Барсидов против Рима." #NT!
 nd_cth_dest_hannibal_ante_portas: "Ганнибал анте Портас" #NT!
 nd_cth_dest_hannibal_ante_portas_desc: "Закончите то, что не смог Ганнибал. Возьмите Рим и Неаполь, сердце древнего врага. Когда Вечный город оказался в руках Пунистов, средиземноморский мир наконец склонился перед Карфагеном." #NT!
  
  # ===== DESTINY EVENTS ===== 
  
  # Root event 
 nd_cth.4.t: "Судьба Карфагена" #NT!
 nd_cth.4.d: "Карфаген возрождается, его основы прочны, а его народ сплочен. Древний город, который когда-то управлял половиной Средиземноморья, теперь стоит перед выбором, который определит его будущее на века вперед.\n\nСуффеты и Совет старейшин ведут бесконечные споры. Некоторые указывают на гавани, котоны, торговый флот: инструменты, которые в первую очередь создавали карфагенскую мощь. Другие вспоминают генералов Баркидов, доказавших, что Карфаген может противостоять любой сухопутной силе в открытом бою.\n\nСудьба Карфагена ждёт." #NT!
 nd_cth.4.a: "Наша судьба написана звездами" #NT!
  
  # Path A Stage 1 
 nd_cth.5.t: "Командование Сардинским морем" #NT!
 nd_cth.5.d: "Острова Сардиния и Корсика (те древние трофеи, из-за которых Карфаген и Рим впервые поссорились) снова принадлежат нам. Сардинское море, этот жизненно важный коридор между Африкой и Европой, теперь превратилось в Пуническое озеро.\n\nИз Кальяри и Аяччо наш торговый флот может добраться до любого порта западного Средиземноморья за считанные дни. Островные крепости, которые когда-то служили трамплином для римских завоеваний, теперь служат бастионами пунической торговли." #NT!
 nd_cth.5.a: "Морские дороги открыты" #NT!
  
  # Path A Stage 2 
 nd_cth.6.t: "Столпы Геркулеса" #NT!
 nd_cth.6.d: "Древние пограничные камни известного мира находятся под властью Пунизма. Кадис (Гадир, как его называли финикийцы) был старейшей колонией на западе, основанной еще до самого Карфагена. Гибралтар, скала, охраняющая проход между морями, принадлежит нам.\n\nКартахена (Новый Карфаген, столица Гасдрубала в Иберии) завершает цепочку. Каждый корабль, проходящий между Атлантикой и Средиземным морем, теперь должен считаться с пунической мощью. Вопрос в том, следует ли повернуться наружу, к огромному океану, или внутрь, чтобы овладеть торговлей внутреннего моря." #NT!
 nd_cth.6.a: "Взгляните за Столпы на Атлантику" #NT!
 nd_cth.6.b: "Освойте торговлю внутреннего моря" #NT!
  
  # Path A Stage 3 
 nd_cth.7.t: "Маре Нострум" #NT!
 nd_cth.7.d: "От Генуи до Александрии, от Крита до Геркулесовых столбов Средиземное море — это Пуническое море. Мечту, которую Рим осуществил с помощью легионов и дорог, Карфаген осуществил с помощью кораблей и торговли: торговая империя, охватывающая три континента.\n\nГавань Генуи направляет богатства Европы. Зернохранилища и мастерские Александрии передают богатства Востока. Гавани Крита контролируют морские пути между ними. Карфаген находится в центре, паук в торговой паутине, по сравнению с которой старый римский mare nostrum кажется местечковым.\n\nЭто воплощение пунической талассократии: не с помощью меча, а с помощью бухгалтерской книги и паруса." #NT!
 nd_cth.7.a: "Создайте прочное имперское владычество" #NT!
 nd_cth.7.b: "Пусть коммерция станет нашей короной" #NT!
  
  # Path B Stage 1 
 nd_cth.8.t: "Африканская гегемония" #NT!
 nd_cth.8.d: "Западные пределы Северной Африки подчиняются пунической власти. Фес, древняя столица Марокко, и Танжер, ворота в пролив, теперь являются карфагенскими владениями. Берберы и арабские народы Магриба служат под знаменами новой Пунической империи, точно так же, как нумидийцы и ливийцы когда-то служили под командованием Баркидов.\n\nПосле того, как Африка обеспечена, армия становится сильнее с каждым днем. Разнообразные народы континента предоставляют кавалерию, пехоту и специалистов всех видов. Путь на север манит." #NT!
 nd_cth.8.a: "Африка наша. Теперь посмотри на север" #NT!
  
  # Path B Stage 2 
 nd_cth.9.t: "Иберийская кампания" #NT!
 nd_cth.9.d: "Гамилькар Барка переправился в Иберию, чтобы восстановить карфагенскую власть после Первой Пунической войны. Его сын Ганнибал начал величайшую военную кампанию древности с этих же берегов. Теперь новое поколение пунических солдат стоит в Гранаде, Кордове и Севилье: богатых городах Андалусии, которые когда-то финансировали амбиции Барсида.\n\nВетераны этой кампании закалены осадами и битвами. Вопрос в том, превратить ли их в профессиональную элиту или расширить ее ряды, используя огромную рабочую силу наших африканских территорий." #NT!
 nd_cth.9.a: "Создайте ветеранскую профессиональную армию" #NT!
 nd_cth.9.b: "Набираем сотрудников из наших обширных африканских владений" #NT!
  
  # Path B Stage 3 
 nd_cth.10.t: "Ганнибал анте Портас" #NT!
 nd_cth.10.d: "Hannibal ad portas: «Ганнибал у ворот!» Крик, который когда-то заставлял замолчать римских матерей, теперь эхом разносится по улицам Вечного города. Рим пал. Неаполь пал. Древний враг, который сровнял Карфаген с землей и засеял его поля солью, поставлен на колени.\n\nТо, чего Ганнибал не смог достичь с помощью своих слонов и гения, чего не смог сделать Гасдрубал с подкреплениями из Иберии, сделал новый Карфаген. Пунический орел сидит там, где когда-то стоял римский волк.\n\nМир затаил дыхание. Что новые хозяева Рима построят на руинах старого?" #NT!
 nd_cth.10.a: "Пусть Пунический триумф разнесется сквозь века" #NT!
 nd_cth.10.b: "Постройте новый порядок на основе этого завоевания" #NT!
  
  # ===== DESTINY TIMED MODIFIERS ===== 
  
 STATIC_MODIFIER_NAME_nd_cth_dest_atlantic_gateway: "Ворота в Атлантику" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_atlantic_gateway: "Командование «Геркулесовыми столпами» открывает обширную Атлантику для пунических исследований, расширяя дипломатические и военно-морские возможности Карфагена за пределы древнего мира." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_merchant_princes: "Торговые принцы Средиземноморья" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_merchant_princes: "Богатейшие купцы Средиземноморья стекаются в пунические порты, предлагая выгодные кредиты и укрепляя отношения, хотя комфорт процветания притупляет военную готовность." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_punic_dominion: "Пунический Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_punic_dominion: "Бассейн Средиземноморья находится под единой пунической администрацией, при этом подчиненные народы постепенно поглощаются карфагенской гражданской жизнью." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_queen_of_the_sea: "Королева моря" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_queen_of_the_sea: "Карфаген управляет крупнейшей торговой сетью, которую когда-либо знало Средиземноморье, его торговые агенты одновременно служат непревзойденной разведывательной сетью, хотя такое мастерство порождает самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_iberian_veterans: "Иберийские ветераны" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_iberian_veterans: "Ветераны Иберийской кампании составляют профессиональное ядро ​​Пунической армии, быстро пополняемое и быстро собираемое, хотя тяжелая кампания сказывается на войсках." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_african_recruits: "Африканские рекруты" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_african_recruits: "Обширные африканские территории предоставляют сильные гарнизоны и уверенность в ведении агрессивных войн, хотя необходимость содержания таких сил по всему континенту подпитывает рост цен." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_punic_triumph: "Пунический триумф" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_punic_triumph: "Падение Рима делает Карфаген бесспорным хозяином Средиземноморья, предоставляя непревзойденные рычаги влияния в мирных переговорах, в то время как награбленные богатства поддерживают армию." #NT!
 STATIC_MODIFIER_NAME_nd_cth_dest_new_punic_order: "Новый Пунический Орден" #NT!
 STATIC_MODIFIER_DESC_nd_cth_dest_new_punic_order: "После падения Рима Карфаген строит новый политический порядок: многонациональную империю, которая объединяет различные вероисповедания и обращает подчиненные народы к пунической гражданской жизни." #NT!
  
  # ===== DESTINY BUILDINGS ===== 
  
 nd_cth_dest_cothon_emporium: "Торговый центр Гранд Котон" #NT!
 nd_cth_dest_cothon_emporium_desc: "Монументальный комплекс портового рынка, сочетающий в себе древнюю котонскую традицию судостроения с коммерческой инфраструктурой великого средиземноморского торгового дома." #NT!
 nd_cth_dest_barcid_academy: "Барсидская военная академия" #NT!
 nd_cth_dest_barcid_academy_desc: "Школа подготовки офицеров, вдохновленная стратегическим гением Гамилькара, Гасдрубала и Ганнибала Барки, обучающая следующее поколение пунических командиров." #NT!
  
  # ===== DESTINY PRODUCTION METHODS ===== 
  
 nd_cth_dest_cothon_emporium_maintenance: "Операции в торговом центре" #NT!
 nd_cth_dest_cothon_emporium_maintenance_desc: "Древесина для портовой инфраструктуры, ткань и бумага для торговых операций и инструменты для обслуживания сложного торгового оборудования." #NT!
 nd_cth_dest_barcid_academy_maintenance: "Операции Академии" #NT!
 nd_cth_dest_barcid_academy_maintenance_desc: "Оружие и лошади для обучения, кожа для снаряжения и бумага для стратегических руководств и офицерской переписки." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 cth_diwan_al_insha_bureaucracy: "Диван аль-Инша" #NT!
 cth_diwan_al_insha_bureaucracy_desc: "Канцелярия Хафсидов в Тунисе, созданная по образцу административного аппарата Альмохадов и унаследованная от более ранней практики Аглабидов и Зиридов. Диван издавал султанские указы (захир), опечатывал и регистрировал все официальные документы и содержал секретариат катибов, набираемых из городского грамотного класса. Его реестры и переписка были институциональной основой, с помощью которой Хафсиды управляли прибрежными городами и их каидами во внутренних районах, а также с помощью которых они вели свою договорную дипломатию с итальянскими республиками, начиная с 13 века." #NT!
 cth_qadi_al_jamaa_bureaucracy: "Кади аль-Джамаа" #NT!
 cth_qadi_al_jamaa_bureaucracy_desc: "Главный малики-кади Ифрикии, проживающий в Тунисе. Магриб предпочитал титул кади аль-джамаа (судья общины) восточному кади аль-кудату, что отражало маликитскую традицию общинной, а не централизованной судебной иерархии. Среди известных держателей в других частях владений Альморавидов и Альмохадов были Ибн Рушд аль-Джадд и Кади Ияд из Сеуты. Офис рассматривал контракты, наследование и личный статус и посредством своих апелляционных полномочий постепенно вытеснял обычное право берберской и арабской конфедераций." #NT!
 cth_diwan_al_bahr_bureaucracy: "Диван аль-Бахр" #NT!
 cth_diwan_al_bahr_bureaucracy_desc: "Морское бюро Хафсида, таможенное и налоговое управление в Тунисе, Ла-Гулетте и Бужи, которое облагало налогом товары, выгружаемые сахарскими караванами и продававшиеся через европейские фундуки. Генуэзские, пизанские, каталонские и венецианские купцы арендовали свои склады у дивана и платили с него десятину (ушур) в соответствии с постоянными договорами, такими как договор 1323 года. Морское бюро регистрировало каждую причитающуюся порту и каждую концессию, гарантируя процветание 14 и 15 веков." #NT!
 cth_ribat_network_bureaucracy: "Рибат Сеть" #NT!
 cth_ribat_network_bureaucracy_desc: "Цепь укрепленных приграничных монастырей (Сус, Монастир, Тит, Альмохад Рибат аль-Фатх в Сале и Рибат Таза), сочетавших гарнизонную службу с религиозной преданностью. Мурабитун, который их укомплектовал, обязался постоянно бдительно относиться к христианским набегам и вторжениям бедуинов, зарабатывая бараку за пограничную службу. К 13 веку многие рибаты стали центрами протосуфийского турука, сочетающего воинские и аскетические идеалы при скромных затратах для центральной казны, но ценой воинственного религиозного истеблишмента, которого беспокоило космополитическая торговля прибрежных городов." #NT!
 cth_taife_reisi_bureaucracy: "Таифе Рейси" #NT!
 cth_taife_reisi_bureaucracy_desc: "Гильдия капитанов корсаров, официально созданная Хайреддином Барбароссой после объединения Алжира в 1518 году и принятая поочередно Тунисом и Триполи. Реисы, лицензированные регентским диваном, приносили в казну пленников, грузы и доходы от выкупов, в то время как их совет (таифа) избирал свои собственные капудан-раи и управлял флотом корсо как автономной службой. К семнадцатому веку класс капитанов затмил старую племенную аристократию в политической жизни регентств Берберии." #NT!
  
 AUTO_MODIFIER_NAME_nd_cth_bureaucracy_authority: "Постоянный административный аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_cth_bureaucracy_authority: "Институциональное наследие Ифрикии (канцелярия Хафсидов, судебная власть Малики, морское бюро, сеть рибатов и корсарское адмиралтейство) обеспечивает основу для двух постоянных бюрократий, а столица предоставляет третью." #NT!
