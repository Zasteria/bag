l_russian:
 STATIC_MODIFIER_NAME_nd_rus_third_rome_ascendant: "Восходящий Третий Рим" #NT!
 STATIC_MODIFIER_DESC_nd_rus_third_rome_ascendant: "Москва выступает преемницей Рима и Константинополя, последней хранительницей истинного православного христианства. Царь правит как богоизбранный сосуд на земле, и из этой священной власти проистекает власть объединить все русские земли под единой, непоколебимой короной." #NT!
 STATIC_MODIFIER_NAME_nd_rus_empire_of_the_steppe: "Империя Степи" #NT!
 STATIC_MODIFIER_DESC_nd_rus_empire_of_the_steppe: "Судьба России лежит не в тесных дворах Европы, а в бескрайних просторах, простирающихся на восток до Тихого океана. Казак и зверолов несут царское знамя в пустыню, и каждая перейденная река, каждый поднятый острог расширяют владычество империи." #NT!
 nd_rus.1.t: "Рождение России" #NT!
 nd_rus.1.d: "Разрозненные княжества Руси слились в единую империю. Москва, Новгород, Тверь, Рязань — все склоняются перед одним государем, и двуглавый орел расправляет крылья над обширным владычеством. Но что это будет за империя? Православное духовенство говорит о Москве как о Третьем Риме, последнем бастионе истинного христианства, которому суждено вести верующих до конца дней. Они утверждают, что власть царя исходит только от Бога, а цель империи — быть хранителем православия.\n\nНо другие смотрят на восток, на бескрайние степи и замерзшую дикую местность Сибири, где состояния измеряются мехами, а новые земли простираются за пределы воображения. Казакам и пограничникам, которые все дальше расширяют границы, нужны не священники, а порох и провиант. Они видят империю, построенную не по божественному указу, а на завоеваниях и торговле, простирающуюся от Балтики до Тихого океана.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rus.1.a: "Москва – Третий Рим. Четвертого не будет." #NT!
 nd_rus.1.b: "Наша судьба лежит на Востоке, до Тихого океана и за его пределами." #NT!
 nd_rus.2.t: "Стрелецкий корпус" #NT!
 nd_rus.2.d: "По улицам Москвы марширует новый вид солдата. Вооруженные мушкетами с фитильными замками и тяжелыми бардишами, Стрельцы являются первой в России постоянной пехотой, получающей зарплату, имеющей униформу и обученной обращению с огнестрельным оружием. В отличие от феодальной боярской конницы, эти люди обязаны своей верностью непосредственно царю. Первоначально насчитывавший около трех тысяч человек, корпус разросся и теперь размещает гарнизоны в каждом крупном городе, а их отличительные цветные мундиры стали символом централизованной военной власти.\n\nТеперь вопрос в том, как их использовать. Как дисциплинированные полевые силы, обученные залповому огню в европейском стиле и способные противостоять любой армии на континенте? Или как гарнизонные войска, укомплектовывающие стены русских городов и приграничных крепостей, составляющие основу оборонительной сети империи?" #NT!
 nd_rus.2.a: "Обучите их как профессиональную полевую армию." #NT!
 nd_rus.2.b: "Сделайте их основой гарнизона империи." #NT!
 nd_rus.3.t: "Опричнина" #NT!
 nd_rus.3.d: "Царь разделил царство на две части. Половина (земщина) остается под старой боярской властью. Другая (опричнина) принадлежит только царю и управляется его личной охраной из опричников, одетых в черное всадников, которые едут с собачьей головой и метлой на седле, символизируя свою миссию вынюхивать и сметать измену.\n\nОпричники не подчиняются ни суду, ни закону, ни боярам. Они уже вырезали новгородскую знать, сравняли с землей имения и терроризировали всех, кого подозревали в нелояльности. Старая аристократия дрожит. Но какой ценой? Приграничные земли остаются незащищенными, лучшие войска отброшены внутрь, а экономика стонет под тяжестью конфискации. Является ли это ценой авторитарной безопасности или сдержанность окажется более надежным путем к стабильности?" #NT!
 nd_rus.3.a: "Пусть опричники делают свое дело. Измена должна быть выжжена с корнем и ветвями." #NT!
 nd_rus.3.b: "Умерьте чистки. Империи нужна стабильность, а не террор." #NT!
 nd_rus.4.t: "Табель о рангах" #NT!
 nd_rus.4.d: "В результате удара, потрясшего основы российского общества, царь издал указ о новой Табели о рангах, разделив все гражданские и военные должности на четырнадцать степеней. Отныне продвижение по государственной службе будет определяться не по рождению, а по заслугам и старшинству. Простолюдин, достигший восьмого ранга, автоматически получает потомственное дворянство.\n\nСтарые боярские семьи возмущаются, видя, что их наследственные привилегии сметаются. Но видение царя ясно: России нужны компетентные администраторы и офицеры, а не наследственные паразиты. Табель о рангах открывает двери правительства талантам независимо от происхождения, создавая новую служилую знать, чья лояльность принадлежит государству, а не клану или традициям." #NT!
 nd_rus.4.a: "Заслуги будут мерилом человека." #NT!
 nd_rus.5.t: "Наука победы" #NT!
 nd_rus.5.d: "Генерал Александр Суворов своим трактатом «Наука победы» изменил российскую военную доктрину. Его принципы предельно просты: неустанно тренируйтесь, двигайтесь быстро, бейте штыком. «Пуля — дура, штык — молодец», — учит он своих гренадеров. Его кампании доказали правильность доктрины: не побежденные в более чем шестидесяти битвах, солдаты Суворова маршируют быстрее, бьют сильнее и сражаются с яростью, которая сбивает с толку их врагов.\n\nВ его методах упор делается на скорость, а не на осторожность, на атаку, а не на защиту, и на инициативу отдельных солдат, а не на строгие порядки. Русские гренадеры, обученные в его школе, входят в число лучших пехотинцев Европы." #NT!
 nd_rus.5.a: "Штык никогда не лжет." #NT!
 STATIC_MODIFIER_NAME_nd_rus_streltsy_discipline: "Стрельцовая полевая дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_rus_streltsy_discipline: "Стрельцовский корпус подготовлен как профессиональная полевая армия, обучен стрельбе залпом и дисциплинированному маневрированию." #NT!
 STATIC_MODIFIER_NAME_nd_rus_streltsy_garrison: "Стрельцовская гарнизонная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_rus_streltsy_garrison: "Стрельцовские гарнизоны обеспечивают постоянную оборонительную основу городов и крепостей империи." #NT!
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_terror: "Опричнинский Террор" #NT!
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_terror: "Царские опричники посредством страха добиваются абсолютной лояльности. Ни один боярин, ни один город, ни одна губерния не застрахована от их досягаемости." #NT!
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_restraint: "Умеренная автократия" #NT!
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_restraint: "Царь решил управлять твердо, но без эксцессов неконтролируемого террора, укрепляя лояльность посредством компетентного управления." #NT!
 nd_rus_druzhina_tradition: "Дружина Традиция" #NT!
 nd_rus_druzhina_tradition_desc: "Дружина (личная свита конных воинов, служивших князю) составляет ядро ​​ранней русской военной мощи, традиция, которая развивается в казачьи войска на границе." #NT!
 nd_rus_veche_assemblies: "Вечевые собрания" #NT!
 nd_rus_veche_assemblies_desc: "Вече, или народное собрание, обеспечивает форум для коллективного принятия решений в российских городах, смягчая княжескую власть гражданским участием." #NT!
 nd_rus_fur_trade: "Фонды торговли мехом" #NT!
 nd_rus_fur_trade_desc: "Северные леса России дают обилие соболя, лисицы и горностая, которые составляют основу ранней русской торговли и привлекают торговцев даже из Константинополя и исламского мира." #NT!
 nd_rus_gathering_of_lands: "Собирание русских земель." #NT!
 nd_rus_gathering_of_lands_desc: "При Иване III Москва планомерно поглощала независимые русские княжества (Новгород, Тверь, Ярославль, Ростов), создавая единое государство из лоскутного одеяла средневековых уделов." #NT!
 nd_rus_third_rome: "Третий Рим" #NT!
 nd_rus_third_rome_desc: "После падения Константинополя в 1453 году Москва претендует на мантию Третьего Рима: последнего хранителя православия, а царь является представителем Бога на земле." #NT!
 nd_rus_sudebnik: "Судебникский кодекс законов" #NT!
 nd_rus_sudebnik_desc: "Судебник 1497 года устанавливает единый правовой кодекс для всех русских земель, заменяя лоскутное одеяло местных обычаев централизованным правосудием, осуществляемым великокняжескими судами." #NT!
 nd_rus_merchant_courts: "Гостиный двор Традиция" #NT!
 nd_rus_merchant_courts_desc: "Гостиный двор (купеческие дворы, где торговцы со всей России и иностранных земель собираются для ведения бизнеса) становится краеугольным камнем российской коммерческой жизни, регулируемой государством в целях порядка и доходов." #NT!
 nd_rus_stone_kremlins: "Каменные Кремли" #NT!
 nd_rus_stone_kremlins_desc: "Российские города заменяют свои деревянные частоколы внушительными каменными кремлевскими крепостями, создавая грозные цитадели, которые служат местом как военной обороны, так и политической власти." #NT!
 nd_rus_pomestye_system: "Поместье Сервис Эстейтс" #NT!
 nd_rus_pomestye_system_desc: "Система поместья предоставляет военным служилым условные земельные владения в обмен на конную службу, создавая новый класс служилых дворян, связанных с царской армией." #NT!
 nd_rus_boyar_duma: "Боярская дума" #NT!
 nd_rus_boyar_duma_desc: "Боярская дума, совещательный совет высших дворян и духовенства, обсуждает вопросы государства, войны и права по усмотрению царя." #NT!
 nd_rus_streltsy_corps: "Стрельцовский корпус" #NT!
 nd_rus_streltsy_corps_desc: "Иван IV основывает стрельцов, первую в России постоянную пехоту, вооруженную огнестрельным оружием. Получающие зарплату и одетые в форму, они представляют собой решительный шаг на пути к профессиональной армии." #NT!
 nd_rus_oprichnina: "Опричнина" #NT!
 nd_rus_oprichnina_desc: "Иван IV создает опричнину, государство в государстве, управляемое его личной гвардией из одетых в черное опричников, которые обеспечивают абсолютную власть царя посредством террора и конфискации." #NT!
 nd_rus_siberian_conquest: "Сибирское завоевание" #NT!
 nd_rus_siberian_conquest_desc: "Завоевание Сибирского ханства открывает путь в обширную пустыню за Уралом, где казаки-исследователи и торговцы мехом продвигают границу все дальше на восток, к Тихому океану." #NT!
 nd_rus_orthodox_arts: "Православный культурный ренессанс" #NT!
 nd_rus_orthodox_arts_desc: "Русская иконопись, церковная архитектура и литургическая музыка достигают новых высот художественных достижений, создавая самобытную православную культурную традицию, соперничающую с искусством самой Византии." #NT!
 nd_rus_smuta_resilience: "Смута Устойчивость" #NT!
 nd_rus_smuta_resilience_desc: "Смутное время испытывает Россию до предела (голод, вторжение, гражданская война и претенденты на трон), но нация выживает, обретая более глубокое чувство национальной идентичности и устойчивости." #NT!
 nd_rus_grain_spirits: "Промышленность зерновых спиртных напитков" #NT!
 nd_rus_grain_spirits_desc: "Российские винокуренные предприятия совершенствуют производство зерновых спиртных напитков, создавая отечественную промышленность, приносящую значительные доходы государственной казне за счет монопольных продаж." #NT!
 nd_rus_cossack_hosts: "Казачьи войска" #NT!
 nd_rus_cossack_hosts_desc: "Полуавтономные казачьи общины Дона, Запорожской Сечи и Яика официально оформлены как военные владения, обеспечивающие империю превосходной легкой кавалерией в обмен на землю и самоуправление." #NT!
 nd_rus_prikazy_system: "Приказы системы" #NT!
 nd_rus_prikazy_system_desc: "Приказы, или правительственные ведомства, превращаются из специальных комиссий в постоянный бюрократический аппарат, каждый из которых отвечает за определенную функцию государства: иностранные дела, военное снабжение, казначейство, юстицию." #NT!
 nd_rus_patriarch: "Московский Патриархат" #NT!
 nd_rus_patriarch_desc: "Учреждение Московского Патриархата в 1589 году возводит Русскую Церковь до полной независимости, подтверждая духовную власть Москвы над всеми православными верующими." #NT!
 nd_rus_new_regiments: "Полки нового формирования" #NT!
 nd_rus_new_regiments_desc: "Офицеры, прошедшие обучение в Европе, обучают русских солдат западным военным методам, создавая полки «нового формирования» из пехоты, драгунов и рейтеров, которые дополняют традиционную стрелецкую и феодальную кавалерию." #NT!
 nd_rus_ural_ironworks: "Уральский металлургический завод" #NT!
 nd_rus_ural_ironworks_desc: "Уральские горы содержат огромные запасы железной руды, а создание финансируемых государством литейных заводов превращает Россию в одного из крупнейших в Европе производителей железа и пушек." #NT!
 nd_rus_ulozheniye: "Соборное Уложение" #NT!
 nd_rus_ulozheniye_desc: "Судебник 1649 года кодифицирует социальную иерархию Российского государства, навсегда привязывая крестьян к земле как крепостных и устанавливая правовые рамки самодержавного управления, которые будут сохраняться в течение двух столетий." #NT!
 nd_rus_don_host: "Донское казачье войско" #NT!
 nd_rus_don_host_desc: "Донское казачество формально признано военным сословием империи, предоставляющим элитную легкую кавалерию для царских походов в обмен на автономию на своих исконных землях вдоль реки Дон." #NT!
 nd_rus_petrine_navy: "Петровские военно-морские реформы" #NT!
 nd_rus_petrine_navy_desc: "Петр Великий, поработав учеником корабела на голландских и английских верфях, возвращается, чтобы построить российский флот из ничего: основать военно-морские академии, верфи и новую столицу Санкт-Петербург как окно в море." #NT!
 nd_rus_baltic_fleet: "Балтийский флот" #NT!
 nd_rus_baltic_fleet_desc: "Создание Балтийского флота превращает Россию из державы, не имеющей выхода к морю, в военно-морскую силу, способную оспаривать Балтийское море, бросать вызов шведскому доминированию и обеспечивать доступ России к европейской торговле." #NT!
 nd_rus_table_of_ranks: "Табель о рангах" #NT!
 nd_rus_table_of_ranks_desc: "Табель о рангах Петра Великого заменяет наследственные привилегии меритократической службой, классифицируя все гражданские и военные должности на четырнадцать степеней и открывая продвижение по службе талантам независимо от рождения." #NT!
 nd_rus_guberniya: "Губернийская система" #NT!
 nd_rus_guberniya_desc: "Империя реорганизуется в губернии (провинции, управляемые назначаемыми губернаторами, подотчетными непосредственно центральному правительству), заменяющие старое лоскутное одеяло местной администрации." #NT!
 nd_rus_military_colonies: "Военная колонизация" #NT!
 nd_rus_military_colonies_desc: "Солдаты-поселенцы обосновались в приграничных регионах, совмещая военную службу с земледелием, чтобы обеспечить как защиту, так и пропитание расширяющейся империи." #NT!
 nd_rus_suvorov_school: "Суворовское военное училище." #NT!
 nd_rus_suvorov_school_desc: "Доктрины Александра Суворова о скорости, агрессии и штыковой атаке породили поколение элитных гренадеров, сражающихся с непревзойденной яростью и тактической инициативой." #NT!
 nd_rus_great_power_diplomacy: "Дипломатия великих держав" #NT!
 nd_rus_great_power_diplomacy_desc: "Становление России как великой европейской державы требует наличия сложного дипломатического корпуса, и теперь империя имеет послов при каждом крупном дворе, обладая влиянием от Парижа до Константинополя." #NT!
 nd_rus_enlightenment: "Русское Просвещение" #NT!
 nd_rus_enlightenment_desc: "Екатерина Великая ведет переписку с Вольтером и Дидро, основывает Вольное экономическое общество и основывает школы по всей империи. Русская литература, наука и философия процветают как никогда." #NT!
 nd_rus_industrial_dawn: "Индустриальный рассвет" #NT!
 nd_rus_industrial_dawn_desc: "Первые признаки индустриализации достигают России, когда начинается механизированное производство в текстиле и металлообработке, а на Урале и вокруг Москвы множатся государственные фабрики." #NT!
 a_nd_rus_streltsy: "Стрельцы" #NT!
 a_nd_rus_streltsy_desc: "Постоянная московская мушкетная пехота, в форме и на жаловании, вооруженная фитильным огнестрельным оружием и тяжелыми бардиками. Основа военной мощи России в эпоху пороха." #NT!
 a_nd_rus_cossack_cavalry: "Казачья легкая кавалерия" #NT!
 a_nd_rus_cossack_cavalry_desc: "Степные всадники из приграничных сообществ, опытные наездники и налетчики, которые служат глазами и ушами империи на обширных южных приграничных землях." #NT!
 a_nd_rus_oprichnik: "Опричник Кавалерия" #NT!
 a_nd_rus_oprichnik_desc: "Личные стражи царя, одетые в черное всадники, несущие на седле собачью голову и метлу, символы их миссии по обнаружению и искоренению измены." #NT!
 a_nd_rus_don_cossack: "Донской казак" #NT!
 a_nd_rus_don_cossack_desc: "Элитные всадники Войска Донского, кавалеристы-ветераны, сочетающие традиции степной езды с дисциплинированной военной службой империи." #NT!
 a_nd_rus_suvorov_grenadier: "Суворовский гренадер" #NT!
 a_nd_rus_suvorov_grenadier_desc: "Элитная пехота, обученная суворовской доктрине скорости и штыкового штурма. «Пуля — дура, штык — молодец». Эти люди воплощают это кредо." #NT!
 n_nd_rus_baltic_frigate: "Балтийский Фрегат" #NT!
 n_nd_rus_baltic_frigate_desc: "Быстроходный военный корабль Балтийского флота России, построенный на новых верфях Санкт-Петербурга для борьбы со шведским доминированием в северных морях." #NT!
 nd_rus_gostiny_dvor: "Гостиный Двор" #NT!
 nd_rus_gostiny_dvor_desc: "Торговый двор, где собираются торговцы со всей России и зарубежных стран, чтобы продавать свои товары в соответствии с государственным регулированием, способствуя упорядоченной торговле и сбору налогов." #NT!
 nd_rus_gostiny_dvor_upkeep: "Обслуживание Гостиного Двора" #NT!
 nd_rus_gostiny_dvor_upkeep_desc: "Затраты на содержание торгового двора: древесина для строительства, камень для ремонта, бумага для торговых записей и контрактов, а также ткань для демонстрации и торговых нужд." #NT!
 nd_rus_kreml: "Каменный Кремль" #NT!
 nd_rus_kreml_desc: "Укрепленная каменная цитадель в центре российского города, сочетающая военную оборону с резиденцией политической власти и православного богослужения." #NT!
 nd_rus_kreml_garrison: "Кремлевский гарнизон" #NT!
 nd_rus_kreml_garrison_desc: "Постоянный гарнизон, поддерживающий оборону Кремля, потребляющий оружие, камень для ремонта, огнестрельное оружие для солдат и инструменты для строительства и обслуживания." #NT!
 nd_rus_ural_foundry: "Уральский металлургический завод" #NT!
 nd_rus_ural_foundry_desc: "Спонсируемый государством чугунолитейный завод в Уральских горах, переплавляющий обширные рудные месторождения региона в железо и сталь для арсеналов империи." #NT!
 nd_rus_iron_smelting: "Уральский чугунолитейный завод" #NT!
 nd_rus_iron_smelting_desc: "Промышленная переплавка уральской железной руды в высококачественную сталь в доменных печах на древесном угле и коксе." #NT!
 nd_rus_naval_academy: "Военно-морская академия" #NT!
 nd_rus_naval_academy_desc: "Школа мореплавания и кораблестроения, основанная в петровских традициях, готовит офицеров и мастеров для строительства и управления растущим российским флотом." #NT!
 nd_rus_naval_academy_upkeep: "Содержание Военно-морской академии" #NT!
 nd_rus_naval_academy_upkeep_desc: "Расходы на содержание военно-морской академии: древесина и военно-морские принадлежности для учебных судов, инструменты для обучения корабелов и бумага для навигационных карт и учебных программ." #NT!
 nd_rus_fur_post: "Торговый пост меха" #NT!
 nd_rus_fur_post_desc: "Приграничная торговая станция, куда охотники привозят шкурки соболя, лисицы и горностая для сбора, сортировки и отправки на рынки в Москве и за ее пределы." #NT!
 nd_rus_fur_post_upkeep: "Содержание торгового поста" #NT!
 nd_rus_fur_post_upkeep_desc: "Содержание приграничного торгового поста: инструменты для промысловых и ремонтных работ, пиломатериалы для сооружения поста, соль для консервации шкурок перед отправкой на рынок." #NT!
 nd_rus_vodka_distillery: "Водочный завод" #NT!
 nd_rus_vodka_distillery_desc: "Зерновой спиртзавод, производящий самобытный российский спиртной напиток, приносящий значительный доход за счет контролируемых государством монопольных продаж." #NT!
 nd_rus_vodka_production: "Производство водки" #NT!
 nd_rus_vodka_production_desc: "Перегонка зерна пшеницы в крепкие спиртные напитки для внутреннего потребления и экспорта." #NT!
 levy_nd_rus_cossack_cavalry: "Казак Леви" #NT!
 levy_nd_rus_cossack_cavalry_desc: "Легкая кавалерия, собранная из казачьих приграничных общин." #NT!
 levy_nd_rus_don_cossack: "Донской казак Леви" #NT!
 levy_nd_rus_don_cossack_desc: "Элитная кавалерия, собранная из Войска Донского." #NT!
 nd_rus_formed_tt: "Россия была образована" #NT!
 nd_rus_path_a_tt: "Выберите судьбу #bold Восходящего Третьего Рима#!" #NT!
 nd_rus_path_b_tt: "Выбери судьбу #bold Степной Империи#!" #NT!
 nd_rus_destiny: "Императорский мандат" #NT!
 nd_rus_destiny_desc: "Россия сложилась из разрозненных княжеств Руси. Теперь царь должен продемонстрировать, что это новое государство обладает стабильностью и авторитетом, чтобы выжить. Только государство, находящееся в мире само с собой, может реализовать великие амбиции, которые ждут впереди." #NT!
 nd_rus_dest_mother_cities: "Возвращение родных городов" #NT!
 nd_rus_dest_mother_cities_desc: "Верните Киев, колыбель Руси, и Вильнюс, столицу Великого княжества, бросившего вызов притязаниям Москвы на главенство православных. Используйте современное банковское дело для финансирования западных кампаний." #NT!
 nd_rus_dest_baltic_window: "Балтийское окно" #NT!
 nd_rus_dest_baltic_window_desc: "Захватите крупные балтийские порты Ригу и Таллинн, чтобы прорваться в европейскую морскую торговлю. Соберите казну, необходимую для поддержания империи, обращенной на запад." #NT!
 nd_rus_dest_third_rome_fulfilled: "Третий Рим восходит" #NT!
 nd_rus_dest_third_rome_fulfilled_desc: "Возьмите сам Константинополь и восстановите православное богослужение в Святой Софии. Только могущественная и престижная империя может претендовать на мантию Рима." #NT!
 nd_rus_dest_eastern_road: "Восточная дорога" #NT!
 nd_rus_dest_eastern_road_desc: "Завоюйте Казань, преграждающую путь на восток, и захватите Тобольск, ворота в Сибирь. Создайте банковские учреждения для финансирования обширного предприятия восточной экспансии." #NT!
 nd_rus_dest_siberian_wealth: "Сибирское богатство" #NT!
 nd_rus_dest_siberian_wealth_desc: "Развивайте обширные территории империи посредством институционального прогресса и экономического роста. Постройте сеть торговли мехом, которая будет снабжать рынки Москвы и мира. Печатный станок должен достичь границы." #NT!
 nd_rus_dest_continental_colossus: "Континентальный колосс" #NT!
 nd_rus_dest_continental_colossus_desc: "Превратите Россию в самую развитую сухопутную империю в истории. Просвещение должно осветить даже самые дальние провинции, казна должна переполниться, и мир должен признать русское величие." #NT!
 nd_rus.6.t: "Императорский мандат" #NT!
 nd_rus.6.d: "Российское государство достигло такой стабильности, которую мало кто считал возможной в этих неспокойных странах. Бояре подчинились, Церковь благословляет царскую власть, а простой народ смотрит на Москву как на центр своего мира. Эта стабильность — не конец, а начало: фундамент, на котором может быть построена великая империя.\n\nТеперь вопрос в том, какой империей станет Россия." #NT!
 nd_rus.6.a: "Империя шевелится." #NT!
 nd_rus.7.t: "Возвращение родных городов" #NT!
 nd_rus.7.d: "Киев, где великий князь Владимир принял крещение и принес христианство на Русь, возвращен Русскому царству. Вильнюс, столица Великого княжества Литовского (старейшего соперника России за господство над православным востоком), пал перед царскими войсками. Это не просто завоевания, а утверждение цивилизационных притязаний.\n\nПаломники стекаются в Печерский монастырь в Киеве, и церкви звенят праздником. Притязания России как хранительницы православия неизмеримо усиливаются возвращением этих городов в ее сферу." #NT!
 nd_rus.7.a: "Западные земли признают царя." #NT!
 nd_rus.8.t: "Балтийский прорыв" #NT!
 nd_rus.8.d: "Крупные порты Рига и Таллинн теперь принадлежат России. Впервые империя получила прямой доступ к европейским морским торговым путям, а российские купцы могли без посредников торговать с Гамбургом, Амстердамом и Лондоном. Балтика больше не является шведским или ганзейским озером.\n\nЭтот прорыв ставит перед империей фундаментальный вопрос. Должна ли Россия принять пути Европы (ее дворы, ее моду, ее дипломатическую культуру) и занять свое место в качестве великой европейской державы? Или должен стоять особняком Третий Рим, крепость православной веры и русской традиции, черпающая силу в своей самобытности, а не в единообразии?" #NT!
 nd_rus.8.a: "Откройте двери европейской цивилизации." #NT!
 nd_rus.8.b: "Мы – крепость истинной веры." #NT!
 nd_rus.9.t: "Третий Рим восходит" #NT!
 nd_rus.9.d: "Немыслимое было достигнуто. Двуглавый орел парит над стенами Константинополя, а великий купол Святой Софии вновь звучит православным богослужением. Пророчество монаха Филофея сбылось: Москва, Третий Рим, вернула себе Второй.\n\nЦарь теперь выступает как верховный лидер православного мира, защитник миллионов верующих от Балкан до Кавказа. Но как будет осуществляться эта универсальная власть? Через духовный престиж Вселенского Престола, вбирая православные народы в содружество веры? Или благодаря железной власти нового Цезаря, чья военная мощь обеспечивает мир в империи?" #NT!
 nd_rus.9.a: "Мы объединим верующих под одним престолом." #NT!
 nd_rus.9.b: "Пусть мир трепещет перед новым Цезарем." #NT!
 nd_rus.10.t: "Восточная дорога открывается" #NT!
 nd_rus.10.d: "Русские войска пересекли Уральские горы и захватили Тобольск, столицу Сибирского ханства. Казанское ханство, долгое время блокировавшее восточную дорогу, было покорено. Путь в бескрайнюю сибирскую пустыню открыт.\n\nКазачьи разведчики сообщают о реках, изобилующих рыбой, темных соболиных лесах и огромных лугах, простирающихся до неисчислимых горизонтов. Весь континент ждет не только царского флага, но и русских поселенцев, институтов и торговли." #NT!
 nd_rus.10.a: "На восток! Всегда на восток!" #NT!
 nd_rus.11.t: "Богатство Сибири" #NT!
 nd_rus.11.d: "Обширные восточные территории империи начали всерьез приносить свои богатства. Караваны меха тянутся от тайги до Москвы, печатный станок достигает провинциальных столиц, а русские поселения разбросаны по речным системам от Урала до Енисея. Сибирь уже не просто завоевана: она становится продуктивной.\n\nВопрос теперь в том, как добыть и организовать это богатство. Система ясачной дани мехом, навязанная коренным народам в обмен на номинальную защиту, приносит в казну огромные богатства, но за счет местной стабильности. Альтернативно, поощрение массового расселения русских могло бы навсегда интегрировать Сибирь, но потребовало бы других инвестиций в дороги, фермы и администрацию." #NT!
 nd_rus.11.a: "Наложить ясак. Сибирь заплатит дань." #NT!
 nd_rus.11.b: "Отправьте поселенцев. Сибирь станет Россией." #NT!
 nd_rus.12.t: "Континентальный колосс" #NT!
 nd_rus.12.d: "Россия достигла того, чего не могла сравниться ни одна империя в истории: континентальная территория, простирающаяся на одиннадцать часовых поясов, развитая и управляемая, ее институты простираются от Балтийского до Тихоокеанского водораздела. Просвещение проникло даже в самые отдаленные губернии, и в казне империи отражаются богатства сотен народов и тысяч рек.\n\nЭтот колосс стоит перед принципиальным выбором, как распорядиться своей континентальной массой. Будучи преимущественно сухопутной империей, Россия может доминировать в сердце Евразии благодаря исключительной территориальной глубине и военной доктрине. Или Россия может выйти за пределы континента, создав Тихоокеанский флот, чтобы проецировать мощь через океан и взаимодействовать с морскими цивилизациями Восточной Азии." #NT!
 nd_rus.12.a: "Мы — хозяева континента." #NT!
 nd_rus.12.b: "Постройте Тихоокеанский флот. Океан следующий." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_european_window: "Европейское окно" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_european_window: "Россия открывает свои двери для европейской культуры, торговли и идей, охватывая более широкий мир за пределами православной сферы." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_orthodox_bastion: "Православный бастион" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_orthodox_bastion: "Третий Рим стоит особняком от латинского и протестантского Запада, черпая силу из чистоты своей православной веры и единства своего народа." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_ecumenical_throne: "Вселенский престол" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_ecumenical_throne: "Царь восседает на Вселенском престоле, духовный отец всех православных христиан, обладающий мягкой силой веры, которая объединяет народы в содружество верующих." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_new_caesar: "Новый Цезарь" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_new_caesar: "На Востоке восстал новый римский император, и мир трепещет перед восстановлением военной мощи Третьего Рима." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_yasak_tribute: "Система дани Ясака" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_yasak_tribute: "Система ясака взимает меховую дань с сибирских народов, направляя огромные богатства в Москву за счет местных отношений с побежденными." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_settler_wave: "Колонизация поселенцев" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_settler_wave: "Русские поселенцы огромными волнами устремляются на восток, создавая постоянные деревни и фермы, которые безвозвратно связывают Сибирь с родиной." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_heartland_power: "Сила Хартленда" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_heartland_power: "Россия командует сердцем Евразии, ее армии поддерживаются глубиной континента и стратегической доктриной, которая делает военно-морскую мощь несущественной." #NT!
 STATIC_MODIFIER_NAME_nd_rus_dest_pacific_horizon: "Тихоокеанский горизонт" #NT!
 STATIC_MODIFIER_DESC_nd_rus_dest_pacific_horizon: "Россия строит Тихоокеанский флот и смотрит за пределы континента, взаимодействуя с морскими цивилизациями Восточной Азии, пренебрегая при этом некоторым внутренним строительством." #NT!
 nd_rus_cathedral_of_east: "Собор Востока" #NT!
 nd_rus_cathedral_of_east_desc: "Великолепный православный собор, построенный для того, чтобы освятить притязания России на звание Третьего Рима, соперничающий по великолепию с великими церквями Константинополя и Рима." #NT!
 nd_rus_cathedral_of_east_upkeep: "Соборная Литургия" #NT!
 nd_rus_cathedral_of_east_upkeep_desc: "Торжественные богослужения, поддерживающие духовный авторитет собора, требуют ладана для каждения, драгоценных камней для украшения икон, тонкой ткани для облачения иерея и свечей из пчелиного воска для нефа." #NT!
 nd_rus_ostrog_fort: "Крепость Острог" #NT!
 nd_rus_ostrog_fort_desc: "Укрепленный деревянный частокол на сибирской границе, служивший базой для торговцев мехом, гарнизоном для солдат и якорем для русских поселений в пустыне." #NT!
 nd_rus_ostrog_fort_upkeep: "Острожский гарнизон" #NT!
 nd_rus_ostrog_fort_upkeep_desc: "Небольшой гарнизон, который охраняет стены острога и патрулирует окружающую границу, нуждается в оружии и огнестрельном оружии, древесине для ремонта, коже для зимнего снаряжения и соли для продовольствия в дикой местности." #NT!
 mestnichestvo_bureaucracy: "Местничество" #NT!
 mestnichestvo_bureaucracy_desc: "Система старшинства по наследственному старшинству, согласно которой назначения на командные должности и должности определялись не заслугами, а относительным рангом предков на прошлой службе. Кодифицированное при Иване III и укрепившееся в XVI веке, местничество привязывало боярские кланы к трону, гарантируя их достоинство, но вызывало разрушительные ссоры из-за старшинства при каждом предвыборном сборе. Царь Федор III окончательно отменил его в 1682 году, сжег книги старшинства в одном большом костре." #NT!
 pomestie_registry_bureaucracy: "Поместский реестр" #NT!
 pomestie_registry_bureaucracy_desc: "Условно-земельная система, управляемая Разрядным приказом, предусматривающая предоставление поместий (поместий) конным служилым людям в обмен на пожизненную военную службу. В отличие от наследственной вотчины, поместье возвращалось к короне, если его владелец не проходил сбор, создавая наемную кавалерию без бремени денежной оплаты. Клерки реестра отслеживали списки, распределяли гранты и на протяжении поколений подталкивали крестьян, обрабатывающих эти земли, все ближе к формальному крепостному праву, кульминацией которого стало Уложение 1649 года." #NT!
 prikazy_bureaucracy: "Приказы" #NT!
 prikazy_bureaucracy_desc: "Ведомственные бюро московского управления, возглавляемые бояринами и укомплектованные грамотными дьяками, назывались дьяками и подъячими. Посольский приказ ведал иностранными делами, Разрядный приказ - военными, Поместный приказ - служебными землями и десятки других, юрисдикция которых пересекалась по всему королевству. Система создала компетентный административный класс, состоявший в основном из недворянского происхождения, но ее запутанность пересекающихся полномочий и клерикальных фракций замедляла каждую реформу, пока Петр I, наконец, не свернул ее в пользу коллегий." #NT!
 oprichnina_bureaucracy: "Опричнина" #NT!
 oprichnina_bureaucracy_desc: "В 1565 году личный удел царя Ивана IV учредил отдельное государство в государстве со своим двором, казной и слугами в черном, наделенными полномочиями захватывать боярские земли и казнить предателей по царскому слову. Разделив царство на опричнину (царские владения) и земщину (остальную часть), Иван сломал великие кланы Московии и централизовал власть под престолом, но ценой экономического разрухи в пострадавших провинциях. Хотя формально оно было распущено в 1572 году, его прецедент внеправового личного правления на протяжении веков затмевал русское самодержавие." #NT!
 nd_rus_bureaucracy_unlock: "Московская канцелярия" #NT!
 nd_rus_bureaucracy_unlock_desc: "Великокняжеская канцелярия в Москве превращается в формальный институциональный аппарат, способный регистрировать служебные гранты, отправлять дипломатические миссии и вербовать царских служилых людей. На этом фундаменте своеобразные государственные институты России (приказ, поместье, старостная книга) начинают принимать свою прочную форму." #NT!
 AUTO_MODIFIER_NAME_nd_rus_bureaucracy_authority: "Московская канцелярия" #NT!
 AUTO_MODIFIER_DESC_nd_rus_bureaucracy_authority: "Великокняжеская канцелярия в Москве превратилась в постоянный институциональный аппарат: регистрировал служебные пожалования, отправлял дипломатические миссии и вербовал царских служилых людей. На этом фундаменте своеобразные государственные институты России начинают обретать прочную форму." #NT!
 yamskaya_sluzhba_bureaucracy: "Ямская служба" #NT!
 yamskaya_sluzhba_bureaucracy_desc: "Почтовая ретрансляционная система, унаследованная Московией от монгольских владык и оформленная Ямским приказом, по которой курьеры с княжескими указами ездили поэтапно между ямными станциями, расположенными на расстоянии дня езды друг от друга по большим дорогам. Система доставляла приказы из Москвы к границам за дни, а не за недели, объединяя воедино царство, расстояния которого в противном случае не поддавались бы никакому централизованному правилу. Ее поддерживала крестьянская барщина, называемая «ямская повинность», а ее густая сеть станций также выполняла функцию тайного разведывательного аппарата, докладывающего канцелярии о местных делах." #NT!
 sobornoye_ulozheniye_bureaucracy: "Соборное Уложение" #NT!
 sobornoye_ulozheniye_bureaucracy_desc: "«Соборное уложение», принятое царем Алексеем в 1649 году, — всеобъемлющий свод законов, составленный после Соляного бунта и утвержденный Земским собором. В почти тысяче статей он оформлял наследственные сословные сословные сословия (дворяне, духовенство, посадские, крестьяне) как отдельные юридические касты с отдельными правами, судами и обязанностями. Наиболее важным было то, что он отменил временные ограничения на возвращение беглых крестьян, навечно привязав сельское население к земле и закрепив крепостное право как структурную опору российского государства на следующие два столетия." #NT!
