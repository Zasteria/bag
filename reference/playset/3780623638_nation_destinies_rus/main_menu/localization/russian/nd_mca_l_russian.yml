l_russian:
 STATIC_MODIFIER_NAME_nd_path_of_the_golden_zipa: "Путь Золотой Зипы" #NT!
 STATIC_MODIFIER_DESC_nd_path_of_the_golden_zipa: "В тумане озера Гуатавита новую Зипу помазывали золотым песком и бросали драгоценные подношения в священные воды. Эта церемония, которая легла в основу легенды об Эльдорадо, олицетворяла веру муиска в то, что богатство существует для того, чтобы чтить богов и связывать людей. Теперь конфедерация направляет это золотое наследие на торговлю, искусство и культурное великолепие." #NT!
 STATIC_MODIFIER_NAME_nd_tundama_defiance: "Вызов Тундамы" #NT!
 STATIC_MODIFIER_DESC_nd_tundama_defiance: "Когда касик Тундама узнал, что соседние лорды подчинились иностранным захватчикам, он отрезал уши и руку воину, предложившему сдаться. Его бойцы-геча удерживали высокогорье, несмотря на превосходящие силы противника, предпочитая смерть подчинению. Конфедерация теперь воплощает этот дух непоколебимого сопротивления, превращая сами горы в крепость." #NT!
 nd_mca.1.t: "Конфедерация Муиска" #NT!
 nd_mca.1.d: "Разбросанные владения Альтиплано Кундибоясенсе наконец объединились. Зипа из Бакаты и заке из Хунзы, чье соперничество когда-то разделило горцев, теперь говорят в один голос. От соляных шахт Сипакиры до изумрудных жил Сомондоко, от золотых мастерских низинных ремесленников до террасных полей высокогорного плато — Муиска едины.\n\nНо единство требует видения. Будем ли мы опираться на золотое великолепие, которое сделало наш народ предметом зависти Америки: торговые сети, простирающиеся через горы и долины, ремесленников, чьи тундзё сияют священным смыслом? Или мы должны почтить воинственный дух Тундамы, который предпочел неповиновение подчинению, и превратить нагорье в неприступный бастион?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mca.1.a: "Пусть золото течет. Мы люди Эльдорадо" #NT!
 nd_mca.1.b: "Мы – геча: горы никогда не будут покорены" #NT!
 STATIC_MODIFIER_NAME_nd_mca_gilded_sovereign: "Позолоченный Соверен" #NT!
 STATIC_MODIFIER_DESC_nd_mca_gilded_sovereign: "Подобно Зипе, покрытой золотой пылью на озере Гуатавита, наш правитель принял древнюю церемонию, которая возводит власть смертных в божественный мандат." #NT!
 STATIC_MODIFIER_NAME_nd_mca_sacred_offerings: "Священные подношения Гуатавиты" #NT!
 STATIC_MODIFIER_DESC_nd_mca_sacred_offerings: "Сокровища, брошенные в священное озеро, чтят Чи, богиню луны, и Суа, бога солнца. Благодаря этим подношениям люди обретают духовное единство и космическую гармонию." #NT!
 nd_mca.2.t: "Церемония Эльдорадо" #NT!
 nd_mca.2.d: "В самом сердце озера Гуатавита, на высоте трех тысяч метров над уровнем моря, начинается древняя церемония. Новый правитель обнажен и покрыт липкой смолой, на которую слуги сдувают мелкую золотую пыль, пока фигура не засияет, как живой идол. В сопровождении четырех меньших вождей, украшенных золотыми коронами, браслетами и подвесками, правитель садится на бальсовый плот, нагруженный золотыми тунжо, изумрудами и драгоценными подношениями.\n\nКогда плот достигает центра священного озера, барабаны замолкают. Золотая фигура ныряет в темные воды, смывая золото в качестве подношения богине, обитающей под поверхностью. Вожди выбрасывают свои сокровища следом, а толпа на берегу разражается песнями и празднованием.\n\nЭтот ритуал, который однажды доведет испанских конкистадоров до безумия в поисках «Эльдорадо», для муиска является чем-то гораздо более глубоким: это момент, когда земная власть освящена божественным принятием." #NT!
 nd_mca.2.a: "Мы будем сиять, как само солнце. Пусть наш суверенитет будет золотым" #NT!
 nd_mca.2.b: "Боги почитаются. Пусть их благословения поддерживают наш народ" #NT!
 nd_mca.3.t: "Неповиновение Тундамы" #NT!
 nd_mca.3.d: "До высокогорья доходит слух, что Тундама, касик северных приграничных земель, поклялся, что ни один воин Муиска никогда не преклонит колени перед иностранными захватчиками. Когда один из его воинов-геча осмелился предположить, что разумнее было бы пойти на компромисс, Тундама схватил этого человека и отрезал ему уши и левую руку перед собравшейся армией, заявив, что тем, кто советует сдаться, не нужны уши, чтобы слышать команды, и руки, чтобы держать оружие.\n\nВ битве на болоте Варгас четыре тысячи воинов-геча Тундамы столкнулись с бронированной кавалерией, стальным оружием и порохом: технологиями, с которыми они никогда не сталкивались. Они сражались копьями, дубинами, пращами и с жестоким убеждением, что их родина стоит больше, чем их жизни. Хотя битва была проиграна, неповиновение Тундамы стало бессмертным духом народа Муиска, отказом принять завоевание как судьбу." #NT!
 nd_mca.3.a: "Его отвага отзывается эхом в каждой горе. Мы никогда не сдадимся" #NT!
 nd_mca.4.t: "Храм Суа в Сугамукси" #NT!
 nd_mca.4.d: "В священном городе Сугамукси (известном нам как Согамосо, Город Солнца) стоит великий храм, посвященный Суа, богу Солнца. В его стенах ирака, высший религиозный авторитет Муиски, руководит церемониями, отмечающими смену времен года и циклы календаря Муиска.\n\nХрам наполнен золотыми подношениями, изумрудами, расписными хлопчатобумажными тканями и мумифицированными останками почитаемых предков. Паломники путешествуют со всей конфедерации в поисках благословения ирака, принося в жертву соль, ткань и драгоценные камни. Астрономические наблюдения храма определяют посевные сезоны и праздничные дни, связывая практические ритмы сельского хозяйства с космическим порядком.\n\nХрам Суа — это больше, чем просто место поклонения: это духовное сердце, которое объединяет конфедерацию, место, где муиски понимают свое положение между землей и небом." #NT!
 nd_mca.4.a: "Солнце наблюдает за Муиской. Мы чтим его вечный свет" #NT!
 nd_mca_guecha_border_system: "Пограничная система Геча" #NT!
 nd_mca_guecha_border_system_desc: "Воины геча представляли собой элитный военный класс, выбранный из самых храбрых людей, независимо от благородного происхождения. Годами прошедшие боевую подготовку, они защищали границы конфедерации со своих укрепленных постов в долинах Тенза и Убаке." #NT!
 nd_mca_salt_trade_mastery: "Мастерство торговли солью" #NT!
 nd_mca_salt_trade_mastery_desc: "Муиска контролировали богатейшие соляные месторождения на колумбийском нагорье в Сипакире, Немоконе и Таусе. Соль была их основной валютой и самым ценным торговым товаром, за что они получили прозвище «Соляные люди»." #NT!
 nd_mca_terraced_agriculture: "Террасное сельское хозяйство" #NT!
 nd_mca_terraced_agriculture_desc: "На высоком плато Альтиплано Кундибоясенсе муиска построили террасные поля для выращивания кукурузы, картофеля и киноа. Согласно их мифологии, культурный герой Бочика научил их строить террасы и оросительные каналы." #NT!
 nd_mca_sugamuxi_tradition: "Традиция Сугамукси" #NT!
 nd_mca_sugamuxi_tradition_desc: "В священном городе Сугамукси находился великий Храм Солнца, которым руководил ирака, высший религиозный авторитет. Паломники со всей конфедерации принесли в дар золото, изумруды и расписную ткань." #NT!
 nd_mca_muisca_calendar: "Календарь Муиска" #NT!
 nd_mca_muisca_calendar_desc: "Муиска разработали сложный лунно-солнечный календарь, основанный на боге солнца Суа и богине луны Чиа, с делением на синодические и сидерические месяцы, сельские годы по 12-13 месяцев, обычные годы по 20 месяцев и священные годы по 37 месяцев." #NT!
 nd_mca_cotton_manta_weaving: "Хлопковое плетение манты" #NT!
 nd_mca_cotton_manta_weaving_desc: "Женщины муиска были мастерами-ткачихами, которые производили расписные манты из хлопка, который продавали из более теплых низин. Используя деревянные веретена и глиняные валики, они создавали сложные ткани, окрашенные индиго, шафраном и натуральными пигментами." #NT!
 nd_mca_tunjo_craft: "Тунджо Крафт" #NT!
 nd_mca_tunjo_craft_desc: "Ювелиры Муиски создавали тунжо (небольшие вотивные фигурки, отлитые из тумбаги, сплава золота и меди) в технике выплавляемого воска. Эти подношения не носили как украшения, а помещали в священные места в честь богов." #NT!
 nd_mca_el_dorado_ceremony: "Церемония Эльдорадо" #NT!
 nd_mca_el_dorado_ceremony_desc: "Инвеститура новой Зипы включала покрытие правителя золотым песком и отплытие к центру озера Гуатавита, где золото и изумруды были брошены в воду в качестве подношений. Этот ритуал вдохновил легенду об Эльдорадо." #NT!
 nd_mca_tundama_valor: "Доблесть Тундамы" #NT!
 nd_mca_tundama_valor_desc: "Касик Тундама олицетворял боевой дух Муиски, отказываясь подчиняться иностранным захватчикам и возглавляя своих воинов геча в дерзком сопротивлении в битве при болоте Варгас в 1539 году." #NT!
 nd_mca_emerald_trade: "Изумрудная Торговля" #NT!
 nd_mca_emerald_trade_desc: "Муиска контролировали доступ к богатейшим месторождениям изумрудов в Америке, в первую очередь в Сомондоко. Изумруды продавались на огромные расстояния и служили престижным товаром, предлагаемым в священных местах." #NT!
 nd_mca_cacique_councils: "Советы касиков" #NT!
 nd_mca_cacique_councils_desc: "Конфедерация Муиска управлялась через систему региональных касиков, которые сохраняли местную автономию, признавая при этом власть Зипа и Заке. Их укрепленные церкадо служили административными центрами." #NT!
 nd_mca_guecha_training: "Обучение Геча" #NT!
 nd_mca_guecha_training_desc: "Новобранцы класса воинов геча прошли годы тщательной подготовки, прежде чем были направлены на пограничные посты. Для боеспособности они коротко постриглись и носили характерные многослойные хлопчатобумажные доспехи." #NT!
 nd_mca_highland_skirmishers: "Горные застрельщики" #NT!
 nd_mca_highland_skirmishers_desc: "Воины муиска дополнили свою элитную гэча более легкими войсками, вооруженными пращами и духовыми трубками, используя гористую местность Альтиплано в своих интересах в засадах и перестрелках." #NT!
 nd_mca_confederation_diplomacy: "Дипломатия Конфедерации" #NT!
 nd_mca_confederation_diplomacy_desc: "Муиска поддерживали сложную дипломатическую систему между владениями Зипа, Заке, Ирака и Тундама, управляя союзами и соперничеством посредством церемониальных обменов и брачных уз." #NT!
 nd_mca_bochica_legacy: "Наследие Бочика" #NT!
 nd_mca_bochica_legacy_desc: "Считалось, что Бочика, бородатый бог-посланник Муиски, научил людей сельскому хозяйству, ткачеству, металлургии и правильному управлению. Его учение сформировало моральную и практическую основу цивилизации Муиска." #NT!
 nd_mca_salt_currency_system: "Соляная валютная система" #NT!
 nd_mca_salt_currency_system_desc: "Соль служила основным средством обмена в торговле Муиска, ее ценность была общепризнана в горных районах Колумбии и за ее пределами. Соляные шахты Сипакиры служили сокровищницей Конфедерации.\n\n#italic Доступно в: $nd_mca_salt_works$#!" #NT!
 nd_mca_plateau_fortifications: "Укрепления плато" #NT!
 nd_mca_plateau_fortifications_desc: "Естественная география Альтиплано Кундибоясенсе, окруженного горами и доступного только через узкие перевалы, была дополнена пограничными постами геча и укрепленными церкадами, чтобы создать грозную оборонительную сеть." #NT!
 nd_mca_plateau_defense_doctrine: "Доктрина обороны плато" #NT!
 nd_mca_plateau_defense_doctrine_desc: "Опираясь на многолетний опыт ведения войны в горах, командиры Муиски разработали тактику, которая использовала горный рельеф, преимущество в высоте и глубокое знание защитниками каждой долины и перевала." #NT!
 nd_mca_highland_resistance: "Хайлендское сопротивление" #NT!
 nd_mca_highland_resistance_desc: "Дух Тундамы продолжал жить в традициях горного сопротивления Муиска: использовать горы в качестве естественных укреплений, преследовать захватчиков с помощью партизанской тактики и делать завоевания слишком дорогостоящими для поддержания." #NT!
 nd_mca_depletion_gilding: "Истощение Позолота" #NT!
 nd_mca_depletion_gilding_desc: "Металлурги Муиски усовершенствовали технику истощения позолоты, обрабатывая сплавы тумбага кислотой для растворения поверхностной меди, оставляя тонкий, но блестящий слой чистого золота на поверхности своих церемониальных предметов.\n\n#italic Доступно в: $nd_mca_goldsmith_workshop$#!" #NT!
 nd_mca_zipa_centralization: "Централизация Зипа" #NT!
 nd_mca_zipa_centralization_desc: "Зипа Бакаты постепенно расширила центральную власть над южной конфедерацией, стандартизировав сбор дани, судебную власть и военное командование в ранее автономных владениях касиков." #NT!
 nd_mca_defensive_confederacy: "Оборонительная Конфедерация" #NT!
 nd_mca_defensive_confederacy_desc: "Когда этого потребовали внешние угрозы, обычно автономные владения конфедерации объединили своих воинов геча под совместным командованием, объединив рабочую силу десятков территорий касиков в единую оборонительную силу." #NT!
 nd_mca_muisca_endurance: "Муиска Эндуранс" #NT!
 nd_mca_muisca_endurance_desc: "На протяжении столетий внешнего давления и внутренних изменений народ Муиска сохранил свою идентичность, свои традиции и свой боевой дух: адаптируясь, не отказываясь от своей сути." #NT!
 nd_mca_altiplano_governance: "Управление Альтиплано" #NT!
 nd_mca_altiplano_governance_desc: "Зрелое государство Муиска уравновешивало центральную власть с региональной автономией, позволяя правительству Зипы поддерживать порядок и собирать дань, в то время как касики сохраняли за собой местную судебную и церемониальную власть." #NT!
 nd_mca_mineral_wealth: "Минеральные богатства" #NT!
 nd_mca_mineral_wealth_desc: "Колумбийское нагорье в изобилии дает изумруды, золото, медь и соль. Систематическая эксплуатация этих минеральных ресурсов превращает природные богатства конфедерации в устойчивое процветание." #NT!
 nd_mca_manta_export_mastery: "Мастерство экспорта манты" #NT!
 nd_mca_manta_export_mastery_desc: "Раскрашенные Муиской хлопковые манты, известные своими яркими цветами и замысловатым узором, становятся основным экспортным товаром. Мастера текстиля Конфедерации совершенствуют свои методы крашения, чтобы удовлетворить растущий спрос.\n\n#italic Доступно в: $nd_mca_cotton_weaving_house$#!" #NT!
 nd_mca_muisca_national_identity: "Национальная идентичность Муиски" #NT!
 nd_mca_muisca_national_identity_desc: "Народ Муиска формирует современное национальное сознание, основанное на их древнем наследии: золотых церемониях Гуатавиты, неповиновении Тундамы, мудрости Бочика и единстве конфедерации." #NT!
 nd_mca_modern_confederation: "Современная Конфедерация" #NT!
 nd_mca_modern_confederation_desc: "Древняя система советов касиков превращается в современное конфедеративное правительство, сохраняющее баланс между центральной властью и региональной автономией, который поддерживал Муиску на протяжении веков." #NT!
 nd_mca_andean_solidarity: "Андская солидарность" #NT!
 nd_mca_andean_solidarity_desc: "Муиска поддерживают родственные горные народы в Андах, создавая союзы, основанные на общем наследии, взаимной защите и общих связях горных цивилизаций." #NT!
 nd_mca_modern_army: "Современная армия" #NT!
 nd_mca_modern_army_desc: "Традиции воинов геча сливаются с современной военной наукой, создавая дисциплинированные горные войска, сочетающие древние знания ведения войны в горах с современной тактикой и подготовкой." #NT!
 a_nd_mca_guecha_warriors: "Геча Воины" #NT!
 a_nd_mca_guecha_warriors_desc: "Элитные защитники границ Муиски, выбранные за храбрость независимо от рождения. Вооружены копьями, дубинками, пращами и духовыми трубками, защищены толстыми многослойными хлопчатобумажными мантиями." #NT!
 a_nd_mca_guecha_levy: "Геча Леви" #NT!
 a_nd_mca_guecha_levy_desc: "Выросшие в деревнях воины, следующие традиции геча, обученные защищать горные границы конфедерации." #NT!
 a_nd_mca_tundama_vanguard: "Авангард Тундамы" #NT!
 a_nd_mca_tundama_vanguard_desc: "Самые свирепые воины геча, названные в честь касика, отказавшегося подчиниться иностранным захватчикам. Они сражаются с яростью людей, считающих, что капитуляция хуже смерти." #NT!
 a_nd_mca_highland_slingers: "Хайлендские пращники" #NT!
 a_nd_mca_highland_slingers_desc: "Застрельщики, вооруженные пращами и духовыми трубками, используют гористую местность Альтиплано, чтобы преследовать врагов с выгодных позиций." #NT!
 a_nd_mca_plateau_defenders: "Защитники плато" #NT!
 a_nd_mca_plateau_defenders_desc: "Дисциплинированные горные войска, сочетающие традиции воинов геча с навыками защиты, отточенными поколениями горных войн." #NT!
 nd_mca_salt_works: "Соляной завод Зипакира" #NT!
 nd_mca_salt_works_desc: "Предприятия по добыче и переработке соли, которые сделали Муиску «Соляными людьми». Соль была основным товаром торговли конфедерации и служила валютой." #NT!
 nd_mca_goldsmith_workshop: "Ювелирная мастерская" #NT!
 nd_mca_goldsmith_workshop_desc: "Здесь ремесленники Муиски создают тундзё, священные статуэтки по обету, используя технику выплавляемого воска с тумбагой, сплавом золота и меди, который отражает свет бога Солнца Суа." #NT!
 nd_mca_temple_of_sue: "Храм Суа" #NT!
 nd_mca_temple_of_sue_desc: "Храм Солнца, созданный по образцу великого храма Суа в Сугамукси, где ирака руководил астрономическими наблюдениями, календарными церемониями и духовной жизнью конфедерации." #NT!
 nd_mca_highland_terrace: "Хайленд Террас" #NT!
 nd_mca_highland_terrace_desc: "Террасные поля, высеченные на склонах Альтиплано-Кундибоясенсе, выращивают кукурузу, картофель и киноа на возвышенностях, где плоских сельскохозяйственных угодий мало." #NT!
 nd_mca_emerald_depot: "Изумрудное Депо" #NT!
 nd_mca_emerald_depot_desc: "Торговый центр изумрудов Сомондоко и Музо: богатейших месторождений в Америке. Здесь драгоценные зеленые камни ограняются, сортируются и готовятся к продаже." #NT!
 nd_mca_cercado_palace: "Дворец Серкадо" #NT!
 nd_mca_cercado_palace_desc: "Укрепленная резиденция правителя Муиски, окруженная деревянным частоколом. Внутри касик вершит суд, получает дань, хранит церемониальное золото и отправляет правосудие." #NT!
 nd_mca_cotton_weaving_house: "Хлопкоткацкий дом" #NT!
 nd_mca_cotton_weaving_house_desc: "Мастерская, где женщины Муиска производят расписные хлопчатобумажные манты, которыми славятся горные жители. Используя деревянные веретена и глиняные валики, они создают ткани, окрашенные натуральными пигментами." #NT!
 nd_mca_guecha_barracks: "Казармы Геча" #NT!
 nd_mca_guecha_barracks_desc: "Тренировочные площадки, где новобранцы всех социальных слоев проходят годы боевой подготовки, прежде чем получить звание воина геча и быть направленным на пограничный пост." #NT!
 nd_mca_salt_processing: "Обработка соли" #NT!
 nd_mca_salt_processing_desc: "Добыча и переработка соли из горных пород Сипакиры с использованием каменных орудий и древесного топлива." #NT!
 nd_mca_lost_wax_casting: "Литье по выплавляемым моделям" #NT!
 nd_mca_lost_wax_casting_desc: "Отливка священных фигурок тундзё из сплава тумбага по выплавляемой технике, изготовление церемониальных украшений высокого мастерства." #NT!
 nd_mca_temple_offerings: "Храмовые подношения" #NT!
 nd_mca_temple_offerings_desc: "Церемониальные подношения керамики, красок и пчелиного воска для ритуальных костров и священных ламп для поддержания храма Суа." #NT!
 nd_mca_terrace_maintenance: "Уход за террасами" #NT!
 nd_mca_terrace_maintenance_desc: "Текущий уход за террасами с каменными стенами, которые делают возможным сельское хозяйство в горах." #NT!
 nd_mca_emerald_cutting: "Изумрудная огранка" #NT!
 nd_mca_emerald_cutting_desc: "Квалифицированная огранка и полировка необработанных изумрудов из месторождений Сомондоко и Музо с использованием каменных абразивов и металлических инструментов." #NT!
 nd_mca_palace_upkeep: "Содержание дворца" #NT!
 nd_mca_palace_upkeep_desc: "Обслуживание дворца Серкадо, включая его деревянный частокол, церемониальные залы, административные записи и хранилища дани." #NT!
 nd_mca_cotton_processing: "Крашение хлопка" #NT!
 nd_mca_cotton_processing_desc: "Переработка хлопкового волокна, продаваемого в высокогорных районах, и окрашивание его натуральными пигментами для производства ярких тканей, которые отличают ткачей Муиски." #NT!
 nd_mca_barracks_upkeep: "Содержание казарм" #NT!
 nd_mca_barracks_upkeep_desc: "Поддержание в исправном состоянии оружия, кожаного снаряжения, тренировочных помещений и хлопчатобумажных доспехов воинов геча." #NT!
 nd_mca_salt_curing: "Лечение солью Муиска" #NT!
 nd_mca_salt_curing_desc: "Техника консервации с использованием горной соли и глиняных горшков для консервирования и хранения продуктов питания для торговли и долгосрочного снабжения." #NT!
 nd_mca_gold_plating: "Истощение Позолота" #NT!
 nd_mca_gold_plating_desc: "Обработка сплава тумбага кислотой для растворения поверхностной меди, позволяющая получить блестяще позолоченные церемониальные предметы." #NT!
 nd_mca_manta_dyeing: "Крашение манты" #NT!
 nd_mca_manta_dyeing_desc: "Ткачество и крашение хлопчатобумажных мант с использованием волокна, продаваемого в высокогорье, и натуральных пигментов для производства характерного текстиля Muisca." #NT!
 nd_mca_formed_tt: "Была образована Конфедерация Муиска." #NT!
 nd_mca_path_a_tt: "Выбрал путь Золотой Зипы" #NT!
 nd_mca_path_b_tt: "Выбрать неповиновение Тундамы" #NT!
  # ===== DESTINY LOCALIZATION ===== 
  # Destiny advance names and descriptions 
 nd_mca_destiny: "Судьба Муиски" #NT!
 nd_mca_destiny_desc: "Конфедерация была создана. Горные народы говорят в один голос. Теперь вопрос не в том, выживут ли Муиски, а в том, какими они станут." #NT!
 nd_mca_dest_emerald_roads: "Изумрудные дороги" #NT!
 nd_mca_dest_emerald_roads_desc: "Контролируйте великие торговые артерии Колумбии, долину Каука и реку Магдалена, чтобы направлять богатство изумрудов, золота и соли через рынки Муиски. Станьте владельцем Кали и Момпоса и накопите 1000 золотых." #NT!
 nd_mca_dest_markets_of_gold: "Рынки золота" #NT!
 nd_mca_dest_markets_of_gold_desc: "Расширьте торговую сеть на юг до перекрестка Анд в Кито, присоединитесь к современным банковским учреждениям и накопите 2000 золотых, чтобы доказать, что Муиска — самые богатые люди в Америке." #NT!
 nd_mca_dest_golden_kingdom: "Золотое Королевство" #NT!
 nd_mca_dest_golden_kingdom_desc: "Захватите Панамский перешеек, чтобы контролировать ворота между двумя океанами, доведите свое королевство до 1500 общего уровня развития и достигните 75 уровня престижа. Легенда об Эльдорадо всегда была правдой: все это время это была Муиска." #NT!
 nd_mca_dest_tairona_war: "Тайронская война" #NT!
 nd_mca_dest_tairona_war_desc: "Завоюйте города Тайрона в Сьерра-Неваде и подчините народ зену, обитающий в низинах. Имея 30-тысячную армию, воины геча докажут, что в горной местности рождаются самые свирепые солдаты Америки." #NT!
 nd_mca_dest_mountain_dominion: "Горный Доминион" #NT!
 nd_mca_dest_mountain_dominion_desc: "Выйдите за пределы колумбийского нагорья, чтобы захватить венесуэльские города Каракас и Коро. Имея 50 000 солдат, Муиска будет контролировать каждый горный перевал от Карибского моря до Льяноса." #NT!
 nd_mca_dest_andean_hegemony: "Андская гегемония" #NT!
 nd_mca_dest_andean_hegemony_desc: "Идите на юг вдоль Анд, чтобы заявить права на Куско, пуп мира инков. Имея общий уровень развития 1500 и престиж 75, Муиска будут править величайшей горной империей со времен самих инков." #NT!
  # Destiny DHE event text 
 nd_mca.5.t: "Конфедерация Юнайтед" #NT!
 nd_mca.5.d: "Конфедерация Муиска представляет собой один народ, объединенный единой целью. Золото Зипы и мудрость Заке соединены. Священные озера хранят наши подношения, соляные шахты наполняют нашу казну, а геча стоит на страже на каждом проходе. Построим ли мы золотую империю или горную крепость, мир узнает имя Муиски." #NT!
 nd_mca.5.a: "Горная местность наша. Теперь мы куем нашу судьбу" #NT!
 nd_mca.6.t: "Караваны по Изумрудным дорогам" #NT!
 nd_mca.6.d: "Великие торговые пути колумбийского нагорья теперь проходят через руки Муиски. От изумрудных рудников Сомондоко до соляных равнин Сипакиры, от золотых мастерских низин до хлопковых рынков долины Каука — торговая сеть связывает разрозненные народы Анд. Торговцы Муиска везут соленые лепешки, изумруды и раскрашенные манты по горным тропам, по которым тысячу лет назад ходили их предки. Но сейчас масштабы торговли затмевают все, что могла себе представить старая конфедерация." #NT!
 nd_mca.6.a: "Пусть богатство гор перетечет ко всем, кто торгует с нами." #NT!
 nd_mca.7.t: "Золотые рынки" #NT!
 nd_mca.7.d: "Торговая сеть Муиска превзошла все, что могли себе представить старые касики. Золото из горных мастерских, изумруды с восточных склонов, соль из великих рудников и хлопчатобумажные манты из сотен ткацких домов: все это течет через рынки, простирающиеся от экваториального побережья до венесуэльских равнин.\n\nНо это богатство требует направления. Должны ли мы инвестировать в инфраструктуру самой торговли, строительство складов, улучшение дорог и привлечение поселенцев в наши растущие города? Или мы воспользуемся нашим процветанием, чтобы поглотить разнообразные народы завоеванных земель, превратив бывших врагов в сограждан золотой конфедерации?" #NT!
 nd_mca.7.a: "Постройте рынки, и люди придут" #NT!
 nd_mca.7.b: "Наше богатство объединит все народы горной местности." #NT!
 nd_mca.8.t: "Открытие Золотого Царства" #NT!
 nd_mca.8.d: "Когда испанские конкистадоры отчаянно искали Эльдорадо, они так и не поняли, что сокровище было не золотым городом, а людьми, которые понимали истинную цель золота: как священного приношения, как искусства, как средства, посредством которого смертные чтят божественное. Теперь муиски построили то, о чем конкистадоры могли только мечтать: королевство, где богатство течет из каждой шахты, каждого рынка, каждой мастерской.\n\nПанамский перешеек открывает два океана для нашей торговли. Рынки Кито, Кали и Момпоса кипят от активности. Легенда сбылась. Но как нам использовать эту золотую судьбу?" #NT!
 nd_mca.8.a: "Мы будем перекрестком мира" #NT!
 nd_mca.8.b: "Пусть торговый класс приведет нас в золотой век" #NT!
 nd_mca.9.t: "Падение Тейуны" #NT!
 nd_mca.9.d: "Тайроны, строители огромного каменного города Теюна, спрятанного на покрытых джунглями склонах Сьерра-Невада-де-Санта-Марта, пали перед наступлением геча. Их террасный город с сетью каменных дорожек и круглых платформ теперь признает суверенитет Муиски. На юге золотоделы Зену, чье филигранное мастерство может соперничать с нашими мастерами тундзё, также подчинились.\n\nДух Тундамы живет в каждом воине-геча, взбиравшемся по склонам джунглей. Горные районы больше не просто защищаются: они расширяются." #NT!
 nd_mca.9.a: "Геча несут дух Тундамы, куда бы они ни маршировали." #NT!
 nd_mca.10.t: "Доминион гор" #NT!
 nd_mca.10.d: "От побережья Карибского моря до высокогорья Венесуэлы горные перевалы теперь подчиняются власти Муиски. Каракас и Коро, оказавшиеся когда-то вне досягаемости горных властей, несут знамя конфедерации. Воины геча доказали, что в горах рождаются солдаты, которым нет равных в Америке.\n\nНо как нам удержать это расширенное владычество? Сами горы — наша величайшая крепость. Должны ли мы укрепить каждый перевал и долину, превратив все Анды в неприступную оборонительную сеть? Или мы должны объединить покоренные народы в настоящую федерацию, завоевав лояльность посредством справедливого управления, а не только силой?" #NT!
 nd_mca.10.a: "Укрепляйте каждый перевал: горы — наши стены" #NT!
 nd_mca.10.b: "Предложите справедливые условия: желающий подданный стоит десять фортов." #NT!
 nd_mca.11.t: "Гегемония Анд" #NT!
 nd_mca.11.d: "Куско пал. Пуп мира инков, город в центре Тавантинсуйу, теперь признает верховенство Конфедерации Муиска. От Карибского моря до сердца Анд, от побережья Венесуэлы до священных долин Перу горы подчиняются одному народу.\n\nТундама когда-то сражалась с четырьмя тысячами воинов геча против бронетанковой кавалерии и пороха. Он проиграл битву, но завоевал бессмертие. Теперь его духовные наследники построили то, о чем он мог только мечтать: горную империю, которую не сможет завоевать ни одна сила на земле. Как нам закрепить это наследие?" #NT!
 nd_mca.11.a: "Мы непокоренные. Пусть все знают цену неповиновения" #NT!
 nd_mca.11.b: "Горы вечны. И таким будет наше владычество" #NT!
  # Timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_mca_dest_gilded_markets: "Позолоченные рынки" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_gilded_markets: "Сеть торговых постов и складов направляет богатство шахт и мастерских на рынки Муиски, привлекая поселенцев и ремесленников со всей Америки, хотя армия страдает от сокращения финансирования." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_sacred_waters: "Священные воды Гуатавиты" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_sacred_waters: "Подношения, брошенные в озеро Гуатавита, были вознаграждены сторицей. Разнообразные народы высокогорья находят общую цель в процветании Муиски, их культуры сливаются в более богатое целое." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_new_dorado: "Новое Эльдорадо" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_new_dorado: "Легенда реальна. Золотое королевство Муиска стоит на перекрестке мира, его дипломатов приветствуют во всех дворах, его рынки являются предметом зависти для всех стран." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_golden_age: "Золотой век Муиски" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_golden_age: "Торговый класс возглавляет эпоху беспрецедентного процветания, хотя боевой дух конфедерации ослабевает, поскольку богатство заменяет войну как меру величия." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_mountain_bulwark: "Горный оплот" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_mountain_bulwark: "Каждый горный перевал укреплён, каждая долина — зона поражения. В горной местности быстро набирают новых людей и быстро восстанавливаются, представляя непреодолимую стену из камня и стали для любого захватчика." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_highland_federation: "Федерация Хайленда" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_highland_federation: "Покоренным народам предлагается место в конфедерации на справедливых условиях и совместном управлении: хотя эта щедрость порождает определенное самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_unconquered_peaks: "Непокоренные вершины" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_unconquered_peaks: "Муиска распространяют власть по всей Андской цепи, вербуя наемников из покоренных народов и предъявляя претензии любому, кто осмелится бросить вызов господству горцев." #NT!
 STATIC_MODIFIER_NAME_nd_mca_dest_eternal_highlands: "Вечное нагорье" #NT!
 STATIC_MODIFIER_DESC_nd_mca_dest_eternal_highlands: "Война в горах совершенствовалась на протяжении многих поколений. Конница муиска доминирует в горных долинах, их командиры извлекают выгодные условия из каждого сражения, а завоеванные территории отдают свои богатства конфедерации." #NT!
  # Destiny building names and descriptions 
 nd_mca_guatavita_treasury: "Казначейство Гуатавиты" #NT!
 nd_mca_guatavita_treasury_desc: "Великая сокровищница, построенная на берегу священного озера, где хранится, пересчитывается и реинвестируется золотое богатство Конфедерации. То, что боги получали в качестве подношения, народ теперь получает в качестве торговли." #NT!
 nd_mca_tundama_citadel: "Цитадель Тундамы" #NT!
 nd_mca_tundama_citadel_desc: "Горная крепость, названная в честь касика, отказавшегося сдаться. Построенный в живой скале Анд, он служит одновременно гарнизоном и символом непобедимого духа горцев." #NT!
  # Destiny building PM names and descriptions 
 nd_mca_treasury_maintenance: "Обслуживание казначейства" #NT!
 nd_mca_treasury_maintenance_desc: "Для ведения записей казначейства, хранилищ и торговых операций требуются квалифицированные клерки, качественная бумага и хорошая работа по металлу." #NT!
 nd_mca_citadel_upkeep: "Содержание Цитадели" #NT!
 nd_mca_citadel_upkeep_desc: "Для поддержания укреплений, арсеналов и тренировочных площадок горной цитадели требуются камень, оружие и провизия." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_mca_bureaucracy_authority: "Власть Конфедерации Муиска" #NT!
 AUTO_MODIFIER_DESC_nd_mca_bureaucracy_authority: "Институты горной федерации Муиска (биполярная диархия Зипа-Заке, жречество солнца Ирака в Сугамуши, монополия на соль и изумруды, закрепленная на Сипакире и Музо, а также каста воинов гвеча) кристаллизовались в слаженный административный аппарат. На этом фундаменте [MCA.GetName] придает своим отличительным институтам Андской конфедерации прочную форму." #NT!
  
 mca_zipa_zaque_diarchy_bureaucracy: "Диархия Зипа-Заке" #NT!
 mca_zipa_zaque_diarchy_bureaucracy_desc: "Муиска были не единым королевством, а биполярной конфедерацией, два верховных вождя которой, Зипа Баката на юге и Заке Хунза на севере, разделили между собой горные кланы зыбин, при этом Ирака и Тундама контролировали меньшие суверенные зоны внутри одной и той же федерации. Баката и Хунза координировали свои действия против внешних врагов в низменностях (Панче в долине Магдалены и Музо на западных склонах), но вели периодические войны за престол друг против друга всякий раз, когда верховный вождь умирал, не оставив бесспорного наследника-сына сестры. Двоевластие представляло собой постоянное нестабильное равновесие, которое испанские энтрады 1537–1539 годов нашли и использовали, натравливая Бакату и Хунзу друг против друга, пока оба не были поглощены завоеванием." #NT!
  
 mca_iraca_priesthood_bureaucracy: "Касик Сугамукси" #NT!
 mca_iraca_priesthood_bureaucracy_desc: "Жречество Ирака в храме Сугамукси в современном городе Бояка Согамосо было религиозным центром культурной сферы Муиска, признанным законным даже Баката и Хунза, когда они воевали друг с другом. Касик Ирака был главным жрецом Солнца Сью и Луны Чиа, проводил чередующиеся посты честолюбивых касиков в темных пещерах перед их вступлением в должность и руководил великим обрядом подношения золотого озера Гуатавита, который подарил Европе легенду об Эльдорадо. Испанцы сожгли до основания деревянный храм Сугамукси во время завоевания в 1537 году, несчастный случай, который хроники приписывают неосторожной свече в кладовой, украшенной золотом и мантией; священство не пережило пожар." #NT!
  
 mca_salt_emerald_monopoly_bureaucracy: "Монополия на соль и изумруд" #NT!
 mca_salt_emerald_monopoly_bureaucracy_desc: "Муиска располагалась на единственных крупных месторождениях соли в северных Андах, ее добывали открытым способом в Сипакире и варили из концентрированной морской воды в Немоконе и Таусе. Они также контролировали изумрудные жилы в Музо, Сомондоко и Чиворе: единственный коммерческий источник прекрасных изумрудов в доколумбовом мире. Назначенные государством горняки работали на соляных карьерах в сезонную ротацию; добыча изумрудов была прерогативой кланов, имеющих лицензию короны, которые платили Зипе дань необработанными камнями. Соленые хлебцы и золото-медные слитки тумбага были предметом дальней торговли Муиски, которую обменивали с жителями карибских низменностей на хлопок, сушеную рыбу, шкуры ягуара и перья ара." #NT!
  
 mca_guecha_warriors_bureaucracy: "Каста воинов геча" #NT!
 mca_guecha_warriors_bureaucracy_desc: "Геча представляли собой полупрофессиональный класс воинов Муиска, набираемых из самых сильных молодых людей кланов зыбин, делавших татуировку один раз на губе за каждого убитого врага и награждаемых Зипа земельными грантами, вторыми женами и лицензией на ношение золотого украшения на носу, в противном случае предназначенного для касиков. Их основная роль заключалась в защите границы от панче в долине Магдалены и музо на западных склонах, а также в династическом обеспечении соблюдения правил всякий раз, когда избранный касик отказывался от предписанного поста в Ираке. Гуэча хором кричали на марше, чтобы напугать врага, и сражались метательными копьями, пращами и дубинами из пальмового дерева, но против испанской лошади и стали они были уничтожены при Фунце в 1538 году." #NT!
 STATIC_MODIFIER_NAME_nd_mca_zipa_zaque_compact: "Зипа-Заке Компакт" #NT!
 STATIC_MODIFIER_DESC_nd_mca_zipa_zaque_compact: "Двойное руководство Конфедерации: Зипа Баката на юге и Заке Хунза на севере управляют как равноправные монархи, а король-священник Ирака в Сугамукси обеспечивает ритуальное единство над светской королевской властью. Учредительные касики сохраняют реальную автономию. Конфедерация децентрализована учредительным уставом, а не унитарным королевством." #NT!
