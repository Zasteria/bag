l_russian:
 STATIC_MODIFIER_NAME_nd_cso_maritime_supremacy: "Сокровище южных морей" #NT!
 STATIC_MODIFIER_DESC_nd_cso_maritime_supremacy: "С сверкающей столицей Ханчжоу, восстановленная Сун управляет крупнейшей морской торговой сетью в известном мире, ее гавани изобилуют джонками, доставляющими на каждый берег шелк, фарфор и чай." #NT!
 STATIC_MODIFIER_NAME_nd_cso_confucian_meritocracy: "Мандат кисти" #NT!
 STATIC_MODIFIER_DESC_nd_cso_confucian_meritocracy: "Реставрация песни ставит стипендию превыше всего. Благодаря строгим гражданским экзаменам и мудрости неоконфуцианской философии царством управляют образованные люди, а не сильные мира сего." #NT!
 STATIC_MODIFIER_NAME_nd_cso_paper_money_expansion: "Распространение валюты" #NT!
 STATIC_MODIFIER_DESC_nd_cso_paper_money_expansion: "Бумажные деньги свободно циркулируют по рынкам Сун, смазывая торговлю и обогащая торговцев по всей Янцзы." #NT!
 STATIC_MODIFIER_NAME_nd_cso_paper_money_regulation: "Фискальная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_cso_paper_money_regulation: "Тщательное регулирование бумажной валюты предотвращает инфляцию и укрепляет резервы казначейства." #NT!
 STATIC_MODIFIER_NAME_nd_cso_yangtze_offensive: "Речные драконы на свободе" #NT!
 STATIC_MODIFIER_DESC_nd_cso_yangtze_offensive: "Флот Сун наносит удар со стороны Янцзы, гребные колеса крутятся, а бомбы падают на врага, словно град." #NT!
 STATIC_MODIFIER_NAME_nd_cso_yangtze_consolidation: "Речная стена" #NT!
 STATIC_MODIFIER_DESC_nd_cso_yangtze_consolidation: "Янцзы становится непреодолимым барьером, укрепленные позиции и патрульные флоты не позволяют северным захватчикам пересечь ее." #NT!
 STATIC_MODIFIER_NAME_nd_cso_zhuxi_orthodoxy: "Асцендент четырех книг" #NT!
 STATIC_MODIFIER_DESC_nd_cso_zhuxi_orthodoxy: "Комментарии Чжу Си становятся основой всего обучения, объединяя царство единой моральной философией." #NT!
 STATIC_MODIFIER_NAME_nd_cso_zhuxi_pragmatism: "Исследование вещей" #NT!
 STATIC_MODIFIER_DESC_nd_cso_zhuxi_pragmatism: "Неоконфуцианский акцент на гэву, исследовании вещей, стимулирует практическую науку и эффективность управления." #NT!
 nd_cso.1.t: "Восстановление песни" #NT!
 nd_cso.1.d: "Знамена Сун снова развеваются над Ханчжоу. Там, где династия когда-то отступила на юг перед натиском чжурчжэней, теперь она управляет самым богатым и самым развитым царством в мире. Долина Янцзы изобилует торговлей, ее города затмевают все города Европы, а ее инновации в области бумажных денег, пороха и книгопечатания не имеют себе равных.\n\nНо перед Сун стоит выбор, который определял ее с момента ее основания: какой силой она должна быть? Сила империи всегда заключалась не в ее армиях, а в ее купцах и ученых. Будет ли восстановленная династия опираться на свою непревзойденную морскую торговлю или обратится к себе, чтобы усовершенствовать неоконфуцианскую бюрократию, которая превращает само управление в искусство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_cso.1.a: "Наши корабли доставят богатство Сун во все моря." #NT!
 nd_cso.1.b: "Экзаменационный зал – это фундамент империи." #NT!
 nd_cso.2.t: "Революция бумажных денег" #NT!
 nd_cso.2.d: "На рынках Ханчжоу и Чэнду торговцы обменивают бумажные листы, обеспеченные казной Сун, первой в мире выпущенной государством бумажной валютой, цзяоцзы. То, что началось как частные торговые векселя, превратилось в революцию в финансах. В типографиях Хуэйчжоу и Ханчжоу работают более тысячи рабочих каждое, производя валюту, которая смазывает коммерческую экономику беспрецедентных масштабов.\n\nОднако бумажные деньги — это палка о двух концах. Слишком большое количество денег в обращении порождает инфляцию и подрывает доверие. Слишком мало лишает торговлю ликвидности, необходимой ей для процветания. Суд должен решить: расширить денежную массу для торговли топливом или ввести жесткое регулирование для сохранения финансовой стабильности?" #NT!
 nd_cso.2.a: "Печатайте больше валюты: торговля должна течь свободно." #NT!
 nd_cso.2.b: "Регулируйте поставки: стабильность превыше всего." #NT!
 nd_cso.3.t: "Гром на Янцзы" #NT!
 nd_cso.3.d: "В битве при Цайши в 1161 году гребные военные корабли Сун устроили засаду на гораздо более крупный транспортный флот Цзинь на Янцзы. Бомбы «Громовой удар», выпущенные из установленных на палубах требушетов, разбивали вражеские суда, в то время как гребцы Сун вели свои гребные суда сквозь обломки на скорости, с которой не могла сравниться ни одна обычная галера. Силы Цзинь были уничтожены, а линия Янцзы удержана.\n\nЭта победа доказывает, что инновации превосходят цифры. Наши военно-морские инженеры освоили гребной механизм и создали суда, способные плавать вверх по течению, маневрировать в узких каналах и быстро приближаться к кораблям противника. Теперь вопрос в том, как использовать это преимущество." #NT!
 nd_cso.3.a: "Создайте наступательный флот, чтобы вести войну на севере." #NT!
 nd_cso.3.b: "Укрепите Янцзы: сделайте наше сердце неуязвимым." #NT!
 nd_cso.4.t: "Синтез Мастера Чжу" #NT!
 nd_cso.4.d: "Философ Чжу Си завершил свои монументальные комментарии к Четырем книгам конфуцианской традиции, «Аналектам», «Мэн-цзы», «Великому учению» и «Доктрине среднего». Его синтез ранней неоконфуцианской мысли в последовательную философскую систему подчеркивает ли (принцип) как упорядочивающую силу космоса, а гэву (исследование вещей) как путь к пониманию.\n\nРаботы Чжу Си изменят интеллектуальную жизнь Китая на века. Его комментарии могут стать ортодоксальной основой экзаменационной системы, создавая чиновников, погруженных в моральную философию, или же его акцент на расследовании может быть направлен на практическое управление и эмпирические исследования." #NT!
 nd_cso.4.a: "Сделайте Четыре Книги единственной основой обучения." #NT!
 nd_cso.4.b: "Поощряйте расследование вещей во всех областях." #NT!
 nd_cso.5.t: "Огненное копье обретает форму" #NT!
 nd_cso.5.d: "Алхимики песни и военные инженеры усовершенствовали огненное копье — бамбуковую или металлическую трубку, начиненную порохом и снарядами, закрепленную на древке копья. В бою оператор поджигает заряд, посылая в ряды противника сгусток пламени и металлические осколки, прежде чем нанести удар копьем. Это ужасно, разрушительно и не похоже ни на что, что видел мир.\n\nВ Уцзин Цзунъяо, нашем всеобъемлющем военном руководстве, записаны формулы пороховых смесей различной силы. В настоящее время пехотным частям, расквартированным вдоль линии обороны Янцзы, выдаются огненные копья, что дает солдатам Сун решающее преимущество в ближнем бою против превосходящей северной кавалерии." #NT!
 nd_cso.5.a: "Огненное копье станет нашим фирменным оружием." #NT!
 nd_cso.6.t: "Подвижный шрифт и печатное слово" #NT!
 nd_cso.6.d: "Мастер Би Шэн разработал метод печати с использованием отдельных керамических символов, расположенных на железной пластине, покрытой смесью сосновой смолы и воска. При нагревании символы затвердевают; когда остынут, их можно будет переставить на следующую страницу. Хотя печать на дереве остается доминирующей для больших тиражей, подвижный шрифт Би Шэна открывает возможность печатать любой текст без затрат на вырезание целых блоков.\n\nУже типографии Ханчжоу производят за год больше книг, чем имеют во всех библиотеках большинства королевств. Эта технология в сочетании с опытом компании Song в производстве бумаги создает самое грамотное общество, которое когда-либо знал мир." #NT!
 nd_cso.6.a: "Знания должны стать основой силы Сун." #NT!
 nd_cso_paddle_wheel_fleet: "Традиция гребного колеса" #NT!
 nd_cso_paddle_wheel_fleet_desc: "Военно-морской флот Сун первым изобрел военные корабли с гребными колесами, приводимые в движение беговыми дорожками, способные развивать замечательную скорость и маневренность на реках и прибрежных водах." #NT!
 nd_cso_jiaozi_system: "Валютная система Цзяоцзы" #NT!
 nd_cso_jiaozi_system_desc: "Первые в мире бумажные деньги, выпущенные государством, обеспечивающие коммерческую экономику беспрецедентных масштабов." #NT!
 nd_cso_iron_smelting: "Песня Железная Промышленность" #NT!
 nd_cso_iron_smelting_desc: "К 1078 году Китай Сун производил 125 000 тонн железа ежегодно, что в шесть раз больше при использовании угольных доменных печей." #NT!
 nd_cso_civilian_supremacy: "Гражданское превосходство" #NT!
 nd_cso_civilian_supremacy_desc: "Принцип песни «вэнь над у», гражданская власть над военной, создал самое сложное бюрократическое государство своей эпохи." #NT!
 nd_cso_river_navy_levy: "Сборы речного флота" #NT!
 nd_cso_river_navy_levy_desc: "С 1132 года в Сун существовал постоянный речной флот, первый постоянный флот в истории Китая, укомплектованный речными речниками, призванными на военную службу." #NT!
 nd_cso_yangtze_defense: "Линия обороны Янцзы" #NT!
 nd_cso_yangtze_defense_desc: "Великая река служила основным оборонительным барьером Южной Сун, укреплённым гарнизонами, сигнальными маяками и патрульным флотом." #NT!
 nd_cso_fire_lance_corps: "Огненный копейный корпус" #NT!
 nd_cso_fire_lance_corps_desc: "Солдаты песни, вооруженные огненными копьями, заряженными порохом копьями, извергающими пламя и шрапнель, представляли первую в мире пороховую пехоту." #NT!
 nd_cso_fire_lance_levies: "Налог на огненное копье" #NT!
 nd_cso_fire_lance_levies_desc: "Призванные огневые копья, набранные из населения в целом, принесли первое пороховое оружие в систему набора солдат Сун." #NT!
 nd_cso_movable_type: "Печать подвижным шрифтом" #NT!
 nd_cso_movable_type_desc: "Изобретение Би Шэном керамического подвижного шрифта около 1040 года произвело революцию в книжном производстве и сделало Китай Сун самым грамотным обществом на земле." #NT!
 nd_cso_zhuxi_synthesis: "Неоконфуцианский синтез" #NT!
 nd_cso_zhuxi_synthesis_desc: "Комментарии Чжу Си к Четырем книгам объединили неоконфуцианскую философию и стали интеллектуальной основой китайского управления на семь столетий." #NT!
 nd_cso_commercial_revolution: "Коммерческая революция" #NT!
 nd_cso_commercial_revolution_desc: "Экономическая трансформация эпохи Сун: от государства, дающего сельскохозяйственную дань, к коммерческому центру, движимая урбанизацией, бумажными деньгами и морской торговлей." #NT!
 nd_cso_tea_trade: "Сети торговли чаем" #NT!
 nd_cso_tea_trade_desc: "Чай стал самым важным коммерческим товаром династии Сун, а лицензированные правительством чайные дома служили центрами торговли и культурного обмена." #NT!
 nd_cso_tower_ships: "Строительство башенных кораблей" #NT!
 nd_cso_tower_ships_desc: "Многопалубные бронированные военные корабли с сотнями солдат и палубными требушетами, доминирующие как в речных, так и в прибрежных боях." #NT!
 nd_cso_thundercrash_weapons: "Громовое оружие" #NT!
 nd_cso_thundercrash_weapons_desc: "Пороховые бомбы в железном корпусе, запускаемые из требушетов, названных в честь издаваемого ими ужасающего звука, являются ранней формой взрывной артиллерии." #NT!
 nd_cso_compass_navigation: "Компасная навигация" #NT!
 nd_cso_compass_navigation_desc: "Моряки Сун первыми применили магнитный компас для морской навигации, что позволило совершать надежные океанские путешествия в Юго-Восточную Азию и за ее пределы." #NT!
 nd_cso_porcelain_mastery: "Мастерство экспорта фарфора" #NT!
 nd_cso_porcelain_mastery_desc: "Цвет морской волны и белый фарфор стали самыми востребованными предметами роскоши в Азии и странах Индийского океана." #NT!
 nd_cso_legal_codification: "Правовая кодификация" #NT!
 nd_cso_legal_codification_desc: "Систематический пересмотр и компиляция правовых кодексов Сун, создавшая одну из наиболее полных правовых систем средневекового мира." #NT!
 nd_cso_maritime_silk_route: "Морской Шелковый Путь" #NT!
 nd_cso_maritime_silk_route_desc: "Поскольку сухопутные пути были отрезаны враждебными степными державами, купцы Сун основали морские торговые пути, перевозившие шелк, фарфор и чай через Индийский океан." #NT!
 nd_cso_ironclad_vessels: "Железные гребные колеса" #NT!
 nd_cso_ironclad_vessels_desc: "К 1203 году инженеры Сун бронировали гребные военные корабли железными пластинами, создавая первые в мире броненосные суда." #NT!
 nd_cso_trade_junk_fleet: "Торговый мусорный флот Ханчжоу" #NT!
 nd_cso_trade_junk_fleet_desc: "Быстрые, мореходные джонки, базирующиеся в Ханчжоу, сочетающие в себе торговую грузоподъемность с оборонительным вооружением для дальней морской торговли." #NT!
 nd_cso_iron_bombs: "Бомбы в железном корпусе" #NT!
 nd_cso_iron_bombs_desc: "Переход от пороховых бомб с мягким корпусом к железным корпусам резко увеличил их поражающую способность и радиус взрыва." #NT!
 nd_cso_waterway_mastery: "Мастерство водных путей" #NT!
 nd_cso_waterway_mastery_desc: "Владение Сун каналами, шлюзами и речным транспортом создало внутреннюю торговую сеть, не имеющую аналогов нигде в мире." #NT!
 nd_cso_examination_reform: "Реформа экзаменов" #NT!
 nd_cso_examination_reform_desc: "Расширение и совершенствование системы экзаменов на государственную службу, расширение доступа к государственной службе исключительно на основе заслуг." #NT!
 nd_cso_rice_intensification: "Интенсификация рисовых полей" #NT!
 nd_cso_rice_intensification_desc: "Внедрение скороспелых сортов риса Чампа и технологии двойного выращивания резко увеличили производство продуктов питания в долине Янцзы." #NT!
 nd_cso_naval_supremacy: "Песня «Морское превосходство»" #NT!
 nd_cso_naval_supremacy_desc: "Кульминация многовековых военно-морских инноваций (гребные колеса, пороховое вооружение, железная обшивка), устанавливающих неоспоримое господство на воде." #NT!
 nd_cso_monetary_policy: "Расширенная денежно-кредитная политика" #NT!
 nd_cso_monetary_policy_desc: "Сложнейшее управление предложением бумажной валюты, процентными ставками и государственными резервами, новаторские современные налогово-бюджетные практики." #NT!
 nd_cso_industrial_iron: "Промышленный металлургический завод" #NT!
 nd_cso_industrial_iron_desc: "Расширение угольных доменных печей до промышленных масштабов для производства стали для оружия, инструментов и инфраструктуры по всему миру.\n\n#italic Доступно в: $nd_cso_iron_foundry$#!" #NT!
 nd_cso_literary_tradition: "Литературные сборники" #NT!
 nd_cso_literary_tradition_desc: "Традиция Сун заключаться в составлении энциклопедических сборников, сохраняющих и систематизирующих знания во всех областях, от астрономии до сельского хозяйства." #NT!
 nd_cso_coastal_defense: "Модернизация береговой обороны" #NT!
 nd_cso_coastal_defense_desc: "Укрепление южного побережья батареями, сторожевыми вышками и патрульным флотом для защиты морской торговли Сун." #NT!
 nd_cso_industrial_modernization: "Промышленная модернизация" #NT!
 nd_cso_industrial_modernization_desc: "Применение инженерных традиций Сун в современном промышленном производстве, механизации цехов и расширении выпуска продукции." #NT!
 nd_cso_maritime_modernization: "Морская модернизация" #NT!
 nd_cso_maritime_modernization_desc: "Модернизация торгового и военно-морского флота Сун с использованием достижений судостроения и навигационных технологий." #NT!
 nd_cso_constitutional_reform: "Конституционная реформа" #NT!
 nd_cso_constitutional_reform_desc: "Формализация меритократической традиции Сун в конституционных принципах управления и верховенства закона." #NT!
 nd_cso_modern_education: "Современная система образования" #NT!
 nd_cso_modern_education_desc: "Преобразование системы неоконфуцианских академий в современную образовательную сеть, поддерживающую традицию Сун всеобщей грамотности." #NT!
 nd_cso_delta_industry: "Промышленность Дельты Янцзы" #NT!
 nd_cso_delta_industry_desc: "Дельта Янцзы, и без того самый продуктивный регион на Земле, становится двигателем современной индустриальной экономики." #NT!
 n_nd_cso_paddle_warship: "Военный корабль с гребным колесом" #NT!
 n_nd_cso_paddle_warship_desc: "Судно с невероятной скоростью, приводимое в движение беговой дорожкой и вооруженное установленными на палубе требушетами для метания пороховых бомб. Гребные велосипеды «Сонг» могли превзойти любую современную галеру." #NT!
 n_nd_cso_paddle_warship_levy: "Военный корабль с гребным колесом" #NT!
 n_nd_cso_paddle_warship_levy_desc: "Призванное гребное судно речного флота Сун." #NT!
 a_nd_cso_fire_lance: "Огненное копье пехоты" #NT!
 a_nd_cso_fire_lance_desc: "Элитные солдаты вооружены огненными копьями — набитыми порохом трубками, установленными на древках копий, из которых выбрасывается пламя и шрапнель, прежде чем владелец вступит в рукопашную схватку. Ужасающее оружие, уникальное для войны Сун." #NT!
 a_nd_cso_fire_lance_levy: "Огненное копье ополчения" #NT!
 a_nd_cso_fire_lance_levy_desc: "Призванная пехота, вооруженная огненными копьями, доставляет пороховое оружие в систему набора солдат Сун." #NT!
 n_nd_cso_tower_ship: "Корабль-башня" #NT!
 n_nd_cso_tower_ship_desc: "Многопалубный бронированный военный корабль с сотнями солдат и установленными на палубе требушетами. Башенные корабли доминировали в речных и прибрежных боях благодаря своим размерам и огневой мощи." #NT!
 a_nd_cso_thundercrash: "Громовая бомбарда" #NT!
 a_nd_cso_thundercrash_desc: "Ранняя пороховая артиллерия, бросавшая фугасные бомбы в железной оболочке с разрушительным эффектом. Назван в честь ужасающего грохота их взрыва." #NT!
 n_nd_cso_ironclad_galley: "Броненосная галера" #NT!
 n_nd_cso_ironclad_galley_desc: "Военный корабль с гребным колесом, бронированный клепаными железными пластинами, сочетающий в себе скорость галеры с беспрецедентной защитой от огня противника." #NT!
 n_nd_cso_trade_junk: "Торговый мусор Ханчжоу" #NT!
 n_nd_cso_trade_junk_desc: "Быстрое мореходное торговое судно из Ханчжоу, вооруженное для самообороны на морском шелковом пути. Эти джонки доставляли товары Сун до Восточной Африки." #NT!
 nd_cso_iron_foundry: "Чугунолитейный завод Сун" #NT!
 nd_cso_iron_foundry_desc: "Угольный доменный комплекс по производству чугуна и стали в промышленных масштабах. К 1078 году литейные заводы Сун производили больше железа, чем Англия могла бы произвести семь столетий спустя." #NT!
 nd_cso_currency_bureau: "Бюро бумажных денег" #NT!
 nd_cso_currency_bureau_desc: "Правительственная типография, производящая бумажные деньги цзяоцзы, в которой работает более тысячи рабочих для чеканки первых в мире бумажных денег." #NT!
 nd_cso_naval_shipyard: "Военно-морская верфь Сун" #NT!
 nd_cso_naval_shipyard_desc: "Специализированный завод по постройке гребных военных кораблей с испытательными полигонами и слесарными мастерскими." #NT!
 nd_cso_printing_house: "Типография Сун" #NT!
 nd_cso_printing_house_desc: "Издательское предприятие, выпускающее книги с использованием как ксилографии, так и подвижных шрифтов, снабжая самое грамотное общество на земле." #NT!
 nd_cso_gunpowder_arsenal: "Пороховой арсенал" #NT!
 nd_cso_gunpowder_arsenal_desc: "Центр исследования и производства оружия, производящий огненные копья, грозовые бомбы и пороховые смеси по формулам Уцзин Цзунъяо." #NT!
 nd_cso_tea_house: "Чайный дом Сун" #NT!
 nd_cso_tea_house_desc: "Лицензированное коммерческое и культурное заведение, где торговцы заключают сделки во время сложных чайных церемоний, служащее центром как торговли, так и литературной культуры." #NT!
 nd_cso_riverine_fort: "Форт на реке Янцзы" #NT!
 nd_cso_riverine_fort_desc: "Укрепленный гарнизон, командующий стратегическим пунктом на реке Янцзы, частью речной оборонительной сети Южной Сун, которая более столетия удерживала линию обороны от северного вторжения." #NT!
 nd_cso_academy: "Академия обучения" #NT!
 nd_cso_academy_desc: "Неоконфуцианский учебный центр, посвященный учению Чжу Си, где ученые-чиновники занимаются исследованием вещей и развитием моральных качеств." #NT!
 nd_cso_blast_furnace: "Угольная доменная печь" #NT!
 nd_cso_blast_furnace_desc: "Промышленная выплавка чугуна с использованием угольного топлива и водяных сильфонов, позволяющая производить сталь в беспрецедентных масштабах." #NT!
 nd_cso_advanced_smelting: "Передовое производство стали" #NT!
 nd_cso_advanced_smelting_desc: "Усовершенствованные методы плавки с использованием медных сплавов и высококачественного угля позволяют производить превосходную сталь для оружия и инструментов." #NT!
 nd_cso_currency_printing: "Печать валюты" #NT!
 nd_cso_currency_printing_desc: "Специализированная печать бумажных денег с использованием многоцветных чернил, шелковой бумаги и сложного дизайна для предотвращения подделок." #NT!
 nd_cso_shipyard_upkeep: "Операции верфи" #NT!
 nd_cso_shipyard_upkeep_desc: "Техническое обслуживание объектов строительства гребных колес, включая лесные склады, металлургические мастерские и участки сборки беговых дорожек." #NT!
 nd_cso_book_printing: "Книгопечатание" #NT!
 nd_cso_book_printing_desc: "Массовое производство книг с использованием техники ксилографии и подвижных шрифтов, что способствует распространению грамотности и знаний по всему королевству." #NT!
 nd_cso_arsenal_upkeep: "Арсенал Операции" #NT!
 nd_cso_arsenal_upkeep_desc: "Производство и хранение порохового оружия, в том числе смешивание селитры, серы и древесного угля по засекреченным рецептурам." #NT!
 nd_cso_tea_service: "Чайный сервиз" #NT!
 nd_cso_tea_service_desc: "Тщательное приготовление и подача чая с использованием прекрасной керамики и сосудов, запечатанных пчелиным воском, занимает центральное место в коммерческой и культурной жизни Сун." #NT!
 nd_cso_fort_garrison: "Форт Гаррисон" #NT!
 nd_cso_fort_garrison_desc: "Обеспечение и вооружение укреплений на реке Янцзы оружием, камнем для ремонта и рисом для гарнизона." #NT!
 nd_cso_academy_upkeep: "Обслуживание Академии" #NT!
 nd_cso_academy_upkeep_desc: "Поставка бумаги, книг и лампового масла для неоконфуцианских академий, где ученые изучают классику и готовятся к экзаменам." #NT!
 levy_nd_cso_fire_lance: "Огненное копье Леви" #NT!
 levy_nd_cso_fire_lance_desc: "Призванная огнестрельная пехота из городов-гарнизонов Сун." #NT!
 levy_nd_cso_paddle_warship: "Леви с гребным колесом" #NT!
 levy_nd_cso_paddle_warship_desc: "Призванные гребные суда из городов на реке Сун с экипажем из речных речников и рыбаков." #NT!
 nd_cso_silk_workshop: "Сун Шелковая Мастерская" #NT!
 nd_cso_silk_workshop_desc: "Специализированное ткацкое предприятие, производящее лучшие в мире шелковые ткани. Мастерские по производству шелка в Сун сочетали традиционные методы с новыми конструкциями ткацких станков для создания тканей, продаваемых вплоть до Средиземноморья." #NT!
 nd_cso_porcelain_kiln: "Печь для фарфора Сун" #NT!
 nd_cso_porcelain_kiln_desc: "Завод по обжигу селадона, производящий необычный нефритово-зеленый фарфор, который стал самым востребованным предметом роскоши в Азии и странах Индийского океана." #NT!
 nd_cso_silk_weaving: "Шелковое Ткачество" #NT!
 nd_cso_silk_weaving_desc: "Преобразование шелка-сырца в тонкую ткань с использованием передовых ткацких станков и натуральных красителей для производства текстиля непревзойденного качества." #NT!
 nd_cso_celadon_production: "Производство селадона" #NT!
 nd_cso_celadon_production_desc: "Обжиг очищенной глины углем для производства фарфора селадона Сун, ценящегося за полупрозрачную нефритово-зеленую глазурь." #NT!
 nd_cso_formed_tt: "Южная Сун была сформирована" #NT!
 nd_cso_path_a_tt: "Выберите морское процветание" #NT!
 nd_cso_path_b_tt: "Выбрали Имперские экзамены" #NT!
 nd_cso_destiny: "Судьба песни" #NT!
 nd_cso_destiny_desc: "Династия Сун снова возродилась. Теперь восстановленная империя должна наметить свое будущее: будет ли она смотреть вовне, за моря, или внутрь, чтобы усовершенствовать искусство управления?" #NT!
 nd_cso_dest_fujian_ports: "Фуцзяньские перевалочные пункты" #NT!
 nd_cso_dest_fujian_ports_desc: "Цюаньчжоу и Чжанчжоу — крупнейшие порты мира. Обезопасьте их, наполните сокровищницу, и перед нами откроются океаны." #NT!
 nd_cso_dest_nanyang_trade: "Лорды Наньяна" #NT!
 nd_cso_dest_nanyang_trade_desc: "Острова специй и Малаккский пролив являются узкими местами морской Азии. Флоты сокровищ Сун должны командовать этими водами." #NT!
 nd_cso_dest_ocean_hegemony: "Мастера каждого моря" #NT!
 nd_cso_dest_ocean_hegemony_desc: "От Малабарского побережья до Персидского залива купцы Сун будут торговать в каждом порту. Ни одно море не будет закрыто для нашего флота." #NT!
 nd_cso_dest_southern_order: "Орден Южного Царства" #NT!
 nd_cso_dest_southern_order_desc: "Прежде чем Сун сможет взглянуть на север, ей необходимо усовершенствовать управление на юге. Создайте современную банковскую систему, развивайте землю и создайте непревзойденную бюрократию." #NT!
 nd_cso_dest_northern_recovery: "Возвращение Центральных равнин" #NT!
 nd_cso_dest_northern_recovery_desc: "Кайфэн и Лоян, старые столицы Сун, должны быть возвращены династии. Северная граница должна быть обеспечена силой оружия." #NT!
 nd_cso_dest_mandate_perfected: "Мандат усовершенствован" #NT!
 nd_cso_dest_mandate_perfected_desc: "Когда старые столицы восстановлены, а сам Даду находится под контролем Сун, династия должна достичь такого уровня развития и престижа, который докажет, что Мандат Небес действительно принадлежит им." #NT!
 nd_cso.7.t: "Песня выдерживает" #NT!
 nd_cso.7.d: "Несмотря ни на что, династия Сун пережила кризис и стала сильнее, чем раньше. Ученые Академии говорят об обновленном мандате: династии, зарекомендовавшей себя настойчивостью и хорошим управлением. Независимо от того, лежит ли будущее на волнах или в экзаменационных залах, Песня напишет следующую главу своей долгой истории." #NT!
 nd_cso.7.a: "Песня будет звучать десять тысяч лет." #NT!
 nd_cso.8.t: "Порты провинции Фуцзянь" #NT!
 nd_cso.8.d: "Великая гавань Цюаньчжоу (известная арабским купцам как Зайтон) и оживленный торговый центр Чжанчжоу теперь находятся под твердым контролем Сун. Вместе с мастерскими Ханчжоу они образуют торговый треугольник непревзойденного богатства. Иностранные торговцы из Аравии, Индии и островов пряностей толпятся на пристанях, обменивая перец и благовония на шелк и фарфор Сун.\n\nУправляющий морской торговлей сообщает о таможенных доходах, превышающих все, что когда-либо видело казначейство. Кажется, сами океаны манят." #NT!
 nd_cso.8.a: "Пусть знамя Песни развевается над каждой мачтой." #NT!
 nd_cso.9.t: "Мастерство Наньяна" #NT!
 nd_cso.9.d: "Влияние песни теперь простирается от Южно-Китайского моря до Малаккского пролива. Наши торговцы доминируют в торговле специями, камфорой и тропическими лиственными породами, протекающими через эти воды. Великие перевалочные пункты Палембанга и Малакки, когда-то независимых королевств, теперь действуют под коммерческим надзором Сун.\n\nЭто достижение не имеет прецедента в истории Китая. Династия, которую высмеивали за отступление на юг, создала то, чем никогда не обладала ни одна северная империя: морскую сферу влияния, охватывающую тысячи ли." #NT!
 nd_cso.9.a: "Монополизировать торговлю специями в самом ее источнике." #NT!
 nd_cso.9.b: "Свяжите эти королевства с Песней как данники." #NT!
 nd_cso.10.t: "Песенные океаны" #NT!
 nd_cso.10.d: "Флоты с сокровищами Сун теперь стоят на якоре в гаванях Индии и Персидского залива. Управляемые по компасу джонки Ханчжоу доставляют фарфор и шелк на рынки, которые когда-то казались невероятно далекими. В Каликуте купцы Сун ведут переговоры с арабскими торговцами. В Ормузе, воротах в средиземноморскую торговлю, товары Сун продаются по премиальным ценам.\n\nЭто не имеющая себе равных коммерческая империя: построенная не только на завоеваниях, но и на превосходстве навигации Сун, кораблестроении и огромном объеме предметов роскоши, производимых нашими мастерскими." #NT!
 nd_cso.10.a: "Продолжить видение Чжэн Хэ о мирных исследованиях." #NT!
 nd_cso.10.b: "Утвердите мандат песни над этими водами." #NT!
 nd_cso.11.t: "Хорошо организованное царство" #NT!
 nd_cso.11.d: "Южные провинции преобразились. Там, где когда-то была приграничная дикая местность и беспокойные меньшинства, теперь появились процветающие города, соединенные каналами, управляемые избранными по итогам экзаменов магистратами и связанные со столицей эффективной почтовой системой. Банковские дома Ханчжоу финансируют развитие всего королевства.\n\nУченые говорят, что именно это и представляли себе древние мудрецы: управление посредством морального примера и бюрократической компетентности, а не посредством силы. Юг готов служить основой для великих дел." #NT!
 nd_cso.11.a: "Юг хорошо упорядочен. Что будет дальше?" #NT!
 nd_cso.12.t: "Возвращение на Север" #NT!
 nd_cso.12.d: "Знамена песни снова развеваются над Кайфэном и Лояном, древними столицами, где родилась династия. Восстановление центральной части севера было мечтой каждого патриота Сун с тех пор, как вторжение чжурчжэней вытеснило двор на юг. Старый Имперский путь в Кайфэне перестраивается, его рынки и кварталы развлечений возвращаются к своей былой славе.\n\nНо за столетия иностранного правления север изменился. Его жители переняли другие обычаи, поля частично заброшены, а города уменьшились. Вопрос в том, следует ли агрессивно отвоевывать или терпеливо интегрироваться." #NT!
 nd_cso.12.a: "Нажимайте на завоевание: север должен быть освобожден." #NT!
 nd_cso.12.b: "Постепенно интегрируйте север в порядок Сун." #NT!
 nd_cso.13.t: "Идеальная династия" #NT!
 nd_cso.13.d: "От Ханчжоу на юге до Даду на севере династия Сун теперь управляет самым развитым, самым грамотным и самым процветающим царством, которое когда-либо знал мир. Система гражданских экзаменов отбирает лучших умов независимо от рождения. Императорская библиотека хранит накопленную за три тысячелетия мудрость. Эта земля производит больше риса, железа, шелка и фарфора, чем любая другая цивилизация.\n\nУченые говорят о новом золотом веке: том, который превосходит даже легендарную эпоху Трех Владык. Песня не просто восстановила Мандат Небес; оно усовершенствовало его." #NT!
 nd_cso.13.a: "Постройте вечную бюрократию, которая переживет любую династию." #NT!
 nd_cso.13.b: "Покровительствовать возрождению искусств и образования." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_spice_monopoly: "Монополия в торговле специями" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_spice_monopoly: "Контроль Сун над торговыми путями Наньяна создал почти монополию на потоки специй на рынки Восточной Азии." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_tributary_network: "Сеть притоков Наньян" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_tributary_network: "Морские королевства Юго-Восточной Азии признают сюзеренитет Сун, отправляя даньние миссии и получая взамен торговые привилегии." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_zheng_he_legacy: "Наследие флота сокровищ" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_zheng_he_legacy: "Флоты сокровищ Сун пересекают Индийский океан, распространяя морскую мощь и коммерческое влияние на каждый берег." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_maritime_mandate: "Морской мандат" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_maritime_mandate: "Сун претендуют на суверенитет над морями, обеспечивая соблюдение торговых стандартов и взимая пошлины в каждом узлом проходе." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_reconquest_fervor: "Рвение завоевания" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_reconquest_fervor: "Освобождение старых столиц разожгло патриотический пыл во всем королевстве. Армии песни маршируют на север с рвением праведного дела." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_northern_integration: "Северная интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_northern_integration: "Управление пациентами и культурная поддержка постепенно восстанавливают идентичность Сун в давно отчужденных северных провинциях." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_eternal_bureaucracy: "Вечная бюрократия" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_eternal_bureaucracy: "Совершенная система экзаменов и всеобъемлющий правовой кодекс создают бюрократию, которая может эффективно управлять независимо от того, кто сидит на троне." #NT!
 STATIC_MODIFIER_NAME_nd_cso_dest_renaissance_court: "Песня Возрождения" #NT!
 STATIC_MODIFIER_DESC_nd_cso_dest_renaissance_court: "Двор Сун становится покровителем нового золотого века искусств, литературы и естественной философии, привлекая ученых со всего известного мира." #NT!
 nd_cso_treasure_fleet_harbor: "Гавань Флота Сокровищ" #NT!
 nd_cso_treasure_fleet_harbor_desc: "Массивная специально построенная гавань, способная строить, оборудовать и снабжать огромные джонки флота с сокровищами, которые переносят силу Сун через все океаны." #NT!
 nd_cso_treasure_fleet_maintenance: "Обслуживание флота сокровищ" #NT!
 nd_cso_treasure_fleet_maintenance_desc: "Обеспечение и содержание гавани великого флота с сокровищами, потребляющее огромное количество древесины, военно-морских запасов и металлической арматуры." #NT!
 nd_cso_imperial_library: "Императорская библиотека" #NT!
 nd_cso_imperial_library_desc: "Крупнейшее хранилище знаний в мире, вмещающее миллионы томов, охватывающих все отрасли обучения. Императорская библиотека сохраняет и систематизирует накопленную мудрость китайской цивилизации." #NT!
 nd_cso_imperial_library_maintenance: "Обслуживание библиотеки" #NT!
 nd_cso_imperial_library_maintenance_desc: "Поддержание огромных коллекций Имперской библиотеки требует постоянного снабжения бумагой, чернилами и профессиональной заботой о сохранении древних текстов." #NT!
 cso_three_departments_bureaucracy: "Три департамента" #NT!
 cso_three_departments_bureaucracy_desc: "Саньшэн (отделы Чжуншу (чертеж), Мэнся (обзор) и Шаншу (исполнение)) составляли вершину имперского управления Тан и Сун. Каждый императорский указ проходил через канцлеров Чжуншу Шэна для составления, через право Мэнся Шэна на формальный протест и только затем через Шаншу Шэн для исполнения Шестью нижестоящими советами. Сун усовершенствовала систему до ее наиболее четкой формы до того, как император Юнлэ упразднил пост канцлера в 1380 году; Функционируя хорошо, Три департамента разработали консенсусный закон и стабильное управление, но конкурирующие канцлеры могли завести в тупик указы на долгие годы." #NT!
 cso_song_examinations_bureaucracy: "Система экзаменов по песням" #NT!
 cso_song_examinations_bureaucracy_desc: "Основанная при Суе в 605 году, кэджу достигла беспрецедентного масштаба и престижа при Сун. К концу Северной Сун около 50 000 кандидатов сдавали экзамены в префектуре каждый цикл, и успешные джинши гарантированно получали гражданскую карьеру. Реформа учебной программы, проведенная Ван Аньши в 1071 году, заменила поэтические сочинения практическим политическим эссе (cewen) о значениях классических произведений, нарушив литературную монополию аристократии и создав глубоко грамотную ученую и официальную элиту. Система также порождала ожесточенные фракционные клики, а в периоды упадка — безудержное мошенничество и продажу ученых степеней." #NT!
 cso_censorate_bureaucracy: "Цензорат" #NT!
 cso_censorate_bureaucracy_desc: "Ю-ши-тай при Тан и Сун Цензорат действовал как следственное подразделение, параллельное Трем департаментам. Юши Чжунчэн и его подчиненные имели право прямого вознесения на престол и могли привлечь к ответственности любого чиновника любого ранга. За деятельностью полиции следили «Три цензорских трибуна» (чжи-чжи-юань). Цензоры Сун провели чистки эпохи Юанью, которые обратили вспять реформы Ван Аньши, и в лучших случаях считали империю действительно подотчетной имперскому закону. Захваченный Цензорат, напротив, стал просто оружием той фракции, которая его захватила." #NT!
 cso_hanlin_academy_bureaucracy: "Академия Ханлинь" #NT!
 cso_hanlin_academy_bureaucracy_desc: "Основанная при Тан Сюаньцзуне и возведенная Сун Тайцзу в 960 году, Ханьлинь Юань была академией кисти, самым престижным литературным институтом империи. Академики Ханьлиня составляли императорские указы высочайшего уровня, составляли династические истории и обучали наследника. В Сун Ханлинь родились выдающиеся литераторы той эпохи: Оуян Сю, Сыма Гуан, Су Ши и сам Ван Аньши - все служили в его стенах. Мощная академия придавала трону непревзойденный культурный престиж; изнеженный раскололся на фракции Юанью и Шаошэн, поддержка которых стала пустой." #NT!
 cso_xinfa_reforms_bureaucracy: "Новая политика Ван Аньши" #NT!
 cso_xinfa_reforms_bureaucracy_desc: "Программа реформы Синьфа канцлера Ван Аньши (1069–1076) представляла собой попытку самой амбициозной реструктуризации управления Сун. Цин Мяо предоставляла крестьянам государственные весенние ссуды по более низким ставкам, чем деревенские ростовщики; Цзюньшу пинтяо складировал зерно на государственных складах, чтобы ослабить спекуляции о голоде; баоцзя организовали сельские домохозяйства в ополчения взаимной ответственности; а рыночно-обменные конторы Ши Фа поставили коммерческое регулирование под контроль государства. Программа расколола элиту на реформистскую и консервативную фракции, вражда которых бушевала на протяжении двух поколений." #NT!
 cso_salt_tea_monopoly_bureaucracy: "Монополия на соль и чай" #NT!
 cso_salt_tea_monopoly_bureaucracy_desc: "Комиссии Янь-Ча Си управляли монополиями государства Сун на соль, чай и (в некоторые периоды) квасцы, спиртные напитки и благовония. Одни только доходы от продажи соли обеспечивали примерно половину доходов штата Северная Сун в период пика. Лицензированные торговцы приобретали транспортные билеты (ян-инь) у региональных комиссий, а конторы чафа регулировали торговлю чаем Янцзы в обмен на приграничный импорт лошадей из тибетцев и тангутов. Система обогатила казну и лицензированных торговцев, но привела к безудержной контрабанде, злоупотреблениям соляных картелей и недовольству крестьян завышенными ценами." #NT!
 cso_jiao_shu_printing_bureaucracy: "Типография Цзяо Шу" #NT!
 cso_jiao_shu_printing_bureaucracy_desc: "Государственный печатный аппарат Сун сделал Сунский Китай самым грамотным и развитым в денежном отношении обществом своего времени. Императорская пресса в Кайфэне и Ханчжоу выпускала авторитетные издания конфуцианской классики, «Двадцати четырех историй», буддийской «Трипитаки», а после 1040 года — экспериментов Би Шэна с передвижными шрифтами. Бюро Цзяоцзы, основанное в Чэнду в 1023 году, выпустило первую в мире бумажную валюту, напечатанную правительством, под залог запасов меди. Из-за неправильного управления чрезмерная эмиссия банкнот бюро спровоцировала инфляционный коллапс, от которого пострадали покойные казначейства Северной и Южной Сун." #NT!
 AUTO_MODIFIER_NAME_nd_cso_bureaucracy_authority: "Бюрократическая власть Сун" #NT!
 AUTO_MODIFIER_DESC_nd_cso_bureaucracy_authority: "Столетия прецедента Тан превратились в административное совершенство Сун. Три департамента, расширенный Кэджу, Цензорат, Академия Ханьлинь, реформы Ван Аньши, государственные монополии и имперские типографии образуют институциональный аппарат, не имеющий аналогов в современном мире. Рядом с неявным местом столицы открываются два институциональных места, что позволяет восстановленной Сун закрепить за собой три своих великих офиса." #NT!
