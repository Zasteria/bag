l_russian:
  # Formation Event, The Birth of the Baltic Nation 
 nd_lva.1.t: "Рождение балтийской нации" #NT!
 nd_lva.1.d: "Разрозненные балтийские племена (курши, жемайтийцы, земгалы, латгалы, старопруссы) объединились наконец под одним знаменем. На протяжении веков эти народы имели общий язык, веру в священные рощи и упрямое нежелание склоняться перед иностранными захватчиками. Северные крестоносцы обрушились на наши лесные крепости; Янтарный путь доставил наше богатство ко дворам Европы. Теперь вопрос: какой нацией мы станем?\n\nСвященные рощи Ромувы все еще горят вечным огнем, призывая нас сохранить наши древние обычаи и защитить нашу лесную родину. Но богатое янтарем побережье также манит, обещая богатство и влияние тем, кто достаточно смел, чтобы отправиться в море.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lva.1.a: "Охраняйте священные рощи и старые обычаи" #NT!
 nd_lva.1.b: "Завоевать власть над Янтарным берегом" #NT!
  
  # Formation Choice Modifiers 
 STATIC_MODIFIER_NAME_nd_guardians_of_the_sacred_groves: "Стражи Священных Рощ" #NT!
 STATIC_MODIFIER_DESC_nd_guardians_of_the_sacred_groves: "Народы Балтии черпают силу в своих древних лесах и священных рощах. Ни одна армия крестоносцев не завоевала то, что защищают деревья." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_amber_coast: "Лорды Янтарного берега" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_amber_coast: "Куршей когда-то называли балтийскими викингами за их владение морем. Теперь объединенный народ Балтии превращает это мореходное наследие в коммерческую империю." #NT!
  
  # DHE Event 2, The Battle of Saule 
 nd_lva.2.t: "Битва при Сауле" #NT!
 nd_lva.2.d: "В 1236 году у болотистой переправы близ Сауле жемайтийцы и их куршские союзники встретились в бою с ливонскими меченосцами. Крестоносцы, отягощенные тяжелой броней на заболоченной местности, были уничтожены почти полностью. Их Великий Магистр Волквин пал вместе с пятьюдесятью рыцарями: это было худшее поражение, которое когда-либо терпели ордены балтийских крестоносцев. Остатки Меченосцев были поглощены Тевтонским орденом, но урок был вынесен: балтийские народы не подчинятся легко. Наши воины несут память о Сауле в своей крови." #NT!
 nd_lva.2.a: "Леса помнят Сауле" #NT!
  
  # DHE Event 3, The Sacred Flame of Romuva 
 nd_lva.3.t: "Священное пламя Ромувы" #NT!
 nd_lva.3.d: "В сердце балтийских земель, в глубине священной дубовой рощи, горит никогда не угасающий огонь. Криве-Кривайто, верховный жрец всех балтийских народов, поддерживает это пламя как мост между живыми и мертвыми. В то время как все остальные языческие традиции в Европе пали от креста, вера Ромувы жива. Наш народ по-прежнему оставляет подношения у священных камней, по-прежнему шепчет духам леса, по-прежнему отмечает смену времен года древними обрядами, которые на тысячелетия предшествовали христианству. Это не просто суеверие: это духовное ядро ​​балтийской идентичности." #NT!
 nd_lva.3.a: "Пламя горит вечно" #NT!
  
  # DHE Event 4, The Amber Road Ascendancy 
 nd_lva.4.t: "Восхождение Янтарной дороги" #NT!
 nd_lva.4.d: "Балтийский янтарь (золотые слезы солнца, как называли его древние) продавался с бронзового века. От берегов Курнии и Самбии янтарь по речным путям направлялся на юг в Средиземноморье, на восток — ко дворам Византии и на запад — в мастерские Брюгге. Теперь, объединив балтийские племена, мы полностью контролируем источник этого драгоценного товара. Мы можем диктовать условия каждому торговцу, который ищет наш янтарь, но будем ли мы ужесточать контроль над самой торговлей или использовать свое положение, чтобы привлечь торговцев к нашим берегам и получить прибыль от этого потока?" #NT!
 nd_lva.4.a: "Контролируйте торговые пути янтаря" #NT!
 nd_lva.4.b: "Сделайте наши порты янтарными воротами" #NT!
  
  # DHE Event 5, The Baltic Confederation 
 nd_lva.5.t: "Балтийская Конфедерация" #NT!
 nd_lva.5.d: "Объединение балтийских народов зародилось в горниле совместной борьбы против крестоносных порядков. Но теперь, когда внешняя угроза отступила, вопрос управления становится актуальным. Жемайты, курши, латгалы и пруссы имеют свои традиции, своих вождей, свое самосознание. Должны ли мы создать сильную центральную власть, которая сможет направить ресурсы всех стран Балтии на общие цели? Или нам следует уважать автономию каждого племени, создавая конфедерацию, в которой будут сохранены местные обычаи и свободы?" #NT!
 nd_lva.5.a: "Один правитель для всех прибалтийских народов" #NT!
 nd_lva.5.b: "Конфедерация свободных племен" #NT!
  
  # DHE Timed Modifiers 
 STATIC_MODIFIER_NAME_nd_saule_victory: "Победа при Сауле" #NT!
 STATIC_MODIFIER_DESC_nd_saule_victory: "Разгромное поражение Ливонских меченосцев при Сауле в 1236 году отражается в балтийских военных традициях." #NT!
 STATIC_MODIFIER_NAME_nd_sacred_flame_of_romuva: "Священное пламя Ромувы" #NT!
 STATIC_MODIFIER_DESC_nd_sacred_flame_of_romuva: "Вечный огонь в священной роще Ромува связывает балтийские народы с их предками и древней верой." #NT!
 STATIC_MODIFIER_NAME_nd_amber_road_dominance: "Доминирование на Янтарной дороге" #NT!
 STATIC_MODIFIER_DESC_nd_amber_road_dominance: "Контролируя торговые пути янтаря, мы диктуем поток северного золота через Европу." #NT!
 STATIC_MODIFIER_NAME_nd_amber_road_monopoly: "Янтарные ворота" #NT!
 STATIC_MODIFIER_DESC_nd_amber_road_monopoly: "Наши порты стали главным пунктом назначения для торговцев, ищущих балтийский янтарь, привлекающих к нашим берегам богатство и торговлю." #NT!
 STATIC_MODIFIER_NAME_nd_confederation_centralize: "Централизованное Балтийское управление" #NT!
 STATIC_MODIFIER_DESC_nd_confederation_centralize: "Сильное центральное правительство направляет ресурсы всех стран Балтии на общую цель." #NT!
 STATIC_MODIFIER_NAME_nd_confederation_federalize: "Балтийская племенная федерация" #NT!
 STATIC_MODIFIER_DESC_nd_confederation_federalize: "Конфедерация сохраняет автономию и обычаи каждого балтийского племени, одновременно объединяя их против внешних угроз." #NT!
  
  # Variable Tooltips (for destiny system) 
 nd_lva_formed_tt: "Образована Балтийская нация." #NT!
 nd_lva_path_a_tt: "Мы решили охранять священные рощи." #NT!
 nd_lva_path_b_tt: "Мы решили заявить права на Янтарный Берег." #NT!
  
  # Advances 
 nd_lva_romuva_worship: "Поклонение Ромуве" #NT!
 nd_lva_romuva_worship_desc: "Священные рощи балтийских народов, где горит вечный огонь и криве-кривайто общается с духами умерших." #NT!
 nd_lva_curonian_warriors: "Куршские воины" #NT!
 nd_lva_curonian_warriors_desc: "Курши, которых боятся как балтийских викингов, привносят свои жестокие воинские традиции в единую балтийскую армию." #NT!
 nd_lva_amber_crafting: "Изготовление янтаря" #NT!
 nd_lva_amber_crafting_desc: "Балтийские ремесленники превращают необработанный янтарь в украшения, амулеты и предметы декора, которые ценятся во всей Европе." #NT!
 nd_lva_forest_warfare: "Лесная война" #NT!
 nd_lva_forest_warfare_desc: "Густые леса прибалтийских земель являются одновременно домом и крепостью для их народов, знающих каждую тропинку и поляну." #NT!
 nd_lva_hill_fort_tradition: "Хилл Форт Традиция" #NT!
 nd_lva_hill_fort_tradition_desc: "Пильскалны, укрепления из земляных и деревянных валов на вершине балтийского холма, веками защищали эти земли." #NT!
 nd_lva_honey_wax_economy: "Медово-восковая экономия" #NT!
 nd_lva_honey_wax_economy_desc: "Обширные пчелиные леса Балтийского региона производят мед и пчелиный воск в количествах, которыми снабжают церкви по всей Западной Европе.\n\n#italic Доступно в: $nd_lva_amber_workshop$#!" #NT!
 nd_lva_tribal_assembly: "Племенное собрание" #NT!
 nd_lva_tribal_assembly_desc: "Встреча вождей Балтии для разрешения споров, распределения ресурсов и координации защиты от общих врагов." #NT!
 nd_lva_amber_road: "Янтарная дорога" #NT!
 nd_lva_amber_road_desc: "Древний торговый путь, несущий балтийский янтарь на юг, в Средиземноморье, и на восток, в Византию, достигает новых высот процветания." #NT!
 nd_lva_curonian_seafaring: "Куршское мореплавание" #NT!
 nd_lva_curonian_seafaring_desc: "Курши освоили кораблестроение и мореплавание в традициях викингов, совершая набеги до Дании и Швеции." #NT!
 nd_lva_sacred_fire: "Священный огонь" #NT!
 nd_lva_sacred_fire_desc: "Последняя языческая традиция в Европе сохраняется на прибалтийских землях, где до сих пор горит священный огонь Ромувы." #NT!
 nd_lva_crusader_resistance: "Сопротивление крестоносцев" #NT!
 nd_lva_crusader_resistance_desc: "Десятилетия войн против Тевтонского и Ливонского орденов превратили балтийские народы в закаленных защитников." #NT!
 nd_lva_forest_products: "Торговля лесными товарами" #NT!
 nd_lva_forest_products_desc: "Балтийские меха, мед, воск, деготь и древесина текут на запад по сложившимся торговым сетям на ганзейские рынки." #NT!
 nd_lva_samogitian_cavalry: "Жемайтийская кавалерия" #NT!
 nd_lva_samogitian_cavalry_desc: "Всадники Жемайтии, мастера партизанской войны в лесистой местности, составляют мобильную ударную силу Балтийской армии." #NT!
 nd_lva_baltic_confederation: "Балтийская Конфедерация" #NT!
 nd_lva_baltic_confederation_desc: "Политическое объединение различных балтийских племен в единую управляющую структуру." #NT!
 nd_lva_coastal_vigilance: "Береговая бдительность" #NT!
 nd_lva_coastal_vigilance_desc: "Заводы по производству Балтийского дегтя поддерживают береговую оборону, производя жизненно важные материалы для судостроения и фортификации, в то время как сторожевые башни охраняют береговую линию.\n\n#italic Доступно в: $nd_lva_amber_workshop$#!" #NT!
 nd_lva_pagan_resurgence: "Языческое возрождение" #NT!
 nd_lva_pagan_resurgence_desc: "Возрождение традиционных балтийских религиозных практик подтверждает культурную самобытность балтийских народов." #NT!
 nd_lva_baltic_trade_network: "Балтийская торговая сеть" #NT!
 nd_lva_baltic_trade_network_desc: "Укрепленные торговые посты вдоль побережья Балтийского моря создают единую торговую сеть, конкурирующую с Ганзой." #NT!
 nd_lva_amber_monopoly: "Янтарная монополия" #NT!
 nd_lva_amber_monopoly_desc: "Полный контроль над мировыми месторождениями янтаря дает балтийской стране огромные экономические рычаги." #NT!
 nd_lva_forest_doctrine: "Лесная военная доктрина" #NT!
 nd_lva_forest_doctrine_desc: "Столетия лесных войн закреплены в официальной военной доктрине со специализированными гарнизонами в крепостях на холмах.\n\n#italic Доступно в: $nd_lva_pilskalns$#!" #NT!
 nd_lva_cultural_preservation: "Культурное сохранение" #NT!
 nd_lva_cultural_preservation_desc: "Сознательные усилия по защите балтийских языков, традиций и обычаев от ассимиляции соседними державами." #NT!
 nd_lva_modern_baltic_army: "Современная Балтийская армия" #NT!
 nd_lva_modern_baltic_army_desc: "Профессиональная армия, сочетающая современную тактику с балтийскими традициями лесной войны." #NT!
 nd_lva_national_awakening: "Национальное пробуждение" #NT!
 nd_lva_national_awakening_desc: "Возникновение балтийского национального сознания, вдохновленное идеалами Просвещения и повторным открытием древнего наследия." #NT!
 nd_lva_industrial_forestry: "Промышленное лесное хозяйство" #NT!
 nd_lva_industrial_forestry_desc: "Модернизированные методы заготовки древесины и производства военно-морских товаров снабжают торговые посты Балтии.\n\n#italic Доступно в: $nd_lva_amber_workshop$#!" #NT!
 nd_lva_modern_commerce: "Современная балтийская коммерция" #NT!
 nd_lva_modern_commerce_desc: "Интеграция портов Балтии в современные европейские торговые сети преобразует прибрежную экономику." #NT!
  
  # Units 
 a_nd_lva_curonian_raider: "Куршские рейдеры" #NT!
 a_nd_lva_curonian_raider_desc: "Свирепые пешие воины с Куршского побережья, которых боялись во всем Прибалтике, как балтийских викингов, за их набеговое мастерство." #NT!
 n_nd_lva_curonian_longship: "Куршский драккар" #NT!
 n_nd_lva_curonian_longship_desc: "Быстрое мелкосидящее судно, построенное в традициях викингов куршскими корабелами. Отлично подходит для прибрежных рейдов и блокады." #NT!
 a_nd_lva_samogitian_horse: "Жемайтийская легкая кавалерия" #NT!
 a_nd_lva_samogitian_horse_desc: "Быстрая кавалерия из лесистых гор Жемайтии, мастера тактики «нападай и беги» против рыцарей в доспехах." #NT!
 a_nd_lva_baltic_riflemen: "Балтийские стрелки" #NT!
 a_nd_lva_baltic_riflemen_desc: "Профессиональная пехота, сочетающая современное стрелковое искусство с многовековым опытом ведения боя в лесу." #NT!
  
  # Buildings 
 nd_lva_sacred_grove: "Священная роща" #NT!
 nd_lva_sacred_grove_desc: "Освященная роща древних дубов, где горит вечный огонь Ромувы и криве-кривайто совершают родовые обряды." #NT!
 nd_lva_amber_workshop: "Янтарная мастерская" #NT!
 nd_lva_amber_workshop_desc: "Мастерская, в которой балтийские ремесленники перерабатывают необработанный янтарь в ювелирные изделия, религиозные предметы и декоративные изделия на экспорт." #NT!
 nd_lva_pilskalns: "Пилскалнс" #NT!
 nd_lva_pilskalns_desc: "Укрепление земляных валов и деревянных частоколов на вершине балтийского холма, предназначенное для защиты естественной местности от захватчиков." #NT!
 nd_lva_ostseehandel: "Балтийский торговый пост" #NT!
 nd_lva_ostseehandel_desc: "Укрепленная прибрежная торговая станция, где обмениваются янтарем, мехами, медом и воском с иностранными купцами." #NT!
  
  # Production Methods 
 nd_lva_sacred_grove_maintenance: "Содержание Священной Рощи" #NT!
 nd_lva_sacred_grove_maintenance_desc: "Для поддержания священной рощи необходимы подношения пчелиного воска, древесины для вечного огня и скота для ритуальных жертвоприношений." #NT!
 nd_lva_amber_jewelry: "Производство ювелирных изделий из янтаря" #NT!
 nd_lva_amber_jewelry_desc: "Из балтийского янтаря вырезают и полируют ювелирные изделия, амулеты и декоративные изделия, которые ценятся во всей Европе." #NT!
 nd_lva_wax_leather_trade: "Торговля воском и кожей" #NT!
 nd_lva_wax_leather_trade_desc: "Переработка пчелиного воска и меха в готовые изделия из кожи и свечной воск для экспорта на западные рынки." #NT!
 nd_lva_tar_distillation: "Дистилляция смолы" #NT!
 nd_lva_tar_distillation_desc: "Производство смолы из балтийских сосновых лесов для использования в судостроении, гидроизоляции и на экспорт." #NT!
 nd_lva_amber_workshop_maintenance: "Техническое обслуживание мастерской" #NT!
 nd_lva_amber_workshop_maintenance_desc: "Инструменты и сырье, необходимые для поддержания работы янтарной мастерской." #NT!
 nd_lva_forest_garrison: "Лесной гарнизон" #NT!
 nd_lva_forest_garrison_desc: "Специализированный гарнизон, обученный ведению боевых действий в лесу, оснащенный лошадьми для быстрого реагирования и оружием для тактики засад." #NT!
 nd_lva_pilskalns_maintenance: "Форт Гаррисон" #NT!
 nd_lva_pilskalns_maintenance_desc: "Древесина, камень и оружие для поддержания городища и оснащения его гарнизона." #NT!
 nd_lva_baltic_naval_stores: "Балтийские военно-морские магазины" #NT!
 nd_lva_baltic_naval_stores_desc: "Переработка пиломатериалов и смолы из балтийской сосны в военно-морские поставки для экспорта в судостроительные страны Европы." #NT!
 nd_lva_ostseehandel_maintenance: "Содержание торгового поста" #NT!
 nd_lva_ostseehandel_maintenance_desc: "Пиломатериалы, меха и пчелиный воск для снабжения и обслуживания балтийского торгового поста." #NT!
  
  # Levies 
 levy_nd_lva_curonian_raider: "Куршский рейдер Леви" #NT!
 levy_nd_lva_curonian_raider_desc: "Свирепые пешие воины с Куршского побережья, собранные посредством племенной системы набора." #NT!
 levy_nd_lva_samogitian_horse: "Жемайтийский сбор легкой кавалерии" #NT!
 levy_nd_lva_samogitian_horse_desc: "Быстрые всадники с лесистых гор Жемайтии, служащие кавалерийским родом балтийского ополчения." #NT!
  
  # ===== DESTINY LOCALIZATION ===== 
  
  # Destiny Advance Names and Descriptions 
 nd_lva_destiny: "Судьба балтийской нации" #NT!
 nd_lva_destiny_desc: "Прибалтийские народы объединились. Теперь начинается настоящее испытание: выдержит ли эта нация и будет ли она расти или рухнет под тяжестью амбиций своих соседей?" #NT!
  
 nd_lva_dest_sacred_frontier: "Священная граница" #NT!
 nd_lva_dest_sacred_frontier_desc: "Земли к востоку от нашей родины являются предметом спора между Ромувой и христианским миром. Обезопасьте Полоцк и Витебск, чтобы закрепить священную границу." #NT!
  
 nd_lva_dest_pagan_kingdom: "Языческое королевство" #NT!
 nd_lva_dest_pagan_kingdom_desc: "Подчините великий город Киев балтийскому правлению и примите меритократическое управление. Пусть православные увидят, что может построить языческая мудрость." #NT!
  
 nd_lva_dest_eternal_flame: "Вечный огонь" #NT!
 nd_lva_dest_eternal_flame_desc: "Последнее языческое королевство в Европе должно стать ее самым могущественным. Завоюйте Москву и Смоленск, чтобы раз и навсегда сломить христианскую гегемонию." #NT!
  
 nd_lva_dest_amber_coast: "Янтарный берег" #NT!
 nd_lva_dest_amber_coast_desc: "Ганзейский союз разбогател на балтийской торговле. Захватите Любек, сердце их сети, и перенаправьте это богатство на наше побережье." #NT!
  
 nd_lva_dest_baltic_command: "Командовать Балтией" #NT!
 nd_lva_dest_baltic_command_desc: "Контролируйте торговый перекресток Балтийского моря, захватив Висбю на Готланде и столицу Швеции Стокгольм." #NT!
  
 nd_lva_dest_mare_balticum: "Маре Балтикум" #NT!
 nd_lva_dest_mare_balticum_desc: "Сделать Балтийское море Балтийским озером. Возьмите Копенгаген, чтобы контролировать Зунд, и обеспечьте потоки янтаря через наши рынки по всей Европе." #NT!
  
  # Destiny DHE Event, Root 
 nd_lva.6.t: "Судьба балтийской нации" #NT!
 nd_lva.6.d: "Балтийская нация стоит на пороге величия. Мы объединили куршей, жемайтийцев, пруссов и латгалов под одним знаменем — подвиг, который казался невозможным, когда крестоносные ордена впервые вошли в наши леса. Но объединение было только началом. Великие державы Европы по-прежнему смотрят на нас как на варварскую диковинку, языческий анахронизм, который скоро падет на пути цивилизации. Мы докажем их неправоту." #NT!
 nd_lva.6.a: "Наша судьба - наша собственная ковка" #NT!
  
  # Destiny DHE Event, Path A Stage 1 
 nd_lva.7.t: "Священная граница" #NT!
 nd_lva.7.d: "Наши воины двинулись на восток, к границам Руси, и посадили священный дуб там, где когда-то стоял только крест. Полоцк и Витебск, древние города на Двинском торговом пути, теперь подчиняются балтийской власти. Жрецы Ромувы следуют за нашими солдатами, возрождая старые обычаи в землях, которые их забыли. Граница между языческим балтийским миром и православным христианским миром решительно сместилась в нашу пользу." #NT!
 nd_lva.7.a: "Священные дубы растут там, где когда-то стоял крест" #NT!
  
  # Destiny DHE Event, Path A Stage 2 
 nd_lva.8.t: "Языческое королевство" #NT!
 nd_lva.8.d: "Захват Киева потряс христианский мир. Мать всех городов Руси, колыбель православной цивилизации на востоке, теперь развевает знамя языческого царя. Летописцы по всей Европе пишут об этом событии с ужасом и восхищением в равной мере. Для народов Балтии это оправдание: доказательство того, что старые боги не оставили тех, кто сохранил веру. Но как нам управлять этим огромным царством? Железной рукой завоевателя или мудростью народа, выжившего благодаря адаптации?" #NT!
 nd_lva.8.a: "Пусть старые боги маршируют на восток" #NT!
 nd_lva.8.b: "Мы терпим, сгибаясь, не ломаясь" #NT!
  
  # Destiny DHE Event, Path A Stage 3 
 nd_lva.9.t: "Вечный огонь" #NT!
 nd_lva.9.d: "Москва пала. Смоленск пал. Два столпа православной военной мощи на севере оказались под властью последнего языческого королевства в Европе. Вечный огонь Ромувы, который крестоносцы поклялись погасить, теперь горит ярче, чем когда-либо, его свет, образно говоря, виден со стен каждой христианской столицы. Это вершина балтийского могущества, момент, когда невозможное стало реальностью. Вопрос теперь в том, какой это будет империя: империя непобежденных воинов или империя просвещенной мудрости?" #NT!
 nd_lva.9.a: "Мы - пламя, которое никогда не умирает" #NT!
 nd_lva.9.b: "Мудрость горит ярче любого меча" #NT!
  
  # Destiny DHE Event, Path B Stage 1 
 nd_lva.10.t: "Янтарный берег" #NT!
 nd_lva.10.d: "Любек, королева Ганзы, была унижена. На протяжении веков немецкие купцы богатели, контролируя поток балтийских товаров (нашего янтаря, наших мехов, нашего пчелиного воска) на западные рынки, платя лишь часть их истинной стоимости. Больше никогда. Поскольку Любек находится под нашим контролем, вся ганзейская торговая сеть должна считаться с балтийскими силами. Янтарь, выброшенный на наши берега, обогатит нашу казну, а не сокровищницу иностранных купцов." #NT!
 nd_lva.10.a: "Торговля янтарем принадлежит Прибалтике" #NT!
  
  # Destiny DHE Event, Path B Stage 2 
 nd_lva.11.t: "Командовать Балтией" #NT!
 nd_lva.11.d: "Готланд и Стокгольм наши. Остров Готланд, древний перекресток балтийской торговли, где когда-то собирались торговцы-викинги, теперь служит балтийской военно-морской базой, контролирующей морские пути. Стокгольм, ключ к скандинавским водам, открывает нашим купцам северные пути. Куршская мореходная традиция, которую когда-то считали простым пиратством, превратилась в основу морской империи. Балтийское море становится нашим морем." #NT!
 nd_lva.11.a: "Управляйте волнами железом и дубом" #NT!
 nd_lva.11.b: "Постройте лигу янтаря и серебра" #NT!
  
  # Destiny DHE Event, Path B Stage 3 
 nd_lva.12.t: "Маре Балтикум" #NT!
 nd_lva.12.d: "Копенгаген пал, а вместе с ним и контроль над Датским проливом, узким проходом между Балтийским и Северным морями. Каждый корабль, проходящий через эти проливы, теперь плывет с нашего терпения. От Любека до Стокгольма, от Готланда до Копенгагена Балтийское море — это Балтийское озеро. Торговля янтарем, когда-то скромным потоком золотых слез, который терпеливые купцы несли на юг, превратилась в поток богатства, текущий через наши конторы. Потомки куршских викингов построили империю не только на завоеваниях, но и на торговле, мореплавании и золотых дарах моря." #NT!
 nd_lva.12.a: "Балтийское море – наша империя" #NT!
 nd_lva.12.b: "Янтарным королям нужна не корона, а коммерция" #NT!
  
  # Destiny Timed Modifiers 
 STATIC_MODIFIER_NAME_nd_lva_dest_romuva_ascendant: "Ромува Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_romuva_ascendant: "Старая вера наступает там, где отступает крест. Наши осадные инженеры с праведной яростью разрушают стены христианских крепостей." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_pagan_resilience: "Языческая устойчивость" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_pagan_resilience: "Балтийские народы пережили крестовые походы, голод и чуму. Эта устойчивость теперь поддерживает нашу растущую сферу." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_flame_unconquered: "Пламя непобедимо" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_flame_unconquered: "Ни одна армия не потушила священный огонь. Наши воины несут в бой его дух: быстрый, безжалостный и непобедимый." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_flame_enlightened: "Пламя просвещено" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_flame_enlightened: "Мудрость священного пламени освещает все народы, находящиеся под нашим правлением. Интеграция и обучение процветают в языческом королевстве." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_sea_dominion: "Морской Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_sea_dominion: "Наши военные корабли командуют волнами Балтики. Расходы на содержание армии и флота отягощают казну, но море принадлежит нам." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_trade_league: "Балтийская торговая лига" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_trade_league: "Сеть балтийских торговых постов заменяет Ганзейскую систему, направляя торговлю через наши порты и склады." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_amber_empire: "Янтарная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_amber_empire: "От Любека до Копенгагена торговля янтарем проходит через балтийскую морскую империю, обладающую непревзойденной военно-морской мощью." #NT!
 STATIC_MODIFIER_NAME_nd_lva_dest_merchant_princes: "Торговые князья Балтии" #NT!
 STATIC_MODIFIER_DESC_nd_lva_dest_merchant_princes: "Торговая элита Балтийского побережья стала принцами во всем, кроме имени, их янтарное богатство покупает мир и влияние по всей Европе." #NT!
  
  # Destiny Buildings 
 nd_lva_romuva_temple: "Храм Ромува" #NT!
 nd_lva_romuva_temple_desc: "Грандиозный каменный храмовый комплекс, в котором находится вечный огонь Ромувы, где Криве-Кривайто возглавляет высшую духовную власть всех балтийских народов." #NT!
 nd_lva_amber_kontor: "Эмбер Контор" #NT!
 nd_lva_amber_kontor_desc: "Крупный балтийский торговый дом, контролирующий торговлю янтарем, созданный по образцу ганзейских конторов, но служащий интересам Балтии, а не Германии." #NT!
  
  # Destiny Production Methods 
 nd_lva_temple_maintenance: "Содержание храма" #NT!
 nd_lva_temple_maintenance_desc: "Пчелиный воск для вечного огня, древесина для священных сооружений, камень для стен храма и домашний скот для ритуальных подношений." #NT!
 nd_lva_kontor_maintenance: "Контор Техническое обслуживание" #NT!
 nd_lva_kontor_maintenance_desc: "Янтарь, ткань, бумага и инструменты для содержания торгового дома и его коммерческой деятельности." #NT!
  
  # Bureaucracies 
 AUTO_MODIFIER_NAME_nd_lva_bureaucracy_authority: "Литовское господарство" #NT!
 AUTO_MODIFIER_DESC_nd_lva_bureaucracy_authority: "Господарь Великого Княжества наследует рабочий аппарат: Совет лордов, Русскую метрику канцелярии, Виленское и Тракайское воеводы, Гетманское командование. Два бюрократических места официально оформляют постоянные государственные органы Герцогства, наряду со местом, предоставленным столицей." #NT!
  
 lva_ponu_taryba_bureaucracy: "Пону Тариба" #NT!
 lva_ponu_taryba_bureaucracy_desc: "Совет лордов (Пону Тариба, Рада Литевска в польской канцелярии) сформировался в 1430-х годах из неофициального совета великого князя и был узаконен привилегией Александра Ягеллона 1492 года. С этого момента великий князь не мог проводить внешнюю политику, назначать воеводу или смещать высокопоставленного чиновника без согласия Совета. Нижние должности должны были заполняться в присутствии воевод Виленского и Тракайского. Скамейки были заполнены крупными католическими магнатскими домами (Радвилос, Гоштаутай, Кенсгайлос, Олелковичяй), что сделало Совет институциональным голосом литовского сенаторского класса." #NT!
  
 lva_lietuvos_statutai_bureaucracy: "Летувос Статутай" #NT!
 lva_lietuvos_statutai_bureaucracy_desc: "Три литовских статута (1529, 1566, 1588 гг.) кодифицировали право Великого княжества за полвека до того, как Польша получила какой-либо эквивалент. Разработанный в русинской канцелярии Вильнюса, Первый Статут был запечатан при Сигизмунде I по инициативе Совета лордов; Второй, значительно расширенный, вступил в силу при Сигизмунде Августе; Третий был подтвержден Сигизмундом III Вазой 28 января 1588 года и оставался в силе в литовских провинциях до XIX века. Статуты связывали боярские привилегии с царской процедурой и давали канцелярским юристам рабочую профессию." #NT!
  
 lva_vaivadijos_pavietai_bureaucracy: "Ваивадихос и Павиетай" #NT!
 lva_vaivadijos_pavietai_bureaucracy_desc: "После Городловской унии в 1413 году Великое княжество приняло польскую административную модель воеводы и кастеляна, которая в результате реформ Сигизмунда Августа 1565–1566 годов превратилась в тринадцать палатинатов и входящих в их состав повятов. Каждую из них возглавлял воевода, который созвал региональный сбор и председательствовал на сеймике, а староста управлял коронными имениями и отправлял высшее правосудие. Замковый двор (Pilies Teismas) в Вильнюсе и соответствующие суды в главных городах ввели дворянство герцогства в процессуальную систему польского образца, сохранив при этом литовское земельное управление." #NT!
  
 lva_lietuvos_metrika_bureaucracy: "Летувос Метрика" #NT!
 lva_lietuvos_metrika_bureaucracy_desc: "Литовская метрика представляла собой непрерывный реестр всех привилегий, судебных решений, договоров и земельных пожалований Великого княжества, который хранился с конца XIV века в Вильнюсской русинской канцелярии. Сохранилось более 600 книг, выпущенных до 1697 года, когда польский и латынь окончательно вытеснили русинский язык в качестве рабочего языка канцелярии Речи Посполитой. Грамотные писцы, которые поддерживали Метрику, были взяты из православной русской знати, класса католических бюргеров и соборного духовенства Вильнюса: институциональной памяти герцогства." #NT!
  
 lva_didysis_etmonas_bureaucracy: "Дидисис Этмонас" #NT!
 lva_didysis_etmonas_bureaucracy_desc: "Должность Великого гетмана Литовского (didysis etmonas, hetman wielki Litewski) была учреждена 11 сентября 1497 года с назначением князя Константина Острожского, победителя татар под Очаковом. Великий гетман командовал полевыми армиями герцогства на войне, руководил пограничными укреплениями и гарнизонами в мирное время, издавал обязательные военные указы; на местах замещал полевой гетман (lauko etmonas). Этот пост занимал пожизненно и почти всегда из домов великих магнатов (Острожских, Радвила, Сапеги, Ходкевичей), объединяя военное командование герцогства с его сенаторской элитой." #NT!
  
 lva_vilniaus_akademija_bureaucracy: "Вильнюсская Академия" #NT!
 lva_vilniaus_akademija_bureaucracy_desc: "1 апреля 1579 года король Стефан Баторий пожаловал привилегированную грамоту, повышающую Вильнюсскую иезуитскую коллегию (основанную в 1570 году по приглашению епископа Валерионаса Протасявичюса) в ранг полного studium Generale; Папа Григорий XIII утвердил основание в октябре того же года. Это был третий университет Польско-Литовского королевства после Краковской академии и Альбертины и единственный в Великом княжестве. Вильнюсские магистры-иезуиты обучали юристов канцелярии, духовенство собора и следующее поколение сыновей магнатов латинскому языку и теологии контрреформации." #NT!
