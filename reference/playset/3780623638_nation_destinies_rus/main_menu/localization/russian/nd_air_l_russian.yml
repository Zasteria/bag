l_russian:
 STATIC_MODIFIER_NAME_nd_air_desert_sovereignty: "Суверенитет пустыни" #NT!
 STATIC_MODIFIER_DESC_nd_air_desert_sovereignty: "Туареги едут, как и всегда, непокоренные владыки Сахары. Знать Ихгарена командует верблюдами, и никакая иностранная армия не сможет преследовать их по бескрайним пескам. Сама пустыня — это крепость, оружие и трон." #NT!
 STATIC_MODIFIER_NAME_nd_air_gateway_of_the_sahara: "Ворота Сахары" #NT!
 STATIC_MODIFIER_DESC_nd_air_gateway_of_the_sahara: "Агадес стоит на перекрестке мира. От соляных копей Билмы до золотых рынков Хаусаленда, от Магриба до излучины Нигера — каждый караван проходит через наши ворота. Туареги превратили свою пустыню в величайший торговый коридор Африки." #NT!
 STATIC_MODIFIER_NAME_nd_air_amenokal_authority: "Авторитет Аменокала" #NT!
 STATIC_MODIFIER_DESC_nd_air_amenokal_authority: "Аменокал, верховный вождь конфедерации, правит, опираясь на традиции и с согласия барабанных групп. Его слово — закон для всей пустыни." #NT!
 STATIC_MODIFIER_NAME_nd_air_council_of_drum_groups: "Совет барабанных групп" #NT!
 STATIC_MODIFIER_DESC_nd_air_council_of_drum_groups: "Барабанные группы конфедерации собираются на совет, каждый из которых представлен своим амгаром. Правит консенсус, и Султанат существует благодаря переговорам, а не принуждению." #NT!
 STATIC_MODIFIER_NAME_nd_air_salt_caravan_wealth: "Соляное богатство каравана" #NT!
 STATIC_MODIFIER_DESC_nd_air_salt_caravan_wealth: "Караваны азалая возвращаются из Билмы с соляными кирпичами, которые продаются с баснословной прибылью на рынках юга. Богатства пустыни перетекают через руки туарегов." #NT!
 STATIC_MODIFIER_NAME_nd_air_caravan_protection: "Защита каравана" #NT!
 STATIC_MODIFIER_DESC_nd_air_caravan_protection: "Всадники-туареги сопровождают огромные караваны через Тенере, их присутствие гарантирует безопасный проход через самый опасный участок транссахарского маршрута." #NT!
 STATIC_MODIFIER_NAME_nd_air_agadez_minaret: "Минарет Агадеса" #NT!
 STATIC_MODIFIER_DESC_nd_air_agadez_minaret: "Возвышающийся минарет из сырцового кирпича Агадеса, самое высокое подобное сооружение в мире, является свидетельством благочестия и амбиций Султаната." #NT!
 nd_air.1.t: "Восхождение Воздуха" #NT!
 nd_air.1.d: "Разрозненные кланы Кел Эйр объединились под одним знаменем. От вулканических вершин гор Эйр до обжигающих песков Тенере, от садов-оазисов Тимии до шумных рынков Агадеса, туареги стоят вместе.\n\nНо единство ставит вопрос, который туареги обсуждают на протяжении поколений. Ихгарены, знатная каста носителей меча, которые разъезжают на своих великолепных мехари по открытой пустыне, видят в конфедерации средство господства туарегов над Сахарой. Они сохранят древние обычаи: набеги, сбор дани, воинский кодекс, который заставлял туарегов бояться от Магриба до Нигера.\n\nОднако сам Агадес рассказывает другую историю. Этот космополитический город, где дворяне туареги, торговцы хауса и ученые из Тимбукту общаются в тени великой мечети, разбогател не за счет меча, а за счет каравана. Транссахарская торговля солью, золотом и рабами проходит через наши ворота, и те, кто контролирует маршруты, контролируют богатство наций.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_air.1.a: "Мы повелители пустыни. Пусть пески будут нашей властью!" #NT!
 nd_air.1.b: "Агадес станет воротами в Сахару!" #NT!
 nd_air.2.t: "Султанат обретает форму" #NT!
 nd_air.2.d: "Около 1405 года капризные кланы туарегов Аирского региона достигли замечательного соглашения. Понимая, что постоянная межклановая вражда ослабляет их по отношению к соседям, экспансионистской Империи Борну на востоке и городам-государствам хауса на юге, они решили создать нейтрального арбитра. Первый султан, Юнус, был выбран намеренно из-за его нейтралитета: сын далекого отца-туарега из Тарги в Ливии и местной служанки, он не принадлежал ни к одному влиятельному местному клану и, следовательно, мог беспристрастно выступать посредником.\n\nИнститут доказал свою ценность. Его преемник Альхасан перенес резиденцию султаната в недавно основанный город Агадес, где уже смешались туареги, хауса и транссахарские купцы. Барабан султана, эттебель, стал символом конфедеративного единства, и удары этого барабана призывали кланы на совет.\n\nТеперь вопрос в том, как должен управлять этот новый султанат. Будет ли Аменокал править под властью централизованного монарха, или барабанные группы сохранят свою древнюю автономию в совете равных?" #NT!
 nd_air.2.a: "Аменокал говорит, и пустыня подчиняется." #NT!
 nd_air.2.b: "Барабанные группы управляются советом и консенсусом." #NT!
 nd_air.3.t: "Соленая дорога" #NT!
 nd_air.3.d: "Дважды в год, в начале ноября и в марте, огромные соляные караваны отправляются из Агадеса. Эти азалай, процессии из сотен, а иногда и тысяч верблюдов, пересекают обширную пустыню Тенере в трехнедельном путешествии к натронным соляным месторождениям Билмы и Кауара. Там они обменивают зерно, финики и ткань на большие куски минеральной соли, каждая из которых весит столько, сколько может поднять человек.\n\nОбратный путь еще более опасен, поскольку верблюды теперь нагружены и медлительны. Но награда огромна: соль, товар более ценный, чем серебро в южных королевствах, где она продается в соотношении вес к весу с золотом на рынках Кано и Кацина. Кланы туарегов, которые организуют и защищают эти караваны, контролируют один из самых прибыльных торговых путей в мире.\n\nСледуем ли мы максимизировать прибыль от этой торговли или нам следует использовать караваны для проецирования военной мощи через пустыню?" #NT!
 nd_air.3.a: "Торговля солью сделает нас сверх меры богатыми." #NT!
 nd_air.3.b: "Наши всадники будут охранять каждую крупинку соли копьем и мечом." #NT!
 nd_air.4.t: "Великая мечеть Агадеса" #NT!
 nd_air.4.d: "В самом сердце Агадеса над кирпичным городом возвышается замечательное строение. Большая мечеть, приписываемая архитектору шейху Закарии и построенная около 1515 года, представляет собой пирамидальный минарет высотой двадцать семь метров, самый высокий минарет из сырцового кирпича в мире. Ее ступенчатая, сужающаяся форма постепенно сужается вверх, а выступающие балки пальмового ствола вставлены через определенные промежутки и служат одновременно усилением и строительными лесами для ежегодной замены штукатурки, которая удерживает сооружение от ветра и дождя.\n\nМечеть была построена в период влияния Сонхая, что отражает синтез архитектурных традиций Сахеля, Северной Африки и местных туарегов, что делает Агадес уникальным. Он служит не только местом поклонения, но и символом важности города, маяком, видимым через пустыню, сообщающим приближающимся караванам, что они достигли ворот Сахары.\n\nВерующие собираются под его сводами. Город гордится этим памятником веры и изобретательности." #NT!
 nd_air.4.a: "Маяк веры в сердце пустыни." #NT!
 nd_air_mehari_tradition: "Традиция Мехари" #NT!
 nd_air_mehari_tradition_desc: "Древнее искусство ведения войны в пустыне на верблюдах, усовершенствованное поколениями туарегов Ихаггарен на быстрых мехари через Сахару." #NT!
 nd_air_caravan_guardians: "Стражи каравана" #NT!
 nd_air_caravan_guardians_desc: "Укрепленные сторожевые вышки и вооруженный эскорт защищают жизненно важные транссахарские торговые пути через воздушную территорию." #NT!
 nd_air_trans_saharan_routes: "Транссахарские маршруты" #NT!
 nd_air_trans_saharan_routes_desc: "Сеть караван-сараев и промежуточных станций в пустыне, поддерживающая великие торговые караваны, пересекающие Сахару." #NT!
 nd_air_camel_mastery: "Верблюжье мастерство" #NT!
 nd_air_camel_mastery_desc: "Селективное разведение мехари на скорость и выносливость, основу экономической и военной мощи туарегов.\n\n#italic Доступно в: $nd_air_caravanserai$#!" #NT!
 nd_air_ihaggaren_code: "Кодекс Ихаггарена" #NT!
 nd_air_ihaggaren_code_desc: "Неписаный кодекс благородной касты туарегов, регулирующий честь, военное дело и обязанности меченосной аристократии." #NT!
 nd_air_kel_ayr_bonds: "Кел Эйр Бондс" #NT!
 nd_air_kel_ayr_bonds_desc: "Родственные узы и матрилинейные союзы объединяют конфедерацию Кел Эйр, обеспечивая сотрудничество между крайне независимыми кланами." #NT!
 nd_air_takouba_tradition: "Такуба Традиция" #NT!
 nd_air_takouba_tradition_desc: "Владение такубой, характерным прямым обоюдоострым мечом туарегской знати, вручаемым молодым людям по достижении совершеннолетия." #NT!
 nd_air_inadan_smiths: "Инадан Смитс" #NT!
 nd_air_inadan_smiths_desc: "Каста инадан, состоящая из кузнецов и ремесленников, которые куют клинки такуба, изготавливают серебряные украшения и производят изделия из кожи, которыми славятся туареги." #NT!
 nd_air_agadez_cross: "Крест Агадеса" #NT!
 nd_air_agadez_cross_desc: "Отличительный серебряный крест Агадеса, символ защиты и самобытности, изготовленный инадскими серебряными мастерами и носимый каждым туарегским путешественником.\n\n#italic Доступно в: $nd_air_inadan_forge$#!" #NT!
 nd_air_sahelian_islam: "Сахельский ислам" #NT!
 nd_air_sahelian_islam_desc: "Особое сочетание ислама, практикуемого в Сахеле, сочетающее ортодоксальные суннитские обряды с местными культурными традициями туарегов." #NT!
 nd_air_sultanate_founding: "Основание Султаната" #NT!
 nd_air_sultanate_founding_desc: "Создание султаната Агадес около 1405 года, когда кланы туарегов выбрали нейтрального аутсайдера в качестве султана для посредника между соперничающими фракциями." #NT!
 nd_air_matrilineal_alliances: "Матрилинейные союзы" #NT!
 nd_air_matrilineal_alliances_desc: "Практика туарегов по матрилинейному наследованию и кросс-кузенным бракам создает сеть союзов, связывающую конфедерацию воедино." #NT!
 nd_air_camel_lancers: "Кэмел Уланс" #NT!
 nd_air_camel_lancers_desc: "Устрашающая боевая тактика Кел Эйра: метание копий со спины верблюда перед тем, как броситься домой с обнаженными мечами такуба." #NT!
 nd_air_azalai_tradition: "Азалайская традиция" #NT!
 nd_air_azalai_tradition_desc: "Дважды в год соляные караваны из Агадеса в соляные промыслы Бильма и Кауар — один из самых трудных и прибыльных торговых маршрутов в мире." #NT!
 nd_air_bilma_salt_pans: "Солонки Бильма" #NT!
 nd_air_bilma_salt_pans_desc: "Добыча и переработка натронной соли из котлов Билмы, которая продается по всей Западной Африке с огромной прибылью.\n\n#italic Доступно в: $nd_air_salt_depot$#!" #NT!
 nd_air_indigo_cloth_trade: "Торговля тканью индиго" #NT!
 nd_air_indigo_cloth_trade_desc: "Глубокая окраска цвета индиго, благодаря которой туареги заслужили репутацию «синих людей», их одежда ценится во всем Сахеле." #NT!
 nd_air_desert_navigation: "Навигация по пустыне" #NT!
 nd_air_desert_navigation_desc: "Непревзойденный опыт туарегов в чтении звезд, ветров и местности для навигации по безликим просторам Тенере." #NT!
 nd_air_sovereignty_restored: "Суверенитет восстановлен" #NT!
 nd_air_sovereignty_restored_desc: "После краха господства Сонгай после марокканского вторжения в 1591 году Султанат Агадес вновь подтвердил свою независимость." #NT!
 nd_air_agadez_garrison: "Агадесский гарнизон" #NT!
 nd_air_agadez_garrison_desc: "Городская милиция Агадеса, набранная из оседлого населения города для защиты его стен и рынков." #NT!
 nd_air_desert_scholarship: "Стипендия пустыни" #NT!
 nd_air_desert_scholarship_desc: "Исламская наука процветает в Агадесе, где учёные со всего Сахеля собираются для изучения теологии, права и астрономии." #NT!
 nd_air_ghazw_raids: "Газвские рейды" #NT!
 nd_air_ghazw_raids_desc: "Традиция туарегов совершать набеги в пустыне: быстрые кавалерийские удары, которые обнажают врага до того, как он исчезнет в песках." #NT!
 nd_air_agadez_market_tolls: "Плата за проезд на рынке Агадеса" #NT!
 nd_air_agadez_market_tolls_desc: "Систематическое налогообложение товаров, проходящих через Агадес, крупнейший рынок между Магрибом и Хаусалендом." #NT!
 nd_air_air_mountains_refuge: "Убежище Воздушных гор" #NT!
 nd_air_air_mountains_refuge_desc: "Вулканические вершины и скрытые долины Воздушных гор служат неприступным убежищем от любого захватчика." #NT!
 nd_air_drum_group_council: "Совет барабанной группы" #NT!
 nd_air_drum_group_council_desc: "Совет барабанных групп, каждую из которых возглавляет свой амгар, собирается для разрешения споров, распределения прав на выпас и координации дел конфедерации." #NT!
 nd_air_saharan_ghazis: "Сахарские Гази" #NT!
 nd_air_saharan_ghazis_desc: "Элитные священные воины туарегов, сочетающие древние традиции пустынной кавалерии с исламским военным рвением." #NT!
 nd_air_sultanate_reform: "Реформа султаната" #NT!
 nd_air_sultanate_reform_desc: "Централизация власти Султаната, распространение прямого управления Султана за пределы Агадеса на более широкую конфедерацию." #NT!
 nd_air_desert_logistics: "Логистика пустыни" #NT!
 nd_air_desert_logistics_desc: "Овладение снабжением и передвижением по пустыне, позволяющее армиям туарегов действовать на огромных расстояниях, где другие погибнут." #NT!
 nd_air_warrior_code: "Кодекс воина" #NT!
 nd_air_warrior_code_desc: "Кодификация боевых традиций туарегов в формальный воинский кодекс, регулирующий бой, честь и обращение с побежденными врагами." #NT!
 nd_air_tuareg_identity: "Туарегская идентичность" #NT!
 nd_air_tuareg_identity_desc: "Непреходящая культурная идентичность туарегов, язык тамашек, чадра, серебряные украшения, поэзия, сохраняющиеся на протяжении столетий под внешним давлением." #NT!
 nd_air_unconquerable_sahara: "Непобедимая Сахара" #NT!
 nd_air_unconquerable_sahara_desc: "Сахара остается непобедимой. Ни европейская колонна, ни османская армия, ни одна иностранная держава не смогут удержать пустыню от воинов, знающих каждую дюну и вади." #NT!
 nd_air_confederal_resilience: "Конфедеративная устойчивость" #NT!
 nd_air_confederal_resilience_desc: "Удивительная долговечность конфедеративной системы туарегов, пережившая завоевания, засуху и колониальное давление благодаря коллективной солидарности." #NT!
 nd_air_pastoral_adaptation: "Пастырская адаптация" #NT!
 nd_air_pastoral_adaptation_desc: "Продолжающаяся адаптация пастырской практики туарегов к меняющимся экологическим и экономическим условиям в Сахаре." #NT!
 a_nd_air_mehari_raiders: "Мехари Рейдерс" #NT!
 a_nd_air_mehari_raiders_desc: "Быстрые налетчики пустыни верхом на гоночных верблюдах мехари. Эти воины-туареги нападают без предупреждения и исчезают в песках прежде, чем успевает сформироваться организованный ответ." #NT!
 a_nd_air_takouba_swordsmen: "Мечники Такуба" #NT!
 a_nd_air_takouba_swordsmen_desc: "Элитные воины-туареги из благородной касты Ихаггарен, владеющие характерной такубой, прямым обоюдоострым мечом средней длины восемьдесят сантиметров в сочетании с кожаным щитом, достаточно большим, чтобы покрыть тело человека." #NT!
 a_nd_air_kel_ayr_lancers: "Кел Эйр Лансерс" #NT!
 a_nd_air_kel_ayr_lancers_desc: "Верблюжьи копейщики конфедерации Кел Эйр, которые метают копья со спины верблюда, прежде чем атаковать мечами такуба. Их фланговые атаки рассеивают вражеские формирования по пустыне." #NT!
 a_nd_air_agadez_spearmen: "Агадесские копейщики" #NT!
 a_nd_air_agadez_spearmen_desc: "Дисциплинированные городские рекруты, набираемые из оседлого населения Агадеса, представляющего собой смесь горожан-туарегов, купцов хауса и ремесленников, которые защищают город и его рынки." #NT!
 a_nd_air_saharan_ghazis: "Сахарские Гази" #NT!
 a_nd_air_saharan_ghazis_desc: "Святые воины пустыни, сочетающие в себе древнюю кавалерийскую традицию туарегов с исламским военным рвением, отправляющиеся на войну под зеленым знаменем веры." #NT!
 nd_air_caravanserai: "Пустынный Караван-сарай" #NT!
 nd_air_caravanserai_desc: "Укрепленная перевалочная станция на транссахарском маршруте, обеспечивающая водой, укрытием и кормом караванных животных, пересекающих пустыню." #NT!
 nd_air_inadan_forge: "Инадан Фордж" #NT!
 nd_air_inadan_forge_desc: "Мастерская касты кузнецов инадан, где выковываются клинки такуба, изготавливаются серебряные украшения и производятся лучшие изделия из кожи туарегов." #NT!
 nd_air_banco_mosque: "Мечеть Банко" #NT!
 nd_air_banco_mosque_desc: "Мечеть из сырцового кирпича в характерном сахельском стиле, ее минарет с выступающими пальмовыми балками служит постоянными строительными лесами для ежегодного обслуживания." #NT!
 nd_air_indigo_dyeworks: "Краски индиго" #NT!
 nd_air_indigo_dyeworks_desc: "Красильная фабрика, где ткань пропитывается насыщенным цветом индиго, в результате чего получается ткань, благодаря которой туареги заслужили репутацию голубых людей пустыни." #NT!
 nd_air_salt_depot: "Соляной склад" #NT!
 nd_air_salt_depot_desc: "Склад и распределительный центр кирпичей из натронной соли, привезенных из Билмы караванами азалай, одного из самых ценных товаров в Западной Африке." #NT!
 nd_air_desert_watchtower: "Сторожевая башня пустыни" #NT!
 nd_air_desert_watchtower_desc: "Укрепленный наблюдательный пункт на караванных путях, укомплектованный воинами-туарегами, которые охраняют торговые пути от бандитов и конкурирующих налетчиков." #NT!
 nd_air_caravanserai_upkeep: "Провизия в караван-сарае" #NT!
 nd_air_caravanserai_upkeep_desc: "Скот, зерно и соль были необходимы для снабжения караванов и их животных, проходящих через промежуточную станцию." #NT!
 nd_air_forge_upkeep: "Такуба Ковка" #NT!
 nd_air_forge_upkeep_desc: "Кузнецы-инадан куют из железа и меди мечи такуба и другое оружие, ценимое по всей Сахаре." #NT!
 nd_air_mosque_upkeep: "Обслуживание мечети" #NT!
 nd_air_mosque_upkeep_desc: "Камень и древесина для ежегодной штукатурки и ремонта конструкции сырцовой мечети, а также благовония для богослужений." #NT!
 nd_air_dyeworks_upkeep: "Крашение Индиго" #NT!
 nd_air_dyeworks_upkeep_desc: "Ткань, пропитанная насыщенным красителем индиго, позволяет получить тонкую синюю ткань, которая прославила туарегов." #NT!
 nd_air_salt_depot_upkeep: "Работа соляного склада" #NT!
 nd_air_salt_depot_upkeep_desc: "Запасы соли, вьючные животные и инструменты, необходимые для работы склада и распределения соли на рынки." #NT!
 nd_air_watchtower_upkeep: "Гарнизон Сторожевой Башни" #NT!
 nd_air_watchtower_upkeep_desc: "Каменные укрепления, оружие и провизия для гарнизона сторожевой башни в пустыне." #NT!
 nd_air_salt_processing: "Переработка соли Сахары" #NT!
 nd_air_salt_processing_desc: "Переработка и упаковка натронной соли из кастрюль Билма в керамические сосуды для распространения по Западной Африке." #NT!
 nd_air_silver_crafting: "Изготовление серебряных ювелирных изделий" #NT!
 nd_air_silver_crafting_desc: "Инаданское ремесло обработки серебра и меди для изготовления отличительных крестов, амулетов и орнаментов, которые характеризуют туарегскую идентичность." #NT!
 nd_air_camel_breeding: "Программа разведения верблюдов" #NT!
 nd_air_camel_breeding_desc: "Селекционное разведение верблюдов, которых кормят зерном и солью, дает лучших верховых и вьючных животных в Сахаре." #NT!
 levy_nd_air_mehari_raiders: "Мехари Рейдер Леви" #NT!
 levy_nd_air_mehari_raiders_desc: "Дворяне и воины туарегов воспитывались как разбойники пустыни верхом на верблюдах в традиционном стиле Ихаггарен." #NT!
 levy_nd_air_agadez_spearmen: "Леви копейщиков Агадеса" #NT!
 levy_nd_air_agadez_spearmen_desc: "Городские сборы набираются из оседлого населения Агадеса для защиты города и его рынков." #NT!
 nd_air_desert_madrasa: "Пустынное медресе" #NT!
 nd_air_desert_madrasa_desc: "Исламская школа сахельской традиции, где ученые изучают теологию, право и астрономию под патронажем Султаната." #NT!
 nd_air_madrasa_upkeep: "Операции медресе" #NT!
 nd_air_madrasa_upkeep_desc: "Бумага и ткань для школьной библиотеки и ученых, а также камень для ремонта конструкций." #NT!
 nd_air_leather_trade: "Сахарская кожаная торговля" #NT!
 nd_air_leather_trade_desc: "Изготовление и экспорт тонких изделий из кожи туарегов, шкур домашнего скота, окрашенных в яркие цвета и обработанных инструментами для создания вышитых геометрических узоров, которые ценятся в Западной Африке и за ее пределами." #NT!
 nd_air_saharan_commerce: "Сахарская торговля" #NT!
 nd_air_saharan_commerce_desc: "Превращение транссахарских торговых сетей в сложную коммерческую систему, связывающую Средиземноморье с Нигером." #NT!
 nd_air_trade_exchange: "Сахарская торговая биржа" #NT!
 nd_air_trade_exchange_desc: "Модернизированный рынок, где собираются караванщики, местные мастера и иностранные торговцы для обмена товарами на регулируемых условиях." #NT!
 nd_air_exchange_upkeep: "Обменные операции" #NT!
 nd_air_exchange_upkeep_desc: "Камень, бумага и инструменты, необходимые для обслуживания объектов торгового обмена и ведения учета." #NT!
 nd_air_modern_trade: "Современная торговля" #NT!
 nd_air_modern_trade_desc: "Адаптация древней караванной торговли к меняющимся экономическим реалиям современной эпохи с регулируемыми рынками и систематическим ведением учета.\n\n#italic Доступно в: $nd_air_trade_exchange$#!" #NT!
 nd_air_formed_tt: "Воздух образовался." #NT!
 nd_air_path_a_tt: "Выбрал суверенитет пустыни" #NT!
 nd_air_path_b_tt: "Выбрали Ворота Сахары" #NT!
 nd_air_destiny: "Судьба Воздуха" #NT!
 nd_air_destiny_desc: "Султанат Воздуха был создан. Теперь туарегам предстоит решить свой путь: покорят ли они плодородный юг или овладеют торговыми путями, пересекающими пустыню?" #NT!
 nd_air_dest_hausaland: "Кампания Хаусаленда" #NT!
 nd_air_dest_hausaland_desc: "Богатые города-государства хауса на юге уже давно становятся объектами набегов туарегов. Настало время превратить набеги в завоевания. Захватите Кацину и сокрушите Гобир, чтобы установить владычество туарегов над центральным Сахелем." #NT!
 nd_air_dest_kano: "Падение Кано" #NT!
 nd_air_dest_kano_desc: "Кано, богатейший город Хаусаленда, станет наградой, которая сделает туарегов хозяевами центрального Сахеля. Его обширные рынки, его красильные ямы, его стены — все должно подчиниться нашему правлению." #NT!
 nd_air_dest_saharan_empire: "Сахарская империя" #NT!
 nd_air_dest_saharan_empire_desc: "От столицы империи Борну в Нгазаргаму до крепости Кебби в Сокото, весь центральный Сахель должен подчиниться власти туарегов. Это краеугольный камень пустынной империи, простирающейся от гор Эйр до берегов озера Чад." #NT!
 nd_air_dest_salt_road: "Соленая дорога" #NT!
 nd_air_dest_salt_road_desc: "Соляные копи Билмы являются источником жизненной силы транссахарской торговли. Обеспечив прямой контроль над этим источником, туареги смогут диктовать цены на самый ценный товар в Западной Африке." #NT!
 nd_air_dest_fezzan_link: "Ссылка на Феццан" #NT!
 nd_air_dest_fezzan_link_desc: "Оазис Гат в Феццане — северные ворота транссахарского маршрута. Контролируя Билму и Гат, туареги держат в своих руках весь центральный коридор торговли Сахары." #NT!
 nd_air_dest_master_of_routes: "Мастер маршрутов" #NT!
 nd_air_dest_master_of_routes_desc: "Тимбукту, легендарный город золота и знаний, является западной конечной точкой великой торговой сети Сахары. Распространив контроль туарегов на излучину Нигера, Эйр становится бесспорным хозяином транссахарской торговли." #NT!
 nd_air.5.t: "Путь Воздуха" #NT!
 nd_air.5.d: "Султанат Воздуха един. Конфедерация туарегов доказала свою силу, и барабанные группы бьют в едином ритме. Но остается вопрос, который всегда разделял наш народ: что нам построить с этим единством?\n\nПустыня — наши владения. Выбор, который мы сделаем сейчас, определит судьбу туарегов для будущих поколений." #NT!
 nd_air.5.a: "Судьба Воздуха начинается сейчас." #NT!
 nd_air.6.t: "Ворота Хаусаленда" #NT!
 nd_air.6.d: "Города-государства хауса разбогатели за своими стенами, торгуя продуктами своих плодородных земель и платя дань той власти, которая может собрать достаточно всадников, чтобы угрожать их воротам. Слишком долго туареги довольствовались набегами и уходом. Больше нет.\n\nКацина с ее знаменитыми текстильными рынками и стратегическим положением на торговых путях, а также Алкалава, резиденция королей Гобира, которые на протяжении поколений оспаривали превосходство туарегов, пали под натиском нашей кавалерии. Хауса узнают то, что всегда знали народы Сахары: не существует стены, достаточно высокой, чтобы остановить нападение туарегов." #NT!
 nd_air.6.a: "Гнев пустыни не знает стен." #NT!
 nd_air.7.t: "Кано представляет" #NT!
 nd_air.7.d: "Великие стены Кано, простоявшие веками, открылись для наших войск. Это не просто приграничный город, Кано — крупнейший торговый центр во всем Хаусаленде, где расположены знаменитые фабрики по производству красителей индиго, из которых производят ткани, которые продаются даже в Египте и Марокко. Его обширные рынки торгуют кожей, зерном, орехами кола и рабами.\n\nТеперь мы должны решить, как управлять этим призом. Будем ли мы собирать дань традиционным для туарегов способом, сезонными требованиями, подкрепленными угрозой мехари, или создадим постоянный гарнизон и интегрируем Кано в нашу конфедеративную систему?" #NT!
 nd_air.7.a: "Дань – это путь туарегов. Берём то, что нам нужно и едем дальше." #NT!
 nd_air.7.b: "Установите наше знамя в Кано и держите его вечно." #NT!
 nd_air.8.t: "Империя песков" #NT!
 nd_air.8.d: "От гор Эйр до берегов озера Чад, от дюн Тенере до берегов Нигера туареги построили то, что никто не считал возможным: настоящую Сахарскую империю. Нгазаргаму, древняя столица Борну, пала. Сокото сгибает колено. Города-государства хауса являются данниками или провинциями.\n\nЭто достижение бросает вызов общепринятому мнению, что кочевники пустыни не могут построить прочные государства. Вопрос теперь в том, какой это будет империя. Останемся ли мы теми, кем были всегда, высшими налетчиками, извлекающими богатство из оседлых народов, сохраняя при этом нашу кочевую свободу? Или мы станем кем-то новым, настоящими императорами, которые будут не только завоевывать, но и управлять?" #NT!
 nd_air.8.a: "Мы ездим, совершаем набеги, мы правим, по-туарегски." #NT!
 nd_air.8.b: "Корона императора весит больше, чем вуаль всадника." #NT!
 nd_air.9.t: "Соляные лорды Билмы" #NT!
 nd_air.9.d: "Натронные соляные месторождения Билмы сейчас находятся под прямым контролем туарегов. На протяжении веков караваны азалая пересекали Тенере, чтобы купить здесь соль, но туареги были скорее посредниками и сопровождающими, чем владельцами. Больше нет.\n\nС Билмой в наших руках мы контролируем источник. Каждый кирпич соли, покидающий эти котлы и продаваемый в соотношении вес к весу с золотом на рынках юга, напрямую обогащает Султанат. Богатства пустыни наконец-то перетекли в руки туарегов." #NT!
 nd_air.9.a: "Соль наша, а вместе с ней и богатство народов." #NT!
 nd_air.10.t: "Ворота на Север" #NT!
 nd_air.10.d: "Город-оазис Гат, расположенный в Феццане у подножия гор Акакус, долгое время был северной конечной точкой центрального транссахарского маршрута. Караваны туарегов всегда проходили через Гат, но теперь мы удерживаем его сами.\n\nС Билмой на юге и Гатом на севере, весь центральный коридор сахарской торговли представляет собой дорогу туарегов. Средиземноморские товары текут на юг через нашу территорию; Сахельское золото, соль и рабы текут на север. Мы незаменимые посредники.\n\nДолжны ли мы максимизировать свое положение в качестве посредников, облагая налогом каждый тюк и раба, пересекающих нашу территорию? Или нам стоит инвестировать в инфраструктуру самого оазиса, превращая каждую точку в процветающий торговый город?" #NT!
 nd_air.10.a: "Мы облагаем налогом каждую песчинку, которую пересекают караваны." #NT!
 nd_air.10.b: "Стройте колодцы, стройте рынки, заставьте пустыню цвести." #NT!
 nd_air.11.t: "Золотая дорога" #NT!
 nd_air.11.d: "Тимбукту, город трехсот тридцати трех святых, место медресе Санкоре, легендарное место паломничества Мансы Мусы, Тимбукту принадлежит нам. С его помощью туареги контролируют всю широту транссахарской торговли, от соляных копей Билмы на востоке до золотых рынков излучины Нигера на западе, от средиземноморских берегов Феццана до берегов великой реки.\n\nНи один купец, ни один караван, ни один товар не пересекает Сахару без разрешения туарегов и без прибыли туарегов. Это кульминация многовекового освоения пустыни, туареги превратили самый негостеприимный ландшафт на земле в самый прибыльный." #NT!
 nd_air.11.a: "Золото течет на север, соль течет на юг, и мы получаем прибыль от того и другого." #NT!
 nd_air.11.b: "Пусть Агадес соперничает с Тимбукту как город обучения и торговли." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_kano_tribute: "Кано Дань" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_kano_tribute: "Сезонная дань взималась с Кано в традиционной туарегской манере: верблюжьи грузы ткани, кожи и зерна цвета индиго везли на север, в Агадес, стимулируя вербовку, но пренебрегая постоянным строительством." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_kano_garrison: "Кано Гаррисон" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_kano_garrison: "Постоянный гарнизон туарегов удерживает Кано, создавая разведывательные сети по всему Хаусаленду и ускоряя темпы боевых действий в пустыне, хотя издержки оккупации приводят к росту цен." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_eternal_raiders: "Вечные рейдеры" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_eternal_raiders: "Империя туарегов действует по древнему принципу: катайся, нападай, добывай и двигайся дальше. Войны ведутся с неутомимой инициативой, хотя наука страдает в обществе, которое ценит меч выше пера." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_desert_emperor: "Император пустыни" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_desert_emperor: "Аменокал стал настоящим императором, управляющим завоеванными народами с тактическим мастерством и сочетанием конфедеративных традиций туарегов и централизованной власти." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_saharan_middlemen: "Сахарские посредники" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_saharan_middlemen: "Туареги получают прибыль от каждой сделки на транссахарском маршруте, сокращая военные расходы и повышая престиж, хотя торговый класс не проявляет особого интереса к осадной войне." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_oasis_network: "Сеть Оазис" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_oasis_network: "Инвестиции в колодцы, путевые точки и рыночную инфраструктуру превращают суровый пустынный коридор в цепь процветающих городов-оазисов, благословленных верующими, хотя зависимость от наемных солдат растет." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_gold_and_salt: "Золото и соль" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_gold_and_salt: "Монополия туарегов на транссахарскую торговлю достигает своего апогея: культурное влияние распространяется по всему Сахелю, а дипломатический охват расширяется, хотя успех порождает опасную самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_air_dest_cosmopolitan_hub: "Космополитен Хаб" #NT!
 STATIC_MODIFIER_DESC_nd_air_dest_cosmopolitan_hub: "Агадес становится городом ученых, торговцев и ремесленников со всей Сахары и Сахеля, куда толерантность к различным вероисповеданиям привлекает дипломатов и торговцев из далеких стран." #NT!
 nd_air_war_camp: "Сахарский военный лагерь" #NT!
 nd_air_war_camp_desc: "Укрепленный плацдарм для кампаний в пустыне, где собираются воины, поят верблюдов и затачивают оружие перед великими набегами на юг." #NT!
 nd_air_war_camp_upkeep: "Условия военного лагеря" #NT!
 nd_air_war_camp_upkeep_desc: "Оружие, скот и кожа, необходимые для содержания военного лагеря и снаряжения воинов для походов в пустыню." #NT!
 nd_air_grand_caravanserai: "Большой Караван-сарай" #NT!
 nd_air_grand_caravanserai_desc: "Крупнейшая перевалочная станция на транссахарском маршруте, укрепленный комплекс складов, конюшен, колодцев и торговых кварталов, где сходятся караваны со всех направлений." #NT!
 nd_air_grand_caravanserai_upkeep: "Операции Большого Караван-сарая" #NT!
 nd_air_grand_caravanserai_upkeep_desc: "Камень, скот, соль и ткань, необходимые для содержания великого караван-сарая и снабжения великих караванов." #NT!
  
  # ===== BUREAUCRACIES ===== 
 air_agadez_sultanate_bureaucracy: "Султанат Агадес" #NT!
 air_agadez_sultanate_bureaucracy_desc: "Трон был установлен в Агадесе в 1449 году с восшествием на престол Юнуса, чужака, выбранного Итесеном, Кел Оуи и Кел Тагидда, когда их барабанные вожди не смогли договориться о султане между собой. Приказ султана действовал в самом Агадесе, в соляном собрании в Ин-Галле и в дани, причитавшейся с зависимых хаусаских городов Адара и Гобира; за стенами столицы его власть всегда была заимствована у избравших его конфедераций. Эта должность давала Аиру твердую точку исламской легитимности и признанного партнера для иностранных принцев, но каждый султан, который пытался действовать самостоятельно (как обнаружил Мухаммад аль-Мубарак в начале шестнадцатого века), был свергнут коалицией его избирателей." #NT!
 air_cure_salee_bureaucracy: "Кюр Сале Компакт" #NT!
 air_cure_salee_bureaucracy_desc: "Ежегодный конгресс у соленосных колодцев Ин-Галла и соляных равнин Тегидда-н-Тесемт, где после окончания дождей конфедерации кель-туарегов собирались, чтобы напоить свои стада, урегулировать споры, жениться между барабанными группами и утвердить султана в его должности. Каждый барабанщик приносил дань солью, финиками и животными; каждый лишился права мигрировать на север, на равнины Тамесны, в засушливый сезон. Фестиваль был рабочей конституцией Аира: ни один султан не мог его игнорировать, ни одно племя инэслемэнов не могло избежать его пошлин, и чем дольше он длился, тем труднее становилось его откладывать, поскольку сами пастушеские миграции организовывались вокруг его календаря." #NT!
 air_kel_owey_caravan_bureaucracy: "Кел Оуи Караван Компактный" #NT!
 air_kel_owey_caravan_bureaucracy_desc: "Система караван-гарантов туарегов, с помощью которой конфедерации Кел Оуэй и Кел Герес руководили, поливали и защищали огромные азалай, выращиваемые из соли и проса, между солончаками Билма и рынками хауса в Кано и Кацина, взимая взамен тивсе (караванную пошлину) с торговцев Гадамеса, Туата и Кано. Договор основывался на действующей монополии на знание пустыни: только опытный проводник-туарег мог найти воду на длительных переходах между Фачи и Билмой. Знатные люди Кел-Оуи разбогатели на этом, пастухи-имрады выполняли работу и возмущались отрубами, а караванщики-икланы несли грузы, на чьих спинах стояла система." #NT!
 air_ineslemen_tariqat_bureaucracy: "Инеслемен Тарикат" #NT!
 air_ineslemen_tariqat_bureaucracy_desc: "Сеть племен клерикально-марабутов (кел эс-сук, иберкаваны, наследники линий Альморавидов), которые стояли вне воинственно-благородного имаджегена, но внутри общества кель-туарегов. В их школах в Ассоде, Таделизе и Агадесе преподавали арабскую грамматику, маликитский фикх и литании ордена Кадирия; их судьи разрешали коммерческие споры от Тахуа до Иферуана; их рекомендательные письма открыли все рынки от Тимбукту до Мурзука. Воинская знать терпела их, потому что они приносили грамотность, легитимность и признанный нейтралитет, но возмущалась моральным авторитетом, который давало чтение и письмо." #NT!
  
 AUTO_MODIFIER_NAME_nd_air_bureaucracy_authority: "Барабан Султаната" #NT!
 AUTO_MODIFIER_DESC_nd_air_bureaucracy_authority: "Темалла (большой военный барабан, который путешествует вместе с султаном и звучит только при его вступлении на престол и по призыву конфедераций) остался в Агадесе как постоянное учреждение, а не как заемная собственность того барабанщика, который последний раз владел им. Султанат теперь может поддерживать один из постоянных институтов, с помощью которых Аир управляет собой." #NT!
