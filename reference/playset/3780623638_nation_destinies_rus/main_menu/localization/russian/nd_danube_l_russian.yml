l_russian:
  
  # ===== THE SUCCESSION OF THE DANUBE: situation surface ===== 
 nd_danube_succession: "Наследование Дуная" #NT!
 nd_danube_succession_desc: "Три короны делят одну реку, и их дома начали жениться, заключать договоры и строить планы относительно единого наследства. Перед каждым наследником в Вене, Буде или Праге теперь стоит вопрос: один дом над всеми тремя, или каждой короне своя.\n\n@arrow_bonus_tier_1! Турнирная таблица: Австрия #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_standing_hab').GetValue|0]#!, Венгрия #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_standing_hun').GetValue|0]#!, Богемия #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_standing_boh').GetValue|0]#!\n@arrow_bonus_tier_1! Угроза у ворот: #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_standing_hab').GetValue|0]0[GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_standing_hab').GetValue|0]1 из 3\n\nТурнитура и инструменты вопроса вынесены на панель." #NT!
 nd_dnb_situation_tt: "Три династии спорят, будет ли у Дуная один хозяин; положение, пакты и помолвки решают, кто может претендовать на преемственность" #NT!
 nd_dnb_standing_explain_tt: "#T Постоянные источники (пересчитываются ежемесячно)#!\n@arrow_bonus_tier_1! #G +20#! базовая, #G +20#! самая сильная корона по военной мощи (#G +10#! секунды)\n@arrow_bonus_tier_1! #G +5#! за королевский брак с другой короной, #G +10#! за каждую правящую династию\n@arrow_bonus_tier_1! #G +5#! за уровень договора, #G +5#! за ухаживаемую диету, #G +10#! за двойное обручение\n@arrow_bonus_tier_1! #G +10#! за каждый капитал короны соперника, #G0 -20#!, если корона соперника владеет вашей\n@arrow_bonus_tier_1! #G +15#! за корону уже у вас, #G0 -25#! пока под чужим хозяином" #NT!
 nd_dnb_end_fulfilled_tt: "Одно королевство владеет или объединяет все сохранившиеся короны Дуная (образуя Дунайскую монархию)." #NT!
 nd_dnb_end_sword_tt: "Максимум одна из трех корон все еще существует." #NT!
 nd_dnb_end_separate_tt: "Дело Старых Свобод одержало победу на #Y 100#! (в настоящее время: #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_cause_liberty').GetValue|0]#!), или доминирующая корона отказалась от вопроса" #NT!
 nd_dnb_end_epoch_tt: "#Y С момента открытия вопроса прошло 160#! лет (осталось около #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_epoch_years_left').GetValue|0]#!); тогда самая сильная кандидатура заявляет о своих претензиях, и книги закрываются." #NT!
 nd_dnb_legend_hab: "Австрийская кандидатура" #NT!
 nd_dnb_legend_hun: "Венгерская кандидатура" #NT!
 nd_dnb_legend_boh: "Богемная кандидатура" #NT!
 nd_dnb_legend_bound: "Связанная корона (слитая с соперником или под чужим хозяином)" #NT!
 nd_danube_succession_situation_header: "Вопрос о Дунае" #NT!
 nd_danube_succession_situation_body: "Три короны, одна река, одно спорное наследство.\n\n@arrow_bonus_tier_1! Объявите #bold позицию#!:, каждая объявленная корона служит своему делу.\n@arrow_bonus_tier_1! Причина на уровне #Y 100#! решает путь: Конгресс или отдельные пути.\n@arrow_bonus_tier_1! Диеты #bold подсчета#! сторонников; последовательности #bold тест#! пакты.\n@arrow_bonus_tier_1! #bold Постоянство#! — это вес всего: наведите курсор на число, чтобы увидеть его источники." #NT!
  
  # ===== hints ===== 
 hint_nd_danube_succession: "[GetSituationByKey('nd_danube_succession').GetNameWithNoTooltip] Подсказки" #NT!
 hint_nd_danube_succession_hint_text: "$hint_nd_danube_succession_hint_text_1$\n\n$hint_nd_danube_succession_hint_text_2$" #NT!
 hint_nd_danube_succession_hint_text_1: "Вопрос открывается, когда династическая паутина впервые сжимается: подписанный пакт, общий правящий дом, шаткая преемственность в рамках королевского брака или, самое позднее, эпоха иностранных наследств после 1437 года. Это путь В Дунайскую монархию: выиграйте ее, и требования формируемой короны встанут на свои места." #NT!
 hint_nd_danube_succession_hint_text_2: "#T Как победить#!\n@arrow_bonus_tier_2! Декларируйте свою позицию действием по своему желанию (перезарядка 3 года); Затем ваше положение ежемесячно подпитывает ваше дело, и диеты становятся лидерами. Если каждая свободная корона поддержит союз, когда он победит, Конгресс станет выборами: короны могут заключить договор без войны, и претензии падают только на корону, которая отказывается.\n@arrow_bonus_tier_2! Вступите в брак с другими коронами и #bold Предложите Erbverbruederung#!;, чтобы поднять договор до уровня 3 (или уровня 2 плюс #bold Двойное обручение#!).\n@arrow_bonus_tier_2!. Поддерживайте свой #bold на высоте#! на уровне 60 и выше: сила, браки, ухаживающие диеты и удержание соперничающих столиц — все это питает его.\n@arrow_bonus_tier_2! Когда преемственность короны партнера спотыкается (регентство, отсутствие наследника, ребенок, крах легитимности), момент предлагает свадьбу тронов или [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e]: одна выигранная война устанавливает вашего претендента без очков войны за вассализацию.\n@arrow_bonus_tier_2! претензия.\n@arrow_bonus_tier_1! Вместо этого поддержите дело #bold Старых Свобод#!, пока оно не восторжествует, или, доминируя, #bold полностью откажитесь от Вопроса#!." #NT!
  
  # ===== interactions: Propose the Erbverbruederung ===== 
 nd_dnb_propose_the_pact: "Предложить Erbverbruederung" #NT!
 nd_dnb_propose_the_pact_desc: "Предложите пакт о взаимном наследовании между двумя домами, как Рудольф и Карл подписали в 1364 году, а Фридрих и Корвин в 1463 году: если одна линия потерпит неудачу, другая наследует. Каждое принятие углубляет пакт на один уровень: от союза к договору о помолвке и к полному Erbverbruederung. Пакты основаны на королевских браках; опасность у ворот делает братьев гордыми коронами." #NT!
 dip_nd_dnb_propose_the_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS" #NT!
 nd_dnb_propose_the_pact_act: "Предложите пакт о наследовании [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_propose_the_pact_effect_text: "Пакт между двумя коронами углубляется на один уровень (заключен через несколько дней)." #NT!
 nd_dnb_propose_the_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] заключил договор о наследовании с [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_propose_the_pact_reject_effect_text: "$generic_reject_request_effect_string$" #NT!
 nd_dnb_propose_the_pact_reject_effect_text_past: "$generic_reject_request_effect_string_past$" #NT!
 PROPOSE_nd_dnb_propose_the_pact: "Связать нашу наследственность с домом $ACTOR$?\n\n$INFO$" #NT!
 INCOMING_OFFER_TITLE_nd_dnb_propose_the_pact: "Предложение потомственного братства" #NT!
 INCOMING_OFFER_nd_dnb_propose_the_pact: "$ACTOR$ предлагает Erbverbruederung: если одна из линий терпит неудачу, наследует другой дом. Свяжем ли мы свои короны?\n\n$INFO$" #NT!
 nd_dnb_pact_rm_req_tt: "Королевский брак связывает две короны (договоры основаны на браках, как и настоящие)" #NT!
 nd_dnb_pact_year_req_tt: "Год 1360 или позже (канцелярии принимают на себя потомственное братство в эпоху пакта 1364 года)" #NT!
 nd_dnb_pact_tier_cap_tt: "Пакт этой пары находится ниже уровня 3 (полный Erbverbruederung — это потолок)" #NT!
 nd_dnb_pact_rejected_tt: "Отказ является публичным; суд вспомнит издевательство" #NT!
  
  # ===== interactions: Court the Diet ===== 
 nd_dnb_court_the_diet: "Суд над Сеймом" #NT!
 nd_dnb_court_the_diet_desc: "Годовой доход в залы магнатов другой короны: Корвин купил свое избрание таким же образом. В течение десяти лет их диета помнит золото: ваш статус повышается, и ваше следующее предложение о пакте приземляется на теплые скамейки." #NT!
 dip_nd_dnb_court_the_diet_CATEGORY: "CATEGORY_INFLUENCE_ACTIONS" #NT!
 nd_dnb_court_the_diet_act: "Суд диеты [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_court_the_diet_effect_text: "Их диета соблюдается в течение десяти лет: +5 к репутации и +15 к принятию пакта." #NT!
 nd_dnb_court_the_diet_effect_text_past: "[SCOPE.sCountry('actor').GetName] придерживался диеты [SCOPE.sCountry('recipient').GetName]." #NT!
 PROPOSE_nd_dnb_court_the_diet: "Судить диету $RECIPIENT$ годовым доходом?\n\n$INFO$" #NT!
 nd_dnb_courted_applied_tt: "Их диета будет соблюдаться в течение следующих десяти лет (+5 за статус, +15 за принятие пакта)." #NT!
  
  # ===== interactions: Seal the Double Betrothal ===== 
 nd_dnb_seal_double_betrothal: "Скрепить двойную помолвку" #NT!
 nd_dnb_seal_double_betrothal_desc: "Переезд Венского конгресса 1515 года: в двух домах одновременно обещаны две свадьбы. В течение двадцати пяти лет это обещание укрепляет обе палаты, и спотыкающаяся преемственность в любой короне может быть достигнута только на основании договора о помолвке, без полного Erbverbruederung." #NT!
 dip_nd_dnb_seal_double_betrothal_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS" #NT!
 nd_dnb_seal_double_betrothal_act: "Заключите двойную помолвку с помощью [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_seal_double_betrothal_effect_text: "Двойная помолвка связывает пару на 25 лет (+10 стоящих за каждого; затем может быть наложена спотыкающаяся преемственность только на договоре о помолвке)." #NT!
 nd_dnb_seal_double_betrothal_effect_text_past: "[SCOPE.sCountry('actor').GetName] заключил двойную помолвку с [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_seal_double_betrothal_reject_effect_text: "$generic_reject_request_effect_string$" #NT!
 nd_dnb_seal_double_betrothal_reject_effect_text_past: "$generic_reject_request_effect_string_past$" #NT!
 PROPOSE_nd_dnb_seal_double_betrothal: "Обещайте нашим детям дом $ACTOR$?\n\n$INFO$" #NT!
 INCOMING_OFFER_TITLE_nd_dnb_seal_double_betrothal: "Двойная помолвка" #NT!
 INCOMING_OFFER_nd_dnb_seal_double_betrothal: "$ACTOR$ предлагает обеим палатам заключить двойную помолвку по образцу Венского конгресса. Обещаем ли мы детям?\n\n$INFO$" #NT!
 nd_dnb_betrothal_tier_req_tt: "Договор пары находится на уровне «Договор о помолвке» или выше (уровень 2+)." #NT!
 nd_dnb_betrothal_applied_tt: "Двойная помолвка связывает два дома на 25 лет." #NT!
  
  # ===== interactions: Contest the Foreign Crown ===== 
 nd_dnb_contest_foreign_crown: "Оспаривайте иностранную корону" #NT!
 nd_dnb_contest_foreign_crown_desc: "Корона Дуная находится под властью внешнего хозяина. Воспользуйтесь пактной традицией против иностранного соглашения: каждая свободная корона получает право на плененный трон. Война, которая последует за этим, будет вестись за хозяином, и ее можно вести вместе." #NT!
 dip_nd_dnb_contest_foreign_crown_CATEGORY: "CATEGORY_HOSTILE_ACTIONS" #NT!
 nd_dnb_contest_foreign_crown_act: "Оспаривайте иностранную корону более [SCOPE.sCountry('recipient').GetName]." #NT!
 nd_dnb_contest_foreign_crown_effect_text: "Каждая свободная корона Дуная получает [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] на пленной короне." #NT!
 nd_dnb_contest_foreign_crown_effect_text_past: "[SCOPE.sCountry('actor').GetName] оспорил иностранную корону с преимуществом [SCOPE.sCountry('recipient').GetName]." #NT!
 PROPOSE_nd_dnb_contest_foreign_crown: "Призовите традицию пакта против иностранного хозяина $RECIPIENT$?\n\n$INFO$" #NT!
  
  # ===== accept-reason lines ===== 
 ND_DNB_ACCEPT_BASE: "Базовое нежелание суверенного суда" #NT!
 ND_DNB_ACCEPT_MENACE: "Угроза у ворот делает братьев" #NT!
 ND_DNB_ACCEPT_WEAK: "Наша собственная преемственность колеблется" #NT!
 ND_DNB_ACCEPT_COURTED: "Их золото до сих пор блестит в нашем рационе." #NT!
 ND_DNB_ACCEPT_UNION_POSTURE: "Наш сейм выступил за профсоюзное дело" #NT!
 ND_DNB_ACCEPT_INDEPENDENCE_POSTURE: "Наша диета заявила о старых свободах" #NT!
 ND_DNB_ACCEPT_PROUD_CROWN: "Более сильный дом в спокойном мире воспринимается как хозяин, а не как брат." #NT!
 ND_DNB_ACCEPT_ZEITGEIST_UNION: "Профсоюзный дух времени несет в себе канцелярии" #NT!
 ND_DNB_ACCEPT_ZEITGEIST_LIBERTY: "Старые свободы несут канцелярии" #NT!
  
  # ===== generic actions ===== 
 nd_dnb_convene_the_diet: "Созвать сейм Трех Корон" #NT!
 nd_dnb_convene_the_diet_desc: "Призовите диеты в преддверии своего десятилетия. Собранные скамейки взвешивают заявленных покровителей стоя и вручают ведущим, вызывая всплеск: вызывайте их, пока ваша сторона впереди." #NT!
 nd_dnb_back_the_union: "Поддержите дело Союза" #NT!
 nd_dnb_back_the_union_desc: "Объявляем наш двор на один дом за рекой. Хоть и заявлено, наша репутация каждый месяц подпитывает дело Союза." #NT!
 nd_dnb_stand_for_liberties: "Встаньте за старые свободы" #NT!
 nd_dnb_stand_for_liberties_desc: "Объявите наш суд старым вольности: каждой короне своя. Хоть и объявлено, наша репутация каждый месяц подпитывает Старые Свободы." #NT!
 nd_dnb_honor_the_league: "Честь Лиге" #NT!
 nd_dnb_honor_the_league_desc: "Другое лицо пакта: когда османы начинают войну с партнером по пакту, лига может перейти к обороне. Что бы ни говорили диеты о союзе, короны не смотрят, как тонут друг друга." #NT!
 nd_dnb_league_peace_tt: "Наша корона в мире" #NT!
 nd_dnb_league_no_wars: "@trigger_no! Ни один из партнеров по пакту не защищается от османов" #NT!
 nd_dnb_stance_ready_tt: "Наш суд не изменил своей позиции за последние 3 года" #NT!
 nd_dnb_not_already_union_tt: "Наш суд еще не поддерживает дело Союза" #NT!
 nd_dnb_not_already_liberty_tt: "Наш суд уже не поддерживает старые вольности." #NT!
 nd_dnb_stance_union_applied_tt: "Наш суд поддерживает дело Союза (снова может быть изменено через 3 года)" #NT!
 nd_dnb_stance_liberty_applied_tt: "Наш двор выступает за старые свободы (снова меняется через 3 года)" #NT!
 nd_dnb_convene_ready_tt: "Наш суд не принуждал к ранней диете за последние 5 лет." #NT!
 nd_dnb_convene_global_tt: "Ни один королевский сейм за последние 5 лет нигде не собирался." #NT!
 nd_dnb_convene_applied_tt: "Короны созваны; следующая регулярная диета будет через десять лет" #NT!
 nd_dnb_renounce_the_question: "Откажись от вопроса" #NT!
 nd_dnb_renounce_the_question_desc: "Закройте книгу об объединении корон с позиции доминирования: ничего не остается на усмотрение суда. Каждая корона держит свой дом, гордо; пакты запрещены на протяжении целого поколения." #NT!
 nd_dnb_renounce_req_tt: "Ваш рейтинг 60 или выше, тогда как оба соперника имеют рейтинг 40 или ниже." #NT!
 nd_dnb_renounce_applied_tt: "Выбраны Отдельные Пути: ситуация заканчивается, и каждая корона своя." #NT!
  
  # ===== events ===== 
 nd_danube.1.t: "Вопрос о Дунае" #NT!
 nd_danube.1.d: "Все начинается, как и обычно, с пергамента и обручального кольца. Дома среднего Дуная начали говорить о наследстве через границы друг друга: договоры о наследственном братстве, обручения, заключенные двойными парами, адвокаты, которые могут превратить корону в приданое. Вена, Буда и Прага видят одну и ту же истину с трех престолов: одна река, три короны и рано или поздно один вопрос.\n\nНаш суд должен решить, какое лицо показать сеймам." #NT!
 nd_danube.1.a: "Добивайтесь объединения корон." #NT!
 nd_danube.1.b: "Наша корона стоит особняком." #NT!
 nd_danube.1.c: "Пусть суды говорят первыми." #NT!
 nd_danube.10.t: "Диета трех корон" #NT!
 nd_danube.10.d.union: "Состояния дунайских корон собрались, пересчитали свои скамьи, и союзная партия вынесла зал. Дело одного дома набирает силу." #NT!
 nd_danube.10.d.liberty: "Состояния дунайских корон собрались, сосчитали свои скамейки, и старые вольности вынесли зал. Причина отдельных коронок получает все большее распространение." #NT!
 nd_danube.10.d.hung: "Поместья дунайских корон собирались и закрывались без вынесения приговора: скамьи были разделены слишком поровну или слишком пусты, чтобы их можно было вынести по любому поводу." #NT!
 nd_danube.10.a: "Диета сказала свое слово." #NT!
 nd_danube.11.t: "Пакт скреплен" #NT!
 nd_danube.11.d: "Инструменты обмениваются, печати снимаются: наш дом и их дом связаны на одну ступень ближе в порядке наследования. Законники называют это потомственным братством; диеты называют это, в зависимости от скамьи, страховкой или петлей. В любом случае, теперь это пергамент с зубами." #NT!
 nd_danube.11.a: "От этого дом становится сильнее." #NT!
 nd_danube.12.t: "Австрийское правопреемство терпит неудачу" #NT!
 nd_danube.12.d: "Сообщение из Вены: австрийский трон шатается. Регентство, пустая колыбель, легитимность, ставящаяся под сомнение в залах, где создавался Привилегий. Чего бы ни стоил пергамент наших договоров, больше всего он ценен именно в этот час: в нашем дворе шевелится свадебное торжество, и юристы уже развернули документы о наследовании." #NT!
 nd_danube.12.a: "Женитесь на тронах." #NT!
 nd_danube.12.b: "Призовите пакт." #NT!
 nd_danube.12.c: "Момент проходит." #NT!
 nd_danube.13.t: "Венгерское правопреемство терпит неудачу" #NT!
 nd_danube.13.d: "Сообщение из Буды: корона Святого Стефана свободно сидит. Регентство, король без наследника, сейм, уже подсчитывающий голоса, о котором его не просили. Наши договоры с Венгерским домом были подписаны именно на этот час, и каждый двор на реке знает это." #NT!
 nd_danube.13.a: "Женитесь на тронах." #NT!
 nd_danube.13.b: "Призовите пакт." #NT!
 nd_danube.13.c: "Момент проходит." #NT!
 nd_danube.14.t: "Богемская преемственность спотыкается" #NT!
 nd_danube.14.d: "Сообщение из Праги: преемственность в Богемии колеблется. Избиратели королевства Золотой Быки перешептываются о неопределенном наследнике, а документы пакта в нашем архиве стали больше походить на дорогу, а не на пергамент. Она идет прямо к Градщину." #NT!
 nd_danube.14.a: "Женитесь на тронах." #NT!
 nd_danube.14.b: "Призовите пакт." #NT!
 nd_danube.14.c: "Момент проходит." #NT!
 nd_danube.15.t: "Пакт применяется против нас" #NT!
 nd_danube.15.d: "Соперничающий двор развернул старые инструменты преемственности против нашего спотыкающегося трона и настоял на своем: посредством пакта, брака, арифметики наследования мы претендуем на нашу корону. Сейм может бросить им вызов на коронационном холме, или совет может спокойно добиваться условий и надеяться, что армия истца будет медленнее, чем его адвокаты." #NT!
 nd_danube.15.a: "Бросьте им вызов с коронационного холма." #NT!
 nd_danube.15.b: "Ищите условия спокойно." #NT!
 nd_danube.16.t: "Дело также переходит к нам" #NT!
 nd_danube.16.d: "Борьба за плененную корону открыта, и по традиции речного договора право притязаний переходит к каждому свободному дому Дуная, включая и наше. Иностранный господин не отдаст корону за письмо." #NT!
 nd_danube.16.a: "Мы держим дело." #NT!
 nd_danube.17.t: "Иностранная рука на австрийской короне" #NT!
 nd_danube.17.d: "Австрия перешла под иностранный союз: внешний хозяин теперь говорит от имени одной из трех корон реки. На вопрос о Дунае никогда не предполагалось, что ответ будет получен из-за границы, и каждый свободный человек на реке знает, какой прецедент это создает." #NT!
 nd_danube.17.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.17.b: "Это не может стоять." #NT!
 nd_danube.18.t: "Иностранная рука на венгерской короне" #NT!
 nd_danube.18.d: "Венгрия перешла под иностранный союз: корона Святого Стефана теперь подчиняется внешнему хозяину. Такое уже случалось раньше, и речные суды помнят, как трудно было это исправить." #NT!
 nd_danube.18.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.18.b: "Это не может стоять." #NT!
 nd_danube.19.t: "Иностранная рука на чешской короне" #NT!
 nd_danube.19.d: "Богемия перешла под власть иностранного союза: царством Золотой Быки владеет внешний хозяин. Свободные короны Дуная должны решить, остается ли им еще отвечать на этот вопрос." #NT!
 nd_danube.19.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.19.b: "Это не может стоять." #NT!
 nd_danube.31.t: "Австрийская корона погасла" #NT!
 nd_danube.31.d: "Больше нет Австрии, за которой можно было бы ухаживать, жениться или перехитрить: королевство на верхнем Дунае полностью вышло из династического мира, и какой бы властью ни обладала Вена, теперь она не подчиняется никакому сейму и не устраивает никаких свадьб. Вопрос сужается до оставшихся корон." #NT!
 nd_danube.31.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.31.b: "Сомкните ряды." #NT!
 nd_danube.32.t: "Венгерская корона погасла" #NT!
 nd_danube.32.d: "У короны святого Стефана не осталось носителя, который мог бы ответить за это: королевство полностью вышло из династического мира, и какая бы власть ни принадлежала Буде, теперь она не подчиняется ни диете, ни свадьбам. Вопрос сужается до оставшихся корон." #NT!
 nd_danube.32.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.32.b: "Сомкните ряды." #NT!
 nd_danube.33.t: "Чешская корона погашена" #NT!
 nd_danube.33.d: "Царство Золотой Быки полностью вышло из династического мира: какая бы власть ни принадлежала Праге, теперь она не отвечает ни на диете, ни на свадьбе. Вопрос сужается до оставшихся корон." #NT!
 nd_danube.33.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.33.b: "Сомкните ряды." #NT!
 nd_danube.34.t: "Конгресс приветствует Австрию" #NT!
 nd_danube.34.d: "Дело союза восторжествовало, и собравшиеся суды назвали Австрию знаменосцем одного дома над рекой. Инструменты одобрения предъявляют претензии против каждой короны, которая стоит особняком, и нашей среди них. То, что Вена называет честью, наша канцелярия воспринимает как вызов." #NT!
 nd_danube.34.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.34.b: "Наша корона не принадлежит им." #NT!
 nd_danube.35.t: "Конгресс приветствует Венгрию" #NT!
 nd_danube.35.d: "Дело профсоюза восторжествовало, и собравшиеся суды назвали Венгрию знаменосцем одного дома над рекой. Инструменты одобрения предъявляют претензии против каждой короны, которая стоит особняком, и нашей среди них. То, что Буда называет честью, наша канцелярия воспринимает как вызов." #NT!
 nd_danube.35.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.35.b: "Наша корона не принадлежит им." #NT!
 nd_danube.36.t: "Конгресс приветствует Богемию" #NT!
 nd_danube.36.d: "Дело профсоюзов восторжествовало, и собравшиеся суды назвали Богемию знаменосцем одного дома над рекой. Инструменты одобрения предъявляют претензии против каждой короны, которая стоит особняком, и нашей среди них. То, что Прага называет честью, наша канцелярия воспринимает как вызов." #NT!
 nd_danube.36.a: "Обратите на это внимание и подождите." #NT!
 nd_danube.36.b: "Наша корона не принадлежит им." #NT!
 nd_danube.37.t: "Конгресс созывает короны" #NT!
 nd_danube.37.d: "Профсоюзное дело восторжествовало, и все суды на реке высказались в его поддержку, а собравшиеся сеймы провозгласили наш дом знаменосцем. Никаких претензий и призывов к войне не будет: коронам предлагается заключить договор по собственной воле, как когда-то чешские сословия избирали короля, а не терпели его. Их ответы поступят в нашу канцелярию." #NT!
 nd_danube.37.a: "Пусть диеты говорят." #NT!
 nd_danube.37.a.tt: "Каждая свободная корона теперь выбирает: войти в договор под нашим домом или отказаться и предъявить наши претензии." #NT!
 nd_danube.38.t: "Выборы Дуная" #NT!
 nd_danube.38.d: "Дело профсоюзов восторжествовало, и все суды высказались за него, и Конгресс провозгласил Австрию. Призыв требует от нашей короны заключить договор по своей воле: наша диета и наши законы сохраняются, наше знамя рядом с их, один дом над рекой. Отказ разрывает одобрение, и к нам будет предъявлен иск." #NT!
 nd_danube.38.a: "Введите компакт." #NT!
 nd_danube.38.b: "Наша корона не принадлежит им." #NT!
 nd_danube.39.t: "Выборы Дуная" #NT!
 nd_danube.39.d: "Дело профсоюзов восторжествовало, и все суды высказались за него, и Конгресс провозгласил Венгрию. Призыв требует от нашей короны заключить договор по своей воле: наша диета и наши законы сохраняются, наше знамя рядом с их, один дом над рекой. Отказ разрывает одобрение, и к нам будет предъявлен иск." #NT!
 nd_danube.39.a: "Введите компакт." #NT!
 nd_danube.39.b: "Наша корона не принадлежит им." #NT!
 nd_danube.40.t: "Выборы Дуная" #NT!
 nd_danube.40.d: "Дело профсоюзов восторжествовало, и все суды высказались за него, и Конгресс провозгласил Богемию. Призыв требует от нашей короны заключить договор по своей воле: наша диета и наши законы сохраняются, наше знамя рядом с их, один дом над рекой. Отказ разрывает одобрение, и к нам будет предъявлен иск." #NT!
 nd_danube.40.a: "Введите компакт." #NT!
 nd_danube.40.b: "Наша корона не принадлежит им." #NT!
 nd_danube.20.t: "Один дом над Дунаем" #NT!
 nd_danube.20.d: "Это сделано. Благодаря свадьбе, договору, терпению и, там, где иссяк пергамент, мечу, каждая корона среднего Дуная теперь подчиняется одному дому: нашему. Вопрос, открытый несколько поколений назад, закрывается нашей печатью внизу, и канцеляриям Европы потребуются новые карты и новые манеры." #NT!
 nd_danube.20.a: "Одна река, один дом." #NT!
 nd_danube.21.t: "Вопрос, решаемый мечом" #NT!
 nd_danube.21.d: "Вопрос о Дунае закрыт не свадьбой или пактом, а исчезновением: из трех корон, которые когда-то делили реку, до сих пор существует только одна. Документы адвокатов попадают в архив непрочитанными. Меч не нуждался в генеалогии." #NT!
 nd_danube.21.a: "Река помнит." #NT!
 nd_danube.22.t: "Отдельные пути" #NT!
 nd_danube.22.d: "Диеты говорили дважды, последний брак распался, последний договор истек неподписанным. Короны Дуная решили остаться тремя: гордыми, отчетливыми и покончившими с вопросом. Адвокаты опечатывают архивы; суды впервые за поколение говорят о другом." #NT!
 nd_danube.22.a: "Каждая корона своя." #NT!
 nd_danube.22.a.tt: "Каждая выжившая корона получает 25 лет $STATIC_MODIFIER_NAME_nd_dnb_proud_crown$, а договоры блокируются на 30 лет." #NT!
 nd_danube.23.t: "Эпоха вынесена приговором" #NT!
 nd_danube.23.d: "Сто шестьдесят лет договоров, свадеб, диет и полуобнаженных мечей, а за рекой до сих пор нет ни одного дома. Эпоха закрывается: канцелярии в последний раз подсчитывают турнирную таблицу, и наша оказывается сильнейшей. То, что остается в вопросе, остается за нами: либо давить на него, либо отложить на полку." #NT!
 nd_danube.23.a: "Претензии наши." #NT!
 nd_danube.23.a.tt: "Мы удерживаем [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] на каждой выжившей короне соперника." #NT!
 nd_danube.25.t: "Складка закрывается" #NT!
 nd_danube.25.d: "Две короны Дуная стали теперь одним домом: кандидатура перешла во владения соперника, и трехсторонний вопрос превратился в дуэль. Оставшимся свободным дворам следует внимательно прочитать новую арифметику: сомкнувшаяся на них складка может сомкнуться и на нас." #NT!
 nd_danube.25.a: "Дуэль начинается." #NT!
 nd_danube.26.t: "Конгресс Дуная" #NT!
 nd_danube.26.d: "Профсоюзное дело переросло канцелярии, которые его вскормили. Диеты, браки и пакты объединили амбиции реки в один дом, и собравшиеся суды назвали ее знаменосцем: наш. То, что юристы называют аккламацией, остальные короны будут считать вызовом." #NT!
 nd_danube.26.a: "Река выбрала." #NT!
 nd_danube.26.a.tt: "Каждый договор нашего дома соответствует договору о помолвке, и мы сохраняем права на корону каждого свободного соперника." #NT!
 nd_danube.26.a_tt: "Признанный защитник дела профсоюзов продвигается вперед с договорами и требованиями." #NT!
 nd_danube.27.t: "Вена заявляет" #NT!
 nd_danube.27.d.union: "Австрийский суд выступил в поддержку профсоюза: его вес теперь питает мечту о одном доме над рекой." #NT!
 nd_danube.27.d.liberty: "Австрийский двор высказался за старые свободы: его вес теперь разделяет короны." #NT!
 nd_danube.27.a: "Отмеченный." #NT!
 nd_danube.27.a_tt: "Репутация Австрии ежемесячно подкрепляет заявленное ею дело." #NT!
 nd_danube.28.t: "Буда заявляет" #NT!
 nd_danube.28.d.union: "Венгерский суд выступил в поддержку профсоюза: его вес теперь питает мечту о доме над рекой." #NT!
 nd_danube.28.d.liberty: "Венгерский двор выступил за старые свободы: его вес теперь разделяет короны." #NT!
 nd_danube.28.a: "Отмеченный." #NT!
 nd_danube.28.a_tt: "Репутация Венгрии ежемесячно подкрепляет заявленное ею дело." #NT!
 nd_danube.29.t: "Прага заявляет" #NT!
 nd_danube.29.d.union: "Богемский суд выступил в поддержку профсоюза: его вес теперь питает мечту о доме над рекой." #NT!
 nd_danube.29.d.liberty: "Богемский двор высказался за прежние свободы: его вес теперь разъединяет короны." #NT!
 nd_danube.29.a: "Отмеченный." #NT!
 nd_danube.29.a_tt: "Репутация Богемии ежемесячно подпитывает заявленное ею дело." #NT!
 nd_danube.30.t: "Шумы в суде" #NT!
 nd_danube.30.d: "Профсоюзный вопрос никогда не дремлет. В этом сезоне это специалист по генеалогии с удобной картой, фракция магнатов, пьющая за «одну реку, одну корону», брошюру против иностранных мастеров, прибитую к церковной двери. Мелкие вещи; но диеты движут мелочами." #NT!
 nd_danube.30.a: "Пусть сторона брака говорит." #NT!
 nd_danube.30.b: "Заставьте замолчать профсоюзные разговоры." #NT!
  
  # ===== option hover lines ===== 
 nd_danube.1.a_tt: "Заявляйте о профсоюзном деле с первого дня." #NT!
 nd_danube.1.b_tt: "Заявляйте о старых свободах; диеты будут держать линию." #NT!
 nd_danube.1.c_tt: "Пока ничего не предпринимайте; позы могут меняться на каждой диете." #NT!
 nd_danube.10.a_tt: "Ведущая причина набирает обороты; следующая регулярная диета состоится через десять лет." #NT!
 nd_danube.11.a_tt: "Уплотнения прессуются; пакт этой пары стоит на один уровень глубже." #NT!
 nd_danube.12.a_tt: "Свадьба двух правителей; закон общих престолов сделает все остальное." #NT!
 nd_danube.12.b_tt: "Продвигайте пакт как заявление о войне: одна выигранная война устанавливает нашу линию в Вене." #NT!
 nd_danube.12.c_tt: "Пусть эта преемственность пройдет незамеченной." #NT!
 nd_danube.13.a_tt: "Свадьба двух правителей; короны следуют за кольцом." #NT!
 nd_danube.13.b_tt: "Продвигайте пакт как заявление о войне: одна выигранная война устанавливает нашу линию в Буде." #NT!
 nd_danube.13.c_tt: "Пусть эта преемственность пройдет незамеченной." #NT!
 nd_danube.14.a_tt: "Свадьба двух правителей; короны следуют за кольцом." #NT!
 nd_danube.14.b_tt: "Выдвигайте пакт как заявление о войне: одна выигранная война устанавливает нашу линию в Праге." #NT!
 nd_danube.14.c_tt: "Пусть эта преемственность пройдет незамеченной." #NT!
 nd_danube.15.a_tt: "Публичное неповиновение укрепляет трон дома." #NT!
 nd_danube.15.b_tt: "Условия молчания стоят лица, но позволяют выиграть время." #NT!
 nd_danube.16.a_tt: "Иск находится в нашей канцелярии рядом с их." #NT!
 nd_danube.17.a_tt: "Смотри и запоминай." #NT!
 nd_danube.17.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.18.a_tt: "Смотри и запоминай." #NT!
 nd_danube.18.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.19.a_tt: "Смотри и запоминай." #NT!
 nd_danube.19.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.31.a_tt: "Смотри и запоминай." #NT!
 nd_danube.31.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.32.a_tt: "Смотри и запоминай." #NT!
 nd_danube.32.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.33.a_tt: "Смотри и запоминай." #NT!
 nd_danube.33.b_tt: "Направьте наш суд на сторону профсоюза." #NT!
 nd_danube.34.a_tt: "Смотри и запоминай." #NT!
