 nd_dnb_cause_explain_tt: "#T Причины#!\nEach, объявленные короной, питают свою причину пропорционально ее положению; Угроза у ворот питает дело Союза; неустраненная причина медленно угасает. Диеты, ведущие к лидерству, вызывают всплеск #Y +10#!.\n\n@arrow_bonus_tier_1! В #Y 50#! дело влияет на канцелярию: пакт предлагает землю на #G теплее#! в соответствии с духом союза, на #R холоднее#! в условиях свобод.\n@arrow_bonus_tier_2! #!\nEach0 Старых Свобод#! в #Y 100#! закрывают вопрос: Отдельные пути.\n@arrow_bonus_tier_2! #!\nEach0 Союзное Дело#! в #Y 100#! созывает #!\nEach0 Дунайский Конгресс#!: его сильнейший покровитель провозглашается, получает право на корону каждого свободного соперника, и каждый пакт прославленных становится договором о помолвке." #NT!
 nd_dnb_panel_levers_header: "Инструменты вопроса" #NT!
 nd_dnb_panel_levers_body: "#T На других коронах#!\n@arrow_bonus_tier_2! #bold Предложите Erbverbruederung#!: углубить договор на один градус.\n@arrow_bonus_tier_2! #bold Судите Сейм#!: золота сейчас, скамейки теплее на десять лет.\n@arrow_bonus_tier_2! #bold Заключите двойное обручение#!: нажмите спотыкание на компактном уровне.\n@arrow_bonus_tier_2! #bold Оспаривайте Иностранную Корону#!: иск против внешнего хозяина.\n\n#T Дома#!\n@arrow_bonus_tier_2! #bold Верните Союз#!\n@arrow_bonus_tier_2!3 или #bold отстаивайте Старые Свободы#!\n@arrow_bonus_tier_2!3, по желанию.\n@arrow_bonus_tier_2! #bold Честь Лигу#!: присоединяйтесь к защите партнера по пакту от османов.\n@arrow_bonus_tier_2! #bold Созовите Сейм#!\n@arrow_bonus_tier_2!3, пока ваша сторона впереди.\n@arrow_bonus_tier_2! #bold Отказаться от доминирования Вопроса#!\n@arrow_bonus_tier_2!3.\n\n#T Когда трон споткнётся#!\n@arrow_bonus_tier_2!3\n@arrow_bonus_tier_1! Свадьба престолов, или претензии: уровень договора #bold4 3#!\n@arrow_bonus_tier_2!3 (#bold4 2#!\n@arrow_bonus_tier_2!3 с помолвкой) и положение #bold4 60#!\n@arrow_bonus_tier_2!3." #NT!
