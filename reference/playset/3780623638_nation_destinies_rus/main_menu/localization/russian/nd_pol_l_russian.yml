l_russian:
 STATIC_MODIFIER_NAME_nd_pol_golden_liberty: "Золотая Свобода" #NT!
 STATIC_MODIFIER_DESC_nd_pol_golden_liberty: "Золотая свобода шляхты дает каждому дворянину равный голос в Сейме. Религиозные инакомыслящие находят убежище под этим широким куполом толерантности, а законодательный орган бурлит от энергичных дебатов, хотя собственная власть Короны склоняется перед волей собравшегося дворянства." #NT!
 STATIC_MODIFIER_NAME_nd_pol_piast_legacy: "Наследие Пястов" #NT!
 STATIC_MODIFIER_DESC_nd_pol_piast_legacy: "Вспоминая память королей Пястов, объединивших польские земли, Корона вновь подтверждает свою власть над капризной знатью. Королевские чиновники обеспечивают соблюдение королевского указа от Кракова до маршей, создавая дисциплинированное государство, хотя шляхта ворчит по поводу ущемления их прерогатив." #NT!
 nd_pol.1.t: "Корона Польши" #NT!
 nd_pol.1.d: "Белый орел вновь возвышается над объединенным Польским королевством. От шпилей Кракова до равнин Мазовии польские земли подчиняются одной короне. Но какое это должно быть королевство?\n\nШляхта, многочисленная и гордая польская знать, уже давно заявляет о равном голосе в управлении королевством. Их традиция золотой свободы обещает религиозную терпимость, парламентскую силу и королевство, где даже самый скромный джентльмен сможет определять судьбу нации. Однако та же самая свобода может парализовать государство, когда необходимы решительные действия.\n\nВ качестве альтернативы Корона может обратиться к древним королям Пястов, которые правили твердой рукой и превратили Польшу из разрозненных племен в великое христианское королевство. Централизованная власть, профессиональное управление и королевская дисциплина могут создать инструмент власти, хотя и ценой благородной доброй воли.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pol.1.a: "Пусть каждый дворянин говорит свободно в Сейме!" #NT!
 nd_pol.1.b: "Слово короля будет законом от Кракова до маршей." #NT!
 nd_pol_piast_reunification: "Воссоединение Пястов" #NT!
 nd_pol_piast_reunification_desc: "Многовековая борьба династии Пястов за воссоединение разрозненных польских герцогств сформировала традицию дипломатического брака, переговоров и терпеливой консолидации, которая определяет польский подход к управлению государством." #NT!
 nd_pol_wieliczka_salt: "Соляные шахты в Величке" #NT!
 nd_pol_wieliczka_salt_desc: "Королевские соляные копи в Величке и Бохне являются одними из величайших сокровищ Европы. Эти огромные подземные галереи, приносящие треть доходов Короны, управляются королевской монополией, а их «белое золото» финансирует амбиции Польши." #NT!
 nd_pol_nihil_novi: "Нихил Нови" #NT!
 nd_pol_nihil_novi_desc: "Акт 1505 года Nihil Novi nisi commune consensu («Ничего нового без общего согласия») закрепляет принцип, согласно которому ни один закон не может быть принят без согласия Сейма, что делает польский парламент равноправной ветвью власти наряду с Короной." #NT!
 nd_pol_sukiennice_trade: "Торговые залы Сукеннице" #NT!
 nd_pol_sukiennice_trade_desc: "Большой Краковский Суконный ряд доминирует над Главной рыночной площадью, его аркады эпохи Возрождения защищают оживленную торговлю тканями, специями, шелком, солью и свинцом. Сукеннице — коммерческое сердце польской городской жизни." #NT!
 nd_pol_obrona_potoczna: "Оброна Поточная" #NT!
 nd_pol_obrona_potoczna_desc: "Первая постоянная военная сила Польши, «Оброна Поточна», «текущая оборона», была создана около 1500 г. для охраны юго-восточной границы от татарских набегов. Эти финансируемые Короной кавалерийские патрули стали зародышем постоянной армии." #NT!
 nd_pol_crown_arsenal: "Краун Арсенал" #NT!
 nd_pol_crown_arsenal_desc: "Королевские арсеналы, арсеналы Короны, хранят и производят оружие, доспехи и боеприпасы, которыми оснащаются профессиональные армии Польши. Эти укрепленные арсеналы позволяют быстро собрать хорошо оснащенные силы." #NT!
 nd_pol_vistula_flotilla: "Вислинская речная флотилия" #NT!
 nd_pol_vistula_flotilla_desc: "Польская речная и прибрежная флотилия патрулирует подходы к Висле и Балтийскому морю, защищая жизненно важную торговлю зерном и обеспечивая скромный, но растущий военно-морской потенциал для традиционно ориентированной на сухопутную державу." #NT!
 nd_pol_sukiennice: "Сукеннице" #NT!
 nd_pol_sukiennice_desc: "Большой суконный зал и торговая биржа в польском стиле, где купцы собираются для торговли тканями, специями и предметами роскоши под пассажами эпохи Возрождения." #NT!
 nd_pol_kopalnia_soli: "Копальня Соли" #NT!
 nd_pol_kopalnia_soli_desc: "Королевская соляная шахта действовала под монополией Короны и добывала «белое золото», которое пополняет казну Польши и удовлетворяет ненасытный спрос Европы на соль." #NT!
 nd_pol_zbrojownia: "Збройовния" #NT!
 nd_pol_zbrojownia_desc: "Укрепленный королевский арсенал, хранящий оружие, доспехи и боеприпасы. Эти арсеналы Короны позволяют быстро экипировать как профессиональных солдат, так и рекрутов." #NT!
 a_nd_pol_obrona_potoczna: "Оброна Поточная" #NT!
 a_nd_pol_obrona_potoczna_desc: "Оплачиваемая короной пограничная кавалерия патрулирует юго-восточную границу Польши. Быстрые и дисциплинированные разведчики обучены перехватывать татарских налетчиков, прежде чем они смогут проникнуть вглубь королевства." #NT!
 nd_pol_cloth_exchange_pm: "Обмен ткани" #NT!
 nd_pol_cloth_exchange_pm_desc: "Оживленная торговля тканями, красками, бумажными записями и солью поддерживает коммерческую деятельность Сукенниц." #NT!
 nd_pol_salt_extraction_pm: "Добыча соли" #NT!
 nd_pol_salt_extraction_pm_desc: "Добыча каменной соли в глубоких подземных галереях, добыча польского «белого золота» для внутреннего использования и экспорта." #NT!
 nd_pol_arsenal_upkeep_pm: "Арсенал Операции" #NT!
 nd_pol_arsenal_upkeep_pm_desc: "Обслуживание и производство оружия, огнестрельного оружия, кожаной экипировки и изделий из железа в королевском арсенале." #NT!
 nd_pol_formed_tt: "Польша была образована." #NT!
 nd_pol_path_a_tt: "Выбрал Золотую Свободу" #NT!
 nd_pol_path_b_tt: "Выбрать «Наследие Пястов»" #NT!
 nd_pol_destiny: "Судьба Польши" #NT!
 nd_pol_destiny_desc: "Белый орел поднялся над Соединенным королевством. Теперь вопрос не в том, выживет ли Польша, а в том, какую форму примет ее величие. Стабилизируйте королевство и наметьте курс на будущее." #NT!
 nd_pol.2.t: "Судьба Белого Орла" #NT!
 nd_pol.2.d: "Польша едина и стабильна, ее основы надежны. Выбор, который мы сделаем сейчас, определит, воспарит ли белый орел над содружеством свободных народов или над королевством, выкованным железом и дисциплиной. Наша судьба – писать." #NT!
 nd_pol.2.a: "Польша выстоит. Теперь позвольте ей процветать." #NT!
 nd_pol_dest_sejm: "Триумф Сейма" #NT!
 nd_pol_dest_sejm_desc: "Установить Сейм как высший законодательный орган королевства. Развивать торговлю солью в Польше через рынок капитала и использовать современные банковские учреждения для финансирования парламентского государства." #NT!
 nd_pol.3.t: "Восходящий Сейм" #NT!
 nd_pol.3.d: "Сейм стал бьющимся сердцем польского правительства. Соляное богатство течет через наши рынки капитала, банкиры открывают свои бухгалтерские книги, и каждый дворянин, от величайшего магната до беднейшего шляхтича, может высказать свое мнение в палате. «Золотая свобода» — это не просто лозунг; это закон страны." #NT!
 nd_pol.3.a: "Ничего нового без общего согласия!" #NT!
 nd_pol_dest_confederation: "Варшавская Конфедерация" #NT!
 nd_pol_dest_confederation_desc: "Обеспечьте безопасность Гданьска и его балтийских торговых путей для Короны. Используйте печатный станок, чтобы распространять знания и терпимость по всему миру, закладывая основы многоэтнической конфедерации." #NT!
 nd_pol.4.t: "Варшавская Конфедерация" #NT!
 nd_pol.4.d: "Благодаря тому, что Гданьск находится под властью Короны, а печатный станок распространяет идеи быстрее, чем когда-либо, Польша стала маяком толерантности в Европе, раздираемой религиозными войнами. Варшавская Конфедерация провозглашает, что ни один человек не будет преследоваться за свою веру: радикальное обещание, которое привлекает торговцев, ученых и беженцев к нашим берегам. Как мы будем развивать это наследие?" #NT!
 nd_pol.4.a: "Пусть балтийская торговля обогатит нашу конфедерацию." #NT!
 nd_pol.4.b: "Пусть преследуемые найдут здесь убежище." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_baltic_merchants: "Балтийская коммерция" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_baltic_merchants: "Купцы Гданьска направляют прибыль от балтийского зерна, янтаря и древесины через торговые сети Содружества, хотя поддержание этой коммерческой империи обременяет военные бюджеты." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_religious_haven: "Святилище Вер" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_religious_haven: "Евреи, протестанты, унитарии и православные стекаются к толерантным берегам Содружества, принося с собой знания и мастерство, хотя старые военные традиции в мирное время ржавеют." #NT!
 nd_pol_dest_republic: "Корона Содружества" #NT!
 nd_pol_dest_republic_desc: "Объедините литовскую и польскую короны в истинное содружество народов. Достигните превосходства в мировой торговле, развивайте королевство сверх всех ожиданий и докажите, что республика дворян может соперничать с любым королевством." #NT!
 nd_pol.5.t: "Рес Публика" #NT!
 nd_pol.5.d: "То, что началось как союз корон, превратилось в нечто, чего никто не мог предвидеть: настоящую республику наций. Поляки, литовцы, русины и многие другие участвуют в управлении величайшим парламентским государством, которое когда-либо знала Европа. Мировые торговые пути доставляют польское зерно и литовскую древесину в каждый порт. Ученые свободно дискутируют в залах Кракова. Это Речь Посполитая, Речь Посполитая, подобного которой история еще не знала." #NT!
 nd_pol.5.a: "Золотой век обучения и процветания!" #NT!
 nd_pol.5.b: "Мы наследники возрожденной Сарматии!" #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_golden_age: "Польский золотой век" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_golden_age: "Содружество вступает в эпоху беспрецедентного культурного и экономического расцвета. Развитие ускоряется, производство растет, а здания возводятся по всему королевству с меньшими затратами." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_sarmatian_ideal: "Сарматский идеал" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_sarmatian_ideal: "Шляхта использует свое мифическое сарматское наследие, создавая уникальную благородную культуру доблести, свободы и жестокой независимости, которая на протяжении веков формировала польскую идентичность." #NT!
 nd_pol_dest_silesia: "Мелиорация Силезии" #NT!
 nd_pol_dest_silesia_desc: "Верните древние земли Пястов в Силезии. Захватите Вроцлав и Ополе, исторические центры польских герцогств, утраченных под сюзеренитетом Богемии, и восстановите военную мощь Короны." #NT!
 nd_pol.6.t: "Силезские герцогства восстановлены" #NT!
 nd_pol.6.d: "Вроцлав и Ополе (города, основанные князьями Пястов, которыми веками управляли польские князья, прежде чем попасть под владычество Богемии) снова летают под белым орлом. Завоевание Силезии демонстрирует, что централизованная Корона обладает военной мощью для реализации своих древних притязаний. Наследие Пястов живо." #NT!
 nd_pol.6.a: "Силезия возвращается под власть Польской Короны!" #NT!
 nd_pol_dest_eastern_march: "Восточные марки" #NT!
 nd_pol_dest_eastern_march_desc: "Проецируйте королевскую власть глубоко на восток. Захватите Львов и Смоленск, ключи от Малороссии и российских границ, сохранив при этом казну и армию, необходимые для удержания этих огромных завоеваний." #NT!
 nd_pol.7.t: "Восточная граница" #NT!
 nd_pol.7.d: "Польские знамена развеваются над высоким замком Львова и древними стенами Смоленска. Восточные границы (обширная граница лесов, рек и спорных пограничных территорий) теперь подчиняются Короне. Но удержание этих завоеваний требует выбора: укрепим ли мы границу от всех желающих или интегрируем эти русинские земли в ткань королевства?" #NT!
 nd_pol.7.a: "Укрепите каждую переправу и горный перевал." #NT!
 nd_pol.7.b: "Теперь это польские земли. Интегрируйте их." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_frontier_fortifications: "Кресиские укрепления" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_frontier_fortifications: "Сеть пограничных укреплений вдоль восточных границ сдерживает вторжение и обескровливает нападающих, хотя военная направленность отвлекает ресурсы от добычи сырья." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_ruthenia_integration: "Русинская интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_ruthenia_integration: "Польские администраторы, поселенцы и учреждения расширяют королевский контроль над завоеванными русинскими территориями, обращаясь и ассимилируясь, хотя престиж подрывается при таком быстром расширении." #NT!
 nd_pol_dest_piast_crown: "Корона Пястов" #NT!
 nd_pol_dest_piast_crown_desc: "Завершите мечту Пяста. Разгромите Тевтонский орден, взяв Кенигсберг, захватите Киев как ворота в южные степи и постройте военную монархию, которая будет доминировать в Восточной Европе от Балтийского до Черного моря." #NT!
 nd_pol.8.t: "Железная Корона Пястов" #NT!
 nd_pol.8.d: "Кенигсберг пал. Киев преклоняет колени перед белым орлом. От берегов Балтийского моря до черноморских степей — земли, которыми когда-то мечтали править князья Пястов, теперь подчиняются единой польской короне. Это не тихая республика дебатов шляхты: это королевство, выкованное из железа, удерживаемое дисциплиной и расширяющееся силой. Древняя мечта династии Пястов о великой польской монархии, простирающейся от моря до моря, наконец-то реализована." #NT!
 nd_pol.8.a: "Железо и дисциплина сдержат то, что мы выиграли." #NT!
 nd_pol.8.b: "Управляйте этой империей твердой, но умелой рукой." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_iron_crown: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_iron_crown: "Огромные армии Короны созданы в традициях королей-воинов Пястов. Быстрое восстановление, дешевые подкрепления и проецирование подавляющих сил сокрушают любое сопротивление." #NT!
 STATIC_MODIFIER_NAME_nd_pol_dest_imperial_administration: "Королевская администрация" #NT!
 STATIC_MODIFIER_DESC_nd_pol_dest_imperial_administration: "Профессиональная королевская бюрократия управляет обширными польскими владениями, подавляя сепаратизм и способствуя процветанию посредством эффективного централизованного правления." #NT!
 nd_pol_trybunaly: "Трибуналы Коронне" #NT!
 nd_pol_trybunaly_desc: "Королевский трибунал: высший апелляционный суд Содружества, в котором избранные благородные судьи разрешают споры и поддерживают законы Сейма. Символ правления по согласию." #NT!
 nd_pol_hetmanat: "Гетманат" #NT!
 nd_pol_hetmanat_desc: "Военный штаб гетмана, где старший военачальник Короны координирует кампании, собирает рекруты и поддерживает арсенал централизованной польской военной машины." #NT!
 nd_pol_tribunal_operations_pm: "Администрация Трибунала" #NT!
 nd_pol_tribunal_operations_pm_desc: "Клерки, судьи и чиновники, обслуживающие Верховный суд Содружества, потребляют бумагу, юридические книги, прекрасную ткань и мебель." #NT!
 nd_pol_hetman_supply_pm: "Гетманский интендант" #NT!
 nd_pol_hetman_supply_pm_desc: "Интендантский корпус снабжал гетманскую армию оружием, кожгалантереей, боевыми конями и обмундированием." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_pol_bureaucracy_authority: "Польская Коронная власть" #NT!
 AUTO_MODIFIER_DESC_nd_pol_bureaucracy_authority: "Воссозданное Польское королевство унаследовало институциональный вес правления Пястов и Ягеллонов, предоставив два бюрократических места для формализации постоянных государственных органов королевства." #NT!
  
 pol_statuty_kazimierzowskie_bureaucracy: "Статуя Казимежовские" #NT!
 pol_statuty_kazimierzowskie_bureaucracy_desc: "Юридические кодексы Казимежа Великого, Вислицкий статут для Малой Польши (1346 г.) и Петркувский статут для Великой Польши (1347 г.), были первым всеобъемлющим писаным законом Польского королевства. Королевские судьи использовали кодексы для применения единых правил по всему воеводству, положив конец разрозненности регионального обычного права и обязав дворянство подчиняться королевским судам. Традиция вспоминает Казимежа как короля, который «нашел Польшу деревянной, а оставил ее каменной»: статуты были основой, на которую был положен этот камень." #NT!
  
 pol_wojewoda_kasztelan_bureaucracy: "Воеводове и Каштеланове" #NT!
 pol_wojewoda_kasztelan_bureaucracy_desc: "Унаследованная от эпохи раздела Пястов, территориальная система разделила королевство на воеводство под управлением воевод, которые собирали региональные сборы, и кастелани, сосредоточенные на укрепленных замках, принадлежащих кастелянам с полицией и судебной властью. Обе должности были заполнены представителями местной знати, сочетая королевское командование с прерогативой магната. Краковский воевода имел преимущество над всеми остальными, занимая первое место среди сенаторов королевства." #NT!
  
 pol_urzedy_koronne_bureaucracy: "Урзенды Коронне" #NT!
 pol_urzedy_koronne_bureaucracy_desc: "Пять великих королевских канцелярий: Маршалек Вельки (придворный маршал), Канцлерц (канцлер печати), Подканцлержи (вице-канцлер), Подскарби Коронный (казначей) и с 1503 года гетман Вельки (великий полководец) сохранялись пожизненно и не могли быть отозваны. Королевское по имени и благородное на практике, пожизненное пребывание в должности делало увольнение практически невозможным: офицера, плохо себя ведшего, можно было проигнорировать, но никогда не уволить. Эта договоренность обеспечила преемственность королевства за счет привязки аппарата короны к кланам магнатов, заполнявшим офисы." #NT!
  
 pol_sejmiki_bureaucracy: "Сеймики Зиемские" #NT!
 pol_sejmiki_bureaucracy_desc: "С конца XIV века в каждой земье было свое собрание всех обеспеченных дворян. Сеймики проверяли местные налоги, избирали посланников в Сейм и, что особенно важно, связывали своих делегатов письменными инструкциями — instrukcje poselskie. Депутат не мог голосовать против мандата своего сеймика. Сеймы превратили шляхту в постоянный политический класс, закрепившийся на местах задолго до того, как великий сейм XVI века дал ей национальный голос." #NT!
  
 pol_akademia_krakowska_bureaucracy: "Академия Краковска" #NT!
 pol_akademia_krakowska_bureaucracy_desc: "Основанная Казимежем III в 1364 году как Studium Generale по образцу Болоньи, Краковская академия была вновь основана в 1400 году королевой Ядвигой и ее мужем Владиславом II Ягелло с полным богословским факультетом, обеспеченным драгоценностями королевы. Его мастера снабжали королевскую канцелярию грамотными юристами, обучали соборное духовенство и сделали каноническое право рабочей профессией. Николай Коперник учился здесь в 1490-х годах; то же самое сделали и канцлеры, которые разработали проект Constitutio Nihil Novi." #NT!
  
 pol_starostwa_bureaucracy: "Староства" #NT!
 pol_starostwa_bureaucracy_desc: "Староству представляли собой королевские округа, которыми управлял староста, назначаемый королем. Староста grodowy обладал ius Gladii (правом смертного приговора) в пределах своего староства, исполняя приказ короля против магнатского святилища. Система старостей была клинком короны против дворянского иммунитета, и великие семьи так и не примирились с ней: привилегия Червинска (1422 г.) и Нешавский статут (1454 г.) были отчасти попытками шляхты ограничить то, что могла сделать старость." #NT!
  
 pol_lanowy_cadastre_bureaucracy: "Лан Кадастр" #NT!
 pol_lanowy_cadastre_bureaucracy_desc: "Землемеры Короны измеряли крестьянские владения в стандартизированных ланских единицах (франкских или фламандских, в зависимости от региона) и вносили их в королевский кадастр. После регистрации холдинг должен был платить регулярный Podatek łanowy (фиксированный налог на лан), периодически утверждаемый Сеймом. Кадастр позволял Казимежу III и ягеллонцам заменять случайные военные сборы предсказуемыми доходами, но каждое обследование все теснее привязывало крестьян к земле, с которой они сравнивались, и последующие законы превратили эту регистрацию в наследственную привязанность." #NT!
