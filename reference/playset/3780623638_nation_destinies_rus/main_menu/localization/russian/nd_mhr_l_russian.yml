l_russian:
 STATIC_MODIFIER_NAME_nd_ganimi_kava: "Ганими Кава" #NT!
 STATIC_MODIFIER_DESC_nd_ganimi_kava: "Искусство партизанской войны, усовершенствованное Шиваджи Махараджем: быстрые удары с крепостей на холмах, засады на горных перевалах и беспощадное преследование значительно превосходящих сил. Скорость, местность и смелость заменяют численность и тяжелую броню." #NT!
 STATIC_MODIFIER_NAME_nd_hindavi_swarajya: "Хиндави Свараджья" #NT!
 STATIC_MODIFIER_DESC_nd_hindavi_swarajya: "Мечта об индуистском самоуправлении, которую Шиваджи провозгласил на своей коронации в Райгаде: независимое государство, управляемое собственным народом, управляемое через совет Аштапрадхана и поддерживаемое преданностью жителей страны, говорящей на маратхи." #NT!
 nd_mhr.1.t: "Маратха Свараджья" #NT!
 nd_mhr.1.d: "Декан дрожит. То, что началось как неповиновение единственному вождю Бхонсле, превратилось в то, чего падишахи Великих Моголов и султаны Биджапура никогда не могли себе представить: суверенное государство маратхов, созданное в крепостях на холмах Западных Гат и крещенное кровью сотен засад. Коронация в Райгаде дала этой новой нации корону, но остается более трудный вопрос: что это будет за нация? Останемся ли мы быстрыми захватчиками холмов, мастерами ганими кавы, способными обескровить любую империю? Или мы построим институты управления, которые превратят воинственное королевство в прочную цивилизацию?\n\n#bold Этот выбор откроет путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mhr.1.a: "Мы тень в горах." #NT!
 nd_mhr.1.b: "Мы построим королевство для всех маратхов." #NT!
 nd_mhr.2.t: "Святые Пути Варкари" #NT!
 nd_mhr.2.d: "От берегов Индраяни к храму Витоба в Пандхарпуре каждый год течет река паломников: босоногие фермеры, гончары и ткачи, поющие на ходу абханги Днянешвара и Тукарама. Движение Варкари сделало то, чего не смогла сделать ни одна армия: оно дало народу маратхи общую духовную идентичность, выходящую за рамки касты и деревни. Стихи Тукарама заявляют, что преданность не знает рождения, а Днянешвари Днянешвари сделал мудрость Бхагавад-гиты доступной на языке простых людей. Это движение можно рассматривать как духовную основу нашего государства или направить в качестве силы социальных реформ и повышения грамотности." #NT!
 nd_mhr.2.a: "Пандхарпур станет нашим духовным сердцем." #NT!
 nd_mhr.2.b: "Святые учат нас, что все касты равны перед Богом." #NT!
 nd_mhr.3.t: "Искусство Ганими Кава" #NT!
 nd_mhr.3.d: "Пока великие армии Империи Великих Моголов маршируют тяжелыми колоннами по равнинам Декана, наши бойцы исчезают в складках Западных Гат, словно муссонный туман. Шиваджи Махарадж усовершенствовал искусство ганими кава: партизанской войны, которая превращает каждое ущелье в место засады, каждое укрепление на холме — в неприступное убежище, а каждую безлунную ночь — в поле битвы. В Пратапгаде силы маратхов уничтожили армию Афзал-хана. В Синхагаде люди Танаджи Малусаре в темноте взобрались на отвесные скалы, чтобы захватить крепость, которую Моголы считали неприступной. Это не отдельные победы; это военная доктрина, которая будет определять войну маратхов на протяжении поколений." #NT!
 nd_mhr.3.a: "Горы – наша крепость, а ночь – наш союзник." #NT!
 nd_mhr.4.t: "Конфедерация маратхов" #NT!
 nd_mhr.4.d: "При пешвах государство маратхов превратилось в нечто беспрецедентное: конфедерацию могущественных домов, каждый из которых командует своими армиями и территориями, но связанных общей преданностью Чатрапати и мечтой о Хиндави Свараджье. Холкары владеют Индором, Сциндия командуют Гвалиором, Гэквады управляют Бародой, а Бхонсалес правят Нагпуром. Вместе они вытеснили власть маратхов из Декана к воротам самого Дели. Кавалерийские набеги Баджи Рао унизили императора Великих Моголов в его собственной столице. Но сам этот успех поднимает вопрос: должны ли мы более крепко связать эти великие дома под властью пешвы или дать им свободу расширяться по своему усмотрению?" #NT!
 nd_mhr.4.a: "Единство под руководством пешвы будет нашей силой." #NT!
 nd_mhr.4.b: "Пусть каждый сардар несет наше знамя к новым горизонтам." #NT!
 nd_mhr.5.t: "Европейские методы и оружие маратхов" #NT!
 nd_mhr.5.d: "Прибытие европейских держав на побережье Индии принесло больше, чем просто торговые товары и миссионеров: оно принесло новые методы ведения войны. Обученная в Европе пехота, полевая артиллерия и фортификационные методы доказали свою разрушительную эффективность против традиционных армий. Маратхи, всегда прагматичные, начали приспосабливаться. Французские авантюристы, такие как Бенуа де Буань, обучали пехоту маратхов европейским упражнениям, а кузнецы маратхов научились отливать пушки европейского типа в тофханах Пуны и Сатары. Вопрос в том, принимаем ли мы эти иностранные методы полностью или выборочно перенимаем то, что служит нам, сохраняя при этом наши отличительные кавалерийские традиции." #NT!
 nd_mhr.5.a: "Модернизируйте армию европейским оружием и строевой подготовкой." #NT!
 nd_mhr.5.b: "Изучите европейцев. И использовать против них свои же методы." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_bhakti_devotion: "Свет Пандхарпура" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_bhakti_devotion: "Преданный пыл паломничества Варкари объединяет маратхи общей верой и культурной гордостью." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_bhakti_reform: "Кастовая слепая преданность" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_bhakti_reform: "Радикальный эгалитаризм святых-бхакти разрушает социальные барьеры и распространяет грамотность посредством народной религиозной поэзии." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_confederacy_unity: "Возвышение пешвы" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_confederacy_unity: "Великие дома маратхов объединены под административной властью пешвы, образуя единую конфедерацию." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_confederacy_expansion: "Освобожденные маратхские всадники" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_confederacy_expansion: "Сардары Конфедерации действуют независимо, неся власть маратхов во все уголки субконтинента." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_european_arms: "Модернизация Тофханы" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_european_arms: "Европейская артиллерийская и пехотная подготовка была принята на вооружение повсеместно, превратив армию маратхов в современную боевую силу." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_european_diplomacy: "Играем в Большую Игру" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_european_diplomacy: "Дипломаты маратхов изучают европейские методы государственного управления, разведки и создания альянсов, чтобы обратить против них собственные инструменты колонизаторов." #NT!
 nd_mhr_yadava_heritage: "Ядава Наследие" #NT!
 nd_mhr_yadava_heritage_desc: "Маратхи ведут свою родословную от династии Ядава, правившей Деканом от Девагири. Это древнее наследие обеспечивает легитимность и традицию кавалерийской войны на всем плато." #NT!
 nd_mhr_warkari_devotion: "Преданность Варкари" #NT!
 nd_mhr_warkari_devotion_desc: "Традиция паломничества Варкари в Пандхарпур, поддержанная абхангами таких святых, как Днянешвар и Намдев, формирует общую духовную идентичность среди народа маратхи." #NT!
 nd_mhr_deccan_agriculture: "Деканское сельское хозяйство" #NT!
 nd_mhr_deccan_agriculture_desc: "Черные хлопковые почвы плато Декана и сезонные муссонные дожди поддерживают своеобразную сельскохозяйственную систему, основанную на выращивании проса, бобовых и хлопка." #NT!
 nd_mhr_marathi_literary_tradition: "Литературная традиция маратхи" #NT!
 nd_mhr_marathi_literary_tradition_desc: "«Днянешвари» и другие произведения на языке маратхи создают грамотную культуру, превосходящую элиту, получившую образование на санскрите, привнося философию и управление простым людям." #NT!
 nd_mhr_western_ghats_mastery: "Мастерство Западных Гат" #NT!
 nd_mhr_western_ghats_mastery_desc: "Пересеченная местность Западных Гат (крутые ущелья, густые леса и узкие перевалы) является естественной крепостью народа маратхи, и они научились передвигаться по ней так, как не может посторонний." #NT!
 nd_mhr_gadkot_tradition: "Гадкотская традиция" #NT!
 nd_mhr_gadkot_tradition_desc: "Традиция строительства укреплений на холмах и хребтах Западных Гат создает сеть неприступных опорных пунктов, гадов, которые закрепляют военную мощь маратхов." #NT!
 nd_mhr_mavla_hillmen: "Мавла Хиллмены" #NT!
 nd_mhr_mavla_hillmen_desc: "Мавлы — это выносливая пехота из региона Мавал в Западных Гатах, опытная в боях на холмах, в засадах и ночных набегах. Они составляют ядро ​​партизанской армии Шиваджи." #NT!
 nd_mhr_ganimi_kava_tactics: "Ганими Кава Тактикс" #NT!
 nd_mhr_ganimi_kava_tactics_desc: "Совершенство Шиваджи в партизанской войне, ганими кава, превращает Западные Гаты в смертельную ловушку для обычных армий посредством засад, ночных набегов и притворного отступления." #NT!
 nd_mhr_ashtapradhan_council: "Совет Аштапрадхана" #NT!
 nd_mhr_ashtapradhan_council_desc: "Совет восьми министров (Пешва, Аматья, Сачив, Мантри, Сенапати, Сумант, Ньяядиш и Пандитрао) обеспечивает административную основу штата маратхов." #NT!
 nd_mhr_coronation_traditions: "Коронационные традиции" #NT!
 nd_mhr_coronation_traditions_desc: "Церемония коронации в Райгаде, проведенная в соответствии с ведическими обрядами, провозглашает Чхатрапати суверенным индуистским королем: прямой вызов господству Великих Моголов над Деканом." #NT!
 nd_mhr_deccan_trade_routes: "Торговые пути Декана" #NT!
 nd_mhr_deccan_trade_routes_desc: "Великие торговые пути, соединяющие побережье Конкан с внутренними районами Декана, доставляют хлопок, специи и ткани, что делает центр маратхов центром коммерческой деятельности.\n\n#italic Доступно в: $nd_mhr_koshti_karkhana$#!" #NT!
 nd_mhr_fort_network: "Сеть Фортов" #NT!
 nd_mhr_fort_network_desc: "Систематическое строительство и обслуживание крепостей на холмах в Западных Гатах создает взаимосвязанную оборонительную сеть, в которой каждый форт поддерживает своих соседей." #NT!
 nd_mhr_konkan_naval_power: "Конканская военно-морская мощь" #NT!
 nd_mhr_konkan_naval_power_desc: "Под руководством таких адмиралов, как Канходжи Ангре, флот маратхов доминирует на побережье Конкан от Сурата до юга Мумбаи, используя быстрые галливаты и захваты, чтобы бросить вызов даже европейским морским державам." #NT!
 nd_mhr_shiledar_system: "Система Шилдар" #NT!
 nd_mhr_shiledar_system_desc: "Шиледарская кавалерийская система, при которой всадники предоставляют своих скакунов и оружие в обмен на ежемесячное жалованье, создает самостоятельные силы рейдеров легкой кавалерии." #NT!
 nd_mhr_chauth_system: "Система Чаут" #NT!
 nd_mhr_chauth_system_desc: "Чаут, сбор в размере одной четверти общего дохода, собираемого с соседних территорий, становится финансовой основой государства маратхов и мощным инструментом политического контроля." #NT!
 nd_mhr_abhang_poetry: "Абханг Поэзия" #NT!
 nd_mhr_abhang_poetry_desc: "Благочестивые стихи Тукарама и других святых-поэтов-бхакти, написанные на повседневном языке маратхи, создают корпус литературы, который дает простым людям доступ к духовным и философским идеям." #NT!
 nd_mhr_coastal_raiding: "Прибрежные рейды" #NT!
 nd_mhr_coastal_raiding_desc: "В военно-морской тактике маратхов упор делается на быстрые и маневренные корабли, которые приближаются с кормы, чтобы избежать артиллерийских залпов, а затем садятся на вражеские корабли в ожесточенном рукопашном бою.\n\n#italic Доступно в: $nd_mhr_angre_shipyard$#!" #NT!
 nd_mhr_peshwa_rise: "Возвышение Пешва" #NT!
 nd_mhr_peshwa_rise_desc: "Должность пешвы, первоначально главного министра Аштапрадхана, постепенно становится настоящим центром власти в штате маратхов, производя блестящих администраторов и генералов." #NT!
 nd_mhr_bargir_cavalry: "Баргирская кавалерия" #NT!
 nd_mhr_bargir_cavalry_desc: "В отличие от самовооруженных шилэдаров, кавалеристы баргиров получают лошадей и оружие от государства, что создает более дисциплинированные и централизованно управляемые кавалерийские силы." #NT!
 nd_mhr_peshwa_bureaucracy: "Пешва Бюрократия" #NT!
 nd_mhr_peshwa_bureaucracy_desc: "Администрация пешвы в Пуне развивает сложную бюрократическую систему с подробным ведением учета, стандартизированным сбором доходов и профессиональными администраторами." #NT!
 nd_mhr_confederacy_structure: "Структура Конфедерации" #NT!
 nd_mhr_confederacy_structure_desc: "Конфедерация маратхов превращается в федеральную систему, в которой могущественные дома (Холкар, Сциндия, Гэквад и Бхонсале) управляют обширными территориями, признавая при этом номинальное превосходство Чхатрапати." #NT!
 nd_mhr_grab_warships: "Захват военных кораблей" #NT!
 nd_mhr_grab_warships_desc: "«Граб», более крупное и более тяжеловооруженное судно, чем галливат, служит основой флота маратхов: он способен вступать в бой с европейскими кораблями на более равных условиях." #NT!
 nd_mhr_sardeshmukhi_rights: "Права Сардешмукхи" #NT!
 nd_mhr_sardeshmukhi_rights_desc: "Сардешмукхи, дополнительный десятипроцентный сбор сверх чаута, утверждает претензии правителя маратхов как наследственного главы всех дешмукхов по всему Декану." #NT!
 nd_mhr_deccan_cotton_trade: "Декан Хлопок Трейд" #NT!
 nd_mhr_deccan_cotton_trade_desc: "Черные хлопковые почвы Декана производят один из лучших в Индии хлопка-сырца, питая процветающую текстильную промышленность, которая экспортирует ткани через торговый мир Индийского океана." #NT!
 nd_mhr_european_military_methods: "Европейские военные методы" #NT!
 nd_mhr_european_military_methods_desc: "Прагматичное внедрение европейских военных методов (полевая артиллерия, пехотная тренировка и современные укрепления) преображает армию маратхов, не отказываясь от кавалерийских традиций.\n\n#italic Доступно в: $nd_mhr_tophkhana$#!" #NT!
 nd_mhr_gardis_bodyguard: "Телохранитель Гардиса" #NT!
 nd_mhr_gardis_bodyguard_desc: "Гарди — это элитный корпус телохранителей, обученный по европейским методам, служащий личной охраной пешвы и ударными отрядами в генеральных сражениях." #NT!
 nd_mhr_territorial_administration: "Территориальное управление" #NT!
 nd_mhr_territorial_administration_desc: "По мере того как территория маратхов расширяется по всему субконтиненту, правительство пешвы разрабатывает системы управления отдаленными провинциями, назначения депутатов и поддержания контроля над обширными гарнизонами." #NT!
 nd_mhr_maratha_resilience: "Маратхская устойчивость" #NT!
 nd_mhr_maratha_resilience_desc: "Даже после катастрофы при Панипате в 1761 году маратхи перегруппировались и восстановились в течение десятилетия, отвоевав Дели и восстановив контроль над большей частью Индии: свидетельство глубины военного и административного потенциала маратхов." #NT!
 nd_mhr_konkan_trade_network: "Торговая сеть Конкан" #NT!
 nd_mhr_konkan_trade_network_desc: "Порты побережья Конкан, контролируемые маратхами, превращаются в процветающую коммерческую сеть, связывающую внутренние сельскохозяйственные районы с морскими торговыми путями Индийского океана." #NT!
 nd_mhr_maval_militia_reform: "Реформа милиции Мавал" #NT!
 nd_mhr_maval_militia_reform_desc: "Опираясь на традиции горцев мавла, реформы стандартизируют набор местных ополченцев, обеспечивая стабильные поставки обученных солдат из центральной части Западных Гат." #NT!
 nd_mhr_modern_artillery: "Современная артиллерия" #NT!
 nd_mhr_modern_artillery_desc: "Литейные заводы маратхов в Пуне и Сатаре производят современные полевые орудия, а обученные артиллеристы учатся использовать их по-европейски: это далеко от грубых бомбардировщиков предыдущих столетий." #NT!
 nd_mhr_last_peshwa_reforms: "Последние реформы пешвы" #NT!
 nd_mhr_last_peshwa_reforms_desc: "На закате Конфедерации маратхов окончательные административные реформы направлены на централизацию власти и оптимизацию управления, пытаясь соответствовать институциональной эффективности британцев." #NT!
 nd_mhr_maratha_identity: "Маратхская идентичность" #NT!
 nd_mhr_maratha_identity_desc: "Наследие Шиваджи, поэзия святых-бхакти и столетия самоуправления создают особую культурную самобытность маратхи, которая выходит за рамки политической жизни империи." #NT!
 nd_mhr_fortress_modernization: "Модернизация крепости" #NT!
 nd_mhr_fortress_modernization_desc: "Древние городища на холме Гад модернизированы современными бастионами, огневыми точками и оборонительными сооружениями в европейском стиле, чтобы противостоять артиллерийским обстрелам." #NT!
 nd_mhr_industrial_deccani: "Промышленный Декан" #NT!
 nd_mhr_industrial_deccani_desc: "Минеральные богатства Декана, производство хлопка и традиции квалифицированных ремесленников создают основу для раннего промышленного развития.\n\n#italic Доступно в: $nd_mhr_tophkhana$#!" #NT!
 nd_mhr_deccan_independence: "Независимость Декана" #NT!
 nd_mhr_deccan_independence_desc: "Кульминация многовекового правления маратхов: самодостаточное государство Декана со своими собственными институтами, экономикой и культурной самобытностью, независимое от внешнего господства." #NT!
 a_nd_mhr_mavla: "Мавла Хиллмены" #NT!
 a_nd_mhr_mavla_desc: "Отважная пехота из региона Мавал в Западных Гатах, эксперты в горных боях, ночных рейдах и партизанской войне. Они составляют основу доктрины ганими кава Шиваджи." #NT!
 a_nd_mhr_shiledar: "Шиледарская кавалерия" #NT!
 a_nd_mhr_shiledar_desc: "Самостоятельно оснащенная легкая кавалерия, предоставляющая собственных лошадей и оружие. Быстрый, независимый и опытный в рейдах в глубоком тылу врага." #NT!
 a_nd_mhr_bargir: "Баргирская кавалерия" #NT!
 a_nd_mhr_bargir_desc: "Кавалерия, экипированная государством, получающая скакунов и оружие от правительства. Более дисциплинированные, чем шилдары, они служат тяжелым ударным оружием армии маратхов." #NT!
 a_nd_mhr_gardis: "Гардис" #NT!
 a_nd_mhr_gardis_desc: "Элитная пехота-телохранитель, обученная европейским военным методам. Профессиональные солдаты, которые служат личной охраной пешвы и ударными отрядами в генеральных сражениях." #NT!
 n_nd_mhr_gallivat: "Галливат" #NT!
 n_nd_mhr_gallivat_desc: "Небольшой, быстрый прибрежный военный корабль с веслами и одной мачтой, с экипажем от пятидесяти до шестидесяти человек. Используется для абордажных операций, прибрежных рейдов и преследования более крупных европейских судов." #NT!
 n_nd_mhr_grab: "Схватить" #NT!
 n_nd_mhr_grab_desc: "Более крупный военный корабль маратхов водоизмещением до четырехсот тонн, вооруженный пушками и перевозящий более сотни членов экипажа. Способен поражать европейские корабли в ближнем бою." #NT!
 nd_mhr_gad: "Гад" #NT!
 nd_mhr_gad_desc: "Укрепление на вершине холма, построенное на крутых хребтах Западных Гат. Его командное положение, отвесные подходы и толстые каменные стены делают его практически неприступным для нападения." #NT!
 nd_mhr_chauth_kacheri: "Чаут Качери" #NT!
 nd_mhr_chauth_kacheri_desc: "Налоговое управление, которое управляет сбором чаута, одной четверти доходов территории, от имени правителя маратхов." #NT!
 nd_mhr_warkari_math: "Варкари Математика" #NT!
 nd_mhr_warkari_math_desc: "Монастырь, связанный с традицией религиозного паломничества Варкари. Центры обучения бхакти, поэзии абханга и коллективного поклонения Витхобе." #NT!
 nd_mhr_tophkhana: "Тофхана" #NT!
 nd_mhr_tophkhana_desc: "Артиллерийский литейный завод по производству пушек и огнестрельного оружия европейского образца. В штате работают квалифицированные мастера по металлу, и их часто контролируют иностранные консультанты." #NT!
 nd_mhr_angre_shipyard: "Верфь Ангре" #NT!
 nd_mhr_angre_shipyard_desc: "Военно-морская верфь на побережье Конкан, построенная в традициях адмирала Канходзи Ангре, производящая галливаты и грейферы, которые доминируют на западном побережье Индии." #NT!
 nd_mhr_peshwa_daftar: "Пешва Дафтар" #NT!
 nd_mhr_peshwa_daftar_desc: "Административная канцелярия правительства пешвы, ведущая подробный учет доходов, военного размещения и дипломатической переписки." #NT!
 nd_mhr_gad_upkeep: "Хилл Форт Гарнизон" #NT!
 nd_mhr_gad_upkeep_desc: "Камень для стен, оружие для защитников и кожа для снаряжения и снаряжения для поддержания укреплений на вершине холма и их гарнизона." #NT!
 nd_mhr_kacheri_upkeep: "Управление доходами" #NT!
 nd_mhr_kacheri_upkeep_desc: "Бумага для отчетов о доходах и корреспонденции, ткань для официальных печатей и одежды, а также соль как стандартное средство административного обмена." #NT!
 nd_mhr_math_upkeep: "Содержание монастыря" #NT!
 nd_mhr_math_upkeep_desc: "Бумага для религиозных текстов и стихов абханга, ткань для одежд паломников и пчелиный воск для ламп, которые горят перед изображением Витобы." #NT!
 nd_mhr_tophkhana_upkeep: "Литейное производство" #NT!
 nd_mhr_tophkhana_upkeep_desc: "Железо, медь и оружие отливают в артиллерийские орудия в литейном цехе." #NT!
 nd_mhr_shipyard_upkeep: "Операции на военно-морской верфи" #NT!
 nd_mhr_shipyard_upkeep_desc: "Древесина и военно-морские материалы для строительства корпусов и такелажа, а также инструменты для мастеров, которые строят и ремонтируют галливаты и грейферы флота Конкан." #NT!
 nd_mhr_daftar_upkeep: "Канцелярские операции" #NT!
 nd_mhr_daftar_upkeep_desc: "Бумага для объемистых отчетов администрации пешвы, тонкая ткань для официальной обстановки и церемониального использования, а также книги в качестве справочных материалов для обученных администраторов." #NT!
 nd_mhr_cotton_weaving_pm: "Хлопковое ткачество Деккани" #NT!
 nd_mhr_cotton_weaving_pm_desc: "Ткань Декана красят и ткут в изысканные ткани, которые ценятся в торговой сети Индийского океана." #NT!
 nd_mhr_arms_workshop_pm: "Оружейная мастерская маратхов" #NT!
 nd_mhr_arms_workshop_pm_desc: "Кузнецы-маратхи куют железо и переделывают трофейное оружие в огнестрельное для растущей армии." #NT!
 a_nd_mhr_silahdar: "Силахдар" #NT!
 a_nd_mhr_silahdar_desc: "Реформированная пехота ополчения, набранная из высокогорья Мавал, обученная в улучшенных формированиях и оснащенная стандартным оружием, установленным государством." #NT!
 a_nd_mhr_field_gun: "Полевая пушка маратхов" #NT!
 a_nd_mhr_field_gun_desc: "Современная полевая артиллерия, отлитая на литейных заводах маратхов, укомплектованная обученными артиллеристами и способная вести продолжительные бомбардировки в европейском стиле." #NT!
 nd_mhr_bastion_fort: "Бастион Форт" #NT!
 nd_mhr_bastion_fort_desc: "Модернизированное укрепление, сочетающее традиционную позицию маратхского гада на вершине холма со звездными бастионами в европейском стиле и наклонными огневыми точками." #NT!
 nd_mhr_koshti_karkhana: "Кошти Кархана" #NT!
 nd_mhr_koshti_karkhana_desc: "Ткацкая мастерская, где каста Кошти производит изысканные хлопчатобумажные ткани Декана. Хлопок из центра Маратхов ценился в торговой сети Индийского океана." #NT!
 nd_mhr_loom_upkeep: "Ткацкие операции" #NT!
 nd_mhr_loom_upkeep_desc: "Древесина для изготовления и ремонта ткацких станков, волокнистые культуры в качестве сырья для прядения и инструменты для обслуживания ткацкого оборудования." #NT!
 nd_mhr_bastion_upkeep: "Обслуживание Бастиона" #NT!
 nd_mhr_bastion_upkeep_desc: "Камень для наклонных бастионов, оружие для огневых точек и инструменты для ремонта оборонительных сооружений в европейском стиле." #NT!
 nd_mhr_naval_provisioning_pm: "Военно-морское снабжение" #NT!
 nd_mhr_naval_provisioning_pm_desc: "Военно-морские запасы и древесина для рейдового флота маратхов, а также смола для конопатки корпусов в суровом Конканском море." #NT!
 nd_mhr_deccan_manufactory_pm: "Деканская мануфактура" #NT!
 nd_mhr_deccan_manufactory_pm_desc: "Мастерские Декана перерабатывают железо и ткань в готовое оружие для внутреннего использования и на экспорт." #NT!
 levy_nd_mhr_silahdar: "Силахдар Леви" #NT!
 levy_nd_mhr_silahdar_desc: "Реформированные солдаты ополчения, призванные из центра Западных Гат, экипированные и обученные государством." #NT!
 levy_nd_mhr_bargir: "Баргирский кавалерийский отряд" #NT!
 levy_nd_mhr_bargir_desc: "Кавалеристы, экипированные государством, набирались из солдатского и дворянского населения, вооружались и ехали верхом за государственный счет." #NT!
 levy_nd_mhr_mavla: "Мавла Хиллмен Леви" #NT!
 levy_nd_mhr_mavla_desc: "Выносливые горцы из Западных Гат, призванные в качестве рекрутской пехоты, опытные в тактике засад и ведении боевых действий на пересеченной местности." #NT!
 nd_mhr_formed_tt: "Маратхи были сформированы" #NT!
 nd_mhr_path_a_tt: "Выбрал Ганими Кава" #NT!
 nd_mhr_path_b_tt: "Выбрал Хиндави Свараджья" #NT!
 nd_mhr_destiny: "Судьба маратха" #NT!
 nd_mhr_destiny_desc: "Когда Декан объединился под знаменем маратхов, путь вперед расходится. Свараджья стоит на перепутье между мечом и плугом, между завоеваниями и цивилизацией." #NT!
 nd_mhr_dest_deccan_lord: "Лорд Декана" #NT!
 nd_mhr_dest_deccan_lord_desc: "Обеспечьте безопасность западных подступов, захватив Сурат, и прорвитесь в малва, взяв Гвалиор. Имея в руках эти опорные пункты, ни одна армия не сможет угрожать центру маратхов." #NT!
 nd_mhr_dest_northern_march: "Северный марш" #NT!
 nd_mhr_dest_northern_march_desc: "Баджи Рао проехал до ворот Дели и обратно за один поход. Теперь сделайте его постоянным: установите флаг маратхов в Дели и обеспечьте безопасность плато малва через Удджайн." #NT!
 nd_mhr_dest_hindu_pad_padshahi: "Индуистский Пад Падшахи" #NT!
 nd_mhr_dest_hindu_pad_padshahi_desc: "Мечта об индуистской империи, простирающейся от Декана до Пенджаба. Возьмите Агру и Лахор, командуйте величайшей армией на субконтиненте и претендуйте на титул, который когда-то принадлежали Моголам." #NT!
 nd_mhr_dest_swaraj_foundation: "Основание Свараджа" #NT!
 nd_mhr_dest_swaraj_foundation_desc: "Прежде чем маратхи смогут построить прочную цивилизацию, они должны развивать свои земли и использовать современные финансовые институты. Увеличивайте благосостояние Декана и развивайте банковское дело." #NT!
 nd_mhr_dest_deccani_prosperity: "Деккани Процветание" #NT!
 nd_mhr_dest_deccani_prosperity_desc: "Распространите систему чаутов на Гуджарат, взяв Бароду, наполните казну и обеспечьте поток деканского хлопка через рынки столицы. Богатство – это основа самоуправления." #NT!
 nd_mhr_dest_deccani_golden_age: "Золотой век Деккани" #NT!
 nd_mhr_dest_deccani_golden_age_desc: "Постройте цивилизацию, способную соперничать с любой другой на Земле: Декан с грамотными гражданами, процветающими рынками и культурными традициями, живущими веками. Развивайте землю, распространяйте печатный станок и наполняйте казну." #NT!
 nd_mhr.6.t: "Судьба маратхов" #NT!
 nd_mhr.6.d: "Государство маратхов доказало свою устойчивость. То, что началось как восстание одного вождя против султанов Декана, превратилось в устоявшееся королевство с институтами, традициями и амбициями, выходящими далеко за пределы Западных Гат. Вопрос, занимавший двор Шиваджи (являются ли маратхи налетчиками или правителями), теперь требует ответа, написанного не на языке дебатов, а на языке дел." #NT!
 nd_mhr.6.a: "Наша судьба ждет." #NT!
 nd_mhr.7.t: "Лорд Декана" #NT!
 nd_mhr.7.d: "Склады Сурата и крепость Гвалиора — наши. Старые султанаты, которые когда-то разделяли эту землю, разрушены, и знамя маратхов реет над западными торговыми путями и воротами в Индостан. Каждый торговец, проходящий через Сурат, платит дань Свараджье. Каждая армия, планирующая вторжение, должна считаться с крепостью Гвалиор на своем фланге. Декан больше не является оспариваемой границей. Это домен маратхов." #NT!
 nd_mhr.7.a: "Декан склоняется перед маратхским львом." #NT!
 nd_mhr.8.t: "Дорога в Дели" #NT!
 nd_mhr.8.d: "Дели пал. Город, который на протяжении веков был резиденцией мусульманского суверенитета над Индостаном, теперь признает превосходство маратхов. Удджайн, древняя столица малва, защищает наш западный фланг. Но империю, завоеванную мечом, нужно удерживать не только мечом. Едем ли мы так же, как Баджи Рао: быстро, безжалостно, подавляя наших врагов прежде, чем они успеют среагировать? Или мы методично сокращаем каждую крепость и опорный пункт, выстраивая нерушимую цепь контроля от Декана до Ямуны?" #NT!
 nd_mhr.8.a: "Скачи как Баджи Рао: нанеси удар, прежде чем они узнают, что мы приближаемся." #NT!
 nd_mhr.8.b: "Каждый взятый форт — это форт, который не может нам угрожать." #NT!
 nd_mhr.9.t: "Индуистский Пад Падшахи" #NT!
 nd_mhr.9.d: "От Инда до Нармады, от Тара до Бенгальского залива империя маратхов владеет территорией, превосходящей даже самые великие амбиции Великих Моголов. Мраморные дворцы Агры и золотые храмы Лахора теперь являются владениями маратхов. Индуистский Пад Падшахи (верховенство индуистских королей) больше не является мечтой, шепчущейся при дворах Райгада. Это реальность субконтинента. Но высшая власть дает высший выбор. Будем ли мы править с помощью огромной военной машины, привлекающей наемников и авантюристов со всего мира? Или нам следует построить коммерческую и военно-морскую инфраструктуру, чтобы поддерживать нашу империю посредством торговли, а не только посредством оружия?" #NT!
 nd_mhr.9.a: "Наши армии станут опорой империи." #NT!
 nd_mhr.9.b: "Империя существует благодаря торговле, а не только завоеваниям." #NT!
 nd_mhr.10.t: "Основа самоуправления" #NT!
 nd_mhr.10.d: "Мечта Хиндави Свараджья никогда не сводилась просто к независимости от иностранного правления. Речь шла о построении государства, достойного своего народа: государства, в котором системы доходов справедливы, администрация компетентна, а богатство земли служит всем, кто на ней работает. Внедрение современной банковской системы дало государству маратхов финансовые инструменты, которые могут конкурировать с инструментами любой европейской державы. Развитие Декана говорит громче любых заявлений: это цивилизация, которая может поддерживать себя." #NT!
 nd_mhr.10.a: "Свараджья построена на процветании своего народа." #NT!
 nd_mhr.11.t: "Деккани Процветание" #NT!
 nd_mhr.11.d: "Чаут-офисы Бароды собирают доходы от богатейших торговых путей Гуджарата. Хлопок из черноземов Декана течет через наши рынки по всему миру. Казна переполнена. Пуна стала не просто военной столицей, но и центром интеллектуальной жизни: в ее дворах собираются поэты, астрономы и администраторы. Но процветание создает свои собственные дилеммы. Инвестируем ли мы в жизнь разума, поддерживая ученых и привлекая иностранный опыт для расширения наших знаний? Или мы вложим наше богатство в саму торговлю хлопком, построив корабли и порты, которые сделают Декан текстильной мастерской Индийского океана?" #NT!
 nd_mhr.11.a: "Пуна станет Афинами Декана." #NT!
 nd_mhr.11.b: "Деканский хлопок оденет мир." #NT!
 nd_mhr.12.t: "Золотой век Деккани" #NT!
 nd_mhr.12.d: "То, что посадил Шиваджи, превратилось в цивилизацию. Декан больше не определяется империями, которые его завоевали. Оно определяется тем, что построил его собственный народ. Грамотное население читает стихи на маратхи и обсуждает вопросы управления в кофейнях. Печатный станок распространяет идеи из деревни в деревню. Сокровищница – предмет зависти королей. Иностранные послы приезжают не для того, чтобы диктовать условия, а для того, чтобы искать альянса. Это золотой век Деккани. Но как это запомнить? Как век дипломатического мастерства и гармоничного управления? Или как эпоха духовного и культурного расцвета, выходящего за пределы политических границ?" #NT!
 nd_mhr.12.a: "Мы будем архитекторами нового порядка." #NT!
 nd_mhr.12.b: "Пусть свет Декана осветит все религии." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_baji_rao_charge: "Атака Баджи Рао" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_baji_rao_charge: "Доктрина молниеносной кампании Баджи Рао I: бей быстро, бей сильно и уходи прежде, чем враг сможет подготовить ответный удар. Скорость — оружие превосходящих сил." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_strategic_patience: "Стратегическое терпение" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_strategic_patience: "Методичное сокращение опорных пунктов противника посредством длительной осады, превращающее каждое завоевание в непоколебимое владение. Терпение побеждает то, что не выдерживает скорость." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_hindu_padshahi: "Индуистский Падшахи" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_hindu_padshahi: "Огромная военная машина, питаемая армиями наемников и профессиональными солдатами, распространяющая власть маратхов по всему субконтиненту посредством одной только силы оружия." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_maratha_imperator: "Император Маратхи" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_maratha_imperator: "Империя, поддерживаемая торговлей и военно-морской мощью, а также армиями, где купцы и адмиралы служили бок о бок с генералами в расширении владений маратхов." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_pune_intellectuals: "Пуна Интеллектуалы" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_pune_intellectuals: "Ученые, астрономы и администраторы Пуны превращают столицу маратхов в центр обучения, привлекающий таланты со всего мира Индийского океана." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_cotton_empire: "Хлопковая империя" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_cotton_empire: "Деканский хлопок, сотканный из тончайших тканей и перевозимый на судах маратхов, становится основой экономической империи, способной соперничать с любыми военными завоеваниями." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_deccani_renaissance: "Деккани Ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_deccani_renaissance: "Расцвет государственного управления и управления, объединяющего различные народы в системе общего процветания и институционального совершенства." #NT!
 STATIC_MODIFIER_NAME_nd_mhr_dest_marathi_enlightenment: "Просветление маратхи" #NT!
 STATIC_MODIFIER_DESC_nd_mhr_dest_marathi_enlightenment: "Духовные и культурные традиции движения Бхакти перерастают в более широкую философию религиозной терпимости и религиозного обновления, которая выходит за рамки сектантских границ." #NT!
 nd_mhr_maratha_darbar: "Маратха Дарбар" #NT!
 nd_mhr_maratha_darbar_desc: "Императорский двор империи маратхов, где Чхатрапати получает дань от вассальных королей и иностранных послов. Проявление символа индуиста Пад Падшахи." #NT!
 nd_mhr_darbar_upkeep: "Операции Императорского двора" #NT!
 nd_mhr_darbar_upkeep_desc: "Прекрасная ткань для придворных церемоний и посольских приемов, бумага для императорских указов и корреспонденции, а также мебель для великолепия зала дарбара." #NT!
 nd_mhr_sharada_peeth: "Шарада Пит" #NT!
 nd_mhr_sharada_peeth_desc: "Великая академия обучения в традициях древней Шарада Пита, где ученые изучают философию, астрономию, математику и искусство управления." #NT!
 nd_mhr_peeth_upkeep: "Обслуживание Академии" #NT!
 nd_mhr_peeth_upkeep_desc: "Книги для библиотеки, бумага для студентов и ученых, ткань для академической мантии и мебели." #NT!
 mhr_ashta_pradhan_bureaucracy: "Ашта Прадхан" #NT!
 mhr_ashta_pradhan_bureaucracy_desc: "Совет восьми министров, созданный Шиваджи Махараджем во время его коронации в Райгаде 6 июня 1674 года. Пешва, Аматья, Мантри, Сачив, Сумант, Сенапати, Ньяядиш и Пандитрао имели определенные портфели: премьер-министр, финансы, разведка, секретариат, иностранные дела, военные, юстиция и религия. Две из восьми (Ньяядиш и Пандитрао) были зарезервированы для ученых каст брахманов, что закрепило за институтом религиозные санкции и превратило государство маратхов из личного отряда в писаную конституционную структуру." #NT!
 mhr_peshwa_daftar_bureaucracy: "Пешва Дафтар" #NT!
 mhr_peshwa_daftar_bureaucracy_desc: "Канцелярия потомственного министра пешвы в Пуне. Возникнув в Ашта-Прадхане Шиваджи как единый портфель, эта должность стала наследственной в семье Бхат читпаванских браминов после Баладжи Вишванатха (1713-1720) и стала фактической резиденцией суверенитета маратхов при Баджирао I (1720-1740) и Баладжи Баджирао Нанасахебе (1740-1761). Пуна заменила Сатару в качестве оперативной столицы. Дафтар издавал санады, записывал назначения доходов и направлял переписку с великими домами сардаров, став институциональным стержнем Конфедерации." #NT!
 mhr_saranjami_bureaucracy: "Система Саранджами" #NT!
 mhr_saranjami_bureaucracy_desc: "Маратхский аналог мансабдари, при котором государство выделяло сардарам и военным офицерам участки дохода (саранджам) вместо денежного вознаграждения. Первоначально гранты не передавались по наследству и зависели от продолжения военной службы, но при более поздних пешвах они превратились в наследственное владение великих домов: Холкар в Индауре, Сциндия в Гвалиоре, Гэквад в Бароде. Система дешево кормила огромные кавалерийские армии Конфедерации, но постепенно истощала центральную казну и привязывала доходы к лояльности сардарам, а не к командованию короны." #NT!
 mhr_watandari_bureaucracy: "Реестр Ватандари" #NT!
 mhr_watandari_bureaucracy_desc: "Государство маратхов унаследовало от своих предшественников Ядава и Бахмани плотный слой потомственных деревенских чиновников. Патил был деревенским старостой, кулкарни — деревенским бухгалтером, а нижестоящий — бара балутедар двенадцати традиционных каст служилых людей. Шиваджи намеренно подтвердил эти ватаны, чтобы привязать сельскую знать, говорящую на маратхи, к новому государству. Гранты были неотчуждаемыми и передаваемыми по наследству, запирая управление местными доходами в руках существующих линий Дешмукхов и Дешпанде: форма структурной автономии, которую реформаторы короны сочли почти невозможными вытеснить." #NT!
 mhr_chauth_sardeshmukhi_bureaucracy: "Чаут и Сардешмукхи" #NT!
 mhr_chauth_sardeshmukhi_bureaucracy_desc: "Утверждается, что двойная дань определила расширение маратхов. Чаут представлял собой сбор в размере 25% от доходов, собранных с территорий, которые маратхи претендовали на защиту, в то время как сардешмукхи добавляли еще 10% в качестве права главного старосты. Оба права были извлечены по договору из умирающей империи Великих Моголов после смерти Бахадур-шаха и официально оформлены Чхатрапати Шаху после 1719 года. Они финансировали расширение Конфедерации вглубь северной Индии, но рассматривали каждое подчиненное государство как временный источник дохода, а не как интегрированную провинцию, и заработали маратхам репутацию по всему Индостану как хищнических добывателей." #NT!
 mhr_huzur_daftar_bureaucracy: "Хузур Дафтар" #NT!
 mhr_huzur_daftar_bureaucracy_desc: "Центральный архив в Пуне, институциональная память Конфедерации. Созданный при первых пешвах и усовершенствованный при Нане Пхаднависе (1761-1800), дафтар проверял каждый грант саранджама, отслеживал доходы от деревни до казны и вел реестры корреспонденции, которые связывали дома сардаров с печатью пешвы. Двенадцатилетнее регентство Наны при Мадхаврао II полностью зависело от его владения записями дафтара; его смерть в 1800 году показала, насколько полностью Конфедерация стала зависеть от своего архива." #NT!
 mhr_pentarchy_bureaucracy: "Пентархия Конфедерации" #NT!
 mhr_pentarchy_bureaucracy_desc: "Институционализированная практика, посредством которой директивы пешвы требовали сотрудничества пяти великих домов сардаров: Холкара в Индауре, Сциндии в Гвалиоре, Бхонсле в Нагпуре, Гэквада в Бароде и самого пешвы в Пуне. К 1760-м годам эти дома выставили свои собственные армии, вели собственную дипломатию и относились к Пуне как к primus inter pares, а не как к суверену. Эта договоренность позволяла Конфедерации распространять власть на огромной территории, но превращала каждую кампанию в коалиционные переговоры: разногласия между пятью в Панипате в 1761 году способствовали там катастрофе." #NT!
 AUTO_MODIFIER_NAME_nd_mhr_bureaucracy_authority: "Маратха Дафтарс" #NT!
 AUTO_MODIFIER_DESC_nd_mhr_bureaucracy_authority: "Дафтары Конфедерации (Ашта Прадхан в Райгаде, канцелярия пешвы в Пуне, аудиторские регистры Хузур Дафтара) превратились в постоянный институциональный аппарат. Государство маратхов больше не является личным отрядом Шиваджи, а представляет собой письменный архив доходов, назначений и договоров, который постоянно ведется потомственными кастами писцов." #NT!
