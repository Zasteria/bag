l_russian:
 MAP: "Валмапу" #NT!
 MAP_ADJ: "Мапуче" #NT!
 MAP_f: "Валмапу" #NT!
 MAP_f_desc: "Объедините разбросанные народы мапуче Лоф, Реве и Айлареве в единую суверенную конфедерацию. От лесов Нгулумапу до степей Пуэльмапу Рече, отбросившие инков и разбившие испанцев при Куралабе, теперь претендуют на признанное королевство над всей землей между Кордильерами и морем. Токи возглавят федерацию в войне, Мачи сохранят ее дух, и ни одна иностранная корона не ступит без приглашения к югу от Био-Био." #NT!
