l_russian:
 STATIC_MODIFIER_NAME_nd_soe_river_conqueror: "Лорд реки" #NT!
 STATIC_MODIFIER_DESC_nd_soe_river_conqueror: "В традициях суннитского Али империя Сонгай ведет войну с непревзойденной скоростью вдоль Нигера, нанося удары одновременно с реки и с суши." #NT!
 STATIC_MODIFIER_NAME_nd_soe_scholar_emperor: "Трон Ученого" #NT!
 STATIC_MODIFIER_DESC_nd_soe_scholar_emperor: "Следуя замыслу Аскии Мухаммада, Империя Сонгай становится маяком исламского образования и справедливого управления во всем Сахеле." #NT!
 STATIC_MODIFIER_NAME_nd_soe_mecca_pilgrimage: "Паломник двух святых городов" #NT!
 STATIC_MODIFIER_DESC_nd_soe_mecca_pilgrimage: "Паломничество императора в Мекку повысило авторитет Сонхая среди мусульманского мира, привлекая к нашим дворам ученых и торговцев." #NT!
 STATIC_MODIFIER_NAME_nd_soe_last_stand_defense: "Защитники Нигера" #NT!
 STATIC_MODIFIER_DESC_nd_soe_last_stand_defense: "Под грохотом иностранных пушек сонгайцы твердо стоят на защите своей родины и городов Нигера." #NT!
 STATIC_MODIFIER_NAME_nd_soe_scorched_earth_retreat: "Сахель уходит в песок" #NT!
 STATIC_MODIFIER_DESC_nd_soe_scorched_earth_retreat: "Пусть захватчики захватят опустевшие города. Сонгайцы знают пустыню, реку и пути между ними. Мы вытерпим." #NT!
 nd_soe.1.t: "Расцвет империи Сонгай" #NT!
 nd_soe.1.d: "Река Нигер протекает через сердце нашей страны, словно великая артерия цивилизации. От Гао до Тимбукту, от соляных шахт Тагазы до золотых приисков Вангары возникает новая империя, претендующая на господство над величайшими торговыми путями Африки.\n\nНо что будет определять эту империю? Должны ли мы следовать путем суннита Али: воина, который никогда не проигрывал битву, который наносил удары с реки и суши с разрушительной скоростью, который подчинил Нигер своей воле с помощью одной только военной силы? Или мы пойдем дорогой Аскии Мухаммеда: императора-паломника, который превратил военное завоевание в цивилизацию закона, учености и веры, сделав Тимбукту интеллектуальной столицей исламского мира?\n\nРека простирается перед нами. Выбор за нами.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_soe.1.a: "Мы гонщики Нигера. Пусть наши враги трепещут." #NT!
 nd_soe.1.b: "Мы построим трон знаний и справедливости." #NT!
 nd_soe.2.t: "Паломничество Аскии" #NT!
 nd_soe.2.d: "В 1496 году Аския Мухаммед покинул Гао со свитой из пятисот кавалеристов и тысячи пехотинцев, неся с собой триста тысяч золотых монет для благотворительной раздачи по пути следования. Его хадж в Мекку не был просто актом личной преданности; это был мастерский дипломатический ход. В священных городах он был принят халифом Аббасидов в Каире, который наделил его титулом халифа земель Такрур, предоставив трону Сонгай религиозную легитимность, которой не обладал ни один предшественник.\n\nОн вернулся с учеными, архитекторами и торговцами. Он пригласил юриста аль-Магили из Тлемсена в качестве своего главного советника. Он придерживался идеи, что Тимбукту может стать не просто торговым постом, но и центром обучения, способным конкурировать с Каиром и Багдадом. Паломничество превратило военную империю в культурную." #NT!
 nd_soe.2.a: "Мир теперь знает славу Сонхая." #NT!
 nd_soe.3.t: "Гром с севера" #NT!
 nd_soe.3.d: "В 1591 году султан Марокко Ахмад аль-Мансур послал армию из четырех тысяч человек под командованием испанского евнуха Джудар-паши через Сахару: четырехмесячное путешествие по безводной пустыне. Они привезли с собой восемь английских пушек и тысячи пехотинцев, вооруженных аркебузами. В битве при Тондиби сорокатысячная сонгайская армия столкнулась с этой меньшей, но разрушительной вооруженной силой.\n\nКомандующий сонгай Аския Исхак II приказал бросить тысячу скота в паническое бегство, чтобы прорвать марокканские позиции, но грохот артиллерийского огня заставил стадо вернуться в ряды сонгаев. Бой длился едва ли два часа. Гао, Тимбукту и Дженне пали за несколько месяцев.\n\nЭпоха великих империй Сахары заканчивалась. Но империи медленно умирают в пустыне. Вопрос сейчас в том, как мы смотрим в будущее." #NT!
 nd_soe.3.a: "Укрепляйте города. Мы не дадим ни одной песчинки." #NT!
 nd_soe.3.b: "Отступайте во внутренние районы: пустыня — наша крепость." #NT!
 nd_soe.4.t: "Университет Санкоре" #NT!
 nd_soe.4.d: "В квартале Санкоре в Тимбукту, под сенью огромной мечети из сырцового кирпича, собираются около двадцати пяти тысяч студентов, чтобы учиться у ученых, освоивших теологию, право, математику, астрономию, медицину и историю. Санкоре — это не одно учебное заведение, а созвездие частных ученых, каждый со своими учениками и библиотеками, объединенных общей приверженностью школе исламской юриспруденции Малики.\n\nСтуденты должны свободно говорить по-арабски и выучить наизусть весь Коран. Полученные ими степени, сравнимые с иджазой каирского аль-Азхара, признаются во всем мусульманском мире. В библиотеках Тимбукту хранятся сотни тысяч рукописей — самая большая концентрация письменных знаний в странах Африки к югу от Сахары." #NT!
 nd_soe.4.a: "Знания – настоящее золото Тимбукту." #NT!
 nd_soe.5.t: "Штандарт Императора" #NT!
 nd_soe.5.d: "Аския Мухаммад сделал то, чего не делал ни один правитель Сахеля до него: он ввел систему стандартизированных мер и весов на рынках империи. Торговые инспекторы, мухтасибы, были размещены в каждом крупном рыночном центре от Тимбукту до Гао и Дженне и имели полномочия проверять весы, обеспечивать соблюдение честной торговли и наказывать за мошенничество.\n\nРезультатом стала коммерческая революция. Купцы от Каира до Феса и Венеции могли с уверенностью торговать на рынках Сонгай, зная, что мера золота в Тимбукту весит столько же, сколько мера золота в Гао. Репутация империи как страны честной торговли привлекала караваны со всей Сахары, как вода в колодец." #NT!
 nd_soe.5.a: "Справедливая торговля создает более сильные империи, чем завоевания." #NT!
 nd_soe_niger_origins: "Дети реки" #NT!
 nd_soe_niger_origins_desc: "Народ сонгай жил вдоль реки Нигер с незапамятных времен, черпая жизнь из ее наводнений и рыбы." #NT!
 nd_soe_noble_horsemen: "Сонхайская благородная кавалерия" #NT!
 nd_soe_noble_horsemen_desc: "Конные воины Сонхая, одетые в железные нагрудники под боевыми туниками, составляют основу имперской власти." #NT!
 nd_soe_niger_fleet: "Флот Хай-Коя" #NT!
 nd_soe_niger_fleet_desc: "Речной адмирал командует военными каноэ по Нигеру, распространяя мощь сонгаев от воды к берегу." #NT!
 nd_soe_early_islam: "Вера Сахеля" #NT!
 nd_soe_early_islam_desc: "Ислам пришел по торговым путям, его приняли сначала купцы и правители, постепенно преобразовав духовную жизнь Сонхая." #NT!
 nd_soe_gao_foundation: "Основание Гао" #NT!
 nd_soe_gao_foundation_desc: "Гао стоит на великой излучине Нигера, родовой резиденции Сонхая и ворот в Сахару." #NT!
 nd_soe_niger_agriculture: "Пойменное земледелие" #NT!
 nd_soe_niger_agriculture_desc: "Ежегодные наводнения Нигера откладывают богатый ил на равнинах, поддерживая сельское хозяйство, которое кормит империю." #NT!
 nd_soe_caravan_routes: "Транссахарские караваны" #NT!
 nd_soe_caravan_routes_desc: "Караваны верблюдов пересекают пустыню, неся золото, соль, слоновую кость и ткани: жизненную силу сахельской торговли." #NT!
 nd_soe_sunni_ali_conquests: "Завоевания суннитского Али" #NT!
 nd_soe_sunni_ali_conquests_desc: "Суннит Али Великий ни разу не потерпел поражения в бою. С помощью речных и кавалерийских войн он создал империю Сонгай." #NT!
 nd_soe_hikoy_command: "Командование Хай-Коя" #NT!
 nd_soe_hikoy_command_desc: "«Хай-Кой» командует более чем тысячей судов из порта Гао, контролируя речное движение и перебрасывая военную силу вдоль Нигера." #NT!
 nd_soe_conquest_of_timbuktu: "Жемчужина Сахеля" #NT!
 nd_soe_conquest_of_timbuktu_desc: "Завоевание Тимбукту в 1468 году привело к тому, что величайший торговый город Западной Африки оказался под контролем Сонхая." #NT!
 nd_soe_saharan_archery: "Сахарские конные лучники" #NT!
 nd_soe_saharan_archery_desc: "Конные лучники, взятые из кочевнических традиций, служат прикрытием и налетчиками, преследуя врагов до того, как нанесет удар тяжелая кавалерия." #NT!
 nd_soe_askia_revolution: "Династия Аския" #NT!
 nd_soe_askia_revolution_desc: "Захват трона Аскией Мухаммедом превратил Сонгай из военного государства в исламскую империю закона и управления." #NT!
 nd_soe_gold_salt_monopoly: "Золотая и соляная монополия" #NT!
 nd_soe_gold_salt_monopoly_desc: "Золото течет на север; соль течет на юг. Сонгаи сидят по обе стороны обоих потоков, облагая налогом самую ценную валюту в Африке." #NT!
 nd_soe_hajj_of_askia: "Хадж Аскии Мухаммада" #NT!
 nd_soe_hajj_of_askia_desc: "Паломничество Аскии Мухаммеда в Мекку в 1496 году сделало Сонгай законной исламской державой в глазах всего мусульманского мира." #NT!
 nd_soe_five_provinces: "Пять вице-королевств" #NT!
 nd_soe_five_provinces_desc: "Империя разделена на пять великих провинций, каждая из которых управляется наместником, который поддерживает порядок, сохраняя при этом местную автономию." #NT!
 nd_soe_sankore_university: "Университет Санкоре" #NT!
 nd_soe_sankore_university_desc: "Двадцать пять тысяч студентов учатся в квартале Санкоре в Тимбукту, что делает его одним из крупнейших центров обучения в исламском мире." #NT!
 nd_soe_sharia_courts: "Суды Кади" #NT!
 nd_soe_sharia_courts_desc: "Исламские судьи отправляют правосудие в соответствии с законами шариата в каждом крупном городе, привнося порядок и предсказуемость в управление." #NT!
 nd_soe_standardized_trade: "Штандарт Императора" #NT!
 nd_soe_standardized_trade_desc: "Стандартизированные меры веса и меры, введенные в действие торговыми инспекторами на каждом рынке, сделали торговлю Сонгая самой надежной в Сахеле." #NT!
 nd_soe_djenne_prosperity: "Процветание Дженне" #NT!
 nd_soe_djenne_prosperity_desc: "Дженне, город тысячи ученых и величайшая мечеть Судана, процветает как центр торговли и культуры." #NT!
 nd_soe_imperial_army: "Имперская Гвардия" #NT!
 nd_soe_imperial_army_desc: "Профессиональная постоянная армия образует железное ядро ​​военной мощи Сонхая, лояльное только династии Аскиа." #NT!
 nd_soe_saharan_campaigns: "Лорды пустыни" #NT!
 nd_soe_saharan_campaigns_desc: "Воины на верблюдах патрулируют границу Сахары, защищая караваны и распространяя имперскую власть в глубокой пустыне." #NT!
 nd_soe_timbuktu_manuscripts: "Рукописи Тимбукту" #NT!
 nd_soe_timbuktu_manuscripts_desc: "Сотни тысяч рукописей заполняют библиотеки Тимбукту, хранящие знания по астрономии, медицине, истории и праву." #NT!
 nd_soe_koi_commanders: "Система Кои" #NT!
 nd_soe_koi_commanders_desc: "Региональные военные командиры, Кои, поддерживают постоянные силы по всей империи, обеспечивая быстрое реагирование на любую угрозу." #NT!
 nd_soe_trade_inspectors: "Мухтасиб" #NT!
 nd_soe_trade_inspectors_desc: "Торговые инспекторы обеспечивают честность сделок на каждом рынке, проверяя вес, наказывая за мошенничество и собирая имперские пошлины." #NT!
 nd_soe_gunpowder_response: "Гром ответил" #NT!
 nd_soe_gunpowder_response_desc: "Марокканское вторжение продемонстрировало разрушительную силу огнестрельного оружия. Империя должна адаптироваться или погибнуть." #NT!
 nd_soe_pastoral_wealth: "Богатство стад" #NT!
 nd_soe_pastoral_wealth_desc: "Огромные стада крупного рогатого скота, коз и лошадей поддерживают скотоводческую экономику Сахеля и обеспечивают кавалерийскую армию ездовыми животными." #NT!
 nd_soe_maliki_jurisprudence: "Школа Малики" #NT!
 nd_soe_maliki_jurisprudence_desc: "Школа исламского права Малики, созданная учеными из Северной Африки, обеспечивает объединяющую правовую основу для различных народов империи." #NT!
 nd_soe_imperial_diversity: "Империя многих народов" #NT!
 nd_soe_imperial_diversity_desc: "Сонгай, Мандинка, Туареги, Фулани: империя управляет множеством народов посредством гибкого управления и общей исламской веры." #NT!
 nd_soe_sahel_resilience: "Устойчивость Сахеля" #NT!
 nd_soe_sahel_resilience_desc: "Империи возникают и рушатся, но народы Сахеля выживают. Наследие Сонхая сохранилось в государствах-преемниках и культурной памяти." #NT!
 nd_soe_niger_commerce: "Нигер Коммерция" #NT!
 nd_soe_niger_commerce_desc: "Нигер остается магистралью западноафриканской торговли, доставляя товары и идеи между лесом и пустыней." #NT!
 nd_soe_sahel_fortifications: "Укрепления Сахеля" #NT!
 nd_soe_sahel_fortifications_desc: "Стены из сырцового кирпича и оборонительные сооружения защищают сахельские города как от рейдеров, так и от захватчиков." #NT!
 nd_soe_crown_authority: "Авторитет Аскии" #NT!
 nd_soe_crown_authority_desc: "Центральная власть Аскии усиливает контроль над губернаторами провинций, обеспечивая имперское единство." #NT!
 nd_soe_slave_soldiers: "Солдаты Империи" #NT!
 nd_soe_slave_soldiers_desc: "Солдаты-рабы, лично преданные императору, а не какому-либо клану или семье, составляют надежное ядро ​​профессиональных войск." #NT!
 nd_soe_scholarly_preservation: "Хранители знаний" #NT!
 nd_soe_scholarly_preservation_desc: "Благодаря устным традициям и бережно хранимым рукописям ученые Сонгай сохраняют знания веков." #NT!
 nd_soe_songhai_revival: "Сонхайское возрождение" #NT!
 nd_soe_songhai_revival_desc: "Новое поколение восстанавливает наследие династии Аскиа, разжигая мечту о возрожденной цивилизации Сонгай." #NT!
 nd_soe_modern_agriculture: "Современное сельское хозяйство Сахеля" #NT!
 nd_soe_modern_agriculture_desc: "Новые технологии превращают поймы рек и саванны в более продуктивные сельскохозяйственные угодья, кормя растущее население." #NT!
 nd_soe_modern_trade: "Современная торговля Сахары" #NT!
 nd_soe_modern_trade_desc: "Древние торговые пути обретают новую жизнь, поскольку современная инфраструктура соединяет Сахель с мировыми рынками." #NT!
 nd_soe_modern_army: "Современная армия Сонгай" #NT!
 nd_soe_modern_army_desc: "Реформированная и модернизированная армия гарантирует, что Империя Сонгай сможет защитить свой суверенитет в меняющемся мире." #NT!
 nd_soe_education_reform: "Образование для всех" #NT!
 nd_soe_education_reform_desc: "Опираясь на научные традиции Тимбукту, новые школы приносят грамотность и обучение во все уголки империи." #NT!
 nd_soe_imperial_restoration: "Мечта о восстановлении" #NT!
 nd_soe_imperial_restoration_desc: "От Гао до Тимбукту видение восстановленной империи Сонгай объединяет народы излучины Нигера." #NT!
 a_nd_soe_noble_cavalry: "Сонхайская благородная кавалерия" #NT!
 a_nd_soe_noble_cavalry_desc: "Элитные конные воины сонгайской знати, одетые в железные нагрудники под боевыми туниками, атакуют врага с разрушительной силой." #NT!
 a_nd_soe_hikoy_marines: "Привет-Кой Морские пехотинцы" #NT!
 a_nd_soe_hikoy_marines_desc: "Речные воины, сражающиеся на огромных боевых каноэ нигерского флота, одинаково смертоносны как в морском десантировании, так и в ближнем бою." #NT!
 a_nd_soe_mounted_archers: "Сонхайские конные лучники" #NT!
 a_nd_soe_mounted_archers_desc: "Легкие кавалерийские лучники сахарской традиции, используемые для разведки, прикрытия и преследования вражеских формирований перед основным нападением." #NT!
 a_nd_soe_imperial_guard: "Императорская гвардия Сонхай" #NT!
 a_nd_soe_imperial_guard_desc: "Профессиональные солдаты династии Аския, хорошо экипированные и фанатично преданные императору." #NT!
 a_nd_soe_jihad_infantry: "Пехота Сонгай Джихад" #NT!
 a_nd_soe_jihad_infantry_desc: "Религиозно мотивированные воины, сражающиеся в защиту Исламского государства, их пыл компенсирует нехватку огнестрельного оружия в империи." #NT!
 a_nd_soe_sahel_musketeer: "Сахельский мушкетер" #NT!
 a_nd_soe_sahel_musketeer_desc: "Пехота, вооруженная приобретенным огнестрельным оружием, адаптирует уроки Тондиби, чтобы гарантировать, что империя никогда больше не останется без порохового оружия." #NT!
 n_nd_soe_war_canoe: "Сонгайское военное каноэ" #NT!
 n_nd_soe_war_canoe_desc: "Большие военные каноэ-долблены с вооруженными морскими пехотинцами, составляющими основу флота реки Нигер, которым командует «Хай-Кой»." #NT!
 a_nd_soe_camel_corps: "Сахарский верблюжий корпус" #NT!
 a_nd_soe_camel_corps_desc: "Воины на верблюдах, которые патрулируют границу Сахары, защищая караваны и нанося удары вглубь пустыни." #NT!
 nd_soe_sankore_madrasa: "Санкоре медресе" #NT!
 nd_soe_sankore_madrasa_desc: "Центр исламского обучения, созданный по образцу великой мечети Санкоре в Тимбукту, где ученые преподают теологию, право, медицину и астрономию." #NT!
 nd_soe_saharan_caravanserai: "Сахарский караван-сарай" #NT!
 nd_soe_saharan_caravanserai_desc: "Укрепленная остановка для отдыха на транссахарских торговых путях, обеспечивающая убежище, воду и рынки для путешествующих торговцев." #NT!
 nd_soe_niger_port: "Речной порт Нигера" #NT!
 nd_soe_niger_port_desc: "Причал и верфь на реке Нигер, где товары загружаются в каноэ для транспортировки, а военные корабли строятся и ремонтируются." #NT!
 nd_soe_qadi_court: "Кади Корт" #NT!
 nd_soe_qadi_court_desc: "Исламский судебный суд, в котором кади отправляет правосудие в соответствии с законами шариата, обеспечивая порядок и легитимность имперского правления." #NT!
 nd_soe_imperial_granary: "Императорское зернохранилище" #NT!
 nd_soe_imperial_granary_desc: "Склад из сырцового кирпича, который собирает и сохраняет дары пойм Нигера, защищая от голода и кормя города империи." #NT!
 nd_soe_gold_market: "Рынок золота" #NT!
 nd_soe_gold_market_desc: "Торговый дом, где золото Вангары взвешивают, анализируют и обменивают на соль Тагазы и ткани Средиземноморья." #NT!
 nd_soe_djenne_mosque: "Мечеть Дженне" #NT!
 nd_soe_djenne_mosque_desc: "Монументальная мечеть из сырцового кирпича, выполненная в традициях великой архитектуры Дженне, внушающая преданность и культурную гордость." #NT!
 nd_soe_muhtasib_office: "Офис Мухтасиба" #NT!
 nd_soe_muhtasib_office_desc: "Штаб-квартира имперского торгового инспектора, который обеспечивает соблюдение стандартизированного веса, честной торговли и рыночного регулирования." #NT!
 nd_soe_slave_barracks: "Казармы рабов-солдат" #NT!
 nd_soe_slave_barracks_desc: "Квартиры для солдат-рабов, лично лояльных императору, образующих надежную профессиональную военную силу, независимую от клановой принадлежности." #NT!
 nd_soe_madrasa_upkeep: "Научное обслуживание" #NT!
 nd_soe_madrasa_upkeep_desc: "Бумага для рукописей, керамика для сосудов для чернил и благовония для преданности: ежедневные потребности центра исламского обучения." #NT!
 nd_soe_caravanserai_upkeep: "Провизия для каравана" #NT!
 nd_soe_caravanserai_upkeep_desc: "Скот для караванных животных, керамика для путешественников и соль для сохранения: цена поддержания торговых путей." #NT!
 nd_soe_port_upkeep: "Обслуживание порта" #NT!
 nd_soe_port_upkeep_desc: "Пиломатериалы и деготь для каноэ и доков, инструменты для кораблестроителей, поддерживающих мореходность флота реки Нигер." #NT!
 nd_soe_court_upkeep: "Судебные протоколы" #NT!
 nd_soe_court_upkeep_desc: "Бумага для юридических документов, тонкая ткань для мантий судей и благовония для торжеств при дворе кади." #NT!
 nd_soe_granary_upkeep: "Обслуживание зернохранилища" #NT!
 nd_soe_granary_upkeep_desc: "Древесина и глина для содержания огромных складов, а также инструменты для рабочих, управляющих запасами зерна империи." #NT!
 nd_soe_gold_market_upkeep: "Рыночные операции" #NT!
 nd_soe_gold_market_upkeep_desc: "Керамика для весов, ткань для торговых товаров и бумага для записей каждой биржи: стоимость работы на крупном рынке золота." #NT!
 nd_soe_mosque_upkeep: "Обслуживание мечети" #NT!
 nd_soe_mosque_upkeep_desc: "Глина и пиломатериалы для ежегодной реставрации сырцовой мечети, благовония благовоний для молитвенных залов: священный общественный долг." #NT!
 nd_soe_office_upkeep: "Записи инспектора" #NT!
 nd_soe_office_upkeep_desc: "Бумага и глиняная посуда для тщательных записей, ткань для униформы и печати, которые придают мухтасибу власть." #NT!
 nd_soe_barracks_upkeep: "Казарменное снабжение" #NT!
 nd_soe_barracks_upkeep_desc: "Оружие, ткань и кожа для вооружения, одежды и снаряжения гарнизона рабов-солдат." #NT!
 nd_soe_gold_refining: "Аффинаж золота" #NT!
 nd_soe_gold_refining_desc: "Серебро для легирования, гончарные тигли и инструменты для пробирщиков: тщательная переработка сырого золотого песка в товарную форму." #NT!
 nd_soe_salt_caravan: "Операции с соляным караваном" #NT!
 nd_soe_salt_caravan_desc: "Караванные животные, торговая одежда и сама соль: снабжение верблюжьих караванов, которые доставляют сахарскую соль на рынки Сахеля." #NT!
 nd_soe_manuscript_production: "Производство рукописей" #NT!
 nd_soe_manuscript_production_desc: "Бумага для страниц, красители для чернил и ткань для переплета: кропотливое копирование научных рукописей в скрипториях Тимбукту." #NT!
 nd_soe_horse_breeding: "Сахарское коневодство" #NT!
 nd_soe_horse_breeding_desc: "Скот для разведения, зерно для корма и соль для здоровья животных: выращивание боевых коней и караванных животных на лугах Сахеля." #NT!
 levy_nd_soe_camel_corps: "Сахарский верблюд Леви" #NT!
 levy_nd_soe_camel_corps_desc: "Воины на верблюдах, поднятые с границ пустыни для патрулирования и защиты сахарских территорий империи." #NT!
 levy_nd_soe_mounted_archers: "Конный лучник Леви" #NT!
 levy_nd_soe_mounted_archers_desc: "Легкие кавалерийские лучники, набранные из знати Сонгай для разведки и проверки." #NT!
 nd_soe_formed_tt: "Образовалась империя Сонгай." #NT!
 nd_soe_path_a_tt: "Выбрал Лорда реки" #NT!
 nd_soe_path_b_tt: "Выбрать трон учёного" #NT!
 nd_soe_destiny: "Судьба Сонхая" #NT!
 nd_soe_destiny_desc: "Империя Сонгай выросла. Теперь ему предстоит выбрать свой путь: завоевание или просветление." #NT!
 nd_soe_dest_saharan_salt: "Соляные дороги Сахары" #NT!
 nd_soe_dest_saharan_salt_desc: "Захватите соляные шахты Сахары и сокрушите королевства Мосси, чтобы обезопасить южную границу империи. Контролируйте Тагазу и Уагадугу." #NT!
 nd_soe_dest_hausa_conquest: "Завоевание Хаусаленда" #NT!
 nd_soe_dest_hausa_conquest_desc: "Марш на восток в Хаусаленд. Возьмите Кано, Кацину и столицу Борну Нгазаргаму, чтобы доминировать в центральном Сахеле." #NT!
 nd_soe_dest_sahel_hegemony: "Гегемония Сахеля" #NT!
 nd_soe_dest_sahel_hegemony_desc: "Двигайтесь на юг, к золотым приискам Асанте, и на запад, в Сокото. Ни одна держава в Западной Африке не может соперничать с Империей Сонгай." #NT!
 nd_soe_dest_gold_routes: "Мастера золотой торговли" #NT!
 nd_soe_dest_gold_routes_desc: "Контролируйте источники золота в Бего и обеспечьте движение золота через рынки Сонгая. Богатство – основа цивилизации." #NT!
 nd_soe_dest_islamic_learning: "Город знаний" #NT!
 nd_soe_dest_islamic_learning_desc: "Используйте банковские учреждения и развивайте регион Нигера, чтобы поддержать роль Тимбукту как интеллектуальной столицы Африки." #NT!
 nd_soe_dest_beacon_of_africa: "Маяк Африки" #NT!
 nd_soe_dest_beacon_of_africa_desc: "Достигните наивысшего развития в Сахеле, освойте печатный станок и сделайте империю Сонгай самой престижной державой в Африке." #NT!
 nd_soe.6.t: "Судьба Сонхая" #NT!
 nd_soe.6.d: "Империя Сонгай стоит на перепутье. Перед нами склоняется Нигер, позади простирается пустыня, а будущее находится в наших руках. Выберем ли мы меч или перо, империя выстоит." #NT!
 nd_soe.6.a: "Империя выстоит." #NT!
 nd_soe.7.t: "Соляные дороги — наши" #NT!
 nd_soe.7.d: "Огромные соляные караваны, пересекающие Сахару, теперь движутся под защитой Сонгая. От Тагазы до рынков Сахеля – каждый брусок соли обогащает нашу казну. Королевства Мосси покорены, а южная граница в безопасности." #NT!
 nd_soe.7.a: "Соль – богатство пустыни." #NT!
 nd_soe.8.t: "Падение Хаусаленда" #NT!
 nd_soe.8.d: "Обнесенные стеной города Хаусаленда пали под натиском наших армий. Кано, этот крупный центр торговли Сахары, находится под властью Сонгая. Красильные ямы Кацины и граница озера Чад в Борну — наши. Но как мы будем управлять этими завоеванными народами?\n\nМы можем собирать дань и оставлять местных правителей у власти, обогащая казну и сохраняя при этом стабильность. Или мы можем полностью интегрировать эти земли в имперскую систему, приняв их народы как свои собственные, хотя это и ограничивает наши административные возможности." #NT!
 nd_soe.8.a: "Собирайте дань с завоеванных городов." #NT!
 nd_soe.8.b: "Интегрируйте Хаусаленд в империю." #NT!
 nd_soe.9.t: "Лорды Сахеля" #NT!
 nd_soe.9.d: "От золотых приисков Асанте до соляных рудников Тагазы, от излучины Нигера до границ Борну — ни одна держава в Западной Африке не может соперничать с Империей Сонгай. Наши армии достигли того, о чем мечтал суннит Али: полного господства над Сахелем.\n\nБудем ли мы править как Железная Аския, проецируя непреодолимую военную мощь по всему региону? Или нам следует принять империю пыли: овладеть самой местностью, сделав пустыню и саванну нашей величайшей крепостью?" #NT!
 nd_soe.9.a: "Мы — Железная Аския: никто не устоит против нас." #NT!
 nd_soe.9.b: "Пустыня – наша крепость и наше оружие." #NT!
 nd_soe.10.t: "Золото течет через Сонхай" #NT!
 nd_soe.10.d: "Золото юга теперь проходит через руки Сонхая. В Бего и на наших рынках драгоценный металл взвешивают, облагают налогом и отправляют на север через Сахару. Торговцы со всего мусульманского мира приезжают торговать в наши города, привлеченные надежностью наших весов и справедливостью наших судов." #NT!
 nd_soe.10.a: "Пусть золото течет." #NT!
 nd_soe.11.t: "Расцвет Тимбукту" #NT!
 nd_soe.11.d: "Тимбукту стал тем, чем всегда представлял Аскиа Мухаммед: городом, где наука и торговля неразделимы, где богатство торговли золотом финансирует библиотеки и медресе, куда студенты приезжают со всего мусульманского мира, чтобы учиться у сонгайских мастеров.\n\nДолжны ли мы углубить научные сети, привлекая к нашим дворам больше образованных людей, даже ценой военной готовности? Или нам следует развивать учёных-торговцев, которые сочетают торговую хватку с интеллектуальной утончённостью, хотя некоторые дипломаты могут счесть нашу коммерческую направленность неуклюжей?" #NT!
 nd_soe.11.a: "Ученость превыше всего: знания вечны." #NT!
 nd_soe.11.b: "Мудрость и богатство идут рука об руку." #NT!
 nd_soe.12.t: "Маяк Африки" #NT!
 nd_soe.12.d: "Империя Сонгай достигла того, чего раньше не удавалось ни одной державе к югу от Сахары. Тимбукту конкурирует с Каиром как центр исламского образования. Наше развитие превосходит развитие любого сахельского государства в истории. Печатный станок сохраняет рукописи, которые когда-то существовали только в хрупких копиях.\n\nПримем ли мы золотой век культуры, сделав Тимбукту бесспорной интеллектуальной столицей исламского мира? Или нам следует построить универсальную империю, объединяющую различные народы посредством общей веры и взаимных обязательств?" #NT!
 nd_soe.12.a: "Пусть Тимбукту сияет как жемчужина ислама." #NT!
 nd_soe.12.b: "Мы построим империю многих народов и одной веры." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_hausa_tribute: "Дань Хаусаленду" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_hausa_tribute: "Завоеванные города Хаусаленда платят дань Аскии, наполняя казну, в то время как местные правители поддерживают порядок под надзором Сонгая." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_hausa_integration: "Народы Империи" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_hausa_integration: "Народы Хаусаленда приветствуются в рядах империи, их культуры принимаются как часть сонгайской мозаики." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_iron_askia: "Железная Аския" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_iron_askia: "Армия Сонхая наносит удары со скоростью и точностью возрожденного суннита Али, сокрушая врагов прежде, чем они смогут организовать оборону." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_empire_of_dust: "Империя пыли" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_empire_of_dust: "Сам Сахель борется за сонгай. Захватчики терпят поражение в пустыне, а наши армии легко передвигаются по знакомой местности." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_scholars_network: "Сеть ученых" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_scholars_network: "Сеть переписки связывает сонгайских ученых с великими умами исламского мира, ускоряя распространение знаний." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_merchant_scholars: "Купцы-ученые Нигера" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_merchant_scholars: "Образованные торговцы Тимбукту сочетают коммерческую хватку с интеллектуальной глубиной, способствуя процветанию всего бассейна Нигера." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_timbuktu_golden_age: "Золотой век Тимбукту" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_timbuktu_golden_age: "Тимбукту вступает в свою величайшую эпоху: город ста тысяч рукописей, где наука, искусство и вера освещают Сахель." #NT!
 STATIC_MODIFIER_NAME_nd_soe_dest_universal_empire: "Универсальная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_soe_dest_universal_empire: "Империя Сонгай выходит за пределы племенных границ, объединяя Сонгай, Мандинка, Туареги и Хауса в единое сообщество веры и обязательств." #NT!
 nd_soe_imperial_warcamp: "Имперский военный лагерь" #NT!
 nd_soe_imperial_warcamp_desc: "Укреплённый плацдарм, где Аскиа собирает свои армии, хранит добычу и планирует следующую завоевательную кампанию." #NT!
 nd_soe_warcamp_upkeep: "Обеспечение военного лагеря" #NT!
 nd_soe_warcamp_upkeep_desc: "Ежедневные затраты на содержание имперского военного лагеря: оружие для солдат, кожа для ремонта доспехов и инструменты для осадного оборудования." #NT!
 nd_soe_house_of_wisdom: "Дом Мудрости" #NT!
 nd_soe_house_of_wisdom_desc: "Грандиозное учебное заведение, где ученые переводят, копируют и сочиняют труды по теологии, науке и философии в традициях багдадской Байт аль-Хикмы." #NT!
 nd_soe_wisdom_upkeep: "Научные положения" #NT!
 nd_soe_wisdom_upkeep_desc: "Затраты на содержание большого центра обучения: бумага для рукописей, книги для библиотеки и благовония для созерцания." #NT!
  
 AUTO_MODIFIER_NAME_nd_soe_bureaucracy_authority: "Императорский аппарат Сонхай" #NT!
 AUTO_MODIFIER_DESC_nd_soe_bureaucracy_authority: "От управления речного флота Хи-Коя до назначенных Аскией Мухаммадом ферм, инквизиторского суда, вдохновленного аль-Магили, летописцев Тариха, постоянного корпуса румде и имперских королевских поместий в излучине Нигера, государство Сонгай достигло такой глубины административного влияния, на которую старая федерация Манден никогда не пыталась. Рядом со столицей открываются два бюрократических места для учреждений государства Аскиа." #NT!
  
 soe_hi_koy_bureaucracy: "Офис Хай-Кой Си-Мастер" #NT!
 soe_hi_koy_bureaucracy_desc: "Адмиралтейство речного флота Нигера: самое выдающееся управление в Сонхае и не имеющее прецедентов в Мали. Хай-Кой командовал флотилией бронированных боевых каноэ, которые перевозили войска Аскии вверх и вниз по внутренней дельте от Гао до Дженне, перевозили соль и зерно на имперские рынки и обеспечивали взимание пошлины на переправах через реки. Положение непросто сосуществовало с кавалерийской знатью: речной флот был построен вокруг рыболовецких каст (сорко, бозо и сомоно), которых кавалерия презирала, но от которых зависела имперская логистика." #NT!
  
 soe_askia_farmas_bureaucracy: "Провинциальные фермы Аскиа" #NT!
 soe_askia_farmas_bureaucracy_desc: "Реформа Аскии Мухаммеда, проведенная в 1493 году, разделила империю на назначенных губернаторов: Курмина-Фари на западе, Денди-Фари на юге, Бана-Фарма на востоке, плюс Хари-Фарма на озерах, Сао-Фарма на лесных массивах, Фари-Мондио на равнинах Дирма и Юфу-Мондио на реках. Там, где суннитский Али правил через вождей-данников, аскиа назначала лоялистов (часто родственников, часто бывших рабов-офицеров), срок пребывания в должности которых был по усмотрению трона. Система фарма была основой централизации Сонхая и тем, что больше всего возмущало перемещенную аристократию эпохи Сонни." #NT!
  
 soe_mori_koyra_bureaucracy: "Инквизиторский суд Мори-Койра" #NT!
 soe_mori_koyra_bureaucracy_desc: "По возвращении из хаджа 1496–1497 годов Аския Мухаммад проконсультировался с североафриканским ученым Мухаммадом аль-Магили, чьи ответы на вопросы эмира Сонхая предписывали строгую чистку от смешанной исламской практики и должность инквизитора (мори-койра, великого ученого), уполномоченного преследовать отступничество, синкретизм с духовными культами бори и хаука и благородное злоупотребление законом. Это учреждение дало императорскому трону религиозно-правовое влияние на сельскую местность, которое дворянство не могло блокировать, но оно разожгло все еще языческое сельское большинство, которое считало свои исконные обычаи уголовными преступлениями." #NT!
  
 soe_tarikh_scribes_bureaucracy: "Переписчики Тарихских летописей" #NT!
 soe_tarikh_scribes_bureaucracy_desc: "Класс грамотных писцов Сонинке, Санхаджа и Сонгай, которые укомплектовывали канцелярию Аскиаса и из чьих рядов вышли летописцы Тариха ас-Судана, законченного Абд ар-Рахманом ас-Саади из Тимбукту в 1655 году, и Тариха аль-Фатташа, начатого при Аскии Мухаммаде семьей Кати и продолжавшегося более века. В отличие от устной традиции джели Мандена, это была документальная бюрократия: письма о назначении, налоговые регистры, юридические фетвы и генеалогии, которые узаконили линию Аскиа. Летописцы сохраняли институциональную память Сонхая, часто тонко выступая против трона всякий раз, когда они считали, что трон допустил ошибку." #NT!
  
 soe_rumde_corps_bureaucracy: "Постоянный корпус Румде" #NT!
 soe_rumde_corps_bureaucracy_desc: "Постоянная армия Аскии, состоящая из военнопленных и наемных рабов (румде, арби), отличается от сезонных наборов благородной кавалерии. Набранные в ходе кампаний вдоль Нигера и по всей стране Мосси, экипированные из имперских арсеналов в Гао и расквартированные круглый год, румде стали инструментом, независимым от кавалерийской аристократии эпохи Сонни и противовесом ей. Их круглогодичная доступность сделала возможным проведение расширенных кампаний Манде, Мосси, Хауса и Сахары, которые определили имперский период; их стоимость привела к увеличению рабской дани, которая давила на крестьянство." #NT!
  
 soe_tondi_farma_bureaucracy: "Тонди-Фарма Роял Эстейтс" #NT!
 soe_tondi_farma_bureaucracy_desc: "Земли имперских владений на излучине Нигера: рисовые поля в Денди, пастбища для скота вдоль озер, плантации проса в пойме - все это обрабатывалось военнопленными занджами и управлялось Тонди-Фарма (хозяином полей), подчинявшимся непосредственно аскиа. Королевские поместья кормили постоянную армию, снабжали двор Гао и давали трону доход, независимый от налога харадж, который нужно было договариваться с вождями провинций. Они также привязали к короне значительное несвободное население, и этот факт после Тондиби в 1591 году стал рассадником восстания." #NT!
