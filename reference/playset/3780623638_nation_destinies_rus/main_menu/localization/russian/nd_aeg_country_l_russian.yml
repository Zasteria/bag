l_russian:
 AEG: "Египет" #NT!
 AEG_ADJ: "египетский" #NT!
 AEG_f: "Египет" #NT!
 AEG_f_desc: "Создайте восстановленную империю Нила, объединив военную легитимность мамлюков с династической преемственностью фараонов, на которую претендуют султаны Каира. Египет объединяет нижний и верхний Нил, Левант, Хиджаз, Нубию и Киренаику идеологией султана-фараона, которая прослеживает свою линию от Мемфиса через Вавилон Египта до цитадели Салах ад-Дина. От Кирены до Мекки и Хартума — Новое Королевство возрождается под знаменем исламского фараона." #NT!
