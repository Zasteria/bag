l_russian:
 SVB: "Суварнабхуми" #NT!
 SVB_ADJ: "Суварнабхумин" #NT!
 SVB_f: "Суварнабхуми" #NT!
 SVB_f_desc: "Суварнабхуми («Земля золота» буддийских сутр и каменных надписей) — это собственное название материка, империя Пан-Теравады, о которой в свою очередь мечтали кхмерские чаккаватти, аюттхайские короли-боги, завоеватели Таунгу и лаосские владыки мандалы. Для формирования Суварнабхуми необходимо удержать все четыре цивилизационные якоря материковой Юго-Восточной Азии: ватные храмы Ангкора, золотые чеди Аюттхая, усеянную ступами равнину Багана и Тат Луанг Вьентьяна. Под одним знаменем колеса дхармы из шафрана и золота четыре культурных ядра материкового Индокитая подчиняются единому буддийскому универсальному монарху, воплощая в жизнь видение, которое Байиннаунг какое-то время придерживался и которое раскололось после его смерти." #NT!
