 nd_dnm.26.a_tt: "Рейх и Курия называют Дунайское государство отступническим." #NT!
 nd_dnm.27.a_tt: "Выдержите имперское давление: применяет небольшой модификатор давления на 1 год; Реакция продолжается до тех пор, пока не будет достигнут один из трех ее выходов." #NT!
 nd_dnm.29.a_tt: "Подсчет закрыт. Примирение дает дунайское признание (а для бывшего избирателя богемского происхождения император заполняет вакантное избирательное место); выносливость дает Дунай выдерживает; выходы силы и легитимности сохраняют свои собственные награды" #NT!
  # Succession question chain (nd_dnm.30 / .31 / .32) 
 nd_dnm.30.a_tt: "Подтверждает открытый вопрос. Предоставляет модификатор «Открытый вопрос» (бессрочный, пока кризис преемственности не закончится)" #NT!
 nd_dnm.31.a_tt: "Сплотить диеты: удаляет открытый вопрос, дает «Сплочение диет» (бессрочно) И дает +15 к уверенности короны, когда происходит катастрофа." #NT!
 nd_dnm.31.b_tt: "Королевское молчание: удаляет открытый вопрос, дает королевское молчание (вечное); реестр Crown Confidence запускается без посторонней помощи" #NT!
 nd_dnm.32.a_tt: "Утвердите патентом сейчас: единовременная стоимость стабильности, гранты на составление указа (бессрочные) И семена +25 к уверенности короны, когда произойдет катастрофа." #NT!
