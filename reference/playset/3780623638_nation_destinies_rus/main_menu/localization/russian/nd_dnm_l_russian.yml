 nd_dnm_sue_for_succession_terms_desc: "Кризис считается безвыходным, и корона ведет переговоры, пока у нее еще есть карты, которые стоит разыграть. Завершает кризис преемственности уступленной ветви: скромнее, чем победа, мягче, чем крах." #NT!
