 nd_dnm.45.b_tt: "Терпеть. -10 Коронной уверенности" #NT!
 nd_dnm.46.a_tt: "+5 доверия к короне, небольшой бонус легитимности: проявляется настойчивость династии." #NT!
 nd_dnm.47.a_tt: "-5 Доверия Короны, небольшой штраф за легитимность: коалиция ужесточается." #NT!
  # Nationalities Question forewarning (nd_dnm.48) 
 nd_dnm.48.a_tt: "Оплатите 8 месяцев торгового и налогового дохода (минимум 75 золотых). Если позже вспыхнет национальный вопрос, контрольная цель его повторного утверждения будет ослаблена на 0,05." #NT!
 nd_dnm.48.b_tt: "Никаких затрат, никакой выгоды: если кризис наступит, то он наступит в полную силу" #NT!
