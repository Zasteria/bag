 nd_dnm_reconciliation_success_tt: "Император закрывает разрыв: #bold Реакция Рейха#! теперь может закончиться примирением" #NT!
 nd_dnm_weld_hun_tt: "#bold Корона Святого Стефана приваривается к королевству:#! Основные земли Венгрии становятся нашими, удаляются, и Венгрия полностью аннексируется" #NT!
