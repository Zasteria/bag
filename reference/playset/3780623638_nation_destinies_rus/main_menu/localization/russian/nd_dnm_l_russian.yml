 nd_dnm.9.a_tt: "Меч христианского мира: Восточный крестовый поход восстанавливает христианский восток под Веной" #NT!
 nd_dnm.9.b_tt: "Воинство-завоеватель: восстановление Балкан как чистое военное завоевание" #NT!
 nd_dnm.10.a_tt: "Заложите основу камерылиста: Хофкамера становится основой королевства" #NT!
 nd_dnm.11.a_tt: "Crown Fisc: казначейство управляет государством, золото и налоги прежде всего" #NT!
 nd_dnm.11.b_tt: "Дунайский рынок: королевство становится речной торговой империей" #NT!
 nd_dnm.12.a_tt: "Рука камерылиста: удовлетворение наследства связано с административным контролем" #NT!
 nd_dnm.12.b_tt: "Просвещенное государство: грамотность и институциональный охват всех народов" #NT!
