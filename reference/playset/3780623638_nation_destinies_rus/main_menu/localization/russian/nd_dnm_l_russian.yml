  # Formation event 
 nd_dnm.1.a_tt: "Основатель: Antemurale Christianitatis, оплот христианского мира. Сильные военные и престижные бонусы; стоимость в суде эффективность." #NT!
 nd_dnm.1.b_tt: "Основополагающая идентичность: Gesamtmonarchie, централизованная тотальная монархия. Сильные административные и финансовые бонусы; стоимость дипломатической репутации." #NT!
  # Heritage DHE 
 nd_dnm.2.a_tt: "Пограничный острие: линия Гренцера выступала против османов." #NT!
 nd_dnm.2.b_tt: "Пограничный щит: Милитаэргренце обосновались глубоко и самостоятельно." #NT!
 nd_dnm.3.a_tt: "Verneuerte Landesordnung: рекатолизация Богемии по имперскому патенту" #NT!
 nd_dnm.3.b_tt: "Лояльная аристократия: свяжите новую служилую знать с конфискованными поместьями Белой горы." #NT!
 nd_dnm.4.a_tt: "Прагматическая санкция: земли Габсбургов стали одним неразделимым наследием" #NT!
 nd_dnm.5.a_tt: "Терезианская машина: реформа камеральных списков, обложенное налогами и обученное государство" #NT!
 nd_dnm.5.b_tt: "Жозефина Рич: просвещенная реформа, толерантный патент и единая бюрократия" #NT!
