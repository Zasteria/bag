 nd_dnm_weld_hab_tt: "#bold Австрийская корона приварена к королевству:#! Основные земли Австрии становятся нашими, выделены, и Австрия полностью аннексирована" #NT!
 nd_dnm_reconciliation_rejected_tt: "Увертюра публично высмеивается при императорском дворе; новое посольство нельзя отправить #bold 10 лет#!" #NT!
 ND_DNM_ACCEPT_BASE: "Рейх нелегко прощает отступничество" #NT!
