 nd_dnm.20.a_tt: "Начинается война за престолонаследие; стервятники предъявляют свои претензии на королевство" #NT!
 nd_dnm.21.a_tt: "Санкция удержана: предоставляется модификатор Indivisibiliter ac Inseparabililiter, и любая составляющая корона, все еще удерживаемая в качестве подданного или младшего союза, полностью приваривается к королевству (его земли выделяются и аннексируются)." #NT!
 nd_dnm.22.a_tt: "Санкции были нарушены крахом: серьезный удар по стабильности и модификатор штрафа за нарушение санкций" #NT!
 nd_dnm.22.b_tt: "Санкция была передана по выбору: небольшое снижение стабильности и более мягкий модификатор «Переданная санкция»." #NT!
 nd_dnm.23.a_tt: "Сопротивление оружием: стоимость стабильности и -3 уверенности в короне; война продолжается" #NT!
 nd_dnm.23.b_tt: "Согласование условий: прекращает катастрофу на ветке Сломанной с помощью флага уступки." #NT!
  # Reaction-of-the-Reich situation events 
