 nd_dnm_hofkammer_maintenance: "Казначейские операции" #NT!
 nd_dnm_stapel_maintenance: "Ривер-Стэпл Операции" #NT!
 nd_dnm_grenze_maintenance: "Военный пограничный гарнизон" #NT!
 nd_dnm_college_maintenance: "Деятельность иезуитского колледжа" #NT!
 nd_dnm_arsenal_maintenance: "Операции Имперского Арсенала" #NT!
 nd_dnm_theresianum_maintenance: "Терезианум Операции" #NT!
 nd_dnm_steam_yard_maintenance: "Работа паровой верфи" #NT!
  
  # ===== CAN_END CLAUSE TOOLTIPS (drive the Situation panel End Requirements) ===== 
  # Three earnable exits, surfaced as friendly prose in the panel. The fail 
  # escape (DNM no longer exists) is hidden by design: vanilla pattern. 
 nd_dnm_ps_resolved_end_tt: "Кризис престолонаследия был урегулирован силой и договором. Независимо от того, сохранится или отменена «Прагматическая санкция», Европа теперь признает, кто правит Дунаем, и вердикт Рейха о парии является спорным. (Разрешите катастрофу [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')], либо Поддержанную, либо Сломанную.)" #NT!
 nd_dnm_reich_humbled_end_tt: "Военный приговор Рейха был нарушен на поле боя. Достигните 80% очков войны против [GetUniqueInternationalOrganization('hre').GetLeaderTitle] и обеспечьте выполнение условий мира #Y «Смирить Рейх#!»." #NT!
 nd_dnm_pariah_endured_end_tt: "Прошло пятьдесят лет с момента разрыва, и королевство построило уважаемое государство: державы Европы больше не относятся к Дунаю как к отступнику. (50 лет после формирования, легитимность >= 60, престиж >= 50.)" #NT!
