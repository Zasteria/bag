  # ===== FORMATION EVENT ===== 
 nd_dnm.1.t: "Короны Дуная" #NT!
 nd_dnm.1.d: "Это сделано. Наследственные земли, Корона Святого Вацлава и Корона Святого Стефана вместе вышли из Священной Римской империи, и было заложено имперское достоинство. Избиратели встречаются без нас; легаты Папы едут в Вену с недовольством; в немецких землях рейх оставлен князьям. У нас есть то, чего не смог бы удержать ни один император, привязанный к Рейхстагу: Австрия, Богемия и Венгрия как одно суверенное королевство, не подчиняющееся никакому сейму, кроме нашего собственного двора.\n\nНо царство немцев, чехов, мадьяр, хорватов, словаков и дюжины других еще не является монархией. Что его связывает?\n\n#bold Antemurale Christianitatis#! делает Дунай щитом христианского мира: военная граница, солдатские колонии Гренцера, бесконечная Османская война, которая делает каждую корону общим врагом и общим делом.\n\n#bold Gesamtmonarchie#! делает Дунай единым телом: Хофкамера, Хофкригсрат, сварка Прагматических санкций три канцелярии в одно послушное административное государство.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_dnm.1.a: "Antemurale Christianitatis: будьте оплотом христианского мира" #NT!
 nd_dnm.1.b: "Gesamtmonarchie: сварить три короны в один корпус" #NT!
  
  # ===== HERITAGE DHE EVENTS ===== 
 nd_dnm.2.t: "Военный рубеж" #NT!
 nd_dnm.2.d: "Вдоль рек Савы, Дравы и нижнего Дуная формируется новый тип общества. Сербские, хорватские и влахские семьи расселены на границе на условиях наследственного землевладения: свободны от феодальных повинностей, свободны в своей вере, но обязывают мужчин и мальчиков к вечной военной службе. Милитаэргренце — это не линия крепостей, а живая стена солдат-фермеров, крупнейшего военизированного населения в Европе, наблюдающего за османской границей от колыбели до могилы. Вопрос в том, что делать с постоянной армией, которая никогда не расформировывается." #NT!
 nd_dnm.2.a: "Острие: продвиньте линию на юг, в земли Османской империи." #NT!
 nd_dnm.2.b: "Щит: углубите линию и позвольте ей поддерживать себя." #NT!
 nd_dnm.3.t: "Белая Гора" #NT!
 nd_dnm.3.d: "Ноябрьским утром под Прагой армия чешских сословий разбита за один день. Зимний Король убегает; двадцать семь лидеров восстания казнены на Староместской площади; выборная монархия Святого Вацлава отменена Verneuerte Landesordnung, а корона объявлена ​​наследственной, католической и Габсбургской. Треть земель Богемии переходит из рук в руки. Ни один день не сделал больше для создания сложной монархии и не оставил в ней более глубокой раны." #NT!
 nd_dnm.3.a: "Рекатолицизировать по патенту: одна вера, навязанная сверху" #NT!
 nd_dnm.3.b: "Свяжите новую знать: лояльность покупается на конфискованную землю" #NT!
 nd_dnm.4.t: "Прагматическая санкция" #NT!
 nd_dnm.4.d: "У Карла VI нет сына, и после его смерти он не допустит, чтобы дело двух столетий было разделено. Корона за короной, диета за диетой, Прагматическая санкция ратифицирована: земли Габсбургов перейдут #italic indivisibiliter ac inseparabiliter#! (неделимые и неотделимые) как одно тело к одному наследнику, дочери или сыну. Впервые Австрия, Богемия и Венгрия — не три кроны в одних руках, а одно юридическое лицо. Это конституционный стержень Гезаммонархии. Это также документ, на основе которого будет вестись следующая война." #NT!
 nd_dnm.4.a: "Одно царство, один наследник, неделимый и неразделимый." #NT!
 nd_dnm.5.t: "Терезианские реформы" #NT!
 nd_dnm.5.d: "Силезия потеряна, и эта потеря — это приговор: королевство, которое не может облагать налогами и не может бурить, не может защитить себя. Из Вены реформа приходит как прилив: объединенное казначейство, Директориум, призывные кантоны, Терезианум для подготовки людей, которые будут им управлять. Там, где Мария Тереза ​​​​строит машину, Иосиф II выводит ее за пределы: патент толерантности, единый канцелярский язык, крепостной, освобожденный указом. Для одного поколения составная монархия является почти государством." #NT!
 nd_dnm.5.a: "Машина списков камер: облагается налогом, тренируется, управляется централизованно" #NT!
 nd_dnm.5.b: "Достижение Жозефины: толерантность, грамотность, одна бюрократия" #NT!
  
  # ===== FORMATION TIMED MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_dnm_antemurale_christianitatis: "Антемурале христианитатис" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_antemurale_christianitatis: "Щит христианского мира на Дунае. Военная граница и солдатские колонии Гренцера превращают королевство в стену людей против османов, а роль оплота веры завоевывает престиж во всей католической Европе ценой суда, навсегда связанного обеспечением границы." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_gesamtmonarchie: "Гесамтмонархия" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_gesamtmonarchie: "Тотальная монархия. Хофкамера, Хофкригсрат и Прагматическая санкция объединяют три короны в один послушный административный орган, облагаемый налогами и интегрированный из Вены, за счет недовольства сословий и имперского сейма централизованным двором." #NT!
  
  # ===== HERITAGE DHE TIMED MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_dnm_frontier_spearhead: "Пограничное острие" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_frontier_spearhead: "Военная граница развернулась наружу: Гренцер как копье завоевания, давя на линию Османской империи на юге." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_frontier_shield: "Пограничный Щит" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_frontier_shield: "Военная граница расположилась глубоко и самодостаточно, как нерушимая стена, которая питает и питает сама себя." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_verneuerte_ordnung: "Verneuerte Landesordnung" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_verneuerte_ordnung: "Богемская церковь и конституция были изменены по императорскому патенту, Контрреформация навязана сверху." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_loyal_aristocracy: "Верная аристократия" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_loyal_aristocracy: "Новая служилая знать, связанная с короной конфискованными поместьями повстанцев Белой горы." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_indivisible_realm: "Неделимое Царство" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_indivisible_realm: "Прагматическая санкция утвердила корону за короной: Габсбурги получают одно юридическое лицо, одно наследство, одну лояльность." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_theresian_machine: "Терезианская машина" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_theresian_machine: "Камералистская реформа Марии Терезии: объединенное казначейство, Директориум, призывные кантоны: составная монархия, управляемая как единое государство." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_josephine_reach: "Жозефина Рич" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_josephine_reach: "Просвещенное достижение Иосифа II: патент толерантности, единый канцелярский язык, грамотная многоэтническая бюрократия." #NT!
  
  # ===== ADVANCES ===== 
 nd_dnm_bella_gerant_alii: "Белла Герант Алии" #NT!
 nd_dnm_bella_gerant_alii_desc: "«Пусть другие ведут войну, а ты, счастливая Австрия, вступай в брак». Бургундия, Кастилия, Богемия и Венгрия перешли к дому Габсбургов по наследству и браку, а не путем завоевания. Династическая дипломатия является основополагающим инструментом Дунайского государства." #NT!
 nd_dnm_hofkammer: "Венская Хофкамера" #NT!
 nd_dnm_hofkammer_desc: "Центральная судебная палата, основанная в 1527 году, взяла в свои руки казначейства Нижней Австрии, Тироля, Богемии и Венгрии в Вене: первый финансовый стержень сложной монархии. Открывает Хофкамеру." #NT!
 nd_dnm_hofkriegsrat: "Хофкригсрат" #NT!
 nd_dnm_hofkriegsrat_desc: "Придворный военный совет 1556 года, первая постоянная центральная военная администрация в Европе: она планировала Османскую войну, строила крепости и платила армии три кроны из одного офиса." #NT!
 nd_dnm_huszar: "Венгерский гусар" #NT!
 nd_dnm_huszar_desc: "Легкая кавалерия венгерской короны, созданная для борьбы с османскими налетчиками-акинчи и скопированная всеми армиями Европы к 1700 году. Открывает набор венгерских гусар." #NT!
 nd_dnm_danube_staple: "Дунайский продукт" #NT!
 nd_dnm_danube_staple_desc: "Средневековый венский Stapelrecht заставлял каждое судно на реке разгружать груз и торговать в императорской резиденции: институте, который превратил Дунай в единую торговую артерию. Открывает доступ к Донау-Стапелю." #NT!
 nd_dnm_militaergrenze: "Милитаэргренце" #NT!
 nd_dnm_militaergrenze_desc: "Военная граница: сербские, хорватские и валахские колонисты заселили линию Сава-Драва на основании наследственного владения для бессрочной пограничной службы. Открывает доступ к пограничному району и сбору Гренцера." #NT!
 nd_dnm_kleinkrieg: "Доктрина Кляйнкрига" #NT!
 nd_dnm_kleinkrieg_desc: "Маленькая война на приграничье: засады, набеги и стычки на пересеченной местности Дуная, нерегулярные суда, которые наводили страх на гренцеров, гайдуков и пандуров от Савы до Баната." #NT!
 nd_dnm_jesuit_colleges: "Конфессиональная граница" #NT!
 nd_dnm_jesuit_colleges_desc: "Контрреформация потеснила Дунай благодаря иезуитским колледжам Вены, Граца, Оломоуца и Тирнау, которые рекатолизировали и обучали возвращенных корон. Открывает Коллегию иезуитов." #NT!
 nd_dnm_donau_flottille: "Донау-флотилия" #NT!
 nd_dnm_donau_flottille_desc: "Имперская Дунайская военная флотилия: галеры «Чайке», сражавшиеся с речным флотом Османской империи от Коморна до Белграда. Открывает набор Чаике." #NT!
 nd_dnm_renewed_constitution: "Обновленная Конституция" #NT!
 nd_dnm_renewed_constitution_desc: "Verneuerte Landesordnung 1627 года: после Белой горы чешская корона стала наследственной Габсбургской, католической и управляемой немцами, а выборная монархия была отменена. Основной акт централизации составной монархии." #NT!
 nd_dnm_kuerassier: "Габсбург-Куэрассир" #NT!
 nd_dnm_kuerassier_desc: "Тяжелая домашняя кавалерия со стальной грудью, решающее ударное оружие императорской армии от Лютцена до османского поля. Открывает куэрассирский рекрут." #NT!
 nd_dnm_kaiserliche_armee: "Постоянная Имперская Армия" #NT!
 nd_dnm_kaiserliche_armee_desc: "Кайзерличная армия: первая постоянная многонациональная армия на континенте, финансируемая Хофкамерой и обучаемая Хофкригсратом. Открывает Имперский арсенал." #NT!
 nd_dnm_erblande_mercantilism: "Эрбландский меркантилизм" #NT!
 nd_dnm_erblande_mercantilism_desc: "Камерное освоение наследственных земель: шерстяная мануфактура в Линце, ртуть Идрии, штирийское железо Эрцберга отправлялось по Дунаю на рынки королевства." #NT!
 nd_dnm_pragmatic_sanction: "Прагматическая санкция" #NT!
 nd_dnm_pragmatic_sanction_desc: "Указ 1713 года, ратифицированный короной: земли Габсбургов переходят indivisibiliter ac inseparabililiter как одно тело к одному наследнику. Конституционный стержень Гезаммонархии." #NT!
 nd_dnm_theresian_reforms: "Терезианские реформы" #NT!
 nd_dnm_theresian_reforms_desc: "Реформа, последовавшая за потерей Силезии: объединенная казна, Директория и призывные кантоны, превратила составную монархию в административную машину." #NT!
 nd_dnm_theresianum: "Терезианум" #NT!
 nd_dnm_theresianum_desc: "Камерная академия, основанная в Вене в 1746 году для обучения многоэтнической бюрократии Гесамтмонархии единой административной руке и единому канцелярскому языку. Открывает Терезианум." #NT!
 nd_dnm_banat_colonization: "Колонизация Баната" #NT!
 nd_dnm_banat_colonization_desc: "Швабензуге: великое переселение отвоеванных, обезлюдевших Баната и Баки дунайско-швабскими колонистами после Пассаровицкого договора, восстанавливающее пустующую границу для обработки." #NT!
 nd_dnm_liechtenstein_artillery: "Лихтенштейнская артиллерия" #NT!
 nd_dnm_liechtenstein_artillery_desc: "Артиллерийская реформа принца Лихтенштейна Йозефа Венцеля: стандартизированная мобильная артиллерийская система, которая сделала Имперский поезд лучшей артиллерией в Европе. Открывает сбор для артиллерийского поезда." #NT!
 nd_dnm_grenzer_line: "Концивилизация" #NT!
 nd_dnm_grenzer_line_desc: "Преобразование регулярных линейных полков Фронтира: «Гренцеры», переделанные в обученную европейскую пехоту, нечто среднее между лёгким и линейным, ценившееся на всех театрах имперских войн." #NT!
 nd_dnm_united_chancellery: "Объединенная судебная канцелярия" #NT!
 nd_dnm_united_chancellery_desc: "Vereinigte Hofkanzlei: попытка объединить австрийскую и чешскую канцелярии в один административный орган, высшая точка проекта централизации." #NT!
 nd_dnm_danube_steam: "Дунайская паровая навигация" #NT!
 nd_dnm_danube_steam_desc: "Erste Donau-Dampfschiffahrts-Gesellschaft, пароходная компания, превратившая реку в хребет единой промышленной экономики Дуная от Регенсбурга до Железных ворот. Открывает Дунайскую паровую верфь." #NT!
  
  # ===== UNITS ===== 
 a_nd_dnm_huszar_levy: "Венгерский гусар" #NT!
 a_nd_dnm_huszar_levy_desc: "Легкая конница венгерской короны: быстрые, дальнобойные налетчики, рожденные в результате османской пограничной войны, грабящие и прикрывающие территории с такой скоростью, с которой не могла сравниться ни одна тяжелая кавалерия." #NT!
 a_nd_dnm_grenzer_levy: "Гренцер" #NT!
 a_nd_dnm_grenzer_levy_desc: "Солдаты-колонисты Военного Фронтира. Сербские, хорватские и валахские пограничники, мастера засад и перестрелок на пересеченной местности Сава-Дравы, сражающиеся легко и живущие на скудные средства." #NT!
 n_nd_dnm_tschaike_levy: "Чайке" #NT!
 n_nd_dnm_tschaike_levy_desc: "Мелкосидящая речная галера Дунайской военной флотилии с экипажем «Чайкистена», сражавшаяся с османским флотом от Коморна до Белграда." #NT!
 a_nd_dnm_kuerassier_levy: "Габсбург Куэрассир" #NT!
 a_nd_dnm_kuerassier_levy_desc: "Тяжелая домашняя кавалерия со стальной грудью, решающее ударное оружие Имперской армии: атака аристократов в доспехах, нанесенная на перелом линии." #NT!
 a_nd_dnm_artillery_train_levy: "Артиллерийский поезд Лихтенштейна" #NT!
 a_nd_dnm_artillery_train_levy_desc: "Стандартизированная мобильная имперская артиллерийская система реформы Лихтенштейна, лучшая артиллерия в Европе во времена наполеоновских войн." #NT!
  
  # ===== BUILDINGS ===== 
 nd_dnm_hofkammer_building: "Хофкамер" #NT!
 nd_dnm_hofkammer_building_desc: "Центральная судебная палата, Вена, 1527 г.: сокровищница, которая держала в своих руках палаты каждой короны. Финансовая основа Гезаммонархии." #NT!
 nd_dnm_donau_stapel: "Донау-Стапель" #NT!
 nd_dnm_donau_stapel_desc: "Основной дом на Дунае, где венское Stapelrecht заставляло каждое судно на реке разгружать груз и торговать, превращая реку в одну торговую артерию." #NT!
 nd_dnm_militaergrenze_building: "Милитаэргренце" #NT!
 nd_dnm_militaergrenze_building_desc: "Военный пограничный округ: поселения солдат-колонистов с наследственным землевладением для постоянной пограничной службы, крупнейшее военизированное общество в Европе раннего Нового времени." #NT!
 nd_dnm_jesuit_college: "Иезуитский колледж" #NT!
 nd_dnm_jesuit_college_desc: "Колледж Общества Иисуса (Вена, Грац, Оломоуц, Тырнау), двигатель Контрреформации и школа возвращенных корон." #NT!
 nd_dnm_imperial_arsenal: "Императорский Арсенал" #NT!
 nd_dnm_imperial_arsenal_desc: "Kaiserliches Zeughaus: центральный арсенал и литейный завод постоянной Имперской армии, где отливают пушки и хранят мушкеты трех корон." #NT!
 nd_dnm_theresianum_building: "Терезианум" #NT!
 nd_dnm_theresianum_building_desc: "Камерная академия Вены, 1746 год, обучавшая многонациональную бюрократию составной монархии в единой административной руке." #NT!
 nd_dnm_danube_steam_yard: "Дунайская паровая верфь" #NT!
 nd_dnm_danube_steam_yard_desc: "Работа Дунайской пароходной компании, превратившая реку в хребет единого промышленного дунайского хозяйства от Регенсбурга до Железных ворот." #NT!
  
  # ========================================================================== 
  # ===== DESTINY TREE ===== 
  # ========================================================================== 
  
  # ----- DESTINY ADVANCES ----- 
 nd_dnm_destiny: "Дунайская судьба" #NT!
 nd_dnm_destiny_desc: "Три короны скованы в одно царство; Каким станет королевство, еще не решено. Выбор основателя (оплот христианского мира или тотальная монархия) открывает путь, по которому династия проведет свои столетия." #NT!
 nd_dnm_dest_sava_line: "Долгая турецкая война" #NT!
 nd_dnm_dest_sava_line_desc: "Отожмите османскую границу до места слияния Савы и Дуная: постройте Милитаэргренце, затем возьмите Белград и Смедерево, ключи к линии реки, которую однажды будет удерживать Евгений Савойский (путь Антемурале)." #NT!
 nd_dnm_dest_balkan_drive: "Поездка на Балканы" #NT!
 nd_dnm_dest_balkan_drive_desc: "Проведите передовой отряд Гренцера через реки во внутренние районы Османской империи: Сараево в Боснии, Ниш на Мораве и Софию за Балканским хребтом, фактически приняв на вооружение доктрину Кляйнкрига — маленькую войну на приграничье. Оплот перешел в наступление." #NT!
 nd_dnm_dest_eastern_crusade: "Восточный крестовый поход" #NT!
 nd_dnm_dest_eastern_crusade_desc: "Оплотом становится победитель: возьмите дунайские княжества в Бухаресте и Тырговиште, доведите войну до самого Константинополя и оставьте государство султана разбитым или преклонившим колени перед Веной. Открывает бастион Антемурале." #NT!
 nd_dnm_dest_cameral_foundation: "Камеральный фонд" #NT!
 nd_dnm_dest_cameral_foundation_desc: "Централизация, измеряемая офисами, а не завоеваниями: охватите банковское дело и профессиональные армии и запустите Kameralhoheit, собственную бюрократию венского фиска, фактически работающую (путь Gesamtmonarchie)." #NT!
 nd_dnm_dest_united_treasury: "Объединенное казначейство" #NT!
 nd_dnm_dest_united_treasury_desc: "Хофкамера стала абсолютной: Венская судебная палата установила более трёх крон, а серебро Карпатских рудников стекало в один фиск." #NT!
 nd_dnm_dest_total_monarchy: "Полная монархия" #NT!
 nd_dnm_dest_total_monarchy_desc: "Вершина проекта централизации: стабильное, просвещенное, единоличное Дунайское государство с одновременной финансовой и конфессиональной опорой — Камералхохейтом и Реформационной комиссией. Открывает доступ к Государственной канцелярии. (Компромисс двойной монархии здесь не достигается: этот расчет относится к национальному вопросу.)" #NT!
 nd_dnm_dest_josephine_triumph: "Триумф Жозефины" #NT!
 nd_dnm_dest_josephine_triumph_desc: "Один патент, один код, от Влтавы до Тисы: единое административное государство завершилось, в котором историческая программа Иосифа II закончилась вничью, и то, что Объединенная канцелярия только пыталась, завершилось. Это невозможно для короны, которая уже потеряла составное королевство. Открывает реформу Единого патента." #NT!
 nd_dnm_dest_estates_endure: "Поместья выдержат" #NT!
 nd_dnm_dest_estates_endure_desc: "Другой ответ на тот же вопрос: право Золотой Быки быть спрошенным формализовано, а не отменено. Ландштенде, собственный аппарат сословных собраний, должен быть тем, кто действительно работает. Открывает доступ к реформе Сейма в Совете." #NT!
  
  # ----- DESTINY AMBITION LINES (allow custom_tooltips; the requirement is the advertisement) ----- 
 nd_dnm_amb_root_tt: "Союз держится вместе (Стабильность не менее 75)." #NT!
 nd_dnm_amb_sava_tt: "Граница построена, и Белград подчиняется Вене, а не Константинополю (корень судьбы взят)" #NT!
 nd_dnm_amb_balkan_tt: "Доктрина малой войны ведет Гренцера мимо рек в Боснию и долину Моравы (удерживается линия Савы и принимается доктрина Кляйнкрига)." #NT!
 nd_dnm_amb_crusade_tt: "Трон султана пустует или подчиняется Вене (Балканский путь завершен, а Османское государство больше не существует или является вашим подданным)" #NT!
 nd_dnm_amb_cameral_tt: "Распоряжение Хофкамеры фактически действует (корень судьбы взят, и бюрократия Камеральхохейта активна)" #NT!
 nd_dnm_amb_treasury_tt: "Серебро проходит через коронный фиск, а не через три (заложен Камеральный фонд и взят аванс Венской Хофкамеры)" #NT!
 nd_dnm_amb_total_tt: "И Фиск, и конфессиональная комиссия подчиняются одной руке (Объединенное казначейство сформировано; бюрократические аппараты Камеральхохейта и Реформационной комиссии активны)." #NT!
 nd_dnm_amb_patent_tt: "Один патент, один код, от Влтавы до Тисы (бюрократия Директория активна, и ни одно составляющее королевство не потеряно)" #NT!
 nd_dnm_amb_diet_tt: "Ландтаги сохраняют свое старое право на вопросы (бюрократия Ландштенде активна)." #NT!
  
  # ----- THE DANUBIAN RECKONING (age-6 capstone government reforms) ----- 
 nd_dnm_uniform_patent_reform: "Единый патент" #NT!
 nd_dnm_uniform_patent_reform_desc: "Единый административный кодекс и единый канцелярский язык во всех королевских землях, введенные патентом из Вены. То, что постановил Иосиф II и сословия отказались, эта корона прижилась.\n\nДарит +10% эффективности законодательства и +15% скорости ассимиляции; поместья дворян никогда не прощают отмены их привилегий." #NT!
 nd_dnm_diet_in_council_reform: "Сейм в Совете" #NT!
 nd_dnm_diet_in_council_reform_desc: "Старое право быть спрошенным, ius сопротивления Золотой Быки, оформленное как постоянный конституционный орган вместо отмены, введенной Пресбургом в 1687 году. Сеймы заседают в совете, и корона принимает законы вместе с ними, а не мимо них.\n\nДарит -8% сепаратизма и +10% лояльности подданных; законодательство короны замедляется, потому что с диетами действительно необходимо консультироваться." #NT!
  
  # ----- DESTINY DHE EVENTS ----- 
 nd_dnm.6.t: "Судьба Дуная" #NT!
 nd_dnm.6.d: "Царство создано, и сделан основополагающий выбор. Отсюда путь долгий: династия проведет столетия своего правления, воплощая в жизнь то, что было выбрано при ее основании. Суд понимает предстоящую работу и цели, которыми она будет измеряться." #NT!
 nd_dnm.6.d.hun: "Царство выковано, и его выковала Корона Святого Стефана. Самая старая из трех корон, та, чья Золотая Быка научила дворян праву на сопротивление, объединила Австрию и Богемию под своими собственными институтами. Предстоящий путь долог, и парламенты Венгрии будут ожидать вопросов на каждом его этапе. Суд понимает предстоящую работу и цели, которыми она будет измеряться." #NT!
 nd_dnm.6.d.boh: "Царство выковано, и его выковала Корона Святого Вацлава. Богемия вынесла свое избирательное достоинство за пределы Рейха, чтобы построить что-то большее на Дунае, и из-за этого коллегия, которую она покинула, не имеет права голоса. Путь впереди долгий. Суд понимает предстоящую работу и цели, которыми она будет измеряться." #NT!
 nd_dnm.6.a: "Пусть работа начнется" #NT!
 nd_dnm.7.t: "Граница восстановлена" #NT!
 nd_dnm.7.d: "Белград и Смедерево наши, и с ними впадает Сава-Дунай. Граница находится там, где ее однажды нарисовал Евгений Савойский: не укрепленная линия на карте, а восстановленная страна, ворота, откуда должна начаться любая дальнейшая война против Порты. Армия, которая это сделала, не устоит." #NT!
 nd_dnm.7.a: "Линия реки удерживается" #NT!
 nd_dnm.8.t: "Через реки" #NT!
 nd_dnm.8.d: "Острие пронеслось через реки во внутренние районы Османской империи. Сараево, долина Моравы, София за Балканским хребтом: оплот уже не щит, а клинок, вонзившийся в сердце Румелии. От того, как будет вестись война сейчас, будет зависеть, насколько далеко дойдет клинок." #NT!
 nd_dnm.8.a: "Штурмуйте пояс крепостей: осадите и разрушьте твердыни" #NT!
 nd_dnm.8.b: "Путь Гренцера: война передвижения, набегов и преследований" #NT!
 nd_dnm.9.t: "Меч христианского мира" #NT!
 nd_dnm.9.d: "Бухарест, Тырговиште и стены самого Константинополя. Работа по созданию оплота завершена: Дунайская монархия — это меч, который окончательно переломил ход Османской империи, главной католической державы Востока. Что значит столь полная победа?" #NT!
 nd_dnm.9.a: "Коронованный оплот: стоит над всем христианским миром" #NT!
 nd_dnm.9.b: "Воинство-завоеватель: армия, живущая за счет завоеваний" #NT!
 nd_dnm.10.t: "Камеральный фонд" #NT!
 nd_dnm.10.d: "Ни одна армия этого не выиграла. Новые административные знания того времени (банк, постоянная профессиональная армия, обследованные и освоенные земли) были введены в сферу и созданы офисы для их реализации. Гесамтмонархия теперь имеет бумажный корешек и гроссбух, а не гарнизоны." #NT!
 nd_dnm.10.a: "Офисы построены" #NT!
 nd_dnm.11.t: "Объединенное казначейство" #NT!
 nd_dnm.11.d: "Хофкамера становится абсолютной: одна казна на три кроны, полный военный сундук, серебро Кремницы и железо Эрцберга стекаются в единый фиск. Составная монархия впервые становится единым экономическим организмом. Как будет храниться новое богатство?" #NT!
 nd_dnm.11.a: "Коронный бюджет: доходы направляются прямо в центр" #NT!
 nd_dnm.11.b: "Рынок Дуная: река как единая интегрированная экономика" #NT!
 nd_dnm.12.t: "Полная монархия" #NT!
 nd_dnm.12.d: "Проект достигает своего апогея: богатое, стабильное, грамотное, просвещенное царство, управляемое из одних рук, поместья, связанные с машиной, а не выступающие против нее. Дунайское государство на протяжении одного поколения представляло собой практически единую современную монархию. Компромисс национальностей — это еще впереди расплата; это центральный инструмент, который должен предшествовать этому." #NT!
 nd_dnm.12.a: "Рука кинокамериста: поместья, сваренные в машину" #NT!
 nd_dnm.12.b: "Просвещенное государство: грамотное, обозреваемое, единоличное." #NT!
  
  # ----- CAPSTONE DHE EVENTS (nd_dnm.49 / .50) ----- 
 nd_dnm.49.t: "Патент вступил в силу" #NT!
 nd_dnm.49.d: "Курьеры несут один и тот же документ во все канцелярии от Влтавы до Тисы, и впервые в истории королевства все канцелярии подают его одинаково. Один кодекс, один язык управления, одна корона за обоими. То, что предписало поколение Иосифа и от чего отказались поместья, было выполнено. Палата Австрии, которая создала свое собственное избирательное достоинство, когда Рейх отказал ему в этом, теперь создала то, чего Рейху никогда не удавалось: государство, которое отвечает одним голосом." #NT!
 nd_dnm.49.d.hun: "Курьеры несут один и тот же документ во все канцелярии от Влтавы до Тисы, и впервые в истории королевства все канцелярии подают его одинаково. Один кодекс, один язык управления, одна корона за обоими. То, что именно Корона Святого Стефана (корона, Золотая Быка которой научила дворян праву на сопротивление) теперь лишила сопротивляющихся этой процедуры, является иронией, которую парламенты Венгрии будут пережевывать в течение столетия. Патент все равно соблюдается." #NT!
 nd_dnm.49.d.boh: "Курьеры несут один и тот же документ во все канцелярии от Влтавы до Тисы, и впервые в истории королевства все канцелярии подают его одинаково. Один кодекс, один язык управления, одна корона за обоими. Корона Святого Вацлава однажды отдала один из семи голосов на выборах в другой империи; он пришел к выводу, что единообразное управление собственными силами является лучшим использованием основополагающего достоинства. Патент вступил в силу." #NT!
 nd_dnm.49.a: "Один патент, один код, одна корона" #NT!
 nd_dnm.50.t: "Старые права сохранены" #NT!
 nd_dnm.50.d: "Диеты заседают в совете: не как просители, принимаемые по воле короны, а как орган самой конституции. Старое право быть спрошенным, которое другие суды отменили в течение многих лет, было сохранено и формализовано: корона принимает законы посредством ландтагов, а не мимо них. Палата представителей Австрии пришла к выводу, что королевство многих наций держится вместе дольше, когда с каждой из них официально проводятся консультации." #NT!
 nd_dnm.50.d.hun: "Диеты заседают в совете: не как просители, принимаемые по воле короны, а как орган самой конституции. Старое право быть спрошенным сохранено и формализовано, и никто не удивлен меньше, чем сеймы Венгрии: Корона Святого Стефана спорила со своей собственной Золотой Быком за пять столетий до того, как заключила этот союз, и она просто вписала свою старейшую привычку в конституцию всего Дуная." #NT!
 nd_dnm.50.d.boh: "Диеты заседают в совете: не как просители, принимаемые по воле короны, а как орган самой конституции. Старое право на вопрос было сохранено и формализовано. Корона святого Вацлава, чьи поместья однажды были разрушены днем ​​на Белой горе другой истории, выбрала быть короной, которая спрашивает, и ландтаги каждой земли короны отвечают." #NT!
 nd_dnm.50.a: "Корона спрашивает; ответ ландтагов" #NT!
  
  # ----- DESTINY TIMED MODIFIERS ----- 
 STATIC_MODIFIER_NAME_nd_dnm_dest_breaker_of_walls: "Разрушитель стен" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_breaker_of_walls: "Армия, штурмующая крепости балканского наступления: быстро перехватывающая инициативу, давно в ее досягаемости и закаленная традициями, завоеванными в каждом нарушении." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_grenzer_tide: "Прилив Гренцера" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_grenzer_tide: "Война передвижений и набегов проникла во внутренние районы Османской империи, пограничники быстры и преследуют их, хотя война, которая ведется на ходу, ослабляет власть короны над сельской местностью, которую она пересекает." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_sword_of_christendom: "Меч христианского мира" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_sword_of_christendom: "Оплот увенчался: дипломатическое влияние крупнейшей католической державы Востока, с трудом завоеванная слава ее армии прочна, ее престиж медленно угасает." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_conquering_host: "Завоевающее войско" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_conquering_host: "Армия, которая набирает и пополняет запасы на захваченных землях и размещает гарнизоны на том, что удерживает: двигатель продолжительной восточной войны." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_crown_fisc: "Корона Фиск" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_crown_fisc: "Доходы идут прямо в центральную казну: золото Карпатских рудников и налог на наследство в размере трех крон, хотя фиск-первая крона экономит на содержании своего артиллерийского поезда." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_danube_market: "Дунайский рынок" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_danube_market: "Река слилась в одно единое коммерческое тело: основная экономика трех корон, ее купцы и торговые центры несли единый дунайский рынок." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_cameralist_hand: "Рука фотоаппаратиста" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_cameralist_hand: "Сословия связаны с машиной, а не против нее: власть короны над королевством не ослабевает, а бюрократический аппарат обходится дешево." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_dest_enlightened_state: "Просвещенное государство" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_dest_enlightened_state: "Грамотное, исследованное, единоличное царство: школа Жозефины дошла до своего завершения, новое обучение эпохи было дешевым для принятия." #NT!
  
  # ----- DESTINY BUILDINGS ----- 
 nd_dnm_antemurale_bastion: "Бастион Антемурале" #NT!
 nd_dnm_antemurale_bastion_desc: "Великая приграничная крепость-арсенал оплота христианского мира: звездный форт класса Петервардейн и Белград с его магазином, шарниром, на котором вращается вся Османская война." #NT!
 nd_dnm_staatskanzlei: "Государственная канцелярия" #NT!
 nd_dnm_staatskanzlei_desc: "Государственная канцелярия: центральный орган тотальной монархии, аппарат, который формирует, хранит и управляет всем королевством из одной руки. Инструмент централизации, а не компромисса, который однажды может последовать за ним." #NT!
  
  # ----- DESTINY BUILDING MAINTENANCE PMs ----- 
 nd_dnm_bastion_maintenance: "Бастионный гарнизон" #NT!
 nd_dnm_bastion_maintenance_desc: "Постоянный гарнизон, артиллерийские расчеты и магазинные склады, поддерживающие в боевом порядке приграничную крепость-арсенал." #NT!
 nd_dnm_staatskanzlei_maintenance: "Сотрудники канцелярии" #NT!
 nd_dnm_staatskanzlei_maintenance_desc: "Клерки, регистраторы и канцелярские принадлежности центральной государственной канцелярии, управляющей всем королевством." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 nd_dnm_kameralhoheit_bureaucracy: "Камеральхохейт" #NT!
 nd_dnm_kameralhoheit_bureaucracy_desc: "Когда Фердинанд I сделал Венскую Хофкамеру независимой от Аулического совета в 1527 году, он объединил земельные палаты Нижней Австрии, Тироля, Богемии и Венгрии под одним фиском; Мария Терезия возвела его в высший орган управления финансами, горнодобывающей промышленностью и торговлей. Доходы земельных владений, которые когда-то голосовали и проверялись, теперь оценивались из Вены: бюджет, который охватывает добычу полезных ископаемых и торговлю для короны, но который распадается на клерков, ищущих ренты, и обесценившуюся чеканку монет, когда палата голодает." #NT!
 nd_dnm_geheime_konferenz_bureaucracy: "Гехайме Конференц" #NT!
 nd_dnm_geheime_konferenz_bureaucracy_desc: "При Леопольде I горстка доверенных магнатов, Conferenzminister, сформировала внутренний кабинет, который фактически решал вопросы войны, мира и династической политики, его секретари были набраны из австрийской и имперской канцелярий. Быстрый и тайный, он связал высшую аристократию с династией и полностью обошел Тайный совет в целом, но это была закрытая дверь в города, и, когда ею пренебрегали, она сворачивалась в гнездо фракции, которое тормозило всю работу в кабинете министров." #NT!
 nd_dnm_grenz_generalat_bureaucracy: "Гренц-Генералат" #NT!
 nd_dnm_grenz_generalat_bureaucracy_desc: "Начиная с Брукского конгресса 1578 года, земли Внутренней Австрии финансировали создание постоянного кордона; Генералаты Карловац и Вараждин управляли обществом сербских, хорватских и валахских солдат-колонистов, находившихся наследственной собственностью, освобожденных от налогов и терпимых, в обмен на пожизненную пограничную службу. Самоподдерживающаяся стена свободных ополченцев, подотчетных Вене, а не какому-либо сеньору, но неоплачиваемая, неуправляемая граница превращается в грабежи и дезертирство. Требуется Военная граница." #NT!
 nd_dnm_landstaende_bureaucracy: "Ландштенде дер Эрбланде" #NT!
 nd_dnm_landstaende_bureaucracy_desc: "Каждая из отдельных австрийских, чешских и венгерских придворных канцелярий в Вене сохраняла закон, язык и ландтаг своей короны; сеймы продолжали голосовать за налоги и рекрутов, а также защищать дворянские привилегии от абсолютистского давления, причем венгерский комитатус упорнее всех. Согласие возникает, когда сословия соблюдаются и закон проходит через сеймы; если пренебречь, диеты мешают, из них нужно выжать войну, и вся совокупность распадается." #NT!
 nd_dnm_directorium_bureaucracy: "Directorium in publicis et cameralibus" #NT!
 nd_dnm_directorium_bureaucracy_desc: "После Экс-ла-Шапель в 1749 году Фридрих Вильгельм фон Хаугвиц объединил австрийскую и чешскую канцелярии в один орган по связям с общественностью и финансами, сократил диету королевских земель и ввел единую десятилетнюю налоговую льготу для наследственных земель. Институциональный двигатель гезаммонархии: одна администрация над многими коронами, население ассимилируется в единое государство; но недостроенное единообразное государство — это лишь тяжёлая бумажная ноша и бурлящее раскулаченное дворянство. Требуется Объединенная судебная канцелярия." #NT!
 nd_dnm_reformationskommission_bureaucracy: "Реформационная комиссия" #NT!
 nd_dnm_reformationskommission_bureaucracy_desc: "Патенты Фердинанда II 1624–1627 гг. разрешали только католическую веру в Богемии и Внутренней Австрии; религиозные комиссии изгнали протестантское духовенство, в то время как иезуиты с Петером Пазмани на венгерской стороне монополизировали высшее образование и рекатолизировали возвращенные земли. Конфессиональное единство воспитало лояльную клерикальную элиту и подкрепило династическую легитимность, но аппарат принуждения без поддерживающих его колледжей просто порождает недовольство в городах и враждебную коалицию за рубежом. Требуется католический правитель." #NT!
  
  # The auto-modifier governing the bureaucracy slot grant on formation 
 AUTO_MODIFIER_NAME_nd_dnm_bureaucracy_authority: "Бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_dnm_bureaucracy_authority: "Создав Дунайскую монархию, [ROOT.GetName] получает право размещать исторические институты составного государства Габсбургов." #NT!
  
  # ===== CRISIS: variable tooltips (event-variable hygiene) ===== 
 nd_dnm_grace_tt: "Дунайское государство создано заново: его кризисы еще не успели собраться" #NT!
 nd_dnm_nq_resolved_tt: "Национальный вопрос решен." #NT!
 nd_dnm_ausgleich_reached_tt: "Компромисс с национальностями достигнут." #NT!
 nd_dnm_nq_reasserted_tt: "Центральная власть была восстановлена ​​над национальностями." #NT!
 nd_dnm_nq_control_target_tt: "Степень контроля, которую должна восстановить корона, чтобы справиться с кризисом" #NT!
 nd_dnm_ps_resolved_tt: "Война за престолонаследие подошла к концу" #NT!
 nd_dnm_ps_upheld_tt: "Прагматическая санкция была оставлена ​​в силе" #NT!
 nd_dnm_ps_ceded_tt: "Королевство предпочло уступить условия вместо того, чтобы доводить войну за престолонаследие до конца." #NT!
 nd_dnm_reich_humbled_tt: "Вердикт Рейха против Дунайского государства был нарушен на поле боя" #NT!
 nd_dnm_reich_reconciled_tt: "Император официально принял примирение Дунайского государства." #NT!
 nd_dnm_reich_endured_tt: "Отчуждение просто пережили: державы привыкли к дунайскому государству." #NT!
 nd_dnm_succession_groundwork_tt: "Основу неделимой преемственности заложили диеты." #NT!
 nd_dnm_decree_ratified_tt: "Декрет о неделимости был ратифицирован короной за короной." #NT!
 nd_dnm_chain_30_pending_tt: "В суде пока не стоит открытый вопрос о наследстве" #NT!
 nd_dnm_chain_31_pending_tt: "Сеймы королевских земель еще не отправили свое совместное посольство по вопросу о престолонаследии." #NT!
 nd_dnm_chain_32_pending_tt: "Канцелярии еще не подготовили проект указа о неделимости." #NT!
 nd_dnm_chain_30_fired_tt: "Поднят вопрос о наследстве" #NT!
 nd_dnm_chain_31_fired_tt: "Сеймы высказались о преемственности" #NT!
 nd_dnm_chain_32_fired_tt: "Постановление было рассмотрено." #NT!
 nd_dnm_pariah_timer_tt: "Отчуждению с Рейхом еще не исполнилось полвека." #NT!
  
  # ===== CRISIS: disaster / situation display names ===== 
 nd_dnm_nationalities_question: "Национальный вопрос" #NT!
 nd_dnm_nationalities_question_desc: "Многоязычная империя, правящий дом которой управляет лоскутным одеялом народов, а не одной нации. Напряжение управления многими языками из одной венской канцелярии стало невыносимым." #NT!
 nd_dnm_pragmatic_sanction_crisis: "Война за наследство" #NT!
 nd_dnm_pragmatic_sanction_crisis_desc: "Неделимое наследство оспаривается силой. Державы, которые на бумаге гарантировали прагматическую санкцию, теперь настаивают на своих требованиях с помощью армий, и против династии собирается коалиция. Королевство должно объединить входящие в его состав короны, купить или разрушить фракцию претендента и привлечь иностранные суды на сторону Санкции или принять сломанное наследство.\n\n@arrow_bonus_tier_2! Доведите жетон уверенности короны до цели в ежемесячных событиях, чтобы завершить их на ветке #bold Поддержано#!.\n@arrow_bonus_tier_1! Если вы позволите ему упасть до -30 или уступите его через «Претензия соперника», он закончится #bold Broken#!.\n@arrow_bonus_tier_1! Любая резолюция закрывает ситуацию [GetSituationByKey('nd_dnm_reaction_of_the_reich').GetName] на пути легитимности." #NT!
 nd_dnm_reaction_of_the_reich: "Реакция Рейха" #NT!
 nd_dnm_reaction_of_the_reich_desc: "Император и Курия не простили разрыва. Дунайское государство находится за пределами рейха, которое оно покинуло." #NT!
 nd_dnm_reaction_of_the_reich_tt: "Рейх и Курия избегают Дунайского государства до тех пор, пока не будет найдено примирение." #NT!
  
  # ===== CRISIS: modifier names / descriptions ===== 
 STATIC_MODIFIER_NAME_nd_dnm_reich_pariah: "Избегаемый Рейхом" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_reich_pariah: "Император и курия относятся к дунайскому отступнику как к изгою." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_austria_hungary: "Австро-Венгрия" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_austria_hungary: "Компромисс: два равных королевства, одна династия. Национальности связаны в империю согласием, а не штыком." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_centralized_reassertion: "Единое государство" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_centralized_reassertion: "Диеты нарушены, а правила сделаны едиными в Вене, ценой длительного резервуара негодования." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_fractured_realm: "Расколотое царство" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_fractured_realm: "Корона выскользнула из рук династии; составной орган теряет легитимность и сплоченность." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_sanction_vindicated: "Индивидибилитер и несепарабилитер" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_sanction_vindicated: "Прагматические санкции направлены против всего мира с оружием в руках; неделимое наследство теперь не подлежит сомнению." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_sanction_broken: "Нарушенная санкция" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_sanction_broken: "Война за наследство оторвала территорию и престиж королевства; неделимое наследство в конце концов оказалось делимым." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_sanction_ceded: "Санкция принята" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_sanction_ceded: "Корона согласовала условия, пока у нее еще были карты, которые стоит разыграть. Более скромное урегулирование, чем победа, но сеймы помнят, что Вена знала, когда остановиться, и королевство согнулось, а не сломалось." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_danubian_recognition: "Признание Дуная" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_danubian_recognition: "Император принял дань и зачитал вслух формулы примирения. Дунайское государство формально снова является силой среди держав, и корона, умеющая положить конец ссоре с императором, — это корона, с которой стоит обращаться." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_danube_endures: "Дунай выстоит" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_danube_endures: "Никакого договора, никакого оправдания: мир просто привык к великой державе, существующей за пределами старого имперского порядка. Половина переворота лет изгоя, заработанных тем, что они пережили их." #NT!
  
  # ===== SUCCESSION CHAIN MODIFIERS (nd_dnm.30/.31/.32) ===== 
  # Five modifiers covering the 3-step chain (one perpetual at step 1, two 
  # choice-driven at steps 2 and 3). All are removed in the disaster on_end 
  # and the situation on_ended: they never outlive their narrative. 
 STATIC_MODIFIER_NAME_nd_dnm_succession_anxiety: "Открытый вопрос" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_succession_anxiety: "Преемственность династии не решена. В Пеште и Праге магнаты спрашивают: когда этот монарх умрет, куда пойдет наследство? Стоимость небольшая и постоянная." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_rallying_the_diets: "Объединение диет" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_rallying_the_diets: "Суд решил решить вопрос о наследстве открыто, путем исполнения и покровительства. Легитимность повышается вместе с работой, но само сплочение в некоторых кругах ощущается как давление." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_royal_silence: "Королевское молчание" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_royal_silence: "Суд отказывается торопиться с вынесением решения о наследовании. Царство воспринимает молчание как слабость." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_drafting_the_decree: "Разработка указа" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_drafting_the_decree: "Канцелярии добиваются официальной ратификации посредством патента: работа демонстрирует административную эффективность, а публичный ответ на вопрос о наследстве обеспечивает стабильную каплю легитимности." #NT!
 STATIC_MODIFIER_NAME_nd_dnm_postponed_decree: "Указ отложен" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_postponed_decree: "Указ был составлен, но отложен для более мудрого правления. Королевство расценивает отсрочку как неспособность решить вопрос." #NT!
  
  # ===== REICH PRESSURE COOLDOWN ===== 
 STATIC_MODIFIER_NAME_nd_dnm_reich_pressure_recent: "Имперское давление" #NT!
 STATIC_MODIFIER_DESC_nd_dnm_reich_pressure_recent: "Имперские князья и Курия работают против Дунайского государства: кратковременное закручивание гаек поверх постоянного дебаффа парии." #NT!
  
  # ===== CRISIS: events ===== 
 nd_dnm.13.t: "Национальный вопрос" #NT!
 nd_dnm.13.d: "Мадьяры, чехи, хорваты, немцы, поляки, румыны, итальянцы: династия правит ими всеми и не является никем из них. От Пешта до Праги сеймы шевелятся, каждая требует своего языка, своего закона, своей нации. Империя — это лицо короны и ничего больше, и этого уже недостаточно." #NT!
 nd_dnm.13.a: "Кризис настиг нас" #NT!
 nd_dnm.14.t: "Диета бросает вызов Вене" #NT!
 nd_dnm.14.d: "Один из парламентов королевских земель отказывается от сборов и налогов до тех пор, пока не будут подтверждены его древние свободы. Канцелярия ожидает ответа суда." #NT!
 nd_dnm.14.a: "Подавляем диету: корона не торгуется" #NT!
 nd_dnm.14.b: "Признайте свою автономию: пусть королевство ослабнет" #NT!
 nd_dnm.15.t: "Предлагаемый компромисс" #NT!
 nd_dnm.15.d: "Умеренные с обеих сторон заключают соглашение: равные владения под властью одной династии, каждая нация со своей собственной администрацией, связанной личностью монарха и общей армией. Во всем, кроме названия, это Ausgleich, и его можно проводить только в том случае, если для его проведения существует центральный аппарат или добрая воля сословий." #NT!
 nd_dnm.15.a: "Примите компромисс: двойное царство" #NT!
 nd_dnm.15.b: "Отказ: корону не уполовинят" #NT!
 nd_dnm.16.t: "Разрушить националистические лиги" #NT!
 nd_dnm.16.d: "Контроль был восстановлен на родных землях. Лиги, которые способствовали кризису, теперь могут быть разбиты по деталям, если у суда будет воля." #NT!
 nd_dnm.16.a: "Раздавите их: восстановите единообразную корону" #NT!
 nd_dnm.16.b: "Еще нет: хват недостаточно крепкий" #NT!
 nd_dnm.17.t: "Аусглейх" #NT!
 nd_dnm.17.d: "Это сделано. Два равноправных королевства, один коронованный глава, одна армия, одна внешняя политика: Австро-Венгрия. Народы объединяются в империю по согласию, и ее составное тело, вопреки всем пророчествам, сохраняется." #NT!
 nd_dnm.17.a: "Indivisibiliter ac inseparabililiter, по согласию" #NT!
 nd_dnm.18.t: "Единое государство" #NT!
 nd_dnm.18.d: "Сеймы распущены, канцелярии объединены, один закон и один язык навязаны из Вены. Царство целое и послушное, и оно не забудет того, что у него отняли." #NT!
 nd_dnm.18.a: "Одна корона, одно правило" #NT!
 nd_dnm.19.t: "Переломы Царства" #NT!
 nd_dnm.19.d: "Хватка династии рухнула. Корона пошла своим путем, а остальные смотрят, смогут ли они последовать ее примеру. Составная монархия ослабевает и расшатывается." #NT!
 nd_dnm.19.d.hun: "Хватка династии рухнула. Корона Святого Стефана создала этот союз, а его институты узаконили его: Венгрия не может отделиться от самой себя. Богемия идет своим путем, а остальные наблюдают, смогут ли они последовать ее примеру. Составная монархия ослабевает и расшатывается." #NT!
 nd_dnm.19.d.boh: "Хватка династии рухнула. Корона святого Вацлава создала этот союз, а его институты узаконили его: Богемия не может отделиться от самой себя. Венгрия идет своим путем, а остальные наблюдают, смогут ли они последовать ее примеру. Составная монархия ослабевает и расшатывается." #NT!
 nd_dnm.19.a: "Держи то, что осталось" #NT!
 nd_dnm.20.t: "Война за наследство" #NT!
 nd_dnm.20.d: "Монарха больше нет, а титул наследника оспаривается. Державы, подписавшие Прагматическую санкцию, теперь восприняли ее как приглашение. Армии движутся по неделимому наследству со всех границ." #NT!
 nd_dnm.20.a: "Царство будет защищено" #NT!
 nd_dnm.21.t: "Санкция оправдана" #NT!
 nd_dnm.21.d: "Наследство сохранилось. То, что было гарантировано на бумаге, было гарантировано кровью, и ни одна сила не станет легкомысленно снова подвергать испытанию неделимое царство." #NT!
 nd_dnm.21.d.welded: "Наследство сохранилось. То, что было гарантировано на бумаге, было гарантировано кровью, и теперь бумага становится царством. Составляющие короны, стоявшие под Дунайской короной в качестве младших и вассалов, утвердили Санкцию своими собственными сеймами, и между ними и Веной не осталось ничего, кроме администрации: их земли, их поместья и их ссоры с этого дня принадлежат королевству. Indivisibiliter ac inseparabililiter — уже не девиз, а карта." #NT!
 nd_dnm.21.a: "Индивидибилитер и неразделимость" #NT!
 nd_dnm.22.t: "Санкции нарушены" #NT!
 nd_dnm.22.d: "В конце концов наследство оказалось делимым. Территория и положение были ценой оспариваемой короны; царство выстояло, уменьшилось и унижено." #NT!
 nd_dnm.22.d.ceded: "В конце концов, наследство оказалось делимым, но раздел подписала собственная рука короны. Условия обсуждались, пока еще было о чем вести переговоры; Силы взяли свою цену и пошли домой. Королевство выстояло, униженное, но не сломленное, и сеймы помнят, что Вена знала, когда остановиться." #NT!
 nd_dnm.22.a: "Спасти то, что можно спасти" #NT!
 nd_dnm.22.b: "Это была подпись короны и ее выбор." #NT!
 nd_dnm.23.t: "Подан иск конкурента" #NT!
 nd_dnm.23.d: "Иностранный суд выдвигает иск претендента и собирает союзников для его обеспечения. Наследование превращается в коалиционную войну.\n\n#bold Уверенность Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.23.a: "Сопротивляйтесь оружием: война затягивается" #NT!
 nd_dnm.23.b: "Обсудите условия: уступите то, что должно быть уступлено; завершает кризис на Сломанной ветке" #NT!
  
  # ===== PRAGMATIC SANCTION DISASTER EVENTS (nd_dnm.40-.47) ===== 
  # Counter-mechanic events fired from the disaster's on_monthly. Every 
  # event's desc surfaces the current Crown Confidence so the player sees 
  # progress in-event, not only on the disaster panel. 
  
 nd_dnm.40.t: "Прошение о лояльности по наследству" #NT!
 nd_dnm.40.d: "Магнат одной из возвращенных корон отправляет эмиссара в Вену. За почетную сумму (в монетах, а не в виде патента) его графство объявит о неделимом наследовании и приведет с собой трех соседних лордов. Кошелёк династии — это цена публичного ответа на вопрос о наследстве.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.40.a: "Не жалейте денег: купите всю фракцию" #NT!
 nd_dnm.40.b: "Умеренная сумма: только господин" #NT!
 nd_dnm.40.c: "Отказ: династия верностью не покупается" #NT!
  
 nd_dnm.41.t: "Иностранный суд рассматривает вопрос о признании" #NT!
 nd_dnm.41.d: "В Вену прибыл посланник одной из европейских канцелярий с предложением: санкция будет признана при его дворе, если дипломатические уступки будут достаточно большими. Признание даже одной крупной державы лишит коалицию уверенности.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.41.a: "Полные уступки: признание покупается сразу" #NT!
 nd_dnm.41.b: "Легкие уступки: разумный обмен" #NT!
 nd_dnm.41.c: "Отказ: династия не сведется к просителю" #NT!
 nd_dnm.42.t: "Восстание самозванцев в провинциях" #NT!
 nd_dnm.42.d: "Фракция претендента собрала вооруженные силы в одной из родных провинций. Мировые судьи сбежали. На восстание нужно ответить: мечом, амнистией или ценой игнорирования.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.42.a: "Подавить восстание оружием" #NT!
 nd_dnm.42.b: "Объявите амнистию: купите лидеров, пощадите солдат" #NT!
 nd_dnm.42.c: "Игнорируйте: есть более крупные пожары, которые нужно тушить." #NT!
  
 nd_dnm.43.t: "Санкционный тур" #NT!
 nd_dnm.43.d: "Монарху настоятельно рекомендуется покинуть Вену и лично совершить поездку по королевским землям: Праге, Прессбургу, Буде, лично представив дело династии сеймам и магнатам. Путешествующий двор стоит дорого, но символика не имеет себе равных.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.43.a: "Щедрый прогресс: полная пышность, полная свита." #NT!
 nd_dnm.43.b: "Скромный прогресс: только визит" #NT!
 nd_dnm.43.c: "Суд не перенесут из Вены" #NT!
  
 nd_dnm.44.t: "Дефекты короны" #NT!
 nd_dnm.44.d: "Один из учредительных парламентов проголосовал за объявление недействительной прагматической санкции на своей территории; присутствовали иностранные эмиссары. Это публичное нарушение неделимого наследства и самое дорогое событие, которое может произвести катастрофа.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.44.a: "Отправьте армию: приведите диету под имперский стандарт" #NT!
 nd_dnm.44.b: "Расплатитесь с диетой: выкупите ее обратно" #NT!
 nd_dnm.44.c: "Признайте принцип: отступничество остается" #NT!
  
 nd_dnm.45.t: "Иностранный суд спонсирует претендента" #NT!
 nd_dnm.45.d: "Соперничающая держава официально финансировала претендента на династию. Субсидии, признание, возможно, договор о взаимной гарантии с фракцией претендента: война обрела иностранного покровителя.\n\n#bold Доверие Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.45.a: "Контрдавление: наши дипломаты отвечают тем же" #NT!
 nd_dnm.45.b: "Терпеть: дипломатия ничего не может сделать" #NT!
  
 nd_dnm.46.t: "Прилив поворачивается" #NT!
 nd_dnm.46.d: "Настойчивость династии читается по всей Европе. Магнаты, которые колебались, сплотились; иностранные суды читают комнату и отступают от фракции претендента. Преемственность больше не вызывает сомнений на каждом пороге.\n\n#bold Уверенность Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.46.a: "Династия держит" #NT!
  
 nd_dnm.47.t: "Коалиция усиливается" #NT!
 nd_dnm.47.d: "Новая власть присоединилась к коалиции против наследства. Под знамена претендента пришли дипломаты еще трех судов; субсидии удваиваются. Положение династии истекает кровью.\n\n#bold Уверенность Короны:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]" #NT!
 nd_dnm.47.a: "Терпите: шторм еще не в самой худшей форме" #NT!
  
  # ===== THE PROVINCES MURMUR (nd_dnm.48): Nationalities Question forewarning ===== 
 nd_dnm.48.t: "Провинции ропщут" #NT!
 nd_dnm.48.d: "Отчеты, поступающие в суд, по отдельности невелики, но в совокупности безошибочны. Петиции на языках, которые должна переводить канцелярия. Диеты, которые отвечают медленно, или старые формулы, которые ничего не уступают. В налоговых ведомостях целые деревни фиксируются как ушедшие в лес. Ничто из этого не является бунтом. Все это представляет собой сложную сферу, тихо спрашивающую, нужно ли по-прежнему подчиняться Вене.\n\nНедовольства можно было бы решить сейчас, за реальные деньги, пока они все еще остаются петициями. Или суд может судить об этой погоде, а не о климате, и это может быть даже правильно." #NT!
 nd_dnm.48.a: "Решите жалобы сейчас: платите, пока они еще подают петиции." #NT!
 nd_dnm.48.b: "Пусть это пройдет: царство всегда шептало" #NT!
 nd_dnm.25.t: "Из Рейха" #NT!
 nd_dnm.25.d: "Короны Дуная вышли из состава Священной Римской империи, и было установлено имперское достоинство. Избиратели негодуют, Курия бормочет об отступничестве, а дунайское государство стоит в одиночестве в холоде, созданном им самим." #NT!
 nd_dnm.25.a: "Пусть они бушуют" #NT!
 nd_dnm.26.t: "Дунайское отступничество" #NT!
 nd_dnm.26.d: "Слухи доходят до императорского и папского дворов: Палата вырвала у Рейха три короны и образовала отдельную империю. Это не будет забыто." #NT!
 nd_dnm.26.d.boh: "Известие доходит до императорского и папского двора: Корона Богемии (один из семи голосов выборщиков, установленных самой Золотой буллой) вырвала три короны у Рейха и образовала отдельную империю. В настоящее время в коллегии выборщиков не хватает члена-учредителя. Из всех способов, которыми это могло произойти, Рейх меньше всего может притвориться и простить именно этот." #NT!
 nd_dnm.26.d.hun: "Слухи доходят до императорского и папского дворов: Корона Святого Стефана (корона, которая вообще никогда не присутствовала в избирательной структуре Рейха) вырвала Австрию и Богемию из Империи и построила свою собственную империю на Дунае. Посторонний скрылся с двумя коронами Рейха. Это не будет забыто." #NT!
 nd_dnm.26.d.hab: "Слухи доходят до императорского и папского двора: Австрийский дом (династия, единственной претензией которой на избирательное достоинство была поддельная Privilegium maius, которую сам Карл IV отказался подтвердить) вырвала у Рейха три короны и объявила себя отдельной империей. Фальсификаторы привилегий теперь создали империю. Это не будет забыто." #NT!
 nd_dnm.26.a: "Это не будет забыто" #NT!
 nd_dnm.27.t: "Прессы Рейха" #NT!
 nd_dnm.27.d: "Имперские князья и Курия терпеливо работают против дунайского государства: изоляция в парламентах, холодное отношение в канцеляриях, претензии, нашептываемые врагам. В данный момент ничего не остается делать, кроме как стерпеть это и помнить, что раскол закроется только тогда, когда королевство ответит на вопрос о преемственности, сломит Императора в бою, купит его примирение данью или просто переживет отчуждение." #NT!
 nd_dnm.27.a: "Погода это" #NT!
 nd_dnm.29.t: "В фильме «Из холода»" #NT!
 nd_dnm.29.d: "Отчуждение закончилось. Рейх и Курия, неохотно, относятся к дунайскому государству как к силе среди держав, а не как к отступнику." #NT!
 nd_dnm.29.d.reconciled: "Посольство возвращается из императорского двора с печатями, а не с насмешками. Дань получена, формулы примирения зачитаны вслух, и дунайское государство признано: не то чтобы прощено, но получено. Канцелярии Европы в течение сезона отмечают: Дунай — это сила, с которой обращаются, а корона, сумевшая положить конец ссоре с императором, — это корона, которую стоит иметь в качестве друга." #NT!
 nd_dnm.29.d.endured: "Ни один договор не был подписан, и ни одно сражение не было выиграно. Отчуждение просто состарилось, а затем стало странным. Пятьдесят лет посольств принимали где-то еще, браки все равно заключались, купцы никогда не спрашивали, и однажды утром канцелярии Европы замечают, что они годами обращались с дунайским государством как с силой среди держав, не принимая при этом решения. То, что терпит, есть." #NT!
 nd_dnm.29.a: "Подсчет закрыт." #NT!
  
  # ===== SUCCESSION QUESTION CHAIN (nd_dnm.30 / .31 / .32) ===== 
  # The 3-event narrative arc that primes the Pragmatic Sanction disaster. 
  # Fires at years 2 / 5 / 8 post-formation. 
 nd_dnm.30.t: "Вопрос о наследстве" #NT!
 nd_dnm.30.d: "Царство новое, и преемственность династии не решена. От венгерских уездных сеймов до богемских поместий возникает вопрос: когда этот монарх умрет, куда пойдет неделимое наследство? У суда пока нет ответа, и европейские державы начинают прислушиваться.\n\nСеймы трех корон не будут молчать об этом. Решение, которое династия примет или откажется принять, будет определять предстоящую войну за престолонаследие." #NT!
 nd_dnm.30.a: "Вопрос открыт" #NT!
 nd_dnm.31.t: "Диеты ропщут" #NT!
 nd_dnm.31.d: "Венгерский комитатус и Богемский ландтаг направили совместное посольство в Вену. Венгры цитируют Aurea Bulla; богема — обновленная конституция; оба спрашивают, что станет с неделимым царством, когда корона перейдет из рук в руки. Суд должен ответить на них, иначе ему ответят.\n\n#bold Выбранный здесь путь читается иностранными канцеляриями и закладывает основу авторитета династии, когда начинается война за престолонаследие.#!" #NT!
 nd_dnm.31.a: "Сплотить поместья вокруг династии" #NT!
 nd_dnm.31.b: "Суд не будет торопиться" #NT!
 nd_dnm.32.t: "Указ подготовлен" #NT!
 nd_dnm.32.d: "Канцелярские служащие подготовили указ: земли Габсбургов переходят #italic indivisibiliter ac inseparabililiter#! (неделимые и неотделимые) как одно тело к единственному наследнику, дочери или сыну. Подпись принадлежит только суду. Ратифицировать его сейчас — значит провести линию наследования собственноручно династией; оставить его на следующее правление — значит оставить вопрос европейским державам, которые должны ответить армиями.\n\n#bold Решение здесь либо дает династии сильную возможность, когда начнется война за наследство, либо оставляет ее в обороне.#!" #NT!
 nd_dnm.32.a: "Ратифицировать патентом СЕЙЧАС" #NT!
 nd_dnm.32.b: "Указ может подождать более мудрого правления" #NT!
  
  # ===== STRENGTH PATH VICTORY (nd_dnm.33) ===== 
  # Fired by the situation's on_monthly when DNM hits >= 80% war score vs 
  # the HRE leader. The flag has already been set; this event is the 
  # player-facing flavor moment. 
 nd_dnm.33.t: "Рейх смирился" #NT!
 nd_dnm.33.d: "На поле приговор был отменен. [GetUniqueInternationalOrganization('hre').GetLeaderTitle], объявивший имперский запрет на Дунайское государство, теперь требует условий; имперские принцы, которые шептали против нас на сеймах, обнаруживают, что их слова потеряли вес. Годы изгоев прошли: силы, назвавшие нас отступниками, назовут нас силой." #NT!
 nd_dnm.33.a: "Вердикт нарушен" #NT!
  
  # ===== CRISIS: situation hint (drives the Hints lateral view) ===== 
 hint_nd_dnm_reaction_of_the_reich: "[GetSituationByKey('nd_dnm_reaction_of_the_reich').GetNameWithNoTooltip] Подсказки" #NT!
 hint_nd_dnm_reaction_of_the_reich_hint_text: "$hint_nd_dnm_reaction_of_the_reich_hint_text_1$\n\n$hint_nd_dnm_reaction_of_the_reich_hint_text_2$" #NT!
 hint_nd_dnm_reaction_of_the_reich_hint_text_1: "Выйдя из Священной Римской империи, чтобы создать Дунайскую империю, мы нажили врагов Рейху и Курии. [GetUniqueInternationalOrganization('hre').GetLeaderTitle] теперь сдерживает против нас [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e], и мы страдаем от модификатора $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$, пока разлом не закроется." #NT!
 hint_nd_dnm_reaction_of_the_reich_hint_text_2: "#T Четыре доступных выхода:#!\n@arrow_bonus_tier_2! #bold Легитимность:#! Цепочка вопросов о наследии будет активироваться автоматически в течение первого десятилетия существования королевства (выбор цепочки существенно повлияет на последующую катастрофу). Когда происходит катастрофа [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] и ОКОНЧАЕТСЯ (поддержано или разрушено), вердикт Рейха об изгое становится спорным. #bold Если Санкция ПОДДЕРЖИВАЕТСЯ, любая учредительная корона, все еще удерживаемая в качестве субъекта или младшего союза, полностью приваривается к королевству#!: indivisibiliter ac inseparabililiter, на карте.\n@arrow_bonus_tier_2! #bold Сила:#! Победите [GetUniqueInternationalOrganization('hre').GetLeaderTitle] в войне, набрав в войне #!\n@arrow_bonus_tier_2!0 не менее 80%#!. Вердикт оружия нарушает вердикт диеты.\n@arrow_bonus_tier_2! #bold Примирение:#! Подайте в суд на заседание [GetUniqueInternationalOrganization('hre').GetLeaderTitle] о примирении: дипломатическое действие с данью в размере #!\n@arrow_bonus_tier_2!0 двухлетнего дохода#!. Слабый, рассеянный или доброжелательный Император более восприимчив; Бегство избирателя-основателя – это обида, которую труднее всего простить. Отказ стоит престижа и #!\n@arrow_bonus_tier_2!0 10-летнего#! года ожидания.\n@arrow_bonus_tier_2! #bold Выносливость:#! Пережить отчуждение: через #!\n@arrow_bonus_tier_2!0 50 лет#! после формирования, если королевство достигло #!\n@arrow_bonus_tier_2!0 легитимности 60+#! и #!\n@arrow_bonus_tier_2!0 престижа 50+#!, державы Европы больше не рассматривают Дунай как отступник.\n@arrow_bonus_tier_1! Одного только времени недостаточно: путь выносливости требует уважаемого состояния.\n@arrow_bonus_tier_1! Корона, союзная интеграция которой уже была ЗАВЕРШЕНА, когда монархия была выкована, вошла в царство при формировании; уступленная или отмененная санкция оставляет оставшиеся короны младшими, а медленная интеграция профсоюза становится долгим путем назад." #NT!
  
  # ===== SITUATION PANEL ===== 
  # The panel is visible to ALL countries: the headers and Description / 
  # End Requirements cards are universal; the DNM and Emperor cards toggle 
  # based on the viewing player's identity. 
  
  # Top-bar counter labels. 
 nd_dnm_chain_header: "Цепочка преемственности" #NT!
 nd_dnm_confidence_header: "Корона уверенности" #NT!
  
  # Two-party strength card tooltips (DNM vs HRE Emperor). 
  # Vanilla hussite_wars uses a concise "Strength X%" form (see vanilla "Сила Х%" #NT!
  # BOH_STR_TT). Same pattern here so the text fits the card width. 
 nd_dnm_two_party_dnm_str: "Сила [GetCountry('DNM').GetRelativeMilitaryStrength(GetUniqueInternationalOrganization('hre').GetLeaderCountry.Self)|V2%]" #NT!
 nd_dnm_two_party_emperor_str: "Сила [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetRelativeMilitaryStrength(GetCountry('DNM').Self)|V2%]" #NT!
  
  # Description card (universal). 
 nd_dnm_reaction_of_the_reich_situation_header: "Отчуждение" #NT!
 nd_dnm_reaction_of_the_reich_situation_body: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] и Курия считают Дунайское государство отступническим. Пока эта ситуация активна:\n\n@arrow_bonus_tier_1! Дунайское государство получает модификатор $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$.\n@arrow_bonus_tier_1! [GetUniqueInternationalOrganization('hre').GetLeaderTitle] удерживает [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] против Дуная.\n@arrow_bonus_tier_1! Запрограммированная цепочка вопросов о преемственности длится в течение первого десятилетия и запускает внутренний кризис преемственности.\n@arrow_bonus_tier_1! Имперское давление время от времени усиливается, применяя к Дунайскому государству кратковременный модификатор.\n\nТри зарабатываемых выхода:\n@arrow_bonus_tier_2! #bold Легитимность:#! разрешите катастрофу [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] (поддержанную или сломанную).\n@arrow_bonus_tier_2! #bold Сила:#! дунайское государство побеждает от [GetUniqueInternationalOrganization('hre').GetLeaderTitle] до 80% военного счета.\n@arrow_bonus_tier_2! #bold Выносливость:#! Прошло 50 лет после образования И Дунайское государство имеет легитимность 60+, престиж 50+." #NT!
  
  # DNM perspective card (visible only if SituationView.GetPlayer IS DNM). 
 nd_dnm_panel_dnm_header: "Что вы должны сделать" #NT!
 nd_dnm_panel_dnm_body: "Вы отступник; приговор будет отменен, только если вы примете меры.\n\n@arrow_bonus_tier_2! #bold Легитимность#!: ответьте на Вопрос о Наследии (2/5/8 годы), затем урегулируйте [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')]: Доверие Короны до #Y 80#!, или #Y -30#!, или уступите.\n@arrow_bonus_tier_2! #bold Сила#!: победить [GetUniqueInternationalOrganization('hre').GetLeaderTitle] до #Y 80%#!:1 очков войны, обеспечить соблюдение #Y Смирить Рейх#!:1.\n@arrow_bonus_tier_2! #bold Примирение#!: предъявите иск Императору с двухлетней данью.\n@arrow_bonus_tier_2! #bold Выносливость#!: год #Y 50#!, с #Y легитимностью 60+#!:1 и #Y престижем 50+#!:1." #NT!
  
  # HRE Emperor perspective card (visible only if SituationView.GetPlayer is the IO leader). 
 nd_dnm_panel_emperor_header: "Ваша ставка как императора" #NT!
 nd_dnm_panel_emperor_body: "Две короны покинули Рейх; вы держите [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] против отступника.\n\n@arrow_bonus_tier_1! Запрет может быть применен в любое время; оно сохраняется до тех пор, пока разлом не закроется.\n@arrow_bonus_tier_1! Победа над ними не прекращает отчуждение: только они могут его закрыть, или вы можете уничтожить их.\n@arrow_bonus_tier_1! Они могут подать в суд на примирение; слабый или рассеянный Император соглашается с большей готовностью.\n@arrow_bonus_tier_1! Карта силы выше — это проверка готовности к войне." #NT!
  
