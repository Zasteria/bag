l_russian:
 STATIC_MODIFIER_NAME_nd_masters_of_the_monsoon: "Мастера муссонов" #NT!
 STATIC_MODIFIER_DESC_nd_masters_of_the_monsoon: "Судьба Килвы лежит на волнах. Муссонные ветры, которые несут дау между Африкой, Аравией и Индией, являются источником жизненной силы нашей империи. Давайте овладеем этими ветрами, расширим наши торговые флоты до каждого порта Индийского океана и сделаем наши гавани незаменимым связующим звеном мировой торговли." #NT!
 STATIC_MODIFIER_NAME_nd_jewel_of_the_swahili_coast: "Жемчужина побережья Суахили" #NT!
 STATIC_MODIFIER_DESC_nd_jewel_of_the_swahili_coast: "Килва станет чудом восточных морей, не просто перевалочным пунктом для торговцев, но и маяком исламской цивилизации. Пусть наши мечети из кораллового камня соперничают с великими учебными домами в Каире и Багдаде, наши ученые освещают веру, а наш язык суахили станет языком утонченности от Софалы до Коморских Островов." #NT!
 nd_kws.1.t: "Восходящий султанат" #NT!
 nd_kws.1.d: "Разбросанные поселения побережья Суахили были собраны под одним доминионом. Из островной крепости Килва Кисивани наш султан смотрит на воды, мерцающие возможностями. На юге золотые прииски Софалы стекают богатство на север по маршрутам, которые мы сейчас контролируем. На востоке муссонные ветры обещают богатства Аравии, Персии, Индии и далекого Китая. Но султанат – это больше, чем просто его сокровищница. Направим ли мы нашу энергию на расширение нашего морского присутствия через Индийский океан, построив величайший торговый флот в восточных морях, или мы вложим средства в великолепие наших городов, превратив саму Килву в жемчужину, привлекающую ученых, ремесленников и паломников со всего исламского мира?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_kws.1.a: "Наши дау будут управлять любым муссонным ветром" #NT!
 nd_kws.1.b: "Пусть Килва сияет как маяк цивилизации" #NT!
 nd_kws.2.t: "Золото Софалы" #NT!
 nd_kws.2.d: "Купцы Килвы достигли того, чего не смогла ни одна другая прибрежная держава: полного контроля над торговлей золотом Софалы. Каждая унция золота, покидающая рудники возле Великого Зимбабве, должна пройти через руки Килвана. Река Бузи протекает через Софалу к порту, где наши специалисты взвешивают, анализируют и реэкспортируют драгоценный металл заинтересованным покупателям в Аравии и Индии. Султан должен решить, как использовать эту монополию. Сосредотачиваемся ли мы на максимизации потока золота через наш порт, сохраняя наших торговцев в качестве основных посредников, принимая на себя пошлины за каждую транзакцию, или мы продвигаемся глубже вглубь страны, устанавливая прямой контроль над горнодобывающими регионами и устраняя посредников, которые стоят между нами и золотыми приисками?" #NT!
 nd_kws.2.a: "Пусть золотой прилив течет через наши гавани" #NT!
 nd_kws.2.b: "Отправьте наших агентов на самые шахты" #NT!
 STATIC_MODIFIER_NAME_nd_kws_golden_tide: "Золотой прилив" #NT!
 STATIC_MODIFIER_DESC_nd_kws_golden_tide: "Гавани Килвы переполнены золотом Софалы, а его торговцы являются важными посредниками на самом богатом торговом пути в мире." #NT!
 STATIC_MODIFIER_NAME_nd_kws_interior_extraction: "Внутренняя экстракция" #NT!
 STATIC_MODIFIER_DESC_nd_kws_interior_extraction: "Агенты Килвана действуют глубоко внутри страны, добывая сырье непосредственно из источника и исключая посредников." #NT!
 nd_kws.3.t: "Хусуни Кубва: Большой дворец" #NT!
 nd_kws.3.d: "На мысе с видом на Индийский океан из коралловой скалы возвышается дворец ошеломляющих амбиций. Хусуни Кубва, Великая крепость, может похвастаться более чем сотней комнат, восьмиугольным бассейном для купания, огромным торговым двором для приема торговых делегаций и частной мечетью, где султан может молиться, глядя на море. Султан аль-Хасан ибн Сулейман создал резиденцию, которая может соперничать со всем, что построено на африканском континенте. Дворец — это больше, чем дом: это декларация каждому иностранному капитану, входящему в гавань Килвы, что это не захолустный торговый пост, а место настоящей цивилизации." #NT!
 nd_kws.3.a: "Дворец, достойный нашего величия" #NT!
 STATIC_MODIFIER_NAME_nd_kws_palace_of_wonder: "Дворец Чудес" #NT!
 STATIC_MODIFIER_DESC_nd_kws_palace_of_wonder: "Хусуни Кубва является свидетельством величия Килвана: его сотни комнат и виды на океан восхищают как послов, так и торговцев." #NT!
 nd_kws.4.t: "Великая мечеть Килва" #NT!
 nd_kws.4.d: "Великая мечеть Килва Кисивани превратилась в сооружение невероятных масштабов. Его шестнадцать куполообразных и сводчатых бухт создают интерьер, непохожий ни на один другой на африканском побережье, а его огромный купол, самый большой в Восточной Африке, парит над верующими во время пятничной молитвы. Коралловые тряпичные стены, отделанные известняковым раствором, сияют белизной на фоне тропического неба. Но мечеть – это не просто молитвенный дом. В его дворе живут ученые, приехавшие из Персии и Египта, привлеченные репутацией ученых Килвана. Султан стоит перед выбором: посвятить мечеть прежде всего углублению благочестия своих подданных или развивать ее как центр интеллектуального обмена, привлекающий самые яркие умы исламского мира." #NT!
 nd_kws.4.a: "Дом преданности превыше всего" #NT!
 nd_kws.4.b: "Дом обучения на века" #NT!
 STATIC_MODIFIER_NAME_nd_kws_dome_of_faith: "Купол веры" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dome_of_faith: "Великая мечеть Килва излучает религиозный авторитет по всему побережью Суахили, ее огромный купол является символом непоколебимой преданности." #NT!
 STATIC_MODIFIER_NAME_nd_kws_seat_of_learning: "Место обучения" #NT!
 STATIC_MODIFIER_DESC_nd_kws_seat_of_learning: "Ученые со всего исламского мира собираются во дворах мечетей Килвы, превращая султанат в маяк знаний и интеллектуального обмена." #NT!
 nd_kws.5.t: "Корабли на горизонте" #NT!
 nd_kws.5.d: "У берегов Суахили появились странные суда: огромные деревянные замки, ощетинившиеся пушками, с экипажем из бледнокожих людей, которые говорят о короле далеко на западе. Португальцы приехали. Их командующий Франсиско де Алмейда требует, чтобы Килва подчинилась торговому превосходству Португалии: только их корабли будут перевозить товары между побережьем и Индией, а султан будет платить ежегодную дань. За дипломатическим языком стоит флот военных кораблей, более мощный, чем все, что могут бросить вызов нашим дау. При дворе султана царит смятение. Некоторые советники призывают к неповиновению, сплачивают прибрежные города, укрепляют гавани, лишают захватчиков необходимой им якорной стоянки. Другие утверждают, что умная дипломатия и избирательное сотрудничество могут сохранить автономию Килвана, в то время как иностранцы неизбежно переоценивают свои силы." #NT!
 nd_kws.5.a: "Мы не будем склоняться перед иностранными тиранами" #NT!
 nd_kws.5.b: "Гнись, как ладонь, не сломай" #NT!
 STATIC_MODIFIER_NAME_nd_kws_defy_the_invaders: "Вызов Килвы" #NT!
 STATIC_MODIFIER_DESC_nd_kws_defy_the_invaders: "Килва предпочел сопротивление подчинению. Его гавани укреплены, его воины решительны, а болота и муссонные моря станут могилой захватчика." #NT!
 STATIC_MODIFIER_NAME_nd_kws_diplomacy_of_survival: "Дипломатия выживания" #NT!
 STATIC_MODIFIER_DESC_nd_kws_diplomacy_of_survival: "Килва гнется, но не ломается. Благодаря осторожной дипломатии, разведывательным сетям и выборочному сотрудничеству султанат сохраняет свою истинную независимость, в то время как чужаки истощают себя." #NT!
 nd_kws_swahili_warrior_tradition: "Традиция воинов суахили" #NT!
 nd_kws_swahili_warrior_tradition_desc: "Прибрежные поселения поддерживают традицию ополчения, основанную на защите островных гаваней и торговых путей от набегов." #NT!
 nd_kws_coral_stone_masonry: "Коралловая каменная кладка" #NT!
 nd_kws_coral_stone_masonry_desc: "Строители Килвана разработали уникальную технику вырезания коралловых блоков из рифа и установки их в известняковый раствор, создавая белокаменную архитектуру, которая определяет цивилизацию суахили." #NT!
 nd_kws_ivory_trade: "Торговля слоновой костью" #NT!
 nd_kws_ivory_trade_desc: "Торговцы суахили создают цепочки поставок, которые доставляют необработанную слоновью кость из внутренних районов страны в прибрежные мастерские, где из нее изготавливают предметы роскоши для экспорта через Индийский океан." #NT!
 nd_kws_makutano_markets: "Макутано Рынки" #NT!
 nd_kws_makutano_markets_desc: "Рынки на перекрестках городов суахили становятся организованными торговыми центрами, где африканские, арабские и индийские торговцы обмениваются товарами в соответствии с установленными правилами торговли." #NT!
 nd_kws_monsoon_navigation: "Муссонная навигация" #NT!
 nd_kws_monsoon_navigation_desc: "Моряки-суахили осваивают сезонные муссонные ветры, которые управляют судоходством в Индийском океане: каскази дует на северо-восток с декабря по март, куси - с юго-востока с июня по октябрь." #NT!
 nd_kws_shirazi_dynasty: "Династия Ширази" #NT!
 nd_kws_shirazi_dynasty_desc: "Правящая династия Ширази, берущая свое начало в персидском городе Шираз, обеспечивает Килве законное исламское управление и связь с более широким мусульманским миром." #NT!
 nd_kws_swahili_synthesis: "Синтез суахили" #NT!
 nd_kws_swahili_synthesis_desc: "Культурная идентичность суахили возникает в результате слияния банту, арабских и персидских традиций, морской цивилизации, которая является явно африканской, но космополитической по своему мировоззрению." #NT!
 nd_kws_dhow_building_tradition: "Традиция строительства дау" #NT!
 nd_kws_dhow_building_tradition_desc: "Корабелы Килвана совершенствуют строительство дау с латиновым вооружением: от крошечных замбуков для прибрежных работ до океанских судов, способных достичь Индии при муссонных ветрах.\n\n#italic Доступно в: $nd_kws_swahili_dockyard$#!" #NT!
 nd_kws_funduq_network: "Сеть Фундук" #NT!
 nd_kws_funduq_network_desc: "Сеть фундуков, торговых складов и общежитий позволяет иностранным торговцам хранить товары, заключать сделки и находить жилье в каждом крупном порту Суахили.\n\n#italic Доступно в: $nd_kws_funduq$#!" #NT!
 nd_kws_copper_coinage: "Медная чеканка" #NT!
 nd_kws_copper_coinage_desc: "Килва начинает чеканить собственные медные монеты, став одним из немногих государств Африки к югу от Сахары, выпускающих монеты. Монеты циркулируют от Великого Зимбабве до Занзибара, способствуя торговле и увеличивая коммерческий авторитет Килвана." #NT!
 nd_kws_merchant_marine: "Торговый флот" #NT!
 nd_kws_merchant_marine_desc: "Возникает формализованная система торгового флота, в которой семьи бюргеров Килвана оснащают и укомплектовывают сезонные торговые конвои, которые следуют за муссонными ветрами между Африкой и Азией." #NT!
 nd_kws_husuni_kubwa: "Хусуни Кубва" #NT!
 nd_kws_husuni_kubwa_desc: "Строительство Хусуни Кубвы, Большого дворца, с сотней комнат, восьмиугольным бассейном и потрясающим видом на Индийский океан, знаменует собой зенит архитектурных амбиций Килвана." #NT!
 nd_kws_indian_ocean_network: "Сеть Индийского океана" #NT!
 nd_kws_indian_ocean_network_desc: "Торговые связи Килвы теперь охватывают весь мир Индийского океана, от Малабарского побережья Индии до портов Персидского залива и островов специй Юго-Восточной Азии." #NT!
 nd_kws_sofala_gold_monopoly: "Софала Золотая Монополия" #NT!
 nd_kws_sofala_gold_monopoly_desc: "Контроль Килвы над Софалой, единственным прибрежным выходом золотых приисков Великого Зимбабве, дает султанату почти полную монополию на восточноафриканское золото, поступающее в торговлю в Индийском океане.\n\n#italic Доступно в: $nd_kws_mint$#!" #NT!
 nd_kws_great_mosque: "Великая мечеть" #NT!
 nd_kws_great_mosque_desc: "Великая мечеть Килва-Кисивани с ее шестнадцатью куполообразными бухтами и самым большим куполом в Восточной Африке становится одновременно духовным сердцем султаната и центром исламской науки." #NT!
 nd_kws_sofala_garrison: "Софала Гарнизон" #NT!
 nd_kws_sofala_garrison_desc: "Элитная стража размещена вдоль торгового пути золота из Софалы в Килву, защищая караваны и факторы, поддерживающие богатство султаната." #NT!
 nd_kws_mtepe_construction: "Мтепе Строительство" #NT!
 nd_kws_mtepe_construction_desc: "Судостроители суахили разработали мтепе — большое судно с прошитым корпусом, доски которого связаны кокосовой койрой, а не прибиты гвоздями, что придает ему замечательную гибкость при волнении океана." #NT!
 nd_kws_zanzibar_entrepot: "Занзибарский перевалочный пункт" #NT!
 nd_kws_zanzibar_entrepot_desc: "Занзибар становится крупным второстепенным портом в торговой империи Килван, а его глубокая гавань и стратегическое положение делают его важным узлом торговли в Индийском океане." #NT!
 nd_kws_island_dominion: "Остров Доминион" #NT!
 nd_kws_island_dominion_desc: "Килва распространяет свою власть на цепь островов, простирающуюся от Пембы и Занзибара до Мафии и Коморских островов, создавая морскую империю островных крепостей." #NT!
 nd_kws_resist_the_portuguese: "Сопротивляйтесь португальцам" #NT!
 nd_kws_resist_the_portuguese_desc: "Прибытие португальских военных кораблей ставит под угрозу всю торговую систему суахили. Килва готовится защитить свой суверенитет от технологически превосходящего, но стратегически превосходящего противника." #NT!
 nd_kws_coastal_defense_fleet: "Флот береговой обороны" #NT!
 nd_kws_coastal_defense_fleet_desc: "Kilwa разрабатывает специализированные военные галеры, предназначенные для мелководных прибрежных вод побережья Суахили, более быстрые и маневренные в местных условиях, чем европейские суда с глубокой осадкой." #NT!
 nd_kws_fortified_harbors: "Укрепленные гавани" #NT!
 nd_kws_fortified_harbors_desc: "Ключевые гавани султаната укреплены стенами из кораллового камня и сторожевыми башнями, образующими сеть укрепленных якорных стоянок, способных противостоять морским бомбардировкам." #NT!
 nd_kws_kilwa_chronicle: "Хроники Килвы" #NT!
 nd_kws_kilwa_chronicle_desc: "Составление «Хроник Килвы», исторических записей на арабском языке, подробно описывающих династии, торговлю и отношения султаната, знаменует собой важную веху в историческом сознании Восточной Африки." #NT!
 nd_kws_stone_town_expansion: "Расширение Каменного города" #NT!
 nd_kws_stone_town_expansion_desc: "Городское ядро ​​Килвы, построенное из кораллового камня, расширяется за счет новых торговых кварталов, общественных сооружений и жилых комплексов, создавая своеобразный каменный город на суахили, внушающий трепет иностранным гостям." #NT!
 nd_kws_sovereignty_tradition: "Суверенитет Традиции" #NT!
 nd_kws_sovereignty_tradition_desc: "Политическая традиция Килвана, пережившая португальское вмешательство, подчеркивает сохранение суверенитета посредством умелого управления соперничеством великих держав." #NT!
 nd_kws_revived_gold_routes: "Возрожденные золотые маршруты" #NT!
 nd_kws_revived_gold_routes_desc: "Поскольку португальский контроль над южным побережьем ослабевает, купцы Килвана вновь подтверждают свое господство над торговыми путями золота и слоновой кости, соединяющими внутренние районы страны с Индийским океаном." #NT!
 nd_kws_customs_administration: "Таможенное управление" #NT!
 nd_kws_customs_administration_desc: "Систематизированная таможенная администрация собирает пошлины на товары, ввозимые и вывозимые из портов Килвана, обеспечивая султанату надежную базу доходов, независимую от прямой торговли." #NT!
 nd_kws_swahili_literary_tradition: "Литературная традиция суахили" #NT!
 nd_kws_swahili_literary_tradition_desc: "Язык суахили имеет богатую литературную традицию, поэзию, хроники и религиозные тексты, написанные арабской вязью, что создает общую культурную самобытность на всем побережье." #NT!
 nd_kws_indian_ocean_diplomacy: "Дипломатия Индийского океана" #NT!
 nd_kws_indian_ocean_diplomacy_desc: "Килва развивает дипломатические отношения по всему миру в Индийском океане, балансируя интересы Омана, Португалии и местных жителей посредством умелых политических маневров." #NT!
 nd_kws_swahili_awakening: "Суахили Пробуждение" #NT!
 nd_kws_swahili_awakening_desc: "Возникает новое осознание идентичности суахили не просто как торгового народа, но и как цивилизации со своей собственной литературной традицией, архитектурным наследием и политической судьбой." #NT!
 nd_kws_modern_indian_ocean_trade: "Современная торговля в Индийском океане" #NT!
 nd_kws_modern_indian_ocean_trade_desc: "Килва адаптируется к индустриализирующемуся миру, модернизируя свои портовые сооружения и торговую практику, сохраняя при этом коммерческие сети Индийского океана, которые поддерживали ее на протяжении веков." #NT!
 nd_kws_constitutional_sultanate: "Конституционный султанат" #NT!
 nd_kws_constitutional_sultanate_desc: "Султанат развивается в сторону более структурированной системы управления с формальными консультативными органами, смягчающими абсолютное правление и обеспечивающими стабильность посредством институциональной преемственности." #NT!
 a_nd_kws_swahili_askari: "Суахили Аскари" #NT!
 a_nd_kws_swahili_askari_desc: "Бойцы прибрежного ополчения, набранные из островных поселений, умеющие защищать гавани и сражаться в болотистой местности побережья." #NT!
 n_nd_kws_kilwa_dhow: "Килва Доу" #NT!
 n_nd_kws_kilwa_dhow_desc: "Быстрое дау с латиновым вооружением, оптимизированное для торговых путей в сезон дождей. Легче европейских судов, но гораздо быстрее, эти корабли составляют основу торговли Килвана." #NT!
 a_nd_kws_sofala_guard: "Софала Страж" #NT!
 a_nd_kws_sofala_guard_desc: "Элитным солдатам поручено защищать жизненно важный путь торговли золотом между Софалой и побережьем. Отобранные за верность и выносливость, они патрулируют одни из самых ценных караванных маршрутов в Африке." #NT!
 n_nd_kws_mtepe: "Мтепе" #NT!
 n_nd_kws_mtepe_desc: "Большое океанское судно с прошитым корпусом, доски которого обтянуты кокосовой койрой. Гибкая конструкция выдерживает океанские волны лучше, чем прибитые европейские корпуса, что делает ее идеальной для путешествий по Индийскому океану." #NT!
 n_nd_kws_zanzibari_galley: "Занзибарская военная галера" #NT!
 n_nd_kws_zanzibari_galley_desc: "Весёлая галера, предназначенная для мелководья побережья Суахили. Быстрее и маневреннее в закрытых водах, чем европейские военные корабли с глубокой осадкой." #NT!
 n_nd_kws_merchant_levy: "Торговец Леви Дау" #NT!
 n_nd_kws_merchant_levy_desc: "Вооруженные торговые суда были призваны на военную службу во время войны. Эти дау, укомплектованные опытными моряками торгового флота, знают каждый риф и течение побережья." #NT!
 nd_kws_coral_mosque: "Мечеть Кораллового Камня" #NT!
 nd_kws_coral_mosque_desc: "Мечеть, построенная из коралловых блоков, вырезанных из рифа и установленных на известняковом растворе, — фирменный архитектурный стиль цивилизации суахили." #NT!
 nd_kws_funduq: "Фундук" #NT!
 nd_kws_funduq_desc: "Торговый склад и общежитие, где иностранные торговцы могут хранить товары, заключать сделки и находить жилье. Фундук является важной инфраструктурой международной торговли суахили." #NT!
 nd_kws_swahili_dockyard: "Суахили Верфь" #NT!
 nd_kws_swahili_dockyard_desc: "Специализированный судостроительный завод, где мастера строят дау, мтепе и другие суда, используя традиционные методы, отточенные за столетия плавания в Индийском океане." #NT!
 nd_kws_mint: "Килва Мятный" #NT!
 nd_kws_mint_desc: "Одно из немногих чеканных предприятий в Африке к югу от Сахары, производящее медные монеты, которые обращаются по всей торговой империи Килвана и за ее пределами." #NT!
 nd_kws_makutano: "Макутано" #NT!
 nd_kws_makutano_desc: "Рынок на суахилиском перекрестке, где африканские, арабские и индийские торговцы собираются для обмена слоновой костью, золотом, тканью, керамикой и специями под бдительным оком сборщиков налогов султана." #NT!
 nd_kws_mosque_upkeep: "Содержание мечети" #NT!
 nd_kws_mosque_upkeep_desc: "Обслуживание конструкции из кораллового камня и снабжение учеными и верующими мечети." #NT!
 nd_kws_funduq_maintenance: "Техническое обслуживание Фундука" #NT!
 nd_kws_funduq_maintenance_desc: "Эксплуатационные расходы торгового склада, включая складские материалы и условия для приезжающих торговцев." #NT!
 nd_kws_dockyard_maintenance: "Техническое обслуживание верфи" #NT!
 nd_kws_dockyard_maintenance_desc: "Древесина, военно-морские поставки и заработная плата квалифицированных корабелов, которые поддерживают работу верфи." #NT!
 nd_kws_mint_operations: "Монетный двор" #NT!
 nd_kws_mint_operations_desc: "Из медных слитков чеканятся характерные килванские монеты и декоративные изделия из металла, которые циркулируют в торговой сети Индийского океана." #NT!
 nd_kws_makutano_upkeep: "Содержание рынка" #NT!
 nd_kws_makutano_upkeep_desc: "Обслуживание рыночных прилавков и снабжение торговыми товарами, которые привлекают торговцев на перекресток." #NT!
 nd_kws_ivory_carving_pm: "Резьба по Слоновой Кости" #NT!
 nd_kws_ivory_carving_pm_desc: "Опытные мастера превращают необработанную слоновью кость в предметы роскоши с замысловатой резьбой, предназначенные для дворов Аравии, Индии и Китая." #NT!
 nd_kws_monsoon_sailing_pm: "Муссонный парусный спорт" #NT!
 nd_kws_monsoon_sailing_pm_desc: "Специальные знания и материалы, необходимые для использования сезонных муссонных ветров для трансокеанских путешествий между Африкой и Азией." #NT!
 nd_kws_gold_refining_pm: "Аффинаж золота" #NT!
 nd_kws_gold_refining_pm_desc: "Золото-сырец, доставленное по торговому маршруту Софала, очищается, анализируется и превращается в ювелирные изделия и торговые слитки для экспорта через Индийский океан." #NT!
 levy_nd_kws_swahili_askari: "Суахили Аскари Леви" #NT!
 levy_nd_kws_swahili_askari_desc: "Островные ополченцы, набранные из прибрежных поселений для защиты гаваней и торговых путей султаната." #NT!
 levy_nd_kws_merchant_fleet: "Налог торгового флота" #NT!
 levy_nd_kws_merchant_fleet_desc: "Вооруженные торговые суда, принятые на вооружение во время войны, с экипажем из опытных моряков торговых домов Килвы." #NT!
 nd_kws_coral_fortress: "Коралловая крепость" #NT!
 nd_kws_coral_fortress_desc: "Укрепленная защита гавани, построенная из коралловых каменных блоков, предназначенная для защиты от морских бомбардировок и защиты подходов к острову." #NT!
 nd_kws_customs_house: "Таможня" #NT!
 nd_kws_customs_house_desc: "Официальная таможенная администрация, которая взимает пошлины со всех товаров, ввозимых и вывозимых из порта, систематизируя торговые доходы султаната." #NT!
 nd_kws_swahili_academy: "Академия Суахили" #NT!
 nd_kws_swahili_academy_desc: "Центр исламской науки и литературной культуры суахили, где ученые изучают Коран, сочиняют стихи и сохраняют интеллектуальные традиции побережья." #NT!
 nd_kws_fortress_upkeep: "Содержание крепости" #NT!
 nd_kws_fortress_upkeep_desc: "Камень и вооружение, необходимые для поддержания коралловой крепости и ее гарнизона." #NT!
 nd_kws_customs_upkeep: "Таможенные операции" #NT!
 nd_kws_customs_upkeep_desc: "Административные материалы и материалы, необходимые для работы аппарата таможенного сбора." #NT!
 nd_kws_academy_upkeep: "Содержание Академии" #NT!
 nd_kws_academy_upkeep_desc: "Бумага, чернила и расходные материалы для ученых и студентов академии." #NT!
 nd_kws_formed_tt: "Образован султанат Килва." #NT!
 nd_kws_path_a_tt: "Выберите судьбу #bold Повелителей муссонов#!" #NT!
 nd_kws_path_b_tt: "Выберите судьбу #bold Жемчужины побережья Суахили#!." #NT!
 nd_kws_destiny: "Судьба Килвы" #NT!
 nd_kws_destiny_desc: "Был создан султанат Килва. Теперь его правители должны решить, проецировать ли власть через Индийский океан или построить цивилизацию, которая переживет века." #NT!
 nd_kws_dest_monsoon_reach: "Муссонный Предел" #NT!
 nd_kws_dest_monsoon_reach_desc: "Расширить коммерческое влияние Килвана на побережье Суахили. Контролируйте торговые коридоры от Могадишо на севере до золота Софалы на юге, сделав султанат незаменимым посредником в торговле в Восточной Африке." #NT!
 nd_kws_dest_monsoon_fleet: "Муссонный флот" #NT!
 nd_kws_dest_monsoon_fleet_desc: "Килванские дау должны нести знамя султаната за пределы африканских вод. Захватите великий перевалочный пункт Аден в устье Красного моря и доберитесь до Малабарского побережья Индии, где вас ждут богатейшие рынки специй в мире." #NT!
 nd_kws_dest_ocean_hegemony: "Гегемония Индийского океана" #NT!
 nd_kws_dest_ocean_hegemony_desc: "От Ормузского пролива до портов Гуджарата не позволяйте ни одному кораблю пересечь Индийский океан без выхода из Килвана. Захватите контроль над узкими местами, регулирующими мировую торговлю, и сделайте Килву главной морской державой восточных морей." #NT!
 nd_kws_dest_coral_cities: "Коралловые города" #NT!
 nd_kws_dest_coral_cities_desc: "Расширьте влияние султаната через западную часть Индийского океана, распространив цивилизацию суахили на Мадагаскар и одновременно инвестируя в институты, которые превращают торговый пост в настоящее государство." #NT!
 nd_kws_dest_swahili_renaissance: "Суахили Ренессанс" #NT!
 nd_kws_dest_swahili_renaissance_desc: "Раздвиньте границы мира суахили глубоко внутри, достигнув легендарных руин самого Великого Зимбабве. Развивайте земли султаната, пока они не составят конкуренцию любому королевству в Африке." #NT!
 nd_kws_dest_beacon_of_civilization: "Светоч цивилизации" #NT!
 nd_kws_dest_beacon_of_civilization_desc: "Пусть Килва станет центром образования и культуры, способным соперничать с Каиром или Багдадом. Используйте новые институты банковского дела и торговли, распространите влияние на северный Мадагаскар и постройте цивилизацию, настолько блестящую, что путешественники говорят о ней на протяжении веков." #NT!
 nd_kws.6.t: "Судьба Килвы" #NT!
 nd_kws.6.d: "Коралловые каменные башни Килва-Кисивани сияют белым на фоне тропического неба. Из этой островной крепости султан обозревает владения, простирающиеся от острова до материка, от гавани до внутренних районов. Султанат Килва был провозглашен, но его истинная судьба остается неписаной. Муссонные ветры нашептывают о возможностях: огромных океанских империях и блестящих центрах обучения. Последующий выбор определит, разнесется ли имя Килвы по морям или станет маяком цивилизации для всех, кто его ищет." #NT!
 nd_kws.6.a: "Наша судьба ждет" #NT!
 nd_kws.7.t: "Командование побережья" #NT!
 nd_kws.7.d: "От древнего порта Могадишо на севере до богатой золотом гавани Софала на юге — все восточноафриканское побережье теперь находится под властью Килвана. Каждое торговое судно, курсирующее по этим водам, отдает дань уважения факторам султана. Капитаны дау сообщают, что сезонные муссонные ветры несут не только грузы: они доносят весть о растущей мощи Килвы в каждый порт Индийского океана. То, что когда-то было сетью независимых торговых поселений, теперь превратилось в единую коммерческую империю, и ее амбиции простираются далеко за пределы африканского побережья." #NT!
 nd_kws.7.a: "Берег наш: теперь океан" #NT!
 nd_kws.8.t: "Через Муссонное море" #NT!
 nd_kws.8.d: "Килванские купцы добились того, о чем осмеливались мечтать немногие африканские правители: постоянного присутствия на берегах Индии и Аравии. Агенты султана действуют в Адене, воротах Красного моря, и на рынках специй Малабарского побережья. Килва уже не просто африканская держава, а сила в более широком мире Индийского океана. Сейчас суд обсуждает, как закрепить эти достижения. Некоторые адмиралы предпочитают создавать подавляющие военно-морские силы, чтобы гарантировать Килвану превосходство на море. Другие утверждают, что контроль над потоками драгоценных товаров (перец, корица, шелк) принесет богатство, с которым не сможет сравниться ни один флот." #NT!
 nd_kws.8.a: "Наши военные корабли будут командовать этими водами" #NT!
 nd_kws.8.b: "Контролируйте специи, контролируйте мир" #NT!
 nd_kws.9.t: "Владыки Индийского океана" #NT!
 nd_kws.9.d: "Ормузский пролив, ворота Персидского залива, порты Гуджарата — все подчиняется морской власти Килвана. Никакая другая держава не может сравниться с влиянием султаната через Индийский океан. От Красного моря до Малабарского побережья Килванские факторы, адмиралы и дипломаты управляют коммерческой сетью ошеломляющего размаха. Вопрос теперь в том, как управлять этой океанской империей. Будет ли Килва править как талассократия, используя военную мощь своего флота для поддержания порядка на море? Или торговые дома Килвы будут управлять посредством торговли, создавая сеть зависимых партнеров, связанных прибылью, а не силой?" #NT!
 nd_kws.9.a: "Само море — наша территория" #NT!
 nd_kws.9.b: "Пусть торговля свяжет то, что сила не может" #NT!
 nd_kws.10.t: "Города Коралла и Света" #NT!
 nd_kws.10.d: "Белые коралловые города побережья Суахили растут и размножаются. От Килвы до далеких берегов Мадагаскара архитектура, право и образование суахили распространялись по торговым путям. Султанат инвестировал не только в торговлю, но и в институты, обеспечивающие устойчивость государства: юридические кодексы, научные традиции и административные системы, которые превращают дань в управление. Там, где когда-то торговцы приходили и уходили вместе с сезоном дождей, теперь возникают постоянные поселения, а их коралловые мечети и научные дворы привлекают посетителей со всего исламского мира." #NT!
 nd_kws.10.a: "Наша цивилизация укореняется" #NT!
 nd_kws.11.t: "Расцвет культуры суахили" #NT!
 nd_kws.11.d: "На землях Килвана произошла замечательная трансформация. Влияние султаната теперь распространяется глубоко вглубь страны, достигая даже легендарных каменных руин Великого Зимбабве. Но не только завоевания отмечают этот век. Это культурный расцвет, не имеющий прецедентов на африканском побережье. Поэты сочиняют на суахили, ученые обсуждают философию в академиях с коралловыми стенами, а ремесленники создают произведения, которые удивляют гостей из-за границы. Султан должен выбрать, как направить эту творческую энергию. Будет ли Килва способствовать золотому веку искусства и науки или сосредоточится на консолидации своей расширенной территории в единое и интегрированное царство?" #NT!
 nd_kws.11.a: "Пусть поэты и ученые ведут нас" #NT!
 nd_kws.11.b: "Сначала мы должны управлять тем, что мы держим" #NT!
 nd_kws.12.t: "Маяк горит ярко" #NT!
 nd_kws.12.d: "Килва является величайшим центром исламской цивилизации в южном полушарии. Его академии привлекают ученых от Каира до Самарканда, его библиотеки хранят произведения, утраченные в других местах, а его литературная традиция суахили породила массу поэзии и философии, которые обогащают весь исламский мир. Путешественники, посещающие Килву, говорят о нем так же, как когда-то говорили о Кордове или Багдаде, месте, где сходятся знания и красота. По мере того как султанат достигает вершины своих культурных достижений, возникают два видения его будущего. Некоторые ученые выступают за то, чтобы Килва стала настоящим домом мудрости, охватывающим все знания, независимо от их источника. Другие полагают, что султанат должен использовать свой культурный авторитет для построения вечного правящего порядка." #NT!
 nd_kws.12.a: "Знания не знают границ" #NT!
 nd_kws.12.b: "Нашим наследием будет вечное управление" #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_monsoon_dominance: "Доминирование муссонов" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_monsoon_dominance: "Военные флоты Килвана контролируют морские пути в сезон дождей, их быстрая высадка вселяет страх в прибрежных соперников." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_spice_monopoly: "Монополия специй" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_spice_monopoly: "Власть Килвы над торговлей пряностями приносит баснословные богатства, а ее торговые дома предоставляют взаймы капитал через Индийский океан." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_thalassocracy: "Килван Талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_thalassocracy: "Килва правит Индийским океаном как настоящая талассократия, ее военно-морская мощь проецирует мощь от Африки до Индии и за ее пределами." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_merchant_princes: "Великие купеческие семьи Килвы управляют коммерческой империей посредством торговли и покровительства, связывая отдаленные порты общим процветанием." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_golden_age_arts: "Золотой век искусств" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_golden_age_arts: "Золотой век поэзии, архитектуры и науки суахили превратил султанат в маяк культурных достижений." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_interior_dominion: "Внутренний Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_interior_dominion: "Власть Килвы распространяется глубоко внутри страны, объединяя различные народы в единое царство под управлением суахили." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_house_of_wisdom: "Дом Мудрости" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_house_of_wisdom: "Академии Килвы охватывают все знания, привлекая ученых всех вероисповеданий и традиций в величайший центр обучения в южных морях." #NT!
 STATIC_MODIFIER_NAME_nd_kws_dest_eternal_sultanate: "Вечный султанат" #NT!
 STATIC_MODIFIER_DESC_nd_kws_dest_eternal_sultanate: "Руководящие институты Килвы достигают постоянства, превосходящего отдельных правителей, создавая прочный политический порядок." #NT!
 nd_kws_bahari_emporium: "Торговый центр Бахари" #NT!
 nd_kws_bahari_emporium_desc: "Большой океанский торговый дом, где сходятся купцы со всего Индийского океана, торговый центр морской империи Килвы." #NT!
 nd_kws_emporium_operations: "Операции в торговом центре" #NT!
 nd_kws_emporium_operations_desc: "Огромный логистический аппарат получения, каталогизации и перераспределения товаров со всех уголков торгового мира Индийского океана." #NT!
 nd_kws_dar_al_ilm: "Дар аль-Ильм" #NT!
 nd_kws_dar_al_ilm_desc: "Дом знаний: великая академия, где собираются ученые для изучения теологии, философии, медицины и естественных наук, конкурирующая с великими медресе исламского мира." #NT!
 nd_kws_dar_al_ilm_upkeep: "Операции Академии" #NT!
 nd_kws_dar_al_ilm_upkeep_desc: "Бумага, книги, чернила и принадлежности для ученых, писцов и студентов, заполняющих залы Дар аль-Ильма." #NT!
 AUTO_MODIFIER_NAME_nd_kws_bureaucracy_authority: "Султанский Диван" #NT!
 AUTO_MODIFIER_DESC_nd_kws_bureaucracy_authority: "При формировании [KWS.GetName] наследует институциональный аппарат султаната Махдали Килва: возглавляемую вазиром канцелярию султана в Хусуни-Кубве, начальников портов вакили каждого прибрежного сука, претензии Шарифиан Сайида династии Махдали, ливали-губернаторов подчиненных гаваней и связь золотой дани с Софалой. Предоставляет два слота бюрократии, чтобы игрок мог управлять до тремя историческими учреждениями побережья Суахили (с универсальным слотом столицы)." #NT!
 kws_wazir_diwan_bureaucracy: "Диван Вазира" #NT!
 kws_wazir_diwan_bureaucracy_desc: "Канцелярия и внутренний совет султана под председательством визиря из залов аудиенций Хусуни Кубвы. Ибн Баттута, посетивший Килву в 1331 году, описал петиции, поступающие к султану аль-Хасану ибн Сулейману через этот офис. Визирь составлял указы, управлял казной и координировал переписку султана с иностранными правителями от Адена до Ормуза. Единая канцелярия в государстве торговых городов-государств неизбежно усиливает власть султана за счет патрицианских семей, которые долгое время управляли каждым портом как своим собственным." #NT!
 kws_wakili_suk_bureaucracy: "Мастерство порта Вакили-Сук" #NT!
 kws_wakili_suk_bureaucracy_desc: "Начальник порта и таможенный аппарат, который управлял всеми портами суахили от Могадишо на севере до Софалы на юге. В каждом суке были свои вакили, которые взвешивали грузы, взимали ушур (одну десятую пошлину) и разрешали коммерческие споры между арабскими, персидскими, индийскими и суахилискими купцами. В конце четырнадцатого века Махдали издает указ о стандартизированных тарифах для Пембы, Мафии и Килвы Кисивани, превращая конфедерацию независимых гаваней в скоординированную коммерческую сеть. Прибрежные народы банту, получавшие дань, перенесли давление возросших пошлин." #NT!
 kws_sharifian_mahdali_bureaucracy: "Шарифский совет Махдали" #NT!
 kws_sharifian_mahdali_bureaucracy_desc: "Генеалогический и церемониальный аппарат, с помощью которого династия Махдали (правившая с 1277 года) заявляла о своем происхождении от Бану Махдал Шарифов Йемена, в свою очередь прослеживая родословную Пророка через его двоюродного брата Али. В отличие от более старой легенды о персидском основании Ширази, претензии Шарифа придали султанату исламскую легитимность по всему Индийскому океану, приблизили суннитское духовенство к трону и были официально оформлены в «Хрониках Килвы», составленных при султане Мухаммаде ибн аль-Хусейне аль-Кулати. Индуистские и христианские купеческие сообщества зимми, входящие в более широкую торговую сеть, структурно оказались вне нового священного порядка." #NT!
 kws_liwali_governorate_bureaucracy: "Прибрежная провинция Ливали" #NT!
 kws_liwali_governorate_bureaucracy_desc: "Система губернаторов округов ливали, назначаемых из Килвы Кисивани для управления портами-данниками султаната: Мафия, Пемба, Вумба Куу, Момбаса, Могадишо, Софала. Ливали, как правило, были родственниками Махдали, прошедшими придворную подготовку, которых меняли между должностями, чтобы предотвратить местное укрепление, которое фрагментировало прежние прибрежные государства. Система удерживала побережье под единой казной, но лишала торговые патрициаты независимой власти, а когда в нестабильном конце пятнадцатого века ротация ускорилась, лишила побережье опытной местной администрации." #NT!
 kws_sofala_gold_vassalage_bureaucracy: "Софала Голд Вассалаж" #NT!
 kws_sofala_gold_vassalage_bureaucracy_desc: "Дань, по которой Софала, самый южный порт суахили в устье реки Бузи, платил ежегодную дань в виде золотого песка Килве примерно с 1300 года. Золото текло из рудников Мвене Мутапа недалеко от Великого Зимбабве; взамен Килва предоставил Софале эксклюзивный доступ к судоходству в сезон дождей и индийской ткани. Когда в начале XVI века эта связь ослабла, вся монополия рухнула: нападение португальцев в 1505 году обнаружило, что дань уже не взимается. Грандиозная сделка, когда она работает; Однажды укрепившись, торговые патриции родных островов возмущаются финансировать южный аванпост, который они не могут напрямую облагать налогом." #NT!
