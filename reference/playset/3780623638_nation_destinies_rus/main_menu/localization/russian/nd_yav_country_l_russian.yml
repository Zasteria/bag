l_russian:
 YAV: "Яванская Империя" #NT!
 YAV_ADJ: "Явана" #NT!
 YAV_f: "Яванская Империя" #NT!
 YAV_f_desc: "Империя Явана представляет собой возрождение древних индо-греческих королевств, которые когда-то процветали на землях Синда и Гандхары. «Явана», термин, используемый в индийских источниках для обозначения греков и их потомков, напоминает о необычайном греко-буддийском синтезе, который породил некоторые из величайших произведений искусства и философии субконтинента. Под руководством буддийского правителя Саммитии синдского происхождения эта реставрация объединяет эллинистические политические традиции с дхармической культурой долины Инда, возвращая наследие Менандра и Деметрия." #NT!
