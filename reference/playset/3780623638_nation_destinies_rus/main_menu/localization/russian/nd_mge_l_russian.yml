l_russian:
 STATIC_MODIFIER_NAME_nd_way_of_the_eternal_blue_sky: "Путь Вечного Синего Неба" #NT!
 STATIC_MODIFIER_DESC_nd_way_of_the_eternal_blue_sky: "Под знаменем Вечного Синего Неба сражаются монгольские орды. Каждый горизонт — граница, каждая степь — дорога для ханских всадников. Мир трепещет перед воинами, которые спят в седле и выпускают стрелы на скаку." #NT!
 STATIC_MODIFIER_NAME_nd_crown_of_the_world: "Корона мира" #NT!
 STATIC_MODIFIER_DESC_nd_crown_of_the_world: "Монгольская империя — это больше, чем завоевание: это мост между цивилизациями. От Тихого океана до Средиземного моря торговцы путешествуют под защитой хана, учёные обмениваются знаниями между континентами, а на рынках Каракорума говорят сотни языков." #NT!
 nd_mge.1.t: "Восстановление Монгольской империи" #NT!
 nd_mge.1.d: "Мечта Чингисхана снова оживает. На руинах разрозненных ханств один правитель объединил степные народы и заявил о своем господстве над землями между четырьмя морями. Курултай высказал свое мнение, и крупнейшая в мире империя возрождается.\n\nНо остается вопрос: какая это должна быть империя? Пойдем ли мы по пути вечной войны, скачя, как наши предки, под Вечным Синим Небом, приводя все народы под копыта нашей кавалерии? Или мы построим империю закона и торговли, где Шелковый путь процветает в условиях монгольского мира, а каждая культура находит место при ханском дворе?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mge.1.a: "Мы едем под Вечным Синим Небом!" #NT!
 nd_mge.1.b: "Мы будем носить Корону Мира." #NT!
 STATIC_MODIFIER_NAME_nd_mge_yasa_proclaimed: "Провозглашена Великая Яса" #NT!
 STATIC_MODIFIER_DESC_nd_mge_yasa_proclaimed: "Хан провозгласил Великую Ясу для всех земель, установив универсальный кодекс, который связывает знатных и простолюдинов, монголов и иностранцев." #NT!
 nd_mge.2.t: "Великая Яса" #NT!
 nd_mge.2.d: "Хан постановил, что Великая Яса, высший свод законов, впервые провозглашенный самим Чингисханом, будет применяться на всех территориях империи. Этот кодекс, который предписывает абсолютную лояльность хану, суровое наказание за воровство и прелюбодеяние, религиозную терпимость и неприкосновенность послов, образует правовую основу монгольского правления.\n\nСогласно Ясе, не существует различия между законом, который регулирует монгольскую знать, и законом, который регулирует персидского купца или китайского ученого. Все подданные равны перед ханским правосудием. Этот радикальный универсализм вызывает одновременно восхищение и страх: наказания суровы, но порядок, который они приносят, неоспорим." #NT!
 nd_mge.2.a: "Пусть Яса принесет порядок во все земли." #NT!
 nd_mge.2.b: "Яса должна быть поддержана мечом." #NT!
 STATIC_MODIFIER_NAME_nd_mge_pax_mongolica_flourishing: "Расцвет Пакс Монголика" #NT!
 STATIC_MODIFIER_DESC_nd_mge_pax_mongolica_flourishing: "В условиях мира, навязанного монгольской кавалерией, величайшая торговая сеть в истории простирается от Пекина до Багдада. Торговцы путешествуют в безопасности, а товары свободно перемещаются по Шелковому пути." #NT!
 nd_mge.3.t: "Мир монголов" #NT!
 nd_mge.3.d: "Впервые в истории одна держава контролирует всю протяженность Шелкового пути. Караваны, нагруженные шелком, специями, фарфором и драгоценными металлами, следуют от Китайского моря до берегов Средиземного моря, не переходя из рук в руки и не платя конкурирующим пошлинам. Генуэзские купцы напрямую сотрудничают с китайскими торговцами, персидские астрономы переписываются с монгольскими князьями, а технологии текут во всех направлениях.\n\nТорговые товарищества ортак, финансируемые монгольскими князьями и укомплектованные мусульманскими и уйгурскими торговцами, создали коммерческую сеть беспрецедентного масштаба. Бумажные деньги обращаются наряду с серебром, а почтовая система Яма доставляет не только официальные посылки, но и коммерческую корреспонденцию по обширным территориям империи." #NT!
 nd_mge.3.a: "Дороги Хана всем приносят процветание." #NT!
 nd_mge.3.b: "Пусть караваны платят дань за безопасный проход." #NT!
 nd_mge.4.t: "Кешиг: Меч Хана" #NT!
 nd_mge.4.d: "Кешиг, императорская гвардия хана, представляет лучших воинов Монгольской империи. Первоначально при Чингисхане насчитывавший всего семьдесят дневных и восемьдесят ночных стражей, Кешиг превратился в отряд из десяти тысяч элитных солдат, каждый из которых выбран вручную из сыновей генералов и вождей племен.\n\nЧлен Кешиг превосходит любого другого военного офицера в империи, за исключением самого хана. Они служат личным телохранителем хана, его домашней прислугой, его административным ядром и ударными отрядами в бою. Служить в Кешиге — высшая честь, которую может достичь воин. А неудача в этой службе означает смерть." #NT!
 nd_mge.4.a: "Страж Кешиг никогда не ослабнет." #NT!
 STATIC_MODIFIER_NAME_nd_mge_thunder_of_the_khan: "Гром Хана" #NT!
 STATIC_MODIFIER_DESC_nd_mge_thunder_of_the_khan: "Монгольские инженеры освоили пороховое оружие, адаптировав китайские и мусульманские технологии в разрушительный арсенал, сочетающий в себе мобильность степи с разрушительной силой артиллерийского огня." #NT!
 nd_mge.5.t: "Гром в степи" #NT!
 nd_mge.5.d: "Монгольская империя всегда преуспевала в освоении военных технологий покоренных народов. Китайские инженеры создали наши первые осадные орудия; Мусульманские мастера усовершенствовали наши требушеты. Теперь империя обращает свое внимание на новейшую революцию в военном деле: пороховое огнестрельное оружие.\n\nМонгольские кузнецы и пленные инженеры разработали ручное огнестрельное оружие, подходящее для ведения войны в степи: оно легче европейских мушкетов, его носит конная пехота, которая может спешиться, чтобы нанести разрушительные залпы, прежде чем снова сесть на коня и отступить. Гром ханских орудий эхом разносится по равнинам, возвещая новую эпоху монгольской военной мощи." #NT!
 nd_mge.5.a: "Пусть грохот наших орудий сотрясет землю!" #NT!
 nd_mge.5.b: "Поделитесь этими знаниями для процветания королевства." #NT!
 nd_mge_steppe_horsemanship: "Степное искусство верховой езды" #NT!
 nd_mge_steppe_horsemanship_desc: "Монгольский воин рождается в седле. Дети учатся ездить верхом раньше, чем умеют ходить, и каждый пастух — потенциальный кавалерист." #NT!
 nd_mge_composite_bow_craft: "Изготовление композитного лука" #NT!
 nd_mge_composite_bow_craft_desc: "Монгольский составной лук (сделанный из рога, сухожилий и дерева) может нанести смертоносную силу на дистанции, превышающие 400 метров, что дает конным лучникам решающее преимущество." #NT!
 nd_mge_great_yasa: "Великая Яса" #NT!
 nd_mge_great_yasa_desc: "Высший свод законов Чингисхана связывает всех подданных в равной степени, устанавливая всеобщий порядок на обширных территориях империи." #NT!
 nd_mge_noyan_command: "Ноян Командование" #NT!
 nd_mge_noyan_command_desc: "Нояны, тысячные командиры, составляют офицерский корпус монгольской армии, управляя туменами с дисциплиной, превосходящей племенную преданность." #NT!
 nd_mge_felt_ger_encampments: "Лагеря Фелтгера" #NT!
 nd_mge_felt_ger_encampments_desc: "Мобильные войлочные палатки, гер, позволяют монгольским армиям создавать и перемещать лагеря с поразительной скоростью, обеспечивая снабжение войск даже в глубине вражеской территории." #NT!
 nd_mge_wolf_hunt_tactics: "Тактика охоты на волка" #NT!
 nd_mge_wolf_hunt_tactics_desc: "Нерге, великая охота, обучает монгольских воинов искусству окружения и скоординированного преследования — тактике, применимой непосредственно на поле боя." #NT!
 nd_mge_ortaq_partnerships: "Партнерство Ортак" #NT!
 nd_mge_ortaq_partnerships_desc: "Монгольские князья вкладывают капитал в торговые партнерства с мусульманскими и уйгурскими торговцами, создавая коммерческую сеть, охватывающую всю империю." #NT!
 nd_mge_tumen_discipline: "Тюменская дисциплина" #NT!
 nd_mge_tumen_discipline_desc: "Тумен, подразделение численностью десять тысяч человек, действует с скоординированной точностью, каждое подразделение мгновенно реагирует на сигнальные флажки и барабанный бой, разносящийся по полю боя." #NT!
 nd_mge_mongol_siege_corps: "Монгольский осадный корпус" #NT!
 nd_mge_mongol_siege_corps_desc: "Монгольские командиры нанимают китайских и мусульманских инженеров для строительства требушетов, таранов и других осадных машин, превращая кавалерийскую армию в силу, способную разрушить любые укрепления." #NT!
 nd_mge_darughachi_governors: "Губернаторы Даругачи" #NT!
 nd_mge_darughachi_governors_desc: "Даругачи, назначаемые монголами губернаторы, управляют завоеванными территориями, проводят переписи населения, собирают налоги и поддерживают власть хана среди различных групп населения." #NT!
 nd_mge_silk_road_protection: "Защита Шелкового пути" #NT!
 nd_mge_silk_road_protection_desc: "Монгольские кавалерийские патрули обеспечивают безопасность караванов Шелкового пути, а платные станции собирают доходы, гарантируя торговцам безопасный проход через обширные территории империи.\n\n#italic Доступно в: $nd_mge_ortaq_house$#!" #NT!
 nd_mge_kurultai_assembly: "Курултайское собрание" #NT!
 nd_mge_kurultai_assembly_desc: "Курултай, великое собрание монгольских вождей и генералов, обсуждает вопросы престолонаследия, войны и закона, обеспечивая легитимность правления хана." #NT!
 nd_mge_pax_mongolica_trade: "Пакс Монголика Трейд" #NT!
 nd_mge_pax_mongolica_trade_desc: "В условиях монгольского мира Шелковый путь достигает своего апогея. Товары, технологии и идеи свободно перемещаются между Востоком и Западом через крупнейшую в истории континентальную империю.\n\n#italic Доступно в: $nd_mge_ortaq_house$#!" #NT!
 nd_mge_religious_tolerance: "Религиозная толерантность" #NT!
 nd_mge_religious_tolerance_desc: "Монгольская империя предоставляет свободу вероисповедания всем подданным. Под защитой хана сосуществуют буддийские, мусульманские, христианские и тенгрианские общины." #NT!
 nd_mge_counterweight_trebuchet: "Противовес Требюшет" #NT!
 nd_mge_counterweight_trebuchet_desc: "Персидские инженеры Исмаил и Аль-Ауд-Дин конструируют требушеты с противовесом, способные бросать 300-килограммовые снаряды на расстояние более 500 метров, что произвело революцию в монгольской осадной войне." #NT!
 nd_mge_paper_currency: "Бумажная валюта" #NT!
 nd_mge_paper_currency_desc: "Монгольская империя выпускает бумажные банкноты, поддерживаемые имперской властью, облегчая торговлю на территориях, где серебра и золота мало." #NT!
 nd_mge_horse_relay_posts: "Посты конной эстафеты" #NT!
 nd_mge_horse_relay_posts_desc: "Ретрансляционные станции Ортоо, расположенные каждые тридцать миль по всей империи, позволяют сообщениям преодолевать всю длину Шелкового пути за считанные дни." #NT!
 nd_mge_keshig_guard: "Кешиг Страж" #NT!
 nd_mge_keshig_guard_desc: "Кешиг, десять тысяч элитных воинов, выбранных из сыновей генералов и вождей, служат личной охраной хана, его домом и самой надежной военной силой." #NT!
 nd_mge_mangudai_tactics: "Мангудай Тактикс" #NT!
 nd_mge_mangudai_tactics_desc: "Мангудаи, специализированные застрельщики легкой кавалерии, симулируют отступление, чтобы заманить врагов в засаду, а затем разворачиваются и наносят разрушительный залп стрел с близкого расстояния." #NT!
 nd_mge_silk_road_caravanserai: "Караван-сарай Шелкового пути" #NT!
 nd_mge_silk_road_caravanserai_desc: "Грандиозные придорожные гостиницы предлагают кров, еду и конюшни торговцам, путешествующим по Шелковому пути, поддерживая обширную коммерческую сеть империи." #NT!
 nd_mge_imperial_armory: "Императорская Оружейная палата" #NT!
 nd_mge_imperial_armory_desc: "Централизованные оружейные мастерские массово производят стандартизированное оружие и доспехи для монгольской армии, гарантируя, что каждый воин экипирован в соответствии со спецификациями хана.\n\n#italic Доступно в: $nd_mge_imperial_mint$#!" #NT!
 nd_mge_gunpowder_adaptation: "Пороховая адаптация" #NT!
 nd_mge_gunpowder_adaptation_desc: "Монгольские инженеры адаптировали китайское пороховое оружие для ведения войны в степи, разрабатывая более легкое огнестрельное оружие, подходящее для мобильности конной пехоты." #NT!
 nd_mge_universal_chronicle: "Универсальная хроника" #NT!
 nd_mge_universal_chronicle_desc: "Имперские историки составляют подробные хроники каждого завоеванного народа, сохраняя знания от Китая до Персии в традициях «Сборника хроник» Рашид ад-Дина." #NT!
 nd_mge_eternal_empire: "Вечная Империя" #NT!
 nd_mge_eternal_empire_desc: "Монгольская империя сохраняет и передает культурные достижения всех своих подчиненных народов, создавая наследие, превосходящее любую отдельную цивилизацию." #NT!
 nd_mge_steppe_modernization: "Степная модернизация" #NT!
 nd_mge_steppe_modernization_desc: "Империя адаптирует современные технологии производства к огромным размерам своих территорий, сочетая промышленный потенциал с логистическими традициями степи." #NT!
 nd_mge_legacy_of_conquest: "Наследие завоеваний" #NT!
 nd_mge_legacy_of_conquest_desc: "Военные традиции Чингисхана сохраняются и в современную эпоху. Монгольская конница, хотя и изменилась за столетия эволюции, остается грозной силой на любом поле боя." #NT!
 a_nd_mge_steppe_horse_archer: "Степной конный лучник" #NT!
 a_nd_mge_steppe_horse_archer_desc: "Конные лучники, воспитанные в монгольской степи, с детства тренированные в седле. Они обстреливают врагов стрелами, оставаясь, к сожалению, вне досягаемости." #NT!
 a_nd_mge_wolf_raider: "Волк-рейдер" #NT!
 a_nd_mge_wolf_raider_desc: "Легкая кавалерия обучалась нерге, великой охоте, специализируясь на окружении и преследовании. Они наносят удары с скоординированной яростью волчьей стаи." #NT!
 a_nd_mge_tumen_cavalry: "Тюменская тяжелая конница" #NT!
 a_nd_mge_tumen_cavalry_desc: "Бронированное сердце монгольского тумена: тяжелая кавалерия, оснащенная копьями, саблями и пластинчатыми доспехами, способная наносить разрушительные ударные удары." #NT!
 a_nd_mge_siege_engineer: "Монгольский осадный инженер" #NT!
 a_nd_mge_siege_engineer_desc: "Китайские и мусульманские инженеры, завербованные на службу монголам, управляли требушетами и другими осадными машинами, которые превращали в руины даже самые мощные укрепления." #NT!
 a_nd_mge_counterweight_trebuchet: "Противовес Требюшет" #NT!
 a_nd_mge_counterweight_trebuchet_desc: "Шарнирный противовес, разработанный персидскими инженерами, способный метать массивные снаряды с разрушительной точностью на большие расстояния." #NT!
 a_nd_mge_keshig: "Кешиг Страж" #NT!
 a_nd_mge_keshig_desc: "Элитная имперская гвардия Хана: десять тысяч проверенных воинов, обученных всем видам боя, которые служат как личными телохранителями, так и ударными отрядами." #NT!
 a_nd_mge_mangudai: "Мангудайский застрельщик" #NT!
 a_nd_mge_mangudai_desc: "Легкая кавалерия — мастера притворного отступления. Они заманивают врагов в погоню, затем разворачиваются, нанося карательные залпы стрел, а затем растворяются в степи." #NT!
 a_nd_mge_handgunner: "Монгольский стрелок" #NT!
 a_nd_mge_handgunner_desc: "Монгольская пехота, вооруженная адаптированным пороховым оружием, сочетала разрушительную огневую мощь огнестрельного оружия с мобильной тактикой степной войны." #NT!
 a_nd_mge_legacy_cavalry: "Наследие степной кавалерии" #NT!
 a_nd_mge_legacy_cavalry_desc: "Прямые потомки всадников Чингисхана, перенесшие многовековые кавалерийские традиции в современность с характерной монгольской мобильностью." #NT!
 nd_mge_bow_workshop: "Мастерская по изготовлению композитных луков" #NT!
 nd_mge_bow_workshop_desc: "Специализированная мастерская, где мастера-лучники создают легендарный монгольский составной лук из слоев рога, сухожилий и березовой древесины." #NT!
 nd_mge_ger_encampment: "Гер Лагерь" #NT!
 nd_mge_ger_encampment_desc: "Постоянная база из войлочных палаток, служащая перевалочным пунктом и складом снабжения для монгольских армий, действующих в глубине поля боя." #NT!
 nd_mge_ortaq_house: "Торговый Дом Ортак" #NT!
 nd_mge_ortaq_house_desc: "Партнерский офис, где монгольские князья и мусульманские купцы координируют огромные коммерческие предприятия, пересекающие торговые пути империи." #NT!
 nd_mge_kurultai_hall: "Курултайский зал" #NT!
 nd_mge_kurultai_hall_desc: "Большой зал собраний, где собираются монгольские вожди, генералы и знать, чтобы обсудить вопросы войны, престолонаследия и управления империей." #NT!
 nd_mge_imperial_mint: "Императорский монетный двор" #NT!
 nd_mge_imperial_mint_desc: "Предприятие по печати бумажных денег, пользующееся полной властью хана и облегчающее торговлю на обширных территориях империи." #NT!
 nd_mge_ortoo_station: "Ретрансляционная станция Ортоо" #NT!
 nd_mge_ortoo_station_desc: "Конная ретрансляционная станция в почтовой сети Яма, где посыльные обмениваются лошадьми, чтобы доставлять посылки по империи с поразительной скоростью." #NT!
 nd_mge_caravanserai: "Караван-сарай" #NT!
 nd_mge_caravanserai_desc: "Большая придорожная гостиница, предлагающая еду, ночлег и конюшни торговцам Шелкового пути, служащая центром торговли и информации на магистралях империи." #NT!
 nd_mge_khans_archive: "Ханский архив" #NT!
 nd_mge_khans_archive_desc: "Хранилище знаний, собранных со всех уголков империи: китайские свитки, персидские рукописи и монгольские устные предания, сохраненные для будущих поколений." #NT!
 nd_mge_bow_making: "Изготовление монгольского лука" #NT!
 nd_mge_bow_making_desc: "Мастера-лучники изготавливают композитные луки из березы, рога и сухожилий животных, создавая оружие смертоносной дальности и силы." #NT!
 nd_mge_ger_maintenance: "Обслуживание лагеря Гер" #NT!
 nd_mge_ger_maintenance_desc: "Уход за войлочными покрытиями и деревянными каркасами мобильных юрточных стоянок." #NT!
 nd_mge_ortaq_operations: "Ортак Торговые операции" #NT!
 nd_mge_ortaq_operations_desc: "Управление торговыми партнерствами и торговыми товарами, проходящими через коммерческую сеть ortaq." #NT!
 nd_mge_kurultai_provisions: "Положение Курултая" #NT!
 nd_mge_kurultai_provisions_desc: "Кормление и размещение собравшихся вождей и дворян во время больших обсуждений курултая." #NT!
 nd_mge_paper_note_printing: "Печать бумажных банкнот" #NT!
 nd_mge_paper_note_printing_desc: "Производство бумажных банкнот для имперской торговли." #NT!
 nd_mge_ortoo_upkeep: "Содержание станции Ортоо" #NT!
 nd_mge_ortoo_upkeep_desc: "Содержание табунов лошадей и продовольствия, обеспечивающего работу ретрансляционной сети Яма." #NT!
 nd_mge_caravanserai_hospitality: "Караван-сарай Гостеприимство" #NT!
 nd_mge_caravanserai_hospitality_desc: "Обеспечение едой, кровом и конюшнями торговцев, путешествующих по Шелковому пути." #NT!
 nd_mge_archive_upkeep: "Обслуживание архива" #NT!
 nd_mge_archive_upkeep_desc: "Хранение рукописей и свитков со всей империи в огромном ханском хранилище." #NT!
 nd_mge_caravan_tolls: "Сбор платы за караван" #NT!
 nd_mge_caravan_tolls_desc: "Сбор транзитной платы с торговцев, путешествующих под защитой хана по Шелковому пути." #NT!
 nd_mge_silk_road_exchange: "Биржа Шелкового пути" #NT!
 nd_mge_silk_road_exchange_desc: "Содействие обмену предметами роскоши между цивилизациями Востока и Запада." #NT!
 nd_mge_imperial_forging: "Ковка Имперского оружия" #NT!
 nd_mge_imperial_forging_desc: "Массовое производство унифицированного оружия и доспехов в ханских централизованных арсеналах." #NT!
 levy_nd_mge_noyan_retinue: "Ноянская свита" #NT!
 levy_nd_mge_noyan_retinue_desc: "Кавалерийские вассалы, собранные нойанскими командирами из числа своих домочадцев и родственников по племени." #NT!
 levy_nd_mge_legacy_cavalry: "Наследие степной кавалерии" #NT!
 levy_nd_mge_legacy_cavalry_desc: "Кавалеристы, воспитанные в древних традициях монгольской степи, сохраняющие боевое наследие всадников Чингисхана." #NT!
 STATIC_MODIFIER_NAME_nd_mge_yasa_enforcement: "Яса Правоприменение" #NT!
 STATIC_MODIFIER_DESC_nd_mge_yasa_enforcement: "Великая Яса соблюдается железной дисциплиной на всех территориях империи. Там, где соблюдается закон, царит порядок. И те, кто бросает ему вызов, встречают быстрое правосудие." #NT!
 STATIC_MODIFIER_NAME_nd_mge_silk_road_taxation: "Налогообложение Шелкового пути" #NT!
 STATIC_MODIFIER_DESC_nd_mge_silk_road_taxation: "Монгольские пункты сбора пошлин вдоль Шелкового пути взимают дань с каждого каравана, идущего под защитой хана, превращая мир империи в постоянный поток доходов." #NT!
 STATIC_MODIFIER_NAME_nd_mge_gunpowder_prosperity: "Пороховое процветание" #NT!
 STATIC_MODIFIER_DESC_nd_mge_gunpowder_prosperity: "Знания о пороховом оружии распространяются по всей империи, стимулируя инновации в производстве, строительстве и торговле, поскольку новые технологии преобразуют гражданскую жизнь наряду с военной." #NT!
 nd_mge_formed_tt: "была создана Монгольская империя." #NT!
 nd_mge_path_a_tt: "Выбрать путь вечного голубого неба" #NT!
 nd_mge_path_b_tt: "Выбрал Корону Мира" #NT!
 nd_mge_destiny: "Судьба Монгольской империи" #NT!
 nd_mge_destiny_desc: "Монгольская империя снова возродилась. Поддерживайте стабильность, пока Хан определяет путь империи в истории." #NT!
 nd_mge_dest_western_ride: "Западная поездка" #NT!
 nd_mge_dest_western_ride_desc: "Завершите работу Хулагу-хана. Подчините Багдад и Дамаск монгольскому владычеству, расширив влияние империи в самое сердце исламского мира." #NT!
 nd_mge_dest_southern_campaign: "Южная кампания" #NT!
 nd_mge_dest_southern_campaign_desc: "Обрати победный взор на юг. Богатства Индии давно соблазняли монгольских ханов: захватите Дели и Лахор, чтобы включить субконтинент в состав империи." #NT!
 nd_mge_dest_four_seas: "Империя четырех морей" #NT!
 nd_mge_dest_four_seas_desc: "Окончательное видение Чингисхана: империя, простирающаяся от моря до моря. Возьмите Константинополь, Каир и Буду, чтобы доказать господство монголов на трех континентах." #NT!
 nd_mge_dest_silk_renewed: "Шелковый путь обновлен" #NT!
 nd_mge_dest_silk_renewed_desc: "В условиях монгольского мира Шелковый путь снова процветает. Обеспечить потоки шелка через рынок капитала, наполнить имперскую казну и внедрить современное банковское дело." #NT!
 nd_mge_dest_exchange_civs: "Обмен цивилизациями" #NT!
 nd_mge_dest_exchange_civs_desc: "Империя соединяет Восток и Запад, способствуя крупнейшему обмену знаниями в истории. Развивайте сферу и используйте печатный станок для распространения знаний." #NT!
 nd_mge_dest_universal_dominion: "Вселенский Доминион" #NT!
 nd_mge_dest_universal_dominion_desc: "Монгольская империя стремится стать центром всемирной цивилизации. Достигните высочайшего развития, наполните казну и сделайте так, чтобы драгоценные камни украшали рынок капитала." #NT!
 nd_mge.6.t: "Империя восстановлена" #NT!
 nd_mge.6.d: "Монгольская империя возрождается, колосс, охватывающий всю Азию. Курултай подтвердил власть хана, и народ надеется, что его правитель направит это обширное владение к его судьбе. Будь то грохот копыт или тихий гул торговли, путь империи вперед будет записан в анналах истории." #NT!
 nd_mge.6.a: "Мир ждет воли Хана." #NT!
 nd_mge.7.t: "Западное путешествие начинается" #NT!
 nd_mge.7.d: "Монгольские знамена развеваются над Багдадом и Дамаском, городами, которые когда-то бросили вызов орде, а теперь склонились перед ханом. Бывшим центром власти Аббасидского халифата является монгольская земля, а древние перекрестки Леванта доносят грохот степной кавалерии. Западная граница империи была расширена за пределы того, чего достиг даже Хулагу." #NT!
 nd_mge.7.a: "От Тигра до Евфрата всё наше." #NT!
 nd_mge.8.t: "Ворота Индии" #NT!
 nd_mge.8.d: "Дели пал. Богатства субконтинента (его слоны, его специи, его огромные миллионы) теперь перетекают в монгольскую сферу. То, что предприняли и потерпели неудачу чагатайские ханы, восстановленная империя добилась. Хайберский перевал отдается эхом копыт ханской кавалерии, и султаны Индостана преклоняют колени перед силой, более могущественной, чем когда-либо они знали.\n\nКак Хан сможет закрепить эти южные завоевания?" #NT!
 nd_mge.8.a: "Установите быстрые линии снабжения кавалерии." #NT!
 nd_mge.8.b: "Пусть наше имя вселит ужас в их сердца." #NT!
 nd_mge.9.t: "Властелин четырех морей" #NT!
 nd_mge.9.d: "Константинополь, Каир, Буда (три города, представляющие три континента, три цивилизации, три тысячелетия истории) несут знамя хана. Монгольская империя теперь простирается от Тихого океана до Средиземноморья, от арктической тундры до дельты Нила. Ни одна империя в истории не могла сравниться с таким масштабом.\n\nХан стоит на вершине земной власти. Как будет отмечаться это высшее достижение?" #NT!
 nd_mge.9.a: "Завоевание никогда не закончится." #NT!
 nd_mge.9.b: "Принесите мир властью меча." #NT!
 nd_mge.10.t: "Шелковый путь снова оживает" #NT!
 nd_mge.10.d: "Шелковые караваны снова проходят через сердце империи, охраняемые монгольской кавалерией и облагаемые налогом монгольскими правителями. Рынки столицы переполнены прекрасными тканями из Китая, драгоценными камнями из Персии и специями со всех уголков известного мира. Имперская казна пополняется пошлинами за тысячи караванных путей." #NT!
 nd_mge.10.a: "Купцы процветают под ханским миром." #NT!
 nd_mge.11.t: "Великий обмен" #NT!
 nd_mge.11.d: "Под властью монголов беспрецедентный обмен знаниями охватывает весь континент. Китайские астрономы переписываются с персидскими математиками, уйгурские писцы переводят греческую философию, а печатные станки распространяют знания на дюжине языков. Империя стала не просто политическим образованием, но и проводником самой цивилизации.\n\nКак Хан направит этот расцвет знаний?" #NT!
 nd_mge.11.a: "Основал школы, чтобы распространить обучение по всему королевству." #NT!
 nd_mge.11.b: "Расширьте возможности торговцев как покровителей знаний." #NT!
 nd_mge.12.t: "Корона всех наций" #NT!
 nd_mge.12.d: "Монгольская империя достигла того, чего не удавалось ни одной другой державе в истории: настоящего универсального государства, в котором каждая культура вносит свой вклад, каждая традиция сохраняется, и каждый народ находит свое место под защитой хана. Развитие империи соперничает с величайшими цивилизациями всех времен, а ее казна переполнена богатствами континента.\n\nКакое наследие Хан оставит векам?" #NT!
 nd_mge.12.a: "Постройте вечную дорогу процветания." #NT!
 nd_mge.12.b: "Станьте ханом всех народов." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_swift_cavalry: "Доктрина быстрой кавалерии" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_swift_cavalry: "Линии снабжения кавалерии хана простираются от Инда до Ганга, а передающие станции обеспечивают быстрое подкрепление и пополнение запасов на завоеванных территориях." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_terror_steppe: "Степной ужас" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_terror_steppe: "Одно лишь приближение монгольских знамен заставляет города сдаваться без боя. Репутация Хана важнее его армий, хотя постоянные войны не оставляют времени для научных занятий." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_world_conqueror: "Завоеватель мира" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_world_conqueror: "Хан командует величайшей военной машиной в истории. Армии содержатся за меньшие деньги, а благородные рекруты пополняются воинами, стремящимися служить завоевателю известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_pax_sword: "Пакс под мечом" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_pax_sword: "Хан наводит порядок на завоеванных землях посредством твердого, но справедливого управления. Покоренные народы интегрируются в империю, а сословия находят удовлетворение под властью монголов." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_schools_east: "Школы Востока" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_schools_east: "Школы и обсерватории империи способствуют институциональному прогрессу и социальному прогрессу, хотя научный фокус отвлекает внимание от военных традиций." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_merchant_princes: "Мощные торговые дома доминируют в торговых центрах империи, обеспечивая процветание и коммерческую активность по всей обширной сети Шелкового пути." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_eternal_road: "Вечная дорога" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_eternal_road: "Шелковый путь стал больше, чем просто торговым маршрутом: это сама артерия цивилизации. Сырье течет свободно, население растет, и по всей империи царит религиозная гармония." #NT!
 STATIC_MODIFIER_NAME_nd_mge_dest_khan_peoples: "Хан всех народов" #NT!
 STATIC_MODIFIER_DESC_nd_mge_dest_khan_peoples: "Хан правит как суверен каждой нации в империи, расширяя дипломатическое влияние и способствуя всеобщей грамотности, хотя открытость королевства усложняет разведывательные операции." #NT!
 nd_mge_war_camp: "Монгольский военный лагерь" #NT!
 nd_mge_war_camp_desc: "Постоянный военный плацдарм в традициях великих лагерей Чингисхана, оборудованный для сбора, снабжения и переброски армий через обширные границы империи." #NT!
 nd_mge_house_of_wisdom: "Дом Мудрости" #NT!
 nd_mge_house_of_wisdom_desc: "Грандиозный центр обучения, вдохновленный легендарным Байт аль-Хикма в Багдаде, перестроенный под покровительством монголов как хранилище знаний каждой цивилизации, находившейся под властью хана." #NT!
 nd_mge_war_camp_maintenance: "Обеспечение военного лагеря" #NT!
 nd_mge_war_camp_maintenance_desc: "Поддержание оружия, средств передвижения и припасов на постоянных военных плацдармах Хана." #NT!
 nd_mge_house_wisdom_maintenance: "Содержание Дома Мудрости" #NT!
 nd_mge_house_wisdom_maintenance_desc: "Поддержание ученых, писцов и материалов величайшего учебного центра империи." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_mge_bureaucracy_authority: "Императорская Канцелярия Великого Хана" #NT!
 AUTO_MODIFIER_DESC_nd_mge_bureaucracy_authority: "После воссоединения империи канцелярии четырех ханств снова смогут работать как одно целое. Клерки Великого Хана открывают три постоянных институциональных места, помимо места, которое всегда предоставляет столица." #NT!
  
 mge_great_yasa_bureaucracy: "Великая Яса" #NT!
 mge_great_yasa_bureaucracy_desc: "Йеке Джасак — это обычное право, провозглашенное Чингисханом и разработанное при Угедее. Он связывает имперский род, армию и подвластные народы, устанавливая смертную казнь за воровство и прелюбодеяние, регулируя охоту и предписывая кешиг. Его свитки зачитываются вслух на каждом курилтае. Пока соблюдается закон, сохраняется степная дисциплина; противоречивые постановления и династические призывы, которыми когда-то пренебрегали, подрывают договор между ханом и его племенами." #NT!
  
 mge_kuriltai_assembly_bureaucracy: "Курилтайское собрание" #NT!
 mge_kuriltai_assembly_bureaucracy_desc: "Курилтай — великое собрание императорского рода и старших нойян, созванное для избрания нового хана, утверждения походов и дележа добычи. От Онона в 1206 году до Каракорума в 1251 году ни один монгольский трон не может быть неоспоримым без него. Собрание легитимизирует хана, но также фрагментирует процесс принятия имперских решений: раздел империи после смерти Мункэ в 1259 году является величайшей неудачей курилтая." #NT!
  
 mge_keshig_imperial_guard_bureaucracy: "Кешиг Имперская Гвардия" #NT!
 mge_keshig_imperial_guard_bureaucracy_desc: "Кешиг — десятитысячный придворный корпус Чингиса, разделенный на дневную стражу туркаут и ночную стражу кебтеул. Это одновременно и телохранитель хана, и его личный штаб, и школа подготовки будущих полководцев и даругачи. Вербовка берет в заложники сыновей нойанов, превращая потомственную аристократию в избранных королевских слуг. Если им пренебрегать, корпус превращается в позолоченную клику, а наследственный плен закрывает внутренний двор." #NT!
  
 mge_yam_postal_network_bureaucracy: "Почтовая сеть Ям" #NT!
 mge_yam_postal_network_bureaucracy_desc: "Ям — это система ретрансляционных станций, расположенных на расстоянии примерно дня тяжелой поездки друг от друга, укомплектованная хранителями ортооти, которые поставляют свежих скакунов имперским посланникам, несущим таблички власти пайза. Марко Поло описывает его как чудо империи: новости, указы, налоговые регистры и торговцы перемещаются по континентам за недели, а не за месяцы. Сеть финансируется за счет кубчурского налога и барщинного труда, взимаемого с крестьянских общин вдоль маршрутов, - бремени, на которое они горько возмущаются, но не могут отказаться." #NT!
  
 mge_darughachi_governance_bureaucracy: "Управление Даругачи" #NT!
 mge_darughachi_governance_bureaucracy_desc: "Даругачи (баскак на тюркском языке) — это назначаемый монголами постоянный комиссар, назначаемый над завоеванным городом или вассальным двором. Он проводит перепись, взимает тамги, набирает ремесленников для императорских мастерских и пересылает дань, причитающуюся Великому Хану. В отличие от держателей тимара или джагира, дарухачи не имеют земли и могут быть переданы по своему желанию: должность намеренно отделена от местной элиты, чтобы предотвратить ее захват, а русские и персидские хроники отмечают ее как самое тяжелое имперское бремя." #NT!
  
 mge_yelu_chucai_synthesis_bureaucracy: "Синтез Елу Чукая" #NT!
 mge_yelu_chucai_synthesis_bureaucracy_desc: "Елу Чукай, киданьский ученый, унаследованный от канцелярии Цзинь, убедил Угедей-хана, что обложение налогом оседлого населения более прибыльно, чем его резня. Под его руководством суд принимает налоговую практику Ляо-Цзиня: зарегистрированные домохозяйства, фиксированные сборы за серебро и шелк, ведение записей на китайском языке и использование клерков, прошедших конфуцианское обучение, вместо племенных бухгалтеров. Реформа требует командования оседлой столицей (Каракорумом или Даду) и отталкивает степную знать, которая теряет право на свободное грабежи." #NT!
