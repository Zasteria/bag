l_russian:
  # ===== TOOLTIP HOOKS FOR EVENT VARIABLES ===== 
 nd_aeg_formed_tt: "Египет был выкован." #NT!
 nd_aeg_path_a_tt: "По пути мамлюкского султана-фараона." #NT!
 nd_aeg_path_b_tt: "Следуя пути халифа Египта." #NT!
 nd_aeg_path_c_tt: "Следуя по пути коптско-исламского синтеза." #NT!
  
  # ===== STATIC MODIFIERS: FORMATION CHOICES ===== 
 STATIC_MODIFIER_NAME_nd_aeg_sultan_pharaoh: "Мамлюкский султан-фараон" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_sultan_pharaoh: "Рабская аристократия цитадели правит из Каира как наследница фараонов. Нил — трон; копье, лук и меч — регалии. Гегемония мамлюков — это новый династический порядок." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_caliph_of_egypt: "Халиф Египта" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_caliph_of_egypt: "Каир восстанавливает линию Аббасидов, пережившую падение Багдада. Султан как защитник халифа. Улемы аль-Азхара установили законы королевства. Суннитская юриспруденция является основой государственного управления." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_coptic_synthesis: "Коптско-исламский синтез" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_coptic_synthesis: "Нити фараонов, коптов и ислама сплелись в единую египетскую идентичность. Служители дивана — копты; солдаты цитадели — мусульмане; памятники пустыни принадлежат каждому. Египет помимо уммы." #NT!
  
  # ===== STATIC MODIFIERS: ADVANCE EVENTS ===== 
 STATIC_MODIFIER_NAME_nd_aeg_dynastic_legitimacy: "Династическая легитимность фараонов" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dynastic_legitimacy: "Султан стоит на линии Мемфиса и Фив. Придворные летописцы относят родословную к Менесу." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_imperial_centralization: "Имперская централизация" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_imperial_centralization: "Каир объединяет диваны, систему икта и губернаторов провинций в единый суд." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_azhar_jurisprudence: "Ажарская юриспруденция" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_azhar_jurisprudence: "Четыре суннитские юридические школы сходятся в аль-Азхаре. Фетвы Каира имеют вес от Андалусии до Ачеха." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_azhar_outreach: "Ажари Аутрич" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_azhar_outreach: "Студенты приезжают со всех уголков суннитского мира, чтобы учиться в академии. Они возвращаются как миссионеры власти Кайра." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_pilgrim_revenue: "Доход от каравана хаджа" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_pilgrim_revenue: "Паломники платят пошлину, привозят товары и торгуют через Каир. Шествие махалей в Мекку является краеугольным камнем финансовой политики." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_protector_of_holy_cities: "Защитник двух священных городов" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_protector_of_holy_cities: "Каир гарантирует безопасность Мекки и Медины. Шариф Мекки признает сюзеренитет султана." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_arsenal_of_cairo: "Арсенал Каира" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_arsenal_of_cairo: "Пушечно-литейные мастерские цитадели отливали бронзовые осадные орудия и полевую артиллерию. Мамлюки уже не брезгуют новым огнем." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_mamluk_continuity: "Преемственность мамлюкской кавалерии" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_mamluk_continuity: "Копье, лук и меч сохраняют свое место. Рабы цитадели по-прежнему решают исход сражения. Лошадь остается троном войны." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_caliphal_authority: "Халифская власть" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_authority: "Султан представляет халифа на каждой пятничной молитве. От его имени читают хутбу по всему царству." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_caliphal_diplomacy: "Халифская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_diplomacy: "Иностранные суннитские правители добиваются инвеституры халифа. Послы Дели в Гранаде кланяются при дворе Каира." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_canal_revenue: "Доходы Суэцкого канала" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_canal_revenue: "Разрыв между морями превращает Египет в держателя пошлин в мировой торговле." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_world_crossroads: "Перекресток мира" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_world_crossroads: "Каир и Александрия становятся перевалочными пунктами между Европой, Африкой и Индийским океаном." #NT!
  
 STATIC_MODIFIER_NAME_nd_aeg_national_renaissance: "Египетский национальный ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_national_renaissance: "Фараонская, коптская и арабская ветви признаны одним общим наследием. Цветы нахда в книжных магазинах и типографиях Каира." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_khedival_reform: "Реформа Хедивала" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_khedival_reform: "Министерства, школы и железнодорожные сети европейского типа. Египет модернизируется, не отказываясь от своего суверенитета." #NT!
  
  # ===== FORMATION EVENT ===== 
 nd_aeg.1.t: "Трон Двух Земель" #NT!
 nd_aeg.1.d: "Знамена Каира теперь развеваются над Мемфисом, Дамаском, Меккой, Донголой и Киреной. Корона Двух Земель возложена на голову султана, и мир наблюдает за цитаделью Салах ад-Дина одновременно с почтением и страхом.\n\nУлемы аль-Азхара говорят о восстановлении халифа. Эмиры Бахрии говорят о непрерывной преемственности мамлюков. Коптские патриархи и мусульманские купцы Александрии более спокойно говорят о Египте, отличном от какой-либо более широкой уммы, о земле старше, чем любая империя, когда-либо претендовавшая на нее.\n\nКаким должен быть новый Египет?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_aeg.1.a: "Мы правим как мамлюкские султаны, наследники фараонов." #NT!
 nd_aeg.1.b: "Каир станет резиденцией Халифата" #NT!
 nd_aeg.1.c: "Фараонский, коптский и исламский: один Египет" #NT!
  
  # ===== ADVANCE EVENT 2: Pharaonic Dynastic Claim ===== 
 nd_aeg.2.t: "Корона двух земель" #NT!
 nd_aeg.2.d: "Придворные летописцы, работающие в библиотеках Каира, прослеживают родословную султана от Айюбидов, Фатимидов, Тулунидов, римских Августов, Птолемеев и саитских царей и еще дальше, через жрецов-историков Мемфиса, до объединения Верхнего и Нижнего Египта при Менесе.\n\nФараонский урей и мамлюкский тюрбан появляются вместе на монетах, отчеканенных в цитадели. Генеалогия — вымысел, но полезный: она делает султана уникальным среди мусульманских правителей, единственным, чья линия насчитывает пять тысяч лет." #NT!
 nd_aeg.2.a: "Сделайте султана священной фигурой династии." #NT!
 nd_aeg.2.b: "Централизуйте диваны и губернаторов провинций в Каире." #NT!
  
  # ===== ADVANCE EVENT 3: al-Azhar ===== 
 nd_aeg.3.t: "Лампа аль-Азхара" #NT!
 nd_aeg.3.d: "Основанный в 970 году фатимидским генералом Джаухаром ас-Сикилли, восстановленный Салах ад-Дином как суннитская академия, аль-Азхар в настоящее время является ведущим юридическим учреждением суннитского мира. Каждый из четырех мазхабов имеет свой айван; студенты приезжают из Западной Африки, Индии, Кавказа и Андалусии и возвращаются домой в качестве судей, проповедников и миссионеров каирской власти.\n\nШейх аль-Азхар на практике является главным юристом суннитского ислама. Его фетвы имеют вес, которого не может достичь ни одна армия." #NT!
 nd_aeg.3.a: "Кодифицируйте суннитские законы на основе айванов аль-Азхара" #NT!
 nd_aeg.3.b: "Отправьте выпускников Ажари за границу в качестве миссионеров Каира" #NT!
  
  # ===== ADVANCE EVENT 4: Hajj Custodianship ===== 
 nd_aeg.4.t: "Служитель Двух Святынь" #NT!
 nd_aeg.4.d: "Процессия махалей покидает Каир каждый год, кисва сложена внутри паланкина: вышитого черного шелка, покрывающего Каабу, сотканного в Египте и обновляемого ежегодно. Шариф Мекки, потомок Пророка, выезжает навстречу ему; он удерживает свой трон с разрешения султана.\n\nОхранять хадж — значит охранять сам ислам. Носить титул #bold Хадим аль-Харамайн аш-Шарифайн#! (Слуга Двух Благородных Святилищ) значит претендовать на первенство над каждым мусульманским правителем от Андалусии до Ачеха." #NT!
 nd_aeg.4.a: "Получайте доход от караванов паломников и пошлин." #NT!
 nd_aeg.4.b: "Возьмите титул Хадим аль-Харамайн." #NT!
  
  # ===== ADVANCE EVENT 5: Gunpowder Transition ===== 
 nd_aeg.5.t: "Бронзовые пушки Цитадели" #NT!
 nd_aeg.5.d: "Амины цитадели издавна презирали огнестрельное оружие: это оружие пеших, недостойное рабской аристократии, сражающейся верхом на копье. В Мардж-Дабике в 1516 году это презрение стоило мамлюкам их государства.\n\nНа этот раз история меняется. Бронзу отливают в литейных цехах цитадели. В арсенале Каира имеется артиллерия для полевых операций и осады. Спор среди амиров заключается не в том, принимать ли на вооружение новое оружие, а в том, необходимо ли полностью переделать мамлюкский образ ведения войны или же пушки могут служить кавалерии, не заменяя ее." #NT!
 nd_aeg.5.a: "Постройте новый арсенал и поезд полевой артиллерии." #NT!
 nd_aeg.5.b: "Держите мамлюкскую конницу в самом центре войны" #NT!
  
  # ===== ADVANCE EVENT 6: Cairo Caliphate ===== 
 nd_aeg.6.t: "Преемник Пророка в Каире" #NT!
 nd_aeg.6.d: "Когда монголы Хулагу разграбили Багдад в 1258 году, беглец из рода Аббасидов был доставлен в Каир. Султаны-мамлюки управляли этим теневым халифатом на протяжении двух с половиной столетий: халиф благословлял султана на воцарение, султан держал халифа в достойной безвестности. После османов эта линия должна была закончиться.\n\nОна не заканчивается. Каир провозглашает себя халифом. Над цитаделью вновь развеваются черные знамена Аббасидов. Хутба в каждой мечети Египта обращается к нему по имени." #NT!
 nd_aeg.6.a: "Обладать духовной властью халифа" #NT!
 nd_aeg.6.b: "Используйте Халифат как инструмент дипломатии" #NT!
  
  # ===== ADVANCE EVENT 7: Suez Ambitions ===== 
 nd_aeg.7.t: "Разрыв между морями" #NT!
 nd_aeg.7.d: "Фараоны строили каналы от Нила до Красного моря: Нехо II, Дарий Перс, Птолемей II, Траян, Амр ибн аль-Ас. Порезы заилились; во сне этого не произошло. Египетские инженеры снова ходят по Горьким озерам с теодолитами и схемами раскопок.\n\nЗаполненный канал между Средиземным и Красным морями сократит мир. Вместо этого товары, идущие вокруг мыса, будут проходить через египетские таможни. Кто бы ни владел каналом, он станет местом встречи трех континентов." #NT!
 nd_aeg.7.a: "Взимать сборы с каждого судна, курсирующего между морями" #NT!
 nd_aeg.7.b: "Сделайте Каир перекрестком мировой торговли" #NT!
  
  # ===== ADVANCE EVENT 8: Pan-Egyptian Identity ===== 
 nd_aeg.8.t: "Три нити Египта" #NT!
 nd_aeg.8.d: "В типографиях Булака и лекционных залах аль-Азхара ученые Нахда формулируют новую версию того, кто такие египтяне. Это народ фараона: те же руки, которые строили пирамиды до самой долины Нила. Это народ коптских патриархов, сохранивших египетский язык в литургии святого Марка. Это люди Амра ибн аль-Аса, которые принесли арабский язык и ислам, не стирая то, что уже было.\n\nНе арабы, не африканские, не средиземноморские, но все они и однозначно ни один. Новый египтянин должен узнать, чем всегда был новый Египет." #NT!
 nd_aeg.8.a: "Возрождение: письма, археология, пресса." #NT!
 nd_aeg.8.b: "Модернизация: министерства, школы, заводы" #NT!
  
  # ===== ADVANCES ===== 
 nd_aeg_pharaonic_claim: "Династические претензии фараонов" #NT!
 nd_aeg_pharaonic_claim_desc: "Султан восседает на троне не только как командующий мамлюкскими эмирами, но и как наследник династической линии, проходящей через царей Птолемеев и Саитов до объединения Двух Земель. Придворные специалисты по генеалогии объединяют исламскую и доисламскую легитимность." #NT!
 nd_aeg_coptic_islamic_synthesis: "Коптско-исламский синтез" #NT!
 nd_aeg_coptic_islamic_synthesis_desc: "Население Египта (мусульмане, христиане-копты, евреи) рассматривается как единая цивилизационная преемственность, а не как завоеватель и побежденный. Коптские праздники, исламские фестивали и древнеегипетские сельскохозяйственные сезоны имеют общий календарь." #NT!
 nd_aeg_nile_irrigation: "Ирригационная инженерия Нила" #NT!
 nd_aeg_nile_irrigation_desc: "Шадуф, бассейновое орошение и барщина по расчистке каналов возведены в государственную науку. Нилометр в Роде измеряет налоги с учетом наводнения. Голод – это политическая неудача, а не стихийное бедствие." #NT!
 nd_aeg_bedouin_auxiliaries: "Бедуинская вспомогательная кавалерия" #NT!
 nd_aeg_bedouin_auxiliaries_desc: "Племена Бану Сулайм, Бану Хилал и Хиджази предоставляют имперской армии легкую лошадь в обмен на автономию пустыни и права на выпас скота." #NT!
 nd_aeg_citadel_doctrine: "Цитадель Доктрины Саладина" #NT!
 nd_aeg_citadel_doctrine_desc: "Крепость на Мокаттаме, возведенная Салах ад-Дином против крестоносцев, становится образцом фортификационной доктрины для каждого египетского города: она возвышается над городским кварталом с гарнизоном мамлюков и резиденцией губернатора." #NT!
  
 nd_aeg_al_azhar_scholarship: "Стипендия аль-Азхара" #NT!
 nd_aeg_al_azhar_scholarship_desc: "Каирская академия с тысячелетней историей становится высшим юридическим учреждением суннитского мира. Четыре мазхаба, хадисы, калам и арабская грамматика преподаются в масштабе ученым со всех концов уммы." #NT!
 nd_aeg_khan_al_khalili: "Хан аль-Халили" #NT!
 nd_aeg_khan_al_khalili_desc: "Обширный базарный квартал Каира, основанный при султане Баркуке в 1382 году и постоянно расширявшийся. Торговцы специями, серебряные мастера, парфюмеры и ткачи шелка занимают викалат и кайсарият, сгруппированные вокруг мечети Хусейна." #NT!
 nd_aeg_mamluk_lancer: "Мамлюкское уланское возрождение" #NT!
 nd_aeg_mamluk_lancer_desc: "Рабовладельческая аристократия восстанавливается как элитная рука. На майдане осваиваются копье, составной лук и саиф; Трактаты фурусийа изучаются как живое учение." #NT!
 nd_aeg_damascus_silk: "Дамасская шелковая ось" #NT!
 nd_aeg_damascus_silk_desc: "Дамаск и Алеппо, втянутые в египетское государство, поставляют шелк и дамасские ткани, которые идут через Каир в Средиземноморье. Внутренняя столица Леванта — второй полюс имперской торговли." #NT!
 nd_aeg_hajj_custodianship: "Опека над хаджем" #NT!
 nd_aeg_hajj_custodianship_desc: "Султан, как служитель Двух Святынь, организует и защищает ежегодный караван махалей. Безопасность паломников становится государственной монополией; Кисва Каабы ткут в Египте." #NT!
 nd_aeg_mamluk_maydan: "Мамлюкский Майдан" #NT!
 nd_aeg_mamluk_maydan_desc: "Открытые тренировочные площадки, где мамлюки учатся верховой езде, стрельбе из лука, фехтованию и копьям в соответствии с руководствами фурусийя. Ритуалы военной аристократии укрепились в эпоху Возрождения." #NT!
  
 nd_aeg_pharaonic_monumentalism: "Монументальная архитектура фараонов" #NT!
 nd_aeg_pharaonic_monumentalism_desc: "Общественные работы масштаба Нового царства: колоссальные мечети, водяные часы, величественные ворота, осевые проспекты. Султан в роли фараона оставляет каменные свидетельства в каждом крупном городе." #NT!
 nd_aeg_red_sea_trade: "Паломническая торговля Красного моря" #NT!
 nd_aeg_red_sea_trade_desc: "На маршруте от Суэца до Джидды и дальше к Индийскому океану преобладали египетские и йеменские купцы. Специи, кофе и ткани проходят через каирскую таможню по пути в Александрию." #NT!
 nd_aeg_nubian_gold: "Нубийское золото" #NT!
 nd_aeg_nubian_gold_desc: "Золотые прииски Донголы и перевалочные маршруты Сахары доставляют слитки через Асуан на монетные дворы Каира. Дирхам Египта обращается от Генуи до Каликута." #NT!
 nd_aeg_coptic_monasticism: "Коптская монашеская преемственность" #NT!
 nd_aeg_coptic_monasticism_desc: "Пустынные монастыри Вади-Натрун, Святой Екатерины и Святого Антония сохраняют рукописные традиции, сельскохозяйственные знания и коптскую грамотность. Интегрирован в императорскую библиотечную систему." #NT!
 nd_aeg_bahriyya_marines: "Бахрия Маринс" #NT!
 nd_aeg_bahriyya_marines_desc: "Первые мамлюки Бахри получили свое название от нильских казарм на острове Рода. Доктрина возвращается в виде речной и десантной пехоты: нильский флот, галеры Красного моря, прибрежные патрули Средиземного моря." #NT!
  
 nd_aeg_gunpowder_transition: "Пороховой переход" #NT!
 nd_aeg_gunpowder_transition_desc: "Историческое нежелание мамлюков использовать артиллерию преодолено. Литейные заводы Каира отливали бронзовые пушки; эшелоны полевой артиллерии сопровождают императорскую армию; осады ведутся редукционными батареями вместо длительных блокад." #NT!
 nd_aeg_cairo_caliphate: "Каирский халифат восстановлен" #NT!
 nd_aeg_cairo_caliphate_desc: "Линия Аббасидов, сохранившаяся в Каире с 1261 года, возвысилась из почетной тени до действующего халифа. Султан становится Защитником; халиф придает легитимность; вместе они выступают за суннитский ислам." #NT!
 nd_aeg_cyrenaica_frontier: "Киренаика Фронтир" #NT!
 nd_aeg_cyrenaica_frontier_desc: "Ливийское побережье от Бенгази до Адждабии, долгое время являвшееся границей между Египтом и Магрибом, управляется посредством укреплённых караванных станций и племенных договоров с братствами типа Сануси." #NT!
 nd_aeg_sultan_pharaoh_dynasty: "Династия Султан-Фараон" #NT!
 nd_aeg_sultan_pharaoh_dynasty_desc: "Мамлюкский принцип возвышения рабов-солдат сочетается с наследственными династическими притязаниями. Династия сохраняется, потому что и цитадель, и жречество признают одного и того же правителя." #NT!
 nd_aeg_burji_guard: "Имперская гвардия Бурджи" #NT!
 nd_aeg_burji_guard_desc: "Черкесские домашние войска цитадели Бурджийя, названные в честь башен (бурдж), где они были расквартированы, стали дисциплинированным пехотным ядром императорской армии." #NT!
  
 nd_aeg_pharaonic_administration: "Гражданская администрация фараонов" #NT!
 nd_aeg_pharaonic_administration_desc: "Диванская бюрократия, коптские клерки и архивные бюро в эллинистическом стиле слились в единую административную систему. Кашифы подчиняются Каиру; Каир отвечает султану-фараону." #NT!
 nd_aeg_modernized_cavalry: "Модернизированная мамлюкская кавалерия" #NT!
 nd_aeg_modernized_cavalry_desc: "Рабовладельческая аристократия приспосабливается: конные пистолеты, драгунская тактика, общевойсковая с артиллерией. Копье и лук не исчезают, но делят седло с карабином." #NT!
 nd_aeg_nile_state_irrigation: "Ирригация штата Нил" #NT!
 nd_aeg_nile_state_irrigation_desc: "Барщинный труд, мобилизованный фараонами-султанами прошлого, снова мобилизуется при абсолютистском правлении. Каналы углубляются, возводятся плотины, а бассейновое земледелие распространяется на Верхний Египет и Нубию." #NT!
 nd_aeg_coptic_bureaucracy: "Коптский бюрократический класс" #NT!
 nd_aeg_coptic_bureaucracy_desc: "В Диван аль-Мал и налоговых управлениях преобладают коптские христианские семьи: грамотные, многоязычные и зависящие от султана, а не от улемов. Противовес и цитадели, и мечети." #NT!
 nd_aeg_imperial_cairo: "Императорский Каир" #NT!
 nd_aeg_imperial_cairo_desc: "Аль-Кахира, Победоносная, становится столицей трех континентов. Население приближается к миллиону. В квартале Цитадели толпятся посольства всех суннитских и христианских держав." #NT!
  
 nd_aeg_suez_ambitions: "Суэцкие амбиции" #NT!
 nd_aeg_suez_ambitions_desc: "Мечта фараонов о пересечении морей возрождается. Инженеры обследуют маршрут, раскапывают Горькие озера и открывают канал от Порт-Саида до Суэца: принадлежащий Египту, управляемый Египтом и платный Египту." #NT!
 nd_aeg_khedival_modernization: "Хедиваль Модернизация" #NT!
 nd_aeg_khedival_modernization_desc: "Министерства европейского типа, призывные армии, нормальные школы и железные дороги — все это было создано без отказа от суверенитета. Каир учится у Парижа и Стамбула, не подчиняясь ни тому, ни другому." #NT!
 nd_aeg_industrial_spring: "Египетская промышленная весна" #NT!
 nd_aeg_industrial_spring_desc: "Хлопчатобумажные фабрики в дельте Нила, арсеналы в Каире, сахарные заводы в Минье и верфи в Александрии. Египетская промышленность начинает кормить египетскую армию и египетские рынки." #NT!
 nd_aeg_pan_egyptian_identity: "Панегипетская идентичность" #NT!
 nd_aeg_pan_egyptian_identity_desc: "Фараонское, коптское и арабское наследие стало единым национальным достоянием. Египтянин — это не просто араб, не просто африканец и не просто средиземноморец: Египет — это собственная цивилизация, старше и крупнее, чем любой ее преемник." #NT!
  
  # ===== UNITS ===== 
 a_nd_aeg_bedouin_horse: "Бедуинский вспомогательный отряд" #NT!
 a_nd_aeg_bedouin_horse_desc: "Легкая лошадь из племен Бану Сулайм, Бану Хилал и Хиджази. Быстрые рейдеры и разведчики; легкобронированный, невосприимчивый к истощению в пустыне." #NT!
 a_nd_aeg_bedouin_horse_levy: "Бедуинский вспомогательный отряд" #NT!
 a_nd_aeg_bedouin_horse_levy_desc: "Племенная кавалерия, набираемая из дворян пустынной границы." #NT!
 a_nd_aeg_mamluk_lancer: "Мамлюк Лансер" #NT!
 a_nd_aeg_mamluk_lancer_desc: "Рабская аристократия цитадели: кавалерия в доспехах, с детства обученная обращению с копьями, составным луком и саифом. Ударное оружие императорской армии." #NT!
 a_nd_aeg_mamluk_lancer_levy: "Мамлюк Лансер" #NT!
 a_nd_aeg_mamluk_lancer_levy_desc: "Мамлюкская домашняя конница амиров, воспитанная посредством системы сбора рабовладельческой аристократии." #NT!
 a_nd_aeg_bahriyya: "Бахрия Маринс" #NT!
 a_nd_aeg_bahriyya_desc: "Речная и десантная пехота расквартировалась в нильских казармах. Обучены пересекать воду, садиться на корабли и обходить реку с фланга." #NT!
 a_nd_aeg_bahriyya_levy: "Бахрия Маринс" #NT!
 a_nd_aeg_bahriyya_levy_desc: "Речная пехота, сформированная из населения нильского флота." #NT!
 a_nd_aeg_burji_guard: "Имперская гвардия Бурджи" #NT!
 a_nd_aeg_burji_guard_desc: "Черкесские домашние войска цитадели Бурджия, названной в честь башен, где они были расквартированы. Тяжелобронированный, дисциплинированный, оборонительный костяк имперской армии." #NT!
 a_nd_aeg_burji_guard_levy: "Имперская гвардия Бурджи" #NT!
 a_nd_aeg_burji_guard_levy_desc: "Войска гарнизона Цитадели, собранные из солдатского поместья." #NT!
 a_nd_aeg_khedival_nizam: "Хедивал Низам" #NT!
 a_nd_aeg_khedival_nizam_desc: "Европейская обученная линейная пехота реформы Хедивала: в форме, призванная на военную службу, оснащенная нарезными мушкетами. Новый египетский способ войны." #NT!
  
  # ===== LEVIES ===== 
 levy_nd_aeg_bedouin_horse: "Бедуинский вспомогательный сбор" #NT!
 levy_nd_aeg_mamluk_lancer: "Мамлюк Лансер Леви" #NT!
 levy_nd_aeg_bahriyya: "Бахрия Марин Леви" #NT!
 levy_nd_aeg_burji_guard: "Бурджи Страж Леви" #NT!
  
  # ===== BUILDINGS ===== 
 nd_aeg_citadel_of_saladin: "Цитадель Саладина" #NT!
 nd_aeg_citadel_of_saladin_desc: "Крепость на хребте Мокаттам, возведенная Салах ад-Дином против крестоносцев. Расположенный в гарнизоне Бурджии и резиденции султана-фараона, он выходит на Каир как дворец и арсенал." #NT!
 nd_aeg_shaduf_network: "Сеть Нила Шадуфа" #NT!
 nd_aeg_shaduf_network_desc: "Рычажные и противовесные ирригационные системы, бассейновые каналы и обслуживание дамб. Нилометр управляет налоговым сезоном; барщина поддерживает каналы; урожай кормит три континента." #NT!
 nd_aeg_al_azhar: "аль-Азхар" #NT!
 nd_aeg_al_azhar_desc: "Высшая суннитская юридическая академия, основанная в 970 году в Каире. Каждый из четырех мазхабов имеет свой айван; студенты приезжают со всех уголков уммы; Ажарские фетвы распространились от Андалусии до Ачеха." #NT!
 nd_aeg_khalili_bazaar: "Базар Хан аль-Халили" #NT!
 nd_aeg_khalili_bazaar_desc: "Огромный базарный квартал Каира. Торговцы специями, серебряные мастера, парфюмеры, ткачи шелка, кофейни и караванные стоянки паломников собираются вокруг мечети Хусейна." #NT!
 nd_aeg_maydan: "Мамлюкский Майдан" #NT!
 nd_aeg_maydan_desc: "Открытая тренировочная площадка, где мамлюки тренируются в верховой езде, стрельбе из лука, фехтованию и копьям в соответствии с руководствами фурусийя. Кузница рабовладельческой аристократии." #NT!
 nd_aeg_pharaonic_monument: "Памятник фараонам" #NT!
 nd_aeg_pharaonic_monument_desc: "Колоссальная архитектура в стиле Нового царства: величественные мечети, осевые проспекты, водяные часы, ворота в форме сфинкса. Султан как фараон пишет свое имя на камне своего города." #NT!
 nd_aeg_coptic_monastery: "Коптский монастырь" #NT!
 nd_aeg_coptic_monastery_desc: "Пустынные скиты и обнесенные стеной фундаменты Коптской православной церкви: Вади-Натрун, церковь Святого Антония, церковь Святой Екатерины. Сохраните рукописи, сельскохозяйственные знания и коптскую грамотность под имперским покровительством." #NT!
 nd_aeg_cairo_arsenal: "Каир Арсенал" #NT!
 nd_aeg_cairo_arsenal_desc: "Бронзово-пушечный цех цитадели. Императорские мечети становятся артиллерийскими полигонами; мастера-основатели Каира — соперники Стамбула и Венеции." #NT!
 nd_aeg_nubian_mint: "Нубийская мята" #NT!
 nd_aeg_nubian_mint_desc: "Монетный комплекс в Асуане, который превращает золото Донголы и слитки Сахары в дирхамы и динары Египта. Выпускает печать имени султана-фараона в обращение от Генуи до Каликута." #NT!
  
  # ===== DESTINY ADVANCES ===== 
 nd_aeg_destiny: "Судьба Египта" #NT!
 nd_aeg_destiny_desc: "Корона Двух Земель возложена. Теперь открывается путь: простирается ли империя вовне в завоеваниях или вовнутрь как цивилизация, которой не нужно двигаться, чтобы ее почувствовали." #NT!
 nd_aeg_dest_maghreb_reach: "Магрибский предел" #NT!
 nd_aeg_dest_maghreb_reach_desc: "Продвигайтесь к западу от Киренаики, в сторону побережья Ифрикиана. Возьмите Триполи и Кайруан (старый центр Аглабидов и Хафсидов) и разместите египетских губернаторов на африканском побережье, которым никогда не владел ни один мамлюк. Требуется армия из 30 полков и владение Триполи и Кайруаном." #NT!
 nd_aeg_dest_mesopotamian_push: "Месопотамский толчок на восток" #NT!
 nd_aeg_dest_mesopotamian_push_desc: "Пересеките сирийскую пустыню и захватите Багдад и Мосул, города, разрушенные монголами. Долина Тигра становится египетской провинцией; Город Мира, египетский гарнизон. Требуется Багдад, Мосул, общая численность 6000 человек и армия в 50 человек." #NT!
 nd_aeg_dest_pharaonic_empire: "Империя фараонов трех континентов" #NT!
 nd_aeg_dest_pharaonic_empire_desc: "Двигайтесь на юг мимо Нубии к Эфиопскому нагорью и границе Рога. Гондар и Харар попадают под корону фараонов. Требуется Гондар, Харар, армия 75 человек, престиж 75 и общее развитие 8000. Открывает фараонов обелиск." #NT!
 nd_aeg_dest_cairo_culture: "Каир как культурная столица" #NT!
 nd_aeg_dest_cairo_culture_desc: "Типографии Булака, библиотеки цитадели, лекционные залы аль-Азхара. Каир становится городом, где знания создаются, копируются и экспортируются. Требуется печатный станок, полное владение провинцией Александрия и 1000 золотых." #NT!
 nd_aeg_dest_azhar_world: "аль-Азхар как Всемирная академия" #NT!
 nd_aeg_dest_azhar_world_desc: "Каир становится интеллектуальным центром суннитского мира, городом, занявшим место Багдада. Требуется научная революция, шелк на рынке капитала и общее развитие 6000." #NT!
 nd_aeg_dest_suez_canal: "Разрез Суэцкого канала" #NT!
 nd_aeg_dest_suez_canal_desc: "Мечта фараонов о пересечении морей наконец-то осуществилась. Египетские инженеры, египетская столица, египетские пошлины. Требуется глобальная торговля, владение Суэцем, 3000 золота, престиж 75 и общее развитие 8000. Открывает Суэцкий канал." #NT!
  
  # ===== DESTINY EVENTS ===== 
 nd_aeg.9.t: "Путь судьбы" #NT!
 nd_aeg.9.d: "Корона отдыхает. Выбор сделан. Амиры цитадели и улемы аль-Азхара высказались; купцы Хана аль-Халили и коптские патриархи предложили свой совет. Чем бы ни стал Египет, теперь перед ним открывается дорога.\n\nВ хрониках Каира это год, который завершает одну историю и начинает другую." #NT!
 nd_aeg.9.a: "Итак, вперед, в нашу судьбу" #NT!
 nd_aeg.10.t: "Баннеры над Кайруаном" #NT!
 nd_aeg.10.d: "Египетская кавалерия преодолевает дюны к западу от Сирта и въезжает на равнину Ифрикиян. Ворота Триполи открываются без осады; Хафсидский гарнизон Кайруана ведет переговоры о капитуляции в течение недели. Мечеть Махдистов, рибат Аглабидов и огромные цистерны Омейядов теперь подчиняются Каиру. Магриб не видел египетского правления со времен Фатимидов." #NT!
 nd_aeg.10.a: "Запад наш" #NT!
 nd_aeg.11.t: "Багдад, город мира" #NT!
 nd_aeg.11.d: "Египетские колонны переправились через Тигр и приняли капитуляцию Багдада, города Хулагу сломали, города, которые по очереди удерживали Джалаириды, Ак-Коюнлу и Сефевиды. Черные знамена Аббасидов вновь развеваются над круглыми стенами. Мосул пал сезоном позже. Эмиры Каира спорят, что делать с сердцем Месопотамии: восстановить его как резиденцию легитимности или сохранить как жесткую границу?" #NT!
 nd_aeg.11.a: "Восстановить Багдад как вторую имперскую резиденцию" #NT!
 nd_aeg.11.b: "Сохраняйте Месопотамию как военизированный восточный марш." #NT!
 nd_aeg.12.t: "Империя трех континентов" #NT!
 nd_aeg.12.d: "Египетские войска переходят эфиопский откос. Император Соломонидов Гондара принимает вассальную зависимость; Стены Адали Харара падают. Территория Каира теперь охватывает Африку от Магриба до Рога, Азию от Леванта до Тигра и моря между ними. Придворные астрологи подсчитали, что ни одна держава со времен Рима не владела бы такой большой частью мира. Эмиры задаются вопросом: это каменная империя фараонов или универсальная легитимная монархия?" #NT!
 nd_aeg.12.a: "Поднимите обелиски на трех континентах" #NT!
 nd_aeg.12.b: "Проект фараона-султана как вселенского монарха" #NT!
 nd_aeg.13.t: "Прессы Булака" #NT!
 nd_aeg.13.d: "Каир больше не является просто резиденцией армий и цитаделью фараонов. Это город, где делают книги. Типографии «Булак» работают день и ночь; переписчикам великих библиотек соответствуют арабские наборщики, которые могут напечатать Коран за неделю. Коптские монастыри, айваны аль-Азхара и медицинская школа Мансуры привлекают ученых со всех концов уммы." #NT!
 nd_aeg.13.a: "Каир пишет книги, которые прочитает мир" #NT!
 nd_aeg.14.t: "Каир превосходит Багдад" #NT!
 nd_aeg.14.d: "На протяжении пяти столетий суннитское образование сравнивалось с утраченной славой Багдада, Дома Мудрости, переводческого движения, великой цепи халифов и визирей. Благодаря египетскому завоеванию, египетскому богатству и египетскому покровительству этот призрак наконец упокоился. Шейх аль-Азхар теперь фактически и номинально является главным юристом суннитского ислама. Эмиры задаются вопросом: станет ли Аль-Азхар центром обучения или преемником полной цивилизационной власти Багдада?" #NT!
 nd_aeg.14.a: "Аль-Азхар как мировой центр обучения" #NT!
 nd_aeg.14.b: "Каир как новый Багдад: сама цивилизация" #NT!
 nd_aeg.15.t: "Два моря соединились" #NT!
 nd_aeg.15.d: "После восьми лет барщинного труда, дноуглубительных работ и обработки камня проход между морями открыт. Первый корабль (египетская галера под знаменем фараона-султана) отправляется из Суэца в Порт-Саид за один рейс. Торговля, которая когда-то окружала Африку, теперь проходит через египетские таможни; мировая торговля протекает через египетскую землю.\n\nАмиры задаются вопросом: является ли канал финансовым механизмом (сборы и налоги) или цивилизационным достижением (Каир и Александрия как перевалочные пункты всех народов)?" #NT!
 nd_aeg.15.a: "Мир платит за Египет" #NT!
 nd_aeg.15.b: "Каир как место встречи всех народов" #NT!
  
  # ===== DESTINY TIMED MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_aeg_dest_baghdad_restored: "Багдад восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_baghdad_restored: "Город Мира развевается под знаменами Каира. Халиф благословляет египетское оружие; Диваны Месопотамии соответствуют египетским кашифам." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_eastern_marches: "Восточные марки" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_eastern_marches: "Месопотамия представляла собой жесткую границу: укрепленные караванные стоянки, мобильные гарнизоны и племенные союзы. Пустоши пустыни разъедают как солдата, так и врага." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_three_continents: "Империя трех континентов" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_three_continents: "Египетская власть простиралась от Магриба до Рога и Месопотамии. Сборы повышаются на всех континентах; Усталость от войны распространяется на более широкую базу." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_universal_pharaoh: "Универсальный фараон" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_universal_pharaoh: "Дипломаты Каира служат при каждом дворе; новые провинции быстро интегрируются; имперский свиток заполнен. Но кормление всемирного суда ухудшает урожайность Нила." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_seat_of_learning: "Место обучения" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_seat_of_learning: "Ученые растут быстрее, культурное сияние распространяется наружу, опустошенные земли быстрее восстанавливаются под покровительством Кайра." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_cairo_baghdad: "Новый Багдад" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_cairo_baghdad: "Каир претендует на цивилизационный титул, который потерял Багдад. Поместья признают лидерство Кайра; Религиозный авторитет исходит из Аль-Азхара. Патронаж такого масштаба стоит дорого." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_world_tollkeeper: "Сборщик пошлин мира" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_world_tollkeeper: "Каждое судно, курсирующее между морями, платит египетские пошлины. Торговые пути через египетские земли обходятся дешевле; золото поступает ежемесячно." #NT!
 STATIC_MODIFIER_NAME_nd_aeg_dest_meeting_of_seas: "Встреча морей" #NT!
 STATIC_MODIFIER_DESC_nd_aeg_dest_meeting_of_seas: "Каир и Александрия становятся перевалочными пунктами трех континентов. Прибывают моряки и мигранты; верфи работают на полную мощность; Египетский флот обладает высоким боевым духом." #NT!
  
  # ===== DESTINY BUILDINGS ===== 
 nd_aeg_pharaonic_obelisk: "Фараоновский обелиск" #NT!
 nd_aeg_pharaonic_obelisk_desc: "Высокие гранитные стелы, воздвигнутые в завоеванных городах египетскими каменщиками в стиле Нового царства. Иероглифический картуш султана-фараона отмечает предел его досягаемости. Триполи, Багдад, Гондэр: каждый город – стела, каждая стела – претензия." #NT!
 nd_aeg_suez_canal: "Суэцкий канал" #NT!
 nd_aeg_suez_canal_desc: "Разрез между морями, завершенный египетскими инженерами и египетской столицей. соединились Средиземное и Красное моря; мировая торговля проходит через египетскую таможню; Каир взимает пошлину с ста флагов." #NT!
  
  # ===== DESTINY BUILDING MAINTENANCE PMs ===== 
 nd_aeg_obelisk_maintenance: "Обелиск Каменный завод" #NT!
 nd_aeg_obelisk_maintenance_desc: "Гранит, добытый в Асуане, доставленный на нильской барже, ограненный и обработанный египетскими каменщиками в режиме Нового царства." #NT!
 nd_aeg_suez_canal_maintenance: "Обслуживание каналов" #NT!
 nd_aeg_suez_canal_maintenance_desc: "Горькие озера постоянно заилены; земснаряды, каменщики и смотрители шлюзов поддерживают разрез между морями." #NT!
  
  # ===== BUREAUCRACIES ===== 
  # Slot grant on formation 
 AUTO_MODIFIER_NAME_nd_aeg_bureaucracy_authority: "Диван султана-фараона" #NT!
 AUTO_MODIFIER_DESC_nd_aeg_bureaucracy_authority: "При формировании [AEG.GetName] наследует институциональный аппарат государства мамлюков-фараонов и может стать местом размещения исторической египетской бюрократии." #NT!
  
  # 1. Iqta-Halqa System 
 aeg_iqta_halqa_bureaucracy: "Икта ва-Халька" #NT!
 aeg_iqta_halqa_bureaucracy_desc: "Стандартизированная Бейбарсом и Калавуном в конце тринадцатого века, икта связывала ранг эмира с размером его налоговых льгот; В состав мамлюкских полков аджнад аль-халька набрала местную египетскую конницу и кавалерию вольноотпущенников под непосредственным командованием султана. Вместе эти два регистра обслуживали каждую кампанию от Айн-Джалута до границы Хиджаза." #NT!
  
  # 2. Diwan al-Mal 
 aeg_diwan_al_mal_bureaucracy: "Диван аль-Маль" #NT!
 aeg_diwan_al_mal_bureaucracy_desc: "Финансовое сердце мамлюкского Египта. Коптские христианские писцы доминировали в дававине с позднего периода Фатимидов на протяжении всей эпохи мамлюков, их опыт в области налогообложения и бухгалтерского учета передавался через семейные секретарские династии, такие как Хибат Аллах ас-Садид, Мустауфи ас-Сухба при Калауне. Всякий раз, когда народное давление высылало их, бюро отзывало их обратно: никто другой не мог вести бухгалтерские книги." #NT!
  
  # 3. Mashyakhat al-Azhar 
 aeg_mashyakhat_azhar_bureaucracy: "Машьяхат аль-Азхар" #NT!
 aeg_mashyakhat_azhar_bureaucracy_desc: "Основанный Фатимидами в 970 году и перешедший в суннитское учение после прихода к власти Саладина в 1171 году, аль-Азхар стал высшим учреждением суннитской юриспруденции после того, как Багдад пал перед монголами в 1258 году. Хайат Кибар аль-Улама собрал выдающихся юристов всех четырех мазхабов и издал фетвы, обязательные для исполнения от Марокко до Индонезии; Шейх аль-Азхара занимал высшую религиозную должность в королевстве." #NT!
  
  # 4. Khidmat al-Haramayn 
 aeg_khidmat_haramayn_bureaucracy: "Хидмат аль-Харамайн" #NT!
 aeg_khidmat_haramayn_bureaucracy_desc: "С середины четырнадцатого века султаны мамлюков претендовали на титул Хадим аль-Харамайн аш-Шарифайн (Слуга двух благородных святилищ). Махмаль, богато украшенные церемониальные носилки, ежегодно отправляемые вместе с караваном египетских паломников, утверждал суверенитет Каира над дорогой Хиджаз. Султан аль-Ашраф Барсбай использовал опеку, чтобы узаконить военную касту иностранного происхождения вопреки притязаниям конкурирующих мусульман." #NT!
  
  # 5. Karimi Tujjar al-Khan 
 aeg_karimi_tujjar_bureaucracy: "Карими Туджар аль-Хан" #NT!
 aeg_karimi_tujjar_bureaucracy_desc: "Карими были крупными торговцами специями и предметами роскоши средневекового Египта, засвидетельствованными с Фатимидов десятого века и консолидированными в коммерческую корпорацию к тринадцатому веку, в которую входили мусульмане, евреи и копты. Их штаб-квартирой стал Хан аль-Халили, основанный в 1382 году эмиром Джахаркасом аль-Халили; к началу шестнадцатого века в округе активно использовался 21 хан и викала." #NT!
