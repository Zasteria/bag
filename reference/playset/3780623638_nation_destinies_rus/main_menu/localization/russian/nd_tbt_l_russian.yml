l_russian:
  # === FORMATION EVENT === 
 nd_tbt.1.t: "Знамя Ценпо снова поднимается" #NT!
 nd_tbt.1.d: "Из долины Ярлунг раздается имперский призыв, и великие кланы Бода едут в Лхасу под бело-красным знаменем Ценпо. Над равниной Лхасы восстановлена ​​крепость Потала, бронзовые двери Джоканга распахнуты, а императорская колонна, на которой Сонгцен Гампо вырезал на камне свою клятву, отмыта от мха фрагментации.\n\nВеками Крыша Мира раскололась на церковные феодальные владения и умиротворенные узы. Теперь возвращается империя воинов Трисонг Децен и Ралпакан, империя, которая прошла от Лхасы до границы Тан и удерживала оазисы Тарима от Сынов Неба. Но какая это будет империя? Жрецы-гшен Юнгдрунг Бона продвигают старый имперский культ горных божеств и воинов-ценпо. Ламы Самье продвигают космополитический синтез Трех Королей Дхармы, проекты перевода, мандаловую империю Махаяны.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tbt.1.a: "Восстановить имперский культ Юнгдрунг-Бон (перейти в Бон)" #NT!
 nd_tbt.1.b: "Примите буддийский синтез Королей Дхармы" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_yungdrung_imperial_cult: "Императорский культ Юндрунг Бон" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_yungdrung_imperial_cult: "Добуддийское жречество вечной свастики Бон служит имперскому государству. Горные боги благословляют Ценпо и гьял-блонов, отправляющихся на войну под имперским знаменем Ярлунга." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_dharma_kings_synthesis: "Синтез Трех Королей Дхармы" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dharma_kings_synthesis: "Космополитическая мандала-империя Сонгцен Гампо, Трисонг Децен и Ралпакан возвращается. Санскритские и китайские сутры проникли в тибетский язык; Залы переводов Самье кипят от труда сотни пандитов." #NT!
  
  # === ADVANCE EVENT 2: Imperial Edicts on Stone (rdo-ring) === 
 nd_tbt.2.t: "Указы в камне" #NT!
 nd_tbt.2.d: "Под внешней стеной Джоханга возвышается новое кольцо рдо. Главный министр, главный лон-чен и главы великих кланов собираются, чтобы принести императорскую клятву, пока вырезается надпись: закон Ценпо, границы королевства, права и обязанности каждого клана. Как Трисонг Децен и Ралпакан когда-то вырезали свои клятвы на камне, чтобы их могли прочитать все поколения, так и эта империя свяжет себя.\n\nНо связывание работает двумя способами. Должен ли закон о колонне связать людей с Ценпо или связать Ценпо и ргьял-блон друг с другом?" #NT!
 nd_tbt.2.a: "Сделайте наши указы высшим законом всех" #NT!
 nd_tbt.2.b: "Высеките благородную клятву rgyal-blon" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_law_carved_in_stone: "Закон, высеченный в камне" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_law_carved_in_stone: "Императорский указ о рдо-кольце — высший закон каждого рода и округа. Летописи запишут, что никто не бросил ему вызов." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_oath_of_the_blon: "Клятва Блона" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_oath_of_the_blon: "Столп объединяет Ценпо и великие кланы ргьял-блон в единое заклятое братство. Их рекруты едут по приказу императора; их земли служат имперскому делу." #NT!
  
  # === ADVANCE EVENT 3: Samye and the Bon-Buddhist Debate === 
 nd_tbt.3.t: "Дебаты Самье" #NT!
 nd_tbt.3.d: "В монастыре Самье, основанном Трисонгом Деценом в 779 году по образцу индийской мандалы, две великие буддийские школы борются за душу империи. Индийский мастер Камалашила выступает за постепенное совершенствование посредством обучения и дисциплины; китайский учитель чань Хешанг Мохэян выступает за внезапное просветление.\n\nВ исторических записях индейцы победили, и Хешанг был отправлен домой. Но как в Священных Писаниях, так и в хрониках оба аргумента до сих пор сохраняются. Сам Ценпо должен вынести решение. В каком направлении будет развиваться буддизм империи?" #NT!
 nd_tbt.3.a: "Примите индийскую Махаяну постепенного совершенствования." #NT!
 nd_tbt.3.b: "Примите китайский Чань внезапного пробуждения." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_indian_mahayana_path: "Индийский путь Махаяны" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_indian_mahayana_path: "Залы переводчиков заполнены санскритскими пандитами. Логика, дебаты и поэтапная практика бодхисаттвы распространились от Самье до каждого монастыря на плато." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_chinese_chan_path: "Китайский путь Чань" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_chinese_chan_path: "Школа внезапного пробуждения Хэшана процветает вопреки истории. Мастера Чань занимают место в Самье, а более спокойный и менее доктринальный буддизм укореняется в Боде." #NT!
  
  # === ADVANCE EVENT 4: Tarim Basin Garrisons === 
 nd_tbt.4.t: "Четыре гарнизона Тарима" #NT!
 nd_tbt.4.d: "Оазисы Таримской котловины, танский протекторат Аньси, снова переходят под контроль имперских тибетских армий. Хотан, Кашгар, Куча и Карашар открывают свои ворота всадникам, выезжающим с перевалов Куньлунь. Шелковый путь в наших руках. Караваны из Согдианы и Хорасана теперь платят пошлины таможням Ценпо.\n\nЧто нам делать с этими городами-оазисами? Разместить в них гарнизон в качестве имперских провинций и напрямую интегрировать торговцев, или же оставить их в качестве протекторатов, которые платят дань и снабжают вспомогательными войсками?" #NT!
 nd_tbt.4.a: "Разместите гарнизоны в оазисах как имперские провинции Шелкового пути." #NT!
 nd_tbt.4.b: "Сделайте королей оазисов протекторатами, платящими дань." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_silk_road_dominion: "Доминион Шелкового пути" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_silk_road_dominion: "Имперские гарнизоны держат Четыре Гарнизона. Согдийские, хотанские и уйгурские купцы платят пошлины Лхасе. Шелковый путь – тибетская дорога." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_oasis_protectorate: "Протекторат Оазиса" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_oasis_protectorate: "Короли оазисов сохраняют свои троны в обмен на дань, сборы и клятвы Ценпо. Империя удерживает их посредством чести, а не легионов." #NT!
  
  # === ADVANCE EVENT 5: Treaty of 821-822 === 
 nd_tbt.5.t: "Столп Договора в Джоханге" #NT!
 nd_tbt.5.d: "Трехъязычная колонна перед храмом Джоканг свидетельствует о великом китайско-тибетском мире 821-822 годов, договоре «дядя-племянник» между Ценпо и Тан, Сыном Неба. Граница фиксирована; заклятая граница в коридоре Хэси должна стоять «пока текут реки и восходит солнце».\n\nПрошло поколение с тех пор, как надпись была впервые вырезана. Совет Ценпо обсуждает, следует ли соблюдать договор как основу стабильного порядка или воспользоваться моментом слабости на границе Тан и возобновить войну, которая построила нашу империю." #NT!
 nd_tbt.5.a: "Почитайте заклятые границы как нашу дипломатическую основу" #NT!
 nd_tbt.5.b: "Возобновите приграничную войну, пока у нас есть преимущество." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_sworn_borders: "Заклятые границы" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_sworn_borders: "Основа договора остается неизменной. Тибетские послы несут императорскую печать до Чанъаня, Багана и Самарканда. Каждый сосед воспринимает наше слово как обязательное." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_frontier_war_renewed: "Пограничная война возобновляется" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_frontier_war_renewed: "Армия Ценпо движется на восток. Коридор Хэси и границы Ганьсу — это открытая территория, и имперское дело требует их восстановления." #NT!
  
  # === ADVANCE EVENT 6: Imperial Cabinet Codification (gar-zlon) === 
 nd_tbt.6.t: "Совет семи министров" #NT!
 nd_tbt.6.d: "Главный министр Гар Тонгцен, который служил Сонгцену Гампо архитектором ранней империи, официально оформляет гар-злон: императорский кабинет из семи министров. Блон-чен (главный министр), Нанг-блон (внутренние дела), Фи-блон (иностранные дела), Дмаг-блон (война), Гцанг-блон (казначейство), Чос-блон (религия) и rgyal-blon-chen (глава великих кланов) встречаются на совете, чтобы управлять империей, в то время как Ценпо возглавляет войско.\n\nЭто новая форма имперского правительства: Ценпо. едет во главе своей армии, в то время как империя продолжает управлять собой." #NT!
 nd_tbt.6.a: "Созвать Совет Семи" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_council_of_seven: "Совет семи министров" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_council_of_seven: "Гар-злон ежедневно собирается в Лхасе. Империя продолжает управлять собой, даже когда Ценпо находится в походе." #NT!
  
  # === ADVANCE EVENT 7: Tonmi Sambhota's Script Reform === 
 nd_tbt.7.t: "Письма плато" #NT!
 nd_tbt.7.d: "Министр Тонми Самбхота возвращается из своего длительного обучения в Индии с новым алфавитом, адаптированным на основе индийского письма, полученного от брахми, и адаптированным к звукам тибетского языка. По приказу Сонгцена Гампо он становится императорским письмом, используемым для указов, договоров, хроник и первых переводов буддийских писаний.\n\nТам, где раньше наши указы распространялись голосом глашатая и забывались через поколение, теперь они будут вырезаны на камне, нарисованы кистью на пальмовых листьях и напечатаны на блоках. Империя учится помнить себя." #NT!
 nd_tbt.7.a: "Обнародовать сценарий по всей империи" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_letters_of_the_plateau: "Письма Плато" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_letters_of_the_plateau: "Из императорских скрипторий льются печатные писания и рукописные хроники. Грамотность распространяется из Лхасы по всем дорогам долины." #NT!
  
  # === ADVANCES: AGE 1 === 
 nd_tbt_seven_ministers: "Совет семи министров" #NT!
 nd_tbt_seven_ministers_desc: "Кодифицируйте имперский кабинет гар-злон из семи министров, созданный Гаром Тонгценом, что позволит империи управлять собой, пока Ценпо ведет кампанию в полевых условиях." #NT!
 nd_tbt_yul_sde_levy: "Юл-сде районный сбор" #NT!
 nd_tbt_yul_sde_levy_desc: "Имперская административная система хри-сде собирает копье-луковые ополчения по домохозяйствам. Каждый район должен Ценпо свою долю вооруженных людей." #NT!
 nd_tbt_rgyal_blon_cavalry: "Кольчужная кавалерия Ргьял-блона" #NT!
 nd_tbt_rgyal_blon_cavalry_desc: "В танских хрониках их называли «людьми и лошадьми, закованными в железо». Великие кланы выставляют бронированных улан в качестве ударного оружия империи." #NT!
 nd_tbt_rdo_ring_edicts: "Имперские указы Рдо-ринга" #NT!
 nd_tbt_rdo_ring_edicts_desc: "Высекайте имперские законы на каменных колоннах по всему королевству в манере Сонгцен Гампо, Трисонг Децен и Ралпакан. То, что высечено в камне, переживет каждую династию." #NT!
 nd_tbt_yungdrung_bon: "Культ Юндрунг Бон" #NT!
 nd_tbt_yungdrung_bon_desc: "Восстановить добуддийское священство вечной свастики Бон как имперский государственный культ. Горные божества и воинские обряды благословляют знамя Ценпо." #NT!
 nd_tbt_yak_wool_weaving: "Ткачество из шерсти яка" #NT!
 nd_tbt_yak_wool_weaving_desc: "Тяжелая валяная ткань намбу и знаменитые тибетские ковры, сотканные из шерсти яка, с которой не может сравниться ни одно равнинное стадо." #NT!
 nd_tbt_tonmi_script: "Реформа сценария Тонми Самбхоты" #NT!
 nd_tbt_tonmi_script_desc: "Примите новый алфавит, адаптированный на основе Брахми для тибетского языка. Имперские скриптории теперь могут записывать указы, хроники и переведенные Священные Писания нашим собственным шрифтом." #NT!
  
  # === ADVANCES: AGE 2 === 
 nd_tbt_samye_synthesis: "Монастырский синтез Самье" #NT!
 nd_tbt_samye_synthesis_desc: "Нашел монастырь Самье в плане мандалы, университет перевода, где встречаются санскритские, китайские и тибетские науки. Империя становится покровителем космополитического буддизма." #NT!
 nd_tbt_tarim_garrisons: "Гарнизоны Таримского бассейна" #NT!
 nd_tbt_tarim_garrisons_desc: "Удерживайте четыре гарнизона протектората Аньси против Тан. Тибетские армии на Шелковом пути ведут кампанию в тысячах ли от Лхасы." #NT!
 nd_tbt_chama_trade: "Торговля чамским чаем и лошадьми" #NT!
 nd_tbt_chama_trade_desc: "Постройте великолепные ярмарочные караван-сараи на маршруте Чама. Чай из Юньнани и Сычуани доставляется на плато в обмен на боевых коней, направляющихся в армии Тан." #NT!
 nd_tbt_translation_bureau: "Императорское бюро переводов" #NT!
 nd_tbt_translation_bureau_desc: "Мастера-переводчики ло-ца-ба переводят на тибетский язык санскрит Махаяну, китайскую чань и хотанскую тантру. Плато становится великим составителем азиатского буддизма." #NT!
 nd_tbt_himalayan_metallurgy: "Гималайская металлургия" #NT!
 nd_tbt_himalayan_metallurgy_desc: "Тибетское железо и медь легендарного качества. Кольчужные кавалерийские доспехи славились во всей Азии своим мастерством изготовления." #NT!
 nd_tbt_imperial_horse_breeding: "Императорское коневодство" #NT!
 nd_tbt_imperial_horse_breeding_desc: "Имперские пастбища Амдо кормят как торговлю чама, так и нашу собственную кавалерию. Тибетские боевые кони востребованы по всему Китаю." #NT!
  
  # === ADVANCES: AGE 3 === 
 nd_tbt_uncle_nephew_treaty: "Договор дяди и племянника" #NT!
 nd_tbt_uncle_nephew_treaty_desc: "Столп договора 821–822 годов в Джоханге устанавливает китайско-тибетский мир «по мере того, как текут реки и восходит солнце». Империя как равноправная Тан." #NT!
 nd_tbt_rdzong_doctrine: "Доктрина крепости Рдзонг" #NT!
 nd_tbt_rdzong_doctrine_desc: "Крепости дзонг, венчающие каждую стратегическую скалу, образуют оборонительный хребет. Каменные стены поднимаются по склонам гор." #NT!
 nd_tbt_khams_riders: "Кхамспа Frontier Riders" #NT!
 nd_tbt_khams_riders_desc: "Длиннорукие всадники восточных границ, собранные для набегов и вражды, использовались как легкая кавалерия, наносящая удары далеко за пределы имперской границы." #NT!
 nd_tbt_butter_tea_economy: "Масло-Чай Экономика" #NT!
 nd_tbt_butter_tea_economy_desc: "Прессованный кирпичный чай, соль и масло яка — основная троица жизни на плато. Караван-сараи чама теперь перерабатывают и реэкспортируют кирпичный чай на все рынки." #NT!
 nd_tbt_codified_imperial_law: "Кодифицированный имперский закон" #NT!
 nd_tbt_codified_imperial_law_desc: "Корпус Бка йиг-тшанг кодифицирует императорские указы на камне в письменную правовую традицию. Имперские судьи едут по трассе." #NT!
 nd_tbt_high_pass_logistics: "Высококлассная логистика" #NT!
 nd_tbt_high_pass_logistics_desc: "Офицеры-снабженцы дмаг-блона осваивают высокие перевалы. Имперские колонны могут пройти через Куньлунь и Каракорум с неповрежденными продовольствием." #NT!
  
  # === ADVANCES: AGE 4 === 
 nd_tbt_imperial_guard_reform: "Реформа Императорской гвардии (ску-сранг)" #NT!
 nd_tbt_imperial_guard_reform_desc: "Сделайте ску-сранг постоянной императорской гвардией, отличной от ополчения. Дисциплинированная тяжелая пехота, профессиональная и постоянная." #NT!
 nd_tbt_himalayan_isolation_doctrine: "Гималайская доктрина изоляции" #NT!
 nd_tbt_himalayan_isolation_doctrine_desc: "Удерживайте империю за самыми высокими перевалами на Земле. Пусть низменные армии разобьются на Рдзонге, прежде чем достигнут сердца плато." #NT!
 nd_tbt_state_buddhism_reform: "Государственная реформа буддизма" #NT!
 nd_tbt_state_buddhism_reform_desc: "Имперская сангха реформируется как инструмент государства. Великие монастыри находятся под королевским покровительством; доктринальные споры разрешаются императорским указом." #NT!
 nd_tbt_revived_court_culture: "Возрожденная придворная культура" #NT!
 nd_tbt_revived_court_culture_desc: "Сознательно возрождается ярлунг-императорская придворная традиция: поэзия, музыка, ритуальные времена года, хроники Ценпо. Лхаса становится культурной столицей плато мира." #NT!
 nd_tbt_vajra_tradition: "Ваджрная тантрическая традиция" #NT!
 nd_tbt_vajra_tradition_desc: "Тантрический корпус ваджраяны, тщательно переведенный и индексируемый в крупнейших монастырях, становится выдающимся буддийским вкладом империи в Азию. Картины танка из шелковой парчи висят в каждом императорском святилище." #NT!
 nd_tbt_ten_pillars_taxation: "Десять столпов имперского налогообложения" #NT!
 nd_tbt_ten_pillars_taxation_desc: "По всей империи воздвигнуто десять стандартизированных налоговых столпов, фиксирующих имперскую долю урожая, стада и торговли в резных законах." #NT!
  
  # === ADVANCES: AGE 5 === 
 nd_tbt_plateau_artillery_doctrine: "Доктрина плато-артиллерии" #NT!
 nd_tbt_plateau_artillery_doctrine_desc: "Бронзовые пушки, отлитые на императорских литейных заводах Лхасы из меди Кхамса. Артиллерия, размещенная на стенах Рдзонга, доминирует на каждом подходе к плато." #NT!
 nd_tbt_lhasa_grand_assembly: "Большая ассамблея Лхасы" #NT!
 nd_tbt_lhasa_grand_assembly_desc: "Гар-злон расширяется до великого имперского собрания, в котором могут участвовать региональные кланы, великие монастыри и торговые гильдии." #NT!
 nd_tbt_brick_tea_monopoly: "Императорская кирпично-чайная монополия" #NT!
 nd_tbt_brick_tea_monopoly_desc: "Прессование, запечатывание и экспорт кирпично-чайного кирпича становится коронной монополией. Каждый кирпичик скреплен императорской печатью." #NT!
 nd_tbt_great_road_network: "Императорская дорожная сеть" #NT!
 nd_tbt_great_road_network_desc: "Дорожная служба Ценпо поддерживает сеть почтовых дорог, курьерских станций и мостовых переходов по всей империи. Депеша из Лхасы достигает Хотана через четырнадцать дней." #NT!
 nd_tbt_gold_panning_industry: "Императорское золотопромывание" #NT!
 nd_tbt_gold_panning_industry_desc: "Россыпные месторождения золота и серебра в верховьях Инда, Сатледжа и Брахмапутры организованы как коронные отрасли. Тибетские слитки покупают то, чего не могут достичь тибетские армии." #NT!
 nd_tbt_mountain_engineering: "Горно-инженерный корпус" #NT!
 nd_tbt_mountain_engineering_desc: "Имперские инженеры, специализирующиеся на высотном строительстве: шлюзовые мосты через гималайские ущелья, ступенчатые ступы, поднимающиеся по скалам, инженерная традиция, сделавшая возможным Рдзонг." #NT!
  
  # === ADVANCES: AGE 6 === 
 nd_tbt_modern_imperial_military: "Современная имперская армия" #NT!
 nd_tbt_modern_imperial_military_desc: "Ополчение юл-сде и благородная кавалерия ргьял-блон уступают место профессиональной постоянной армии, обученной по европейскому образцу, но командующей на тибетском языке." #NT!
 nd_tbt_state_printing_press: "Государственная типография" #NT!
 nd_tbt_state_printing_press_desc: "В императорских скрипториях используются механические наборные и паровые печатные машины. Книги, газеты и альманахи, написанные на тибетском языке, текут из Лхасы в каждый торговый город." #NT!
 nd_tbt_himalayan_industry: "Гималайская промышленная реформа" #NT!
 nd_tbt_himalayan_industry_desc: "Гидравлические мельницы используют великие реки, стекающие с плато. Вокруг Лхасы и Шигадзе расположены чугунолитейные, текстильные и пороховые фабрики." #NT!
 nd_tbt_revived_imperial_idea: "Возрожденная имперская идея" #NT!
 nd_tbt_revived_imperial_idea_desc: "Современные историки и летописцы вновь открывают для себя империю Ярлунг и провозглашают ее восстановление судьбой тибетской нации. Титул Ценпо вновь обретает свой прежний вес." #NT!
 nd_tbt_neutral_diplomacy_doctrine: "Азиатская нейтральная дипломатия" #NT!
 nd_tbt_neutral_diplomacy_doctrine_desc: "Империя позиционирует себя как нейтральный посредник между равнинными державами. Дипломатам Лхасы доверяют передавать сообщения между соперниками, которые не доверяют своим собственным посланникам." #NT!
 nd_tbt_modern_administration: "Современная администрация" #NT!
 nd_tbt_modern_administration_desc: "Семь имперских министерств реорганизованы в современные административные департаменты. Плато становится государством в современном смысле слова, оставаясь при этом империей в старом смысле этого слова." #NT!
  
  # === BUILDINGS === 
 nd_tbt_rdo_ring: "Рдо-ринг (Императорский каменный столб)" #NT!
 nd_tbt_rdo_ring_desc: "Монументальный каменный столб, на котором написаны имперские законы, условия договоров и клятвы великих кланов. На кольце Джоханг до сих пор хранится китайско-тибетский договор 821–822 годов, вырезанный тремя буквами." #NT!
 nd_tbt_bon_sanctuary: "Императорское святилище Бон" #NT!
 nd_tbt_bon_sanctuary_desc: "Храм-крепость Юндрунг-Бон, укомплектованный жрецами-гшенами добуддийской традиции. Здесь соблюдаются императорские обряды горных божеств, а во дворе собираются местные сборные." #NT!
 nd_tbt_samye_monastery: "Монастырский комплекс в стиле Самье" #NT!
 nd_tbt_samye_monastery_desc: "Грандиозный монастырский комплекс в виде мандалы, созданный по образцу Самье, основанный Трисонгом Деценом в 779 году. Вокруг центрального храма группируются залы для перевода, дворы для дискуссий, скриптории и башни-ступы." #NT!
 nd_tbt_imperial_scriptorium: "Императорский скрипторий" #NT!
 nd_tbt_imperial_scriptorium_desc: "Бюро переводов и печати, где тексты на санскрите, китайском, хотанском и персидском языках переводятся на тибетское письмо и печатаются ксилографией для распространения по всей империи." #NT!
 nd_tbt_rdzong: "Рдзонг (Крепость на плато)" #NT!
 nd_tbt_rdzong_desc: "Каменная крепость, возвышающаяся на скалах, стратегический хребет имперской оборонительной системы. Гарнизоны Рдзонга удерживают высокие перевалы и наблюдают за имперскими границами сверху." #NT!
 nd_tbt_chama_caravanserai: "Чамский торгово-ярмарочный Караван-сарай" #NT!
 nd_tbt_chama_caravanserai_desc: "Укрепленный караван-сарай на чайно-лошадином торговом пути. Юньнаньский кирпичный чай обменивают на тибетских боевых коней; таможенники гцанг-блона взимают имперские пошлины." #NT!
 nd_tbt_nambu_workshop: "Мастерская по производству шерсти яка Намбу" #NT!
 nd_tbt_nambu_workshop_desc: "Гильдия ткачей, производящих войлок намбу и знаменитые тибетские ковры. Тяжелая шерсть яка, валяная и окрашенная на месте, обрабатывается как для внутреннего использования, так и для экспорта по всей Азии." #NT!
 nd_tbt_council_hall: "Зал Императорского Совета (гар-злон)" #NT!
 nd_tbt_council_hall_desc: "Зал, где встречаются семь имперских министров, чтобы управлять империей во время кампании Ценпо. Кодифицирован главным министром Гаром Тонгценом в 654–655 гг." #NT!
  
  # === BUILDING PRODUCTION METHODS === 
 nd_tbt_rdo_ring_maintenance: "Уход за каменным столбом" #NT!
 nd_tbt_rdo_ring_maintenance_desc: "Каменщики и писцы, которые чистят, перерезают и перерисовывают надписи на императорских колоннах." #NT!
 nd_tbt_bon_sanctuary_maintenance: "Обслуживание святилища Бон" #NT!
 nd_tbt_bon_sanctuary_maintenance_desc: "Благовония, ритуальные ткани, масляные лампы и приношения стада, предназначенные для обрядов гшен-жрецов." #NT!
 nd_tbt_samye_maintenance: "Содержание монастыря Самье" #NT!
 nd_tbt_samye_maintenance_desc: "Бумага для переводов, пчелиный воск для ламп, благовония для ежедневных обрядов и керамика для трапезных." #NT!
 nd_tbt_block_print_pm: "Писание, напечатанное печатным шрифтом" #NT!
 nd_tbt_block_print_pm_desc: "Вырезанные деревянные блоки санскрита и тибетского канона, окрашенные и напечатанные на прессованной бумаге в монастырской скриптории." #NT!
 nd_tbt_tantric_translation_pm: "Проект тантрического перевода" #NT!
 nd_tbt_tantric_translation_pm_desc: "Мастера-переводчики ло-ца-ба переводят санскритские тантрические тексты на тибетский язык, выпуская ксилографические издания Кангьюра и Тенгьюра." #NT!
 nd_tbt_thangka_workshop_pm: "Мастерская живописи тханка" #NT!
 nd_tbt_thangka_workshop_pm_desc: "Расписные свитки тханки на тканевой основе — основное религиозное искусство императорской сангхи. Шерсть, кожа и пчелиный воск связывают шелково-хлопковые крепления." #NT!
 nd_tbt_scriptorium_maintenance: "Обслуживание скрипториума" #NT!
 nd_tbt_scriptorium_maintenance_desc: "Бумага, пчелиный воск, глиняная посуда из чернильниц и резные блоки императорского скриптория." #NT!
 nd_tbt_scripture_printing_pm: "Ксилографическая печать Священных Писаний" #NT!
 nd_tbt_scripture_printing_pm_desc: "Буддийские писания, королевские хроники и административные записи, напечатанные ксилографией, для распространения по всей империи." #NT!
 nd_tbt_modern_press_pm: "Современная тибетская пресса" #NT!
 nd_tbt_modern_press_pm_desc: "Механические наборные и паровые печатные машины производят книги, альманахи и правительственные газеты с тибетским алфавитом для рынка плато." #NT!
 nd_tbt_rdzong_maintenance: "Обслуживание гарнизона Рдзонг" #NT!
 nd_tbt_rdzong_maintenance_desc: "Каменная кладка, оружие и продовольствие для гарнизонов крепости высокогорного типа." #NT!
 nd_tbt_caravanserai_maintenance: "Обслуживание Караван-сарая" #NT!
 nd_tbt_caravanserai_maintenance_desc: "Корм, запасы кирпичного чая, дорожная одежда и снаряжение для вьючных мулов для ярмарки чама." #NT!
 nd_tbt_horse_trade_pm: "Обмен «Чай за лошадь»" #NT!
 nd_tbt_horse_trade_pm_desc: "Имперская торговля чамой: кирпичный чай из Юньнани в обмен на тибетских боевых коней, соль и вьючных яков." #NT!
 nd_tbt_brick_tea_pm: "Императорский кирпичный чай" #NT!
 nd_tbt_brick_tea_pm_desc: "Прессованный кирпич-чай, скрепленный императорской печатью и ярмарочным тарифом. Кирпичи ездят из чамских караван-сараев на каждый степной рынок." #NT!
 nd_tbt_nambu_maintenance: "Техническое обслуживание мастерской Намбу" #NT!
 nd_tbt_nambu_maintenance_desc: "Шерсть яка, ткацкие станки и инструменты красильщика, переданные гильдии ткачей." #NT!
 nd_tbt_yak_wool_pm: "Намбу плетение из фетра" #NT!
 nd_tbt_yak_wool_pm_desc: "Тяжелый войлок из шерсти яка, местный валяный и грубо окрашенный, повседневная ткань плато." #NT!
 nd_tbt_imperial_carpet_pm: "Императорское ковроткачество" #NT!
 nd_tbt_imperial_carpet_pm_desc: "Тибетские ковры ручной работы, окрашенные гималайскими пигментами, ценились во всей Азии и экспортировались даже в Персию." #NT!
 nd_tbt_silk_weaving_pm: "Шелково-шерстяная парча" #NT!
 nd_tbt_silk_weaving_pm_desc: "Ткань тханка из шелковой парчи ваджрной традиции, сотканная из импортного шелка и местной шерсти, окрашенная в храмовые цвета императорской сангхи." #NT!
 nd_tbt_imperial_drape_pm: "Императорская придворная пелерина" #NT!
 nd_tbt_imperial_drape_pm_desc: "Придворные ткани из шерсти и шелка, окрашенные в имперские цвета, сотканные для возрожденной придворной церемонии Ценпо." #NT!
 nd_tbt_council_hall_maintenance: "Обслуживание зала Совета" #NT!
 nd_tbt_council_hall_maintenance_desc: "Бумага, пчелиный воск, каменная кладка и церемониальные ткани для палат семи министров." #NT!
  
  # === UNITS === 
 a_nd_tbt_yul_sde: "Юл-сде Призывники-копейщики" #NT!
 a_nd_tbt_yul_sde_desc: "Домашние призывники императорского хри-сдэского уезда собирают сбор. Копье, длинный лук и пластинчатый доспех из кожи и железа; воспитан под благородным командованием для кампаний Ценпо." #NT!
 a_nd_tbt_rgyal_blon_cavalry: "Кольчужная кавалерия Ргьял-блона" #NT!
 a_nd_tbt_rgyal_blon_cavalry_desc: "Благородная кавалерия империи, всадники и лошади закованы в железные пластинки для глаз. Вооруженные знаменитым длинным тибетским копьем, они сражались как в спешке, так и в атаке." #NT!
 a_nd_tbt_imperial_guard: "Ску-срунг Имперская гвардия" #NT!
 a_nd_tbt_imperial_guard_desc: "Постоянная профессиональная пехота возрожденной империи. Там, где ополченцы юл-сде каждый сезон возвращаются домой, ску-срунг служат пожизненно, получая прямое императорское жалованье." #NT!
 a_nd_tbt_khams_riders: "Кхамспа Frontier Riders" #NT!
 a_nd_tbt_khams_riders_desc: "Длиннорукие всадники восточных маршей Кхамса, прошедшие подготовку в набегах, воспитанные в вражде, были развернуты в качестве легкой кавалерии, наносящей удары далеко за пределы имперской границы." #NT!
 a_nd_tbt_plateau_artillery: "Плато Артиллерия" #NT!
 a_nd_tbt_plateau_artillery_desc: "Бронзовые пушки, отлитые на императорских литейных заводах Лхасы из меди Кхамса. Роли экипажа основаны на традициях инженерных войск, которые построили рдзонг." #NT!
  
  # === LEVIES === 
 levy_nd_tbt_yul_sde: "Юл-сде призывник-набор" #NT!
 levy_nd_tbt_yul_sde_desc: "Имперский окружной сбор, собираемый домохозяйствами по всей административной системе империи." #NT!
 levy_nd_tbt_rgyal_blon: "Ргьял-блон Кавалерийский Леви" #NT!
 levy_nd_tbt_rgyal_blon_desc: "Одетая в кольчуги знать великих кланов, призванная под имперское знамя." #NT!
  
  # === DESTINY VARIABLE TOOLTIPS === 
 nd_tbt_formed_tt: "Тибетская империя была восстановлена." #NT!
 nd_tbt_path_a_tt: "При формировании выбрали имперский культ Юндрунг Бон." #NT!
 nd_tbt_path_b_tt: "При формировании выбрали буддийский синтез Королей Дхармы." #NT!
  
  # ===== DESTINY TREE LOCALIZATION ===== 
  
  # === Destiny advances === 
 nd_tbt_destiny: "Судьба Ценпо" #NT!
 nd_tbt_destiny_desc: "Реставрация Ярлунг-Империала завершена. Империя стоит на перепутье: пути воина владычества во Внутренней Азии или пути дхармы универсальной цивилизации Махаяны. Стабильность 75 открывает впереди имперскую дорогу." #NT!
  
  # Path A: Inner Asian Empire 
 nd_tbt_dest_tarim_recovery: "Марш по степи" #NT!
 nd_tbt_dest_tarim_recovery_desc: "Территория империи Ярлунг уже касается Тянь-Шаня и границы Тан. Теперь двигайтесь на север, в саму монгольскую степь: Каракорум и Урга признают знамя Ценпо. Империя больше не является просто державой во Внутренней Азии; это степной повелитель, каким недолгое время были ценпо Ярлунг в конце VIII века, когда Восточно-Тюркский каганат платил им дань." #NT!
 nd_tbt_dest_hexi_corridor: "За границей Хэси" #NT!
 nd_tbt_dest_hexi_corridor_desc: "Историческая империя Ярлунг вела кампанию вдоль границы Тан через коридоры реки Вэй и Сычуань, но фактически так и не удержала их. Судьба делает оспариваемую границу постоянной имперской территорией. Ланьчжоу (центр префектуры в верховьях Хуанхэ), Синин (коридор Цинхай, контролирующий путь в Хэси) и Чэнду (коммерческая столица бассейна Сычуани) подчиняются Лхасе. Танско-тибетские пограничные войны 763–829 гг. заканчиваются печатью Ценпо на каждом документе префектуры." #NT!
 nd_tbt_dest_inner_asian_empire: "Внутреннеазиатская империя" #NT!
 nd_tbt_dest_inner_asian_empire_desc: "В 763 году тибетское войско захватило сам Чанъань; Танский император бежал, и трехмиллионный город развевал знамя Ценпо в течение пятнадцати дней, прежде чем имперская армия отошла. Завершающий камень судьбы закрепляет эти пятнадцать дней длительного правления над долиной Вэй. Чанъань платит дань с Желтой реки; Куньмин платит дань с плато Юньнань, где империя Ярлунг когда-то держала Наньчжао в качестве данника. Империя воинов Трисонг Децен восстанавливается в размерах, хотя историческая империя существовала недолго. Открывает Императорский дворец с каменными колоннами в Лхасе." #NT!
  
  # Path B: Dharma Imperium 
 nd_tbt_dest_pala_heartland: "Верните Пала Хартленд" #NT!
 nd_tbt_dest_pala_heartland_desc: "Верните Бихара в дхарму: Гая у дерева бодхи, Раджгир из Первого буддийского совета. Обители Махаяны эпохи Пала, породившие тибетский буддизм, возвращаются под опеку императора." #NT!
 nd_tbt_dest_bengali_sangha: "Восстановить бенгальскую сангху" #NT!
 nd_tbt_dest_bengali_sangha_desc: "Держите Пала Бенгалию: Гаур и Сонаргаон, центр буддизма в нижнем течении Ганга. Императорская скриптория впитала традицию перевода Пала, а великая типография сохраняет ее для каждого монастыря." #NT!
 nd_tbt_dest_dharma_imperium: "Империум Дхармы" #NT!
 nd_tbt_dest_dharma_imperium_desc: "Монголия принимает религию под властью имперской сангхи: степи Орхона и Хэнти становятся восточным ответвлением империи-цивилизации Махаяны, простирающейся от Бенгалии до озера Байкал. Открывает Великий Дом Переводчиков." #NT!
  
  # === Destiny variable tooltips already exist (nd_tbt_path_a_tt etc.) === 
  
  # === Destiny event 8: Root === 
 nd_tbt.8.t: "Судьба Ценпо" #NT!
 nd_tbt.8.d: "Империя целая. За горными перевалами следят, на рдо-кольце начертаны надписи, великие кланы собираются по имперскому призыву. Теперь совет смотрит за пределы плато.\n\nСпор министров. Некоторые утверждают, что судьба Ценпо заключается в восстановлении: отправиться на восток, как Сонгцен Гампо и Трисонг Децен, вернуть себе Тарим и коридор Хэси, построить империю Ярлунг, простирающуюся от Каракорума до монгольской степи. Другие утверждают, что истинное призвание империи — цивилизационное, а не территориальное: стать осью Махаяны в Азии, восстановить Дхарму на своей родине Пала, нести доктрину степным народам по линии Трех Королей Дхармы.\n\nКакую бы судьбу ни выбрал Ценпо, имперский совет объявляет путь открытым." #NT!
 nd_tbt.8.a: "Пусть имперская дорога будет открыта" #NT!
  
  # === Destiny event 9: Tarim recovered === 
 nd_tbt.9.t: "Степь склоняется перед Лхасой" #NT!
 nd_tbt.9.d: "Тибетские всадники выезжают с высоких перевалов в монгольскую степь. Каракорум, города-лагеря Хэнти, долины Онон и Керулен склоняются перед царским войском. Преемники восточно-тюркского каганата предлагают ту же дань, которую их предки предлагали Трисонг Децену в 780-х годах; Монгольские кланы входят в имперскую федерацию в качестве вспомогательных тюменов.\n\nЦенпо Лхасы теперь также является степным повелителем. Летописи запишут, что империя простиралась от Внутренней Азии до Онона." #NT!
 nd_tbt.9.a: "Степь – пастбище Ценпо." #NT!
  
  # === Destiny event 10: Hexi corridor === 
 nd_tbt.10.t: "Танская граница перейдена" #NT!
 nd_tbt.10.d: "Ланьчжоу, Синин и Чэнду по очереди перешли к имперскому войску. Тибет пересек собственно танскую границу: мимо коридора Хэси, мимо гарнизонов Аньси, в долину реки Вэй и в сам бассейн Сычуани. Пограничные войны 763–829 годов закончились; Имперское тибетское войско находится внутри того, что на протяжении веков было центром Тан. Сычуаньские торговцы чаем платят пошлины тибетским таможенникам; Верфи Хуанхэ в Ланьчжоу построены для флота Ценпо.\n\nТеперь имперский совет обсуждает, как провести завоевание: как укрепленную линию границы с гарнизонами и сторожевыми башнями или как открытую торговую дорогу чама и Шелковый путь?" #NT!
 nd_tbt.10.a: "Укрепите коридор как линию гарнизона." #NT!
 nd_tbt.10.b: "Откройте коридор как великую караванную дорогу" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_garrison_line: "Гарнизонная линия Хэси" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_garrison_line: "Сторожевые башни и крепости рдзонг цепляются вдоль коридора. Граница удерживается, но затраты на ее поддержание ложатся на плечи равнинных районов." #NT!
 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_caravan_road: "Караванная дорога Хэкси" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_caravan_road: "Коридор пульсирует караванами с востока и запада. Имперские банки гарантируют согдийским и уйгурским купцам в обмен на сборы и пошлины." #NT!
  
  # === Destiny event 11: Inner Asian Empire (capstone) === 
 nd_tbt.11.t: "Чанъань под колонной" #NT!
 nd_tbt.11.d: "В 763 году двадцать тысяч тибетских всадников вошли в Чанъань. Танский император бежал на юг; город с трехмиллионным населением в течение пятнадцати дней носил знамя Ценпо, прежде чем имперское войско ушло на согласованных условиях. Танские хроники назвали это унижением; Тибетские судебные протоколы называют это приливом империи. Теперь, спустя столетия, имперское войско вернулось, и Чанъань не уходит назад. Долина Вэй отдает дань Лхасе от Желтой реки; Куньмин платит дань с плато Юньнань, где империя Ярлунг когда-то держала Наньчжао в качестве данника; степные тюмены, Таримские оазисы, коридор Хэси и коридор Вэй-Сычуань — все они соответствуют колонне Цэнпо.\n\nПридворные писцы вырезают имена каждого подчиненного правителя на новом императорском дворце с колоннами, чтобы никто не мог их забыть. Министры обсуждают имперский стиль нового устроения. Будет ли Ценпо править как воин-король Ярлунга, лично возглавляя войско, как это делали Три Короля Дхармы, или как степной повелитель, получающий дань от сотни подчиненных принцев?" #NT!
 nd_tbt.11.a: "Возглавьте имперское войско в роли воина-Ценпо." #NT!
 nd_tbt.11.b: "Царствуй как степной повелитель подвластных князей" #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_dest_warrior_tsenpo: "Воин-Ценпо Ярлунга" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_warrior_tsenpo: "Ценпо едет во главе своей армии, как Сонгцен Гампо и Трисонг Децен. Империя находится в состоянии войны везде, где проходит имперский штандарт." #NT!
 STATIC_MODIFIER_NAME_nd_tbt_dest_steppe_overlord: "Степной повелитель" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_steppe_overlord: "Сотня подчиненных князей платит дань и снабжает вспомогательными войсками. Досягаемость империи простирается не только за счет оружия, но и за счет дипломатии и дани." #NT!
  
  # === Destiny event 12: Pala heartland === 
 nd_tbt.12.t: "Под деревом Бодхи" #NT!
 nd_tbt.12.d: "Гая падает. Тибетское войско беспрепятственно входит на территорию храма Махабодхи; дерево бодхи, под которым Будда достиг просветления, стоит под императорским знаменем. Раджгир, где был созван первый буддийский совет, открывает свои ворота на той же неделе.\n\nСердце Махаяны эпохи Пала, колыбель дхармы, пришедшей в Тибет, снова находится под опекой буддистов. В хрониках говорится, что Ценпо плакал, когда делал подношения Махабодхи." #NT!
 nd_tbt.12.a: "Сделайте императорские подношения Махабодхи." #NT!
  
  # === Destiny event 13: Bengali sangha === 
 nd_tbt.13.t: "Бенгальская Сангха восстановлена" #NT!
 nd_tbt.13.d: "Гаур, Сонаргаон и Монгыр, центр буддизма в нижнем течении Ганга, проходят под имперским знаменем. Мастера-переводчики ло-ца-ба прибывают в великие монашеские фонды Пала, чтобы копировать, переводить и перепечатывать все сохранившиеся индийские рукописи.\n\nБудет ли это проект перевода с целью восстановить и завершить тибетский канон или большое собрание бенгальских пандитов в Лхасе для непосредственного инструктирования императорской сангхи?" #NT!
 nd_tbt.13.a: "Запустите проект «Великий перевод»" #NT!
 nd_tbt.13.b: "Созвать суд Пандита в Лхасе." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_dest_great_translation: "Отличный проект перевода" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_great_translation: "Санскритские и палийские рукописи Пала-вихары возвращаются на тибетский язык согласно имперскому канону печатного станка." #NT!
 STATIC_MODIFIER_NAME_nd_tbt_dest_pandita_court: "Суд Пандита в Лхасе" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_pandita_court: "Великие пандиты Бенгалии, Кашмира и Магадхи ежедневно читают лекции в императорских залах. Суд становится космополитичным, но старые традиции плато истончаются." #NT!
  
  # === Destiny event 14: Dharma Imperium (capstone) === 
 nd_tbt.14.t: "Всемирный совет Махаяны" #NT!
 nd_tbt.14.d: "Монголия принимает ислам. Орхонская и Хэнтийская степи признают имперскую сангху; Бхагалпур на Ганге посылает своих пандитов в Лхасу, чтобы обучать монгольских ханов этому учению. Имперская Махаяна простирается от Бенгальского залива до озера Байкал, восточная буддийская цивилизация воплотилась в жизнь.\n\nКакую форму примет империя дхармы? Великий универсальный совет, объединяющий все буддийские традиции под властью Лхасы, или постоянная династия с двойным троном ламы и хана по линии Алтан-хана и Далай-ламы?" #NT!
 nd_tbt.14.a: "Созвать Вселенский совет Махаяны." #NT!
 nd_tbt.14.b: "Основан династический орден Лама-Хана." #NT!
  
 STATIC_MODIFIER_NAME_nd_tbt_dest_mahayana_council: "Всемирный совет Махаяны" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_mahayana_council: "Каждая буддийская традиция от Бенгалии до Монголии подчиняется единому императорскому совету. Дхарма едина, и Лхаса — ее местопребывание." #NT!
 STATIC_MODIFIER_NAME_nd_tbt_dest_lama_dynasty: "Династический Орден Лама-Хана" #NT!
 STATIC_MODIFIER_DESC_nd_tbt_dest_lama_dynasty: "Линия двутронного суверенитета: лама и хан, сангха и степь, по модели Алтан-хана и Далай-ламы. Духовенство является опорой империи. Торговые дома оплачивают стоимость." #NT!
  
  # === Destiny capstone buildings === 
 nd_tbt_imperial_pillar_palace: "Императорский Каменно-столбный дворец" #NT!
 nd_tbt_imperial_pillar_palace_desc: "Огромный дворец из камня и дерева в Лхасе, стены которого вписаны в традицию рдо-кольцо с названиями всех завоеванных оазисов и подчиненных ханств от Тарима до монгольской степи. Здесь находится имперский сборный пункт и военная палата Ценпо." #NT!
 nd_tbt_great_translation_house: "Отличный Дом Переводов" #NT!
 nd_tbt_great_translation_house_desc: "Имперская монашеская академия по плану Самье, масштабированная до универсальных амбиций Махаяны. Залы переводов на все основные языки Индии и Внутренней Азии, постоянный совет пандитов и имперские печатные станки, сохраняющие канон." #NT!
  
  # === Destiny capstone building production methods === 
 nd_tbt_pillar_palace_maintenance: "Обслуживание Дворца Колонн" #NT!
 nd_tbt_pillar_palace_maintenance_desc: "Камень, каменная кладка, оружие и боевые кони для имперского сбора и постоянного эскорта Ценпо." #NT!
 nd_tbt_translation_house_maintenance: "Обслуживание бюро переводов" #NT!
 nd_tbt_translation_house_maintenance_desc: "Бумага, пчелиный воск для ламп, благовония для ежедневных обрядов и запасы книжных заготовок для императорской прессы." #NT!
  
  # === Bureaucracies === 
 AUTO_MODIFIER_NAME_nd_tbt_bureaucracy_authority: "Полномочия Ценпо" #NT!
 AUTO_MODIFIER_DESC_nd_tbt_bureaucracy_authority: "Восстановленная корона Ярлунга управляет институциональным аппаратом имперского периода: советом гар-злон, мириархией стонг-сде, ритуальной службой бонпо и переводческим судом ло-ца-ба. Предоставляет два слота бюрократии в дополнение к слоту из имперской столицы." #NT!
  
 gar_zlon_bureaucracy: "гар-злон: Имперский Совет" #NT!
 gar_zlon_bureaucracy_desc: "Гар-злон, утвержденный главным министром Гар Тонгценом Юлсунгом в 654-655 годах, представлял собой постоянный кабинет из семи министров-блон-по вокруг великого министра Блон-чен-по, который выполнял функции главы исполнительной власти империи при ценпо. Старые тибетские анналы и надписи на двуязычных договорах показывают, что эта структура из семи министров сохранялась на протяжении всего имперского периода; великие кланы были навечно связаны исполнительной властью, и ни один акт войны, договор или правопреемство не заключался без отметки совета. Цена заключалась в том, что ценпо больше не могло править в одиночку: собственная монополия рода Гар спровоцировала чистку Триду Сонгцена от 698 человек, и после того, как каждый клан, следовавший за Гаром в офис блон-чен-по, по очереди пытался сделать кресло наследственным." #NT!
  
 stong_sde_bureaucracy: "stong-sde: Мириархия Леви" #NT!
 stong_sde_bureaucracy_desc: "Реформы Сонгцена Гампо в 630-х годах организовали центральный Тибет в четыре ру («рога»), разделенных на стонг-сде («тысяча районов») номинально по тысяче семей в каждом, каждый из которых был должен имперскому сбору вооруженных людей, лошадей и зерна. Свитки вели юл-сде землеуправленцы; последующие ценпо распространили систему на Сумпу, Шанг-Шунг, Амдо и завоеванные оазисы Тарима. Стонг-сде предоставил империи Ярлунгов крестьянскую полевую армию, с которой не могла сравниться ни одна другая степная держава того столетия, и обязал призывные семьи наследственной военной службой, которая к концу имперского периода все больше напоминала крепостное право." #NT!
  
 bonpo_priesthood_bureaucracy: "Императорский культ Бонпо" #NT!
 bonpo_priesthood_bureaucracy_desc: "Добуддийская ритуальная аристократия ценпо Ярлунг: судьи-капелланы, специалисты по погребению императорских гробниц в Чонге, офицеры-оракулы (ку-цаб), интерпретирующие предзнаменования, подтверждающие войну и договор, и ритуальные судьи в суде ценпо. Их космология лха-срас ценпо, спускающегося с неба на веревке дму, придавала династии Ярлунг ее священную легитимность. Даже после обращения Трисонга Децена в буддизм в восьмом веке институты бонпо сохранились как параллельный аппарат, и реакция Лангдармы в девятом веке стремилась вернуть им первенство. Везде, где культ бон-по сохраняется как государственный департамент, великие кланы и старшее духовенство чувствуют, что империя принадлежит им." #NT!
  
 lo_tsa_ba_court_bureaucracy: "ло-ца-ба Переводческий суд" #NT!
 lo_tsa_ba_court_bureaucracy_desc: "Имперский проект буддийского перевода, институциональное достижение Трех Королей Дхармы: Сонгцен Гампо, Трисонг Децен (755–797) и Три Ралпакан (815–838). Сгра-бсгьюр ло-ца-ба («чиновники-переводчики») представляли собой наемный императорский корпус, опиравшийся на индийских пандитов в Самье (основан в 779 г.) и стандартизированный тибетский словарь, закрепленный указами Махавьютпатти. Их результатом стали каноны бка-гюр и бстан-гюр: один из крупнейших переводческих проектов в досовременной истории. Ралпакан систематизировал правило семи монахов, согласно которому семь крестьянских семей поддерживали каждого рукоположенного монаха; кланы воинов возмущались потерей причитающейся им арендной платы, а заговоры с убийствами, положившие конец правлению Ралпакана, были тем же фракционным насилием, которое Лангдарма позже обратил против самого буддизма." #NT!
 nd_tbt_imperial_press: "Империал Пресс" #NT!
 nd_tbt_imperial_press_desc: "Магазины блочных изданий императорской канцелярии и великих монастырских академий. Там, где скрипторий копирует, а монастырь переводит, пресса скрепляет: выпускает императорский канон, бка-гюр, бстан-гюр и современные государственные печатные издания стандартизированными ксилографическими и подвижными тиражами." #NT!
 nd_tbt_press_block_print_pm: "Издание для блочной печати" #NT!
 nd_tbt_press_block_print_pm_desc: "Резные деревянные блоки императорского канона и корпуса дхармы. Тиражи раздавались монастырским академиям, правительственным учреждениям и приграничным дзонгам." #NT!
 nd_tbt_press_scripture_pm: "Издание Императорского Священного Писания" #NT!
 nd_tbt_press_scripture_pm_desc: "Пигментированные имперские издания бка-гюр и бстан-гюр: ярко-красные титульные листы, заголовки глав с сусальным золотом, кодифицированный государственный буддизм в монументальном издании." #NT!
 nd_tbt_press_modern_pm: "Современная государственная пресса" #NT!
 nd_tbt_press_modern_pm_desc: "Передвижные издания императорских хроник, кодифицированного закона и свода дхармы. Народные тибетские издания для академий чос-грва, классические для императорской канцелярии." #NT!
 nd_tbt_brick_tea_press: "Кирпичный чайный пресс" #NT!
 nd_tbt_brick_tea_press_desc: "Пресс-навесы Кхам и Амдо, которые прессуют лист зеленого чая в товарные кирпичи. Каждый кирпич связан бамбуковым ремешком и просолен для перевозки караванов. Первичное производство, лежащее в основе торговли чайными лошадьми чама." #NT!
 nd_tbt_press_brick_tea_pm: "Кирпичный чайный пресс" #NT!
 nd_tbt_press_brick_tea_pm_desc: "Прессованные кирпичи из зеленого чая, предназначенные для степной караванной торговли. Древесина для прессов, соль для лечения, скот для перевозки и зимняя работа крестьян Кхама." #NT!
 nd_tbt_thangka_atelier: "Тханка Ателье" #NT!
 nd_tbt_thangka_atelier_desc: "Мастерские художников великой тантрической традиции тханка. Свитки из шелка и хлопка, загрунтованные мелом и расписанные минеральными пигментами (малахит, киноварь, лазурит, сусальное золото), изображающие будд, мандалы и портреты императорской линии, украшают каждую стену чос-грва." #NT!
 nd_tbt_atelier_thangka_pm: "Танка Живопись" #NT!
 nd_tbt_atelier_thangka_pm_desc: "Тханки из шелково-хлопкового свитка, расписанные в традициях Карма-гадри или Менри: пигмент, грунтованный шкурным клеем, сусальное золото, полированное по освященной парче, императорская родословная передана минеральным цветом." #NT!
