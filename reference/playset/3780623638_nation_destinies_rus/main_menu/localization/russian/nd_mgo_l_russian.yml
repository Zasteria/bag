l_russian:
 STATIC_MODIFIER_NAME_nd_mgo_chinggisid_restoration: "Реставрация Чингизидов" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_chinggisid_restoration: "Великий хан воссоединил тумены под властью Чингизидов. Монгольские всадники снова проносятся по степи, их железная дисциплина и кочевническая стойкость восстановлены до славы былых времен." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_yellow_hat_patronage: "Покровительство Желтой Шляпы" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_yellow_hat_patronage: "Монголия вступила на путь Гелуг, превратившись из конфедерации воинов в цивилизацию монастырей и обучения. Связь между Ханом и Ламой приносит стабильность, мудрость и новую монгольскую идентичность." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_tumen_reorganization: "Тюменская реорганизация" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_tumen_reorganization: "Перераспределение Даян-ханом шести восточных туменов между своими сыновьями восстановило порядок в раздробленной степи, создав военно-административную систему, которая направляет энергию кочевников в организованную силу." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_gelug_conversion_path: "Преобразование в гелуг" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_gelug_conversion_path: "Учение Желтой Шляпы распространилось по степи. Монастыри возвышаются там, где когда-то одиноко стоял овоос, а монгольское письмо сочетает сутры с хрониками. Новая эра обучения и преданности преображает облик степи." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_tengri_preservation: "Вечное голубое небо" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_tengri_preservation: "Древние пути Тенгри живы. Шаманы общаются с небом и землей, воины черпают силу из духов предков, а сама враждебная степь становится величайшей крепостью Монголии." #NT!
 nd_mgo.1.t: "Воссоединение Монголии" #NT!
 nd_mgo.1.d: "Разрозненные племена монгольской степи вновь объединились. На протяжении поколений после распада великой империи наследники Чингисхана воевали между собой: Халха с Ойратом, тумен с туменом, брат с братом. Теперь, наконец, единая власть командует верностью степи.\n\nНо чем станет эта новая Монголия? Наследие Чингисхана тянется в двух направлениях. Один путь требует восстановления военной власти Чингизидов: железной дисциплины тумена, десятичной организации, которая когда-то завоевала половину известного мира. Другой путь, открытый контактом с тибетскими ламами, обещает совершенно другую трансформацию: Монголию монастырей и обучения, где легитимность хана проистекает не из меча, а из дхармы.\n\nЭтот выбор сформирует идентичность Монголии для будущих поколений.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mgo.1.a: "Восстановить тумены. Мы наследники Чингисхана" #NT!
 nd_mgo.1.b: "Возьмите желтую шляпу: Дхарма будет вести наш народ" #NT!
 nd_mgo.2.t: "Даян-хан и шесть туменов" #NT!
 nd_mgo.2.d: "В конце пятнадцатого века ребенок по имени Батумонгке был провозглашен ханом царицей-воительницей Мандухай. Вместе они воссоединили расколовшуюся монгольскую нацию. Приняв имя правления Даян, «Великий Юань», он разгромил ойратских тайши и юго-западных повстанцев, а затем реорганизовал всю восточно-монгольскую конфедерацию в шесть великих туменов: Чахар, Халха, Урянхай, Ордос, Тумед и Ёншиебу.\n\nКаждый тумен был закреплен за одним из его одиннадцати сыновей, создав новую аристократию, связанную кровью с Великим ханом. Это была не просто административная реформа: это было возрождение десятичной системы, которая когда-то сделала монгольские армии непобедимыми. На протяжении целого поколения степь была едина, как не было со времен самого Хубилай-хана." #NT!
 nd_mgo.2.a: "Шесть туменов едут как один" #NT!
 nd_mgo.3.t: "Встреча в Тегчен Чонхоре" #NT!
 nd_mgo.3.d: "В 1578 году Алтан-хан из Тумеда пригласил Сонама Гьяцо, главу линии передачи гелуг тибетского буддизма, на великую встречу в степи. Эта встреча навсегда изменит Монголию. Алтан-хан даровал Сонаму Гьяцо титул «Далай-лама», «Океан мудрости», а лама, в свою очередь, признал хана реинкарнацией Хубилай-хана, великого покровителя буддизма.\n\nАлтан-хан постановил прекратить шаманские кровавые жертвоприношения, изображения духов-онгонов будут уничтожены и что дхарма гелуг станет верой монголов. За пятьдесят лет десятки тысяч молодых монгольских мужчин приняли монашество. Эрдэнэ-Зуу, первый великий монастырь, вырос на руинах древнего Каракорума.\n\nНо не все монголы приветствовали это преобразование. Многие цеплялись за старые способы поклонения Тенгри, рассматривая Желтых Шляпников как иностранных незваных гостей, которые могут подорвать боевой дух Монголии. Напряжение между дхармой и вечным голубым небом будет определять монгольскую идентичность на протяжении веков." #NT!
 nd_mgo.3.a: "Пусть дхарма осветит степь" #NT!
 nd_mgo.3.b: "Небесные боги наших предков выстоят" #NT!
 nd_mgo.4.t: "Единство Халки" #NT!
 nd_mgo.4.d: "Халка-монголы, крупнейшая и самая центральная из монгольских конфедераций, наконец-то достигли подлинного единства. Там, где когда-то четыре халкинских ханства соперничали друг с другом и с западными ойратами, возникла общая идентичность. Общее происхождение по линии Чингизидов, общие пастбища в центре Монголии и, во все большей степени, общая буддийская вера сплотили эти разрозненные группы в единую нацию.\n\nЭто не империя завоеваний, а нечто, возможно, более долговечное: люди, которые признают себя одним целым. От гор Алтая до Хинганского хребта, от пустыни Гоби до сибирских лесов идентичность Халки становится синонимом самой Монголии." #NT!
 nd_mgo.4.a: "Мы один народ, одна степь" #NT!
 nd_mgo.5.t: "Джебцундамба Хутукту" #NT!
 nd_mgo.5.d: "Появилась замечательная фигура, объединившая духовную и светскую власть в Монголии: Джебцундамба Хутукту, признанный высшим воплощением буддизма на монгольской земле. Впервые созданный, когда Занабазар, сын Тушегти-хана и гений искусства и теологии, был признан реинкарнацией великого ученого Таранатхи, институт Джебцундамба стал духовным сердцем Монголии.\n\nЗанабазар создал письменность Соёмбо, спроектировал великолепные буддийские скульптуры и построил монастыри, которые стали центрами обучения по всей степи. В его лице древняя родословная Чингизидов слилась с буддийской святостью, создав уникальную монгольскую форму буддийской власти, которая требовала лояльности как от воинов, так и от монахов." #NT!
 nd_mgo.5.a: "Живой Будда направляет наш народ" #NT!
 nd_mgo_steppe_horsemanship: "Степное искусство верховой езды" #NT!
 nd_mgo_steppe_horsemanship_desc: "Монгольская лошадь маленькая, выносливая и неутомимая. Монгольские дети учатся ездить верхом раньше, чем умеют ходить, и у каждого воина есть вереница сменных скакунов для кампании." #NT!
 nd_mgo_felt_ger_camps: "Лагеря Фелтгера" #NT!
 nd_mgo_felt_ger_camps_desc: "Переносной войлочный гер позволяет целым армиям носить с собой свои дома, поддерживая линии снабжения через обширную степь без фиксированной логистики." #NT!
 nd_mgo_horse_breeding: "Традиции коневодства" #NT!
 nd_mgo_horse_breeding_desc: "Селективное разведение монгольских лошадей позволяет получить скакунов, легендарных своей выносливостью, способных питаться редкой степной травой и преодолевать огромные расстояния." #NT!
 nd_mgo_ovoo_veneration: "Овоо Почитание" #NT!
 nd_mgo_ovoo_veneration_desc: "Священные каменные пирамиды отмечают духовный ландшафт степи. Путешественники делают паузу, чтобы трижды обвести овоо и добавить камень в честь духов неба, земли и воды." #NT!
 nd_mgo_wolf_hunt_drills: "Упражнения по охоте на волков" #NT!
 nd_mgo_wolf_hunt_drills_desc: "Великая зимняя охота на волков служит одновременно тренировкой и контролем численности населения. Охотники образуют огромные круги, которые сжимаются в течение нескольких дней: та же тактика окружения, которая используется на войне." #NT!
 nd_mgo_pastoral_wealth: "Пастырское богатство" #NT!
 nd_mgo_pastoral_wealth_desc: "Пять видов домашнего скота (лошади, крупный рогатый скот, овцы, козы и верблюды) составляют основу богатства Монголии. Стада, исчисляющиеся тысячами, поддерживают нацию." #NT!
 nd_mgo_chinggisid_lineage: "Родословная Чингизидов" #NT!
 nd_mgo_chinggisid_lineage_desc: "Только потомок Чингисхана может по праву править монголами. Этот принцип кровной легитимности объединяет степь под признанной властью." #NT!
 nd_mgo_noyan_retinues: "Ноянские свиты" #NT!
 nd_mgo_noyan_retinues_desc: "Каждый нойан, потомственный монгольский владыка, имеет личную свиту из тяжелобронированных кавалеристов, элитное ядро, вокруг которого организована боевая сила тумена." #NT!
 nd_mgo_tumen_system: "Тюменская организация" #NT!
 nd_mgo_tumen_system_desc: "Десятичная система разделяет воинов на отряды по десять, сто, тысячи и десять тысяч. Каждый тумен действует как автономная армия со своей собственной структурой управления." #NT!
 nd_mgo_trans_steppe_trade: "Трансстепная торговля" #NT!
 nd_mgo_trans_steppe_trade_desc: "Купцы пересекают обширную монгольскую степь, перевозя меха, лошадей и шкуры на юг, возвращаясь с зерном, шелком и железными товарами от оседлых соседей." #NT!
 nd_mgo_kurultai_tradition: "Курултай Традиция" #NT!
 nd_mgo_kurultai_tradition_desc: "Великое собрание монгольской знати собирается для избрания ханов, разрешения споров и планирования кампаний. Эта традиция совещательного управления уравновешивает ханскую власть." #NT!
 nd_mgo_composite_bow_mastery: "Владение составным луком" #NT!
 nd_mgo_composite_bow_mastery_desc: "Монгольские лучники совершенствуют искусство соединения слоев рога, дерева и сухожилий в компактные изогнутые луки необычайной мощности, точные с лошади на полном галопе.\n\n#italic Доступно в: $nd_mgo_ger_encampment$#!" #NT!
 nd_mgo_steppe_diplomacy: "Степная дипломатия" #NT!
 nd_mgo_steppe_diplomacy_desc: "Монгольские дипломатические традиции сочетают угрозу и компромисс: обмен послами, брачные союзы между знатными домами и тщательное управление отношениями с данью." #NT!
 nd_mgo_hide_processing: "Обработка шкур и шерсти" #NT!
 nd_mgo_hide_processing_desc: "Монгольские мастера превращают сырые продукты животного происхождения в ценные товары: войлок из шерсти, кожу из шкур и меха, которые продаются по высоким ценам на рынках Китая и Центральной Азии." #NT!
 nd_mgo_dayan_khan_restoration: "Восстановление Даян Хана" #NT!
 nd_mgo_dayan_khan_restoration_desc: "Батумонгке Даян-хан восстановил центральную власть Чингизидов над расколотой монгольской конфедерацией, распределив шесть восточных туменов между своими сыновьями для создания нового правящего порядка." #NT!
 nd_mgo_yam_relay_posts: "Ретрансляционные посты Яма" #NT!
 nd_mgo_yam_relay_posts_desc: "Ретрансляционные станции Ортоо, расположенные на расстоянии дня езды друг от друга в степи, позволяют сообщениям и грузам преодолевать огромные расстояния Монголии с поразительной скоростью." #NT!
 nd_mgo_six_tumens: "Шесть Туменов" #NT!
 nd_mgo_six_tumens_desc: "Реорганизация Даян-ханом восточных монголов в шесть великих туменов (Чахар, Халха, Урянхай, Ордос, Тумед и Ёншиебу) восстановила военно-административную структуру империи." #NT!
 nd_mgo_mongolian_script: "Монгольское письмо" #NT!
 nd_mgo_mongolian_script_desc: "Традиционное монгольское письмо, написанное вертикальными столбцами, сохраняет хроники, юридические кодексы и переписку. Грамотность распространяется через традиции писцов, поддерживаемые знатными семьями." #NT!
 nd_mgo_caravan_routes: "Караванные маршруты" #NT!
 nd_mgo_caravan_routes_desc: "Торговые пути, пересекающие монгольские степи, соединяют Китай с Центральной Азией, доставляя чай, шелк и фарфор на восток, а меха, лошадей и домашний скот — на запад.\n\n#italic Доступно в: $nd_mgo_steppe_trading_post$#!" #NT!
 nd_mgo_steppe_fortification: "Степное укрепление" #NT!
 nd_mgo_steppe_fortification_desc: "Сторожевые башни и оборонительные позиции используют просторы степи. Тактика выжженной земли и враждебный климат приводят к истощению войск вторжения." #NT!
 nd_mgo_sky_worship_rites: "Обряды поклонения небу" #NT!
 nd_mgo_sky_worship_rites_desc: "Поклонение Тенгри, почитание Вечного Синего Неба связывает монгольскую идентичность с безграничными небесами над степью. Королевские церемонии призывают благословение неба на ханское правление." #NT!
 nd_mgo_altan_khan_reforms: "Реформы Алтан-хана" #NT!
 nd_mgo_altan_khan_reforms_desc: "Союз Алтан-хана с Далай-ламой в 1578 году положил начало преобразованию Монголии из шаманской воинской культуры в буддийскую цивилизацию, запретив кровавые жертвоприношения и продвигая монашеское образование." #NT!
 nd_mgo_keshig_tradition: "Кешигская традиция" #NT!
 nd_mgo_keshig_tradition_desc: "Кешиг, личная охрана хана, представляет лучших воинов Монголии. Членство — высшая честь, и солдаты-кешиги превосходят обычных командиров." #NT!
 nd_mgo_gelug_monasteries: "Монастыри Гелуг" #NT!
 nd_mgo_gelug_monasteries_desc: "Великие монастыри традиции гелуг возвышаются по всей Монголии. Эрдэнэ-Зуу, построенный на месте древнего Каракорума, вмещает тысячу монахов и становится центром монгольского буддийского обучения." #NT!
 nd_mgo_ming_border_markets: "Приграничные рынки Мин" #NT!
 nd_mgo_ming_border_markets_desc: "На конных рынках вдоль границы Мин-Монголь монгольские боевые кони и домашний скот обмениваются на китайское зерно, чай, шелк и железо. Эта торговля поддерживает степную экономику." #NT!
 nd_mgo_imperial_guard_reform: "Реформа Имперской Гвардии" #NT!
 nd_mgo_imperial_guard_reform_desc: "Кешиг реорганизуется по профессиональному принципу, с систематическим обучением как конному, так и пешему бою, создавая элитные силы, лояльные только хану." #NT!
 nd_mgo_chinggisid_law_code: "Кодекс законов Чингизидов" #NT!
 nd_mgo_chinggisid_law_code_desc: "Опираясь на наследие Великой Ясы, монгольские законодатели кодифицируют степное право во всеобъемлющую систему, регулирующую наследование, уголовное правосудие и обязательства лордов перед своим ханом." #NT!
 nd_mgo_horse_relay_expansion: "Расширение конной эстафеты" #NT!
 nd_mgo_horse_relay_expansion_desc: "Система ortoo расширена и усилена. Свежие лошади на каждой станции позволяют всадникам преодолевать огромные расстояния за дни, связывая воедино обширные территории Монголии." #NT!
 nd_mgo_zanbuurch_corps: "Занбуурчский корпус" #NT!
 nd_mgo_zanbuurch_corps_desc: "Монгольские воины перенимают огнестрельное оружие у своих соседей из Китая и Центральной Азии. Занбуурчи, мушкетеры с фитильными ружьями, приносят в степь пороховую войну, не отказываясь от сложившихся традиций." #NT!
 nd_mgo_khalka_unification: "Халка Объединение" #NT!
 nd_mgo_khalka_unification_desc: "Четыре халкинских ханства (Тушегти, Сецэн, Засагт и Джасакту) признают общую монгольскую идентичность, положив конец многовековому соперничеству между халкинцами." #NT!
 nd_mgo_steppe_artillery: "Степная артиллерия" #NT!
 nd_mgo_steppe_artillery_desc: "В степь приходит осадная война. Монгольские силы приобретают и используют артиллерийские орудия, добавляя новое измерение военной традиции, основанной на мобильности кавалерии." #NT!
 nd_mgo_jebtsundamba_line: "Линия Джебцундамба" #NT!
 nd_mgo_jebtsundamba_line_desc: "Джебцундамба Хутукту становится высшим духовным органом Монголии. Начиная с блестящего Занабазара, эта линия воплощенных лам объединяет буддийское благочестие с наследием Чингизидов." #NT!
 nd_mgo_nomadic_resilience: "Кочевая устойчивость" #NT!
 nd_mgo_nomadic_resilience_desc: "Поколения степной жизни воспитали в монгольском солдате необыкновенную выносливость. Они сражаются с минимальными запасами, переносят сильные холода и жару и восстанавливаются после неудач, которые могли бы уничтожить оседлые армии." #NT!
 nd_mgo_border_defense_system: "Система пограничной обороны" #NT!
 nd_mgo_border_defense_system_desc: "Монголия создает скоординированную сеть обороны на своих границах, объединяя мобильные кавалерийские патрули, гарнизонные наблюдательные посты и систему быстрой связи ортоо." #NT!
 nd_mgo_steppe_modernization: "Степная модернизация" #NT!
 nd_mgo_steppe_modernization_desc: "Новые технологии и методы достигают степи. Рядом с кочевьями растут постоянные поселения, и Монголия начинает развивать инфраструктуру современного государства." #NT!
 nd_mgo_mongolian_renaissance: "Монгольский культурный ренессанс" #NT!
 nd_mgo_mongolian_renaissance_desc: "Расцвет монгольского искусства и литературы: новые летописи отражают национальную историю, буддийское искусство достигает новых высот утонченности, а письмо Соёмбо символизирует уверенную монгольскую идентичность." #NT!
 nd_mgo_national_cavalry_reform: "Реформа национальной кавалерии" #NT!
 nd_mgo_national_cavalry_reform_desc: "Легендарная кавалерийская традиция Монголии адаптирована к современной войне. Конные подразделения объединяют огнестрельное оружие и артиллерийскую поддержку, сохраняя при этом мобильность и искусство верховой езды, которые на протяжении веков определяли монгольские армии." #NT!
 nd_mgo_eternal_blue_sky: "Наследие вечного голубого неба" #NT!
 nd_mgo_eternal_blue_sky_desc: "Древнее наследие Тенгри (почитание неба, земли и духов природы) сочетается с буддийской философией, создавая уникальную монгольскую духовную традицию, переживающую века." #NT!
 nd_mgo_modern_administration: "Современная администрация" #NT!
 nd_mgo_modern_administration_desc: "Монголия развивает централизованную административную систему, заменяя неформальную власть кочевых ханов систематическим управлением, ведением учета и бюрократическими институтами." #NT!
 nd_mgo_great_steppe_legacy: "Великое степное наследие" #NT!
 nd_mgo_great_steppe_legacy_desc: "Боевые традиции степи продолжают жить. Армии Монголии сохраняют превосходство кавалерии и выносливость кочевников, которые когда-то завоевали крупнейшую континентальную империю в истории человечества." #NT!
 a_nd_mgo_mangudai: "Мангудай" #NT!
 a_nd_mgo_mangudai_desc: "Элитные конные лучники, специализирующиеся на тактике притворного отступления, завлекая врагов в погоню, прежде чем развернуться и нанести разрушительные залпы. Их имя означает «отважные удачи»." #NT!
 a_nd_mgo_tumen_rider: "Тюменская конница" #NT!
 a_nd_mgo_tumen_rider_desc: "Дисциплинированное ядро ​​монгольской армии, организованное по древней десятичной системе. Тюменская конница сочетает в себе мобильность степных всадников со слаженной дисциплиной профессиональных воинов." #NT!
 a_nd_mgo_keshig: "Кешиг Страж" #NT!
 a_nd_mgo_keshig_desc: "Личная гвардия хана, выбранная из лучших воинов каждого тумена. Кешигские солдаты — самые надежные и опытные бойцы в Монголии, поклявшиеся защищать хана ценой своей жизни." #NT!
 a_nd_mgo_zanbuurch: "Занбуурч Мушкетеры" #NT!
 a_nd_mgo_zanbuurch_desc: "Монгольские воины, вооруженные фитильным огнестрельным оружием, перенятым у соседей из Китая и Центральной Азии. Они сочетают в себе меткость оседлых мушкетеров с выносливостью степных бойцов." #NT!
 a_nd_mgo_modern_cavalry: "Халха Гусары" #NT!
 a_nd_mgo_modern_cavalry_desc: "Реформированная монгольская кавалерия, оснащенная карабинами и саблями, сочетает в себе многовековое степное искусство верховой езды с современной военной дисциплиной и тактикой огнестрельного оружия." #NT!
 a_nd_mgo_khorchin_rider: "Хорчин Рейдер" #NT!
 a_nd_mgo_khorchin_rider_desc: "Легкая кавалерия восточных племен Хорчинов, известная своей скоростью и совершенством в набегах. Они наносят удары, как степной ветер: быстрые, внезапные и исчезают прежде, чем враг успевает ответить." #NT!
 a_nd_mgo_noyan_cavalry: "Ноянская тяжелая кавалерия" #NT!
 a_nd_mgo_noyan_cavalry_desc: "Бронированная свита монгольского лорда, облаченного в ламеллярные доспехи и вооруженного копьем и саблей. Они образуют ударную силу, разрывающую вражеские порядки." #NT!
 nd_mgo_ger_encampment: "Гер Лагерь" #NT!
 nd_mgo_ger_encampment_desc: "Полупостоянный лагерь из переносных войлочных палаток, служащий военным плацдармом. Лагерь гер обеспечивает убежище, хранилище и место сбора новобранцев." #NT!
 nd_mgo_ger_maintenance: "Гер содержание" #NT!
 nd_mgo_ger_maintenance_desc: "Шерстяной войлок, древесина и мех животных для поддержания переносных убежищ и согрева воинов лагеря." #NT!
 nd_mgo_bow_craft_method: "Мастерская по изготовлению композитных луков" #NT!
 nd_mgo_bow_craft_method_desc: "Опытные лучники изготавливают легендарный монгольский композитный лук из слоев дерева, рога и сухожилий с помощью специальных инструментов, создавая оружие необычайной дальности и мощности." #NT!
 nd_mgo_ortoo_station: "Ретрансляционная станция Ортоо" #NT!
 nd_mgo_ortoo_station_desc: "Станция в системе почтовой ретрансляции яма, обеспечивающая свежие лошади и всадников для доставки сообщений и припасов через обширную монгольскую степь с необычайной скоростью." #NT!
 nd_mgo_relay_upkeep: "Содержание эстафетной лошади" #NT!
 nd_mgo_relay_upkeep_desc: "Свежие лошади, фураж и просо для вереницы и всадников ретрансляционной станции, гарантируя, что посылки никогда не будут ждать отдохнувшего скакуна." #NT!
 nd_mgo_ovoo_cairn: "Овоо Каирн" #NT!
 nd_mgo_ovoo_cairn_desc: "Священная каменная пирамида, где путешественники останавливаются, чтобы почтить духов неба, земли и воды. Овоос отмечают святые места по всей степи и служат местом сбора для сезонных церемоний." #NT!
 nd_mgo_ovoo_offerings: "Предложения Овоо" #NT!
 nd_mgo_ovoo_offerings_desc: "Приносили в жертву домашний скот, сжигали свечи из пчелиного воска и молочные подношения оставляли в священном овоо в честь духов неба, земли и воды." #NT!
 nd_mgo_horse_grounds: "Коневодство" #NT!
 nd_mgo_horse_grounds_desc: "Выделенные пастбища, где монгольских лошадей селекционно разводят ради выносливости, выносливости и скорости, которые делают их лучшими боевыми конями степи." #NT!
 nd_mgo_horse_care: "Управление табуном лошадей" #NT!
 nd_mgo_horse_care_desc: "Селекционное разведение выносливых монгольских лошадей из тщательно управляемых стад, в результате чего получаются скакуны, которые ценятся в степи за свою выносливость." #NT!
 nd_mgo_kurultai_grounds: "Курултайская площадка" #NT!
 nd_mgo_kurultai_grounds_desc: "Великое место сбора монгольской знати, чтобы выбирать ханов, объявлять войны и разрешать споры. Традиция курултая воплощает совещательное управление степью." #NT!
 nd_mgo_assembly_costs: "Положения о сборке" #NT!
 nd_mgo_assembly_costs_desc: "Скот для пиршеств, шерсть для больших шатровых палаток и просо для пропитания сотен дворянских свит, собравшихся на курултае." #NT!
 nd_mgo_buddhist_monastery: "Монастырь Гелуг" #NT!
 nd_mgo_buddhist_monastery_desc: "Величественный буддийский монастырь тибетской традиции гелуг. Сотни монахов изучают сутры, создают произведения искусства и содержат библиотеки, которые делают эти учреждения интеллектуальным сердцем Монголии." #NT!
 nd_mgo_monastery_upkeep: "Монашеское содержание" #NT!
 nd_mgo_monastery_upkeep_desc: "Скот для кормления монашеской общины, бумага для копирования священных текстов и пчелиный воск для ритуальных светильников, освещающих монастырские храмы." #NT!
 nd_mgo_steppe_trading_post: "Степной Торговый Пост" #NT!
 nd_mgo_steppe_trading_post_desc: "Рыночное поселение на трансстепных торговых путях, где монгольские скотоводы обменивают скот, меха и шкуры на промышленные товары, зерно и предметы роскоши у оседлых соседей." #NT!
 nd_mgo_steppe_trade_goods: "Торговые почтовые товары" #NT!
 nd_mgo_steppe_trade_goods_desc: "Меха, скот и кожаные изделия привозились на рынок пастухами и охотниками со всей степи." #NT!
 nd_mgo_caravan_tolls: "Сбор платы за караван" #NT!
 nd_mgo_caravan_tolls_desc: "У проходящих караванов требовали лошадей, домашний скот и меха в обмен на безопасный проход и доступ к помещениям торгового поста." #NT!
 nd_mgo_scribal_workshop: "Мастерская Писца" #NT!
 nd_mgo_scribal_workshop_desc: "Центр монгольской каллиграфии и делопроизводства, где писцы копируют хроники, юридические кодексы и дипломатическую корреспонденцию элегантным вертикальным монгольским письмом." #NT!
 nd_mgo_scribal_materials: "Материалы для переписчиков" #NT!
 nd_mgo_scribal_materials_desc: "Бумага, красители для чернил и пчелиный воск для свечей и печатей: все необходимое для писцов, ведущих письменные записи и хроники Монголии." #NT!
 nd_mgo_steppe_watchtower: "Степная сторожевая башня" #NT!
 nd_mgo_steppe_watchtower_desc: "Оборонительная наблюдательная позиция в открытой степи, укомплектованная гарнизонными войсками, которые могут обнаруживать приближающихся врагов на огромных расстояниях и передавать предупреждения через систему ортоо." #NT!
 nd_mgo_watchtower_upkeep: "Гарнизон Сторожевой Башни" #NT!
 nd_mgo_watchtower_upkeep_desc: "Древесина для ремонта, оружие для гарнизона и лошади для патрульных всадников, обслуживающих эту пограничную заставу." #NT!
 nd_mgo_border_market: "Пограничный рынок" #NT!
 nd_mgo_border_market_desc: "Оживленный рынок на границе, где монгольские лошади, домашний скот и меха обмениваются на китайское зерно, чай, шелк и промышленные товары. Эти рынки поддерживают степную экономику." #NT!
 nd_mgo_border_trade_goods: "Товары приграничной торговли" #NT!
 nd_mgo_border_trade_goods_desc: "Лошадей, меха и домашний скот привозили на границу для обмена с китайскими и среднеазиатскими купцами." #NT!
 nd_mgo_incarnation_palace: "Дворец воплощений" #NT!
 nd_mgo_incarnation_palace_desc: "Величественная резиденция Джебцундамба Хутукту, высшего воплощения ламы Монголии. Частично монастырь, частично королевский двор, он служит духовным и культурным центром монгольского буддизма." #NT!
 nd_mgo_palace_upkeep: "Содержание дворца" #NT!
 nd_mgo_palace_upkeep_desc: "Шелк для церемониальных одежд, бумага для священных текстов и скот для кормления монашеской общины дворца." #NT!
 nd_mgo_felt_manufactory: "Фабрика войлока" #NT!
 nd_mgo_felt_manufactory_desc: "Промышленное предприятие по переработке монгольской шерсти в высококачественный войлок — основной материал степной жизни, используемый во всем: от стенок юрты до подбивки седел." #NT!
 nd_mgo_felt_production: "Производство войлока" #NT!
 nd_mgo_felt_production_desc: "Монгольская шерсть перерабатывается в высококачественную войлочную ткань с помощью традиционных методов прокатки и прессования, которые сейчас применяются в промышленных масштабах." #NT!
 levy_nd_mgo_noyan_cavalry: "Ноянский отряд тяжелой кавалерии" #NT!
 levy_nd_mgo_noyan_cavalry_desc: "Благородные вассалы, призванные на службу в тяжелую кавалерию своего господина." #NT!
 levy_nd_mgo_khorchin_rider: "Хорчин Рейдер Леви" #NT!
 levy_nd_mgo_khorchin_rider_desc: "Легкие всадники, воспитанные из скотоводческих общин степи." #NT!
 nd_mgo_formed_tt: "была образована Монголия." #NT!
 nd_mgo_path_a_tt: "Выбрал восстановление Чингизида" #NT!
 nd_mgo_path_b_tt: "Выбрали покровительство Yellow Hat" #NT!
 nd_mgo_destiny: "Судьба Монголии" #NT!
 nd_mgo_destiny_desc: "Монголия была реформирована. Степь ждет новой цели: вернут ли наследники Чингисхана свою империю или проложат совершенно новый путь?" #NT!
 nd_mgo_dest_yuan_return: "Вернуться к Даду" #NT!
 nd_mgo_dest_yuan_return_desc: "Старая столица юаней манит. Захватите Даду и северные ворота Датуна, чтобы объявить о возвращении Великого Хана." #NT!
 nd_mgo_dest_mandate_reclaimed: "Мандат восстановлен" #NT!
 nd_mgo_dest_mandate_reclaimed_desc: "Обезопасить Маньчжурию и коридор Ганьсу. Поскольку Шэньян и Ланьчжоу находятся под контролем монголов, путь в центр страны открыт." #NT!
 nd_mgo_dest_great_yuan: "Великий юань восстановлен" #NT!
 nd_mgo_dest_great_yuan_desc: "Завершите восстановление господства монголов. Удерживайте Центральные равнины, южную столицу, и контролируйте Шелковый путь от Кашгара до Кайфэна." #NT!
 nd_mgo_dest_dharma_steppe: "Дхарма приходит в степь" #NT!
 nd_mgo_dest_dharma_steppe_desc: "Установите духовную связь между Монголией и Тибетом. Контролируйте Лхасу и накапливайте богатство, чтобы поддерживать буддийскую цивилизацию в степи." #NT!
 nd_mgo_dest_sangha_realm: "Царство Сангхи" #NT!
 nd_mgo_dest_sangha_realm_desc: "Постройте процветающее буддийское королевство посредством торговли и обучения. Используйте современное банковское дело, обеспечьте чай на своих рынках и позвольте мудрости заменить меч." #NT!
 nd_mgo_dest_eternal_dharma: "Вечная Дхарма" #NT!
 nd_mgo_dest_eternal_dharma_desc: "Превратите Монголию в непреходящий центр буддийской цивилизации. Распространяйте грамотность с помощью печатного станка и развивайте степь так, как не мог мечтать ни один хан." #NT!
 nd_mgo.6.t: "Судьба Монголии" #NT!
 nd_mgo.6.d: "Монголия снова реформирована, став степной державой. Великое небо бесконечно простирается над головой, а под ним монгольский народ впервые за многие поколения переводит дыхание. Но кем станет эта нация?\n\nПуть, выбранный при нашем формировании, теперь открывается перед нами. Идем ли мы к восстановлению Великого Юаня или к новой эре дхармы и обучения, судьба монгольского народа зависит от нас." #NT!
 nd_mgo.6.a: "Вечное голубое небо наблюдает за нами" #NT!
 nd_mgo.7.t: "Монгольские знамена над Даду" #NT!
 nd_mgo.7.d: "Великий город Даду (Ханбалык, Город хана) снова пал под властью монголов. Ни разу с тех пор, как Тогон-Темур бежал на север в 1368 году, монгольский правитель не сидел в старой столице Юаня. Запретный город, построенный Хубилай-ханом, стоит, как и всегда, ожидая своих законных хозяев.\n\nКогда Датун стал воротами между степью и населенными землями, первый шаг восстановления Великого Юаня завершен. Народы севера смотрят на монгольское знамя со смесью трепета и страха, поскольку помнят, что оно значило, когда оно в последний раз пролетало над этими стенами." #NT!
 nd_mgo.7.a: "Даду снова наш, как и всегда должно было быть." #NT!
 nd_mgo.8.t: "Северный мандат" #NT!
 nd_mgo.8.d: "Когда Маньчжурия оказалась под нашей пятой, а коридор Ганьсу был обеспечен, стратегическое положение старой династии Юань было восстановлено во всем, кроме названия. От Шэньяна до Ланьчжоу власть монголов простирается по всей территории северного Китая.\n\nНо как нам управлять этими обширными завоеваниями? Некоторые советники призывают идти по пути террора: пусть репутация монгольских всадников заморозит наших врагов еще до того, как начнется битва. Другие выступают за дисциплинированную оккупацию: железное ярмо систематической монгольской администрации, которая собирает дань и солдат из каждой завоеванной провинции." #NT!
 nd_mgo.8.a: "Пусть ужас нашего имени пройдет перед нами" #NT!
 nd_mgo.8.b: "Дисциплина и порядок должны связать наши завоевания" #NT!
 nd_mgo.9.t: "Великий Юань снова жив" #NT!
 nd_mgo.9.d: "От городов Шелкового пути Кашгара до каналов Ханчжоу, от центральных равнин Кайфэна до степного центра Каракорума — Монгольская империя возродилась. То, что начал Чингисхан и усовершенствовал Хубилай-хан, теперь мы восстановили.\n\nВопрос, который стоит перед каждым великим завоевателем, теперь стоит перед нами: будем ли мы править этой империей с ханбалыкского трона как императоры устоявшейся цивилизации, управляя подданными и строя институты? Или мы останемся теми, кем были всегда: завоевателями мира, для которых горизонт никогда не является границей, а лишь следующей целью?" #NT!
 nd_mgo.9.a: "Мы будем править с Ханбалыкского трона" #NT!
 nd_mgo.9.b: "Сам мир – наше право по рождению" #NT!
 nd_mgo.10.t: "Свет Дхармы" #NT!
 nd_mgo.10.d: "Священная связь между Монголией и Тибетом скреплена. Поскольку Лхаса находится под защитой Монголии, учения Желтой Шляпы свободно текут на север через горы. Монахи из Дрепунга и Серы путешествуют в степь, основывают монастыри и обучают дхарме нетерпеливых монгольских учеников.\n\nЭто не просто вопрос веры. Монастыри обеспечивают грамотность, ведение учета, медицину и космополитическую сеть обучения, которая соединяет Монголию с более широким буддийским миром. Богатство, накопленное благодаря тщательному управлению, поддерживает эту трансформацию, доказывая, что Монголия может быть великой без одних лишь завоеваний." #NT!
 nd_mgo.10.a: "Дхарма освещает степь" #NT!
 nd_mgo.11.t: "Королевство монахов и торговцев" #NT!
 nd_mgo.11.d: "Монголия стала чем-то, что ее предки-воины едва ли узнали: процветающим царством монастырей, рынков и образования. Банковские учреждения, перенятые из далеких стран, позволяют монастырям управлять своим растущим богатством, а торговля чаем с Китаем обогащает каждое поселение на караванных путях.\n\nНо какой аспект этой трансформации мы должны подчеркнуть? Некоторые выступают за углубление монашеской традиции: строить больше монастырей, обучать больше ученых, позволить мудрости сангхи направлять рост нашей нации. Другие указывают на чайный путь и утверждают, что будущее Монголии лежит в торговле: что богатство, протекающее через наши рынки, позволит достичь того, чего никогда не смогли бы сделать армии." #NT!
 nd_mgo.11.a: "Углубляйте мудрость сангхи" #NT!
 nd_mgo.11.b: "Чайная дорога – наш путь к величию" #NT!
 nd_mgo.12.t: "Вечная Дхарма Степи" #NT!
 nd_mgo.12.d: "Монголия достигла того, что никто не считал возможным: кочевой цивилизации, которая может соперничать с любым оседлым королевством в области образования, процветания и культуры. Великий монастырский комплекс Эрдэнэ-Зуу стоит на руинах древнего Каракорума, где когда-то держали двор завоеватели мира. Теперь здесь собираются монахи и учёные, а не воины.\n\nПисьмо Соёмбо, созданное Занабазаром, само по себе стало символом монгольской идентичности, украшающим всё — от монастырских ворот до официальных документов. Будем ли мы реализовывать видение Занабазара: использовать культуру и искусство в качестве инструментов «мягкой силы»? Или нам стоит построить универсальную сангху, буддийскую общину, которая выйдет за пределы границ и свяжет все народы степи под нежной властью Дхармы?" #NT!
 nd_mgo.12.a: "Видение Занабазара будет нашим путеводителем" #NT!
 nd_mgo.12.b: "Пусть сангха объединит все народы" #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_steppe_terror: "Степной ужас" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_steppe_terror: "Репутация монгольских всадников опережает их. Города скорее подчиняются, чем сталкиваются с последствиями сопротивления, а враги не решаются бросить вызов наследникам Чингисхана." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_iron_yoke: "Железное ярмо" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_iron_yoke: "Систематическая монгольская администрация с безжалостной эффективностью вытягивает солдат и дань из завоеванных провинций, хотя постоянная потребность в войсках утомляет народ." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_khanbaliq_throne: "Трон Ханбалыка" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_khanbaliq_throne: "Великий Хан правит с трона Ханбалыка как император обширных владений, вызывая лояльность различных подданных и создавая институты устойчивой империи." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_world_conqueror: "Завоеватель мира" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_world_conqueror: "Стремление монголов к созданию универсальной империи продолжается. Разведывательные сети и законные предлоги для войны развиваются быстрыми темпами, хотя содержание таких огромных армий напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_monastic_wisdom: "Монашеская мудрость" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_monastic_wisdom: "Монастыри стали двигателями роста Монголии, привлекая поселенцев и торговцев. Но процветание может породить самоуспокоенность в стране, которая когда-то жила мечом." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_tea_road_riches: "Богатство чайной дороги" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_tea_road_riches: "Огромные чайные караваны, пересекающие степь, приносят богатство в монгольскую казну и открывают дипломатические каналы, хотя приток серебра приводит к росту цен." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_soyombo_legacy: "Наследие Сойомбо" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_soyombo_legacy: "Культурные достижения Занабазара (письмо Соёмбо, буддийская скульптура и монастырская архитектура) становятся инструментами мягкой силы Монголии, завоевывая влияние там, где армии не могут этого сделать." #NT!
 STATIC_MODIFIER_NAME_nd_mgo_dest_universal_sangha: "Универсальная Сангха" #NT!
 STATIC_MODIFIER_DESC_nd_mgo_dest_universal_sangha: "Буддийская сангха преодолевает границы, создавая духовное сообщество, которое облегчает отношения с другими буддийскими народами и дает духовенству беспрецедентное влияние." #NT!
 nd_mgo_yuan_imperial_palace: "Императорский дворец Юань" #NT!
 nd_mgo_yuan_imperial_palace_desc: "Восстановленный дворец Великого хана в Ханбалыке, перестроенный в величии династии Юань. Из своих залов монгольский император распоряжается богатством Китая и преданностью ста народов." #NT!
 nd_mgo_imperial_court_upkeep: "Императорский двор" #NT!
 nd_mgo_imperial_court_upkeep_desc: "Восстановленному двору Юаня требуются шелковые одежды, прекрасный фарфор, элегантная мебель и качественная ткань, чтобы поддерживать великолепие, соответствующее достоинству Великого Хана." #NT!
 nd_mgo_erdene_zuu_complex: "Комплекс Эрдэнэ Зуу" #NT!
 nd_mgo_erdene_zuu_complex_desc: "Величественный монастырский комплекс на месте древнего Каракорума, в котором проживают сотни монахов, есть библиотеки священных текстов и мастерские буддийского искусства. Духовное сердце монгольской цивилизации." #NT!
 nd_mgo_erdene_zuu_upkeep: "Содержание монастырского комплекса" #NT!
 nd_mgo_erdene_zuu_upkeep_desc: "Бумага для копирования священных текстов, пчелиный воск для ритуальных ламп, домашний скот для кормления монашеской общины и благовония для ежедневного богослужения поддерживают этот великий центр обучения." #NT!
  
  # ===== BUREAUCRACY UNLOCK ===== 
 AUTO_MODIFIER_NAME_nd_mgo_bureaucracy_authority: "Бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_mgo_bureaucracy_authority: "При формировании [MGO.GetName] может стать местом размещения исторических институтов, каждый из которых моделирует реальный слой постюаньского монгольского государства: конфедерация Халха, обращение буддистов, кодифицированный Халха Джирум, пастырский регистр отог-хошуу и поселение сангхи Желтой Шапки." #NT!
  
  # ===== BUREAUCRACIES ===== 
 mgo_khalkha_tusheet_bureaucracy: "Конфедерация Халха-Тюшит" #NT!
 mgo_khalkha_tusheet_bureaucracy_desc: "После воссоединения Даян-хана (ок. 1500-1517) царство Халха расформировалось в три ханства Чингизидов: Тюшит (центр), Саин-Нойон (запад, отделился в 1725 году) и Засагт (крайний запад). Три хана собрались вместе в Хурээ Чуулгане, чтобы решить вопросы войны, престолонаследия и дани, что представляло собой структурный компромисс между притязаниями универсального хана и родовой автономией князей Борджигинов. Пока поддерживается, чуулган собирается, и федеральные рекруты собираются под одним знаменем; несмотря на то, что ими пренебрегают, три княжеские линии расходятся, и власть центра действует только в его собственных отогах." #NT!
 mgo_bogd_gegen_bureaucracy: "Родословная Богд Геген" #NT!
 mgo_bogd_gegen_bureaucracy_desc: "В 1639 году халхинские князья признали четырехлетнего Занабазара (сына Тюшит-хана Гомбодоржа и правнука Абадай-хана) первым Джебцундамба Хутукту, верховным перевоплощенным ламой Халха-Монголии. Обученный в Тибете у Пятого Далай-ламы, он заново основал Эрдэнэ Зуу и передвижную монашескую столицу Их Хури (позже Урга). Эта линия объединила родословную Чингизидов с реинкарнацией Гелуг, создав священную должность, легитимность которой пережила любого временного хана. Доступно только в том случае, если в королевстве принят тибетский буддизм." #NT!
 mgo_khalkha_jirum_bureaucracy: "Халха-Джирум" #NT!
 mgo_khalkha_jirum_bureaucracy_desc: "Составлено между 1709 и 1770 годами великим собранием Халхи при Тюшит-хане и втором Джебцундамба Хутукту. В его двадцать пять глав вошли Ясса Чингисхана, буддийские указы Алтан-хана 1577 года, Ойрат-Халха Их Цааз 1640 года и навязанные Маньчжурией монголо-ойратские правила. Дела рассматривались коллегиями зайсангов (родовых судей) по письменным статьям, минуя родовые сеньорские суды. Постоянный кодекс Монголии до тех пор, пока его не заменили маньчжурские кодификации 1780-х годов." #NT!
 mgo_otog_khoshuu_bureaucracy: "Баннерная администрация Отог-Хошуу" #NT!
 mgo_otog_khoshuu_bureaucracy_desc: "Пост-юаньские монгольские простолюдины были организованы в отоги (десятично-пастырские родовые единицы номинально в тысячу семей), каждое из которых возглавлялось назначенным тайши. Поселение Даян-хана привязывало отогов к шести тюменам; княжеские линии Халхи превратили их в наследственные хошуу, привязанные к единому нойанскому хозяйству, со своими пастбищными оборотами, почтовой повинностью (ёртёё) и позывными списками. Переезды между хошуусами были запрещены, и слово нойана управляло каждым движением простолюдина. Маньчжурский Лифан Юань унаследовал эту систему в неизменном виде в 1691 году." #NT!
 mgo_yellow_hat_sangha_bureaucracy: "Покровительство Сангхи Желтой Шляпы" #NT!
 mgo_yellow_hat_sangha_bureaucracy_desc: "В 1578 году Алтан-хан из Тюмеда встретил Сонам ​​Гьяцо в монастыре Янхуа; Алтан даровал титул Далай-ламы Сонаму Гьяцо, который, в свою очередь, провозгласил Алтана реинкарнацией Хубилай-хана. Соглашение сделало монгольских ханов временными покровителями ордена Гелуг. Возобновленное после основания Абадай-ханом в 1585 году Эрдэнэ-Зуу на руинах Каракорума и завоевания Гуши-ханом Тибета в 1642 году от имени Пятого Далай-ламы, покровительство предоставило монастырям шабинар (мирские слуги), освобожденные от княжеских налогов: финансовая привилегия, которая истощила нойаны и построила монашескую экономику Монголии. Доступно только в том случае, если в королевстве принят тибетский буддизм." #NT!
