l_russian:
 STATIC_MODIFIER_NAME_nd_boh_hussite_heritage: "Гуситское наследие" #NT!
 STATIC_MODIFIER_DESC_nd_boh_hussite_heritage: "Чаша Гуса горит в сердцах чешского народа. Религиозное инакомыслие, военные инновации и власть сословий определяют это королевство." #NT!
 STATIC_MODIFIER_NAME_nd_boh_crown_wenceslas: "Корона Святого Вацлава" #NT!
 STATIC_MODIFIER_DESC_nd_boh_crown_wenceslas: "Священная корона Богемии дарует своему владельцу имперский престиж и культурное покровительство. Прага сияет как жемчужина христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_boh_compactata_spirit: "Дух Компактатов" #NT!
 STATIC_MODIFIER_DESC_nd_boh_compactata_spirit: "Базельские соглашения закрепили право Богемии на общение в обоих видах. Религиозное сосуществование, хотя и непростое, преобладает на чешских землях." #NT!
 STATIC_MODIFIER_NAME_nd_boh_counter_reformation: "Контрреформация" #NT!
 STATIC_MODIFIER_DESC_nd_boh_counter_reformation: "Постановление о возобновлении земель навязало Богемии католическое соответствие. Старые гуситские свободы уничтожены, но порядок восстановлен." #NT!
 STATIC_MODIFIER_NAME_nd_boh_exile_legacy: "Наследие изгнанников" #NT!
 STATIC_MODIFIER_DESC_nd_boh_exile_legacy: "Богемские братья переносят свои знания в изгнание, распространяя чешскую науку по всей Европе. То, что было потеряно в вере, сохраняется в мысли." #NT!
 nd_boh.1.t: "Корона Богемии" #NT!
 nd_boh.1.d: "Земли Богемии и Моравии объединены под единой короной. На протяжении поколений это королевство стояло на перекрестке европейской цивилизации, резиденции императоров, колыбели религиозного восстания и дома одного из старейших университетов к северу от Альп.\n\nНо идентичность Богемии остается спорной. Память о Яне Гусе и гуситских войнах живет в каждом приходе и поместье. Чаша и корона тянутся в противоположных направлениях: будет ли Богемия определяться радикальным наследием ее религиозных инакомыслящих, с их демократическими собраниями и военными нововведениями? Или древним престижем короны Святого Вацлава с ее имперскими связями, культурным покровительством и местом среди великих католических королевств Европы?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_boh.1.a: "Чаша не должна умолкнуть." #NT!
 nd_boh.1.b: "Мы носим Корону Святого Вацлава." #NT!
 nd_boh.2.t: "Компакты Базеля" #NT!
 nd_boh.2.d: "После десятилетий опустошительной религиозной войны было достигнуто чрезвычайное соглашение. Базельский собор признал права утраквистской церкви в Богемии. Это первый случай в христианской истории, когда диссидентское религиозное движение вырвало формальные уступки со стороны Римской церкви.\n\nБазельские договоры гарантируют общение в обоих видах, разрешают мирскую проповедь и признают экспроприацию церковных земель. Богемия представляет собой уникальный эксперимент религиозного сосуществования, произошедший за столетие до того, как Реформация потрясет остальную Европу. Умеренные гуситы добились того, за что радикалы сражались и умирали в Липанах, не благодаря победе в битве, а благодаря истощению своих врагов и прагматизму своих дипломатов." #NT!
 nd_boh.2.a: "Sub utraque spice, под обоими видами." #NT!
 nd_boh.3.t: "Обновленное постановление о земле" #NT!
 nd_boh.3.d: "Катастрофа на Белой горе изменила Богемию. Протестантские сословия, осмелившиеся избрать Фридриха Пфальцского своим королем, были разгромлены, их лидеры казнены на Староместской площади, их имущество конфисковано. Постановление Фердинанда II об обновлении земель 1627 года отменило старую чешскую конституцию, сословный сейм, который когда-то избирал королей, теперь является резиновым штампом, чешский язык понижен до уровня немецкого, и разрешена только католическая вера.\n\nНо это опустошение также дает выбор. Старая богема конкурирующих конфессий мертва. То, что восстанет из этого пепла, будет зависеть от того, как его правители будут владеть этой абсолютной властью." #NT!
 nd_boh.3.a: "Укрепляйте истинную веру без компромиссов." #NT!
 nd_boh.3.b: "Пусть изгнанники несут наши знания миру." #NT!
 nd_boh.4.t: "Чешское национальное пробуждение" #NT!
 nd_boh.4.d: "Что-то шевелится в библиотеках и лекционных залах Праги. Такие ученые, как Йозеф Добровский и Йозеф Юнгманн, реконструируют чешский язык по фрагментам, оставшимся после двух столетий германизации. Они заново открывают гуситское наследие не как ересь, а как национальное наследие, доказывая, что чешский народ когда-то бросил вызов всей Европе и победил.\n\nНациональное пробуждение — это больше, чем лингвистическое движение. Это подтверждение богемской идентичности, соединяющее средневековое королевство Карла IV через гуситскую революцию с современным требованием национального самоопределения. Чешская культура, долгое время подавлявшаяся, теперь требует своего места под солнцем." #NT!
 nd_boh.4.a: "Чешская нация еще жива." #NT!
 nd_boh_silver_legacy: "Серебряное наследие Кутной Горы" #NT!
 nd_boh_silver_legacy_desc: "Богатые месторождения серебра Кутной Горы сделали Богемию одним из самых богатых королевств средневековой Европы, производя треть всего европейского серебра." #NT!
 nd_boh_premyslid_crown: "Управление Короной Пржемысловичей" #NT!
 nd_boh_premyslid_crown_desc: "Династия Пржемысловичей заложила административные основы чешской короны, централизовав королевскую власть над чешскими землями." #NT!
 nd_boh_hop_brewing: "Выращивание богемского хмеля" #NT!
 nd_boh_hop_brewing_desc: "Хмель Сааз в Богемии настолько ценился, что экспорт ростков хмеля карался смертью. Традиция пивоварения восходит к самым ранним монастырям." #NT!
 nd_boh_charles_university: "Карлов университет" #NT!
 nd_boh_charles_university_desc: "Основанный в 1348 году Карлом IV, Пражский университет был первым университетом в Центральной Европе и привлекал ученых со всего континента." #NT!
 nd_boh_prague_golden_age: "Золотой век Праги" #NT!
 nd_boh_prague_golden_age_desc: "При Карле IV Прага стала центром готического искусства и архитектуры. Карлов мост, собор Святого Вита и Новый город преобразили город." #NT!
 nd_boh_houfnice_innovation: "Полевые орудия Гуфнице" #NT!
 nd_boh_houfnice_innovation_desc: "Чешское слово «houfnice», мобильная полевая пушка, дало английскому языку слово «гаубица». Гуситские артиллеристы первыми применили артиллерию в открытом бою." #NT!
 nd_boh_tabor_warfare: "Таборская война" #NT!
 nd_boh_tabor_warfare_desc: "Радикальные гуситы построили укрепленный город Фавор как образцовое поселение и военную базу. Их оборонительная тактика сочетала в себе вагенбург, огнестрельное оружие и веру." #NT!
 nd_boh_compactata: "Компакты Базеля" #NT!
 nd_boh_compactata_desc: "Соглашение 1436 года между Базельским собором и гуситами было первым религиозным соглашением, достигнутым путем переговоров в европейской истории." #NT!
 nd_boh_hussite_levy: "Гуситские крестьянские сборы" #NT!
 nd_boh_hussite_levy_desc: "Гуситские войны мобилизовали чешских крестьян как никогда раньше. Вооруженные боевыми цепами, алебардами и праведной яростью, они победили рыцарей-крестоносцев." #NT!
 nd_boh_bohemian_brethren: "Единство братьев" #NT!
 nd_boh_bohemian_brethren_desc: "Богемские братья, наследники гуситских традиций, делали упор на образование, грамотность и моральную дисциплину. Ян Амос Коменский стал отцом современной педагогики." #NT!
 nd_boh_professional_infantry: "Богемская профессиональная пехота" #NT!
 nd_boh_professional_infantry_desc: "Опираясь на гуситские военные традиции, Богемия создала дисциплинированную профессиональную пехоту, владеющую пиками и стрелами." #NT!
 nd_boh_estate_diets: "Богемная поместная диета" #NT!
 nd_boh_estate_diets_desc: "Богемский сейм был одним из самых влиятельных представительных собраний в Европе, имевшим право избирать королей и утверждать налоги." #NT!
 nd_boh_verneuerte_landesordnung: "Verneuerte Landesordnung" #NT!
 nd_boh_verneuerte_landesordnung_desc: "Постановление Фердинанда II об обновлении земель 1627 года отменило старую чешскую конституцию, установив абсолютное правление Габсбургов после битвы при Белой горе." #NT!
 nd_boh_recatholicization: "Рекатолицизация" #NT!
 nd_boh_recatholicization_desc: "Принудительная рекатолицизация Богемии после 1620 года привела к изгнанию протестантского духовенства, конфискации поместий и навязыванию религиозного конформизма по всему королевству." #NT!
 nd_boh_baroque_prague: "Барочная Прага" #NT!
 nd_boh_baroque_prague_desc: "Контрреформация преобразила горизонт Праги благодаря впечатляющим церквям, дворцам и садам в стиле барокко, построенным итальянскими и австрийскими архитекторами." #NT!
 nd_boh_bohemian_glass_trade: "Богемское Стекло Трейд" #NT!
 nd_boh_bohemian_glass_trade_desc: "Богемское хрустальное стекло стало предметом роскоши, экспортируемым по всей Европе в 17 и 18 веках, конкурируя с венецианским муранским стеклом как лучшее на континенте." #NT!
 nd_boh_national_awakening: "Чешское национальное пробуждение" #NT!
 nd_boh_national_awakening_desc: "Ученые и писатели заново открыли для себя чешский язык и гуситское наследие, сформировав современную национальную идентичность из фрагментов подавленной культуры." #NT!
 nd_boh_industrial_bohemia: "Индустриальная Богемия" #NT!
 nd_boh_industrial_bohemia_desc: "Богемия стала одним из наиболее промышленно развитых регионов Центральной Европы с чугунолитейными, текстильными фабриками и густой железнодорожной сетью." #NT!
 nd_boh_pilsner_revolution: "Пильзнерская революция" #NT!
 nd_boh_pilsner_revolution_desc: "В 1842 году пивоварня Pilsen Burgher выпустила первый золотой лагер с использованием хмеля Saaz и мягкой пльзеньской воды, создав стиль пива, покоривший мир.\n\n#italic Доступно в: $nd_boh_brewhouse$#!" #NT!
 nd_boh_constitutional_struggle: "Конституционная борьба" #NT!
 nd_boh_constitutional_struggle_desc: "Требование чешской автономии в рамках Габсбургской монархии привело к конституционным дебатам и возникновению современной чешской политической жизни." #NT!
 a_nd_boh_houfnice: "Гуфнице" #NT!
 a_nd_boh_houfnice_desc: "Мобильные гуситские полевые орудия, предшественники современной гаубицы. Достаточно легкий, чтобы не отставать от вагенбурга, и достаточно разрушительный, чтобы отразить атаку кавалерии." #NT!
 a_nd_boh_cepnik: "Чепник" #NT!
 a_nd_boh_cepnik_desc: "Гуситские крестьянские воины, вооружённые боевыми цепами, кеп. Фанатично защищаясь, они сломали цветок европейского рыцарства у Виткова и Кутной Горы." #NT!
 a_nd_boh_landsknecht: "Богемский ландскнехт" #NT!
 a_nd_boh_landsknecht_desc: "Профессиональные богемские копейщики и алебардисты, наследники гуситских пехотных традиций. Дисциплинированные формирования обучены противостоять кавалерии." #NT!
 nd_boh_kutna_hora_mint: "Кутна Гора Мятный" #NT!
 nd_boh_kutna_hora_mint_desc: "Итальянский двор в Кутной Горе чеканил пражский грош, а затем и талер на протяжении более четырех столетий, что сделало чеканку Богемии стандартом Центральной Европы." #NT!
 nd_boh_silver_minting: "Чеканка серебра" #NT!
 nd_boh_silver_minting_desc: "Рафинированное богемское серебро чеканят в Пражских грошах и талерах, производя изысканные ювелирные изделия и роскошные изделия из металла на экспорт." #NT!
 nd_boh_brewhouse: "Богемская пивоварня" #NT!
 nd_boh_brewhouse_desc: "Лицензированная пивоварня, использующая ценный чешский хмель Saaz. Королевские пивоваренные привилегии гарантируют качество и ограничивают конкуренцию." #NT!
 nd_boh_saaz_hop_brewing: "Сааз Хоп Пивоварение" #NT!
 nd_boh_saaz_hop_brewing_desc: "Богемское пивоварение с использованием ароматного сорта хмеля Сааз, дающее пиво непревзойденной прозрачности и вкуса." #NT!
 nd_boh_pilsner_method: "Метод Пилснер Лагер" #NT!
 nd_boh_pilsner_method_desc: "Революционная технология низового брожения с использованием светлого солода и мягкой воды позволяет получить кристально чистое золотистое пиво." #NT!
 nd_boh_hussite_tabor: "Гуситский Табор" #NT!
 nd_boh_hussite_tabor_desc: "Укрепленное поселение в гуситских традициях, частично гарнизонное, частично общинное, предназначенное для постоянной обороны с применением огнестрельного оружия и повозок." #NT!
 nd_boh_tabor_garrison: "Содержание Таборского гарнизона" #NT!
 nd_boh_tabor_garrison_desc: "Содержание гарнизона, укреплений и оружейных складов гуситской таборской общины." #NT!
 nd_boh_karolinum: "Каролинум" #NT!
 nd_boh_karolinum_desc: "Университет в традициях основания Карла IV в Праге, первый университет в Центральной Европе, центр теологии, права и гуманитарных наук." #NT!
 nd_boh_university_maintenance: "Техническое обслуживание университета" #NT!
 nd_boh_university_maintenance_desc: "Обеспечение ученых и студентов книгами, бумагой и учебными материалами." #NT!
 nd_boh_baroque_church: "Церковь в стиле барокко" #NT!
 nd_boh_baroque_church_desc: "Великолепная церковь контрреформации, построенная в богато украшенном стиле барокко, памятник католическому возрождению и культурному покровительству Габсбургов в Богемии." #NT!
 nd_boh_baroque_patronage: "Барокко Меценатство" #NT!
 nd_boh_baroque_patronage_desc: "Сохранение и украшение церковной архитектуры в стиле барокко, свечи, горящие перед позолоченными алтарями, книги для духовенства, камень для постоянного обновления." #NT!
 nd_boh_ironworks: "Богемский металлургический завод" #NT!
 nd_boh_ironworks_desc: "Современный чугунолитейный завод использует богатые месторождения железа и угля Богемии для производства высококачественной стали для промышленности и на экспорт." #NT!
 nd_boh_iron_smelting: "Выплавка железа" #NT!
 nd_boh_iron_smelting_desc: "Переработка чешской железной руды угольным топливом с получением стали промышленного качества." #NT!
 levy_nd_boh_cepnik: "Чепник Леви" #NT!
 levy_nd_boh_cepnik_desc: "Гуситские крестьянские воины с боевыми цепами, воспитанные в набожной сельской местности Богемии." #NT!
 nd_boh_formed_tt: "была образована Богемия." #NT!
 nd_boh_path_a_tt: "Выбрал гуситское наследие" #NT!
 nd_boh_path_b_tt: "Выбрать Корону Святого Вацлава" #NT!
 nd_boh_destiny: "Судьба Богемии" #NT!
 nd_boh_destiny_desc: "Коронные земли объединены. Теперь Богемия должна выбрать свой путь – чашу Гуса или корону Вацлава – и довести свою судьбу до конца." #NT!
 nd_boh_dest_spanile_jizdy: "Красивые аттракционы" #NT!
 nd_boh_dest_spanile_jizdy_desc: "Гуситские военные банды совершали опустошительные набеги, «spanile jizdy», в глубь Саксонии, Бранденбурга и Силезии, сея террор и слово Божие. Захватите Вроцлав и Гёрлиц, чтобы обезопасить восточный и северный фланги Богемии." #NT!
 nd_boh_dest_bohemian_hegemony: "Богемская гегемония" #NT!
 nd_boh_dest_bohemian_hegemony_desc: "Обеспечив Силезию и Лужицу, гуситские армии смогут прорваться в самое сердце Саксонии. Возьмите Дрезден и Мейсен и создайте военную мощь, чтобы доминировать в Центральной Европе." #NT!
 nd_boh_dest_warriors_of_god: "Воины Бога" #NT!
 nd_boh_dest_warriors_of_god_desc: "Гуситская революция достигла своего апогея. Нюрнберг, Берлин и Краков должны пасть, чтобы доказать, что никакой крестовый поход не может сломить воинов Божьих. Это краеугольный камень военного превосходства Богемии." #NT!
 nd_boh_dest_carolinum: "Каролинум" #NT!
 nd_boh_dest_carolinum_desc: "Карл IV основал первый университет к северу от Альп и превратил Прагу в центр европейского образования. Используйте институты эпохи и создайте казну для финансирования культурных амбиций Богемии." #NT!
 nd_boh_dest_imperial_capital: "Имперская столица" #NT!
 nd_boh_dest_imperial_capital_desc: "Прага когда-то была резиденцией императора Священной Римской империи. Обезопасьте Вену, развивайте королевство и восстановите положение Богемии как главного королевства Центральной Европы." #NT!
 nd_boh_dest_praga_caput: "Прага Капут Реньи" #NT!
 nd_boh_dest_praga_caput_desc: "Прага, глава королевства, а возможно, и всей Европы. Контролируйте Аугсбург, используйте печатный станок и поднимите Богемию до уровня культурной и институциональной силы, не имеющей себе равных." #NT!
 nd_boh.5.t: "Судьба Богемии" #NT!
 nd_boh.5.d: "Земли чешской короны объединены под единым правителем. Королевство стоит на перепутье. Будет ли наследие Гуса вести его армии вперед в священной войне, или же память о Карле IV привлечет в Прагу ученых и ремесленников, сделав ее жемчужиной империи? Путь, выбранный сейчас, определит судьбу чешского народа на многие столетия вперед." #NT!
 nd_boh.5.a: "Наша судьба ждет." #NT!
 nd_boh.6.t: "Красивые аттракционы начинаются" #NT!
 nd_boh.6.d: "Полевые армии гуситов прорвались через горные перевалы и захватили великие города за ними. Вроцлав, столица Силезии, и Гёрлиц, ворота Лужицы, теперь несут знамя чаши. Испанские джизды, «Прекрасные аттракционы», которые когда-то терроризировали половину Европы, стали постоянными завоеваниями. Крестоносцы, которые когда-то шли против Богемии, теперь прячутся за стенами, когда воины Божьи выезжают вперед." #NT!
 nd_boh.6.a: "Бог желает этого, в обоих случаях." #NT!
 nd_boh.7.t: "Гегемония Чаши" #NT!
 nd_boh.7.d: "Саксонское сопротивление рухнуло. Дрезден и Мейсен, центр династии Веттинов, теперь находятся под властью богемы. Гуситская военная машина, выкованная десятилетиями оборонительной войны, стала доминирующей силой в Центральной Европе. Но гегемония требует выбора. Будет ли сила Богемии опираться на железный цеп ее воинов или на пламенные проповеди ее полевых проповедников, поддерживающих фанатичный боевой дух армии?" #NT!
 nd_boh.7.a: "Позвольте цепу проповедовать." #NT!
 nd_boh.7.b: "Слово Божье поддерживает наши армии." #NT!
 nd_boh.8.t: "Воины Бога" #NT!
 nd_boh.8.d: "Нюрнберг, Берлин, Краков, великие города Центральной Европы пали в руки богемы. Ни крестовый поход, ни коалиция, ни один император не могли остановить продвижение воинов Бога. То, что гуситы начали как отчаянную защиту своей чаши общения, превратилось в самую выдающуюся военную экспансию в европейской истории. Слепой гений Яна Жижки нашел свое высшее выражение.\n\nНо каждая империя должна решить, как управлять своими завоеваниями. Будет ли Богемия править исключительно посредством военной дисциплины или попытается провести радикальный эксперимент по распространению своих протодемократических собраний на завоеванные земли?" #NT!
 nd_boh.8.a: "Дисциплина и меч будут править." #NT!
 nd_boh.8.b: "Пусть в каждой стране будет свое собрание." #NT!
 nd_boh.9.t: "Новый Каролинум" #NT!
 nd_boh.9.d: "Научная традиция Праги, основанная самим Карлом IV, породила новое поколение мыслителей и управленцев. Охват современной банковской и институциональной реформы наполнил королевскую казну и привлек торговцев со всей Европы. Каролинум, когда-то бывший просто университетом, стал интеллектуальным двигателем королевства, которое руководит знаниями, а не завоеваниями." #NT!
 nd_boh.9.a: "Прага станет Афинами Севера." #NT!
 nd_boh.10.t: "Имперская столица восстановлена" #NT!
 nd_boh.10.d: "Вена защищена, и королевство процветает. Богемия вернула себе имперский статус, который она имела при Карле IV, когда Прага была бесспорной столицей Священной Римской империи. Институциональная сложность и культурный престиж королевства привлекают послов и ученых со всего континента.\n\nНо имперские амбиции проявляются в разных формах. Будет ли Богемия использовать Золотую буллу 1356 года, конституционный шедевр Карла IV, чтобы закрепить свое дипломатическое превосходство? Или инвестировать в пражские мастерские и ремесленников, чтобы создать экономический фундамент, с которым не сможет сравниться ни один конкурент?" #NT!
 nd_boh.10.a: "Призовите Золотого Быка." #NT!
 nd_boh.10.b: "Инвестируйте в пражских ремесленников." #NT!
 nd_boh.11.t: "Прага Капут Реньи" #NT!
 nd_boh.11.d: "Прага, глава королевства. Древний девиз никогда не был более верным. Благодаря обеспечению Аугсбурга и печатному станку, распространяющему богемное образование по всей Европе, Прага становится культурной и институциональной столицей Центральной Европы, роль, которой она не занимала со времен золотых дней Карла IV. Мечта о империи под руководством богемы, построенной на учености, а не на завоеваниях, теперь стала реальностью.\n\nСможет ли Богемия претендовать на главный приз — титул Rex Romanorum, короля римлян, и править Европой посредством престижа и превосходства? Или обратиться внутрь себя, способствуя богемному просвещению, которое осветит мир через знания?" #NT!
 nd_boh.11.a: "Мы будем Рексом Романорумом." #NT!
 nd_boh.11.b: "Пусть Прага осветит мир." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_iron_flail: "Железный цеп" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_iron_flail: "Гуситский военный цеп сокрушает любое сопротивление. Богемское осадное мастерство и боевой дух не имеют себе равных, хотя опустошение войны замедляет рост простого народа." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_field_preachers: "Полевые проповедники" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_field_preachers: "Гуситские проповедники маршируют вместе с армиями, проявляя фанатичную преданность и привлекая добровольцев из каждой деревни. Цена этой рьяной мобилизации ложится бременем на казну." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_gods_warriors: "Воины Бога" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_gods_warriors: "Дисциплинированные армии гуситского государства маршируют с божественной целью, их линии снабжения эффективны, а их враги гибнут на враждебной территории Богемии." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_hussite_commonwealth: "Гуситское Содружество" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_hussite_commonwealth: "Радикальное гуситское видение общественного управления распространяется на завоеванные земли, поддерживая народные армии, хотя децентрализованное казначейство увеличивает стоимость займов." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_golden_bull: "Дух Золотого Быка" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_golden_bull: "Конституционная основа «Золотой буллы» повышает дипломатический статус Богемии среди князей Европы, хотя для поддержания этого престижа требуется более крупная домашняя охрана." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_prague_workshop: "Пражские мастер-классы" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_prague_workshop: "Пражские ремесленники и строители производят произведения исключительного качества по более низкой цене, хотя ориентация королевства на ремесла отвлекает мужчин от военной службы." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_rex_romanorum: "Рекс Романорум" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_rex_romanorum: "Король Богемии претендует на древний титул короля римлян. Имперский престиж непоколебим, хотя бремя поддержания этого статуса утомляет королевство в военное время." #NT!
 STATIC_MODIFIER_NAME_nd_boh_dest_bohemian_enlightenment: "Богемное Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_boh_dest_bohemian_enlightenment: "Прага возглавляет научную революцию, которая распространяет институты и развитие по всему королевству, используя эффективные методы строительства, перенятые поколениями строителей." #NT!
 nd_boh_hussite_arsenal: "Гуситский Арсенал" #NT!
 nd_boh_hussite_arsenal_desc: "Большой оружейный комплекс и мастерские в гуситских традициях, производящие военные повозки, полевые орудия и внушающее страх цеповое оружие богемской пехоты." #NT!
 nd_boh_arsenal_maintenance: "Техническое обслуживание Арсенала" #NT!
 nd_boh_arsenal_maintenance_desc: "Обслуживание кузниц, лесных складов и оружейных мастерских гуситского арсенала." #NT!
 nd_boh_imperial_academy: "Императорская Академия" #NT!
 nd_boh_imperial_academy_desc: "Высшее учебное заведение в традициях Карла IV, конкурирующее с Болоньей и Парижем как центр европейской науки и институциональных инноваций." #NT!
 nd_boh_academy_maintenance: "Обслуживание Академии" #NT!
 nd_boh_academy_maintenance_desc: "Обеспечение ученых, содержание библиотеки и финансирование лекций императорской академии." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_boh_bureaucracy_authority: "Управление Богемской Короны" #NT!
 AUTO_MODIFIER_DESC_nd_boh_bureaucracy_authority: "Воссозданное Чешское королевство унаследовало институциональный вес правления Пршемысловичей, Люксембурга и Ягеллонов. Земельные таблицы, Земельный суд и Сейм трех сословий предоставляют два бюрократических места, в которых Корона Святого Вацлава может формализовать свои постоянные государственные органы." #NT!
  
 boh_zemsky_snem_bureaucracy: "Земский снег" #NT!
 boh_zemsky_snem_bureaucracy_desc: "Земельный сейм Богемии созвал три сословия (панство, лордов, включая епископов; ритирство, рыцарей и депутатов королевских городов) в Прагу или Кутну Гору для голосования по налогам, выбора королей и проверки дел Короны. Крестьяне не имели представительства. Постановление о земле Владислава 1500 г. кодифицировало полномочия Сейма и считается старейшей письменной чешской конституцией; Богемская конфедерация 1619 года довела эти державы до предела. Председателем сейма был верховный бургграф, председательствовавший в Пражском Граде." #NT!
  
 boh_desky_zemske_bureaucracy: "Дески земские" #NT!
 boh_desky_zemske_bureaucracy_desc: "Земельные таблицы, созданные при Пршемысле Отакаре II в тринадцатом веке, представляли собой реестр аллодиальных имений, постановлений сейма и постановлений земельного суда чешской короны. Передача собственности между дворянами была действительна только тогда, когда она была зафиксирована в книгах, что давало шляхте Богемии писаную гарантию от произвольного захвата за два столетия до того, как такие гарантии стали обычным явлением в других местах. Таблицы оставались действующим кадастром королевства до 1848 года с параллельными регистрами для Моравии и Силезии." #NT!
  
 boh_zemsky_soud_bureaucracy: "Земский звук" #NT!
 boh_zemsky_soud_bureaucracy_desc: "Земельный суд Богемии, высший судебный орган для дворянских сословий, заседал в Пражском Граде под председательством Верховного бургграфа, а заседателями выступали великие бароны королевства. Его решения были внесены в Земельные таблицы и считались окончательными; Малый земельный суд (Menší zemský soud) рассматривал дела ниже дворянского порога. Королевская воля сдерживалась судом, который король не полностью контролировал, и коллективная память дворян о его решениях определяла то, что они принимали и не принимали от нового короля во время его коронационной присяги." #NT!
  
 boh_burgrabstvi_prazske_bureaucracy: "Невероятные пуркрабства Пражске" #NT!
 boh_burgrabstvi_prazske_bureaucracy_desc: "Верховный бургграф Пражского Града был высшим земельным офицером королевства и заместителем короля в его отсутствие, обладая судебной, военной и административной властью над королевством. С четырнадцатого века бургграф председательствовал в Земельном суде и подписывал корону, когда монарх находился за границей: естественный канал для странствующего люксембургского или отсутствующего правителя Габсбургов. Дом бургграфа, первоначально готический и много раз перестроенный, до сих пор стоит в стенах Пражского Града. Канцелярию упразднили только в 1848 году." #NT!
  
 boh_compactata_bureaucracy: "Компактата" #NT!
 boh_compactata_bureaucracy_desc: "Базельские договоры, заключенные с Базельским собором и ратифицированные богемскими поместьями в Йиглаве 5 июля 1436 года, положили конец гуситским войнам, предоставив утраквистам их четыре требования: причастие в обоих видах (sub utraque specie, хлеб и вино для мирян), свободная проповедь слова Божьего, наказание общественных грехов соответствующей властью и экспроприация земель Римской церкви, захваченных во время войны. Независимая Богемская католическая церковь под руководством избранного архиепископа допускалась. Папа Евгений IV отказался ратифицировать этот документ, но на протяжении почти столетия это был действующий закон религиозного сосуществования в землях чешской короны: конфессиональная лоскутная путаница, принятая за сто лет до Аугсбургского мира." #NT!
  
 boh_kutnohorsky_dekret_bureaucracy: "Кутногорский декрет" #NT!
 boh_kutnohorsky_dekret_bureaucracy_desc: "18 января 1409 года Вацлав IV подписал Кутнагорский указ, перевесивший голоса четырех факультетов Карлова университета в Праге: три голоса за чешский народ, один за баварский, саксонский и польский народы вместе взятые. Около восьмидесяти процентов немецких магистров и их учеников вышли из него, основав то, что впоследствии стало Лейпцигским университетом. Круг Гуса получил необходимые им стулья; Чешский стал рабочим академическим языком; а космополитическая пражская студия превратилась в национальную. Некоторые историки рассматривают этот указ как первый чешский националистический документ." #NT!
  
 boh_obnovene_zrizeni_bureaucracy: "Обновить Земские Земские" #NT!
 boh_obnovene_zrizeni_bureaucracy_desc: "Постановление об обновлении земель, обнародованное Фердинандом II 10 мая 1627 года после Белой горы, разрушило конституционные достижения трех столетий. Чешская корона была объявлена ​​наследственным владением Габсбургов, выборная монархия отменена, разрешен только католицизм, а немецкий язык поставлен на равные права с чешским в управлении. Сейм сохранился только как реестр королевских указов; Compactata были разорваны; Великая протестантская знать была казнена на Староместской площади в 1621 году, сослана или экспроприирована. Чешское королевство стало, по сути, провинцией государства Габсбургов." #NT!
