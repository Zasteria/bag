l_russian:
 STATIC_MODIFIER_NAME_nd_shahanshah_militant: "Шаханшах: Царь королей" #NT!
 STATIC_MODIFIER_DESC_nd_shahanshah_militant: "Трон Персии требует владычества. Как Шаханшах, Царь царей, наши армии прогремят над Иранским нагорьем и за его пределами, неся знамя империи во все уголки известного мира. Конница, разгромившая османов у Чалдырана и узбеков у Мерва, снова едет." #NT!
 STATIC_MODIFIER_NAME_nd_nesf_e_jahan: "Исфахан Несф-э Джахан" #NT!
 STATIC_MODIFIER_DESC_nd_nesf_e_jahan: "Исфахан – это полмира, так гласит пословица. При шахе Персия станет маяком цивилизации, где процветают искусство, торговля и образование. Грандиозные базары будут наполнены торговлей из Китая в Европу, а красота персидской архитектуры будет вызывать трепет на протяжении веков." #NT!
 STATIC_MODIFIER_NAME_nd_guardian_of_shiism: "Хранитель шиитской веры" #NT!
 STATIC_MODIFIER_DESC_nd_guardian_of_shiism: "Персия выступает крепостью двунадесятного шиизма против мира суннитских империй. Благодаря авторитету шаха и мудрости улемов нация создаст нерушимую связь между государством и верой. Религиозное единство станет основой, на которой будет построена прочная империя." #NT!
 nd_ira.1.t: "Возвышение Персии" #NT!
 nd_ira.1.d: "Иранское нагорье объединено под единой короной. От гор Загроса до берегов Каспия, от пустынь Хорасана до болот Месопотамии — разнообразные народы Персии подчиняются одному государю. Это момент, который когда-то познали Кир и Дарий, — рождение империи, простирающейся на разные континенты и культуры.\n\nНо характер этой империи еще предстоит решить. Выйдем ли мы победителями, как Ахемениды и Сасаниды до нас? Должны ли мы превратить Исфахан в чудо света, столицу, которая заставит дворы Европы плакать от зависти? Или нам следует создать религиозное единство, которое будет определять Персию на протяжении веков, став непоколебимым бастионом шиитской веры?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ira.1.a: "Мы поедем как Царь Королей!" #NT!
 nd_ira.1.b: "Исфахан будет половиной мира." #NT!
 nd_ira.1.c: "Мы – хранители истинной веры." #NT!
 nd_ira.2.t: "Исфахан: полмира" #NT!
 nd_ira.2.d: "Шах Аббас избрал своей столицей Исфахан, и город преобразился до неузнаваемости. Великолепная площадь Накш-э-Джахан, одна из крупнейших общественных площадей в мире, является сердцем империи. Бирюзовый купол мечети Шаха сверкает на солнце, дворец Али Капу возвышается над всей торговлей, а базар-э-Бозорг тянется на километры через сводчатые коридоры.\n\nИностранцы, которые посещают его, заявляют, что Исфахан - это действительно «половина мира», поскольку здесь можно найти все, что существует где-либо еще. Проспект Чахар Баг, окруженный садами и павильонами, соединяет армянский квартал Новой Джульфы с королевскими дворцами. Должны ли мы инвестировать в культурное великолепие Исфахана, превратив его в памятник персидской цивилизации? Или нам следует направить его энергию в коммерческие сети, которые обогатят всю империю?" #NT!
 nd_ira.2.a: "Пусть красота Исфахана вдохновляет века." #NT!
 nd_ira.2.b: "Пусть базары Исфахана обогатят империю." #NT!
 nd_ira.3.t: "Обращение Персии" #NT!
 nd_ira.3.d: "Превращение Персии из преимущественно суннитской страны в центр шиизма-двунадесятника является одним из самых драматичных религиозных потрясений в исламской истории. При шахе Исмаиле процесс начался с провозглашения шиитского ислама государственной религией. Суннитским улемам был предоставлен выбор: обращение, изгнание или смерть. Арабские ученые-шииты были привезены из Джебель-Амиля в Ливане, из Бахрейна и южного Ирака, чтобы заполнить теологический вакуум и создать новые учебные заведения.\n\nСефевидское государство теперь стоит перед выбором, как закрепить эту трансформацию. Должны ли мы стремиться к ревностному обеспечению доктринальной чистоты, используя власть государства для обеспечения полного религиозного соответствия? Или нам следует инвестировать в теологическую науку, создавая интеллектуальные основы, которые сделают шиизм двунадесятников самодостаточным благодаря силе его обучения?" #NT!
 nd_ira.3.a: "Обеспечьте чистоту веры." #NT!
 nd_ira.3.b: "Инвестируйте в шиитскую стипендию и обучение." #NT!
 nd_ira.4.t: "Корпус Замбурака" #NT!
 nd_ira.4.d: "На поле боя появилось новое новшество — замбурак — небольшая поворотная пушка, установленная на спине верблюда. Эти мобильные артиллерийские орудия сочетают в себе скорость кавалерии с огневой мощью пушек, что позволяет персидским войскам применять разрушительную огневую мощь в открытых пустынях и равнинах, где обычная артиллерия увязнет.\n\nКорпус замбуракчи оказался решающим в битве при Карнале в 1739 году, когда установленные на верблюдах орудия Надир-шаха разгромили армию Великих Моголов и ее боевых слонов. Корпус действует батареями из десятков или даже сотен верблюдов, создавая мобильную огневую стену, которая может перебрасываться быстрее, чем любая колесная артиллерия. Это персидское нововведение даст нашим армиям уникальное тактическое преимущество на засушливых ландшафтах наших владений." #NT!
 nd_ira.4.a: "Верблюды войны прогремят над нашими врагами." #NT!
 nd_ira.5.t: "Новый порядок: военная реформа" #NT!
 nd_ira.5.d: "Персидские наблюдатели, вернувшиеся из Европы, приносят тревожные сообщения. Армии Франции, Пруссии и России претерпели трансформации, которые сделали их гораздо более эффективными, чем традиционные силы Востока. Регулярные учения, стандартизированное оборудование, профессиональный офицерский корпус и систематическая логистика создали военные машины беспрецедентной эффективности.\n\nВопрос, стоящий перед персидским двором, заключается в том, как на это реагировать. Некоторые утверждают, что Персия должна полностью перенять европейские методы, импортируя инструкторов, закупая современное оружие и реорганизовывая армию по европейскому образцу. Другие настаивают на том, что персидские военные традиции имеют свои сильные стороны (мобильность кавалерии, знание местности и воинственный дух племенных рекрутов) и что реформа должна синтезировать лучшее из обоих миров, а не отказываться от многовекового персидского военного наследия." #NT!
 nd_ira.5.a: "Примите европейские методы и дисциплину." #NT!
 nd_ira.5.b: "Синтезируйте лучшее от Востока и Запада." #NT!
 nd_ira.6.t: "Конституционное пробуждение" #NT!
 nd_ira.6.d: "Среди персидских интеллектуалов, купцов и прогрессивного духовенства возникло замечательное движение. Вдохновленные конституционными изменениями в Европе и реформами Османского Танзимата, они утверждают, что Персия нуждается в фундаментальной трансформации своей системы правления. Они утверждают, что абсолютная власть шаха привела к коррупции, застою и иностранной эксплуатации.\n\nКонституционная революция представляет собой переломный момент в истории Персии, первую современную попытку ограничить королевскую власть посредством писаной конституции и избранного парламента, Меджлиса. Независимо от того, удастся ли это полностью или частично повернуть вспять, это знаменует собой начало взаимодействия Персии с современной политической мыслью и стремлением к правительству, подотчетному своему народу." #NT!
 nd_ira.6.a: "Голос народа будет услышан." #NT!
 STATIC_MODIFIER_NAME_nd_ira_isfahan_glory: "Слава Исфахана" #NT!
 STATIC_MODIFIER_DESC_nd_ira_isfahan_glory: "Архитектурное великолепие Исфахана и покровительство культуре сделали его чудом света." #NT!
 STATIC_MODIFIER_NAME_nd_ira_isfahan_commerce: "Торговля Исфахана" #NT!
 STATIC_MODIFIER_DESC_nd_ira_isfahan_commerce: "Базары и торговые сети Исфахана сделали его торговым центром Ближнего Востока." #NT!
 STATIC_MODIFIER_NAME_nd_ira_shia_zealotry: "Шиитский фанатизм" #NT!
 STATIC_MODIFIER_DESC_nd_ira_shia_zealotry: "Навязанная чистота шиизма-двунадесятника создала глубокое религиозное единство на персидских землях." #NT!
 STATIC_MODIFIER_NAME_nd_ira_shia_scholarship: "Шиитская стипендия" #NT!
 STATIC_MODIFIER_DESC_nd_ira_shia_scholarship: "Инвестиции в теологические колледжи и научные традиции сделали Персию интеллектуальным центром шиитского мира." #NT!
 STATIC_MODIFIER_NAME_nd_ira_european_drill: "Европейские военные учения" #NT!
 STATIC_MODIFIER_DESC_nd_ira_european_drill: "Персидские полки теперь тренируются по европейским методам, с дисциплинированными формированиями и современной тактикой." #NT!
 STATIC_MODIFIER_NAME_nd_ira_persian_synthesis: "Персидский военный синтез" #NT!
 STATIC_MODIFIER_DESC_nd_ira_persian_synthesis: "Лучшее из традиций персидской кавалерии сочетается с избранными современными инновациями." #NT!
 nd_ira_ribat_tradition: "Рибат Традиция" #NT!
 nd_ira_ribat_tradition_desc: "Сеть рибатов, укрепленных перевалочных пунктов на торговых путях Персии, служила одновременно военными гарнизонами и убежищами для путешественников, распространяя персидскую мощь на обширные внутренние территории." #NT!
 nd_ira_qanat_systems: "Канат Ирригация" #NT!
 nd_ira_qanat_systems_desc: "Канат, подземные акведуки, по которым вода доставляется из горных водоносных горизонтов в засушливые низменности, является одним из величайших инженерных достижений Персии, позволяющим вести сельское хозяйство в непригодных для жизни регионах." #NT!
 nd_ira_bazaar_economy: "Базар Экономика" #NT!
 nd_ira_bazaar_economy_desc: "Крытый базар, или bazar-e bozorg, — это экономическое сердце каждого персидского города, обширный лабиринт сводчатых проходов, где гильдии организуют производство, торговцы договариваются о ценах, а вазарбеды наблюдают за коммерческим порядком." #NT!
 nd_ira_persian_diplomacy: "Персидская дипломатическая традиция" #NT!
 nd_ira_persian_diplomacy_desc: "Персидский двор сохранил сложные дипломатические традиции со времен Ахеменидов, используя тщательно продуманный протокол, многоязычных посланников и стратегическое искусство дарения подарков для управления отношениями с соседними империями." #NT!
 nd_ira_keshikchi_guard: "Кешикчи Страж" #NT!
 nd_ira_keshikchi_guard_desc: "Кешикчи, царская кавалерия-телохранитель, унаследованная от Тимуридов и монгольских традиций, образует элитную гвардию всадников, поклявшихся защищать личность государя. Отобранные из лучших воинов благородных семей, они служат одновременно ударной кавалерией и символом королевской власти." #NT!
 nd_ira_caspian_silk: "Каспийская шелковая индустрия" #NT!
 nd_ira_caspian_silk_desc: "В пышных провинциях Гилян и Мазандаран, расположенных вдоль побережья Каспийского моря, производят одни из лучших шелков-сырцов в мире. Шах Аббас централизовал эту отрасль и превратил ее в королевскую монополию, сделав шелк Персии самым ценным экспортным товаром на европейские рынки.\n\n#italic Доступно в: $nd_ira_bazaar$#!" #NT!
 nd_ira_persian_miniatures: "Персидская миниатюрная живопись" #NT!
 nd_ira_persian_miniatures_desc: "Традиция персидской миниатюры, усовершенствованная такими мастерами, как Бихзад, сочетает в себе изысканные детали и яркие цвета, иллюстрируя великие произведения персидской литературы. Придворные мастерские в Тебризе, Казвине и Исфахане производят иллюминированные рукописи, которые ценятся от Константинополя до Дели." #NT!
 nd_ira_royal_court_culture: "Культура Королевского двора" #NT!
 nd_ira_royal_court_culture_desc: "Персидский королевский двор уже давно стал центром космополитической культуры, где под покровительством шаха собираются поэты, музыканты, художники и ученые со всего исламского мира. Эта традиция культурной открытости позволяет Персии впитывать и синтезировать различные влияния." #NT!
 nd_ira_caravanserai_network: "Сеть Караван-сараев" #NT!
 nd_ira_caravanserai_network_desc: "Шах Аббас приказал регулярно строить караван-сараи вдоль всех основных торговых путей, укрепленные гостиницы, предлагающие купцам бесплатное жилье, конюшни и охрану. Эта масштабная инфраструктурная программа превратила Персию в самую гостеприимную страну для сухопутной торговли на всем Ближнем Востоке." #NT!
 nd_ira_chapar_riders: "Чапар Райдерс" #NT!
 nd_ira_chapar_riders_desc: "Система чапаров, сеть конных курьеров, обслуживающих ретрансляционные станции по всей империи, берет свое начало от знаменитой почтовой службы «Королевской дороги» империи Ахеменидов. Эти быстрые наездники несут донесения, разведданные и королевские приказы на огромные расстояния с поразительной скоростью." #NT!
 nd_ira_royal_workshops: "Королевские мастерские" #NT!
 nd_ira_royal_workshops_desc: "Кархане, королевские мастерские при дворе, производят предметы роскоши исключительного качества. Под патронажем Сефевидов в этих мастерских в Исфахане работают сотни мастеров, занимающихся ткачеством шелка, плетением ковров, металлообработкой и керамикой, причем их продукция предназначена как для внутреннего потребления, так и на экспорт.\n\n#italic Доступно в: $nd_ira_karkhane$#!" #NT!
 nd_ira_haft_rang_tilework: "Плитка Хафт Ранг" #NT!
 nd_ira_haft_rang_tilework_desc: "Техника полукольцевой (семицветной) плитки позволяет персидским мастерам создавать потрясающие полихроматические фасады, которые украшают мечети, дворцы и медресе по всему Ирану. Замысловатые геометрические и цветочные узоры персидской плитки представляют собой одно из высших достижений исламского декоративного искусства.\n\n#italic Доступно в: $nd_ira_bazaar$#!" #NT!
 nd_ira_divan_governance: "Диван Управление" #NT!
 nd_ira_divan_governance_desc: "Персидский диван, царский совет министров, является административной основой империи. Великий визирь, губернаторы провинций и специализированные чиновники управляют налогами, правосудием и корреспонденцией посредством сложной бюрократической традиции, отточенной веками." #NT!
 nd_ira_carpet_tradition: "Традиция персидского ковра" #NT!
 nd_ira_carpet_tradition_desc: "При Сефевидах ковроткачество превратилось из кустарного промысла в изобразительное искусство. Придворные мануфактуры в Тебризе, Исфахане и Кашане производят ковры легендарного качества, используя технологии, передаваемые из поколения в поколение, с характерными региональными узорами, признанными во всем мире.\n\n#italic Доступно в: $nd_ira_bazaar$#!" #NT!
 nd_ira_zamburak_corps: "Корпус Замбурака" #NT!
 nd_ira_zamburak_corps_desc: "Замбурак, поворотное орудие, установленное на спине верблюда, дает персидской армии мобильную артиллерию, подходящую для пустынь и равнин Иранского нагорья. Впервые широко использованный Надир-шахом, корпус замбуракчи доказал свою разрушительную эффективность в битве при Карнале." #NT!
 nd_ira_theological_colleges: "Теологические колледжи" #NT!
 nd_ira_theological_colleges_desc: "Государство Сефевидов вложило значительные средства в медресе, посвященные шиитской теологии двунадесятников, импортируя ученых из Ливана, Бахрейна и Ирака для создания новой религиозной интеллигенции. Эти институты стали интеллектуальной основой шиитского ислама в Персии." #NT!
 nd_ira_isfahan_nesf_jahan: "Исфахан Несф-э Джахан" #NT!
 nd_ira_isfahan_nesf_jahan_desc: "Исфахан Несф-е Джахан, Исфахан – это полмира. При шахе Аббасе столица была преобразована благодаря великолепной площади Накш-э-Джахан, мечети Шаха, дворцу Али Капу и проспекту Чахар Баг, создав один из самых красивых городов на земле." #NT!
 nd_ira_tuyul_system: "Система предоставления земли Туюл" #NT!
 nd_ira_tuyul_system_desc: "Система туул распределяет доходы от коронной земли военачальникам и чиновникам вместо зарплаты. Такая договоренность обеспечивает лояльность провинциальной элиты, позволяя центральному правительству извлекать доходы без большой гражданской бюрократии." #NT!
 nd_ira_shia_conversion_policy: "Политика шиитского преобразования" #NT!
 nd_ira_shia_conversion_policy_desc: "Преобразование Сефевидов Персии из преимущественно суннитской страны в центр шиизма двунадесятников является одним из самых драматических религиозных изменений в исламской истории. Обращение в веру, спонсируемое государством, импорт шиитских ученых и создание религиозных институтов создали прочную национальную идентичность." #NT!
 nd_ira_shahsavan_tribes: "Племенная конфедерация Шахсаван" #NT!
 nd_ira_shahsavan_tribes_desc: "Шахсаваны, буквально «те, кто любит шаха», представляют собой племенную конфедерацию, организованную шахом Аббасом, чтобы уравновесить власть кызылбашской аристократии. Верные непосредственно трону, они предоставляют надежную кавалерию, которая служит сдерживающим фактором для могущественных вождей племен." #NT!
 nd_ira_imperial_post: "Императорская почтовая система" #NT!
 nd_ira_imperial_post_desc: "Почтовая ретрансляционная система Чапар-Хане поддерживает сеть станций по всей империи, каждая из которых оснащена свежими лошадьми и всадниками. Эта система, произошедшая от ахеменидского ангариона, позволяет царскому командованию и разведывательной информации путешествовать с одного конца Персии на другой за считанные дни." #NT!
 nd_ira_persian_gulf_fleet: "Флот Персидского залива" #NT!
 nd_ira_persian_gulf_fleet_desc: "Военно-морская программа Афшаридов, инициированная Надир-шахом, предусматривала создание персидского флота, базирующегося в Бушире в Персидском заливе. Хотя Персия традиционно была сухопутной державой, флот Персидского залива проецирует мощь на жизненно важных морских торговых путях и бросает вызов доминированию европейских военно-морских эскадрилий." #NT!
 nd_ira_nastaliq_calligraphy: "Насталик Каллиграфия" #NT!
 nd_ira_nastaliq_calligraphy_desc: "Письмо насталик, разработанное в Персии как элегантный курсив, стало определяющей каллиграфической традицией персоязычного мира. Его плавные изгибы и изящные пропорции украшают рукописи, надписи и административные документы, воплощая персидский эстетический идеал." #NT!
 nd_ira_maragheh_observatory: "Традиция обсерватории Мараге" #NT!
 nd_ira_maragheh_observatory_desc: "Обсерватория Мараге, основанная при Ильханидах Насир ад-Дином Туси, установила в Персии научную традицию, которая сохранялась на протяжении веков. Персидские астрономы и математики продолжали вносить вклад в наблюдательную астрономию, оптику и алгебру еще долгое время после того, как сама обсерватория пришла в упадок." #NT!
 nd_ira_nizam_jadid_reform: "Реформа Низам-и Джадида" #NT!
 nd_ira_nizam_jadid_reform_desc: "Под влиянием военных успехов европейских держав персидские реформаторы выступают за «Новый порядок», реорганизовывая армию по европейскому образцу с использованием профессиональных офицеров, регулярных тренировок, стандартизированного оборудования и современной тактики." #NT!
 nd_ira_qajar_modernization: "Каджарская модернизация" #NT!
 nd_ira_qajar_modernization_desc: "Политехнический институт Дар уль-Фунун, основанный в Тегеране в 1851 году, был первым современным высшим учебным заведением в Персии. Здесь преподавали европейские языки, медицину, инженерное дело и военное дело, готовя новое поколение персидских специалистов, которые будут способствовать модернизации страны." #NT!
 nd_ira_constitutional_movement: "Конституционное движение" #NT!
 nd_ira_constitutional_movement_desc: "Персидская конституционная революция представляет собой стремление к современному управлению, писаной конституции, избранному парламенту (меджлису) и верховенству закона. Это движение получило поддержку со стороны интеллектуалов, купцов и прогрессивного духовенства, которые стремились ограничить королевский абсолютизм." #NT!
 nd_ira_persian_trade_reform: "Персидская торговая реформа" #NT!
 nd_ira_persian_trade_reform_desc: "Модернизация персидской торговли (включая создание таможен, стандартизацию мер и весов, а также современное банковское дело) открывает экономику для международной торговли, одновременно защищая отечественных производителей от иностранной эксплуатации." #NT!
 a_nd_ira_keshikchi: "Кешикчи Страж" #NT!
 a_nd_ira_keshikchi_desc: "Элитная королевская кавалерия-телохранитель происходила из традиции тимуридских кешиков и поклялась защищать личность шаха." #NT!
 a_nd_ira_chapar: "Чапар Райдер" #NT!
 a_nd_ira_chapar_desc: "Стремительные конные курьеры персидской почтовой системы, прошедшие подготовку в качестве рейдеров легкой кавалерии, когда их призывали на войну." #NT!
 a_nd_ira_zamburak: "Замбурак" #NT!
 a_nd_ira_zamburak_desc: "Установленные на верблюдах поворотные орудия доставляют мобильную артиллерию в пустыни и равнины Иранского нагорья." #NT!
 a_nd_ira_zamburak_levy: "Замбурак Леви" #NT!
 a_nd_ira_zamburak_levy_desc: "Племенные рекруты, оснащенные верблюжьими поворотными ружьями, собранные у кочевых народов засушливых внутренних районов Персии." #NT!
 a_nd_ira_shahsavan: "Шахсаванская кавалерия" #NT!
 a_nd_ira_shahsavan_desc: "Племенная конница из конфедерации Шахсаван, организованная как противовес власти Кызылбаша и лояльная непосредственно шаху." #NT!
 a_nd_ira_nizam_jadid: "Низам-и Джадид Страж" #NT!
 a_nd_ira_nizam_jadid_desc: "Реформированная персидская пехота, обученная европейским строевым упражнениям и тактике, оснащенная современным огнестрельным оружием и штыками." #NT!
 n_nd_ira_gulf_galley: "Галера Персидского залива" #NT!
 n_nd_ira_gulf_galley_desc: "Быстроходные галеры военно-морской программы «Афшарид», предназначенные для мелководья и сильных течений Персидского залива." #NT!
 nd_ira_ribat: "Рибат" #NT!
 nd_ira_ribat_desc: "Укрепленная перевалочная станция на персидских торговых путях, служившая одновременно военным гарнизоном и убежищем для караванов." #NT!
 nd_ira_ribat_upkeep: "Рибатский гарнизон" #NT!
 nd_ira_ribat_upkeep_desc: "Для содержания гарнизона и провианта рибата требуется камень для ремонта, древесина для укреплений и скот для солдат." #NT!
 nd_ira_bazaar: "Базар-э Бозорг" #NT!
 nd_ira_bazaar_desc: "Большой крытый базар, обширный лабиринт сводчатых проходов, где гильдии, купцы и ремесленники ведут коммерческую жизнь города." #NT!
 nd_ira_bazaar_maintenance: "Базарные операции" #NT!
 nd_ira_bazaar_maintenance_desc: "Для повседневной работы базара необходимы ткани для торговцев тканями, керамика для мастеров и бумага для коммерческих отчетов торговцев." #NT!
 nd_ira_caravanserai: "Караван-сарай" #NT!
 nd_ira_caravanserai_desc: "Укрепленная придорожная гостиница, предлагающая купцам бесплатное жилье и охрану, построенная по заказу шаха для поощрения торговли по всей империи." #NT!
 nd_ira_caravanserai_upkeep: "Обслуживание Караван-сарая" #NT!
 nd_ira_caravanserai_upkeep_desc: "Для содержания караван-сарая требуется камень для ремонта, пиломатериалы для ларьков и кровли, а также скот, чтобы кормить постоянный поток путешественников." #NT!
 nd_ira_karkhane: "Кархане" #NT!
 nd_ira_karkhane_desc: "Королевская мастерская по производству предметов роскоши (шелковые ткани, изысканные ковры и декоративная керамика) под прямым патронажем шаха." #NT!
 nd_ira_karkhane_maintenance: "Операции Королевской мастерской" #NT!
 nd_ira_karkhane_maintenance_desc: "Кархане ткут из сырого каспийского шелка с персидскими красками прекрасные ткани, приносящие двору славу и богатство." #NT!
 nd_ira_madrasa: "Медресе-йи Султани" #NT!
 nd_ira_madrasa_desc: "Королевский теологический колледж, готовящий шиитских ученых и юристов, укрепляющий религиозные основы Персидского государства." #NT!
 nd_ira_madrasa_upkeep: "Операции медресе" #NT!
 nd_ira_madrasa_upkeep_desc: "Медресе требуются бумага и книги для поддержки своей научной деятельности, а также благовония для ритуальной жизни учеников и духовенства." #NT!
 nd_ira_chapar_khaneh: "Чапар-Хане" #NT!
 nd_ira_chapar_khaneh_desc: "Имперская почтовая ретрансляционная станция, оснащенная свежими лошадьми и всадниками, обеспечивающая связь по всей огромной Персидской империи." #NT!
 nd_ira_chapar_khaneh_upkeep: "Операции ретрансляционной станции" #NT!
 nd_ira_chapar_khaneh_upkeep_desc: "Ретрансляционной станции требуются лошади и фураж для курьеров, а также пиломатериалы для содержания конюшен и хозяйственных построек поста." #NT!
 nd_ira_dar_ul_funun: "Дар уль-Фунун" #NT!
 nd_ira_dar_ul_funun_desc: "Современный политехнический институт, преподающий европейские науки, языки и военное искусство, авангард персидской модернизации." #NT!
 nd_ira_dar_ul_funun_upkeep: "Деятельность института" #NT!
 nd_ira_dar_ul_funun_upkeep_desc: "Политехническому институту необходимы бумага и книги для обучения современным наукам, а также стеклянные инструменты для лабораторий медицины, химии и натуральной философии." #NT!
 nd_ira_carpet_weaving: "Персидское ковроткачество" #NT!
 nd_ira_carpet_weaving_desc: "Традиционные персидские методы плетения ковров с использованием тонкой шерсти, натуральных красителей и волокон шерсти животных позволяют создавать ковры, известные во всем мире." #NT!
 nd_ira_silk_processing: "Каспийская обработка шелка" #NT!
 nd_ira_silk_processing_desc: "Обработка и отделка сырого каспийского шелка в роскошные ткани с использованием персидских технологий крашения, ткачества и ароматизации." #NT!
 nd_ira_tile_glazing: "Персидская плитка" #NT!
 nd_ira_tile_glazing_desc: "Техника керамической глазури рукояти (семицветная) обжигает необработанную глину с минеральными красками, создавая потрясающую полихромную плитку, которая украшает персидскую архитектуру." #NT!
 nd_ira_qanat_maintenance: "Канат Техническое обслуживание" #NT!
 nd_ira_qanat_maintenance_desc: "Обслуживание подземных каналов канала требует постоянных ремонтных работ с использованием камня, деревянных опор и железных инструментов для очистки от отложений и укрепления стен туннелей." #NT!
 levy_nd_ira_shahsavan: "Племенной сбор Шахсавана" #NT!
 levy_nd_ira_shahsavan_desc: "Кавалерия, набранная из племенной конфедерации Шахсаван, свирепые всадники, верные шаху." #NT!
 levy_nd_ira_zamburak: "Замбурак Леви" #NT!
 levy_nd_ira_zamburak_desc: "Верблюжья артиллерия, набранная у кочевых народов внутренней Персии, владеющих навыками мобильной войны." #NT!
 levy_nd_ira_keshikchi: "Кешикчи Страж Леви" #NT!
 levy_nd_ira_keshikchi_desc: "Элитная кавалерия-телохранитель, набранная из знатных семей персидского двора." #NT!
 nd_ira_formed_tt: "была образована Персия." #NT!
 nd_ira_path_a_tt: "Избрал Шаханшаха: Царя королей" #NT!
 nd_ira_path_b_tt: "Выбрал Исфахан Несф-э Джахан" #NT!
 nd_ira_path_c_tt: "Выбрали Хранителя шиитской веры" #NT!
 nd_ira_destiny: "Судьба Персии" #NT!
 nd_ira_destiny_desc: "Персия восстала. Трон шаха управляет обширными владениями от Загроса до Гиндукуша. Теперь необходимо сформировать характер этой империи: через завоевания или через цивилизацию." #NT!
 nd_ira_dest_shahanshah: "Поездки Шаханшаха" #NT!
 nd_ira_dest_shahanshah_desc: "Верните земли древних империй. Возьмите Багдад, резиденцию Аббасидского халифата, и Самарканд, жемчужину Мавераннахра. Царь царей требует власти над всеми землями между Тигром и Оксом." #NT!
 nd_ira_dest_iran_zamin: "Мастер Ирана-Замин" #NT!
 nd_ira_dest_iran_zamin_desc: "Распространите персидскую гегемонию от Дамаска на западе до Кавказа на севере. Приказ шаханшаха должен распространяться как на Плодородный полумесяц, так и на земли Ширваншаха." #NT!
 nd_ira_dest_cyrus_reborn: "Империя Кира возрождается" #NT!
 nd_ira_dest_cyrus_reborn_desc: "Осуществите главную персидскую амбицию: создать империю, простирающуюся от Константинополя до Дели, превосходящую даже Ахеменидов. Постройте Ападану как памятник этому достижению: тронный зал, куда приходят посланники всех стран, чтобы отдать дань уважения." #NT!
 nd_ira_dest_silk_road: "Мастерство Шелкового пути" #NT!
 nd_ira_dest_silk_road_desc: "Сделать Персию торговым центром Шелкового пути. Обеспечить потоки шелка через рынки капитала и наполнить казну богатством торговли между Востоком и Западом." #NT!
 nd_ira_dest_institutional: "Институциональный авангард" #NT!
 nd_ira_dest_institutional_desc: "Возглавьте исламский мир в институциональном развитии. Освойте современное банковское дело и постройте развитое царство, которое станет маяком персидской цивилизации." #NT!
 nd_ira_dest_nesf_jahan: "Исфахан Несф-э Джахан" #NT!
 nd_ira_dest_nesf_jahan_desc: "Исфахан – это полмира. Охватите глобальную торговлю, привлеките драгоценные камни на рынки капитала и постройте великолепную площадь Накш-э-Джахан, памятник, провозглашающий персидское великолепие каждому уголку земли." #NT!
 nd_ira.7.t: "Судьба Персии" #NT!
 nd_ira.7.d: "Корона Персии завоевана, и древние земли шахов снова объединены под единым правителем. От заснеженных вершин Загроса до раскаленных солнцем берегов Персидского залива — разные народы Ирана подчиняются одному трону.\n\nНо объединение — это только начало. Великие империи Персии (Ахемениды, Сасаниды, Сефевиды) не довольствовались простым управлением плато. Каждый стремился оставить неизгладимый след в мире, будь то посредством завоеваний, торговли или культуры.\n\nКакая судьба ждёт эту новую Персидскую империю?" #NT!
 nd_ira.7.a: "Наша судьба будет написана на звездах." #NT!
 nd_ira.8.t: "Поездки Шаханшаха" #NT!
 nd_ira.8.d: "Багдад пал под персидским оружием, а древние города Трансоксианы признают суверенитет шаханшаха. От берегов Тигра до садов Самарканда, земли, которые когда-то составляли сердце исламского мира, теперь склоняются перед персидской короной.\n\nЗавоевание Багдада имеет огромное символическое значение: город халифов, резиденция Дома Мудрости, теперь развевается под знаменем Персии. А вместе с Самаркандом могила самого Тимура находится в руках персов. Шаханшах объявил миру, что эпоха Персидской империи вернулась." #NT!
 nd_ira.8.a: "Царь царей сказал свое слово." #NT!
 nd_ira.9.t: "Мастер Ирана-Замин" #NT!
 nd_ira.9.d: "Границы персидского могущества расширились далеко за пределы Иранского нагорья. Дамаск, один из старейших постоянно населенных городов на земле, признает сюзеренитет Персии. Нефтяные пожары Баку на берегу Каспийского моря освещают новую границу персидского влияния на Кавказе.\n\nШаханшах теперь командует царством, напоминающим по размерам империю Сасанидов в ее величайших временах. Вопрос, стоящий перед судом, заключается в том, как воспользоваться этим преимуществом. Некоторые генералы призывают к агрессивной позиции: гнев Шаханшаха должны ощутить все, кто сопротивляется. Другие советуют восстановить древнюю систему сатрапии, связывая завоеванные земли посредством управления, а не террора." #NT!
 nd_ira.9.a: "Пусть наши враги трепещут перед нами." #NT!
 nd_ira.9.b: "Восстановите мудрость сатрапов." #NT!
 nd_ira.10.t: "Империя Кира возрождается" #NT!
 nd_ira.10.d: "Это сделано. Персидские знамена развеваются над Константинополем, этой древней жемчужиной империй, и над Дели, воротами к богатствам Индии. Шаханшах теперь правит владениями, превосходящими даже мечты Кира Великого: от Босфора до Ганга, от Кавказа до Персидского залива.\n\nЭто не просто военное достижение, но и цивилизационное заявление. Строительство Ападаны (большого зала для аудиенций по образцу древнего Персеполя) послужит тронным залом этой возрожденной империи. Здесь послы всех стран предстанут перед Царем царей.\n\nНо как управлять этой огромной империей? Через железную дисциплину бессмертной военной машины? Или с помощью искусства дипломатии, принуждающего различные народы к добровольной преданности?" #NT!
 nd_ira.10.a: "Мы — Бессмертная Империя, вечная и нерушимая." #NT!
 nd_ira.10.b: "Мы — Царь Наций, отец всех народов." #NT!
 nd_ira.11.t: "Мастерство Шелкового пути" #NT!
 nd_ira.11.d: "Караваны, пересекающие Иранское нагорье, везут лучший в мире шелк: персидский шелк, обработанный и отделанный мастерами Исфахана и Кермана. Европейские купцы яростно конкурируют за доступ к персидским рынкам, в то время как с востока китайский фарфор и индийские специи текут через караван-сараи, усеивающие Шелковый путь.\n\nПерсия находится на перекрестке мира, и шахи блестяще воспользовались этим положением. Королевская шелковая монополия направляет огромные богатства в казну, в то время как базары больших городов кипят от торговли народов. Это фундамент, на котором будет построена империя другого типа: не завоевания, а торговли." #NT!
 nd_ira.11.a: "Богатства мира текут через Персию." #NT!
 nd_ira.12.t: "Институциональный авангард" #NT!
 nd_ira.12.d: "Персия восприняла институты современного мира не как последователь, а как лидер. Банковские дома Исфахана конкурируют с банкирскими домами Венеции и Амстердама, а персидские ученые и администраторы адаптировали новые идеи для удовлетворения потребностей древней цивилизации.\n\nЭта институциональная сложность дает Персии огромное преимущество перед ее соседями. Вопрос в том, как его развернуть. Шах Аббас, как известно, сохранял королевскую монополию в ключевых отраслях промышленности, направляя свои прибыли непосредственно короне. Но другие утверждают, что освобождение базаров от королевского контроля высвободит еще большую коммерческую энергию, превратив каждого торговца в двигатель персидского процветания." #NT!
 nd_ira.12.a: "Корона будет удерживать монополии." #NT!
 nd_ira.12.b: "Освободите базары для безграничной торговли." #NT!
 nd_ira.13.t: "Исфахан Несф-э Джахан" #NT!
 nd_ira.13.d: "Исфахан – это полмира. Старая персидская пословица стала буквальной истиной. Площадь Накш-э-Джахан («Образ мира») стоит полностью, это одно из самых больших и красивых общественных мест, когда-либо построенных. Бирюзовый купол мечети Шаха отражает свет рассвета. Дворец Али Капу наблюдает за коммерческой суетой внизу. Базар-э-Бозорг тянется на километры по сводчатым коридорам, где купцы из пятидесяти стран торгуют товарами со всех уголков земли.\n\nИностранцы, посещающие его, теряют дар речи. Это не просто город, а памятник тому, чего персидская цивилизация может достичь посредством торговли и культуры, а не завоеваний. Станет ли Исфахан чудом, вдохновляющим на века? Или же она станет центром глобальной торговой сети, которая сделает Персию незаменимым перекрестком мира?" #NT!
 nd_ira.13.a: "Пусть чудо Исфахана вдохновит вечность." #NT!
 nd_ira.13.b: "Пусть Исфахан станет перекрестком всей торговли." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_wrath_of_shahanshah: "Гнев Шаханшаха" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_wrath_of_shahanshah: "О ярости Шаханшаха ходят легенды. Врагам, которые сопротивляются, грозит жестокая осада и полное подчинение, в результате чего цена неповиновения превышает возможности любого врага." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_satrapy_system: "Восстановленная система сатрапии" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_satrapy_system: "Древняя персидская система управления провинциями через сатрапии была восстановлена, что позволило эффективно аннексировать и интегрировать завоеванные территории." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_immortal_empire: "Бессмертная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_immortal_empire: "Подобно десяти тысячам бессмертных Ахеменидов, эта империя выживает благодаря железной дисциплине и неустанному расширению, ее неутомимым армиям и обширной разведывательной сети." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_king_of_nations: "Король Наций" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_king_of_nations: "Шаханшах правит не только посредством страха, но и посредством искусства управления, связывая различные народы паутиной дипломатии, предлагая мир желающим и быстрое восстановление опустошенным." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_royal_monopolies: "Королевские монополии" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_royal_monopolies: "Шах сохраняет монополию на ключевые отрасли промышленности, направляя коммерческие прибыли непосредственно короне и финансируя меркантилистское государство, хотя военная готовность страдает из-за сосредоточения внимания на торговле." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_free_bazaars: "Бесплатные базары" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_free_bazaars: "Базары Персии торгуют свободно, без вмешательства королевской власти, привлекая торговцев со всего мира и укрепляя дипломатические связи посредством открытой торговли." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_wonder_of_the_world: "Чудо света" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_wonder_of_the_world: "Архитектурные и культурные достижения Исфахана сделали его чудом света, подталкивая Персию к инновациям и концентрируя лучшие таланты в столице." #NT!
 STATIC_MODIFIER_NAME_nd_ira_dest_crossroads_of_trade: "Перекресток торговли" #NT!
 STATIC_MODIFIER_DESC_nd_ira_dest_crossroads_of_trade: "Положение Персии на пересечении морских и сухопутных торговых путей было полностью реализовано: флот Персидского залива обеспечивает торговлю, а политика, ориентированная на внешний мир, привлекает весь мир." #NT!
 nd_ira_apadana: "Ападана" #NT!
 nd_ira_apadana_desc: "Большой императорский зал для аудиенций, вдохновленный древней Ападаной в Персеполе, где послы всех подчиненных наций приносят дань перед троном шаханшаха." #NT!
 nd_ira_apadana_upkeep: "Операции Императорского двора" #NT!
 nd_ira_apadana_upkeep_desc: "Для поддержания величия императорского двора необходим прекрасный камень для колонного зала, шелковые ткани для тронного зала, мебель для приема высокопоставленных лиц и бумага для обширной административной корреспонденции империи." #NT!
 nd_ira_naqsh_e_jahan: "Площадь Накш-э Джахан" #NT!
 nd_ira_naqsh_e_jahan_desc: "Образ мира: монументальная общественная площадь и торговый центр в самом сердце Исфахана, объединяющий мечеть Шаха, дворец Али Капу и вход на Большой базар." #NT!
 nd_ira_naqsh_e_jahan_upkeep: "Квадратные операции" #NT!
 nd_ira_naqsh_e_jahan_upkeep_desc: "Повседневная торговля и церемониальная жизнь площади Накш-э-Джахан требуют прекрасного текстиля для торговцев, керамики для базарных прилавков, бумаги для коммерческих отчетов и драгоценных камней для ювелиров, привлекающих богатых покровителей со всего мира." #NT!
  
  
  # ===== BUREAUCRACIES ===== 
 ira_divan_i_ala_bureaucracy: "Диван-и-Ала" #NT!
 ira_divan_i_ala_bureaucracy_desc: "Высшая канцелярия королевства, возглавляемая Вазир-и-Азамом (Великим визирем) при шахе Тахмаспе и доведенная до своей классической формы шахом Аббасом I после его переноса столицы в Исфахан в 1598 году. Диван-и-Ала руководит финансовыми, армейскими, религиозными пожертвованиями и королевским домом, при этом Великий визирь каждое утро заслушивает петиции и подписывает указы при королевском дворе. тугра. Способный визирь (Мирза Салман, Итимад ад-Даула) может сделать правление молодым шахом; пустой визирь приводит к вражде между министерствами и неполучению доходов. Канцелярия существует для того, чтобы связать диванов в единый трон, поэтому умара оймаков ее ненавидят." #NT!
 ira_sadr_us_sudur_bureaucracy: "Садр-ус-Судур" #NT!
 ira_sadr_us_sudur_bureaucracy_desc: "Главный садр королевства, высший пост шиитского духовенства-двунадесятника, официально оформленный шахом Исмаилом I после того, как в 1501 году он провозгласил шиизм-двунадесятник государственной религией и разделенный шахом Тахмаспом на Садр-и-Хасса (контролирующий пожертвования королевских владений) и Садр-и-Мамалик (контролирующий пожертвования всего королевства). Садр контролирует вакуфы, которые финансируют медресе Наджафа, Кербелы и Исфахана, назначает шейхов аль-ислама в крупных городах и наблюдает за длительным преобразованием населения, в основном суннитского, в 1501 году в центр Двенадцати, которым оно стало к 1700 году. Исфахан афганцам в 1722 году." #NT!
 ira_ghulam_corps_bureaucracy: "Домашний корпус Гулама" #NT!
 ira_ghulam_corps_bureaucracy_desc: "Постоянная армия королевских рабов шаха Аббаса I, созданная около 1599 года с обращением и набором кавказских христианских мальчиков (грузин, армян, черкесов), захваченных или принесенных данью из-за пределов Кавказа, воспитанных во дворце и назначавших должности и доходы туйулов в качестве личного хозяйства шаха. Созданный по образцу османского девширме и мамлюкской икты, корпус гуламов впервые уступает трону группу офицеров и губернаторов, которые ничем не обязаны туркменским вождям оймаков и всем падшаху. После смерти шаха Аббаса в 1629 году гуламы стали управлять великими губернаторами Фарса, Азербайджана и Хорасана; Курчи-баши противостоит Куллар-агаси, который командует корпусом рабов в полевых условиях." #NT!
 ira_qizilbash_uymaq_bureaucracy: "Кызылбаш Уймак Конфедерация" #NT!
 ira_qizilbash_uymaq_bureaucracy_desc: "Семь (позже девять) тюркских племен (Шамлу, Устаджлу, Таккалу, Румлу, Афшар, Каджар, Зулькадр и другие), чья конница возвела шаха Исмаила на трон в Шаруре в 1501 году и выиграла длительные кампании против узбеков в Бухаре и османов в Хое. Кызылбаши, «рыжие» из-за их двенадцатиплиссированного таджа шиитской преданности, обеспечивали важные государственные должности (командир телохранителей Курчи-баши, королевский наставник лала, региональные беглербеги) в начале века Сефевидов, а великая гражданская война 1576-1590 годов между фракциями Устаджлу и Шамлу почти разрушила династию. Шах Аббас I создает корпус гуламов именно для того, чтобы избежать этой зависимости; этот институт остается мощным военным резервом, но ценой постоянного расширения прав и возможностей вождей оймаков." #NT!
 ira_tofangchi_corps_bureaucracy: "Мушкетный корпус Тофангчи" #NT!
 ira_tofangchi_corps_bureaucracy_desc: "Постоянная мушкетерская пехота, созданная шахом Аббасом I в рамках его военной реформы после 1590 года, набиралась в основном из персоязычного крестьянства центрального плато, а не из туркменских племен. Обученные Робертом Шерли и английскими советниками, прибывшими в Казвин в 1598 году, тофангчи являются тронным ответом янычарской мушкетной линии, которая кровопролитием Сефевидов в Чалдыране в 1514 году, и они объединяются с новым корпусом тупчи (артиллерийским) для того, чтобы дать Персии пороховую армию, независимую от кавалерийской конфедерации. На момент смерти Аббаса число тофангчи составляло примерно двенадцать тысяч; Вербовка из деревни есть цена, которую платит крестьянство." #NT!
 ira_mostowfi_bureaucracy: "Мостоуфи-ул-Мамалик" #NT!
 ira_mostowfi_bureaucracy_desc: "Главный бухгалтер королевства, глава Диван-и-Мостовфи, который ведет реестры всех заданий икта и туйул, проверяет подчиненные ему провинциальные мостовфи и представляет годовой бюджет (дастур аль-амаль) шаху и великому визирю. Офис прослеживает свою историю через практику буидов и сельджуков до государства Сефевидов, где реорганизация Мирзы Салмана Джабери в 1570-х годах стандартизировала реестры; При Каджар-шахах Мирза Ака Хан Нури и Амир Кабир каждый используют свой офис, чтобы попытаться провести финансовую реформу против уделов принцев. Действующая мостовфия не позволяет офицерам получать зарплату из деревень, уже закрепленных за другой, что является главной патологией любого иранского финансового режима." #NT!
 ira_mamalik_i_mahrusa_bureaucracy: "Мамалик-и-Махруса" #NT!
 ira_mamalik_i_mahrusa_bureaucracy_desc: "Система уделов «Охраняемых владений» династии Каджаров, согласно которой взрослые сыновья и братья шаха назначаются генерал-губернаторами великих провинций (Аббас Мирза в Тебризе над Азербайджаном, Мохаммед Али Мирза в Керманшахе, Хосейн Али Мирза Фарманфарма в Ширазе над Фарсом), каждый из которых управляет судом, взимает налоги, формирует полки и подписывает договоры с иностранными посланниками в качестве субмонарх под престолом Тегерана. Система расширяет сферу влияния Каджара на территорию, где нет работающей почтовой службы или оплачиваемой бюрократии, но княжеские дворы управляют собственными армиями, заключают собственные займы с российскими и британскими агентами и часто воюют друг с другом после смерти шаха. Преемственность власти в 1834 году, потребовавшая британского вмешательства для назначения Мухаммад-шаха на престол, была естественным продуктом системы." #NT!
  
 AUTO_MODIFIER_NAME_nd_ira_bureaucracy_authority: "Диваны возвышенного состояния" #NT!
 AUTO_MODIFIER_DESC_nd_ira_bureaucracy_authority: "Шаханшах Ирана командует многоуровневым аппаратом диванов, садров и мостовфисов, усовершенствованным от сефевидской реформы шаха Аббаса до удела Каджаров. Трон может учредить до трех великих персидских бюрократий в дополнение к тем, кто проживает в столице империи, выбирая, чья рука будет управлять царством: канцелярия, корпус рабов, оймак или князья." #NT!
