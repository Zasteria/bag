l_russian:
 nd_ayu_water_defenses: "Оборона островного рва" #NT!
 nd_ayu_water_defenses_desc: "Аютия расположена в месте слияния трех рек: Чао Прайя, Па Сак и Лопбури, на искусственном острове, созданном в результате рытья каналов, соединяющих эти водные пути. Эта сеть рвов и каналов делает город практически неуязвимым для обычной осады." #NT!
 nd_ayu_khmer_inheritance: "Кхмерское наследство" #NT!
 nd_ayu_khmer_inheritance_desc: "Основатели Аюттхая впитали административные традиции приходящей в упадок Кхмерской империи, переняв ее придворные ритуалы, титулы, происходящие от санскрита, и иерархическую бюрократию. Представление о царе как о Деварадже, божественном воплощении, правящем из космического центра, придает суверенитету Аюттхаи трансцендентную власть." #NT!
 nd_ayu_river_patrol: "Флотилия Чао Прайя" #NT!
 nd_ayu_river_patrol_desc: "Контроль над рекой Чао Прайя является жизненно важным для Аюттхая. Боевые катера патрулируют водные пути, перехватывают рейдеров и сопровождают торговые суда по артериальной речной системе королевства." #NT!
 nd_ayu_dharmaraja: "Традиция Дхармараджи" #NT!
 nd_ayu_dharmaraja_desc: "Король Раматхибоди I объявил буддизм Тхеравады официальной религией Аюттхая в 1360 году и привез монахов с Цейлона для установления новых орденов. Традиция Дхармараджи сочетает буддийское царствование с брахманскими ритуалами, делая правителя одновременно защитником веры и живым воплощением праведного закона." #NT!
 nd_ayu_phrai_foundations: "Пхрай Призыв" #NT!
 nd_ayu_phrai_foundations_desc: "Каждый свободный человек в Аюттхае регистрируется как фрай, подданный, обязанный выполнять барщину для короны в течение полугода. Эта система, управляемая местными повелителями наи, дает королю обширный резерв рабочей силы для общественных работ, военных кампаний и проектов государственного строительства." #NT!
 nd_ayu_entrepot: "Космополитен Энтрепо" #NT!
 nd_ayu_entrepot_desc: "Расположение Аюттхая на пересечении морских торговых путей между Китаем, Индией и островами специй привлекает торговцев со всей Азии. Иностранные общины (китайские, индийские, персидские и позднее европейские) основывают свои кварталы за пределами городских стен, каждый из которых управляется своим главой, но вносит свой вклад в казну королевства." #NT!
 nd_ayu_nihonmachi: "Квартал Нихонмати" #NT!
 nd_ayu_nihonmachi_desc: "Японские христиане и ронины, спасающиеся от преследований Токугавы, основали процветающий квартал на восточном берегу Чао Прайя. На пике своего развития в 1620-х годах в Нихонмати проживало более 1500 японцев, в том числе около шестисот воинов, которые служили сиамскому королю в качестве элитных наемников. Их боевые навыки и дисциплина делают их грозным дополнением к королевской гвардии." #NT!
 nd_ayu_deerskin_trade: "Экспортная торговля оленьей шкурой" #NT!
 nd_ayu_deerskin_trade_desc: "Леса Аюттхая кишат оленями, а их шкуры ценятся во всей Восточной Азии. Японские и китайские торговцы ежегодно закупают тысячи шкур для доспехов, одежды и переплетных работ. Торговля оленьими шкурами становится одной из самых прибыльных статей экспорта Аюттхая наряду с саппановой древесиной и рисом.\n\n#italic Доступно в: $nd_ayu_foreign_quarter$#!" #NT!
 nd_ayu_palace_law: "Палатинский закон" #NT!
 nd_ayu_palace_law_desc: "Кодификация королевского законодательства устанавливает четкую иерархию старшинства, регулирует поведение чиновников и определяет обязанности подданных перед короной. Эта правовая база, основанная как на кхмерской традиции, так и на буддийских принципах Тхеравады, будет лежать в основе сиамского управления на протяжении веков." #NT!
 nd_ayu_royal_barges: "Королевские военные баржи" #NT!
 nd_ayu_royal_barges_desc: "Королевские военные баржи Аюттхая являются одновременно оружием войны и символами величия. Эти суда с искусной резьбой и позолотой несут на носу мушкетеров и пушки, а гребцы с синхронной точностью продвигают их через Чао Прайю. Полная процессия из двухсот барж — зрелище, вызывающее трепет как у иностранных гостей, так и у подданных." #NT!
 nd_ayu.1.t: "Остров между реками" #NT!
 nd_ayu.1.d: "Там, где сходятся реки Чао Прайя, Па Сак и Лопбури, наши инженеры проложили каналы, чтобы завершить то, что начала природа. Сейчас Аютия находится на острове, окруженном со всех сторон глубокой водой, куда можно добраться только на лодке или по мостам, которые мы контролируем. Ни одна армия не может приблизиться к нашим стенам, не переправившись сначала через реки под огнем наших лучников. Но этот остров – больше, чем крепость. Реки, которые нас защищают, также несут торговлю между странами. Китайские джонки, индийские дау и малайские прау заполняют наши причалы. Мы должны решить: будет ли Аюттхая известна как неприступная цитадель, которую никто не осмеливается штурмовать, или как великий перекресток, где богатства Азии переходят из рук в руки?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ayu.1.a: "Пусть наши рвы станут нашими крепостями." #NT!
 nd_ayu.1.b: "Пусть наши реки станут нашими дорогами." #NT!
 nd_ayu.2.t: "Нихонмати" #NT!
 nd_ayu.2.d: "Замечательная община прижилась на восточном берегу Чао Прайя, напротив португальского квартала. Японские христиане и самураи-ронины, спасающиеся от преследований сёгуната Токугава, основали свой собственный квартал Нихонмати. Их вождь правит с нашего позволения, а их воины отдали свои мечи на нашу службу. Эти ронины не похожи ни на одного из известных нам солдат: дисциплинированные, бесстрашные в ближнем бою и абсолютно преданные тому, кто заслужил их уважение. Почти шестьсот японских воинов уже строятся вдоль берега реки, их стальные клинки сверкают на тропическом солнце. Купцы среди них торгуют оленьими шкурами, саппаном и шелком, обогащая нашу казну, а их воины укрепляют нашу охрану." #NT!
 nd_ayu.2.a: "Достойное пополнение нашего королевства." #NT!
 STATIC_MODIFIER_NAME_nd_ayu_impregnable_island: "Неприступный остров" #NT!
 STATIC_MODIFIER_DESC_nd_ayu_impregnable_island: "Водная оборона Аюттхая делает столицу крепостью, не имеющей себе равных в Юго-Восточной Азии." #NT!
 STATIC_MODIFIER_NAME_nd_ayu_river_crossroads: "Речной перекресток" #NT!
 STATIC_MODIFIER_DESC_nd_ayu_river_crossroads: "Реки Аюттхая несут торговлю народов, обогащая всех, кто живет на их берегах." #NT!
 n_nd_ayu_rua_rop: "Руа Роп" #NT!
 n_nd_ayu_rua_rop_desc: "Мелкосидящие военные катера, патрулирующие Чао Прайю и ее притоки, с лучниками и мушкетерами для перехвата рейдеров и пиратов." #NT!
 a_nd_ayu_phrai_lek: "Прай Лек" #NT!
 a_nd_ayu_phrai_lek_desc: "Эти солдаты-крестьяне, призванные из барщинного труда, служат свои обязательные месяцы в королевских армиях." #NT!
 a_nd_ayu_ronin_guard: "Ронин Страж" #NT!
 a_nd_ayu_ronin_guard_desc: "Японские самураи без хозяина, бежавшие от преследований Токугавы и теперь служащие королю Аюттхая в качестве элитных иностранных наемников, вызывали страх за свою дисциплину и владение мечом." #NT!
 n_nd_ayu_rua_suwan: "Руа Суван Ратчакан" #NT!
 n_nd_ayu_rua_suwan_desc: "Позолоченные королевские военные баржи Аюттхая, искусно украшенные резьбой и оснащенные носовыми пушками, используемые как для церемониальных шествий, так и для речных боев." #NT!
 nd_ayu_island_fortress: "Островной ров-крепость" #NT!
 nd_ayu_island_fortress_desc: "Система каналов, рвов и водных преград, использующая географию острова Аюттхая для создания многоуровневой водной защиты, которая делает город практически неуязвимым для осады." #NT!
 nd_ayu_fortress_upkeep: "Обслуживание каналов и рвов" #NT!
 nd_ayu_fortress_upkeep_desc: "Древесина и камень для поддержания стен канала, шлюзовых ворот и защитных насыпей, защищающих островной город." #NT!
 nd_ayu_foreign_quarter: "Внешнеторговый квартал" #NT!
 nd_ayu_foreign_quarter_desc: "Определенный район за пределами городских стен, где иностранные купцы (китайские, индийские, персидские, японские и европейские) основывают свои собственные общины под управлением назначенных глав." #NT!
 nd_ayu_deerskin_processing: "Обработка оленьей шкуры" #NT!
 nd_ayu_deerskin_processing_desc: "Обработка и обработка оленьих шкур для экспорта в Японию и Китай — одно из самых прибыльных направлений деятельности Аюттхая." #NT!
 nd_ayu_royal_wat: "Королевский Ват" #NT!
 nd_ayu_royal_wat_desc: "Величественный буддийский храмовый комплекс, служащий духовным сердцем королевства, хранящий священные реликвии, поддерживающий монашеское образование и узаконивающий королевскую власть посредством религиозного покровительства." #NT!
 nd_ayu_temple_patronage: "Покровительство храму" #NT!
 nd_ayu_temple_patronage_desc: "Постоянные поставки керамики для религиозных подношений и красок для украшения храмов и монашеских одежд." #NT!
 levy_nd_ayu_phrai_lek: "Прай Лек Леви" #NT!
 levy_nd_ayu_phrai_lek_desc: "Призывники-барщины, набранные из системы фрай, массово мобилизовались для службы в королевской армии во время кампаний." #NT!
 levy_nd_ayu_rua_suwan: "Королевская военная баржа Леви" #NT!
 levy_nd_ayu_rua_suwan_desc: "Позолоченные военные баржи с экипажем из речных жителей и капитанами-горожанами, собранными из прибрежных общин Чао Прайя." #NT!
 nd_ayu_formed_tt: "Аютия была основана" #NT!
 nd_ayu_path_a_tt: "Выбрал неприступный остров" #NT!
 nd_ayu_path_b_tt: "Выбрал перекресток реки" #NT!
 ayu_krom_tha_bureaucracy: "Кром Та" #NT!
 ayu_krom_tha_bureaucracy_desc: "Морская таможня Аюттхая была уникально организована в два равноправных портовых департамента: Кром Тха Хва (Правый порт), традиционно возглавляемый офицером китайского происхождения и управлявшим восточноазиатским движением, и Кром Тха Сай (Левый порт), которым управляли персидские шиитские администраторы (наиболее известная семья Буннаг, потомок шейха Ахмада Коми, прибывшего в 1602 году) и занимавшаяся индийской, персидской, арабской и европейской торговлей. Это раздвоение дало трону два параллельных таможенных аппарата и официально закрепленное место для офицеров иностранного происхождения в высших эшелонах суда." #NT!
 ayu_tamruat_phon_bureaucracy: "Тамруат Фон" #NT!
 ayu_tamruat_phon_bureaucracy_desc: "Королевская дворцовая полиция: корпус охраны в министерстве Вана, отличный от полевой армии, набранный из доверенных семей мон и кхмеров и подотчетный только королю и Маха Упарату. Тамруат Фон сопровождал короля во время шествий, проводил тайные аресты придворных соперников и решал исход каждого кризиса престолонаследия в Аюттхае, начиная с Боромматрайлокканата и заканчивая низложением короля Суриямарина в 1767 году." #NT!
 ayu_yodfa_elephant_corps_bureaucracy: "Слоновий корпус Йодфа" #NT!
 ayu_yodfa_elephant_corps_bureaucracy_desc: "После единоборства в 1593 году с бирманским наследным принцем при Нонг Сарае король Наресуан реорганизовал корпус слонов Аюттхаи в потомственные профессиональные кадры. Йодфа основал станции по разведению боевых слонов в верховьях Чао Прайя, династии погонщиков из клиентских государств Лан На и Лаоса, а эскорт беженцев-копейщиков Мон предоставил земли Аюттхая в обмен на службу. Корпус выставил на вооружение самую надежную пехоту Аюттхая на протяжении 17 века, отражая вторжения Таунгу и распространяя сюзеренитет на Камбоджу и северные малайские султанаты." #NT!
 ayu_krom_mahatlek_bureaucracy: "Кром Махатлек" #NT!
 ayu_krom_mahatlek_bureaucracy_desc: "Двор королевских пажей зачислял сыновей аюттайской знати, вассальных правителей и высокопоставленных иностранных офицеров в качестве мальчиков, служащих во внутреннем дворце. Пажи спали на полу возле покоев короля, читали его послания и обучались управлению, наблюдая за советом. Достигнув совершеннолетия, они поступили в министерства с четырьмя столпами в качестве младших офицеров, гарантируя, что следующее поколение губернаторов будет лично проверено троном. Система также функционировала как аппарат-заложник: сын мятежного вассала всегда находился на расстоянии вытянутой руки от королевской гвардии." #NT!
 ayu_kromakan_asa_bureaucracy: "Кромакан Аса" #NT!
 ayu_kromakan_asa_bureaucracy_desc: "В большей степени, чем любое другое государство Юго-Восточной Азии, Аюттхая интегрировала офицеров иностранного происхождения в свою высшую администрацию. Кромакан Аса зачислил персов под командование шейха Ахмада Коми (1602 г.), японца Ямаду Нагамасу в качестве губернатора Накхонситхаммарата в 1620-х годах, грека Константина Фаулкона в качестве Пхра Кланга под руководством короля Нарая (1685-88), португальских артиллеристов в артиллерийском парке Аса Черокат и французских инженеров под руководством Дефаржа в 1687 году. Каждому иностранцу было пожаловано Звание Сакдина и Кром его собственного клиентского сообщества, открывающее уникальные каналы для огнестрельного оружия, фортификационной науки и дипломатии Персидского залива." #NT!
 AUTO_MODIFIER_NAME_nd_ayu_bureaucracy_authority: "Бюрократическая власть Аюттхая" #NT!
 AUTO_MODIFIER_DESC_nd_ayu_bureaucracy_authority: "После формирования Аюттхая разблокирует бюрократическую систему и может создать до трех исторических учреждений, взятых из портов-близнецов Кром Та, дворцовую полицию Тамруат Фон, корпус слонов Йодфа, суд пажей Махатлека и корпус иностранных офицеров Кромакан Аса." #NT!
