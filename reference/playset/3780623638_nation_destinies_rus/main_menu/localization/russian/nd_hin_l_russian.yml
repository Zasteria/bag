l_russian:
 STATIC_MODIFIER_NAME_nd_padshah_e_hind: "Падшах-э-Хинд" #NT!
 STATIC_MODIFIER_DESC_nd_padshah_e_hind: "Император Индии командует сильнейшими армиями Востока. От боевых слонов до многочисленной кавалерии и дисциплинированных мушкетеров — боевые традиции континента подчиняются одному трону." #NT!
 STATIC_MODIFIER_NAME_nd_daulat_e_hindustan: "Даулат-э-Хиндустан" #NT!
 STATIC_MODIFIER_DESC_nd_daulat_e_hindustan: "Богатство Индии исходит из ее ткацких станков и полей. Бенгальский муслин, гуджаратский бязь и малабарские специи пополняют сокровищницы единого субконтинента, привлекая торговцев со всех уголков мира." #NT!
 STATIC_MODIFIER_NAME_nd_chakravarti_samrat: "Чакраварти Самрат" #NT!
 STATIC_MODIFIER_DESC_nd_chakravarti_samrat: "Вселенский Император правит посредством божественного мандата и согласия сотни вассальных судов. Как и Ашока до него, Чакраварти связывает субконтинент не только силой, но и легитимностью праведного правления." #NT!
 nd_hin.1.t: "Объединение Индостана" #NT!
 nd_hin.1.d: "Мечта веков осуществилась. От заснеженных перевалов Гиндукуша до тропических берегов мыса Коморин, от солончаков Кача до дельт рек Бенгалии — субконтинент подчиняется одному суверену. Это не просто завоевание территории, а создание государства-цивилизации. Наследие Ашоки, амбиции Алауддина Халджи, видение Акбара — все сходится в этот момент. Но какую форму примет этот новый Индостан? Будет ли это империя меча, наводящая порядок посредством военного превосходства? Страна купцов и ремесленников, чье богатство вызывает зависть всего мира? Или правитель, руководствующийся древним идеалом Чакраварти, монарха, вращающего колесо и правящего посредством праведности?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_hin.1.a: "Мы — Падшах-э-Хинд, Император всей Индии." #NT!
 nd_hin.1.b: "Мы — Даулат-э-Хиндустан, Богатство Индии." #NT!
 nd_hin.1.c: "Мы — Чакраварти Самрат, Вселенский Император." #NT!
 nd_hin.2.t: "Система Мансабдари" #NT!
 nd_hin.2.d: "Управление субконтинентом требует больше, чем просто грубой силы, оно требует системы. Звания мансабдари, впервые систематизированные Акбаром в 1571 году, присваивают каждому дворянину числовой ранг, который определяет как его личное содержание, так и его обязанность содержать кавалерию. Мансабдар с 5000 затов и 5000 саваров должен содержать пять тысяч всадников за свой счет, финансируемых за счет временных доходов, называемых джагирами. Система чрезвычайно гибка: мансабдар может быть повышен в должности, понижен в должности или переведен по воле императора. Никакая наследственная вотчина не приживается. Ни один региональный военачальник не укрепится. Весь имперский аппарат — военный, финансовый, административный — действует как продолжение личности государя. Но какой аспект этой системы мы должны подчеркнуть? Бюрократические заслуги, делающие мансабдари машиной управления, или военная обязанность, делающая ее орудием войны?" #NT!
 nd_hin.2.a: "Продвижение по службе по заслугам, вознаграждение за компетентность, а не за рождение" #NT!
 nd_hin.2.b: "Укрепить кавалерийскую обязанность; наши всадники - наша сила" #NT!
 nd_hin.3.t: "Императорский Карханас" #NT!
 nd_hin.3.d: "Карханы — гордость императорского дома, огромные мастерские, где под императорским покровительством трудятся сотни ремесленников, производя товары непревзойденного качества. В кархана-йи-шахи в Агре и Фатехпур-Сикри ткачи создают парчу из золота и тонкий муслин, настолько прозрачный, что двадцатиметровый болт может пройти сквозь кольцо на пальце. Художники освещают рукописи в стиле персидской миниатюры, а оружейники выковывают из дамасской стали оружие изысканного мастерства. Карханы служат двойной цели: они снабжают двор лучшими предметами роскоши, демонстрируя имперское великолепие посещающим посольствам и торговцам, а также снабжая армию стандартизированным оружием, доспехами и снаряжением. Направим ли мы карханы на обогащение казны за счет экспорта тканей или на оснащение самой грозной армии в Азии?" #NT!
 nd_hin.3.a: "Ткацкие станки должны одеть мир: ткани Индостана — наше золото" #NT!
 nd_hin.3.b: "Кузницы вооружат империю; наше оружие должно быть бесподобным" #NT!
 nd_hin.4.t: "Сулх-и-Куль: Всеобщий мир" #NT!
 nd_hin.4.d: "На субконтиненте, где проживают индуисты и мусульмане, джайны и буддисты, сикхи и христиане, зороастрийцы и евреи, вопрос религиозного сосуществования не является академическим: он экзистенциален. Доктрина Сульх-и-Куль, всеобщего мира среди всех религий, представляет собой самый смелый ответ. Впервые сформулированное в Ибадат-хане, Доме поклонения в Фатехпур-Сикри, куда Акбар пригласил ученых всех вероисповеданий для обсуждения, Сулх-и-Куль утверждает, что ни одна вера не обладает полной истиной. Налог джизья для немусульман отменен. Индуистские фестивали отмечаются при дворе. Суфийские мистики и ученые-брамины дают императору в равной мере советы. Ибадат Хана становится живым символом цивилизации, достаточно уверенной в себе, чтобы вместить множество людей." #NT!
 nd_hin.4.a: "Пусть все религии процветают под нашей защитой" #NT!
 nd_hin.5.t: "Большая Магистральная Дорога" #NT!
 nd_hin.5.d: "Садак-и-Азам, Великая дорога, является главной магистралью субконтинента. Первоначально заложенный в эпоху Маурьев, он был преобразован Шер Шахом Сури в чудо имперской инфраструктуры. Более двух тысяч миль асфальтированных дорог простираются от Бенгалии до северо-западной границы, и через каждые два коса расположены сараи, где путешественники находят отдых, еду и защиту. По всей длине высажены тенистые деревья; колодцы роются через равные промежутки времени; солдаты патрулируют против бандитов. Дорога несет не только товары, но и само управление, имперские депеши проходят ее за считанные дни, соединяя двор Великих Моголов с его самыми отдаленными провинциями. То, что раньше занимало месяцы, теперь занимает недели." #NT!
 nd_hin.5.a: "Дорога связывает империю так же надежно, как и любая армия." #NT!
 STATIC_MODIFIER_NAME_nd_hin_mansabdar_merit: "Мансабдари Меритократия" #NT!
 STATIC_MODIFIER_DESC_nd_hin_mansabdar_merit: "Система мансабдари вознаграждает таланты выше рождения, привлекая на имперскую службу самых способных администраторов со всего субконтинента." #NT!
 STATIC_MODIFIER_NAME_nd_hin_mansabdar_military: "Всадники Мансабдари" #NT!
 STATIC_MODIFIER_DESC_nd_hin_mansabdar_military: "Обязательство мансабдари гарантирует, что каждый дворянин содержит кавалерию, пропорциональную его рангу, создавая огромный резерв обученных всадников." #NT!
 STATIC_MODIFIER_NAME_nd_hin_karkhana_textiles: "Кархана Текстиль Экспорт" #NT!
 STATIC_MODIFIER_DESC_nd_hin_karkhana_textiles: "Императорские мастерские производят муслин, бязь и золотую парчу для экспорта на рынки всего известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_hin_karkhana_weapons: "Кархана Оружейное производство" #NT!
 STATIC_MODIFIER_DESC_nd_hin_karkhana_weapons: "Имперские кузницы стандартизируют производство оружия, снабжая армии Индостана фитильными ружьями, пушками и клинками из дамасской стали." #NT!
 nd_hin_elephant_warfare: "Слоновья война" #NT!
 nd_hin_elephant_warfare_desc: "Боевой слон доминировал на полях сражений в Индии с древних времен. Эти живые крепости, бронированные и укомплектованные лучниками, способны сломать любой строй." #NT!
 nd_hin_temple_architecture: "Храмовая архитектура" #NT!
 nd_hin_temple_architecture_desc: "Возвышающиеся индийские храмы шикхара с замысловатой резьбой по камню и высокими шпилями являются памятниками преданности и художественного мастерства." #NT!
 nd_hin_varna_governance: "Управление Варны" #NT!
 nd_hin_varna_governance_desc: "Сложная социальная иерархия системы джати обеспечивает основу для управления, при этом каждое сообщество выполняет особые роли в рамках имперского порядка." #NT!
 nd_hin_spice_trade: "Торговля специями" #NT!
 nd_hin_spice_trade_desc: "Монополия Индии на перец, кардамон, корицу и гвоздику на протяжении тысячелетий привлекала торговцев из Рима в Китай." #NT!
 nd_hin_sarai_networks: "Сарай Сети" #NT!
 nd_hin_sarai_networks_desc: "Система имперских сараев обеспечивает жилье, конюшни и безопасность купцам и путешественникам на великих торговых путях Индии.\n\n#italic Доступно в: $nd_hin_sarai$#!" #NT!
 nd_hin_jagirdari_system: "Система Джагирдари" #NT!
 nd_hin_jagirdari_system_desc: "Земельные гранты Джагира поддерживают военную аристократию, обязанную содержать кавалерию и пехоту на службе императора." #NT!
 nd_hin_sultanate_court: "Султанатский суд" #NT!
 nd_hin_sultanate_court_desc: "Дворы Делийского султаната соединили персидскую литературную культуру с индийскими художественными традициями, создав космополитическую куртуазную цивилизацию." #NT!
 nd_hin_sowar_tradition: "Соварская традиция" #NT!
 nd_hin_sowar_tradition_desc: "Совары, всадники в тяжелых доспехах, вооруженные копьями, мечами и составными луками, составляют элитную кавалерию военной традиции султаната." #NT!
 nd_hin_grand_trunk_road: "Гранд Транк Роуд" #NT!
 nd_hin_grand_trunk_road_desc: "Садак-э-Азам тянется более чем на две тысячи миль от Бенгалии до северо-западной границы, это величайшая автомагистраль в Азии." #NT!
 nd_hin_textile_mastery: "Текстильное мастерство" #NT!
 nd_hin_textile_mastery_desc: "Индийский текстиль, бенгальский муслин, гуджаратский бязь, кашмирские шали ценятся во всем мире за свою изысканность и мастерство.\n\n#italic Доступно в: $nd_hin_sarai$#!" #NT!
 nd_hin_mansabdari_system: "Система Мансабдари" #NT!
 nd_hin_mansabdari_system_desc: "Система мансабдари присваивает каждому дворянину числовой ранг, определяющий его зарплату, кавалерийские обязанности и административные обязанности." #NT!
 nd_hin_barqandaz_tradition: "Баркандазская традиция" #NT!
 nd_hin_barqandaz_tradition_desc: "Баркандаз, пехота, вооруженная фитильными ружьями, дисциплинированным залповым огнем приносит пороховую войну на поле боя в Индии." #NT!
 nd_hin_sulh_i_kul: "Сулх-и-Куль" #NT!
 nd_hin_sulh_i_kul_desc: "Доктрина всеобщего мира между религиями утверждает, что ни одна вера не обладает полной истиной, и все могут процветать под защитой императора." #NT!
 nd_hin_imperial_karkhanas: "Императорский Карханас" #NT!
 nd_hin_imperial_karkhanas_desc: "Царские карханы — обширные императорские мастерские, где ремесленники производят ткани, оружие, ювелирные изделия и рукописи под прямым патронажем государства." #NT!
 nd_hin_silahdar_guards: "Силахдарская гвардия" #NT!
 nd_hin_silahdar_guards_desc: "Силахдар — личная кавалерия-телохранитель императора, оснащенная лучшими доспехами и оружием имперских карханов." #NT!
 nd_hin_maktab_system: "Система Мактаб" #NT!
 nd_hin_maktab_system_desc: "Сеть начальных школ мактаб обеспечивает базовую грамотность и кораническое образование, выходя за пределы суда и медресе." #NT!
 nd_hin_zabt_revenue: "Система доходов Забта" #NT!
 nd_hin_zabt_revenue_desc: "Система забта Акбара стандартизирует измерение земли и оценку налогов, заменяя произвольные поборы взвешенным и предсказуемым сбором доходов." #NT!
 nd_hin_rocket_corps: "Ракетный корпус" #NT!
 nd_hin_rocket_corps_desc: "Ракеты в железном корпусе, впервые изобретенные в Майсуре Хайдером Али и усовершенствованные Типу Султаном, представляют собой революционный прогресс в артиллерийских технологиях." #NT!
 nd_hin_princely_diplomacy: "Княжеская дипломатия" #NT!
 nd_hin_princely_diplomacy_desc: "Сложная сеть договоров, дани и брачных союзов, связывающая сотни княжеств с имперским центром." #NT!
 nd_hin_bengal_textiles: "Бенгальский Текстиль" #NT!
 nd_hin_bengal_textiles_desc: "В Бенгалии производят лучший в мире муслин, настолько прозрачную ткань, что ее называли «тканым воздухом». Эти ткани продаются по необычайным ценам на рынках Европы и Азии." #NT!
 a_nd_hin_war_elephant: "Боевой слон" #NT!
 a_nd_hin_war_elephant_desc: "Бронированные слоны несут хауда, наполненные лучниками и метателями копья. Их атака может разрушить вражеские порядки и вызвать панику среди лошадей." #NT!
 a_nd_hin_sowar: "Совар" #NT!
 a_nd_hin_sowar_desc: "Кавалеристы султанатской традиции в тяжелых доспехах, вооруженные копьем, мечом талвар и составным луком." #NT!
 a_nd_hin_barqandaz: "Баркандаз" #NT!
 a_nd_hin_barqandaz_desc: "Дисциплинированные мушкетеры с фитильными ружьями, ведущие сокрушительный залповый огонь с подготовленных позиций." #NT!
 a_nd_hin_barqandaz_levy: "Баркандаз Левис" #NT!
 a_nd_hin_barqandaz_levy_desc: "Провинциальная пехота с фитильными ружьями, набранная через систему набора, составляла пороховую основу индийских полевых армий." #NT!
 a_nd_hin_silahdar: "Силахдар" #NT!
 a_nd_hin_silahdar_desc: "Элитная домашняя кавалерия императора, облаченная в лучшие доспехи и владеющая оружием, выкованным в имперских карханах." #NT!
 a_nd_hin_rocket_corps: "Ракетный корпус" #NT!
 a_nd_hin_rocket_corps_desc: "Специализированные артиллерийские войска, оснащенные ракетами в железном корпусе, которые можно запускать быстрыми залпами, чтобы опустошить вражеские формирования на расстоянии." #NT!
 nd_hin_sarai: "Сарай" #NT!
 nd_hin_sarai_desc: "Имперская придорожная гостиница, предоставляющая жилье, конюшни и рыночные помещения для торговцев и путешественников, идущих по торговым путям." #NT!
 nd_hin_sarai_upkeep: "Сарайские провизии" #NT!
 nd_hin_sarai_upkeep_desc: "Для содержания сарая необходимо зерно для путешественников и корм для их животных." #NT!
 nd_hin_karkhana: "Кархана" #NT!
 nd_hin_karkhana_desc: "Императорская мастерская, где искусные ремесленники производят ткани, изделия из металла и предметы роскоши под государственным патронажем." #NT!
 nd_hin_karkhana_operation: "Кархана Операции" #NT!
 nd_hin_karkhana_operation_desc: "Имперские ремесленники красят и ткут из сырой ткани изысканные ткани непревзойденного качества." #NT!
 nd_hin_ibadat_khana: "Ибадат Хана" #NT!
 nd_hin_ibadat_khana_desc: "Молитвенный дом, где собираются ученые всех вероисповеданий, чтобы обсудить богословие, олицетворяющее идеал религиозного сосуществования." #NT!
 nd_hin_ibadat_khana_upkeep: "Научное обслуживание" #NT!
 nd_hin_ibadat_khana_upkeep_desc: "Для поддержки ученых и писцов, обслуживающих Ибадат-хану, требуется бумага для письма, ткань для мебели и благовония для религиозных церемоний." #NT!
 nd_hin_maktab: "Мактаб" #NT!
 nd_hin_maktab_desc: "Начальная школа, обеспечивающая обучение грамоте и религиозному обучению, расширяющая обучение за пределами элиты." #NT!
 nd_hin_maktab_upkeep: "Мактаб Принадлежности" #NT!
 nd_hin_maktab_upkeep_desc: "Бумага и письменные принадлежности для учащихся и преподавателей мактаба, дополненные книгами и восковыми свечами для вечерних занятий." #NT!
 nd_hin_jagir: "Джагир Эстейт" #NT!
 nd_hin_jagir_desc: "Земельное военное поместье, владелец которого обязан содержать кавалерию и солдат для императорской службы." #NT!
 nd_hin_jagir_upkeep: "Техническое обслуживание Джагира" #NT!
 nd_hin_jagir_upkeep_desc: "Лошади, оружие и кожа для упряжи и доспехов содержались за счет кавалерийской службы джагирдара." #NT!
 nd_hin_shikhara_temple: "Храм Шикхара" #NT!
 nd_hin_shikhara_temple_desc: "Высокий индуистский храм с каменными шпилями с замысловатой резьбой, центр поклонения, паломничества и культурной жизни." #NT!
 nd_hin_temple_upkeep: "Обслуживание храма" #NT!
 nd_hin_temple_upkeep_desc: "Камень для постоянного обслуживания и расширения храмового комплекса, а также благовония и пчелиный воск для ежедневных ритуалов." #NT!
 nd_hin_textile_dyeing_pm: "Крашение текстиля" #NT!
 nd_hin_textile_dyeing_pm_desc: "Искусство окрашивания индийского хлопка и муслина яркими, стойкими пигментами ценится во всем мире." #NT!
 nd_hin_spice_processing_pm: "Обработка специй" #NT!
 nd_hin_spice_processing_pm_desc: "Измельчение, сортировка и консервирование перца и других специй в соли при подготовке к торговле на дальние расстояния." #NT!
 levy_nd_hin_war_elephant: "Боевой слон Леви" #NT!
 levy_nd_hin_war_elephant_desc: "Слоны, выращенные из дворянских поместий и провинциальных гарнизонов для императорской службы." #NT!
 levy_nd_hin_barqandaz: "Баркандаз Леви" #NT!
 levy_nd_hin_barqandaz_desc: "Пехота с фитильными ружьями, набираемая по провинциальной системе набора." #NT!
 nd_hin_formed_tt: "был образован Индостан." #NT!
 nd_hin_path_a_tt: "Выбрал Падшаха-э-Хинда" #NT!
 nd_hin_path_b_tt: "Выбрал Даулат-э-Хиндустан" #NT!
 nd_hin_path_c_tt: "Выбрал Чакраварти Самрат" #NT!
 nd_hin_destiny: "Судьба Индостана" #NT!
 nd_hin_destiny_desc: "Субконтинент един, но единство — это только начало. Судьбу Индостана еще предстоит написать: будет ли Индия смотреть вовне, чтобы завоевать, или вовнутрь, чтобы процветать?" #NT!
 nd_hin_dest_frontier: "Северо-западный рубеж" #NT!
 nd_hin_dest_frontier_desc: "Обезопасьте Кабул и Кандагар, горные перевалы, контролирующие доступ на субконтинент. Ни один император Индии не будет в безопасности, пока эти ворота остаются в руках иностранцев." #NT!
 nd_hin_dest_persia: "Завоевание Персии" #NT!
 nd_hin_dest_persia_desc: "Следуйте по стопам Газневидов и Тимуридов. Возьмите Исфахан и Герат, в результате чего древний центр Персии окажется под властью Индостана." #NT!
 nd_hin_dest_imperium: "Универсальный Империум" #NT!
 nd_hin_dest_imperium_desc: "Высшее выражение мощи хиндустани: Багдад, резиденция халифов Аббасидов, и Мекка, священный город ислама, оба находятся под властью падшаха. Это империя, о которой мечтал Александр." #NT!
 nd_hin_dest_ports: "Западные порты" #NT!
 nd_hin_dest_ports_desc: "Сурат и Гоа контролируют западное побережье Индии, куда прибывают европейские купцы, жаждущие специй и тканей. Контролируйте эти порты и контролируйте богатство, которое они генерируют." #NT!
 nd_hin_dest_prosperity: "Процветание Индии" #NT!
 nd_hin_dest_prosperity_desc: "Используйте современные банковские учреждения и развивайте торговлю шелком. Богатство Индии легендарно: сделайте эту легенду реальностью, которая изменит экономику." #NT!
 nd_hin_dest_ocean: "Хозяин Индийского океана" #NT!
 nd_hin_dest_ocean_desc: "Контролируйте Ормуз и Аден, узкие места, через которые контролируется вся торговля между Востоком и Западом. Каждый корабль, перевозящий специи, шелк или хлопок, должен проходить через воды Индостани." #NT!
 nd_hin.6.t: "Судьба Индостана" #NT!
 nd_hin.6.d: "Индия едина. Великий субконтинент, на котором проживают сотни миллионов человек, подчиняется одному суверену. Но что будет дальше? Армии Падшаха доказали свою эффективность против всех соперников на субконтиненте. Заглядывают ли они теперь за его границы? Или истинная сила Индостана заключается не в завоеваниях, а в невообразимом богатстве, которое течет через его рынки и порты?" #NT!
 nd_hin.6.a: "Наша судьба ждет" #NT!
 nd_hin.7.t: "Северо-западный рубеж" #NT!
 nd_hin.7.d: "Перевалы Гиндукуша были маршрутом вторжения каждого завоевателя, когда-либо угрожавшего Индии: от Александра Македонского до Газневидов и самого Тимура. Теперь впервые император Индии держит эти горные ворота. Кабул и Кандагар наши, а вместе с ними и уверенность в том, что ни одна армия больше никогда не пройдет через Хайбер, чтобы опустошить равнины Индостана. Граница обеспечена. Но для Падшаха это не конечная точка. Это трамплин." #NT!
 nd_hin.7.a: "Ворота Индии в наших руках" #NT!
 nd_hin.8.t: "Завоевание Персии" #NT!
 nd_hin.8.d: "Исфахан пал. Герат пал. Древний центр персидской цивилизации, дом поэтов и философов, астрономов и архитекторов, теперь принадлежит падшаху Индостана. Это не просто приграничный рейд: это поворот вспять многовековой истории, когда персидские цари и тюркские завоеватели проносились через перевалы, чтобы грабить Индию. Теперь Индия вернулась. Вопрос в том, как управлять этими огромными новыми территориями. Должны ли мы впитать их народ в свою империю, смешав персидскую и индийскую цивилизацию? Или нам следует извлечь их богатства, чтобы обеспечить дальнейшие завоевания?" #NT!
 nd_hin.8.a: "Интегрируйте Персию в нашу империю" #NT!
 nd_hin.8.b: "Разграбьте их сокровища и вооружите наши легионы" #NT!
 nd_hin.9.t: "Универсальный Империум" #NT!
 nd_hin.9.d: "Багдад и Мекка кланяются Падшаху. Столица халифата Аббасидов и самый священный город ислама находятся на территории хиндустани. Ни один суверен со времен ранних халифов не обладал таким сочетанием светской власти и религиозной власти. Империя простирается от Ганга до Тигра, от священных городов Аравии до шелковых путей Средней Азии. Это универсальная монархия, к которой стремились Тимур и Александр, но так и не достигли. Как история запомнит это достижение?" #NT!
 nd_hin.9.a: "Как император Гази, защитник веры" #NT!
 nd_hin.9.b: "Как наследник Александра, правителя всей Азии" #NT!
 nd_hin.10.t: "Западные порты" #NT!
 nd_hin.10.d: "Сурат и Гоа наши. Великие гавани западного побережья Индии, где сходятся корабли из Аравии, Персии, Восточной Африки и Европы, теперь несут знамя Индостана. Как португальские караки, так и арабские дау должны вести переговоры с властями порта Индостани. Одни только таможенные доходы ошеломляют, но истинная ценность является стратегической. Тот, кто контролирует эти порты, контролирует поток товаров между Востоком и Западом." #NT!
 nd_hin.10.a: "Богатства мира проходят через наши руки" #NT!
 nd_hin.11.t: "Процветание Индии" #NT!
 nd_hin.11.d: "Экономика Индии вышла на новый уровень развития. Банковские дома, созданные по образцу шроффов и хунди Гуджарата, облегчают торговлю на огромных расстояниях. Шелк течет через наши рынки, соединяя Индию с торговыми сетями предметов роскоши Китая и Персии. Формируются институциональные основы современной экономики. Но как нам направить это процветание? К экспорту текстиля, который уже сделал Индию мировой мастерской? Или к банковским учреждениям, которые обещают изменить способы создания и управления богатством?" #NT!
 nd_hin.11.a: "Ткацкие станки Индии оденут мир" #NT!
 nd_hin.11.b: "Наши банковские дома будут конкурировать с Медичи." #NT!
 nd_hin.12.t: "Хозяин Индийского океана" #NT!
 nd_hin.12.d: "Ормуз и Аден наши. Два великих узких прохода в Индийском океане (Ормузский пролив, контролирующий Персидский залив, и Аден, контролирующий Красное море) теперь находятся под контролем Индостана. Каждый тюк шелка, каждый мешок перца, каждый ящик с хлопком, перемещающийся между Востоком и Западом, должны проходить через воды, которыми мы управляем. Португальцы мечтали контролировать эту торговлю со своих разрозненных фабрик; мы добились этого благодаря исключительному весу континентальной империи, спроецированной на моря. Должны ли мы установить железную монополию на этих маршрутах или развивать их как космополитические торговые центры, привлекающие торговцев из всех стран?" #NT!
 nd_hin.12.a: "Укрепить нашу морскую монополию" #NT!
 nd_hin.12.b: "Пусть все страны торгуют под нашей защитой" #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_persian_integration: "Персидская интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_persian_integration: "Персидские администраторы, поэты и ученые поглощены имперской системой, обогащая культуру Хиндустани древними традициями Ирана." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_persian_plunder: "Разграбление Персии" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_persian_plunder: "Богатство Персии способствует быстрой военной экспансии, финансированию новых полков и укреплений по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_ghazi_emperor: "Гази Император" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_ghazi_emperor: "Падшах признан верховным воином веры, чьи завоевания от Индии до Аравии объединили исламский мир под единым сувереном." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_alexander_heir: "Наследник Александра" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_alexander_heir: "Империя падшаха простирается от Ганга до Тигра, превосходя даже владения Александра. Подчиненные народы интегрированы во вселенскую монархию." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_textile_empire: "Текстильная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_textile_empire: "Экспорт хлопка, муслина и шелка из Индии доминирует на мировых рынках, что делает Индостан мировой мастерской." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_banking_houses: "Банковские дома" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_banking_houses: "Сложные финансовые институты (шроффы, хунди и махаджаны) способствуют торговле и инвестициям на всем субконтиненте." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_maritime_monopoly: "Морская монополия" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_maritime_monopoly: "Индостан обеспечивает исключительный контроль над торговыми путями Индийского океана, облагая налогом каждый груз, проходящий через его узкие места." #NT!
 STATIC_MODIFIER_NAME_nd_hin_dest_cosmopolitan_ports: "Космополитические порты" #NT!
 STATIC_MODIFIER_DESC_nd_hin_dest_cosmopolitan_ports: "Великие порты Индостана принимают торговцев из всех стран, становясь яркими космополитическими центрами, где сходятся культуры и товары." #NT!
 nd_hin_diwan_i_am: "Диван-и-Ам" #NT!
 nd_hin_diwan_i_am_desc: "Зал общественных аудиенций, где падшах вершит правосудие и получает дань со своих обширных владений." #NT!
 nd_hin_diwan_upkeep: "Обслуживание суда" #NT!
 nd_hin_diwan_upkeep_desc: "Прекрасная ткань для придворных, бумага для писцов и мебель для большого зала аудиенций." #NT!
 nd_hin_bandar: "Бандар" #NT!
 nd_hin_bandar_desc: "Имперский портовый орган, управляющий крупными торговыми гаванями побережья Индийского океана." #NT!
 nd_hin_bandar_upkeep: "Обслуживание порта" #NT!
 nd_hin_bandar_upkeep_desc: "Пиломатериалы, деготь и инструменты для обслуживания доков, складов и портовых сооружений имперского порта." #NT!
  
  # ===== BUREAUCRACIES ===== 
 hin_dharmasastra_council_bureaucracy: "Совет Дхармашастры" #NT!
 hin_dharmasastra_council_bureaucracy_desc: "Постоянная скамья пандитов-юристов в Варанаси, Митхиле, Надии и Тирупати, выдающая обязательные нибандхи, взятые из Манусмрити, Яджнавалкья Смрити и Митакшары Виджнанешвары. Кодифицируя кастовые обязанности, наследование и ритуальные обязательства, совет создает правовую основу, на которой покоится индуистское гражданское общество: юридический аппарат, который колониальные суды позже унаследуют как «англо-индуистское право»." #NT!
  
 hin_mathadhipati_network_bureaucracy: "Сеть Матхадипати" #NT!
 hin_mathadhipati_network_bureaucracy_desc: "К четырем кардинальным местам Шанкарачарьи, основанным Ади Шанкарой в восьмом веке (Шрингери на юге, Говардхан в Пури на востоке, Дварака на западе и Джйотирматх в Гималаях), присоединились Канчи Камакоти. В 1336 году Видьяранья из Шрингери освятил братьев Харихару и Букку как первых королей Виджаянагара, что стало прецедентом для монашеских резиденций, узаконивающих правителей и дисциплинирующих распространение доктрин по всему субконтиненту." #NT!
  
 hin_devasthanam_trusts_bureaucracy: "Девастханам Трасты" #NT!
 hin_devasthanam_trusts_bureaucracy_desc: "Великие храмовые хозяйства Тирупати Тирумалы, Джаганнатха Пури, Мадурая Минакши, Сомнатха и Рамешварама к четырнадцатому веку владели огромными земельными фондами, управляли депозитными банками, поддерживали запасы зерна и кормили десятки тысяч людей ежедневно через систему прасада. Один только храм Тирумала стал единственным богатейшим учреждением в Южной Индии раннего Нового времени: параллельной священной экономикой вне королевских налоговых книг." #NT!
  
 hin_mahanavami_court_bureaucracy: "Суд Маханавами" #NT!
 hin_mahanavami_court_bureaucracy_desc: "Девятидневный королевский фестиваль, проходивший в Виджаянагаре во время Наваратри, подробно описанный Доминго Паесом и Абдулом Раззаком Самарканди в 1440-х и 1520-х годах. Перед собравшимися наяками король осуществлял суверенитет: выплачивалась дань, проводились военные смотры и ежегодно перестраивалась феодальная иерархия королевства. Возрожден в измененной форме маратхами как суд Дуссеры в Пуне и Сатаре." #NT!
  
 hin_nayankara_system_bureaucracy: "Система Наянкара" #NT!
 hin_nayankara_system_bureaucracy_desc: "Военно-земельный порядок Виджаянагара, при котором наяки (воины-воины, в основном из общин телугу камма и балиджа) владели землями амарам в обмен на квоты на кавалерию. Система выставила на вооружение армию империи с небольшими денежными затратами, но передала реальную территориальную власть наякам, которые стали государствами-преемниками Мадурая, Танджавура и Джинджи после катастрофы в Таликоте в 1565 году." #NT!
  
 hin_tirtha_mela_bureaucracy: "Администрация Тиртха Мела" #NT!
 hin_tirtha_mela_bureaucracy_desc: "Поочередное управление великими праздниками паломничества: Кумбха в Праяге, Харидваре, Удджайне и Нашике в двенадцатилетнем цикле; Ратха-ятра Джаганнатхи в Пури; Махамахам в Кумбаконаме; дни купания в Рамешвараме. Паниндийская священная география, управляемая сменяющимися колледжами брахманов, которые связывали отдаленные регионы общим ритуальным календарем задолго до того, как это мог сделать какой-либо политический центр." #NT!
  
 hin_ashta_pradhan_bureaucracy: "Ашта Прадхан" #NT!
 hin_ashta_pradhan_bureaucracy_desc: "Совет восьми министров, учрежденный Чатрапати Шиваджи во время его коронации в Райгаде в 1674 году: пешва (премьер-министр), Аматья (финансы), Сачив (переписка), Мантри (разведка), Сенапати (командующий), Сумант (иностранные дела), Ньяядхиш (главный судья) и Пандитрао (религиозные дела). Каждый офис имел портфель, а не феодальное владение, что являлось явной альтернативой индуистско-пад-падшахской иерархии мансабдари Великих Моголов." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_hin_bureaucracy_authority: "Императорская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_hin_bureaucracy_authority: "После объединения Индостана трон наследует институциональную основу всех предшествующих формирований индуистского возрождения и получает способность принимать у себя историческую бюрократию." #NT!
