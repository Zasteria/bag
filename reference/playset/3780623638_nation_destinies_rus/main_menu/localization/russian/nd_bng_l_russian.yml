l_russian:
 STATIC_MODIFIER_NAME_nd_looms_of_sonargaon: "Ткацкие станки Сонаргаона" #NT!
 STATIC_MODIFIER_DESC_nd_looms_of_sonargaon: "На ткацких станках Бенгалии выпускается лучшая хлопчатобумажная ткань в мире. Муслин, настолько прозрачный, что его называли «тканым воздухом», господствует на рынках Азии и за ее пределами, что делает Бенгалию самой богатой торговой страной на субконтиненте." #NT!
 STATIC_MODIFIER_NAME_nd_sword_of_the_ganges: "Меч Ганга" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_ganges: "Огромное население Бенгалии, речное географическое положение и традиции боевых слонов делают ее грозной военной державой. Реки служат дорогами для армий, а щедрость дельты поддерживает кампании, которые меньшие королевства никогда не смогут провести." #NT!
 nd_bng.1.t: "Возвышение Бенгалии" #NT!
 nd_bng.1.d: "Бенгальский султанат объединил под одним знаменем плодородную дельту Ганга. От великих портов Читтагонг и Сатгаон до легендарных ткацких центров Сонаргаон и Дакка, эта земля обладает богатством, вызывающим зависть империй. Китайские адмиралы называют ее «самой богатой страной для торговли», а марокканские путешественники восхищаются ее тканью. Теперь, в момент формирования, возникает выбор: должна ли Бенгалия вкладывать свои силы в торговлю текстилем, которая делает ее богатой, или превратить свои армии и флоты в инструменты территориальной экспансии?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bng.1.a: "Пусть ткацкие станки ткут нашу судьбу." #NT!
 nd_bng.1.b: "По нашим рекам будут переправляться армии, а не только торговцы." #NT!
 nd_bng.2.t: "Золотой век Хусейн-шахи" #NT!
 nd_bng.2.d: "При династии Хуссейна Шахи Бенгалия вступает в свой золотой век. От великолепной столицы Гаура территории султаната простираются от Аракана до Ориссы, от Ассама до Трипуры. Индусы и мусульмане вместе служат в королевской администрации, поэты сочиняют песни на бенгальском языке наряду с персидским, а архитектурные шедевры Гаур-Лахнаути возвышаются из характерного кирпича и терракоты. Это момент необычайного культурного расцвета, но также и момента военных амбиций. Хусейн-шахи расширили границы Бенгалии дальше, чем любая предыдущая династия. Как направить этот золотой век?" #NT!
 nd_bng.2.a: "Покровительствуйте искусству и ученым Бенгалии." #NT!
 nd_bng.2.b: "Используйте наше преимущество и расширяйте наши границы." #NT!
 nd_bng.3.t: "Налоговая реформа Муршид Кули Хана" #NT!
 nd_bng.3.d: "Муршид Кули Хан, первый независимый наваб Бенгалии, преобразовал администрацию провинции. Перенося столицу из Дакки в недавно основанный город Муршидабад, он проводит радикальные реформы налоговой системы, которые систематизируют сбор налогов в Бенгалии, Бихаре и Ориссе. Его система «маль замини» назначает землевладельцам фиксированную ставку доходов, заменяя хаотичный сбор налогов упорядоченной бюрократией. Казна Бенгалии переполнена, и сейчас эта провинция приносит более половины всех доходов империи Великих Моголов. Но эта централизация дорого обходится торговой автономии. Должно ли государство ужесточить контроль над доходами или предоставить торговым классам большую свободу?" #NT!
 nd_bng.3.a: "Централизовать доходы под властью наваба." #NT!
 nd_bng.3.b: "Дайте торговцам свободу увеличивать наше богатство." #NT!
 nd_bng.4.t: "Бенгальский ренессанс" #NT!
 nd_bng.4.d: "В Бенгалии происходит великое интеллектуальное пробуждение. Ученые, поэты и реформаторы переосмысливают бенгальскую идентичность посредством литературы, философии и социальной критики. Бенгальский язык сам по себе становится средством модернизации мышления, поскольку писатели бросают вызов старым ортодоксальным взглядам и мечтают о реформированном обществе. Университеты и типографии множатся, грамотность распространяется за пределы традиционной элиты, а новые идеи об управлении и правах личности укореняются на плодородной почве интеллектуальной традиции Бенгалии. Этот ренессанс может пойти двумя путями: литературная революция, которая преобразует сердца и умы, или практическое реформаторское движение, которое меняет институты." #NT!
 nd_bng.4.a: "Пусть написанное слово осветит Бенгалию." #NT!
 nd_bng.4.b: "Реформируйте наши институты для новой эпохи." #NT!
 STATIC_MODIFIER_NAME_nd_bng_golden_age_patronage: "Покровительство Золотого века" #NT!
 STATIC_MODIFIER_DESC_nd_bng_golden_age_patronage: "Двор Хусейна Шахи является маяком культуры и образования, привлекающим поэтов, архитекторов и ученых со всего субконтинента." #NT!
 STATIC_MODIFIER_NAME_nd_bng_golden_age_expansion: "Расширение Золотого века" #NT!
 STATIC_MODIFIER_DESC_nd_bng_golden_age_expansion: "Армии Хусейна Шахи максимально расширили границы Бенгалии, установив господство над Араканом, Ориссой и за их пределами." #NT!
 STATIC_MODIFIER_NAME_nd_bng_revenue_centralization: "Централизация доходов" #NT!
 STATIC_MODIFIER_DESC_nd_bng_revenue_centralization: "Система мал замини Муршид Кули Хана превратила Бенгалию в провинцию с наиболее эффективным налогообложением на субконтиненте." #NT!
 STATIC_MODIFIER_NAME_nd_bng_merchant_freedom: "Торговая свобода" #NT!
 STATIC_MODIFIER_DESC_nd_bng_merchant_freedom: "Бенгальские торговцы действуют с беспрецедентной автономией, их торговые сети охватывают Бенгальский залив и за его пределами." #NT!
 STATIC_MODIFIER_NAME_nd_bng_literary_awakening: "Литературное пробуждение" #NT!
 STATIC_MODIFIER_DESC_nd_bng_literary_awakening: "Бенгальский Ренессанс вызвал взрыв литературы, науки и новых идей, которые трансформируют интеллектуальный ландшафт." #NT!
 STATIC_MODIFIER_NAME_nd_bng_reform_movement: "Реформаторское движение" #NT!
 STATIC_MODIFIER_DESC_nd_bng_reform_movement: "Бенгальские реформаторы модернизируют институты провинции, создавая более эффективную и отзывчивую администрацию." #NT!
 nd_bng_delta_agriculture: "Дельта Сельское хозяйство" #NT!
 nd_bng_delta_agriculture_desc: "Искусство управления ежегодными наводнениями в дельте Ганга (строительство земляных дамб, направление воды через каналы и синхронизация посадки риса с циклом дождей) поддерживает один из самых густонаселенных регионов на земле." #NT!
 nd_bng_sultanate_divan: "Султанатский диван" #NT!
 nd_bng_sultanate_divan_desc: "Административный совет Бенгальского султаната, Диван, сочетает в себе традиции управления Центральной Азии с местными бенгальскими практиками, создавая мультикультурную бюрократию, в которой индуисты и мусульмане служат бок о бок." #NT!
 nd_bng_muslin_tradition: "Муслиновая традиция" #NT!
 nd_bng_muslin_tradition_desc: "Бенгальские ткачи производят муслин настолько тонкий, что путешественники называют его «тканым воздухом». Ткани из Сонаргаона и Дакки ценятся от Китая до Средиземноморья, а их технологии передаются из поколения в поколение мастерами.\n\n#italic Доступно в: $nd_bng_muslin_workshop$#!" #NT!
 nd_bng_river_flotilla: "Речная флотилия" #NT!
 nd_bng_river_flotilla_desc: "В прибрежной Бенгалии контроль над водными путями — это контроль над страной. Мелкосидящие галеры патрулируют тысячи каналов, пересекающих дельту, обеспечивая как военную безопасность, так и коммерческое регулирование." #NT!
 nd_bng_iwaz_naval_legacy: "Военно-морское наследие Иваза Халджи" #NT!
 nd_bng_iwaz_naval_legacy_desc: "Иваз Халджи первым организовал военно-морские силы в исламской Бенгалии, понимая, что речной флот имеет первостепенную необходимость в стране, где водных путей больше, чем дорог. Его наследие на протяжении веков формировало военную доктрину Бенгалии." #NT!
 nd_bng_sonargaon_arong: "Сонаргаон Аронг" #NT!
 nd_bng_sonargaon_arong_desc: "Аронг, рынок, где производят и продают муслин, достигает своего пика в Панам-Нагаре в Сонаргаоне. Здесь собираются торговцы со всей Азии, чтобы сделать ставки на лучшую ткань в мире." #NT!
 nd_bng_hussain_shahi_court: "Суд Хуссейна Шахи" #NT!
 nd_bng_hussain_shahi_court_desc: "Династия Хуссейн Шахи правит золотым веком Бенгалии из столицы Гаур. Под их патронажем бенгальская литература, архитектура и управление достигают беспрецедентных высот." #NT!
 nd_bng_war_boat_tradition: "Традиция боевых лодок" #NT!
 nd_bng_war_boat_tradition_desc: "Бенгальские военные лодочники, пехота при поддержке пайков, которая сражается на речных судах, составляют основу вооруженных сил в сезон дождей. Там, где кавалерия терпит неудачу в затопленной местности, побеждают речные воины." #NT!
 nd_bng_adina_congregation: "Конгрегация Адины" #NT!
 nd_bng_adina_congregation_desc: "Величественные конгрегационалистские мечети Бенгалии, построенные в характерных местных традициях из кирпича и терракоты, служат центрами как религиозной преданности, так и общественной жизни. Мечеть Адина в Пандуе, построенная по образцу великих мечетей Дамаска и Ктесифона, считается крупнейшей на субконтиненте." #NT!
 nd_bng_bengali_coinage: "Бенгальская чеканка" #NT!
 nd_bng_bengali_coinage_desc: "Бенгальский султанат чеканит собственные серебряные танка, устанавливая финансовую независимость от Дели. Эта независимая денежная система облегчает торговлю и привлекает торговцев на рынки Бенгалии." #NT!
 nd_bng_chittagong_customs: "Таможня Читтагонга" #NT!
 nd_bng_chittagong_customs_desc: "Читтагонг, главный морской порт Бенгалии, обрабатывает большую часть зарубежного экспорта: изысканный муслин, индиго, рис и специи утекают наружу, а лошади, слитки и предметы роскоши текут из-за Индийского океана." #NT!
 nd_bng_muslin_export: "Муслин Экспорт" #NT!
 nd_bng_muslin_export_desc: "Торговля бенгальским муслином достигает мировых масштабов. Ежегодно флот из пяти или шести кораблей доставляет в одну только Малакку ткани на сумму от восьмидесяти до девяноста тысяч крузадо, в то время как европейские торговые компании яростно конкурируют за доступ к бенгальским тканям.\n\n#italic Доступно в: $nd_bng_muslin_workshop$#!" #NT!
 nd_bng_river_patrol: "Речной патруль" #NT!
 nd_bng_river_patrol_desc: "Быстроходные патрульные катера защищают обширную речную торговую сеть Бенгалии от пиратства и контрабанды, гарантируя, что богатство, текущее по каналам дельты, достигнет сокровищницы наваба." #NT!
 nd_bng_nawab_governance: "Наваб Управление" #NT!
 nd_bng_nawab_governance_desc: "Навабы Бенгалии создают своеобразную провинциальную администрацию, которая уравновешивает центральную власть с местной автономией, управляя одним из самых густонаселенных и продуктивных регионов в мире." #NT!
 nd_bng_bay_of_bengal_trade: "Бенгальский залив Торговля" #NT!
 nd_bng_bay_of_bengal_trade_desc: "Морские торговые сети Бенгалии охватывают Бенгальский залив, соединяя Читтагонг и Сатгаон с Бирмой, Малаккой, Мальдивами, Шри-Ланкой и портами Юго-Западной Азии и Восточной Африки." #NT!
 nd_bng_murshidabad_silk: "Муршидабадский шелк" #NT!
 nd_bng_murshidabad_silk_desc: "Ткачи шелка Муршидабада производят золотую парчу и кинчабы, которые ценятся во всем мире Великих Моголов. Городские ткацкие станки превращают шелк-сырец в ткань, подходящую для императоров, превращая Бенгалию в центр производства роскошного текстиля.\n\n#italic Доступно в: $nd_bng_arong$#!" #NT!
 nd_bng_revenue_reforms: "Реформы доходов" #NT!
 nd_bng_revenue_reforms_desc: "Систематическая оценка и сбор доходов превращают Бенгалию из провинции, склонной к финансовому хаосу, в финансовую основу Империи Великих Моголов, приносящую более половины всех имперских доходов." #NT!
 nd_bng_arsenal_tradition: "Арсенал Традиция" #NT!
 nd_bng_arsenal_tradition_desc: "Арсеналы Бенгалии производят порох, селитру и оружие в промышленных масштабах. Провинция является одним из крупнейших в мире производителей селитры, важнейшего ингредиента пороха." #NT!
 nd_bng_matchlock_infantry: "Пехота с фитильными ружьями" #NT!
 nd_bng_matchlock_infantry_desc: "Бенгальские бандукчи, мушкетеры с фитильными замками, сочетают в себе традиции огнестрельного оружия, привезенные из Центральной Азии, с местной военной организацией. Они обеспечивают дисциплинированную огневую мощь в армиях Бенгалии, в которых все больше доминирует порох." #NT!
 nd_bng_diplomatic_balance: "Дипломатический баланс" #NT!
 nd_bng_diplomatic_balance_desc: "Географическое положение и экономическое значение Бенгалии требуют сложного подхода к дипломатии, балансирующего амбиции императоров Великих Моголов, араканских королей и европейских торговых компаний." #NT!
 nd_bng_nawab_treasury: "Казначейство Наваба" #NT!
 nd_bng_nawab_treasury_desc: "Сарраф котхи, банкирские дома Бенгалии, управляют потоком доходов из самой богатой провинции Империи Великих Моголов. Бенгальские банкиры предоставляют кредиты по всему субконтиненту, финансируя как торговлю, так и правительство." #NT!
 nd_bng_cotton_processing: "Переработка хлопка" #NT!
 nd_bng_cotton_processing_desc: "Достижения в области хлопкоочистки и подготовки хлопка улучшают качество и количество сырья, доступного легендарным ткачам Бенгалии, поддерживая текстильную промышленность, которая является основой богатства провинции.\n\n#italic Доступно в: $nd_bng_arong$#!" #NT!
 nd_bng_sepoy_corps: "Сипайский корпус" #NT!
 nd_bng_sepoy_corps_desc: "Сипайские полки наваба представляют собой профессионализацию бенгальской армии. Обученная европейским строевым навыкам и вооруженная современными мушкетами, эта дисциплинированная пехота представляет собой грозную силу, как обнаруживают и соперники наваба, и Ост-Индская компания." #NT!
 nd_bng_delta_hydraulics: "Дельта Гидравлика" #NT!
 nd_bng_delta_hydraulics_desc: "Многовековой опыт управления сложной гидрологией дельты Ганга увенчался созданием сложных систем управления водными ресурсами, которые поддерживают плотное заселение, интенсивное выращивание риса и коммерческое судоходство." #NT!
 nd_bng_jute_industry: "Джутовая промышленность" #NT!
 nd_bng_jute_industry_desc: "Бенгалия становится мировым центром производства и переработки джута. Прочное и гибкое волокно (используемое для изготовления веревок, мешков и грубого текстиля) становится одним из важнейших экспортных товаров Бенгалии в индустриальную эпоху.\n\n#italic Доступно в: $nd_bng_delta_bund$#!" #NT!
 nd_bng_bengali_renaissance: "Бенгальский ренессанс" #NT!
 nd_bng_bengali_renaissance_desc: "Интеллектуальная революция преобразует бенгальское общество. Писатели, поэты и реформаторы создают новую бенгальскую литературу, открывают современные образовательные учреждения и бросают вызов социальным условностям, закладывая основу для современной национальной идентичности." #NT!
 nd_bng_indigo_plantations: "Плантации Индиго" #NT!
 nd_bng_indigo_plantations_desc: "Низины Бенгалии оказались идеальными для выращивания индиго, а провинция стала основным поставщиком ценного синего красителя для европейских производителей текстиля. Чаны с индиго усеивают сельскую местность, перерабатывая растение в концентрированные красители для экспорта." #NT!
 n_nd_bng_river_galley: "Бенгальская река Галера" #NT!
 n_nd_bng_river_galley_desc: "Мелкосидящее весловое судно, предназначенное для узких извилистых протоков дельты Ганга. Быстрые и маневренные, эти галеры патрулируют водные пути, служащие автомагистралями Бенгалии." #NT!
 a_nd_bng_war_boatman: "Боевой лодочник" #NT!
 a_nd_bng_war_boatman_desc: "Речная пехота, сражающаяся с лодок и на илистой береговой линии. В сезон дождей, когда кавалерия бесполезна, эти воины при поддержке пайков являются основной боевой силой Бенгалии." #NT!
 n_nd_bng_patrol_boat: "Бенгальский патрульный катер" #NT!
 n_nd_bng_patrol_boat_desc: "Быстроходное судно, предназначенное для защиты речных и прибрежных торговых путей Бенгалии от пиратов и контрабандистов. Патрульные катера легче и быстрее, чем стандартные военные корабли, и являются «рабочими лошадками» коммерческой безопасности Бенгалии." #NT!
 a_nd_bng_banduqchi: "Бандукчи" #NT!
 a_nd_bng_banduqchi_desc: "Бенгальские мушкетеры с фитильными замками, составляющие пороховую пехоту Султаната, а затем и армии наваба. Их дисциплинированный залповый огонь имеет разрушительные последствия на открытой местности бенгальских равнин." #NT!
 a_nd_bng_banduqchi_levy: "Бандукчи ополчение" #NT!
 a_nd_bng_banduqchi_levy_desc: "Набранные мушкетеры, набранные из солдатских и крестьянских общин Бенгалии, вооруженные фитильными ружьями и обученные базовой тактике залпового огня." #NT!
 a_nd_bng_sepoy: "Бенгальский сипай" #NT!
 a_nd_bng_sepoy_desc: "Профессиональная мушкетная пехота эпохи навабов, обученная европейской строевой подготовке и оснащенная кремневыми мушкетами. Бенгальский сипай сочетает субконтинентальные боевые традиции с современной военной дисциплиной." #NT!
 nd_bng_delta_bund: "Дельта Бунд" #NT!
 nd_bng_delta_bund_desc: "Земляные насыпи и системы борьбы с наводнениями, защищающие рисовые поля Бенгалии от ежегодных муссонных наводнений. Эти дамбы направляют паводковые воды в оросительные каналы, превращая разрушительную силу в сельскохозяйственное изобилие." #NT!
 nd_bng_muslin_workshop: "Муслиновая мастерская" #NT!
 nd_bng_muslin_workshop_desc: "Специализированный ткацкий цех, где бенгальские мастера производят лучшую в мире хлопчатобумажную ткань. Муслин из Дакки и Сонаргаона настолько прозрачен, что его кусочки могут пройти сквозь кольцо на пальце." #NT!
 nd_bng_arong: "Аронг" #NT!
 nd_bng_arong_desc: "Бенгальский текстильный рынок, где продается муслин и другие изысканные ткани. Крупнейший район Панам-Нагара в Сонаргаоне привлекает торговцев со всей Азии, что делает его одним из главных коммерческих центров субконтинента." #NT!
 nd_bng_jami_mosque: "Мечеть Джами" #NT!
 nd_bng_jami_mosque_desc: "Величественная конгрегационалистская мечеть, построенная в характерных бенгальских традициях из кирпича и терракоты, с изогнутыми крышами-чалами и сложной цветочной резьбой, сочетающей исламскую архитектуру с местными бенгальскими формами." #NT!
 nd_bng_customs_house: "Таможня" #NT!
 nd_bng_customs_house_desc: "Портовая налоговая служба, регулирующая внешнюю торговлю Бенгалии. Таможенники устанавливают пошлины на входящие и исходящие грузы, направляя богатства торговли Бенгальского залива в государственную казну." #NT!
 nd_bng_arsenal: "Арсенал" #NT!
 nd_bng_arsenal_desc: "Оружейный завод и военный склад по производству огнестрельного оружия, пороха и боеприпасов. Бенгалия — один из крупнейших в мире производителей селитры, важнейшего ингредиента пороха." #NT!
 nd_bng_sarraf_kothhi: "Сарраф Котхи" #NT!
 nd_bng_sarraf_kothhi_desc: "Банковский дом эпохи Наваба, где бенгальские финансисты управляют кредитами, обменивают валюту и финансируют торговлю на большие расстояния. Эти учреждения делают Бенгалию финансовым центром, конкурирующим с любым центром Империи Великих Моголов." #NT!
 nd_bng_indigo_vat: "Индиго Чан" #NT!
 nd_bng_indigo_vat_desc: "Перерабатывающий завод, где растения индиго замачивают, ферментируют и прессуют в концентрированные красители для экспорта. Бенгальский индиго снабжает текстильную промышленность Европы." #NT!
 nd_bng_bund_maintenance: "Техническое обслуживание набережной" #NT!
 nd_bng_bund_maintenance_desc: "Уход за земляными насыпями и оросительными каналами в подверженной наводнениям дельте Ганга." #NT!
 nd_bng_muslin_workshop_maintenance: "Муслин Продакшн" #NT!
 nd_bng_muslin_workshop_maintenance_desc: "Бенгальские ткачи прядут из необработанного хлопка с красителями тонкую муслиновую ткань." #NT!
 nd_bng_arong_maintenance: "В рамках содержания" #NT!
 nd_bng_arong_maintenance_desc: "Товары и материалы, потребляемые для поддержания текстильного рынка." #NT!
 nd_bng_mosque_maintenance: "Содержание мечети" #NT!
 nd_bng_mosque_maintenance_desc: "Каменные и керамические материалы для содержания большой соборной мечети." #NT!
 nd_bng_customs_maintenance: "Содержание таможни" #NT!
 nd_bng_customs_maintenance_desc: "Административные материалы по сбору портовых доходов." #NT!
 nd_bng_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_bng_arsenal_maintenance_desc: "Оружие и огнестрельное оружие, израсходованное на содержание военного склада." #NT!
 nd_bng_sarraf_maintenance: "Содержание банковского дома" #NT!
 nd_bng_sarraf_maintenance_desc: "Административные материалы по банковским и кредитным операциям." #NT!
 nd_bng_indigo_maintenance: "Обработка Индиго" #NT!
 nd_bng_indigo_maintenance_desc: "Растения индиго вымачивают, ферментируют и прессуют в концентрированные красители для экспорта." #NT!
 nd_bng_muslin_weaving: "Муслиновое плетение" #NT!
 nd_bng_muslin_weaving_desc: "Традиционная бенгальская техника плетения из хлопка необычайно тонкой муслиновой ткани с использованием специализированных ткацких станков и опыта, накопленного поколениями." #NT!
 nd_bng_muslin_export_pm: "Муслин Экспортная Торговля" #NT!
 nd_bng_muslin_export_pm_desc: "Упаковка и зарубежный маркетинг знаменитой бенгальской муслиновой ткани на рынках Азии и Европы." #NT!
 nd_bng_silk_weaving: "Муршидабадское шелковое ткачество" #NT!
 nd_bng_silk_weaving_desc: "Производство золотой парчи, кинчабов и тонких шелковых тканей в мастерских Муршидабада." #NT!
 nd_bng_cotton_ginning: "Хлопкоочистительная обработка" #NT!
 nd_bng_cotton_ginning_desc: "Механическое отделение хлопкового волокна от семян, улучшающее качество и количество сырья для бенгальских ткачей." #NT!
 nd_bng_jute_processing: "Обработка джута" #NT!
 nd_bng_jute_processing_desc: "Добыча и подготовка сырых джутовых волокон для производства канатов, мешковины и грубого текстиля." #NT!
 levy_nd_bng_war_boatman: "Боевой лодочник Леви" #NT!
 levy_nd_bng_war_boatman_desc: "Речное пехотное ополчение, набранное из общин в дельте Бенгалии, имеющее навыки ведения боя с лодок и на заболоченной местности." #NT!
 levy_nd_bng_banduqchi: "Бандукчи Леви" #NT!
 levy_nd_bng_banduqchi_desc: "Ополчение мушкетеров с фитильными ружьями, сформированное из солдат и крестьян Бенгалии." #NT!
 nd_bng_formed_tt: "была образована Бенгалия." #NT!
 nd_bng_path_a_tt: "Выбрать ткацкие станки Сонаргаона" #NT!
 nd_bng_path_b_tt: "Выбрать Меч Ганга" #NT!
 nd_bng_destiny: "Судьба Бенгалии" #NT!
 nd_bng_destiny_desc: "Бенгалия стоит на перепутье своего будущего. Завершив формирование, нация должна теперь определить форму своего величия, будь то богатство ее легендарных ткацких станков или сила ее речных армий." #NT!
 nd_bng_dest_textile_hub: "Текстильный хаб Востока" #NT!
 nd_bng_dest_textile_hub_desc: "Расширьте текстильное доминирование Бенгалии, захватив контроль над Масулипатнамом на Коромандельском побережье и обеспечив потоки шелка через рынок капитала. Это делает Бенгалию центром производства тканей в Индийском океане." #NT!
 nd_bng_dest_bay_network: "Сеть Бенгальского залива" #NT!
 nd_bng_dest_bay_network_desc: "Проектирование коммерческой власти Бенгалии через Бенгальский залив путем обеспечения безопасности Малакки и Мартабана. Эти отдаленные порты соединяют экспорт текстиля Бенгалии с торговлей специями в Юго-Восточной Азии и сухопутными маршрутами материковой Бирмы." #NT!
 nd_bng_dest_woven_air: "Тканый воздух" #NT!
 nd_bng_dest_woven_air_desc: "Бенгальский муслин, настолько тонкий, что его называли «тканым воздухом», становится основой глобальной текстильной монополии. Обеспечьте безопасность Малабарского побережья, доминируйте на рынках хлопка и шелка и сделайте Бенгалию ведущим мировым экспортером тканей." #NT!
 nd_bng_dest_bihar_conquest: "Завоевание Бихара" #NT!
 nd_bng_dest_bihar_conquest_desc: "Обеспечьте безопасность западного фланга Бенгалии, завоевав Бихар, сердце равнины Ганга. Патна и Дарбханга контролируют среднее течение великой реки и обеспечивают стратегическую глубину, необходимую Бенгалии для проецирования силы на запад." #NT!
 nd_bng_dest_ganges_campaign: "Кампания Ганга" #NT!
 nd_bng_dest_ganges_campaign_desc: "Расширьте границы бенгальской власти на юг, в Ориссу, у Каттака, и на запад, вдоль Ганга, к священному городу Варанаси. Это делает Бенгалию доминирующей державой восточной Индии." #NT!
 nd_bng_dest_ganges_empire: "Империя Ганга" #NT!
 nd_bng_dest_ganges_empire_desc: "Высшее выражение военной мощи Бенгалии: империя, простирающаяся от дельты до центра Великих Моголов. Возьмите Агру, Лакхнау и священный храм Пури. Бенгалия управляет Гангом от истока до моря." #NT!
 nd_bng.5.t: "Судьба Бенгалии" #NT!
 nd_bng.5.d: "Бенгалия восстала. То, что когда-то было совокупностью речных княжеств и султанатских провинций, теперь превратилось в единую державу, управляющую самой богатой дельтой в мире. Муссонные ветры приносят торговлю из сотен портов; реки питают поля, которые кормят миллионы. Теперь вопрос не в том, будет ли «Бенгалия» великой, а в том, как. Будет ли его величие измеряться мотками ткани или отрезками стали?" #NT!
 nd_bng.5.a: "Наша судьба ждет." #NT!
 nd_bng.6.t: "Текстильный центр Востока" #NT!
 nd_bng.6.d: "Бенгальские ткацкие станки теперь определяют цену ткани от Короманделя до проливов. Когда Масулипатнам обеспечен, торговля текстилем на всем восточном побережье проходит через руки бенгальцев. Торговцы из Китая, Персии и Средиземноморья конкурируют за доступ к нашему хлопку и шелку. Районы Сонаргаона и мастерские Дакки кипят днем ​​и ночью." #NT!
 nd_bng.6.a: "Мир одевается в нашу ткань." #NT!
 nd_bng.7.t: "Мастера залива" #NT!
 nd_bng.7.d: "От Мартабана до Малакки бенгальские торговые суда и военные корабли теперь контролируют морские пути Бенгальского залива. Наш текстиль обменивают на молуккские специи в Малакке, а бирманский тик и рубины текут через Мартабан на бенгальские рынки. Это крупнейшая морская торговая сеть со времен Шривиджая. Но остается вопрос: будем ли мы укреплять свое господство с помощью военно-морской мощи, проецируя силу через океан, или направим это богатство на построение торговой цивилизации, не имеющей себе равных?" #NT!
 nd_bng.7.a: "Командуйте морями с помощью бенгальских военных кораблей." #NT!
 nd_bng.7.b: "Постройте величайший торговый центр, который когда-либо видел мир." #NT!
 nd_bng.8.t: "Тканый воздух" #NT!
 nd_bng.8.d: "Они называют это «тканым воздухом» — муслин настолько тонкий, что сквозь кольцо можно пройти болт. Тканевая монополия Бенгалии теперь неоспорима. От портов Малабара до рынков Леванта ни один текстиль не может конкурировать с нашим. Европейские купцы называют Дакку «Манчестером Востока», хотя мы были первыми на столетия. Это вершина ткацкого искусства и фундамент империи, построенной не на завоеваниях, а на ремесле. Должны ли мы воспользоваться своим преимуществом путем эксклюзивного контроля над поставками хлопка или же откроем наши порты для всех желающих и разбогатеем за счет объемов?" #NT!
 nd_bng.8.a: "Контролируйте поставки ткани в мир." #NT!
 nd_bng.8.b: "Пусть наши порты станут перекрестком торговли." #NT!
 nd_bng.9.t: "Завоевание Бихара" #NT!
 nd_bng.9.d: "Бенгальские армии прошли через равнину Ганга и водрузили свои знамена в Патне и Дарбханге. Бихар (земля древнего королевства Магадха, колыбель буддизма) теперь подчиняется Бенгалии. Благодаря этим завоеваниям султанат обеспечивает стратегическую безопасность среднего Ганга и получает доступ к богатым сельскохозяйственным внутренним районам Бихара. Дорога на запад открыта." #NT!
 nd_bng.9.a: "Бихар наш. Ганг ждет." #NT!
 nd_bng.10.t: "Кампания Ганга" #NT!
 nd_bng.10.d: "Кампания увенчалась триумфом. Каттак, столица королей Гаджапати, пала, в результате чего вся Орисса оказалась под сюзеренитетом Бенгалии. На западе священные гаты Варанаси теперь украшены бенгальскими цветами. От храма Джаганнатхи в Ориссе до горящих мест Каши власть Бенгалии простирается по всей восточной Индии. Но армия далеко от дома. Как нам консолидировать эти огромные новые территории: с помощью военной логистики, поддерживающей наши военные силы, или с помощью административного порядка, который превратит оккупацию в управление?" #NT!
 nd_bng.10.a: "Убедитесь, что наши линии снабжения выдержат следующий удар." #NT!
 nd_bng.10.b: "Наведите порядок в завоеванных провинциях." #NT!
 nd_bng.11.t: "Империя Ганга" #NT!
 nd_bng.11.d: "Это сделано. Столицы Великих Моголов в Агре и Лакнау соответствуют Бенгалии. Храм Господа Джаганнатхи в Пури находится под нашей защитой. От Хугли до Ямуны, от Ориссы до Авада Ганг и все его притоки текут по территории Бенгалии. Это империя, способная соперничать с любой другой в истории Индии, построенная от дельты и вопреки всем ожиданиям, что Бенгалия останется провинциальной заводью. Будет ли эта империя опираться на мощь своих рекрутов и ужас своих армий или на расчетливое применение силы, обеспечивающее победу до начала битвы?" #NT!
 nd_bng.11.a: "Соберите величайшие армии, которые когда-либо видел субконтинент." #NT!
 nd_bng.11.b: "Победа принадлежит тем, кто готовится." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_maritime_dominion: "Морской Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_maritime_dominion: "Бенгальские военные корабли обеспечивают коммерческое превосходство в Бенгальском заливе, создавая военно-морскую традицию, которая расширяет досягаемость бенгальских торговых судов до все более отдаленных берегов." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_entrepot_wealth: "Перевалочное богатство" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_entrepot_wealth: "Порты Бенгалии служат центральным узлом торговли в Индийском океане. Престиж наших торговых домов сохраняется, и разрушенные войной провинции быстро восстанавливаются под эгидой бенгальской торговли." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_cloth_monopoly: "Тканевая монополия" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_cloth_monopoly: "Неоспоримое доминирование Бенгалии в мировой торговле текстилем объединяет различные группы населения в единую бенгальскую идентичность, обеспечивая династии прочную легитимность и лояльность подчиненных народов." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_ocean_emporium: "Океанский торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_ocean_emporium: "Политика открытых портов Бенгалии превращает ее города в величайшие торговые центры в Азии, зарабатывая дипломатические рычаги влияния и разведывательные сети, хотя сосредоточение внимания на торговле требует некоторой платы за военную готовность." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_river_supremacy: "Речное превосходство" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_river_supremacy: "Мастерство Бенгалии в речной логистике позволяет армиям подкрепляться и вести кампанию далеко вдоль Ганга, выставляя на вооружение более крупные силы, чем ожидает противник." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_occupation_order: "Орден оккупации" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_occupation_order: "Эффективное управление завоеванными территориями превращает военную оккупацию в прочное управление, где наемные гарнизоны поддерживают порядок, в то время как более дешевые объявления войны постоянно расширяют границу." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_imperial_authority: "Имперская власть" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_imperial_authority: "Имперская кавалерия и укреплённые гарнизоны Бенгалии проецируют свою мощь на завоеванную равнину Ганги, хотя поддержание этого огромного военного аппарата напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_bng_dest_conquerors_legacy: "Наследие завоевателя" #NT!
 STATIC_MODIFIER_DESC_nd_bng_dest_conquerors_legacy: "Армии Бенгалии грабят богатства завоеванных земель, быстро набирают опытные полки и используют разрушительную артиллерию: непреходящее наследие королевства, созданного завоеваниями." #NT!
 nd_bng_golden_muslin_house: "Золотой Муслиновый Дом" #NT!
 nd_bng_golden_muslin_house_desc: "Вершина текстильной промышленности Бенгалии, роскошная мастерская и торговый зал, где производятся, выставляются напоказ и продаются купцам со всего мира лучший муслин и шелк." #NT!
 nd_bng_golden_muslin_maintenance: "Производство Золотого Муслина" #NT!
 nd_bng_golden_muslin_maintenance_desc: "Хлопок премиум-класса, шелк и красители, используемые при производстве лучших в мире тканей." #NT!
 nd_bng_victory_pillar: "Столп Победы" #NT!
 nd_bng_victory_pillar_desc: "Монументальная каменная колонна, посвященная завоеваниям Бенгалии вдоль Ганга, служит одновременно опорным пунктом гарнизона и символом боевой доблести, которая вдохновляет войска и внушает трепет побежденным." #NT!
 nd_bng_victory_pillar_maintenance: "Содержание Столпа Победы" #NT!
 nd_bng_victory_pillar_maintenance_desc: "Камень, оружие и ткань для содержания военного памятника и его гарнизона." #NT!
  
  # ===== BUREAUCRACIES ===== 
 bng_diwan_i_bangala_bureaucracy: "Диван-и-Бангала" #NT!
 bng_diwan_i_bangala_bureaucracy_desc: "Бенгальский доходный диван, первоначально представлявший собой могольское субахское бюро при поселении Акбара в 1582 году и полностью реорганизованный Муршидом Кули-ханом после того, как он стал диваном в 1700 году и перенес свою столицу из Дакки в Муршидабад в 1717 году. Он погасил задолженность великих заминдаров, урегулировал харадж напрямую с тысячами более мелких держателей и перевел имперскую долю халисы в Дели на два десятилетия. до того, как счета дивана стали самостоятельным бенгальским учреждением. В книгах бюро фиксировались доходы каждого талука, каждой парганы, каждого парома и каждой рыболовной плотины в самой влажной, самой богатой и самой густонаселенной провинции мира Великих Моголов." #NT!
 bng_zamindari_settlement_bureaucracy: "Талукдари Заминдари" #NT!
 bng_zamindari_settlement_bureaucracy_desc: "Многоуровневая бенгальская система землевладения, в которой трон собирал свои доходы не напрямую, а через наследственных заминдаров, которые владели владениями иногда на огромных размерах и передавали их, в свою очередь, талукдарам и мелким посредникам. К концу семнадцатого века великие заминдары Бурдвана, Раджшахи, Динаджпура, Бирбхума и Надии владели ресурсами, окруженными стенами местами и вооруженными вассалами, соперничавшими с небольшими королевствами; Один только Раджшахи заплатил больше доходов, чем несколько суба Декана вместе взятые. Их сотрудничество поддерживало существование государства, а их сопротивление положило конец навабам." #NT!
 bng_faujdari_thana_bureaucracy: "Фаудждари Танас" #NT!
 bng_faujdari_thana_bureaucracy_desc: "Сеть фаудждаров времен Великих Моголов, военно-судебных офицеров, отправленных в танас по всему субаху, отвечала за охрану главных магистралей Бенгалии, подавление бандитизма в прибрежной стране и подавление хронического бандитизма в зонах Нага и Бхуян на восточных холмах. Каждый фаудждар имел небольшой постоянный фаудж из конных и фитильных мушкетеров и одновременно осуществлял судебные полномочия по уголовным делам. Система давала трону доступ к районам, которые налоговые служащие дивана не могли удержать в одиночку, а печать фаудждара стояла на стыке между миром Великих Моголов и клинком разбойника." #NT!
 bng_jagat_seth_treasury_bureaucracy: "Казначейство Джагат Сет" #NT!
 bng_jagat_seth_treasury_bureaucracy_desc: "Союз между навабами и банковской династией Марвари Маникчанда и его племянником Фатехчандом, которого император Мухаммад Шах официально назвал Джагатом Сетом, Банкиром Мира. С 1720-х годов семья владела контрактом на монетный двор Муршидабада, выступала посредником в переводе доходов в Дели через сети хунди, простирающиеся от Сурата до Патны, и гарантировала краткосрочное финансирование Навабате в счет следующего урожая. К 1750-м годам Роберт Орм назвал Джагата Сета величайшим шрифом и банкиром в известном мире; его отказ от доверия Сираджа уд-Даулы в 1757 году сделал возможным английский переворот в Плесси." #NT!
 bng_hussain_shahi_patronage_bureaucracy: "Покровительство Хусейна Шахи" #NT!
 bng_hussain_shahi_patronage_bureaucracy_desc: "Синкретическая придворная культура султанов Хусейна Шахи (1493-1538) в Гауре, чья канцелярия покровительствовала бенгальской вайшнавской поэзии наряду с персидской и арабской письменностью, спонсировала переводы Махабхараты на бенгальский язык Маладхаром Басу и Кавиндрой Парамешварой, нанимала будущего святого-вайшнава Санатану Госвами в качестве секретаря суда до его отречения и строила мечети в Бенгальские идиомы из кирпича, основанные на местных индуистских храмовых ремеслах. Эта договоренность укоренила султанат среди сельского индуистского населения и землевладельцев, но оскорбила ортодоксальных улемов, которые искали власти за пределами Бенгалии." #NT!
 bng_naib_nazim_bureaucracy: "Наиб Назим Востока" #NT!
 bng_naib_nazim_bureaucracy_desc: "Заместитель губернатора Восточной Бенгалии, расположенный в старой столице Великих Моголов Сонаргаоне, а затем в Дакке, старший из трех подчиненных низматов (остальные - Бихар и Орисса) под властью наваба. Наиб-Назим правил великой дельтой свободно, имея свой двор, свою казну и своих фаудждаров; на практике этот пост представлял собой удел, подаренный навабом сыну или влиятельному родственнику, и он институционализировал структурную напряженность между востоком речного порта и столицей Муршидабада. Когда Сарфараз-хан держал его под властью Шуджа-уд-Дина, доходы с востока текли; когда он этого не сделал, они этого не сделали." #NT!
 bng_subahdari_chancery_bureaucracy: "Канцелярия Субадари" #NT!
 bng_subahdari_chancery_bureaucracy_desc: "Персидский секретариат Бенгальского суба, укомплектованный писцами-мунши, набранными из индуистских каст Каястха и Хатри, а также мусульманскими секретарями, прошедшими обучение в Моголов. Канцелярия вела дипломатическую переписку с Дели и имперскими фермерами, которые санкционировали все важные действия Навабате, составляли санады для европейских фабрик в Хугли, Чинсуре, Чандернагоре и Калькутте, а также вели трехъязычный учет на персидском, бенгальском и арабском языках, который связывал субах с империей и с мировой торговлей за ее пределами. Из игл канцелярии вышли те самые договоры, которые к 1765 году передали доходы Бенгалии иностранной компании." #NT!
  
 AUTO_MODIFIER_NAME_nd_bng_bureaucracy_authority: "Диваны Муршидабада" #NT!
 AUTO_MODIFIER_DESC_nd_bng_bureaucracy_authority: "Бюро Бенгалии (налоговый диван, канцелярия, монетный двор, фаудждари-танас и палаты наиб-назима) превратились в постоянный институциональный аппарат. На этом фундаменте формируются прочные институты бенгальской государственности, независимо от того, подчиняется ли королевство султану в Гауре, субадару в Дакке или навабу в Муршидабаде." #NT!
