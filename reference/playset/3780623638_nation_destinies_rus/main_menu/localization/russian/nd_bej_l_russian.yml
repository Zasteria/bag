l_russian:
 STATIC_MODIFIER_NAME_nd_bej_lords_of_the_red_sea: "Владыки Красного моря" #NT!
 STATIC_MODIFIER_DESC_nd_bej_lords_of_the_red_sea: "Бежа заявили о своем господстве над побережьем Красного моря, направляя богатства многовековой морской торговли через Суакин и построенные из кораллов перевалочные пункты, усеивающие береговую линию. Через наши порты проходят торговцы из Аравии, Индии и других стран." #NT!
 STATIC_MODIFIER_NAME_nd_bej_sons_of_the_desert: "Сыны пустыни" #NT!
 STATIC_MODIFIER_DESC_nd_bej_sons_of_the_desert: "Дети Восточной пустыни скачут, как их предки, быстрые, безжалостные и непобедимые. Верхом на верблюдах и пешим воины беджа нападают без предупреждения и исчезают в холмах Красного моря прежде, чем кто-либо из противников успевает ответить." #NT!
 STATIC_MODIFIER_NAME_nd_bej_suakin_ascendant: "Суакин Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_bej_suakin_ascendant: "Построенный кораллами порт Суакин превратился в главный торговый центр западной части Красного моря, привлекая торговцев из Хиджаза и за его пределами." #NT!
 STATIC_MODIFIER_NAME_nd_bej_law_of_the_silif: "Закон Силифа" #NT!
 STATIC_MODIFIER_DESC_nd_bej_law_of_the_silif: "Древний неписаный кодекс беджа, силиф, был систематизирован и повсеместно принят во всех кланах, привнося порядок и стабильность в конфедерацию." #NT!
 nd_bej.1.t: "Восстание беджа" #NT!
 nd_bej.1.d: "Разрозненные кланы беджа наконец объединились под одним знаменем. От золотых рудников Вади-Аллаки до коралловых набережных Суакина, от холмов Красного моря до низменностей Эритреи, народы, говорящие на языке бедавие, стоят вместе как одна нация.\n\nТеперь вопрос в том, по какому пути пойдет это объединенное государство беда. Побережье Красного моря предлагает невероятные богатства благодаря торговле с Аравией и странами Индийского океана. Суакин уже конкурирует с Джиддой как транзитный порт. Но сама пустыня является сердцем беджа, и воины на верблюдах совершали набеги и защищали эти земли с незапамятных времен.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bej.1.a: "Управляйте торговыми путями Красного моря!" #NT!
 nd_bej.1.b: "Пустыня – наша крепость и наш меч!" #NT!
 nd_bej.2.t: "Жемчужина Красного моря" #NT!
 nd_bej.2.d: "Суакин превратился в крупнейший порт на западном побережье Красного моря. Его характерные дома из коралловых блоков, возвышающиеся на четыре этажа над узкими извилистыми улочками, свидетельствуют о богатстве, протекающем через его гавань. Корабли из Джидды, Адена и побережья Суахили толпятся на якорной стоянке, а караванщики Бежи связывают порт с золотыми приисками внутренних районов.\n\nТаможенные доходы порта теперь соперничают с доходами любого города Африканского Рога. Через наши платные ворота проходят паломники, направляющиеся в Мекку, торговцы, торгующие жемчугом и перламутром, и караваны рабов, направляющиеся на север." #NT!
 nd_bej.2.a: "Суакин станет жемчужиной нашего королевства!" #NT!
 nd_bej.2.b: "Суакин станет якорем нашего флота." #NT!
 nd_bej.3.t: "Силиф выдерживает" #NT!
 nd_bej.3.d: "На протяжении поколений беджа управляли собой посредством силифа, свода неписаных обычных законов, которые регулируют все аспекты жизни: от прав на выпас скота до кровной мести, от брачных контрактов до торговых споров. Старейшины каждого клана собираются вместе, чтобы урегулировать конфликты, и их решения несут в себе вес древних традиций.\n\nТеперь, когда наша конфедерация растет и сталкивается с новыми проблемами, силиф был формализован и расширен. Если когда-то закон сохранял только устная память, то теперь признанные собрания старейшин кланов выносят последовательные решения на всей территории беджа." #NT!
 nd_bej.3.a: "Мудрость наших предков будет вести нас." #NT!
 nd_bej.3.b: "Закон должен соблюдаться твердой рукой." #NT!
 nd_bej.4.t: "Возвышение Хадендова" #NT!
 nd_bej.4.d: "Хадендова, самая могущественная из субконфедераций беджа, укрепила свое господство над восточными низменностями. Их воинов, отличающихся замысловатыми прическами тиффа и вооруженных мечами с прямыми лезвиями и шкурными щитами, внушают страх во всем регионе.\n\nХадендова продемонстрировали способность к организованным военным действиям, превосходящую все, чего беджа достигали раньше, координируя набеги и оборонительные кампании на сотни километров пустыни." #NT!
 nd_bej.4.a: "Хадендова будет нашим мечом." #NT!
 nd_bej_desert_riders: "Всадники пустыни" #NT!
 nd_bej_desert_riders_desc: "Древняя традиция беджа ведения войны верхом на верблюдах, отточенная тысячелетиями набегов по пустыне и сопровождения караванов." #NT!
 nd_bej_wadi_allaqi_mines: "Рудники Вади Аллаки" #NT!
 nd_bej_wadi_allaqi_mines_desc: "Месторождения золота Вади-Аллаки и Восточной пустыни, разрабатываемые кланами беджа еще со времен Древнего Египта." #NT!
 nd_bej_camel_breeding: "Разведение верблюдов" #NT!
 nd_bej_camel_breeding_desc: "Селективное разведение верблюдов на выносливость и скорость, краеугольный камень пасторального богатства Бежи." #NT!
 nd_bej_caravan_guardians: "Стражи каравана" #NT!
 nd_bej_caravan_guardians_desc: "Сторожевые башни Бежа и вооруженный эскорт защищают жизненно важные торговые пути через холмы Красного моря." #NT!
 nd_bej_tribal_custom: "Племенной обычай" #NT!
 nd_bej_tribal_custom_desc: "Самая ранняя форма силифа, устных традиций, регулирующих поведение клана, права на выпас скота и разрешение споров." #NT!
 nd_bej_salt_routes: "Соляные маршруты" #NT!
 nd_bej_salt_routes_desc: "Контроль над соляными месторождениями и караванными путями, по которым этот жизненно важный товар распределяется по Восточной пустыне.\n\n#italic Доступно в: $nd_bej_camel_market$#!" #NT!
 nd_bej_sword_and_shield: "Меч и Щит" #NT!
 nd_bej_sword_and_shield_desc: "Грозный стиль боя беджа, сочетающий в себе мечи с прямыми лезвиями и маленькие круглые щиты из кожи и дерева для разрушительного ближнего боя." #NT!
 nd_bej_suakin_entrepot: "Суакин Энтрепот" #NT!
 nd_bej_suakin_entrepot_desc: "Развитие Суакина как главного торгового порта Красного моря с его характерной архитектурой из коралловых блоков и процветающим торговым сообществом." #NT!
 nd_bej_red_sea_dhows: "Дау Красного моря" #NT!
 nd_bej_red_sea_dhows_desc: "Дау с экипажем беджа курсируют по торговым путям Красного моря между Африкой, Аравией и странами Индийского океана." #NT!
 nd_bej_islamic_integration: "Исламская интеграция" #NT!
 nd_bej_islamic_integration_desc: "Постепенное принятие ислама посредством смешанных браков с арабскими торговцами и участия в торговле на Красном море." #NT!
 nd_bej_emerald_trade: "Изумрудная Торговля" #NT!
 nd_bej_emerald_trade_desc: "Разработка месторождений изумрудов Восточной пустыни, известных со времен Птолемеев как легендарные рудники Клеопатры.\n\n#italic Доступно в: $nd_bej_camel_market$#!" #NT!
 nd_bej_clan_alliances: "Клановые Альянсы" #NT!
 nd_bej_clan_alliances_desc: "Система беджа, объединяющая кросс-кузенные брачные союзы, которая объединяет кланы и предотвращает раздробленность в суровых условиях пустыни." #NT!
 nd_bej_desert_scouts: "Разведчики пустыни" #NT!
 nd_bej_desert_scouts_desc: "Элитные конные разведчики, знающие каждый вади, хор и водный источник на холмах Красного моря, глаза и уши конфедерации беджа." #NT!
 nd_bej_silif_codification: "Кодификация Силифа" #NT!
 nd_bej_silif_codification_desc: "Формализация силифа, древнего обычного права беджа, регулирующего споры, союзы и распределение ресурсов между всеми субконфедерациями." #NT!
 nd_bej_sambuk_trade: "Торговые суда Самбука" #NT!
 nd_bej_sambuk_trade_desc: "Более крупные самбуки с латунным вооружением, построенные для дальней торговли по Красному морю и перевозки товаров между африканскими портами и Аравийским полуостровом." #NT!
 nd_bej_hajj_facilitators: "Организаторы хаджа" #NT!
 nd_bej_hajj_facilitators_desc: "Бежа контролировал сухопутный путь из долины Нила в порты Красного моря, облегчая паломничество в Мекку и получая прибыль от трафика." #NT!
 nd_bej_desert_warfare: "Война в пустыне" #NT!
 nd_bej_desert_warfare_desc: "Мастерство тактики боя в пустыне (скорость, неожиданность и шок), отточенное за многие поколения набегов и межплеменных войн." #NT!
 nd_bej_port_customs: "Портовая таможня" #NT!
 nd_bej_port_customs_desc: "Систематическое налогообложение товаров, проходящих через порты Красного моря, контролируемые Бежей, особенно Суакин." #NT!
 nd_bej_hadendowa_confederation: "Конфедерация Хадендова" #NT!
 nd_bej_hadendowa_confederation_desc: "Возвышение Хадендова как доминирующей субконфедерации беджа, организовавшей самую грозную воинскую силу в восточном Судане." #NT!
 nd_bej_mountain_refuge: "Горное убежище" #NT!
 nd_bej_mountain_refuge_desc: "Холмы Красного моря и их неприступный хорс служат неприступным убежищем, срывая попытки Османской империи и Фунджа поработить их." #NT!
 nd_bej_tribal_commerce: "Племенная торговля" #NT!
 nd_bej_tribal_commerce_desc: "Формализованные межплеменные торговые сети, соединяющие внутреннюю часть пустыни с побережьем Красного моря." #NT!
 nd_bej_khor_strongholds: "Крепости Хора" #NT!
 nd_bej_khor_strongholds_desc: "Укрепленные позиции в узких ущельях и высохших руслах рек холмов Красного моря, где небольшие силы могут сдерживать гораздо более крупные армии." #NT!
 nd_bej_desert_smiths: "Пустынные Смиты" #NT!
 nd_bej_desert_smiths_desc: "Традиция металлообработки беджа, производящая характерные мечи с прямыми лезвиями и наконечники копий, используемые их воинами." #NT!
 nd_bej_pastoral_wealth: "Пастырское богатство" #NT!
 nd_bej_pastoral_wealth_desc: "Диверсификация выпаса беджа за счет включения крупного рогатого скота наряду с верблюдами, овцами и козами, что расширяет пастбищную экономику." #NT!
 nd_bej_elite_desert_cavalry: "Элитная пустынная кавалерия" #NT!
 nd_bej_elite_desert_cavalry_desc: "Лучшая верблюжья кавалерия беджа, обученная для продолжительных кампаний в пустыне и способная преодолевать огромные расстояния на скорости." #NT!
 nd_bej_hijaz_gateway: "Хиджазские ворота" #NT!
 nd_bej_hijaz_gateway_desc: "Суакин как основной пункт пересечения Африки и Хиджаза, соединяющий долину Нила с Меккой и Мединой." #NT!
 nd_bej_desert_logistics: "Логистика пустыни" #NT!
 nd_bej_desert_logistics_desc: "Непревзойденный опыт навигации по пустыне, управления водными ресурсами и передвижения на большие расстояния по Восточной пустыне." #NT!
 nd_bej_confederal_diplomacy: "Конфедеративная дипломатия" #NT!
 nd_bej_confederal_diplomacy_desc: "Дипломатические навыки, рожденные в результате управления конфедерацией крайне независимых кланов Хадендова, Бишарин, Амарар и Абабда." #NT!
 nd_bej_eastern_desert_resources: "Ресурсы Восточной пустыни" #NT!
 nd_bej_eastern_desert_resources_desc: "Расширение добычи меди, никеля и других полезных ископаемых, обнаруженных по всей Восточной пустыне, с выплавкой древесного угля.\n\n#italic Доступно в: $nd_bej_camel_market$#!" #NT!
 nd_bej_unbroken_warriors: "Несломленные воины" #NT!
 nd_bej_unbroken_warriors_desc: "Военное наследие беджа сохраняется и в современную эпоху. Это воины, которые однажды прорвут каре британской пехоты у Тамаи." #NT!
 nd_bej_red_sea_modernization: "Модернизация Красного моря" #NT!
 nd_bej_red_sea_modernization_desc: "Адаптация торговой практики беджа к меняющимся моделям торговли Красного моря в современную эпоху." #NT!
 nd_bej_bedawiye_identity: "Бедавийе Идентичность" #NT!
 nd_bej_bedawiye_identity_desc: "Непреходящая культурная самобытность народов, говорящих на языке бедавие, сохранявшаяся на протяжении тысячелетий внешнего давления и перемен." #NT!
 nd_bej_eastern_sudan: "Восточный Судан" #NT!
 nd_bej_eastern_sudan_desc: "Укрепление контроля беджи над восточным Суданом, от границы с Египтом до низменностей Эритреи." #NT!
 nd_bej_pastoral_endurance: "Пастырская выносливость" #NT!
 nd_bej_pastoral_endurance_desc: "Удивительная устойчивость пасторальной экономики беджа, адаптирующейся к засухе, войне и меняющимся моделям торговли на протяжении веков." #NT!
 a_nd_bej_camel_raiders: "Бежа Кэмел Рейдерс" #NT!
 a_nd_bej_camel_raiders_desc: "Быстрые налетчики пустыни на верблюдах, эти воины нападают без предупреждения и исчезают в непроходимых пустошах, прежде чем можно будет организовать организованный ответ." #NT!
 a_nd_bej_swordsmen: "Бежа-мечники" #NT!
 a_nd_bej_swordsmen_desc: "Свирепые воины, владеющие мечами с прямыми лезвиями и маленькими круглыми щитами из кожи и дерева, мечники Беджа разрушительны в ближнем бою." #NT!
 a_nd_bej_mounted_scouts: "Бежа Конные Разведчики" #NT!
 a_nd_bej_mounted_scouts_desc: "Элитные наездники, знающие все вади и водные источники Восточной пустыни, служащие разведчиками, рейдерами и первой линией обороны конфедерации беджа." #NT!
 a_nd_bej_hadendowa_warriors: "Хадендова Воины" #NT!
 a_nd_bej_hadendowa_warriors_desc: "Хадендова — самые опасные из субконфедераций беджа, воины с замысловатыми прическами тиффа, чьи массированные атаки могут сокрушить даже дисциплинированные формирования." #NT!
 n_nd_bej_dhow: "Бежа Доу" #NT!
 n_nd_bej_dhow_desc: "Судно с латунным вооружением и экипажем моряков Бежа, построенное для скорости на торговых путях Красного моря. Легкий и быстрый, но хрупкий в морском бою." #NT!
 n_nd_bej_sambuk: "Самбук Красного моря" #NT!
 n_nd_bej_sambuk_desc: "Более крупное судно с латинским парусным вооружением, предназначенное для дальней торговли по Красному морю и перевозя товары между африканским побережьем и Аравией." #NT!
 a_nd_bej_desert_cavalry: "Кавалерия пустыни Бежа" #NT!
 a_nd_bej_desert_cavalry_desc: "Элитные воины эпохи абсолютизма на верблюдах, сочетающие в себе опыт пустыни Бежа с улучшенным оружием и тактикой." #NT!
 nd_bej_gold_camp: "Лагерь Золотой шахты" #NT!
 nd_bej_gold_camp_desc: "Место добычи золота в Восточной пустыне, которым управляют кланы Беджа, продолжающие традицию добычи полезных ископаемых, восходящую к временам фараонов." #NT!
 nd_bej_camel_market: "Верблюжий рынок" #NT!
 nd_bej_camel_market_desc: "Процветающий центр разведения и торговли верблюдами Бежа, где лучшие верховые и вьючные верблюды северо-восточной Африки переходят из рук в руки." #NT!
 nd_bej_coral_house: "Коралловый Каменный Дом" #NT!
 nd_bej_coral_house_desc: "Характерный многоэтажный торговый дом, построенный из коралловых блоков, добытых на дне Красного моря, в стиле торгового квартала Суакина." #NT!
 nd_bej_desert_watchtower: "Сторожевая башня пустыни" #NT!
 nd_bej_desert_watchtower_desc: "Укрепленный наблюдательный пункт, охраняющий караванные пути через холмы Красного моря, укомплектованный воинами беджа." #NT!
 nd_bej_tribal_assembly: "Племенное собрание" #NT!
 nd_bej_tribal_assembly_desc: "Место сбора, где старейшины клана Беджа собираются для разрешения споров, распределения прав на выпас скота и вынесения решений в соответствии с силифом." #NT!
 nd_bej_hajj_hostel: "Хадж Хостел" #NT!
 nd_bej_hajj_hostel_desc: "Промежуточная станция на пути паломничества в Мекку, обеспечивающая ночлег и продовольствие для путешественников, пересекающих долину Нила на побережье Красного моря." #NT!
 nd_bej_khor_fortress: "Крепость Хор" #NT!
 nd_bej_khor_fortress_desc: "Укрепленная позиция, построенная в узком ущелье холмов Красного моря, где сама местность становится сильнейшей стеной." #NT!
 nd_bej_smithy: "Бежа Кузница" #NT!
 nd_bej_smithy_desc: "Металлообрабатывающая мастерская в пустыне, производящая уникальные мечи с прямыми лезвиями и наконечники копий, которыми вооружаются воины беджа." #NT!
 nd_bej_salt_trade: "Торговля солью Красного моря" #NT!
 nd_bej_salt_trade_desc: "Переработка и распределение соли с побережья Красного моря, жизненно важного товара для скотоводческих общин Восточной пустыни." #NT!
 nd_bej_emerald_polishing: "Изумрудная полировка" #NT!
 nd_bej_emerald_polishing_desc: "Огранка и полировка изумрудов из рудников Восточной пустыни, которые ценятся во всем Средиземноморье и исламском мире." #NT!
 nd_bej_charcoal_production: "Производство древесного угля" #NT!
 nd_bej_charcoal_production_desc: "Производство древесного угля из пустынного кустарника и древесины акации, используемого для выплавки меди и других металлов в Восточной пустыне." #NT!
 nd_bej_gold_camp_upkeep: "Операции Золотого лагеря" #NT!
 nd_bej_gold_camp_upkeep_desc: "Деревянные опоры и каменные орудия, необходимые для поддержания операций по добыче золота." #NT!
 nd_bej_camel_market_upkeep: "Операции на верблюжьем рынке" #NT!
 nd_bej_camel_market_upkeep_desc: "Корм для скота и оборудование, необходимое для работы центра торговли верблюдами." #NT!
 nd_bej_coral_house_upkeep: "Уход за коралловым домом" #NT!
 nd_bej_coral_house_upkeep_desc: "Камень и древесина, необходимые для содержания торговых домов из коралловых блоков." #NT!
 nd_bej_watchtower_upkeep: "Гарнизон Сторожевой Башни" #NT!
 nd_bej_watchtower_upkeep_desc: "Каменные укрепления и оружие для гарнизона сторожевой башни пустыни." #NT!
 nd_bej_assembly_upkeep: "Положения о сборке" #NT!
 nd_bej_assembly_upkeep_desc: "Скот для традиционного гостеприимства, необходимого при проведении собраний старейшин клана." #NT!
 nd_bej_hajj_hostel_upkeep: "Условия общежития" #NT!
 nd_bej_hajj_hostel_upkeep_desc: "Еда и домашний скот для размещения паломников, проходящих по пути в Мекку." #NT!
 nd_bej_khor_fortress_upkeep: "Крепостной гарнизон" #NT!
 nd_bej_khor_fortress_upkeep_desc: "Камень и оружие для содержания гарнизона крепости Хор." #NT!
 nd_bej_smithy_upkeep: "Ковка оружия пустыни" #NT!
 nd_bej_smithy_upkeep_desc: "Кузнецы беджа куют из железа с помощью древесного угля мечи с прямыми лезвиями и наконечники копий, которыми вооружаются воины пустыни." #NT!
 levy_nd_bej_camel_raiders: "Бежа Кэмел Рейдер Леви" #NT!
 levy_nd_bej_camel_raiders_desc: "Члены племени беджа, воспитанные как налетчики на верблюдах, использовали традиционный стиль ведения войны в пустыне." #NT!
 levy_nd_bej_hadendowa_warriors: "Хадендова Воин Леви" #NT!
 levy_nd_bej_hadendowa_warriors_desc: "Грозные пешие воины Хадендова, поднятые из восточных низменностей, вооруженные мечами и щитами." #NT!
 STATIC_MODIFIER_NAME_nd_bej_naval_power: "Бежа Военно-морская мощь" #NT!
 STATIC_MODIFIER_DESC_nd_bej_naval_power: "Богатство Суакина финансирует флот вооруженных дау и самбуков, которые распространяют власть беджа через Красное море, защищая торговые пути и устанавливая морскую власть." #NT!
 STATIC_MODIFIER_NAME_nd_bej_silif_enforcement: "Силиф Правоприменение" #NT!
 STATIC_MODIFIER_DESC_nd_bej_silif_enforcement: "Кодифицированный силиф строго соблюдается во всех кланах, привнося порядок и предсказуемость в управление по всей конфедерации беджа." #NT!
 nd_bej_formed_tt: "Бежа была образована" #NT!
 nd_bej_path_a_tt: "Выбрали Лордов Красного моря" #NT!
 nd_bej_path_b_tt: "Выбрали Сынов пустыни" #NT!
 nd_bej_destiny: "Бежа Судьба" #NT!
 nd_bej_destiny_desc: "Беджа объединились, нация, созданная из кланов пустыни. Теперь вопрос в том, смотреть ли наружу, на Красное море, или внутрь, на пески." #NT!
 nd_bej_dest_red_sea_ports: "Порты Красного моря" #NT!
 nd_bej_dest_red_sea_ports_desc: "Обезопасьте великие гавани Красного моря Суакин и Айдхаб, установив контроль Бежи над морской торговлей на западном побережье." #NT!
 nd_bej_dest_arabian_trade: "Арабская торговля" #NT!
 nd_bej_dest_arabian_trade_desc: "Расширьте коммерческое влияние беджа через Красное море до Джидды, используя паломническую торговлю и торговлю жемчугом, которая соединяет Африку с Аравией." #NT!
 nd_bej_dest_red_sea_hegemony: "Гегемония Красного моря" #NT!
 nd_bej_dest_red_sea_hegemony_desc: "Управляйте всем Красным морем от Адена до Дахлака, став бесспорным хозяином самого стратегического водного пути в мире." #NT!
 nd_bej_dest_nubian_conquest: "Нубийское завоевание" #NT!
 nd_bej_dest_nubian_conquest_desc: "Вступите в центр Нубии и захватите Донголу и Кассалу, распространив власть беджи на коридор верхнего Нила." #NT!
 nd_bej_dest_nile_march: "Нил Марч" #NT!
 nd_bej_dest_nile_march_desc: "Двигайтесь на юг вдоль Нила к Сеннару и на запад к Эфиопскому нагорью, создавая пустынную империю от холмов Красного моря до Голубого Нила." #NT!
 nd_bej_dest_desert_empire: "Пустынная Империя" #NT!
 nd_bej_dest_desert_empire_desc: "Завоюйте весь восточный Судан от Бербера до Собы, объединив Нильский коридор под властью Бежи в империю, простирающуюся от водопадов до места их слияния." #NT!
 nd_bej.5.t: "Нация, выкованная в песке" #NT!
 nd_bej.5.d: "Конфедерация беджа доказала свою силу. От холмов Красного моря до прибрежных низменностей кланы, говорящие на языке бедавие, нашли общую цель. Наши старейшины высказались, и силиф связывает нас как один народ.\n\nПуть вперед мы выбираем, и судьба, которую мы выковываем, будет эхом разноситься сквозь века." #NT!
 nd_bej.5.a: "Наша судьба ждет." #NT!
 nd_bej.6.t: "Коралловые порты" #NT!
 nd_bej.6.d: "Великие порты западной части Красного моря теперь развеваются под знаменем Бежа. Суакин с его домами из коралловых блоков, возвышающимися над бирюзовыми водами, и древний Айдхаб, старый порт паломников, принадлежат нам. Торговые суда из Аравии и Индии заполняют наши гавани, а таможенные поступления пополняют нашу казну.\n\nБеджа превратились из налетчиков пустыни в мастеров морской торговли. Богатства Красного моря проходят через наши руки." #NT!
 nd_bej.6.a: "Море – наш путь к величию." #NT!
 nd_bej.7.t: "Через Красное море" #NT!
 nd_bej.7.d: "Торговцы беджа пересекли Красное море, чтобы обосноваться в Джидде, великом порту Хиджаза. Наши самбуки везут жемчуг, золото и благовония в Аравию и возвращаются с финиками, тканями и богатствами исламского мира.\n\nЭта торговля меняет нас. Мы больше не прибрежная держава, а узел огромной коммерческой сети, охватывающей два континента. Вопрос в том, как сформировать это новое богатство: будем ли мы инвестировать в институты и обучение или создадим флот для защиты и расширения наших торговых путей?" #NT!
 nd_bej.7.a: "Инвестируйте в обучение и торговые дома." #NT!
 nd_bej.7.b: "Постройте флот, достойный наших амбиций." #NT!
 nd_bej.8.t: "Хозяева Красного моря" #NT!
 nd_bej.8.d: "От Адена в устье Красного моря до архипелага Дахлак мощь Бежи в этих водах не имеет себе равных. Ни один корабль не пересекает Африку в Аравию без нашего согласия, и ни один караван не достигает побережья, не заплатив нашу пошлину.\n\nКрасное море, которое древние называли Море Эритреум, превратилось в озеро Бежа. Наши коралловые порты сияют под тропическим солнцем, наши самбуки управляют волнами, а наших торговцев приветствуют от Каира до Каликута. Как мы будем использовать эту беспрецедентную силу?" #NT!
 nd_bej.8.a: "Приемные ученые и учебные заведения." #NT!
 nd_bej.8.b: "Проецируйте нашу силу через море." #NT!
 nd_bej.9.t: "В сердце Нубии" #NT!
 nd_bej.9.d: "Воины беджа покинули холмы Красного моря и направились в коридор Нила. Донгола, древняя столица Макурии, и Кассала, страж восточного подхода, пали от рук нашей кавалерии. Жители долины Нила, давно привыкшие к правлению Нубии и Фунджа, теперь смотрят на знамена беджа со смесью трепета и опасения.\n\nВоины пустыни доказали, что могут захватывать города так же, как совершать набеги на караваны." #NT!
 nd_bej.9.a: "Пустыня порождает завоевателей." #NT!
 nd_bej.10.t: "Марш вдоль Нила" #NT!
 nd_bej.10.d: "Наши армии продвинулись вглубь Судана. Сеннар, резиденция султаната Фундж, взят, и наши разведчики достигли Эфиопского нагорья у Аксума. Царство Беджа теперь простирается от побережья Красного моря до Голубого Нила, охватывая народы и земли, которые наши предки знали только как далеких торговых партнеров.\n\nУправление этим обширным владением требует новых подходов. Будем ли мы править посредством страха и силы оружия или построим институты централизованного управления?" #NT!
 nd_bej.10.a: "Наносите быстрый удар, ведите переговоры с применением силы." #NT!
 nd_bej.10.b: "Централизуйте управление нашими доменами." #NT!
 nd_bej.11.t: "Империя песка и камня" #NT!
 nd_bej.11.d: "От водопадов Нила до места слияния Голубого и Белого Нила в Собе флаг Бежа развевается над огромной пустынной империей. Древний торговый город Бербер, крепость Атбара, руины Мероэ: все наше. Ни одна сила в Восточной Африке не сможет бросить вызов воинам Восточной пустыни.\n\nЭта империя беспрецедентна в истории беджа. Наши предки совершали набеги и торговали; мы завоевали и правили. Как нам закрепить это достижение?" #NT!
 nd_bej.11.a: "Поддерживайте нашу военную машину любой ценой." #NT!
 nd_bej.11.b: "Впитывайте побежденных в нашу нацию." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_suakin_gateway_a: "Суакин шлюз" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_suakin_gateway_a: "Богатство арабской торговли способствует институциональному росту и коммерческой экспансии во всем королевстве Беджа, хотя содержание наших армий напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_suakin_gateway_b: "Флот Красного моря" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_suakin_gateway_b: "Мощный флот дау и самбуков распространяет влияние беджа по всему Красному морю, подкрепленное благочестием исламских ученых." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_red_sea_masters_a: "Ученые моря" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_red_sea_masters_a: "Богатство торговли Красного моря вкладывается в грамотность и обучение, хотя наши ученые относятся к войне с отвращением." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_red_sea_masters_b: "Морской Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_red_sea_masters_b: "Морское владычество Бежа привлекает лояльных подданных и поселенцев на побережье Красного моря, возвышая конфедерацию среди великих держав." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_nile_conquerors_a: "Пустынные рейдеры" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_nile_conquerors_a: "Быстрые рейды и разведывательные сети дают беджа рычаги влияния в переговорах, хотя быстрое расширение истощает наши финансы." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_nile_conquerors_b: "Центральное командование" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_nile_conquerors_b: "Централизованная структура военного командования координирует кампании в пустыне и снижает затраты на объявление войны." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_desert_empire_a: "Несломленные легионы" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_desert_empire_a: "Военная машина беджа поддерживается дешевыми подкреплениями, вспомогательными наемниками и широкой дипломатической сетью." #NT!
 STATIC_MODIFIER_NAME_nd_bej_dest_desert_empire_b: "Лорды побежденных" #NT!
 STATIC_MODIFIER_DESC_nd_bej_dest_desert_empire_b: "Беджа поглощают покоренные народы посредством терпимости и ассимиляции, хотя империя довольствуется успехом." #NT!
 nd_bej_red_sea_trading_house: "Торговый Дом Красное Море" #NT!
 nd_bej_red_sea_trading_house_desc: "Величественный торговый дом из кораллов и камней, управляющий торговлей на Красном море, жемчужина торговой мощи Бежи." #NT!
 nd_bej_trading_house_upkeep: "Деятельность Торгового Дома" #NT!
 nd_bej_trading_house_upkeep_desc: "Камень, древесина, ткань и бумага, необходимые для поддержания великого торгового дома и его коммерческих отчетов." #NT!
 nd_bej_desert_war_camp: "Военный лагерь в пустыне" #NT!
 nd_bej_desert_war_camp_desc: "Укрепленная передовая база для кампаний в пустыне, где воины беджа собираются, пополняют запасы и готовятся к следующему нападению." #NT!
 nd_bej_war_camp_upkeep: "Гарнизон военного лагеря" #NT!
 nd_bej_war_camp_upkeep_desc: "Оружие, кожа, скот и камень, необходимые для содержания военного лагеря в пустыне и его гарнизона." #NT!
  
  # ===== BUREAUCRACY ===== 
 AUTO_MODIFIER_NAME_nd_bej_bureaucracy_authority: "Конфедеральный совет беджа" #NT!
 AUTO_MODIFIER_DESC_nd_bej_bureaucracy_authority: "После объединения конфедерация беджа теперь поддерживает постоянный совет клановых назиров, смотрителей портов и силифов-юристов, которые собираются каждый раз, когда собираются вожди. Их собрание представляет собой прочный институциональный каркас, на котором в государстве беджа закреплены все рабочие учреждения, от караванной таможни до концессии на золото и закона дур." #NT!
  
 bej_silif_council_bureaucracy: "Совет Силифа" #NT!
 bej_silif_council_bureaucracy_desc: "Кодифицированный свод обычного права беджа, силиф (также салиф среди хадендова), которым управляют сидячие собрания старейшин клана. Силиф регулирует права на выпас скота, кровную месть, брачные контракты и торговые споры, при этом ответственность передается вверх через главу семьи, шейха клана и назира племени. Его решения сочетают исламский прецедент с устной традицией беджа и связывают все уровни конфедерации; если его поддерживать, он становится основой пастырского порядка, если пренебрегать им, он растворяется в клановой вражде и центральном бессилии." #NT!
  
 bej_hadariba_wardenship_bureaucracy: "Управление Хадариба" #NT!
 bej_hadariba_wardenship_bureaucracy_desc: "Пакт о разделе таможни, согласно которому кланы Хадариба охраняли караванные дороги и перевалочные пункты Красного моря в обмен на фиксированную долю портовых сборов. К тому времени, когда Ибн Баттута посетил Суакин в 1332 году, султан Хадариба правил материковой половиной порта и разделил обычаи с морским повелителем; позже Хадариба сломала монополию на торговлю золотом и превратила путь на восток через Суакин в главный канал после того, как султан Барсбай разрушил Айдхаб в 1426 году. Устойчивый, он приносит доход и защищает караваны через сотни километров пустыни; пренебрежение, маршруты остаются без охраны, а торговцы избегают портов Бежа." #NT!
  
 bej_wadi_allaqi_concession_bureaucracy: "Концессия Вади Аллаки" #NT!
 bej_wadi_allaqi_concession_bureaucracy_desc: "Официальное соглашение, согласно которому кланы беджа разрабатывали золотые месторождения Вади Аллаки и Восточной пустыни в тандеме с внешними концессионерами. Эта договоренность восходит к золотой лихорадке эпохи Фатимидов в десятом веке и сохранялась до конца периода мамлюков, когда Каирское казначейство требовало свою долю. Если оно будет устойчивым, оно будет приносить твердые деньги как вождям, так и государству; Если пренебречь, шахты затоплены, рабочие-феллахи дезертируют, а добыча золота превращается в местную спекуляцию." #NT!
  
 bej_nazirate_of_dur_bureaucracy: "Назират Дура" #NT!
 bej_nazirate_of_dur_bureaucracy_desc: "Система назиров, управляющих племенными землями (каждый из которых назывался дар; множественное число дур), адаптирована на основе административной модели, которую султанат Фундж Сеннар разработал после 1504 года для управления своими разнообразными скотоводческими подданными. Каждый назир обладает судебной властью в рамках своего дара, платит дань в центральную казну и собирает налоги со своего племени. Этот институт дает государству беджа работоспособную основу для управления кочевым населением на огромных расстояниях за счет постоянной передачи реальной власти племенным вельможам, которые переживут любой центральный режим." #NT!
