l_russian:
 KHL: "Халифат" #NT!
 KHL_ADJ: "Хилафан" #NT!
 KHL_f: "Халифат" #NT!
 KHL_f_desc: "Универсальный суннитский Халифат, восстановленный после тысячелетия династической раздробленности. От Аль-Андалуса до Синда, от Атласа до Инда уммой командует один халиф; Мекка, Медина, Каир, Дамаск, Багдад и резиденции старых миров Омейядов и Аббасидов подчиняются одному трону. Это не Халифат какой-либо одной династии, Омейядов, Аббасидов, Фатимидов, Альмохадов или Османской империи, а воплощенный в жизнь идеал Рашидуна: универсальное сообщество верующих под одним знаменем. Черное знамя Пророка вновь реет над миром, объединенным верой." #NT!
