 NZO: "Наньчжао" #NT!
 NZO_ADJ: "Наньчжао" #NT!
 NZO_f: "Наньчжао" #NT!
 NZO_f_desc: "Наньчжао был великим королевством Бай и И с центром на озере Эрхай в Юньнани, объединявшим шесть Чжао под одним троном с 738 по 902 год нашей эры. На пике своего развития она соперничала с династией Тан, завоевав южную часть Сычуани, западную часть Гуйчжоу и города-государства Пю в верхней Бирме. Восстановленный Наньчжао вернет себе эту многоэтническую горную империю, расположенную на перекрестке дорог между Китаем, Тибетом и Юго-Восточной Азией." #NT!
