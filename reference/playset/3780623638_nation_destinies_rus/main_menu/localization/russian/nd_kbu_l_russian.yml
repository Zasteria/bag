l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_the_mai: "Меч Май" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_mai: "Маис из Канем-Борну правили благодаря силе своей бронированной кавалерии и страху, который их воины в железных шлемах внушали всему Сахелю. Это империя, закаленная в боях и удерживаемая копьем." #NT!
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_sahara: "Перекресток Сахары" #NT!
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_sahara: "Озеро Чад находится в центре крупнейшей торговой сети Африки. Караваны с натроном, хлопком и слоновой костью проходят через рынки Борну по пути в Триполи и Феццан. Это королевство разбогатело благодаря торговле, а не только завоеваниям." #NT!
 nd_kbu.1.t: "Воссоединение Канем-Борну" #NT!
 nd_kbu.1.d: "Древнее царство Сайфава было восстановлено. От берегов озера Чад до песков Сахары земли Канема и Борну снова объединены под единым Май. На протяжении веков династия Сайфава просуществовала, изгнанная из Канема Булалой, они восстановили Борну и теперь возвращают себе свое наследие.\n\nНо что будет определять эту восстановленную империю? Бронированные всадники маи — это ужас Сахеля, а рибаты, охраняющие наши границы, никогда не были нарушены. И все же наши караваны везут больше богатства, чем захватывают наши армии, натрон, хлопок и рабы утекают на север, в Триполи, а лошади, соль и огнестрельное оружие возвращаются на юг. Характер Канем-Борну будет определен сейчас, в момент его восстановления.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_kbu.1.a: "Копьем и рибатом мы воины." #NT!
 nd_kbu.1.b: "Караваном и рынком мы торговцы." #NT!
 STATIC_MODIFIER_NAME_nd_alooma_gunpowder_revolution: "Пороховая революция Алумы" #NT!
 STATIC_MODIFIER_DESC_nd_alooma_gunpowder_revolution: "Турецкие военные советники обучили наших мушкетеров искусству ведения огнестрельного оружия, превратив армию Борну в современную боевую силу." #NT!
 STATIC_MODIFIER_NAME_nd_alooma_fortification_system: "Система укреплений Алумы" #NT!
 STATIC_MODIFIER_DESC_nd_alooma_fortification_system: "Сеть рибатов и укреплённых лагерей теперь охраняет все границы империи, а каждый гарнизон является постоянным напоминанием о власти Борну." #NT!
 STATIC_MODIFIER_NAME_nd_bilma_toll_masters: "Мастера дороги Билма" #NT!
 STATIC_MODIFIER_DESC_nd_bilma_toll_masters: "Наш контроль над оазисом Бильма и проходящими через него соляными караванами дает нам беспрецедентные рычаги воздействия на транссахарскую торговлю." #NT!
 STATIC_MODIFIER_NAME_nd_sayfawa_restoration: "Реставрация Сайфавы" #NT!
 STATIC_MODIFIER_DESC_nd_sayfawa_restoration: "Древняя династия вновь подтверждает свою священную власть, опираясь на многовековую легитимность, чтобы объединить империю в трудные времена." #NT!
 STATIC_MODIFIER_NAME_nd_embrace_the_shehu: "Объятия Шеху" #NT!
 STATIC_MODIFIER_DESC_nd_embrace_the_shehu: "Старая династия уступает место практическому управлению. Совет Шеху правит посредством компетентности и военных заслуг, а не родословной." #NT!
 nd_kbu.2.t: "Реформы Май Идриса Алума" #NT!
 nd_kbu.2.d: "Май Идрис Алума преобразила армии Борну. Посредством дипломатических миссий в Османской Порте он нанял турецких военных советников, которые сейчас обучают наших солдат обращению с огнестрельным оружием. Мушкетеры в железных шлемах маршируют вместе с традиционной бронетанковой кавалерией, а стационарные военные лагеря с оборонительными стенами заменили временные лагеря.\n\nНововведения Alooma выходят за рамки поля боя. Он расчистил дороги для торговли, спроектировал улучшенные лодки для вод озера Чад и ввел стандартные единицы измерения зерна. Его укрепления рибата охраняют каждую границу. Вопрос теперь в том, какую из его реформ мы будем проводить наиболее энергично." #NT!
 nd_kbu.2.a: "Мушкетеры будут нашим авангардом." #NT!
 nd_kbu.2.b: "Рибаты защитят наши границы." #NT!
 nd_kbu.3.t: "Мастера соляного пути" #NT!
 nd_kbu.3.d: "Великий караванный путь от озера Чад до Триполи проходит через соляные оазисы Билмы, где трудом тысяч людей добываются огромные залежи натрия и соли. Каждый караван, пересекающий Сахару, должен проходить через территорию Борну и платить нам пошлину. От Бильмы через Феццан к Средиземному морю через наши земли течет река богатства: натрон, хлопок, орехи кола, слоновая кость и страусиные перья направляются на север, а лошади, огнестрельное оружие, шелк и медь идут на юг.\n\nНаши торговцы обеспечили себе господство на этом центральном маршруте через Сахару, что делает Борну незаменимым посредником между тропической Африкой и средиземноморским миром." #NT!
 nd_kbu.3.a: "Пусть пошлины потекут в нашу казну." #NT!
 nd_kbu.4.t: "Сумерки Сайфавы" #NT!
 nd_kbu.4.d: "Династия Сайфава, правившая более семи столетий, самая долгоправящая династия в зарегистрированной истории, сталкивается с экзистенциальным кризисом. Внутренние придворные интриги ослабили власть Май, губернаторы провинций становятся все более независимыми, а старая экономика, основанная на дани, дает сбои по мере изменения торговых путей.\n\nТем не менее, имя династии по-прежнему имеет огромный вес. Сайфава ведут свою родословную от легендарного Сайфа ибн Зи Язана, а их гиргам, королевская хроника, фиксирует непрерывную цепь суверенных Маисов, восходящую ко временам Пророка. Мы должны решить, укреплять ли этот древний институт или использовать новые формы управления." #NT!
 nd_kbu.4.a: "Сайфава вечны. Восстановить власть Май." #NT!
 nd_kbu.4.b: "Шеху будет править там, где Май не может." #NT!
 nd_kbu.5.t: "Защита Борну" #NT!
 nd_kbu.5.d: "Когда джихад Фулани вспыхнул в Хаусаленде и воины Усмана дан Фодио двинулись на восток, казалось, что сам Борну падет. Нгазаргаму, наша древняя столица, была разграблена в 1808 году. Но Мухаммад аль-Канеми, исламский ученый и военачальник, сплотил арабов канембу и шува на защиту империи. Возглавив смешанный отряд студентов, малламов и наемников, аль-Канеми разгромил силы джихада и изгнал их из Борну.\n\nАль-Канеми основал новую столицу в Кукаве и сформировал Меджлис, исполнительный совет, который объединил различные общины империи. Хотя Сайфава Маис продолжали оставаться номинальными главами, реальная власть теперь принадлежала Шеху и его совету. Борну выжил там, где не смогли другие государства Сахеля." #NT!
 nd_kbu.5.a: "Борну терпит." #NT!
 nd_kbu_kanembu_horsemen: "Всадники Канембу" #NT!
 nd_kbu_kanembu_horsemen_desc: "Традиция кавалерии Канембу восходит к самым ранним дням существования империи, когда всадники в доспехах доминировали на равнинных лугах вокруг озера Чад." #NT!
 nd_kbu_sayfawa_lineage: "Линия Сайфава" #NT!
 nd_kbu_sayfawa_lineage_desc: "Династия Сайфава заявляет о своем происхождении от Сайфа ибн Дхи Язана и правила Канем-Борну более семи столетий, что является самой продолжительной династией в зарегистрированной истории." #NT!
 nd_kbu_natron_extraction: "Экстракция натрия" #NT!
 nd_kbu_natron_extraction_desc: "Залежи натрона вокруг озера Чад являются одними из самых богатых в Африке и служат важным товаром для торговли, консервации и медицины." #NT!
 nd_kbu_early_islamization: "Ранняя исламизация" #NT!
 nd_kbu_early_islamization_desc: "Обращение Канема в ислам в 11 веке при Сайфаве изменило идентичность империи, соединив ее с более широким исламским миром." #NT!
 nd_kbu_ribat_tradition: "Рибат Традиция" #NT!
 nd_kbu_ribat_tradition_desc: "Укрепленные пограничные посты охраняют границы империи, служа одновременно военными гарнизонами и центрами исламского обучения." #NT!
 nd_kbu_lake_chad_fisheries: "Рыболовство на озере Чад" #NT!
 nd_kbu_lake_chad_fisheries_desc: "Обширные ресурсы пресной воды озера Чад поддерживают процветающую рыболовную промышленность, которая кормит растущее население империи." #NT!
 nd_kbu_saharan_caravan_routes: "Караванные маршруты Сахары" #NT!
 nd_kbu_saharan_caravan_routes_desc: "Канем-Борну расположен на центральном транссахарском караванном пути, соединяющем озеро Чад с Триполи через Билму и Феццан." #NT!
 nd_kbu_ottoman_firearms: "Османское огнестрельное оружие" #NT!
 nd_kbu_ottoman_firearms_desc: "Турецкие военные советники, приглашенные Май Идрисом Алумой, обучили солдат Борну обращению с мушкетами, создав первую в Африке профессиональную пороховую пехоту." #NT!
 nd_kbu_alooma_reforms: "Реформы Алума" #NT!
 nd_kbu_alooma_reforms_desc: "Май Идрис Алума преобразовал Борну посредством военных, административных и экономических реформ, установив империю на пике своего могущества." #NT!
 nd_kbu_quranic_schools: "Коранические школы" #NT!
 nd_kbu_quranic_schools_desc: "Сеть медресе распространяет грамотность и исламскую науку по всей империи, обучая улемов, управляющих судами Борну." #NT!
 nd_kbu_berber_camelry: "Берберский верблюд" #NT!
 nd_kbu_berber_camelry_desc: "Берберские всадники на верблюдах служат дальним войском империи в пустыне, способным совершать глубокие набеги через Сахару." #NT!
 nd_kbu_sharia_courts: "Шариатские суды" #NT!
 nd_kbu_sharia_courts_desc: "Суды исламского права заменяют обычное правосудие, обеспечивая стандартизированные юридические процедуры на различных территориях Борну.\n\n#italic Доступно в: $nd_kbu_caravan_depot$#!" #NT!
 nd_kbu_ngazargamu_metropolis: "Нгазаргаму Метрополис" #NT!
 nd_kbu_ngazargamu_metropolis_desc: "Укрепленная столица Нгазаргаму, окруженная стенами длиной более шести километров, служит торговым и политическим центром империи." #NT!
 nd_kbu_tribute_economy: "Дань Экономика" #NT!
 nd_kbu_tribute_economy_desc: "Государственные доходы поступают от дани, таможенных пошлин и участия в работорговле, которая поддерживает транссахарскую караванную сеть." #NT!
 nd_kbu_mailed_cavalry_tradition: "Кольчужная кавалерийская традиция" #NT!
 nd_kbu_mailed_cavalry_tradition_desc: "Тяжелобронированные всадники в кольчугах и железных шлемах составляют элитную ударную силу армии Борну, атакующую плотными формированиями по лугам Сахеля." #NT!
 nd_kbu_cotton_industry: "Хлопковая промышленность" #NT!
 nd_kbu_cotton_industry_desc: "Ткачи Борну производят прекрасные хлопчатобумажные ткани, которые продаются по всей Сахаре и ценятся за свое качество от озера Чад до Средиземноморья." #NT!
 nd_kbu_bilma_salt_road: "Билма Солт Роуд" #NT!
 nd_kbu_bilma_salt_road_desc: "Контроль над оазисом Билма и его соляными месторождениями дает Борну мертвую хватку на центральном транссахарском маршруте." #NT!
 nd_kbu_diplomatic_network: "Дипломатическая сеть" #NT!
 nd_kbu_diplomatic_network_desc: "Борну поддерживает дипломатическую переписку с Османской империей, государствами хауса и североафриканскими королевствами, проецируя влияние далеко за пределы своих границ." #NT!
 nd_kbu_scorched_earth_tactics: "Тактика выжженной земли" #NT!
 nd_kbu_scorched_earth_tactics_desc: "Солдаты Май Алума сжигают все на своем пути во время кампаний, лишая врагов пропитания и подавляя их волю к сопротивлению." #NT!
 nd_kbu_fortified_cities: "Укрепленные города" #NT!
 nd_kbu_fortified_cities_desc: "Крупные города Борну окружают массивные стены из сырцового кирпича, а укрепления Нгазаргаму простираются более чем на шесть километров в окружности." #NT!
 nd_kbu_standardized_measures: "Стандартизированные меры" #NT!
 nd_kbu_standardized_measures_desc: "Стандартные единицы измерения зерна и торговых товаров, введенные при Аломе, облегчают торговлю и сбор налогов по всей империи." #NT!
 nd_kbu_kotoko_flotilla: "Флотилия Котоко" #NT!
 nd_kbu_kotoko_flotilla_desc: "Лодочники котоко с озера Чад обеспечивают речной транспорт, материально-техническую поддержку и десантные возможности вооруженным силам Борну." #NT!
 nd_kbu_kola_nut_trade: "Кольский Орех Трейд" #NT!
 nd_kbu_kola_nut_trade_desc: "Орехи кола из южных лесов продаются через рынки Борну в пункты назначения по всей Сахаре, ценятся как стимуляторы и церемониальные подарки.\n\n#italic Доступно в: $nd_kbu_caravan_depot$#!" #NT!
 nd_kbu_legal_codification: "Правовая кодификация" #NT!
 nd_kbu_legal_codification_desc: "Кодификация исламского права в рамках Маис обеспечивает единую правовую основу для управления многоэтническими территориями Борну." #NT!
 nd_kbu_imperial_cavalry: "Имперская кавалерия" #NT!
 nd_kbu_imperial_cavalry_desc: "Конница Борну остается основой военной мощи империи: в результате поколений разведения рождаются лучшие боевые кони в Сахеле." #NT!
 nd_kbu_leather_workshops: "Кожевенные мастерские" #NT!
 nd_kbu_leather_workshops_desc: "Огромные стада вокруг озера Чад обеспечивают изобилие шкур, которые на кожевенных заводах Борну перерабатываются в изделия из кожи, экспортируемые по транссахарской сети." #NT!
 nd_kbu_scholarly_networks: "Научные сети" #NT!
 nd_kbu_scholarly_networks_desc: "Улемы Борну поддерживают связи с исламскими учебными центрами от Тимбукту до Каира, гарантируя, что империя идет в ногу с интеллектуальным развитием во всем мусульманском мире." #NT!
 nd_kbu_sayfawa_twilight: "Сайфава Сумерки" #NT!
 nd_kbu_sayfawa_twilight_desc: "После семи веков правления самая долгоправящая династия в мире сталкивается с растущими проблемами, связанными с внутренним расколом и внешними угрозами." #NT!
 nd_kbu_reformed_musketeers: "Реформированные мушкетеры" #NT!
 nd_kbu_reformed_musketeers_desc: "Новое поколение мушкетеров Борну, лучше обученное и экипированное, чем их предшественники, выходит на защиту империи." #NT!
 nd_kbu_natron_monopoly: "Натронная монополия" #NT!
 nd_kbu_natron_monopoly_desc: "Государственный контроль над добычей и экспортом натрия обеспечивает стабильный поток доходов, независимый от снижения работорговли.\n\n#italic Доступно в: $nd_kbu_natron_works$#!" #NT!
 nd_kbu_agricultural_reforms: "Сельскохозяйственные реформы" #NT!
 nd_kbu_agricultural_reforms_desc: "Переселение фермеров на новые земли и улучшение ирригационной системы озера Чад расширяют сельскохозяйственную базу империи." #NT!
 nd_kbu_fortified_camps: "Укрепленные лагеря" #NT!
 nd_kbu_fortified_camps_desc: "Постоянные военные лагеря с оборонительными стенами распространяют власть Борну на приграничные территории.\n\n#italic Доступно в: $nd_kbu_war_camp$#!" #NT!
 nd_kbu_saharan_diplomacy: "Сахарская дипломатия" #NT!
 nd_kbu_saharan_diplomacy_desc: "Дипломатическое влияние Борну распространяется по всей Сахаре, поддерживая союзы и коммерческие отношения от Триполи до лесных королевств." #NT!
 nd_kbu_kanemi_defense: "защита аль-Канеми" #NT!
 nd_kbu_kanemi_defense_desc: "Защита Борну Мухаммадом аль-Канеми от джихада Фулани сохранила империю, когда казалось, что все потеряно, основав новую династию воинов-ученых." #NT!
 nd_kbu_kukawa_metropolis: "Кукава Метрополис" #NT!
 nd_kbu_kukawa_metropolis_desc: "Новая столица Кукава превращается в один из величайших городов Африки к югу от Сахары, центр торговли, науки и управления.\n\n#italic Доступно в: $nd_kbu_caravan_depot$#!" #NT!
 nd_kbu_shehu_administration: "Администрация Шеху" #NT!
 nd_kbu_shehu_administration_desc: "Аль-Канеми Шехус правит через совет Меджлиса, обеспечивая эффективное администрирование и коллективное управление взамен старой системы Май." #NT!
 nd_kbu_bornu_chronicles: "Хроники Борну" #NT!
 nd_kbu_bornu_chronicles_desc: "Традиция Дивана, королевской хроники Борну, и устная традиция гиргама сохраняют тысячелетнюю историю, способствуя грамотности и культурной самобытности." #NT!
 nd_kbu_trade_modernization: "Модернизация торговли" #NT!
 nd_kbu_trade_modernization_desc: "Новая коммерческая инфраструктура модернизирует торговые сети Борну, адаптируя многовековые караванные маршруты к меняющимся экономическим условиям.\n\n#italic Доступно в: $nd_kbu_caravan_depot$#!" #NT!
 nd_kbu_majlis_governance: "Меджлис Управление" #NT!
 nd_kbu_majlis_governance_desc: "Исполнительный совет Меджлиса, созданный аль-Канеми, институционализирует коллективное руководство и меритократическое управление в Борну." #NT!
 a_nd_kbu_kanembu_cavalry: "Канембу Кавалерия" #NT!
 a_nd_kbu_kanembu_cavalry_desc: "Бронированные всадники народа Канембу, традиционной конной элиты Империи Канем-Борну, сражающиеся в кольчугах и железных шлемах." #NT!
 a_nd_kbu_iron_musketeer: "Железные мушкетеры" #NT!
 a_nd_kbu_iron_musketeer_desc: "Мушкетеры Борну, обученные османскими военными советниками, носят характерные железные шлемы и владеют турецким огнестрельным оружием со смертельной точностью." #NT!
 a_nd_kbu_camel_rider: "Берберский верблюд" #NT!
 a_nd_kbu_camel_rider_desc: "Закаленные в пустыне наездники на верблюдах берберского происхождения, служащие в империи дальними рейдами и разведкой по всей Сахаре." #NT!
 a_nd_kbu_mailed_cavalry: "Кольчужная кавалерия" #NT!
 a_nd_kbu_mailed_cavalry_desc: "Элита кавалерии Борну, облаченная в кольчуги с железными шлемами, верхом на бронированных лошадях, выведенных для атаки." #NT!
 a_nd_kbu_kotoko_boatmen: "Котоко-лодочники" #NT!
 a_nd_kbu_kotoko_boatmen_desc: "Опытные речники народа котоко, которые плавают по озеру Чад и его притокам, обеспечивая десантную логистику и речной транспорт." #NT!
 a_nd_kbu_bornu_musketeer: "Борну Мушкетеры" #NT!
 a_nd_kbu_bornu_musketeer_desc: "Реформированные мушкетеры Борну, дисциплинированные и хорошо обученные, представляют собой модернизированное ядро ​​пехоты империи." #NT!
 nd_kbu_natron_works: "Натрон работает" #NT!
 nd_kbu_natron_works_desc: "Объекты по добыче ценных месторождений натрия, обнаруженных вокруг озера Чад, производящих ключевой товар для транссахарской торговли." #NT!
 nd_kbu_ribat: "Рибат" #NT!
 nd_kbu_ribat_desc: "Укрепленная пограничная застава, сочетающая военный гарнизон с исламскими учеными, охраняющая границы империи и распространяющая веру." #NT!
 nd_kbu_caravan_depot: "Караванное депо" #NT!
 nd_kbu_caravan_depot_desc: "Перевалочная станция и рынок для транссахарских караванов, обеспечивающий продовольствием, водой и торговыми объектами купцов, пересекающих пустыню." #NT!
 nd_kbu_madrasa: "Медресе Борну" #NT!
 nd_kbu_madrasa_desc: "Школа Корана, где улемы обучают следующее поколение ученых, судей и администраторов исламскому праву и литературе." #NT!
 nd_kbu_cotton_weaving: "Хлопкоткацкий дом" #NT!
 nd_kbu_cotton_weaving_desc: "Мастерская, где опытные ткачи производят тонкую хлопчатобумажную ткань, благодаря которой Борну известен во всей транссахарской торговой сети." #NT!
 nd_kbu_walled_city: "Город-крепость" #NT!
 nd_kbu_walled_city_desc: "Массивные укрепления из сырцового кирпича окружают город, их толстые стены и узкие ворота направляют нападающих на места сражений." #NT!
 nd_kbu_tannery: "Кожевенный завод Борну" #NT!
 nd_kbu_tannery_desc: "Мастерская по переработке шкур пастушеских стад озера Чад в изделия из кожи на экспорт." #NT!
 nd_kbu_war_camp: "Укрепленный военный лагерь" #NT!
 nd_kbu_war_camp_desc: "Постоянный военный лагерь, окруженный оборонительными стенами, распространяющий военную мощь Борну на приграничные территории." #NT!
 nd_kbu_natron_processing_pm: "Переработка натрона" #NT!
 nd_kbu_natron_processing_pm_desc: "Добыча натрона из богатых минералами глинистых отложений вокруг озера Чад и переработка его в соль для торговли." #NT!
 nd_kbu_ribat_upkeep: "Рибатский гарнизон" #NT!
 nd_kbu_ribat_upkeep_desc: "Сопровождение солдат и укреплений приграничного рибата." #NT!
 nd_kbu_caravan_supplies_pm: "Обеспечение караванов" #NT!
 nd_kbu_caravan_supplies_pm_desc: "Поставка еды, воды и торговых товаров для караванов по пустыне." #NT!
 nd_kbu_quran_instruction_pm: "Коранические инструкции" #NT!
 nd_kbu_quran_instruction_pm_desc: "Преподавание Корана и исламской юриспруденции студентам." #NT!
 nd_kbu_cotton_dyeing_pm: "Крашение хлопка" #NT!
 nd_kbu_cotton_dyeing_pm_desc: "Прядение хлопка-сырца и окрашивание его индиго и другими пигментами для ткачества ткани, которая ценится в транссахарской торговой сети." #NT!
 nd_kbu_mudbrick_walls_pm: "Укрепление из сырцового кирпича" #NT!
 nd_kbu_mudbrick_walls_pm_desc: "Поддержание массивных стен из сырцового кирпича, защищающих город." #NT!
 nd_kbu_hide_tanning_pm: "Скрыть загар" #NT!
 nd_kbu_hide_tanning_pm_desc: "Засолка и переработка необработанных шкур животных в готовую кожу для экспорта через Сахару." #NT!
 nd_kbu_camp_provisioning_pm: "Обеспечение лагеря" #NT!
 nd_kbu_camp_provisioning_pm_desc: "Содержание постоянного военного лагеря, снабженного оружием и продовольствием." #NT!
 nd_kbu_islamic_court_pm: "Администрация исламского суда" #NT!
 nd_kbu_islamic_court_pm_desc: "Поддержание административного аппарата шариатских судов." #NT!
 nd_kbu_scorched_earth_pm: "Операции на выжженной земле" #NT!
 nd_kbu_scorched_earth_pm_desc: "Систематическое уничтожение ресурсов противника в ходе военных кампаний." #NT!
 nd_kbu_kola_trade_pm: "Кольский Орех Трейд" #NT!
 nd_kbu_kola_trade_pm_desc: "Торговля орехами колы из южных лесов через транссахарскую сеть." #NT!
 nd_kbu_natron_export_pm: "Натрон Экспорт" #NT!
 nd_kbu_natron_export_pm_desc: "Крупномасштабный экспорт рафинированного натрия на рынки Сахары и за ее пределы." #NT!
 nd_kbu_kukawa_trade_pm: "Кукава Коммерс" #NT!
 nd_kbu_kukawa_trade_pm_desc: "Шумные рынки новой столицы привлекают торговцев со всей Африки." #NT!
 nd_kbu_modern_trade_pm: "Современная торговая инфраструктура" #NT!
 nd_kbu_modern_trade_pm_desc: "Модернизированные склады, дороги и рыночные объекты служат развивающемуся коммерческому ландшафту." #NT!
 levy_nd_kbu_kanembu_cavalry: "Кавалерийский сбор Канембу" #NT!
 levy_nd_kbu_kanembu_cavalry_desc: "Бронированные всадники канембу, собранные из знатных и солдатских сословий, служили конным авангардом империи." #NT!
 levy_nd_kbu_camel_rider: "Берберский Кэмелри Леви" #NT!
 levy_nd_kbu_camel_rider_desc: "Наездники на пустынных верблюдах, принадлежащие к племенам и солдатам, способные совершать дальние набеги через Сахару." #NT!
 nd_kbu_formed_tt: "Образован Канем-Борну" #NT!
 nd_kbu_path_a_tt: "Выбрать Меч Май" #NT!
 nd_kbu_path_b_tt: "Выбрал «Перекресток Сахары»" #NT!
  
  # ===== DESTINY LOCALIZATION ===== 
  
  # Destiny advance names and descriptions 
 nd_kbu_destiny: "Восстановление Канем-Борну" #NT!
 nd_kbu_destiny_desc: "Древнее царство Сайфава воссоединилось. Поддерживайте стабильность и намечайте будущий курс империи, будь то военный гегемон или торговый перекресток." #NT!
  
 nd_kbu_dest_hausa_conquest: "Кампании хауса" #NT!
 nd_kbu_dest_hausa_conquest_desc: "Богатые города-государства хауса Кано и Зария лежат к югу от наших границ, их рынки переполнены товарами, а их стены готовы к осаде. Покорите их и принесите их богатство под копье Борну." #NT!
  
 nd_kbu_dest_sahel_hegemony: "Гегемония Сахеля" #NT!
 nd_kbu_dest_sahel_hegemony_desc: "Тимбукту и Гао, легендарные города западного Сахеля, должны признать превосходство Борну. Идите на запад и захватите власть над всем поясом саванны." #NT!
  
 nd_kbu_dest_mediterranean_reach: "От Чада до моря" #NT!
 nd_kbu_dest_mediterranean_reach_desc: "Транссахарский маршрут заканчивается в Триполи на берегу Средиземного моря. Захватить Мурзук и Триполи, чтобы контролировать всю караванную дорогу от озера Чад до моря." #NT!
  
 nd_kbu_dest_salt_monopoly: "Мастера соляной торговли" #NT!
 nd_kbu_dest_salt_monopoly_desc: "Соль и натрон Бильмы текут через наши рынки по всему миру. Используйте современное банковское дело и обеспечьте нашу монополию на соляные торговые артерии центральной Сахары." #NT!
  
 nd_kbu_dest_trade_crossroads: "Континентальный перекресток" #NT!
 nd_kbu_dest_trade_crossroads_desc: "Слоновая кость, хлопок, орехи кола и натрон — Борну находится в центре крупнейшей торговой сети Африки. Охватите глобальную торговлю и превратите наши земли в настоящий континентальный перекресток." #NT!
  
 nd_kbu_dest_saharan_master: "Мастер Транссахарской сети" #NT!
 nd_kbu_dest_saharan_master_desc: "Каждый караван, пересекающий Сахару, проходит через наши рынки. Благодаря хлопку, слоновой кости и натрону, текущим через наши руки, Борну управляет торговлей всего континента." #NT!
  
  # Destiny event text 
 nd_kbu.6.t: "Путь Канем-Борну" #NT!
 nd_kbu.6.d: "Воссоединение завершено. Май восседает на троне в Нгазаргаму, гиргам записывает еще одну главу самой длинной династии в мире, а империя простирается от Сахары до саванны. Теперь начинается настоящая работа по преобразованию этого восстановленного королевства во что-то, что будет существовать еще столетия." #NT!
 nd_kbu.6.a: "Империя восстановлена." #NT!
  
 nd_kbu.7.t: "Падение городов хауса" #NT!
 nd_kbu.7.d: "Стены Кано прорваны, и эмиры Зарии преклоняют колени перед Май. Великие города-государства хауса, давние соперники Борну, теперь подчиняются нашей власти. Их красильные ямы, их кузницы, их переполненные рынки — все это питает сокровищницу Канем-Борну. Сахель дрожит." #NT!
 nd_kbu.7.a: "Хауса подчиняются мощи Борну." #NT!
  
 nd_kbu.8.t: "Гегемон Сахеля" #NT!
 nd_kbu.8.d: "От Тимбукту до озера Чад весь пояс Сахеля признает верховенство Борну. Крупные торговые города излучины Нигера теперь платят дань, и наша кавалерия беспрепятственно патрулирует караванные пути. Но как нам сохранить эту огромную империю? Должны ли мы добывать богатство посредством набегов и дани или снабжать наши завоевания постоянными войсками?" #NT!
 nd_kbu.8.a: "Набег и дань. Пусть слабые поддержат нас." #NT!
 nd_kbu.8.b: "Гарнизон и укрепления, удерживайте то, что мы завоевали." #NT!
  
 nd_kbu.9.t: "От озера Чад до Средиземного моря" #NT!
 nd_kbu.9.d: "Невозможное было достигнуто. Армии Борну пересекли саму Сахару, захватив оазисы Феццана и порт Триполи. Впервые одна держава контролирует всю транссахарскую магистраль от берегов озера Чад до Средиземного моря. Май Канем-Борну теперь правит империей, охватывающей пустыню." #NT!
 nd_kbu.9.a: "Мы — империя, соединяющая два мира." #NT!
 nd_kbu.9.b: "Пусть наши враги познают ужас Борну." #NT!
  
 nd_kbu.10.t: "Лорды Соленой дороги" #NT!
 nd_kbu.10.d: "Соляные караваны Билмы являются источником жизненной силы транссахарской торговли, и теперь они текут исключительно через наши рынки. Благодаря современным банковским практикам, перенятым у наших средиземноморских торговых партнеров, мы превратили Борну из простой промежуточной станции в финансовый центр центральной Сахары." #NT!
 nd_kbu.10.a: "Соль течет сквозь наши руки." #NT!
  
 nd_kbu.11.t: "Континентальный перекресток" #NT!
 nd_kbu.11.d: "Слоновая кость с юга, натрон из озера Чад, хлопок с наших ткацких станков, орехи кола из лесных королевств — все основные товары внутренней Африки проходят через рынки Борну. Мы стали незаменимым центром континентальной торговли, перекрестком, где сходятся великие торговые пути Африки. Должны ли мы предоставить нашему торговому классу возможность стимулировать этот рост, или государство будет собирать свои взносы напрямую?" #NT!
 nd_kbu.11.a: "Расширьте возможности торговцев. Пусть торговля процветает." #NT!
 nd_kbu.11.b: "Государство должно взимать пошлины." #NT!
  
 nd_kbu.12.t: "Мастер Транссахарской сети" #NT!
 nd_kbu.12.d: "Ни один караван не пересекает Сахару, минуя наши рынки. Ни один торговец не достигает Средиземноморья без нашего согласия. Борну добился того, чего не удавалось ни одному другому государству Сахеля: полного коммерческого доминирования над транссахарской сетью. Богатство двух континентов течет через озеро Чад. Как нам использовать эту силу?" #NT!
 nd_kbu.12.a: "Постройте торговый центр на берегу Чада." #NT!
 nd_kbu.12.b: "Пусть наши караваны несут дипломатию с торговлей." #NT!
  
  # Timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_kbu_dest_raider_economy: "Рейдерская экономика" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_raider_economy: "Военные трофеи поступают в казну Борну, поскольку набеговые отряды лишают завоеванные территории их богатств, поддерживая военную машину империи." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_garrison_network: "Гарнизонная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_garrison_network: "Сеть постоянных гарнизонов по всему Сахелю обеспечивает завоевания Борну, а роты наемников дополняют имперскую кавалерию." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_saharan_empire: "Сахарская империя" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_saharan_empire: "Империя, охватывающая пустыню, Борну пользуется уважением от Средиземноморья до саванны, ее знать возглавляет огромные наборы войск через все границы." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_terror_of_the_sahel: "Террор Сахеля" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_terror_of_the_sahel: "Репутация Борну как непримиримой военной державы снижает желание врагов сопротивляться, поскольку подкрепления и рекруты прибывают с ужасающей скоростью." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_merchant_princes: "Торговые принцы Борну" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_merchant_princes: "Растущий класс богатых торговцев Борну способствует интеграции завоеванных народов посредством совместной торговли, их процветание приносит пользу всем сословиям." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_toll_collectors: "Сборщики пошлины в Сахаре" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_toll_collectors: "Назначаемые государством сборщики пошлины в каждом оазисе и на пересечении рынков гарантируют, что Борну получит свою долю от каждого каравана и торговца." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_lake_chad_emporium: "Торговый центр на озере Чад" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_lake_chad_emporium: "На берегах озера Чад находится один из крупнейших торговых центров Африки, где товары со всего континента переходят из рук в руки, а под защитой Борну процветает свободная торговля." #NT!
 STATIC_MODIFIER_NAME_nd_kbu_dest_caravan_diplomacy: "Караванная дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_kbu_dest_caravan_diplomacy: "Караваны Борну перевозят не только товары, но и дипломатические миссии, распространяя добрую волю и инновации на торговых путях, связывающих континент." #NT!
  
  # Destiny building names and descriptions 
 nd_kbu_imperial_barracks: "Императорские казармы" #NT!
 nd_kbu_imperial_barracks_desc: "Грандиозный военный комплекс, где элитные солдаты Борну обучаются обращению с огнестрельным оружием, тактике кавалерии и осадной войне, поддерживая военное преимущество империи." #NT!
 nd_kbu_grand_caravansary: "Большой Караван-сарай" #NT!
 nd_kbu_grand_caravansary_desc: "Огромный торговый комплекс, обслуживающий транссахарские караваны, со складами, конюшнями, жилыми помещениями и рыночными залами, окруженными крепостными стенами." #NT!
  
  # Building PM names and descriptions 
 nd_kbu_barracks_training_pm: "Военная подготовка" #NT!
 nd_kbu_barracks_training_pm_desc: "Обучение солдат общевойсковой тактике с использованием огнестрельного оружия, кавалерийской техники и осадной техники." #NT!
 nd_kbu_caravansary_operations_pm: "Караван-сараи" #NT!
 nd_kbu_caravansary_operations_pm_desc: "Обслуживание объектов и предоставление услуг транссахарским караванам, проходящим через Борну." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_kbu_bureaucracy_authority: "Суд Сайфава" #NT!
 AUTO_MODIFIER_DESC_nd_kbu_bureaucracy_authority: "Как только Канем-Борну будет восстановлен, под троном будут действовать институты Сайфава Маис, Совет Двенадцати, суд Магиры, корпус мамлюканов, королевская канцелярия и пастырский договор. С учетом столичного суда три из этих учреждений могут работать одновременно." #NT!
  
 kbu_council_of_twelve_bureaucracy: "Совет Двенадцати" #NT!
 kbu_council_of_twelve_bureaucracy_desc: "Институциональное ядро ​​управления Сайфава. Май управлял через двенадцать великих должностей: Галадима как командующий западными границами и канцлер, Йерима как смотритель соляных путей и северный губернатор, Кайгамарама как командующий королевским корпусом рабов, Местрема как казначей и конюший, Чирима как опекун самых молодых принцев и меньшие должности, управляющие подопечными Бирни Газаргамо. Каждая должность имела феодальное владение и место в совете; Слово Май требовало, чтобы согласие совета было обязательным по обычаю." #NT!
  
 kbu_magira_court_bureaucracy: "Суд Магиры" #NT!
 kbu_magira_court_bureaucracy_desc: "Институционализированная должность королевы-матери, занимаемая с раннего периода Канема в качестве конституционного контроля над Май. Магира распоряжалась своей собственной казной, свитой и дворцом в Бирни-Газаргамо, и для возведения на престол нового Май требовалось ее формальное согласие. Самый известный держатель, Айса Кили Нгирмарамма, управляла Борну от своего имени в качестве регента ок. 1564-1570 гг., во времена несовершеннолетия Идриса Алума, и выступил посредником в османском посольстве, которое доставило в королевство турецких инструкторов по мушкетам. Это учреждение было специфичным для Сайфавы и не имело аналогов во всем Сахеле." #NT!
  
 kbu_mamlukan_corps_bureaucracy: "Мамлюканские мушкетеры" #NT!
 kbu_mamlukan_corps_bureaucracy_desc: "Пехотный корпус рабов-солдат, основанный Май Идрисом Алума после его дипломатической миссии в 1574 году к османскому губернатору Триполи Мустафе-паше. Турецкие мастера по строевой подготовке научили солдат-рабов Борну пользоваться фитильным ружьем; Корпус размещался при королевском дворе, черпал соль и провиант из запасов Май и подчинялся Кайгамараме, а не какому-либо провинциальному лорду. Корпус разбил Булалу у Гарни Кияла в 1577 году и оставался основой постоянных сил Борну до джихада Фулани 1808 года." #NT!
  
 kbu_sayfawa_girgam_bureaucracy: "Сайфава Гиргам" #NT!
 kbu_sayfawa_girgam_bureaucracy_desc: "Канцелярия на арабском языке и королевская хроника Сайфава Маис, непрерывно поддерживаемая с одиннадцатого века до падения династии. Гиргам записывал вступление на престол, кампании, браки и гранты каждого маи; его дополнили Диван-салатин Борну и Китаб газават Идрис Ахмада ибн Фурту, имама-летописца Май. В канцелярии работали писцы из улемов и диаспоры Вангара; их указы придавали юридическую силу королевским грантам и связывали последующие поколения обязательствами их отцов." #NT!
  
 kbu_kambasokis_compact_bureaucracy: "Камбасокис Компакт" #NT!
 kbu_kambasokis_compact_bureaucracy_desc: "Действующее соглашение о дани и выпасе скота, по которому сайфава маис привязывали к трону скотоводческие народы бассейна, канембу, тубу, рыбаков будума с островов озера Чад и туарегов северных границ. Каждый народ отдавал ежегодную дань скотом, солонками, рабами или лошадьми и сезонный набор кавалерии; взамен войска Май держали колодцы открытыми, не допускали налетчиков и соблюдали ротацию выпаса. Договор основывался на обычном праве, а не на письменном кодексе, и тяжелым бременем ложился на оседлых земледельцев вдоль реки Комадугу Йобе." #NT!
