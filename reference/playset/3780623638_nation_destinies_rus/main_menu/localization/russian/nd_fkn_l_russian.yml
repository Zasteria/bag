l_russian:
 STATIC_MODIFIER_NAME_nd_fkn_princes_faith: "Вера принцев" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_princes_faith: "Принцы-епископы Франконии владеют и посохом, и мечом, управляя своими владениями как светские лорды не в меньшей степени, чем духовные пастыри. Под их руководством вера объединяет разрозненные территории единой целью." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_craftsmens_spirit: "Дух мастера" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_craftsmens_spirit: "Мастера-ремесленники Нюрнберга подчиняются не цехам гильдий, а самому городскому совету. Эта система регулируемых инноваций, при которой мастерство вознаграждается и жесткая конкуренция, сделала городские мастерские предметом зависти Европы." #NT!
 nd_fkn.1.t: "Франконский круг" #NT!
 nd_fkn.1.d: "Разрозненные территории Франконии (княжества-епископства, маркграфства, вольные города и рыцарские владения) наконец были объединены под одним знаменем. Но какая традиция будет определять этот союз?\n\nПринцы-епископы Вюрцбурга и Бамберга предлагают модель церковной власти, где духовные убеждения обеспечивают основу для светского управления. Их соборы и резиденции укрепляют веру и знания региона.\n\nС другой стороны, мастера Нюрнберга представляют другой путь. Не обремененные ограничениями гильдий, городские мастерские производят изделия из металла, часы и печатные изделия, которые являются лучшими в Империи. Их изобретательный дух может превратить Франконию в центр инноваций.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_fkn.1.a: "Епископы будут вести наш народ в вере и управлении." #NT!
 nd_fkn.1.b: "Пусть семинары в Нюрнберге осветят путь вперед" #NT!
 nd_fkn.2.t: "Основание Франконского круга" #NT!
 nd_fkn.2.d: "2 июля 1500 года императорский сейм в Аугсбурге учредил Франконский круг как один из шести первоначальных административных округов Империи. Это учреждение дает лоскутному одеялу франконских территорий коллективный голос: Крейстаг, где принцы-епископы, маркграфы, вольные города и имперские рыцари могут координировать оборону, регулировать чеканку монет и сохранять Ландфриден.\n\nСила Круга заключается в сотрудничестве между его разнообразными членами. Но некоторые видят возможность утвердить независимость Франконии в рамках Империи, наращивая военный потенциал, который в первую очередь служит нашим интересам." #NT!
 nd_fkn.2.a: "Сотрудничество укрепляет всех нас" #NT!
 nd_fkn.2.b: "Мы должны рассчитывать на свои силы" #NT!
 nd_fkn.3.t: "Крестьянская война во Франконии." #NT!
 nd_fkn.3.d: "Весна 1525 года принесла во Франконию революцию. Крестьянские банды под руководством таких лидеров, как Флориан Гейер и его грозный Черный отряд, пронеслись по долине Таубер, штурмуя замки и требуя прав, в которых давно отказано. Самая большая крестьянская армия во всей Германии собралась под Вюрцбургом, угрожая самой резиденции епископской власти.\n\nВосстание будет подавлено; в этом нет никаких сомнений. Но память о «Черном отряде» Гейера и «Двенадцати статьях» сохранится. Мы должны решить, как восстанавливать: с помощью уступок, направленных на решение законных проблем, или с восстановлением железной руки благородной власти." #NT!
 nd_fkn.3.a: "Устраните коренные причины недовольства" #NT!
 nd_fkn.3.b: "Наведите порядок железной рукой" #NT!
 nd_fkn.4.t: "Соборы Франконии" #NT!
 nd_fkn.4.d: "Великие соборы Бамберга и Вюрцбурга являются памятниками вековой преданности франконцев. В Бамбергском соборе, основанном святым императором Генрихом II в 1007 году, находится загадочная Бамбергер Рейтер: первая монументальная конная скульптура со времен античности, коронованный всадник, чья истинная личность остается загадкой.\n\nВ Вюрцбурге романский собор, посвященный святому Килиану, является якорем духовной жизни Нижней Франконии. Вместе эти дома Бога являются не просто местами поклонения, но и местами обучения, хранилищами искусства и символами переплетенной духовной и светской власти, которая определяет франконское управление." #NT!
 nd_fkn.4.a: "Их шпили будут стоять до тех пор, пока сама Франкония" #NT!
 STATIC_MODIFIER_NAME_nd_fkn_circle_cooperation: "Круг сотрудничества" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_circle_cooperation: "Франконский круг функционирует как модель имперского сотрудничества, его Крайстаг объединяет различные сословия для поддержания мира и координации обороны." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_circle_independence: "Круг Самообеспеченности" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_circle_independence: "Вместо того, чтобы зависеть от имперских структур, Франкония наращивает свой собственный военный потенциал, гарантируя, что Круг сможет защитить себя на своих собственных условиях." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_peasant_concessions: "Крестьянские концессии" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_peasant_concessions: "После Крестьянской войны взвешенные реформы направлены на решение некоторых проблем, которые заставили таких людей, как Флориан Гейер, к восстанию." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_peasant_suppression: "Восстановленная власть" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_peasant_suppression: "Дворянство силой подтверждает свои прерогативы, гарантируя, что беспорядки 1525 года никогда не повторятся." #NT!
 nd_fkn_stem_duchy_heritage: "Наследие герцогства Стем" #NT!
 nd_fkn_stem_duchy_heritage_desc: "Франкония была родиной династии Салиан, чьи короли и императоры правили Империей из этого центра Восточной Франции." #NT!
 nd_fkn_ritterschaft: "Риттершафт" #NT!
 nd_fkn_ritterschaft_desc: "Имперские рыцари Франконии образуют отдельный военный класс, подчиняющийся непосредственно Императору, а не какому-либо территориальному принцу." #NT!
 nd_fkn_main_river_viticulture: "Виноградарство на главной реке" #NT!
 nd_fkn_main_river_viticulture_desc: "На склонах реки Майн расположен крупнейший в Европе средневековый винодельческий регион, где к 14 веку было возделано более 40 000 гектаров земли." #NT!
 nd_fkn_cathedral_foundations: "Фундамент собора" #NT!
 nd_fkn_cathedral_foundations_desc: "Соборы Бамберга и Вюрцбурга закрепляют духовную самобытность Франконии, служа центрами обучения, искусства и церковной власти." #NT!
 nd_fkn_nuremberg_metalcraft: "Нюрнберг Металлкрафт" #NT!
 nd_fkn_nuremberg_metalcraft_desc: "Мастера Нюрнберга производят изделия из металла непревзойденной точности — от церковных колоколов и доспехов до ножниц, ювелирных украшений и гвоздей — и все это под пристальным вниманием городского совета." #NT!
 nd_fkn_episcopal_governance: "Епископальное управление" #NT!
 nd_fkn_episcopal_governance_desc: "Принцы-епископы Франконии обладают как духовной, так и светской властью, управляя своими территориями как церковные князья Империи." #NT!
 nd_fkn_bamberg_flowering: "Культурный расцвет Бамберга" #NT!
 nd_fkn_bamberg_flowering_desc: "Культурный ренессанс Бамберга, от загадочной скульптуры Всадника до покровительства искусству и образованию, поднимает репутацию Франконии во всем христианском мире." #NT!
 nd_fkn_imperial_city_charters: "Уставы Имперского города" #NT!
 nd_fkn_imperial_city_charters_desc: "Нюрнберг, Ротенбург и Швайнфурт имеют уставы вольных имперских городов, подчиняющихся только императору и управляющих собственной торговлей и правосудием." #NT!
 nd_fkn_nuremberg_printing: "Нюрнбергская типография" #NT!
 nd_fkn_nuremberg_printing_desc: "Мастерская Кобергера в Нюрнберге производит «Нюрнбергскую хронику» и другие шедевры, что делает город центром европейской полиграфической революции." #NT!
 nd_fkn_circle_administration: "Администрация Круга" #NT!
 nd_fkn_circle_administration_desc: "Франконский крайстаг координирует оборону, чеканку монет и поддержание мира на разнообразных территориях епископов, маркграфов и вольных городов Круга." #NT!
 nd_fkn_peasant_war_legacy: "Наследие крестьянской войны" #NT!
 nd_fkn_peasant_war_legacy_desc: "Разрушительная Крестьянская война 1525 года и Черный отряд Флориана Гейера оставили глубокие уроки о силе и ярости простых людей Франконии." #NT!
 nd_fkn_cannon_foundries: "Пушечные литейные заводы" #NT!
 nd_fkn_cannon_foundries_desc: "Опыт Нюрнберга в области металлообработки естественным образом распространяется и на производство оружия: литейные заводы отливают пушки и куют вооружение для армий Империи.\n\n#italic Доступно в: $nd_fkn_meisterhaus$#!" #NT!
 nd_fkn_confessional_frontier: "Конфессиональный рубеж" #NT!
 nd_fkn_confessional_frontier_desc: "Франкония находится на линии разлома между католическими и протестантскими территориями, что заставляет ее правителей прагматично преодолевать конфессиональные противоречия." #NT!
 nd_fkn_kreisarmee_reforms: "Реформы Крайсармии" #NT!
 nd_fkn_kreisarmee_reforms_desc: "Военные силы Круга профессионализируются и превращаются в полноценную Крейсармию, набирающую дисциплинированных солдат из городов и обученных рекрутов из сельской местности." #NT!
 nd_fkn_nuremberg_clockworks: "Нюрнбергский часовой завод" #NT!
 nd_fkn_nuremberg_clockworks_desc: "Портативные часы Питера Генлайна с пружинным приводом «Нюрнбергские яйца» представляют собой вершину точного машиностроения и прославили город на всю Европу.\n\n#italic Доступно в: $nd_fkn_meisterhaus$#!" #NT!
 nd_fkn_landfrieden_enforcement: "Правоприменение Ландфридена" #NT!
 nd_fkn_landfrieden_enforcement_desc: "Круг берет на себя ответственность за поддержание Имперского мира в своих границах, подавление междоусобиц и грабежей на дорогах для обеспечения безопасности торговых путей.\n\n#italic Доступно в: $nd_fkn_residenz$#!" #NT!
 nd_fkn_franconian_baroque: "Франконское барокко" #NT!
 nd_fkn_franconian_baroque_desc: "Великолепная Вюрцбургская резиденция Бальтазара Ноймана и местные церкви в стиле барокко представляют собой расцвет франконских художественных достижений.\n\n#italic Доступно в: $nd_fkn_residenz$#!" #NT!
 nd_fkn_standing_kreiskompanie: "Постоянная Крайскомпания" #NT!
 nd_fkn_standing_kreiskompanie_desc: "Постоянные гарнизонные силы поддерживают порядок и защищают границы Круга, оснащенные артиллерией известных литейных заводов Франконии." #NT!
 nd_fkn_commercial_code: "Торговый кодекс" #NT!
 nd_fkn_commercial_code_desc: "Единый кодекс коммерческого права регулирует торговлю на разрозненных территориях Франконии, уменьшая разногласия и поощряя торговую деятельность." #NT!
 nd_fkn_episcopal_scholarship: "Епископальная стипендия" #NT!
 nd_fkn_episcopal_scholarship_desc: "Научные традиции Вюрцбургского университета и Бамберга выпускают ученых и администраторов, которые служат как церкви, так и государству." #NT!
 nd_fkn_civic_enlightenment: "Гражданское Просвещение" #NT!
 nd_fkn_civic_enlightenment_desc: "Городская традиция гражданского самоуправления Франконии обеспечивает благодатную почву для идеалов разума, образования и конституционной реформы Просвещения." #NT!
 nd_fkn_industrial_modernization: "Промышленная модернизация" #NT!
 nd_fkn_industrial_modernization_desc: "Многовековые ремесленные традиции трансформируются в современное производство по мере того, как франконские мастерские внедряют промышленные методы и новые материалы.\n\n#italic Доступно в: $nd_fkn_meisterhaus$#!" #NT!
 nd_fkn_national_integration: "Национальная интеграция" #NT!
 nd_fkn_national_integration_desc: "Непонятная мозаика франконских территорий (епископства, маркграфства, вольные города и рыцарские владения) начинает сливаться в единое целое." #NT!
 nd_fkn_constitutional_reforms: "Конституционные реформы" #NT!
 nd_fkn_constitutional_reforms_desc: "Либеральное управление заменяет старый режим княжеского абсолютизма и клерикальной власти, принося во Франконию представительные институты." #NT!
 a_nd_fkn_ritter: "Франконский Риттер" #NT!
 a_nd_fkn_ritter_desc: "Тяжелая кавалерия Имперских рыцарей, набранная из франконского Риттершафта и подчинявшаяся непосредственно Императору." #NT!
 a_nd_fkn_stadtsoldat: "Нюрнбергский Штадтсолдат" #NT!
 a_nd_fkn_stadtsoldat_desc: "Дисциплинированные городские солдаты, собранные из бюргеров и гарнизона Нюрнберга, прошедшие подготовку в военной системе городского совета." #NT!
 a_nd_fkn_feldbatterie: "Франконская полевая батарея" #NT!
 a_nd_fkn_feldbatterie_desc: "Батареи полевой артиллерии, отлитые на знаменитых литейных заводах Нюрнберга, сочетают в себе превосходную франконскую металлообработку с новейшими артиллерийскими технологиями." #NT!
 levy_nd_fkn_ritter: "Франконский Риттер Леви" #NT!
 levy_nd_fkn_ritter_desc: "Благородная кавалерия, собранная из франконских Риттершафтов, имперских рыцарей, подчиняющихся императору." #NT!
 levy_nd_fkn_stadtsoldat: "Нюрнбергский городской совет Леви" #NT!
 levy_nd_fkn_stadtsoldat_desc: "Городское ополчение, набранное из горожан и профессиональных солдат Нюрнберга и других вольных имперских городов." #NT!
 nd_fkn_meisterhaus: "Мейстерхаус" #NT!
 nd_fkn_meisterhaus_desc: "Мастерская Нюрнбергского мастера, где квалифицированные мастера производят изделия из металла, инструменты и точные инструменты в соответствии с регулируемой системой городского совета." #NT!
 nd_fkn_residenz: "Резиденция принца-епископа" #NT!
 nd_fkn_residenz_desc: "Место епископского управления, где князь-епископ осуществляет как духовную власть, так и светское господство над своими территориями." #NT!
 nd_fkn_weinberghaus: "Вайнбергхаус" #NT!
 nd_fkn_weinberghaus_desc: "Франконское винодельческое хозяйство на солнечных склонах долины Майн, производящее уникальные вина, которые когда-то составляли крупнейший винодельческий регион Европы." #NT!
 nd_fkn_druckerei: "Друкерей" #NT!
 nd_fkn_druckerei_desc: "Нюрнбергская типография, где мастера-печатники печатают книги, брошюры и листовки, которые распространяют знания и реформы по всей Империи." #NT!
 nd_fkn_pm_metalworking: "Нюрнберг Металлообработка" #NT!
 nd_fkn_pm_metalworking_desc: "Мастера-ремесленники куют инструменты, инструменты и оборудование из франконского железа и меди." #NT!
 nd_fkn_pm_arms_production: "Производство оружия" #NT!
 nd_fkn_pm_arms_production_desc: "Мастерская переключается на военное производство, куя мечи, доспехи и стволы пушек для армий Круга." #NT!
 nd_fkn_pm_clockworks: "Точные часовые механизмы" #NT!
 nd_fkn_pm_clockworks_desc: "Следуя инновациям Питера Генлайна, мастерская производит часы с пружинным приводом и точные инструменты." #NT!
 nd_fkn_pm_industrial_tooling: "Промышленная оснастка" #NT!
 nd_fkn_pm_industrial_tooling_desc: "Современные методы превращают традиционную металлообработку в производство промышленной стали." #NT!
 nd_fkn_pm_meisterhaus_maintenance: "Содержание мастерской" #NT!
 nd_fkn_pm_meisterhaus_maintenance_desc: "Текущие расходы на содержание кузнечного оборудования, инструментов и цехов." #NT!
 nd_fkn_pm_landfrieden_patrol: "Ландфриденский патруль" #NT!
 nd_fkn_pm_landfrieden_patrol_desc: "Вооруженные патрули поддерживают Имперский мир по всему Кругу, подавляя бандитизм и вражду на торговых путях." #NT!
 nd_fkn_pm_baroque_patronage: "Барокко Меценатство" #NT!
 nd_fkn_pm_baroque_patronage_desc: "Щедрые инвестиции в искусство и архитектуру барокко превращают Резиденцию в памятник франконских культурных достижений." #NT!
 nd_fkn_pm_residenz_maintenance: "Содержание Резиденции" #NT!
 nd_fkn_pm_residenz_maintenance_desc: "Для поддержания резиденции князя-епископа необходимы камень, стекло и административные принадлежности." #NT!
 nd_fkn_pm_wine_production: "Франконское вино" #NT!
 nd_fkn_pm_wine_production_desc: "Отличительные вина долины Майн разливаются по бутылкам и продаются, продолжая традиции виноградарства, восходящие к эпохе Карла Великого." #NT!
 nd_fkn_pm_weinberghaus_maintenance: "Уход за виноградниками" #NT!
 nd_fkn_pm_weinberghaus_maintenance_desc: "Уход за виноградниками, обслуживание винных погребов и оборудования для прессования." #NT!
 nd_fkn_pm_printing: "Нюрнбергская типография" #NT!
 nd_fkn_pm_printing_desc: "Мастера-полиграфисты выпускают книги и брошюры, продолжая традиции мастерской Кобергера." #NT!
 nd_fkn_pm_druckerei_maintenance: "Пресс-поддержка" #NT!
 nd_fkn_pm_druckerei_maintenance_desc: "Обслуживание печатных станков, наборов шрифтов и оборудования мастерской." #NT!
 potential: "Потенциал" #NT!
 potential_desc: "Условия, необходимые для данного метода производства." #NT!
 nd_fkn_formed_tt: "была образована Франкония." #NT!
 nd_fkn_path_a_tt: "Путь Князей Веры выбран" #NT!
 nd_fkn_path_b_tt: "Был выбран путь Духа Мастера." #NT!
 nd_fkn.5.t: "Судьба Франконии" #NT!
 nd_fkn.5.d: "Франконский круг наконец-то объединился, его разрозненные территории объединились под единой идеей. Независимо от того, руководствуемся ли мы посохом или молотом мастера, выбор, который мы делаем сейчас, определит наш путь в грядущие века." #NT!
 nd_fkn.5.a: "Наша судьба ждет" #NT!
 nd_fkn.6.t: "Архиепископская власть" #NT!
 nd_fkn.6.d: "Майнц перешел под наш контроль: резиденция примаса Германии, главного архиепископства Священной Римской империи. Вместе с древним монастырем Фульда эти церковные основы помещают Франконию в духовное сердце христианского мира к северу от Альп. Принцы-епископы теперь говорят голосом, вызывающим уважение по всей Империи." #NT!
 nd_fkn.6.a: "Церковь руководит нашим царством" #NT!
 nd_fkn.7.t: "См. Предстоятеля" #NT!
 nd_fkn.7.d: "Три рейнских архиепископства (Майнц, Кельн и Трир), курфюрсты, коронующие императоров и определяющие судьбу Империи, теперь признают власть Франконии. Такая концентрация церковной власти является беспрецедентной со времен самого Карла Великого.\n\nМы можем использовать эту власть, чтобы объединить разнообразные народы Рейнской области в централизованное целое, или мы можем инвестировать в сами епископские суды, сделав их центрами обучения и обращения, которые преобразуют культуру изнутри." #NT!
 nd_fkn.7.a: "Объединение Рейнской области под одной властью" #NT!
 nd_fkn.7.b: "Инвестируйте в наши епископские суды и школы" #NT!
 nd_fkn.8.t: "Защитник веры" #NT!
 nd_fkn.8.d: "От Ахена, где был коронован Карл Великий, до Зальцбурга, где Бонифаций водрузил крест среди язычников, все великие архиепископства немецких земель находятся под управлением франконцев. Ни одно королевство в христианском мире не обладает такой концентрацией духовной власти.\n\nЭта сила предлагает выбор: будет ли Франкония служить мечом веры, католическим защитником, готовым защитить Церковь от всех угроз? Или нам следует пойти по пути Ландфридена: использовать нашу власть для установления мира и стабильности на раздробленном ландшафте Империи?" #NT!
 nd_fkn.8.a: "Мы будем мечом веры" #NT!
 nd_fkn.8.b: "Мы будем гарантами мира" #NT!
 nd_fkn.9.t: "Имперская свободная торговля" #NT!
 nd_fkn.9.d: "Крупнейшие ярмарки Франкфурта теперь проходят под флагом Франконии. Город, где коронуются императоры и купцы со всей Европы собираются для обмена товарами, является доказательством того, что франконское мастерство и коммерческая хватка могут сравниться с любым соперником. Поскольку банковские учреждения укореняются в наших городах, будущее принадлежит тем, кто управляет потоками капитала." #NT!
 nd_fkn.9.a: "Пусть коммерция процветает под нашим присмотром" #NT!
 nd_fkn.10.t: "Мастерская Империи" #NT!
 nd_fkn.10.d: "Мастерские Франконии стали двигателем экономики Империи. От прецизионных инструментов Нюрнберга до товаров, проходящих через наши рынки, наши мастера устанавливают стандарты, которым стремятся соответствовать другие. Инструменты, изготовленные в наших городах, строят здания, куют оружие и приводят в движение механизмы прогресса по всей Центральной Европе.\n\nМы можем углубить наше мастерство как таковое, инвестируя в традицию Мейстера, которая гарантирует качество превыше всего, или мы можем использовать свое положение для обеспечения привилегий на торговых ярмарках, которые привлекают торговлю со всего континента." #NT!
 nd_fkn.10.a: "Инвестируйте в наших мастеров и их ремесло" #NT!
 nd_fkn.10.b: "Обеспечить выставочные привилегии для наших городов" #NT!
 nd_fkn.11.t: "Трудолюбивая революция" #NT!
 nd_fkn.11.d: "Преобразование завершено. От средневековых мастерских до современных мануфактур – Франкония стала лидером трудолюбивой революции, переделывающей старый порядок. Банковские дома Аугсбурга и торговые ярмарки Лейпцига теперь вращаются вокруг франконских предприятий, а гул машин заменил звон кузнечного молота.\n\nЭта новая власть требует нового порядка. Должны ли мы принять фабрику и печь, двигаясь вперед с промышленными амбициями, независимо от того, какие старые пути они вытесняют? Или нам следует направить нашу коммерческую мощь на построение нового типа гражданского общества, в котором купцы и ремесленники будут управлять собой в духе свободных имперских городов?" #NT!
 nd_fkn.11.a: "Завод – это будущее" #NT!
 nd_fkn.11.b: "Пусть торговый дух правит нашей республикой" #NT!
 nd_fkn_destiny: "Судьба Франконии" #NT!
 nd_fkn_destiny_desc: "Франконский круг был создан. Теперь его судьба должна исполниться: либо благодаря авторитету посоха, либо благодаря изобретательности мастерской." #NT!
 nd_fkn_dest_archbishopric: "Архиепископская власть" #NT!
 nd_fkn_dest_archbishopric_desc: "Закрепите великое архиепископство Майнца и монастырь Фульда, сделав Франконию духовным сердцем Империи." #NT!
 nd_fkn_dest_primate: "См. Предстоятеля" #NT!
 nd_fkn_dest_primate_desc: "Подчинить три рейнских архиепископства (Майнц, Кельн и Трир) франконской власти, командуя курфюрстами, которые коронуют императоров." #NT!
 nd_fkn_dest_defender: "Защитник веры" #NT!
 nd_fkn_dest_defender_desc: "Управляйте четырьмя великими немецкими архиепископствами от Аахена до Зальцбурга, сделав Франконию высшей духовной властью в христианском мире." #NT!
 nd_fkn_dest_free_commerce: "Имперская свободная торговля" #NT!
 nd_fkn_dest_free_commerce_desc: "Обеспечьте себе безопасность на крупнейших торговых ярмарках Франкфурта и используйте современное банковское дело, превратив Франконию в коммерческое сердце Империи." #NT!
 nd_fkn_dest_workshop: "Мастерская Империи" #NT!
 nd_fkn_dest_workshop_desc: "Превратите Франконию в главный производственный центр Империи, а инструменты будут поступать из наших мастерских на рынки Центральной Европы." #NT!
 nd_fkn_dest_industrial: "Трудолюбивая революция" #NT!
 nd_fkn_dest_industrial_desc: "Доминируйте в крупнейших торговых центрах Аугсбурга и Лейпцига, примите участие в индустриализации и возглавьте переход от ремесла к современному производству." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_rhenish_unity: "Рейнское единство" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_rhenish_unity: "Земли вдоль Рейна объединяются под властью франконских епископов, создавая централизованный блок власти в самом сердце Империи." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_episcopal_courts: "Епископальные суды" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_episcopal_courts: "Дворы князей-епископов становятся центрами обучения и церковного управления, формируя культуру и веру своих подданных." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_catholic_champion: "Католический Чемпион" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_catholic_champion: "Франкония выступает как меч католической веры, ее армии готовы защищать Церковь и навязывать свою волю еретикам и неверующим." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_prince_of_peace: "Князь мира" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_prince_of_peace: "Следуя традиции Ландфриденов, Франкония использует свою духовную власть для разрешения споров и поддержания стабильности в расколотой Империи." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_meister_tradition: "Мейстер Традиция" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_meister_tradition: "Система франконских мастеров-ремесленников производит товары такого качества, что на них полагаются армии и мастерские по всей Империи, хотя лучшая работа требует своей цены в материалах." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_trade_fair_privilege: "Выставочная привилегия" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_trade_fair_privilege: "Имперские привилегии предоставляют франконским городам право проводить крупные торговые ярмарки, привлекая торговцев и капитал со всей Европы." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_manufactory_revolution: "Мануфактурная революция" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_manufactory_revolution: "Преобразование из мастерской в ​​фабрику происходит быстрыми темпами, хотя разрушение старых экономических моделей делает королевство менее склонным к дорогостоящим войнам." #NT!
 STATIC_MODIFIER_NAME_nd_fkn_dest_merchant_republic_spirit: "Дух Торговой Республики" #NT!
 STATIC_MODIFIER_DESC_nd_fkn_dest_merchant_republic_spirit: "Гражданские традиции свободных имперских городов вдохновляют новую модель управления, в которой коммерческие интересы и либеральные идеалы формируют государство." #NT!
 nd_fkn_hochstift: "Хохштифт" #NT!
 nd_fkn_hochstift_desc: "Епископский соборно-дворцовый комплекс, где князь-епископ осуществляет как духовную, так и светскую власть, сочетая в себе великую церковь, богословскую школу и резиденцию управления." #NT!
 nd_fkn_handelshaus: "Хандельхаус" #NT!
 nd_fkn_handelshaus_desc: "Франконский торговый дом, который координирует торговлю, складирование и производство под одной крышей, олицетворяя трудолюбивый дух свободных имперских городов." #NT!
 nd_fkn_pm_hochstift_scriptorium: "Епископальный скрипторий" #NT!
 nd_fkn_pm_hochstift_scriptorium_desc: "Ученые и писцы капитула собора создают богословские труды, исторические и административные тексты, которые распространяют влияние епархии." #NT!
 nd_fkn_pm_hochstift_maintenance: "Содержание собора" #NT!
 nd_fkn_pm_hochstift_maintenance_desc: "Содержание собора, его богослужебного убранства и административных помещений княжеско-архиерейского двора." #NT!
 nd_fkn_pm_handelshaus_trade: "Торговая торговля" #NT!
 nd_fkn_pm_handelshaus_trade_desc: "Торговый дом перерабатывает сырье в готовую продукцию, координируя цепочки поставок по всей торговой сети Империи." #NT!
 nd_fkn_pm_handelshaus_maintenance: "Содержание Торгового Дома" #NT!
 nd_fkn_pm_handelshaus_maintenance_desc: "Обслуживание складских, офисных и коммерческих помещений Handelshaus." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_fkn_bureaucracy_authority: "Франконская административная власть" #NT!
 AUTO_MODIFIER_DESC_nd_fkn_bureaucracy_authority: "Единое франконское государство унаследовало многоуровневый аппарат Имперского круга, княжеств-епископств и Нюрнбергского патрициата: наряду с постоянным местом столицы Франкония может содержать еще две бюрократии по своему выбору." #NT!
  
 fkn_kreistag_bureaucracy: "Франкишер Крайстаг" #NT!
 fkn_kreistag_bureaucracy_desc: "Собрание Франконского императорского круга, учреждённое в соответствии с реформой Максимилиана I в 1500 году и собравшееся в Нюрнберге под дуумвиральным управлением епископа Бамбергского и маркграфа Бранденбург-Ансбахского. Крайстаг регистрировал вклад каждого сословия в имперский реестр, избирал судей в Рейхскаммергерихт, контролировал чеканку франконских монет и казнил ландфриденов. Из десяти Имперских кругов это был самый сплоченный и единственный, который поддерживал постоянный набор крейштропов до 1806 года." #NT!
  
 fkn_domkapitel_bureaucracy: "Домкапитель" #NT!
 fkn_domkapitel_bureaucracy_desc: "Кафедральные соборы Бамберга и Вюрцбурга, которые избирали князей-епископов через Валькапитулянен, обязательные к капитуляции на выборах, ограничивали епископское налогообложение, законодательство и назначения. С 15 века Домкапитель Вюрцбурга обычно управлял Hochstift; Бамбергское отделение осуществляло епископское правосудие через свой Hofgericht и лицензировало епархиальную прессу. Ни один князь-епископ не мог обойти его каноны, и место капитула длилось дольше каждого отдельного епископа." #NT!
  
 fkn_innerer_rat_bureaucracy: "Внутренняя Крыса" #NT!
 fkn_innerer_rat_bureaucracy_desc: "Малый совет Нюрнберга, официально оформленный около 1320 года и включенный в список из сорока двух патрицианских семей танцевальным статутом 1521 года. Его семервират Ältere Herren и триумвират Oberste Hauptleute контролировали все городские учреждения; Согласно хартии Сигизмунда 1424 года, совет провел императорские регалии в Heilig-Geist-Spital и организовал ежегодный Heiltumsweisung, положивший начало Нюрнбергской торговой ярмарке. Небольшая олигархия управляла самым богатым свободным городом Империи почти пять столетий." #NT!
  
 fkn_ritterkanton_bureaucracy: "Риттеркантон" #NT!
 fkn_ritterkanton_bureaucracy_desc: "Франконский кантон Имперских рыцарей, организованный при Максимилиане I около 1500 года и официально оформленный в 1577 году как один из трех Риттеркрайзе. Шесть кантонов Франконии (Оденвальд, Гебюрг, Штайгервальд, Альтмюль, Баунах и Рен-Верра) имели своих собственных капитанов, архивы и списки зачисленных. Они платили добровольные благотворительные субсидии императору вместо налогов, а их земли освобождались от любого территориального суверена. Рейхсриттер сформировал дворянство внутри дворянства, структурно враждебное централизации." #NT!
  
 fkn_landfrieden_bureaucracy: "Ландфриде" #NT!
 fkn_landfrieden_bureaucracy_desc: "Региональный постановление об общественном мире, действовавшее во Франконии от Вюрцбургской Ландфриды 1287 года до Эвигера Ландфрида Максимилиана 1495 года и администрируемое после 1500 года комиссарами Ландфриденсварунга Крайстага. Оно объявило вне закона распри между сословиями, провозгласило мир на великих торговых путях от Нюрнберга до Франкфурта и от Вюрцбурга до Эрфурта и преследовало Фриденсбрехера через Reichskammergericht. Там, где он держался, франконские рынки процветали; там, где это не удалось, рейхсриттер возобновил набеги." #NT!
