l_russian:
 STATIC_MODIFIER_NAME_nd_msa_thalassocratic_emporium: "Талассократический торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_msa_thalassocratic_emporium: "Малаккский пролив — это перекресток известного мира, а мы — его привратники. Каждое судно, перевозящее шелк из Китая, специи с Молуккских островов или ткани из Индии, должно проходить через наши воды. Мы построим величайший перевалочный пункт, который когда-либо видел мир." #NT!
 STATIC_MODIFIER_NAME_nd_msa_sultanate_of_the_faithful: "Султанат правоверных" #NT!
 STATIC_MODIFIER_DESC_nd_msa_sultanate_of_the_faithful: "От Хукум Канун Малакки до медресе, разбросанных по нашим городам, Малайский султанат является маяком исламской цивилизации в восточных морях. Наши правовые кодексы управляют торговлей и правосудием, наши ученые освещают веру, а наш султан правит как тень Бога на земле." #NT!
 STATIC_MODIFIER_NAME_nd_msa_maritime_law_enforced: "Морское право соблюдается" #NT!
 STATIC_MODIFIER_DESC_nd_msa_maritime_law_enforced: "Унданг-Унданг Лаут Малакка проводится в жизнь железной рукой. На пиратов охотятся, взимают пошлины, и каждое судно в наших водах подчиняется Лаксамане." #NT!
 STATIC_MODIFIER_NAME_nd_msa_maritime_law_liberal: "Морское право либерализовано" #NT!
 STATIC_MODIFIER_DESC_nd_msa_maritime_law_liberal: "Унданг-Унданг Лаут Малакка поощряет свободный проход и честные деловые отношения. Купцы всех стран знают, что Проливы открыты для честной торговли." #NT!
 STATIC_MODIFIER_NAME_nd_msa_johor_resistance: "Джохорское сопротивление" #NT!
 STATIC_MODIFIER_DESC_nd_msa_johor_resistance: "Падение Малакки укрепило нашу решимость. Из Джохора наследники султаната ведут неутомимую кампанию по возвращению утраченного, черпая силы из джунглей и преданности малайского народа." #NT!
 nd_msa.1.t: "Рождение Малайи" #NT!
 nd_msa.1.d: "Малайский полуостров объединен под единым султанатом впервые со времен великих времен Малакки. Перед нами простираются проливы: самый богатый морской путь в мире, где сходятся богатства Китая, Индии и островов пряностей. Наш двор привлекает ученых и торговцев со всего исламского мира, а Хукум Канун Малакка обеспечивает правовую основу, которой восхищаются от Гуджарата до Гуанчжоу.\n\nНо каким государством будет эта новая Малайя? Должны ли мы опираться на наше господство над Проливами, превращая каждый порт в склад мировой торговли, или нам следует обратить внимание на силу нашей веры и закона, превратив султанат в модель исламского управления, которой будут подражать меньшие правители?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_msa.1.a: "Мы – стражи Проливов." #NT!
 nd_msa.1.b: "Мы слуги Бога и закона." #NT!
 nd_msa.2.t: "Унданг-Унданг Лаут Малакка" #NT!
 nd_msa.2.d: "Морские капитаны султаната собрались при дворе султана, чтобы систематизировать морские законы, регулирующие наши воды. Унданг-Унданг Лаут Мелака, морские законы Малакки, будут регулировать все: от обязанностей капитана корабля до прав пассажиров, от разделения спасательных средств до наказания за мятеж.\n\nСоставленные под руководством Лаксамана, эти законы основаны на многовековой малайской мореходной мудрости и исламской юриспруденции. Они определят, как будет вестись торговля через проливы. Вопрос в том, должны ли эти законы отдавать приоритет строгому соблюдению пошлин и патрулированию по борьбе с пиратством, или же более либеральный подход, поощряющий свободный проход и привлекающий торговцев посредством честных сделок, лучше послужит интересам султаната." #NT!
 nd_msa.2.a: "Лакшамана установит порядок в этих водах." #NT!
 nd_msa.2.b: "Пусть торговцы знают, что Проливы открыты для всех, кто ведет честные дела." #NT!
 nd_msa.3.t: "Падение Малакки и преемник Джохора" #NT!
 nd_msa.3.d: "Малакка, жемчужина Проливов, захвачена иностранной державой. Султан Махмуд Шах, последний правитель старой Малакки, со своим двором и воинами отступил на юг, чтобы основать новую базу в Джохоре. Его сыновья основали султанаты-преемники Джохора и Перака, каждый из которых продолжил традиции и легитимность Малакки.\n\nСултанат Джохор, опираясь на лояльность морских кочевников Оранг Лаут и память о величии Малакки, ведет партизанскую кампанию, чтобы лишить захватчиков контроля над Проливами. Внутренние джунгли служат убежищем, а знание малайцами прибрежных вод дает султанам преимущество, которое не может легко преодолеть ни один иностранный флот. Дух сопротивления пылает ярко." #NT!
 nd_msa.3.a: "Малакка, возможно, и пала, но Малайя выстояла." #NT!
 nd_msa.4.t: "Олово Перака" #NT!
 nd_msa.4.d: "В долинах реки Перак обнаружены богатые месторождения олова. Металл, необходимый для производства олова, бронзы и все чаще для промышленного применения, течет из рудников Перака в порты полуострова, а оттуда по всему миру. Малайская торговля оловом превращает Перак из тихого прибрежного султаната в одно из самых богатых государств Юго-Восточной Азии.\n\nКитайские горняки стекаются на раскопки, торговцы Буги занимаются экспортом, а султан Перака богатеет за счет налогов, взимаемых с каждого слитка, покидающего его территорию. Олово наряду со специями и перцем является основой малайской экономики." #NT!
 nd_msa.4.a: "Пусть олово течет, и богатство придет." #NT!
 nd_msa_orang_laut_alliance: "Альянс Оранг Лаут" #NT!
 nd_msa_orang_laut_alliance_desc: "Оранг Лаут, морской народ, — это глаза и руки султаната на воде. Эти кочевники-мореплаватели патрулируют проливы, отпугивают пиратов и направляют торговые суда в наши порты в обмен на королевское покровительство и титулы." #NT!
 nd_msa_hulubalang_tradition: "Хулубаланг Традиция" #NT!
 nd_msa_hulubalang_tradition_desc: "Хулубаланг — элитные воины малайского двора, присягнувшие служить султану. Вооруженные крисом, кинжалом с волнистым лезвием, священным для малайской военной культуры, они служат одновременно дворцовой стражей и ударными отрядами в бою." #NT!
 nd_msa_entrepot_system: "Перевалочная система" #NT!
 nd_msa_entrepot_system_desc: "Гением Малакки было не производство, а перераспределение. Товары из Китая, Индии, Аравии и островов специй собираются на малайских складах, а затем отправляются по всему известному миру." #NT!
 nd_msa_adat_governance: "Адат Управление" #NT!
 nd_msa_adat_governance_desc: "До ислама и до султаната малайский мир управлялся адатом: обычным правом. Эти древние традиции консенсуса, взаимности и местной власти составляют основу, на которой султанат строит свою администрацию." #NT!
 nd_msa_istana_tradition: "Истана Традиция" #NT!
 nd_msa_istana_tradition_desc: "Истана, королевский дворец, является сердцем малайской политической жизни. Тщательно продуманные придворные церемонии, строгий протокол и ритуальное демонстрирование регалий укрепляют божественный мандат султана и иерархию королевства." #NT!
 nd_msa_bendahara_laksamana: "Система Бендахара-Лакшамана" #NT!
 nd_msa_bendahara_laksamana_desc: "Малайский султанат делит управление между Бендахарой, которая управляет внутренними делами и дипломатией, и Лаксаманой, которая командует флотом и обеспечивает соблюдение морского законодательства. Эта дуалистическая система не позволяет какому-либо отдельному чиновнику накопить слишком много власти." #NT!
 nd_msa_islamic_learning: "Исламские учебные центры" #NT!
 nd_msa_islamic_learning_desc: "Малакка — это не просто торговый порт: это центр исламской науки, где улемы из Аравии, Индии и Явы собираются, чтобы преподавать и дискутировать. Медресе султаната готовят ученых, юристов и администраторов, несущих веру по всему архипелагу." #NT!
 nd_msa_undang_undang_laut: "Унданг-Унданг Лаут Малакка" #NT!
 nd_msa_undang_undang_laut_desc: "Морские законы Малакки регулируют все аспекты морской жизни, от полномочий капитана корабля до обращения с пассажирами и грузом. Составленные под руководством королевской власти, они представляют собой наиболее сложный свод морского права в Юго-Восточной Азии." #NT!
 nd_msa_cosmopolitan_port: "Космополитический порт" #NT!
 nd_msa_cosmopolitan_port_desc: "Гуджаратские мусульмане, тамильские индуисты, китайские буддисты и яванские торговцы свободно общаются на рынках Малакки. Эта толерантность ко всем религиям и культурам – не просто идеализм: это секрет коммерческого успеха порта." #NT!
 nd_msa_penjajap_warships: "Пенджаджапские военные корабли" #NT!
 nd_msa_penjajap_warships_desc: "Пенджаджап — это длинная и узкая военная галера, предназначенная для мелководья Проливов. Быстро и под парусом, и на веслах, эти суда превосходно справляются с набегами, преследованием и прибрежными боями, куда не могут последовать европейские корабли с глубоким килем." #NT!
 nd_msa_lancaran_tradition: "Ланкаранская традиция" #NT!
 nd_msa_lancaran_tradition_desc: "Ланкаран — малайский военный корабль среднего размера, более быстрый, чем джонг, но более тяжеловооруженный, чем рейдовый пераху. Созданные специально для торгового сопровождения и операций по борьбе с пиратством, ланкараны являются «рабочими лошадками» малайского флота." #NT!
 nd_msa_strait_defense: "Сеть обороны пролива" #NT!
 nd_msa_strait_defense_desc: "Сторожевые башни и сигнальные станции вдоль проливов позволяют султанату контролировать все морские перевозки и быстро реагировать на угрозы. Эта сеть превращает узкие воды в оборонительный актив, а не в уязвимость." #NT!
 nd_msa_johor_successor: "Штат-преемник Джохора" #NT!
 nd_msa_johor_successor_desc: "Когда Малакка пала, ее наследники не погибли. Султаны Джохора сохранили легитимность и традиции старой Малакки, ведя партизанскую войну против иностранных оккупантов и поддерживая малайские претензии на проливы." #NT!
 nd_msa_spice_redistribution: "Перераспределение специй" #NT!
 nd_msa_spice_redistribution_desc: "Гвоздика с Молуккских островов, перец с Суматры, корица с Ланки: специи Востока собираются в малайских перевалочных пунктах, где их сортируют, переупаковывают и отправляют дальше на рынки Индии, Аравии и других стран.\n\n#italic Доступно в: $nd_msa_entrepot_warehouse$#!" #NT!
 nd_msa_perak_tin_boom: "Перакская оловянная стрела" #NT!
 nd_msa_perak_tin_boom_desc: "Аллювиальные месторождения олова в долинах реки Перак являются одними из самых богатых в мире. Китайские горняки, посредники Буги и малайские султаны — все получают прибыль от торговли оловом, которая трансформирует экономику полуострова." #NT!
 nd_msa_hukum_kanun: "Хукум Канун Мелака" #NT!
 nd_msa_hukum_kanun_desc: "Хукум Канун Мелака представляет собой всеобъемлющий правовой кодекс, сочетающий в себе исламский шариат и малайское обычное право. Он охватывает конституционное, уголовное, коммерческое и семейное право, обеспечивая правовую основу для управления султанатом." #NT!
 nd_msa_ghali_besar_tradition: "Традиция Гали Бесар" #NT!
 nd_msa_ghali_besar_tradition_desc: "«Гали Бесар», большая галера, является крупнейшим военным кораблем малайского флота. Эти суда, движимые сотнями гребцов и ощетинившиеся поворотными орудиями, защищают Проливы от всех желающих." #NT!
 nd_msa_rivalry_modernization: "Модернизация соперничества" #NT!
 nd_msa_rivalry_modernization_desc: "Конкуренция между малайскими султанатами (Джохор против Ачеха, Перак против Селангора) стимулирует военные инновации. Пороховое оружие, профессиональные солдаты и укрепления, построенные под влиянием Европы, постепенно заменяют старые методы войны." #NT!
 nd_msa_pelabuhan_tradition: "Пелабуханская традиция" #NT!
 nd_msa_pelabuhan_tradition_desc: "Пелабухан, великая гавань, — это больше, чем просто причал. Это автономный торговый район со складами, верфями, таможнями и помещениями для купцов всех наций. Строительство пелабухана объявляет порт открытым для всего мира." #NT!
 nd_msa_bugis_alliance: "Бугис Альянс" #NT!
 nd_msa_bugis_alliance_desc: "Буги Сулавеси известны как свирепые воины и проницательные торговцы. Их союз с малайскими султанатами приносит наемные мечи, торговый опыт и связи с морскими сетями восточного архипелага." #NT!
 nd_msa_court_patronage: "Покровительство суда султаната" #NT!
 nd_msa_court_patronage_desc: "Малайский двор питает богатые литературные и художественные традиции. Хикаят Ханг Туах, Седжара Мелайу и бесчисленное множество других произведений поэзии и истории написаны под королевским патронажем, что сделало малайский язык лингва-франка морской Юго-Восточной Азии." #NT!
 nd_msa_global_pepper: "Глобальная торговля перцем" #NT!
 nd_msa_global_pepper_desc: "Перец из внутренних районов Малайского полуострова и из притоков Суматры поступает на мировые рынки через наши порты. Спрос со стороны Европы, Индии и Китая гарантирует, что перец остается одним из самых ценных товаров в малайской экономике." #NT!
 nd_msa_diaspora_network: "Сеть малайской диаспоры" #NT!
 nd_msa_diaspora_network_desc: "Малайские купцы и поселенцы обитают от берегов Индии до Филиппин, от Сиама до Молуккских островов. Эта обширная диаспора обеспечивает разведку, коммерческие связи и дипломатические рычаги влияния в морской Азии." #NT!
 nd_msa_modern_lancaran: "Современный ланкаранский флот" #NT!
 nd_msa_modern_lancaran_desc: "Ланкаранская традиция развивается со временем. Современные патрульные корабли сочетают в себе европейское такелаж и малайский дизайн корпуса, создавая быстрые и универсальные корабли, идеально подходящие для мелководья, усеянного островами, в водах Проливов." #NT!
 nd_msa_centralized_sultanate: "Централизованный султанат" #NT!
 nd_msa_centralized_sultanate_desc: "Султан ужесточает бразды правления, подчиняя Бендахару и Теменггунг прямой королевской власти. Главы провинций заменяются назначенными губернаторами, систематизируется сбор налогов." #NT!
 nd_msa_tin_industry: "Оловоплавильная промышленность" #NT!
 nd_msa_tin_industry_desc: "Передовые технологии плавки превращают сырую оловянную руду в высококачественные слитки для экспорта. В оловянной промышленности работают тысячи людей, и она приносит огромные доходы казне султаната.\n\n#italic Доступно в: $nd_msa_tin_smeltery$#!" #NT!
 nd_msa_blockade_mastery: "Мастерство блокады" #NT!
 nd_msa_blockade_mastery_desc: "Столетия контроля над самым узким морским путем в Азии дали малайскому флоту непревзойденное понимание ведения блокадной войны. Ни один корабль не проходит через Проливы без ведома и согласия султана." #NT!
 nd_msa_silat_tradition: "Силатская традиция" #NT!
 nd_msa_silat_tradition_desc: "Силат, малайское боевое искусство, из своих многочисленных региональных вариантов превратился в формальную дисциплину, преподаваемую в королевских дворах и военных школах. Изящное, но смертоносное искусство подчеркивает скорость, силу воздействия и смертоносное использование криса." #NT!
 nd_msa_literary_renaissance: "Нусантара Литературный Ренессанс" #NT!
 nd_msa_literary_renaissance_desc: "Малайский язык достигает своего полного расцвета как литературный лингва франка архипелага. От королевских хроник Седжара Мелайу до романтических эпосов традиции Хикаят, малайская литература определяет культурную самобытность региона." #NT!
 nd_msa_modern_harbor: "Современная портовая инфраструктура" #NT!
 nd_msa_modern_harbor_desc: "Паровые краны, глубоководные причалы и склады, построенные по европейским спецификациям, превращают малайские порты в современные коммерческие объекты, способные обрабатывать огромные объемы мировой торговли, проходящей через проливы." #NT!
 nd_msa_national_awakening: "Малайское национальное пробуждение" #NT!
 nd_msa_national_awakening_desc: "Новое поколение малайских интеллектуалов, получивших образование как в исламских, так и в западных традициях, формулирует видение малайской национальной идентичности, выходящее за рамки отдельных султанатов. Идея единой малайской нации укореняется." #NT!
 nd_msa_plantation_economy: "Плантационная экономика" #NT!
 nd_msa_plantation_economy_desc: "Каучук, пальмовое масло и другие плантационные культуры диверсифицируют малайскую экономику, помимо олова и специй. Плодородные почвы и тропический климат полуострова идеальны для крупномасштабного коммерческого сельского хозяйства." #NT!
 nd_msa_naval_modernization: "Модернизация ВМФ" #NT!
 nd_msa_naval_modernization_desc: "Паровые военные корабли и современная артиллерия заменяют галеры и ланкараны прошлого. Малайский флот адаптируется к новой эре морской войны, сохраняя при этом господство в проливах." #NT!
 nd_msa_constitutional_sultanate: "Конституционный султанат" #NT!
 nd_msa_constitutional_sultanate_desc: "Абсолютная власть султана уступает место конституционным рамкам, которые уравновешивают королевскую власть с правами народа. Государством управляет современная бюрократия, а султан сохраняет за собой роль символа и религиозного опекуна." #NT!
 nd_msa_straits_integration: "Интеграция Straits Settlements" #NT!
 nd_msa_straits_integration_desc: "Крупнейшие порты полуострова (Малакка, Пенанг, Сингапур) объединены в единую экономическую зону. Единая таможня, стандартизированные веса и согласованные графики перевозок превращают Проливы в единый торговый объект." #NT!
 n_nd_msa_orang_laut_raider: "Оранг Лаут Рейдер" #NT!
 n_nd_msa_orang_laut_raider_desc: "Оранг Лаут, морской народ, служат султану в качестве нерегулярных военно-морских сил, используя свои глубокие знания прибрежных вод для патрулирования проливов, охоты на пиратов и нападения на вражеские корабли." #NT!
 a_nd_msa_hulubalang: "Хулубаланг" #NT!
 a_nd_msa_hulubalang_desc: "Хулубаланг — элитные воины малайского двора. Вооруженные священным крисом и обученные силату, они служат как дворцовой стражей, так и ударной пехотой, их фанатичная преданность может сравниться только с их навыками ближнего боя." #NT!
 n_nd_msa_penjajap: "Пенджаджап" #NT!
 n_nd_msa_penjajap_desc: "Длинная и узкая боевая галера, предназначенная для мелководья Проливов. Пенджаджап превосходен в быстрых набегах и прибрежных боях, прорываясь через каналы, куда не могут последовать более тяжелые суда." #NT!
 n_nd_msa_lancaran: "Ланкаран" #NT!
 n_nd_msa_lancaran_desc: "Малайский военный корабль среднего размера, сочетающий в себе парус и весло. Ланкаран служит основным судном торгового сопровождения и борьбы с пиратством, достаточно быстрым, чтобы преследовать рейдеров, и достаточно хорошо вооруженным, чтобы сдерживать их." #NT!
 n_nd_msa_ghali_besar: "Гали Бесар" #NT!
 n_nd_msa_ghali_besar_desc: "Огромная галера малайского флота, движимая сотнями гребцов и вооруженная поворотными орудиями. Гали Бесар — инструмент султанской военно-морской власти над Проливами." #NT!
 n_nd_msa_modern_lancaran: "Современный Ланкаран" #NT!
 n_nd_msa_modern_lancaran_desc: "Обновленный патрульный корабль, сочетающий малайскую мелкосидящую конструкцию с современным такелажем и вооружением. Современный ланкаран сохраняет традиционное малайское преимущество в проливных и архипелажных водах." #NT!
 nd_msa_entrepot_warehouse: "Перевалочный склад" #NT!
 nd_msa_entrepot_warehouse_desc: "Огромный складской комплекс, где хранятся, сортируются и пересылаются товары со всего мира. Перевалочный склад представляет собой физическую инфраструктуру малайской посреднической экономики." #NT!
 nd_msa_istana: "Истана" #NT!
 nd_msa_istana_desc: "Истана — королевский дворец малайского султаната, центр политической власти, церемониальных представлений и культурного покровительства. Его сложная архитектура и придворные ритуалы воплощают величие малайской правящей традиции." #NT!
 nd_msa_tin_smeltery: "Оловянный завод" #NT!
 nd_msa_tin_smeltery_desc: "Перерабатывающий завод, где сырая оловянная руда из речных месторождений переплавляется в чистые слитки для экспорта. Металлургический завод представляет собой промышленное сердце процветающей оловянной экономики Перака." #NT!
 nd_msa_madrasa: "Малайское медресе" #NT!
 nd_msa_madrasa_desc: "Исламская школа, где ученые изучают Коран, юриспруденцию и естественные науки. Медресе Малайского султаната готовят юристов, администраторов и религиозных лидеров, которые управляют королевством и распространяют веру." #NT!
 nd_msa_strait_watchtower: "Сторожевая башня пролива" #NT!
 nd_msa_strait_watchtower_desc: "Укрепленный наблюдательный пункт вдоль Малаккского пролива, позволяющий султанату контролировать морское движение, обнаруживать пиратов и координировать военно-морское патрулирование в своих территориальных водах." #NT!
 nd_msa_pelabuhan: "Пелабухан" #NT!
 nd_msa_pelabuhan_desc: "Огромный портовый комплекс с глубоководными причалами, складами, верфями и таможенными объектами. Пелабухан — это торговые ворота султаната, открытые для купцов всех наций." #NT!
 nd_msa_pm_spice_redistribution: "Перераспределение специй" #NT!
 nd_msa_pm_spice_redistribution_desc: "Сортировка и переупаковка специй с восточного архипелага для дальнейшей отправки в Индию, Аравию и Китай." #NT!
 nd_msa_court_ceremony: "Судебная церемония" #NT!
 nd_msa_court_ceremony_desc: "Сложные ритуалы и протоколы малайского королевского двора, в которых потребляются прекрасные шелка и ткани для демонстрации величия." #NT!
 nd_msa_tin_smelting: "Выплавка олова" #NT!
 nd_msa_tin_smelting_desc: "Сырая оловянная руда переплавляется в рафинированные слитки в угольных печах, производя олово на экспорт по всему миру." #NT!
 nd_msa_manuscript_copying: "Копирование рукописи" #NT!
 nd_msa_manuscript_copying_desc: "Транскрипция религиозных текстов, юридических кодексов и литературных произведений ученых медресе." #NT!
 nd_msa_watchtower_upkeep: "Содержание Сторожевой Башни" #NT!
 nd_msa_watchtower_upkeep_desc: "Обеспечение гарнизона сторожевой башни оружием и строительными материалами." #NT!
 nd_msa_harbor_operations: "Портовые операции" #NT!
 nd_msa_harbor_operations_desc: "Постоянные потребности в техническом обслуживании и снабжении крупного торгового порта." #NT!
 levy_nd_msa_hulubalang: "Хулубаланг Леви" #NT!
 levy_nd_msa_hulubalang_desc: "Элитные воины с крисами, состоящие из солдат и знати султаната." #NT!
 levy_nd_msa_penjajap: "Пенджаджап Леви" #NT!
 levy_nd_msa_penjajap_desc: "Боевые галеры с экипажами морских общин Проливов." #NT!
 levy_nd_msa_orang_laut: "Оранг Лаут Леви" #NT!
 levy_nd_msa_orang_laut_desc: "Морские кочевники-рейдеры, патрулирующие прибрежные воды султаната." #NT!
 a_nd_msa_bugis_warrior: "Бугис Воин" #NT!
 a_nd_msa_bugis_warrior_desc: "Свирепые воины-торговцы из Сулавеси, буги служат малайским султанатам как наемные солдаты, так и в качестве торговых посредников. Их умение флангового и агрессивного боя делает их неоценимыми в бою." #NT!
 a_nd_msa_pendekar: "Пендекар" #NT!
 a_nd_msa_pendekar_desc: "Мастера силата, малайского боевого искусства. Пендекары — элитные воины, чья скорость, техника и смертоносное владение крисом делают их разрушительной ударной пехотой." #NT!
 n_nd_msa_modern_corvette: "Современный Корвет" #NT!
 n_nd_msa_modern_corvette_desc: "Патрульный военный корабль паровой эпохи, приспособленный к мелководью, усеянному островами, в водах Проливов. Быстрый и маневренный, современный корвет сохраняет малайскую традицию морского доминирования в индустриальную эпоху." #NT!
 nd_msa_plantation_estate: "Плантация Эстейт" #NT!
 nd_msa_plantation_estate_desc: "Крупное сельскохозяйственное поместье, производящее каучук, пальмовое масло и другие тропические товарные культуры. Плантационная экономика диверсифицирует богатство Малайи за счет олова и специй." #NT!
 nd_msa_plantation_processing: "Обработка плантаций" #NT!
 nd_msa_plantation_processing_desc: "Перечные лозы и другие пряные культуры выращивают, собирают и готовят для прибыльной экспортной торговли." #NT!
 levy_nd_msa_pendekar: "Пендекар Леви" #NT!
 levy_nd_msa_pendekar_desc: "Элитные мастера силата, собранные из воинов султаната." #NT!
 nd_msa_formed_tt: "Малайя была образована" #NT!
 nd_msa_path_a_tt: "Выбрали талассократический торговый центр" #NT!
 nd_msa_path_b_tt: "Выбрали Султанат правоверных" #NT!
 nd_msa_destiny: "Судьба Малайи" #NT!
 nd_msa_destiny_desc: "Малайский полуостров снова объединился. Теперь вопрос в том, чем станет эта новая Малайя: морской империей, охватывающей моря, или маяком исламской цивилизации, освещающим Восток. Стабилизируйте царство и определите свой курс." #NT!
 nd_msa_dest_straits_gateway: "Ворота Проливов" #NT!
 nd_msa_dest_straits_gateway_desc: "Контролируйте оба конца Малаккского пролива, захватив Палембанг на Суматре и Ачех на западном подходе. Поскольку эти великие порты находятся в наших руках, ни один корабль не заходит в Проливы и не выходит из них без согласия Малайзии." #NT!
 nd_msa_dest_spice_monopoly: "Монополия специй" #NT!
 nd_msa_dest_spice_monopoly_desc: "Сказочные богатства островов специй должны течь только через руки малайцев. Захватите Банду и Тернате, два сердца торговли гвоздикой и мускатным орехом, и сделайте наши перевалочные пункты единственными воротами между Востоком и Западом." #NT!
 nd_msa_dest_nusantara_thalassocracy: "Нусантара Талассократия" #NT!
 nd_msa_dest_nusantara_thalassocracy_desc: "От Макассара до Кантона каждый крупный порт восточных морей должен подчиняться султану Малайи. Постройте Эмпориум Агунг, Большой рынок, и докажите, что эпоха малайской талассократии вернулась." #NT!
 nd_msa_dest_hukum_proclaimed: "Провозглашен Хукум Канун" #NT!
 nd_msa_dest_hukum_proclaimed_desc: "Провозгласить Хукум Канун Малакки универсальным правовым кодексом султаната, сочетающим исламский шариат с малайским обычным правом. Используйте институт банковского дела, чтобы формализовать коммерческое право, и позвольте миру увидеть, что малайское правосудие не имеет себе равных." #NT!
 nd_msa_dest_eastern_light: "Свет восточных морей" #NT!
 nd_msa_dest_eastern_light_desc: "Сделать султанат ведущим центром исламского образования к востоку от Багдада. Используйте печатный станок для распространения Корана и юридических наук. Убедитесь, что бумага продается на рынке вашей столицы: чернила ученых — это источник жизненной силы цивилизации." #NT!
 nd_msa_dest_dar_al_islam: "Дар аль-Ислам архипелага" #NT!
 nd_msa_dest_dar_al_islam_desc: "Малайский султанат является бесспорным центром исламской цивилизации в восточном мире. Примите научную революцию, развивайте свое царство до величия и завершите паломничество, взяв под свою защиту саму Мекку." #NT!
 nd_msa.5.t: "Судьба Малайи" #NT!
 nd_msa.5.d: "Полуостров объединен, проливы закреплены. Но это только начало. Нас ждет великая судьба: та, которая будет зависеть от решений, которые мы сделаем в предстоящие годы. Традиции наших предков освещают путь вперед." #NT!
 nd_msa.5.a: "Наша судьба разворачивается перед нами." #NT!
 nd_msa.6.t: "Ворота Проливов под защитой" #NT!
 nd_msa.6.d: "От Ачеха на западе до Палембанга на юге подходы к Малаккскому проливу теперь находятся под контролем Малайзии. Каждое торговое судно, перевозящее шелк, специи или фарфор, должно проходить через воды, по которым действует приказ султана. Великая система перевалочных операций теперь может функционировать в полную силу: никакая конкурирующая держава не сможет перенаправить торговлю вокруг нас." #NT!
 nd_msa.6.a: "Проливы наши." #NT!
 nd_msa.7.t: "Мастера торговли специями" #NT!
 nd_msa.7.d: "Банда и Тернате, легендарные острова специй, теперь подчиняются султану Малайи. Гвоздика, мускатный орех и мускатный орех, которых жаждет мир, проходят через наши склады, прежде чем попасть в какой-либо зарубежный порт. Эта монополия дает нам огромную власть. Но как нам им воспользоваться?\n\nМы могли бы развивать наши дипломатические отношения, используя торговлю, чтобы привязать к себе союзников и подданных посредством процветания. Или мы могли бы вооружить наш торговый флот, гарантируя, что любая страна, которая осмелится бросить вызов нашей монополии, столкнется со всей силой малайской военно-морской мощи." #NT!
 nd_msa.7.a: "Торговля связывает мир с нами." #NT!
 nd_msa.7.b: "Наши купцы плывут с заряженными пушками." #NT!
 nd_msa.8.t: "Нусантара Талассократия" #NT!
 nd_msa.8.d: "От перцовых садов Суматры до фарфоровых печей Гуанчжоу, от оловянных рудников Перака до гвоздичных рощ Тернате — малайская талассократия охватывает восточные моря. Эмпориум Агунг возвышается в нашем величайшем порту: рынке невообразимого масштаба, где сходятся богатства трех континентов.\n\nСможем ли мы консолидировать эту империю посредством торговли и централизованного управления, сделав наших бюргеров самыми богатыми в мире? Или мы должны заявить о себе как о неоспоримом морском гегемоне, гарантируя, что наше военно-морское превосходство не подлежит сомнению?" #NT!
 nd_msa.8.a: "Пусть Эмпориум Агунг станет нашим памятником." #NT!
 nd_msa.8.b: "Моря склоняются перед Малайей." #NT!
 nd_msa.9.t: "Провозглашен Хукум Канун" #NT!
 nd_msa.9.d: "На торжественной церемонии при дворе султана Хукум Канун Малаки провозглашается универсальным юридическим кодексом королевства. Исламский шариат и малайский адат переплетаются во всеобъемлющую систему права, регулирующую торговлю, семью, уголовное правосудие и конституционные вопросы. Торговцы со всего Индийского океана признают справедливость и изысканность малайских судов." #NT!
 nd_msa.9.a: "Пусть на наших землях царит справедливость." #NT!
 nd_msa.10.t: "Свет восточных морей" #NT!
 nd_msa.10.d: "Ученые из Аравии, Персии, Индии и Явы стекаются в медресе султаната. Издание Корана и юридических комментариев шрифтом Джави способствует распространению исламских знаний во всех уголках архипелага. Наши суды известны своей образованностью, а наши судьи своей мудростью.\n\nДолжны ли мы формализовать шариатскую судебную систему, привнося исламскую юриспруденцию во все аспекты управления? Или нам следует инвестировать в расширение сети медресе, сделав султанат интеллектуальной столицей исламского Востока?" #NT!
 nd_msa.10.a: "Закон должен быть нашей основой." #NT!
 nd_msa.10.b: "Знание – это самая истинная форма поклонения." #NT!
 nd_msa.11.t: "Дар аль-Ислам архипелага" #NT!
 nd_msa.11.d: "Султанат достиг того, чего не добилось ни одно другое мусульманское государство к востоку от Дели: создания настоящего Дар аль-Ислама, охватывающего моря от Малайского полуострова до священных городов Аравии. Дарул Хукум становится высшим выражением нашей приверженности исламскому управлению.\n\nСможем ли мы использовать это положение для централизации власти под руководством султана как повелителя правоверных, подчиняя знать божественному закону? Или мы станем маяком веры, который возвышает всех наших людей посредством образования, культуры и общественной солидарности?" #NT!
 nd_msa.11.a: "Султан – тень Бога." #NT!
 nd_msa.11.b: "Вера принадлежит всем верующим." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_entrepot_dominance: "Доминирование перевалочного пункта" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_entrepot_dominance: "Наша торговая сеть связывает с нами страны посредством взаимного процветания. Каждый двор в Азии знает, что малайская дружба означает доступ к богатейшим рынкам мира." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_armed_trade: "Вооруженная торговля" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_armed_trade: "Наши торговые суда ходят с заряженными орудиями и готовыми к бою экипажами. Торговая монополия Малайзии поддерживается не только торговым превосходством, но и подавляющей военно-морской силой." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_world_emporium: "Всемирный торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_world_emporium: "Эмпориум Агунг считается величайшим рынком восточного мира, памятником малайскому коммерческому гению, где граждане дюжины стран торгуют по малайским законам." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_maritime_hegemon: "Морской гегемон" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_maritime_hegemon: "Ни один флот не осмелится бросить вызов малайскому превосходству в восточных морях. От Малаккского пролива до Южно-Китайского моря флот султана является окончательным арбитром всех морских споров." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_sharia_courts: "Шариатские суды" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_sharia_courts: "Официальные шариатские суды применяют исламские законы на всей территории султаната, обеспечивая справедливость и стабильность, одновременно регулируя коммерческую деятельность под божественным руководством." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_madrasa_network: "Сеть медресе" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_madrasa_network: "Разветвленная сеть медресе обучает жителей султаната как религиозным наукам, так и мирским наукам, расширяя границы знаний на исламском Востоке." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_ummah_united: "Умма Юнайтед" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_ummah_united: "Султан правит как командующий правоверными, подчиняя старый аристократический порядок божественному закону. Духовная власть исходит от короны, связывая умму под единым праведным правителем." #NT!
 STATIC_MODIFIER_NAME_nd_msa_dest_beacon_of_faith: "Маяк веры" #NT!
 STATIC_MODIFIER_DESC_nd_msa_dest_beacon_of_faith: "Султанат сияет как маяк исламской цивилизации, где общинная солидарность и научное превосходство ведут всех верующих к более просвещенному будущему." #NT!
 nd_msa_emporium_agung: "Торговый центр Агунг" #NT!
 nd_msa_emporium_agung_desc: "Большой рынок: колоссальный торговый комплекс, где сходятся товары трех континентов. Шелк из Китая, специи с Молуккских островов, ткани из Индии и серебро из Японии переходят из рук в руки под одной крышей, регулируемой малайским торговым законодательством." #NT!
 nd_msa_emporium_operations: "Операции в торговом центре" #NT!
 nd_msa_emporium_operations_desc: "Ежедневная деятельность Эмпориума Агунг требует огромного количества материалов для содержания складов, доков и административных помещений." #NT!
 nd_msa_darul_hukum: "Дарул Хукум" #NT!
 nd_msa_darul_hukum_desc: "Дом Закона: грандиозный комплекс, сочетающий в себе верховный шариатский суд, королевскую библиотеку и медресе высочайшего уровня. Это институциональное сердце малайского исламского управления, где юриспруденция и наука служат вере." #NT!
 nd_msa_darul_hukum_operations: "Суд юриспруденции" #NT!
 nd_msa_darul_hukum_operations_desc: "Текущая деятельность Дарул Хукум требует научных материалов, религиозных принадлежностей и административных товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_msa_bureaucracy_authority: "Султанат Малайского аппарата" #NT!
 AUTO_MODIFIER_DESC_nd_msa_bureaucracy_authority: "Четыре столпа официальной власти Малакки (Бендахара, Пенгулу Бендахари, Теменггунг, Лаксамана) превратились в постоянный административный аппарат, печать канцелярии признается от Пасаи до Патани, главы Хукум Кануна переплетаются в чистые рукописи на каждой скамейке прибрежных кади. На этом фундаменте отличительные институты малайского государства начинают принимать свою прочную форму." #NT!
  
 msa_bendahara_grand_vizierate_bureaucracy: "Бендахара Гранд-Визират" #NT!
 msa_bendahara_grand_vizierate_bureaucracy_desc: "Высший гражданский пост Малаккского султаната, который в золотой век королевства занимал Тун Перак (ок. 1456–1498), который, будучи Бендахарой, управлял королевством через пять султанов, отразил два сиамских вторжения в 1456 и 1488 годах, а также управлял канцелярией, иностранными делами и дворянскими назначениями из своей резиденции в Букит-Китай. Эта должность передавалась по наследству в линии Тун; на практике Бендахара был де-факто первым министром, пока председательствовал султан. Это учреждение пережило падение Малакки: Бендахары Джохора в конечном итоге основали отколовшееся государство Паханг в 1770 году и стали самостоятельными султанами." #NT!
  
 msa_laksamana_admiralty_bureaucracy: "Адмиралтейство Лаксамана" #NT!
 msa_laksamana_admiralty_bureaucracy_desc: "Должность адмирала флота, которую по традиции Малакки занимал знаменитый Ханг Туа и его преемники. Лаксамана командовал королевским келулусом, возглавлял султанскую охрану хулубаланг и охранял Проливы от пиратов и непокорных вассалов от Пасаи до Патани. После 1511 года заведение переехало вместе с султаном в Джохор; его керис прижимался к горлу любого вождя, не уплатившего дань. Офис сохранялся и в период существования федерации Бугис-Риау как военно-морское подразделение Ям Туан Муда." #NT!
  
 msa_hukum_kanun_bureaucracy: "Хукум Канун Мелака" #NT!
 msa_hukum_kanun_bureaucracy_desc: "Юридический кодекс, составленный при султане Музаффар-шахе (годы правления 1446-1459) и усовершенствованный при Махмуд-шахе (годы правления 1488-1511), сохранился примерно в тридцати рукописных редакциях по всему малайскому миру. В его сорока четырех главах исламский шариат сочетался с малайским адатом, а кодекс был принят в качестве справочного текста более поздними султанатами Джохор, Паханг, Кедах и Патани. Компаньон Унданг-Унданг Лаут Мелака, морской постановление Махмуд Шаха, регулировал управление судами, грузовые споры и прибыль от плавания и был обязательным для каждого судна, плавающего под регистром Малакки от Мерги до Малуку." #NT!
  
 msa_shahbandaria_bureaucracy: "Шахбандария четырех четвертей" #NT!
 msa_shahbandaria_bureaucracy_desc: "Четыре портовых офицера Малакки, каждый из которых управляет зарегистрированным иностранным торговым сообществом перевалочного пункта в Восточной Суме Томе Пиреса (ок. 1515 г.): Шахбандар гуджаратцев, Шахбандар тамилов и пегу, Шахбандар яванцев, Малуку и Лусона и Шахбандар китайцев и чампа. Каждый взимал импортные пошлины по опубликованной ставке, распределял складские участки, разрешал споры внутри своей общины в соответствии со своим собственным обычным правом и представлял своих торговцев в канцелярии Бендахары. Это учреждение сделало Малакку управляемой как для короны, так и для торговцев." #NT!
  
 msa_orang_laut_compact_bureaucracy: "Оранг Лаут Танах-Эйр Компакт" #NT!
 msa_orang_laut_compact_bureaucracy_desc: "Институциональное соглашение между малайским троном и морскими кочевниками Оранг Лаут с архипелагов Риау-Лингга и Туджух, согласно которому морские люди обладали обычными правами на определенные территориальные воды (танах воздух, «земля и вода») в обмен на военно-морскую службу султану. Как засвидетельствовано в отчете «Седжара Мелайу» о Санг Нила Утаме, договор предоставил Малакке и Джохору группу пилотов, нерегулярных военно-морских вспомогательных сил и информаторов, чье знание каждого рифа от Сингапура до Лингги было непревзойденным. Суку Оранг Лаут из Бентана и Галанга были создателями королей Джохора: их переход к Бугис Ям Туан Муда в 1722 году сделал федерацию Бугис-Риау доминирующим малайским государством." #NT!
