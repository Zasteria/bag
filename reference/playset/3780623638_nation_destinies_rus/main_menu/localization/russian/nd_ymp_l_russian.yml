l_russian:
  # === Variable tooltips === 
 nd_ymp_formed_tt: "Провозглашена Империя Ямато." #NT!
 nd_ymp_path_a_tt: "Империя идет по пути континентального завоевания Хидэёси." #NT!
 nd_ymp_path_b_tt: "Империей управляет континентальная бюрократия бакуфу." #NT!
 nd_ymp_path_c_tt: "Империя воплощает собой китайско-японский синтез." #NT!
  
  # === Static modifier names and descriptions === 
 STATIC_MODIFIER_NAME_nd_ymp_continental_conquest: "Континентальное завоевание Хидэёси" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_continental_conquest: "Бакуфу отвергает сакоку. Армии самураев, разгромившие Японию Сэнгоку, теперь маршируют на Корею, Ляодун и Янцзы. Вторжение Имджина в 1592 году увенчалось успехом, но Тайко погиб при попытке." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_imperial_bureaucracy: "Императорская бюрократия Токугава" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_imperial_bureaucracy: "Администрация Эдо, спроектированная на континенте. Ханьские губернаторы управляют Кореей и Маньчжурией. В императорской канцелярии работают ученые-конфуцианцы. Трон из хризантем возвышается над всем." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_sino_japanese_synthesis: "Китайско-японский синтез" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_sino_japanese_synthesis: "Корейская письменность, наука Мин и японские ритуалы сливаются в единую восточноазиатскую имперскую цивилизацию. Три Учения, одна империя. Ученые и самураи — одна каста." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_invasion_logistics: "Логистика вторжения Имджин" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_invasion_logistics: "Хидэеси усвоил урок: армию, которая пересекает море, нужно кормить через море. Континентальные склады снабжения заменяют логистику кратковременных рейдов." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_disciplined_columns: "Дисциплинированные колонки" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_disciplined_columns: "Трехрядный вращающийся залповый огонь и колонная тренировка асигару, отточенная годами боевых действий на корейской земле." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_yi_sun_sin_legacy: "Наследие И Сун Сина" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_yi_sun_sin_legacy: "Адмирал разгромил нас при Хансандо. Мы захватили его корабли. Его тактика теперь принадлежит императорскому флоту." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_pacific_dominance: "Тихоокеанское доминирование" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_pacific_dominance: "Геобуксон, атакэбуне и сэкибунэ патрулируют все морские пути от Хоккайдо до Макао." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_sacred_sovereignty: "Священный суверенитет" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_sacred_sovereignty: "Микадо больше не является пленным священником в Киото. Трон из хризантем – политический центр империи." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_imperial_household: "Министерство императорского двора" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_imperial_household: "Кунайсё управляет континентальными поместьями императора, так же как бакуфу управляет королевством." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_daimyo_protectorates: "Протектораты даймё" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_daimyo_protectorates: "Корейские и Маньчжурские провинции предоставляются в качестве континентального хана старшему даймё. Верность в обмен на землю вдали от Эдо." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_direct_imperial_rule: "Прямое имперское правление" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_direct_imperial_rule: "Бакуфу правит через префектов, назначенных в Эдо, а не через наследственных лордов. Континентальные налоги поступают непосредственно в имперскую казну." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_national_essence: "Кокутай: национальная сущность" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_national_essence: "Империя — это не государство с правителем; это правитель с государством. Теология Кокутай объединяет корейских и китайских подданных в императорское тело." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_pan_asian_emperorship: "Паназиатское императорство" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_pan_asian_emperorship: "Император Ямато претендует на Небесный Мандат, который когда-то принадлежал Сыну Неба в Пекине. Корея, Рюкю, Тонкин и Тайвань признают его." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_syncretic_clergy: "Три Учения Духовенства" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_syncretic_clergy: "Буддийский монах, конфуцианский учёный и синтоистский священник обучаются в одних и тех же академиях. Империя объединяет их в одно тело." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_scholar_priests: "Ученые-священники" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_scholar_priests: "Духовенство империи читает ханьскую классику, декламирует сутры Махаяны и совершает синтоистские обряды. Грамотность – это религиозная добродетель." #NT!
  
  # === Formation event === 
 nd_ymp.1.t: "Провозглашение Империи Ямато" #NT!
 nd_ymp.1.d: "Из Цусимы в Эдо доходят долгожданные новости: Пхеньян взят, Хансон пал, города Янцзы сдали дань. Вторжение в Имджин, начатое Тоётоми Хидэёси в 1592 году, наконец-то увенчалось успехом. Бакуфу отвергает старый изоляционистский совет; сакоку не будет запечатан. Даймё, сражавшиеся от Пусана до Желтой реки, возвращаются в Эдо в качестве губернаторов континента. Корейские ученые стоят рядом с буддийскими настоятелями в императорской канцелярии. Микадо, освобожденный из своего золотого плена в Киото, принимает печать хризантемы как правитель не маленького архипелага, а всей Восточной Азии.\n\nОт Хоккайдо до Янцзы простирается империя. Теперь бакуфу должно решить, какой империей стать.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ymp.1.a: "Континентальное завоевание Хидэёси" #NT!
 nd_ymp.1.b: "Континентальная бюрократия бакуфу" #NT!
 nd_ymp.1.c: "Три учения, одна цивилизация" #NT!
  
  # === Advance DHE: Imjin Doctrine === 
 nd_ymp.2.t: "Кодифицированная доктрина Имджина" #NT!
 nd_ymp.2.d: "Уроки неудачного первого вторжения Хидэеси были сведены к ручному обучению. Генералы, высадившиеся в Пусане в 1592 году, возвращались домой в 1598 году голодными, потому что корабли снабжения не успевали за марширующими колоннами. Новая доктрина несентиментальна: армия, которая пересекает море, должна сначала построить линию снабжения, а потом вести сражения. Замки возвышаются на каждом перевалочном пункте между Пусаном и Пхеньяном, прежде чем один-единственный асигару продвигается вглубь страны. Бакуфу решило, что второе вторжение не провалится." #NT!
 nd_ymp.2.a: "Сначала постройте дороги снабжения" #NT!
 nd_ymp.2.b: "Просверлите колонны, пока они не маршируют во сне" #NT!
  
  # === Advance DHE: Geobukseon Adoption === 
 nd_ymp.3.t: "Корабли-черепахи — наши" #NT!
 nd_ymp.3.d: "Адмирал Ли Сун-Син потопил первый флот вторжения в Хансандо с помощью крытых военных кораблей с железной крышей, о которых наши корабелы даже не догадывались. Теперь те же самые корабелы, привезенные из арсеналов эпохи Чосон в Эдо в качестве оплачиваемых мастеров своего дела, строят геобуксон для имперского флота. Ирония ни для кого не ускользнула: корабль, победивший Хидэёси, стал его флагманом. Первый Тихоокеанский флот, оснащенный железной броней, летает на хризантеме." #NT!
 nd_ymp.3.a: "Чествование Ли Сун Сина в императорском военно-морском храме" #NT!
 nd_ymp.3.b: "Отправьте новый флот, чтобы доминировать на всех маршрутах Тихого океана." #NT!
  
  # === Advance DHE: Chrysanthemum Throne === 
 nd_ymp.4.t: "Восхождение на трон хризантем" #NT!
 nd_ymp.4.d: "На протяжении веков Микадо был священным узником: заключенным в Киото, которому оказывались ритуальные почести, и который был лишен политической власти. Империя Ямато положила этому конец. Кику-но-гомон, шестнадцатилепестковая хризантема, больше не является печатью пленного священника. Это имперский стандарт от Эдо до Пхеньяна и Янцзы. Указы императора издаются одновременно с указами бакуфу, и учёные-конфуцианцы в Пекине клянутся подчиняться им обоим." #NT!
 nd_ymp.4.a: "Микадо правит со священным величием." #NT!
 nd_ymp.4.b: "Императорский дом управляет как великий офис." #NT!
  
  # === Advance DHE: Continental Bakufu === 
 nd_ymp.5.t: "Бакуфу охватывает континенты" #NT!
 nd_ymp.5.d: "Сёгунат, который когда-то управлял только родными островами, теперь управляет корейскими префектурами, гарнизонами Ляодуна и налоговыми системами Янцзы. Даймё, владеющие феодальными владениями в Пусане, посещают Эдо так же охотно, как и те, кто владеет феодальными владениями в Сендае. Имперский ямэнь, созданный по образцу бюрократических бюро Мин, но укомплектованный конфуцианцами, прошедшими обучение самураев, занимается сбором континентальных налогов. Вопрос в том, доверить ли управление великим домам даймё или передать всю администрацию непосредственно имперской канцелярии." #NT!
 nd_ymp.5.a: "Предоставить континентальный хан верному даймё" #NT!
 nd_ymp.5.b: "Управление через имперских префектов Эдо." #NT!
  
  # === Advance DHE: Kokutai Ideology === 
 nd_ymp.6.t: "Доктрина национальной сущности" #NT!
 nd_ymp.6.d: "Теологи кокутай, опираясь на возрождение местной науки Мотоори Норинагой и на конфуцианский идеал мудреца-императора, формулируют нечто новое: доктрину имперского суверенитета как космического принципа. Империя — это не государство, в котором есть император. Империя — это император, и его подданные, японцы, корейцы или китайцы, разделяют его божественное происхождение только через лояльность. Доктрина одновременно натурализует корейских и китайских подданных как имперские тела и гарантирует превосходство Ямато над ними." #NT!
 nd_ymp.6.a: "Держите доктрину близко к сердцу: суть родных островов" #NT!
 nd_ymp.6.b: "Проецируйте доктрину наружу: паназиатский император" #NT!
  
  # === Advance DHE: Three Teachings === 
 nd_ymp.7.t: "Синтезированные три учения" #NT!
 nd_ymp.7.d: "В новых континентальных академиях учебная программа объединяет то, что другие империи держали отдельно. Ученый-самурай утром изучает конфуцианскую классику, днем ​​— сутры Махаяны, в сумерках — синтоистскую литургию. Ни одна из этих традиций, как правила императорской канцелярии, не противоречит другим. Будда — проявление ками; конфуцианский мудрец — буддийский бодхисаттва; соблюдение ритуалов и политическое управление являются формами одной практики. Эдо заменяет Киото, Хансон и Пекин в качестве резиденции всех трех традиций одновременно." #NT!
 nd_ymp.7.a: "Обучайте духовенство всем трем традициям вместе" #NT!
 nd_ymp.7.b: "Требуйте от грамотной элиты освоить все три классики" #NT!
  
  # === Advance localization === 
 nd_ymp_imperial_heian_inheritance: "Императорское наследие Хэйан" #NT!
 nd_ymp_imperial_heian_inheritance_desc: "Микадо, ритуальный владыка со времен Хэйан-кё, возвращает себе светскую власть. Континентальная империя основана на самой древней имперской линии в Восточной Азии." #NT!
  
 nd_ymp_wakou_maritime_tradition: "Морские традиции Вако" #NT!
 nd_ymp_wakou_maritime_tradition_desc: "Пираты-торговцы Цусимы и Гото на протяжении веков совершали набеги на корейское и китайское побережья. Их мореплавание, переданное имперскому флоту, становится проекцией силы на Тихом океане." #NT!
  
 nd_ymp_yamabushi_orders: "Приказы Ямабуси" #NT!
 nd_ymp_yamabushi_orders_desc: "Горно-аскетические воины горы Хиэй и Коясан привносят монашескую дисциплину в императорскую службу. Солдаты столько же, сколько священники, священники столько же, сколько солдаты." #NT!
  
 nd_ymp_mahayana_state_patronage: "Государственный патронаж Махаяны" #NT!
 nd_ymp_mahayana_state_patronage_desc: "Школы Тэндай и Сингон становятся оружием имперского государства. Великие пагоды возвышаются в Эдо, Хансоне и Янчжоу как места имперско-буддийской легитимности." #NT!
  
 nd_ymp_yamashiro_fortifications: "Укрепления Ямасиро" #NT!
 nd_ymp_yamashiro_fortifications_desc: "Архитектура горного замка, усовершенствованная для пересеченной местности родных островов, экспортируется через границы Кореи и Маньчжурии." #NT!
  
 nd_ymp_continental_ambition: "Континентальные амбиции" #NT!
 nd_ymp_continental_ambition_desc: "С момента возникновения единого бакуфу Эдо смотрит на запад, через Цусиму. Континент является естественным объектом японской мощи." #NT!
  
 nd_ymp_atakebune_doctrine: "Доктрина Атакебуне" #NT!
 nd_ymp_atakebune_doctrine_desc: "Корабли-замки с пушечным вооружением, высокие и медленные, доминируют в сражениях на близкой воде, которые определяют контроль над морем в Восточной Азии." #NT!
  
 nd_ymp_tanegashima_firearms: "Танегасима огнестрельное оружие" #NT!
 nd_ymp_tanegashima_firearms_desc: "Аркебуза с фитильным замком, скопированная с португальских кораблей, потерпевших кораблекрушение в Танегасиме в 1543 году, массово производится в имперских арсеналах в масштабах, которые затмевают европейские." #NT!
  
 nd_ymp_daimyo_patronage: "Покровительство даймё искусству" #NT!
 nd_ymp_daimyo_patronage_desc: "Утонченность Хигасиямы: чайная церемония, роспись тушью, отсутствие театра, полировка меча. Императорское додзё придерживается всего этого как одной традиции боевой эстетики." #NT!
  
 nd_ymp_lacquerware_mastery: "Мастерство лаковых изделий" #NT!
 nd_ymp_lacquerware_mastery_desc: "Мастерские Вадзима и Этидзэн, десятилетиями совершенствующие применение уруси, производят сосуды, ценимые от Пекина до Лиссабона." #NT!
  
 nd_ymp_ikko_suppression: "Подавление Икко-икки" #NT!
 nd_ymp_ikko_suppression_desc: "Ода и Хидэёси разбили воинствующую конфедерацию Чистой Земли. Бакуфу унаследовал континент без независимых религиозных армий." #NT!
  
 nd_ymp_concentric_castles: "Концентрическая архитектура замка" #NT!
 nd_ymp_concentric_castles_desc: "Каменные донжоны в стиле адзути с перекрывающимися полями огня из аркебуз стали стандартными имперскими укреплениями, воздвигнутыми на каждом узком проходе между Пусаном и Пхеньяном." #NT!
  
 nd_ymp_nanban_trade: "Нанбан Трейд" #NT!
 nd_ymp_nanban_trade_desc: "Португальские караки привозят китайский шелк, индийские специи и серебро Нового Света в экономику Тихоокеанского региона. Имперские брокеры в Нагасаки контролируют этот поток." #NT!
  
 nd_ymp_imjin_doctrine: "Доктрина Имджина" #NT!
 nd_ymp_imjin_doctrine_desc: "Хидэеси потерпел неудачу, потому что его каналы снабжения не соответствовали его амбициям. Новая доктрина заключается в том, что сначала снабжение, а затем продвижение. Континентальные армии Ямато никогда не голодают." #NT!
  
 nd_ymp_ashigaru_musket_ranks: "Звания мушкетов Асигару" #NT!
 nd_ymp_ashigaru_musket_ranks_desc: "Трехрядный вращающийся залповый огонь — имперское совершенство тактики Оды — сбивает кавалерийские атаки от Маньчжурии до Янчжоу." #NT!
  
 nd_ymp_geobukseon_adoption: "Принятие геобуксеона" #NT!
 nd_ymp_geobukseon_adoption_desc: "Корейский корабль-черепаха с железной крышей, победивший первое вторжение, теперь строится на имперских верфях Эдо и Цусима. Флагман империи – это захваченная идея." #NT!
  
 nd_ymp_continental_cavalry: "Континентальная кавалерия" #NT!
 nd_ymp_continental_cavalry_desc: "Самураи, тренировавшиеся на узких тропах Хонсю, теперь мчатся по маньчжурской степи. Буси адаптируются или умрут." #NT!
  
 nd_ymp_continental_castles: "Континентальные замки" #NT!
 nd_ymp_continental_castles_desc: "Пхеньян, Хансон, Ляоян. Японские каменные донжоны возвышаются над корейскими стенами и китайскими сырцовыми кирпичами. Континент переделывается в архитектуре Ямато." #NT!
  
 nd_ymp_pacific_trade_routes: "Тихоокеанские торговые пути" #NT!
 nd_ymp_pacific_trade_routes_desc: "Серебро Манилы, шелк Макао и лаковая посуда Эдо движутся на императорском основании. Тихий океан больше не является испанским озером." #NT!
  
 nd_ymp_diplomatic_reach: "Дипломатический охват" #NT!
 nd_ymp_diplomatic_reach_desc: "Императорские посланники в Пекине, Хансоне, Маниле, Лхасе и Бангкоке несут печать с хризантемой. Империя обращается со всеми соседями как с равными или превосходящими." #NT!
  
 nd_ymp_chrysanthemum_throne: "Хризантемовый трон" #NT!
 nd_ymp_chrysanthemum_throne_desc: "Кику-но-гомон больше не является придворным приемом пленного императора. Это императорская печать континентальной империи. Микадо правит фактически и по форме." #NT!
  
 nd_ymp_continental_bakufu: "Континентальный бакуфу" #NT!
 nd_ymp_continental_bakufu_desc: "Бакуфу управляет корейскими префектурами и маньчжурскими гарнизонами через ханьских губернаторов и имперский ямен. Сёгунат пересек море." #NT!
  
 nd_ymp_three_teachings: "Три Учения" #NT!
 nd_ymp_three_teachings_desc: "Буддизм Махаяны, конфуцианский классицизм и синтоистские ритуалы сливаются в единую имперскую ортодоксальность. Ни одному из трех не разрешено претендовать на первенство над остальными." #NT!
  
 nd_ymp_samurai_officer_corps: "Самурайский офицерский корпус" #NT!
 nd_ymp_samurai_officer_corps_desc: "Наследственная каста воинов становится профессиональным офицерским составом имперской армии. От Маньчжурии до Кюсю самураи командуют на всех уровнях." #NT!
  
 nd_ymp_confucian_examinations: "Конфуцианские экзамены" #NT!
 nd_ymp_confucian_examinations_desc: "Бакуфу принимает экзаменационную систему Мин, модифицированную для получения статуса самурая. В каждом континентальном ямене работают учёные-самураи, сдавшие императорские экзамены." #NT!
  
 nd_ymp_continental_garrisons: "Континентальные гарнизоны" #NT!
 nd_ymp_continental_garrisons_desc: "Постоянные имперские полки удерживают каждый крупный корейский и маньчжурский город. Завоеванные провинции никогда больше не станут непобедимыми." #NT!
  
 nd_ymp_lacquerware_export: "Императорский экспорт лаковых изделий" #NT!
 nd_ymp_lacquerware_export_desc: "Семинары даймё в Вадзиме, Этидзене и Хансоне масштабируются до объемов мировой торговли. Лаковая посуда Yamato – предмет роскоши в каждом европейском дворе." #NT!
  
 nd_ymp_kokutai_ideology: "Кокутай Имперская идеология" #NT!
 nd_ymp_kokutai_ideology_desc: "Доктрина национальной сущности: имперская линия является источником японской идентичности, а имперское тело поглощает в себя корейских и китайских подданных." #NT!
  
 nd_ymp_imperial_censorate: "Имперский цензор" #NT!
 nd_ymp_imperial_censorate_desc: "Цензоры в стиле Мин, но укомплектованные учеными, прошедшими самурайское обучение и подчиняющиеся Эдо, проверяют каждого губернатора континента на предмет коррупции и нелояльности." #NT!
  
 nd_ymp_pacific_command: "Тихоокеанское морское командование" #NT!
 nd_ymp_pacific_command_desc: "Имперский флот, больше не являющийся флотом береговой обороны, осуществляет командование в открытом море от Хоккайдо до Южно-Китайского моря." #NT!
  
 nd_ymp_population_integration: "Континентальная интеграция населения" #NT!
 nd_ymp_population_integration_desc: "Корейские и китайские подданные постепенно ассимилируются с имперским гражданством. Империя представляет собой единое тело субъектов по закону и по идеологии." #NT!
  
 nd_ymp_han_state_building: "Ханьское государственное здание" #NT!
 nd_ymp_han_state_building_desc: "Континентальные хан, созданные по образцу системы хан на родных островах, но значительно более крупные, систематически развиваются. Дороги, рынки, школы, зернохранилища." #NT!
  
 nd_ymp_imperial_workshops: "Императорские Мастерские" #NT!
 nd_ymp_imperial_workshops_desc: "Императорские шелковые фабрики и печи для обжига фарфора вобрали в себя корейские и минские техники. Монопольная продукция империи превосходит всех азиатских конкурентов." #NT!
  
 nd_ymp_sankin_kotai_continentalized: "Континентальный Санкин-котай" #NT!
 nd_ymp_sankin_kotai_continentalized_desc: "Даймё из Кореи и Маньчжурии-хан посещают Эдо по тому же графику, что и лорды родных островов. Империю объединяет путешествие." #NT!
  
 nd_ymp_early_meiji_modernization: "Ранняя промышленная модернизация" #NT!
 nd_ymp_early_meiji_modernization_desc: "Империя индустриализируется на поколение раньше исторической Японии. На смену мастерским даймё пришли паровые мельницы, литейные заводы и верфи." #NT!
  
 nd_ymp_imperial_army_modernization: "Модернизация Имперской Армии" #NT!
 nd_ymp_imperial_army_modernization_desc: "Призывные дивизии европейского образца, обученные офицерами-самураями, развернуты по всему континенту. Крупнейшая постоянная армия в Восточной Азии." #NT!
  
 nd_ymp_imperial_navy_modernization: "Модернизация Имперского Флота" #NT!
 nd_ymp_imperial_navy_modernization_desc: "Паровые броненосцы, построенные в Эдо и Йокосуке. Тихий океан патрулирует самый современный флот к востоку от Суэца." #NT!
  
 nd_ymp_pan_asianism: "Паназиатство" #NT!
 nd_ymp_pan_asianism_desc: "Доктрина о том, что Восточной Азией должен руководить Ямато, становится имперской политикой. Дипломаты в Бангкоке, Хюэ, Маниле и Лхасе передают это послание." #NT!
  
 nd_ymp_continental_rail: "Континентальная железная дорога" #NT!
 nd_ymp_continental_rail_desc: "От Эдо до Хансона, от Пхеньяна до Пекина — железом и паром. Континент связан единой имперской железнодорожной сетью." #NT!
  
 nd_ymp_imperial_schools: "Имперские школы" #NT!
 nd_ymp_imperial_schools_desc: "Всеобщее государственное школьное образование пропагандирует доктрину кокутай, имперскую лояльность и стандартизированную грамотность от Хоккайдо до Янцзы." #NT!
  
 nd_ymp_civilization_mission: "Миссия Цивилизации Ямато" #NT!
 nd_ymp_civilization_mission_desc: "Империя берет на себя обязанность цивилизовать Восточную Азию по своему образу и подобию. Доктрина, которая оправдывает континентальный порядок для себя." #NT!
  
  # === Unit localization === 
 n_nd_ymp_sekibune: "Секибуне" #NT!
 n_nd_ymp_sekibune_desc: "Галера рейда Вако. Легкий, быстрый, заполненный морской пехотой для абордажа и высадки на берег." #NT!
  
 a_nd_ymp_yamabushi: "Ямабуси" #NT!
 a_nd_ymp_yamabushi_desc: "Горно-аскетические монахи-воины гор Хиэй и Коясан. Бесстрашный в горном бою, движимый религиозным рвением." #NT!
  
 n_nd_ymp_imperial_atakebune: "Императорский Атакебуне" #NT!
 n_nd_ymp_imperial_atakebune_desc: "Флагман класса Хидэёси. Высокий корабль-замок, ощетинившийся пушками, построенный для того, чтобы сокрушать корейский и китайский флоты в ближнем бою." #NT!
  
 a_nd_ymp_continental_ashigaru: "Континентальный Асигару" #NT!
 a_nd_ymp_continental_ashigaru_desc: "Вооруженная мушкетами крестьянская пехота, подготовленная для континентальных кампаний. Удар залпов аркебуз на Маньчжурском полигоне." #NT!
  
 n_nd_ymp_imperial_geobukseon: "Императорский Гебуксон" #NT!
 n_nd_ymp_imperial_geobukseon_desc: "Корейский корабль-черепаха с железной крышей, победивший первое вторжение. Теперь построенный на императорских дворах и развевающийся под штандартом хризантемы." #NT!
  
 a_nd_ymp_imperial_samurai_cavalry: "Императорская самурайская кавалерия" #NT!
 a_nd_ymp_imperial_samurai_cavalry_desc: "Буси приспособился к бою в маньчжурской степи. Копье, лук и катана на выносливой континентальной лошадиной коже." #NT!
  
 a_nd_ymp_imperial_musketeers: "Имперские мушкетеры" #NT!
 a_nd_ymp_imperial_musketeers_desc: "Профессиональные мушкетные полки под руководством самураев. Стоящая линейная пехота императорской континентальной армии." #NT!
  
 n_nd_ymp_imperial_man_of_war: "Имперский военный корабль" #NT!
 n_nd_ymp_imperial_man_of_war_desc: "Военный корабль тихоокеанского класса. Тяжелая конструкция артиллерийской палубы подходит для контроля над морем на больших расстояниях от Хоккайдо до Макао." #NT!
  
 a_nd_ymp_imperial_conscripts: "Имперские призывники" #NT!
 a_nd_ymp_imperial_conscripts_desc: "Современная линейная пехота призывника, оснащенная по европейскому образцу и возглавляемая офицерами, обученными самураями. Массовая армия имперского индустриального Ямато." #NT!
  
  # === Levy localization === 
 levy_nd_ymp_imperial_samurai: "Императорский самурай Леви" #NT!
 levy_nd_ymp_imperial_samurai_desc: "Конница Буси, вызванная из континентальной Хань. Конный костяк императорской армии." #NT!
  
 levy_nd_ymp_yamabushi: "Ямабуси Леви" #NT!
 levy_nd_ymp_yamabushi_desc: "Монахи-воины, выросшие на великих храмовых землях. Религиозные боевики на императорской службе." #NT!
  
 levy_nd_ymp_continental_ashigaru: "Континентальный Асигару Леви" #NT!
 levy_nd_ymp_continental_ashigaru_desc: "Вооруженные мушкетами крестьяне-призывники, собранные в корейских, маньчжурских и китайских провинциях для участия в континентальных кампаниях." #NT!
  
  # === Building localization === 
 nd_ymp_imperial_chancery: "Императорская канцелярия" #NT!
 nd_ymp_imperial_chancery_desc: "Административный центр континентального правительства Микадо, созданный по образцу Хэйан-кё, но укомплектованный учеными-самураями, получившими конфуцианское образование." #NT!
  
 nd_ymp_great_pagoda: "Большая Императорская Пагода" #NT!
 nd_ymp_great_pagoda_desc: "Буддийский комплекс Тэндай и Сингон имперского масштаба. Место проведения государственно-буддийской литургии от Эдо до Хансона и Янцзы." #NT!
  
 nd_ymp_continental_castle: "Континентальный замок Ямасиро" #NT!
 nd_ymp_continental_castle_desc: "Японская архитектура горных замков экспортируется по всему континенту. Каменный донжон, перекрывающиеся поля аркебуз, постоянный гарнизон." #NT!
  
 nd_ymp_arsenal_foundry: "Литейный завод Императорского Арсенала" #NT!
 nd_ymp_arsenal_foundry_desc: "Заводы по массовому производству огнестрельного оружия произошли от традиции Танегасима и были адаптированы для оснащения континентальных армий." #NT!
  
 nd_ymp_imperial_dojo: "Императорское Додзё" #NT!
 nd_ymp_imperial_dojo_desc: "Академия подготовки офицеров, где самураев обучают владению мечом, луком, копьем, каллиграфии и конфуцианской классике как единой боевой эстетической дисциплине." #NT!
  
 nd_ymp_lacquer_workshop: "Императорская лаковая мастерская" #NT!
 nd_ymp_lacquer_workshop_desc: "Традиции мастерских Вадзима и Этидзэн масштабировались для имперского экспорта. Многослойные сосуды уруси ценятся от Пекина до Лиссабона." #NT!
  
 nd_ymp_atakebune_shipyard: "Верфь Атакебуне" #NT!
 nd_ymp_atakebune_shipyard_desc: "Имперский военно-морской литейный завод, построенный для производства атакэбуне, гебуксон и тихоокеанских военных кораблей в промышленных масштабах." #NT!
  
 nd_ymp_imperial_yamen: "Императорский Ямен" #NT!
 nd_ymp_imperial_yamen_desc: "Континентальный административный офис в стиле Мин, в котором работают учёные-конфуцианцы, прошедшие самураи. Лицо бакуфу в завоеванных провинциях." #NT!
  
 nd_ymp_scholar_samurai_academy: "Ученый-Самурайская Академия" #NT!
 nd_ymp_scholar_samurai_academy_desc: "Конфуцианское экзаменационное заведение, где студенты-самураи готовятся к императорским экзаменам. Буси и бюрократы обучались как одна каста." #NT!
  
 nd_ymp_kokutai_shrine: "Императорский храм Кокутай" #NT!
 nd_ymp_kokutai_shrine_desc: "Национальная святыня имперского культа. Место, где теология кокутай связывает корейских, китайских и японских подданных с хризантемовым троном." #NT!
  
 nd_ymp_imperial_arsenal: "Императорский промышленный арсенал" #NT!
 nd_ymp_imperial_arsenal_desc: "Оружейный завод эпохи пара производит современное огнестрельное оружие, пушки и артиллерию для имперской призывной армии." #NT!
  
  # === Production method localization === 
 nd_ymp_chancery_upkeep: "Содержание канцелярии" #NT!
 nd_ymp_chancery_upkeep_desc: "Бумага, чернильные камни, лакированная мебель, книги. Административный аппарат имперского правительства." #NT!
  
 nd_ymp_pagoda_devotion: "Пагода Преданность" #NT!
 nd_ymp_pagoda_devotion_desc: "Сутры переписывались на императорской бумаге, восковых свечах, благовониях и пиломатериалах для залов поклонения." #NT!
  
 nd_ymp_castle_garrison: "Содержание гарнизона замка" #NT!
 nd_ymp_castle_garrison_desc: "Оружие, средства передвижения, униформа и провиант для постоянного гарнизона замка." #NT!
  
 nd_ymp_continental_garrison_pm: "Стандарт континентального гарнизона" #NT!
 nd_ymp_continental_garrison_pm_desc: "Континентальный гарнизон, оснащенный огнестрельным оружием. Рисовые пайки и запасы аркебуз для корейских и маньчжурских приграничных фортов." #NT!
  
 nd_ymp_tanegashima_production: "Производство огнестрельного оружия Танегасима" #NT!
 nd_ymp_tanegashima_production_desc: "Железо, уголь и древесина питают линии по производству фитильных замков-аркебуз, унаследованные от мастеров Танегасима." #NT!
  
 nd_ymp_firearms_workshop: "Модернизированный цех огнестрельного оружия" #NT!
 nd_ymp_firearms_workshop_desc: "Производство имперского огнестрельного оружия на селитре, предназначенное для континентальных армий." #NT!
  
 nd_ymp_dojo_upkeep: "Содержание Додзё" #NT!
 nd_ymp_dojo_upkeep_desc: "Полированные мечи, лакированные ножны, официальные одежды и учебные пособия. Эстетически-боевой стандарт имперских самураев." #NT!
  
 nd_ymp_lacquerware_production: "Производство лаковых изделий" #NT!
 nd_ymp_lacquerware_production_desc: "Многослойные уруси поверх деревянных сосудов, отполированные до глубины. Стандартный имперский экспортный сорт." #NT!
  
 nd_ymp_export_lacquerware: "Имперский экспортный лак" #NT!
 nd_ymp_export_lacquerware_desc: "Позолоченные лаковые изделия на шелковой подкладке, предназначенные для европейских княжеских кабинетов. Высший сорт продукции императорских мастерских." #NT!
  
 nd_ymp_shipyard_upkeep: "Содержание верфи" #NT!
 nd_ymp_shipyard_upkeep_desc: "Лес, военно-морские припасы, деготь и железо для императорских дворов. Здесь строятся и ремонтируются деревянные стены империи." #NT!
  
 nd_ymp_yamen_upkeep: "Содержание Ямена" #NT!
 nd_ymp_yamen_upkeep_desc: "Записи, бухгалтерские книги, лакированная мебель и конфуцианская классика. Административные издержки управления континентальной империей." #NT!
  
 nd_ymp_three_teachings_assembly: "Ассамблея Трех Учений" #NT!
 nd_ymp_three_teachings_assembly_desc: "Буддийские сутры, конфуцианская классика, синтоистская литургия и благовония — все собрано вместе. Ямен как религиозный, так и гражданский центр." #NT!
  
 nd_ymp_academy_upkeep: "Содержание Академии" #NT!
 nd_ymp_academy_upkeep_desc: "Книги, бумага, лакированные столы и парадные одежды для курсантов-ученых-самураев." #NT!
  
 nd_ymp_kokutai_rites: "Императорские обряды Кокутай" #NT!
 nd_ymp_kokutai_rites_desc: "Императорская бумага, свечи из пчелиного воска, благовония и рисовые подношения поддерживают континентальный имперский культ." #NT!
  
 nd_ymp_imperial_silkworks: "Императорский шелковый завод" #NT!
 nd_ymp_imperial_silkworks_desc: "Императорский шелк, окрашенный в придворные лаковые тона, для церемониальных одежд, которые носили от Эдо до Хансона и Пекина." #NT!
  
 nd_ymp_industrial_cannons: "Производство промышленных пушек" #NT!
 nd_ymp_industrial_cannons_desc: "Выплавленное на угле железо разливают в современные артиллерийские формы. Промышленная огневая мощь империи." #NT!
  
 nd_ymp_state_textbooks: "Учебники Имперского государства" #NT!
 nd_ymp_state_textbooks_desc: "Стандартизированные учебники по доктрине кокутай, учебники по имперской лояльности и континентальная география. Распространяется во всех императорских школах." #NT!
  
  # ===== BUREAUCRACIES ===== 
 ymp_tairiku_bakufu_bureaucracy: "Тайрику Бакуфу" #NT!
 ymp_tairiku_bakufu_bureaucracy_desc: "Совет и система бугё Эдо родзю, воспроизведенные в виде филиалов палат в Хансоне и завоеванной столице Мин. Стандартизированная континентальная администрация заменяет военное правительство. Корона получает прямое административное влияние по всей империи; Даймё обнаруживают, что автономия их клана ограничена параллельным аппаратом, подчиняющимся только императорскому двору." #NT!
  
 ymp_sankin_kotai_bureaucracy: "Санкин-Котай континентальный" #NT!
 ymp_sankin_kotai_bureaucracy_desc: "Система поочередного посещения, систематизированная Иэмицу в 1635 году, распространилась на всю империю, охватывающую архипелаг и материк. Даймё Кореи и Ляодуна присутствуют в императорской резиденции; их континентальные шествия обогащают почтовые станции и опустошают казну кланов, одновременно делая скоординированное восстание логистически несостоятельным. Бюргеры вдоль дорожной сети процветают; знать тратит серебро на церемониальные путешествия." #NT!
  
 ymp_kokudaka_governance_bureaucracy: "Кокудака Управление" #NT!
 ymp_kokudaka_governance_bureaucracy_desc: "Оценка урожайности риса кокудака простиралась от родных островов до Кореи и центра Мин. Даймё становятся губернаторами континентальных провинций, получая рейтинг в коку стандартизированного дохода, облагаясь налогами и барщиной, пропорциональными их установленному доходу. Дворяне приветствуют преемственность кланового управления, планируемую за рубежом; Корона обменивает прямой финансовый охват на управляемую сеть феодалов." #NT!
  
 ymp_sankyo_itchi_bureaucracy: "Санкё Ичи" #NT!
 ymp_sankyo_itchi_bureaucracy_desc: "Согласие Трех Учений. Интеллектуальная программа Эдо Судзуки Сёсан, Хаяси Разан и Ямазаки Ансай, синтезировавшая буддизм Махаяны, конфуцианство и синтоизм в единую государственную идеологию, здесь продвигалась от научного проекта к имперской доктрине. Сангха Махаяны, корейские конфуцианские академии и синтоистское духовенство объединены в единую имперскую церковь, охватывающую весь континент." #NT!
  
 ymp_metsuke_censorate_bureaucracy: "Цензорат Мецукэ" #NT!
 ymp_metsuke_censorate_bureaucracy_desc: "Слияние инспекторов мецукэ и омецукэ бакуфу с цензоратом Юситай, унаследованным от завоеванного Мин. Ученые-самураи, обученные классической конфуцианской литературе, проводят внезапные проверки по всей империи, подчиняясь непосредственно императорскому двору. Появляется грамотный класс инспекторов, пересекающий границы власти даймё и не подотчетный ни одному клану." #NT!
  
 ymp_suigun_bugyo_bureaucracy: "Суйгун Бугё" #NT!
 ymp_suigun_bugyo_bureaucracy_desc: "Единое военно-морское командование, объединяющее флагманские эскадры атакэбуне Хидэёси под командованием Куки Ёситака и адмиралов морского клана Суйгун Внутреннего моря. Отвергая сакоку, бакуфу лицензирует бывших пиратов вако в качестве государственных каперов под каперскими грамотами сюиндзё с красной печатью. Портовые города Сетучи, Пусан и Янцзы становятся военно-морскими перевалочными пунктами." #NT!
  
  # ===== AUTO MODIFIER ===== 
 AUTO_MODIFIER_NAME_nd_ymp_bureaucracy_authority: "Континентальное бюрократическое управление" #NT!
 AUTO_MODIFIER_DESC_nd_ymp_bureaucracy_authority: "С провозглашением Империи Ямато бакуфу получает институциональную способность принимать у себя историческую бюрократию, управляющую континентальным царством." #NT!
  
  # ===== DESTINY TREE ===== 
  
  # --- Destiny advance names and descriptions --- 
 nd_ymp_destiny: "Трон из хризантем венчает империю" #NT!
 nd_ymp_destiny_desc: "Провозглашена Империя Ямато, и Микадо носит корону мировой державы Восточной Азии. Бакуфу теперь должно выбрать, какой империей оно станет." #NT!
  
 nd_ymp_dest_liaodong_subjugation: "Покорение Ляодуна" #NT!
 nd_ymp_dest_liaodong_subjugation_desc: "Ляоян и Шэньян должны пасть. Первый этап континентальной гегемонии заключается в сокрушении всех остатков Маньчжурии, которые могут угрожать корейскому тылу." #NT!
  
 nd_ymp_dest_mongolia_amur: "Степь и Амур" #NT!
 nd_ymp_dest_mongolia_amur_desc: "Каракорум и Амурский рубеж. Империя преодолевает Великую стену, выходит за пределы досягаемости Мин и пишет императорскую печать на монгольской траве." #NT!
  
 nd_ymp_dest_continental_empire: "Континентальная Империя" #NT!
 nd_ymp_dest_continental_empire_desc: "Лхаса, Тханлонг, Хюэ. От Тибета до Южно-Китайского моря хризантема вытесняет всех конкурирующих монархов на материковой части Азии." #NT!
  
 nd_ymp_dest_taiwan_subjugation: "Тайваньский рубеж" #NT!
 nd_ymp_dest_taiwan_subjugation_desc: "Формоза — первое океанское завоевание империи. Тихий океан начинается там, где заканчиваются родные острова, и имперский флот должен удерживать каждый проход на юг." #NT!
  
 nd_ymp_dest_manila_hijack: "Манильский галеон захвачен" #NT!
 nd_ymp_dest_manila_hijack_desc: "Майнила и Тондо схвачены. Серебро Акапулько больше не пересекает Тихий океан в испанские хранилища. Слитки Нового Света теперь питают Эдо, а не Мадрид." #NT!
  
 nd_ymp_dest_pacific_thalassocracy: "Тихоокеанская талассократия" #NT!
 nd_ymp_dest_pacific_thalassocracy_desc: "Гавайи, Марианские острова, Камчатка. Штандарт хризантемы развевается по всем берегам Тихого океана, а самый большой океан в мире представляет собой императорское озеро." #NT!
  
  # --- Destiny event titles, descriptions, and option text --- 
 nd_ymp.8.t: "Трон из хризантем венчает империю" #NT!
 nd_ymp.8.d: "Микадо, освобожденный из своего ритуального плена, восходит на континентальный трон. Кику-но-гомон пролетает над Эдо, Хансоном и Янцзы. Однако коронованная империя — это еще не судьба. Бакуфу должны выбрать, куда потратить следующее столетие имперской энергии: на запад через континент или на восток через Тихий океан. Любой путь навсегда определит Империю Ямато." #NT!
 nd_ymp.8.a: "Судьба империи начинается" #NT!
  
 nd_ymp.9.t: "Покоренный Ляодун" #NT!
 nd_ymp.9.d: "Ляоян и Шэньян подчиняются. Маньчжурские ворота запечатаны императорским гарнизоном. Корейский тыл и японские линии снабжения теперь защищены от любого северного реванша. Офицерский корпус самураев впервые ощущает вкус непосредственного управления континентальной провинцией: прошедшие конфуцианское обучение учёные-самураи заполняют ямэнь и размещают имперские полки за их стенами." #NT!
 nd_ymp.9.a: "В степь" #NT!
  
 nd_ymp.10.t: "Каракорум и Амур" #NT!
 nd_ymp.10.d: "Монгольская конница больше не совершает набегов; они едут под имперскими знаменами. Древняя столица юаней Каракорум, бассейн Амура, удерживаемый тунгусами и русскими разведчиками, коридор между ними — все это досталось имперской экспедиции. Империя простирается дальше на север и запад, чем когда-либо осмеливался любой японский правитель. Вопрос в том, следует ли поглотить степные народы в качестве вспомогательной кавалерии или сосредоточиться на линиях снабжения, которые скрепляют континентальную армию." #NT!
 nd_ymp.10.a: "Заручитесь поддержкой степных лордов в качестве имперских маршалов." #NT!
 nd_ymp.10.b: "Построить сеть снабжения Амура" #NT!
  
 nd_ymp.11.t: "Континентальная Империя" #NT!
 nd_ymp.11.d: "Лхаса передает Далай-ламу под имперскую защиту. Тханг Лонг и Хюэ признают хризантему сюзереном всего Вьетнама. В настоящее время империя охватывает все великие азиатские цивилизации: японскую, корейскую, ханьскую, маньчжурскую, монгольскую, тибетскую, вьетнамскую. Бакуфу теперь должны сформулировать, что их объединяет. Имперский мандат как космическая легитимность, или постоянные легионы, удерживающие каждую континентальную столицу." #NT!
 nd_ymp.11.a: "Провозгласить мандат Ямато над всей Азией." #NT!
 nd_ymp.11.b: "Континентальные легионы — хребет империи" #NT!
  
 nd_ymp.12.t: "Тайвань становится империей" #NT!
 nd_ymp.12.d: "Народы пайвань и сирайя подчиняются имперскому флагу. Пескадорские острова и Тайваньский пролив — имперские воды. От Эдо, цепи Рюкю и теперь до Формозы империя образует непрерывную дугу, пересекающую западную часть Тихого океана. Имперский флот имеет свою первую глубоководную базу к югу от родных островов, а испанцы в Маниле начинают переосмысливать свой контроль над архипелагом." #NT!
 nd_ymp.12.a: "Юг Филиппин" #NT!
  
 nd_ymp.13.t: "Манильский галеон наш" #NT!
 nd_ymp.13.d: "Майнила и Тондо падают под натиском объединенного флота рейдеров атакэбуне, геобуксон и сэкибуне. Торговля испанскими галеонами (серебро Акапулько и шелк Манилы) находится во власти империи. Бакуфу должно решить: перенаправить поток серебра в имперскую казну и торговать через Эдо, или предоставить Филиппинские острова имперским вассалам в качестве системы даннических протекторатов." #NT!
 nd_ymp.13.a: "Имперская монополия на торговлю галеонами" #NT!
 nd_ymp.13.b: "Протектораты архипелагов под властью наместников даймё" #NT!
  
 nd_ymp.14.t: "Тихий океан — это Ямато" #NT!
 nd_ymp.14.d: "Гавайские вожди присягают на вассальную зависимость. Марианские острова выращивают хризантемы. Имперские корабли заходят в порты на Камчатке и в Петропавловске, навсегда лишая Романовых российского Тихого океана. Тихий океан больше не принадлежит ни Испании, ни Англии, ни европейцу; это императорское озеро Ямато. Последняя задача бакуфу — выбрать, как управлять этой океанической империей." #NT!
 nd_ymp.14.a: "Патрулируйте все морские пути: господство голубой воды" #NT!
 nd_ymp.14.b: "Коронуйте тихоокеанскую цивилизацию под хризантемой" #NT!
  
  # --- Variable tooltip alias for path_b (unused destiny branch) is reused above --- 
  
  # --- Destiny timed modifier names and descriptions --- 
 STATIC_MODIFIER_NAME_nd_ymp_dest_steppe_marshals: "Степные маршалы" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_steppe_marshals: "Монгольские ханы служат императорскими маршалами кавалерии. Степные конные поголовья снабжают императорские конюшни. Вспомогательная кавалерия империи ездит по степи, как по Хонсю." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_amur_logistics: "Амурский Пограничный Логистик" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_amur_logistics: "Цепи императорских складов идут от Пусана вверх по Ялу и до Амура. Континентальная армия никогда не голодает; серебро империи сжигается для финансирования зернохранилищ." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_mandate_of_yamato: "Мандат Ямато" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_mandate_of_yamato: "Трон из хризантем претендует на космическую легитимность над всей Восточной Азией. Войны имперского мандата легко объявить и легче урегулировать. Суд становится самодовольным своим превосходством." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_continental_legion: "Континентальный легион" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_continental_legion: "Постоянные имперские полки удерживают каждую континентальную столицу. Призывники и контрактники служат за имперскую плату. Казначейство истекает кровью из-за этой привилегии." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_galleon_traffic: "Галеон Трафик" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_galleon_traffic: "Серебро Акапулько, шелк Манилы и лаковые изделия Эдо — все это находится под имперским низом. Тихоокеанская торговля является имперской монополией, и имперские дипломаты присутствуют везде, где она касается." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_archipelago_protectorates: "Протектораты архипелага" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_archipelago_protectorates: "Вассалы Филиппин, Борнея и Молуккки управляют своими островами за свой счет. Имперские тканевые рулоны питают торговлю пряностями. Империя обращает свой взор за моря." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_blue_water_dominion: "Доминион Голубой Воды" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_blue_water_dominion: "Тихоокеанские лесоматериалы и военно-морские запасы позволяют императорскому флоту патрулировать территорию от Хоккайдо до Гавайев. Войны против неверующих за океаном заканчиваются в пользу империи." #NT!
  
 STATIC_MODIFIER_NAME_nd_ymp_dest_chrysanthemum_pacific: "Хризантема Тихоокеанская" #NT!
 STATIC_MODIFIER_DESC_nd_ymp_dest_chrysanthemum_pacific: "Императорская бумага и тонкая ткань украшают каждый тихоокеанский двор, поклоняющийся хризантеме. Карма Махаяны течет от императорского покровительства к гавайским, полинезийским и марианским подданным." #NT!
  
  # --- Destiny building names and descriptions --- 
 nd_ymp_continental_garrison_command: "Командование Имперского континентального гарнизона" #NT!
 nd_ymp_continental_garrison_command_desc: "Постоянная имперская крепость и оперативное командование континентальной армии. Построенный только в самом сердце континентальной империи, он направляет гарнизоны от Лхасы до Хюэ и Амура." #NT!
  
 nd_ymp_pacific_naval_command: "Тихоокеанское военно-морское командование" #NT!
 nd_ymp_pacific_naval_command_desc: "Штаб Имперского глубоководного военно-морского флота. Координирует Тихоокеанский патрульный флот, манильские галеонные конвои, а также гавайские и марианские станции под единым имперским флагом." #NT!
  
  # --- Destiny production method localization --- 
 nd_ymp_dest_garrison_command_upkeep: "Содержание континентального гарнизона" #NT!
 nd_ymp_dest_garrison_command_upkeep_desc: "Оружие, огнестрельное оружие, лошади, униформа и рисовые пайки для постоянных имперских полков, удерживающих каждую континентальную столицу." #NT!
  
 nd_ymp_dest_pacific_command_upkeep: "Содержание Тихоокеанского военно-морского командования" #NT!
 nd_ymp_dest_pacific_command_upkeep_desc: "Постоянные потребности Тихоокеанского патруля в снабжении: военно-морские запасы, древесина, деготь, оружие и соленая рыба." #NT!
