l_russian:
 STATIC_MODIFIER_NAME_nd_lot_crossroads_of_christendom: "Перекресток христианского мира" #NT!
 STATIC_MODIFIER_DESC_nd_lot_crossroads_of_christendom: "Лотарингия вновь обретает свою древнюю роль места встречи Европы, земли, где купцы с Рейна, Мааса и Шельды обмениваются не только товарами, но и идеями, и где терпимость к различиям — это не слабость, а государственное искусство." #NT!
 STATIC_MODIFIER_NAME_nd_lot_iron_crown_of_lothar: "Железная Корона Лотара" #NT!
 STATIC_MODIFIER_DESC_nd_lot_iron_crown_of_lothar: "Срединное королевство снова восстало не как пассивный буфер, а как военное государство в бургундской традиции, его артиллерийские роты и обрамленные крепостями границы заявляют, что пространство между Францией и Германией не принадлежит ни одной из них, оно принадлежит Лотарингии." #NT!
 nd_lot.1.t: "Возрождение Поднебесной" #NT!
 nd_lot.1.d: "На протяжении веков земли между Рейном и Маасом были армией Европы, за которую воевали Франция и Империя, были разделены на герцогства и княжества-епископства, память об их единстве сохранилась только в названии «Лотарингия». Теперь это воспоминание снова становится реальностью. Королевство, которое Лотарь I вырезал из сердца империи Карла Великого по Верденскому договору в 843 году, восстает снова.\n\nНо что это будет за королевство? Старая Лотарингия была разрушена именно потому, что она пыталась быть всем: коридором между конкурирующими державами, богатым торговлей и культурой, но не имеющим военной силы для защиты своего богатства. Новая Лотарингия должна выбрать свой основополагающий принцип. Примет ли она свою природу перекрестка Европы, страны ярмарок шампанского и Рейнских бродов, где толерантность и торговля создают процветание, делающее завоевания ненужными? Или он выработает железную дисциплину бургундской артиллерии, построив централизованное военное государство, которое защитит свои границы крепостями и профессиональными армиями, требуя, чтобы великие державы признали третью силу в Западной Европе?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lot.1.a: "Мы — мост между мирами. Пусть торговля и дипломатия будут нашей силой." #NT!
 nd_lot.1.b: "Железную Корону Лотара будут защищать железные люди." #NT!
 nd_lot.2.t: "Реформа артиллерийского вооружения" #NT!
 nd_lot.2.d: "Следуя примеру революционных военных постановлений Карла Смелого 1471 года, Лотарингия учреждает свои собственные роты ордонанса, постоянные роты профессиональных солдат, организованных в копья латников, лучников и конной пехоты. Это не феодальное войско, зависящее от сезонного наличия благородных вассалов. Это наемные профессионалы, которые тренируются круглый год, обслуживают свое оборудование за государственный счет и подчиняются назначенным капитанам, а не потомственным лордам.\n\nПостановление требует строгой дисциплины: регулярные сборы, стандартизированное оружие, запрещенные азартные игры и грабежи без приказа. Это основа современной армии и заявление о том, что Лотарингия не будет полагаться на наемников или феодальные обязательства для защиты своих границ." #NT!
 nd_lot.2.a: "Боеприпасы заново сформируют нашу армию." #NT!
 nd_lot.3.t: "Биржа Антверпена" #NT!
 nd_lot.3.d: "Великое здание биржи на Меире стало чем-то, чего мир никогда раньше не видел: постоянным рынком не товаров, а самих денег. Здесь векселя Венеции и Аугсбурга торгуются наряду с фьючерсами на португальский перец и английскими шерстяными облигациями. Антверпенская биржа затмила угасающие ярмарки Шампани и Брюгге, привлекая торговцев со всего известного мира на единую торговую площадку, где за день зарабатываются и теряются состояния.\n\nИностранные факторы, португальские, испанские, английские, немецкие, итальянские, обосновались в городе. Население разрастается. Ежегодные городские ярмарки, которые когда-то проводились дважды в год, теперь функционируют постоянно. Антверпен стал торговой столицей западного мира, и его богатства перетекают в казну Лотарингской короны." #NT!
 nd_lot.3.a: "Пусть Антверпенская биржа устанавливает цены на мировые товары." #NT!
 nd_lot.4.t: "Орден Золотого Руна" #NT!
 nd_lot.4.d: "На церемонии необычайного великолепия рыцари Ордена Золотого Руна собираются в своем капитуле, самом престижном рыцарском ордене в христианском мире, основанном Филиппом Добрым Бургундским в 1430 году. Его членство ограничено величайшими дворянами королевства, связанными клятвой защищать католическую веру и поддерживать честь своего государя.\n\nЗолотой воротник Ордена и подвеска из бараньего руна стали высшим знаком аристократии. отличие в Западной Европе. Короли и императоры жаждут членства. Его отделения, проводимые в великих церквях Брюгге, Брюсселя и Мехелена, представляют собой случаи несравненного зрелища, шествий герольдов, турниров оружия и торжественных месс, которые провозглашают всей Европе величие Лотарингского двора." #NT!
 nd_lot.4.a: "Золотое руно связывает с нашим делом самую благородную кровь Европы." #NT!
 nd_lot.5.t: "Полиграфическая революция" #NT!
 nd_lot.5.d: "Когда около 1440 года Иоганн Гутенберг усовершенствовал свою печатную машину в Майнце, он едва ли мог себе представить, как быстро эта технология преобразит Рейнскую область. За несколько десятилетий типографии выросли в Кёльне, Страсбурге, Базеле и Брюсселе. Великий Рейнский коридор, который уже является самым загруженным торговым маршрутом Европы, становится магистралью идей. Книги, на копирование которых раньше монаху требовались годы, теперь можно издавать сотнями экземпляров за недели.\n\nВлияние на грамотность, религиозные дебаты и распространение знаний является революционным. Университетские города вдоль Рейна привлекают ученых со всей Европы. Юридические кодексы стандартизированы и распространены. Коммерческая переписка ускоряется. Сама концепция информации изменилась, и Лотарингия находится в центре этой трансформации." #NT!
 nd_lot.5.a: "Знания будут течь так же свободно, как Рейн." #NT!
 STATIC_MODIFIER_NAME_nd_lot_ordonnance_reform: "Реформа артиллерийского вооружения" #NT!
 STATIC_MODIFIER_DESC_nd_lot_ordonnance_reform: "Профессиональные артиллерийские роты привносят в армии Лотарингии современную военную дисциплину, предлагая стандартизированное оборудование, регулярную зарплату и круглогодичные тренировки." #NT!
 STATIC_MODIFIER_NAME_nd_lot_global_emporium: "Глобальный торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_lot_global_emporium: "Антверпенская биржа стала торговым центром западного мира, где ежедневно устанавливаются цены на товары с четырех континентов." #NT!
 nd_lot_carolingian_legacy: "Каролингская Палатинская традиция" #NT!
 nd_lot_carolingian_legacy_desc: "Традиция Каролингского Пфальца, комплексы королевских часовен, которые служили центрами управления, правосудия и священного обучения во всем Поднебесной." #NT!
 nd_lot_rhine_river_trade: "Торговля на реке Рейн" #NT!
 nd_lot_rhine_river_trade_desc: "Великая Рейнская артерия несет товары из Альп в Северное море, и те, кто контролирует ее переправы, распоряжаются богатствами Западной Европы." #NT!
 nd_lot_scara_tradition: "Кавалерийские традиции Скара" #NT!
 nd_lot_scara_tradition_desc: "Элитная скара, корпус конной гвардии Карла Великого, организованный в куни по пятьдесят всадников, оставила прочную традицию превосходства тяжелой кавалерии в землях Поднебесной." #NT!
 nd_lot_bishop_princes: "Княжеско-епархиальное управление" #NT!
 nd_lot_bishop_princes_desc: "Великие князья-епископства Кельна, Льежа, Трира и Страсбурга обладают как духовной, так и светской властью, а их кафедральные соборы служат центрами обучения и управления." #NT!
 nd_lot_flemish_cloth_trade: "Торговля фламандскими тканями" #NT!
 nd_lot_flemish_cloth_trade_desc: "Текстильные города Фландрии и Брабанта (Гент, Брюгге, Ипр, Брюссель) производят лучшие шерстяные ткани в Европе, а их Лакенхаллен служит одновременно рынком и контролем качества." #NT!
 nd_lot_brabant_fairs: "Система выставок Брабанта" #NT!
 nd_lot_brabant_fairs_desc: "Крупные ярмарки Брабанта (Антверпен, Берген-оп-Зом и их сателлиты) пришли на смену Ярмаркам шампанского и стали местом встречи торговли Северной и Южной Европы.\n\n#italic Доступно: $nd_lot_lakenhalle$#!" #NT!
 nd_lot_walloon_ironworking: "Валлонская обработка железа" #NT!
 nd_lot_walloon_ironworking_desc: "Железные кузницы долины Мааса, от Намюра до Льежа, выплавляли руду еще со времен Римской империи. Валлонские кузнецы известны во всей Европе качеством своих изделий из металла." #NT!
 nd_lot_meuse_valley_defense: "Защита долины Маас" #NT!
 nd_lot_meuse_valley_defense_desc: "Долина реки Маас, центральный хребет Лотарингии, была укреплена со времен Каролингов, а ее гарнизоны были обучены удерживать переправы от захватчиков как с востока, так и с запада." #NT!
 nd_lot_urban_communes: "Городские коммуны" #NT!
 nd_lot_urban_communes_desc: "Бюргерские коммуны Нидерландов и Рейнской области завоевали чрезвычайные права самоуправления, их советы, обязанности милиции и правила гильдий, создавшие островки протодемократического управления." #NT!
 nd_lot_early_netherlandish_art: "Раннее нидерландское искусство" #NT!
 nd_lot_early_netherlandish_art_desc: "Революция в масляной живописи, начатая Яном ван Эйком и Рогиром ван дер Вейденом, превратила Бургундские Нидерланды в художественный центр Северной Европы, а их светящиеся алтари и портреты ценятся судами всего христианского мира." #NT!
 nd_lot_ordonnance_companies: "Артиллерийские компании" #NT!
 nd_lot_ordonnance_companies_desc: "Compagnies d'Ordonnance, постоянные профессиональные военные роты, впервые организованные Карлом Смелым в 1471 году, представляют собой первую постоянную армию в Западной Европе со времен Рима." #NT!
 nd_lot_bourse_of_antwerp: "Биржа Антверпена" #NT!
 nd_lot_bourse_of_antwerp_desc: "Антверпенская биржа, основанная в начале шестнадцатого века, является первой в мире специально построенной фондовой биржей, крытым рынком, где торговцы торгуют не товарами, а финансовыми инструментами." #NT!
 nd_lot_staple_rights: "Основные права" #NT!
 nd_lot_staple_rights_desc: "Основные права Кельна и Брюгге вынуждают все товары, проходящие через их рынки, предлагаться для продажи на местном уровне, создавая чрезвычайно прибыльные узкие места, которые обогащают лотарингских торговцев." #NT!
 nd_lot_golden_fleece: "Орден Золотого Руна" #NT!
 nd_lot_golden_fleece_desc: "Самый престижный рыцарский орден христианского мира, основанный в 1430 году Филиппом Добрым, чей золотой воротник и кулон из бараньего руна обозначают высший знак отличия европейской знати." #NT!
 nd_lot_printing_heartland: "Печатный станок Хартленд" #NT!
 nd_lot_printing_heartland_desc: "Рейнский коридор от Майнца до Кельна и далее, родина и самое быстрое внедрение подвижного типа Гутенберга, стал информационной магистралью Европы." #NT!
 nd_lot_tapestry_workshops: "Гобеленовые мастер-классы" #NT!
 nd_lot_tapestry_workshops_desc: "Гобеленовые мастерские в Аррасе, Турне и Брюсселе производят самые востребованные настенные ковры в Европе, их монументальные повествовательные сцены украшают дворцы королей и пап.\n\n#italic Доступно в: $nd_lot_lakenhalle$#!" #NT!
 nd_lot_confessional_balance: "Конфессиональный баланс" #NT!
 nd_lot_confessional_balance_desc: "На земле, где католическая, реформатская и лютеранская общины живут бок о бок, Лотарингия развивает прагматичные традиции религиозного сосуществования, на открытие которых в других странах потребуются столетия." #NT!
 nd_lot_walloon_guard_tradition: "Валлонская гвардейская традиция" #NT!
 nd_lot_walloon_guard_tradition_desc: "Валлонская гвардия, профессиональная пехота, набираемая из франкоязычных провинций, служит элитными формированиями в армиях по всей Европе и славится своей стойкостью под огнем." #NT!
 nd_lot_rhine_fortification: "Рейнское укрепление" #NT!
 nd_lot_rhine_fortification_desc: "Систематическое укрепление Рейнской границы бастионными фортами и звездообразными цитаделями, превратившее реку из торгового пути в неприступный военный барьер." #NT!
 nd_lot_toll_system: "Система взимания платы за проезд по Рейну" #NT!
 nd_lot_toll_system_desc: "Усовершенствование системы взимания платы за проезд по Рейну, от грубых речных цепей и пунктов взимания платы за замки до рационализации таможенной службы, превращает географию Лотарингии в устойчивый поток доходов." #NT!
 nd_lot_university_tradition: "Университетские традиции" #NT!
 nd_lot_university_tradition_desc: "Университеты Левена, Кельна и Страсбурга образуют коридор обучения, привлекающий ученых со всей Европы, а их факультеты права, медицины и теологии известны во всем христианском мире." #NT!
 nd_lot_crossroads_diplomacy: "Перекресток дипломатии" #NT!
 nd_lot_crossroads_diplomacy_desc: "Положение Лотарингии между Францией, Империей и государствами Северного моря делает ее естественным посредником в заключении договоров и посредником в спорах, и эту роль умело используют ее дипломаты." #NT!
 nd_lot_centralized_customs: "Централизованная таможня" #NT!
 nd_lot_centralized_customs_desc: "Объединение местных сборов, прав на основные товары и транзитных сборов Лотарингии в единую таможенную систему, основу настоящего внутреннего рынка." #NT!
 nd_lot_industrial_meuse: "Промышленный Маас" #NT!
 nd_lot_industrial_meuse_desc: "Долина Мааса от Льежа до Намюра, богатая железной рудой, гидроэнергией и многовековыми традициями металлообработки, становится одним из первых промышленных коридоров Европы." #NT!
 nd_lot_fortress_builders: "Строители крепости" #NT!
 nd_lot_fortress_builders_desc: "Лотарингские военные инженеры, унаследовав как бургундские, так и французские традиции фортификации, стали мастерами итальянского бастионного искусства и искусства осадной войны." #NT!
 nd_lot_commercial_code: "Торговый кодекс" #NT!
 nd_lot_commercial_code_desc: "Кодификация коммерческого права, опирающаяся на столетия справедливых правил, уставов гильдий и практики обмена, обеспечивает стабильную правовую основу для торговцев Лотарингии." #NT!
 nd_lot_standing_army_reform: "Реформа постоянной армии" #NT!
 nd_lot_standing_army_reform_desc: "Преобразование вооруженных сил Лотарингии из смеси провинциальных рекрутов и рот наемников в централизованную, облаченную в униформу и профессионально подготовленную постоянную армию." #NT!
 nd_lot_coal_and_steel: "Уголь и сталь" #NT!
 nd_lot_coal_and_steel_desc: "Залежи угля и железа в бассейне Маас-Самбра питают промышленную революцию, которая превращает Лотарингию из страны ремесленных мастерских в один из крупнейших промышленных центров Европы." #NT!
 nd_lot_constitutional_assembly: "Конституционное собрание" #NT!
 nd_lot_constitutional_assembly_desc: "Конституционное собрание, опирающееся на глубокую традицию общинного управления и сословных собраний Лотарингии, устанавливает основу кодифицированных прав и представительного правительства." #NT!
 nd_lot_modern_banking: "Современное банковское дело" #NT!
 nd_lot_modern_banking_desc: "Опираясь на многовековую практику обмена от Антверпенской биржи до торговых домов Кельна, банки Лотарингии являются пионерами современных финансовых инструментов и кредитных систем." #NT!
 nd_lot_national_identity: "Лотарингская национальная идентичность" #NT!
 nd_lot_national_identity_desc: "Из лоскутного одеяла валлонов, фламандцев, рейнландцев, эльзасцев и лотарингцев возникает общее лотарингское сознание, не стирающее местную идентичность, а сплетающее ее в общую ткань." #NT!
 nd_lot_citizen_army: "Гражданская армия" #NT!
 nd_lot_citizen_army_desc: "Дамба в массовом порядке, всеобщая военная повинность, призываемая на все граждане, независимо от сословия, превращает оборону Лотарингии из профессионального дела в национальную обязанность." #NT!
 a_nd_lot_scara_cavalry: "Скара Кавалерия" #NT!
 a_nd_lot_scara_cavalry_desc: "Элитная тяжелая кавалерия, унаследовавшая традиции конного гвардейского корпуса Карла Великого, скара, организованная в куни из пятидесяти всадников, обученных как ударным атакам, так и пешему бою." #NT!
 a_nd_lot_meuse_garrison: "Пограничный гарнизон Мааса" #NT!
 a_nd_lot_meuse_garrison_desc: "Прочная оборонительная пехота, набранная из укреплений долины Мааса, специалистов по удержанию переправ через реки и укрепленных позиций против превосходящих сил." #NT!
 a_nd_lot_ordonnance_lance: "Артиллерийское копье" #NT!
 a_nd_lot_ordonnance_lance_desc: "Профессиональная тяжелая кавалерия, организованная в бургундское копейное соединение, воины в сопровождении кутильера, пажа и лучников, обученные сражаться как слаженное подразделение." #NT!
 a_nd_lot_walloon_guards: "Валлонская гвардия" #NT!
 a_nd_lot_walloon_guards_desc: "Профессиональная пехота, набранная из франкоязычных провинций Валлонии, служит элитными линейными войсками, известными по всей Европе своей дисциплиной и стойкостью под огнем." #NT!
 a_nd_lot_line_infantry: "Лотарингская линейная пехота" #NT!
 a_nd_lot_line_infantry_desc: "Профессиональная пехота в униформе, обученная линейной тактике того времени, представляет собой кульминацию многовековой эволюции Лотарингии от феодальных наборов к современной армии." #NT!
 a_nd_lot_citizen_militia: "Гражданин Милиция" #NT!
 a_nd_lot_citizen_militia_desc: "Вооруженные граждане, мобилизованные посредством всеобщей воинской повинности, сражаются с рвением свободных людей, защищая свои конституционные права и национальный суверенитет." #NT!
 nd_lot_pfalzkapelle: "Пфальцкапелле" #NT!
 nd_lot_pfalzkapelle_desc: "Комплекс небных часовен Каролингов, созданный по образцу великой часовни Карла Великого в Аахене, частично королевская часовня, частично административный центр, частично казначейство, олицетворяющее священную власть Лотарингского королевства." #NT!
 nd_lot_rheinzoll: "Рейнцолл" #NT!
 nd_lot_rheinzoll_desc: "Платная станция на Рейне, расположенная на стратегическом переправе через реку, где таможенники проверяют проходящие баржи и собирают пошлины, которые финансируют Лотарингскую корону." #NT!
 nd_lot_lakenhalle: "Лакенхалле" #NT!
 nd_lot_lakenhalle_desc: "Монументальный суконный зал, где фламандские ткани проверяются, сортируются и продаются, одновременно являясь рыночным зданием и свидетельством городского богатства и гордости гильдии." #NT!
 nd_lot_walloon_forge: "Валлонская кузница" #NT!
 nd_lot_walloon_forge_desc: "Кузница по валлонским традициям, в которой используются методы струйной обработки древесным углем, отточенные на протяжении веков в долине Мааса для производства железа исключительного качества." #NT!
 nd_lot_antwerp_bourse: "Антверпенская биржа" #NT!
 nd_lot_antwerp_bourse_desc: "Первая в мире специально построенная фондовая биржа, торговая площадка с колоннами, где векселя, товарные фьючерсы и государственные облигации переходят из рук в руки в ходе непрерывной торговли." #NT!
 nd_lot_rhine_fortress: "Рейнская крепость" #NT!
 nd_lot_rhine_fortress_desc: "Крепость-бастион, контролирующая переправу через Рейн, ее звездообразный итальянский дизайн сочетает в себе новейшие достижения военной техники, позволяющие противостоять артиллерийским обстрелам." #NT!
 nd_lot_meuse_ironworks: "Металлургический завод Мааса" #NT!
 nd_lot_meuse_ironworks_desc: "Крупномасштабный металлургический завод в коридоре Маас, использующий водяные сильфоны и раннюю доменную технологию для производства железа в промышленных масштабах." #NT!
 nd_lot_steel_works: "Угольный и сталелитейный завод" #NT!
 nd_lot_steel_works_desc: "Современное промышленное предприятие, сочетающее выплавку кокса на угле с передовыми технологиями производства стали, превращающее сырую руду в конструкционный материал современности." #NT!
 nd_lot_chapel_maintenance: "Обслуживание часовни" #NT!
 nd_lot_chapel_maintenance_desc: "Содержание комплекса небной часовни, ее каменной кладки, рукописей и священных сосудов требует постоянного снабжения строительным камнем и пергаментом." #NT!
 nd_lot_toll_collection: "Сбор платы за проезд" #NT!
 nd_lot_toll_collection_desc: "Административный аппарат Рейнской платной станции, клерки, бухгалтерские книги, образцы тканей и бумажные записи, документирующие каждый проходящий торговый груз." #NT!
 nd_lot_cloth_finishing: "Отделка ткани" #NT!
 nd_lot_cloth_finishing_desc: "Заключительные этапы производства фламандских тканей — валяние, крашение и стрижка — превращают сырую шерсть в лучший текстиль в Европе." #NT!
 nd_lot_charcoal_smelting: "Выплавка древесного угля" #NT!
 nd_lot_charcoal_smelting_desc: "Традиционный процесс выплавки железа на древесном угле в валлонских кузницах, требующий огромного количества древесины для производства высококачественного чугуна." #NT!
 nd_lot_bourse_operations: "Биржевые операции" #NT!
 nd_lot_bourse_operations_desc: "Ежедневные операции биржи, печать торговых проспектов, ведение бухгалтерских книг и обращение с серебряной монетой, обеспечивающей коммерческие транзакции." #NT!
 nd_lot_fortress_garrison: "Крепостной гарнизон" #NT!
 nd_lot_fortress_garrison_desc: "Постоянный гарнизон Рейнской крепости, снабженный оружием, боеприпасами и строительным камнем для постоянного ремонта укреплений." #NT!
 nd_lot_blast_furnace: "Работа доменной печи" #NT!
 nd_lot_blast_furnace_desc: "Доменные печи с водяным приводом в долине Мааса плавят железную руду с древесным углем при беспрецедентных температурах, производя инструменты и оборудование исключительного качества." #NT!
 nd_lot_coke_smelting: "Выплавка кокса" #NT!
 nd_lot_coke_smelting_desc: "Революционный процесс выплавки кокса заменяет древесный уголь углем, превращая железную руду в сталь в ранее невообразимых промышленных масштабах." #NT!
 nd_lot_brabant_fair_method: "Брабантская справедливая торговля" #NT!
 nd_lot_brabant_fair_method_desc: "Крупные ярмарки Брабанта собирают шерсть из Англии и красители из Средиземноморья, а фламандские ткачи превращают их в готовые ткани для продажи по всей Европе." #NT!
 nd_lot_tapestry_production: "Производство гобеленов" #NT!
 nd_lot_tapestry_production_desc: "Производство монументальных гобеленов в мастерских Брюсселя и Арраса, переплетение шерсти, шелка и драгоценных красок в сюжетные сцены необычайного богатства." #NT!
 levy_nd_lot_scara_cavalry: "Кавалерийский сбор Скара" #NT!
 levy_nd_lot_scara_cavalry_desc: "Благородная кавалерия, воспитанная в традициях элитного гвардейского корпуса скара Карла Великого." #NT!
 levy_nd_lot_meuse_garrison: "Гарнизон Мааса Леви" #NT!
 levy_nd_lot_meuse_garrison_desc: "Набор оборонительной пехоты из укрепленных поселений долины Мааса." #NT!
 levy_nd_lot_citizen_militia: "Гражданин Милиции Леви" #NT!
 levy_nd_lot_citizen_militia_desc: "Вооруженные граждане, мобилизованные посредством всеобщей воинской повинности в защиту конституции Лотарингии." #NT!
 nd_lot_formed_tt: "была образована Лотарингия." #NT!
 nd_lot_path_a_tt: "Выбрал перекресток христианского мира" #NT!
 nd_lot_path_b_tt: "Выбрать Железную Корону Лотара" #NT!
 nd_lot_destiny: "Судьба Поднебесной" #NT!
 nd_lot_destiny_desc: "После восстановления стабильности в воссозданном Поднебесной Лотарингия стоит на распутье: станет ли она великим торговым мостом Европы или создаст военное государство с железной волей?" #NT!
 nd_lot_dest_entrepot: "Рейнский перевалочный пункт" #NT!
 nd_lot_dest_entrepot_desc: "Обезопасьте Амстердам для Лотарингии и обеспечьте поток ткани через рынки капитала. Постройте сокровищницу, достойную перекрестка Европы. Требуется 1000 золота." #NT!
 nd_lot_dest_banker: "Банкир в Европе" #NT!
 nd_lot_dest_banker_desc: "Используйте банковское учреждение и накопите богатство, которое сделает Лотарингию незаменимой для каждого двора христианского мира. Требуется 2000 золота и 50 престижа." #NT!
 nd_lot_dest_pax: "Пакс Лотарингика" #NT!
 nd_lot_dest_pax_desc: "Приведите великие текстильные города Брюгге и Гент под суверенитет Лотарингии, добившись тотального развития, достойного ведущего коммерческого государства Европы. Требуется 2500 общего развития и 75 престижа. Открывает здание Хандельсхоф." #NT!
 nd_lot_dest_march: "Бургундский марш" #NT!
 nd_lot_dest_march_desc: "Захватите Дижон, древнюю столицу Бургундии, и создайте армию, достойную железной короны Лотара. Требуется 30 размера армии и 75 стабильности." #NT!
 nd_lot_dest_frontier: "Среднее царство восстановлено" #NT!
 nd_lot_dest_frontier_desc: "Распространите суверенитет Лотарингии на Реймс на западе и Гамбург на севере, установив границу истинной среднеевропейской державы. Требуется 50-й размер армии." #NT!
 nd_lot_dest_hegemon: "Гегемон Запада" #NT!
 nd_lot_dest_hegemon_desc: "Захватите Париж, Франкфурт и Майнц, столицы Франции и Империи, доказав, что Поднебесная — величайшая держава в Западной Европе. Требуется 75 размеров армии и 2500 общего развития. Открывает здание Казерне." #NT!
 nd_lot.6.t: "Фонд держит" #NT!
 nd_lot.6.d: "Хрупкое чудо воссоединения продолжается. Там, где скептики предсказывали быстрый распад, судьбу всех предыдущих попыток возродить Срединное царство, Лотарингия вместо этого консолидируется. Разнообразные народы Рейна, Мааса и Шельды нашли если не единство, то, по крайней мере, рабочее соглашение. Валлонские мастера по производству железа и фламандские ткачи, рейнские виноделы и фризские рыбаки — все обнаруживают, что Лотарингская корона предлагает то, чего не может предложить ни одна соседняя держава: свободу торговли и вероисповедания без тяжелой руки Парижа или Вены.\n\nВопрос сейчас не в том, выживет ли Поднебесная, а в том, чем она станет." #NT!
 nd_lot.6.a: "Фундамент заложен. Теперь строим." #NT!
 nd_lot.7.t: "Амстердам обеспечен" #NT!
 nd_lot.7.d: "Великий порт Амстердама, где «Амстел» встречается с «Эй-Джеем» и в любой день в гавани толпятся сотни кораблей, теперь развевается под лотарингским стандартом. Благодаря бесподобной коммерческой инфраструктуре Амстердама и торговле тканями, протекающей через наши рынки капитала, Лотарингия находится на экономическом перекрестке Северной Европы. Склады на Вармоэсстраат переполнены балтийским зерном, английской шерстью и средиземноморскими специями. На биржах толпятся менялы и представители дюжины стран.\n\nЭто то, чем всегда должно было быть Поднебесная: не крепостью, а рынком, местом, где Европа ведет бизнес." #NT!
 nd_lot.7.a: "Амстердам – жемчужина нашей коммерческой короны." #NT!
 nd_lot.8.t: "Банки Поднебесной" #NT!
 nd_lot.8.d: "Лотарингские банкирские дома достигли того, чего не удалось ни одной торговой республике или королевской казне: они стали незаменимыми. Короли занимают деньги у Антверпена для ведения войн. Папы полагаются на Кёльнские факторы для перемещения своих доходов. Векселя, выпущенные в Брюсселе, принимаются от Лиссабона до Данцига. Лотарингский гульден, подкрепленный огромными производственными богатствами Рейнского коридора, стал самой надежной валютой в европейской торговле.\n\nНо финансовое доминирование порождает свои собственные дилеммы. Будем ли мы использовать этот рычаг, чтобы изменить саму торговлю, открыть рынки и разрушить монополии? Или мы должны инвестировать свое влияние в дипломатические сети, связывая суды Европы с Лотарингией долгами и обязательствами?" #NT!
 nd_lot.8.a: "Откройте рынки. Свободная торговля обогащает всех." #NT!
 nd_lot.8.b: "Привяжите суды Европы к нашему обмену." #NT!
 nd_lot.9.t: "Лотарингский мир" #NT!
 nd_lot.9.d: "В канцеляриях Европы все чаще можно услышать фразу: «Pax Lotharingica». Речь идет не о завоеваниях, а о замечательной стабильности, которую Лотарингские торговые сети принесли в Западную Европу. Когда войны угрожают торговле, дипломаты Лотарингии выступают за мир. Когда в провинции наступает голод, лотарингские торговцы перенаправляют зерно. Великие текстильные города Брюгге и Гент, ныне находящиеся под властью Лотарингии, образуют торговую сеть, простирающуюся от Балтики до Средиземноморья.\n\nПоднебесная достигла того, о чем мечтали ее основатели: не господства посредством оружия, а незаменимости посредством торговли. Ни одна держава в Европе не может себе позволить вести войну со страной, которая держит в руках финансовые потоки. Будет ли этот мир выражаться через всеобщую свободную торговлю или через развитие космополитического капитала, привлекающего лучшие умы каждой нации?" #NT!
 nd_lot.9.a: "Пусть рынки говорят сами за себя." #NT!
 nd_lot.9.b: "Сделайте нашу столицу предметом зависти для всех народов." #NT!
 nd_lot.10.t: "Марш на Дижон" #NT!
 nd_lot.10.d: "Древняя столица бургундских герцогов попадает в руки Лотарингии. В большом зале Герцогского дворца, где когда-то располагался блестящий двор Филиппа Доброго, а Карл Смелый строил свои обреченные амбиции, теперь рядом с железной короной Лотара висит знамя Лотарингии. Послание безошибочно: Лотарингия претендует не только на Нидерланды и Рейнскую область, но и на полное наследие Бургундского государства, его военных традиций, его рыцарского престижа и его территориальных амбиций.\n\nБургундский марш начался. Среднее царство больше не довольствуется тем, что занимает пространство между Францией и Империей, оно означает доминировать над ним." #NT!
 nd_lot.10.a: "Дижон наш. Пусть великие державы обратят на это внимание." #NT!
 nd_lot.11.t: "Границы защищены" #NT!
 nd_lot.11.d: "Реймс, город коронации французских королей, находившийся под контролем Лотарингии на западе, и Гамбург, великий ганзейский порт, закрепленный на севере, Поднебесная установила границы, которые изумили бы самого Лотаря I. Это больше не узкий коридор между соперничающими державами. Это настоящее континентальное государство, контролирующее Рейн от истока до моря, Маас от истоков до дельты и сухопутные пути от Ла-Манша до Балтийского моря.\n\nТеперь вопрос в том, как удержать завоеванное. Должны ли мы построить неприступную линию современных крепостей вдоль границы, сделав вторжение самоубийственным? Или нам стоит возродить артиллерийскую традицию, инвестируя в тактическое мастерство наших полевых армий, чтобы противостоять любой угрозе в открытом бою?" #NT!
 nd_lot.11.a: "Стройте крепости. Сделайте наши границы неприступными." #NT!
 nd_lot.11.b: "Тренируйте армии. Тактическое мастерство позволяет выигрывать войны." #NT!
 nd_lot.12.t: "Гегемон Запада" #NT!
 nd_lot.12.d: "Париж пал. Франкфурт пал. Майнц пал. Три города, которые являются опорой власти Франции и Священной Римской империи, политическая столица Капетингов, город коронации императоров и резиденция главного архиепископа-курфюрста, теперь подчиняются железной короне Лотара. Срединное царство не просто выжило между великими державами; он поглотил их.\n\nЭто век Лотарингии. От Ла-Манша до Альп, от Атлантики до Эльбы территории империи Карла Великого воссоединяются под единой короной впервые после Верденского договора. Будет ли эта гегемония выражаться через элитную имперскую гвардию, олицетворяющую централизованную власть? Или через железную дисциплину профессиональной армии, которая борется не только за патриотизм, но и за грабеж?" #NT!
 nd_lot.12.a: "Создайте имперскую гвардию, достойную нашего нового владычества." #NT!
 nd_lot.12.b: "Железная дисциплина и военные трофеи." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_exchange_mastery: "Мастерство обмена" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_exchange_mastery: "Лотарингские биржи определяют условия европейской торговли, их векселя и товарные фьючерсы лежат в основе торговли на континенте." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_diplomatic_network: "Дипломатическая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_diplomatic_network: "Сеть финансовых обязательств и дипломатических связей связывает европейские суды с интересами Лотарингии, делая наш нейтралитет слишком ценным, чтобы его можно было нарушить." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_universal_market: "Универсальный рынок" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_universal_market: "Коммерческая сеть Лотарингии стала поистине глобальной: ее легкие корабли доставляют товары в каждый порт, а ее рынки быстро восстанавливаются после любых потрясений." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_cosmopolitan_capital: "Космополитическая столица" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_cosmopolitan_capital: "Великие города Поднебесной (Брюссель, Антверпен, Кельн) привлекают ученых, художников и торговцев из всех стран, создавая культуру толерантности и инноваций." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_fortress_line: "Крепостная линия" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_fortress_line: "Непрерывная цепь современных укреплений вдоль границы с Лотарингией, поддерживаемая развитой логистикой, делает вторжение самоубийственным предложением." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_ordonnance_revival: "Возрождение артиллерийского вооружения" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_ordonnance_revival: "Возрождение артиллерийской дисциплины в Бургундии приводит к появлению полевых армий, обладающих исключительной тактической гибкостью, хотя концентрация на сухопутной войне оставляет военно-морской флот без внимания." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_imperial_guard: "Имперская Гвардия" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_imperial_guard: "Элитный корпус имперской гвардии, оснащенный лучшей артиллерией и подчиняющийся непосредственно короне, олицетворяет централизованную военную мощь Лотарингского государства." #NT!
 STATIC_MODIFIER_NAME_nd_lot_dest_iron_discipline: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_lot_dest_iron_discipline: "Профессиональная армия, связанная железной дисциплиной и стимулируемая систематическим распределением военных трофеев, поддерживаемая ротами наемников, дополняющими постоянные силы." #NT!
 nd_lot_handelshof: "Хандельсхоф" #NT!
 nd_lot_handelshof_desc: "Большой коммерческий суд, где купцы со всей Европы собираются для разрешения споров, заключения контрактов и торговли под защитой коммерческого права Лотарингии, институциональное воплощение Pax Lotharingica." #NT!
 nd_lot_kaserne: "Казерне" #NT!
 nd_lot_kaserne_desc: "Профессиональные военные казармы, в которых размещается постоянная армия Лотарингии, постоянные помещения с оружейными складами, тренировочными площадками и складами снабжения, которые поддерживают солдат в боевой готовности круглый год." #NT!
 nd_lot_handelshof_operations: "Деятельность коммерческого суда" #NT!
 nd_lot_handelshof_operations_desc: "Повседневная деятельность Хандельсхофа, печать торговых проспектов, поддержание элегантной обстановки для приезжих высокопоставленных лиц и бесконечная бумажная работа коммерческого арбитража." #NT!
 nd_lot_kaserne_upkeep: "Содержание казарм" #NT!
 nd_lot_kaserne_upkeep_desc: "Содержание профессиональных казарм, оснащение солдат оружием, обеспечение обмундированием и одеждой, хранение инструментов для фортификационного ремонта." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_lot_bureaucracy_authority: "Каролингское наследство" #NT!
 AUTO_MODIFIER_DESC_nd_lot_bureaucracy_authority: "Возрожденное Среднее Королевство унаследовало уникальную многоуровневую административную традицию, каролингских посланников и капитуляров, правительство Оттонской имперской церкви, светскую пропаганду великих рейнских аббатств, движение «Божьего перемирия», которое укротило частную войну, и охранные грамоты великих ярмарочных кругов. Выбирайте, какое из этих учреждений закрепит наша канцелярия." #NT!
  
 lot_missi_dominici_bureaucracy: "Мисси Доминичи" #NT!
 lot_missi_dominici_bureaucracy_desc: "Королевские посланники, один священнослужитель и один мирянин, отправлялись парами в районы, называемые миссатика, для проверки графов, епископов, аббатов и собственных агентов короля. Это учреждение было расширено благодаря Capitulare Missorum Generale Карла Великого в 802 году и стало центральным инструментом, с помощью которого Ахен достигал отдаленных графств. Мисси слушала апелляции, проверяла финансовые состояния, обнародовала капитуляры и отчитывалась во дворце." #NT!
  
 lot_palatine_chapel_bureaucracy: "Ахенская Палатинская капелла" #NT!
 lot_palatine_chapel_bureaucracy_desc: "Восьмиугольная часовня, построенная Одо из Меца по приказу Карла Великого и освященная Папой Львом III в 805 году, является архитектурным и литургическим центром дворца Каролингов. В часовне размещался императорский трон, коллекция королевских реликвий и духовенство часовни, служившее королю нотариусами и личными советниками. Под его мозаикой проходила каждая коронация немецкого короля от Оттона I в 936 году до Фердинанда I в 1531 году." #NT!
  
 lot_reichskirche_bureaucracy: "Рейхскирхе" #NT!
 lot_reichskirche_bureaucracy_desc: "Имперская церковная система, кодифицированная Отто I после 962 года. Корона наделила епископства и королевские аббатства комитальными правами, рыночными регалиями и иммунитетами, а также оставила за собой право наделять каждого нового епископа кольцом и посохом. Поскольку прелаты, соблюдающие целомудрие, не могли основывать династии, их должности после смерти возвращались к короне, что было структурным противовесом территориальным герцогам, которые закрепляли Оттонское и Салианское правительство до Вормского конкордата в 1122 году." #NT!
  
 lot_kirchenvogtei_bureaucracy: "Кирхенфогтей" #NT!
 lot_kirchenvogtei_bureaucracy_desc: "Офис светской адвокатуры, который обязывал магната защищать монастырский или соборный капитул с оружием в руках, проводить суды по кровному правосудию и вести своих вооруженных людей в Хербанн. С десятого века эта должность стала передаваться по наследству в дворянских семьях, которые все чаще использовали Фогтеев как средство для сбора налогов, свержения аббатов и захвата церковной собственности. Борьба за великие Лотарингские аббатства (Ставелот, Эхтернах, Прюм, Санкт-Максимин) определила политику Поднебесной." #NT!
  
 lot_imperial_chancery_bureaucracy: "Императорская канцелярия" #NT!
 lot_imperial_chancery_bureaucracy_desc: "Писательская контора, пристроенная к дворцу и возглавляемая (около 825 г.) архиепископом, который контролировал печать и курировал нотариусов, составлявших капитуляры, дипломы и королевскую корреспонденцию. При Людовике Благочестивом и Лотаре I канцелярия Аахена подготовила законодательные тексты, которые объединили королевство в единое юридическое сообщество. В оттоновские века архиканцлерство по обычаю было закреплено за архиепископом Майнца в Германии и архиепископом Кельна в Италии." #NT!
  
 lot_treuga_dei_bureaucracy: "Треуга Деи" #NT!
 lot_treuga_dei_bureaucracy_desc: "«Божественное перемирие», введенное в Германии на синоде, созванном епископом Льежа Генрихом в 1082 году, и распространенное на всю империю синодом Майнца в 1085 году в присутствии Генриха IV. Перемирие запрещало частную войну с захода солнца среды до восхода солнца понедельника, во время церковных праздников, а также во время Великого поста и Адвента; Pax Dei добавил иммунитет от насилия для безоружного духовенства, крестьян за плугом и торговцев на дороге. Епископы обеспечивали его соблюдением епархиальных трибуналов и угрозой отлучения." #NT!
  
 lot_sauf_conduit_bureaucracy: "Sauf-Conduit des Foires" #NT!
 lot_sauf_conduit_bureaucracy_desc: "Безопасность проведения ярмарок. Начиная с графа Тибо II Шампанского и утвержденного Филиппом Августом в 1209 году, короли и лорды поклялись брать под свою личную защиту каждого купца, путешествующего на или обратно на великий цикл из шести ярмарок в Ланьи, Бар-сюр-Об, Провене и Труа. Лотарингские князья унаследовали и распространили эту практику на Маас, Рейнский коридор и, в конечном итоге, на Брабантские ярмарки в Антверпене и Берген-оп-Зоме, при соблюдении собственного торгового суда Lex mercatoria." #NT!
