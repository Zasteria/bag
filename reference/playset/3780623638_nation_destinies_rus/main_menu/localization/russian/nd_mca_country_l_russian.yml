 MCA: "Конфедерация Муиска" #NT!
 MCA_ADJ: "Муиска" #NT!
 MCA_f: "Конфедерация Муиска" #NT!
 MCA_f_desc: "Конфедерация Муиска объединяет горные вождества Альтиплано Кундибоясенсе под единой политической властью. Объединив владения Зипа в Бакате и Заке в Хунзе вместе со священным участком Суамокс, конфедерация мастеров-ювелиров и торговцев изумрудами становится доминирующей силой колумбийского нагорья." #NT!
