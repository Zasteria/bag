l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_the_sultan: "Меч султана" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_sultan: "Военные традиции мамлюков продолжают жить. Наши кавалерийские атаки сотрясают землю, а наши армии маршируют с многовековой дисциплиной. Меч Египта обнажен, и никто не устоит перед ним." #NT!
 STATIC_MODIFIER_NAME_nd_garden_of_the_nile: "Сад Нила" #NT!
 STATIC_MODIFIER_DESC_nd_garden_of_the_nile: "Щедрость Нила – основа нашего процветания. Богатые урожаи питают растущую нацию, торговля течет через наши рынки, а богатство прошлых веков питает амбиции будущих веков." #NT!
 STATIC_MODIFIER_NAME_nd_egy_light_of_azhar: "Свет Аль-Азхара" #NT!
 STATIC_MODIFIER_DESC_nd_egy_light_of_azhar: "Ученые Аль-Азхара освещают исламский мир своими знаниями, привлекая студентов со всех уголков веры. Египет выступает интеллектуальным сердцем цивилизации." #NT!
 STATIC_MODIFIER_NAME_nd_egy_egyptian_renaissance: "Египетский Ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_egy_egyptian_renaissance: "Новая армия, обученная современной тактике, заводы, возвышающиеся вдоль Нила, и поколение офицеров, обученных военному искусству. Египет осознает свою судьбу среди великих держав." #NT!
 nd_egy.1.t: "Земля фараонов возрождается" #NT!
 nd_egy.1.d: "Египет снова объединился под одним знаменем. На протяжении тысячелетий эта земля была перекрестком империй, житницей, которая кормила Рим, крепостью, отбросившей монголов, рынком, где Восток встречался с Западом. Нил все еще течет, урожай все еще собирается, и теперь перед нами стоит новый вопрос: судьба Египта будет написана на языке меча или в бухгалтерских книгах счетной палаты? Наша мамлюкская кавалерия остается лучшими всадниками в мире, а их традиция фурусийя не прерывается веками. Однако богатства долины Нила (хлопок, зерно, сахар, специи, проходящие через наши порты) предлагают иную силу. Выбор, стоящий перед нами, определит, каким станет Египет.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_egy.1.a: "Мы наследники Бейбарса. Пусть наши враги трепещут!" #NT!
 nd_egy.1.b: "Нил обеспечивает. Пусть наше процветание будет нашим щитом." #NT!
 nd_egy.2.t: "Возрождение Аль-Азхара" #NT!
 nd_egy.2.d: "С момента своего основания Фатимидами в 970 году Аль-Азхар был маяком исламского образования. Под патронажем мамлюков мечеть-университет превратилась в ведущий центр суннитской науки в мире. Пожертвования вакфа финансируют учебные залы, где юристы обсуждают вопросы права, астрономы составляют карты небес, а врачи развивают искусство врачевания. Студенты приезжают из Андалусии, из Персии, из далеких стран Сахеля, привлеченные репутацией Аль-Азхара. Теперь, когда суверенитет Египта восстановлен, мы можем поднять этот древний институт на еще большую высоту. Должны ли мы инвестировать в его научную миссию или направить его престиж на стабильность государства?" #NT!
 nd_egy.2.a: "Аль-Азхар будет светильником мира." #NT!
 nd_egy.2.b: "Пусть Аль-Азхар направит верующих с обновленной властью." #NT!
 nd_egy.3.t: "Новый порядок" #NT!
 nd_egy.3.d: "Старая мамлюкская военная система, несмотря на всю свою славную историю, не может соперничать с дисциплинированными армиями Европы. Египетские студенты, отправленные за границу, вернулись со знаниями учебных пособий, современной тактики и организационных методов, которые превращают необработанных крестьянских призывников в профессиональных солдат. Низам-и Джедид, Новый Порядок, представляет собой не что иное, как революцию в военном деле Египта. Заводы в Каире теперь производят мушкеты и пушки по европейским стандартам. Военная академия обучает офицеров военной науке. Трансформация болезненна и дорогостояща, но альтернативой является подчинение. У Египта будет современная армия, или у Египта вообще не будет армии." #NT!
 nd_egy.3.a: "Египет будет стоять среди великих военных держав." #NT!
 nd_egy.3.b: "Модернизируйте экономику, а не только армию." #NT!
 nd_egy.4.t: "Ворота между морями" #NT!
 nd_egy.4.d: "Египет всегда был связующим звеном между двумя мирами. На севере Средиземное море соединяет нас с Европой и богатствами христианского мира. К востоку от нас Красное море открывает дорогу в Индию, к островам пряностей и богатствам Востока. Караваны пересекают Суэцкий перешеек, перевозя перец и шелк, кофе и благовония в количествах, которые потрясли бы воображение меньших наций. Наши склады в портах Суэца и Александрии переполнены товарами трех континентов. Только доходы от этой транзитной торговли могли финансировать королевство. Мы стоим на перекрестке мира, и каждый купец, проходящий через нашу землю, обогащает Египет." #NT!
 nd_egy.4.a: "Все дороги ведут через Египет." #NT!
 nd_egy_furusiyya: "Традиция Фурусия" #NT!
 nd_egy_furusiyya_desc: "Мамлюкское искусство верховой езды, стрельбы из лука и конного боя передавалось из поколения в поколение элитными солдатами-рабами." #NT!
 nd_egy_nile_irrigation: "Ирригационные системы Нила" #NT!
 nd_egy_nile_irrigation_desc: "Древние системы орошения бассейнов Нила, дополненные водяными колесами сакия и подъемными устройствами шадуф." #NT!
 nd_egy_wikala_network: "Торговая сеть Викала" #NT!
 nd_egy_wikala_network_desc: "Сеть городских караван-сараев, предоставляющая жилье, складские и коммерческие помещения для торговцев, путешествующих на большие расстояния." #NT!
 nd_egy_mamluk_administration: "Мамлюкская администрация" #NT!
 nd_egy_mamluk_administration_desc: "Сложная бюрократическая система, разработанная мамлюкскими султанами для управления Египтом и его провинциями." #NT!
 nd_egy_ancient_legacy: "Наследие фараонов" #NT!
 nd_egy_ancient_legacy_desc: "Пять тысяч лет цивилизации придают Египту непревзойденный культурный авторитет и престиж." #NT!
 nd_egy_slave_soldier_tradition: "Традиции рабов-солдат" #NT!
 nd_egy_slave_soldier_tradition_desc: "Практика обучения превращала рабов в элитных солдат, создавая военную касту непревзойденной лояльности и дисциплины." #NT!
 nd_egy_nile_fleet: "Речной флот Нила" #NT!
 nd_egy_nile_fleet_desc: "Мелкосидящие галеры, предназначенные для патрулирования и транспортировки по Нилу и в прибрежных водах Средиземного и Красного морей." #NT!
 nd_egy_azhar_revival: "Возрождение Аль-Азхара" #NT!
 nd_egy_azhar_revival_desc: "Восстановление и расширение Аль-Азхара как ведущего центра суннитской исламской науки в мире." #NT!
 nd_egy_cairo_madrasas: "Каирские медресе" #NT!
 nd_egy_cairo_madrasas_desc: "Сеть религиозных школ, основанная и финансируемая мамлюкской элитой, распространяющая грамотность и исламское образование." #NT!
 nd_egy_cotton_cultivation: "Египетский хлопок" #NT!
 nd_egy_cotton_cultivation_desc: "Выращивание и переработка ценного длинноволокнистого хлопка Египта, культуры, которая станет основой современной египетской экономики.\n\n#italic Доступно в: $nd_egy_wikala$#!" #NT!
 nd_egy_sultan_diplomacy: "Султанская дипломатия" #NT!
 nd_egy_sultan_diplomacy_desc: "Сложная дипломатическая традиция египетского султаната, балансирующая отношения между христианским миром, монгольскими ханствами и конкурирующими мусульманскими державами." #NT!
 nd_egy_granary_of_the_east: "Зернохранилище Востока" #NT!
 nd_egy_granary_of_the_east_desc: "Роль Египта как житницы восточного Средиземноморья, экспортирующей зерно для питания городов региона." #NT!
 nd_egy_suez_trade: "Суэцкий Транзит Трейд" #NT!
 nd_egy_suez_trade_desc: "Контроль над сухопутным мостом между Средиземным и Красным морями, кратчайшим путем между Европой и богатствами Азии." #NT!
 nd_egy_egyptian_sipahi: "Египетские сипахи" #NT!
 nd_egy_egyptian_sipahi_desc: "Тяжелая кавалерийская улана в традициях османских сипахов, адаптированных к египетским условиям и мамлюкскому наследию конной войны." #NT!
 nd_egy_spice_entrepot: "Перевалка специй" #NT!
 nd_egy_spice_entrepot_desc: "Позиция Египта как центрального склада торговли специями, где перец, корица и гвоздика переходят из рук в руки между восточными производителями и западными покупателями." #NT!
 nd_egy_citadel_tradition: "Цитадель Традиция" #NT!
 nd_egy_citadel_tradition_desc: "Традиция строительства монументальных крепостей, восходящая к Каирской цитадели Саладина, обеспечивала Египту огромные оборонительные возможности." #NT!
 nd_egy_sugar_processing: "Нильская сахарная промышленность" #NT!
 nd_egy_sugar_processing_desc: "Переработка сахарного тростника, выращенного в плодородной дельте Нила, — отрасль, которая когда-то сделала Египет крупным экспортером сахара в Средиземноморский мир.\n\n#italic Доступно в: $nd_egy_irrigation_works$#!" #NT!
 nd_egy_waqf_endowments: "Система пожертвований вакфа" #NT!
 nd_egy_waqf_endowments_desc: "Система благотворительных религиозных пожертвований, которая финансирует мечети, медресе, больницы и общественные работы по всему Египту." #NT!
 nd_egy_janissary_garrison: "Египетский янычарский гарнизон" #NT!
 nd_egy_janissary_garrison_desc: "Дисциплинированные пехотные гарнизонные войска, созданные по образцу османской янычарской системы, поддерживают порядок в городах и крепостях Египта." #NT!
 nd_egy_grand_bazaar: "Большой базар Каира" #NT!
 nd_egy_grand_bazaar_desc: "Расширение каирского Хан-эль-Халили и прилегающих к нему базарных районов в обширный коммерческий комплекс, способный конкурировать с любым рынком мира." #NT!
 nd_egy_iltizam_system: "Налоговое земледелие Илтизама" #NT!
 nd_egy_iltizam_system_desc: "Система продажи прав на сбор налогов с аукциона тому, кто предложит самую высокую цену, обеспечивающая немедленный доход государству за счет автономии провинций." #NT!
 nd_egy_coffee_culture: "Египетская кофейная культура" #NT!
 nd_egy_coffee_culture_desc: "Кофейни Каира становятся центрами общественной жизни, торговли и интеллектуального обмена, подпитываемыми зернами, импортируемыми через торговлю через Красное море." #NT!
 nd_egy_felucca_fleet: "Патрульный флот Фелукки" #NT!
 nd_egy_felucca_fleet_desc: "Флот быстрых фелюг с латиновым вооружением для прибрежного патрулирования, речного транспорта и легких военно-морских операций." #NT!
 nd_egy_sufi_orders: "Египетские суфийские ордена" #NT!
 nd_egy_sufi_orders_desc: "Могущественные суфийские братства Египта — Шадхилия, Ахмадия и другие, чьи ложи обеспечивают духовное руководство и социальную сплоченность." #NT!
 nd_egy_nizam_jedid: "Низам-и Джедид" #NT!
 nd_egy_nizam_jedid_desc: "«Новый порядок» — современная профессиональная армия, обученная европейской тактике, оснащенная оружием местного производства и возглавляемая офицерами, прошедшими академическую подготовку." #NT!
 nd_egy_cairo_arsenal: "Каир Арсенал" #NT!
 nd_egy_cairo_arsenal_desc: "Государственный оружейный завод, производящий мушкеты, пушки и боеприпасы для оснащения модернизированной египетской армии." #NT!
 nd_egy_cotton_monopoly: "Хлопковая монополия" #NT!
 nd_egy_cotton_monopoly_desc: "Государственный контроль над прибыльной торговлей длинноволокнистым хлопком, при этом египетский хлопок имеет высокие цены на европейских текстильных рынках." #NT!
 nd_egy_centralized_pashalik: "Централизованный Пашалик" #NT!
 nd_egy_centralized_pashalik_desc: "Превращение Египта из слабоуправляемой османской провинции в централизованное государство с прямым контролем над своими провинциями и ресурсами." #NT!
 nd_egy_corvee_system: "Система барщинного труда" #NT!
 nd_egy_corvee_system_desc: "Мобилизация крестьянского труда для великих общественных работ, каналов, плотин, дорог и укреплений — та же самая система, которая когда-то строила пирамиды.\n\n#italic Доступно в: $nd_egy_irrigation_works$#!" #NT!
 nd_egy_bulaq_press: "Типография Булак" #NT!
 nd_egy_bulaq_press_desc: "Первая типография в арабском мире, основанная в Булаке в Каире, выпускает арабские книги по военной науке, медицине и технике." #NT!
 nd_egy_modern_army: "Современная египетская армия" #NT!
 nd_egy_modern_army_desc: "Полностью модернизированные пехотные силы, обученные европейской линейной тактике, оснащенные капсюльными мушкетами и организованные в бригады и дивизии." #NT!
 nd_egy_industrial_works: "Египетская индустриализация" #NT!
 nd_egy_industrial_works_desc: "Государственные фабрики по производству текстиля, оружия и обработанных товаров являются частью амбициозной программы по превращению Египта в индустриальную державу." #NT!
 nd_egy_modern_medicine: "Египетская медицинская школа" #NT!
 nd_egy_modern_medicine_desc: "Современная медицинская школа в Каире, обучающая врачей европейским хирургическим методам и практике общественного здравоохранения." #NT!
 nd_egy_suez_transit: "Доходы от Суэцкого транзита" #NT!
 nd_egy_suez_transit_desc: "Огромный доход, полученный от контроля над кратчайшим торговым путем между Европой и Азией, поскольку перешеек становится самым загруженным торговым коридором в мире." #NT!
 nd_egy_peasant_conscription: "Крестьянский призыв" #NT!
 nd_egy_peasant_conscription_desc: "Массовый призыв египетских крестьян в национальную армию, превращающий феллахов в солдат государства." #NT!
 nd_egy_national_awakening: "Египетское национальное пробуждение" #NT!
 nd_egy_national_awakening_desc: "Появление египетского национального сознания, отличного от османской имперской идентичности, обусловленное общим языком, историей и опытом модернизации." #NT!
 a_nd_egy_ghulam: "Мамлюк Гулам" #NT!
 a_nd_egy_ghulam_desc: "Элитная кавалерия рабов-солдат с юности обучалась искусству фурусия верховой езды, стрельбы из лука и конного боя. Они преданы только султану." #NT!
 n_nd_egy_nile_galley: "Нил Галлей" #NT!
 n_nd_egy_nile_galley_desc: "Мелкосидящая галера, предназначенная для патрулирования и транспортировки по реке Нил и в прибрежных водах восточного Средиземноморья." #NT!
 a_nd_egy_sipahi: "Египетские сипахи" #NT!
 a_nd_egy_sipahi_desc: "Тяжелые кавалерийские уланы, сочетающие мамлюкскую традицию фурусийя с османским снаряжением сипахи, разрушительны в атаке." #NT!
 a_nd_egy_janissary: "Египетский янычар" #NT!
 a_nd_egy_janissary_desc: "Дисциплинированная гарнизонная пехота, обученная по османским методам, составила костяк постоянной армии Египта." #NT!
 n_nd_egy_felucca: "Фелукка" #NT!
 n_nd_egy_felucca_desc: "Быстрое судно с латунным вооружением, идеально подходящее для плавания по Нилу, Красному морю и прибрежным водам Египта. Используется для патрулирования, торговли и легкого боя." #NT!
 a_nd_egy_nizam: "Низам-и Джедид" #NT!
 a_nd_egy_nizam_desc: "Солдаты Нового Порядка, египетская пехота, обученная европейской линейной тактике, обученная вести залповый огонь и маневрировать строем." #NT!
 a_nd_egy_modern_infantry: "Египетская линейная пехота" #NT!
 a_nd_egy_modern_infantry_desc: "Современная профессиональная пехота, оснащенная капсюльными мушкетами и штыками, организованная в бригады европейского образца." #NT!
 a_nd_egy_fellahin_conscript: "Феллахин-призывник" #NT!
 a_nd_egy_fellahin_conscript_desc: "Египетские крестьяне-призывники, многочисленные, но менее опытные, чем профессиональные солдаты. Недостаток подготовки они компенсируют просто численностью." #NT!
 nd_egy_irrigation_works: "Ирригационные сооружения Нила" #NT!
 nd_egy_irrigation_works_desc: "Бассейновые ирригационные системы, водяные колеса сакия и сети каналов, которые превращают пойму Нила в самые продуктивные сельскохозяйственные угодья в регионе." #NT!
 nd_egy_wikala: "Викала" #NT!
 nd_egy_wikala_desc: "Городской караван-сарай, предоставляющий безопасное жилье, складские и коммерческие помещения для торговцев, путешествующих по торговым путям через Египет." #NT!
 nd_egy_mamluk_barracks: "Мамлюкские казармы" #NT!
 nd_egy_mamluk_barracks_desc: "Учебный комплекс, где солдаты-рабы обучаются военному искусству, превращаясь в элитную кавалерию и лояльные гарнизонные войска." #NT!
 nd_egy_madrasa: "Каирское медресе" #NT!
 nd_egy_madrasa_desc: "Школа исламского права и теологии, финансируемая правящей элитой, часть образовательной сети, сосредоточенной в Аль-Азхаре." #NT!
 nd_egy_grain_granary: "Нильское зернохранилище" #NT!
 nd_egy_grain_granary_desc: "Государственное зернохранилище, хранящее излишки урожая Нила, обеспечивающее продовольственную безопасность и позволяющее экспортировать зерно в Средиземноморье." #NT!
 nd_egy_red_sea_warehouse: "Склад Красного моря" #NT!
 nd_egy_red_sea_warehouse_desc: "Прибрежное хранилище для товаров, следующих транзитом между Красным морем и Средиземным морем, основа роли Египта как торгового посредника." #NT!
 nd_egy_bazaar: "Гранд Базар" #NT!
 nd_egy_bazaar_desc: "Обширный рыночный комплекс в традициях Хан-эль-Халили, где купцы с трех континентов покупают и продают товары под одной крышей." #NT!
 nd_egy_arsenal: "Каир Арсенал" #NT!
 nd_egy_arsenal_desc: "Государственный оружейный завод, производящий мушкеты, пушки и порох для модернизированной египетской армии." #NT!
 nd_egy_state_factory: "Государственный завод" #NT!
 nd_egy_state_factory_desc: "Государственное предприятие по производству текстиля, обработанных товаров и военной техники в рамках программы индустриализации Египта." #NT!
 nd_egy_cotton_processing: "Переработка египетского хлопка" #NT!
 nd_egy_cotton_processing_desc: "Ткачество и отделка ценного египетского длинноволокнистого хлопка в тонкую ткань для экспорта." #NT!
 nd_egy_sugar_refining: "Нилский сахарный завод" #NT!
 nd_egy_sugar_refining_desc: "Эксплуатация сахарных заводов в дельте Нила, использование пиломатериалов в качестве топлива, керамических контейнеров для процесса очистки и инструментов для машин." #NT!
 nd_egy_corvee_labor: "Барщинный труд" #NT!
 nd_egy_corvee_labor_desc: "Мобилизация крестьянского труда для проектов общественных работ. Та же система, которая строила пирамиды, теперь строит каналы и фабрики." #NT!
 levy_nd_egy_ghulam: "Мамлюк Гулам Леви" #NT!
 levy_nd_egy_ghulam_desc: "Элитная кавалерия рабов-солдат, созданная посредством традиционной мамлюкской системы военного набора." #NT!
 levy_nd_egy_felucca: "Фелукский патруль Леви" #NT!
 levy_nd_egy_felucca_desc: "Легкие речные и прибрежные патрульные суда с экипажами египетских моряков и рыбаков." #NT!
 levy_nd_egy_fellahin: "Феллахин-призывник-набор" #NT!
 levy_nd_egy_fellahin_desc: "Массовый призыв египетских крестьян на пехотную службу, обеспечивающий количество важнее качества." #NT!
 nd_egy_irrigation_maintenance: "Обслуживание ирригации" #NT!
 nd_egy_irrigation_maintenance_desc: "Поддержание каналов, дамб и водяных колес сакия, которые направляют щедрую воду Нила на поля." #NT!
 nd_egy_wikala_maintenance: "Содержание Викалы" #NT!
 nd_egy_wikala_maintenance_desc: "Управляет городским караван-сараем, предоставляя складские помещения и жилье для торговцев, путешествующих на дальние расстояния." #NT!
 nd_egy_barracks_maintenance: "Содержание казарм" #NT!
 nd_egy_barracks_maintenance_desc: "Обеспечение мамлюкских казарм лошадьми, оружием и учебным оборудованием." #NT!
 nd_egy_madrasa_maintenance: "Содержание медресе" #NT!
 nd_egy_madrasa_maintenance_desc: "Снабжение центра исламского обучения рукописями, бумагой и научными материалами." #NT!
 nd_egy_granary_maintenance: "Содержание зернохранилища" #NT!
 nd_egy_granary_maintenance_desc: "Поддержание зернохранилищ, позволяющих сохранить излишки сельскохозяйственной продукции Египта." #NT!
 nd_egy_warehouse_maintenance: "Содержание склада" #NT!
 nd_egy_warehouse_maintenance_desc: "Управление торговым складом на Красном море, хранение товаров, следующих транзитом между Индийским океаном и Средиземным морем." #NT!
 nd_egy_bazaar_maintenance: "Содержание базара" #NT!
 nd_egy_bazaar_maintenance_desc: "Содержание ларьков, складов и торговой инфраструктуры гранд базара." #NT!
 nd_egy_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_egy_arsenal_maintenance_desc: "Производство и хранение оружия, боеприпасов и военной техники." #NT!
 nd_egy_factory_maintenance: "Производство хлопкового текстиля" #NT!
 nd_egy_factory_maintenance_desc: "Переработка египетского хлопка в готовую ткань с использованием угольного оборудования на государственных фабриках." #NT!
 STATIC_MODIFIER_NAME_nd_egy_azhar_authority: "Власть Аль-Азхара" #NT!
 STATIC_MODIFIER_DESC_nd_egy_azhar_authority: "Возобновившийся престиж Аль-Азхара привлекает ученых со всего исламского мира, придавая государству религиозную легитимность и способствуя развитию культуры обучения и юриспруденции." #NT!
 STATIC_MODIFIER_NAME_nd_egy_economic_modernization: "Экономическая модернизация" #NT!
 STATIC_MODIFIER_DESC_nd_egy_economic_modernization: "Новый Порядок выходит за рамки казарм. Фабрики, современные мастерские и реформированная торговая практика преобразуют экономику Египта наряду с его вооруженными силами." #NT!
 nd_egy_formed_tt: "Египет был образован." #NT!
 nd_egy_path_a_tt: "Выбрать Меч Султана" #NT!
 nd_egy_path_b_tt: "Выбрал Сад Нила" #NT!
 nd_egy_destiny: "Египетская судьба" #NT!
 nd_egy_destiny_desc: "Египет стоит на перепутье. Наследники фараонов будут преследовать меч или плуг? Судьба Нила ждет." #NT!
 nd_egy_dest_levant: "Завоевание Леванта" #NT!
 nd_egy_dest_levant_desc: "Обезопасьте Иерусалим и Дамаск, чтобы восстановить владычество Египта над землями восточного Средиземноморья, которыми когда-то владели мамлюки." #NT!
 nd_egy_dest_heart_islam: "Сердце Ислама" #NT!
 nd_egy_dest_heart_islam_desc: "Возьмите под контроль Священные города и захватите Багдад, резиденцию древнего халифата, чтобы стать бесспорным центром исламского мира." #NT!
 nd_egy_dest_sultan_domain: "Владения султана" #NT!
 nd_egy_dest_sultan_domain_desc: "Расширьте суверенитет Египта от Алеппо до Адена, контролируя все пути между Средиземным морем и Индийским океаном под знаменем султана." #NT!
 nd_egy_dest_nile_bounty: "Награда Нила" #NT!
 nd_egy_dest_nile_bounty_desc: "Используйте современную банковскую систему, развивайте торговлю хлопком и превратите долину Нила в двигатель процветания, не имеющий аналогов в регионе." #NT!
 nd_egy_dest_crossroads: "Перекресток торговли" #NT!
 nd_egy_dest_crossroads_desc: "Обеспечьте безопасность побережья Красного моря в Массауа и превратите Египет в незаменимый торговый звено между Европой и Азией." #NT!
 nd_egy_dest_jewel_orient: "Жемчужина Востока" #NT!
 nd_egy_dest_jewel_orient_desc: "Индустриализировать египетскую экономику, сделав долину Нила самой развитой и процветающей землей между Европой и Индией." #NT!
 nd_egy.5.t: "Судьба Египта манит" #NT!
 nd_egy.5.d: "Формирование Египта завершено, но работа только началась. Перед нами лежат две дороги: одна вымощена победами меча, другая выложена золотом торговли и зеленью урожая Нила. Наши предки строили памятники, которые простояли пять тысяч лет. Какой бы путь мы ни выбрали, пусть наши дела будут звучать так же долго." #NT!
 nd_egy.5.a: "Наша судьба написана звездами над Нилом." #NT!
 nd_egy.6.t: "Орел возвращается в Левант" #NT!
 nd_egy.6.d: "Египетские знамена вновь развеваются над священным городом Иерусалимом и древними стенами Дамаска. Мамлюкские султаны прошлого, Бейбарс, Калавун, ан-Насир, признали бы амбиции, которые нами движут. Левантийское побережье, спорный берег, где крестоносцы и монголы когда-то нарушили решимость Египта, снова принадлежит нам. Командиры наших гарнизонов сообщают, что города взяты под контроль, торговые пути вновь открыты, а местное население приспосабливается к египетской администрации. Владения султана простираются от дельты Нила до сирийских степей." #NT!
 nd_egy.6.a: "Левант еще раз склоняется перед султаном." #NT!
 nd_egy.7.t: "Обещание Нила выполнено" #NT!
 nd_egy.7.d: "Египетский хлопок теперь имеет высокие цены на рынках мира, а наши банковские дома предоставляют кредиты по всему Средиземноморью. Преобразование поразительно: когда-то мы полагались на меч и сбор, теперь мы строим с помощью капитала и торговли. Щедрость Нила, передаваемая через современные финансовые инструменты, генерирует богатство, которое в одиночку не сможет захватить ни одна армия. Иностранные купцы конкурируют за право торговать на наших рынках, а египетские векселя обращаются от Венеции до Исфахана." #NT!
 nd_egy.7.a: "Процветание течет так же уверенно, как Нил." #NT!
 nd_egy.8.t: "Хранитель Двух Святилищ" #NT!
 nd_egy.8.d: "Завоевание Мекки и Багдада ставит Египет в самое сердце исламского мира. Опека над священными городами наделяет религиозную власть, превосходящую просто светскую власть, в то время как контроль над Багдадом, когда-то резиденцией халифата Аббасидов, ставит под угрозу претензии Египта на то, чтобы быть преемником этого древнего института. Вопрос теперь в том, как воспользоваться этим исключительным положением. Должны ли мы подчеркнуть свою роль военного стража, проецирующего силу для защиты верующих? Или мы должны претендовать на мантию легитимности халифа, используя дипломатию и престиж для создания сети лояльных подданных?" #NT!
 nd_egy.8.a: "Мы будем охранять верующих нашими армиями." #NT!
 nd_egy.8.b: "Мы претендуем на наследие халифов Аббасидов." #NT!
 nd_egy.9.t: "Вопрос о Красном море" #NT!
 nd_egy.9.d: "Поскольку торговая инфраструктура Египта процветает, а побережье Красного моря находится под нашим контролем, мы находимся на историческом этапе. Торговля между Европой и Азией должна проходить через наши руки, но какую выгоду мы получим от этого положения? Мы могли бы напрямую доминировать на морских путях, создав военно-морское присутствие, которое будет контролировать каждое судно от Суэца до Индийского океана. Или мы могли бы сосредоточиться на хлопковых и товарных биржах, превратив Египет в незаменимую в мире расчетную палату, где восточные товары встречаются с западным капиталом. Каждый подход обещает богатство, но разного характера." #NT!
 nd_egy.9.a: "Управляйте морскими путями от Суэца до Адена." #NT!
 nd_egy.9.b: "Сделать Египет мировой хлопковой биржей." #NT!
 nd_egy.10.t: "Триумф султана" #NT!
 nd_egy.10.d: "От Алеппо до Адена владения султана простираются через древние центры цивилизации. Египет контролирует торговые пути, священные города и великий перекресток трех континентов. Ни одна сила в регионе не может сравниться с нашими возможностями. И все же империя дает возможность выбора, сможем ли мы превратить наше господство в железный инструмент завоевания, поддерживая огромные армии и навязывая свою волю посредством чистого военного превосходства? Или нам следует закрепить наши достижения, создав Pax Aegyptia, где египетская разведка и гарнизоны будут поддерживать порядок, пока наши армии отдыхают?" #NT!
 nd_egy.10.a: "Выкуйте железный кулак султана." #NT!
 nd_egy.10.b: "Установите мир в Египте." #NT!
 nd_egy.11.t: "Жемчужина Востока" #NT!
 nd_egy.11.d: "Египет достиг того, о чем осмеливаются мечтать немногие страны. Промышленно развитая экономика, обширная развитая территория и богатство, которому позавидовали бы фараоны. Долина Нила кипит от машин прогресса, заводов, железных дорог, современных ирригационных сооружений, превращающих древнюю почву в самые продуктивные сельскохозяйственные угодья на земле. Теперь перед нами стоит главный вопрос: будет ли Египет использовать свое богатство и изысканность, чтобы проецировать влияние за пределы страны, стремясь к новым горизонтам с уверенностью возрожденной цивилизации? Или нам следует обратить свой взор на Суэцкий перешеек, эту узкую полоску земли, которая, если ее пронзить, может превратить Египет в незаменимое связующее звено между океанами мира?" #NT!
 nd_egy.11.a: "Египет достигнет новых горизонтов." #NT!
 nd_egy.11.b: "Канал объединит моря мира." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_guardian_holy: "Хранитель священных городов" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_guardian_holy: "Армии Египта охраняют священные места ислама, используя военную мощь для защиты верующих и укрепления власти султана на Ближнем Востоке." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_abbasid_heir: "Наследник Аббасидов" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_abbasid_heir: "Египет претендует на дипломатическое и духовное наследие халифата Аббасидов, используя религиозный престиж и политическое влияние, чтобы привязать исламский мир к воле Каира." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_iron_sultan: "Железный султан" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_iron_sultan: "Военная машина Египта — это террор региона, огромные армии, неприступные крепости и железная воля, которая сокрушает любое сопротивление, хотя цена этого истощает казну." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_pax_aegyptia: "Пакс Египет" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_pax_aegyptia: "Сети египетской разведки и гарнизонные силы поддерживают порядок на обширных владениях султана, обеспечивая стабильность посредством бдительности, а не завоеваний, хотя имперское самоуспокоение еще может укорениться." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_red_sea_master: "Хозяин Красного моря" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_red_sea_master: "Военно-морское господство Египта в Красном море гарантирует, что ни одно судно не пройдет между Средиземным морем и Индийским океаном без разрешения Египта и получения прибыли Египта." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_cotton_exchange: "Хлопковая биржа" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_cotton_exchange: "Египетский хлопок доминирует на мировом рынке, а товарные биржи Каира устанавливают цены, которые должны принимать торговцы от Лиссабона до Калькутты." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_pharaoh_reborn: "Фараон возрождается" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_pharaoh_reborn: "Египет выходит за пределы страны с уверенностью возрожденной цивилизации, проецируя влияние далеко за пределы долины Нила, хотя поддержание такого величия требует еще больших судебных расходов." #NT!
 STATIC_MODIFIER_NAME_nd_egy_dest_suez_vision: "Видение Суэца" #NT!
 STATIC_MODIFIER_DESC_nd_egy_dest_suez_vision: "Египет превращается в незаменимый морской коридор мира, принимая корабли всех стран через свои воды и богатея на транзите глобальной торговли." #NT!
 nd_egy_sultans_citadel: "Цитадель Султана" #NT!
 nd_egy_sultans_citadel_desc: "Монументальная крепость-дворец в традициях Цитадели Саладина, служащая военным и административным центром владений султана." #NT!
 nd_egy_suez_canal_office: "Офис Суэцкого канала" #NT!
 nd_egy_suez_canal_office_desc: "Грандиозный административный комплекс, управляющий потоками международной торговли через транзитный коридор Египта, экономический двигатель современного египетского государства." #NT!
 nd_egy_citadel_maintenance: "Цитадель Гарнизон" #NT!
 nd_egy_citadel_maintenance_desc: "Поддержание монументальной крепости с постоянным гарнизоном, арсеналом и продовольствием для защиты королевства." #NT!
 nd_egy_canal_maintenance: "Администрация канала" #NT!
 nd_egy_canal_maintenance_desc: "Управление административным механизмом транзитной торговли Египта, управление графиками перевозок, тарифами и портовыми мощностями." #NT!
  
  # ===== BUREAUCRACIES ===== 
 egy_diwan_al_jaysh_bureaucracy: "Диван аль-Джайш" #NT!
 egy_diwan_al_jaysh_bureaucracy_desc: "Армейское бюро, центральный административный орган государства Мамлюк, отвечало за обширную документацию системы икта. Его писцы составили манашир, дипломы о назначении, которые давали каждому эмиру право на получение дохода; в его регистрах (джараид) фиксировались сила и обязанности каждого контингента. Бюро работало рука об руку с канцелярией: там, где начиналось подробное содержание указа, канцелярия копировала непосредственно из списков Диван аль-Джайша. По мнению Ибн Халдуна, это был институт, который превратил рабовладельческую аристократию в функционирующее государство." #NT!
 egy_iqta_system_bureaucracy: "Система Икта" #NT!
 egy_iqta_system_bureaucracy_desc: "Военный земельный грант, по которому мамлюкские эмиры получали доходы провинций вместо денежного жалованья, был доминирующим военно-фискальным институтом султаната. В отличие от наследственной икты более ранних династий, гранты мамлюков не передавались строго по наследству и менялись между владельцами каждые несколько лет, чтобы предотвратить укоренение на местном уровне. Система обеспечивала постоянную кавалерию без бремени денежных зарплат, но в конце периода Бурджи великие амиры все больше захватывали сельскую финансовую базу, еще сильнее давя на феллахов и моря голодом султанскую казну в Каире." #NT!
 egy_amirate_hierarchy_bureaucracy: "Мамлюкский амират" #NT!
 egy_amirate_hierarchy_bureaucracy_desc: "Градуированная иерархия офицеров-мамлюков: амир десяти (амир ашара), амир сорока (амир таблхана, который мог собрать свой собственный оркестр литавр), амир ста и командир тысячи (мукаддам альф). Каждое звание имело фиксированный контингент мамлюков, фиксированную оценку икта и фиксированное место в парадном порядке. Система дала султанату армию и офицерский корпус, но великие эмиры сотни были также фракционными создателями королей, которые свергали и возвышали султанов на протяжении столетий Бахри и Бурджи: ступенчатая аристократия, чья лояльность трону всегда была условной." #NT!
 egy_al_azhar_bureaucracy: "Аль-Азхар" #NT!
 egy_al_azhar_bureaucracy_desc: "Великая мечеть-университет Каира, основанная фатимидским генералом Джаухаром ас-Сикилли в 970 году как шиитское учреждение, затем вновь основанная Саладином в 1171 году как суннитское и возведенная в выдающийся центр суннитской науки в мире на протяжении веков мамлюков. Каждая из четырех суннитских школ имела свой собственный преподавательский кружок (ривак) под руководством своего главного муфтия; улемы, прошедшие обучение в аль-Азхаре, работали в египетских мечетях, судах и медресе, и на протяжении веков Османской империи это учреждение оставалось интеллектуальной столицей арабского мира." #NT!
 egy_qadi_al_qudat_bureaucracy: "Кади аль-Кудат" #NT!
 egy_qadi_al_qudat_bureaucracy_desc: "Система главного судьи, официально оформленная султаном Бейбарсом в 1265 году, согласно которой в Каире располагался не один, а четыре главных кади, по одному для каждой из суннитских юридических школ: Ханафи, Шафии, Малики и Ханбали. Каждый главный судья назначал заместителей в своем мазхабе по всему королевству и председательствовал в наследственных, контрактных и семейных спорах для приверженцев своей школы. Это соглашение сделало Каир судебной столицей суннитского мира и обеспечило каждому мазхабу институциональный статус, но оно также закрепило автономию улемов от вмешательства султана и привело к юрисдикционному соперничеству, которое иногда парализовало работу судов." #NT!
 egy_diwan_al_aqbat_bureaucracy: "Диван аль-Акбат" #NT!
 egy_diwan_al_aqbat_bureaucracy_desc: "Давняя работа клерков-коптов-христиан в фискальных бюро Египта, традиция, восходящая к регистрам Хараджа Аббасидов и переживающая каждую смену династии. Коптские секретарские династии обладали практическими знаниями в области оценки земель, учета доходов и геодезии, которые сменявшие друг друга мусульманские режимы не могли легко заменить; один Хибат Аллах аль-Садид даже дослужился до Мустауфи аль-Сухбы (главного контролера) при Калауне. Их преемственность была подчеркнута как минимум девятью задокументированными чистками в период с конца тринадцатого по середину пятнадцатого веков (вызванных давлением толпы или благосклонностью султана), но клерки всегда восстанавливались, когда регистры впадали в хаос." #NT!
 egy_muhtasib_bureaucracy: "Мухтасиб из Каира" #NT!
 egy_muhtasib_bureaucracy_desc: "Рыночный инспектор Каира, которому в соответствии с доктриной «хисба» было поручено обеспечивать соблюдение точных мер и весов, справедливых цен, качества товаров и общественной морали на базарах и улицах крупнейшего города к западу от Китая. В руководствах хисба были четко определены обязанности офиса вплоть до правильной ширины улиц и проверки мясных ножей. На практике мухтасиб Каира был одним из самых влиятельных гражданских учреждений в королевстве, поскольку регулирование рынка, который кормил полмиллиона душ, было разницей между спокойствием и хлебными бунтами, а его указы о фиксированных ценах регулярно противоречили как эмирам, запасавшим зерно, так и сельским феллахам, которые считали свою продукцию недооцененной." #NT!
  
 AUTO_MODIFIER_NAME_nd_egy_bureaucracy_authority: "Султанатские Диваны" #NT!
 AUTO_MODIFIER_DESC_nd_egy_bureaucracy_authority: "Диваны Каирской Цитадели (армейское бюро, канцелярия, казначейство, бюро тайного кошелька) превратились в постоянный институциональный аппарат, регистрирующий гранты икта, составляющий манашир и ведающий учет доходов королевства. На этом фундаменте своеобразные государственные институты Египта начинают обретать прочную форму." #NT!
