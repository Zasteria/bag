l_russian:
 STATIC_MODIFIER_NAME_nd_swi_armed_neutrality: "Вооруженный нейтралитет" #NT!
 STATIC_MODIFIER_DESC_nd_swi_armed_neutrality: "Швейцарская Конфедерация выбрала путь вооруженного нейтралитета, страны, которая не ведет внешних войн, но делает себя неприступной дома. За горными стенами и кантональными ополчениями Эйдгеноссены создают республику, которая не подчиняется ни императору, ни королю, ни папе." #NT!
 STATIC_MODIFIER_NAME_nd_swi_reislaufer_tradition: "Рейслауфер Традиция" #NT!
 STATIC_MODIFIER_DESC_nd_swi_reislaufer_tradition: "Кантоны воспользовались своей военной репутацией, отправив своих сыновей сражаться на службе европейских королей. Швейцарские наемники — самая опасная пехота на континенте, а пенсионное золото, возвращающееся в альпийские долины, обогащает нацию воинов." #NT!
 STATIC_MODIFIER_NAME_nd_swi_perpetual_peace: "Вечный мир" #NT!
 STATIC_MODIFIER_DESC_nd_swi_perpetual_peace: "После десятилетий кровопролития в войнах Италии швейцарцы заключили прочный мир, который меняет их место в Европе. Они больше не агрессоры, а уважаемые нейтралы, чье слово имеет вес именно потому, что они больше не обнажают мечи." #NT!
 STATIC_MODIFIER_NAME_nd_swi_reformation_spirit: "Дух Реформации" #NT!
 STATIC_MODIFIER_DESC_nd_swi_reformation_spirit: "Учения Цвингли и Кальвина распространились по швейцарским кантонам, привнося новый акцент на грамотность, образование и прямую связь человека с Священным Писанием." #NT!
 STATIC_MODIFIER_NAME_nd_swi_counter_reformation_zeal: "Контрреформационный рвение" #NT!
 STATIC_MODIFIER_DESC_nd_swi_counter_reformation_zeal: "Католические кантоны сплотились в защиту старой веры, усилив свою преданность и миссионерские усилия против протестантской волны." #NT!
 nd_swi.1.t: "Рождение Eidgenossenschaft" #NT!
 nd_swi.1.d: "Швейцарские кантоны достигли того, что казалось невозможным: из разрозненных горных общин, связанных только клятвами взаимной защиты, в самом сердце Европы была создана новая нация. Конфедерация является доказательством того, что свободным людям не нужно подчиняться никакому принцу. Но что это за нация?\n\nАльпийские перевалы контролируют торговые пути между Италией и Северной Европой. Кантональные ополченцы разгромили каждую армию, посланную против них. Вопрос не в том, выстоит ли Швейцария, а в том, кем она станет: крепостью сама по себе или нацией, чьи воины маршируют под иностранными знаменами за золотом и славой.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_swi.1.a: "Мы будем крепостью; никто не перейдет через наши горы без приглашения" #NT!
 nd_swi.1.b: "Наши щуки сдаются в прокат. Пусть короли Европы претендуют на нашу услугу" #NT!
 nd_swi.2.t: "Вечный мир 1516 года." #NT!
 nd_swi.2.d: "Бедствия Итальянских войн, кровавая бойня в Мариньяно, где тысячи швейцарских копейщиков пали от французской артиллерии, бесполезные осады и разрушенные союзы преподнесли Конфедерации горький урок. Война за рубежом приносит славу отдельным людям и разрушение государству.\n\nДоговор о вечном мире с Францией, подписанный во Фрибурге в 1516 году, знаменует собой поворотный момент. Швейцария больше не будет вести завоевательные войны. Взамен французская корона получает право вербовать швейцарских наемников, но сама Конфедерация стоит в стороне от европейских конфликтов, ее нейтралитет приобретается не слабостью, а продемонстрированной свирепостью ее граждан." #NT!
 nd_swi.2.a: "Пусть этот мир сохранится; наша сила в нашей сдержанности" #NT!
 nd_swi.3.t: "Швейцарская Реформация" #NT!
 nd_swi.3.d: "Конфедерация переживает тяжелейший внутренний кризис. Хульдрих Цвингли в Цюрихе, а затем Жан Кальвин в Женеве разорвали религиозное единство, связывавшее кантоны. Католические и протестантские кантоны смотрят друг на друга с подозрением, а Каппельские войны уже пролили кровь между братьями.\n\nОднако из этого горнила конфессиональных распрей возникает нечто неожиданное: неохотная терпимость, рожденная по необходимости. Ни одна из сторон не может сокрушить другую, не уничтожив при этом саму Конфедерацию. Швейцарцы должны найти способ жить со своими разногласиями, иначе они погибнут разделенными." #NT!
 nd_swi.3.a: "Примите новое обучение. Пусть Священные Писания и разум ведут нас" #NT!
 nd_swi.3.b: "Держитесь истинной веры; старые способы сослужили нам хорошую службу" #NT!
 nd_swi.4.t: "Расцвет банковского дела в Женеве" #NT!
 nd_swi.4.d: "С тех пор, как в 1387 году епископ Адемар Фабри предоставил женевским банкирам разрешение взимать проценты, город превратился в один из ведущих финансовых центров Европы. Крупные торговые ярмарки привлекают купцов и финансистов со всего континента, а прагматичная интерпретация Кальвином законов о ростовщичестве еще больше ослабила ограничения на торговлю.\n\nШвейцарские банковские дома теперь управляют богатством как принцев, так и купцов. Счетные палаты Женевы, Базеля и Цюриха образуют финансовую сеть, охватывающую весь континент, конфиденциальную, эффективную и подотчетную только своим кантональным советам." #NT!
 nd_swi.4.a: "Золото течёт к тем, кто сдерживает свои обещания и молчание" #NT!
 nd_swi.5.t: "Искусство точности" #NT!
 nd_swi.5.d: "Беженцы-гугеноты, спасающиеся от преследований во Франции, привезли свои выдающиеся навыки в часовом деле в Женеву, где часовое искусство пустило корни и процветало. Швейцарские ателье сегодня производят лучшие в Европе часы, сложные механизмы с шестернями и пружинами, которые измеряют часы с беспрецедентной точностью.\n\nТо, что начиналось как ремесло для богатых посетителей, становится индустрией. Точность, требуемая часовым производством, стимулирует инновации в металлообработке, оптике и технике. Репутация Швейцарии в области тщательного мастерства, уже зарекомендовавшая себя в производстве оружия и текстиля, теперь находит свое окончательное выражение в изысканных механизмах, работающих в мастерских от Женевы до Шаффхаузена." #NT!
 nd_swi.5.a: "Точность — швейцарская добродетель на войне, в финансах, а теперь и в ремесле." #NT!
 nd_swi_letzi_fortifications: "Укрепления Летци" #NT!
 nd_swi_letzi_fortifications_desc: "Строительство барьерных стен Летци через альпийские долины и подходы к озерам, направляя захватчиков в подготовленные зоны поражения." #NT!
 nd_swi_alpine_halberdiers: "Альпийские алебардисты" #NT!
 nd_swi_alpine_halberdiers_desc: "Горные воины, владевшие алебардой, уникальным швейцарским оружием, сочетающим в себе топор, крюк и шип, оказывающим разрушительное воздействие на рыцарей в доспехах." #NT!
 nd_swi_alpine_crossbowmen: "Альпийские арбалетчики" #NT!
 nd_swi_alpine_crossbowmen_desc: "Швейцарские стрелки тренировались в использовании арбалета в горной местности, оказывая поддержку на расстоянии, прежде чем алебардисты приблизятся к цели." #NT!
 nd_swi_communal_oath: "Коммунальная клятва" #NT!
 nd_swi_communal_oath_desc: "Традиция Eidgenossenschaft, клятвы взаимной защиты, которая объединяет свободные сообщества без феодального господства." #NT!
 nd_swi_alpine_passes: "Альпийский перевал Трейд" #NT!
 nd_swi_alpine_passes_desc: "Контроль над великими альпийскими перевалами Готард, Симплон и Большой Сен-Бернар, соединяющими северную и южную Европу." #NT!
 nd_swi_sempach_legacy: "Наследие Земпаха" #NT!
 nd_swi_sempach_legacy_desc: "Победа при Земпахе в 1386 году, превратившая швейцарцев из мятежных крестьян в признанную военную державу, вызывала страх во всей Европе." #NT!
 nd_swi_tagsatzung_tradition: "Тегисацунг Традиция" #NT!
 nd_swi_tagsatzung_tradition_desc: "Институт Тагацунга, федерального парламента, в котором кантональные делегаты обсуждали политику посредством консенсуса, а не командования." #NT!
 nd_swi_gevierthaufen: "Гевиртхауфен Тактикс" #NT!
 nd_swi_gevierthaufen_desc: "Развитие Гевиртауфена, массивных пиковых колонн из тысяч дисциплинированных пехотинцев, продвигающихся скоординированными эшелонами." #NT!
 nd_swi_mercenary_contracts: "Наемная капитуляция" #NT!
 nd_swi_mercenary_contracts_desc: "Институционализация наемнической службы, когда кантональные правительства ведут переговоры об официальных соглашениях о капитуляции с иностранными державами." #NT!
 nd_swi_textile_industry: "Швейцарская текстильная промышленность" #NT!
 nd_swi_textile_industry_desc: "Процветающее текстильное производство было сосредоточено в Санкт-Галлене, Цюрихе и Базеле, специализируясь на производстве льна, шерсти, а затем и шелка." #NT!
 nd_swi_alpine_hospices: "Альпийские хосписы" #NT!
 nd_swi_alpine_hospices_desc: "Сеть хосписов, поддерживаемая монашескими орденами вдоль великих альпийских перевалов, предлагает приют и уход путешественникам и паломникам." #NT!
 nd_swi_swiss_guard_heritage: "Наследие швейцарской гвардии" #NT!
 nd_swi_swiss_guard_heritage_desc: "Престиж швейцарской военной службы, олицетворяемый Папской швейцарской гвардией, является высшим свидетельством военной репутации Швейцарии." #NT!
 nd_swi_pike_warfare: "Швейцарская пиковая война" #NT!
 nd_swi_pike_warfare_desc: "Совершенство тактики пикового квадрата, которое сделало швейцарскую пехоту ужасом на европейских полях сражений от Грансонона до Новары." #NT!
 nd_swi_reislaufer_service: "Райслойфер Сервис" #NT!
 nd_swi_reislaufer_service_desc: "Профессиональная наемническая традиция Reisläufer, швейцарских солдат, которые нанимали свои услуги тому, кто предлагал самую высокую цену в Европе." #NT!
 nd_swi_perpetual_peace_advance: "Вечный мир" #NT!
 nd_swi_perpetual_peace_advance_desc: "Договор о вечном мире с Францией в 1516 году, ознаменовавший решительный отказ Швейцарии от завоевательных войн." #NT!
 nd_swi_geneva_banking: "Женевское банковское дело" #NT!
 nd_swi_geneva_banking_desc: "Возвышение Женевы как европейского финансового центра, основанное на ее средневековых торговых ярмарках и прагматичном подходе Кальвина к ростовщичеству." #NT!
 nd_swi_printing_and_learning: "Печать и обучение" #NT!
 nd_swi_printing_and_learning_desc: "Становление Базеля как центра полиграфии и гуманистической науки, дома Эразма и великих издательств." #NT!
 nd_swi_civic_governance: "Гражданское управление" #NT!
 nd_swi_civic_governance_desc: "Швейцарская традиция муниципального самоуправления через выборные городские советы, закладывающая основы демократического республиканизма." #NT!
 nd_swi_reformation_crossroads: "Перекресток Реформации" #NT!
 nd_swi_reformation_crossroads_desc: "Швейцарский опыт Реформации, когда Цвингли и Кальвин изменили христианство из Цюриха и Женевы, в то время как католические кантоны устояли." #NT!
 nd_swi_cantonal_sovereignty: "Кантональный суверенитет" #NT!
 nd_swi_cantonal_sovereignty_desc: "Принцип, согласно которому каждый кантон сохраняет суверенитет над своими внутренними делами, создавая уникальную децентрализованную форму управления." #NT!
 nd_swi_watchmaking_tradition: "Часовые традиции" #NT!
 nd_swi_watchmaking_tradition_desc: "Создание швейцарского часового производства, привезенного беженцами-гугенотами в Женеву и распространившегося по горам Юра." #NT!
 nd_swi_arsenal_system: "Система Арсенал" #NT!
 nd_swi_arsenal_system_desc: "Кантональная система арсеналов поддерживает запасы оружия и техники, поэтому каждый гражданин может быть вооружен в течение нескольких часов после вызова на службу." #NT!
 nd_swi_swiss_musketeer_corps: "Швейцарские мушкетеры" #NT!
 nd_swi_swiss_musketeer_corps_desc: "Швейцарские солдаты берут на вооружение пороховое оружие, сохраняя при этом традиционную дисциплину и опыт ведения боевых действий в горах." #NT!
 nd_swi_civic_humanism: "Швейцарский гражданский гуманизм" #NT!
 nd_swi_civic_humanism_desc: "Интеллектуальная традиция, сочетающая классические республиканские идеалы со швейцарским общинным управлением, процветает в Базеле и Цюрихе." #NT!
 nd_swi_cantonal_militia_system: "Кантональная система милиции" #NT!
 nd_swi_cantonal_militia_system_desc: "Модернизированная система милиции, предписанная федеральным договором, требует от каждого кантона иметь постоянный контингент обученных солдат." #NT!
 nd_swi_helvetic_banking: "Гельветик Банкинг" #NT!
 nd_swi_helvetic_banking_desc: "Развитие швейцарского банковского дела от истоков Женевской ярмарки до сложных финансовых институтов, обслуживающих всю Европу." #NT!
 nd_swi_armed_neutrality_doctrine: "Доктрина вооруженного нейтралитета" #NT!
 nd_swi_armed_neutrality_doctrine_desc: "Формализация вооруженного нейтралитета как швейцарской государственной доктрины, мира через силу, защищаемого каждым гражданином." #NT!
 nd_swi_anti_absolutism: "Антиабсолютизм" #NT!
 nd_swi_anti_absolutism_desc: "Принципиальный отказ Швейцарии от абсолютистской монархии, сохранение республиканских традиций, в то время как европейские короли концентрируют власть." #NT!
 nd_swi_cheese_dairy_trade: "Торговля сыром и молочными продуктами" #NT!
 nd_swi_cheese_dairy_trade_desc: "Развитие швейцарского альпийского молочного животноводства и производства сыра в крупную экспортную отрасль, особенно в Эмментале и Грюйере." #NT!
 nd_swi_shooting_tradition: "Стрельба Традиция" #NT!
 nd_swi_shooting_tradition_desc: "Швейцарская традиция общественных фестивалей стрельбы и соревнований по стрельбе, обеспечивающая поддержание военной готовности каждого гражданина." #NT!
 nd_swi_federal_constitution: "Федеральная конституция" #NT!
 nd_swi_federal_constitution_desc: "Принятие современной федеральной конституции, устанавливающей постоянное центральное правительство при сохранении кантональной автономии." #NT!
 nd_swi_precision_manufacturing: "Точное производство" #NT!
 nd_swi_precision_manufacturing_desc: "Расширение швейцарского точного мастерства от часового производства до более широкого промышленного производства и машиностроения." #NT!
 nd_swi_swiss_sharpshooters: "Швейцарские снайперы" #NT!
 nd_swi_swiss_sharpshooters_desc: "Элитные стрелки, сочетающие швейцарские традиции стрельбы с современным нарезным огнестрельным оружием, преуспевающие в ведении боевых действий в горах." #NT!
 nd_swi_financial_center: "Финансовый центр" #NT!
 nd_swi_financial_center_desc: "Превращение Швейцарии в выдающийся финансовый центр Европы, основанное на банковской конфиденциальности, политической стабильности и верховенстве закона." #NT!
 nd_swi_popular_education: "Популярное образование" #NT!
 nd_swi_popular_education_desc: "Приверженность Швейцарии всеобщему государственному образованию, вдохновленная образовательной философией Песталоцци, привела к появлению одного из самых грамотных слоев населения Европы." #NT!
 nd_swi_professional_diplomacy: "Профессиональная дипломатия" #NT!
 nd_swi_professional_diplomacy_desc: "Швейцарский опыт нейтральных посредников и дипломатов, основанный на многовековом балансировании между могущественными соседями." #NT!
 a_nd_swi_halberdiers: "Швейцарские алебардисты" #NT!
 a_nd_swi_halberdiers_desc: "Горные воины, владеющие алебардой, комбинированным оружием, состоящим из топора, крюка и шипа, которое могло сдернуть рыцарей с коня и взломать доспехи. Их мастерство в пересеченной местности не имеет себе равных." #NT!
 a_nd_swi_crossbowmen: "Швейцарские арбалетчики" #NT!
 a_nd_swi_crossbowmen_desc: "Альпийские стрелки обрушивают на врагов стрелы с горных позиций, смягчая строй перед атакой алебардистов." #NT!
 a_nd_swi_pike_square: "Швейцарская площадь Пайк" #NT!
 a_nd_swi_pike_square_desc: "Гевиртауфены в миниатюре: дисциплинированный отряд копейщиков, обученных держать строй как под кавалерийской атакой, так и под артиллерийским огнем. Их стена из стальных наконечников практически непроницаема." #NT!
 a_nd_swi_musketeer: "Швейцарский мушкетер" #NT!
 a_nd_swi_musketeer_desc: "Швейцарская пехота, приспособившаяся к пороховой войне, сохранившая при этом легендарную дисциплину и традиции горного боя." #NT!
 a_nd_swi_cantonal_militia: "Кантональная милиция" #NT!
 a_nd_swi_cantonal_militia_desc: "Граждане-солдаты модернизированной швейцарской милиции, сочетающие мушкетную подготовку с традиционным швейцарским боевым духом. Каждый мужчина — солдат, каждый кантон — крепость." #NT!
 a_nd_swi_sharpshooter: "Швейцарский снайпер" #NT!
 a_nd_swi_sharpshooter_desc: "Элитные стрелки швейцарской стрелковой традиции, сочетающие точность изготовления и опыт ведения боевых действий в горах. Их точность на расстоянии просто разрушительна." #NT!
 nd_swi_letzi_wall: "Летци Стена" #NT!
 nd_swi_letzi_wall_desc: "Барьерная стена, возведенная через альпийскую долину или подход к озеру и предназначенная для направления захватчиков на подготовленные оборонительные позиции. Летци первоначальных Лесных кантонов могли простираться на многие мили." #NT!
 nd_swi_tagsatzung_hall: "ТегиЗал Сацунг" #NT!
 nd_swi_tagsatzung_hall_desc: "Зал, где кантональные делегаты собираются для обсуждения и принятия решений по федеральной политике путем консенсуса. Tagsatzung воплощает швейцарский принцип, согласно которому власть исходит от народа вверх." #NT!
 nd_swi_counting_house: "Женевская счетная палата" #NT!
 nd_swi_counting_house_desc: "Финансовое учреждение, управляющее депозитами, предоставляющее кредиты и облегчающее сложную торговую сеть, протекающую через альпийские перевалы Швейцарии." #NT!
 nd_swi_textile_manufactory: "Швейцарская текстильная мануфактура" #NT!
 nd_swi_textile_manufactory_desc: "Мастерская по производству тонкого полотна и шерсти, сделавшая Санкт-Галлен, Цюрих и Базель центрами европейской текстильной торговли." #NT!
 nd_swi_horological_workshop: "Часовая мастерская" #NT!
 nd_swi_horological_workshop_desc: "Ателье, где мастера-часовщики создают сложные часы беспрецедентной точности — высшее выражение швейцарского мастерства." #NT!
 nd_swi_arsenal: "Швейцарский Арсенал" #NT!
 nd_swi_arsenal_desc: "Кантональный склад оружия и склад оружия, боеприпасов и оборудования, необходимых для мобилизации ополчения в любой момент." #NT!
 nd_swi_alpine_hospice: "Альпийский хоспис" #NT!
 nd_swi_alpine_hospice_desc: "Приют, поддерживаемый религиозными орденами вдоль великих альпийских перевалов и предлагающий помощь путешественникам и паломникам, пересекающим горы." #NT!
 nd_swi_rathaus: "Швейцарская ратуша" #NT!
 nd_swi_rathaus_desc: "Ратуша, в которой избранные советы управляют муниципальными делами, физическое воплощение швейцарского республиканского самоуправления." #NT!
 nd_swi_schiessstand: "Шистштанд" #NT!
 nd_swi_schiessstand_desc: "Общественный тир, где граждане тренируются в стрельбе и поддерживают военную готовность, что является обязанностью каждого швейцарца." #NT!
 nd_swi_dairy_cooperative: "Молочный кооператив" #NT!
 nd_swi_dairy_cooperative_desc: "Альпийский завод по переработке молочных продуктов, где пастухи объединяют свое молоко для производства сыров, которые прославили швейцарские молочные продукты во всей Европе." #NT!
 nd_swi_diplomatic_residence: "Дипломатическая резиденция" #NT!
 nd_swi_diplomatic_residence_desc: "Нейтральная площадка, где встречаются иностранные посланники и разворачиваются переговоры, используя репутацию Швейцарии как беспристрастной и осмотрительной страны." #NT!
 nd_swi_letzi_garrison: "Летци Гаррисон" #NT!
 nd_swi_letzi_garrison_desc: "Вооруженные стражи, патрулирующие стены Летци, поддерживающие укрепления и готовые защищать перевалы." #NT!
 nd_swi_tagsatzung_upkeep: "Администрация Ассамблеи" #NT!
 nd_swi_tagsatzung_upkeep_desc: "Клерки, писцы и посыльные, которые ведут учет и переписку кантонального собрания." #NT!
 nd_swi_counting_house_operations: "Банковские операции" #NT!
 nd_swi_counting_house_operations_desc: "Сложные финансовые операции счетной палаты, ведение счетов, открытие аккредитивов и обработка иностранной валюты." #NT!
 nd_swi_textile_processing: "Текстильная обработка" #NT!
 nd_swi_textile_processing_desc: "Переплетение шерстяных и льняных волокон в готовую ткань по швейцарской системе гильдий, следуя традициям торговцев текстилем из Санкт-Галлена и Базеля." #NT!
 nd_swi_watchmaking_craft: "Часовое ремесло" #NT!
 nd_swi_watchmaking_craft_desc: "Изготовление сложных часовых механизмов из серебра и меди, производство изысканных часов, которые ценятся во всей Европе." #NT!
 nd_swi_arsenal_maintenance: "Техническое обслуживание Арсенала" #NT!
 nd_swi_arsenal_maintenance_desc: "Содержание кантонального арсенала, чистка, ремонт и хранение оружия и снаряжения для гражданской милиции." #NT!
 nd_swi_hospice_care: "Хосписная помощь" #NT!
 nd_swi_hospice_care_desc: "Продовольствие, необходимое для содержания альпийского хосписа, еды, топлива и припасов для путешественников, пересекающих горные перевалы." #NT!
 nd_swi_rathaus_administration: "Администрация Ратуши" #NT!
 nd_swi_rathaus_administration_desc: "Гражданская администрация, ведущая повседневную деятельность муниципального управления из Ратуши." #NT!
 nd_swi_schiessstand_supply: "Поставка стрельбища" #NT!
 nd_swi_schiessstand_supply_desc: "Боеприпасы и оборудование для общественного стрельбища, где граждане тренируют свою стрельбу." #NT!
 nd_swi_cheese_production: "Производство сыра" #NT!
 nd_swi_cheese_production_desc: "Переработка альпийского молока в твердые сыры, которые могут выдержать длительные перевозки на рынок по Европе." #NT!
 nd_swi_diplomatic_expenses: "Дипломатические расходы" #NT!
 nd_swi_diplomatic_expenses_desc: "Затраты на поддержание нейтральной территории для международной дипломатии, переписки, гостеприимства и конфиденциальности." #NT!
 levy_nd_swi_halberdier: "Швейцарский алебардист Леви" #NT!
 levy_nd_swi_halberdier_desc: "Горские крестьяне призвали к оружию своими алебардами, продолжая традицию, разгромившую армии Габсбургов при Моргартене и Земпахе." #NT!
 levy_nd_swi_cantonal_militia: "Кантональный сбор ополчения" #NT!
 levy_nd_swi_cantonal_militia_desc: "Граждане-солдаты, воспитанные в системе кантональной милиции, где каждый трудоспособный мужчина обучен и экипирован для защиты Конфедерации." #NT!
 nd_swi_formed_tt: "была образована Швейцария." #NT!
 nd_swi_path_a_tt: "Выбрали вооруженный нейтралитет" #NT!
 nd_swi_path_b_tt: "Выбрали традицию Reisläufer" #NT!
 nd_swi_destiny: "Швейцарская судьба" #NT!
 nd_swi_destiny_desc: "Конфедерация сформирована. Теперь выберите путь, который определит его наследие: крепость свободы и финансов или империя, построенная лучшими солдатами мира." #NT!
 nd_swi_dest_alpine_bank: "Альпийский банковский фонд" #NT!
 nd_swi_dest_alpine_bank_desc: "Укрепите контроль над швейцарскими кантонами и создайте финансовые учреждения, которые сделают Конфедерацию самым надежным банкиром в Европе. Требуются банковские учреждения, 1000 золотых и сильное развитие по всему альпийскому ядру." #NT!
 nd_swi_dest_banking_capital: "Банковская столица Европы" #NT!
 nd_swi_dest_banking_capital_desc: "Превратите Швейцарию в финансовое сердце Европы. Счетные палаты Женевы, Базеля и Цюриха должны стать незаменимыми для каждого принца и купца на континенте. Требуется печатный станок, 2000 золота, высокий престиж и обширное развитие." #NT!
 nd_swi_dest_perpetual_republic: "Вечная Республика" #NT!
 nd_swi_dest_perpetual_republic_desc: "Достигните высшего выражения швейцарского управления: республики, настолько стабильной, настолько процветающей и настолько развитой с научной точки зрения, что она выживет даже после падения империй. Требуется научная революция, 3000 золота и высочайший престиж." #NT!
 nd_swi_dest_ticino_gateway: "Ворота в Италию" #NT!
 nd_swi_dest_ticino_gateway_desc: "Пересеките Альпы и захватите ворота Италии. Беллинцона и Комо контролируют перевалы на Ломбардской равнине, что является первым шагом к Швейцарской империи к югу от гор. Требуются оба города, армия в 30 000 человек и 1 000 золота." #NT!
 nd_swi_dest_lombard_conquest: "Ломбардское завоевание" #NT!
 nd_swi_dest_lombard_conquest_desc: "Доминируйте на самой богатой равнине Европы. Милан и Брешиа (мастерские Италии) должны склониться перед швейцарским оружием. Требуются оба города, 50-тысячная армия, высокий престиж и 2000 золота." #NT!
 nd_swi_dest_helvetic_empire: "Великая Гельветическая империя" #NT!
 nd_swi_dest_helvetic_empire_desc: "Создайте империю, простирающуюся от Рейна до реки По. Страсбург, Верона и Турин должны нести белый крест. Требуются все три города, 75-тысячная армия, высочайший престиж и 3000 золота." #NT!
 nd_swi.6.t: "Судьба Eidgenossenschaft" #NT!
 nd_swi.6.d: "Конфедерация сформирована, но ее истинный характер еще предстоит определить. Кантональные делегаты принесли присягу, и белый крест реет над альпийскими перевалами. Теперь начинается настоящая работа: формирование нации из свободных сообществ, которые должны решить, смотреть ли внутрь или наружу, строить ли стены или идти за их пределы." #NT!
 nd_swi.6.a: "Клятва связывает нас. Теперь давайте опираться на это" #NT!
 nd_swi.7.t: "Основы швейцарских финансов" #NT!
 nd_swi.7.d: "Альпийские кантоны внедрили современную банковскую практику, и количество счетных домов увеличилось. Если когда-то швейцарцы были известны только своим оружием, то теперь они завоевывают репутацию человека, обладающего не менее могущественной силой: осмотрительного обращения с чужими деньгами. Женевские ярмарки привлекают торговцев и финансистов со всей Европы, а швейцарский франк становится валютой доверия.\n\nФундамент заложен. То, что когда-то было группой горных крестьян, защищающих свои долины, становится развитым финансовым государством." #NT!
 nd_swi.7.a: "Доверие — наша валюта, и мы никогда не обесценим ее." #NT!
 nd_swi.8.t: "Банкиры Европы" #NT!
 nd_swi.8.d: "Швейцария добилась того, чего не ожидала ни одна горная страна: она стала банковской столицей Европы. Счётные палаты Женевы управляют богатством королей. Финансисты Базеля гарантируют торговлю между странами. О свободе действий Цюриха ходят легенды.\n\nЭто процветание ставит перед выбором: инвестировать в мирное развитие и стабильное управление или использовать эту финансовую мощь для распространения престижа Швейцарии на всем континенте." #NT!
 nd_swi.8.a: "Инвестируйте в наши кантоны: процветание – само по себе награда" #NT!
 nd_swi.8.b: "Пусть мир узнает, что нейтралитет Швейцарии имеет свою цену" #NT!
 nd_swi.9.t: "Вечная Республика" #NT!
 nd_swi.9.d: "Чего не смогли достичь древние римляне (существующая республика), швейцарцы достигли. В то время как вокруг них возникают и рушатся империи, Конфедерация остается: процветающей, нейтральной и свободной. Швейцарская модель управления, в которой власть течет от народа вверх через кантональные собрания, стала источником вдохновения для политических мыслителей по всей Европе.\n\nЭта вершина требует окончательного выбора: принять конституционный либерализм как маяк для мира или консолидировать финансовую власть в качестве тихих архитекторов европейского процветания." #NT!
 nd_swi.9.a: "Пусть наша конституция будет светом для всех народов" #NT!
 nd_swi.9.b: "Золото говорит громче, чем конституции" #NT!
 nd_swi.10.t: "Водопад Тичино" #NT!
 nd_swi.10.d: "Колонны швейцарских щук пересекли Альпы и захватили ворота в Италию. Три замка Беллинцоны (Кастельгранде, Монтебелло и Сассо Корбаро) теперь украшены белым крестом. Комо, жемчужина лангобардских озер, перешла под контроль Конфедерации.\n\nИтальянские принцы обратили на это внимание. Швейцарцы больше не довольствуются защитой своих гор. Они идут на юг, и их пики столь же остры, как и их амбиции." #NT!
 nd_swi.10.a: "Перед нами открыта Италия: пики укажут путь" #NT!
 nd_swi.11.t: "Мастера Ломбардии" #NT!
 nd_swi.11.d: "Милан пал. Самый богатый город северной Италии (его мастерские, оружейные склады и величественный собор) теперь подчиняется власти Швейцарии. Известная оружейная промышленность Брешии поставляет то самое оружие, которое ее завоевало. Швейцарская Конфедерация добилась того, чего Священная Римская империя не могла сохранить на протяжении столетий: твердого контроля над Ломбардской равниной.\n\nТеперь вопрос в том, как сохранить эту империю. Подготовить элитный корпус профессиональных райслауферов или мобилизовать всю рабочую силу каждого кантона?" #NT!
 nd_swi.11.a: "Качество важнее количества: куйте лучших солдат Европы" #NT!
 nd_swi.11.b: "Каждый швейцарец – солдат: мобилизуйте их всех" #NT!
 nd_swi.12.t: "Великая Гельветическая империя" #NT!
 nd_swi.12.d: "От Страсбурга на Рейне до Вероны на Адидже, от Турина у подножия западных Альп до древних кантонов Эйдгеноссен: белый крест управляет империей, в существование которой никто не верил. Швейцарские копейщики, которые когда-то сражались только для защиты своих долин, теперь составляют гарнизоны в великих городах Европы.\n\nЭто Швейцария, с которой Мариньяно никогда не случалось, или, скорее, Швейцария, которая победила при Мариньяно и продолжала маршировать. Последний вопрос: править посредством шока и дисциплины или посредством славы, которая привлекает воинов под ваше знамя?" #NT!
 nd_swi.12.a: "Дисциплина и скорость решают сражения" #NT!
 nd_swi.12.b: "Пусть слава будет нашим рекрутером" #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_peaceful_prosperity: "Мирное процветание" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_peaceful_prosperity: "Швейцарский нейтралитет приносит величайшие дивиденды: непрерывное внутреннее развитие и довольные кантоны." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_prestigious_neutrality: "Престижный нейтралитет" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_prestigious_neutrality: "Нейтралитет Швейцарии вызывает уважение во всей Европе, хотя содержание постоянной армии обходится дороже без реальных войн, оправдывающих ее стоимость." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_liberal_constitution: "Либеральная конституция" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_liberal_constitution: "Швейцарская конституционная модель вдохновляет политических мыслителей по всей Европе, предоставляя Конфедерации дипломатическое влияние, выходящее далеко за пределы ее размеров." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_financial_hegemony: "Финансовая гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_financial_hegemony: "Швейцарские банковские дома стали тихими архитекторами европейского процветания, их финансовые сети охватывают весь континент." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_elite_reislaufer: "Элитный Рейслауфер" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_elite_reislaufer: "Швейцарцы вкладывают средства в качество, а не в количество, производя лучшую профессиональную пехоту в Европе, хотя отечественное строительство страдает от военной направленности." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_mass_mobilization: "Массовая мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_mass_mobilization: "Каждый кантон собирает свои силы в полную силу, и компании наемников стекаются под знамена Конфедерации, чтобы получить сниженные премии." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_shock_and_terror: "Шок и ужас" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_shock_and_terror: "Швейцарские армии наносят удары с разрушительной скоростью и быстро пополняются, хотя расходы на постоянные кампании приводят к росту цен внутри страны." #NT!
 STATIC_MODIFIER_NAME_nd_swi_dest_glory_seekers: "Искатели славы" #NT!
 STATIC_MODIFIER_DESC_nd_swi_dest_glory_seekers: "Легенда о швейцарском военном мастерстве привлекает воинов со всей Европы, стремящихся сражаться под знаменем белого креста." #NT!
 nd_swi_exchange_house: "Швейцарский биржевой дом" #NT!
 nd_swi_exchange_house_desc: "Ведущее финансовое учреждение, в котором богатством Европы управляют с легендарной швейцарской осмотрительностью: депозиты, аккредитивы и обмен валюты проводятся за закрытыми дверями." #NT!
 nd_swi_exchange_operations: "Обменные операции" #NT!
 nd_swi_exchange_operations_desc: "Сложные финансовые операции обменного дома: управление счетами, содействие международной торговле и ведение тщательной бухгалтерской отчетности, требуемой швейцарскими банками." #NT!
 nd_swi_reislaufer_barracks: "Райслауферские казармы" #NT!
 nd_swi_reislaufer_barracks_desc: "Профессиональный военный объект, где швейцарские солдаты обучаются искусству ведения боя с пиками, горному бою и дисциплинированным формированиям, которые сделали их ужасом на европейских полях сражений." #NT!
 nd_swi_barracks_upkeep: "Содержание казарм" #NT!
 nd_swi_barracks_upkeep_desc: "Содержание профессионального военного объекта: оружие, огнестрельное оружие, кожаное снаряжение и инструменты для обучения элитных солдат Швейцарии." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_swi_bureaucracy_authority: "Eidgenossische Verwaltung" #NT!
 AUTO_MODIFIER_DESC_nd_swi_bureaucracy_authority: "Конфедерация действует посредством уникально многоуровневого конфедеративного порядка: Tagsatzung как федеральный сейм, Bundesbriefe как самообязывающие пакты, Landsgemeinden как суверенные гражданские собрания, Pensionenwesen как финансово-военная экспортная отрасль, Gemeine Herrschaften как совместное доминион кантона и реформатская магистратура как гражданская дисциплина. Выбирайте, какие учреждения оставить в живых." #NT!
  
 swi_tagsatzung_bureaucracy: "Тегисацунг" #NT!
 swi_tagsatzung_bureaucracy_desc: "Федеральный сейм Старой Швейцарской Конфедерации. Каждый кантон отправлял двух делегатов, связанных мандатом своего местного совета, на заседания консенсуса, которые поочередно проходили между Баденом, Люцерном, Цюрихом и Фрауэнфельдом, которые никогда не были постоянной столицей. С XV века до 12 сентября 1848 года, когда собравшийся сейм принял первую Федеральную конституцию и превратился в современный двухпалатный парламент, Тагацунг был рабочим механизмом конфедеративного правительства: медленным, кантональным, структурно аллергичным на королевскую власть." #NT!
  
 swi_stanser_verkommnis_bureaucracy: "Стансер Веркомнис" #NT!
 swi_stanser_verkommnis_bureaucracy_desc: "Штансский договор, заключенный 22 декабря 1481 года после посредничества отшельника Никлауса фон Флюе в последнюю минуту, спас Конфедерацию от гражданской войны между сельскими и городскими кантонами из-за трофеев Бургундских войн. Он подтвердил Пфаффенбриф 1370 г. и Земпахербриф 1393 г., запретил несанкционированные собрания, регулировал пропорциональное разделение завоеванных земель и обязал кантоны оказывать взаимопомощь против внутренних смут. Институциональная основа самообязывающих пактов (Bundesbriefe), превратившая оборонительную лигу трех стран в последовательное государство из тринадцати кантонов." #NT!
  
 swi_landsgemeinde_bureaucracy: "Ландсгемейнде" #NT!
 swi_landsgemeinde_bureaucracy_desc: "Суверенное собрание вооруженных граждан под открытым небом, постоянно используемое в Ури, Швице, Унтервальдене, Гларусе, Цуге и Аппенцелле с 13-го и 14-го веков. Избиратели ежегодно собирались на Ландсгемейндеплац, чтобы избрать Ландаммана и судей, ратифицировать бюджет и принять законы поднятием поднятых рук. Гларус проводит свои собрания без перерыва с 1387 года, а Аппенцелль-Иннерроден - с 1403 года. Самая прямая форма самоуправления в Европе раннего Нового времени и постоянный структурный упрек дворянской юрисдикции." #NT!
  
 swi_pensionenwesen_bureaucracy: "Пансионенвезен" #NT!
 swi_pensionenwesen_bureaucracy_desc: "Пенсионная система дипломатической службы, которая превратила швейцарскую военную доблесть в доход кантона. После Фрибургского договора 1516 года кантоны узаконили договоры о капитуляции с иностранными коронами: Франция, Папство, Испания, Савойя, Голландская республика и другие выплачивали фиксированные пенсии кантональным казначействам в обмен на право набирать швейцарские полки на швейцарской земле. К 1740 году только у французов служило более 12 000 швейцарцев. Пенсии поддерживали низкие внутренние налоги, ставили кантональную элиту в зависимость от иностранных принцев и вызывали осуждение со стороны духовенства, которое распространялось от Цвингли до реформаторов конца XVIII века, которые, наконец, отменили систему." #NT!
  
 swi_gemeine_herrschaften_bureaucracy: "Gemeine Herrschaften" #NT!
 swi_gemeine_herrschaften_bureaucracy_desc: "Общие бейливики: подчиненные территории, совместно завоеванные и совместно управляемые группами кантонов. Ааргау (1415 г.), Тургау (1460 г.), Рейнталь (1490 г.) и ультрагорные бейливики к югу от Альп (Беллинцона, Лугано, Локарно, Мендризио и остальная часть современного Тичино), взятые у Миланского герцогства во время итальянских войн. Каждым из них управлял Ландфогт, сменяемый каждые два года из одного из совладельческих кантонов. Система извлекала доходы от некантональных субъектов, не допуская их к гражданству, финансировала расходы конфедерации и вызывала резкое негодование со стороны населения бейливиков, пока французы не отменили ее в 1798 году." #NT!
  
 swi_sittenmandate_bureaucracy: "Цурхер Зиттенмандат" #NT!
 swi_sittenmandate_bureaucracy_desc: "Цюрихские моральные мандаты — свод гражданско-религиозного законодательства, принятый «Цюрихской крысой» начиная с реформы Цвингли и воспроизведенный в Женеве, Базеле, Берне и Шаффхаузене. Около 400 постановлений, изданных между 1520 и 1675 годами, регулировали ругань, азартные игры, одежду, посещение проповедей, крещение новорожденных, форму надгробий, часы работы таверн и поведение нищих. Мандаты, обеспечиваемые магистратурой, объединявшей городской совет и консисторию, создали наиболее дисциплинированное гражданское население в Европе и неразрывно связали реформатскую церковь с кантональным государством." #NT!
