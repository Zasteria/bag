l_russian:
 nd_mol_formed_tt: "была образована Молдавия." #NT!
 nd_mol_path_a_tt: "Молдавия идет по пути Щита христианского мира" #NT!
 nd_mol_path_b_tt: "Молдавия идет по пути Княжества Перекресток" #NT!
 STATIC_MODIFIER_NAME_nd_mol_shield_of_christendom: "Щит христианского мира" #NT!
 STATIC_MODIFIER_DESC_nd_mol_shield_of_christendom: "Молдавское княжество представляет собой православный бастион, его крепости и крестьянские армии охраняют восточные границы христианской Европы от всех, кто может им угрожать." #NT!
 STATIC_MODIFIER_NAME_nd_mol_crossroads_principality: "Княжество Перекресток" #NT!
 STATIC_MODIFIER_DESC_nd_mol_crossroads_principality: "Молдавия процветает на пересечении империй, превращая свое положение между Востоком и Западом в преимущество благодаря умелой дипломатии, культурному обмену и прибыльной транзитной торговле." #NT!
 nd_mol.1.t: "Княжество Молдавия" #NT!
 nd_mol.1.d: "Знамя зубров реет над нашим княжеством. Молдавия стоит на перепутье: в прямом и переносном смысле. На западе венгерская корона претендует на сюзеренитет. На востоке тень Османской империи с каждым годом становится длиннее. На севере Польша с интересом наблюдает за происходящим.\n\nНаш воевода должен выбрать, как выдержит Молдавию. Пойдем ли мы по пути Штефана Великого, строя крепости на каждом горном перевале и сплачивая свободное крестьянство в гражданскую армию? Или мы настроим империи друг против друга, используя свое положение как жизненно важного торгового коридора для обеспечения автономии посредством дипломатии и процветания?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mol.1.a: "Мы будем щитом, который никогда не сломается" #NT!
 nd_mol.1.b: "Мы будем процветать между великими державами" #NT!
 nd_mol.2.t: "Программа «Крепость»" #NT!
 nd_mol.2.d: "Под руководством воеводы Молдавия приступила к беспрецедентной программе фортификации. От Карпатских перевалов до Днестровских болот сеть каменных четов теперь охраняет каждый подход к центру страны. Великая крепость Сучава, резиденция княжества, была укреплена новыми стенами и бастионами. Четатя Нямц венчает горную вершину, господствующую над долиной Молдовы. Сорока охраняет восточную границу, а Хотин охраняет северную границу.\n\nЭто не просто военное строительство: это декларация, которую Молдавия намерена выдержать. Должны ли мы продолжать вкладывать ресурсы в эту оборону или перенаправить наше внимание на подготовку мобильных полевых сил, которые смогут нанести удар до того, как враг достигнет наших стен?" #NT!
 nd_mol.2.a: "Каменные стены и глубокие рвы будут охранять нашу землю" #NT!
 nd_mol.2.b: "Наша кавалерия будет нашей крепостью" #NT!
 nd_mol.3.t: "Раскрашенные монастыри" #NT!
 nd_mol.3.d: "Что-то необычное творится на холмах северной Молдавии. Монастыри, заказанные нашими князьями (Воронец, Молдовица, Юмор, Сучевица), украшаются не только внутри, но и на внешних стенах яркими фресками, изображающими Страшный суд, осаду Константинополя и жития святых. Эти картины, выполненные в ярких синих и красных тонах, которые, кажется, бросают вызов течению времени, превращают каждый монастырь в открытую Библию для верующих.\n\nРаскрашенные монастыри стали центрами обучения, их скриптории создают летописи и литургические тексты, их школы дают образование как сыновьям бояр, так и свободным крестьянам. Они служат доказательством того, что Молдавия — это не просто пограничная территория, а самостоятельная цивилизация." #NT!
 nd_mol.3.a: "Пусть наша вера будет нарисована на мире" #NT!
 nd_mol.4.t: "Доктрина дикой природы" #NT!
 nd_mol.4.d: "В январе 1475 года османская армия численностью около 120 000 человек под командованием Хадима Сулеймана-паши вторглась в Молдавию. Стефан Великий, командующий менее чем 40-тысячным войском, отступил перед наступающим войском, уничтожая по пути посевы и отравляя колодцы. Когда османы достигли узкой долины Васлуй, измученные, голодные и дезориентированные туманом, молдавская армия напала на них из окрестных лесов. Разгром был полным.\n\nБитва при Васлуе продемонстрировала, что маленькая нация может победить огромную империю, не сравнившись с ней по силе, а благодаря терпению, местности и готовности уничтожить собственную землю, а не сдать ее. Папа Сикст IV назвал Стефана «Verus Christianae Fidei Athleta»: истинным защитником христианской веры. Должны ли мы систематизировать эту доктрину оборонительного опустошения или усовершенствовать тактику засады, которая нанесла смертельный удар?" #NT!
 nd_mol.4.a: "Пусть сама земля будет нашим оружием" #NT!
 nd_mol.4.b: "Совершенствуйте искусство лесной засады" #NT!
 STATIC_MODIFIER_NAME_nd_mol_cetatea_program: "Программа Кетатея" #NT!
 STATIC_MODIFIER_DESC_nd_mol_cetatea_program: "Комплексная программа строительства крепостей, созданная по образцу двадцати четырех крепостей, построенных под руководством воеводы, каждая из которых расположена так, чтобы контролировать перевал, брод или перекресток." #NT!
 STATIC_MODIFIER_NAME_nd_mol_open_field_doctrine: "Доктрина открытого поля" #NT!
 STATIC_MODIFIER_DESC_nd_mol_open_field_doctrine: "Вместо того, чтобы укрываться за стенами, молдавская кавалерия прочесывает поле боя, нанося удары до того, как противник сможет применить осадное оборудование против наших крепостей." #NT!
 STATIC_MODIFIER_NAME_nd_mol_voronet_glory: "Слава Воронца" #NT!
 STATIC_MODIFIER_DESC_nd_mol_voronet_glory: "Расписные монастыри Молдавии стали шедеврами православного искусства, их внешние фрески вдохновляют паломников и ученых со всего христианского мира." #NT!
 STATIC_MODIFIER_NAME_nd_mol_vaslui_tactics: "Доктрина Васлуя" #NT!
 STATIC_MODIFIER_DESC_nd_mol_vaslui_tactics: "Стратегия выжженной земли, опустошившая армии вторжения в Васлуй: уничтожение посевов, отравление колодцев и превращение самой земли в оружие против захватчиков." #NT!
 STATIC_MODIFIER_NAME_nd_mol_guerrilla_mastery: "Мастерство лесной засады" #NT!
 STATIC_MODIFIER_DESC_nd_mol_guerrilla_mastery: "Искусство молдавской лесной засады: заманивать превосходящие силы в узкие долины и густые леса, прежде чем обрушиться на них со всех сторон." #NT!
 nd_mol_plaiesi_tradition: "Плайези Традиция" #NT!
 nd_mol_plaiesi_tradition_desc: "Плаези — это свободные горные крестьяне, которые охраняют Карпатские перевалы, устраивают засады захватчикам и сражаются с задержками в местности, которую они хорошо знают." #NT!
 nd_mol_boyar_privileges: "Боярские привилегии" #NT!
 nd_mol_boyar_privileges_desc: "Великие боярские семьи контролируют обширные земельные владения, обеспечивая княжество сельскохозяйственными богатствами и политическими советами на воеводском диване." #NT!
 nd_mol_apiculture: "Молдавское пчеловодство" #NT!
 nd_mol_apiculture_desc: "Леса Молдавии кишат пчелами, а пчелиный воск стал одним из самых ценных предметов экспорта княжества, торговля которым доходит до Константинополя и Венеции." #NT!
 nd_mol_orthodox_identity: "Православная идентичность" #NT!
 nd_mol_orthodox_identity_desc: "Православная вера неотделима от молдавской идентичности, а столпами национального сознания являются митрополичья кафедра и монашеские фонды." #NT!
 nd_mol_divan_assembly: "Диван в сборе" #NT!
 nd_mol_divan_assembly_desc: "Воеводский диван, состоящий из крупных бояр и церковных деятелей, консультирует князя по государственным вопросам, сочетая княжескую власть с благородным советом." #NT!
 nd_mol_razesi_mobilization: "Разезская мобилизация" #NT!
 nd_mol_razesi_mobilization_desc: "Разеси (свободные крестьяне-землевладельцы) составляют костяк милиции Молдавии. В отличие от крепостных, привязанных к дворянским поместьям, они борются за свою землю и свободу." #NT!
 nd_mol_calarasi_tactics: "Кэлэрашь Тактикс" #NT!
 nd_mol_calarasi_tactics_desc: "Легкая кавалерия Кэлэрашь использует тактику «нападай и беги» в татарском стиле, преследуя вражеские колонны, перерезая пути снабжения и заманивая большие силы в засады." #NT!
 nd_mol_fortress_builders: "Строители крепости" #NT!
 nd_mol_fortress_builders_desc: "Под руководством воеводы сеть каменных крепостей поднимается по всей Молдавии, от Сучавы и Нямца на западе до Сорок и Тигины на восточной границе." #NT!
 nd_mol_painted_churches: "Расписные Церкви" #NT!
 nd_mol_painted_churches_desc: "Монастыри северной Молдавии украшены яркими наружными фресками: шедеврами православного искусства, служащими для верующих Священными Писаниями под открытым небом." #NT!
 nd_mol_suceava_court: "Сучавский суд" #NT!
 nd_mol_suceava_court_desc: "Княжеский двор в Сучаве, столице Молдавии, служит одновременно центром управления и узлом торговых путей, соединяющих Центральную Европу с Черным морем." #NT!
 nd_mol_curteni_guard: "Куртени Гвардия" #NT!
 nd_mol_curteni_guard_desc: "Куртены — княжеская придворная конница: профессиональные воины, поддерживаемые воеводой как постоянная сила, независимая от боярских военных обязанностей." #NT!
 nd_mol_voivodeship_arms: "Герб воеводства" #NT!
 nd_mol_voivodeship_arms_desc: "Княжество создает собственные арсеналы, снижая зависимость от импортного оружия и снабжая растущую профессиональную армию оружием местного производства." #NT!
 nd_mol_scorched_earth: "Доктрина выжженной земли" #NT!
 nd_mol_scorched_earth_desc: "Оборонительная доктрина Молдавии превращает территорию княжества в оружие: отступающие силы уничтожают посевы, отравляют колодцы и валят деревья, чтобы замедлить захватчика." #NT!
 nd_mol_between_empires: "Между империями" #NT!
 nd_mol_between_empires_desc: "Оказавшись между османскими, венгерскими и польскими амбициями, Молдавия усовершенствовала искусство натравливать великие державы друг против друга, чтобы сохранить свою автономию." #NT!
 nd_mol_professional_army: "Профессиональная армия" #NT!
 nd_mol_professional_army_desc: "Лефегии — это наемные профессиональные солдаты, которые служат непосредственно воеводе, обеспечивая надежное ядро ​​армии княжества, независимое от феодальных обязательств." #NT!
 nd_mol_moldavian_viticulture: "Молдавское виноградарство" #NT!
 nd_mol_moldavian_viticulture_desc: "Горная страна Молдавия производит знаменитые вина, а боярские поместья выращивают виноградники, которые поставляют как внутренний рынок, так и экспортную торговлю.\n\n#italic Доступно в: $nd_mol_boyar_estate$#!" #NT!
 nd_mol_chronicle_tradition: "Летописная традиция" #NT!
 nd_mol_chronicle_tradition_desc: "Молдавские монашеские летописцы фиксируют историю княжества, сохраняя знания и укрепляя традиции церковной грамотности." #NT!
 nd_mol_tribute_diplomacy: "Дань дипломатии" #NT!
 nd_mol_tribute_diplomacy_desc: "Молдавия отдает дань уважения сохранению своей внутренней автономии: прагматичная договоренность, которая сохраняет институты княжества, одновременно признавая подавляющую власть." #NT!
 nd_mol_iasi_ascendant: "Яссы Асцендент" #NT!
 nd_mol_iasi_ascendant_desc: "Поскольку резиденция княжества перемещается из Сучавы в Яссы, новая столица становится центром образования и культуры на перекрестке востока и запада.\n\n#italic Доступно в: $nd_mol_beeswax_house$#!" #NT!
 nd_mol_boyar_constitutionalism: "Боярский конституционализм" #NT!
 nd_mol_boyar_constitutionalism_desc: "Великие бояре утверждают конституционные ограничения княжеской власти, создавая прецеденты совместного управления, которые сдерживают произвол." #NT!
 nd_mol_printing_houses: "Типографии" #NT!
 nd_mol_printing_houses_desc: "Православные типографии в Молдавии печатают богослужебные тексты, своды законов и летописи на народном языке, распространяя грамотность за пределы монастырей." #NT!
 nd_mol_enduring_resistance: "Устойчивое сопротивление" #NT!
 nd_mol_enduring_resistance_desc: "Несмотря на столетия иностранного господства, молдавские военные традиции сохраняются: свободное крестьянство по-прежнему берется за оружие, когда его призывают, сражаясь с отчаянием тех, кто защищает свою землю." #NT!
 nd_mol_phanariot_reforms: "Реформы фанариотов" #NT!
 nd_mol_phanariot_reforms_desc: "Князья-фанариоты, хотя и назначенные Константинополем, проводят административные и правовые реформы, вдохновленные Просвещением, которые модернизируют молдавское управление." #NT!
 nd_mol_emancipation: "Эмансипация" #NT!
 nd_mol_emancipation_desc: "Отмена крепостного права трансформирует молдавское общество, освобождая сельское население для реализации возможностей за пределами боярских поместий." #NT!
 nd_mol_national_awakening: "Национальное пробуждение" #NT!
 nd_mol_national_awakening_desc: "Растущее осознание молдавской и румынской национальной идентичности распространяется по княжеству, подпитываемое литературными движениями и историческими исследованиями." #NT!
 nd_mol_modern_army: "Современная армия" #NT!
 nd_mol_modern_army_desc: "Молдавские вооруженные силы перенимают современную европейскую организацию, обучение и оборудование, превращаясь из феодальных наборов в профессиональную национальную армию." #NT!
 a_nd_mol_plaiesi: "Плаези" #NT!
 a_nd_mol_plaiesi_desc: "Горные пограничники, набранные из свободного крестьянства Карпатских перевалов. Плайези знают каждую тропу и ущелье, сражаясь как застрельщики, которые устраивают засады на захватчиков и тают обратно в леса." #NT!
 a_nd_mol_razesi: "Разезское ополчение" #NT!
 a_nd_mol_razesi_desc: "Свободные землевладельцы мобилизовались на защиту Молдавии. В отличие от крепостных, разеси сражаются за свою землю, что делает их упорными и решительными защитниками." #NT!
 a_nd_mol_calarasi: "Кэлэрашь" #NT!
 a_nd_mol_calarasi_desc: "Молдавская легкая кавалерия, использующая тактику «нападай и беги» в татарском стиле. Калараси преследуют вражеские колонны, совершают набеги на линии снабжения и заманивают превосходящие силы в засады." #NT!
 a_nd_mol_curteni: "Куртени Гвардия" #NT!
 a_nd_mol_curteni_desc: "Придворная конница молдавского воеводы: профессиональные всадники, сохранявшиеся как постоянная сила, независимая от боярских феодальных повинностей. Они составляют ударное оружие армии княжества." #NT!
 a_nd_mol_lefegii: "Лефегии" #NT!
 a_nd_mol_lefegii_desc: "Наемная профессиональная пехота на службе у воеводы. Лефеги составляют дисциплинированное ядро ​​молдавской армии, обученное ведению боевых действий в тесном строю." #NT!
 levy_nd_mol_plaiesi: "Пограничная служба Плайези" #NT!
 levy_nd_mol_plaiesi_desc: "Горные пограничники, набранные из свободного крестьянства, защищали Карпатские перевалы." #NT!
 levy_nd_mol_razesi: "Разезское ополчение" #NT!
 levy_nd_mol_razesi_desc: "Свободные землевладельцы мобилизовались как решительные ополченцы-защитники молдавской земли." #NT!
 levy_nd_mol_calarasi: "Калараш Райдерс" #NT!
 levy_nd_mol_calarasi_desc: "Легкая кавалерия набирается из мелкой знати и солдат, используя тактику набегов в татарском стиле." #NT!
 nd_mol_cetate: "Цетат" #NT!
 nd_mol_cetate_desc: "Молдавская горная крепость, построенная для контроля над перевалом, бродом или перекрестком. Эти каменные крепости образуют защитную сеть по всему княжеству." #NT!
 nd_mol_painted_monastery: "Расписной монастырь" #NT!
 nd_mol_painted_monastery_desc: "Молдавский монастырь, украшенный яркими фресками снаружи, служит центром православного образования, искусства и духовной жизни." #NT!
 nd_mol_boyar_estate: "Боярская усадьба" #NT!
 nd_mol_boyar_estate_desc: "Помещичье имение молдавского боярина, производившее сельскохозяйственные богатства за счет виноградников, животноводства и лесного хозяйства." #NT!
 nd_mol_armory: "Молдавский Оружейный склад" #NT!
 nd_mol_armory_desc: "Мастерская по производству оружия и снаряжения для растущих вооруженных сил княжества." #NT!
 nd_mol_beeswax_house: "Цех по переработке пчелиного воска" #NT!
 nd_mol_beeswax_house_desc: "Завод по переработке молдавского пчелиного воска в товарные товары, основанный на богатом лесном пчеловодстве княжества." #NT!
 nd_mol_cetate_maintenance: "Крепостной гарнизон" #NT!
 nd_mol_cetate_maintenance_desc: "Камень, железо и древесина для поддержания стен и гарнизона молдавской горной крепости." #NT!
 nd_mol_monastery_maintenance: "Монашеское содержание" #NT!
 nd_mol_monastery_maintenance_desc: "Краски для фресковой живописи, пчелиный воск для богослужебных свечей и камень для ухода за монастырскими постройками." #NT!
 nd_mol_estate_vineyard: "Боярский Виноградник" #NT!
 nd_mol_estate_vineyard_desc: "Боярское имение выращивает виноградники на молдавских горах, производит вино для внутреннего потребления и на экспорт." #NT!
 nd_mol_estate_maintenance: "Содержание поместья" #NT!
 nd_mol_estate_maintenance_desc: "Скот, шерсть и лес для повседневной деятельности молдавского боярского поместья." #NT!
 nd_mol_arms_production: "Молдавское оружейное производство" #NT!
 nd_mol_arms_production_desc: "Местные кузнецы куют оружие из молдавского железа, снижая зависимость от импортного вооружения." #NT!
 nd_mol_armory_maintenance: "Содержание Оружейной" #NT!
 nd_mol_armory_maintenance_desc: "Железо, древесина и камень для содержания мастерской и печей." #NT!
 nd_mol_wax_processing: "Обработка воска и ткани" #NT!
 nd_mol_wax_processing_desc: "Молдавский пчелиный воск смешивается с местной шерстью для производства вощеной ткани для гидроизоляции и торговли." #NT!
 nd_mol_beeswax_maintenance: "Уход за домом из пчелиного воска" #NT!
 nd_mol_beeswax_maintenance_desc: "Пчелиный воск, древесина и керамика для содержания перерабатывающего цеха и его работы." #NT!
 nd_mol_printing_house: "Молдавская типография" #NT!
 nd_mol_printing_house_desc: "Православная типография, выпускающая богослужебные тексты, летописи и своды законов на молдавском языке." #NT!
 nd_mol_print_maintenance: "Расходные материалы для печати" #NT!
 nd_mol_print_maintenance_desc: "Бумага, красители для чернил и древесина впечатаны в литургические тексты, хроники и правовые кодексы на родном языке." #NT!
 nd_mol_dest_defender: "Защитник перевалов" #NT!
 nd_mol_dest_defender_desc: "Обезопасьте сердце Валахии, взяв Тырговиште и Брэилу, объединив румынские земли под военным руководством Молдавии. Требуется армия численностью не менее 30 000 человек." #NT!
 nd_mol_dest_bulwark: "Дунайский бастион" #NT!
 nd_mol_dest_bulwark_desc: "Расширить контроль Молдовы вдоль границы Дуная. Возьмите Констанцу в Добрудже и Драстар на болгарском берегу, построив цепь укреплений, которая сделает реку непреодолимой преградой." #NT!
 nd_mol_dest_champion: "Чемпион веры" #NT!
 nd_mol_dest_champion_desc: "Высшее выражение Щита христианского мира: водрузить знамя зубров над Константинополем и Варной, воплотив в жизнь крестовый поход, о котором Стефан Великий только мечтал." #NT!
 nd_mol_dest_gateway: "Врата между мирами" #NT!
 nd_mol_dest_gateway_desc: "Сделать Молдавию важным торговым коридором между Востоком и Западом, обеспечив безопасность Львова, крупного западного торгового центра, и накопив значительные казначейские резервы." #NT!
 nd_mol_dest_emporium: "Торговый центр Востока" #NT!
 nd_mol_dest_emporium_desc: "Превратить Молдавию в крупную экономическую державу. Обеспечьте поток вина через рынок капитала, используйте современные банковские методы и развивайте общее богатство княжества далеко за пределами его основного ядра." #NT!
 nd_mol_dest_dacia: "Дачия Реборн" #NT!
 nd_mol_dest_dacia_desc: "Объедините румынские земли посредством культуры и процветания, а не только путем завоеваний. Возьмите Бухарест, используйте печатный станок для распространения румынского национального самосознания и станьте маяком престижа и богатства." #NT!
 nd_mol_destiny: "Судьба Молдавии" #NT!
 nd_mol_destiny_desc: "Княжество было образовано. Теперь начинается его истинная судьба: будь то щит христианского мира или перекресток империй." #NT!
 nd_mol.5.t: "Судьба Молдавии" #NT!
 nd_mol.5.d: "Молдавия возрождается. Знамя зубра реет над единым княжеством, и на вопрос, который не давал покоя каждому воеводе со времен Богдана-Основателя, наконец-то можно ответить не надеждой, а действием. Какой станет Молдавия? Судьба княжества больше не находится в руках иностранных императоров и султанов. Это зависит только от нас." #NT!
 nd_mol.5.a: "Наша судьба - наша собственная ковка" #NT!
 nd_mol.6.t: "Защитник перевалов" #NT!
 nd_mol.6.d: "Карпатские перевалы взяты под контроль, и наши армии перешли в Валахию. Тырговиште, резиденция валашских воевод, развевает молдавское знамя. Браила, господствующая над нижним Дунаем, наша. Румынские земли начинают объединяться под щитом молдавского оружия.\n\nЭто то, что задумал Стефан Великий: не просто защищать наши границы, но и расширять их до тех пор, пока ни один захватчик не сможет угрожать нашему сердцу. Дорога на юг открыта. Дунай ждет." #NT!
 nd_mol.6.a: "Проходы наши. Теперь о реке." #NT!
 nd_mol.7.t: "Дунайский рубеж" #NT!
 nd_mol.7.d: "Молдавские укрепления теперь тянут Дунай от Добруджи до болгарского берега. Констанца открывает нам окно на Черное море, а Драстар командует переправой через реку, по которой тысячи лет проходили армии. Древние римские липы, заброшенные на протяжении веков, снова оживают под знаменем зубров.\n\nНаши генералы обсуждают следующий этап. Некоторые выступают за постоянное размещение на этих позициях гарнизонов, создавая нерушимую линию обороны. Другие выступают за агрессивный пограничный марш: использовать Дунай как плацдарм для дальнейшего расширения, а не как статический барьер." #NT!
 nd_mol.7.a: "Гарнизон на реке. Пусть никто не перейдет дорогу." #NT!
 nd_mol.7.b: "Граница — это трамплин, а не стена." #NT!
 nd_mol.8.t: "Чемпион веры" #NT!
 nd_mol.8.d: "Немыслимое было достигнуто. Константинополь, царица городов, резиденция императоров и патриархов, развевает знамя зубров. Варна, где когда-то погиб крестоносец, искуплена. Папа Сикст назвал Стефана «Verus Christianae Fidei Athleta»: истинным защитником христианской веры. Мы заслужили это звание сторицей.\n\nПревращение Молдавии из приграничного княжества в великую христианскую державу завершено. Но величие требует выбора. Будем ли мы использовать эту силу как православные крестоносцы, распространяя истинную веру на завоеванные нами земли? Или нам следует построить вечный оплот, неприступное государство-крепость, которое не сможет разрушить ни одна сила на земле?" #NT!
 nd_mol.8.a: "Мы меч православной веры" #NT!
 nd_mol.8.b: "Мы — стена, которая никогда не упадет" #NT!
 nd_mol.9.t: "Врата между мирами" #NT!
 nd_mol.9.d: "Львов вошел в коммерческую орбиту Молдавии, а вместе с ней и в торговые пути, соединяющие Балтику с Черным морем, Центральную Европу с Востоком. Молдавские купцы теперь обрабатывают товары, которые когда-то проходили через иностранные руки: фламандские ткани идут на восток, крымские меха идут на запад, специи из Леванта проходят через наши склады.\n\nКазначейство воеводы пополняется таможенными поступлениями. То, что империи не могли захватить силой, Молдавия получает благодаря хитрости своих купцов и преимуществу своего географического положения." #NT!
 nd_mol.9.a: "Пусть богатство народов течет через наши земли" #NT!
 nd_mol.10.t: "Торговый центр Востока" #NT!
 nd_mol.10.d: "Молдавское вино продается на рынках от Венеции до Константинополя. Банковские дома действуют в Яссах и Сучаве, предоставляя кредиты торговцам по всей Восточной Европе. Развитие княжества превзошло все ожидания: то, что когда-то было приграничной областью, теперь превратилось в процветающее торговое государство.\n\nНаши советники представляют два видения следующего этапа. Некоторые выступают за углубление нашей коммерческой инфраструктуры: больше рынков, больше складов, больше торговых соглашений. Другие утверждают, что наша истинная сила заключается в культурном обмене: мы становимся мостом между Латинским Западом и православным Востоком, привлекая к нашим дворам ученых, художников и дипломатов." #NT!
 nd_mol.10.a: "Коммерция – это сила государства" #NT!
 nd_mol.10.b: "Мы станем мостом между цивилизациями" #NT!
 nd_mol.11.t: "Дачия Реборн" #NT!
 nd_mol.11.d: "Мечта об объединенной Румынии, не только посредством крови и железа, но и посредством общего языка, культуры и процветания, обретает форму. Бухарест, жемчужина Валашской равнины, признает лидерство Молдовы. Типография распространяет румынские тексты от Карпат до Дуная. Ученые говорят о возрождении Дакии: древнем королевстве, восставшем из тысячелетнего пепла.\n\nМолдавия снова стоит на распутье, но на этот раз как сила, а не пешка. Сможем ли мы создать новую дакийскую идентичность, ассимилируя различные народы нашего королевства в единую нацию? Или нам следует следовать просветительскому видению: толерантному, космополитическому, черпающему силу из разнообразия, а не из единообразия?" #NT!
 nd_mol.11.a: "Один народ, один язык, одна судьба" #NT!
 nd_mol.11.b: "В разнообразии сила" #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_danube_garrison: "Дунайский гарнизон" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_danube_garrison: "Постоянные гарнизоны вдоль дунайской границы поддерживают порядок, быстро восстанавливаются после разрушений и создают традиции профессиональной военной службы." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_border_march: "Пограничный марш" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_border_march: "Агрессивная пограничная доктрина, использующая Дунай в качестве плацдарма для набегов и экспансии, хотя постоянные войны наносят ущерб местному производству." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_orthodox_champion: "Православный Чемпион" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_orthodox_champion: "Молдавия использует свою новообретенную мощь как меч православной веры, вызывая уважение на мирных переговорах, сохраняя при этом лояльность завоеванных народов посредством общей религии." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_eternal_bulwark: "Вечный оплот" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_eternal_bulwark: "Доктрина государства-крепости, которая снижает военные расходы и улучшает тактическую доктрину, хотя акцент на укреплениях отвлекает ресурсы от гражданского строительства." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_trade_emporium: "Торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_trade_emporium: "Коммерческая инфраструктура Молдавии расширяется, привлекая больше торговцев и снижая стоимость заимствований, хотя быстрый рост приводит к инфляционному давлению." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_cultural_bridge: "Культурный мост" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_cultural_bridge: "Молдавия становится дипломатическим центром между цивилизациями, расширяя свое влияние через отношения и вассальную лояльность, хотя ее пацифистская репутация делает оправдание войн более дорогостоящим." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_dacia_nova: "Дачия Нова" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_dacia_nova: "Новое дакийское государство объединяет свои народы посредством общей идентичности, удовлетворяя интересы всех сословий, одновременно ассимилируя различные группы населения и расширяя дипломатическое влияние." #NT!
 STATIC_MODIFIER_NAME_nd_mol_dest_moldavian_enlightenment: "Молдавское Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_mol_dest_moldavian_enlightenment: "Просветительское видение, которое объединяет различные народы посредством толерантности и уменьшает самоуспокоенность, хотя военные обязательства дворянства уменьшаются по мере того, как культурные занятия имеют приоритет." #NT!
 nd_mol_citadel: "Молдавская Цитадель" #NT!
 nd_mol_citadel_desc: "Величественная крепость, представляющая собой вершину молдавской оборонительной архитектуры: массивные каменные стены, глубокие рвы и постоянные гарнизонные помещения, делающие это место практически неприступным." #NT!
 nd_mol_citadel_maintenance: "Цитадель Гарнизон" #NT!
 nd_mol_citadel_maintenance_desc: "Камень, железо и древесина для поддержания мощной защиты цитадели и размещения ее постоянного гарнизона." #NT!
 nd_mol_academy: "Молдавская Академия" #NT!
 nd_mol_academy_desc: "Центр румынского образования и культуры, где собираются ученые, богословы и художники, чтобы изучать, преподавать и развивать интеллектуальную жизнь нации." #NT!
 nd_mol_academy_maintenance: "Содержание Академии" #NT!
 nd_mol_academy_maintenance_desc: "Бумага для рукописей, книги для библиотеки, ткань для жилищ ученых и церемониальных облачений." #NT!
  
 # ===== BUREAUCRACIES ===== 
 mol_sfatul_domnesc_bureaucracy: "Сфатул Домнеск" #NT!
 mol_sfatul_domnesc_bureaucracy_desc: "Княжеский совет великих бояр, который консультировал господаря и избирал новых князей из кандидатов царствующего дома. В состав совета входили Маре Ворник (главный судья), Маре Логофат (канцлер), Маре Вистье (казначей), Маре Спатар (меченосец и военачальник) и Маре Постельник, взятые из великих семей, чьи генеалогии связывают списки пятнадцатого века с правлением Стефана Великого в 1457-1504 годах. Связывая герцогские решения консультативным согласием, Сфатул закреплял конституционную жизнь Молдовы до фанариотской интерлюдии после 1711 года." #NT!
  
 mol_mitropolia_suceava_bureaucracy: "Митрополия Сучавы" #NT!
 mol_mitropolia_suceava_bureaucracy_desc: "Автономная молдавская православная кафедра, основанная в Сучаве в 1386 году и признанная в 1401 году Константинопольским Вселенским Патриархатом под руководством митрополита Иосифа, с тремя суфражистскими епископствами, охватывающими все княжество. Митрополия короновала господаря, поставляла в канцелярию грамотных дьяков из скрипторий монастырей Путна и Нямц, переводила патриаршие каноны для использования в молдавских судах. В 1677 году резиденция навсегда переехала из Сучавы в Яссы, но преемственность этого учреждения на протяжении трех столетий придала церкви конституционный вес, уступающий только Сфатулу Домнеску." #NT!
  
 mol_razesi_levy_bureaucracy: "Свободные деревни Разеси" #NT!
 mol_razesi_levy_bureaucracy_desc: "Свободное землевладельческое крестьянство Молдавии, организованное как сельские общины, возглавляемые княжеством и владеющие землей в совместной собственности по системе открытого поля. Стефан Великий получил от этих свободных землевладельцев oastea cea mica, набрав пехоту войничи и легкую кавалерию хансари непосредственно из свитков разеси в обмен на финансовые привилегии и права на пастбища. Вольные деревни уменьшили зависимость князя от боярских дружин и создали социальную базу, которая сделала молдавские армии непропорционально мобильными на протяжении XV и XVI веков." #NT!
  
 mol_pravila_lupu_bureaucracy: "Правила Василе Лупу" #NT!
 mol_pravila_lupu_bureaucracy_desc: "Carte romaneasca de invatatura, обнародованная в Яссах в 1646 году, стала первым печатным юридическим кодексом в Молдавии и первой официальной кодификацией гражданского права, составленной на румынском языке с использованием кириллицы. Составленный при Василе Лупу (1634-1653) логотетом Евстратием, «Правила» опирался на Leges Coloniariae Юстиниана II, Jus Graeco-Romanum Люнклавия (Франкфурт, 1596 г.) и Praxis et theoricae Crimelis Фариначчи (Венеция, 1610 г.), дополняя их молдавскими обычными нормами о земле, долге, и преступность. Выпущенный в типографии монастыря Трей Иерархи, кодекс обязывал господарские суды соблюдать письменную процедуру." #NT!
  
 mol_vornicii_tarii_bureaucracy: "Ворникии Тара де Сус и Тара де Жос" #NT!
 mol_vornicii_tarii_bureaucracy_desc: "Двойные провинциальные губернаторства, разделявшие средневековую Молдавию на Верхнюю страну с центром в Сучаве и Нижнюю страну, управляемые по оси Бырлад-Яссы. Каждый Маре Ворник осуществлял судебную апелляционную юрисдикцию над своей половиной княжества, руководил паркалаби крепостных округов и писцами паркалабий, собирал княжескую долю штрафов и конфискаций и возглавлял региональный сбор на войне. Разделение пережило реорганизацию фанариотов как остаточную финансово-юридическую структуру и дало великим боярским династиям каждой половины региональную базу власти за пределами столичного двора." #NT!
  
 mol_phanariot_administration_bureaucracy: "Администрация фанариотов" #NT!
 mol_phanariot_administration_bureaucracy_desc: "Аппарат управления после 1711 года был установлен, когда Порта начала назначать греческих господарей из Фанарского района Константинополя, начиная с Николая Маврокордата в Молдавии и продолжая до греческого восстания 1821 года. Воеводы-фанариоты копировали модели Петра и Габсбургов: они поставили дворянское звание в зависимость от государственной службы, упорядочили подушную оплату, а при Константине Маврокордатосе отменили законное крепостное право румын в Молдавии в 1749 году. Языком придворных дел стал греческий язык, Ясская княжеская академия была реорганизована в Домняску, а фискальный подход, требующий дани, сократил сроки пребывания в должности и задолжал администрации Константинопольские банкиры." #NT!
  
 # ===== BUREAUCRACY AUTHORITY ===== 
 AUTO_MODIFIER_NAME_nd_mol_bureaucracy_authority: "Бюрократическая власть Молдавии" #NT!
 AUTO_MODIFIER_DESC_nd_mol_bureaucracy_authority: "Провозглашение [MOL.GetName] устанавливает институциональный аппарат Карпатского княжества, унаследованный от Сучавы и Ясс: Сфатул Домнеск великих бояр, автономную Митрополию 1401 года, вольные деревни Разеши, набранные Штефаном Великим, печатную Правилу Василе Лупу, двойные ворники Верхней и Нижней страны и фанариотскую канцелярию греков. господары. Помимо столичного универсального места предоставляются еще два бюрократических места." #NT!
