l_russian:
 STATIC_MODIFIER_NAME_nd_adu_ornament_of_the_world: "Орнамент мира" #NT!
 STATIC_MODIFIER_DESC_nd_adu_ornament_of_the_world: "Аль-Андалус сияет как маяк обучения, где мусульманские, христианские и еврейские ученые свободно обмениваются знаниями, а библиотеки Кордовы могут соперничать с любыми библиотеками мира." #NT!
 STATIC_MODIFIER_NAME_nd_adu_sword_of_the_maghreb: "Меч Магриба" #NT!
 STATIC_MODIFIER_DESC_nd_adu_sword_of_the_maghreb: "Закаленные в огне джихада, воины Аль-Андалуса маршируют под знаменем очищенной веры, их берберская кавалерия и приграничные гази сеют страх по всему полуострову." #NT!
 nd_adu.1.t: "Восстановление Аль-Андалуса" #NT!
 nd_adu.1.d: "Знамя полумесяца снова развевается над всей Иберией. Там, где христианские королевства когда-то делили полуостров, из пепла тайфов восстало единое исламское государство. Память о Кордовском халифате, когда эта земля была самой образованной и процветающей во всей Европе, ярко горит в каждом учёном и солдате.\n\nНо Аль-Андалус стоит перед выбором, который определял его со времен Омейядов. Возродим ли мы традицию конвивенсии, где мечети стояли рядом с синагогами и церквями, где Ибн Рушд дискутировал с Аристотелем, а Маймонид нашел убежище под властью мусульман? Или мы последуем путем Альмохадов и Альморавидов, которые пересекли пролив с армиями дисциплинированной берберской кавалерии и построили империю посредством военного благочестия и религиозной ортодоксии?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_adu.1.a: "Пусть Кордова снова засияет как украшение мира." #NT!
 nd_adu.1.b: "Меч Магриба объединит верующих." #NT!
 STATIC_MODIFIER_NAME_nd_adu_house_of_wisdom_west: "Дом Мудрости Запада" #NT!
 STATIC_MODIFIER_DESC_nd_adu_house_of_wisdom_west: "Вдохновленные легендарным багдадским Байт аль-Хикма, ученые Аль-Андалуса создали свой собственный центр универсального обучения, где тексты переводятся, обсуждаются и сохраняются." #NT!
 nd_adu.2.t: "Цветение Конвивенсии" #NT!
 nd_adu.2.d: "В великих городах Аль-Андалуса укореняется нечто замечательное. Мусульманские ученые спорят с еврейскими философами в библиотеках Кордовы. Христианские писцы копируют арабские тексты по математике и астрономии. В медресе Юсуфа I в Гранаде преподают не только Коран и хадисы, но и медицину, геометрию и натурфилософию.\n\nЭто не просто толерантность. Это целенаправленное развитие цивилизации, черпающей силу из ее многообразия. Работы Аристотеля, сохраненные на арабском языке, когда Европа забыла их, теперь возвращаются в более широкий мир через андалузских переводчиков. Ученые со всего христианского мира приезжают сюда учиться, привлеченные репутацией страны, где знания выходят за рамки веры." #NT!
 nd_adu.2.a: "Пусть все, кто ищет знания, найдут их в наших залах." #NT!
 STATIC_MODIFIER_NAME_nd_adu_arabic_scholarship: "Арабская научная традиция" #NT!
 STATIC_MODIFIER_DESC_nd_adu_arabic_scholarship: "Аль-Андалус сохраняет и расширяет арабскую интеллектуальную традицию, создавая оригинальные произведения, которые стоят в одном ряду с величайшими достижениями Багдада и Каира." #NT!
 STATIC_MODIFIER_NAME_nd_adu_universal_knowledge: "Универсальный обмен знаниями" #NT!
 STATIC_MODIFIER_DESC_nd_adu_universal_knowledge: "Бюро переводов Аль-Андалуса служат мостом между цивилизациями, передавая мудрость древних всем, кто желает учиться." #NT!
 nd_adu.3.t: "Переводческое движение" #NT!
 nd_adu.3.d: "Бюро переводов Аль-Андалуса стали интеллектуальным перекрестком мира. В Толедо, Кордове и Севилье арабские тексты по медицине, астрономии, математике и философии переводятся на латынь, иврит и романские языки. Работы аз-Захрави по хирургии, аз-Заркали по астрономическим инструментам и Ибн Рушда по аристотелевской философии меняют интеллектуальный ландшафт далеко за пределами исламского мира.\n\nНо один вопрос разделяет наших ученых. Должны ли мы сохранять нашу интеллектуальную традицию в ее арабской чистоте, продолжая создавать оригинальные произведения, продвигающие человеческие знания? Или нам следует взять на себя роль универсального переводчика, сделав все знания доступными, несмотря на языковые и религиозные границы, даже ценой размывания нашей самобытной научной идентичности?" #NT!
 nd_adu.3.a: "Наша традиция говорит сама за себя: давайте опираться на нее." #NT!
 nd_adu.3.b: "Знания принадлежат всему человечеству." #NT!
 STATIC_MODIFIER_NAME_nd_adu_alhambra_splendor: "Великолепие Альгамбры" #NT!
 STATIC_MODIFIER_DESC_nd_adu_alhambra_splendor: "Дворцовый комплекс Альгамбры является свидетельством художественного гения исламской цивилизации, ее изящные мукарны и геометрические арабески, вдохновляющие на чудеса во всем мире." #NT!
 nd_adu.4.t: "Великолепие Альгамбры" #NT!
 nd_adu.4.d: "Высоко над городом Гранада, на фоне Сьерра-Невады, словно видение из рая, возвышается Альгамбра. Его стены из утрамбованной земли скрывают сады невероятной красоты: Двор Львов с двенадцатью мраморными зверями, охраняющими фонтан кристальной воды, Зал Послов, где потолки из мукарна символизируют семь небес, и Хенералифе, где террасные сады ниспадают вниз по склону холма в симфонии воды и камня.\n\nЭто не просто дворец. Это физическое воплощение идеала Андалузии, согласно которому искусство, архитектура и инженерия могут превратить сырую землю в нечто, от красоты которого болит сердце. Каждая поверхность покрыта геометрическими арабесками, каждый фонтан — это образец гидротехники, каждый сад — шедевр ирригационной науки. Альгамбра доказывает, что Аль-Андалус может творить чудеса, способные соперничать с любой цивилизацией на земле." #NT!
 nd_adu.4.a: "Пусть это великолепие вдохновляет наш народ на многие поколения." #NT!
 nd_adu_jinete_tradition: "Хинете Традиция" #NT!
 nd_adu_jinete_tradition_desc: "Конные воины Аль-Андалуса ездят в берберском стиле, легкие, быстрые и смертоносные, метая копья из седла на полном галопе." #NT!
 nd_adu_ribat_frontier: "Рибатская пограничная оборона" #NT!
 nd_adu_ribat_frontier_desc: "Рибаты охраняют границы верующих, сочетая крепостные стены с монашеской дисциплиной." #NT!
 nd_adu_acequia_irrigation: "Ирригация Асекии" #NT!
 nd_adu_acequia_irrigation_desc: "Системы каналов Асекия в Аль-Андалусе превращают засушливые земли в сады, применяя многовековые исламские знания в области гидравлики." #NT!
 nd_adu_islamic_jurisprudence: "Исламская юриспруденция" #NT!
 nd_adu_islamic_jurisprudence_desc: "Ученые-правоведы Аль-Андалуса развивают сложную традицию фикха, опираясь на школу Малики для создания упорядоченного управления." #NT!
 nd_adu_urban_civilization: "Городская цивилизация" #NT!
 nd_adu_urban_civilization_desc: "Города Аль-Андалуса устанавливают стандарты городской жизни с общественными банями, мощеными улицами и проточной водой." #NT!
 nd_adu_mosque_network: "Сеть мечетей" #NT!
 nd_adu_mosque_network_desc: "Сеть общинных мечетей поддерживает религиозную жизнь по всему Аль-Андалусу, от Великой мечети Кордовы до скромных деревенских молитвенных домов." #NT!
 nd_adu_zenata_warriors: "Зенатская конная гвардия" #NT!
 nd_adu_zenata_warriors_desc: "Элитная берберская кавалерия из племен Зената составляет ядро ​​андалузской тяжелой кавалерии, дисциплинированной и грозной в атаке." #NT!
 nd_adu_madrasa_tradition: "Традиция медресе" #NT!
 nd_adu_madrasa_tradition_desc: "Создание медресе, официальных учреждений исламского обучения, приносит структурированное образование в города Аль-Андалуса." #NT!
 nd_adu_mediterranean_trade: "Средиземноморские торговые сети" #NT!
 nd_adu_mediterranean_trade_desc: "Андалузские купцы торгуют шелком, сахаром и сухофруктами через порты Альмерии, Малаги и Альхесираса, соединяя исламскую Иберию с более широким средиземноморским миром." #NT!
 nd_adu_convivencia: "Конвивенсия" #NT!
 nd_adu_convivencia_desc: "Традиция сосуществования мусульман, христиан и евреев, сделавшая Аль-Андалус маяком интеллектуального обмена и культурного богатства." #NT!
 nd_adu_naval_arsenal: "Военно-морской арсенал" #NT!
 nd_adu_naval_arsenal_desc: "Дар ас-Синаа в Альмерии и Альхесирасе производят военные галеры, которые контролируют западное Средиземноморье." #NT!
 nd_adu_caliphal_administration: "Халифская администрация" #NT!
 nd_adu_caliphal_administration_desc: "Централизованный административный аппарат халифата с его визирями, кади и губернаторами провинций обеспечивает эффективное правление." #NT!
 nd_adu_ghazi_warriors: "Гази Воины" #NT!
 nd_adu_ghazi_warriors_desc: "Гази Аль-Андалуса — пограничные воины, которые сочетают религиозное рвение с боевым мастерством, защищая Дар аль-Ислам." #NT!
 nd_adu_alcazar_fortification: "Укрепление Алькасара" #NT!
 nd_adu_alcazar_fortification_desc: "Алькасары Аль-Андалуса — это укрепленные дворцовые комплексы, служащие резиденциями власти и бастионами обороны." #NT!
 nd_adu_translation_movement: "Переводческое движение" #NT!
 nd_adu_translation_movement_desc: "Систематический перевод арабских научных работ на латынь и иврит превращает Аль-Андалус в интеллектуальный мост между исламской и христианской цивилизациями, а блестящая керамика демонстрирует материальную культуру, рожденную в результате этого обмена." #NT!
 nd_adu_silk_industry: "Шелковая промышленность" #NT!
 nd_adu_silk_industry_desc: "Шелковые мастерские Гранады и Альмерии производят лучшие ткани в Европе, а их дамасская ткань и тафта ценятся во всем Средиземноморье." #NT!
 nd_adu_diplomatic_survival: "Дипломатическое мастерство" #NT!
 nd_adu_diplomatic_survival_desc: "Столетия плавания между могущественными соседями сделали дипломатов Андалусии мастерами искусства выживания посредством переговоров." #NT!
 nd_adu_port_cities: "Портовые города Аль-Андалуса" #NT!
 nd_adu_port_cities_desc: "Крупные порты Альмерии, Малаги и Севильи являются опорой морской торговой сети, простирающейся от Марокко до Леванта." #NT!
 nd_adu_alhambra_legacy: "Альгамбра Наследие" #NT!
 nd_adu_alhambra_legacy_desc: "Архитектурная традиция Альгамбры вдохновляет расцвет исламского искусства и архитектуры по всему Аль-Андалусу." #NT!
 nd_adu_corsair_tradition: "Корсарская традиция" #NT!
 nd_adu_corsair_tradition_desc: "Стремительные корсары Насридов патрулируют Гибралтарский пролив и западную часть Средиземноморья, защищая торговые пути и совершая набеги на вражеские суда." #NT!
 nd_adu_fiscal_innovation: "Фискальные инновации" #NT!
 nd_adu_fiscal_innovation_desc: "Аль-Андалус развивает сложные финансовые инструменты и регулируемые рынки, при этом Сук является сердцем коммерческой жизни каждого города." #NT!
 nd_adu_waqf_system: "Пожертвования вакфа" #NT!
 nd_adu_waqf_system_desc: "Исламский институт вакфа — благотворительные пожертвования на общественные работы — финансирует строительство больниц, школ и инфраструктуры." #NT!
 nd_adu_military_reform: "Берберско-андалузский военный фьюжн" #NT!
 nd_adu_military_reform_desc: "Военные традиции североафриканских берберских династий сливаются с иберийскими методами, создавая своеобразное военное искусство Андалузии, порождая знаменитых кузнецов-мечников и оружейников." #NT!
 nd_adu_taifa_governance: "Управление Тайфы" #NT!
 nd_adu_taifa_governance_desc: "Извлекая уроки из фрагментации королевств таифа, Аль-Андалус развивает институты для предотвращения провинциального сепаратизма." #NT!
 nd_adu_centralized_sultanate: "Централизованный султанат" #NT!
 nd_adu_centralized_sultanate_desc: "Султан закрепляет прямой контроль над провинциями, заменяя полуавтономных губернаторов королевскими администраторами." #NT!
 nd_adu_infrastructure_renewal: "Обновление инфраструктуры" #NT!
 nd_adu_infrastructure_renewal_desc: "Программа общественных работ обновляет административный аппарат Аль-Андалуса, создавая провинциальные канцелярии для координации управления по всему королевству." #NT!
 nd_adu_maritime_expansion: "Морская экспансия" #NT!
 nd_adu_maritime_expansion_desc: "Аль-Андалус расширяет свой военно-морской потенциал, строя новые арсеналы и нанимая опытных моряков для проецирования мощи по всему Средиземноморью." #NT!
 nd_adu_standing_army: "Постоянная армия" #NT!
 nd_adu_standing_army_desc: "Аль-Андалус заменяет племенные рекруты и добровольцев-гази профессиональной постоянной армией дисциплинированной пехоты под прямым королевским командованием." #NT!
 nd_adu_majlis_council: "Совет Меджлиса" #NT!
 nd_adu_majlis_council_desc: "Консультативный совет знати консультирует правителя по вопросам права и управления, балансируя королевскую власть с общественным консенсусом." #NT!
 nd_adu_islamic_enlightenment: "Исламское Просвещение" #NT!
 nd_adu_islamic_enlightenment_desc: "Новое поколение андалузских ученых занимается эмпирическими исследованиями и рациональным дискурсом, продолжая традицию Ибн Рушда." #NT!
 nd_adu_industrial_modernization: "Промышленная модернизация" #NT!
 nd_adu_industrial_modernization_desc: "Аль-Андалус адаптирует современные технологии производства, опираясь на свои многовековые традиции квалифицированного ремесла.\n\n#italic Доступно в: $nd_adu_dar_al_tiraz$#!" #NT!
 nd_adu_modern_army: "Современная армия" #NT!
 nd_adu_modern_army_desc: "Вооруженные силы Андалусии применяют современные технологии обучения, формирования и огнестрельного оружия, чтобы соответствовать армиям того времени." #NT!
 nd_adu_andalusi_renaissance: "Андалузский Ренессанс" #NT!
 nd_adu_andalusi_renaissance_desc: "Культурный расцвет напоминает золотой век Халифата, поскольку Аль-Андалус снова становится центром искусства, литературы и философии." #NT!
 nd_adu_urban_renewal: "Обновление городов" #NT!
 nd_adu_urban_renewal_desc: "Великие города Аль-Андалуса расширяются и модернизируются, привлекая мигрантов и торговцев со всего мусульманского мира." #NT!
 nd_adu_global_trade_mastery: "Мастерство глобальной торговли" #NT!
 nd_adu_global_trade_mastery_desc: "Аль-Андалус использует свое положение на стыке Атлантики и Средиземноморья, чтобы доминировать в глобальных торговых сетях." #NT!
 a_nd_adu_jinete: "Хинете" #NT!
 a_nd_adu_jinete_desc: "Легкая кавалерия в берберском стиле, вооруженная дротиками и баклерами, мастера боевых действий, ездящие на маленьких, проворных дженнетах." #NT!
 a_nd_adu_zenata_guard: "Зенатская конная гвардия" #NT!
 a_nd_adu_zenata_guard_desc: "Элитная тяжелая кавалерия из берберских племен Зената, бронированные и дисциплинированные ударные войска, составляющие ядро ​​конной армии Андалузии." #NT!
 a_nd_adu_ghazi: "Гази" #NT!
 a_nd_adu_ghazi_desc: "Святые воины Фронтира Аль-Андалуса, которые сражаются за веру, сочетая религиозное рвение со смертоносными навыками владения оружием на пересеченной местности." #NT!
 a_nd_adu_nizam_infantry: "Низам аль-Джадид" #NT!
 a_nd_adu_nizam_infantry_desc: "Модернизированная профессиональная пехота, обученная по европейским методикам, составила костяк реформированной постоянной армии Андалузии." #NT!
 n_nd_adu_war_galley: "Андалузская военная галера" #NT!
 n_nd_adu_war_galley_desc: "Средиземноморская военная галера, построенная в Дар-ас-Синаа в Альмерии, больше и быстрее стандартных галер, предназначенных для контроля над западным Средиземноморьем." #NT!
 n_nd_adu_nasrid_corsair: "Насрид Корсар" #NT!
 n_nd_adu_nasrid_corsair_desc: "Быстрый легкий рейдерский корабль военно-морских традиций Насридов, предназначенный для охоты на торговое судоходство и защиты Гибралтарского пролива." #NT!
 nd_adu_madrasa: "Медресе" #NT!
 nd_adu_madrasa_desc: "Исламское высшее учебное заведение, преподающее теологию, юриспруденцию, медицину, математику и философию." #NT!
 nd_adu_acequia: "Асекия" #NT!
 nd_adu_acequia_desc: "Сложная система оросительных каналов, доставляющая воду из горных ручьев на поля и сады, обеспечивает интенсивное сельское хозяйство." #NT!
 nd_adu_alcazar: "Алькасар" #NT!
 nd_adu_alcazar_desc: "Укрепленный дворцовый комплекс, служащий одновременно административным центром и оборонительной крепостью, построенный в характерном андалузском стиле." #NT!
 nd_adu_dar_al_tiraz: "Дар аль-Тираз" #NT!
 nd_adu_dar_al_tiraz_desc: "Королевская текстильная мастерская, производящая лучшие шелковые ткани в Европе, тафту, дамасскую ткань и парчу, ценимую во всем Средиземноморье." #NT!
 nd_adu_funduq: "Фундук" #NT!
 nd_adu_funduq_desc: "Торговый дом и склад купцов, где генуэзские, каталонские и марокканские торговцы обмениваются товарами со всего Средиземноморья." #NT!
 nd_adu_ribat: "Рибат" #NT!
 nd_adu_ribat_desc: "Пограничная крепость-монастырь, сочетающая военную оборону с религиозной преданностью, в которой обитают воины, поклявшиеся защищать границы ислама." #NT!
 nd_adu_hammam: "Хаммам" #NT!
 nd_adu_hammam_desc: "Общественная баня, обеспечивающая гигиену, общение и ритуальное очищение, краеугольный камень городской культуры Андалузии." #NT!
 nd_adu_dar_al_sinaa: "Дар аль-Синаа" #NT!
 nd_adu_dar_al_sinaa_desc: "Государственный военно-морской арсенал, производящий военные галеры и торговые суда, основу морской мощи Андалусии." #NT!
 nd_adu_waqf: "Фонд Вакфа" #NT!
 nd_adu_waqf_desc: "Исламский благотворительный фонд, бессрочно финансирующий больницы, школы и общественные работы на благо общества." #NT!
 nd_adu_lusterware_kiln: "Обжиговая печь для люстровой посуды" #NT!
 nd_adu_lusterware_kiln_desc: "Керамическая мастерская, производящая знаменитую андалузскую люстровую посуду, глазурованную керамику, переливающуюся переливами золота и меди, ценимую от Севильи до Каира." #NT!
 nd_adu_forge: "Андалузская кузница" #NT!
 nd_adu_forge_desc: "Оружейная кузница в традициях толедской стали, где мастера-мечники производят клинки, известные во всем Средиземноморье своей прочностью и гибкостью." #NT!
 nd_adu_suq: "Сук" #NT!
 nd_adu_suq_desc: "Центральная рыночная площадь и крытый базар, где сходятся купцы, ремесленники и сборщики налогов, в коммерческом центре каждого города Андалузии." #NT!
 nd_adu_diwan: "Диван" #NT!
 nd_adu_diwan_desc: "Административная канцелярия, где писцы и бюрократы управляют записями, корреспонденцией и финансовыми счетами королевства." #NT!
 nd_adu_madrasa_upkeep: "Научный фонд" #NT!
 nd_adu_madrasa_upkeep_desc: "Бумага, книги и свечи поддерживают образовательную миссию медресе." #NT!
 nd_adu_acequia_maintenance: "Обслуживание каналов" #NT!
 nd_adu_acequia_maintenance_desc: "Камень, древесина и инструменты обеспечивают чистоту течения каналов асекии." #NT!
 nd_adu_alcazar_garrison: "Дворцовая стража" #NT!
 nd_adu_alcazar_garrison_desc: "Оружие, камень и кожаная броня поддерживают оборонительную готовность алькасара." #NT!
 nd_adu_silk_weaving: "Шелковое Ткачество" #NT!
 nd_adu_silk_weaving_desc: "Шелк-сырец и красители превращаются в лучшую ткань в Европе." #NT!
 nd_adu_mechanized_weaving: "Механизированное ткачество" #NT!
 nd_adu_mechanized_weaving_desc: "Современное оборудование увеличивает производство шелка, одновременно внедряя хлопковые смеси для более широких рынков." #NT!
 nd_adu_funduq_operations: "Торговые операции" #NT!
 nd_adu_funduq_operations_desc: "Ткань, бумага и соль облегчают бизнес международных торговцев." #NT!
 nd_adu_ribat_upkeep: "Пограничный гарнизон" #NT!
 nd_adu_ribat_upkeep_desc: "Оружие, провизия, кожаная упряжь и инструменты поддерживают воинов-монахов рибата." #NT!
 nd_adu_hammam_operations: "Работа бани" #NT!
 nd_adu_hammam_operations_desc: "Древесина, глиняная плитка и угольное топливо обеспечивают обогрев и поддержание хаммама в рабочем состоянии." #NT!
 nd_adu_shipyard_maintenance: "Военно-морское обслуживание" #NT!
 nd_adu_shipyard_maintenance_desc: "Древесина, железо и деготь поддерживают судостроительную деятельность арсенала." #NT!
 nd_adu_waqf_endowment: "Благотворительные работы" #NT!
 nd_adu_waqf_endowment_desc: "Зерно, ткань и бумага поддерживают благотворительную и просветительскую миссию вакфа." #NT!
 nd_adu_lusterware_production: "Производство люстровой посуды" #NT!
 nd_adu_lusterware_production_desc: "Глину и металлические красители обжигают для получения переливающейся глазурованной керамики, которая ценится во всем Средиземноморье." #NT!
 nd_adu_sword_forging: "Ковка Меча" #NT!
 nd_adu_sword_forging_desc: "Железо и уголь питают кузницы, которые производят андалузские клинки в соответствии со знаменитыми традициями Толедо." #NT!
 nd_adu_suq_operations: "Рыночные операции" #NT!
 nd_adu_suq_operations_desc: "Ткань, соль и бумага поддерживают коммерческую деятельность центрального рынка." #NT!
 nd_adu_diwan_administration: "Канцелярские операции" #NT!
 nd_adu_diwan_administration_desc: "Бумага, книги, прекрасная одежда для чиновников и мебель служат основой для записей и переписки канцелярии." #NT!
 levy_nd_adu_jinete: "Джинетская кавалерия" #NT!
 levy_nd_adu_jinete_desc: "Легкая кавалерия берберского типа, собранная из военных домов и дворянских поместий Аль-Андалуса." #NT!
 levy_nd_adu_ghazi: "Волонтеры Гази" #NT!
 levy_nd_adu_ghazi_desc: "Пограничные святые воины призваны защищать границы веры." #NT!
 nd_adu_formed_tt: "Аль-Андалус был основан" #NT!
 nd_adu_path_a_tt: "Выбрал украшение мира" #NT!
 nd_adu_path_b_tt: "Выбрать Меч Магриба" #NT!
 nd_adu_destiny: "Судьба Аль-Андалуса" #NT!
 nd_adu_destiny_desc: "Поскольку Иберия объединена под полумесяцем, Аль-Андалус стоит на перепутье между наукой и завоеваниями." #NT!
 nd_adu_dest_knowledge: "Знания восстановлены" #NT!
 nd_adu_dest_knowledge_desc: "Восстановите легендарные библиотеки Кордовы и привлеките ученых со всего мира. Требуется банковское учреждение, шелк на рынке капитала и 1000 золота." #NT!
 nd_adu_dest_translators: "Мост цивилизаций" #NT!
 nd_adu_dest_translators_desc: "Распространите интеллектуальное влияние Андалузии на Окситанию. Требуется владение Тулузой, типографией, общее развитие 7500 и 2000 золота." #NT!
 nd_adu_dest_golden_age: "Второй золотой век" #NT!
 nd_adu_dest_golden_age_desc: "Превзойдите даже Кордовский халифат, построив универсальную цивилизацию, охватывающую Средиземноморье. Требуется владение Палермо, научная революция, престиж 75, 3000 золота и общее развитие 10000." #NT!
 nd_adu_dest_reconquest: "Магриб восстановлен" #NT!
 nd_adu_dest_reconquest_desc: "Пересеките пролив и верните Магриб Аль-Андалусу. Требуется владение Фесом и Тлемсеном и 30-тысячная армия." #NT!
 nd_adu_dest_caliphate: "Халифат восстановлен" #NT!
 nd_adu_dest_caliphate_desc: "Объедините западный исламский мир под знаменем Аль-Андалуса. Требуется владение Тунисом и Марракешем, армия численностью 50 000 человек и престиж 50." #NT!
 nd_adu_dest_empire: "Империя Полумесяца" #NT!
 nd_adu_dest_empire_desc: "Постройте империю, простирающуюся от Атлантики до Нила. Требуется владение Триполи и Каиром, армия в 75 000 человек, престиж 75 и 3 000 золота." #NT!
 nd_adu.5.t: "Судьба Аль-Андалуса" #NT!
 nd_adu.5.d: "Когда полуостров был захвачен, а наше королевство консолидировано, ученые Кордовы и воины пограничья обращаются к нам за указаниями. Путь, который мы выбрали при своем основании, теперь начинает приносить плоды. Будь то распространение знаний или марш армий, Аль-Андалус оставит свой след в мире." #NT!
 nd_adu.5.a: "Наша судьба ждет." #NT!
 nd_adu.6.t: "Знания восстановлены" #NT!
 nd_adu.6.d: "Великие библиотеки Кордовы восстанавливаются. Ученые от Багдада до Византии приезжают в наши дворы, привлеченные обещанием покровительства и свободы искать истину, куда бы она ни вела. Банкиры Аль-Андалуса финансируют экспедиции по поиску утерянных рукописей, а торговцы шелком везут по торговым путям не только ткани, но и идеи. Интеллектуальная традиция, которая когда-то сделала эту землю чудом света, возрождается." #NT!
 nd_adu.6.a: "Пусть лампы обучения снова загорятся ярко." #NT!
 nd_adu.7.t: "Мост цивилизаций" #NT!
 nd_adu.7.d: "Наши ученые обосновались в Тулузе и городах Окситании, создав коридор интеллектуального обмена между исламским и христианским миром. Арабские тексты по астрономии, медицине и философии текут на север, а европейские инновации в области техники и навигации текут на юг. Аль-Андалус является незаменимым мостом между цивилизациями.\n\nНо этот мост можно использовать по-разному. Некоторые утверждают, что мы должны использовать свое положение переводчиков и посредников для расширения нашего дипломатического влияния, поглощая народы, с которыми мы сталкиваемся, в нашу космополитическую цивилизацию. Другие говорят, что мы должны использовать этот момент, чтобы инвестировать в искусство и благоустройство нашего королевства, превратив Аль-Андалус в рай, которому завидует мир." #NT!
 nd_adu.7.a: "Мы станем мостом, который соединит все народы." #NT!
 nd_adu.7.b: "Давайте построим рай, достойный нашего обучения." #NT!
 nd_adu.8.t: "Второй золотой век" #NT!
 nd_adu.8.d: "Это сделано. От колонн Кордовы до мозаик Палермо, от виноградников Тулузы до библиотек Валенсии — Аль-Андалус создал цивилизацию, которая может соперничать с величайшими цивилизациями, которые когда-либо знал мир. Наши учёные не просто сохранили древние знания. Они превзошли его, сделав открытия в оптике, химии и медицине, которые древним и не снились.\n\nТеперь вопрос в том, как увенчать это достижение. Должны ли мы превратить наши академии в универсальное учебное заведение, открытое для всех вероисповеданий и наций, которое будет формировать интеллектуальное будущее человечества? Или нам следует обратиться внутрь себя, совершенствуя сады и дворцы нашего королевства, пока сам Аль-Андалус не станет произведением искусства, раем на земле, вызывающим удивление на протяжении тысячи лет?" #NT!
 nd_adu.8.a: "Основал Вселенскую академию наук." #NT!
 nd_adu.8.b: "Постройте Сад Земного Рая." #NT!
 nd_adu.9.t: "Магриб восстановлен" #NT!
 nd_adu.9.d: "Армии Аль-Андалуса пересекли пролив и водрузили знамя в Фесе и Тлемсене. Тот же путь, по которому Альморавиды и Альмохады когда-то шли на север, чтобы спасти мусульманскую Иберию, теперь изменился: андалузцы пошли на юг, чтобы объединить Магриб под своей властью. Берберские племена, которые когда-то составляли ударную кавалерию иберийского ислама, теперь присягают султану в Кордове. Западное Средиземноморье начинает приобретать характер андалузского озера." #NT!
 nd_adu.9.a: "Пролив наш. Давайте двигаться дальше." #NT!
 nd_adu.10.t: "Халифат восстановлен" #NT!
 nd_adu.10.d: "От Марракеша до Туниса, от Атласских гор до берегов Иберии — западный исламский мир объединен под знаменем Аль-Андалуса. То, что Омейяды начали в Кордове, то, что Альмохады пытались сделать из Марракеша, наконец было достигнуто: единый халифат, правящий всеми землями мусульманского Запада.\n\nНо характер этого халифата еще предстоит определить. Некоторые призывают нас направить пыл наших воинов-гази, поддерживая боевой дух, который принес нам эту империю, и готовясь к дальнейшим завоеваниям. Другие советуют консолидироваться, получать дань с наших обширных владений и создавать административный аппарат, необходимый для управления империей такого размера." #NT!
 nd_adu.10.a: "Меч веры никогда не вкладывается в ножны." #NT!
 nd_adu.10.b: "Пусть богатства империи потекут в нашу казну." #NT!
 nd_adu.11.t: "Империя Полумесяца" #NT!
 nd_adu.11.d: "Знамя Аль-Андалуса реет над Каиром. Пирамиды и Альгамбра, библиотеки Кордовы и мечети Кайруана, Гибралтарский пролив и устье Нила: все они объединены под властью одного султана. Никогда со времен ранних Омейядов ни один мусульманский правитель не командовал такой обширной и разнообразной империей на западе.\n\nКак мы будем управлять этой империей? Как Султан султанов, военный гегемон, чьи армии могут пройти от Атлантики до Красного моря? Или как западный халиф, морская держава, чей флот командует Средиземноморьем и чья дипломатическая сфера распространяется на каждый порт от Лиссабона до Александрии?" #NT!
 nd_adu.11.a: "Мы Султан Султанов." #NT!
 nd_adu.11.b: "Мы Западный Халифат." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_intellectual_bridge: "Интеллектуальный мост" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_intellectual_bridge: "Аль-Андалус служит интеллектуальным мостом между цивилизациями, его ученые переводят и передают знания, которые меняют мир." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_patron_of_arts: "Покровитель искусств" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_patron_of_arts: "Королевское покровительство превращает Аль-Андалус в рай архитектуры, поэзии и музыки, хотя за такую ​​изысканность приходится платить воинственной энергией." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_universal_academy: "Универсальная Академия" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_universal_academy: "Универсальная Академия Аль-Андалуса привлекает ученых и дипломатов со всего известного мира, расширяя влияние королевства посредством знаний." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_garden_of_paradise: "Райский сад" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_garden_of_paradise: "Сады, дворцы и библиотеки Аль-Андалуса стали раем на земле, привлекая богатство и таланты и одновременно порождая самодовольство в рядах." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_ghazi_fervor: "Гази Фервор" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_ghazi_fervor: "Боевой дух воинов гази ярко пылает по всему Халифату, вдохновляя солдат и моряков на подвиги." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_imperial_tribute: "Императорская дань" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_imperial_tribute: "Обширные владения халифата приносят дань золотом и солдатами, что способствует дальнейшему расширению и обеспечению безопасности границ." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_sultan_of_sultans: "Султан султанов" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_sultan_of_sultans: "Султан Аль-Андалуса командует самой могущественной армией в западном мире, проявляя дисциплинированную инициативу и распространяя мощь на огромные расстояния." #NT!
 STATIC_MODIFIER_NAME_nd_adu_dest_western_caliphate: "Западный Халифат" #NT!
 STATIC_MODIFIER_DESC_nd_adu_dest_western_caliphate: "Западный Халифат господствует в Средиземноморье посредством превосходства на море и эффективного поглощения завоеванных территорий." #NT!
 nd_adu_bayt_al_hikma: "Байт аль-Хикма" #NT!
 nd_adu_bayt_al_hikma_desc: "Дом мудрости в традициях легендарной багдадской академии, где собираются ученые всех вероисповеданий и наций, чтобы переводить, дискутировать и продвигать человеческие знания." #NT!
 nd_adu_hikma_endowment: "Научный фонд" #NT!
 nd_adu_hikma_endowment_desc: "Бумага, книги, свечи и стеклянные инструменты поддерживают исследования и преподавание в академии." #NT!
 nd_adu_dar_al_jihad: "Дар аль-Джихад" #NT!
 nd_adu_dar_al_jihad_desc: "Укрепленный командный центр и арсенал, где планируются военные кампании халифата, собираются солдаты и содержатся конюшни для армий веры." #NT!
 nd_adu_jihad_provisioning: "Военное снабжение" #NT!
 nd_adu_jihad_provisioning_desc: "Оружие, боевые кони, кожаная упряжь и зерно поддерживают гарнизон и снабжают экспедиционные силы халифата." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_adu_bureaucracy_authority: "Халифальный Диван" #NT!
 AUTO_MODIFIER_DESC_nd_adu_bureaucracy_authority: "При формировании [ADU.GetName] унаследовал институциональный аппарат Омейядского халифата Кордовы и его преемников: хиджабу и канцелярию, реестры диванов Мадинат аз-Захры, судебную систему Малики, рыночные суды мухтасиба и эстафетных всадников баридов. Предоставляет три слота бюрократии, чтобы игрок мог управлять до четырьмя историческими учреждениями Андалузии (с универсальным слотом столицы)." #NT!
  
 adu_hijaba_bureaucracy: "Хиджаба" #NT!
 adu_hijaba_bureaucracy_desc: "Должность камергера при дворе Кордовы, установленная при эмирате Омейядов и повышенная халифатом 929 года. Хаджиб стоял во главе своего собственного меджлиса, принимал просителей и посольства и составлял указы от имени халифа. При Альманзоре (978–1002) эта должность стала де-факто королевской властью. Хиджаба централизовала управление через каср, но ценой того, что знать была лишена доступа к интимным советам халифа." #NT!
  
 adu_diwan_al_jund_bureaucracy: "Диван аль-Джунд" #NT!
 adu_diwan_al_jund_bureaucracy_desc: "Военный реестр, унаследованный от сирийских джунд, расселившихся по полуострову в 742 году: дамасская джунда в Эльвире, иорданская джунда в Райю (Малага), джунда Филастин в Сидонии и Хересе, джунда Эмеса в Севилье, джунда Киннасрин в Хаэне. Каждое подразделение получало зарплату со своих земель и производило по вызову кавалерию. Эффективен, когда за него платят, но те же джунды поддержали фрагментацию таифы в 1031 году, когда власть халифата ослабла." #NT!
  
 adu_qadi_al_jamaa_bureaucracy: "Кади аль-Джамаа" #NT!
 adu_qadi_al_jamaa_bureaucracy_desc: "Главный судья общины, верховный судья Малики Кордовы. При Хишаме I и аль-Хакаме I мазхаб Малики стал доминирующей правовой системой Аль-Андалуса, систематизированной Яхьей ибн Яхьей аль-Лайти. Ибн Рушд аль-Джадд, Кади Ияд и Ибн аль-Хадж аль-Куртуби занимали эти посты. Строгость Малики скрепила королевство ценой принуждения общин зимми к более строгому статусу." #NT!
  
 adu_hisba_muhtasib_bureaucracy: "Хисба и Мухтасиб" #NT!
 adu_hisba_muhtasib_bureaucracy_desc: "Городское регулирующее управление, известное в Аль-Андалусе как Сахиб аль-Сук. От торговли на большом рынке Кордовы к западу от Алькасара до шорников и парфюмеров Малаги (описанных ас-Сакати около 1200 года в его «Китаб фи адаб аль-хисба») мухтасиб навязывал вес, цены, общественную мораль и ремесленные стандарты. Институт, который превратил города Андалусии в мастерские западного Средиземноморья." #NT!
  
 adu_madinat_al_zahra_bureaucracy: "Суд Мадинат аль-Захра" #NT!
 adu_madinat_al_zahra_bureaucracy_desc: "Роскошный город, построенный Абд аль-Рахманом III в 936 году, с его Салоном Рико для приема посольств и строгими церемониальными протоколами, ранжирующими всю администрацию по близости к трону. Халифы принимали византийских послов, франкских монахов и сахарскую дань под шелковыми балдахинами. Придворный церемониал как инструмент правления: разрушительный, если им пренебрегать, о чем свидетельствуют грабежи и сожжения 1010–1013 годов. Требуется место в Кордове." #NT!
  
 adu_barid_bureaucracy: "Барид" #NT!
 adu_barid_bureaucracy_desc: "Почтово-разведывательная служба, унаследованная от Омейядов на востоке. Всадники перевозили запечатанные депеши между Кордовой и марками Толедо, Сарагосы и Бадахоса; почтмейстеры одновременно служили глазами халифа для каждого губернатора. Построенный на ретрансляционных станциях и конных курьерах, он обеспечивал передачу информации быстрее, чем восстание. Его упадок всегда был первым признаком того, что граница отодвигается." #NT!
  
 adu_dhimma_pact_bureaucracy: "Дхиммский пакт" #NT!
 adu_dhimma_pact_bureaucracy_desc: "Официальные отношения защиты и дани с мозарабской христианской и еврейской общинами Аль-Андалуса. Взрослые мужчины платили джизью в размере одного динара в год; землевладельцы платили харадж. Мосарабские епископы выполняли функции администраторов и политических посланников; Еврейские визири от Хасдая ибн Шапрута до Самуила ибн Нагрилы из Гранады достигли самых высоких советов. Духовенство Малики возмущалось глубиной компромисса, но от этого зависели доходы и дипломатия халифата." #NT!
