l_russian:
 YMP: "Империя Ямато" #NT!
 YMP_ADJ: "Императорский японский" #NT!
 YMP_f: "Империя Ямато" #NT!
 YMP_f_desc: "Мечта Тоётоми Хидэеси умерла, преследуя ее. В 1592 году он направил самурайские армии объединенной Японии против Кореи и далее в сторону Минского Китая, намереваясь создать не что иное, как империю под руководством Японии во всей Восточной Азии; только его смерть в 1598 году положила конец кампании и дала Токугаве повод для двух с половиной столетий изоляции. Альтернативой является Империя Ямато: бакуфу отказывается от сакоку, Имджинская война побеждает, а трон из хризантем простирается от Хоккайдо через Хансон до Янцзы. Японские замки возвышаются над Пхеньяном, самураи становятся имперским офицерским корпусом континентального порядка, а Микадо правит восточноазиатской империей, построенной на амбициях Эдо, а не на уединении Эдо." #NT!
