l_russian:
 STATIC_MODIFIER_NAME_nd_tib_ganden_phodrang: "Ганден Пходранг" #NT!
 STATIC_MODIFIER_DESC_nd_tib_ganden_phodrang: "Единое теократическое правительство, созданное под руководством Далай-ламы, объединяющее духовную власть с светской властью через Кашагский совет. Монастыри служат центрами обучения, управления и военной координации." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dharma_kings: "Путь королей Дхармы" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dharma_kings: "В традиции великих тибетских царей (Сонгцен Гампо, Трисонг Децен и Ралпакан) воин-повелитель правит плато с твердой властью, покровительствуя дхарме и одновременно командуя армиями, защищающими его." #NT!
 nd_tib.1.t: "Объединение Крыши Мира" #NT!
 nd_tib.1.d: "Тибет един. От продуваемых всеми ветрами перевалов Чангтанга до лесистых долин Кхама — плато представляет собой единое царство. Но вопрос о том, как управлять этим царством, звучит эхом в каждом монастыре и крепости.\n\nМонахи Гелугпа предлагают видение священного управления: Ганден Пходранг, где воплощенный Далай-лама руководит верой и государственным управлением через совет ученых министров. В своих монастырях десять тысяч монахов учатся, молятся и готовятся управлять империей духа.\n\nОднако другие обращаются к традициям Королей Дхармы, тех воинов-правителей, которые создали Тибет посредством завоеваний и покровительства. По их словам, сильная рука у бразды правления — это то, что уберегло плато от империй, окружающих его границы: Китая, Монголии, Великих Моголов.\n\nКаким путем должен следовать Тибет?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tib.1.a: "Пусть мудрость Далай-ламы направляет нашу нацию" #NT!
 nd_tib.1.b: "Тибету нужен король-воин, а не монах" #NT!
 STATIC_MODIFIER_NAME_nd_tib_potala_glory: "Слава Поталы" #NT!
 STATIC_MODIFIER_DESC_nd_tib_potala_glory: "Великолепный дворец Потала венчает холм Марпо Ри над Лхасой, его белые и красные башни видны на многие мили через долину. Памятник единству духовной и светской власти, он внушает трепет всем, кто его видит." #NT!
 nd_tib.2.t: "Дворец над облаками" #NT!
 nd_tib.2.d: "Дворец Потала возвышается на вершине Марпо Ри, Красного холма Лхасы. Тринадцать этажей из камня и дерева. В Белом дворце расположены палаты управления, а в Красном дворце — часовни, гробницы и библиотеки священных текстов. Десятки тысяч рабочих и ремесленников десятилетиями работали над воплощением этой идеи.\n\nДворец, построенный в 1645 году Пятым Далай-ламой, занял почти пятьдесят лет: его строительство продолжалось тайно после его смерти под руководством регента Дези Сангье Гьяцо. С более чем тысячей комнат, десятью тысячами святынь и двумястами тысячами статуй он считается величайшим архитектурным достижением Тибетского нагорья.\n\nПотала — это больше, чем дворец. Это заявление: цивилизация Тибета, расположенная среди самых высоких гор на Земле, может создавать произведения, способные соперничать с любой империей, расположенной внизу." #NT!
 nd_tib.2.a: "Памятник, достойный Крыши Мира" #NT!
 STATIC_MODIFIER_NAME_nd_tib_khampa_rising: "Кхампа Райзинг" #NT!
 STATIC_MODIFIER_DESC_nd_tib_khampa_rising: "Свирепые всадники Кхампа из восточного Тибета сплотились под знаменем, принеся в национальную армию свое легендарное боевое мастерство и глубокие знания ведения войны в горах." #NT!
 STATIC_MODIFIER_NAME_nd_tib_plateau_command: "Командование плато" #NT!
 STATIC_MODIFIER_DESC_nd_tib_plateau_command: "Объединение территорий Кхампа под централизованным командованием усилило контроль государства на обширной восточной границе, направляя энергию воинов на дисциплинированную службу." #NT!
 nd_tib.3.t: "Воины Кхама" #NT!
 nd_tib.3.d: "Жители Кхама, Кхампы, не похожи ни на одного другого тибетца. Высокие ростом, свирепые по темпераменту, они рождены для седла и меча. Их репутация воинов не имеет себе равных на плато, а горные перевалы восточного Тибета оглашаются грохотом их лошадей.\n\nНа протяжении столетий кхампы вели полуавтономное существование, их племенные вожди лишь отдаленно подчинялись Лхасе. Теперь, когда единое государство Тибета становится зрелым, возникает вопрос: как эти грозные воины будут включены в состав нации?\n\nОдин путь предполагает их независимость: предоставление вождям Кхампа автономии в обмен на их свирепую кавалерию, когда они будут призваны на войну. Другой требует интеграции, передачи воинов Кхампы под прямое командование Лхасы, направляя их ярость в организованную военную мощь." #NT!
 nd_tib.3.a: "Дайте Кхампам свободу: их ярость — наш щит." #NT!
 nd_tib.3.b: "Приведите их под командование Кашага." #NT!
 nd_tib.4.t: "Четыре Тантры исцеления" #NT!
 nd_tib.4.d: "Традиция Сова Ригпа, Науки Целительства, достигает своего полного расцвета. Опираясь на «Гюши», «Четыре медицинские тантры», составленные в двенадцатом веке Ютоком Йонтеном Гонпо, тибетские врачи разработали одну из самых сложных медицинских систем в Азии.\n\nОпираясь на индийскую аюрведу, китайскую медицину, персидское искусство исцеления и местные практики бон, «Четыре тантры» описывают человеческое тело как ландшафт, состоящий из элементов, находящихся в равновесии. Болезнь возникает от их беспокойства; исцеление происходит от их восстановления с помощью трав, собранных на большой высоте, минеральных соединений, диетического регулирования и духовной практики.\n\nСоздание медицинских колледжей Менцеханг в крупных монастырях гарантирует сохранение и передачу этих знаний. Врачи, прошедшие подготовку в этих учреждениях, обслуживают общины по всему плато, их навыки востребованы от Непала до Монголии." #NT!
 nd_tib.4.a: "Наука исцеления освещает нашу землю" #NT!
 nd_tib.5.t: "Дхарма в чернилах и дереве" #NT!
 nd_tib.5.d: "Великие типографии Тибета (в Нартанге, Дерге и Лхасе) изменили подход к сохранению буддийских знаний. Тысячи деревянных блоков, каждый из которых кропотливо вырезан в обратном порядке мастерами-ремесленниками, создают страницы Священного Писания со скоростью и точностью, с которыми никогда не сможет сравниться ручное копирование.\n\nВ отличие от подвижного типа Китая, тибетские печатники предпочитали постоянные деревянные блоки. Из единственного блока, однажды вырезанного, можно было создавать точные копии на протяжении веков: привлекательное постоянство для монастырей, которые считали себя хранителями непрерывной линии подлинного буддийского учения. В одном только Дерге Паркханге находится более двухсот тысяч кварталов.\n\nЭта революция в производстве текстов распространила грамотность в монашеской системе, стандартизировала религиозную практику по всему плато и создала массу печатной литературы, способную соперничать с любой цивилизацией на Земле." #NT!
 nd_tib.5.a: "Дхарма распространяется на печатных крыльях" #NT!
 nd_tib_warrior_monks: "Традиция монаха-воина" #NT!
 nd_tib_warrior_monks_desc: "Великие монастыри Тибета содержат свои собственные вооруженные контингенты: доб-доб, монахи-воины, которые сочетают физическую доблесть с религиозной преданностью и служат стражами и защитниками монашеского ордена." #NT!
 nd_tib_yak_butter_economy: "Як Масло Экономика" #NT!
 nd_tib_yak_butter_economy_desc: "Обработка масла яка для торговли, ритуальные подношения ламп и культовый масляный чай поддерживают как монашескую, так и пастырскую экономику плато." #NT!
 nd_tib_dzong_system: "Крепостная система Дзонг" #NT!
 nd_tib_dzong_system_desc: "Дзонг (укрепленный монастырь, объединяющий военный гарнизон, административный центр и религиозный комплекс) образует основу тибетского территориального контроля на всем плато." #NT!
 nd_tib_tea_horse_road: "Чайная дорога" #NT!
 nd_tib_tea_horse_road_desc: "Древние караванные пути, связывающие чайные районы Китая с коневодческими высокогорьями Тибета, облегчающие обмен тибетских лошадей, соли и шерсти на китайский чай, шелк и промышленные товары." #NT!
 nd_tib_phagmodrupa_legacy: "Наследие Пхагмодрупы" #NT!
 nd_tib_phagmodrupa_legacy_desc: "Административные традиции, установленные во времена династии Пхагмодрупа, баланс феодальной власти и монастырского надзора, продолжают формировать тибетское управление." #NT!
 nd_tib_sowa_rigpa: "Сова Ригпа" #NT!
 nd_tib_sowa_rigpa_desc: "Наука исцеления: сложная медицинская система Тибета, основанная на четырех тантрах, основанная на индийских, китайских, персидских традициях и традициях бон для лечения недугов тела и ума." #NT!
 nd_tib_woodblock_printing: "Ксилографические типографии" #NT!
 nd_tib_woodblock_printing_desc: "Великие типографии Нартанга, Дерге и Лхасы печатают буддийские писания с помощью постоянных деревянных блоков, распространяя грамотность и стандартизируя религиозную практику по всему плато." #NT!
 nd_tib_salt_monopoly: "Монополия Солт-Лейк-Сити" #NT!
 nd_tib_salt_monopoly_desc: "Обширные соленые озера Тибета обеспечивают монополию на этот жизненно важный товар, который продается на юг, в Непал и Индию, в обмен на зерно и промышленные товары." #NT!
 nd_tib_sectarian_wars: "Сектантский конфликт" #NT!
 nd_tib_sectarian_wars_desc: "Длительная борьба между фракциями Кагью, Гелуг и Бон за господство закалила тибетских солдат на протяжении поколений гражданской войны." #NT!
 nd_tib_mountain_warfare: "Доктрина Маунтин-Пасс" #NT!
 nd_tib_mountain_warfare_desc: "Столетия защиты самых высоких перевалов на Земле привели к появлению уникального тибетского подхода к ведению войны в горах: использование высоты, местности и самого разреженного воздуха в качестве оружия против захватчиков из низин." #NT!
 nd_tib_highland_textiles: "Хайленд Текстиль" #NT!
 nd_tib_highland_textiles_desc: "Тибетская шерсть и мех, собранные от стад яков и дичи на экстремальных высотах, являются ценными товарами на рынках Индии, Китая и Центральной Азии." #NT!
 nd_tib_khampa_cavalry: "Кавалерийские традиции Кхампы" #NT!
 nd_tib_khampa_cavalry_desc: "Свирепые всадники Кхама, воинской культуры восточного Тибета, привносят непревзойденные навыки ведения горной кавалерии, их лошади созданы для выносливости на высоте." #NT!
 nd_tib_gelugpa_ascendancy: "Господство гелугпа" #NT!
 nd_tib_gelugpa_ascendancy_desc: "Возвышение школы Желтой Шляпы меняет религиозную жизнь Тибета, устанавливая духовную власть Далай-ламы на плато и в Монголии." #NT!
 nd_tib_dzong_garrisons: "Гарнизонная система Дзонг" #NT!
 nd_tib_dzong_garrisons_desc: "Официальная военная подготовка монахов, дислоцированных в крепостях дзонг, с целью создания профессиональных гарнизонных сил, сочетающих религиозную дисциплину с военными навыками." #NT!
 nd_tib_choyon_alliance: "Чойон Альянс" #NT!
 nd_tib_choyon_alliance_desc: "Отношения покровителя и священника между тибетскими ламами и монгольскими ханами: дипломатический шедевр, в котором духовная власть обменивается на военную защиту и политическую легитимность." #NT!
 nd_tib_tibetan_coinage: "Тибетская чеканка" #NT!
 nd_tib_tibetan_coinage_desc: "Развитие стандартизированной тибетской валюты облегчает торговлю на плато и с соседними державами, заменяя громоздкий бартер чайными кирпичами и солью." #NT!
 nd_tib_kashag_council: "Кашагский совет" #NT!
 nd_tib_kashag_council_desc: "Официальное учреждение Кашага, совета министров, объединяющего светскую и духовную власть, в качестве главного административного органа тибетского государства." #NT!
 nd_tib_potala_palace: "Дворец Потала" #NT!
 nd_tib_potala_palace_desc: "Строительство дворца Потала на Марпо Ри: тринадцать каменных этажей, величайшее архитектурное достижение Тибетского нагорья и резиденция как духовной, так и светской власти." #NT!
 nd_tib_desi_regency: "Регентская традиция" #NT!
 nd_tib_desi_regency_desc: "Прагматичная административная традиция, заложенная Дези Сангье Гьяцо, который управлял Тибетом в период междуцарствия после смерти Пятого Далай-ламы, скрывая ее в течение пятнадцати лет и одновременно консолидируя государственную власть." #NT!
 nd_tib_narthang_press: "Расширение печати Нартанга" #NT!
 nd_tib_narthang_press_desc: "Распространение гравюры на дереве из Нартанга и Дерге на десятки монастырей по всему плато, создав сеть научного производства, не имеющую аналогов в Центральной Азии." #NT!
 nd_tib_plateau_horsemen: "Тактика кавалерии плато" #NT!
 nd_tib_plateau_horsemen_desc: "Усовершенствование тактики кавалерии с учетом уникальных требований ведения войны на высоте: более легкое снаряжение, лошади, выведенные для воздуха, и упор на быстрое перемещение на огромные расстояния." #NT!
 nd_tib_luxury_exports: "Торговля шелком и мускусом" #NT!
 nd_tib_luxury_exports_desc: "Положение Тибета на путях между Китаем и Южной Азией позволяет вести прибыльную торговлю предметами роскоши: через горные перевалы текут мускус, шелк, лекарственные травы и драгоценные металлы." #NT!
 nd_tib_monastic_taxation: "Монастырское налогообложение" #NT!
 nd_tib_monastic_taxation_desc: "Систематизация монастырских владений и их налогообложение обеспечивает правительству Ганден Пходранга надежную доходную базу, поскольку монастыри служат одновременно землевладельцами, учебными заведениями и сборщиками налогов." #NT!
 nd_tib_modern_reforms: "Плато Модернизации" #NT!
 nd_tib_modern_reforms_desc: "Попытки модернизировать тибетские институты: внедрение новых административных методов, расширение образования и взаимодействие с более широким миром при сохранении уникальной культурной самобытности плато." #NT!
 nd_tib_standing_army: "Тибетская постоянная армия" #NT!
 nd_tib_standing_army_desc: "Создание первой профессиональной постоянной армии Тибета, заменив монашеские наборы и племенную кавалерию обученными, дисциплинированными солдатами, оснащенными современным оружием." #NT!
 nd_tib_communal_traditions: "Общинные земельные традиции" #NT!
 nd_tib_communal_traditions_desc: "Общинная практика землепользования Тибета и полиандрические семейные структуры, которые стабилизируют численность населения и обеспечивают устойчивое использование ограниченных сельскохозяйственных ресурсов плато." #NT!
 nd_tib_dharma_preservation: "Сохранение Дхармы" #NT!
 nd_tib_dharma_preservation_desc: "Систематические усилия по сохранению и расширению тибетской буддийской науки: копирование текстов, подготовка ученых и поддержание монастырских университетов, которые на протяжении веков служили хранилищами знаний." #NT!
 nd_tib_plateau_trade_network: "Торговая сеть Плато" #NT!
 nd_tib_plateau_trade_network_desc: "Развитие горной торговой системы Тибета: соединение Лхасы с Калькуттой, Катманду, Пекином и Шелковым путем посредством сети караванов, торговых постов и установленных коммерческих отношений." #NT!
 a_nd_tib_dob_dob: "Доб-доб" #NT!
 a_nd_tib_dob_dob_desc: "Доб-доб, монахи-воины из великих монастырей Тибета, — грозные бойцы, сочетающие в себе религиозный пыл с физическим мастерством. Вооруженные посохами и пращами, они патрулируют монастырские территории и формируют ударную пехоту во время войны." #NT!
 a_nd_tib_khampa_horsemen: "Кхампа Всадники" #NT!
 a_nd_tib_khampa_horsemen_desc: "Конные воины Кхама рождаются в седлах. Эти свирепые кавалеристы, вооруженные мечами, луками и фитильными ружьями, являются опытными налетчиками, знающими каждый горный перевал и долину восточного Тибета." #NT!
 a_nd_tib_garrison_monks: "Гарнизонные монахи" #NT!
 a_nd_tib_garrison_monks_desc: "Дисциплинированные солдаты-монахи, обученные защищать монастыри-крепости дзонг. Сочетая религиозные убеждения с военной подготовкой, они образуют постоянный гарнизон тибетского государства." #NT!
 a_nd_tib_plateau_riders: "Всадники плато" #NT!
 a_nd_tib_plateau_riders_desc: "Элитная высотная кавалерия, оснащенная более легким оружием и верховыми лошадьми, выведенными для разреженного воздуха плато. Быстрые и ловкие, они превосходно справляются с фланговыми маневрами в обширной тибетской степи." #NT!
 a_nd_tib_regulars: "Тибетские регулярные посетители" #NT!
 a_nd_tib_regulars_desc: "Профессиональные солдаты первой регулярной армии Тибета, обученные современной военной дисциплине, сохраняющие при этом опыт ведения войны в горах, который всегда был величайшей защитой плато." #NT!
 nd_tib_dzong: "Дзонг" #NT!
 nd_tib_dzong_desc: "Массивная крепость-монастырь, служащая военным оплотом, административным центром и религиозным комплексом. Построенный на внушительных высотах с толстыми каменными стенами, дзонг является основой тибетского территориального контроля." #NT!
 nd_tib_tea_horse_post: "Торговый пост Чайная Лошадь" #NT!
 nd_tib_tea_horse_post_desc: "Караванная станция на древней Чайно-Хорсской дороге, где тибетских лошадей, соль и шерсть обменивают на китайский чай, шелк и промышленные товары. Эти посты поддерживают коммерческую жизнь плато." #NT!
 nd_tib_mentsekhang: "Менцеханг" #NT!
 nd_tib_mentsekhang_desc: "В медицинском колледже преподают «Сова Ригпа: тибетская наука исцеления». Обученные здесь врачи владеют четырьмя тантрами, лечат недуги с помощью трав, минеральных соединений и духовной практики." #NT!
 nd_tib_printing_house: "Типография" #NT!
 nd_tib_printing_house_desc: "Монастырская мастерская по гравюре на дереве, где мастера вырезают Священные Писания на постоянных блоках. Одна типография может хранить десятки тысяч блоков, печатая буддийские тексты для распространения по всему плато." #NT!
 nd_tib_butter_workshop: "Мастерская масляных ламп" #NT!
 nd_tib_butter_workshop_desc: "Установка по переработке масла яка в ритуальные лампы, освещающие каждый монастырь на плато, а также масляный чай, который поддерживает как монахов, так и кочевников в разреженном холодном воздухе." #NT!
 nd_tib_salt_warehouse: "Склад соли" #NT!
 nd_tib_salt_warehouse_desc: "Объект для хранения и переработки соли, добываемой из высокогорных соленых озер Тибета, одного из самых ценных торговых товаров на плато." #NT!
 nd_tib_choyon_temple: "Храм Чойон" #NT!
 nd_tib_choyon_temple_desc: "Грандиозный храмовый комплекс, посвященный отношениям покровителя и жреца, которые связывают Тибет с его монгольскими союзниками, служащий центром дипломатических церемоний и культурного обмена." #NT!
 nd_tib_wool_workshop: "Мастерская хайлендской шерсти" #NT!
 nd_tib_wool_workshop_desc: "Текстильная мастерская, перерабатывающая тонкую шерсть тибетских яков и овец в ткань, ценящуюся во всей Азии за ее теплоту и долговечность." #NT!
 nd_tib_potala_shrine: "Храм Потала" #NT!
 nd_tib_potala_shrine_desc: "Священный религиозный комплекс, вдохновленный архитектурным величием дворца Потала, служащий центром буддийского поклонения, художественного покровительства и культурного престижа." #NT!
 nd_tib_communal_granary: "Коммунальное зернохранилище" #NT!
 nd_tib_communal_granary_desc: "Общественное хранилище продуктов питания, соответствующее древней тибетской традиции коллективного управления ресурсами, обеспечивающее выживание в суровые зимы на самом высоком плато на Земле." #NT!
 nd_tib_dzong_upkeep: "Обслуживание Дзонга" #NT!
 nd_tib_dzong_upkeep_desc: "Продолжается ремонт и благоустройство массивных каменных стен и деревянных конструкций крепости-монастыря." #NT!
 nd_tib_caravan_trade: "Караван Трейд" #NT!
 nd_tib_caravan_trade_desc: "Обмен чаем и лошадьми через высокогорную факторию." #NT!
 nd_tib_medical_herbs: "Сбор медицинских трав" #NT!
 nd_tib_medical_herbs_desc: "Сбор и подготовка высокогорных лекарственных трав в соответствии с традицией Четырех Тантр, подкрепленная научными текстами, льняными повязками и масляными лампами для работы колледжа." #NT!
 nd_tib_printing_materials: "Печать на дереве" #NT!
 nd_tib_printing_materials_desc: "Из бумаги и дерева вырезаются постоянные деревянные блоки, из которых создаются буддийские писания и научные тексты для распространения по всему плато." #NT!
 nd_tib_butter_processing: "Переработка сливочного масла" #NT!
 nd_tib_butter_processing_desc: "Молоко яков сбивают в масло, переводят в осветленную форму и перерабатывают в топливо для ламп: получают продукцию, эквивалентную пчелиному воску, используемую в монастырях и продаваемую по всему плато." #NT!
 nd_tib_salt_processing: "Обработка соли" #NT!
 nd_tib_salt_processing_desc: "Добыча и очистка соли из высокогорных озер Тибетского нагорья." #NT!
 nd_tib_ritual_offerings: "Ритуальные подношения" #NT!
 nd_tib_ritual_offerings_desc: "Благовония и шелк употреблялись в сложных церемониях дипломатической традиции покровителя-жреца." #NT!
 nd_tib_wool_weaving: "Шерстяное Ткачество" #NT!
 nd_tib_wool_weaving_desc: "Из шерсти горных районов и натуральных красителей ткут прочную тибетскую ткань, которая ценится во всей Азии." #NT!
 nd_tib_shrine_offerings: "Подношения святыни" #NT!
 nd_tib_shrine_offerings_desc: "Благовония и серебряные подношения, поддерживающие религиозную деятельность священного комплекса." #NT!
 nd_tib_highland_storage: "Хайленд Склад" #NT!
 nd_tib_highland_storage_desc: "Зерно и продукты животноводства сохраняются для населения в суровые зимы Тибета." #NT!
 levy_nd_tib_garrison_monks: "Гарнизонный монах Леви" #NT!
 levy_nd_tib_garrison_monks_desc: "Дисциплинированные солдаты-монахи призвали из крепостей дзонг защищать плато." #NT!
 levy_nd_tib_dob_dob: "Доб-доб Леви" #NT!
 levy_nd_tib_dob_dob_desc: "Монахи-воины, собранные из великих монастырей, служили ударной пехотой." #NT!
 nd_tib_formed_tt: "Тибет был образован" #NT!
 nd_tib_path_a_tt: "Выбрал Ганден Пходранг" #NT!
 nd_tib_path_b_tt: "Выбрать путь королей Дхармы" #NT!
  
  # Bureaucracy authority: granted post-formation 
 AUTO_MODIFIER_NAME_nd_tib_bureaucracy_authority: "Власть Ганден Пходранга" #NT!
 AUTO_MODIFIER_DESC_nd_tib_bureaucracy_authority: "В результате реорганизации плато Пятым Далай-ламой возникло многоуровневое правительство, состоящее из советов, секретариатов и дзонг-магистратов. Трон может учредить до двух великих тибетских бюрократий в дополнение к тем, которые проживают в Лхасе, выбирая, какие институты будут определять единую теократию." #NT!
  
  # Bureaucracies 
 tib_kashag_bureaucracy: "Кашагский совет" #NT!
 tib_kashag_bureaucracy_desc: "Кодифицированный реформами Цяньлуна 1751 года после убийства регента-мирянина Гьюрме Намгьяла, Кашаг посадил четырех министров-калон в одной палате: трех дворян-мирян, взятых из великих домов Лхасы (Лхалу, Юток, Пхункханг), и одного монаха-калона, назначенного Далай-ламой. Ни один министр не мог действовать без согласия других. Кашаг был империей бумажной работы, которая двигала повседневную деятельность на плато и оказалась самым стабильным институтом, построенным Тибетом, но он навсегда внедрил светскую аристократию в Ганден Пходранг." #NT!
  
 tib_yiktsang_bureaucracy: "Икцангский духовный секретариат" #NT!
 tib_yiktsang_bureaucracy_desc: "Параллельный кабинет четырех трунгьикченмо, главных монахов-секретарей, которые решали все вопросы, касающиеся монастырей: рукоположения, доктринальные споры, монашеские владения, проверка лабранга Далай-ламы и назначение дзонгпонов в монашеские дзонги. Отражая Кашаг в каждой префектуре, Йикцанг превратил Ганден Пходранг в буквальное двойное управление и сделал духовенство структурно незаменимым для каждого государственного акта." #NT!
  
 tib_densa_sum_bureaucracy: "Денса Сум: Три столпа" #NT!
 tib_densa_sum_bureaucracy_desc: "Три великих монастыря гелугпа на равнине Лхасы: Сера (основан в 1419 году Сакья Еше), Дрепунг (1416 год Джамьянгом Чодже, крупнейший монастырь в мире, насчитывающий более десяти тысяч монахов) и Ганден (1409 год Цонкапа, резиденция Ганден Трипа). Их настоятели могли накладывать вето на назначения регентства, а их представители заседали в национальном собрании Цонгду. Во время переворота Вангчук Шатры в 1862 году именно монахи Дрепунг двинулись на Поталу. «Три столпа» сделали тибетский буддизм государственно-политической силой, а не просто религией." #NT!
  
 tib_mi_tser_bureaucracy: "Система усадьбы Ми-цер" #NT!
 tib_mi_tser_bureaucracy_desc: "Доходные поместья плато были разделены на три категории: шунг-гю (правительственные поместья, управляемые подданными цонгпа), чёджи (монашеские поместья, поддерживающие определенных тулку) и герба (наследственные дворянские поместья великих домов Лхасы). Каждое сословие несло обязательства по у-лагу (принудительной барщине), ца-тану (армейскому продовольствию) и производству-выдаче. Ми-цер (буквально «человеческая собственность») был обязан трудом тому землевладельцу, который контролировал их родную деревню. Система сохраняла платежеспособность дворянства и снабжение армии, но привязывала крестьянство к месту их рождения наследственными обязательствами." #NT!
  
 tib_dzongpon_bureaucracy: "Магистратура Дзонгпон" #NT!
 tib_dzongpon_bureaucracy_desc: "Окружные магистраты пятидесяти трех крепостей дзонг, которые закрепляли власть Ганден Пходранга на всем плато, от Шигадзе и Гьянце в Цанге до Чамдо и Маркхама в Кхаме. Каждый дзонг управлялся парами: один светский дзонгпон из дворянского реестра Це-ика, один монах-дзонгпон из списка Йикцанг, оба сменялись на трехлетний срок, чтобы ни один мировой судья не мог пустить постоянные местные корни. В дзонге располагались зернохранилище, барщинный регистр, сбор ополчения и местный суд." #NT!
  
 tib_monlam_chenmo_bureaucracy: "Великий молитвенный фестиваль Монлам Ченмо" #NT!
 tib_monlam_chenmo_bureaucracy_desc: "Великий молитвенный фестиваль, основанный Цонкапой в 1409 году, стал центральным ритуалом государства Ганден Пходранг. На двадцать один день, начиная с четвертого дня первого лунного месяца, мирская администрация города приостановила свою деятельность, и настоятель Дрепунг Шарце занял должность цогчен шал-нго, фестивального магистрата, с полицейской властью над Лхасой и правом штрафовать, высечь или изгнать любого жителя. Двадцать тысяч монахов собрались в районе Джоканг, чтобы читать, обсуждать и обсуждать великий образ Майтрейи. Ежегодно фестиваль демонстрировал единство дхармы и государства всему населению." #NT!
  
  # ===== DESTINY TREE ===== 
 nd_tib_destiny: "Судьба Тибета" #NT!
 nd_tib_destiny_desc: "Плато уже объединялось дважды, причем противоположными способами. Ценпо Ярлунг сделал это с помощью кавалерии и договора, удерживая коридор Хэси и взяв дань из Чанъаня. Иерархи гелуг поступали так с монастырями и магистратами, управляя из Лхасы вообще без царя. Оба все еще доступны. Выбор заключается в том, с каким Тибетом миру придется иметь дело." #NT!
 nd_tib_dest_lhasa_settlement: "Поселение Лхаса" #NT!
 nd_tib_dest_lhasa_settlement_desc: "В 1642 году Пятый Далай-лама стал правителем Тибета, а орден Гелуг стал самим государством. Лхаса и Шигадзе, резиденции двух великих иерархов, переданы под одну администрацию, а межконфессиональные войны, охватившие плато на протяжении трех столетий, разрешаются путем назначения одной секты правительством." #NT!
 nd_tib_dest_dzong_magistracy: "Магистратура Дзонг" #NT!
 nd_tib_dest_dzong_magistracy_desc: "Пятьдесят три района-крепости несут власть Ганден Пходранга на краях плато. В каждом дзонге есть зернохранилище, барщинный регистр, сбор ополчения и суд, и каждый управляется парой назначений (один мировой судья, один монах), которые сменяются каждые три года, чтобы ни один судья не имел местных корней." #NT!
 nd_tib_dest_monlam_chenmo: "Великий молитвенный праздник" #NT!
 nd_tib_dest_monlam_chenmo_desc: "Ежегодно на двадцать один день мирская администрация Лхасы приостанавливается, и городом управляет настоятель Дрепунга, наделенный полномочиями штрафовать, пореть и изгонять. Двадцать тысяч монахов заполняют территорию Джоканг. Цонкапа основал его в 1409 году как фестиваль; Ганден Пходранг хранит его как ежегодное доказательство того, что дхарма и государство — это одно и то же." #NT!
 nd_tib_dest_tsenpo_restored: "Ценпо восстановлено" #NT!
 nd_tib_dest_tsenpo_restored_desc: "В Тибете появились короли до того, как появились настоятели. Династия Ярлунгов правила из Лхасы с присяжной аристократией и кавалерийской армией, а монастыри служили короне, а не заменяли ее. Восстановление этой короны означает, что воинственные кланы плато снова подчинятся трону, и что трон намерен использовать их." #NT!
 nd_tib_dest_plateau_marches: "Плато Марш" #NT!
 nd_tib_dest_plateau_marches_desc: "Гималайские перевалы — это ворота империи: Ладакх на западе, непальские долины на юге. Старая империя держала их постоянными гарнизонами и относилась к горам как к границе, которой нужно было управлять, а не как к стене, за которой можно было спрятаться." #NT!
 nd_tib_dest_bod_chen_po: "Бод Чен По" #NT!
 nd_tib_dest_bod_chen_po_desc: "Великий Тибет, как называла его Танская канцелярия. Между 786 и 848 годами ценпо полностью удерживало коридор Хэси, отрезав Китай от Центральной Азии и обложив налогом всю торговлю шелком в Шачжоу и Ганьчжоу. В 763 году тибетская армия взяла Чанъань и поставила на престол своего императора. Эта империя восстанавливается." #NT!
 nd_tib.10.t: "Вопрос о плато" #NT!
 nd_tib.10.d: "Министры выразили это прямо. Тибетом можно управлять как церковью или королевством, и в обоих случаях нужны разные люди на одних и тех же постах. Аббаты хотят, чтобы дзонг был укомплектован монахами, а доходы передавались великим молитвенным домам. Лорды Кхама и Нгари хотят провести ценпо, сбор и вернуть старую границу. Задержка не благоприятствует ни тому, ни другому." #NT!
 nd_tib.10.a: "Плато выберет свою дорогу" #NT!
 nd_tib.11.t: "Одна секта, одно государство" #NT!
 nd_tib.11.d: "Иерархи школы гелуг в Лхасе и настоятели Шигадзе договорились об условиях, и соглашение состоит в том, что никаких условий нет: правят желтые шляпы. Три столетия межконфессиональной войны закончились не компромиссом, а соглашением, и монастыри, которые сопротивлялись, передавали свои владения тем, кто этого не делал. На плато впервые на памяти живущих тихо." #NT!
 nd_tib.11.a: "Ганден Пходранг управляет" #NT!
 nd_tib.12.t: "Крепости королевства" #NT!
 nd_tib.12.d: "Дзонги готовы: зернохранилище, регистр, сбор и суд под одной крышей, от Гьянце в Цанге до Чамдо на дороге Кхам. Осталось решить, кто в них сядет. В Икцанге достаточно монахов, чтобы занять каждый пост; В дворянском реестре Це-йика есть люди, уже знающие округа и живущие в них семьи." #NT!
 nd_tib.12.a: "Парные назначения, монах и мирянин, меняются каждые три года." #NT!
 nd_tib.12.b: "Соберите их из дворянского реестра: они знают свое дело." #NT!
 nd_tib.13.t: "Двадцать тысяч монахов" #NT!
 nd_tib.13.d: "Монлам Ченмо перерос район Джоканг. Постоянный павильон вместит все собрание и сделает власть фестиваля над Лхасой вопросом архитектуры, а не обычая. Есть и другая точка зрения: что сектантский вопрос так и не был по-настоящему решен, и момент, чтобы решить его декретом, настал сейчас, пока желтые шляпы занимают все достойные должности." #NT!
 nd_tib.13.a: "Постройте павильон: пусть фестиваль говорит за государство" #NT!
 nd_tib.13.b: "Урегулируйте секты указом, пока офисы наши." #NT!
 nd_tib.14.t: "Корона, вышедшая из хранения" #NT!
 nd_tib.14.d: "Регалии королей Ярлунгов уже шестьсот лет хранятся в монастырской кладовой и занесены в каталог как реликвия. Его выносят, и кланы Кхама, которые никогда не поклонились бы настоятелю, приезжают в Лхасу, чтобы поклясться. Настоятелям говорят, что корона защищает дхарму. Все присутствующие понимают, что порядок старшинства изменился." #NT!
 nd_tib.14.a: "Ценпо коронован" #NT!
 nd_tib.15.t: "Ворота гор" #NT!
 nd_tib.15.d: "Ладакх и непальские долины взяты, а вместе с ними и перевалы. Удержание границы так долго — это вопрос метода: постоянные каменные гарнизоны, питаемые и оплачиваемые из Лхасы, или конные кланы Кхама, едущие по ней так, как они всегда ездили, дешевле и быстрее и подотчетные своим собственным вождям." #NT!
 nd_tib.15.a: "Гарнизон перевалов в камне" #NT!
 nd_tib.15.b: "Поднимите кланы Кхам и позвольте им оседлать границу." #NT!
 nd_tib.16.t: "Великий Тибет" #NT!
 nd_tib.16.d: "Шачжоу и Ганьчжоу наши, а вместе с ними и коридор, по которому проходят все караваны между Китаем и западом. Танская канцелярия называла это государство Бодченпо и вела с ним переговоры на равных. Коридор можно удерживать так, как его держала старая империя, с гарнизонами и табунами лошадей, что предполагает, или его можно просто облагать налогом, что обходится дешевле и меньше оскорбляет." #NT!
 nd_tib.16.a: "Держи, как держал ценпо." #NT!
 nd_tib.16.b: "Возьмите пошлину и оставьте караванам покой" #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_dzong_network: "Сеть Дзонг" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_dzong_network: "Парные мирские и монашеские магистраты сменяются в пятидесяти трех крепостных округах сроком на три года. Ни один магистрат не имеет местных корней, каждый район поддерживает свои зернохранилища и сборную в рабочем состоянии, а народами плато управляют те же руки, которые их записывают." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_lay_magistracy: "Мирская магистратура" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_lay_magistracy: "В дзонг входят представители дворянского реестра Це-йика. Большие дома получают офисы, офисы получают людей, которые уже знают районы, а торговля, которая проходит через города-крепости, облагается налогом со стороны людей, заинтересованных в ее продолжении." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_great_prayer: "Великая Молитва" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_great_prayer: "Постоянный павильон вмещает все собрание Монлама. Ежегодно в течение трех недель судья фестиваля полностью управляет Лхасой, и единство дхармы и государства демонстрируется перед всем населением, а не обсуждается на совете." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_gelug_primacy: "Первенство гелуг" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_gelug_primacy: "Сектантский вопрос закрыт декретом, а желтые шляпы занимают все достойные должности. Конкурирующие поместья передаются, конкурирующие линии признаются ветвями, а религиозная карта плато перерисовывается в соответствии с административной картой." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_marchlands: "Марчлендс" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_marchlands: "Каменные гарнизоны на гималайских перевалах, питаемые и оплачиваемые из Лхасы. Границей управляют, а не просто наблюдают, и армия, действующая вдоль нее, никогда не бывает далеко от поста снабжения." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_khampa_levies: "Кхампа Левис" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_khampa_levies: "Конные кланы Кхама ездят по границе, как всегда, подотчетны своим вождям и собираются по призыву, а не по зарплате. Дешевле, чем гарнизоны, быстрее, чем гарнизоны, и стада, которые делают это возможным, теперь являются заботой короны." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_great_tibet: "Бод Чен По" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_great_tibet: "Коридор Хэси удерживается в силе, поскольку его удерживали ценпо: гарнизоны в Шачжоу и Ганьчжоу пересаживаются за ними, и память о каждой осаде, которую когда-либо проводили армии плато, вписана в то, как они проводят следующую." #NT!
 STATIC_MODIFIER_NAME_nd_tib_dest_silk_road_tolls: "Плата за проезд в коридоре" #NT!
 STATIC_MODIFIER_DESC_nd_tib_dest_silk_road_tolls: "Караваны облагаются налогом, а не командуются. Шачжоу и Ганьчжоу сохраняют своих торговцев, их торговцы сохраняют свои маршруты, а плато забирает долю всего, что движется между Китаем и западом, не платя за гарнизоны, которые потребуются для его прямого удержания." #NT!
  
 nd_tib_monlam_pavilion: "Павильон Монлам" #NT!
 nd_tib_monlam_pavilion_desc: "Постоянный зал для Великого молитвенного фестиваля, воздвигнутый рядом с Джоканом, чтобы двадцати тысячам монахов, приезжающим каждую весну, больше не приходилось заполнять улицы. Вне праздничных недель здесь располагаются дворы для дискуссий и благотворительный дом, а настоятели, управляющие обоими, — это те же самые люди, которые управляют городом три недели в году." #NT!
 nd_tib_tsenpo_citadel: "Цитадель Ценпо" #NT!
 nd_tib_tsenpo_citadel_desc: "Военная столица королей Ярлунгов, перестроенная из камня: площадка для сбора, арсенал, загоны для ремонта и казармы королевской гвардии внутри одной стены. Старая империя проводила свои кампании из подобных мест, и армия, которая собирается здесь, накормлена и укомплектована лошадьми, прежде чем достигнет границы." #NT!
  
 nd_tib_monlam_provisioning: "Фестивальное обеспечение" #NT!
 nd_tib_monlam_provisioning_desc: "Благовония для светильников приношения, масло и мясо для двадцати тысяч гостей, парча для изображений процессии и телеги пчелиного воска. Милостыня покупает на три недели удвоение населения Лхасы и покупает на год вперед." #NT!
 nd_tib_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_tib_citadel_garrison_desc: "Оружие из кузниц плато, кони и мясо королевских стад, а также войлок и шерсть, достаточные для того, чтобы обеспечить жизнь стоящему стражу во время тибетской зимы на высоте." #NT!
