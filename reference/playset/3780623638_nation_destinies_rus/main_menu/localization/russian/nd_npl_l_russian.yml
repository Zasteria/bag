l_russian:
 STATIC_MODIFIER_NAME_nd_gorkhali_conquest: "Завоевание Горхали" #NT!
 STATIC_MODIFIER_DESC_nd_gorkhali_conquest: "Воины Горкхи доказали, что в горах рождаются самые свирепые солдаты. С хукури в руках и гималайскими ветрами за спиной армии Горхали проносятся по долинам, побеждая всех, кто стоит перед ними." #NT!
 STATIC_MODIFIER_NAME_nd_valley_of_temples: "Долина храмов" #NT!
 STATIC_MODIFIER_DESC_nd_valley_of_temples: "Долина Катманду представляет собой живой музей божественной архитектуры. Мастера невари воздвигли пагоды к небу, а торговые пути, проходящие через эти священные места, несут богатства из Тибета в Индию." #NT!
 STATIC_MODIFIER_NAME_nd_unification_of_nepal: "Объединение Непала" #NT!
 STATIC_MODIFIER_DESC_nd_unification_of_nepal: "Разрозненные горные королевства были объединены в одну нацию железной волей династии Шаха. Двенадцать округов подчиняются одному престолу, а управление Непалом осуществляется из единого центра." #NT!
 STATIC_MODIFIER_NAME_nd_himalayan_bastion: "Гималайский бастион" #NT!
 STATIC_MODIFIER_DESC_nd_himalayan_bastion: "Сами горы – наша крепость. Каждый перевал — смертельная ловушка, каждый гребень — вал. Иностранные армии, которые маршируют в эти холмы, обнаруживают, что местность сражается за Непал, прежде чем выхватывается хоть один клинок Горхали." #NT!
 STATIC_MODIFIER_NAME_nd_gurkha_renown: "Слава гуркхов" #NT!
 STATIC_MODIFIER_DESC_nd_gurkha_renown: "Храбрость солдата-гуркха стала легендой. Их дисциплина под огнем, их бесстрашные атаки с обнаженными хукури и их неутомимая выносливость в самых суровых условиях заслужили уважение во всем мире." #NT!
 nd_npl.1.t: "Королевство Непал" #NT!
 nd_npl.1.d: "От заснеженных вершин Гималаев до дымящихся джунглей Тераи — новое королевство обретает форму. На протяжении веков холмы Непала укрывали десятки враждующих княжеств: королевства Байси и Чаубиси, три города-государства Малла в долине Катманду и бесчисленные мелкие владения, разбросанные по хребтам. Теперь они отвечают одной короне.\n\nВопрос перед нами не в том, выстоит ли Непал, сами горы гарантируют это, а в том, каким королевством оно станет. Воины Горкхи, объединившие эти холмы силой оружия, видят военную судьбу: Непал — непобедимая горная крепость, а его солдаты — ужас для каждого захватчика, осмелившегося пройти через перевалы. Но ремесленники и торговцы Долины невари видят другой путь: Непал как мост между цивилизациями, его храмы привлекают паломников, его мастерские производят искусство, которое может соперничать с любым искусством в Азии, его торговцы перевозят соль, шерсть и шелк по всему миру.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_npl.1.a: "Мы — Горхали: горы — наш меч и щит." #NT!
 nd_npl.1.b: "Долина Храмов станет жемчужиной Гималаев." #NT!
 nd_npl.2.t: "Объединение Непала" #NT!
 nd_npl.2.d: "25 сентября 1768 года, когда жители Катманду праздновали праздник Индра Джатры, армии Горкхи вошли в город. Король Маллы Джая Пракаш Малла скрылся в ночи, а Притхви Нараян Шах взошел на трон долины Катманду. В течение года пали Лалитпур и Бхактапур.\n\nМолодой король, унаследовавший в 1743 году крошечное горное княжество, провел двадцать пять лет в неустанной подготовке. Он заключал союзы, обучал своих солдат ведению боевых действий в горах, отрезал торговые пути Долины, чтобы заставить ее подчиниться голодом, и, наконец, нанес удар в момент религиозного праздника, когда защитники были отвлечены. Его Дибья Упадеш, «Божественный Совет», изложил политическую философию управления различными народами его нового королевства: Непал как сад множества цветов, объединенный под короной шаха.\n\nПятьдесят четыре горных царства теперь едины. Система Паджани ежегодно проверяет каждого чиновника. Земля Бирта дарует награду верным. Двенадцать округов, по четыре в каждом регионе, несут власть короля во все уголки королевства." #NT!
 nd_npl.2.a: "Непал теперь представляет собой одно королевство, от Мечи до Махакали." #NT!
 nd_npl.3.t: "Англо-непальская война" #NT!
 nd_npl.3.d: "Расширяющиеся границы Непала столкнулись с интересами Британской Ост-Индской компании. В 1814 году, после многих лет пограничных стычек и спорных территорий в Тераи, разразилась война. Компания выставляет армии численностью в тридцать тысяч человек, оснащенные современной артиллерией; Защитников Непала едва ли насчитывается восемь тысяч.\n\nНо гуркхи сражаются на своей территории. Генерал Амар Сингх Тапа с упорной решимостью удерживает западные перевалы. Британские колонны обнаруживают, что их пушки в горах бесполезны, их линии снабжения подвергаются нападкам гуркхов, их солдаты падают от болезней и истощения. Самому опытному британскому полководцу Дэвиду Охтерлони потребовалось два года и новаторская горная кампания, чтобы, наконец, вызвать решающую битву при Макванпуре.\n\nСугаульский договор обходится Непалу в треть его территории, но он приобретает нечто, возможно, более ценное. Британцы, сражавшиеся по всей Индии и по всему миру, называют гуркхов самой грозной пехотой, с которой они когда-либо сталкивались. Они никогда больше не попытаются завоевать Непал." #NT!
 nd_npl.3.a: "Наши горы – наша величайшая крепость. Давайте укрепим каждый перевал." #NT!
 nd_npl.3.b: "Мир увидел, на что способен гуркх. Пусть эта репутация станет нашим щитом." #NT!
 nd_npl.4.t: "Арнико и наследие пагоды" #NT!
 nd_npl.4.d: "В 1260 году молодой неварский архитектор Арнико возглавил делегацию из восьмидесяти ремесленников из долины Катманду ко двору Хубилай-хана в Китае. Император, прослышав о необычайном мастерстве мастеров-невари в обработке металлов и строительстве храмов, попросил их услуг по постройке золотой ступы в Тибете.\n\nГений Арнико превзошел первоначальный заказ. Он проектировал пагоды, отливал бронзовые статуи удивительной красоты и внедрял архитектурные приемы, которые изменили практику строительства по всей Империи Юань. Стиль многоярусных пагод, зародившийся на храмовых площадях Непала, теперь возвышается над буддийскими монастырями от Лхасы до Пекина. Сам Арнико стал управляющим императорских мануфактур: выдающаяся честь для иностранного ремесленника.\n\nНаследие сохраняется в каждой пагоде, украшающей горизонты Восточной Азии, что является свидетельством художественных традиций, взращенных в мастерских Патана и на храмовых площадях Бхактапура." #NT!
 nd_npl.4.a: "Наши мастера несут славу Непала в самые дальние уголки мира." #NT!
 nd_npl_khas_warriors: "Хас Воины" #NT!
 nd_npl_khas_warriors_desc: "Империя Кхас Малла на западе Непала произвела на свет свирепых воинов, которые совершали набеги до Тибета и долины Катманду между 12 и 14 веками." #NT!
 nd_npl_newari_architecture: "Архитектура Невари" #NT!
 nd_npl_newari_architecture_desc: "Неварцы долины Катманду развили отличительную архитектурную традицию многоярусных храмов-пагод, деревянных опор с замысловатой резьбой и построек из кирпича и дерева." #NT!
 nd_npl_mountain_dwellers: "Горные жители" #NT!
 nd_npl_mountain_dwellers_desc: "Жизнь в Гималайских холмах воспитывает выносливость. Армии, вторгающиеся на эти высоты, сталкиваются с истощением, высотной болезнью и непроходимой местностью, прежде чем когда-либо встретят непальского солдата." #NT!
 nd_npl_himalayan_herbs: "Гималайские травы" #NT!
 nd_npl_himalayan_herbs_desc: "В предгорьях Гималаев производят необычайное разнообразие лекарственных трав и растений, которыми веками торговали по всей Южной Азии." #NT!
 nd_npl_malla_governance: "Управление Маллы" #NT!
 nd_npl_malla_governance_desc: "Короли Малла разработали сложную административную систему управления тремя городами-государствами долины Катманду с кодифицированными законами и судебными традициями." #NT!
 nd_npl_trans_himalayan_trade: "Трансгималайская торговля" #NT!
 nd_npl_trans_himalayan_trade_desc: "На протяжении тысячелетий через гималайские перевалы проходили торговые пути, несущие соль и шерсть из Тибета на юг, а зерно и промышленные товары на север." #NT!
 nd_npl_patan_metalwork: "Патан Металлообработка" #NT!
 nd_npl_patan_metalwork_desc: "Город Патан, древняя столица Лалитпура, известен своими традициями металлообработки. Ремесленники Невара производят бронзовые скульптуры и религиозные предметы исключительного качества." #NT!
 nd_npl_arniko_legacy: "Наследие Арнико" #NT!
 nd_npl_arniko_legacy_desc: "Неварский архитектор XIII века Арнико перенес архитектурную традицию непальских пагод при дворе Юань, где она изменила практику строительства по всей Восточной Азии." #NT!
 nd_npl_guthi_system: "Система Гути" #NT!
 nd_npl_guthi_system_desc: "Гути — это общинные целевые фонды, которые финансируют храмы, фестивали и социальное обеспечение. Это учреждение укрепляет связи сообщества и обеспечивает непрерывность религиозной и культурной жизни." #NT!
 nd_npl_pashmina_trade: "Пашмина Трейд" #NT!
 nd_npl_pashmina_trade_desc: "Из тонкой шерсти гималайских горных коз ткут пашмину, которая ценится в Южной Азии и за ее пределами за ее теплоту и нежность." #NT!
 nd_npl_newar_guilds: "Неварские гильдии" #NT!
 nd_npl_newar_guilds_desc: "Общество неваров организовано вокруг профессиональных гильдий и кастовых групп, в которых работают мастера по металлу, плотники, художники и торговцы, каждый из которых специализируется на ремеслах, имеющих решающее значение для жизни в долине." #NT!
 nd_npl_durbar_squares: "Площади Дурбар" #NT!
 nd_npl_durbar_squares_desc: "Площади королевских дворцов в Катманду, Бхактапуре и Патане — это центры политической власти и художественных достижений, заполненные храмами, внутренними дворами и резными памятниками." #NT!
 nd_npl_mountain_fortifications: "Горные укрепления" #NT!
 nd_npl_mountain_fortifications_desc: "Горные перевалы и хребты Непала являются естественными оборонительными позициями. Их укрепление превращает и без того сложную местность в неприступные крепости." #NT!
 nd_npl_gorkhali_tradition: "Горхали Традиция" #NT!
 nd_npl_gorkhali_tradition_desc: "Солдаты королевства Горкха сочетают в себе выносливость в горах и жестокую дисциплину. Они сражаются с хукури в ближнем бою и знают каждый хребет и долину своей родины." #NT!
 nd_npl_salt_trade: "Соль Трейд" #NT!
 nd_npl_salt_trade_desc: "Древняя торговля тибетской солью проходит через горные коридоры Непала, а гималайские общины выступают в качестве посредников между скотоводческой экономикой Тибета и сельскохозяйственными равнинами Индии." #NT!
 nd_npl_malla_renaissance: "Малла Ренессанс" #NT!
 nd_npl_malla_renaissance_desc: "В более поздний период Малла произошел взрыв художественных достижений в долине Катманду: роспись свитков паубха, бронзовая скульптура и резьба по дереву достигли необыкновенных высот под королевским покровительством." #NT!
 nd_npl_baisi_chaubisi: "Королевства Байси-Шаубиси" #NT!
 nd_npl_baisi_chaubisi_desc: "До объединения Непал был разделен на королевства Байси (двадцать два) и Чаубиси (двадцать четыре): лоскутное одеяло горных княжеств, постоянно конкурирующих посредством союзов, интриг и войн." #NT!
 nd_npl_religious_syncretism: "Религиозный синкретизм" #NT!
 nd_npl_religious_syncretism_desc: "В долине Катманду индуизм и буддизм сосуществовали и переплетались на протяжении веков. Одним и тем же божествам поклоняются под разными именами, и храмы служат обеим традициям." #NT!
 nd_npl_khukuri_warriors: "Хукури Воины" #NT!
 nd_npl_khukuri_warriors_desc: "Изогнутый вперед хукури — это одновременно инструмент и оружие, которое носит каждый солдат Горхали. В ближнем бою его тяжелое рубящее лезвие разрушительно, а его устрашающая репутация опережает владельца." #NT!
 nd_npl_mountain_warfare: "Горная война" #NT!
 nd_npl_mountain_warfare_desc: "Столетия войн в горах сформировали особую непальскую военную доктрину: удерживать возвышенность, контролировать перевалы, беспокоить линии снабжения противника и сражаться только тогда, когда местность благоприятствует вам." #NT!
 nd_npl_gorkha_consolidation: "Объединение Горкхи" #NT!
 nd_npl_gorkha_consolidation_desc: "Династия Шаха Горкхи превращает маленькое горное королевство в централизованное государство, создавая военную и административную инфраструктуру, необходимую для объединения." #NT!
 nd_npl_pajani_system: "Система Паджани" #NT!
 nd_npl_pajani_system_desc: "Ежегодная система проверок Паджани гарантирует, что ни один чиновник не успокоится. Каждый год назначения пересматриваются, а гранты на землю подтверждаются или отзываются." #NT!
 nd_npl_birta_grants: "Бирта Гранты" #NT!
 nd_npl_birta_grants_desc: "Безналоговые гранты на землю Бирта вознаграждают за военную службу и административную лояльность, стимулируя расширение армии Горкхи без чрезмерного обременения населения." #NT!
 nd_npl_valley_commerce: "Долина коммерции" #NT!
 nd_npl_valley_commerce_desc: "Три бывших города-государства Малла в долине Катманду (Катманду, Патан и Бхактапур) остаются процветающими торговыми центрами единого королевства." #NT!
 nd_npl_gorkha_rifles: "Винтовки Горкха" #NT!
 nd_npl_gorkha_rifles_desc: "Внедрение современного огнестрельного оружия превращает пехоту Горхали в грозную силу, сочетающую европейские оружейные технологии с непревзойденными навыками ведения боя в горах." #NT!
 nd_npl_shah_unification: "Шахское объединение" #NT!
 nd_npl_shah_unification_desc: "Притхви Нараян Шах завоевывает долину Катманду в 1768 году, объединяя разбросанные горные королевства в Королевство Непал и устанавливая династию Шахов как правителей единого государства." #NT!
 nd_npl_divya_upadesh_admin: "Администрация Дивья Упадеша" #NT!
 nd_npl_divya_upadesh_admin_desc: "В книге Притхви Нараян Шаха «Дибья Упадеш», «Божественный совет», излагаются принципы управления разнообразными народами Непала, описывая королевство как сад множества цветов." #NT!
 nd_npl_yam_between_boulders: "Ям между двумя валунами" #NT!
 nd_npl_yam_between_boulders_desc: "Притхви Нараян Шах предупредил, что Непал — это ямс, зажатый между двумя валунами: Китаем на севере и Индией на юге. Выживание требует проницательной дипломатии и непробиваемой горной обороны." #NT!
 nd_npl_anglo_nepalese_war: "Англо-непальская война" #NT!
 nd_npl_anglo_nepalese_war_desc: "Война 1814–1816 годов с Британской Ост-Индской компанией стоила Непалу трети его территории, но принесла гуркхам репутацию самой жестокой пехоты в Азии." #NT!
 nd_npl_rana_modernization: "Модернизация Раны" #NT!
 nd_npl_rana_modernization_desc: "Премьер-министры Раны, которые доминируют в правительстве Непала с 1846 года, проводят военные реформы по образцу европейских армий, сохраняя при этом жестокую независимость Непала." #NT!
 nd_npl_himalayan_sovereignty: "Гималайский суверенитет" #NT!
 nd_npl_himalayan_sovereignty_desc: "Непал является одним из немногих азиатских государств, которые никогда не были колонизированы европейскими державами. Его горная география, военная репутация и дипломатическое мастерство сохраняют его независимость." #NT!
 nd_npl_mountain_kingdom: "Айдентика Горного королевства" #NT!
 nd_npl_mountain_kingdom_desc: "Разнообразные народы Непала (невар, магар, гурунг, лимбу, рай, чхетри и другие) формируют общую идентичность как граждан горного королевства." #NT!
 a_nd_npl_khas_warrior: "Хас Воин" #NT!
 a_nd_npl_khas_warrior_desc: "Свирепая горная пехота древней империи Кхас Малла, закаленная постоянными войнами на западных гималайских хребтах." #NT!
 a_nd_npl_gorkhali_sipahi: "Горхали Сипахи" #NT!
 a_nd_npl_gorkhali_sipahi_desc: "Дисциплинированные солдаты королевства Горкха, обученные ведению боевых действий в горах и вооруженные отличительными хукури наряду с обычным оружием." #NT!
 a_nd_npl_khukuri_skirmisher: "Хукури-застрельщик" #NT!
 a_nd_npl_khukuri_skirmisher_desc: "Рейдеры ближнего боя, использующие неразбериху горной войны, быстро приближаются своими тяжелыми клинками хукури, нанося разрушительный эффект." #NT!
 a_nd_npl_gorkha_rifleman: "Горкха-стрелок" #NT!
 a_nd_npl_gorkha_rifleman_desc: "Модернизированная горная пехота Непала, сочетающая в себе европейское огнестрельное оружие с выносливостью, дисциплиной и умением преодолевать препятствия, которые делают солдат гуркхов легендарными." #NT!
 levy_nd_npl_khas_warrior: "Хас Воин Леви" #NT!
 levy_nd_npl_khas_warrior_desc: "Горная пехота, набранная из горных общин Хас, свирепые воины, закаленные жизнью на западных гималайских хребтах." #NT!
 levy_nd_npl_khukuri_skirmisher: "Хукури-застрельщик Леви" #NT!
 levy_nd_npl_khukuri_skirmisher_desc: "Рейдеры ближнего боя, набранные из приграничных поселений Горхали, владеют тяжелыми изогнутыми вперед клинками хукури для разрушительного эффекта в горных засадах." #NT!
 nd_npl_pagoda_temple: "Храм-пагода" #NT!
 nd_npl_pagoda_temple_desc: "Многоярусный храм в характерном неварском архитектурном стиле с замысловатыми резными деревянными стойками, кирпичными стенами и позолоченными крышами, устремляющимися к небесам." #NT!
 nd_npl_himalayan_fortress: "Гималайская крепость" #NT!
 nd_npl_himalayan_fortress_desc: "Горная крепость, построенная для контроля стратегического перевала или хребта с использованием естественных оборонительных преимуществ пересеченной местности Непала." #NT!
 nd_npl_himalayan_sarai: "Гималайский Сарай" #NT!
 nd_npl_himalayan_sarai_desc: "Дом отдыха и торговый пост на трансгималайских торговых путях, обеспечивающий убежище и хранилище для караванов, перевозящих соль, шерсть и зерно между Тибетом и Индией." #NT!
 nd_npl_newari_workshop: "Мастерская Невари" #NT!
 nd_npl_newari_workshop_desc: "Мастерская по металлообработке и резьбе по дереву, в которой работают неварские ремесленники, производящие бронзовые скульптуры, религиозные предметы и архитектурные элементы исключительного мастерства." #NT!
 nd_npl_guthi_endowment: "Фонд Гути" #NT!
 nd_npl_guthi_endowment_desc: "Общественное трастовое учреждение, которое управляет земельными фондами для финансирования храмов, фестивалей и социального обеспечения. Система гути является основой общественной жизни неваров." #NT!
 nd_npl_durbar_palace: "Дворец Дурбар" #NT!
 nd_npl_durbar_palace_desc: "Королевский дворцовый комплекс в традициях Малла с внутренними дворами, залами для аудиенций и окружающими храмами, который служит политическим и культурным центром непальского города." #NT!
 nd_npl_gorkhali_barracks: "Горхали Казармы" #NT!
 nd_npl_gorkhali_barracks_desc: "Военный учебный центр, где горная пехота изучает боевые приемы, заставляющие солдат Горхали бояться всего субконтинента." #NT!
 nd_npl_temple_offerings: "Храмовые подношения" #NT!
 nd_npl_temple_offerings_desc: "Священные подношения красителей, благовоний и свечей из пчелиного воска, которые поддерживают ритуальную жизнь храмов-пагод Непала." #NT!
 nd_npl_garrison_supply: "Гарнизонное снабжение" #NT!
 nd_npl_garrison_supply_desc: "Камень, древесина и оружие, необходимые для защиты гималайской горной крепости от всех желающих." #NT!
 nd_npl_salt_wool_trade: "Торговля солью и шерстью" #NT!
 nd_npl_salt_wool_trade_desc: "Древняя торговля тибетской солью и шерстью, которую караваны яков перевозили через высокие гималайские перевалы." #NT!
 nd_npl_bronze_casting: "Бронзовое литье" #NT!
 nd_npl_bronze_casting_desc: "Неварские мастера по металлу в Патане используют медь и технику выплавляемого воска для отливки бронзовых скульптур и религиозных украшений, экспортируемых по всему буддийскому миру." #NT!
 nd_npl_endowment_upkeep: "Содержание пожертвований" #NT!
 nd_npl_endowment_upkeep_desc: "Зерно, ткань и благовония управлялись попечителями гути для поддержания общественных учреждений, фестивалей и религиозных обрядов." #NT!
 nd_npl_court_maintenance: "Обслуживание суда" #NT!
 nd_npl_court_maintenance_desc: "Шелк, красители и предметы роскоши, необходимые для поддержания великолепия королевского двора Непала." #NT!
 nd_npl_barracks_upkeep: "Содержание казарм" #NT!
 nd_npl_barracks_upkeep_desc: "Оружие, кожаное снаряжение и инструменты, необходимые для вооружения и содержания военного учебного центра в Горхали." #NT!
 nd_npl_herbal_trade: "Торговля гималайскими травами" #NT!
 nd_npl_herbal_trade_desc: "Сбор, сушка и торговля лекарственными травами и пигментными растениями с предгорий Гималаев, поставка лекарств и красителей по всей Южной Азии." #NT!
 nd_npl_pashmina_weaving: "Плетение Пашмины" #NT!
 nd_npl_pashmina_weaving_desc: "Из тонкой шерсти пашмины гималайских горных коз плетут шали и ткани, ценимые за теплоту и нежность." #NT!
 nd_npl_salt_processing: "Обработка гималайской соли" #NT!
 nd_npl_salt_processing_desc: "Тибетская каменная соль перерабатывается и переупаковывается для продажи на равнинах Индии, что является краеугольным камнем посреднической экономики Непала." #NT!
 nd_npl_paubha_painting: "Паубха Живопись" #NT!
 nd_npl_paubha_painting_desc: "Традиционная неварская религиозная роспись свитков, изображающая божеств и мандалы с замысловатыми деталями на ткани с использованием минеральных пигментов и сусального золота." #NT!
 nd_npl_arms_manufacturing: "Непальское производство оружия" #NT!
 nd_npl_arms_manufacturing_desc: "В местных кузницах производят оружие армии Горхали: от культовых хукури до мушкетов и пушек, адаптированных по европейским образцам." #NT!
 nd_npl_formed_tt: "был образован Непал." #NT!
 nd_npl_path_a_tt: "Выбрал завоевание Горхали" #NT!
 nd_npl_path_b_tt: "Выбрал Долину Храмов" #NT!
 nd_npl_destiny: "Судьба Непала" #NT!
 nd_npl_destiny_desc: "Было провозглашено Королевство Непал. Теперь начинается настоящее испытание: сможет ли это горное королевство создать прочную судьбу среди великих держав Азии? Достигните стабильности, чтобы заложить фундамент." #NT!
 nd_npl_dest_hills: "Покорение холмов" #NT!
 nd_npl_dest_hills_desc: "Меч Горхали должен сначала объединить предгорья. Захватите священную землю Лумбини и продвигайтесь на равнины Митхилы в Дарбханге. Создайте армию, достойную горных воинов." #NT!
 nd_npl_dest_plains: "Спуск на равнины" #NT!
 nd_npl_dest_plains_desc: "Когда холмы безопасны, взгляд Горхали обращен на юг, на богатую равнину Ганга. Патна и Лакхнау, резиденции древних империй, должны пасть в руки непальцев." #NT!
 nd_npl_dest_empire: "Империя Горхали" #NT!
 nd_npl_dest_empire_desc: "Окончательное видение: Гималайская империя, простирающаяся от крыши мира до священных вод Ганга. Возьмите Лхасу, священный город Тибета, и Варанаси, самый священный город индуизма." #NT!
 nd_npl_dest_trade: "Трансгималайская торговля" #NT!
 nd_npl_dest_trade_desc: "Контролируйте торговые пути, проходящие через горные перевалы. Захватите Шигадзе в Тибете, чтобы доминировать над северным подходом, и обеспечить потоки шелка через непальские рынки." #NT!
 nd_npl_dest_artisans: "Цветение ремесленника" #NT!
 nd_npl_dest_artisans_desc: "Мастерские Долины должны стать легендарными. Распространитесь в Паро в Бутане, используйте печатный станок и развивайте земли королевства, чтобы поддержать возрождение ремесла и обучения." #NT!
 nd_npl_dest_jewel: "Жемчужина Гималаев" #NT!
 nd_npl_dest_jewel_desc: "Долина Катманду станет культурной жемчужиной Азии. Распространите цивилизующее влияние Непала на Тхимпу, охватите глобальную торговлю и обеспечьте, чтобы ювелирные изделия Невари украшали рынки мира." #NT!
 nd_npl.5.t: "Горное королевство восстает" #NT!
 nd_npl.5.d: "Непал един: единая корона над страной снегов и храмов. Разрозненные княжества, когда-то враждовавшие между собой, объединились в королевство. От джунглей Тераи до высоких гималайских перевалов развевается флаг Непала.\n\nНо новорожденное королевство должно доказать свою ценность. Суд обсуждает дальнейший путь: будет ли Непал мечом или жемчужиной? Горная крепость, воины которой наводят ужас на империи, или сад храмов, ремесленники и торговцы которых вызывают восхищение всего мира?\n\nФундаменты заложены. Что им предстоит, зависит от того, какой выбор им предстоит сделать." #NT!
 nd_npl.5.a: "Непал выстоит: в этом мы клянемся горами." #NT!
 nd_npl.6.t: "Холмы Отправить" #NT!
 nd_npl.6.d: "Родина Будды в Лумбини теперь находится под суверенитетом Непала, и наши армии продвинулись через Тераи на равнины Митхилы. Священные места и плодородные низменности, которые когда-то питали конкурирующие королевства, теперь поддерживают военную машину Горхали.\n\nМестные заминдары и мелкие раджи преклоняют колени или бегут. Горные воины, которые когда-то сражались только среди хребтов и долин, доказали, что могут спуститься на равнины и победить и там. Каждое городище и переправа через реку подкрепляют урок: Горхали не останавливаются." #NT!
 nd_npl.6.a: "Предгорья наши. Теперь: равнины." #NT!
 nd_npl.7.t: "Покорение равнин" #NT!
 nd_npl.7.d: "Патна, древняя столица Магадхи, пала в руки Горхали. Далее следует Лакнау, резиденция навабов Авада. Горные воины, которые когда-то казались довольными своим высокогорным королевством, ворвались в сердце Ганги, как гималайская река, вышедшая из берегов.\n\nЗавоевания открывают выбор. Мы можем продвигаться быстро, охватывая Тераи и равнины агрессивными кампаниями, которые захватывают территорию прежде, чем наши враги успеют организоваться: скорость и насилие одерживают победу. Или мы можем продвигаться методично, обеспечивая линии снабжения через горные перевалы и привязывая завоеванные народы к непальскому правлению через лояльных вассалов и гарнизонные поселения." #NT!
 nd_npl.7.a: "Ударьте быстро: скорость теперь наше оружие." #NT!
 nd_npl.7.b: "Обезопасьте каждую долину, прежде чем переходить к следующей." #NT!
 nd_npl.8.t: "Империя Горхали" #NT!
 nd_npl.8.d: "От золотых крыш Лхасы до горящих гатов Варанаси флаг Непала развевается над землями, которые унижали всех завоевателей в истории. Дворец Потала и храм Вишванатх, самые святые места как буддизма, так и индуизма, признают суверенитет Непала.\n\nЭто не просто горное королевство. Это империя, которая возвышается над Гималаями, контролирует торговые пути между Индией и Центральной Азией, контролирует священную географию двух великих религий и выставляет на вооружение армии, закаленные в самой сложной местности на земле.\n\nТеперь вопрос в том, как управлять. Должен ли Непал получить дань завоевателя или впитать эти разнообразные народы в горную цивилизацию, превосходящую любую отдельную культуру?" #NT!
 nd_npl.8.a: "Побежденные узнают цену мощи Горхали." #NT!
 nd_npl.8.b: "Пусть каждый народ найдет свое место в горной империи." #NT!
 nd_npl.9.t: "Торговые пути открыты" #NT!
 nd_npl.9.d: "Непальские купцы теперь контролируют Шигадзе, крупный торговый город провинции Цанг в Тибете. Шелковые караваны из Китая и Индии проходят через рынки, где торговцы-невари взвешивают товары и устанавливают цены. Древняя мечта о Непале как о мосте между цивилизациями начинает обретать форму.\n\nСоль течет на юг, зерно течет на север, а шелк с обоих направлений встречается на рыночных площадях Катманду. Сараи вдоль горных перевалов кишат торговцами, говорящими на дюжине языков. Географическое положение Непала, которое когда-то рассматривалось как проклятие, зажатое между империями, оказалось величайшим достоянием королевства." #NT!
 nd_npl.9.a: "Горы не разделяются. Они соединяются." #NT!
 nd_npl.10.t: "Цветение ремесленника" #NT!
 nd_npl.10.d: "Мастерские Патана и Бхактапура вступили в золотой век. Бронзовые скульптуры необычайной изысканности, картины паубха, наполненные минеральными пигментами, и резьба по дереву невероятной сложности перетекают из мастерских Невари во дворы и храмы по всей Азии. В Долину прибыл печатный станок, а вместе с ним и взрывной рост религиозных текстов и художественных руководств.\n\nКультурное влияние Непала теперь распространяется на Бутан, где ремесленники, прошедшие обучение в Непале, строят храмы в стиле невари. Королевство должно решить, как поддерживать этот расцвет: посредством дисциплины гильдийного регулирования, обеспечения качества через традиции или через открытые рынки, привлекающие иностранных ремесленников и идеи." #NT!
 nd_npl.10.a: "Гильдии должны охранять стандарты ремесла невари." #NT!
 nd_npl.10.b: "Откройте пропуски. Пусть торговля принесет наше искусство миру." #NT!
 nd_npl.11.t: "Жемчужина Гималаев" #NT!
 nd_npl.11.d: "Долина Катманду стала тем, на что лишь намекнуло путешествие Арнико ко двору Юань: культурным и духовным центром гималайского мира. Ювелирные изделия невари, отлитые в мастерских, технологии которых совершенствовались на протяжении веков, продаются даже в Персии и Сиаме. Храмы в стиле пагод возвышаются от Бутана до Бенгалии, и все они ведут свою родословную от мастеров-строителей Патана.\n\nУченые приезжают учиться в учреждения, где индуистская философия и буддийская медитация преподаются бок о бок. Синкретизм Долины, когда-то являвшийся местной диковинкой, стал образцом религиозной гармонии, вызывающим восхищение далеко за пределами гор.\n\nНепал должен выбрать, как проецировать эту культурную мощь: через дипломатическое взаимодействие, открывающее двери по всему миру, или через углубление роли Долины как священного центра паломничества и обучения." #NT!
 nd_npl.11.a: "Пусть голос Непала будет услышан во всех дворах Азии." #NT!
 nd_npl.11.b: "Сама Долина будет местом назначения. Пусть мир придет к нам." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_terai_sweep: "Зачистка Тераи" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_terai_sweep: "Армии Горхали пронеслись через низменности Тераи с разрушительной скоростью, но быстрое расширение истощает казну королевства." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_mountain_descent: "Горный спуск" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_mountain_descent: "Продвижение Непала на равнины происходит методично, линии снабжения обеспечиваются через горные перевалы, а завоеванные территории связаны верными вассалами." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_nepal_ascendant: "Непал Асцендент" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_nepal_ascendant: "Империя Горхали – это реальность. Непал диктует условия с позиции абсолютной силы, его армии обогащаются за счет завоеванных трофеев." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_mountain_empire: "Горная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_mountain_empire: "Разнообразные народы империи Горхали втягиваются в общую горную цивилизацию, хотя устрашающая репутация Непала затрудняет дипломатию." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_artisan_guild: "Гильдия Долины" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_artisan_guild: "Гильдии Невара устанавливают строгие стандарты, благодаря которым мастерство Долины становится легендарным. Дешевый кредит поступает в мастерские, но сосредоточенность на ремеслах ослабила кавалерийскую армию королевства." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_silk_road: "Гималайский Шелковый путь" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_silk_road: "Непал находится на перекрестке цивилизаций, его рынки открыты для торговцев любой веры и нации. Горные перевалы несут богатство в обоих направлениях." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_himalayan_jewel: "Гималайская жемчужина" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_himalayan_jewel: "Культурная дипломатия Непала открывает двери по всей Азии. Послы и ученые доносят славу Долины до каждого двора, и новые идеи текут обратно по тем же каналам." #NT!
 STATIC_MODIFIER_NAME_nd_npl_dest_sacred_valley: "Священная долина" #NT!
 STATIC_MODIFIER_DESC_nd_npl_dest_sacred_valley: "Долина Катманду стала центром религиозной гармонии и обучения, где индуистские и буддийские традиции обогащают друг друга под четко организованным управлением." #NT!
 nd_npl_gorkhali_citadel: "Цитадель Горхали" #NT!
 nd_npl_gorkhali_citadel_desc: "Массивная горная цитадель, построенная для распространения власти Горхали на завоеванную территорию, с казармами, арсеналами и командными пунктами для постоянно расширяющихся армий империи." #NT!
 nd_npl_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_npl_citadel_garrison_desc: "Оружие, каменные укрепления и кожаное снаряжение, необходимые для поддержания цитадели Горхали как центра военной мощи." #NT!
 nd_npl_valley_academy: "Академия долины" #NT!
 nd_npl_valley_academy_desc: "Учебный центр, где изучаются и сохраняются индуистская философия, буддийская медитация и художественные традиции невари, привлекая ученых со всего гималайского мира." #NT!
 nd_npl_academy_upkeep: "Содержание Академии" #NT!
 nd_npl_academy_upkeep_desc: "Бумага, книги и свечи из пчелиного воска, которые поддерживают научную деятельность академии Долины и освещают ее читальные залы." #NT!
 npl_bhardari_sabha_bureaucracy: "Бхардари Сабха" #NT!
 npl_bhardari_sabha_bureaucracy_desc: "Бхардари был советом бхардаров: великих благородных домов (Панде, Тапа, Баснят, Чаутария), занимавших должности каджи и сардаров. После смерти Притхви Нараян-шаха в 1775 году совет эффективно управлял Непалом во время длительного меньшинства королей-шахов, уравновешивая трон против каджи. Бхардари Сабха — это объединение благородных домов; при хорошем уходе он стабилизирует преемственность, при пренебрежении он превращается в войну фракций." #NT!
  
 npl_mukhtiyari_bureaucracy: "Мухтияри" #NT!
 npl_mukhtiyari_bureaucracy_desc: "Мухтияр был всемогущим главным министром Непала, должность, учрежденная Бхимсеном Тапой с 1806 по 1837 год при короле Гирване Юддхе и короле-мальчике Раджендре. Держа в руках печать, армию и казну, мухтияр заменил совет бхардари и сосредоточил власть в одних руках: преднамеренный исполнительный противовес благородным группировкам. Поддерживаемый офис шаг за шагом двигает королевство; если его отпустить, он превращается в узкое место, и кадзи восстают против выскочки." #NT!
  
 npl_pajani_bureaucracy: "Паджани" #NT!
 npl_pajani_bureaucracy_desc: "Паджани представлял собой ежегодную кадровую аттестацию, на которой каждый гражданский и военный чиновник предстал перед судом для повторного назначения; срок полномочий истекает по умолчанию каждый год. Механизм времен шаха, позволяющий держать каджи, сардаров и сборщиков налогов подотчетными непосредственно трону: институциональная противоположность наследственной должности. Поддерживаемый паджани помогает чиновникам оставаться в тонусе; Если пренебречь, каждая позиция имеет свою цену, а отток покровительства разрушает преемственность в провинциях." #NT!
  
 npl_newar_guthi_bureaucracy: "Невар Гути" #NT!
 npl_newar_guthi_bureaucracy_desc: "Система гути — это институт неварских постоянных трастов, коллективно принадлежащих кланам или кастам, которые финансируют содержание храмов, праздничные шествия, ирригационные каналы и дома отдыха. Гути полностью владеют землей и управляют ею из поколения в поколение независимо от королевского покровительства. Короли Маллы правили по системе гути; Шахи унаследовали его и так и не смогли его ликвидировать. Постоянная гражданско-религиозная инфраструктура, параллельная государству: когда все в порядке, проводятся фестивали и течет ирригация; когда ими пренебрегают, попечители превращают пожертвования в частные феодальные владения." #NT!
  
 npl_jagir_tenure_bureaucracy: "Землевладение Джагира" #NT!
 npl_jagir_tenure_bureaucracy_desc: "Джагир заключался в передаче дохода от земельного участка солдату или офицеру вместо денежного вознаграждения; удерживается на срок службы и, в принципе, может быть отозвана в Паджани. Наряду с биртой (необлагаемыми налогом грантами брахманам, часто передаваемыми по наследству), Джагир обеспечивал финансовую основу армии Горхали, позволяя королевству выставлять большие силы без казны, которая могла бы им платить. Поддерживаемая армия собирается дешево; пренебрегая, джагирдары вытесняют крестьянство, а отзывные назначения превращаются в наследственное владение." #NT!
  
 AUTO_MODIFIER_NAME_nd_npl_bureaucracy_authority: "Бюрократическое учреждение" #NT!
 AUTO_MODIFIER_DESC_nd_npl_bureaucracy_authority: "Постоянные институты Непала (совет бхардари, печать мухтияра, ежегодный обзор паджани, неварские гути и система владения джагирами) кодифицированы как постоянные органы королевства. Королевство теперь может установить бюрократию." #NT!
