l_russian:
 STATIC_MODIFIER_NAME_nd_way_of_flower_wars: "Путь Цветочных Войн" #NT!
 STATIC_MODIFIER_DESC_nd_way_of_flower_wars: "Империя ацтеков усовершенствовала искусство ритуальной войны. Армии маршируют не просто для победы, но и для того, чтобы доказать превосходство Уицилопочтли над всеми соперниками. Каждое поле битвы становится священной землей, где воины зарабатывают славу, захватывая достойных противников." #NT!
 STATIC_MODIFIER_NAME_nd_pochteca_road: "Дорога Почтеки" #NT!
 STATIC_MODIFIER_DESC_nd_pochteca_road: "Торговцы дальней связи империи, почтака, были возведены в статус столпа государства. Их караваны доставляют какао, перья кетцаля и обсидиан в самые дальние уголки Мезоамерики, а их разведывательные сети служат глазами и ушами Хьюи Тлатоани." #NT!
 STATIC_MODIFIER_NAME_nd_cuachicqueh_ascendancy: "Господство Остриженных" #NT!
 STATIC_MODIFIER_DESC_nd_cuachicqueh_ascendancy: "Куачикке, воины, поклявшиеся никогда не делать ни шагу назад в бою, стали живым воплощением воинской доблести ацтеков. Их раскрашенные лица и бритые головы вселяют ужас в каждого врага." #NT!
 STATIC_MODIFIER_NAME_nd_codex_wisdom: "Мудрость Кодексов" #NT!
 STATIC_MODIFIER_DESC_nd_codex_wisdom: "Писцы империи начали систематические усилия по записи и сохранению знаний в нарисованных кодексах: от астрономических наблюдений до списков дани, от лекарственных растений до генеалогий правящих домов." #NT!
 STATIC_MODIFIER_NAME_nd_tribute_reform_centralist: "Централизованный сбор дани" #NT!
 STATIC_MODIFIER_DESC_nd_tribute_reform_centralist: "Сборщики имперской дани теперь подчиняются непосредственно Хьюи Тлатоани. Губернаторов провинций заменяют агенты центральной администрации, которые следят за тем, чтобы каждый тюк хлопка, каждая партия какао и каждая партия обсидиана попадали в казну Теночтитлана." #NT!
 STATIC_MODIFIER_NAME_nd_tribute_reform_federalist: "Федеративный Альтепетль Компакт" #NT!
 STATIC_MODIFIER_DESC_nd_tribute_reform_federalist: "Вместо того, чтобы навязывать все более жесткий централизованный контроль, империя формализовала автономию входящих в ее состав альтепетлей. Местные тлаток сохраняют свою власть в обмен на надежную дань и военную службу — система, которая порождает лояльность, а не негодование." #NT!
 nd_azt.1.t: "Империя ацтеков расцветает" #NT!
 nd_azt.1.d: "На болотах озера Тескоко мексиканцы построили величайшую империю, которую когда-либо видела Америка. Теночтитлан является жемчужиной королевства, простирающегося от моря до моря, его каналы и дороги являются свидетельством гениальности его народа. Теперь, когда Хьюи Тлатоани провозглашают господство над всей Мезоамерикой, империя должна определить свой путь. Будут ли цветочные войны продолжать формировать несокрушимую воинскую элиту, расширяя сферу влияния империи посредством военной славы? Или почтовые торговцы-шпионы станут инструментами нового типа власти, построенной на торговых путях, сетях дани и потоке какао, а не крови?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_azt.1.a: "Пусть Цветочные Войны бушуют вечно!" #NT!
 nd_azt.1.b: "Почтека станет основой империи." #NT!
 nd_azt.2.t: "Клятва остриженных" #NT!
 nd_azt.2.d: "Новое поколение куачике, Остриженные, завершило свои обряды инициации. Эти элитные воины бреют головы, оставляя только одну прядь над левым ухом, и красят одну половину лица в синий цвет, а другую половину в красный или желтый цвет. Они клянутся перед богами, что никогда не отступят от битвы, никогда не сделают ни шагу назад. На войне они всегда первыми вступают в бой с противником и последними покидают поле боя. Их клятва абсолютна: победа или смерть, без золотой середины. Другие воинские ордена, Рыцари-Ягуары и Воины-Орлы, рассматривают Куачике как высшее выражение воинской преданности. Их присутствие на поле битвы укрепляет решимость каждого воина в армии." #NT!
 nd_azt.2.a: "Их клятва связывает их и вдохновляет всех нас." #NT!
 nd_azt.3.t: "Великий проект Кодекса" #NT!
 nd_azt.3.d: "Писцы кальмекака предприняли амбициозный проект: систематическое объединение всех ацтекских знаний в обширную серию кодексов. Используя аматовую бумагу из коры и яркие минеральные пигменты, тлакуилоки, профессиональные художники-писцы, записывают накопленную мудрость империи. Альманахи Тоналаматля описывают священный календарь и его ритуалы. В списках дани перечислены точные обязательства каждого субъекта альтепетля. В кодексах трав описаны сотни лекарственных растений, их приготовление и использование — знания, которые могут соперничать со всем, что есть в Старом Свете. Астрономические записи отслеживают движение Венеры, Солнца и Луны с необычайной точностью. Это не просто ведение учета. Это создание интеллектуальной инфраструктуры, которая позволит передавать, обсуждать и расширять знания империи из поколения в поколение." #NT!
 nd_azt.3.a: "Знания – основа империи." #NT!
 nd_azt.4.t: "Реформа системы дани" #NT!
 nd_azt.4.d: "Система дани ацтеков разрослась: более четырехсот подданных альтепетлей регулярно платят дань Теночтитлану товарами, начиная от хлопчатобумажных мантий и костюмов воинов до какао-бобов, золотой пыли, перьев кетцаля и нефрита. Но система испытывает напряжение. Некоторые провинции сопротивляются своим оценкам, другие скрывают свое истинное богатство, а логистика сбора и хранения дани на таких расстояниях стала громоздкой. Советники Хьюи Тлатоани предлагают два пути вперед: ужесточить центральный контроль, заменив местных тлаток имперскими назначенцами, которые подчиняются непосредственно Теночтитлану, или официально заключить договор, который уважает местную автономию в обмен на надежную доставку дани и военные обязательства." #NT!
 nd_azt.4.a: "Вся дань течет в Теночтитлан." #NT!
 nd_azt.4.b: "Пусть альтепетли управляют собой, пока они платят." #NT!
 nd_azt.5.t: "Мезоамериканский Ренессанс" #NT!
 nd_azt.5.d: "Что-то примечательное происходит в Империи ацтеков. Школы кальсекака, когда-то ориентированные главным образом на подготовку жрецов и воинов, стали центрами более широких интеллектуальных исследований. Ученые науатля обсуждают философию, сочиняют лирическую поэзию в традициях Несауалькойотля и расширяют границы астрономических знаний. Ремесленники Теночтитлана производят изделия из золота, перья и резьбу по камню потрясающей сложности. Инженеры продолжают расширять и совершенствовать систему чинампа и гидравлическую инфраструктуру города. Этот расцвет культуры и знаний соперничает со всем, что создал Старый Свет, это возрождение, уникальное по своему мезоамериканскому характеру, опирающееся на тысячи лет накопленной цивилизации, основанной на традициях ольмеков, майя, тольтеков, а теперь и ацтеков." #NT!
 nd_azt.5.a: "Пятое Солнце освещает новую эпоху обучения." #NT!
 nd_azt_chinampa_system: "Чинампа Сельское хозяйство" #NT!
 nd_azt_chinampa_system_desc: "Плавучие сады Мексиканской долины дают несколько урожаев в год, обеспечивая пропитанием население, которое соперничает с любым населением в мире." #NT!
 nd_azt_atlatl_tradition: "Атлатльская традиция" #NT!
 nd_azt_atlatl_tradition_desc: "Копьеметание было определяющим оружием мезоамериканской войны на протяжении тысячелетий. Ацтекские застрельщики, владеющие атлатлями, обрушивают на своих врагов смертоносные снаряды из-за пределов ближнего боя." #NT!
 nd_azt_tlachtli_courts: "Площадки для игры в мяч Тлахтли" #NT!
 nd_azt_tlachtli_courts_desc: "Ритуальная игра с мячом выполняет как религиозные, так и политические функции, разрешая споры между городами и почитая богов посредством спортивных состязаний." #NT!
 nd_azt_pochteca_network: "Торговая сеть Почтека" #NT!
 nd_azt_pochteca_network_desc: "Почтеки-торговцы на дальние расстояния поддерживают торговые пути, охватывающие всю Мезоамерику, торгуют предметами роскоши и служат сборщиками разведывательной информации империи." #NT!
 nd_azt_aqueduct_engineering: "Акведук Инжиниринг" #NT!
 nd_azt_aqueduct_engineering_desc: "Двойные акведуки доставляют пресную воду из источников Чапультепек в островной город Теночтитлан, чудо инженерной мысли, в котором проживает более 200 000 человек." #NT!
 nd_azt_obsidian_mastery: "Обсидиановое мастерство" #NT!
 nd_azt_obsidian_mastery_desc: "Ацтекские мастера с исключительным мастерством изготавливают оружие, инструменты и зеркала из вулканического обсидиана. Макуауитль, деревянный меч с обсидиановой кромкой, может обезглавить лошадь." #NT!
 nd_azt_calpulli_organisation: "Организация Кальпулли" #NT!
 nd_azt_calpulli_organisation_desc: "Кальпулли, клановые округа, составляющие административную основу ацтекских городов, координируют налогообложение, землепользование, образование и военную службу на местном уровне." #NT!
 nd_azt_cuachicqueh_order: "Орден Куачике" #NT!
 nd_azt_cuachicqueh_order_desc: "Остриженные — высшая воинская элита Империи ацтеков. Они клянутся никогда не отступать и всегда возглавляют авангард в бою." #NT!
 nd_azt_flower_wars_doctrine: "Доктрина цветочных войн" #NT!
 nd_azt_flower_wars_doctrine_desc: "Шотияойотль, «Цветочные войны», — это ритуальные конфликты, которые поддерживают воинов в боевой готовности, предоставляют пленников для жертвоприношений и демонстрируют военное превосходство империи, не требуя полного завоевания." #NT!
 nd_azt_tribute_administration: "Администрация дани" #NT!
 nd_azt_tribute_administration_desc: "Бюрократия кальпиксов (сборщиков дани) обеспечивает постоянный поток товаров от более чем четырехсот подданных альтепетлей в имперскую казну." #NT!
 nd_azt_codex_tradition: "Кодекс традиции" #NT!
 nd_azt_codex_tradition_desc: "Ацтекские писцы, тлакуилоки, создают сложные раскрашенные кодексы, записывающие все: от астрономических наблюдений до определения дани и лечения травами." #NT!
 nd_azt_cacao_trade: "Какао Трейд" #NT!
 nd_azt_cacao_trade_desc: "Какао-бобы служат одновременно валютой и предметом роскоши на всей территории Мезоамерики. Контроль над торговлей какао дает империи экономическое влияние на весь регион." #NT!
 nd_azt_reformed_defenses: "Реформированная защита" #NT!
 nd_azt_reformed_defenses_desc: "Империя укрепляет свои пограничные укрепления и гарнизонную систему, строя теокалли-крепости, сочетающие в себе оборонительную мощь с религиозным значением." #NT!
 nd_azt_nahuatl_imperialism: "Науатль Империализм" #NT!
 nd_azt_nahuatl_imperialism_desc: "Язык и культура науатль активно пропагандируются во всех владениях империи, связывая подчиненные народы с ацтекской идентичностью посредством общего языка, религии и обычаев." #NT!
 nd_azt_coyote_runners: "Койоты-бегуны" #NT!
 nd_azt_coyote_runners_desc: "Элитные бегуны служат сетью быстрой связи империи и быстродвижущейся рейдовой силой, преодолевающей огромные расстояния через горы и джунгли Мезоамерики." #NT!
 nd_azt_military_reformation: "Военная реформация" #NT!
 nd_azt_military_reformation_desc: "Традиционная система воинских орденов реформируется и включает в себя новые тактические доктрины, дисциплина и формирование заменяют индивидуальный героизм как основу военной мощи ацтеков." #NT!
 nd_azt_centralised_tribute: "Централизованная реформа дани" #NT!
 nd_azt_centralised_tribute_desc: "Система дани фундаментально реорганизуется под прямым имперским управлением, заменяя лоскутное одеяло местных механизмов централизованной бюрократией." #NT!
 nd_azt_hydraulic_mastery: "Гидравлическое мастерство" #NT!
 nd_azt_hydraulic_mastery_desc: "Поколения опыта работы с чинампасами, акведуками и борьбой с наводнениями создали класс инженеров-гидротехников, не имеющий аналогов в Америке." #NT!
 nd_azt_imperial_law_code: "Имперский кодекс законов" #NT!
 nd_azt_imperial_law_code_desc: "Комплексный правовой кодекс заменяет специальные постановления отдельных тлаток, обеспечивая последовательное правосудие по всей империи и укрепляя центральную власть." #NT!
 nd_azt_tlacochcalcatl_tradition: "Традиция Тлакохкалькатля" #NT!
 nd_azt_tlacochcalcatl_tradition_desc: "Названные в честь Мастера Дома Дартс, эти реформированные имперские гвардейцы представляют собой вершину военной эволюции ацтеков: дисциплинированные, хорошо экипированные и чрезвычайно преданные." #NT!
 nd_azt_mesoamerican_renaissance: "Мезоамериканский Ренессанс" #NT!
 nd_azt_mesoamerican_renaissance_desc: "Расцвет искусств, наук и философии превращает Империю ацтеков в центр обучения, опирающийся на тысячи лет накопления мезоамериканской цивилизации." #NT!
 nd_azt_modern_armies: "Современные армии" #NT!
 nd_azt_modern_armies_desc: "Армия ацтеков завершает трансформацию из системы воинских орденов в современную армию со стандартизированным оборудованием, тактической тренировкой и профессиональным офицерским корпусом." #NT!
 nd_azt_trade_modernisation: "Модернизация торговли" #NT!
 nd_azt_trade_modernisation_desc: "Древние торговые сети почты модернизированы новыми методами бухгалтерского учета, кредитования и складирования, что позволяет ацтекской торговле конкурировать с любой нацией." #NT!
 nd_azt_national_identity: "Национальная идентичность" #NT!
 nd_azt_national_identity_desc: "Различные народы империи (науа, миштеки, сапотеки, тотонаки и многие другие) начинают формировать общую идентичность как граждан ацтекского государства." #NT!
 nd_azt_industrial_dawn: "Индустриальный рассвет" #NT!
 nd_azt_industrial_dawn_desc: "Ацтекские инженеры и мастера применяют свою традиционную изобретательность к новым технологиям производства, начиная трансформацию экономики империи от аграрной дани к промышленному производству." #NT!
 a_nd_azt_cuachicqueh: "Куачикке" #NT!
 a_nd_azt_cuachicqueh_desc: "Остриженные, элитная ударная пехота, которая бреет головы и красит лица, клянясь перед богами никогда не отступать. Они возглавляют каждую атаку и держат каждую линию." #NT!
 a_nd_azt_atlatl_skirmisher: "Атлатль-застрельщик" #NT!
 a_nd_azt_atlatl_skirmisher_desc: "Воины-наемники, вооруженные атлатлем, древним метателем копья, который дает разрушительную дальность и ударную силу даже солдатам-срочникам." #NT!
 a_nd_azt_tlacochcalcatl_guard: "Тлакокалькатль-страж" #NT!
 a_nd_azt_tlacochcalcatl_guard_desc: "Реформированная имперская пехота, названная в честь верховного военачальника. Эти дисциплинированные солдаты сочетают в себе традиционную ацтекскую свирепость и современные тактические порядки." #NT!
 a_nd_azt_coyote_runner: "Койот-бегун" #NT!
 a_nd_azt_coyote_runner_desc: "Быстрые вспомогательные разведчики и рейдеры, служащие силами быстрого реагирования империи, пересекающие горы и джунгли с необычайной скоростью." #NT!
 nd_azt_tlachtli: "Площадка для игры в мяч Тлахтли" #NT!
 nd_azt_tlachtli_desc: "Каменная площадка для ритуальной игры в мяч, которая служит как религиозной преданности, так и политической дипломатии, разрешая споры между алтепетлями посредством священных спортивных состязаний." #NT!
 nd_azt_chinampa_terrace: "Терраса Чинампа" #NT!
 nd_azt_chinampa_terrace_desc: "Плавучие сады, построенные на мелководных днах озер, ежегодно дают несколько урожаев кукурузы, фасоли, тыквы и цветов." #NT!
 nd_azt_pochteca_warehouse: "Почтовый склад" #NT!
 nd_azt_pochteca_warehouse_desc: "Надежный склад, где почтовые торговцы, занимающиеся дальними перевозками, инвентаризируют и перераспределяют товары — от какао и перьев кетцаля до обсидиана и тонких тканей." #NT!
 nd_azt_aqueduct: "Ацтекский акведук" #NT!
 nd_azt_aqueduct_desc: "Каменный канал, доставляющий пресную воду из горных источников, поддерживающий население и здоровье ацтекских городов, построенных на озерных островах." #NT!
 nd_azt_obsidian_workshop: "Обсидиановая мастерская" #NT!
 nd_azt_obsidian_workshop_desc: "Мастерская, где мастера производят мечи макуауитль, наконечники стрел, хирургические инструменты и зеркала из вулканического обсидиана, мезоамериканского эквивалента стали." #NT!
 nd_azt_tianquiztli: "Рынок Тианквизтли" #NT!
 nd_azt_tianquiztli_desc: "Большой рынок, где торговцы торгуют всем: от какао-бобов и хлопковых мантий до нефритовых украшений и перьев кетцаля. Тианквизтли Тлателолко ежедневно привлекали десятки тысяч торговцев." #NT!
 nd_azt_nahuatl_academy: "Академия Науатль" #NT!
 nd_azt_nahuatl_academy_desc: "Центр обучения, который расширяет традицию Calmecac на более широкую науку, готовит администраторов, писцов и ученых в области права, истории, философии и естественных наук." #NT!
 nd_azt_teocalli_fortress: "Крепость Теокалли" #NT!
 nd_azt_teocalli_fortress_desc: "Укрепленный храмовый комплекс, сочетающий в себе священную власть богов с практической силой каменных стен и гарнизонных помещений. Эти опорные пункты служат основой обороны империи." #NT!
 nd_azt_mesoamerican_manufactory: "Мезоамериканская мануфактура" #NT!
 nd_azt_mesoamerican_manufactory_desc: "Комплекс мастерских, где традиционное ацтекское мастерство сочетается с новыми методами производства, производя текстиль, инструменты из обсидиана, керамику и изделия из металла в промышленных масштабах." #NT!
 nd_azt_ritual_maintenance: "Ритуальные подношения" #NT!
 nd_azt_ritual_maintenance_desc: "Для содержания площадки для игры в мяч требуются благовония для священного дыма, церемониальные красители для игроков и пчелиный воск для зажигания факелов во время ночных церемоний." #NT!
 nd_azt_chinampa_farming: "Выращивание Чинампы" #NT!
 nd_azt_chinampa_farming_desc: "Фермеры, работающие на плавучих грядках, используют инструменты для обработки богатой почвы дна озера, ежегодно производя обильные урожаи кукурузы в течение нескольких вегетационных сезонов." #NT!
 nd_azt_cacao_processing: "Переработка какао" #NT!
 nd_azt_cacao_processing_desc: "Для переработки и хранения какао-бобов требуются керамические сосуды для измельчения и ферментации, какао-бобы в качестве сырья и ткань для упаковки и транспортировки готовой продукции." #NT!
 nd_azt_water_maintenance: "Обслуживание водного канала" #NT!
 nd_azt_water_maintenance_desc: "Для акведука требуется камень для ремонта каналов, пиломатериалы для шлюзовых ворот и строительных лесов, а также инструменты для обслуживающего персонала, который поддерживает течение воды круглый год." #NT!
 nd_azt_obsidian_working: "Обсидиан Рабочий" #NT!
 nd_azt_obsidian_working_desc: "Мастера-ремесленники выковывают из вулканического обсидиана лезвия макуауитля, наконечники стрел и хирургические инструменты — оружие острее любой бронзы." #NT!
 nd_azt_market_maintenance: "Администрация рынка" #NT!
 nd_azt_market_maintenance_desc: "Для работы тианквизтли необходимы керамические контейнеры, ткань для прилавков и навесов, а также соль — ключевой торговый товар, который де-факто служит единицей обмена по всей Мезоамерике." #NT!
 nd_azt_academy_maintenance: "Принадлежности Академии" #NT!
 nd_azt_academy_maintenance_desc: "Академии требуются бумага и минеральные пигменты для производства кодексов, а также свечи из пчелиного воска для освещения ночных научных работ." #NT!
 nd_azt_fortress_maintenance: "Крепостной гарнизон" #NT!
 nd_azt_fortress_maintenance_desc: "Крепости Теокалли требуется камень для поддержания конструкции, оружие для вооружения гарнизона и древесина для частоколов, платформ и обслуживания осадного оборудования." #NT!
 nd_azt_manufactory_maintenance: "Материалы семинара" #NT!
 nd_azt_manufactory_maintenance_desc: "Мастера превращают камень и пиломатериалы в инструменты, применяя традиционные мезоамериканские методы в промышленных масштабах." #NT!
 levy_nd_azt_atlatl_skirmisher: "Атлатль-стрелок Леви" #NT!
 levy_nd_azt_atlatl_skirmisher_desc: "Крестьянские ополчения, вооруженные традиционным копьеметанием." #NT!
 levy_nd_azt_coyote_runner: "Бегущий Койот Леви" #NT!
 levy_nd_azt_coyote_runner_desc: "Быстрые вспомогательные разведчики, набранные из класса солдат." #NT!
 nd_azt_formed_tt: "Империя ацтеков была основана" #NT!
 nd_azt_path_a_tt: "Выбрать путь Цветочных войн" #NT!
 nd_azt_path_b_tt: "Выбрал дорогу Почтеки" #NT!
 nd_azt_destiny: "Судьба империи ацтеков" #NT!
 nd_azt_destiny_desc: "Империя ацтеков была создана. Теперь Хьюи Тлатоани должны продемонстрировать, что это царство может выжить: что оно больше, чем мимолетная тень на лике Пятого Солнца. Докажите стабильность империи, и путь вперед откроется сам собой." #NT!
 nd_azt_dest_chichimecah: "Завоевание Чичимеки" #NT!
 nd_azt_dest_chichimecah_desc: "Дикие северные границы уже давно бросают вызов власти ацтеков. Народы чичимеков (кочевые охотники и налетчики) должны быть подчинены. Захватите богатые серебром земли Гуачичил и прибрежные поселения Аридоамерики, чтобы обезопасить северный фланг империи." #NT!
 nd_azt_dest_fifth_sun: "Империя Пятого Солнца" #NT!
 nd_azt_dest_fifth_sun_desc: "Обеспечив север, армии Пятого Солнца маршируют на юг, в горные королевства Центральной Америки. Куаутемаллан и торговый порт Нако должны попасть под власть ацтеков, доказывая, что ни одна сила в Америке не может противостоять цветочным воинам." #NT!
 nd_azt_dest_lords_americas: "Лорды Америки" #NT!
 nd_azt_dest_lords_americas_desc: "Конечная цель: империя, охватывающая весь американский континент. Великое вождество Кофитачеки на юго-востоке и древний город-курган Кахокия в сердце страны должны признать господство ацтеков. Только тогда Хьюи Тлатоани смогут по-настоящему претендовать на титул Лорда Америки." #NT!
 nd_azt_dest_cacao_monopoly: "Монополия какао" #NT!
 nd_azt_dest_cacao_monopoly_desc: "Какао-бобы являются валютой и источником жизненной силы мезоамериканской торговли. Почта должна гарантировать, что рынок капитала империи контролирует поток этого драгоценного товара. Постройте казну и развивайте королевство, чтобы финансировать коммерческие амбиции империи." #NT!
 nd_azt_dest_great_tianquiztli: "Великий Тианквизтли" #NT!
 nd_azt_dest_great_tianquiztli_desc: "Рынок Тлателолко когда-то поражал даже испанских конкистадоров. Теперь империя должна построить нечто большее: континентальную торговую сеть, связывающую серебряные рудники, плантации какао и предметы роскоши со всех уголков Америки. Используйте современные финансовые учреждения для финансирования этого видения." #NT!
 nd_azt_dest_merchants_world: "Торговцы мира" #NT!
 nd_azt_dest_merchants_world_desc: "Почтеки переросли Мезоамерику. Установив контроль над карибскими торговыми путями через Гавану и обеспечив безопасность какао-центров Чалчуапы, ацтекский торговый класс может проецировать экономическую мощь на весь известный мир." #NT!
 nd_azt.6.t: "Судьба Империи" #NT!
 nd_azt.6.d: "Империя ацтеков стоит на пороге новой эпохи. Теночтитлан, островной город каналов и дамб, является сердцем королевства, простирающегося от берегов Тихого океана до побережья Персидского залива. Но амбиции Хьюи Тлатоани выходят далеко за пределы Мезоамерики. Боги требуют большего: больше дани, больше славы, больше доказательств того, что мешики — избранный народ Пятого Солнца. Путь, выбранный при основании империи, теперь начинает приносить плоды, и судьба ацтекского народа ждет своего исполнения." #NT!
 nd_azt.6.a: "Пятое Солнце никогда не зайдет." #NT!
 nd_azt.7.t: "Северный пограничный водопад" #NT!
 nd_azt.7.d: "Граница Чичимек (обширная засушливая дикая местность за пределами Мексиканской долины) на протяжении нескольких поколений была великим незавершенным делом империи. Теперь все закончено. Воины Гуачичил, которые когда-то безнаказанно совершали набеги на караваны ацтеков, преклоняют колени перед Хьюи Тлатоани. Сереброносные горы на севере принадлежат нам, и фланг империи наконец-то в безопасности. Цветочные воины, покорившие эти земли, доказали, что боевая доктрина ацтеков адаптируется к любой местности: пустыне, горам или джунглям." #NT!
 nd_azt.7.a: "Север склоняется перед Теночтитланом." #NT!
 nd_azt.8.t: "Мартовский Юг" #NT!
 nd_azt.8.d: "Армии Пятого Солнца пронеслись по Центральной Америке. Горная крепость Куаутемальян и прибрежный торговый центр Нако соответствуют ацтекскому стандарту. Никакая сила к югу от Мексиканской долины не сможет устоять перед воинами цветов. Но как империя закрепит эти завоевания? Военные капитаны выступают за постоянную готовность: барабаны войны никогда не должны умолкать. Но храмовые жрецы советуют посвятить эти завоевания богам, создавая священные гарнизоны, которые связывают покоренные народы не только военной силой, но и религиозным благоговением." #NT!
 nd_azt.8.a: "Пусть барабаны войны гремят без умолку." #NT!
 nd_azt.8.b: "Посвятите эти земли Уицилопочтли." #NT!
 nd_azt.9.t: "Лорды Америки" #NT!
 nd_azt.9.d: "Это сделано. Великое вождество Кофитачеки, известное своим жемчугом и медью, подчинилось власти ацтеков. В древнем городе-кургане Кахокия (месте, священном для народов, о которых мексиканцы никогда не слышали поколение назад) теперь находится ацтекский губернатор. Империя простирается от замерзших северных равнин до дымящихся джунглей юга. Ни одно королевство в Америке и, возможно, немногие во всем мире не может сравниться с владычеством ацтеков по размерам и мощи. Теперь Хьюи Тлатоани должны решить, как распространить эту беспрецедентную гегемонию на такие огромные расстояния." #NT!
 nd_azt.9.a: "Наши обсидиановые клинки будут исполнять нашу волю." #NT!
 nd_azt.9.b: "Мы будем править, как правит Солнце: сиянием." #NT!
 nd_azt.10.t: "Короли какао" #NT!
 nd_azt.10.d: "Почтеки добились чего-то выдающегося. Благодаря сети торговых соглашений, стратегическим закупкам и случайным тихо устраняемым конкурентам Империя ацтеков теперь контролирует поток какао через свой рынок капитала. Каждая чашка ксоколатля, выпитая от побережья Персидского залива до побережья Тихого океана, обогащает казну Теночтитлана. Какао-бобы, когда-то бывшие просто роскошным напитком, стали инструментом экономической гегемонии ацтеков. Торговые принцы гильдий почтака заслужили свое место рядом с воинскими орденами в советах Хьюи Тлатоани." #NT!
 nd_azt.10.a: "Какао течет кровью по нашей империи." #NT!
 nd_azt.11.t: "Континентальный рынок" #NT!
 nd_azt.11.d: "Тианквизтли Теночтитлана стал чем-то, чего мир никогда раньше не видел: рынком, на котором товары со всего континента переходят из рук в руки. Серебро из северных рудников, какао из тропических низменностей, обсидиан из вулканических гор и хлопок с прибрежных равнин — все это течет через торговые сети, контролируемые ацтеками. Почтеки даже переняли банковские инновации, привезенные из-за моря, адаптируя их для удовлетворения уникального мезоамериканского коммерческого видения. Но как следует управлять этой экономической империей?" #NT!
 nd_azt.11.a: "Лорды какао будут способствовать нашему процветанию." #NT!
 nd_azt.11.b: "Стройте корабли и ищите новые рынки за пределами моря." #NT!
 nd_azt.12.t: "Торговцы мира" #NT!
 nd_azt.12.d: "Почтеки сделали то, о чем ни один ацтек даже не мечтал. Со своего острова на озере Тескоко они построили коммерческую сеть, охватывающую океаны и континенты. Торговые посты ацтеков разбросаны по Карибскому морю. Какао, обсидиан и перья струятся наружу; серебро, изысканные ткани и экзотическая роскошь возвращаются обратно. Теперь Хьюи Тлатоани должны решить, как направить это беспрецедентное богатство: будут ли дороги империи нести поселенцев и администраторов в основание новых провинций, или же торговые гильдии будут нанимать иностранных солдат и моряков для защиты и расширения своей постоянно растущей сети?" #NT!
 nd_azt.12.a: "Наши люди должны заселить каждую дорогу, по которой они идут." #NT!
 nd_azt.12.b: "Пусть золото купит то, что не сможет взять обсидиан." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_war_drums: "Гром военных барабанов" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_war_drums: "Не умолкая, звучат боевые барабаны Империи ацтеков. Рекруты пополняются нетерпеливыми воинами, а стоимость ведения войны снижается благодаря постоянной практике. Каждая приграничная провинция сохраняет готовность к следующей кампании." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_sacred_conquest: "Священное завоевание" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_sacred_conquest: "Завоеванные земли были посвящены Уицилопочтли. Храмы-крепости окружают гарнизоны каждого крупного поселения, вдохновляя религиозную преданность побежденных народов, даже если они препятствуют восстанию. Но содержание армий на таких огромных территориях требует своих усилий." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_obsidian_hegemony: "Обсидиановая гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_obsidian_hegemony: "Военная мощь ацтеков теперь простирается за пределы морей и континентов. Флот патрулирует береговую линию, кавалерия (ранее неизвестная в Америке) разведывает границы, а колониальные амбиции империи не знают границ." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_sun_lords: "Сияние Повелителей Солнца" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_sun_lords: "Империя ацтеков правит посредством престижа и благоговения, а также посредством силы. Компании наемников из далеких народов служат Хьюи Тлатоани, а иностранные правители стремятся к союзу с Повелителями Солнца. Но поддержание такой обширной сети покровительства обходится недешево." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_cacao_lords: "Доминион лордов какао" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_cacao_lords: "Торговые принцы почтака обладают экономической мощью, которая может соперничать с любым воинским орденом. Их сети восстанавливают раздираемые войной провинции, а их дипломатические связи расширяют сферу влияния империи. Но богатство порождает самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_market_kings: "Амбиции королей рынка" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_market_kings: "Коммерческие амбиции империи повернулись в сторону моря. Верфи производят суда для торговли за пределами береговой линии, а исследователи прокладывают новые маршруты на отдаленные рынки. Но акцент на торговле обходится ценой военной готовности." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_golden_roads: "Золотые дороги" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_golden_roads: "Ацтекские поселенцы и администраторы путешествуют по обширной сети дорог империи, основывая новые провинции и интегрируя завоеванные народы. Религиозные различия не являются препятствием для расширения: дороги империи приветствуют всех, кто подчиняется Хьюи Тлатоани." #NT!
 STATIC_MODIFIER_NAME_nd_azt_dest_world_merchants: "Империя Мировых Торговцев" #NT!
 STATIC_MODIFIER_DESC_nd_azt_dest_world_merchants: "Почтеки стали настоящими мировыми торговцами, их торговые сети защищены наемными солдатами и поддерживаются растущим флотом. Экономическое влияние империи простирается на все берега, до которых могут добраться корабли ацтеков." #NT!
 nd_azt_sun_temple: "Комплекс Храма Солнца" #NT!
 nd_azt_sun_temple_desc: "Величественный комплекс храма-крепости, посвященный Уицилопочтли, сочетающий в себе священную власть бога войны с практической силой имперского гарнизона. Самый большой подобный комплекс за пределами самого Теночтитлана." #NT!
 nd_azt_pochteca_palace: "Почтека Палас" #NT!
 nd_azt_pochteca_palace_desc: "Великолепная торговая штаб-квартира, где купеческие князья-почтеки координируют обширную коммерческую сеть империи. Склады, счетные палаты и залы дипломатических приемов окружают центральный рыночный двор." #NT!
 nd_azt_sun_temple_maintenance: "Храмовый гарнизон" #NT!
 nd_azt_sun_temple_maintenance_desc: "Комплексу Храма Солнца требуется камень для ремонта, оружие для вооружения гарнизона и священные благовония для вечных костров в честь Уицилопочтли." #NT!
 nd_azt_palace_maintenance: "Администрация дворца" #NT!
 nd_azt_palace_maintenance_desc: "Для работы Дворца Почтека требуется какао для церемониальных подарков и торговых образцов, ткань для дипломатических показов и бумага для обширных бухгалтерских книг, отслеживающих континентальную торговлю." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_azt_bureaucracy_authority: "Императорская власть Мексики" #NT!
 AUTO_MODIFIER_DESC_nd_azt_bureaucracy_authority: "Тройственный союз Теночтитлана, Тецкоко и Тлакопана, сформировавшийся в 1428 году, создал постоянный имперский аппарат над озерными городами и их данником Альтепетлем. Трибунал хуэй тлатоани, тлатоканский совет высших лордов, кальписки, надзирающие за данью, и академии жрецов кальсекака образуют самодостаточное правительство. Два институциональных слота открываются рядом с неявным слотом столицы, позволяя империи закрепить за собой три своих великих офиса, в то время как остальные остаются предложениями на странице кодекса." #NT!
  
 azt_excan_tlatoloyan_bureaucracy: "Экскан Тлатолоян" #NT!
 azt_excan_tlatoloyan_bureaucracy_desc: "После разрушения Аскапоцалько в 1428 году Ицкоатль из Теночтитлана, Несауалькойотль из Тецкоко и Тотокильуацтли из Тлакопана согласились разделить имперскую дань в соотношении 2:2:1 и координировать кампании. Председательствовал старший партнер Теночтитлан, но суды Тецкоко и армейские контингенты Тлакопана управлялись независимо. Альянс просуществовал девяносто лет, распространяя мощь Мексики от Тихого океана до Персидского залива. Когда партнеры отступили, города-данники почувствовали слабость, и периметр распался." #NT!
  
 azt_calpixqui_tribute_bureaucracy: "Кальпикс Сервис" #NT!
 azt_calpixqui_tribute_bureaucracy_desc: "Calpisque («те, кто наблюдают») были имперскими надзирателями, размещавшимися в завоеванных городах для хранения списков дани. Кодекс Мендосы сохраняет график: каждая из тридцати восьми подчиненных провинций дважды в год поставляла фиксированное количество хлопковых мантий, какао-бобов, перьев кетцаля, золотого песка, извести, копала и воинов. Кальпишки переправляли товары в Теночтитлан, фиксировали недостачу и вызывали карательные экспедиции, когда платеж истекал. Усердная служба обогатила престол; слабый позволял провинциям снимать деньги, пока дань не стала фиктивной." #NT!
  
 azt_pochteca_guild_bureaucracy: "Гильдия Почтека" #NT!
 azt_pochteca_guild_bureaucracy_desc: "Почтека были братством дальних торговцев Тлателолко, организованным в двенадцати крупных городах и подотчетным своему собственному трибуналу на рынке Тлателолко, крупнейшем в Америке. Они везли обсидиан, какао, золотые украшения и перья кетцаля из Соконуско на побережье Персидского залива в вооруженных караванах. Специализированная ветвь, науалозтомеки или «замаскированные купцы», сообщала о непокоренных землях, торгуя на них; их разведка оправдывала последующие имперские кампании. Их богатство позволяло им покупать дворянский костюм, на что горько возмущался потомственный пипилтин." #NT!
  
 azt_calmecac_schools_bureaucracy: "Школы Кальмекака" #NT!
 azt_calmecac_schools_bureaucracy_desc: "Кальсекак представляли собой жреческие академии, прикрепленные к каждому крупному храму, куда маленькими детьми поступали мальчики ранга пипилтин и избранные дети простолюдинов. Они изучили графическое написание кодексов, гадательный календарь тональпоуалли, ораторское искусство на полированном регистре уэуэтлатолли, истории и правила поста и самоуничтожения. Выпускники Кальмекака заняли должности духовенства, высшей судебной власти и генерал-капитана; в результате реформ Тлакаэлеля они стали официальными производителями грамотной элиты в империи. Их престиж изолировал их от придворной политики, а самодовольный класс священников и дворян мог сплотить ряды против чужаков." #NT!
  
 azt_calpulli_wards_bureaucracy: "Кальпулли Подопечные" #NT!
 azt_calpulli_wards_bureaucracy_desc: "Кальпулли представляли собой клановые единицы Теночтитлана и данника Альтепетля: коллективные землевладельцы, старейшины которых распределяли милпа среди членов домохозяйств, отправляли мальчиков в тельпочкалли (военное училище простолюдинов), выставляли бригаду рабочих для государственной барщины на чинампах и дамбах и представляли своих членов в суде. Каждый кальпульи имел свой храм и покровителя. Кальпулли был основой гражданской жизни Мексики и местом вербовки имперской армии; хорошо ухоженные подопечные заполнили квоты, в то время как заброшенные разбились на враждующие линии из-за скудной милпы." #NT!
  
 azt_cuauhpipiltin_orders_bureaucracy: "Куаупипилтин Заказы" #NT!
 azt_cuauhpipiltin_orders_bureaucracy_desc: "Воины-орлы и ягуары (cuauhpipiltin, «орлы-дворяне») составляли элитную военную меритократию империи. Простолюдин, взявший в единоборстве четырех вражеских пленников, возводился в куаупилли с правом носить хлопок, пить октли, обедать в царском дворце и владеть землей на свое имя. Моктесума I систематизировал квоты пленных; Тлакаэлель сделал приказы постоянным противовесом наследственному пипилтину. Они возглавляли самые жестокие атаки империи; в упадке они выродились в жаждущих статуса охотников за пленниками, которые сражались за личную славу, в то время как когорта вокруг них растворялась." #NT!
  
 azt_tlatocan_council_bureaucracy: "Тлатоканский совет" #NT!
 azt_tlatocan_council_bureaucracy_desc: "Тлатокан был высшим советом, заседавшим рядом с хуэй тлатоани в Теночтитлане, в который входили сиуакоатль (главный министр и де-факто визирь), тлаочкалькатль и тлакатеккатль (два генерал-капитана), великие жрецы и старшие лорды-пипилтины. Он избирал каждого нового тлатоани из числа королевского рода после смерти его предшественника и выносил приговор по тяжким преступлениям. Сильные тлатоке (Ицкоатль с Тлакаэлелем, Моктесума I, Ауисотль) подчинили совет своей воле; оно управляло более слабыми, а разделенный Тлатокан мог парализовать трон фракционными интригами." #NT!
