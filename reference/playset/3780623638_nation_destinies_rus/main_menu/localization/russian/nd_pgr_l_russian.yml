l_russian:
  # === ADVANCE NAMES AND DESCRIPTIONS === 
 nd_pgr_gold_of_suvarnadvipa: "Золото Суварнадвипы" #NT!
 nd_pgr_gold_of_suvarnadvipa_desc: "С древности Суматра была известна как Суварнадвипа, Остров Золота. Нагорья Минангкабау в Танах-Датар содержат одни из самых богатых месторождений россыпного золота в Юго-Восточной Азии, и Адитьяварман основал свое королевство специально для того, чтобы контролировать эти богатства. Горняки промывают реки и выкапывают залежи на склонах холмов, отправляя караваны с золотом по склонам Букит-Барисан в прибрежные порты." #NT!
 nd_pgr_matrilineal_adat: "Матрилинейный Адат" #NT!
 nd_pgr_matrilineal_adat_desc: "Минангкабау практикуют крупнейшую в мире сохранившуюся матрилинейную систему. Имущество, земля и родовой дом переходят по женской линии. Женщины владеют румах гадангом, а вступившие в брак мужчины переезжают в дом своей жены. Этот адат, обычное право, регулирует наследование, брак и разрешение споров посредством сложной системы клановых советов и избранных вождей." #NT!
 nd_pgr_rumah_gadang_tradition: "Традиция Румах Гаданг" #NT!
 nd_pgr_rumah_gadang_tradition_desc: "Румах Гаданг, буквально «большой дом», представляет собой культовый длинный дом Минангкабау с резко поднимающейся крышей, напоминающей рога буйвола. В этих общественных жилищах проживает большая матрилинейная семья, они служат церемониальными залами и символизируют преемственность клана. Их резные деревянные фасады рассказывают историю наследия каждой семьи." #NT!
 nd_pgr_silek_tradition: "Силек Традиция" #NT!
 nd_pgr_silek_tradition_desc: "Самые ранние традиции структурированного пенчак силата зародились в высокогорье Минангкабау, где молодые люди изучают искусство сурау наряду с изучением Корана и обычаями адата. Силек Минангкабау делает упор на плавную работу ног, быстрые удары ногами и защитное парирование. Каждый нагари считает традицию силата деревенской реликвией, pusaka anak nagari, предназначенной для защиты тех, кто отправляется на рантау." #NT!
 nd_pgr_nagari_governance: "Управление Нагари" #NT!
 nd_pgr_nagari_governance_desc: "Нагари является основной единицей политической организации Минангкабау, самоуправляющейся деревенской республики со своим советом избираемых старейшин, собственными законами адата и собственными судебными процедурами. В отличие от централизованных королевств, власть Пагарруюнга опирается на престиж и арбитраж, а не на военную силу, при этом каждый нагари сохраняет значительную автономию." #NT!
 nd_pgr_highland_terraces: "Хайленд Террасы" #NT!
 nd_pgr_highland_terraces_desc: "Вулканические высокогорья Западной Суматры представляют собой сложные террасы из влажного риса, которые каскадом спускаются по склонам Букит Барисан. Эти орошаемые поля Сава были одними из первых мест выращивания риса в малайском мире, они кормили растущее население горных районов и обеспечивали сельскохозяйственную основу для процветания Минангкабау." #NT!
 nd_pgr_rajo_tigo_selo: "Раджо Тиго Село" #NT!
 nd_pgr_rajo_tigo_selo_desc: "Королевством Пагарруюнг управляет Раджо Тиго Село, Три короля, сидящие со скрещенными ногами. Раджа Алам в Пагаруюнге обладает исполнительной властью, раджа Адат в Буо регулирует обычное право, а раджа Ибадат в Сампур-Кудусе курирует религиозные дела. Этот триумвират уравновешивает мирскую власть, традиционные обычаи и духовное руководство, контролируя друг друга." #NT!
 nd_pgr_merantau_tradition: "Мерантау Традиция" #NT!
 nd_pgr_merantau_tradition_desc: "Минангкабау движимы мерантау, традицией покидать родину в поисках удачи, знаний и опыта в далеких странах. Молодые люди, лишенные права наследования собственности при матрилинейной системе, решаются создавать торговые сети по всему архипелагу. Эта диаспора создает сеть торговых сообществ Минангкабау от Малакки до Явы." #NT!
 nd_pgr_gold_caravan_routes: "Золотые караванные маршруты" #NT!
 nd_pgr_gold_caravan_routes_desc: "Золотые предприниматели Минангкабау ведут караваны из ста или более человек пешком по крутым склонам Букит Барисана к гаваням на западном побережье. Эти золотые маршруты соединяют высокогорные рудники Танах Датар с морскими торговыми сетями Индийского океана, делая Пагарруюнг важнейшим звеном в мировой торговле золотом." #NT!
 nd_pgr_surau_education: "Сурау Образование" #NT!
 nd_pgr_surau_education_desc: "Сурау – это сердце образования Минангкабау. В этом общественном здании молодые мальчики и мужчины живут вместе, учатся читать Коран, изучают религиозные знания, овладевают пенчак силатом и усваивают традиции адата посредством устного обучения. Система сурау выпускает не только местных ученых, но и исламских мыслителей международного уровня, которые распространились по всей Нусантаре." #NT!
 nd_pgr_highland_islamization: "Исламизация горной местности" #NT!
 nd_pgr_highland_islamization_desc: "Ислам постепенно проникает в высокогорье Минангкабау в шестнадцатом веке, превращая индуистско-буддийское королевство Адитьявармана в исламский султанат. Первый мусульманский правитель, традиционно известный как Султан Алиф, знаменует собой начало замечательного согласования между законами Корана и матрилинейными обычаями, которые на протяжении веков будут определять идентичность Минангкабау." #NT!
 nd_pgr_minang_bladesmithing: "Минангкабау Кузнечное дело" #NT!
 nd_pgr_minang_bladesmithing_desc: "Кузнецы Минангкабау — опытные мастера по металлу, они куют керис, клеванг и другое клинковое оружие как для местных воинов, так и экспортируют его в соседние государства. Хулубаланг, военные офицеры и королевские телохранители, носят это искусно изготовленное оружие как символы своего ранга. Производство оружия снабжает не только защитников Пагарруюнга, но и рынки Ачеха." #NT!
 nd_pgr_pepper_trade: "Перец Трейд" #NT!
 nd_pgr_pepper_trade_desc: "Западные склоны высокогорья Минангкабау производят большое количество черного перца — товара, который привлекает иностранных торговцев в порты Суматры. Пеппер вместе с золотом становится основой экспортной экономики королевства, а торговцы Минангкабау контролируют цепочку поставок от высокогорных плантаций до прибрежных складов." #NT!
 nd_pgr_adat_basandi_syarak: "Адат Басанди Сьярак" #NT!
 nd_pgr_adat_basandi_syarak_desc: "Минангкабау достигли замечательного синтеза: «Адат басанди сьярак, сьярак басанди Китабулла», Обычай основан на исламском праве, Исламский закон основан на Коране. Эта философская концепция согласовывает наследование по материнской линии с исламской юриспруденцией, создавая уникальную правовую систему, в которой высокое наследство переходит через женщин, а низкое наследование соответствует правилам Корана." #NT!
 nd_pgr_minang_diaspora: "Диаспора Минангкабау" #NT!
 nd_pgr_minang_diaspora_desc: "Сообщества минангкабау рантау теперь простираются по всему малайскому миру. От Малакки до Негери-Сембилана, от Явы до Борнео сети мигрантов, состоящие из торговцев, ученых и ремесленников, поддерживают прочные связи со своей горной родиной, доминируя при этом в местной торговле, где бы они ни поселились. Их репутация проницательных деловых людей и взаимной поддержки делает их грозными экономическими конкурентами." #NT!
 nd_pgr_cassia_cultivation: "Выращивание кассии" #NT!
 nd_pgr_cassia_cultivation_desc: "В высокогорных лесах Западной Суматры растет кора кассии, близкого родственника корицы, которая ценится в Азии и Европе как пряность и консервант. Фермеры Минангкабау выращивают кассию наряду с перцем, диверсифицируя экспортную экономику за пределы золота и создавая новый источник богатства из вулканической почвы." #NT!
 nd_pgr_fortified_nagari: "Укрепленный Нагари" #NT!
 nd_pgr_fortified_nagari_desc: "По мере роста внешних угроз, вызванных экспансией Ачеха, яванским соперничеством и, в конечном итоге, вторжением Европы, деревни Минангкабау укрепляются. Нагари, уже обладающие самоуправлением, теперь строят земляные валы, бамбуковые частоколы и каменные стены. Ландшафт нагорья Букит Барисан служит естественным укреплением, что делает каждое укрепленное нагари грозной оборонительной позицией." #NT!
 nd_pgr_bukit_barisan_mastery: "Букит Барисан Мастерство" #NT!
 nd_pgr_bukit_barisan_mastery_desc: "Горный хребет Букит Барисан, вулканический хребет Суматры, является родиной Минангкабау. Поколения, живущие в горах, воспитали воинов, которые знают каждый перевал, каждое ущелье и каждую точку засады. Армии вторжения сталкиваются с кошмаром узких ущелий, тропических ливней и защитников, растворяющихся в местности, которую они знали с рождения." #NT!
 nd_pgr_expanding_rantau: "Расширение сетей Рантау" #NT!
 nd_pgr_expanding_rantau_desc: "Традиция мерантау развивается от индивидуальных приключений к организованной коммерческой экспансии. Торговые поселения Минангкабау вдоль Малаккского пролива и по всему архипелагу образуют сети взаимной поддержки, обмена информацией и коллективных переговоров. Рантау становится не просто обрядом посвящения, а основой торговой империи без границ." #NT!
 nd_pgr_basa_ampek_balai: "Баса Ампек Балай" #NT!
 nd_pgr_basa_ampek_balai_desc: "Баса Ампек Балай, Совет четырех держав, представляет собой высший судебный и совещательный орган ниже Раджо Тиго Село. Эти четыре великих министра выносят решения по спорам, которые не могут разрешить отдельные нагари, координируют политику в горных долинах и поддерживают конституционную структуру удивительно децентрализованного королевства." #NT!
 nd_pgr_matrilineal_succession: "Матрилинейная преемственность" #NT!
 nd_pgr_matrilineal_succession_desc: "В то время как королевства по всему региону распадаются на части из-за кризисов престолонаследия, матрилинейная система Минангкабау обеспечивает удивительную стабильность. Титулы и собственность передаются по материнской линии, устраняя братоубийственную конкуренцию, от которой страдают отцовские королевства. Когда умирает правитель, следующий в очереди уже определяется согласием родословной и клана." #NT!
 nd_pgr_highland_coffee: "Хайленд Кофе" #NT!
 nd_pgr_highland_coffee_desc: "Вулканические почвы и прохладные возвышенности гор Минангкабау идеально подходят для выращивания кофе. По мере роста глобального спроса на кофе фермеры высокогорных районов добавляют эту товарную культуру в свою диверсифицированную сельскохозяйственную экономику, присоединяясь к перцу, кассии и гамбиру в качестве основного экспортного товара." #NT!
 nd_pgr_silat_mastery: "Мастерство Силата" #NT!
 nd_pgr_silat_mastery_desc: "На протяжении веков силат Минангкабау превратился из деревенской боевой традиции в сложную боевую систему. Мастера разрабатывают отличительные стили: плавные движения силек харимау, имитирующие тигра, взрывные техники силек туо, опирающиеся на древнюю мудрость. Эти мастера обучают следующее поколение воинов, которые несут это искусство по всему Рантау." #NT!
 nd_pgr_scholarly_tradition: "Научная традиция Минангкабау" #NT!
 nd_pgr_scholarly_tradition_desc: "Система образования Сурау выпускает ученых международного уровня. Улемы Минангкабау путешествуют в Мекку, Каир и великие медресе исламского мира, возвращаясь со знаниями, которые они распространяют через расширяющуюся сеть религиозных школ. Эти учёные пишут влиятельные тексты на арабском и малайском языках, благодаря чему Пагарруюнг заслужил репутацию центра исламского образования." #NT!
 nd_pgr_gambier_production: "Гамбье Продакшн" #NT!
 nd_pgr_gambier_production_desc: "Гамбье, экстракт листьев Uncaria gambir, используемый при дублении, крашении и в качестве добавки к бетелю, становится основной экспортной культурой Минангкабау наряду с табаком. Обильные осадки в высокогорье и богатая вулканическая почва способствуют интенсивному возделыванию, при этом продукция поставляется из прибрежных портов на рынки Юго-Восточной Азии." #NT!
 nd_pgr_istano_basa: "Истано Баса Пагаруюнг" #NT!
 nd_pgr_istano_basa_desc: "Истано Баса, Большой дворец Пагаруюнг, является высшим символом суверенитета Минангкабау. Построенный в традиционном стиле румах гаданг, но имеющий великолепные масштабы, его многочисленные высокие пики крыш символизируют авторитет Раджо Тиго Село. Дворец – это не просто королевская резиденция, но духовное и политическое сердце всего мира Минангкабау." #NT!
 nd_pgr_rantau_mercantile: "Торговая империя Рантау" #NT!
 nd_pgr_rantau_mercantile_desc: "Диаспора Минангкабау превратилась в безграничную торговую империю. Сообщества Рантау в каждом крупном портовом городе архипелага координируют торговлю, делятся информацией о рынке и создают кредитные сети, конкурирующие с европейскими колониальными компаниями. Купцы Минангкабау доминируют в региональной торговле посредством коллективной организации, а не военной силы." #NT!
 nd_pgr_padri_movement: "Движение за реформу Падри" #NT!
 nd_pgr_padri_movement_desc: "Вернувшиеся паломники из Мекки приносят в высокогорье Минангкабау идеологию реформ, вдохновленную ваххабитами. Движение Падри требует, чтобы строгие исламские законы заменили синкретическое сочетание адата и шарака. Возглавляемые такими харизматическими фигурами, как Туанку Нан Ренсех, реформаторы бросают вызов традиционной власти вождей адатов и самого Раджо Тиго Село, ввергая королевство в экзистенциальный кризис." #NT!
 nd_pgr_tuanku_fortresses: "Крепости Туанку" #NT!
 nd_pgr_tuanku_fortresses_desc: "Лидеры Падри, каждый из которых носит титул Туанку, строят укрепленные крепости по всей горной местности. Туанку Имам Бонжол и Туанку Рао строят не просто оборонительные позиции, но и самодостаточные поселения с мечетями, рынками и сельскохозяйственными угодьями за стенами. Эти крепости служат одновременно военными базами и центрами реформированного исламского порядка." #NT!
 nd_pgr_negeri_sembilan: "Негери Сембилан" #NT!
 nd_pgr_negeri_sembilan_desc: "По ту сторону Малаккского пролива мигранты из Минангкабау основали Негери-Сембилан, «Девять штатов», конфедерацию, управляемую матрилинейным законом адата, перенесенным с родины. Эта заморская колония поддерживает прямые связи с Пагарруюнгом, а ее Ян ди-Пертуан Бесар выбран из королевской семьи Минангкабау. Это наиболее успешный пример культурного экспорта Минангкабау." #NT!
 nd_pgr_highland_resistance: "Традиция горного сопротивления" #NT!
 nd_pgr_highland_resistance_desc: "Высокогорье Букит-Барисан никогда не было легко завоевано. Каждый вход в долину становится узким проходом, а каждый нагари — потенциальной крепостью. Когда колониальные державы прибывают с превосходящей огневой мощью, Минангкабау прибегают к партизанской тактике, отточенной на протяжении поколений: засадам, отступлению, пополнению запасов из скрытых высокогорных садов и пониманию того, что сами горы являются их величайшим союзником." #NT!
 nd_pgr_imam_bonjol: "Сопротивление Имама Бонджола" #NT!
 nd_pgr_imam_bonjol_desc: "Туанку Имам Бонжол, мистик, стратег и провидец, ведет легендарное сопротивление голландским колониальным силам из своей высокогорной крепости. В течение многих лет Бонжол сдерживает голландцев с помощью партизанской войны, дипломатических маневров и непоколебимой преданности своих последователей. Его трехлетняя осада стала символом сопротивления Минангкабау иностранному господству." #NT!
 nd_pgr_adat_vs_padri: "Адат против Падри" #NT!
 nd_pgr_adat_vs_padri_desc: "Войны Падри обнажают фундаментальное противоречие в обществе Минангкабау: между древними матрилинейными обычаями и реформистской исламской чистотой. Это не просто военный конфликт, а интеллектуальный. Эта резолюция, обновленный синтез адата и ислама, сохранившийся до наших дней, порождает одни из самых сложных юридических и философских размышлений в малайском мире." #NT!
 nd_pgr_minang_renaissance: "Минангкабау Ренессанс" #NT!
 nd_pgr_minang_renaissance_desc: "Из горнила войн Падри возникает интеллектуальный ренессанс Минангкабау. Ученые, писатели и философы пытаются разобраться в отношениях между традицией и современностью, исламом и обычаями, местной идентичностью и глобальным участием. Это брожение порождает литературу, правовую теорию и образовательную реформу, которые сделают Минангкабау одним из самых интеллектуально продуктивных народов архипелага." #NT!
 nd_pgr_modern_rantau: "Современная экономика Рантау" #NT!
 nd_pgr_modern_rantau_desc: "Традиция мерантау превращается из культурной практики в экономическую стратегию. Предприниматели Минангкабау открывают предприятия по всему Индонезийскому архипелагу и за его пределами, создавая цепочки поставок, франчайзинговые сети ресторанов и организации взаимопомощи. Их коммерческая хватка, отточенная многовековыми торговыми традициями, делает их одной из самых экономически успешных групп в Юго-Восточной Азии." #NT!
 nd_pgr_nusantara_scholars: "Ученые Нусантары" #NT!
 nd_pgr_nusantara_scholars_desc: "Ученые Минангкабау занимают ведущие позиции в исламском образовании, журналистике, литературе и политической мысли по всей Нусантаре. Традиция сурау строгого обучения в сочетании со стремлением мерантау взаимодействовать с более широким миром порождает интеллектуалов, которые соединяют местные традиции и глобальную современность. Их влияние формирует интеллектуальный ландшафт всего региона." #NT!
 nd_pgr_padang_cultural_export: "Культурный экспорт Паданга" #NT!
 nd_pgr_padang_cultural_export_desc: "Кухня Паданга с ее изысканным рендангом, огненным самбалом и насыщенным карри на основе кокоса становится самой узнаваемой кулинарной традицией в Юго-Восточной Азии. Мигранты из Рантау открывают рестораны Паданг в каждом городе, где они поселяются, создавая неформальную, но мощную сеть культурного экспорта. Наси Паданг становится символом самобытности Минангкабау далеко за пределами высокогорья." #NT!
  
  # === UNIT NAMES AND DESCRIPTIONS === 
 a_nd_pgr_pesilat: "Пешилат" #NT!
 a_nd_pgr_pesilat_desc: "Практикующие силек Минангкабау, древнее боевое искусство горной местности. Песилат сражается плавной работой ног, взрывными ударами ногами и кинжалами керис, полагаясь на ловкость и инициативу, а не на тяжелую броню. Их с детства обучают в сурау, изучая боевые действия наряду с чтением Корана и обычаями адата." #NT!
 a_nd_pgr_hulubalang: "Хулубаланг" #NT!
 a_nd_pgr_hulubalang_desc: "Хулубаланг — офицеры и телохранители королевской семьи Минангкабау. Вооруженные искусными керисами, мечами клеванг и щитами, они служат бесплатно, вместо этого зарабатывая свою долю военными заслугами и грабежами. Опытные всадники и опытные фехтовальщики — профессиональная боевая сила Пагаррюунга." #NT!
 a_nd_pgr_nagari_defenders: "Нагари Защитники" #NT!
 a_nd_pgr_nagari_defenders_desc: "Укрепленное деревенское ополчение, набранное из самоуправляющихся нагари. Эти защитники знают каждую тропу, ущелье и место засады на своей высокогорной территории. За частоколами и земляными валами они сражаются с упорной решимостью, превращая каждого нагари в крепость, которую каждый потенциальный завоеватель должен уничтожить индивидуально." #NT!
 a_nd_pgr_silat_masters: "Силат Мастерс" #NT!
 a_nd_pgr_silat_masters_desc: "Эти воины, наиболее опытные практикующие силут Минангкабау, овладели передовыми техниками: прыжком тигра силек харимау, древней мудростью силек туо. Их разрушительное сочетание скорости, точности и непредсказуемых движений заставляет их бояться в ближнем бою по всему архипелагу." #NT!
 a_nd_pgr_rantau_militia: "Рантауское ополчение" #NT!
 a_nd_pgr_rantau_militia_desc: "Ополчение Леви набрано из диаспоры Минангкабау. Эти поселенцы рантау сражаются за защиту торговых сетей, которые поддерживают их вдали от высокогорья. Легковооруженные, но мобильные, они патрулируют торговые пути и охраняют торговые поселения, их преданность родине не омрачается расстоянием." #NT!
 a_nd_pgr_highland_guerrilla: "Хайлендские партизаны" #NT!
 a_nd_pgr_highland_guerrilla_desc: "Бойцы горного сопротивления, ведущие партизанскую войну с высокогорья Букит-Барисан. Опираясь на многовековые оборонительные традиции гор, они устраивают засады на колонны вторгающихся в узких ущельях, исчезают в покрытых джунглями склонах и поддерживают себя из скрытых высокогорных садов. Их знание местности делает обычные военные операции против них чрезвычайно дорогостоящими." #NT!
 n_nd_pgr_rantau_trader: "Рантау Трейдер" #NT!
 n_nd_pgr_rantau_trader_desc: "Быстрое, легковооруженное торговое судно, предназначенное для морской торговли диаспоры Минангкабау. Эти корабли доставляют золото, перец, кассию и другие горные продукты на рынки по всему архипелагу, отдавая приоритет скорости и грузоподъемности, а не огневой мощи. Торговец рантау – это морское продолжение традиции мерантау." #NT!
  
  # === BUILDING NAMES AND DESCRIPTIONS === 
 nd_pgr_gold_smeltery: "Золотоплавильный завод" #NT!
 nd_pgr_gold_smeltery_desc: "Установка по переработке россыпного золота из высокогорных рек Танах Датар. Золотые рабочие Минангкабау перерабатывают необработанное россыпное золото в слитки и декоративные изделия, производя богатство, которое впервые привлекло Адитьявармана к основанию своего королевства в горах Суматры." #NT!
 nd_pgr_rumah_gadang: "Румах Гаданг" #NT!
 nd_pgr_rumah_gadang_desc: "Знаменитый длинный дом Минангкабау с высокой крышей из рога буйвола. В этом общественном жилище проживает большая матрилинейная семья, оно служит церемониальным залом и хранит накопленное богатство и наследие клана. Его резной и расписной фасад рассказывает историю происхождения каждой семьи." #NT!
 nd_pgr_sawah_terraces: "Савах Террасы" #NT!
 nd_pgr_sawah_terraces_desc: "Сложные террасы из влажного риса, высеченные в вулканическом нагорье Западной Суматры. Система Сава направляет горную воду через сложную ирригационную сеть для питания террасных полей, обеспечивая урожай риса, который поддерживает население высокогорья и способствует процветанию Минангкабау." #NT!
 nd_pgr_rantau_trading_post: "Торговый пост Рантау" #NT!
 nd_pgr_rantau_trading_post_desc: "Торговый аванпост, основанный мигрантами из минангкабау-рантау. Эти посты служат узлами коммерческой сети диаспоры, обеспечивая складирование, кредит и взаимную поддержку торговцам-мигрантам вдали от высокогорья." #NT!
 nd_pgr_surau: "Сурау" #NT!
 nd_pgr_surau_desc: "Традиционный общественный учебный центр Минангкабау, где молодые люди живут, молятся и учатся. Мальчики изучают чтение Корана, исламскую юриспруденцию, пенчак силат и обычаи адат под руководством местных ученых. В Сурау родились поколения интеллектуалов Нусантары." #NT!
 nd_pgr_pepper_warehouse: "Перечный склад" #NT!
 nd_pgr_pepper_warehouse_desc: "Предприятие по хранению и переработке черного перца, собранного в западной части высокогорья Минангкабау. Перец сушат, сортируют по сортам и складируют здесь перед транспортировкой в ​​прибрежные порты для экспорта в другие страны мира." #NT!
 nd_pgr_cassia_plantation: "Плантация Кассия" #NT!
 nd_pgr_cassia_plantation_desc: "Горная плантация, на которой выращивают кору кассии, суматранский вариант корицы. Ароматную кору снимают с культурных деревьев, сушат и упаковывают на экспорт. Кассия вместе с перцем и золотом становится основой экспортной экономики Минангкабау." #NT!
 nd_pgr_coffee_plantation: "Кофейная плантация Хайленд" #NT!
 nd_pgr_coffee_plantation_desc: "Плантация кофе Арабика, использующая вулканическую почву высокогорья Минангкабау, прохладные температуры и обильные осадки. Поскольку мировой спрос на кофе растет, эти высокогорные плантации становятся новым важным источником богатства для Пагарруюнга." #NT!
 nd_pgr_gambier_gardens: "Гамбье Гарденс" #NT!
 nd_pgr_gambier_gardens_desc: "Участки выращивания гамбира и табака в высокогорных долинах. Экстракт гамбье используется при дублении, окраске и в качестве добавки к жеванию бетеля в Юго-Восточной Азии, а табак находит готовые рынки по всему архипелагу." #NT!
 nd_pgr_tuanku_fortress: "Крепость Туанку" #NT!
 nd_pgr_tuanku_fortress_desc: "Укрепленная крепость, построенная лидерами Падри в горных долинах. Эти крепости сочетают в себе военные оборонительные сооружения с самодостаточными общинами, мечетями, рынками, колодцами и сельскохозяйственными участками внутри своих стен. Самый известный, Бонжол, три года выдерживал осаду голландцев." #NT!
 nd_pgr_literary_academy: "Литературная академия" #NT!
 nd_pgr_literary_academy_desc: "Интеллектуальный центр, где ученые Минангкабау пишут, дискутируют и преподают. Возрождение после войны Падри порождает литературу, философию права и реформу образования, которые формируют мышление на всем индонезийском архипелаге." #NT!
 nd_pgr_padang_restaurant: "Ресторан Паданг" #NT!
 nd_pgr_padang_restaurant_desc: "Кулинарное заведение Минангкабау, где подают наси Паданг, изысканные блюда из нескольких блюд, включающие ренданг, самбал и карри на основе кокоса. Эти рестораны, открытые мигрантами из рантау, где бы они ни поселились, служат одновременно коммерческими предприятиями и культурными посольствами идентичности Минангкабау." #NT!
  
  # === PRODUCTION METHOD NAMES AND DESCRIPTIONS === 
 nd_pgr_gold_smelting: "Плавка золота" #NT!
 nd_pgr_gold_smelting_desc: "Перерабатывает сырое россыпное золото из горных рек в чистый металл для чеканки монет, ювелирных изделий и экспорта." #NT!
 nd_pgr_rumah_maintenance: "Содержание Румы Гаданга" #NT!
 nd_pgr_rumah_maintenance_desc: "Сохранение искусной резной деревянной отделки и соломенной крыши традиционного длинного дома. Пиломатериалы для ремонта конструкций, ткань для церемониальных драпировок и инструменты для ремесленников, поддерживающих резные фасады в порядке." #NT!
 nd_pgr_terracing_labor: "Террасирование труда" #NT!
 nd_pgr_terracing_labor_desc: "Выращивает влажный рис на горных вулканических террасах, питаемых горными оросительными каналами." #NT!
 nd_pgr_rantau_trade_goods: "Торговые товары Рантау" #NT!
 nd_pgr_rantau_trade_goods_desc: "Импортный шелк и красители продавались через сеть диаспоры Минангкабау." #NT!
 nd_pgr_surau_upkeep: "Содержание Сурау" #NT!
 nd_pgr_surau_upkeep_desc: "Бумага для рукописей Корана и учебных текстов, ткань для молитвенной одежды и мебели, а также благовония для молитвенного зала — материалы, которые поддерживают сурау как центр обучения и преданности." #NT!
 nd_pgr_pepper_processing: "Переработка перца" #NT!
 nd_pgr_pepper_processing_desc: "Сюда привозят черный перец с высокогорных склонов для сушки, сортировки и упаковки в ящики. Ящики и сооружения для пиломатериалов строятся и обслуживаются из пиломатериалов, а инструменты поддерживают оборудование для сортировки и прессования в рабочем состоянии." #NT!
 nd_pgr_cassia_harvesting: "Сбор кассии" #NT!
 nd_pgr_cassia_harvesting_desc: "Срезает и сушит кору кассии с культурных высокогорных деревьев, получая ценную специю на экспорт." #NT!
 nd_pgr_coffee_processing: "Обработка кофе" #NT!
 nd_pgr_coffee_processing_desc: "Собирает, сушит и обжаривает зерна высокогорного кофе Арабика для мирового рынка." #NT!
 nd_pgr_gambier_processing: "Гамбье Обработка" #NT!
 nd_pgr_gambier_processing_desc: "Добывает гамбьер и выращивает табак в высокогорных долинах для регионального экспорта." #NT!
 nd_pgr_fortress_upkeep: "Содержание крепости" #NT!
 nd_pgr_fortress_upkeep_desc: "Поддержание каменной и деревянной обороны высокогорной крепости Падри." #NT!
 nd_pgr_literary_supplies: "Литературные товары" #NT!
 nd_pgr_literary_supplies_desc: "Бумага и чернила для литературных и философских произведений ученых." #NT!
 nd_pgr_rendang_cuisine: "Ренданг Кухня" #NT!
 nd_pgr_rendang_cuisine_desc: "Кухня использует рис в качестве основного продукта, говядину и буйволицу, полученную от высокогорного скота, а также острый черный перец и перец чили, которые определяют кухню Паданга. Ренданг, приготовленный на медленном огне, насыщенное кокосовое карри и самбал готовятся свежими для каждого дня службы." #NT!
  
  # === LEVY NAMES AND DESCRIPTIONS === 
 levy_nd_pgr_rantau_militia: "Сбор ополчения Рантау" #NT!
 levy_nd_pgr_rantau_militia_desc: "Набор легковооруженных ополченцев диаспоры из торговых общин Минангкабау." #NT!
 levy_nd_pgr_highland_guerrillas: "Хайлендский партизанский отряд" #NT!
 levy_nd_pgr_highland_guerrillas_desc: "Набор бойцов горного сопротивления с высокогорья Букит-Барисан." #NT!
  
  # === STATIC MODIFIER NAMES AND DESCRIPTIONS === 
 STATIC_MODIFIER_NAME_nd_pgr_syarak_harmony: "Гармония Сьярака и Адата" #NT!
 STATIC_MODIFIER_DESC_nd_pgr_syarak_harmony: "Формальное примирение исламской юриспруденции с матрилинейным обычным правом создает стабильное и толерантное общество." #NT!
 STATIC_MODIFIER_NAME_nd_pgr_adat_primacy: "Примат Адата" #NT!
 STATIC_MODIFIER_DESC_nd_pgr_adat_primacy: "Матрилинейный обычай считается высшим источником права, обеспечивающим стабильность и легитимность, укорененную в древней традиции." #NT!
 STATIC_MODIFIER_NAME_nd_pgr_padri_zeal: "Падри Зил" #NT!
 STATIC_MODIFIER_DESC_nd_pgr_padri_zeal: "Реформистский пыл движения Падри вдохновляет строгую дисциплину и бескомпромиссную преданность делу." #NT!
 STATIC_MODIFIER_NAME_nd_pgr_adat_resilience: "Адат Устойчивость" #NT!
 STATIC_MODIFIER_DESC_nd_pgr_adat_resilience: "Традиционные вожди адатов объединяются, чтобы защитить свои исконные обычаи, укрепляя как свои позиции, так и свою решимость." #NT!
 STATIC_MODIFIER_NAME_nd_pgr_bonjol_defiance: "Вызов Бонджола" #NT!
 STATIC_MODIFIER_DESC_nd_pgr_bonjol_defiance: "Легендарное сопротивление Имама Бонджола вдохновляет всю нацию противостоять иностранному господству любой ценой." #NT!
  
  # === EVENT LOCALIZATION === 
 nd_pgr.1.t: "Адат Басанди Сьярак" #NT!
 nd_pgr.1.d: "Перед горной местностью Минангкабау стоит вопрос, который кипел на протяжении нескольких поколений: как древний матрилинейный адат может сосуществовать с требованиями исламского закона? Формула повторялась десятилетиями: «Адат басанди сьярак, сьярак басанди Китабулла», но теперь наши ученые и вожди должны придать ей практический смысл.\n\nРаджо Тиго Село и Баса Ампек Балаи обсуждали этот вопрос. Собственность и родословная должны продолжаться по линии матери как «высокое наследство», в то время как личный заработок отца может переходить к его детям как «низкое наследство» согласно правилам Корана. Но баланс между этими двумя авторитетами остается спорным.\n\nСтоит ли нам делать упор на гармоничный синтез, позволяя сьяраку и адату усиливать друг друга? Или мы заявим, что адат, проверенный многовековой практикой, имеет главенствующее значение в нашем управлении?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pgr.1.a: "Шарак и Адат будут одной одеждой" #NT!
 nd_pgr.1.b: "Адат – это фундамент, на котором держится все остальное." #NT!
 nd_pgr.2.t: "Падри Шторм" #NT!
 nd_pgr.2.d: "Паломники, возвращающиеся из Мекки, приносят больше, чем веру: они приносят огонь реформ. Движение Падри, возглавляемое такими людьми, как Туанку Нан Ренсе, требует, чтобы общество Минангкабау соответствовало строгим исламским законам. Игорные дома горят. Петушиные бои запрещены. Традиционные вожди, терпящие эти обычаи под знаменем адата, объявляются недостаточно набожными.\n\nЦарство трепещет. В некоторых долинах падри силой захватывают власть. В других вожди адатов сплачивают свой народ для сопротивления. Конфликт угрожает разорвать ткань общества Минангкабау, тот самый синтез адата и сьярака, который веками скреплял горную местность.\n\nНаш ответ движению Падри будет формировать характер Пагарруюнга на многие поколения. Принимаем ли мы дисциплину и рвение реформаторов или защищаем исконные обычаи, которые поддерживали наш народ с незапамятных времен?" #NT!
 nd_pgr.2.a: "Очищение нашей веры укрепит нас" #NT!
 nd_pgr.2.b: "Мудрость наших предков не может быть отброшена" #NT!
 nd_pgr.3.t: "Крепость Бонжол" #NT!
 nd_pgr.3.d: "Из своей высокогорной крепости Туанку Имам Бонжол ведет войну, которая станет легендой. В течение трех лет голландские колониальные силы, оснащенные современной артиллерией и дисциплинированной европейской пехотой, разрушают оборону Бонжола. И крепость держится три года.\n\nИмам Бонжол не просто военачальник. Мистик, ученый и блестящий стратег, он превратил Бонжол в самодостаточное сообщество с мечетями, рынками, садами и колодцами в его стенах. Его бойцы знают каждую тропу в окрестных горах. Голландские линии снабжения попали в засаду. Подкрепления подвергаются преследованиям. Сама местность сражается на стороне Бонджола.\n\nХотя крепость в конечном итоге падет из-за предательства голландцев в результате ложных переговоров, а не из-за военного поражения, сопротивление Имама Бонджола становится вечным символом мужества Минангкабау. Его неповиновение отзывается эхом сквозь века: высокогорье невозможно завоевать одной силой." #NT!
 nd_pgr.3.a: "Пусть наши горы помнят его имя" #NT!
 nd_pgr.4.t: "Истано Баса Пагаруюнг" #NT!
 nd_pgr.4.d: "Величественный дворец Пагаруюнг возвышается над горной долиной, словно видение времен самого Адитьявармана. Его крышу, великолепный каскад пиков из буйволиных рогов, можно увидеть со всего Танах Датар, что является заявлением о суверенитете, видимом для всех.\n\nИстано Баса построен в традициях румах гаданг, но в масштабах, которые затмевают любой дом клана. В трех его основных частях расположены суды Раджо Тиго Село. Резные и расписные фасады изображают историю и мифологию народа Минангкабау, путешествие из Париангана Паданг Панджанга, легенду о победоносном водяном буйволе, который дал народу свое имя.\n\nВ этих стенах ведутся дела королевства: разрешаются споры по адатам, принимаются иностранные послы и разворачиваются сложные церемонии суда Минангкабау. Истано Баса – это не просто здание: это сердце цивилизации." #NT!
 nd_pgr.4.a: "Гордость всего Алама Минангкабау" #NT!
 nd_pgr_formed_tt: "Пагарруюнг был основан" #NT!
 nd_pgr_path_a_tt: "Выбрали Гармонию Сьярака и Адата." #NT!
 nd_pgr_path_b_tt: "Выбрал главенство Адата" #NT!
  
  # === BUREAUCRACIES === 
 rajo_tigo_selo_bureaucracy: "Раджо Тиго Село" #NT!
 rajo_tigo_selo_bureaucracy_desc: "Королевством Пагарруюнг управляет Раджо Тиго Село, Три короля, сидящие со скрещенными ногами. Раджа Алам в Пагаруюнге обладает исполнительной властью, раджа Адат в Буо регулирует обычное право, а раджа Ибадат в Сампур-Кудусе курирует религиозные дела. Поддержание триумвирата сохраняет традиции и веру в соответствии с троном; пренебрежение этим приводит к расколу трех судов, в результате чего исполнительная власть оказывается парализованной между старейшинами Раджи Адата и священнослужителями Раджи Ибадата." #NT!
 basa_ampek_balai_bureaucracy: "Баса Ампек Балай" #NT!
 basa_ampek_balai_bureaucracy_desc: "Ниже Трех Королей сидит Баса Ампек Балай, Совет Четырех Властей: Бандахаро в Сунгай-Тарабе, Махудум в Суманике, Индомо в Саруасо и Туан Кадхи в Паданг-Гантинге. Эти четыре великих министра выносят решения по межнагарским спорам, координируют горную торговлю и управляют повседневным механизмом королевства. При должном финансировании совет является наиболее эффективным бюрократическим инструментом, когда-либо созданным горной местностью; из-за недостаточного финансирования четыре офиса превращаются в патронаж, ориентированный на получение ренты и выжимающий плату из крестьянских деревень." #NT!
 nagari_republic_bureaucracy: "Республиканский совет Нагари" #NT!
 nagari_republic_bureaucracy_desc: "Нагари является основной единицей политической организации Минангкабау, самоуправляющейся сельской республики с выборными пэнхулу, своими собственными законами адата и собственными судебными процедурами. Признание автономии нагари как постоянного конституционного факта выталкивает власть вниз и из рук трона. Деревни отвечают взаимностью зерном, рабочей силой и тихой преданностью, пока трон уважает их автономию; В тот момент, когда король требует сбора сверх обычаев, каждый нагари становится потенциальным центром восстания." #NT!
 lareh_koto_piliang_bureaucracy: "Ларе Кото Пилианг" #NT!
 lareh_koto_piliang_bureaucracy_desc: "Политическая традиция Минангкабау признает два лараиха, два течения конституционных обычаев: эгалитарный Боди Каниаго Датуака Парпатии Нан Сабатанга и аристократический Кото Пилианг Датуака Катуманггунгана. Принятие ларе Кото Пилианг кодифицирует иерархию титулов пэнхулу, в которой великие кланы всегда располагаются выше остальных, дисциплинируя горных нагари и производя надежные благородные рекруты. Однако, оставленная для кальцификации, система становится чистой наследственной привилегией, вытесняющей как торговые сообщества рантау, так и нижние деревни." #NT!
  
  # === BUREAUCRACY AUTHORITY (auto-modifier) === 
 AUTO_MODIFIER_NAME_nd_pgr_bureaucracy_authority: "Королевская власть Пагарруюнг" #NT!
 AUTO_MODIFIER_DESC_nd_pgr_bureaucracy_authority: "При формировании Раджо Алам претендует на право установить исторический институциональный аппарат королевства Минангкабау. Предоставляет два слота бюрократии и открывает систему [bureaucracies|e], позволяющую игроку активировать до трех учреждений (с универсальным слотом капитала)." #NT!
