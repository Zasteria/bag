l_russian:
 nd_dah_ghezo_reforms: "Реформы Гезо" #NT!
 nd_dah_ghezo_reforms_desc: "Король Гезо превратил Дагомею из данника империи Ойо в грозную военную державу. Он превратил женщин-воинов Агоджи в постоянный многотысячный полк, повысил профессионализм армии с помощью европейских методов обучения и реорганизовал управление провинцией под руководством сменяющихся военных губернаторов, которые служили по усмотрению короля." #NT!
 nd_dah_palm_oil_economy: "Переход на пальмовое масло" #NT!
 nd_dah_palm_oil_economy_desc: "Когда британское давление положило конец работорговле за рубежом, Дагомея перешла на экспорт пальмового масла под руководством Гезо. Порабощенных рабочих перенаправляли на пальмовые плантации, а не продавали за границу. К 1850-м годам пальмовое масло стало основным законным экспортным товаром Дагомеи, хотя оно так и не заменило полностью финансовые масштабы рабовладельческой экономики." #NT!
 nd_dah_xwetanu_ceremonies: "Ежегодная таможня" #NT!
 nd_dah_xwetanu_ceremonies_desc: "Шветану, ежегодная таможня Дагомеи, была самым важным церемониальным учреждением королевства. Этот недельный фестиваль сочетал в себе почитание предков, военные смотры, политические советы, торговые ярмарки и перераспределение богатства. Это была арена, на которой король демонстрировал свою власть, разрешал споры между фракциями и определял политику на предстоящий год." #NT!
 nd_dah_abomey_artisans: "Абомей Ремесленная традиция" #NT!
 nd_dah_abomey_artisans_desc: "Королевские дворцы Абомея хранят замечательные художественные традиции. Дворцовые мастера создавали барельефы из полихромной глины, посвященные правлению каждого короля, сложные текстильные аппликации, изображающие военные победы, а также резные деревянные фигурки босио, наделенные духовной силой. Каждый королевский дворец дополняет 200-летнюю архитектурную летопись цивилизации Фон." #NT!
 nd_dah_behanzin_resistance: "Сопротивление Беханзина" #NT!
 nd_dah_behanzin_resistance_desc: "Король Беханзин, последний независимый правитель Дагомеи, осознал экзистенциальную угрозу европейского колониализма и подготовил свое королевство к войне. Он пытался производить огнестрельное оружие на местном уровне, обучал свои войска современной тактике и вел две войны против Франции в 1890 и 1892 годах. Несмотря на ожесточенное сопротивление, только 17 из 434 агоджи пережили финальную битву, Дагомея пала перед французскими колониальными войсками в 1894 году." #NT!
 a_nd_dah_agojie_veterans: "Ветераны Агоджие" #NT!
 a_nd_dah_agojie_veterans_desc: "Формализованный полк Агоджие под командованием Гезо насчитывал до 6000 женщин, что составляло примерно треть всей армии Дагомеи. Тщательно обученные болевой выносливости, скорости и рукопашному бою, они были организованы в специализированные подразделения: охотницы, стрелочки, жнецы, лучники и артиллеристы. Европейские наблюдатели неизменно считали, что они превосходят своих коллег-мужчин в эффективности и храбрости." #NT!
 a_nd_dah_fon_riflemen: "Фон Стрелки" #NT!
 a_nd_dah_fon_riflemen_desc: "Модернизированная пехота Беханзина, вооруженная импортными европейскими винтовками и обученная методам контрмаршевой стрельбы. Во франко-дагомейских войнах эти солдаты с отчаянным мужеством сражались против технологически превосходящего врага, используя знание местной местности для организации засад и беспокойного отступления через густой лес и джунгли." #NT!
 nd_dah_palm_oil_works: "Завод по производству пальмового масла" #NT!
 nd_dah_palm_oil_works_desc: "Перерабатывающие мощности по добыче и подготовке пальмового масла на экспорт. Под руководством Гезо экономика Дагомеи перешла от работорговли к производству пальмового масла, а бывшие пленники были перенаправлены на работу на пальмовых плантациях, которые питали эти мастерские." #NT!
 nd_dah_palm_oil_processing: "Переработка пальмового масла" #NT!
 nd_dah_palm_oil_processing_desc: "Извлекает масло из ядер пальмовых плодов для экспорта на европейские рынки в качестве промышленного смазочного материала и ингредиента мыла." #NT!
 nd_dah_royal_atelier: "Королевское ремесленное ателье" #NT!
 nd_dah_royal_atelier_desc: "Мастерская, пристроенная к комплексу королевского дворца, где мастера-ремесленники создают уникальные барельефные панели, текстильные аппликации и резные фигурки, которые ведут хронику истории Дагомеи и прославляют правление каждого короля." #NT!
 nd_dah_bas_relief_craft: "Барельеф Ремесло" #NT!
 nd_dah_bas_relief_craft_desc: "Ремесленники превращают глину из муравейников в полихромные барельефы, прессуют минеральные пигменты и обжигают фрагменты керамики на влажные поверхности, чтобы создать яркие панели, украшающие стены королевских дворцов Абомея." #NT!
 levy_nd_dah_fon_riflemen: "Фон Стрелки Леви" #NT!
 levy_nd_dah_fon_riflemen_desc: "Мобилизованная пехота Фон, вооруженная винтовками европейского образца, набранная из крестьян и солдат для защиты королевства." #NT!
 STATIC_MODIFIER_NAME_nd_dah_standing_army: "Постоянная армия Дагомеи" #NT!
 STATIC_MODIFIER_DESC_nd_dah_standing_army: "Профессионализация вооруженных сил Дагомеи, проведенная Гезо, создала одну из самых грозных боевых сил Западной Африки с постоянными полками, обученными европейским методам, и легендарными Агоджие в ее основе." #NT!
 STATIC_MODIFIER_NAME_nd_dah_royal_monopoly: "Королевская торговая монополия" #NT!
 STATIC_MODIFIER_DESC_nd_dah_royal_monopoly: "Корона Дагомеи осуществляла почти полный контроль над внешней торговлей, а Йовоган (наместник Уайды) управлял всеми сделками с европейскими купцами и обеспечивал получение королевством максимальной выгоды от своего экспорта." #NT!
 nd_dah.1.t: "Преобразование Дагомеи" #NT!
 nd_dah.1.d: "Король Гезо сверг своего предшественника Адандосана с помощью бразильского работорговца Франсиско Феликса де Соуза, положив конец унизительной дани Дагомеи империи Ойо. Новый король стоит перед выбором, который определит поколение: направить ресурсы королевства на создание самой профессиональной армии в Западной Африке или ужесточить контроль короны над торговлей, чтобы построить экономический центр, который сможет поддерживать независимость Дагомеи за счет богатства, а не только войны.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_dah.1.a: "Превратите Агоджие в нерушимый меч" #NT!
 nd_dah.1.b: "Йовоган будет контролировать каждое каури, протекающее через Уайду." #NT!
 nd_dah.2.t: "Лев Дагомеи" #NT!
 nd_dah.2.d: "Король Беханзин, «акула, которая беспокоила бар», занял трон Дагомеи и сразу же осознал смертельную угрозу, исходящую от французских колониальных амбиций. В отличие от своих предшественников, которые могли натравливать европейские державы друг против друга, Беханзин сталкивается с Францией, решившей победить. Он приказал построить местные оружейные мастерские, обучить свои войска современной стрелковой тактике и укрепить подступы к Абомею. Агоджие, теперь вооруженные магазинными винтовками, тренируются с яростью, рожденной осознанием того, что это может быть последняя война Дагомеи. Когда в 1892 году французы, наконец, придут к власти, солдаты Беханзина будут сражаться с необычайной храбростью, но 200-летняя независимость королевства закончится в дыму артиллерии." #NT!
 nd_dah.2.a: "Дагомея не преклонит колени" #NT!
 nd_dah_formed_tt: "была образована Дагомея." #NT!
 nd_dah_path_a_tt: "Выбрал постоянную армию Дагомеи" #NT!
 nd_dah_path_b_tt: "Выбрал Королевскую торговую монополию" #NT!
 AUTO_MODIFIER_NAME_nd_dah_bureaucracy_authority: "Бюрократическое управление Дагомеи" #NT!
 AUTO_MODIFIER_DESC_nd_dah_bureaucracy_authority: "При формировании королевству предоставляются рамки постоянного административного офиса. В сочетании с постоянным советом в Абомее это открывает три места, в которых Ахосу может устанавливать исторические институты управления Фон." #NT!
 dah_migan_mehu_bureaucracy: "Миган и Меху" #NT!
 dah_migan_mehu_bureaucracy_desc: "Ахосу Дагомеи правил через двух верховных министров, намеренно взятых из некоролевских родословных: Мигана, главного палача и премьер-министра, который занимался правосудием и внутренней безопасностью, и Меху, контролера королевского дома, который управлял финансами и внешней торговлей. Уэгбаджа институционализировал эту пару в конце семнадцатого века, и под ней сидели младшие офицеры: Йовоган в Уайде, Соган — над королевскими конюшнями, Токпо — над сельским хозяйством. При Гезо (годы правления 1818-1858) дуумвират стал двигателем военно-фискального восстановления Дагомеи от дани Ойо." #NT!
 dah_yovogan_whydah_bureaucracy: "Йовоган из Уайды" #NT!
 dah_yovogan_whydah_bureaucracy_desc: "После того, как Агаджа завоевала королевство Уайда в 1727 году, Дагомея поглотила атлантический работорговый порт Глеуэ и назначила постоянного королевского наместника (Йовогана, буквально «вождя белых людей»), который управлял гаванью и облагал налогом каждый груз, проходящий через европейские заводы. Йовоган обладал монополией на переговоры о ценах с европейскими капитанами, взимал экспортную пошлину за душу населения и отправлял Абомею золото и товары по фиксированному графику. При Гезо офис перешел на пальмовое масло после того, как британские патрули по борьбе с рабством закрыли невольничий рынок в Атлантике в 1840-х годах." #NT!
 dah_agojie_corps_bureaucracy: "Корпус Агоджие" #NT!
 dah_agojie_corps_bureaucracy_desc: "Агоджие (Мино, «наши матери»), известные европейцам как дагомейские амазонки, представляли собой отряд женщин-солдат, прикрепленных к королевскому дворцу. Возникнув при королеве Хангбе в начале восемнадцатого века как охотницы на слонов и дворцовые стражи, они были официально оформлены при Агадже и расширены при Гезо в постоянный полк численностью около шести тысяч человек, что составляет примерно треть военной силы королевства. Официально жены короля, они жили внутри дворцовых стен в казармах под началом своих офицеров-женщин и давали трону постоянную ударную силу, не считая кавалерии мужской знати." #NT!
 dah_xwetanu_customs_bureaucracy: "Ежегодная таможня Шветану" #NT!
 dah_xwetanu_customs_bureaucracy_desc: "Шветану, ежегодная таможня Дагомеи, представлял собой недельный фестиваль, который проводился каждый засушливый сезон в Абомее и сочетал в себе почитание предков, военный смотр, судебную сессию, торговую ярмарку и королевское перераспределение богатства. Ахосу лично раздавал каури, ткань, пленников и титулы собравшимся вождям и министрам; подношения делались на могилах предыдущих королей; были провозглашены новые указы и разрешены споры. При Гезо и Глеле таможня просуществовала шесть недель и поглощала излишки за весь год, а ее отмена французами в 1894 году ознаменовала символический конец королевства." #NT!
 dah_nesuhwe_cult_bureaucracy: "Королевский культ Несухве" #NT!
 dah_nesuhwe_cult_bureaucracy_desc: "Несухве был культом обожествленных королевских предков Дагомеи, исполнявшийся в Абомее под руководством Тассинона, главного жреца духов королевской линии. Каждый умерший король входил в пантеон Несухве и постоянно получал подношения в своей могиле-святилище; Прорицатели Quenum проводили консультации Фа по королевским делам. Несухве стоял рядом, но отличался от более широкого пантеона водун Маву-Лизы, Легбы, Сакпаты и Хевиосо, жрецы которого служили простолюдинам. Сделав самих королей объектами культового поклонения, Несухве напрямую вплели трон в религиозную жизнь Фон." #NT!
