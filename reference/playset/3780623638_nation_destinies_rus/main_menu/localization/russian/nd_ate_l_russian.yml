l_russian:
 STATIC_MODIFIER_NAME_nd_golden_stool_authority: "Авторитет Золотого Табурета" #NT!
 STATIC_MODIFIER_DESC_nd_golden_stool_authority: "Сика Два Кофи, Золотой Табурет, рожденный в пятницу, сошел с небес, чтобы освятить союз народа Ашанти. Его власть абсолютна, ни один асантехене не заседает в нем, а правит от его имени. Единство нации вытекает из этого священного символа." #NT!
 STATIC_MODIFIER_NAME_nd_gold_coast_merchants: "Лорды Золотого Берега" #NT!
 STATIC_MODIFIER_DESC_nd_gold_coast_merchants: "Богатства Конфедерации Ашанти перетекают от лесных золотых приисков к прибрежным фортам, от караванов с орехами колы на северные рынки. Кумаси находится в центре торговых сетей, простирающихся от Сахеля до Атлантики, превращая золотой песок в валюту империи." #NT!
 nd_ate.1.t: "Рождение Конфедерации Ашанти" #NT!
 nd_ate.1.d: "Под священной тенью дерева кум, от которого наша столица получила свое название, разбросанные вождества акан объединились в одну конфедерацию. Священник Окомфо Анокье призвал с небес Золотую Табуретку, и на ней покоится душа нашего народа. Повелители Денкииры, которые когда-то требовали дани золотом и кровью, были сломлены, и их вассальные государства теперь полагаются на Кумаси.\n\nНо что это будет за конфедерация? Золотой Табурет наделяет властью, превосходящей любого отдельного вождя, священным мандатом объединить все народы Акан под одной духовной властью. Однако золотые прииски и торговые пути, которые сделали эту победу возможной, говорят о другой судьбе: коммерческой империи, торговцы которой приносят богатства мира на широкие улицы Кумаси.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ate.1.a: "Табурет командует, а нация подчиняется." #NT!
 nd_ate.1.b: "Золото говорит громче любого стула." #NT!
 STATIC_MODIFIER_NAME_nd_ate_denkyira_conquerors: "Завоеватели Денкииры" #NT!
 STATIC_MODIFIER_DESC_nd_ate_denkyira_conquerors: "Армия, разорвавшая цепи Денкьиры, несет в себе импульс освобождения. Эти ветераны знают вкус победы над превосходящим противником." #NT!
 STATIC_MODIFIER_NAME_nd_ate_confederate_unity: "Конфедеративное единство" #NT!
 STATIC_MODIFIER_DESC_nd_ate_confederate_unity: "Гений конфедерации заключается не только в завоеваниях, но и в интеграции, в привлечении побежденных народов в качестве членов, а не подданных." #NT!
 nd_ate.2.t: "Падение Денкииры" #NT!
 nd_ate.2.d: "В битве при Фейясе в 1701 году объединенные силы конфедерации Ашанти разгромили армию Денкиирахене Нтима Гьякари. Золотые регалии Денкьиры, включая ноту о союзе с голландцами в Эльмине, попали в руки Ашанти. Золотые рудники, прибрежные торговые пути и подчиненные народы империи Денкииры теперь принадлежат конфедерации.\n\nСам Нтим Гьякари был убит, и его череп стал сосудом для питья при дворе Асантехене. Государства, которые когда-то подчинялись Денкире, теперь должны сделать выбор: будут ли они поглощены военной машиной Ашанти, которая вознаграждает за доблесть на поле боя, или же их примут в более широкую конфедерацию, которая превратит бывших врагов в лояльных членов?" #NT!
 nd_ate.2.a: "Нажмите на преимущество; побежденные служат, иначе они падут." #NT!
 nd_ate.2.b: "Расширьте защиту стула; бывшие враги становятся будущими союзниками." #NT!
 nd_ate.3.t: "Завоевания посуды Опоку" #NT!
 nd_ate.3.d: "Асантехэне Опоку Варе, сменивший великого Осея Туту, пронес знамена конфедерации дальше, чем кто-либо до него. Королевство Боно пало в 1723 году, за ним последовала Васса в 1726 году. Западная Гонджа подчинилась в 1732 году, а Гьяман последовал за ним в 1740 году. К концу его правления Конфедерация Ашанти контролирует территорию, простирающуюся от территории, которая станет современной Ганой, до Кот-д’Ивуара, под ее властью находится от трех до пяти миллионов человек.\n\nOpoku Ware также поощряла расширение ремесленного производства, создавая фабрики для инноваций в ткачество и металлообработка. Под его покровительством процветала традиция изготовления тканей кенте, а датские наблюдатели на побережье выражали свое восхищение мастерством ашанти." #NT!
 nd_ate.3.a: "Наследие Opoku Ware живо." #NT!
 STATIC_MODIFIER_NAME_nd_ate_kwadwo_bureaucracy: "Меритократия Квадво" #NT!
 STATIC_MODIFIER_DESC_nd_ate_kwadwo_bureaucracy: "Осей Квадво заменил рождение способностями как мерилом ценности человека в правительстве. Асоквафо, когда-то бывшие простыми королевскими трубачами, теперь служат тренировочной площадкой для лучших администраторов империи." #NT!
 STATIC_MODIFIER_NAME_nd_ate_hereditary_stability: "Наследственная стабильность" #NT!
 STATIC_MODIFIER_DESC_nd_ate_hereditary_stability: "Традиционные вожди и их родословные составляют основу управления Ашанти. Их авторитет, укорененный в клане и обычаях, обеспечивает преемственность на протяжении поколений." #NT!
 nd_ate.4.t: "Реформы Осея Квадво" #NT!
 nd_ate.4.d: "Асантехене Осей Квадво, правивший с 1764 по 1777 год, коренным образом изменил систему управления государством Ашанти. Там, где когда-то потомственные вожди занимали все важные должности, Квадво установил радикальный принцип: назначение по способностям, а не по рождению.\n\nАсоквафо, первоначально отряд королевских трубачей, был преобразован в академию для обучения и подготовки будущих правительственных чиновников. Самые талантливые молодые люди со всей Конфедерации вербуются в сообщество Асоквафо, обучаются администрированию, дипломатии и государственному управлению, а затем направляются туда, где они нужны империи.\n\nНо не все приветствуют эту трансформацию. Наследственные вожди видят, что их традиционные прерогативы лишаются, и предупреждают, что меритократия без происхождения порождает чиновников, не преданных ничему, кроме собственного продвижения." #NT!
 nd_ate.4.a: "Только способности определяют место человека." #NT!
 nd_ate.4.b: "Обычаи и родословная являются основой порядка." #NT!
 STATIC_MODIFIER_NAME_nd_ate_defiant_resistance: "Непокорное сопротивление" #NT!
 STATIC_MODIFIER_DESC_nd_ate_defiant_resistance: "Лес – наша крепость. За каждым деревом скрывается мушкетер, каждая тропа ведет к засаде. Пусть захватчики узнают, что ашанти не преклоняют колени." #NT!
 STATIC_MODIFIER_NAME_nd_ate_pragmatic_adaptation: "Прагматическая адаптация" #NT!
 STATIC_MODIFIER_DESC_nd_ate_pragmatic_adaptation: "Мир меняется, и вместе с ним меняется мудрая нация. Перенять то, что делает врага сильным (его дисциплину, его укрепления, его методы) и обратить это против него самого." #NT!
 nd_ate.5.t: "Англо-ашантийские войны" #NT!
 nd_ate.5.d: "Британцы продвинулись вглубь страны из своих прибрежных фортов, заявив о своем господстве над Золотым Берегом. Под командованием Асантехене Осей Бонсу ашанти ответили силой. В 1824 году сэр Чарльз Маккарти возглавил союзные британские войска против ашанти и потерпел полное поражение; его череп был воспринят асантехенами как кубок для питья с золотой оправой.\n\nНо британцы вернулись с большей численностью и лучшим оружием. Войны 1863, 1874 годов и последующих лет подвергли Конфедерацию Ашанти как никогда прежде испытаниям. В 1874 году британские войска под командованием сэра Гарнета Уолсли разграбили сам Кумаси, разрушив королевский дворец взрывчаткой и сжег мавзолей Бантама.\n\nКонфедерация стоит перед экзистенциальным выбором: копать глубже в лес и вести войну на истощение, которая использует традиционные сильные стороны ашанти, или адаптироваться к методам врага и наращивать способность противостоять им на современных условиях." #NT!
 nd_ate.5.a: "Лес – наше оружие. Пусть они истекают кровью на каждой миле." #NT!
 nd_ate.5.b: "Учитесь у врага, чтобы превзойти врага." #NT!
 nd_ate.6.t: "Война Яа Асантеваа" #NT!
 nd_ate.6.d: "В 1900 году, когда британский губернатор потребовал сесть на Золотую табуретку, сама душа нации Ашанти, королева-мать Эдзису, Яа Асантеваа, поднялась, чтобы высказаться. «Если вы, мужчины Ашанти, не пойдете вперед, - заявила она, - то мы, женщины, сделаем это». Она сплотила вождей, и началось последнее великое восстание Ашанти.\n\nВ течение нескольких месяцев силы Яа Асантеваа осадили британский гарнизон в форте Кумаси. Хотя восстание было в конечном итоге подавлено, а Яа Асантеваа был сослан на Сейшельские острова, британцы так и не получили Золотую табуретку. Он был спрятан в лесу, и душа народа Ашанти выжила. Ее неповиновение стало символом сопротивления, превосходящего само поражение." #NT!
 nd_ate.6.a: "Золотой табурет остается бесплатным." #NT!
 nd_ate_akan_clan_system: "Клановая система Акан" #NT!
 nd_ate_akan_clan_system_desc: "Матрилинейная клановая структура Акан, где наследование и политическая преемственность проходят по материнской линии, обеспечивает стабильную основу для конфедеративного управления." #NT!
 nd_ate_gold_dust_currency: "Валюта золотой пыли" #NT!
 nd_ate_gold_dust_currency_desc: "Золотая пыль Акан служит одновременно валютой и мерилом богатства, ее взвешивают на стандартных медных гирях на каждом рынке и при дворе лесных королевств.\n\n#italic Доступно в: $nd_ate_gold_treasury$#!" #NT!
 nd_ate_forest_warfare: "Традиции лесной войны" #NT!
 nd_ate_forest_warfare_desc: "Густые тропические леса Золотого Берега требуют воина другого типа, способного бесшумно передвигаться сквозь заросли, наносить удары из засады и исчезать прежде, чем враг успевает ответить." #NT!
 nd_ate_cola_nut_trade: "Кола Ореховая Торговля" #NT!
 nd_ate_cola_nut_trade_desc: "Стимулирующий орех кола, выращенный в южных лесах, продается на север через саванну мусульманским общинам, где алкоголь запрещен, создавая прибыльные торговые пути в Сахель." #NT!
 nd_ate_shrine_houses: "Храмовые дома" #NT!
 nd_ate_shrine_houses_desc: "Изысканные храмы чтят предков и могущественных божеств, защищающих народы акан. Эти священные места объединяют сообщества посредством общей духовной практики." #NT!
 nd_ate_akan_metalworking: "Акан Металлообработка" #NT!
 nd_ate_akan_metalworking_desc: "Ювелиры и литейщики Акан создают изысканные регалии, гири и ритуальные предметы, используя технику литья по выплавляемым моделям, передаваемую из поколения в поколение мастерами.\n\n#italic Доступно в: $nd_ate_abrafoo_foundry$#!" #NT!
 nd_ate_confederacy_founding: "Основание Конфедерации" #NT!
 nd_ate_confederacy_founding_desc: "Союз разрозненных вождеств Акан под «Золотой Табуреткой», созданный в результате поражения повелителей Денкьиры, знаменует собой рождение Конфедерации Ашанти." #NT!
 nd_ate_golden_stool: "Золотой табурет" #NT!
 nd_ate_golden_stool_desc: "Сика Два Кофи, Золотой Табурет, Рожденный в пятницу, сошел с небес по приказу священника Окомфо Анокье, олицетворяя дух и единство нации Ашанти." #NT!
 nd_ate_asafo_companies: "Компании Асафо" #NT!
 nd_ate_asafo_companies_desc: "Военные роты асафо, организованные вокруг вождей и измеряемые их «пушками», составляют основу армии ашанти, структурированной силы вооруженных мушкетами воинов, сражающихся в скоординированных формированиях." #NT!
 nd_ate_kente_weaving: "Кенте Уивинг" #NT!
 nd_ate_kente_weaving_desc: "Замысловатая полосатая ткань кентэ, производимая специализированными ткачами в таких деревнях, как Бонвайр, предназначена для королевской семьи и служит как искусством, так и политическим заявлением.\n\n#italic Доступно в: $nd_ate_kente_workshop$#!" #NT!
 nd_ate_opoku_ware_expansion: "Расширение Opoku Ware" #NT!
 nd_ate_opoku_ware_expansion_desc: "При Асантехене Опоку Уэре конфедерация расширилась до наибольшей территориальной протяженности, завоевав Боно, Вассу, Гонджу и Гьяман между 1723 и 1750 годами." #NT!
 nd_ate_royal_gold_mines: "Королевские золотые прииски" #NT!
 nd_ate_royal_gold_mines_desc: "Осей Туту объявил золотые прииски королевскими владениями, гарантируя, что богатства лесных золотых приисков поступят непосредственно в Асантехене и будут способствовать расширению конфедерации." #NT!
 nd_ate_kumasi_palace: "Дворцовый комплекс Кумаси" #NT!
 nd_ate_kumasi_palace_desc: "Обширный королевский дворец в Кумаси с его широкими улицами, внутренними дворами и более чем шестьюдесятью комнатами служит политическим и культурным центром конфедерации." #NT!
 nd_ate_firearms_trade: "Европейская торговля огнестрельным оружием" #NT!
 nd_ate_firearms_trade_desc: "Ашанти охотно переняли европейское огнестрельное оружие, особенно мушкет «Длинный датчанин», обменивая золото и пленников на оружие, которое давало их армиям разрушительную огневую мощь." #NT!
 nd_ate_goldweight_standards: "Стандарты золотого веса" #NT!
 nd_ate_goldweight_standards_desc: "Стандартизированная система латунных золотых весов, сочетающая в себе исламские, португальские и местные размеры, обеспечивает точные коммерческие операции во всем торговом мире Акан.\n\n#italic Доступно в: $nd_ate_gold_treasury$#!" #NT!
 nd_ate_northern_trade_routes: "Северные торговые пути" #NT!
 nd_ate_northern_trade_routes_desc: "Великие торговые пути, идущие на север от Кумаси, соединяют лесную зону с Сахелем, обменивая орехи колы, золото и ткань на соль, домашний скот, масло ши и импортные товары." #NT!
 nd_ate_queen_mother: "Асантемаа" #NT!
 nd_ate_queen_mother_desc: "Королева-мать разделяет ответственность за государственные дела, консультируя Асантехене и обладая полномочиями проверять его власть, что является замечательным институтом совместного управления." #NT!
 nd_ate_craft_specialization: "Специализация ремесленной деревни" #NT!
 nd_ate_craft_specialization_desc: "Кумаси окружают специализированные ремесленные деревни: Бонвир для ткачества тканей, Нтонсо для крашения тканей, Панкроно для гончарного дела, Ахвиаа для обработки дерева и Бреман для ювелирного дела.\n\n#italic Доступно в: $nd_ate_gold_treasury$#!" #NT!
 nd_ate_rolling_fire: "Тактика перекатного огня" #NT!
 nd_ate_rolling_fire_desc: "Мушкетеры Ашанти продвигаются несколькими линиями, каждая из которых дает залпы и отправляется в тыл для перезарядки. Эта техника перекатного огня поддерживает постоянное давление на противника." #NT!
 nd_ate_coast_trade: "Прибрежные торговые отношения" #NT!
 nd_ate_coast_trade_desc: "Торговля с европейскими фортами на побережье, сначала с португальцами в Эльмине, затем с голландцами и британцами, приносит во внутренние районы огнестрельное оружие, ткани и промышленные товары." #NT!
 nd_ate_meritocratic_reforms: "Меритократические реформы" #NT!
 nd_ate_meritocratic_reforms_desc: "Асантехене Осей Квадво заменил наследственные назначения системой, основанной на заслугах, превратив горнистов Асоквафо в профессиональную академию государственной службы." #NT!
 nd_ate_asokwafo_school: "Государственная служба Асоквафо" #NT!
 nd_ate_asokwafo_school_desc: "Асоквафо, преобразованная из королевских музыкантов в школу подготовки государственных служащих, выпускает администраторов, назначаемых по способностям, а не по рождению." #NT!
 nd_ate_military_modernization: "Армия Осэя Бонсу" #NT!
 nd_ate_military_modernization_desc: "При Осеи Бонсу армия Ашанти была модернизирована за счет улучшенного огнестрельного оружия, лучшей организации и тактики, способной победить силы под руководством европейцев." #NT!
 nd_ate_provincial_system: "Провинциальная администрация" #NT!
 nd_ate_provincial_system_desc: "Четырехуровневая система управления государством, округом, деревней и родом, которой управляет имперская бюрократия в Кумаси, обеспечивает эффективный контроль над всей Конфедерацией." #NT!
 nd_ate_bantama_tradition: "Мавзолей Бантама" #NT!
 nd_ate_bantama_tradition_desc: "Королевский мавзолей Бантама в Кумаси хранит останки прошлых Асантенесов, его толстые стены отмечены королевскими символами, священное место, связывающее живых с властью предков." #NT!
 nd_ate_odwira_festival: "Фестиваль Одвира" #NT!
 nd_ate_odwira_festival_desc: "Ежегодный фестиваль очищения Одвира возобновляет связи между Асантехене, вождями и народом, вновь подтверждая духовные основы конфедерации." #NT!
 nd_ate_gold_coast_dominance: "Доминирование Золотого Берега" #NT!
 nd_ate_gold_coast_dominance_desc: "Контроль Конфедерации Ашанти над внутренними золотыми приисками и торговыми путями к побережью делает ее доминирующей силой на Золотом Берегу." #NT!
 nd_ate_anglo_ashanti_resistance: "Англо-ашантийское сопротивление" #NT!
 nd_ate_anglo_ashanti_resistance_desc: "Пять англо-ашантийских войн подвергли конфедерацию испытанию против крупнейшей имперской державы мира. Ашанти выиграли первую войну, убив британского губернатора, и устояли на протяжении десятилетий конфликта." #NT!
 nd_ate_standing_army: "Профессиональная постоянная армия" #NT!
 nd_ate_standing_army_desc: "Переход от кланового набора к профессиональной постоянной армии дает Конфедерации Ашанти постоянную военную силу, способную к быстрому развертыванию." #NT!
 nd_ate_kumasi_urban: "Кумаси Урбанизация" #NT!
 nd_ate_kumasi_urban_desc: "Широкие улицы Кумаси, планированные кварталы и обширная инфраструктура делают его одним из величайших городов Западной Африки, центром торговли, управления и культуры." #NT!
 nd_ate_gold_refining: "Аффинаж золота" #NT!
 nd_ate_gold_refining_desc: "Передовые методы очистки и переработки золотого песка увеличивают стоимость основного экспорта Конфедерации и укрепляют ее позиции в международной торговле.\n\n#italic Доступно в: $nd_ate_gold_treasury$#!" #NT!
 nd_ate_judicial_reform: "Судебная реформа" #NT!
 nd_ate_judicial_reform_desc: "Централизация судебной системы под руководством Асантехене как верховного судьи создает единую правовую основу для различных сообществ конфедерации." #NT!
 nd_ate_imperial_roads: "Императорская дорожная сеть" #NT!
 nd_ate_imperial_roads_desc: "Сеть обслуживаемых дорог, расходящихся от Кумаси, обеспечивает быстрое военное развертывание, эффективную торговлю и эффективную связь на обширной территории Конфедерации." #NT!
 nd_ate_war_of_resistance: "Война Золотого Табурета" #NT!
 nd_ate_war_of_resistance_desc: "Восстание Яа Асантеваа в 1900 году против британских требований о Золотом табурете представляет собой последний великий акт военного неповиновения Ашанти: Табурет так и не был сдан." #NT!
 nd_ate_cocoa_economy: "Экономика какао" #NT!
 nd_ate_cocoa_economy_desc: "Переход к выращиванию какао меняет экономику Ашанти, поскольку лесная среда оказывается идеальной для выращивания урожая, который сделает Золотой Берег крупнейшим в мире производителем какао.\n\n#italic Доступно в: $nd_ate_cocoa_plantation$#!" #NT!
 nd_ate_cultural_preservation: "Культурное сохранение" #NT!
 nd_ate_cultural_preservation_desc: "Несмотря на колониальное давление, ашанти сохраняют свои культурные учреждения, систему табуреток, ткачество кенте, золотые изделия, а фестиваль Одвира остается живыми традициями." #NT!
 nd_ate_modern_governance: "Современное управление" #NT!
 nd_ate_modern_governance_desc: "Адаптация традиционного конфедеративного управления к современным институциональным структурам с сохранением власти Асантехене в современной административной структуре." #NT!
 nd_ate_modern_army: "Современная армия Ашанти" #NT!
 nd_ate_modern_army_desc: "Полностью модернизированная военная сила, сочетающая в себе традиционный боевой дух Ашанти с современной организацией, оборудованием и тактикой." #NT!
 nd_ate_prempeh_legacy: "Дипломатическое наследие Премпе" #NT!
 nd_ate_prempeh_legacy_desc: "Асантехене Премпе I, изгнанный британцами в 1896 году, предпочел дипломатию капитуляции. Его достойное сопротивление и возможное возвращение сохранили институт Асантехене для будущих поколений." #NT!
 a_nd_ate_forest_skirmishers: "Аканские лесные застрельщики" #NT!
 a_nd_ate_forest_skirmishers_desc: "Легкие воины тренировались в густых тропических лесах Золотого Берега. Они бесшумно движутся через подлесок, нанося удары из засады, прежде чем снова раствориться в деревьях." #NT!
 a_nd_ate_asafo_musketeer: "Асафо Мушкетеры" #NT!
 a_nd_ate_asafo_musketeer_desc: "Вооруженные мушкетами воины были организованы в роты асафо под командованием своих вождей. Они держат оружие под одним и тем же углом и стреляют залпами по команде, сочетая традиционную клановую лояльность с огнестрельной дисциплиной." #NT!
 a_nd_ate_dane_gun_infantry: "Датская артиллерийская пехота" #NT!
 a_nd_ate_dane_gun_infantry_desc: "Солдаты ашанти, вооруженные «длинным датчанином», любимым европейским торговым мушкетом, обучались технике перекатного огня, что заслужило уважение европейских наблюдателей." #NT!
 a_nd_ate_bonsu_guard: "Бонсу Страж" #NT!
 a_nd_ate_bonsu_guard_desc: "Элитный гвардеец Асантехене Осей Бонсу, закаленные в боях ветераны, которые победили британского губернатора и унесли его череп в качестве трофея. Их боевой дух непоколебим." #NT!
 a_nd_ate_professional_infantry: "Профессиональная пехота Ашанти" #NT!
 a_nd_ate_professional_infantry_desc: "Постоянные солдаты постоянной армии Ашанти, которых содержат круглый год, а не набирают сезонно. Они представляют собой военную эволюцию Конфедерации от кланового набора к профессиональной силе." #NT!
 a_nd_ate_modern_infantry: "Современная пехота ашанти" #NT!
 a_nd_ate_modern_infantry_desc: "Окончательная эволюция военной традиции Ашанти, современные солдаты, унаследовавшие боевой дух воинов Осэя Туту и ​​организационную дисциплину реформ Осея Бонсу." #NT!
 nd_ate_gold_treasury: "Золотая казна" #NT!
 nd_ate_gold_treasury_desc: "Королевское хранилище, где принимается золотой песок, взвешивается на стандартных латунных гирях и хранится. Он служит одновременно казначейством и торговым центром." #NT!
 nd_ate_asante_shrine: "Храм Асанте" #NT!
 nd_ate_asante_shrine_desc: "Сложный храмовый дом, построенный в традиционном стиле Асанте из глины и глины, с замысловатыми настенными украшениями в честь могущественных божеств и духов предков." #NT!
 nd_ate_stool_house: "Табурет Дом" #NT!
 nd_ate_stool_house_desc: "Священное хранилище, в котором хранятся клановые табуреты, олицетворяющие душу каждого вождества. В самом важном находится сам Золотой Табурет, духовный центр Конфедерации." #NT!
 nd_ate_kente_workshop: "Кенте Мастерская" #NT!
 nd_ate_kente_workshop_desc: "Специализированная ткацкая мастерская, где мастера-ткачи производят ткань кенте, полосатый текстиль из шелка и хлопка с узорами и цветами, предназначенными для королевской семьи и элиты." #NT!
 nd_ate_palace_complex: "Дворцовый комплекс Асанте" #NT!
 nd_ate_palace_complex_desc: "Обширный королевский комплекс в стиле Кумаси с широкими дворами, палатами с соломенной крышей и обширными настенными украшениями, которые поразили европейских посетителей." #NT!
 nd_ate_trade_lodge: "Торговый Домик" #NT!
 nd_ate_trade_lodge_desc: "Перевалочная станция на северных торговых путях, где торговцы Ашанти обменивают орехи колы, золото и ткань на соль, скот и товары со всего Сахеля." #NT!
 nd_ate_asokwafo_academy: "Академия Асоквафо" #NT!
 nd_ate_asokwafo_academy_desc: "Школа подготовки меритократической государственной службы, где талантливые молодые люди со всей Конфедерации учатся управлению, дипломатии и государственному управлению." #NT!
 nd_ate_royal_mausoleum: "Королевский мавзолей" #NT!
 nd_ate_royal_mausoleum_desc: "Погребальный комплекс в стиле бантама с толстыми стенами, отмеченными королевскими символами, в котором хранятся останки прошлых Асантенесов в торжественном пространстве, предназначенном для размышлений и общения с предками." #NT!
 nd_ate_abrafoo_foundry: "Литейный завод Абрафу" #NT!
 nd_ate_abrafoo_foundry_desc: "Мастерская гильдии медников абрафу, где искусные мастера отливают в технике выплавляемой модели сосуды кудуо, золотые гири и обрядовые предметы." #NT!
 nd_ate_foundry_maintenance: "Литейное производство" #NT!
 nd_ate_foundry_maintenance_desc: "Медные слитки и древесный уголь служат топливом для латунных печей, из которых производят декоративные сосуды кудуо и гири." #NT!
 nd_ate_trade_road_station: "Станция Империал-Роуд" #NT!
 nd_ate_trade_road_station_desc: "Остановка для отдыха и пункт сбора платы за проезд на дорожной сети, исходящей от Кумаси, облегчающей как военное, так и коммерческое движение по всей Конфедерации." #NT!
 nd_ate_cocoa_plantation: "Плантация какао" #NT!
 nd_ate_cocoa_plantation_desc: "Возделываемая роща какао-деревьев в лесной зоне, производящая бобы, которые превратят Золотой Берег в ведущего мирового экспортера какао." #NT!
 nd_ate_gold_dust_weighing: "Взвешивание золотой пыли" #NT!
 nd_ate_gold_dust_weighing_desc: "Тщательное взвешивание и анализ золотого песка с использованием стандартных латунных гирй, обеспечивающих справедливое измерение в каждой коммерческой сделке." #NT!
 nd_ate_brass_casting: "Акан Латунное Литье" #NT!
 nd_ate_brass_casting_desc: "Мастера-металлисты используют технику литья по выплавляемым моделям для изготовления латунных гирей, ритуальных предметов и изысканных регалий двора Асантехене." #NT!
 nd_ate_kente_production: "Производство тканей Кенте" #NT!
 nd_ate_kente_production_desc: "Узкие полоски шелка и хлопка сплетены замысловатыми узорами и сшиты вместе, образуя ослепительные мантии кенте, которые носят члены королевской семьи Ашанти." #NT!
 nd_ate_goldweight_minting: "Стандартизация золотого веса" #NT!
 nd_ate_goldweight_minting_desc: "Производство стандартизированных латунных золотых гирь, объединяющих исламскую, португальскую и местные системы измерения в единый коммерческий стандарт." #NT!
 nd_ate_craft_villages: "Производство в ремесленной деревне" #NT!
 nd_ate_craft_villages_desc: "Специализированные ремесленные деревни вокруг Кумаси, каждая из которых посвящена одному искусству: Бонвир - ткачество, Нтонсо - крашение, Панкроно - гончарное дело, Ахвиа - обработка дерева." #NT!
 nd_ate_gold_refining_process: "Процесс переработки золота" #NT!
 nd_ate_gold_refining_process_desc: "Передовые технологии очистки золотого песка, производства золота более высокого качества для торговли и увеличения стоимости основного экспорта Конфедерации." #NT!
 nd_ate_cocoa_processing: "Переработка какао" #NT!
 nd_ate_cocoa_processing_desc: "Какао-бобы ферментируются, сушатся и перерабатываются на экспорт, превращая необработанную лесную продукцию в ценный товар для международных рынков." #NT!
 nd_ate_treasury_maintenance: "Казначейские операции" #NT!
 nd_ate_treasury_maintenance_desc: "Текущая работа золотой казны, включая обслуживание весов, гирь и хранилищ." #NT!
 nd_ate_shrine_upkeep: "Содержание храма" #NT!
 nd_ate_shrine_upkeep_desc: "Содержание храмовых домов, включая ремонт глинобитных стен и подношение духам." #NT!
 nd_ate_stool_house_maintenance: "Уход за табуреткой" #NT!
 nd_ate_stool_house_maintenance_desc: "Уход и содержание священного хранилища стульев, включая охрану и ритуальное обслуживание клановых стульев." #NT!
 nd_ate_kente_weaving_pm: "Кенте Уивинг" #NT!
 nd_ate_kente_weaving_pm_desc: "Импортированный шелк и местные красители вплетены в яркие полосатые узоры, уникальные для текстильного искусства Ашанти." #NT!
 nd_ate_palace_upkeep: "Содержание дворца" #NT!
 nd_ate_palace_upkeep_desc: "Обслуживание комплекса королевского дворца, включая древесину, керамику и ткань для ремонта и украшения." #NT!
 nd_ate_trade_lodge_maintenance: "Обслуживание лоджа" #NT!
 nd_ate_trade_lodge_maintenance_desc: "Содержание торговых домиков вдоль северных маршрутов, обеспечивающих убежище и удобства для путешествующих торговцев." #NT!
 nd_ate_academy_maintenance: "Операции Академии" #NT!
 nd_ate_academy_maintenance_desc: "Предоставление письменных принадлежностей и принадлежностей для Академии государственной службы Асоквафо." #NT!
 nd_ate_mausoleum_maintenance: "Содержание мавзолея" #NT!
 nd_ate_mausoleum_maintenance_desc: "Содержание царского мавзолея, требующего камня для структурного ремонта и ритуального ухода за погребальными камерами." #NT!
 nd_ate_road_maintenance: "Содержание дорог" #NT!
 nd_ate_road_maintenance_desc: "Содержание императорской дорожной сети, требующее пиломатериалов для мостов и камня для дорожного покрытия." #NT!
 nd_ate_cocoa_cultivation: "Выращивание какао" #NT!
 nd_ate_cocoa_cultivation_desc: "В лесной зоне вырубаются и ухаживают за какао-бобами, производя сырые какао-бобы для сушки и экспорта." #NT!
 nd_ate_formed_tt: "Была образована Конфедерация Ашанти." #NT!
 nd_ate_path_a_tt: "Выбрать авторитет золотого табурета" #NT!
 nd_ate_path_b_tt: "Выбрали лордов Золотого Берега" #NT!
 nd_ate_destiny: "Судьба Ашанти" #NT!
 nd_ate_destiny_desc: "Конфедерация Ашанти создана, но ее окончательная форма еще не определена. Золотой Табурет дает власть; золотые прииски дают богатство. Оба пути ведут к величию." #NT!
 nd_ate_dest_stool_wars: "Войны табуретки" #NT!
 nd_ate_dest_stool_wars_desc: "Золотой табурет требует подчинения. Подчините северные королевства Ашанти, завоевав Дагбон и его торговый центр Салага. Накопите 1000 золотых для финансирования кампании." #NT!
 nd_ate_dest_great_ashanti: "Великий Ашанти" #NT!
 nd_ate_dest_great_ashanti_desc: "Конфедерация должна распространить свою власть за пределы лесного пояса. Завоюйте Ойо-Иле, столицу йоруба, и крепость Боргу Никки. Поддерживать армию из 50 полков и престиж выше 50." #NT!
 nd_ate_dest_ashanti_imperium: "Ашанти Империум" #NT!
 nd_ate_dest_ashanti_imperium_desc: "Постройте империю, простирающуюся от Сахары до моря. Покорите Тимбукту, Бенин и Ниани. Выставьте армию из 75 полков с 3000 золота в казне и престижем выше 75." #NT!
 nd_ate_dest_coast_control: "Лорды побережья" #NT!
 nd_ate_dest_coast_control_desc: "Захватите контроль над западной частью Золотого Берега, захватив Аксим и Аполлонию на территории Нзимы. Эти прибрежные позиции дают прямой доступ к европейской торговле. Накопите 1000 золотых." #NT!
 nd_ate_dest_golden_trade: "Золотая сделка" #NT!
 nd_ate_dest_golden_trade_desc: "Превратите конфедерацию в банковскую державу. Создайте банковское учреждение, накопите 2000 золота, обеспечьте поток слоновой кости через ваши рынки и поддерживайте престиж выше 50." #NT!
 nd_ate_dest_gold_empire: "Империя золота" #NT!
 nd_ate_dest_gold_empire_desc: "Постройте самое богатое государство в Западной Африке. Завоюйте Дженне, чтобы контролировать транссахарский торговый терминал, вступить в институт глобальной торговли, накопить 3000 золота, достичь 75 престижа и развить свою территорию до 500 общего уровня развития." #NT!
 nd_ate.7.t: "Судьба Ашанти" #NT!
 nd_ate.7.d: "Конфедерация стоит на пороге величия. Будь то власть Золотого Табурета или сила золотого песка, Ашанти оставят свой след в мире. Путь, который мы выбрали, определит нацию для будущих поколений." #NT!
 nd_ate.7.a: "Наша судьба ждет." #NT!
 nd_ate.8.t: "Дагбон представляет" #NT!
 nd_ate.8.d: "Северное королевство Дагбон пало в руки Ашанти. Йенди, резиденция Я-На, теперь признает власть Золотого Табурета. Великий торговый центр Салага, где орехи колы и золото обменивают на соль и скот, принадлежит нам. Военная сфера действия Конфедерации теперь простирается за пределы леса в саванну." #NT!
 nd_ate.8.a: "Авторитет Табурета растет." #NT!
 nd_ate.9.t: "Большой Ашанти" #NT!
 nd_ate.9.d: "Армии Ашанти прошли далеко за пределы лесной родины. Ойо-Иле, великая столица йоруба, пала, и воины Боргу сдались. Конфедерация теперь контролирует территорию, простирающуюся через всю внутреннюю часть побережья Гвинеи.\n\nЭто расширение требует выбора. Мы можем построить военную машину, которая быстро мобилизуется и сокрушает противников за счет скорости и численности, или мы можем создать гарнизонное государство с укрепленными позициями, разведывательными сетями и дипломатическими рычагами для нанесения удара в нужный момент." #NT!
 nd_ate.9.a: "Скорость и подавляющая сила." #NT!
 nd_ate.9.b: "Фортификация и разведка." #NT!
 nd_ate.10.t: "Империя Ашанти" #NT!
 nd_ate.10.d: "От Тимбукту в Сахеле до Бенина на побережье, от Ниани на западе до восточных лесов — Империя Ашанти простирается на обширной территории Западной Африки. Ни одна сила на континенте не может сравниться с армиями, марширующими под знаменем Золотой Табуретки.\n\nНо как управлять этой империей? С помощью террора и подавляющей военной силы, которая подавляет любое сопротивление, или с помощью более взвешенного подхода, который восстанавливает завоеванные земли и превращает врагов в продуктивных подданных?" #NT!
 nd_ate.10.a: "Пусть они боятся имени Ашанти." #NT!
 nd_ate.10.b: "Восстановите то, что сломала война." #NT!
 nd_ate.11.t: "Берег наш" #NT!
 nd_ate.11.d: "Западный Золотой Берег теперь находится под твердым контролем Ашанти. Аксим и Аполлония на территории Нзимы дают конфедерации прямой доступ к европейским торговым постам. Торговцы Ашанти больше не должны полагаться на посредников, чтобы добраться до кораблей, стоящих на якоре. Золотая пыль стекает прямо из рудников на прибрежные склады." #NT!
 nd_ate.11.a: "Золото течёт из леса в море." #NT!
 nd_ate.12.t: "Мастера золотой торговли" #NT!
 nd_ate.12.d: "Конфедерация Ашанти внедрила современную банковскую практику и зарекомендовала себя как финансовое сердце Западной Африки. Слоновая кость, золото, орехи кола и ткани продаются через рынки, где торговцы Ашанти устанавливают цены. Богатство Конфедерации больше измеряется не только золотым песком, но и сложными инструментами международной торговли.\n\nОткроем ли мы наши порты для всех желающих, приветствуя любой корабль, доставляющий товары для торговли, и расширив нашу коммерческую деятельность через моря? Или нам следует развивать торговую аристократию, класс элитных торговцев с дипломатическими связями и финансовыми ресурсами, позволяющими доминировать в региональной торговле?" #NT!
 nd_ate.12.a: "Откройте порты миру." #NT!
 nd_ate.12.b: "Развивайте наших торговых принцев." #NT!
 nd_ate.13.t: "Империя золота" #NT!
 nd_ate.13.d: "Дженне упала. Транссахарский торговый терминал, где золото из леса встречается с солью из пустыни и товарами со всего исламского мира, теперь является владением Ашанти. Коммерческая сеть конфедерации простирается от побережья Атлантического океана до края Сахары, от лесных золотых приисков до огромных рынков Сахеля.\n\nЭто вершина коммерческой мощи Ашанти. Сможет ли империя объединить множество народов и вероисповеданий, построив космополитическую торговую цивилизацию, которая будет приветствовать всех? Или же ей следует инвестировать свое золото в корабли и военно-морскую мощь, распространяя влияние Ашанти на моря?" #NT!
 nd_ate.13.a: "Тысяча народов под одной золотой крышей." #NT!
 nd_ate.13.b: "Постройте флот, достойный нашего богатства." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_war_machine: "Военная машина Ашанти" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_war_machine: "Военный аппарат конфедерации превратился в военную машину быстрого реагирования. Линии снабжения расширяются, гарнизоны усиливаются, а новые полки формируются с ужасающей скоростью." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_garrison_state: "Гарнизонный штат Ашанти" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_garrison_state: "Сеть укрепленных позиций и шпионских сетей дает Конфедерации Ашанти интеллект и стратегическое терпение, позволяющее выбрать идеальный момент для удара." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_terror_of_ashanti: "Ужас Ашанти" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_terror_of_ashanti: "Само имя Ашанти вселяет страх в соседние народы. Наемники стекаются под знамя, и укрепленные города падают перед штурмом. Но бесконечные завоевания истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_ashanti_pax: "Пакс Ашанти" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_ashanti_pax: "Империум Ашанти восстанавливает то, что разрушило война. Покоренные народы переселяются, города восстанавливаются, а дипломаты отправляются для обеспечения мира." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_open_ports: "Политика открытых портов" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_open_ports: "Порты Ашанти принимают суда со всего мира. Опустошенные прибрежные районы быстро восстанавливаются, а коммерческое влияние Конфедерации распространяется на отдаленные берега." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_merchant_princes: "Торговые князья Кумаси" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_merchant_princes: "Элитный класс торговцев-дипломатов Ашанти поддерживает коммерческие отношения по всему региону, хотя их внимание к торговле в некоторой степени сказывается на военной готовности." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_cosmopolitan_empire: "Космополитическая Империя" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_cosmopolitan_empire: "Коммерческая империя Ашанти объединяет торговцев и поселенцев всех вероисповеданий. Это открытое общество, поддерживаемое военно-морскими силами, распространяет влияние далеко за пределы Западной Африки." #NT!
 STATIC_MODIFIER_NAME_nd_ate_dest_golden_fleet: "Золотой Флот" #NT!
 STATIC_MODIFIER_DESC_nd_ate_dest_golden_fleet: "Золото Ашанти финансирует флот торговых и военных кораблей. Верфи работают бешеными темпами, хотя инвестиции отвлекают ресурсы от сухопутной армии." #NT!
 nd_ate_war_council: "Военный совет Ашанти" #NT!
 nd_ate_war_council_desc: "Высший военный совет Империи Ашанти, где величайшие генералы Конфедерации планируют кампании, простирающиеся от Сахары до моря." #NT!
 nd_ate_great_market: "Большой рынок Кумаси" #NT!
 nd_ate_great_market_desc: "Легендарный центральный рынок Кумаси, где золотой песок, слоновая кость, орехи колы, ткани кентэ и товары со всего мира переходят из рук в руки под бдительным присмотром королевских торговых чиновников." #NT!
 nd_ate_war_council_maintenance: "Операции Военного совета" #NT!
 nd_ate_war_council_maintenance_desc: "Содержание залов военного совета, включая карты, оружие для демонстрации и провизию для генералов, планирующих кампании Конфедерации." #NT!
 nd_ate_great_market_maintenance: "Рыночные операции" #NT!
 nd_ate_great_market_maintenance_desc: "Содержание огромного рынка, включая строительство ларьков, санитарию и зарплату королевским торговым инспекторам, которые обеспечивают честную торговлю." #NT!
 AUTO_MODIFIER_NAME_nd_ate_bureaucracy_authority: "Бюрократическое управление Асантемана" #NT!
 AUTO_MODIFIER_DESC_nd_ate_bureaucracy_authority: "При формировании Конфедерации предоставляются рамки постоянного административного офиса. В сочетании с аппаратом Манхии в Кумаси это открывает три места, в которых Асантехене могут устанавливать исторические институты управления Акан." #NT!
 ate_asantemanhyiamu_bureaucracy: "Асантеманьяму" #NT!
 ate_asantemanhyiamu_bureaucracy_desc: "В Одвире каждый год асантехене созывали асантеманхьяму, национальное собрание аманхене: верховных вождей составляющих государств акан (Мампонг, Двабен, Беквай, Кокофу, Нсута, Кумаву и другие, добавленные в результате завоевания). Собрание ратифицировало объявления войны, подтверждало преемственность, разрешало споры между оманами и утверждало квоты налогов, которые будет предоставлять каждый округ. Его власть основывалась на учредительном договоре около 1701 года, согласно которому союзники Осея Туту объединили суверенитет под властью Сика Два Кофи, сохранив при этом свои наследственные стула. Это была федеральная конституция королевства: без ее согласия ни один асантехене не мог принуждать вождей." #NT!
 ate_nhenkwaa_bureaucracy: "Дворцовый дом Нхенкваа" #NT!
 ate_nhenkwaa_bureaucracy_desc: "Нхенкваа представляли собой постоянную касту дворцовых слуг, прикрепленных непосредственно к Асантехене в Манхии: ружейники (атумтуфо), барабанщики (акьеремаде), трубачи в рожки (асоквафо), палачи (абрафо) и суманквафо, которые поддерживали защитные талисманы трона. Набранные в основном из военнопленных и несвободных, они стояли вне матрилинейной клановой структуры и всем были обязаны королю; многие стали конфиденциальными агентами и послами. Превратив дворцовое хозяйство в самостоятельную исполнительную власть, Опоку Уэр (годы правления 1720–1750) и Осей Квадво (годы правления 1764–1777) обошли аманхене и построили государственный аппарат, который мог функционировать без согласия вождей." #NT!
 ate_akwantufo_bureaucracy: "Дорожные инспекторы Аквантуфо" #NT!
 ate_akwantufo_bureaucracy_desc: "Восемь великих дорог расходились от Кумаси к приграничным провинциям, прорезанным через тропические леса и служившим артериями Конфедерации. Каждый из них патрулировали надзиратели акванмофо под управлением аквансрафохене, а сборщики пошлин (нквансрафо) на каждой границе с Оманом взимали пошлины с орехов колы, кенте, золота, пленников, соли и европейских торговых товаров. Посольство Боудича в 1817 году описало тротуар из утрамбованной земли, очищенной от растительности, — сложную систему общественных работ, уникальную среди королевств побережья Гвинеи. Дороги одновременно служили инфраструктурой сбора налогов: штандарт атумтуфо, проезжавший по каждой дороге, собирал вдоль нее районы." #NT!
 ate_daban_treasury_bureaucracy: "Дабанская сокровищница золотого песка" #NT!
 ate_daban_treasury_bureaucracy_desc: "Золотая пыль (sika futuro) была валютой Конфедерации, ее взвешивали на латунных гирях абраммуо, отлитых в геометрических и фигуральных формах. Дабаном (королевской казной в Манхии) управлял Гьяасевахене в качестве главного казначея, Санахене в качестве заместителя, а фотосанфохене проверял весы на каждом рынке. Национальный стандарт абраммуо сделал возможной торговлю на большие расстояния между рынками Акан без каких-либо споров, и все золото, добытое в королевстве, принадлежало королевским хранилищам. Боудич видел груды пыли, хранившиеся в мешках из слоновьих шкур, которые, по его оценкам, стоили сотни фунтов золота в каждой камере." #NT!
 ate_kotoko_adamfo_bureaucracy: "Совет Котоко и Адамфо" #NT!
 ate_kotoko_adamfo_bureaucracy_desc: "Котоко был внутренним военным советом Асантехене, названным в честь дикобраза («если ты убьешь тысячу, придет тысяча»), который был эмблемой королевства. В него входили великие капитаны (Бантамахене как старший командующий, Адонтенхен в авангарде, Нифахене на правом фланге, Бенкумхене на левом фланге, Кийдомхене на тылу), встречавшиеся под деревом Богьяве. Параллельно с этим действовала система Адамфо: каждому даннику и каждой иностранной державе был назначен «королевский друг» в Кумаси, который занимался всей дипломатической деятельностью и нёс личную ответственность за любой спор. Вместе они предоставили Ашанти профессиональный военный и посольский аппарат, не имеющий аналогов на побережье Гвинеи." #NT!
 STATIC_MODIFIER_NAME_nd_ate_kotoko_council: "Совет Асантеманхьяму" #NT!
 STATIC_MODIFIER_DESC_nd_ate_kotoko_council: "Совет вождей, объединяющий государства Акан под Золотой Табуреткой. Мампонг, Бекваи, Джуабен, Кокофу, Нсута, Кумаси: каждый аманхен сохраняет реальную власть в пределах своего оманхенского государства. Асантехене избирается советом и может быть им лишен полномочий. Конфедерация связана скорее ритуалом, чем абсолютизмом: Золотой табурет стоит над человеком, который на нем сидит." #NT!
