l_russian:
  # === Variable Tooltips === 
 nd_alm_formed_tt: "Образовался халифат Альмохадов." #NT!
 nd_alm_path_a_tt: "Путь Муминуна выбран" #NT!
 nd_alm_path_b_tt: "Путь халифского двора выбран" #NT!
  
  # === Formation Modifiers === 
 STATIC_MODIFIER_NAME_nd_alm_mahdist_revolution: "Махдистская революция" #NT!
 STATIC_MODIFIER_DESC_nd_alm_mahdist_revolution: "Пуританская реформа Ибн Тумарта прожгла Халифат. Муминун носят оружие с уверенностью в спасении, а еретики не знают пощады; но бдительные инквизиторы веры Альмохадов оставляют мало места для старых школ и их терпимых меньшинств." #NT!
 STATIC_MODIFIER_NAME_nd_alm_caliphal_civilization: "Халифская цивилизация" #NT!
 STATIC_MODIFIER_DESC_nd_alm_caliphal_civilization: "Марракеш Якуба аль-Мансура становится маяком фальсафа: Ибн Рушд комментирует Аристотеля, Маймонид сочиняет Мишне Тору при своем дворе, гудят бумажные фабрики и андалузские ученые наполняют библиотеки. Халифат покоится спокойно в своем величии, возможно, даже слишком легко." #NT!
  
  # === Advance Event Modifiers === 
 STATIC_MODIFIER_NAME_nd_alm_tinmel_zeal: "Рвение Тинмела" #NT!
 STATIC_MODIFIER_DESC_nd_alm_tinmel_zeal: "Последователи Махди маршируют с Атласа с пылом откровения. В дело стекаются новобранцы, обученные Муминун суровой дисциплине веры Альмохадов." #NT!
 STATIC_MODIFIER_NAME_nd_alm_tinmel_consolidation: "Консолидация движения" #NT!
 STATIC_MODIFIER_DESC_nd_alm_tinmel_consolidation: "Вместо того, чтобы торопить момент, халиф пускает корни: совет пятидесяти официально оформлен, берберские племена получили свои ранги, а новая ортодоксия незаметно укоренилась в администрации." #NT!
 STATIC_MODIFIER_NAME_nd_alm_andalusi_legions: "Андалузские легионы" #NT!
 STATIC_MODIFIER_DESC_nd_alm_andalusi_legions: "Уязвленный поражением в великой битве, халиф призывает всех способных людей переправиться через пролив. Свежая андалузская пехота и берберские джунды снова вливаются в иберийские поля, боевой дух королевства заново возрождается в жажде мести." #NT!
 STATIC_MODIFIER_NAME_nd_alm_african_retreat: "Африканский бастион" #NT!
 STATIC_MODIFIER_DESC_nd_alm_african_retreat: "Халиф отступает в Марракеш и восстанавливает Магриб. Если Аль-Андалус должен быть потерян, то, по крайней мере, африканское сердце выдержит; доходы восстанавливаются, а гарнизоны увеличиваются." #NT!
  
 STATIC_MODIFIER_NAME_nd_alm_aristotelian_court: "Суд комментатора" #NT!
 STATIC_MODIFIER_DESC_nd_alm_aristotelian_court: "Комментарии Ибн Рушда читаются при самом дворе халифа; Еврейские, христианские и мусульманские философы говорят о метафизике на равных. Марракеш становится маяком фалсафа, привлекающим ученых из Толедо в Багдад." #NT!
 STATIC_MODIFIER_NAME_nd_alm_orthodox_purge: "Православие торжествует" #NT!
 STATIC_MODIFIER_DESC_nd_alm_orthodox_purge: "Ибн Рушд сослан, его книги сожжены на базаре Кордовы. Проповедники Халифата маршируют за очищенную доктрину; обращение покоренных народов ускоряется, единство уммы подтверждается." #NT!
  
 STATIC_MODIFIER_NAME_nd_alm_ribat_al_fath: "Рибат аль-Фатх" #NT!
 STATIC_MODIFIER_DESC_nd_alm_ribat_al_fath: "Якуб аль-Мансур основывает свою огромную новую столицу в устье Бу-Регрега: укрепленный город завоеваний, над которым возвышается Башня Хасана. Строительные бригады работают с имперской скоростью по всему королевству." #NT!
 STATIC_MODIFIER_NAME_nd_alm_marrakesh_glory: "Слава Марракеша" #NT!
 STATIC_MODIFIER_DESC_nd_alm_marrakesh_glory: "Вместо того, чтобы строить заново, халиф украшает существующую столицу. Кутубия отделана элегантно, как драгоценность, ворота города перестроены, а имя Альмохадов имеет вес от Севильи до Каира." #NT!
  
  # === Formation Event === 
 nd_alm.1.t: "Муминун суверенны" #NT!
 nd_alm.1.d: "Из медресе со скалистыми стенами в Тинмеле, где Ибн Тумарт проповедовал, что есть один Бог и одна умма, ваши солдаты спустились, чтобы разрушить завесу мурабита и свергнуть Альморавидов. Марракеш пал; зелено-белые штандарты Альмохадов реют над касбами Магриба. С этого момента вопрос о том, каким будет ваш Халифат, больше нельзя откладывать.\n\nОстанетесь ли вы армией мщения Махди, муминунами, которые объединяют умму мечом и проповедью и не терпят никаких компромиссов? Или вы станете самостоятельной цивилизацией, привлекая философов и ученых Аль-Андалуса ко двору, где читают Аристотеля и пишет Маймонид?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_alm.1.a: "Мы армия Махди: умма будет едина" #NT!
 nd_alm.1.b: "Марракеш станет новой Кордовой: двор философов" #NT!
  
  # === DHE Events === 
 nd_alm.2.t: "Мечеть в Тинмеле" #NT!
 nd_alm.2.d: "Высоко в долине Сус, на седловине, где Ибн Тумарт впервые собрал племена Масмуда и провозгласил Махдию, Абд аль-Мумин построил великую мечеть Тинмель. Его стены укрывают могилу основателя. Паломники, которые приходят сюда, не являются обычными поклонниками: они являются новобранцами незавершенного движения и спрашивают, следует ли сохранить или урегулировать революционный момент. Совет пятидесяти ждет слова халифа." #NT!
 nd_alm.2.a: "Поддержите революцию: меч еще не закончился" #NT!
 nd_alm.2.b: "Консолидировать движение: необходимо заложить основы" #NT!
  
 nd_alm.3.t: "Лас-Навас-де-Толоса" #NT!
 nd_alm.3.d: "На высокой месете Толосы объединенные войска Кастилии, Арагона и Наварры разгромили армию халифа. Халиф ан-Насир бежит на юг через Сьерра-Морену; лагерные палатки и зеленые штандарты разбросаны. Само ядро ​​обороны Андалусии опустошено. В Марракеше остро стоит вопрос: пересечем ли мы пролив снова со всем, что у нас есть, или мы отступим в Африке и позволим Аль-Андалусу постоять за себя?" #NT!
 nd_alm.3.a: "Перекреститесь снова: каждый человек и каждый меч в Иберию." #NT!
 nd_alm.3.b: "Уход на юг: сердце Африки не будет потеряно" #NT!
  
 nd_alm.4.t: "Ибн Рушд из Кордовы" #NT!
 nd_alm.4.d: "Абу аль-Валид Мухаммад ибн Рушд, кади Кордовы и врач халифа, завершил свой Длинный комментарий к «Метафизике» Аристотеля. В Каире, Толедо и Париже его имя произносят с трепетом. При вашем дворе еврейский философ Маймонид только что завершил «Путеводитель для растерянных». Фукаха Марракеша недовольны: они называют философов иностранными лазутчиками и требуют возвращения к чистому вероучению Ибн Тумарта." #NT!
 nd_alm.4.a: "Защищайте философов: Халифат должен лидировать в мышлении" #NT!
 nd_alm.4.b: "Сожгите книги: ортодоксальность нельзя разбавлять" #NT!
  
 nd_alm.5.t: "Башня Хасана" #NT!
 nd_alm.5.d: "На утесе над Бу-Регрегом, где Абд аль-Мумин когда-то воздвиг касбу, халиф Якуб аль-Мансур командовал огромной новой столицей: Рибат аль-Фатх, Крепостью Победы. Ее центральным элементом должна стать мечеть, большая, чем любая другая в западных землях, с минаретом, который затмит Кутубию. Каменщики тысячами добывают песчаник, и имперская казна истекает кровью. Некоторые придворные призывают к умеренности: лучше закончить Кутубию и украсить имеющиеся города, чем строить новую метрополию, которая нам, возможно, не понадобится." #NT!
 nd_alm.5.a: "Постройте Рибат аль-Фатх: Халифат заслуживает завоевательной столицы" #NT!
 nd_alm.5.b: "Украсьте существующие города: слава принадлежит Марракешу" #NT!
  
  # === Advances === 
 nd_alm_tinmel_foundation: "Фонд Тинмел" #NT!
 nd_alm_tinmel_foundation_desc: "Горное медресе Ибн Тумарта в Тинмеле, в долине Сус Высокого Атласа, было колыбелью движения Альмохадов. Здесь он провозгласил Махдию, проповедовал доктрину божественного единства (таухид) и собрал племена масмуда, которые впоследствии стали армией Абд аль-Мумина." #NT!
 nd_alm_masmuda_infantry: "Масмуда Пехота" #NT!
 nd_alm_masmuda_infantry_desc: "В отличие от Альморавидов, которые опирались на сахарскую верблюжью конницу, армия Альмохадов была построена вокруг плотных пехотных формирований полукочевых берберов Масмуда Высокого Атласа: копейщиков и метателей копья, организованных племенной иерархией." #NT!
 nd_alm_zenata_horsemen: "Зенатские всадники" #NT!
 nd_alm_zenata_horsemen_desc: "Зенатские берберы с высокогорного плато представляли собой легкую кавалерию армий Магриби: застрельщики и уланы, которые сражались, применяя тактику атаки и притворного отступления карр ва фарр, верхом на быстрых североафриканских конях." #NT!
 nd_alm_kasbah_tradition: "Касба Традиция" #NT!
 nd_alm_kasbah_tradition_desc: "Губернаторы Альмохадов управляли своими городами из касбы — укрепленной цитадели, возвышающейся над Мединой, с собственными стенами, воротами, зернохранилищами и казармами. Марракеш, Фес, Севилья и Рабат получили касбы Альмохадов." #NT!
 nd_alm_council_of_ten: "Совет Десяти" #NT!
 nd_alm_council_of_ten_desc: "Государством Альмохадов управляла иерархия советов, идущих от халифа: Ахль ад-дар (Совет десяти) из близких родственников и доверенных шейхов, затем Совет пятидесяти, а ниже него — собрания племен масмуда. Это многослойное советское правительство тесно связало режим с его берберской базой." #NT!
  
 nd_alm_minaret_tradition: "Традиция минарета Альмохадов" #NT!
 nd_alm_minaret_tradition_desc: "Квадратный минарет Кутубия из песчаника в Марракеше, скопированный с Башни Хасана в Рабате и Хиральды в Севилье, стал визитной карточкой религиозной архитектуры Альмохадов: монументальной, строгой и видимой через половину королевства." #NT!
 nd_alm_falsafa: "Фалсафа" #NT!
 nd_alm_falsafa_desc: "Халифы Альмохадов, в частности Абу Якуб Юсуф и Якуб аль-Мансур, собрали вокруг себя философов Аль-Андалуса: Ибн Туфайла, Ибн Рушда (Аверроэса) и еврейского мыслителя Маймонида. Их двор в Марракеше стал кульминацией средневековых аристотелевских комментариев." #NT!
 nd_alm_andalusi_crossbow: "Андалузские арбалетчики" #NT!
 nd_alm_andalusi_crossbow_desc: "Города Аль-Андалуса снабдили Халифат стрелковой пехотой: горожане, обученные обращению с пешими арбалетами, потомки кордовской традиции, дополнявшие берберское копье стрелой со стальным наконечником." #NT!
 nd_alm_caravan_economy: "Караванное хозяйство" #NT!
 nd_alm_caravan_economy_desc: "Сиджилмаса и Вадан находились на пустынном конце транссахарской торговли. Губернаторы Альмохадов построили в городах фундуки, организовали караванные маршруты и обложили налогом перевозки золота и соли, связывавшие Сахель со Средиземным морем." #NT!
 nd_alm_maliki_revival: "Возрождение Малики" #NT!
 nd_alm_maliki_revival_desc: "Хотя Ибн Тумарт и ранние халифы преследовали факихов Малики и сжигали копии Муватты, во время правления аль-Мансура старая школа незаметно вновь заявила о себе. Фикх кади вернулся к прецеденту Малики, закрепив режим на унаследованной юриспруденции Магриба." #NT!
  
 nd_alm_jihad_andalus: "Джихад в Аль-Андалусе" #NT!
 nd_alm_jihad_andalus_desc: "Каждый халиф по очереди пересекал пролив во главе огромной армии, чтобы вести джихад против христианских королевств: при Аларкосе в 1195 году Якуб аль-Мансур разрушил Кастилию, и бело-зеленые знамена дошли до Толедо. Кампании Альмохадов послужили образцом длительной Иберийской войны." #NT!
 nd_alm_christian_mercenaries: "Христианские наемные бригады" #NT!
 nd_alm_christian_mercenaries_desc: "К концу двенадцатого века Альмохады, как и до них короли андалузских таифов, начали тысячами набирать иберийских христианских наемников: кастильских рыцарей, служивших в гвардии халифа, норманнских пехотинцев, занимавших гарнизоны в провинциальных городах, получавших зарплату серебром и получавших дома в Марракеше." #NT!
 nd_alm_ribat_tradition: "Рибат Традиция" #NT!
 nd_alm_ribat_tradition_desc: "Рибат представлял собой укрепленный приграничный монастырь, где миряне-добровольцы наряду со своими богослужениями несли военную службу. Рибаты, раскинувшиеся вдоль побережья от Сале до Суса и Сфакса, обучали мурабитунов: благочестивых приграничников, которые откликнулись на призыв халифа." #NT!
 nd_alm_marrakeshi_metalwork: "Марракеши Металлоконструкции" #NT!
 nd_alm_marrakeshi_metalwork_desc: "Кузницы столицы Альмохадов вооружали как берберский джунд, так и андалузскую пехоту дамасской сталью из иберийского железа и снабженными латунью ятаганами, скопированными из восточных земель. Оружейные склады Халифа установили стандарт для западного Средиземноморья." #NT!
 nd_alm_maghrebi_astronomy: "Магрибская астрономия" #NT!
 nd_alm_maghrebi_astronomy_desc: "Астрономы Андалусии Ибн Туфайл, аль-Битруджи и Джабир ибн Афла работали при дворе Альмохадов, совершенствуя систему Птолемея, строя обсерватории и создавая астрономические таблицы, которые позже будут использоваться в Толедо и Париже." #NT!
  
 nd_alm_monumental_caliphate: "Монументальный Халифат" #NT!
 nd_alm_monumental_caliphate_desc: "Якуб аль-Мансур сделал монументальную архитектуру инструментом легитимности. Рибат аль-Фатх, Башня Хасана, великая мечеть в Севилье с Хиральдой, Кутубия в Марракеше: по всему Халифату имя Альмохадов было высечено в камне, строгом и огромном." #NT!
 nd_alm_andalusi_silk: "Андалузское шелковое ткачество" #NT!
 nd_alm_andalusi_silk_desc: "От Альмерии до Гранады шелковые мастерские Аль-Андалуса, наследники кордобанской традиции, ткали лучшие ткани в западном Средиземноморье. Мастерские тираза халифа производили вышитые государственные одежды от Марракеша до Каира." #NT!
 nd_alm_sufi_brotherhoods: "Суфийские Братства" #NT!
 nd_alm_sufi_brotherhoods_desc: "Распространяясь из завий Магриба, популярные суфийские ордена, в том числе Шазили и Кадири, укоренились как в городах, так и в деревнях. Их святые (авлия) и духовные генеалогии связывали периферийные народы с городской исламской культурой и ассимилировали новичков с халифской ортодоксальностью." #NT!
 nd_alm_caliphal_arsenals: "Калифские арсеналы" #NT!
 nd_alm_caliphal_arsenals_desc: "Имперские арсеналы в Марракеше, Фесе и Севилье снабжали постоянные силы халифа: джундскую кавалерию, андалузскую пехоту и имперскую телохранительницу. Централизованное вооружение позволило разместить крупнейшие армии западного исламского мира." #NT!
 nd_alm_saharan_gold: "Транссахарское золото" #NT!
 nd_alm_saharan_gold_desc: "Золото Вади Сус и соль Тагазы проходили через таможни Альмохадов на пути на средиземноморские рынки. Налоговые поступления Халифата росли пропорционально транссахарскому потоку." #NT!
  
 nd_alm_sharifian_legitimacy: "Шарифская легитимность" #NT!
 nd_alm_sharifian_legitimacy_desc: "Потомки халифов Альмохадов и более поздних династий Магриби заявляли о своем шарифском происхождении от Пророка, что придавало их правлению легитимность, независимую от халифата Аббасидов или какой-либо внешней власти." #NT!
 nd_alm_maghrebi_corsairs: "Магрибские корсары" #NT!
 nd_alm_maghrebi_corsairs_desc: "От Сале до Тетуана и Алжира корсарские порты Магриба отправляли быстрые шебеки и галеоты в западное Средиземноморье и Атлантику, совершая набеги на европейские суда и привозя рабов и серебро обратно в Халифат." #NT!
 nd_alm_kharaj_reform: "Реформа Хараджа" #NT!
 nd_alm_kharaj_reform_desc: "Реформированное налогообложение земли отличало харадж на завоеванных поместьях от десятины ушр на мусульманских владениях, упорядочивая финансовую основу Халифата и стабилизируя доходы в сельских районах." #NT!
 nd_alm_mobile_court: "Махалля" #NT!
 nd_alm_mobile_court_desc: "Халиф управлял из мобильного лагеря, махалли, который перемещался между Марракешем, Фесом и провинциями. Это странствующее правление сдерживало мятежные племена и восстанавливало центральную власть своим непосредственным присутствием." #NT!
  
 nd_alm_modernization: "Халифатская модернизация" #NT!
 nd_alm_modernization_desc: "Следуя примеру османского низам-и-джедида и египетских реформ Мухаммеда Али, офицеры Халифата обучали регулярную пехоту по европейскому образцу, импортируя инструкторов и современные мушкеты, чтобы противостоять новой эпохе войн." #NT!
 nd_alm_anti_colonial_resistance: "Антиколониальное сопротивление" #NT!
 nd_alm_anti_colonial_resistance_desc: "Там, где пал Алжир и Тунис стал протекторатом, Халифат противостоял европейскому вторжению: дипломатическим играм в европейских судах, снабжению нерегулярных сил во внутренних районах и доктрине, согласно которой Магриб не продается." #NT!
 nd_alm_industrial_revival: "Промышленное возрождение" #NT!
 nd_alm_industrial_revival_desc: "Современные арсеналы в Касабланке, верфи в Сале и печатные школьные учебники в Фесе сигнализируют о том, что Халифат поздно начал использовать промышленные технологии, пытаясь встретиться с европейскими державами как с равными, а не как субъекты." #NT!
 nd_alm_maghrebi_press: "Типография Магриби" #NT!
 nd_alm_maghrebi_press_desc: "С опозданием, но решительно, арабские типографии в Фесе и Марракеше выпускают школьные учебники, газеты и переводят европейские произведения. Культура печати проникает в городские грамотные классы и меняет публичную сферу." #NT!
  
  # === Buildings === 
 nd_alm_kasbah_citadel: "Альмохад Касба" #NT!
 nd_alm_kasbah_citadel_desc: "Укрепленная цитадель, построенная на вершине города, со своими стенами, зернохранилищем, казармами и дворцом губернатора. Касба Альмохадов распространяет имперскую власть на каждый город Магриби." #NT!
 nd_alm_almohad_minaret: "Минарет Альмохада" #NT!
 nd_alm_almohad_minaret_desc: "Огромный квадратный минарет в стиле Альмохадов из тесаного песчаника с панелями себка и арочным балконом: модель Кутубии, Башни Хасана и Хиральды." #NT!
 nd_alm_house_of_wisdom: "Дом Мудрости" #NT!
 nd_alm_house_of_wisdom_desc: "Научное учреждение, объединяющее медресе, библиотеку и бюро переводов. Философы Андалусии, еврейские врачи и астрономы Магриба — все служат под покровительством халифа." #NT!
 nd_alm_funduq_quarter: "Квартал Фундук" #NT!
 nd_alm_funduq_quarter_desc: "Городской район караван-сараев, складов и торговых домов, где заканчиваются транссахарские караваны и разгружаются средиземноморские суда. Фундук является двигателем городского благосостояния Магриби." #NT!
 nd_alm_coastal_ribat: "Прибрежный Рибат" #NT!
 nd_alm_coastal_ribat_desc: "Укрепленный пограничный монастырь на побережье, где добровольцы-миряне наряду с богослужением несут военную службу. Рибаты тянутся вдоль берегов Атлантического и Средиземного моря от Сале до Сфакса." #NT!
 nd_alm_caliphal_armoury: "Калифская оружейная палата" #NT!
 nd_alm_caliphal_armoury_desc: "Имперская оружейная мастерская, производившая вооружение для джундов и андалузской пехоты, оснащенная кузницами, литейными цехами и корпусом оружейников, прикрепленных к постоянным войскам халифа." #NT!
 nd_alm_andalusi_silk_workshop: "Андалузская шелковая мастерская" #NT!
 nd_alm_andalusi_silk_workshop_desc: "Мастерская Тираза в традициях Аль-Андалуса, где ткут тончайшую парчу и вышитые государственные одежды, экспортируемые из Альмерии и Гранады во все дворы Средиземноморья." #NT!
 nd_alm_caliphal_academy: "Халифальная Академия" #NT!
 nd_alm_caliphal_academy_desc: "Современная военная и научная академия по османской модели низам-и-джедид, обучающая артиллерии, фортификации, геометрии и современным языкам новое поколение офицеров и бюрократов." #NT!
 nd_alm_diwan_al_jund: "Диван аль-Джунд" #NT!
 nd_alm_diwan_al_jund_desc: "Имперский сборный пункт, казармы и касса постоянной армии. Постоянные силы халифа, джунды, финансируются и оснащаются из этого учреждения, а не набираются из поместий." #NT!
 nd_alm_diwan_upkeep: "Содержание Дивана" #NT!
 nd_alm_diwan_upkeep_desc: "Плата и продовольствие постоянному солдату, оружие из арсеналов и полковой паёк." #NT!
  
  # === Production Methods === 
 nd_alm_kasbah_upkeep: "Содержание Касбы" #NT!
 nd_alm_kasbah_upkeep_desc: "Каменные стены, оружие и повседневная провизия халифского гарнизона." #NT!
 nd_alm_minaret_upkeep: "Содержание минарета" #NT!
 nd_alm_minaret_upkeep_desc: "Каменная кладка, известковый раствор и восковые свечи, освещающие молитвенный зал." #NT!
 nd_alm_house_of_wisdom_upkeep: "Содержание Дома Мудрости" #NT!
 nd_alm_house_of_wisdom_upkeep_desc: "Бумага из Феса и Хативы, книги в тисненых кожаных переплетах и ​​скромные потребности местных ученых." #NT!
 nd_alm_funduq_upkeep: "Содержание Фундука" #NT!
 nd_alm_funduq_upkeep_desc: "Корм, еда и хранилища для караванов купцов и их вьючных животных." #NT!
 nd_alm_ribat_upkeep: "Содержание Рибата" #NT!
 nd_alm_ribat_upkeep_desc: "Каменная кладка стен, оружие для мурабитунов и военно-морские припасы для берегового наблюдателя." #NT!
 nd_alm_armoury_upkeep: "Содержание Оружейной" #NT!
 nd_alm_armoury_upkeep_desc: "Железо, древесный уголь и инструменты для изготовления инструментов, которые обеспечивают работу кузниц." #NT!
 nd_alm_armoury_workshop: "Оружейная мастерская Халифа" #NT!
 nd_alm_armoury_workshop_desc: "Железо и уголь использовались в оружии со стальными наконечниками джундов и андалузской пехоты." #NT!
 nd_alm_silk_workshop_upkeep: "Содержание шелковой мастерской" #NT!
 nd_alm_silk_workshop_upkeep_desc: "Ткацкие станки, красители и бухгалтерия тиразского надзирателя." #NT!
 nd_alm_andalusi_tiraz: "Андалусский Тираз" #NT!
 nd_alm_andalusi_tiraz_desc: "Вышитые одежды из государственного и парчового шелка, сотканные в традициях Аль-Андалуса для экспорта во все средиземноморские дворы." #NT!
 nd_alm_academy_upkeep: "Содержание Академии" #NT!
 nd_alm_academy_upkeep_desc: "Импортные книги, бумага для кадетских тетрадей, опытное оружие артиллерийского двора." #NT!
  
  # === Units === 
 a_nd_alm_masmuda_spearmen: "Масмуда Копейщики" #NT!
 a_nd_alm_masmuda_spearmen_desc: "Тяжелая пехота, набранная из полукочевых берберов Высокого Атласа, организованная по племенной иерархии и сражающаяся плотными формированиями." #NT!
 a_nd_alm_zenata_lancers: "Зената Лансерс" #NT!
 a_nd_alm_zenata_lancers_desc: "Легкая кавалерия плато Магриби, мастера тактики «карр ва фарр»: атака и притворное отступление." #NT!
 a_nd_alm_andalusi_crossbowmen: "Андалузские арбалетчики" #NT!
 a_nd_alm_andalusi_crossbowmen_desc: "Городское ополчение Аль-Андалуса тренировалось в стрельбе из пешего арбалета, обеспечивая стрелковую пехоту Халифата наряду с берберскими копьями." #NT!
 a_nd_alm_christian_militia: "Христианское наемное ополчение" #NT!
 a_nd_alm_christian_militia_desc: "Иберийские христианские наемники, нанятые в полки позднего Халифата, получавшие оплату серебром и расквартированные в Марракеше: кастильские рыцари, нормандские пехотинцы и искатели приключений из Пиренеев." #NT!
 n_nd_alm_corsair_xebec: "Корсар Шебек" #NT!
 n_nd_alm_corsair_xebec_desc: "Быстрая магрибская галера с комбинированным веслом и латиноамериканским парусом, совершающая набеги на европейские суда из Сале в Алжир и пересекающая Гибралтарский пролив." #NT!
  
  # === Levies === 
 levy_nd_alm_masmuda_spearmen: "Масмуда Леви" #NT!
 levy_nd_alm_masmuda_spearmen_desc: "Пехота берберского племени из Высокого Атласа." #NT!
 levy_nd_alm_zenata_lancers: "Зената Кавалерийский сбор" #NT!
 levy_nd_alm_zenata_lancers_desc: "Легкая кавалерия зенатской берберской знати." #NT!
 levy_nd_alm_andalusi_crossbowmen: "Андалусский арбалетный сбор" #NT!
 levy_nd_alm_andalusi_crossbowmen_desc: "Городское арбалетное ополчение из городов Аль-Андалуса." #NT!
  
  # === Destiny Tree === 
  
  # --- Destiny advance names and descriptions --- 
 nd_alm_destiny: "Судьба Халифата" #NT!
 nd_alm_destiny_desc: "Выбор, сделанный в Марракеше, определяет дальнейший курс королевства. Будь то меч Тинмела или библиотеки Аль-Андалуса, проект Альмохадов теперь должен быть доведен до завершения." #NT!
  
 nd_alm_dest_strait: "Пересечь пролив" #NT!
 nd_alm_dest_strait_desc: "Войско махдистов силой пересекает Гибралтарский пролив. Первые призы – Леванте и центральная Месета: Валенсия и Толедо. Каждый солдат, отправленный через пролив, — это еще один меч для уммы." #NT!
  
 nd_alm_dest_western_march: "Западный марш" #NT!
 nd_alm_dest_western_march_desc: "Атлантический берег манит. Протолкните зелено-белые знамена через Коимбру к устью Тежу, захватив Лиссабон и португальское побережье в качестве Халифата." #NT!
  
 nd_alm_dest_reconquista_reversed: "Реконкиста перевернутая" #NT!
 nd_alm_dest_reconquista_reversed_desc: "От Памплоны до Барселоны через Сарагосу последние христианские королевства Иберии разрушены или поглощены. Умма возвращается в вестготскую Испанию. Рибат аль-Фатх правит от моря до моря." #NT!
  
 nd_alm_dest_salt_road: "Соленая дорога" #NT!
 nd_alm_dest_salt_road_desc: "К югу от Сахары караваны с солью и золотом ждут у пустынных колодцев Вадан и Валата. Водрузьте знамя халифа над оазисами Адрара, и транссахарская торговля потечет в казну Марракеша." #NT!
  
 nd_alm_dest_bilad_al_sudan: "Билад аль-Судан" #NT!
 nd_alm_dest_bilad_al_sudan_desc: "За пустыней лежит Земля Черных: Тимбукту с библиотеками, Дженне с сырцовой мечетью. Благодаря развитому банковскому делу и казначейству, которому завидует весь мир, Халифат присоединяет речные города к Магрибу." #NT!
  
 nd_alm_dest_two_shores: "Два берега" #NT!
 nd_alm_dest_two_shores_desc: "Ниани подчиняется, золото течет вверх через рынок капитала, а Халифат выступает как великая экономическая держава между Средиземноморьем и Нигером. Марракеш – это новая Кордова и новый Каир одновременно." #NT!
  
  # --- Destiny event titles, descriptions, and option text --- 
 nd_alm.6.t: "Длинный курс" #NT!
 nd_alm.6.d: "Выбор, сделанный в день формирования, распространился по всему королевству. Курьеры едут на юг к Сусу, на север к проливу, на восток к Тунису: Халифат расположился на своем пути, и следующее поколение визирей будет знать, о чем их просят. Судьба Альмохадского халифата складывается." #NT!
 nd_alm.6.a: "Пусть наше дело процветает" #NT!
  
 nd_alm.7.t: "Меч пересекает пролив" #NT!
 nd_alm.7.d: "Армия махдистов пересекла Гибралтарский пролив, и Леванте и центральная Месета находятся в ваших руках. Валенсия взята; ворота Толедо открываются навстречу бело-зеленым знаменам. Христианские королевства шатаются от шока. Проповедники халифа едут впереди армии, провозглашая восстановление ислама на землях, которые когда-то украли вестготы." #NT!
 nd_alm.7.a: "Вперед: умма восстановлена" #NT!
  
 nd_alm.8.t: "Атлантический берег" #NT!
 nd_alm.8.d: "Коимбра пала, и Лиссабон преклоняет колени под младшими родственниками Башни Хасана. Берег Атлантического океана принадлежит вам от Суса до Дору. Теперь вопрос в том, как удержать завоеванное: рейдовой колонной и непрерывным походом, закаляя армию для следующего рывка? Или заселив новые земли берберскими колонистами и андалузскими кади, чтобы закрепить завоевание в стабильном правительстве?" #NT!
 nd_alm.8.a: "Марш вперед: кампания не должна ослабевать" #NT!
 nd_alm.8.b: "Урегулируйте завоевание: приведите кади и колонистов" #NT!
  
 nd_alm.9.t: "Халифат восстановлен" #NT!
 nd_alm.9.d: "От Памплоны до Барселоны последние коронованные христианские главы покорились, бежали или пали. Королевство вестготов распалось; Халифат простирается от Пиренеев до Нигера. Теперь придворные спорят о значении момента: является ли халиф универсальным молотом неверия, который будет продвигаться в Пиренеи и дальше? Или естественная граница достигнута и пришло время укрепить линию и консолидироваться?" #NT!
 nd_alm.9.a: "Мы — универсальный Халифат Запада" #NT!
 nd_alm.9.b: "Пиренеи — это граница; мы держим линию" #NT!
  
 nd_alm.10.t: "Уэллс Вадана" #NT!
 nd_alm.10.d: "Колодцы Вадан и Валата теперь находятся в руках Альмохадов. Соляные плиты Тагазы, золотая пыль Вади Сус, урожаи фиников Адрара — все это течет вверх, в Марракеш. У пустынных дорог есть хозяин, а таможни халифа выкачивают серебро из каждого проходящего каравана." #NT!
 nd_alm.10.a: "Марракеш обогащается за счет пустыни" #NT!
  
 nd_alm.11.t: "Река черного золота" #NT!
 nd_alm.11.d: "Тимбукту и Дженне, речные города Нигера, вошли в орбиту Халифата. Их ученые копируют маликитский фикх с андалузских образцов; их золотая пыль течет по соляному маршруту в Сиджилмасу. Диван разделяет вопрос о том, как управлять этим новым царством: легко править через местных эмиров, используя местный престиж? Или перенести торговлю в Марракеш и позволить банкирам столицы забрать прибыль?" #NT!
 nd_alm.11.a: "Управление через местных эмиров: халиф как сюзерен" #NT!
 nd_alm.11.b: "Централизуйте торговлю: Марракеш — банк Сахеля" #NT!
  
 nd_alm.12.t: "Халифат двух берегов" #NT!
 nd_alm.12.d: "Ниани подчинился, золото течет через рынок капитала, а Халифат представляет собой непревзойденный узел транссахарского и средиземноморского богатства. Диван обсуждает следующий великий проект: должно ли королевство повернуться к морю, создавая флот для распространения власти Альмохадов через Средиземное море? Или же Марракеш всерьез станет новой Кордовой, космополисом андалузской философии и суданской науки?" #NT!
 nd_alm.12.a: "Постройте имперский флот: командуйте западным морем" #NT!
 nd_alm.12.b: "Превратите Марракеш в космополис двух континентов" #NT!
  
  # --- Destiny timed modifier names and descriptions --- 
 STATIC_MODIFIER_NAME_nd_alm_dest_atlantic_jihad: "Атлантический джихад" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_atlantic_jihad: "Армия ведет непрерывную кампанию вдоль побережья Атлантического океана. Добычи много, поезда с припасами ходят плотно, а подкрепления передвигаются легко; но постоянные военные расходы разжигают инфляцию в городах." #NT!
 STATIC_MODIFIER_NAME_nd_alm_dest_levantine_settlement: "Поселение Леванте" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_levantine_settlement: "Берберские колонисты и андалузские кади расселяются по завоеванным землям. Культуры интегрируются, сепаратизм падает, и царство становится устойчиво плюралистическим." #NT!
  
 STATIC_MODIFIER_NAME_nd_alm_dest_caliphate_of_the_west: "Халифат Запада" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_caliphate_of_the_west: "Халиф претендует на универсальную власть над западной уммой. Быстро созревают новые поводы для войны, счет войны меняется в лучшую сторону, а мирные переговоры подчиняются воле империи. Но жители королевства устают от бесконечной кампании." #NT!
 STATIC_MODIFIER_NAME_nd_alm_dest_pyrenean_frontier: "Пиренейский рубеж" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_pyrenean_frontier: "Пиренеи становятся липами Халифата. Вспомогательные силы удерживают проходы, список сборщиков разрастается, а религиозное государство укрепляется; Халиф не вступает в бой за пределами естественной границы." #NT!
  
 STATIC_MODIFIER_NAME_nd_alm_dest_sudani_emirates: "Суданские Эмираты" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_sudani_emirates: "Местные эмиры управляют Сахелем под сюзеренитетом Халифа. Подданные лояльны, дипломатические связи множатся, а добрая воля распространяется от Нигера до Атласа." #NT!
 STATIC_MODIFIER_NAME_nd_alm_dest_bankers_of_marrakesh: "Банкиры Марракеша" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_bankers_of_marrakesh: "Столица становится великой расчетной палатой западной торговли. Торговцы субсидируются, затраты на строительство снижаются за счет обильного кредита, а инфляция сдерживается; но дипломатический корпус голодает, поскольку посольствами управляют торговцы." #NT!
  
 STATIC_MODIFIER_NAME_nd_alm_dest_imperial_marketplace: "Императорский рынок" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_imperial_marketplace: "Флот Альмохадов господствует в западном Средиземноморье. Морская торговля процветает, моряки стекаются в корсарские порты, а военно-морские традиции с каждым сезоном углубляются." #NT!
 STATIC_MODIFIER_NAME_nd_alm_dest_andalusi_intellect: "Андалузский Космополис" #NT!
 STATIC_MODIFIER_DESC_nd_alm_dest_andalusi_intellect: "Марракеш становится новой Кордовой: ученые из Тлемсена и Тимбукту, философы из Гранады и Феса восстанавливают королевство от следов войны и плетут тихую сеть агентов по всему Средиземноморью. Но Халифат смотрит внутрь себя, а не наружу, в открытое море." #NT!
  
  # === Destiny Buildings === 
 nd_alm_caliphal_jihad_council: "Совет Джихада" #NT!
 nd_alm_caliphal_jihad_council_desc: "Имперский совет войны и стражи, укрепленный внутри касбы, где собираются постоянные легионы, оплачиваются пограничные гарнизоны и направляются бесконечные кампании западной уммы." #NT!
 nd_alm_jihad_council_upkeep: "Содержание Совета" #NT!
 nd_alm_jihad_council_upkeep_desc: "Оружие для постоянных легионов, кожа для палаток и сбруи, инструменты для кузнецов и средства передвижения для кавалерии." #NT!
  
 nd_alm_caliphal_treasury: "Калифатская казна" #NT!
 nd_alm_caliphal_treasury_desc: "Имперский монетный двор и хранилище слитков в Марракеше, где суданское золото чеканится в динары, тонкие шелковые ткани с именем халифа отправляются в иностранные суды, а банкиры двух континентов отдают свои отчеты." #NT!
 nd_alm_treasury_upkeep: "Содержание казначейства" #NT!
 nd_alm_treasury_upkeep_desc: "Бумага для бухгалтерских книг, тонкая ткань для офисных мантий, мебель для счетных залов банкиров и инструменты для пробирщиков." #NT!
  
  # === Bureaucracies === 
 alm_talaba_bureaucracy: "Талаба" #NT!
 alm_talaba_bureaucracy_desc: "Группа Альмохадов, состоящая из студентов теологического и административного профиля, обучавшихся доктрине таухида Ибн Тумарта в большом медресе Кутубия и ложе в Тинмеле. Набранная сначала из вождей Масмуда Высокого Атласа, а затем из более широкой империи, талаба поставляла кади, губернаторов и налоговых инспекторов раннего Халифата. Они вытеснили унаследованных маликитов в качестве институционального духовенства королевства, обучая грамотный класс, лояльный династии Муминидов, а не давно укоренившимся андалусско-магрибским факихам, чью власть Альмохады пришли реформировать." #NT!
 alm_ahl_al_jamaa_bureaucracy: "Ахль аль-Джамаа" #NT!
 alm_ahl_al_jamaa_bureaucracy_desc: "Внутренний совет Альмохадов, произошедший от первоначального Совета десяти Ибн Тумарта и более широкого Совета пятидесяти. В его состав входили вожди конфедерации Масмуда (Хинтата, Тинмел, Ганфиса, Харга) наряду с династическими родственниками Муминидов. Джамаа подтверждало преемственность, распределяло команды предвыборных кампаний и имело формальный приоритет над гражданскими администраторами. Это превратило государство Альмохадов в племенно-аристократическую конфедерацию в халифальном облачении, со всей энергией и хрупкостью, которые это подразумевало: те же вожди, чьи рекруты разгромили кастильцев при Аларкосе в 1195 году, оставили королевство в гражданской войне после Лас-Наваса в 1212 году." #NT!
 alm_diwan_al_insha_bureaucracy: "Диван аль-Инша" #NT!
 alm_diwan_al_insha_bureaucracy_desc: "Канцелярия Марракеша, орган халифского секретариата. Его писцы составили проект дававина: прокламации о вступлении на престол, назначения губернаторов и богато украшенную официальную переписку алфавитом алами, которая стала визуальной подписью халифской власти Альмохадов. При таких визирях, как Абу Джафар ибн Атийя, канцелярия разработала строгую двуязычную арабо-берберскую практику, которая объединила Магриб и Аль-Андалус в единое административное пространство." #NT!
 alm_sikka_almohad_bureaucracy: "Сикка Альмохад" #NT!
 alm_sikka_almohad_bureaucracy_desc: "Императорский монетный двор Марракеша, чей квадратный золотой динар (добла альмохаде) и серебряный дирхам стали наиболее надежными монетами западного Средиземноморья. Христианские короны Иберии чеканили миллары в сознательном подражании, а золото Альмохадов циркулировало вплоть до ярмарок Шампани. Престиж монетного двора основывался на его чистоте (около 98% золота) и строгом контроле пробы со стороны халифа; ослабьте эту хватку, и монета обесценится, превратившись в инфляцию поздних Муминидов." #NT!
  
 AUTO_MODIFIER_NAME_nd_alm_bureaucracy_authority: "Диваны Халифата" #NT!
 AUTO_MODIFIER_DESC_nd_alm_bureaucracy_authority: "Административные органы государства Муминидов (канцелярия, школы талаба, монетный двор и совет вождей Альмохадов) превратились в постоянный институциональный аппарат. Марракеш теперь управляет западной уммой не только с помощью предвыборного меча, но и посредством регистров, указов и пробного динара." #NT!
