l_russian:
 STATIC_MODIFIER_NAME_nd_lat_frankish_feudal_order: "Франкский феодальный порядок" #NT!
 STATIC_MODIFIER_DESC_nd_lat_frankish_feudal_order: "Латинская империя была организована по образцу западного феодализма. Лорды-крестоносцы держат свои феодальные владения посредством военной службы, подчиняясь обычаям Франции и Фландрии. Император правит как первый среди равных, его власть опирается на силу конных рыцарей и лояльность его вассалов." #NT!
 STATIC_MODIFIER_NAME_nd_lat_venetian_partnership: "Венецианское партнерство" #NT!
 STATIC_MODIFIER_DESC_nd_lat_venetian_partnership: "Светлую Республику считали незаменимым партнером империи. Венецианские купцы контролируют гавани, флот и потоки товаров через Константинополь. Подеста заседает в совете императора, и золотая нить торговли связывает империю крепче, чем любая феодальная клятва." #NT!
 STATIC_MODIFIER_NAME_nd_lat_romania_divided: "Румыния разделена" #NT!
 STATIC_MODIFIER_DESC_nd_lat_romania_divided: "Территории старой Римской империи были поделены между завоевателями, каждый из лордов консолидировал свою власть над греческими землями." #NT!
 STATIC_MODIFIER_NAME_nd_lat_codified_law: "Кодифицированный закон Румынии" #NT!
 STATIC_MODIFIER_DESC_nd_lat_codified_law: "Присяжные Румынии установили общую правовую основу для всех латинских владений, наведя порядок в лоскутном одеяле франкских, венецианских и византийских правовых традиций." #NT!
 nd_lat.1.t: "Латинская империя" #NT!
 nd_lat.1.d: "Константинополь пал не от неверных, а от воинов Креста. Величайший город христианского мира теперь принадлежит латинским лордам, прорвавшим его древние стены. Император и дож, рыцарь и торговец, теперь должны решить, какая империя возродится из пепла Византии.\n\nФеодалы Франции, Фландрии и Рейнской области стремятся организовать эти завоеванные земли так же, как и в любом западном королевстве: разделенные феодальные владения, вассалы, связанные присягой, император, верховный в войне. Но венецианцы, которые сделали это завоевание возможным, требуют своей доли: гаваней, торговых путей, складов, которые сделали Константинополь перекрестком мира.\n\nДва видения борются за душу этой новой империи. Будет ли это королевство рыцарей или империя торговцев?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lat.1.a: "Правило как правило франков: копьем, клятвой, феодальным законом." #NT!
 nd_lat.1.b: "Обнимите Венецию: торговля свяжет эту империю воедино" #NT!
 nd_lat.2.t: "Румынская партия" #NT!
 nd_lat.2.d: "Завоеванные территории Румынии были формально разделены между победителями. По условиям договора о разделе, заключенного еще до того, как были прорваны стены, император получает четверть всех земель, Венеция претендует на три восьмых (включая лучшие гавани и острова), а оставшиеся три восьмых распределяются между баронами-крестоносцами как феодальные феодальные владения.\n\nАфинское герцогство, Княжество Ахея, Королевство Фессалоника и созвездие островных владений теперь расставить точки на карте Греции. Каждый лорд управляет своей долей согласно обычаям своей родины, создавая мозаику западного феодализма, наложенную на древнегреческую землю." #NT!
 nd_lat.2.a: "Земли Румынии принадлежат нам и мы можем ими управлять." #NT!
 nd_lat.3.t: "Присяжные Румынии" #NT!
 nd_lat.3.d: "Был составлен всеобъемлющий правовой кодекс, регулирующий феодальные отношения латинских лордов в Греции. Опираясь на обычаи Иерусалима, законы Шампани и обычаи Мореи, румынские присяжные устанавливают права и обязанности каждого вассала, от самого скромного сержанта до величайшего барона.\n\nКодекс касается землевладения, военной службы, наследования и отправления правосудия. Он создает общий юридический язык для лордов, пришедших со всех уголков Западной Европы, объединяя их в единое феодальное общество, несмотря на их различное происхождение." #NT!
 nd_lat.3.a: "Пусть законы Румынии будут известны всем" #NT!
 nd_lat_formed_tt: "Латинская империя была основана" #NT!
 nd_lat_path_a_tt: "Был выбран франкский феодальный путь." #NT!
 nd_lat_path_b_tt: "Был выбран венецианский путь партнерства" #NT!
 nd_lat_partitio_romaniae: "Румынский раздел" #NT!
 nd_lat_partitio_romaniae_desc: "Формальный раздел территорий Византийской империи между латинскими завоевателями, создавший феодальную мозаику государств крестоносцев в Греции и Фракии." #NT!
 nd_lat_frankish_chivalry: "Франкское рыцарство" #NT!
 nd_lat_frankish_chivalry_desc: "Традиция тяжелой кавалерии французских и фламандских рыцарей-крестоносцев, чья разрушительная конная атака решала сражения от Адрианополя до Пелопоннеса." #NT!
 nd_lat_latin_patriarchate: "Латинский Патриархат" #NT!
 nd_lat_latin_patriarchate_desc: "Установление католического патриарха в Константинополе, заменяющее православную иерархию и утверждающее римскую церковную власть над греческими церквями." #NT!
 nd_lat_feudal_levy_system: "Система феодальных сборов" #NT!
 nd_lat_feudal_levy_system_desc: "Обязанность каждого латинского вассала предоставлять вооруженных людей для походов императора, обязывающая феодалов Румынии к военной службе." #NT!
 nd_lat_assizes_tradition: "Присяжные Румынии" #NT!
 nd_lat_assizes_tradition_desc: "Комплексный феодальный правовой кодекс, регулирующий латинские владения Греции, кодифицирующий западные обычаи землевладения, военной службы и правосудия в восточной среде." #NT!
 nd_lat_venetian_quarter: "Венецианский квартал" #NT!
 nd_lat_venetian_quarter_desc: "Венецианский торговый квартал в Константинополе, самоуправляющийся анклав, где торговля Востока и Запада протекает через венецианские склады и счетные дома." #NT!
 nd_lat_greek_silk_revival: "Греческое шелковое возрождение" #NT!
 nd_lat_greek_silk_revival_desc: "Латинские лорды признали ценность византийской шелковой промышленности и поощряли ее продолжение, сочетая греческое ремесло с доступом к западным рынкам.\n\n#italic Доступно в: $nd_lat_fondaco$#!" #NT!
 nd_lat_pronoiar_system: "Проноарная система" #NT!
 nd_lat_pronoiar_system_desc: "Латиняне адаптировали византийскую систему пронойи, предоставляя конным солдатам приносящие доход земли в обмен на военную службу, что представляло собой гибрид западного феодализма и восточной администрации." #NT!
 nd_lat_golden_horn_trade: "Золотой Рог Коммерция" #NT!
 nd_lat_golden_horn_trade_desc: "Гавань Золотого Рога остается перекрестком средиземноморской торговли, соединяя черноморские торговые пути с рынками Италии, Египта и Леванта." #NT!
 nd_lat_archipelago_lordships: "Архипелаг Светлости" #NT!
 nd_lat_archipelago_lordships_desc: "Герцогство Архипелага и разбросанные латинские владения на островах Эгейского моря, где венецианские и франкские лорды правят из укрепленных замков с видом на море." #NT!
 nd_lat_latin_greek_synthesis: "Латинско-греческий синтез" #NT!
 nd_lat_latin_greek_synthesis_desc: "На протяжении поколений латинские правители Греции впитывали элементы византийской культуры: греческий язык, православные обычаи и восточные административные практики смешались с западными феодальными традициями." #NT!
 nd_lat_strait_control: "Контроль пролива" #NT!
 nd_lat_strait_control_desc: "Контроль над проливами Босфор и Дарданеллы, узкими проходами между Европой и Азией, которые управляют потоками торговли и армий между Средиземным и Черным морями." #NT!
 nd_lat_aegean_fleet: "Эгейский флот" #NT!
 nd_lat_aegean_fleet_desc: "Флот галер, заимствованных из византийской традиции дромонов, специально построенных для усеянных островами вод Эгейского моря, где скорость и маневренность имеют большее значение, чем тяжелое вооружение." #NT!
 nd_lat_confessional_unity: "Конфессиональное единство" #NT!
 nd_lat_confessional_unity_desc: "Усилия по приведению греческого православного населения в союз с Римом посредством убеждения, обращения и авторитета Латинского Патриархата." #NT!
 nd_lat_bosphorus_arsenal: "Босфорский Арсенал" #NT!
 nd_lat_bosphorus_arsenal_desc: "Военно-морской арсенал на берегу Босфора, использующий многовековой опыт византийского судостроения для поддержания флота империи." #NT!
 nd_lat_frankish_mercenaries: "Франкские наемнические традиции" #NT!
 nd_lat_frankish_mercenaries_desc: "Постоянная нехватка рабочей силы в Латинской империи создала зависимость от наемных компаний: каталонских, арагонских, итальянских и французских солдат удачи, готовых сражаться за плату." #NT!
 nd_lat_latin_administration: "Латинская администрация" #NT!
 nd_lat_latin_administration_desc: "Постепенное развитие последовательной административной системы, сочетающей византийскую бюрократическую практику с западным феодальным управлением." #NT!
 nd_lat_renewed_imperium: "Обновленный Империум" #NT!
 nd_lat_renewed_imperium_desc: "Латинская империя вновь заявляет о своих претензиях на статус законной преемницы Рима, черпая престиж благодаря владению Константинополем и древними имперскими регалиями." #NT!
 nd_lat_mediterranean_arsenal: "Средиземноморский Арсенал" #NT!
 nd_lat_mediterranean_arsenal_desc: "Военно-морская мощь империи достигает новых высот благодаря галеасу — галере с тяжелым вооружением, сочетающей венецианскую военно-морскую архитектуру с византийским опытом мореплавания." #NT!
 nd_lat_hellenistic_renaissance: "Эллинистический Ренессанс" #NT!
 nd_lat_hellenistic_renaissance_desc: "Культурный расцвет, когда латинские ученые заново открывают греческое философское и научное наследие, хранящееся в библиотеках и монастырях Константинополя." #NT!
 nd_lat_balkan_consolidation: "Балканская консолидация" #NT!
 nd_lat_balkan_consolidation_desc: "Систематическая интеграция балканских территорий в имперскую администрацию, заменяющая лоскутное одеяло полунезависимых владений прямым управлением." #NT!
 nd_lat_constitutional_empire: "Конституционная Империя" #NT!
 nd_lat_constitutional_empire_desc: "Эволюция управления Латинской империей в конституционные рамки, уравновешивающие имперскую власть с правами феодалов и торговых коммун." #NT!
 nd_lat_eastern_modernization: "Восточная модернизация" #NT!
 nd_lat_eastern_modernization_desc: "Внедрение современных промышленных и производственных технологий в Босфорском арсенале превратило его из традиционной верфи в завод военно-морского снабжения.\n\n#italic Доступно в: $nd_lat_arsenal$#!" #NT!
 nd_lat_crossroads_hegemony: "Перекресток Гегемонии" #NT!
 nd_lat_crossroads_hegemony_desc: "Латинская империя использует свое положение на перекрестке Европы и Азии, чтобы доминировать в средиземноморской торговле, контролируя потоки товаров между Востоком и Западом." #NT!
 nd_lat_latin_legacy: "Латинское наследие" #NT!
 nd_lat_latin_legacy_desc: "Непреходящие военные традиции Латинской империи, синтез тактики франкской тяжелой кавалерии, византийской оборонительной доктрины и современной дисциплинированной войны." #NT!
 a_nd_lat_frankish_knight: "Франкский рыцарь" #NT!
 a_nd_lat_frankish_knight_desc: "Рыцари-крестоносцы в доспехах из глубин Франции и Фландрии, чья разрушительная конная атака привела Четвертый крестовый поход к стенам Константинополя." #NT!
 a_nd_lat_pronoiar: "Проноар" #NT!
 a_nd_lat_pronoiar_desc: "Конным солдатам в обмен на военную службу предоставлялись поместья пронойя, сочетая византийскую традицию предоставления земель с западными рыцарскими боевыми приемами." #NT!
 n_nd_lat_dromon: "Латинский дромон" #NT!
 n_nd_lat_dromon_desc: "Военная галера произошла от византийской традиции дромонов, адаптированной латинскими корабелами для патрулирования и боя в узких водах Эгейского моря и Босфора." #NT!
 n_nd_lat_galleass: "Латинский галеас" #NT!
 n_nd_lat_galleass_desc: "Тяжелая военная галера, оснащенная мощной артиллерией, сочетающая венецианский дизайн корпуса с византийскими традициями мореплавания, создала грозное судно для боевых действий в Восточном Средиземноморье." #NT!
 nd_lat_crusader_tower: "Башня крестоносцев" #NT!
 nd_lat_crusader_tower_desc: "Укрепленный дом-башня во франкском стиле, построенный для защиты завоеванной территории и служивший резиденцией латинского лорда." #NT!
 nd_lat_tower_maintenance: "Тауэрский гарнизон" #NT!
 nd_lat_tower_maintenance_desc: "Гарнизон и содержание франкского дома-башни, требующий камня для ремонта, древесины для строительных лесов и оружия для защитников." #NT!
 nd_lat_fondaco: "Фондако" #NT!
 nd_lat_fondaco_desc: "Торговый дом в венецианском стиле, сочетающий в себе склад, резиденцию и рынок, где ведут свой бизнес купцы со всего Средиземноморья." #NT!
 nd_lat_fondaco_trade: "Шелковая торговля" #NT!
 nd_lat_fondaco_trade_desc: "Обработка и экспорт шелка и окрашенного текстиля через венецианскую торговую сеть." #NT!
 nd_lat_fondaco_maintenance: "Содержание Торгового Дома" #NT!
 nd_lat_fondaco_maintenance_desc: "Текущие затраты на содержание торгового дома: ткань для витрины, бумага для счетов и пиломатериалы для ремонта." #NT!
 nd_lat_island_lordship: "Остров Светлость" #NT!
 nd_lat_island_lordship_desc: "Укрепленное прибрежное поместье на одном из островов Эгейского моря, где латинский лорд командует солдатами и матросами из своего замка над гаванью." #NT!
 nd_lat_lordship_maintenance: "Светлость Гарнизон" #NT!
 nd_lat_lordship_maintenance_desc: "Содержание гарнизона и портовых сооружений островного владения." #NT!
 nd_lat_mercenary_hall: "Наемный зал" #NT!
 nd_lat_mercenary_hall_desc: "Место сбора и казармы для западных наемных компаний, которые составляют важнейшее дополнение к ограниченной феодальной рабочей силе Латинской империи." #NT!
 nd_lat_mercenary_maintenance: "Наемное снабжение" #NT!
 nd_lat_mercenary_maintenance_desc: "Оружие, лошади и провиант, необходимые для содержания постоянного гарнизона наемников." #NT!
 nd_lat_arsenal: "Босфорский Арсенал" #NT!
 nd_lat_arsenal_desc: "Крупнейшая военно-морская верфь на берегу Босфора, основанная на многовековом опыте византийского и венецианского судостроения." #NT!
 nd_lat_arsenal_maintenance: "Арсенал Операции" #NT!
 nd_lat_arsenal_maintenance_desc: "Древесина, военно-морские припасы и деготь, необходимые для поддержания работоспособности кораблей арсенала и ремонта флота." #NT!
 nd_lat_arsenal_shipwright: "Производство военно-морских товаров" #NT!
 nd_lat_arsenal_shipwright_desc: "В мастерских арсенала из необработанных пиломатериалов и железа производят канаты, парусину и арматуру для флота." #NT!
 nd_lat_latin_academy: "Латинская Академия" #NT!
 nd_lat_latin_academy_desc: "Учебное заведение, где встречаются латинские и греческие науки, сохраняющее интеллектуальное наследие обеих традиций." #NT!
 nd_lat_academy_maintenance: "Содержание Академии" #NT!
 nd_lat_academy_maintenance_desc: "Бумага, книги и стекла для окон, необходимые для поддержания центра обучения." #NT!
 nd_lat_destiny: "Судьба Латинской империи" #NT!
 nd_lat_destiny_desc: "Теперь, когда Константинополь был захвачен, а империя провозглашена, латинские лорды теперь должны решить свою судьбу: мечом или бухгалтерской книгой." #NT!
 nd_lat_dest_greek_conquest: "Завоевание Греции" #NT!
 nd_lat_dest_greek_conquest_desc: "Лорды-крестоносцы должны привести всю Грецию под латинское знамя. Афины, жемчужина древности, и Салоники, ворота в Македонию, должны подчиниться франкскому правлению." #NT!
 nd_lat_dest_anatolian_march: "Анатолийский марш" #NT!
 nd_lat_dest_anatolian_march_desc: "Обеспечив безопасность Греции, Латинская империя обратила свой взор на проливы. Древние города Бурса и Конья (центры турецкой власти) должны пасть, чтобы империя распространилась на Малую Азию." #NT!
 nd_lat_dest_new_jerusalem: "Новый Иерусалим" #NT!
 nd_lat_dest_new_jerusalem_desc: "Конечная цель крестоносцев: вернуть себе Святую Землю. Антиохия и Иерусалим, утраченные трофеи Первого крестового похода, должны быть взяты под защиту Латинской империи. Это кульминация двух столетий крестовых походов." #NT!
 nd_lat_dest_aegean_dominion: "Эгейский Доминион" #NT!
 nd_lat_dest_aegean_dominion_desc: "Венецианская концепция требует контроля над морскими путями. Герцогство Наксос на Кикладах и великий остров Крит должны быть защищены, чтобы создать непрерывную цепь торговых постов по всему Эгейскому морю." #NT!
 nd_lat_dest_silk_monopoly: "Шелковая монополия" #NT!
 nd_lat_dest_silk_monopoly_desc: "Торговля шелком в Константинополе когда-то была предметом зависти всего мира. Восстановить столичный рынок как огромный торговый центр предметов роскоши, где шелк с Востока течет через латинские руки к западным покупателям." #NT!
 nd_lat_dest_eastern_emporium: "Восточный торговый центр" #NT!
 nd_lat_dest_eastern_emporium_desc: "Расширьте торговую сеть в максимально возможной степени. Каффа на Черном море и Смирна на побережье Эгейского моря станут якорем торговой империи, охватывающей два моря, поддерживаемой современными банковскими учреждениями." #NT!
 nd_lat.4.t: "Судьба Латинской империи" #NT!
 nd_lat.4.d: "Латинская империя стоит на перепутье. Константинополь принадлежит нам, но будущее империи остается ненаписанным. Будут ли сыновья крестоносцев продвигаться на восток, как задумали их отцы? Или торговые принцы Венеции проложат курс через торговлю и контроль над морями?\n\nВыбор, который мы сделали при основании империи, теперь приносит свои плоды. Наша судьба манит." #NT!
 nd_lat.4.a: "Наша судьба ждет" #NT!
 nd_lat.5.t: "Завоевание Греции" #NT!
 nd_lat.5.d: "Афины и Салоники несут знамя Латинской империи. Афинское герцогство, когда-то принадлежавшее бургундским и каталонским авантюристам, теперь подчиняется Константинополю. Королевство Фессалоники, недолго удерживавшееся и быстро утраченное в первые годы завоевания, было восстановлено и закреплено.\n\nВся Греция, от Пелопоннеса до Македонии, признает латинское господство. Государства крестоносцев больше не являются изолированными аванпостами. Они образуют единое феодальное царство." #NT!
 nd_lat.5.a: "Греция наша. Теперь мы стремимся к большим завоеваниям" #NT!
 nd_lat.6.t: "Марш в Анатолию" #NT!
 nd_lat.6.d: "Знамена Латинской империи реют теперь над цитаделями Бурсы и Коньи. То, за что византийские императоры боролись на протяжении веков, франкские рыцари захватили за одно поколение. Богатые равнины Анатолии, которые когда-то были центром римской власти, открыты для латинских заселений и эксплуатации.\n\nНо марш истощил наши ресурсы. Возникают два подхода: продолжать борьбу с рвением или закрепить наши достижения с помощью осторожного управления." #NT!
 nd_lat.6.a: "Нажмите вперед. Бог этого хочет!" #NT!
 nd_lat.6.b: "Консолидация: удержать то, что мы взяли" #NT!
 nd_lat.7.t: "Новый Иерусалим" #NT!
 nd_lat.7.d: "Крест торжествует над Антиохией и Иерусалимом. Мечта, которая спустила на воду тысячу кораблей и отправила сто тысяч человек в пустыню Востока, осуществилась под знаменем Латинской империи. Сам Гроб Господень находится под нашей защитой.\n\nЭто больше, чем военное достижение: это оправдание всего идеала крестового похода. Вопрос теперь в том, будет ли эта империя священным царством, посвященным Богу, или светским империем в римской традиции." #NT!
 nd_lat.7.a: "Царство, посвященное Богу" #NT!
 nd_lat.7.b: "Новый Рим, наследник Цезарей" #NT!
 nd_lat.8.t: "Доминион Эгейского моря" #NT!
 nd_lat.8.d: "Герцогство Наксос и остров Крит теперь являются опорой венецианской торговой сети в Эгейском море. От великой гавани Кандии до побеленных башен Наксоса латинские купцы контролируют морские пути, соединяющие Константинополь с обширным Средиземноморьем.\n\nКаждый корабль, проходящий через эти воды, отдает дань империи. Эгейское море стало латинским озером." #NT!
 nd_lat.8.a: "Море в нашей власти" #NT!
 nd_lat.9.t: "Шелковая монополия" #NT!
 nd_lat.9.d: "Константинополь вернул себе свою древнюю роль крупнейшего в мире рынка предметов роскоши. Шелк из Китая и Персии, специи из Индии и меха с севера — все они текут через наши рынки, облагаются налогами и продаются латинскими купцами.\n\nПеред нами стоит вопрос, как лучше всего использовать этот неожиданный доход. Мы могли бы инвестировать в производство готовой продукции, превращая шелк-сырец в прекрасные ткани. Или мы могли бы сосредоточиться на таможенных поступлениях, облагая налогом потоки товаров через наши порты." #NT!
 nd_lat.9.a: "Инвестируйте в наши мастерские и ткацкие станки" #NT!
 nd_lat.9.b: "Облагайте налогом торговлю, которая проходит через нас" #NT!
 nd_lat.10.t: "Восточный торговый центр" #NT!
 nd_lat.10.d: "От Каффы на Черном море до Смирны на побережье Эгейского моря торговая сеть Латинской империи охватывает два моря и дюжину народов. Наши купцы торгуют в каждом порту, наши банкиры финансируют каждое предприятие, наши корабли перевозят товары трех континентов.\n\nМы стоим на перекрестке мира. Должны ли мы сосредоточиться на богатых левантийских торговых путях на юге или повернуть на север, чтобы доминировать над Черным морем и его внутренними районами?" #NT!
 nd_lat.10.a: "Левант – наше будущее" #NT!
 nd_lat.10.b: "Черное море будет нашим владением" #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_march_zeal: "Крестоносное рвение" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_march_zeal: "Жар священной войны толкает латинские армии глубже в Анатолию, принимая экономические потрясения как цену праведного завоевания." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_march_pragmatism: "Анатолийская консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_march_pragmatism: "Методический подход к удержанию завоеванных анатолийских территорий, сокращению военных расходов и созданию устойчивой гарнизонной системы." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_holy_crusade: "Триумф Святого крестового похода" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_holy_crusade: "Возвращение Святой Земли активизировало христианский мир. Паломники и воины стекаются под латинское знамя, вдохновленные священной миссией империи." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_latin_imperium: "Латинская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_latin_imperium: "Латинская империя позиционирует себя как истинная наследница Рима, светская имперская держава, пользующаяся уважением благодаря престижу, закону и дипломатии." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_silk_exchange: "Константинопольская шелковая биржа" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_silk_exchange: "Инвестиции империи в производство и переработку шелка создали процветающую индустрию предметов роскоши, хотя сосредоточенность на торговле обходится ценой боеготовности военно-морского флота." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_customs_revenue: "Таможня «Перекресток»" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_customs_revenue: "Систематический таможенный режим облагает налогом огромный поток товаров через порты Константинополя, финансируя амбициозные строительные проекты по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_levantine_network: "Левантийская торговая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_levantine_network: "Разветвленная коммерческая сеть, соединяющая порты Леванта с рынками Европы, приносящая огромное богатство, но отвлекающая ресурсы от научных занятий." #NT!
 STATIC_MODIFIER_NAME_nd_lat_dest_black_sea_hegemony: "Черноморская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_lat_dest_black_sea_hegemony: "Латинская империя доминирует на Черном море, контролируя потоки зерна, мехов и рабов с северных берегов через свою сеть торговых колоний." #NT!
 nd_lat_holy_sepulchre: "Командорство Гроба Господня" #NT!
 nd_lat_holy_sepulchre_desc: "Укреплённое религиозно-военное командование, призванное защищать Святую Землю, с гарнизоном рыцарей, поклявшихся защищать священные места христианского мира." #NT!
 nd_lat_commandery_maintenance: "Коммандери Гарнизон" #NT!
 nd_lat_commandery_maintenance_desc: "Оружие, камень для укреплений и пчелиный воск для часовни, в которой находится командование рыцарей-крестоносцев." #NT!
 nd_lat_emporion: "Эмпорион" #NT!
 nd_lat_emporion_desc: "Грандиозный торговый центр, где купцы со всего Средиземноморья и за его пределами собираются, чтобы покупать, продавать и обменивать товары под защитой латинского права." #NT!
 nd_lat_emporion_maintenance: "Перевалочные операции" #NT!
 nd_lat_emporion_maintenance_desc: "Ткань, бумага, пиломатериалы и соль, необходимые для работы крупного международного торгового поста." #NT!
  
  # ===== BUREAUCRACIES ===== 
 lat_partitio_romaniae_bureaucracy: "Румынский раздел" #NT!
 lat_partitio_romaniae_bureaucracy_desc: "Договор, подписанный 1 октября 1204 года, разделил Византийскую империю между победителями Четвертого крестового похода: три восьмых достались Венеции, четверть - императору Болдуину, а оставшаяся часть отошла баронам-крестоносцам, держащим Plena Potestas в обмен на ежегодную военную службу с 1 июня по 29 сентября. Раздел закрепил наследственную феодальную аристократию, лояльность которой была договорной, а не личной, в результате чего латинский трон стал структурно слабым. но его баронский хозяин грозен." #NT!
 lat_cour_des_pairs_bureaucracy: "Кур де Пары" #NT!
 lat_cour_des_pairs_bureaucracy_desc: "Верхний Кур, феодальный совет баронов, созданный по образцу Королевской курии Иерусалимского королевства. В Константинополе император созвал его вместе с венецианским Подестом и его советом из шести человек; в Андравиде двенадцать ахейских баронств низвели своего князя до уровня первого среди равных, которому было запрещено устанавливать смертную казнь без их согласия. Его решения сформировали прецедентную базу, позже кодифицированную в Assises de Romanie." #NT!
 lat_patriarchatus_latinus_bureaucracy: "Патриархат Латинский" #NT!
 lat_patriarchatus_latinus_bureaucracy_desc: "Латинский Патриархат был основан после завоевания 13 апреля 1204 года, когда венецианский иподиакон Томас Морозини был рукоположен в сан первого патриарха. Он вытеснил Православный Вселенский Патриархат, навязал византийским церквям римский обряд и опресноки, потребовал рукоположения новых епископов по латинским формам и проводил службы на латыни, а не на греческом языке, что было богословским рычагом для объединения церквей, что было первоначальным церковным предлогом Крестового похода." #NT!
 lat_podesta_venetus_bureaucracy: "Подеста Венетус" #NT!
 lat_podesta_venetus_bureaucracy_desc: "Венецианский подеста Константинополя, который управлял тремя восьмыми города к северу от Мезы, закрепленными за Венецией, использовал византийский титул деспота, чтобы утвердить почти равенство с императором, и подчинялся дожу, а не латинскому трону. Возглавляя совет из шести членов и отдельный список чиновников в портах империи, он был скорее послом и наместником, чем вассалом, и после 1265 года эту роль продолжал его преемник Байло на протяжении столетий после реставрации Палеологов." #NT!
 lat_assises_de_romanie_bureaucracy: "Ассис де Романи" #NT!
 lat_assises_de_romanie_bureaucracy_desc: "Правовой кодекс Франкократии, составленный на основе обычаев Княжества Ахея и прецедентов Верхнего Кура. Он опирался на Иерусалимские ассисы и привил византийскую практику пронойи к франкской феодальной процедуре, регулирующей владение паройкой, феодальные обязательства и юридическое положение греческого населения. Через Ахайю его нормы распространились на Кипр и на острова Эгейского моря в качестве канонического юридического текста Латинской Греции до конца пятнадцатого века." #NT!
  
 AUTO_MODIFIER_NAME_nd_lat_bureaucracy_authority: "Латинская имперская власть" #NT!
 AUTO_MODIFIER_DESC_nd_lat_bureaucracy_authority: "При формировании [LAT.GetName] институциональная матрица урегулирования Четвертого крестового похода (баронские суды, Латинский Патриархат, Венецианская Подеста и Ассасы Романии) становится доступной в виде переключаемой бюрократии восстановленного государства крестоносцев." #NT!
