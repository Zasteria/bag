l_russian:
  ## Advance Names and Descriptions ## 
 nd_hre_reichshofkanzlei: "Рейхсхофканцлей" #NT!
 nd_hre_reichshofkanzlei_desc: "Reichshofkanzlei служил центральным административным органом, через который император управлял обширными и фрагментированными территориями Священной Римской империи. Канцелярия, укомплектованная обученными юристами и священнослужителями, обрабатывала имперскую корреспонденцию, издавала указы и поддерживала правовую основу, объединявшую сотни полуавтономных территорий в единое государство." #NT!
 nd_hre_imperial_knights: "Императорское рыцарство" #NT!
 nd_hre_imperial_knights_desc: "Рейхсриттеры, или Имперские рыцари, были обязаны подчиняться непосредственно Императору, а не какому-либо промежуточному принцу. Эти конные воины составляли основу феодальной военной традиции Империи, поддерживая боевые обычаи тяжелой кавалерии, которые определяли военные действия в Центральной Европе со времен Карла Великого." #NT!
 nd_hre_feudal_hierarchy: "Имперская феодальная иерархия" #NT!
 nd_hre_feudal_hierarchy_desc: "Сложная иерархия курфюрстов, принцев, графов и рыцарей, составлявшая императорские сословия, создавала сложную сеть лояльности, обязательств и привилегий. Хотя эта структура зачастую была громоздкой, она обеспечивала императору основу управления, с которой ни одна другая европейская монархия не могла сравниться по своему многообразию." #NT!
 nd_hre_reichstag_origins: "Истоки Рейхстага" #NT!
 nd_hre_reichstag_origins_desc: "Имперский сейм, или Рейхстаг, превратился из неформальных собраний князей Империи в структурированный законодательный орган. К концу пятнадцатого века в нем сложились отдельные советы избирателей, князей и имперских городов, каждый из которых обладал полномочиями обсуждать вопросы налогообложения, войны и имперских реформ." #NT!
 nd_hre_bergregal: "Имперские права на добычу полезных ископаемых" #NT!
 nd_hre_bergregal_desc: "Бергрегал установил суверенное право Императора на минеральные богатства по всей Империи. Эти прерогативы горнодобывающей промышленности, впервые закрепленные в Ронкальской конституции Барбароссы 1158 года, позволили систематически эксплуатировать богатые месторождения серебра и меди в Центральной Европе, особенно в Саксонии, Богемии и Тироле." #NT!
 nd_hre_landfrieden: "Традиция Ландфриды" #NT!
 nd_hre_landfrieden_desc: "Средневековые прокламации Ландфрида были направлены на ограничение частных войн и поддержание общественного порядка на раздробленных территориях Империи. Хотя эти мирные декларации часто уважались больше за нарушение, чем за соблюдение, они устанавливали принцип, согласно которому Император нес ответственность за поддержание порядка во всем королевстве." #NT!
 nd_hre_messeplatz: "Мессеплац" #NT!
 nd_hre_messeplatz_desc: "Крупные ярмарки Франкфурта и Лейпцига привлекали купцов со всей Европы и за ее пределами. Эти периодические рынки, санкционированные имперскими привилегиями, служили важнейшими узлами континентальной торговой сети, где товары, кредиты и информация свободно перемещались через политические границы." #NT!
 nd_hre_bergakademie: "Бергакадемия" #NT!
 nd_hre_bergakademie_desc: "Бергакадемия представляла собой институционализацию горных знаний, накопленных за столетия добычи полезных ископаемых в Центральной Европе. Эти академии готовили инженеров и контролеров в области геологии, металлургии и управления горными работами, превращая кустарную добычу полезных ископаемых в систематическую науку.\n\n#italic Доступно в: $nd_hre_bergakademie$#!" #NT!
 nd_hre_maximilian_court: "Ренессансный двор Максимилиана" #NT!
 nd_hre_maximilian_court_desc: "Император Максимилиан I превратил императорский двор в центр образования и художественного покровительства эпохи Возрождения. Его двор в Инсбруке привлекал ученых, художников и музыкантов, а его страсть к турнирам, генеалогии и саморекламе посредством искусства помогла определить идеал принца эпохи Возрождения." #NT!
 nd_hre_reichspost: "Императорская почтовая система" #NT!
 nd_hre_reichspost_desc: "Рейхспочта, вверенная семье Турн и Таксис с 1490 года, создала первую в Европе систематическую почтовую сеть, охватывающую Священную Римскую империю. Регулярные конные курьеры соединяли крупные города на тысячи миль, меняя коммуникации, торговлю и имперское управление." #NT!
 nd_hre_handelsmesse: "Торговая сеть Мессе" #NT!
 nd_hre_handelsmesse_desc: "Формализованная система имперских торговых ярмарок создала сеть периодических рынков, которые связывали производителей, торговцев и потребителей по всей Империи. Эти ярмарки способствовали обмену товарами и идеями, от торговцев тканями Лейпцига до книготорговцев Франкфурта.\n\n#italic Доступно в: $nd_hre_messeplatz$#!" #NT!
 nd_hre_reichsmatrikel: "Регистр Имперской Армии" #NT!
 nd_hre_reichsmatrikel_desc: "Рейхсматрикель установил военные обязательства каждого имперского сословия, указав количество войск и финансовые взносы, которые каждая территория должна предоставить для общей защиты. Эта система разделения военного бремени превратила феодальные сборы Империи в более предсказуемую, хотя и все еще децентрализованную военную силу." #NT!
 nd_hre_reichskammergericht: "Рейхскамергерихт" #NT!
 nd_hre_reichskammergericht_desc: "Основанный на сейме в Вормсе в 1495 году, Рейхскамергерихт служил высшим судебным учреждением Империи. Укомплектованный обученными римскими юристами, он разрешал споры между имперскими поместьями, обеспечивал соблюдение Эвигера Ландфрида и обеспечивал мирную альтернативу вендетте и частным войнам, которые преследовали Империю на протяжении веков." #NT!
 nd_hre_ewiger_landfriede: "Вечный общественный мир" #NT!
 nd_hre_ewiger_landfriede_desc: "Эвигер Ландфрида 1495 года представлял собой окончательный и вечный запрет на средневековое право вендетты в Священной Римской империи. Провозглашенный на сейме в Вормсе при Максимилиане I, он установил, что все споры отныне должны разрешаться через суд, а не силой оружия." #NT!
 nd_hre_reichskreise: "Имперские круги" #NT!
 nd_hre_reichskreise_desc: "Десять рейхскрайзов, созданных между 1500 и 1512 годами, организовали территории Империи в региональные административные группы. Каждый круг отвечал за сбор имперских налогов, поддержание общественного спокойствия, исполнение судебных решений и мобилизацию военных контингентов, создавая федеральную структуру, уникальную для европейского управления." #NT!
 nd_hre_druckkunst: "Наследие печатного станка" #NT!
 nd_hre_druckkunst_desc: "Изобретение Гутенбергом подвижного шрифта в Майнце около 1440 года превратило Священную Римскую империю в интеллектуальную кузницу Европы. Немецкие типографские мастерские быстро распространились на Страсбург, Нюрнберг и Аугсбург, распространяя гуманистическую науку, религиозные дебаты и практические знания со скоростью, которой никогда не могла достичь рукописная культура." #NT!
 nd_hre_imperial_pikeman: "Императорские Пикинные полки" #NT!
 nd_hre_imperial_pikeman_desc: "Реформированная пехота эпохи пострейхсреформ объединила дисциплинированные пикинарные формирования, доказавшие свою разрушительную эффективность в швейцарской войне, с организационной структурой, требуемой новой имперской военной системой. Эти профессионально обученные копейщики представляли собой ответ Империи на военную революцию шестнадцатого века." #NT!
 nd_hre_universitaeten: "Традиции Императорского университета" #NT!
 nd_hre_universitaeten_desc: "Священная Римская империя могла похвастаться самой густой сетью университетов в христианском мире: от древних фондов в Праге, Вене и Гейдельберге до новых учебных заведений по всей Германии. Эти учреждения готовили юристов, теологов и администраторов, которые поддерживали сложный конституционный механизм Империи." #NT!
 nd_hre_augsburger_religionsfriede: "Аугсбургский мир" #NT!
 nd_hre_augsburger_religionsfriede_desc: "Религиозный мир в Аугсбурге 1555 года установил принцип cuius regio, eius religio, чья сфера, его религия. Это революционное соглашение предоставило лютеранским князьям законное право определять конфессию своих территорий, положив конец десятилетиям религиозной войны внутри Империи и создав основу для конфессионального сосуществования." #NT!
 nd_hre_reichsheer: "Контингенты Имперской Армии" #NT!
 nd_hre_reichsheer_desc: "Рейхшер формализовал систему, с помощью которой имперские круги формировали и оснащали воинские контингенты в соответствии с Рейхсматрикелем. Хотя эти региональные силы никогда не представляли собой постоянную армию, они могли быть мобилизованы для общей обороны, представляя собой коллективный военный потенциал сотен составных территорий Империи." #NT!
 nd_hre_zeughaus: "Цойгауз" #NT!
 nd_hre_zeughaus_desc: "Цойхаус служил одновременно оружейным складом и центром производства имперской военной техники. Из огромных арсеналов в Берлине, Вене и Аугсбурге Империя хранила запасы оружия, доспехов и пороха, которыми можно было в кратчайшие сроки снабдить Рейхсармию." #NT!
 nd_hre_reichshandelsordnung: "Имперское управление торговлей" #NT!
 nd_hre_reichshandelsordnung_desc: "Имперские коммерческие правила стремились стандартизировать вес, меры и торговую практику на фрагментированном экономическом ландшафте Империи. Хотя правоприменение оставалось неравномерным, эти постановления обеспечили общую основу, которая облегчила торговлю на большие расстояния между сотнями рынков и ярмарок Империи." #NT!
 nd_hre_konfessionspolitik: "Конфессиональная дипломатия" #NT!
 nd_hre_konfessionspolitik_desc: "Религиозное разделение Империи на католический и протестантский лагеря создало своеобразную форму конфессиональной политики. Имперские государственные деятели научились лавировать между религиозными блоками, используя дипломатические навыки, юридические прецеденты и конституционный механизм Империи для поддержания хрупкого баланса между конфессиями." #NT!
 nd_hre_metallverarbeitung: "Императорский металлургический завод" #NT!
 nd_hre_metallverarbeitung_desc: "Богатые месторождения железа, меди и серебра Империи поддерживали обширную металлообрабатывающую промышленность, сосредоточенную в Саксонии, горах Гарца и Штирийских Альпах. Имперские металлурги разработали передовые методы плавки и ковки, благодаря которым изделия из железа и вооружения Центральной Европы стали известны на весь континент.\n\n#italic Доступно в: $nd_hre_zeughaus$#!" #NT!
 nd_hre_westfaelischer_friede: "Вестфальский мир" #NT!
 nd_hre_westfaelischer_friede_desc: "Вестфальский мир 1648 года положил конец катастрофической Тридцатилетней войне и изменил конституционный порядок Империи. Кальвинизм был признан наряду с католицизмом и лютеранством, императорские владения получили больший суверенитет, а принцип религиозной терпимости был заложен в основной закон Империи." #NT!
 nd_hre_kaiserliche_kurassiere: "Императорские кирасиры" #NT!
 nd_hre_kaiserliche_kurassiere_desc: "Kaiserliche Kurassiere представлял собой вершину тяжелой кавалерии в пост-Вестфальской империи. Эти элитные всадники, оснащенные нагрудником и шлемом, вооруженные мечом и пистолетом, наносили сокрушительные удары, способные разрушить пехотные порядки. Великие кавалерийские академии Империи обучали поколения офицеров искусству конной войны." #NT!
 nd_hre_reichsarmee: "Постоянная Рейхсармия" #NT!
 nd_hre_reichsarmee_desc: "Оформление Рейхсармии в более постоянное учреждение дало Империи военную силу, способную защищать свои границы и проецировать мощь. Хотя они по-прежнему набирались из контингентов отдельных государств, улучшенная координация через Имперские круги создала силу, превосходящую сумму ее частей." #NT!
 nd_hre_barockkultur: "Императорская культура барокко" #NT!
 nd_hre_barockkultur_desc: "Эпоха барокко превратила дворы и города Империи в витрины художественного великолепия. От величественных дворцов Вены и Дрездена до паломнических церквей Баварии стиль барокко выражал как силу имперской традиции, так и культурную жизнеспособность немецких земель." #NT!
 nd_hre_rathaus: "Ратуша" #NT!
 nd_hre_rathaus_desc: "Великий Ратэзер имперских городов олицетворял гражданскую гордость и городское самоуправление в конституционных рамках Империи. Эти внушительные сооружения служили центрами муниципального управления, правосудия и торговли, в них располагались советы, управлявшие некоторыми из самых богатых городов Европы." #NT!
 nd_hre_postwesen: "Императорская почтовая сеть" #NT!
 nd_hre_postwesen_desc: "Расширение почтовой системы Турн-унд-Таксис в комплексную сеть, охватывающую территории Империи, создало наиболее эффективную коммуникационную инфраструктуру в Европе раннего Нового времени. Регулярные почтовые маршруты связывали даже провинциальные города с крупными торговыми и правительственными центрами." #NT!
 nd_hre_aufklaerung: "Немецкое Просвещение" #NT!
 nd_hre_aufklaerung_desc: "Aufklarung привнес в институты Империи идеалы разума, терпимости и систематического знания. Немецкие философы от Лейбница до Канта преобразовали европейскую мысль, а просвещенные администраторы в Пруссии, Австрии и небольших немецких государствах модернизировали управление, образование и правосудие." #NT!
 nd_hre_imperial_fusilier: "Имперские стрелки" #NT!
 nd_hre_imperial_fusilier_desc: "Имперские фузилеры представляли собой профессионализацию пехотной войны в поздней Империи. Обученные строевой подготовке и тактике эпохи Просвещения, вооруженные стандартными мушкетами и штыками, эти солдаты воплощали рационализированный подход к войне, который характеризовал военную революцию восемнадцатого века." #NT!
 nd_hre_manufaktur: "Императорские мануфактуры" #NT!
 nd_hre_manufaktur_desc: "Распространение централизованного производства по всей Империи превратило традиционное ремесленное производство в протоиндустриальное предприятие. Спонсируемые государством мануфактуры по производству фарфора, текстиля и изделий из металла сочетали немецкое техническое мастерство с принципами рациональной организации эпохи Просвещения.\n\n#italic Доступно в: $nd_hre_messeplatz$#!" #NT!
 nd_hre_polizeiwissenschaft: "Наука управления" #NT!
 nd_hre_polizeiwissenschaft_desc: "Polizeiwissenschaft, немецкая наука об управлении и государственном управлении, стремилась систематизировать каждый аспект государственного управления. Опираясь на многовековой имперский конституционный опыт, немецкие операторы разработали комплексные теории финансовой политики, управления населением и общественного благосостояния, которые повлияли на административную практику по всей Европе." #NT!
 nd_hre_reichsverfassung: "Имперская конституционная традиция" #NT!
 nd_hre_reichsverfassung_desc: "Накопленный конституционный закон Империи, от Золотой Быки до Вестфальского мира и других, создал совокупность прецедентов и принципов, уникальных в европейском управлении. Эта конституционная традиция уравновешивала имперскую власть и княжескую свободу, обеспечивая основу для федерального управления, которое повлияло на более позднюю конституционную мысль." #NT!
 nd_hre_kavallerieschule: "Каваллериешуле" #NT!
 nd_hre_kavallerieschule_desc: "Учебные академии для офицерского корпуса Империи, обучающие верховой езде, тактике кавалерии и военному делу. Такие учреждения, как Испанская школа верховой езды в Вене, сохранили и усовершенствовали многовековые традиции конного спорта, выпуская квалифицированных кавалерийских офицеров, которые возглавляли конные войска Империи." #NT!
  ## Unit Names and Descriptions ## 
 a_nd_hre_imperial_reiter: "Имперский Рейтер" #NT!
 a_nd_hre_imperial_reiter_desc: "Имперские рейтеры, конные рыцари, подчинявшиеся непосредственно императору, поддерживали феодальную военную традицию, которая на протяжении веков определяла военные действия в Центральной Европе. Вооруженные копьями, мечами и тяжелыми доспехами, они представляли военную элиту Империи." #NT!
 a_nd_hre_imperial_pikeman: "Имперский пикинер" #NT!
 a_nd_hre_imperial_pikeman_desc: "Дисциплинированная пехота с пиками, обученная в реформированной имперской военной системе. Организованные в плотные формирования с восемнадцатифутовыми пиками, эти солдаты удерживали оборону от атак кавалерии и закрепляли боевые порядки Империи." #NT!
 a_nd_hre_reichsheer_infantry: "Германская императорская армия" #NT!
 a_nd_hre_reichsheer_infantry_desc: "Пехотные контингенты, собранные в рамках Имперской военной системы, собранные со всех территорий Империи. Несмотря на отсутствие профессиональной сплоченности постоянных армий, огромная численность и региональное разнообразие Рейхшера сделали его грозной оборонительной силой." #NT!
 a_nd_hre_kaiserliche_kurassiere: "Кайзерличе Курассиер" #NT!
 a_nd_hre_kaiserliche_kurassiere_desc: "Элитная тяжелая кавалерия Империи, оснащенная кирасами и вооруженная мечом и пистолетом. Kaiserliche Kurassiere были обучены наносить разрушительные шоковые удары, которые могли сломать вражеские порядки, продолжая боевые традиции имперского рыцарства в эпоху пороха." #NT!
 a_nd_hre_imperial_fusilier: "Имперский стрелок" #NT!
 a_nd_hre_imperial_fusilier_desc: "Профессиональная линейная пехота поздней Империи, обученная строевой подготовке эпохи Просвещения и оснащенная стандартными кремневыми мушкетами. Имперские стрелки олицетворяли рационализированные военные реформы, направленные на создание современной постоянной армии на основе древних военных традиций Империи." #NT!
  ## Building Descriptions (unique buildings not sharing advance keys) ## 
 nd_hre_universitas: "Университеты" #NT!
 nd_hre_universitas_desc: "Имперский университет, собиравший ученых со всех немецких земель, готовивший юристов, теологов, врачей и администраторов, от которых зависело управление Империей." #NT!
 nd_hre_barockpalast: "Барокпаласт" #NT!
 nd_hre_barockpalast_desc: "Грандиозный дворец в стиле барокко, построенный в великолепном стиле, который характеризовал дворы поздней Империи, служил центром аристократической культуры, художественного покровительства и политической демонстрации." #NT!
  ## Production Method Names ## 
 nd_hre_imperial_mining: "Имперские горнодобывающие операции" #NT!
 nd_hre_imperial_mining_desc: "Систематическая добыча серебра и меди в рамках Бергрегала, суверенного права Императора на минеральные богатства." #NT!
 nd_hre_fair_trade: "Торгово-ярмарочная торговля" #NT!
 nd_hre_fair_trade_desc: "Регулируемая торговля на великих имперских ярмарках, ткани, красители и предметы роскоши со всей Европы." #NT!
 nd_hre_metalworks: "Императорский металлургический завод" #NT!
 nd_hre_metalworks_desc: "Передовые операции по плавке и ковке превратили залежи железа Центральной Европы в оружие и инструменты, поддерживавшие Империю." #NT!
 nd_hre_manufaktur_pm: "Централизованные мануфактуры" #NT!
 nd_hre_manufaktur_pm_desc: "Протоиндустриальное производство, сочетающее немецкий технический опыт с принципами рациональной организации Просвещения." #NT!
  ## Timed Modifier Names and Descriptions ## 
 STATIC_MODIFIER_NAME_nd_hre_pax_imperii: "Пакс Империи" #NT!
 STATIC_MODIFIER_DESC_nd_hre_pax_imperii: "По всей Империи был провозглашен Вечный Общественный Мир. Средневековое право на вендетту отменено, и все споры отныне должны разрешаться через суд." #NT!
 STATIC_MODIFIER_NAME_nd_hre_imperial_justice: "Имперское правосудие" #NT!
 STATIC_MODIFIER_DESC_nd_hre_imperial_justice: "Был создан Суд Императорской палаты, представляющий собой высшее судебное учреждение, в котором споры князей и жалобы подданных могут разрешаться в соответствии с римским правом." #NT!
 STATIC_MODIFIER_NAME_nd_hre_cuius_regio: "Cuius Regio, Eius Religio" #NT!
 STATIC_MODIFIER_DESC_nd_hre_cuius_regio: "Принцип, согласно которому каждый правитель может определять религию своей территории, положил конец открытой религиозной войне внутри Империи, создав основу для конфессионального сосуществования." #NT!
 STATIC_MODIFIER_NAME_nd_hre_westphalian_order: "Вестфальский орден" #NT!
 STATIC_MODIFIER_DESC_nd_hre_westphalian_order: "Вестфальский мир изменил конституционные основы Империи. Религиозная терпимость закрепляется законом, суверенные права уточняются, и начинается новая эра дипломатического порядка." #NT!
  ## Levy Names ## 
 levy_nd_hre_imperial_reiter: "Имперский Рейтер Леви" #NT!
 levy_nd_hre_imperial_reiter_desc: "Феодальные конные рыцари, выросшие из дворянских поместий Империи." #NT!
 levy_nd_hre_reichsheer: "Рейхшер Леви" #NT!
 levy_nd_hre_reichsheer_desc: "Пехотные контингенты, собранные через систему имперских военных взносов." #NT!
  ## Event Localization ## 
 nd_hre.2.t: "Вечный общественный мир" #NT!
 nd_hre.2.d: "На сейме в Вормсе собравшиеся сословия Империи провозгласили Ewiger Landfriede, «Вечный общественный мир». Это торжественное заявление навсегда отменяет древнее право вендетты, которое веками преследовало наше королевство. Отныне ни один принц, рыцарь или город не может брать в руки оружие для разрешения частных споров. Все жалобы должны подаваться в имперский суд.\n\nЛандфрида представляет собой нечто большее, чем просто запрет частной войны. Это декларация о том, что Империя — это правовое сообщество, связанное не только мечом, но и общими институтами и стремлением к справедливости. Недавно созданный Reichskammergericht готов выносить решения по спорам, которые когда-то разрешались бы на поле боя.\n\nПримем ли мы этот новый порядок как основу имперского управления или примем его как долгожданную передышку от беспорядка?" #NT!
 nd_hre.2.a: "Этот мир станет основой нашего королевства." #NT!
 nd_hre.2.b: "Мир необходимо защищать силой." #NT!
 nd_hre.3.t: "Императорский палатный суд" #NT!
 nd_hre.3.d: "Reichskammergericht был создан как высший судебный орган Священной Римской империи. В отличие от личного Аулического совета императора, этот суд черпает свою власть из самого императорского сейма, укомплектованного учеными юристами, обученными римскому праву и назначенными императорскими сословиями.\n\nЕго юрисдикция охватывает все споры между территориями Империи, нарушения общественного спокойствия, нарушения императорских указов, имущественные конфликты между князьями и претензии подданных против своих повелителей. Впервые Империя обладает постоянным судебным институтом, способным разрешать конфликты, дестабилизировавшие королевство на протяжении поколений.\n\nСоздание этого суда знаменует собой трансформацию в том, как Империя управляет собой. Правосудие больше не должно зависеть исключительно от воли и присутствия Императора, оно теперь находится в институтах закона." #NT!
 nd_hre.3.a: "Пусть справедливость станет опорой имперской власти." #NT!
 nd_hre.3.b: "Пусть суд расширит наше влияние по всей Империи." #NT!
 nd_hre.4.t: "Религиозный мир в Аугсбурге" #NT!
 nd_hre.4.d: "После десятилетий конфессиональной борьбы, грозившей расколоть Империю, собранные поместья достигли соглашения чрезвычайного значения. Аугсбургский мир устанавливает принцип cuius regio, eius religio: каждый правитель может определять, будет ли католицизм или лютеранство официальным признанием его территории.\n\nЭто не декларация индивидуальной религиозной свободы, а, скорее, прагматическое соглашение между суверенными князьями. Подданные, которые не могут принять избранное своим правителем вероисповедание, могут продать свою собственность и эмигрировать на территорию своей предпочтительной веры. Церковная оговорка защищает церковную собственность, в то время как Declaratio Ferdinandei разрешает существующую лютеранскую практику на определенных церковных территориях.\n\nМир несовершенен, кальвинизм остается непризнанным, а конкурирующие претензии на конфессиональную истину просто управляются, а не разрешаются. Тем не менее, он предлагает Империи то, в чем она нуждается больше всего: прекращение открытой религиозной войны и основу для сосуществования." #NT!
 nd_hre.4.a: "Пусть каждый князь управляет по своей совести." #NT!
 nd_hre.4.b: "Одна вера, одна Империя. Никакого компромисса быть не может." #NT!
 nd_hre.5.t: "Вестфальский мир" #NT!
 nd_hre.5.d: "После тридцати лет войны, унесшей жизни восьми миллионов душ и опустошившей сердце Европы, великие державы заключили Вестфальский мир в городах-побратимах Мюнстере и Оснабрюке. Это соглашение меняет конституционный порядок самой Священной Римской империи.\n\nКальвинизм теперь признается наряду с католицизмом и лютеранством. Суверенитет Имперских сословий подтвержден и расширен: они могут проводить собственную внешнюю политику, если не действуют против Императора или Империи. Имперский сейм получает новые полномочия, а конституционный баланс между Императором и сословиями кодифицируется способами, которые будут сохраняться в течение нескольких поколений.\n\nДля всего мира Вестфалия устанавливает принципы, которые будут определять формирующийся международный порядок: равенство суверенных государств, нерушимость территориальных границ и обязательство невмешательства во внутренние дела других государств. Империя выглядит уменьшенной в некоторых отношениях, но с более сложной конституционной структурой, чем любая другая в Европе." #NT!
 nd_hre.5.a: "Новый порядок для Империи и для Европы." #NT!
 nd_hre.5.b: "Давайте восстановим то, что разрушила война." #NT!
 nd_hre.6.t: "Немецкое Просвещение" #NT!
 nd_hre.6.d: "Aufklarung прокатился по университетам, судам и салонам Империи. От рациональной философии Лейбница до систематической метафизики Вольфа — немецкие мыслители меняют европейскую интеллектуальную жизнь. Густая сеть имперских университетов, вольных городов с их печатными станками и княжеских дворов, конкурирующих за культурные различия, создала исключительно плодородную среду для распространения идеалов Просвещения.\n\nПросвещенные администраторы по всей Империи применяют рациональные принципы управления, реформируют правовые кодексы, создают государственное образование, продвигают религиозную терпимость и модернизируют государственное управление. Традиция камерализма, рожденная многовековой конституционной практикой Империи, развивается во всеобъемлющую науку управления, которую изучают и подражают другие европейские государства.\n\nНемецкое Просвещение — это не просто интеллектуальное движение. Он трансформирует институты, законы и управление Империи изнутри." #NT!
 nd_hre.6.a: "Разум будет нашим проводником." #NT!
 nd_hre_chancellery_maintenance: "Содержание канцелярии" #NT!
 nd_hre_chancellery_maintenance_desc: "Ведение административных записей, юридических книг и переписки Имперской канцелярии." #NT!
 nd_hre_fair_maintenance: "Содержание ярмарки" #NT!
 nd_hre_fair_maintenance_desc: "Подготовка и содержание площадей, палаток и помещений для проведения Императорских ярмарок." #NT!
 nd_hre_mining_operations: "Горные работы" #NT!
 nd_hre_mining_operations_desc: "Поставка деревянных опор и железных инструментов для работы горнодобывающей академии." #NT!
 nd_hre_court_maintenance: "Содержание суда" #NT!
 nd_hre_court_maintenance_desc: "Ведение записей, печатей, юридических книг и юридической корреспонденции Имперского суда." #NT!
 nd_hre_university_maintenance: "Содержание университета" #NT!
 nd_hre_university_maintenance_desc: "Предоставление книг, бумаги и научных материалов Имперскому университету." #NT!
 nd_hre_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_hre_arsenal_maintenance_desc: "Производство и хранение оружия и техники в Имперском арсенале." #NT!
 nd_hre_palace_maintenance: "Содержание дворца" #NT!
 nd_hre_palace_maintenance_desc: "Уход за каменной кладкой и стеклом большого дворца в стиле барокко." #NT!
 nd_hre_rathaus_maintenance: "Содержание Ратхауса" #NT!
 nd_hre_rathaus_maintenance_desc: "Обслуживание гражданских зданий и административной деятельности Имперской ратуши." #NT!
 nd_hre_academy_maintenance: "Содержание Академии" #NT!
 nd_hre_academy_maintenance_desc: "Предоставление лошадей, снаряжения и инструкторов для кавалерийской академии." #NT!
 STATIC_MODIFIER_NAME_nd_hre_armed_peace: "Вооруженный мир" #NT!
 STATIC_MODIFIER_DESC_nd_hre_armed_peace: "Вечный общественный мир поддерживается не только законом, но и военной готовностью императорских сословий. Мир сохраняется, потому что все знают цену его нарушения." #NT!
 STATIC_MODIFIER_NAME_nd_hre_imperial_diplomacy: "Имперская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_hre_imperial_diplomacy: "Суд Императорской Палаты расширяет дипломатическое влияние Империи, поскольку его юридические полномочия разрешают споры, которые когда-то требовали послов и армий." #NT!
 STATIC_MODIFIER_NAME_nd_hre_religious_conformity: "Религиозное соответствие" #NT!
 STATIC_MODIFIER_DESC_nd_hre_religious_conformity: "Одна вера, одна Империя. Настойчивое требование религиозного единообразия укрепляет государственную власть и социальную сплоченность, даже ценой нетерпимости к инакомыслию." #NT!
 STATIC_MODIFIER_NAME_nd_hre_postwar_recovery: "Послевоенное восстановление" #NT!
 STATIC_MODIFIER_DESC_nd_hre_postwar_recovery: "Разрушения войны уступают место восстановлению. Торговля возобновляется, поля засеваются заново, а экономика медленно восстанавливается после катастрофы." #NT!
