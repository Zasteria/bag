l_russian:
 STATIC_MODIFIER_NAME_nd_wittenberg_legacy: "Виттенбергское наследие" #NT!
 STATIC_MODIFIER_DESC_nd_wittenberg_legacy: "Со ступенек Замковой церкви по христианскому миру прокатилась революция идей. Университеты и типографии Саксонии должны стать инструментами новой эпохи обучения, толерантности и реформ." #NT!
 STATIC_MODIFIER_NAME_nd_augustan_splendor: "Августан Великолепие" #NT!
 STATIC_MODIFIER_DESC_nd_augustan_splendor: "Серебро Рудных гор, фарфор Мейсена, дворцы Дрездена: богатство и великолепие Саксонии сделают ее предметом зависти каждого двора Европы." #NT!
 nd_sax.1.t: "Восходящий электорат" #NT!
 nd_sax.1.d: "Сформирован электорат Саксонии: второй в Империи после самого императора. Династия Веттинов владеет самыми богатыми рудниками христианского мира, крупнейшими торговыми ярмарками в Германии и конституционной властью определять будущее Священной Римской империи.\n\nНо что будет определять наследие Саксонии? Электорат породил Реформацию, в которой тезисы Мартина Лютера взорвали мир. Виттенберг и Лейпциг — центры обучения, где процветают новые идеи. Тем не менее, Саксония не менее известна своим материальным великолепием: серебряные горы, фарфоровые изделия, барочное великолепие Дрездена Августа Сильного.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sax.1.a: "Мы — земля идей и реформ." #NT!
 nd_sax.1.b: "Мы Флоренция на Эльбе" #NT!
 STATIC_MODIFIER_NAME_nd_saxon_schmalkaldic_arms: "Шмалькальдский герб" #NT!
 STATIC_MODIFIER_DESC_nd_saxon_schmalkaldic_arms: "Саксонские солдаты маршируют вместе со своими протестантскими братьями, стремясь защитить реформированную веру силой оружия." #NT!
 STATIC_MODIFIER_NAME_nd_saxon_schmalkaldic_diplomacy: "Шмалькальдская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_saxon_schmalkaldic_diplomacy: "Курфюрст Саксонии пользуется конституционным престижем и дипломатическим влиянием, чтобы добиться протестантского консенсуса, обеспечивая реформированную веру посредством переговоров, а не битв." #NT!
 STATIC_MODIFIER_NAME_nd_saxon_golden_dresden: "Золотой Дрезден" #NT!
 STATIC_MODIFIER_DESC_nd_saxon_golden_dresden: "Под покровительством Августа Сильного Дрезден превратился в «Флоренцию на Эльбе»: город дворцов в стиле барокко, коллекций мирового уровня и культурного великолепия, способного соперничать с любым двором Европы." #NT!
 STATIC_MODIFIER_NAME_nd_saxon_bergakademie_science: "Бергакадемия науки" #NT!
 STATIC_MODIFIER_DESC_nd_saxon_bergakademie_science: "Первый в мире горный университет совершил революцию в прикладной науке, готовя инженеров и геологов, чьи методы преобразуют промышленность по всему континенту." #NT!
 nd_sax.2.t: "Шмалькальдский союз" #NT!
 nd_sax.2.d: "В феврале 1531 года протестантские князья Германии собрались в Шмалькальдене в Тюрингии. Под руководством курфюрста Саксонии и ландграфа Гессенского они заключили оборонительный союз против императора Карла V, пообещав 10 000 пехоты и 2 000 кавалерии для взаимной защиты.\n\nШмалькальдский союз представляет собой первую организованную протестантскую военную силу в Европе. Будучи старшим членом Лиги, Саксония должна решить, как распорядиться этой властью." #NT!
 nd_sax.2.a: "Соберите протестантские армии под нашим знаменем." #NT!
 nd_sax.2.b: "Используйте наш электоральный престиж для дипломатической защиты." #NT!
 nd_sax.3.t: "Флоренция на Эльбе" #NT!
 nd_sax.3.d: "Август Сильный мечтает превратить Дрезден в город, способный соперничать с Версалем. Дворец Цвингер возвышается в великолепии барокко, спроектированный Поппельманном и украшенный скульптурами Пермозера. В Зеленом своде хранится одна из самых великолепных коллекций сокровищ в Европе. Придворный художник Бернардо Беллотто запечатлел горизонт города во всех ярких деталях.\n\nКаменный купол Фрауэнкирхе венчает горизонт. Королевская опера культивирует музыкальные традиции, привлекающие композиторов со всей Европы. Золотой век Дрездена начался." #NT!
 nd_sax.3.a: "Пусть мир восхищается саксонским великолепием" #NT!
 nd_sax.4.t: "Бергакадемия" #NT!
 nd_sax.4.d: "21 ноября 1765 года принц Саксонии Франциск Ксаверий основывает Bergakademie Freiberg: первый в мире университет горных и металлургических наук. Созданная в результате острой необходимости возродить Рудные рудники после опустошительной Семилетней войны, академия быстро становится маяком практического научного образования.\n\nАвраам Готтлоб Вернер наводит порядок в мире полезных ископаемых. Александр фон Гумбольдт учится здесь перед своими легендарными экспедициями. Ученые академии продолжат открывать химические элементы индий и германий. Модель Бергакадемии копируется из Санкт-Петербурга в Мехико." #NT!
 nd_sax.4.a: "Наука возобновит то, что предоставила природа" #NT!
 nd_sax_erzgebirge_silver: "Рудные горы Серебро" #NT!
 nd_sax_erzgebirge_silver_desc: "Рудные горы приносят свои сокровища: серебро, обнаруженное недалеко от Фрайберга в 1168 году, положило начало лихорадке добычи полезных ископаемых, которая на протяжении столетий финансировала саксонское могущество." #NT!
 nd_sax_freiberger_bergrecht: "Фрайбергер Бергрехт" #NT!
 nd_sax_freiberger_bergrecht_desc: "Горный кодекс Фрайберга 1296 года установил права «свободных горняков» и создал одну из первых в Европе систематических правовых рамок для добычи полезных ископаемых." #NT!
 nd_sax_trade_crossroads: "Торговый перекресток" #NT!
 nd_sax_trade_crossroads_desc: "Рынки Лейпцига, расположенные на пересечении улиц Виа Регия и Виа Империи, с 1165 года привлекают купцов, торгующих тканями, вином, специями и изделиями из металла." #NT!
 nd_sax_wettin_retainers: "Ретейнеры Веттина" #NT!
 nd_sax_wettin_retainers_desc: "Шахтерские поселения Рудных гор предоставляют двору Веттинов крепкую милицию, людей, закаленных горными туннелями, которые сражаются с выносливостью камня, который они вырубают." #NT!
 nd_sax_leipzig_messe: "Лейпцигская ярмарка" #NT!
 nd_sax_leipzig_messe_desc: "Императорские привилегии гарантируют безопасное проведение Лейпцигских ярмарок всем купцам, даже тем, правители которых находятся в состоянии войны с Саксонией." #NT!
 nd_sax_cranach_werkstatt: "Кранах Веркштатт" #NT!
 nd_sax_cranach_werkstatt_desc: "Мастерская Лукаса Кранаха Старшего в Виттенберге производила картины, гравюры на дереве и печатные материалы, которые сформировали визуальный язык Реформации." #NT!
 nd_sax_guldengroschen: "Гульденгрошен" #NT!
 nd_sax_guldengroschen_desc: "Первый немецкий гульденгрошен, выпущенный в Саксонии в 1500 году, создал прецедент для чеканки крупных серебряных монет, которые впоследствии превратились в талер и, в конечном итоге, в доллар." #NT!
 nd_sax_wittenberg_university: "Виттенбергский университет" #NT!
 nd_sax_wittenberg_university_desc: "Основанный в 1502 году Фридрихом Мудрым, Виттенбергский университет привлек Мартина Лютера, Филиппа Меланхтона и поколение реформаторов, которые изменили христианский мир." #NT!
 nd_sax_schmalkaldic_league: "Шмалькальдская лига" #NT!
 nd_sax_schmalkaldic_league_desc: "Оборонительный союз протестантских князей во главе с Саксонией и Гессеном стал военным щитом Реформации против императора Карла V." #NT!
 nd_sax_book_fair: "Лейпцигская книжная ярмарка" #NT!
 nd_sax_book_fair_desc: "Ежегодная книжная ярмарка в Лейпциге стала центром немецкой издательской индустрии, где печатники, книготорговцы и ученые собирались, чтобы торговать знаниями." #NT!
 nd_sax_electoral_vicariate: "Избирательный викариат" #NT!
 nd_sax_electoral_vicariate_desc: "В качестве императорского викария курфюрст Саксонии правит в отсутствие императора: конституционная привилегия, которая ставит Саксонию в центр имперской политики." #NT!
 nd_sax_schneeberg_rush: "Шнеберг Серебряная лихорадка" #NT!
 nd_sax_schneeberg_rush_desc: "Богатые месторождения серебра, обнаруженные в Шнеберге в 1470 году, спровоцировали второй бум горнодобывающей промышленности в Рудных горах, что привело к созданию новых городов и более глубоких шахт.\n\n#italic Доступно в: $nd_sax_silberbergwerk$#!" #NT!
 nd_sax_furstenbund: "Фюрстенбунд" #NT!
 nd_sax_furstenbund_desc: "Лига протестантских князей объединила реформированные государства Империи в дипломатический блок, а избирательный голос Саксонии придал протестантскому делу конституционный вес." #NT!
 nd_sax_festung_konigstein: "Фестунг Кенигштайн" #NT!
 nd_sax_festung_konigstein_desc: "Крепость Кенигштайн, расположенная на вершине холма из песчаника над Эльбой, служила самым неприступным оплотом электората со времен средневековья." #NT!
 nd_sax_albertine_administration: "Администрация Альбертины" #NT!
 nd_sax_albertine_administration_desc: "Альбертина Веттинс укрепила контроль над электоратом посредством систематической административной реформы, создав централизованную бюрократию, которая повысила как сбор доходов, так и эффективность государства." #NT!
 nd_sax_gewandhaus_tradition: "Гевандхаус Традиция" #NT!
 nd_sax_gewandhaus_tradition_desc: "Гевандхаус (первоначально зал торговцев тканями в Лейпциге) стал символом саксонской коммерческой культуры, где торговля тканями приносила состояния и гражданские учреждения.\n\n#italic Доступно в: $nd_sax_messehaus$#!" #NT!
 nd_sax_augustan_golden_age: "Золотой век Августа" #NT!
 nd_sax_augustan_golden_age_desc: "При Августе Сильном Дрезден превратился во «Флоренцию на Эльбе» с дворцом Цвингер, Фрауэнкирхе и придворными культурными учреждениями, которые могли соперничать с Версалем." #NT!
 nd_sax_porcelain_invention: "Фарфоровое изобретение" #NT!
 nd_sax_porcelain_invention_desc: "В 1710 году Иоганн Фридрих Боттгер усовершенствовал производство европейского фарфора с твердой пастой в Мейсене, нарушив многовековую монополию Китая на «белое золото»." #NT!
 nd_sax_kursachsische_garde: "Куршахская гвардия" #NT!
 nd_sax_kursachsische_garde_desc: "Избирательная Саксонская гвардия представляет собой профессиональную постоянную армию, пришедшую на смену феодальным рекрутам, дисциплинированную пехоту по последней европейской моде." #NT!
 nd_sax_gruenes_gewoelbe: "Грюнес Гевольбе" #NT!
 nd_sax_gruenes_gewoelbe_desc: "В Зеленых сводах Дрездена хранится одна из самых великолепных коллекций сокровищ в Европе: демонстрация богатства и мастерства, повышающая дипломатический престиж Саксонии." #NT!
 nd_sax_bergakademie_advance: "Бергакадемия Фрайберга" #NT!
 nd_sax_bergakademie_advance_desc: "Основанная в 1765 году Bergakademie Freiberg была первым в мире университетом горных наук, готовившим инженеров, которые распространяли саксонский опыт горнодобывающей промышленности по всему миру." #NT!
 nd_sax_constitutional_reforms: "Конституционные реформы" #NT!
 nd_sax_constitutional_reforms_desc: "Саксонская конституция 1831 года установила представительное правительство, превратив электорат из абсолютистского правления в современное конституционное государство." #NT!
 nd_sax_publishing_capital: "Издательский капитал" #NT!
 nd_sax_publishing_capital_desc: "Лейпцигский Borsenverein der Deutschen Buchhandler, основанный в 1825 году, официально закрепил за городом роль издательской столицы немецкоязычного мира.\n\n#italic Доступно в: $nd_sax_druckhaus$#!" #NT!
 nd_sax_industrial_revolution: "Саксонская индустриализация" #NT!
 nd_sax_industrial_revolution_desc: "Саксонские текстильные фабрики и машиностроительные мастерские возглавили промышленную революцию в Германии, опираясь на многовековой опыт горнодобывающей промышленности и торговые традиции." #NT!
 a_nd_sax_bergleute: "Рудные горы Берглюте" #NT!
 a_nd_sax_bergleute_desc: "Шахтерское ополчение из Крушных гор, закаленное подземной работой и сражающееся с выносливостью людей, роющих камень." #NT!
 a_nd_sax_kurgarde: "Куршахская гвардия" #NT!
 a_nd_sax_kurgarde_desc: "Избирательная саксонская гвардия — дисциплинированная профессиональная пехота постоянной армии, обученная новейшим тактическим доктринам." #NT!
 levy_nd_sax_bergleute: "Рудные горы Берглюте" #NT!
 levy_nd_sax_bergleute_desc: "Шахтерские общины Крушных гор представляют собой мощную милицию для защиты электората." #NT!
 nd_sax_silberbergwerk: "Зильбербергверк" #NT!
 nd_sax_silberbergwerk_desc: "Саксонский серебряный рудник в Рудных горах, где добывают драгоценную руду, которая финансировала династию Веттинов с 12 века." #NT!
 nd_sax_messehaus: "Мессехаус" #NT!
 nd_sax_messehaus_desc: "Лейпцигский выставочный зал, где купцы со всей Европы собираются под имперскими гарантиями безопасности для обмена товарами и налаживания коммерческих связей." #NT!
 nd_sax_werkstatt: "Кранах Веркштатт" #NT!
 nd_sax_werkstatt_desc: "Художественная мастерская в традициях Лукаса Кранаха Старшего, производящая гравюры, гравюры на дереве и иллюминированные материалы, распространяющие саксонскую культуру." #NT!
 nd_sax_druckhaus: "Друкхаус" #NT!
 nd_sax_druckhaus_desc: "Саксонская типография, выпускающая книги, брошюры и научные труды, двигатель Реформации и немецкого Просвещения." #NT!
 nd_sax_hofkapelle: "Хофкапелле" #NT!
 nd_sax_hofkapelle_desc: "Придворная капелла и музыкальный ансамбль Дрездена, культурное учреждение, привлекавшее композиторов и музыкантов со всей Европы для выступлений под патронажем Саксонии." #NT!
 nd_sax_porzellanmanufaktur: "Фарфоровая мануфактура" #NT!
 nd_sax_porzellanmanufaktur_desc: "Фарфоровый завод, производящий твердый фарфор в мейсенском стиле, европейский ответ китайскому «белому золоту», отмеченный знаменитым знаком скрещенных мечей." #NT!
 nd_sax_bergakademie: "Бергакадемия" #NT!
 nd_sax_bergakademie_desc: "Горная академия по модели Фрайберга, обучающая инженеров и металлургов научным методам, которые изменили горнодобывающую промышленность." #NT!
 nd_sax_basic_mining: "Базовый майнинг" #NT!
 nd_sax_basic_mining_desc: "Традиционная добыча полезных ископаемых с использованием деревянных опор и железных инструментов по методам, установленным Freiberger Bergrecht." #NT!
 nd_sax_deep_shaft_mining: "Глубокая добыча полезных ископаемых" #NT!
 nd_sax_deep_shaft_mining_desc: "Передовые методы разработки более глубоких серебряных жил с использованием улучшенных насосов, вентиляции и укрепленных железом туннельных опор." #NT!
 nd_sax_fair_trade: "Товары справедливой торговли" #NT!
 nd_sax_fair_trade_desc: "Лейпцигские ярмарки привлекают торговцев, торгующих тканями, домашним скотом и вином со всего континента." #NT!
 nd_sax_saxon_weaving: "Саксонское ткачество" #NT!
 nd_sax_saxon_weaving_desc: "Традиция Gewandhaus по производству высококачественного текстиля, превращающая сырую ткань и красители в роскошные ткани, пользующиеся спросом по всей Европе." #NT!
 nd_sax_fine_printing: "Мелкая печать" #NT!
 nd_sax_fine_printing_desc: "Художественная печать в традициях Кранаха: гравюры на дереве, гравюры и иллюминированные произведения, объединенные в научные и религиозные тома." #NT!
 nd_sax_book_printing: "Книгопечатание" #NT!
 nd_sax_book_printing_desc: "Типографии Лейпцига выпускают научные труды, религиозные тексты и литературные тома для немецкоязычного мира." #NT!
 nd_sax_industrial_printing: "Промышленная печать" #NT!
 nd_sax_industrial_printing_desc: "Паровые прессы и промышленные бумажные фабрики превратили Лейпциг в массовый издательский центр немецкого Просвещения." #NT!
 nd_sax_court_music: "Придворная музыка" #NT!
 nd_sax_court_music_desc: "В Хофкапелле имеется полный набор музыкантов, инструментов и концертных залов под королевским патронажем." #NT!
 nd_sax_porcelain_production: "Мейсенский Фарфор" #NT!
 nd_sax_porcelain_production_desc: "Тайное искусство европейского производства твердого фарфора, сочетающее каолиновую глину с точными технологиями обжига, отточенными в Мейсене." #NT!
 nd_sax_mining_research: "Горные исследования" #NT!
 nd_sax_mining_research_desc: "Научные исследования в области геологии, металлургии и машиностроения — академических дисциплин, возникших из саксонской горнодобывающей традиции." #NT!
 nd_sax_formed_tt: "была образована Саксония." #NT!
 nd_sax_path_a_tt: "Выбрал Землю Реформации" #NT!
 nd_sax_path_b_tt: "Выбрал Флоренцию на Эльбе." #NT!
 nd_sax_destiny: "Саксонская судьба" #NT!
 nd_sax_destiny_desc: "В Саксонии сформировались: электорат и великая держава. Путь вперед мы выбираем: жизнь разума или великолепие двора." #NT!
 nd_sax_dest_reformation_cradle: "Колыбель Реформации" #NT!
 nd_sax_dest_reformation_cradle_desc: "Обезопасьте Виттенберг, город, где тезисы Лютера изменили мир, и создайте институты, достойные образованной нации." #NT!
 nd_sax_dest_printing_revolution: "Полиграфическая революция" #NT!
 nd_sax_dest_printing_revolution_desc: "Саксонские печатные издания изменили интеллектуальный ландшафт Европы. Развивайте процветание нации и используйте преобразующую силу печатного слова." #NT!
 nd_sax_dest_enlightened_saxony: "Просвещенная Саксония" #NT!
 nd_sax_dest_enlightened_saxony_desc: "От Виттенберга до Страсбурга саксонские идеи и саксонские институты освещают весь континент. Примите научную революцию и сделайте Саксонию интеллектуальной столицей Европы." #NT!
 nd_sax_dest_bohemian_claim: "Богемная претензия" #NT!
 nd_sax_dest_bohemian_claim_desc: "Династия Веттинов претендует на чешскую корону. Возьмите Прагу и продемонстрируйте, что саксонское оружие так же грозно, как саксонское серебро." #NT!
 nd_sax_dest_northern_hegemony: "Северная гегемония" #NT!
 nd_sax_dest_northern_hegemony_desc: "От ганзейских портов Любека до резиденции Гогенцоллернов в Берлине саксонское владычество должно простираться по всей северной Германии." #NT!
 nd_sax_dest_european_splendor: "Европейское великолепие" #NT!
 nd_sax_dest_european_splendor_desc: "Когда Нюрнберг захвачен, а казна переполнена, Саксония может построить двор, способный конкурировать с Версалем: настоящую Флоренцию на Эльбе." #NT!
 nd_sax.5.t: "Избирательная судьба" #NT!
 nd_sax.5.d: "Саксонский электорат сформирован, и вместе с ним возникает вопрос, который будет определять нашу нацию на протяжении веков. Серебряные горы финансируют наши амбиции, торговые ярмарки привлекают торговцев со всего континента, а конституционный авторитет голосования выборщиков дает нам голос, который находит отклик во всей Империи.\n\nТеперь мы должны решить, какую Саксонию мы построим." #NT!
 nd_sax.5.a: "Наша судьба ждет" #NT!
 nd_sax.6.t: "Город Лютера — наш" #NT!
 nd_sax.6.d: "Виттенберг, где Мартин Лютер прибил к двери замковой церкви свои «Девяносто пять тезисов», теперь развевает саксонское знамя. Нам предстоит воспитать университет, в котором воспитал Меланхтона и целое поколение реформаторов. Мы управляем печатными станками, которые распространяют слова Лютера по всему христианскому миру.\n\nЭто больше, чем просто город. Это родина революции в человеческой мысли, и Саксония будет ее хранительницей." #NT!
 nd_sax.6.a: "Реформация начинается и заканчивается в Саксонии." #NT!
 nd_sax.7.t: "Сила прессы" #NT!
 nd_sax.7.d: "Саксонские типографии теперь доминируют в книжной торговле Германии. От ярмарочных залов Лейпцига до университетских типографий Виттенберга письменное слово течет неудержимым потоком. Брошюры, трактаты и научные труды несут саксонские идеи во все уголки Европы.\n\nНо пресса — это инструмент, которым можно пользоваться по-разному. Будем ли мы использовать это для продвижения нашей дипломатической позиции, создания сетей информации и влияния? Или нам следует сосредоточиться на создании академических институтов, привлекающих ученых со всего континента?" #NT!
 nd_sax.7.a: "Использовать прессу как инструмент государства" #NT!
 nd_sax.7.b: "Создайте сеть академий и ученых" #NT!
 nd_sax.8.t: "Саксонское Просвещение" #NT!
 nd_sax.8.d: "От Бергакадемии во Фрайберге до университета в Виттенберге, от типографий Страсбурга до книжных ярмарок в Лейпциге — саксонские учреждения стали бьющимся сердцем европейской интеллектуальной жизни. Научная революция изменила то, как человечество понимает мир природы, и саксонские ученые стоят в ее авангарде.\n\nЭто кульминация многовековых инвестиций в идеи. Как Саксония будет использовать свое интеллектуальное превосходство?" #NT!
 nd_sax.8.a: "Примените науку к искусству управления" #NT!
 nd_sax.8.b: "Развивайте республику букв, невзирая на границы" #NT!
 nd_sax.9.t: "Корона Богемии" #NT!
 nd_sax.9.d: "Прага, золотой город на Влтаве, пал в руках саксонцев. Богемская корона (желанная как Габсбургами, Люксембургами и Ягеллионами) теперь украшает бровь Веттина. Благодаря богатству и рабочей силе Богемии, добавленной к саксонскому серебру, мы располагаем ресурсами, с которыми мало кто в Империи может сравниться.\n\nДорога к немецкой гегемонии пролегает через завоеванные столицы. Прага – это только начало." #NT!
 nd_sax.9.a: "Богемия склоняется к воле Веттина" #NT!
 nd_sax.10.t: "Доминион над Севером" #NT!
 nd_sax.10.d: "Ганзейская жемчужина Любек и крепость Гогенцоллернов Берлин подчиняются власти Саксонии. От побережья Балтийского моря до сердца Бранденбурга северная Германия оказалась под нашим контролем. Торговые пути, которые когда-то обогащали наших соперников, теперь наполняют саксонскую казну.\n\nКак нам консолидировать это огромное новое владычество?" #NT!
 nd_sax.10.a: "Маршируйте наши армии через завоеванные города" #NT!
 nd_sax.10.b: "Установить саксонскую административную власть" #NT!
 nd_sax.11.t: "Флоренция на Эльбе" #NT!
 nd_sax.11.d: "Мечта Августа Сильного осуществилась. Дрезденские дворцы в стиле барокко соперничают с Версалем, мейсенский фарфор украшает столы каждого европейского двора, а сокровища Зеленых сводов ослепляют иностранных послов. Обеспечив богатство Нюрнберга и распространив саксонское владычество на всю Германию, мы создали нечто, что будет существовать веками.\n\nБудут ли помнить наше наследие за его культурное великолепие или за военную мощь, которая сделала это возможным?" #NT!
 nd_sax.11.a: "Пусть мир восхищается нашим великолепием" #NT!
 nd_sax.11.b: "Создайте саксонскую империю из железа и серебра." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_reformation_press: "Реформация Пресс" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_reformation_press: "Саксонские типографии служат инструментом государственной политики, распространяя идеи, которые подрывают соперников и создают дипломатические рычаги влияния посредством информации." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_academic_network: "Академическая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_academic_network: "Сеть финансируемых Саксонией академий и научных обменов привлекает интеллектуалов со всей Европы, создавая мягкую силу через престиж образования." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_scientific_statecraft: "Научное управление государством" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_scientific_statecraft: "Принципы Просвещения, примененные к управлению, создают рационализированный государственный аппарат, эффективный, систематический и безжалостно действенный." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_republic_of_letters: "Республика букв" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_republic_of_letters: "Саксонские учёные переписываются с интеллектуалами по всему миру, создавая транснациональную сеть знаний, которая выходит за рамки мелких ссор династий." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_hanseatic_conquest: "Ганзейское завоевание" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_hanseatic_conquest: "Саксонские армии захватили великие ганзейские торговые города, и капитаны-наемники стекаются на службу покровителю, который платит серебром в Рудных горах." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_saxon_dominion: "Саксонский Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_saxon_dominion: "От Праги до Берлина власть Саксонии поддерживается дисциплинированными гарнизонами и быстродействующими штурмовыми силами, которые подавляют сопротивление еще до того, как оно сможет организоваться." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_baroque_magnificence: "Великолепие Барокко" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_baroque_magnificence: "Великолепие саксонских дворцов, коллекций и придворной жизни в стиле барокко делает Дрезден культурной столицей немецкоязычного мира, хотя такое великолепие обходится недешево." #NT!
 STATIC_MODIFIER_NAME_nd_sax_dest_saxon_imperium: "Саксонская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_sax_dest_saxon_imperium: "Военно-экономическая империя, построенная на кавалерии, наемниках и огромных доходах от завоеванных немецких территорий." #NT!
 nd_sax_aufklarungsschule: "Ауфкларунгсшкола" #NT!
 nd_sax_aufklarungsschule_desc: "Саксонская академия Просвещения, занимающаяся развитием естественной философии, прикладной науки и рационального управления, институциональное воплощение саксонской интеллектуальной традиции." #NT!
 nd_sax_enlightenment_curriculum: "Учебная программа Просвещения" #NT!
 nd_sax_enlightenment_curriculum_desc: "Комплексная программа обучения естественной философии, математике и прикладным наукам, поддерживаемая постоянным выпуском научных материалов." #NT!
 nd_sax_dresdner_schloss: "Дрезднерский замок" #NT!
 nd_sax_dresdner_schloss_desc: "Величественный дворец саксонских курфюрстов, перестроенный в великолепии барокко, в котором разместились Зеленый свод, королевские коллекции произведений искусства и самый великолепный двор Германии." #NT!
 nd_sax_palace_maintenance: "Обслуживание дворца" #NT!
 nd_sax_palace_maintenance_desc: "Содержание Дрезднерского замка требует постоянного снабжения прекрасным текстилем, мебелью, фарфором и свечами, чтобы поддерживать его легендарное великолепие." #NT!
 AUTO_MODIFIER_NAME_nd_sax_bureaucracy_authority: "Курсационное обучение" #NT!
 AUTO_MODIFIER_DESC_nd_sax_bureaucracy_authority: "Электорат Веттина унаследовал не имеющий себе равных в Империи институциональный инструментарий: печатный Bergordnung, который кодифицировал права горняков на столетие раньше любого соперника, Oberbergamt, который управлял потоком серебра в Рудных горах как государственная монополия, первую лютеранскую консисторию в Виттенберге, Имперскую торговую ярмарку в Лейпциге, действующий поместный ландтаг и, со временем, Geheime Konsilium, который ввел Саксонию в абсолютизм. Выбирайте, какие учреждения оставить в живых." #NT!
 sax_bergordnung_bureaucracy: "Бергорднунг" #NT!
 sax_bergordnung_bureaucracy_desc: "Schreckenberger Bergordnung 1499/1500 г. (старейший печатный горный кодекс в Европе) и расширенный указ герцога Георга Бородатого о Аннаберге 1509 г. кодифицировали права свободных горняков (Bergfreiheit), фиксированные смены и долю руды, а также защищали горняков от феодального господства. Кодекс стал образцом для горнодобывающего законодательства по всей Центральной Европе и послужил основой для великой серебряной лихорадки в Рудных горах в Шнеберге, Аннаберге и Мариенберге." #NT!
 sax_oberbergamt_bureaucracy: "Обербергамт цу Фрайберг" #NT!
 sax_oberbergamt_bureaucracy_desc: "Саксонское горное управление, основанное 1 июля 1542 года герцогом Морисом со штаб-квартирой во Фрайберге, было старейшим официальным горнодобывающим управлением в Германии. Обербергамт поставил весь Бергштат (Бергмейстер, металлургические заводы, литейные заводы и заработную плату шахтеров) под прямой избирательный контроль. Его многоуровневая бюрократия направила поток серебра из Рудных гор в казну Веттина и сделала Саксонию самым богатым из немецких княжеств." #NT!
 sax_konsistorium_bureaucracy: "Саксонская консистория" #NT!
 sax_konsistorium_bureaucracy_desc: "Основанная в Виттенберге в 1539 году при курфюрсте Иоганна Фридриха, Саксонская лютеранская консистория взяла на себя брачную юрисдикцию, церковную дисциплину и посещение приходов после упразднения епископских должностей. С курфюрстом, исполняющим обязанности summus episcopus, юристы Консистории и теологи Виттенберга стандартизировали лютеранскую доктрину, руководили латинскими школами и сделали Саксонию институциональным центром Реформации." #NT!
 sax_geheimes_konsilium_bureaucracy: "Гехаймес Консилиум" #NT!
 sax_geheimes_konsilium_bureaucracy_desc: "Формализованный при курфюрсте Кристиане I в 1580-х годах и усовершенствованный при Августе Сильном около 1706 года, Тайный совет представлял собой небольшой орган доверенных министров, который тайно работал над вопросами финансов, войны и внешней политики. Полностью обойдя Ландтаг, Консилиум стал институциональным стержнем саксонского абсолютизма и управлял двойным саксонско-польским союзом из Дрезднерского замка." #NT!
 sax_landstande_bureaucracy: "Саксийская Ландстанде" #NT!
 sax_landstande_bureaucracy_desc: "Впервые созванный курфюрстом Фридрихом II в 1438 году и впоследствии регулярно собиравшийся, саксонский ландтаг собирал прелатов, графов, рыцарей и депутатов саксонских городов для переговоров о налоговых льготах и, все чаще, о финансовой, военной и религиозной политике. В отличие от большинства немецких ландтагов, саксонские поместья были необычайно устойчивыми: они вели переговоры с курфюрстом, а не подчинялись диктату, и сохранялись как настоящий сдерживающий фактор княжеской власти вплоть до 18 века." #NT!
 sax_leipziger_reichsmesse_bureaucracy: "Лейпцигерская рейхсмессе" #NT!
 sax_leipziger_reichsmesse_bureaucracy_desc: "Король Максимилиан I утвердил проведение трех ежегодных ярмарок в Лейпциге в 1497 году, а в 1507 году возвел их в статус Reichsmessen (императорские торговые ярмарки) с общеимперской охранной грамотой для купцов и Bannmeile протяженностью пятнадцать миль, в пределах которого не могло проводиться ни одна конкурирующая ярмарка. Привилегии привлекли купцов из Венеции, Кракова, Франкфурта и Гамбурга и сделали бюргерскую столицу, а не Дрезден, двигателем саксонской экономики." #NT!
