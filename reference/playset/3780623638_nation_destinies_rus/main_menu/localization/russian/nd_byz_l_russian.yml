l_russian:
 STATIC_MODIFIER_NAME_nd_byz_renovatio_imperii: "Реновация Империи" #NT!
 STATIC_MODIFIER_DESC_nd_byz_renovatio_imperii: "Римская империя была восстановлена. Как наследники Августа и Юстиниана, басилевсы претендуют на господство над цивилизованным миром посредством закона, управления и военной мощи." #NT!
 STATIC_MODIFIER_NAME_nd_byz_orthodox_ecumene: "Православная ойкумена" #NT!
 STATIC_MODIFIER_DESC_nd_byz_orthodox_ecumene: "Константинополь снова стал духовным центром христианского мира. Авторитет Вселенского Патриарха исходит из собора Святой Софии, привлекая верующих в объятия Православия." #NT!
 STATIC_MODIFIER_NAME_nd_byz_hellenic_revival: "Греческое возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_byz_hellenic_revival: "Старые боги возвращаются в свои храмы. Когда Константинополь возвращается не Христу, а олимпийцам, Василевс возрождает имперский культ, предзнаменования и античные академии. Рим обращается к своим древнейшим корням." #NT!
 nd_byz.1.t: "Восстановление Византии" #NT!
 nd_byz.1.d: "Орлы Рима снова летают над Константинополем. Древняя столица, резиденция императоров на протяжении тысячи лет, была возвращена греческой цивилизации и православной вере. Купол собора Святой Софии озаряет свет нового рассвета.\n\nНо какой будет эта восстановленная империя? Наследие Рима предлагает два видения. Взглянем на Юстиниана и цезарей, вселенскую империю закона, дисциплины и завоеваний, где базилевс правит как избранный Богом администратор земных дел. Другой смотрит на Вселенского Патриарха и Отцов-пустынников, священное сообщество, где православие объединяет народы, где монастыри сохраняют цивилизацию и где духовная власть затмевает любую светскую корону.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_byz.1.d.hellenic: "Орлы Рима снова летают над Константинополем. Древняя столица, резиденция императоров на протяжении тысячи лет, была возвращена греческой цивилизации. Но это не христианская реставрация: старые боги вернулись в свои храмы, и дым жертвоприношений снова поднимается над городом Константина.\n\nКакой будет эта восстановленная империя? Наследие Рима предлагает два видения. Взглянем на Юстиниана и Цезарей, универсальную империю закона, дисциплины и завоеваний, где базилевс правит как верховный администратор земных дел. Другой смотрит даже за их пределы, на олимпийцев и имперский культ древности, на философов и оракулов древности, на возрожденный классический мир, где сами боги благословляют завоевание римского наследия.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_byz.1.a: "Мы — возрожденный Рим. Законом и мечом мы будем править" #NT!
 nd_byz.1.b: "Мы – свет Православия. Вера будет нашей империей" #NT!
 nd_byz.1.c: "Старые боги благоволят нам. Под властью олимпийцев Рим поднимется" #NT!
 STATIC_MODIFIER_NAME_nd_byz_greek_fire_mastery: "Греческое мастерство огня" #NT!
 STATIC_MODIFIER_DESC_nd_byz_greek_fire_mastery: "Секрет жидкого огня усовершенствован. На наших галерах установлены сифоны, которые излучают неугасимое пламя по волнам, превращая каждое морское сражение в пожар." #NT!
 nd_byz.2.t: "Оружие императоров" #NT!
 nd_byz.2.d: "Секрет греческого огня, жидкого пламени, горящего на воде, был, пожалуй, самой тщательно охраняемой государственной тайной за всю историю. Изобретенный Каллиником из Гелиополя в VII веке, он представлял собой бронзовые сифоны, установленные на носах дромонов, превращавшие византийские военные корабли в плавучие огнеметы.\n\nКомпозиция была известна лишь горстке мастеров, чьи семьи передавали формулу из поколения в поколение. Ни один враг никогда не повторял этого. Простого слуха о том, что византийский флот имел сифоны, часто было достаточно, чтобы полностью предотвратить битву. Арабский, русский и булгарский флоты научились бояться ужасного крика «Бей огонь!» это предшествовало струям жидкого пламени, мчащимся по морю." #NT!
 nd_byz.2.a: "Пламя империи горит вечно" #NT!
 STATIC_MODIFIER_NAME_nd_byz_city_reclaimed: "Королева городов восстановлена" #NT!
 STATIC_MODIFIER_DESC_nd_byz_city_reclaimed: "Стены Константинополя снова стоят твердо. Огромные цистерны наполняются пресной водой, акведуки разносят жизнь по всем кварталам, и город вновь обретает свою древнюю роль самого укрепленного мегаполиса в мире." #NT!
 STATIC_MODIFIER_NAME_nd_byz_new_golden_age: "Новый золотой век" #NT!
 STATIC_MODIFIER_DESC_nd_byz_new_golden_age: "Рынки Константинополя снова переполнены торговлей трех континентов. Купцы из Венеции, Генуи, Египта и Руси стекаются к Золотому Рогу, и казна империи пополняется богатствами этого перекрестка." #NT!
 nd_byz.3.t: "Константинополь восстановлен" #NT!
 nd_byz.3.d: "На протяжении тысячи лет Константинополь был величайшим городом христианского мира, а возможно, и мира. Его тройные стены выдержали любую осаду. Ее подземные цистерны, как и великая цистерна Базилика с 336 мраморными колоннами, содержали достаточно пресной воды, чтобы поддерживать население в течение нескольких месяцев блокады. Его положение на Босфоре контролировало проход между Европой и Азией, между Средиземным и Черным морями.\n\nСейчас город восстанавливается. Инженеры восстанавливают акведуки Валента, рабочие расчищают завалы великих форумов, а рынки Мезы снова начинают наполняться товарами из далеких земель. Вопрос в том, сделать ли Константинополь неприступной крепостью или непреодолимым рынком." #NT!
 nd_byz.3.a: "Сделайте стены непобедимыми. Ни один враг не пройдет" #NT!
 nd_byz.3.b: "Откройте ворота коммерции. Пусть золото течет, как вода" #NT!
 STATIC_MODIFIER_NAME_nd_byz_justinianic_legacy: "Юстиниановое наследие" #NT!
 STATIC_MODIFIER_DESC_nd_byz_justinianic_legacy: "Возрождение юридического кодекса Юстиниана навело порядок в управлении империей. Суды следуют писаному закону, сборщики налогов подчиняются магистратам, а механизм римского управления снова вращается." #NT!
 nd_byz.4.t: "Возрождение закона Юстиниана" #NT!
 nd_byz.4.d: "Corpus Juris Civilis, Свод гражданского права, был величайшим памятником Юстиниана, более долговечным, чем сам собор Святой Софии. Составленный между 529 и 534 годами юристом Трибонианом и его командой, он систематизировал тысячелетнюю римскую правовую мысль в последовательную систему, которая касалась брака, собственности, наследования, уголовного права и прав граждан.\n\nХотя первоначальная империя, создавшая этот шедевр, пала, ее правовые принципы сохранились. Их изучали в университетах Болоньи и Парижа, и они сформировали традицию гражданского права половины Европы. Теперь восстановленное византийское государство опирается на это наследие для создания администрации, которая сочетает в себе древнеримскую эффективность с потребностями современной империи." #NT!
 nd_byz.4.a: "Справедливость – основа империи" #NT!
 nd_byz_greek_fire: "Греческий огонь" #NT!
 nd_byz_greek_fire_desc: "Тайна жидкого огня, горящего на воде, излучаемого из бронзовых сифонов на военных галерах." #NT!
 nd_byz_thematic_administration: "Тематическая администрация" #NT!
 nd_byz_thematic_administration_desc: "Тематическая система делила империю на военно-административные округа, в которых солдаты-земледельцы защищали возделываемую ими землю." #NT!
 nd_byz_pronoia_system: "Система Пронойя" #NT!
 nd_byz_pronoia_system_desc: "Предоставление земли военным офицерам в обмен на кавалерийскую службу — византийский ответ западному феодализму." #NT!
 nd_byz_silk_monopoly: "Императорская шелковая монополия" #NT!
 nd_byz_silk_monopoly_desc: "Контролируемые государством шелковые мастерские производят лучшие в мире ткани, причем тирийский пурпур предназначен только для императора." #NT!
 nd_byz_stradioti_tradition: "Традиция Страдиоти" #NT!
 nd_byz_stradioti_tradition_desc: "Традиция греческих и албанских рейдеров легкой кавалерии, прославившихся по всей Европе своей скоростью и свирепостью." #NT!
 nd_byz_imperial_neoria: "Императорская Неория" #NT!
 nd_byz_imperial_neoria_desc: "Великие верфи Золотого Рога, где строился и обслуживался флот дромонов." #NT!
 nd_byz_cistern_engineering: "Цистерна Инжиниринг" #NT!
 nd_byz_cistern_engineering_desc: "Искусство строительства огромных подземных резервуаров, которые поддерживали Константинополь во время осады и засухи." #NT!
 nd_byz_book_of_the_eparch: "Книга Епарха" #NT!
 nd_byz_book_of_the_eparch_desc: "Византийское руководство по регулированию торговли, регулирующее деятельность константинопольских гильдий, от ткачей шелка до парфюмеров." #NT!
 nd_byz_hippodrome_tradition: "Ипподром Традиция" #NT!
 nd_byz_hippodrome_tradition_desc: "Ипподром был политическим сердцем империи, где фракции колесниц служили протопартиями, а императоры обеспечивали народную легитимность." #NT!
 nd_byz_justinianic_revival: "Юстинианское правовое возрождение" #NT!
 nd_byz_justinianic_revival_desc: "Использование Corpus Juris Civilis для создания эффективной централизованной администрации, основанной на римской правовой традиции." #NT!
 nd_byz_phanariote_diplomacy: "Фанариотская дипломатия" #NT!
 nd_byz_phanariote_diplomacy_desc: "Греки-фанариоты служили администраторами, переводчиками и дипломатами по всему Восточному Средиземноморью, мастерами интриг и переговоров." #NT!
 nd_byz_neo_byzantine_enlightenment: "Неовизантийское Просвещение" #NT!
 nd_byz_neo_byzantine_enlightenment_desc: "Возрождение обучения на основе классической и византийской науки, преобразующее образование и управление." #NT!
 nd_byz_imperial_naval_modernization: "Модернизация Имперского военно-морского флота" #NT!
 nd_byz_imperial_naval_modernization_desc: "Переход от галерной войны к современному флоту, сочетающему древние морские традиции с современным дизайном кораблей." #NT!
 n_nd_byz_dromon: "Дромон" #NT!
 n_nd_byz_dromon_desc: "Дромон был основой византийского военно-морского флота: быстрая военная галера с веслами, оснащенная бронзовым сифоном для выброса греческого огня. Его экипаж, состоявший из гребцов и морских пехотинцев, сделал его универсальным инструментом военно-морской мощи в замкнутых водах Эгейского моря и Проливов." #NT!
 a_nd_byz_stradioti: "Страдиоти" #NT!
 a_nd_byz_stradioti_desc: "Легкая кавалерия, набранная на границах Албании и Греции, Страдиоты были быстрыми налетчиками и разведчиками, чьи атаки, вооруженные копьями, могли разбить незащищенный фланг. Они служили наемниками по всей Европе, их нанимали Венеция, Франция и Испания." #NT!
 n_nd_byz_fire_dromon: "Имперский огненный дромон" #NT!
 n_nd_byz_fire_dromon_desc: "Вершина византийского военно-морского дизайна: тяжелый дромон с усиленным корпусом и современной греческой системой пожаротушения. Эти военные корабли контролировали узкие воды Босфора и Дарданелл, а их жидкий огонь делал их практически неудержимыми в ближнем бою." #NT!
 nd_byz_imperial_cistern: "Императорская цистерна" #NT!
 nd_byz_imperial_cistern_desc: "Огромный подземный резервуар, созданный по образцу легендарной Константинопольской цистерны Базилика, с сотнями мраморных колонн, поддерживающих сводчатый потолок над миллионами галлонов пресной воды." #NT!
 nd_byz_silk_ergasterion: "Шелковый Эргастерион" #NT!
 nd_byz_silk_ergasterion_desc: "Императорская шелковая мастерская, где прядут сырой шелк, окрашивают его драгоценными пигментами и ткут лучшие ткани в мире. Здесь производят пурпурный шелк Базилевса." #NT!
 nd_byz_hippodrome: "Императорский ипподром" #NT!
 nd_byz_hippodrome_desc: "Монументальная арена для гонок на колесницах и публичных церемоний. Ипподром служил политическим центром империи, где сталкивались фракции и прославлялись императоры." #NT!
 nd_byz_neorion: "Византийский Неорион" #NT!
 nd_byz_neorion_desc: "Имперская военно-морская верфь по образцу Константинопольских арсеналов Золотого Рога, где строят, ремонтируют дромоны и оснащают их смертоносными сифонами жидкого огня." #NT!
 nd_byz_cistern_maintenance: "Обслуживание цистерны" #NT!
 nd_byz_cistern_maintenance_desc: "Обслуживание каменной кладки, соединений акведуков и систем фильтрации подземных резервуаров воды." #NT!
 nd_byz_silk_weaving: "Императорское шелковое ткачество" #NT!
 nd_byz_silk_weaving_desc: "Переработка шелка-сырца и экзотических красителей в лучшие ткани христианского мира." #NT!
 nd_byz_hippodrome_upkeep: "Операции на ипподроме" #NT!
 nd_byz_hippodrome_upkeep_desc: "Поддержание колесничных команд, дорожных покрытий и монументальной каменной кладки императорской арены." #NT!
 nd_byz_neorion_operations: "Операции на верфи" #NT!
 nd_byz_neorion_operations_desc: "Поставка древесины, смолы, гвоздей и военно-морских запасов для строительства и ремонта флота дромонов." #NT!
 levy_nd_byz_stradioti: "Страдиоти Леви" #NT!
 levy_nd_byz_stradioti_desc: "Легкая кавалерия, набираемая с греческих и албанских границ, служила быстрыми рейдерами и разведчиками в традициях наемников Страдиоти." #NT!
 levy_nd_byz_dromon: "Дромон Леви" #NT!
 levy_nd_byz_dromon_desc: "Военные галеры с веслами, набранные из прибрежных провинций, с экипажем опытных моряков в соответствии с древней морской традицией византийского флота." #NT!
 nd_byz_formed_tt: "была основана Византия." #NT!
 nd_byz_path_a_tt: "Избранный наследник Рима" #NT!
 nd_byz_path_b_tt: "Выбрал Свет Православия" #NT!
 nd_byz_path_c_tt: "Выбрали эллинский ренессанс." #NT!
 nd_byz_destiny: "Судьба Византии" #NT!
 nd_byz_destiny_desc: "Империя была восстановлена. Теперь он должен доказать, что он достоин имени Рима." #NT!
 nd_byz_dest_exarchate: "Вернуть Экзархат" #NT!
 nd_byz_dest_exarchate_desc: "Равеннский экзархат на протяжении веков был западным якорем Византии. Возьмите Равенну и Бари, чтобы восстановить имперскую власть в Италии." #NT!
 nd_byz_dest_africa: "Реконкиста Африканская" #NT!
 nd_byz_dest_africa_desc: "Отвоевание Юстинианом Северной Африки у вандалов было одним из его величайших триумфов. Следуйте по его стопам, взяв Тунис и Триполи." #NT!
 nd_byz_dest_renovatio: "Реновация Империи" #NT!
 nd_byz_dest_renovatio_desc: "Полное восстановление Римской империи: Рим, Антиохия, Александрия. Три из пяти древних пентархий объединились под одним орлом. Это высший краеугольный камень Наследника Рима." #NT!
 nd_byz_dest_ecumene: "Вселенский Престол" #NT!
 nd_byz_dest_ecumene_desc: "Салоники, столица, и Иерусалим, самый священный город христианского мира. Закрепите эти священные места, чтобы утвердить духовный авторитет Православной Ойкумены." #NT!
 nd_byz_dest_commonwealth: "Православное Содружество" #NT!
 nd_byz_dest_commonwealth_desc: "Постройте процветающее экономическое и культурное содружество. Занимайтесь банковским делом, доминируйте в торговле шелком на своем рынке капитала и развивайте свои земли, чтобы они соответствовали процветанию древней империи." #NT!
 nd_byz_dest_new_rome: "Новый Рим" #NT!
 nd_byz_dest_new_rome_desc: "Константинополь по праву становится Новым Римом, культурной, духовной и интеллектуальной столицей мира. Используйте печатный станок, развивайте свои обширные владения и докажите, что свет Византии затмевает всех соперников." #NT!
 nd_byz_dest_temples: "Храмы вновь открылись" #NT!
 nd_byz_dest_temples_desc: "Когда старые боги будут восстановлены, их алтари должны возродиться снова. Вновь освятите храмы Афин, колыбель олимпийской веры, и позвольте дыму жертвоприношений и голосу оракулов вести возрожденную империю." #NT!
 nd_byz_dest_academy: "Академия восстановлена" #NT!
 nd_byz_dest_academy_desc: "Мудрость древности возвращается. Вновь откройте Академию Платона в Афинах и великие школы Ионии в Смирне, примите эпоху Возрождения и позвольте философии, математике и классическим наукам снова процветать." #NT!
 nd_byz_dest_apotheosis: "Апофеоз" #NT!
 nd_byz_dest_apotheosis_desc: "Классический мир снова стал целостным. Базилевс прославляется среди богов, Олимпийские игры объединяют империю, а цивилизация древности возрождается в вечной славе. Краеугольный камень эллинского Возрождения." #NT!
 nd_byz_pantheon: "Пантеон восстановлен" #NT!
 nd_byz_pantheon_desc: "Величественный храм Двенадцати Олимпийцев, за его алтарями ухаживает возрожденное жречество. Отсюда вновь распространяется старая вера и классическая культура империи." #NT!
 nd_byz_pantheon_maintenance: "Обслуживание Пантеона" #NT!
 nd_byz_pantheon_maintenance_desc: "Поддержание храмовых обрядов и священства с помощью благовоний, возлияний вина и масла и жертвенных животных." #NT!
 nd_byz.5.t: "Судьба Византии" #NT!
 nd_byz.5.d: "Восстановленная империя стоит на перепутье истории. Стены Константинополя восстановлены, в соборе Святой Софии вновь звучит православная литургия, а над Босфором реет знамя с орлом. Но восстановление – это только начало. Империя, которая когда-то простиралась от Испании до Месопотамии, не может довольствоваться тем, что ей принадлежит. Как пойдет судьба Византии?" #NT!
 nd_byz.5.a: "Наша судьба ждет" #NT!
 nd_byz.6.t: "Экзархат восстановлен" #NT!
 nd_byz.6.d: "Экзархат Равенны был основан в 584 году как административный центр Византии в Италии, управляющий остатками завоевания Юстиниана. На протяжении почти двух столетий она держала оборону против лангобардов и франков, сохраняя римскую цивилизацию на Западе. Его потеря в 751 году от лангобардов ознаменовала конец византийской власти в центральной Италии.\n\nТеперь Равенна и Бари снова несут имперский штандарт. Мозаики Сан-Витале, изображающие Юстиниана и Феодору во всей их имперской славе, впервые за столетия смотрят на византийских солдат сверху вниз." #NT!
 nd_byz.6.a: "Италия помнит своих римских хозяев" #NT!
 nd_byz.7.t: "Африка отвоевана" #NT!
 nd_byz.7.d: "В 533 году Велисарий высадился в Африке со всего лишь 15 000 человек и в ходе поразительно блестящей кампании за считанные месяцы уничтожил королевство вандалов. Африканские провинции снова стали житницей Рима, а их зерно кормило Константинополь еще одно столетие.\n\nТеперь история повторяется. Византийские знамена реют над руинами Карфагена и гаванью Триполи. Вопрос в том, как использовать это завоевание: как военный плацдарм для дальнейшей экспансии или как сельскохозяйственный центр, чтобы прокормить растущее население империи." #NT!
 nd_byz.7.a: "Соберите африканские легионы для предстоящих кампаний." #NT!
 nd_byz.7.b: "Пусть Африка кормит империю, как когда-то кормила Рим" #NT!
 nd_byz.8.t: "Реновация Империи" #NT!
 nd_byz.8.d: "Рим. Антиохия. Александрия. Три из пяти великих патриархатов древнего христианского мира теперь подчиняются Константинополю. Средиземное море снова стало римским озером. Это достижение, о котором мечтал Юстиниан, за которое боролся Ираклий, о котором Палеологи оплакивали как о навсегда потерянном.\n\nRenovatio Imperii, Обновление Империи, завершено. Но каждая великая империя должна выбрать, как сохранить свое величие. Сможет ли восстановленный Рим принести своим подданным мир и порядок посредством закона и управления? Или она сохранит свое господство благодаря непобедимым легионам, завоевавшим эту империю?" #NT!
 nd_byz.8.a: "Пусть римское право принесет в мир порядок" #NT!
 nd_byz.8.b: "Легионы вечны. Они империя" #NT!
 nd_byz.9.t: "Вселенский Престол" #NT!
 nd_byz.9.d: "Салоники, второй город империи, и Иерусалим, самое святое место христианского мира, признают власть Вселенского Патриарха. Духовная география Православия сегодня простирается от Константинополя во всех направлениях: на запад до Балкан, на юг до Святой Земли, на север до славянского мира.\n\nМонастыри процветают, паломнические маршруты множатся, и православные верующие смотрят на Новый Рим как на свой духовный центр. Фундамент священного содружества был заложен." #NT!
 nd_byz.9.a: "Верующие собираются под крылом Патриарха" #NT!
 nd_byz.10.t: "Православное Содружество" #NT!
 nd_byz.10.d: "Рынки империи переполнены шелком, специями и товарами трех континентов. Банковские учреждения, которые когда-то обогащали Венецию и Геную, теперь обслуживают византийскую торговлю. Старые маршруты Шелкового пути, которые сделали Константинополь самым богатым городом средневекового мира, были восстановлены, а столичный рынок доминирует в восточном Средиземноморье.\n\nЭто процветание можно направить по-разному. Богатство торговли может распространить византийскую культуру по всему известному миру, а монастыри могут использовать этот золотой век для развития православного образования и науки." #NT!
 nd_byz.10.a: "Пусть наша культура течет вместе с нашей торговлей" #NT!
 nd_byz.10.b: "Монастыри должны быть маяками обучения" #NT!
 nd_byz.11.t: "Новый Рим" #NT!
 nd_byz.11.d: "Константинополь больше не является просто столицей восстановленной империи; это интеллектуальный и духовный центр мира. Патриаршая академия выпускает ученых и богословов, которые могут соперничать с лучшими университетами Европы. Печатный станок распространяет православные тексты и греческую философию по всему континенту. Византийское искусство, архитектура и мысль установили стандарты самой цивилизации.\n\nЭто Новый Рим, о котором мечтали основатели Константинополя, не просто политическая столица, но и маяк цивилизации. Вопрос в том, следует ли подчеркивать его роль как священного центра православия или как коммерческого перекрестка известного мира." #NT!
 nd_byz.11.a: "Православие осветит мир" #NT!
 nd_byz.11.b: "Константинополь – перекресток миров" #NT!
 nd_byz.12.t: "Храмы вновь открылись" #NT!
 nd_byz.12.d: "Олимпийские боги возвращаются к своим алтарям. По всей империи храмы, молчавшие тысячу лет, снова звенят гимнами и дымом жертвоприношений. Оракулы говорят, знамения читаются, и древняя вера Греции и Рима возрождается под властью Василевса, осмелившегося восстановить ее." #NT!
 nd_byz.12.a: "Боги вернулись домой" #NT!
 nd_byz.13.t: "Академия восстановлена" #NT!
 nd_byz.13.d: "Мудрость древности расцветает заново. В Афинах вновь открывает свои двери Академия Платона; В Ионии школы Смирны привлекают ученых со всего мира. Но классическое возрождение может принять две формы: строгие естественные науки «Лицея» Аристотеля или философия, риторика и искусство «Нарисованной Стои»." #NT!
 nd_byz.13.a: "Лицей: пусть руководят разум и наука" #NT!
 nd_byz.13.b: "Стоа: пусть философия и искусство украшают империю" #NT!
 nd_byz.14.t: "Апофеоз" #NT!
 nd_byz.14.d: "Классический мир снова стал целостным, а Базилевс провозглашается не просто императором, но и живым богом, наследником Августа и Александра. Золотой век античности возрождается. Будет ли империя связана божественным имперским культом или восстановленными Олимпийскими играми, которые объединят всех греков на один священный праздник?" #NT!
 nd_byz.14.a: "Пусть Имперский Культ освятит наше правление" #NT!
 nd_byz.14.b: "Пусть Вечная Олимпиада объединит эллинов" #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_african_legions: "Африканские легионы" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_african_legions: "Отвоеванные африканские провинции поставляют новых рекрутов в имперскую армию, собирая новые легионы в традициях африканской кампании Велисария." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_african_granary: "Африканское зернохранилище" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_african_granary: "Плодородные равнины Африки вновь играют свою древнюю роль житницы империи, их урожаи питают Константинополь и способствуют экономическому росту." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_pax_romana: "Пакс Романа" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_pax_romana: "Римские законы и администрация приносят мир и порядок в обширные владения восстановленной империи, уменьшая волнения и связывая подданных посредством правосудия, а не силы." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_eternal_legions: "Вечные легионы" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_eternal_legions: "Легионы, завоевавшие три континента, остаются основой имперской мощи, их дисциплина и скорость не имеют себе равных ни у одной конкурирующей армии." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_silk_road_restored: "Шелковый путь восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_silk_road_restored: "Древние торговые пути, которые сделали Константинополь сверх меры богатым, протекают вновь, распространяя византийскую культуру и богатство по всему известному миру." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_monastic_learning: "Монашеское обучение" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_monastic_learning: "Великие монастыри Афон, Синай и Студия становятся центрами науки, сохраняющими и развивающими знания в православной традиции." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_beacon_of_faith: "Маяк веры" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_beacon_of_faith: "Православие исходит из Константинополя как духовный маяк, его моральный авторитет привлекает верующих и внушает трепет язычникам." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_crossroads_of_worlds: "Перекресток миров" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_crossroads_of_worlds: "Константинополь контролирует стык Европы и Азии, его гавани и рынки, связывающие торговлю всего мира." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_lyceum: "Лицей" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_lyceum: "Школа естественной философии Аристотеля возрождается: науки, медицина и инженерное дело древности способствуют развитию империи и ее великим творениям." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_painted_stoa: "Раскрашенная Стоа" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_painted_stoa: "Портик, где преподавал Зенон: философия, риторика и искусство процветают, а культурный престиж Эллады излучается через дипломатию империи." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_imperial_cult: "Имперский Культ" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_imperial_cult: "Базилевсу поклоняются как живому богу. Золотой век божественного императора наполняет сокровищницу и воздвигает памятники по всему возрожденному классическому миру." #NT!
 STATIC_MODIFIER_NAME_nd_byz_dest_eternal_olympiad: "Вечная Олимпиада" #NT!
 STATIC_MODIFIER_DESC_nd_byz_dest_eternal_olympiad: "Священные игры Олимпии восстанавливаются, привлекая всех греков к одному празднику богов и связывая эллинский мир легитимностью божественного императора." #NT!
 nd_byz_imperial_triumph: "Императорский Триумф" #NT!
 nd_byz_imperial_triumph_desc: "Монументальный триумфальный комплекс, посвященный восстановлению Рима, сочетающий в себе величие древних имперских форумов с византийской административной эффективностью." #NT!
 nd_byz_patriarchal_academy: "Патриаршая Академия" #NT!
 nd_byz_patriarchal_academy_desc: "Центр православного богословия и философии, наследник древнего Пандидактериона, выпускающий ученых, писцов и дипломатов." #NT!
 nd_byz_triumph_maintenance: "Обслуживание Триумфа" #NT!
 nd_byz_triumph_maintenance_desc: "Поддержание мраморных фасадов, надписей, мозаик и административных помещений императорского триумфального комплекса." #NT!
 nd_byz_academy_maintenance: "Обслуживание Академии" #NT!
 nd_byz_academy_maintenance_desc: "Снабжение книжников, учителей и богослужебной службы Патриаршей Академии бумагой, книгами, свечами и облачениями." #NT!
  
  # ===== Bureaucracy authority (auto-modifier) ===== 
 AUTO_MODIFIER_NAME_nd_byz_bureaucracy_authority: "Императорская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_byz_bureaucracy_authority: "Восстановленное Византийское государство открывает дополнительную постоянную бюрократическую должность, дополняя средневековую логотезию, унаследованную от ранней империи. Соблюдает правила бюрократической игры National Destinies." #NT!
  
  # ===== Bureaucracies ===== 
 byz_synodos_endemousa_bureaucracy: "Синодос Эндемуса" #NT!
 byz_synodos_endemousa_bureaucracy_desc: "Эндемуса синодос — постоянный совет епископов, проживающих в Константинополе, под председательством Вселенского Патриарха. Действуя непрерывно с первых византийских веков до 1453 года, постоянный синод выносил решения по каноническому праву, догматам, бракам знатных семей и вопросам, затрагивающим весь православный мир от Балкан до Антиохии. Его решения связывали восточную Церковь и давали Патриархату корпоративную власть за пределами престола, параллельную легитимность, на которую басилевс мог опираться, но никогда не мог полностью распоряжаться." #NT!
  
 byz_genikon_logothesion_bureaucracy: "Геникон Логотезион" #NT!
 byz_genikon_logothesion_bureaucracy_desc: "Геникон, Генеральное казначейство, было центральным финансовым бюро Средневизантийского государства, начиная с седьмого века, и возглавлялось логофетом ту генику. Его чартулярии вели налоговые регистры в Константинополе; его эпоптай проверял темы; его трибунал рассматривал финансовые дела. Там, где Базилика кодифицировала законы, а Аллеленгион взимал коллективное бремя, геникон сам был механизмом аудита: бюро, которое отслеживало задолженности, восстанавливало льготы и удаляло магнатские фикции из кадастров." #NT!
  
 byz_mesazon_bureaucracy: "Офис Месазона" #NT!
 byz_mesazon_bureaucracy_desc: "Мезазон (буквально «посредник») формально возник как государственная должность в Никейской империи и был унаследован восстановленной империей Палеологов, где такие фигуры, как Деметриос Кидонес и последний мезазон Лукас Нотарас, день и ночь координировали политику басилевса. Единый технократ, которому доверяли, между троном и остальной администрацией, мезазон централизовал так, как никогда не могла сделать обремененная достоинством сенаторская титулатура, и вызвал негодование великих домов, приоритет которых он обошел." #NT!
  
 byz_eparchate_bureaucracy: "Константинопольская епархия" #NT!
 byz_eparchate_bureaucracy_desc: "Епарха Константинополя называли «отцом города» и ставили его чуть ниже самого императора. Будучи верховным судьей столицы, главой ее гильдий (чьи правила Лев VI зафиксировал в «Книге епарха») и надзирателем за запасами зерна, пожарной стражей и уличной дисциплиной, префект поддерживал в крупнейшем городе мира сытость и порядок. Динатои возмущались офицером, чей авторитет в стенах превосходил их собственный; люди обращались к нему всякий раз, когда заканчивался хлеб или справедливость." #NT!
  
 byz_mystikos_chancery_bureaucracy: "Мистикос и Асекретис" #NT!
 byz_mystikos_chancery_bureaucracy_desc: "Мистикос («тайный») служил личным секретарем базилевса с девятого века, контролируя императорскую печать вместе с хранителем чернильницы и контролируя асекретис, писцов внутреннего кабинета. При Мануэле I Комнине эта должность выросла до управления дворцом и личным кошельком. Скрытный аппарат, аналогичный публичной канцелярии, мистикос занимался конфиденциальной перепиской, внутренними расследованиями и собственной разведкой трона, к неудовольствию патриарха, чью церковную юрисдикцию он мог незаметно обойти." #NT!
