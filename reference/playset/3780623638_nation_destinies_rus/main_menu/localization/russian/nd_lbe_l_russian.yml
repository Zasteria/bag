l_russian:
 STATIC_MODIFIER_NAME_nd_divine_authority_of_the_mulopwe: "Божественная власть Мулопве" #NT!
 STATIC_MODIFIER_DESC_nd_divine_authority_of_the_mulopwe: "Священный король правит как живое божество, чье слово — закон. Благодаря божественному повелению и железной воле Мулопве пользуется абсолютной преданностью королей своего клана Балопве, собирая дань и заставляя подчиняться по всей саванне." #NT!
 STATIC_MODIFIER_NAME_nd_wisdom_of_the_bambudye: "Мудрость Бамбудье" #NT!
 STATIC_MODIFIER_DESC_nd_wisdom_of_the_bambudye: "Совет Бамбудье управляет государством, используя накопленные знания, закодированные на досках памяти лукаса. Ни один правитель не может действовать без их совета, и ни один вождь не может занимать должность, не изучив сначала учения общества. Эта институциональная устойчивость позволила Любе поглощать иностранные народы и пережить кризисы престолонаследия, которые разрушили бы меньшие королевства." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_copper_cross_economy: "Медный Крест Эконом" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_copper_cross_economy: "Отличительные медные слитки Лубы в форме креста стали валютой центральноафриканской торговли, которую принимают от лесов Конго до берегов Индийского океана." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_tributary_hegemony: "Данная гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_tributary_hegemony: "Вместо того, чтобы чеканить валюту, государство Люба направило свои медные богатства на создание обширной сети притоков. Подчиненные народы предоставляют рабочую силу и ресурсы в обмен на защиту и престиж власти Мулопве." #NT!
 nd_lbe.1.t: "Основание Империи Люба" #NT!
 nd_lbe.1.d: "Болотистые луга депрессии Упемба породили нечто экстраординарное. На берегах озер, где наши предки ловили рыбу и выплавляли железо, на богатых медью холмах, где наши кузнецы выковывают характерные крестообразные слитки, которые служат валютой по всей Центральной Африке, возникло великое королевство. Потомки Калалы Илунги, мифического охотника, свергнувшего тирана Конголо Мвамбу, теперь правят из Мвибеле царством различных народов, связанных общими институтами.\n\nНо за душу этой новой империи борются два видения. Мулопве восседает на троне как живое божество, его власть абсолютна и священна, но рядом с ним стоит совет Бамбудье, хранители досок памяти лукаса, обладающие властью проверять, давать советы и даже свергать короля, который злоупотребляет своим мандатом. Будет ли Империя Люба выкована божественным огнем королевской власти или построена на непреходящей мудрости ее институтов?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lbe.1.a: "Слово Мулопве — закон; наш божественный король будет править безраздельно." #NT!
 nd_lbe.1.b: "Бамбудье будет вести нас. Ни один король не правит без мудрости совета." #NT!
 nd_lbe.2.t: "Штандарт Медного креста" #NT!
 nd_lbe.2.d: "Наши кузнецы усовершенствовали искусство литья уникальных медных слитков крестообразной формы, известных как ханда. Эти кресты весом от нескольких граммов до более килограмма стали стандартной валютой не только на наших рынках, но и в торговых сетях, простирающихся от экваториальных лесов до Замбези. Торговцы Сонге обменивают ткань из рафии на нашу медь; торговцы с востока привозят ракушки и бусы. Перед нами стоит вопрос, как использовать это денежное превосходство: будем ли мы расширять производство меди, чтобы доминировать в региональной торговле, или использовать нашу экономическую мощь, чтобы связать больше людей в нашу приточную сеть?" #NT!
 nd_lbe.2.a: "Расширить торговлю медью. Пусть ханда течет на каждый рынок." #NT!
 nd_lbe.2.b: "Свяжите больше притоков; медь покупает лояльность, а не просто товары." #NT!
 nd_lbe.3.t: "Хранители Лукасы" #NT!
 nd_lbe.3.d: "Общество Бамбудье вышло на новый уровень сложности. Их доски памяти, лукаса, представляют собой шедевры закодированных знаний. Придворные историки, известные как бана балюте, проводят кончиками пальцев по поверхностям, усыпанным бусинами и ракушками, каждая группа которых представляет короля, миграцию, закон или священное место. Сейчас существуют три типа лукаса: лукаса лва нкунда, записывающая мифических героев и маршруты миграции, лукаса лва кабемба, организующая само общество Мбудье, и секретные советы, созданные для отдельных правителей, содержащие знания, слишком опасные для обычного слуха.\n\nНи один кандидат на политический пост не может получить свой титул, не став сначала членом Бамбудье. Общество служит живой конституцией, историческим архивом и контролем королевской власти, и все это закодировано на досках, достаточно маленьких, чтобы их можно было держать в одной руке." #NT!
 nd_lbe.3.a: "Память о Любе сохранится во все века." #NT!
 nd_lbe.4.t: "Распространение модели Балопве" #NT!
 nd_lbe.4.d: "Система священного королевства Люба оказалась настолько эффективной, что соседние народы переняли ее повсеместно. Королевство Лунда, наше самое мощное ответвление, распространило модель управления балопве на обширной территории Центральной Африки, от северной Анголы до северо-западной Замбии. Иностранные лидеры и правительства объединяются посредством гибкой системы клановой власти, где лояльность Мулопве и членство в Бамбудье создают связи сильнее, чем этнические или языковые связи.\n\nЭто истинный гений государственного управления Любы: правительство, достаточно прочное, чтобы противостоять спорам о престолонаследии, но достаточно гибкое, чтобы поглотить целые иностранные государства. Модель балопве — это не просто форма правления: это идея, распространяющаяся как огонь по саванне." #NT!
 nd_lbe.4.a: "Наша модель управления должна быть стандартом Центральной Африки." #NT!
 nd_lbe.5.t: "Защитники Хартленда" #NT!
 nd_lbe.5.d: "Иностранные державы обратили внимание на богатства нашего медного пояса и труд нашего народа. Но воины центра Лубы знают каждый путь через болота Упембы, каждый брод через Луалабу, каждую оборонительную позицию в холмах саванны. То, что посторонним кажется непроходимым кустом, наши солдаты называют домом. Мулопве призвали общества воинов организовать защиту, которая превратит сам ландшафт в оружие, враждебную местность, протяженные линии снабжения и непримиримое сопротивление людей, сражающихся за свою священную родину." #NT!
 nd_lbe.5.a: "Сердце страны не падет." #NT!
 nd_lbe_upemba_ironworking: "Упемба Металлургия" #NT!
 nd_lbe_upemba_ironworking_desc: "Традиции обработки железа впадины Упемба, отточенные столетиями непрерывного проживания, позволяют производить оружие и инструменты исключительного качества." #NT!
 nd_lbe_kilolo_administration: "Администрация Килоло" #NT!
 nd_lbe_kilolo_administration_desc: "Деревенские вожди, известные как Килоло, управляют местными делами, собирают дань и содержат зернохранилища, которые поддерживают население в неурожайные сезоны." #NT!
 nd_lbe_kisalian_lake_fishing: "Рыбалка на Кисальском озере" #NT!
 nd_lbe_kisalian_lake_fishing_desc: "Организованные рыболовецкие сообщества озер Упемба, наследники древней кисалийской традиции, обеспечивают надежный избыток продовольствия, который поддерживает рост городов." #NT!
 nd_lbe_palm_oil_trade: "Торговля пальмовым маслом" #NT!
 nd_lbe_palm_oil_trade_desc: "Добыча и торговля пальмовым маслом, универсальным продуктом, используемым для приготовления пищи, освещения и в качестве торгового товара в сетях Центральной Африки." #NT!
 nd_lbe_ancestral_spirit_tradition: "Традиция духа предков" #NT!
 nd_lbe_ancestral_spirit_tradition_desc: "Почитание духов предков обеспечивает общую религиозную основу, которая объединяет различные общины люба по всей саванне." #NT!
 nd_lbe_lineage_chiefs: "Вожди Родословной" #NT!
 nd_lbe_lineage_chiefs_desc: "Система управления через глав родов создает прочную иерархию, которая может включать в себя новые народы, сохраняя при этом порядок." #NT!
 nd_lbe_savanna_oral_tradition: "Саванна устная традиция" #NT!
 nd_lbe_savanna_oral_tradition_desc: "Богатые устные традиции саванны Люба сохраняют генеалогии, юридические прецеденты и культурные знания из поколения в поколение." #NT!
 nd_lbe_balopwe_royal_institution: "Королевский институт Балопве" #NT!
 nd_lbe_balopwe_royal_institution_desc: "Священный институт балопве, клановых королей, которые служат посредниками между божественным Мулопве и народом, составляет основу военной и политической власти Лубы." #NT!
 nd_lbe_bambudye_knowledge_tradition: "Традиция знаний Бамбудье" #NT!
 nd_lbe_bambudye_knowledge_tradition_desc: "Тайное общество Бамбудье, хранители досок памяти лукаса, сохраняет и передает накопленные знания государства Луба." #NT!
 nd_lbe_copper_cross_currency: "Медный крест Валюта" #NT!
 nd_lbe_copper_cross_currency_desc: "Отличительные медные слитки крестообразной формы, отлитые кузнецами Любы, служат валютой в торговых сетях Центральной Африки.\n\n#italic Доступно в: $nd_lbe_copper_smithy$#!" #NT!
 nd_lbe_divine_kingship_shrines: "Святыни Божественного Царства" #NT!
 nd_lbe_divine_kingship_shrines_desc: "Умершие Мулопве становятся божествами, а их бывшие столицы превращаются в живые святыни, освящающие ландшафт и законную королевскую власть." #NT!
 nd_lbe_kalala_ilunga_legacy: "Наследие Калалы Илунги" #NT!
 nd_lbe_kalala_ilunga_legacy_desc: "Все правители Лубы ведут свое происхождение от Калалы Илунги, мифического охотника, который сверг Конголо Мвамбу и ввел передовую ковку железа и королевскую политическую практику." #NT!
 nd_lbe_court_of_the_mulopwe: "Суд Мулопве" #NT!
 nd_lbe_court_of_the_mulopwe_desc: "Двор Мулопве в Мвибеле служит политическим и культурным центром империи, где различные народы находят общее дело под священной королевской властью." #NT!
 nd_lbe_tributary_expansion: "Приточное расширение" #NT!
 nd_lbe_tributary_expansion_desc: "Армии Любы нацелены на густонаселенные регионы, чтобы получить дань, расширяя территорию империи и военные резервы." #NT!
 nd_lbe_twite_military_reform: "Военная реформа Твите" #NT!
 nd_lbe_twite_military_reform_desc: "Твите, военачальник Мулопве, реорганизует провинциальные армии в более профессиональные силы, способные вести длительные кампании." #NT!
 nd_lbe_copper_salt_routes: "Медные и соляные маршруты" #NT!
 nd_lbe_copper_salt_routes_desc: "Контроль над жизненно важными торговыми путями, связывающими медные рудники, соляные источники и сельскохозяйственные регионы, укрепляет экономическую мощь Любы.\n\n#italic Доступно в: $nd_lbe_trade_post$#!" #NT!
 nd_lbe_katanga_salt_control: "Катангский контроль соли" #NT!
 nd_lbe_katanga_salt_control_desc: "Соляные шахты южных территорий становятся важной государственной монополией, стимулирующей как экономический рост, так и политическую конкуренцию.\n\n#italic Доступно в: $nd_lbe_copper_smithy$#!" #NT!
 nd_lbe_raffia_textile_industry: "Рафия Текстильная Промышленность" #NT!
 nd_lbe_raffia_textile_industry_desc: "Переплетение тканей из пальмовых волокон рафии создает основной экспортный товар, которым продают сонье и другие соседние народы.\n\n#italic Доступно в: $nd_lbe_trade_post$#!" #NT!
 nd_lbe_inabanza_regalia: "Инабанза Регалия" #NT!
 nd_lbe_inabanza_regalia_desc: "Инабанза, хранитель королевских гербов, хранит священные регалии, в том числе двойные железные колокола, которые символизируют мастерство мулопве в металлургии и государственном искусстве." #NT!
 nd_lbe_mbudye_council_expansion: "Расширение Совета Мбудье" #NT!
 nd_lbe_mbudye_council_expansion_desc: "Совет Мбудье распространяет свой надзор на большее количество аспектов управления, обеспечивая институциональную стабильность, выходящую за рамки отдельных правителей." #NT!
 nd_lbe_lualaba_river_network: "Речная сеть Луалаба" #NT!
 nd_lbe_lualaba_river_network_desc: "Река Луалаба и ее притоки служат дорогами империи, по которым доставляются торговые товары, дань и информация между сердцем страны и отдаленными провинциями." #NT!
 nd_lbe_tribute_army_reform: "Реформа армии дани" #NT!
 nd_lbe_tribute_army_reform_desc: "Система сбора дани военизирована, со специальными силами, которые могут быстро развертываться для обеспечения выполнения обязательств на обширных территориях империи." #NT!
 nd_lbe_lunda_model_spread: "Разворот модели Лунда" #NT!
 nd_lbe_lunda_model_spread_desc: "Модель священного королевства и институционального управления Любы распространяется на соседние народы, в первую очередь на Лунду, создавая обширную зону государственного управления под влиянием Любы." #NT!
 nd_lbe_copper_belt_consolidation: "Консолидация медного пояса" #NT!
 nd_lbe_copper_belt_consolidation_desc: "Богатые месторождения меди, соединяющие территорию Любы с медным поясом Замбии, взяты под более жесткий контроль государства, что способствует имперской экспансии.\n\n#italic Доступно в: $nd_lbe_copper_smithy$#!" #NT!
 nd_lbe_bamfumu_nobility: "Бамфуму Дворянство" #NT!
 nd_lbe_bamfumu_nobility_desc: "Придворная знать Бамфуму получает формализованные полномочия и обязанности, создавая стабильный аристократический класс, поддерживающий правление Мулопве." #NT!
 nd_lbe_regional_tribute_system: "Региональная система дани" #NT!
 nd_lbe_regional_tribute_system_desc: "Сложная система сбора и перераспределения дани обеспечивает поток ресурсов из периферийных регионов в центр и обратно, связывая империю воедино." #NT!
 nd_lbe_sacred_geography: "Сакральная география" #NT!
 nd_lbe_sacred_geography_desc: "Сам пейзаж становится картой духовности Любы со святынями, священными рощами и местами предков, обозначающими географию божественного царствования." #NT!
 nd_lbe_advanced_smelting_techniques: "Передовые методы плавки" #NT!
 nd_lbe_advanced_smelting_techniques_desc: "Мастера-металлисты Любы разрабатывают методы производства листового железа и пайки металлов, что позволяет создавать двойные железные колокола, символизирующие королевскую власть." #NT!
 nd_lbe_mulopwe_centralization: "Централизация Мулопве" #NT!
 nd_lbe_mulopwe_centralization_desc: "Мулопве консолидирует прямую власть над бывшими автономными провинциями, сокращая независимость местных вождей килоло." #NT!
 nd_lbe_katanga_copper_hegemony: "Катангская медная гегемония" #NT!
 nd_lbe_katanga_copper_hegemony_desc: "Полный контроль над источниками меди в Катанге делает Империю Люба бесспорным хозяином металлургии и торговли Центральной Африки." #NT!
 nd_lbe_savanna_road_networks: "Сети Саванны Роуд" #NT!
 nd_lbe_savanna_road_networks_desc: "Организованные пути, соединяющие крупные поселения, улучшают перемещение товаров, дани и армий по обширным территориям саванны." #NT!
 nd_lbe_mbudye_judicial_reform: "Судебная реформа Мбудье" #NT!
 nd_lbe_mbudye_judicial_reform_desc: "Общество Бамбудье формализует свою роль высшей судебной власти, наделенной полномочиями толковать законы и даже свергать королей, злоупотребляющих своим мандатом." #NT!
 nd_lbe_cross_continental_trade: "Межконтинентальная торговля" #NT!
 nd_lbe_cross_continental_trade_desc: "Торговые сети Любы простираются от экваториальных лесов до побережья Индийского океана, соединяя Центральную Африку с мировой торговлей.\n\n#italic Доступно в: $nd_lbe_trade_post$#!" #NT!
 nd_lbe_warrior_societies: "Общества воинов" #NT!
 nd_lbe_warrior_societies_desc: "Организованные общества воинов обеспечивают Лубу дисциплинированной военной элитой, обученной тактике ведения войны в саванне." #NT!
 nd_lbe_anti_colonial_resistance: "Антиколониальное сопротивление" #NT!
 nd_lbe_anti_colonial_resistance_desc: "Воины центра Любы используют свои знания местной местности и партизанскую тактику, чтобы противостоять иностранному вторжению." #NT!
 nd_lbe_copper_industrial_revolution: "Медная промышленная революция" #NT!
 nd_lbe_copper_industrial_revolution_desc: "Применение новых технологий при добыче и выплавке меди в Любе превращает древнюю промышленность в современный экономический двигатель." #NT!
 nd_lbe_unified_luba_governance: "Единое управление Любы" #NT!
 nd_lbe_unified_luba_governance_desc: "Власть Мулопве и мудрость Бамбудье сливаются в единую систему управления, способную управлять современным государством." #NT!
 nd_lbe_modern_trade_networks: "Современные торговые сети" #NT!
 nd_lbe_modern_trade_networks_desc: "Традиционные торговые пути Любы расширяются и модернизируются, интегрируя империю в глобальные торговые системы." #NT!
 nd_lbe_luba_cultural_renaissance: "Люба Культурный Ренессанс" #NT!
 nd_lbe_luba_cultural_renaissance_desc: "Расцвет искусства, скульптуры и устной литературы Любы прославляет наследие империи и проецирует ее культурное влияние на всю Центральную Африку." #NT!
 nd_lbe_sovereignty_of_the_heartland: "Суверенитет Хартленда" #NT!
 nd_lbe_sovereignty_of_the_heartland_desc: "Империя Люба утверждает свой суверенитет как независимая держава, требуя признания со стороны великих держав мира." #NT!
 a_nd_lbe_ironworker_warriors: "Воины-металлисты" #NT!
 a_nd_lbe_ironworker_warriors_desc: "Деревенское ополчение вооружено оружием, выкованным из упембского железа, копьями, топорами и короткими мечами исключительного качества. Эти солдаты-фермеры несут в бой традиции своих предков в обработке железа." #NT!
 a_nd_lbe_balopwe_guard: "Королевская гвардия Балопве" #NT!
 a_nd_lbe_balopwe_guard_desc: "Личная свита священного короля, составленная из самых преданных воинов клана Балопве. Их преданность Мулопве выходит за рамки обычной военной преданности; они сражаются, как будто защищая живого бога." #NT!
 a_nd_lbe_twite_spearmen: "Копейщики Твайта" #NT!
 a_nd_lbe_twite_spearmen_desc: "Провинциальные солдаты организовались под руководством твите, военного начальника Мулопве. Вооруженные длинными копьями и деревянными щитами, они составляют дисциплинированный костяк полевых армий Любы." #NT!
 a_nd_lbe_tribute_collectors: "Сборщики дани" #NT!
 a_nd_lbe_tribute_collectors_desc: "Быстро движущиеся вооруженные отряды, которым было поручено обеспечивать соблюдение даннических обязательств по всей империи. Легко оснащенные для быстрых маршей, они могут распространить власть Любы глубоко на подвластные территории." #NT!
 nd_lbe_lukasa_archive: "Лукаса Архив" #NT!
 nd_lbe_lukasa_archive_desc: "Центр обучения Бамбудье, где ведущие историки охраняют и интерпретируют доски памяти лукаса, сохраняя генеалогии, законы и истории миграции народа люба." #NT!
 nd_lbe_copper_smithy: "Королевская медная кузница" #NT!
 nd_lbe_copper_smithy_desc: "Передовая мастерская по металлообработке, где кузнецы Любы отливают уникальные медные слитки крестообразной формы, которые служат валютой в торговых сетях Центральной Африки." #NT!
 nd_lbe_mulopwe_shrine: "Храм Мулопве" #NT!
 nd_lbe_mulopwe_shrine_desc: "Живой храм, построенный в бывшей столице умершего Мулопве, который после смерти стал божеством. Эти священные места освящают ландшафт и укрепляют божественную легитимность королевской власти." #NT!
 nd_lbe_kilolo_granary: "Зернохранилище Килоло" #NT!
 nd_lbe_kilolo_granary_desc: "Административный склад, которым управляет местный вождь Килоло, собирающий и перераспределяющий сельскохозяйственную дань для поддержания населения и финансирования государства." #NT!
 nd_lbe_trade_post: "Торговый пост Люба" #NT!
 nd_lbe_trade_post_desc: "Региональная торговая станция, расположенная на медных и соляных путях, облегчающая обмен между центром Любы и отдаленными торговыми партнерами." #NT!
 nd_lbe_copper_cross_casting_pm: "Литье медного креста" #NT!
 nd_lbe_copper_cross_casting_pm_desc: "Литье меди в характерные крестообразные слитки ханда, которые ценятся как валюта и престижный товар в Центральной Африке." #NT!
 nd_lbe_palm_oil_processing_pm: "Переработка пальмового масла" #NT!
 nd_lbe_palm_oil_processing_pm_desc: "Добыча и переработка пальмового масла для использования в качестве продуктов питания, топлива для ламп и ценного торгового товара." #NT!
 nd_lbe_raffia_weaving_pm: "Плетение ткани из рафии" #NT!
 nd_lbe_raffia_weaving_pm_desc: "Плетение ткани из волокон пальмы рафии - основной экспортный товар Луба, который продается Сонгье и другим соседним народам." #NT!
 nd_lbe_lake_fishery_pm: "Рыболовство на озере" #NT!
 nd_lbe_lake_fishery_pm_desc: "Организованная рыбалка на озерах впадины Упемба, вылов улова, который поддерживает близлежащие поселения." #NT!
 nd_lbe_salt_mining_pm: "Добыча соли" #NT!
 nd_lbe_salt_mining_pm_desc: "Добывают соль на южных рудниках и производят товар настолько ценный, что он служит валютой наряду с медью." #NT!
 nd_lbe_lukasa_maintenance: "Заповедник Лукаса" #NT!
 nd_lbe_lukasa_maintenance_desc: "Постоянное создание и обслуживание досок памяти lukasa требует квалифицированных мастеров, работающих с бусинами, ракушками и прекрасными материалами." #NT!
 nd_lbe_smithy_maintenance: "Кузница операций" #NT!
 nd_lbe_smithy_maintenance_desc: "Выплавка медной руды и перековка из нее инструментов и инвентаря в королевской кузнице." #NT!
 nd_lbe_shrine_maintenance: "Содержание храма" #NT!
 nd_lbe_shrine_maintenance_desc: "Поддержание священного храма с подношениями и ритуальными товарами в честь ушедшего Мулопве." #NT!
 nd_lbe_granary_maintenance: "Содержание зернохранилища" #NT!
 nd_lbe_granary_maintenance_desc: "Поддержание складских сооружений, защищающих запасы зерна от непогоды и вредителей." #NT!
 nd_lbe_trade_post_maintenance: "Операции торгового поста" #NT!
 nd_lbe_trade_post_maintenance_desc: "Эксплуатационные расходы торговой станции, включая накопление торговых товаров для обмена." #NT!
 nd_lbe_lake_fishing_tradition: "Традиция озерной рыбалки" #NT!
 nd_lbe_lake_fishing_tradition_desc: "Организованные рыболовные сообщества озер Упемба, продолжающие древнюю кисалскую традицию, составляют экономическую основу раннего поселения Люба.\n\n#italic Доступно в: $nd_lbe_upemba_fishery$#!" #NT!
 nd_lbe_savanna_fortification: "Укрепление Саванны" #NT!
 nd_lbe_savanna_fortification_desc: "Укрепленные деревенские частоколы защищают поселения Люба от набегов, используя природные преимущества ландшафта саванны." #NT!
 nd_lbe_upemba_fishery: "Рыболовство Упемба" #NT!
 nd_lbe_upemba_fishery_desc: "Организованная рыбная ловля на озерах впадины Упемба, обеспечивающая надежный избыток продовольствия, поддерживающий окружающее население." #NT!
 nd_lbe_palisade_fort: "Люба Палисад" #NT!
 nd_lbe_palisade_fort_desc: "Укрепленная оборона деревни, построенная из бревен лиственных пород и предназначенная для защиты поселений от рейдеров и служащая местом сбора местного ополчения." #NT!
 nd_lbe_ivory_carving_pm: "Резьба по Слоновой Кости" #NT!
 nd_lbe_ivory_carving_pm_desc: "Искусная резьба из слоновой кости для изготовления престижных товаров, продаваемых через центральноафриканские сети и ценимых иностранных купцов." #NT!
 nd_lbe_palm_beer_brewing_pm: "Пальмовое пивоварение" #NT!
 nd_lbe_palm_beer_brewing_pm_desc: "Варка пива из пальмового сока - центральный элемент общественной жизни Любы и религиозных церемоний." #NT!
 nd_lbe_copper_belt_extraction_pm: "Извлечение медного пояса" #NT!
 nd_lbe_copper_belt_extraction_pm_desc: "Интенсивная добыча богатых медных месторождений, соединяющих территорию Любы с медным поясом Замбии, с получением сырой меди для торговли и металлообработки." #NT!
 nd_lbe_caravan_trade_pm: "Караванные торговые операции" #NT!
 nd_lbe_caravan_trade_pm_desc: "Дальние караванные маршруты, перевозящие медь, соль и слоновую кость через Центральную Африку на отдаленные прибрежные рынки." #NT!
 nd_lbe_fishery_maintenance: "Содержание рыболовства" #NT!
 nd_lbe_fishery_maintenance_desc: "Обслуживание каноэ, сетей и сушилок для рыбной ловли на берегу озера." #NT!
 nd_lbe_palisade_maintenance: "Содержание частокола" #NT!
 nd_lbe_palisade_maintenance_desc: "Поддержание защитного частокола свежей древесиной и ремонт." #NT!
 nd_lbe_formed_tt: "Любая империя образовалась" #NT!
 nd_lbe_path_a_tt: "Выбрать Божественную власть Мулопве" #NT!
 nd_lbe_path_b_tt: "Выбрать Мудрость Бамбудье" #NT!
 nd_lbe_destiny: "Судьба Империи Люба" #NT!
 nd_lbe_destiny_desc: "Империя Люба стоит на перепутье. Путь, выбранный при его основании, теперь манит нацию к ее окончательному предназначению. Прежде чем начнется великая работа, необходимы стабильность и цель." #NT!
 nd_lbe_dest_tanganyika: "Марш в Танганьику" #NT!
 nd_lbe_dest_tanganyika_desc: "Мулопве требует расширения на восток до берегов озера Танганьика и на север, в бассейн Ломами. Эти завоевания заложат военную основу континентальной империи." #NT!
 nd_lbe_dest_kongo: "Падение Конго" #NT!
 nd_lbe_dest_kongo_desc: "Обеспечив восток, Мулопве обращает свой взор на запад. Великое королевство Конго со столицей в Мбанза-Конго должно быть передано под сюзеренитет Любы, чтобы доказать господство империи над Центральной Африкой." #NT!
 nd_lbe_dest_mulopwe_supreme: "Мулопве Верховный" #NT!
 nd_lbe_dest_mulopwe_supreme_desc: "Последняя цель божественного короля: выйти за пределы внутренних территорий и захватить прибрежные торговые города Килва и Софала, соединив сердце Любы с богатствами Индийского океана. Это вершина священного завоевания." #NT!
 nd_lbe_dest_knowledge: "Хранители знаний" #NT!
 nd_lbe_dest_knowledge_desc: "Совет Бамбудье направляет нацию к институциональному развитию и экономическому мастерству. Воспользуйтесь современными финансовыми практиками и обеспечьте доминирование меди Luba на рынках." #NT!
 nd_lbe_dest_trade_routes: "Лорды торговых путей" #NT!
 nd_lbe_dest_trade_routes_desc: "Распространите коммерческое видение Бамбудье на Атлантическое побережье. Порт Лоанго будет служить западной конечной точкой торговой сети Любы, простирающейся от медных рудников до океанских гаваней." #NT!
 nd_lbe_dest_bambudye_supreme: "Бамбудье Верховный" #NT!
 nd_lbe_dest_bambudye_supreme_desc: "Высшее выражение институциональной мудрости Бамбудье: торговая империя, охватывающая весь континент, где слоновая кость течет через рынки Любы, а глобальная торговля обогащает центр страны. Это триумф управления." #NT!
 nd_lbe.6.t: "Судьба манит" #NT!
 nd_lbe.6.d: "Наша империя достигла стабильности, необходимой для достижения своей высшей цели. Путь, который мы выбрали при своем основании, будь то божественный авторитет Мулопве или институциональная мудрость Бамбудье, теперь призывает нас вперед. Предки наблюдают, а доски лукаса записывают наши дела для потомков. Пусть начнется великая работа." #NT!
 nd_lbe.6.a: "Перед нами разворачивается судьба Любы." #NT!
 nd_lbe.7.t: "Восточная граница" #NT!
 nd_lbe.7.d: "Наши армии достигли берегов озера Танганьика, и бассейн Ломами подчиняется власти Мулопве. Народы Востока, давно привыкшие к своей независимости, теперь признают божественного короля, чье железное оружие и медные кресты следовали по торговым путям в их земли. Воины возвращаются с данью, слоновой костью, медью и верностью новых подданных." #NT!
 nd_lbe.7.a: "Приказ Мулопве доходит до великого озера." #NT!
 nd_lbe.8.t: "Конго пало" #NT!
 nd_lbe.8.d: "Мбанза Конго, древний центр власти на западе, взят. Знамя Мулопве реет над городом, который когда-то соперничал с нашим по престижу и влиянию. Это не просто завоевание: это подчинение цивилизации. Как нам закрепить этот огромный приз? Мы можем лишить его богатства, чтобы стимулировать дальнейшие кампании, или мы можем почтить его воинов, интегрировав их в военные традиции Любы." #NT!
 nd_lbe.8.a: "Лишите завоеванные земли дани." #NT!
 nd_lbe.8.b: "Почтите павших, объедините их воинов." #NT!
 nd_lbe.9.t: "Восходящий Мулопве" #NT!
 nd_lbe.9.d: "Священный король достиг того, о чем предки могли только мечтать. От депрессии Упембы до Индийского океана, от Ломами до Замбези, Империя Луба теперь контролирует торговые пути, соединяющие внутренние районы Африки с внешним миром. Дау Килвы везут медь Любы в Аравию, а золото Софалы течет через руки Мулопве. Это вершина божественного царствования, империи, построенной на железе, меди и священном мандате предков.\n\nБудет ли Мулопве править с железного трона военного превосходства, или же он создаст империю из меди, богатую, стабильную и долговечную?" #NT!
 nd_lbe.9.a: "Железный Трон будет командовать всеми народами." #NT!
 nd_lbe.9.b: "Империя Меди существует благодаря богатству." #NT!
 nd_lbe.10.t: "Экономика знаний" #NT!
 nd_lbe.10.d: "Совет Бамбудье привел нацию к новой модели власти, основанной не только на завоеваниях, но и на институциональных знаниях и экономической сложности. Принятие нами банковской практики превратило медный крест из простого торгового товара в инструмент финансовой власти. Советы Лукаса теперь записывают не только генеалогии и истории миграции, но и торговые соглашения, рыночные цены и дипломатические протоколы. Знания – это самая истинная форма богатства." #NT!
 nd_lbe.10.a: "Мудрость Бамбудье обогащает всех нас." #NT!
 nd_lbe.11.t: "Атлантическая связь" #NT!
 nd_lbe.11.d: "Наши купцы достигли Лоанго на побережье Атлантического океана, завершив торговый путь, простирающийся от медных рудников Катанги до гаваней западного океана. Медные кресты Любы, ткань из рафии и слоновая кость теперь текут на запад через сеть посредников, в то время как иностранные товары (соль, ракушки и ткань из далеких земель) возвращаются, чтобы обогатить сердце страны.\n\nСледуем ли мы сосредоточиться на строительстве торговых домов вдоль медных путей, или мы должны использовать соль и дипломатию, чтобы связать наших торговых партнеров в прочную сеть альянса?" #NT!
 nd_lbe.11.a: "Стройте торговые дома; медь – король." #NT!
 nd_lbe.11.b: "Соль и дипломатия укрепляют связи." #NT!
 nd_lbe.12.t: "Триумфальный Бамбудай" #NT!
 nd_lbe.12.d: "Общество Бамбудье достигло чего-то беспрецедентного: системы управления настолько эффективной, настолько гибкой и настолько глубоко укорененной в институциональных знаниях, что она стала моделью для народов всего континента. Иностранные лидеры стремятся стать членами совета, а советы лукаса рассматриваются как шедевры закодированной мудрости. Империя Люба доказала, что государство, построенное на знаниях и торговле, может соперничать с любым государством, построенным на завоеваниях.\n\nДолжны ли мы формализовать Бамбудье как конституционный орган, или мы проецируем культуру Люба за пределы страны, поглощая соседние народы в нашу институциональную структуру?" #NT!
 nd_lbe.12.a: "Бамбудье — наша живая конституция." #NT!
 nd_lbe.12.b: "Пусть все народы научатся пути Любы." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_conquerors_tribute: "Дань завоевателю" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_conquerors_tribute: "Добыча от завоевания Конго способствует дальнейшему расширению, хотя затраты на управление такими обширными территориями напрягают казну." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_warrior_prestige: "Престиж воина" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_warrior_prestige: "Интеграция воинов Конго в военные традиции Любы позволила создать закаленные в боях силы с превосходным моральным духом и тактической гибкостью." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_iron_throne: "Железный Трон" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_iron_throne: "Мулопве правит с железного трона, его божественная власть неоспорима во всей огромной империи. Военное превосходство является тотальным, хотя издержки бесконечной войны приводят к росту инфляции." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_empire_of_copper: "Империя меди" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_empire_of_copper: "Богатство медного пояса и прибрежных торговых городов поддерживает огромную профессиональную армию, а империя Мулопве пользуется уважением среди великих держав мира." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_copper_merchants: "Торговцы медью" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_copper_merchants: "Торговые дома Любы доминируют в торговле медью от Катанги до Атлантики, обращая местное население в торговую практику Любы. Однако успех порождает определенную самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_salt_diplomacy: "Соляная дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_salt_diplomacy: "Обмен солью и медью создал сеть дипломатических отношений, которая расширяет влияние Любы без затрат на завоевание, хотя поддержание этих отношений требует дорогостоящих придворных показов." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_living_constitution: "Живая Конституция" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_living_constitution: "Совет Бамбудье функционирует как живая конституция, обеспечивающая институциональную преемственность, дипломатический опыт и способность восстанавливаться после любого кризиса." #NT!
 STATIC_MODIFIER_NAME_nd_lbe_dest_cultural_hegemony: "Культурная гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_lbe_dest_cultural_hegemony: "Модель управления Любы распространяется на все уголки Центральной Африки, объединяя иностранные народы в общую институциональную структуру, которая снижает напряженность и обеспечивает гибкую политику." #NT!
 nd_lbe_war_camp: "Военный лагерь Мулопве" #NT!
 nd_lbe_war_camp_desc: "Постоянный военный лагерь, основанный твитом божественного короля, из которого собираются, снабжаются и отправляются армии, чтобы обеспечить исполнение воли Мулопве через отдаленные границы." #NT!
 nd_lbe_war_camp_maintenance: "Операции в военном лагере" #NT!
 nd_lbe_war_camp_maintenance_desc: "Обеспечение постоянного военного лагеря оружием, продовольствием и техникой для армий Мулопве." #NT!
 nd_lbe_grand_lukasa_council: "Совет Гранд-Лукасы" #NT!
 nd_lbe_grand_lukasa_council_desc: "Верховный зал общества Бамбудье, где изучаются самые священные советы лукаса, а мудрейшие советники руководят управлением континентальной торговой империей." #NT!
 nd_lbe_grand_council_maintenance: "Операции Совета" #NT!
 nd_lbe_grand_council_maintenance_desc: "Поддержание большого зала совета и предоставление материалов, необходимых для создания лукасы и научной работы." #NT!
 lbe_bilumbu_council_bureaucracy: "Совет Духов-Средств Билумбу" #NT!
 lbe_bilumbu_council_bureaucracy_desc: "Билумбу были духами-медиумами, которые предсказывали суд предков с помощью гадального жезла кашекешеке, вынося решения по спорам о наследовании, обвинениям в колдовстве и данным обязательствам, которые Мулопве не могли решить напрямую. Билумбу, зарегистрированная в саванне Упемба, по крайней мере, с шестнадцатого века, функционировала как церковно-судебная ветвь власти, параллельная светским администраторам килоло, вынося вердикты, которые ни один вождь не осмеливался оспаривать, поскольку они исходили от умерших предшественников трона. Когда этот институт пришел в упадок, гадание стало инструментом фракционных линий билумбу, а не священного короля." #NT!
 lbe_mwadi_vessels_bureaucracy: "Королевские сосуды Мвади" #NT!
 lbe_mwadi_vessels_bureaucracy_desc: "Мвади были старшими женщинами, которые с помощью ритуала одержимости духом воплощали умерших королевских предков и превосходили ныне живущих вождей благодаря ченнелингу основателей Калалы Илунги и Мбиди Килуве. Правители-данники Каньока, Калундве и Хембы женились на Мвади, чтобы привязать себя к королевской линии Люба, объединяя периферии посредством ритуального родства, а не завоевания. Это учреждение централизовало власть дешево, но приводило к кризисам преемственности всякий раз, когда соперник Мвади претендовал на то же воплощение, а обиженную знать обвиняли в недостаточной преданности." #NT!
 lbe_kioni_court_bureaucracy: "Придворные музыканты Киони" #NT!
 lbe_kioni_court_bureaucracy_desc: "Киони были не артистами, а живыми архивами: придворные музыканты пели королевские генеалогии, передавали указы в виде барабанных фраз по саванне и присутствовали при каждом ритуальном административном акте. Функционируя как канцелярия без письменности, киони сохраняли культурный канон государства Люба и распространяли королевскую власть посредством выступлений. Когда королевское покровительство киони прекратилось, придворная память стала оспариваться: конкурирующие генеалогии разрастались, указы становились двусмысленными, а престиж Мулопве улетучился вместе с тишиной барабанов." #NT!
 lbe_twite_tributary_bureaucracy: "Администрация притока Твит" #NT!
 lbe_twite_tributary_bureaucracy_desc: "Твиты были военачальниками-администраторами, посланными из столицы управлять подчиненными подкоролевствами в Каньоке, Калундве и землях Хемба, собирая медные кресты, слоновую кость, соль и рафию для Мулопве. Местные вожди сохранили свои должности, но приняли на себя начальников Любы, которые следили за данью, собирали вспомогательные силы и обеспечивали соблюдение ритуальных обязательств. Эффективная для получения доходов и быстрой интеграции, система Twite постепенно создавала квазиблагородный класс с частной свитой, лояльность которой менялась всякий раз, когда ослаблялся центральный контроль." #NT!
 lbe_kafuti_society_bureaucracy: "Священное общество Кафути" #NT!
 lbe_kafuti_society_bureaucracy_desc: "Кафути представляли собой священно-политическое сообщество посвященных знатных людей, которые регулировали королевскую преемственность, носили доски памяти лукаса и другие регалии и связывали региональных аристократов с Мулопве посредством общих ритуальных знаний, к которым непосвященные простолюдины не могли получить доступ. Тесно связанные с обществами Бамбудье и Букибвакулу, Кафути создали сплоченный правящий класс в Любе и подчиненных землях, но его ритуалы препятствовали продвижению всех, кто находится за пределами ложи, барьер, который непосвященные крестьяне и соперничающие роды воспринимали как кражу голоса." #NT!
 AUTO_MODIFIER_NAME_nd_lbe_bureaucracy_authority: "Бюро Бамбудье" #NT!
 AUTO_MODIFIER_DESC_nd_lbe_bureaucracy_authority: "С основанием Империи Луба Мулопве унаследовал институциональный аппарат хранителей памяти бамбудье и придворных музыкантов киони, что дало возможность управлять еще двумя устойчивыми бюрократиями в дополнение к столичным." #NT!
