l_russian:
 STATIC_MODIFIER_NAME_nd_light_of_knowledge: "Свет знаний" #NT!
 STATIC_MODIFIER_DESC_nd_light_of_knowledge: "Следуя видению Усмана дан Фодио, Халифат посвящает себя стремлению к образованию, юриспруденции и справедливому управлению. В эмиратах множится количество школ, учёных почитают выше воинов, а отправление правосудия следует букве священного закона." #NT!
 STATIC_MODIFIER_NAME_nd_banner_of_jihad: "Знамя джихада" #NT!
 STATIC_MODIFIER_DESC_nd_banner_of_jihad: "Халифат поднимает зеленое знамя священной войны. Всадники фулани выезжают из каждого эмирата, чтобы нести свет истинной веры необращенным, а грохот копыт по Сахелю возвещает о расширении царства Божьего." #NT!
 STATIC_MODIFIER_NAME_nd_bello_reforms: "Административные реформы Белло" #NT!
 STATIC_MODIFIER_DESC_nd_bello_reforms: "Султан Мухаммад Белло систематизировал управление Халифатом, установив систематическое управление, стандартизированное налогообложение и курьерскую сеть, связывающую Сокото со столицами всех провинций." #NT!
 STATIC_MODIFIER_NAME_nd_dan_fodio_legacy: "Наследие Шеху" #NT!
 STATIC_MODIFIER_DESC_nd_dan_fodio_legacy: "Интеллектуальное и духовное наследие Усмана дан Фодио передается из поколения в поколение, вдохновляя ученых, юристов и реформаторов во всем мусульманском мире." #NT!
 nd_sko.1.t: "Основание халифата Сокото." #NT!
 nd_sko.1.d: "Джихад победил. Там, где когда-то короли хауса правили посредством обычаев и капризов, возникает новый порядок, основанный на откровенном слове Божьем и научной традиции Усмана дан Фодио. Город Сокото является резиденцией повелителя правоверных, и из его мечетей и судов исходит власть, объединяющая тридцать эмиратов в единый Халифат.\n\nНо остается вопрос: что будет определять это новое государство? Будет ли это меч, вырезавший его из обломков старых королевств, или перо, придавшее ему цель? Путь, который мы выбираем сейчас, разнесется по векам.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sko.1.a: "Пусть знания освещают Сахель" #NT!
 nd_sko.1.b: "Пусть всадники несут веру вперед" #NT!
 nd_sko.2.t: "Учение Шеху" #NT!
 nd_sko.2.d: "Сочинения Усмана дан Фодио на арабском языке, языке хауса и фульфульде стали интеллектуальной основой нашего государства. Его трактаты об управлении, юриспруденции и обязанностях верующих распространяются от Сокото до самых отдаленных рибатов. Студенты приезжают со всего Сахеля, чтобы учиться у ученых, которые учились у ног Шеху. Это больше, чем религиозное обучение: это создание грамотного, образованного правящего класса, способного управлять империей посредством закона, а не произвольных прихотей мелких королей." #NT!
 nd_sko.2.a: "Его наследие сохранится" #NT!
 nd_sko.3.t: "Администрация Мухаммеда Белло" #NT!
 nd_sko.3.d: "Султан Мухаммад Белло, сын Шеху, показал себя не просто воином, но и блестящим администратором. Там, где его отец дал видение, Белло построил государственную машину. Он кодифицировал шариатское управление во всех эмиратах, установил систему связи кофа, связывающую Сокото со столицами провинций посредством конных курьеров, расширил школы и библиотеки и основал новые города вдоль приграничной системы рибат. Под его руководством Халифат превратился из совокупности завоеванных территорий в действующую империю, самое густонаселенное государство в Западной Африке." #NT!
 nd_sko.3.a: "Халифат хорошо управляется" #NT!
 nd_sko.4.t: "Власть халифа" #NT!
 nd_sko.4.d: "Титул Амира аль-Муминина, повелителя правоверных, имеет в нашем Халифате не только церемониальный вес. Эмиры, хотя и управляют своими провинциями со значительной автономией, признают Сокото источником законной власти. Споры между эмиратами разрешаются султанским судом, а назначение новых эмиров требует одобрения халифа. Этот баланс между центральной властью и автономией провинций оказался чрезвычайно эффективным, позволяя адаптироваться на местном уровне, сохраняя при этом единство целей, которое объединяет тридцать разных эмиратов под одним знаменем веры." #NT!
 nd_sko.4.a: "Единство через веру и закон" #NT!
 nd_sko.5.t: "Непреходящее наследие Дэна Фодио" #NT!
 nd_sko.5.d: "Спустя поколения после смерти Усмана дан Фодио его интеллектуальное и духовное наследие остается движущей силой Халифата. Его сочинения изучают в каждой мечети и школе по всему Сахелю. Его модель исламского государства, основанного на науке, управляемого законом и приверженного моральному реформированию общества, продолжает вдохновлять реформаторов и мыслителей далеко за пределами Халифата. Шеху, возможно, и больше нет, но движение, которое он вызвал, горит так же ярко, как и прежде." #NT!
 nd_sko.5.a: "Его свет никогда не померкнет" #NT!
 nd_sko_hausa_urbanism: "Хауса Урбанизм" #NT!
 nd_sko_hausa_urbanism_desc: "Великие города-крепости Хаусаленда (Кано, Кацина, Заззау) являются центрами ремесла, торговли и культуры, известными своим текстилем, окрашенным в цвет индиго, и шумными рынками." #NT!
 nd_sko_trans_saharan_networks: "Транссахарские сети" #NT!
 nd_sko_trans_saharan_networks_desc: "Древние торговые пути, проходящие через пустыню, соединяют Хаусаленд с Северной Африкой, перевозя золото, рабов, кожу и орехи кола на север, а соль, лошадей и промышленные товары на юг.\n\n#italic Доступно в: $nd_sko_kano_dye_pit$#!" #NT!
 nd_sko_fulani_pastoral: "Пасторальная традиция Фулани" #NT!
 nd_sko_fulani_pastoral_desc: "Глубокий опыт народа Фулани в животноводстве поддерживает общины по всему Сахелю, обеспечивая молоко, мясо, кожу и богатство, которое лежит в основе как торговли, так и военной мощи." #NT!
 nd_sko_sahel_horsemanship: "Сахельская верховая езда" #NT!
 nd_sko_sahel_horsemanship_desc: "Конные воины лугов Сахеля — одни из лучших всадников в Африке, их копейщики и конные лучники доминируют в боях в открытом поле по всей саванне." #NT!
 nd_sko_islamic_learning: "Исламское обучение" #NT!
 nd_sko_islamic_learning_desc: "Сети ученых, учителей и странствующих проповедников распространяют исламские знания по всему Хаусаленду, создавая интеллектуальные основы, которые однажды вызовут революцию." #NT!
 nd_sko_walled_cities: "Города-крепости" #NT!
 nd_sko_walled_cities_desc: "Бирни, массивные земляные валы и каменные стены, окружающие города хауса, защищают городское население и его богатство от рейдеров, создавая защищенные центры цивилизации по всему Сахелю." #NT!
 nd_sko_kano_textile_trade: "Кано Текстиль Трейд" #NT!
 nd_sko_kano_textile_trade_desc: "Легендарные красильные ямы и ткацкие мастерские Кано ежегодно производят миллионы рулонов ткани, что делает город одним из величайших промышленных центров доиндустриального мира.\n\n#italic Доступно в: $nd_sko_kano_dye_pit$#!" #NT!
 nd_sko_quranic_schools: "Коранические школы" #NT!
 nd_sko_quranic_schools_desc: "Сеть коранических школ обеспечивает образование в области арабской грамотности, исламской юриспруденции и естественных наук, создавая ученый класс, преодолевающий этнические и политические границы." #NT!
 nd_sko_emirate_traditions: "Эмиратские традиции" #NT!
 nd_sko_emirate_traditions_desc: "Военные традиции эмиратов хауса создают дисциплинированные гарнизонные силы, обученные защищать городские стены и поддерживать порядок в своих владениях." #NT!
 nd_sko_leather_guilds: "Кожаные гильдии" #NT!
 nd_sko_leather_guilds_desc: "Кожевники Хаусаленда производят кожаные изделия такого качества, что их продают по всей Сахаре. Один только Кано ежегодно экспортирует миллионы дубленых шкур и сандалий." #NT!
 nd_sko_dan_fodio_teachings: "Учения Дэна Фодио" #NT!
 nd_sko_dan_fodio_teachings_desc: "Реформистская проповедь Усмана дан Фодио призывает к возвращению к основам Корана и очищению исламской практики от синкретизма, закладывая идеологическую основу для революции." #NT!
 nd_sko_ribat_frontier: "Рибат Фронтир" #NT!
 nd_sko_ribat_frontier_desc: "Укрепленные приграничные поселения, сочетающие в себе военный гарнизон и исламскую школу, рибаты служат одновременно оборонительными опорными пунктами и центрами распространения веры." #NT!
 nd_sko_kano_emporium: "Торговый центр Кано" #NT!
 nd_sko_kano_emporium_desc: "При Халифате Кано процветает как торговый центр Сахеля, перекресток, где транссахарские караваны встречаются с местными рынками, в центре необычайной экономической активности." #NT!
 nd_sko_jihad_cavalry: "Джихад Кавалерия" #NT!
 nd_sko_jihad_cavalry_desc: "Конные воины джихада Фулани составляют элитную ударную силу Халифата, вступающую в бой с копьем и мечом под зеленым знаменем веры." #NT!
 nd_sko_sharia_courts: "Шариатские суды" #NT!
 nd_sko_sharia_courts_desc: "Внедрение законов шариата в качестве основы управления заменяет произвол старых королей хауса кодифицированной правовой системой, управляемой обученными кади." #NT!
 nd_sko_caliphal_authority: "Халифская власть" #NT!
 nd_sko_caliphal_authority_desc: "Султан Сокото, как командующий правоверными, осуществляет высшую религиозную и политическую власть над системой эмирата, выступая посредником в спорах и утверждая назначение эмиров." #NT!
 nd_sko_bello_administration: "Администрация Белло" #NT!
 nd_sko_bello_administration_desc: "Султан Мухаммад Белло превращает Халифат из революционного движения в функционирующее бюрократическое государство, кодифицируя управление, создавая сети связи и основывая новые города." #NT!
 nd_sko_textile_manufactory: "Текстильная мануфактура" #NT!
 nd_sko_textile_manufactory_desc: "На крупных предприятиях по производству тканей в городах Халифата работают тысячи ткачей, красильщиков и портных, производящих текстиль для внутреннего использования и на экспорт по всей Западной Африке." #NT!
 nd_sko_kofa_system: "Система связи Кофа" #NT!
 nd_sko_kofa_system_desc: "Система конных курьеров кофа связывает Сокото с провинциальными эмиратами, обеспечивая быструю связь и административную координацию на территории огромного Халифата.\n\n#italic Доступно в: $nd_sko_ribat$#!" #NT!
 nd_sko_emirate_cavalry: "Бронетанковая кавалерия Эмиратов" #NT!
 nd_sko_emirate_cavalry_desc: "Тяжелая кавалерия эмиратов вступает в бой в кольчугах, с конями в доспехах и с копьями наготове, аристократические ударные отряды военной машины Халифата." #NT!
 nd_sko_reformed_levies: "Реформированные сборы" #NT!
 nd_sko_reformed_levies_desc: "Реорганизованные военные наборы, собранные из разнообразного населения Халифата, обеспечивают устойчивые пехотные силы для длительных кампаний консолидации и защиты." #NT!
 nd_sko_scholarly_tradition: "Научная традиция" #NT!
 nd_sko_scholarly_tradition_desc: "Традиция исламской науки Халифата, унаследованная от дана Фодио и расширенная поколениями юристов, теологов и ученых, делает Сокото маяком образования в Западной Африке." #NT!
 nd_sko_sahel_grain_trade: "Сахельская зерновая торговля" #NT!
 nd_sko_sahel_grain_trade_desc: "Излишки сельскохозяйственной продукции из плодородных речных долин Халифата способствуют как росту населения, так и активной торговле зерном с соседними государствами." #NT!
 nd_sko_fortified_emirates: "Укрепленные Эмираты" #NT!
 nd_sko_fortified_emirates_desc: "Усиленные оборонительные сооружения по всей системе эмирата, от модернизированных стен Бирни до новых опорных пунктов рибат, создают устойчивую сеть укрепленных позиций." #NT!
 nd_sko_caliphate_resurgent: "Возрождение Халифата" #NT!
 nd_sko_caliphate_resurgent_desc: "Столкнувшись с новыми угрозами и меняющимися методами ведения войны, Халифат модернизирует свои вооруженные силы, применяя огнестрельное оружие и реформируя тактику для защиты царства верующих." #NT!
 nd_sko_kano_industrial_center: "Промышленный центр Кано" #NT!
 nd_sko_kano_industrial_center_desc: "Протопромышленное производство в Кано расширяет масштабы текстильного ткачества, обработки кожи и обработки металлов для удовлетворения растущего спроса, что предвещает трансформацию экономики Халифата." #NT!
 nd_sko_pan_islamic_diplomacy: "Панисламская дипломатия" #NT!
 nd_sko_pan_islamic_diplomacy_desc: "Халифат выходит за пределы Сахеля, чтобы наладить связи с более широким мусульманским миром, от Марокко до Османской империи, стремясь к солидарности, торговле и признанию." #NT!
 nd_sko_legacy_of_dan_fodio: "Наследие Дэна Фодио" #NT!
 nd_sko_legacy_of_dan_fodio_desc: "Интеллектуальное и духовное наследие Усмана дан Фодио выходит за рамки самого Халифата, вдохновляя исламские реформаторские движения по всей Западной Африке и за ее пределами на протяжении поколений." #NT!
 a_nd_sko_fulani_lancer: "Фулани Лансер" #NT!
 a_nd_sko_fulani_lancer_desc: "Легкая кавалерия лугов Сахеля, уланы Фулани — быстрые налетчики и разведчики, чье искусство верховой езды не имеет себе равных в открытой саванне." #NT!
 a_nd_sko_emirate_guard: "Эмиратская гвардия" #NT!
 a_nd_sko_emirate_guard_desc: "Дисциплинированная пехота, набранная из гарнизонных сил эмиратов хауса, обученная удерживать городские стены и поддерживать порядок в своих владениях." #NT!
 a_nd_sko_jihad_horseman: "Джихад Всадник" #NT!
 a_nd_sko_jihad_horseman_desc: "Конные воины джихада Фулани, едущие с копьями и мечами под зеленым знаменем веры. Их заряды разбивают вражеские порядки на открытом поле." #NT!
 a_nd_sko_armored_horseman: "Бронированный всадник" #NT!
 a_nd_sko_armored_horseman_desc: "Тяжелая кавалерия фулани, облаченная в кольчуги и пластины, верхом на бронированных лошадях. Эти аристократические воины наносят сокрушительные удары, которым могут противостоять лишь немногие противники." #NT!
 a_nd_sko_jihad_levy_unit: "Джихад Леви" #NT!
 a_nd_sko_jihad_levy_unit_desc: "Массовая пехота, собранная из верующих по всему Халифату во времена священной войны, пылающая религиозным рвением и сражающаяся за защиту или расширение царства ислама." #NT!
 a_nd_sko_reformed_infantry: "Реформированная пехота" #NT!
 a_nd_sko_reformed_infantry_desc: "Модернизированные солдаты Халифата, оснащенные огнестрельным оружием и обученные реформированной тактике, отражают адаптацию государства Сокото к меняющемуся характеру войны." #NT!
 nd_sko_kano_dye_pit: "Кано Дай Пит" #NT!
 nd_sko_kano_dye_pit_desc: "Древние ямы, занимающиеся краской индиго в Кано, работали на протяжении веков, производя темно-синюю ткань, которая является визитной карточкой текстильного искусства хауса и основным экспортным товаром." #NT!
 nd_sko_cattle_camp: "Скотоводческий лагерь Фулани" #NT!
 nd_sko_cattle_camp_desc: "Управляемое пасторальное поселение, где пастухи фулани пасут свой скот, производя молоко, мясо, кожу и избыточное богатство, поддерживающее как кочевые, так и городские общины." #NT!
 nd_sko_birni_walls: "Стены Бирни" #NT!
 nd_sko_birni_walls_desc: "Массивные земляные валы и каменные укрепления, окружающие города-государства хауса, эти стены на протяжении веков защищали городское население и его богатство от набегов." #NT!
 nd_sko_ribat: "Рибат" #NT!
 nd_sko_ribat_desc: "Укрепленное приграничное поселение, сочетающее в себе военный гарнизон и исламскую школу, рибат служит одновременно оборонительным оплотом и центром распространения веры среди приграничного населения." #NT!
 nd_sko_cloth_manufactory: "Тканевая мануфактура" #NT!
 nd_sko_cloth_manufactory_desc: "Крупное текстильное производство, на котором работают ткачи, красильщики и портные для производства ткани в промышленных объемах для внутреннего потребления и экспорта за пределы Сахары." #NT!
 nd_sko_dye_pit_maintenance: "Операции на красильной яме" #NT!
 nd_sko_dye_pit_maintenance_desc: "Древние красильные ямы Кано перерабатывают сырой индиго в знаменитую темно-синюю ткань Хаусаленда, основной продукт транссахарской торговли." #NT!
 nd_sko_cattle_camp_maintenance: "Операции в лагере для скота" #NT!
 nd_sko_cattle_camp_maintenance_desc: "Пастухи фулани скармливают свой скот просом, производя скот для производства мяса, молока, кожи и избыточного богатства, которое поддерживает общины Сахеля." #NT!
 nd_sko_birni_maintenance: "Уход за стенами" #NT!
 nd_sko_birni_maintenance_desc: "Уход за стенами бирни требует регулярного пополнения запасов камня и строительных материалов для поддержания оборонительной целостности." #NT!
 nd_sko_ribat_maintenance: "Содержание Рибата" #NT!
 nd_sko_ribat_maintenance_desc: "Поддержание приграничного рибата требует камня для укреплений, оружия для гарнизона и бумаги для ученых, преподающих в его стенах." #NT!
 nd_sko_cloth_manufactory_maintenance: "Производственные операции" #NT!
 nd_sko_cloth_manufactory_maintenance_desc: "Фабрика красит и обрабатывает сыпучую ткань, превращая ее в изысканный текстиль для внутреннего использования и экспорта за границу." #NT!
 nd_sko_saharan_caravan: "Сахарская караванная торговля" #NT!
 nd_sko_saharan_caravan_desc: "Транссахарская караванная торговля доставляет продукты животноводства и меха на север через пустыню, а соль из огромных месторождений Сахары течет на юг, на рынки Хаусаленда." #NT!
 nd_sko_indigo_dyeing: "Процесс окрашивания индиго" #NT!
 nd_sko_indigo_dyeing_desc: "Специализированный процесс окрашивания индиго превращает необработанные красители в темно-синюю ткань, которая является визитной карточкой мастерства хауса и ценным экспортным товаром." #NT!
 nd_sko_courier_network: "Курьерская сеть" #NT!
 nd_sko_courier_network_desc: "Конная курьерская система, требующая постоянного снабжения лошадьми для поддержания быстрого сообщения между столицей и провинциальными эмиратами." #NT!
 levy_nd_sko_fulani_lancer: "Фулани Лансерс" #NT!
 levy_nd_sko_fulani_lancer_desc: "Легкая кавалерия, набранная из пасторальных общин Фулани, эти уланы — быстрые налетчики и разведчики, чье искусство верховой езды доминирует на лугах Сахеля." #NT!
 levy_nd_sko_emirate_guard: "Эмиратская гвардия" #NT!
 levy_nd_sko_emirate_guard_desc: "Дисциплинированная пехота, набранная из гарнизонных сил эмирата Хауса, обученная удерживать городские стены и поддерживать порядок." #NT!
 levy_nd_sko_jihad_levy: "Джихад Налоговые сборы" #NT!
 levy_nd_sko_jihad_levy_desc: "Массовая пехота, собранная из верующих по всему Халифату во время священной войны, движимая религиозным рвением по защите или расширению царства ислама." #NT!
 nd_sko_formed_tt: "Сокото было основано" #NT!
 nd_sko_path_a_tt: "Выберите Свет знаний" #NT!
 nd_sko_path_b_tt: "Выбрал знамя джихада" #NT!
 nd_sko_destiny: "Судьба Халифата" #NT!
 nd_sko_destiny_desc: "Был провозглашен Сокотоский халифат. Обеспечив стабильность, Повелитель правоверных теперь должен выбрать путь, который определит это новое государство для поколений." #NT!
 nd_sko_dest_scholars_path: "Ученые Тимбукту" #NT!
 nd_sko_dest_scholars_path_desc: "Расширьте интеллектуальное влияние Халифата на Тимбукту, величайший центр исламского образования в Западной Африке. Возьмите своих ученых, библиотеки и университеты под покровительство Сокото." #NT!
 nd_sko_dest_house_of_wisdom: "Дом Мудрости" #NT!
 nd_sko_dest_house_of_wisdom_desc: "Создайте сеть научных учреждений, способную конкурировать с любыми в мусульманском мире. Защитите древний центр обучения Дженне и развивайте институциональные основы Халифата посредством банковского дела и торговли." #NT!
 nd_sko_dest_beacon_of_learning: "Маяк обучения" #NT!
 nd_sko_dest_beacon_of_learning_desc: "Сделать Халифат Сокото интеллектуальной столицей Западной Африки. Используйте печатный станок для распространения знаний, достижения высочайшего престижа и развития Халифата, превосходящего его конкурентов." #NT!
 nd_sko_dest_jihad_path: "Падение Борну" #NT!
 nd_sko_dest_jihad_path_desc: "Завоюйте Нгазаргаму, древнюю столицу Борну, и приведите это конкурирующее исламское государство под знамя Халифата. Создайте мощную армию, достойную джихада." #NT!
 nd_sko_dest_sword_of_the_sahel: "Меч Сахеля" #NT!
 nd_sko_dest_sword_of_the_sahel_desc: "Расширьте границы веры на юг, в Йорубаленд. Захватите Ойо-Иле, великую столицу йоруба и ворота Илорина. Поддерживайте мощную постоянную армию для укрепления власти Халифата." #NT!
 nd_sko_dest_master_of_sudan: "Мастер Судана" #NT!
 nd_sko_dest_master_of_sudan_desc: "Доминируйте над всем Центральным Суданом, от высокогорья Адамава до лесов Бенина. Обладая непревзойденной по размеру армией и высочайшим престижем, Халифат стоит выше всей Западной Африки." #NT!
 nd_sko.6.t: "Судьба Халифата" #NT!
 nd_sko.6.d: "Халифат Сокото стоит на перепутье истории. Фундаменты заложены, эмиры назначены, суды учреждены, вера провозглашена. Но чем станет этот халифат? Предстоящая дорога ведет в неопределенное будущее, и выбор, который мы делаем сейчас, будет отражаться в поколениях. Повелитель правоверных должен решить: построим ли мы империю разума или меча?" #NT!
 nd_sko.6.a: "Наш путь задан" #NT!
 nd_sko.7.t: "Ученые Тимбукту" #NT!
 nd_sko.7.d: "Тимбукту, легендарный город Санкоре и его великая мечеть-университет, попали под наше влияние. На протяжении веков этот город был интеллектуальным сердцем Западной Африки, домом для тысяч рукописей, сотен ученых и традиций обучения, которые предшествовали поколениям нашего Халифата. Теперь его библиотеки и классы служат целям дана Фодио, а ученые Тимбукту переписываются с учеными Сокото в грандиозном обмене знаниями." #NT!
 nd_sko.7.a: "Пусть знания текут между нашими городами" #NT!
 nd_sko.8.t: "Дом Мудрости" #NT!
 nd_sko.8.d: "Научная сеть Халифата превратилась в нечто выдающееся. От Тимбукту до Дженне, от Кано до Сокото сеть медресе, библиотек и судов охватывает весь Сахель. Студенты приезжают из далеких стран, чтобы учиться у наших ученых, а репутация Халифата как ученого привлекает как торговцев, так и дипломатов.\n\nКак нам направить это интеллектуальное богатство?" #NT!
 nd_sko.8.a: "Щедро одаривайте ученых" #NT!
 nd_sko.8.b: "Распространить терпимость на всех Людей Книги" #NT!
 nd_sko.9.t: "Маяк обучения" #NT!
 nd_sko.9.d: "Халифат Сокото стал тем, о чем всегда мечтал дан Фодио: государством, где господствует знание, где печатный станок умножает слово Божье и идеи ученых, где высочайшее развитие Западной Африки поддерживает цивилизацию необычайной глубины. О величественных медресе Сокото говорят от Феса до Каира.\n\nКак нам пользоваться этим интеллектуальным авторитетом?" #NT!
 nd_sko.9.a: "Централизуйте управление знаниями" #NT!
 nd_sko.9.b: "Пусть реформы и инновации процветают свободно" #NT!
 nd_sko.10.t: "Падение Нгазаргаму" #NT!
 nd_sko.10.d: "Нгазаргаму, древняя столица империи Борну, пала под натиском всадников Халифата. На протяжении веков Борну выступал в качестве конкурирующего центра исламской власти в Центральном Судане, его большинство заявляли о своем происхождении от великой династии Сайфава, а его ученые оспаривали наши реформистские притязания. Теперь его стены разрушены, его армия рассеяна, а его территории открыты для веры, которую мы проповедуем. Джихад продвигается на восток." #NT!
 nd_sko.10.a: "Борну подчинится истинной вере" #NT!
 nd_sko.11.t: "Меч Сахеля" #NT!
 nd_sko.11.d: "Зеленое знамя Халифата реет над Ойо-Иле, некогда могущественной столицей империи Йоруба, и над Илорином, воротами между саванной и лесом. Джихад продвинул веру дальше, чем мог себе представить сам дан Фодио. Армии Халифата боятся от Нигера до Бенуэ.\n\nКак нам организовать наши вооруженные силы для предстоящих кампаний?" #NT!
 nd_sko.11.a: "Делайте упор на быструю мобилизацию и наступление." #NT!
 nd_sko.11.b: "Поднять массовые поборы с верующих" #NT!
 nd_sko.12.t: "Мастер Судана" #NT!
 nd_sko.12.d: "От высокогорья Адамава до лесов Бенина — Халифат Сокото господствует над всем Центральным Суданом. Ни одна сила в Западной Африке не может бросить вызов авторитету Повелителя правоверных. Всадники джихада патрулируют границы, простирающиеся на тысячу миль, а эмиры управляют мозаикой народов, объединенных под знаменем ислама.\n\nКак Халифат сможет сохранить эту обширную территорию?" #NT!
 nd_sko.12.a: "Через мир Сокото" #NT!
 nd_sko.12.b: "Через бесконечную священную войну" #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_scholarly_endowment: "Научный фонд" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_scholarly_endowment: "Щедрое финансирование халифатом медресе и библиотек привлекает ученых со всего мусульманского мира, расширяя дипломатические связи, хотя расходы на содержание этих учреждений ложатся на суд." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_people_of_the_book: "Люди Книги" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_people_of_the_book: "Халифат проявляет умеренную терпимость к христианам и евреям как людям Книги, признавая их защищенный статус в соответствии с исламским законом и способствуя социальной гармонии в различных эмиратах." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_caliphal_administration: "Халифская администрация" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_caliphal_administration: "Централизованная бюрократическая система, исходящая из Сокото, более тесно привязывает эмираты к столице, облегчая интеграцию завоеванных территорий, хотя поддержание административного аппарата требует значительных заимствований." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_reform_of_minds: "Реформа разума" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_reform_of_minds: "Дух интеллектуальных реформ, отстаиваемых Дэном Фодио, процветает, поощряя инновации и принятие новых идей, хотя растущий спрос городского населения на продукты питания создает нагрузку на сельскохозяйственное производство." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_rapid_mobilization: "Быстрая мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_rapid_mobilization: "Военная машина Халифата оптимизирована для быстрых наступательных кампаний: войска собираются и развертываются с поразительной скоростью, хотя поддержание захваченных укреплений напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_mass_levies: "Массовые сборы" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_mass_levies: "Верующие откликаются на призыв к оружию в огромных количествах, предоставляя дешевые подкрепления и ожидаемый размер армии, который запугивает соседние государства." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_pax_sokotana: "Пакс Сокотана" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_pax_sokotana: "Подавляющее военное превосходство Халифата позволяет ему диктовать условия с позиции силы, сокращая расходы на содержание своих армий и вызывая уважение за столом переговоров." #NT!
 STATIC_MODIFIER_NAME_nd_sko_dest_unending_jihad: "Бесконечный джихад" #NT!
 STATIC_MODIFIER_DESC_nd_sko_dest_unending_jihad: "Халифат ведет бесконечную священную войну, его армии закалены постоянными кампаниями. Утомление от войны быстро проходит, и сражения решаются быстро, хотя религиозная обязанность джихада делает формальное объявление войны вопросом богословского оправдания." #NT!
 nd_sko_grand_madrasa: "Гранд Медресе" #NT!
 nd_sko_grand_madrasa_desc: "Великолепный центр исламской науки, где студенты изучают Коран, юриспруденцию, астрономию и медицину под патронажем Халифата, интеллектуальной жемчужины Сахеля." #NT!
 nd_sko_madrasa_maintenance: "Операции медресе" #NT!
 nd_sko_madrasa_maintenance_desc: "Большому медресе необходим постоянный запас бумаги для рукописей, книг для библиотеки и пчелиного воска для свечей, освещающих учебные залы." #NT!
 nd_sko_ribat_al_nasr: "Рибат ан-Наср" #NT!
 nd_sko_ribat_al_nasr_desc: "Крепость Победы, великий военный оплот, сочетающий оборонительные традиции бирни с наступательными возможностями передового плацдарма, оборудованного для размещения гарнизона и проецирования силы на огромные расстояния." #NT!
 nd_sko_ribat_nasr_maintenance: "Крепостные операции" #NT!
 nd_sko_ribat_nasr_maintenance_desc: "Рибат ан-Насру требуется оружие для гарнизона, камень для стен, лошади для кавалерии и кожа для снаряжения и упряжи." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_sko_bureaucracy_authority: "Халифская бюрократия" #NT!
 AUTO_MODIFIER_DESC_nd_sko_bureaucracy_authority: "Халифат Сокото поддерживает постоянный административный аппарат, связывающий Саркин Мусулми с эмиратами: вазират, щелочные суды, джакады, сеть рибат и улемы Малики. Халиф может активировать институты, чтобы навести порядок в государстве джихада." #NT!
  
 sko_wazirate_bureaucracy: "Вазират Сокото" #NT!
 sko_wazirate_bureaucracy_desc: "Основанный Мухаммедом Белло (халифом 1817-1837 гг.), вазир служил главным министром и основным связующим звеном между Саркин Мусулми и эмиратами. Гидадо дан Лайма, первый визир Белло, задал образец: образованный ученый-бюрократ из Торонкавы, который вел корреспонденцию эмиратов, передавал указы халифа и выступал посредником в межэмиратских спорах. Действующий вазират централизует власть; забытый вариант позволяет эмиру игнорировать приказ Сокото." #NT!
  
 sko_alkali_courts_bureaucracy: "Щелочная судебная система" #NT!
 sko_alkali_courts_bureaucracy_desc: "В каждом эмирате существовали специальные суды (кади), обученные маликитскому фикху, доминирующей школе западноафриканской исламской юриспруденции. Судьи применяли шариат в вопросах брака, наследства, контрактов и преступлений, заменяя обычное право хауса (гаргаджия) порядка, существовавшего до джихада. Главный алкал в Сокото служил апелляционной инстанцией для всего халифата. Предсказуемое исламское правосудие удовлетворило духовенство и дало крестьянам возможность противостоять произволу дворянской власти, но лишило старую знать хауса их обычной юрисдикции." #NT!
  
 sko_jakada_network_bureaucracy: "Сеть трибьютов Джакада" #NT!
 sko_jakada_network_bureaucracy_desc: "Джакада были постоянными агентами и сменяющимися посланниками халифа, дислоцированными в столицах каждого эмирата, которым было поручено собирать земельный налог курдин каса, плату за вступление курдин сараута с новых эмиров, рабов и зерно для отправки в Сокото. Созданные по образцу амиля Аббасидов и курьерской системы хауса до джихада, они сообщали о делах эмирата и могли требовать вмешательства халифа. Будучи лояльными, они сохраняли честность счетов эмирата; будучи коррумпированными, они обогащались за счет трона." #NT!
  
 sko_toronkawa_emirates_bureaucracy: "Орден Эмирата Торонкава" #NT!
 sko_toronkawa_emirates_bureaucracy_desc: "В эмиратах Сокото были не назначенные должности, а наследственные линии: каждая тута (флаг) была пожалована клану фульбе: преимущественно торонкава, тородбе сенегальского происхождения - фута-торо, от которого произошла сама семья Фодио. Суллубава владела Кано, Сунгава владела Даурой, Маллава владела Катагумом. Это привело к созданию сплоченного аристократического порядка фульбе по всему халифату, повышающего клановые сборы по требованию, но лишило простолюдинов хауса доступа к высшим должностям и посеяло недовольство, которое разожгло восстание Хадеджиа в 1817 году." #NT!
  
 sko_ribat_network_bureaucracy: "Пограничная сеть Рибат" #NT!
 sko_ribat_network_bureaucracy_desc: "Рибат (укрепленное приграничное поселение, объединяющее мечеть, медресе и гарнизон) был основным институтом государства джихада. Усул ас-Сияса Белло прямо приказал построить рибаты вдоль границ с Борну, языческими убежищами хауса в Маради и южными немусульманскими народами. В каждом из них располагался постоянный ученый, гарнизон мухаджирунов (солдат-беженцев) и школа для приграничного населения. Сеть служила одновременно оборонительным поясом, миссионерским аппаратом и двигателем медленной исламизации." #NT!
  
 sko_ulama_council_bureaucracy: "Совет улемов Малики" #NT!
 sko_ulama_council_bureaucracy_desc: "Сокото было государством, основанным учеными. Малламы из круга дана Фодио и их преемники (наследники Абдуллахи в Гванду, Белло в Сокото и алкаши, которых они обучали) образовали объединение юристов Малики, чьи фетвы регулировали рыночную практику, захват рабов и богословские споры. Баян Вуджуб аль-Хиджра (1806 г.), Китаб аль-Фарк (1807 г.) и Дия аль-Хуккам (1812 г.) представляют собой текстовые записи. Улемы дали халифату его легитимность и его самую резкую критику; их раскол стал следствием восстания Хадеджиа и махдистских волнений 1840-х годов." #NT!
