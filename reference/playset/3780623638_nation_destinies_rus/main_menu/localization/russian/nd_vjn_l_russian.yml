l_russian:
  
  # ============================================================ 
  # Variable tooltips 
  # ============================================================ 
 nd_vjn_formed_tt: "Была образована Карнатская империя." #NT!
 nd_vjn_path_a_tt: "Судьба Карната: линия Пампа-Вирупакша." #NT!
 nd_vjn_path_b_tt: "Карната Судьба: суд Тулувы." #NT!
  
  # ============================================================ 
  # Formation event 
  # ============================================================ 
 nd_vjn.1.t: "Поднимается знамя кабана" #NT!
 nd_vjn.1.d: "С гранитных хребтов над Тунгабхадрой императорские гопурамы Виджаянагара поднимают свои многоярусные короны над городом с полумиллионным населением. Трон Хампи ваш: Карната Раджья восстановлен, дхарма защищена, южные народы собрались под шафрановой Варахой. Но ваш суд должен выбрать свой характер. Переход Салува-Тулува показал, что империей можно управлять двумя голосами, а ритуалы, которые вы предпочитаете, определят, какой станет ваша династия.\n\nБудете ли вы возвысить империю как великого покровителя шиваитских храмов и обучения брахманов, закрепляя легитимность в богине Пампа-Вирупакше и Шрингери матхе, или вы пойдете по пути Кришнадева Рая: космополитического двора поэтов на телугу, Преданность вайшнавам, португальские торговцы лошадьми и персидские посланники, империя, чья дхарма распространяется через торговлю?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_vjn.1.a: "Линия Пампа-Вирупакша: храм, резервуар и санкция брамина" #NT!
 nd_vjn.1.b: "Двор Тулувы: стихи на телугу, преданность вайшнавам, внешняя торговля" #NT!
  
  # ============================================================ 
  # Formation timed modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_vjn_pampa_virupaksha_line: "Линия Пампа-Вирупакша" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_pampa_virupaksha_line: "Империя основана на храмовых ритуалах Шайвы и матхе Шрингери. Разрешение брахманов и монументальное строительство храмов обращают южные народы в другую веру и собирают огромную рабочую силу для имперского войска." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_tuluva_court: "Суд Тулувы" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_tuluva_court: "Преданность вайшнавам, покровительство литературе на телугу и космополитический двор Кришнадева Рая. Империя Карната торгует с португальскими, персидскими и арабскими купцами и приветствует посланников со всего Индийского океана." #NT!
  
  # ============================================================ 
  # Advance event 2: Krishnadeva Raya's coronation 
  # ============================================================ 
 nd_vjn.2.t: "Коронация Кришнадевы Рая" #NT!
 nd_vjn.2.d: "Третий сын Тулувы Нараса Наяка занял трон в Хампи. Кришнадева (шахматный мастер, полиглот, поэт Амуктамальяды и покровитель Алласани Педданы, ученый-воин и самый притягательный правитель на южной памяти) коронован в расширенном храме Вирупакши в 1509 году. Его правление представляет собой два лица: Кришнадева, король-философ, который сочинял стихи на телугу о государственном управлении, или Кришнадева, завоеватель диг-виджая, который сломил Гаджапати в Кондавиду, и смирил Биджапур в Райчуре.\n\nКак ваш двор запомнит его?" #NT!
 nd_vjn.2.a: "Как учёный-император: созвать Бхувана Виджая." #NT!
 nd_vjn.2.b: "Как завоеватель диг-виджая: скачите против доаба" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_amuktamalyada_reign: "Царствование Амуктамальяды" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_amuktamalyada_reign: "Стихи и покровительство императора процветают на телугу, санскрите, тамильском и каннада. Суд — путеводная звезда дравидийской письменности." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_dig_vijaya_campaign: "Кампания Диг-Виджая" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dig_vijaya_campaign: "Армии Карнаты прорываются через доаб Кришна-Тунгабхадра и прорываются через границу Гаджапати. Престиж империи распространяется вместе с ее знаменами." #NT!
  
  # ============================================================ 
  # Advance event 3: Portuguese horse trade 
  # ============================================================ 
 nd_vjn.3.t: "Лошади из моря" #NT!
 nd_vjn.3.d: "Южный климат ломает лошадей; империя импортирует своих кавалерийских коней. Захват Португальцами Гоа в 1510 году изменил торговлю. Аравийские и персидские боевые кони, когда-то являющиеся источником жизненной силы кавалерии Бахмани, теперь могут течь через Гоа под постоянной португальской фабрикой: надежные, запечатанные и зависящие от доброй воли Estado da India. Или империя может напрямую вести дела с торговыми домами Ормузи и Маппилла в Бхаткале и Хоннаваре, платя более низкие цены за прибывающие грузы по прибытии, при этом факторы Персидского залива получают свою прибыль в виде специй и селитры, а не португальского серебра.\n\nПорты Конкан находятся в распоряжении империи. Выбор в том, чьих торговцев лошадьми они примут." #NT!
 nd_vjn.3.a: "Португальский фактор в Гоа. Постоянные поставки по договору." #NT!
 nd_vjn.3.b: "Дома Хормузи в Бхаткале. Лошади приходят, и иностранный гарнизон тоже." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_goa_partnership: "Гоа Партнерство" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_goa_partnership: "Португальские факторы в Гоа поставляют арабских и персидских боевых коней императорской кавалерии по постоянному контракту. Снабжение надежное, кавалерия укомплектована, а португальцы пользуются императорской благосклонностью." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_hormuzi_merchants: "Хормузские торговцы" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_hormuzi_merchants: "Торговые дома Хормузи и Маппилла доставляют персидских и арабских лошадей прямо в Бхаткал и Хоннавар. Кавалерия приобретается по более низкой цене и без португальского влияния, но индуистский двор должен научиться приспосабливаться к мусульманским торговым принцам конкани, и брахманы императорского собрания ворчат." #NT!
  
  # ============================================================ 
  # Advance event 4: Amara-Nayaka system 
  # ============================================================ 
 nd_vjn.4.t: "Кодифицированная система Амара-Наяка" #NT!
 nd_vjn.4.d: "По всей империи императорский двор формализует систему владения амарамами: территориальные губернаторские должности предоставляются командирам наяка в обмен на присягу на военную службу. Каждая амаранаяка имеет определенное количество кавалерии, пехоты, слонов и фортов; собирает доходы от крестьян, ремесленников и торговцев своей территории; и передает часть в императорскую казну. Система обещает огромную постоянную армию по призыву династии. Он также создает десятки военных лордов с собственными армиями.\n\nСуд должен решить, насколько крепко их свяжут имперские цепи." #NT!
 nd_vjn.4.a: "Строго проверяйте их: налоговые регистры, закрытые квоты, ротацию проводок." #NT!
 nd_vjn.4.b: "Щедро вознаградите их: сборы в обмен на автономию" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_loyal_nayakas: "Проверенные наяки" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_loyal_nayakas: "Амара-наяки служат по запечатанным спискам и поочередно. Корона держит их на крепком привязи, а имперская казна наполняется." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_imperial_levy: "Имперская Наяка Леви" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_imperial_levy: "Амаранаяки взимают огромные сборы в обмен на свободу рук в своих амарамах. Знамена империи развеваются гуще, чем когда-либо, хотя вельможи растут." #NT!
  
  # ============================================================ 
  # Advance event 5: Lessons of Talikota 
  # ============================================================ 
 nd_vjn.5.t: "Тень Таликоты предотвращена" #NT!
 nd_vjn.5.d: "Коалиция султаната из четырех держав собралась к северу от Кришны, как это было в 1565 году: Биджапур, Ахмаднагар, Голконда и Бидар объединили свою кавалерию против империи Карната. В нашем мире в ту пятницу в Таликоте братья Гилани, командующие мусульманскими полками Рама Рая, дезертировали посреди боя, и имперская линия рухнула. Регент империи был обезглавлен; Хампи был уволен на пять месяцев и так и не восстановился.\n\nВ наше время ваш двор прочитал эту историю до того, как это могло произойти. Суд проводит чистки, тренировки и реорганизацию хозяина. Манят два пути реформ: единая командная структура под руководством одного фельдмаршала или тщательная очистка придворных группировок и династических соперников." #NT!
 nd_vjn.5.a: "Создать единое полевое командование и провести учения по франкскому образцу." #NT!
 nd_vjn.5.b: "Очистить фракции; никакого Гиланиса снова у нас в горле" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_unified_command: "Объединенное Имперское Командование" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_unified_command: "Имперское войско сражается одной колонной под командованием одного сенапати, обученного по континентальному образцу с использованием массированной артиллерии. Катастрофы разделенного командования не повторяются." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_purified_court: "Очищенный суд" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_purified_court: "Придворные фракции распускаются, иностранные командиры проверяются на лояльность, а храмовое учреждение вновь оказывается в центре имперского ритуала. Империя идеологически едина." #NT!
  
  # ============================================================ 
  # Advance event 6: Bhuvana Vijaya / Ashtadiggajas 
  # ============================================================ 
 nd_vjn.6.t: "Зал завоеваний мира" #NT!
 nd_vjn.6.d: "В новом зале с колоннами, называемом Бхувана Виджая (Зал завоеваний мира), император созывает литературный двор. Две фракции ждут его покровительства. Аштадиггаджи, восемь «слонов направлений», говорят на телугу: Алласани Педдана — андхра-кавита-питамаха, Нанди Тхиммана из Париджатапахаранама, Пингали Сурана из двуязычного Рагхава-Пандавияма, Тенали Рамакришна — остроумный. Рядом с ними стоят санскритские кавья-пандиты из круга Вьяса-Тиртхи, ученые Мадхва-матха и двайта-веданты, хранители общеиндийского классического учения, сторонники санскритского суда, доступного каждому брахману от Кашмира до Шри-Ланки.\n\nКошелёк императора может поднять одну школу до должности суда. Другой сохранит свою честь, но потеряет первое право на имперское покровительство." #NT!
 nd_vjn.6.a: "Телугу теперь является языком дхармы. Аштадиггаджи в резиденции." #NT!
 nd_vjn.6.b: "Вьяса Тиртха справа от нас. Санскритская кавья — это голос империи." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_telugu_bhuvana: "Телугу Бхувана" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_telugu_bhuvana: "Аштадиггаджи в резиденции в Зале завоеваний мира. Народный телугу становится языком империи: его используют, преподают и читают в судах от Пуликата до Кришны. Литературная энергия континента течет по каналам Карнаты." #NT!
 STATIC_MODIFIER_NAME_nd_vjn_sanskrit_kavya: "Санскрит Кавья" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_sanskrit_kavya: "Двайта-матха Вьяса Тиртхи поднимается при дворе. Паниндийская классическая наука задает тон имперскому дискурсу: каждый брамин на севере и юге признает Карнату императором дхармы, а хроники империи читаются на одном и том же санскрите от Кашмира до Ланки." #NT!
  
  # ============================================================ 
  # Advances: Age 1 
  # ============================================================ 
 nd_vjn_sangama_foundation: "Фонд Сангама" #NT!
 nd_vjn_sangama_foundation_desc: "Харихара и Букка, пленники туглуков, ставшие основателями, воздвигли Виджаянагару на южном берегу Тунгабхадры в 1336 году как индуистский оплот против южного наступления султаната. Династия берет свою легитимность от шиваитского матха в Шрингери и богини Пампы из Хампи." #NT!
 nd_vjn_kuravar_levies: "Кураварские сборы" #NT!
 nd_vjn_kuravar_levies_desc: "Горные народы Западных и Восточных Гат (куравасы, ируласы и более обширные лесные касты) предоставляют имперскому войску стрелков-лучников и копьеносцев. Они знают джунгли и горные тропы; Имперская кавалерия проезжает по территории, которую они уже нанесли на карту." #NT!
 nd_vjn_vidyaranya_sanction: "Санкция Видьяраньи" #NT!
 nd_vjn_vidyaranya_sanction_desc: "Видьяранья, понтифик адвайта-ведантизма Шрингери Шарада Питам, благословляет фонд Сангамы и дает династии духовную санкцию. Матха предоставляет своих ученых-духовенцев императорскому двору; Империя рождается под рукой мудреца." #NT!
 nd_vjn_tank_irrigation: "Резервуарное орошение" #NT!
 nd_vjn_tank_irrigation_desc: "Долина Тунгабхадра пронизана кере: земляными резервуарами, питаемыми аникутскими водозаборными плотинами через реку. Один только канал Хирия орошает Хампи, Камалапуру и императорские поместья. Сельское хозяйство Карнаты — это праздник, где одни только дожди могли бы привести к голоду." #NT!
 nd_vjn_dravidian_architecture: "Дравидийская храмовая архитектура" #NT!
 nd_vjn_dravidian_architecture_desc: "Пирамидальные гопурамы, многоярусные мантапы, скульптурные колонны яли, монолитные Нанди, улицы процессий, примыкающие к святилищу: школа Виджаянагара синтезирует наследие Чола, Паллавы, Хойсалы и Пандья в единую имперскую идиому." #NT!
 nd_vjn_bhakti_traditions: "Традиции бхакти-предания" #NT!
 nd_vjn_bhakti_traditions_desc: "Альвары и Наянары пели молитвы на тамильском языке; Харидасы теперь поют ее на каннада и телугу. Пурандарадаса, Канакадаса и Вьясараджа объединяют южные народы в общий религиозный язык, который уходит корнями глубже, чем династия." #NT!
  
  # ============================================================ 
  # Advances: Age 2 
  # ============================================================ 
 nd_vjn_devaraya_court: "Суд Деварайи II" #NT!
 nd_vjn_devaraya_court_desc: "Деварая II, по прозвищу Гаджабетегара (охотник на слонов), принимает в Хампи посольство Абдула Раззака из Тимурида Герата (1442 г.) и купца Никколо де Конти из Венеции. Дипломатическая сфера действия суда теперь охватывает Персию, Декан Бахмани, Индийский океан и Средиземноморье." #NT!
 nd_vjn_amara_nayaka_system: "Система Амара-Наяка" #NT!
 nd_vjn_amara_nayaka_system_desc: "Территориальные губернаторства, называемые амарамы, предоставляются командирам наяка в обмен на присягу на военную службу: кавалерию, пехоту, слонов, форты и часть доходов. Империя собирает армии посредством феодально-военной бюрократии, уникальной для Карнаты." #NT!
 nd_vjn_saluva_consolidation: "Объединение Салувы" #NT!
 nd_vjn_saluva_consolidation_desc: "После хаоса поздней преемственности Сангамы Салува Нарасимха захватывает трон в 1485 году, восстанавливает имперскую казну и реформирует армию по образцу Вир Вир Нарасимхи. Империя централизуется." #NT!
 nd_vjn_swarnakara_guilds: "Сварнакара Бронзовые Гильдии" #NT!
 nd_vjn_swarnakara_guilds_desc: "Сварнакара (южные ювелиры) продолжают традицию Чола по выплавляемым моделям, которая производила бронзу Натараджа и Тирупати. Императорские мастерские отливают бронзовые процессионные иконы, ритуальные лампы, аксессуары для мечей и слоновьи доспехи для храмов и армий империи." #NT!
 nd_vjn_cosmopolitan_court: "Космополитический суд" #NT!
 nd_vjn_cosmopolitan_court_desc: "Персы, арабы, итальянцы, португальцы и тибетцы проходят через ворота Бхима в Хампи. При дворе говорят на телугу, санскрите и персидском языке; имперский реестр ведется в четырех алфавитах. Империя Карната — самая многоязычная индуистская держава на земле." #NT!
 nd_vjn_imperial_elephant_corps: "Императорский слоновий корпус" #NT!
 nd_vjn_imperial_elephant_corps_desc: "Империя держит тысячи боевых слонов в конюшнях Хампи, Пенуконды и Анегонди. Бронированные хауда, командиры паланкинов и каста погонщиков потомственных погонщиков слонов поддерживают традицию гаджапати, которую империя Карната носит как свою собственную." #NT!
  
  # ============================================================ 
  # Advances: Age 3 
  # ============================================================ 
 nd_vjn_krishnadeva_coronation: "Коронация Кришнадевы Рая" #NT!
 nd_vjn_krishnadeva_coronation_desc: "Третий сын Тулувы Нараса Наяка, родившийся в 1471 году, коронуется в Хампи в 1509 году. Кришнадева, солдат, ученый, государственный деятель, полиглот, поэт Амуктамальяды, будет править двадцать лет и приведет империю к ее абсолютному зениту." #NT!
 nd_vjn_ashtadiggajas: "Аштадиггаджи" #NT!
 nd_vjn_ashtadiggajas_desc: "Восемь «слонов направлений» заполняют императорский Бхувана Виджая (Зал завоеваний мира). Алласани Педдана, Нанди Тиммана, Тенали Рамакришна, Пингали Сурана и их коллеги возводят литературу на телугу до золотого века и превращают Хампи в Афины юга." #NT!
 nd_vjn_arabian_horse_trade: "Торговля лошадьми в Гоа" #NT!
 nd_vjn_arabian_horse_trade_desc: "Захват Португальцами Гоа в 1510 году изменил направление арабской и персидской торговли лошадьми через союзные с Карнатой факторы. Тяжелая кавалерия империи, которой долгое время мешал южный климат, наконец-то в больших масштабах оседлала импортированных арабов." #NT!
 nd_vjn_coastal_emporia: "Прибрежная Эмпория" #NT!
 nd_vjn_coastal_emporia_desc: "Бхаткал, Хонавар, Мангалор, Кочин, Коллам, Пуликат, Масулипатнам: империя Карната контролирует южные побережья как со стороны Малабара, так и со стороны Коромандела. Пряности вытекают, лошади и серебро вливаются." #NT!
 nd_vjn_dig_vijaya_doctrine: "Доктрина Диг-Виджая" #NT!
 nd_vjn_dig_vijaya_doctrine_desc: "Классическая индуистская завоевательная кампания во всех направлениях (диг-виджая) была переформулирована при Кришнадеве как доктрина быстро марширующих колонн, разрушения фортов с помощью окопных пушек и систематического унижения феодальных дворов." #NT!
 nd_vjn_strategic_diplomacy: "Стратегическая дипломатия" #NT!
 nd_vjn_strategic_diplomacy_desc: "Империя никогда не воюет со всеми султанатами одновременно. Биджапур унижен, а Ахмаднагар примирился; За Голкондой ухаживают, а за Бераром издеваются. Дипломатический инстинкт Кришнадевы удерживает коалицию четырех держав от формирования в течение целого поколения." #NT!
  
  # ============================================================ 
  # Advances: Age 4 
  # ============================================================ 
 nd_vjn_gajadhwaja_corps: "Слоновий корпус Гаджадхваджи" #NT!
 nd_vjn_gajadhwaja_corps_desc: "Под гаджадваджей (знаменем слона) императорский корпус боевых слонов реорганизуется в постоянные полки. Хауда защищены от огнестрельного оружия; погонщиков тренируют с детства; Карната Гаджасена становится самой грозной силой слонов на субконтиненте." #NT!
 nd_vjn_aravidu_restoration: "Реставрация Аравиду" #NT!
 nd_vjn_aravidu_restoration_desc: "Династия Аравиду под руководством Тирумалы и его преемников восстанавливает империю из южных столиц (Пенуконда, Чандрагири, Веллор) и возвращает доаб. Карната Раджья продолжает существовать там, где в нашей временной шкале она упала." #NT!
 nd_vjn_persian_factors: "Персидские и арабские факторы" #NT!
 nd_vjn_persian_factors_desc: "Имперские торговые агенты из Ормуза, Адена и Маската открывают счетные палаты в портовых городах Карнаты. Экспорт специй империи течет на север через персидские торговые сети; Импорт лошадей и серебра возвращается." #NT!
 nd_vjn_lessons_of_talikota: "Уроки Таликоты" #NT!
 nd_vjn_lessons_of_talikota_desc: "Независимо от того, удалось ли их избежать или пережить, уроки равнины Таликота усваиваются: никогда не было разделения командования; никогда не доверяйте капитанам-наемникам дольше, чем за последний оплаченный им месяц; всегда резервируйте силы для перегруппировки; всегда знайте посланников противника перед битвой." #NT!
 nd_vjn_pluralist_patronage: "Плюралистический патронаж" #NT!
 nd_vjn_pluralist_patronage_desc: "Мадхва-матхи в Удупи, понтифики Шрингери-Адваита, Вирашаива-маты, джайнские басти и вайшнавские храмы в Тирупати и Шрирангаме — все они получают императорское пожертвование. Империя Карната покровительствует каждому направлению индуизма, не принуждая ни одно из них доминировать." #NT!
 nd_vjn_telugu_court_language: "Телугу как язык императорского двора" #NT!
 nd_vjn_telugu_court_language_desc: "Наследие Кришнадевы Амуктамальяда ставит телугу выше санскрита и каннады как язык имперской администрации. Надписи, гранты и придворные эпосы теперь выполняются четырьмя сценариями; дравидийские народы своими собственными буквами связаны с имперским видением." #NT!
  
  # ============================================================ 
  # Advances: Age 5 
  # ============================================================ 
 nd_vjn_nayaka_reincorporation: "Реинкорпорация королевств Наяка" #NT!
 nd_vjn_nayaka_reincorporation_desc: "Мадурай под властью наяков Мадурая, Танджавур под властью наяков Танджавура, Джинджи, Майсура, Иккери: отколовшиеся княжества наяка после краха Таликоты возвращаются под прямую имперскую власть. Карната Раджья остается целой." #NT!
 nd_vjn_imperial_treasury: "Императорское казначейство" #NT!
 nd_vjn_imperial_treasury_desc: "Фискальная реформа Карнаты объединяет многочисленные региональные системы доходов в единую имперскую казну в Хампи с вспомогательными казначействами в Пенуконде и Мадурае. Оценка доходов регламентирована; излишек финансирует имперскую монументальную программу." #NT!
 nd_vjn_coromandel_textiles: "Коромандельские текстильные мануфактуры" #NT!
 nd_vjn_coromandel_textiles_desc: "Мадрас, Пуликат, Масулипатнам, Пондичерри, Садрас: текстильные мануфактуры побережья Коромандела производят лучший окрашенный хлопок в мире раннего Нового времени. Ткань Карната одевает Персию, Аравию, Острова пряностей и, все чаще, Европу." #NT!
 nd_vjn_dravidian_naval_doctrine: "Дравидийская военно-морская доктрина" #NT!
 nd_vjn_dravidian_naval_doctrine_desc: "Имперские эскадры как на Малабарском, так и на Короманделском побережьях придерживаются карнатской военно-морской доктрины: мелкосидящие фрегаты для муссонных вод в сочетании с тяжелыми кораблями европейского типа, купленными в Гоа или построенными на верфях Кочин и Пуликат." #NT!
  
  # ============================================================ 
  # Advances: Age 6 
  # ============================================================ 
 nd_vjn_karnata_renaissance: "Карнатский Ренессанс" #NT!
 nd_vjn_karnata_renaissance_desc: "Современный телугу под властью Гуразада Аппарао, современная каннада под властью предшественников Кувемпу, современный тамильский язык под властью предшественников Субрамании Бхарати, современный малаялам под властью наследников Эжутахана: дравидийские языки вместе вступают в эпоху печати, сплавленные под постоянным покровительством императорского двора всем четырем." #NT!
 nd_vjn_industrial_coromandel: "Индустриальный Коромандел" #NT!
 nd_vjn_industrial_coromandel_desc: "Паровые хлопчатобумажные фабрики в Мадрасе и Мадурае, механизированные бронзолитейные заводы в Салеме и чайные плантации в Нилгири переводят имперскую экономику в индустриальную эпоху, сохраняя при этом сварнакара и гильдии ткачей в качестве партнеров квалифицированной рабочей силы." #NT!
 nd_vjn_dravidian_cabinet: "Дравидийский кабинет" #NT!
 nd_vjn_dravidian_cabinet_desc: "Современное кабинетное правительство ведет свою деятельность на телугу, тамильском, каннада и малаялам: четырехязычном имперском аппарате, который ни одной европейской империи так и не удалось вытеснить." #NT!
 nd_vjn_imperial_conscription: "Имперский призыв" #NT!
 nd_vjn_imperial_conscription_desc: "Рекруты амара-наяка реформируются под единым имперским командованием: стандартизированные полки, обученные по-франкски, экипированные из имперских арсеналов, набираемые по лотерее из четырехязычных округов. Армия Карнаты модернизируется, не теряя при этом своих территориальных корней." #NT!
  
  # ============================================================ 
  # Custom units 
  # ============================================================ 
 a_nd_vjn_kuravar_archers: "Кураварские лучники" #NT!
 a_nd_vjn_kuravar_archers_desc: "Застрельщики горцев из Западных и Восточных Гат. Легкие в броне, мобильные и прекрасно себя чувствующие в джунглях и на холмистой местности, кураварские лучники прикрывают и атакуют далеко впереди имперской кавалерии." #NT!
 a_nd_vjn_arabian_warhorse: "Императорская арабская лошадь" #NT!
 a_nd_vjn_arabian_warhorse_desc: "Тяжелая кавалерия на арабских и персидских боевых лошадях, импортированных через Гоа. Характерное ударное оружие империи Карната при династиях Тулува и Аравиду: быстрое, дисциплинированное и противовес султанатской кавалерии." #NT!
 a_nd_vjn_imperial_war_elephant: "Боевой слон Гаджадхваджа" #NT!
 a_nd_vjn_imperial_war_elephant_desc: "Постоянные полки бронированных слонов под имперским знаменем гаджадхваджи. Погонщики тренировались с детства; хауда, усиленные против огнестрельного оружия; слон-знамя юга." #NT!
  
  # ============================================================ 
  # Custom levies 
  # ============================================================ 
 levy_nd_vjn_kuravar_archers: "Куравар Арчер Леви" #NT!
 levy_nd_vjn_kuravar_archers_desc: "Наем Куравара и лучников лесной касты из южной горной страны." #NT!
  
  # ============================================================ 
  # Custom buildings 
  # ============================================================ 
 nd_vjn_dravidian_temple_complex: "Дравидийский храмовый комплекс" #NT!
 nd_vjn_dravidian_temple_complex_desc: "Императорский храмовый комплекс шайва-вайшнавов с монументальными гопурамами, мантапами с колоннами, скульптурными колоннами яли и священным резервуаром. Стиль Хампи (Виттала, Хазара Рама, Вирупакша) экспортировался по всей империи." #NT!
 nd_vjn_temple_maintenance: "Храмовое облечение" #NT!
 nd_vjn_temple_maintenance_desc: "Императорское пожертвование для ежедневного ритуала храма: керамические сосуды, ремонт каменной кладки, пчелиный воск для ламп и благовония для святилища." #NT!
  
 nd_vjn_amara_nayaka_estate: "Амара-Наяка Эстейт" #NT!
 nd_vjn_amara_nayaka_estate_desc: "Укрепленная поместная резиденция амара-наяки: военного лорда, владеющего территорией в обмен на кавалерию, пехоту, слонов и форты. Костяк военной организации Карнаты." #NT!
 nd_vjn_nayaka_maintenance: "Учреждение Наяка" #NT!
 nd_vjn_nayaka_maintenance_desc: "Обеспечение численности войск амаранаяки: боевых коней, вооружения, скота для свиты и пайков, ткани для обмундирования и палаток." #NT!
  
 nd_vjn_tungabhadra_anicut: "Тунгабхадра Аникут" #NT!
 nd_vjn_tungabhadra_anicut_desc: "Земляной резервуар, питаемый аникутской водоотводной плотиной. Модель канала Хирия: муссонные потоки попадают в водохранилища, каналы, питающие рисовые поля и фруктовые сады. Императорский сельскохозяйственный фонд." #NT!
 nd_vjn_anicut_maintenance: "Содержание Аникута" #NT!
 nd_vjn_anicut_maintenance_desc: "Каменная облицовка водозаборной дамбы, деревянные шлюзовые ворота и сезонный ремонт кладки после муссонного наводнения." #NT!
  
 nd_vjn_bhuvana_vijaya: "Бхувана Виджая" #NT!
 nd_vjn_bhuvana_vijaya_desc: "Зал завоеваний мира. Императорский зал с колоннами, в котором размещается двор поэтов (Аштадиггаджи) и литературные академии на телугу, санскрите, каннада и тамильском языке. Письменный суд Карнаты." #NT!
 nd_vjn_court_maintenance: "Императорский покровительство" #NT!
 nd_vjn_court_maintenance_desc: "Императорский дар Литературной академии: бумага для рукописей, книги для императорской библиотеки, тонкая ткань для придворных мантий и благовония для торжественных собраний." #NT!
  
 nd_vjn_swarnakara_workshop: "Мастерская Сварнакары" #NT!
 nd_vjn_swarnakara_workshop_desc: "Мастерская гильдии ювелиров и бронзолитейщиков продолжает традицию Чола по выплавляемым моделям. Процессионные иконы, ритуальные лампы, украшения и аксессуары для мечей поступают из мастерских штата Карната через Индийский океан." #NT!
 nd_vjn_bronze_casting: "Литье по выплавляемым моделям бронзы" #NT!
 nd_vjn_bronze_casting_desc: "Медь и олово сплавлялись методом выплавки в инструменты, приспособления и ритуальную посуду. Дравидийский металлургический знак." #NT!
 nd_vjn_chola_bronzework_tradition: "Традиция Чола из бронзы" #NT!
 nd_vjn_chola_bronzework_tradition_desc: "Традиция Чола по выплавляемым моделям, по которой производились бронзы Натараджа и Тирупати, сохранилась в императорских мастерских сварнакара. Иконы процессий, королевские украшения и ритуальные лампы теперь перетекают из мастерских Карнаты во дворы и храмы по всему Индийскому океану." #NT!
 nd_vjn_pulicat_emporia: "Пуликат Эмпория" #NT!
 nd_vjn_pulicat_emporia_desc: "Мадрас, Пуликат, Масулипатнам, Садрас, Пондичерри: торговые центры побережья Коромандела обслуживают имперскую торговлю пряностями и текстилем. Имперские факторы ведут переговоры с европейскими торговыми компаниями на условиях Карнаты." #NT!
 nd_vjn_imperial_cannon_doctrine: "Имперская пушечная доктрина" #NT!
 nd_vjn_imperial_cannon_doctrine_desc: "Мастерские сварнакара реорганизуются в имперские пушечно-литейные заводы, отливающие бронзовые и железные полевые орудия для армии Карнаты. Дравидийская металлургическая традиция превращает свое мастерство из храмового колокола в осадное орудие." #NT!
 nd_vjn_modernized_garrisons: "Модернизированные гарнизоны Наяка" #NT!
 nd_vjn_modernized_garrisons_desc: "Квоты на войска Амара-наяки модернизируются: огнестрельное оружие вместо мечей и луков, тренировочная стрельба, стандартизированная униформа. Феодально-военное сословие становится современным гарнизоном, не теряя при этом своего территориального характера." #NT!
 nd_vjn_pulicat_factory: "Фабрика Пуликат" #NT!
 nd_vjn_pulicat_factory_desc: "Карната прибрежный торговый фабрично-складской комплекс. Склады, таможенные посты, помещения фабрик и причальные погрузочные доки для коромандельской торговли хлопком, индиго и специями." #NT!
 nd_vjn_pulicat_maintenance: "Заводские операции" #NT!
 nd_vjn_pulicat_maintenance_desc: "Содержание складов фабрики, красильных чанов и бухгалтерии: тюки ткани, глиняная тара, образцы тонкого сукна для покупателей, благовония для приемного зала фабрики." #NT!
 nd_vjn_chola_bronzework: "Чола Бронзовая работа" #NT!
 nd_vjn_chola_bronzework_desc: "Премиальное литье из бронзы по выплавляемым моделям: крестные иконы, ювелирные украшения и обрядовая посуда. Результаты гильдий сварнакара Карната на пике своего имперского расцвета." #NT!
 nd_vjn_imperial_cannon_foundry: "Имперский пушечный завод" #NT!
 nd_vjn_imperial_cannon_foundry_desc: "Гильдии сварнакара Карната обратились к имперскому пушечному литью: бронзовым и железным полевым орудиям для армии юга." #NT!
 nd_vjn_modernized_nayaka_garrison: "Модернизированный гарнизон Наяка" #NT!
 nd_vjn_modernized_nayaka_garrison_desc: "Вооруженные огнестрельным оружием, обученные гарнизонные войска соблюдают квоту амара-наяка в современную эпоху." #NT!
  
  # ============================================================ 
  # DESTINY TREE 
  # ============================================================ 
  
  # ---- Destiny advance names and descriptions ---- 
 nd_vjn_destiny: "Судьба Карнаты" #NT!
 nd_vjn_destiny_desc: "Виджаянагара восстановлена: императорские гопурамы возвышаются над Хампи, а южные народы собираются под шафрановой Варахой. Но чем станет империя? Манят два долгосрочных проекта: великая работа дхармы на севере и великая работа в Индийском океане. Для осуществления любого из этих действий прежде всего необходима стабильность." #NT!
  
 nd_vjn_dest_bahmani_frontier: "Марш на границе Бахмани" #NT!
 nd_vjn_dest_bahmani_frontier_desc: "Султанаты-преемники Бахмани (первые среди них Бидар и Биджапур) расположены по другую сторону рек Кришна и Тунгабхадра, самых ворот имперской экспансии на север. Войска Карнаты должны вернуть их, прежде чем плато Декана можно будет назвать плато Виджаянагара." #NT!
  
 nd_vjn_dest_deccan_plateau: "Верните плато Декан" #NT!
 nd_vjn_dest_deccan_plateau_desc: "За Бидаром и Биджапуром лежат Гулбарга, Даулатабад и Ахмеднагар: сердце Бахмани и великая столица Туглуков, которые когда-то пытались поглотить юг. Взять их — значит обратить вспять завоевания на юге четырнадцатого века и восстановить имперскую границу на Тапти." #NT!
  
 nd_vjn_dest_imperial_heartland: "Имперский центр восстановлен" #NT!
 nd_vjn_dest_imperial_heartland_desc: "От Сурата на побережье Гуджарата до Агры в бассейне Ямуны, от алмазных рудников Голконды до древней цитадели Варангала: империя Карната претендует на имперские границы неделимого дхарма-раджа. Диван-Хана юга возвышается в Хампи, канцелярии, достойной наследника Бхараты." #NT!
  
 nd_vjn_dest_konkan_thalassocracy: "Конкан-талассократия" #NT!
 nd_vjn_dest_konkan_thalassocracy_desc: "Побережье Конкан (гавань Бомбея, причалы Гоа, построенные португальцами) — это первый океан империи. Контролировать ее — значит установить знамя Дхармы над торговлей в Аравийском море и получать лошадей, серебро и корабельный лес на собственных условиях империи." #NT!
  
 nd_vjn_dest_lanka_maldives: "Ланка и Мальдивские атоллы" #NT!
 nd_vjn_dest_lanka_maldives_desc: "Шри-Ланка (Котте, Канди) и длинная дуга Мальдивских атоллов расположены по обе стороны торговых путей от Восточной Африки до Суматры. Водрузить там имперское знамя — значит взять ключи от Индийского океана. Глобальные торговые знания должны в первую очередь распространиться среди имперских купцов." #NT!
  
 nd_vjn_dest_indian_ocean_apex: "Владыка Индийского океана" #NT!
 nd_vjn_dest_indian_ocean_apex_desc: "Малакка на востоке, Ормуз на западе, Аден у ворот Красного моря: три поворота Индийского океана. Удержать их — значит стать сувереном крупнейшего торгового океана на Земле. Коромандельская биржа открывается в Пуликате, чтобы перерабатывать мировой шелк и специи." #NT!
  
  # ---- Destiny event 7: root ---- 
 nd_vjn.7.t: "Судьба Карнаты" #NT!
 nd_vjn.7.d: "С гранита Тунгабхадра, с трона Хампи империя наблюдает за работой будущих поколений. Линии Салува, Тулува и Аравиду основали дхарма-радж, который не может разрушить ни одна коалиция султаната; понтифики матха благословили императорские регалии; Гильдии сварнакара отлили знамя Гаруды из бронзы и золота. Теперь начинается долгая работа. Две судьбы открываются. Один смотрит на север: вернуть себе плато Декан и за его пределами, отменить завоевания четырнадцатого века, восстановить сердце дхармы в имперском сердце Бхараты. Одна обращена к морю: унаследовать Индийский океан, водрузить имперское знамя на Ланке, Мальдивах, Малакке, Ормузе, Адене и построить торговую империю, с которой не сможет сравниться ни одна европейская компания. Суд выбирает; империя берет на себя обязательства." #NT!
 nd_vjn.7.a: "Пусть судьба Виджаянагара раскроется." #NT!
  
  # ---- Destiny event 8: Bahmani Frontier ---- 
 nd_vjn.8.t: "Кришна пересекся" #NT!
 nd_vjn.8.d: "Стены Бидара пали; Дворяне Биджапура сдали цитадель. Сила Кришны перейдена, и имперские знамена поднимаются на открытое плато Декана впервые со времен вторжений туглуков в четырнадцатом веке. По всей империи звонят храмовые колокола; матх Шрингери отправляет в Хампи рукописи с золотыми листами; амаранаяки приносят новые клятвы на прахе завоеванных крепостей. Границы Бахмани (южной границы затмения Дхармы на протяжении двух столетий) больше нет." #NT!
 nd_vjn.8.a: "Вперед к Тапти и Нармаде." #NT!
  
  # ---- Destiny event 9: Reclaim the Deccan ---- 
 nd_vjn.9.t: "Даулатабад восстановлен" #NT!
 nd_vjn.9.d: "Великая крепость Даулатабад (Девагири до того, как ее переименовали Туглуки, скальная цитадель, которую Мухаммад бин Туглук пытался сделать столицей своей разрушающейся империи) находится в руках Карнаты. Гульбарга, первоначальная столица Бахмани, сдалась. Дворяне Ахмеднагара летают на Гаруде. Плато Декана, от Тапти до Кришны, восстановлено в дхарме. Перед судом стоят два вопроса: как распределить завоеванные богатства и как удержать новую границу." #NT!
 nd_vjn.9.a: "Раздайте сокровища Султаната: пополните имперскую казну" #NT!
 nd_vjn.9.b: "Гарнизон Декана: удерживайте каждый форт, финансируйте его за счет военных займов." #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_sultanate_treasure: "Сокровища Султаната" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_sultanate_treasure: "Разграбленные богатства Даулатабада и Бидара наводняют имперскую казну и храмовые пожертвования. Процветание растет по всей империи; но цена легитимности грабежа древних городов давит на имперское сознание." #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_deccan_garrisoned: "Декан с гарнизоном" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_deccan_garrisoned: "В каждом форте Бахмани имеется гарнизон Карната, финансируемый имперскими военными займами банковских домов Хампи. Логистические возможности империи простираются по всему плато, и casus belli восстановления дхармы приобретает новый вес; проценты по кредиту — это цена, которую стоит заплатить." #NT!
  
  # ---- Destiny event 10: Imperial Heartland ---- 
 nd_vjn.10.t: "Империя Бхараты" #NT!
 nd_vjn.10.d: "От Сурата на побережье Гуджарати (где теперь не будет сидеть император Великих Моголов Акбар) через Агру и бассейн Ямуны, через алмазную страну Голконды до старой цитадели Какатия в Варангале: имперская граница достигла высшей точки любой великой южно-индийской династии до этого. Диван-Хана возвышается в Хампи, канцелярии, в сводчатых залах которой говорят на телугу, санскрите, персидском и маратхи. Суд должен решить, какой должна быть империя: империя мира дхармы или империя всеобщего суверенитета чакравартина." #NT!
 nd_vjn.10.a: "Dharma Paramount: правление имперским миром" #NT!
 nd_vjn.10.b: "Чакравартин: заявите о всеобщем суверенитете над Бхаратой" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_dharma_paramount: "Дхарма Парамаунт" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_dharma_paramount: "Империя правит посредством мира дхармы: терпима ко всем направлениям индуизма и ко всем другим направлениям, правя путем переговоров и личного примера. Суд полон цели, а дипломатия империи имеет вес морального авторитета." #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_chakravartin: "Чакравартин" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_chakravartin: "Император принимает титул чакравартин: вселенский монарх, вращатель колес, властитель четырех направлений. Подданные любого рода служат имперскому колесу; престиж имени империи не меркнет; По мере вращения колеса перед ним открываются новые войны." #NT!
  
  # ---- Destiny event 11: Konkan Thalassocracy ---- 
 nd_vjn.11.t: "Аравийское море принадлежит нам" #NT!
 nd_vjn.11.d: "Набережные Гоа (построенные португальцами и отремонтированные мастерами из Карнаты) и глубоководная гавань Бомбея теперь развеваются под знаменем Гаруда. Имперские эскадры мелкосидящих фрегатов патрулируют побережье Конкана от Синдудурга до Бхаткала. Арабская лошадь, персидское серебро, йеменский кофе и перец Ачех теперь проходят через факторы Карнаты на условиях, установленных в Хампи. Империя стала океанской державой, и начинается долгая талассократия юга." #NT!
 nd_vjn.11.a: "Аравийское море — первое озеро империи." #NT!
  
  # ---- Destiny event 12: Lanka and Maldives ---- 
 nd_vjn.12.t: "Жемчужина Юга" #NT!
 nd_vjn.12.d: "Реликвия зуба Котте, холм-цитадель Канди и длинная дуга мальдивских атоллов (Мале, Адду, Тиладхунмати) являются имперскими владениями. Добыча жемчуга в Маннаре и валюта каури на Мальдивах поступают в имперскую экономику. Сангха Тхеравады Ланки была отмечена в Хампи; Мальдивские султаны являются вассалами империи. Напрашиваются две стратегии: править Ланкой как имперской провинцией с прямым управлением или объединить атоллы в обширную сеть торговых факторов." #NT!
 nd_vjn.12.a: "Ланка как имперская провинция: прямое правление, монументальное восстановление" #NT!
 nd_vjn.12.b: "Мальдивские торговые фабрики: легкая сеть имперских агентов" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_lanka_dominion: "Ланкийский Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_lanka_dominion: "Шри-Ланка управляется как имперская провинция прямого управления. Имперские дороги, монументальное восстановление храмов и бригады по восстановлению разрушений восстанавливают остров. Колониальное влияние империи расширяется, а инфляция завоеванных монет сдерживается упорядоченной администрацией." #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_maldive_factor: "Мальдивская факторная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_maldive_factor: "Имперские подразделения размещены на атоллах Мальдив, в южных портах Ланки и на побережье Лаккадивов. Затраты на деятельность торговых предприятий падают; торговый потенциал растет; имперские эскадры проводят блокаду против любого соперника, осмелившегося войти в южные моря." #NT!
  
  # ---- Destiny event 13: Lord of the Indian Ocean ---- 
 nd_vjn.13.t: "Повелитель трех океанов" #NT!
 nd_vjn.13.d: "Малакка, Ормуз, Аден: три стержня торговли в Индийском океане. Малакка в проливе, отделяющем Бенгальский залив от Южно-Китайского моря; Ормуз в проливе, ведущем к Персидскому заливу; Аден в узком месте Красного моря. Империя, которая владеет всеми тремя, является суверенной над торговым океаном, владыкой шелка и специй, текущих от Кантона до Лиссабона. В Пуликате расположена Коромандельская императорская биржа: крупнейшая таможня и биржа в Индийском океане. Империя находится в зените своей торговой империи." #NT!
 nd_vjn.13.a: "Карнатский мир морей: имперский флот обеспечивает соблюдение порядка" #NT!
 nd_vjn.13.b: "Имперские торговые компании: сетью управляют дипломированные факторы" #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_sea_lords: "Карната Пакс морей" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_sea_lords: "Имперский флот обеспечивает мир трех океанов. Тяжелые линейные корабли и легкие фрегаты вместе; усиленные корпуса; тщательно обученный экипаж. Эскадра ни одной европейской роты не сможет сравниться с боевым порядком империи в Индийском океане." #NT!
  
 STATIC_MODIFIER_NAME_nd_vjn_dest_factory_companies: "Имперские торговые компании" #NT!
 STATIC_MODIFIER_DESC_nd_vjn_dest_factory_companies: "Дипломированные торговые компании Карнаты (созданные по европейскому образцу, но подчиняющиеся Хампи) управляют сетью заводов в Индийском океане. Имперская миграция течет наружу; разведка расширяет сеть. Армию внутри страны становится все дороже пополнять, поскольку лучшие люди находят свое счастье за ​​рубежом." #NT!
  
  # ---- Destiny path tooltip refinements (existing keys; restated for clarity) ---- 
  # nd_vjn_path_a_tt and nd_vjn_path_b_tt already defined above 
  
  # ---- Destiny buildings ---- 
 nd_vjn_imperial_diwan_khana: "Императорский Диван-Хана" #NT!
 nd_vjn_imperial_diwan_khana_desc: "Канцелярия восстановленной империи. Сводчатые залы в индуистско-имперском стиле перекликаются с дворцами Туглук и Бахмани на севере: преднамеренная визуальная претензия на архитектурное наследие плато Декан, теперь восстановленное в дхарме. Каждый императорский указ, касающийся Бхараты, проходит через эти залы." #NT!
 nd_vjn_diwan_maintenance: "Канцелярские операции" #NT!
 nd_vjn_diwan_maintenance_desc: "Содержание императорской канцелярии: бумага для грантов и фермеров, тонкая ткань для церемониальных одежд, мебель для долгих советов, инструменты для резчиков печатей и писцов." #NT!
  
 nd_vjn_coromandel_bourse: "Коромандельская императорская биржа" #NT!
 nd_vjn_coromandel_bourse_desc: "Великая таможня и торговая биржа Карнатской империи в Индийском океане. Прибрежный зал с колоннами, где имперские агенты очищают шелк из Кантона, специи из Малакки, лошадь из Ормуза, кофе из Адена и коромандельский хлопок, отправляемый на полмира. Финансовое сердце южной талассократии." #NT!
 nd_vjn_bourse_maintenance: "Биржевые операции" #NT!
 nd_vjn_bourse_maintenance_desc: "Содержание императорской биржи: бумага для бухгалтерских книг и векселей, тонкая ткань для мантий, тюки ткани в качестве стандартных обменных образцов, инструменты для пробирщиков и таможенных чиновников." #NT!
  
  # === BUREAUCRACIES === 
  
 AUTO_MODIFIER_NAME_nd_vjn_bureaucracy_authority: "Карната Имперская власть" #NT!
 AUTO_MODIFIER_DESC_nd_vjn_bureaucracy_authority: "Восстановленное государство Виджаянагара унаследовало институциональную структуру династий Сангама, Салува, Тулува и Аравиду. Два бюрократических места разблокированы, а имперская столица Хампи добавляет третье, поскольку является резиденцией мандата Шри-Вирупакши." #NT!
  
 vjn_pampa_virupaksha_bureaucracy: "Пампа-Вирупакша Девастханам" #NT!
 vjn_pampa_virupaksha_bureaucracy_desc: "Императорский храмовый комплекс Шайвы в Хампи, где Вирупакша (форма Шивы) был установлен как божество-покровитель империи. Харихара I в 1336 году от имени бога издал королевские пожалования и указы: император называл себя просто заместителем божества, а ритуал Пампакшетра сделал долину Тунгабхадра священной географией. Девастханам управлял храмовыми землями, грантами брахмадеи и благотворительной экономикой, которая связывала дворы Сангамы и Тулувы с духовным истеблишментом Шайвы." #NT!
  
 vjn_diwan_kacheri_bureaucracy: "Диван-Качери" #NT!
 vjn_diwan_kacheri_bureaucracy_desc: "Имперская канцелярия и налоговое управление были официально оформлены при Кришнадеве Рае (годы правления 1509–1529) и описаны в его политическом трактате на телугу «Амуктамальяда». Прадхани (главный министр) возглавлял восемь министерских портфелей; Корпус королевских писцов Раясам издавал сасаны (медные указы) по всему королевству на каннада, телугу, тамильском и санскрите. Диван-Качери сохранил сильную устно-санскритскую правовую традицию наряду с управлением на телугу, что отличало его от современных персидских канцелярий султанатов Декана." #NT!
  
 vjn_tirumala_devasthanam_bureaucracy: "Тирумала Девастханам" #NT!
 vjn_tirumala_devasthanam_bureaucracy_desc: "Вайшнавский храм Венкатешвары на холмах Тирумалы над Тирупати. Семь личных визитов Кришнадевы Рая и щедрые пожертвования (1513-1521) сделали храм вайшнавским аналогом Шайва Пампа-Вирупакши в Хампи, уравновешивая религиозное покровительство империи. К концу шестнадцатого века Тирумала стал самым богатым храмом в Южной Индии раннего Нового времени благодаря денежным подношениям паломникам хунди, запасам зерна и параллельной храмовой банковской системе, которая предоставляла кредиты по выгодным ставкам купцам и аристократам Наяка." #NT!
  
 vjn_coromandel_customs_bureaucracy: "Коромандельская таможня" #NT!
 vjn_coromandel_customs_bureaucracy_desc: "Налоговый аппарат восточного побережья, управляющий Пуликатом, Негапатнамом, Сан-Томе (Милапур) и Масулипатнамом. Штат Виджаянагара собирал сунгам (транзитные пошлины) через назначенных императором губернаторов портов Адхикари и лицензировал торговые гильдии Айяволе 500 и Маниграм на ведение дальней торговли в Индийском океане. Португальские, персидские, а затем и голландские факторы платили таможню наличными и слитками; Коромандельские ткани доходили до Ачеха, Пегу и островов специй." #NT!
