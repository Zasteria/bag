l_russian:
 STATIC_MODIFIER_NAME_nd_cel_tir_na_saor: "Тир на Саор" #NT!
 STATIC_MODIFIER_DESC_nd_cel_tir_na_saor: "Кельтский Союз построен не на завоеваниях, а на общем праве. От брегонских судов Ирландии до сифрайтов Уэльса и бретонских законов — кельтские народы предпочли конфедерацию подчинению, землю, где каждая нация хранит свой язык и обычаи в рамках единого целого." #NT!
 STATIC_MODIFIER_NAME_nd_cel_claidheamh_mor: "Клейдхем Мор" #NT!
 STATIC_MODIFIER_DESC_nd_cel_claidheamh_mor: "Великий Меч обнажен. От топорщиков из галлогласа до горных владетелей клейморами, от бретонских арбалетчиков до корнуоллских жестянщиков, защищающих свои шахты, кельтские народы создали военное братство, которое превращает каждый склон холма в крепость и каждое болото в поле битвы." #NT!
 nd_cel.1.t: "Кельтский союз" #NT!
 nd_cel.1.d: "Невозможное было достигнуто. От окутанных туманом берегов Бретани до продуваемых ветрами Гебридских островов, от зеленых долин Уэльса до каменных стен Коннахта — кельтские народы объединились впервые с тех пор, как римляне вытеснили их на западные окраины мира.\n\nНо единство — это не единообразие. Гэлы и британцы, корнуэльцы и бретонцы приносят каждый свои законы, свои песни, свой способ ведения войны. Вопрос теперь в том, что связывает этот союз: общее право и культурное родство, позволяющее каждой нации иметь свой собственный характер в рамках конфедерации? Или братство по оружию, кельтская военная традиция, наводившая ужас на империи от Рима до Лондона?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_cel.1.a: "Тир на Саор. Мы связаны законом, а не мечом." #NT!
 nd_cel.1.b: "Клейдхем Мор. Пусть Великий Меч говорит за всех кельтов." #NT!
 nd_cel.2.t: "Кодификация законов Бреона" #NT!
 nd_cel.2.d: "Древняя правовая традиция Брегона, сохранившаяся на протяжении столетий устной передачи и монашеского копирования, теперь систематически систематизирована для Кельтского Союза. В то время как английское общее право опиралось на прецедент и королевскую власть, система Брегона была построена на арбитраже, реституции и общинном консенсусе.\n\nУченые собрали разрозненные тексты, Сенчус Мор, Книгу Айцилла, законы гостеприимства и родства, и гармонизировали их с валлийскими кифрами и бретонскими кутумами в единый кельтский правовой кодекс. Суды Брегона теперь заседают в каждом городе, их судьи обучены традициям, более древним, чем любой парламент." #NT!
 nd_cel.2.a: "Пусть справедливость исходит из мудрости наших предков." #NT!
 nd_cel.3.t: "Возрождение островного искусства" #NT!
 nd_cel.3.d: "Скриптории кельтских монастырей вступили в новый золотой век. Мастера-иллюстраторы, обученные замысловатым узорам Келлской книги и Линдисфарнского Евангелия, создают рукописи потрясающей красоты. Но это не просто антикварное упражнение: монахи адаптировали свои древние методы к новым предметам: истории, правовым кодексам, естественной философии и навигационным картам.\n\nВращающиеся переплетающиеся узоры, которые когда-то украшали только страницы Евангелий, теперь украшают учебные залы по всей кельтской земле. От Ионы до Клонмакнойза, от собора Святого Давида до аббатств Бретани, кельтская традиция скриптория доказывает, что красота и наука неразделимы." #NT!
 nd_cel.3.a: "Старое искусство говорит новым голосом." #NT!
 nd_cel.4.t: "Возвращение диких гусей" #NT!
 nd_cel.4.d: "На протяжении поколений лучшие кельтские воины искали службу за границей, ирландские полки - в армиях Франции и Испании, шотландские наемники - на скандинавской службе, бретонские моряки - под иностранными флагами. Они называли себя Дикими Гусями, изгнанниками, мечтавшими вернуться на свободную кельтскую родину.\n\nТеперь эта мечта реальна. Ветераны, закаленные в боях при Фонтенуа, Кремоне и дюжине других континентальных сражений, возвращаются домой. Они приносят с собой не только боевые навыки, но и знания иностранной тактики, осадной техники, дипломатические связи и разведывательные сети, развиваемые при европейских дворах. Вопрос в том, как их использовать." #NT!
 nd_cel.4.a: "Сформируйте из них Кельтскую гвардию. Наши лучшие солдаты возвращаются в бой." #NT!
 nd_cel.4.b: "Их связи за границей стоят больше, чем их мечи." #NT!
 nd_cel_kern_warfare: "Керн Война" #NT!
 nd_cel_kern_warfare_desc: "Цейтернах, легкая боевая пехота, вооруженная дротиками, луками и короткими мечами, на протяжении веков составляла основу гэльских армий." #NT!
 nd_cel_dun_tradition: "Дунское укрепление" #NT!
 nd_cel_dun_tradition_desc: "Кельтская традиция городищ и кольцевых крепостей, от великих данов Ирландии до брочов Шотландии, служила оборонительными опорными пунктами по всему ландшафту." #NT!
 nd_cel_rundale_system: "Система Рундале" #NT!
 nd_cel_rundale_system_desc: "Система кооперативного земледелия рундале, при которой пахотная земля периодически перераспределялась между семьями, поддерживала кельтские земледельческие общины." #NT!
 nd_cel_cattle_economy: "Экономика крупного рогатого скота" #NT!
 nd_cel_cattle_economy_desc: "В кельтском мире богатство измерялось скотом. Крупные ярмарки крупного рогатого скота, такие как Баллинасло, привлекали торговцев со всех островов." #NT!
 nd_cel_brehon_tradition: "Брехонская традиция" #NT!
 nd_cel_brehon_tradition_desc: "Правовая система Брегона, основанная на арбитраже и реституции, а не на наказании, управляла ирландским обществом на протяжении более тысячелетия.\n\n#italic Доступно в: $nd_cel_rath_market$#!" #NT!
 nd_cel_celtic_horsemanship: "Кельтское искусство верховой езды" #NT!
 nd_cel_celtic_horsemanship_desc: "Кельты были известными всадниками с древности. Хобелар, легкий кавалерист, приспособленный к пересеченной местности, был кельтским нововведением, перенятым даже англичанами." #NT!
 nd_cel_island_galleys: "Островные галеры" #NT!
 nd_cel_island_galleys_desc: "«Бирлинн», галера Западного Хайленда, был военным кораблем лордов островов и гебридских вождей, быстрым, маневренным и смертоносным в прибрежных водах." #NT!
 nd_cel_monastic_learning: "Монашеское обучение" #NT!
 nd_cel_monastic_learning_desc: "Кельтские монастыри в Ионе, Клонмакнойзе и Бангоре были центрами обучения, когда большая часть Европы разучилась читать." #NT!
 nd_cel_bardic_schools: "Бардские школы" #NT!
 nd_cel_bardic_schools_desc: "Бардские школы обучали поэтов сложным размерам и генеалогическим знаниям, необходимым для филида. Мастер-бард имел статус, равный королю." #NT!
 nd_cel_wool_trade: "Кельтская Шерсть Торговля" #NT!
 nd_cel_wool_trade_desc: "Шотландская и ирландская шерсть, обработанная в цистерцианских монастырских поместьях, была ценным экспортным товаром на текстильных рынках Фландрии.\n\n#italic Доступно в: $nd_cel_clachan$#!" #NT!
 nd_cel_tanistry: "Танистри" #NT!
 nd_cel_tanistry_desc: "Кельтская система преемственности по наиболее способному родственнику, а не первородство, порождала способных лидеров, но также и споры о престолонаследии.\n\n#italic Доступно в: $nd_cel_rath_market$#!" #NT!
 nd_cel_monastic_seafaring: "Монастырское мореплавание" #NT!
 nd_cel_monastic_seafaring_desc: "Кельтские монахи были замечательными путешественниками. Легендарное плавание святого Брендана по Атлантике отражает реальную традицию монашеского мореплавания на каррачах." #NT!
 nd_cel_atlantic_seamanship: "Атлантическое мореплавание" #NT!
 nd_cel_atlantic_seamanship_desc: "Кельтские мореплаватели освоили коварные воды Атлантического океана задолго до эпохи парусного спорта, построив порты и гавани от Голуэя до Бреста." #NT!
 nd_cel_fianna_tradition: "Фианна Традиция" #NT!
 nd_cel_fianna_tradition_desc: "Фианна были мифологическим отрядом воинов, живших в дикой местности, обученных как оружию, так и поэзии. Их традиции вдохновили формирование элитных отрядов." #NT!
 nd_cel_hedge_schools: "Хедж-школы" #NT!
 nd_cel_hedge_schools_desc: "Когда уголовные законы запретили обучение на католическом и ирландском языках, учителя школ изгороди преподавали тайно, в полях, за живой изгородью, в сараях, поддерживая обучение.\n\n#italic Доступно в: $nd_cel_scriptorium$#!" #NT!
 nd_cel_mercenary_tradition: "Наемная традиция" #NT!
 nd_cel_mercenary_tradition_desc: "Кельтские воины веками служили наемниками по всей Европе, Гэллогласс — на ирландской службе, шотландцы — в шведских армиях, ирландцы — во французских и испанских полках." #NT!
 nd_cel_gaelic_lordship: "Гэльское светлость" #NT!
 nd_cel_gaelic_lordship_desc: "Консолидация гэльских владений в рамках Кельтского союза объединяет разрозненные туата в последовательную политическую структуру." #NT!
 nd_cel_cornish_mining: "Корнуолл Майнинг" #NT!
 nd_cel_cornish_mining_desc: "Оловянные и медные рудники Корнуолла разрабатывались с бронзового века. Опыт горнодобывающей промышленности Корнуолла экспортировался по всему миру." #NT!
 nd_cel_guerrilla_warfare: "Партизанская война" #NT!
 nd_cel_guerrilla_warfare_desc: "Вудкерны, лесные партизаны, отточили тактику засад в густых лесах и болотах кельтских земель." #NT!
 nd_cel_brehon_revival: "Брехонское возрождение" #NT!
 nd_cel_brehon_revival_desc: "Систематическое возрождение и кодификация права Бреона дает Кельтскому Союзу правовую традицию, отличную от английского общего права.\n\n#italic Доступно в: $nd_cel_brehon_court$#!" #NT!
 nd_cel_language_revival: "Возрождение языка" #NT!
 nd_cel_language_revival_desc: "Организованные усилия по сохранению и продвижению гэльского, валлийского, бретонского и корнуоллского языков, объединяющие кельтские народы общим языковым наследием.\n\n#italic Доступно в: $nd_cel_teach_ceoil$#!" #NT!
 nd_cel_celtic_trade_league: "Кельтская торговая лига" #NT!
 nd_cel_celtic_trade_league_desc: "Панкельтская торговая сеть, связывающая порты Дублина, Глазго, Кардиффа, Бреста и Фалмута для взаимной коммерческой выгоды." #NT!
 nd_cel_celtic_christianity: "Кельтское христианство" #NT!
 nd_cel_celtic_christianity_desc: "Кельтское христианство с его упором на монашеские общины, peregrinatio и местную автономию предлагает особый путь между Римом и реформами." #NT!
 nd_cel_siege_resilience: "Устойчивость к осадам" #NT!
 nd_cel_siege_resilience_desc: "Столетия защиты от более крупных захватчиков научили кельтские народы превращать каждый холм и реку, пересекаемую ими, в смертельное препятствие." #NT!
 nd_cel_wild_geese_tradition: "Традиция диких гусей" #NT!
 nd_cel_wild_geese_tradition_desc: "Дикие гуси, кельтские солдаты, служившие в континентальных армиях, возвращают на родину с таким трудом завоеванные военные знания." #NT!
 nd_cel_smuggling_networks: "Сети контрабанды" #NT!
 nd_cel_smuggling_networks_desc: "Кельтские прибрежные сообщества создали обширные сети контрабанды, чтобы обойти английские торговые ограничения, перемещая товары через потайные бухты и отдаленные гавани.\n\n#italic Доступно в: $nd_cel_port_dunan$#!" #NT!
 nd_cel_constitutional_tradition: "Конституционная традиция" #NT!
 nd_cel_constitutional_tradition_desc: "Опираясь на правовую традицию Брегона, валлийские символы и мысли Просвещения, Кельтский Союз разрабатывает свою собственную конституционную структуру." #NT!
 nd_cel_atlantic_fisheries: "Атлантическое рыболовство" #NT!
 nd_cel_atlantic_fisheries_desc: "Богатые рыболовные угодья Кельтского моря и Северной Атлантики поддерживают прибрежные сообщества и обеспечивают постоянный приток опытных моряков." #NT!
 nd_cel_linen_industry: "Льняная промышленность" #NT!
 nd_cel_linen_industry_desc: "Производство льна в Ирландии и Шотландии, от выращивания льна до отбеливания и ткачества, становится основной экспортной отраслью." #NT!
 nd_cel_penal_resistance: "Уголовное сопротивление" #NT!
 nd_cel_penal_resistance_desc: "Опыт выживания в течение столетий уголовного законодательства и культурного подавления выковал нерушимую коллективную волю." #NT!
 nd_cel_industrial_heartlands: "Индустриальный Хартленд" #NT!
 nd_cel_industrial_heartlands_desc: "Уэльский уголь и шотландское железо стимулируют кельтскую промышленную революцию, превращая долины и низменности в мировые мастерские." #NT!
 nd_cel_literary_renaissance: "Литературный Ренессанс" #NT!
 nd_cel_literary_renaissance_desc: "Расцвет кельтской литературы, от оссианских поэм до валлийской традиции айстедвод, вдохновляет национальное сознание." #NT!
 nd_cel_cooperative_movement: "Кооперативное движение" #NT!
 nd_cel_cooperative_movement_desc: "Опираясь на древние традиции общинного земледелия и взаимопомощи, кельтское кооперативное движение трансформирует банковское дело и сельское хозяйство." #NT!
 nd_cel_pan_celtic_congress: "Панкельтский конгресс" #NT!
 nd_cel_pan_celtic_congress_desc: "Делегаты всех кельтских стран собираются, чтобы согласовать политику, прославить общее наследие и выступить единым дипломатическим фронтом." #NT!
 nd_cel_national_army: "Кельтская национальная армия" #NT!
 nd_cel_national_army_desc: "Профессионализация кельтских вооруженных сил, опирающаяся на многие поколения боевых традиций, от Галлогласса до Диких гусей." #NT!
 a_nd_cel_ceithearnach: "Цайтхернах" #NT!
 a_nd_cel_ceithearnach_desc: "Легкая боевая пехота, вооруженная дротиками и короткими мечами. Быстрый и агрессивный, керн изводил врагов ракетным огнем, прежде чем вступить в рукопашную схватку." #NT!
 n_nd_cel_birlinn: "Бирлинн" #NT!
 n_nd_cel_birlinn_desc: "Галера Вест-Хайленд, приводимая в движение парусом и веслом. Быстрый и маневренный в прибрежных водах «Бирлинн» был военным кораблем гебридских лордов." #NT!
 a_nd_cel_fianna: "Фианна" #NT!
 a_nd_cel_fianna_desc: "Элитная пехота отряда, вдохновленная мифологической Фианной. Эти ударные отряды сочетают в себе жестокие атаки и железную дисциплину." #NT!
 a_nd_cel_woodkern: "Вудкерн" #NT!
 a_nd_cel_woodkern_desc: "Живущие в лесу партизаны, которые преуспевают в засадах и преследовании в лесистой и холмистой местности. Кошмар каждой оккупационной армии." #NT!
 a_nd_cel_wild_geese: "Дикие гуси" #NT!
 a_nd_cel_wild_geese_desc: "Ветераны континентальной службы, эти закаленные в боях солдаты сочетают в себе кельтскую военную ярость и европейскую тактическую дисциплину." #NT!
 n_nd_cel_currach: "Куррах Рейдер" #NT!
 n_nd_cel_currach_desc: "Быстрое и легкое судно, построенное для рейдов в прибрежных районах Атлантического океана. Традиция куррача насчитывает тысячелетия, и эти корабли превосходно блокируют и преследуют вражеские корабли." #NT!
 nd_cel_dun_fort: "Дан Форт" #NT!
 nd_cel_dun_fort_desc: "Кельтское городище, построенное по древним оборонительным принципам, с превосходной территорией, толстыми каменными стенами и запасами продовольствия для длительной осады." #NT!
 nd_cel_scriptorium: "Скрипторий" #NT!
 nd_cel_scriptorium_desc: "Центр монашеской письменности, придерживающийся островной традиции, производящий иллюминированные рукописи и обучающий следующее поколение ученых." #NT!
 nd_cel_rath_market: "Рынок Рат" #NT!
 nd_cel_rath_market_desc: "Традиционный кельтский рынок и место сбора на древнем месте рат, где ярмарки скота, торговля и судебные процессы Брегона поддерживают сельскую общину." #NT!
 nd_cel_teach_ceoil: "Научить Ceoil" #NT!
 nd_cel_teach_ceoil_desc: "Дом музыки, где барды обучаются древнему искусству поэзии, генеалогии и музыкальной композиции, культурный центр кельтской цивилизации." #NT!
 nd_cel_clachan: "Клачан" #NT!
 nd_cel_clachan_desc: "Кооперативное фермерское поселение, организованное по системе рундале, где семьи обрабатывают общие земли и объединяют свой скот." #NT!
 nd_cel_port_dunan: "Порт-Дунан" #NT!
 nd_cel_port_dunan_desc: "Кельтская прибрежная гавань, построенная как для торговли, так и для войны, защищающая бирлинны и каррачи." #NT!
 nd_cel_brehon_court: "Брехон Корт" #NT!
 nd_cel_brehon_court_desc: "Суд, действующий в соответствии с традицией Бреона, где обученные юристы разрешают споры в соответствии с кельтскими правовыми принципами." #NT!
 nd_cel_dun_garrison: "Дан Гаррисон" #NT!
 nd_cel_dun_garrison_desc: "Оружие и продовольствие для поддержания оборонительного гарнизона форта Дан." #NT!
 nd_cel_manuscript_production: "Производство рукописей" #NT!
 nd_cel_manuscript_production_desc: "Монахи создают иллюминированные рукописи и научные труды в островной традиции." #NT!
 nd_cel_cattle_fair: "Ярмарка крупного рогатого скота" #NT!
 nd_cel_cattle_fair_desc: "Регулярные ярмарки крупного рогатого скота привлекают торговцев со всех кельтских земель." #NT!
 nd_cel_bardic_upkeep: "Бардское покровительство" #NT!
 nd_cel_bardic_upkeep_desc: "Поддержка бардов требует гостеприимства и красивой одежды, соответствующей их высокому статусу." #NT!
 nd_cel_communal_farming: "Коммунальное сельское хозяйство" #NT!
 nd_cel_communal_farming_desc: "Кооперативное животноводство производит шерсть для торговли через систему Рундале." #NT!
 nd_cel_harbor_upkeep: "Обслуживание порта" #NT!
 nd_cel_harbor_upkeep_desc: "Древесина и материалы для содержания гавани и ее флота." #NT!
 nd_cel_legal_proceedings: "Судебные разбирательства" #NT!
 nd_cel_legal_proceedings_desc: "Пергамент и воск для записи судебных процессов, происходящих на рыночном собрании." #NT!
 nd_cel_formal_jurisprudence: "Формальная юриспруденция" #NT!
 nd_cel_formal_jurisprudence_desc: "Бумага и сургуч для формального применения возрожденного юридического кодекса Брегона." #NT!
 STATIC_MODIFIER_NAME_nd_cel_brehon_codified: "Кодифицированный закон Брегона" #NT!
 STATIC_MODIFIER_DESC_nd_cel_brehon_codified: "Систематическая кодификация законов Бреона обеспечивает правовую согласованность во всем Кельтском Союзе." #NT!
 STATIC_MODIFIER_NAME_nd_cel_insular_art: "Возрождение островного искусства" #NT!
 STATIC_MODIFIER_DESC_nd_cel_insular_art: "Возрождение кельтского рукописного освещения и художественных традиций обогащает культурную жизнь союза." #NT!
 STATIC_MODIFIER_NAME_nd_cel_wild_geese_return_a: "Кельтская гвардия" #NT!
 STATIC_MODIFIER_DESC_nd_cel_wild_geese_return_a: "Вернувшиеся «Дикие гуси» образуют элитный гвардейский корпус, привносящий континентальный военный опыт в кельтские армии." #NT!
 STATIC_MODIFIER_NAME_nd_cel_wild_geese_return_b: "Глаза всей Европы" #NT!
 STATIC_MODIFIER_DESC_nd_cel_wild_geese_return_b: "Возвращающиеся «Дикие гуси» используют свои континентальные связи для получения дипломатических преимуществ и сбора разведывательной информации." #NT!
 levy_nd_cel_fianna: "Отряд Фианны" #NT!
 levy_nd_cel_fianna_desc: "Элитные отряды воинов, созданные в традициях мифологической Фианны." #NT!
 nd_cel_formed_tt: "был создан Кельтский союз." #NT!
 nd_cel_path_a_tt: "Выбрал Тир на Саор" #NT!
 nd_cel_path_b_tt: "Выбрал Клэйдхем Мор" #NT!
 nd_cel_destiny: "Кельтская судьба" #NT!
 nd_cel_destiny_desc: "Кельтский союз един. Теперь начинается работа по созданию нации, достойной этого имени, будь то посредством общего права и культуры или силы кельтского оружия." #NT!
 nd_cel_dest_brehon_accord: "Брегонское соглашение" #NT!
 nd_cel_dest_brehon_accord_desc: "Установите единый правовой кодекс на всех кельтских землях, охватывая древнюю брехонскую традицию арбитража и реституции, чтобы связать различные народы союза общим законом." #NT!
 nd_cel_dest_celtic_academy: "Кельтская Академия" #NT!
 nd_cel_dest_celtic_academy_desc: "Основал великий центр обучения, который привлекает ученых из каждой кельтской нации, продвигая знания и развивая институты, необходимые для современной конфедерации." #NT!
 nd_cel_dest_celtic_renaissance: "Кельтский Ренессанс" #NT!
 nd_cel_dest_celtic_renaissance_desc: "Достигните золотого века кельтской культуры, расцвета искусства, литературы и науки, который докажет, что кельтские народы равны любой цивилизации в Европе." #NT!
 nd_cel_dest_celtic_march: "Кельтский марш" #NT!
 nd_cel_dest_celtic_march_desc: "Верните старые кельтские территории Корнуолл и Камбрию из-под контроля Англии, расширив границы союза до их исторических размеров." #NT!
 nd_cel_dest_atlantic_dominion: "Атлантический Доминион" #NT!
 nd_cel_dest_atlantic_dominion_desc: "Захватите контроль над северными морями, захватив Оркнейские острова и закрепившись в Нормандии, доминируя на подступах к центру кельтов." #NT!
 nd_cel_dest_western_empire: "Западная Империя" #NT!
 nd_cel_dest_western_empire_desc: "Постройте панатлантическую кельтскую империю, простирающуюся от Исландии до Бордо, с самим Лондоном под властью кельтов, что станет окончательным поворотом веков английского господства." #NT!
 nd_cel.5.t: "Путь перед нами" #NT!
 nd_cel.5.d: "Кельтский Союз больше не является мечтой, шепчущейся в дымных залах или воспетой в полузабытых балладах. Это настоящая нация, простирающаяся от Бретани до Гебридских островов. Но впереди еще более трудная работа. Любой дурак может поднять знамя; Чтобы построить что-то долговечное, нужна мудрость.\n\nСтарейшины и вожди, барды и законодатели, купцы и моряки — все сейчас смотрят на нас. Выбор, который мы делаем в эти первые годы, будет отражаться в веках." #NT!
 nd_cel.5.a: "Давайте построим что-то, что переживет нас всех." #NT!
 nd_cel.6.t: "Брегонское соглашение" #NT!
 nd_cel.6.d: "От холма Тары до судов Ренна говорили судьи. Большой совет бреонских юристов, валлийских сифрейтвиров и бретонских кутюрье создал нечто беспрецедентное: единый кельтский правовой кодекс, который чтит отдельные традиции каждой нации, связывая их общими принципами.\n\nСоглашение закрепляет старые кельтские добродетели, арбитраж над наказанием, реституцию вместо мести, права туата наряду с властью ри. Это не имитация английского общего права или римского гражданского права. Это что-то старше и, возможно, что-то мудрее." #NT!
 nd_cel.6.a: "Закон – это сухожилия, связывающие наши страны." #NT!
 nd_cel.7.t: "Оллскоил Чилтич" #NT!
 nd_cel.7.d: "Кельтская академия открыла свои двери. В огромном зале, сочетающем в себе переплетение узоров Ионы с математической точностью современности, учёные всех кельтских народов собираются, чтобы учиться, спорить и творить.\n\nНо уже возник спор о цели Академии. Некоторые утверждают, что оно должно сосредоточиться на сохранении и возрождении кельтских языков и искусств, что станет оплотом против культурной волны более крупных соседей. Другие считают, что Академия должна смотреть вперед, осваивая новые науки и практические знания, чтобы обеспечить материальное процветание союза." #NT!
 nd_cel.7.a: "Сохраните наше наследие. Языки на первом месте." #NT!
 nd_cel.7.b: "Используйте новые науки для более сильного союза." #NT!
 nd_cel.8.t: "Эслинг на gCeilteach" #NT!
 nd_cel.8.d: "Они называют это «Кельтским видением», воплощением айслинга. От скрипторий Клонмакнойза до айстедфодау Уэльса, от литературных салонов Ренна до мюзик-холлов Эдинбурга, культурный расцвет охватывает кельтские земли, соперничая с любым Возрождением.\n\nПоэты сочиняют на гэльском и британском языках с уверенностью, невиданной со времен бардов. Художники сочетают древнюю традицию узлового плетения с новыми техниками. Ученые публикуют труды по философии, естествознанию и математике, которые пользуются уважением во всей Европе.\n\nТеперь вопрос в том, как направить эту энергию. Филиды, мастера-поэты, которые когда-то имели статус, равный королям, выступают за возвращение к древней бардской традиции, где культура служит душе нации. Новые интеллектуалы возражают, что культура должна также служить коммерции и практическим инновациям." #NT!
 nd_cel.8.a: "Филидная традиция: культура как душа нации." #NT!
 nd_cel.8.b: "Новое знание: культура как двигатель прогресса." #NT!
 nd_cel.9.t: "Кельтский марш" #NT!
 nd_cel.9.d: "Кельтские знамена развеваются над Корнуоллом и Камбрией впервые за столетия. Оловянные рудники Кернова и горные перевалы на севере принадлежат нам. На деревенских площадях недавно освобожденных территорий люди, почти забывшие свое кельтское наследие, заново изучают старые языки, заново открывая для себя песни, которые тайно пели их бабушки.\n\nАнгличане называли нас дикарями. Пусть они посмотрят, что могут построить дикари." #NT!
 nd_cel.9.a: "Границы кельтского мира расширяются." #NT!
 nd_cel.10.t: "Хозяева северных морей" #NT!
 nd_cel.10.d: "Скандинавский ярл Оркнейских островов преклонил колено. Кельтские корабли патрулируют от Пентленд-Ферта до устья Сены. Наш плацдарм на побережье Нормандии дает нам голос в континентальных делах, который не может игнорировать ни один английский король.\n\nКельтские народы всегда были мореплавателями. От легендарных путешествий Святого Брендана до бирлинских флотов гебридских лордов — Атлантика была нашей дорогой. Теперь это становится нашим доменом. Вопрос в том, что делать с этим мастерством." #NT!
 nd_cel.10.a: "Постройте военный флот, чтобы контролировать эти воды." #NT!
 nd_cel.10.b: "Посадите кельтские колонии через Атлантику." #NT!
 nd_cel.11.t: "Ард Ри на Ньяртар" #NT!
 nd_cel.11.d: "Лондон пал в руках кельтов. Город, который на протяжении веков был центром власти, попиравшей кельтские народы, теперь является кельтским владением. От вулканических берегов Рейкьявика до виноградников Бордо, от Оркнейских островов до Темзы — Кельтский Союз управляет империей, простирающейся по всему западному побережью Европы.\n\nДревние барды предсказывали этот день, когда рассеянные дети кельтов восстанут как один и вернут себе то, что у них было отобрано. Верховный королевский сан, Ард Ри, больше не является титулом из легенд. Это реальность народа, который отказался исчезнуть." #NT!
 nd_cel.11.a: "Правило через силу. Никто не бросит нам вызов снова." #NT!
 nd_cel.11.b: "Правило через престиж. Пусть мир признает наше величие." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_aisling_mor_a: "Хранители языка" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_aisling_mor_a: "Акцент Академии на сохранении языка и культуры укрепляет кельтскую идентичность, улучшая материальное производство и налоговые поступления по всему союзу." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_aisling_mor_b: "Новые науки" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_aisling_mor_b: "Использование Академией практических знаний стимулирует развитие и торговлю, хотя быстрое расширение вызывает незначительное инфляционное давление." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_fili_tradition_a: "Голос Филида" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_fili_tradition_a: "Возрождение бардской традиции расширяет дипломатические возможности кельтов и залечивает шрамы прошлых конфликтов, оптимизируя управление." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_fili_tradition_b: "Двигатель прогресса" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_fili_tradition_b: "Новые знания превращают кельтское искусство в коммерческое преимущество, расширяя возможности торговцев и одновременно оттачивая военную тактику." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_sea_wolves_a: "Повелители волн" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_sea_wolves_a: "Мощный кельтский военный флот доминирует в северных морях, хотя сосредоточение внимания на военно-морском строительстве замедляет восстановление сухопутных сил." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_sea_wolves_b: "Дети Брендана" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_sea_wolves_b: "Следуя по стопам легендарных монахов-мореплавателей, кельтские колонисты распространились по Атлантике, строя новые поселения в далеких землях." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_ard_ri_a: "Правосудие Верховного короля" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_ard_ri_a: "Ард Ри правит посредством военного превосходства, быстрой дипломатии и завоеванных трофеев." #NT!
 STATIC_MODIFIER_NAME_nd_cel_dest_ard_ri_b: "Слава Верховного Короля" #NT!
 STATIC_MODIFIER_DESC_nd_cel_dest_ard_ri_b: "Ард Ри командует благодаря престижу и лояльности подчиненных народов, что снижает затраты на утверждение кельтского господства." #NT!
 nd_cel_ceardlann: "Сердланн" #NT!
 nd_cel_ceardlann_desc: "Кельтская мастерская искусств и обучения, где мастера, ученые и художники сотрудничают для создания произведений, сочетающих древние традиции с современными знаниями." #NT!
 nd_cel_ceardlann_maintenance: "Принадлежности ученого" #NT!
 nd_cel_ceardlann_maintenance_desc: "Бумага, стекло и тонкая ткань для поддержки ученых и художников Кеардланна." #NT!
 nd_cel_ard_dun: "Ард Дун" #NT!
 nd_cel_ard_dun_desc: "Великая кельтская высокая крепость, контролирующая стратегические подходы, построенная, чтобы выдержать любую осаду и разместить гарнизон армий Западной Империи." #NT!
 nd_cel_ard_dun_maintenance: "Крепостной гарнизон" #NT!
 nd_cel_ard_dun_maintenance_desc: "Оружие, камень, скот и инструменты для поддержания высокой крепости и ее гарнизона." #NT!
  
  # Bureaucracies: 7 historically-grounded Celtic-world institutions 
 AUTO_MODIFIER_NAME_nd_cel_bureaucracy_authority: "Конфедеральная власть" #NT!
 AUTO_MODIFIER_DESC_nd_cel_bureaucracy_authority: "Федеральный аппарат Кельтского Союза превратился в постоянную институциональную структуру, регистрирующую решения брехонов, собраний островов, школ филидов и уставных судов жестянщиков. На этом фундаменте могут быть возрождены прочные институты панкельтского государства." #NT!
  
 cel_brehon_law_bureaucracy: "Сенчас Мар" #NT!
 cel_brehon_law_bureaucracy_desc: "Корпус раннего ирландского обычного права, составленный в Ольстере восьмого века и впоследствии переданный наследственными юридическими семьями (Макиганы из Коннахта, О'Даворены из Буррена, Макклэнси из Томонда), чьи школы пережили реформу Ирландской церкви в двенадцатом веке и продолжали активно использоваться во всех гэльских владениях до завоевания Стюартов. Брегоны действовали как арбитры и главные советники, а не судьи в современном понимании, и в любом конфликте к ним относились как к нейтральным лицам. Их суждения одинаково касались как великих, так и малых, но не давали покоя сеньорским привилегиям." #NT!
  
 cel_cyfraith_hywel_bureaucracy: "Сайфрейт Хивел" #NT!
 cel_cyfraith_hywel_bureaucracy_desc: "Валлийская правовая традиция была систематизирована на синоде Хенди-Гвин-ар-Дафа в середине десятого века при Хиуэле Дда, сохранилась примерно в сорока рукописных сводах законов и активно использовалась во всех маршевых владениях до Актов Союза 1535-1542 годов. Законы Уэльса делили общество на пять правовых классов, признавали права женщин в браке и собственности в степени, исключительной для средневековой Европы, и управлялись профессиональными судьями (судьями), а не церковниками, что ставило его в противоречие с требованиями канонического права епископов." #NT!
  
 cel_council_of_the_isles_bureaucracy: "Совет островов" #NT!
 cel_council_of_the_isles_bureaucracy_desc: "Совещательный орган Лорда островов, заседавший на Эйлин-на-Комхайрле в Лох-Финлаггане на острове Айлей. Шестнадцать советников: четыре великих барона (Маклин из Дуарта, Маклауд из Харриса, Маклауд из Льюиса, Маклин из Лох-Бьюи), четыре тана (Маккиннон, Макнил из Барры, Макнил из Гиги и еще один) и четыре родственника клана Дональд в присутствии аббата Ионы и епископа островов издавали земельные хартии и выносили решения под председательством Макдональда. как Пастух островов. Яков IV разграбил Финлагган в 1493 году." #NT!
  
 cel_bardic_schools_bureaucracy: "Аос Дана" #NT!
 cel_bardic_schools_bureaucracy_desc: "Потомственные профессиональные ученые семьи гэльской Ирландии и Шотландии (filidh, seanchaidh, breithim, lucht ciuil) обучались в течение семи-двенадцати лет в бардских школах, которые работали с ноября по май. К середине шестнадцатого века более четырехсот таких семей владели освобожденными от налогов земельными грантами в обмен на свою службу правящим династиям в качестве поэтов, специалистов по генеалогии, юристов, врачей и историков. Система рухнула с бегством графов в 1607 году и лишением гэльского покровительства." #NT!
  
 cel_tanistry_bureaucracy: "Танистри" #NT!
 cel_tanistry_bureaucracy_desc: "Гэльская выборная преемственность в средневековой Ирландии и Шотландии, согласно которой танаист (наследник и заместитель) выбирался при жизни действующего президента из дербфинов, четырех поколений подходящих родственников мужского пола. Система отдавала предпочтение проверенному воину перед первенцем, порождая способных правителей, но также и ожесточенную династическую вражду, когда каждая соперничающая ветвь одного и того же дома предъявляла свои претензии. Танистри сохранялась в составе вождя клана Хайленд и ирландского владения до его формальной отмены при Якове VI в 1607 году." #NT!
  
 cel_coyne_and_livery_bureaucracy: "Койн и Ливери" #NT!
 cel_coyne_and_livery_bureaucracy_desc: "Сбор бесплатного проживания и продовольствия (по-ирландски coinmheadh ​​— buannacht), с помощью которого гэльские и гиберно-нормандские лорды содержали с населения свои керны, виселицы и всадников: единственный и наиболее важный налог Ирландии позднего средневековья. Койн снабжал солдат лорда едой и постельными принадлежностями; ливреи давали корм и конюшни для их лошадей. Администрация Тюдоров объявила эту практику вне закона как «предосудительную», но она оставалась незаменимой основой гэльской военной мощи, пока плантации не сместили ее." #NT!
  
 cel_stannary_charter_bureaucracy: "Станнарский устав" #NT!
 cel_stannary_charter_bureaucracy_desc: "Корнуоллское предприятие по добыче олова, основанное королем Джоном в 1201 году и утвержденное Эдуардом III в 1337 году с созданием герцогства Корнуолл. Двадцать четыре станнатора (шесть избранных от каждого из четырех станнеров Тайварнхейла, Блэкмура, Фоуимура и Пенвита) встретились в Крокерн-Торе и в Труро, чтобы принять законы по поводу производителей олова, освобожденных от общих налогов и от любой юрисдикции, кроме Станнэрских судов. Их парламент наложил вето на законы Вестминстера, касающиеся горнодобывающей промышленности; приостановлено Генрихом VII в 1496 году, оно было восстановлено Хартией о помиловании в 1508 году." #NT!
