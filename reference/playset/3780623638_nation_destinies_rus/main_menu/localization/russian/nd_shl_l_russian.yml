l_russian:
 STATIC_MODIFIER_NAME_nd_shl_ewig_ungedeelt: "Вверх Эвиг Унгеделт" #NT!
 STATIC_MODIFIER_DESC_nd_shl_ewig_ungedeelt: "Герцогства Шлезвиг и Гольштейн навечно неделимы. В соответствии с единой суверенной волей приграничная территория стала единым государством, с твердым управлением и безопасными границами." #NT!
 STATIC_MODIFIER_NAME_nd_shl_eider_frontier: "Граница Гаги" #NT!
 STATIC_MODIFIER_DESC_nd_shl_eider_frontier: "Земля Шлезвиг-Гольштейн воспринимает свою природу как мост между мирами. Дания и Германия, Северное море и Балтика, Скандинавия и Империя: все встречаются и смешиваются в этих герцогствах, и от этого смешения приходит процветание." #NT!
 STATIC_MODIFIER_NAME_nd_shl_treaty_sovereignty: "Договорный суверенитет" #NT!
 STATIC_MODIFIER_DESC_nd_shl_treaty_sovereignty: "Договор Рибе был истолкован как мандат на герцогский суверенитет, концентрирующий власть в руках герцога, а не в поместьях." #NT!
 STATIC_MODIFIER_NAME_nd_shl_treaty_estates: "Товарищество поместий" #NT!
 STATIC_MODIFIER_DESC_nd_shl_treaty_estates: "Договор Рибе установил партнерство между герцогом и поместьями Гольштейна, при этом торговые города получили право голоса в управлении." #NT!
 STATIC_MODIFIER_NAME_nd_shl_canal_strategic: "Стратегический водный путь" #NT!
 STATIC_MODIFIER_DESC_nd_shl_canal_strategic: "Гагачий канал служит стратегическим коридором, позволяющим быстро перемещать корабли между Северным морем и Балтийским морем без опасного путешествия вокруг Ютландии." #NT!
 STATIC_MODIFIER_NAME_nd_shl_canal_commercial: "Коммерческий коридор" #NT!
 STATIC_MODIFIER_DESC_nd_shl_canal_commercial: "Гагачий канал стал торговой артерией, позволяющей товарам перемещаться между двумя морями и обогащающей города, расположенные вдоль его берегов." #NT!
 nd_shl.1.t: "Вверх Эвиг Унгеделт" #NT!
 nd_shl.1.d: "Герцогства Шлезвиг и Гольштейн наконец-то объединились. На протяжении веков эти земли находились между Данией и Империей, их герцоги служили двум господам, а их люди говорили на двух языках. Договор в Рибе провозгласил эти земли «вечно неделимыми», но единство территории еще не означает единства целей.\n\nГользацкая знать требует сильного герцога, который сможет противостоять датскому вторжению и стать сувереном в Империи. Но купцы Киля и фермеры болот видят другое будущее: такое, в котором положение герцогства между двумя морями и двумя цивилизациями станет его величайшим преимуществом, а не источником слабости.\n\nСможет ли Шлезвиг-Гольштейн превратиться в единое суверенное государство? Или он охватит приграничье, став незаменимым мостом между Скандинавией и Германией?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_shl.1.a: "Мы навеки неразделимы, под одним государем" #NT!
 nd_shl.1.b: "Мы мост между двумя мирами" #NT!
 nd_shl.2.t: "Договор Рибе" #NT!
 nd_shl.2.d: "2 марта 1460 года в древнем городе Рибе дворяне Гользаса избрали короля Дании Кристиана I своим новым графом, сменив угасшую династию Шауэнбургов. В ответ Кристиан принес клятву, которая разнеслась по векам: герцогства Шлезвиг и Гольштейн должны оставаться «up ewig ungedeelt» (навсегда неделимыми).\n\nЭта простая фраза на нижненемецком языке стала конституционной основой герцогств. Но его значение было оспорено с самого начала. Означало ли это, что герцогства были объединены в одно государство под властью герцогов? Или это означало, что поместья (рыцари и города, получившие это обещание) имели постоянное право на участие в управлении?\n\nОтвет будет формировать характер герцогства на многие поколения." #NT!
 nd_shl.2.a: "Герцог управляет неделимыми землями с единоличной властью." #NT!
 nd_shl.2.b: "Сословия участвуют в управлении этими землями." #NT!
 nd_shl.3.t: "Катастрофа в Хеммингштедте" #NT!
 nd_shl.3.d: "17 февраля 1500 года король Дании Иоанн и герцог Фридрих выступили против свободной крестьянской республики Дитмаршен с армией численностью более двенадцати тысяч человек, включая четыре тысячи ландскнехтов и две тысячи рыцарей в доспехах. Крестьяне Дитмаршера, численностью около шести тысяч человек, встретили их на затопленной земле возле деревни Хеммингштедт.\n\nКрестьяне открыли шлюзовые ворота своих дамб, затопив низменные болота и направив армию вторжения по узким дамбам, где их численность ничего не значила. Треть всех рыцарей Шлезвига и Гольштейна погибла в грязи. Герцогское знамя пало. Это было худшее военное унижение в истории герцогств.\n\nНо из этой катастрофы мы извлекли суровый урок: на этих равнинных, водных землях укрепления и знание местности стоят больше, чем кавалерийские атаки. Болото само по себе является оружием для тех, кто умеет им владеть." #NT!
 nd_shl.3.a: "Мы никогда больше не будем недооценивать болото" #NT!
 nd_shl.4.t: "Гагачий канал" #NT!
 nd_shl.4.d: "Со времен викингов люди мечтали прорубить канал через узкое перешеек полуострова Ютландия, чтобы соединить Северное море с Балтийским. Герцог Адольф I Гольштейн-Готторпский впервые предложил этот проект в 1571 году, но потребовалось два столетия инженерных разработок, прежде чем строительство могло начаться.\n\nЗавершенный в 1784 году, Гагачий канал простирается от Киля на Балтийском море до устья Гаги в Тоннинге на Северном море. Корабли, которые когда-то выдерживали недели опасного плавания вокруг Скагеррака, теперь могут пройти транзит за несколько дней. Канал превращает Шлезвиг-Гольштейн из периферийной границы в центр морской торговли Северной Европы.\n\nБудет ли канал служить в первую очередь стратегическим активом для военно-морских амбиций герцогства или коммерческой магистралью, обогащающей его торговый класс?" #NT!
 nd_shl.4.a: "Стратегический водный путь для нашего флота" #NT!
 nd_shl.4.b: "Торговая дорога для наших торговцев" #NT!
 nd_shl.5.t: "Кристиана Альбертина" #NT!
 nd_shl.5.d: "5 октября 1665 года герцог Кристиан Альберт Гольштейн-Готторпский основал университет в Киле, назвав его Кристиана Альбертина в честь себя и своего отца. Герцог наделил это учреждение землями и привилегиями, привлекая ученых со всего протестантского севера.\n\nУниверситет быстро становится центром юриспруденции, теологии и натуральной философии. Его профессора обучают администраторов, которые будут управлять герцогствами, а студенты распространяют знания Киля в судах и счетных палатах по всей Северной Европе. В стране, разрываемой между датскими и немецкими притязаниями, университет представляет собой отчетливо гольдский центр интеллектуальной идентичности." #NT!
 nd_shl.5.a: "Пусть Киль станет маяком северного образования" #NT!
 nd_shl_deichbau: "Дайхбау" #NT!
 nd_shl_deichbau_desc: "С 11 века жители болот Северного моря строили дамбы, чтобы отвоевать землю у моря, создавая богатые сельскохозяйственные угодья, которые поддерживают население Гольштейна." #NT!
 nd_shl_borderland_governance: "Управление приграничьем" #NT!
 nd_shl_borderland_governance_desc: "Уникальное положение Гольштейна как зависимого от Дании и имперского графства породило традицию дипломатической гибкости и терпимости к различиям." #NT!
 nd_shl_holsatian_ritterschaft: "Гользатский Риттершафт" #NT!
 nd_shl_holsatian_ritterschaft_desc: "Гользатский рыцарский класс, служащий как датским, так и имперским лордам, составляет основу военного и административного потенциала герцогства." #NT!
 nd_shl_north_sea_salt: "Соль Северного моря" #NT!
 nd_shl_north_sea_salt_desc: "Прибрежные болота производят соль из испаряющейся морской воды — жизненно важный товар, позволяющий сохранять рыбу и мясо для торговли по всей Северной Европе." #NT!
 nd_shl_ochsenweg: "Оксенвег" #NT!
 nd_shl_ochsenweg_desc: "Великая воловья дорога простирается от пастбищ Ютландии на юг до Гамбурга и далее. По этому древнему маршруту перегоняют огромные стада крупного рогатого скота, обогащая каждое поселение на этом пути." #NT!
 nd_shl_treaty_of_ribe: "Договор Рибе" #NT!
 nd_shl_treaty_of_ribe_desc: "Рибский договор 1460 года провозгласил Шлезвиг и Гольштейн «навечно неделимыми», установив конституционную основу, связывающую герцогства вместе." #NT!
 nd_shl_kiel_harbor: "Кильская гавань" #NT!
 nd_shl_kiel_harbor_desc: "Естественная гавань Киля на Балтийском море обеспечивает герцогству морское присутствие, а судостроение и торговля связывают Гольштейн с более широким ганзейским миром." #NT!
 nd_shl_gottorp_court: "Готторпский суд" #NT!
 nd_shl_gottorp_court_desc: "Герцогский двор в замке Готторп, недалеко от старого города Шлезвиг, является центром культуры и управления, где герцог руководит как датскими, так и немецкими делами." #NT!
 nd_shl_hemmingstedt: "Хеммингштедт" #NT!
 nd_shl_hemmingstedt_desc: "Разрушительная битва 1500 года, в которой крестьяне-дитмаршеры уничтожили герцогскую армию на затопленных болотах, научила Шлезвиг-Гольштейн смертоносной силе оборонительной местности и управления водными ресурсами." #NT!
 nd_shl_salt_road_trade: "Солт-Роуд Трейд" #NT!
 nd_shl_salt_road_trade_desc: "Гольштейн контролирует участки соляной дороги, соединяющей соляные шахты Люнебурга с портами Балтики, получая прибыль от потока этого необходимого товара." #NT!
 nd_shl_dual_sea_shipyards: "Двойные морские верфи" #NT!
 nd_shl_dual_sea_shipyards_desc: "Корабелы Киля строят суда, подходящие как для мелководья Балтийского моря, так и для бурного Северного моря. Такая универсальность обусловлена ​​уникальным положением герцогства между двумя океанами." #NT!
 nd_shl_ducal_partition: "Герцогский раздел" #NT!
 nd_shl_ducal_partition_desc: "Раздел земли Шлезвиг-Гольштейн в 1544 году на королевскую и герцогскую доли создал сложную систему совместного управления, которая, как это ни парадоксально, укрепила административный потенциал." #NT!
 nd_shl_early_reformation: "Ранняя Реформация" #NT!
 nd_shl_early_reformation_desc: "Шлезвиг-Гольштейн принял лютеранскую Реформацию в 1528 году, став одной из первых территорий в Европе, которая сделала это, преобразовав свои церкви и школы." #NT!
 nd_shl_gottorp_library: "Готторпская библиотека" #NT!
 nd_shl_gottorp_library_desc: "Герцоги Готторпские собрали замечательную библиотеку и раритетный кабинет, в том числе знаменитый Готторпский глобус, памятник научным амбициям в стиле барокко." #NT!
 nd_shl_diplomatic_balancing: "Дипломатический баланс" #NT!
 nd_shl_diplomatic_balancing_desc: "Герцоги Гольштейн-Готторпские освоили искусство игры Дании против Швеции и одновременно против Империи, выживая за счет дипломатической ловкости, а не военной мощи." #NT!
 nd_shl_wartime_endurance: "Выносливость во время войны" #NT!
 nd_shl_wartime_endurance_desc: "Тридцатилетняя война опустошила герцогства, но население выстояло. Выжившие восстановили свои фермы и города с устойчивостью, закаленной десятилетиями конфликта." #NT!
 nd_shl_eider_canal: "Гагачий канал" #NT!
 nd_shl_eider_canal_desc: "Канал, соединяющий Балтийское море в Киле с Северным морем через реку Гага, превращает Шлезвиг-Гольштейн в морской перекресток Северной Европы." #NT!
 nd_shl_university_of_kiel: "Кильский университет" #NT!
 nd_shl_university_of_kiel_desc: "Основанная в 1665 году, Кристиана Альбертина в Киле является главным учебным центром герцогства, готовящим ученых, юристов и администраторов для работы на севере." #NT!
 nd_shl_holstein_cattle: "Голштинский крупный рогатый скот" #NT!
 nd_shl_holstein_cattle_desc: "Черно-пестрая голштино-фризская порода, выведенная на богатых болотистых пастбищах, стала известна по всей Европе благодаря своей потрясающей молочной продуктивности." #NT!
 nd_shl_gutswirtschaft: "Gutswirtschaft" #NT!
 nd_shl_gutswirtschaft_desc: "Реорганизация герцогских поместий для рационализации сельскохозяйственных операций увеличивает урожайность и налоговые поступления, стимулируя модернизацию сельских районов." #NT!
 nd_shl_national_movement: "Национальное движение" #NT!
 nd_shl_national_movement_desc: "Движение Шлезвиг-Гольштейн возрождает обещание Рибского договора, требуя, чтобы герцогства оставались едиными и свободными от поглощения Данией." #NT!
 nd_shl_kiel_revolution: "Кильская революция" #NT!
 nd_shl_kiel_revolution_desc: "Революционный пыл охватывает рабочих и моряков Киля, требуя конституционных прав и политического представительства." #NT!
 nd_shl_industrial_shipyards: "Промышленные верфи" #NT!
 nd_shl_industrial_shipyards_desc: "Верфи Киля индустриализируются, внедряя конструкции из железа и пара для производства военных кораблей, которые станут якорем современного военно-морского флота." #NT!
 nd_shl_border_resolution: "Разрешение границ" #NT!
 nd_shl_border_resolution_desc: "Шлезвиг-Гольштейнские войны решают многовековой пограничный вопрос силой оружия, устанавливая четкую границу между датским и немецким суверенитетом." #NT!
 a_nd_shl_marschbauer: "Гользатский маршбауэр" #NT!
 a_nd_shl_marschbauer_desc: "Крестьянское ополчение с болот Северного моря, закаленное жизнью в борьбе с самим морем. Они знают каждую дамбу, каждый шлюз, каждый участок опасной местности." #NT!
 levy_nd_shl_marschbauer: "Гользатский маршбауэр" #NT!
 levy_nd_shl_marschbauer_desc: "Набор из болотной крестьянской пехоты, опытной в боях на заболоченной местности." #NT!
 a_nd_shl_ochsentreiber: "Гольштейн Оксентрайбер" #NT!
 a_nd_shl_ochsentreiber_desc: "Конные погонщики скота, которые ведут огромные стада по Оксенвегу. Отличные разведчики и застрельщики, они знают каждый брод и пастбище от Ютландии до Гамбурга." #NT!
 levy_nd_shl_ochsentreiber: "Гольштейн Оксентрайбер" #NT!
 levy_nd_shl_ochsentreiber_desc: "Набор конных погонщиков с бычьей дороги, быстрые разведчики дома на открытых равнинах." #NT!
 n_nd_shl_pinass: "Киль Пинасс" #NT!
 n_nd_shl_pinass_desc: "Быстроходный патрульный корабль с кильских верфей, построенный с мелкой осадкой для Балтийского моря, но достаточно прочный для Северного моря. Идеально подходит для антипиратского патрулирования и прибрежного торгового сопровождения." #NT!
 nd_shl_deichamt: "Дайхамт" #NT!
 nd_shl_deichamt_desc: "Офис управления дамбами, координирующий строительство и обслуживание морских оборонительных сооружений, осушение болот и управление мелиорированными сельскохозяйственными угодьями." #NT!
 nd_shl_saline: "солевой раствор" #NT!
 nd_shl_saline_desc: "Прибрежная соль работает там, где рассол Северного моря испаряется в неглубоких кастрюлях, производя соль, которая сохраняет рыбу и мясо для торговли по всей Северной Европе." #NT!
 nd_shl_hafenkontor: "Хафенконтор" #NT!
 nd_shl_hafenkontor_desc: "Торговая счетная контора в Кильском порту, управляющая товаропотоками между торговыми сетями Северного моря и Балтийского моря." #NT!
 nd_shl_ochsenweg_station: "Станция Оксенвег" #NT!
 nd_shl_ochsenweg_station_desc: "Торговая станция вдоль большой бычьей дороги, где скот отдыхают, взвешивают, облагают налогом и продают. Кожевники прячутся рядом с загонами." #NT!
 nd_shl_warft: "Варфт" #NT!
 nd_shl_warft_desc: "Искусственный жилой холм, возвышающийся над линией наводнения, защищающий поселения от штормовых нагонов в Северном море. Жители острова Халлиген строили их еще в средние века." #NT!
 nd_shl_kieler_werft: "Килер Верфт" #NT!
 nd_shl_kieler_werft_desc: "Верфь на Кильском фьорде, строящая суда, подходящие как для мелководья Балтийского моря, так и для открытого Северного моря, — универсальность, уникальная для этого двухбережного герцогства." #NT!
 nd_shl_lutherkirche: "Лютеркирхе" #NT!
 nd_shl_lutherkirche_desc: "Реформированная приходская церковь, основанная после Реформации 1528 года и служащая центром лютеранской проповеди, образования и управления обществом." #NT!
 nd_shl_gutshof: "Гутсхоф" #NT!
 nd_shl_gutshof_desc: "Рационализированное герцогское поместье, применяющее принципы Просвещения в сельском хозяйстве, с улучшенным севооборотом, дренажем и управлением поместьями." #NT!
 nd_shl_christiana_albertina: "Кристиана Альбертина" #NT!
 nd_shl_christiana_albertina_desc: "Университет, основанный герцогом Кристианом Альбертом в 1665 году, центр протестантской науки, юриспруденции и натуральной философии в самом сердце Гольштейна." #NT!
 nd_shl_turnhalle: "Тернхалле" #NT!
 nd_shl_turnhalle_desc: "Гимнастический зал, который одновременно служит местом встреч национального движения, где политические митинги и гражданское образование разжигают огонь единства Шлезвиг-Гольштейна." #NT!
 nd_shl_deichamt_maintenance: "Содержание Дайхамта" #NT!
 nd_shl_deichamt_maintenance_desc: "Для поддержания сети дамб требуется древесина для свай, камень для облицовки и железо для шлюзовых механизмов." #NT!
 nd_shl_saline_maintenance: "Производство соляных заводов" #NT!
 nd_shl_saline_maintenance_desc: "Испарение рассола Северного моря над угольными пожарами, использование древесины в качестве топлива и железных инструментов для ухода за соляными ваннами, добыча соли для торговли по всей Северной Европе." #NT!
 nd_shl_hafenkontor_maintenance: "Содержание Хафенконтора" #NT!
 nd_shl_hafenkontor_maintenance_desc: "Для работы счетной палаты требуются пиломатериалы для здания, бумага для бухгалтерских книг и пчелиный воск для печатей и свечей." #NT!
 nd_shl_station_maintenance: "Содержание станции" #NT!
 nd_shl_station_maintenance_desc: "Для работы перегонной станции требуется древесина для загонов, скот для корма и зерно для отдыхающих здесь погонщиков." #NT!
 nd_shl_warft_maintenance: "Содержание Варфта" #NT!
 nd_shl_warft_maintenance_desc: "Для поддержания жилого холма требуется камень для облицовки, древесина для конструкций и песок для земляного слоя." #NT!
 nd_shl_werft_maintenance: "Обслуживание Верфта" #NT!
 nd_shl_werft_maintenance_desc: "Для содержания верфи требуются пиломатериалы для корпусов, железо для арматуры и деготь для гидроизоляции." #NT!
 nd_shl_lutherkirche_maintenance: "Содержание Лютеркирхе" #NT!
 nd_shl_lutherkirche_maintenance_desc: "Для содержания приходской церкви требуются пиломатериалы для конструкции, камень для стен и пчелиный воск для свечей и печатей." #NT!
 nd_shl_gutshof_maintenance: "Содержание Гутсхофа" #NT!
 nd_shl_gutshof_maintenance_desc: "Для эксплуатации рационализированного поместья требуются пиломатериалы для построек, железо для инструментов и скот для программы разведения." #NT!
 nd_shl_university_maintenance: "Содержание университета" #NT!
 nd_shl_university_maintenance_desc: "Для содержания университета необходима бумага для стипендий, книги для библиотеки и пчелиный воск для свечей и печатей." #NT!
 nd_shl_turnhalle_maintenance: "Содержание Тернхолла" #NT!
 nd_shl_turnhalle_maintenance_desc: "Для эксплуатации зала собраний требуются пиломатериалы для конструкции, бумага для брошюр и железо для гимнастического инвентаря." #NT!
 nd_shl_formed_tt: "была образована земля Шлезвиг-Гольштейн." #NT!
 nd_shl_path_a_tt: "Выберите судьбу #bold Up Ewig Ungedeelt#!" #NT!
 nd_shl_path_b_tt: "Выберите судьбу #bold Eider Frontier#!" #NT!
 nd_shl_destiny: "Судьба герцогств" #NT!
 nd_shl_destiny_desc: "Шлезвиг-Гольштейн был объединен в единое государство. Теперь герцогство должно решить свой будущий курс: стремиться ли к суверенной власти или к коммерческому превосходству." #NT!
 nd_shl_dest_slesvig: "Шлезвигский вопрос" #NT!
 nd_shl_dest_slesvig_desc: "Захватить старое герцогство Шлезвиг из-под контроля Дании. Возьмите Фленсбург и город Шлезвиг, чтобы объединить исторические герцогства под единой суверенной волей. Требуется армия численностью не менее 30 000 человек." #NT!
 nd_shl_dest_elbe: "Мастера Эльбы" #NT!
 nd_shl_dest_elbe_desc: "Расширьте территорию герцогства до великого порта Гамбурга и обеспечьте безопасность Южной Ютландии. Устье Эльбы является воротами в северную Германию и должно подчиняться Гольштейну. Требуется армия в 50 000 человек и международный авторитет." #NT!
 nd_shl_dest_sovereign: "Суверенное Герцогство" #NT!
 nd_shl_dest_sovereign_desc: "Возьмите сам Копенгаген и древний договорный город Рибе, навсегда положив конец притязаниям Дании на герцогства. Требуется мощная армия в 75 000 человек, полная казна и престижная репутация." #NT!
 nd_shl_dest_saltbridge: "Соляной мост" #NT!
 nd_shl_dest_saltbridge_desc: "Постройте торговый мост между двумя морями. Используйте современные банковские учреждения и обеспечьте потоки соли через рынки герцогства. Требуется 1000 золотых в казне." #NT!
 nd_shl_dest_twoseas: "Между двух морей" #NT!
 nd_shl_dest_twoseas_desc: "Захватите Бремен, чтобы контролировать торговлю Везером и развивать производство тканей на столичном рынке. Герцогство должно стать текстильным перекрестком севера. Требуется 2000 золота и международный престиж." #NT!
 nd_shl_dest_nexus: "Северный Нексус" #NT!
 nd_shl_dest_nexus_desc: "Владейте Брюгге и Бергеном, якорями торговли в Северном море и Атлантике, и вступайте в глобальные торговые институты. Шлезвиг-Гольштейн станет складом Европы. Требуется 3000 золота и высокий престиж." #NT!
 nd_shl.6.t: "Судьба герцогств" #NT!
 nd_shl.6.d: "Объединение Шлезвига и Гольштейна завершено, но настоящая работа только началась. Эти болота и гавани, эти дороги для скота и соляные копи: они являются основой чего-то большего. Вопрос в том, что мы будем на их основе строить.\n\nСможем ли мы создать суверенное государство, не подчиняющееся ни датскому королю, ни имперской диете? Или мы воспримем нашу природу как мост между мирами, богатея за счет торговли, которая должна проходить через наш узкий перешеек?" #NT!
 nd_shl.6.a: "Наша судьба ждет" #NT!
 nd_shl.7.t: "Шлезвигский вопрос" #NT!
 nd_shl.7.d: "Фленсбург и старый город Шлезвиг наши. На протяжении веков эти земли принадлежали датской короне, а их немецкоязычное население подчинялось иностранному суверену. Больше не надо. Герцогство Шлезвиг воссоединяется с Гольштейном под единым правителем.\n\nДатский король не примет это спокойно. Но урок Рибского договора остается в силе: эти земли навсегда неделимы, и теперь они навсегда наши." #NT!
 nd_shl.7.a: "Шлезвиг и Гольштейн составляют одно целое." #NT!
 nd_shl.8.t: "Мастера Эльбы" #NT!
 nd_shl.8.d: "Гамбург, великий вольный город на Эльбе, и города Южной Ютландии теперь входят в нашу сферу. Герцогство контролирует нижнюю Эльбу: артерию, через которую должна течь половина торговли северной Германии.\n\nЭто расширение требует выбора. Должны ли мы ввести железную дисциплину на наших новых территориях, сокрушая сопротивление и создавая единое военное государство? Или мы должны предоставить хартии и привилегии, включив в качестве добровольных партнеров торговые традиции Гамбурга и общины Ютландии?" #NT!
 nd_shl.8.a: "Железная дисциплина свяжет эти земли" #NT!
 nd_shl.8.b: "Предоставляйте чартеры и зарабатывайте их лояльность" #NT!
 nd_shl.9.t: "Суверенное Герцогство" #NT!
 nd_shl.9.d: "Копенгаген пал. Древний центр датской власти, город, который на протяжении веков претендовал на сюзеренитет над нашими герцогствами, теперь подчиняется нашей воле. Рибе (тот самый город, где был заключен договор о вечном единстве) также находится в наших руках, и круг замыкается.\n\nШлезвиг-Гольштейн больше не является пограничной территорией, зажатой между великими державами. Это самостоятельное суверенное государство, владеющее обоими берегами Гаги, обоими берегами Эльбы, а теперь и самим Зундом.\n\nБудем ли мы использовать эту власть для дальнейших завоеваний, навязывая свою волю северу? Или нам стоит построить федерацию северных штатов, руководящую посредством дипломатии, а не силы?" #NT!
 nd_shl.9.a: "Мы навяжем нашу суверенную волю" #NT!
 nd_shl.9.b: "Мы возглавим федерацию равных" #NT!
 nd_shl.10.t: "Соляной мост" #NT!
 nd_shl.10.d: "Купцы герцогства воспользовались новыми банковскими учреждениями, и соль (белое золото севера) в изобилии течет через наши рынки. Заложены основы великого торгового государства.\n\nКаждая бочка сельди, консервированная нашей солью, каждая шкура, вылеченная нашим рассолом, каждая дорога и канал, по которым перевозятся эти товары: все это обогащает счетные палаты герцогства. Шлезвиг-Гольштейн становится тем, чем всегда предполагала его география: торговым мостом между двумя мирами." #NT!
 nd_shl.10.a: "Мост построен на соли и серебре" #NT!
 nd_shl.11.t: "Между двух морей" #NT!
 nd_shl.11.d: "Бремен принадлежит нам, и ткань с наших ткацких станков поступает на рынки обоих морей. Герцогство теперь контролирует транзитные маршруты между Северным морем и Балтийским, имея производственные мощности, повышающие ценность проходящего через него сырья.\n\nСможем ли мы использовать это положение посредством строгой монополии, контроля цен и исключения конкурентов? Или мы должны объявить открытые порты, привлекая торговцев из всех стран обещаниями низких тарифов и безопасных гаваней?" #NT!
 nd_shl.11.a: "Монополия обогатит герцогство" #NT!
 nd_shl.11.b: "Открытые порты привлекут всех желающих" #NT!
 nd_shl.12.t: "Северный Нексус" #NT!
 nd_shl.12.d: "От тресковых причалов Бергена до суконных лавок Брюгге, от соляных промыслов Гольштейна до складов специй в Зунде: все пути северной торговли теперь проходят через Шлезвиг-Гольштейн. Герцогство стало тем, о чем когда-то мечтала старая Ганза: центром северной торговли, складом Европы.\n\nСможем ли мы закрепить это положение как великого перевалочного пункта, нейтральной территории, где торгуют все страны? Или нам стоит возродить дух Ганзейского союза, построив формальную коалицию торговых городов под нашим руководством?" #NT!
 nd_shl.12.a: "Мы - перевалочный пункт севера" #NT!
 nd_shl.12.b: "Мы возглавим новый Ганзейский союз" #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_elbe_iron: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_elbe_iron: "Новые территории удерживаются военной силой. Гарнизоны поддерживают порядок и подавляют сепаратистские настроения, но престиж герцогства страдает от его деспотических методов." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_elbe_charter: "Эльба Чартерс" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_elbe_charter: "Новые субъекты получают хартии, гарантирующие их традиционные права. Они охотно служат герцогству, хотя поддержание такого разнообразного королевства требует большего военного бюджета." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_sovereign_conquest: "Воля Государя" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_sovereign_conquest: "Разведывательная сеть герцогства простирается по всему северу, и война обходится дешево суверену, доказавшему свою силу, взяв Копенгаген." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_sovereign_federation: "Северная Федерация" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_sovereign_federation: "Герцогство возглавляет коалицию северных штатов благодаря дипломатическому весу и конституционным полномочиям, интегрируя новых членов в растущую федерацию." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_twoseas_monopoly: "Транзитная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_twoseas_monopoly: "Строгий контроль над транзитным маршрутом между двумя морями обогащает военно-морские силы и банковские дома герцогства, хотя протекционизм вызывает подозрения у торговых партнеров." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_twoseas_openport: "Открытые порты" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_twoseas_openport: "Свободные порты привлекают торговцев из всех стран, сокращая военно-морские расходы за счет совместного патрулирования и обеспечивая безопасность морей для всех." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_nexus_entrepot: "Северный перевалочный пункт" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_nexus_entrepot: "Герцогство служит нейтральным складом для всей Северной Европы, создавая военно-морской престиж и стабилизируя экономику, в то время как потребности армии отходят на второй план." #NT!
 STATIC_MODIFIER_NAME_nd_shl_dest_nexus_league: "Новый Ганзейский союз" #NT!
 STATIC_MODIFIER_DESC_nd_shl_dest_nexus_league: "Возрожденный Ганзейский союз под руководством Шлезвиг-Гольштейна проецирует коммерческую мощь на море, а города-члены вносят вклад в общую военно-морскую оборону." #NT!
 nd_shl_kieler_schloss: "Килер Шлосс" #NT!
 nd_shl_kieler_schloss_desc: "Верховный дворец в Киле, резиденция суда и правительства независимого герцогства. Крепость-резиденция, господствующая над берегом Балтийского моря, символизирующая триумф Гольштейна над датским сюзеренитетом." #NT!
 nd_shl_zweiuferkontor: "Цвайуферконтор" #NT!
 nd_shl_zweiuferkontor_desc: "Двухбережная счетная палата — крупная торговая биржа, управляющая транзитной торговлей между Северным морем и Балтийским морем. Агенты всех северных торговых стран имеют здесь офисы." #NT!
 nd_shl_schloss_maintenance: "Содержание замка" #NT!
 nd_shl_schloss_maintenance_desc: "Для поддержания королевского дворца необходим камень для стен, железо для ворот, ткань для двора и бумага для канцелярии." #NT!
 nd_shl_kontor_maintenance: "Содержание Контора" #NT!
 nd_shl_kontor_maintenance_desc: "Для ведения бухгалтерии необходима бумага для бухгалтерских книг, ткань для тюков, стекла для окон и инструменты для склада." #NT!
  
  # ===== BUREAUCRACIES ===== 
 shl_ritterschaft_bureaucracy: "Шлезвиг-Гольштейнское Риттершафт" #NT!
 shl_ritterschaft_bureaucracy_desc: "Учрежденное Рибским договором в 1460 году, объединенное рыцарство обоих герцогств представляло собой единый юридический орган Equites Originarii в Бордесхольме. Его крупные юнкерские поместья (Ранцау, Ревентлов, Алефельдт, Брокдорф) охватывали большую часть восточной Гольштейна и были освобождены от герцогских налогов. Риттершафт был конституционным защитником принципа up-ewig-ungedelt: при правильном культивировании он собирает тяжелую кавалерию королевства и обязывает герцога присягой; если пренебрегать им, то он превращается в наследственный тормоз любой реформы, и голштинские крестьяне на Аделиге Гютер погружаются в Leibeigenschaft." #NT!
 shl_landtag_bureaucracy: "Ландтаг дер Стенде" #NT!
 shl_landtag_bureaucracy_desc: "Трехстороннее собрание сословий герцогств, созданное одновременно с унией 1460 года. Заседали три скамьи: Риттершафт, соборные капитулы Шлезвига и Любека и Вир Штадте (Шлезвиг, Фленсбург, Киль, Рендсбург). Ландтаг проголосовал за налоги Беды, зарегистрировал герцога Верорднунгена и выступил арбитром между линиями Глюкштадта и Готторпа после раздела 1544 года. Будучи должным образом созванным в Киле и Рендсбурге, он придавал легитимность королевским указам; Когда их обошли, три коллегии в ответ приостановили принятие закона и лишили герцогства доверия бюргеров." #NT!
 shl_kieler_umschlag_bureaucracy: "Килер Умшлаг" #NT!
 shl_kieler_umschlag_bureaucracy_desc: "Ежегодная финансовая ярмарка, проводимая в Киле через неделю после Крещения. Впервые это было задокументировано в письме Любекского совета в 1469 году, а к XVI и XVII векам он стал основным кредитным рынком северной Германии, герцогств и Королевства Дания. Гольштейнские юнкеры давали взаймы под шесть-семь процентов датским королям, ганзейским купцам и военным предпринимателям; большая часть суверенного долга королевства пролонгировалась каждый январь в Киле. При его сохранении он удешевляет коронные займы и увеличивает кошелек бюргера; пренебрегают, ставки растут, и земли Гольштейна попадают в руки кредиторов, лишающих права выкупа: образец Бауэрнлегена конца XVI века." #NT!
 shl_adelige_kloster_bureaucracy: "Аделиге Клёстер" #NT!
 shl_adelige_kloster_bureaucracy_desc: "Четыре протестантских дворянских монастыря (Итцехо, Прец, Ютерсен и Св. Йоханнис в Шлезвиге), пережившие Реформацию, были коллегиальными фондами для незамужних дочерей дворянства Шлезвиг-Гольштейна. Реорганизованные Клостерорднунгом после 1542 года, они сохранили за собой обширные церковные земли, управлялись избранными Препстинненами, набранными из Риттершафта, и служили одновременно дворянскими домами престарелых и лютеранско-аристократической ученой средой. Устойчивые, они закрепляют грамотную клерикально-дворянскую культуру; Придя в упадок, они превратились в отсутствующих землевладельцев, извлекающих ренту, чьи безналоговые поместья все больше возмущают бюргерские города." #NT!
 shl_deutsche_kanzlei_bureaucracy: "Немецкий Канцлей" #NT!
 shl_deutsche_kanzlei_bureaucracy_desc: "Немецкая канцелярия: основной административный орган герцогств, ведущий все дела на немецком языке, что резко контрастирует с копенгагенским Danske Kancelli. Основанный в Готторпе под управлением герцогов Гольштейн-Готторпского с аналогом в Глюкштадте для королевской доли после 1648 года, он кодифицировал Шлезвигские ландрехты и Гольштейнские ландрехты и направил Verordnungen, которые ими управляли. С 1806 года он был объединен как Шлезвиг-Гольштейн-Лауэнбург Канцлей. Надлежащим образом укомплектованный Канцлейрате, прошедшим обучение в Киле и Хельмштедте, он объединяет лоскутное одеяло Амтера, Клёстера и Адельгутера в единое целое; при недостаточном финансировании оно превращается в синекуру с перетасовкой бумаг, которую игнорируют в болотах." #NT!
  
  # ===== BUREAUCRACY AUTHORITY (auto_modifier) ===== 
 AUTO_MODIFIER_NAME_nd_shl_bureaucracy_authority: "Герцогское управление Шлезвиг-Гольштейн" #NT!
 AUTO_MODIFIER_DESC_nd_shl_bureaucracy_authority: "При создании герцог Шлезвиг-Гольштейн принимает на себя право управлять историческим институциональным аппаратом герцогств-близнецов. Предоставляет два слота бюрократии и открывает систему [bureaucracies|e], позволяющую игроку активировать до трех учреждений (с универсальным слотом капитала)." #NT!
