 TBT: "Тибетская империя" #NT!
 TBT_ADJ: "тибетский" #NT!
 TBT_f: "Тибетская империя" #NT!
 TBT_f_desc: "Восстановите империю эпохи Ярлунг (Бод чен по) Сонгцен Гампо, Трисонг Децен и Ралпакан, когда тибетские армии продвинулись из Лхасы к границе Тан и удерживали бассейн Тарима против Китая. Это воинственно-имперский Тибет с указами на каменных колоннах и бон-буддийским синтезом, а не позднейшая теократия лам гелуг. От Поталы до Самье знамя Ценпо снова поднимается над Крышей Мира." #NT!
