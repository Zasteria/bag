l_russian:
 VJN: "Империя Карната" #NT!
 VJN_ADJ: "Карната" #NT!
 VJN_f: "Империя Карната" #NT!
 VJN_f_desc: "Восстановите имперское достоинство Виджаянагара, великой индуистской империи юга. Закаленный в горниле сопротивления деканским султанатам и возведенный в зенит при Кришнадеве Рае, Карната Раджья объединяет дравидийские народы под знаменем вепря Варахи: хранителя дхармы, покровителя храмов и повелителя побережий, торгующих пряностями." #NT!
