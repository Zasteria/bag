l_russian:
 STATIC_MODIFIER_NAME_nd_westphalian_sovereignty: "Вестфальский суверенитет" #NT!
 STATIC_MODIFIER_DESC_nd_westphalian_sovereignty: "Вестфальская система суверенного равенства между государствами, где каждый князь является хозяином своего королевства, свободным от внешнего вмешательства в вопросы религии и управления." #NT!
 STATIC_MODIFIER_NAME_nd_red_earth_justice: "Красная Земля" #NT!
 STATIC_MODIFIER_DESC_nd_red_earth_justice: "На Роте Эрде все еще действует Блутбанн Императора. Через древние трибуналы Вемиков Вестфалия осуществляет уникальную традицию имперского правосудия, которая распространяется по всему королевству, обеспечивая порядок там, где другие власти терпят неудачу." #NT!
 nd_wes.1.t: "Возвышение Вестфалии" #NT!
 nd_wes.1.d: "Земли между Рейном и Везером были объединены под властью Вестфалии. От соляных источников Хельвега до кузниц Зауэрланда, от ганзейских контор Дортмунда до секретных трибуналов, где судьи в капюшонах отправляют правосудие Императора: эта земля сформирована торговлей, правом и тяжелыми уроками религиозной войны.\n\nВестфалия стоит на перепутье. Он может отстаивать революционный принцип, согласно которому каждое государство, большое или маленькое, обладает равным суверенитетом и правом определять свою собственную конфессию, тот самый принцип, который однажды будет носить его имя. Или он может использовать свою древнюю и уникальную судебную власть — суды Вемиков Красной Земли — чтобы навести порядок посредством имперского закона.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_wes.1.a: "Cuius regio, eius religio: суверенитет для всех" #NT!
 nd_wes.1.b: "Красная Земля помнит справедливость Императора" #NT!
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_diplomacy: "Дипломатия Конгресса" #NT!
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_diplomacy: "Прецедент мира на дипломатическом конгрессе, где споры между суверенными государствами разрешаются путем переговоров между собравшимися делегатами, а не на поле боя." #NT!
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_tolerance: "Религиозное сосуществование" #NT!
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_tolerance: "Гарантия конфессиональных прав: католические, лютеранские и кальвинистские общины могут свободно исповедовать свою веру, и ни один государь не может навязывать обращение подданным признанной конфессии." #NT!
 nd_wes.2.t: "Вестфальский мир" #NT!
 nd_wes.2.d: "После десятилетий опустошения, в результате которого погибли миллионы людей и остались безлюдными целые регионы, враждующие державы Европы собрались в наших городах Мюнстер и Оснабрюк. Переговоры длились годы, в них участвовало более сотни делегаций, но наконец договоры заключены.\n\nВестфальский мир устанавливает принципы, которые изменят мир: суверенное равенство государств, право каждого принца определять религию своего королевства и разрешение споров посредством дипломатического конгресса, а не крестового похода. Наши города дали имя новому порядку.\n\nКак мы будем чтить наследие этого мира?" #NT!
 nd_wes.2.a: "Поддерживайте конгрессную систему дипломатии" #NT!
 nd_wes.2.b: "Закрепить права всех конфессий" #NT!
 STATIC_MODIFIER_NAME_nd_wes_napoleonic_reform: "Код Наполеона" #NT!
 STATIC_MODIFIER_DESC_nd_wes_napoleonic_reform: "Кодекс Наполеона отменил феодальные привилегии, отменил крепостное право и установил равенство перед законом. Вестфалия становится первым немецким государством с современной писаной конституцией." #NT!
 nd_wes.3.t: "Кодекс Наполеона в Вестфалии" #NT!
 nd_wes.3.d: "Для Вестфалии наступает новая эра. Феодальный порядок, управлявший этими землями на протяжении веков, демонтируется. Была провозглашена писаная конституция (первая в своем роде в любом немецком государстве), устанавливающая централизованную администрацию, выборный законодательный орган и революционный принцип равенства перед законом.\n\nКрепостное право отменено. Гильдии теряют свои монополии. Впервые евреи получают полное юридическое равенство. Кодекс Наполеона заменяет лоскутное одеяло местных обычаев и привилегий единой рациональной правовой базой. Сохранятся ли эти реформы, зависит от того, что произойдет дальше, но Вестфалия никогда не будет прежней." #NT!
 nd_wes.3.a: "Старый порядок уступает место разуму" #NT!
 nd_wes_formed_tt: "была образована Вестфалия." #NT!
 nd_wes_path_a_tt: "Вестфалия стремится к суверенному равенству" #NT!
 nd_wes_path_b_tt: "Вестфалия поддерживает справедливость Красной Земли" #NT!
 nd_wes_hellweg_salt_trade: "Торговля солью Хеллвег" #NT!
 nd_wes_hellweg_salt_trade_desc: "Природные соляные источники вдоль реки Хелльвег, древнего торгового пути с востока на запад через Вестфалию, с древних времен поддерживали процветающую соляную промышленность. Такие города, как Зост, Унна, Верль и Зальцкоттен, разбогатели благодаря испарению рассола в белое золото, которое сохраняло рыбу, коптило мясо и питало ганзейскую торговую сеть." #NT!
 nd_wes_vehmic_courts: "Вехмические суды" #NT!
 nd_wes_vehmic_courts_desc: "Vehmgerichte Вестфалии — уникальное судебное учреждение: тайные трибуналы народных заседателей, уполномоченные самим императором выносить смертные приговоры. Действуя в Дортмунде и по всей Красной Земле, эти суды обеспечивают порядок там, где обычное правосудие терпит неудачу, а их приговоры исполняются связанными присягой Фрейшоффенами, которые могут преследовать осужденных по всей Империи." #NT!
 nd_wes_soest_municipal_law: "Муниципальное право Зоста" #NT!
 nd_wes_soest_municipal_law_desc: "Муниципальный кодекс Зоста, один из самых ранних и влиятельных в средневековой Германии, послужил образцом для десятков городов по всей Империи. Его положения о гражданском самоуправлении, рыночном регулировании и правовом процессе сделали вестфальские города центрами правовых инноваций." #NT!
 nd_wes_dortmund_market_rights: "Рыночные права Дортмунда" #NT!
 nd_wes_dortmund_market_rights_desc: "Статус имперского свободного города и рыночные привилегии Дортмунда сделали его самым важным ганзейским городом в Вестфалии. Его Ратуша служила резиденцией гражданского управления и коммерческого арбитража, модели городского самоуправления, которой подражали во всем регионе." #NT!
 nd_wes_hanseatic_commerce: "Ганзейская торговля" #NT!
 nd_wes_hanseatic_commerce_desc: "Дортмунд и Зост входят в число самых важных ганзейских городов Вестфалии. Их купцы торгуют солью, металлическими изделиями и тканями по маршруту Хельвег и через ганзейские сети, простирающиеся от Новгорода до Лондона, принося богатство и космополитические связи в сердце Вестфалии." #NT!
 nd_wes_freischoffen_tradition: "Фрайшоффенская традиция" #NT!
 nd_wes_freischoffen_tradition_desc: "Свободные судьи судов Vehmic набираются из свободных людей Вестфалии, связанных священными клятвами поддерживать имперское правосудие. Их боевая дисциплина и непоколебимая приверженность порядку делают их грозной городской милицией: солдатами, которые сражаются не за зарплату, а за закон." #NT!
 nd_wes_hellweg_infrastructure: "Хеллвег Инфраструктура" #NT!
 nd_wes_hellweg_infrastructure_desc: "Хелльвег, пересекающий Вестфалию от Дуйсбурга до Падерборна, является одним из старейших и важнейших торговых путей Германии. Инвестиции в содержание дорог, строительство мостов и промежуточных станций превращают ее из средневековой дороги в настоящую коммерческую магистраль." #NT!
 nd_wes_circle_assembly: "Круговая сборка" #NT!
 nd_wes_circle_assembly_desc: "Нижнерейнско-Вестфальский круг, один из Имперских кругов, созданный реформой Максимилиана I в 1512 году, обеспечивает форум для коллективного управления. Его собрания координируют налогообложение, военные взносы и разрешение споров между различными светскими и церковными территориями Круга." #NT!
 nd_wes_sauerland_ironworks: "Зауэрландский металлургический завод" #NT!
 nd_wes_sauerland_ironworks_desc: "Горы Зауэрланд на юге Вестфалии богаты железной рудой, лесами для производства древесного угля и быстрыми ручьями для производства гидроэнергии. Доменные печи, работающие на древесном угле, и молоты с водяным приводом производят оружие, инструменты и изделия из металла, которые снабжают рынки по всей Империи." #NT!
 nd_wes_soest_feud_legacy: "Наследие Зост Фьюда" #NT!
 nd_wes_soest_feud_legacy_desc: "Зостская вражда 1444–1449 годов, когда самый богатый город Вестфалии бросил вызов архиепископу Кельна и выдержал пятилетнюю осаду, продемонстрировала, что вестфальские города будут яростно бороться за свою автономию. Наследие этого упорного сопротивления сформировало оборонительные традиции Вестфалии." #NT!
 nd_wes_kreistruppen_obligation: "Крайструппенское обязательство" #NT!
 nd_wes_kreistruppen_obligation_desc: "Нижнерейнско-Вестфальский круг несет обязательные обязательства по поставке воинских контингентов в рейхсармию. Эти Kreistruppen, набранные из светских и церковных сословий под надзором окружных полковников, образуют дисциплинированную оборонительную пехоту, подготовленную для защиты границ и имперских кампаний." #NT!
 nd_wes_westphalian_printing: "Вестфальская печать" #NT!
 nd_wes_westphalian_printing_desc: "Типография быстро распространяется по городским центрам Вестфалии, выпуская богословские трактаты, юридические комментарии и коммерческую корреспонденцию. Мюнстер, Кёльн и Дортмунд становятся региональными центрами печатной культуры, ускоряя распространение грамотности и обучения." #NT!
 nd_wes_sauerland_arms_trade: "Торговля оружием Зауэрланд" #NT!
 nd_wes_sauerland_arms_trade_desc: "Железные кузницы Зауэрланда удовлетворяют не только местные нужды, но и способствуют растущей экспортной торговле огнестрельным оружием и оружием. Вестфальские изделия из металла завоевывают репутацию благодаря качеству, конкурируя с оружейными заводами Нюрнберга и Льежа.\n\n#italic Доступно в: $nd_wes_sauerland_forge$#!" #NT!
 nd_wes_peace_of_westphalia: "Вестфальский мир" #NT!
 nd_wes_peace_of_westphalia_desc: "Вестфальский мир, подписанный в Мюнстере и Оснабрюке в 1648 году, положил конец Тридцатилетней войне и установил принципы суверенной государственности и религиозной терпимости, которые до сих пор определяют международные отношения. Вестфалия дала название новому мировому порядку." #NT!
 nd_wes_linen_industry: "Вестфальская льняная промышленность" #NT!
 nd_wes_linen_industry_desc: "Восточная Вестфалия с центром в Билефельде и Оснабрюке превращается в один из ведущих регионов Германии по производству льна. Сельские ткачи перерабатывают выращенный здесь лен в ткань, которую вестфальские купцы экспортируют на рынки Нидерландов, Англии и других стран." #NT!
 nd_wes_confessional_balance: "Конфессиональный баланс" #NT!
 nd_wes_confessional_balance_desc: "Религиозное урегулирование после опустошительной Тридцатилетней войны устанавливает хрупкий баланс между католическими и протестантскими общинами в Вестфалии, где смешанное население требует прагматического сосуществования, а не принудительного подчинения." #NT!
 nd_wes_imperial_circle_defense: "Защита Имперского Круга" #NT!
 nd_wes_imperial_circle_defense_desc: "Нижнерейнско-Вестфальский круг координирует коллективную оборону посредством программ фортификации, гарнизонных обязательств и совместных военных учений. Пожертвования Круга укрепляют пограничную оборону и поддерживают имперские кампании против внешних угроз." #NT!
 nd_wes_line_infantry_reform: "Вестфальская линейная пехота" #NT!
 nd_wes_line_infantry_reform_desc: "Французские военные реформы преобразуют Вестфальские войска в современные полки линейной пехоты, обученные новейшим тактическим доктринам и оснащенные стандартным вооружением. Эти профессиональные солдаты представляют собой решительный отход от старых традиций милиции." #NT!
 nd_wes_constitutional_experiments: "Конституционные эксперименты" #NT!
 nd_wes_constitutional_experiments_desc: "Вестфалия становится лабораторией конституционного управления, экспериментируя с письменными конституциями, представительными собраниями и административной рационализацией, которые предвещают более широкое немецкое конституционное движение." #NT!
 nd_wes_textile_expansion: "Текстильная экспансия" #NT!
 nd_wes_textile_expansion_desc: "Вестфальское льняное производство расширяется от надомного производства до организованного производства, при этом купцы координируют сети сельских прядильщиков и ткачей. На отбеливающих полях Билефельда обрабатывается ткань для экспортных рынков по всей Европе.\n\n#italic Доступно в: $nd_wes_linen_house$#!" #NT!
 nd_wes_napoleonic_code: "Кодекс Наполеона" #NT!
 nd_wes_napoleonic_code_desc: "Введение Кодекса Наполеона в Вестфальском королевстве отменяет феодальные привилегии, устанавливает равенство перед законом и создает первую современную конституцию в истории Германии. Эти реформы, хотя и навязанные извне, оставляют неизгладимый след в правовых и административных традициях Вестфалии." #NT!
 nd_wes_industrial_awakening: "Промышленное пробуждение" #NT!
 nd_wes_industrial_awakening_desc: "Переход от водяных кузниц к паровым фабрикам преобразует экономику Вестфалии. Традиции металлообработки Зауэрланда и угольные месторождения Рура образуют один из первых промышленных регионов Германии.\n\n#italic Доступно в: $nd_wes_sauerland_forge$#!" #NT!
 nd_wes_sovereign_equality: "Суверенное равенство" #NT!
 nd_wes_sovereign_equality_desc: "Вестфальский принцип суверенного равенства (каждое государство, независимо от размера и мощи, обладает неотъемлемыми правами на самоуправление) из дипломатического средства превращается в основополагающую доктрину международного права." #NT!
 nd_wes_civic_emancipation: "Гражданское освобождение" #NT!
 nd_wes_civic_emancipation_desc: "Наследие наполеоновской реформы приносит свои плоды, поскольку городское население Вестфалии обретает новые свободы: отмену цеховых монополий, юридическое равенство независимо от веры и возникновение современного гражданского общества из остатков феодальных повинностей." #NT!
 nd_wes_hellweg_saltworks: "Соляной завод Хеллвег" #NT!
 nd_wes_hellweg_saltworks_desc: "Установки для выпаривания рассола вдоль торгового маршрута Хеллвег, где природные соляные источники направляются в градуированные выпарные башни и котельные для производства соли для торговли." #NT!
 nd_wes_vehmic_tribunal: "Вемический трибунал" #NT!
 nd_wes_vehmic_tribunal_desc: "Зал трибунала Vehmgericht, где свободные судьи Императора проводят суд под присягой секретности, отправляя смертное правосудие от имени имперской власти на Красной Земле Вестфалии." #NT!
 nd_wes_hanseatic_kontor: "Ганзейский Контор" #NT!
 nd_wes_hanseatic_kontor_desc: "Вестфальский торговый дом в ганзейских традициях, где торговцы из Дортмунда и Зоста складируют товары, заключают контракты и поддерживают коммерческие сети, которые соединяют Хеллвег с более широким ганзейским миром." #NT!
 nd_wes_sauerland_forge: "Зауэрландская кузница" #NT!
 nd_wes_sauerland_forge_desc: "Кузница для железной руды, работающая на древесном угле, в горах Зауэрланд, где используются водяные мехи и молотки для выплавки руды и производства оружия, инструментов и металлических изделий из богатых месторождений Вестфалии." #NT!
 nd_wes_linen_house: "Льняной дом" #NT!
 nd_wes_linen_house_desc: "Вестфальская текстильная мастерская, где местный лен перерабатывается в льняную ткань путем прядения, ткачества и отбеливания: основа протоиндустриальной системы производства с центром в Билефельде." #NT!
 nd_wes_rathaus: "Вестфальская ратуша" #NT!
 nd_wes_rathaus_desc: "Гражданская ратуша в великих вестфальских традициях, резиденция муниципального самоуправления, где избранные советы горожан отправляют правосудие, регулируют рынки и управляют делами гордых, независимых торговых городов." #NT!
 nd_wes_pm_brine_evaporation: "Испарение рассола" #NT!
 nd_wes_pm_brine_evaporation_desc: "Природный рассол из соляных источников Вестфалии нагревается в котельных, работающих на местной древесине, а выпарные котлы, облицованные камнем, производят кристаллизованную соль для Ганзейской торговой сети." #NT!
 nd_wes_pm_saltworks_maintenance: "Содержание соляного завода" #NT!
 nd_wes_pm_saltworks_maintenance_desc: "Техническое обслуживание градуированных выпарных башен, котельных и соляных каналов соляного завода Хеллвег." #NT!
 nd_wes_pm_tribunal_maintenance: "Содержание Трибунала" #NT!
 nd_wes_pm_tribunal_maintenance_desc: "Ведение записей, печатей и исполнительного аппарата судебной системы Vehmic." #NT!
 nd_wes_pm_kontor_maintenance: "Содержание Контора" #NT!
 nd_wes_pm_kontor_maintenance_desc: "Ведение складов, бухгалтерской книги и торговой инфраструктуры Ганзейского торгового дома." #NT!
 nd_wes_pm_charcoal_smelting: "Выплавка древесного угля" #NT!
 nd_wes_pm_charcoal_smelting_desc: "Железную руду с холмов Зауэрланда плавят в угольных доменных печах и перековывают в оружие и инструменты с помощью водяных молотов." #NT!
 nd_wes_pm_industrial_steel: "Промышленная сталь" #NT!
 nd_wes_pm_industrial_steel_desc: "Переход на коксовые печи и бессемеровские конвертеры обеспечивает массовое производство стали, превращая Зауэрланд из традиционного региона обработки железа в центр современной тяжелой промышленности." #NT!
 nd_wes_pm_forge_maintenance: "Содержание кузницы" #NT!
 nd_wes_pm_forge_maintenance_desc: "Обслуживание печей, водяных колес и кузнечных цехов железных кузниц Зауэрланда." #NT!
 nd_wes_pm_linen_weaving: "Льняное Ткачество" #NT!
 nd_wes_pm_linen_weaving_desc: "Из местного льна прядут нити и ткут льняную ткань на ручных ткацких станках, а затем отбеливают на знаменитых отбеливающих полях Билефельда." #NT!
 nd_wes_pm_linen_maintenance: "Уход за льняным домом" #NT!
 nd_wes_pm_linen_maintenance_desc: "Содержание ткацких станков, отбельных полей и прядильного оборудования Вестфальских льняных мастерских." #NT!
 nd_wes_pm_rathaus_maintenance: "Содержание Ратхауса" #NT!
 nd_wes_pm_rathaus_maintenance_desc: "Ведение гражданского учета, палат совета и административной инфраструктуры Вестфальской ратуши." #NT!
 a_nd_wes_kreistruppen: "Крайструппен" #NT!
 a_nd_wes_kreistruppen_desc: "Дисциплинированная пехота Нижнерейнско-Вестфальского круга, собранная из светских и церковных сословий для выполнения обязательных военных обязательств Круга перед Рейхсармией. Прошел подготовку по охране границ и фортификационным обязанностям." #NT!
 a_nd_wes_freischoffen: "Фрайшоффен Гвардия" #NT!
 a_nd_wes_freischoffen_desc: "Городская милиция, состоящая из свободных судей судов Вемиков, связанных с присягой людей Вестфалии, которые служат исполнителями имперского правосудия. Их дисциплина и инициатива отражают традицию Vehmic решительной, непреклонной власти." #NT!
 a_nd_wes_line_regiment: "Вестфальский линейный полк" #NT!
 a_nd_wes_line_regiment_desc: "Профессиональная линейная пехота, обученная современной тактической доктрине, оснащенная стандартными мушкетами и штыками. Вестфальская линия представляет собой преобразование феодальной милиции в дисциплинированную постоянную армию." #NT!
 levy_nd_wes_freischoffen: "Фрайшоффен Гвардия" #NT!
 levy_nd_wes_freischoffen_desc: "Городское ополчение, состоящее из свободных судей, связанных с присягой, сформированных из бюргеров и солдат Вестфалии для обеспечения соблюдения власти судов Vehmic." #NT!
 levy_nd_wes_kreistruppen: "Крайструппен" #NT!
 levy_nd_wes_kreistruppen_desc: "Пехота кругового ополчения, собранная из вестфальских поместий для выполнения военных обязательств Нижнерейнско-Вестфальского круга перед рейхсармией." #NT!
 nd_wes_destiny: "Вестфальская судьба" #NT!
 nd_wes_destiny_desc: "Вестфалия восстала. Земли между Рейном и Везером объединены, и будущее простирается перед нами. Наша судьба ждет нас, будь то перо дипломатии или меч правосудия." #NT!
 nd_wes_dest_congress: "Конгресс Наций" #NT!
 nd_wes_dest_congress_desc: "Сделать Вестфалию центром международной торговли и дипломатии. Обеспечьте контроль над торговыми сетями Амстердама и примите участие в финансовых институтах, которые будут финансировать наше видение суверенного равенства между странами." #NT!
 nd_wes_dest_balance: "Баланс сил" #NT!
 nd_wes_dest_balance_desc: "Вестфальская система требует не только принципов, но и власти для их соблюдения. Расширьте наше влияние на Гаагу, увеличьте нашу казну и развивайте наши земли, чтобы поддерживать дипломатическое присутствие, достойное наших идеалов." #NT!
 nd_wes_dest_eternal_peace: "Вечный мир" #NT!
 nd_wes_dest_eternal_peace_desc: "Высшее выражение Вестфальского суверенитета: мировой порядок, в котором споры разрешаются разумом, а не силой. Доберитесь до Женевы, примите научную революцию и создайте институты прочного мира." #NT!
 nd_wes_dest_vehme: "Асцендент Вехме" #NT!
 nd_wes_dest_vehme_desc: "Вехмические суды Красной Земли расширят свою сферу влияния. Подчините Кельн и Кассель нашей власти, доказав, что правосудие Императора не знает границ. Сохраняйте стабильность, пока мы расширяем нашу юрисдикцию." #NT!
 nd_wes_dest_landfriede: "Вечная Ландфрида" #NT!
 nd_wes_dest_landfriede_desc: "Ландфриден, клятва мира королевства, требует соблюдения. Захватите Франкфурт, резиденцию императорских коронаций, и Брауншвейг на востоке. Создайте армию, способную навести порядок на немецких землях." #NT!
 nd_wes_dest_reichsgericht: "Императорский трибунал" #NT!
 nd_wes_dest_reichsgericht_desc: "Правосудие Красной Земли простирается от Северного моря до Альп. Возьмите Магдебург и Нюрнберг, великие имперские города, и создайте высший трибунал, который будет управлять немецкой нацией посредством закона, подкрепленного силой." #NT!
 nd_wes.4.t: "Судьба Вестфалии" #NT!
 nd_wes.4.d: "Вестфалия едина, ее народ процветает, а границы безопасны. Но единство само по себе не является судьбой. Мир наблюдает, чтобы увидеть, чем станет Вестфалия: маяком суверенного равенства, который изменит международный порядок, или крепостью имперского правосудия, которая наложит закон на хаос конкурирующих государств.\n\nНаш путь выбран. Теперь мы должны пройти его." #NT!
 nd_wes.4.a: "Наша судьба ждет" #NT!
 nd_wes.5.t: "Конгресс созывает" #NT!
 nd_wes.5.d: "Крупнейшие конторы Амстердама теперь подчиняются властям Вестфалии. Торговые князья дельты Рейна, банкиры, финансирующие войны королей, — все признают наш суверенитет. Имея в своем распоряжении эту коммерческую силу, Вестфалия может созвать конгресс наций не как нейтральный наблюдатель, а как держава, чье слово весит золото.\n\nПервый конгресс Вестфальской дипломатии создаст прецедент для нового типа международного порядка." #NT!
 nd_wes.5.a: "Пусть народы займут свои места" #NT!
 nd_wes.6.t: "Красная Земля расширяется" #NT!
 nd_wes.6.d: "Великий Кёльнский собор теперь находится под нашей юрисдикцией. Древние претензии архиепископа на верховенство над Вестфалией угасли: правосудие в этих землях отправляют вемские суды, а не епископская кафедра. В Касселе гессенские лорды подчиняются вестфальским законам.\n\nСудьи Vehmgericht в капюшонах едут дальше, чем когда-либо прежде. Куда бы они ни пошли, там следует порядок." #NT!
 nd_wes.6.a: "Правосудие Императора простирается далеко" #NT!
 nd_wes.7.t: "Баланс сил" #NT!
 nd_wes.7.d: "Из Гааги дипломаты Вестфалии обеспечивают хрупкое равновесие между державами Европы. Наша казна полна, наши земли развиты, наши учреждения созревают. Теперь вопрос в том, как использовать эту позицию.\n\nДолжны ли мы создать постоянные международные арбитражные суды, где споры между суверенными государствами разрешаются на основе разума и закона? Или нам следует придерживаться вооруженного нейтралитета, создавая казну, которая сделает Вестфалию незаменимой для всех воюющих сторон, сохраняя при этом мир в наших собственных армиях?" #NT!
 nd_wes.7.a: "Основаны суды международного арбитража" #NT!
 nd_wes.7.b: "Проводить политику выгодного нейтралитета" #NT!
 nd_wes.8.t: "Вечная Ландфрида" #NT!
 nd_wes.8.d: "Франкфурт и Брауншвейг подчинились власти Вестфалии. Ландфриден (заклятый общественный мир Империи) — это уже не мечта, а реальность, навязанная Вестфальским оружием. Наша армия марширует туда, куда постановят суды Вемиков, и ни один лорд не смеет нарушить мир.\n\nНо для обеспечения соблюдения закона требуется система. Должны ли мы централизовать власть в руках Короны, управляя посредством железного указа? Или нам следует организовать Имперские круги в коллективную оборону, в ополчение королевства, которое обеспечивает порядок посредством общих обязательств?" #NT!
 nd_wes.8.a: "Правило посредством железного указа Короны" #NT!
 nd_wes.8.b: "Организуйте Круги в общую милицию." #NT!
 nd_wes.9.t: "Вечный мир" #NT!
 nd_wes.9.d: "Женева находится в пределах нашей досягаемости. Научная революция открыла разум для разума. Вестфалия находится на вершине своей дипломатической мощи, являясь воплощением принципа, который носит ее название: суверенное равенство всех государств, больших и малых.\n\nЗал Мира ждет своей цели. Станет ли он святыней универсальных прав человека, где признается достоинство каждого человека, независимо от рождения и вероисповедания? Или он станет двигателем порядка свободной торговли, где торговля между странами протекает беспрепятственно, а богатство обеспечивает мир, чего не могут сделать армии?" #NT!
 nd_wes.9.a: "Провозгласить универсальные права всех людей" #NT!
 nd_wes.9.b: "Построить порядок свободной торговли между суверенными странами" #NT!
 nd_wes.10.t: "Императорский трибунал" #NT!
 nd_wes.10.d: "Магдебург и Нюрнберг подчиняются власти Вестфалии. От Северного моря до самого сердца Империи правит справедливость Красной Земли. Ни один принц не бросит вызов трибуналу, ни один бандит не ускользнет от судей в капюшонах, ни один бунт не останется безнаказанным.\n\nВерховный суд королевства теперь должен выбрать своего персонажа. Будет ли он служить инструментом имперского порядка, проецируя военную мощь для обеспечения мира? Или он должен стать народным судом, объединяющим завоеванные территории посредством закона и справедливости, а не гарнизона и меча?" #NT!
 nd_wes.10.a: "Трибунал служит императорскому порядку" #NT!
 nd_wes.10.b: "Пусть суд служит народному правосудию" #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_arbitration: "Арбитражный суд" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_arbitration: "Вестфальский арбитражный суд выступает посредником в спорах между суверенными государствами, разрешая конфликты посредством юридических рассуждений, а не силы. Его постановления имеют моральный авторитет во всей Европе." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_neutrality: "Вооруженный нейтралитет" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_neutrality: "Вестфалия поддерживает выгодный нейтралитет, финансируя войны других, сохраняя при этом мир в своих армиях. Меньшее военное истощение и более дешевые кредиты компенсируют затраты на поддержание боеготовности." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_universal_rights: "Универсальные права" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_universal_rights: "Вестфальская декларация всеобщих прав признает неотъемлемое достоинство каждого человека, независимо от рождения, вероисповедания или национальности. Развитие процветает при новом порядке, хотя население становится довольным своим процветанием." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_free_trade_order: "Свободный торговый порядок" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_free_trade_order: "Вестфальский порядок свободной торговли открывает рынки через суверенные границы, обогащая всех участников за счет неограниченной торговли. Военный истеблишмент сокращается, поскольку торговля заменяет завоевания." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_iron_law: "Железный закон" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_iron_law: "Железный указ Вестфальской короны не терпит инакомыслия. Централизованная власть и бдительная тайная полиция обеспечивают порядок по всему королевству, хотя аппарат контроля становится все больше." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_circle_militia: "Круговая милиция" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_circle_militia: "Имперские Круги организованы в коллективные силы обороны, каждая территория предоставляет войска и припасы. Быстрая вербовка и надежная логистика обходятся ценой военного престижа." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_imperial_order: "Императорский Орден" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_imperial_order: "Вестфальский трибунал использует военную силу для обеспечения имперского мира. Превосходная тактика и право вести справедливую войну делают армии королевства грозным инструментом порядка." #NT!
 STATIC_MODIFIER_NAME_nd_wes_dest_peoples_court: "Народное правосудие" #NT!
 STATIC_MODIFIER_DESC_nd_wes_dest_peoples_court: "Вестфальский народный суд объединяет завоеванные территории посредством справедливого применения закона, а не военной оккупации. Опустошенные земли восстанавливаются быстрее при справедливом управлении, а иностранные подданные принимают Вестфальское правление." #NT!
 nd_wes_friedenssaal: "Фриденсаал" #NT!
 nd_wes_friedenssaal_desc: "Зал Мира, вдохновленный комнатой в Мюнстерской Ратуше, где был подписан Вестфальский мир. Центр дипломатического посредничества и международного арбитража, где принцип суверенного равенства обретает физическую форму в камне, стекле и пергаменте." #NT!
 nd_wes_pm_friedenssaal_maintenance: "Содержание Зала Мира" #NT!
 nd_wes_pm_friedenssaal_maintenance_desc: "Поддержание дипломатических архивов, конференц-залов и церемониальной обстановки Фриденсзаала." #NT!
 nd_wes_high_court: "Вестфальский Высокий суд" #NT!
 nd_wes_high_court_desc: "Высший трибунал Вестфальской юстиции, наследник древней традиции Вемиков, но действующий в имперском масштабе. Судьи в мантиях вершат законы страны в укрепленном здании суда при поддержке вооруженных судебных приставов и обширного архива судебных прецедентов." #NT!
 nd_wes_pm_high_court_maintenance: "Содержание Высокого суда" #NT!
 nd_wes_pm_high_court_maintenance_desc: "Ведение судебных архивов, залов судебных заседаний и исполнительного аппарата Высокого суда Вестфалии." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_wes_bureaucracy_authority: "Вестфальский институциональный орган" #NT!
 AUTO_MODIFIER_DESC_nd_wes_bureaucracy_authority: "Сеть соборных капитулов Вестфалии, сопрезидентства Имперского круга, ганзейских кварталов и свободных судов Вемика может поддерживать настоящие институциональные министерства: наряду с постоянным местом столицы Вестфальское государство может управлять еще двумя бюрократиями по своему выбору." #NT!
  
 wes_reichskreis_bureaucracy: "Вестфальский рейхскрайс" #NT!
 wes_reichskreis_bureaucracy_desc: "Вестфальский имперский круг, созданный реформами Рейхстага 1500 и 1512 годов, один из десяти региональных округов, которые координировали оборону, исполняли имперские законы и распределяли военный налог Рёмермоната между территориальными членами. Под руководством епископа Мюнстера и герцога Клевского-Юлиха Крайстаг законодательно устанавливал региональные сборы, регулировал чеканку монет и следил за состоянием Ландфридена, а после 1648 года стал механизмом Фриденсволльцуга, выполняющим территориальные и конфессиональные положения Вестфальского мира." #NT!
  
 wes_femgericht_bureaucracy: "Федеральный суд" #NT!
 wes_femgericht_bureaucracy_desc: "Свободные суды Фемиков, тайные трибуналы которых заседали в Freistühle в Дортмунде, Арнсберге и Вольмарштайне и достигли своего апогея между 1300 и 1500 годами. Действуя под номинальной властью архиепископа Кельна как герцога Вестфальского, Femgericht вызывал подсудимых по запечатанным приказам и исполнял приговоры (почти всегда висящие) через Фронботен по всей Империи. Свободные судьи, присягнувшие хранить тайну под страхом смерти, набирались из числа присягнувших свободных людей, а не из территориальной знати, что делало Веме параллельным судом, который обходил сеньорские суды вестфальской аристократии." #NT!
  
 wes_domkapitel_bureaucracy: "Домкапитель дер Штифтер" #NT!
 wes_domkapitel_bureaucracy_desc: "Кафедральные капитулы Мюнстера, Падерборна и Оснабрюка, избиравшие князей-епископов Вестфалии из числа имперского рыцарства. Канонизму требовался Аненпроб (доказательство шестнадцати благородных предков), что делало каждое отделение закрытым аристократическим заповедником. Главы разработали избирательные капитуляции, которые ограничивали каждого нового принца-епископа, и через характерный для Мюнстера патрициат Эрбманнер объединили территориальную церковь с городской диетой, чтобы создать характерное для Вестфалии аристократически-бюргерское управление." #NT!
  
 wes_hansedrittel_bureaucracy: "Вестфальский Ганзедриттель" #NT!
 wes_hansedrittel_bureaucracy_desc: "Вестфальская треть Ганзейского союза, одна из трех третей голосующих в Ганзетаг, в которую входят Дортмунд, Зост, Мюнстер, Липпштадт, Оснабрюк и члены Маас-Нидеррейн. Квартал координировал сбор пошлин на Хеллвег, управлял Конторе в Бергене и Брюгге через назначенного Эльтерманнера, защищал городские свободы от территориальных князей и наказывал города-члены посредством Верхансунга: временное исключение из лиги. Под руководством Соеста он доминировал во внутренней торговле солью и зерном, пока Тридцатилетняя война не разрушила его коммерческую сеть." #NT!
  
 wes_markgenossenschaft_bureaucracy: "Маркгеноссеншафт" #NT!
 wes_markgenossenschaft_bureaucracy_desc: "Вестфальские общинные собрания, которые управляли лесами, пастбищами, торфом и водами присяжными сельскими советами в соответствии с кодифицированным Markenrechte, под председательством Holzgrafen в Markdinge. В сочетании с характерным владением Eigenbehörige (когда крестьяне были лично связаны с поместьем, но владели наследственными участками и значимым общественным голосом), Markgenossenschaft давал вестфальским сельским жителям большую безопасность, чем когда-либо имели восточно-эльбские крепостные Gutsherrschaft, и пережил все территориальные реформы до тех пор, пока Markenteilungen девятнадцатого века не разрушил общинные земли." #NT!
