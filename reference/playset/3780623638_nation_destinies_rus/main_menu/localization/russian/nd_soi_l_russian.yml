l_russian:
 STATIC_MODIFIER_NAME_nd_pearl_of_the_indian_ocean: "Жемчужина Индийского океана" #NT!
 STATIC_MODIFIER_DESC_nd_pearl_of_the_indian_ocean: "Порты Могадишо, Мерка и Барава стоят как драгоценности вдоль побережья Бенадира, их гавани заполнены судами, перевозящими ткани, слоновую кость и специи в Аравию, Индию и за ее пределы. Сомалийские купцы оседлали муссонные ветры с уверенностью поколений, а иностранные торговцы знают, что богатства Индийского океана проходят через руки Сомали." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_waters: "Повелители вод" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_waters: "Наследие Аджурана сохранилось в известняковых колодцах и оросительных каналах, которые заставляют расцветать засушливые внутренние районы. Тот, кто контролирует воду, контролирует людей, и централизованная администрация, выросшая вокруг этих гидротехнических сооружений, создала государство, более сильное и более единое, чем его соседи, способное кормить армии и растить города там, где другие видят только пыль." #NT!
 nd_soi.1.t: "Объединение Сомали" #NT!
 nd_soi.1.d: "От древних портов Зейлы и Берберы на севере до легендарных гаваней Могадишо и Мерки на побережье Бенадира — сомалийские земли объединены под одним знаменем. На протяжении веков сомалийцы были торговцами и воинами, их дау справлялись с муссонными ветрами Индийского океана, а их всадники путешествовали по Африканскому Рогу. Аджуранские султаны построили гидравлическую империю вокруг вод Джуббы и Шабелле, а купцы Могадишо чеканили собственные монеты и ткали ткани, ценимые от Египта до Индии.\n\nТеперь кланы объединились. Но что будет определять эту новую нацию: внешние границы ее купцов за морями или внутреннюю силу ее вод и управления?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_soi.1.a: "Мы торговцы муссонами." #NT!
 nd_soi.1.b: "Мы хозяева колодцев." #NT!
 nd_soi.2.t: "Покорение высокогорья" #NT!
 nd_soi.2.d: "В 1529 году имам Ахмад ибн Ибрагим аль-Гази, известный как Гурей, Левша, начал кампанию из султаната Адал, которая потрясла основы христианской Абиссинии. Сомалийские и афарские всадники, вооруженные саблями с рынков Зейлы и Аравии, пронеслись по эфиопскому нагорью, одержав серию сокрушительных побед. В течение десятилетия три четверти Эфиопской империи оказались под контролем мусульман.\n\nФутух аль-Хабаша, завоевание Абиссинии, продемонстрировало ударную мощь сомалийской кавалерии и масштабы сомалийских амбиций. Всадники Ахмада носили закрывающие лица шлемы и нагрудники, их скакуны были снабжены такой же броней, и они использовали тактику «нападай и беги», идеально подходящую для пересеченной местности. Хотя сам Ахмад пал в 1543 году, эти кампании доказали, что сомалийские военные традиции могут бросить вызов даже величайшим державам Восточной Африки.\n\nПримем ли мы дух кампаний Ахмада Гурея или будем искать силы посредством дипломатии?" #NT!
 nd_soi.2.a: "Спешите вперед, как ехал Ахмад Гурей." #NT!
 nd_soi.2.b: "Создавайте союзы, а не завоевания." #NT!
 nd_soi.3.t: "Османско-сомалийский пакт" #NT!
 nd_soi.3.d: "Когда португальские военные корабли появились у берегов Бенадира в начале шестнадцатого века, разграбили Бараву в 1507 году и разрушили Могадишо в 1542 году, сомалийские города-государства осознали, что ни одна держава не может противостоять европейской военно-морской мощи в одиночку. Аджуранский султанат обратился к Османской империи, и в 1580-х годах сложилось замечательное сотрудничество. Сомалийские флотилии присоединились к турецкому корсару Мир Али Бею в совместной экспедиции, которая вытеснила португальцев из Пате, Момбасы и Килвы.\n\nПрибрежные сторожевые башни, оснащенные телескопами дальнего действия, сканировали горизонт на наличие враждебных парусов, в то время как сомалийские галеры патрулировали воды между Могадишо и побережьем Суахили. Альянс продемонстрировал, что державы Индийского океана могут противостоять европейскому вторжению посредством единства и стратегического сотрудничества." #NT!
 nd_soi.3.a: "Море принадлежит тем, кто его защищает." #NT!
 nd_soi.4.t: "Монеты султанов" #NT!
 nd_soi.4.d: "Султанат Могадишо стал одним из немногих африканских государств, чеканивших собственные монеты, что является свидетельством сложности его коммерческих сетей. Валюта Могадишо носила имена двадцати трех султанов подряд, а ее монеты были найдены даже на территории современных Объединенных Арабских Эмиратов. Чеканка монет централизовала коммерческую гегемонию султаната, что позволило Могадишо устанавливать условия торговли в западной части Индийского океана.\n\nНаряду с этим финансовым нововведением, ткачи города производили знаменитый туб бенадир, ткань настолько тонкую, что Ибн Баттута объявил текстиль Могадишо непревзойденным во время своего визита в 1330 году. К девятнадцатому веку каждый пятый житель Могадишо был ткачи, а ткань экспортировалась в Египет, Сирию и Аравию.\n\nБудем ли мы строить наше богатство на силе нашей валюты или на известности нашей ткани?" #NT!
 nd_soi.4.a: "Пусть наши монеты говорят за нас на каждом рынке." #NT!
 nd_soi.4.b: "Пусть наша одежда окутает мир." #NT!
 nd_soi.5.t: "Восстание Гобруна" #NT!
 nd_soi.5.d: "В конце XVII века, когда Аджуранский султанат раскололся под тяжестью тиранического правления и мятежных кланов, вдоль реки Шабелле возникла новая власть. Семья Гобрун, считающаяся в исламской традиции святыми, объединила клан Геледи в султанат с центром в Афгойе. При династии Гобрун султанат Геледи укрепил контроль над долинами Джубба и Шабелле, а также побережьем Бенадира, разработав новые системы сельского хозяйства и налогообложения.\n\nОпределяющий момент династии наступил в 1843 году, когда силы Геледи выступили против султаната Бардера, строгого религиозного поселения, которое налагало шариатские запреты, угрожающие коммерческим интересам Геледи. Решающая победа при Бардере вновь подтвердила доминирование Геледи на внутренних торговых путях и доказала, что государства-преемники могут проецировать власть так же эффективно, как старый Аджуран.\n\nНаследие Гобруна будет наследием сельскохозяйственного процветания или военной мощи?" #NT!
 nd_soi.5.a: "Реки будут питать великий народ." #NT!
 nd_soi.5.b: "Сила обеспечивает то, что создает процветание." #NT!
 nd_soi.6.t: "Ткацкие станки Бенадира" #NT!
 nd_soi.6.d: "Традиция ткачества на побережье Бенадира является одной из старейших и самых изысканных в Восточной Африке. Прибрежные ремесленники Тунни и другие сомалийские ткачи производят алинди и туб бенадир — ткань, известную под разными названиями во внутренних районах и на побережье, но ценимую повсюду. Когда Ибн Баттута посетил Могадишо в 1330 году, он записал, что ткани города экспортировались в Египет и за его пределы, назвав их не имеющими себе равных.\n\nТкацкие дома Могадишо и Мерки — это не просто мастерские, но центры культурной самобытности, где узоры и техники передаются из поколения в поколение. Каждый рулон ткани несет в себе историю народа, который превратил хлопок и красители в предметы красоты и инструменты торговли." #NT!
 nd_soi.6.a: "Традиция, вплетенная в саму нашу идентичность." #NT!
 nd_soi_xeer_codification: "Кодификация Xeer" #NT!
 nd_soi_xeer_codification_desc: "Сомалийский xeer, свод неписаных норм обычного права, согласованный советами старейшин, регулирует все: от компенсации за кровь до прав на воду. Его кодификация в официальную правовую основу укрепляет клановое управление." #NT!
 nd_soi_pastoral_economy: "Пастырская экономика" #NT!
 nd_soi_pastoral_economy_desc: "Выпас верблюдов, крупного рогатого скота, овец и коз составляет основу экономической жизни Сомали. Овладение пастушескими техниками и обработка шкур создает излишки для торговли." #NT!
 nd_soi_monsoon_navigation: "Муссонная навигация" #NT!
 nd_soi_monsoon_navigation_desc: "Сомалийские моряки уже давно поняли сезонные муссонные ветры, которые соединяют Африканский Рог с Аравией, Индией и другими странами. Эти знания обеспечивают надежную морскую торговлю через Индийский океан." #NT!
 nd_soi_clan_warrior_traditions: "Традиции клановых воинов" #NT!
 nd_soi_clan_warrior_traditions_desc: "Сомалийские кланы сохраняют жестокие воинские традиции, особенно в конном бою. Всадники, вооруженные копьями и саблями, составляют элитную ударную силу сомалийской армии." #NT!
 nd_soi_mogadishu_foundations: "Фонды Могадишо" #NT!
 nd_soi_mogadishu_foundations_desc: "Город Могадишо, основанный арабскими и сомалийскими купцами, превращается в крупный торговый центр мира Индийского океана, его рынки привлекают торговцев со всех трех континентов." #NT!
 nd_soi_islamic_scholarship: "Исламская стипендия" #NT!
 nd_soi_islamic_scholarship_desc: "Сомалийские учёные шафиитской школы юриспруденции завоевали известность во всём мусульманском мире. Такие личности, как Усман бин Али Зайлаи в Египте и Абд аль-Азиз из Могадишо на Мальдивах, несут сомалийское обучение за границу." #NT!
 nd_soi_ajuran_state_formation: "Образование Аджуранского государства" #NT!
 nd_soi_ajuran_state_formation_desc: "Аджуранский султанат создает беспрецедентный на Африканском Роге централизованный административный аппарат, используя контроль над водными ресурсами для построения функционирующего бюрократического государства." #NT!
 nd_soi_ajuran_hydraulic_works: "Аджуранский гидравлический завод" #NT!
 nd_soi_ajuran_hydraulic_works_desc: "Аджуранцы, как водная династия, монополизируют реки Джубба и Шабелле посредством известняковых колодцев, цистерн и ирригационных каналов. Их гидротехника делает засушливые земли продуктивными и привлекает кочевников к поселению." #NT!
 nd_soi_monsoon_trade_routes: "Торговые пути муссонов" #NT!
 nd_soi_monsoon_trade_routes_desc: "Сомалийские купцы устанавливают регулярные торговые маршруты, пользуясь сезонными муссонными ветрами, соединяя Могадишо, Мерку и Бараву с портами Аравии, Индии, Персии и даже Китая." #NT!
 nd_soi_dhow_building: "Здание Доу" #NT!
 nd_soi_dhow_building_desc: "Сомалийские кораблестроители строят быстроходные дау, которые доминируют в торговле в Индийском океане, суда из сшитых досок, предназначенные для того, чтобы преодолевать муссонные ветры и перевозить товары на огромные расстояния с минимальным экипажем." #NT!
 nd_soi_benadir_textile_tradition: "Бенадир Текстильная Традиция" #NT!
 nd_soi_benadir_textile_tradition_desc: "Туб бенадир, тканая ткань, предназначенная для рынков Египта и Сирии, делает Могадишо крупным текстильным центром. Сам Ибн Баттута описывал ткани города как не имеющие себе равных.\n\n#italic Доступно в: $nd_soi_weaving_house$#!" #NT!
 nd_soi_mogadishu_coinage: "Чеканка Могадишо" #NT!
 nd_soi_mogadishu_coinage_desc: "Султанат Могадишо чеканит собственную валюту с именами своих султанов, централизуя коммерческую гегемонию в западной части Индийского океана." #NT!
 nd_soi_adal_cavalry_tactics: "Тактика кавалерии Адала" #NT!
 nd_soi_adal_cavalry_tactics_desc: "Кавалерия Султаната Адал, облаченная в шлемы и нагрудники, закрывающие лицо, применяет разрушительную тактику «нападай и беги». Их всадники везут сабли с рынков Зейлы и Аравии." #NT!
 nd_soi_zeila_gateway: "Зейла Гейтвей" #NT!
 nd_soi_zeila_gateway_desc: "Порт Зейла, главная гавань султаната Адал, служит воротами между Африканским Рогом и Аравийским полуостровом, через который проходят потоки рабов, слоновой кости и товаров." #NT!
 nd_soi_futuh_al_habasha: "Футух аль-Хабаша" #NT!
 nd_soi_futuh_al_habasha_desc: "Завоевание Абиссинии имамом Ахмадом ибн Ибрагимом аль-Гази демонстрирует разрушительное влияние сомалийской кавалерии, поскольку три четверти Эфиопской империи находятся под контролем мусульман." #NT!
 nd_soi_benadir_coastal_defense: "Береговая оборона Бенадира" #NT!
 nd_soi_benadir_coastal_defense_desc: "Аджуранский султанат организует систему береговой обороны от португальских вторжений со сторожевыми башнями, гарнизонными войсками и галерным флотом, защищающими порты Бенадира." #NT!
 nd_soi_benadir_naval_defense: "Бенадир Военно-морская оборона" #NT!
 nd_soi_benadir_naval_defense_desc: "Военные галеры, построенные в гаванях Могадишо и Мерки, патрулируют побережье Бенадира, вступая в бой с португальскими и вражескими судами для защиты сомалийской торговли." #NT!
 nd_soi_ottoman_alliance: "Османско-сомалийский альянс" #NT!
 nd_soi_ottoman_alliance_desc: "В 1580-х годах сомалийские города-государства сотрудничали с османскими войсками, чтобы изгнать португальцев из ключевых портов Восточной Африки, включая Пате, Момбасу и Килву." #NT!
 nd_soi_frankincense_trade: "Торговля ладаном" #NT!
 nd_soi_frankincense_trade_desc: "С древних времен Африканский Рог экспортировал ладан и мирру. Контроль сомалийцев над этими ароматическими смолами обеспечивает постоянный источник богатства древней страны Пунт." #NT!
 nd_soi_warsangali_enterprise: "Варсангали Предприятие" #NT!
 nd_soi_warsangali_enterprise_desc: "Султанат Варсангали контролирует побережье Маахир на севере Сомали, поддерживая независимые торговые сети, дополняющие торговлю южных портов Бенадира." #NT!
 nd_soi_shafii_jurisprudence: "Шафиитская юриспруденция" #NT!
 nd_soi_shafii_jurisprudence_desc: "Сомалийские исламские учёные школы Шафиитов развивают сложную юриспруденческую традицию, которая дополняет обычный шир, создавая двойную правовую основу." #NT!
 nd_soi_successor_states: "Государства-преемники" #NT!
 nd_soi_successor_states_desc: "Упадок Аджуранского султаната порождает мозаику государств-преемников: султанатов Геледи, Хобио и Маджертин, каждый из которых унаследовал различные аспекты управления Аджураном." #NT!
 nd_soi_gobroon_dynasty: "Династия Гобрун" #NT!
 nd_soi_gobroon_dynasty_desc: "Семья Гобрун, считающаяся в исламской традиции святыми, объединяет клан Геледи в могущественный султанат с центром в Афгойе, консолидируя контроль над долинами Джубба и Шабелле." #NT!
 nd_soi_shabelle_agriculture: "Шабелле Сельское хозяйство" #NT!
 nd_soi_shabelle_agriculture_desc: "Опираясь на гидравлическое наследие Аджурана, геледи развивают интенсивное сельское хозяйство в долине Шабелле, производя излишки зерна, хлопка и других культур для внутреннего потребления и экспорта.\n\n#italic Доступно в: $nd_soi_geledi_granary$#!" #NT!
 nd_soi_merchant_diaspora: "Торговая диаспора" #NT!
 nd_soi_merchant_diaspora_desc: "Сомалийские торговые сообщества обосновались в Каире, Дамаске, Мокке, Момбасе, Адене и на островах Индийского океана, создав торговую сеть, охватывающую три континента." #NT!
 nd_soi_geledi_mobilization: "Геледи Мобилизация" #NT!
 nd_soi_geledi_mobilization_desc: "Султанат Геледи развивает систему военной мобилизации, опираясь на воинские традиции входящих в его состав кланов, направляя быстро передвигающиеся нерегулярные силы для кампаний в долине Джубба." #NT!
 nd_soi_inland_caravan_trade: "Внутренняя караванная торговля" #NT!
 nd_soi_inland_caravan_trade_desc: "Караванные маршруты, связывающие побережье Бенадира с Хараром и внутренними районами Эфиопии, перевозят слоновую кость, домашний скот, шкуры и ткани, обогащая внутренние сомалийские кланы." #NT!
 nd_soi_bardera_campaign: "Кампания Бардеры" #NT!
 nd_soi_bardera_campaign_desc: "В 1843 году силы Геледи выступают против султаната Бардера, строгой религиозной общины, чьи запреты на рабство и определенную торговлю угрожают торговым интересам Геледи. Решающая победа восстанавливает контроль над внутренними торговыми путями." #NT!
 nd_soi_benadir_prosperity: "Бенадир Процветание" #NT!
 nd_soi_benadir_prosperity_desc: "Побережье Бенадира достигает зенита своего коммерческого процветания: Могадишо, Мерка и Барава служат перевалочными пунктами для всей западной части Индийского океана." #NT!
 nd_soi_jubba_development: "Развитие долины Джубба" #NT!
 nd_soi_jubba_development_desc: "Развитие сельского хозяйства распространяется вдоль долины реки Джубба, превращая бывшие пастбищные земли в продуктивные сельскохозяйственные угодья под управлением администрации Геледи." #NT!
 nd_soi_geledi_warfare: "Геледи Война" #NT!
 nd_soi_geledi_warfare_desc: "Султанат Геледи совершенствует свои военные традиции, выставляя на вооружение мобильную нерегулярную пехоту, набранную из кланов долины Шабелле, для быстрых кампаний через Африканский Рог." #NT!
 nd_soi_dual_legal_system: "Двойная правовая система" #NT!
 nd_soi_dual_legal_system_desc: "Интеграция обычного права xeer с исламским шариатом создает сложную двойную правовую структуру, в которой старейшины кланов и религиозные ученые сотрудничают в разрешении споров." #NT!
 nd_soi_ivory_trade: "Экспорт слоновой кости и домашнего скота" #NT!
 nd_soi_ivory_trade_desc: "Экспортная экономика Сомали диверсифицируется: слоновая кость, домашний скот, шкуры, ладан и мирра текут через порты Бенадира на рынки Индийского океана и Красного моря.\n\n#italic Доступно в: $nd_soi_weaving_house$#!" #NT!
 nd_soi_national_awakening: "Сомалийское национальное пробуждение" #NT!
 nd_soi_national_awakening_desc: "Общая сомалийская идентичность, укорененная в общем языке, религии и скотоводческой культуре, начинает преодолевать клановые разделения, закладывая основы для единого национального сознания." #NT!
 nd_soi_port_modernization: "Модернизация порта" #NT!
 nd_soi_port_modernization_desc: "Гавани Могадишо и побережья Бенадира улучшены для приема более крупных судов современной эпохи, что обеспечивает сохранение роли Сомали в торговле в Индийском океане.\n\n#italic Доступно в: $nd_soi_weaving_house$#!" #NT!
 nd_soi_clan_unification: "Объединение Клана" #NT!
 nd_soi_clan_unification_desc: "Процесс объединения кланов Сомали в сплоченную национальную структуру, выход за рамки сегментарной системы родословной к более централизованной модели управления." #NT!
 nd_soi_modern_military: "Современные военные традиции" #NT!
 nd_soi_modern_military_desc: "Воинское наследие Сомали адаптируется к требованиям современной войны, сочетая традиционную клановую военную организацию с новой дисциплиной и тактикой." #NT!
 nd_soi_trade_revival: "Возрождение торговли в Индийском океане" #NT!
 nd_soi_trade_revival_desc: "Сомалийские купцы восстанавливают свои позиции в торговых сетях Индийского океана, используя многовековые морские знания и стратегическое положение Африканского Рога." #NT!
 nd_soi_literary_traditions: "Литературные и устные традиции" #NT!
 nd_soi_literary_traditions_desc: "Сомалийская устная традиция, одна из самых богатых в Африке, начинает находить письменное выражение, сохраняя столетия поэзии, генеалогии и обычного права для будущих поколений." #NT!
 a_nd_soi_horsemen: "Сомалийские всадники" #NT!
 a_nd_soi_horsemen_desc: "Конные воины сомалийских кланов, вооруженные копьями, саблями и щитами. Эти всадники используют разрушительную тактику «нападай и беги», полученную за столетия пасторальных набегов и кампаний султаната Адал." #NT!
 a_nd_soi_horsemen_levy: "Сомалийские всадники" #NT!
 a_nd_soi_horsemen_levy_desc: "Клановая кавалерия, собранная посредством традиционной системы набора, эти воины-скотоводы составляют мобильную ударную силу сомалийских армий." #NT!
 a_nd_soi_coastal_guards: "Береговая охрана Бенадира" #NT!
 a_nd_soi_coastal_guards_desc: "Войска гарнизона, размещенные на сторожевых башнях и укреплениях побережья Бенадира, обучены защищать Могадишо, Мерку и Бараву от набегов с моря и вторжений португальцев." #NT!
 a_nd_soi_geledi_irregulars: "Геледи Нерегулярные войска" #NT!
 a_nd_soi_geledi_irregulars_desc: "Быстрая легкая пехота султаната Геледи, набранная из кланов долины Шабелле. Они преуспевают в быстром развертывании и партизанской тактике на речной местности на юге Сомали." #NT!
 n_nd_soi_dhow: "Сомалийский дау" #NT!
 n_nd_soi_dhow_desc: "Быстроходное судно из сшитых досок, предназначенное для преодоления муссонных ветров Индийского океана. Сомалийские дау несут меньше вооружения, чем европейские суда, но они быстрее и требуют меньше экипажа, что делает их идеальными для торговли на дальние расстояния." #NT!
 n_nd_soi_benadir_galley: "Бенадир Боевая галера" #NT!
 n_nd_soi_benadir_galley_desc: "Мощный прибрежный военный корабль, построенный в гаванях Могадишо и Мерки и предназначенный для патрулирования побережья Бенадира и поражения вражеских судов на мелководье вдоль Африканского Рога." #NT!
 nd_soi_limestone_well: "Аджуранский известняковый колодец" #NT!
 nd_soi_limestone_well_desc: "Большие колодцы, построенные из известняка, являются частью гидравлической инфраструктуры Аджуранского султаната. Эти колодцы и цистерны веками служили кочевникам-скотоводам Африканского Рога, привлекая поселения и обеспечивая возможность ведения сельского хозяйства на засушливых землях." #NT!
 nd_soi_weaving_house: "Ткацкий дом Могадишо" #NT!
 nd_soi_weaving_house_desc: "Мастерская, где ткут, красят и готовят к экспорту знаменитую ткань туб бенадир. Традиция ткачества на побережье Бенадира позволяет производить ткани, ценимые от Египта до Индии." #NT!
 nd_soi_caravanserai: "Сомалийский караван-сарай" #NT!
 nd_soi_caravanserai_desc: "Укрепленная остановка для отдыха на торговых путях, связывающих побережье Бенадира с внутренними районами, обеспечивающая убежище, воду и продовольствие для торговцев и их скота." #NT!
 nd_soi_xeer_council: "Зал Совета Ксира" #NT!
 nd_soi_xeer_council_desc: "Место сбора, где старейшины сомалийских кланов собираются для переговоров и вынесения решений по обычному праву ксира, разрешения споров по поводу прав на воду, компенсации за кровь и границ клана." #NT!
 nd_soi_coastal_watchtower: "Прибрежная сторожевая башня" #NT!
 nd_soi_coastal_watchtower_desc: "Каменная башня, построенная вдоль побережья Бенадира, оснащенная наблюдателями, которые сканируют горизонт в поисках вражеского флота. Часть системы защиты Аджурана от вторжений португальских военно-морских сил." #NT!
 nd_soi_mogadishu_mint: "Монетный двор Могадишо" #NT!
 nd_soi_mogadishu_mint_desc: "Чеканный цех, выпускающий отличительную валюту Могадишо — монеты с именами султанов. Монетный двор централизует коммерческую гегемонию сомалийской торговой империи." #NT!
 nd_soi_well_maintenance: "Обслуживание скважин" #NT!
 nd_soi_well_maintenance_desc: "Для содержания известняковых колодцев Аджурана требуется камень для ремонта футеровки, инструменты для земляных работ, а также пиломатериалы для строительных лесов и оборудования." #NT!
 nd_soi_cloth_dyeing: "Крашение ткани" #NT!
 nd_soi_cloth_dyeing_desc: "Импортированные красители и сырая ткань превращаются в изысканный туб бенадир, готовый текстиль, который ценится по всему Индийскому океану от Египта до Индии." #NT!
 nd_soi_caravan_provisioning: "Обеспечение караванов" #NT!
 nd_soi_caravan_provisioning_desc: "Караван-сарай должен быть забит зерном, домашним скотом и солью, чтобы кормить и сохранять провизию для торговцев и их животных на внутренних торговых путях." #NT!
 nd_soi_elder_council_upkeep: "Содержание Совета старейшин" #NT!
 nd_soi_elder_council_upkeep_desc: "Для поддержания совета ксира требуется домашний скот для пиршеств, благовония для церемониальных собраний и бумага для записи обычного права и решений." #NT!
 nd_soi_watchtower_garrison: "Гарнизон Сторожевой Башни" #NT!
 nd_soi_watchtower_garrison_desc: "Береговой сторожевой башне требуется оружие и камень для укреплений, а также древесина для сторожевых платформ и сигнального оборудования." #NT!
 nd_soi_coin_striking: "Чеканка монет" #NT!
 nd_soi_coin_striking_desc: "Серебро и медь чеканятся в отличительных монетах султаната, признанных в западной части Индийского океана." #NT!
 nd_soi_frankincense_processing: "Обработка ладана" #NT!
 nd_soi_frankincense_processing_desc: "Подготовка и сортировка смолы ладана для экспорта с использованием волокнистой упаковки — традиция, восходящая к древней Земле Пунт." #NT!
 nd_soi_hide_curing: "Скрыть отверждение" #NT!
 nd_soi_hide_curing_desc: "Шкуры домашнего скота обрабатываются и перерабатываются в кожу, которая является основным продуктом скотоводческого хозяйства Сомали и ценным экспортным товаром." #NT!
 STATIC_MODIFIER_NAME_nd_soi_spirit_of_gurey: "Дух Гурея" #NT!
 STATIC_MODIFIER_DESC_nd_soi_spirit_of_gurey: "Дух завоеваний имама Ахмада Гурея гонит наших воинов вперед со святым рвением и непревзойденным кавалерийским мастерством." #NT!
 STATIC_MODIFIER_NAME_nd_soi_diplomatic_pact: "Дипломатический пакт" #NT!
 STATIC_MODIFIER_DESC_nd_soi_diplomatic_pact: "Вместо завоеваний мы ищем силу через альянсы и торговые соглашения, которые проецируют влияние Сомали через Индийский океан." #NT!
 STATIC_MODIFIER_NAME_nd_soi_mogadishu_cloth_dominance: "Доминирование ткани Могадишо" #NT!
 STATIC_MODIFIER_DESC_nd_soi_mogadishu_cloth_dominance: "Ткацкие станки в Могадишо производят лучшие ткани в Индийском океане, а нашим ткачам завидуют Египет и Сирия." #NT!
 STATIC_MODIFIER_NAME_nd_soi_mogadishu_gold_standard: "Золотой стандарт Могадишо" #NT!
 STATIC_MODIFIER_DESC_nd_soi_mogadishu_gold_standard: "Наши монеты признаются и принимаются от Аравии до Индии, что дает сомалийским торговцам преимущество на каждом рынке, на который они выходят." #NT!
 STATIC_MODIFIER_NAME_nd_soi_gobroon_agricultural_reform: "Сельскохозяйственная реформа Гобруна" #NT!
 STATIC_MODIFIER_DESC_nd_soi_gobroon_agricultural_reform: "Инвестиции династии Гобрун в сельское хозяйство долины Шабелле трансформируют экономику Сомали, делая внутренние районы реки столь же продуктивными, как и прибрежная торговля." #NT!
 STATIC_MODIFIER_NAME_nd_soi_gobroon_military_expansion: "Военное расширение Гобруна" #NT!
 STATIC_MODIFIER_DESC_nd_soi_gobroon_military_expansion: "Султанат Геледи распространяет военную мощь по всему Африканскому Рогу, обеспечивая безопасность торговых путей и подчиняя конкурирующие кланы силой оружия." #NT!
 levy_nd_soi_horsemen: "Сомалийские всадники" #NT!
 levy_nd_soi_horsemen_desc: "Клановая кавалерия, сформированная из кочевников-скотоводов, несущих традиции конного воина сомалийского народа." #NT!
 levy_nd_soi_geledi_irregulars: "Геледи Нерегулярные войска" #NT!
 levy_nd_soi_geledi_irregulars_desc: "Легкая пехота, набранная из кланов султаната Геледи, специализирующаяся на быстром передвижении по речной местности на юге Сомали." #NT!
 nd_soi_geledi_granary: "Геледи Зернохранилище" #NT!
 nd_soi_geledi_granary_desc: "Хранилище зерна, построенное в долине Шабелле и являющееся частью сельскохозяйственной инфраструктуры султаната Геледи. Эти зернохранилища обеспечивают продовольственную безопасность и позволяют производить излишки продукции для торговли." #NT!
 nd_soi_benadir_warehouse: "Бенадир Склад" #NT!
 nd_soi_benadir_warehouse_desc: "Большое хранилище в портах Бенадира, где хранятся товары из-за Индийского океана, специи из Индии, ткани из Могадишо, слоновая кость из внутренних районов, ожидающие торговли или перевалки." #NT!
 nd_soi_madrasa: "Сомалийское медресе" #NT!
 nd_soi_madrasa_desc: "Исламская школа, где преподают шафиитскую юриспруденцию и изучение Корана, выпускает ученых, которые распространяют сомалийские знания по всему мусульманскому миру." #NT!
 nd_soi_bardic_hall: "Бардик Холл" #NT!
 nd_soi_bardic_hall_desc: "Место сбора, где сомалийские поэты и сказители сохраняют и воспроизводят богатые устные традиции своего народа, генеалогии, обычное право, героические стихи и мудрость старших." #NT!
 n_nd_soi_merchant_vessel: "Сомалийское торговое судно" #NT!
 n_nd_soi_merchant_vessel_desc: "Быстроходное торговое судно в Индийском океане, предназначенное для длинных муссонных маршрутов между побережьем Бенадира, Аравией и Индией. Быстрее европейских кораблей сопоставимого размера, хотя и легче вооружены." #NT!
 a_nd_soi_modern_cavalry: "Сомалийская современная кавалерия" #NT!
 a_nd_soi_modern_cavalry_desc: "Модернизированные конные воины, сочетающие традиционные навыки сомалийской кавалерии с новым оружием и тактикой, служат разведчиками и быстрыми рейдерами в эпоху современных войн." #NT!
 nd_soi_grain_storage: "Хранение зерна" #NT!
 nd_soi_grain_storage_desc: "Зернохранилищу необходимы постоянные поставки зерна для пополнения запасов, глиняные сосуды для герметичного хранения и инструменты для обслуживания помещений." #NT!
 nd_soi_goods_handling: "Обработка товаров" #NT!
 nd_soi_goods_handling_desc: "На складе требуются пиломатериалы для ящиков и стеллажей, керамика для запечатанных сосудов для хранения, а также инструменты для погрузки и ремонта для хранения разнообразных товаров торговли в Индийском океане." #NT!
 nd_soi_scholarly_endowment: "Научный фонд" #NT!
 nd_soi_scholarly_endowment_desc: "Медресе необходима бумага для рукописей и юридических текстов, ткань для одежды и мебели ученых, а также благовония для церемониальных функций мечети." #NT!
 nd_soi_bardic_patronage: "Бардское покровительство" #NT!
 nd_soi_bardic_patronage_desc: "Для поддержания бардского зала требуется скот для пиршеств, ткань для церемониальной одежды и украшений зала, а также пиво для общественных собраний, поддерживающих устную традицию." #NT!
 nd_soi_ivory_grading: "Цвет слоновой кости" #NT!
 nd_soi_ivory_grading_desc: "Необработанные бивни из слоновой кости сортируются и вырезаются в предметы роскоши для экспорта — специализированного ремесла, продающего самые высокие цены на рынках Индийского океана." #NT!
 nd_soi_modern_harbor_management: "Современное управление портом" #NT!
 nd_soi_modern_harbor_management_desc: "Модернизация сомалийских портов требует поставок пиломатериалов и военно-морских сил для расширения доков, а также инструментов для судоремонтной инфраструктуры и строительных работ." #NT!
 nd_soi_formed_tt: "было образовано Сомали." #NT!
 nd_soi_path_a_tt: "Выбрали Жемчужину Индийского океана" #NT!
 nd_soi_path_b_tt: "Выбрали Повелителей Вод" #NT!
 nd_soi_destiny: "Сомалийская судьба" #NT!
 nd_soi_destiny_desc: "Объединение Сомали закладывает основу для более великой цели. Независимо от того, приносят ли муссонные ветры славу нашим дау или внутренние колодцы поддерживают империю, сомалийский народ готов формировать Африканский Рог и Индийский океан за его пределами." #NT!
 nd_soi_dest_aden_gateway: "Ворота Адена" #NT!
 nd_soi_dest_aden_gateway_desc: "Баб-эль-Мандебский пролив контролирует всю торговлю между Индийским океаном и Красным морем. Обеспечивая безопасность Адена и благовонного побережья, Сомали контролирует точку морской торговли, которая обогащала регион со времен Земли Пунт." #NT!
 nd_soi_dest_swahili_reach: "Суахили Рич" #NT!
 nd_soi_dest_swahili_reach_desc: "От Могадишо до Килвы сомалийский торговый флот расширяет свои муссонные торговые сети вдоль всего восточноафриканского побережья, устанавливая коммерческое господство над городами-государствами суахили, которые когда-то торговали на равных." #NT!
 nd_soi_dest_ocean_dominion: "Доминион океана" #NT!
 nd_soi_dest_ocean_dominion_desc: "Индийский океан – это сомалийское море. От Адена до Занзибара, от Момбасы до рынков специй на Востоке сомалийские торговцы и военные корабли контролируют торговые пути, поддерживающие империи. Жемчужина Индийского океана стала его хозяйкой." #NT!
 nd_soi_dest_highland_conquest: "Завоевание Хайленда" #NT!
 nd_soi_dest_highland_conquest_desc: "Следуя по стопам имама Ахмада Гурея, сомалийские войска продвигаются в высокогорную местность Эфиопии. Падает древний город Гондэр, а вместе с ним и миф о непобедимости Эфиопии. Гидравлическое государство расширяет свое влияние на горные источники, питающие Нил." #NT!
 nd_soi_dest_empire_consolidation: "Имперская Консолидация" #NT!
 nd_soi_dest_empire_consolidation_desc: "Высеченные в скале церкви Лалибелы и укрепленный двор Анкобера теперь подчиняются властям Сомали. Профессиональная армия охраняет огромную территорию, а аджурская традиция централизованного управления связывает завоеванные высокогорья с сердцем Сомали." #NT!
 nd_soi_dest_horn_master: "Мастер Рога" #NT!
 nd_soi_dest_horn_master_desc: "Поскольку Массауа и Суакин находятся под контролем Сомали, весь Африканский Рог от побережья Красного моря до Индийского океана подчиняется одной силе. Повелители вод стали повелителями и земли, управляя империей от притоков Нила до муссонных морей." #NT!
 nd_soi.7.t: "Судьба выкована" #NT!
 nd_soi.7.d: "Объединение сомалийских кланов было только началом. Перед нами уже сделан выбор: смотреть ли наружу, на волны, или внутрь, на засушливые равнины. Путь задан. Теперь мы должны пройти его.\n\nОт древних портов, которые знали корабли фараонов, до караванных маршрутов, где ладан все еще благоухает воздухом, у сомалийской нации есть средства построить что-то, что выдержит испытание временем. Наши поэты будут петь о том, что будет дальше, из поколения в поколение." #NT!
 nd_soi.7.a: "Пусть путешествие начнется." #NT!
 nd_soi.8.t: "Ворота слез" #NT!
 nd_soi.8.d: "Баб-эль-Мандеб, Врата Слёз, принадлежат нам. Узкий пролив, где Красное море встречается с Индийским океаном, был перевалочным пунктом мировой торговли со времен Соломона и Савской. Теперь сомалийские таможенники приветствуют каждое судно, проходящее между Аравией и Африкой.\n\nИз гавани Адена наши купцы могут добраться до Египта, Индии и островов специй. Благовония, которые когда-то сделали эту землю легендарным Пунтом, теперь текут по рынкам, которые мы контролируем. Первое звено в цепи, которая протянется через океан, выковано." #NT!
 nd_soi.8.a: "Каждый проходящий корабль платит должное." #NT!
 nd_soi.9.t: "Берег Суахили" #NT!
 nd_soi.9.d: "Сомалийские дау теперь бросают якорь в гаванях Килва и Ламу, портах, которые когда-то конкурировали с Могадишо в торговле в Индийском океане. Побережье Суахили с его городами из кораллового камня и торговлей с золотым песком было включено в торговую сферу Сомали.\n\nНаши капитаны знают эти воды так же хорошо, как и свои собственные, муссонные ветры, наполняющие их паруса, были нанесены на карту их дедами. Но расширение нашего влияния так далеко на юг требует новых методов. Будем ли мы полагаться на разведывательные сети и наемников или будем утверждать свое господство с помощью силы нашего флота?" #NT!
 nd_soi.9.a: "Разместите наших агентов в каждом порту." #NT!
 nd_soi.9.b: "Наши военные корабли сохранят мир." #NT!
 nd_soi.10.t: "Лорды Муссона" #NT!
 nd_soi.10.d: "От Адена до Занзибара, от Красного моря до побережья Суахили торговля в Индийском океане проходит через руки Сомали. То, за что португальцы и османы сражались на протяжении веков, мы завоевали благодаря господству над ветром и волнами, которым наш народ обладал еще до рождения великих мировых религий.\n\nЖемчужина Индийского океана стала его венцом. Наши торговые дома в Могадишо, Килве и Момбасе устанавливают цены, которые должны принимать торговцы от Каира до Каликута. Но как нам управлять этим обширным морским пространством: с помощью мягкой силы дипломатии и репутации или с помощью жесткого расчета торговой монополии?" #NT!
 nd_soi.10.a: "Пусть наше имя вызывает уважение во всех дворах." #NT!
 nd_soi.10.b: "Золото говорит громче, чем дипломаты." #NT!
 nd_soi.11.t: "Марш на Гондэр" #NT!
 nd_soi.11.d: "Эфиопское нагорье, непокоренное на протяжении тысячелетий, попало в руки сомалийцев. Гондар, город замков, построенный императором Фасилидисом, теперь развевает наше знамя. Это достижение превосходит даже кампании великого имама Ахмада Гурея, поскольку там, где он пронесся и отступил, мы остались.\n\nРеки, текущие с этих гор, притоки самого Нила, теперь проходят через земли, которые мы контролируем. Мечта Аджура о гидравлической империи, когда-то ограничивавшаяся колодцами и каналами низменностей Сомали, расширилась и охватила сам источник вод региона." #NT!
 nd_soi.11.a: "Горная местность подчиняется нашей воле." #NT!
 nd_soi.12.t: "Консолидация" #NT!
 nd_soi.12.d: "Церкви Лалибелы и крепость Анкобера обозначают пределы империи, простирающейся от Индийского океана до Эфиопского нагорья. Для удержания этой обширной территории требуется нечто большее, чем просто военная сила: для этого требуется административная дисциплина, которую усовершенствовали аджуранцы, и вера, которая связывает наш народ.\n\nПокоренные горные народы разнообразны по языку и религии. Некоторых можно победить мечом веры, других — твердой рукой гарнизонного правления. Как мы свяжем эту империю воедино?" #NT!
 nd_soi.12.a: "Вера Пророка объединяет все народы." #NT!
 nd_soi.12.b: "Порядок приходит от силы, а не от проповедей." #NT!
 nd_soi.13.t: "Хозяин Африканского Рога" #NT!
 nd_soi.13.d: "От Суакина на Красном море до муссонного побережья Индийского океана — весь Африканский Рог подчиняется властям Сомали. Массауа, древний порт, который соединял Аксум с миром, теперь служит новой империи. Повелители вод стали повелителями всего, что они видят.\n\nНикакая сила в Восточной Африке не может бросить нам вызов. Вопрос теперь в том, какой империей мы будем: той, которая разбогатеет на добыче завоеваний, или той, которая принесет порядок и процветание землям, находящимся под нашим правлением." #NT!
 nd_soi.13.a: "Пусть побежденный обогащает победителя." #NT!
 nd_soi.13.b: "Мы несем мир сильной руки." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_merchant_intelligence: "Торговая разведка" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_merchant_intelligence: "Сомалийские торговые дома служат разведывательной сетью, собирающей информацию из каждого порта Индийского океана. Наши купцы — наши шпионы, а наши шпионы повсюду." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_naval_hegemony: "Морская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_naval_hegemony: "Сомалийские военные корабли патрулируют торговые пути в Индийском океане, укрепляя наше коммерческое господство угрозой применения военно-морских сил. Флот, который защищает торговлю, не должен бояться затрат на содержание." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_monsoon_diplomacy: "Муссонная дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_monsoon_diplomacy: "Престиж управления торговлей в Индийском океане дает сомалийским дипломатам вес на всех переговорах. Наше слово распространяется далеко, и наша сфера деятельности простирается дальше." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_commercial_supremacy: "Коммерческое превосходство" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_commercial_supremacy: "Богатства Индийского океана проходят через рынки Сомали, а наши коммерческие сети снижают стоимость всего: от армии до банковского дела." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_holy_warriors: "Святые воины" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_holy_warriors: "Дух джихада, загнавший Ахмада Гурея в Эфиопское нагорье, продолжает жить. Наши солдаты сражаются с ревностью веры, и цена праведной войны ложится на плечи с радостью." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_garrison_state: "Гарнизонный штат" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_garrison_state: "Обширные завоевания Рога требуют систематического подхода к военному управлению с гарнизонами, быстрым набором солдат и централизованным командованием, объединяющим империю." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_plunder_of_empires: "Разграбление империй" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_plunder_of_empires: "Богатство завоеванных империй обогащает сомалийское государство, поскольку сокровищницы и храмы Рога приносят богатства, накопленные за столетия." #NT!
 STATIC_MODIFIER_NAME_nd_soi_dest_pax_somalis: "Пакс Сомали" #NT!
 STATIC_MODIFIER_DESC_nd_soi_dest_pax_somalis: "Под властью Сомали разнообразные народы Африканского Рога обретают определенный порядок и стабильность. Конверсия, качественное управление и военная дисциплина поддерживают мир." #NT!
 nd_soi_ocean_trading_house: "Торговый дом Индийского океана" #NT!
 nd_soi_ocean_trading_house_desc: "Грандиозное коммерческое учреждение, объединяющее склад, счетную палату и зал дипломатических приемов, из которого сомалийские купцы координируют торговлю по всему бассейну Индийского океана." #NT!
 nd_soi_imperial_cistern: "Императорская цистерна" #NT!
 nd_soi_imperial_cistern_desc: "Монументальный комплекс для хранения воды в традициях Аджурана, созданный для служения империи. Эти огромные цистерны собирают и распределяют воду по завоеванным территориям, расширяя контроль гидравлического государства за пределы центра Сомали." #NT!
 nd_soi_ocean_trade_coordination: "Координация океанской торговли" #NT!
 nd_soi_ocean_trade_coordination_desc: "Управление торговлей в Индийском океане требует бумаги для контрактов и манифестов, тонкой ткани для дипломатических подарков и благовоний для церемониальных функций, которыми скрепляются торговые соглашения." #NT!
 nd_soi_cistern_engineering: "Цистерна Инжиниринг" #NT!
 nd_soi_cistern_engineering_desc: "Императорская цистерна требует камня для строительства и облицовки, инструментов для раскопок и каменных работ, а также пиломатериалов для строительных лесов и каналов акведуков." #NT!
  
 # ===== BUREAUCRACY ===== 
 AUTO_MODIFIER_NAME_nd_soi_bureaucracy_authority: "Аппарат рожка" #NT!
 AUTO_MODIFIER_DESC_nd_soi_bureaucracy_authority: "Институты сомалийского государства (гидравлический имамат Аджурана, султанский суд Валашмы, обычное право старейшин кланов, суфийская сеть тариката коранического обучения, караван-аббаан, защищающий внутреннюю торговлю, и морские султанаты побережий Бари и Бенадира) превратились в стройный административный аппарат. На этом фундаменте отличительные институты кланов, веры и торговли Сомали начинают обретать прочную форму." #NT!
 soi_ajuran_hydraulic_administration_bureaucracy: "Аджуранское гидравлическое управление" #NT!
 soi_ajuran_hydraulic_administration_bureaucracy_desc: "Гаринские правители Аджуранского султаната (13-17 вв.) создали единственную гидравлическую империю, которую могла создать Африка, монополизировав реки Шабелле и Джубба с помощью инженерных колодцев, дамб и ирригационных каналов, построенных специализированными землекопами Мадинле. Имам правил через вазиров, эмиров и наибов, первым ввел регулярную систему дани для окрестных скотоводов и фермеров и чеканил бронзовые монеты со своим именем во внутренних районах Могадишо. Система в измененном виде сохранилась до 19 века; его налоговая логика была унаследована всеми сомалийскими государствами-преемниками, но ценой вечного недовольства неорошаемых клановых внутренних районов." #NT!
 soi_walashma_sultanate_court_bureaucracy: "Суд Валашминского Султаната" #NT!
 soi_walashma_sultanate_court_bureaucracy_desc: "Династия Валашма правила Ифатом (1285-1415) и его преемником Адалем (1415-1577) из Зейлы и Харара, последний обнесён стеной и чеканил собственные монеты. Султан был номинальным правителем Валашмы, происходящим от Вали Асмы в XIII веке; на практике эмиры управляли провинциями, и с 1471 года, когда эмир Ладай Усман захватил Даккар, реальная власть принадлежала тому эмиру Харари, который владел дворцом, в то время как султан сохранял церемониальную форму. Диванский суд кади, санкционированный эмиром и пользующийся советами ученых Кабира, применил шариат в гражданских и уголовных делах и привязал городское мусульманское население к трону." #NT!
 soi_xeer_shir_beeleed_bureaucracy: "Зир и Шир Билед" #NT!
 soi_xeer_shir_beeleed_bureaucracy_desc: "Неписаное обычное право Сомали, передаваемое устно и распространяемое на двусторонней основе между соседними кланами через их старейшин. Споры разрешаются на шир билед, собрании клана под открытым небом, где может выступать любой взрослый мужчина, а старейшины ксир бегти судят по прецеденту. Компенсация поступает в магах (или диях) и выплачивается родословной правонарушителя, выплачивающей магг, семье жертвы в виде крупного рогатого скота, верблюдов или монет. Эта система не требует центрального государства, возникла еще до султанатов, пережила их все и остается де-факто законом на большей части внутренних территорий Сомали. Корона не может заменить его, не нарушив легитимность кланов." #NT!
 soi_sufi_tariqa_network_bureaucracy: "Сеть Суфийского Тариката" #NT!
 soi_sufi_tariqa_network_bureaucracy_desc: "Кадирийя, старейший и крупнейший суннитский суфийский орден в Сомали, начиная с 13 века, и Салихия, основанная Сайидом Мухаммадом Салихом (1854-1919) и пропагандируемая в районе Джоухара Мухаммадом Гулидом (ум. 1918) и в Средней Джубе Исмаилом ибн Исхаком аль-Урвайни. Братства управляли кораническими школами королевства, выступали посредниками в межклановых спорах посредством арбитража шейхов и связывали сомалийское побережье и внутренние районы с более широким исламским миром Индийского океана посредством своих силсилских цепей духовного происхождения. К 19 веку сети тариката были единственными институтами, охватывающими каждую сомалийскую общину, частично пересекающимися с клановой картой, но не совпадающими с ней." #NT!
 soi_abbaan_caravan_brokerage_bureaucracy: "Аббаан Караван Брокерская компания" #NT!
 soi_abbaan_caravan_brokerage_bureaucracy_desc: "Сомалийский институт защиты караванов, благодаря которому иностранный или провинциальный торговец не мог двигаться вглубь страны, не заручившись аббааном, хозяином-защитником, набираемым из местного клана, чью территорию должен был пересечь караван. Аббаан гарантировал безопасный проход, урегулировал местные споры и организовал продовольствие в обмен на долю пошлин; Клерикальная линия Рир Мумин, распространившаяся по всему маршруту от Могадишо до Луука, давала религиозные санкции и разрешала коммерческие споры за вознаграждение. Система управляла всей внутренней торговлей слоновой костью, шкурами, ладаном и рабами без государства, сохраняя богатство в руках клана за счет любых централизованных таможенных доходов." #NT!
 soi_boqor_of_the_coast_bureaucracy: "Бокор побережья" #NT!
 soi_boqor_of_the_coast_bureaucracy_desc: "Модель централизованного морского султаната, усовершенствованная Маджиртином на побережье Бари под руководством Бокора Османа Махамууда (ок. 1844–1929 гг.), Имеющая предшественников в более старом султанате Могадишо Факр ад-Дина. Бокор взимал таможенные пошлины с ладана, рыболовства и судоходства в Индийском океане, которое касалось Босасо, Алулы и Бандар-Зиады, ввел в действие закон о спасении затонувших кораблей, освободил местных скотоводов для поддержания лояльности клану и подписал договоры с британскими и итальянскими посланниками как суверенные равные. Все органы единого морского государства стояли на якоре на побережье, а внутренние районы оставались во владении ксира." #NT!
