l_russian:
 STATIC_MODIFIER_NAME_nd_ryu_bridge_of_nations: "Банкоку Синрё" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_bridge_of_nations: "Королевство Рюкю объявляет себя Мостом между всеми народами, морским перекрестком, соединяющим великие цивилизации Восточной и Юго-Восточной Азии посредством торговли, дипломатии и культурного обмена." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_sovereignty_of_isles: "Суверенитет островов" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_sovereignty_of_isles: "Под железной рукой династии Шо острова объединены в единое королевство с ярко выраженной культурной самобытностью, воины которого обучены искусству Тэ, а крепости контролируют каждый подход." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_unified_kingdom: "Объединенное Королевство Чузан" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_unified_kingdom: "Три враждующих королевства были объединены под единым троном в Сюри, что обеспечило централизованное управление и легитимность островам Рюкю." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_island_confederation: "Островная Конфедерация" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_island_confederation: "Несмотря на единое название, королевство сохраняет автономию входящих в его состав владений, способствуя сотрудничеству и процветанию посредством консенсуса, а не принуждения." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_island_defiance: "Остров Дефайанс" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_island_defiance: "Жители островов Рюкю направляют свои страдания в ожесточённое сопротивление, развивая новые боевые традиции на основе инструментов своего повседневного труда." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_pragmatic_survival: "Прагматическое выживание" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_pragmatic_survival: "Не имея возможности противостоять иностранной военной мощи, королевство прибегает к хитрости, поддерживая свои торговые сети, разведывательный аппарат и дипломатические связи, чтобы сохранить свой суверенитет." #NT!
 nd_ryu.1.t: "Королевство Рюкю" #NT!
 nd_ryu.1.d: "Острова объединены под одной короной. От коралловых гаваней Нахи до каменных валов Накиджина архипелаг Рюкю впервые говорит одним голосом. Корабли под королевским штандартом уже заходят в порты от Сиама до Кореи, от Малакки до Нинбо. Сейчас перед нами стоит вопрос, какое королевство мы построим.\n\nПримет ли Рюкю свою судьбу как Банкоку Синрё, Мост между всеми народами, открывающий свои гавани для любого ветра и каждого народа, богатеющий как незаменимый посредник восточных морей? Или нам следует превратить острова в суверенное королевство-крепость, культивируя свои собственные военные традиции и культурную самобытность и не подчиняясь никакой иностранной державе?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ryu.1.a: "Мы — мост между всеми народами." #NT!
 nd_ryu.1.b: "Эти острова не подчиняются ни одному иностранному трону." #NT!
 nd_ryu.2.t: "Троецарствие Соединенное" #NT!
 nd_ryu.2.d: "В 1429 году Сё Хаси завершил то, что начал его отец Сё Сисё: объединение трёх соперничающих королевств Окинавы. Хокудзан, северное горное королевство с центром в замке Накидзин, пало первым в 1416 году. Нанзан, южное владение, базирующееся в Симадзири-Оозато, подчинилось тринадцать лет спустя. Центральное королевство Тюзан с его великолепным замком Сюри, перестроенным по образцу самого Запретного города, теперь управляет всем островом.\n\nСё Хаси принял китайскую иерархическую судебную систему и сделал Наху великой гаванью королевства. Император Мин подтвердил свою власть инвеститурной печатью. Но как будет управляться это новое царство?" #NT!
 nd_ryu.2.a: "Один престол, один закон, одно царство." #NT!
 nd_ryu.2.b: "Пусть каждый домен сохранит свои обычаи в целом." #NT!
 nd_ryu.3.t: "Колокол Банкоку Синрё" #NT!
 nd_ryu.3.d: "В замке Сюри отлит и повешен большой бронзовый колокол с надписью, которая будет определять королевство на века вперед. В нем говорится: «Рюкю — великолепная страна в Южных морях, вобравшая в себя лучшее из трех королевств: Кореи, Китая и Японии». Рюкю — это мост между всеми народами, и его корабли наполнены драгоценными продуктами всех земель.'\n\nБанкоку Синрё, мост между всеми народами, — это больше, чем просто хвастовство. Это декларация целей. В то время как великие империи строят стены и собирают армии, это маленькое островное королевство обрело свою силу в пространстве между цивилизациями, перевозя шелк из Китая, мечи из Японии, специи из Сиама и лошадей из Кореи через великие океанские дороги." #NT!
 nd_ryu.3.a: "Пусть колокол прозвенит над морями." #NT!
 nd_ryu.4.t: "Великие дни Тюдзана" #NT!
 nd_ryu.4.d: "Король Сё Син взошел на трон в 1477 году и положил начало тому, что летописцы назвали Великими Днями Тюдзана: золотым веком Королевства Рюкю. Его правление превратило острова из разрозненной совокупности феодальных владений в настоящее централизованное государство.\n\nАджи, феодалы, были вынуждены покинуть свои замки и поселиться в столице Сюри, где король мог наблюдать за ними. Их оружие было собрано и сохранено в королевском арсенале, не уничтожено, а сосредоточено под контролем короны. Система хики была реорганизована в дисциплинированную силу с военными, полицейскими и административными обязанностями.\n\nПомимо этих политических реформ, Сё Син покровительствовал искусству с необычайной щедростью. Каменные ворота Сонохян Утаки были возведены как священное место для молитв перед путешествием короля. Окраска бингата и лаковая посуда Рюкюань достигли высот изысканности, которая впечатляла даже изысканные дворы Пекина и Киото." #NT!
 nd_ryu.4.a: "Золотой век на века." #NT!
 nd_ryu.5.t: "Рождение Кобудо" #NT!
 nd_ryu.5.d: "После вторжения в Сацума в 1609 году воины Рюкю оказались разоруженными и порабощенными. Княжество Сацума ввело строгие запреты на владение оружием, стремясь предотвратить любую возможность восстания. Но дух воина Рюкюань не удалось так легко подавить.\n\nКрестьяне, рыбаки и простолюдины превратили орудия своего повседневного труда в орудия войны. Посох бо произошел от тростей и шестов для переноски. Сай появился из модифицированных животных. Тонфа происходила из жерновов с ручками. Нунчаку из цепов. Кама от уборки серпов. Экку с лодочных весел.\n\nВ тайне традиции Тэ, местного боевого искусства аристократии Рюкюань, слились с этими импровизированными приемами оружия, чтобы создать нечто совершенно новое: Кобудо, древний боевой способ. Тренируемая в темноте, передаваемая от мастера к ученику в абсолютной тайне, эта традиция в конечном итоге породила само каратэ." #NT!
 nd_ryu.5.a: "Мы никогда не будем по-настоящему побеждены." #NT!
 nd_ryu.5.b: "Выживание требует большего, чем просто боевой дух." #NT!
 nd_ryu.6.t: "Школы Те" #NT!
 nd_ryu.6.d: "На протяжении поколений боевые традиции островов Рюкю кристаллизовались в отдельные школы, каждая из которых отражает характер места своего происхождения. Сюри-тэ, практикуемое аристократией в тени королевского замка, подчеркивает скорость, ловкость и решительные удары. Наха-тэ, родившийся в торговом портовом городе, предпочитает технику ближнего боя и дыхательные техники, заимствованные из китайского кунг-фу. Томари-тэ из рыбацкой деревни, расположенной между ними, сочетает в себе элементы обоих.\n\nЭти стили больше не являются просто методами самообороны. Они стали философской дисциплиной, способом понимания тела, ума и отношений между ними. Мастера кодифицируют свои знания в ката, точных формах, которые воплощают боевую мудрость в движениях, которые можно практиковать открыто, не раскрывая их боевой цели." #NT!
 nd_ryu.6.a: "Рука сильнее меча." #NT!
 nd_ryu_gusuku_architecture: "Архитектура Гусуку" #NT!
 nd_ryu_gusuku_architecture_desc: "Характерные каменные крепости с изогнутыми стенами на островах Рюкю, сочетающие в себе китайские, японские и местные методы строительства, в уникально устойчивые оборонительные сооружения." #NT!
 nd_ryu_noro_priestesses: "Жрицы Норо" #NT!
 nd_ryu_noro_priestesses_desc: "Женщины-духовные лидеры, которые управляют священными рощами утаки и поддерживают духовное здоровье общин Рюкюань посредством молитв и ритуалов." #NT!
 nd_ryu_early_te: "Искусство Тэ" #NT!
 nd_ryu_early_te_desc: "Местная боевая система аристократии Рюкюань, в которой упор делается на приемы рукопашного боя, которые в конечном итоге перерастут в каратэ." #NT!
 nd_ryu_island_fisheries: "Островное рыболовство" #NT!
 nd_ryu_island_fisheries_desc: "Организованные прибрежные рыболовные сообщества, которые поддерживают население острова и обучают моряков, которые будут составлять экипажи торгового флота королевства." #NT!
 nd_ryu_seafaring_tradition: "Рюкюань Мореплавание" #NT!
 nd_ryu_seafaring_tradition_desc: "Столетия океанского плавания между разбросанными островами цепи Рюкю, создание морского искусства, лежащего в основе морской торговли королевства." #NT!
 nd_ryu_sho_hashi_unification: "Объединение Шо Хаши" #NT!
 nd_ryu_sho_hashi_unification_desc: "Слияние трех соперничающих окинавских королевств (Хокузан, Тюзан и Нанзан) под единой короной в замке Сюри в 1429 году." #NT!
 nd_ryu_entrepot_network: "Торговая сеть перевалочных пунктов" #NT!
 nd_ryu_entrepot_network_desc: "Роль королевства как морского посредника, реэкспортирующего товары между Китаем, Японией, Кореей и Юго-Восточной Азией из его центрального положения в Восточно-Китайском море." #NT!
 nd_ryu_lacquerware_craft: "Рюкюань Лаковые изделия" #NT!
 nd_ryu_lacquerware_craft_desc: "Роскошные лаковые изделия были настолько изысканными, что посланники династии Мин специально ездили в Рюкю, чтобы приобрести их, сочетая в себе китайскую технику с самобытной окинавской эстетикой." #NT!
 nd_ryu_naha_harbor: "Гавань Наха" #NT!
 nd_ryu_naha_harbor_desc: "Развитие Нахи как главного порта королевства, оборудованного для обслуживания торговых джонок, соединяющих Рюкю со всеми крупными портами Восточной Азии." #NT!
 nd_ryu_tribute_diplomacy: "Дань дипломатии" #NT!
 nd_ryu_tribute_diplomacy_desc: "Овладение системой данников Мин, обеспечение преференциального доступа к торговле и имперского признания посредством тщательной дипломатической обработки." #NT!
 nd_ryu_golden_age: "Великие дни Тюдзана" #NT!
 nd_ryu_golden_age_desc: "Золотой век при короле Шо Сине, когда в Сюри были привезены правители аджи, оружие было централизовано, а искусство процветало под королевским покровительством." #NT!
 nd_ryu_bingata_tradition: "Бингата Традиция" #NT!
 nd_ryu_bingata_tradition_desc: "Королевское искусство окрашивания тканей, уникальное для Окинавы, объединяющее индийские, китайские и яванские техники в яркие цветочные узоры, предназначенные для аристократии." #NT!
 nd_ryu_tsuboya_pottery: "Цубоя Керамика" #NT!
 nd_ryu_tsuboya_pottery_desc: "Консолидированное керамическое производство в районе Цубоя, объединяющее разбросанные печи в эффективный центр как для домашнего производства, так и для экспортной керамики." #NT!
 nd_ryu_awamori_craft: "Дистилляция Авамори" #NT!
 nd_ryu_awamori_craft_desc: "Традиционный спиртной напиток Рюкюань, дистиллированный из тайского риса с использованием черной плесени кодзи, метод, привезенный из Сиама через торговые сети королевства." #NT!
 nd_ryu_maransen_fleet: "Марансенский флот" #NT!
 nd_ryu_maransen_fleet_desc: "Быстрые, маневренные торговые джонки, специально построенные для морских маршрутов Восточной Азии, перевозящие товары между Нахой и всеми крупными портами от Малакки до Нинбо." #NT!
 nd_ryu_bankoku_shinryo: "Банкоку Синрё" #NT!
 nd_ryu_bankoku_shinryo_desc: "Мост между всеми народами: декларация, начертанная на большом колоколе замка Сюри, провозглашающая роль Рюкю как морского перекрестка Восточной Азии." #NT!
 nd_ryu_dual_sovereignty: "Двойной суверенитет" #NT!
 nd_ryu_dual_sovereignty_desc: "Тонкое искусство поддержания даннических отношений одновременно с Китаем и Сацума-Японией, сохраняя определенную автономию посредством дипломатической двусмысленности." #NT!
 nd_ryu_kobudo_development: "Кобудо" #NT!
 nd_ryu_kobudo_development_desc: "Древний боевой путь, рожденный запретом на оружие, превращающий сельскохозяйственные орудия и домашний инвентарь в орудия войны (бо, сай, тонфа, нунчаку) кама." #NT!
 nd_ryu_satsuma_era_trade: "Торговля эпохи Сацума" #NT!
 nd_ryu_satsuma_era_trade_desc: "Под надзором Сацумы королевство парадоксальным образом расширило свои торговые сети, поскольку домен поощрял торговлю Рюкю-Китай вести косвенную торговлю между Японией и Китаем." #NT!
 nd_ryu_convoy_protection: "Защита торговых конвоев" #NT!
 nd_ryu_convoy_protection_desc: "Патрульные корабли, защищающие торговый флот королевства от пиратов в Восточно-Китайском море, задокументированы еще в начале XIX века." #NT!
 nd_ryu_island_defense: "Островная цепная оборона" #NT!
 nd_ryu_island_defense_desc: "Распределили укрепления по всему архипелагу, используя естественные оборонительные преимущества островной географии против любого потенциального захватчика." #NT!
 nd_ryu_pechin_administration: "Печинская бюрократия" #NT!
 nd_ryu_pechin_administration_desc: "Административный класс, который управлял Рюкю на протяжении веков двойного суверенитета, сохраняя эффективное управление островом, несмотря на иностранное господство." #NT!
 nd_ryu_performing_arts: "Исполнительское искусство Рюкюань" #NT!
 nd_ryu_performing_arts_desc: "Утонченные придворные традиции танцевальной драмы Кумиодори, музыки сансин и классической поэзии определяют культурную самобытность Окинавы." #NT!
 nd_ryu_sugar_cultivation: "Выращивание сахара" #NT!
 nd_ryu_sugar_cultivation_desc: "Организованное производство сахарного тростника, завезенное из Китая, стало основным экспортным товаром, который поддерживал экономику королевства в последующие века." #NT!
 nd_ryu_maritime_heritage: "Морское наследие" #NT!
 nd_ryu_maritime_heritage_desc: "Столетия непрерывных морских традиций, от самых ранних межостровных путешествий до великих торговых экспедиций золотого века, передавались из поколения в поколение." #NT!
 nd_ryu_karate_codification: "Кодификация каратэ" #NT!
 nd_ryu_karate_codification_desc: "Систематизация боевых стилей Тэ в формальные школы (Сюри-тэ, Наха-тэ и Томари-тэ), каждая из которых кодифицирует поколения боевой мудрости в кодифицированные ката." #NT!
 nd_ryu_okinawan_identity: "Окинавская идентичность" #NT!
 nd_ryu_okinawan_identity_desc: "Утверждение особой культурной идентичности Рюкюань, не китайской и не японской, а исключительно окинавской, уходящей корнями в столетия независимой цивилизации." #NT!
 nd_ryu_meiji_resistance: "Сопротивление Мэйдзи" #NT!
 nd_ryu_meiji_resistance_desc: "Неповиновение насильственной аннексии и культурной ассимиляции, поскольку народ Рюкюань борется за сохранение своего языка, обычаев и суверенитета." #NT!
 nd_ryu_modern_crafts: "Возрождение современных ремесел" #NT!
 nd_ryu_modern_crafts_desc: "Адаптация традиционных ремесел Рюкюань (лаковые изделия, ткани бингата, керамика Цубоя) для современных рынков с сохранением древних техник." #NT!
 nd_ryu_maritime_legacy: "Морское наследие" #NT!
 nd_ryu_maritime_legacy_desc: "Кульминация многовековых знаний Рюкюанского мореплавания, от навигации по коралловым рифам до прохода в открытый океан, обеспечивающая связь островов с остальным миром." #NT!
 n_nd_ryu_maransen: "Марансен" #NT!
 n_nd_ryu_maransen_desc: "Быстроходные торговые джонки Рюкюань, оптимизированные для морских маршрутов Восточной Азии, сочетающие в себе китайские технологии судостроения с местным мореплаванием." #NT!
 a_nd_ryu_kobudo_militia: "Кобудо Милиция" #NT!
 a_nd_ryu_kobudo_militia_desc: "Бойцы, вооруженные импровизированным оружием (бо, сай, тонфа, нунчаку), родившиеся в результате запрета на оружие, вынудили народ Рюкюань превратить повседневные инструменты в орудия войны." #NT!
 n_nd_ryu_umibune: "Умибуне" #NT!
 n_nd_ryu_umibune_desc: "Патрульные корабли Рюкюань, предназначенные для защиты торговых конвоев королевства от пиратов в Восточно-Китайском море." #NT!
 n_nd_ryu_patrol_junk: "Патрульный мусор" #NT!
 n_nd_ryu_patrol_junk_desc: "Более легкие суда Рюкюань мобилизованы через систему сбора для береговой обороны и операций по борьбе с пиратством." #NT!
 nd_ryu_trading_house: "Торговый Дом Рюкюань" #NT!
 nd_ryu_trading_house_desc: "Коммерческий склад и брокерская фирма, обслуживающая перевалочную торговлю королевства, облегчающую обмен товарами между китайскими, японскими, корейскими и торговцами из Юго-Восточной Азии." #NT!
 nd_ryu_utaki: "Храм Утаки" #NT!
 nd_ryu_utaki_desc: "Священные рощи и места для молитв, которыми управляют жрицы Норо, духовное сердце общин Рюкюань, где возносятся молитвы о хорошем урожае и безопасном путешествии." #NT!
 nd_ryu_bingata_workshop: "Мастерская Бингата" #NT!
 nd_ryu_bingata_workshop_desc: "Королевская текстильная мастерская, производящая яркие окрашенные ткани, уникальные для Королевства Рюкю, с узорами, предназначенными для разных слоев аристократии." #NT!
 nd_ryu_lacquerware_workshop: "Лаковая мастерская" #NT!
 nd_ryu_lacquerware_workshop_desc: "Мастерская, производящая изысканные лаковые изделия Рюкюань, ценимые во всей Восточной Азии, сочетающие несколько слоев лака со сложными декоративными техниками." #NT!
 nd_ryu_tsuboya_kiln: "Цубоя печь" #NT!
 nd_ryu_tsuboya_kiln_desc: "Объединенный центр производства керамики в традициях Цубоя, где обжигают как функциональную домашнюю посуду, так и большие кувшины для хранения, используемые для выдержки авамори." #NT!
 nd_ryu_awamori_distillery: "Винокурня Авамори" #NT!
 nd_ryu_awamori_distillery_desc: "Винокурня, производящая традиционный спиртной напиток Рюкюань из тайского риса и черной плесени кодзи, выдержанный в глиняных горшках для придания ему характерного вкуса." #NT!
 nd_ryu_gusuku: "Крепость Гусуку" #NT!
 nd_ryu_gusuku_desc: "Уникальная каменная крепость Рюкюань с изящно изогнутыми стенами, сочетающая оборонительные принципы китайской и японской военной архитектуры с местными методами строительства." #NT!
 nd_ryu_harbor: "Гавань Рюкюань" #NT!
 nd_ryu_harbor_desc: "Улучшенные портовые сооружения, предназначенные для обслуживания торговых джонок, соединяющих Королевство Рюкю со всеми крупными портами Восточной и Юго-Восточной Азии." #NT!
 nd_ryu_karate_dojo: "Каратэ Додзё" #NT!
 nd_ryu_karate_dojo_desc: "Тренировочный зал, где обучают систематизированным боевым искусствам Сюри-тэ, Наха-тэ и Томари-тэ, выпуская дисциплинированных бойцов из населения острова." #NT!
 nd_ryu_sugar_mill: "Рюкюанский сахарный завод" #NT!
 nd_ryu_sugar_mill_desc: "Завод по переработке сахарного тростника в рафинированный сахар — культуру, завезенную из Китая, которая стала одним из самых ценных статей экспорта королевства." #NT!
 nd_ryu_fishing_settlement: "Рыбацкий поселок Рюкюань" #NT!
 nd_ryu_fishing_settlement_desc: "Организованное прибрежное рыболовное сообщество, обеспечивающее как пропитание, так и морское обучение населения острова." #NT!
 nd_ryu_gusuku_maintenance: "Гусуку Техническое обслуживание" #NT!
 nd_ryu_gusuku_maintenance_desc: "Уход за характерными изогнутыми каменными стенами крепости." #NT!
 nd_ryu_entrepot_operations: "Перевалочные операции" #NT!
 nd_ryu_entrepot_operations_desc: "Управление потоками товаров через торговый дом от нескольких торговых партнеров." #NT!
 nd_ryu_shrine_offerings: "Подношения святыни" #NT!
 nd_ryu_shrine_offerings_desc: "Рис и другие подношения, преподнесенные жрицами Норо в храме утаки." #NT!
 nd_ryu_bingata_dyeing: "Крашение Бингата" #NT!
 nd_ryu_bingata_dyeing_desc: "Крашение тонкой ткани с использованием импортных пигментов и уникальной трафаретной техники Бингата, уникальной для Королевства Рюкю." #NT!
 nd_ryu_lacquer_finishing: "Лаковая отделка" #NT!
 nd_ryu_lacquer_finishing_desc: "Производство лаковых изделий экспортного качества путем кропотливого нанесения нескольких слоев лака и декоративных техник." #NT!
 nd_ryu_ceramics_firing: "Обжиг керамики" #NT!
 nd_ryu_ceramics_firing_desc: "Обжиг глины для изготовления керамики в объединенных печах в традиции Цубоя." #NT!
 nd_ryu_spirit_distillation: "Дистилляция спирта" #NT!
 nd_ryu_spirit_distillation_desc: "Дистилляция тайского риса с использованием черной плесени кодзи для производства авамори, традиционного спиртного напитка Рюкюань." #NT!
 nd_ryu_harbor_maintenance: "Обслуживание порта" #NT!
 nd_ryu_harbor_maintenance_desc: "Содержание портовых сооружений, доков и навигационных средств." #NT!
 nd_ryu_dojo_upkeep: "Содержание Додзё" #NT!
 nd_ryu_dojo_upkeep_desc: "Содержание тренировочного зала и условий для студентов, занимающихся боевыми искусствами." #NT!
 nd_ryu_cane_processing: "Обработка тростника" #NT!
 nd_ryu_cane_processing_desc: "Дробление, кипячение и переработка сахарного тростника в экспортный сахар." #NT!
 nd_ryu_fishing_nets: "Рыболовные операции" #NT!
 nd_ryu_fishing_nets_desc: "Организован прибрежный лов рыбы с использованием сетей, лесок и традиционных методов для снабжения островных сообществ." #NT!
 levy_nd_ryu_kobudo_militia: "Кобудо Милиция Леви" #NT!
 levy_nd_ryu_kobudo_militia_desc: "Крестьянское ополчение Рюкюань, вооруженное импровизированным оружием, полученным из сельскохозяйственных и рыболовных орудий." #NT!
 levy_nd_ryu_patrol_junk: "Патрульный мусор Леви" #NT!
 levy_nd_ryu_patrol_junk_desc: "Суда береговой обороны, собранные у торговых общин островов Рюкю." #NT!
 nd_ryu_formed_tt: "Рюкю был сформирован" #NT!
 nd_ryu_path_a_tt: "Выбрал Банкоку Синрё" #NT!
 nd_ryu_path_b_tt: "Выбрали суверенитет островов" #NT!
 nd_ryu_destiny: "Судьба Королевства Рюкю" #NT!
 nd_ryu_destiny_desc: "Острова объединены, гавани кишат кораблями, а мир манит. Будь то Мост между народами или суверенное королевство-крепость, судьба Рюкю принадлежит нам." #NT!
 nd_ryu_dest_eastern_hub: "Восточный торговый узел" #NT!
 nd_ryu_dest_eastern_hub_desc: "Обеспечьте контроль над японскими торговыми воротами в Хакате и обеспечьте потоки шелка через рынок капитала Рюкюань. Получите 1000 золотых, чтобы финансировать расширение сети перевалочных пунктов." #NT!
 nd_ryu_dest_sea_dominance: "Доминион Восточных морей" #NT!
 nd_ryu_dest_sea_dominance_desc: "Крупные порты Малакка и Гуанчжоу должны попасть под влияние Рюкюань. Имея в казне 2000 золотых и престиж морской державы, королевство контролирует морские пути Восточной Азии." #NT!
 nd_ryu_dest_bridge_nations: "Настоящий Банкоку Синрё" #NT!
 nd_ryu_dest_bridge_nations_desc: "Окончательная реализация Моста между всеми народами. Контролируйте Темасек, Тондо и большой порт Цюаньчжоу в Цзиньцзяне. Накопите 3000 золотых, заработайте высочайший престиж и используйте банковское дело, чтобы оно стало незаменимым перекрестком глобальной торговли." #NT!
 nd_ryu_dest_satsuma_revenge: "Месть Сацуме" #NT!
 nd_ryu_dest_satsuma_revenge_desc: "Унижение вторжения Сацумы будет отплачено тем же. Захватите Кагосиму, резиденцию Симадзу, с армией численностью не менее 30 000 человек и стабильностью для ведения освободительной войны." #NT!
 nd_ryu_dest_island_power: "Цепной остров Доминион" #NT!
 nd_ryu_dest_island_power_desc: "Распространите суверенитет Рюкюаня на всю цепочку островов от Амами Осимы до Цусимы. Выставьте армию численностью в 50 000 человек и поддерживайте казну в 2 000 золотых, чтобы распространить власть через проливы." #NT!
 nd_ryu_dest_shuri_ascendant: "Асцендент Шури" #NT!
 nd_ryu_dest_shuri_ascendant_desc: "Окончательное утверждение суверенитета Рюкюань. Покорите Осаку и Киото, торговые и имперские сердца самой Японии. Выставьте 75 000 человек, держите 3 000 золотых и заработайте престиж, приличествующий континентальной державе." #NT!
 nd_ryu.7.t: "Судьба королевства" #NT!
 nd_ryu.7.d: "Королевство Рюкю стоит на перепутье. Острова объединены, гавани переполнены, и мир наблюдает, чем станет это маленькое, но гордое королевство. Путь, который мы выбрали, будет определять нас на протяжении поколений: пойдем ли мы вовне, чтобы охватить мировую торговлю, или обратимся вовнутрь, чтобы создать нерушимое островное государство, судьба Рюкю начинается сейчас." #NT!
 nd_ryu.7.a: "Наша судьба ждет." #NT!
 nd_ryu.8.t: "Ворота в Японию" #NT!
 nd_ryu.8.d: "Торговцы Рюкюань теперь контролируют порт Хаката, великие ворота японской торговли. Корабли, несущие королевский штандарт, швартуются рядом с китайскими джонками и корейскими судами, а шелк с континента свободно течет через наши склады. Сеть перевалочных пунктов, которая поддерживала Рюкю на протяжении веков, теперь достигает самого сердца крупнейшего рынка. Купцы Нахи празднуют. Но моря за его пределами манят еще более ценными призами." #NT!
 nd_ryu.8.a: "Восточная торговля наша." #NT!
 nd_ryu.9.t: "Хозяева восточных морей" #NT!
 nd_ryu.9.d: "От Малаккского пролива до дельты Жемчужной реки торговая сеть Рюкюань охватывает всю морскую Азию. Шелк и фарфор Гуанчжоу, специи и олово Малакки — все проходит через руки Рюкюань. Ни один торговый флот не плавает по этим водам, не считаясь с королевством, которое находится на их перекрестке.\n\nСможем ли мы утвердить свое господство посредством превосходства на море, защищая наши пути военными кораблями, вызывающими уважение? Или нам стоит построить сеть партнёров-данников, связывая меньшие государства с нашей торговой империей посредством дипломатии и взаимной зависимости?" #NT!
 nd_ryu.9.a: "Наши военные корабли будут править этими водами." #NT!
 nd_ryu.9.b: "Привяжите их к нам торговлей и данью." #NT!
 nd_ryu.10.t: "Мост между всеми народами" #NT!
 nd_ryu.10.d: "То, что провозгласил колокол замка Сюри много веков назад, наконец-то стало реальностью. От Темасека на оконечности Малайского полуострова до Тондо на Филиппинском архипелаге, от древней гавани Цюаньчжоу до островов специй за его пределами, корабли Рюкюань соединяют все уголки морского мира. Королевство, которое когда-то считало свое богатство кораллами и моллюсками, теперь владеет ключами к глобальной торговле.\n\nСможем ли мы укрепить эту позицию в качестве незаменимого мирового перекрестка, проводящего всю торговлю через наши гавани? Или нам следует использовать наши связи, чтобы стать высшей дипломатической силой восточных морей, выступая посредником между империями?" #NT!
 nd_ryu.10.a: "Все морские дороги ведут через Рюкю." #NT!
 nd_ryu.10.b: "Мы будем арбитрами океанов." #NT!
 nd_ryu.11.t: "Падение Сацумы" #NT!
 nd_ryu.11.d: "Кагосима горит. Великий замок Симадзу, откуда началось вторжение в 1609 году, теперь развевается под знаменем династии Сё. В течение двух столетий жители островов Рюкю терпели порабощение, их оружие было конфисковано, а их суверенитет был вежливой фикцией, поддерживаемой для китайской торговли. Больше не надо. Боевые традиции, рожденные в тайне (кобудо, карате, свирепый островной дух, который не смог сокрушить ни один оккупант), были подтверждены на поле боя. Сацума пожала то, что посеяла." #NT!
 nd_ryu.11.a: "Позор 1609 года отомщен." #NT!
 nd_ryu.12.t: "Лорды цепи островов" #NT!
 nd_ryu.12.d: "Королевство Рюкюань теперь простирается от субтропических вод вокруг Сакисимы до холодных Цусимских проливов. Каждый остров между Окинавой и материковой частью Японии признает власть Сюри. Теперь вопрос в том, как консолидировать это обширное островное владение.\n\nДолжны ли мы укрепить каждую гавань и мыс, превратив архипелаг в неприступную цепь островных крепостей? Или нам следует мобилизовать воинственный дух населения острова, превратив каждого рыбака и фермера в солдата, готового защитить королевство?" #NT!
 nd_ryu.12.a: "Каждый остров должен быть крепостью." #NT!
 nd_ryu.12.b: "Каждый островитянин должен быть воином." #NT!
 nd_ryu.13.t: "Трон Сюри правит материком" #NT!
 nd_ryu.13.d: "Невозможное было достигнуто. Осака, великий торговый мегаполис Японии, и Киото, резиденция самого императорского двора, теперь подчиняются Королевству Рюкю. Крошечное островное государство, когда-то считавшееся вассальным государством, пригодным только для торговли данью, завоевало сердце одной из величайших мировых цивилизаций. Боевые искусства, рожденные в результате угнетения (стили боя с пустыми руками, вооруженные сельскохозяйственные инструменты, свирепый дух непобедимого народа), подняли знамя Сюри на высоты, которые никто не осмеливался себе представить.\n\nБудем ли мы продолжать завоевания или превратим нашу островную империю в неприступную крепость?" #NT!
 nd_ryu.13.a: "Пусть ни одна земля не окажется за пределами нашей досягаемости." #NT!
 nd_ryu.13.b: "Укрепить то, что мы выиграли." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_naval_supremacy: "Морское превосходство" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_naval_supremacy: "Военные корабли Рюкюань патрулируют торговые пути Восточной Азии, обеспечивая безопасный проход торгового флота королевства и сдерживая любого, кто может бросить вызов его морскому господству." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_tributary_network: "Приточная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_tributary_network: "Сеть торговых зависимостей и дипломатических отношений связывает меньшие государства с коммерческой империей Рюкю, хотя поддержание этой сети обременяет военный бюджет королевства." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_world_crossroads: "Перекресток мира" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_world_crossroads: "Рюкю стал незаменимым звеном глобальной морской торговли, местом, которое привлекает поселенцев, торговцев и ученых со всех уголков известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_ocean_diplomacy: "Океанская дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_ocean_diplomacy: "Непревзойденная сеть дипломатических связей Морского королевства позволяет ему выступать посредником между империями, обеспечивать выгодные условия и распространять влияние далеко за пределы своих островных берегов." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_fortress_islands: "Острова-крепости" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_fortress_islands: "Каждая гавань и мыс в цепи островов были укреплены в соответствии с традицией гусуку, создавая неприступную защитную сеть, которая сдерживает вторжение и подавляет восстание." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_warrior_mobilization: "Мобилизация воинов" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_warrior_mobilization: "Боевые традиции кобудо и каратэ были систематизированы в национальную мобилизационную доктрину, обучающую каждого трудоспособного островитянина тому, как пополнить армию королевства в случае необходимости." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_island_conquest: "Завоевание острова" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_island_conquest: "Армии королевства маршируют с яростной решимостью островного народа, который отказался быть завоеванным, неся военные традиции Рюкю на материк, хотя боеготовность военно-морского флота страдает, поскольку ресурсы перетекают в сухопутные кампании." #NT!
 STATIC_MODIFIER_NAME_nd_ryu_dest_island_fortification: "Островное укрепление" #NT!
 STATIC_MODIFIER_DESC_nd_ryu_dest_island_fortification: "С таким трудом завоеванные завоевания закрепляются за счет быстрых укреплений и мобилизации, превращающих каждую новую территорию в еще одно звено неприступной цепи островного королевства." #NT!
 nd_ryu_grand_entrepot: "Гранд Энтрепо" #NT!
 nd_ryu_grand_entrepot_desc: "Высшее выражение роли Рюкю как моста между всеми народами: огромный торговый комплекс, где товары со всех уголков морской Азии хранятся, сортируются и реэкспортируются по всему миру." #NT!
 nd_ryu_shuri_citadel: "Цитадель Сюри" #NT!
 nd_ryu_shuri_citadel_desc: "Великолепная крепость-дворец в традициях великого гусуку, место военного владычества династии Сё над островной империей, которая теперь пользуется уважением со стороны континентальных держав." #NT!
 nd_ryu_entrepot_administration: "Администрация перевалочного пункта" #NT!
 nd_ryu_entrepot_administration_desc: "Управление обширными складскими и брокерскими операциями большого торгового комплекса." #NT!
 nd_ryu_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_ryu_citadel_garrison_desc: "Содержание гарнизона крепости-дворца и его запасов оружия и провианта." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_ryu_bureaucracy_authority: "Бюрократическая власть династии Шо" #NT!
 AUTO_MODIFIER_DESC_nd_ryu_bureaucracy_authority: "Единый суд Тюзан в Сюри-дзё управляет островами через узнаваемый бюрократический аппарат: Сансикан, магири, ротацию хики, канцелярию Кумемура, реестр дани, пэрство Госэки и иерархию норо. Теперь трон может создать формальную бюрократию." #NT!
  
 ryu_sanshikan_council_bureaucracy: "Саншикан Совет Трех" #NT!
 ryu_sanshikan_council_bureaucracy_desc: "Три главных министра (сансоси) ранга сэссэй, происходящие из княжеской линии Сё-кин и старшего пэра, которые коллективно правили под руководством короля после реформ Сё Сина (годы правления 1477-1526). У каждого министра было свое портфолио (внутренних дел, финансов, ритуалов), и решения требовали консенсуса между всеми тремя. Сансикан подписал дипломатическую корреспонденцию Рюкюань и официально принял китайских посланников в Сюри-дзё, олицетворяя соборную исполнительную власть, которая просуществовала почти четыре столетия до отмены Мэйдзи в 1879 году." #NT!
  
 ryu_magiri_administration_bureaucracy: "Администрация Магирского района" #NT!
 ryu_magiri_administration_bureaucracy_desc: "Территориальное деление королевства на магири (сельские округа), каждый из которых находится в ведении офицера джито-дай или магири-сю, подчиняющегося королевскому двору. Магири организовали сборы с земледельцев за барщинный труд, натуральный налог на рис и барщину годзайсо для строительства дани в Нахе. Зафиксированные в Рюкю-коку Юраики и более поздних реестрах, магири вытеснили старые владения клана адзи в качестве оперативной единицы королевской администрации, и этот централизованный шаг распространился на каждую деревню утаки и каждую рыбацкую деревушку на архипелаге." #NT!
  
 ryu_hiki_naval_rotation_bureaucracy: "Хики военно-морская ротация" #NT!
 ryu_hiki_naval_rotation_bureaucracy_desc: "Доковая организация Наха-дзё, которая обслуживала океанские джонки королевства (синко-сен) по вахтовой системе. Три корпуса хики (Сетадо, Арагусуку и Ягачи в списках Сё Син) выполняли циклически ответственные за раз в два года поездки с данью в Фучжоу, дежурство по приему саппуши, когда прибыли посланники династии Мин, и патрулирование подходов к Сакишиме против пиратских эскадрилий Вако. У каждого хики были свои склады, канатные дороги и опытные моряки в гавани Наха, что давало маленькому королевству дисциплинированную морскую армию, непропорциональную его населению." #NT!
  
 ryu_kumemura_diaspora_bureaucracy: "Кумемура Администрация китайской диаспоры" #NT!
 ryu_kumemura_diaspora_bureaucracy_desc: "Мин-цзин Сандзю-року Сэй, Тридцать шесть семей, поселились императором Хунву в деревне Кумэ недалеко от Нахи в 1392 году. Их потомки снабжали королевство классическими китайскими писцами, мореплавателями, обученными Хай-тао Чжэнь-цзин, переводчиками для даньных миссий и конфуцианскими учеными штата канцелярии. Кумемура руководил собственной конфуцианской школой Мейриндо (основанной в 1718 году) и разработал протоколы приема сапоши, которые регулировали каждую церемонию вступления в должность династии Мин и Цин вплоть до последних дней существования королевства." #NT!
  
 ryu_tribute_mission_bureaucracy: "Аппарат миссии дани" #NT!
 ryu_tribute_mission_bureaucracy_desc: "Специальный реестр Синко-сё, организующий раз в два года дань уважения посольствам королевства при дворе Мин (а после 1644 года и Цин) в Фучжоу и Пекине, с параллельными депутациями к даймяте Сацума в Кагосиме после вторжения Симадзу в 1609 году. Аппарат готовил дары саппо из серы, рафинированного сахара, лошадей и лаковых изделий; лицензировал посольские джонки; и обучили глав миссий сэйи-си протоколам двойного суверенитета: представить Рюкю как китайского данника в Пекине и одновременно незаметно отдать дань Эдо через Кагосиму." #NT!
  
 ryu_goseki_peerage_bureaucracy: "Госэки Старшее пэрство" #NT!
 ryu_goseki_peerage_bureaucracy_desc: "Формализованная иерархия пэров, состоящая из Во-дзи, Аджи-уфу, Аджи, Ояката и Печина, которая при Шо Сине объединила старших лордов клана аджи в придворную знать, ранжируемую по цвету шапки хатимаки. Совет Госэки утвердил повышение ранга, зарегистрировал новые феодальные владения в списках королевства и контролировал старшинство при дворе Сюри. Система объединила капризных островных лордов (бывших автономных хозяев Хокудзана, Нанзана и Сакишимы) в единую аристократию, придерживающуюся рангов, сгруппировавшуюся вокруг трона." #NT!
  
 ryu_omoro_liturgical_bureaucracy: "Литургический суд Оморо Сауши" #NT!
 ryu_omoro_liturgical_bureaucracy_desc: "Священническая должность Кикоэ-Огими (верховная жрица норо, традиционно сестра правящего короля), руководящая жрицами норо королевства, и составление Оморо Сауши, двадцатидвухкнижной литургической антологии священных песен королевства, составленной между 1531 и 1623 годами. Кикоэ-Огими исполнили обряды посвящения короля в Сефа-Утаки. освятил межостровную иерархию норо, которая связала архипелаг в единую ритуально-политическую структуру, и формализовал дополнение женского жрицы к мужскому двору в Сюри." #NT!
