l_russian:
  # Formation Event 
 nd_ahm.1.t: "Мандат Сваргадео восстановлен" #NT!
 nd_ahm.1.d: "Шесть столетий с тех пор, как Сукапха провел свой отряд Тай через перевалы Паткай в долину Брахмапутры, знамя Сваргадео снова поднимается над Чарайдео. На холме над нами стоят нетронутые курганы семнадцати королей. Колокола пайка разносятся по долине, призывая каждую семью к службе. Семь офисов Боргохайна ждут своих уставов, Борпхукан выезжает в сторону Гувахати, а намгары учеников Санкардева заполняются собравшимися жителями деревни. Моголы семнадцать раз атаковали это королевство и сломались; теперь мы выбираем, какую форму примет непокоренное царство.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ahm.1.a: "Восстановите тайский мандат Сваргадео." #NT!
 nd_ahm.1.b: "Примите вайшнавскую дхарму Санкардева." #NT!
  
  # DHE Battle of Saraighat 
 nd_ahm.2.t: "Лачит Борпхукан на Брахмапутре" #NT!
 nd_ahm.2.d: "Армада Великих Моголов Рам Сингха стоит на якоре у Сарайгата. Лачит Борпхукан, умирающий от лихорадки и унесенный в носилках, отказался отступать. Сегодня вечером Борпхукан созывает своих командиров: должен ли флот бачари устроить засаду на военные корабли Великих Моголов в излучине реки, где сужается Брахмапутра, или нам следует сжечь наши собственные деревни, отступить в холмы и позволить муссонам и джунглям убивать? Моголы ни разу не проиграли кампанию, но и никогда не воевали в нашей стране." #NT!
 nd_ahm.2.a: "Удар по излучине реки: пусть Брахмапутра станет их могилой" #NT!
 nd_ahm.2.b: "Сожгите долину: пусть джунгли и муссоны убьют их" #NT!
  
  # DHE Sankardev's Vaishnavism 
 nd_ahm.3.t: "Бхакти Шриманты Санкардева" #NT!
 nd_ahm.3.d: "Шриманта Санкардев вернулся из паломничества Махапуруши с Эка-Сараной: преданностью единому Богу, доступной без священников-брахманов, воспеваемой на ассамском языке в намгарах каждой деревни. Сатры наполняются учениками. Ортодоксия браминов при нашем дворе называет это ересью. Народы Бодо и Качари находят путь в нашу религию, который не требует от них отказа от своих богов. Сваргадео должен решить, что значит Эка-Сарана для королевства." #NT!
 nd_ahm.3.a: "Сделайте Эка-Сарану верой королевства." #NT!
 nd_ahm.3.b: "Пусть намгары стоят рядом со старыми святынями" #NT!
  
  # DHE Buranji Tradition 
 nd_ahm.4.t: "Буранджи суда" #NT!
 nd_ahm.4.d: "Придворные историки завершили последний том «Буранджи», в котором описываются времена правления Сваргадео, прием посольств, ведущиеся войны и родословная великих должностей. Написанные сначала шрифтом Тай-Ахом, а теперь переведенные на ассамский язык, Буранджи являются памятью королевства. Лишь немногие государства Южной Азии ведут столь систематический учет, как наше; немногие правители могут говорить с авторитетом шести столетий документально подтвержденной династической преемственности. Суд приказывает официально систематизировать хроники и разослать копии каждому сатру." #NT!
 nd_ahm.4.a: "Буранджи хранят память о королевстве." #NT!
  
  # DHE Paik Codification 
 nd_ahm.5.t: "Пайк Ролл" #NT!
 nd_ahm.5.d: "Каждый взрослый мужчина в долине обязан служить. Министры Боргохайна завершили большую перепись пайков: каждое домохозяйство вносит один пайк в пользу государства, организованное в группу из трех или четырех человек, назначенных на одну из крупных должностей. Три пайка поддерживают четвертого в поле. Милиция королевства, ее работа на дорогах, дамбах и верфях, а также ее налоговая база — все это происходит из этого единого института. Благодаря систематизированным спискам ни один Сваргадео не сможет править, не зная силы своего королевства для этого человека." #NT!
 nd_ahm.5.a: "Система Пайк – это хребет королевства" #NT!
  
  # Static Modifiers 
 STATIC_MODIFIER_NAME_nd_ahm_swargadeo_mandate: "Мандат Сваргадео" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_swargadeo_mandate: "Восстановление Тай-Ахома: пайк-барщина, двор Буранджи, семь великих должностей и традиция верховой езды драгунской знати: непокоренное царство наследников Сукафаа." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_eka_sarana_dharma: "Эка-Сарана Дхарма" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_eka_sarana_dharma: "Неовайшнавизм Санкардева как организующий принцип царства: намгар в каждой деревне, сатра в каждом районе, преданность, доступная всем кастам и горным народам." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_lachit_naval_doctrine: "Доктрина реки Лачит" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_lachit_naval_doctrine: "Брахмапутра — наша стена. Флот бачари патрулирует повороты; с укрепленных берегов отвечает речная пушка; ни одна армада Великих Моголов не пройдет." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_jungle_resistance: "Сопротивление джунглей" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_jungle_resistance: "Сожженные деревни, изгнание населения, засады на холмах, истощение муссонов: захватчики борются с комарами и голодом лучше, чем солдаты." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_official_vaishnavism: "Официальный вайшнавизм" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_official_vaishnavism: "Эка-Сарана как государственная религия: посещение намгара обязательно, центральное покровительство сатр, горные народы вовлечены в санскритизированную лоно." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_religious_pluralism: "Религиозный плюрализм" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_religious_pluralism: "Святилища Тай, храмы Шайвов, вайшнавские намгары и племенные священные рощи — все они находятся под защитой Сваргадео: религия этого королевства — это религия каждой деревни." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_buranji_court: "Буранджи Корт" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_buranji_court: "Шесть столетий документально подтвержденной династической преемственности, скопированной в каждую сатру и цитируемой в каждом дипломатическом обмене, государство с более долгой памятью, чем любой из его соперников." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_paik_codified: "Пайк Кодифицированный" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_paik_codified: "Каждый взрослый мужчина в списках, каждая четверка, назначенная на свою должность, каждая дамба, дорога и верфь, построенная пайкским трудом: королевство мобилизовано для домашнего хозяйства." #NT!
  
  # Advances 
 nd_ahm_paik_system: "Система Пайка" #NT!
 nd_ahm_paik_system_desc: "Учреждение барщинного труда, которое объединяло каждого взрослого мужчину-ахома в отряд из четырех человек и назначало каждого на одну из главных должностей. Милиция королевства, его общественные работы и налоговая база — все это происходит от пайка." #NT!
 nd_ahm_buranji_tradition: "Хроники Буранджи" #NT!
 nd_ahm_buranji_tradition_desc: "Традиция придворных хроник зародилась при Сукафаа и была написана сначала на тай-ахоме, а затем на ассамском языке, что является одной из величайших историографий Южной Азии и документальной основой династической преемственности." #NT!
 nd_ahm_charaideo_maidam: "Хараидео Майдамс" #NT!
 nd_ahm_charaideo_maidam_desc: "Некрополь королевского кургана в Хараидео, где традиция захоронения, заимствованная из Тай, продолжалась на протяжении шести столетий правления царей Ахома, духовное сердце королевства и узаконенное место каждой коронации." #NT!
 nd_ahm_borgohain_offices: "Семь великих должностей" #NT!
 nd_ahm_borgohain_offices_desc: "Бурхагохайн, Боргохайн, Борпатрогохайн, Борпхукан, Борбаруа и меньшие должности - совет дворянства, который уравновешивал королевскую власть и управлял королевством от Чарайдео до Гувахати." #NT!
 nd_ahm_hill_auxiliaries: "Вспомогательное оборудование на холмах" #NT!
 nd_ahm_hill_auxiliaries_desc: "Бойцы Гаро, Нага, Бодо и Качари, привлеченные на службу Ахому благодаря платному союзу и освобождению от барщины, были хозяевами местности джунглей, которые сломили каждую армию вторжения." #NT!
 nd_ahm_riverine_fleet: "Флот Брахмапутры" #NT!
 nd_ahm_riverine_fleet_desc: "Бачари и коса: легкие речные суда с артиллерийским вооружением, составляющие патрульный флот, который контролировал излучины Брахмапутры и узкие места под командованием Борпхукана." #NT!
 nd_ahm_namghar_network: "Сеть Намгар" #NT!
 nd_ahm_namghar_network_desc: "Нео-вайшнавский молитвенный зал Санкардева, учреждение религии Эка-Сарана на уровне деревни, которое объединяло холм, долину и реку в рамках общего ритуала преданности." #NT!
 nd_ahm_eka_sarana_movement: "Движение Эка-Сарана" #NT!
 nd_ahm_eka_sarana_movement_desc: "Реформа бхакти Шриманты Санкардева: преданность единому Богу на местном ассамском языке, доступная без священников-брахманов, одинаково привлекающая верующих как из племени, так и из низших каст." #NT!
 nd_ahm_tai_dragoons: "Тайские драгуны" #NT!
 nd_ahm_tai_dragoons_desc: "Конная пехота двора Ахома, потомки кавалерийской традиции Тай, которая пересекла Паткай с Сукафаа, элитным ударным оружием королевства." #NT!
 nd_ahm_saraighat_doctrine: "Доктрина Сарайгата" #NT!
 nd_ahm_saraighat_doctrine_desc: "Морская и сухопутная тактика Лачита Борпхукана, которая уничтожила флот Великих Моголов в Сарайхате в 1671 году: скоординированная засада бачари, береговая артиллерия и элитная морская атака." #NT!
 nd_ahm_dolakharia_dockyard: "Верфь Долахария" #NT!
 nd_ahm_dolakharia_dockyard_desc: "Военно-морской штаб Борпхукана находился в Гувахати, речной крепости и верфи, контролирующей устье Брахмапутры, где королевство встречалось с границей Великих Моголов." #NT!
 nd_ahm_satra_monasteries: "Монастыри Сатры" #NT!
 nd_ahm_satra_monasteries_desc: "Институциональные преемники Санкардева: монастырские комплексы, которые сами по себе стали экономическими, культурными и политическими силами, хранилища рукописных исследований и реформ вайшнавов." #NT!
 nd_ahm_seventeen_invasions: "Семнадцать вторжений отражены" #NT!
 nd_ahm_seventeen_invasions_desc: "Начиная с набега Турбака в 1532 году и заканчивая кампаниями Великих Моголов 1660-х и 1670-х годов, каждая имперская экспедиция в Ассам нарушала джунгли, сезон дождей и оборону Борпхукана." #NT!
 nd_ahm_brahmaputra_command: "Команда Брахмапутры" #NT!
 nd_ahm_brahmaputra_command_desc: "Река как логистическая магистраль и барьер, обеспечивающая быстрое движение Ахома, лишая противника снабжения и связывая долину воедино там, куда не могли добраться дороги." #NT!
 nd_ahm_jaibanmar_artillery: "Джайбанмарская артиллерия" #NT!
 nd_ahm_jaibanmar_artillery_desc: "Тяжелый артиллерийский корпус Ахома, сочетающий индийские и персидские разработки в полевой и речной артиллерии: поворотные орудия на военных кораблях, пушки Джайбан на укрепленных позициях." #NT!
 nd_ahm_ryotwari_paik: "Реформа Пайка Рудры Сингхи" #NT!
 nd_ahm_ryotwari_paik_desc: "Реструктуризация Рудрой Сингхи барщинной системы, официально оформляющая военную службу, обязательства по общественным работам и оценку доходов в едином интегрированном учреждении." #NT!
 nd_ahm_muga_silk: "Выращивание шелка Муга" #NT!
 nd_ahm_muga_silk_desc: "Золотой шелк Ассама, производимый из шелкопряда Antheraea assamensis, уникальный текстиль для долины Брахмапутры и самый выдающийся предмет роскоши, экспортируемый королевством." #NT!
 nd_ahm_chronicle_codification: "Кодификация летописи" #NT!
 nd_ahm_chronicle_codification_desc: "Формальная систематизация Буранджи придворными историками при Рудре Сингхе, фиксирующая династические и административные записи в качестве легитимизирующего документального корпуса королевства." #NT!
 nd_ahm_modern_paltan: "Современная дрель Палтан" #NT!
 nd_ahm_modern_paltan_desc: "Пехотные учения под европейским влиянием сочетались с набором пайков - модернизирующими реформами, принятыми в конце периода Ахома для борьбы с вооруженными огнестрельным оружием бирманскими и британскими армиями." #NT!
 nd_ahm_assam_tea: "Выращивание чая Ассам" #NT!
 nd_ahm_assam_tea_desc: "Чайные плантации, уникальная культура, которая стала определять современную экономику долины Брахмапутры, сначала развивались под патронажем Ахома, а затем расширялись колониальными плантаторами." #NT!
 nd_ahm_borphukan_office: "Наместничество Борпхукана" #NT!
 nd_ahm_borphukan_office_desc: "Вице-королевское управление Нижнего Ассама из Гувахати, балансирующее двор Сваргадео в Рангпуре и Чарайдео и управление границей Великих Моголов." #NT!
 nd_ahm_swargadeo_court: "Суд Сваргадео" #NT!
 nd_ahm_swargadeo_court_desc: "Абсолютистская эволюция царской власти Ахома при Рудре Сингхе и Шиве Сингхе с формальной судебной церемонией, кодифицированным законом и покровительственной санскритской высокой культурой." #NT!
 nd_ahm_anti_burmese_resistance: "Антибирманское сопротивление" #NT!
 nd_ahm_anti_burmese_resistance_desc: "Жестокая бирманская оккупация 1817–1826 годов разрушила королевство, но сформировала народную ассамскую идентичность в сопротивлении, партизанской обороне, заново связавшей холмы и долины." #NT!
 nd_ahm_assamese_revival: "Ассамское культурное возрождение" #NT!
 nd_ahm_assamese_revival_desc: "Народная литература, танец сатрия из сатр и синтез традиций Тай, Бодо, Качари и санскрита в единую ассамскую культурную идентичность." #NT!
 nd_ahm_brahmaputra_industry: "Брахмапутра Индустрия" #NT!
 nd_ahm_brahmaputra_industry_desc: "Модернизация речного хозяйства позднего периода с появлением мельниц, верфей и текстильных заводов на берегах Брахмапутры." #NT!
 nd_ahm_modernized_levy: "Модернизированный Палтан Леви" #NT!
 nd_ahm_modernized_levy_desc: "Система барщины паик была обновлена ​​для создания обученной в Европе линейной пехоты, синтеза шестивекового набора ахомов и современной военной доктрины." #NT!
  
  # Buildings 
 nd_ahm_paik_office: "Пайк Офис" #NT!
 nd_ahm_paik_office_desc: "Бюро барщинного труда при одном из крупных ведомств, организующее деревню из четырех человек, входило в ополчение, рабочие бригады и доходную базу королевства." #NT!
 nd_ahm_paik_office_maintenance: "Операция бюро Пайк" #NT!
 nd_ahm_paik_office_maintenance_desc: "Клерки, писцы и надсмотрщики ведут свитки пайков и распределяют домашние хозяйства по обслуживанию." #NT!
 nd_ahm_buranji_archive: "Архив Буранджи" #NT!
 nd_ahm_buranji_archive_desc: "Скрипторий придворных хроник, где написаны, копированы и хранятся истории королевства на тай-ахоме и ассамском языке, документальная память о королевстве." #NT!
 nd_ahm_buranji_maintenance: "Скрипторий Буранджи" #NT!
 nd_ahm_buranji_maintenance_desc: "Переписчики переписывают тома летописей на рукописи санчипата, используя чернила, пчелиный воск и переплетенные бумажные обложки." #NT!
 nd_ahm_maidam_complex: "Комплекс Чарайдео Майдам" #NT!
 nd_ahm_maidam_complex_desc: "Королевский курган-некрополь, где традиция захоронения, заимствованная из Тай, продолжалась на протяжении шести столетий правления царей Ахома, духовное сердце королевства." #NT!
 nd_ahm_maidam_maintenance: "Почитание Майдам" #NT!
 nd_ahm_maidam_maintenance_desc: "Земляные курганы с каменным лицом, поддерживаемые ремонтом каменной кладки, периодическим повторным освящением и приношениями живых членов королевской линии." #NT!
 nd_ahm_namghar: "Намгар" #NT!
 nd_ahm_namghar_desc: "Деревенский молитвенный зал Санкардева, институциональное ядро ​​религии Эка-Сарана: открытый зал с центральной подставкой для Священных Писаний, коллективное чтение и отсутствие святилища, ограниченного кастами." #NT!
 nd_ahm_namghar_maintenance: "Поклонение Намгару" #NT!
 nd_ahm_namghar_maintenance_desc: "Ежедневное собрание наам-прасанги, чтение киртанов и рукописей «Бхагавата-пураны» служат основой деревенской преданной жизни." #NT!
 nd_ahm_dockyard: "Верфь Долахария" #NT!
 nd_ahm_dockyard_desc: "Военно-морской штаб Борпхукана находится в Гувахати, речной крепости и верфи, откуда флот Брахмапутры совершает вылазки, чтобы встретить каждое вторжение Великих Моголов." #NT!
 nd_ahm_dockyard_maintenance: "Операции речного флота" #NT!
 nd_ahm_dockyard_maintenance_desc: "Судостроители, рабочие на канатных дорогах и бригады военно-морских артиллеристов обслуживают эскадрильи бачари и коса флота Брахмапутры." #NT!
 nd_ahm_satra: "Сатра" #NT!
 nd_ahm_satra_desc: "Монастырский комплекс вайшнавов линии Эка-Шарана: рукописный скрипторий, религиозный центр, сельскохозяйственное поместье и политический округ в одном учреждении." #NT!
 nd_ahm_satra_maintenance: "Сатра Монашеская жизнь" #NT!
 nd_ahm_satra_maintenance_desc: "Бхакаты и адхикары сатры выполняют свои религиозные, писцовые и административные обязанности под руководством сатрадхикара." #NT!
 nd_ahm_muga_silk_processing: "Обработка шелка Муга" #NT!
 nd_ahm_muga_silk_processing_desc: "Выращивание, намотка и ткачество шелка Муга из шелкопряда Antheraea assamensis в мастерских, организованных сатрами, для производства фирменной золотой ткани королевства." #NT!
 nd_ahm_tea_cultivation: "Выращивание чая" #NT!
 nd_ahm_tea_cultivation_desc: "Дикая Camellia sinensis assamica, выращенная под наблюдением сатр, стала первым официальным производством чая в долине Брахмапутры." #NT!
 nd_ahm_river_industry: "Промышленный завод Брахмапутры" #NT!
 nd_ahm_river_industry_desc: "Модернизированные мануфактуры на берегу реки, объединяющие фабрику, верфь и текстильные фабрики, промышленную инфраструктуру позднего Ахома и после реставрации на Брахмапутре." #NT!
 nd_ahm_river_industry_maintenance: "Промышленные операции" #NT!
 nd_ahm_river_industry_maintenance_desc: "Плотники, кузнецы и слесари обслуживают работы и производят инструменты, пиломатериалы и обрабатываемые металлоконструкции для экономики региона." #NT!
 nd_ahm_river_textile_works: "Речной текстильный завод" #NT!
 nd_ahm_river_textile_works_desc: "Промышленное ткачество из хлопка и шелковой ткани Муга на экспорт через торговую сеть Брахмапутры." #NT!
  
  # Units 
 a_nd_ahm_paik_militia: "Пайк Милиция" #NT!
 a_nd_ahm_paik_militia_desc: "Пехотинцы, призванные на барщину, составляют основную часть каждой армии Ахома, вооруженные клинком кханда, шкурным щитом и фитильным ружьем или луком в зависимости от эпохи." #NT!
 a_nd_ahm_hill_auxiliary: "Вспомогательное оборудование на холмах" #NT!
 a_nd_ahm_hill_auxiliary_desc: "Бойцы Гаро, Нага, Бодо и Качари под командованием Ахома, мастера засад в джунглях и разбитой холмистой местности, окружающей долину Брахмапутры." #NT!
 a_nd_ahm_dragoon: "Тайские драгуны" #NT!
 a_nd_ahm_dragoon_desc: "Конная пехота двора Ахома, потомки кавалерийской традиции Тай, которая пересекла Паткай с Сукафаа, элитным ударным оружием королевства." #NT!
 a_nd_ahm_borphukan_marines: "Морские пехотинцы Борпхукана" #NT!
 a_nd_ahm_borphukan_marines_desc: "Элитная военно-морская пехота Лачита Борпхукана, победившая при Сарайгате в 1671 году, где они поднялись на абордаж и уничтожили армаду Великих Моголов на Брахмапутре." #NT!
 a_nd_ahm_jaibanmar: "Джайбанмарская артиллерия" #NT!
 a_nd_ahm_jaibanmar_desc: "Тяжелый артиллерийский корпус Ахом, укомплектованный джайбанскими пушками и поворотными орудиями, сочетающими в себе влияние индийской и персидской артиллерии." #NT!
 a_nd_ahm_paltan: "Современный Палтан" #NT!
 a_nd_ahm_paltan_desc: "Прошедшая европейскую подготовку линейная пехота, набираемая посредством барщины пайк, модернизирующих реформ позднего периода Ахома, чтобы противостоять противникам, вооруженным огнестрельным оружием." #NT!
 a_nd_ahm_assamese_paltan: "Ассамский палтан" #NT!
 a_nd_ahm_assamese_paltan_desc: "Современная линейная пехота, созданная путем набора пайков, синтеза шестивековой традиции набора ахомов и современной военной подготовки." #NT!
 n_nd_ahm_river_warship: "Брахмапутра военный корабль" #NT!
 n_nd_ahm_river_warship_desc: "Бачари и коса: легкие речные суда с артиллерийским вооружением, составляющие патрульный флот Брахмапутры под командованием Борпхукана." #NT!
  
  # Variable tooltips (gate the destiny tree) 
 nd_ahm_formed_tt: "Образовал Королевство Ахом." #NT!
 nd_ahm_path_a_tt: "Выбрать тайский мандат Сваргадео" #NT!
 nd_ahm_path_b_tt: "Выбрал дхарму Эка-Сарана Санкардева." #NT!
  
  # ===== DESTINY TREE ===== 
  
  # Destiny advances 
 nd_ahm_destiny: "Непокоренное царство" #NT!
 nd_ahm_destiny_desc: "Шесть веков правления Тай-Ахома, отбито семнадцать вторжений Великих Моголов. Выбор Сваргадео между имперским могуществом и религиозной федерацией определит, каким станет это королевство." #NT!
 nd_ahm_dest_bengal_frontier: "Отправление в долину Сурма" #NT!
 nd_ahm_dest_bengal_frontier_desc: "Пересеките дельту Брахмапутры и захватите границу Нижней Бенгалии. Возьмите Силхет на Сурма и Мименсингх на Старой Брахмапутре, чтобы вырваться из бассейна Ассама и попасть в собственно Бенгалию." #NT!
 nd_ahm_dest_bengal_core: "Захватить столицы Бенгалии" #NT!
 nd_ahm_dest_bengal_core_desc: "Места Хусейна Шахи отдаются пайкскому ополчению. Возьмите Гаур на Ганге и Сонаргаон на Мегне, две столицы средневековой Бенгалии, и соберите армию из пятидесяти полков, чтобы удержать завоеванную страну." #NT!
 nd_ahm_dest_imperial_court: "Империум Сваргадео" #NT!
 nd_ahm_dest_imperial_court_desc: "Пандуа кланяется, бирманская граница прорывается у Пиньи и Сагаинга. Мандат Тай теперь простирается от Паткая до нижнего Ганга. Постройте императорский двор, который объединит династическую легитимность Харайдео с высокой культурой санскритской Бенгалии." #NT!
 nd_ahm_dest_satra_outreach: "Сатры в объятиях" #NT!
 nd_ahm_dest_satra_outreach_desc: "Реформа Санкардева затрагивает более широкий восточный мир. С приходом эпохи Возрождения и торговлей шелком Муга на рынке королевства сатры превратились в сеть, выходящую за пределы долины." #NT!
 nd_ahm_dest_bay_pilgrimage: "Паломничество по побережью залива" #NT!
 nd_ahm_dest_bay_pilgrimage_desc: "Возьмите Читтагонг и Кхулну, посадите сатры на побережье Сундарбана и свяжите устья рек в сеть вайшнавов. С печатным станком и сокровищницей в две тысячи золотых преданная федерация достигает моря." #NT!
 nd_ahm_dest_pan_vaishnava: "Панвайшнавское Содружество" #NT!
 nd_ahm_dest_pan_vaishnava_desc: "Мраук-У, Чандравип и Пегу присоединились под защиту Сваргадео. Имея глобальную торговлю и три тысячи золотых в казне, Махапуруша Махасаттра становится резиденцией махараджи Востока, правителя сообщества вайшнавов на побережье залива." #NT!
  
  # Destiny event 6: Root committed 
 nd_ahm.6.t: "Судьба выбрана" #NT!
 nd_ahm.6.d: "Министры Боргохайна собираются в Чарайдео, чтобы прочитать хроники только что сделанного выбора. Придворные историки готовят новые тома Буранджи; жрецы-мейдам освящают новую землю для будущих королей; Борпхукан едет на восток, чтобы звонить в колокола пайк. Непокоренное королевство начинает свою вторую эпоху." #NT!
 nd_ahm.6.a: "Правление Сваргадео начинается заново" #NT!
  
  # Destiny event 7: Bengal Frontier 
 nd_ahm.7.t: "Сурма и Старая Брахмапутра" #NT!
 nd_ahm.7.d: "Силхет пал, Мименсингх пал, граница нижней Бенгалии впервые в нашей истории удерживается Ахом Пайксом. В хрониках говорится, что ни один Тай-Ахом Сваргадео никогда не правил к западу от дельты Брахмапутры. Летопись теперь неверна. Губернаторы Хусейн-Шахи отступают в Гаур, отправляя в Дели письма с тревогой. Королевство перешло в Бенгалию." #NT!
 nd_ahm.7.a: "Граница движется на запад" #NT!
  
  # Destiny event 8: Bengal Core 
 nd_ahm.8.t: "Водопад Гаур, Сонаргаон подчиняется" #NT!
 nd_ahm.8.d: "Власть Хусейна Шахи рушится. Гаур, великая столица Ганги, оккупирован; Сонаргаон на Мегне подчиняется правлению Боргохайна. Историки Буранджи начинают новую главу: царство Сукафа теперь правит от Паткая до нижнего Ганга. Совет Боргохайна обсуждает, как удержать завоевание. Следует ли распространить барщину паик на новые районы, мобилизуя каждую бенгальскую семью в имперскую машину? Или следует полностью пересадить офисы Боргохайна, управляя ими через существующую бенгальскую знать?" #NT!
 nd_ahm.8.a: "Продлить пайк-барщину: каждое хозяйство служит Империуму" #NT!
 nd_ahm.8.b: "Передача управления Боргохайном через местную знать." #NT!
  
  # Destiny event 9: Imperial Court capstone 
 nd_ahm.9.t: "Императорский двор в Хараидео" #NT!
 nd_ahm.9.d: "Пандуа покоряется, Пинья падает, монастыри Сагаинга открывают свои ворота. Знамя Сваргадео теперь реет над континентальной империей, простирающейся от бирманских холмов до поймы Ганга. Двор в Хараидео перестроен в императорскую резиденцию: санскритские церемонии слиты с династическими ритуалами Тай, хроники Буранджи слиты с историографией персидского двора. Борпхукан спрашивает Сваргадео, куда теперь движется королевство: к консолидации континента или дальше к восточной границе?" #NT!
 nd_ahm.9.a: "Укрепите империю Сваргадео." #NT!
 nd_ahm.9.b: "Двигайтесь дальше на восток: сломайте границу с Бирмой" #NT!
  
  # Destiny event 10: Satra Outreach 
 nd_ahm.10.t: "Сатры простираются наружу" #NT!
 nd_ahm.10.d: "Шелк муга проходит через мастерские сатр и попадает на рынки всего мира; типография печатает «Бхагавата-пурану» на ассамском языке, чтобы доставить читателей через восточные границы. Реформа бхакти Санкардева (некогда движение верхней Брахмапутры) теперь распространяется на Сундарбаны и горные царства за их пределами. Намгары начинают объединяться в сети." #NT!
 nd_ahm.10.a: "Пусть Эка-Сарана течет наружу." #NT!
  
  # Destiny event 11: Bay Pilgrimage 
 nd_ahm.11.t: "Сундарбаны открыты для Сатры" #NT!
 nd_ahm.11.d: "Порт Читтагонга и приливные леса Кхулны теперь подчиняются Сваргадео. Сатры посылают своих бхакатов вниз по рекам, чтобы сажать намгары среди рыбаков Сундарбана и плантаторов риса в Читтагонге. Сатрадхикары спорят о том, как следует управлять новой сетью: как совет равных сатр, собирающихся во время паломничества на побережье, или как популярное движение Эка-Сарана, распространяющееся без иерархии среди простых жителей деревни?" #NT!
 nd_ahm.11.a: "Сформируйте совет сатр на побережье залива." #NT!
 nd_ahm.11.b: "Пусть движение Намгар распространится среди людей" #NT!
  
  # Destiny event 12: Pan-Vaishnava capstone 
 nd_ahm.12.t: "Махараджа Востока" #NT!
 nd_ahm.12.d: "Мраук-У кланяется, Чандравип присоединяется, буддийский двор Пегу признает охранительный суверенитет Сваргадео. Махапуруша Махасаттра освящена как резиденция сообщества вайшнавов, простирающегося от Сундарбана до дельты Иравади. Сваргадео прославляется как Махараджа Востока. Суд спрашивает, как следует организовать это содружество: через прибрежную торговлю и дипломатические связи с Индийским океаном или только через сеть сатр, обращенную внутрь федерацию преданности?" #NT!
 nd_ahm.12.a: "Откройте Содружество для торговли в заливе" #NT!
 nd_ahm.12.b: "Свяжите федерацию только сатрой" #NT!
  
  # Variable tooltip already declared above 
  
  # Destiny static modifiers 
 STATIC_MODIFIER_NAME_nd_ahm_dest_paik_imperial: "Пайк Империум" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_paik_imperial: "Каждое домохозяйство в покоренной Бенгалии вступало в списки пайк: барщинная система распространялась на континент, имперская машина была мобилизована в деревне." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_borgohain_governance: "Управление Боргохайн" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_borgohain_governance: "Семь великих должностей были перенесены в Бенгалию и управляли через существующую знать заминдари: более медленная мобилизация, но более плавное поглощение завоеванной страны." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_swargadeo_imperium: "Империум Сваргадео" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_swargadeo_imperium: "Хараидео был перестроен в имперскую резиденцию, гарнизоны объединились по всему континенту, Буранджи перестроили, чтобы записать королевство, простирающееся от Паткая до нижнего Ганга." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_burmese_frontier: "Бирманская граница" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_burmese_frontier: "Паткай переправился в другом направлении. Речной флот на Иравади, пайкские гарнизоны в засушливой зоне, тайские драгуны на равнине верхней Бирмы." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_diplomacy: "Сатра Дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_diplomacy: "Бхакаты служат посланниками; сатры как посольства. Реформа Санкардева проходит по торговым путям побережья залива под печатью Сваргадео." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_namghar_outreach: "Намгар Информационно-пропагандистская деятельность" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_namghar_outreach: "Движение Эка-Сарана опережает иерархию сатр: намгары в каждой рыбацкой деревне распространяют преданность среди плантаторов риса Сундарбана и побережья Читтагонга." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_eastern_maharaja: "Махараджа Востока" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_eastern_maharaja: "Содружество на побережье залива, связанное торговлей: Читтагонг, Мраук-У, Пегу под защитным суверенитетом Сваргадео, послы Индийского океана, прибывающие в Чарайдео." #NT!
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_commonwealth: "Содружество Сатра" #NT!
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_commonwealth: "Обращенная внутрь федерация намгаров и сатр, простирающаяся от Брахмапутры до Иравади, связанная преданностью, а не рынком: линия передачи Махапуруши как конституция царства." #NT!
  
  # Destiny buildings 
 nd_ahm_imperial_court: "Императорский двор" #NT!
 nd_ahm_imperial_court_desc: "Краеугольный камень пути А: тайско-индуистский синкретический двор, сочетающий династический ритуал Харайдео с высокой культурой санскритской Бенгалии, резиденция континентальной империи Сваргадео." #NT!
 nd_ahm_imperial_court_maintenance: "Церемония Императорского двора" #NT!
 nd_ahm_imperial_court_maintenance_desc: "Придворные шелка, церемониальная бумага, лакированная мебель и ритуальные благовония поддерживают имперский протокол синкретического двора Сваргадео." #NT!
 nd_ahm_mahapurusha_satra: "Махапуруша Махасаттра" #NT!
 nd_ahm_mahapurusha_satra_desc: "Краеугольный камень Пути Б: великий сатра линии Махапуруши, резиденция сатрадхикара панвайшнавского государства и узел сети намгаров на побережье залива." #NT!
 nd_ahm_mahapurusha_maintenance: "Поклонение Махасаттре" #NT!
 nd_ahm_mahapurusha_maintenance_desc: "Копирование рукописей, лампы из пчелиного воска, благовония для ежедневной наам-прасанги и печатные книги, которые бхакаты разносили сатрам всего Содружества." #NT!
  
  # Bureaucracy: institutional layers of the Tai-Ahom polity 
 ahm_patro_mantri_sabha_bureaucracy: "Патро Мантри Сабха" #NT!
 ahm_patro_mantri_sabha_bureaucracy_desc: "Постоянный совет семи великих должностей: Бурхагохайн, Боргохайн, Борпатрогохайн, Борпхукан, Борбаруа, Баргохайн и младшие офицеры. Кодифицированный при Сухунгмунге (годы правления 1497-1539) и расширенный при Пратапе Сингхе, Сабха подтверждала наследование престола Сваргадео и могла свергать неподходящих королей. Конституционный контроль государства Ахом отличал его от соседей-моголов и бенгальцев: Сваргадео правили вместе с советом, а не над ним." #NT!
 ahm_paik_khel_bureaucracy: "Администрация Пайк-Хеля" #NT!
 ahm_paik_khel_bureaucracy_desc: "Постоянное барщинное бюро при ликчауских паик-ролочниках. Согласно правилам Момаи Тамули Борбаруа (1609 г.), каждый взрослый мужчина был зачислен в гот из трех или четырех пайков, причем каждый пайк поочередно служил в офисе кхела. Три пайка поддерживали четвертого в милиции или трудовой службе. Эта система укомплектовала речной флот Бачари, построила набережные Брахмапутры и представляла собой постоянный набор, который семнадцать раз разбивал армии Великих Моголов в семнадцатом веке." #NT!
 ahm_buranji_likchau_bureaucracy: "Буранджи Ликчау" #NT!
 ahm_buranji_likchau_bureaucracy_desc: "Институционализированный аппарат судебной хроники. Буранджи (это слово означает «хранилище невиданных вещей») сначала были написаны шрифтом Тай-Ахом, а затем на ассамском языке. Корпус грамотных писцов присутствовал на каждом заседании суда, в каждом посольстве и каждой кампании, создавая одну из величайших неимперских летописных традиций Южной Азии. С Буранджи советовались как с юридическим прецедентом и дипломатическим рекордом девятнадцатого века, институциональной памятью, которой не хватало соседям королевства." #NT!
 ahm_sattradhikar_mandali_bureaucracy: "Саттрадхикар Мандали" #NT!
 ahm_sattradhikar_mandali_bureaucracy_desc: "Институционализированное собрание вайшнавских монашеских властей, глав сатр, основанное Шримантой Санкардевом (1449-1568) и систематизированное Мадхабдевом. Великие сатры (Ауниати, Дакхинпат, Гархмур, Курувабахи) владели коронными грантами земли в пользование деботтар и брахмоттар, управляли своими собственными земледельцами, руководили деревенскими общинами намгар и разрешали споры за пределами судов Патра Мантри. Преданность Эка-Саране предложила Бодо, Качари и другим народам долины путь интеграции, от которого отказывался брахманический индуизм." #NT!
  
  # Auto-modifier: bureaucracy slot grant on formation 
 AUTO_MODIFIER_NAME_nd_ahm_bureaucracy_authority: "Бюрократическая власть Ахома" #NT!
 AUTO_MODIFIER_DESC_nd_ahm_bureaucracy_authority: "Восстановленный мандат Сваргадео дает институциональную власть над офисами Патра Мантри. Предоставляются два бюрократических места; суд Гаргаона добавляет еще одно." #NT!
 nd_ahm_eka_sarana_workshop: "Мастерская Эка-Сарана" #NT!
 nd_ahm_eka_sarana_workshop_desc: "Производственное дополнение к сатре. Там, где монастырь копирует Священные Писания и проводит молитвы, мастерская наматывает шелк муга из коконов, собранных в рощах верхнего Ассама, и прессует чайный лист из долины Брахмапутры в сундуки коммерческого качества. Мануфактура, имеющая лицензию сатры и находящаяся под надзором саттрадхикара." #NT!
 nd_ahm_workshop_muga_silk_pm: "Муга шелковая намотка" #NT!
 nd_ahm_workshop_muga_silk_pm_desc: "Золотые шелковичные черви Antheraea muga из верхнего Ассама питались деревьями сом и суалу. Рилеры прядут из коконов фирменный золотой шелк долины Брахмапутры, который ценится при дворах северной Индии и Бутана." #NT!
 nd_ahm_workshop_assam_tea_pm: "Выращивание чая Ассам" #NT!
 nd_ahm_workshop_assam_tea_pm_desc: "Завезенный Сингпхо дикий чай из предгорий Брахмапутра-Паткай, выращиваемый как плантационная культура и обрабатываемый в садах, имеющих лицензию сатры. Чай из кирпича и сундука для торговли внутри страны и в Бенгальском заливе." #NT!
