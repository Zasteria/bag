l_russian:
 STATIC_MODIFIER_NAME_nd_sca_lords_of_the_northern_seas: "Владыки северных морей" #NT!
 STATIC_MODIFIER_DESC_nd_sca_lords_of_the_northern_seas: "Объединенный Север контролирует воды от Арктики до Балтики. Наши кили рассекают каждую волну, наши торговцы заполняют каждую гавань, а наши военные корабли охраняют узкие проливы, которые всем приходится пройти." #NT!
 STATIC_MODIFIER_NAME_nd_sca_all_thing_of_the_north: "Все о Севере" #NT!
 STATIC_MODIFIER_DESC_nd_sca_all_thing_of_the_north: "От древних собраний тингов до советских палат союза, скандинавы управляли на основе согласия и закона. Это царство связано не только завоеваниями, но и общими обычаями и голосом свободных людей." #NT!
 nd_sca.1.t: "Объединение Скандинавии" #NT!
 nd_sca.1.d: "Мечта Маргарет I (единая корона, объединяющая Данию, Норвегию и Швецию) осуществилась заново. Если Кальмарский союз был разрушен из-за соперничества и расстояния, то это скандинавское королевство стоит на более прочном фундаменте. От богатых сельдью вод Зунда до железных гор Бергслагена, от фьордов Норвегии до лесов Финляндии - теперь один народ говорит одним голосом.\n\nНо какой это будет голос? Будем ли мы смотреть вовне, как это делали наши предки-викинги, управляя морями и строя империю торговли и парусного спорта? Или нам стоит заглянуть внутрь себя, связывая наши разнообразные народы древней традицией Существа, управлением посредством собрания, закона и согласия?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sca.1.a: "Наша судьба лежит на волнах." #NT!
 nd_sca.1.b: "Закон и собрание должны объединить нас." #NT!
 STATIC_MODIFIER_NAME_nd_sca_reformation_zeal: "Реформаторское рвение" #NT!
 STATIC_MODIFIER_DESC_nd_sca_reformation_zeal: "Чистое слово Евангелия, проповедуемое на языках Севера, смело старую латинскую церковь. Наши люди поклоняются с новой убежденностью." #NT!
 STATIC_MODIFIER_NAME_nd_sca_crown_over_church: "Корона над церковью" #NT!
 STATIC_MODIFIER_DESC_nd_sca_crown_over_church: "Захватив церковные земли и поставив епископов под королевскую власть, скандинавская корона получила огромное богатство и беспрецедентный контроль над духовной жизнью королевства." #NT!
 nd_sca.2.t: "Северная Реформация" #NT!
 nd_sca.2.d: "Ветры религиозных реформ, пронесшиеся по Европе, нашли благодатную почву в Скандинавии. Следуя примеру Мартина Лютера, такие реформаторы, как Ганс Таузен в Дании и Олаус Петри в Швеции, перевели Священные Писания на народные языки Севера. Старая католическая иерархия, уже ослабленная расстоянием от Рима и независимостью скандинавских епископов, рухнула перед новой верой.\n\nХристиан III из Дании и Густав Васа из Швеции оба увидели политические преимущества реформы: огромные церковные земли могут быть конфискованы для короны, а национальные церкви под королевским контролем укрепляют государственную власть. Но Реформация – это больше, чем просто захват земель. Для обычных скандинавов впервые услышать Евангелие на своем родном языке — это глубокий духовный опыт.\n\nКак этот объединенный Север будет формировать свою реформированную церковь?" #NT!
 nd_sca.2.a: "Пусть Евангелие проповедуется на всех северных языках." #NT!
 nd_sca.2.b: "Богатство церкви принадлежит короне." #NT!
 STATIC_MODIFIER_NAME_nd_sca_carolean_fury: "Кэрол Фьюри" #NT!
 STATIC_MODIFIER_DESC_nd_sca_carolean_fury: "Метод Каролины, холодное оружие и неуклонное наступление под огнем превратили скандинавскую пехоту в ужас на европейских полях сражений." #NT!
 STATIC_MODIFIER_NAME_nd_sca_allotment_discipline: "Дисциплина распределения" #NT!
 STATIC_MODIFIER_DESC_nd_sca_allotment_discipline: "Посредством надельной системы каждый фермерский округ содержит солдата в мирное время и отправляет его на войну. Королевство может мобилизоваться с поразительной скоростью и с минимальными затратами." #NT!
 nd_sca.3.t: "Каролинское наследие" #NT!
 nd_sca.3.d: "При Карле XI и Карле XII Швеция создала военную машину, не похожую ни на одну другую в Европе. Каролинцы, названные в честь своих королей-воинов, — это не просто призывники, а полупрофессиональные солдаты, воспитанные посредством indelningsverket, системы распределения. Каждый полк набран из определенной провинции, а фермы сгруппированы для поддержки и оснащения одного солдата, который круглый год тренируется на землях короны.\n\nНа поле боя карольская тактика отвергает европейскую тенденцию к статическому залповому огню. Вместо этого шведская пехота бесшумно продвигается под артиллерийским огнем противника до близкого расстояния, а затем наносит один разрушительный залп, за которым следует немедленная атака штыками и пиками: печально известная доктрина га-па. Под Нарвой восемь тысяч карольцев разгромили сорок тысячную русскую армию.\n\nКак Скандинавия будет продолжать это военное наследие?" #NT!
 nd_sca.3.a: "Га-па сломает любую черту!" #NT!
 nd_sca.3.b: "Система распределения – наша истинная сила." #NT!
 nd_sca.4.t: "Великая Медная гора" #NT!
 nd_sca.4.d: "На протяжении веков медный рудник Фалунь был сокровищницей Севера. На пике своего развития в середине семнадцатого века Великая Медная гора производила две трети всей меди в Европе. Тайный совет назвал его сильнейшим укреплением королевства (не каменным, а монетным. Шведские войны, дипломатия и государственное строительство финансировались за счет бесконечных пластов руды Фалуна.\n\nМетод поджога) огромные костры, зажженные глубоко под землей, чтобы расколоть скалу, вырезали помещения размером с собор. Когда в результате великого обвала 1687 года открылась яма, видимая на многие мили, это лишь показало, сколько уже было извлечено. Шахта выдерживает испытание временем, являясь памятником скандинавской промышленности и терпеливому извлечению богатства из неподатливого камня." #NT!
 nd_sca.4.a: "Богатство горы служит королевству." #NT!
 nd_sca_thing_assemblies: "Сборки вещей" #NT!
 nd_sca_thing_assemblies_desc: "Скандинавская традиция Тинга (собрания под открытым небом, где свободные люди собирались для разрешения споров, провозглашения закона и выбора лидеров) формировала управление во всем скандинавском мире." #NT!
 nd_sca_viking_seamanship: "Морское дело викингов" #NT!
 nd_sca_viking_seamanship_desc: "Поколения норвежского мореходного мастерства, отточенные в открытой Атлантике и Балтике, живут в традициях кораблестроения и навигационных знаниях скандинавских народов." #NT!
 nd_sca_stave_church_tradition: "Деревянная церковная традиция" #NT!
 nd_sca_stave_church_tradition_desc: "Деревянные деревянные церкви Норвегии и Швеции, сочетающие христианскую преданность со скандинавским мастерством, являются памятниками уникального культурного синтеза Скандинавии." #NT!
 nd_sca_norse_runic_legacy: "Скандинавское руническое наследие" #NT!
 nd_sca_norse_runic_legacy_desc: "Руническая традиция Севера, от памятных камней до административных записей, способствовала развитию культуры грамотности и ведения записей, которая предшествовала изучению латыни в Скандинавии." #NT!
 nd_sca_allodial_rights: "Аллодиальные права" #NT!
 nd_sca_allodial_rights_desc: "Скандинавская традиция одельсретта, права семей владеть и наследовать землю, свободную от феодальных повинностей, создала класс независимых свободных землевладельцев, не имеющий аналогов в Европе." #NT!
 nd_sca_herring_markets: "Сельдь Рынки" #NT!
 nd_sca_herring_markets_desc: "Крупные рынки сельди Скании привлекали купцов со всей Северной Европы, что сделало торговлю соленой селедкой одной из основ скандинавской торговли." #NT!
 nd_sca_bergslagen_ironworks: "Бергслагенский металлургический завод" #NT!
 nd_sca_bergslagen_ironworks_desc: "Железные и медные рудники района Бергслаген в центральной Швеции со времен средневековья поставляли сырье для инструментов, оружия и экспорта." #NT!
 nd_sca_hanseatic_challenge: "Ганзейский вызов" #NT!
 nd_sca_hanseatic_challenge_desc: "Разрушив торговую хватку Ганзейского союза, скандинавские купцы создали свои собственные торговые сети по всему Балтийскому и Северному морям." #NT!
 nd_sca_nordic_law_codes: "Кодексы законов Северных стран" #NT!
 nd_sca_nordic_law_codes_desc: "Кодификация законов провинций Северных стран, от Норвежского национального кодекса Магнуса Лагаботе до законов провинций Швеции, создала единую правовую основу для управления." #NT!
 nd_sca_scandinavian_court_culture: "Скандинавская придворная культура" #NT!
 nd_sca_scandinavian_court_culture_desc: "Обучение эпохи Возрождения и покровительство искусству при дворах Копенгагена и Стокгольма способствовали развитию самобытной скандинавской культурной самобытности." #NT!
 nd_sca_naval_yards: "Северные военно-морские верфи" #NT!
 nd_sca_naval_yards_desc: "Специально построенные королевские верфи в Копенгагене, Карлскруне и других портах дали Скандинавии возможность строить и поддерживать мощный балтийский флот." #NT!
 nd_sca_northern_reformation: "Северная Реформация" #NT!
 nd_sca_northern_reformation_desc: "Принятие лютеранства по всей Скандинавии превратило церковь в инструмент государственной власти, давая простым людям Священные Писания на их родных языках." #NT!
 nd_sca_hakkapeliitta_tradition: "Традиция Хаккапелитта" #NT!
 nd_sca_hakkapeliitta_tradition_desc: "Финский Hakkapeliitat, легкая кавалерия, атаковавшая с боевым кличем «Hakkaa paalle!» (Срубите их!), стали самыми устрашающими конными воинами в Северной Европе." #NT!
 nd_sca_baltic_dominion: "Балтийский Доминион" #NT!
 nd_sca_baltic_dominion_desc: "Скандинавский контроль над обоими берегами Балтийского моря превратил этот регион в северное озеро с соответствующей дипломатической и военно-морской мощью." #NT!
 nd_sca_falun_copper_mountain: "Великая Медная гора" #NT!
 nd_sca_falun_copper_mountain_desc: "Медный рудник в Фалуне, производивший на пике своего развития две трети меди в Европе, назывался величайшим укреплением королевства: его богатство веками финансировало шведские войны и государственное управление." #NT!
 nd_sca_swedish_navy_expansion: "Расширение ВМС Швеции" #NT!
 nd_sca_swedish_navy_expansion_desc: "Расширение шведского королевского военно-морского флота из сил береговой обороны в морской флот, способный проецировать мощь на Балтике и за ее пределами." #NT!
 nd_sca_adelsvalde: "Адельсвальде" #NT!
 nd_sca_adelsvalde_desc: "Эпоха дворянского доминирования в скандинавской политике, когда аристократия контролировала большую часть земли, вооруженных сил и государственного аппарата." #NT!
 nd_sca_timber_exports: "Экспорт древесины" #NT!
 nd_sca_timber_exports_desc: "Обширные леса Скандинавии снабжали Европу древесиной, смолой и военно-морскими запасами, необходимыми материалами для эпохи парусного спорта и строительного бума городов раннего Нового времени." #NT!
 nd_sca_crown_reduction: "Уменьшение короны" #NT!
 nd_sca_crown_reduction_desc: "Сокращение Карла XI, систематическое возвращение корональных земель, отчужденных дворянству, восстановили королевские финансы и сломили власть великих магнатов." #NT!
 nd_sca_carolean_tradition: "Карольская традиция" #NT!
 nd_sca_carolean_tradition_desc: "Военная система Каролины сочетала в себе систему распределения с агрессивной ударной тактикой, создавая пехоту, которая могла побеждать армии, во много раз превосходящие ее по размеру." #NT!
 nd_sca_indelningsverket: "Индельнингсверкет" #NT!
 nd_sca_indelningsverket_desc: "Шведская система распределения распределяла каждого солдата по определенному сельскохозяйственному району, гарантируя, что обученную армию можно будет дешево содержать в мирное время и быстро мобилизовать для войны." #NT!
 nd_sca_linjeskip_fleet: "Линейный флот кораблей" #NT!
 nd_sca_linjeskip_fleet_desc: "Строительство специализированных линейных кораблей дало скандинавскому флоту огневую мощь, позволяющую противостоять великим морским державам в открытом бою." #NT!
 nd_sca_scandinavian_absolutism: "Скандинавский абсолютизм" #NT!
 nd_sca_scandinavian_absolutism_desc: "Переход к абсолютной монархии в Дании, Норвегии и Швеции централизовал государственную власть, что позволило реализовать амбициозные строительные программы и административную реформу." #NT!
 nd_sca_scandinavian_east_india: "Скандинавские Ост-Индские компании" #NT!
 nd_sca_scandinavian_east_india_desc: "Датская и Шведская Ост-Индские компании открыли прямые торговые пути в Азию, импортируя чай, фарфор и шелк, а также основали колониальные форпосты от Транкебара до Кантона." #NT!
 nd_sca_nordic_enlightenment: "Северное Просвещение" #NT!
 nd_sca_nordic_enlightenment_desc: "Эпоха Просвещения в Скандинавии способствовала научным исследованиям, университетской реформе и росту грамотности, опираясь на сильные традиции образования в регионе." #NT!
 nd_sca_freedom_of_the_press: "Свобода печати" #NT!
 nd_sca_freedom_of_the_press_desc: "Шведский закон о свободе печати 1766 года, первый в мире, установил принцип, согласно которому граждане имеют право публиковать и читать без государственной цензуры." #NT!
 nd_sca_scandinavism: "Скандинавизм" #NT!
 nd_sca_scandinavism_desc: "Движение скандинавизма девятнадцатого века способствовало культурному и политическому единству среди народов Северной Европы, прославляя общую историю, язык и идентичность." #NT!
 nd_sca_industrial_modernization: "Промышленная модернизация" #NT!
 nd_sca_industrial_modernization_desc: "Преобразование Скандинавии из аграрного общества в индустриальное, вызванное горнодобывающей промышленностью, лесным хозяйством и механизацией традиционных отраслей промышленности." #NT!
 nd_sca_scandinavian_neutrality: "Скандинавский нейтралитет" #NT!
 nd_sca_scandinavian_neutrality_desc: "Скандинавская традиция вооруженного нейтралитета, поддержание сильной обороны, избегая при этом вовлечения в конфликты великих держав, сохранила независимость во время потрясений наполеоновской эпохи." #NT!
 n_nd_sca_langskip: "Лангскип" #NT!
 n_nd_sca_langskip_desc: "Быстрые военные корабли с мелкой осадкой произошли от конструкции драккаров викингов, построенных для набегов и прибрежного патрулирования в узких водах Севера." #NT!
 n_nd_sca_langskip_levy: "Лангскип Экипаж" #NT!
 n_nd_sca_langskip_levy_desc: "Набранные экипажи драккаров из прибрежных общин с многовековыми традициями мореплавания." #NT!
 a_nd_sca_hakkapeliitta: "Хаккапелитта" #NT!
 a_nd_sca_hakkapeliitta_desc: "Финская легкая кавалерия, известная своими бесстрашными атаками и устрашающим боевым кличем «Хаккаа паалле!», ударные солдаты, превосходные в лесистой местности." #NT!
 n_nd_sca_orlogsskib: "Орлогскиб" #NT!
 n_nd_sca_orlogsskib_desc: "Быстрый скандинавский военный корабль, предназначенный как для патрулирования на Балтике, так и для боя в открытом море, сочетающий в себе огневую мощь и скорость, необходимую для доминирования в узких проливах." #NT!
 a_nd_sca_carolean: "Кэролин" #NT!
 a_nd_sca_carolean_desc: "Элитная шведская пехота, обученная доктрине га-па, дисциплинированно продвигалась вперед под огнем, за которым следовала разрушительная штыковая атака с близкого расстояния." #NT!
 a_nd_sca_carolean_levy: "Кэрол Леви" #NT!
 a_nd_sca_carolean_levy_desc: "Солдаты, набранные из фермерских районов по всей Скандинавии, круглый год обучались на королевских землях в соответствии с карольскими военными традициями." #NT!
 n_nd_sca_linjeskip: "Линьескип" #NT!
 n_nd_sca_linjeskip_desc: "Скандинавский линейный корабль, более быстрый, чем его европейские коллеги, предназначенный для мелководья Балтийского моря, где маневренность имеет такое же значение, как и бортовой вес." #NT!
 nd_sca_stave_church: "Деревянная церковь" #NT!
 nd_sca_stave_church_desc: "Деревянные церкви, построенные в скандинавской технике с перемычками и украшенные замысловатой резьбой, сочетающей христианские образы с древними скандинавскими мотивами." #NT!
 nd_sca_bergslagen_forge: "Бергслаген Кузница" #NT!
 nd_sca_bergslagen_forge_desc: "Металлургический завод в традициях Бергслагена, выплавляющий высококачественное осмундское железо из шведской руды в доменных печах, работающих на древесном угле." #NT!
 nd_sca_orlogsvarvet: "Орлогсварвет" #NT!
 nd_sca_orlogsvarvet_desc: "Королевская военно-морская верфь, построенная в скандинавских традициях, с крытыми сухими доками и стапелями для круглогодичного строительства военных кораблей." #NT!
 nd_sca_tingsted: "Тингстед" #NT!
 nd_sca_tingsted_desc: "Официальный зал собраний, продолжающий древнюю традицию Тинга, где собираются местные представители, чтобы обсуждать законы, налогообложение и управление." #NT!
 nd_sca_sildesalteri: "Сельдяной соляной завод" #NT!
 nd_sca_sildesalteri_desc: "Прибрежный завод по засолке и консервированию сельди в сканских традициях, производящий консервированную рыбу на экспорт по всей Северной Европе." #NT!
 nd_sca_koppargruva: "Коппаргрува" #NT!
 nd_sca_koppargruva_desc: "Установка по добыче меди с использованием метода поджога, впервые разработанного в Фалуне, огромные подземные пожары раскалывают рудоносную породу для добычи." #NT!
 nd_sca_ostindisk_kontor: "Ост-Индия Контор" #NT!
 nd_sca_ostindisk_kontor_desc: "Торговый дом по образцу датской и шведской Ост-Индской компаний, занимающийся импортом и перепродажей азиатских товаров класса люкс." #NT!
 nd_sca_stave_church_upkeep: "Обслуживание деревянной церкви" #NT!
 nd_sca_stave_church_upkeep_desc: "Регулярное просмоливание, замена древесины и ткань для украшения алтаря, чтобы сохранить и эксплуатировать деревянную церковь в суровом северном климате." #NT!
 nd_sca_osmund_iron_smelting: "Осмундский чугунолитейный завод" #NT!
 nd_sca_osmund_iron_smelting_desc: "Производство высококачественного осмундского железа и стали с использованием шведской руды и древесного угля в традициях Бергслагена." #NT!
 nd_sca_shipyard_upkeep: "Потребление военно-морских запасов" #NT!
 nd_sca_shipyard_upkeep_desc: "Постоянная потребность верфи в древесине, смоле и военно-морских материалах для строительства и обслуживания флота." #NT!
 nd_sca_assembly_maintenance: "Обслуживание сборки" #NT!
 nd_sca_assembly_maintenance_desc: "Поддержание зала собраний, его территории, а также бумажных протоколов законов и совещаний на регулярных сессиях управления." #NT!
 nd_sca_herring_salting: "Засолка сельди" #NT!
 nd_sca_herring_salting_desc: "Традиционный сканийский метод засолки, засолки и упаковки сельди с инструментами и солью для консервации и торговли на дальние расстояния." #NT!
 nd_sca_fire_setting_extraction: "Пожарная экстракция" #NT!
 nd_sca_fire_setting_extraction_desc: "Древняя горнодобывающая техника разведения под землей огромных костров для раскалывания рудоносных пород, используемая в Фалуне на протяжении веков." #NT!
 nd_sca_east_india_trade: "Ост-Индская торговля" #NT!
 nd_sca_east_india_trade_desc: "Импорт и складирование азиатских предметов роскоши (чай, фарфор и шелк) для распространения на рынках Северной Европы." #NT!
 nd_sca_formed_tt: "образовалась Скандинавия." #NT!
 nd_sca_path_a_tt: "Выбери судьбу #bold Владык Северных морей#!" #NT!
 nd_sca_path_b_tt: "Выберите судьбу #bold Всесущества Севера#!." #NT!
 nd_sca_destiny: "Скандинавская судьба" #NT!
 nd_sca_destiny_desc: "Объединенный Север стоит на перепутье. Обеспечив стабильность, скандинавское королевство теперь может следовать избранной судьбе, будь то господство на морях или совершенствование управления посредством собраний." #NT!
 nd_sca_dest_sound_toll: "Мастерство звука" #NT!
 nd_sca_dest_sound_toll_desc: "Захватить контроль над Любеком и сузить Эресунн. Создав банковские учреждения, направьте богатство каждого судна, проходящего между Северным и Балтийским морями, через скандинавские руки." #NT!
 nd_sca_dest_north_sea: "Доминион над Северным морем" #NT!
 nd_sca_dest_north_sea_desc: "Верните себе старые норвежские территории Шотландии и Оркнейских островов. Когда Эдинбург оказался под знаменем Севера, а золото течет через казну, Северное море снова становится скандинавской магистралью." #NT!
 nd_sca_dest_northern_empire: "Северная Империя" #NT!
 nd_sca_dest_northern_empire_desc: "Достижение от Новгорода до Гренландии: возрождение варяжского пути и освоение заброшенных западных поселений. Постройте колониальное адмиралтейство, чтобы управлять королевством, расположенным по обе стороны океанов." #NT!
 nd_sca_dest_law_of_north: "Закон Севера" #NT!
 nd_sca_dest_law_of_north_desc: "Заложить основы скандинавского управления. С помощью банковских учреждений, финансирующих суды и школы, развивайте процветание королевства и распространяйте правовые традиции Существа в процветающей области." #NT!
 nd_sca_dest_riksdag: "Восходящий риксдаг" #NT!
 nd_sca_dest_riksdag_desc: "Печатный станок приносит нордические идеи управления во все уголки страны. Поднимите скандинавскую экономику на новый уровень и наполните казну для финансирования современного законодательного собрания." #NT!
 nd_sca_dest_beacon: "Маяк Свободы" #NT!
 nd_sca_dest_beacon_desc: "Станьте образцовым государством Просвещения. Достичь высочайшего развития и престижа в Европе, продемонстрировав, что свобода и порядок — не противоположности, а дополняющие друг друга. Постройте риксдагшу, достойную самого передового законодательного органа в мире." #NT!
 nd_sca.5.t: "Скандинавская судьба" #NT!
 nd_sca.5.d: "Скандинавское королевство достигло стабильности, которой Кальмарский союз никогда не знал. Если тот старый союз страдал от кризисов престолонаследия и шведских восстаний, то нынешнее королевство стоит на более прочной почве. Теперь вопрос переходит от выживания к амбициям: кем станет этот объединенный Север?\n\nВыбор, сделанный при нашем основании, определил курс. Теперь, когда стабильность обеспечена, могут начаться первые шаги к этой судьбе." #NT!
 nd_sca.5.a: "Наша судьба разворачивается." #NT!
 nd_sca.6.t: "Мастерство звука" #NT!
 nd_sca.6.d: "Эресунн, узкий проход между Хельсингборгом и Хельсингором, называют Золотыми воротами Севера. Каждое судно, идущее из Северного моря в Балтийское, должно продеть эту иглу, и теперь оба берега принадлежат Скандинавии. Когда сам Любек оказался под нашим контролем, ганзейские купцы, которые когда-то диктовали условия нордическим королям, теперь торгуют с нашего согласия.\n\nЗундовый сбор, когда-то скромный датский сбор, теперь может стать основой скандинавского морского превосходства. Каждая бочка с селедкой, каждый рулон ткани, каждый слиток железа, перемещающийся между востоком и западом, отдают дань уважения Северной Короне." #NT!
 nd_sca.6.a: "Звук наш." #NT!
 nd_sca.7.t: "Доминион над Северным морем" #NT!
 nd_sca.7.d: "Северное море, некогда служившее дорогой набегов викингов, снова превратилось в скандинавское озеро. Эдинбург, резиденция шотландских королей, несет северное знамя, а Оркнейские острова вернулись под власть скандинавов после столетий под шотландской короной. Золото течет через наши рынки, финансируя военные корабли и торговые суда, которые обеспечивают соблюдение наших требований.\n\nБританские и голландские торговцы с тревогой следят за нашим растущим флотом. В адмиралтействе возникают два видения: будем ли мы строить военные корабли, чтобы править силой, или торговые суда, чтобы править ради прибыли?" #NT!
 nd_sca.7.a: "Наши военные корабли будут вызывать уважение." #NT!
 nd_sca.7.b: "Наши купцы будут владеть богатством." #NT!
 nd_sca.8.t: "Северная Империя" #NT!
 nd_sca.8.d: "От Эдинбурга до Новгорода, от Братталида до Балтики — Северная империя простирается по всему известному миру. Варяжский путь, этот древний путь из Скандинавии в Византию, возрождается под единой короной. На западе были восстановлены поселения Гренландии, заброшенные на протяжении веков.\n\nЭто царство, охватывающее океаны и континенты. Примем ли мы на себя роль истинной талассократии, морской империи, управляемой с квартердека, или же мы будем чтить норвежских поселенцев, которые первыми создали цивилизацию изо льдов Гренландии, и построим империю колонистов и поселенцев?" #NT!
 nd_sca.8.a: "Мы правим с волн." #NT!
 nd_sca.8.b: "Мы селимся туда, куда несет нас море." #NT!
 nd_sca.9.t: "Закон Севера" #NT!
 nd_sca.9.d: "Древняя традиция тинга, управления путем собрания и согласия, была обновлена ​​во всем скандинавском королевстве. Если когда-то средневековые правовые кодексы обслуживали отдельные провинции, то теперь единая правовая традиция связывает весь Север. Банковские учреждения финансируют строительство судов и школ во всех уголках королевства.\n\nАллодиальные права, защищающие скандинавских фригольдеров, больше не являются просто обычаем, а кодифицированным законом. Процветание растет по мере того, как гарантированные права собственности и последовательное правосудие привлекают поселения и торговлю. Основы современного скандинавского управления закладываются не путем завоеваний, а путем консенсуса." #NT!
 nd_sca.9.a: "Закон говорит за всех свободных людей." #NT!
 nd_sca.10.t: "Восходящий риксдаг" #NT!
 nd_sca.10.d: "Скандинавский риксдаг, превратившийся из древних ассамблей Тинга в современный совещательный орган, стал самым влиятельным законодательным органом в Северной Европе. Печатный станок доносит свои дебаты до каждого грамотного дома, а развитие королевства достигло высот, вызывающих зависть европейских монархов.\n\nДебаты бушуют в актовом зале. Прогрессивные голоса требуют, чтобы риксдаг стимулировал инновации и модернизацию. Консервативные члены утверждают, что истинная сила организации заключается в балансировании сословий и сохранении гармонии между различными народами королевства." #NT!
 nd_sca.10.a: "Риксдаг должен провести реформу." #NT!
 nd_sca.10.b: "Риксдаг уравновешивает сословия." #NT!
 nd_sca.11.t: "Маяк Свободы" #NT!
 nd_sca.11.d: "Скандинавская модель стала предметом зависти Европы. Философы ссылаются на скандинавское управление как на доказательство того, что свобода и порядок — не противоположности, а дополняющие друг друга. Закон о свободе прессы, первый в мире, был распространен на всю территорию королевства, а идеалы Просвещения находят свое наиболее полное выражение в институтах Севера.\n\nДва видения соревнуются за душу этого северного маяка: должны ли мы формализовать наше управление в письменной конституции, устанавливая права, которые ни один монарх не может отменить? Или нам следует использовать свой моральный авторитет для урегулирования конфликтов в Европе, став мирным арбитром наций?" #NT!
 nd_sca.11.a: "Мы напишем права всех северян." #NT!
 nd_sca.11.b: "Мы будем арбитрами мира наций." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_war_fleet: "Превосходство военного флота" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_war_fleet: "Скандинавское адмиралтейство строит военные корабли, чтобы силой доминировать в Северном море. Военно-морские базы от Бергена до Эдинбурга проецируют мощь через подходы к Атлантике." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_merchant_marine: "Доминион торгового флота" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_merchant_marine: "Скандинавские торговые суда заполняют каждую гавань от Архангельска до Лиссабона. Северные торговцы контролируют потоки товаров через проливы и через открытое море." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_thalassocracy: "Северная Талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_thalassocracy: "Морская империя, управляемая с юта. Скандинавские адмиралы командуют флотами, которые патрулируют территорию от Гренландии до Новгорода, обеспечивая господство Северной Короны на каждом морском пути." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_settler_empire: "Империя поселенцев" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_settler_empire: "Куда море несет скандинавов, там они строят. От Гренландии до далеких колоний, нордические поселенцы создают новые усадьбы в дикой местности, перенося свои законы и обычаи на новые земли." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_riksdag_reform: "Реформы риксдага" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_riksdag_reform: "Риксдаг реализует программу модернизации, реформирования администрации, продвижения инноваций и распространения представительного управления на все уголки страны." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_estate_balance: "Усадьба Гармония" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_estate_balance: "Гений риксдага заключается не в радикальных переменах, а в балансировании интересов дворян, духовенства, бюргеров и крестьян, поддержании гармонии между различными сословиями посредством тщательного обсуждения." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_constitution: "Конституционная Хартия" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_constitution: "Письменная конституция закрепляет права скандинавских граждан. Ни один монарх не может отменить то, что народные представители установили в законе." #NT!
 STATIC_MODIFIER_NAME_nd_sca_dest_arbiter: "Арбитр Наций" #NT!
 STATIC_MODIFIER_DESC_nd_sca_dest_arbiter: "Моральный авторитет Скандинавии, основанный на столетиях представительного управления и религиозной терпимости, делает ее естественным посредником в европейских спорах." #NT!
 nd_sca_kolonikontor: "Колониальное Адмиралтейство" #NT!
 nd_sca_kolonikontor_desc: "Объединенный военно-морской командный и торговый штаб для координации скандинавских колониальных предприятий, созданный по образцу великих адмиралтейств морских держав." #NT!
 nd_sca_admiralty_operations: "Адмиралтейские операции" #NT!
 nd_sca_admiralty_operations_desc: "Постоянный поток военно-морских запасов, административной корреспонденции, ткани для обмундирования и снаряжения, необходимых для координации морской колониальной империи." #NT!
 nd_sca_riksdagshus: "Риксдагшус" #NT!
 nd_sca_riksdagshus_desc: "Большой зал собраний в соответствии с парламентской традицией Северных стран, где собираются представители сословий, чтобы обсуждать законы, налогообложение и управление королевством." #NT!
 nd_sca_riksdag_upkeep: "Администрация Ассамблеи" #NT!
 nd_sca_riksdag_upkeep_desc: "Бюрократический аппарат, необходимый для управления конституционным законодательным органом, клерками, печатными отчетами и сводами законов, а также камнем для содержания самого актового зала." #NT!
 sca_kalmar_riksrad_bureaucracy: "Кальмар Риксрод" #NT!
 sca_kalmar_riksrad_bureaucracy_desc: "Объединенный совет королевства трех нордических королевств, произошедший от собрания магнатов, которого Маргарита I вызвала в Кальмар в июне 1397 года, чтобы короновать Эрика Померанского. В риксродах каждого королевства находились свои епископы, великие светские магнаты и командиры сильнейших замков: Акерсхус и Бергенхус в Норвегии, Стокгольм и Кальмар в Швеции, Роскилле и Копенгаген в Дании. Советы ратифицировали королей, выступали посредниками в спорах о престолонаследии и придерживались принципа, согласно которому королевством должны управлять его собственные сановники в соответствии с его собственными законами, что являлось тормозом королевской централизации, который монархи союза от Маргариты до Кристиана II возмущались и пытались обойти." #NT!
 sca_oresund_toll_bureaucracy: "Звуковые сборы" #NT!
 sca_oresund_toll_bureaucracy_desc: "Эресуннстолден — плата за каждый иностранный киль, проходящий через узкий пролив между Хельсингёром и Хельсингборгом, установленный Эриком Померанским в 1429 году. Из великой крепости Кронборг датские артиллеристы веками обеспечивали соблюдение правил: корабль, который отказывался остановиться, мог быть потоплен в середине Ла-Манша. Преобразованные в 1567 году с платы за каждое судно в адвалорный налог в размере одного-двух процентов от стоимости груза, звуковые сборы в период своего расцвета обеспечивали до двух третей датского государственного дохода и сделали каждую европейскую торговую нацию вынужденным данником северной короны." #NT!
 sca_riksdag_estates_bureaucracy: "Риксдаг сословий" #NT!
 sca_riksdag_estates_bureaucracy_desc: "Риксенс Стендер, шведский парламент четырех сословий, восходит к собранию Энгельбректа Энгельбректссона, созванного в Арбоге в январе 1435 года во время его восстания против Кальмарского союза. В то время как большинство европейских парламентов располагали тремя сословиями, скандинавский орган однозначно включал в себя четвертое (bondeståndet, свободные крестьяне королевства) наряду с дворянами, духовенством и бюргерами. Официально оформленный при Густаве Васе в 1527 году и конституционизированный после 1719 года, риксдаг, состоящий из четырех сословий, дал скандинавским общинам право голоса в законодательстве, которого нет больше нигде в Европе, и обязал монархию управлять страной с согласия всего королевства." #NT!
 sca_lensvesen_bureaucracy: "Лен Система" #NT!
 sca_lensvesen_bureaucracy_desc: "Позднесредневековая система провинциальной администрации, посредством которой скандинавская корона делегировала власть леншереру, владеющему королевскими замками (Акерсхус в Осло, Бергенхус в Бергене, Ольборгхус в северной Ютландии, Стокгольм в Швеции) в обмен на доходы, солдат и клятву верности. Под каждым леншерром стояли ленсмэнды низших королевских чиновников, которые собирали налоги, собирали бонделеви, рассматривали мелкие дела и представляли короля на заседаниях. Система лен объединила королевство при небольших затратах, но создала класс магнатов, чьи замки, люди и доходы могли обернуться против короны в следующем споре о престолонаследии." #NT!
 sca_reduktion_bureaucracy: "сокращение" #NT!
 sca_reduktion_bureaucracy_desc: "Повторяющийся скандинавский акт рекультивации короны, в результате которого отчужденные земли были возвращены тем, кто ими владел. Сокращение Густава Васы, ратифицированное сеймом Вестероса в 1527 году, передало шведской короне церковные владения, которые составляли двадцать один процент земель королевства, принося к середине века почти сорок процентов государственных доходов и гарантируя рост централизованной монархии. Модель повторилась при Великом сокращении Карла XI после 1680 года, на этот раз за счет высшего дворянства. Независимо от того, было ли сокращение направлено против епископов или баронов, оно оставило долгую память о страхе среди тех, чьи поместья зависели от королевского гранта." #NT!
 sca_hanseatic_kontor_bureaucracy: "Ганзейский Контор" #NT!
 sca_hanseatic_kontor_bureaucracy_desc: "Тюскебрюгген в Бергене, последний и самый северный из четырех великих ганзейских конторов, основанный около 1350 года как частный корпоративный анклав немецких купцов, пользующихся собственной казной, судом, законодательством и печатью под суверенитетом Норвегии. Две тысячи «Хансардов» контора владели почти монополией на экспорт вяленой рыбы с Лофотенских промыслов, платя низкую пошлину — примерно 148 килограммов зерна за судно и торгуя по своим собственным законам на норвежской земле. Его пристани обогатили обычаи королевства, но на четыре столетия лишили местных горожан доступа к атлантической торговле: контор не закрывался в пользу норвежских купцов до 1754 года." #NT!
 sca_bremerholm_admiralty_bureaucracy: "Бремерхольмское адмиралтейство" #NT!
 sca_bremerholm_admiralty_bureaucracy_desc: "Специальная военно-морская база, основанная королем Дании Гансом в 1510 году на островке Бремерхольм в гавани Копенгагена, названная в честь купцов и корабелов из Бремена, которые впервые там работали. Кристиан IV расширил его до обширного комплекса эллингов, канатных дорог, мачтовых кранов и помещений для офицеров, а с 1690 года операция распространилась через канал на Нихольм. Сам флот был укомплектован удскревне сёфолками (прибрежными крестьянами, набранными по жребию из морских приходов Дании и Норвегии в соответствии с королевским военно-морским указом), барщиной, вызывавшей недовольство рыбацких деревень, снабжавшей ее, но незаменимой для военно-морского флота, охранявшего Зунд и Балтийское море." #NT!
 AUTO_MODIFIER_NAME_nd_sca_bureaucracy_authority: "Северная канцелярия" #NT!
 AUTO_MODIFIER_DESC_nd_sca_bureaucracy_authority: "Канцелярия объединенной нордической короны превратилась в постоянный институциональный аппарат: регистрирует пошлины и налоговые ведомости от Зунда до Финнмарка, запечатывает феодальные владения в Акерсхусе и Бергенхусе, отправляет предписания в риксрод трех королевств. На этом фундаменте своеобразные государственные институты Скандинавии начинают обретать прочную форму." #NT!
