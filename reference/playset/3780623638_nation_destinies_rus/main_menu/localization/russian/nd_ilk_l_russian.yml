l_russian:
 STATIC_MODIFIER_NAME_nd_scourge_of_the_caliphate: "Бич Халифата" #NT!
 STATIC_MODIFIER_DESC_nd_scourge_of_the_caliphate: "В традициях Хулагу, свергнувшего халифат Аббасидов и утопившего Багдад в крови, Ильханат должен стать инструментом завоевания. Монгольская военная машина, отточенная поколениями степных войн, сметет на своем пути любое сопротивление." #NT!
 STATIC_MODIFIER_NAME_nd_persianate_khanate: "Персидское ханство" #NT!
 STATIC_MODIFIER_DESC_nd_persianate_khanate: "Следуя мудрости Газан-хана и его визиря Рашид ад-Дина, Ильханство принимает сложную персидскую административную традицию. Синтезируя военное мастерство монголов с персидским управлением, терпимостью и ученостью, мы создаем царство, большее, чем любая из традиций по отдельности." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_faith_of_the_ilkhan: "Вера Ильхана" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_faith_of_the_ilkhan: "Публичное обращение Ильхана объединило различные народы королевства под общей верой, придав легитимность монгольскому правлению и открыв новые каналы культурного обмена." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_universal_chronicle: "Универсальная хроника" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_universal_chronicle: "Завершение «Джами ат-Таварих», самой амбициозной работы в мировой истории, когда-либо предпринятой, сделало Ильханат маяком обучения. В наши библиотеки приезжают ученые со всего мира." #NT!
 nd_ilk.1.t: "Ильханство восстановлено" #NT!
 nd_ilk.1.d: "Раздробленные остатки владений Хулагу снова объединены под одним знаменем. От нагорья Армении до Персидского залива, от берегов Тигра до гор Хорасана стоит восстановленное Ильханство: самая западная часть мировой монгольской империи.\n\nНо что это будет за государство? Старые обычаи степи, грохот кавалерии, неустанное наступление, разграбление городов, осмелившихся сопротивляться, все еще течет в наших венах. Однако вокруг нас лежит Персия с ее древней бюрократией, ее учеными и торговцами, ее традициями толерантности и обучения, насчитывающими тысячелетия.\n\nБудем ли мы завоевателями, какими был Хулагу, когда он разрушил Багдад? Или мы будем строителями, как Газан, когда он реформировал королевство и принял его народ?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ilk.1.a: "Мы вихрь из степи." #NT!
 nd_ilk.1.b: "Мы наследники обоих миров." #NT!
 nd_ilk.2.t: "Хан принимает веру" #NT!
 nd_ilk.2.d: "На протяжении десятилетий вопрос религии мучил Ильханство. Ранние ильханы флиртовали с несторианским христианством, буддизмом и шаманизмом, одновременно управляя огромным мусульманским населением, которое считало их языческими захватчиками. Теперь, следуя примеру Махмуда Газана, Ильхан публично принял ислам, но не как акт духовного убеждения, а как мастерский ход политического прагматизма.\n\nОбращение меняет саму природу правления Ильханидов. Ханы больше не являются иностранными повелителями, навязанными мечом, и становятся законными мусульманскими правителями в глазах своих подданных. Мечети ремонтируются, исламский закон находит свое место рядом с Ясой, а улемы вовлекаются в правительственный аппарат.\n\nОднако это не полный отказ от монгольского наследия. Яса по-прежнему управляет военными делами, небо Тенгри по-прежнему наблюдает за степной знатью, а традиция религиозной терпимости, краеугольный камень монгольского правления, жива. Преобразование – это мост, а не барьер." #NT!
 nd_ilk.2.a: "Пусть вера объединит то, что разделил меч." #NT!
 nd_ilk.2.b: "Пути наших предков сослужили нам хорошую службу." #NT!
 nd_ilk.3.t: "Сборник летописей" #NT!
 nd_ilk.3.d: "Рашид ад-Дин Хамадани, блестящий новообращенный еврей, исполняющий обязанности Великого визиря, завершил самую амбициозную историографическую работу, которую когда-либо видел мир. «Джами ат-Таварих», «Сборник хроник», представляет собой не что иное, как универсальную историю человечества, простирающуюся от сотворения Адама до завоеваний Чингисхана и до наших дней.\n\nОпираясь на китайские, монгольские, персидские, арабские, еврейские и франкские источники, привлекая ученых со всего известного мира и иллюстрируя акварелью, сочетающую китайские и персидские художественные традиции, этот шедевр представляет саму суть Ильханата: места, где встречаются цивилизации, объединяйтесь и создайте что-то большее, чем кто-либо в одиночку.\n\nРашид ад-Дин также основал Раби Рашиди, обширный научный квартал в Тебризе, в котором расположены библиотеки, больницы, мастерские по производству рукописей и жилые дома для ученых со всех уголков земли." #NT!
 nd_ilk.3.a: "Знание – это самая истинная форма завоевания." #NT!
 nd_ilk.3.b: "Пусть эта великая работа скажет за нас миру." #NT!
 nd_ilk.4.t: "Купол Солтании" #NT!
 nd_ilk.4.d: "Возвышаясь над иранским плато, как драгоценный камень, вставленный в землю, Купол Солтании является завершенным. Это восьмиугольное сооружение, увенчанное самым большим кирпичным куполом, когда-либо построенным по заказу Олджейту, является свидетельством архитектурных амбиций Ильханата.\n\nЕго двойной купол, чудо инженерной мысли, будет вдохновлять строителей на протяжении веков: эта техника нашла свое применение во Флоренции Брунеллески и великих мечетях эпохи Сефевидов. Интерьер украшен тончайшей плиткой, каллиграфией и расписными фресками, которые только могут создать персидские мастера, сочетая исламскую геометрическую точность с яркими цветами, предпочитаемыми монгольским двором.\n\nСама Солтания, специально построенная как имперская столица на дороге между Тебризом и Исфаханом, представляет собой трансформацию Ильханата из кочевых завоевателей в оседлых правителей, творящих чудеса." #NT!
 nd_ilk.4.a: "Памятник нашему бессмертному наследию." #NT!
 nd_ilk_keshig_tradition: "Кешигская традиция" #NT!
 nd_ilk_keshig_tradition_desc: "Кешиг, личная гвардия хана, представляет собой вершину монгольской военной традиции: воины, отобранные за верность и мастерство, с детства обучались военному искусству." #NT!
 nd_ilk_tamma_system: "Гарнизонная система Тамма" #NT!
 nd_ilk_tamma_system_desc: "Система Тамма размещает на завоеванных территориях постоянные гарнизонные силы, набираемые из избранных хилиархий монгольского набора. Эти гарнизоны охраняют недавно завоеванные земли и распространяют власть монголов в оседлые регионы." #NT!
 nd_ilk_yam_restoration: "Восстановление реле Яма" #NT!
 nd_ilk_yam_restoration_desc: "Почтовая ретрансляционная система Ям, коммуникационная магистраль Монгольской империи, восстановлена ​​и расширена на обширных владениях Ильханата, обеспечивая быструю передачу приказов и разведданных." #NT!
 nd_ilk_ordu_tradition: "Традиция лагеря Орду" #NT!
 nd_ilk_ordu_tradition_desc: "Орду, мобильный военный лагерь монгольского правящего класса, служит одновременно двором и гарнизоном: наследие кочевого происхождения, которое продолжает служить опорой военной организации Ильханидов." #NT!
 nd_ilk_decimal_organization: "Десятичная военная организация" #NT!
 nd_ilk_decimal_organization_desc: "Монгольская десятичная система объединяет все вооруженные силы в подразделения численностью десять, сто, тысяча и десять тысяч (арбан, ягун, минган и тумен), создавая армию непревзойденной координации и дисциплины." #NT!
 nd_ilk_religious_pragmatism: "Религиозный прагматизм" #NT!
 nd_ilk_religious_pragmatism_desc: "Ранние ильханы практиковали замечательную религиозную терпимость, покровительствуя христианам-несторианам, буддистам, мусульманам и шаманам: прагматичная политика, рожденная управлением империей многих конфессий." #NT!
 nd_ilk_chinese_siege_craft: "Китайское осадное ремесло" #NT!
 nd_ilk_chinese_siege_craft_desc: "Армия Хулагу включала тысячу семей китайских катапультистов, метателей нафты и арбалетчиков. Их опыт ведения осадной войны, не имеющий себе равных в средневековом мире, привел к падению стен Багдада и Аламута." #NT!
 nd_ilk_silk_road_revival: "Возрождение Шелкового пути" #NT!
 nd_ilk_silk_road_revival_desc: "Под властью монголов Шелковый путь переживает период возрождения. Pax Mongolica делает континентальную торговлю более безопасной, чем когда-либо в течение столетий, а караван-сараи Ильханидов защищают торговцев от Тебриза до Катая." #NT!
 nd_ilk_steppe_horse_husbandry: "Степное коневодство" #NT!
 nd_ilk_steppe_horse_husbandry_desc: "Монгольская традиция содержания огромных табунов лошадей, когда каждый воин держит от трех до пяти скакунов, гарантирует, что кавалерия Ильханата остается лучшей в регионе." #NT!
 nd_ilk_court_patronage: "Судебный покровительство искусству" #NT!
 nd_ilk_court_patronage_desc: "Двор Ильханидов становится ярким центром художественного производства, смешивая монгольские, персидские, китайские и византийские художественные традиции в особую новую эстетику." #NT!
 nd_ilk_multicultural_diwan: "Мультикультурный Диван" #NT!
 nd_ilk_multicultural_diwan_desc: "В администрации Ильханидов работают талантливые люди независимо от происхождения: в диване служат персидские бюрократы, уйгурские писцы, еврейские финансисты и врачи-несториане." #NT!
 nd_ilk_maragheh_observatory: "Обсерватория Мараге" #NT!
 nd_ilk_maragheh_observatory_desc: "Обсерватория в Мараге, основанная при Хулагу астрономом Насир ад-Дином ат-Туси, становится самым передовым астрономическим учреждением в мире, производящим знаменитые звездные таблицы Зидж-и Ильхани." #NT!
 nd_ilk_qurchi_guard: "Курчи Гвардия" #NT!
 nd_ilk_qurchi_guard_desc: "Курчи, внутренняя гвардия Ильхана, превратились из более ранней традиции Кешиг в элитные силы монголо-персидской тяжелой кавалерии, сочетающие в себе ударную тактику степи с доспехами и дисциплиной персидских рыцарских традиций." #NT!
 nd_ilk_tabriz_silk_trade: "Тебриз Шелк Трейд" #NT!
 nd_ilk_tabriz_silk_trade_desc: "Большой базар Тебриза, который Марко Поло назвал одним из самых богатых в мире, обрабатывает и торгует шелком со всей Азии, что делает Ильханство главным посредником в евразийской торговле предметами роскоши." #NT!
 nd_ilk_ghazans_conversion: "Обращение Газана" #NT!
 nd_ilk_ghazans_conversion_desc: "Обращение Махмуда Газана в ислам в 1295 году превращает Ильханство из иностранной оккупации в законное исламское государство, разрешая десятилетия напряженности между монгольскими правителями и их мусульманскими подданными." #NT!
 nd_ilk_jami_al_tawarikh: "Джами ат-Таварих" #NT!
 nd_ilk_jami_al_tawarikh_desc: "«Сборник хроник» Рашид ад-Дина — это первая подлинная всемирная история: монументальный труд, основанный на китайских, монгольских, персидских, арабских и франкских источниках, иллюстрированный в стиле, сочетающем восточные и западные традиции." #NT!
 nd_ilk_rashidi_endowment: "Фонд Рашиди" #NT!
 nd_ilk_rashidi_endowment_desc: "Раби-Рашиди, великий научный квартал Рашид ад-Дина в Тебризе, включает в себя библиотеки, больницы и мастерские по изготовлению рукописей: университет до того, как в большинстве стран мира появились университеты." #NT!
 nd_ilk_unified_coinage: "Единая чеканка" #NT!
 nd_ilk_unified_coinage_desc: "Денежная реформа Газан-хана устанавливает стандартизированную чеканку биметаллических монет по всему Ильханату, заменяя хаотичную смесь местных валют и облегчая торговлю на большие расстояния." #NT!
 nd_ilk_persian_military_reform: "Персидская военная реформа" #NT!
 nd_ilk_persian_military_reform_desc: "По мере того как Ильханство обосновывается в персидском сердце, армия превращается из чисто степной силы в дисциплинированную смешанную армию, сочетающую традиции монгольской кавалерии с персидской пехотой и укреплениями." #NT!
 nd_ilk_dome_of_soltaniyeh: "Купол Солтании" #NT!
 nd_ilk_dome_of_soltaniyeh_desc: "Мавзолей Олджейту в Солтании, увенчанный самым большим кирпичным куполом из когда-либо построенных, является архитектурным шедевром Ильханата: памятником, который оказал влияние на строителей от Флоренции до Исфахана." #NT!
 nd_ilk_yasa_codification: "Кодификация Ясы" #NT!
 nd_ilk_yasa_codification_desc: "Древняя Яса Чингисхана кодифицирована и гармонизирована с исламским правом и персидской административной традицией, создавая правовую основу, опирающуюся на все три столпа ильханидской идентичности." #NT!
 nd_ilk_frontier_cavalry: "Традиции пограничной кавалерии" #NT!
 nd_ilk_frontier_cavalry_desc: "Традиция степной кавалерии сохраняется вдоль границ Ильханства, где конные лучники патрулируют границы, как это делали их предки: живая связь с конными воинами Чингисхана." #NT!
 nd_ilk_centralized_taxation: "Централизованное налогообложение" #NT!
 nd_ilk_centralized_taxation_desc: "Основываясь на финансовых реформах Газана, Ильханат развивает централизованную систему налогообложения, которая заменяет произвольные поборы регулярным, предсказуемым сбором доходов." #NT!
 nd_ilk_persianate_bureaucracy: "Персидская бюрократия" #NT!
 nd_ilk_persianate_bureaucracy_desc: "Административный аппарат Ильханства полностью превратился в персидскую бюрократию: монгольское наложение было поглощено, и царством управляет сложная государственная служба." #NT!
 nd_ilk_trade_network_maturation: "Развитие торговой сети" #NT!
 nd_ilk_trade_network_maturation_desc: "Поколения инвестиций в караван-сараи, дороги и рыночную инфраструктуру приносят свои плоды, поскольку торговые сети Ильханата достигают полной зрелости, соединяя Восток и Запад." #NT!
 nd_ilk_gunpowder_adoption: "Принятие пороха" #NT!
 nd_ilk_gunpowder_adoption_desc: "Ильханат, который первым привел китайских осадных инженеров на запад, теперь полностью интегрирует пороховое оружие в свою армию: достойное продолжение его роли моста между цивилизациями." #NT!
 nd_ilk_mounted_fusiliers: "Конные фузилеры" #NT!
 nd_ilk_mounted_fusiliers_desc: "Эволюция ильханидской конницы достигает своего апогея благодаря конным стрелкам, всадникам, вооруженным огнестрельным оружием, которые сочетают в себе мобильность степи с огневой мощью современности." #NT!
 nd_ilk_industrial_synthesis: "Промышленный синтез" #NT!
 nd_ilk_industrial_synthesis_desc: "Давняя традиция Ильханата по синтезу технологий Востока и Запада находит новое выражение по мере того, как индустриальные методы преобразуют производство по всему королевству." #NT!
 nd_ilk_constitutional_reform: "Конституционная реформа" #NT!
 nd_ilk_constitutional_reform_desc: "Древняя напряженность между монгольскими обычаями, исламским правом и персидской администрацией находит разрешение в конституционной реформе: системе управления, основанной на всех трех традициях." #NT!
 nd_ilk_legacy_of_mongol_persia: "Наследие монгольской Персии" #NT!
 nd_ilk_legacy_of_mongol_persia_desc: "Уникальный синтез монгольской, персидской и исламской цивилизаций в Ильханстве признан одним из величайших культурных достижений истории: наследием толерантности, учености и художественного блеска." #NT!
 nd_ilk_national_identity: "Национальная идентичность" #NT!
 nd_ilk_national_identity_desc: "После столетий эволюции Ильханство сформировало отчетливую национальную идентичность, не чисто монгольскую и не чисто персидскую, а нечто новое и прочное." #NT!
 a_nd_ilk_keshig: "Кешиг Страж" #NT!
 a_nd_ilk_keshig_desc: "Кешиг — личная гвардия Хана, элитные воины, доказавшие свою преданность и непревзойденные боевые навыки. Отобранные из лучших семей королевства, они служат как телохранителями, так и офицерами." #NT!
 a_nd_ilk_tamma: "Тамма Гаррисон" #NT!
 a_nd_ilk_tamma_desc: "Гарнизоны Таммы — это постоянные вооруженные силы, дислоцированные на завоеванных территориях. Набранные из избранных хилиархий, эти конные воины владеют недавно завоеванными землями и распространяют власть монголов на населенные регионы." #NT!
 a_nd_ilk_siege_engineers: "Ильханидские осадные инженеры" #NT!
 a_nd_ilk_siege_engineers_desc: "Набранные из тысяч семей китайских катапультистов, которых Хулагу перевез на запад, эти специалисты с разрушительной точностью применяют требушеты, нафту и арбалеты против укрепленных позиций." #NT!
 a_nd_ilk_qurchi: "Курчи Гвардия" #NT!
 a_nd_ilk_qurchi_desc: "Курчи представляют собой эволюцию монгольской гвардейской традиции, тяжелой кавалерии, которая сочетает в себе ударную тактику степи с персидской броней и дисциплиной, образуя элитную ударную силу Ильханата." #NT!
 a_nd_ilk_reformed_infantry: "Реформированная ильханидская пехота" #NT!
 a_nd_ilk_reformed_infantry_desc: "По мере того как Ильханство закрепляется на своих персидских владениях, его пехота превращается из племенных рекрутов в дисциплинированную силу, обученную как монгольской тактической гибкости, так и персидскому осадному искусству." #NT!
 a_nd_ilk_late_horse_archers: "Ильханидские конные лучники" #NT!
 a_nd_ilk_late_horse_archers_desc: "Наследники традиций конных лучников монгольской степи, эти приграничные всадники сохраняют древние навыки владения сложными луками на обширных границах Ильханства." #NT!
 a_nd_ilk_gunpowder_cavalry: "Ильханидские конные стрелки" #NT!
 a_nd_ilk_gunpowder_cavalry_desc: "Последняя эволюция ильханидской конницы: конные стрелки, владеющие огнестрельным оружием верхом на лошадях, сочетающие в себе легендарную мобильность монгольских всадников с убойной силой пороха." #NT!
 nd_ilk_yam_station: "Станция Ям" #NT!
 nd_ilk_yam_station_desc: "Ретрансляционная станция почтовой системы Ям, обеспечивающая свежими лошадьми и припасами гонцов, доставляющих приказы Хана по обширным просторам Ильханата." #NT!
 nd_ilk_caravanserai: "Ильханид Караван-сарай" #NT!
 nd_ilk_caravanserai_desc: "Укрепленная придорожная гостиница, построенная вдоль Шелкового пути, предлагающая кров, воду и безопасность торговцам и их караванам. Эти величественные сооружения, построенные из камня и украшенные плиткой, служат основой трансконтинентальной торговли." #NT!
 nd_ilk_rab_i_rashidi: "Раби Рашиди" #NT!
 nd_ilk_rab_i_rashidi_desc: "Созданный по образцу великого научного квартала Рашид ад-Дина в Тебризе, этот комплекс включает в себя библиотеки, больницы, скриптории и жилье для ученых: центр обучения, где собираются, переводятся и сохраняются знания со всего известного мира." #NT!
 nd_ilk_observatory: "Ильханидская обсерватория" #NT!
 nd_ilk_observatory_desc: "Астрономическая обсерватория в традициях Мараге, оснащенная лучшими инструментами того времени. Здесь астрономы составляют карты неба, составляют звездные таблицы и развивают науку небесной механики." #NT!
 nd_ilk_ordu: "Лагерь Орду" #NT!
 nd_ilk_ordu_desc: "Постоянный военный лагерь в монгольских традициях, служащий одновременно гарнизоном и административным центром. Орду поддерживает боевую готовность приграничных регионов королевства." #NT!
 nd_ilk_mint: "Ильханидский монетный двор" #NT!
 nd_ilk_mint_desc: "Королевский монетный двор, производящий стандартизированные монеты в традициях денежной реформы Газан-хана. Одинаковый вес и чистота монет Ильханидов облегчают торговлю по всему королевству." #NT!
 nd_ilk_silk_processing: "Ильханидская обработка шелка" #NT!
 nd_ilk_silk_processing_desc: "Обработка шелка-сырца персидскими красителями и технологии производства изысканного текстиля для внутреннего использования и экспорта по Шелковому пути." #NT!
 nd_ilk_horse_breeding: "Ильханидское коневодство" #NT!
 nd_ilk_horse_breeding_desc: "Содержание огромных табунов лошадей, которые являются источником жизненной силы монгольской военной мощи, выведенных для выносливости и скорости на иранском нагорье." #NT!
 nd_ilk_gunpowder_manufacture: "Ильханидское пороховое производство" #NT!
 nd_ilk_gunpowder_manufacture_desc: "Объединив китайский опыт в смешивании порохов с ближневосточной металлургией, Ильханат производит огнестрельное оружие и боеприпасы исключительного качества." #NT!
  
 nd_ilk_atelier: "Ильханид Ателье" #NT!
 nd_ilk_atelier_desc: "Придворная мастерская, где мастера-ремесленники создают изысканные персидские миниатюрные картины и иллюминированные рукописи, сочетая монгольские, китайские и персидские художественные традиции в характерном стиле Ильханидов." #NT!
 nd_ilk_bazaar: "Ильханид Базар" #NT!
 nd_ilk_bazaar_desc: "Большой крытый рынок в традициях базаров Тебриза, который Марко Поло назвал самым богатым в мире, где купцы со всей Евразии собираются для торговли шелком, специями и драгоценными товарами." #NT!
 nd_ilk_manuscript_production: "Производство рукописей Ильханидов" #NT!
 nd_ilk_manuscript_production_desc: "Традиция научного копирования и освещения рукописей, создание произведений истории, науки и литературы в многоязычном духе великой мастерской Рашид ад-Дина." #NT!
 nd_ilk_yam_maintenance: "Содержание станции Ям" #NT!
 nd_ilk_yam_maintenance_desc: "Обеспечение монгольской почтово-ретрансляционной станции свежими лошадьми и фуражом." #NT!
 nd_ilk_caravanserai_upkeep: "Содержание караван-сарая" #NT!
 nd_ilk_caravanserai_upkeep_desc: "Содержание укрепленного торгового поста Шелкового пути с каменными стенами и складскими помещениями." #NT!
 nd_ilk_scholarly_upkeep: "Научное содержание" #NT!
 nd_ilk_scholarly_upkeep_desc: "Обеспечение университетско-больничного комплекса бумагой, чернилами и научными материалами." #NT!
 nd_ilk_observatory_upkeep: "Содержание обсерватории" #NT!
 nd_ilk_observatory_upkeep_desc: "Обслуживание астрономических инструментов и обеспечение бумагой для записей в обсерватории." #NT!
 nd_ilk_ordu_upkeep: "Содержание Орду" #NT!
 nd_ilk_ordu_upkeep_desc: "Снабжение монгольского военного лагеря лошадьми, оружием и снаряжением." #NT!
 nd_ilk_mint_upkeep: "Уход за монетным двором" #NT!
 nd_ilk_mint_upkeep_desc: "Управление монетным двором Ильханидов, переработка серебра и меди в стандартизированные монеты." #NT!
 nd_ilk_atelier_upkeep: "Содержание Ателье" #NT!
 nd_ilk_atelier_upkeep_desc: "Снабжение придворной мастерской бумагой и красками для иллюминации рукописей и живописи миниатюр." #NT!
 nd_ilk_bazaar_upkeep: "Содержание базара" #NT!
 nd_ilk_bazaar_upkeep_desc: "Уход за каменными залами и крытыми прилавками большого рынка Ильханидов." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_mongol_traditions: "Монгольские традиции" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_mongol_traditions: "Старые обычаи степи сохраняются: терпимость палатки, мобильность всадника, прагматизм кочевника. Эти традиции хорошо служили нашим предкам и служат нам до сих пор." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_chronicle_diplomacy: "Хроника Дипломатии" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_chronicle_diplomacy: "Универсальный размах Джами ат-Таварих демонстрирует миру культурную изысканность Ильханата, завоевывая уважение и внимание иностранных дворов и ученых." #NT!
 nd_ilk_formed_tt: "Ильханство было образовано" #NT!
 nd_ilk_path_a_tt: "Выбрали Бич Халифата" #NT!
 nd_ilk_path_b_tt: "Выбрал Персидское ханство" #NT!
 nd_ilk_destiny: "Наследие Ильханов" #NT!
 nd_ilk_destiny_desc: "Ильханство восстановлено. Теперь возникает вопрос: какое наследие это царство оставит миру? Стабильность должна быть на первом месте, прежде чем смогут обрести форму какие-либо грандиозные амбиции." #NT!
 nd_ilk_dest_storm: "Монгольская буря" #NT!
 nd_ilk_dest_storm_desc: "Следуя традиции Хулагу, который разграбил Багдад и разрушил халифат Аббасидов, Ильханат обратил свой взор на Левант. Дамаск и Алеппо должны пасть до наступления монголов." #NT!
 nd_ilk_dest_subjugation: "Покорение империй" #NT!
 nd_ilk_dest_subjugation_desc: "Когда Левант обеспечен, амбиции Ильханата растут. Константинополь и Каир (жемчужины-близнецы старого мира) должны подчиниться власти хана. Нужен могучий хозяин." #NT!
 nd_ilk_dest_world_empire: "Мировая Империя Ханов" #NT!
 nd_ilk_dest_world_empire_desc: "Последняя глава монгольской мечты: империя, простирающаяся от Самарканда до Дели, от Персидского залива до священных городов Аравии. Ни одно царство не достигало такого господства со времен Александра." #NT!
 nd_ilk_dest_synthesis: "Персидский синтез" #NT!
 nd_ilk_dest_synthesis_desc: "Вместо завоеваний Ильханство следует путем Газан-хана: развитие королевства, внедрение новых институтов и рост процветания. Земля должна быть обработана, прежде чем она сможет процветать." #NT!
 nd_ilk_dest_golden_age: "Золотой век Тебриза" #NT!
 nd_ilk_dest_golden_age_desc: "Коммерческие и интеллектуальные традиции Ильханата переживают золотой век. Шелк течет через наши рынки, институты укореняются, а казна пополняется богатством торговли между Востоком и Западом." #NT!
 nd_ilk_dest_enlightenment: "Колыбель цивилизаций" #NT!
 nd_ilk_dest_enlightenment_desc: "Ильханат становится тем, чем он всегда должен был быть: местом, где цивилизации встречаются и создают нечто большее. Ормуз контролирует торговлю Персидского залива, Бухара является якорем научных традиций королевства, а сама земля процветает безмерно." #NT!
 nd_ilk.5.t: "Судьба Ильхана" #NT!
 nd_ilk.5.d: "Ильханство стоит твердо, его основы прочны, а его люди довольны. От нагорья Армении до берегов Персидского залива, от Месопотамии до Хорасана — царство стабильно и готово к формированию по воле Ильхана.\n\nПуть, выбранный в момент восстановления, теперь обретает полное значение. Будь то гром кавалерии или устойчивый рост торговли и обучения, Ильханат оставит свой след в мире." #NT!
 nd_ilk.5.a: "Наша судьба ждет." #NT!
 nd_ilk.6.t: "Левантский водопад" #NT!
 nd_ilk.6.d: "Дамаск и Алеппо пали перед войсками Ильхана, завершив завоевание, которое не смог завершить сам Хулагу. Левантийские земли (колыбель древних цивилизаций, перекресток трех континентов) теперь находятся в пределах монгольских владений.\n\nВойска Хулагу достигли этих земель в 1260 году, но были отброшены назад у Айн-Джалута. Теперь, наконец, Ильханство контролирует всю территорию Плодородного полумесяца, от Тигра до Средиземного моря." #NT!
 nd_ilk.6.a: "Незаконченная работа Хулагу завершена." #NT!
 nd_ilk.7.t: "Троны-близнецы" #NT!
 nd_ilk.7.d: "Константинополь и Каир (два величайших города старого света) подчинились власти Ильхана. Римский преемник на Босфоре и египетская власть на Ниле разбиты. Не осталось сил, которые могли бы оспорить господство монголов в западной половине известного мира.\n\nЭто подвиг, который потряс бы даже Чингисхана. Теперь вопрос заключается в том, как закрепить эти обширные завоевания: через страх, который внушают монгольские армии, или через тщательное извлечение богатства из покоренных земель." #NT!
 nd_ilk.7.a: "Пусть они трепещут при нашем приближении." #NT!
 nd_ilk.7.b: "Лишите завоеванные земли их богатств." #NT!
 nd_ilk.8.t: "Доминион без конца" #NT!
 nd_ilk.8.d: "От бирюзовых куполов Самарканда до минаретов Дели, от берегов Персидского залива до священных городов Аравии — Ильханство управляет империей ошеломляющего размаха. Это воплощенная мечта монголов: универсальная империя, охватывающая цивилизации, религии и народы.\n\nТеперь Хан должен решить природу этого владычества. Будет ли это Pax Mongolica: великий мир, навязанный монгольским порядком, где торговля течет свободно, а подданные связаны лояльностью? Или он останется двигателем вечных завоеваний, вечно расширяющимся и вечно голодным?" #NT!
 nd_ilk.8.a: "Навязать мир хану." #NT!
 nd_ilk.8.b: "Завоевание никогда не заканчивается." #NT!
 nd_ilk.9.t: "Синтез пускает корни" #NT!
 nd_ilk.9.d: "Видение Газан-хана приносит свои плоды. Ильханство процветало не за счет грабежей, а за счет обработки: освоения своих земель, развития своих институтов и инвестиций в инфраструктуру великой цивилизации.\n\nСинтез монгольской энергии и персидской утонченности — это уже не мечта, а реальность. Новые институты пускают корни на плодородной почве, развитие распространяется по всему королевству, а казна отражает не военные трофеи, а терпеливое накопление хорошо управляемого государства." #NT!
 nd_ilk.9.a: "Мы строим то, что другие могут только завоевать." #NT!
 nd_ilk.10.t: "Расцвет Тебриза" #NT!
 nd_ilk.10.d: "Ильханство вступает в свой золотой век. Шелк из Китая течет через наши рынки, ученые со всего мира собираются в наших библиотеках, а богатство торговли между Востоком и Западом наполняет нашу казну. Тебриз, который Марко Поло назвал самым богатым городом в мире, оправдывает свою репутацию и даже больше.\n\nЭтот расцвет может принимать две формы: коммерческое возрождение, сосредоточенное на базарах и караван-сараях, которые делают Ильханство перекрестком евразийской торговли, или научное возрождение, основанное на интеллектуальных традициях Мараге, Раби Рашиди и Джами ат-Тавариха." #NT!
 nd_ilk.10.a: "Пусть базары Тебриза поразят мир." #NT!
 nd_ilk.10.b: "Пусть наши учёные осветят тьму." #NT!
 nd_ilk.11.t: "Место встречи цивилизаций" #NT!
 nd_ilk.11.d: "Ильханство достигло того, на что не может рассчитывать ни одно другое царство в истории: настоящего синтеза цивилизаций. Монголы, персы, тюрки, арабы, армяне, грузины — все они вносят свой вклад в культурное целое, которое превосходит любую из его частей.\n\nГормуз контролирует торговые пути Персидского залива, Бухара является якорем восточной научной традиции, а земли между ними изобилуют процветающими городами и возделываемыми провинциями. Ильханство признано во всем мире как маяк обучения, толерантности и процветания.\n\nЭто наследие может быть выражено через универсальные знания (приверженность обучению, преодолевающее все границы) или через космополитическую империю (государство, охватывающее все народы и охватывающее каждый уголок мира)." #NT!
 nd_ilk.11.a: "Знание не знает границ." #NT!
 nd_ilk.11.b: "Все народы находят дом в нашем царстве." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_terror_march: "Террор Марш" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_terror_march: "Монгольская практика сокрушительного сопротивления и захвата гарнизонов обеспечивает быстрое подчинение, хотя экономические затраты на поддержание такого обширного военного присутствия напрягают казну." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_plunder_riches: "Трофеи Империи" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_plunder_riches: "Систематическое извлечение богатства из завоеванных земель финансирует военную машину Ильханата, хотя щедрые расходы двора растут вместе с его доходами." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_pax_mongolica: "Пакс Монголика" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_pax_mongolica: "Великий мир Хана нисходит на покоренный мир. Торговля течет свободно, разведывательные сети связывают империю воедино, а подчиненные народы принимают свое место в монгольском порядке." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_eternal_conquest: "Вечное завоевание" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_eternal_conquest: "Ильханство – это меч, который никогда не спит. Его армии двигаются с ужасающей скоростью, увеличивая потери и перехватывая инициативу прежде, чем враги смогут отреагировать." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_tabriz_renaissance: "Тебриз Ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_tabriz_renaissance: "Коммерческий расцвет Тебриза превращает Ильханство в главную торговую державу Ближнего Востока, хотя комфортное процветание порождает определенную самоуспокоенность." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_scholarly_exchange: "Научный обмен" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_scholarly_exchange: "Традиция Ильханата собирать ученых из разных цивилизаций создает интеллектуальную сеть, которая ускоряет интеграцию различных народов и искусство дипломатии." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_universal_knowledge: "Универсальные знания" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_universal_knowledge: "Ильханство стремится к получению знаний без границ (астрономия, медицина, история, теология), создавая учреждения, обслуживающие все сословия и вероисповедания." #NT!
 STATIC_MODIFIER_NAME_nd_ilk_dest_cosmopolitan_empire: "Космополитическая Империя" #NT!
 STATIC_MODIFIER_DESC_nd_ilk_dest_cosmopolitan_empire: "Ильханство открывается миру, расширяя свои дипломатические возможности и коммерческие горизонты за пределы традиционной монголо-персидской сферы." #NT!
 nd_ilk_war_college: "Ильханидский военный колледж" #NT!
 nd_ilk_war_college_desc: "Военная академия, объединяющая осадное мастерство китайских инженеров, кавалерийскую тактику монгольской степи и дисциплинированные пехотные традиции Персии, обучающая командиров искусству тотальной войны." #NT!
 nd_ilk_war_college_upkeep: "Содержание военного колледжа" #NT!
 nd_ilk_war_college_upkeep_desc: "Содержание военной академии с оружием, лошадьми и учебными материалами для обучения офицеров." #NT!
 nd_ilk_academy: "Ильханидская академия наук" #NT!
 nd_ilk_academy_desc: "Грандиозное учебное заведение в традициях Мараге и Рашиди, где астрономы, врачи, историки и философы со всего известного мира собираются для развития человеческих знаний." #NT!
 nd_ilk_academy_upkeep: "Содержание Академии" #NT!
 nd_ilk_academy_upkeep_desc: "Снабжение учебного центра бумагой, книгами, стеклянными инструментами и медными приборами для научных исследований." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_ilk_bureaucracy_authority: "Диван Ильханов" #NT!
 AUTO_MODIFIER_DESC_nd_ilk_bureaucracy_authority: "Суд в Тебризе превратился в постоянный административный аппарат: сахиб-диван, возглавляющий его бюро финансов, корреспонденции и аудита; яргучи, следящие за соблюдением законов Чингизидов, рядом с кади, насаждающими шариат. На этой двойной монголо-персидской основе своеобразные государственные институты Ильханства начинают обретать прочную форму." #NT!
  
 ilk_yarghu_bureaucracy: "Яргу Корт" #NT!
 ilk_yarghu_bureaucracy_desc: "При царском дворе яргу представлял собой монгольский трибунал обычного права под руководством судей-яргучей: первоначально монгольских князей и нойян, позднее персидских бюрократов. Он применял канун-э расти и ясу, правила Чингисхана, в делах, касающихся монголов и великих амиров. Ильханы риторически приравнивали это к шариату, но на практике суды яргу и кади действовали параллельно, причем юрисдикция определялась истцом, а не правонарушением." #NT!
  
 ilk_sahib_divan_bureaucracy: "Сахиб-Диван Визират" #NT!
 ilk_sahib_divan_bureaucracy_desc: "Персидский главный визирь, руководивший гражданской бюрократией Ильханства из Тебриза, координирующий диван-и истифа (финансы), диван-и инша (канцелярия) и аудит. Офис, который возглавлял Шамс ад-Дин Джувейни, а затем Рашид ад-Дин Хамадани с 1298 по 1318 год, использовал административное наследство Сасанидов и Аббасидов. Канцелярия Рашид ад-Дина производила Джами ат-Таварих и стандартизированные финансовые таблички-ярлиги, которые стали институциональным образцом персидского государственного управления." #NT!
  
 ilk_tax_cadaster_bureaucracy: "Налоговый кадастр Газана" #NT!
 ilk_tax_cadaster_bureaucracy_desc: "Великая финансовая реформа 1295–1304 годов, в ходе которой Газан-хан и Рашид ад-Дин приказали провести земельную перепись, установили стандартные налоговые ставки по округам, отменили худшие поборы кочевых народов и злоупотребления откупом и выпустили бронзовые таблички ярлига с записью обязательств каждого подданного. Реформа обратила вспять катастрофический финансовый коллапс Аргун-Гайхату и восстановила сельскохозяйственную базу Персии. Его реестр стал институциональным шаблоном, унаследованным Джалайиридами, Тимуридами и Сефевидами." #NT!
  
 ilk_mazalim_bureaucracy: "Диван аль-Мазалим" #NT!
 ilk_mazalim_bureaucracy_desc: "Суд по жалобам, реорганизованный Газан-ханом в 1303 году, на котором смешанные монголо-мусульманские дела и сложные апелляции рассматривались два раза в месяц в пятничной мечети. Судья собрал шейхов, кади, сайидов, бетикчи (монгольских секретарей) и улемов для вынесения решений, основанных на шариате, но подлежащих исполнению в отношении монгольских тяжущихся сторон. Мазалимы сделали королевское правосудие видимым на улицах и преодолели разрыв между яргу и шариатом." #NT!
  
 ilk_maragha_observatory_bureaucracy: "Марагинская обсерватория" #NT!
 ilk_maragha_observatory_bureaucracy_desc: "Великая расадхана, основанная в 1259 году при Хулагу и управляемая Насир ад-Дином ат-Туси, включает в себя центральную башню, пять круглых платформ, литейный цех по обработке металлов, общежития и библиотеку, насчитывающую 400 000 томов. Туси, Муайяд ад-Дин аль-Урди, Кутб ад-Дин Ширази и поколение местных астрономов составили Зидж-и Ильхани (1271 г.) и разработали пару Туси, геометрические основы для более поздних обсерваторий в Самарканде, Стамбуле и Джайпуре." #NT!
  
 ilk_keshig_bureaucracy: "Кешиг" #NT!
 ilk_keshig_bureaucracy_desc: "Императорская домашняя стража, унаследованная от Монгольской империи, состояла из дневных и ночных дежурств (туркаут и кебтеул), организованных посменно по тысяче человек. Кешигская служба была одновременно элитной кавалерией, придворным церемониалом и школой подготовки будущих генералов, губернаторов и визирей, обучавшихся оружию и управлению в качестве личных спутников хана. При Ильханах старшие кешиг-амиры стали цареобразующей аристократической организацией, которая решала вопросы преемственности и могла внушать благоговение самому трону." #NT!
