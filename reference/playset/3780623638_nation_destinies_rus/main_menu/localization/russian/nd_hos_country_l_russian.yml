l_russian:
 HOS: "Суверенный Орден Святого Иоанна" #NT!
 HOS_ADJ: "госпитальер" #NT!
 HOS_f: "Суверенный Орден Святого Иоанна" #NT!
 HOS_f_desc: "Восстановить Суверенный Военный Орден Госпитальеров Святого Иоанна Иерусалимского, крестоносное братство, потерявшее Святую Землю, но сохранившееся. Из своей крепости на Родосе (а позже и на Мальте) рыцари Святого Иоанна поддерживают восьмиконечный белый крест как суверенный католический орден: многонациональное братство языков, флот, преследующий корсаров Средиземноморья, и гостеприимную традицию, основавшую первые настоящие больницы христианского мира." #NT!
