 nd_khl_destiny: "Всемирный халиф коронован" #NT!
 nd_khl_destiny_desc: "Первая хутба читается с тысячи минбаров от имени одного халифа. От Аль-Андалуса до Синда мир признает единого суверена верующих. Путь, по которому Халифат пойдет с этого часа, определит каждую последующую эпоху." #NT!
  
 nd_khl_dest_two_seas: "Владение двумя морями" #NT!
 nd_khl_dest_two_seas_desc: "Обеспечьте безопасность Баб-эль-Мандаба и Ормузского пролива. Аден и Ормуз — ворота муссонной торговли; контроль над обоими означает, что флаг Халифата управляет каждым дау от Софалы до Кантона. Казначейство Халифа впервые со времен морских путей Фатимидов опирается на богатства Индийского океана." #NT!
  
 nd_khl_dest_spice_crescent: "Полумесяц специй" #NT!
 nd_khl_dest_spice_crescent_desc: "Удерживайте Каликут и Гоа, малабарские перевалочные пункты, и доставьте торговлю шелком и перцем на халифанские рынки. Полумесяц портов Индийского океана, простирающийся от Адена до Кочина, становится единой торговой системой, а торговля пряностями — инструментом халифской политики." #NT!
  
 nd_khl_dest_two_oceans_caliphate: "Халифат двух океанов" #NT!
 nd_khl_dest_two_oceans_caliphate_desc: "Возьмите Момбасу, Малакку и Ачех. Знамя Халифата теперь развевается по обоим берегам Индийского океана и у входа в Южно-Китайское море. Байт аль-Хикма перестраивается в масштабах империи: глобальное учебное заведение, синтезирующее знания трех цивилизаций." #NT!
  
 nd_khl_dest_two_cities: "Два города франков" #NT!
 nd_khl_dest_two_cities_desc: "Завоевать Рим и Вену. Две великие франкские столицы пали под мечом халифа: престол Святого Петра и ворота Центральной Европы. Христианские империи латинян разбиты в глубине души; джихад против христианского мира больше не является пограничным действием, а является планетарным фактом." #NT!
  
 nd_khl_dest_hammer: "Молот христианского мира и Индии" #NT!
 nd_khl_dest_hammer_desc: "Удерживайте Дели и Виджаянагар. Индуистский султанат Дели восстанавливается под прямым правлением халифа; южная индуистская власть Виджаянагара, в свою очередь, сломлена. Древнее сопротивление субконтинента Дар аль-Исламу заканчивается. Восток и Запад падают от одного молота." #NT!
  
 nd_khl_dest_world_submits: "Мир подчиняется" #NT!
 nd_khl_dest_world_submits_desc: "Возьмите Париж, Венецию и Мадрид. Три столицы франкской державы — Капет, Дож и Габсбург — падают под властью халифских армий. Имперский литейный завод построен в память об этом завоевании: универсальный арсенал, отливающий пушки каждого завоевания от Кордовы до Лахора по одной спецификации." #NT!
  
