 nd_khl_formed_tt: "Вселенский Халифат сформирован." #NT!
 nd_khl_path_a_tt: "Путь: Халиф в Мекке (реставрация Рашидуна)" #NT!
 nd_khl_path_b_tt: "Путь: Халиф в Багдаде (возрождение Аббасидов)" #NT!
 nd_khl_path_c_tt: "Путь: Меч и Султан (пороховой халифат)" #NT!
  
