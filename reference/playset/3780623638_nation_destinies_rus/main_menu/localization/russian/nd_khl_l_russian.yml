  # DESTINY EVENTS: titles, descriptions, options 
  # ============================================================ 
 nd_khl.14.t: "Всемирный халиф коронован" #NT!
 nd_khl.14.d: "Присяга приносится перед миллионом свидетелей. От ступеней Каабы до ворот Топкапы, от Карауина до форта Лахора каждый кади, шейх, сайид, шариф и эмир суннитского мира кладет руку на руку халифа и клянется в послушании. Халиф больше не является одним правителем среди многих; он Амир аль-Муминин на самом деле, а не только по титулу. Начинается новая эпоха." #NT!
 nd_khl.14.a: "Пусть Халифат существует вечно" #NT!
  
 nd_khl.15.t: "Два моря — наши" #NT!
 nd_khl.15.d: "Адмирал халифа в Адене сообщает: Баб аль-Мандаб закрыт для всех флагов, кроме зеленого. Халифский адмирал в Ормузе сообщает: пролив патрулируют хилафанские дау и военные корабли, ни один франкский корабль не проходит без оплаты. Двое ворот муссона наконец открылись; Индийский океан снова стал мусульманским морем." #NT!
 nd_khl.15.a: "Отправляйтесь к Малабару" #NT!
  
 nd_khl.16.t: "Полумесяц специй" #NT!
 nd_khl.16.d: "Каликут и Гоа стоят под знаменем Халифа. Заморин шлет подарки; старые султаны Бахмани платят дань; Португальский Estado da India превратился в несколько прибрежных фортов и воспоминание. Малабарский перец, коромандельский хлопок и бенгальский шелк — все они сейчас поступают на фабрики Халифана. Великий визирь халифа представляет две стратегии новой торговли." #NT!
 nd_khl.16.a: "Совместная торговля с муссонными державами" #NT!
 nd_khl.16.b: "Силовая монополия: только товары Халифата" #NT!
  
 nd_khl.17.t: "Два океана говорят по-арабски" #NT!
 nd_khl.17.d: "Момбаса, Малакка, Ачех. Побережье Суахили, Малаккский пролив, северная оконечность Суматры. Халифат контролирует вход и выход, а также каждый остров между ними. С Аравийского полуострова на острова Пряностей ни один купец не движется иначе, как с халифским пропуском; ни один флот не плавает, кроме зеленого знамени. Мировой океан двуязычен: арабский и тишина. Каким будет великое дело этого часа?" #NT!
 nd_khl.17.a: "Империя универсальной торговли" #NT!
 nd_khl.17.b: "Империя универсального обучения" #NT!
  
 nd_khl.18.t: "Рим и Вена осенью." #NT!
 nd_khl.18.d: "Папа бежит в Авиньон; Император отступает за Альпы. Минареты возвышаются на Семи холмах; призыв к молитве доносится эхом из Стефансдома. Латинский христианский мир, который сопротивлялся Халифату на протяжении девяти столетий, разбит в своих столицах. Армии Халифа маршируют вперед; работа еще не закончена." #NT!
 nd_khl.18.a: "В Париж и Мадрид" #NT!
  
 nd_khl.19.t: "Молот падает на восток и запад" #NT!
 nd_khl.19.d: "Дели взят: Халифат правит троном Аурангзеба напрямую, а не по доверенности Великих Моголов. Виджаянагар разрушен: великая южная индуистская империя превращена в пепел. Индия подчиняется одному халифу. В тот же час падают последние арагонцы и кастильцы, и Средиземноморье окружают халифанские знамена. Начинается следующая кампания. Куда упадет меч?" #NT!
 nd_khl.19.a: "Восточный джихад: Индия должна быть исламской" #NT!
 nd_khl.19.b: "Западное завоевание: Иберия и Италия должны быть исламскими" #NT!
  
 nd_khl.20.t: "Мир подчиняется" #NT!
 nd_khl.20.d: "Париж, Венеция, Мадрид. Капетинги, Дожи, Габсбурги — все три трона пали за одно десятилетие. Средиземное море — это озеро Хилафан; Атлантическое побережье — это граница Халифата; флаг Халифа развевается от Лиссабона до Лахора. Никакая сила на земле не устоит. Великий визирь представляет два меморандума о новом вселенском порядке." #NT!
 nd_khl.20.a: "Халифат совершенствует универсальный меч" #NT!
 nd_khl.20.b: "Халифат совершенствует универсальное государство" #NT!
  
