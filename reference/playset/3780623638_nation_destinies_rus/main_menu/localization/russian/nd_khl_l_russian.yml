 STATIC_MODIFIER_NAME_nd_khl_dest_monsoon_compact: "Договор о муссонах" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_monsoon_compact: "Халифат торгует с муссонными державами как партнёры, а не подданные. Халифанские факторные дома появляются в Каликуте, Кочине, Ачине, Брунее. Индийские и малайские купцы принимаются при дворе халифа; Арабские, персидские и тамильские торговцы имеют общие склады; Индийский океан становится многонациональной зоной свободной торговли Хилафана." #NT!
 STATIC_MODIFIER_NAME_nd_khl_dest_pepper_monopoly: "Монополия на перец" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_pepper_monopoly: "Перец, гвоздика и мускатный орех предназначены для перевала Халифа. Иностранных торговцев без лицензий Халифата арестовывают; торговля пряностями становится строгой королевской монополией. Казначейство пополняется, корсары богатеют, но дипломатический корпус сокращается, поскольку иностранные посольства покидают страну в знак протеста." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_dest_oceanic_civilization: "Океаническая цивилизация" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_oceanic_civilization: "Халифат больше не является континентальной империей с флотом; это отдельная морская цивилизация. Арабоязычные торговые сообщества процветают от Момбасы до Манилы; Хилафанские исследовательские флоты выходят за пределы сезона дождей в открытый Тихий океан; Маршруты специй больше не являются маршрутами, а являются основой государства полушария." #NT!
 STATIC_MODIFIER_NAME_nd_khl_dest_pan_islamic_university: "Сеть панисламских университетов" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_pan_islamic_university: "Байт аль-Хикма больше не одна библиотека, а сеть: университеты-филиалы в Кордове, Каире, Багдаде, Бухаре, Лахоре и Ачехе, все преподают по единой халифанской учебной программе и обмениваются рукописями через халифских курьеров. Христианский и индуистский миры возмущены культурным доминированием, но учёные Халифата живут на разных континентах." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_dest_hindu_jihad: "Индуистский джихад" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_hindu_jihad: "Восточная кампания продолжается. Армии Халифана продвигаются за пределы Дели в Декан, долину Ганга и южные побережья. Крепости индуистских королевств одна за другой падают под натиском единого халифанского осадного обозва; великие храмовые города юга подчиняются или разрушаются." #NT!
 STATIC_MODIFIER_NAME_nd_khl_dest_andalusi_reconquista: "Андалузская Реконкиста" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_andalusi_reconquista: "Рана 1492 года перевернута. Восстанавливается Гранада, затем Толедо, затем изгибается итальянский полуостров. Приказы христианских крестоносцев дают последний ответ, и антагонизм латинского мира достигает своего апогея, но знамена Халифа, несмотря ни на что, продвигаются вперед." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_dest_universal_sword: "Универсальный меч" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_universal_sword: "Еретический христианский мир и языческая Индия открыты для армий халифов. Конница сипахов, корпус янычар, артиллерийский поезд Великих Моголов и отвоеватели Андалусии проводят кампанию на скоординированных театрах военных действий. Ни одна сила на земле не сможет остановить их в открытом бою." #NT!
 STATIC_MODIFIER_NAME_nd_khl_dest_caliphal_imperium: "Халифская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dest_caliphal_imperium: "Завоеванный мир управляется. Форты возвышаются в каждой завоеванной провинции; сеть имперских дорог простирается от Лиссабона до Лахора; Дипломатические миссии Халифа направляются ко всем оставшимся тронам. Халифат – это не просто армия, а государство, первое и единственное универсальное государство в мире." #NT!
  
  # ============================================================ 
  # DESTINY BUILDINGS 
  # ============================================================ 
 nd_khl_bayt_al_hikmah_restored: "Байт аль-Хикма восстановлен" #NT!
 nd_khl_bayt_al_hikmah_restored_desc: "Второй Дом Мудрости: глобальное учреждение перевода, библиотека, обсерватория и университет вместе взятые. Первый Бейт аль-Хикма принадлежал Багдаду; этот мировой. Рукописи поступают из Момбасы и Малакки, а также из Кордовы и Бухары, и все они переводятся на арабский язык постоянным штатом переводчиков." #NT!
 nd_khl_caliphal_foundry: "Императорский литейный завод Халифа" #NT!
 nd_khl_caliphal_foundry_desc: "Универсальный арсенал Халифата. Пушечные заводы Каира, Эдирне, Лахора и Кордовы объединены в единую производственную систему; Стандартизированные бомбарды, минометы, полевые орудия и фитильные ружья отливаются по одной спецификации и поставляются в каждый арсенал халифа." #NT!
  
  # Maintenance PMs for destiny buildings 
 nd_khl_bayt_al_hikmah_restored_scholarship: "Универсальный перевод" #NT!
 nd_khl_bayt_al_hikmah_restored_scholarship_desc: "Бумага, книги в переплете, рукописная ткань и декоративные драгоценности для всемирного Дома Мудрости." #NT!
 nd_khl_caliphal_foundry_maintenance: "Императорское литейное производство" #NT!
 nd_khl_caliphal_foundry_maintenance_desc: "Оружие, огнестрельное оружие, инструменты и железный инвентарь для производства пушек и стрелкового оружия Халифа." #NT!
  
  # ===== BUREAUCRACIES ===== 
 khl_diwan_al_mazalim_bureaucracy: "Диван аль-Мазалим" #NT!
 khl_diwan_al_mazalim_bureaucracy_desc: "Халифский суд по жалобам, основанный халифом Умаром ибн аль-Хаттабом (ум. 644) и систематизированный аль-Маварди в одиннадцатом веке. Халиф или его вазир-мазалим обладают личной юрисдикцией в отношении тех нарушений, до которых не могут дойти суды кади: репрессивных губернаторов, хищнических откупщиков, злоупотребления пожертвованиями вакфа. Восстановленный в универсальном масштабе, он является высшей апелляционной властью над каждым эмиром и кади в умме." #NT!
 khl_bayt_al_mal_bureaucracy: "Байт аль-Мал" #NT!
 khl_bayt_al_mal_bureaucracy_desc: "Общественная казначейство ислама, открытое Абу Бакром в Медине и ставшее общеимперским реестром диванов халифа Умара. Закят, джизья, харадж, фай и ганима объединяются здесь и распределяются в виде солдатских стипендий, пожертвований вакфа и социального обеспечения бедным. Восстановлен как единый финансовый дом, охватывающий всю умму, с кади-духовенством в качестве партнера халифа по доходам посредством выплаты закята." #NT!
 khl_pan_islamic_ulama_bureaucracy: "Панисламский совет улемов" #NT!
 khl_pan_islamic_ulama_bureaucracy_desc: "Объединение четырех ортодоксальных суннитских мазхабов (ханафитского, шафиитского, маликитского и ханбалитского) под совместным патронажем халифа по образцу мамлюкской практики назначения главного кади от каждого мазхаба и расширено до имперских масштабов. Скоординированные фетвы, согласованные процедуры и трансрегиональный корпус подготовки священнослужителей, базирующийся в Аль-Азхаре. Цену ортодоксальной консолидации платят общины зимми, чей старый правовой плюрализм сужается под постоянным давлением суннитов." #NT!
 khl_hajj_caravan_bureaucracy: "Устройство для каравана для хаджа" #NT!
 khl_hajj_caravan_bureaucracy_desc: "Императорская организация всеобщего паломничества. Процессия махмалей, учрежденная султаном Бейбарсом в 1266 году, отправляла халифский паланкин из Каира в Мекку каждый Зу аль-Хиджа; в условиях восстановленного всемирного халифата аппарат координирует параллельные караваны из Дамаска, Константинополя, Кордовы и Дели, и все они сходятся к Хиджазу под вооруженным конвоем. Духовная легитимность, трансрегиональный престиж, дипломатический охват и логистический хребет, протянувшийся через пустыню." #NT!
 khl_bayt_al_hikmah_bureaucracy: "Сеть Байт аль-Хикма" #NT!
 khl_bayt_al_hikmah_bureaucracy_desc: "Вселенское возрождение Дома Мудрости Аббасидов, основанного аль-Мамуном в Багдаде около 830 года. Федерация бюро переводов и обсерваторий объединяет академии Толедо, Кордовы, Каира, Дамаска, Багдада, Исфахана и Самарканда в единый трансрегиональный научный аппарат. Произведения на греческом, санскрите, персидском и латинском языках проходят через скоординированный конвейер перевода. Ортодоксальные юристы, которые вслед за аль-Газали не доверяют фальсафе как рационалистическому вторжению, относятся к сети с подозрением." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_khl_bureaucracy_authority: "Халифская власть" #NT!
 AUTO_MODIFIER_DESC_nd_khl_bureaucracy_authority: "После восстановления всемирного Халифата [KHL.GetName] получает институциональную власть, позволяющую разместить у себя историческую бюрократию имперского Халифата." #NT!
