l_russian:
  # ============================================================ 
  # Formation event 
  # ============================================================ 
 nd_khl.1.t: "Всемирный Халифат восстановлен" #NT!
 nd_khl.1.d: "После тысячелетия династической раздробленности умма снова едина. Мекка, Медина, Каир, Дамаск, Багдад и резиденции старых халифатов Омейядов и Аббасидов подчиняются одному трону. Черное знамя Пророка летит от Аль-Андалуса до Синда; призыв к пятничной молитве в каждой общинной мечети произносится от имени одного халифа. Это не работа какой-либо одной династии, Омейядов, Аббасидов, Фатимидов, Альмохадов, Мамлюков или Османов, а воплощение идеала Рашидун: универсальное сообщество верующих под одним знаменем.\n\nУлемы собираются на совет. Визири ждут у ворот дивана. Мир затаил дыхание. Какой Халифат возродится в результате этого восстановления?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_khl.1.a: "Халиф в Мекке: восстановить идеал Рашидуна" #NT!
 nd_khl.1.b: "Халиф в Багдаде: возродить цивилизацию Аббасидов" #NT!
 nd_khl.1.c: "Меч и султан: воинствующий порох Халифата" #NT!
  
  # ============================================================ 
  # Formation choice modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_mecca: "Халиф в Мекке" #NT!
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_mecca: "Халиф правит из Харамайна, Двух Святынь. Религиозная власть исходит из Мекки и Медины; восстановлена ​​базовая модель Рашидуна. Шариат – это закон, улемы – единственные важные министры, а умма обращается в веру благодаря престижу и примеру, а не мечу." #NT!
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_baghdad: "Халиф в Багдаде" #NT!
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_baghdad: "Халифат возрождает имперскую цивилизацию Аббасидов: космополитический синтез арабского, персидского и тюркского образования. Байт аль-Хикма восстановлен, великое движение переводов возобновляется, а халифатский двор приветствует ученых всех вероисповеданий. Халиф управляет миром из города министерств, библиотек и базаров." #NT!
 STATIC_MODIFIER_NAME_nd_khl_sword_and_sultan: "Меч и султан" #NT!
 STATIC_MODIFIER_DESC_nd_khl_sword_and_sultan: "Халифат – мировая пороховая империя. Пушки, отлитые в Каире, мушкетеры, прошедшие подготовку в Эдирне, солдаты-рабы, воспитанные в Кордове, и весь Кавказ маршируют под одним знаменем. Халиф – воин-имам: джихад против христианского мира, индуистской Индии и инославных сект – это постоянная государственная политика." #NT!
  
  # ============================================================ 
  # DHE event modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_khl_translation_movement: "Переводческое движение" #NT!
 STATIC_MODIFIER_DESC_nd_khl_translation_movement: "Греческие, санскритские, персидские и сирийские тексты систематически переводятся на арабский язык. Наследники Хунайна ибн Исхака работают в новом Байт аль-Хикме, и наука трех цивилизаций переходит на единый язык." #NT!
 STATIC_MODIFIER_NAME_nd_khl_falsafa_revival: "Возрождение Фальсафы" #NT!
 STATIC_MODIFIER_DESC_nd_khl_falsafa_revival: "Ибн Сину, аль-Фараби и Ибн Рушда снова читают в каждом дворе Халифата. Исламская философия вновь занимает свое место между откровением и разумом; синтез, породивший Фому Аквинского, возобновляется на своей родине." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_amir_al_hajj: "Амир аль-Хадж" #NT!
 STATIC_MODIFIER_DESC_nd_khl_amir_al_hajj: "Ежегодный паломнический караван теперь является государственным учреждением, которым командует Амир аль-Хадж, назначенный самим халифом. Приютить паломника — первая обязанность халифа после защиты веры." #NT!
 STATIC_MODIFIER_NAME_nd_khl_zubayda_road: "Дарб Зубайда" #NT!
 STATIC_MODIFIER_DESC_nd_khl_zubayda_road: "Колодцы, цистерны, караван-сараи и промежуточные станции простираются от Куфы до Мекки и названы в честь Зубайды бинт Джафар, внучки халифа аль-Мансура. Дорога паломничества — это также торговая дорога, а торговая дорога — это также дорога государства." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_baghdad_reborn: "Багдад возрождается" #NT!
 STATIC_MODIFIER_DESC_nd_khl_baghdad_reborn: "Ужас 1258 года, когда монголы Хулагу разграбили Багдад и сбросили библиотеки халифов в Тигр, наконец-то обращен вспять. Город Мира восстановлен; перепланирован Круглый город; Тигр снова отражает купола и минареты." #NT!
 STATIC_MODIFIER_NAME_nd_khl_dar_al_islam_unbroken: "Дар аль-Ислам Несломленный" #NT!
 STATIC_MODIFIER_DESC_nd_khl_dar_al_islam_unbroken: "Фрагментация постмонгольского мира исцелена. Каждая суннитская община, от Гранады до Инда, знает, что она находится в рамках единого Дар аль-Ислама, которого защищает один халиф." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_ulama_concord: "Согласие улемов" #NT!
 STATIC_MODIFIER_DESC_nd_khl_ulama_concord: "Четыре суннитских мазхаба: Ханафи, Шафииты, Малики и Ханбали совещаются на совете под патронажем халифа. Различия остаются, но школы признают друг друга и одну высшую власть над всеми ними." #NT!
 STATIC_MODIFIER_NAME_nd_khl_madhhab_synthesis: "Синтез мазхаба" #NT!
 STATIC_MODIFIER_DESC_nd_khl_madhhab_synthesis: "Новое поколение юристов обучалось всем четырем мазхабам, создавая синтетический фикх, подходящий для империи, охватывающей берберских, арабских, персидских, тюркских и индийских мусульман." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_caliphal_guard: "Калифская гвардия Гулама" #NT!
 STATIC_MODIFIER_DESC_nd_khl_caliphal_guard: "Солдаты-рабы, воспитанные с детства в доме халифа, образуют элитную конную гвардию, преданную только трону. Они преданы только халифу, а не какому-либо племени, династии или провинции." #NT!
 STATIC_MODIFIER_NAME_nd_khl_ghulam_governors: "Гуламские губернаторы" #NT!
 STATIC_MODIFIER_DESC_nd_khl_ghulam_governors: "Наиболее способных гуламов назначают командирами и губернаторами провинций. У них нет местных родственников, к которым они могли бы отдать предпочтение, нет никаких местных наследственных притязаний, есть только их клятва халифу, который их вырастил." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_caliphal_artillery: "Калифский артиллерийский парк" #NT!
 STATIC_MODIFIER_DESC_nd_khl_caliphal_artillery: "Огромные осадные бомбардировщики, брошенные в Каире, минометы в Эдирне и полевые орудия из литейных заводов Константинополя двигаются под единым командованием халифа. Ни одна крепость в мире не является недосягаемой." #NT!
 STATIC_MODIFIER_NAME_nd_khl_jihad_of_the_gun: "Джихад с оружием" #NT!
 STATIC_MODIFIER_DESC_nd_khl_jihad_of_the_gun: "Корпуса янычар, мамлюкские аркебузиры и могольские фитильные мушкеты объединены в единую доктрину: пороховой джихад. Враги Халифата сталкиваются с концентрированной огневой мощью, руководствуясь религиозной мотивацией." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_indian_ocean_supremacy: "Господство в Индийском океане" #NT!
 STATIC_MODIFIER_DESC_nd_khl_indian_ocean_supremacy: "От Адена до Каликута, от Момбасы до Малакки знамя Халифа правит муссонной торговлей. Португальское вторжение отброшено; торговля специями снова проходит под защитой Халифата." #NT!
 STATIC_MODIFIER_NAME_nd_khl_mediterranean_thalassocracy: "Средиземноморская талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_khl_mediterranean_thalassocracy: "Флот в Александрии, верфи Золотого Рога и капитаны-корсары Магриба подчиняются некоему Капудан-паше. Средиземное море становится озером Хилафан." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_quranic_press: "Кораническая пресса" #NT!
 STATIC_MODIFIER_DESC_nd_khl_quranic_press: "Арабский набор текста, которому каллиграфы долгое время сопротивлялись, наконец-то освоен. Печатные Кораны, сборники хадисов и религиозные руководства доступны в каждой деревенской мечети." #NT!
 STATIC_MODIFIER_NAME_nd_khl_scientific_press: "Научная пресса" #NT!
 STATIC_MODIFIER_DESC_nd_khl_scientific_press: "Трактаты по астрономии, медицине, математике и праву выходят тысячами из хилафанских типографий. Научные знания распространяются быстрее, чем когда-либо в исламской истории." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_sober_sufism: "Трезвый путь" #NT!
 STATIC_MODIFIER_DESC_nd_khl_sober_sufism: "Ордена Накшбанди и Кадирия завоевывают расположение халифа: их трезвый, научный суфизм скорее укрепляет ортодоксальность, чем бросает ей вызов. Мистическая преданность укрепляет государство." #NT!
 STATIC_MODIFIER_NAME_nd_khl_ecstatic_sufism: "Экстатический путь" #NT!
 STATIC_MODIFIER_DESC_nd_khl_ecstatic_sufism: "Под покровительством халифа процветают ордена Мевлеви, Бекташи и Чишти. Музыка, поэзия и танец становятся инструментами всеобщего исламского обращения, несмотря на культурные различия." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_central_diwan: "Центральный Диван" #NT!
 STATIC_MODIFIER_DESC_nd_khl_central_diwan: "Налоговые регистры от Лиссабона до Лахора едины. Диван халифа ведет единую книгу для всего мира, и из этой книги управляется мир." #NT!
 STATIC_MODIFIER_NAME_nd_khl_provincial_timariots: "Провинциальные тимариоты" #NT!
 STATIC_MODIFIER_DESC_nd_khl_provincial_timariots: "Конница сипахов, держатели икта и мамлюкские землевладельцы объединены единой системой владения: служить халифу на войне, взамен удерживать землю. Провинциальные кавалерийские наборы множатся по всей империи." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_silver_dirham_standard: "Стандарт серебряного дирхама" #NT!
 STATIC_MODIFIER_DESC_nd_khl_silver_dirham_standard: "Один вес серебра, отчеканенный на монетных дворах от Кордовы до Бухары, принимается на каждом рынке Халифата. Валютное манипулирование местными правителями прекращается; Калифский дирхам является мировым стандартом." #NT!
 STATIC_MODIFIER_NAME_nd_khl_caliphal_mints: "Калифские монетные дворы" #NT!
 STATIC_MODIFIER_DESC_nd_khl_caliphal_mints: "Серебро из Гиндукуша, Анатолии и Сахеля поступает на монетные дворы Халифа; золото из Западной Африки и Египта чеканится в халифатский динар. Казна переполнена." #NT!
  
 STATIC_MODIFIER_NAME_nd_khl_modernist_reform: "Халиф Танзимат" #NT!
 STATIC_MODIFIER_DESC_nd_khl_modernist_reform: "Кодифицированное законодательство, призывные армии, наемные чиновники, технические школы, телеграф и железные дороги: Халифат модернизируется сверху, опираясь на европейские модели, не отказываясь от исламской идентичности." #NT!
 STATIC_MODIFIER_NAME_nd_khl_salafi_revival: "Салафитское возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_khl_salafi_revival: "Возвращение к пути салаф ас-Салих, благочестивых предков. Наросты веков сброшены; Появляется более компактная, жесткая и воинственная суннитская ортодоксальность, отвергающая как суфийское инакомыслие, так и европейские реформы." #NT!
  
  # ============================================================ 
  # Advance event titles and descriptions 
  # ============================================================ 
 nd_khl.2.t: "Дом мудрости вновь открывается" #NT!
 nd_khl.2.d: "Спустя два столетия после того, как монголы Хулагу выбросили книги Байт аль-Хикма в Тигр, в отреставрированном квартале Багдада возвышается новый Дом Мудрости. Переводчики греческого, сирийского, персидского и санскрита работают вместе с арабскими философами; Старое видение аль-Мамуна обновляется. Уже вновь циркулируют рукописи Галена, Аристотеля и Арьябхаты, скопированные изящным насхом в десятках медресе от Феса до Самарканда. Халиф стоит рядом с главным переводчиком и спрашивает: какое знание мы должны чтить в первую очередь?" #NT!
 nd_khl.2.a: "Перевести все науки мира" #NT!
 nd_khl.2.b: "Восстановить философскую традицию" #NT!
  
 nd_khl.3.t: "Калифский хадж" #NT!
 nd_khl.3.d: "До сих пор каждый год в Мекку сходились три каравана паломников: один из Дамаска, один из Каира и один из Багдада, каждый под командованием разного правителя, каждый под защитой разных бедуинских племен, плативших разные взятки. Новый указ халифа меняет ситуацию. Отныне всеми караванами паломников командует единственный Амир аль-Хадж, назначаемый халифом и никому не подчиняющийся. Колодцы Дарб Зубайды отремонтированы; форты на сирийской дороге перераспределяются; великий каирский караван реорганизуется. Как халиф будет проектировать это новое учреждение?" #NT!
 nd_khl.3.a: "Превратите караван хаджа в марш государства" #NT!
 nd_khl.3.b: "Превратить дорогу паломничества в торговую дорогу" #NT!
  
 nd_khl.4.t: "Багдад снова восстает" #NT!
 nd_khl.4.d: "На берегу Тигра каменщики закладывают фундамент нового халифского дворца, где когда-то стоял Круглый город аль-Мансур. Следом возводятся новые медресе: перестраивается Мустансирия, затем Низамия. Инженеры восстанавливают ирригационные каналы, разрушенные монголами. Травма 1258 года, когда Тигр почернел от чернил затонувших книг и покраснел от крови последнего аббасидского халифа, наконец-то излечивается обычным мастерством. На чем должны быть сосредоточены усилия Халифата?" #NT!
 nd_khl.4.a: "Восстановите Багдад как величайший город мира" #NT!
 nd_khl.4.b: "Восстановите каждую разрушенную провинцию уммы." #NT!
  
 nd_khl.5.t: "Совет улемов" #NT!
 nd_khl.5.d: "Впервые со времен первых Аббасидов главные юристы четырех суннитских мазхабов заседают вместе на совете. Ханафитский муфтий Константинополя, шафиитский шейх аль-Азхара, маликитский имам Каравийинов и ханбалитский алим Мекки спорят о границах дозволенного, запретного и того, что оставлено на усмотрение. Халиф председательствует, но не голосует. Что выйдет из этого синода?" #NT!
 nd_khl.5.a: "Утверждайте православие через единство" #NT!
 nd_khl.5.b: "Создать новую универсальную судебную практику" #NT!
  
 nd_khl.6.t: "Халиф Гулам" #NT!
 nd_khl.6.d: "Система рабов-солдат, которая когда-то была проклятием поздних Аббасидов, когда гильманы стали создателями королей в Самарре, теперь является самым надежным институтом Халифата. Мальчиков с Кавказа, Судана и Балкан покупают, обращают в веру, обучают, тренируют и привязывают только к халифу. У них нет родственников, к которым они могли бы отдать предпочтение, и нет родины, куда они могли бы бежать. По мере роста корпуса халиф должен решить, какую работу он будет выполнять." #NT!
 nd_khl.6.a: "Используйте гулама в качестве охраны халифа." #NT!
 nd_khl.6.b: "Отправьте лучших в качестве губернаторов провинций" #NT!
  
 nd_khl.7.t: "Пороховой халифат" #NT!
 nd_khl.7.d: "Бомбардировки Мехмеда однажды разрушили стены Константинополя. Мушкетеры Селима разгромили мамлюков у Мардж-Дабика. Артиллеристы Бабура разбили «Лодис» у Панипата. Теперь эти традиции – османская, мамлюкская, могольская – все преклоняют колени перед одним халифом и сливаются в одну доктрину войны. Старшие артиллеристы Топкапы учатся в Алеппо; аркебузиры Великих Моголов тренируются в Каире; литейные заводы Эдирне, Александрии и Лахора отливали пушки по единой спецификации. Как будет применяться новая доктрина?" #NT!
 nd_khl.7.a: "Калифский артиллерийский поезд" #NT!
 nd_khl.7.b: "Джихад с применением мушкетов" #NT!
  
 nd_khl.8.t: "Два океана, одно знамя" #NT!
 nd_khl.8.d: "Флот в Александрии несет зеленое знамя Халифа; то же самое касается верфи в Суэце, эскадры в Адене, патруля в Ормузе, корсарского флота Магриба и линейных кораблей османского Капудан-и Дерья. Впервые со времен Фатимидов Индийский океан и Средиземное море находятся под общим командованием. На вторжение португальцев можно ответить скоординированным ответом. Где Халифат нанесет удар первым?" #NT!
 nd_khl.8.a: "Изгнать франков из Индийского океана" #NT!
 nd_khl.8.b: "Освойте Средиземное море как озеро Хилафан" #NT!
  
 nd_khl.9.t: "Арабский тип" #NT!
 nd_khl.9.d: "После двух столетий сопротивления со стороны гильдий каллиграфов первая печатная машина с арабской вязью получила лицензию в Константинополе, затем в Каире, затем в Багдаде, а затем в Кордове. Техническая проблема рукописного арабского письма, когда буквы меняют форму в зависимости от положения, наконец-то решена халифскими типографами. Книги, которые когда-то стоили годовой заработной платы, теперь стоят недель. Халиф должен решить, что будет поступать из новых станков в первую очередь." #NT!
 nd_khl.9.a: "Распечатайте Коран для каждой деревенской мечети" #NT!
 nd_khl.9.b: "Распечатайте науки для каждого медресе" #NT!
  
 nd_khl.10.t: "Тарикаты объединяются" #NT!
 nd_khl.10.d: "До этого совета каждый суфийский орден — Накшбанди, Кадирийя, Мевлеви, Бекташи, Чишти, Шазили — отвечал перед своей собственной силсилой мастеров и учеников, иногда ортодоксальных, иногда иноверцев, а часто и того, и другого. Теперь главные шейхи великих орденов собираются под покровительством халифа. Халиф предполагает: не существует одного суфийского пути, но есть один Халифат, и каждый порядок должен служить ему. Заказы принимаю. Вопрос в том, какой суфизм будет процветать." #NT!
 nd_khl.10.a: "Покровительствовать трезвым и православным орденам" #NT!
 nd_khl.10.b: "Покровительствуйте восторженным и конвертирующим заказам" #NT!
  
 nd_khl.11.t: "Универсальный Диван" #NT!
 nd_khl.11.d: "Аббасидская икта, мамлюкская икта, сельджукско-османский тимар, могольский джагир — все четыре представляли одну и ту же идею на разных языках: солдат владеет землей у государства и служит государству на войне. Великий визирь Халифана предлагает унифицировать, систематизировать и рационализировать их в единую систему владения, управляемую из единого реестра в Центральном Диване. Реформа сталкивается с сопротивлением со стороны авторитетных держателей. Как это будет реализовано?" #NT!
 nd_khl.11.a: "Централизовать налоговую оценку в Диване" #NT!
 nd_khl.11.b: "Расширение прав и возможностей местных тимариотов в обмен на службу" #NT!
  
 nd_khl.12.t: "Халифанский дирхам" #NT!
 nd_khl.12.d: "Со времен Абд аль-Малика дирхам был серебряной валютой исламского мира, а с того дня каждый местный правитель обесценил его ради собственной выгоды. Халифатская реформа запрещает местную чеканку, фиксирует вес дирхама и содержание серебра указом халифа и чеканит новые монеты на нескольких центральных монетных дворах под непосредственным контролем. Купцы от Гранады до Бенгалии будут доверять этой чеканке. Какова денежно-кредитная политика Халифата?" #NT!
 nd_khl.12.a: "Стандарт чистого серебра, только чеканка халифов." #NT!
 nd_khl.12.b: "Откройте монетные дворы Халифа, увеличьте предложение" #NT!
  
 nd_khl.13.t: "Халиф Танзимат" #NT!
 nd_khl.13.d: "Европейские пароходы пришвартовываются в портах Халафана. Европейские телеграфные линии достигают столиц Халифана. Европейские армии, которые в десять раз меньше армии халифа, побеждают его пограничные войска с помощью строевой подготовки и нарезных мушкетов. Реформа больше не является факультативной. Великий визирь представляет два меморандума: один призывает к кодификации законов, призывной армии, техническим школам, наемным чиновникам и индустриальной экономике; другой призывал к возвращению к образу салафов, отбрасыванию наслоений и воинственному ортодоксальному возрождению. Халиф слышит оба и должен сделать выбор." #NT!
 nd_khl.13.a: "Модернизировать сверху; принять то, что работает" #NT!
 nd_khl.13.b: "Вернуться на путь благочестивых предков" #NT!
  
  # ============================================================ 
  # Advances 
  # ============================================================ 
 nd_khl_mujahid_levy: "Муджахиды-добровольцы" #NT!
 nd_khl_mujahid_levy_desc: "Боец-добровольец, откликнувшийся на призыв халифа защитить Дар аль-Ислам, собранный из всей уммы, независимо от племени или земли." #NT!
 nd_khl_ribat_network: "Сеть Рибат" #NT!
 nd_khl_ribat_network_desc: "Пограничный гарнизон-монастырь, наполовину крепость, наполовину убежище, удерживает границы Халифата. От Аглабидов Туниса до границы с Хорасаном рибаты уммы теперь представляют собой единую оборонительную систему." #NT!
 nd_khl_hajj_logistics: "Хадж Логистика" #NT!
 nd_khl_hajj_logistics_desc: "Ежегодное паломничество в Мекку закреплено как постоянное государственное учреждение. Приказывает Амир аль-Хадж; Калифатская казна гарантирует; колодцы, форты и перевалочные пункты Дарб-Зубайды и сирийской дороги содержатся в порядке указом халифа." #NT!
 nd_khl_grand_jami: "Мечеть Гранд Джами" #NT!
 nd_khl_grand_jami_desc: "Соборная мечеть пятничной молитвы является видимым центром каждого халифанского города. От Мечети Омейядов в Дамаске до Великой Мечети Кордовы, великие Джами Халифата определяют городскую ткань исламского мира." #NT!
 nd_khl_caliphal_diwan: "Халифский Диван" #NT!
 nd_khl_caliphal_diwan_desc: "Бюрократический аппарат Аббасидов, диван ар-расаил, диван аль-джунд, диван аль-харадж восстанавливается как хребт универсального государства. Обученные писцы управляют на стандартизированном арабском языке из одной канцелярии." #NT!
 nd_khl_universal_sharia: "Универсальный шариат" #NT!
 nd_khl_universal_sharia_desc: "Четыре суннитских мазхаба: Ханафитский, Шафиитский, Маликитский и Ханбалитский — признаны единой судебной практикой, применяемой по всей империи. Там, где они различаются, кади применяют местный мазхаб; там, где они согласны, закон универсален." #NT!
  
 nd_khl_bayt_al_hikmah: "Байт аль-Хикма восстановлен" #NT!
 nd_khl_bayt_al_hikmah_desc: "В Багдаде восстанавливается Дом Мудрости Аль-Мамуна, великая академия переводов, которая переводила греческую, санскритскую и персидскую науку на арабский язык. Наследники Хунайна ибн Исхака работают в отреставрированных покоях; рукописи, уничтоженные монголами, скопированы с сохранившихся экземпляров в Кордове, Каире и Бухаре." #NT!
 nd_khl_ghulam_corps: "Корпус Гулама" #NT!
 nd_khl_ghulam_corps_desc: "Конная гвардия из рабов-солдат, усовершенствованная при аль-Мутасиме и с тех пор усовершенствованная каждой исламской династией, представляет собой личную кавалерию халифа. Гуламы подчиняются только трону, а не племени или провинции." #NT!
 nd_khl_caliphal_galley: "Калифская галера" #NT!
 nd_khl_caliphal_galley_desc: "Средиземноморские флоты Кордовы, Туниса, Александрии и Константинополя объединены в единый халифский флот. Традиции судостроения Леванта, Магриби и Андалузии взаимно оплодотворяются." #NT!
 nd_khl_caliphal_dirham: "Халифский дирхам" #NT!
 nd_khl_caliphal_dirham_desc: "Серебряный дирхам Абд аль-Малика 696-й пробы восстановлен в качестве универсальной монеты. Местная чеканка регулируется; веса стандартизированы; Халифанский дирхам становится мировой резервной валютой." #NT!
 nd_khl_universal_madrasah: "Универсальное медресе" #NT!
 nd_khl_universal_madrasah_desc: "Низамия, Мустансирия, аль-Азхар, Каравийин, великие медресе Бухары, Самарканда и Кордовы преподают единую халяфанскую учебную программу. Ученый, получивший образование в Фесе, может преподавать в Лахоре." #NT!
 nd_khl_tariqa_unification: "Тарикаты единые" #NT!
 nd_khl_tariqa_unification_desc: "Суфийские ордена Накшбанди, Кадирия, Мевлеви, Бекташи, Чишти, Шазили находятся под покровительством халифа. Халиф не поддерживает ни одного тариката, но каждый орден признает его Амиром аль-Муминином." #NT!
  
 nd_khl_post_mongol_restoration: "Постмонгольская реставрация" #NT!
 nd_khl_post_mongol_restoration_desc: "Ущерб, нанесенный монгольским веком: разграбление городов, разрушение ирригации, утрата рукописей, истребление населения, систематически возмещаются. Инженеры и бюрократы Халифата разрушают то, что вместе создали Хулагу, Тимур и Черная смерть." #NT!
 nd_khl_gunpowder_caliphate: "Пороховой халифат" #NT!
 nd_khl_gunpowder_caliphate_desc: "Османские бомбарды, мамлюкские аркебузы и фитильные ружья Великих Моголов объединены в единую халифатскую доктрину пороховой войны. Литейные заводы халифа отливали пушки по единой спецификации от Каира до Лахора." #NT!
 nd_khl_universal_iqta: "Универсальная Икта" #NT!
 nd_khl_universal_iqta_desc: "Земельные системы Аббасидов (икта), мамлюков (икта), сельджуков-османов (тимар) и Великих Моголов (джагир) объединены в единое владение: удерживать землю за службу, терять землю за неисполнение службы." #NT!
 nd_khl_two_oceans_fleet: "Флот двух океанов" #NT!
 nd_khl_two_oceans_fleet_desc: "Средиземноморский флот в Константинополе и Александрии и флот Индийского океана в Суэце и Адене находятся под единым командованием Халифа. От Гибралтара до Малакки командует один Капудан-паша." #NT!
 nd_khl_arabic_press: "Арабский печатный станок" #NT!
 nd_khl_arabic_press_desc: "Техническая проблема арабского рукописного набора наконец-то решена. Печатные Кораны, сборники хадисов, юридические руководства и научные трактаты распространяют грамотность с беспрецедентной скоростью." #NT!
 nd_khl_caliphal_corsairs: "Халифские корсары" #NT!
 nd_khl_caliphal_corsairs_desc: "Берберийские корсары, левантийские каперы и налетчики Адени — все плавают под каперскими грамотами Халифа. Враги Халифата не могут переместить торговое судно, не заплатив." #NT!
 nd_khl_sharif_legitimacy: "Легитимность Шарифа" #NT!
 nd_khl_sharif_legitimacy_desc: "Происхождение халифа из семьи Пророка публично подтверждается каждым шарифом в Мекке, Медине и Хадрамауте. Легитимность Халифата связана с родословной самого Пророка." #NT!
  
 nd_khl_caliphal_corps: "Халифский корпус рабов" #NT!
 nd_khl_caliphal_corps_desc: "Янычарская система османов, мамлюков Бахри и Бурджи, персидских гуламов: все они поглощены единым халифским корпусом рабов, насчитывающим десятки тысяч человек. Это первая в мире постоянная профессиональная армия." #NT!
 nd_khl_tofangchi: "Корпус Тофанчи" #NT!
 nd_khl_tofangchi_desc: "Персидско-Могольский мушкетер тофангчи объединен с мамлюкским аркебузиром и османским туфекчи в единую халифскую традицию легкой пехоты: фитильное ружье и дисциплина." #NT!
 nd_khl_oceanic_galleon: "Океанический галеон" #NT!
 nd_khl_oceanic_galleon_desc: "Сочетая оснастку дау в Индийском океане и конструкцию иберийского галеона, Хилафанский океанический галеон перевозит халифскую торговлю и халифское оружие через оба океана." #NT!
 nd_khl_universal_court: "Универсальный суд" #NT!
 nd_khl_universal_court_desc: "Диванный двор Аббасидов в Багдаде, османский протокол Топкапы, дарбар Великих Моголов — все они поглощены единым дворцовым церемониалом Халифана, проецирующим универсальный суверенитет." #NT!
 nd_khl_pan_sunni_authority: "Пансуннитская власть" #NT!
 nd_khl_pan_sunni_authority_desc: "Халиф признан имамом всех четырех суннитских мазхабов одновременно. Его пятничную хутбу читают в каждой общинной мечети от Гранады до Суматры." #NT!
 nd_khl_imperial_integration: "Имперская интеграция" #NT!
 nd_khl_imperial_integration_desc: "Берберские, арабские, египетские, левантийские, анатолийские, персидские, тюркские, индийские и андалусские мусульмане — все считают себя подданными одного Халифата в первую очередь, а затем — членами своих местных общин." #NT!
  
 nd_khl_caliphal_absolutism: "Халифский абсолютизм" #NT!
 nd_khl_caliphal_absolutism_desc: "Халиф больше не является первым среди равных среди местных правителей суннитского мира; он является абсолютным сувереном единого интегрированного государства, простирающегося на три континента." #NT!
 nd_khl_modern_navy: "Современный флот Халифата" #NT!
 nd_khl_modern_navy_desc: "Фрегаты и линейные корабли, верфи, созданные по образцу лучших иберийских и атлантических практик, профессиональные капитаны, набранные из одной халифанской академии: военно-морской флот модернизируется, не теряя при этом своего средиземноморского и муссонного характера." #NT!
 nd_khl_caliphal_bank: "Калифаль Банк" #NT!
 nd_khl_caliphal_bank_desc: "Кредитная сеть Халифана, использующая сакк (чеки), суфтаджа (векселя) и новое институциональное кредитование постреформационного мира связывает Каир, Дамаск, Багдад, Константинополь, Алеппо и Кордову в единую финансовую систему." #NT!
 nd_khl_caliphal_science: "Халифская научная революция" #NT!
 nd_khl_caliphal_science_desc: "Астрономы, математики, врачи и химики Халифата, работающие от Мекки до Кордовы в едином арабском научном сообществе, ведут халифатскую параллель европейской научной революции." #NT!
 nd_khl_universal_legitimacy: "Универсальная легитимность" #NT!
 nd_khl_universal_legitimacy_desc: "Христианские и индуистские государства признают дипломатический приоритет Халифата; правители Испании, Франции, Священной Римской империи и индуистских королевств обращаются к халифу как к равному или вышестоящему. Халифат – высшая мировая держава." #NT!
  
 nd_khl_caliphal_tanzimat: "Халиф Танзимат" #NT!
 nd_khl_caliphal_tanzimat_desc: "Кодифицированное законодательство, призывные армии, наемные чиновники, технические школы, телеграфы, железные дороги: Халифат модернизируется сверху, опираясь на европейские модели, не отказываясь при этом от своего исламского характера." #NT!
 nd_khl_modern_army: "Современная халифская армия" #NT!
 nd_khl_modern_army_desc: "Воинская повинность заменяет ополчение и рабский корпус. Нарезные мушкеты заменяют фитильные ружья. Обученные батальоны заменяют конницу сипахов. Низами Джадид – образцовая армия позднего Халифата." #NT!
 nd_khl_steam_navy: "Паровой флот" #NT!
 nd_khl_steam_navy_desc: "Паровые фрегаты и броненосцы, построенные на верфях Халифана от Константинополя до Бомбея, несут зеленое знамя в эпоху промышленной морской войны." #NT!
 nd_khl_pan_islamic_congress: "Панисламский конгресс" #NT!
 nd_khl_pan_islamic_congress_desc: "Современный дипломатический институт, Конгресс халифов, выступает от имени уммы на «Концерте держав». Там, где европейские империи посылают министров иностранных дел, Халифат посылает единый голос для мирового исламского сообщества." #NT!
 nd_khl_industrial_khilafah: "Промышленный Халифат" #NT!
 nd_khl_industrial_khilafah_desc: "Хлопчатобумажные фабрики в Египте, литейные заводы в Анатолии, верфи в Суэце, механизированные ткацкие станки в Дамаске и сети железных дорог, связывающие Каир, Багдад и Лахор: Халифат проводит индустриализацию на своих собственных условиях." #NT!
  
  # ============================================================ 
  # Custom unit names 
  # ============================================================ 
 a_nd_khl_mujahid_volunteers: "Муджахиды-добровольцы" #NT!
 a_nd_khl_mujahid_volunteers_desc: "Добровольческая пехота со всей уммы, движимая верой и призывом халифа. Высоко мотивирован, но легкобронирован." #NT!
 a_nd_khl_ghulam_cavalry: "Гуламская кавалерия" #NT!
 a_nd_khl_ghulam_cavalry_desc: "Солдат-раб халифа, воспитанный с детства и привязанный к трону в одиночку. Элитная ударная кавалерия в традициях Ярмука." #NT!
 n_nd_khl_caliphal_galley: "Калифская галера" #NT!
 n_nd_khl_caliphal_galley_desc: "Средиземноморская галера, сочетающая традиции судостроения Андалузии, Магриби, Египта и Леванта. Стандартный военный корабль объединенного Хилафанского Средиземноморского флота." #NT!
 n_nd_khl_caliphal_galleon: "Калифальный галеон" #NT!
 n_nd_khl_caliphal_galleon_desc: "Тяжелый океанский военный корабль, сочетающий в себе конструкцию иберийского галеона с такелажем Индийского океана, одинаково подходящий для защиты Средиземноморья и торговли в сезон дождей." #NT!
 a_nd_khl_caliphal_corps: "Халифский корпус рабов" #NT!
 a_nd_khl_caliphal_corps_desc: "Рабская пехота, эквивалентная янычарам: обученная, еще раз обученная, питаемая халифской кухней, оплачиваемая из халифской казны и привязанная только к халифу." #NT!
 a_nd_khl_tofangchi: "Мушкетеры Тофангчи" #NT!
 a_nd_khl_tofangchi_desc: "Легкие мушкетеры-стрелки в персидско-могольской традиции, вооруженные фитильными ружьями и обученные атаковать более крупные формирования." #NT!
 n_nd_khl_oceanic_galleon: "Океанический галеон" #NT!
 n_nd_khl_oceanic_galleon_desc: "Большой бортовой военный корабль Флота Двух океанов, предназначенный для непрерывных военно-морских операций как в Средиземном, так и в Индийском океане." #NT!
 n_nd_khl_caliphal_frigate: "Калифский фрегат" #NT!
 n_nd_khl_caliphal_frigate_desc: "Модернизированный быстроходный военный корабль, сочетающий в себе лучшие иберийские и османские военно-морские традиции, рабочая лошадка халифского флота эпохи абсолютизма." #NT!
 a_nd_khl_nizami_jadid: "Низами Джадид" #NT!
 a_nd_khl_nizami_jadid_desc: "Армия Нового Порядка: призывная пехота, обученная по европейскому образцу, но служащая под флагом Халифата. Нарезной мушкет, современная форма, профессиональный офицерский корпус." #NT!
 n_nd_khl_steam_frigate: "Паровой фрегат «Калифал»" #NT!
 n_nd_khl_steam_frigate_desc: "Современный военный корабль с паровым двигателем, построенный на верфях Суэца, Константинополя и Бомбея, проецирующий военно-морскую мощь Халифана в индустриальную эпоху." #NT!
  
  # ============================================================ 
  # Custom buildings 
  # ============================================================ 
 nd_khl_ribat_garrison: "Рибат" #NT!
 nd_khl_ribat_garrison_desc: "Пограничный гарнизон-монастырь, в котором размещаются бойцы-добровольцы и подвижники на маршах Халифата. Наполовину крепость, наполовину религиозное убежище." #NT!
 nd_khl_hajj_caravanserai: "Хадж Караван-сарай" #NT!
 nd_khl_hajj_caravanserai_desc: "Обнесенный стеной комплекс с конюшнями, цистернами с водой и затененными спальными помещениями вдоль дороги паломников. Поддерживаемый указом халифа, он обслуживает как паломников, так и торговые караваны." #NT!
 nd_khl_grand_jami_mosque: "Мечеть Гранд Джами" #NT!
 nd_khl_grand_jami_mosque_desc: "Великая соборная мечеть пятничной молитвы, видимое сердце каждого халифанского города. Минбар, из которого доставляется хутба халифа." #NT!
 nd_khl_caliphal_diwan_building: "Халифальный Диван" #NT!
 nd_khl_caliphal_diwan_building_desc: "Канцелярия и министерство финансов Халифата с его обученными писцами, запечатанными реестрами и стандартизированными протоколами на арабском языке." #NT!
 nd_khl_bayt_al_hikmah_building: "Байт аль-Хикма" #NT!
 nd_khl_bayt_al_hikmah_building_desc: "Дом Мудрости: великолепная библиотека, академия перевода и обсерватория вместе взятые. Греческие, санскритские, персидские и сирийские рукописи переведены на арабский язык; новая наука рождается в диалоге с переведенной традицией." #NT!
 nd_khl_caliphal_mint: "Калифский монетный двор" #NT!
 nd_khl_caliphal_mint_desc: "Чеканка серебряного дирхама и золотого динара, отчеканенных в соответствии с весовыми требованиями Халифа и принятых на всех рынках Халифата." #NT!
 nd_khl_universal_madrasah_building: "Универсальное медресе" #NT!
 nd_khl_universal_madrasah_building_desc: "Религиозно-академический колледж, преподающий по единой халяфанской программе. Ученый, получивший образование в Фесе, может преподавать в Бухаре; Выпускник аль-Азхара служит в Лахоре." #NT!
 nd_khl_sufi_khanqah: "Суфийская Ханка" #NT!
 nd_khl_sufi_khanqah_desc: "Суфийский домик, в котором находится братство тариката. Братья проводят зикр, принимают путешественников, поддерживают новообращенных и связывают местное сообщество с универсальной халифской суфийской сетью." #NT!
 nd_khl_caliphal_bank_building: "Калифал Банк" #NT!
 nd_khl_caliphal_bank_building_desc: "Крупное кредитное учреждение, предлагающее сакк, суфтаджа и современное институциональное кредитование в рамках общехилафанской финансовой сети." #NT!
  
  # ============================================================ 
  # Building maintenance PMs (avoid auto-generated names) 
  # ============================================================ 
 nd_khl_ribat_maintenance: "Рибатский гарнизон" #NT!
 nd_khl_ribat_maintenance_desc: "Стандартное обслуживание пограничного рибата: оружие, фортификационные камни и переоборудование." #NT!
 nd_khl_caravanserai_maintenance: "Караван-сарай Сервис" #NT!
 nd_khl_caravanserai_maintenance_desc: "Обеспечение общежития паломников: ткань, скот и зерно для путешественников." #NT!
 nd_khl_grand_jami_maintenance: "Обслуживание Гранд Джами" #NT!
 nd_khl_grand_jami_maintenance_desc: "Камень, рукописи и декоративный мрамор для большой соборной мечети." #NT!
 nd_khl_diwan_maintenance: "Диван Операции" #NT!
 nd_khl_diwan_maintenance_desc: "Бумага, ткань для переписки и церемониальные драгоценности для бюрократического аппарата." #NT!
 nd_khl_bayt_al_hikmah_scholarship: "Переводческое движение" #NT!
 nd_khl_bayt_al_hikmah_scholarship_desc: "Бумага, переплетная ткань и рукописи для великой академии перевода." #NT!
 nd_khl_mint_maintenance: "Монетный двор" #NT!
 nd_khl_mint_maintenance_desc: "Серебряные слитки, медный сплав и инструменты для чеканки халифских монет." #NT!
 nd_khl_madrasah_maintenance: "Учебная программа медресе" #NT!
 nd_khl_madrasah_maintenance_desc: "Бумага, учебная ткань и переплетенные учебные тексты для универсального медресе." #NT!
 nd_khl_khanqah_maintenance: "Ханка Гостеприимство" #NT!
 nd_khl_khanqah_maintenance_desc: "Ткань, зерно и шерсть для суфийской ложи и ее путешественников." #NT!
 nd_khl_bank_maintenance: "Банковские операции" #NT!
 nd_khl_bank_maintenance_desc: "Бумага для бухгалтерских книг, серебро и золото для резервов и драгоценные камни для залога." #NT!
  
