l_russian:
 STATIC_MODIFIER_NAME_nd_fin_thousand_lakes: "Земля тысячи озер" #NT!
 STATIC_MODIFIER_DESC_nd_fin_thousand_lakes: "Самобытность Финляндии выкована в ее обширной дикой местности, густых лесах, замерзших озерах и непреклонной местности, которая сформировала народ необычайной стойкости. Финская граница — это щит от любого захватчика, где каждая лесная тропа становится засадой, а каждое замерзшее озеро — барьером." #NT!
 STATIC_MODIFIER_NAME_nd_fin_northern_trade: "Северные торговые пути" #NT!
 STATIC_MODIFIER_DESC_nd_fin_northern_trade: "От смоляных печей Остроботнии до меховых рынков внутренних районов – богатство Финляндии течет через ее леса и водные пути. Финская смола запечатывает корпуса европейских военно-морских сил, финские меха согревают суды континента, а финская древесина строит города на Балтике." #NT!
 STATIC_MODIFIER_NAME_nd_fin_agricola_legacy: "Наследие Агриколы" #NT!
 STATIC_MODIFIER_DESC_nd_fin_agricola_legacy: "Дело Микаэля Агриколы продолжает жить: письменный финский язык, грамотная община и люди, которые могут читать слово Божье на своем родном языке. Эта основа грамотности и обучения будет служить Финляндии на протяжении столетий." #NT!
 STATIC_MODIFIER_NAME_nd_fin_great_wrath_survival: "Выжившие в Великом Гневе" #NT!
 STATIC_MODIFIER_DESC_nd_fin_great_wrath_survival: "Годы российской оккупации испытали Финляндию на пределе своих возможностей: деревни были сожжены, население депортировано, целое поколение получило шрамы. Но финский народ выстоял, и из пепла Великого гнева возникла нация, закаленная страданиями и полная решимости восстановиться." #NT!
 nd_fin.1.t: "Рождение Финляндии" #NT!
 nd_fin.1.d: "Финские земли впервые объединились под одним знаменем. На протяжении веков эти территории на краю известного мира служили границей между Востоком и Западом: земля бескрайних лесов, бесчисленных озер и людей, закаленных самыми суровыми зимами в Европе. Теперь перед нами возникает вопрос: чем станет Финляндия? Примем ли мы характер нашей земли: непроходимую пустыню, замерзшие озера, поглощающие армии, сису, позволяющую нашему народу вынести то, что другие не могут? Или нам стоит посмотреть на торговые пути, которые соединяют нас с внешним миром: смолу, которая нужна каждому военно-морскому флоту, меха, которые желает каждый двор, древесину, из которой строятся корабли наций?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_fin.1.a: "Мы — сама земля. Пусть захватчики ворвутся в наши леса." #NT!
 nd_fin.1.b: "Наше богатство течет по миру через реки и леса." #NT!
 nd_fin.2.t: "Отец финской письменности" #NT!
 nd_fin.2.d: "Микаэль Агрикола, епископ Турку и ученик самого Мартина Лютера, завершил дело своей жизни: перевод Нового Завета на финский язык. Впервые финский язык существует в письменной форме. Его Абкирия научила наш народ грамоте, его Рукускирия давала им молитвы на их родном языке, а теперь Се Вси Завети несет слово Божие в каждую финноязычную общину. Это больше, чем религиозное достижение; это рождение финской грамотности, фундамента, на котором будет строиться все будущее обучение. Агрикола дала финскому народу голос, который может звучать сквозь века." #NT!
 nd_fin.2.a: "Пусть работа Агриколы осветит умы всех финнов." #NT!
 nd_fin.2.b: "Письменный язык формирует идентичность народа." #NT!
 nd_fin.3.t: "После Великого гнева" #NT!
 nd_fin.3.d: "Годы русской оккупации («Исовиха», «Великий гнев») наконец закончились. Потери были катастрофическими: тысячи людей были депортированы на строительство Санкт-Петербурга, деревни по всей Финляндии сожжены, женщины и дети взяты в плен. Только в Остроботнии половина населения погибла или бежала. Но Финляндия выживает. Сгоревшие хутора можно восстановить, леса заново посадить, население медленно восстанавливается. Вопрос в том, как мы встретим это восстановление. Закаляемся ли мы против будущего вторжения, наращивая нашу военную мощь, чтобы такое опустошение никогда больше не повторилось? Или мы сосредоточимся на восстановлении того, что было потеряно, восстановлении стабильности, росте нашего населения и залечивании ран оккупации?" #NT!
 nd_fin.3.a: "Никогда больше. Мы должны быть достаточно сильными, чтобы противостоять любому захватчику." #NT!
 nd_fin.3.b: "Нас больше никогда не будет так легко победить." #NT!
 nd_fin.4.t: "Финское национальное пробуждение" #NT!
 nd_fin.4.d: "Новый дух распространяется по Финляндии. Ученые, поэты и патриоты начали формулировать, что значит быть финном не как подданным великой державы, а как народом со своим языком, своими традициями, своей судьбой. «Калевала», составленная на основе древней устной поэзии, дала финскому народу эпос, способный соперничать с Гомером. Финский язык, который когда-то считался крестьянским языком, находит свой голос в литературе, науке и управлении. Газеты на финском языке распространяли идеи национального самосознания во всех уголках страны. Это пробуждение рождено не революцией, а культурой: тихим убеждением в том, что люди, имеющие общий язык, ландшафт и историю, заслуживают того, чтобы формировать свое собственное будущее." #NT!
 nd_fin.4.a: "Финляндия обретет свой голос." #NT!
 nd_fin_rajakartano: "Раджакартано" #NT!
 nd_fin_rajakartano_desc: "Укрепленные пограничные усадьбы служили военными форпостами и административными центрами вдоль финской границы, а их гарнизоны обеспечивали первую линию защиты от восточных набегов." #NT!
 nd_fin_rajasotilaat: "Пограничные солдаты" #NT!
 nd_fin_rajasotilaat_desc: "Восточная граница породила особую воинскую традицию. Финские пограничники научились сражаться в густых лесах и на замерзшей местности, разрабатывая оборонительную тактику, которая использовала ландшафт против численно превосходящего противника." #NT!
 nd_fin_kaskiviljely: "Каскивилжели" #NT!
 nd_fin_kaskiviljely_desc: "Финская техника подсечно-огневого земледелия превратила густые сосновые и еловые леса в плодородные пахотные земли. Хотя поля просуществовали всего несколько лет, урожайность была необычайной: доход от семян достигал стократного размера." #NT!
 nd_fin_turkiskauppa: "Туркискауппа" #NT!
 nd_fin_turkiskauppa_desc: "Обширные леса Финляндии кишели пушными зверями, а торговля мехом связывала даже самые отдаленные финские поселения с рынками Европы. Финское слово «раха», означающее деньги, первоначально означало «меховая шкура»." #NT!
 nd_fin_frontier_resilience: "Пограничная устойчивость" #NT!
 nd_fin_frontier_resilience_desc: "Жизнь на восточной границе сформировала уникальный финский характер: способность переносить трудности, адаптироваться к невзгодам и упорно сражаться, защищая дом и очаг." #NT!
 nd_fin_savusauna: "Савусауна Традиция" #NT!
 nd_fin_savusauna_desc: "Сауна по-черному – это сердце общественной жизни финнов. Сауна служила не просто купанием, а местом рождения, домом исцеления и священным местом: самой чистой комнатой в любом финском поселении." #NT!
 nd_fin_erametsastajat: "Эрэметсастаят" #NT!
 nd_fin_erametsastajat_desc: "Финские охотники бродили по обширным внутренним лесам, выслеживая дичь и защищаясь от злоумышленников. Их глубокое знание местности делало их неоценимыми в качестве разведчиков и застрельщиков." #NT!
 nd_fin_kirkkotraditio: "Финская церковная традиция" #NT!
 nd_fin_kirkkotraditio_desc: "Финская церковь приобрела свой собственный характер в более широком христианском мире: приходские церкви служили центрами как духовной жизни, так и общественного управления в разбросанных финских поселениях." #NT!
 nd_fin_kauppakonttori: "Традиция Кауппаконттори" #NT!
 nd_fin_kauppakonttori_desc: "Финские торговые фактории соединяли ресурсы внутренних территорий (меха, деготь, лес) с ганзейскими торговыми сетями Прибалтики, доставляя европейские товары и идеи даже в самые отдаленные финские города." #NT!
 nd_fin_linnarakennus: "Традиция строительства замков" #NT!
 nd_fin_linnarakennus_desc: "Великие замки Турку и Хяме закрепляли шведско-финский контроль над регионом, служа административными центрами и военными опорными пунктами, которые распространяли власть на финскую пустыню." #NT!
 nd_fin_tervanpolttaja: "Терванпольтская традиция" #NT!
 nd_fin_tervanpolttaja_desc: "Финские смоляные печи превратили сосновые леса Остроботнии в военно-морские склады, запечатывающие корпуса европейских флотов. К 17 веку Финляндия производила более 80% всего шведского экспорта смолы." #NT!
 nd_fin_tervakauppa: "Тервакауппа" #NT!
 nd_fin_tervakauppa_desc: "Торговля смолой связала финских производителей с крупными центрами судостроения Европы. Только Нидерланды потребляли три четверти финской смолы, и эта торговля принесла беспрецедентное богатство прибрежным городам Оулу и Коккола." #NT!
 nd_fin_agricola: "Работа Микаэля Агриколы" #NT!
 nd_fin_agricola_desc: "Микаэль Агрикола, епископ Турку, создал письменный финский язык и перевел Новый Завет на финский язык в 1548 году, заложив основу финской грамотности и культурной самобытности." #NT!
 nd_fin_olavinlinna: "Олавинлинна Традиция" #NT!
 nd_fin_olavinlinna_desc: "Крепость Олавинлинна, замок Святого Олафа, является самой северной средневековой каменной крепостью в мире, построенной для охраны оспариваемой границы между Швецией, Финляндией и Новгородом." #NT!
 nd_fin_rajapuolustus: "Раджапуолустус" #NT!
 nd_fin_rajapuolustus_desc: "Организованная оборона финской границы превратилась из разрозненных усадебных гарнизонов в систематическую пограничную оборону с дисциплинированными войсками, подготовленными для эксплуатации лесов и водных путей приграничных территорий." #NT!
 nd_fin_talvisoturi: "Талвисотури" #NT!
 nd_fin_talvisoturi_desc: "Суровые финские зимы порождают воинов, непохожих ни на кого в Европе. Зимние солдаты передвигаются на лыжах по глубокому снегу, сражаются в условиях, парализующих обычные армии, и используют сам замерзший ландшафт в качестве оружия." #NT!
 nd_fin_uskonpuhdistus: "Финская Реформация" #NT!
 nd_fin_uskonpuhdistus_desc: "Реформация достигла Финляндии через Микаэля Агриколу и других учеников Лютера. В отличие от многих европейских стран, Реформация в Финляндии была мирной: постепенная трансформация, которая принесла грамотность, образование и религиозное обновление." #NT!
 nd_fin_talonpoikaisarmeija: "Талонпоикаисармейя" #NT!
 nd_fin_talonpoikaisarmeija_desc: "Финские крестьянские воины участвовали во всех конфликтах на восточной границе. Закаленные сельским хозяйством в самых суровых условиях Европы, они проявляют такую ​​​​же упрямую выносливость на поле боя." #NT!
 nd_fin_pohjanmaan_kauppa: "Остроботнская торговая сеть" #NT!
 nd_fin_pohjanmaan_kauppa_desc: "Купцы Остроботнии построили торговую сеть, которая связала финскую смолу, древесину и меха с рынками Европы, сделав прибрежные города Оулу, Коккола и Вааса процветающими торговыми центрами." #NT!
 nd_fin_sahalaitos: "Сахалайтосская традиция" #NT!
 nd_fin_sahalaitos_desc: "Развитие водяных лесопильных заводов изменило лесную промышленность Финляндии. Пиломатериалы можно было бы экспортировать в гораздо больших количествах, чем необработанные бревна, превратив бескрайние финские леса в источник промышленного богатства." #NT!
 nd_fin_merilinnoitus: "Мерилиннойтусская традиция" #NT!
 nd_fin_merilinnoitus_desc: "Великая морская крепость, охраняющая гавань Хельсинки, построенная на цепочке островов у входа в порт, представляет собой вершину береговой обороны Финляндии, сочетая в себе военно-морскую мощь с неприступными укреплениями." #NT!
 nd_fin_isonvihan_toipuminen: "Восстановление после Великого гнева" #NT!
 nd_fin_isonvihan_toipuminen_desc: "Катастрофическая русская оккупация 1714–1721 годов опустошила Финляндию, целые провинции обезлюдели, тысячи людей были депортированы на строительство Санкт-Петербурга. Восстановление заняло десятилетия, но сформировало народ необычайной устойчивости." #NT!
 nd_fin_rajahallinnan_uudistus: "Реформа пограничного управления" #NT!
 nd_fin_rajahallinnan_uudistus_desc: "Модернизация финской пограничной администрации обеспечила эффективное управление даже в самых отдаленных районах, заменив разовую пограничную охрану систематическим управлением провинций." #NT!
 nd_fin_puutavaravienti: "Пуутаваравиенти" #NT!
 nd_fin_puutavaravienti_desc: "Экспорт пиломатериалов из Финляндии резко вырос в 18 веке по мере расширения лесопильной промышленности. Обработанная древесина, военно-морские запасы и гудрон поступали из финских портов на верфи и строительные площадки Европы." #NT!
 nd_fin_jaakarit: "Яакарит" #NT!
 nd_fin_jaakarit_desc: "Финские егеря, специалисты легкой пехоты, обученные тактике самостоятельных боевых действий, опытные стрелки, сражающиеся небольшими отрядами на труднопроходимой местности. Их мастерство ведения лесной войны делает их элитными войсками." #NT!
 nd_fin_kansallisheratys: "Финское национальное пробуждение" #NT!
 nd_fin_kansallisheratys_desc: "Составление «Калевалы» на основе древней устной поэзии, развитие финноязычной литературы и распространение национального сознания через газеты и образование превратили финскую идентичность из регионального диалекта в национальную культуру." #NT!
 nd_fin_ruukki: "Традиции Руукки" #NT!
 nd_fin_ruukki_desc: "Финский металлургический завод ruukit объединил богатые месторождения железной руды страны с обильным лесным углем для производства высококачественного железа. Эти ранние промышленные предприятия заложили основу для финского производства." #NT!
 nd_fin_sisu: "Сису" #NT!
 nd_fin_sisu_desc: "Сису: финская концепция необычайной решимости, мужества и стойкости перед лицом непреодолимых невзгод. Это не просто упрямство, а глубокий национальный характер, выкованный столетиями лишений на границах." #NT!
 a_nd_fin_rajasotilaat: "Раджасотилаат" #NT!
 a_nd_fin_rajasotilaat_desc: "Финские пограничники — отважная пограничная пехота, обученная защищать восточное приграничье посредством засад, укреплений и упорного сопротивления в лесах и болотах." #NT!
 a_nd_fin_erametsastajat: "Эрэметсастаят" #NT!
 a_nd_fin_erametsastajat_desc: "Финские охотники за дикой природой, лесники-разведчики, знающие каждую тропу, озеро и укрытие в бескрайних внутренних лесах. Они двигаются быстро, нападают из укрытия и исчезают за деревьями." #NT!
 a_nd_fin_rajapuolustaja: "Раджапуолустажат" #NT!
 a_nd_fin_rajapuolustaja_desc: "Финские пограничники, организованные войска пограничного гарнизона, сочетающие пикинную дисциплину с защитными инстинктами, воспитанными поколениями приграничных войн." #NT!
 a_nd_fin_talvisoturi: "Талвисотурит" #NT!
 a_nd_fin_talvisoturi_desc: "Элитные финские зимние воины, пехота, приспособленная к бою в самых суровых условиях, использующая снег, лед и мерзлую местность для нейтрализации численного превосходства." #NT!
 a_nd_fin_talonpoikaissoturi: "Талонпоикаиссотурит" #NT!
 a_nd_fin_talonpoikaissoturi_desc: "Финские крестьяне-воины, фермеры, которые берутся за оружие, когда граница находится под угрозой, проявляя в бою ту же непреклонную выносливость, которая поддерживает их в северные зимы." #NT!
 a_nd_fin_jaakari: "Яакарит" #NT!
 a_nd_fin_jaakari_desc: "Финские егеря, элитная легкая пехота, обученная самостоятельной тактике боевых действий. Опытные стрелки, сражающиеся небольшими отрядами, они преуспевают в ведении лесных и нерегулярных боевых действий." #NT!
 nd_fin_fur_trading: "Финская торговля мехом" #NT!
 nd_fin_fur_trading_desc: "Организованная торговля шкурками бобра, лисицы и соболя из обширных лесов Финляндии на рынки Европы." #NT!
 nd_fin_tar_processing: "Переработка финской смолы" #NT!
 nd_fin_tar_processing_desc: "Переработка финской сосновой смолы и древесины в военно-морские запасы, бочки, запечатанные веревками, смолу для конопачения и такелаж для верфей Европы." #NT!
 nd_fin_lumber_export: "Финский экспорт пиломатериалов" #NT!
 nd_fin_lumber_export_desc: "Экспорт обработанной финской древесины и военно-морских запасов на европейские рынки, удовлетворяющий ненасытный спрос на строительные материалы и материалы для судостроения." #NT!
 nd_fin_rajakartano_upkeep: "Содержание пограничного поместья" #NT!
 nd_fin_rajakartano_upkeep_desc: "Содержание укрепленного пограничного усадебного гарнизона, оружейных и оборонительных сооружений, пиломатериалов для ремонта, камня для укреплений, вооружения для гарнизона." #NT!
 nd_fin_savusauna_upkeep: "Уход за сауной" #NT!
 nd_fin_savusauna_upkeep_desc: "Поддержание в рабочем состоянии традиционной сауны по-черному, древесина для топлива и глина для обслуживания печи киуас, на которой нагреваются камни." #NT!
 nd_fin_kauppakonttori_upkeep: "Содержание торгового поста" #NT!
 nd_fin_kauppakonttori_upkeep_desc: "Управление финским торговым постом, управление запасами меха и товаров." #NT!
 nd_fin_tervanpolttaja_upkeep: "Операции по производству смолы" #NT!
 nd_fin_tervanpolttaja_upkeep_desc: "Сжигание сердцевины сосны в земляных печах для производства смолы, самого ценного лесного продукта Финляндии." #NT!
 nd_fin_sahalaitos_upkeep: "Лесопильный завод" #NT!
 nd_fin_sahalaitos_upkeep_desc: "Распиловка финской древесины на доски, мачты и судовые пиломатериалы для экспорта на европейские верфи." #NT!
 nd_fin_merilinnoitus_upkeep: "Содержание морской крепости" #NT!
 nd_fin_merilinnoitus_upkeep_desc: "Поддержание массивных каменных укреплений, артиллерийских огневых точек и гавани прибрежной крепости." #NT!
 nd_fin_ruukki_upkeep: "Металлургический завод" #NT!
 nd_fin_ruukki_upkeep_desc: "Выплавка железа с древесным углем для ковки инструментов, гвоздей и сельскохозяйственного инвентаря на финском металлургическом заводе." #NT!
 STATIC_MODIFIER_NAME_nd_fin_nation_building: "Национальное здание" #NT!
 STATIC_MODIFIER_DESC_nd_fin_nation_building: "Письменность – основа нации. Работа Агриколы создает финскую идентичность, которая выходит за рамки региональных диалектов и племенных границ, формируя народ." #NT!
 STATIC_MODIFIER_NAME_nd_fin_national_resolve: "Национальная решимость" #NT!
 STATIC_MODIFIER_DESC_nd_fin_national_resolve: "Травма Великого гнева укрепила решимость Финляндии. Люди, пережившие оккупацию, депортацию и опустошение, приходят с решимостью, что ни один будущий захватчик не застанет их врасплох." #NT!
 nd_fin_formed_tt: "была образована Финляндия." #NT!
 nd_fin_path_a_tt: "Выбрал страну тысячи озер" #NT!
 nd_fin_path_b_tt: "Выбрали северные торговые пути" #NT!
 nd_fin_destiny: "Финская судьба" #NT!
 nd_fin_destiny_desc: "Финляндия выросла как суверенное государство. Дальнейший путь будет определяться тем выбором, который мы сделаем, создадим ли мы неприступную северную крепость или процветающую балтийскую торговую державу." #NT!
 nd_fin_dest_karelian_march: "Карельский марш" #NT!
 nd_fin_dest_karelian_march_desc: "Захватите древнюю крепость Корела и установите контроль Финляндии над приграничьем Карелии. Создайте армию, достойную защиты восточной границы." #NT!
 nd_fin_dest_shield_of_north: "Щит Севера" #NT!
 nd_fin_dest_shield_of_north_desc: "Продвигайтесь глубже в Карелию, захватывая Олонец и земли Авна. Профессионализируйте армию и превратите завоеванные территории в оборонительный оплот." #NT!
 nd_fin_dest_unconquerable: "Непобедимая Финляндия" #NT!
 nd_fin_dest_unconquerable_desc: "Контролируйте реку Неву и крепость Нарву, закрепляя господство Финляндии над восточными подступами к Балтике. Ни одна армия не пройдет через финские земли без нашего разрешения." #NT!
 nd_fin_dest_ostrobothnian_wealth: "Остроботнское богатство" #NT!
 nd_fin_dest_ostrobothnian_wealth_desc: "Сделать смолу основой финской торговли. Наполните казну за счет экспорта лесных богатств Финляндии на рынки Европы." #NT!
 nd_fin_dest_baltic_tar_kings: "Балтийские смоляные короли" #NT!
 nd_fin_dest_baltic_tar_kings_desc: "Захватите Улеаборг и доминируйте в торговле смолой на севере Балтики. Развивать банковские учреждения для финансирования расширения коммерческих сетей Финляндии." #NT!
 nd_fin_dest_northern_empire: "Северная торговая империя" #NT!
 nd_fin_dest_northern_empire_desc: "Возьмите Таллинн и контролируйте балтийские торговые пути. Охватите глобальную торговлю и превратите Финляндию в торговый центр северных морей." #NT!
 nd_fin.5.t: "Финская судьба" #NT!
 nd_fin.5.d: "Финляндия едина и стабильна: страна лесов, озер и железной решимости. Вопрос о том, кем мы станем, больше не является абстрактным. Наш выбор будет формировать Север на протяжении веков." #NT!
 nd_fin.5.a: "Наша судьба в наших руках." #NT!
 nd_fin.6.t: "Карельский марш" #NT!
 nd_fin.6.d: "Крепость Корела перешла под контроль Финляндии. Эта древняя крепость на протяжении веков охраняла границу между Востоком и Западом, сейчас она охраняет Финляндию. Наши солдаты патрулируют карельские леса, и нам предстоит защищать восточную границу. Марш в Карелию начался." #NT!
 nd_fin.6.a: "Карелия – щит Финляндии." #NT!
 nd_fin.7.t: "Щит Севера" #NT!
 nd_fin.7.d: "Финское оружие продвинулось вглубь Карелии. Земли Аунуса, когда-то недоступные для нас, теперь развеваются под финским знаменем. Наша профессиональная армия патрулирует границу, простирающуюся от ледяного севера до берегов Ладожского озера. Вопрос теперь в том, как мы закрепим эти достижения. Укрепляем каждый перевал и брод, превращая Карелию в неприступную оборонительную полосу? Или мы сосредоточимся на интеграции карельских народов, сделав их финнами как по душе, так и по закону?" #NT!
 nd_fin.7.a: "Укрепляйте каждый подход. Пусть ни одна армия не пройдет." #NT!
 nd_fin.7.b: "Эти карелы – наши родственники. Пусть это будут финны." #NT!
 nd_fin.8.t: "Непобедимая Финляндия" #NT!
 nd_fin.8.d: "Река Нева и Нарвская крепость находятся в руках финнов. Ни одна держава не может приблизиться к Финляндии с востока, не пройдя через территорию, которой мы контролируем, и ни один Балтийский флот не может действовать без согласия Финляндии. Финляндия достигла того, что мало кто считал возможным: северная нация, рожденная в лесах и озерах, теперь представляет собой неприступную державу, которую не может подчинить ни один захватчик. Как нам использовать эту силу? Благодаря совершенству зимней войны, сделавшей наши армии самыми опасными на севере? Или через тихую власть нации, которую невозможно завоевать, проецирующую силу через абсолютную невозможность нашего поражения?" #NT!
 nd_fin.8.a: "Наши зимы будут нашим оружием." #NT!
 nd_fin.8.b: "Пусть мир знает: Финляндию невозможно сломить." #NT!
 nd_fin.9.t: "Остроботнское богатство" #NT!
 nd_fin.9.d: "Финская смола течет через рынки Европы. От печей Остроботнии до верфей Амстердама и Лондона наши лесные богатства стали незаменимыми. Казна пополняется прибылями от этой торговли, и финские купцы все более авторитетно говорят в счетных домах Балтии." #NT!
 nd_fin.9.a: "Наши леса – наше счастье." #NT!
 nd_fin.10.t: "Балтийские смоляные короли" #NT!
 nd_fin.10.d: "Улеаборг наш, а вместе с ним и сердце северной торговли смолой. Финские банкиры финансируют расширение наших коммерческих сетей, и ни один корабль не ходит по Балтике без финской смолы в корпусе. Мы стали смоляными королями севера. Вопрос в том, как укрепить это доминирование. Должны ли мы расширить наш торговый флот, проецируя финскую торговую мощь за моря? Или нам стоит инвестировать в развитие внутренних территорий Финляндии, превращая природные богатства в устойчивое процветание?" #NT!
 nd_fin.10.a: "Стройте корабли. Пусть финский флаг развевается в каждом порту." #NT!
 nd_fin.10.b: "Инвестируйте в нашу землю. Настоящее богатство растет изнутри." #NT!
 nd_fin.11.t: "Северная торговая империя" #NT!
 nd_fin.11.d: "Таллинн попал в руки финнов, а вместе с ним и контроль над балтийскими торговыми путями. Финские купцы доминируют в торговле севера: деготь, древесина, меха и железо текут через наши рынки во все уголки Европы. Из границы на краю цивилизации Финляндия превратилась в торговое сердце северных морей. Будем ли мы использовать эту силу для укрепления дипломатического влияния, сделав Финляндию незаменимым партнером каждой торговой страны? Или нам следует обратиться внутрь себя, используя наше коммерческое богатство, чтобы стать пионерами промышленного развития и модернизации нашей страны?" #NT!
 nd_fin.11.a: "Финляндия станет северным купцом." #NT!
 nd_fin.11.b: "Коммерция финансирует будущее. Инвестируйте в промышленность." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_fortify_frontier: "Укрепленная граница" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_fortify_frontier: "Каждый перевал, брод и лесная тропа в Карелии нанесены на карту, укреплены и снабжены гарнизонами. Восточная граница представляет собой непроницаемую оборонительную зону, хотя упор на военную подготовку привел к привлечению ресурсов из торговли." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_karelian_integration: "Карельская интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_karelian_integration: "Карельские народы приветствуются как братья-финны, имеющие общий язык, общую веру, общую судьбу. Финские администраторы привносят порядок и возможности в новые провинции." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_winter_doctrine: "Доктрина зимней войны" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_winter_doctrine: "Финские армии усовершенствовали искусство зимней войны, быстрое подкрепление через замерзшую местность, неустанную выносливость в условиях, которые ломают другие армии, и боевой дух, закаленный в самые суровые зимы в Европе. Боеготовность военно-морских сил страдает по мере того, как ресурсы перетекают в сухопутные войска." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_invincible_frontier: "Непобедимый рубеж" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_invincible_frontier: "Репутация Финляндии как непобедимой нации демонстрирует мощь без обнажения меча. Авторитет короны укрепляется национальной гордостью, а дипломатическое положение Финляндии становится все сильнее." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_trade_fleet: "Финский торговый флот" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_trade_fleet: "Растущий флот финских торговых судов доставляет деготь, древесину и меха в каждый порт Балтики. Моряки стекаются в прибрежные города, хотя кавалерийские традиции внутренних районов остаются без внимания." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_develop_interior: "Разработка интерьера" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_develop_interior: "Инвестиции текут во внутренние районы Финляндии, в новые дороги, реформированную администрацию и банковские учреждения, которые направляют коммерческое богатство на долгосрочное развитие. Быстрый рост приводит к некоторому инфляционному давлению." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_mercantile_dominion: "Торговый Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_mercantile_dominion: "Коммерческая сеть Финляндии охватывает страны Балтии и за ее пределами. Финских торговцев ждут в каждом порту, финские разведывательные сети составляют карту каждого рынка, а финские корабли обеспечивают благоприятные торговые условия." #NT!
 STATIC_MODIFIER_NAME_nd_fin_dest_industrial_pioneer: "Промышленный пионер" #NT!
 STATIC_MODIFIER_DESC_nd_fin_dest_industrial_pioneer: "Коммерческое богатство финансирует программу модернизации и индустриализации. Разнообразные народы Финляндии объединяет процветание, и легитимность финского правления растет с каждым новым предприятием." #NT!
 nd_fin_talvitukikohta: "Талвитукикохта" #NT!
 nd_fin_talvitukikohta_desc: "Укрепленная база зимних боевых действий, предназначенная для проведения военных операций в глубине Финляндии. Толстые бревенчатые стены, отапливаемые казармы и скрытые склады снабжения позволяют финской армии действовать в условиях, которые парализуют любого захватчика." #NT!
 nd_fin_talvitukikohta_upkeep: "Содержание зимней крепости" #NT!
 nd_fin_talvitukikohta_upkeep_desc: "Содержание отапливаемых казарм зимней крепости, оборонительных сооружений и скрытых тайников с припасами, пиломатериалов для строительства и отопления, камня для укреплений, вооружения для гарнизона." #NT!
 nd_fin_pohjolan_kauppahalli: "Похьолан Кауппахалли" #NT!
 nd_fin_pohjolan_kauppahalli_desc: "Большой северный торговый зал, где финские купцы ведут дела с торговцами со всей Европы. Склады смолы и древесины, счетные комнаты для банкиров и залы, где коммерческие соглашения формируют экономику Балтии." #NT!
 nd_fin_pohjolan_kauppahalli_upkeep: "Содержание торгового зала" #NT!
 nd_fin_pohjolan_kauppahalli_upkeep_desc: "Эксплуатация большого торгового зала, ткань для мебели, бумага для бухгалтерских книг и договоров, мебель для счетных комнат и залов заседаний." #NT!
 fin_haradshovding_ting_bureaucracy: "Харадсхёвдинг Тинг" #NT!
 fin_haradshovding_ting_bureaucracy_desc: "Средневековый шведско-финский суд сотни, где окружной судья (häradshövding) председательствовал в суде присяжных вместе с двенадцатью фермерскими заседателями из окружающей сотни. Конституция 1634 года отнесла Финляндию к числу лагсагоров королевства; на практике этот институт был еще старше: сельские споры разрешались на сезонных собраниях, где для вынесения юрисдикции должны были присутствовать как минимум семь народных заседателей. Тинг был рабочей основой финского самоуправления в соответствии со шведским законодательством." #NT!
 fin_abo_bishopric_bureaucracy: "Епископство Або" #NT!
 fin_abo_bishopric_bureaucracy_desc: "Епархия Турку (Або), впервые упомянутая в 1259 году, охватывала всю средневековую Финляндию и подчинялась архиепископскому престолу Упсалы. До конца тринадцатого века епископ был де-факто светским лидером Финляндии; впоследствии капитул кафедрального собора в Або, доминиканский монастырь, основанный в 1249 году, и сеть приходов, которая увеличилась вдвое по мере того, как местная администрация сохраняла церковь центральным учреждением королевства. Первый финский епископ по национальности был назван в 1291 году; после этого все должностные лица были финнами по рождению." #NT!
 fin_hakkapeliitta_levy_bureaucracy: "Хаккапелитта Кавалерийский сбор" #NT!
 fin_hakkapeliitta_levy_bureaucracy_desc: "Провинциальные финские кавалерийские полки, организованные под руководством Густава-Адольфа в 1610-1630-х годах: Нюланд-Тавастехус, Або-Бьернеборг и Выборг-Нислотт. Их кавалеристы, экипированные по системе ротехолл, при которой группы ферм поставляли лошадей, оружие и всадников, стали ударной кавалерией Шведской империи в Тридцатилетней войне. Название происходит от иностранного перевода их финского боевого клича hakkaa päälle: «сруби их»." #NT!
 fin_birkarl_lapptribute_bureaucracy: "Дань Биркарлу Лаппу" #NT!
 fin_birkarl_lapptribute_bureaucracy_desc: "Пирккалайсет, купцы с королевской лицензией из долин Торнио, Лулео и Питео, которые с тринадцатого по семнадцатый века обладали монопольными правами на торговлю с саамами Лаппмаркена и сбор налогов с них. Каждая речная долина представляла собой отдельную лаппмарку со своими биркарлами; корона получила свою долю, биркарлы разбогатели, а саамы оказались в колониальных отношениях, которые закончились только тогда, когда три речных города получили свои городские уставы 1621 года и государство взяло на себя управление напрямую." #NT!
 AUTO_MODIFIER_NAME_nd_fin_bureaucracy_authority: "Финские административные поместья" #NT!
 AUTO_MODIFIER_DESC_nd_fin_bureaucracy_authority: "При формировании Финляндия унаследовала институциональный аппарат, который шведское правление построило на своей территории: тинг, епископство, полки ротехолл и сеть торговли и дани на севере. Предоставляет один слот бюрократии и открывает систему [bureaucracies|e], позволяющую игроку активировать до двух учреждений (с универсальным слотом капитала)." #NT!
