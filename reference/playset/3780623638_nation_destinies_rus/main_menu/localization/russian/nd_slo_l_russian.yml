l_russian:
  
  # Formation Event 
 nd_slo.1.t: "Рождение Словакии" #NT!
 nd_slo.1.d: "От окутанных туманом вершин Карпат до богатых золотом долин Крушных гор движется новая нация. На протяжении веков словацкий народ был шахтерами, пастухами и солдатами Верхней Венгрии: их империи финансировались серебром, их крепости удерживали горные перевалы, их города богатели за счет меди и монет. Теперь, когда Словакия стоит сама по себе, встает выбор: будем ли мы строить на богатствах под нашими горами или на силе перевалов, которые их охраняют?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_slo.1.a: "Мы — горнодобывающая корона Карпат" #NT!
 nd_slo.1.b: "Мы — пограничный бастион христианского мира" #NT!
  
  # Formation Timed Modifiers 
 STATIC_MODIFIER_NAME_nd_slo_mining_crown: "Горнодобывающая корона Карпат" #NT!
 STATIC_MODIFIER_DESC_nd_slo_mining_crown: "Минеральные богатства Словакии (серебро из Банской Штявницы, золото из Кремницы, медь из Банска-Бистрицы) составляют основу нового национального процветания. Технические инновации в шахтах стимулируют институциональный прогресс." #NT!
 STATIC_MODIFIER_NAME_nd_slo_frontier_bastion: "Пограничный бастион христианского мира" #NT!
 STATIC_MODIFIER_DESC_nd_slo_frontier_bastion: "Крепостные традиции Словакии и горные ополчения, охраняющие Карпатские перевалы от османских и степных набегов, образуют щит Центральной Европы. Каждая долина — смертельная ловушка для захватчиков." #NT!
  
  # Advance DHE Event: Thurzo-Fugger Partnership 
 nd_slo.2.t: "Партнерство Турзо-Фуггера" #NT!
 nd_slo.2.d: "Партнерство словацкого дворянина Яна Турзо и аугсбургского купца Якоба Фуггера привело к созданию крупнейшего медного предприятия в Европе. Их рудники в Банска-Бистрице производят почти половину мировой меди, их плавильные заводы горят день и ночь, а их торговые сети простираются от Венеции до Леванта. Как мы можем извлечь выгоду из этого необычайного богатства?" #NT!
 nd_slo.2.a: "Предоставьте им эксклюзивные права на добычу полезных ископаемых" #NT!
 nd_slo.2.b: "Чартерные гильдии горняков независимо" #NT!
  
  # Thurzo-Fugger Event Modifiers 
 STATIC_MODIFIER_NAME_nd_slo_thurzo_fugger_monopoly: "Монополия Турзо-Фуггера" #NT!
 STATIC_MODIFIER_DESC_nd_slo_thurzo_fugger_monopoly: "Предприятие Thurzo-Fugger владеет эксклюзивными правами на словацкую медь и серебро. Их капитал и опыт выводят производство на беспрецедентный уровень." #NT!
 STATIC_MODIFIER_NAME_nd_slo_mining_guilds_charter: "Устав горнодобывающих гильдий" #NT!
 STATIC_MODIFIER_DESC_nd_slo_mining_guilds_charter: "Независимые горнодобывающие гильдии свободно конкурируют в Словацких Рудных горах, строя инфраструктуру и нанимая квалифицированных горняков со всей Центральной Европы." #NT!
  
  # Advance DHE Event: Pressburg Coronation City 
 nd_slo.3.t: "Коронационный город Прессбург" #NT!
 nd_slo.3.d: "После захвата Буды османами Пресбург (известный словакам как Братислава) стал городом коронации венгерских королей. Сейчас собор Святого Мартина является свидетелем коронации монархов, в наших стенах заседает сейм, и здесь заседает архиепископ. Прессбург стал фактической столицей королевства. Как нам использовать это необычайное возвышение?" #NT!
 nd_slo.3.a: "Пусть коронации повысят наш престиж" #NT!
 nd_slo.3.b: "Развитие Прессбурга как коммерческого центра" #NT!
  
  # Pressburg Event Modifiers 
 STATIC_MODIFIER_NAME_nd_slo_coronation_prestige: "Престиж Коронационного города" #NT!
 STATIC_MODIFIER_DESC_nd_slo_coronation_prestige: "Будучи резиденцией королевских коронаций и венгерского парламента, Прессбург пользуется уважением европейских судов и укрепляет дипломатический статус Словакии." #NT!
 STATIC_MODIFIER_NAME_nd_slo_pressburg_commerce: "Прессбург Коммерс" #NT!
 STATIC_MODIFIER_DESC_nd_slo_pressburg_commerce: "Положение Прессбурга на Дунае в сочетании с его новым статусом политической столицы делает его естественным центром торговли между Веной, Будой и Востоком." #NT!
  
  # Advance DHE Event: Kuruc Uprising 
 nd_slo.4.t: "Восстание Курука" #NT!
 nd_slo.4.d: "Лишенные собственности дворяне и протестантские бойцы Верхней Венгрии взяли в руки оружие Куручи, восставшие против господства Габсбургов. Под предводительством харизматичных командиров они ведут партизанскую войну в долинах Карпат, совершая поджоги и совершая набеги. Словацкие земли разрываются между теми, кто присоединяется к восстанию, и теми, кто ищет соглашения с Веной. Какой путь отвечает нашим интересам?" #NT!
 nd_slo.4.a: "Присоединяйтесь к восстанию Курука!" #NT!
 nd_slo.4.b: "Ищите жилье у Габсбургов" #NT!
  
  # Kuruc Event Modifiers 
 STATIC_MODIFIER_NAME_nd_slo_kuruc_rebellion: "Дух Куручи" #NT!
 STATIC_MODIFIER_DESC_nd_slo_kuruc_rebellion: "Боевой дух повстанцев Куруца вдохновляет словацких солдат. Их партизанская тактика в долинах Карпат оказывается разрушительно эффективной против обычных армий." #NT!
 STATIC_MODIFIER_NAME_nd_slo_habsburg_accommodation: "Отели Габсбург" #NT!
 STATIC_MODIFIER_DESC_nd_slo_habsburg_accommodation: "Стремясь к прагматичным условиям с Веной, Словакия обеспечивает религиозную терпимость и административные привилегии, которые обеспечивают стабильность и дипломатический статус." #NT!
  
  # Advance DHE Event: National Awakening 
 nd_slo.5.t: "Голос нации" #NT!
 nd_slo.5.d: "Людовит Штур достиг того, чего не смогли сделать столетия общих страданий: он дал словацкому народу общий язык. Встретившись в Хлбоке в 1843 году, Стур и его товарищи Ходза и Хурбан кодифицировали стандартный словацкий язык на основе центральнословацкого диалекта. Впервые словаки от Братиславы до Кошице могут читать одни и те же газеты, петь одни и те же песни и мечтать об одних и тех же мечтах. Матица Словенска готова принести этот новый язык в каждую деревню Карпат." #NT!
 nd_slo.5.a: "Пусть наш язык объединит нас" #NT!
  
  # National Awakening Modifier 
 STATIC_MODIFIER_NAME_nd_slo_national_language: "Словацкий национальный язык" #NT!
 STATIC_MODIFIER_DESC_nd_slo_national_language: "Кодификация стандартного словацкого языка Людовитом Штуром создает общую культурную идентичность, стимулируя грамотность, культурное производство и национальную гордость на словацких землях." #NT!
  
  # Destiny Variable Tooltips 
 nd_slo_formed_tt: "была образована Словакия." #NT!
 nd_slo_path_a_tt: "Выберите путь Mining Crown" #NT!
 nd_slo_path_b_tt: "Выберите путь к Пограничному Бастиону." #NT!
  
  # === ADVANCES === 
  
  # Age 1: Traditions 
 nd_slo_carpathian_defense: "Карпатская горная оборона" #NT!
 nd_slo_carpathian_defense_desc: "Горные перевалы Карпат являются естественной крепостью Словакии. Местные ополченцы (Хорали) патрулируют горные хребты, а сторожевые вышки усеивают возвышенности, обеспечивая раннее предупреждение о набегах с любого направления." #NT!
 nd_slo_mining_privilege: "Королевские горнодобывающие привилегии" #NT!
 nd_slo_mining_privilege_desc: "Венгерские короли предоставляют обширные привилегии в горнодобывающей промышленности городам Словацких Рудных гор, привлекая немецких поселенцев и создавая правовую основу для самых продуктивных серебряных и медных рудников Европы." #NT!
 nd_slo_valasi_herding: "Пасторальная традиция Валаси" #NT!
 nd_slo_valasi_herding_desc: "Влахские пастухи мигрируют в Карпатское нагорье, принося с собой своеобразную пасторальную экономику, основанную на выпасе овец, производстве сыра брынза и сезонном отгонном животноводстве на горных лугах." #NT!
 nd_slo_royal_charter_towns: "Королевские Чартерные Города" #NT!
 nd_slo_royal_charter_towns_desc: "Горнодобывающие поселения, такие как Кремница, Банска Штьявница и Банска Быстрица, получают королевские грамоты, дающие им немецкое городское право, самоуправление и торговые привилегии, которые стимулируют городское развитие." #NT!
 nd_slo_carpathian_faiths: "Карпатская Религиозная Мозаика" #NT!
 nd_slo_carpathian_faiths_desc: "Католическая, православная, а позже и протестантская общины сосуществуют на окраинах Карпат, где практические требования горной жизни способствуют развитию традиции религиозного прагматизма." #NT!
 nd_slo_castle_building: "Традиция строительства замка" #NT!
 nd_slo_castle_building_desc: "Великие замки Спиш, Орава и Тренчин доминируют над словацким ландшафтом: массивные каменные укрепления, построенные для контроля над горными перевалами и переправами через реки, образующие единую оборонительную сеть." #NT!
  
  # Age 2: Renaissance 
 nd_slo_valasi_riders: "Валасиская пастушья кавалерия" #NT!
 nd_slo_valasi_riders_desc: "Конные пастухи Карпатского нагорья служат легкой кавалерией, их глубокое знание горной местности делает их неоценимыми в качестве разведчиков и рейдеров в труднопроходимой местности вдоль границы." #NT!
 nd_slo_kremnica_tradition: "Традиция чеканки Кремницы" #NT!
 nd_slo_kremnica_tradition_desc: "Монетный двор Кремница, основанный в 1328 году, производит знаменитые золотые дукаты, которые обращаются по всей Европе. Точные стандарты чеканки монет и технический опыт делают его одним из самых уважаемых монетных дворов христианского мира." #NT!
 nd_slo_thurzo_fugger: "Турзо-Фуггер Энтерпрайз" #NT!
 nd_slo_thurzo_fugger_desc: "Партнерство Яна Турзо и Якоба Фуггера создает крупнейшее в мире предприятие по производству меди, перерабатывающее почти сорок процентов мировой продукции, добываемой на рудниках вокруг Банска-Бистрицы." #NT!
 nd_slo_highland_textiles: "Хайлендские текстильные традиции" #NT!
 nd_slo_highland_textiles_desc: "Влахские пасторальные общины в Карпатских горах развивают традицию обработки шерсти, производя грубую ткань и войлок из отар горных овец для торговли на равнинных рынках.\n\n#italic Доступно в: $nd_slo_salas$#!" #NT!
 nd_slo_mining_technology: "Горные технологии" #NT!
 nd_slo_mining_technology_desc: "Словацкие горняки являются первооткрывателями систем водоотведения, вентиляционных шахт и технологий переработки руды, которые продвигают шахты глубже, чем когда-либо прежде, сохраняя производительность даже при истощении поверхностных месторождений." #NT!
 nd_slo_hungarian_levies: "Венгерская военная служба" #NT!
 nd_slo_hungarian_levies_desc: "Словацкие солдаты служат в венгерской королевской армии, набираются опыта в приграничных войнах и завоевывают репутацию надежной пехоты в кампаниях против османской экспансии." #NT!
  
  # Age 3: Discovery 
 nd_slo_banska_guard_tradition: "Банская городская стража" #NT!
 nd_slo_banska_guard_tradition_desc: "В богатых шахтерских городах Словацких Рудных гор есть профессиональные охранники, обученные тактике пик и выстрелов, которые защищают свое серебро и медь от бандитов, рейдеров и османских вторжений." #NT!
 nd_slo_pressburg_coronation: "Коронационный город Прессбург" #NT!
 nd_slo_pressburg_coronation_desc: "После захвата Буды османами в 1541 году Братислава становится городом коронации венгерских королей. На протяжении более двух столетий в соборе Святого Мартина коронуются одиннадцать монархов." #NT!
 nd_slo_ottoman_frontier: "Османская пограничная оборона" #NT!
 nd_slo_ottoman_frontier_desc: "Южная Словакия становится полем битвы, поскольку османские войска продвигаются на север вслед за Мохачем. Укрепленные города и гарнизоны замков образуют оборонительную линию, защищающую горнодобывающие регионы от турецких набегов.\n\n#italic Доступно в: $nd_slo_carpathian_watchtower$#!" #NT!
 nd_slo_upper_hungary_refuge: "Верхняя Венгрия как убежище" #NT!
 nd_slo_upper_hungary_refuge_desc: "Поскольку центральная Венгрия попадает под османскую оккупацию, беженцы хлынут на север, в Словакию: дворяне, горожане, ученые и ремесленники, которые обогащают культурную и экономическую жизнь Верхней Венгрии.\n\n#italic Доступно в: $nd_slo_salas$#!" #NT!
 nd_slo_advanced_smelting: "Расширенная плавка руды" #NT!
 nd_slo_advanced_smelting_desc: "Новые методы плавки, разработанные в словацких горнодобывающих городах, позволяют получать более высокие выходы из меди и железной руды, производя инструменты и инвентарь, которые продаются по всей Центральной Европе.\n\n#italic Доступно в: $nd_slo_banska_mines$#!" #NT!
 nd_slo_trnava_university: "Трнавский университет" #NT!
 nd_slo_trnava_university_desc: "Основанный иезуитами в 1635 году, Трнавский университет становится ведущим высшим учебным заведением Верхней Венгрии, воспитывающим поколение духовенства, юристов и администраторов." #NT!
  
  # Age 4: Reformation 
 nd_slo_kuruc_revolt: "Восстание Курука" #NT!
 nd_slo_kuruc_revolt_desc: "Лишенная собственности протестантская знать Верхней Венгрии поднимается как Куручи и ведет партизанскую войну в долинах Карпат. Словацкие солдаты обеих сторон приобретают с трудом завоеванный опыт ведения горных боев." #NT!
 nd_slo_reformation_towns: "Реформация в шахтерских городах" #NT!
 nd_slo_reformation_towns_desc: "Лютеранские и кальвинистские проповедники находят благодатную почву в шахтерских городах Словакии, где грамотные немецкие и словацкие бюргеры принимают новую веру, основывая школы и типографии." #NT!
 nd_slo_carpathian_economy: "Карпатская торговля" #NT!
 nd_slo_carpathian_economy_desc: "В Словакии развивается двойная экономика: горные пастухи производят брынзу и шерсть на рынок, а шахтерские города чеканят дукаты и торгуют медными слитками по всей Европе.\n\n#italic Доступно в: $nd_slo_salas$#!" #NT!
 nd_slo_counter_reformation: "Контрреформация" #NT!
 nd_slo_counter_reformation_desc: "Католическое возрождение, спонсируемое Габсбургами, приносит в Словакию иезуитские миссии, новые церкви и обновленную религиозную власть. Восстановленная вера заказывает священные украшения и литургическое искусство у ювелиров Кремницы.\n\n#italic Доступно в: $nd_slo_kremnica_mint$#!" #NT!
 nd_slo_thokoly_kingdom: "Королевство Токоли" #NT!
 nd_slo_thokoly_kingdom_desc: "Краткая книга Имре Токоли «Королевство Верхняя Венгрия» демонстрирует, что территория Словакии может служить опорой власти, независимой как от Вены, так и от Константинополя, вдохновляя будущие поколения." #NT!
 nd_slo_arms_manufacture: "Производство оружия" #NT!
 nd_slo_arms_manufacture_desc: "Железоплавильные и медеплавильные заводы словацких горнодобывающих районов начинают производить оружие и доспехи, снабжая пограничные гарнизоны, сражающиеся на османской границе.\n\n#italic Доступно в: $nd_slo_banska_mines$#!" #NT!
  
  # Age 5: Absolutism 
 nd_slo_stiavnica_academy: "Банска Штьявница Горная Академия" #NT!
 nd_slo_stiavnica_academy_desc: "Горная академия Банска Штьявница, основанная в 1735 году и возведенная в королевскую академию при Марии Терезии, становится первым в мире высшим техническим учебным заведением, готовящим инженеров и минералогов." #NT!
 nd_slo_professional_regiments: "Профессиональные полки" #NT!
 nd_slo_professional_regiments_desc: "В рамках военной реформы Габсбургов в словацких округах формируются профессиональные пехотные полки (Тоборсек), обученные линейной тактике и оснащенные современным огнестрельным оружием." #NT!
 nd_slo_theresian_reforms: "Терезианские реформы" #NT!
 nd_slo_theresian_reforms_desc: "Административные реформы Марии Терезии привнесли в Верхнюю Венгрию централизованное управление, стандартизированное налогообложение и систематические изыскания полезных ископаемых, модернизируя словацкие округа и картируя их геологические богатства.\n\n#italic Доступно в: $nd_slo_mining_academy$#!" #NT!
 nd_slo_iron_industry: "Железная промышленность" #NT!
 nd_slo_iron_industry_desc: "Металлургические заводы словацких горнодобывающих округов переходят от плавки сырья к производству стали, удовлетворяя растущий военный и промышленный спрос Габсбургов.\n\n#italic Доступно в: $nd_slo_banska_mines$#!" #NT!
 nd_slo_technical_education: "Техническое образование" #NT!
 nd_slo_technical_education_desc: "Учебная программа Горной академии расширяется и включает в себя химию, металлургию, картографию и инженерное дело, выпуская выпускников, которые продвигают горные технологии на землях Габсбургов.\n\n#italic Доступно в: $nd_slo_mining_academy$#!" #NT!
 nd_slo_industrial_foundations: "Промышленные фонды" #NT!
 nd_slo_industrial_foundations_desc: "Переработка древесины, металлургия и производство стекла расширяются по словацким долинам, закладывая основы для промышленного развития, выходящего за рамки традиционной добычи полезных ископаемых." #NT!
  
  # Age 6: Revolutions 
 nd_slo_national_awakening: "Словацкое национальное пробуждение" #NT!
 nd_slo_national_awakening_desc: "Кодификация стандартного словацкого языка, проведенная Людовитом Штуром в 1843 году, положила начало национальному культурному движению. Газеты, литература и образование на словацком языке формируют общую идентичность от Братиславы до Кошице." #NT!
 nd_slo_matica_slovenska: "Матица Словенская" #NT!
 nd_slo_matica_slovenska_desc: "Matica Slovenska, основанная в 1863 году, становится институциональным центром словацкой культурной жизни: продвигает литературу, образование и литературный язык во всем Карпатском регионе." #NT!
 nd_slo_volunteer_corps: "Словацкий добровольческий корпус" #NT!
 nd_slo_volunteer_corps_desc: "В революционный 1848 год словацкие добровольцы во главе со Стуром, Ходзой и Гурбаном берутся за оружие за национальные права, борясь за признание против венгерских революционных сил." #NT!
 nd_slo_emancipation: "Крестьянское освобождение" #NT!
 nd_slo_emancipation_desc: "Отмена крепостного права освобождает словацкое крестьянство, открывая путь к росту населения и экономической мобильности, поскольку бывшие крепостные входят в состав городской рабочей силы и расширяют сельскохозяйственное производство." #NT!
 nd_slo_mining_industrialization: "Горнодобывающая индустриализация" #NT!
 nd_slo_mining_industrialization_desc: "Паровые двигатели, железнодорожный транспорт и современные горнодобывающие технологии преобразовывают древнюю горнодобывающую промышленность Словакии, увеличивая производство и соединяя Крушные горы с европейскими рынками." #NT!
 nd_slo_pan_slavic_congress: "Панславянский конгресс" #NT!
 nd_slo_pan_slavic_congress_desc: "Словацкие делегаты на Панславянском конгрессе 1848 года налаживают связи с чешскими, польскими, сербскими и другими славянскими движениями, создавая дипломатические сети, которые укрепляют позиции Словакии." #NT!
  
  # === UNITS === 
 a_nd_slo_horali: "Хорали" #NT!
 a_nd_slo_horali_desc: "Карпатское горное ополчение, набранное из горных сел. Опытные засадчики, знающие каждый перевал, ущелье и хребт в словацких горах." #NT!
 a_nd_slo_valasi: "Валаси Райдерс" #NT!
 a_nd_slo_valasi_desc: "Конные влахские пастухи Карпатского нагорья. Крепкий, мобильный и привыкший действовать самостоятельно в самой суровой горной местности." #NT!
 a_nd_slo_banska_guard: "Банска Гвардия" #NT!
 a_nd_slo_banska_guard_desc: "Профессиональные городские охранники из богатых шахтерских городов Словацких Рудных гор. Хорошо экипированные и дисциплинированные, они защищают серебро и медь, которые финансируют королевство." #NT!
 a_nd_slo_toborsek: "Тоборсек" #NT!
 a_nd_slo_toborsek_desc: "Профессиональные пехотные полки, сформированные из словацких горнодобывающих округов в рамках военной реформы Габсбургов. Обучены линейной войне и оснащены современным оружием." #NT!
  
  # === BUILDINGS === 
 nd_slo_banska_mines: "Банский горный комбинат" #NT!
 nd_slo_banska_mines_desc: "Промышленная горнодобывающая инфраструктура в Словацких Рудных горах, разрабатывающая богатые месторождения серебра, меди и других металлов с использованием передовых технологий дренажа и плавки." #NT!
 nd_slo_kremnica_mint: "Кремницкий монетный двор" #NT!
 nd_slo_kremnica_mint_desc: "Один из самых уважаемых монетных дворов Европы, производящий знаменитые кремницкие дукаты и другие монеты из словацкого золота и серебра с 1328 года." #NT!
 nd_slo_salas: "Салас" #NT!
 nd_slo_salas_desc: "Влахское пастушеское поселение на Карпатском нагорье, занимающееся сезонным выпасом овец, изготовлением брынзы и производством шерсти." #NT!
 nd_slo_carpathian_watchtower: "Карпатская сторожевая башня" #NT!
 nd_slo_carpathian_watchtower_desc: "Укрепленный наблюдательный пункт, контролирующий Карпатский перевал, обеспечивающий раннее предупреждение о рейдерах и направляющий захватчиков в подготовленные зоны поражения." #NT!
 nd_slo_mining_academy: "Горная Академия" #NT!
 nd_slo_mining_academy_desc: "Техническое учреждение по образцу академии Банска Штьявница, готовящее инженеров, минералогов и металлургов новейшим горным наукам." #NT!
  
  # === PRODUCTION METHODS === 
 nd_slo_ore_smelting: "Плавка руды" #NT!
 nd_slo_ore_smelting_desc: "Медь и железная руда переплавляется в инструменты и инвентарь с использованием передовых словацких печных технологий." #NT!
 nd_slo_arms_forging: "Ковка оружия" #NT!
 nd_slo_arms_forging_desc: "Медеплавильные и железные кузницы горнодобывающих округов производят оружие и доспехи для пограничных гарнизонов." #NT!
 nd_slo_steel_forging: "Стальная ковка" #NT!
 nd_slo_steel_forging_desc: "Передовая металлургия в словацких горнодобывающих районах производит высококачественную сталь из железных и медных сплавов для промышленного и военного использования." #NT!
 nd_slo_mine_maintenance: "Шахтные операции" #NT!
 nd_slo_mine_maintenance_desc: "Древесина для опор карьеров, железо для инструментов и камень для дренажных каналов поддерживают глубокие шахтные шахты." #NT!
 nd_slo_ducat_minting: "Чеканка Дуката" #NT!
 nd_slo_ducat_minting_desc: "Серебро и медь сплавляются и чеканятся в знаменитые дукаты Кремницы, которые ценятся во всей Европе за свой постоянный вес и чистоту." #NT!
 nd_slo_jewelry_craft: "Ювелирное ремесло" #NT!
 nd_slo_jewelry_craft_desc: "Мастера-ювелиры Кремницы изготавливают из меди и серебра ювелирные изделия, священные сосуды и литургические украшения для церквей и дворянских дворов." #NT!
 nd_slo_mint_maintenance: "Монетный двор" #NT!
 nd_slo_mint_maintenance_desc: "Золотые запасы, запасы серебра и железные штампы поддерживают непрерывный процесс чеканки." #NT!
 nd_slo_bryndza_making: "Изготовление Брынзы" #NT!
 nd_slo_bryndza_making_desc: "Овечье молоко и соль перерабатываются в брынзу, особый карпатский сыр, который поддерживает горные общины и находит рынки сбыта в низинных городах." #NT!
 nd_slo_wool_processing: "Обработка шерсти" #NT!
 nd_slo_wool_processing_desc: "Шерсть горных овец чистят, прочесывают и ткут в грубую ткань пасторальные общины валахов в карпатских поселениях." #NT!
 nd_slo_fur_tanning: "Дубление меха" #NT!
 nd_slo_fur_tanning_desc: "Овчина и шерсть дубятся и превращаются в теплые меха горными общинами, удовлетворяя потребности беженцев и поселенцев в Верхней Венгрии." #NT!
 nd_slo_salas_maintenance: "Пастырское содержание" #NT!
 nd_slo_salas_maintenance_desc: "Скот, соль для консервации и шерсть для тепла поддерживают сезонный цикл пасторальной жизни Карпат." #NT!
 nd_slo_frontier_provisions: "Пограничные положения" #NT!
 nd_slo_frontier_provisions_desc: "Скот и соль снабжают пограничные гарнизоны снаряжением солдат, стоящих на карпатских сторожевых башнях против османских набегов." #NT!
 nd_slo_watchtower_maintenance: "Гарнизон Сторожевой Башни" #NT!
 nd_slo_watchtower_maintenance_desc: "Древесина, камень и оружие снабжают небольшой гарнизон этого горного наблюдательного пункта." #NT!
 nd_slo_academy_instruction: "Обучение в Академии" #NT!
 nd_slo_academy_instruction_desc: "Бумага для технических чертежей и книги для лекций поддерживают преподавательскую миссию академии в области минералогии и инженерии." #NT!
 nd_slo_mineral_surveys: "Исследования полезных ископаемых" #NT!
 nd_slo_mineral_surveys_desc: "Стеклянные и железные инструменты позволяют проводить систематические геологические исследования Рудных гор, картировать месторождения полезных ископаемых для горных исследований академии." #NT!
 nd_slo_academy_maintenance: "Содержание Академии" #NT!
 nd_slo_academy_maintenance_desc: "Книги, бумага и строительные материалы поддерживают библиотеку, лаборатории и лекционные залы академии." #NT!
  
  # ===== DESTINY ADVANCES ===== 
  
 nd_slo_destiny: "Карпатский перекрёсток" #NT!
 nd_slo_destiny_desc: "Словакия стоит на перекрестке Центральной Европы. Эта молодая нация, богатая полезными ископаемыми и охраняемая горными перевалами, должна выбрать свой путь: будет ли она известна богатствами под ее вершинами или силой стен, которые их охраняют?" #NT!
  
  # Path A: Mining Crown 
 nd_slo_dest_ore_mountains: "Хозяева Рудных гор" #NT!
 nd_slo_dest_ore_mountains_desc: "Распространить словацкий контроль над горнодобывающей промышленностью за пределы родины, в богатые полезными ископаемыми Силезские приграничные районы. Контроль над Крновом и Фривалдовом приносит под наше управление новые месторождения серебра и золота." #NT!
 nd_slo_dest_silver_road: "Серебряная дорога" #NT!
 nd_slo_dest_silver_road_desc: "Партнерство Турцо-Фуггера показало, как словацкие металлы могут попасть на европейские рынки. Защитите торговый путь в Аугсбург и создайте финансовые учреждения для управления минеральной империей." #NT!
 nd_slo_dest_montanistica: "Академия Монтанистика" #NT!
 nd_slo_dest_montanistica_desc: "Превратить Словакию в европейский центр горной науки. Контролируйте крупные торговые города Нюрнберг и Вроцлав, развивайте родину в полную силу и позвольте Бергамту управлять минеральной империей." #NT!
  
  # Path B: Frontier Bastion 
 nd_slo_dest_pass_guard: "Стражи перевалов" #NT!
 nd_slo_dest_pass_guard_desc: "Обеспечьте безопасность южных подходов, взяв Эгер и Мишкольц. Эти города-крепости охраняют ворота между Венгерской равниной и Карпатским нагорьем. В руках словаков они запечатывают горную стену." #NT!
 nd_slo_dest_antemurale: "Антемурале христианитатис" #NT!
 nd_slo_dest_antemurale_desc: "Словакия претендует на древний титул «Оплот христианского мира». Возьмите саму Буду и создайте профессиональную армию, достойную выполнения этого священного долга." #NT!
 nd_slo_dest_carpathian_wall: "Карпатская стена" #NT!
 nd_slo_dest_carpathian_wall_desc: "Карпатская оборонительная линия от Вены до Белграда завершена. Словакия контролирует систему горных крепостей, которая защищает всю Центральную Европу." #NT!
  
  # ===== DESTINY EVENTS ===== 
  
  # Root Event 
 nd_slo.6.t: "Карпатский перекрёсток" #NT!
 nd_slo.6.d: "Образование Словакии поместило новую державу в сердце Центральной Европы. Карпатские горы определяют нашу нацию: они богаты серебром и медью под своими вершинами и непроходимы для любой армии, не знающей их перевалов. Наш путь вперед отмечен решениями, которые мы сделали при основании. Теперь мы должны пройти этот путь до его завершения." #NT!
 nd_slo.6.a: "Наша судьба ждет в горах" #NT!
  
  # Path A Stage 1 
 nd_slo.7.t: "Хозяева Рудных гор" #NT!
 nd_slo.7.d: "Наши горняки вышли за пределы родины, передав богатые полезными ископаемыми приграничные районы Силезии под словацкую администрацию. Древние горнодобывающие традиции Крушных гор (водяные насосы, вентиляционные шахты, передовая плавка) теперь служат более крупному предприятию. От Кремницы до Крнова словацкий опыт горнодобывающей промышленности устанавливает стандарты для Центральной Европы." #NT!
 nd_slo.7.a: "Горы отдают нам свои сокровища" #NT!
  
  # Path A Stage 2 
 nd_slo.8.t: "Серебряная дорога" #NT!
 nd_slo.8.d: "Словацкое серебро и медь текут по торговым путям в Аугсбург, финансовый центр Европы. На смену старому партнерству Турзо-Фуггера пришла сеть коммерческих отношений, охватывающая весь континент. Наши металлы финансируют армии и строят соборы от Лиссабона до Константинополя. Как нам организовать эту необыкновенную торговлю?" #NT!
 nd_slo.8.a: "Развивайте торговые сети" #NT!
 nd_slo.8.b: "Установить монополию королевского монетного двора" #NT!
  
  # Path A Stage 3 
 nd_slo.9.t: "Академия Монтанистика" #NT!
 nd_slo.9.d: "Горная академия Банска Штьявница превратилась в ведущее техническое учебное заведение в Европе. Его выпускники (инженеры, минералоги, металлурги) несут словацкую горную науку во все уголки континента. Бергамт, наша королевская горнодобывающая администрация, координирует горнодобывающую империю, простирающуюся от Нюрнберга до Вроцлава. Это вершина словацкой технической цивилизации." #NT!
 nd_slo.9.a: "Позвольте инновациям преобразовать наши отрасли" #NT!
 nd_slo.9.b: "Пусть наша сокровищница переполнится золотом" #NT!
  
  # Path B Stage 1 
 nd_slo.10.t: "Стражи перевалов" #NT!
 nd_slo.10.d: "Города-крепости Эгер и Мишкольц теперь несут словацкое знамя. Эти древние крепости охраняют ворота между Венгерской равниной и Карпатским нагорьем. Поскольку их стены находятся под нашим командованием, южные подступы к Словакии закрыты. Ни одна армия не может пройти на север через эти перевалы, не столкнувшись с нашими гарнизонами." #NT!
 nd_slo.10.a: "Горная стена стоит твердо" #NT!
  
  # Path B Stage 2 
 nd_slo.11.t: "Антемурале христианитатис" #NT!
 nd_slo.11.d: "С захватом Буды Словакия доказала, что является щитом Центральной Европы. Наша профессиональная армия, обученная традициям горной войны Карпат, вернула себе древнюю резиденцию венгерских королей. Титул Antemurale Christianitatis (Оплот христианского мира) принадлежит нам по праву оружия. Как нам укрепить этот священный долг?" #NT!
 nd_slo.11.a: "Обучайте наших солдат ведению горной войны" #NT!
 nd_slo.11.b: "Укрепляйте каждую стратегическую позицию" #NT!
  
  # Path B Stage 3 
 nd_slo.12.t: "Карпатская стена" #NT!
 nd_slo.12.d: "Карпатская оборонительная линия от Вены до Белграда завершена. Словацкие крепости контролируют каждый горный перевал, переправу через реку и стратегическую долину. Наша гарнизонная сеть представляет собой самую грозную оборонительную систему в Европе. Войска, вошедшие в Карпаты, не уходят. Словакия стала незыблемым щитом в сердце континента." #NT!
 nd_slo.12.a: "Никто не пройдет мимо наших стен" #NT!
 nd_slo.12.b: "Мы сражаемся во имя Бога" #NT!
  
  # ===== DESTINY TIMED MODIFIERS ===== 
  
 STATIC_MODIFIER_NAME_nd_slo_dest_fugger_network: "Торговая сеть Фуггера" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_fugger_network: "Словацкие металлы текут через торговую сеть Фуггера на рынки Европы. Коммерческие связи, налаженные в результате этого партнерства, увеличивают как богатство, так и дипломатический статус." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_mint_monopoly: "Монополия Королевского монетного двора" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_mint_monopoly: "Корона осуществляет исключительный контроль над чеканкой монет в Словакии и производством драгоценных металлов. Королевские монеты обращаются по фиксированным стандартам, что стабилизирует валюту и укрепляет власть короны." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_mining_revolution: "Горнодобывающая революция" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_mining_revolution: "Словацкая горная наука преобразовала добывающую промышленность. Паровые насосы, точные геодезические исследования и передовая металлургия делают наши шахты самыми производительными и инновационными в Европе." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_golden_treasury: "Золотая сокровищница" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_golden_treasury: "Накопленные минеральные богатства Карпат наполняют словацкую казну. Эта золотая казна финансирует реконструкцию, дипломатию и территориальную консолидацию." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_mountain_warfare: "Доктрина горной войны" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_mountain_warfare: "Словацкие солдаты обучены искусству горного боя: засадам, партизанским рейдам и использованию местности для устранения численного превосходства. Наши рейдовые группы обнажают вражеские линии снабжения, хотя содержание этих разбросанных горных гарнизонов напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_garrison_network: "Интегрированная гарнизонная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_garrison_network: "Скоординированная система укрепленных городов, цепей сторожевых башен и гарнизонных сил обеспечивает контроль над Карпатской границей. За каждым перевалом следят, каждая долина патрулируется, хотя военный фокус внутри страны замедляет интеграцию новых территорий." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_unconquerable: "Непобедимый" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_unconquerable: "Сеть горных крепостей Словакии легендарна. Ни одна армия вторжения не сумела успешно покорить Карпатскую стену, а репутация словацкой военной мощи вызывает уважение за столом переговоров, хотя эта военная уверенность порождает самоуспокоенность при дворе." #NT!
 STATIC_MODIFIER_NAME_nd_slo_dest_crusader_spirit: "Дух крестоносца" #NT!
 STATIC_MODIFIER_DESC_nd_slo_dest_crusader_spirit: "Словакия борется с пылом святого дела. Будучи Оплотом христианского мира, каждая война — это крестовый поход, каждый солдат — защитник веры." #NT!
  
  # ===== DESTINY BUILDINGS ===== 
  
 nd_slo_dest_bergamt: "Бергамт" #NT!
 nd_slo_dest_bergamt_desc: "Королевское горнодобывающее управление: централизованное бюро, контролирующее разведку полезных ископаемых, концессии на добычу полезных ископаемых, стандарты анализа и техническое образование в Словацкой минеральной империи." #NT!
 nd_slo_dest_krajina_fortress: "Краинская крепость" #NT!
 nd_slo_dest_krajina_fortress_desc: "Крупное пограничное укрепление, контролирующее стратегический подход к Карпатам. Построен, чтобы выдерживать длительную осаду и содержать постоянный гарнизон профессиональных солдат." #NT!
  
  # ===== DESTINY PRODUCTION METHODS ===== 
  
 nd_slo_dest_assay_office: "Пробирная палата" #NT!
 nd_slo_dest_assay_office_desc: "Серебро и медь проверяются, взвешиваются и сертифицируются назначенными короной пробирщиками, прежде чем из них отчеканиваются монеты гарантированной чистоты." #NT!
 nd_slo_dest_bergamt_maintenance: "Содержание бюро" #NT!
 nd_slo_dest_bergamt_maintenance_desc: "Бумага для записей и исследований, инструменты для геологических испытаний и железо для горнодобывающего оборудования обеспечивают административную деятельность Бергамта." #NT!
 nd_slo_dest_arms_depot: "Склад оружия" #NT!
 nd_slo_dest_arms_depot_desc: "Железо и медь из Крушных гор на крепостном складе перековывают оружие и доспехи, снабжая гарнизон оружием местного производства." #NT!
 nd_slo_dest_krajina_maintenance: "Содержание крепости" #NT!
 nd_slo_dest_krajina_maintenance_desc: "Камень для стен, древесина для построек и оружие для гарнизона поддерживают комплекс приграничной крепости." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_slo_bureaucracy_authority: "Краинска Справа" #NT!
 AUTO_MODIFIER_DESC_nd_slo_bureaucracy_authority: "Словацкое королевство унаследовало многоуровневые институты Верхней Венгрии (ассамблеи комитатусов, свободы королевских шахтерских городов, саксонское муниципальное право и канцелярию в Прессбурге) и может институционализировать три из них как постоянные бюрократические структуры." #NT!
  
 slo_stolica_bureaucracy: "Ассамблея округа Столица" #NT!
 slo_stolica_bureaucracy_desc: "Комитатус, унаследованный от графств-замков Арпадиан, был основной единицей венгерской администрации. Феиспан, назначенный королем, председательствовал на дворянском собрании, но местная шляхта избирала алиспана, судей солгабиро и их депутатов сейма. В словацких графствах собрание называлось столицей (резиденцией), и каждое из них становилось маленькой республикой местной знати, яростно защищавшей свои письменные привилегии и медленно подчинявшейся королевским указам." #NT!
  
 slo_banska_mesta_bureaucracy: "Горнодобывающие городки Банске-Места" #NT!
 slo_banska_mesta_bureaucracy_desc: "Семь королевских шахтерских городов Нижней Венгрии (Банска Штьявница, Кремница, Банска Быстрица, Пуканец, Новая Баня, Любетова и Банска Бела) действовали на основе Шемницерского Штадта и Бергрехта 1255–1466 годов, основополагающего горного закона Центральной Европы. С 1331 года камерграф Кремницы управлял каждым монетным двором и рудниками двенадцати графств, а кремницкий флорин (23 карата 9 гран, отчеканенный с 1335 года) стал золотой основой доходов венгерской короны." #NT!
  
 slo_spisska_unia_bureaucracy: "Спишска Уня" #NT!
 slo_spisska_unia_bureaucracy_desc: "Основан на привилегии, предоставленной Стефаном V саксонским поселенцам в 1271 году и закрепленной в Zipser Willkür ок. В 1370 году (старейший немецкий муниципальный закон, применяемый в Словакии), в провинции XXIV Королевских Спишских городов существовала собственная выборная диета, суды и казначейство. В 1412 году Сигизмунд Люксембургский заложил тринадцать городов Польше за 37 000 шоков пражских грошей для финансирования своей венецианской войны; они оставались под залогом Польши до 1772 года, но автономный статут Лиги сохранился нетронутым." #NT!
  
 slo_korunovacne_mesto_bureaucracy: "Коруновачное место Прешпорок" #NT!
 slo_korunovacne_mesto_bureaucracy_desc: "Когда османы захватили Буду в 1541 году, Прессбург (Братислава) стал столицей Королевской Венгрии. С 1536 по 1783 год в городе располагались канцелярия, палатинский двор и королевская палата; с 1542 по 1848 год здесь заседал венгерский сейм; а в соборе Святого Мартина девятнадцать габсбургских государей были коронованы королями и королевами Венгрии в период с 1563 по 1830 год. Коронационный холм проецировал венгерский суверенитет на словацкую землю, в то время как Буда была турецкой." #NT!
  
 slo_trnavska_synoda_bureaucracy: "Трнавский Синод" #NT!
 slo_trnavska_synoda_bureaucracy_desc: "Когда Эстергом пал под властью османов в 1543 году, резиденция примаса Венгрии была перенесена в Трнаву (Надьсомбат). Кардинал Петер Пазмани созвал Трнавский провинциальный синод в 1611 году для проведения Тридентских реформ, основал Трнавский университет в 1635 году и обратил большинство семей венгерских магнатов в католицизм. Словацкие земли стали институциональным стержнем венгерской контрреформации, но за это поплатились лютеранские бюргеры вольных королевских городов." #NT!
  
 slo_bratislavske_lyceum_bureaucracy: "Братиславский лицей" #NT!
 slo_bratislavske_lyceum_bureaucracy_desc: "В Евангелическом лицее Прессбурга, лютеранской семинарии и гимназии, с 1829 года размещалось Чешско-славянское общество, а также кафедра, на которой Людовит Штур преподавал с 1837 года. 2 февраля 1843 года кружок Штура решил в Глбоке 5 систематизировать стандартный словацкий литературный язык на среднесловацком диалекте; его «Наука словенской речи» (1846 г.) обнародовал кодификацию и положил начало всей словацкой политической программе 1848–1849 гг. Это учреждение сформировало грамотную словацкую интеллигенцию, отличную как от мадьярского дворянства, так и от чешского реформированного духовенства." #NT!
