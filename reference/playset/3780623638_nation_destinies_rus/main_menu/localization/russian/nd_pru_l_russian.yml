l_russian:
 STATIC_MODIFIER_NAME_nd_iron_kingdom: "Железное Королевство" #NT!
 STATIC_MODIFIER_DESC_nd_iron_kingdom: "Пруссия — это не государство, имеющее армию: это армия, владеющая государством. Королевство Гогенцоллернов превратилось в самое милитаризованное общество в Европе, где дисциплина, послушание и воинская доблесть составляют основу национальной идентичности." #NT!
 STATIC_MODIFIER_NAME_nd_enlightened_state: "Просвещенное государство" #NT!
 STATIC_MODIFIER_DESC_nd_enlightened_state: "От пиетистских школ Галле до правовых реформ Фридриха — Пруссия преследовала идею рационального управления. Эффективная бюрократия, всеобщее образование и кодифицированное законодательство превращают бедный северный марш в двигатель прогресса." #NT!
 nd_pru.1.t: "Рождение Пруссии" #NT!
 nd_pru.1.d: "Преобразование завершено. Из пепла Тевтонского ордена и песчаных маршей Бранденбурга возникло новое государство: Пруссия. Мы сломили власть духовенства, связали юнкерскую знать своей службой и навели порядок на раздробленной земле. Теперь перед нами стоит вопрос: какое королевство мы должны построить?\n\nПойдем ли мы по железному пути, обучая наших солдат формировать лучшую армию в Европе, делая войну своей промышленностью и дисциплинируя свое кредо? Или мы будем стремиться стать маяком просвещенного управления, инвестируя в школы, реформируя наши законы и строя государство, вызывающее восхищение философов и страх генералов?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pru.1.a: "Дисциплина превыше всего. Пруссия марширует." #NT!
 nd_pru.1.b: "Царство разума и закона." #NT!
 nd_pru.2.t: "Система расквартирования" #NT!
 nd_pru.2.d: "В 1733 году король Фридрих Вильгельм I издал Кантонский регламент, разделивший королевство на рекрутские округа, кантоны, за каждым из которых закреплен полк. Каждый трудоспособный мужчина зачисляется с рождения, служит в мирное время, чередуясь в отпусках и возвращаясь на свои поля между периодами обучения. Офицеры-юнкеры командуют крестьянами из их собственных поместий, создавая узы лояльности, которые выходят за рамки простой военной дисциплины.\n\nЭта система дает Пруссии армию, намного большую, чем должно поддерживать ее население: 3,6% от общей численности населения под ружьем, самая высокая доля в Европе. Вопрос в том, как мы применим этот необыкновенный ресурс." #NT!
 nd_pru.2.a: "Сверлите их неустанно. Качество важнее количества." #NT!
 nd_pru.2.b: "Максимизируйте эффективность. Каждый кантонист служит дважды: солдатом и фермером." #NT!
 nd_pru.3.t: "Косой боевой порядок" #NT!
 nd_pru.3.d: "В Лейтене в декабре 1757 года Фридрих продемонстрировал разрушительный потенциал косого приказа: сосредоточить подавляющие силы против самого слабого места линии противника, одновременно отклонив противоположный фланг. Имея 36 000 пруссаков против 66 000 австрийцев, король совершил идеальный марш через фронт противника, нанес удар по его незащищенному левому флангу и собрал всю австрийскую армию в одной из самых решающих побед в военной истории.\n\nСпустя всего несколько недель после столь же ошеломляющей победы при Россбахе, Лойтен установил прусскую тактическую доктрину в качестве стандарта, по которому будут сравнивать себя все европейские армии. Будем ли мы использовать это преимущество в наступлении или использовать эти принципы для совершенствования нашей оборонительной войны?" #NT!
 nd_pru.3.a: "Ударьте туда, где они слабее всего. Косая атака — наш меч." #NT!
 nd_pru.3.b: "Держись там, где мы сильнее. Пусть враг прорвется на наши позиции." #NT!
 nd_pru.4.t: "Генеральный штаб Гроссера" #NT!
 nd_pru.4.d: "После катастрофы Йены-Ауэрштедта в 1806 году реформаторы во главе с Герхардом фон Шарнхорстом и Августом фон Гнейзенау восстановили прусскую армию с ее основ. В 1810 году Кригсакадемия открыла свои двери, отбирая офицеров на основе продемонстрированного интеллекта и заслуг, а не только по рождению. Великий генеральный штаб, Генеральный штаб Гроссера, стал первым в истории постоянным органом военного планирования, ответственным за постоянное изучение войны во всех ее аспектах.\n\nЕго офицеры обучены мыслить независимо, принимать решения в отсутствие приказов и координировать операции на огромных расстояниях. Это учреждение будет формировать практику ведения войны на следующее столетие и далее." #NT!
 nd_pru.4.a: "Армия, которая думает как один разум." #NT!
 nd_pru.5.t: "Allgemeines Landrecht" #NT!
 nd_pru.5.d: "В 1794 году Пруссия обнародовала Allgemeines Landrecht Fur die Preussischen Staaten, Общие государственные законы, всеобъемлющий правовой кодекс, который стремился объединить различные провинциальные правовые системы королевства в единой системе. Кодекс, составленный по приказу Фридриха Великого и завершенный Карлом Готлибом Сваресом, представляет собой выдающееся достижение: абсолютная монархия, добровольно подчиняющаяся верховенству закона.\n\nЛандрехт гарантировал быстрое и беспристрастное отправление правосудия, защищал подданных от произвола королевской воли и устанавливал правовую защиту собственности и контрактов. Оно не было демократическим, сохраняло сословные социальные различия, но было рациональным, предсказуемым и справедливым в своих собственных условиях." #NT!
 nd_pru.5.a: "Закон превыше всего: даже короля." #NT!
 STATIC_MODIFIER_NAME_nd_pru_cantonment_discipline: "Учения по расквартированию" #NT!
 STATIC_MODIFIER_DESC_nd_pru_cantonment_discipline: "Неустанная подготовка и дисциплина превращают новобранцев-кантонистов в солдат исключительного качества." #NT!
 STATIC_MODIFIER_NAME_nd_pru_cantonment_efficiency: "Эффективность расквартирования" #NT!
 STATIC_MODIFIER_DESC_nd_pru_cantonment_efficiency: "Система расквартирования максимально эффективно использует каждый ресурс: солдаты возвращаются на свои фермы между кампаниями, кормя королевство, готовясь к маршу." #NT!
 STATIC_MODIFIER_NAME_nd_pru_oblique_order_offense: "Косая атака" #NT!
 STATIC_MODIFIER_DESC_nd_pru_oblique_order_offense: "Сосредоточьте силы в решающей точке. Нанесите удар там, где враг наиболее слаб, и разрушьте его линию прежде, чем он успеет отреагировать." #NT!
 STATIC_MODIFIER_NAME_nd_pru_oblique_order_defense: "Косая защита" #NT!
 STATIC_MODIFIER_DESC_nd_pru_oblique_order_defense: "Откажитесь от более слабого фланга и создайте непроницаемый фронт. Позвольте врагу изнурить себя против дисциплинированной огневой мощи." #NT!
 nd_pru_teutonic_heritage: "Тевтонское наследие" #NT!
 nd_pru_teutonic_heritage_desc: "Военные традиции и крепостное наследие Тевтонского ордена заложили основы военной культуры Пруссии." #NT!
 nd_pru_amber_trade: "Балтийская Янтарная Торговля" #NT!
 nd_pru_amber_trade_desc: "С тех пор как Тевтонские рыцари захватили контроль над Кенигсбергом, торговля янтарем стала монополией Пруссии. Золотой камень Балтики питает торговлю и ремесло." #NT!
 nd_pru_junker_estates: "Юнкер Эстейтс" #NT!
 nd_pru_junker_estates_desc: "Юнкерская земельная аристократия составляет костяк прусского государства. Их обширные поместья Риттергутер обеспечивают как налоговую базу, так и офицерский корпус, что делает Пруссию грозной силой." #NT!
 nd_pru_ordensburg_tradition: "Орденсбургская традиция" #NT!
 nd_pru_ordensburg_tradition_desc: "Массивные кирпичные крепости Тевтонского ордена (Мариенбург, Кенигсберг, Бальга) положили начало традиции военной архитектуры, которая на протяжении веков формировала прусскую оборонительную доктрину." #NT!
 nd_pru_arms_manufacture: "Прусское оружейное производство" #NT!
 nd_pru_arms_manufacture_desc: "Прусские чугунолитейные и оружейные мастерские снабжают растущую армию стандартизированным и надежным вооружением." #NT!
 nd_pru_ducal_consolidation: "Герцогская консолидация" #NT!
 nd_pru_ducal_consolidation_desc: "Преобразование Прусского герцогства из польского феодального владения в суверенное государство потребовало устойчивой административной консолидации и утверждения герцогской власти над противоречивыми местными интересами." #NT!
 nd_pru_hussar_tradition: "Тотенкопф Гусарская традиция" #NT!
 nd_pru_hussar_tradition_desc: "Фридрих Великий превратил гусаров из декоративной кавалерии в решающий род войск. Гусары Тотенкопфа, носившие на мирлитонах «мертвую голову», стали самой устрашающей легкой кавалерией в Европе." #NT!
 nd_pru_cameralism: "Камерализм" #NT!
 nd_pru_cameralism_desc: "Прусская наука государственных финансов, камерализм, рассматривала королевство как огромное поместье, которым нужно управлять эффективно и дальновидно, централизуя сбор доходов через Domänenkammern." #NT!
 nd_pru_officer_corps: "Прусский офицерский корпус" #NT!
 nd_pru_officer_corps_desc: "Система Кадеттенхауса с детства обучает сыновей-юнкеров военному делу, создавая профессиональный офицерский корпус, связанный долгом, честью и абсолютной верностью короне." #NT!
 nd_pru_cantonment_system: "Система расквартирования" #NT!
 nd_pru_cantonment_system_desc: "Кантонский регламент 1733 года разделил Пруссию на рекрутские кантоны, сделав каждого подданного мужского пола потенциальным солдатом. Это дало Пруссии армию, совершенно непропорциональную ее населению." #NT!
 nd_pru_oblique_order: "Тактика косого порядка" #NT!
 nd_pru_oblique_order_desc: "Совершенство Фридрихом Великим косого порядка, сосредоточение сил против самого слабого места врага и отказ от противоположного фланга произвело революцию в европейских войнах при Лойтене и Россбахе." #NT!
 nd_pru_general_staff: "Генеральный штаб" #NT!
 nd_pru_general_staff_desc: "Генеральный штаб Гроссера, возникший на пепелище поражения 1806 года, стал первым в мире постоянным органом военного планирования. Офицеры, отобранные по заслугам и обученные стратегическому мышлению в Кригской академии." #NT!
 nd_pru_feldjaeger_corps: "Фельдегерский корпус" #NT!
 nd_pru_feldjaeger_corps_desc: "Reitende Feldjaeger, конные разведчики и стрелки, служили наблюдателями и курьерами прусского генерального штаба, сочетая мобильность и меткость." #NT!
 nd_pru_allgemeines_landrecht: "Allgemeines Landrecht" #NT!
 nd_pru_allgemeines_landrecht_desc: "Общие государственные законы 1794 года объединили прусскую юриспруденцию в рамках единого рационального кодекса: абсолютная монархия, обязавшаяся соблюдать верховенство закона." #NT!
 a_nd_pru_totenkopf_hussar: "Тотенкопф Гусары" #NT!
 a_nd_pru_totenkopf_hussar_desc: "Элитная ударная кавалерия с эмблемой «Мёртвая голова». Быстрый, агрессивный и совершенно бесстрашный: террор вражеских флангов и линий снабжения." #NT!
 a_nd_pru_feldjaeger: "Фельдъегер" #NT!
 a_nd_pru_feldjaeger_desc: "Легкие стрелки обучались разведчикам и застрельщикам. Опытные стрелки, которые прикрывают продвижение армии и беспокоят вражеские формирования перед основной атакой." #NT!
 a_nd_pru_kantonist: "кантонист" #NT!
 a_nd_pru_kantonist_desc: "Солдаты-призывники, воспитанные через систему расквартирования. Крестьяне, обученные с юности, они служат своему полку на войне и своим юнкерским полям в мирное время." #NT!
 nd_pru_cadettenhaus: "Кадеттенхаус" #NT!
 nd_pru_cadettenhaus_desc: "Прусская военная академия обучала сыновей юнкерской знати тактике, строевой подготовке и военному делу с раннего возраста." #NT!
 nd_pru_cadettenhaus_upkeep: "Кадетская подготовка" #NT!
 nd_pru_cadettenhaus_upkeep_desc: "Оружие, руководства по строевой подготовке, книги по тактике, лошади для кавалерийских учений и униформа, потребляемые в неустанной подготовке будущих офицеров." #NT!
 nd_pru_domaenenkammer: "Доманенкамер" #NT!
 nd_pru_domaenenkammer_desc: "Налоговое управление Камералиста, которое управляет королевскими землями и централизует сбор налогов с прусской эффективностью." #NT!
 nd_pru_domaenenkammer_upkeep: "Административные товары" #NT!
 nd_pru_domaenenkammer_upkeep_desc: "Бумага для бухгалтерских книг и корреспонденции, тонкая ткань для официальных печатей и драпировок, а также мебель для счетных комнат, потребляемая бюрократией Камералистов, отслеживающей каждый талер, проходящий через королевство." #NT!
 nd_pru_amber_guild: "Янтарная гильдия" #NT!
 nd_pru_amber_guild_desc: "Зал гильдии, где мастера перерабатывают необработанный балтийский янтарь в предметы роскоши, ювелирные изделия и предметы декора: традиция, восходящая к монополии Тевтонского ордена на Кенигсберг." #NT!
 nd_pru_amber_workshop: "Обработка янтаря" #NT!
 nd_pru_amber_workshop_desc: "Мастера ограняют, полируют и вставляют балтийский янтарь в изысканные ювелирные и декоративные изделия, которые ценятся во всей Европе." #NT!
 nd_pru_arms_foundry: "Оружейный литейный завод" #NT!
 nd_pru_arms_foundry_desc: "Прусская оружейная мастерская, производящая стандартизированные мушкеты, штыки и боеприпасы для растущей армии." #NT!
 nd_pru_iron_foundry: "Выплавка железа" #NT!
 nd_pru_iron_foundry_desc: "Прусские чугунолитейные заводы плавили руду и ковали стандартные мушкеты, штыки и снаряжение для растущей армии." #NT!
 levy_nd_pru_kantonist: "Кантонист Леви" #NT!
 levy_nd_pru_kantonist_desc: "Призывники системы расквартирования набираются из назначенных призывных округов и служат под началом юнкерских офицеров своих поместий." #NT!
 nd_pru_formed_tt: "была образована Пруссия." #NT!
 nd_pru_path_a_tt: "Выбрал Железное Королевство" #NT!
 nd_pru_path_b_tt: "Выберите Просветленное состояние" #NT!
 nd_pru_destiny: "Прусская судьба" #NT!
 nd_pru_destiny_desc: "Пруссия была выкована. Теперь она должна найти свое место среди великих держав Европы. Сохраняйте стабильность, прокладывая свой курс." #NT!
 nd_pru_dest_schlesien: "Силезское завоевание" #NT!
 nd_pru_dest_schlesien_desc: "Захватить богатую провинцию Силезию у Габсбургов. Контроль над Вроцлавом и его промышленностью превратит Пруссию из незначительного королевства в настоящую военную державу. Требуется 30 000 человек под ружьем." #NT!
 nd_pru_dest_krieg: "Фредерицианские войны" #NT!
 nd_pru_dest_krieg_desc: "Расширить владычество Пруссии над Саксонией и Померанией. Завоевание Дрездена и Штеттина защитит наши фланги и продемонстрирует, что Пруссия может удержать то, что она захватила, против всей Европы. Требуется 2000 золотых в казне." #NT!
 nd_pru_dest_koenig: "Наследие короля-солдата" #NT!
 nd_pru_dest_koenig_desc: "Завершите господство Северной Германии. Берлин, Магдебург и Ганновер должны попасть под контроль Пруссии. Имея 75 000 солдат и непревзойденный престиж, Пруссия станет главной военной державой континента." #NT!
 nd_pru_dest_pietismus: "Пиетистские школы" #NT!
 nd_pru_dest_pietismus_desc: "Образовательная революция Августа Германа Франке в Галле показала, чего может достичь рациональное управление. Захватите Галле и используйте банковское учреждение, чтобы заложить экономические основы просвещенного государства." #NT!
 nd_pru_dest_kameralist: "Модель камералиста" #NT!
 nd_pru_dest_kameralist_desc: "Создайте государство, которое будет работать как хорошо смазанная машина. Развивайте общую инфраструктуру на сумму 500, накопите 2000 золотых и обеспечьте торговлю книгами на рынке капитала, чтобы подпитывать прусскую бюрократию." #NT!
 nd_pru_dest_aufklaerung: "Ауфкларунг" #NT!
 nd_pru_dest_aufklaerung_desc: "Сделайте Пруссию интеллектуальной столицей Европы. Захватите Лейпциг (издательское сердце континента), достигните 1000 общего развития, добейтесь высочайшего престижа и примите Просвещение." #NT!
 nd_pru.6.t: "Прусская судьба" #NT!
 nd_pru.6.d: "Прусское государство стоит на перепутье. Позади нас лежат болота Бранденбурга и разрушенные замки Тевтонского ордена. Перед нами простирается будущее нации, которая уже бросила вызов всему, просто существуя. Королевство, построенное на песке, окруженное врагами со всех сторон, без естественных границ и с небольшим количеством ресурсов, выходящих за рамки дисциплины его народа.\n\nТем не менее, именно эти невзгоды сформировали прусский характер. Мы не можем позволить себе роскошь самоуспокоенности. Каждое поколение должно заново зарабатывать то, что построило предыдущее. Вопрос не в том, будет ли Пруссия действовать, а в том, в каком направлении мы пойдем." #NT!
 nd_pru.6.a: "Пруссия выстоит." #NT!
 nd_pru.7.t: "Похищение Силезии" #NT!
 nd_pru.7.d: "Когда молодой король взошел на трон и узнал, что император Габсбургов умер, оставив в наследство только дочь, он увидел возможность, которую история предлагает, возможно, раз в столетие. Без объявления войны, без дипломатического предлога прусские колонны вошли в Силезию, одну из самых богатых провинций Центральной Европы с ее льняными мануфактурами, железными рудниками и многочисленным населением.\n\nЗахват был рассчитанной авантюрой высочайшего уровня. Каждая великая держава Европы выступила бы против нас. Но Силезия удваивает наше население, утраивает нашу промышленность и превращает Пруссию из диковинки в соперника. Завоевание завершено. Теперь мы должны его удержать." #NT!
 nd_pru.7.a: "Силезия — это Пруссия." #NT!
 nd_pru.8.t: "Семилетняя война" #NT!
 nd_pru.8.d: "Пруссия пережила этот кошмар. Окруженное одновременно Францией, Австрией, Россией, Швецией и Саксонией (численное превосходство в пять раз на каждом театре военных действий), королевство семь лет сражалось на грани полного уничтожения. При Россбахе, Лейтене, Цорндорфе прусское оружие одержало победу благодаря скорости, дисциплине и явному отказу признать поражение.\n\nВойна опустошила наши земли, но доказала нашу храбрость. Каждый двор в Европе теперь относится к Пруссии как к великой державе. Как нам извлечь выгоду из этого выживания?" #NT!
 nd_pru.8.a: "Используйте наше преимущество. Перехватите инициативу." #NT!
 nd_pru.8.b: "Объединить и укрепить то, что мы держим." #NT!
 nd_pru.9.t: "Мастер Северной Германии" #NT!
 nd_pru.9.d: "Работа поколений завершена. От Кенигсберга до Рейна, от Балтики до Гарца власть Пруссии простирается по всей территории Северной Германии. Берлин превратился из провинциального гарнизонного города в одну из величайших столиц Европы. Магдебург, сильнейшая крепость на Эльбе, охраняет наше сердце. Ганновер, когда-то резиденция конкурирующего электората, теперь подчиняется нашей короне.\n\nПруссия командует самой большой и лучшей армией на континенте. Вопрос, стоящий перед нами сейчас, заключается в том, как мы будем использовать эту беспрецедентную силу." #NT!
 nd_pru.9.a: "Тотальная мобилизация. Каждый ресурс служит армии." #NT!
 nd_pru.9.b: "Прусская гегемония говорит сама за себя." #NT!
 nd_pru.10.t: "Фонды Франке" #NT!
 nd_pru.10.d: "В университетском городе Галле богослов-пиетист Август Герман Франке построил нечто беспрецедентное: целый образовательный комплекс, включающий детский дом, школы для бедных, аптеку, типографию и учительскую семинарию. Франкские фонды демонстрируют, что систематические инвестиции в человеческий капитал приносят прибыль, с которой не может сравниться простое казначейство.\n\nМетоды Франке (практическое образование, всеобщая грамотность, рациональная учебная программа) привлекли внимание по всей Европе. Они представляют собой семя чего-то большего: государства, которое черпает свою силу не из солдат, а из качеств своих граждан." #NT!
 nd_pru.10.a: "Разум – основа государства." #NT!
 nd_pru.11.t: "Камералистская революция" #NT!
 nd_pru.11.d: "Прусская модель управления превратилась в науку. Камералисты (государственные экономисты, получившие образование в Галле и Франкфурте-на-Одере) рассматривают королевство как единое огромное поместье, которым нужно управлять с точностью. Каждый лес, шахта, мануфактура и таможня инвентаризируются, облагаются налогом и оптимизируются.\n\nРезультатом является состояние поразительной эффективности. Пруссия собирает больше доходов на душу населения, чем Франция, строит больше дорог на квадратную милю, чем Англия, и дает образование большему количеству детей на приход, чем любое королевство в Европе. Две школы мысли конкурируют за влияние." #NT!
 nd_pru.11.a: "Государство должно строить. Инвестируйте в инфраструктуру." #NT!
 nd_pru.11.b: "Знания – это богатство. Инвестируйте в умы." #NT!
 nd_pru.12.t: "Триумфальное торжество" #NT!
 nd_pru.12.d: "Лейпциг, издательская столица Европы, теперь действует в соответствии с прусским законодательством. Его книжные ярмарки распространяют идеи Канта, Лессинга и Моисея Мендельсона по всему континенту. Прусские университеты лидируют в мире в области философии, теологии и естественных наук. Allgemeines Landrecht кодифицировала наиболее всеобъемлющую правовую систему в Европе.\n\nВидение Фредерика просвещенного государства было реализовано сверх всего, что он мог себе представить. Пруссией восхищаются не размеры ее армии, а качество управления, терпимость общества и блестящие мыслители. Два видения просвещенного управления сегодня конкурируют за будущее." #NT!
 nd_pru.12.a: "Просвещенный абсолютизм. Реформа сверху." #NT!
 nd_pru.12.b: "Конституционные принципы. Реформа через закон." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_krieg_rapid: "Доктрина быстрого завоевания" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_krieg_rapid: "Нанесите удар прежде, чем враг сможет подготовиться. Быстрые агрессивные войны захватывают территорию быстрее, чем коалиции могут сформироваться против нас, ценой дипломатического авторитета." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_krieg_iron: "Железная Консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_krieg_iron: "Укрепляйте каждое завоевание, подавляйте каждое восстание и создайте армию, которой ни один альянс не посмеет бросить вызов." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_koenig_mobil: "Тотальная мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_koenig_mobil: "Каждый ресурс королевства служит военной машине. Сырье поступает в литейные заводы и арсеналы, а население принимает на себя бремя военного превосходства, даже ценой судебных расходов." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_koenig_hegemon: "Прусская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_koenig_hegemon: "Коронованный орел Пруссии вызывает всеобщее уважение. Законная власть, культурное влияние и богатые поместья делают королевство арбитром в делах Центральной Европы." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_kamer_mercant: "Меркантилистская эффективность" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_kamer_mercant: "Государство Камералист направляет инвестиции в инфраструктуру и промышленность, сокращая затраты на строительство, увеличивая производство и расширяя возможности прусских купцов." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_kamer_wissen: "Виссенсгезельшафт" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_kamer_wissen: "Общество, организованное вокруг знаний. Прусские университеты, шпионские сети и дипломатические каналы распространяют влияние и собирают разведданные с непревзойденной эффективностью." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_aufkl_absolut: "Просвещенный абсолютизм" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_aufkl_absolut: "Король-философ одинаково правит всеми своими подданными. Религиозная толерантность, культурная интеграция и принятие разнообразия укрепляют государство изнутри." #NT!
 STATIC_MODIFIER_NAME_nd_pru_dest_aufkl_verfass: "Verfassungsstaat" #NT!
 STATIC_MODIFIER_DESC_nd_pru_dest_aufkl_verfass: "Конституционное государство, управляемое законом, а не королевской прихотью. Рост населения процветает при стабильных институтах, а финансовая реформа снижает стоимость войны и долга." #NT!
 nd_pru_kriegsakademie: "Кригсакадемия" #NT!
 nd_pru_kriegsakademie_desc: "Прусский военный колледж, преемник Кригской академии Шарнхорста, обучает офицеров искусству командования посредством тщательного изучения стратегии, тактики и военной истории." #NT!
 nd_pru_kriegsakademie_upkeep: "Операции военного колледжа" #NT!
 nd_pru_kriegsakademie_upkeep_desc: "Оружие для учений, книги по стратегии, бумаги для военных планов и лошади для кавалерийских учений, потребляемые при обучении военной элиты Пруссии." #NT!
 nd_pru_universitat: "Университет" #NT!
 nd_pru_universitat_desc: "Прусский исследовательский университет в традициях Гумбольдта, объединяющий преподавание и исследования. Его факультеты расширяют знания в области философии, естествознания и права." #NT!
 nd_pru_universitat_upkeep: "Деятельность университета" #NT!
 nd_pru_universitat_upkeep_desc: "Книги для библиотеки, бумага для научных публикаций, стекло для лабораторного оборудования и мебель для лекционных залов, потребляемые стремлением к знаниям." #NT!
 pru_generaldirektorium_bureaucracy: "Генеральная директория" #NT!
 pru_generaldirektorium_bureaucracy_desc: "Главное высшее управление финансов, войны и владений, созданное Фридрихом Вильгельмом I 20 декабря 1722 года и действующее с 1723 года. Оно объединило конкурирующие Генеральное финансовое управление и Генеральный военный комиссариат в единый коллегиальный орган под председательством самого короля с пятью вице-президентами и четырнадцатью советниками, выбранными по опыту, а не по рождению. Его провинциальные Kriegs- und Domaenenkammern обошли благородную Staende Юнкертума и привязали финансовую, военную и внутреннюю администрацию непосредственно к трону, удвоив доходы короны в период с 1715 по 1740 год и создав абсолютистский аппарат, который поддерживал каждую последующую кампанию Гогенцоллернов." #NT!
 pru_kantonsystem_bureaucracy: "Кантонсистема" #NT!
 pru_kantonsystem_bureaucracy_desc: "Кантональное постановление о наборе персонала 1733 года, согласно которому Фридрих Вильгельм I разделил королевство на географически определенные кантоны, каждый из которых был привязан к определенному пехотному полку. Крепких крестьянских сыновей зачисляли в подростковом возрасте и каждую весну призывали на двухмесячное обучение, возвращаясь на поля вне сезона предвыборной кампании; Таким образом, система поддерживала пропорционально самую большую армию в Европе, не нанося ущерба аграрной базе. Дворяне, городские горожане, только сыновья фермеров, иностранцы и ценные ремесленники были безоговорочно освобождены от налога. Бремя воинской повинности легло на крестьянство восточных губерний, все крепче привязывая его к поместьям своих господ." #NT!
 pru_junker_corps_bureaucracy: "Юнкерский офицерский корпус" #NT!
 pru_junker_corps_bureaucracy_desc: "Негласный союз между короной Гогенцоллернов и юнкерским помещиком восточно-Эльбской Пруссии, в рамках которого землевладельческое дворянство поставляло офицерские кадры армии и высшие должности государственной службы в обмен на политическую поддержку и неоспоримую власть над своим Риттергутером. Младшие сыновья великих кланов (Бисмарк, Шверин, Йорк, Клейст) сделали свою карьеру в полках, а не в поместьях. Бюргеров и простолюдинов систематически лишали комиссий, но монополия юнкера создала дисциплинированный и однородный класс офицеров, с которым не мог сравниться ни один европейский конкурент." #NT!
 pru_allgemeines_landrecht_bureaucracy: "Allgemeines Landrecht" #NT!
 pru_allgemeines_landrecht_bureaucracy_desc: "Общие государственные законы для прусских государств, составленные при Фридрихе II Карлом Готлибом Сварецем и Эрнстом Фердинандом Кляйном и обнародованные 5 февраля 1794 года. Они насчитывали около семнадцати тысяч статей, которые налагали единообразный рациональный закон на каждую прусскую провинцию, кодифицируя гражданские, уголовные, семейные и административные законы в едином сборнике и связывая даже короля его положениями: поразительная уступка абсолютной монархии верховенству закона. Сохранение Staendegesellschaft и восточно-эльбского крепостного права отражало его переходный характер; тем не менее Ландрехт управлял Пруссией до принятия Имперского гражданского кодекса 1900 года." #NT!
 pru_domaenenkammern_bureaucracy: "Домаененкаммерн" #NT!
 pru_domaenenkammern_bureaucracy_desc: "Провинциальные Kriegs- und Domaenenkammern, возглавляемые президентом палаты и укомплектованные наемными советниками, обученными камералистским наукам. Они управляли королевскими владениями, сдавали коронные земли в аренду по коротким контрактам, основанным на производительности, и контролировали сбор налогов в городах через подчиненных Стойеррате. Заменив переговоры благородных ландштанде профессиональными специалистами в области финансов, Палаты получали доходы с дисциплиной, не имеющей себе равных в Европе; наемный государственный служащий континентальной традиции девятнадцатого века является их прямым потомком." #NT!
 pru_grosser_generalstab_bureaucracy: "Генеральный штаб Гроссера" #NT!
 pru_grosser_generalstab_bureaucracy_desc: "Большой генеральный штаб, организованный после катастрофы Йены-Ауэрштедта в 1806 году Шарнхорстом, Гнейзенау и Комиссией по военной реорганизации и официально оформленный в 1814 году. Его офицеры постоянно изучали планы мобилизации, готовили оперативные карты всех возможных театров военных действий и отрабатывали доктрину Auftragstaktik, в которой подчиненный выполняет намерение командира, а не ждет явных приказов. Повышение по службе осуществлялось путем конкурсных экзаменов и демонстрации компетентности, а не по рождению: упрек юнкерскому офицерскому корпусу, который действовал параллельно с ним до конца века, и модель, которую в конечном итоге скопировала каждая современная армия." #NT!
 pru_kriegsakademie_bureaucracy: "Кригсакадемия" #NT!
 pru_kriegsakademie_bureaucracy_desc: "Allgemeine Kriegsschule, основанная в Берлине Герхардом фон Шарнхорстом 15 октября 1810 года как один из трех колледжей, предназначенных для подготовки профессиональных кадров штабных офицеров. Трехлетнее изучение математики, физики, военной истории, прикладной тактики и штабных поездок было обязательным условием для назначения в Генеральный штаб Гроссера. Карл фон Клаузевиц учился в его предшественнике под руководством самого Шарнхорста; Гельмут фон Мольтке Старший преподавал там в 1820-х годах. Выпускники Академии (в основном выходцы из недворянского происхождения) составили интеллектуальное ядро ​​прусской, а затем и немецкой армии." #NT!
 AUTO_MODIFIER_NAME_nd_pru_bureaucracy_authority: "Гогенцоллернская бюрократия" #NT!
 AUTO_MODIFIER_DESC_nd_pru_bureaucracy_authority: "Провозглашение Прусского королевства привело к зрелости институционального аппарата королевства: Генеральная директория руководит финансами и войной, провинциальный Каммерн взимает налоги короля, юнкерский оруженосец командует его полками, а кантональное регулирование вербует его крестьян. На этой финансово-военной основе своеобразные государственные институты Пруссии начинают принимать свою прочную форму." #NT!
