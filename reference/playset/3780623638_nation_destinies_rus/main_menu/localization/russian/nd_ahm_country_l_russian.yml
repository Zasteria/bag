 AHM: "Королевство Ахом" #NT!
 AHM_ADJ: "Ахом" #NT!
 AHM_f: "Королевство Ахом" #NT!
 AHM_f_desc: "Восстановите мандат Сваргадео над долиной Брахмапутры. Шесть столетий правления Тай-Ахома удерживали этот уголок Южной Азии от всех волн захватчиков, семнадцать раз отразив Моголов и связав холмы, долины и реки хрониками двора Буранджи, барщинной системой пайка и религией, которая вплела тайский анимизм в преданность шиваитам и вайшнавам. Непокоренное королевство Хараидео возрождается." #NT!
