 AUTO_MODIFIER_NAME_nd_lxa_bureaucracy_authority: "Сао и Сенабоди" #NT!
 AUTO_MODIFIER_DESC_nd_lxa_bureaucracy_authority: "Двойная административная традиция Лан Ксанга (главный король Цао с его советом Сенабоди и Сангха-Раджа с королевским ритуальным порядком мыанг) обеспечивает основу для двух постоянных бюрократий, а столица предоставляет третью." #NT!
