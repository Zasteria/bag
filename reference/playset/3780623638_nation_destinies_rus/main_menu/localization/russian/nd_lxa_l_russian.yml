l_russian:
 STATIC_MODIFIER_NAME_nd_lxa_million_elephants: "Миллион слонов" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_million_elephants: "Боевые слоны Лансанга – это больше, чем просто вьючные животные. Они — живое воплощение королевской власти, каждый — крепость из плоти и слоновой кости, способная переломить ход битвы. Королевство, которое командует миллионом слонов, внушает страх всем, кто ему противостоит." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_white_parasol: "Белый зонтик" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_white_parasol: "Под белым зонтиком дхармы королевство обретает свою истинную силу не в бряцании оружия, а в мудрости сангхи, красоте ват и гармонии людей, объединенных верой. Зонтик укрывает всех, кто ищет его тень." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_defender_of_the_realm: "Защитник королевства" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_defender_of_the_realm: "Подобно Сеттатирату перед бирманским войском, королевство стоит решительно. Каждый горный перевал становится смертельной ловушкой, каждая тропа в джунглях — ловушкой для захватчиков." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_temple_builder: "Строитель храма" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_temple_builder: "Следуя традициям Сеттатирата, который воздвиг Ват Сиенг Тонг и Фатхат Луанг, королевство направляет свою энергию на возведение памятников, которые переживут любого завоевателя." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_strict_law: "Строгий закон" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_strict_law: "Следуя примеру Суриньи Вонгсы, королевство соблюдает свои законы с непоколебимой точностью. Даже собственная семья короля не стоит выше справедливости: порядок проистекает из последовательной власти." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_open_borders: "Открытые границы" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_open_borders: "Золотой век Суринья Вонгса доказывает, что процветание приходит, когда мы приветствуем мир. Голландские купцы, китайские торговцы и ремесленники со всего региона приносят свои навыки и свое золото ко двору Вьентьяна." #NT!
 nd_lxa.1.t: "Страна миллиона слонов" #NT!
 nd_lxa.1.d: "Лаосские земли воссоединяются под единой короной. От туманного нагорья Муанг Суа до широких равнин плато Корат — древние княжества признали единого государя. Река Меконг, которая всегда была линией жизни лаосского народа, теперь протекает через одно королевство.\n\nФа Нгум основал это царство с благословения кхмерского оружия и буддийской дхармы, назвав его Лан Ксанг Хом Као: Земля миллиона слонов и Белого зонтика. Слоны символизируют военную мощь, которая создала королевство; зонтик символизирует буддийскую веру, которая придает ему смысл.\n\nКакое наследие определит наше восстановленное королевство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lxa.1.a: "Пусть земля дрожит под нашими слонами!" #NT!
 nd_lxa.1.b: "Пусть Дхарма освещает наш путь." #NT!
 nd_lxa.2.t: "Сопротивление Сеттатирата" #NT!
 nd_lxa.2.d: "Король Бирмы Байиннаунг бросил свои огромные армии против Лан Ксанга, но наш король оказался на высоте. Сеттатират перенес столицу из почтенного Луанг Прабанга в стратегически важный Вьентьян, где широкий Меконг образует естественный ров. Когда пришли бирманцы, он отказался от открытого сражения с их превосходящими силами и вместо этого развязал войну с засадами в джунглях и выжженной землей.\n\nВ 1570 году, после отступления Байиннаунга, Сеттахират контратаковал, захватив более 30 000 пленных и 100 боевых слонов из бегущих бирманских колонн. Но король также является строителем: Ват Сиенг Тонг в Луангпрабанге и великая ступа Фатхат Луанг во Вьентьяне служат свидетельством его двойственной природы.\n\nЧтим ли мы Сеттатирата как воина или как строителя?" #NT!
 nd_lxa.2.a: "Джунгли – наша крепость. Пусть никто не пройдет!" #NT!
 nd_lxa.2.b: "Наши храмы переживут любую армию." #NT!
 nd_lxa.3.t: "Золотой век Суринья Вонгса" #NT!
 nd_lxa.3.d: "В течение пятидесяти семи лет король Суринья Вонгса твердой рукой правил Лан Ксангом. Там, где его предшественники столкнулись с вторжением и гражданской войной, Вонгса добился чего-то выдающегося: прочного мира с Сиамом и Вьетнамом благодаря терпеливой дипломатии и прочным границам.\n\nВ 1641 году голландская торговая экспедиция под командованием Геррита ван Вюйстхоффа прошла по Меконгу от Камбоджи до Вьентьяна, удивляясь найденным богатствам. Лан Ксанг экспортирует шелк, золото, слоновую кость, оленьи шкуры, кардамон и бензоиновую смолу на такие отдаленные рынки, как Китай и Япония.\n\nНо Вонгса также известен как суровый законодатель. Когда его собственный сын был признан виновным в прелюбодеянии, король вместо того, чтобы предоставить исключение, казнил его. Его законы суровы, но они применяются ко всем одинаково: и к дворянам, и к крестьянам.\n\nКак нам построить этот золотой век?" #NT!
 nd_lxa.3.a: "Закон должен быть железным: никаких исключений." #NT!
 nd_lxa.3.b: "Откройте наши двери шире миру." #NT!
 nd_lxa.4.t: "Прибытие Пхра Банга" #NT!
 nd_lxa.4.d: "В наше королевство прибыло священное изображение Будды: Пхра Банг, который, как говорят, был отлит в Шри-Ланке и пронесен через дворы кхмеров, прежде чем нашел свой дом среди лаосского народа. Изготовленный из сплава золота, серебра и бронзы, Пхра Банг стоит в жесте рассеивания страха, его ладони развернуты наружу в благословлении.\n\nКороль Висунарат объявил его палладием королевства. Там, где находится Пхра Банг, находится духовное сердце Лан Ксанга. Сам город Луангпхабанг получил свое название от этого священного изображения: Луанг означает «великий», а Прабанг — Будда, которого он укрывает.\n\nМонахи и паломники уже начали путешествовать со всего королевства, чтобы отдать дань уважения. Пхра Банг – это больше, чем просто религиозный артефакт; это символ того, что дхарма выбрала Лан Ксанг своим домом." #NT!
 nd_lxa.4.a: "Пусть Пхра Банг навсегда благословит наше королевство." #NT!
 nd_lxa_elephant_warfare: "Слоновья война" #NT!
 nd_lxa_elephant_warfare_desc: "Традиция боевых слонов, давшая Лансангу свое название: Земля миллиона слонов." #NT!
 nd_lxa_theravada_sangha: "Тхеравада Сангха" #NT!
 nd_lxa_theravada_sangha_desc: "Буддийский монашеский орден, составляющий духовную и образовательную основу лаосского общества." #NT!
 nd_lxa_sticky_rice_tradition: "Традиция липкого риса" #NT!
 nd_lxa_sticky_rice_tradition_desc: "Выращивание клейкого риса, основного продукта питания, определяющего лаосскую кухню и общественную жизнь." #NT!
 nd_lxa_fa_ngum_legacy: "Наследие Фа Нгума" #NT!
 nd_lxa_fa_ngum_legacy_desc: "Военные традиции, заложенные Фа Нгумом во время завоевания и объединения лаосских княжеств в 1353 году." #NT!
 nd_lxa_khmer_heritage: "Кхмерское наследие" #NT!
 nd_lxa_khmer_heritage_desc: "Культурные и дипломатические связи с кхмерским двором, где Фа Нгум вырос в изгнании и из которого он черпал буддийские традиции, которые сформировали Лан Ксанг." #NT!
 nd_lxa_silk_weaving: "Традиция шелководства" #NT!
 nd_lxa_silk_weaving_desc: "Искусство лаосского ткачества шелка передавалось из поколения в поколение и производило текстиль, ценимый во всей Юго-Восточной Азии." #NT!
 nd_lxa_mekong_trade: "Торговля на реке Меконг" #NT!
 nd_lxa_mekong_trade_desc: "Развитие торговых сетей вдоль реки Меконг, экономической артерии Лансанга." #NT!
 nd_lxa_river_fleet: "Речной флот" #NT!
 nd_lxa_river_fleet_desc: "Патрульные корабли, предназначенные для Меконга и его притоков, обеспечивающие безопасность торговых путей и распространение силы на водных путях." #NT!
 nd_lxa_forest_trade: "Торговля лесной продукцией" #NT!
 nd_lxa_forest_trade_desc: "Вывоз ценных лесных продуктов (бензоиновой смолы, лака, лиственных пород) из густых лесов высокогорья Лаоса." #NT!
 nd_lxa_samsenthai_reforms: "Реформы Самсентая" #NT!
 nd_lxa_samsenthai_reforms_desc: "Торговые и административные реформы короля Самсентая, сына Фа Нгума, которые превратили Лан Ксанг из государства-завоевателя в процветающее торговое королевство." #NT!
 nd_lxa_phra_bang: "Пхра Банг Палладиум" #NT!
 nd_lxa_phra_bang_desc: "Священное изображение Будды, служащее палладием Лаосского королевства, символом божественного благоволения и королевской законности." #NT!
 nd_lxa_elephant_corps_tradition: "Слоновий корпус" #NT!
 nd_lxa_elephant_corps_tradition_desc: "Формализованный корпус войны слонов, который наводил страх на армию Лан Ксанга по всей материковой части Юго-Восточной Азии." #NT!
 nd_lxa_pha_that_luang: "Фа Тхат Луанг" #NT!
 nd_lxa_pha_that_luang_desc: "Великая золотая ступа Вьентьяна, самый священный памятник Лаосского королевства и маяк буддизма Тхеравады." #NT!
 nd_lxa_ivory_craft: "Ремесло из слоновой кости" #NT!
 nd_lxa_ivory_craft_desc: "Традиция резьбы по слоновой кости, основанная на использовании огромных стад слонов Лансанга для производства предметов роскоши на экспорт." #NT!
 nd_lxa_vientiane_capital: "Вьентьян как столица" #NT!
 nd_lxa_vientiane_capital_desc: "Создание Вьентьяна постоянной столицей Лан Ксанга королем Сеттатиратом, выбранным из-за его стратегического положения на Меконге." #NT!
 nd_lxa_burmese_resistance: "Сопротивление против Бирмы" #NT!
 nd_lxa_burmese_resistance_desc: "Партизанская тактика и стратегическое отступление, которые позволили Лан Ксангу выжить против гораздо более крупной Бирманской Империи." #NT!
 nd_lxa_river_warfare: "Речная война" #NT!
 nd_lxa_river_warfare_desc: "Специализированная пехота, обученная сражаться в джунглях и реках, защищая торговые пути Меконга от налетчиков и захватчиков." #NT!
 nd_lxa_lacquerware: "Лаковая промышленность" #NT!
 nd_lxa_lacquerware_desc: "Производство изысканных лаковых изделий из лаковой смолы, добываемой в лесу, — ценное роскошное ремесло лаосских ремесленных традиций." #NT!
 nd_lxa_haw_kham: "Дворец Хо Кхам" #NT!
 nd_lxa_haw_kham_desc: "Традиция королевского дворца Лансанг, где лаосская монархия осуществляет свою власть и принимает иностранные посольства." #NT!
 nd_lxa_photisarath_reforms: "Реформы Фотисарата" #NT!
 nd_lxa_photisarath_reforms_desc: "Провозглашение королем Фотисаратхом буддизма Тхеравады государственной религией в 1527 году, объединившее духовную жизнь королевства." #NT!
 nd_lxa_deer_skin_trade: "Торговля оленьими шкурами" #NT!
 nd_lxa_deer_skin_trade_desc: "Экспорт оленьих шкур, пользовавшихся большим спросом в Китае и Японии, направлялся через торговые посты Аюттхая на отдаленные рынки." #NT!
 nd_lxa_firearms_adoption: "Принятие огнестрельного оружия" #NT!
 nd_lxa_firearms_adoption_desc: "Внедрение огнестрельного оружия с фитильными замками благодаря контактам с европейскими и азиатскими торговцами во время золотого века Суринья Вонгса." #NT!
 nd_lxa_golden_age: "Золотой век Лан Ксанга" #NT!
 nd_lxa_golden_age_desc: "Пятьдесят семь лет правления Суриньи Вонгсы — период беспрецедентного мира, процветания и культурного расцвета." #NT!
 nd_lxa_european_contact: "Европейский контакт" #NT!
 nd_lxa_european_contact_desc: "Прибытие голландских торговцев ЛОС в 1641 году впервые открыло Лан Ксан для европейской торговли и знаний." #NT!
 nd_lxa_law_code: "Кодекс законов Суринья Вонгса" #NT!
 nd_lxa_law_code_desc: "Строгая, но эгалитарная правовая система, установленная Суринья Вонгса, без исключения распространялась как на дворян, так и на простых людей." #NT!
 nd_lxa_manuscript_tradition: "Рукописная традиция" #NT!
 nd_lxa_manuscript_tradition_desc: "Буддийская традиция копирования священных текстов на рукописи из пальмовых листьев, сохранение и распространение палийского учения по всему королевству." #NT!
 nd_lxa_cultural_resilience: "Лаосская культурная устойчивость" #NT!
 nd_lxa_cultural_resilience_desc: "Сохранение лаосской культурной идентичности на протяжении столетий разделения и иностранного давления, связанное общим языком, верой и традициями." #NT!
 nd_lxa_mekong_mastery: "Мастерство Меконга" #NT!
 nd_lxa_mekong_mastery_desc: "Полное использование системы реки Меконг для транспорта, торговли и добычи ресурсов." #NT!
 nd_lxa_sangha_unity: "Единство Сангхи" #NT!
 nd_lxa_sangha_unity_desc: "Буддийская монашеская сеть, которая объединяет народ Лаоса, несмотря на политические границы, обеспечивая образование, социальную сплоченность и духовную преемственность." #NT!
 nd_lxa_reunification: "Стремление к воссоединению" #NT!
 nd_lxa_reunification_desc: "Непреходящая мечта восстановить границы королевства Фа Нгума, снова объединив все лаосскоязычные народы под единой короной." #NT!
 a_nd_lxa_war_elephant: "Боевой слон" #NT!
 a_nd_lxa_war_elephant_desc: "Боевые слоны, давшие имя Лан Ксангу. Эти бронированные гиганты служат мобильными крепостями на поле боя, сокрушая вражеские формирования своей массой, в то время как их погонщики метают дротики сверху." #NT!
 a_nd_lxa_elephant_corps: "Слоновий корпус" #NT!
 a_nd_lxa_elephant_corps_desc: "Формализованный корпус боевых слонов, обученный в рамках реформ Сеттатирата. Каждый слон несет хауда с обученными воинами, действующую как общевойсковая платформа разрушительной мощи." #NT!
 a_nd_lxa_mekong_guard: "Речная стража Меконга" #NT!
 a_nd_lxa_mekong_guard_desc: "Пехота тренировалась в коварных джунглях и при переправах через реку Меконг. Они преуспевают в ведении засадной войны и могут перемещаться по местности, которая остановила бы обычную армию." #NT!
 a_nd_lxa_matchlock_infantry: "Лаосская пехота с фитильными ружьями" #NT!
 a_nd_lxa_matchlock_infantry_desc: "Пехота, оснащенная фитильным огнестрельным оружием, приобретенным в результате торговых контактов с Европой и Азией во время золотого века Суринья Вонгса." #NT!
 n_nd_lxa_river_galley: "Река Лао Галера" #NT!
 n_nd_lxa_river_galley_desc: "Мелкосидящие галеры, предназначенные для реки Меконг и ее притоков. Быстрые и маневренные, они патрулируют водные пути королевства и защищают торговое движение." #NT!
 nd_lxa_wat: "Ват" #NT!
 nd_lxa_wat_desc: "Буддийский храмовый комплекс, служащий духовным и образовательным центром общины. Монахи учат чтению и письму, сохраняют рукописи и дают советы всем, кто их ищет." #NT!
 nd_lxa_silk_house: "Шелковый Ткацкий Дом" #NT!
 nd_lxa_silk_house_desc: "Мастерская, посвященная древнему лаосскому искусству ткачества шелка, позволяющему производить ткани необычайной красоты и ценности с использованием техник, передаваемых из поколения в поколение." #NT!
 nd_lxa_elephant_kraal: "Слон Крааль" #NT!
 nd_lxa_elephant_kraal_desc: "Королевский комплекс для отлова, дрессировки и содержания боевых слонов. Крааль – это одновременно военный объект и символ королевской власти." #NT!
 nd_lxa_mekong_trading_post: "Торговый пост Меконга" #NT!
 nd_lxa_mekong_trading_post_desc: "Склад и причал на берегу реки, где товары из горной местности Лаоса (шелк, слоновая кость, бензоин и оленьи шкуры) загружаются на лодки для перевозки по Меконгу на отдаленные рынки." #NT!
 nd_lxa_pha_that: "Ступа Фа Тат" #NT!
 nd_lxa_pha_that_desc: "Величественная буддийская ступа-реликварий, построенная в традициях Фатхат Луанга во Вьентьяне. Его золотая поверхность привлекает паломников и ремесленников со всего буддийского мира." #NT!
 nd_lxa_royal_palace: "Хау Кхам" #NT!
 nd_lxa_royal_palace_desc: "Королевский дворец лаосской монархии, из которого король отправляет правосудие и принимает иностранные посольства. Его богато украшенная архитектура отражает богатство и изысканность двора." #NT!
 nd_lxa_rice_paddy: "Райс Падди" #NT!
 nd_lxa_rice_paddy_desc: "Орошаемые рисовые поля, на которых выращивают клейкий рис, который является основой лаосской диеты и общественной жизни, питаемый муссонными дождями и речными водами бассейна Меконга." #NT!
 nd_lxa_forest_camp: "Лагерь лесного сбора" #NT!
 nd_lxa_forest_camp_desc: "Горный лагерь для сбора бензойной смолы, лака и других ценных лесных продуктов в густых лесах внутреннего Лаоса." #NT!
 nd_lxa_wat_maintenance: "Обслуживание храма" #NT!
 nd_lxa_wat_maintenance_desc: "Содержание храмового комплекса поддерживается свечами из пчелиного воска и воскурениями благовоний, горящими на алтаре." #NT!
 nd_lxa_silk_maintenance: "Шелковое Ткачество" #NT!
 nd_lxa_silk_maintenance_desc: "Шелк-сырец окрашивают и ткут изысканные ткани, которые ценятся во всей Юго-Восточной Азии." #NT!
 nd_lxa_kraal_maintenance: "Содержание Краала" #NT!
 nd_lxa_kraal_maintenance_desc: "Корм, древесина, кожаные упряжи и бронзовая фурнитура, необходимые для содержания тренировочного лагеря слонов и оснащения его боевых зверей." #NT!
 nd_lxa_trading_post_maintenance: "Содержание торгового поста" #NT!
 nd_lxa_trading_post_maintenance_desc: "Древесина для докового ремонта и керамика для судов-хранилищ." #NT!
 nd_lxa_stupa_maintenance: "Обслуживание Ступы" #NT!
 nd_lxa_stupa_maintenance_desc: "Сусальное серебро для позолоты и пчелиный воск для церемониальных подношений." #NT!
 nd_lxa_palace_maintenance: "Содержание дворца" #NT!
 nd_lxa_palace_maintenance_desc: "Древесина, серебро и изысканные ткани поддерживают королевский дворец, обставляют его залы и поддерживают великолепие, ожидаемое от лаосской монархии." #NT!
 nd_lxa_benzoin_processing: "Переработка бензоина" #NT!
 nd_lxa_benzoin_processing_desc: "Рабочие собирают бензоиновую смолу с высокогорных деревьев стиракса и перерабатывают ее с пчелиным воском в готовые благовония, которые ценятся в азиатских торговых сетях от Индии до Китая." #NT!
 nd_lxa_ivory_carving: "Резьба по Слоновой Кости" #NT!
 nd_lxa_ivory_carving_desc: "Опытные резчики обрабатывают слоновьи бивни предметами роскоши, религиозными предметами и дипломатическими подарками, используя прекрасные ручные инструменты." #NT!
 nd_lxa_lac_production: "Лак Продакшн" #NT!
 nd_lxa_lac_production_desc: "Добытую в лесу лаковую смолу перерабатывают с древесными подложками в изысканные лаковые изделия для ремесленной торговли королевства." #NT!
 nd_lxa_sticky_rice: "Выращивание клейкого риса" #NT!
 nd_lxa_sticky_rice_desc: "На орошаемых рисовых полях выращивают клейкий рис, используя труд животных и традиционные лаосские методы ведения сельского хозяйства, производя основное зерно, которое определяет лаосскую общественную жизнь." #NT!
 nd_lxa_manuscript_copying: "Копирование рукописи" #NT!
 nd_lxa_manuscript_copying_desc: "Монашеская традиция копирования палийских писаний на рукописи из пальмовых листьев, способствующая распространению буддийских знаний по всему королевству." #NT!
 nd_lxa_formed_tt: "Лан Ксанг был основан" #NT!
 nd_lxa_path_a_tt: "Выбрал миллион слонов" #NT!
 nd_lxa_path_b_tt: "Выбрал белый зонтик" #NT!
 nd_lxa_destiny: "Судьба Лан Ксанга" #NT!
 nd_lxa_destiny_desc: "Королевство восстановлено. Теперь его судьба должна быть выкована посредством грохота слонов или света дхармы." #NT!
 nd_lxa_dest_khorat: "Покорение Кората" #NT!
 nd_lxa_dest_khorat_desc: "Расширьте власть королевства над Шанским нагорьем. Муанг Кенгтунга должен признать превосходство Лан Ксанга дипломатическим или силовым путем." #NT!
 nd_lxa_dest_mekong_hegemony: "Меконгская гегемония" #NT!
 nd_lxa_dest_mekong_hegemony_desc: "Великие кхмерские храмы Ангкора и перекресток Меконга в Стунг-Тренге должны попасть под наш контроль. Река принадлежит Лан Ксангу от истока до моря." #NT!
 nd_lxa_dest_white_elephants: "Повелитель белых слонов" #NT!
 nd_lxa_dest_white_elephants_desc: "Только король, который командует и Пегу, и Аюттайей, может претендовать на владычество над всей материковой Юго-Восточной Азией. Пусть белые слоны склонятся перед нашим троном." #NT!
 nd_lxa_dest_sangha_heart: "Сердце Сангхи" #NT!
 nd_lxa_dest_sangha_heart_desc: "Пусть наше королевство станет бьющимся сердцем обучения Тхеравады. Имея устойчивое финансовое положение и торговлю слоновой костью, протекающую через наши рынки, мы можем построить монастыри, которые будут привлекать ученых со всего буддийского мира." #NT!
 nd_lxa_dest_silk_road: "Меконгский шелковый путь" #NT!
 nd_lxa_dest_silk_road_desc: "Шелк, слоновая кость, бензоин, оленьи шкуры: продукция наших лесов и ткацких станков должна достичь всех рынков Азии. Пусть Вьентьян станет перекрестком торговли через Меконг." #NT!
 nd_lxa_dest_light_theravada: "Свет Тхеравады" #NT!
 nd_lxa_dest_light_theravada_desc: "Дхарма будет излучаться из нашего королевства, как свет из золотой ступы. Благодаря обучению, процветанию и вере Лансанг становится духовным центром всех буддийских народов." #NT!
 nd_lxa.5.t: "Восстановленное Королевство" #NT!
 nd_lxa.5.d: "Древние границы Лансанга вновь объединены под единой короной. От высокогорья, где берет начало Меконг, до широкого плато Корат, Земля миллиона слонов снова стоит целой.\n\nНо восстановление — это только начало. Великие державы Юго-Восточной Азии (Бирма, Сиам, Вьетнам и Кхмеры) окружают наше царство. Лансанг всегда жил в тени более великих соседей, выживая благодаря хитрости, местности и устрашающей репутации наших боевых слонов.\n\nТеперь вопрос в том, останемся ли мы в этой тени или выйдем за ее пределы." #NT!
 nd_lxa.5.a: "Наша судьба ждет." #NT!
 nd_lxa.6.t: "Шанское нагорье покорено" #NT!
 nd_lxa.6.d: "Горная крепость Кенгтунг подчинилась власти Лансанга. Шан-муанги, давно привыкшие натравливать великие державы друг против друга, осознали, что Страна миллиона слонов больше не довольствуется тем, что остается в своих традиционных границах.\n\nНаш отряд слонов двигался через высокогорные перевалы с привычной легкостью, местность, которая могла бы сломить низинную армию, была всего лишь еще одним днем ​​марша для наших погонщиков. Шанцы видели приближающуюся колонну и знали, что сопротивление означает разрушение." #NT!
 nd_lxa.6.a: "Горная местность наша." #NT!
 nd_lxa.7.t: "Хозяева Меконга" #NT!
 nd_lxa.7.d: "Древний храмовый комплекс Ангкор-Ват, чудо кхмерского мира, теперь развевается под знаменем Лан Ксанга. Наши армии пронеслись вниз по Меконгу, захватив Стунг Тренг и установив контроль над всей судоходной длиной великой реки.\n\nКхмеры, которые когда-то приютили изгнанника Фа Нгума и дали ему армии для завоевания этих самых земель, теперь обнаруживают, что их позиции поменялись местами. Ученик превзошел учителя.\n\nЭту гегемонию можно укрепить через военное господство на реке или через систему данников, которая привязывает покоренные народы к нашему двору." #NT!
 nd_lxa.7.a: "Наши речные галеры будут патрулировать каждый участок." #NT!
 nd_lxa.7.b: "Пусть побежденные платят дань и соблюдают свои обычаи." #NT!
 nd_lxa.8.t: "Повелитель белых слонов" #NT!
 nd_lxa.8.d: "Пегу и Аютия, столицы Бирмы и Сиама, преклоняют колени перед троном Лан Ксанга. Ни один лаосский король никогда не достиг того, чего достигли мы: господства над всем материком Юго-Восточной Азии, от Иравади до дельты Меконга.\n\nБелые слоны, самые редкие из всех, были собраны со всех уголков королевства как символы всемирного суверенитета. В придворных традициях Юго-Восточной Азии владение белыми слонами является высшим признаком праведного короля, заслуги которого сияют по всему миру.\n\nКак нам управлять этим обширным царством?" #NT!
 nd_lxa.8.a: "Как повелители слонов: наши боевые звери исполняют нашу волю." #NT!
 nd_lxa.8.b: "Как универсальные монархи: наша империя выстоит." #NT!
 nd_lxa.9.t: "Сангха процветает" #NT!
 nd_lxa.9.d: "Монастыри Лан Ксанг стали известны во всем мире Тхеравады. Монахи приезжают из Цейлона и Бирмы, чтобы учиться в наших ватах, привлеченные качеством нашей палийской стипендии и щедрым покровительством короны.\n\nТорговля слонами, самая знаковая торговля нашего королевства, наполняет королевскую казну, финансируя строительство новых храмов и копирование священных рукописей. Банковские учреждения укоренились, что позволяет нам финансировать великие добрые дела." #NT!
 nd_lxa.9.a: "Дхарма становится сильнее с каждым днем." #NT!
 nd_lxa.10.t: "Меконгский шелковый путь" #NT!
 nd_lxa.10.d: "Вьентьян стал великим перекрестком бассейна Меконга. Шелк с наших ткацких станков, слоновая кость из наших лесов и бензоиновые благовония с наших высокогорьев стекают вниз по реке, встречая китайский фарфор, индийские ткани и европейские диковинки, текущие вверх по реке.\n\nГолландский купец ван Вюйстхофф, посетив нашу столицу, сообщил своему начальству, что богатство Лан Ксанга может соперничать с любым королевством на Востоке. Наши рынки изобилуют товарами со всех уголков Азии.\n\nБудем ли мы использовать свое преимущество за счет торговой экспансии или за счет развития наших отечественных ремесленных традиций?" #NT!
 nd_lxa.10.a: "Пусть наши купцы ходят далеко по Меконгу." #NT!
 nd_lxa.10.b: "Позвольте нашим мастерам совершенствовать свое мастерство дома." #NT!
 nd_lxa.11.t: "Свет Тхеравады" #NT!
 nd_lxa.11.d: "Великие монастыри Лан Ксанга стали ведущими центрами обучения Тхеравады во всей Азии. Наши рукописи на пальмовых листьях, скрупулезно переписанные поколениями монахов, сохраняют палийский канон в его чистейшей форме. Ученые из каждого буддийского королевства посылают своих самых способных учеников учиться в наши вихары.\n\nВ наше королевство прибыл печатный станок, и его первой продукцией являются не светские тексты, а сами священные писания, которые теперь размножаются в тысячу раз и рассылаются в качестве даров монастырям по всему буддийскому миру.\n\nЛан Ксанг стал тем, о чем мечтал Фа Нгум: не просто королевством, но маяком дхармы. Белый зонтик укрывает всех." #NT!
 nd_lxa.11.a: "Дхарма защищает тех, кто защищает ее." #NT!
 nd_lxa.11.b: "Наши ступы будут вечно вдохновлять верующих." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_mekong_dominance: "Доминирование Меконга" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_mekong_dominance: "Меконг принадлежит нам от истока до моря, и наши речные галеры навязывают нашу волю каждому судну, курсирующему по его водам." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_vassal_tribute: "Вассальная дань" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_vassal_tribute: "Побежденные народы платят дань и служат в наших войсках, будучи связаны с Лань Ксангом клятвой и обязательствами, а не прямой оккупацией." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_elephant_emperor: "Слон-Император" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_elephant_emperor: "Боевые слоны Лан Ксанга — лучшие во всей Азии, выращенные в королевских поместьях, закованные в бронзу и управляемые самыми опытными погонщиками в мире." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_mekong_imperium: "Меконгская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_mekong_imperium: "Огромная империя, простирающаяся через материковую часть Юго-Восточной Азии, объединенная рекой Меконг и престижем лаосской короны." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_river_merchants: "Речные торговцы" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_river_merchants: "Купцы Вьентьяна путешествуют вверх и вниз по Меконгу, их лодки, нагруженные шелком и слоновой костью, соединяют высокогорные леса с морем." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_craft_guilds: "Ремесленные гильдии" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_craft_guilds: "Гильдии ремесленников Лансанга объединились в могущественные организации, их ткачи шелка, лакировщики и резчики по слоновой кости производят товары, которые могут соперничать с любыми товарами в Азии." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_dharma_shield: "Щит Дхармы" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_dharma_shield: "Сангха защищает королевство так же надежно, как и любая армия. Наши монахи несут Дхарму во все уголки страны, объединяя людей верой." #NT!
 STATIC_MODIFIER_NAME_nd_lxa_dest_golden_stupa: "Золотая Ступа" #NT!
 STATIC_MODIFIER_DESC_nd_lxa_dest_golden_stupa: "Наши ступы, покрытые сусальным золотом и возвышающиеся над пологом джунглей, привлекают паломников и торговцев со всего буддийского мира, наполняя наше королевство преданностью и процветанием." #NT!
 nd_lxa_royal_elephant_compound: "Королевский слоновий комплекс" #NT!
 nd_lxa_royal_elephant_compound_desc: "Грандиозный королевский комплекс по разведению, дрессировке и оснащению боевых слонов в промышленных масштабах, производящий лучших боевых слонов во всей Юго-Восточной Азии." #NT!
 nd_lxa_great_vihara: "Великая Вихара" #NT!
 nd_lxa_great_vihara_desc: "Великолепный буддийский учебный зал и монастырский комплекс, главный центр палийской науки в мире Тхеравады, привлекающий монахов и паломников со всей Азии." #NT!
 nd_lxa_elephant_compound_maintenance: "Содержание слоновьего погоста" #NT!
 nd_lxa_elephant_compound_maintenance_desc: "Корма для скота, деревянные загоны и бронзовые доспехи поддерживают королевскую программу разведения слонов." #NT!
 nd_lxa_vihara_maintenance: "Содержание Вихара" #NT!
 nd_lxa_vihara_maintenance_desc: "Свечи из пчелиного воска, бумага для рукописей и благовония для медитации поддерживают научную и духовную деятельность великого монастыря." #NT!
  
  # ===== BUREAUCRACIES ===== 
 lxa_senabodi_bureaucracy: "Сенабоди" #NT!
 lxa_senabodi_bureaucracy_desc: "Высший совет старших министров (маха-сена и тао прайя), посредством которого верховный король Цао управлял Лансангом. Созданный при Самсентае (годы правления 1373–1416), Сенабоди представлял собой замкнутый круг, образованный горсткой крупных зданий суда; концентрация власти в руках аристократов делала центральное правительство грозным, пока совет оставался единым, но вызвала фракционное соперничество, которое раскололо королевство на Вьентьян, Луангпрабанг и Чампасак в 1707 году." #NT!
 lxa_mueang_long_bureaucracy: "Ритуальный центр Муанг-Лонг" #NT!
 lxa_mueang_long_bureaucracy_desc: "Священный королевский город как ритуально-политическое сердце королевства: Муанг Суа при Фа Нгуме, затем Вьенг Чан с 1560 года при Сеттатирате. Будда Пхра Банг (подарен кхмерским двором около 1359 г.) и с 1565 г. Изумрудный Будда Пхра Кео в Ват Пха Кео были палладией королевства. Годовой цикл Бун Пхра Вет, фестиваль ступы Тхат Луанг и королевский обряд пахоты объединили династию, сангху и столицу в единый ритуальный порядок, крах которого последовал за собственным королевством." #NT!
 lxa_sangha_raja_bureaucracy: "Иерархия Сангха-Раджа" #NT!
 lxa_sangha_raja_bureaucracy_desc: "Буддийская иерархия Тхеравады была официально оформлена Фа Нгумом и его кхмерской королевой Кео Каенгканья, а главой ордена стал назначенный королевской властью житель Сангха-Раджи в Ват Тхат Луанг. Сеть школ ват преподавала пали, доктрину и лаосскую письменность, создавая грамотный слой деревенских старост и писцов. Его расширение произошло за счет старых культов духов сатсана-пхи, оттолкнувших лесных кхму и горные народы, чье поклонение находилось за пределами досягаемости сангхи." #NT!
 lxa_khoa_aphai_bureaucracy: "Хоа-афай Вассальный договор" #NT!
 lxa_khoa_aphai_bureaucracy_desc: "Договор о дани, по которому великие вассальные мыанги сферы Лан Ксанг (Фуан в Сиенг Кхуанге, двенадцать кантонов Сипсончутай, Хуапхан, данники Кората) выплачивали Цао ежегодную дань хамконга серебром, лаком и тканями, сохраняя при этом свои наследственные чао-муанги и местные суды. Компакт расширил королевскую власть без прямого управления, но структурно разделил суверенитет с периферией, и эта хрупкость разрушилась под давлением Бирмы и Вьетнама после 1560 года." #NT!
 lxa_kha_lao_tribute_bureaucracy: "Дань возвышенности Кха-Лао" #NT!
 lxa_kha_lao_tribute_bureaucracy_desc: "Система добычи полезных ископаемых, с помощью которой купцы чао-муанга и долины Меконга получали ежегодную дань лесными товарами (кардамоном, бензоином, палочкой, орлиным деревом, оленьими шкурами, слоновой костью) от кхму, ксинг-мула и других горных народов, которых все вместе называли кха (слуга). Дань обеспечивала междугородную торговлю через Меконг с Аюттайей и Хюэ, одновременно закрепляя второсортный правовой статус горного населения, структурный недостаток, который неоднократно вызывал восстания в горах." #NT!
  
