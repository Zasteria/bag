l_russian:
  
  # ===== Variable tooltips ===== 
 nd_pon_formed_tt: "Провозглашена реставрация Понтийского моря." #NT!
 nd_pon_path_a_tt: "Выберите судьбу #bold Римской реставрации#! (Комненская реставрация)" #NT!
 nd_pon_path_b_tt: "Выбрал судьбу #bold Черноморского Содружества#! (Понтийская Республика)" #NT!
  
  # ===== Formation event nd_pon.1 ===== 
 nd_pon.1.t: "Наследник Понтийского берега" #NT!
 nd_pon.1.d: "От скального монастыря Сумела на горе Мела до серебряных жил Аргирии, от гавани Трапезунда до понтийско-греческих деревень предгорий Кавказа — понтийско-греческий мир собирается заново. В соборе Святой Софии в Трапезунде должен быть возведен на трон басилевс, наследник Алексиоса I Комнина и его понтийских потомков, которые владели этим уголком римского мира в течение 257 лет до осады Мехмеда в 1461 году.\n\nНо форма нового царства оспаривается. Придворный летописец Виссарион Трапезундский и митрополит Сумелский призывают к Комнинской реставрации: базилевс будет коронован в пурпуре, императорская литургия и хризобулла, олигархи-рудники Аргирии как сенаторский класс, королевство организовано как небольшая базилея. Торговые советы Трапезунда, Синопа и Керасунты призывают к созданию Понтийской республики: три городских триады в качестве конституционных партнеров согласно королевской хартии, автокефальная Понтийская православная церковь в качестве политического центра, басилевс в качестве primus inter pares, подтвержденный собраниями бюргеров.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_pon.1.a: "Комненская реставрация: базилея Понтийского побережья" #NT!
 nd_pon.1.b: "Понтийская республика: городско-торговое содружество" #NT!
  
  # ===== Formation timed modifiers ===== 
 STATIC_MODIFIER_NAME_nd_pon_komnenian_restoration: "Комненская реставрация" #NT!
 STATIC_MODIFIER_DESC_nd_pon_komnenian_restoration: "Базилевс восседает на пурпурном троне в соборе Святой Софии Трапезундского. Серебро Аргирии течет в императорский фиск, соблюдается позднеримский церемониал, хризобулл запечатывается фиолетовыми чернилами. Небольшая базилея хранит имперскую идею на берегу Черного моря." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_pontic_republic: "Понтийская республика" #NT!
 STATIC_MODIFIER_DESC_nd_pon_pontic_republic: "Трапезунд, Синопа и Керасунта сидят вместе на собрании бюргеров. Автокефальная Понтийская Православная Церковь занимает политический центр; должность басилевса утверждается торговыми советами трех понтийских эмпорий." #NT!
  
  # ===== nd_pon.2: Coronation at Trebizond ===== 
 nd_pon.2.t: "Коронация в соборе Святой Софии Трапезундской." #NT!
 nd_pon.2.d: "Базилевс проходит под нарисованным Пантократором в соборе Святой Софии в Трапезунде, церкви, построенной Мануилом I Комнином в 1238 году. Митрополит Трапезундский возлагает диадему на его голову, поет полихронион на понтийско-греческих интонациях и запечатывает хризобулла фиолетовым цветом. Суд теперь торжественный; вопрос в том, что делать с церемонией.\n\nНекоторые члены сената выступают за проецирование имперских притязаний вовне: небольшая базилея, говорящая на равных с Константинополем, Венецией и кавказскими коронами, черпающая престиж из рода Комненоидов. Другие выступают за проецирование ее внутрь: диадема становится центром двора должностей и рангов, связывая понтийско-греческую знать с трапезунтским архонтатом." #NT!
 nd_pon.2.a: "Проецируйте имперские претензии наружу" #NT!
 nd_pon.2.b: "Связать дворянство через судебную канцелярию" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_imperial_claim: "Имперское требование Комнинов" #NT!
 STATIC_MODIFIER_DESC_nd_pon_imperial_claim: "Базилевс говорит как пэр великих римских, латинских и кавказских корон. Линия Комненоидов имеет вес как в Константинополе, Венеции, так и в Тбилиси." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_pontic_archontate: "Понтийский архонтат" #NT!
 STATIC_MODIFIER_DESC_nd_pon_pontic_archontate: "Понтийско-греческая знать связана двором должностей и рангов, получая удовлетворение от церемониала Комненской базилеи." #NT!
  
  # ===== nd_pon.3: The Sumela Endowment ===== 
 nd_pon.3.t: "Дар Сумелы" #NT!
 nd_pon.3.d: "Хрисовул базилевса доставляется настоятелю Сумелы, высеченного в скале монастыря Богородицы на горе Мела над Трабзоном, основанного при Феодосии I в 386 году. Хризовул наделяет монастырь доходами от серебра Аргирии, освобождает его крестьян от налогов и подтверждает владение Панагией Сумелиотиссой, иконой Богородицы, которая Алексиос III Комнин установлен в 1364 году.\n\nНастоятель пишет в ответ, чтобы спросить, чего базилевс ожидает от пожертвования. Станет ли Сумела созерцательным скрипторием, понтийско-греческой горой Афон, хранящей иконы и летописи? Или же она будет работать как пограничная миссия, принимая жителей горных деревень, крестя новообращенных лазов и цанидов, кормя понтийское крестьянство из своих зернохранилищ?" #NT!
 nd_pon.3.a: "Скрипторий и иконопись Понтийской горы." #NT!
 nd_pon.3.b: "Рабочая пограничная миссия Понтийского нагорья" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_sumela_scriptorium: "Сумела Скрипторий" #NT!
 STATIC_MODIFIER_DESC_nd_pon_sumela_scriptorium: "Скальный монастырь становится понтийско-греческой горой Афон: скрипторием, иконной школой, центром понтийского православного образования, чьи книги циркулируют от Сумелы до Синопы и Кафы." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_sumela_frontier: "Пограничная миссия Сумела" #NT!
 STATIC_MODIFIER_DESC_nd_pon_sumela_frontier: "Монахи Сумелы выезжают в высокогорье, крестя жителей лазов и цанидов и кормя понтийское крестьянство из монастырских зернохранилищ." #NT!
  
  # ===== nd_pon.4: Argyria Silver Strike ===== 
 nd_pon.4.t: "Серебро Аргирии" #NT!
 nd_pon.4.d: "Надзорные за шахтами Аргирии и Халибы сообщили, что в глубоких галереях обнаружен новый пласт. Понтийские Альпы не давали серебра в таком объеме со времен Митридата Евпатора. Через несколько месяцев трапезунтиновый фартук снова стал тяжелее; в течение года таможенники басилевса в Трапезунде будут взвешивать итальянские караки, чтобы убедиться, что они не подрывают стоимость понтийской монеты.\n\nПробирщики предупреждают, что быстрый выпуск приведет к инфляции. Однако казначеи улыбаются: именно в этот момент финансируются все проекты, которые базилея откладывала на протяжении столетия." #NT!
 nd_pon.4.a: "Повторный удар по трапецунтинному фартуку" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_argyria_strike: "Аргирия Серебряный удар" #NT!
 STATIC_MODIFIER_DESC_nd_pon_argyria_strike: "Глубокие пласты Аргирии дают серебро в количествах, невиданных со времен Митридата Евпатора. Понтийский фиск переполнен; стоимость - некоторая инфляция по мере того, как новый Аспрон оседает." #NT!
  
  # ===== nd_pon.5: Compact with the Bagrationi ===== 
 nd_pon.5.t: "Договор с Багратиони" #NT!
 nd_pon.5.d: "Грузинский царь Багратиони принимает понтийского посла в соборе Мцхеты. Две короны разделяют христианскую границу с туркменскими бейликами горных перевалов; у них общая родословная Комниноидов на протяжении трех поколений, с тех пор как Мария-Деспоина Трапезундская вышла замуж за наследника Алексиоса II Комнина; и они разделяют опасения, что побережье Понтийского моря и долины Кавказа будут поглощены по частям, если они не будут действовать согласованно.\n\nПосол возвращается с двумя предложениями, выдвинутыми параллельно. Первый — брачный союз: понтийский и багратионийский дома связаны в одну легитимность, притязание Комниноидов и корона Багратиони сплетены навечно. Второй — военный союз: совместная готовность вести совместную кампанию против бейликов с общими пограничными гарнизонами на горных перевалах." #NT!
 nd_pon.5.a: "Брачный союз с домом Багратиони" #NT!
 nd_pon.5.b: "Военный союз против горных бейликов" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_bagrationi_marriage: "Брак Багратиони" #NT!
 STATIC_MODIFIER_DESC_nd_pon_bagrationi_marriage: "Дома Комниноидов и Багратиони сплетены в одну христианскую пограничную легитимность. Дипломаты басилевса с большим весом говорят в Тбилиси, Эрзуруме и в долинах Кавказа." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_caucasian_league: "Кавказская Христианская Лига" #NT!
 STATIC_MODIFIER_DESC_nd_pon_caucasian_league: "Понтийские и грузинские армии вместе выступают против туркменских бейликов нагорных перевалов. Пограничные гарнизоны являются общими; рабочая сила течет в обоих направлениях." #NT!
  
  # ===== nd_pon.6: The Pontic Carrack ===== 
 nd_pon.6.t: "Первый понтийский карак" #NT!
 nd_pon.6.d: "Верфи в устье реки Трапезунд скопировали генуэзскую карраку с верфей в Каффе, соединили ее с более глубокосидящими понтийскими галерами и произвели нечто не итальянское и не строго трапезунтское. Первое судно проходит маршрут Трапезунд-Синопа-Каффа под понтийскими флагами и возвращается с грузами крымского зерна, татарских мехов и кавказского вина, которые старые понтийские галеры никогда не могли перевезти в таком объеме.\n\nАдмиралы василевса настаивают на постоянном адмиралтействе: командование флотом в Трапезунде, платная стоянка для понтийских купцов в Синопе и Керасунте, а также структура тарифов, соответствующая итальянским ценам. караков из вод Понтийского моря." #NT!
 nd_pon.6.a: "Устав Понтийского адмиралтейства в Трапезунде" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_pontic_admiralty: "Понтийское Адмиралтейство" #NT!
 STATIC_MODIFIER_DESC_nd_pon_pontic_admiralty: "Командование флотом находится в Трапезунде. Понтийские караки курсируют по черноморскому треугольнику под понтийскими цветами; моряки и верфи множатся в Синопе и Керасунте." #NT!
  
  # ===== nd_pon.7: 1461 Averted ===== 
 nd_pon.7.t: "1461 Предотвращено" #NT!
 nd_pon.7.d: "Армия Мехмеда Завоевателя стоит у стен Трапезунда. Осадные машины были переброшены через Понтийские Альпы из Эрзурума; Османский флот стоит на якоре у Платаны. В исторической хронике Комнины сдались: Давид Комнин вышел под охранной грамотой, был сослан в Адрианополь и задушен в 1463 году вместе с большей частью своей семьи. Империя Комнинов Трапезундских, основанная в 1204 году, погибла в 1461 году.\n\nНе в этот раз. Стены держат. Колонна помощи из Кавказской лиги прорывает окружение Мехмеда; понтийские караки сжигают османские корабли снабжения в Платане; скальные монастыри Сумелы становятся полевыми госпиталями. После трех месяцев осады османская армия отступает через Понтийские Альпы. Империя Комнинов пережила римский Константинополь на восемь лет и продолжает считаться.\n\nЧто означает предотвращение 1461 года для дальнейшего развития королевства? Некоторые выступают за неповиновение, считая выживание основой понтийско-римской идеи, которую невозможно стереть. Другие выступают за обновление, интеграцию константинопольских беженцев в понтийское государство, которое, наконец, осознает себя законным наследником Рима." #NT!
 nd_pon.7.a: "Pontic Defiance: империя, которая не пала" #NT!
 nd_pon.7.b: "Постимперский Понт: интеграция римских беженцев" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_pontic_defiance: "Понтийское неповиновение" #NT!
 STATIC_MODIFIER_DESC_nd_pon_pontic_defiance: "Империя, которая не пала. Трапезунд стоит; царствование Комнинов; Римская идея имеет понтийское сердце, которое с оружием в руках защищает каждый житель Понтийских Альп." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_post_imperial_pontus: "Постимперский Понт" #NT!
 STATIC_MODIFIER_DESC_nd_pon_post_imperial_pontus: "Константинопольские беженцы хлынут в понтийские торговые центры. Королевство объединяет их как законных наследников римской идеи, осознавая себя, наконец, как выжившую империю." #NT!
  
  # ===== nd_pon.8: The Pontic Phanar ===== 
 nd_pon.8.t: "Понтийские фанариоты" #NT!
 nd_pon.8.d: "Класс двуязычных торгово-административных семей консолидировался по всему понтийскому побережью. Столетие назад они были купцами из треугольника Трапезунд-Синопа-Каффа; теперь они дипломаты, таможенники, финансовые заместители василевса и переводчики с понтийско-греческого, татарско-турецкого, русского и итальянского языков. Придворный летописец называет их понтийскими фанариотами по имени аналогичного класса, выросшего вокруг Константинопольского Патриархата.\n\nСекретари василевса настаивают на официальном признании: уставах домов понтийских фанариотов, интеграции их сетей в понтийский дипломатический корпус, признании их школ в качестве основы среднего образования королевства." #NT!
 nd_pon.8.a: "Устав домов понтийских фанариотов" #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_phanariot_network: "Сеть понтийских фанариотов" #NT!
 STATIC_MODIFIER_DESC_nd_pon_phanariot_network: "Двуязычные понтийско-греко-турецко-русские купеческие кланы служат дипломатической основой королевства. Их сети достигают Константинополя, Москвы, Венеции и Каира." #NT!
  
  # ===== nd_pon.9: Pontic Megale Idea ===== 
 nd_pon.9.t: "Идея Понтийского мегала" #NT!
 nd_pon.9.d: "Наступило понтийско-греческое пробуждение XIX века. Деревни Понтийских Альп, купеческие роды Трапезунда и Синопы, монахи Сумелы и каппадокийских скальных святилищ, а также деревни кавказской понтийско-греческой диаспоры объединились в единый национальный проект. Памфлетисты Трапезунда пишут об Идее Понтийской Мегалии, отличной от Константинопольской: объединение всех понтийско-греческих общин от крымского побережья до Каппадокийского нагорья.\n\nФорма обновленного Понтийского государства оспаривается. Некоторые призывают к созданию Восточной Империи, православного имперского возрождения по комненско-византийскому образцу, распространяющего понтийско-греческую культуру по всему черноморскому миру. Другие призывают к созданию конституционного понтийского государства, опирающегося на бюргерские традиции Трапезунда и Синопы, организованного как парламентская республика свободных понтийско-греческих народов." #NT!
 nd_pon.9.a: "Восточная империя православного возрождения" #NT!
 nd_pon.9.b: "Понтийская конституционная республика свободных народов." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_eastern_empire: "Восточная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_pon_eastern_empire: "Православное имперское возрождение в комнатно-византийском образце. Понтийская корона простирается через Черное море как восточно-христианская альтернатива западным державам." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_pontic_constitution: "Понтийская конституция" #NT!
 STATIC_MODIFIER_DESC_nd_pon_pontic_constitution: "Парламентская республика свободных понтийско-греческих народов. Бюргерские традиции Трапезунда и Синопа становятся конституционной основой нового понтийского государства." #NT!
  
  # ===== Advances ===== 
 nd_pon_komnenian_coronation: "Коронация Комненоя Трапезундского" #NT!
 nd_pon_komnenian_coronation_desc: "Понтийский базилевс восседает на троне собора Святой Софии Трапезундского, поддерживая имперскую идею Комнинов Трапезундских, которые правили понтийским побережьем с 1204 по 1461 год." #NT!
  
 nd_pon_sumela_endowment: "Монастырь Сумела" #NT!
 nd_pon_sumela_endowment_desc: "Пожертвуйте высеченный в скале монастырь Пресвятой Богородицы Сумела на горе Мела, основанный в 386 году нашей эры. Материнский дом понтийско-греческой монашеской традиции." #NT!
  
 nd_pon_argyria_tradition: "Серебряные разработки Аргирии" #NT!
 nd_pon_argyria_tradition_desc: "Откройте серебряные жилы Аргирии и Халибы в Понтийских Альпах, древних рудников, из которых добывались трапезунтинские аспроновые монеты." #NT!
  
 nd_pon_akrites_tradition: "Понтийский акрит" #NT!
 nd_pon_akrites_tradition_desc: "Акритская пограничная пехота Понтийских Альп: крепкие горные жители, охраняющие горные перевалы." #NT!
  
 nd_pon_pontic_liburnae: "Понтийские Либурны" #NT!
 nd_pon_pontic_liburnae_desc: "Черноморский преемник позднеримской либурны, небольшой быстроходной эскортной галеры, курсировавшей по маршруту Трапезунд-Синопа-Каффа." #NT!
  
 nd_pon_pontic_emporia: "Понтийская торговая лавка" #NT!
 nd_pon_pontic_emporia_desc: "Трапезунд, Синопа и Керасунта как автономные торговые коммуны, подчинявшиеся королевской хартии, городская триада Понтийского побережья." #NT!
  
 nd_pon_cappadocian_sanctuary: "Каппадокийские скальные святилища" #NT!
 nd_pon_cappadocian_sanctuary_desc: "Школа пещерных часовен Гёреме и Соганлы, перепрофилированная Понтийским государством в качестве культурных якорей южной границы." #NT!
  
 nd_pon_argyria_mines: "Расширение горнодобывающей промышленности Аргирии" #NT!
 nd_pon_argyria_mines_desc: "Постоянное расширение серебрянодобывающей экономики Понтийских Альп. Аспроновая монета перечеканена, а имперский фиск заполнен." #NT!
  
 nd_pon_caucasian_compact: "Кавказский христианский договор" #NT!
 nd_pon_caucasian_compact_desc: "Дипломатический договор с Багратионами Грузии и армянским домом Мамиконидов-Багратуни, запечатывающий христианскую границу на Кавказе." #NT!
  
 nd_pon_trapezitai_levy: "Понтийская трапезитай" #NT!
 nd_pon_trapezitai_levy_desc: "Легкая конница Понтийского побережья: разведчики, налетчики, конные застрельщики по дороге Трапезунд — Синопа." #NT!
  
 nd_pon_pontic_vernacular: "Понтийско-греческий диалект" #NT!
 nd_pon_pontic_vernacular_desc: "Понтийско-греческий диалект, отличный от константинопольского греческого, становится языком придворных хроник и скриптория Сумелы." #NT!
  
 nd_pon_pontic_carrack: "Понтийский Каррак" #NT!
 nd_pon_pontic_carrack_desc: "Черноморская каррака, сочетающая традиции трапецунтинских галер с итальянским такелажем, скопированным у генуэзцев из Каффы." #NT!
  
 nd_pon_imperial_court_revival: "Комненский императорский двор" #NT!
 nd_pon_imperial_court_revival_desc: "Столичный церемониальный двор Комнинов Трапезундских: молчанциарии, хризобуллы, безделушкиные формы позднеримского обращения." #NT!
  
 nd_pon_pontic_triangle: "Торговля Понтийского треугольника" #NT!
 nd_pon_pontic_triangle_desc: "Треугольник Трапезунд-Синопа-Каффа связывал в единый круговорот понтийско-греческий, генуэзский и татарский рынки." #NT!
  
 nd_pon_autocephaly: "Понтийская православная автокефалия" #NT!
 nd_pon_autocephaly_desc: "Понтийская Православная Церковь утверждает административную независимость от Константинополя с центром в Трапезундской митрополии." #NT!
  
 nd_pon_komnenoid_diplomacy: "Комненоидные дипломатические сети" #NT!
 nd_pon_komnenoid_diplomacy_desc: "Заявление Комненоидов становится дипломатической валютой: родственные браки с трапезунтинскими, итальянскими, татарскими, кавказскими и эгейскими греческими дворами." #NT!
  
 nd_pon_1461_averted: "1461 Предотвращено" #NT!
 nd_pon_1461_averted_desc: "Осада Трапезунда Мехмедом Завоевателем прорвана. Империя Комнинов Трапезундских пережила римский Константинополь." #NT!
  
 nd_pon_kapheneia: "Понтийский Кафенейон" #NT!
 nd_pon_kapheneia_desc: "Понтийско-греческая деревенская таверна-кофейня: Трапезунтине раки, понтийское вино, обмен новостями на каждой деревенской площади." #NT!
  
 nd_pon_confessional_pontus: "Понтийский исповедальный суд" #NT!
 nd_pon_confessional_pontus_desc: "Автокефальная Понтийская Православная Церковь упорядочивает конфессиональные суды, защищая православие от латинского, армянского и суфийского влияния." #NT!
  
 nd_pon_stratiotai: "Понтийский стратиотай" #NT!
 nd_pon_stratiotai_desc: "Возродилась комнатанская традиция бронетанковой пехоты: позднесредневековые стратиоты понтийско-греческой знати и вольные сельские жители." #NT!
  
 nd_pon_pontic_factors: "Понтийские торговые факторы" #NT!
 nd_pon_pontic_factors_desc: "Понтийско-греческие торговые центры работали в Венеции, Генуе, Каире и Александрии, ввязывая королевство в средиземноморскую и левантийскую торговлю." #NT!
  
 nd_pon_pontic_phanariots: "Понтийские фанариоты" #NT!
 nd_pon_pontic_phanariots_desc: "Двуязычный понтийский, греческий, турецкий и русский торгово-административный класс, дипломатическая и коммерческая основа королевства." #NT!
  
 nd_pon_pontic_ship_of_line: "Понтийский линейный корабль" #NT!
 nd_pon_pontic_ship_of_line_desc: "Черноморский линейный корабль, построенный на верфях Трапезунда, воплощает в себе зрелую понтийскую военно-морскую традицию." #NT!
  
 nd_pon_pontic_absolutism: "Понтийский централизованный абсолютизм" #NT!
 nd_pon_pontic_absolutism_desc: "Базилевс правит через обновленный Комненский двор: черноморский аналог петербургского или версальского проектов централизации." #NT!
  
 nd_pon_pontic_roads: "Понтийские альпийские дороги" #NT!
 nd_pon_pontic_roads_desc: "Проложили дороги через Понтийские Альпы, благодаря чему серебро Аргирии, древесина понтийских лесов и зерно Кавказа стали доступны из Трапезунда." #NT!
  
 nd_pon_pontic_megale: "Идея Понтийского Мегале" #NT!
 nd_pon_pontic_megale_desc: "Пробуждение понтийско-греческой диаспоры в XIX веке в единый национальный проект, отличный от идеи константинопольской мегале." #NT!
  
 nd_pon_pontic_industry: "Понтийская промышленная революция" #NT!
 nd_pon_pontic_industry_desc: "Первые механизированные мельницы на реках Понтийских Альп, серебряные заводы в Аргирии, верфи в Трапезунде." #NT!
  
 nd_pon_pontic_constitutional: "Понтийское конституционное движение" #NT!
 nd_pon_pontic_constitutional_desc: "Класс фанариотов, торговые гильдии Трапезунда и монашеские сети Сумела преобразуют королевство в конституционное понтийское государство." #NT!
  
  # ===== Buildings ===== 
 nd_pon_sumela_monastery: "Монастырь Сумела" #NT!
 nd_pon_sumela_monastery_desc: "Вырубленный в скале монастырь Пресвятой Богородицы Сумела на горе Мела над Трабзоном. Основан в 386 году нашей эры; материнский дом понтийско-греческой монашеской традиции." #NT!
  
 nd_pon_argyria_silver_mine: "Серебряный рудник Аргирия" #NT!
 nd_pon_argyria_silver_mine_desc: "Глубокие серебряные разработки Аргирии и Галибы в Понтийских Альпах. Источник серебра, из которого изготовлен трапезунтийский фартук." #NT!
  
 nd_pon_rock_hewn_sanctuary: "Высеченное в скале святилище" #NT!
 nd_pon_rock_hewn_sanctuary_desc: "Вырезанное в пещере христианское святилище в понтийско-каппадокийской традиции: кельи, часовни и трапезные, высеченные в вулканическом туфе." #NT!
  
 nd_pon_komnenian_court: "Комненский императорский двор" #NT!
 nd_pon_komnenian_court_desc: "Трапезунтинский придворный церемониал Комнинов Трапезундских, сохранивший позднеримскую базилею в столице." #NT!
  
 nd_pon_kapheneion: "Понтийский Кафенейон" #NT!
 nd_pon_kapheneion_desc: "Сельская понтийско-греческая таверна-кофейня, деревенский обмен новостями. Делает раки Трапезунтин из местных фруктов и вина." #NT!
  
  # ===== Building PMs ===== 
 nd_pon_sumela_office: "Литургическая канцелярия Сумелы" #NT!
 nd_pon_sumela_office_desc: "Свечи из пчелиного воска, бумага и книги для понтийско-греческой литургии, скопированные и переплетенные в скриптории на скале." #NT!
  
 nd_pon_argyria_extraction: "Добыча серебра из Аргирии" #NT!
 nd_pon_argyria_extraction_desc: "Глубокая добыча серебряной руды из пластов Аргирии, очищенная каменными орудиями и понтийским кузнечным ремеслом." #NT!
  
 nd_pon_sanctuary_office: "Литургия Каппадокийского святилища" #NT!
 nd_pon_sanctuary_office_desc: "Керамика, бумага и пчелиный воск высеченных в скалах пещерных часовен Каппадокии." #NT!
  
 nd_pon_komnenian_ceremonial: "Комненский придворный церемониал" #NT!
 nd_pon_komnenian_ceremonial_desc: "Прекрасная ткань, бумага, пчелиный воск и книги для силентиариев и хризобуллов понтийского двора." #NT!
  
 nd_pon_kapheneion_distilling: "Производство понтийской раки" #NT!
 nd_pon_kapheneion_distilling_desc: "Трапезунтин-раки, дистиллированная из понтийского вина и фруктовых фруктов, основного продукта деревенского кафенеона." #NT!
  
  # ===== Units ===== 
 a_nd_pon_akrites: "Понтийский акрит" #NT!
 a_nd_pon_akrites_desc: "Акритская пограничная пехота Понтийских Альп: крепкие жители горных деревень, специалисты по обороне, мастера скалистых перевалов." #NT!
  
 a_nd_pon_trapezitai: "Понтийская трапезитай" #NT!
 a_nd_pon_trapezitai_desc: "Конные стрелки на побережье Чёрного моря: быстрые разведчики и переправки всадников по дороге Трапезунд — Синопа." #NT!
  
 a_nd_pon_stratiotai: "Понтийский стратиотай" #NT!
 a_nd_pon_stratiotai_desc: "Позднесредневековая бронепехота понтийско-греческой знати и вольных деревенских жителей, оснащенная железом Аргирии и дисциплиной военных трактатов Сумелы." #NT!
  
 n_nd_pon_trapezuntine_liburnian: "Трапезунтийский либурнский" #NT!
 n_nd_pon_trapezuntine_liburnian_desc: "Черноморский потомок позднеримской либурны: небольшой, быстрый, используемый в качестве эскортного и отправочного судна для перевозки зерна." #NT!
  
 n_nd_pon_pontic_carrack: "Понтийский Каррак" #NT!
 n_nd_pon_pontic_carrack_desc: "Черноморская карарака с трапезунтовым корпусом и итальянским такелажем, рабочая лошадка маршрута Трапезунд-Синопа-Каффа." #NT!
  
 n_nd_pon_pontic_ship_of_line: "Понтийский линейный корабль" #NT!
 n_nd_pon_pontic_ship_of_line_desc: "Линейный черноморский корабль, построенный на Трапезундских верфях, с усиленным корпусом для Понтийского моря." #NT!
  
  # ===== Levies ===== 
 levy_nd_pon_akrites: "Понтийский Акритес Леви" #NT!
 levy_nd_pon_akrites_desc: "Набор акритской горной пограничной пехоты из горных деревень Понтийских Альп." #NT!
  
 levy_nd_pon_trapezitai: "Понтийский Трапезитай Леви" #NT!
 levy_nd_pon_trapezitai_desc: "Набор легкой кавалерии из мелкой знати Понтийского побережья и предгорий Кавказа." #NT!
  
  # ===== New buildings (added in fix pass) ===== 
 nd_pon_pontic_funduq: "Понтийский Фундук" #NT!
 nd_pon_pontic_funduq_desc: "Понтийско-греческий городской торговый торговый центр-склад: бестарное хранилище зерна, вина, серебра и мехов для треугольника Трапезунд-Синопа-Каффа." #NT!
  
 nd_pon_pontic_bank_house: "Понтийский банк-хаус" #NT!
 nd_pon_pontic_bank_house_desc: "Понтийско-греческий финансовый дом эпохи фанариотов: купеческие кланы объединяли капиталы, выпускали векселя, предоставляли кредиты басилевсам." #NT!
  
 nd_pon_trebizond_arsenal: "Трапезундский Арсенал" #NT!
 nd_pon_trebizond_arsenal_desc: "Верфь-арсенал в устье Трапезунда, переоборудованная в действующую военно-морскую базу для Понтийского линейного корабля." #NT!
  
 nd_pon_argyria_refining_works: "Аргирийский нефтеперерабатывающий завод" #NT!
 nd_pon_argyria_refining_works_desc: "Поздние промышленные нефтеперерабатывающие работы в Аргирии: механизированная добыча и рафинирование стали с использованием понтийского железа и эрзурумского угля." #NT!
  
  # New PMs 
 nd_pon_funduq_maintenance: "Фундук Операции" #NT!
 nd_pon_funduq_maintenance_desc: "Ткань, бумага и керамика для приказчиков и складов Понтийского купечества." #NT!
  
 nd_pon_bank_house_maintenance: "Операции банковского дома" #NT!
 nd_pon_bank_house_maintenance_desc: "Бумага, книги и тонкая ткань для банковских домов фанариотов и их векселей." #NT!
  
 nd_pon_arsenal_maintenance: "Операции Трапезундского арсенала" #NT!
 nd_pon_arsenal_maintenance_desc: "Пиломатериалы, военно-морские припасы и инструменты для Трапезундской верфи." #NT!
  
 nd_pon_refining_steel: "Аргирийский сталелитейный завод" #NT!
 nd_pon_refining_steel_desc: "Железо и уголь переплавлялись в понтийскую сталь на механизированных нефтеперерабатывающих заводах Аргирии." #NT!
  
  # New advances (added in fix pass) 
 nd_pon_admiralty_reform: "Реформа Понтийского адмиралтейства" #NT!
 nd_pon_admiralty_reform_desc: "Централизованное военно-морское командование в Трапезунде, ремонт верфей и укомплектование постоянного состава флота понтийских линейных кораблей." #NT!
  
 nd_pon_pontic_mining_revival: "Возрождение горной промышленности Понтийских Альп" #NT!
 nd_pon_pontic_mining_revival_desc: "Модернизированная горнодобывающая и нефтеперерабатывающая промышленность в Понтийских Альпах стимулирует развитие позднеиндустриальной понтийской экономики: производство железа, меди, серебра и стали из горных выработок." #NT!
  
  # ========================================================================== 
  # ===== DESTINY TREE LOCALIZATION ===== 
  # ========================================================================== 
  
  # ----- Destiny advance names and descriptions ----- 
 nd_pon_destiny: "Понтийская судьба" #NT!
 nd_pon_destiny_desc: "Провозглашена реставрация Понтийского моря. Базилея Трапезунда теперь прокладывает свой путь: реставрация Комнинов-римлян, или Черноморское Содружество. Выбирайте при формировании; Затем путь разворачивается в три этапа." #NT!
  
 nd_pon_dest_anatolikon: "Реконкиста Анатоликона" #NT!
 nd_pon_dest_anatolikon_desc: "Вернитесь с побережья Понтийского моря в центр старой Анатолии. Отвоевать Бурсу (Прусу) и Изник ​​(Никею), колыбельные города позднеримской Малой Азии и резиденцию второго римского изгнанника после 1204 года. Требуется престиж >= 50." #NT!
  
 nd_pon_dest_aegean_strategos: "Эгейские стратеги" #NT!
 nd_pon_dest_aegean_strategos_desc: "Продвиньте границу Комнинии к Эгейскому морю и европейским Балканам. Удерживайте Смирну, Хиос и Эдирну; увеличить армию до пятидесяти полков и общее развитие королевства до тысячи. Понтийско-римская корона теперь выступает наравне со всеми западными державами." #NT!
  
 nd_pon_dest_nea_rhomaion: "Неа Ромайон: восстановление Нового Рима" #NT!
 nd_pon_dest_nea_rhomaion_desc: "Комнинский василевс возвращается из понтийского изгнания к царице городов. Держите Константинополь, Салоники и Афины под одной римской короной; довести армию до семидесяти пяти полков; достичь 75 престижа и 3000 золота. Открывает собор Святой Софии Неа Ромайон в столице." #NT!
  
 nd_pon_dest_pontic_network: "Понтийская торговая сеть" #NT!
 nd_pon_dest_pontic_network_desc: "Связать Причерноморье в единый торговый оборот под руководством Понтийского моря. Удерживайте Тану на Азовском море и Четатею Альбу в устье Днестра; есть шелк на Трапезундском рынке; достичь 1000 золотых. Понтийское побережье становится центральной биржей черноморского мира." #NT!
  
 nd_pon_dest_caucasian_compact_full: "Кавказский договор в полном объеме" #NT!
 nd_pon_dest_caucasian_compact_full_desc: "Грузинская корона Багратиони и царства Имерети и Лазика входят в состав Понтийского государства. Удерживайте Тбилиси и Кутаиси; принять институт банковского дела; достичь 2000 золотых." #NT!
  
 nd_pon_dest_council_of_faithful: "Совет верующих" #NT!
 nd_pon_dest_council_of_faithful_desc: "Черноморское Содружество в полном объеме. Удерживайте Сухуми, Батуми и Поти, чтобы связать западное побережье Кавказа; охватите глобальную торговлю; поднять общее развитие до 1500 и золото до 3000. Федеративное православное содружество греко-кавказско-понтийских народов. Открывает Зал Понтийского Совета в столице." #NT!
  
  # ----- Destiny event nd_pon.10 (root) ----- 
 nd_pon.10.t: "Понтийская судьба" #NT!
 nd_pon.10.d: "Хризобул формирования запечатан фиолетовым цветом, базилевс восседает на троне, и новое знамя Понта реет над Трапезундом. Теперь королевству следует смотреть вперед. В сенатской хронике Виссариона записаны две великие судьбы, открытые для понтийско-греческого дома: медленный марш Комнинов Трапезунда обратно к Царице городов, собирающий все, что было потеряно в 1204 и 1453 годах, или терпеливое создание Черноморского Содружества: федеративного православного договора понтийских, кавказских и приграничных народов вокруг центрального берега.\n\nВыбор было сделано; Далее следует долгая работа по воплощению судьбы в жизнь." #NT!
 nd_pon.10.a: "Пусть судьба сложится." #NT!
  
  # ----- Destiny event nd_pon.11 (Path A Stage 1) ----- 
 nd_pon.11.t: "Анатоликон восстановлен" #NT!
 nd_pon.11.d: "Понтийские колонны спускаются из Бурсы и Изника. Старые римские фемы Анатоликона и Опсикиона снова стоят под понтийско-комнинскими знаменами. Первая мечта о римской реставрации реализована: империя понтийского побережья теперь простирается до самого сердца Анатолии позднеримского дома." #NT!
 nd_pon.11.a: "Анатолийские темы снова актуальны." #NT!
  
  # ----- Destiny event nd_pon.12 (Path A Stage 2) ----- 
 nd_pon.12.t: "Эгейское море" #NT!
 nd_pon.12.d: "Смирна, Хиос и Эдирне носят цвета Понтийского полуострова. Комнинская базилея больше не понтийская диковинка, а римская держава на Эгейском море и на Балканах. Двор в Трапезунде обсуждает, как проецировать новую силу: по морю, с помощью понтийской талассократии караков и галер, управляющей островами Эгейского моря, или по суше, когда стратиоты полевой армии становятся постоянным римским корпусом на западных театрах военных действий." #NT!
 nd_pon.12.a: "Понтийская талассократия Эгейского моря." #NT!
 nd_pon.12.b: "Постоянный стратиотический полевой корпус." #NT!
  
  # ----- Destiny event nd_pon.13 (Path A Stage 3, capstone) ----- 
 nd_pon.13.t: "Неа Ромайон: восстановление Нового Рима" #NT!
 nd_pon.13.d: "Комнинский василевс въезжает в Константинополь через Золотые ворота. Собор Святой Софии повторно освящен по понтийско-православному обряду; хризобулла Нового Рима запечатана фиолетовыми чернилами. Салоники и Афины преклоняют колени под одной римской короной. Империя Комнинов Трапезундских, основанная в понтийском изгнании в 1204 году, восстановила римскую идею как по сути, так и по названию.\n\nКакую форму принимает восстановленный Рим? Придворный летописец приводит доводы в пользу Базилевса Ромеона: империя полностью восстановлена, а базилевс говорит как Цезарь Август с кафедры Юстиниана. Митрополиты выступают за Pax Komnenia: устоявшийся римский порядок, комнатенский мир во всем восточном Средиземноморье, энергия империи, направленная на консолидацию." #NT!
 nd_pon.13.a: "Базилевс Ромаион: Цезарь Август восстановлен." #NT!
 nd_pon.13.b: "Pax Komnenia: Комненский мир." #NT!
  
  # ----- Destiny event nd_pon.14 (Path B Stage 1) ----- 
 nd_pon.14.t: "Черноморская торговая сеть" #NT!
 nd_pon.14.d: "В понтийский торговый оборот вступают Тана на Азовском море и Четатея Альба в устье Днестра. Понтийские караки бороздят черноморский треугольник из конца в конец; Трапезундский рынок является центральной биржей всех черноморских товаров. Заложены первые основы Черноморского Содружества." #NT!
 nd_pon.14.a: "Чёрное море – это Понтийское море." #NT!
  
  # ----- Destiny event nd_pon.15 (Path B Stage 2) ----- 
 nd_pon.15.t: "Кавказский договор в полном объеме" #NT!
 nd_pon.15.d: "Грузинский царь Багратиони подписывает Понтийский договор в соборе Мцхеты; Следом идут Имеретинская корона и лазичские пограничники. Тбилиси и Кутаиси присоединяются к Понтийскому совету. Кавказско-христианская граница объединяется в Черноморское Содружество на правах полноправных партнеров.\n\nКакую форму принимает Кавказско-Понтийский союз? Суд отдает предпочтение Кавказской Династии: кровь Багратионов-Комненоидов сплелась в один правящий дом, единая торгово-христианская династия, управляющая обоими берегами. Торговые советы выступают за Кавказскую лигу: федеративную лигу понтийско-кавказских торговых городов, управляемую ежегодным советом в Трапезунде, без единой династии над делегатами-горожанами." #NT!
 nd_pon.15.a: "Кавказско-Понтийская правящая династия." #NT!
 nd_pon.15.b: "Кавказско-Черноморская федеративная лига." #NT!
  
  # ----- Destiny event nd_pon.16 (Path B Stage 3, capstone) ----- 
 nd_pon.16.t: "Совет верующих" #NT!
 nd_pon.16.d: "Черноморское Содружество собирает свой первый полный совет в Трапезунде. Делегаты от горожан из Синопа, Каффы, Таны и новых кавказских городов-членов Сухуми, Батуми и Поти сидят рядом с митрополитом Трапезундским, настоятелем Сумелы и председателем василевса. Федеративное православное содружество греко-кавказско-понтийских народов теперь является признанным государством.\n\nКакую форму принимает Собор? Митрополиты призывают к созданию Православного Собора: явно конфессионального органа, понтийского ответа Тридентскому собору. Дома фанариотов призывают к созданию плюралистического Содружества фанариотов: совета, в котором конфессиональные вопросы выносятся в скобки, а администраторы понтийско-греческой диаспоры служат основой управления." #NT!
 nd_pon.16.a: "Православный Собор верующих." #NT!
 nd_pon.16.b: "Плюралистическое Содружество фанариотов." #NT!
  
  # ----- Destiny timed modifiers ----- 
 STATIC_MODIFIER_NAME_nd_pon_dest_aegean_thalassocracy: "Эгейская талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_aegean_thalassocracy: "Понтийские караки и галеры заполонили острова Эгейского моря. Досягаемость империи — это военно-морская досягаемость; базилевс правит как с колоды, так и с трона." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_strategoi_legacy: "Стратегическое наследие" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_strategoi_legacy: "Понтийские стратиоты стали постоянным римским полевым корпусом. Набор кадров идет стабильно, боевой дух быстро восстанавливается, преимущество кавалерии обостряется." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_basileus_rhomaion: "Базилевс Ромаион" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_basileus_rhomaion: "Базилевс говорит как Цезарь Август с кафедры Юстиниана в соборе Святой Софии. Империя полностью восстановлена. Цена высока: новый бюджет растет по мере того, как серебро перечеканивается для императорских церемоний." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_pax_komnenia: "Пакс Комния" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_pax_komnenia: "Комненский мир устанавливается в восточном Средиземноморье. Дружественная территория восстанавливает изношенные войска; армия Крайова учится выдерживать длительные кампании; римские народы соглашаются на длительную войну ради империи." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_dynasty: "Кавказско-Понтийская династия" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_dynasty: "Родословная Багратиони-Комненоидов связывает две короны в один правящий дом. Понтийские купцы находят за границей более дружелюбный прием; опустошенные провинции восстанавливаются быстрее при династическом стандарте." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_league: "Кавказско-Понтийская лига" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_league: "Федеративный союз понтийско-кавказских торговых городов, управляемый ежегодным советом в Трапезунде. Торговый потенциал каждого города-участника расширяется; морские сети простираются дальше, чем когда-либо." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_council_orthodox: "Православный совет верующих" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_council_orthodox: "Совет верующих как чисто православный конфессиональный орган. Еретические сообщества терпимы в рамках Содружества; составы гарнизонов неуклонно растут; Движения претендентов чахнут в условиях соборной легитимности." #NT!
  
 STATIC_MODIFIER_NAME_nd_pon_dest_council_phanar: "Содружество фанариотов" #NT!
 STATIC_MODIFIER_DESC_nd_pon_dest_council_phanar: "Совет верующих как плюралистическое управление фанариотами: администраторы понтийско-греческой диаспоры являются основой Содружества. Число военно-морских губернаторов множится; сборы набираются быстрее. Цена: политика совета отвлекает от медленного процесса подготовки генералов." #NT!
  
  # ----- Destiny capstone buildings ----- 
 nd_pon_hagia_sophia_nea_rhomaion: "Собор Святой Софии Неа Ромайон" #NT!
 nd_pon_hagia_sophia_nea_rhomaion_desc: "Восстановленная Великая церковь Константинополя, восстановленная как резиденция Комненской базилии Нового Рима. Кафедру Юстиниана снова занимает римский император, на этот раз из понтийско-комненоидной линии." #NT!
  
 nd_pon_nea_rhomaion_ceremonial: "Новый Римский императорский церемониал" #NT!
 nd_pon_nea_rhomaion_ceremonial_desc: "Прекрасная ткань, бумага, книги, пчелиный воск и благовония для восстановленного церемониала Нового Рима: хризобулы, полихронии, великие соборные литургии." #NT!
  
 nd_pon_council_hall: "Зал Понтийского Совета" #NT!
 nd_pon_council_hall_desc: "Зал Совета Черноморского Содружества: палата торгового совета, построенная по образцу фанариотов, где делегаты горожан от каждого города-члена встречаются под председательством Понтия." #NT!
  
 nd_pon_council_hall_clerks: "Служащие зала Совета" #NT!
 nd_pon_council_hall_clerks_desc: "Бумага, книги и прекрасная ткань для секретариата Совета верующих: двуязычные служащие переписывают протоколы греческими, кавказскими и итальянскими руками." #NT!
  
  
  # ----- Bureaucracy authority (auto_modifier) ----- 
 AUTO_MODIFIER_NAME_nd_pon_bureaucracy_authority: "Комненоидная Имперская власть" #NT!
 AUTO_MODIFIER_DESC_nd_pon_bureaucracy_authority: "Восстановленный Комниноидный императорский дом в Трапезунде унаследовал институциональный аппарат Трапезунтской империи: автокефальный Понтийский синод в Сумеле, многоязычный Логотесион, управление по добыче серебра в Аргирии и Каффо-Трапезондский торговый совет. Предоставляются два бюрократических места; столица добавляет треть." #NT!
  
  # ----- Bureaucracies ----- 
 pon_synodos_of_the_pontic_church_bureaucracy: "Синоды Понтийской Церкви" #NT!
 pon_synodos_of_the_pontic_church_bureaucracy_desc: "Автокефальный Понтийский православный синод, возглавляемый митрополитом Трапезундским, собирался в скалистом монастыре Сумела над долиной Пиксит. Синод собрал епископов Трапезундских, Керасунтских, Синопских и игуменов Сумелы, Вазелона и Перистеры, а также кавказских православных кафедр в Лазице и Абхазии. Оно рукоположило собственных епископов, сохранило особый календарь в честь святых Евгения и Акилы Трапезундских и лицензировало иконописные мастерские понтийской школы. Ее автономия от Константинополя возникла до 1204 года и на одно поколение пережила империю." #NT!
  
 pon_logothesion_of_trebizond_bureaucracy: "Логотезия Трапезунда" #NT!
 pon_logothesion_of_trebizond_bureaucracy_desc: "Имперская канцелярия Комнинов Трапезундских, созданная по образцу константинопольских логофетских традиций, но адаптированная к многоязычной дипломатической среде. При протонотариях и мегалогариастах он выпускал хризобуллы в руки трапезунтинской канцелярии и составлял корреспонденцию на греческом, персидском, монгольско-тюркском и итальянской латыни ильханам, султанам Аккуюнлу, генуэзским подестам, венецианским байло и комненским побочным линиям. Его хранители свитков декламировали Комнинскую полихронию перед каждой аудиторией, связывая небольшую империю с обширной дипломатической сетью." #NT!
  
 pon_argyria_mint_bureaucracy: "Управление монетного двора и горнодобывающей промышленности Аргирии" #NT!
 pon_argyria_mint_bureaucracy_desc: "Скоординированный аппарат по добыче и чеканке серебра Трапезунтинской империи. Рудники Аргирии в Понтийских Альпах к югу от Триполиса (современный Гумушане, серебряный дом) поставляли слитки на императорский монетный двор в Трапезунде, который, начиная с тринадцатого века, чеканил аспрон-трахию и серебряный аспрон-комненатон в непрерывных выпусках высокой пробы. Деспоты тон-металлон подчинялись непосредственно комнатенскому дому; Трапезунтиновое серебро имело хождение в качестве стандартного средства черноморской торговли и принималось в Каффе, Синопе, Тане и анатолийских бейликах." #NT!
  
 pon_caffa_trebizond_council_bureaucracy: "Каффо-Трапезундский торговый совет" #NT!
 pon_caffa_trebizond_council_bureaucracy_desc: "Постоянный совет крупных понтийско-итальянско-каффских торговых семей, регулирующий черноморскую торговлю, призовые споры, таможенные дела и сопровождение конвоев. Понтийские архонтско-торговые линии (цанихиты, скутериды, месариты, дораниты) соседствовали с генуэзско-каффскими домами (Гаттилузио, Центурионе, Ди Негро) и синопскими греческими купеческими семьями. Совет собирался сезонно в Трапезунде и Каффе под совместным трапезунтско-генуэзским президентством, устанавливал коммерческие пошлины на зерно, соленую рыбу, икру, квасцы, шелк и торговлю рабами, а также решал дела о призах между городами. Это трапезунтинский предшественник позднейшего торгового государства фанариотов." #NT!
