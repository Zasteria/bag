l_russian:
 STATIC_MODIFIER_NAME_nd_sea_kings_dominion: "Доминион морских королей" #NT!
 STATIC_MODIFIER_DESC_nd_sea_kings_dominion: "Восстановленное королевство Далриада правит волнами между Ирландией и Шотландией, как когда-то это делали его предки, командуя быстрым флотом галер в коварных островных водах." #NT!
 STATIC_MODIFIER_NAME_nd_light_of_iona: "Свет Ионы" #NT!
 STATIC_MODIFIER_DESC_nd_light_of_iona: "Опираясь на наследие Колумбы и великие монашеские традиции, восстановленная Дальриада посвящает себя науке, сохранению и распространению гэльского образования по всему известному миру." #NT!
 STATIC_MODIFIER_NAME_nd_drd_aedan_legacy: "Наследие Эдана Мак Габрейна" #NT!
 STATIC_MODIFIER_DESC_nd_drd_aedan_legacy: "В духе Эдана мак Габрейна, чьи флоты располагались от Оркнейских островов до острова Мэн, Дальриада вновь подтверждает свое господство над западными морями." #NT!
 STATIC_MODIFIER_NAME_nd_drd_book_of_kells_spirit: "Дух освещенной страницы" #NT!
 STATIC_MODIFIER_DESC_nd_drd_book_of_kells_spirit: "Традиция, породившая Келлскую книгу, снова жива: монастырские скриптории создают произведения потрясающего мастерства и глубокого обучения." #NT!
 nd_drd.1.t: "Королевство возрождается" #NT!
 nd_drd.1.d: "Древнее королевство Даль Риата, которое когда-то служило мостом между Ирландией и Шотландией, снова возрождается. От священной вершины холма Дунадд, где короли когда-то ставили ногу на инаугурационный камень, до священного острова Иона, где Колумба зажег пламя обучения, эта земля хранит воспоминания, уходящие корнями в зарю гэльского мира.\n\nСенелы (великие родственные группы, которые когда-то собирали свои галеры по призыву короля) смотрят на нас сейчас. «Сенчус фер нАльбан», древняя перепись кораблей и людей, говорит о народе, чья сила измерялась не полями и замками, а веслами и килями. Однако монахи Ионы также напоминают нам, что истинным наследием Даля Риаты было сохранение самой цивилизации на протяжении долгих веков тьмы.\n\nБудем ли мы морскими королями, управляющими приливами, как когда-то это сделал Эдан мак Габрейн? Или нам следует стать хранителями священного пламени, как это было Колумбой?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_drd.1.a: "Управляйте морями, как это делали наши предки" #NT!
 nd_drd.1.b: "Возродите свет наследия Колумбы" #NT!
 nd_drd.2.t: "Сбор на галерах" #NT!
 nd_drd.2.d: "Древний Senchus fer nAlban (Перепись населения Шотландии) предписывал, что каждые двадцать домов должны были иметь две семиместные галеры флоту короля. Эта система военно-морских обязательств, уникальная среди королевств Британии, сделала Дал Риату морской державой, чья сфера действия далеко превосходила его скромную территорию.\n\nТеперь, когда Далриада возрождается, сбор галер возобновляется. От Кинтайра до Внешних Гебридских островов, от побережья Антрима до островов Лорна сенелы готовят свои бирлинны и лонг фада к зову сверхкороля. Морские дороги, которые когда-то соединяли это разрозненное королевство, снова оживлены движением транспорта." #NT!
 nd_drd.2.a: "Пусть наши враги дрожат при виде наших парусов" #NT!
 nd_drd.2.b: "Пусть монахи запишут то, что откроют наши моряки." #NT!
 nd_drd.3.t: "Суд Брейтеама" #NT!
 nd_drd.3.d: "Древняя гэльская правовая традиция брехон (брейтеамх) была восстановлена ​​под властью Далриадов. В отличие от феодальных судов Англии и Шотландии, где правосудие исходит от короны, брегонская система основана на общинном арбитраже. Брейтеамх сидит под открытым небом, выслушивая споры между членами клана, вынося решения по искам о скоте и вынося приговоры в соответствии с Сенчус Мор: великим древним законом.\n\nЭта система обычного правосудия объединяет кланы более эффективно, чем любая армия. Когда человек знает, что его жалобы будут справедливо рассмотрены, у него нет причин для бунта." #NT!
 nd_drd.3.a: "Справедливость связывает то, чего сила не может" #NT!
 nd_drd.4.t: "Гэльский ренессанс" #NT!
 nd_drd.4.d: "В восстановленном королевстве наблюдается замечательный расцвет гэльской литературы. Бардские поэты сочиняют сложные хвалебные стихи классическими слоговыми размерами, а ученые-монахи копируют и комментируют древние тексты. Традиция, породившая Келлскую книгу и «Анналы Ольстера», возрождается: не как простое подражание, а как живое продолжение.\n\nНовые произведения на гэльском языке создаются наряду с переводами с латыни, греческого и даже арабского языка, привозимыми торговцами по морским путям. Скриптории Дальриады производят иллюминированные рукописи, которые могут соперничать с манускриптами любого европейского двора." #NT!
 nd_drd.4.a: "Наши слова переживут наши мечи" #NT!
 nd_drd_dunadd_seat: "Престол Дунадда" #NT!
 nd_drd_dunadd_seat_desc: "Восстановление Дунадда как королевского центра, где короли ставят ногу на инаугурационный камень, как это делали их предки, символизируя владычество над землей." #NT!
 nd_drd_cattle_wealth: "Повелители скота Запада" #NT!
 nd_drd_cattle_wealth_desc: "Крупный рогатый скот — настоящая валюта гэльского мира. Богатство вождя клана измеряется мычанием его стад, а набег скота остается высшим испытанием смелости воина.\n\n#italic Доступно в: $nd_drd_dun$#!" #NT!
 nd_drd_columban_mission: "Колумбийская миссия" #NT!
 nd_drd_columban_mission_desc: "Следуя путем святого Колумбы, принесшего веру из Ирландии на Иону в 563 году, монашеские миссионеры распространяли христианство и грамотность по всему западному Хайленду и островам." #NT!
 nd_drd_galley_service: "Камбузная служба «Сенелы»" #NT!
 nd_drd_galley_service_desc: "Сенчус фер нАльбан предписывал военно-морские обязанности для каждой родственной группы ценела: две семиместные галеры на каждые двадцать домов. Эта служба на галерах сделала Далриаду морской державой." #NT!
 nd_drd_cross_sea_clans: "Кланы за морем" #NT!
 nd_drd_cross_sea_clans_desc: "Северный канал — не преграда, а шоссе, соединяющее гэльские племена Ирландии и Шотландии, обеспечивающее свободное передвижение людей, идей и преданности." #NT!
 nd_drd_tanistry_tradition: "Танистрия Традиция" #NT!
 nd_drd_tanistry_tradition_desc: "Гэльская практика танистрии выбирает в качестве преемника наиболее способного взрослого мужчину из королевского рода, обеспечивая сильное лидерство на основе заслуг, а не порядка рождения." #NT!
 nd_drd_island_fortification: "Островное укрепление" #NT!
 nd_drd_island_fortification_desc: "Разбросанные острова и морские озера западной Шотландии представляют собой естественные оборонительные позиции. Имея несколько человек и укрепленный мыс, клан может противостоять силам, в десять раз превосходящим его по численности." #NT!
 nd_drd_monastic_scriptorium: "Монастырский скрипторий" #NT!
 nd_drd_monastic_scriptorium_desc: "В традициях Ионы монастырские скриптории создают иллюминированные рукописи необычайной красоты, сохраняя классические знания и одновременно развивая гэльскую литературную культуру." #NT!
 nd_drd_herring_fishery: "Сельдяной промысел" #NT!
 nd_drd_herring_fishery_desc: "Богатые запасы сельди на Гебридских островах и в Минче поддерживают прибрежные общины и служат ценным товаром для торговли, который засаливают и экспортируют на рынки Северной Европы.\n\n#italic Доступно в: $nd_drd_clan_hall$#!" #NT!
 nd_drd_cenela_muster: "Сенела Мустер" #NT!
 nd_drd_cenela_muster_desc: "Формализация системы сбора ценела, при которой каждая родственная группа предоставляет воинов пропорционально количеству своих домохозяйств, создает надежный набор, который можно быстро собрать по морю." #NT!
 nd_drd_lordship_customs: "Таможня Светлости" #NT!
 nd_drd_lordship_customs_desc: "Власть верховного короля подкрепляется древними обычаями дани и пиршеств, когда вожди кланов собираются, чтобы обновить свои обязательства и урегулировать споры.\n\n#italic Доступно в: $nd_drd_clan_hall$#!" #NT!
 nd_drd_mainland_expansion: "Материковая дипломатия" #NT!
 nd_drd_mainland_expansion_desc: "Далриада расширяет свое влияние за пределы островов посредством тщательно продуманной сети брачных союзов, заключения договоренностей и дипломатических договоров с соседними королевствами." #NT!
 nd_drd_galley_warfare: "Галерная война" #NT!
 nd_drd_galley_warfare_desc: "Эволюция далриадской военно-морской тактики, сочетающая скорость «Бирлинна» с опытом прибрежных рейдов, создает боевой стиль, уникально подходящий для усеянного островами западного побережья." #NT!
 nd_drd_charter_market: "Чартерные рынки" #NT!
 nd_drd_charter_market_desc: "Установление официальных рыночных прав в ключевых прибрежных поселениях превращает разбросанную островную торговлю в структурированную коммерческую сеть.\n\n#italic Доступно в: $nd_drd_galley_haven$#!" #NT!
 nd_drd_plantation_system: "Расширение высокогорных пастбищ" #NT!
 nd_drd_plantation_system_desc: "Систематическое расширение выпаса овец и крупного рогатого скота в Хайленде позволяет производить шерсть и домашний скот на экспорт, хотя и за счет вытеснения некоторых традиционных поселений." #NT!
 nd_drd_clan_justice: "Клан Справедливости" #NT!
 nd_drd_clan_justice_desc: "Кодификация традиций брехонского права в формальную правовую структуру, которой управляют потомственные судьи-брейтемы, вносит порядок в королевство, не разрушая его гэльский характер." #NT!
 nd_drd_statecraft: "Гэльское государственное управление" #NT!
 nd_drd_statecraft_desc: "Дипломаты-далриады, свободно владеющие дворами как гэльского, так и англоязычного мира, доказывают, что они умеют натравливать более крупные державы друг против друга, чтобы сохранить независимость королевства." #NT!
 nd_drd_bardic_schools: "Бардские школы" #NT!
 nd_drd_bardic_schools_desc: "Формальное обучение файловых поэтов классической гэльской слоговой традиции, требующее до двенадцати лет обучения, создает ученый класс, чьи произведения сохраняют историю и прославляют королевство.\n\n#italic Доступно в: $nd_drd_scriptorium$#!" #NT!
 nd_drd_armed_galleys: "Вооруженные военные галеры" #NT!
 nd_drd_armed_galleys_desc: "Установка пушек на борту традиционного корпуса камбуза позволяет создать военный корабль, который может плавать по мелким скалистым водам Гебридских островов, одновременно нанося разрушительные бортовые залпы." #NT!
 nd_drd_highland_levy_reform: "Реформа Хайлендского сбора" #NT!
 nd_drd_highland_levy_reform_desc: "Реорганизация клановой системы набора вводит единые стандарты экипировки и регулярные тренировки, превращая свирепых, но недисциплинированных членов клана в надежных солдат." #NT!
 nd_drd_cattle_drove_roads: "Скот перегонял дороги" #NT!
 nd_drd_cattle_drove_roads_desc: "Развитие официальных подъездных дорог позволяет доставлять крупный рогатый скот из Хайленда на равнинные рынки большими стадами, соединяя пасторальную экономику с более широкими коммерческими сетями." #NT!
 nd_drd_maritime_law: "Морское право островов" #NT!
 nd_drd_maritime_law_desc: "Кодифицированная система морского права регулирует торговлю, права на рыболовство и военно-морские обязательства на островных территориях, наводя порядок на западном побережье." #NT!
 nd_drd_gaelic_colleges: "Гэльские колледжи" #NT!
 nd_drd_gaelic_colleges_desc: "Формальные высшие учебные заведения, преподающие на гэльском языке наряду с латынью и современными языками, создают грамотный административный класс, способный управлять современным государством." #NT!
 nd_drd_clan_regiment: "Клановые полки" #NT!
 nd_drd_clan_regiment_desc: "Организация традиционных клановых воинов в формальные полковые структуры, сохраняющие их жестокий боевой дух и одновременно приобретающие дисциплину современной войны." #NT!
 nd_drd_kelp_industry: "Келп Индустрия" #NT!
 nd_drd_kelp_industry_desc: "Сбор и сжигание морских водорослей вдоль западного побережья дает щелочь, необходимую для производства мыла и стекла, обеспечивая новый источник промышленного богатства.\n\n#italic Доступно в: $nd_drd_drove_station$#!" #NT!
 nd_drd_gaelic_literary_revival: "Гэльское литературное возрождение" #NT!
 nd_drd_gaelic_literary_revival_desc: "Сознательные усилия по сбору, сохранению и публикации устных традиций гэльского мира приводят к литературному ренессансу, утверждая культурную жизнеспособность традиции Хайленда." #NT!
 nd_drd_emigrant_networks: "Эмигрантские сети" #NT!
 nd_drd_emigrant_networks_desc: "Гэльские эмигранты через Атлантику поддерживают прочные связи со своей родиной, создавая коммерческие сети, по которым богатство и идеи возвращаются в Далриаду.\n\n#italic Доступно в: $nd_drd_drove_station$#!" #NT!
 nd_drd_modern_fleet: "Современный флот" #NT!
 nd_drd_modern_fleet_desc: "Переход от весельных галер к современным парусным судам, построенным на верфях западного побережья, дает Далриаде флот, достойный эпохи пара." #NT!
 nd_drd_dun: "Дун" #NT!
 nd_drd_dun_desc: "Укрепленная цитадель на вершине холма в древнем гэльском стиле, контролирующая окружающую местность со своей возвышенности. Величайшим даном из всех был Дунадд, резиденция королей Далриады." #NT!
 nd_drd_scriptorium: "Монастырский скрипторий" #NT!
 nd_drd_scriptorium_desc: "Мастерская в монастыре или религиозном доме, посвященная копированию и освещению рукописей, продолжающая традицию создания Келлской книги." #NT!
 nd_drd_clan_hall: "Холл Клана" #NT!
 nd_drd_clan_hall_desc: "Место сбора главы клана и его лидеров, где споры разрешаются по законам бреонов, заключаются союзы за медом и управляются делами клана." #NT!
 nd_drd_galley_haven: "Галлей-Хейвен" #NT!
 nd_drd_galley_haven_desc: "Защищенная прибрежная стоянка, оборудованная эллингами и ремонтными базами для галерного флота «Бирлинн», служащая одновременно военно-морской базой и центром прибрежной торговли." #NT!
 nd_drd_drove_station: "Станция Дров" #NT!
 nd_drd_drove_station_desc: "Промежуточные станции вдоль дорог, проезжавших скот, где стада отдыхают, поят и продаются, соединяя пасторальную экономику Хайленда с низинными и зарубежными рынками." #NT!
 nd_drd_dun_maintenance: "Дун Содержание" #NT!
 nd_drd_dun_maintenance_desc: "Поддержание каменных стен, частоколов и оружейных складов крепости на вершине холма." #NT!
 nd_drd_cattle_tribute: "Переработка дани крупного рогатого скота" #NT!
 nd_drd_cattle_tribute_desc: "Переработка дани скота в выделанную кожу, соленые шкуры и жир для гарнизона и торговли." #NT!
 nd_drd_scriptorium_maintenance: "Содержание скрипториума" #NT!
 nd_drd_scriptorium_maintenance_desc: "Снабжение писцов пергаментом, пигментами и свечами из пчелиного воска для их кропотливой работы." #NT!
 nd_drd_manuscript_production: "Освещение рукописей" #NT!
 nd_drd_manuscript_production_desc: "Производство иллюминированных рукописей в кельтской традиции, сочетающих замысловатые узоры с религиозными и научными текстами." #NT!
 nd_drd_clan_hall_maintenance: "Содержание Холла Клана" #NT!
 nd_drd_clan_hall_maintenance_desc: "Поддержание лесного зала, приготовление пиров для приезжих членов клана и поддержание потока меда на собраниях совета." #NT!
 nd_drd_highland_wool: "Хайлендское шерстяное ткачество" #NT!
 nd_drd_highland_wool_desc: "Ткачество характерной хайлендской ткани из богатой шерсти горных овец, окрашенной в тартаны и пледы гэльских кланов." #NT!
 nd_drd_galley_haven_maintenance: "Содержание Галеры-Хейвена" #NT!
 nd_drd_galley_haven_maintenance_desc: "Поддержание стапелей, запасов смолы и такелажа, необходимых для поддержания мореходного флота Бирлинна." #NT!
 nd_drd_drove_station_maintenance: "Содержание станции Дров" #NT!
 nd_drd_drove_station_maintenance_desc: "Поддержание вольеров, поилок и складов, необходимых для поддержания торговли скотом." #NT!
 nd_drd_hide_tanning: "Дубление шкур Хайленда" #NT!
 nd_drd_hide_tanning_desc: "Засолка и дубление шкур крупного рогатого скота от погонной торговли, производство кожи для экспорта на равнинные и континентальные рынки." #NT!
 a_nd_drd_kern: "Керн-Стрельцы" #NT!
 a_nd_drd_kern_desc: "Легконогая пехота, вооружённая дротиками и короткими мечами, керны — это ударные отряды гэльской войны: быстрые, свирепые и совершенно бесстрашные." #NT!
 a_nd_drd_ceithern: "Цейтерн-на-Койле" #NT!
 a_nd_drd_ceithern_desc: "Лесные воины, которые используют леса и пересеченную местность западного Хайленда для разрушительных последствий, устраивая засады на врагов в местах, где тяжелая броня является помехой." #NT!
 n_nd_drd_war_galley: "Далриадская боевая галера" #NT!
 n_nd_drd_war_galley_desc: "Специально построенный военный корабль, сочетающий в себе мелкую осадку и скорость традиционного «Бирлинна» с установленной пушкой, предназначенный для рейдов и прибрежных войн на усеянном островами западном побережье." #NT!
 levy_nd_drd_kern: "Керн Леви" #NT!
 levy_nd_drd_kern_desc: "Группа легконогих кернов-застрельщиков, набранных из земель клана, сражающихся в традициях быстрых набегов гэльского запада." #NT!
 levy_nd_drd_ceithern: "Кейтерн Леви" #NT!
 levy_nd_drd_ceithern_desc: "Лесной набор воинов-засадников, набранных в лесных долинах и обученных тактике «нападай и исчезай», как в западном Хайленде." #NT!
 nd_drd_formed_tt: "Сформирован #bold Далриада#!" #NT!
 nd_drd_path_a_tt: "Выберите судьбу #bold Tides of Dominion#!" #NT!
 nd_drd_path_b_tt: "Выберите судьбу #bold Пламени обучения#!." #NT!
 nd_drd_destiny: "Судьба Далриады" #NT!
 nd_drd_destiny_desc: "Восстановленное королевство стоит на перепутье своей судьбы. Древняя резиденция Дунадда манит, и сенела ждут видения своего правителя этого королевства." #NT!
 nd_drd.5.t: "Видение Сверхкороля" #NT!
 nd_drd.5.d: "С вершины Дунадда, где в живой скале высечен след инаугурации, мы обозреваем царство, которое есть, и царство, которое может быть. Морские дороги тянутся во всех направлениях: на запад к открытой Атлантике, на север к скандинавским землям, на восток к материковой Шотландии, на юг к Ирландии. Вопрос не в том, поднимется ли Дальриада, а в том, насколько высоко." #NT!
 nd_drd.5.a: "Наша судьба ждет" #NT!
 nd_drd_dest_northern_isles: "Обеспечение безопасности Северных островов" #NT!
 nd_drd_dest_northern_isles_desc: "Чтобы командовать западными морями, Далриада должна сначала контролировать проливы и проходы, охраняющие северные подходы. Оркнейские острова и побережье Лотиана — ключи к этому владычеству." #NT!
 nd_drd.6.t: "Северный проход под защитой" #NT!
 nd_drd.6.d: "Корабли Далриады теперь патрулируют воды вокруг Оркнейских островов, а наше знамя реет над Эдинбургской скалой. Скандинавские ярлы, которые когда-то безнаказанно совершали набеги на наши побережья, теперь относятся к нам как к равным. Пентленд-Ферт (коварный пролив между Шотландией и Оркнейскими островами) находится под нашим контролем.\n\nПоскольку северные подходы защищены, перед нами открыто западное побережье. Ни один корабль не проходит между Атлантикой и Северным морем без разрешения Далриада." #NT!
 nd_drd.6.a: "Морские дороги в нашем распоряжении" #NT!
 nd_drd_dest_western_seas: "Командование западных морей" #NT!
 nd_drd_dest_western_seas_desc: "Обезопасив северные проходы, Дальриада направляет свои флоты к более широкому горизонту. Скандинавские порты и английское побережье должны признать господство Далриадов над западными морями." #NT!
 nd_drd.7.t: "Хозяева Западного моря" #NT!
 nd_drd.7.d: "Дальриадские корабли простираются от Ставангера до Йорка, от Фарерских островов до Ирландского моря. То, что начиналось как разбросанное островное королевство, превратилось в морскую державу, соперничающую со норвежским и английским флотами. Наших бирлиннов боятся в каждой гавани от Норвегии до Нортумбрии.\n\nНо как нам использовать это владычество? Некоторые капитаны призывают продолжать набеги: старая гэльская традиция грабежа и славы. Другие видят более ценную выгоду в контроле над морскими путями, взимании пошлин и установлении торговых монополий." #NT!
 nd_drd.7.a: "Пусть наши рейдеры обнажают берега" #NT!
 nd_drd.7.b: "Контролируйте торговые пути, контролируйте богатство" #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_sea_raider: "Бич берегов" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_sea_raider: "Далриадские рейдеры терроризируют побережья Северной Европы, нанося быстрые удары и исчезая прежде, чем можно будет организовать какой-либо ответ." #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_trade_hegemon: "Лорды морских путей" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_trade_hegemon: "Дальриада контролирует жизненно важные морские пути Северной Атлантики, взимая пошлину с каждого торгового судна, проходящего через ее воды." #NT!
 nd_drd_dest_atlantic_lord: "Лорд Атлантики" #NT!
 nd_drd_dest_atlantic_lord_desc: "Конечная цель морских королей: господство над Атлантикой от Фарерских островов до норвежского побережья, что сделает Далриаду бесспорным хозяином северных морей." #NT!
 nd_drd.8.t: "Лорд Атлантики" #NT!
 nd_drd.8.d: "От Торсхавна до Бергена, от Гебридских островов до Оркнейских островов знамя Дальриады реет над каждой гаванью и мысом Северной Атлантики. Того, чего скандинавы достигли за столетия набегов и поселений, Дальриада достигла благодаря единству своих гэльских мореходных традиций.\n\nТеперь вопрос в том, какую форму примет это атлантическое владычество. Должны ли мы построить непобедимый военный флот, чтобы защитить наше обширное морское царство силой оружия? Или нам следует объединить эти обширные территории в настоящую Атлантическую империю, с поселенцами и администраторами, привязывающими острова к короне?" #NT!
 nd_drd.8.a: "Постройте флот, чтобы затемнить горизонт" #NT!
 nd_drd.8.b: "Объедините атлантические острова в одно царство" #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_storm_fleet: "Штормовой флот" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_storm_fleet: "Дальриада располагает самыми грозными военно-морскими силами в Северной Атлантике, флотом, закаленным атлантическими штормами и укомплектованным лучшими гэльскими моряками." #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_atlantic_empire: "Атлантическая Империя" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_atlantic_empire: "Далриадские поселенцы и администраторы объединяют разрозненные атлантические острова в единое королевство, простирающееся от Фарерских островов до норвежского побережья." #NT!
 nd_drd_dest_monastic_revival: "Монашеское возрождение" #NT!
 nd_drd_dest_monastic_revival_desc: "Возрождение научной традиции Ионы требует институциональной основы. Развитие банковского дела обеспечивает богатство, которое можно использовать для финансирования монастырей и скрипторий по всему королевству." #NT!
 nd_drd.9.t: "Скриптория возрождается" #NT!
 nd_drd.9.d: "По островам и долинам Далриады снова раздается эхо звука пера по пергаменту. В скрипториях с каменными стенами, согреваемых торфяными кострями, монахи и ученые копируют древние тексты, освещают рукописи замысловатыми узорами своих предков и сочиняют новые произведения на гэльском языке.\n\nТрадиция, давшая миру Келлскую книгу и Книгу Дарроу, снова живет: не как антикварная имитация, а как живая научная культура, которая взаимодействует с более широким миром европейского образования." #NT!
 nd_drd.9.a: "Пусть свет обучения засияет вновь" #NT!
 nd_drd_dest_gaelic_letters: "Гэльские буквы" #NT!
 nd_drd_dest_gaelic_letters_desc: "Распространение книгопечатания преобразует монашескую традицию Далриады в более широкую литературную культуру, создавая произведения, доносящие гэльскую мысль до континентальной аудитории." #NT!
 nd_drd.10.t: "Гэльская пресса" #NT!
 nd_drd.10.d: "Появление печатного станка в Далриаде совершает революцию. Если раньше на создание одной рукописи уходили месяцы кропотливого труда, то теперь сотни экземпляров можно изготовить за недели. Бардские школы и монастырские скриптории быстро адаптируются, рассматривая прессу не как угрозу своей традиции, а как ее воплощение.\n\nГэльские грамматики, истории и поэзия льются из новых печатных машин. Но по поводу направления этого литературного расцвета не утихают споры. Бардские школы выступают за сохранение классических слоговых традиций, в то время как монашеские ученые выступают за более широкое взаимодействие с европейским миром." #NT!
 nd_drd.10.a: "Сохранить бардовскую традицию в печати" #NT!
 nd_drd.10.b: "Распространяйте наше обучение через монашеские сети" #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_bardic_tradition: "Наследие файла" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_bardic_tradition: "Бардские школы сохраняют и пропагандируют классическую гэльскую литературную традицию посредством новых средств печати, поддерживая культурную преемственность и одновременно охватывая более широкую аудиторию." #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_monastic_network: "Монашеское Содружество" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_monastic_network: "Далриадские монастыри образуют сеть обучения, простирающуюся по всей Северной Европе, обмениваясь текстами и учеными в традиции странствования Колумбы." #NT!
 nd_drd_dest_light_of_west: "Свет Запада" #NT!
 nd_drd_dest_light_of_west_desc: "Краеугольный камень традиции Ионы: Дальриада становится маяком знаний, чьи ученые и институты конкурируют с любыми в Европе, доказывая, что гэльский мир может проложить путь в эпоху разума." #NT!
 nd_drd.11.t: "Свет западного мира" #NT!
 nd_drd.11.d: "Тем, чем была Иона в Темные века, Дальриада стала в эпоху науки и разума. Его колледжи выпускают ученых, чьи работы читают от Эдинбурга до Константинополя. Ее типографии распространяют знания на гэльском, латыни и современных языках. Его монастырские библиотеки (потомки скрипторий, которые сохранили цивилизацию в самые темные часы Европы) теперь содержат коллекции, которые могут соперничать с великими континентальными университетами.\n\nЭтот интеллектуальный расцвет должен теперь найти свое самое полное выражение. Должны ли мы направить нашу научную энергию на великое возрождение самой гэльской культуры? Или мы откроем двери в более широкий мир, превратив Далриаду в перекресток универсальных знаний?" #NT!
 nd_drd.11.a: "Гэльский ренессанс на века" #NT!
 nd_drd.11.b: "Станьте перекрестком всех знаний" #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_gaelic_renaissance: "Гэльский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_gaelic_renaissance: "Сознательный расцвет гэльской культуры во всех ее формах (литература, музыка, право и философия) утверждает непреходящую жизнеспособность кельтской традиции." #NT!
 STATIC_MODIFIER_NAME_nd_drd_dest_wisdom_tradition: "Традиция мудрости" #NT!
 STATIC_MODIFIER_DESC_nd_drd_dest_wisdom_tradition: "Далриада становится универсальным центром обучения, где собираются ученые всех традиций, чтобы поделиться знаниями, как это было когда-то в великую монашескую эпоху." #NT!
 nd_drd_birlinn_arsenal: "Бирлинн Арсенал" #NT!
 nd_drd_birlinn_arsenal_desc: "Великая военно-морская верфь и арсенал, предназначенные для строительства и оснащения далриадского военного флота, сочетающие традиционное гэльское мастерство строительства галер с современными военно-морскими технологиями." #NT!
 nd_drd_birlinn_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_drd_birlinn_arsenal_maintenance_desc: "Обслуживание эллингов, кузниц и складов древесины королевского военно-морского арсенала." #NT!
 nd_drd_great_library: "Великая библиотека Далриады" #NT!
 nd_drd_great_library_desc: "Грандиозное хранилище знаний в традициях Ионы, в котором хранятся рукописи, печатные тома и научные труды со всего известного мира." #NT!
 nd_drd_great_library_maintenance: "Содержание библиотеки" #NT!
 nd_drd_great_library_maintenance_desc: "Поддержание коллекций, наем писцов и ученых, а также приобретение новых произведений для библиотеки." #NT!
  
  # === BUREAUCRACIES === 
  
 AUTO_MODIFIER_NAME_nd_drd_bureaucracy_authority: "Власть Возрожденного Королевства" #NT!
 AUTO_MODIFIER_DESC_nd_drd_bureaucracy_authority: "Восстановленная далриадская корона объединяет институциональное наследие гэльского и островного мира: списочные списки сенчу, суды бритеамхов, совет в Финлаггане, паручии Ионы. Два слота предоставляются при формировании; в столице добавляется еще один, так что три из этих старых офисов можно сохранить одновременно." #NT!
  
 senchus_fer_nalban_bureaucracy: "Сенчус фер нАльбан" #NT!
 senchus_fer_nalban_bureaucracy_desc: "«Сенчус фер нАльбан» («История людей Шотландии»), составленная в седьмом веке и сохранившаяся в редакции десятого века, представляла собой одновременно генеалогический список и реестр военно-морских сборов. Он предписывал два семиместных корабля от каждых двадцати семей Сенела - обязательство, уникальное среди королевств Британии. Возрожденные как сборная единица возрожденного морского королевства, Сенчу превращают географию побережья и островов Далриады в постоянную рабочую силу флота по призыву верховного короля." #NT!
  
 brehon_law_court_bureaucracy: "Суд Брейтеама" #NT!
 brehon_law_court_bureaucracy_desc: "Брейтеамхи, потомственные юристы гэльской Ирландии и Хайленда, в течение двадцати лет обучались обычному праву сенчус мор. Они сидели под открытым небом, решая претензии по скоту, выплате Эрика и споры о наследстве на основании прецедента, а не королевского указа. Их суды действовали параллельно с королевскими, поглощали обиды, которые в противном случае переросли бы в восстание, и просуществовали в гэльской Ирландии до семнадцатого века, пока дело Танистри не отменило их в 1608 году." #NT!
  
 council_of_the_isles_bureaucracy: "Совет островов" #NT!
 council_of_the_isles_bureaucracy_desc: "С момента своего первого устава при Джоне Айлейском до конфискации при Якове IV в 1493 году Комхайрле нан Эйлин встречался на Эйлин-на-Комхайрле в Лох-Финлаггане. Четыре великих вождя (Маклины из Дуарта и Лохбуи и Маклеоды из Харриса и Льюиса), четыре младших тана и четыре родственника клана Дональд совещались под председательством лорда, разрешали споры между кланами и оказывали дипломатическое и военное влияние светлости. Совет был наиболее развитым парламентом в гэльской Британии, и его восстановление накладывает на корону те же ограничения, какие его средневековая форма налагала на Лорда островов." #NT!
  
 buannacht_quartering_bureaucracy: "Буаннахт и Коиннмхед" #NT!
 buannacht_quartering_bureaucracy_desc: "Буаннахт, который английские поселенцы называли бонахт, был цессом, с помощью которого гэльские вожди расквартировывали свои виселицы и домашние войска на туате. В корпусе Брегона эта практика была известна как коиннмхед; англо-нормандские источники передают его как койну и ливрею. Говядина, эль, овес и жилье кормили постоянную свиту, даже не проходя через казну, и сильный военачальник мог требовать этого так часто, как у него были солдаты, чтобы обеспечить это. Это был единственный и самый важный налог в позднесредневековой Ирландии и Гебридских островах, а также главный инструмент, с помощью которого вожди держали свои армии на спине страны." #NT!
  
 paruchia_of_iona_bureaucracy: "Паручия Ионская" #NT!
 paruchia_of_iona_bureaucracy_desc: "Парухия Колумба была федерацией монастырей, основанной на Ионе под преемственностью игумена Колума Килле (Св. Колумба, ум. 597), простирающейся через Аргайл, Гебриды и Северную Ирландию. Оно не приняло территориальную епархиальную форму римского христианства; это была личная и монашеская сеть, через которую научные знания, иллюстрированные рукописи и церковная власть возвращались в материнский дом на Ионе. И «Анналы Ольстера», и «Келлская книга» были продуктом его скрипторий, а его распад на наследственные мирские аббатства (коарбы и эренаги) является предостережением о том, что любой клерикальный институт остается без поддержки." #NT!
