l_russian:
 STATIC_MODIFIER_NAME_nd_tres_garantias: "Три гарантии" #NT!
 STATIC_MODIFIER_DESC_nd_tres_garantias: "Три священных столпа Плана де Игуала (Религия, Независимость и Союз) объединяют различные народы Мексики в единую нацию под знаменем порядка и традиций." #NT!
 STATIC_MODIFIER_NAME_nd_grito_de_dolores: "Плач Долорес" #NT!
 STATIC_MODIFIER_DESC_nd_grito_de_dolores: "Революционный дух Идальго и Морелоса продолжает жить. Мексика — это страна, созданная в результате народного восстания, где суверенитет народа выходит за рамки старого колониального порядка." #NT!
 nd_mex.1.t: "Рождение Мексики" #NT!
 nd_mex.1.d: "Новая нация восстает из пепла трех столетий колониального правления. Земля, которая когда-то была Новой Испанией (ее серебряные рудники, гасиенды, соборы, сотни народов), теперь должна найти свой собственный путь. Два видения конкурируют за душу новой республики. Консерваторы обращают внимание на План де Игуала и его три гарантии: главенство католической веры, абсолютную независимость от Испании и союз всех народов независимо от происхождения, упорядоченный переход под руководством армии и церкви. Либералы взывают к Grito de Dolores, полуночному кличу отца Идальго, положившему начало десятилетию народной революции, Мексике, построенной на суверенитете простых людей, где колониальные привилегии сметены, а снизу поднимается новый республиканский порядок.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mex.1.a: "Религия, Независимость, Союз: Три гарантии должны стать нашей основой." #NT!
 nd_mex.1.b: "Крик Долорес звучит до сих пор: народная революция продолжается!" #NT!
 STATIC_MODIFIER_NAME_nd_mex_bourbon_reform_centralize: "Система обслуживания" #NT!
 STATIC_MODIFIER_DESC_nd_mex_bourbon_reform_centralize: "Административные реформы Бурбонов централизовали управление через систему интендантства, заменив старую сеть мэров-алькальдов профессиональными администраторами, которые подчиняются непосредственно короне." #NT!
 STATIC_MODIFIER_NAME_nd_mex_bourbon_reform_trade: "Указ о свободной торговле" #NT!
 STATIC_MODIFIER_DESC_nd_mex_bourbon_reform_trade: "Либерализация правил колониальной торговли открыла новые порты и торговые маршруты, сломав старую монопольную систему и позволив мексиканским купцам торговать более свободно." #NT!
 STATIC_MODIFIER_NAME_nd_mex_la_reforma_secular: "Законы реформы" #NT!
 STATIC_MODIFIER_DESC_nd_mex_la_reforma_secular: "Законы о реформе разделили церковь и государство, национализировали церковную собственность, установили гражданский брак и светские кладбища, заложив правовую основу современной республики." #NT!
 STATIC_MODIFIER_NAME_nd_mex_la_reforma_national: "Дух Хуареса" #NT!
 STATIC_MODIFIER_DESC_nd_mex_la_reforma_national: "Решимость Бенито Хуареса защищать национальный суверенитет от любого иностранного вмешательства сформировала патриотический дух, который выходит за рамки классовой и этнической принадлежности." #NT!
 nd_mex.2.t: "Реформы Бурбона" #NT!
 nd_mex.2.d: "Династия Бурбонов внесла радикальные изменения в управление Новой Испанией. Старая габсбургская система непрямого правления через местные элиты и церковных посредников заменяется рационализированной бюрократией, призванной получать больше доходов и ужесточать контроль метрополии. Система интендантства заменяет лоскутное одеяло коррегидоров и алькальдов мэров профессиональными администраторами. Ослабляются ограничения на колониальную торговлю. Военные становятся профессионализированными. Эти реформы укрепят государство, но они также рискуют оттолкнуть креольскую элиту, которая долгое время пользовалась автономией при старой системе. Вопрос в том, следует ли полностью принять централизацию или сосредоточить реформы на коммерческой экспансии." #NT!
 nd_mex.2.a: "Централизуйте управление: эффективность требует порядка." #NT!
 nd_mex.2.b: "Откройте порты: процветание происходит через свободную торговлю." #NT!
 nd_mex.3.t: "Ла Реформа" #NT!
 nd_mex.3.d: "Бенито Хуарес, сапотекский адвокат из Оахаки, стал символом либеральной революции в Мексике. Законы о реформе 1850-х годов представляют собой самую радикальную трансформацию мексиканского общества со времени обретения независимости: Лей Хуарес отменяет военные и клерикальные фуэрос, особые юридические привилегии, которые ставили солдат и священников выше гражданского закона. Лей Лердо приказывает продать церковные земли, не используемые для богослужений. Конституция 1857 года устанавливает настоящий билль о правах и ставит армию под гражданский контроль. Церковь отлучила от церкви всех чиновников, поклявшихся поддерживать конституцию, а консервативные генералы взяли в руки оружие. Мексика стоит на перепутье между светской современностью и традиционным порядком." #NT!
 nd_mex.3.a: "Отделение церкви от государства должно быть абсолютным." #NT!
 nd_mex.3.b: "Национальный суверенитет превыше всего: ни одна иностранная держава не может диктовать нашу судьбу." #NT!
 nd_mex.4.t: "Серебряная революция" #NT!
 nd_mex.4.d: "На рудниках Сакатекаса прорыв в металлургии трансформирует колониальную экономику. Бартоломе де Медина разработал метод патио — амальгамацию ртути, применяемый в промышленных масштабах, который позволяет извлекать серебро из руд, которые раньше были слишком бедны для обработки. Воздействие ошеломляет. Производство серебра стремительно растет, и мексиканские песо начинают циркулировать по всему миру, от рынков Севильи до шелковых магазинов Манилы, от счетных домов Амстердама до чайных домов Кантона. Новая Испания становится двигателем первой в мире по-настоящему глобальной экономики, а серебряное песо становится первой в мире международной валютой." #NT!
 nd_mex.4.a: "Мексиканское серебро потечет во все уголки мира." #NT!
 nd_mex.5.t: "Крик Долорес" #NT!
 nd_mex.5.d: "Рано утром 16 сентября 1810 года в маленьком городке Долорес в Бахио отец Мигель Идальго-и-Костилья звонит в церковный колокол, чтобы созвать своих прихожан. То, что он провозглашает в то утро, разнесется по векам: смерть плохому правительству, смерть гачупинам, да здравствует Дева Гваделупская. Через несколько дней разношерстная армия из десятков тысяч человек (метисы, коренные народы, шахтеры, крестьяне) марширует на Гуанахуато, затем на Сан-Луис-Потоси, а затем на сам Мехико. Восстание продлится одиннадцать лет, унесет сотни тысяч жизней и создаст нацию, непохожую ни на одну страну, которую видел мир: не полностью испанскую и не полностью коренную, а нечто совершенно новое." #NT!
 nd_mex.5.a: "Новая нация рождается из мужества народа." #NT!
 nd_mex_encomienda_system: "Система Энкомьенда" #NT!
 nd_mex_encomienda_system_desc: "Энкомьенда дает испанским поселенцам право получать рабочую силу и дань от коренных общин, создавая основы колониального сельского хозяйства и горнодобывающей промышленности." #NT!
 nd_mex_silver_mining: "Революция в добыче серебра" #NT!
 nd_mex_silver_mining_desc: "Развитие амальгамации ртути меняет добычу серебра, превращая Мексику в крупнейшего в мире производителя серебра, а ее валюту в первое глобальное средство обмена.\n\n#italic Доступно в: $nd_mex_hacienda_grande$#!" #NT!
 nd_mex_cochineal_trade: "Кошениль Трейд" #NT!
 nd_mex_cochineal_trade_desc: "Кошенильный краситель из кактуса нопал становится вторым по значимости экспортным товаром Мексики, производя яркий малиновый цвет, который окрашивает мантии европейских монархов и кардиналов." #NT!
 nd_mex_viceregal_administration: "Вице-королевская администрация" #NT!
 nd_mex_viceregal_administration_desc: "Аудиенсия, вице-король и Реал Гасиенда образуют институциональную основу Новой Испании, управляя территорией, простирающейся от Центральной Америки до Филиппин." #NT!
 nd_mex_colegio_tradition: "Коледжио Традиция" #NT!
 nd_mex_colegio_tradition_desc: "Основание колледжей и Королевского и Папского университета Мексики создает особую интеллектуальную традицию, сочетающую европейскую схоластику с опытом Нового Света." #NT!
 nd_mex_hacienda_system: "Система Гасиенда" #NT!
 nd_mex_hacienda_system_desc: "Крупные сельскохозяйственные поместья сочетают в себе сельское хозяйство, скотоводство и иногда горнодобывающую промышленность, чтобы прокормить колониальную экономику, становясь доминирующим институтом сельской Мексики." #NT!
 nd_mex_casta_society: "Общество Каста" #NT!
 nd_mex_casta_society_desc: "Сложная расовая систематика колониальной Мексики (испанцы, креолы, метисы, мулаты и десятки других категорий) парадоксальным образом создает общество поразительной культурной изменчивости и синтеза." #NT!
 nd_mex_silver_peso: "Серебряное песо" #NT!
 nd_mex_silver_peso_desc: "Мексиканское песо де очо, восьмерка, становится первой в мире глобальной валютой, принимаемой от Кантона до Константинополя." #NT!
 nd_mex_manila_galleon_trade: "Манильский Галеон Трейд" #NT!
 nd_mex_manila_galleon_trade_desc: "Нао-де-Китай соединяет Акапулько с Манилой, доставляя мексиканское серебро в Азию и возвращаясь с шелком, специями и фарфором по первому в мире транстихоокеанскому торговому маршруту." #NT!
 nd_mex_presidio_line: "Президио Лайн" #NT!
 nd_mex_presidio_line_desc: "Цепь укреплённых гарнизонов тянется через северную границу, защищая населенную территорию от команчей, апачей и других местных налётчиков." #NT!
 nd_mex_soldados_de_cuera: "Сольдадос-де-Куэра" #NT!
 nd_mex_soldados_de_cuera_desc: "Драгуны пограничных президиумов в кожаных доспехах — уникальная мексиканская военная традиция: кавалерия, вооруженная копьем, щитом и мушкетом, адаптированная к суровым условиям северных приграничья." #NT!
 nd_mex_baroque_identity: "Мексиканское барокко" #NT!
 nd_mex_baroque_identity_desc: "Ультра-богатый стиль чурригереско сочетает в себе испанское барокко с местными художественными традициями, создавая соборы и общественные здания, олицетворяющие метисовую душу Мексики." #NT!
 nd_mex_bourbon_reforms: "Реформы Бурбона" #NT!
 nd_mex_bourbon_reforms_desc: "Широкие административные реформы династии Бурбонов (система интендантства, либерализация торговли, профессионализация вооруженных сил) модернизируют Новую Испанию, но сеют семена креольского недовольства." #NT!
 nd_mex_mining_boom: "Горнодобывающий бум" #NT!
 nd_mex_mining_boom_desc: "Добыча серебра в промышленных масштабах на великих рудниках Гуанахуато и Сакатекас генерирует богатство, которое течет по всему миру, делая Новую Испанию самой богатой колонией в Америке.\n\n#italic Доступно в: $nd_mex_hacienda_grande$#!" #NT!
 nd_mex_criollo_consciousness: "Сознание Криолло" #NT!
 nd_mex_criollo_consciousness_desc: "Испанцы мексиканского происхождения развивают особую идентичность, гордость за свою американскую родину и недовольство привилегиями полуострова, что является интеллектуальной основой движения за независимость." #NT!
 nd_mex_independence_movement: "Движение за независимость" #NT!
 nd_mex_independence_movement_desc: "От Грито Идальго до Конгресса Чильпансинго Морелоса и партизанских кампаний Герреро — движение за независимость выковывает новую национальную идентичность в течение десятилетия революционной войны." #NT!
 nd_mex_guerrilla_tradition: "Партизанская традиция" #NT!
 nd_mex_guerrilla_tradition_desc: "Повстанцы-партизаны, метисы и боевики из числа коренного населения, которые вели нерегулярную войну против сил роялистов, создают мексиканскую военную традицию народного сопротивления, которая сохраняется на протяжении поколений." #NT!
 nd_mex_plan_de_iguala: "План де Игуала" #NT!
 nd_mex_plan_de_iguala_desc: "План трех гарантий объединяет восставших республиканцев и консерваторов-роялистов, создавая широкую коалицию, которая достигает независимости путем переговоров, а не завоеваний." #NT!
 nd_mex_constitution_1824: "Конституция 1824 года" #NT!
 nd_mex_constitution_1824_desc: "Первая республиканская конституция Мексики устанавливает федеральную систему, частично смоделированную по образцу Соединенных Штатов, с выборными представителями, разделением властей и суверенитетом, принадлежащим нации." #NT!
 nd_mex_pulque_industry: "Пульке Индустрия" #NT!
 nd_mex_pulque_industry_desc: "Коммерческое выращивание магуэя и промышленное производство пульке превращают древний священный напиток в одну из важнейших отраслей промышленности Мексики.\n\n#italic Доступно в: $nd_mex_hacienda_grande$#!" #NT!
 nd_mex_la_reforma: "Ла Реформа" #NT!
 nd_mex_la_reforma_desc: "Законы о реформе Бенито Хуареса отменяют клерикальные и военные привилегии, национализируют церковную собственность и устанавливают разделение церкви и государства, что является самой радикальной трансформацией мексиканского общества со времен обретения независимости." #NT!
 nd_mex_rurales_corps: "Корпус Руралес" #NT!
 nd_mex_rurales_corps_desc: "Корпус Руралес, конная сельская полиция в украшенной серебром форме, патрулирует сельскую местность в качестве жандармерии, поддерживая порядок на обширных сельских территориях Мексики." #NT!
 nd_mex_mestizo_nation: "Метисы нации" #NT!
 nd_mex_mestizo_nation_desc: "Мексика принимает метисы (смесь коренного, европейского и африканского наследия) как определяющий принцип национальной идентичности, создавая общество, которое выходит за рамки расовых категорий колониальной эпохи." #NT!
 nd_mex_nationalization: "Национализация" #NT!
 nd_mex_nationalization_desc: "Захват и перераспределение церковных земель и утверждение государственного суверенитета над церковной собственностью создают более светское, централизованное государство с расширенными налоговыми поступлениями." #NT!
 nd_mex_industrialization: "Мексиканская индустриализация" #NT!
 nd_mex_industrialization_desc: "Строительство железных дорог, текстильное производство и модернизация горнодобывающей промышленности начинают превращать Мексику из аграрной экономики в индустриальную." #NT!
 nd_mex_veracruz_trade: "Веракрус Трейд" #NT!
 nd_mex_veracruz_trade_desc: "Порт Веракрус, ворота Мексики в Атлантику и Карибский бассейн, становится центром расширяющейся морской торговли, связывающей мексиканский экспорт с мировыми рынками." #NT!
 nd_mex_federalist_republic: "Федералистская Республика" #NT!
 nd_mex_federalist_republic_desc: "Федеральная система предоставляет автономию различным штатам и регионам Мексики, балансируя центральную власть с местным управлением в огромной и неоднородной стране." #NT!
 a_nd_mex_soldados_de_cuera: "Сольдадос-де-Куэра" #NT!
 a_nd_mex_soldados_de_cuera_desc: "Пограничные драгуны в кожаных доспехах, вооруженные копьем, щитом и мушкетом. Эта президентская кавалерия, рожденная и выросшая на северной границе, закалена десятилетиями войн против налетчиков команчей и апачей." #NT!
 a_nd_mex_guerrilleros: "Повстанцы-партизаны" #NT!
 a_nd_mex_guerrilleros_desc: "Нерегулярные бойцы движения за независимость, крестьяне-метисы, шахтеры и воины из числа коренных народов, ведущие партизанскую войну в горах и барранках центральной Мексики." #NT!
 a_nd_mex_rurales: "Руралес" #NT!
 a_nd_mex_rurales_desc: "Корпус Руралеса - конная сельская жандармерия в характерной униформе с серебряной отделкой. Быстрая легкая кавалерия, патрулирующая сельскую местность, подавляющая бандитизм и обеспечивающая соблюдение закона на обширных сельских территориях Мексики." #NT!
 n_nd_mex_manila_galleon: "Манильский галеон" #NT!
 n_nd_mex_manila_galleon_desc: "«Нао-де-Китай» — огромные корабли с сокровищами, которые курсируют по маршруту Акапулько-Манила, перевозя мексиканское серебро на запад и возвращаясь с азиатским шелком, специями и фарфором. Крупнейшие и богатейшие торговые суда Тихого океана." #NT!
 nd_mex_casa_de_moneda: "Каса де Монеда" #NT!
 nd_mex_casa_de_moneda_desc: "Королевский монетный двор чеканит мексиканское серебро в песо де очо, восьмерку, которая обращается как первая в мире глобальная валюта от рынков Кантона до счетных домов Амстердама." #NT!
 nd_mex_hacienda_grande: "Гасиенда Гранде" #NT!
 nd_mex_hacienda_grande_desc: "Великолепное сельскохозяйственное поместье, сочетающее в себе сельское хозяйство, скотоводство и сельскую промышленность. Гасиенда доминирует в сельской местности Мексики, обеспечивая продовольствием и сырьем, одновременно предоставляя работу сотням рабочих, связанных долговой кабалой." #NT!
 nd_mex_presidio: "Президио Фронтеризо" #NT!
 nd_mex_presidio_desc: "Укрепленный пограничный гарнизон, укомплектованный профессиональными солдатами. Президио защищает заселенную территорию от местных набегов и служит ядром цивилизации на северной границе." #NT!
 nd_mex_cochineal_obraje: "Кошениль Ображе" #NT!
 nd_mex_cochineal_obraje_desc: "Цех по переработке красителя кошенили из кактуса нопал в самый дорогой в мире пигмент, ценимый за окраску мантий европейских монархов и католических кардиналов." #NT!
 nd_mex_colegio_real: "Колледжио Реал" #NT!
 nd_mex_colegio_real_desc: "Королевский колледж, где испанская и коренная элита получает образование в области теологии, права и гуманитарных наук, создавая характерную мексиканскую интеллектуальную традицию." #NT!
 nd_mex_baroque_cathedral: "Барочный собор" #NT!
 nd_mex_baroque_cathedral_desc: "Великолепный собор Чурригереско в ультра-богатом стиле мексиканского барокко, сочетающий в себе испанскую церковную архитектуру с местными художественными мотивами и являющий собой яркое выражение культурной самобытности метисов." #NT!
 nd_mex_mint_operations: "Монетный двор" #NT!
 nd_mex_mint_operations_desc: "Мастера-серебряники чеканят из очищенного серебра изысканные монеты и изделия из драгоценных металлов, производя песо де очо, которые циркулируют по всему миру." #NT!
 nd_mex_hacienda_labor: "Гасиенда Лейбористская" #NT!
 nd_mex_hacienda_labor_desc: "Гасиенда поддерживает свою рабочую силу за счет животноводства, выращивания зерна и инструментов, необходимых для обработки земли." #NT!
 nd_mex_presidio_garrison: "Президио Гарнизон" #NT!
 nd_mex_presidio_garrison_desc: "Пограничный гарнизон нуждается в постоянном снабжении оружием, лошадьми, огнестрельным оружием и кожаным снаряжением для поддержания своей обороноспособности." #NT!
 nd_mex_cochineal_processing: "Кошениль Обработка" #NT!
 nd_mex_cochineal_processing_desc: "Рабочие собирают насекомых кошенили с полей кактусов Нопала, затем тщательно сушат и измельчают их в кармин, самый ценный краситель в мире." #NT!
 nd_mex_seminary_upkeep: "Содержание семинарии" #NT!
 nd_mex_seminary_upkeep_desc: "Колледжу требуются бумага и книги для обучения, ткань для мебели и облачений, а также свечи из пчелиного воска для учебы и церемоний." #NT!
 nd_mex_cathedral_upkeep: "Содержание собора" #NT!
 nd_mex_cathedral_upkeep_desc: "Поддержание сложных каменных фасадов, витражей и позолоченных интерьеров собора в стиле барокко требует постоянных инвестиций в камень, стекло, ткань для облачений и свечи из пчелиного воска." #NT!
 nd_mex_mercury_amalgamation: "Объединение ртути" #NT!
 nd_mex_mercury_amalgamation_desc: "В процессе патио ртуть распределяется по измельченной руде на огромных дворах, извлекая серебро из породы, которая раньше была слишком бедной для обработки." #NT!
 nd_mex_pulque_fermentation: "Ферментация пульке" #NT!
 nd_mex_pulque_fermentation_desc: "На полях Магуэй добывают агуамиэль, которую ферментируют в пульке, древний священный напиток ацтеков, который сейчас производится в коммерческих целях для растущего населения Мексики." #NT!
 levy_nd_mex_guerrilleros: "Повстанцы-партизаны" #NT!
 levy_nd_mex_guerrilleros_desc: "Нерегулярные бойцы, набранные из простых людей для ведения партизанской войны в защиту нации." #NT!
 nd_mex_industrial_refining: "Промышленное рафинирование серебра" #NT!
 nd_mex_industrial_refining_desc: "Haciendas de beneficio перерабатывает огромные объемы серебряной руды с помощью амальгамации ртути в промышленных масштабах, поставляя монетные дворы, производящие мировую валюту." #NT!
 n_nd_mex_guardacostas: "Корсарио Гуардакостас" #NT!
 n_nd_mex_guardacostas_desc: "Быстроходные прибрежные патрульные фрегаты, которые охраняют обширные побережья Мексиканского залива и Тихого океана от пиратов, контрабандистов и иностранных посягательств." #NT!
 nd_mex_formed_tt: "Мексика была образована" #NT!
 nd_mex_path_a_tt: "Выберите судьбу #bold Три Гарантии#!" #NT!
 nd_mex_path_b_tt: "Выберите судьбу #bold Плач Долорес#!" #NT!
 nd_mex_destiny: "Мексиканская судьба" #NT!
 nd_mex_destiny_desc: "Мексика была выкована в огне революции и под тяжестью колониального наследия. Теперь ему предстоит выбрать свой путь: империя или республика, завоевание или торговля, меч или серебряное песо." #NT!
 nd_mex_dest_northern_march: "Северный марш" #NT!
 nd_mex_dest_northern_march_desc: "Раздвиньте границу на обширных землях Аридоамерики. Обезопасьте Кулиакан и северную серебряную страну и установите военное господство над дикими пограничными территориями." #NT!
 nd_mex_dest_empire_of_anahuac: "Империя Анауак" #NT!
 nd_mex_dest_empire_of_anahuac_desc: "Распространите мексиканскую власть на пустыню Сонора и через Рио-Гранде. Повысьте профессионализм армии и создайте гарнизоны, которые распространят имперскую власть на окраины континента." #NT!
 nd_mex_dest_continental_destiny: "Континентальная судьба" #NT!
 nd_mex_dest_continental_destiny_desc: "Мексиканская империя простирается от Калифорнии до Гватемалы, от Персидского залива до Тихого океана. Континентальная держава, способная соперничать с любой страной Старого Света, обеспеченная величайшей армией Америки." #NT!
 nd_mex_dest_silver_republic: "Серебряная Республика" #NT!
 nd_mex_dest_silver_republic_desc: "Постройте республику на серебряной основе. Развивайте шахты, расширяйте рынки и позвольте мексиканским песо стать валютой Америки." #NT!
 nd_mex_dest_liberal_republic: "Либеральная Республика" #NT!
 nd_mex_dest_liberal_republic_desc: "Направьте богатство какао и серебра в банковские учреждения и торговые сети, которые служат людям. Модернизировать экономику посредством финансовой реформы и открытых рынков." #NT!
 nd_mex_dest_arsenal_of_democracy: "Арсенал демократии" #NT!
 nd_mex_dest_arsenal_of_democracy_desc: "Превратить Мексику из экспортера сырья в индустриальную республику. Займитесь наукой, постройте школы и докажите, что республика может соперничать с любой монархией в процветании и прогрессе." #NT!
 nd_mex.6.t: "Нация обретает форму" #NT!
 nd_mex.6.d: "Основы Нью-Мексико заложены. От серебряных рудников Бахио до рощ какао на побережье Персидского залива, от древних пирамид Теотиуакана до шумных рынков Оахаки — эта земля таит в себе потенциал величия. Вопрос не в том, поднимется ли Мексика, а в том, какую форму примет этот подъем." #NT!
 nd_mex.6.a: "Судьба Мексики ждет." #NT!
 nd_mex.7.t: "Северный марш" #NT!
 nd_mex.7.d: "Мексиканские солдаты маршируют на север за пределы старой линии президио, продвигаясь в обширную серебряную страну, которую народы Чичимека уже давно защищают. Кулиакан и северная граница теперь находятся под мексиканским орлом. Когда эти территории будут закреплены, казна увеличится, а армия станет сильнее." #NT!
 nd_mex.7.a: "Граница продвигается под орлом и змеем." #NT!
 nd_mex.8.t: "Империя Анауак" #NT!
 nd_mex.8.d: "Мексиканская империя теперь простирается от пустыни Сонора до берегов Рио-Гранде. Вопрос в том, как управлять этой расширенной сферой. Некоторые генералы советуют использовать железную руку: быстрые военные кампании, чтобы подавить любое сопротивление и укрепить центральную власть. Другие обращаются к модели «Плана Игуала» Итурбиде: большого суда, который связывает провинциальные элиты посредством дипломатии, почестей и совместного управления." #NT!
 nd_mex.8.a: "Правило дисциплинировано: империи нужна железная рука." #NT!
 nd_mex.8.b: "Завоевывайте сердца при дворе: дарованная преданность длится дольше." #NT!
 nd_mex.9.t: "Континентальная судьба" #NT!
 nd_mex.9.d: "От пустынь Калифорнии до джунглей Гватемалы Мексиканская империя стала доминирующей державой Западного полушария. Это видение реализовано: великая американская империя, которая будет равна любой европейской державе. Армия, которая обеспечила безопасность этой территории, теперь должна быть организована для ее защиты." #NT!
 nd_mex.9.a: "Постройте величайшую армию в Америке." #NT!
 nd_mex.9.b: "Пусть дипломатия закрепит завоеванное мечом." #NT!
 nd_mex.10.t: "Серебряный фонд" #NT!
 nd_mex.10.d: "Республика выбрала иной путь, чем пути строителей империи. Вместо того, чтобы собирать армии для завоеваний, Мексика обращается к богатствам, спрятанным под ее землей. Серебряные рудники Гуанахуато, Сакатекаса и Таско — основа процветающей республики." #NT!
 nd_mex.10.a: "Песо должно стать основой республики." #NT!
 nd_mex.11.t: "Либеральная Республика" #NT!
 nd_mex.11.d: "Финансовые институты молодой республики взрослеют. Банки регулируют поток серебра, торговцы какао договариваются о ценах на мировом рынке, а торговые сети простираются от Персидского залива до Тихого океана. Возникают два видения экономического будущего Мексики." #NT!
 nd_mex.11.a: "Серебряное песо станет стандартом." #NT!
 nd_mex.11.b: "Создавайте рынки, которые будут служить людям, а не избранным." #NT!
 nd_mex.12.t: "Арсенал демократии" #NT!
 nd_mex.12.d: "Мексика стоит на пороге новой эпохи. Научная революция достигла Америки, и у республики есть серебро, рабочая сила и институты для индустриализации. Школы растут по всей стране, и новое поколение мексиканских ученых и инженеров готовится превращать сырье в готовую продукцию." #NT!
 nd_mex.12.a: "Стройте школы: образование – это будущее." #NT!
 nd_mex.12.b: "Просвещенной республике не нужна империя." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_iron_hand: "Железная рука" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_iron_hand: "Военная дисциплина и быстрые кампании укрепляют власть Мексики по всей границе. Армия движется быстро и наносит сильные удары, хотя постоянные войны наносят ущерб нации." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_imperial_court: "Императорский двор" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_imperial_court: "Мексиканский суд, созданный по образцу европейских монархий, связывает провинциальные элиты посредством дипломатии, титулов и совместного управления. Суд многих народов, объединенных под орлом." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_continental_army: "Континентальная армия" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_continental_army: "Массивная постоянная армия, организованная по современным принципам, способная поддерживать операции по всему Западному полушарию." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_american_dynasty: "Американская династия" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_american_dynasty: "Мексиканская империя пользуется уважением благодаря дипломатическому престижу и династическим связям, распространяя свое влияние по всему полушарию." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_silver_standard: "Серебряный стандарт" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_silver_standard: "Мексиканское серебряное песо становится надежным стандартом торговли в полушарии, финансируя растущие традиции торгового флота и военно-морского флота." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_peoples_market: "Народный рынок" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_peoples_market: "Кооперативные банки и открытые рынки направляют серебряное богатство обычным гражданам. Содержание армии страдает, поскольку ресурсы перетекают в гражданские институты." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_industrial_dawn: "Индустриальный рассвет" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_industrial_dawn: "Мексиканские фабрики производят товары на экспорт через Тихий океан и за его пределы. Новый класс промышленников распространяет коммерческую мощь Мексики на отдаленные берега." #NT!
 STATIC_MODIFIER_NAME_nd_mex_dest_enlightened_republic: "Просвещенная Республика" #NT!
 STATIC_MODIFIER_DESC_nd_mex_dest_enlightened_republic: "Мексика подает пример: просвещенная республика, чья военно-морская мощь и дипломатическое мастерство заслужили уважение во всем мире." #NT!
 nd_mex_palacio_imperial: "Паласио Империал" #NT!
 nd_mex_palacio_imperial_desc: "Резиденция мексиканского императора, величественный дворец, достойный континентальной державы. Отсюда осуществляется управление империей и формируется судьба Америки." #NT!
 nd_mex_imperial_court: "Обслуживание Императорского Двора" #NT!
 nd_mex_imperial_court_desc: "Императорскому дворцу требуются прекрасные ткани для церемониальной обстановки, бумага для имперской бюрократии, мебель для парадных залов и инструменты для постоянного ремонта." #NT!
 nd_mex_escuela_nacional: "Эскуэла Насьональ" #NT!
 nd_mex_escuela_nacional_desc: "Национальная подготовительная школа, которая превращает мексиканскую молодежь в информированных граждан, воплощая приверженность республики всеобщему образованию и научному прогрессу." #NT!
 nd_mex_school_supplies: "Школьные принадлежности" #NT!
 nd_mex_school_supplies_desc: "Национальной школе необходимы бумага и книги для обучения, а также ткань для униформы и мебели." #NT!
  
  # ===== BUREAUCRACIES ===== 
 mex_plan_de_iguala_bureaucracy: "План де Игуала" #NT!
 mex_plan_de_iguala_bureaucracy_desc: "Три гарантии Итурбиде от 24 февраля 1821 года (Религия, Независимость, Союз) дали новому мексиканскому государству единственную широко принятую основополагающую доктрину, объединив полуостровных роялистов, либералов-криолло и войска каста под католически-монархическим-криолло-знаменем армии Тригаранте. Будучи устойчивым, он объединяет расово неоднородную нацию общими символами. Если пренебречь этим консенсусом, он расколется по тем самым линиям разлома, которые он скрыл." #NT!
 mex_patronato_eclesiastico_bureaucracy: "Патронато Эклесиастико" #NT!
 mex_patronato_eclesiastico_bureaucracy_desc: "Унаследованный от испанских Бурбонов, Настоящий Патронато дает мексиканскому государству право назначать епископов, собирать десятину и судить священнослужителей в церковных судах в соответствии с fuero eclesiastico. Церковь отвечает тем же, ссужая капитал по выгодным ставкам и дисциплинируя сельские приходы, но Хосе Мария Луис Мора и либералы, начиная с 1833 года, будут требовать отмены фуэрос как цены на современную республику." #NT!
 mex_caudillismo_bureaucracy: "Система де Каудильос" #NT!
 mex_caudillismo_bureaucracy_desc: "Мексиканская политика, начиная с коронации Итурбиде в 1822 году и до одиннадцати президентских сроков Санта-Анны (1833-1855), опиралась на региональных сильных военных, которые собирали личные армии, издавали произношения и перемещались по Национальному дворцу под дулом пистолета. Система каудильо доставляет легкую кавалерию через Бахио за считанные дни и набирает наборы из местной клиентуры, а также обеспечивает президентскую нестабильность по тому же графику." #NT!
 mex_hacienda_latifundia_bureaucracy: "Гасиенда Латифундия" #NT!
 mex_hacienda_latifundia_bureaucracy_desc: "Крупное сельское поместье, произошедшее от колониальных энкомьенд и консолидированное в результате реформ Бурбонов, доминирует в сельском хозяйстве Мексики от центрального плато до Юкатана. Хасендадо держат долговых пеонов (peones acasillados), привязанных к tienda de raya, снабжают городские рынки зерном и выплачивают заработную плату расписками. Система кормит города и финансирует земельную аристократию за счет постоянного сельского долгового рабства и застоя в урожайности." #NT!
 mex_republicas_de_indios_bureaucracy: "Республики Индии" #NT!
 mex_republicas_de_indios_bureaucracy_desc: "Колониальный институт, который республика 1821 года формально упразднила, но сохранял на практике на протяжении десятилетий: обособленная коренная община, управляемая избранными алькальдами и гобернадорами, платящая общинную дань и владеющая неотъемлемыми деревенскими землями (tierras comunales) вне испано-американского правопорядка. Оболочка защищает коренное большинство Мексики, но только до тех пор, пока либералы не примут Закон «Лей Лердо» (1856 г.) и не вынудят коммуналес выйти на открытый рынок." #NT!
 mex_siete_leyes_bureaucracy: "Сиете-Лейес и департаменты" #NT!
 mex_siete_leyes_bureaucracy_desc: "Централистская республика 1836 года распустила федеральные штаты, предусмотренные Конституцией 1824 года, на назначаемые департаменты под руководством назначаемых президентом губернаторов и хунты с правом собственности. Supremo Poder Conservador, принадлежащий к традициям камеристов Бурбонов, получил право наложить вето на Конгресс и свергнуть президента. Механизм подавил региональное восстание ценой его провокации: Техас в 1836 году и Юкатан в 1840 году стали предупреждением." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_mex_bureaucracy_authority: "Мексиканский институциональный орган" #NT!
 AUTO_MODIFIER_DESC_nd_mex_bureaucracy_authority: "При формировании [MEX.GetName] наследует плотную институциональную основу наместничества Бурбонов и получает способность принимать у себя историческую бюрократию." #NT!
