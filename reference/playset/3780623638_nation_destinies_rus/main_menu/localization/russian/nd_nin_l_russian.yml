l_russian:
  
 # === Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_nin_sargonid_imperium: "Саргонидская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_nin_sargonid_imperium: "Восстановлен образец воина-императора Тиглатпаласара, Саргона и Асархаддона. Ежегодно постоянные армейские кампании кисир шаррути; королевская стража Курубути сопровождает трон; осадная машина, которая сломала Лахис и Мемфис, теперь направлена ​​на границы империи. Доктрина является тотальной: ни один враг вне досягаемости, ни одна зима не прекращает кампанию, ни один конкурирующий горный народ не лежит в безопасности в Сапан Мати." #NT!
 STATIC_MODIFIER_NAME_nd_nin_pax_assyriaca: "Пакс Ассирийский" #NT!
 STATIC_MODIFIER_DESC_nd_nin_pax_assyriaca: "Административно-имперский шаблон, семьдесят провинций Асархаддона возвращены к жизни. Арамейские канцелярии копируются от столицы империи до каждой провинции; корпус таб-рабути, управляющий переселениями, перемещает население по всей империи, чтобы сломить местное сопротивление и восстановить региональную лояльность; Саргонидские дороги и посты пони-экспресса объединяют континент. Империя не просто побеждает; оно интегрируется." #NT!
 STATIC_MODIFIER_NAME_nd_nin_civilizational_synthesis: "Крест и Ламассу" #NT!
 STATIC_MODIFIER_DESC_nd_nin_civilizational_synthesis: "Патриарх и император короновались на одном алтаре Акиту. Херувимы Ламассу обрамляют апсиду собора; Библиотека Ашшурбанипала находится рядом с патриаршим скрипторием; древние стелы с надписями на арамейском, греческом и клинописном языках стоят в императорских садах. Империя является не просто наследницей Ашшура или Антиохии, но и того и другого одновременно, цивилизационным полюсом между латинским западом и персидским востоком." #NT!
  
 STATIC_MODIFIER_NAME_nd_nin_aramaic_chancery_modifier: "Арамейская государственная служба" #NT!
 STATIC_MODIFIER_DESC_nd_nin_aramaic_chancery_modifier: "Императорская корреспонденция, финансовые отчеты и судебные протоколы написаны арамейскими буквами. Административная основа империи Саргонидов восстановлена ​​в имперском масштабе." #NT!
 STATIC_MODIFIER_NAME_nd_nin_library_restored_modifier: "Библиотека Ашшурбанипала" #NT!
 STATIC_MODIFIER_DESC_nd_nin_library_restored_modifier: "Крупнейшая систематическая библиотека со времен Александрии, вновь основанная в столице империи. Каталог и каталог классов, серии писцов и условные обозначения формы табличек — весь научный аппарат Саргонидов сохранился." #NT!
 STATIC_MODIFIER_NAME_nd_nin_nile_campaign: "Нильская кампания" #NT!
 STATIC_MODIFIER_DESC_nd_nin_nile_campaign: "Империя предъявляет свои претензии на Нил, подобно Асархаддону в Мемфисе и Ашшурбанипалу в Фивах. Прямое провинциальное правление Египтом с гарнизонами в Танисе и Мемфисе, оплачиваемое нубийским золотом." #NT!
 STATIC_MODIFIER_NAME_nd_nin_tributary_settlement: "Приточное поселение" #NT!
 STATIC_MODIFIER_DESC_nd_nin_tributary_settlement: "Более мудрый урок Саргонидов: собирать дань, назначать королей-клиентов и идти домой, пока империя не расширилась. Территория империи сохраняется без затрат на постоянный гарнизон." #NT!
 STATIC_MODIFIER_NAME_nd_nin_lamassu_gates: "Ворота Ламассу" #NT!
 STATIC_MODIFIER_DESC_nd_nin_lamassu_gates: "Колоссальные херувимы с бычьими телами стоят у царских ворот. Патриархальные проповеди отождествляют их с херувимами из Книги Бытия; каменщики империи отождествляют их со своими предками-саргонидами." #NT!
 STATIC_MODIFIER_NAME_nd_nin_akitu_imperial: "Акиту Короны" #NT!
 STATIC_MODIFIER_DESC_nd_nin_akitu_imperial: "Фестиваль Акиту отмечается как обряд императорской коронации. Император возобновляет божественный мандат; старшие губернаторы приносят ежегодные присяги; преемственность империи подтверждена." #NT!
 STATIC_MODIFIER_NAME_nd_nin_akitu_patriarchal: "Акиту Патриарха" #NT!
 STATIC_MODIFIER_DESC_nd_nin_akitu_patriarchal: "Фестиваль Акиту отмечается как патриархальное благословение. Католикос освящает год, император причащается, а херувимы ламассу, стоящие по бокам алтаря, свидетельствуют об обновленном завете." #NT!
  
 # === Formation Event === 
 nd_nin.1.t: "Коронование в Ниневии" #NT!
 nd_nin.1.d: "Корону Ашшура переносят из сокровищницы собора в отреставрированный зал Саргонидов в Ниневии. Католикос Востока стоит рядом с императором; Мафриан-генерал ждет у двери; настоятели Мор-Габриэля и Дейр-аз-Зафарана прибыли из Тур-Абдина; старшие арамейские писцы императорской канцелярии держат в руках новую летописную стелу. За последние две тысячи лет мир не видел, чтобы какая-либо держава претендовала на имперское наследие Асархаддона и Ашшурбанипала.\n\nНовую империю ждут три основополагающие доктрины. Первый — это образец воина-императора Саргонидов: постоянная армия кисир шаррути, систематическая осадная доктрина, империя ежегодных кампаний. Второй — административно-имперский шаблон: семьдесят провинций, арамейская государственная служба, интеграционная администрация, которая объединила Вавилон и Мемфис под одной короной. Третий — цивилизационный синтез: древние стелы и христианский крест стоят вместе, Патриарх коронует императора на фестивале Акиту, империя как непреходящий полюс между латинским западом и персидским востоком.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_nin.1.a: "Мы наследники Саргона. Кисир марширует." #NT!
 nd_nin.1.b: "Арамейский язык будет языком империи. Постройте канцелярии." #NT!
 nd_nin.1.c: "Патриарх коронует императора. Кросс и Ламассу вместе." #NT!
  
 # === Advance DHE Events === 
 nd_nin.2.t: "Арамейская государственная служба" #NT!
 nd_nin.2.d: "В столице открывается имперская канцелярия, и с этого дня вся имперская корреспонденция, финансовые отчеты, судебные списки и провинциальные директивы составляются арамейскими буквами. Великое административное новшество Саргонидов – повышение неимперского языка до имперского использования – восстановлено в больших масштабах. Крестьяне и горожане империи, говорящие на арамейском языке, от высокогорья Хаккари до дельты Нила, могут читать указы императора на своем родном языке. Ни одна империя древности, за исключением персов Ахеменидов, заимствовавших эту практику, не управляла таким языком." #NT!
 nd_nin.2.a: "Пусть империя пишет на арамейском языке." #NT!
  
 nd_nin.3.t: "Библиотека восстановлена" #NT!
 nd_nin.3.d: "Библиотека Ашшурбанипала воссоздана в столице империи. Переводчики Патриархата приехали из библиотеки Бар-Эбреус в Мосуле; вызываются оставшиеся в живых клинописцы из сасанидских академий; греческий и арабский каталоги учебных школ Патриархата расшифрованы и проиндексированы. Таблички сортируются по форме и содержанию в соответствии с соглашением Саргонидов: квадратные для финансов, круглые для сельского хозяйства, сгруппированные по разделам «История», «Право», «Наука», «Магия», «Догма» и «Легенда». Первая систематическая библиотека со времен Александрии вернулась в город своего основания." #NT!
 nd_nin.3.a: "Каталог открыт. Империя читает снова." #NT!
  
 nd_nin.4.t: "Египетский вопрос" #NT!
 nd_nin.4.d: "Империя стоит в Дамаске и обозревает Нил. Асархаддон взял Мемфис в 671 г. до н.э. и управлял им напрямую; Ашшурбанипал разграбил Фивы в 663 г. до н.э. и отступил, чтобы вернуть дань. Сейчас перед нами стоит тот же выбор. Прямое провинциальное правление Египтом — это максимум Саргонидов, империя простиралась от Хаккари до нубийской границы. Поселение-данник — это более разумное отступление Саргонидов, сохраняющее территорию без затрат на постоянный гарнизон.\n\nИмперский совет разделен. Мафриан-генерал одобряет кампанию; канцелярия поддерживает соглашение о дани; Патриарх предостерегает от длинной линии снабжения." #NT!
 nd_nin.4.a: "Нажмите на кампанию. Мемфис наш." #NT!
 nd_nin.4.b: "Возьмите дань. Гарнизон Дамаска, а не Фив." #NT!
  
 nd_nin.5.t: "Ворота Ламассу" #NT!
 nd_nin.5.d: "В столице империи возвышаются первые новые ворота Ламассу за две тысячи пятьсот лет. Каменщики из соборных школ Патриархата работали вместе с сохранившимися традициями старой аккадской резьбы, восстановленными в деревенских святынях Тур Абдин и предгорьях Хаккари. Страж с телом быка и головой человека, отождествляемый в патриархальных проповедях с херувимами из Книги Бытия, нависает над императорскими вратами. Посещающие посольства государств-преемников крестоносцев, мамлюкских султанатов и персидских ханств проходят под ними и помнят, что империя является наследницей силы, более древней, чем их собственная." #NT!
 nd_nin.5.a: "Пусть херувимы охраняют империю." #NT!
  
 nd_nin.6.t: "Акиту Нового времени" #NT!
 nd_nin.6.d: "Фестиваль Акиту, вавилонско-ассирийский новогодний обряд, во время которого царский мандат возобновлялся перед собравшимися богами, вновь созывается в столице империи спустя три тысячелетия. Католикос коронует императора; Мафриан-генерал освящает императорский меч; херувимы ламассу обрамляют алтарь; старшие губернаторы империи приносят ежегодные присяги.\n\nОбряд имеет вес в двух регистрах. Будучи императорской коронацией, она подтверждает божественный мандат короны. В качестве патриархального благословения он утверждает высшее место Церкви Востока при императорском дворе. Канцелярия желает одного акцента; патриархат желает другого." #NT!
 nd_nin.6.a: "Акиту — день империи. Корона ведет." #NT!
 nd_nin.6.b: "Акиту — благословение патриарха. Церковь руководит." #NT!
  
 nd_nin.7.t: "Небесный Бык" #NT!
 nd_nin.7.d: "Империя сформирована. Корона Ашшура восседает на голове императора; арамейская канцелярия начала свои первые провинциальные списки; настоятели Тур Абдина спустились, чтобы принести присягу на верность; ворота Ламассу планируется построить в Ниневии, Мосуле и Багдаде. Сейчас путь лежит к строительству империи. Небесный Бык снова ходит по земле, и мир будет противостоять этому восстановлению." #NT!
 nd_nin.7.a: "Пусть империя исполнит свое предназначение." #NT!
  
 # === Advance Display Names === 
 nd_nin_kisir_sharruti: "Кисир Шаррути" #NT!
 nd_nin_kisir_sharruti_desc: "Постоянная армия Саргонидов восстановлена. Реформа Тиглатпаласара III в 745 г. до н. э., первый в мире оплачиваемый круглогодичный профессиональный корпус, вновь стал военной опорой империи." #NT!
 nd_nin_qurubuti: "Королевская гвардия Курубути" #NT!
 nd_nin_qurubuti_desc: "Тяжелый конный телохранитель империи, принесший присягу на фестивале Акиту, набранный из знатных домов патриархального двора. Самый близкий из приближенных к императорскому трону." #NT!
 nd_nin_sapan_mati: "Доктрина Сапан Мати" #NT!
 nd_nin_sapan_mati_desc: "Пограничная доктрина «Земли гор». Армии Саргонидов систематически действовали за пределами центра империи в Урарту, Загросе и Тавре; ни один враг не лежал в безопасности вне досягаемости." #NT!
 nd_nin_lamassu_monumentalism: "Ламассу Монументализм" #NT!
 nd_nin_lamassu_monumentalism_desc: "Колоссальные стражи ворот с человеческими головами и бычьими телами, отождествляемые в патриархальных проповедях с херувимами из Книги Бытия, воздвигались в каждой императорской резиденции. Монументальная практика Саргонидов в христианской одежде." #NT!
 nd_nin_tab_rabuti: "Таб-рабути" #NT!
 nd_nin_tab_rabuti_desc: "Великие переселенцы Саргонидов. Побежденное население переселялось и интегрировалось, а региональное сопротивление было сломлено преднамеренным рассредоточением. Административный инструмент, связывавший империю." #NT!
 nd_nin_imperial_siege_doctrine: "Имперская доктрина осады" #NT!
 nd_nin_imperial_siege_doctrine_desc: "Осадный аппарат Саргонидов, самый совершенный из древних. Тараны, мобильные осадные башни, подрывные корпуса, саперные рампы, первая в мире систематическая осадная школа." #NT!
 nd_nin_aramaic_chancery: "Арамейская императорская канцелярия" #NT!
 nd_nin_aramaic_chancery_desc: "Административная инновация Саргонидов распространилась на империю. Арамейский язык, лингва франка Патриархата, становится языком имперской государственной службы." #NT!
 nd_nin_imperial_riverine_fleet: "Императорский Речной Флот" #NT!
 nd_nin_imperial_riverine_fleet_desc: "Восстановились военные каналы Сеннахирима и флот Тигра и Евфрата. Коридор Мосул-Басра как совмещенный военно-торговый водный путь." #NT!
 nd_nin_akitu_coronation: "Коронация Акиту" #NT!
 nd_nin_akitu_coronation_desc: "Месопотамский новогодний праздник превратился в обряд христианской императорской коронации. Патриарх коронует императора; старшие губернаторы приносят ежегодные присяги; божественный мандат возобновляется." #NT!
 nd_nin_sargonid_provinces: "Провинциальная система Саргонидов" #NT!
 nd_nin_sargonid_provinces_desc: "Административная модель Асархаддона из семидесяти провинций. Каждой провинцией управлял сакин теми, подчинявшийся имперской канцелярии, при этом гарнизонные, финансовые и религиозные счета вели параллельно." #NT!
 nd_nin_imperial_standing_army: "Имперская постоянная армия" #NT!
 nd_nin_imperial_standing_army_desc: "Кисир шаррути превратился в империю. Каждая провинция предоставляет фиксированную долю постоянной пехоты; ядро выплачивается круглогодично; Профессионализация империи соответствует модели Саргонидов в имперском масштабе." #NT!
 nd_nin_library_restored: "Библиотека Ашшурбанипала" #NT!
 nd_nin_library_restored_desc: "В столице империи вновь основана величайшая систематическая библиотека древности. Соглашения о каталогах Саргонидов и корпус переводчиков Патриархата сливаются в единый имперский архив." #NT!
 nd_nin_levantine_administration: "Левантийская администрация" #NT!
 nd_nin_levantine_administration_desc: "Образец Саргонидов для восточного Средиземноморья: провинциальные губернаторы в больших городах, вассальные соглашения с прибрежными торговыми королевствами, инфраструктура дани и гарнизонов по всему Леванту." #NT!
 nd_nin_annal_stelae: "Аннал Стелы" #NT!
 nd_nin_annal_stelae_desc: "Королевские летописные стелы Саргонидов, воздвигнутые на границах империи для записи кампаний, договоров и подчинения данников. Формальный дипломатический и престижный инструмент, заново основанный империей." #NT!
 nd_nin_imperial_khorsabad: "Императорский Хорсабад" #NT!
 nd_nin_imperial_khorsabad_desc: "Модель Дур-Шаррукина: запланированный императорский столичный квартал с дворцом, храмом, укреплениями и зернохранилищами, выполненный в виде единого проекта. Империя заказывает одного в своей имперской резиденции." #NT!
 nd_nin_egyptian_province: "Египетская провинция" #NT!
 nd_nin_egyptian_province_desc: "Мемфис Асархаддона (671 г. до н. э.), Фивы Ашшурбанипала (663 г. до н. э.). Саргонидская интеграция Нила в имперскую систему, восстановленная как имперская доктрина: Египет как провинция, с гарнизонами и налогами." #NT!
 nd_nin_imperial_tribute: "Имперская система дани" #NT!
 nd_nin_imperial_tribute_desc: "Саргонидская администрация вассальных королей: ежегодная дань, фиксированные квоты, надзиратели в гарнизонах, угроза провинциализации в случае нарушений. Формальный субъектно-управленческий аппарат империи." #NT!
 nd_nin_royal_officer_corps: "Королевский офицерский корпус" #NT!
 nd_nin_royal_officer_corps_desc: "Профессиональные офицеры империи, прошедшие обучение в школе императорского дворца. Империя средневековья сочетает в себе традицию саргонидских евнухов-бюрократов с учебной программой кафедральных школ Мосула и Багдада." #NT!
 nd_nin_scribal_schools: "Школы писцов" #NT!
 nd_nin_scribal_schools_desc: "Сеть имперских дворцовых и провинциальных школ писцов произошла от саргонидских академий писцов и слилась с соборными школами Патриархата. Преподавали арамейский, греческий, латынь, персидский язык и клинописный корпус." #NT!
 nd_nin_imperial_absolutism: "Имперский абсолютизм" #NT!
 nd_nin_imperial_absolutism_desc: "Саргонидская концепция тотальной имперской власти была включена в абсолютистскую конституцию империи. Император как единственный земной представитель божественного порядка с Католикосом как главным посвящающим прелатом." #NT!
 nd_nin_lamassu_quarter: "Королевский квартал Ламассу" #NT!
 nd_nin_lamassu_quarter_desc: "Квартал императорского дворца, перестроенный по образцу Саргонидов: ворота с ламасу, зиккурат с собором, непрерывный город-дворец, простирающийся от патриархальной резиденции до императорских казарм." #NT!
 nd_nin_imperial_aramaic: "Имперский арамейский" #NT!
 nd_nin_imperial_aramaic_desc: "Кодификация арамейского языка как официального административного языка всей империи. Канцелярия, суды, императорская переписка, налоговые ведомости — все написано арамейскими буквами." #NT!
 nd_nin_imperial_levies: "Имперские сборы" #NT!
 nd_nin_imperial_levies_desc: "Постоянные рекруты империи, набранные из каждой интегрированной провинции, являются потомками депортированных Саргонидов и провинциальных призывников. Кадровая база империи расширяется до имперских масштабов." #NT!
 nd_nin_annexation_doctrine: "Доктрина аннексии" #NT!
 nd_nin_annexation_doctrine_desc: "Доктрина Саргонидов об эскалации: данник, затем вассал, затем провинция. Империя применяет это последовательно и подчиняет подданных прямому правлению в установленные сроки." #NT!
 nd_nin_imperial_industry: "Имперская промышленная база" #NT!
 nd_nin_imperial_industry_desc: "Промышленный комплекс империи поздней эпохи, построенный на базе речной логистики Саргонидов, патриархальных скрипторий и литейных заводов Мосула. Промышленная Месопотамия с центром в столице империи." #NT!
 nd_nin_lamassu_academy: "Академия Ламассу" #NT!
 nd_nin_lamassu_academy_desc: "Императорская военно-административная академия, названная в честь быков-херувимов-охранителей у ее ворот. Генеральный штаб, курсанты государственной службы и высшее духовенство используют учебную программу на арамейском и греческом языках." #NT!
 nd_nin_imperial_constitution: "Имперская Конституция" #NT!
 nd_nin_imperial_constitution_desc: "Формальное конституционное урегулирование поздней империи: корона, патриарх, сенат губернаторов провинций и арамейская государственная служба, сведенные в единый документ, созданный по образцу царских анналов Саргонидов." #NT!
 nd_nin_pan_aramaic_press: "Панарамейская пресса" #NT!
 nd_nin_pan_aramaic_press_desc: "Императорская пресса произошла от типографии Патриархата с арамейской вязью. Газеты, официальные бюллетени и учебные пособия распространялись по всем имперским провинциям." #NT!
 nd_nin_destiny: "Имперская судьба" #NT!
 nd_nin_destiny_desc: "Небесный Бык ходит по земле. Империя сформирована; путь к имперскому осуществлению открыт." #NT!
  
 # === Building Display Names === 
 nd_nin_lamassu_gate: "Ворота Ламассу" #NT!
 nd_nin_lamassu_gate_desc: "Колоссальные стражи с человеческими головами и бычьими телами у императорских ворот. Восстановлена ​​монументальная традиция Саргонидов, отождествляемая с херувимами христианской иконографии." #NT!
 nd_nin_aramaic_chancery_building: "Императорская канцелярия" #NT!
 nd_nin_aramaic_chancery_building_desc: "Штаб государственной службы империи, работающий на арамейском языке по образцу Саргонидов. Здесь сходятся провинциальные финансовые, судебные и церковные счета." #NT!
 nd_nin_riverine_naval_yard: "Речная военно-морская верфь" #NT!
 nd_nin_riverine_naval_yard_desc: "Стоянка флота Тигр-Ефрат. Инфраструктура военного канала Сеннахирима восстановлена ​​как объединенный военный и торговый водный путь." #NT!
 nd_nin_akitu_square: "Фестивальная площадь Акиту" #NT!
 nd_nin_akitu_square_desc: "Большая открытая площадь в столице империи, где празднуется новогодний обряд коронации Акиту. Патриарх коронует императора; херувимы ламассу обрамляют алтарь." #NT!
 nd_nin_kisir_barracks: "Казармы Кисир Шаррути" #NT!
 nd_nin_kisir_barracks_desc: "Постоянные армейские казармы имперского кисира, круглогодичная профессиональная пехота, созданная Саргонидами." #NT!
 nd_nin_library_of_ashurbanipal: "Библиотека Ашшурбанипала" #NT!
 nd_nin_library_of_ashurbanipal_desc: "Крупнейшая систематическая библиотека со времен Александрии, вновь основанная в столице империи. Условные каталоги Саргонидов, патриархальный корпус переводчиков и сохранившийся корпус клинописи — все под одной крышей." #NT!
 nd_nin_annal_stele: "Аннальная стела" #NT!
 nd_nin_annal_stele_desc: "Монументальная стела с надписью, записывающая кампании, договоры или подчинения. Практика королевских анналов Саргонидов как формальный дипломатический и престижный инструмент." #NT!
 nd_nin_imperial_palace: "Императорский дворец в Хорсабаде" #NT!
 nd_nin_imperial_palace_desc: "Планируемый имперский столичный квартал по модели Хорсабад/Дур-Шаррукин. Дворец, храм, укрепления и зернохранилища объединены в единый императорский заказ." #NT!
 nd_nin_scribal_school: "Школа Писцов" #NT!
 nd_nin_scribal_school_desc: "Имперская академия писцов, сочетающая в себе саргонидские и патриархальные традиции. обучение на арамейском, греческом, латинском и персидском языках; клинописный корпус Саргонидов сохранен для углубленного изучения." #NT!
 nd_nin_imperial_quarter: "Императорский квартал" #NT!
 nd_nin_imperial_quarter_desc: "Дворцовый квартал позднего абсолютизма в столице империи. Город-дворец с воротами Ламассу и собором-зиккуратом, от патриархальной резиденции до императорских казарм." #NT!
 nd_nin_imperial_arsenal: "Императорский Арсенал" #NT!
 nd_nin_imperial_arsenal_desc: "Промышленный оружейный комплекс империи поздней эпохи. Пушки, огнестрельное оружие и сталь для императорского корпуса, опираясь на литейные заводы Мосула и речные мастерские." #NT!
  
 # === Production Method Loc === 
 nd_nin_lamassu_gate_upkeep: "Содержание ворот Ламассу" #NT!
 nd_nin_lamassu_gate_upkeep_desc: "Камень, каменная кладка и ритуальные принадлежности для поддержания херувимов-стражей и прилегающих к ним святилищ." #NT!
 nd_nin_chancery_upkeep: "Канцелярские операции" #NT!
 nd_nin_chancery_upkeep_desc: "Бумага, чернила, воск, книги и благовония для повседневной работы императорской арамейской государственной службы." #NT!
 nd_nin_naval_yard_upkeep: "Операции военно-морской верфи" #NT!
 nd_nin_naval_yard_upkeep_desc: "Лес, деготь, военно-морские припасы и инструменты для содержания императорского речного флота." #NT!
 nd_nin_akitu_upkeep: "Содержание фестиваля Акиту" #NT!
 nd_nin_akitu_upkeep_desc: "Благовония, пчелиный воск, бумага и вино для обряда коронации империи и его ежегодных повторений." #NT!
 nd_nin_kisir_upkeep: "Содержание постоянной армии Кисира" #NT!
 nd_nin_kisir_upkeep_desc: "Оружие, ткань, лошади и зерно для круглогодичного существования профессионального корпуса." #NT!
 nd_nin_library_upkeep: "Библиотечные операции" #NT!
 nd_nin_library_upkeep_desc: "Бумага, книги, пчелиный воск и благовония для работы императорского архива." #NT!
 nd_nin_annal_stele_upkeep: "Техническое обслуживание стелы" #NT!
 nd_nin_annal_stele_upkeep_desc: "Камень, каменная кладка и ритуальный воск для сохранения монументальных надписей империи." #NT!
 nd_nin_palace_upkeep: "Дворцовые операции" #NT!
 nd_nin_palace_upkeep_desc: "Камень, кладка, тонкая ткань и благовония для императорской резиденции и ее двора." #NT!
 nd_nin_scribal_upkeep: "Операции школы писцов" #NT!
 nd_nin_scribal_upkeep_desc: "Бумага, книги, пчелиный воск и благовония для императорской учебной программы писцов." #NT!
 nd_nin_imperial_quarter_upkeep: "Операции Императорского квартала" #NT!
 nd_nin_imperial_quarter_upkeep_desc: "Камень, каменная кладка, прекрасная ткань и оружие для абсолютистского города-дворца." #NT!
 nd_nin_arsenal_pm: "Императорский Арсенал Производство" #NT!
 nd_nin_arsenal_pm_desc: "Железо, уголь и инструменты, перекованные в оружие для имперского корпуса." #NT!
  
 # === Unit Display Names === 
 a_nd_nin_kisir_sharruti: "Кисир Шаррути" #NT!
 a_nd_nin_kisir_sharruti_desc: "Профессиональная постоянная пехота империи, первый в мире оплачиваемый круглогодичный корпус. Шаблон Саргонидов восстановлен под знаменем Патриархата." #NT!
 a_nd_nin_qurubuti: "Курубути" #NT!
 a_nd_nin_qurubuti_desc: "Королевская гвардейская кавалерия империи. Тяжелый конный телохранитель, принесший присягу на фестивале Акиту, набранный из знатных домов патриархального двора." #NT!
 a_nd_nin_siege_corps: "Имперский осадный корпус" #NT!
 a_nd_nin_siege_corps_desc: "Осадный аппарат Саргонидов восстановлен в масштабе. Тараны, мобильные осадные башни, подрывные корпуса и саперные рампы в скоординированном построении." #NT!
 a_nd_nin_aramean_auxiliary: "Арамейский вспомогательный" #NT!
 a_nd_nin_aramean_auxiliary_desc: "Набирайте пехоту из арамейскоязычной сельской местности империи. Потомки депортированных саргонидов, превращенные в постоянный вспомогательный класс." #NT!
  
 # === Levy Display Names === 
 levy_nd_nin_aramean_auxiliary: "Арамейский вспомогательный сбор" #NT!
 levy_nd_nin_aramean_auxiliary_desc: "Набранная пехота, набранная из говоривших на арамейском языке крестьян и солдат империи в Месопотамии и Леванте." #NT!
  
 # === Variable Tooltip Keys === 
 nd_nin_formed_tt: "Образуется Ассирийская империя." #NT!
 nd_nin_path_a_tt: "Основополагающая доктрина: Империя Саргонидов." #NT!
 nd_nin_path_b_tt: "Основополагающая доктрина: Pax Assyriaca." #NT!
 nd_nin_path_c_tt: "Основополагающая доктрина: Кросс и Ламассу." #NT!
  
 # === Destiny Tree === 
 nd_nin_dest_kalhu_doctrine: "Доктрина Калху" #NT!
 nd_nin_dest_kalhu_doctrine_desc: "Кодифицируйте практику кампании вселенской империи в городе-дворце Тиглатпаласара III, Калху. Возьмите Анатолию: Конья, Кайсери и Анкара переходят под имперское знамя. Доктрина Саргонидов на запад простиралась до пределов Ахеменидов." #NT!
 nd_nin_dest_zagros_throne: "Трон Загроса" #NT!
 nd_nin_dest_zagros_throne_desc: "Пересеките горы Загрос и заявите права на Иранское плато. Хамадан, старая мидийская Экбатана, и Истахр, средневековый наследник Персеполя, должны быть подчинены прямому имперскому правлению. Империя простирается дальше на восток, чем удалось любому Саргониду." #NT!
 nd_nin_dest_universal_empire: "Шар Кибрат Эрбетти" #NT!
 nd_nin_dest_universal_empire_desc: "Титул Саргонидов «Король четырех четвертей» наконец-то исполнен. Достигните Смирны на лидийской границе, Самарканда на Согдийской границе, Пешавара на Гандхаранской границе. Максимум Ахеменидов был возвращен под корону Саргонидов. Замковый камень: Бит-Матати, Зал Земель." #NT!
 nd_nin_dest_beth_hekma_imperial: "Бет Хекма в масштабе империи" #NT!
 nd_nin_dest_beth_hekma_imperial_desc: "Расширьте Дом Мудрости Патриархата до имперского могущества. Примите институт банковского дела; заставить шелковый коридор достичь столицы империи. Бухгалтерский учет арамейской государственной службы делает банковское дело понятным для каждого имперского рынка." #NT!
 nd_nin_dest_aramaic_lingua_franca: "Арамейский как Lingua Franca" #NT!
 nd_nin_dest_aramaic_lingua_franca_desc: "Сделать арамейский стандартным языком переписки на рынке Старого Света. Развивайте глобальную торговлю, накапливайте имперские резервы и расширяйте империю до таких масштабов, чтобы ее письма доходили до каждого отдаленного двора, уже читабельного." #NT!
 nd_nin_dest_imperial_silk_corridor: "Императорский шелковый коридор" #NT!
 nd_nin_dest_imperial_silk_corridor_desc: "Восстановите сеть каналов Сеннахирима и соедините ее с канатными сооружениями и дорогами караван-сараев Старого Света. Примите научную революцию; добраться до старой митрополии католиката в Бухаре; обеспечить шелковый коридор на любом имперском рынке. Верхний камень: Императорский канал Сеннахирима." #NT!
  
 # === Destiny Event Loc === 
 nd_nin.8.t: "Анатолийская граница" #NT!
 nd_nin.8.d: "Кисир пересекает Киликийские ворота, и перед империей открывается великое центральное плато. Конья падает; Кайсери капитулирует; Анкара принимает по очереди митрополита Патриархата и имперского губернатора. Доктрина Саргонидов о западном направлении, последний раз принесенная Саргоном II в Галис две тысячи пятьсот лет назад, достигла большего, чем когда-либо удалось ее основателю.\n\nИмперская канцелярия возводит новые летописные стелы на западной границе. Империя теперь стоит у ворот старого Ахеменидского запада." #NT!
 nd_nin.8.a: "Кисир занимает анатолийский трон." #NT!
  
 nd_nin.9.t: "Иранский переход" #NT!
 nd_nin.9.d: "Хамадан падает. Мидийский тронный город Ахеменидов Экбатана, летняя столица великих персидских царей, подчиняется имперскому губернатору. За ним следует Истахр, средневековый персидский наследник Персеполя. Империя находится в самом сердце старой тронной страны Ахеменидов.\n\nИмперский совет разделен. Мафриан-генерал выступает за решительный натиск на восток: кисир в поле, кампания оплачена, момент неповторим. Канцелярия выступает за поглощение: иранские провинции должны быть укомплектованы персоналом, обложены налогами и интегрированы, иначе они восстанут в течение одного поколения." #NT!
 nd_nin.9.a: "Продвигайте кампанию на восток. Кисир выходит на поле." #NT!
 nd_nin.9.b: "Консолидировать. Интегрируйте иранский трон." #NT!
  
 nd_nin.10.t: "Четыре четверти" #NT!
 nd_nin.10.d: "Смирна на лидийской границе. Самарканд на Согдийском нагорье. Пешавар у ворот Гандхарана. Саргонидский титул шар кибрат эрбетти, король четырех четвертей, на который претендовал Саргон II два с половиной тысячелетия назад, наконец-то выполнен средневеково-имперским наследником его трона. Территория империи превосходит все максимумы Саргонидов и соответствует пику Ахеменидов.\n\nНа заготовке летописной стелы нанесена новая надпись, и имперский совет обсуждает следующий шаг. Продвигаться дальше от всех границ? Или разместить гарнизоны и позволить всей империи осесть?" #NT!
 nd_nin.10.a: "Мир-император. От каждой границы продвигайтесь наружу." #NT!
 nd_nin.10.b: "Гарнизонные линии. Империя удерживает то, что взяла." #NT!
  
 nd_nin.11.t: "Возрождение Бет Хекмы" #NT!
 nd_nin.11.d: "Дом Мудрости Патриархата, институт переводов Бар-Гебреуса, медицинская традиция Джундишапура наконец превратились в империю. В каждом провинциальном центре теперь есть пристройка Бет Хекма: писцы, переводчики, бухгалтеры, врачи, все они используют одну и ту же арамейско-греко-персидскую учебную программу.\n\nБухгалтерский учет арамейской государственной службы сделал банковские учреждения Латинского Средиземноморья понятными для имперских рынков. Доктрина Креста и Ламассу начинает приносить свои цивилизационные плоды." #NT!
 nd_nin.11.a: "Откройте двери канцелярии. Империя читает." #NT!
  
 nd_nin.12.t: "Арамейский Синод" #NT!
 nd_nin.12.d: "Канцелярии империи объявляют арамейский стандартным языком переписки на рынке Старого Света. Католикос созывает великий синод в столице империи для координации деятельности Церкви Востока митрополий: от иберийских графов Латинского Средиземноморья до хазарских дворов-преемников и танских столиц восточного Шелкового пути.\n\nЗа результат синода борются два приоритета. Взгляд канцелярии: масштабируйте имперские переводчики, постройте Бет Хекму в каждом провинциальном центре. Взгляд Патриархии: сохранить координацию Синода на первом месте, позволить митрополиям управлять по коллегиальному соглашению." #NT!
 nd_nin.12.a: "Императорские переводчики. Бет Хекма на каждом месте." #NT!
 nd_nin.12.b: "Синод заседает. Патриархат и канцелярия в согласии." #NT!
  
 nd_nin.13.t: "Канал Сеннахирим восстановлен" #NT!
 nd_nin.13.d: "Великие речные сооружения Сеннахирима на Тигре восстановлены в имперском масштабе. Инженеры империи соединяют судоходство Мосул-Басра с сетями каналов иранского нагорья, дорогами-караван-сараями через Левант и монашескими промежуточными станциями католиката от иберийского побережья до Бухары. Экономический хребет Старого Света восстанавливается под контролем арамейско-имперской власти.\n\nИмперский совет определяет акцент коридора. Открыть его как торговый коридор, где на каждой крупной станции будут стоять имперские таможни? Или построить его как внутреннюю инфраструктуру, сблизив имперские владения через сеть каналов?" #NT!
 nd_nin.13.a: "Откройте коридор. Торговля течет на восток и запад." #NT!
 nd_nin.13.b: "Стройте каналы. Речная империя цела." #NT!
  
 # === Destiny Static Modifier Loc === 
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_advance: "Загрос Прогресс" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_advance: "Кисир продвигается на восток через Иранское нагорье. Ежегодные кампании Загроса, караваны с грабителями, возвращающиеся в имперскую столицу, традиционная армейская доктрина империи, доведённая до максимума." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_consolidation: "Объединение Загроса" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_consolidation: "Иранские провинции интегрируются, а не подвергаются набегам. Мидийские и персидские дворянские дома включены в имперскую систему сборов; администраторы переселения перемещают население из центра страны в гарнизоны новых тронных городов." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_world_emperor: "Шар Кибрат Эрбетти" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_world_emperor: "Король четырех четвертей. Империя расширяет свои границы со всех границ: лидийского побережья, Согдийского нагорья, Гандхарских ворот, реки Нубии. Протяженность превышает Саргонидский максимум и пик Ахеменидов. Нагрузка на имперскую сплоченность является постоянной." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_consolidation_throne: "Имперский гарнизон" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_consolidation_throne: "Империя удерживает то, что взяла. Пограничные форты вдоль Киликийских ворот, перевалов Загрос, Согдийского нагорья и переправ через Инд укомплектованы людьми круглый год. Кисир скорее консолидируется, чем расширяется; сборы обостряются за стенами." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_imperial_translators: "Имперские переводчики" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_imperial_translators: "Переводческий корпус Патриархата разросся до империи. В каждом провинциальном центре есть пристройка Бет Хекма; каждый канцелярский служащий читает на арамейском, греческом, персидском и латыни. Банковские дома империи гарантируют имперский кредитный рынок на основании бухгалтерской отчетности канцелярий." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_aramaic_synod: "Арамейский Синод" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_aramaic_synod: "Великий синод Католикоса заседает в столице империи и координирует деятельность Церкви митрополий Востока от Латинского побережья до Согдийского нагорья. Губернаторы провинций и митрополиты пользуются общей системой имперских дорог; Влияние империи на сельскую местность расширяется." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_silk_corridor_open: "Шелковый коридор" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_silk_corridor_open: "Императорский канал Сеннахирима соединялся с канатными сооружениями Ирана и дорогами караван-сараев Леванта. Обычаи империи на каждой станции; шелковые караваны из Бухары в Иберию платили имперские пошлины. Импорт предметов роскоши нарушает традиционные устои имперского центра." #NT!
 STATIC_MODIFIER_NAME_nd_nin_dest_canals_built: "Речная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_nin_dest_canals_built: "Каналы идут от истока Тигра до Персидского залива. Внутренние территории империи связаны водными путями и каналами; канцелярии интегрируют провинциальные имения в имперские списки с беспрецедентной скоростью. Доктрина Сеннахирима стала буквальной в имперском масштабе." #NT!
  
 # === Destiny Building Loc === 
 nd_nin_bit_matati: "Бит-Матати" #NT!
 nd_nin_bit_matati_desc: "Зал Земель. Тронный зал Саргонидов, перестроенный для империи универсального охвата: клинописные списки дани с четырех сторон, колоссальные ламассу из каждого завоеванного региона, великая карта максимума Ахеменидов, вырезанная на полу. Титул Саргона II стал буквальным." #NT!
 nd_nin_sennacherib_canal: "Императорский канал Сеннахирима" #NT!
 nd_nin_sennacherib_canal_desc: "Великий речной инженерный проект Сеннахирима (704-681 гг. до н.э.), восстановленный в имперском масштабе и присоединенный к канатным сооружениям и дорогам караван-сарая Старого Света. Экономический хребет Старого Света был восстановлен под руководством арамейско-имперской власти." #NT!
  
 # === Destiny PM Loc === 
 nd_nin_bit_matati_upkeep: "Зал содержания земель" #NT!
 nd_nin_bit_matati_upkeep_desc: "Камень, каменная кладка, прекрасная ткань и ритуальное вооружение для поддержания вселенского тронного зала империи." #NT!
 nd_nin_sennacherib_canal_upkeep: "Обслуживание каналов" #NT!
 nd_nin_sennacherib_canal_upkeep_desc: "Древесина, камень, деготь и инструменты для поддержания работоспособности речной и канатной сети." #NT!
  
 # === BUREAUCRACIES === 
 nd_nin_kisir_sharruti_bureaucracy: "Кишир Шаррути" #NT!
 nd_nin_kisir_sharruti_bureaucracy_desc: "Реформа Тиглатпаласара III в середине 8-го века до н.э. создала кисир шаррути, первую в мире профессиональную постоянную армию: кадровые солдаты, которым платили серебром из королевской казны, проходили круглогодичную подготовку и размещали гарнизоны в Калху и Ниневии. Саргон II и Сеннахирим расширили его до железного ядра империи. Восстановленный при Мосуле, он привлекает призывников со всей империи и подчиняется непосредственно трону, минуя дворянские поборы." #NT!
  
 nd_nin_tab_rabuti_bureaucracy: "Бюро Таб-Рабути" #NT!
 nd_nin_tab_rabuti_bureaucracy_desc: "Неоассирийские администраторы депортации (буквально «великие люди»), которые руководили политикой империи по массовому переселению населения. Побежденные народы были расселены по всей империи, их элита интегрирована в имперскую службу, их земли заселены новыми подданными. Депортация израильтян Саргоном II в 722 г. до н. э., а также более поздние перемещения вавилонян и египтян прошли через этот корпус. В имперском масштабе оно подавляет региональное сопротивление путем принудительного переселения, но это обходится ужасающей ценой для сельского населения." #NT!
  
 nd_nin_saknu_temi_bureaucracy: "Провинция Шакну-Теми" #NT!
 nd_nin_saknu_temi_bureaucracy_desc: "Реорганизация Саргона II в конце VIII века до н.э. разделила империю примерно на семьдесят провинций, каждая из которых подчинялась сакну теми (губернатору провинции), подчинявшемуся непосредственно трону. В каждой провинции было три параллельных счета (финансовый, гарнизонный и религиозный), которые взаимно проверяли друг друга. Восстановленный в имперском масштабе, этот аппарат тройного входа обходит региональных аристократов, обеспечивая прямой трубопровод из Мосула в каждый районный центр." #NT!
  
 nd_nin_aramaic_chancery_bureaucracy: "Императорская арамейская канцелярия" #NT!
 nd_nin_aramaic_chancery_bureaucracy_desc: "Тиглатпаласар III утвердил арамейский язык в качестве административного языка империи наряду с аккадским в 8 веке до нашей эры. Двуязычные писцы обрабатывали дипломатическую корреспонденцию, налоговые реестры и провинциальные депеши на арамейском языке на скоропортящемся пергаменте, в то время как монументальный аккадский язык оставался для стел и королевских надписей. Реставрация Сирии возрождает его: класс грамотных клерков управляет империей с помощью письменности, которую может прочитать каждый купец от Эдессы до Суз." #NT!
  
 nd_nin_bit_tuppate_bureaucracy: "Сеть Бит Туппате" #NT!
 nd_nin_bit_tuppate_bureaucracy_desc: "Библиотека Ашшурбанипала в Ниневии (середина VII века до н.э.) была краеугольным камнем общеимперской сети бит-туппате («домов табличек»): школ писцов в каждой провинции, копирующих шумерские, аккадские и арамейские тексты, обучающих имперских клерков и поддерживающих архивы предзнаменований, которые узаконивали царские решения. Реставрация сирийского языка впитала это в традицию скриптория Патриархата: на каждой митрополичьей кафедре есть пристройка скриптория." #NT!
  
 nd_nin_akitu_liturgy_bureaucracy: "Императорская литургия Акиту" #NT!
 nd_nin_akitu_liturgy_bureaucracy_desc: "Фестиваль Акиту — это месопотамский новогодний обряд коронации, отмечаемый ежегодно на протяжении более двух тысячелетий, во время которого царь ритуально подтверждал свою власть перед собравшимися богами и вассалами. Сирийская реставрация воссоздает его как христианскую имперскую литургию: патриарх коронует императора каждый нисан в мосульском соборе, праздничная процессия демонстрирует имперскую власть по городу, и каждая митрополия ритуально привязывается к трону." #NT!
  
 # === Bureaucracy Authority Auto-Modifier === 
 AUTO_MODIFIER_NAME_nd_nin_bureaucracy_authority: "Саргонидская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_nin_bureaucracy_authority: "При формировании империи восстановленный административный аппарат Саргонидов может принять на себя историческую бюрократию. Столица предоставляет один слот; эта власть дает еще два." #NT!
