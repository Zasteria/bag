l_russian:
 PNT: "Пинтадос" #NT!
 PNT_ADJ: "Пинтадос" #NT!
 PNT_f: "Конфедерация Пинтадос" #NT!
 PNT_f_desc: "Когда воины-аристократы Панай, Себу, Самара, Лейте, Бохола и Негроса откладывают свои распри и объединяются, нарисованные люди островов восстают как одна цивилизация. Связанные чернилами своих татуировок по всему телу, молитвами своих бабайланских жриц и длинными балангайскими корпусами, которые несут их рейдовый флот по внутренним морям, датус объединяют свою честь под одним знаменем Конфедерации: Кабисай-ан, Пинтадо, нарисованные из легенд. Испанцы, назвавшие их так, найдут не разрозненные вождества, которые можно было бы разобрать, а нацию морских воинов, выкованную из общей крови каждого Висайского острова." #NT!
