l_russian:
 STATIC_MODIFIER_NAME_nd_dec_sword_of_the_deccan: "Меч Декана" #NT!
 STATIC_MODIFIER_DESC_nd_dec_sword_of_the_deccan: "Деканский султанат опирается на свои разнообразные военные традиции: воины-хабши, сипахи-декани, тюркские всадники и иррегулярные войска маратхов служат вместе под зеленым знаменем. Эта многонациональная армия является величайшим оружием султаната." #NT!
 STATIC_MODIFIER_NAME_nd_dec_golconda_splendor: "Голконда Великолепие" #NT!
 STATIC_MODIFIER_DESC_nd_dec_golconda_splendor: "Богатство Декана исходит из легендарных алмазных рудников Голконды и знаменитых текстильных мастерских региона. Под просвещенным покровительством суд привлекает ученых, поэтов и ремесленников со всего исламского мира и за его пределами." #NT!
 STATIC_MODIFIER_NAME_nd_dec_talikota_triumphant: "Триумф в Таликоте" #NT!
 STATIC_MODIFIER_DESC_nd_dec_talikota_triumphant: "Союзные султанаты разрушили мощь Виджаянагара на поле битвы. Военная репутация Декана полируется на протяжении целого поколения." #NT!
 STATIC_MODIFIER_NAME_nd_dec_vijayanagara_spoils: "Трофеи Виджаянагара" #NT!
 STATIC_MODIFIER_DESC_nd_dec_vijayanagara_spoils: "Завоеванные территории павшей индуистской империи пополняют казну и расширяют владения султаната. Тщательное управление превратит эти новые земли в опоры государства." #NT!
 STATIC_MODIFIER_NAME_nd_dec_gawan_centralization: "Централизованное видение Гавана" #NT!
 STATIC_MODIFIER_DESC_nd_dec_gawan_centralization: "Реформы Махмуда Гавана ограничили власть губернаторов провинций и поставили тарафы под прочную центральную власть. Администрация султаната стала более эффективной, чем когда-либо прежде." #NT!
 STATIC_MODIFIER_NAME_nd_dec_gawan_commerce: "Коммерческие сети Гавана" #NT!
 STATIC_MODIFIER_DESC_nd_dec_gawan_commerce: "Торговые сети, созданные Махмудом Гаваном, соединяют Декан с Персидским заливом, Аравийским морем и рынками Юго-Восточной Азии. Торговцы стекаются в процветающие порты султаната." #NT!
 nd_dec.1.t: "Деканский султанат" #NT!
 nd_dec.1.d: "Над плато возвышается знамя Деканского султаната. От реки Кришна до хребта Виндхья земли Декана были объединены под единой исламской властью. Вопрос, который сейчас стоит перед султанатом, заключается в идентичности: будет ли это царство, созданное в традициях меча, опирающееся на разнообразные боевые культуры, которые издавна определяли Декан (телохранители Хабши, тюркские всадники, сипахи Декани), или это будет царство, которое смотрит на богатство под своей землей и блеск своих дворов, где алмазы Голконды и поэзия Дахани освещают новую эпоху процветание?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_dec.1.a: "Меч объединяет то, чего не может дипломатия." #NT!
 nd_dec.1.b: "Пусть свет Голконды осветит мир." #NT!
 nd_dec.2.t: "Битва при Таликоте" #NT!
 nd_dec.2.d: "23 января 1565 года союзные армии султанатов Декана (Биджапур, Ахмаднагар, Голконда и Бидар) встретились с силами империи Виджаянагара у деревни Раккаса-Тангади недалеко от Таликоты. Битва оказалась решающей. Рама Райя, стареющий регент Виджаянагара, был схвачен и обезглавлен на поле боя. Его армия разбилась, а столица Виджаянагара была разграблена и разрушена в течение следующих месяцев и больше никогда не была оккупирована. Разрушение Виджаянагара навсегда изменило политический ландшафт южной Индии. Вопрос теперь в том, что Декан будет делать со своей победой." #NT!
 nd_dec.2.a: "Наше оружие доказало свою эффективность. Пусть мир примет это к сведению." #NT!
 nd_dec.2.b: "Мы поглотим эти территории и станем еще сильнее." #NT!
 nd_dec.3.t: "Реформы Махмуда Гавана" #NT!
 nd_dec.3.d: "Махмуд Гаван, блестящий премьер-министр персидского происхождения, преобразовал администрацию султаната. Родившийся в Гилане и привлеченный интеллектуальным потенциалом Декана, Гаван разделил королевство на восемь тарафов, стандартизировал оплату дворян, ограничил губернаторов провинций одним фортом для каждого и провел точные землеустроительные работы, чтобы обеспечить справедливое налогообложение. Его знаменитое медресе в Бидаре (с тремя этажами, изысканной плиткой и библиотекой из трех тысяч рукописей) является памятником учености. Но централизующее видение Гавана угрожает устоявшейся знати. Вопрос в том, следует ли продвигать реформы или вместо этого направить свою энергию на коммерческую экспансию." #NT!
 nd_dec.3.a: "Нажимайте на реформы: государство должно иметь первостепенное значение." #NT!
 nd_dec.3.b: "Расширяйте торговые сети: коммерция обогащает всех." #NT!
 nd_dec.4.t: "Бриллианты Голконды" #NT!
 nd_dec.4.d: "В рудниках вокруг Голконды добываются алмазы необычайного размера и качества: камни, которые однажды будут известны как Кох-и-Нур, Алмаз Хоуп и Алмаз Регент, происходят из этих аллювиальных месторождений вдоль реки Кришна. Французский путешественник Жан-Батист Тавернье сообщит, что видел шестьдесят тысяч мужчин, женщин и детей, работающих на рудниках только в Коллуре. Торговля алмазами сделала Голконду синонимом самого богатства, привлекая торговцев из Персии, Аравии, Голландской Республики, Франции и Португалии. Доходы от этих рудников финансируют армии султаната, его архитектуру и покровительство культуре." #NT!
 nd_dec.4.a: "Богатства земли находятся в нашем распоряжении." #NT!
 nd_dec.5.t: "Цветение Дахани" #NT!
 nd_dec.5.d: "Литературный язык, уникальный для Декана, вступил в свои права. Дахани (родившийся от слияния персидского, арабского, маратхи, каннада и телугу) создал шедевры, которые могут соперничать с великими персидскими поэтами. Эпос «Кадам Рао Падам Рао», написанный при дворе Бахмани в Бидаре, рассказывает свою историю на языке, который принадлежит не одному народу, а всем, кто называет Декан своим домом. Суфийские святые проповедуют в Дахани, чтобы достичь простых людей; султаны слагают на нем стихи, чтобы продемонстрировать свою укорененность в этой земле. Ибрагим Адил Шах II из Биджапура пишет свою «Китаб-е-Наврас», «Книгу девяти рас», сочетая исламскую преданность с индуистской эстетической теорией в синтезе, который мог возникнуть только в Декане." #NT!
 nd_dec.5.a: "Этот язык – душа нашей цивилизации." #NT!
 nd_dec_bahmani_foundations: "Фонды Бахмани" #NT!
 nd_dec_bahmani_foundations_desc: "Султанат Бахмани, основанный в 1347 году Алауддином Бахман-шахом, заложил основы исламского управления на Деканском плато." #NT!
 nd_dec_persianate_court: "Традиции Персидского двора" #NT!
 nd_dec_persianate_court_desc: "Персидский язык, обычаи и административная практика формируют управление Деканом, привлекая ученых и чиновников из Ирана и Центральной Азии." #NT!
 nd_dec_habshi_warriors: "Хабши Воины" #NT!
 nd_dec_habshi_warriors_desc: "Солдаты африканского происхождения, Хабши, служат элитными охранниками и доверенными военными командирами, их лояльность не испорчена местной фракционной политикой." #NT!
 nd_dec_deccan_plateau_agriculture: "Сельское хозяйство плато Декана" #NT!
 nd_dec_deccan_plateau_agriculture_desc: "Черные хлопковые почвы Декана поддерживают особые методы ведения сельского хозяйства, адаптированные к полузасушливому климату плато." #NT!
 nd_dec_dakhani_origins: "Дахани Истоки" #NT!
 nd_dec_dakhani_origins_desc: "В Декане появляется новый лингва-франка: Дахани смешивает хиндустани с местной лексикой маратхи, каннада и телугу." #NT!
 nd_dec_plateau_fortification: "Укрепления плато" #NT!
 nd_dec_plateau_fortification_desc: "Холмы Декана с плоскими вершинами представляют собой естественные оборонительные позиции, укрепленные массивными стенами и сложными водными системами." #NT!
 nd_dec_deccan_horse_trade: "Деканская торговля лошадьми" #NT!
 nd_dec_deccan_horse_trade_desc: "Аравийские и персидские боевые кони прибывают в порты Декана, поддерживая кавалерийские традиции султаната, которые играют центральную роль в его военной мощи." #NT!
 nd_dec_gawan_reforms: "Административные реформы Гавана" #NT!
 nd_dec_gawan_reforms_desc: "Радикальные реформы Махмуда Гавана реструктурируют государство Бахмани, разделив его на стандартизированные провинции и ограничив дворянскую автономию." #NT!
 nd_dec_deccani_cavalry_tradition: "Декканская кавалерийская традиция" #NT!
 nd_dec_deccani_cavalry_tradition_desc: "Легкие кавалерийские налетчики, барги, быстро наносят удары с плато, беспокоя линии снабжения и терроризируя фланги более крупных армий." #NT!
 nd_dec_deccan_trade_web: "Торговые сети Декана" #NT!
 nd_dec_deccan_trade_web_desc: "Караван-сараи связывают внутреннее плато с прибрежными портами, перевозя хлопок, алмазы, специи и изделия из металла по всему Декану.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_bidriware_craft: "Бидриварное Крафт" #NT!
 nd_dec_bidriware_craft_desc: "Город Бидар дал название бидриваре: изысканным металлическим изделиям из цинкового сплава, инкрустированным серебряной проволокой, уникальной ремесленной традицией Декана.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_cosmopolitan_court: "Космополитический суд" #NT!
 nd_dec_cosmopolitan_court_desc: "Суды Декана отличаются поразительным разнообразием. Индуистские администраторы, персидские ученые, африканские полководцы и тюркские воины служат бок о бок." #NT!
 nd_dec_deccani_architecture: "Архитектурная традиция Деккани" #NT!
 nd_dec_deccani_architecture_desc: "В Декане возникает уникальный архитектурный стиль, сочетающий в себе персидские купола, индийское декоративное искусство и гениальную гидротехнику." #NT!
 nd_dec_sultanate_artillery: "Султанатская артиллерийская традиция" #NT!
 nd_dec_sultanate_artillery_desc: "Султанаты Декана вкладывают значительные средства в пороховое оружие, поддерживая отряды опытных артиллеристов, которые сами отливают пушки.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_sultanate_alliance: "Султанат Альянс" #NT!
 nd_dec_sultanate_alliance_desc: "Соперничающие султанаты Декана обнаруживают, что их общие интересы перевешивают различия, когда они сталкиваются с общим врагом." #NT!
 nd_dec_golconda_diamonds: "Алмазные рудники Голконды" #NT!
 nd_dec_golconda_diamonds_desc: "Аллювиальные месторождения алмазов возле Голконды являются единственным известным в мире источником алмазов, производящим камни легендарного качества." #NT!
 nd_dec_topchi_gunners: "Топчи Канониры" #NT!
 nd_dec_topchi_gunners_desc: "Специализированные артиллерийские подразделения, топчи, осваивают искусство осадной войны с использованием тяжелых пушек, импортированных из Османской империи и отлитых на месте." #NT!
 nd_dec_dakhani_literature: "Литературный расцвет Дахани" #NT!
 nd_dec_dakhani_literature_desc: "Дакхани урду превращается в сложный литературный язык, создавая стихи, прозу и религиозные произведения, соединяющие исламские и индуистские традиции." #NT!
 nd_dec_textile_industry: "Текстильная промышленность Декана" #NT!
 nd_dec_textile_industry_desc: "Хлопковые и шелковые ткани из Декана ценятся во всем мире Индийского океана, от Восточной Африки до Юго-Восточной Азии.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_deccani_miniature_painting: "Миниатюрная живопись Деккани" #NT!
 nd_dec_deccani_miniature_painting_desc: "При дворах Биджапура и Голконды развивается особая школа миниатюрной живописи, сочетающая персидские, турецкие и местные индийские художественные традиции.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_western_coast_trade: "Западная прибрежная торговля" #NT!
 nd_dec_western_coast_trade_desc: "Контроль Биджапура над западными прибрежными портами обеспечивает доступ к торговле в Аравийском море, соединяя Декан с рынками Персидского залива и за его пределами." #NT!
 nd_dec_malik_ambar_legacy: "Наследие Малика Амбара" #NT!
 nd_dec_malik_ambar_legacy_desc: "Малик Амбар, родившийся в Эфиопии регент Ахмаднагара, возглавил партизанскую войну против Великих Моголов с многоэтнической армией, состоящей из десяти тысяч хабши и сорока тысяч деканцев." #NT!
 nd_dec_sipahi_cavalry: "Деккани Сипахи" #NT!
 nd_dec_sipahi_cavalry_desc: "Тяжелая кавалерия сипахи образует бронированное ядро ​​боевой линии султаната, атакуя копьями и мечами, чтобы проломить вражеские порядки." #NT!
 nd_dec_adil_shahi_patronage: "Покровительство Адил Шахи" #NT!
 nd_dec_adil_shahi_patronage_desc: "Ибрагим Адил Шах II из Биджапура получил титул «Джагадгуру», учителя мира, за покровительство музыке, поэзии и религиозной гармонии между конфессиями." #NT!
 nd_dec_qutb_shahi_governance: "Управление Кутб Шахи" #NT!
 nd_dec_qutb_shahi_governance_desc: "Правители Голконды Кутб-Шахи создают эффективный административный аппарат для управления богатством, полученным от торговли алмазами." #NT!
 nd_dec_diamond_trade_boom: "Бум алмазной торговли" #NT!
 nd_dec_diamond_trade_boom_desc: "Европейский спрос на алмазы Голконды резко возрос, привлекая голландских, французских и португальских торговцев на рынки султаната." #NT!
 nd_dec_mughal_resistance: "Сопротивление Моголам" #NT!
 nd_dec_mughal_resistance_desc: "Султанаты Декана ведут на протяжении поколений борьбу против экспансии Великих Моголов, используя местность, партизанскую тактику и дипломатию для сохранения своей независимости." #NT!
 nd_dec_nizam_shahi_revenue: "Система доходов Низама Шахи" #NT!
 nd_dec_nizam_shahi_revenue_desc: "Урегулирование доходов Малика Амбара устанавливает систематическое измерение земель и справедливое налогообложение, формируя основу управления Деканом на протяжении поколений." #NT!
 nd_dec_tofangchi_infantry: "Мушкетеры Тофангчи" #NT!
 nd_dec_tofangchi_infantry_desc: "Обученные мушкетеры с фитильными замками, тофангчи, обеспечивают дисциплинированную огневую мощь на поле боя, дополняя кавалерию и артиллерию султаната." #NT!
 nd_dec_hyderabad_administration: "Администрация Хайдарабада" #NT!
 nd_dec_hyderabad_administration_desc: "Низам Хайдарабада создает сложный государственный аппарат, сочетая традиционное управление Декани с современными бюрократическими методами." #NT!
 nd_dec_european_military_techniques: "Европейская военная техника" #NT!
 nd_dec_european_military_techniques_desc: "Контакт с европейскими военными советниками знакомит армии Декана с новыми методами обучения, проектированием укреплений и артиллерийской тактикой." #NT!
 nd_dec_deccani_water_engineering: "Водоснабжение Деккани" #NT!
 nd_dec_deccani_water_engineering_desc: "Персидские и местные инженеры-гидротехники разрабатывают сложные системы водоснабжения (акведуки, резервуары и подземные каналы), которые поддерживают города на засушливом плато." #NT!
 nd_dec_nizam_diplomacy: "Дипломатическое ремесло Низама" #NT!
 nd_dec_nizam_diplomacy_desc: "Низамы Хайдарабада лавируют между приходящим в упадок Моголом, растущими маратхами и наступающими европейскими державами с непревзойденным дипломатическим мастерством." #NT!
 nd_dec_deccani_trade_maturity: "Торговая зрелость Декани" #NT!
 nd_dec_deccani_trade_maturity_desc: "Столетия коммерческого развития создали зрелую торговую инфраструктуру, соединяющую Декан с мировыми рынками." #NT!
 nd_dec_nizam_modernization: "Модернизация Низама" #NT!
 nd_dec_nizam_modernization_desc: "Более поздние низамы инвестируют в образование, книгопечатание и институциональную реформу, закладывая основу для превращения Хайдарабада в центр современного образования." #NT!
 nd_dec_deccani_industrial_dawn: "Деккани Промышленный рассвет" #NT!
 nd_dec_deccani_industrial_dawn_desc: "В Декане возникают первые промышленные предприятия, занимающиеся переработкой хлопка, металлообработкой и производством вооружений с возрастающей механизацией.\n\n#italic Доступно в: $nd_dec_caravanserai$#!" #NT!
 nd_dec_hyderabad_state_reform: "Реформа штата Хайдарабад" #NT!
 nd_dec_hyderabad_state_reform_desc: "Правительство Низама проводит систематическую реформу, создавая современные министерства, суды и налоговые департаменты." #NT!
 nd_dec_cultural_synthesis: "Ганга-Джамуни Техзиб" #NT!
 nd_dec_cultural_synthesis_desc: "Декан достигает замечательного культурного синтеза, Ганга-Джамуни Техзиб, где индуистские и мусульманские традиции смешиваются в искусстве, архитектуре, языке и повседневной жизни." #NT!
 nd_dec_deccani_legacy: "Декканское наследие" #NT!
 nd_dec_deccani_legacy_desc: "Культурные достижения султанатов Декана живы: в архитектуре, в языке, в памяти цивилизации, соединившей миры." #NT!
 nd_dec_modern_artillery_reform: "Реформа современной артиллерии" #NT!
 nd_dec_modern_artillery_reform_desc: "Армия Низама применяет современные артиллерийские методы, создавая литейные заводы и школы подготовки артиллеристов." #NT!
 a_nd_dec_habshi_guard: "Хабши Страж" #NT!
 a_nd_dec_habshi_guard_desc: "Элитные солдаты африканского происхождения, которые служат личной охраной султана и пользуются наибольшим доверием военачальников. Их лояльность не подлежит сомнению." #NT!
 a_nd_dec_bargi: "Деккани Барджи" #NT!
 a_nd_dec_bargi_desc: "Легкие кавалерийские рейдеры, которые быстро наносят удары с плато, беспокоя линии снабжения и используя бреши во вражеских формированиях." #NT!
 a_nd_dec_topchi: "Султанат Топчи" #NT!
 a_nd_dec_topchi_desc: "Специализированные артиллерийские подразделения, обученные изготовлению и использованию тяжелых осадных орудий, опираясь на османский и персидский опыт." #NT!
 a_nd_dec_sipahi: "Деккани Сипахи" #NT!
 a_nd_dec_sipahi_desc: "Тяжелая кавалерия в броне, составляющая ударное ядро ​​армии султаната, атакует копьями и мечами, разрушая линии врага." #NT!
 a_nd_dec_ambar_guerrilla: "Партизаны Амбара" #NT!
 a_nd_dec_ambar_guerrilla_desc: "Нерегулярные бойцы в традициях Малика Амбара, мастера засад и местности, которые беспокоят большие армии с помощью тактики «нападай и беги»." #NT!
 a_nd_dec_tofangchi: "Деккани Тофангчи" #NT!
 a_nd_dec_tofangchi_desc: "Обученные мушкетеры с фитильными замками, которые обеспечивают дисциплинированную огневую мощь дальнего боя, составляют пехотный костяк модернизированной армии султаната." #NT!
 nd_dec_madrasa: "Бидар медресе" #NT!
 nd_dec_madrasa_desc: "Центр исламского образования, созданный по образцу великого медресе Махмуда Гавана, с трехэтажной библиотекой и известным профессорско-преподавательским составом." #NT!
 nd_dec_madrasa_upkeep: "Научные материалы" #NT!
 nd_dec_madrasa_upkeep_desc: "Бумага, чернила и оборудование, необходимые для содержания библиотеки и учебных помещений медресе." #NT!
 nd_dec_darbar: "Декчани Дарбар" #NT!
 nd_dec_darbar_desc: "Большой зал для аудиенций, где султан проводит суд, принимая дворян, иностранных послов и просителей из всех общин." #NT!
 nd_dec_darbar_upkeep: "Обслуживание суда" #NT!
 nd_dec_darbar_upkeep_desc: "Шелковая мебель, красители и тонкая ткань, необходимые для поддержания достоинства королевского двора." #NT!
 nd_dec_caravanserai: "Декканский караван-сарай" #NT!
 nd_dec_caravanserai_desc: "Укрепленная перевалочная станция на торговых путях Декана, предоставляющая жилье, склады и торговые помещения для торговцев и их караванов." #NT!
 nd_dec_caravanserai_upkeep: "Обеспечение караванов" #NT!
 nd_dec_caravanserai_upkeep_desc: "Скот и пшеница необходимы для кормления и содержания животных и путешественников, проходящих через караван-сарай." #NT!
 nd_dec_diamond_workshop: "Мастерская алмазной резки" #NT!
 nd_dec_diamond_workshop_desc: "Специализированная мастерская, где мастера-гранильщики ограняют и полируют необработанные алмазы из рудников Голконды для продажи международным торговцам." #NT!
 nd_dec_diamond_cutting: "Алмазный гранильный станок" #NT!
 nd_dec_diamond_cutting_desc: "Мастера-гранильщики ограняют и полируют необработанные алмазы из рудников Голконды, превращая их в изысканные драгоценные камни для международной ювелирной торговли." #NT!
 nd_dec_qila: "Деккани Кила" #NT!
 nd_dec_qila_desc: "Массивная крепость на плато с толстыми каменными стенами, сложной системой водоснабжения и потрясающим видом на окружающую местность." #NT!
 nd_dec_qila_upkeep: "Обслуживание крепости" #NT!
 nd_dec_qila_upkeep_desc: "Камень, оружие и инструменты, необходимые для поддержания крепостных стен, оборонительных сооружений и гарнизонного оборудования." #NT!
 nd_dec_rauza: "Ибрагим Рауза" #NT!
 nd_dec_rauza_desc: "Монументальный комплекс гробниц и мечетей в архитектурном стиле Деккани с элегантными куполами, замысловатой каллиграфией и регулярными садами." #NT!
 nd_dec_rauza_upkeep: "Уход за памятником" #NT!
 nd_dec_rauza_upkeep_desc: "Камень, красители и мрамор необходимы для сохранения великолепия резных поверхностей и декоративных инкрустаций памятника." #NT!
 nd_dec_textile_weaving_pm: "Деккани Текстильное Ткачество" #NT!
 nd_dec_textile_weaving_pm_desc: "Традиционное плетение тонких хлопчатобумажных и шелковых тканей, окрашенных местными и импортными пигментами." #NT!
 nd_dec_bidriware_pm: "Металлообработка" #NT!
 nd_dec_bidriware_pm_desc: "Отличительное ремесло Бидара: сосуды из цинкового сплава, инкрустированные изящными узорами из серебряной проволоки." #NT!
 nd_dec_horse_trade_pm: "Торговля арабскими лошадьми" #NT!
 nd_dec_horse_trade_pm_desc: "Импорт и разведение боевых коней из Аравии и Персии: лошадей и зерна на корм поддерживают кавалерийские табуны, необходимые для армии султаната." #NT!
 nd_dec_armory_pm: "Оружейная палата Султаната" #NT!
 nd_dec_armory_pm_desc: "Железо и готовое вооружение поставляют арсенал караван-сарая, экипируя эскорт и гарнизоны, защищающие торговые пути." #NT!
 levy_nd_dec_ambar_guerrilla: "Партизанский отряд Амбара" #NT!
 levy_nd_dec_ambar_guerrilla_desc: "Нерегулярные бойцы, выросшие в сельской местности в традициях партизанских кампаний Малика Амбара." #NT!
 levy_nd_dec_bargi: "Кавалерийский сбор Барги" #NT!
 levy_nd_dec_bargi_desc: "Легкие кавалерийские налетчики, набранные из мусульманских и индуистских дворянских семей Деккани." #NT!
 a_nd_dec_nizam_field_gun: "Полевая пушка Низам" #NT!
 a_nd_dec_nizam_field_gun_desc: "Современные артиллерийские орудия, отлитые на литейных заводах Низама, укомплектованные обученными артиллеристами, использующими европейские методы стрельбы." #NT!
 nd_dec_baoli: "Деккани Баоли" #NT!
 nd_dec_baoli_desc: "Ступенчатый колодец с искусной каменной архитектурой, обеспечивающий надежное водоснабжение поселений на засушливом плато Декан." #NT!
 nd_dec_baoli_upkeep: "Обслуживание скважин" #NT!
 nd_dec_baoli_upkeep_desc: "Камень, инструменты и древесина, необходимые для ухода за ступенями, каналами и системами распределения воды баоли." #NT!
 nd_dec_revenue_office: "Налоговое управление Низама" #NT!
 nd_dec_revenue_office_desc: "Правительственное учреждение, отвечающее за землеустройство, оценку налогов и сбор доходов в соответствии с методами, установленными Маликом Амбаром." #NT!
 nd_dec_revenue_office_upkeep: "Административные товары" #NT!
 nd_dec_revenue_office_upkeep_desc: "Бумага, пчелиный воск для печатей и письменные принадлежности для записей, бухгалтерских книг и официальной корреспонденции налоговой службы." #NT!
 nd_dec_painting_atelier_pm: "Ателье живописи Деккани" #NT!
 nd_dec_painting_atelier_pm_desc: "Художественная мастерская, производящая миниатюрные картины в характерном стиле Декани, сочетающем персидские, турецкие и индийские художественные традиции." #NT!
 nd_dec_cotton_milling_pm: "Производство хлопка Deccani" #NT!
 nd_dec_cotton_milling_pm_desc: "Механизированные предприятия по переработке хлопка, использующие запасы ткани и инструменты для подготовки и отделки текстиля для известной экспортной торговли Декана." #NT!
 nd_dec_formed_tt: "Декан был основан" #NT!
 nd_dec_path_a_tt: "Выбрать Меч Декана" #NT!
 nd_dec_path_b_tt: "Выбрал великолепие Голконды" #NT!
 nd_dec_destiny: "Декан Асцендент" #NT!
 nd_dec_destiny_desc: "Был провозглашен Деканский султанат. Объедините королевство и выберите путь, который определит судьбу нации." #NT!
 nd_dec_dest_khandesh: "Кампания Хандеш" #NT!
 nd_dec_dest_khandesh_desc: "Захватите стратегические перевалы Кхандеш и богатые земли Видарбхи. Бурханпур и Амравати контролируют маршруты в центральную Индию." #NT!
 nd_dec_dest_malwa: "Завоевание малва" #NT!
 nd_dec_dest_malwa_desc: "Двигайтесь на север, в самое сердце Индии. Удджайн, древняя столица малва, и Сурат, жемчужина побережья Гуджарата, закрепят владычество султаната над внутренними районами субконтинента." #NT!
 nd_dec_dest_delhi: "Марш на Дели" #NT!
 nd_dec_dest_delhi_desc: "Главный приз: Дели и Агра, два центра власти Индостана. Только по-настоящему могущественный Декан может претендовать на север и объединить субконтинент под зеленым знаменем." #NT!
 nd_dec_dest_trade_reach: "Алмазная дорога" #NT!
 nd_dec_dest_trade_reach_desc: "Расширьте коммерческие сети султаната на Гуджарат. Чампанер охраняет северные торговые пути, а рынки драгоценных камней должны находиться под твердым контролем Деккани." #NT!
 nd_dec_dest_cambay: "Камбейский перевалочный пункт" #NT!
 nd_dec_dest_cambay_desc: "Хамбат, Камбей для европейцев, является воротами в Аравийское море. С созданием банковских учреждений и обеспечением безопасности порта Декан сможет доминировать в торговле в Индийском океане." #NT!
 nd_dec_dest_indian_ocean: "Хозяин Индийского океана" #NT!
 nd_dec_dest_indian_ocean_desc: "Захватите Ормуз, узловой пункт торговли в Персидском заливе. Благодаря участию глобальных торговых институтов и финансированию этих усилий за счет алмазов Голконды, Декан будет контролировать самые богатые морские пути в мире." #NT!
 nd_dec.6.t: "Асцендент Декана" #NT!
 nd_dec.6.d: "Деканский султанат представляет собой единую державу на большом плато. От Западных Гат до побережья Коромандела это королевство простирается на одних из самых плодородных и богатых земель во всей Индии. Теперь перед нами стоит вопрос, что делать с этой силой. Путь впереди долгий, но фундамент прочный." #NT!
 nd_dec.6.a: "Декан выстоит." #NT!
 nd_dec.7.t: "Кампания Хандеш" #NT!
 nd_dec.7.d: "Наши армии прорвались через перевалы Сатпура и захватили укрепленные города Кхандеш и Видарбха. Бурханпур с его массивной крепостью Асиргарх, охраняющей подход, пал от рук наших осадных инженеров. Амравати и богатые хлопковые земли Берара — наши. Дорога в центральную Индию открыта перед нами: султанаты Малва и Гуджарат теперь с трепетом смотрят на наши знамена." #NT!
 nd_dec.7.a: "Проходы наши. Центральная Индия ждет." #NT!
 nd_dec.8.t: "Завоевание малва" #NT!
 nd_dec.8.d: "Удджайн, древний город, служивший столицей империй со времен Ашоки, развевает наше знамя. Сурат, величайший порт западной Индии, направляет в нашу казну богатства торговли Аравийского моря. Султанат превратился из плато-царства в континентальную державу. Как нам закрепить эти завоевания? Некоторые советуют нам объединить эти разнообразные земли в единую администрацию, в то время как другие призывают нас использовать наше военное преимущество, пока наши армии находятся на пике своей силы." #NT!
 nd_dec.8.a: "Интегрируйте завоеванные земли в состав нашего государства." #NT!
 nd_dec.8.b: "Наши армии вкусили победу: двигайтесь вперед." #NT!
 nd_dec.9.t: "Марш на Дели" #NT!
 nd_dec.9.d: "Дели пал. Город, который был резиденцией всех великих североиндийских империй (Султаната, Великих Моголов, самой идеи суверенитета Индостана), теперь подчиняется Декану. Агра с ее огромным красным фортом и богатствами Доаба тоже наша. Ни один султан Деккани никогда не достиг того, чего достигли мы. Теперь возникает серьезный вопрос: претендуем ли мы на мантию общеиндийского суверенитета, называя себя султанами Индостана и впитывая северные традиции, или же мы будем управлять севером как явно империей Декани, навязывая свои собственные традиции побежденным?" #NT!
 nd_dec.9.a: "Мы теперь султан Индостана." #NT!
 nd_dec.9.b: "Декан управляет севером на своих условиях." #NT!
 nd_dec.10.t: "Алмазная дорога" #NT!
 nd_dec.10.d: "Торговые сети Деккани теперь простираются от алмазных рудников Голконды через торговые коридоры Гуджарата до рынков всего мира. Чампанер, контролирующий маршруты в северный Гуджарат, взят под охрану. Драгоценные камни из наших рудников текут через рынки, которые мы контролируем, и богатство, которое они генерируют, меняет нашу экономику. Европейские торговцы приезжают все чаще, стремясь приобрести камни, которые будут украшать короны королей от Лиссабона до Москвы." #NT!
 nd_dec.10.a: "Алмазная дорога принадлежит нам." #NT!
 nd_dec.11.t: "Камбейский перевалочный пункт" #NT!
 nd_dec.11.d: "Хамбат, известный европейцам как Камбей, на протяжении веков был величайшим торговым центром западной Индии. Теперь оно наше. Гавань города принимает корабли из Адена, Ормуза, Малакки и побережья Суахили. Благодаря созданию современных банковских учреждений наши торговцы могут финансировать предприятия, которые было бы невообразимо еще поколение назад. Вопрос в том, как использовать эту неожиданную удачу: будем ли мы ужесточать контроль над торговлей алмазами, создавая монополию, которая максимизирует наши доходы, или же мы будем развивать сам Камбей как открытый перевалочный пункт, привлекающий торговцев из всех стран?" #NT!
 nd_dec.11.a: "Контролируйте алмазы: монополия – это власть." #NT!
 nd_dec.11.b: "Превратите Камбей в мировой рынок." #NT!
 nd_dec.12.t: "Хозяин Индийского океана" #NT!
 nd_dec.12.d: "Ормуз наш. Крошечный остров, контролирующий вход в Персидский залив (через который проходят богатства Персии, Месопотамии и Шелкового пути), теперь развевается под знаменем Декани. Обладая алмазами Голконды, торговцами Камбея и стратегическим узким местом Ормуза, Декан управляет коммерческой империей, простирающейся от рудников плато до рынков Персидского залива. Ни одна индийская держава никогда не занимала такой позиции. Вопрос в том, использовать ли это богатство для того, чтобы поднять Декан на вершину культурных достижений, или для того, чтобы проецировать военно-морскую мощь за океан." #NT!
 nd_dec.12.a: "Пусть свет Голконды затмит мир." #NT!
 nd_dec.12.b: "Сам океан будет нашим владением." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_heartland_conqueror: "Завоеватель Хартленда" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_heartland_conqueror: "Административная машина Декана поглощает завоеванные центральные районы Центральной Индии, подавляя сепаратизм и интегрируя различные группы населения, хотя упор на консолидацию делает оправдание новых войн более дорогостоящим." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_plateau_warlord: "Полководец плато" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_plateau_warlord: "Победа порождает победу. Армия, завоевавшая малва и Гуджарат, марширует с уверенностью проверенных ветеранов, хотя опустошенные земли позади них медленно восстанавливаются." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_sultan_of_hindustan: "Султан Индостана" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_sultan_of_hindustan: "Декан претендует на мантию общеиндийского суверенитета, требуя подчинения северных лордов и привязывая подданных к зеленому знамени посредством легитимности, а не силы." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_deccani_imperium: "Деккани Империум" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_deccani_imperium: "Декан управляет севером как военная империя, усиливая свои гарнизоны, поддерживая свои армии в полевых условиях и гарантируя, что боевой дух никогда не пошатнется на обширных территориях." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_diamond_monopoly: "Алмазная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_diamond_monopoly: "Контроль султаната над торговлей алмазами является абсолютным. Каждый камень из Голконды проходит через руки Деккани, а доходы идут на финансирование культурной трансформации и расширения торговли, хотя поддержание монополии напрягает военный бюджет." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_cambay_entrepot: "Камбейский перевалочный пункт" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_cambay_entrepot: "Камбей процветает как открытый рынок, его гавани заполнены кораблями со всего Индийского океана. Процветают морские предприятия, привлекающие в порты султаната моряков и корабелов." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_golconda_zenith: "Голконда Зенит" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_golconda_zenith: "Декан достиг вершины своего могущества. Вассальные государства быстро поглощаются, торговые пути простираются до далеких берегов, а флот султаната защищает его коммерческие интересы как от пиратов, так и от конкурентов." #NT!
 STATIC_MODIFIER_NAME_nd_dec_dest_ocean_sovereign: "Океан Суверен" #NT!
 STATIC_MODIFIER_DESC_nd_dec_dest_ocean_sovereign: "Декан проецирует военно-морскую мощь через Индийский океан, его военные корабли наносят сокрушительные удары по противникам, блокируют вражеские порты, а его легкие эскадры контролируют морские пути от Ормуза до побережья Малабара." #NT!
 nd_dec_sultani_arsenal: "Султани Арсенал" #NT!
 nd_dec_sultani_arsenal_desc: "Огромный военный комплекс, в котором расположены литейные заводы, оружейные склады и казармы, производящие оружие и обучающие солдат, поддерживающих военную машину Деккани." #NT!
 nd_dec_sultani_arsenal_upkeep: "Арсенал Провизия" #NT!
 nd_dec_sultani_arsenal_upkeep_desc: "Железо, оружие и селитра служат топливом для литейных цехов и магазинов арсенала." #NT!
 nd_dec_hira_mahal: "Хира Махал" #NT!
 nd_dec_hira_mahal_desc: "Алмазный дворец: памятник богатству Голконды, его стены украшены драгоценными камнями, а сады могут соперничать с садами Исфахана и Константинополя." #NT!
 nd_dec_hira_mahal_upkeep: "Обслуживание дворца" #NT!
 nd_dec_hira_mahal_upkeep_desc: "Драгоценные камни, мрамор и стекло поддерживают легендарное великолепие Diamond Palace." #NT!
 dec_tarafdari_system_bureaucracy: "Система Тарафдари" #NT!
 dec_tarafdari_system_bureaucracy_desc: "Основатель Бахмани Хасан Гангу разделил королевство на четыре атрафа (Даулатабад, Берар, Бидар и Гулбарга), каждый из которых управлялся тарафдаром с правами доходов, сбора войск и цитадели. Это соглашение распространило королевскую власть на плато, но превратило его великую знать в аристократию, устанавливающую королей, чьи споры в конечном итоге разделили земли Бахмани на пять султанатов Декана." #NT!
 dec_gawan_centralization_bureaucracy: "Централизация Махмуда Гавана" #NT!
 dec_gawan_centralization_bureaucracy_desc: "Ходжа Махмуд Гаван, уроженец Ирана, визирь трех султанов Бахмани, реструктурировал королевство между 1463 и 1481 годами. Он удвоил четыре атрафа до восьми, удалил провинциальные цитадели из тарафдаров и передал их под юрисдикцию королевских офицеров, обследовал земли, несущие харадж, и основал великое медресе в Бидаре. Реформы ненадолго остановили упадок Бахмани; Гаван был казнен по сфабрикованному обвинению в 1481 году, и через десять лет королевство распалось." #NT!
 dec_deccani_pardesi_factions_bureaucracy: "Суд Деккани-Пардези" #NT!
 dec_deccani_pardesi_factions_bureaucracy_desc: "Суды Декана были структурно разделены на партию Декани, состоящую из местных мусульман-суннитов и военных рабов-хабши, и партию Пардези или Афаки, состоящую из иранских, тюркских и иракских новичков, часто шиитов-двунадесятников. Обе фракции получали отдельные стипендии, комплектовали разные кавалерийские полки и покровительствовали конкурирующим духовным школам. Поддерживаемое в равновесии, соперничество породило блестящую космополитическую придворную культуру Бахмани-Биджапура; игнорирование, оно привело к череде гражданских войн." #NT!
 dec_vijayanagara_nayakas_bureaucracy: "Виджаянагара наяки" #NT!
 dec_vijayanagara_nayakas_bureaucracy_desc: "Система амара-наянкара, систематизированная при Кришнадеварайе (годы правления 1509-1529), предоставляла военным командирам распределение доходов по деревням и фортам в обмен на размещение определенных контингентов кавалерии, пехоты и слонов. Наяки Мадурая, Танджавура, Джинджи, Иккери и Майсура ответили райям ежегодной данью и обязательством маршировать. После Таликоты в 1565 году они стали де-факто суверенными державами страны тамилов и каннада." #NT!
 dec_persianate_diwan_bureaucracy: "Персидский Диван" #NT!
 dec_persianate_diwan_bureaucracy_desc: "Кутб-шахи Голконды сделали персидский язык своим придворным и административным языком, импортировав канцелярскую практику из Сефевидского Ирана вместе с шиитскими улемами-двунадесятниками; Адиль Шахи Биджапур следовал за своим основателем персидского происхождения Юсуфом Адил Шахом. Диваны составляли фирманы в форме насталик, проверяли карханы и контролировали пожертвования вакфов. Персидский оставался языком администрации Декана до эпохи Асафа Джахи, исчезая только под британским резидентством." #NT!
 dec_deshmukh_watandari_bureaucracy: "Дешмукх Ватандари" #NT!
 dec_deshmukh_watandari_bureaucracy_desc: "Дешмукх и его клерикальный коллега дешпанде были потомственными деревенскими старостами маратхи, чьи ватан (должностное наследие) давали права на фиксированную долю доходов деревни, судебную власть в разрешении кастовых споров и небольшую вооруженную свиту. Ватандары возникли еще до Бахмани, упорствовали при Адиль-Шахах и снабжали Шиваджи как его первыми союзниками, так и самыми упорными противниками. Их права были настолько глубоко укоренены, что государства Великих Моголов, Маратхи и Асаф Джахи предпочли кооптировать их, а не лишить их собственности." #NT!
 dec_asaf_jahi_subadari_bureaucracy: "Асаф Джахи Субадари" #NT!
 dec_asaf_jahi_subadari_bureaucracy_desc: "Мир Камар-уд-Дин Хан, могольский субадар Декана и титулованный Низам аль-Мульк Асаф Джа I, порвал с Дели в 1724 году и основал династию Асафа Джахи в Хайдарабаде. Низамат сохранил образец субадари Великих Моголов, но впитал в себя культуру персидского двора Адил Шахи, отчеты о доходах Кутб Шахи Голконды и сети ватандаров маратхов по всему плато. Государство пережило соперников Великих Моголов, маратхов и Майсура, войдя в британскую систему резидентства в 1798 году, по-прежнему управляя большей территорией, чем любое другое индийское княжество." #NT!
 AUTO_MODIFIER_NAME_nd_dec_bureaucracy_authority: "Бюрократическая власть Декана" #NT!
 AUTO_MODIFIER_DESC_nd_dec_bureaucracy_authority: "Единый Декан унаследовал институциональный репертуар султаната Бахмани, пяти султанатов-преемников, Виджаянагара и Асаф Джахи Низамата: достаточно управленческих традиций, чтобы укомплектовать три постоянных бюрократических офиса за пределами столицы." #NT!
