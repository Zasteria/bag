l_russian:
 STATIC_MODIFIER_NAME_nd_hab_aeiou_dynasty: "AEIOU: Путь Габсбургов" #NT!
 STATIC_MODIFIER_DESC_nd_hab_aeiou_dynasty: "Аллес Эрдрайх Ist Oesterreich Untertan. Посредством стратегических браков, осторожных союзов и династических накоплений Дом Габсбургов строит свою империю не только мечом, но и посредством алтаря и стола договоров." #NT!
 STATIC_MODIFIER_NAME_nd_hab_antemurale: "Антемурале христианитатис" #NT!
 STATIC_MODIFIER_DESC_nd_hab_antemurale: "Австрия выступает оплотом христианского мира, ее армия закалена поколениями приграничных войн против османской экспансии. Военная граница простирается от Адриатики до Карпат и защищается профессиональными солдатами, закаленными в горниле вечного пограничного конфликта." #NT!
 nd_hab.1.t: "Возвышение Австрии" #NT!
 nd_hab.1.d: "Под нашим правлением разрозненные альпийские герцогства были объединены в единое королевство. Из Вены мы исследуем земли, простирающиеся от Дуная до горных перевалов, владения, построенные как на основе брачных контрактов, так и на основе военного мастерства. Вопрос теперь в том, каким государством станет Австрия.\n\nПойдем ли мы по пути Габсбургов, терпеливых накопителей корон посредством династического союза, сватов, которые меняют карту Европы из спальни и за столом переговоров? Или нам следует принять на себя роль щита христианского мира, направив свои силы на военную границу, которая охраняет восточный фланг Европы от всех, кто может ему угрожать?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_hab.1.a: "Пусть другие ведут войну: мы поженимся." #NT!
 nd_hab.1.b: "Мы — щит христианского мира." #NT!
 nd_hab.2.t: "Прагматическая санкция" #NT!
 nd_hab.2.d: "Император Карл VI, не имея наследника мужского пола, годами добивался признания того, что владения Габсбургов могут перейти безраздельно к преемнице-женщине. Прагматическая санкция 1713 года устанавливает принцип неделимой преемственности, но ее истинное испытание наступит, когда юная Мария Терезия унаследует трон, и половина Европы попытается расчленить ее наследство.\n\nГрядущий кризис потребует выбора. Инвестируем ли мы в юридические и дипломатические рамки, которые связывают наши разнообразные владения посредством династического права? Или мы идем по пути Марии Терезии, восстанавливая армию с ее основ, создавая военные академии и создавая современную боевую силу, которую не сможет преодолеть ни одна коалиция?" #NT!
 nd_hab.2.a: "Наследование должно быть закреплено законом." #NT!
 nd_hab.2.b: "Преемственность должна быть обеспечена силой." #NT!
 STATIC_MODIFIER_NAME_nd_hab_pragmatic_succession: "Прагматическая преемственность" #NT!
 STATIC_MODIFIER_DESC_nd_hab_pragmatic_succession: "Прагматическая санкция юридически связывает владения Габсбургов. Благодаря дипломатическому признанию и династическому праву гарантируется неделимость нашего королевства." #NT!
 STATIC_MODIFIER_NAME_nd_hab_theresian_reform: "Терезианская военная реформа" #NT!
 STATIC_MODIFIER_DESC_nd_hab_theresian_reform: "После шока от потери Силезии Мария Терезия провела капитальный ремонт армии Габсбургов. Профессиональная подготовка, стандартизированное оборудование и реформированный офицерский корпус превращают имперскую армию в современную боевую силу." #NT!
 nd_hab.3.t: "Государство камералистов" #NT!
 nd_hab.3.d: "Наука камерализма (систематическое изучение государственного управления, налоговой политики и управления экономикой) пустила корни в университетах земель Габсбургов. Если когда-то сбор доходов был случайным и провинциальным, то новое поколение обученных бюрократов теперь применяет рациональные принципы к управлению. Кафедры Cameralist, созданные в Вене и Праге, выпускают администраторов, которые понимают доходы от добычи полезных ископаемых, торговую политику и управление населением как взаимосвязанные системы.\n\nЭто преобразование австрийского государства из феодального наследия в рационализированную административную машину определит нашу способность конкурировать с великими державами Европы." #NT!
 nd_hab.3.a: "Разум должен руководить государством." #NT!
 STATIC_MODIFIER_NAME_nd_hab_cameralist_state: "Администрация камерылиста" #NT!
 STATIC_MODIFIER_DESC_nd_hab_cameralist_state: "Поколение бюрократов-камеристов с университетским образованием сегодня управляет государственными финансами, промышленностью и населением с систематической рациональностью." #NT!
 nd_hab.4.t: "Ландскнехты Максимилиана" #NT!
 nd_hab.4.d: "После опустошительных побед Швейцарии при Морате и Нанси император Максимилиан I назначил солдат нового типа. Ландскнехты, созданные по образцу грозных швейцарских Рейслауферов, но верные короне Габсбургов, представляют собой профессиональную стрелковую пехоту, организованную в Фенляйн из нескольких сотен человек. Их передние ряды составляют доппельсолднеры, опытные солдаты, вооруженные массивными мечами Цвайхендер или аркебузами, которые получают двойную плату за пребывание в самой смертоносной позиции.\n\nМаксимилиан отменил арбалет в военном использовании, полностью заменив его огнестрельным оружием, - смелое нововведение, которое ставит армию Габсбургов на передовую пороховую революцию. Эти ландскнехты станут основой имперских армий по всей Европе." #NT!
 nd_hab.4.a: "Солдаты Императора готовы." #NT!
 nd_hab_privilegium_maius: "Привилегиум Майус" #NT!
 nd_hab_privilegium_maius_desc: "Поддельные привилегии Рудольфа IV повышают статус Австрии среди имперских территорий, предоставляя Эрцгерцогству исключительный юридический статус и церемониальный приоритет." #NT!
 nd_hab_hofkammer_tradition: "Хофкамерское финансовое управление" #NT!
 nd_hab_hofkammer_tradition_desc: "Создание Фердинандом I Хофкамеры в 1527 году централизовало финансовый надзор Габсбургов, контролируя чеканку монет, доходы от добычи полезных ископаемых, пошлины и прямое налогообложение через постоянное бюрократическое учреждение." #NT!
 nd_hab_schwaz_silver: "Швац Сильвер и Идрия Меркьюри" #NT!
 nd_hab_schwaz_silver_desc: "Великие рудники Швац в Тироле, когда-то крупнейший серебряный рудник в Европе, и ртутные месторождения в Идрии приносят Габсбургам доходы, которые обеспечивают как армию, так и дипломатию.\n\n#italic Доступно в: $nd_hab_hofkammer$#!" #NT!
 nd_hab_landsknechte: "Ландскнехте Традиция" #NT!
 nd_hab_landsknechte_desc: "Ландскнехты Максимилиана I, профессиональная стрелковая пехота, созданная по образцу швейцарской, составляют основу военной мощи Габсбургов. Их передние ряды доппельсолднеров и акцент на огнестрельном оружии, а не на арбалетах, свидетельствуют о революционном подходе к ведению войны." #NT!
 nd_hab_festungsbau: "Фестунгсбаукунст" #NT!
 nd_hab_festungsbau_desc: "Военные инженеры Габсбургов разрабатывают сложные фортификационные системы, адаптированные для горной границы, включая итальянские принципы в альпийскую оборонительную архитектуру." #NT!
 nd_hab_militargrenze_levy: "Милитаргренце" #NT!
 nd_hab_militargrenze_levy_desc: "Военная граница, Militärgrenze, расселяет хорватских и сербских колонистов вдоль османской границы, предоставляя им землю в обмен на вечную военную службу в качестве ополчения Гренцера." #NT!
 nd_hab_baroque_patronage: "Покровительство двора в стиле барокко" #NT!
 nd_hab_baroque_patronage_desc: "Двор Контрреформации в Вене становится центром великолепия барокко. Фишер фон Эрлах, Хильдебрандт и их преемники преобразовывают столицу церквями, дворцами и библиотеками, которые символизируют власть Габсбургов и католическую преданность." #NT!
 nd_hab_theresian_academy: "Терезианская военная академия" #NT!
 nd_hab_theresian_academy_desc: "Военная академия Марии Терезии в Винер-Нойштадте, Терезианум, повышает профессионализм офицерского корпуса Габсбургов, обучая новое поколение командиров тактике, фортификации и лидерству." #NT!
 nd_hab_kurassiere: "Императорский Кюрассиер" #NT!
 nd_hab_kurassiere_desc: "Тяжелые кирасирские полки армии Габсбургов, вооруженные всадниками в доспехах и вооруженными пистолетами и саблями, остаются разрушительной ударной силой на европейских полях сражений даже в эпоху пороха." #NT!
 nd_hab_cameralism: "Институционализация камералистов" #NT!
 nd_hab_cameralism_desc: "Камерализм, систематическая наука государственного управления, институционализирована в университетах Габсбургов, обучая бюрократов финансовой политике, управлению горнодобывающей промышленностью и экономическому управлению." #NT!
 nd_hab_pragmatic_sanction: "Прагматические санкции" #NT!
 nd_hab_pragmatic_sanction_desc: "Прагматическая санкция 1713 года устанавливает правовую основу для неделимой преемственности владений Габсбургов, связывая различные королевства и герцогства под единым сувереном независимо от пола правителя." #NT!
 a_nd_hab_kurassiere: "Императорский Кюрассиер" #NT!
 a_nd_hab_kurassiere_desc: "Тяжелая бронетанковая кавалерия армии Габсбургов атакует позиции врага с разрушительной ударной силой. Оснащен полудоспехами, пистолетами и тяжелыми саблями." #NT!
 a_nd_hab_grenzer_militia: "Гренцер Милиция" #NT!
 a_nd_hab_grenzer_militia_desc: "Хорватские и сербские приграничные поселенцы, которые служат легкой пехотой на военной границе, защищая границу Габсбургов от османских набегов в обмен на земельные гранты." #NT!
 nd_hab_hofkammer: "Хофкамер" #NT!
 nd_hab_hofkammer_desc: "Судебная палата, центральное налоговое управление государства Габсбургов, контролирующее доходы от горнодобывающей промышленности, чеканку монет, пошлины и сбор налогов через постоянный бюрократический аппарат." #NT!
 nd_hab_hofkammer_administration: "Фискальное управление" #NT!
 nd_hab_hofkammer_administration_desc: "Постоянный штат служащих и аудиторов Хофкамеры ведет государственные книги, составляет подробные финансовые отчеты и принимает высокопоставленных лиц в официальной одежде." #NT!
 nd_hab_festung: "Габсбург Фестунг" #NT!
 nd_hab_festung_desc: "Укрепление-звезда, построенное в соответствии с инженерными принципами Габсбургов, сочетающее итальянский дизайн с адаптацией к горной альпийской границе." #NT!
 nd_hab_festung_upkeep: "Обслуживание укреплений" #NT!
 nd_hab_festung_upkeep_desc: "Гарнизон и каменная кладка Фестунга требуют постоянных инвестиций: камня для стен и облицовки, древесины для частоколов и внутренних работ, а также вооружения для защитников." #NT!
 nd_hab_cameralist_institut: "Институт кинооператоров" #NT!
 nd_hab_cameralist_institut_desc: "Центр образования и исследований камералистов, обучающий бюрократов систематической науке государственного управления, налоговой политике, управлению горнодобывающей промышленностью, регулированию торговли и управлению народонаселением." #NT!
 nd_hab_cameralist_research: "Камералистические исследования" #NT!
 nd_hab_cameralist_research_desc: "Академическое изучение налогово-бюджетной политики, экономического управления и административной науки требует печатных текстов, научных справочных работ и оптических инструментов для точного наблюдения, которого требует метод Камералиста." #NT!
 nd_hab_theresianum: "Терезианум" #NT!
 nd_hab_theresianum_desc: "Военная академия в традициях реформ Марии Терезии в Винер-Нойштадте, обучающая офицеров современной тактике, осадной технике и военному руководству." #NT!
 nd_hab_academy_operations: "Операции Академии" #NT!
 nd_hab_academy_operations_desc: "Для подготовки офицерского корпуса необходимы учебники и карты для обучения, оружие и строевое снаряжение для полевых учений, кожа для обмундирования и конского снаряжения." #NT!
 nd_hab_mining_operations: "Габсбургские горнодобывающие предприятия" #NT!
 nd_hab_mining_operations_desc: "Систематический надзор за добычей полезных ископаемых в Альпах (серебро из Шваца, медь и ртуть из Идрии) с выделением Хофкамерой инструментов и оборудования для поддержания добычи, которая на протяжении веков финансировала власть Габсбургов." #NT!
 levy_nd_hab_grenzer_militia: "Гренцер Милиция" #NT!
 levy_nd_hab_grenzer_militia_desc: "Пограничное ополчение, сформированное из общин военных пограничников, закаленное поколениями османских набегов и обученное ведению нерегулярных боевых действий в гористой местности." #NT!
 nd_hab_formed_tt: "была образована Австрия." #NT!
 nd_hab_path_a_tt: "Выбрал AEIOU: Путь Габсбургов" #NT!
 nd_hab_path_b_tt: "Выбрал Antemurale Christianitatis" #NT!
 nd_hab_destiny: "Судьба Габсбургов" #NT!
 nd_hab_destiny_desc: "Австрия превратилась из совокупности альпийских герцогств в великую державу. Теперь королевство должно быть стабилизировано, прежде чем династия сможет реализовать свои высшие амбиции, будь то с помощью алтаря или меча." #NT!
 nd_hab_dest_corona: "Богемская Корона" #NT!
 nd_hab_dest_corona_desc: "Защитите корону Богемии, самого богатого королевства Империи, с помощью династических притязаний и дипломатии. Контролируйте Прагу и развивайте сложную финансовую систему через банковское учреждение." #NT!
 nd_hab_dest_burgundia: "Бургундское наследие" #NT!
 nd_hab_dest_burgundia_desc: "Захватите бургундские земли в Нидерландах, повернув богатые торговые города Фландрии под власть Габсбургов. Крупные рынки Антверпена будут финансировать универсальные амбиции династии." #NT!
 nd_hab_dest_monarchia: "Универсалис Монархия" #NT!
 nd_hab_dest_monarchia_desc: "Мечта Габсбургов стала реальностью: универсальная монархия, простирающаяся от Нидерландов до итальянских герцогств, связанных династическим правом, дипломатическим мастерством и крупнейшими мировыми торговыми сетями." #NT!
 nd_hab_dest_ungarn: "Венгерская кампания" #NT!
 nd_hab_dest_ungarn_desc: "Буда, древняя резиденция венгерских королей, должна быть передана под контроль Габсбургов, чтобы закрепить восточную границу. Соберите мощную армию и защитите королевство, прежде чем нанести удар на восток." #NT!
 nd_hab_dest_feldzug: "Великая турецкая война" #NT!
 nd_hab_dest_feldzug_desc: "Продвиньте границу на юг, к Османским Балканам. Белград, ключ к Дунаю, должен пасть, прежде чем Австрия сможет претендовать на господство над Юго-Восточной Европой. Требуются профессиональные армии." #NT!
 nd_hab_dest_bollwerk: "Боллверк де Глаубенс" #NT!
 nd_hab_dest_bollwerk_desc: "Австрия выступает непоколебимым оплотом христианского мира, ее военная граница простирается от Адриатики до Карпат. Могучее царство, закаленное в огне бесконечных пограничных войн." #NT!
 nd_hab.5.t: "Судьба Габсбургов" #NT!
 nd_hab.5.d: "Образование Австрии знаменует собой не конец, а начало. Из Вены Дом Габсбургов обозревает королевство, простирающееся через центр Альп, но истинная судьба династии лежит за пределами этих гор. Курс Австрии определен благодаря осторожным бракам и дипломатическим накоплениям или мечу, охраняющему восточные ворота христианского мира." #NT!
 nd_hab.5.a: "Наша судьба ждет." #NT!
 nd_hab.6.t: "Корона Святого Вацлава" #NT!
 nd_hab.6.d: "Древняя корона Богемии перешла в руки Габсбургов. Прага (резиденция императора Священной Римской империи, центр образования и торговли, ворота к серебряным рудникам Кутной Горы) теперь подчиняется Вене. Это не просто территориальное присоединение, а династическая революция. Богемская корона приносит с собой избирательное достоинство, огромные минеральные богатства и королевство, административная сложность которого может соперничать с любым другим в Европе.\n\nКогда Богемия обеспечена, сеть браков и претензий династии может простираться еще дальше, на запад к бургундскому наследству, на юг к итальянским коронам." #NT!
 nd_hab.6.a: "Прага и Вена объединились под одной короной." #NT!
 nd_hab.7.t: "Бургундское наследие" #NT!
 nd_hab.7.d: "Великая авантюра брачной дипломатии Габсбургов принесла свои богатейшие плоды. Благодаря союзу с Бургундским домом богатые города Нидерландов (Антверпен, Брюгге, Гент) попали в руки Габсбургов. Это самые коммерчески развитые города Европы, на их рынках проходит больше торговли, чем на целых королевствах.\n\nЭта неожиданная удача требует выбора. Инвестируем ли мы в дипломатический и институциональный аппарат, необходимый для управления такими обширными территориями, обучая поколение габсбургских администраторов и переговорщиков? Или мы будем эксплуатировать коммерческое богатство напрямую, направляя фламандские торговые прибыли в казну и превращая Австрию в торговую державу?" #NT!
 nd_hab.7.a: "Обучайте дипломатов, которые будут управлять империей." #NT!
 nd_hab.7.b: "Направьте богатство Фландрии в нашу казну." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_diplomatenakademie: "Габсбургская дипломатическая академия" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_diplomatenakademie: "По всей Европе расселилось поколение дипломатов и администраторов, прошедших обучение у Габсбургов, обладающих навыками ведения переговоров, составления договоров и институционального управления, которые скрепляют обширную монархию." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_handelspolitik: "Гандельская политика Габсбургов" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_handelspolitik: "Коммерческое богатство Нидерландов течет по каналам Габсбургов, обогащая казну и превращая Австрию из альпийского государства, не имеющего выхода к морю, в торговую державу с интересами, охватывающими весь континент." #NT!
 nd_hab.8.t: "Универсалис Монархия" #NT!
 nd_hab.8.d: "Мечта Габсбургов приближается к своему апогею. От Брюсселя до Праги, от Вены до Милана владения династии опоясывают Европу. Ни одна семья никогда не владела такой обширной территорией такими разнообразными способами: браком, наследством, выборами и договорами. Теперь вопрос в том, как управлять этим необычайным собранием народов, языков и вер.\n\nПримем ли мы принцип cuius regio, eius religio, навязывая конфессиональный порядок, одновременно предоставляя достаточную автономию, чтобы сохранять мир между различными народами монархии? Или нам следует пойти по пути дипломатии конгресса, сделав Вену столицей европейского порядка посредством переговоров и интеграции?" #NT!
 nd_hab.8.a: "Порядок через конфессиональное управление." #NT!
 nd_hab.8.b: "Порядок через дипломатию Конгресса." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_cuius_regio: "Cuius Regio, Eius Religio" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_cuius_regio: "Принцип конфессионального сосуществования поддерживает порядок во владениях Габсбургов. Религиозная толерантность в сочетании с жестким административным контролем позволяет монархии управлять своими разнообразными народами без раскола." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_kongressdiplomatie: "Конгрессдипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_kongressdiplomatie: "Вена стала дипломатической столицей Европы. Посредством конгрессов, договоров и терпеливых переговоров Габсбурги поддерживают порядок в своих обширных владениях и формируют баланс сил на континенте." #NT!
 nd_hab.9.t: "Падение Буды" #NT!
 nd_hab.9.d: "Армии Габсбургов вошли в Буду, древнюю столицу Венгерского королевства. В течение нескольких поколений этот город-крепость на Дунае служил резиденцией королей Арпада и Анжуйского, прежде чем пал под османским завоеванием. Теперь она снова развевается под знаменем Габсбургов.\n\nЗавоевание Венгрии меняет стратегическую карту. Австрия больше не является пограничным государством, спрятавшимся за Лейтой. Это доминирующая держава на среднем Дунае, обладающая военной способностью проецировать силу вглубь Балкан." #NT!
 nd_hab.9.a: "Венгрия освобождена. Граница продвигается." #NT!
 nd_hab.10.t: "Великая турецкая война" #NT!
 nd_hab.10.d: "Белград пал. «Белая крепость» (ключ к Дунаю, ворота на Османские Балканы) находится в руках Габсбургов. Кампании принца Евгения подорвали власть Османской империи в Венгрии и отодвинули границу вглубь Сербии. Это величайшая победа, которую христианский мир одержал над османами со времен Лепанто.\n\nТеперь вопрос в том, как закрепить эти обширные завоевания. Инвестируем ли мы в логистику и инфраструктуру снабжения, строительство дорожных сетей и складов, которые будут поддерживать будущие кампании и позволят восстановить опустошенные приграничные территории? Или мы совершенствуем искусство осадной войны, которое завоевало Белград, гарантируя, что наши инженеры и артиллеристы останутся лучшими в Европе?" #NT!
 nd_hab.10.a: "Стройте дороги, поддерживающие империю." #NT!
 nd_hab.10.b: "Совершенствуйте науку ведения крепостной войны." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_versorgungslinie: "Kaiserliche Versorgungslinien" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_versorgungslinie: "Сеть военных дорог, складов снабжения и речных транспортных маршрутов поддерживает армии Габсбургов на огромном Дунайском театре военных действий, обеспечивая быстрое усиление и восстановление разрушенных войной приграничных земель." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_belagerungskunst: "Белагерунгскунст" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_belagerungskunst: "Военные инженеры Габсбургов усовершенствовали искусство научной осадной войны. Их артиллерийские батареи и подход к сокращению крепостей являются лучшими в Европе, хотя поддержание такого опыта напрягает казну." #NT!
 nd_hab.11.t: "Боллверк де Глаубенс" #NT!
 nd_hab.11.d: "Австрия является неоспоримым щитом христианского мира. Военная граница простирается от Адриатики до Карпат и населена поколениями поселенцев Гренцера, не знающих никакой жизни, кроме войны. За этой живой стеной владения Габсбургов превратились в великую державу, чьи армии отразили любую угрозу с востока.\n\nЭто достижение требует окончательного выбора. Принимаем ли мы дух крестового похода, который привел нас сюда, освящая наши войны, удешевляя наши casus belli против неверных и готовя наш народ к вечной борьбе? Или мы обратимся вовнутрь, наведя имперский порядок на завоеванных землях, построив школы и суды, которые цивилизуют границу и сделают ее по-настоящему нашей?" #NT!
 nd_hab.11.a: "Крестовый поход вечен." #NT!
 nd_hab.11.b: "Границей нужно управлять, а не просто удерживать." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_kreuzzugsgeist: "Кройццугсгейст" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_kreuzzugsgeist: "Дух крестового похода пылает в государстве Габсбургов. Войны против иноверцев обходятся дешево, моральный дух остается высоким благодаря длительным кампаниям, а дело христианского мира дает бесконечное оправдание для дальнейших завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_hab_dest_kaiserliche_ordnung: "Кайзерличе Орднунг" #NT!
 STATIC_MODIFIER_DESC_nd_hab_dest_kaiserliche_ordnung: "Имперский порядок заменяет военное положение на завоеванной границе. Школы, суды и административные учреждения превращают дикие приграничные земли в продуктивные провинции, хотя переход от набегов к управлению уменьшает военные трофеи." #NT!
 nd_hab_hofburg: "Канцелярия Хофбурга" #NT!
 nd_hab_hofburg_desc: "Великий дворец-канцелярия всемирной монархии Габсбургов, вмещающий дипломатический корпус, государственные архивы и административный аппарат, управляющий владениями, охватывающими половину Европы." #NT!
 nd_hab_hofburg_chancellery: "Администрация канцелярии" #NT!
 nd_hab_hofburg_chancellery_desc: "Обширный дипломатический и административный аппарат Хофбурга требует постоянного запаса бумаги для договоров и корреспонденции, прекрасной ткани для официальной одежды, мебели для государственных палат и стеклянной посуды для дипломатических приемов." #NT!
 nd_hab_grenzfestung: "Гренцфестунг" #NT!
 nd_hab_grenzfestung_desc: "Крупный крепостной комплекс Военной границы, защищающий оборонительную линию Габсбургов с помощью тяжелых укреплений, постоянного гарнизона и накопленного вооружения от любого восточного вторжения." #NT!
 nd_hab_grenzfestung_garrison: "Пограничный гарнизон" #NT!
 nd_hab_grenzfestung_garrison_desc: "Для поддержания Гренцфестунга требуется вооружение для гарнизона, камень для постоянного укрепления стен и бастионов, древесина для частоколов и внутренних работ, а также кожа для снаряжения и упряжи." #NT!
  
  # === Bureaucracies === 
 AUTO_MODIFIER_NAME_nd_hab_bureaucracy_authority: "Габсбургская составная монархия" #NT!
 AUTO_MODIFIER_DESC_nd_hab_bureaucracy_authority: "Провозглашение австрийской монархии закрепляет ее институциональные рамки. Из Вены Хофкригсрат руководит армиями, Тайная конференция принимает решения по вопросам войны и мира, Венгерская Канчеллярия выступает посредником с мадьярскими магнатами, Военная граница прикрывает марши, а поколение камеральных реформаторов готовится переделать королевство. Составная монархия теперь может выбирать, какой из своих административных органов укрепить." #NT!
 hab_hofkriegsrat_bureaucracy: "Хофкригсрат" #NT!
 hab_hofkriegsrat_bureaucracy_desc: "Имперский военный совет, созданный Фердинандом I в Вене 17 ноября 1556 года для координации длительных турецких войн и военной границы. Заседая под руководством президента, наиболее известного из которых был Евгений Савойский с 1703 по 1736 год, он рассматривал офицерские комиссии, крепостные работы, интендантские реквизиции и расположение театров. Передав управление постоянной армией из дворянских сословий в постоянный коллегиальный орган короны, Хофкригсрат сделал армию Габсбургов инструментом династии, а не сеймов." #NT!
 hab_geheime_konferenz_bureaucracy: "Гехайме Конференц" #NT!
 hab_geheime_konferenz_bureaucracy_desc: "Тайная конференция, возникшая на основе Geheimer Rat Фердинанда I и получившая свою классическую форму от Леопольда I после 1665 года. Небольшой внутренний совет из пяти-семи тщательно отобранных вельмож (Ауэрсперг, Лобковиц, Шварценберг, позже Кауниц) обсуждал династические браки, войну и мир, а также испанское правопреемство. Его протоколы, хранившиеся в Haus-, Hof- und Staatsarchiv, стали главным регистром высокой дипломатии Габсбургов и школой, в которой обучались поколения имперских государственных деятелей." #NT!
 hab_hungarian_cancellaria_bureaucracy: "Венгерская Канчеллария" #NT!
 hab_hungarian_cancellaria_bureaucracy_desc: "Мадьярская Удвари Канчеллария, отдельная венгерская придворная канцелярия, созданная в Пожонях и утвержденная сеймом 1606 года. Венгерское дворянство отказалось управляться через немецкоязычный Хофканцлей в Вене; Канчеллария сохранила конституционную доктрину, согласно которой Венгрия была regnum independents, объединенной с Австрией только в лице короля. Корона купила стабильность среди мадьярских магнатов ценой постоянной двойной администрации." #NT!
 hab_militaergrenze_bureaucracy: "Милитаргренце" #NT!
 hab_militaergrenze_bureaucracy_desc: "Военная граница, организованная вдоль хорватско-славянского, а затем и Банатского маршей, начиная с 1553 года. Земли Короны были заселены влахскими, сербскими и хорватскими беженцами, Гренцерами или Граничарами, которые владели своими участками наследственной военной собственностью: без сеньорических пошлин, но были обязаны нести постоянную пограничную службу против османов. Генералаты Карловац и Вараждин подчинялись непосредственно Вене, избежав поместной юрисдикции хорватского Собора и создав закаленную пограничную армию, верную династии." #NT!
 hab_directorium_bureaucracy: "Директория в Publicis et Cameralibus" #NT!
 hab_directorium_bureaucracy_desc: "Центральный административный орган, созданный Фридрихом Вильгельмом графом фон Хаугвицем 2 мая 1749 года после потери Силезии, выявил банкротство сословного финансирования. Директориум подчинил чешские и австрийские Хофканцляйен и Хофкамеру в единую коллегию, централизовав налогообложение, распределение квот на набор и Терезианский кадастр. Провинциальные Ландштенде потеряли конституционное вето на Contributionale; постоянные наемные Kreishauptleute заменили дворянских сборщиков налогов в деревне." #NT!
 hab_josephinismus_bureaucracy: "Жозефинизм" #NT!
 hab_josephinismus_bureaucracy_desc: "Жозефинистская программа реформ 1780–1790 годов, в основе которой лежал патент толерантности от 13 октября 1781 года (признающий лютеранское, кальвинистское и греко-православное исповедание) вместе с эдиктом о терпимости к евреям 1782 года, отменой личного крепостного права в 1781 году и роспуском созерцательных монастырей с их пожертвованиями. перенаправлены в Религиозный фонд, финансирующий приходских священников и начальные школы. Иосиф II правил указом через Хофстеллен, заменив прелатство и поместную диету в пользу кинооператора Беамте, обученного в Терезиануме." #NT!
