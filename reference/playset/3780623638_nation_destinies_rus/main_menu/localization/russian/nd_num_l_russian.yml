l_russian:
 nd_num_formed_tt: "Образован Нумуну Сукобиту" #NT!
 nd_num_path_a_tt: "Путь Континентальной Империи" #NT!
 nd_num_path_b_tt: "Путь суверенной нации" #NT!
  # ============================================================ 
  # Static modifier loc (formation choices + DHE rewards) 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_num_continental_empire: "Континентальная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_num_continental_empire: "Нумуну Сукобиту едет как рейд-дань империи. Параибо и теквунивапи командуют мобильным государством, собирающим дань с приграничных земель, пленники поглощаются нацией через военный отряд, а экономика бизонов обеспечивает империю, которая движется вместе со стадом." #NT!
 STATIC_MODIFIER_NAME_nd_num_sovereign_nation: "Суверенная Нация" #NT!
 STATIC_MODIFIER_DESC_nd_num_sovereign_nation: "Нация команчей консолидируется как государство с четко определенными границами, постоянно действующим Советом нации команчей, школой нумической грамотности и договорной дипломатией с соседними державами. Конная империя становится нацией среди наций." #NT!
 STATIC_MODIFIER_NAME_nd_num_council_hill_compact: "Компакт Каунсил-Хилла" #NT!
 STATIC_MODIFIER_DESC_nd_num_council_hill_compact: "На Каунсил-Хилле параибо ведут переговоры о континентальном договоре, посольства принимают их с официальным протоколом. Команчи говорят как высшая сила Южных равнин." #NT!
 STATIC_MODIFIER_NAME_nd_num_council_hill_armed_peace: "Вооруженный мир" #NT!
 STATIC_MODIFIER_DESC_nd_num_council_hill_armed_peace: "Мир с позиции силы: каждая уступка соседей отражается в укреплённом лагере команчей. Табуны лошадей остаются оседланными и готовыми." #NT!
 STATIC_MODIFIER_NAME_nd_num_assimilation_engine: "Поглощенные нации" #NT!
 STATIC_MODIFIER_DESC_nd_num_assimilation_engine: "Мексиканцы, пуэбло и англичане, захваченные в набегах, усыновляются, воспитываются как дети команчей и вступают в брак с бандами. Команчи стали многоэтнической нацией благодаря механизму включения в плен." #NT!
 STATIC_MODIFIER_NAME_nd_num_tribute_engine: "Извлечение дани" #NT!
 STATIC_MODIFIER_DESC_nd_num_tribute_engine: "Пленников выкупают у родственников за лошадей, оружие и серебро. Сезонный цикл набегов становится системой дани, обеспечивающей пополнение имперской казны." #NT!
 STATIC_MODIFIER_NAME_nd_num_comanchero_license: "Лицензия Команчеро" #NT!
 STATIC_MODIFIER_DESC_nd_num_comanchero_license: "Торговцы Новой Мексики имеют лицензию на въезд в Команчерию. Караваны пересекают Льяно, перевозя оружие и металлические изделия на север, возвращаясь с лошадьми, шкурами и пленниками, направляясь на рынок Санта-Фе." #NT!
 STATIC_MODIFIER_NAME_nd_num_direct_caravan: "Прямая караванная торговля" #NT!
 STATIC_MODIFIER_DESC_nd_num_direct_caravan: "Команчи отправляют свои караваны на юг, в Санта-Фе, и на восток, к англоязычным поселениям. Ни один посредник не берет на себя долю в приграничной торговле." #NT!
 STATIC_MODIFIER_NAME_nd_num_great_raid_press: "Нажмите на рейд" #NT!
 STATIC_MODIFIER_DESC_nd_num_great_raid_press: "Сезонные набеги на Техас, Коауилу и Нуэво-Леон лишают северные мексиканские провинции скота и пленников. Конные воины возвращаются нагруженными." #NT!
 STATIC_MODIFIER_NAME_nd_num_great_raid_consolidate: "Объедините рейд" #NT!
 STATIC_MODIFIER_DESC_nd_num_great_raid_consolidate: "Пленные лошади и поглощенные воины сложены в отряды. Армия растет в ходе рейда, а не расходуется на него." #NT!
 STATIC_MODIFIER_NAME_nd_num_mexico_offensive: "Наступление Бахио" #NT!
 STATIC_MODIFIER_DESC_nd_num_mexico_offensive: "Колонна из восьмисот воинов проезжает мимо Сальтильо и Монтеррея в сам Бахио. Сакатекас горит; гасиенды Сан-Луис-Потоси либо платят, либо пустуют. Каждый цикл линия войны перемещается на юг." #NT!
 STATIC_MODIFIER_NAME_nd_num_mexico_consolidation: "Приток границы" #NT!
 STATIC_MODIFIER_DESC_nd_num_mexico_consolidation: "Северная Мексика больше не подвергается набегам, а облагается налогами. Губернаторы провинций договариваются о ежегодных выплатах лошадьми, серебром и выкупленными пленниками; Казначейство Команчерии работает в мексиканском песо." #NT!
 STATIC_MODIFIER_NAME_nd_num_llano_refuge: "Убежище Льяно Эстакадо" #NT!
 STATIC_MODIFIER_DESC_nd_num_llano_refuge: "Льяно Эстакадо — это море травы без ориентиров и источников воды, известных постороннему. Войти — значит умереть от жажды; Квахади ориентируются по нему с помощью Большой Медведицы и памяти." #NT!
 STATIC_MODIFIER_NAME_nd_num_numic_orthography: "Нумическая орфография" #NT!
 STATIC_MODIFIER_DESC_nd_num_numic_orthography: "Языку команчей придается письменная форма. Школьные алфавиты распространяют традиции пухаката, песни буйволов и истории советов в постоянные записи." #NT!
  
  # ============================================================ 
  # Formation event 
  # ============================================================ 
 nd_num.1.t: "Нумуну Сукобиту восстает" #NT!
 nd_num.1.d: "Из Льяно Эстакадо параибо созвали отряды: Пенатека - медоедов, Ямпарика - кореньедов, Квахади - антилоп, Нокони - возвращающийся назад, Коцотека - пожирателей буйволов. Испанский поголовье лошадей уже давно стало основой новой экономики; стада бизонов все еще обитают на южных равнинах; северная Мексика платит дань или сжигает. Вопрос в том, какую форму должно принять государство команчей.\n\nДолжен ли Нумуну Сукобиту оставаться великой мобильной империей набегов и дани, расширяющейся за счет военных отрядов и пленников, объединенных как родственники? Или команчи должны консолидироваться как суверенная нация среди наций с формальными границами, письменными договорами и школьным нумическим алфавитом?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_num.1.a: "Континентальная империя: рейд-государство." #NT!
 nd_num.1.b: "Суверенная нация: совет заседает постоянно." #NT!
  
  # ============================================================ 
  # DHE event loc 
  # ============================================================ 
 nd_num.2.t: "Лошадь возвращается на равнину" #NT!
 nd_num.2.d: "Восстание пуэбло 1680 года рассеяло табуны испанских лошадей по Южным равнинам. То, что когда-то было роскошью, подаренной нескольким вождям, становится повседневной собственностью каждого воина-команча. Нумуну превращаются из пеших застрельщиков в самую совершенную легкую кавалерию, которую когда-либо видел континент: стада следуют за циклом бизонов, а воины следуют за стадами.\n\nПарайбо должны решить, как использовать эту новую мобильность: продвигать набеги вглубь Мексики, пока преимущество еще свежее, или объединить стада и поглощенных воинов в более глубокую армию?" #NT!
 nd_num.2.a: "Нажимайте на рейды, пока испанцы ошеломлены!" #NT!
 nd_num.2.b: "Создавайте стада и объединяйте поглощенных воинов в отряды." #NT!
  
 nd_num.3.t: "Поглощенные нации" #NT!
 nd_num.3.d: "Плененная мексиканка, взятая в двенадцать лет, родила троих сыновей команчей и теперь является старшей женой военного вождя пенатек. Серебряный мастер-пуэбло, похищенный в юности из Таоса, кует украшения для узды команчей. Англо-сирота, выросший среди ямпарика, не говорит по-английски и считает переворот рядом со своими приемными братьями.\n\nТак выросли команчи: не как закрытая родословная, а как нация, которая приняла своих пленников в родственные связи. Совет обсуждает, должна ли нация формализовать этот механизм ассимиляции или вместо этого взимать дань с пленных: выкупать их обратно у своих родственников и превращать цикл набегов в континентальную сокровищницу." #NT!
 nd_num.3.a: "Усыновляйте пленников: нация растет за счет поглощения." #NT!
 nd_num.3.b: "Выкупить пленников: рейд пополняет казну." #NT!
  
 nd_num.4.t: "Торговля Команчеро" #NT!
 nd_num.4.d: "Команчеро (новые мексиканские торговцы, получившие от команчей лицензию на переправу через Льяно) прибывают в лагеря с металлическими изделиями, оружием и сушеным перцем чили. Они отправляются с лошадьми, шкурами бизонов и пленниками на рынок Санта-Фе. Это приграничная торговая сеть: паразитическая экономика на испанской границе, команчи - ее единственный суверен.\n\nДолжен ли совет официально лицензировать команчеро как торговое подразделение команчей, получая долю от каждого каравана, или команчи должны отправить своих собственных всадников на юг, полностью исключив посредников из Новой Мексики?" #NT!
 nd_num.4.a: "Лицензируйте Команчеро: пусть они работают на нас." #NT!
 nd_num.4.b: "Отправьте караваны команчей прямо в Санта-Фе." #NT!
  
 nd_num.5.t: "Совет Хилл" #NT!
 nd_num.5.d: "На Каунсил-Хилл, огромном парламентском камне к востоку от хребта Уичито, параибо принимают эмиссаров из Техаса, Соединенных Штатов и мексиканских губернаторов. Каждая делегация прибывает с подарками; каждый уходит с договором, написанным рукой, которую команчи теперь могут прочитать.\n\nВопрос, стоящий перед советом, заключается в самой дипломатической позиции: должны ли команчи разговаривать с соседями как континентальный договор, старший подписавший среди наций Равнин? Или каждое посольство следует принимать как просителя рядом с укрепленными военными лагерями, а мирные переговоры должны вестись только с позиции вооруженного превосходства?" #NT!
 nd_num.5.a: "Континентальный договор: говорите как высшая держава." #NT!
 nd_num.5.b: "Вооруженный мир: каждое посольство рядом с военным лагерем." #NT!
  
 nd_num.6.t: "Великий рейд" #NT!
 nd_num.6.d: "Восемьсот всадников-команчей выезжают на юг из Льяно в конце лета. Три недели спустя гасиенды Коауилы горели на протяжении двухсот миль; пленники (дети, женщины, тысячи лошадей) возвращаются на север вместе с отрядом. Это не кампания, а сезон. Северная Мексика платит эту дань уже столетие.\n\nБудет ли совет сильнее настаивать на рейде, в то время как мексиканские штаты поглощены своими гражданскими войнами? Или закрепить достижения и развернуть воинов по домам, чтобы научить новому поколению новой конной доктрине?" #NT!
 nd_num.6.a: "Нажмите рейд: Мексика открыта." #NT!
 nd_num.6.b: "Меняйте воинов: тренируйте следующее поколение." #NT!
  
 nd_num.7.t: "Льяно Эстакадо Хартленд" #NT!
 nd_num.7.d: "Льяно Эстакадо (Стоящая равнина) – это сердце Квахади и убежище команчей. Травянистое море на вершине холма в триста миль в поперечнике, без ориентиров и без поверхностной воды, которую мог бы найти посторонний. Испанские колонны исчезли здесь в 1700-х годах; Американская кавалерия позже исчезла и здесь. Гиды-квахади ориентируются по Большой Медведице и памяти поколений, на рассвете ведя отряды к скрытым источникам.\n\nСовет укрепляет сердце страны: военные лагеря на каждом шагу, тайники с припасами вдоль секретных троп, Ллано объявлен неприкосновенным убежищем государства команчей." #NT!
 nd_num.7.a: "Льяно запечатан." #NT!
  
 nd_num.8.t: "Нумический алфавит" #NT!
 nd_num.8.d: "На территории совета возвышается здание школы. Языку команчей (Нуму Теквапуха) придается письменная форма, старейшины диктуют песни буйволов, традиции медицины пухакат, истории совета в постоянную запись. Прежде чем отправиться в поездку, дети учатся читать на своем языке.\n\nКоманчи, когда-то самая мобильная нация на континенте, придерживаются письменности. Нация переживет зубров." #NT!
 nd_num.8.a: "Написан Нуму Теквапуха." #NT!
  
  # ============================================================ 
  # Advance loc 
  # ============================================================ 
  # Age 1 
 nd_num_numic_migration: "Миграция на Нумические равнины" #NT!
 nd_num_numic_migration_desc: "Нумуну отделяются от более широкой шошонской традиции и мигрируют на юг, на равнины, изучая цикл жизни бизонов и сезонную траву." #NT!
 nd_num_seasonal_camp: "Сезонный лагерь зубров" #NT!
 nd_num_seasonal_camp_desc: "Мобильные лагеря следуют за стадами бизонов по Южным равнинам, обрабатывая шкуры на каждой остановке. Основа экономики равнин." #NT!
 nd_num_skirmisher_tradition: "Традиция нумического застрельщика" #NT!
 nd_num_skirmisher_tradition_desc: "Пешие воины-команчи, доконные, сражаются на пересеченной местности каньонов с луком и копьем — древний нумический боевой стиль." #NT!
 nd_num_medicine_bundle: "Набор лекарств Пухакат" #NT!
 nd_num_medicine_bundle_desc: "Каждый воин несет с собой сверток с лекарствами, собранный в результате его поиска видений. Традиция пухакат связывает команчей с духами предков и обеспечивает защиту во время набега." #NT!
 nd_num_council_lodge_tradition: "Традиция Ложи Совета" #NT!
 nd_num_council_lodge_tradition_desc: "Параибо каждой банды собираются в ложе совета, чтобы обсудить вопросы войны и мира, и ни одно решение не является обязательным без консенсуса между бандами." #NT!
 nd_num_big_dipper_navigation: "Навигация по Большой Медведице" #NT!
 nd_num_big_dipper_navigation_desc: "Команчи ориентируются по Большой Медведице как космологическому полюсу и земному компасу, путешествуя по ночам через непроходимый Льяно к источникам, которые не может найти посторонний." #NT!
  # Age 2 
 nd_num_horse_mastery: "Мастерство верховой езды команчей" #NT!
 nd_num_horse_mastery_desc: "После того, как восстание пуэбло 1680 года рассеяло испанские стада, команчи стали самой опытной легкой кавалерией на континенте. У каждого воина есть лошади; группы движутся вместе со стадом." #NT!
 nd_num_paraibos_confederation: "Конфедерация Параибос" #NT!
 nd_num_paraibos_confederation_desc: "Пять великих группировок (Пенатека, Ямпарика, Квахади, Нокони, Котсотека) объединяются в совет параибо. Мирный вождь и военный вождь теквунивапи имеют отдельные полномочия." #NT!
 nd_num_horse_warrior: "Команчи Лошадь Воин" #NT!
 nd_num_horse_warrior_desc: "Знаменитый равнинный конный лучник, сражающийся в седле с луком и испанским копьем, свободно владеющий маневрами, с которым не могла сравниться ни одна европейская кавалерия." #NT!
 nd_num_pueblo_lessons: "Уроки Пуэбло" #NT!
 nd_num_pueblo_lessons_desc: "Пленные серебряники, ткачи и конюхи пуэбло обучают банды своему ремеслу. Первая волна механизма поглощения." #NT!
 nd_num_buffalo_hide_trade: "Торговля шкурой буйвола" #NT!
 nd_num_buffalo_hide_trade_desc: "Шкуры бизонов становятся основной статьей экспорта Команчерии. Обработка шкур промышленно развита в сезонных лагерях; банды обменивают шкуры на металлические изделия на заставах Команчеро." #NT!
 nd_num_tekwuniwapi_doctrine: "Доктрина Теквунивапи" #NT!
 nd_num_tekwuniwapi_doctrine_desc: "Военный вождь командует посредством одобрения, руководя набегами личным примером. Власть на войне зарабатывается в седле, а не наследуется от совета." #NT!
  # Age 3 
 nd_num_comanchero_trade: "Торговая сеть Команчеро" #NT!
 nd_num_comanchero_trade_desc: "Новым мексиканским торговцам разрешено пересекать Льяно и торговать с бандами. Торговая сеть приграничных земель делает Санта-Фе зависимым рынком команчей." #NT!
 nd_num_captive_incorporation: "Кэптивная регистрация" #NT!
 nd_num_captive_incorporation_desc: "Пленные мексиканцы, пуэбло и англо усыновляются как дети команчей, вступают в брак с бандами и в течение одного поколения становятся полноправными нумуну. Нация растет за счет поглощения." #NT!
 nd_num_raid_economy: "Рейд-Экономика" #NT!
 nd_num_raid_economy_desc: "Сезонный рейдовый цикл становится центральной экономической деятельностью империи. Провинции Северной Мексики платят дань или сжигают; сокровищница команчей наполняется лошадьми и серебром." #NT!
 nd_num_raider_doctrine: "Рейдерская доктрина" #NT!
 nd_num_raider_doctrine_desc: "Специализированный кавалерийский род (легкий, быстрый, с самообеспечением для длительных поездок) отделен от основной традиции конных воинов для целенаправленного рейда в Мексику." #NT!
 nd_num_horse_aristocracy: "Лошадиная аристократия" #NT!
 nd_num_horse_aristocracy_desc: "Богатство в Команчерии исчисляется лошадьми. На совете выступает человек с сотней лошадей; человек с пятьюстами отдает своих дочерей в союз с соседними племенами." #NT!
 nd_num_buffalo_monopoly: "Стратегическая монополия на бизонов" #NT!
 nd_num_buffalo_monopoly_desc: "Команчи контролируют стада бизонов на Южных равнинах, устанавливая границы сезонной охоты против конкурирующих наций. Стадо — стратегический ресурс империи." #NT!
  # Age 4 
 nd_num_council_of_comanche_nation: "Совет нации команчей" #NT!
 nd_num_council_of_comanche_nation_desc: "Конфедерация параибо официально оформлена как Совет нации команчей: постоянный сенат вождей банд, который связывает всю конфедерацию общей политикой." #NT!
 nd_num_llano_estacado: "Льяно Эстакадо Хартленд" #NT!
 nd_num_llano_estacado_desc: "Равнина Стейк укреплена как убежище команчей: неприкосновенный центр Квахади, где ни одна внешняя армия не сможет выжить без проводника команчей." #NT!
 nd_num_tribute_system: "Имперская система дани" #NT!
 nd_num_tribute_system_desc: "Провинции Северной Мексики платят ежегодную дань лошадьми, серебром и торговыми лицензиями, чтобы избежать цикла набегов. Сокровищница команчей достигает своего пика." #NT!
 nd_num_medicine_lodge: "Традиция Медицинской Ложи" #NT!
 nd_num_medicine_lodge_desc: "В палатках постоянной медицины обитают пухакат, знахари, чьи узлы связывают повязки с духами предков." #NT!
 nd_num_horse_breeding_program: "Программа коневодства" #NT!
 nd_num_horse_breeding_program_desc: "Селекционное разведение испанских, пуэбло и поглощенных англоязычных родословных дает пони команчей (маленьких, крепких, не имеющих себе равных на равнинах)." #NT!
 nd_num_great_raid_doctrine: "Великая рейдовая доктрина" #NT!
 nd_num_great_raid_doctrine_desc: "Ежегодный рейд в Мексику в конце лета регламентируется как доктринальная кампания: восемьсот воинов едут на юг, три месяца в пути и возвращаются с пленными за сезон." #NT!
  # Age 5 
 nd_num_council_hill: "Дипломатия Каунсил Хилл" #NT!
 nd_num_council_hill_desc: "Огромный парламентский камень к востоку от хребта Уичито принимает посольства Техаса, США и мексиканских губернаторов. Команчи говорят как континентальная держава." #NT!
 nd_num_bison_strategic_economy: "Стратегическая экономика зубров" #NT!
 nd_num_bison_strategic_economy_desc: "Стада зубров управляются как стратегическая основа империи: охотничьи квоты, сезонные заповедники, стадо охраняется как государственная собственность." #NT!
 nd_num_frontier_diplomacy: "Пограничная дипломатия" #NT!
 nd_num_frontier_diplomacy_desc: "Постоянные дипломатические миссии в Сан-Антонио, Санта-Фе и Вашингтоне ведут переговоры о приграничных территориях как трехсторонняя государственная система, старшим партнером которой являются команчи." #NT!
 nd_num_eagle_warrior: "Аристократия Орла-Воина" #NT!
 nd_num_eagle_warrior_desc: "Элитная кавалерия великой империи, набранная из великих конно-аристократических родословных, Воины-Орлы возглавляют Великий Рейд и командуют на Холме Совета." #NT!
 nd_num_quahadi_homeland: "Родина Кахади" #NT!
 nd_num_quahadi_homeland_desc: "Банда Квахади, пожиратели антилоп Льяно, укрепляет центральные земли скрытыми тайниками с припасами и секретными водными тропами, которые помнят только их проводники." #NT!
 nd_num_borderland_caravan: "Сеть караванов Пограничья" #NT!
 nd_num_borderland_caravan_desc: "Караваны команчей тянутся на север до Арканзаса, на юг до Сальтильо, на восток до Красной реки. Торговая сеть приграничных земель полностью находится под управлением команчей." #NT!
  # Age 6 
 nd_num_numic_literacy: "Нумическая школьная грамотность" #NT!
 nd_num_numic_literacy_desc: "Нуму Теквапуха имеет письменную форму. Песни буйволов, традиции пухаката и истории советов войдут в постоянный учет. Дети команчей читают на своем языке." #NT!
 nd_num_treaty_diplomacy: "Договорная дипломатия" #NT!
 nd_num_treaty_diplomacy_desc: "Команчи входят в систему международных договоров как суверенное лицо, подписавшее письменные соглашения, связывающие Соединенные Штаты, Мексику и страны равнин." #NT!
 nd_num_sovereign_endurance: "Суверенная выносливость" #NT!
 nd_num_sovereign_endurance_desc: "Нумуну Сукобиту пережил истребление бизонов, кавалерию США, лишение собственности, которое сломило любую другую страну Равнин. Конная империя становится постоянным государством." #NT!
 nd_num_modern_plains_cavalry: "Современная равнинная кавалерия" #NT!
 nd_num_modern_plains_cavalry_desc: "Традиция команчей, модернизированная за счет карабинов с казенной частью и седла поздней империи. Последняя сборная кавалерия команчей." #NT!
 nd_num_constitution_of_comancheria: "Конституция Команчерии" #NT!
 nd_num_constitution_of_comancheria_desc: "Письменная конституция официально закрепляет Совет нации команчей как законодательный орган суверенного государства. Конная империя становится республикой." #NT!
 nd_num_industrial_horse_corral: "Промышленный загон для лошадей" #NT!
 nd_num_industrial_horse_corral_desc: "Масштабные программы селекционного разведения, современные конюшни и экономика экспорта лошадей. Команчерия снабжает кавалерией половину континента." #NT!
  
  # ============================================================ 
  # Unit loc 
  # ============================================================ 
 a_nd_num_skirmisher: "Нумический застрельщик" #NT!
 a_nd_num_skirmisher_desc: "Пешие воины-команчи с луком и копьем сражаются на пересеченной местности каньона." #NT!
 a_nd_num_horse_warrior: "Команчи Лошадь Воин" #NT!
 a_nd_num_horse_warrior_desc: "Знаменитый конный лучник равнин, сражающийся в седле с составным луком и испанским копьем, самая опытная легкая кавалерия на континенте." #NT!
 a_nd_num_raider: "Команч Рейдер" #NT!
 a_nd_num_raider_desc: "Специализированная кавалерия для рейдовых войн, легкая и самообеспеченная для глубоких походов в Мексику, двигатель сезонного рейдового цикла." #NT!
 a_nd_num_eagle_warrior: "Орел Воин" #NT!
 a_nd_num_eagle_warrior_desc: "Элитная кавалерия великой империи, набранная из великих конно-аристократических родословных, Воины-Орлы возглавляют Великий Набег." #NT!
 a_nd_num_modern_horse_warrior: "Современная кавалерия команчей" #NT!
 a_nd_num_modern_horse_warrior_desc: "Конные воины команчей поздней империи, вооруженные карабинами с казенной частью, наследники великих традиций равнин в эпоху выживания." #NT!
  
  # ============================================================ 
  # Levy loc 
  # ============================================================ 
 levy_nd_num_eagle_warrior: "Орел Воин Леви" #NT!
 levy_nd_num_eagle_warrior_desc: "Элитная кавалерия из великих конно-аристократических родословных." #NT!
 levy_nd_num_raider: "Рейдер Леви" #NT!
 levy_nd_num_raider_desc: "Легкие рейдеры из благородного кавалерийского пула, готовые к глубокому походу самостоятельно." #NT!
 levy_nd_num_horse_warrior: "Лошадь Воин Леви" #NT!
 levy_nd_num_horse_warrior_desc: "Команчи-конные лучники из благородного пула, культовая легкая кавалерия Равнин." #NT!
 levy_nd_num_skirmisher: "Нумический застрельщик Леви" #NT!
 levy_nd_num_skirmisher_desc: "Пешие застрельщики из крестьянского пула, старая традиция доконного боя." #NT!
  
  # ============================================================ 
  # Building loc 
  # ============================================================ 
 nd_num_bison_camp: "Лагерь Бизонов" #NT!
 nd_num_bison_camp_desc: "Передвижной лагерь по переработке шкур, следящий за стадами бизонов, основой экономики Равнин." #NT!
 nd_num_council_lodge: "Совет Ложи" #NT!
 nd_num_council_lodge_desc: "Параибо каждой группы собираются здесь, чтобы обсудить войну и мир; никакое решение не является обязательным без консенсуса." #NT!
 nd_num_horse_corral: "Загон для дрессировки лошадей" #NT!
 nd_num_horse_corral_desc: "рассадник конной аристократии команчей; отборные родословные испанских, пуэбло и англоязычных пород дают пони команчей." #NT!
 nd_num_comanchero_post: "Торговый пост Команчеро" #NT!
 nd_num_comanchero_post_desc: "Торговцы из Новой Мексики, имеющие лицензию команчей, обменивают металлические изделия на лошадей, шкуры и пленников, направляющихся в Санта-Фе." #NT!
 nd_num_llano_fortress: "Лагерь Льяно Эстакадо" #NT!
 nd_num_llano_fortress_desc: "Укрепленный военный лагерь в сердце Кахади, скрытые тайники с водой и склады снабжения, известные только проводникам-команчам." #NT!
 nd_num_medicine_lodge_bld: "Медисин Лодж" #NT!
 nd_num_medicine_lodge_bld_desc: "Постоянный храм пухакат, в котором хранятся связки с лекарствами, связывающие повязки с духами предков." #NT!
 nd_num_constitution_hall: "Конституционный зал" #NT!
 nd_num_constitution_hall_desc: "Зал совета современного суверенного государства команчей, где Совет нации команчей заседает в качестве законодательного органа." #NT!
  
  # ============================================================ 
  # Production method loc 
  # ============================================================ 
 nd_num_pm_basic_bison_hide: "Базовая шкура бизона" #NT!
 nd_num_pm_basic_bison_hide_desc: "Сезонные лагеря по переработке шкур выделывают шкуры бизонов и скота для торговли и покрытия типи." #NT!
 nd_num_pm_bison_hide_specialization: "Специализация «Шкура бизона»" #NT!
 nd_num_pm_bison_hide_specialization_desc: "Промышленное производство шкур бизона для экспортной торговли Команчеро. Поставки кожи в Санта-Фе проходят через Команчерию." #NT!
 nd_num_pm_strategic_bison: "Стратегическая экономика зубров" #NT!
 nd_num_pm_strategic_bison_desc: "Управлял поголовьем зубров в соответствии с квотами на охоту; стадо рассматривается как государственная собственность, а кожа является главным экспортным товаром империи." #NT!
 nd_num_pm_basic_horse_breeding: "Основы коневодства" #NT!
 nd_num_pm_basic_horse_breeding_desc: "Лошади испанского поголовья, выращенные для равнин; пони-команчи появляются в результате селекционного разведения в каждом лагере." #NT!
 nd_num_pm_breeding_program: "Программа селекционного разведения" #NT!
 nd_num_pm_breeding_program_desc: "Скрещивание испанских, пуэбло и поглощенных англоязычных родословных с линиями лошадей и аристократов дает более глубокую и выносливую равнинную лошадь." #NT!
 nd_num_pm_industrial_horse: "Промышленный загон для лошадей" #NT!
 nd_num_pm_industrial_horse_desc: "Современные стабильные методы в большом масштабе. Команчерия становится ведущим экспортером кавалерийской техники на континенте." #NT!
 nd_num_pm_council_maintenance: "Обслуживание Совета" #NT!
 nd_num_pm_council_maintenance_desc: "Древесина для каркаса хижины, скот и шерсть для пиршеств совета, пчелиный воск для ночных заседаний." #NT!
 nd_num_pm_comanchero_maintenance: "Техническое обслуживание Команчеро" #NT!
 nd_num_pm_comanchero_maintenance_desc: "Лошади и кожа текут наружу; оружие и табак текут внутрь. Пост Команчеро получает прибыль от приграничной торговли." #NT!
 nd_num_pm_llano_maintenance: "Обслуживание лагеря Ллано" #NT!
 nd_num_pm_llano_maintenance_desc: "Лошади для патрулей, кожа для седел, оружие для воинов, дичь от охотников-квахади." #NT!
 nd_num_pm_medicine_maintenance: "Техническое обслуживание Медицинского домика" #NT!
 nd_num_pm_medicine_maintenance_desc: "Пчелиный воск для свечей, мех для свертков с лекарствами, дичь и лекарства для церемоний пухакат." #NT!
 nd_num_pm_constitution_maintenance: "Обслуживание Зала Конституции" #NT!
 nd_num_pm_aristocrat_breeding: "Аристократическое коневодство" #NT!
 nd_num_pm_aristocrat_breeding_desc: "Программы селекционного разведения под руководством великих конно-аристократических родословных, которые одни контролируют лучшие родословные пони команчей." #NT!
 nd_num_pm_tribute_hide: "Производство шкур дань" #NT!
 nd_num_pm_tribute_hide_desc: "Переработка шкур бизона была масштабирована для обеспечения экспортной торговли Команчеро, а рейдовая экономика перерабатывала излишки захваченного скота и стада в кожу." #NT!
 nd_num_pm_constitution_maintenance_desc: "Бумага для протоколов, книги для библиотеки законодательного собрания, мебель для палаты." #NT!
  
  # ============================================================ 
  # Destiny tree localization 
  # ============================================================ 
  
  # Destiny advances 
 nd_num_destiny: "Судьба Нумуну Сукобиту" #NT!
 nd_num_destiny_desc: "Конная империя стоит. Параибо теперь должны решить, будет ли государство Нумуну управляться как континентальная империя дани или станет суверенным государством среди наций." #NT!
 nd_num_dest_a1_northern_frontier: "Граница дани Северной Мексики" #NT!
 nd_num_dest_a1_northern_frontier_desc: "Возьмите низменности Тамаулипеко к югу от Рио-Гранде в качестве первой границы империи с данью. Владейте #bold Тамаулипеко#! и #bold Маратин#! и выставьте 30-тысячную армию." #NT!
 nd_num_dest_a2_coahuila_dominion: "Коауила Доминион" #NT!
 nd_num_dest_a2_coahuila_dominion_desc: "Высокогорья Гуачичил и Коауила попадают под южный рейд. Владейте #bold Гуачичил#!,, #bold Куэнкаме#!, и #bold Чисос#!,, выставьте 50-тысячную армию и объедините 3500 жителей под властью команчей." #NT!
 nd_num_dest_a3_continental_hegemony: "Континентальная гегемония" #NT!
 nd_num_dest_a3_continental_hegemony_desc: "Нумуну Сукобиту становится высшей державой континента. Собственные #bold Мапими#!, #bold Куаналес#!, #bold Аласапа#!, и #bold Хумани#!; выставляют 75-тысячную армию; иметь 75 престижа и 3000 золота. Открывает зал Императорского совета бизонов." #NT!
 nd_num_dest_b1_indigenous_alliance: "Региональный альянс коренных народов" #NT!
 nd_num_dest_b1_indigenous_alliance_desc: "Примите институт #bold Легализма#!,, получите 50 престижа и 75 стабильности. Первые основы суверенного государства команчей заложены в протоколе совета и писаном законе." #NT!
 nd_num_dest_b2_plains_coalition: "Коалиция коренных народов равнин" #NT!
 nd_num_dest_b2_plains_coalition_desc: "Приобретите печатный станок #bold#! и объедините народы Равнин в коалицию под руководством команчей. Владеть #bold Хэ Сапа#! (Черные холмы) и #bold Аватикса#! (деревни Мандан); держите 2000 золота и 50 престижа." #NT!
 nd_num_dest_b3_pan_indigenous_confederation: "Пан-Коренная Конфедерация" #NT!
 nd_num_dest_b3_pan_indigenous_confederation_desc: "Федерация коренных народов, возглавляемая команчами, признана суверенной стороной, подписавшей соглашение среди великих держав. Объятия #bold Глобальная торговля#!; владеют #bold Горами Бигхорн#!, #bold Марапа#!, и #bold Минисосе#!; содержат 5000 развития, 75 престижа, 75 стабильности. Открывает Зал Договоров." #NT!
  
  # Destiny event titles, descriptions, options 
 nd_num.9.t: "Путь судьбы открыт" #NT!
 nd_num.9.d: "Параибо определили курс нации. Банды продвигаются вперед в выбранном направлении: сезонный цикл набегов, углубляющийся в континентальную империю, или совет, становящийся дипломатическим ядром федерации коренных народов." #NT!
 nd_num.9.a: "Путь задан." #NT!
  
 nd_num.10.t: "Граница дани" #NT!
 nd_num.10.d: "Всадники-команчи пересекли Рио-Гранде и прорвались к побережью Тамаулипеко. Маратин платит дань скотом и лошадьми; Ранчеро нижнего течения реки доставляют сезонный сбор в посольство команчей. Первая настоящая имперская провинция Нумуну Сукобиту расположена к югу от реки. Конная империя простирается до Мексики." #NT!
 nd_num.10.a: "Южная граница наша." #NT!
  
 nd_num.11.t: "Коауила попадает под рейд" #NT!
 nd_num.11.d: "Гуачичил. Куэнкаме. Чисос. Высокогорные пустыни Коауила и Дуранго подвергаются сезонным набегам. Испанские президиумы заброшены; Коренные общины приветствуют крах власти вице-короля под руководством команчей. Вопрос, стоящий перед советом: будут ли банды продолжать набег еще глубже, в то время как мексиканские штаты шатаются, или они укрепят то, что они взяли, и поглотят поглощенное население в империю?" #NT!
 nd_num.11.a: "Нажмите на рейд: Мексика открыта до Сакатекаса!" #NT!
 nd_num.11.b: "Укрепите новое владычество: сделайте его постоянным." #NT!
  
 nd_num.12.t: "Континентальная гегемония" #NT!
 nd_num.12.d: "Мапими, Куаналес, Аласапа, Ксумани: от Больсон-де-Мапими до Сьерра-Мадре, от Нуэво-Леона до плато Чиуауа держится континентальная империя. Параибо находятся на вершине имперской структуры, которая подчиняет себе каждый населенный штат северной Мексики. Совет обсуждает форму постоянной администрации империи: структуру вице-короля по образцу поглощенных испанских институтов или систему дани и казны в стиле команчей?" #NT!
 nd_num.12.a: "Установите наместничество команчей над завоеваниями." #NT!
 nd_num.12.b: "Превратите дань в единую континентальную казну." #NT!
  
 nd_num.13.t: "Совет союзных наций" #NT!
 nd_num.13.d: "На территории совета параибо принимают первые официальные посольства соседних стран: апачей, кайова, пуэбло. Языку команчей была дана письменная форма; договоры подписываются рукой, которую группы могут прочитать. Работа суверенного государства команчей начинается не в военном лагере, а в палате." #NT!
 nd_num.13.a: "Альянс коренных народов обретает форму." #NT!
  
 nd_num.14.t: "Равнинная коалиция" #NT!
 nd_num.14.d: "Блэк-Хилс священны для лакота; деревни на реке Миссури являются домом для манданов и хидатса. Совет команчей расширил свое влияние, чтобы объединить эти северные народы в конфедерацию, а печатный станок распространял язык Нумуну и тексты договоров по коридору Равнин. Совет обсуждает форму более широкой коалиции: совет равных, постоянно заседающий на Каунсил-Хилл, или сеть мобильных дипломатических посланников, охватывающих каждую столицу коренных народов от земель апачей до Великих озер?" #NT!
 nd_num.14.a: "Созвать постоянный Совет Пан-Равнин." #NT!
 nd_num.14.b: "Отправьте послов команчей в каждую столицу коренных народов." #NT!
  
 nd_num.15.t: "Пан-Коренная Конфедерация" #NT!
 nd_num.15.d: "Диапазон Бигхорн, Марапа, Минисосе. Федерация, возглавляемая команчами, простирается от Льяно-Эстакадо до Саскачевана, от Блэк-Хилс до набережной реки Мандан. Соединенные Штаты и Мексика ведут переговоры на равных; Соединенное Королевство направляет временного поверенного в делах. Команчи стали суверенной опорой блока коренных народов в международной системе. Совет завершает вопрос одним решением: будет ли федерация опираться на Обще-коренной пакт о протоколе совета и общей духовности или на писаную конституцию, связывающую каждую подписавшую нацию в качестве субъекта федерации?" #NT!
 nd_num.15.a: "Пан-Коренной пакт: протокол совета и песня Буффало связывают нас." #NT!
 nd_num.15.b: "Конституционный пакт: письменная федерация, каждая нация имеет свою подпись." #NT!
  
  # Static modifier loc: destiny timed modifiers 
 STATIC_MODIFIER_NAME_nd_num_dest_a2_press_north: "Нажмите на мексиканский рейд" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_a2_press_north: "В то время как мексиканские штаты поглощены гражданскими войнами, набеги команчей проникают глубже в горные президио. Каждый сезон отряд возвращается с пленниками, лошадьми и серебром." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_a2_fortify_gains: "Укрепите Пограничье" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_a2_fortify_gains: "Завоеванные мексиканские провинции укреплены, по всему новому доминиону построены укрытия и загоны для лошадей, поглощенное население интегрировано в систему банд. Империя становится постоянной." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_a3_continental_viceroyalty: "Континентальное вице-королевство" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_a3_continental_viceroyalty: "Структура вице-короля команчей заменяет разрушенные испанские институты, параибо, занимающие пост имперских губернаторов над поглощенными провинциями. Духовенство всех вероисповеданий склоняется перед советом, но англоязычные миссионеры отвернуты от досягаемости новой империи." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_a3_unifying_tribute: "Единое континентальное казначейство" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_a3_unifying_tribute: "Дань из северной Мексики, торговля Команчеро и экспорт бизоньих шкур объединены в единую имперскую казну. В совет вводятся пограничные торговцы и поглощенные купцы; инфляция контролируется, кредиты дешевы, империя процветает." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_b2_pan_plains_council: "Совет Пан-Равнин" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_b2_pan_plains_council: "Постоянная территория совета принимает посланников всех стран Равнин. Коалиционный набор исключает появление наемных банд; разрушения, нанесенные предыдущим рейдовым циклом, устраняются коллективными усилиями." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_b2_diplomatic_envoys: "Мобильные дипломатические посланники" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_b2_diplomatic_envoys: "Посланники, обученные команчами, достигают каждой столицы коренных народов от апачей до Великих озер, неся с собой нумическое письмо и тексты договоров. Коалиция отвергает банды наемников как инструмент европейских держав." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_b3_pan_indigenous_pact: "Пан-коренной пакт" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_b3_pan_indigenous_pact: "Федерация опирается на протокол совета и общую духовность Равнин. Песня Буффало объединяет коалицию; пухакат говорят в один голос; создание инфраструктуры совета является обязанностью каждой подписавшей группы." #NT!
 STATIC_MODIFIER_NAME_nd_num_dest_b3_constitutional_pact: "Конституционный пакт" #NT!
 STATIC_MODIFIER_DESC_nd_num_dest_b3_constitutional_pact: "Письменная федеральная конституция связывает каждого подписавшего коренного населения как суверенного субъекта конфедерации, возглавляемой команчами. Торговцы-бюргеры управляют международной торговлей; посланники варьируются от Льяно до Арктики." #NT!
  
  # Destiny capstone buildings 
 nd_num_imperial_bison_council: "Зал Императорского Зубрового Совета" #NT!
 nd_num_imperial_bison_council_desc: "Высшее государство Нумуну, где параибо и теквунивапи совместно управляют континентальной империей. Согласно стандарту Совета Бизонов, поглощенные страны управляются как имперские провинции." #NT!
 nd_num_treaty_hall: "Договорной зал и Нумическая школа" #NT!
 nd_num_treaty_hall_desc: "Дипломатическая палата суверенного государства команчей, к которой примыкает нумическая школа. Договоры с Соединенными Штатами, Мексикой и коренными народами составляются, обсуждаются, подписываются и архивируются под одной крышей." #NT!
  
  # Destiny capstone production methods 
 nd_num_pm_imperial_bison_council_maintenance: "Обслуживание Имперского Совета" #NT!
 nd_num_pm_imperial_bison_council_maintenance_desc: "Лошади для императорской гвардии, кожа для седел параибо, оружие для военного отряда, скот для пиршеств совета." #NT!
 nd_num_pm_treaty_hall_maintenance: "Обслуживание Договорного зала" #NT!
 nd_num_pm_treaty_hall_maintenance_desc: "Бумага для проектов договоров, книги для школьной библиотеки, прекрасная ткань для протоколов палаты, мебель для дипломатических мест." #NT!
  
  # ============================================================ 
  # Bureaucracy slot grant + bureaucracy display strings 
  # ============================================================ 
 AUTO_MODIFIER_NAME_nd_num_bureaucracy_authority: "Федеральная власть Команчерии" #NT!
 AUTO_MODIFIER_DESC_nd_num_bureaucracy_authority: "Пять орд Нумуну Сукобиту провозгласили федерацию, и четыре института команчей готовы стать постоянными органами: Совет нации команчей под управлением двойного офиса параибос-теквунивапи, Многоордынская федерация пенатека, ямпарика, квахади, нокони и коцотека, режим торговых лицензий команчеро и система регистрации пленников, которая превращает цикл рейдов в демографический двигатель. Два слота открываются рядом с неявным слотом столицы, что позволяет закрепить три из четырех, в то время как четвертый остается созванным по случаю советом по старому обычаю федерации." #NT!
  
 num_council_of_comanche_nation_bureaucracy: "Совет нации команчей" #NT!
 num_council_of_comanche_nation_bureaucracy_desc: "Межгрупповое собрание под совместным управлением параибо и теквунивапи. Параибо (мирные вожди) договорились о дани, выкупе пленников и лицензиях Команчеро; Текунивапи (военные вожди) возглавляли цикл рейдов. Когда дивизии сошлись у Холма Совета или Большого Источника, парная власть была поднята сразу над всеми пятью ордами, ратифицируя мир, войну и перераспределение между бандами. При этом совет говорит в один голос; если пренебречь, параибо и теквунивапи тянутся в противоположные стороны, и федерация движется без очереди." #NT!
  
 num_multi_horde_federation_bureaucracy: "Мультиордынская Федерация" #NT!
 num_multi_horde_federation_bureaucracy_desc: "Федеративная структура из пяти подразделений, объединяющая Пенатеку - медоедов, Ямпарику - корнеедов, Квахади - антилоп, Нокони - поворачивающегося назад и Коцотеку - пожирателей буйволов. У каждой орды были свои параибо и свой радиус набега: Пенатека на юг до Коауилы, Квахади на запад через Льяно Эстакадо, Ямпарика на север до Арканзаса. Федерация объединила дивизии для войны и ратифицировала мир на межгрупповом совете, но так и не отменила автономию на уровне дивизий. При этом каждая орда управляет своей территорией; Если пренебречь, подразделения сойдутся друг против друга, и совет в Каунсил-Хилле не сможет собрать кворум." #NT!
  
 num_comanchero_license_bureaucracy: "Торговая лицензия Команчеро" #NT!
 num_comanchero_license_bureaucracy_desc: "Таможенная система, управляемая команчами, регулирующая торговцев латиноамериканского происхождения и пуэбло (команчеро), которые въезжали в Команчерию для торговли лошадьми, шкурами, пленниками и серебром. Команчи выдавали лицензии, устанавливали обменные курсы на ярмарках-свиданиях и получали долю от каждого каравана. К 1830-м годам команчеро действовали в соответствии с признанным таможенным режимом, ежегодно возвращаясь к фиксированным водоемам, которые параибо обозначили как лицензированные торговые точки. В отчетах Техаса описывается негосударственная организация с работающим тарифным механизмом. При хорошем состоянии рынки пополняют казну федерации; пренебрегая ими, они превращаются в маршруты контрабанды, а старые банды обвиняют параибо в том, что они разбогатели за счет торговцев из Пуэбло." #NT!
  
 num_captive_incorporation_bureaucracy: "Система регистрации кэптивных компаний" #NT!
 num_captive_incorporation_bureaucracy_desc: "Институционализированная практика включения пленников (мексиканцев, пуэбло, англо) в банды команчей в качестве приемных родственников. Пленников брали в набегах, выкупали у их родственников за лошадей или серебро или, если они были молоды, воспитывали как детей команчей и женили их на представителях рода. К девятнадцатому веку значительная часть населения команчей составляла выходцев из плена мексиканцев или англо-американцев, и это учреждение стало демографическим двигателем федерации. Поддержанные пленники становятся команчами, и многоэтническая федерация растет; пренебрегаемые, неассимилированные образуют обиженную фракцию, а представители более старых линий жалуются, что группы разбавлены." #NT!
 STATIC_MODIFIER_NAME_nd_num_paraibo_confederation: "Конфедерация Параибо-Теквунивапи" #NT!
 STATIC_MODIFIER_DESC_nd_num_paraibo_confederation: "Федеральное управление Нумуну: параибо (мирные вожди) и теквунивапи (военные вожди), управляющие пятью великими дивизиями (Пенатека, Ямпарика, Квахади, Нокони, Коцотека) через Совет нации команчей на Советском холме. Межгрупповое собрание, родство, сплоченность бизоньей экономики. Никакого унитарного королевства; Империя команчей — это конфедерация." #NT!
