l_russian:
 STATIC_MODIFIER_NAME_nd_sword_of_the_sultanate: "Меч Султаната" #NT!
 STATIC_MODIFIER_DESC_nd_sword_of_the_sultanate: "Султан командует самой мощной кавалерией во всем Индостане. Армии Дели, созданные в традициях мамлюкской гвардии и завоеваний Халджи, проносятся по равнинам с железной дисциплиной и подавляющей силой." #NT!
 STATIC_MODIFIER_NAME_nd_throne_of_hindustan: "Трон Индостана" #NT!
 STATIC_MODIFIER_DESC_nd_throne_of_hindustan: "Из резиденции Дели султан руководит обширной администрацией, которая объединяет персидскую утонченность и индийское изобилие. Двор привлекает ученых, поэтов и торговцев со всего исламского мира, а различные народы Индостана находят общие цели под просвещенным управлением." #NT!
 STATIC_MODIFIER_NAME_nd_khalji_market_discipline: "Рыночная дисциплина Халджи" #NT!
 STATIC_MODIFIER_DESC_nd_khalji_market_discipline: "Государство обеспечивает строгий контроль над ценами на зерно, ткань и лошадей, что позволяет содержать огромную постоянную армию по приемлемым ценам." #NT!
 STATIC_MODIFIER_NAME_nd_iqta_centralization: "Икта Централизация" #NT!
 STATIC_MODIFIER_DESC_nd_iqta_centralization: "Систематический аудит и перераспределение земельных грантов икта усиливает прямой контроль короны над доходами провинций и ослабляет автономию местных губернаторов." #NT!
 STATIC_MODIFIER_NAME_nd_suri_imperial_highway: "Сури Имперское шоссе" #NT!
 STATIC_MODIFIER_DESC_nd_suri_imperial_highway: "Расширение Великой магистральной дороги и строительство сараев по ее длине изменили сухопутную торговлю, соединив Бенгалию с Индом непрерывной торговой лентой." #NT!
 nd_dlh.1.t: "Султанат восстановлен" #NT!
 nd_dlh.1.d: "Дели снова стал резиденцией мусульманского суверенитета над Индостаном. От Красного форта до Кутб-Минара горизонт города провозглашает власть султана, который воссоединил эти обширные владения. Вопрос теперь в том, какой это будет султанат. Манят военные традиции династий Хальджи и Лоди: империя, построенная на кавалерийских атаках и острых завоеваниях. Но то же самое относится и к видению администраторов Туглака: царство, где персидская образованность сочетается с индийским богатством, где различные народы управляются с помощью изощренной бюрократии, а не только с помощью меча. Султан должен выбрать путь, который определит эту новую эпоху.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_dlh.1.a: "Пусть кавалерия пронесется по равнинам Ганга!" #NT!
 nd_dlh.1.b: "Мы построим империю управления и культуры." #NT!
 nd_dlh.2.t: "Рыночные реформы султана" #NT!
 nd_dlh.2.d: "По примеру султана Алауддина Халджи, государство ввело жесткий контроль над ценами на рынках Дели. Были созданы три отдельных рынка: один для зерна, один для ткани и промышленных товаров и один для лошадей, крупного рогатого скота и рабов. Каждым руководит шахна-и-манди, который подчиняется непосредственно разведывательной службе. Среди торговцев общаются шпионы, чтобы обеспечить соблюдение требований. Цель ясна: зафиксировав цены на зерно на искусственно низком уровне, солдаты смогут получать скромные зарплаты, но при этом смогут прокормить свои семьи. В результате появилась постоянная армия беспрецедентного размера: исторические источники утверждают, что под знаменами Хальджи насчитывается более 475 000 всадников. Однако такой контроль порождает недовольство как среди торговцев, так и среди фермеров." #NT!
 nd_dlh.2.a: "Усильте контроль: армию надо кормить." #NT!
 nd_dlh.2.b: "Ослабьте рынки: стабильность через процветание." #NT!
 nd_dlh.3.t: "Система Икта" #NT!
 nd_dlh.3.d: "Система икта, унаследованная от более ранних исламских государств, стала основой администрации Султаната. Иктадары, военные командиры, которым предоставлены полномочия по сбору доходов на определенных землях, выполняют функции как губернаторов провинций, так и местных военачальников. При султане Илтутмише эти гранты были временными и передаваемыми, что предотвращало появление земельной наследственной аристократии, которая могла бросить вызов трону. Теперь султан стоит перед выбором: ужесточить центральный контроль, требуя строгих проверок и частых переводов, укрепляя корону, но рискуя лояльностью военной элиты, или позволить иктасу стать более стабильным, вознаграждая верную службу гарантиями пребывания в должности." #NT!
 nd_dlh.3.a: "Централизуйте: указ султана должен быть абсолютным." #NT!
 nd_dlh.3.b: "Пусть иктадары процветают в своих владениях." #NT!
 nd_dlh.4.t: "Императорский Сарай" #NT!
 nd_dlh.4.d: "Следуя традициям Шер Шаха Сури, штат приступил к масштабной программе развития инфраструктуры вдоль великих магистралей Индостана. Каждые четыре мили был построен сарай: обнесенный стеной комплекс, обеспечивающий путешественникам кров, еду и свежих лошадей. В каждом сарае есть мечеть, отдельные помещения для индуистских и мусульманских путешественников, колодец и конюшни. Общая сеть превышает 1700 сараев, превращая некогда опасные путешествия по кишащей бандитами сельской местности в рутинную торговлю. Торговцы сообщают, что товары теперь могут доставляться из Сонаргаона в Бенгалии до границы с Индом за недели, а не за месяцы." #NT!
 nd_dlh.4.a: "Дальнейшее расширение сети автомобильных дорог." #NT!
 nd_dlh.4.b: "Дороги построены. Теперь позвольте торговле течь." #NT!
 nd_dlh_mamluk_tradition: "Традиция мамлюкской гвардии" #NT!
 nd_dlh_mamluk_tradition_desc: "Институт обучения, порабощавший молодежь как элитных конных воинов, унаследованный от традиций Аббасидов и Гуридов, позволил создать самую грозную кавалерию Султаната." #NT!
 nd_dlh_iqta_system: "Земельные гранты Икты" #NT!
 nd_dlh_iqta_system_desc: "Передача прав сбора доходов с определенных территорий военачальникам вместо зарплаты: административная основа Султаната." #NT!
 nd_dlh_sultanate_madrasas: "Султанатские медресе" #NT!
 nd_dlh_sultanate_madrasas_desc: "По всему Султанату созданы центры исламского обучения, в которых преподают юриспруденцию, теологию, грамматику и естественные науки. Многие из них были подарены султанами и знатью в знак благочестия." #NT!
 nd_dlh_military_secretariat: "Военный секретариат" #NT!
 nd_dlh_military_secretariat_desc: "Диван-и-Арз вел подробные списки каждого солдата на службе султана, записывая их внешний вид, клейма их лошадей и назначенное им снаряжение, чтобы предотвратить мошенничество." #NT!
 nd_dlh_khalji_market_controls: "Контроль над рынком Халджи" #NT!
 nd_dlh_khalji_market_controls_desc: "Система регулируемых государством рынков и фиксированных цен, учрежденная султаном Алауддином Халджи, позволяла содержать самую большую постоянную армию в средневековой Индии." #NT!
 nd_dlh_tughlaq_fortifications: "Укрепления Туглак" #NT!
 nd_dlh_tughlaq_fortifications_desc: "Строгие, но массивные крепости из бутовой кладки, построенные во времена династии Туглаков, характеризуются покатыми стенами, разрушенными валами и акцентом на военную функцию, а не на украшение." #NT!
 nd_dlh_hasham_levies: "Система сбора Хашама" #NT!
 nd_dlh_hasham_levies_desc: "Призыв обычной пехоты, хашам, набранной как из индуистских, так и из мусульманских крестьян, обученных и оплачиваемых наличными, а не грантами на землю." #NT!
 nd_dlh_royal_karkhanas: "Королевский Карханас" #NT!
 nd_dlh_royal_karkhanas_desc: "Государственные мастерские по производству оружия, текстиля и предметов роскоши для двора и армии. Для работы на этих объектах были привлечены мастера со всего исламского мира." #NT!
 nd_dlh_barqandaz_tradition: "Баркандазская традиция" #NT!
 nd_dlh_barqandaz_tradition_desc: "Конные лучники позднего Султаната, искусные в быстром маневрировании и беспокоящем огне верхом на лошадях, опирались на среднеазиатские степные военные традиции." #NT!
 nd_dlh_sultanate_currency: "Валюта Султаната" #NT!
 nd_dlh_sultanate_currency_desc: "Стандартизация чеканки монет при делийских султанах, кульминацией которой стала серебряная рупия Шер Шаха Сури: монета настолько хорошо спроектирована, что на протяжении веков стала основой денежной системы Индии." #NT!
 nd_dlh_delhi_urbanization: "Урбанизация Дели" #NT!
 nd_dlh_delhi_urbanization_desc: "Превращение Дели в один из величайших городов мира, когда Ибн Баттута описал его в 1334 году как крупнейший город во всем мусульманском мире." #NT!
 nd_dlh_dagh_o_chehra: "Даг-о-Чехра" #NT!
 nd_dlh_dagh_o_chehra_desc: "Система военного учета клеймения лошадей (даг) и ведения описательных списков солдат (чехра) для предотвращения мошенничества с заработной платой и обеспечения боевой готовности." #NT!
 nd_dlh_topchi_artillery: "Артиллерийский корпус Топчи" #NT!
 nd_dlh_topchi_artillery_desc: "Принятие на вооружение пороховой артиллерии Делийского султаната на основе среднеазиатских и османских традиций. Артиллеристы Топчи служили вместе с традиционной кавалерией в армиях позднего Султаната." #NT!
 nd_dlh_suri_sarais: "Сури Сараис" #NT!
 nd_dlh_suri_sarais_desc: "Обширная сеть придорожных домов отдыха, построенная Шер Шахом Сури вдоль Великой магистральной дороги, обеспечивающая убежище, еду и безопасность путешественникам и торговцам по всему субконтиненту." #NT!
 nd_dlh_suri_administrative_reform: "Административная реформа Сури" #NT!
 nd_dlh_suri_administrative_reform_desc: "Реорганизация правительства провинции под руководством Шер Шаха Сури, разделив империю на саркары и парганы с систематической оценкой доходов и профессиональным управлением." #NT!
 nd_dlh_indo_islamic_architecture: "Индо-исламская архитектура" #NT!
 nd_dlh_indo_islamic_architecture_desc: "Характерное сочетание персидских и индийских архитектурных традиций: от остроконечных арок и геометрической каллиграфии эпохи Халджи до двойных куполов и кровли Лодиса из бангла." #NT!
 nd_dlh_suri_military_reform: "Сури Военная реформа" #NT!
 nd_dlh_suri_military_reform_desc: "Реорганизация армии Шер Шахом Сури в дисциплинированные, централизованно оплачиваемые силы со стандартизированным оборудованием, заменяющая феодальную систему набора профессиональной пехотой." #NT!
 nd_dlh_grand_trunk_expansion: "Большое расширение багажника" #NT!
 nd_dlh_grand_trunk_expansion_desc: "Продолжающееся развитие дорожной сети Индостана с тенистыми деревьями, вехами и мостами, соединяющими отдаленные провинции империи со столицей." #NT!
 nd_dlh_centralized_revenue: "Централизованный доход" #NT!
 nd_dlh_centralized_revenue_desc: "Систематическое измерение и оценка сельскохозяйственных земель по всему Султанату с заменой налогообложения, основанного на оценках, извлечением доходов на основе обследований." #NT!
 nd_dlh_reformed_sultanate_army: "Реформированная султанатская армия" #NT!
 nd_dlh_reformed_sultanate_army_desc: "Модернизация вооруженных сил Дели, объединяющая европейскую подготовку и тактику с традиционными кавалерийскими и артиллерийскими традициями Султаната." #NT!
 nd_dlh_industrial_karkhanas: "Промышленный Карханас" #NT!
 nd_dlh_industrial_karkhanas_desc: "Превращение королевских мастерских Султаната из придворных ремесленников в протоиндустриальные производственные центры, производящие текстиль, оружие и готовую продукцию в больших масштабах." #NT!
 nd_dlh_legacy_of_synthesis: "Наследие синтеза" #NT!
 nd_dlh_legacy_of_synthesis_desc: "Непреходящее достижение Делийского султаната: создание сложной индо-исламской цивилизации, синтезировавшей персидские, турецкие, арабские и индийские традиции в нечто большее, чем любой отдельный источник." #NT!
 a_nd_dlh_mamluk_guard: "Мамлюкская гвардейская кавалерия" #NT!
 a_nd_dlh_mamluk_guard_desc: "Элитные конные воины с юности обучались в среднеазиатских традициях, образуя личную гвардию султана и ударную силу армий султаната." #NT!
 a_nd_dlh_hasham_infantry: "Хашам Пехота" #NT!
 a_nd_dlh_hasham_infantry_desc: "Призывники-пехотинцы набирались из крестьянского населения и оплачивались наличными. Хотя их численность была менее престижной, чем кавалерия, они давали Султанату преимущество в живой силе." #NT!
 a_nd_dlh_barqandaz: "Баркандаз" #NT!
 a_nd_dlh_barqandaz_desc: "Стремительные конные лучники, специализирующиеся на беспокоящем огне и быстром преследовании, применяющие тактику среднеазиатских степей на равнинах Индостана." #NT!
 a_nd_dlh_topchi: "Топчи" #NT!
 a_nd_dlh_topchi_desc: "Пороховые артиллеристы, входившие в состав артиллерийских батарей султана, были созданы на основе смеси среднеазиатских, османских и местных традиций." #NT!
 a_nd_dlh_suri_piyada: "Сури Пияда" #NT!
 a_nd_dlh_suri_piyada_desc: "Дисциплинированные пехотинцы эпохи Сури, обученные и экипированные по профессиональным стандартам, символизирующие переход от феодального набора к постоянной армии." #NT!
 levy_nd_dlh_hasham: "Хашам Леви" #NT!
 levy_nd_dlh_hasham_desc: "Призванная крестьянская пехота, собранная через систему денежных сборов Султаната, составляла массу пехотинцев, поддерживавших элитную кавалерию." #NT!
 nd_dlh_tughlaqabad_fortress: "Крепость Туглакабад" #NT!
 nd_dlh_tughlaqabad_fortress_desc: "Массивное укрепление, построенное в строгом стиле Туглак, с покатыми каменными стенами и потрепанными валами, предназначенными для того, чтобы выдержать осаду." #NT!
 nd_dlh_sarai: "Сарай" #NT!
 nd_dlh_sarai_desc: "Обнесенный стеной придорожный дом отдыха, обеспечивающий еду, кров и свежих лошадей для путешественников и торговцев на главных путях империи." #NT!
 nd_dlh_madrasa: "Медресе" #NT!
 nd_dlh_madrasa_desc: "Исламская семинария, преподающая юриспруденцию, теологию и естественные науки, служащая центром обучения и тренировочной площадкой для административного класса Султаната." #NT!
 nd_dlh_karkhana: "Королевская Кархана" #NT!
 nd_dlh_karkhana_desc: "Государственная мастерская, где мастера производят оружие, изысканный текстиль и предметы роскоши для двора и армии султана." #NT!
 nd_dlh_diwan_i_arz: "Диван-и-Арз" #NT!
 nd_dlh_diwan_i_arz_desc: "Военный секретариат, ответственный за ведение списков сборов, клеймение кавалерийских лошадей и обеспечение готовности и дисциплины вооруженных сил султана." #NT!
 nd_dlh_fortress_maintenance: "Содержание крепости" #NT!
 nd_dlh_fortress_maintenance_desc: "Камень для текущего ремонта, вооружение для гарнизона и инструменты для инженеров, обслуживающих каменные валы." #NT!
 nd_dlh_sarai_provisions: "Сарайские провизии" #NT!
 nd_dlh_sarai_provisions_desc: "Зерно и домашний скот, чтобы кормить путников и снабжать свежими животными, а соль — для сохранения провизии на магистральных маршрутах." #NT!
 nd_dlh_madrasa_endowment: "Фонд медресе" #NT!
 nd_dlh_madrasa_endowment_desc: "Бумага для рукописей и научной корреспонденции, а также ткань для одежды учителей и студентов, предоставленная вакфом." #NT!
 nd_dlh_karkhana_inputs: "Кархана Материалы" #NT!
 nd_dlh_karkhana_inputs_desc: "Мастера ткут из импортной ткани и красят изысканные ткани для двора султана." #NT!
 nd_dlh_diwan_administration: "Администрация Дивана" #NT!
 nd_dlh_diwan_administration_desc: "Бумага для списков и описательных ведомостей, серебро для солдатской зарплаты и ткань для стандартного снаряжения, поставляемого через военный секретариат." #NT!
 nd_dlh_sultanate_minting: "Султанатская чеканка" #NT!
 nd_dlh_sultanate_minting_desc: "Опытные монетные дворники чеканят стандартные серебряные и медные монеты, производя изделия из драгоценных металлов для казны Султаната." #NT!
 nd_dlh_formed_tt: "Дели был образован." #NT!
 nd_dlh_path_a_tt: "Выбрать Меч Султаната" #NT!
 nd_dlh_path_b_tt: "Выбрать трон Индостана" #NT!
 nd_dlh_destiny: "Судьба Дели" #NT!
 nd_dlh_destiny_desc: "Султанат Дели восстановлен. Теперь начинается работа по формированию своего будущего, будь то мечом или пером. Достигните стабильности, чтобы разблокировать выбранный вами путь судьбы." #NT!
 nd_dlh_dest_deccan_conquest: "Деканское завоевание" #NT!
 nd_dlh_dest_deccan_conquest_desc: "Плато Бахмани и богатые города Декана долгое время сопротивлялись власти Дели. Приведите Гульбаргу и Бидара под знамя султана, как когда-то мечтал Алауддин Халджи, и соберите армию, достойную этого предприятия." #NT!
 nd_dlh_dest_subjugate_south: "Подчинить себе Юг" #NT!
 nd_dlh_dest_subjugate_south_desc: "Когда северный Декан был захвачен, взгляд султана обратился к великим индуистским королевствам юга. Варангал и Виджаянагар должны пасть. Постройте достаточно обширное королевство, чтобы поддерживать кампанию." #NT!
 nd_dlh_dest_sultan_of_all_india: "Султан всей Индии" #NT!
 nd_dlh_dest_sultan_of_all_india_desc: "От Гималаев до мыса Коморин, от Инда до Бенгальского залива: приказ султана должен действовать беспрекословно. Возьмите Мадурай, Гоа и Сурат. Командуйте самой могущественной армией и самой богатой казной на всем субконтиненте." #NT!
 nd_dlh_dest_bengal_integration: "Бенгальская интеграция" #NT!
 nd_dlh_dest_bengal_integration_desc: "Бенгалия, самая богатая провинция во всем Индостане, слишком долго управлялась как далекая граница. Возьмите Гаур и Сонаргаон под прямое имперское управление и используйте богатства региона, связанные с шелком и рисом." #NT!
 nd_dlh_dest_institutional_zenith: "Институциональный Зенит" #NT!
 nd_dlh_dest_institutional_zenith_desc: "Администрация султана должна распространить свое влияние на крупные торговые города западной Индии. Приведите Хамбата и Удджайна в ряды империи, наполните казну и развивайте королевство за пределами ядра формации." #NT!
 nd_dlh_dest_beacon_of_hindustan: "Маяк Индостана" #NT!
 nd_dlh_dest_beacon_of_hindustan_desc: "Султанат должен стать величайшим административным государством, которое когда-либо знал субконтинент. Защитите порт Читтагонг, добейтесь высочайшего престижа и развивайте весь потенциал королевства." #NT!
 nd_dlh.5.t: "Судьба Дели" #NT!
 nd_dlh.5.d: "Султанат был восстановлен, а вместе с ним и обещание будущего, достойного древнего величия Дели. Теперь султан должен наметить курс, который проведет эту империю через века. Путь выбран, теперь его надо пройти." #NT!
 nd_dlh.5.a: "Дели выдержит." #NT!
 nd_dlh.6.t: "Марш в Декан" #NT!
 nd_dlh.6.d: "Армии султана пересекли хребет Виндхья и покорили города Декана. Гульбарга и Бидар, резиденции султанов Бахмани, теперь несут штандарт Дели. Деканские кампании Алауддина Халджи были повторены, и на этот раз успехи будут постоянными. Богатства плато текут на север, в Дели, а южные индуистские королевства наблюдают за этим с растущей тревогой." #NT!
 nd_dlh.6.a: "Декан кланяется Дели." #NT!
 nd_dlh.7.t: "Южные кампании" #NT!
 nd_dlh.7.d: "Варангал пал. Рубины из сокровищницы Какатии были увезены на север. И что самое примечательное, могучая цитадель Виджаянагар, последний великий бастион индуистского сопротивления, подчинилась власти султана. Южные кампании вне всякого сомнения доказали военное превосходство Султаната. Теперь султан должен решить, как закрепить эти огромные новые завоевания." #NT!
 nd_dlh.7.a: "Марш с боевыми слонами в авангарде." #NT!
 nd_dlh.7.b: "Полностью сокрушить сопротивление. Ничего не оставляйте." #NT!
 nd_dlh.8.t: "Султан всей Индии" #NT!
 nd_dlh.8.d: "От заснеженных перевалов Кашмира до храмовых городов тамильского побережья, от пристаней Сурата до мангровых болот Сундарбанса: приказ султана беспрепятственно распространяется по всему субконтиненту. Ни один правитель со времен Ашоки не управлял такими владениями. Вопрос, который сейчас определяет империю, заключается в том, следует ли поддерживать этот универсальный суверенитет посредством вечной священной войны или султан должен стремиться к прочному миру между народами Индии." #NT!
 nd_dlh.8.a: "Меч гази никогда не должен отдыхать." #NT!
 nd_dlh.8.b: "Пусть народы Индии познают мир." #NT!
 nd_dlh.9.t: "Богатство Бенгалии" #NT!
 nd_dlh.9.d: "Администрация султана завершила интеграцию Бенгалии в имперскую систему. Гаур, древняя столица бенгальских султанов, и Сонаргаон, великий торговый центр восточной дельты, теперь являются провинциями, управляемыми непосредственно султанатом. Бенгальский шелк, муслин и рис текут на запад по Великой магистральной дороге, обогащая казну и питая города Индостана. Экономический центр тяжести империи сместился на восток." #NT!
 nd_dlh.9.a: "Бенгалия обогащает все королевство." #NT!
 nd_dlh.10.t: "Институциональный зенит" #NT!
 nd_dlh.10.d: "Администрация Султаната достигла беспрецедентного уровня сложности. Поскольку торговые города Гуджарата находятся под контролем империи, доходы перетекают со всех уголков субконтинента в Дели. Медресе обеспечивают постоянный поток обученных администраторов, а система саркаров обеспечивает соблюдение указов султана от Инда до Брахмапутры. Теперь вопрос заключается в том, следует ли добиваться этого административного совершенства посредством духовной гармонии или посредством систематического извлечения доходов." #NT!
 nd_dlh.10.a: "Встаньте на суфийский путь толерантности." #NT!
 nd_dlh.10.b: "Закажите комплексное исследование доходов." #NT!
 nd_dlh.11.t: "Маяк Индостана" #NT!
 nd_dlh.11.d: "Султанат Дели стал тем, о чем только мечтали императоры Туглаков: государством, административный охват, культурное развитие и экономическая мощь которого не имеют себе равных нигде в мире. Ученые от Каира до Самарканда едут в Дели, чтобы изучить его системы управления. Султан возглавляет космополитический суд, где персидская поэзия и санскритская философия сосуществуют бок о бок, где математика индуистских храмов служит основой для исламских астрономических таблиц и где различные народы субконтинента нашли общую идентичность под знаменем просвещенного суверенитета." #NT!
 nd_dlh.11.a: "Развивайте космополитический суд для всех народов." #NT!
 nd_dlh.11.b: "Обеспечьте фонды вакфов по всей территории." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_war_elephants: "Боевые слоны султана" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_war_elephants: "Захваченные боевые слоны южных королевств теперь составляют авангард армий султана, хотя их яростные атаки оставляют за собой разрушения." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_scorched_earth: "Политика выжженной земли" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_scorched_earth: "Безжалостное подавление сопротивления по всему Декану обеспечивает согласие, хотя применяемые методы запятнают репутацию султана." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_ghazi_tradition: "Традиция Гази" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_ghazi_tradition: "Султан претендует на титул гази, воина веры, и постоянное расширение становится смыслом существования империи, хотя постоянные войны истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_pax_sultanica: "Пакс Султаника" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_pax_sultanica: "Объединив всю Индию под одним знаменем, султан открывает эпоху внутреннего мира и религиозного согласия, хотя прекращение завоеваний порождает самоуспокоенность среди правящего класса." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_sufi_tolerance: "Суфийская толерантность" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_sufi_tolerance: "Мистические традиции суфизма устраняют разрыв между мусульманскими правителями и индуистскими подданными, способствуя коммерческому доверию и дипломатической доброй воле, хотя упор на гармонию заставляет двор неохотно вести войну." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_revenue_survey: "Имперское обследование доходов" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_revenue_survey: "Всестороннее обследование каждого поля, мастерской и рыночного прилавка в империи обеспечивает основу для систематического налогообложения, укрепляя лояльность провинций, но отвлекая ресурсы от сбора разведывательной информации." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_cosmopolitan_court: "Космополитический суд" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_cosmopolitan_court: "Двор Дели становится маяком для ученых, дипломатов и поэтов со всего мира, расширяя дипломатические возможности и влияние Султаната." #NT!
 STATIC_MODIFIER_NAME_nd_dlh_dest_waqf_endowments: "Пожертвования вакфа" #NT!
 STATIC_MODIFIER_DESC_nd_dlh_dest_waqf_endowments: "Огромные благотворительные пожертвования финансируют мечети, больницы и караван-сараи по всей империи, укрепляя связь между правителем и управляемыми посредством благочестивой щедрости." #NT!
 nd_dlh_dar_al_shuja: "Дар аль-Шуджаа" #NT!
 nd_dlh_dar_al_shuja_desc: "Дом Храбрых: элитная военная академия, где лучшие воины султана обучаются верховой езде, осадному искусству и искусству командования армиями на огромных расстояниях субконтинента." #NT!
 nd_dlh_dar_al_shuja_maintenance: "Содержание Академии" #NT!
 nd_dlh_dar_al_shuja_maintenance_desc: "Оружие для тренировок, лошади для кавалерийских учений, кожа для доспехов и шорных изделий обеспечивают работоспособность академии." #NT!
 nd_dlh_firuzabad_complex: "Фирузабадский комплекс" #NT!
 nd_dlh_firuzabad_complex_desc: "Грандиозный административный и культурный комплекс, созданный по образцу Фируз Шаха Туглака, с библиотеками, обсерваториями и офисами имперской бюрократии." #NT!
 nd_dlh_firuzabad_maintenance: "Администрация комплекса" #NT!
 nd_dlh_firuzabad_maintenance_desc: "Бумага для записей и корреспонденции, тонкая ткань для обстановки суда, мебель для административных помещений и стекло для окон обсерватории." #NT!
  
  # ===== BUREAUCRACIES ===== 
 dlh_diwan_i_wizarat_bureaucracy: "Диван-и-Визарат" #NT!
 dlh_diwan_i_wizarat_bureaucracy_desc: "Офис вазира, центральный орган управления доходами султаната. Диван составлял списки хараджа, проверял провинциальные бюро и передавал финансовые распоряжения султана по всему Индостану. Ходжа Хатир служил Илтутмишу на этом посту; Хан-и-Джахан Макбул руководил им в последние десятилетия правления Фируз-шаха Туглука. Способный визирь мог поддерживать казну наполненной даже во время династического кризиса, но огромная свобода действий кабинета делала самого визиря вторым человеком в королевстве и неизбежным соперником других слуг трона." #NT!
 dlh_diwan_i_insha_bureaucracy: "Диван-и-Инша" #NT!
 dlh_diwan_i_insha_bureaucracy_desc: "Королевская канцелярия, отвечавшая за составление фирманов, маншуров о назначениях и исходящую корреспонденцию султана в высоком персидском стиле индо-исламского двора. При Фируз-шахе Туглуке в канцелярии работали Зия-уддин Барани и Шамс-и-Сирадж Афиф, историки-секретари, оставившие потомству Тарих-и-Фируз Шахи. Обученная канцелярия позволяла султану распространять власть в отдаленных провинциях и над народами, говорящими на иноязычных языках; его распад привел к появлению параллельных трещин, которые раскололи Туглукскую Индию в 1340-х годах." #NT!
 dlh_diwan_i_risalat_bureaucracy: "Диван-и-Рисалат" #NT!
 dlh_diwan_i_risalat_bureaucracy_desc: "Бюро по делам религии и исходящей корреспонденции в иностранные мусульманские суды, которому было поручено назначать кади, рекомендовать муфтиев и составлять посольства. Диван предоставил улемам признанный институциональный канал доступа к трону и сделал дипломатию султаната с аббасидским халифом в Мамлюкском Каире, с дворами Ильханидов, а затем и Тимуридов, а также с правителями Йемена и Мекки делом официального протокола. Наделенные полномочиями улемы защитили султана от обвинений в нечестии; если их не остановить, те же улемы могут объявить султана отступником." #NT!
 dlh_shahna_i_mandi_bureaucracy: "Шахна-и-Манди" #NT!
 dlh_shahna_i_mandi_bureaucracy_desc: "Управляющий рынком, созданный Алауддином Халджи примерно в 1296–1316 годах, который устанавливал цены на зерно, ткани, рабов и скот в мандисе Дели и запрещал накопление сокровищ под страхом физического увечья. Реформа кормила огромную постоянную армию за счет снижения заработной платы солдат, сохраняя при этом закупочные цены сельских производителей на низком уровне, но она зависела от агрессивного правоприменения, разорила столичных торговцев и была прекращена через несколько месяцев после смерти Алауддина. Барани назвал эту политику неповторимым шедевром государственного искусства и предупреждением." #NT!
 dlh_sadr_us_sudur_bureaucracy: "Садр-ус-Судур" #NT!
 dlh_sadr_us_sudur_bureaucracy_desc: "Главный надзиратель за благотворительными пожертвованиями (вакф), назначающий имамов в общинных мечетях и распределяющий государственные стипендии ученым (идрар). Фируз Шах Туглук наделял вакфами монументального масштаба: через этот офис проходили карханы Фирузабада, великий Хисарский канал, а также основание Джаунпура и Хисар-Фирузы. Садр вел реестры благочестивых фондов и распределял их доходы; В умелых руках эта должность сделала султана строителем мечетей и медресе, памятных на протяжении веков." #NT!
 dlh_naib_i_mulk_bureaucracy: "Наиб-и-Мульк" #NT!
 dlh_naib_i_mulk_bureaucracy_desc: "Регент-визирь - исключительная должность, на которой выдающийся дворянин принимал на себя полномочия султана во время меньшинства, плохого здоровья или политической недееспособности. Хосров-хан сверг Мубарака Халджи с этой должности в 1320 году; Хан-и-Джахан Макбул управлял им в последние десятилетия правления Фируз Шаха; Бахлул Лоди поднялся из своего рода наместника в 1450-х годах и основал последнюю династию султаната. Этот институт поддерживал функционирование королевства через слабых султанов, но концентрировал военные и финансовые рычаги королевства в руках одного дворянина и на этом пути привел к не одному династическому переходу." #NT!
 dlh_tughluq_doab_cadaster_bureaucracy: "Кадастр Доаба" #NT!
 dlh_tughluq_doab_cadaster_bureaucracy_desc: "Проект Мухаммада бин Туглука 1325–1351 годов по измерению каждого участка в Доабе между Гангом и Ямуной и стандартизации оценки доходов по локтю, заменив старые методы оценки по деревням. В сочетании с одновременным повышением налогов во время засухи кадастр спровоцировал бегство крестьян и голод, опустошивший целые районы. Административный аппарат пережил катастрофу и стал образцом для землеустроительных работ Шер Шаха Сури, а два столетия спустя — Тодар Мала Акбара: здесь были заложены основы финансовой сложности Великих Моголов." #NT!
  
 AUTO_MODIFIER_NAME_nd_dlh_bureaucracy_authority: "Султанатские Диваны" #NT!
 AUTO_MODIFIER_DESC_nd_dlh_bureaucracy_authority: "Диваны Дели (вазират, канцелярия, бюро переписки, канцелярия главного садра) превратились в постоянный институциональный аппарат. В квартале Кувват-уль-Ислам в Дели реестры доходов, назначений и благочестивых пожертвований теперь хранятся как непрерывный архив, а приказы султана имеют вес учреждения, а не человека." #NT!
