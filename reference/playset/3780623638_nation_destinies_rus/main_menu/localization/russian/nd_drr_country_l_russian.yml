l_russian:
 DRR: "Империя Дуррани" #NT!
 DRR_ADJ: "Дуррани" #NT!
 DRR_f: "Империя Дуррани" #NT!
 DRR_f_desc: "Создайте империю под руководством пуштунов, охватывающую перекресток Персии, Центральной Азии и Индостана, в традициях Лойя джирги Ахмад Шаха Дуррани в Кандагаре в 1747 году. Империя Дуррани была второй по величине мусульманской державой своего времени, связывая афганскую племенную конфедерацию, Хорасан, Синд и Пенджаб в единое царство под знаменем Абдали." #NT!
