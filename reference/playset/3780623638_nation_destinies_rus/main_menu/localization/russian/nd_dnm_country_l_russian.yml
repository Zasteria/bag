l_russian:
 DNM: "Дунайская монархия" #NT!
 DNM_ADJ: "Дунайский" #NT!
 DNM_f: "Дунайская монархия" #NT!
 DNM_f_desc: "Дунайская монархия — это империя, которую создает Дом Габсбургов, отказавшись от Рейха. Для императора Священной Римской империи немецкая гегемония и дунайское сверхгосударство всегда были взаимоисключающими: император, привязанный к имперскому сейму, курфюрсты и рейхстаг никогда не могли централизовать Австрию, Богемию и Венгрию в одну послушную корону. Формирование Дунайской монархии разрешает эту дилемму единственным способом ее решения – разрывом. Вы отказываетесь от имперского достоинства, выводите свои наследственные чешские и венгерские земли из Священной Римской империи и вновь основываете их как собственную суверенную империю, не подчиняющуюся никакому сейму, кроме своего собственного двора. Немецкие князья предоставлены своему рейху; вы берете Дунай. Это не Австро-Венгрия, дуалистический компромисс, к которому история пришла только после столетия кризиса, а централизованная многоэтническая монархия, к которой Габсбурги всегда стремились, но никогда не понимали." #NT!
