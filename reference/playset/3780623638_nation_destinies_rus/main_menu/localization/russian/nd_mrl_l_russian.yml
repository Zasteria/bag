l_russian:
  # ===== Static Modifiers ===== 
 STATIC_MODIFIER_NAME_nd_mrl_tagalog_datu_court: "Тагальский суд Дату" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_tagalog_datu_court: "Двор Тондо и Майнилы возведен в императорское достоинство. Аристократия магину управляет архипелагом в тагальской традиции с оттенком махаяны, а полномочия раджи распространяются от Апарри до Котабато." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_pan_filipino_federation: "Пан-Филиппинская федерация" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_pan_filipino_federation: "Тагалог, Висаян, Таусуг, Магинданао, Капампанган, Иранун, Биколано: тринадцать народов, один конституционный договор. Идеал махарлики связывает их всех, не заставляя одного подчиняться другому." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_kris_and_bagani: "Меч Махарлики" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_kris_and_bagani: "Несущие крисы багани Минданао и махарлики Тондо маршируют под одним и тем же знаменем. Империя выкована в оружии; свободный человек несет их, данные повелевают ими, и ни один иностранный флот не должен коснуться их берегов." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_chancellery: "Канцелярия Байбайна" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_chancellery: "Государство пишет само себе на местном слоговом языке. Указы, налоговые ведомости, судебные протоколы: все на пальмовых листьях и бамбуке, все на байбаине." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_vernacular: "Байбайин (народный язык)" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_vernacular: "Грамотность на байбаине распространяется от двора к селу. Дети учат слоговую речь на бамбуковых планках; женщины держат домашние счета в своих руках." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_anitist_continuity: "Анитистская непрерывность" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_anitist_continuity: "Бабайлан занимает свое место рядом с кади и монахом. Духи предков, анито островов, не смещаются; их все уважают." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_concord_of_faiths: "Согласие вероисповеданий" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_concord_of_faiths: "Три традиции, одна компактность: анитист бабайлан, буддийский монах, мусульманин кади. Ни один не вытесняет других; империя стоит над всеми ними." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_admiralty: "Архипелаг Адмиралтейство" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_admiralty: "Военные корабли Балангая, разведчики Винта Латин, рейдеры Каракоа и штурмовые корпуса Ланонга координировались под управлением одного адмиралтейства. Море Сулу, Сибуян и Висайское море — внутренние воды империи." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_freeman_estates: "Фриман Эстейтс" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_freeman_estates: "Кодекс махарлики кодифицирован в законы страны. Свободный человек носит оружие, обязан служить и его выслушивают на собрании своего дату. Филиппинский свободный человек – это основа империи." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_warrior_aristocracy: "Воинская аристократия" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_warrior_aristocracy: "Махарлики официально оформлены как имперский офицерский корпус. Они служат в полках багани, командуют флотом каракоа и управляют пуэбло. Военная честь привязывает их к трону." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_galleon_killers: "Галеоны-убийцы" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_galleon_killers: "Эскадры Ланонга и Каракоа охотятся на испанские галеоны в Висайских проливах. Ни один иностранный флот, осмелившийся войти в архипелаг, не останется невредимым." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_fortress: "Архипелажная крепость" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_fortress: "Кольцевые форты в каждом прибрежном пуэбло. Тропические болезни, муссонные штормы и набор воинов ждут любую иностранную армию, которая осмелится высадиться. Сам архипелаг становится стеной." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_silver_route: "Серебро Тихого океана" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_silver_route: "Галеон Манила-Акапулько больше не испанский. Филиппинские корабелы в Кавите и филиппинские мореплаватели сами проводят серебряную линию; Новая Испания платит империи должное." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_council_of_datus: "Совет Датуса" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_council_of_datus: "Paramount datus, султан Сулу, раджа Тондо: конституционный орган, который выносит решения между великими домами. У Махарликского договора есть свой парламент." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_propagandist_circle: "Пропагандистский кружок" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_propagandist_circle: "Ризал, Пларидель, дель Пилар, Лопес Хаэна: поддерживаемые государством интеллектуалы кодифицируют филиппинскую гражданскую идентичность. Империя производит книги, которые когда-то импортировала." #NT!
  
  # ===== Formation Event ===== 
 nd_mrl.1.t: "Махарлика поднимается" #NT!
 nd_mrl.1.d: "От Апарри до Маймбунга, от Вигана до Замбоанги острова смыкаются в одно целое. Тринадцать народов отвечают одному знамени. Махарлика Лусона, тимава Висайских островов, багани Минданао: один класс воинов-дворян с тремя именами, теперь одна нация. Ни один испанский галеон не достигнет Себу раньше нас, ни один брунейский султанат не объявит Манилу своим сюзереном, ни один голландский флот не водрузит через нас свой флаг на Тидоре. Остается вопрос, какой должна быть империя Махарлики.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mrl.1.a: "Двор тагальского раджи в Тондо говорит от имени архипелага" #NT!
 nd_mrl.1.b: "Федерация всех народов согласно договору Махарлики." #NT!
 nd_mrl.1.c: "Крис и багани: империя, выкованная в оружии" #NT!
  
  # ===== Advance Events ===== 
 nd_mrl.2.t: "Байбайн становится рукой государства" #NT!
 nd_mrl.2.d: "Три коренных филиппинских письма пережили столетия: байбайн тагалогов, сурат Мангьян Миндоро, кулитан Пампанги. Суд Махарлики решает повысить байбайну статус императорской руки. Указы теперь доставляются из Тондо в Маймбунг в пакетах из пальмовых листьев, написанных круглыми, закольцованными буквами, которые испанские монахи в нашем мире отвергли как дьявольское письмо. Суд собирается для обсуждения масштабов сценария." #NT!
 nd_mrl.2.a: "Используйте байбайн только для канцелярии и высшего правительства." #NT!
 nd_mrl.2.b: "Распространите байбайн во всех приходских школах архипелага." #NT!
  
 nd_mrl.3.t: "Согласие трех конфессий" #NT!
 nd_mrl.3.d: "Жрица-бабайлан из Себу, буддийский монах из Бутуана и Сулу-кади сидят за одним императорским столом. Каждый из них представляет собой веру, которая жила на этих островах на протяжении веков: анитистский субстрат, восходящий к австронезийским путешествиям, индуистско-буддийский след от индианизированных Шривиджая и Маджапахита, суннитский ислам, пришедший из Брунея. Суд махарлики должен решить, признать ли все три из них терпимыми государством или сохранить антинитистскую традицию первой среди равных." #NT!
 nd_mrl.3.a: "Анитизм остается первой религией империи" #NT!
 nd_mrl.3.b: "Все три религии равноправны согласно имперскому закону." #NT!
  
 nd_mrl.4.t: "Паруса Объединенного флота" #NT!
 nd_mrl.4.d: "Из гавани Майнила огромный архипелажный флот выходит на свой первый смотр. Тагальские военные корабли-балангаи, оснащенные абакой, минданао-винта с латунными парусами, висайские каракоа с двумястами воинами на веслах, быстроходные корпуса иранун-ланонг, ощетинившиеся латунными лантаками. Четыре традиции, один флот.\n\nАдмирал обсуждает доктрину со своими капитанами. Некоторые требуют единого адмиралтейства из четырех традиций, в котором каждый тип корпуса будет использоваться согласованно как единый объединенный флот. Другие требуют специализации: эскадра быстрого нападения Ланонг в качестве авангарда империи, охотящаяся на колониальные галеоны еще до того, как они достигнут Себу." #NT!
 nd_mrl.4.a: "Единое адмиралтейство четырех традиций: один объединенный флот" #NT!
 nd_mrl.4.b: "Авангард Ланонга: специализированная быстрая атака против галеонов" #NT!
  
 nd_mrl.5.t: "Кодекс Махарлики стал законом" #NT!
 nd_mrl.5.d: "Три филиппинские воинские традиции: тагальская махарлика, висайская тимава, минданао багани. Три имени, один идеал: свободный человек, который носит оружие, клянется служить своим данным и стоит на плече своего господина на собрании. Имперская канцелярия теперь кодифицирует класс воинов-дворян как основу государства. Вопрос в том, являются ли махарлики широким классом вооруженных свободных людей или узкой офицерской аристократией имперских слуг." #NT!
 nd_mrl.5.a: "Широкий класс свободных граждан: каждый вооруженный гражданин — махарлика" #NT!
 nd_mrl.5.b: "Узкая офицерская аристократия, привязанная к трону" #NT!
  
 nd_mrl.6.t: "Ни один галеон не достиг Себу" #NT!
 nd_mrl.6.d: "Иностранный флот входит на архипелаг. Они ожидают, что ссорящиеся раджанаты и дату, платящие дань, будут разыграны друг против друга. Вместо этого они обнаруживают единую империю с единым флотом. Совет махарлика собирается, чтобы решить доктрину: будем ли мы охотиться на них в море с помощью эскадр Ланонга или позволим им высадиться и измельчить в пыль укрепленные пуэбло и воинские ополчения внутри страны?" #NT!
 nd_mrl.6.a: "Охотьтесь на них в море: ни один галеон не доберётся до наших берегов" #NT!
 nd_mrl.6.b: "Пусть приземлятся: сами острова — наша стена" #NT!
  
 nd_mrl.7.t: "Манильский галеон становится филиппинским" #NT!
 nd_mrl.7.d: "На протяжении двух с половиной столетий в нашем мире галеонная линия Манила-Акапулько перевозила серебро Нового Света в Азию и азиатский шелк в Новую Испанию. Построен в Испании, с испанским экипажем, с испанской прибылью. На временной шкале Махарлики великие транс-тихоокеанские торговцы построены в Кавите филиппинскими корабелами и управляются филиппинскими лоцманами.\n\nИмператорский диван должен решить, кто будет ездить по серебряной линии. Некоторые требуют имперской монополии: трон владеет каждым корпусом, оценивает каждый груз и платит серебро в единую казну. Другие требуют договора о свободной торговле: любой торговец, имеющий имперскую лицензию, может плавать, а сама торговля привлекает кантонский, тагальский и мексиканский капитал в Манилу." #NT!
 nd_mrl.7.a: "Управляйте линией галеонов как монополист империи." #NT!
 nd_mrl.7.b: "Откройте линию для всех торговцев, имеющих имперскую лицензию." #NT!
  
 nd_mrl.8.t: "Собирается Архипелагический совет" #NT!
 nd_mrl.8.d: "Высшие данные каждого региона, султан Сулу, раджа Майнилы, лакан Тондо, вожди горных народов Кордильер: все собираются в зале императорского совета.\n\nТеперь предстоит решить более глубокий вопрос о рассадке мест. Будет ли совет единственной палатой верховных данных, в которой каждый великий дом будет иметь один голос, а свободные люди будут представлены через своего господина? Или это будет единый парламент, в котором будут места также для избранных свободных делегатов от каждого региона, а тимава и махарлика будут сидеть рядом с раджами?" #NT!
 nd_mrl.8.a: "Совет первостепенных данных: заседают только великие дома" #NT!
 nd_mrl.8.b: "Единый парламент: места для свободных делегатов рядом с данными" #NT!
  
 nd_mrl.9.t: "Филиппинское Просвещение" #NT!
 nd_mrl.9.d: "В нашем мире Пропагандистское движение 1880-х годов, в котором участвовали Рисаль, Марсело дель Пилар, Грасиано Лопес Хаэна, было движением эмигрантов, писавших для газеты «Солидаридад» в Испании и тайно переправлявших свои работы обратно на колонизированную родину. При Махарлике пропагандисты работают из самой Манилы, при государственном патронаже и беспрепятственной прессе.\n\nИмперская канцелярия должна решить, каким должно быть просвещение. Покровительствуйте кружку иллюстрадо: придворной интеллигенции, пишущей на испанском языке для образованных пэров Мадрида и Парижа. Или покровительствуйте народному языку: брошюрам и хроникам на байбайне, тагальском и кебуанском языках для народа, деревенского священника, школьного учителя барангая. Голос империи будет тем или иным." #NT!
 nd_mrl.9.a: "Покровительствовать кругу иллюстрадо: придворная интеллигенция по-испански" #NT!
 nd_mrl.9.b: "Покровительствуйте родному языку: брошюры на байбайне и региональных языках" #NT!
  
  # ===== Advances ===== 
 nd_mrl_maharlika_code: "Кодекс Махарлики" #NT!
 nd_mrl_maharlika_code_desc: "Класс воинов-благородных свободных людей каждого филиппинского народа: магину Тондо, тимава Себу, багани Минданао. Один идеал, три имени. Государство кодифицирует их как свою гражданскую и военную основу." #NT!
 nd_mrl_datu_federation: "Федерация Дату" #NT!
 nd_mrl_datu_federation_desc: "Многоуровневые вождества под верховным раджей: коренной филиппинский образ правления. Тондо, Майнила, Пангасинан, Себу, Бутуан и Маймбунг как полуавтономные, взаимно лояльные лорды." #NT!
 nd_mrl_balangay_craft: "Мастерство Балангая" #NT!
 nd_mrl_balangay_craft_desc: "Дощатый корабль с выносными опорами, который связывал Лусон, Висайские острова и Минданао на протяжении пятнадцати столетий до Магеллана. Раскопанный балангай в Бутуане датируется одиннадцатым веком." #NT!
 nd_mrl_anitist_syncretism: "Анитистский синкретизм" #NT!
 nd_mrl_anitist_syncretism_desc: "Местный анимистический субстрат, который впитал и смягчил каждую волну индуистско-буддийского и исламского влияния, но никогда не был стерт. Бабайлан занимает свое место у деревенского очага." #NT!
 nd_mrl_pearl_and_gold: "Жемчужно-золотая экономика" #NT!
 nd_mrl_pearl_and_gold_desc: "Золото Суригао, жемчуг Сулу, ювелиры Бутуана, производящие киннари и золотую тару. Филиппинское богатство находилось здесь задолго до того, как испанские галеоны прибыли, чтобы перенаправить его." #NT!
 nd_mrl_baybayin_literacy: "Байбайнская грамотность" #NT!
 nd_mrl_baybayin_literacy_desc: "Филиппинская слоговая азбука, используемая для гражданской и личной переписки от Лусона до Висайских островов. В первой тагальской книге, напечатанной в 1593 году, использовался байбайн; при Махарлике это рука государства." #NT!
 nd_mrl_timawa_freemen: "Тимава Фримен" #NT!
 nd_mrl_timawa_freemen_desc: "Висайские свободные воины, сражавшиеся как равные своим данным. Предшественник современного идеала гражданина-солдата, возникший за два столетия до того, как Европа заново открыла эту концепцию." #NT!
 nd_mrl_caracoa_fleet: "Рейдовый флот Каракоа" #NT!
 nd_mrl_caracoa_fleet_desc: "Огромное висайское военное каноэ, вмещающее в корпус двести воинов. Ужас межостровной войны; в нашем мире совершали набеги на испанских энкомьенд даже на севере, вплоть до Камаринеса." #NT!
 nd_mrl_manila_trade: "Торговая сеть Манилы" #NT!
 nd_mrl_manila_trade_desc: "Тондо и Майнила как узлы торговой сети Бруней-Китай-Рюкю. Археологическими доказательствами служат фарфоровые клады Миндоро и тайники с китайскими монетами в Калатагане." #NT!
 nd_mrl_datu_council: "Управление государством Совета Дату" #NT!
 nd_mrl_datu_council_desc: "Формализованные собрания первостепенных данных как совещательные органы. Зародыш будущей конституционной империи." #NT!
 nd_mrl_three_faith_concord: "Согласие трех конфессий" #NT!
 nd_mrl_three_faith_concord_desc: "Анитизм, синкретический буддизм и суннитский ислам сосуществуют в соответствии с имперским законодательством. Бабайлан, монах, кади: каждый признан, но никто не имеет привилегий выше самой империи." #NT!
 nd_mrl_combined_fleet_doctrine: "Доктрина объединенного флота" #NT!
 nd_mrl_combined_fleet_doctrine_desc: "Военные корабли Балангая, разведчики Винта Латин, тяжелые рейдеры Каракоа и быстроходные корпуса Ланонга действовали как единый архипелажный флот. Каждая судостроительная традиция островов питает один флот." #NT!
 nd_mrl_bagani_code: "Кодекс воина Багани" #NT!
 nd_mrl_bagani_code_desc: "Каста воинов Минданао, проявившая себя во время рейда пангаяв: молодой человек заслужил титул багани только ратным подвигом. Их кодекс становится элитной военной доктриной империи." #NT!
 nd_mrl_datu_congress: "Конгресс Дату" #NT!
 nd_mrl_datu_congress_desc: "Периодические собрания всех верховных правителей, оформленные в конституционный орган, который разрешает споры между данными и связывает великие дома." #NT!
 nd_mrl_surigao_goldsmithing: "Ювелирное дело Суригао" #NT!
 nd_mrl_surigao_goldsmithing_desc: "Новое открытие традиции литья по выплавляемым моделям, в результате которой были созданы Агусанский образ и золотая тара Бутуана. Филиппинское священное металлическое изделие, датируемое десятым веком." #NT!
 nd_mrl_expulsion_doctrine: "Доктрина высылки" #NT!
 nd_mrl_expulsion_doctrine_desc: "Внешнеполитическая доктрина Махарлики: каждый высадившийся европейский флот встречает объединенное оружие всех архипелажных народов. Ни Себу, ни Манила, ни водопад Сулу." #NT!
 nd_mrl_military_academy: "Махарлика Военная академия" #NT!
 nd_mrl_military_academy_desc: "Формальное учреждение, которое превращает идеал свободного гражданина в обученный офицерский корпус, набранный из всех трех регионов. Магиноо, тимава и багани на одной и той же буровой площадке." #NT!
 nd_mrl_archipelago_marketplace: "Рынок Панархипелага" #NT!
 nd_mrl_archipelago_marketplace_desc: "Тондо, Себу, Бутуан и Маймбунг как интегрированные торговые узлы с поддерживаемыми государством мерами и весами. Империя становится одним рынком." #NT!
 nd_mrl_confluence_courts: "Суды слияния" #NT!
 nd_mrl_confluence_courts_desc: "Судебный орган, интегрирующий тагальский кодекс, шариат Сулу и обычное право Висай в единую правовую основу. Там, где сходятся три правовые традиции, решает имперский закон." #NT!
 nd_mrl_cordillera_to_sulu: "От Кордильер до Сулу" #NT!
 nd_mrl_cordillera_to_sulu_desc: "Горный Игорот, равнинный Тагалог и мореплаватель Таусуг объединились под одной гражданской идентичностью. Компактная Махарлика простирается от горных народов Кордильер до ловцов жемчуга Сулу." #NT!
 nd_mrl_manila_galleon: "Филиппинский Манильский галеон" #NT!
 nd_mrl_manila_galleon_desc: "Альтернативно-исторический снимок серебряного маршрута Акапулько-Манила. Филиппинские мореплаватели заменяют испанскую корону в качестве посредников по серебру Новой Испании, а транстихоокеанская торговля становится имперской монополией." #NT!
 nd_mrl_archipelagic_council: "Архипелагический совет" #NT!
 nd_mrl_archipelagic_council_desc: "Конституционная империя: верховный датус, султан Сулу, раджа Тондо, все связаны договором махарлика. У каждого народа есть место; каждое место привязано к престолу." #NT!
 nd_mrl_abaca_indigo_export: "Экспорт абаки и индиго" #NT!
 nd_mrl_abaca_indigo_export_desc: "Манильская конопля для мировых веревок, висайский индиго для международных рынков красителей. Промышленные товарные культуры империи находятся под монополией Махарлики." #NT!
 nd_mrl_fortified_pueblos: "Укрепленные пуэбло" #NT!
 nd_mrl_fortified_pueblos_desc: "Кольцо архипелажных городов с каменными стенами, готовых отразить любое иностранное вторжение от Вигана на севере до Замбоанги на юге. Филиппинский ответ испанскому президиуму." #NT!
 nd_mrl_unified_service: "Единая служба по вооружению" #NT!
 nd_mrl_unified_service_desc: "Формальное слияние свободных граждан тимава, багани Минданао и тагальского махарлика в одну имперскую армию, финансируемую из одной казны и обученную по единым стандартам." #NT!
 nd_mrl_filipino_enlightenment: "Филиппинское Просвещение" #NT!
 nd_mrl_filipino_enlightenment_desc: "Пропагандистское движение альтернативной истории реализовалось как поддерживаемый государством интеллектуальный расцвет. Ризал, Марсело дель Пилар и Грасиано Лопес Хаэна писали из Манилы под покровительством империи, а не из Мадрида в изгнании." #NT!
 nd_mrl_katipunan_spirit: "Катипунан Гражданский дух" #NT!
 nd_mrl_katipunan_spirit_desc: "Братство Бонифачо реализовалось как государственная идеология. Все граждане, все вероисповедания, все острова равны в соответствии с договором Махарлики и связаны взаимными обязательствами." #NT!
 nd_mrl_industrial_manila_bay: "Индустриальный Манильский залив" #NT!
 nd_mrl_industrial_manila_bay_desc: "Угольные станции, современные верфи, локомотивные заводы в Тондо и Сан-Фернандо: архипелаг становится промышленной осью Юго-Восточной Азии, которой историческим Филиппинам никогда не удавалось стать." #NT!
 nd_mrl_pacific_naval_doctrine: "Тихоокеанская военно-морская доктрина" #NT!
 nd_mrl_pacific_naval_doctrine_desc: "Современный филиппинский флот, выступающий от Себу до Гуама: местная тихоокеанская держава, которой Парижский договор никогда не позволял существовать." #NT!
 nd_mrl_bayanihan_compact: "Баянихан Компакт" #NT!
 nd_mrl_bayanihan_compact_desc: "Общинный труд и взаимопомощь как организующий принцип государства. Филиппинский гражданский ответ европейскому национальному государству: баянихан — это общественный договор империи." #NT!
  
  # ===== Variable tooltips ===== 
 nd_mrl_formed_tt: "Махарлика образована." #NT!
 nd_mrl_path_a_tt: "Путь Тагальского Суда Дату был выбран при формировании." #NT!
 nd_mrl_path_b_tt: "Путь Панфилиппинской федерации был выбран при формировании." #NT!
 nd_mrl_path_c_tt: "Путь Меча Махарлики был выбран при формировании." #NT!
  
  # ===== Units ===== 
 a_nd_mrl_maharlika_levy: "Махарлика Воины" #NT!
 a_nd_mrl_maharlika_levy_desc: "Тагальский класс воинов-дворян, выросший как классовая привилегия, а не как оплачиваемый полк. Носит оружие рядом с данными в совете и на войне." #NT!
 a_nd_mrl_timawa_levy: "Тимава Фримен" #NT!
 a_nd_mrl_timawa_levy_desc: "Висайские свободные люди с копьем банкау и щитом будиак. Мобильная легкая пехота, свобода которой зависит от ее готовности сражаться." #NT!
 a_nd_mrl_bagani: "Багани" #NT!
 a_nd_mrl_bagani_desc: "Элита воинов Минданао, ударные отряды с крисами, заслужившие свой титул в ходе рейда на Пангаяу. Элитное подразделение империи." #NT!
 a_nd_mrl_bagani_levy: "Багани Леви" #NT!
 a_nd_mrl_bagani_levy_desc: "Каста воинов багани, сформированная посредством системы набора, призывалась из солдатского класса каждого пуэбло Минданао." #NT!
 n_nd_mrl_balangay: "Балангай" #NT!
 n_nd_mrl_balangay_desc: "Дощатый корабль с выносной опорой, который пятнадцать веков ограничивал филиппинский архипелаг. Быстрый, с мелкой осадкой, способный пересекать открытый океан между островами." #NT!
 n_nd_mrl_balangay_levy: "Балангай Леви" #NT!
 n_nd_mrl_balangay_levy_desc: "Сообщество балангай, созданное каждым прибрежным пуэбло в рамках его имперского долга." #NT!
 n_nd_mrl_caracoa: "Каракоа" #NT!
 n_nd_mrl_caracoa_desc: "Огромное висайское военное каноэ с двойными опорами и латунным вооружением, вмещающее двести воинов на корпус. Ужас межостровной войны." #NT!
 n_nd_mrl_caracoa_levy: "Каракоа Леви" #NT!
 n_nd_mrl_caracoa_levy_desc: "Община каракоа, воспитанная классом бюргеров прибрежных висайских пуэбло с крестьянскими и рабочими бригадами." #NT!
 n_nd_mrl_lanong: "Ланонг" #NT!
 n_nd_mrl_lanong_desc: "Рейдовый корпус «Иранун-Таусуг», быстрый, с латунным вооружением, с установленными латунными лантаками. Легкий быстроходный род объединенного архипелажного флота." #NT!
 n_nd_mrl_filipino_galleon: "Филиппинский галеон" #NT!
 n_nd_mrl_filipino_galleon_desc: "Альтернативный исторический галеон «Манила»: построенный в Кавите филиппинскими корабелами, управляемый филиппинскими пилотами, перевозящий серебро империи через Тихий океан." #NT!
  
  # ===== Buildings ===== 
 nd_mrl_panday_workshop: "Мастерская Пандай" #NT!
 nd_mrl_panday_workshop_desc: "Традиции местных ювелиров и мастеров по металлу. Производители Суригао киннари, Бутуан тары, южного криса и бронзовой лантаки флота." #NT!
 nd_mrl_panday_goldsmithing: "Пандей Ювелирное дело" #NT!
 nd_mrl_panday_goldsmithing_desc: "Из золота и жемчуга, обработанного методом литья по выплавляемым моделям, изготавливаются подвески киннари, золотые иконы тары и фурнитура крис. Филиппинские украшения для двора и святыни." #NT!
 nd_mrl_baybayin_archive: "Архив Байбайна" #NT!
 nd_mrl_baybayin_archive_desc: "Хранилище рукописей из пальмовых листьев на местном филиппинском слоговом письме. Гражданская канцелярия империи, которая пишет сама себе на байбайне." #NT!
 nd_mrl_baybayin_archive_maintenance: "Байбайин Скрипторий" #NT!
 nd_mrl_baybayin_archive_maintenance_desc: "Писцы копируют указы, судебные протоколы и литургические тексты на пальмовые листья и бамбук круглым петлевым шрифтом островов." #NT!
 nd_mrl_pantalan: "Панталан" #NT!
 nd_mrl_pantalan_desc: "Огромный тагальский портовый комплекс, где брунейские джонки, торговцы Рюкю и китайские шелковоносцы встречались на рынке Тондо в устье Пасига." #NT!
 nd_mrl_pantalan_brokerage: "Панталан Брокерская компания" #NT!
 nd_mrl_pantalan_brokerage_desc: "Прибрежные торговцы посредничают в посредничестве керамики, жемчуга и веревок из абаки между торговыми народами архипелага и иностранными торговцами." #NT!
 nd_mrl_ginto_foundry: "Гинто Литейный завод" #NT!
 nd_mrl_ginto_foundry_desc: "Цех литья по выплавляемым моделям, производящий великие золотые изображения: изображение Агусан, тара Суригао, киннари Бутуан. Филиппинское священное металлическое изделие имперского масштаба." #NT!
 nd_mrl_ginto_casting: "Гинто Кастинг" #NT!
 nd_mrl_ginto_casting_desc: "Золотое литье по выплавляемым моделям в имперском масштабе: Агусанское изображение, Суригао тара, Бутуан киннари. Производит украшения в соответствии с высочайшими священными филиппинскими традициями." #NT!
 nd_mrl_maharlika_academy: "Махарлика Военная академия" #NT!
 nd_mrl_maharlika_academy_desc: "Формальное учреждение, превращающее идеал свободного человека в обученный офицерский корпус. Магиноо, тимава и багани на одной и той же буровой площадке, под одним имперским стандартом." #NT!
 nd_mrl_academy_drill: "Академия дрилл" #NT!
 nd_mrl_academy_drill_desc: "Комбинированное упражнение всех трех филиппинских воинских традиций, преподанное на основе императорских руководств." #NT!
 nd_mrl_palengke_aguinaldo: "Паленгке Агинальдо" #NT!
 nd_mrl_palengke_aguinaldo_desc: "Большой панархипелажный рынок, где весы и меры стандартизированы в Тондо, Себу, Бутуане и Маймбунге. Империя становится одним рынком." #NT!
 nd_mrl_palengke_brokerage: "Брокерская компания Паленгке" #NT!
 nd_mrl_palengke_brokerage_desc: "Торговцы на имперском рынке рисом, волокном абаки и жемчугом Сулу по стандартизированным мерам и весам." #NT!
 nd_mrl_pueblo_kuta: "Пуэбло Кута" #NT!
 nd_mrl_pueblo_kuta_desc: "Укреплённое пуэбло: кольцо архипелажных городов с каменными стенами. Филиппинский внутренний ответ испанскому президиуму, построенному филиппинцами на филиппинской земле." #NT!
 nd_mrl_pueblo_garrison: "Пуэбло Гарнизон" #NT!
 nd_mrl_pueblo_garrison_desc: "Учения укрепленного гарнизона пуэбло: свободные жители тимава и офицеры махарлики, готовые отразить любую иностранную высадку." #NT!
  
 nd_mrl_babaylan_hall: "Бабайлан Холл" #NT!
 nd_mrl_babaylan_hall_desc: "Признанный государством зал бабайлан и каталонан: жриц-духов-медиумов местной филиппинской традиции. Дом анитизма в империи." #NT!
 nd_mrl_babaylan_rites: "Бабайланские обряды" #NT!
 nd_mrl_babaylan_rites_desc: "Церемониальные подношения, курение и плетеные молитвы в соответствии с местной филиппинской духовной традицией." #NT!
  # ===== Levies ===== 
 levy_nd_mrl_maharlika_warriors: "Махарлика Воин Леви" #NT!
 levy_nd_mrl_maharlika_warriors_desc: "Тагальский класс воинов-дворян взимался в качестве налогового обязательства. Солдаты и крестьяне традиции махарлика отвечают на призыв своего дату." #NT!
 levy_nd_mrl_timawa_freemen: "Тимава Фриман Леви" #NT!
 levy_nd_mrl_timawa_freemen_desc: "Висайский солдатский набор граждан. Каждый свободный человек солдатского или крестьянского класса обязан присягой собраться по призыву своего дату." #NT!
 levy_nd_mrl_bagani: "Багани Леви" #NT!
 levy_nd_mrl_bagani_levy_desc: "Набор касты воинов Минданао. Набранные исключительно из класса солдат, допускаются только те, кто прошел проверку в рейде Пангаяу." #NT!
 levy_nd_mrl_caracoa: "Каракоа Леви" #NT!
 levy_nd_mrl_caracoa_desc: "Висайский набор военных каноэ. Сообщества прибрежных бюргеров выращивают шелуху каракоа; крестьяне и батраки деревни служат гребцами-воинами." #NT!
  
  # ===== Destiny Advances ===== 
 nd_mrl_destiny: "Махарликский договор" #NT!
 nd_mrl_destiny_desc: "Империя стоит. От Апарри до Маймбунга действует договор Махарлики. Трон теперь решает, какой империей ему стать; выбор, сделанный при формировании, теперь расцветает в национальную судьбу. Стабильность выше 75 сохраняет компактность." #NT!
 nd_mrl_dest_compact_endures: "Компакт выстоит" #NT!
 nd_mrl_dest_compact_endures_desc: "Институционализировать Панфилиппинскую федерацию. Примите легализм, поднимите уровень развития империи до 1500 и докажите, что тринадцать народов могут управлять собой в рамках единого юридического договора." #NT!
 nd_mrl_dest_concord_codex: "Кодекс трёх вер" #NT!
 nd_mrl_dest_concord_codex_desc: "Закрепить согласие бабайлана, кади и монахов в рамках институтов банковской эпохи. Развивайте банковское дело, держите 2000 развития и 2000 золота и обеспечьте торговлю жемчугом на наших рынках. Империя становится морским космополисом." #NT!
 nd_mrl_dest_bayanihan_empire: "Империя Баянихан" #NT!
 nd_mrl_dest_bayanihan_empire_desc: "Конституционный архипелаг на вершине. Примите глобальную торговлю, достигните 2500 развития и 3000 золота, удерживайте стабильность на уровне 75. Собирается совет Бахай-Балангай; Империя становится гражданским стандартом Юго-Восточной Азии. Открывает доступ к столичному совету Бахай-Балангай." #NT!
 nd_mrl_dest_kris_unsheathed: "Крис обнаженный" #NT!
 nd_mrl_dest_kris_unsheathed_desc: "Выведите войну за пределы островов. Держите Беруне (Бруней) и Сандакан (север Борнео); собрать 30 полков. Меч Махарлика пересекает море." #NT!
 nd_mrl_dest_lanong_ascendancy: "Возвышение Ланонг" #NT!
 nd_mrl_dest_lanong_ascendancy_desc: "Овладейте морем Сулу и захватите Арку Пряностей. Держите Тернате, Тидоре и Манадо; собрать 50 полков и 50 престижа. Ни один европейский флот не заходит во внутренние воды империи." #NT!
 nd_mrl_dest_kalayaan_pacific: "Калаяан в Тихом океане" #NT!
 nd_mrl_dest_kalayaan_pacific_desc: "Проект от Сакишимы до островов специй. Держите Тамсуи, Миякодзиму и Джайлоло; выставить 75 полков, 3000 золота и стабильность выше 75. Филиппинский флот становится тихоокеанской державой. Открывает Адмиралтейство Куты." #NT!
  
  # ===== Destiny Events ===== 
 nd_mrl.10.t: "Компактные положения" #NT!
 nd_mrl.10.d: "Слухи доходят до каждого дату и каждого деревенского пуэбло: империя стоит. Мать-тагалог в Тондо, искатель жемчуга Таусуг в Маймбунге, строитель рисовых террас Ифугао в Банауэ: все слышат одно и то же имперское воззвание. Отсюда путь, выбранный при формировании, расцветет в национальную судьбу, написанную на протяжении веков." #NT!
 nd_mrl.10.a: "Итак, вперед, под знамена махарлика." #NT!
  
 nd_mrl.11.t: "Федерация стала постоянной" #NT!
 nd_mrl.11.d: "Создание Пан-Филиппинской федерации больше не является сделкой: это основа королевства.\n\nИмперская канцелярия сейчас обсуждает, как ее закрепить. Закрепить договор в имперском законе байбайн, зачитав указы вслух на каждом совете и на каждом рынке: федерация приняла статут. Или закрепить его в культурной идентичности, федерации общих фестивалей, общих песен, общих предков, к которым обращаются на каждом лакаране, федерации, ставшей традицией." #NT!
 nd_mrl.11.a: "Кодифицируйте договор в имперском законе Байбайна." #NT!
 nd_mrl.11.b: "Закрепите договор на общей культуре и происхождении" #NT!
  
 nd_mrl.12.t: "Кодекс трёх вер" #NT!
 nd_mrl.12.d: "Бабайлан, кади и монах встречаются в одной комнате и создают кодекс согласия, переплетенный пальмовыми листьями и серебром. Банки империи теперь кредитуют людей разных конфессий. Суд должен выбрать, как публиковать: как канцелярский документ или как народный текст в каждой деревне." #NT!
 nd_mrl.12.a: "Канцелярский кодекс, запечатанный тремя служителями церкви." #NT!
 nd_mrl.12.b: "Народный кодекс, читаемый вслух в каждом пуэбло." #NT!
  
 nd_mrl.13.t: "Собирается Империя Баянихан" #NT!
 nd_mrl.13.d: "В столице возвышается зал совета Бахай-Балангай, обшитый досками, как большой путешествующий корабль, который дал империи ее первую метафору. Каждый народ, каждая вера, каждый дата, горожанин и делегат духовенства находятся под одной крышей. «Махарлика Компакт» — это гражданский стандарт Юго-Восточной Азии. Суд выбирает свой характер: конституционное согласие великих домов или публицистическое государство, говорящее с миром?" #NT!
 nd_mrl.13.a: "Архипелажное согласие домов." #NT!
 nd_mrl.13.b: "Солидарное государство, публикующее материалы для всего мира." #NT!
  
 nd_mrl.14.t: "Крис пересекает море" #NT!
 nd_mrl.14.d: "Багани Котабато и Иранун Ланао несут имперское знамя через море Сулу. Берун падает; Сандакан отвечает. Первые зарубежные побережья преклоняют колени перед договором Махарлики. Доктрина доказана: меч империи простирается над водой.\n\nИмператорский диван должен решить, что будет дальше. Продолжайте наступление через Сулавеси на Молуккские острова, где испанские, голландские и тидоранские корабли оспаривают специи. Или сделайте багани ополчением империи, сначала обеспечив безопасность архипелага, а завоевание иностранных побережий произойдет позже." #NT!
 nd_mrl.14.a: "Продолжайте наступление: вперед на Сулавеси и Молуккские острова." #NT!
 nd_mrl.14.b: "Держите багани в качестве ополчения: сначала защитите архипелаг." #NT!
  
 nd_mrl.15.t: "Возвышение Ланонга" #NT!
 nd_mrl.15.d: "Тернате и Тидоре, легендарные гвоздичные острова, попадают под знамя империи. Манадо на оконечности Сулавеси взят. Море Сулу, море Банда, Целебес: все это внутренние воды. Адмиралтейству предстоит выбрать: доктрину рейдовой чести пангаяу, записанную в тяжелых полках, или доктрину латунных эскадрилий лантак, выступающих из каждой прибрежной куты?" #NT!
 nd_mrl.15.a: "Доктрина пангаяу: рейдовая честь как государственный идеал." #NT!
 nd_mrl.15.b: "Эскадры Лантаки: медные пушки на каждом берегу." #NT!
  
 nd_mrl.16.t: "Калаяан от Сакишимы до Джайлоло" #NT!
 nd_mrl.16.d: "Тамсуи на Тайване, Миякодзима в цепи Сакишима, Джайлоло на Хальмахере: знамя империи теперь реет над Тихим океаном. Меч Махарлики простирается дальше, чем любое коренное государство в истории этих морей. Суд выбирает свою окончательную доктрину: войну островов, в которой каждый европейский флот будет истреблен; или Калайское адмиралтейство, проецирующее филиппинскую мощь как тихоокеанский стандарт." #NT!
 nd_mrl.16.a: "Война островов: ни один иностранный корпус не останется нетронутым." #NT!
 nd_mrl.16.b: "Калайское адмиралтейство: Тихий океан принадлежит нам по праву." #NT!
  
  # ===== Destiny Timed Modifiers ===== 
 STATIC_MODIFIER_NAME_nd_mrl_dest_three_chanceries: "Три Канцелярии" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_three_chanceries: "Архив бабайлана, шариатское управление Сулу и придворная канцелярия Тондо действуют как три равноправных органа имперского государства. Указы содержат перекрестные ссылки на все три; иностранные посольства направлены во все три." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_baybayin_universal: "Байбайин Универсал" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_baybayin_universal: "В каждой приходской школе преподают байбайн наряду с местным письмом. Горожане ведут бухгалтерские книги в виде круговых символов от Апарри до Маймбунга; База прямых налогов короны сокращается, поскольку бухгалтеры по недвижимости получают частную руку." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_archipelagic_concord: "Архипелаг Согласия" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_archipelagic_concord: "Paramount datus, султан Сулу, раджа Тондо и избранные представители горожан заседают в совете Бахай-Балангай. Каждый народ имеет конституционный голос; империя строится в имперском масштабе." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_solidaridad_state: "Солидаридад Государство" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_solidaridad_state: "Империя издает для всего мира: «Солидаридад» в Маниле, филиппинское просвещение как имперский экспорт. Империя ведет свои войны в печати; Иностранная аннексия становится все дороже по мере увеличения числа имперских союзников." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_pangayaw_doctrine: "Доктрина Пангаяу" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_pangayaw_doctrine: "Традиция рейдов Минданао была систематизирована в тяжелую имперскую доктрину. Офицеры Багани заслужили свое командование ратными подвигами; бюрократы рекрутируются путем военной демонстрации. Суд теряет культурное изящество по мере того, как точит свой меч." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_lantaka_squadrons: "Лантакаские эскадрильи" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_lantaka_squadrons: "Латунные пушки лантака на каждой куте и на борту каждого ланонга, отлитые в архипелажных литейных мастерских из меди Сулу. Торговые пути защищены; Граница империи — зубы." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_war_of_the_isles: "Война островов" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_war_of_the_isles: "Каждое побережье — это гарнизон; каждый гарнизон является базой флота. Империя вкладывает свои сокровища в корабли и моряков; дворянские сословия ощущают напряжение постоянной мобилизации." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_kalayaan_admiralty: "Калаяанское Адмиралтейство" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_kalayaan_admiralty: "Адмиралтейская сеть Себу-Кавите-Сулу простирается от Сакишимы до Джайлоло. Оборонительная доктрина стала имперской; логистика и продовольственные мощности делают филиппинский флот устойчивым в Тихом океане." #NT!
  
  # ===== Destiny Buildings ===== 
 nd_mrl_dest_bahay_balangay: "Бахай-Балангай" #NT!
 nd_mrl_dest_bahay_balangay_desc: "Зал конституционного совета Империи Баянихан, обшитый досками, как огромный странствующий корабль, давший империи ее первую метафору. Каждый народ, каждая вера, каждый дата, горожанин и делегат духовенства находятся под одной крышей." #NT!
 nd_mrl_dest_balangay_council: "Совет Балангая" #NT!
 nd_mrl_dest_balangay_council_desc: "Заседает конституционный совет, указы которого копируются на байбайне, испанском и джави для распространения в каждом зале данных." #NT!
 nd_mrl_dest_kuta_admiralty: "Кутинское Адмиралтейство" #NT!
 nd_mrl_dest_kuta_admiralty_desc: "Укрепленный штаб Тихоокеанского военно-морского флота, кута с каменными стенами, увенчанная медными лантаками и эллингами ланонг. Филиппинский ответ колониальному адмиралтейству: построен в Кавите и простирается от Себу до Гуама." #NT!
 nd_mrl_dest_admiralty_drill: "Адмиралтейские учения" #NT!
 nd_mrl_dest_admiralty_drill_desc: "Совместные учения флота, артиллерийские учения в Ланонге и систематизированная тихоокеанская военно-морская доктрина, преподанная в имперских руководствах." #NT!
  
  # ===== BUREAUCRACIES ===== 
 mrl_datu_court_bureaucracy: "Дату Суд Махарлики" #NT!
 mrl_datu_court_bureaucracy_desc: "Кодификация тагальского и висайского кодекса воинов-дворян, который отличал магину, махарлику и тимаву от общности алипинов. Задокументировано Пласенсией и Лоаркой в ​​1580-х годах, махарлики носили оружие в обмен на освобождение от налогов на унаследованную землю. Как имперский институт, Суд Махарлики ратифицирует феодальные владения во всех тринадцати филиппинских культурах и стандартизирует культ воинов багани-баяни в единую наследственную служебную знать." #NT!
 mrl_ruma_bichara_bureaucracy: "Рума Бичара" #NT!
 mrl_ruma_bichara_bureaucracy_desc: "Совещательный совет из пятнадцати дат, который исторически управлял Султанатом Сулу вместе со своим султаном, с параллельным Бичара Атасом в Магинданао. Состоящий из раджа муда, адмирала ладжа лаут, казначея бандахалы и других портфелей данных, совет избирал наследников и связывал королевство консенсусом. Принятая в качестве верхней палаты Махарлики, Рума Бичара сдерживает амбиции короны федеративным голосом данных." #NT!
 mrl_three_faith_concord_bureaucracy: "Согласие трех конфессий" #NT!
 mrl_three_faith_concord_bureaucracy_desc: "Поселение Пагсасаниб: жрицы-анитистки-бабайланы Лусона и Висайских островов, мусульманские пандиты султанатов Сулу и Магинданао и буддийские монахи, унаследованные от государств Бутуан и Тондо, - все они одновременно имеют формальный придворный сан. Ни одно доколониальное филиппинское царство еще не кодифицировало эту матрицу, но синкретическое приспособление практиковалось с 13 по 16 века, прежде чем колониальная христианизация закрыла его. Империя формализует то, что барангаи уже знали." #NT!
 mrl_baybayin_chancellery_bureaucracy: "Канцелярия Байбайна" #NT!
 mrl_baybayin_chancellery_bureaucracy_desc: "В 1604 году Педро Чирино поразился тому, что почти каждый тагалог умеет читать и писать своим родным письмом. Сохранившиеся земельные документы байбайна 17-го века в Университете Санто-Томас свидетельствуют об административном использовании; доколониальные писцы подписывали контракты, записывали дань и записывали храмовые обряды брахмическим алфавитом. Канцелярия централизует клерков байбаинов, джави и кави в одном бюро, заменяя устную традицию тайного советника атубанг са дату письменной записью." #NT!
 mrl_lanong_admiralty_bureaucracy: "Адмиралтейство Ланонг" #NT!
 mrl_lanong_admiralty_bureaucracy_desc: "Доктрина объединенного флота объединяет военный корабль «Висайский каракоа», плавучий корпус «Бутуан-Тондо-балангай», рейдовую галеру «Сулу-Иранун-Ланонг» и выносную опору «Винта» Минданао-Сулу в одно имперское военно-морское учреждение. Каракоа были политическим инструментом архипелага XVI века: те, у кого они были, доминировали над теми, у кого их не было. Адмиралтейство унаследовало экономику сезонных рейдов мангаяу и превратило ее в Тихоокеанскую проекцию." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_mrl_bureaucracy_authority: "Бюрократическая власть Махарлики" #NT!
 AUTO_MODIFIER_DESC_nd_mrl_bureaucracy_authority: "После провозглашения Махарлики империя унаследовала институциональный репертуар каждого барангая, султаната и раджаната, которые она теперь включает. В короне может находиться историческая бюрократия." #NT!
  
 # === POLISH PASS: NEW MODIFIER LOC === 
 STATIC_MODIFIER_NAME_nd_mrl_lanong_vanguard: "Ланонг Авангард" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_lanong_vanguard: "Эскадра быстрого нападения «Ланонг» — это первый ответ империи на любой колониальный галеон, пересекающий архипелаг. С латеновым вооружением, на веслах в спокойной воде, с вооружением лантака, обученным перехватывать и подниматься на абордаж до того, как сможет сформироваться боевая линия." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_galleon_free_trade: "Манильский договор о свободной торговле" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_galleon_free_trade: "Любой торговец, имеющий имперскую лицензию, может плавать по транс-Тихоокеанскому маршруту. Кантонские шелковые дома, тагальские торговцы золотом, мексиканские серебряные синдикаты — все сходятся в Маниле под одним набором мер и весов. Империя облагает налогом поток, а не владеет грузом." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_unified_parliament: "Единый парламент Махарлики" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_unified_parliament: "Избранные делегаты свободных граждан (тимава, махарлика, городские горожане) сидят рядом с высшими данными. Голос империи больше не принадлежит только великим домам; договор Махарлики имеет свою конституционную палату." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_vernacular_populist: "Народное Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_vernacular_populist: "Брошюры и хроники текут на байбайне, тагальском, кебуанском и хилигайнонском языках. Школьный учитель барангая читает их на базарном посту; у них проповедует деревенский священник; Просвещение империи достигает людей, не проходя сначала через Мадрид." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_codified: "Компакт в законе Байбайна" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_codified: "Пан-Филиппинская федерация учреждается на байбайне и испанском языке, указ за указом, договор за договором, ратифицированная всеми высшими советами. Договор теперь стал имперским законом со статутом, прецедентом и канцелярией, обеспечивающей соблюдение того и другого." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_cultural: "Компакт в общей культуре" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_cultural: "Пан-Филиппинская федерация закреплена не в уставе, а в общих фестивалях, общих песнях и общих предках, к которым обращаются в каждом лакаране. Компакт живет в обычаях: труднее кодифицировать, еще труднее нарушить." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_offensive: "Крис через море Сулу" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_offensive: "Полки багани маршируют по воде. От Беруна до Сандакана, от Манадо до Тернате: каждое зарубежное побережье в пределах досягаемости имперской винты становится спорной территорией. Империя выбирает расширение." #NT!
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_homeguard: "Крис из ополчения" #NT!
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_homeguard: "Багани содержатся в своих родных полках и готовятся к обнаружению любого колониального флота, который осмелится проникнуть на архипелаг. Иностранная экспансия ждет; безопасность архипелага стоит на первом месте. Империя выбирает оборону." #NT!
