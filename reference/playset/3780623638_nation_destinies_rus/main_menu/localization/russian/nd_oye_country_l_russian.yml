 OYE: "Империя Ойо" #NT!
 OYE_ADJ: "Ойо" #NT!
 OYE_f: "Империя Ойо" #NT!
 OYE_f_desc: "Империя Ойо была самым могущественным государством йоруба и одной из крупнейших империй в Западной Африке, известной своими грозными кавалерийскими корпусами и сложным конституционным правительством, уравновешивающим власть алаафинов с советом Ойо Меси. Объединив сердце йоруба под руководством Ойо-Иле, эта империя доминировала на торговых путях между зонами леса и саванны с пятнадцатого по начало девятнадцатого веков." #NT!
