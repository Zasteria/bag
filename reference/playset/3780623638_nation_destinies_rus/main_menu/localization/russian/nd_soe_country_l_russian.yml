 SOE: "Империя Сонгай" #NT!
 SOE_ADJ: "Сонгай" #NT!
 SOE_f: "Империя Сонгай" #NT!
 SOE_f_desc: "Империя Сонгай была крупнейшим государством в истории Африки, господствовавшим над Нигерской излучиной и транссахарскими торговыми путями из своей столицы Гао. При Сонни Али и Аскии Мухаммеде империя поглотила остатки Мали, контролировала легендарные города Тимбукту и Дженне и стала центром исламской науки. Восстановление этой империи означает еще раз объединение Сахеля под властью Сонхая." #NT!
