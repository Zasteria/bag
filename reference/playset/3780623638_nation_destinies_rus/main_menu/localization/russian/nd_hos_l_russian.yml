l_russian:
 nd_hos_formed_tt: "Орден Святого Иоанна был воссоздан." #NT!
 nd_hos_path_a_tt: "Выберите судьбу #bold Ордена Крестоносцев#!." #NT!
 nd_hos_path_b_tt: "Выберите судьбу #bold Царства Госпитальеров#!." #NT!
 STATIC_MODIFIER_NAME_nd_hos_crusading_order: "Орден крестоносцев" #NT!
 STATIC_MODIFIER_DESC_nd_hos_crusading_order: "Орден остается воинствующим братством. Каждый брат-рыцарь на войне носит восьмиконечный крест. Галеры патрулируют морские пути против корсаров Алжира и Триполи, а дисциплина Конвента — это дисциплина священной войны." #NT!
 STATIC_MODIFIER_NAME_nd_hos_hospitalier_realm: "Царство гостеприимцев" #NT!
 STATIC_MODIFIER_DESC_nd_hos_hospitalier_realm: "Орден управляет суверенным средиземноморским государством. Мальтийские гавани полны призов корсо и кораблей паломников. Сакра Инфермерия привлекает больных половины континента. Восемь языков встречаются на совете, и приказы Конвента распространяются настолько далеко, насколько могут плыть его галеры." #NT!
 nd_hos.1.t: "Монастырь Восьмиконечного Креста" #NT!
 nd_hos.1.d: "Суверенный Орден Больницы Святого Иоанна Иерусалимского возобновил свою деятельность. Братья, потерявшие Акру, изгнанные с Родоса, увидевшие, как языки разбросаны по католической Европе: они снова подняли белый крест над стенами гавани.\n\nВопрос в том, каким будет Орден. Некоторые из языков утверждают, что ничего не изменилось: братья приняли монашеский постриг для борьбы с неверными, а галеры должны плыть до тех пор, пока Средиземное море не станет христианским. Другие видят другой Орден: самостоятельный суверен, владыка средиземноморского островного государства, более гостеприимный по отношению ко всему христианскому миру, черпающий богатство из корсо и заботу из Сакра Инфермерия. Монастырь должен выбрать своего персонажа.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_hos.1.a: "Мы — меч христианского мира. Галеры никогда не отдыхают" #NT!
 nd_hos.1.b: "Мы островное царство. Больница, гавань и совет ведут нас" #NT!
 STATIC_MODIFIER_NAME_nd_hos_galley_squadron: "Галерная эскадра Ордена" #NT!
 STATIC_MODIFIER_DESC_nd_hos_galley_squadron: "Галеры Конвента плавают дисциплинированными эскадрами под командованием генерал-капитана. Рыцарские офицеры и мальтийские экипажи отрабатывали тактику абордажа; на каждом носу изображен восьмиконечный крест." #NT!
 nd_hos.2.t: "Эскадрилья Ордена" #NT!
 nd_hos.2.d: "Три галеры: стройная боевая галера госпитальеров с нависающим шпором, длинные весла, которыми управляют свободные мальтийские гребцы, и резная корма с белым крестом Святого Иоанна. Из бухты Биргу эскадра Конвента под командованием генерал-капитана выходит мимо Святого Эльма, мимо Гозо в открытое море, где курсируют османские и алжирские корабли.\n\nНачиная с периода Родоса и вплоть до эпохи Ромегаса галеры Ордена заслужили репутацию, с которой не мог сравниться ни один другой средиземноморский флот. Им не нужны были цифры; им нужна была смелость. Капитаны-госпитальеры охотились за добычей на Берберийском побережье, совершали набеги на Эгейское море и перенесли войну в Османское озеро. Эскадрон был небольшим. Его репутация была огромной." #NT!
 nd_hos.2.a: "Капитан-генерал, эскадрилья ваша" #NT!
 STATIC_MODIFIER_NAME_nd_hos_council_of_langues: "Совет языков" #NT!
 STATIC_MODIFIER_DESC_nd_hos_council_of_langues: "Восемь языков совещаются на Священном Совете. Прованс, Овернь, Франция, Италия, Арагон, Кастилия, Германия, Англия: каждый язык посылает своего Пилиера, а Орден управляется многонациональной конфедерацией." #NT!
 STATIC_MODIFIER_NAME_nd_hos_grand_master_supremacy: "Превосходство Великого Магистра" #NT!
 STATIC_MODIFIER_DESC_nd_hos_grand_master_supremacy: "Великий Магистр правит как суверенный принц. Священный Совет советует, но решает Магистральный Дворец. Языки служат по усмотрению Мастера, а устав Ордена един." #NT!
 nd_hos.3.t: "Восемь языков" #NT!
 nd_hos.3.d: "У каждого языка есть свой постоялый двор: длинное каменное общежитие, где его братья квартируют, обедают и ведут административные дела под своим пильером. От Оберж де Кастиль на холмах Валлетты до Оберж д'Овернь у кварталов Форни восемь языков разделяют работу монастыря.\n\nПрованс занимает должность Великого Командующего. Франция удерживает госпитальера больных. Италия удерживает Адмирала. Кастилия удерживает канцлера. Арагон, Овернь, Германия и Англия по очереди исполняют свои роли. Это система, не имеющая прецедентов в католической Европе: многонациональный федеральный религиозно-военный порядок. Но у системы есть свои ограничения. Должен ли Мастер править абсолютно или же языки должны уравновешивать его?" #NT!
 nd_hos.3.a: "Пусть управляет Священный Совет. Языки - это порядок" #NT!
 nd_hos.3.b: "Великий Магистр суверенен. Одна голова, один орден" #NT!
 STATIC_MODIFIER_NAME_nd_hos_silver_plate_medicine: "Серебряная пластина Медицина" #NT!
 STATIC_MODIFIER_DESC_nd_hos_silver_plate_medicine: "Пациентов в Sacra Infermeria обслуживают на серебряной тарелке, чтобы предотвратить распространение инфекции. Раны замазывают медом. Палаты разделены по заболеваниям. Гигиена Ордена на несколько поколений опережает свое время." #NT!
 STATIC_MODIFIER_NAME_nd_hos_school_of_anatomy: "Школа анатомии" #NT!
 STATIC_MODIFIER_DESC_nd_hos_school_of_anatomy: "В Сакра Инфермерия открылась школа анатомии, хирургии и фармации. Врачи приезжают со всей католической Европы, чтобы научиться современному искусству врачевания в подопечных Ордена." #NT!
 nd_hos.4.t: "Сакра Инфермерия" #NT!
 nd_hos.4.d: "Церковь Сакра Инфермерия, построенная в 1574 году вдоль стен гавани Валлетты, является крупнейшей больницей в христианском мире. Его огромная палата (длиной более 150 шагов) вмещает 900 пациентов на койках, расположенных вдоль обеих стен под огромным открытым сводом. Братья Ордена лично лечат больных; это основополагающая миссия Ордена, более древняя, чем война с неверными.\n\nНововведения удивляют посетителей. Пациенты едят с серебряной тарелки, потому что серебро подавляет любые невидимые миазмы, несущие болезнь. Раны замазывают медом. Каждая палата отведена для одного типа болезни, разделяя заразу. К семнадцатому веку Инфермерия стала самой передовой больницей в Европе, и врачи приезжали из Парижа, Болоньи, Саламанки и Вены, чтобы изучить ее практику.\n\nОрден должен решить, куда инвестировать. Должны ли палаты расширять современную гигиеническую практику или Инфермерия должна стать школой, где готовят врачей?" #NT!
 nd_hos.4.a: "Серебряные тарелки и медовые приправы. Обереги священны" #NT!
 nd_hos.4.b: "Нашел школу анатомии. Обучайте врачей христианского мира" #NT!
 STATIC_MODIFIER_NAME_nd_hos_licensed_corso: "Лицензированный Корсо" #NT!
 STATIC_MODIFIER_DESC_nd_hos_licensed_corso: "Tribunale degli Armamenti выдает награды капитанам-корсарам под флагом Ордена. Призовые доходы регулируются, Великий Магистр забирает свою долю, а мальтийские гавани заполняются трофейным грузом." #NT!
 STATIC_MODIFIER_NAME_nd_hos_unlicensed_corso: "Нелицензированный Корсо" #NT!
 STATIC_MODIFIER_DESC_nd_hos_unlicensed_corso: "Решение Трибунала игнорируется. Мальтийские гавани быстрее заполняются захваченными грузами, и казна монастыря разрастается, но греческие и венецианские торговые дома выражают яростные протесты во всех католических судах. Имя Ордена запятнано по всему христианскому миру." #NT!
 nd_hos.5.t: "Трибунале дельи Армаменти" #NT!
 nd_hos.5.d: "В 1605 году Великий Магистр учреждает трибунал из пяти комиссаров (Tribunale degli Armamenti) для наведения порядка на корсо. Каперы, действующие в мальтийских гаванях, теперь должны иметь лицензию трибунала, плавать под флагом Ордена, нападать только на мусульманские суда и уважать пропуска, выданные христианскими князьями.\n\nКорсо превращается из неформального рейда в регулируемую военную торговлю. Призовые грузы осуждаются трибуналом, пленники выкупаются, а казна Ордена получает определенную долю. Капитаны из Прованса, Сицилии, Каталонии и самой Мальты плавают по поручению госпитальеров.\n\nНо Священный Совет разделен. Более богатые капитаны выступают против ограничений трибунала: греческий корабль, перевозящий османские грузы, венецианский галеас, выполняющий блокаду с алеппинским шелком, рагузский торговец, снабжающий Блистательную Порту, — все это должно быть справедливым призом, независимо от безопасности в их шкафчиках. Пусть патенты выходят без ограничений, говорят они, и хранилища монастыря заполнятся вдвое быстрее. Латинские канцлеры предупреждают, чего будет стоить такая политика в гаванях христианского мира." #NT!
 nd_hos.5.a: "Выдавайте патенты. Корсо регулируется" #NT!
 nd_hos.5.b: "Лишите патентов. Каждый груз, касающийся неверных, является справедливой наградой." #NT!
 STATIC_MODIFIER_NAME_nd_hos_bulwark_of_christendom: "Оплот христианского мира" #NT!
 STATIC_MODIFIER_DESC_nd_hos_bulwark_of_christendom: "Бастионы Ордена служат южной стеной христианского мира. Гарнизон ежедневно учится, редуты снабжаются, а монастырь подтвердил перед всей католической Европой, что крест госпитальеров не сдастся." #NT!
 STATIC_MODIFIER_NAME_nd_hos_engineers_of_the_trace: "Инженеры Следа" #NT!
 STATIC_MODIFIER_DESC_nd_hos_engineers_of_the_trace: "Орден институционализировал военную инженерию. Итальянские следопыты, мальтийские каменщики и рыцари-офицеры тренируются вместе. Бастионы Валлетты стали школой фортификации всей католической Европы." #NT!
 nd_hos.6.t: "Крепость Бастионов" #NT!
 nd_hos.6.d: "Великая осада 1565 года длилась четыре месяца. Шестьсот рыцарей и шесть тысяч латников противостояли сорока тысячам османских войск под командованием Мустафы-паши и Пиали. Форт Сен-Эльмо ​​пал после тридцати одного дня бомбардировок. Форт Сен-Анджело не пал. Сенглеа не пал. Ла Валетт отказывался от всех переговоров и сражался со стен рядом со своими братьями.\n\nОсада была снята в сентябре. Османская армия отступила, разбитая. Орден выжил, как и католическая средиземноморская Европа. В последующие годы мальтийские укрепления были удвоены: итальянский инженер Франческо Лапарелли спланировал город Валлетту как укрепленный полуостров. Итальянский след, отточенный на мальтийской скале, стал школой военной инженерии, изучаемой по всей католической Европе.\n\nОрден должен решить, как использовать эту репутацию: как оплот для защиты или как школу для обучения." #NT!
 nd_hos.6.a: "Мы — стена христианского мира. Ни один не пройдет" #NT!
 nd_hos.6.b: "Обучайте инженеров. Бастион – это школа" #NT!
 STATIC_MODIFIER_NAME_nd_hos_constitution_of_the_order: "Конституция Ордена" #NT!
 STATIC_MODIFIER_DESC_nd_hos_constitution_of_the_order: "Обнародован Кодекс порядка вещей. Права и обязанности каждого брата записаны. Священный Совет, власть Магистра, привилегии языков: все это закреплено в конституции, которая объединяет Конвент." #NT!
 nd_hos.7.t: "Кодекс дель Ордина" #NT!
 nd_hos.7.d: "Под руководством Великого Магистра Хьюга Лубенкса де Вердаля Орден кодифицирует свои накопленные уставы, обычаи и постановления совета в единый Кодекс: конституцию Суверенного Военного Ордена Госпитальеров. Все права каждого брата, все привилегии каждого языка, все обязанности каждого офицера теперь записаны в одной книге.\n\nКодификация разрешает споры, которые кипели на протяжении поколений. Полномочия Капитана определены; таковы и его пределы. Права языков защищены; как и их обязательства. Учитываются доходы Конвента (отзывы, призовые, больничные фонды, командирская рента). С этого момента Орден имеет писаную конституцию, а многонациональная конфедерация управляется законом, а не импровизацией." #NT!
 nd_hos.7.a: "Кодекс – это закон. Пусть Орден управляется таким образом" #NT!
 nd_hos_hospitalier_tradition: "Гостеприимная традиция" #NT!
 nd_hos_hospitalier_tradition_desc: "Основополагающая миссия Ордена: забота о больных прежде всего. Больница предшествовала мечу." #NT!
 nd_hos_knights_hospitaller: "Рыцари-госпитальеры" #NT!
 nd_hos_knights_hospitaller_desc: "Присяжные братья-рыцари Конвента, связанные обетами бедности, целомудрия и послушания. Дисциплинированная тяжелая пехота Ордена." #NT!
 nd_hos_squadron_of_the_order: "Эскадрилья Ордена" #NT!
 nd_hos_squadron_of_the_order_desc: "Тонкая боевая галера госпитальеров, фирменное оружие Ордена на море. Предназначен для тарана и абордажа, с экипажем из рыцарских офицеров и средиземноморских моряков." #NT!
 nd_hos_order_commandery: "Командование Ордена" #NT!
 nd_hos_order_commandery_desc: "Укрепленная прецептория: казармы, казначейство и часовня языка. Местная резиденция Ордена по всей католической Европе." #NT!
 nd_hos_langues_system: "Система языков" #NT!
 nd_hos_langues_system_desc: "Орден разделен на восемь языков (Прованс, Овернь, Франция, Италия, Арагон, Кастилия, Германия, Англия), каждый из которых имеет свой собственный трактир, Пилье и государственное учреждение." #NT!
 nd_hos_statutes_of_rhodes: "Статуты Родоса" #NT!
 nd_hos_statutes_of_rhodes_desc: "Первая письменная кодификация обычаев и правил Ордена под руководством Великого Магистра Роже де Пена. Конституционная основа суверенного религиозного порядка." #NT!
 nd_hos_mediterranean_galley_tactics: "Тактика средиземноморских галер" #NT!
 nd_hos_mediterranean_galley_tactics_desc: "Тактика весла и паруса усовершенствовалась против османских флотов. Тонкая галера госпитальеров специализировалась на абордажах и таранах, с дисциплиной, которой не мог сравниться ни один торговый флот." #NT!
 nd_hos_apothecary_of_the_order: "Аптекарь Ордена" #NT!
 nd_hos_apothecary_of_the_order_desc: "Лечебные мастерские Ордена, производящие териак и бальзамы из культивируемых трав. Госпитальерские лекарства экспортируются по всей католической Европе." #NT!
 nd_hos_maltese_bastions: "Мальтийские бастионы" #NT!
 nd_hos_maltese_bastions_desc: "Итальянский бастионный след адаптирован к средиземноморскому року. Форты Сен-Анджело и Сен-Эльмо ​​охраняют гавань, а сама Валлетта представляет собой укрепленный полуостров." #NT!
 nd_hos_sacra_infermeria: "Сакра Инфермерия" #NT!
 nd_hos_sacra_infermeria_desc: "Великая больница Валлетты. Пионер современной гигиены с серебряными тарелками, медовыми повязками на раны и отдельными палатами для больных. Самая современная больница в христианском мире." #NT!
 nd_hos_corso_privateering: "Корсо Каперство" #NT!
 nd_hos_corso_privateering_desc: "Разрешенная государством корсарская война против османского и берберийского судоходства. Мальтийские капитаны плавают под флагом Ордена, делясь призовыми деньгами с Казначейством." #NT!
 nd_hos_tongues_treasury: "Сокровищница языков" #NT!
 nd_hos_tongues_treasury_desc: "Каждый язык передает Конвенту свою долю доходов от европейского командования (ответы). Богатство Ордена собрано на католическом континенте." #NT!
 nd_hos_great_siege_veterans: "Ветераны Великой блокады" #NT!
 nd_hos_great_siege_veterans_desc: "Дух 1565 года был узаконен: гарнизонные войска тренировались в обороне крепостей, сочетая испанскую дисциплину tercio с опытом осады Ордена." #NT!
 nd_hos_tribunale_armamenti: "Трибунале дельи Армаменти" #NT!
 nd_hos_tribunale_armamenti_desc: "Призовой корт корсо. Пять членов комиссии выдают лицензии капитанам-корсарам, устанавливают правила боя и распределяют доходы от призов в казну Ордена." #NT!
 nd_hos_capitana_galley: "Капитан Мальтийской эскадрильи" #NT!
 nd_hos_capitana_galley_desc: "Сакра Капитана: адмиральская галера. Резная корма, позолоченные носы и самая опытная рыцарская команда Ордена." #NT!
 nd_hos_valletta_arsenal: "Валлетта Арсенал" #NT!
 nd_hos_valletta_arsenal_desc: "Верфи Ордена в Большой гавани. Галеры, караканы снабжения, а затем и парусные фрегаты, построенные и переоборудованные в непрерывном порядке." #NT!
 nd_hos_codice_del_ordine: "Кодекс дель Ордина" #NT!
 nd_hos_codice_del_ordine_desc: "Полный свод законов Ордена. Права каждого брата, привилегии каждого языка, обязанности каждого офицера записаны в единой конституции." #NT!
 nd_hos_frigate_squadron: "Фрегатная эскадра Ордена" #NT!
 nd_hos_frigate_squadron_desc: "Когда галеры исчезли, Орден построил парусные фрегаты, чтобы сохранить свою роль средиземноморской полиции. Быстрее и легче линейных кораблей, предназначенных для охоты на корсаров." #NT!
 nd_hos_school_of_anatomy_advance: "Школа анатомии и хирургии" #NT!
 nd_hos_school_of_anatomy_advance_desc: "Основанная в Сакра Инфермерия в 1676 году, она обучает врачей со всей католической Европы самой современной хирургической и фармацевтической практике того времени." #NT!
 nd_hos_hospitaller_customs: "Госпитальерская таможня" #NT!
 nd_hos_hospitaller_customs_desc: "Мальта как средиземноморская карантинная станция. Лазаретто и таможня получают надежный доход от транзитной торговли, не допуская при этом распространения болезней в гавани." #NT!
 nd_hos_mediterranean_quarantine: "Средиземноморский карантин" #NT!
 nd_hos_mediterranean_quarantine_desc: "Мальта устанавливает стандарты европейского морского карантина. Система Лазаретто в зените своего развития, регулирующая движение кораблей, экипажей и грузов по внутреннему морю." #NT!
 nd_hos_order_reformed: "Орден реформирован" #NT!
 nd_hos_order_reformed_desc: "Конституционные реформы Великих Магистров Пинто и Рохана модернизируют языки, упорядочивают центральную администрацию и готовят Орден к просвещенной эпохе." #NT!
 nd_hos_late_corso: "Поздний Корсо" #NT!
 nd_hos_late_corso_desc: "Антипиратская миссия Ордена сохранилась и в революционную эпоху. Мальтийские фрегаты патрулируют торговые пути Средиземноморья, охотясь на алжирских и триполитанских корсаров." #NT!
 nd_hos_maltese_free_port: "Мальтийский свободный порт" #NT!
 nd_hos_maltese_free_port_desc: "Мальта открыта для международной торговли. В конце восемнадцатого века гавань становится средиземноморским перевалочным пунктом для британской, французской, левантийской и итальянской торговли." #NT!
 nd_hos_magistral_library: "Магистральная библиотека" #NT!
 nd_hos_magistral_library_desc: "Архив и научная библиотека Ордена в Валлетте. Рыцари-архивисты каталогизируют языковые записи, карты и медицинские трактаты в научном учреждении, которое конкурирует с итальянскими университетскими библиотеками." #NT!
 nd_hos_magistral_library_building: "Магистральная библиотека" #NT!
 nd_hos_magistral_library_building_desc: "Архив и научная библиотека Ордена: каталог переписки рыцарей-архивистов, языковые записи, карты и медицинские трактаты." #NT!
 nd_hos_magistral_library_maintenance: "Архив и Скрипторий" #NT!
 nd_hos_magistral_library_maintenance_desc: "Бумага, книги, мебель и пчелиный воск всегда были под рукой. Архивариусы курируют документальную память Ордена на восьми языках." #NT!
 a_nd_hos_knights: "Рыцари-госпитальеры" #NT!
 a_nd_hos_knights_desc: "Побратимы-рыцари Конвента: тяжелая пехота-рыцари-монахи, боевые братья Ордена. Связанный монашескими обетами; дисциплинирован там, где нарушаются обычные сборы." #NT!
 a_nd_hos_tercio: "Терсио Ордена" #NT!
 a_nd_hos_tercio_desc: "Ветераны тяжелой пехоты, сочетающие испанское трение с дисциплиной Ордена. Набрано из солдат, удерживавших бастионы 1565 года, и их преемников." #NT!
 n_nd_hos_galley: "Галера Ордена" #NT!
 n_nd_hos_galley_desc: "Тонкая боевая галера госпитальеров с нависающим шпором. Предназначен для тарана и абордажа османских и берберийских кораблей в тесных боях." #NT!
 n_nd_hos_capitana: "Сакра Капитана" #NT!
 n_nd_hos_capitana_desc: "Флагманская галера Великого Магистра. Резной кормовой, позолоченный нос, восьмиконечный крест Святого Иоанна на каждом знамени. Самая тяжеловооруженная галера Средиземноморья." #NT!
 n_nd_hos_frigate: "Мальтийский фрегат" #NT!
 n_nd_hos_frigate_desc: "Парусный военный корабль госпитальеров позднего периода. Построен в арсенале Валлетты для охоты на средиземноморских корсаров: быстрее, чем линейный корабль, и имеет гораздо меньший вес." #NT!
 nd_hos_commandery: "Командование Ордена" #NT!
 nd_hos_commandery_desc: "Укрепленная прецептория языка: казармы, казначейство и часовня, объединенные под властью рыцаря-командора." #NT!
 nd_hos_commandery_maintenance: "Упражнение Ордена" #NT!
 nd_hos_commandery_maintenance_desc: "Братья тренируются ежедневно; часовня сохраняется; Командорские запасы всегда полны." #NT!
 nd_hos_auberge: "Оберж языков" #NT!
 nd_hos_auberge_desc: "Административно-жилое здание языка. У каждого языка есть своя гостиница: общежитие для приезжих братьев, языковой кабинет и областной административный центр." #NT!
 nd_hos_auberge_maintenance: "Оберж Совет" #NT!
 nd_hos_auberge_maintenance_desc: "Братья собираются под пилером языка; корреспонденция рассылается по всей родине языка; записи языка сохраняются." #NT!
 nd_hos_apothecary: "Аптекарь Ордена" #NT!
 nd_hos_apothecary_desc: "Лекарственная мастерская Ордена. Выращивает травы, перегоняет териак и бальзамы и экспортирует госпитальерские лекарства по католической Европе." #NT!
 nd_hos_apothecary_production: "Териачное соединение" #NT!
 nd_hos_apothecary_production_desc: "Фирменный медицинский состав Ордена, приготовленный из смеси пчелиного воска, волоконных культур и вина, экспортируемый под печатью восьмиконечного креста." #NT!
 nd_hos_infermeria: "Сакра Инфермерия" #NT!
 nd_hos_infermeria_desc: "Великая больница Валлетты. Серебряные тарелки, медовые повязки на раны, палаты для больных и школа анатомии. Самая современная больница в христианском мире." #NT!
 nd_hos_infermeria_maintenance: "Больница Святого Иоанна" #NT!
 nd_hos_infermeria_maintenance_desc: "Братья лечат больных. В палатах поддерживается гигиена по стандартам Ордена: серебряные тарелки, медовые повязки, отдельные палаты. Аптека и прачечная работают постоянно." #NT!
 nd_hos_star_fortifications: "Звездные укрепления Ордена" #NT!
 nd_hos_star_fortifications_desc: "Бастионные укрепления гавани адаптированы по итальянскому образцу. Форты Сен-Анджело и Сен-Эльмо, бастионы Сенглеа и навесные стены полуострова Валлетта." #NT!
 nd_hos_fortifications_maintenance: "Гарнизон и магазины" #NT!
 nd_hos_fortifications_maintenance_desc: "Порох, дробь и продовольствие для гарнизона бастиона. Стены латают после каждого шторма; рвы оставались чистыми; пушки были смазаны." #NT!
 nd_hos_arsenal: "Валлетта Арсенал" #NT!
 nd_hos_arsenal_desc: "Верфи Ордена в Большой гавани. Камбузные доки, склады снабжения, а позднее и пристани для фрегатов расположены вдоль заливов между Биргу и Сенглеей." #NT!
 nd_hos_arsenal_maintenance: "Арсенал Ярдс" #NT!
 nd_hos_arsenal_maintenance_desc: "Запасы древесины, варка дегтя, содержание военно-морских запасов, рыцарские капитаны и мальтийские корабелы на гонораре." #NT!
 nd_hos_lazaretto: "Лазаретто и таможня" #NT!
 nd_hos_lazaretto_desc: "Морская карантинная станция и таможня. Посещающие корабли и экипажи ждут в Лазаретто перед высадкой, обеспечивая таможенные поступления и борьбу с болезнями." #NT!
 nd_hos_lazaretto_maintenance: "Карантинный список" #NT!
 nd_hos_lazaretto_maintenance_desc: "Ведутся бухгалтерские книги, справки и карантинные сертификаты; по палатам циркулировали медикаменты и чистое белье; Таможенник фиксирует каждый груз." #NT!
 nd_hos_destiny: "Проект монастыря" #NT!
 nd_hos_destiny_desc: "Орден возродился. Теперь Конвент должен решить, каким государством ему стать: воинственной средиземноморской империей, проецирующей силы от моря до моря, или суверенным островным королевством, гавани которого являются правовой, торговой и медицинской опорой католического Средиземноморья." #NT!
 nd_hos_dest_levant_reclaimed: "Верните Левантийское побережье" #NT!
 nd_hos_dest_levant_reclaimed_desc: "Снова установите восьмиконечный крест в Акре и Триполи, потерянных домах Ордена со времен Королевств крестоносцев. Выставьте постоянную армию из тридцати полков, чтобы перебросить силы с побережья Святой Земли." #NT!
 nd_hos_dest_ottoman_lake_broken: "Разрушить Османское озеро" #NT!
 nd_hos_dest_ottoman_lake_broken_desc: "Возьмите Смирну и Александрию, великие османские военно-морские порты и порты снабжения восточного Средиземноморья. Повысьте престиж и выставьте пятьдесят полков. Средиземное море должно перестать быть турецким озером." #NT!
 nd_hos_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_hos_dest_mare_nostrum_desc: "Краеугольный камень воинственного проекта: Константинополь, Тунис, Бейрут: северный берег, южный берег, восточный берег. Средиземное море — это озеро Ордена, а Великое Магистерство возвышается над гаванью Монастыря." #NT!
 nd_hos_dest_lazaretto_network: "Сеть Лазаретто" #NT!
 nd_hos_dest_lazaretto_network_desc: "Займитесь банковским делом и накопите тысячу дукатов. Провести торговлю левантийским шелком через мальтийские гавани. Мальта становится центром обмена информацией по торговле и карантину в католическом Средиземноморье." #NT!
 nd_hos_dest_continental_authority: "Континентальное управление здравоохранения" #NT!
 nd_hos_dest_continental_authority_desc: "Займитесь печатным станком, поднимите престиж, накопите две тысячи дукатов и проведите торговлю тонкими тканями через мальтийскую таможню. Распространять медицинскую практику госпитальеров и стандарты карантина по всей католической Европе." #NT!
 nd_hos_dest_sacra_maxima: "Сакра Инфермерия Максима" #NT!
 nd_hos_dest_sacra_maxima_desc: "Краеугольный камень торгово-медицинского проекта: охватить мануфактуры, накопить три тысячи дукатов, завоевать престиж и провести торговлю серебром через гавань монастыря. Судно Lazaretto Imperial возвышается вдоль Большой гавани как юридический и санитарный центр внутреннего моря." #NT!
 nd_hos.8.t: "Долгая дорога монастыря" #NT!
 nd_hos.8.d: "Священный Совет выбрал проект Ордена. Независимо от того, выплывет ли восьмиконечный крест на носу императорской галеры или поднимется над карантинными палатами «Лазаретто», дорога монастырю проложена. Братья знают, что им нужно построить, и языки обращают свои командиры на работу.\n\nНа вкладке «Традиции» открылся путь судьбы. Монастырь узнает, выполнил ли он свой проект." #NT!
 nd_hos.8.a: "Пусть работа начнется" #NT!
 nd_hos.9.t: "Акко и Триполи восстановлены" #NT!
 nd_hos.9.d: "Галеры снова выбрасывают рыцарей и терцио на пески Леванта. Старая гавань Акры (где Орден сделал свой последний бой в 1291 году) удерживается войсками госпитальеров, и восьмиконечный крест парит над ее стенами впервые за более чем сто лет. Триполи пал в следующем сезоне, его цитадель была разрушена мальтийскими пушками и удержана рыцарями в белых сюрко.\n\nМонастырь сделал то, чего не делал ни один католический принц со времен Святого Людовика. Побережье Святой Земли частично освоено, и Ордену возвращена его старая стратегическая глубина: левантийский плацдарм, с которого можно проецировать силы в сердце Османской империи." #NT!
 nd_hos.9.a: "Братья снова стоят на земле Леванта" #NT!
 nd_hos.10.t: "Османское озеро разрушено" #NT!
 nd_hos.10.d: "Гавань Смирны (долгое время являвшаяся главной османской военно-морской базой на Эгейском море) взята эскадрами госпитальеров. Александрия, великий египетский порт, пал в результате общевойсковой операции: галеры закрыли вход в гавань, а tercio приземлились к востоку от Фароса. Два важнейших средиземноморских порта султана теперь подчиняются Конвенту.\n\nКонвент должен решить, как использовать эту победу. Некоторые капитаны хотят, чтобы эскадра вторглась в османские воды в решающем бою, преследуя их флот до полного уничтожения в традициях Ромегаса. Другие выступают за постоянное патрулирование Средиземного моря: эскадры галер бесконечно перемещаются вдоль каждого побережья, подавляя торговлю и утверждая, что присутствие госпитальеров является постоянным фактом внутреннего моря." #NT!
 nd_hos.10.a: "Направьте эскадру на османский флот. Вступить в бой и уничтожить" #NT!
 nd_hos.10.b: "Бесконечно патрулируйте морские пути. Быть везде одновременно" #NT!
 nd_hos.11.t: "Маре Нострум" #NT!
 nd_hos.11.d: "Константинополь под пушками госпитальеров. Тунис отнят у берберийских корсаров. Бейрут и порты Леванта украшены восьмиконечным крестом. Средиземное море (внутреннее море античных империй, Османское озеро прошлого века) стало владением Ордена как по сути, так и по названию. Братья-рыцари правят гаванями от Геллеспонта до Геркулесовых столбов.\n\nВеликое Магистерство возвышается в гавани Валлетты, Магистральный дворец, достойный средиземноморской империи: государственные палаты, военно-морской совет, канцелярия языков, тронный зал для посланников половины мира. Монастырь должен определить свой характер на этой высоте: Имперский оплот, охраняющий каждый отвоеванный берег крепостью и гарнизоном, или Пакс Госпитальерия патрульных флотов, умиротворяющих внутреннее море за счет истощения, а не стен." #NT!
 nd_hos.11.a: "Гарнизоны на каждом берегу. Мы — оплот" #NT!
 nd_hos.11.b: "Патрулируйте все морские пути. Мы - сам мир" #NT!
 nd_hos.12.t: "Банковское дело и Лазаретто" #NT!
 nd_hos.12.d: "Мальтийские банковские дома осуществляют расчеты с левантийскими торговцами шелком, чьи корабли заходят в Большую гавань. Братья-банкиры считают генуэзские флорины, венецианские дукаты, алеппинские блестки, французские экю. Хранилища монастыря наполняются средиземноморским серебром, а список Лазаретто заполняется капитанами, находящимися на карантине и ожидающими получения чистых документов.\n\nБанковское учреждение и торговля шелком превратили Мальту в средиземноморскую расчетную палату. Приезжие торговцы платят таможенные пошлины при въезде, оплачивают свой перекрестный счет в мальтийском банке, берут карантинный сертификат и плавают с печатью Ордена, подтверждающей их, в каждой католической гавани." #NT!
 nd_hos.12.a: "Монастырь имеет коммерческое состояние" #NT!
 nd_hos.13.t: "Карантин становится имперским" #NT!
 nd_hos.13.d: "Карантинные сертификаты госпитальеров отмечают в Генуе, Марселе, Барселоне, Неаполе, Рагузе. Типографии Ордена непрерывно выпускают «Мальтийское санитарное руководство», которое распространяется во всех католических портах. Торговцы изысканными тканями из Флоренции и Лиона курсируют через Мальту из-за скидки на страховку, предлагаемой грузом, запечатанным Орденом.\n\nКонвент должен решить, как расширить свои полномочия. Крыло Лазаретто выступает за континентальную карантинную сеть: укрепленные капиталоемкие станции Лазаретто в каждой гавани, в каждой из которых сидят мальтийские комиссары. Таможенное крыло выступает за создание Имперской таможни: мальтийские офицеры размещены в каждой католической гавани и собирают сборы с каждого груза, а Орден является коммерческой канцелярией Средиземноморья." #NT!
 nd_hos.13.a: "Создайте сеть Lazaretto. В гаванях карантин вместе" #NT!
 nd_hos.13.b: "Постройте таможни. Канцлеры Ордена все торгуют" #NT!
 nd_hos.14.t: "Сакра Инфермерия Максима" #NT!
 nd_hos.14.d: "Мануфактуры вдоль Большой Гавани. Серебро со всего католического мира оседает в банковских хранилищах Мальты. Lazaretto Imperial (три этажа карантинных палат, таможни и аптекарских палат) открываются над стенами гавани. Паломники из Испании, купцы из Гамбурга, врачи из Падуи — все проходят через залы монастыря.\n\nОрден больше не является просто суверенным островным государством. Это юридический, санитарный и торговый центр Средиземноморья. Теперь Конвент должен придать проекту окончательный характер: Универсальная Фармакопея, сделавшая мальтийские стандарты медикаментов и военно-морского снабжения континентальными, или Совет Лазаретов, возглавляющий федерацию карантинных станций по всему миру." #NT!
 nd_hos.14.a: "Фармакопея — подарок Ордена христианскому миру." #NT!
 nd_hos.14.b: "Совет Лазаретов. Объедините гавани мира" #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_decisive_engagement: "Решающее взаимодействие" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_decisive_engagement: "Эскадра входит в состав османского флота. Галеры Ордена таранят, берут на абордаж и захватывают в традициях Ромегаса; флаг госпитальеров возвращается в гавань с призами на буксире." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_mediterranean_patrol: "Средиземноморский патруль" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_mediterranean_patrol: "Галеры Ордена бесконечно курсируют вдоль каждого побережья Средиземного моря. Непрерывное развертывание великолепно; стоимость оплаты экипажей и баз снабжения приводит к небольшой денежной инфляции." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_imperial_bulwark: "Имперский оплот" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_imperial_bulwark: "Крепости госпитальеров возвышаются в каждой отвоеванной гавани. Гарнизоны пополнялись, стены латались, бастионы расширялись. Средиземноморье – это цепь фортов под восьмиконечным крестом." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_pax_hospitalleria: "Пакс Госпитальерия" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_pax_hospitalleria: "Внутреннее море усмиряется скорее патрулем, чем стеной. Ремонтные мастерские открываются в каждой освоенной гавани; корабли быстро возвращаются в море; истощение сил вдоль побережья сводится к минимуму благодаря непрерывной логистике Ордена." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_quarantine_network: "Средиземноморская карантинная сеть" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_quarantine_network: "Станции Лазаретто в каждой католической гавани, в каждой сидят мальтийские комиссары. Защита Ордена распространяется через карточки разрешений на торговлю; содержать сеть укрепленных станций дорого." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_customs_imperial: "Таможня Империи" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_customs_imperial: "Мальтийские таможенники в каждой католической гавани; сборы за груз, возвращающиеся в Валлетту; Стоимость транспортных галер снизилась на объем торговли. Однако усиление отдаленных сухопутных армий страдает от акцента на торговле." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_universal_pharmacopeia: "Универсальная Фармакопея" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_universal_pharmacopeia: "Мальтийские медикаменты, военно-морские припасы и бюргерские товары текут на полконтинента. Орден является медицинской и материально-технической основой католической Европы." #NT!
 STATIC_MODIFIER_NAME_nd_hos_dest_council_of_lazarettos: "Совет Лазаретто" #NT!
 STATIC_MODIFIER_DESC_nd_hos_dest_council_of_lazarettos: "Орден возглавляет федерацию станций Лазаретто по всему миру. Численность населения возрастает за счет улучшения санитарных условий; торговля свободно течет через сеть Ордена; моряки, прошедшие обучение в каждом порту-члене, поступают на мальтийскую службу." #NT!
 nd_hos_grand_magistery: "Великое Магистерство" #NT!
 nd_hos_grand_magistery_desc: "Магистральный дворец на своей имперской высоте: покои Великого Магистра, военно-морской совет, канцелярия языков и зал приемов для посланников средиземноморского владычества." #NT!
 nd_hos_grand_magistery_maintenance: "Магистральный суд" #NT!
 nd_hos_grand_magistery_maintenance_desc: "Бумага для канцелярии, прекрасная ткань для магистратского хозяйства, мебель для аудиенций, оружие для магистральной стражи." #NT!
 nd_hos_lazaretto_imperial: "Лазаретто Империал" #NT!
 nd_hos_lazaretto_imperial_desc: "Sacra Infermeria Maxima: континентальный орган здравоохранения, таможенная служба и канцелярия по выдаче торговых разрешений. Три этажа палат, офисов и аптек над Гранд-Харбором." #NT!
 nd_hos_lazaretto_imperial_maintenance: "Имперские обереги" #NT!
 nd_hos_lazaretto_imperial_maintenance_desc: "Лекарства курсировали по палатам; бумага для канцелярии торговых разрешений; пчелиный воск для аптек; ткань для карантинного списка." #NT!
 hos_council_of_tongues_bureaucracy: "Сакро Консильо Компито" #NT!
 hos_council_of_tongues_bureaucracy_desc: "Совет языков: федеральный высший совет Ордена, образованный в соответствии со Статутами Маргаты (1206 г.) и Роже де Пена (1357 г.). Каждый из восьми языков находится под своим пильером (монастырским судебным приставом): маршал Прованса, великий командующий Оверни, госпитальер Франции, адмирал Италии, драпировщик Арагона, великий канцлер Кастилии, великий судебный пристав Германии и тюркопольер Англии. Ни один пильер не может быть свергнут только Великим Магистром, и для войны, заключения союза и сбора ответных мер с монастырей требуется согласие Совета." #NT!
 hos_tribunale_armamenti_bureaucracy: "Трибунале дельи Армаменти" #NT!
 hos_tribunale_armamenti_bureaucracy_desc: "Морской трибунал, созданный в Валлетте в 1605 году для лицензирования, регулирования и вынесения решений корсо: лицензированной государством средиземноморской каперской кампании Ордена против мусульманского судоходства. Трибунал выдает патенты дель корсо под судейской печатью, рассматривает дела о призах и взимает десятичную долю (одну десятую часть) для Общего казначейства и еще одну десятую часть для Великого Магистра. Его судьи набираются из итальянского и испанского языков; инвесторами являются мальтийские бюргеры, командующие рыцарями и молчаливые партнеры по всему католическому Средиземноморью. Патенты, находящиеся в свободном обращении, продаются за греческие и венецианские награды, а имя Ордена запятнано по всему христианскому миру." #NT!
 hos_sacra_infermeria_bureaucracy: "Сакра Инфермерия" #NT!
 hos_sacra_infermeria_bureaucracy_desc: "Святой лазарет, определяющее религиозное учреждение Ордена. Мальтийская Sacra Infermeria открылась в Валлетте в 1574 году с большим отделением длиной 155 метров, которое на протяжении семнадцатого века превратилось в одну из крупнейших больниц в Европе. Устав обязывает каждого брата-рыцаря служить у постели больного в servitio dei poveri; к пациентам обращаются как к «Нашим Лордам Больным», и они обедают с серебряной тарелки. Пионеры Лазарета стандартизировали медицинские книги, анатомическую хирургию через Анатомический театр и систематическое приготовление лекарств через Аптекарию. Пациенты всех вероисповеданий принимаются без различия." #NT!
 hos_comun_tesoro_bureaucracy: "Трибунале дель Комун Тесоро" #NT!
 hos_comun_tesoro_bureaucracy_desc: "Общая казначейская палата, центральное финансовое учреждение Ордена. Каждое коммандерство в каждом европейском монастыре в качестве ответа передает в казначейство одну треть своего годового дохода. Комун Тесоро проверяет эти отчеты, собирает морги (поместья умерших рыцарей) и управляет банковскими отношениями Ордена с генуэзцами и папской курией. Его приемники и генеральный прокурор назначаются Великим Магистром и образуют авторитетный противовес основанному на языке Совету, связывая монастыри с магистратскими финансовыми полномочиями посредством централизации Ласкариса (1636-1657) и Кодекса дель Ордина Рохана (1782)." #NT!
 AUTO_MODIFIER_NAME_nd_hos_bureaucracy_authority: "Магистральный орган" #NT!
 AUTO_MODIFIER_DESC_nd_hos_bureaucracy_authority: "Священный и Суверенный Совет Ордена может учредить до трех постоянных бюрократических должностей, состоящих из Совета Языков, Трибунале дельи Вооружений, Священной Инфермерии и Общего казначейства: четырех столпов зрелого конституционного государства Ордена." #NT!
 STATIC_MODIFIER_NAME_nd_hos_militant_brotherhood: "Суверенный Орден Святого Иоанна" #NT!
 STATIC_MODIFIER_DESC_nd_hos_militant_brotherhood: "Институциональное ядро ​​Конвента: братья-рыцари, связанные монашескими обетами, восемь языков, объединенных под руководством Великого Магистра, военная рука Папы, обладающая светской властью. Духовенство лично возглавляет хозяев Ордена; крепостные стены стоят выше любого светского королевства; По древнему обычаю характер монастыря склоняется к священной войне. Орден не может быть оторван от католической веры. Vanilla Military_order_reform можно официально активировать через вкладку «Правительство», чтобы зафиксировать заголовок." #NT!
