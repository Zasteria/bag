l_russian:
 STATIC_MODIFIER_NAME_nd_sultan_al_barr_wa_al_bahr: "Султан суши и моря" #NT!
 STATIC_MODIFIER_DESC_nd_sultan_al_barr_wa_al_bahr: "Следуя примеру Махмуда Бегады, который называл себя султаном аль-Барр ва аль-Бахром, Гуджарат распространяет власть как на внутренние районы, так и на Аравийское море." #NT!
 STATIC_MODIFIER_NAME_nd_gateway_of_the_ocean: "Ворота Индийского океана" #NT!
 STATIC_MODIFIER_DESC_nd_gateway_of_the_ocean: "Порты Гуджарата расположены на пересечении богатейших торговых путей мира, а его торговцы стали незаменимыми партнерами от Восточной Африки до Юго-Восточной Азии." #NT!
 STATIC_MODIFIER_NAME_nd_fortress_conqueror: "Завоеватель крепостей" #NT!
 STATIC_MODIFIER_DESC_nd_fortress_conqueror: "В традициях Махмуда Бегады, который разрушил неприступные цитадели Чампанер и Джунагадх, армии Гуджарата специализируются на терпеливом сокращении вражеских опорных пунктов." #NT!
 STATIC_MODIFIER_NAME_nd_lord_of_diu: "Лорд Диу" #NT!
 STATIC_MODIFIER_DESC_nd_lord_of_diu: "После создания Махмудом Бегадой мощного флота у побережья Диу, Гуджарат контролирует подходы Аравийского моря к Индийскому субконтиненту." #NT!
 STATIC_MODIFIER_NAME_nd_coastal_bulwark: "Прибрежный бастион" #NT!
 STATIC_MODIFIER_DESC_nd_coastal_bulwark: "Уязвленный прибытием европейских оккупантов, Гуджарат вложил значительные средства в береговые укрепления и готовность военно-морского флота защищать свои берега." #NT!
 STATIC_MODIFIER_NAME_nd_adopted_cannonry: "Принятая пушка" #NT!
 STATIC_MODIFIER_DESC_nd_adopted_cannonry: "Вместо того чтобы отступить от европейского вызова, Гуджарат освоил пороховые технологии и современное судостроение, чтобы противостоять своим соперникам на море." #NT!
 nd_guj.1.t: "Гуджаратский султанат" #NT!
 nd_guj.1.d: "Знамя Гуджарата реет над землями между Ранном Качом и Хамбатским заливом. На протяжении поколений купцы Камбея и Сурата обогащали эти берега богатствами Индийского океана, в то время как султаны создали королевство на оспариваемых пограничных территориях западной Индии.\n\nТеперь, когда Гуджарат объединен под единой короной, его правитель должен решить, каким станет султанат. Последует ли он по пути Махмуда Бегады, султана суши и моря, строя военное государство, которое проецирует власть как на внутренние районы, так и на Аравийское море? Или же ему предстоит стать воротами Индийского океана, торговой империей, где торговля и дипломатия являются инструментами величия?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_guj.1.a: "Мы будем султанами суши и моря!" #NT!
 nd_guj.1.b: "Гуджарат станет воротами Индийского океана." #NT!
 nd_guj.2.t: "Завоевания Махмуда Бегады" #NT!
 nd_guj.2.d: "Султан Махмуд Бегада заслужил свое имя «Повелитель двух фортов» благодаря завоеванию, казалось бы, неприступных крепостей Чампанер и Джунагадх. Крепость раджпутов Чампанер, расположенная на вершине скалистого плато, пала только после длительной и решительной осады. Вскоре после этого Джунагадх, резиденция династии Чудасама у подножия священной горы Гирнар, был взят под контроль.\n\nЭти победы превратили Гуджарат из прибрежного султаната в крупную державу западной Индии. Однако амбиции Махмуда выходят за рамки земли. Он назначил Малика Айяза, доверенного командира скромного происхождения, губернатором Диу, где собирается грозный флот для защиты морских интересов Гуджарата.\n\nПродолжит ли султан расширяться за счет завоеваний на суше или обратит свой взор на море?" #NT!
 nd_guj.2.a: "Крепости Индии падут перед нами." #NT!
 nd_guj.2.b: "Наша судьба лежит на волнах." #NT!
 nd_guj.3.t: "Битва при Диу" #NT!
 nd_guj.3.d: "Воды у Диу покраснели от крови. Огромный флот, собранный мамлюкским султанатом Египта при поддержке собственных военных кораблей Гуджарата и кораблей из Каликута, столкнулся с португальским Estado da India. Результат продемонстрировал ужасную мощь европейских тяжелых пушек на море.\n\nПобеда португальцев при Диу в 1509 году пошатнула устоявшийся порядок торговли в Индийском океане. На протяжении веков купцы Гуджарата свободно плавали по этим водам, их дау доставляли хлопок и специи в каждый порт от Занзибара до Малакки. Теперь европейские нарушители требуют пропусков и дани от гуджаратских судов в их собственных водах.\n\nГуджарат должен ответить. Должен ли султанат укрепить свою береговую линию и подготовиться к сопротивлению этим иностранным агрессорам или изучить их методы и перенять их технологии, чтобы конкурировать на равных?" #NT!
 nd_guj.3.a: "Укрепите каждый порт: они не смогут высадиться без сопротивления." #NT!
 nd_guj.3.b: "Изучите их методы. Стройте свои корабли. Победите их в их же игре." #NT!
 nd_guj.4.t: "Слава Чампанера-Павагадха" #NT!
 nd_guj.4.d: "После завоевания Чампанера султан Махмуд Бегада превратил древнюю крепость на холме в великолепную новую столицу. Там, где когда-то стояли только раджпутские зубцы, возвышается город мечетей, дворцов и садов. Джама Масджид в Чампанере с высокими минаретами и 172 колоннами с замысловатой резьбой представляет собой вершину индо-исламской архитектуры: синтез индуистских структурных традиций и исламского декоративного искусства, которого нет больше нигде в Индии.\n\nМасджид Кевада, Масджид Нагина и Масджид Шахар ки демонстрируют разные грани этой уникальной архитектурной традиции. Таможня Мандви говорит о продолжающейся коммерческой жизнеспособности Гуджарата, а Цитадель Джаханпанах провозглашает военную мощь султаната.\n\nЧампанер-Павагадх является памятником золотому веку Гуджарата." #NT!
 nd_guj.4.a: "Свидетельство нашей цивилизации." #NT!
 nd_guj.5.t: "Гуджаратская торговая диаспора" #NT!
 nd_guj.5.d: "Гуджаратские купцы создали постоянные торговые сообщества по всему миру Индийского океана. В портах Адена и Ормуза, на базарах Малакки и Малабарского побережья гуджаратских торговцев узнают по их характерной одежде и легендарной коммерческой хватке.\n\nЭти торговцы везут больше, чем просто товары: они несут культуру, язык и религиозные традиции Гуджарата к далеким берегам. Джайнские и индуистские купцы из Саураштры и Катча построили храмы в Восточной Африке. Мусульманские торговцы из Камбея основали мечети в Юго-Восточной Азии. Гуджаратская диаспора создала коммерческую сеть, охватывающую половину земного шара, связанную семейными узами, общим языком и взаимным доверием.\n\nЭта сеть дает Гуджарату разведывательное преимущество и коммерческое влияние, которых не может достичь ни одна армия." #NT!
 nd_guj.5.a: "Наши торговцы — наши величайшие послы." #NT!
 nd_guj_stepwell_engineering: "Степвелл Инжиниринг" #NT!
 nd_guj_stepwell_engineering_desc: "Ступенчатые колодцы вав в Гуджарате — одни из самых сложных водохозяйственных сооружений средневекового мира, сочетающие в себе инженерное мастерство со священной архитектурой." #NT!
 nd_guj_muzaffarid_court: "Музаффаридский суд" #NT!
 nd_guj_muzaffarid_court_desc: "Административные традиции, установленные династией Музаффаридов после обретения независимости от Дели, обеспечивают Гуджарату эффективную и стабильную систему управления." #NT!
 nd_guj_dhow_tradition: "Традиция строительства дау" #NT!
 nd_guj_dhow_tradition_desc: "Корабелы Гуджарата усовершенствовали конструкцию дау: быстрых судов с латунным вооружением, идеально приспособленных для муссонных ветров Индийского океана." #NT!
 nd_guj_cambay_trade: "Торговая сеть Камбея" #NT!
 nd_guj_cambay_trade_desc: "Порт Камбей на протяжении веков был центром международной торговли, соединяя Гуджарат с Персидским заливом, Красным морем и Восточной Африкой." #NT!
 nd_guj_early_tolerance: "Султанатская толерантность" #NT!
 nd_guj_early_tolerance_desc: "Султанат Гуджарат управляет разнообразным населением, состоящим из мусульман, индуистов и джайнов, поддерживая социальную стабильность посредством прагматичного религиозного приспособления." #NT!
 nd_guj_ghulam_tradition: "Военная традиция Гулама" #NT!
 nd_guj_ghulam_tradition_desc: "Система гуламов предоставляет султанам Гуджарата корпус кавалерии-рабов-солдат, лояльность которых полностью зависит от трона, а не от какого-либо местного дворянина." #NT!
 nd_guj_habshi_guards: "Дворцовая стража Хабши" #NT!
 nd_guj_habshi_guards_desc: "Абиссинские воины, хабши, служат элитной дворцовой стражей и военачальниками в султанате Гуджарат, их ценят за их боевые навыки и личную преданность." #NT!
 nd_guj_begada_conquests: "Завоевания Бегады" #NT!
 nd_guj_begada_conquests_desc: "Султан Махмуд Бегада заслужил свое имя «Повелитель двух фортов» за завоевание, казалось бы, неприступных крепостей Чампанер и Джунагадх." #NT!
 nd_guj_patola_weaving: "Патола Шелковое Ткачество" #NT!
 nd_guj_patola_weaving_desc: "Шелк двойного иката Патола из Патана представляет собой самое технически сложное текстильное искусство в Индии, производя ткани, ценимые королевской семьей на всем субконтиненте.\n\n#italic Доступно в: $nd_guj_emporium$#!" #NT!
 nd_guj_champaner_capital: "Чампанер-Павагадх" #NT!
 nd_guj_champaner_capital_desc: "Превращение завоеванного Чампанера в великолепную столицу представляет собой золотой век индо-исламской архитектуры в западной Индии." #NT!
 nd_guj_bandhani_craft: "Бандхани Ремесло" #NT!
 nd_guj_bandhani_craft_desc: "Древнее гуджаратское искусство бандхани, устойчивое к крашению, позволяет производить яркие ткани, ценимые во всем мире Индийского океана.\n\n#italic Доступно в: $nd_guj_emporium$#!" #NT!
 nd_guj_battle_of_diu: "Битва при Диу" #NT!
 nd_guj_battle_of_diu_desc: "Столкновение между флотом Гуджарата и португальскими военными кораблями у Диу в 1509 году стало поворотным моментом в морской войне в Индийском океане и европейской экспансии." #NT!
 nd_guj_ghurab_warfare: "Гурабская война" #NT!
 nd_guj_ghurab_warfare_desc: "Гураб, весельный военный корабль, вооруженный пушками, представляет собой адаптацию Гуджаратом арабских военно-морских традиций к эпохе пороха." #NT!
 nd_guj_bahadur_shah_legacy: "Наследие Бахадур-шаха" #NT!
 nd_guj_bahadur_shah_legacy_desc: "Вызывающее сопротивление султана Бахадур-шаха как Империи Великих Моголов, так и португальцам продемонстрировало решимость Гуджарата сохранить свою независимость." #NT!
 nd_guj_indigo_industry: "Индустрия красителей индиго" #NT!
 nd_guj_indigo_industry_desc: "Промышленность по переработке индиго в Гуджарате производит огромное количество синего красителя как для внутреннего текстильного производства, так и для экспорта на рынки Индийского океана." #NT!
 nd_guj_merchant_diaspora: "Гуджаратская торговая диаспора" #NT!
 nd_guj_merchant_diaspora_desc: "Гуджаратские купцы основали постоянные торговые сообщества от Адена до Малакки, создав коммерческую сеть, охватывающую весь Индийский океан." #NT!
 nd_guj_mercantile_law: "Торговое право" #NT!
 nd_guj_mercantile_law_desc: "Правовые традиции Гуджарата по разрешению коммерческих споров основаны как на исламской юриспруденции, так и на местных торговых обычаях, обеспечивая стабильную основу для международной торговли." #NT!
 nd_guj_reformed_cavalry: "Реформированная кавалерия" #NT!
 nd_guj_reformed_cavalry_desc: "Кавалерия Гуджарата превратилась из традиции гуламов в профессиональные провинциальные силы, оснащенные огнестрельным оружием и обученные современной тактике." #NT!
 nd_guj_surat_shipbuilding: "Суратские верфи" #NT!
 nd_guj_surat_shipbuilding_desc: "Верфи Сурата стали одним из ведущих центров судостроения в Индийском океане, производя суда как для отечественных, так и для иностранных клиентов." #NT!
 nd_guj_surat_entrepot: "Сурат Энтрепот" #NT!
 nd_guj_surat_entrepot_desc: "Сурат затмил Камбей как главный порт Гуджарата, став международным перевалочным пунктом, где встречаются и торгуют европейские, арабские, персидские и индийские купцы." #NT!
 nd_guj_communal_harmony: "Коммунальная гармония" #NT!
 nd_guj_communal_harmony_desc: "Традиция многоконфессионального управления Гуджарата, в которой соседствуют джайнские, индуистские и мусульманские общины, создает стабильное и процветающее общество." #NT!
 nd_guj_european_gunnery: "Европейская артиллерийская стрельба" #NT!
 nd_guj_european_gunnery_desc: "Верфи Сурата внедрили европейские методы военно-морской артиллерии, производя военные корабли, сочетающие индийское мастерство с европейской огневой мощью." #NT!
 nd_guj_mughal_textile_hub: "Текстильный центр Великих Моголов" #NT!
 nd_guj_mughal_textile_hub_desc: "Под управлением Великих Моголов текстильная промышленность Гуджарата значительно расширилась, поставляя хлопчатобумажную ткань и шелк на рынки от Османской Турции до Минского Китая." #NT!
 nd_guj_surat_presidency: "Президентство Сурата" #NT!
 nd_guj_surat_presidency_desc: "Сурат стал главным портом Империи Великих Моголов, космополитическим городом, где богатство Индии встречается с торговыми сетями мира." #NT!
 nd_guj_hundi_networks: "Банковские сети Хунди" #NT!
 nd_guj_hundi_networks_desc: "Гуджаратские банкиры и ростовщики разработали систему хунди: сложную сеть векселей, которая облегчает торговлю по всему Индийскому океану." #NT!
 nd_guj_fortified_cities: "Укрепленные города" #NT!
 nd_guj_fortified_cities_desc: "Крупнейшие города Гуджарата защищены грозными стенами и укреплениями — наследием вековых конфликтов между султанатом, Великими Моголов, маратхами и европейскими державами." #NT!
 nd_guj_revenue_reform: "Реформа доходов" #NT!
 nd_guj_revenue_reform_desc: "Централизованный сбор налогов и стандартизированные административные процедуры упростили систему доходов Гуджарата, увеличив долю короны в огромных богатствах региона." #NT!
 nd_guj_cotton_mechanization: "Хлопковая механизация" #NT!
 nd_guj_cotton_mechanization_desc: "Ранняя механизация переработки хлопка (джинирование, чесание и прядение) начала превращать текстильную промышленность Гуджарата из кустарного ремесла в протоиндустриальное производство.\n\n#italic Доступно в: $nd_guj_cotton_mill$#!" #NT!
 nd_guj_industrial_textiles: "Промышленный текстиль" #NT!
 nd_guj_industrial_textiles_desc: "Текстильная промышленность Гуджарата полностью индустриализировалась: механизированные фабрики производят огромное количество хлопчатобумажных тканей и тонких тканей для мировых рынков." #NT!
 nd_guj_naval_modernization: "Модернизация ВМФ" #NT!
 nd_guj_naval_modernization_desc: "Военно-морской флот Гуджарата был перестроен с использованием современных пароходов и судов с железным корпусом, что подтвердило традиционное господство региона в Аравийском море." #NT!
 nd_guj_cultural_revival: "Культурное возрождение" #NT!
 nd_guj_cultural_revival_desc: "Возобновление признания уникального архитектурного наследия и текстильных традиций Гуджарата способствует культурному возрождению, которое привлекает ученых и художников со всего субконтинента." #NT!
 nd_guj_global_diaspora: "Глобальная диаспора" #NT!
 nd_guj_global_diaspora_desc: "Диаспора Гуджарати вышла за пределы Индийского океана и охватила весь земной шар, имея торговые общины в Лондоне, Занзибаре, Сингапуре и за их пределами." #NT!
 a_nd_guj_habshi_guard: "Хабши Страж" #NT!
 a_nd_guj_habshi_guard_desc: "Абиссинская элитная дворцовая гвардия, ценимая за боевое мастерство и непоколебимую преданность султану." #NT!
 a_nd_guj_ghulam_cavalry: "Гуламская кавалерия" #NT!
 a_nd_guj_ghulam_cavalry_desc: "Тяжелая кавалерия из рабов-солдат, чья преданность полностью принадлежит трону, образует мобильную ударную силу султаната." #NT!
 n_nd_guj_dhow: "Гуджаратский дау" #NT!
 n_nd_guj_dhow_desc: "Быстрое торговое судно с латунным вооружением, построенное мастерами-корабелами Гуджарата для муссонных ветров Индийского океана." #NT!
 n_nd_guj_ghurab: "Боевая галера Гураба" #NT!
 n_nd_guj_ghurab_desc: "Весёлый военный корабль, вооруженный пушками, предназначенный для патрулирования в Аравийском море и прибрежных боевых действий." #NT!
 a_nd_guj_sipahi: "Сипахи-э-Гуджарат" #NT!
 a_nd_guj_sipahi_desc: "Реформированная провинциальная кавалерия, оснащенная огнестрельным оружием и обученная общевойсковой тактике пороховой эпохи." #NT!
 n_nd_guj_surat_frigate: "Сурат Фрегат" #NT!
 n_nd_guj_surat_frigate_desc: "Военный корабль в европейском стиле, построенный на верфях Сурата и сочетающий в себе индийское мастерство и современное артиллерийское вооружение." #NT!
 n_nd_guj_merchant_cruiser: "Суратский торговый крейсер" #NT!
 n_nd_guj_merchant_cruiser_desc: "Большой вооруженный торговый корабль, построенный на верфях Сурата и предназначенный для защиты обширных торговых конвоев Гуджарата, пересекающих Индийский океан." #NT!
 nd_guj_vav: "Вав Степвелл" #NT!
 nd_guj_vav_desc: "Монументальные ступенчатые колодцы, сочетающие священную архитектуру с практичным управлением водными ресурсами — визитная карточка инженерного искусства Гуджарата." #NT!
 nd_guj_karkhana: "Кархана Мастерская" #NT!
 nd_guj_karkhana_desc: "Королевская текстильная мануфактура, производящая изысканные ткани, шелк и окрашенные ткани как для внутреннего потребления, так и на экспорт." #NT!
 nd_guj_emporium: "Камбейский торговый центр" #NT!
 nd_guj_emporium_desc: "Величественный торговый дом на перекрестке торговли в Индийском океане, где арабские, персидские и индийские купцы обмениваются богатствами трех континентов." #NT!
 nd_guj_jama_masjid: "Джама Масджид" #NT!
 nd_guj_jama_masjid_desc: "Великолепная соборная мечеть в индо-исламском стиле, служащая одновременно центром поклонения и центром религиозного обучения." #NT!
 nd_guj_mandvi: "Таможня Мандви" #NT!
 nd_guj_mandvi_desc: "Здание портовой администрации, которое собирает пошлины и контролирует морскую торговлю, обеспечивая упорядоченную торговлю и набор военно-морских сил." #NT!
 nd_guj_dye_works: "Красильный завод Рангрез" #NT!
 nd_guj_dye_works_desc: "Промышленное предприятие по переработке индиго, куркумы и других красителей, используемых в знаменитой текстильной промышленности Гуджарата." #NT!
 nd_guj_hundi_house: "Банковский дом Хунди" #NT!
 nd_guj_hundi_house_desc: "Финансовое учреждение, специализирующееся на векселях и морском страховании, соединяющее торговцев Гуджарата с банковскими сетями по всему Индийскому океану." #NT!
 nd_guj_cotton_mill: "Гуджаратская хлопковая фабрика" #NT!
 nd_guj_cotton_mill_desc: "Протоиндустриальная текстильная фабрика, где механизированное джинирование, чесание и прядение превращают хлопок-сырец в ткань в беспрецедентных масштабах." #NT!
 nd_guj_vav_upkeep: "Техническое обслуживание Степвелла" #NT!
 nd_guj_vav_upkeep_desc: "Камень и инструменты для ухода за искусно вырезанными галереями и водными каналами ступенчатого колодца." #NT!
 nd_guj_karkhana_operations: "Кархана Припасы" #NT!
 nd_guj_karkhana_operations_desc: "Красители и шелк-сырец перерабатываются в изысканные ткани в королевских текстильных мастерских." #NT!
 nd_guj_emporium_costs: "Эксплуатационные расходы торгового центра" #NT!
 nd_guj_emporium_costs_desc: "Строительные материалы и товары для содержания торговых складов и счетных домов." #NT!
 nd_guj_masjid_upkeep: "Содержание мечети" #NT!
 nd_guj_masjid_upkeep_desc: "Камень, ткань и благовония для текущего обслуживания, молитвенных церемоний и украшения общинной мечети." #NT!
 nd_guj_mandvi_operations: "Таможенные операции" #NT!
 nd_guj_mandvi_operations_desc: "Древесина для докового ремонта, бумага для таможенного учета и отгрузочных манифестов, а также инструменты для обслуживания порта." #NT!
 nd_guj_dye_processing: "Обработка красителей" #NT!
 nd_guj_dye_processing_desc: "Растения индиго и другое сырье перерабатываются в яркие текстильные красители." #NT!
 nd_guj_hundi_operations: "Банковские операции" #NT!
 nd_guj_hundi_operations_desc: "Бумага и тонкая ткань для векселей, бухгалтерских книг и официальной корреспонденции, которые поддерживают сеть хунди." #NT!
 nd_guj_mill_operations: "Мельничные операции" #NT!
 nd_guj_mill_operations_desc: "Хлопок-сырец очищали и пряли в ткань с помощью машин, работающих на древесине." #NT!
 nd_guj_bandhani_dyeing: "Бандхани-окрашивание галстука" #NT!
 nd_guj_bandhani_dyeing_desc: "Традиционное гуджаратское искусство резистивного крашения, позволяющее создавать ткани с блестящими узорами с использованием красителей и ткани-основы." #NT!
 nd_guj_patola_double_ikat: "Патола Дабл-Икат" #NT!
 nd_guj_patola_double_ikat_desc: "Самая технически сложная текстильная технология в Индии, требующая месяцев для производства одной шелковой ткани с идеально выровненными узорами на обеих сторонах." #NT!
 nd_guj_mechanized_cotton: "Механизированная переработка хлопка" #NT!
 nd_guj_mechanized_cotton_desc: "Машины с приводом от воды превращают хлопок-сырец в ткань в беспрецедентных масштабах." #NT!
 levy_nd_guj_ghulam: "Гуламский кавалерийский отряд" #NT!
 levy_nd_guj_ghulam_desc: "Всадники-рабы, воспитанные из военных хозяйств султаната." #NT!
 nd_guj_formed_tt: "был образован Гуджарат." #NT!
 nd_guj_path_a_tt: "Выбрал султана суши и моря" #NT!
 nd_guj_path_b_tt: "Выбрали ворота Индийского океана" #NT!
 nd_guj_destiny: "Гуджарат Юнайтед" #NT!
 nd_guj_destiny_desc: "С формированием Гуджарата и восстановлением стабильности султанат готов следовать своей национальной судьбе. Будь то завоевание или торговля, будущее Гуджарата будет записано в анналах истории." #NT!
 nd_guj_dest_malwa_campaign: "Кампания в малва" #NT!
 nd_guj_dest_malwa_campaign_desc: "Плодородное плато Малва с его древними городами Манду и Удджайн манит армии Гуджарата. Контроль над этими внутренними районами обеспечит безопасность восточного фланга султаната и обеспечит сельскохозяйственное богатство, необходимое для продолжения завоеваний." #NT!
 nd_guj_dest_konkan_conquest: "Завоевание Конкана" #NT!
 nd_guj_dest_konkan_conquest_desc: "Побережье Конкан, простирающееся на юг от Гуджарата до Гоа, усеяно богатыми портами, попавшими под иностранный или конкурирующий контроль. Захват Чаула и Гоа даст султанату контроль над западной береговой линией Индии и лишит этих гаваней европейских нарушителей." #NT!
 nd_guj_dest_sultan_supreme: "Верховный Султан" #NT!
 nd_guj_dest_sultan_supreme_desc: "От Инда до Ганга, от Синда до самого Дели султан Гуджарата претендует на господство над сердцем субконтинента. Только удерживая эти древние центры власти, правитель Гуджарата может по-настоящему называть себя верховным." #NT!
 nd_guj_dest_cambay_revival: "Возрождение Камбея" #NT!
 nd_guj_dest_cambay_revival_desc: "Прежде чем Гуджарат сможет господствовать над Индийским океаном, он должен сначала возродить легендарное процветание Камбея. Обеспечьте поток хлопка через рынок капитала, наполните казну и превратите родину в достойную основу для коммерческого величия." #NT!
 nd_guj_dest_hormuz_gateway: "Ворота в Ормуз" #NT!
 nd_guj_dest_hormuz_gateway_desc: "Остров-крепость Ормуз контролирует вход в Персидский залив, самый богатый торговый путь в Индийском океане. Купцы Гуджарата издавна торговали там; теперь султанат должен полностью захватить его и установить прямой контроль над этим жизненно важным узким местом." #NT!
 nd_guj_dest_ocean_empire: "Империя Индийского океана" #NT!
 nd_guj_dest_ocean_empire_desc: "От Килвы на африканском побережье до Малакки у входа в Южно-Китайское море коммерческая империя Гуджарата охватывает весь Индийский океан. Контроль над этими отдаленными портами делает султанат бесспорным хозяином океанской торговли." #NT!
 nd_guj.6.t: "Гуджарат Юнайтед" #NT!
 nd_guj.6.d: "Земли Гуджарата объединены под одним знаменем. От солончаков Катча до тиковых лесов южных холмов, от древнего порта Камбей до возвышающихся доков Сурата — этот султанат владеет как богатствами земли, так и морской торговлей.\n\nПуть вперед — выбирать нам. Давайте строить на этом фундаменте и создавать судьбу, достойную нашего народа." #NT!
 nd_guj.6.a: "Наша судьба начинается сейчас." #NT!
 nd_guj.7.t: "Падение малва" #NT!
 nd_guj.7.d: "Наши армии прошли через перевалы Виндхья и водрузили знамя Гуджарата над древними городами малва. Крепость-столица Манду, расположенная на ее огромном плато, и священный город Удджайн, резиденция астрономов и ученых, теперь подчиняются султанату.\n\nПлодородные черноземные равнины малва будут кормить наши армии, а ее стратегическое положение открывает дорогу в центральную Индию. Султан суши и моря наступает." #NT!
 nd_guj.7.a: "Мальва наша. Кампания продолжается." #NT!
 nd_guj.8.t: "Конкан обеспечен" #NT!
 nd_guj.8.d: "Падение Чаула и Гоа предоставило Гуджарату непрерывный контроль над западной береговой линией Индии. Португальские фабрики и гарнизоны Декани были сметены. Наши флоты теперь беспрепятственно патрулируют от залива Кач до подступов к Малабару.\n\nПоскольку побережье Конкана защищено, султан должен решить, как лучше всего закрепить эти достижения. Должны ли мы обучать наших инженеров систематическому сокращению крепостей, превращая армию Гуджарата в главную осадную силу субконтинента? Или нам следует инвестировать в тяжелые военные корабли, чтобы продемонстрировать военно-морскую мощь через Аравийское море?" #NT!
 nd_guj.8.a: "Обучайте осадных инженеров, чтобы взломать любую крепость." #NT!
 nd_guj.8.b: "Постройте флот, чтобы господствовать в Аравийском море." #NT!
 nd_guj.9.t: "Верховный Султан" #NT!
 nd_guj.9.d: "От Татты на Инде до Дели на Ямуне султан Гуджарата теперь правит землями, которые когда-то принадлежали великим империям субконтинента. Древний султанат Дели, синдские порты дельты Инда, богатые равнины Индостана — все теперь признает верховенство Гуджарата.\n\nЭто вершина могущества Гуджарата. Теперь султан должен решить, как управлять этой огромной империей. Создадим ли мы великолепный императорский двор в традициях великих султанатов, внушая страх нашим подданным великолепием нашей администрации? Или мы будем править через сеть разведки и интриг, гарантируя, что ни одно восстание не укоренится незамеченным?" #NT!
 nd_guj.9.a: "Создайте императорский двор непревзойденного великолепия." #NT!
 nd_guj.9.b: "Правило посредством интеллекта и тонкого контроля." #NT!
 nd_guj.10.t: "Возрождение Камбея" #NT!
 nd_guj.10.d: "Порту Камбей (Хамбхат) возвращено его легендарное процветание. Тюки хлопка заполняют склады, торговцы толпятся на базарах, а с верфей доносится стук молотков. Казна Гуджарата переполнена прибылями от торговли, а сама земля была освоена для поддержки растущей торговли.\n\nЭто только начало. Индийский океан ждет." #NT!
 nd_guj.10.a: "Наши купцы пронесут знамя Гуджарата в каждый порт." #NT!
 nd_guj.11.t: "Жемчужина Персидского залива" #NT!
 nd_guj.11.d: "Остров-крепость Ормуз, господствующий над узким проливом, соединяющим Персидский залив с Индийским океаном, теперь развевается под знаменем Гуджарата. Каждый корабль, перевозящий персидские шелка, финики Аравии и лошадей Персидского залива, должен пройти под нашим прицелом.\n\nПосле того, как Ормуз захвачен, Гуджарат контролирует самый богатый узкий проход в торговой системе Индийского океана. Султан должен решить, как использовать это положение. Должны ли мы инвестировать в инфраструктуру, строя новые порты и склады, чтобы справиться с потоком торговли? Или мы должны расширить возможности наших торговых сообществ за рубежом, превратив гуджаратскую диаспору в сеть торговых князей, которые доминируют на отдаленных рынках?" #NT!
 nd_guj.11.a: "Стройте порты, достойные нашего нового владычества." #NT!
 nd_guj.11.b: "Предоставьте нашим торговцам возможность управлять отдаленными рынками." #NT!
 nd_guj.12.t: "Империя Индийского океана" #NT!
 nd_guj.12.d: "От Килвы на побережье Суахили до Малакки у входа в Южно-Китайское море коммерческая империя Гуджарата теперь охватывает весь Индийский океан. Гуджаратские торговцы сидят в конторах каждого крупного порта. Гуджаратские корабли доминируют на всех морских путях. Гуджаратские ткани, красители и специи заполняют рынки трех континентов.\n\nНи одна другая держава не достигла такого коммерческого господства над самым богатым океаном мира. Султан должен определить характер этой беспрецедентной империи. Будет ли Гуджарат править волнами как суверенная морская держава, проецирующая политическую власть за океан? Или нам следует усовершенствовать свою роль крупнейшего в мире производителя текстиля, одевая народы земли в гуджаратский хлопок и шелк?" #NT!
 nd_guj.12.a: "Мы будем суверенными над Индийским океаном." #NT!
 nd_guj.12.b: "Мир будет носить ткань Гуджарата." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_siege_masters: "Мастера осады" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_siege_masters: "Военные инженеры Гуджарата овладели искусством разрушения крепостей, обучают специализированных саперов и применяют разрушительные методы минирования против стен противника." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_arabian_sea_command: "Командование Аравийского моря" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_arabian_sea_command: "Флот Гуджарата доминирует в Аравийском море, тяжелые военные корабли патрулируют торговые пути и собирают дань с проходящих торговых судов." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_imperial_court: "Императорский двор Гуджарата" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_imperial_court: "Великолепная имперская администрация сосредоточена в дарбаре, где султан получает дань от вассальных королей и отправляет правосудие на обширных территориях." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_spymaster_sultan: "Мастер шпионов Султан" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_spymaster_sultan: "Султан управляет посредством обширной разведывательной сети, агенты которой внедрены в каждую провинцию и суд, гарантируя, что ни одна угроза не останется незамеченной." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_builder_of_ports: "Строитель портов" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_builder_of_ports: "Массивные инвестиции в портовую инфраструктуру торговой сети создают сеть построенных гуджаратцами гаваней, которые доминируют в торговле в Индийском океане." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_merchant_princes: "Торговая диаспора Гуджарата превратилась из торговых сообществ в политическую силу, при этом гуджаратские коммерческие князья контролируют рынки от Адена до Малакки." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_ocean_sovereign: "Океан Суверен" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_ocean_sovereign: "Гуджарат господствует в Индийском океане не просто как торговая держава, но и как политический суверен, с вассальными портами и подчиненными государствами, признающими морское превосходство султаната." #NT!
 STATIC_MODIFIER_NAME_nd_guj_dest_cloth_of_gold: "Золотая ткань" #NT!
 STATIC_MODIFIER_DESC_nd_guj_dest_cloth_of_gold: "Текстильная промышленность Гуджарата достигла мирового господства: гуджаратский шелк и изысканные ткани украшают элиту всех цивилизаций от Европы до Китая." #NT!
 nd_guj_darbar_i_khas: "Дарбар-и-Хас" #NT!
 nd_guj_darbar_i_khas_desc: "Великолепный императорский зал для аудиенций, где Верховный султан принимает дань от вассальных королей и вершит правосудие, символ владычества Гуджарата над субконтинентом." #NT!
 nd_guj_bandar_bozorg: "Бандар-э-Бозорг" #NT!
 nd_guj_bandar_bozorg_desc: "Большой портовый комплекс, служащий центральным узлом торговой империи Гуджарата в Индийском океане, с огромными складами, верфями и счетными домами, обслуживающими торговлю трех континентов." #NT!
 nd_guj_darbar_upkeep: "Дарбар Техническое обслуживание" #NT!
 nd_guj_darbar_upkeep_desc: "Прекрасные ткани, мебель и бумага для церемоний, записей и обстановки императорского зала аудиенций." #NT!
 nd_guj_bandar_operations: "Великие портовые операции" #NT!
 nd_guj_bandar_operations_desc: "Древесина, деготь, бумага и инструменты для текущего обслуживания доков, складов и военно-морских объектов великого порта." #NT!
  
  # ===== BUREAUCRACIES ===== 
 guj_mahajan_panchayat_bureaucracy: "Махаджан Панчаят" #NT!
 guj_mahajan_panchayat_bureaucracy_desc: "Суды торговых гильдий Банья, Лохана и Вора в Камбее, Сурате, Патане и Ахмедабаде. Советы махаджанов из пяти старейшин разрешали коммерческие споры на основе обычного торгового права и подписывали переводные векселя (хунди), по которым капитал перемещался через Индийский океан. И Султанат, и Могольский Субах Гуджарата признали юрисдикцию махаджанов в коммерческих вопросах; взамен махаджаны собирали ссуды для трона в моменты финансовой нужды, а великие банья Сурата становились молчаливыми партнерами всех заморских предприятий от Красного моря до Малаккского пролива." #NT!
 guj_khambhat_bandar_bureaucracy: "Хамбхат Бандар" #NT!
 guj_khambhat_bandar_bureaucracy_desc: "Офис Мутасадди-и-Бандара, главное таможенное управление Кхамбхата (Камбей), огромного средневекового торгового центра западной части Индийского океана и главного порта Султаната четырнадцатого века. Бандар взимал морские обычаи чаут-и-бахри с каждого груза лошадей из Ормуза, рабов из Занджа, специй из Малабара и шелка из Китая, проходивших через Хамбхатский залив. Сурат унаследовал этот аппарат после того, как в конце шестнадцатого века заилился камбейский рейд, но офис Мутасадди сохранился нетронутым до эпохи Великих Моголов." #NT!
 guj_pal_sea_levy_bureaucracy: "Pal Морской сбор защиты" #NT!
 guj_pal_sea_levy_bureaucracy_desc: "Налог на защиту прибрежного моря (пал или панчам), который гуджаратские купцы и прибрежные общины Катиавар платили флоту Султаната за сопровождение против малабарских пиратов, а после 1500 года — против португальских крейсеров, действующих из Диу и Гоа. Постоянный флот Султаната, состоящий из дау и гурабов, почти полностью финансировался из пожертвований друзей. Прибрежные деревни несли непропорционально большую сумму налога и горько возмущались этим, но система создала единственный военно-морской флот государства Индийского океана, который мог сражаться с португальцами примерно на равных условиях вплоть до катастрофы в Диу в 1509 году." #NT!
 guj_bohra_dawah_bureaucracy: "Бора Дават-и-Хадия" #NT!
 guj_bohra_dawah_bureaucracy_desc: "Институциональная администрация общины тайиби Мустаали исмаилитов, Даи аль-Мутлак которой действовала из Йемена, а после 1539 года - из Сидхпура и Сурата. Торговая диаспора Бора вела торговлю индиго, хлопчатобумажными тканями и селитрой на дальние расстояния в Индийском океане от Камбея до Адена, Мокко и Момбасы, при этом помосты собирали религиозные десятины и решали внутренние дела через своих собственных кади. Суннитский султанат с тревогой терпел эту сеть, потому что она привозила серебро и арабских лошадей; ортодоксальные улемы осудили это как шиитское отклонение от кафедр Ахмадабада." #NT!
 guj_begada_fortress_bureaucracy: "Система крепостей на холме Бегада" #NT!
 guj_begada_fortress_bureaucracy_desc: "Цепь укрепленных цитаделей на холмах (Чампанер, Павагад, Джунагад, Идар), которую Махмуд Бегада обеспечил между 1458 и 1511 годами в качестве основы территориального контроля Гуджарати. Каждый форт принадлежал амир-и-киле с гарнизоном из гуламской кавалерии и гвардейцев Хабши, а земельные гранты икта, поддерживающие гарнизоны, менялись, чтобы предотвратить образование наследственных крепостных владений. Чампанер некоторое время служил второй столицей; Система оказывала Султанату замечательное сопротивление армиям Великих Моголов до 1573 года и после этого оставалась инструментом внутреннего контроля Моголов Субаха." #NT!
 guj_darbari_brahmin_bureaucracy: "Совет дарбарских браминов" #NT!
 guj_darbari_brahmin_bureaucracy_desc: "Отличительная гуджаратская практика найма индуистских бухгалтеров и консультантов в диван-и-хальса, заимствованная из нагар-брахманов Ваднагара и аудич-брахманов северного Гуджарата. Диваны-брахманы вели ведомости доходов на гуджаратском языке и письменности, полученной на санскрите, являясь посредниками между персоязычным двором и сельскими индуистскими земледельцами, и пережили династические переходы, которые сместили их мусульманских собратьев. Могол Субах в Гуджарате формализовал эту практику; те же линии брахманов впоследствии без перерыва служили маратхам и Ост-Индской компании: институциональная преемственность индуистской бухгалтерской отчетности при каждом режиме." #NT!
  
 AUTO_MODIFIER_NAME_nd_guj_bureaucracy_authority: "Диваны султаната Гуджарата" #NT!
 AUTO_MODIFIER_DESC_nd_guj_bureaucracy_authority: "От канцелярии в Ахмадабаде и Бандаре в Камбае до судов махаджанов Сурата и киладаров-крепостей Чампанера — институты Гуджарата превратились в постоянный административный аппарат. Списки доходов султана, таможенные книги западных портов, реестры даватов Бора-дай и счета брахманских диванов теперь образуют непрерывный архив, который переживет любое отдельное правление." #NT!
