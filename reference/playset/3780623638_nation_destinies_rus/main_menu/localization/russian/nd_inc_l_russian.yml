l_russian:
 STATIC_MODIFIER_NAME_nd_children_of_inti: "Дети Инти" #NT!
 STATIC_MODIFIER_DESC_nd_children_of_inti: "Сапа Инка выступает как живой сын Солнца, и его воины маршируют под золотым знаменем Инти с непоколебимой преданностью. Божественный мандат империи вдохновляет на полную приверженность защите и расширению Тавантинсуйу." #NT!
 STATIC_MODIFIER_NAME_nd_lords_of_the_four_quarters: "Лорды Четырех Четвертей" #NT!
 STATIC_MODIFIER_DESC_nd_lords_of_the_four_quarters: "Гений Тавантинсуйу заключается не только в завоеваниях, но и в последующем управлении. С помощью трудовой системы мита, складов кулка и счетоводов кипу инки управляют крупнейшей империей в Америке с поразительной эффективностью." #NT!
 nd_inc.1.t: "Возвышение Тавантинсую" #NT!
 nd_inc.1.d: "Четыре четверти мира теперь подчиняются воле одного Сапа Инки. От холодных высот Альтиплано до дымящихся джунглей Анти-Сую, от засушливых побережий Кунти-Сую до обширных равнин Кулла-Сую — царство четырех частей объединено.\n\nПревращение маленького королевства в долине Куско в континентальную империю требует выбора. Будет ли Сапа Инка править как божественный сын Инти, связывающий свой народ религиозным рвением и военной силой? Или он должен доказать свой мандат посредством мастерского управления, объединив разрозненные народы Анд в единое процветающее государство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_inc.1.a: "Мы Дети Солнца!" #NT!
 nd_inc.1.b: "Четыре Четверти будут процветать как одно целое." #NT!
 nd_inc.2.t: "Реформы Пачакути" #NT!
 nd_inc.2.d: "Великий Сапа Инка Пачакути (Сотрясатель Земли, Преобразователь Мира) перестроил государство с самых основ. То, что когда-то было скромным королевством с центром в долине Куско, было реорганизовано в обширное Тавантинсуйу, царство четырех кварталов.\n\nПачакути перестроил Куско в форме пумы, установил систему из четырех сую, каждый из которых управлялся ВСУ, превратил трудовую службу мита в инструмент имперского строительства и систематизировал законы, которые объединяют сотню завоеванных народов в одну империю. Его военные кампании сокрушили народ Чанка и распространили владычество инков на Анды.\n\nНо будут ли его наследие помнить в первую очередь как завоевателя, создавшего империю посредством военного мастерства, или как строителя, чей административный гений создал самое организованное государство в доколумбовой Америке?" #NT!
 nd_inc.2.a: "Он потряс землю своими армиями." #NT!
 nd_inc.2.b: "Он превратил Куско в чудо света." #NT!
 STATIC_MODIFIER_NAME_nd_inc_earthshaker_legacy: "Наследие Землетряса" #NT!
 STATIC_MODIFIER_DESC_nd_inc_earthshaker_legacy: "Военный гений Пачакути вдохновляет наших командиров. Его тактика скоординированного нападения и психологической войны находит отклик в рядах армий Тавантинсуйу." #NT!
 STATIC_MODIFIER_NAME_nd_inc_builder_of_cusco: "Строитель Куско" #NT!
 STATIC_MODIFIER_DESC_nd_inc_builder_of_cusco: "Видение Пачакути восстановленного Куско (спланированного, упорядоченного, великолепного) побуждает наших архитекторов и администраторов построить империю, достойную Сапа Инки." #NT!
 nd_inc.3.t: "Отступление в Вилкабамбу" #NT!
 nd_inc.3.d: "Когда иностранные захватчики захватили Куско и разрушили старый порядок, сыновья Сапа Инки не сдались. Манко Инка отступил в облачные леса Вилькабамбы, основав государство неоинков, которое сопротивлялось почти сорок лет. Из этой отдаленной горной крепости последние инки совершали набеги на оккупантов, поддерживали старые церемонии и поддерживали пламя Тавантинсую.\n\nДух Вилкабамбы преподает два урока. Во-первых, горы и джунгли могут защитить людей от любого захватчика, а партизанское сопротивление может обескровить империю. Во-вторых, выживание иногда требует адаптации: изучения языка врага, использования его полезных инструментов и поиска союзников среди тех, кто также сопротивляется." #NT!
 nd_inc.3.a: "Горы – наша крепость." #NT!
 nd_inc.3.b: "Мы должны учиться у всех, кто приходит." #NT!
 STATIC_MODIFIER_NAME_nd_inc_spirit_of_vilcabamba: "Дух Вилкабамбы" #NT!
 STATIC_MODIFIER_DESC_nd_inc_spirit_of_vilcabamba: "Неповиновение неоинкского государства в Вилькабамбе продолжается. Наши воины знают, что горы сами сражаются вместе с ними и что ни один захватчик не сможет удержать то, что Анды решили вернуть себе." #NT!
 STATIC_MODIFIER_NAME_nd_inc_diplomatic_adaptation: "Дипломатическая адаптация" #NT!
 STATIC_MODIFIER_DESC_nd_inc_diplomatic_adaptation: "Прагматизм лидеров нео-инков (их готовность изучать иностранные языки, внедрять полезные технологии и создавать неожиданные союзы) усиливает способность Тавантинсую ориентироваться в меняющемся мире." #NT!
 nd_inc.4.t: "Наследие Тупака Амару" #NT!
 nd_inc.4.d: "Имя Тупака Амару стало объединяющим лозунгом во всех Андах. Будь то последний император инков, казненный иностранными завоевателями в 1572 году, или потомок метисов, поднявший сотни тысяч людей на восстание два столетия спустя, это имя олицетворяет отказ народов Анд принять порабощение.\n\nВосстание Тупака Амару II в 1780 году мобилизовало коренные общины по всему Перу и Боливии, до основания потрясая колониальное правление. Его видение заключалось в создании Андского государства, свободного от иностранного господства, в котором старые социальные структуры будут восстановлены, а достоинство коренных народов будет сохранено.\n\nЭто наследие предлагает два пути: огонь вооруженного восстания, который сметет все иностранное влияние, или терпеливую работу по построению солидарности между всеми андскими народами для создания государства, черпающего силу из их общего наследия." #NT!
 nd_inc.4.a: "Пусть огонь восстания горит!" #NT!
 nd_inc.4.b: "Наша сила – в нашем единстве." #NT!
 STATIC_MODIFIER_NAME_nd_inc_fire_of_rebellion: "Огонь восстания" #NT!
 STATIC_MODIFIER_DESC_nd_inc_fire_of_rebellion: "Революционный дух Тупака Амару проникает в наши армии. Каждый солдат знает, что он сражается не просто за короля, но за освобождение целого народа." #NT!
 STATIC_MODIFIER_NAME_nd_inc_andean_solidarity: "Андская солидарность" #NT!
 STATIC_MODIFIER_DESC_nd_inc_andean_solidarity: "Связи между андскими общинами (кечуа, аймара и всеми народами гор) составляют основу государства, которое черпает свою легитимность из общего наследия континента." #NT!
 nd_inc_qhapaq_nan: "Капак Нан" #NT!
 nd_inc_qhapaq_nan_desc: "Великая дорога инков, протянувшаяся через Анды протяженностью более 30 000 километров, обеспечивает быстрое перемещение армий, администраторов и торговых товаров по всей империи." #NT!
 nd_inc_ayllu_reciprocity: "Айллу взаимность" #NT!
 nd_inc_ayllu_reciprocity_desc: "Система коллективного труда и взаимных обязательств айллу формирует социальную основу государства инков, гарантируя, что ни одна семья не столкнется с трудностями в одиночку и что требования государства будут удовлетворены коллективными усилиями." #NT!
 nd_inc_sapa_inca_divinity: "Сапа Инка Божественность" #NT!
 nd_inc_sapa_inca_divinity_desc: "Статус Сапа Инки как живого сына Инти дает правителю империи неоспоримый религиозный авторитет, подкрепляемый строительством храмов и выполнением священных ритуалов." #NT!
 nd_inc_qullqa_logistics: "Кулка Логистика" #NT!
 nd_inc_qullqa_logistics_desc: "Обширная сеть государственных складов вдоль дорог инков гарантирует, что армии никогда не останутся голодными, что провинции, пострадавшие от стихийного бедствия, получат помощь, а излишки империи распределятся там, где они больше всего нужны." #NT!
 nd_inc_andean_metallurgy: "Андская металлургия" #NT!
 nd_inc_andean_metallurgy_desc: "Андские народы освоили обработку меди, олова и бронзы из их сплавов за столетия до контакта с европейцами. Мастера-металлисты инков производили оружие, инструменты и церемониальные предметы замечательного качества." #NT!
 nd_inc_waru_waru: "Вару Вару" #NT!
 nd_inc_waru_waru_desc: "Техника возделывания приподнятых полей вару-вару создает возвышенные посадочные поверхности, окруженные водными каналами, защищая посевы от мороза, улучшая дренаж и значительно увеличивая урожайность в сложных горных условиях." #NT!
 nd_inc_pachacuti_reforms: "Реформы Пачакути" #NT!
 nd_inc_pachacuti_reforms_desc: "Широкая реорганизация государства инков под руководством Пачакути (разделение империи на четыре сую, установление системы мита, восстановление Куско и кодификация имперского права) превратила региональное королевство в величайшую империю доколумбовой Америки." #NT!
 nd_inc_anti_suyu_expansion: "Расширение Анти-Сую" #NT!
 nd_inc_anti_suyu_expansion_desc: "Завоевание инками низменностей, расположенных в восточных джунглях, Анти-Сую, потребовало разработки совершенно новой военной тактики. Легкая пехота, обученная ведению боевых действий в джунглях, стала незаменимой для операций в густых тропических лесах к востоку от Анд." #NT!
 nd_inc_mit_a_imperial: "Императорская Мита" #NT!
 nd_inc_mit_a_imperial_desc: "Расширение налога на рабочую силу мита во всеобъемлющую систему государственного труда позволяет строить дороги, террасы, склады и крепости по всей империи, превращая каждого гражданина в строителя Тавантинсуйу." #NT!
 nd_inc_capacocha_ritual: "Ритуал Капакоча" #NT!
 nd_inc_capacocha_ritual_desc: "Церемония капакоча, самый священный ритуал государства инков, посвящает самые важные моменты существования империи: приход на престол нового Сапа Инки, великие военные победы или времена кризиса. Детей со всех четырех сую привозят в Куско перед возвращением в свои родные провинции, связывая периферию с центром через общий священный опыт." #NT!
 nd_inc_yanacona_service: "Янакона Сервис" #NT!
 nd_inc_yanacona_service_desc: "Янакона, слуги государства, освобожденные от обязательств айллу, образуют преданный класс администраторов, ремесленников и дорожников, которые напрямую служат Сапа Инке, обеспечивая империю лояльными кадрами квалифицированных профессионалов." #NT!
 nd_inc_vilcabamba_resistance: "Сопротивление Вилкабамбы" #NT!
 nd_inc_vilcabamba_resistance_desc: "Государство нео-инков в Вилькабамбе просуществовало почти четыре десятилетия в облачных лесах, доказав, что андские народы могут противостоять даже самым могущественным захватчикам, используя свои знания горной местности и партизанскую тактику." #NT!
 nd_inc_highland_gunpowder: "Хайлендский порох" #NT!
 nd_inc_highland_gunpowder_desc: "Адаптация огнестрельного оружия для ведения войны в горах требует иной тактики, чем для боя в равнине. На высоте звук разносится дальше, порох горит по-другому, а разреженный воздух влияет как на дальность, так и на точность. Мушкетеры инков справляются с этими задачами благодаря тщательной подготовке в горных условиях." #NT!
 nd_inc_tocricuc_administration: "Администрация Токричук" #NT!
 nd_inc_tocricuc_administration_desc: "Токрикуки, губернаторы провинций, назначаемые Сапа Инками, служат глазами, ушами и руками центрального правительства в каждом уголке империи. Их власть обеспечивает выполнение имперских указов и соблюдение местных требований." #NT!
 nd_inc_silver_mountain: "Серебряная гора" #NT!
 nd_inc_silver_mountain_desc: "Анды содержат одни из самых богатых месторождений серебра и драгоценных металлов на земле. Развитие передовых технологий добычи и плавки превращает эти горные богатства в экономическую основу имперской казны." #NT!
 nd_inc_inca_road_renewal: "Обновление дороги инков" #NT!
 nd_inc_inca_road_renewal_desc: "Восстановление и расширение древней дорожной сети Капак Нан обеспечивает быструю связь и передвижение войск по обширной территории Анд, связывая вместе четыре квартала, как это было в золотой век империи.\n\n#italic Доступно в: $nd_inc_mita_workshop$#!" #NT!
 nd_inc_neo_inca_reform: "Реформа нео-инков" #NT!
 nd_inc_neo_inca_reform_desc: "Опираясь как на древние традиции инков, так и на современную военную науку, реформированная Тавантинсуйу создает дисциплинированные постоянные силы, способные защитить высокогорье от любого захватчика." #NT!
 nd_inc_andean_textile_trade: "Андская текстильная торговля" #NT!
 nd_inc_andean_textile_trade_desc: "Хайлендская шерсть и хлопок, сотканные в Андах, становятся востребованными товарами. Качество андского текстиля, унаследовавшего тысячелетнюю традицию, может соперничать с лучшими тканями любой цивилизации.\n\n#italic Доступно в: $nd_inc_textile_obraje$#!" #NT!
 nd_inc_tupac_amaru_legacy: "Тупак Амару Наследие" #NT!
 nd_inc_tupac_amaru_legacy_desc: "Имя Тупака Амару эхом отдается сквозь века: от последнего императора, обезглавленного на площади Куско, до великого восстания 1780 года, которое потрясло колониальное правление до основания. Это наследие сопротивления вдохновляет новое поколение андских воинов." #NT!
 nd_inc_andean_terrace_renewal: "Обновление Андской террасы" #NT!
 nd_inc_andean_terrace_renewal_desc: "Древние террасные системы восстанавливаются и расширяются с использованием современных сельскохозяйственных знаний, что резко увеличивает производство продуктов питания в горных регионах и кормит растущее население." #NT!
 nd_inc_mountain_artillery: "Горная артиллерия" #NT!
 nd_inc_mountain_artillery_desc: "Размещение артиллерии на горных перевалах и возвышенных укреплениях создает практически неприступные оборонительные позиции. Ни одна армия не может штурмовать Андскую крепость, не заплатив ужасную цену кровью." #NT!
 nd_inc_apu_governance: "Управление ВСУ" #NT!
 nd_inc_apu_governance_desc: "Священные апусы, горные духи, почитаемые в Андах, привлекаются к управлению каждым сую. Провинциальные администраторы черпают легитимность из своей связи с этими священными вершинами, сочетая духовную власть с практическим управлением." #NT!
 nd_inc_tawantinsuyu_restored: "Тавантинсую восстановлено" #NT!
 nd_inc_tawantinsuyu_restored_desc: "Царство четырех сторон света вновь возрождается с современной армией, достойной своих древних амбиций. Дисциплинированные полки, обученные вести войну как в горах, так и в низменностях, несут знамя Тавантинсуйу в новую эру." #NT!
 nd_inc_andean_enlightenment: "Андское Просвещение" #NT!
 nd_inc_andean_enlightenment_desc: "Ячай васи, дома обучения, распространяют грамотность и знания по всем Андам, создавая новое поколение образованных администраторов, ученых и философов, которые опираются как на местную мудрость, так и на знания всего мира." #NT!
 nd_inc_industrial_andes: "Промышленные Анды" #NT!
 nd_inc_industrial_andes_desc: "Богатые минеральные ресурсы Анд (медь, олово, серебро, золото) обрабатываются с помощью современных технологий плавки, превращая горы в промышленный центр возрождающегося Тавантинсуйу.\n\n#italic Доступно в: $nd_inc_mita_workshop$#!" #NT!
 nd_inc_inti_raymi_revival: "Возрождение Инти Райми" #NT!
 nd_inc_inti_raymi_revival_desc: "Великий Фестиваль Солнца, Инти Райми, возрождается как высший культурный праздник Тавантинсуйу, привлекающий паломников со всех четырех сторон света в Куско на девять дней церемоний, пиршеств и возобновления божественного мандата империи." #NT!
 nd_inc_modern_chasqui: "Современный Часки" #NT!
 nd_inc_modern_chasqui_desc: "Древняя система ретрансляционных каналов, которая когда-то передавала сообщения через Анды с поразительной скоростью, модернизируется за счет почтовых станций, сигнальных вышек и организованных курьерских сетей, гарантируя, что слово Сапа Инки без промедления достигнет каждого уголка королевства." #NT!
 nd_inc_sovereign_andes: "Суверенные Анды" #NT!
 nd_inc_sovereign_andes_desc: "Анды представляют собой суверенную державу, их армии дисциплинированы, их народ сплочен, а горы непокорены. Дети Солнца вернули себе свою судьбу и создали государство, которое не сможет подчинить себе ни одна иностранная держава." #NT!
 a_nd_inc_runa_infantry: "Руна Пехота" #NT!
 a_nd_inc_runa_infantry_desc: "Набираемая по трудовой системе мита, пехота руна составляет костяк армии инков. Эти простые солдаты привносят закаленную в горах выносливость и непоколебимую преданность службе Сапа Инке." #NT!
 a_nd_inc_slinger: "Инки-пращники" #NT!
 a_nd_inc_slinger_desc: "Обученные с детства в горных деревнях, пращники инков могут метать камни с разрушительной точностью со скоростью, превышающей 100 километров в час. Их дальние залпы смягчают вражеские порядки перед началом основного штурма." #NT!
 a_nd_inc_anti_suyu_warrior: "Анти-Сую Воины" #NT!
 a_nd_inc_anti_suyu_warrior_desc: "Эти специалисты по ведению боевых действий в джунглях, эта легкая пехота набирается на восточной границе империи. Они превосходны в засадах, быстром движении через густую растительность и бою на местности, где не могут действовать тяжелые формирования." #NT!
 a_nd_inc_highland_musketeer: "Хайленд Мушкетеры" #NT!
 a_nd_inc_highland_musketeer_desc: "Наученные обращаться с огнестрельным оружием на высоте, где порох горит по-другому, а разреженный воздух влияет на баллистику, горные мушкетеры сочетают точность, необходимую для ведения боевых действий в горах, с разрушительной огневой мощью порохового оружия." #NT!
 a_nd_inc_mountain_guard: "Горная стража" #NT!
 a_nd_inc_mountain_guard_desc: "Элитные защитники Андских перевалов, Горная гвардия обучены удерживать позиции, несмотря на превосходящие силы противника. Их знание горной местности в сочетании с современным оборудованием и железной дисциплиной делает их грозными противниками в оборонительных боях." #NT!
 a_nd_inc_tawantinsuyu_regiment: "Тавантинсийский полк" #NT!
 a_nd_inc_tawantinsuyu_regiment_desc: "Эти полки, являющиеся главной боевой силой восстановленной Империи инков, сочетают в себе древние андские военные традиции и современную военную науку. Они с одинаковым мастерством сражаются как на горных перевалах, так и на открытых равнинах." #NT!
 nd_inc_coricancha: "Кориканча" #NT!
 nd_inc_coricancha_desc: "Храм Солнца, стены которого когда-то были покрыты золотом, служит духовным сердцем Тавантинсуйу. На его территории Уиллак Уму и его жрецы поддерживают священные огни и проводят ритуалы, связывающие империю с ее божественным покровителем." #NT!
 nd_inc_imperial_qullqa: "Императорская Кулка" #NT!
 nd_inc_imperial_qullqa_desc: "Государственные склады заполнены сушеным картофелем, кукурузой, киноа и военными припасами. Сеть кулка гарантирует, что ни одна провинция не столкнется с голодом и что армии можно будет кормить во время любой кампании, олицетворяя перераспределительный гений экономики инков." #NT!
 nd_inc_mita_workshop: "Мита Мастерская" #NT!
 nd_inc_mita_workshop_desc: "Организованная государством мастерская, где рабочие миты производят товары под имперским руководством. Металлообработка, каменная кладка и ткачество выполняются с эффективностью организованного труда, превращая сырье в орудия империи." #NT!
 nd_inc_silver_foundry: "Серебряный литейный завод" #NT!
 nd_inc_silver_foundry_desc: "Современное плавильное предприятие для переработки богатых серебряных и медных руд Анд. Используя традиционные ветряные печи хуайра, дополненные современными технологиями, эти литейные заводы превращают горные богатства в имперские сокровища." #NT!
 nd_inc_textile_obraje: "Андский Обрайе" #NT!
 nd_inc_textile_obraje_desc: "Горная текстильная мастерская, производящая изысканные ткани из шерсти ламы и альпаки. Традиции андского ткачества, насчитывающие тысячи лет, позволяют производить ткани исключительного качества, которые продаются по премиальным ценам на рынках всего мира." #NT!
 nd_inc_yachay_wasi: "Ячай Васи" #NT!
 nd_inc_yachay_wasi_desc: "Дом обучения, где знания об Андах (астрономия, сельское хозяйство, медицина, инженерное дело и управление) преподаются наряду с изучением всего мира. Ячай васи сохраняет и передает интеллектуальное наследие Тавантинсуйу." #NT!
 nd_inc_coricancha_maintenance: "Храмовые подношения" #NT!
 nd_inc_coricancha_maintenance_desc: "Серебро, краски и благовония приносятся в жертву, чтобы сохранить священные территории Кориканчи и почтить Инти." #NT!
 nd_inc_qullqa_maintenance: "Условия хранения" #NT!
 nd_inc_qullqa_maintenance_desc: "Стабильные запасы картофеля, кукурузы и инструментов наполняют имперскую куллу, готовую к перераспределению по всей империи." #NT!
 nd_inc_mita_workshop_maintenance: "Материалы семинара" #NT!
 nd_inc_mita_workshop_maintenance_desc: "Рабочие Миты перерабатывают медь и шерсть в инструменты и инвентарь для государства." #NT!
 nd_inc_silver_foundry_maintenance: "Плавка топлива" #NT!
 nd_inc_silver_foundry_maintenance_desc: "Ветряные печи уайра переплавляли андские руды в рафинированное серебро с помощью древесного угля и медного флюса." #NT!
 nd_inc_obraje_maintenance: "Ткацкие материалы" #NT!
 nd_inc_obraje_maintenance_desc: "Шотландская шерсть и натуральные красители используются для создания изысканного андского текстиля исключительного качества." #NT!
 nd_inc_yachay_wasi_maintenance: "Академические принадлежности" #NT!
 nd_inc_yachay_wasi_maintenance_desc: "Бумагу, красители и книги потребляют студенты и ученые, обучающиеся в Ячай Васи." #NT!
 nd_inc_road_maintenance: "Содержание Капак Нана" #NT!
 nd_inc_road_maintenance_desc: "Камень, волоконная веревка и инструменты для непрерывного ремонта и обслуживания великой дорожной сети инков." #NT!
 nd_inc_terrace_intensification: "Возделывание террасы" #NT!
 nd_inc_terrace_intensification_desc: "Картофель, кукуруза и инструменты обеспечивают интенсивное выращивание и поддержание системы террас Анд." #NT!
 nd_inc_andean_smelting: "Андская плавка" #NT!
 nd_inc_andean_smelting_desc: "Медеплавильные заводы Хайленда перерабатывают медную руду с древесным углем в инструменты и металлоконструкции." #NT!
 levy_nd_inc_runa_infantry: "Руна Леви" #NT!
 levy_nd_inc_runa_infantry_desc: "Крестьяне-призывники, воспитанные в рамках трудовой повинности мита, составляли массовую пехоту армий инков." #NT!
 nd_inc_formed_tt: "Инка была основана" #NT!
 nd_inc_path_a_tt: "Избранные дети Инти" #NT!
 nd_inc_path_b_tt: "Выбрать Лордов Четырех Четвертей" #NT!
 nd_inc_destiny: "Судьба Тавантинсую" #NT!
 nd_inc_destiny_desc: "Империя инков восстановлена. Когда четыре квартала объединились под единым Сапа Инкой, пришло время осуществить великую судьбу Тавантинсую: будь то посредством божественного завоевания или мастерского управления." #NT!
 nd_inc_dest_coast: "Мастера побережья" #NT!
 nd_inc_dest_coast_desc: "Великие прибрежные королевства Чан-Чан и Арекипа должны подчиниться воле Сапа Инки. Завоюйте эти древние центры и докажите божественный мандат детей Инти силой оружия." #NT!
 nd_inc_dest_quarters: "Четыре четверти расширенные" #NT!
 nd_inc_dest_quarters_desc: "Выжмите границы Тавантинсую до их естественных пределов. Северная граница должна достичь Кито, а южная граница Альтиплано с центром в священном Тиуанако должна признать владычество инков Сапа." #NT!
 nd_inc_dest_tawantin: "Империя Солнца" #NT!
 nd_inc_dest_tawantin_desc: "Высшее достижение детей Инти: континентальная империя, простирающаяся от Тумбеса на тихоокеанском побережье до границы Атакамы в Арике, с Чукияпу, закрепленным в центре страны. Никакая сила на земле не сможет бросить вызов Тавантинсую." #NT!
 nd_inc_dest_quipu: "Экономика Кипу" #NT!
 nd_inc_dest_quipu_desc: "Гений администрации инков заключался в ее способности управлять огромной экономикой без валюты и письменности. Теперь используйте современные финансовые институты, сохраняя при этом перераспределительный дух системы кипу. Обеспечить потоки серебра через рынки капитала." #NT!
 nd_inc_dest_tampu: "Сеть Тампу" #NT!
 nd_inc_dest_tampu_desc: "Расширить сеть государственных перевалочных станций и складов в комплексную экономическую инфраструктуру. Развивайте ресурсы королевства и используйте профессиональную военную организацию, чтобы защитить это процветание." #NT!
 nd_inc_dest_suyu: "Сердце Четырех Сую" #NT!
 nd_inc_dest_suyu_desc: "Кульминация административного гения Тавантинсуйу: государство настолько процветающее и хорошо управляемое, что становится экономическим сердцем континента. Примите научную революцию, накопите богатство и обеспечьте потоки золота через рынки империи." #NT!
 nd_inc.5.t: "Судьба Тавантинсую" #NT!
 nd_inc.5.d: "Четыре четверти снова объединены, и взгляд Сапа Инки обращен к горизонту. То, что началось как восстановление древней славы, теперь требует большего видения: судьбы, достойной избранного народа Инти. Дальнейший путь определит, запомнят ли Тавантинсую как самую могущественную империю Америки или как самое блестяще управляемое государство, которое когда-либо видел мир." #NT!
 nd_inc.5.a: "Наша судьба ждет." #NT!
 nd_inc.6.t: "Прибрежные королевства подчиняются" #NT!
 nd_inc.6.d: "Великие глинобитные города побережья (Чан-Чан в Чиму, террасные поселения Арекипы) теперь несут знамя Тавантинсуйу. Там, где когда-то независимые королевства контролировали богатые рыболовные угодья и орошаемые долины Тихоокеанского побережья, теперь власть Сапа Инков простирается от горных вершин до самого океана.\n\nЗавоевание побережья дает Тавантинсуйу доступ к ресурсам, которые одно только высокогорье никогда не могло обеспечить: морские богатства, орошаемые хлопковые поля и стратегическая глубина империи, разделенной на два фронта." #NT!
 nd_inc.6.a: "Берег подчиняется воле Инти." #NT!
 nd_inc.7.t: "Расширение Четырех Четвертей" #NT!
 nd_inc.7.d: "Благодаря тому, что Кито был закреплен на севере, а священный Тиуанако оказался под знаменем орла на юге, Тавантинсую превзошел самые смелые мечты первых инков Сапа. Империя теперь охватывает климатические зоны от экваториальной жары до холодного Альтиплано.\n\nЭто огромное расширение требует выбора того, как империя поддерживает свою военную мощь. Должны ли Сапа Инки отдать приоритет быстрой мобилизации новых армий с завоеванных территорий или создать разведывательную сеть, чтобы предвидеть угрозы до того, как они материализуются?" #NT!
 nd_inc.7.a: "Мобилизуйте покоренные народы." #NT!
 nd_inc.7.b: "Знания – самое острое оружие." #NT!
 nd_inc.8.t: "Империя Асцендента Солнца" #NT!
 nd_inc.8.d: "От Тумбеса на тропическом севере до засушливой границы в Арике, от горной столицы Куску до крепости Чукияпу на Альтиплано, Тавантинсую достиг того, чего не достиг ни один другой американский штат: континентального владычества под властью единого божественного правителя.\n\nЭто высшее достижение требует доктрины поддержания вечного превосходства. Должна ли империя занять позицию постоянной готовности к тотальной войне, сокрушая любую угрозу до того, как она сможет вырасти? Или же ему следует превратить свои горные твердыни в неприступную защитную сеть, сделав любое вторжение в Анды самоубийственным?" #NT!
 nd_inc.8.a: "Мы сокрушим всех, кто бросает нам вызов." #NT!
 nd_inc.8.b: "Горы – наш вечный щит." #NT!
 nd_inc.9.t: "Кипу считается правдой" #NT!
 nd_inc.9.d: "Кипукамайоки, хранители узловатых шнуров, долгое время управляли самой сложной экономикой доколумбовой Америки без письменности и чеканки денег. Теперь, когда современные финансовые институты укоренились в Андах, административный гений системы кипу сливается с банковской и рыночной экономикой.\n\nСеребро из горных рудников течет через рынки капитала, а перераспределительная традиция государства инков адаптируется к требованиям монетизированной экономики. Результатом является нечто беспрецедентное: империя, сочетающая в себе систему социальной защиты общественного перераспределения с динамизмом рыночного обмена." #NT!
 nd_inc.9.a: "Кипу и монета служат одному хозяину." #NT!
 nd_inc.10.t: "Сеть Тампу завершена" #NT!
 nd_inc.10.d: "Сеть государственных перевалочных станций, тампу, теперь простирается через каждый уголок Тавантинсуйу, образуя коммерческий и логистический центр, связывающий четыре квартала в единую экономическую единицу. Каждое тампу одновременно является складом, рынком, станцией отдыха для путешественников и административным форпостом.\n\nЭта инфраструктура может служить разным целям. Он может стать основой интегрированной рыночной системы Анд, привлекающей торговцев со всего континента, или может послужить в первую очередь инструментом дипломатии, расширяя сферу влияния Тавантинсуйу далеко за пределы его границ." #NT!
 nd_inc.10.a: "Пусть рынки процветают в каждом тампу." #NT!
 nd_inc.10.b: "Наши дороги несут не только товары, но и влияние." #NT!
 nd_inc.11.t: "Сердце Четырех Сую" #NT!
 nd_inc.11.d: "Тавантинсую добился того, о чем Сапа Инка Пачакути мог только мечтать: империя настолько богатая, настолько эффективно управляемая и настолько глубоко укоренившаяся в знаниях как древних андских традиций, так и современной науки, что она является экономическим сердцем всего континента.\n\nЗолото и серебро текут через рынки империи. Кипукамайоки теперь работают вместе с обученными администраторами. Научная революция пустила корни в академиях ячай васи. Представляются два видения будущего: континентальная гегемония посредством дипломатического и экономического доминирования или усовершенствованное государство перераспределения, которое станет моделью для всех цивилизаций." #NT!
 nd_inc.11.a: "Мы возглавим континент." #NT!
 nd_inc.11.b: "Государство должно обеспечить всех." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_rapid_mobilization: "Быстрая мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_rapid_mobilization: "Система труда мита адаптирована к военному призыву, который может собирать армии по четырем кварталам с необычайной скоростью, хотя отвлечение рабочей силы от торговли ослабляет торговые сети." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_imperial_scouts: "Имперские разведчики" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_imperial_scouts: "Сеть ретрансляторов часки перепрофилируется в разведывательный аппарат, с поразительной скоростью передавая сообщения о передвижениях противника и иностранных интригах через Анды." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_total_war: "Доктрина тотальной войны" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_total_war: "Империя принимает доктрину постоянной готовности к войне, поддерживая резервы наемников и ускоряя военные действия за счет увеличения заимствований для поддержания военной экономики." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_mountain_fortress: "Доктрина Горной крепости" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_mountain_fortress: "Сами Анды становятся оружием. Горные перевалы укреплены, сети гарнизонов расширены, а разведывательные операции ужесточены, что делает любое вторжение в Тавантинсую непомерно дорогостоящим." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_andean_markets: "Интеграция Андского рынка" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_andean_markets: "Сеть тампу становится основой рыночной системы, охватывающей континент. Торговые мощности расширяются, инфляция стабилизируется, и даже самые маленькие айллу получают выгоду от гарантированного минимального торгового дохода." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_road_diplomacy: "Дорожная дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_road_diplomacy: "Дорожная сеть Капак Нан расширяет дипломатические возможности Тавантинсуйу далеко за пределы его границ, позволяя посольствам и торговым миссиям отправляться в отдаленные страны, хотя внешнее фокусирование приводит к тому, что силы гарнизона истощаются." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_continental_hegemon: "Континентальный гегемон" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_continental_hegemon: "Тавантинсую представляет собой неоспоримую экономическую и дипломатическую мощь континента, его престиж привлекает вассалов, а его администраторы умеют объединять завоеванные народы." #NT!
 STATIC_MODIFIER_NAME_nd_inc_dest_redistributive_state: "Перераспределительное государство" #NT!
 STATIC_MODIFIER_DESC_nd_inc_dest_redistributive_state: "Древний принцип перераспределения инков усовершенствован: налоги собираются справедливо, города растут органично, и каждый гражданин продвигается вперед благодаря заслугам. Государство обеспечивает, а народ процветает." #NT!
 nd_inc_inti_huasi_wamani: "Инти Хуаси Вамани" #NT!
 nd_inc_inti_huasi_wamani_desc: "Дом Войны Солнца: священный военный комплекс, где воины получают благословение Инти перед тем, как отправиться в бой. В его стенах командиры планируют кампании под золотыми солнечными дисками, а солдаты тренируются среди алтарей, где подношения обеспечивают божественную победу." #NT!
 nd_inc_imperial_tampu: "Империал Тампу" #NT!
 nd_inc_imperial_tampu_desc: "Величественная государственная пересадочная станция на реке Капак-Нан, служащая одновременно складом, рынком, административным центром и залом дипломатических приемов. Тампу воплощает организационный гений Тавантинсую: все, что нужно государству, сосредоточено в одном эффективном комплексе." #NT!
 nd_inc_inti_huasi_maintenance: "Подношения храма войны" #NT!
 nd_inc_inti_huasi_maintenance_desc: "Оружие, ткань и пчелиный воск поддерживают священные ритуалы и боевые приготовления Инти Хуаси Вамани." #NT!
 nd_inc_tampu_maintenance: "Положения путевой станции" #NT!
 nd_inc_tampu_maintenance_desc: "Соль, инструменты и шерсть снабжают склады Имперского Тампу, торговые операции и административные функции." #NT!
  
 AUTO_MODIFIER_NAME_nd_inc_bureaucracy_authority: "Тавантинсую Аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_inc_bureaucracy_authority: "Институты государства инков (божественный Сапа Инка, возглавлявший его преемственность кланов панака, провинция четырех сую с центром в Куско, регистраторы кипу, вахтовый трудовой сбор мита, система переселения митма, замкнутый Аклауаси и великая дорожная сеть Капак Нан) превратились в последовательный административный аппарат. На этом фундаменте отличительные институты Андского имперского правления Тавантинсуйу начинают принимать свою прочную форму." #NT!
  
 inc_panaqa_system_bureaucracy: "Сапа Инка и система Панака" #NT!
 inc_panaqa_system_bureaucracy_desc: "Правитель инков был божественным сыном Солнца Инти, и после его смерти его дом, земли, дворцы и мумифицированное тело стали панакой: королевской корпорацией, которой было поручено поддерживать его культ навсегда. Каждому новому Сапа Инке приходилось строить свое поместье с нуля, поскольку богатство его предшественника было навсегда заперто в панаке умершего. В период поздней империи при Уайне Капаке и Уаскаре (ок. 1493–1532) одиннадцать существовавших панак долины Куско в совокупности владели большим количеством земли, большим количеством вассалов и большим количеством священных дней в календаре, чем сам правящий император, и конфликт между живым монархом и совокупностью мертвых начал поглощать династию." #NT!
  
 inc_four_suyu_governorate_bureaucracy: "Губернаторство Тавантинсую Четыре-Сую" #NT!
 inc_four_suyu_governorate_bureaucracy_desc: "Название империи было Тавантинсую, что означает четыре объединенных региона: Чинчайсую на северо-западе, Антисую в восточной Монтане, Колласую, простирающуюся на юг до Мауле, и Кунтисую, идущую до побережья Тихого океана. Каждым сую управлял ВСУ, набранный из близких родственников Сапа Инков, который координировал работу королевских инспекторов провинции Тукуйрикок и руководил подчиненными им местными лордами Курака. Разделение на четыре сую превратило завоеванные Андские царства в единую понятную административную геометрию, сосредоточенную на центральной площади Куско, пупе мира." #NT!
  
 inc_quipucamayoc_bureaucracy: "Регистраторы Кипукамайока" #NT!
 inc_quipucamayoc_bureaucracy_desc: "Империя жила без письменности на узловатых шнурах, называемых кипу, чьи слои, цвета, типы узлов и положения узлов кодировали данные переписи населения, распределение дани, ротацию мит'а и династическую хронологию. Кипукамайок были специалистами-администраторами, прошедшими обучение в школах ячай васи в Куско и выходцами из знатных семей и детей завоеванных куракас; только они могли читать шнуры. Система отслеживала численность населения каждого айллу в королевстве с десятичной степенью детализации (декурия, столетие, полтысячи, тысячи) и была незаменимой основой каждого налогового назначения инков, рабочей ведомости и военных сборов." #NT!
  
 inc_mita_levy_bureaucracy: "Вахтовый трудовой сбор Mit'a" #NT!
 inc_mita_levy_bureaucracy_desc: "Каждый взрослый мужчина завоеванного айлуса каждый год был обязан Сапа Инке фиксированную ротацию рабочей силы: на государственных землях, в шахтах региона Потоси, на дороге Капак Нан, в королевских зернохранилищах Куско и Кито, а также на сезонной военной службе. Отдельная каста Янакуна обеспечивала штатных дворцовых и элитных слуг вне ротации. Мита предоставила рабочую силу, которая построила Саксайуаман, Мачу-Пикчу и всю имперскую дорожную сеть менее чем за столетие, но это была обязанность айллу, а не отдельного человека, и она становилась жестокой, когда ротация приходилась на сообщество, уже истощенное засухой или войной." #NT!
  
 inc_mitma_resettlement_bureaucracy: "Система переселения Митма" #NT!
 inc_mitma_resettlement_bureaucracy_desc: "Когда регион сопротивлялся присоединению или имел стратегическую ценность, государство инков перемещало все население. Верные айллу, говорящие на языке кечуа, из центра Куско были переселены на завоеванную территорию, а завоеванное население, в свою очередь, было разбито на фрагменты и расселено по всей империи от побережья Атакамы до эквадорской Сьерры. Митма одновременно ослабила местную этническую сплоченность, распространила имперский язык кечуа и дала каждой мятежной зоне противовес лояльных короне поселенцев. Это был самый агрессивный инструмент формирования государства в Андах, и он оставил постоянный демографический отпечаток, заметный в современном распространении кечуа на западе Южной Америки." #NT!
  
 inc_acllahuasi_bureaucracy: "Аклауаси" #NT!
 inc_acllahuasi_bureaucracy_desc: "Дом Избранных Женщин, где дочери провинциальных курака, выбранные за их красоту и происхождение, с десяти лет были заперты в монастыре, чтобы ткать ткани компи для Сапа Инки, варить чичу для государственных праздников Инти и служить жрицами в храмах Солнца. Некоторые стали второстепенными женами императора; большинство из них стали мамакунами, постоянными религиозными специалистами, служащими культу на всю жизнь. Это учреждение одновременно выполняло роль системы заложников (курака, дочь которой служила в Аклауаси в Куско, была курака, лояльность которой была гарантирована) и как главный государственный производитель изысканного текстиля, самого важного непродовольственного товара во всей андской экономике." #NT!
  
 inc_qhapaq_nan_tampu_bureaucracy: "Капак Нан и сеть Тампу" #NT!
 inc_qhapaq_nan_tampu_bureaucracy_desc: "Великая королевская дорога, более сорока тысяч километров асфальтированного шоссе, пролегающего по хребту Анд от Кито на севере до Мауле на юге, с параллельной прибрежной ветвью и боковыми развязками, пересекающими Кордильеры на перевалах высотой двадцать тысяч футов. Промежуточные станции, называемые тампус, располагались примерно через каждые двадцать километров, они были заполнены окрестными айллусами кукурузой, чарки, кормами и записями кипу и укомплектованы ретрансляторами часки, которые могли доставить сообщение из Кито в Куско менее чем за неделю. Дорога была нервной системой империи; без постоянного мит'а обслуживания он вернулся в гору за один сезон дождей." #NT!
