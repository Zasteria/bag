l_russian:
  # === Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_arc_apostolic_sanctuary: "Апостольское святилище" #NT!
 STATIC_MODIFIER_DESC_nd_arc_apostolic_sanctuary: "Царство остается апостольским щитом. Католикос Сиса правит без союза, корона Хетумидов защищает старую теологию, а королевство набирает силу благодаря сплоченности неделимой национальной церкви. Латинские суды ворчат; люди стоят." #NT!
 STATIC_MODIFIER_NAME_nd_arc_latin_union: "Латинский союз сестёр" #NT!
 STATIC_MODIFIER_DESC_nd_arc_latin_union: "Совет Сис приносит присягу Риму. Латинские купцы хлынули в Аяс под крестом союза, рыцарские дома посылают своих младших сыновей служить при дворе, а Кипр и государства крестоносцев открывают свои галеры под киликийским знаменем. Горские монастыри ропщут против предательства." #NT!
 STATIC_MODIFIER_NAME_nd_arc_levon_crown: "Корона Левона" #NT!
 STATIC_MODIFIER_DESC_nd_arc_levon_crown: "Папа Целестин III и император Генрих VI отправили короны в Тарс. Левон был королем, признанным во всем мире." #NT!
 STATIC_MODIFIER_NAME_nd_arc_genoese_partners: "Генуэзские партнеры" #NT!
 STATIC_MODIFIER_DESC_nd_arc_genoese_partners: "Республика Сан-Джорджо забирает склады в Мопсуестии. Железо, древесина и специи королевства движутся под властью генуэзского льва." #NT!
 STATIC_MODIFIER_NAME_nd_arc_venetian_partners: "Венецианские Партнеры" #NT!
 STATIC_MODIFIER_DESC_nd_arc_venetian_partners: "Знаки Венеции на Аяс. Только в 1301 году галеры провезли через гавань девяносто тысяч дукатов торговли." #NT!
 STATIC_MODIFIER_NAME_nd_arc_steppe_brotherhood: "Степное Братство" #NT!
 STATIC_MODIFIER_DESC_nd_arc_steppe_brotherhood: "Хетум Я поехал в Каракорум. Монголо-армянский союз выдвигает свои аргументы против мамлюков; королевство охотится рядом с Ильханатом." #NT!
 STATIC_MODIFIER_NAME_nd_arc_hedged_diplomacy: "Застрахованная дипломатия" #NT!
 STATIC_MODIFIER_DESC_nd_arc_hedged_diplomacy: "Объятия монголов полезны, но им никогда не доверяют. Корона строит свои стены, ремонтирует свои гавани и помнит об уходе союзников." #NT!
 STATIC_MODIFIER_NAME_nd_arc_patriarchal_seat: "Патриарший престол" #NT!
 STATIC_MODIFIER_DESC_nd_arc_patriarchal_seat: "Католикос проживает в королевстве. Там, где сидит патриарх, находится духовный центр армянского мира." #NT!
 STATIC_MODIFIER_NAME_nd_arc_royal_banneret: "Роял Баннерет" #NT!
 STATIC_MODIFIER_DESC_nd_arc_royal_banneret: "Рыцари, привязанные к короне, присягнувшие знамени Хетумидов. Постоянное рыцарское войско, получавшее деньги из королевской казны, обучалось королевскому командованию." #NT!
 STATIC_MODIFIER_NAME_nd_arc_frontier_orders: "Пограничные приказы" #NT!
 STATIC_MODIFIER_DESC_nd_arc_frontier_orders: "Крестоносцам военными приказами было поручено совершать марши. Госпитальеры в Селефкии, тамплиеры в Баграсе, тевтоники в Харунии: железный пояс против мамлюков." #NT!
 STATIC_MODIFIER_NAME_nd_arc_island_kingdom: "Островное Королевство" #NT!
 STATIC_MODIFIER_DESC_nd_arc_island_kingdom: "Союз дома Лузиньянов с Кипром объединяет две короны в одно средиземноморское царство. От Фамагусты до Аяса, один флот, одно знамя, один королевский дом." #NT!
  
  # === Formation Event === 
 nd_arc.1.t: "Совет Сис" #NT!
 nd_arc.1.d: "Корона Сиса возложена; королевство держится. Однако прелаты пришли в цитадель с вопросом, который нельзя откладывать. В течение двух столетий Апостольская Церковь стояла отдельно как от Халкидона, так и от Рима, ее древнее богословие сохранялось горами и мучениками. Теперь латиняне предлагают помощь в обмен на союз, крестоносцы говорят об одном послушании, итальянские купцы спрашивают, чью часовню они могут использовать в Аяс. Горское духовенство отказывается: лучше мамлюк, чем Папа, лучше изоляция, чем потеря души королевства. Бароны во франкских сюрко им отвечают: лучше Кипр, чем разорение, лучше Папа, чем пустыня. Перед католикатом открываются два пути; оба являются жизнью королевства.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_arc.1.a: "Апостольское святилище: сохраните царство неделимым в вере" #NT!
 nd_arc.1.b: "Латинский союз сестёр: откройте королевство христианскому миру крестоносцев" #NT!
  
  # === DHE Events === 
 nd_arc.2.t: "Корона в Тарсе" #NT!
 nd_arc.2.d: "6 января 1198 года в соборе Тарса Левон Великолепный получил из рук архиепископа Майнца корону, которую прислал ему император Генрих VI, и от отдельного легата корону, которую также прислал папа Целестина III. Он стоял как король перед латинским и греческим миром вместе взятыми; королевство, которое было всего лишь армянским княжеством, стало королевством христианского мира. На монетах, отчеканенных в Сисе, было изображено его коронованное изображение, грамоты были запечатаны на пяти языках, а хроники трех церквей зафиксировали его воцарение. Последующая линия Хетумидов унаследовала царство, признанное миром." #NT!
 nd_arc.2.a: "По милости Божией, король." #NT!
  
 nd_arc.3.t: "Итальянские концессии" #NT!
 nd_arc.3.d: "Генуя и Венеция настаивают на своем в Сисе. Каждая республика предлагает таможенные льготы, военно-морское сотрудничество, укрепленные кварталы; каждый требует лучших складов, меньших пошлин, права консула. Договоры 1201, 1215 и 1245 годов открыты в канцелярии и готовы к продлению под властью любого льва, которого предпочтет корона. Королевство не может одинаково служить обеим республикам. От этого выбора будет зависеть, какой итальянский флот будет считать Левант своим морем." #NT!
 nd_arc.3.a: "В Геную: склады Мопсуестии" #NT!
 nd_arc.3.b: "В Венецию: галеры Аяса" #NT!
  
 nd_arc.4.t: "Посольство в Каракоруме" #NT!
 nd_arc.4.d: "В 1254 году Хетум I поехал на восток через монгольские земли ко двору Великого хана Мункэ. Он преодолел четыре тысячи миль и был принят аудиенцией в течение пятидесяти дней. Он вернулся с обещаниями: что христианские церкви на землях, контролируемых монголами, будут освобождены от налогов, что Киликия и Ильханство будут вместе вести кампанию против мамлюков, что однажды Иерусалим снова станет христианским. Монголо-армянский союз, скрепленный этим путешествием, формировал стратегию королевства на протяжении столетия. Вопрос в том, как далеко зайти." #NT!
 nd_arc.4.a: "Прессуйте альянс: ставьте все на степное братство" #NT!
 nd_arc.4.b: "Используйте альянс, но никогда не полагайтесь на него" #NT!
  
 nd_arc.5.t: "Католицизм в Хромкле" #NT!
 nd_arc.5.d: "Когда сельджуки закрыли высокогорье, Католикос Армянской Апостольской Церкви отступил на запад. Столица перешла в Хромклу на Евфрате, затем в сам Сис. Там, где сидит патриарх, находится духовная столица армянского мира; и там, где находится корона Хетумидов, теперь проживает патриарх. В Сис приезжают для конфирмации епископы из Анатолии, Киликии и диаспоры. Царство больше не является просто убежищем для церкви: оно является ее резиденцией. Монеты паломников наполняют подношения, монастырские библиотеки пополняются, а благословение католиката узаконивает корону." #NT!
 nd_arc.5.a: "Корона и крест в одном городе." #NT!
  
 nd_arc.6.t: "Рыцарские ордена Короны" #NT!
 nd_arc.6.d: "При королях Лузиньянов рыцарская культура Утремера формально привилась к военной системе Хетумидов. В Сисе объявляются турниры, герольды регистрируют гербы, организуются ордена Киликийского креста и рыцарей святого Фаддея. Вопрос в том, привязывать ли ордена непосредственно к короне в качестве королевского знамени или предоставить установленным орденам крестоносцев приграничные замки и позволить им защищать марши в соответствии с их собственной дисциплиной. Оба производят рыцарей; разница в том, кто ими командует." #NT!
 nd_arc.6.a: "Королевское знамя: рыцарство, привязанное к короне" #NT!
 nd_arc.6.b: "Пограничные приказы: госпитальеры и тамплиеры на маршах" #NT!
  
 nd_arc.7.t: "Кипрское согласие" #NT!
 nd_arc.7.d: "Лузиньяны Кипра и Лузиньяны Киликии — один и тот же дом. Браки, разделы и преемственности переплетают короны; со временем то же знамя развевается над Сисом и Фамагустой. Соглашение официально оформляет союз: общее адмиралтейство, общие обычаи, общая дипломатия. Царство Киликия перестает быть полуостровом на враждебном побережье; она становится половиной морского царства, другая половина которого представляет собой остров-крепость в восточном Средиземноморье. Мечта, которую мамлюки разбили в 1375 году, восстановлена ​​в качестве политики." #NT!
 nd_arc.7.a: "Один дом, одно море." #NT!
  
  # === Advances === 
 nd_arc_kingship_of_levon: "Царство Левона" #NT!
 nd_arc_kingship_of_levon_desc: "Корона, посланная императором Генрихом VI и папой Селестиной III в 1198 году, сделала Киликийское княжество королевством, признанным всем христианским миром. Царская резиденция в Сисе стала сердцем международно легитимного армянского государства." #NT!
 nd_arc_cilician_knights: "Киликийские рыцари" #NT!
 nd_arc_cilician_knights_desc: "Франкская рыцарская культура привилась к древней армянской коннице Азнавур. Копье и воздушный змей, турнир и битва по турнирному образцу, армяно-латинский гибрид, который сражался не хуже любой тяжелой лошади крестоносцев." #NT!
 nd_arc_mavragort_levy: "Гора Маврагорт" #NT!
 nd_arc_mavragort_levy_desc: "Киликийское нагорье за ​​прибрежной равниной все еще остается армянским по происхождению и апостольским по вере. Из них королевство собирает отважную пехоту, подходящую для разбитой страны перевалов Таурус." #NT!
 nd_arc_pilgrim_crossroads: "Паломнический перекресток" #NT!
 nd_arc_pilgrim_crossroads_desc: "Монастырь Дразарк, Тарсус, город Святого Павла, дорога в Иерусалим: королевство находится на западной окраине армянского мира и восточной окраине латинского мира. Паломники пересекают оба пути, и их подношения создают культуру." #NT!
 nd_arc_catholicate_of_sis: "Католицат Сиса" #NT!
 nd_arc_catholicate_of_sis_desc: "Патриаршая резиденция Армянской Апостольской Церкви переезжает в Киликию. Там, где сидит Католикос, находится духовный центр армянского мира; а с 1293 года это место находится в самом Сис." #NT!
 nd_arc_italian_concessions: "Итальянские концессии" #NT!
 nd_arc_italian_concessions_desc: "Договоры с Пизой, Генуей и Венецией предоставляют итальянским купцам освобождение от налогов, фондачи и консульскую юрисдикцию. Таможенные доходы королевства растут; только в 1301 году венецианские галеры перевезли через Аяс девяносто тысяч дукатов." #NT!
 nd_arc_mongol_alliance: "Монгольский Альянс" #NT!
 nd_arc_mongol_alliance_desc: "Путешествие Хетума I в Каракорум в 1254 году сформировало стратегическую ось с монголами против султаната мамлюков. Королевство стало западным флангом Ильханства в христианской войне." #NT!
 nd_arc_hethumid_constabulary: "Полицейские силы Хетумида" #NT!
 nd_arc_hethumid_constabulary_desc: "Смбат Коннетабль, брат короля Хетума I, систематизировал военный закон королевства в своих Антиохийских ассизах. Королевский кавалерийский корпус тренировался по единой дисциплине и подчинялся единому командованию." #NT!
 nd_arc_korikos_galleys: "Галеры Корикоса" #NT!
 nd_arc_korikos_galleys_desc: "Укрепленная гавань Корикоса была одновременно замком и королевским арсеналом. Королевский флот зимовал там, снабжая военно-морскую доктрину королевства, основанную на галерах." #NT!
 nd_arc_lusignan_chivalry: "Лузиньян Рыцарство" #NT!
 nd_arc_lusignan_chivalry_desc: "Короли Лузиньянов позднего киликийского периода полностью переняли высокую рыцарскую культуру Утремера: турниры, герольды, рыцарские ордена и застенчивую крестоносную идентичность, соответствующую латинскому христианскому миру." #NT!
 nd_arc_smpadagirk: "Смпадагирк" #NT!
 nd_arc_smpadagirk_desc: "Книга законов Смбата Констебля, составленная в 1265 году на основе римских, канонических, франкских и армянских источников. Первая систематическая кодификация киликийского гражданского и уголовного права." #NT!
 nd_arc_silk_road_terminus: "Конечная остановка Шелкового пути" #NT!
 nd_arc_silk_road_terminus_desc: "Караванные пути из степи и из Китая заканчивались в Аяс. Через этот порт Марко Поло вошел в Азию; Западное устье Шелкового пути было Киликийским." #NT!
 nd_arc_cypriot_concord: "Кипрское согласие" #NT!
 nd_arc_cypriot_concord_desc: "Дом Лузиньянов правил и Кипром, и Киликией. Смешанные браки, договоры о престолонаследии и совместное адмиралтейство сплели две короны в единый средиземноморский династический проект." #NT!
 nd_arc_order_commanderies: "Орден Командорства" #NT!
 nd_arc_order_commanderies_desc: "Госпитальеры, тамплиеры и тевтонские укрепления усеивали киликийские границы. В сотрудничестве с короной ордены удерживали Баграс, Трапессак, Тиль Хамтун, Селефкию и Сарвандикар." #NT!
 nd_arc_crusader_galleon: "Крестоносец Галеон" #NT!
 nd_arc_crusader_galleon_desc: "Тяжелый военный корабль класса галеон, принятый на вооружение итальянской и арагонской верфей. Киликийские корабелы, имевшие доступ к таврской древесине и итальянским проектам, производили океанские средиземноморские суда." #NT!
 nd_arc_tax_farmer_nakharars: "Откупщик Нахарарс" #NT!
 nd_arc_tax_farmer_nakharars_desc: "Корона Хетумидов связывала благородные дома нахараров с королевским финансовым управлением. Привилегии откупщиков предоставлялись в обмен на присягу на верность и военную службу." #NT!
 nd_arc_apostolic_synodics: "Апостольские Синодики" #NT!
 nd_arc_apostolic_synodics_desc: "Апостольские школы Сиса ответили латинским схоластам своей собственной систематической теологией. Синодальные коллегии обучали духовенство патристике, каноническому праву и диспутам с Римом." #NT!
 nd_arc_levantine_thalassocracy: "Левантийская талассократия" #NT!
 nd_arc_levantine_thalassocracy_desc: "Королевство, пережившее 1375 год, овладев морем, осуществило свои давние амбиции: восточное Средиземноморье как киликийские воды, от Кипра до Антиохии и до Александрийской дороги." #NT!
 nd_arc_constitutional_catholicosate: "Конституционный католикосат" #NT!
 nd_arc_constitutional_catholicosate_desc: "Государство-совет, где патриарх Сиса заседает вместе с королем и высшей знатью. Совесть и корона в одной палате, Апостольская церковь как конституционный партнёр." #NT!
 nd_arc_diaspora_networks: "Сети армянской диаспоры" #NT!
 nd_arc_diaspora_networks_desc: "Армянские купеческие дома распространились по Европе, Индии и Персии под покровительством Сиса. Корона спонсирует торговые колонии, отправляет консулов ​​и направляет денежные переводы домой." #NT!
 nd_arc_mekhitarist_press: "Мхитарист Пресс" #NT!
 nd_arc_mekhitarist_press_desc: "Мхитар из армянской католической общины Себасте, слившейся с апостольскими школами Сис, совершает полиграфическую революцию: словари, грамматики, классические переводы и национальная периодическая печать." #NT!
 nd_arc_industrial_combinats: "Киликийские промышленные комбинаты" #NT!
 nd_arc_industrial_combinats_desc: "Железо с Тавра, медь с Анти-Тавра, древесина с кедровых склонов и военно-морские поставки с побережья: интегрированные промышленные комплексы являются основой экономики позднего королевства." #NT!
 nd_arc_civic_order: "Средиземноморский гражданский порядок" #NT!
 nd_arc_civic_order_desc: "Конституционная корона Сиса, где Апостольская церковь, потомственная знать, торговцы-горожане и королевский кабинет разделяют управление в соответствии с кодифицированным гражданским законодательством." #NT!
  
  # === Buildings === 
 nd_arc_sis_citadel: "Цитадель Сис" #NT!
 nd_arc_sis_citadel_desc: "Царская резиденция Хетумидов высечена в скалах над Сисом. В его стенах проводил двор царь Армении, проживал католикос и собиралась армия королевства." #NT!
 nd_arc_drazark_monastery: "Монастырь Дразарк" #NT!
 nd_arc_drazark_monastery_desc: "Царский монастырь Хетумидов в предгорьях Тавра, скрипторий и некрополь династии. Его библиотеки сохранили литературную память королевства." #NT!
 nd_arc_hromkla_catholicate: "Католический престол" #NT!
 nd_arc_hromkla_catholicate_desc: "Патриаршая резиденция Армянской Апостольской Церкви. От Громклы на Евфрате и, наконец, до самого Сиса католикос управлял Армянской церковью." #NT!
 nd_arc_ayas_customhouse: "Таможня Аяс" #NT!
 nd_arc_ayas_customhouse_desc: "Укрепленный порт Аяс был каменным богатством королевства. Итальянские галеры, монгольские караваны и корабли паломников — все платили здесь свой долг." #NT!
 nd_arc_mopsuestia_emporium: "Торговый центр Мопсуестия" #NT!
 nd_arc_mopsuestia_emporium_desc: "Речной перевалочный пункт на Пираме, где генуэзские склады получали киликийскую древесину и железо, а караваны Шелкового пути доставляли специи и шелк для отправки на запад." #NT!
 nd_arc_order_commandery: "Орден командования" #NT!
 nd_arc_order_commandery_desc: "Пограничный замок, принадлежащий военному ордену. Госпитальерам, тамплиерам и тевтонцам в сотрудничестве с короной были предоставлены опорные пункты Киликии." #NT!
 nd_arc_apostolic_seminary: "Апостольская семинария" #NT!
 nd_arc_apostolic_seminary_desc: "Школы Сиса, где апостольское духовенство обучалось богословию, каноническому праву и языкам диспутов. Интеллектуальный ответ королевства латинским университетам." #NT!
 nd_arc_royal_arsenal: "Королевский Арсенал" #NT!
 nd_arc_royal_arsenal_desc: "Королевские верфи и оружейные заводы. Киликийская древесина, железо и рабочая сила объединились под управлением короны, чтобы создать океанский флот." #NT!
 nd_arc_taurus_combinat: "Таурус Комбинат" #NT!
 nd_arc_taurus_combinat_desc: "Комплексные предприятия тяжелой промышленности по производству железа, меди, материалов для военно-морского флота и стали. Опираясь на минеральные ресурсы Тельца и растущую рабочую силу королевства." #NT!
  
  # === Building Production Method Loc === 
 nd_arc_sis_citadel_upkeep: "Цитадель Гарнизон" #NT!
 nd_arc_sis_citadel_upkeep_desc: "Камень, кладка, оружие и инструменты для поддержания королевской крепости." #NT!
 nd_arc_drazark_upkeep: "Монашеское содержание" #NT!
 nd_arc_drazark_upkeep_desc: "Пчелиный воск для свечей, бумага для скриптории, книги для библиотеки и ладан для литургии." #NT!
 nd_arc_hromkla_upkeep: "Патриархальное хозяйство" #NT!
 nd_arc_hromkla_upkeep_desc: "Продовольствие резиденции католикоса: пчелиный воск, бумага, книги и благовония." #NT!
 nd_arc_ayas_upkeep: "Работа таможни" #NT!
 nd_arc_ayas_upkeep_desc: "Военно-морские запасы для гавани, бумага для бухгалтерских книг, ткань для таможенников и инструменты для доков." #NT!
 nd_arc_cilician_workshop: "Киликийская мастерская" #NT!
 nd_arc_cilician_workshop_desc: "Итальянские мануфактуры на реке Пирам: генуэзские фабрики перерабатывают киликийское железо и таврские пиломатериалы в военно-морские товары, а генуэзские ткачи прядут из шелка-сырца Шелкового пути тонкую ткань для средиземноморских рынков. Мопсуестия — это таможенная книга, а мастерская — ткацкий станок и литейный цех." #NT!
 nd_arc_mopsuestia_upkeep: "Таможня и бухгалтерская книга" #NT!
 nd_arc_mopsuestia_upkeep_desc: "Бумага для реестров генуэзско-киликийских договоров, ткань для покоев консула, пчелиный воск для прижимателей печатей и инструменты для набережных." #NT!
 nd_arc_export_pm: "Экспорт железа и древесины" #NT!
 nd_arc_export_pm_desc: "Киликийское железо из рудников Тавра и пиломатериалы с кедровых склонов использовались для производства военно-морских товаров, пригодных для верфей. Итальянские производители закупают продукцию для египетских и эгейских верфей." #NT!
 nd_arc_silk_caravan_pm: "Шелковый Караван Торговля" #NT!
 nd_arc_silk_caravan_pm_desc: "Шелк-сырец и красители Шелкового пути поступали на склады в Пираме и перерабатывались в прекрасные ткани на ткацких станках с итальянской лицензией, а затем отправлялись в Геную, Венецию и порты Тиррении." #NT!
 nd_arc_commandery_upkeep: "Командирская служба" #NT!
 nd_arc_commandery_upkeep_desc: "Камень и кладка для ремонта, оружие для братьев и пчелиный воск для часовни." #NT!
 nd_arc_seminary_upkeep: "Библиотека семинарии" #NT!
 nd_arc_seminary_upkeep_desc: "Бумага, книги, пчелиный воск и ткань: рабочие материалы апостольской школы." #NT!
 nd_arc_arsenal_upkeep: "Арсенальная операция" #NT!
 nd_arc_arsenal_upkeep_desc: "Древесина, военно-морские припасы, инструменты и пушки: материалы государственной верфи." #NT!
 nd_arc_combinat_steel_pm: "Комбинат Металлургический Завод" #NT!
 nd_arc_combinat_steel_pm_desc: "Железо, уголь и инструменты объединяются в интегрированных печах для производства промышленной стали." #NT!
  
  # === Units === 
 a_nd_arc_cilician_knights: "Киликийские рыцари" #NT!
 a_nd_arc_cilician_knights_desc: "Тяжелая кавалерия из армянского состава азнавуров вооружена и обучена на франкский манер. Копье, воздушный змей, обученное на турнирах животное: элита королевства." #NT!
 a_nd_arc_mavragort: "Гора Маврагорт" #NT!
 a_nd_arc_mavragort_desc: "Горная армянская пехота с Таврских перевалов, поднятая для стычек на пересеченной местности и для засад в ущельях." #NT!
 a_nd_arc_cilician_lancers: "Киликийские уланцы" #NT!
 a_nd_arc_cilician_lancers_desc: "Королевский кавалерийский корпус полиции Хетумида. Руководство по строевой подготовке констебля Смбата, королевская ливрея и дисциплина постоянного рыцарского отряда." #NT!
 a_nd_arc_lusignan_knights: "Лузиньян Найтс" #NT!
 a_nd_arc_lusignan_knights_desc: "Полный рыцарский корпус позднего королевства под властью Лузиньянов: провозглашенный, приказанный, финансируемый короной и столь же компетентный, как и любой другой в Утремере." #NT!
 n_nd_arc_royal_galley: "Королевская галера" #NT!
 n_nd_arc_royal_galley_desc: "Военный корабль королевского флота типа «Галера», дислоцированный на Корикосе. Легкий, быстрый и подходящий для Леванта: рабочая лошадка морской мощи Киликии." #NT!
 n_nd_arc_crusader_galleon: "Крестоносец Галеон" #NT!
 n_nd_arc_crusader_galleon_desc: "Тяжелый галеон по итальянским и арагонским проектам, построенный на киликийских верфях из таврской древесины. Первый военный корабль королевства, способный плавать в океане." #NT!
  
  # === Levies === 
 levy_nd_arc_cilician_knights: "Киликийские рыцари Леви" #NT!
 levy_nd_arc_cilician_knights_desc: "Тяжелая конница знатных нахарарских домов, призванная под царское знамя." #NT!
 levy_nd_arc_mavragort: "Маврагорт Леви" #NT!
 levy_nd_arc_mavragort_desc: "Горская пехота, собранная из апостольского крестьянства Тельца." #NT!
  
 nd_arc_pyramus_warehouses: "Склады Пирамуса" #NT!
 nd_arc_pyramus_warehouses_desc: "Склады по генуэзской лицензии на набережной реки Пирам в Мопсуестии. Железо, древесина и шелк королевства проходили учет в генуэзских бухгалтерских книгах, а состояния Киликии росли вместе с протекавшей через них итальянской торговлей." #NT!
 nd_arc_royal_admiralty: "Королевское адмиралтейство Сиса" #NT!
 nd_arc_royal_admiralty_desc: "Государственные верфи, оружейный завод и военно-морская бюрократия находились под непосредственным управлением короны. Киликийская древесина, железо, рабочая сила и традиции итальянского кораблестроения объединились в флот, способный бросить вызов восточному Средиземноморью." #NT!
 nd_arc_formed_tt: "Образована Киликийская Армения." #NT!
 nd_arc_path_a_tt: "Выбран путь Апостольского Святилища" #NT!
 nd_arc_path_b_tt: "Выбран путь Латинского Союза" #NT!
 nd_arc_levantine_free_port: "Левантийский свободный порт" #NT!
 nd_arc_levantine_free_port_desc: "Либерализация таможни позднего королевства в Айасе, Фамагусте и второстепенных гаванях. Итальянские и северные купцы вступают на равных условиях; Киликийское судоходство конкурирует по качеству, а не по тарифам." #NT!
  
  # === Destiny Tree === 
 nd_arc_destiny: "Долгий горизонт сестренки" #NT!
 nd_arc_destiny_desc: "Венец установлен, на церковный вопрос дан ответ. Теперь королевству предстоит выбрать, каким государством оно намерено стать в ближайшие столетия." #NT!
 nd_arc_dest_levant_vanguard: "Левант Авангард" #NT!
 nd_arc_dest_levant_vanguard_desc: "Вернуть Иерусалим и Эдессу. Первое восстановление христианских государств эпохи крестоносцев должно произойти в Киликии, иначе оно не произойдет вообще." #NT!
 nd_arc_dest_liberation_sees: "Освобождение престолов" #NT!
 nd_arc_dest_liberation_sees_desc: "Возьмите Алеппо и Дамаск под руки Киликии. Патриархаты восточно-христианского мира должны ответить перед апостольской короной Сиса." #NT!
 nd_arc_dest_apostolic_imperium: "Апостольский Империум" #NT!
 nd_arc_dest_apostolic_imperium_desc: "Акко — последняя столица крестоносцев. Мосул, восточный престол. Королевство завершает свое наследие: христианский Восток собрался под одним знаменем, а армия и казна его удерживают." #NT!
 nd_arc_dest_cilician_reach: "Киликийский Предел" #NT!
 nd_arc_dest_cilician_reach_desc: "Анталия и Родос обеспечены, банковское дело включено. Королевство направляет своих торговцев и галеры за пределы своего побережья в южную часть Эгейского моря." #NT!
 nd_arc_dest_aegean_condominium: "Эгейский кондоминиум" #NT!
 nd_arc_dest_aegean_condominium_desc: "Крит и Модон отвечают Сису. Королевство делит восточное Средиземноморье без соперников; его галеры зимуют, где им заблагорассудится." #NT!
 nd_arc_dest_mediterranean_apex: "Средиземноморская вершина" #NT!
 nd_arc_dest_mediterranean_apex_desc: "Дорога Александрии и богатство Смирны отдают должное Сису. Восточное море — это Киликийское озеро; Королевство является биржей трех континентов." #NT!
  
  # === Destiny Path Variable Tooltips === 
  # (formed_tt and path_x_tt already defined above) 
  
  # === Destiny Events === 
 nd_arc.8.t: "Длинный горизонт" #NT!
 nd_arc.8.d: "Канцелярия подготовила меморандум. Решив церковный вопрос, совет смотрит вперед: не на следующую кампанию или следующий урожай, а на форму королевства через столетие. Земля или море, реставрация или проекция, восточно-христианский или средиземноморский космополит. Выбор больше не стоит между вариантами; это между фьючерсами." #NT!
 nd_arc.8.a: "Установите курс королевства." #NT!
  
 nd_arc.9.t: "Эдесса и Иерусалим восстановлены" #NT!
 nd_arc.9.d: "Знамя апостольской короны реет над Эдессой, городом Болдуин, потерянным в 1144 году, и над Иерусалимом, потерянным в 1187 году. То, что не удалось восстановить за два столетия усилий крестоносцев, теперь восстановлено Киликийским королевством. Католикос благословляет новые кафедры, хроники трех церквей записывают имена царских военачальников, а поколение армянских паломников видит свои святейшие города под своей короной." #NT!
 nd_arc.9.a: "Гроб Господень стоит под нашим крестом." #NT!
  
 nd_arc.10.t: "Алеппо и Дамаск" #NT!
 nd_arc.10.d: "Алеппо, великая торговая столица Сирии. Дамаск, город Омейядов семидесяти мечетей и патриархата восточно-православных. Оба города пали в руки киликийцев; оба должны теперь управляться. Канцелярия представляет два меморандума. Маршалы предлагают использовать захваченные города в качестве отправных точек для дальнейшей войны: трофеи, рекруты и импульс позволят донести знамя до самого Египта. Католикос и его синод предлагают обратное: христианские престолы на Востоке восстановлены, и примирение под апостольским послушанием должно предшествовать любому дальнейшему завоеванию. Выбор определит следующее поколение." #NT!
 nd_arc.10.a: "Устав завоевателя: используйте преимущество." #NT!
 nd_arc.10.b: "Примирение престолов: сначала исцелите церковь." #NT!
  
 nd_arc.11.t: "Апостольский Империум" #NT!
 nd_arc.11.d: "Акра, где в 1291 году погиб крестоносец Утремер, пролетает над Киликийским крестом. Мосул, где находилась патриархия Церкви Востока, подчиняется Католикосу Сису. Армия сделала то, чего никогда не делал ни один крестоносец, ни один монгол или ни один византиец: собрала христианский Восток под одной короной. Теперь суд должен решить, что такое империй. Воинственное королевство, чьи рекруты собираются по христианским принципам и чьи проповеди обращены к Иерусалиму? Или управляемое наследство, первая задача которого — ассимилировать побежденных и управлять ими, как киликийцами?" #NT!
 nd_arc.11.a: "Армянский Иерусалим: воинствующий христианский империум." #NT!
 nd_arc.11.b: "Апостольское наследие: управляйте, а не выставляйте напоказ." #NT!
  
 nd_arc.12.t: "Анталия и Родос" #NT!
 nd_arc.12.d: "Южное побережье Анатолии и великий остров-крепость Родос вошли в сферу Киликии. Фондачи несут киликийские знамена вместе с итальянскими; Госпитальеры, где они остаются, держат свои командования как вассалы королевства. Банковское дело пришло в Сис: итальянские кредитные инструменты теперь являются частью каждого канцелярского контракта. Королевство больше не является левантийским полуостровом; это морская держава на западном берегу восточного Средиземноморья." #NT!
 nd_arc.12.a: "Галеры подчиняются Сис." #NT!
  
 nd_arc.13.t: "Крит и Морея" #NT!
 nd_arc.13.d: "Кандия, Модон и гавани Мореи включены в зимовочную ротацию киликийского флота. Территория королевства теперь простирается от Фамагусты до Ионического моря. Две итальянские республики предлагают интегрироваться в торговую систему королевства. Генуя предлагает контракт континентального фактора: киликийско-генуэзские факторы, регулирующие объем торговли от Тебриза до Брюгге. Венеция предлагает морской кондоминиум: общие адмиралтейства, общие исследования, флаг королевства, пронесенный мимо Столпов в Атлантику." #NT!
 nd_arc.13.a: "Генуэзская ось: объем торговли между континентами." #NT!
 nd_arc.13.b: "Венецианская ось: морской кондоминиум за внутренним морем." #NT!
  
 nd_arc.14.t: "Апекс Средиземноморья" #NT!
 nd_arc.14.d: "Дорога Александрии и богатства Смирны вошли в обычаи королевства. Древнее восточное Средиземноморье, море трех континентов, практически отвечает одному королевству: наследнику Киликии, наследнику Лузиньянов Кипру, покровителю итальянских республик. Канцелярия представляет два видения того, что делать с апексом. Постройте биржу в Сисе: настоящую левантийскую расчетную палату, финансовую столицу Востока. Или отплывите наружу: пронесите флаг королевства и людей через западное Средиземноморье и за его пределы, космополитическую талассократию, которой Киликия всегда хотела быть." #NT!
 nd_arc.14.a: "Постройте биржу: Сис как финансовая столица Востока." #NT!
 nd_arc.14.b: "Львы Армении: космополитическая талассократия." #NT!
  
  # === Destiny Static Modifiers === 
 STATIC_MODIFIER_NAME_nd_arc_dest_conquerors_charter: "Хартия завоевателя" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_conquerors_charter: "Захваченные патриархаты поставляют людей, деньги и импульс. Войска королевства снова маршируют прежде, чем города остынут, а трофеи двух великих завоеваний наводняют киликийскую казну и ее цены." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_reconciled_sees: "Примирение Престолов" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_reconciled_sees: "Апостольский Католицат собирает восстановленные патриархаты в одно послушание. К еретическим сообществам относятся терпимо, старая теология обретает ясность, а жители королевства устают от войны, которая привела их сюда." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_jerusalem: "Армянский Иерусалим" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_jerusalem: "Королевство объявляет себя защитником христианского Иерусалима. Сборы собираются из принципа, подданные-язычники терпятся под покровительственным апостольским порядком, а двор становится щедрым на свои собственные легенды." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_apostolic_inheritance: "Апостольское наследие" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_apostolic_inheritance: "Побежденные ассимилируются, унаследованные интегрируются. Королевство управляет тем, что оно выиграло, как единое государство, принимая более крупное правительство, которое для этого требуется." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_genoese_axis: "Генуэзская ось" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_genoese_axis: "Киликийско-генуэзские факторы управляют сухопутной торговлей королевства от Тебриза до Брюгге. Торговые центры раздуваются. Население, находящееся под итальянским влиянием, недовольно привилегиями иностранных клерков." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_venetian_axis: "Венецианская ось" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_venetian_axis: "Общие адмиралтейства, общие исследователи, общие дворы. Флот истощается и уходит далеко, но армия теряет надежду, поскольку флот претендует на королевский кошелек." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_levantine_bourse_mod: "Биржа Сиса" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_levantine_bourse_mod: "Сис становится расчетной палатой Востока: контракты заключаются ежедневно, процветание строится на четкой торговле, общественные работы растут в каждой гавани. Однако богатые провинции начинают осознавать свое богатство." #NT!
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_lions: "Львы Армении" #NT!
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_lions: "Космополитичные команды, многоязычные суды и талассократия, гордящаяся своей смешанной кровью. Царство растет людьми и признанными культурами, даже несмотря на то, что его соперники отказывают ему в легком мире." #NT!
  
  # === Destiny Buildings === 
 nd_arc_greater_catholicate: "Великий католикат" #NT!
 nd_arc_greater_catholicate_desc: "Военно-религиозный штаб восстановленного христианского Востока. Собор, рыцарский сбор и военный совет под одной крышей в Сисе: институт, который объединяет Апостольский Империум." #NT!
 nd_arc_levantine_bourse: "Левантийская морская биржа" #NT!
 nd_arc_levantine_bourse_desc: "Расчистная площадка Восточного Средиземноморья. Итальянские, армянские, греческие и египетские фабрики ежедневно заключают здесь свои контракты; Флаг и валюта королевства принимаются по номиналу от Фамагусты до Марселя." #NT!
  
  # === Destiny Building PMs === 
 nd_arc_greater_catholicate_upkeep: "Католическое домашнее хозяйство" #NT!
 nd_arc_greater_catholicate_upkeep_desc: "Пчелиный воск для вечной литургии, книги для курии, ладан для государственных церемоний и оружие для вооруженных братьев." #NT!
 nd_arc_bourse_upkeep: "Биржевые операции" #NT!
 nd_arc_bourse_upkeep_desc: "Бумага для ежедневных бухгалтерских книг, тонкая ткань для ливрей фактористов, ткань для помощников и инструменты для печати контрактов." #NT!
  
  # === Bureaucracies === 
 arc_catholicate_of_sis_bureaucracy: "Католицат Сиса" #NT!
 arc_catholicate_of_sis_bureaucracy_desc: "Патриаршая резиденция Армянской Апостольской церкви, перенесенная из Хромклы в Сис в 1293 году после того, как мамлюки разграбили старую кафедру, и находившаяся в королевской столице под защитой Хетумидов. Католикос председательствовал на Синоде Сиса, постоянном совете епископов, и подтверждал апостольское богословие против последовательных римских инициатив 1198, 1244, 1289 и 1307 годов. Из его скрипторий вышли великие армянские просветленные евангелия Сиса и Дразарка, а из его судов вышло каноническое право, которое связывало каждую армянскую общину от Крыма до Персии. Там, где сидел Католикос, находился духовный центр армянского мира." #NT!
 arc_royal_chancery_bureaucracy: "Королевская канцелярия Сиса" #NT!
 arc_royal_chancery_bureaucracy_desc: "Писательская контора царей Хетумидов, застенчивая адаптация практики франкской канцелярии, привитой к армянской королевской традиции. Левон I скрепил свои грамоты на пяти языках; Антиохийские присяжные были переведены на армянский язык при коннетабле Смбате около 1265 года; королевские монеты содержали латинские, армянские, а иногда и арабские легенды. Канцелярия выполняла функции дипломатического связующего звена королевства с Римом, византийскими императорами, монгольскими ханами Тебриза и итальянскими республиками, разрабатывая многоязычные договоры, положения которых сохранились в архивах Сиса, Генуи, Венеции и Ватикана." #NT!
 arc_italian_factors_court_bureaucracy: "Суд итальянского фактора" #NT!
 arc_italian_factors_court_bureaucracy_desc: "Консульская юрисдикция принадлежала генуэзским и венецианским торговым общинам в Айасе и Мопсуестии в соответствии с договорами 1201, 1215 и 1245 годов. Каждая республика устанавливала своего собственного консула, который обладал гражданской и торговой юрисдикцией над купцами своей страны в королевстве, хранил свою собственную печать и подчинялся дожу, а не католикосу или королю. Это соглашение стало ценой средиземноморской интеграции: итальянский капитал, корабли и кредиты текли через киликийские гавани на условиях, установленных в лоджии Сан-Джорджо и Риальто, а корона Хетумидов получила доступ к торговле на дальние расстояния, к которой иначе не могло прикоснуться ни одно восточное королевство." #NT!
 arc_connetablie_bureaucracy: "Коннетабли Царства" #NT!
 arc_connetablie_bureaucracy_desc: "Военное командование королевством Хетумидов во франкском стиле, заимствованное у Антиохийского княжества крестоносцев и официально оформленное при династиях Рубенидов и Хетумидов. Констебль (gundstabl) возглавлял феодальное войско и рыцарскую иерархию из шестидесяти баронов. Брат Хетума I Смбат Коннетабль (1208-1276) перевел Антиохийские ассизы на армянский язык и систематизировал обязательства по рыцарским гонорарам по латинской модели: каждый барон королевства должен был иметь фиксированный кавалерийский контингент под знаменем Констебля. Это был феодальный сбор в латинском стиле на армянской земле, который дал королевству армию, на которую мамлюкам потребовалось два столетия." #NT!
 arc_customs_diwan_of_ayas_bureaucracy: "Таможенный Диван Аяса" #NT!
 arc_customs_diwan_of_ayas_bureaucracy_desc: "Таможенное управление крупного порта королевства в заливе Искендерун, главного средиземноморского перевалочного пункта Киликийской Армении, а после падения Акры мамлюками в 1291 году — главного христианского порта для торговли с Левантом. Марко Поло отплыл из Аяса в 1271 году; В «Пратике делла Меркатура» Франческо Пеголотти, написанной около 1340 года, в мельчайших подробностях перечислены пошлины, валюты и вес. Короли Хетумидов предоставили льготные тарифы привилегированным республикам, а остальное перевели в королевскую казну, но издержки режима легли на плечи внутренних феллахов, чье зерно облагалось налогом у ворот и снова в гавани, чтобы прокормить торговый город." #NT!
  
  # === Bureaucracy Authority === 
 AUTO_MODIFIER_NAME_nd_arc_bureaucracy_authority: "Канцелярия Хетумида" #NT!
 AUTO_MODIFIER_DESC_nd_arc_bureaucracy_authority: "Королевство Киликия управляется из цитадели Сиса через постоянный административный аппарат: королевскую канцелярию, синод католиката, консульские суды итальянских факторов и таможни Айаса. На этом фундаменте отличительные государственные институты королевства начинают обретать прочную форму." #NT!
