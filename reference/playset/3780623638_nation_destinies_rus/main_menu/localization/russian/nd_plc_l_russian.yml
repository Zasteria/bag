l_russian:
 STATIC_MODIFIER_NAME_nd_golden_liberty: "Золотая Свобода" #NT!
 STATIC_MODIFIER_DESC_nd_golden_liberty: "Золотая Волность закрепляет права каждого дворянина. Ни один король не правит без согласия Сейма, ни одна война не объявляется без одобрения шляхты, и каждая религия может свободно поклоняться под защитой Содружества." #NT!
 STATIC_MODIFIER_NAME_nd_jagiellonian_union: "Ягеллонский союз" #NT!
 STATIC_MODIFIER_DESC_nd_jagiellonian_union: "Династия, объединившая два великих народа, создала государство, простирающееся от Балтийского до Черного моря. Благодаря силе короны и лояльности ее подданных Содружество сохранится как континентальная держава." #NT!
 STATIC_MODIFIER_NAME_nd_spirit_of_tolerance: "Дух толерантности" #NT!
 STATIC_MODIFIER_DESC_nd_spirit_of_tolerance: "В эпоху, когда Европа полыхает религиозными войнами, Содружество стоит особняком, являясь убежищем, где католики, протестанты, православные и иудеи могут жить бок о бок в мире." #NT!
 STATIC_MODIFIER_NAME_nd_confessional_discipline: "Конфессиональная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_confessional_discipline: "Истинная вера – это основа государства. Укрепляя Церковь и направляя верующих, Содружество защищает свое духовное единство от хаоса сектантского разделения." #NT!
 STATIC_MODIFIER_NAME_nd_constitutional_republic: "Конституционная Республика" #NT!
 STATIC_MODIFIER_DESC_nd_constitutional_republic: "Закон о правительстве устанавливает разделение властей, отменяет liberum veto и расширяет гражданство за пределы дворянства. Новый рассвет для Республики обеих наций." #NT!
 STATIC_MODIFIER_NAME_nd_royal_prerogative: "Королевская прерогатива" #NT!
 STATIC_MODIFIER_DESC_nd_royal_prerogative: "Корона восстановила свою древнюю власть. После отмены liberum veto и подчинения магнатов король может, наконец, управлять страной без паралича благородных препятствий." #NT!
 nd_plc.1.t: "Союз двух наций" #NT!
 nd_plc.1.d: "В первый день июля в городе Люблине печати двух великих народов были запечатлены в воске. Королевство Польское и Великое Княжество Литовское, связанные браком, войной и общей необходимостью со времен Ягайлы и Ядвиги, теперь скованы в одно Речь Посполитую. Речь Посполитая Обойга Народова, Республика обеих наций, простирается от берегов Балтийского моря до степей востока, охватывая в своих границах поляков, литовцев, русинов, немцев, евреев, татар и армян.\n\nНо что это будет за государство? Шляхта мечтает о благородной республике, где каждый дворянин является королем в своем поместье, где Сейм правит на основе консенсуса, а корона является просто первой среди равных. Другие видят в Союзе возможность построить централизованную власть на основе наследия Ягеллонов, династийное государство, которое сможет объединить объединенные силы обеих наций против Московии, Османской империи и остатков Тевтонского ордена.\n\nПуть, который мы выбираем сейчас, будет формировать характер Содружества для поколений.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_plc.1.a: "Золотая Волность, золотая свобода каждого дворянина" #NT!
 nd_plc.1.b: "Наследие Ягеллонов, сила через династический союз" #NT!
 nd_plc.2.t: "Варшавская Конфедерация" #NT!
 nd_plc.2.d: "Двадцать восьмого января 1573 года, когда трон пуст, а будущее неопределенно, собравшаяся знать Речи Посполитой сделала заявление, которое разнеслось по векам. Варшавская конфедерация, подписанная католиками, лютеранами, кальвинистами, православными и другими, обещала взаимную терпимость и мир между всеми конфессиями.\n\n"Мы, которые расходятся в вопросах религии, будем сохранять мир между собой, - провозглашается в документе, - и не проливать кровь из-за различий в вере или видах церкви, и не наказывать друг друга конфискацией имущества, лишением чести, тюремным заключением или ссылкой".\n\nВ эпоху, когда Варфоломеевская резня только что потрясла всю Европу, а религиозные войны разрывают континент на части, Содружество выбрало радикальный путь. Но не все довольны: кардинал Хозиус назвал Польшу «местом приюта для еретиков», а многие католические голоса требуют, чтобы государство с большей энергией защищало истинную веру." #NT!
 nd_plc.2.a: "Пусть толерантность будет законом нашей Республики" #NT!
 nd_plc.2.b: "Укрепить истинную веру, единство через убеждение" #NT!
 nd_plc.3.t: "Постановление правительства от третьего мая" #NT!
 nd_plc.3.d: "После десятилетий политического паралича, иностранного вмешательства и медленного распада государственной власти Великий Сейм достиг того, что многие считали невозможным. Третьего мая 1791 года депутаты приняли Акт о правительстве, первую писаную конституцию в Европе и вторую в мире после американского документа 1787 года.\n\nКонституция отменяет право вето, которое позволяло любому отдельному депутату отменить законодательство всей сессии. Он устанавливает наследственную монархию, расширяет политические права буржуазии и ставит крестьянство под защиту государства. Гуго Коллонтай, Игнаций Потоцкий и король Станислав Август Понятовский вместе создали документ, который мог бы спасти Речь Посполитую от разделительных держав.\n\nНо Россия и Пруссия не потерпят усиления Польши. Выживание Конституции зависит от того, сможем ли мы защитить ее от тех, кто наживается на нашей слабости, как от иностранных держав, так и от магнатов Тарговицкой Конфедерации, которые приглашают русские штыки защитить свои привилегии." #NT!
 nd_plc.3.a: "Республика возрождается, суверенитет через конституцию" #NT!
 nd_plc.3.b: "Корона восстановлена, сильная монархия для отчаянных времен" #NT!
 nd_plc.4.t: "Лисовчицы: нарисованные всадники Речи Посполитой" #NT!
 nd_plc.4.d: "Они едут бесплатно, без поездов снабжения, без пощады. Лисовчицы, названные в честь своего основателя Александра Юзефа Лисовского, представляют собой нерегулярную кавалерию, служащую Речи Посполитой в обмен на право грабежа. Одетые в характерные костюмы и верхом на быстрых лошадях, они наносят удары глубоко в тыл врага, сжигая припасы, рассеивая подкрепления и сея ужас.\n\nИх репутация опережает их по всей Европе. Во время Тридцатилетней войны император Священной Римской империи Фердинанд II обратился к ним за услугами, и «раскрашенных всадников» стали бояться от Московии до Трансильвании. Их скорость и свирепость не имеют себе равных, как и их репутация грабежей и насилия против мирного населения.\n\nДля Содружества они представляют собой военный парадокс: разрушительные в бою, неуправляемые в мирное время. Но в государстве, которое не может позволить себе постоянную армию достаточного размера, эти самофинансируемые нерегулярные формирования заполняют критическую брешь в обороне страны." #NT!
 nd_plc.4.a: "Пусть нарисованные всадники служат Республике" #NT!
 nd_plc.5.t: "Зерновая дорога в Гданьск" #NT!
 nd_plc.5.d: "Из крупных внутренних владений, из фольварков Мазовии, Малой Польши и Волыни баржи плывут на север по Висле. Они везут рожь и пшеницу, которыми питаются Амстердам, Антверпен и растущие города Запада. В Гданьске река встречается с морем, а польское зерно встречается с голландским серебром.\n\nГород Гданьск контролирует восемьдесят процентов внутренней торговли. Ее горожане богатеют, становясь посредниками между шляхетскими землевладельцами и купцами Нидерландов. Торговля зерном сделала Содружество житницей Европы, но она также загнала экономику в рамки шаблона: дворяне расширяют свои поместья, крепче привязывают крестьянство к земле и сопротивляются любым изменениям, которые могут угрожать потоку зерна на рынок.\n\nТем не менее, пока идет урожай и течет Висла, богатство Содружества сохраняется." #NT!
 nd_plc.5.a: "Река несет наше процветание" #NT!
 nd_plc.6.t: "Сарматизм: благородный идеал" #NT!
 nd_plc.6.d: "Новое культурное движение охватило шляхту. Сарматизм, вера в то, что польское дворянство происходит от древних сарматских воинов степей, стал чем-то большим, чем просто генеалогический миф. Это целый образ жизни: контуш, сабля, богато украшенная карабела, щедрое гостеприимство, яростная независимость и убежденность в том, что благородная демократия Содружества является лучшей формой правления, когда-либо придуманной человеком.\n\nСарматистская культура прославляет воинскую доблесть, личную честь и равенство всех дворян, независимо от богатства. Он производит великолепное искусство, архитектуру и литературу; усадьбы и сельские церкви свидетельствуют о его эстетических амбициях. Но критики предупреждают, что сарматизм также порождает ксенофобию, сопротивление реформам и опасное самоуспокоение по поводу растущей уязвимости Речи Посполитой.\n\nБудь то золотой век или позолоченная клетка, сарматизм стал определяющей идентичностью польско-литовского дворянства." #NT!
 nd_plc.6.a: "Вот кто мы" #NT!
 nd_plc_union_heritage: "Союзное наследие" #NT!
 nd_plc_union_heritage_desc: "Традиция польско-литовского сотрудничества восходит к браку Ягайлы и Ядвиги, скрепившему два народа перед общими угрозами." #NT!
 nd_plc_amber_trade: "Янтарная дорога" #NT!
 nd_plc_amber_trade_desc: "Древние торговые пути, по которым балтийский янтарь доставлялся на юг через Европу, на протяжении веков обогащали купцов Содружества." #NT!
 nd_plc_szlachta_traditions: "Шляхтские традиции" #NT!
 nd_plc_szlachta_traditions_desc: "Конная знать Содружества сражается как кавалерия, каждый дворянин — воин, каждое сословие — источник всадников." #NT!
 nd_plc_multi_faith_roots: "Многоконфессиональные корни" #NT!
 nd_plc_multi_faith_roots_desc: "Начиная с Калишского статута, польско-литовские земли предлагали защиту общинам всех вероисповеданий." #NT!
 nd_plc_jagiellonian_learning: "Ягеллонское обучение" #NT!
 nd_plc_jagiellonian_learning_desc: "Ягеллонский университет в Кракове, основанный в 1364 году, выпустил Коперника и стал одним из крупнейших научных центров Европы." #NT!
 nd_plc_folwark_economy: "Фольварк Экономика" #NT!
 nd_plc_folwark_economy_desc: "Фольварковая система, дворянские сельскохозяйственные поместья, обрабатываемые связанными крестьянами, стала двигателем производства зерна в Речи Посполитой." #NT!
 nd_plc_sejmik_tradition: "Сеймик Традиция" #NT!
 nd_plc_sejmik_tradition_desc: "Провинциальные парламенты избирают депутатов национального сейма, предоставляя каждому воеводству право голоса в управлении." #NT!
 nd_plc_pospolite_reforms: "Посполитые реформы" #NT!
 nd_plc_pospolite_reforms_desc: "Общий набор шляхты, каждый дворянин, обязанный участвовать в войне, является основным военным резервом Содружества." #NT!
 nd_plc_magnate_courts: "Магнатская придворная культура" #NT!
 nd_plc_magnate_courts_desc: "Семьи великих магнатов содержат дворы, конкурирующие с судами мелких королей, покровительствуя художникам, музыкантам и ученым." #NT!
 nd_plc_pancerni_tradition: "Панцернская кавалерия" #NT!
 nd_plc_pancerni_tradition_desc: "Панцерны, бронированная казачья кавалерия, составляют основу конных сил Речи Посполитой, разносторонних и многочисленных." #NT!
 nd_plc_wybraniecka_infantry: "Пехота Выбранецка" #NT!
 nd_plc_wybraniecka_infantry_desc: "Отобранная пехота, призванная из королевских поместий, выбранецка представляет собой попытку Содружества создать профессиональную крестьянскую пехоту." #NT!
 nd_plc_lipka_tatars: "Липка Татарский Сервис" #NT!
 nd_plc_lipka_tatars_desc: "Татарские поселенцы-мусульмане, происходящие от беженцев из Золотой Орды, служат Речи Посполитой в качестве разведчиков и рейдеров легкой кавалерии." #NT!
 nd_plc_vistula_trade: "Висла Зерновая Торговля" #NT!
 nd_plc_vistula_trade_desc: "Зерно из внутренних районов стекает по Висле в Гданьск, где питает города Западной Европы в обмен на серебро и промышленные товары." #NT!
 nd_plc_tabor_defense: "Таборские военные повозки" #NT!
 nd_plc_tabor_defense_desc: "Мобильные укрепления из повозок создают мгновенную защиту на местах, превращая открытые равнины в оборонительные позиции от степных набегов." #NT!
 nd_plc_warsaw_confederation: "Варшавская Конфедерация" #NT!
 nd_plc_warsaw_confederation_desc: "Декларация взаимной религиозной терпимости 1573 года, один из первых подобных актов в европейской истории, определяет Содружество как убежище для преследуемых." #NT!
 nd_plc_lisowczycy_tradition: "Лисовчицкая традиция" #NT!
 nd_plc_lisowczycy_tradition_desc: "Нерегулярная рейдерская кавалерия, сражающаяся бесплатно и поддерживающая себя за счет грабежа. Их боятся по всей Европе из-за их скорости и свирепости." #NT!
 nd_plc_magnate_fortifications: "Магнатские укрепления" #NT!
 nd_plc_magnate_fortifications_desc: "Семьи великих магнатов строят укрепленные поместья и замки в своих поместьях, создавая сеть опорных пунктов по всему Содружеству." #NT!
 nd_plc_elective_monarchy: "Выборная монархия" #NT!
 nd_plc_elective_monarchy_desc: "Свободные выборы позволяют всем дворянам участвовать в выборе короля, привлекая иностранных кандидатов и дипломатическое внимание со всей Европы." #NT!
 nd_plc_gdansk_trade: "Гданьское торговое доминирование" #NT!
 nd_plc_gdansk_trade_desc: "Великий балтийский портовый город контролирует экспорт зерна Содружества в Западную Европу, направляя огромные богатства через свои склады." #NT!
 nd_plc_noble_democracy: "Благородная демократия" #NT!
 nd_plc_noble_democracy_desc: "Либерум вето дает каждому благородному депутату право приостанавливать законодательство – принцип священного единогласия, который одновременно защищает свободу и приводит к параличу." #NT!
 nd_plc_sarmatism: "Сарматизм" #NT!
 nd_plc_sarmatism_desc: "Вера в то, что польская знать произошла от древних сарматских воинов, породила особую культуру воинской доблести, щедрой демонстрации и яростной независимости." #NT!
 nd_plc_refuge_of_nations: "Убежище Наций" #NT!
 nd_plc_refuge_of_nations_desc: "Содружество приветствует преследуемых представителей всех вероисповеданий и наций (евреев, армян, шотландцев, немцев, татар), обогащая свою культуру за счет разнообразия." #NT!
 nd_plc_dual_legal_system: "Двойная правовая система" #NT!
 nd_plc_dual_legal_system_desc: "Польша и Литва поддерживают отдельные правовые кодексы и трибуналы, сохраняя особую идентичность Великого Княжества в рамках Содружества." #NT!
 nd_plc_may_constitution: "Конституция Третьего мая" #NT!
 nd_plc_may_constitution_desc: "Первая современная конституция Европы отменяет либерум вето, устанавливает разделение властей и расширяет гражданство буржуазии." #NT!
 nd_plc_national_uprising: "Дух национального восстания" #NT!
 nd_plc_national_uprising_desc: "Дух Костюшко, народа, готового бороться за свободу, несмотря на превосходящие силы, определяет последнюю, дерзкую главу Содружества." #NT!
 nd_plc_economic_reform: "Экономическая модернизация" #NT!
 nd_plc_economic_reform_desc: "Поздние реформы Содружества создают промышленность, улучшают инфраструктуру и начинают переход от чисто сельскохозяйственной экспортной экономики." #NT!
 nd_plc_unity_in_diversity: "Единство в разнообразии" #NT!
 nd_plc_unity_in_diversity_desc: "Самой сильной стороной Речи Посполитой всегда была ее способность объединять под одним знаменем поляков, литовцев, русинов, немцев, евреев, татар и армян." #NT!
 a_nd_plc_pancerni: "Панцерни" #NT!
 a_nd_plc_pancerni_desc: "Средняя бронекавалерия, костяк конных войск Содружества. Более многочисленные и разносторонние, чем гусары, панцерны выполняют любую роль — от разведки до преследования." #NT!
 a_nd_plc_lisowczycy: "Лисовчицы" #NT!
 a_nd_plc_lisowczycy_desc: "Нерегулярная рейдерская кавалерия, сражающаяся бесплатно и поддерживающая себя за счет грабежа. Этих «раскрашенных всадников», названных в честь Александра Юзефа Лисовского, боялись по всей Европе." #NT!
 a_nd_plc_lisowczycy_levy: "Лисовчицы Леви" #NT!
 a_nd_plc_lisowczycy_levy_desc: "Выращенная дворянами иррегулярная кавалерия в традициях Лисовчиц, быстрая, агрессивная и самодостаточная благодаря грабежам." #NT!
 a_nd_plc_wybraniecka: "Пехота Выбранецка" #NT!
 a_nd_plc_wybraniecka_desc: "Отборная пехота, набранная из каждого двадцатого крестьянского двора царских имений. Одна из первых попыток создания профессиональной постоянной пехоты в Содружестве." #NT!
 a_nd_plc_wybraniecka_levy: "Пьехота Выбранецка Леви" #NT!
 a_nd_plc_wybraniecka_levy_desc: "Крестьянская пехота, воспитанная по отборочной системе царских сословий, оснащенная огнестрельным оружием и обученная боевому строю." #NT!
 a_nd_plc_pospolite: "Посполитое русение" #NT!
 a_nd_plc_pospolite_desc: "Общий сбор шляхетской знати, каждый дворянин был обязан отправиться на войну для защиты Речи Посполитой. Многочисленные, но плохо скоординированные." #NT!
 a_nd_plc_lipka_tatar: "Липка Татарская конница" #NT!
 a_nd_plc_lipka_tatar_desc: "Татарские поселенцы-мусульмане, которые на протяжении поколений служили Содружеству в качестве разведчиков легкой кавалерии. Происходившие из Золотой Орды беженцы получили землю в Литве." #NT!
 a_nd_plc_tabor: "Таборская боевая повозка" #NT!
 a_nd_plc_tabor_desc: "Мобильные укрепления из повозок, которые можно соединить в цепь для мгновенной защиты поля. Вдохновленный гуситскими таборами, адаптированный для открытых равнин Содружества." #NT!
 nd_plc_folwark: "Фольварк" #NT!
 nd_plc_folwark_desc: "Сельскохозяйственное поместье, принадлежащее дворянам, производящее зерно на экспорт. Система фолварков стимулирует зерновое хозяйство Содружества, но привязывает крестьян к земле." #NT!
 nd_plc_sejmik_hall: "Сеймик Холл" #NT!
 nd_plc_sejmik_hall_desc: "Местонахождение провинциального парламента, где местное дворянство ведет дебаты, выбирает депутатов национального сейма и осуществляет реальную политическую власть." #NT!
 nd_plc_zamek: "Замек Магнацки" #NT!
 nd_plc_zamek_desc: "Укрепленная магнатская усадьба, сочетающая жилое величие с военной функцией. Эти опорные пункты служат основой оборонительной сети Содружества." #NT!
 nd_plc_akademia: "Академия" #NT!
 nd_plc_akademia_desc: "Университет или академия в ягеллонской традиции, развивающая обучение в области гуманитарных наук, права, медицины и естественных наук." #NT!
 nd_plc_amber_workshop: "Контор Бурштыну" #NT!
 nd_plc_amber_workshop_desc: "Мастерская по обработке янтаря, где необработанный балтийский янтарь вырезается, полируется и готовится к продаже на древних торговых путях." #NT!
 nd_plc_spichrz: "Спичж Гданьский" #NT!
 nd_plc_spichrz_desc: "Склад зерна в Балтийском регионе, где пшеница и рожь Содружества хранятся, сортируются и загружаются на корабли, направляющиеся на рынки Западной Европы." #NT!
 nd_plc_manufaktura: "Мануфактура" #NT!
 nd_plc_manufaktura_desc: "Промышленный цех по производству промышленных товаров, символизирующий поздний переход Содружества от экспорта сельскохозяйственной продукции к диверсифицированной экономике." #NT!
 nd_plc_folwark_maintenance: "Выращивание зерна" #NT!
 nd_plc_folwark_maintenance_desc: "Древесина для усадебных построек и скот для рабочей силы дают урожай зерна на экспорт по Висле." #NT!
 nd_plc_sejmik_upkeep: "Администрация Сеймика" #NT!
 nd_plc_sejmik_upkeep_desc: "Для ведения записей, корреспонденции и официальных документов управления провинции требуется бумага, красивая ткань для церемоний и книги законов." #NT!
 nd_plc_zamek_maintenance: "Замек Гарнизон" #NT!
 nd_plc_zamek_maintenance_desc: "Камень для стен, пиломатериалы для ремонта и оружие для гарнизона поддерживают готовность крепости магнатов." #NT!
 nd_plc_akademia_upkeep: "Академический вклад" #NT!
 nd_plc_akademia_upkeep_desc: "Бумага для рукописей, книги для библиотеки, стекло для линз и оборудования поддерживают научную деятельность академии." #NT!
 nd_plc_amber_processing: "Обработка янтаря" #NT!
 nd_plc_amber_processing_desc: "Из балтийского янтаря вырезают и полируют ювелирные изделия и декоративные предметы, которые экспортируются по древним торговым путям." #NT!
 nd_plc_spichrz_operations: "Операции по хранению зерна" #NT!
 nd_plc_spichrz_operations_desc: "Пшеница и древесина проходят через склад для сортировки и хранения; соль сохраняет зерно во время долгого морского путешествия на западные рынки." #NT!
 nd_plc_manufaktura_operations: "Производственные операции" #NT!
 nd_plc_manufaktura_operations_desc: "Железо куют, а ткань перерабатывают в инструменты и инвентарь для внутреннего и экспортного рынков." #NT!
 levy_nd_plc_lipka_tatar: "Липка Татарская конница" #NT!
 levy_nd_plc_lipka_tatar_desc: "Мусульманская татарская легкая кавалерия из поселенческих общин Литвы." #NT!
 levy_nd_plc_lisowczycy: "Лисовчицы" #NT!
 levy_nd_plc_lisowczycy_desc: "Нерегулярная дворянская конница в традициях нарисованных всадников." #NT!
 levy_nd_plc_wybraniecka: "Пехота Выбранецка" #NT!
 levy_nd_plc_wybraniecka_desc: "Отборная крестьянская пехота, набранная из царских имений." #NT!
 levy_nd_plc_pospolite: "Посполитое русение" #NT!
 levy_nd_plc_pospolite_desc: "Общий набор шляхетской знати, отправляющейся на войну." #NT!
 nd_plc_formed_tt: "Образовано Польша-Литва." #NT!
 nd_plc_path_a_tt: "Выбрал Золотую Свободу" #NT!
 nd_plc_path_b_tt: "Выбрал Ягеллонский союз" #NT!
 nd_plc_destiny: "Судьба Содружества" #NT!
 nd_plc_destiny_desc: "Была провозглашена Речь Посполитая. Будь то золотая свобода или династическая мощь, путь вперед теперь открыт." #NT!
 nd_plc_dest_sejm_ascendant: "Восходящий Сейм" #NT!
 nd_plc_dest_sejm_ascendant_desc: "Защитите великий порт Гданьск, чтобы закрепить торговлю зерном, создайте финансовые учреждения через банковское дело и наполните казну Содружества. Благородная республика требует и торговли, и монет." #NT!
 nd_plc_dest_breadbasket: "Хлебная корзина Европы" #NT!
 nd_plc_dest_breadbasket_desc: "Превратите Содружество в житницу, которая кормит Западную Европу. Расширяйте народную экономику, увеличивайте благосостояние страны и обеспечивайте потоки пшеницы через столичные рынки." #NT!
 nd_plc_dest_republic_of_nations: "Республика Наций" #NT!
 nd_plc_dest_republic_of_nations_desc: "Приведите Содружество к его наиболее полному выражению: просвещенной республике многих народов, богатой образованием, процветающей в торговле и управляемой самой передовой конституцией в Европе." #NT!
 nd_plc_dest_eastern_march: "Восточный марш" #NT!
 nd_plc_dest_eastern_march_desc: "Захватите великие города русинского и русского пограничья. Смоленск и Киев должны попасть под контроль Речи Посполитой, чтобы обезопасить восточную границу династии." #NT!
 nd_plc_dest_black_sea_reach: "Черноморский простор" #NT!
 nd_plc_dest_black_sea_reach_desc: "Двигайтесь на юг через Подолье к берегам Черного моря. Возьмите под свой контроль степной рубеж крымский порт Каффу и крепость Каменец-Подольский." #NT!
 nd_plc_dest_bulwark_of_christendom: "Оплот христианского мира" #NT!
 nd_plc_dest_bulwark_of_christendom_desc: "Содружество выступает в качестве щита Европы против Востока и Юга. Возьмите Москву и Константинополь, чтобы доказать, что наследие Ягеллонов не имеет себе равных на континенте." #NT!
 nd_plc.7.t: "Судьба Содружества" #NT!
 nd_plc.7.d: "Содружество стоит на перекрестке Европы. На западе рынки Амстердама и Лондона жаждут нашего зерна. На востоке бескрайняя степь простирается в сторону Московии и османских владений. Выбор, который мы сделаем сейчас, определит, станет ли Речь Посполитая маяком свободы или колоссом завоеваний.\n\nОсновы заложены. Содружество стабильно и сильно. Какую нацию мы построим на их основе?" #NT!
 nd_plc.7.a: "Наша судьба ждет" #NT!
 nd_plc.8.t: "Сейм поднимается" #NT!
 nd_plc.8.d: "Великий порт Гданьск принадлежит нам, а вместе с ним и ключ к балтийской торговле зерном. Доходы от торговли поступают в казну Республики, а шляхта прославляет мудрость своей золотой свободы. Создав банковские учреждения и обеспечив безопасность казны, благородная республика доказывает, что свобода и процветание не являются противоречиями.\n\nДепутаты Сейма говорят с вновь обретенной уверенностью: для процветания Содружеству не нужен ни один деспот. Голос знати, поднятый в ходе обсуждения и консенсуса, должен привести эту нацию к величию." #NT!
 nd_plc.8.a: "Пусть Сейм управляет мудро" #NT!
 nd_plc.9.t: "Зернохранилище Запада" #NT!
 nd_plc.9.d: "От внутренних границ до складов балтийских портов Содружество стало незаменимым для Европы. Наша пшеница кормит города Запада; наш янтарь украшает их дворы; из нашей древесины строят свои корабли. Висла — жидкое золото, и мы контролируем каждый изгиб.\n\nНо как нам распорядиться этим богатством? Некоторые выступают за доминирование на море, контролируя морские пути и портовые сооружения, по которым наше зерно доставляется на зарубежные рынки. Другие выступают за благородное предпринимательство, инвестируя в поместья, мельницы и мастерские, чтобы построить диверсифицированную экономику, которая не будет зависеть исключительно от урожая." #NT!
 nd_plc.9.a: "Управляйте балтийскими торговыми путями" #NT!
 nd_plc.9.b: "Инвестируйте в поместья и мастерские" #NT!
 nd_plc.10.t: "Республика без равных" #NT!
 nd_plc.10.d: "Содружество построило то, что теоретизировали философы Парижа и Эдинбурга. Республика многих народов, поляков, литовцев, русинов, немцев, евреев, татар, армян, управляемая законом, обогащенная торговлей и освещенная светом разума. Конституция отменила либерум вето; Komisja Edukacji Narodowej создала первое в Европе министерство образования; университеты процветают.\n\nРеспублика обеих наций стала Республикой всех наций. Но какую форму примет это просвещенное управление? Гражданские радикалы требуют универсальных прав, открытых границ и суверенитета разума. Конституционные консерваторы предпочитают закреплять реформу в традициях шляхты, сохраняя дворянские привилегии и одновременно модернизируя государство." #NT!
 nd_plc.10.a: "Гражданское просвещение для всех народов" #NT!
 nd_plc.10.b: "Реформа в рамках дворянской традиции" #NT!
 nd_plc.11.t: "Восточный марш обеспечен" #NT!
 nd_plc.11.d: "Знамена Речи Посполитой реют над Смоленском и Киевом. Восточный марш, эта обширная, спорная пограничная территория, где встречаются латинский и православный христианский мир, теперь прочно находится в руках Ягеллонов. Крепости Днепра укреплены гарнизонами войск Речи Посполитой, а торговые пути русинских земель протекают не к Москве, а к Кракову и Варшаве.\n\nЭто не просто завоевание. Это реализация видения Ягеллонов: династийное государство, простирающееся от Прибалтики до центра Руси, объединяющее народы, разделяющие границы и веру или, по крайней мере, готовность сосуществовать под одной короной." #NT!
 nd_plc.11.a: "Досягаемость династии постоянно растет на восток." #NT!
 nd_plc.12.t: "Черное море открывается" #NT!
 nd_plc.12.d: "Речь Посполитая прорвалась к Чёрному морю. Крепость Каменец-Подольский, легендарный бастион на реке Смотрич, охраняет нашу южную границу, а порт Кафа открывает торговые пути на Восток. Владычество Крымского ханства над степью подорвано.\n\nНо удержание этой границы требует стратегии. Некоторые выступают за постоянную военную границу, укрепленные линии, профессиональные гарнизонные войска и тактику выжженной земли для сдерживания рейдеров. Другие выступают за союз с казачьим войском, знающим степь, предлагая им привилегии и автономию в обмен на службу в качестве щита Речи Посполитой." #NT!
 nd_plc.12.a: "Постройте укрепленную границу" #NT!
 nd_plc.12.b: "Привлеките казаков на нашу сторону" #NT!
 nd_plc.13.t: "Антемурале христианитатис" #NT!
 nd_plc.13.d: "Москва пала. Константинополь наш. Речь Посполитая, Antemurale Christianitatis, оплот христианского мира, достигла того, о чем крестоносцы, императоры и цари могли только мечтать. От Балтики до Босфора, от Одера до Волги ягеллонский орел бросает свою тень на половину Европы.\n\nЭто момент, который эхом пронесется сквозь века. Речь Посполитая может стать вечным защитником европейской цивилизации, военной силой, настолько грозной, что ни одна восточная орда или южная империя никогда больше не будет угрожать христианскому миру. Или оно может использовать эту беспрецедентную позицию, чтобы представить династию Ягеллонов как первую семью Европы, заявив о континентальной гегемонии, которой не обладало ни одно государство со времен Рима." #NT!
 nd_plc.13.a: "Мы — вечный щит христианского мира" #NT!
 nd_plc.13.b: "Ягеллонская империя выстоит" #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_vistula_dominance: "Торговое господство Вислы" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_vistula_dominance: "Содружество контролирует балтийский зерновой коридор от поля до порта, управляя торговлей, которая питает Западную Европу." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_enterprise: "Благородное предприятие" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_enterprise: "Шляхта вкладывает свои доходы от зерна в поместья, мельницы и мастерские, диверсифицируя экономику Содружества за пределы экспорта сырья." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_civic_enlightenment: "Гражданское Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_civic_enlightenment: "Содружество охватывает универсальные гражданские ценности, открытое управление, образованное гражданство и верховенство разума над традициями." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_constitution: "Благородная конституция" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_constitution: "Реформа, основанная на традициях шляхты: благородная республика модернизирует свои институты, сохраняя при этом привилегии, которые делают ее уникальной." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_steppe_frontier: "Степной рубеж" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_steppe_frontier: "Постоянная военная граница с фортами и гарнизонами защищает побережье Черного моря от набегов и соперничающих империй." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_cossack_alliance: "Казачий Альянс" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_cossack_alliance: "Казачье войско служит кавалерийским авангардом Речи Посполитой в степи, обменивая свои боевые навыки на автономию и привилегии." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_antemurale: "Антемурале христианитатис" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_antemurale: "Содружество выступает вечным щитом христианского мира, военным бастионом, настолько грозным, что никакая восточная или южная держава не может угрожать Европе." #NT!
 STATIC_MODIFIER_NAME_nd_plc_dest_jagiellonian_imperium: "Ягеллонская Империя" #NT!
 STATIC_MODIFIER_DESC_nd_plc_dest_jagiellonian_imperium: "Династия Ягеллонов претендует на континентальную гегемонию, распространяя власть Содружества от Балтики до Босфора." #NT!
 nd_plc_sejm_walny: "Сейм Валный" #NT!
 nd_plc_sejm_walny_desc: "Суверенный парламент Республики обеих наций, в котором депутаты от каждого воеводства обсуждают законы, регулирующие Содружество." #NT!
 nd_plc_hetman_arsenal: "Гетманский Арсенал" #NT!
 nd_plc_hetman_arsenal_desc: "Центральный военный склад армии Речи Посполитой, где экипируются, снабжаются и обучаются силы Великого Гетмана для защиты христианского мира." #NT!
 nd_plc_sejm_walny_upkeep: "Парламентская администрация" #NT!
 nd_plc_sejm_walny_upkeep_desc: "Бумага для законодательства, прекрасная ткань для церемоний, юридические книги для справок и мебель для совещательных залов поддерживают работу Сейма." #NT!
 nd_plc_hetman_arsenal_upkeep: "Арсенал Операции" #NT!
 nd_plc_hetman_arsenal_upkeep_desc: "Оружие куется, стены поддерживаются камнем и древесиной, а из железа изготавливаются доспехи и орудия для армий Содружества." #NT!
  
  # ===== BUREAUCRACY AUTHORITY (auto_modifier slot grant) ===== 
 AUTO_MODIFIER_NAME_nd_plc_bureaucracy_authority: "Республика обеих наций" #NT!
 AUTO_MODIFIER_DESC_nd_plc_bureaucracy_authority: "Люблинская уния объединила институциональную структуру Короны и Великого Княжества в единую Речь Посполитую: федеративную республику шляхты, палаты, трибуналы и офисы которой управляют от Балтики до Днепра. Через эти институты дворянство Содружества осуществляет власть, которой когда-то владели короли." #NT!
  
  # ===== BUREAUCRACIES ===== 
 plc_sejm_walny_bureaucracy: "Сейм Валный" #NT!
 plc_sejm_walny_bureaucracy_desc: "Основанный Люблинской унией в 1569 году, Генеральный сейм Республики обеих наций включил в свою нижнюю палату 167 депутатов, избираемых 70 воеводскими сеймиками Короны Польши и Великого княжества Литовского. Заседая обычно раз в два года в течение шести недель, Сейм принимал обязательные законы, ратифицировал договоры и утверждал военные налоги. Его двухпалатная форма (посланники дебатировали ниже Сената) дала шляхте обеих стран единый законодательный голос." #NT!
  
 plc_senat_rzeczypospolitej_bureaucracy: "Сенат Речи Посполитей" #NT!
 plc_senat_rzeczypospolitej_bureaucracy_desc: "Верхняя палата Сейма, в которую входят епископы королевства, воеводы, кастеляны и министры Короны, около 140 пожизненных мест, почти полностью отбираемых из династий магнатов, чьи латифундии затмили королевские поместья. Сенаторы-резиденты постоянно заседали рядом с королем между сеймами, давая советы по каждому исполнительному акту. Через Сенат дома Радзивиллов, Замойских, Острожских и Сапег превратили свои земельные богатства в постоянную конституционную власть." #NT!
  
 plc_pacta_conventa_bureaucracy: "Пакта Конвента" #NT!
 plc_pacta_conventa_bureaucracy_desc: "Начиная с избрания Генриха Валуа в 1573 году, каждый монарх Содружества поклялся заключать персональный договор обязательств ( pacta conventa ) наряду с постоянными конституционными Генрицианскими статьями. Каждый избранный король обещал конкретные дела (женитьба за иностранцем, выплата королевских долгов, защита границ) и признавал право шляхты на вооруженное сопротивление, рокош, если он нарушит свою клятву. Этот институт сделал польское королевство договорным, а не династическим." #NT!
  
 plc_hetmanate_bureaucracy: "Гетманщина" #NT!
 plc_hetmanate_bureaucracy_desc: "Четыре пожизненных должности (Великокоронный гетман, Полевой коронный гетман и их литовские аналоги) осуществляли верховное командование постоянной армией Речи Посполитой. С 1585 г. гетмана можно было сместить только по обвинению в доказанной измене; с 1590 г. его военные постановления имели ту же юридическую силу, что и законы Сейма. Гетманы содержали своих посланников к Порте, татарам и Московии и распределяли свои военные бюджеты без царского вмешательства." #NT!
  
 plc_trybunal_koronny_bureaucracy: "Трибунал Коронный" #NT!
 plc_trybunal_koronny_bureaucracy_desc: "Король Стефан Баторий учредил Королевский трибунал в 1578 году, чтобы освободить королевский суд от судебных апелляций; Литовский трибунал последовал за ним в Вильно в 1581 году. Двадцать семь светских депутатов, избираемых ежегодно сеймиками, плюс шесть церковных депутатов, выбранных капитулами соборов, поочередно заседали в Петркуве и Люблине, чтобы вынести окончательное решение по делам шляхты. Лишив короля апелляционной юрисдикции, трибуналы передали дворянский закон в руки самого дворянства." #NT!
  
 plc_kozak_rejestrowy_bureaucracy: "Козак Реестровый" #NT!
 plc_kozak_rejestrowy_bureaucracy_desc: "Сигизмунд II Август впервые внес казаков в государственный реестр в 1572 году, а Стефан Баторий расширил систему до приграничного корпуса наемной кавалерии, удерживающей Дикие поля против татар и московитов. Реестровое казачество освобождалось от налогов, предоставляло землевладение и разрешало самоуправление под назначаемой старшиной. Это учреждение развалилось в 1648 году, когда отказ Короны увеличить реестр до двадцати тысяч спровоцировал восстание Хмельницкого и потерю Левобережной Украины." #NT!
  
 plc_liberum_veto_bureaucracy: "Либерум вето" #NT!
 plc_liberum_veto_bureaucracy_desc: "9 марта 1652 года тракайский депутат Владислав Сичинский воскликнул «Nie pozwalam!» (Я этого не допускаю) и вышел из зала Сейма, распустив сессию до истечения установленного законом срока. Из этого прецедента выросла доктрина, согласно которой протест одного посланника может аннулировать любое действие всего сейма. Основанное на равенстве всех дворян, право вето стало к восемнадцатому веку инструментом, с помощью которого русские, прусские и французские послы купировали паралич любой реформы." #NT!
