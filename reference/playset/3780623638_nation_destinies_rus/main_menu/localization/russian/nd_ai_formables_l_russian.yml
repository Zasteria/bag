  # ===== AI FORMS NATIONS game rule ===== 
 rule_nd_ai_formables_rule: "ИИ формирует нации" #NT!
 setting_nd_ai_formables_off: "Выключенный" #NT!
 setting_nd_ai_formables_off_desc: "Страны ИИ никогда активно не формируют нации: ванильное поведение, при котором формирование наций фактически осуществляется только игроками." #NT!
 setting_nd_ai_formables_opportunistic: "Оппортунистический" #NT!
 setting_nd_ai_formables_opportunistic_desc: "Ее сформирует ИИ-страна, которая уже отвечает требованиям крупной формируемой нации: Испания, Россия, Великобритания, Скандинавия, Великие Моголов, Германия, Италия или Нидерланды. Поведение ИИ в войне не изменилось. Это позволяет ИИ забрать только то, что он уже заработал." #NT!
 setting_nd_ai_formables_ambitious: "Амбициозный" #NT!
 setting_nd_ai_formables_ambitious_desc: "Будучи оппортунистической страной и страной искусственного интеллекта, которая находится на пути к Испании, Россия, Великобритания, Скандинавия или Великие Великие Моголы будут активно выступать за войны против стран, удерживающих территорию, которая ей все еще нужна. Создает более сложный и динамичный мир." #NT!
