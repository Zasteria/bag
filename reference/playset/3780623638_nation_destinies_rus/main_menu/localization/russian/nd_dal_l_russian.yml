l_russian:
 nd_dal_formed_tt: "была образована Далмация." #NT!
 STATIC_MODIFIER_NAME_nd_dal_republic_of_the_adriatic: "Республика Адриатика" #NT!
 STATIC_MODIFIER_DESC_nd_dal_republic_of_the_adriatic: "Следуя модели Рагузы, Далмация управляет собой как торговая республика, сохраняя свою свободу посредством проницательной дипломатии, торговых соглашений и тщательного баланса между более крупными силами, платя дань там, где это необходимо, но не подчиняясь никому." #NT!
 STATIC_MODIFIER_NAME_nd_dal_maritime_league: "Далматинская морская лига" #NT!
 STATIC_MODIFIER_DESC_nd_dal_maritime_league: "Города-государства побережья Далмации объединяются в военно-морскую конфедерацию, объединяя свои верфи, моряков и торговый флот в силу, которая контролирует Адриатические морские пути и распространяет мощь далеко за пределы своей скромной береговой линии." #NT!
 nd_dal.1.t: "Города побережья" #NT!
 nd_dal.1.d: "Знамя Далмации реет над древними городами восточной Адриатики. От Задара на севере до Дубровника на юге цепочка укреплённых портовых городов тянется по узкой прибрежной полосе между Динарскими горами и морем. На протяжении веков эти коммуны балансировали между империями (Византия, Венеция, Венгрия, а теперь и тень Османской империи), выживая за счет торговли, мореплавания и инстинкта дипломатии, граничащего с искусством.\n\nВеликий совет Дубровника теперь должен решить характер этого нового союза. Будет ли Далмация следовать модели Рагузы: республике купцов и дипломатов, платящей дань ради сохранения автономии и процветающей за счет торговли, которая течет между Востоком и Западом? Или прибрежные города объединят свои флоты в морскую лигу, создав военно-морскую мощь, которая будет господствовать на Адриатике силой оружия, а не силой аргументов?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_dal.1.a: "Свобода не дается; его торгуют за" #NT!
 nd_dal.1.b: "Море будет нашим щитом и мечом" #NT!
 nd_dal.2.t: "Карантинный указ" #NT!
 nd_dal.2.d: "27 июля 1377 года Великий совет Рагузы издал беспрецедентный в европейской истории указ. Все путешественники, прибывающие из зараженных чумой регионов, должны провести тридцать дней (позже их продлили до сорока, дав нам слово «карантин» от quaranta giorni) на бесплодном островке Мркан, прежде чем войти в город.\n\nНи в одном другом городе не предпринималось ничего подобного. Венеция не будет строить свой собственный лазарет еще сорок шесть лет. Указ Рагузы признает то, что еще не до конца понимает ни один врач: болезнь распространяется вместе с людьми и что изоляция — это цена выживания.\n\nСистема работает. В то время как чума опустошает города по всей Европе, Дубровник продолжает жить. Но лазарет задерживает торговлю и раздражает иностранных купцов. Должны ли мы строго соблюдать карантин, допуская замедление торговли для более безопасных граждан? Или нам следует придерживаться политики открытых портов, доверяя нашим врачам управлять рисками, сохраняя при этом торговлю?" #NT!
 nd_dal.2.a: "Сорок дней ради безопасности нашего народа" #NT!
 nd_dal.2.b: "Торговля не должна быть прикована к острову" #NT!
 nd_dal.3.t: "Указ об отмене" #NT!
 nd_dal.3.d: "27 января 1416 года Великий совет Рагузы принял указ, которому не могло соответствовать ни одно европейское государство в течение почти четырех столетий. Работорговля настоящим отменяется на территории Республики. Ни один корабль Рагузы не может перевозить рабов. Ни один гражданин Рагузы не может покупать, продавать или владеть другим человеком. Наказание — шесть месяцев тюремного заключения и штраф в двадцать пять фунтов на человека.\n\nМотивы смешанные: искренние моральные убеждения некоторых членов совета, практический расчет среди других, которые отмечают, что рабский труд снижает заработную плату свободных рабочих, и дипломатическое преимущество в представлении Рагузы как маяка цивилизации. Какими бы ни были причины, результат один и тот же: Рагуза становится первым европейским государством, запретившим работорговлю, на целых 391 год раньше Великобритании." #NT!
 nd_dal.3.a: "Non bene pro toto libertas venditur auro" #NT!
 nd_dal.4.t: "Аргосийский флот" #NT!
 nd_dal.4.d: "Слово «аргозия» вошло в языки Европы как синоним огромного торгового флота и происходит от слова «Рагуза». Причина очевидна в гавани Дубровника. Сто восемьдесят кораблей с экипажем из пяти тысяч моряков доставляют далматинские товары в каждый порт Средиземноморья и за его пределами. Самые большие аргосии — это четырехмачтовые суда грузоподъемностью сто тонн, вооруженные пушками и имеющие экипаж из ста сорока человек.\n\nЭти корабли увековечит сам Шекспир. Испанские адмиралы набирают в свои армады рагузских капитанов. Аргосии — это не просто торговые суда: это плавучие крепости, не нуждающиеся в военно-морском сопровождении, сочетающие в себе грузоподъемность торгового судна с вооружением военного корабля.\n\nОбъединим ли мы эти корабли в торговую армаду, проецируя мощь благодаря своим размерам и вооружению? Или нам следует усовершенствовать систему конвоев, делая упор на защиту торговли и эффективную торговлю, а не на военно-морскую мощь?" #NT!
 nd_dal.4.a: "Каждый аргосий – замок на волнах" #NT!
 nd_dal.4.b: "Наша сила в конвое, а не в бортовом залпе" #NT!
 STATIC_MODIFIER_NAME_nd_dal_quarantine_decree: "Карантинный указ" #NT!
 STATIC_MODIFIER_DESC_nd_dal_quarantine_decree: "Строгое соблюдение карантинных процедур, впервые введенное Рагузой в 1377 году (тридцать дней изоляции на прибрежных островах для всех, прибывших из чумных регионов), защищало население за счет замедления торговли." #NT!
 STATIC_MODIFIER_NAME_nd_dal_open_port_policy: "Политика открытого порта" #NT!
 STATIC_MODIFIER_DESC_nd_dal_open_port_policy: "Прагматичный подход к карантину, который отдает приоритет коммерческим потокам, полагаясь на врачей и проверки, а не на полную изоляцию. Торговля процветает, хотя болезни легче проникнуть в страну." #NT!
 STATIC_MODIFIER_NAME_nd_dal_liberty_of_ragusa: "Свобода Рагузы" #NT!
 STATIC_MODIFIER_DESC_nd_dal_liberty_of_ragusa: "Указ об отмене 1416 года «Non bene pro toto libertas venditur auro» («Свобода не продается за все золото мира») принес Рагузе международный престиж и привлек квалифицированных рабочих со всего Средиземноморья." #NT!
 STATIC_MODIFIER_NAME_nd_dal_merchant_armada: "Торговая Армада" #NT!
 STATIC_MODIFIER_DESC_nd_dal_merchant_armada: "Рагузские аргосии организованы как торговая армада: вооруженные торговые суда настолько прочны, что не нуждаются в сопровождении, проецируя как коммерческую, так и военную мощь по всему Средиземноморью." #NT!
 STATIC_MODIFIER_NAME_nd_dal_convoy_system: "Система конвоев" #NT!
 STATIC_MODIFIER_DESC_nd_dal_convoy_system: "Торговые суда Рагузы ходят организованными конвоями с легким эскортом и стандартизированными графиками плавания, которые максимизируют торговый поток, одновременно сводя к минимуму потери для пиратов и каперов." #NT!
 nd_dal_fondaco_tradition: "Фондако Традиция" #NT!
 nd_dal_fondaco_tradition_desc: "Фондако, объединенный склад, биржа и гостиница, является основой далматинской торговли, где купцы хранят товары, заключают контракты и разрешают споры под бдительным оком коммуны." #NT!
 nd_dal_statute_of_ragusa: "Статут Рагузы" #NT!
 nd_dal_statute_of_ragusa_desc: "Статут Рагузы 1272 года кодифицирует римские правовые традиции наряду с местными обычаями, устанавливая правила торговли, городского планирования, гигиены и общественного порядка, которые делают республику образцом гражданского управления." #NT!
 nd_dal_commune_governance: "Управление коммуной" #NT!
 nd_dal_commune_governance_desc: "Далматинские города-государства управляются посредством выборных советов, настоятелей, избирающих короткий срок, и традиций коллективного принятия решений, уходящих корнями в столетия морского республиканизма." #NT!
 nd_dal_salt_monopoly: "Соляная монополия" #NT!
 nd_dal_salt_monopoly_desc: "Солеварни Пага, Стона и Нина производят белое золото Адриатики, товар настолько ценный, что контроль над торговлей солью лежит в основе богатства и дипломатии Далмации." #NT!
 nd_dal_uskok_tradition: "Ускокская традиция" #NT!
 nd_dal_uskok_tradition_desc: "Ускоки, беженцы из завоеванных Османской империей земель, селятся вдоль побережья Далмации в качестве пограничных бойцов. Их партизанские навыки и знание горной местности делают их неоценимыми защитниками границы." #NT!
 nd_dal_quarantine_system: "Карантинная система" #NT!
 nd_dal_quarantine_system_desc: "В 1377 году Рагуза стала первым городом в мире, который ввел систематический карантин, требуя, чтобы все прибывшие из чумных регионов изолировались на прибрежных островах перед въездом в город." #NT!
 nd_dal_ragusan_diplomacy: "Рагузская дипломатия" #NT!
 nd_dal_ragusan_diplomacy_desc: "Республика Рагуза усовершенствовала искусство выживания с помощью дипломатии, поддерживая агентов и информаторов по всему Средиземноморью, одновременно натравливая Венецию, Венгрию и Османскую империю друг против друга." #NT!
 nd_dal_abolition_decree: "Указ об отмене" #NT!
 nd_dal_abolition_decree_desc: "В 1416 году Республика Рагуза стала первым европейским государством, отменившим работорговлю. Эта принципиальная декларация повысила ее престиж и привлекла в ее гавани квалифицированных свободных людей." #NT!
 nd_dal_adriatic_salt_routes: "Адриатические соляные маршруты" #NT!
 nd_dal_adriatic_salt_routes_desc: "Далматинская соль из Пага, Стона и Нина путешествует по торговым путям Адриатики, обмениваясь на итальянское зерно, левантийские специи и балканские минералы в торговой сети, которая обогащает каждую прибрежную коммуну.\n\n#italic Доступно в: $nd_dal_fondaco$#!" #NT!
 nd_dal_argosy_shipwrights: "Корабелы Аргози" #NT!
 nd_dal_argosy_shipwrights_desc: "Верфи Дубровника производят знаменитый аргози: массивное, тяжело построенное торговое судно, сочетающее в себе грузоподъемность транспорта с вооружением военного корабля, что и дало английскому языку слово «аргози»." #NT!
 nd_dal_morlach_frontier: "Морлахский рубеж" #NT!
 nd_dal_morlach_frontier_desc: "Морлахи, скотоводы, говорящие на языке влах, из внутренних районов Динара, нанимаются в качестве пограничников, их знания ведения войны в горах делают их грозными защитниками границ." #NT!
 nd_dal_sponza_archives: "Архивы Спонза" #NT!
 nd_dal_sponza_archives_desc: "Во дворце Спонза в Дубровнике находится государственный архив и таможня, где подробные записи о торговле, дипломатии и управлении сохраняют многовековые знания Рагузы и позволяют эффективно собирать таможенные пошлины.\n\n#italic Доступно в: $nd_dal_fondaco$#!" #NT!
 nd_dal_tribute_autonomy: "Дань автономии" #NT!
 nd_dal_tribute_autonomy_desc: "Далмация платит дань Османской империи (12 500 золотых дукатов ежегодно) в обмен на внутреннюю автономию и торговые привилегии на османских землях — прагматичная сделка, которая сохраняет свободу ценой." #NT!
 nd_dal_bracera_fleet: "Брасера ​​Флот" #NT!
 nd_dal_bracera_fleet_desc: "Брасера, быстрая галера с мелкой осадкой, восемью веслами и командой из тридцати человек, может преодолеть за ночь сотню морских миль, превосходя тяжелые венецианские галеры в узких заливах и заливах Адриатического побережья." #NT!
 nd_dal_maritime_law: "Морское право" #NT!
 nd_dal_maritime_law_desc: "Морское право Рагузы (регулирующее контракты, страхование, спасение и права моряков) становится образцом для средиземноморской торговли, привлекая иностранных купцов, которые доверяют его беспристрастному решению." #NT!
 nd_dal_pharmacy_tradition: "Аптечная традиция" #NT!
 nd_dal_pharmacy_tradition_desc: "Францисканская аптека Дубровника, действующая непрерывно с 1317 года, является одной из старейших в Европе и является пионером в приготовлении лекарств из адриатических трав и средиземноморских растений.\n\n#italic Доступно: $nd_dal_lazaretto$#!" #NT!
 nd_dal_silk_and_dye_trade: "Торговля шелком и красками" #NT!
 nd_dal_silk_and_dye_trade_desc: "В ходе процесса фондачи шелк и красители превращались в тонкую ткань для реэкспорта, увеличивая производственную ценность сырья, проходящего через склады Далмации.\n\n#italic Доступно в: $nd_dal_fondaco$#!" #NT!
 nd_dal_fleet_zenith: "Флот Зенит" #NT!
 nd_dal_fleet_zenith_desc: "На пике своего развития торговый флот Рагузы насчитывает 180 кораблей с экипажем из 5000 моряков, а фондачи снабжает суда смолой, веревками и древесиной для плаваний по Средиземному морю.\n\n#italic Доступно в: $nd_dal_fondaco$#!" #NT!
 nd_dal_learned_republic: "Учёная Республика" #NT!
 nd_dal_learned_republic_desc: "Интеллектуальная традиция Рагузы порождает ученых, поэтов и ученых с европейской известностью, от драматурга Марина Држича до физика Рудера Бошковича." #NT!
 nd_dal_walled_cities: "Города-крепости" #NT!
 nd_dal_walled_cities_desc: "Массивные стены Дубровника, Сплита и Задара (некоторые из которых были построены в римские времена, постоянно поддерживаются и расширяются) делают далматинские города практически неприступными для осады." #NT!
 nd_dal_mercantile_banking: "Торговый банкинг" #NT!
 nd_dal_mercantile_banking_desc: "Банковские дома Рагузы предоставляют кредиты торговцам по всей Адриатике, финансируя торговые предприятия и страхуя грузы с помощью сложных финансовых инструментов." #NT!
 nd_dal_illyrian_movement: "Иллирийское движение" #NT!
 nd_dal_illyrian_movement_desc: "Иллирийское движение продвигает общую южнославянскую идентичность среди далматинцев, хорватов и сербов, бросая вызов культурному доминированию итальянского и габсбургского влияния на побережье." #NT!
 nd_dal_modern_commerce: "Современная коммерция" #NT!
 nd_dal_modern_commerce_desc: "Акционерные общества и современные страховые дома заменяют старые торговые товарищества, переводя далматинскую торговлю в индустриальную эпоху с формализованным управлением рисками и объединением капитала." #NT!
 nd_dal_port_modernization: "Модернизация порта" #NT!
 nd_dal_port_modernization_desc: "Паровые краны, расширенные причалы и современные складские помещения преобразовывают древние гавани побережья Далмации под нужды судоходства индустриальной эпохи." #NT!
 nd_dal_constitutional_reform: "Конституционная реформа" #NT!
 nd_dal_constitutional_reform_desc: "Древние республиканские традиции далматинских коммун формализуются в современное конституционное управление с кодифицированными правами, представительными собраниями и профессиональной бюрократией." #NT!
 a_nd_dal_uskok: "Ускок Рейдеры" #NT!
 a_nd_dal_uskok_desc: "Боевики-беженцы из оккупированной Османской империей Боснии и Хорватии. Ускоки («те, кто прыгнул») специализируются на горных засадах и прибрежных рейдах, используя свои глубокие знания пересеченной местности для разрушительного эффекта." #NT!
 a_nd_dal_morlach: "Морлах Пандурс" #NT!
 a_nd_dal_morlach_desc: "Влахские горные иррегулярные формирования из внутренних районов Динара. Морлахи сражаются как легкая пехота, разведывая горные перевалы и беспокоя вражеские фланги с мастерством прирожденных пограничников." #NT!
 n_nd_dal_argosy: "Аргози" #NT!
 n_nd_dal_argosy_desc: "Легендарный рагузский аргос: массивное четырехмачтовое торговое судно, вооруженное пушками и экипажем из 140 человек. Медленнее военного корабля, но более прочный и вместительный, «Аргози» не нуждается в сопровождении. Это эскорт." #NT!
 n_nd_dal_bracera: "Ускок Брасера" #NT!
 n_nd_dal_bracera_desc: "Быстрая, мелкосидящая галера с восемью веслами и командой из тридцати человек. Брасера ​​может перемещаться по узким ручьям и заливам, куда не осмеливаются следовать более тяжелые суда, преодолевая за одну ночь сотню морских миль." #NT!
 levy_nd_dal_uskok: "Ускок Рейдер Леви" #NT!
 levy_nd_dal_uskok_desc: "Пограничные партизаны, набранные из числа беженцев-ускоков с побережья Далмации." #NT!
 levy_nd_dal_morlach: "Морлах Пандур Леви" #NT!
 levy_nd_dal_morlach_desc: "Горные иррегулярные формирования, набранные из скотоводческих общин валахов во внутренних районах Динара." #NT!
 nd_dal_fondaco: "Фондако" #NT!
 nd_dal_fondaco_desc: "Далматинский торговый склад и торговая биржа, где хранятся товары, заключаются контракты и разрешаются коммерческие споры в ведении коммуны." #NT!
 nd_dal_lazaretto: "Лазаретто" #NT!
 nd_dal_lazaretto_desc: "Карантинный комплекс, построенный в традициях Рагузы, где изолируют путешественников и товары из зараженных чумой регионов перед въездом в город: первое в мире систематическое учреждение общественного здравоохранения." #NT!
 nd_dal_academy: "Рагузанская Академия" #NT!
 nd_dal_academy_desc: "Центр обучения и науки в традициях Рагузы, где собираются ученые, поэты и натурфилософы, чтобы продвигать знания и сохранять интеллектуальное наследие далматинских коммун." #NT!
 nd_dal_insurance_house: "Морской Страховой Дом" #NT!
 nd_dal_insurance_house_desc: "Финансовое учреждение, специализирующееся на морском страховании и управлении торговыми рисками, гарантирующее торговые предприятия и предоставляющее капитал, который питает далматинскую торговлю." #NT!
 nd_dal_fondaco_maintenance: "Содержание Фондако" #NT!
 nd_dal_fondaco_maintenance_desc: "Камень и древесина для складских построек, ткань для рыночных прилавков и торговых помещений." #NT!
 nd_dal_salt_trade: "Торговля Адриатической солью" #NT!
 nd_dal_salt_trade_desc: "Далматинская соль с Пага и Стона и консервированная рыба из Адриатики проходят через склады фондако, составляющие основу коммерческого богатства республики." #NT!
 nd_dal_fine_cloth_trade: "Торговля изысканными тканями" #NT!
 nd_dal_fine_cloth_trade_desc: "Импортированные краски и ткани из Леванта и Италии продаются через фондако, обогащая далматинских купцов, которые служат посредниками между Востоком и Западом." #NT!
 nd_dal_customs_registry: "Таможенный реестр" #NT!
 nd_dal_customs_registry_desc: "Тщательный учет таможни дворца Спонза, расходующий бумагу и чернила для документирования каждого груза, тарифа и коммерческой сделки, проходящей через фондако." #NT!
 nd_dal_maritime_provisioning: "Морское снабжение" #NT!
 nd_dal_maritime_provisioning_desc: "Фондако запасает смолу и древесину для снабжения огромного торгового флота Рагузы, снабжая 180 кораблей и 5000 моряков, которые перевозят далматинские товары через Средиземное море." #NT!
 nd_dal_lazaretto_maintenance: "Содержание Лазаретто" #NT!
 nd_dal_lazaretto_maintenance_desc: "Камень для изоляторов, древесина для содержания и медикаменты для лечения больных во время карантина." #NT!
 nd_dal_apothecary_service: "Аптекарская служба" #NT!
 nd_dal_apothecary_service_desc: "Францисканские аптекари снабжают карантинные палаты адриатическим оливковым маслом, винными настойками и льняными повязками, заботясь как о находящихся на карантине путешественниках, так и о больных городе." #NT!
 nd_dal_academy_maintenance: "Содержание Академии" #NT!
 nd_dal_academy_maintenance_desc: "Бумага для рукописей и корреспонденции, книги для библиотечного фонда и свечи из пчелиного воска, чтобы освещать долгие часы учебы ученых." #NT!
 nd_dal_insurance_maintenance: "Содержание страхового дома" #NT!
 nd_dal_insurance_maintenance_desc: "Бумага для контрактов и бухгалтерских книг, мебель для счетных комнат и тонкая ткань для офисов, где страховщики оценивают риски и урегулируют претензии." #NT!
 nd_dal_path_a_tt: "Выбери судьбу #bold Адриатической#! Республики" #NT!
 nd_dal_path_b_tt: "Выбери судьбу #bold Морской лиги#!" #NT!
 nd_dal_destiny: "Далматинская судьба" #NT!
 nd_dal_destiny_desc: "Города побережья Далмации объединились под одним знаменем. Будь то искусство дипломатии или сила флота, это новое государство теперь должно доказать, что оно достойно выживания среди великих держав Средиземноморья." #NT!
 nd_dal_dest_tribute_and_trade: "Дань и торговля" #NT!
 nd_dal_dest_tribute_and_trade_desc: "Защитите подходы к Адриатике, передав порты Котор и Бар под влияние Далмации, создав модель дипломатии дани, которая сохранила независимость Рагузы на протяжении веков. Казначейство в 1000 золотых будет финансировать необходимые посольства и торговые соглашения." #NT!
 nd_dal_dest_mediterranean_emporium: "Средиземноморский торговый центр" #NT!
 nd_dal_dest_mediterranean_emporium_desc: "Расширьте коммерческую сеть Далмации до Ионических островов, сделав Корфу воротами в обширное Средиземноморье. Используйте банковское учреждение, чтобы формализовать финансовые инструменты республики, и накопите 2000 золотых, чтобы гарантировать расширение торговли." #NT!
 nd_dal_dest_libertas: "Либертас" #NT!
 nd_dal_dest_libertas_desc: "Далмация стремится к высшему идеалу Рагузанской республики: Libertas, свободе, которая сохраняется благодаря богатству, мудрости и уважению наций. Установите коммерческое присутствие на Крите и на итальянском побережье в Анконе, добейтесь международного престижа 75 и накопите казну в 3000 золотых, чтобы доказать устойчивость республики." #NT!
 nd_dal_dest_adriatic_dominion: "Адриатический Доминион" #NT!
 nd_dal_dest_adriatic_dominion_desc: "Морская лига должна силой обеспечить безопасность восточного побережья Адриатического моря. Завоюйте Дуррес и Шкодер, чтобы контролировать пролив, отделяющий Адриатику от Средиземного моря, и одновременно создайте армию численностью не менее 30 000 человек, чтобы обеспечить соблюдение притязаний Далмации." #NT!
 nd_dal_dest_thalassocracy: "Талассократия" #NT!
 nd_dal_dest_thalassocracy_desc: "Проецируйте военно-морскую мощь Далмации глубоко в восточное Средиземноморье, захватив Салоники, великий порт Эгейского моря. Поддерживайте армию в 50 000 человек и казну в 2 000 золотых, чтобы поддерживать это обширное владычество." #NT!
 nd_dal_dest_mare_nostrum: "Маре Нострум" #NT!
 nd_dal_dest_mare_nostrum_desc: "Морская лига стремится не что иное, как господство над Адриатическим морем. Покорите саму Венецию, древнего соперника, и великий порт Бари на итальянском берегу. Командуйте армией из 75 000 человек и добейтесь 75-го уровня престижа, чтобы завершить трансформацию прибрежной конфедерации в средиземноморскую державу." #NT!
 nd_dal.5.t: "Судьба побережья" #NT!
 nd_dal.5.d: "Далмация стоит единой: цепь укрепленных портовых городов, простирающихся от Истрии до Которского залива, связанных вместе морем, дающим им жизнь. Древний девиз Рагузы Non bene pro toto libertas venditur auro («Свобода не продается за все золото мира») теперь служит лозунгом всей нации.\n\nНо свободу нужно заслужить и защитить, а не просто провозгласить. Предстоящий путь требует видения, ресурсов и воли к действию. Сохранится ли Далмация как республика купцов или как союз воинов, определит только выбор ее правителей." #NT!
 nd_dal.5.a: "Наша судьба лежит перед нами" #NT!
 nd_dal.6.t: "Искусство дани" #NT!
 nd_dal.6.d: "Далмация обеспечила безопасность портов Которского залива, установив систему даннической дипломатии, которую Рагуза совершенствовала на протяжении веков. Платя умеренную дань великим державам, сохраняя при этом внутреннюю автономию, республика приобретает то, чего не могут гарантировать одни лишь крепости: свободу торговли, управления и выживания.\n\nКонсулы и послы Далмации теперь назначены при каждом значимом дворе. Они несут с собой дары, размеренные до копейки, разведданные, собранные из каждой гавани, и спокойную уверенность людей, которые знают, что выживание их маленькой республики зависит от того, насколько они будут более полезны живыми, чем завоеванными." #NT!
 nd_dal.6.a: "Дань - цена свободы" #NT!
 nd_dal.7.t: "Средиземноморский торговый центр" #NT!
 nd_dal.7.d: "Далматинские купцы теперь торгуют от Адриатики до Ионического моря и за его пределами. С принятием банковских учреждений и закреплением Корфу в качестве коммерческого перевалочного пункта, далматинские аргосы доставляют соль, ткань и красители в порты, которые когда-то имели дело только с Венецией или Генуей.\n\nРастущее богатство республики привлекает как возможности, так и пристальное внимание. Должны ли мы инвестировать в расширение нашей сети консульств и торговых агентов, создание постоянной дипломатической инфраструктуры по всему Средиземноморью? Или нам следует усовершенствовать искусство даннической дипломатии, используя наше богатство для покупки автономии и торговых прав, которые сохраняют республику свободной?" #NT!
 nd_dal.7.a: "Расширить консульскую сеть" #NT!
 nd_dal.7.b: "Совершенствуйте искусство дани" #NT!
 nd_dal.8.t: "Либертас Этерна" #NT!
 nd_dal.8.d: "Мечта о Рагузе осуществилась в масштабах, о которых ее основатели даже не могли себе представить. Коммерческая империя Далмации простирается от Адриатики до берегов Крита, ее консульства расположены вдоль портов Средиземноморья, а ее казна переполнена богатствами народов.\n\nДевиз республики, Libertas, больше не является молитвой, шепчущейся за городскими стенами. Это факт, продемонстрированный золотом, кораблями и неохотным уважением империй. Но как реализовать эту свободу? Станет ли Далмация маяком цивилизации, ее академии и суды привлекут лучшие умы Европы? Или же купеческие князья укрепят свою власть, построив богатую олигархию, которая будет формировать торговлю Средиземноморья?" #NT!
 nd_dal.8.a: "Пусть свобода осветит мир" #NT!
 nd_dal.8.b: "Купцы будут руководить республикой" #NT!
 nd_dal.9.t: "Хозяева пролива" #NT!
 nd_dal.9.d: "Морская лига захватила контроль над восточным побережьем Адриатического моря от Далмации до Албании. Дуррес и Шкодер теперь несут цвета Далмации, что дает флоту контроль над узким проливом, соединяющим Адриатику с более широким Средиземноморьем.\n\nНи один корабль не входит и не покидает Адриатику, не пройдя в пределах досягаемости далматинских галер. Пираты, которые когда-то охотились на прибрежные суда, теперь подвергаются охоте со стороны патрулей-брасера, которые знают каждую бухту и бухту. Пролив принадлежит Далмации, и торговля, проходящая через него, наносит ущерб далматинским портам." #NT!
 nd_dal.9.a: "Пролив наш" #NT!
 nd_dal.10.t: "Талассократия Востока" #NT!
 nd_dal.10.d: "Военно-морская мощь Далмации теперь простирается глубоко в Эгейское море. Салоники, великий порт, который когда-то служил византийским и османским императорам, подчиняется Морской лиге. Далматинский флот, от его тяжелых аргосов до быстрых галер-брасер, патрулирует воды, которые Венеция и Генуя когда-то считали своими частными морями.\n\nДолжны ли мы установить постоянные военно-морские патрули через Адриатику и Эгейское море, охотясь на пиратов и обеспечивая соблюдение морского законодательства Далмации? Или нам следует укрепить наши островные владения, построив гарнизоны, которые обеспечат длительный контроль над стратегическими узкими проходами?" #NT!
 nd_dal.10.a: "Патрулируйте моря без отдыха" #NT!
 nd_dal.10.b: "Укрепите каждый остров, который мы держим" #NT!
 nd_dal.11.t: "Маре Нострум" #NT!
 nd_dal.11.d: "Венеция пала. Город дожей, древняя хозяйка Адриатики, теперь подчиняется морской лиге, которую он когда-то считал цепью рыбацких деревень. Поскольку Бари на итальянском берегу также находится под контролем Далмации, все Адриатическое море представляет собой далматинское озеро.\n\nПреобразование завершено. От конфедерации прибрежных коммун до доминирующей военно-морской державы восточного Средиземноморья, Морская лига достигла того, чего веками венецианская дипломатия пыталась предотвратить. Как будет развиваться эта новая власть? Как морская империя, управляемая властью дожа, или как профессиональное военное государство, которым командуют адмиралы флота?" #NT!
 nd_dal.11.a: "Дог повелевает волнами" #NT!
 nd_dal.11.b: "Адмиралы флота возглавят" #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_consul_network: "Консульская сеть" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_consul_network: "Сеть далматинских консульств и торговых агентов, созданная в портах Средиземноморья, обеспечивает дипломатический доступ и коммерческую разведку, что расширяет сферу влияния республики далеко за пределы ее скромных границ." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_tribute_mastery: "Мастерство дани" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_tribute_mastery: "Совершенное искусство даннической дипломатии: использование тщательно взвешенных платежей и торговых уступок для приобретения автономии от более крупных держав, одновременно незаметно расширяя коммерческое влияние Далмации." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_beacon_of_liberty: "Маяк Свободы" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_beacon_of_liberty: "Далмация как блестящий пример республиканской цивилизации, ее академии, суды и толерантность привлекают лучшие умы и самые трудолюбивые люди Средиземноморья, хотя военная готовность республики страдает от ее миролюбивой ориентации." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_merchant_princes: "Мощная олигархия далматинских купеческих семей, которые контролируют коммерческую империю республики, инвестируя в инфраструктуру и финансовые инструменты, хотя их ориентация на прибыль увеличивает затраты на содержание постоянных армий." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_adriatic_patrol: "Адриатический патруль" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_adriatic_patrol: "Постоянные военно-морские патрули Далмации прочесывают Адриатику и Эгейское море, охотятся на пиратов, обеспечивают соблюдение морского законодательства и распространяют влияние лиги на восточное Средиземноморье." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_island_garrisons: "Островные гарнизоны" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_island_garrisons: "Укрепленные гарнизоны на стратегических островах и прибрежных позициях, обеспечивающие контроль Далмации над ключевыми узкими проходами и безопасные базы для военно-морских операций лиги." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_doge_of_the_sea: "Дож моря" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_doge_of_the_sea: "Морская империя, управляемая военно-морской властью дожа, с богатством завоеванных портов, финансирующим флот, и грабежами соперников, обогащающими казну." #NT!
 STATIC_MODIFIER_NAME_nd_dal_dest_fleet_admiral: "Адмирал флота" #NT!
 STATIC_MODIFIER_DESC_nd_dal_dest_fleet_admiral: "Профессиональная структура военного командования, в которой адмиралы флота руководят как военно-морскими, так и наземными операциями, уделяя особое внимание быстрому развертыванию, эффективности логистики и устойчивым кампаниям." #NT!
 nd_dal_consulate: "Консульство Рагузы" #NT!
 nd_dal_consulate_desc: "Постоянный дипломатический и коммерческий офис Далмации в традициях Рагузы, где консулы управляют торговыми соглашениями, собирают разведданные и представляют интересы республики с помощью многовековой дипломатической практики." #NT!
 nd_dal_consulate_maintenance: "Содержание консульства" #NT!
 nd_dal_consulate_maintenance_desc: "Бумага для дипломатической переписки, тонкая ткань для официальных мероприятий и мебель для консульских кабинетов." #NT!
 nd_dal_arsenal: "Далматинский Арсенал" #NT!
 nd_dal_arsenal_desc: "Укрепленная военно-морская верфь и арсенал, где Морская лига строит и снабжает свой флот, сочетая опыт судостроения далматинских коммун с военной дисциплиной профессионального военно-морского флота." #NT!
 nd_dal_arsenal_maintenance: "Содержание Арсенала" #NT!
 nd_dal_arsenal_maintenance_desc: "Древесина и деготь для строительства кораблей, железо для вооружения и арматуры, а также инструменты для мастерских арсенала." #NT!
  
  # ===== BUREAUCRACIES ===== 
 dal_consilium_rogatorum_bureaucracy: "Консилиум Рогаторум" #NT!
 dal_consilium_rogatorum_bureaucracy_desc: "Сенат Рагузы, основанный в 1253 году, собрал сорок пять патрициев старше сорока лет, каждый из которых избирался на один год Большим советом, для консультирования ежемесячно сменяющегося ректора. К шестнадцатому веку Сенат сместил ректора с поста исполнительного органа республики, и сенаторов стали называть «дворянами из дворянства». Палата укрепила городскую аристократию ценой любой исполнительной власти, независимой от класса патрициев." #NT!
 dal_officium_sanitatis_bureaucracy: "Официум Санитатис" #NT!
 dal_officium_sanitatis_bureaucracy_desc: "27 июля 1377 года Главный совет принял первый в мире декрет о государственном карантине, предписывающий тридцатидневную изоляцию на островах Мркан, Бобара и Супетар для любого торговца или судна, прибывающего из стран, подозрительных на чуму. Строительство Лаццаретто в Локруме было начато в 1533 году, а комплекс Плоче из десяти зданий был завершен в 1642 году. Казаморти, которые укрепляли кордон, поддерживали торговлю с Адриатикой в ​​каждом столетии чумы и дали Венеции (1423 г.) и Генуе (1467 г.) модель, которую они скопировали." #NT!
 dal_statuta_communium_bureaucracy: "Статута Коммуниум" #NT!
 dal_statuta_communium_bureaucracy_desc: "Кодифицированные общинные статуты далматинских городов включают закон Корчулы (сохранившаяся редакция 1265 г., традиционно датируемая 1214 г.), Кодекс Винодола, принятый 6 января 1288 г. глаголицей (второй старейший славянский закон после Русской Правды), Задар (1305 г.), Сплит (1312 г.) и Трогир (1322 г.). Они ограничивали совокупную власть над коммунами и кодифицировали самоуправление под руководством избранного князя и советников. Их отказ от судебных пыток и мытарств установил латинско-славянскую правовую традицию, не имеющую аналогов в Восточной Адриатике." #NT!
 dal_stradioti_levy_bureaucracy: "Страдиоти Пограничный сбор" #NT!
 dal_stradioti_levy_bureaucracy_desc: "Примерно с 1475 года венецианские далматинские владения Трау, Сибенико, Кастельнуово и Зара подняли страдиоти (балканскую легкую кавалерию, вооруженную копьем, длинной саблей, булавой и кинжалом) для удержания османской границы. Они сражались в соответствии с византийско-славяно-албанской традицией набегов, засад и ложных отступлений, незнакомых западным армиям, и стали пионерами доктрины легкой кавалерии, которой европейские державы подражали на протяжении двух столетий. Пограничные землевладельцы, которые их вырастили, вытеснили старые городские ополчения побережья." #NT!
 dal_tributary_diplomacy_bureaucracy: "Даньская дипломатия" #NT!
 dal_tributary_diplomacy_bureaucracy_desc: "Стратегия, с помощью которой Республика Рагуза сохраняла свои свободы с 1358 по 1808 год. Договор 1458 года с Мехмедом II сделал республику данницей султана, доставляя каждый ноябрь 12 500 дукатов в Константинополь в обмен на безопасный проход и освобожденную от налогов торговлю через османские земли, в то время как Рагуза одновременно оставалась папским протеже. К 1800 году консульства Республики были более чем в восьмидесяти портах по всему миру: это был самый густонаселенный дипломатический аппарат на душу населения в Европе раннего Нового времени." #NT!
  
 AUTO_MODIFIER_NAME_nd_dal_bureaucracy_authority: "Далматинская общинная власть" #NT!
 AUTO_MODIFIER_DESC_nd_dal_bureaucracy_authority: "При формировании [DAL.GetName] унаследованные институциональные традиции адриатических городов-республик (Сенат Рагузы, первый в мире карантин, кодифицированные общинные статуты, пограничный сбор Страдиоти и подчиненная дипломатия Рагузы) становятся доступными в качестве переключаемой бюрократии единого государства." #NT!
