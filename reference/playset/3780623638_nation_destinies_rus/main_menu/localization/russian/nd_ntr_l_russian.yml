l_russian:
 STATIC_MODIFIER_NAME_nd_mana_o_te_toa: "Мана о те Тоа" #NT!
 STATIC_MODIFIER_DESC_nd_mana_o_te_toa: "Мана воинов течет по земле. От грохота хака до вспышки тайахи в бою — каждый иви знает, что сила и храбрость определяют, кто мы есть." #NT!
 STATIC_MODIFIER_NAME_nd_mana_o_te_moana: "Мана о те Моана" #NT!
 STATIC_MODIFIER_DESC_nd_mana_o_te_moana: "Океан — наша дорога и наше наследие. Наши предки пересекли величайшее море на земле, чтобы добраться до этих островов, и теперь то же самое мастерство навигации руководит нашей торговлей и исследованиями." #NT!
 STATIC_MODIFIER_NAME_nd_ahi_ka_musket: "Ахи Ка: Огонь мушкета" #NT!
 STATIC_MODIFIER_DESC_nd_ahi_ka_musket: "Гром мушкетов навсегда изменил войну. Такие вожди, как Хонги Хика, показали, что тот, кто первым овладеет новым оружием, может изменить баланс сил во всем Аотеароа." #NT!
 STATIC_MODIFIER_NAME_nd_ahi_ka_gunfighter_pa: "Ахи Ка: Стрелок Па" #NT!
 STATIC_MODIFIER_DESC_nd_ahi_ka_gunfighter_pa: "Нашу страну перестроили для войны нового типа. Зигзагообразные траншеи, двойные частоколы и подземные бункеры превращают каждое укрепление в смертельную ловушку для нападающих, вооруженных как мушкетами, так и пушками." #NT!
 STATIC_MODIFIER_NAME_nd_kotahitanga_militant: "Котахитанга: Вооруженное сопротивление" #NT!
 STATIC_MODIFIER_DESC_nd_kotahitanga_militant: "При короле маори иви объединились не только в совете, но и в оружии. Земля будет защищена силой, и ни одна иностранная держава не возьмет то, что принадлежит нам, без боя." #NT!
 STATIC_MODIFIER_NAME_nd_kotahitanga_diplomatic: "Котахитанга: United Voice" #NT!
 STATIC_MODIFIER_DESC_nd_kotahitanga_diplomatic: "Кингитанга говорит от имени всех маори в один голос. Благодаря дипломатии и единству целей мы защитим наш суверенитет и наши земли посредством переговоров, а не кровопролития." #NT!
 nd_ntr.1.t: "Аотеароа Юнайтед" #NT!
 nd_ntr.1.d: "Иви Аотеароа объединились под единым суверенитетом. На протяжении веков племена этих островов жили как независимые нации, торгуя поунаму и обсидианом, ведя войны за ману и ресурсы, строя великие па на каждой стратегически важной вершине холма. Теперь общая идентичность народа маори кристаллизовалась в нечто большее, чем любой отдельный иви мог бы достичь в одиночку.\n\nВопрос, стоящий перед нами, заключается в том, какой нацией станет Аотеароа. Должны ли мы опираться на воинские традиции, которые определили наш народ: хака, тайаха, непоколебимую волю тоа? Или нам стоит посмотреть на океан, который привел сюда наших предков, опираясь на мастерство мореплавания и культурные традиции, которые делают нас уникальными среди народов мира?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ntr.1.a: "Мы — дети Ту: сила в битве!" #NT!
 nd_ntr.1.b: "Мы — дети Тангароа: господство над морем!" #NT!
 nd_ntr.2.t: "Мушкетные войны" #NT!
 nd_ntr.2.d: "Появление европейского огнестрельного оружия полностью изменило ход войны в Аотеароа. Вожди, приобретающие мушкеты, сначала получают сокрушительное преимущество над теми, кто все еще сражается тайахой и просто. Хонги Хика из Нгапуи продемонстрировал это, когда он вернулся из Англии в 1821 году с сотнями мушкетов, совершая набеги от залива Островов до берегов озера Роторуа.\n\nНо гений маори в области адаптации имеет глубокие корни. В течение одного поколения все крупные иви вооружились, а наши инженеры перепроектировали традиционные PA, чтобы они могли противостоять новому оружию. Пулеметчик с его зигзагообразными траншеями, двойными частоколами и подземными бункерами, возможно, является самой сложной местной фортификационной системой в мире.\n\nПримем ли мы наступательную мощь мушкета или овладеем защитным искусством нового па?" #NT!
 nd_ntr.2.a: "Вооружите каждого воина. Мушкет меняет все." #NT!
 nd_ntr.2.b: "Укрепляйтесь и терпите. Папа защитит нас." #NT!
 nd_ntr.3.t: "Кингитанга" #NT!
 nd_ntr.3.d: "В условиях растущего давления на земли и суверенитет маори возникло движение за объединение иви под единым монархом. В Пукаве, на берегу озера Таупо, великий вождь Потатау Те Верогеро был назначен первым королем маори. Кингитанга, «Движение королей», представляет собой самую амбициозную попытку общеплеменного единства в истории маори.\n\nСторонники движения утверждают, что только объединенная нация маори может противостоять потере земель и эрозии суверенитета. Но вопрос о том, как достичь этого единства, разделяет мнения. Некоторые считают, что единственным ответом является вооруженное сопротивление. Другие утверждают, что величайшая сила Кингитанги заключается в представлении единого дипломатического фронта, говорящего одним голосом от имени всех маори." #NT!
 nd_ntr.3.a: "Король поведет нас на войну, если понадобится." #NT!
 nd_ntr.3.b: "Король будет говорить от имени всех маори одним голосом." #NT!
 nd_ntr.4.t: "Мастерство Пунаму" #NT!
 nd_ntr.4.d: "Зеленый камень Южного острова, пунаму, стал самым ценным материалом во всем Аотеароа. Этот нефритовый нефрит, встречающийся только в реках и горах Те-Вай-Пунаму, тверже стали и требует полировки, сверкающей, как море. Мастера-резчики превращают необработанный камень в простые дубинки, подвески хей-тики и церемониальные тесла, которые олицетворяют ману их владельцев.\n\nПо меньшей мере пятнадцать установленных торговых маршрутов теперь несут пунаму из мастерских Нгай Таху через оба острова. Одна-единственная пунаму, короткая дубинка из полированного зеленого камня, может стоить больше, чем вся еда, которую хапу может вырастить за сезон. Мастерство пунаму — это не просто искусство; это экономика." #NT!
 nd_ntr.4.a: "Пунаму – богатство нашей нации." #NT!
 nd_ntr.5.t: "Уэр Вананга" #NT!
 nd_ntr.5.d: "Whare wananga, дома высшего образования, представляют собой вершину интеллектуальной традиции маори. В этих священных учреждениях тщательно отобранные ученики вождей проводят годы, запоминая обширные массивы знаний: генеалогии вакапапа, восходящие к появлению великих каноэ, каракия на любой случай, движение звезд, направляющих океанские путешествия, и лечебные свойства каждого растения в лесу.\n\nТохунга, окончившие эти школы, являются живыми хранилищами накопленной мудрости своего народа. В таких местах, как Те-Раухеоро в заливе Толага, знания передаются из поколения в поколение посредством структурированного устного обучения, которое по строгости и глубине не уступает европейским университетам." #NT!
 nd_ntr.5.a: "Знания – это истинная таонга нашего народа." #NT!
 nd_ntr_pa_engineering: "Па Инжиниринг" #NT!
 nd_ntr_pa_engineering_desc: "Наука о строительстве укреплённых поселений на вершинах холмов, штат Пенсильвания, с множеством оборонительных террас, частоколов и боевых площадок." #NT!
 nd_ntr_toa_warriors: "Воины Тоа" #NT!
 nd_ntr_toa_warriors_desc: "Воинская традиция тоа, элитные бойцы, обученные боевым искусствам мау ракау и владеющие тайахой, мере и теватева." #NT!
 nd_ntr_waka_taua_tradition: "Традиция Вака Тауа" #NT!
 nd_ntr_waka_taua_tradition_desc: "Огромные военные каноэ, вмещающие до сотни воинов, их резные носы и кормовые стойки возвещают о мане их иви." #NT!
 nd_ntr_wharenui_tradition: "Варенуйская традиция" #NT!
 nd_ntr_wharenui_tradition_desc: "Резные дома собраний, которые служат центрами племенного управления, церемоний и сохранения вакапапа." #NT!
 nd_ntr_horticultural_mastery: "Садоводческое мастерство" #NT!
 nd_ntr_horticultural_mastery_desc: "Передовые методы выращивания кумары и других культур, включая строительство выложенных камнями ям для хранения, в которых урожай сохраняется зимой." #NT!
 nd_ntr_mau_rakau: "Мау Ракау" #NT!
 nd_ntr_mau_rakau_desc: "Боевое искусство владения традиционным оружием (тайаха, теватева, пату) с балансом, расчетом времени и точностью, которые могут быть достигнуты только после многих лет тренировок." #NT!
 nd_ntr_iwi_governance: "Управление Иви" #NT!
 nd_ntr_iwi_governance_desc: "Сложная система власти вождя, в которой арики и рангатира руководят благодаря сочетанию унаследованной маны и личных достижений." #NT!
 nd_ntr_pounamu_mastery: "Мастерство Пунаму" #NT!
 nd_ntr_pounamu_mastery_desc: "Искусство и экономика обработки зеленого камня: вырезание из нефрита нефрита для изготовления оружия, украшений и инструментов, которые служат одновременно символами маны и инструментами торговли." #NT!
 nd_ntr_waka_hourua_voyaging: "Путешествие по Вака Хоуруа" #NT!
 nd_ntr_waka_hourua_voyaging_desc: "Океанское каноэ с двойным корпусом, способное пересекать огромные пространства открытого моря, руководствуясь древней звездной навигацией и знанием океанских течений." #NT!
 nd_ntr_whare_wananga: "Уаре Вананга" #NT!
 nd_ntr_whare_wananga_desc: "Священные высшие школы, где тохунга осваивают вакапапа, астрономию, медицину и ритуальные знания, которые скрепляют общество маори." #NT!
 nd_ntr_rahui_conservation: "Заповедник Рауи" #NT!
 nd_ntr_rahui_conservation_desc: "Система временных запретов на ресурсы, рахуи, позволяющая восстановить истощенные рыболовные угодья, леса и сады, обеспечивая устойчивое использование земель." #NT!
 nd_ntr_flax_weaving_tradition: "Харакеке Ткачество" #NT!
 nd_ntr_flax_weaving_tradition_desc: "Искусство плетения из льна харакеке плащей, корзин, веревок и парусов — отрасль, которая производит как предметы первой необходимости, так и ценные церемониальные одежды.\n\n#italic Доступно в: $nd_ntr_pounamu_workshop$#!" #NT!
 nd_ntr_star_navigation: "Звездная навигация" #NT!
 nd_ntr_star_navigation_desc: "Древняя полинезийская наука определения пути по звездам, океанским волнам и полету птиц, навигационная традиция, покорившая Тихий океан." #NT!
 nd_ntr_hapuu_alliances: "Альянсы Хапу" #NT!
 nd_ntr_hapuu_alliances_desc: "Сложная сеть межплеменных отношений, брачных союзов и обмена подарками, которые связывают хапу вместе во времена мира и войны." #NT!
 nd_ntr_european_contact: "Европейская контактная торговля" #NT!
 nd_ntr_european_contact_desc: "Прибытие европейских торговцев и китобоев открывает новые рынки для сельскохозяйственной продукции маори, льна и древесины.\n\n#italic Доступно в: $nd_ntr_pounamu_workshop$#!" #NT!
 nd_ntr_whalebone_artistry: "Артистизм из китового уса" #NT!
 nd_ntr_whalebone_artistry_desc: "Превращение китовой кости в изящно вырезанное оружие, украшения и ритуальные предметы — традиция, которая превращает сырье в выражение племенной идентичности." #NT!
 nd_ntr_potato_revolution: "Картофельная революция" #NT!
 nd_ntr_potato_revolution_desc: "Быстрое внедрение европейского картофеля меняет сельское хозяйство маори. Картофель, который легче выращивать, чем кумару, и который дает гораздо более высокие урожаи, способствует демографическому буму и коммерческому излишку." #NT!
 nd_ntr_musket_trade: "Мушкет Трейд" #NT!
 nd_ntr_musket_trade_desc: "Обмен сельскохозяйственных излишков, льна и древесины на европейские мушкеты — торговля, которая изменит баланс сил между иви." #NT!
 nd_ntr_tribal_mana: "Племенная мана" #NT!
 nd_ntr_tribal_mana_desc: "Накопленный престиж и духовный авторитет нации, мана, полученная от военных побед, удачных урожаев и достижений великих вождей." #NT!
 nd_ntr_inter_island_trade: "Межостровная торговля" #NT!
 nd_ntr_inter_island_trade_desc: "Торговые сети маори, соединяющие Северные и Южные острова, доставляют поунаму на север, а излишки сельскохозяйственной продукции на юг на судах вака, а затем и на судах европейского типа." #NT!
 nd_ntr_pa_adaptation: "Па Адаптация" #NT!
 nd_ntr_pa_adaptation_desc: "Первые модификации традиционной конструкции оборонительных сооружений в ответ на новые угрозы, более глубокие рвы, более сильные частоколы и новые подходы к оборонительной позиции." #NT!
 nd_ntr_musket_adaptation: "Адаптация мушкета" #NT!
 nd_ntr_musket_adaptation_desc: "Полная интеграция огнестрельного оружия в войну маори, включая модифицированные мушкеты с увеличенными затыльниками для более быстрой стрельбы и тактическое использование залпового огня с укрепленных позиций." #NT!
 nd_ntr_gunfighter_pa: "Стрелок Па" #NT!
 nd_ntr_gunfighter_pa_desc: "Революционная перепланировка территории для ведения огнестрельного оружия: зигзагообразные траншеи, двойные частоколы с льняной подкладкой, подземные бункеры и коммуникационные туннели." #NT!
 nd_ntr_commercial_agriculture: "Коммерческое сельское хозяйство" #NT!
 nd_ntr_commercial_agriculture_desc: "Быстрое расширение сельского хозяйства маори для снабжения европейских поселений и посещения кораблей. В течение десятилетий иви производят тонны картофеля, пшеницы и свинины на экспорт." #NT!
 nd_ntr_whalers_economy: "Экономика китобоев" #NT!
 nd_ntr_whalers_economy_desc: "Участие маори в береговом китобойном промысле, предоставление рабочей силы, продуктов питания и доступа к прибрежным районам в обмен на европейские товары и технологии." #NT!
 nd_ntr_taua_warfare: "Тауа Война" #NT!
 nd_ntr_taua_warfare_desc: "Организованные военные отряды, тауа, сочетающие в себе традиционную воинскую дисциплину с мушкетной огневой мощью, наносящие сокрушительные удары на больших расстояниях." #NT!
 nd_ntr_he_whakaputanga_sovereignty: "Хе Вакапутанга Суверенитет" #NT!
 nd_ntr_he_whakaputanga_sovereignty_desc: "Декларация независимости объединенных племен Новой Зеландии, подписанная в 1835 году, утвердила суверенитет маори и установила рамки самоуправления." #NT!
 nd_ntr_trading_vessels: "Торговые суда" #NT!
 nd_ntr_trading_vessels_desc: "Торговые суда, принадлежащие и управляемые маори, которые перевозят сельскохозяйственную продукцию между поселениями и через Тасман в Сидней, морской торговый флот, конкурирующий с колониальными усилиями.\n\n#italic Доступно в: $nd_ntr_waka_yard$#!" #NT!
 nd_ntr_kingitanga: "Кингитанга" #NT!
 nd_ntr_kingitanga_desc: "Движение королей маори, панплеменное учреждение, объединяющее иви под единым сувереном, чтобы противостоять отчуждению земель и утверждать коллективное управление маори." #NT!
 nd_ntr_modern_pa_warfare: "Современная война Папы" #NT!
 nd_ntr_modern_pa_warfare_desc: "Сложные оборонительные системы новозеландских войн, где такие люди, как Руапекапека, сочетают подземные бункеры, анфиладные линии траншей и тактическую глубину для поражения профессиональных армий." #NT!
 nd_ntr_maori_commerce: "Торговля маори" #NT!
 nd_ntr_maori_commerce_desc: "Расцвет коммерческого предпринимательства маори, мукомольных заводов, торговых судов, экспорта пшеницы доказывает, что местная экономика может на равных конкурировать с колониальной торговлей." #NT!
 nd_ntr_kotahitanga: "Котахитанга" #NT!
 nd_ntr_kotahitanga_desc: "Движение единства, которое объединяет лидеров маори в парламентах и ​​советах для решения общих проблем посредством коллективных действий и взаимной поддержки." #NT!
 nd_ntr_cultural_renaissance: "Культурный Ренессанс" #NT!
 nd_ntr_cultural_renaissance_desc: "Расцвет искусства, языка и самобытности маори, решимость сохранить и возродить традиции, которые определяют, что значит быть маори." #NT!
 nd_ntr_land_resistance: "Сопротивление земли" #NT!
 nd_ntr_land_resistance_desc: "Яростная защита земель маори от отчуждения путем судебного разбирательства, пассивного сопротивления и, при необходимости, вооруженного сопротивления." #NT!
 nd_ntr_runanga_councils: "Советы Рунанги" #NT!
 nd_ntr_runanga_councils_desc: "Система советов племени, рунанга, которая обеспечивает структурированное управление, разрешение споров и коллективное принятие решений в обществе маори." #NT!
 a_nd_ntr_toa: "Воины Тоа" #NT!
 a_nd_ntr_toa_desc: "Элитные воины маори обучались боевому искусству мау-ракау, владея посохом тайаха и дубинкой пату с разрушительным мастерством. Их боевой клич, хака, вселяет страх в любого врага." #NT!
 a_nd_ntr_toa_levy: "Тоа Леви" #NT!
 a_nd_ntr_toa_levy_desc: "Воины иви, призванные на службу, сражаются традиционным оружием и демонстрируют жестокую решимость, которая определяет боевой дух маори." #NT!
 a_nd_ntr_pa_defenders: "ПА Защитники" #NT!
 a_nd_ntr_pa_defenders_desc: "Вооруженные мушкетами воины, специализирующиеся на защите стрелков, сражаются из зигзагообразных траншей и двойных частоколов со смертельной точностью." #NT!
 n_nd_ntr_waka_taua: "Вака Тауа" #NT!
 n_nd_ntr_waka_taua_desc: "Огромные военные каноэ, вырезанные из цельных бревен, украшенные спиральной резьбой и оперенными кормовыми стойками, перевозящие в бой множество воинов тоа." #NT!
 n_nd_ntr_waka_hourua: "Вака Хоуруа" #NT!
 n_nd_ntr_waka_hourua_desc: "Океанские каноэ с двойным корпусом, способные пересекать огромные пространства открытого Тихого океана, руководствуясь древней наукой полинезийской звездной навигации." #NT!
 nd_ntr_pa: "Па" #NT!
 nd_ntr_pa_desc: "Укрепленное поселение на вершине холма с многочисленными оборонительными террасами, деревянными частоколами и боевыми площадками — основа территориальной обороны маори." #NT!
 nd_ntr_whare_wananga_building: "Уаре Вананга" #NT!
 nd_ntr_whare_wananga_building_desc: "Священная высшая школа, где тохунга сохраняет и передает из поколения в поколение накопленные знания народа маори." #NT!
 nd_ntr_wharenui: "Варенуи" #NT!
 nd_ntr_wharenui_desc: "Резной молитвенный дом, украшенный замысловатой резьбой, отражающей генеалогию и историю племени, служащий центром общественного управления и церемоний." #NT!
 nd_ntr_pounamu_workshop: "Мастерская Пунаму" #NT!
 nd_ntr_pounamu_workshop_desc: "Мастерская, где мастера-резчики превращают необработанный зеленый камень в оружие, украшения и инструменты необычайной красоты и ценности." #NT!
 nd_ntr_rua_kumara: "Руа Кумара" #NT!
 nd_ntr_rua_kumara_desc: "Подземные ямы для хранения, выложенные гравием и корой, которые сохраняют кумару зимой — важнейшая технология для продовольственной безопасности в климате Аотеароа." #NT!
 nd_ntr_pa_maintenance: "Содержание Папы" #NT!
 nd_ntr_pa_maintenance_desc: "Древесина для частоколов и камень для фундаментов обеспечивают защиту деревни от непогоды и атак." #NT!
 nd_ntr_wananga_upkeep: "Содержание Вананги" #NT!
 nd_ntr_wananga_upkeep_desc: "Древесина для поддержания священного дома обучения и бумага для записи накопленных знаний тохунга." #NT!
 nd_ntr_wharenui_maintenance: "Содержание Варенуи" #NT!
 nd_ntr_wharenui_maintenance_desc: "Древесина для резных панелей и опор, а также камень для фундамента и тротуара молитвенного дома." #NT!
 nd_ntr_pounamu_processing: "Обработка Пунаму" #NT!
 nd_ntr_pounamu_processing_desc: "Необработанный камень, добываемый из рек Те Вай Пунаму, медленно измельчается и полируется до готовой зеленокаменной таонги." #NT!
 nd_ntr_rua_maintenance: "Содержание Руа Кумара" #NT!
 nd_ntr_rua_maintenance_desc: "Древесина и кора заменяются каждый сезон, а камень используется для облицовки стенок ямы и поддержания дренажных каналов, которые сохраняют урожай кумары сухим." #NT!
 nd_ntr_flax_weaving: "Харакеке Ткачество" #NT!
 nd_ntr_flax_weaving_desc: "Традиционное плетение из льняного волокна харакеке, окрашенного и использованного для изготовления плащей, корзин и веревок." #NT!
 nd_ntr_whalebone_carving: "Резьба по китовому усу" #NT!
 nd_ntr_whalebone_carving_desc: "Китовую кость, собранную на берегу, с помощью специальных инструментов перерабатывают в оружие, украшения и ритуальные предметы, имеющие большое культурное значение." #NT!
 levy_nd_ntr_toa: "Тоа Воин Леви" #NT!
 levy_nd_ntr_toa_desc: "Воины иви отвечают на призыв к оружию, неся на поле битвы свои тайяха и свирепые хака." #NT!
 a_nd_ntr_tupara: "Тупара Мушкетеры" #NT!
 a_nd_ntr_tupara_desc: "Воины маори вооружены тупарами — двуствольными ружьями, снаряженными мушкетными ядрами, модифицированными с увеличенными отверстиями для быстрой стрельбы в ближнем бою." #NT!
 n_nd_ntr_trading_schooner: "Торговая шхуна маори" #NT!
 n_nd_ntr_trading_schooner_desc: "Парусные суда европейского типа, принадлежащие и управляемые маори, перевозят излишки сельскохозяйственной продукции между поселениями и через Тасманово море в Сидней." #NT!
 nd_ntr_musket_pa: "Мушкет Па" #NT!
 nd_ntr_musket_pa_desc: "Укрепление, перестроенное с учетом эпохи огнестрельного оружия, двойные частоколы с льняной подкладкой, зигзагообразные траншеи для мушкетного огня и усиленные ворота, способные выдержать нападение." #NT!
 nd_ntr_musket_pa_maintenance: "Содержание Мушкета Папы" #NT!
 nd_ntr_musket_pa_maintenance_desc: "Древесина для частоколов и вооружение для мушкетных лож гарнизона." #NT!
 nd_ntr_flour_mill: "Мельница Маори" #NT!
 nd_ntr_flour_mill_desc: "Водяные мельницы, перемалывающие пшеницу в муку на экспорт, являются символом коммерческого предприятия маори, конкурирующего с колониальной промышленностью." #NT!
 nd_ntr_milling_upkeep: "Фрезерные операции" #NT!
 nd_ntr_milling_upkeep_desc: "Пшеницу перемалывают в муку с помощью водяных жерновов, производя коммерческие излишки зерна для экспорта в европейские поселения." #NT!
 nd_ntr_waka_yard: "Верфь Вака" #NT!
 nd_ntr_waka_yard_desc: "Судостроительная верфь, где мастера маори строят традиционные суда вака и торговые суда в европейском стиле." #NT!
 nd_ntr_shipyard_upkeep: "Операции верфи" #NT!
 nd_ntr_shipyard_upkeep_desc: "Лесоматериалы и военно-морские поставки для содержания верфи и оснащения судов." #NT!
 nd_ntr_runanga_house: "Дом Рунанги" #NT!
 nd_ntr_runanga_house_desc: "Официальное здание совета, где вожди племен собираются для обсуждения вопросов управления, правосудия и коллективных действий." #NT!
 nd_ntr_runanga_upkeep: "Содержание Рунанги" #NT!
 nd_ntr_runanga_upkeep_desc: "Древесина для содержания муниципального дома, а также ткань для церемониальной обстановки и одежды, необходимой для официальных совещаний." #NT!
 nd_ntr_kotahitanga_hall: "Котахитанга Холл" #NT!
 nd_ntr_kotahitanga_hall_desc: "Зал общеплеменных собраний, где лидеры маори со всего моту собираются, чтобы обсудить вопросы, затрагивающие все иви, физическое воплощение единства." #NT!
 nd_ntr_kotahitanga_upkeep: "Содержание зала Котахитанга" #NT!
 nd_ntr_kotahitanga_upkeep_desc: "Древесина для содержания зала собраний и бумага для петиций, деклараций и протоколов общеплеменного парламента." #NT!
 nd_ntr_tupara_musketeers: "Тупара Мушкетеры" #NT!
 nd_ntr_tupara_musketeers_desc: "Использование двуствольного ружья тупара воинами маори, которые модифицируют оружие для более быстрой стрельбы и соответствующим образом адаптируют свою тактику." #NT!
 nd_ntr_provisioning_trade: "Провизионная торговля" #NT!
 nd_ntr_provisioning_trade_desc: "Поставка продовольствия и скота на заходящие европейские корабли — ранняя и прибыльная форма коммерческого предприятия маори." #NT!
 nd_ntr_formed_tt: "Аотеароа был основан" #NT!
 nd_ntr_path_a_tt: "Выбрал Мана о те Тоа" #NT!
 nd_ntr_path_b_tt: "Выбрал Мана или те Моана" #NT!
 nd_ntr_destiny: "Судьба Аотеароа" #NT!
 nd_ntr_destiny_desc: "Поскольку иви объединены под единым суверенитетом, Аотеароа стоит на перепутье. Путь, выбранный при формировании, теперь открывает великую национальную судьбу. Стабильность и целеустремленность будут определять путь вперед." #NT!
 nd_ntr_dest_tu: "Те Ара о Ту" #NT!
 nd_ntr_dest_tu_desc: "Получите власть над Тамаки Макаурау и перенесите власть за горизонт на остров Ниуэ. Армия, достойная Ту, бога войны, должна быть готова обеспечить соблюдение этого суверенитета." #NT!
 nd_ntr_dest_taua: "Тихоокеанский Тауа" #NT!
 nd_ntr_dest_taua_desc: "Военные отряды Аотеароа уплывают за горизонт. Тонгатапу Тонга и великие острова Фиджи должны попасть под нашу ману. Богатство завоеваний финансирует следующую кампанию." #NT!
 nd_ntr_dest_whenua: "Мана Венуа" #NT!
 nd_ntr_dest_whenua_desc: "Великая южная земля манит. Посадите тайаху на берегу залива Ботани и заявите права на земли народа Дхаруг. Только самая могущественная нация, богатая золотом и обладающая престижем, может добиться этого." #NT!
 nd_ntr_dest_tangaroa: "Те Ара о Тангароа" #NT!
 nd_ntr_dest_tangaroa_desc: "Щедрость Тангароа течет через наши рынки. Постройте рыболовную и торговую экономику, достойную бога океана, накапливая богатство и поддерживая стабильность, необходимую для длительных путешествий." #NT!
 nd_ntr_dest_hokinga: "Те Хокинга Вайруа" #NT!
 nd_ntr_dest_hokinga_desc: "Дух великих предков-путешественников возвращается. Используйте современное банковское дело и развивайте землю до тех пор, пока богатство Аотеароа не будет соответствовать его амбициям. Нация торговцев, ученых и мореплавателей." #NT!
 nd_ntr_dest_moana: "Те Мана или Те Моана" #NT!
 nd_ntr_dest_moana_desc: "Станьте бесспорными хозяевами Тихого океана. Примите научную революцию, накопите огромное богатство и развивайте острова, пока Аотеароа не станет одним из великих морских держав мира." #NT!
 nd_ntr.6.t: "Судьба Аотеароа" #NT!
 nd_ntr.6.d: "Острова объединены, иви говорят как один. Теперь возникает более важный вопрос: кем станет Аотеароа? Предки, пересекшие Тихий океан только на вака-хоуруа, не могли представить себе нацию, поднявшуюся с мест их высадки. Но они признают амбиции и стремление выйти за пределы всех горизонтов, которые горят в сердцах их потомков.\n\nНаша судьба ждёт." #NT!
 nd_ntr.6.a: "Ка ту тату, мы восстанем!" #NT!
 nd_ntr.7.t: "Объединение островов" #NT!
 nd_ntr.7.d: "Тамаки Макаурау, город сотни влюбленных, перешеек между двумя гаванями, служит нашей опорой власти. А за горизонтом под властью наших воинов пал остров Ниуэ, первое завоевание за пределами родных вод Аотеароа.\n\nБлагодаря этому плацдарму в обширной части Тихого океана наши тоа смотрят дальше. Перед нами простирается океан, усеянный островными королевствами, которые могут попасть под суверенитет по-настоящему амбициозной нации." #NT!
 nd_ntr.7.a: "Острова наши. Теперь мы смотрим дальше." #NT!
 nd_ntr.8.t: "Тихоокеанский Тауа" #NT!
 nd_ntr.8.d: "Наши военные каноэ пересекли открытый океан, чтобы доставить ману Аотеароа к далеким берегам. Королевства Тонга и вождества Фиджи оказались под нашим суверенитетом. Это первый раз, когда полинезийская держава проецировала силу так далеко за пределы своих родных вод.\n\nВетераны этих кампаний возвращаются с новыми знаниями и уверенностью. Некоторые выступают за то, чтобы оттачивать наши наступательные возможности, чтобы наступать еще дальше. Другие считают, что приоритетом должно быть укрепление контроля над этими огромными новыми территориями, привязывание завоеванных народов к нашему делу посредством интеграции и общих целей." #NT!
 nd_ntr.8.a: "Заточите тайяху для следующей кампании." #NT!
 nd_ntr.8.b: "Привяжите эти народы к нашей мане." #NT!
 nd_ntr.9.t: "Мана Венуа: Великая южная земля" #NT!
 nd_ntr.9.d: "Невозможное было достигнуто. Воины Аотеароа пересекли Тасман и водрузили свое знамя на берегах великого южного континента. Земли вокруг залива Ботани, обширные, плодородные и богатые ресурсами, теперь подчиняются правителю маори.\n\nЭто вершина военной судьбы Аотеароа, завоевание, которое затмевает все, что могли себе представить предки. Но удержание такой территории требует выбора: стремимся ли мы к полному военному доминированию, усиливая наши армии за счет всего остального? Или мы заселим эти новые земли, ассимилировав местные народы и построив устойчивую цивилизацию?" #NT!
 nd_ntr.9.a: "Тотальное доминирование: усиливай и побеждай." #NT!
 nd_ntr.9.b: "Поселяйтесь и стройте; эта земля теперь наша." #NT!
 nd_ntr.10.t: "Океанская дорога" #NT!
 nd_ntr.10.d: "Рынки Аотеароа переполнены дарами Тангароа. Рыба со всех берегов, поунаму из рек Те Вай Пунаму и продукты процветающей морской экономики наполняют наши торговые суда. Предки, которые ориентировались по звездам, чтобы добраться до этих островов, одобрили бы это; мы превратили океан из барьера в шоссе.\n\nС каждым годом наши торговцы расширяют свои границы, устанавливая торговые связи, которые приносят богатство и знания в наши гавани." #NT!
 nd_ntr.10.a: "Океан обеспечивает; мы будем следовать за его течением." #NT!
 nd_ntr.11.t: "Те Хокинга Вайруа: Великое путешествие" #NT!
 nd_ntr.11.d: "Дух великих предков-путешественников вернулся в новой форме. Там, где они со звездами и мужеством пересекли Тихий океан, мы теперь строим торговые сети и институты, охватывающие весь океан. Банковские дома в наших портах финансируют предприятия на отдаленные рынки. Наше развитие соперничает с развитием гораздо более крупных стран.\n\nНекоторые видят в этом основу настоящей торговой империи: наши торговцы должны доминировать на всех рынках Тихоокеанского региона, строя великие города, привлекающие богатства мира. Другие выступают за другой вид богатства: обмен знаниями и культурой, возникающий в результате приветствия мира на наших берегах." #NT!
 nd_ntr.11.a: "Постройте величайшую торговую империю в Тихом океане." #NT!
 nd_ntr.11.b: "Добро пожаловать в наш варенуи." #NT!
 nd_ntr.12.t: "Те Мана о те Моана: Повелители Тихого океана" #NT!
 nd_ntr.12.d: "Аотеароа достиг того, чего никогда не достигала ни одна полинезийская нация: научных и экономических преобразований, которые ставят ее в число великих держав мира. Наш флот патрулирует воды от Новой Зеландии до экватора. Наши ученые и тохунга приняли научную революцию, не отказываясь от мудрости предков.\n\nЭто вершина морской судьбы. Но даже сейчас есть те, кто спорит о том, как лучше всего распорядиться этой властью. Должны ли мы построить непобедимый флот, чтобы навязывать свою волю через Тихий океан? Или мы станем нацией знаний и дипломатии, которую все будут уважать и обхаживать, которую никто не боится, но которую недооценивают, рискуя всем миром?" #NT!
 nd_ntr.12.a: "Наши военные корабли будут править этими водами." #NT!
 nd_ntr.12.b: "Знание — это самая истинная форма маны." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_toa_strike: "Те Пату: Удар" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_toa_strike: "Воины Аотеароа усовершенствовали искусство решающего удара, быстрого, подавляющего и неудержимого. Наши кампании начинаются еще до того, как враг узнает о нашем приближении." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_toa_mana: "Те Мана Мотухаке: Суверенная власть" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_toa_mana: "Покоренные народы признают мана Аотеароа. Благодаря интеграции и общим целям новые территории привязаны к короне, хотя быстрое расширение напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_whenua_war: "Те Паканга Нуи: Великая война" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_whenua_war: "Тотальная военная мобилизация поддерживает завоевание южного континента. Все ресурсы направляются на усиление армий и поддержание кампании за счет дипломатических отношений." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_whenua_settle: "Те Нохоанга: Поселение" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_whenua_settle: "Поселенцы следуют за воинами, сажая кумары и строя па на берегах новой земли. Контроль устанавливается посредством оккупации и ассимиляции, хотя стоимость строительства в этих далеких землях высока." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_hokinga_trade: "Те Хокохоко Нуи: Великая торговля" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_hokinga_trade: "Купцы Аотеароа доминируют на тихоокеанских торговых путях. Наши города превращаются в крупные перевалочные пункты, привлекающие торговцев из-за океана, а их богатство поддерживает престиж нации." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_hokinga_whanau: "Те Ванаунгатанга: Родство" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_hokinga_whanau: "Принцип вханаунгатанга, родства и связи, выходит за рамки иви и охватывает более широкий мир. Посетителей и торговцев приветствуют, происходит обмен знаниями, а Аотеароа процветает благодаря открытости." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_moana_thalasso: "Те Тино Рангатиратанга или те Моана" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_moana_thalasso: "Абсолютный суверенитет над океаном. Военные корабли Аотеароа патрулируют Тихий океан от горизонта до горизонта, охраняя торговые пути и демонстрируя мощь, которая требует мирового признания." #NT!
 STATIC_MODIFIER_NAME_nd_ntr_dest_moana_matau: "Те Матауранга: Знание" #NT!
 STATIC_MODIFIER_DESC_nd_ntr_dest_moana_matau: "Самое большое сокровище – это знания. Ученые, дипломаты и шпионы Аотеароа плетут сеть влияния, которая простирается далеко за пределы возможностей любого флота, защищая интересы нации посредством мудрости." #NT!
 nd_ntr_whare_toa: "Те Уаре Тоа" #NT!
 nd_ntr_whare_toa_desc: "Большой тренировочный зал воинов, где боевые традиции Аотеароа, от древнего искусства мау-ракау до современного общевойскового боя, передаются из поколения в поколение." #NT!
 nd_ntr_whare_toa_upkeep: "Содержание Зала Воинов" #NT!
 nd_ntr_whare_toa_upkeep_desc: "Оружие, древесина для тренировочных площадок и камень для укреплённых стен зала воинов." #NT!
 nd_ntr_whare_taonga: "Те Уаре Таонга" #NT!
 nd_ntr_whare_taonga_desc: "Великая сокровищница и торговый центр на побережье, где богатства Тихого океана проходят через руки маори, пунаму, шелк, специи и товары дюжины островных государств." #NT!
 nd_ntr_whare_taonga_upkeep: "Содержание сокровищницы" #NT!
 nd_ntr_whare_taonga_upkeep_desc: "Древесина для складских помещений, ткань для упаковки и демонстрации, а также инструменты для взвешивания и измерения торговых товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_ntr_bureaucracy_authority: "Тиканга Маори" #NT!
 AUTO_MODIFIER_DESC_nd_ntr_bureaucracy_authority: "Институты Аотеароа (советы рангатира, учебные дома тохунга, укрепления па, обычное право муру и уту и ​​объединительное движение Кингитанга) превратились в стройный административный аппарат. На этом основании конфедерация иви начинает управлять как единое государство, не отказываясь от племенной маны, которая ее создала." #NT!
  
 ntr_rangatiratanga_bureaucracy: "Рангатиратанга" #NT!
 ntr_rangatiratanga_bureaucracy_desc: "Рангатира (вождь) и арики (верховный вождь) возглавляют иви и хапу посредством унаследованной маны и личного авторитета, руководствуясь на каждом шагу советом старейшин коруа. Власть осуществляется по обоюдному согласию, а не принуждению: рангатира, теряющий ману, теряет последователей, а конфедерация племен поддерживается за счет взаимного признания этих советов вождей, а не какого-либо единого суверенного указа. Если система поддерживается в хорошем состоянии, она дает королевству глубокий резерв легитимных местных губернаторов; если пренебречь, то оно вновь растворится в автономии составляющих его иви." #NT!
  
 ntr_tohunga_whare_wananga_bureaucracy: "Tohunga me te Whare Wananga" #NT!
 ntr_tohunga_whare_wananga_bureaucracy_desc: "Тохунга были специалистами, которые владели наибольшими знаниями тапу иви: генеалогии вакапапа, звездными путями и морскими дорогами, резьбой поунаму и обработкой дерева, искусством исцеления и ритуалом каракиа, который открывал или завершал каждое начинание. Их ученики учились в варэ-вананге, священных учебных домах, где знания передавались устно из поколения в поколение. Демонтаж класса тохунга значил разорвать саму линию памяти, но коррумпированное или корыстное духовенство могло превратить эту же самую власть в частную монополию на истину." #NT!
  
 ntr_pa_network_bureaucracy: "Вакапакари Па" #NT!
 ntr_pa_network_bureaucracy_desc: "Па представляла собой поселение на вершине холма или полуострове, защищенное рвами, частоколами, боевыми платформами и (после контакта с европейцами) террасами с мушкетными бойницами. Каждый иви содержал несколько па, предназначенных для сезонных кампаний и в качестве убежищ на войне, построенных и отремонтированных общинными рабочими, привлеченными из окружающих хапу. Сеть дала Аотеароа глубину обороны, которая сбила бы с толку британских генералов во время новозеландских войн 1860-х годов, но трудовые обязательства легли на земледельцев, которые платили кумара и потом за стены, которые они не всегда хотели строить." #NT!
  
 ntr_muru_me_utu_bureaucracy: "Муру ме Уту" #NT!
 ntr_muru_me_utu_bureaucracy_desc: "Обычное право реституции и взаимности. Муру представлял собой ритуальный грабительский набег, во время которого оскорбленный хапу забирал собственность у родственников преступника, чтобы восстановить баланс, нарушенный нарушением тапу или оскорблением маны. Уту был более широким принципом, который требовал, чтобы на каждый подарок, оскорбление и честь отвечали тем же. Вместе они составляли навязанный сообществом правовой порядок, который обходил любые приказы вождя: мана сохранялась, люди питались, а распри продолжались из поколения в поколение, в то время как полномочия центрального государства оставались соответственно слабыми." #NT!
  
 ntr_kingitanga_bureaucracy: "Те Кингитанга" #NT!
 ntr_kingitanga_bureaucracy_desc: "В 1858 году вожди центральной части Северного острова собрались в Нгаруавахии и избрали Те Верогеро Потатау первым королем маори. Частично созданный по образцу британской монархии, которую вожди соблюдали со времен Договора Вайтанги 1840 года, Кингитанга стремилась остановить отчуждение исконных земель путем объединения иви под единым сувереном, способным вести переговоры с Короной на равных условиях. Как институт он представляет собой момент, когда конфедерация иви превращается в национальную королевскую власть: цена, уплаченная за независимость рангатиры, выигрыш в единой легитимности." #NT!
