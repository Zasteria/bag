l_russian:
  # ============================================================================ 
  # Formation event 
  # ============================================================================ 
 nd_tab.1.t: "Фаворская гора" #NT!
 nd_tab.1.d: "На меловой вершине холма к югу от Праги крестьяне-беженцы и мещане поднимают республику-братство. Чаша летит над лагером повозки. Пять папских крестовых походов потерпели крах под цепами Жижки; радикальное крыло гуситской революции, вопреки всем ожиданиям, победило.\n\nТеперь братство должно решить, какое государство оно построило. Фаворская коммуна всегда представляла собой два движения одновременно: тысячелетнее крестьянское братство, проповедующее скорое Царство Божие, и институциональную республику дисциплинированных полевых армий под командованием таких капитанов, как Прокоп Великий. Оба крыла отказались от Базельских соглашений. Оба отвергли римскую власть. Но вопрос, над которым они боролись пятнадцать лет, остается: насколько радикальной должна быть церковь-чаша?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tab.1.a: "Братская община: общинная собственность и чаша для всех" #NT!
 nd_tab.1.b: "Каликстинское царство: дисциплинированная гуситская республика Прокоп." #NT!
  
  # ============================================================================ 
  # Formation choice modifiers 
  # ============================================================================ 
 STATIC_MODIFIER_NAME_nd_tab_commune_of_brethren: "Коммуна Братьев" #NT!
 STATIC_MODIFIER_DESC_nd_tab_commune_of_brethren: "Преобладает радикальное крыло Табора. Коммунальная собственность, женатое священство, женщины-воительницы, чешская народная литургия: братство — одна плоть под чашей. Рабочая сила течет в результате широкой мобилизации каждой души, но христианский мир отшатывается от еретической республики на Влтаве." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_calixtine_compact: "Каликстин Компактный" #NT!
 STATIC_MODIFIER_DESC_nd_tab_calixtine_compact: "Институциональное видение Прокопа Великого преобладает. Чаша для всех, но упорядоченная богемская республиканская политика: дворяне, горожане и армейские капитаны разделяют управление в соответствии со строгой выборной дисциплиной. Армии с повозками профессиональны, и исход войны против крестоносцев имеет решающее значение, но милленаристский огонь сдерживается." #NT!
  
  # ============================================================================ 
  # DHE event 2: war-wagon doctrine choice 
  # ============================================================================ 
 nd_tab.2.t: "Возова Градба: Стена вагонов" #NT!
 nd_tab.2.d: "Доктрина мобильных крепостей Жижки изменила ведение боевых действий в Европе. Повозки, запряженные волами, усиленные железными пластинами, снабженные ручными пушками, легкой артиллерией и бойницами для арбалетов; скованные вместе, они образуют стену из повозок, которая сбивает атаки рыцарской кавалерии и служит ночным лагерем полевой армии. Куда идут повозки, туда идет и братство.\n\nКапитаны обсуждают доктрину. Школа Жижки рассматривает повозку как наступательную систему: движущуюся крепость, агрессивно выступающую на территорию противника, снабжаемую набегами и данью. Школа Прокопа рассматривает его как оборонительный бастион: фургон-форт, в который возвращается полевая армия, чтобы противостоять любому нападающему." #NT!
 nd_tab.2.a: "Жижковский путь: повозка как движущаяся крепость" #NT!
 nd_tab.2.b: "Повозка как оборонительный бастион" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_zizka_doctrine: "Доктрина Жижковского" #NT!
 STATIC_MODIFIER_DESC_nd_tab_zizka_doctrine: "Полевая армия движется туда, куда летит чаша. Агрессивная доктрина «фургон-крепость»: быстрая концентрация, глубокие рейды, быстрая вербовка." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_wagon_bastion: "Вагонный бастион" #NT!
 STATIC_MODIFIER_DESC_nd_tab_wagon_bastion: "Повозки братства — это мобильные крепости. Войска крестоносцев прижимаются к лагеру и маршируют домой по частям." #NT!
  
  # ============================================================================ 
  # DHE event 3: Four Articles enforcement 
  # ============================================================================ 
 nd_tab.3.t: "Четыре статьи Праги" #NT!
 nd_tab.3.d: "Свободная проповедь слова. Причащение в обоих видах: Чаша для мирян. Апостольская бедность духовенства. Суровое наказание за все явные грехи. Четыре статьи, составленные в Праге в 1420 году и за которые боролись на протяжении многих лет, теперь являются конституцией братства.\n\nНо сами статьи можно читать двояко. Строгое прочтение обязывает каждого христианина соблюдать братскую дисциплину: богохульство, блуд, симония, пьянство: все подпадает под ответственность выборного суда. Толерантное чтение превыше всего ценит чашу и народное слово; позвольте братьям проповедовать свободно и доверять Слову, выполняющему свою работу." #NT!
 nd_tab.3.a: "Строгое исполнение: открытые грехи подлежат ответственности перед братством" #NT!
 nd_tab.3.b: "Чаша для всех: народная проповедь, толерантная дисциплина" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_articulus_strict: "Артикулус Строгий" #NT!
 STATIC_MODIFIER_DESC_nd_tab_articulus_strict: "Церковь-чаша обеспечивает соблюдение апостольской дисциплины. Конфессиональное единообразие происходит быстро; народное инакомыслие встречается редко; братия трезво ходят под выборным судом." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_articulus_tolerant: "Артикул Толерантный" #NT!
 STATIC_MODIFIER_DESC_nd_tab_articulus_tolerant: "Братство ставит чашу и народное Слово выше церковной дисциплины. Чешские типографии размножаются, и отличительной чертой Табора становится толерантность к инакомыслящим христианским сектам." #NT!
  
  # ============================================================================ 
  # DHE event 4: Lipany averted 
  # ============================================================================ 
 nd_tab.4.t: "Липаны предотвращены" #NT!
 nd_tab.4.d: "В истории, которой не произошло, полевая армия Табора и Сиротчи разбилась против утраквистско-католической коалиции в Липанах в мае 1434 года. Радикальное крыло гуситской революции было уничтожено за один день, а церковь-чаша погрузилась в умеренный компромисс.\n\nВ этой истории Липаны не произошли, или всё произошло по-другому. Прокоп Великий не погиб в бегстве. Полевая армия Братства остается нетронутой. Теперь вопрос, что с этим делать. Давить на державы крестоносцев и диктовать свои условия Империи? Или консолидировать братство дома, объединив уцелевших радикалов Сиротчи в единое дисциплинированное содружество?" #NT!
 nd_tab.4.a: "Продвигайте полевую армию вперед против крестоносцев." #NT!
 nd_tab.4.b: "Консолидировать братство: интегрировать крыло Сиротчи" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_field_army_offensive: "Наступление полевой армии" #NT!
 STATIC_MODIFIER_DESC_nd_tab_field_army_offensive: "Повозки-крепости братства катятся в Саксонию, Бранденбург, Лужицу. Державы крестоносцев учатся бояться чаши." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_brotherhood_consolidated: "Братство Объединенное" #NT!
 STATIC_MODIFIER_DESC_nd_tab_brotherhood_consolidated: "Радикалы Сиротчи интегрируются в институциональную структуру братства. Раздор фракций растворяется в дисциплинированной республике-чаше." #NT!
  
  # ============================================================================ 
  # DHE event 5: Vernacular scripture (single-option) 
  # ============================================================================ 
 nd_tab.5.t: "Чешская Библия" #NT!
 nd_tab.5.d: "Пльзеньская Библия (одна из самых ранних печатных Библий на любом европейском языке) находит свое место в каждом приходском зале, классе и часовне-лагере братства. Эгалитарная церковь Табора теперь является эгалитарной церковью грамотности: крестьяне, горожане и дворяне читают одни и те же народные писания, поют одни и те же чешские гимны и спорят с одним и тем же толкованием в одних и тех же выборных судах.\n\nНи одно другое государство в Европе не догонит этого в течение столетия." #NT!
 nd_tab.5.a: "Народное Слово создает грамотное братство" #NT!
  
  # ============================================================================ 
  # DHE event 6: Married priesthood 
  # ============================================================================ 
 nd_tab.6.t: "Апостольские браки" #NT!
 nd_tab.6.d: "Чашное духовенство берет жен. Фаворское братство следует апостольскому примеру, а не римской традиции: священник женат, воспитывает детей и обрабатывает те же поля, что и его паства. Духовенство — это не отдельная каста, а старшие братья коммуны, избираемые и увольняемые мирянами, которым они служат.\n\nПодобная практика возмущает католическую Европу. Это также удваивает уровень духовной грамотности в приходах Фавора в течение одного поколения: дом священника становится школой, жена священника - дьяконом во всем, кроме имени." #NT!
 nd_tab.6.a: "Духовенство - братья, а не каста" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_apostolic_clergy: "Апостольское духовенство" #NT!
 STATIC_MODIFIER_DESC_nd_tab_apostolic_clergy: "Женатые приходские священнослужители воспитывают семьи и руководят сельскими школами. Численность населения, грамотность и конфессиональное единство растут вместе." #NT!
  
  # ============================================================================ 
  # DHE event 7: Brotherhood Diet 
  # ============================================================================ 
 nd_tab.7.t: "Диета Братства" #NT!
 nd_tab.7.d: "Четыре избранных капитана Табора (основатель хейтмане 1420 г.) становятся конституционным ядром зрелой выборной республики. Сейм Братства, заседающий два раза в год, состоит из городских олдерменов, приходских старейшин и капитанов полевых армий, избираемых по клятве чаши и статей, а не по родословной.\n\nСейчас идет дискуссия о том, кто именно может сидеть. Строгое прочтение признает только проверенных в полевых условиях капитанов и олдерменов: модель с четырьмя капитанами в целом - дисциплина избранных. Открытое чтение допускает более широкую общину: крестьян, женщин-проповедниц (особенность Табора) и гильдий горожан, исходя из того принципа, что братство - это одно тело чаши." #NT!
 nd_tab.7.a: "Дисциплина четырех капитанов: избранные возглавляют братство" #NT!
 nd_tab.7.b: "Откройте сейм: крестьяне, женщины, мещане — все могут сидеть." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_four_captains: "Дисциплина четырех капитанов" #NT!
 STATIC_MODIFIER_DESC_nd_tab_four_captains: "Братский сейм — это выборная дисциплина проверенных: армейских капитанов, городских олдерменов, приходских старост. Решения принимаются с военной точностью." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_open_diet: "Открытая диета" #NT!
 STATIC_MODIFIER_DESC_nd_tab_open_diet: "Республика-чаша допускает в выборный орган каждого брата и сестру. Крестьяне и женщины-проповедники получают неслыханные места в Европе." #NT!
  
  # ============================================================================ 
  # DHE event 8: Czech humanism (single-option) 
  # ============================================================================ 
 nd_tab.8.t: "Коменский и чешские гуманисты" #NT!
 nd_tab.8.d: "Ян Амос Коменский (Коменский), епископ Чешских братьев, излагает полную философию образования в традиции Фабора: народное обучение для всех классов и обоих полов, обучение на практике, знания, организованные для государства. К восемнадцатому веку его преемники образуют передовой край европейского гуманизма.\n\nСемя, посаженное в 1420 году (чаша для мирян, Слово на его родном языке, братство как одна школа), расцветает как чешская интеллектуальная республика, которую католические державы не могут подавить, потому что каждый чешский крестьянин умеет читать." #NT!
 nd_tab.8.a: "Чашечная традиция расцветает как чешский гуманизм" #NT!
  
  # ============================================================================ 
  # Advances 
  # ============================================================================ 
 nd_tab_bohemian_reform_preachers: "Богемские проповедники реформ" #NT!
 nd_tab_bohemian_reform_preachers_desc: "Конрад Вальдхаузер, Милич из Кромержижа и Вифлеемская капелла проповедуют чешскую Реформацию за поколение до Гуса. Проповедь на родном языке — это живое учреждение до рождения братства." #NT!
  
 nd_tab_waldensian_refuge: "Вальденсское убежище" #NT!
 nd_tab_waldensian_refuge_desc: "Чешские вальденсы южной Чехии сохраняли антиклерикальные традиции на протяжении всего XIV века. Беженцы-вальденсы пополняют ряды раннего братства." #NT!
  
 nd_tab_jan_hus_legacy: "Наследие Яна Гуса" #NT!
 nd_tab_jan_hus_legacy_desc: "Богемский проповедник апостольской бедности, отлученный от церкви в 1411 году, сожженный в Констанце в 1415 году под охранной грамотой. Его мученическая смерть положила начало гуситским войнам." #NT!
  
 nd_tab_free_town_charters: "Бесплатные городские чартеры" #NT!
 nd_tab_free_town_charters_desc: "Жатец, Градец-Кралове, Табор: Чешские вольные города представляют собой городские братства ремесленников и горожан с выборными олдерменами и гражданским ополчением. Фактически они являются республиками еще до того, как они стали таковыми по закону." #NT!
  
 nd_tab_hradiste_communes: "Градиште Таборский" #NT!
 nd_tab_hradiste_communes_desc: "Крестьяне-беженцы нашли Фавор на защищенной вершине холма в 1420 году, назвав его в честь горы Преображения. Писек, Водриан и Жатец подражают укреплённо-эгалитарной модели." #NT!
  
 nd_tab_vozova_hradba: "Возова Градба: Стена вагонов" #NT!
 nd_tab_vozova_hradba_desc: "Мобильная крепость Жижки: повозки с быками, усиленные железными пластинами, оснащенные ручными пушками, легкой артиллерией и бойницами для арбалетов. Скованные вместе, они сбивают атаки рыцарской кавалерии. Тактическая революция пятнадцатого века." #NT!
  
 nd_tab_pistala_handgunners: "Пиштяльские пистолетчики" #NT!
 nd_tab_pistala_handgunners_desc: "Чешская пиштала (свисток, предок современного пистолета) — изобретение гуситов. Застрельщики из ручных пушек шокируют европейскую кавалерию изнутри лагера-фургона." #NT!
  
 nd_tab_brotherhood_levy: "Братство по оружию" #NT!
 nd_tab_brotherhood_levy_desc: "Каждый таборит присягнул чаше и повозке. Молотильные цепы и импровизированные пики вооружают гражданина-солдата; доктрина повозки-форта ставит крестьянскую пехоту в один ряд с феодальной кавалерией." #NT!
  
 nd_tab_four_articles: "Четыре статьи Праги" #NT!
 nd_tab_four_articles_desc: "Свободная проповедь, общение в обоих видах, апостольская бедность духовенства, суровое наказание за явные грехи. Конституционный документ гуситской революции." #NT!
  
  
 nd_tab_lipany_averted: "Липаны предотвращены" #NT!
 nd_tab_lipany_averted_desc: "В истории этого не произошло: полевая армия Табора и Сиротчи разбилась при Липанах в 1434 году, и радикальное крыло было поглощено умеренным утракизмом. В этой истории полевая армия выстоит. Прокоп Великий жив. Республика-чаша суверенна." #NT!
  
 nd_tab_sirotci_banner: "Знамя Сиротков" #NT!
 nd_tab_sirotci_banner_desc: "После смерти Жижки в 1424 году его самые радикальные сторонники в трауре назвали себя сиротами (сиротцами). При Прокопе Великом они совершают набеги до Бранденбурга, Прибалтики, Венгрии." #NT!
  
 nd_tab_vernacular_scripture: "Чешская Библия" #NT!
 nd_tab_vernacular_scripture_desc: "Пльзеньская Библия (1432 г.) входит в число самых ранних печатных народных Библий средневековой Европы. Народные Священные Писания — это двигатель братства по повышению грамотности." #NT!
  
 nd_tab_communal_property: "Коммунальная собственность" #NT!
 nd_tab_communal_property_desc: "Приходящие братья сдают частное богатство в общие хранилища. Братство управляет полями, запасами и логистикой полевой армии как единый финансовый организм: средневековые якобинцы Каутского." #NT!
  
 nd_tab_itinerant_preachers: "Странствующие проповедники" #NT!
 nd_tab_itinerant_preachers_desc: "Гуситские проповедники (казатели) бродят по землям чаш, вовлекая крестьян, женщин и горожан в жизнь братства. Их кафедры одновременно служат пунктами вербовки." #NT!
  
 nd_tab_married_priesthood: "Апостольские браки" #NT!
 nd_tab_married_priesthood_desc: "Чашное духовенство берет жен, воспитывает семьи, обрабатывает те же поля, что и их стадо. Говоря о Реформации, центральноевропейские реформаторы ссылаются на прецедент Фавора." #NT!
  
 nd_tab_communal_charity: "Коммунальная благотворительность" #NT!
 nd_tab_communal_charity_desc: "Эгалитаризм Табора распространяется и на милостыню: больницы как клиники и богадельни, без различия рангов. Модель реформаторской приходской помощи бедным во всей протестантской Европе." #NT!
  
 nd_tab_crusade_defied: "Крестовые походы бросили вызов" #NT!
 nd_tab_crusade_defied_desc: "Пять папских крестовых походов разбились о чашу. Это поражение католической континентальной державы, произошедшее в результате Реформации, стало основополагающим мифом военной самоуверенности европейского протестантизма." #NT!
  
 nd_tab_unitas_fratrum: "Юнитас Фратрум" #NT!
 nd_tab_unitas_fratrum_desc: "Чешские братья превратили общинный пацифизм коммуны Табор в одну из первых в Европе церквей массовой грамотности и республику письма." #NT!
  
 nd_tab_brotherhood_diet: "Диета Братства" #NT!
 nd_tab_brotherhood_diet_desc: "Четыре избранных капитана Табора составляют конституционное ядро ​​зрелой выборной республики: Братский сейм, состоящий из городских олдерменов, приходских старейшин и капитанов полевой армии." #NT!
  
 nd_tab_comenius_pedagogy: "Коменская педагогика" #NT!
 nd_tab_comenius_pedagogy_desc: "Коменский (Ян Амос Коменский), епископ Чешских братьев, становится самым влиятельным педагогом Европы. Народное обучение для всех классов, обоих полов (на три столетия раньше)." #NT!
  
 nd_tab_brethren_printing: "Братья, печатающие в изгнании" #NT!
 nd_tab_brethren_printing_desc: "Типографии «Чешские братья» управляют книжной торговлей «Республика букв», продавая народные религиозные и педагогические тексты по всей Европе. Народная пресса становится прибыльной экспортной отраслью." #NT!
  
 nd_tab_anti_absolutism: "Антиабсолютизм" #NT!
 nd_tab_anti_absolutism_desc: "Гуситско-республиканский дух отказывается подчиняться абсолютистским судебным реформам, охватившим Европу. Конституционная альтернатива Версалю." #NT!
  
 nd_tab_czech_humanism: "Чешский гуманизм" #NT!
 nd_tab_czech_humanism_desc: "Род Фавор-Братья-Коменский расцветает в эпоху революций. Религия, народная грамотность, общественная благотворительность превратились в гражданскую добродетель современной республики." #NT!
  
 nd_tab_first_commune: "Первая Коммуна" #NT!
 nd_tab_first_commune_desc: "Радикалы девятнадцатого века вновь открывают для себя Таборское братство как глубокий прецедент европейского социализма. Чашечная республика названа первой коммуной." #NT!
  
 nd_tab_brotherhood_in_arms: "Братство по оружию" #NT!
 nd_tab_brotherhood_in_arms_desc: "Леви в массовом порядке соответствует гуситской традиции военных повозок. Массовая мобилизация в сочетании с дисциплинированной оборонительной доктриной создает национально-республиканскую военную систему." #NT!
  
 nd_tab_civic_militia: "Гражданская милиция" #NT!
 nd_tab_civic_militia_desc: "Современный потомок братства боевых повозок: общинные арсеналы, приходская муштра и традиция гражданской солдатской службы в Чешской республике с чашами и флагами." #NT!
  
  # ============================================================================ 
  # Units 
  # ============================================================================ 
 a_nd_tab_tabor_militia: "Таборское ополчение" #NT!
 a_nd_tab_tabor_militia_desc: "Крестьянский цеповой ополчение братства боевых обозов. Каждый мужчина-таборит поклялся защищать чашу; доктрина повозок-крепостей делает их импровизированное вооружение достойным соперником феодальной кавалерии." #NT!
  
 a_nd_tab_handgunners: "Пиштяльские пистолетчики" #NT!
 a_nd_tab_handgunners_desc: "Чешские ручные артиллеристы. Пиштала (свисток), прародитель современного пистолета, является изобретением гуситов. Разрушительный удар по небронированной пехоте и паникующей кавалерии." #NT!
  
 a_nd_tab_sirotci: "Тяжелая пехота Сиротчи" #NT!
 a_nd_tab_sirotci_desc: "Сироты: радикальные боевики, вышедшие на поле боя после смерти Жижки в 1424 году и в трауре назвавшие себя Сиротцами. При Прокопе Великом они совершили набеги до Бранденбурга и Прибалтики." #NT!
  
 a_nd_tab_vozova_hradba: "Возова Градба" #NT!
 a_nd_tab_vozova_hradba_desc: "Гуситские военные повозки: бронированные крепости, запряженные волами, оснащенные изящными гаубицами, ручными пушками и бойницами для арбалетов. Медленная, но разрушительная оборонительная огневая мощь; Построение стены из повозок произвело революцию в европейской войне." #NT!
  
  # ============================================================================ 
  # Levies 
  # ============================================================================ 
 levy_nd_tab_tabor_militia: "Таборская милиция Леви" #NT!
 levy_nd_tab_tabor_militia_desc: "Мобилизация присягнувшего чаше крестьянства. Цеп, щука и лагер повозки." #NT!
  
  # ============================================================================ 
  # Buildings 
  # ============================================================================ 
 nd_tab_hradiste: "Градиште" #NT!
 nd_tab_hradiste_desc: "Общественный укрепленный горный город по образцу первоначального Фавора (1420 г.), основанный на защищенной вершине холма и названный в честь горы Преображения. Оборонительный бастион чаши республики." #NT!
  
 nd_tab_articulus_house: "Артикулус Хаус" #NT!
 nd_tab_articulus_house_desc: "Политико-религиозное собрание городского уровня, которое ратифицирует и обеспечивает соблюдение Четырех статей Праги. Ядро гуситско-республиканской конституции." #NT!
  
 nd_tab_vernacular_press: "Народная пресса" #NT!
 nd_tab_vernacular_press_desc: "Чешскоязычная типография. Гуситская Богемия подготовила одну из самых ранних библейских программ средневековой Европы на народном языке; Пльзеньская Библия (1432 г.) является двигателем грамотности для братства." #NT!
  
 nd_tab_communal_hospital: "Коммунальная больница" #NT!
 nd_tab_communal_hospital_desc: "Гуситское эгалитарное здравоохранение: лечебница и богадельня для больных, вдов, сирот и паломников без различия рангов. Модель реформаторской приходской помощи бедным." #NT!
  
 nd_tab_brotherhood_treasury: "Сокровищница Братства" #NT!
 nd_tab_brotherhood_treasury_desc: "Управление коммунальной собственностью. Приходящие братья сдают частное богатство в общие хранилища; Казначейство управляет полями, складами и логистикой полевой армии как единым финансовым организмом." #NT!
  
 nd_tab_hussite_pulpit: "Гуситская кафедра" #NT!
 nd_tab_hussite_pulpit_desc: "Зал вербовки под руководством проповедника. Странствующие проповедники (казатели) вовлекают в жизнь братства крестьян, женщин и мещан; кафедра одновременно служит вербовочным пунктом для полевой армии." #NT!
  
  # ============================================================================ 
  # Building production methods 
  # ============================================================================ 
 nd_tab_hradiste_maintenance: "Градиштский гарнизон" #NT!
 nd_tab_hradiste_maintenance_desc: "Камень, древесина, оружие и варочная бочка поддерживают гарнизон горного города наготове." #NT!
  
 nd_tab_articulus_maintenance: "Артикулус отчеты" #NT!
 nd_tab_articulus_maintenance_desc: "Бумага, книги, свечи и скамейки для выборного суда. Конституционная жизнь братства требует своего бюрократического аппарата." #NT!
  
 nd_tab_vernacular_press_maintenance: "Пресс-служба" #NT!
 nd_tab_vernacular_press_maintenance_desc: "Бумага, книги, пчелиный воск и печатные инструменты. Пресса никогда не спит." #NT!
  
 nd_tab_communal_hospital_maintenance: "Больничная Благотворительность" #NT!
 nd_tab_communal_hospital_maintenance_desc: "Лекарства, пиво, белье и свечи для больных, вдов и сирот братства." #NT!
  
 nd_tab_brotherhood_treasury_maintenance: "Управление казначейства" #NT!
 nd_tab_brotherhood_treasury_maintenance_desc: "Бумага, бухгалтерские книги, свечи и скамейки для хранителей общих запасов." #NT!
  
 nd_tab_hussite_pulpit_maintenance: "Обеспечение кафедры" #NT!
 nd_tab_hussite_pulpit_maintenance_desc: "Книги и свечи для проповедника; хлеб и пиво для братьев, которые ответят на призыв." #NT!
  
 nd_tab_brethren_press_pm: "Братская книжная торговля" #NT!
 nd_tab_brethren_press_pm_desc: "Чешские братья в изгнании печатают педагогические и религиозные тексты на народном языке для продажи по всей Центральной и Северной Европе, потребляя бумагу и чернила-красители для производства книг для республики письма." #NT!
  
  
 a_nd_tab_republican_infantry: "Чешская республиканская пехота" #NT!
 a_nd_tab_republican_infantry_desc: "Современная массовая тяжелая пехота Чаши республики. Братство Таборских боевых повозок превратилось в республиканскую массовую воинскую повинность: дисциплинированный, плотный огонь по чешско-республиканским стандартам." #NT!
  
 nd_tab_komensky_school: "Коменское училище" #NT!
 nd_tab_komensky_school_desc: "Народное педагогическое заведение чешской братской традиции. Коменский систематизировал школьное образование для всех классов и обоих полов за столетие до того, как наступила эпоха Просвещения; Коменское училище — приходское воплощение его педагогики." #NT!
  
 nd_tab_komensky_school_maintenance: "Школьное обеспечение" #NT!
 nd_tab_komensky_school_maintenance_desc: "Книги, бумага, свечи и скамейки. Братья учат на деле: знания организованы для всеобщего благосостояния." #NT!
  
