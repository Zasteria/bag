  # ----- Destiny Advances ----- 
 nd_tab_destiny: "Судьба Чаши Республики" #NT!
 nd_tab_destiny_desc: "Братство победило. Теперь начинается долгий проект Гуситской республики. Выберите путь Чешской Реформации или Коммунальной республики в событии формирования, чтобы разблокировать дальнейшие цели." #NT!
  
 nd_tab_dest_silesian_reform: "Реформа на Силезской границе" #NT!
 nd_tab_dest_silesian_reform_desc: "Принесите под чашу Вроцлав и Гёрлиц. Силезия и Лужица — естественная граница гуситской реформации; горожане этих городов читали Гуса, но их епископы до сих пор носят римские митры. Заработайте достаточно престижа, чтобы Империя серьезно относилась к братству как к конфессиональной силе." #NT!
  
 nd_tab_dest_reformation_export: "Континентальная Реформация" #NT!
 nd_tab_dest_reformation_export_desc: "Примите институт конфессионализма и захватите Виттенберг, колыбель немецкой реформы. Чаша и Девяносто пять тезисов должны говорить в один голос. Казначейство финансирует книгопечатание, миссию и дисциплинированную миссионерскую армию Чаши." #NT!
  
 nd_tab_dest_bohemian_synod: "Богемский Синод" #NT!
 nd_tab_dest_bohemian_synod_desc: "Аугсбург, Женева, Лейпциг: три города Реформации под руководством одного совета, возглавляемого богемой. Республика-чаша командует континентальным протестантским союзом, имеющим действующую армию и престиж, позволяющий ее сохранить. Открывает доступ к Залу Богемского Синода." #NT!
  
 nd_tab_dest_civic_brotherhood: "Гражданское Братство" #NT!
 nd_tab_dest_civic_brotherhood_desc: "Примите меритократию. Углублять внутреннюю коммуну: выборные должности для приходов, городов и полей, а также достаточно богатую казну, чтобы финансировать эксперимент братства по эгалитарному управлению." #NT!
  
 nd_tab_dest_vernacular_commonwealth: "Народное Содружество" #NT!
 nd_tab_dest_vernacular_commonwealth_desc: "Примите эпоху Возрождения и развивайте печатную культуру на чешском языке, настолько глубокую, что бумага продается через рынок капитала. Республика чаши становится континентальной индустрией народной грамотности." #NT!
  
 nd_tab_dest_demokraticky_sjezd: "Демократицкий Съезд" #NT!
 nd_tab_dest_demokraticky_sjezd_desc: "Примите Просвещение. Община Табор завершает свой долгий проект: создание полностью демократического парламента на чешском языке, в котором сможет заседать каждый приходской старейшина и полевой капитан. Открывает доступ к Демократическому съезду." #NT!
  
  # ----- Destiny DHE Events ----- 
 nd_tab.9.t: "Судьба Чаши" #NT!
 nd_tab.9.d: "Братство-республика стоит. Компактаты разорваны; Римской власти было отказано; Стены повозок откатили пять папских войск обратно в Империю. Теперь чаша летит над суверенным государством, и начинается долгий проект. Капитаны, проповедники и олдермены встречаются в Доме Артикулуса, чтобы обсудить, что будет дальше.\n\nВкладка «Судьба» на панели «Традиции» теперь загорается: ваш выбор формации определил путь." #NT!
 nd_tab.9.a: "Чаша пишет свое будущее" #NT!
  
 nd_tab.10.t: "Силезский рубеж" #NT!
 nd_tab.10.d: "Вроцлав и Гёрлиц летают в кубке. Силезские и лужицкие горожане, долгое время симпатизировавшие Гусу, теперь принадлежат братству по договору и по гарнизону. Чешские проповедники доходят до Империи до самого Одера, и престиж чаши растет во всех ганзейских и имперских городах.\n\nСилезская граница — это первый зарубежный урожай чаши." #NT!
 nd_tab.10.a: "Граница принадлежит братству" #NT!
  
 nd_tab.11.t: "Реформация приходит" #NT!
 nd_tab.11.d: "Виттенберг упал в чашу. Конфессионализм — государственный институт; Богемская печать находится рядом с саксонской печатью на трактатах Реформации; типографии братства переустанавливают свои бланки на немецкий и чешский языки. Империя пылает реформами, а республика-чаша является ее старшим партнером.\n\nКапитаны обсуждают, как продвигать реформы дальше. Послать наших проповедников и дипломатов к немецким князьям или вооружить лютеранских реформаторов и позволить повозкам братства говорить за себя?" #NT!
 nd_tab.11.a: "Отправьте наших проповедников по всей Империи" #NT!
 nd_tab.11.b: "Вооружите лютеранских реформаторов" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_brotherhood_preachers: "Братство проповедников за рубежом" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_brotherhood_preachers: "Гуситские проповедники и дипломаты разбросаны среди немецких князей. Информационные сети распространяются, договорные каналы множатся. Но казна братства перегружена расходами на апостольство." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_arm_the_reformers: "Вооружите реформаторов" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_arm_the_reformers: "Богемские повозки и пиштялские пистолеты усиливают каждый лютеранский набор. Армейские традиции растут, а реформированные армии растут. Но старая гуситско-чешская знать возмущается, когда ее превращают в кузницу для иностранных выскочек." #NT!
  
 nd_tab.12.t: "Богемский Синод" #NT!
 nd_tab.12.d: "Аугсбург, Женева, Лейпциг под чашей. Гуситские, лютеранские и реформатские делегации сидят за одним столом, возглавляемым богемой, и единый центральноевропейский протестантизм обретает конституционную форму. Зал Синода в Праге является штаб-квартирой реформы.\n\nКапитаны обсуждают позицию совета. Настаивать на богословском союзе и мирном континентальном урегулировании или относиться к Синоду как к воинственному высшему командованию, к церкви-чаше, вооруженной против католических держав?" #NT!
 nd_tab.12.a: "Объединенная Реформация под одним синодом" #NT!
 nd_tab.12.b: "Воинствующий синод, чашная церковь под ружьем" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_united_synod: "Объединенный Реформационный Синод" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_united_synod: "Гуситские, лютеранские и реформатские делегации встречаются под одной чашей. Дипломатические каналы расширяются, союзники и подданные связываются крепче, и даже конкурирующие державы дважды подумают, прежде чем объявлять войну Синоду." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_militant_synod: "Воинственный Синод" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_militant_synod: "Зал Синода выполняет функции военного совета. Крепости крестоносцев падают быстрее, бреши штурмуются, а Реформация марширует под одним знаменем, хотя каждая монета платит за осадные работы вдвойне." #NT!
  
 nd_tab.13.t: "Гражданское Братство" #NT!
 nd_tab.13.d: "Меритократия теперь является институтом Табора, а также его принципом. Олдермены, капитаны, приходские старейшины: никто не наследует эту должность. Каждый приход выбирает своего проповедника; каждый город выбирает своего капитана; каждая рота полевой армии выбирает своего гейтмана. Казна братства финансирует эксперимент, а эксперимент финансирует братство.\n\nКрестьянин в своем Доме Артикулуса слышит те же планы, что и горожанин в своей гильдии. Ни одно другое государство в Европе не может сказать этого." #NT!
 nd_tab.13.a: "Братство – это республика" #NT!
  
 nd_tab.14.t: "Народное Содружество" #NT!
 nd_tab.14.d: "Обучение эпохи Возрождения встречается с чешским языком. Прессы Братства работают день и ночь; бумага со столичного рынка торгуется до Любека и Лиона. В каждой приходской школе есть печатный букварь; каждый горожанин читает по-чешски; Содружество — это прежде всего республика букв.\n\nСейм обсуждает, как направить печатный бум. Вложить ресурсы в педагогический проект: школы, народные трактаты, идеалы развития? Или расширить возможности гильдий бюргеров, чьи прессы и чернильные фабрики доставляют эту продукцию на рынок?" #NT!
 nd_tab.14.a: "Влейте прессу в педагогический проект" #NT!
 nd_tab.14.b: "Расширьте возможности домов гильдии бюргеров" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_print_revolution: "Революция печати" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_print_revolution: "Типографии Братства телегами публикуют трактаты на народном языке. Развитие Чехии ускоряется, и Европа серьезно относится к республике-чаше как к великой силе письма." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_burgher_compact: "Бургер Компакт" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_burgher_compact: "Бум прессы переходит в руки бюргеров. По сухопутным торговым путям чешские книги доставляются через Центральную Европу, а торговые мощности расширяются, но духовенство-чашу возмущается новым богатством и влиянием бюргеров." #NT!
  
 nd_tab.15.t: "Демократицкий Съезд" #NT!
 nd_tab.15.d: "Просвещение пришло в республику-чашу. Педагогика Коменского универсальна; читает каждый чешский крестьянин; каждый приход избирает национальное собрание, проводимое полностью на чешском языке. Демократицкий Съезд — это работающий демократический эксперимент, о котором Европа спорит уже два столетия.\n\nКапитаны обсуждают окончательную форму. Открыть привилегию без ограничений: каждый брат и сестра, крестьянин или мещанин, в списках? Или сохранить факультативную дисциплину в соответствии с проверенной моделью четырех капитанов, широко используемой в современной республике?" #NT!
 nd_tab.15.a: "Откройте франшизу каждому брату и сестре" #NT!
 nd_tab.15.b: "Зарекомендовавшая себя факультативная дисциплина" #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_open_franchise: "Открытая франшиза" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_open_franchise: "Каждый брат и сестра голосуют. Удовлетворенность имуществом резко возрастает, и страна дрейфует к либерализму свободы субъектов, неслыханному где-либо еще в Европе." #NT!
  
 STATIC_MODIFIER_NAME_nd_tab_dest_disciplined_republic: "Дисциплинированная выборная республика" #NT!
 STATIC_MODIFIER_DESC_nd_tab_dest_disciplined_republic: "Модель с четырьмя капитанами в целом. Аннексия чешских земель обходится дешево, истерзанные войной провинции быстро восстанавливаются, а в институтах братства пронизана культура качественного совершенства." #NT!
  
  # ----- Destiny Buildings ----- 
 nd_tab_synod_hall: "Зал Богемского Синода" #NT!
 nd_tab_synod_hall_desc: "Место совета Континентальной Реформации. Республика-чаша собирает гуситские, лютеранские и реформатские делегации в рамках одного синода, возглавляемого Богемией, кодифицируя единый центральноевропейский протестантизм." #NT!
  
 nd_tab_synod_hall_maintenance: "Положение Синода" #NT!
 nd_tab_synod_hall_maintenance_desc: "Книги, бумага, пчелиный воск и тонкая ткань для отцов совета. Синод записывает свое собственное каноническое право на дюжине языков." #NT!
  
 nd_tab_demokraticky_sjezd: "Демократицкий Съезд" #NT!
 nd_tab_demokraticky_sjezd_desc: "Народно-чешский парламент: выборный дух братства, институционализированный как полностью демократическое гражданское собрание. Каждый приходской староста, мещанин и капитан полевой армии может сидеть; записи и дебаты ведутся на чешском языке." #NT!
  
 nd_tab_demokraticky_sjezd_maintenance: "Сьезд Рекордс" #NT!
 nd_tab_demokraticky_sjezd_maintenance_desc: "Бумага, бухгалтерские книги, мебель и камерная драпировка. Демократический эксперимент проходит по бумажному следу." #NT!
  
  # ============================================================================ 
  # Bureaucracies: chalice-republic institutions 
  # ============================================================================ 
  
 AUTO_MODIFIER_NAME_nd_tab_bureaucracy_authority: "Административный орган Братства" #NT!
 AUTO_MODIFIER_DESC_nd_tab_bureaucracy_authority: "Избирательный аппарат республики-чаши достаточно зрелый, чтобы управлять институциональными министерствами. Помимо постоянного места в столице, Табор может поддерживать еще две бюрократии по своему выбору: доступны четыре института чаши, из которых три могут действовать одновременно." #NT!
  
 hejtmane_council_bureaucracy: "Совет Хейтмане" #NT!
 hejtmane_council_bureaucracy_desc: "Коллективное полевое командование Жижки в 1420 году, официально оформленное после его смерти в 1424 году как выборный исполнительный директор из четырех капитанов, заседавший как в Таборском, так и в Сиротциском крыльях. Кандидатуры Хейтмане выдвигались городскими старейшинами, приходскими братствами и ветеранами полевой армии, утверждались на совместном заседании и удалялись ими. Потомственная знать не имела места: Совет Хейтмане управлял республикой-чашей во время войны и мира как апостольская коллегия." #NT!
  
 snem_bratrsky_bureaucracy: "Снем Братский" #NT!
 snem_bratrsky_bureaucracy_desc: "Сейм Братства, созывавшийся с 1421 года в Чаславе и в 1430-х годах ставший действующим парламентом гуситских городов. Делегаты говорили на родном чешском языке и считались по приходскому братству, а не по рождению или сословию. Сейм ратифицировал Четыре статьи Праги в качестве конституционного закона, проголосовал за введение военных сборов и избрал капитанов: это первый устойчивый пример в Латинской Европе, когда республиканское собрание, слепое к сословию, размещало крестьян рядом с бюргерами." #NT!
  
 articulus_tribunal_bureaucracy: "Суд Артикулуса" #NT!
 articulus_tribunal_bureaucracy_desc: "Религиозно-юридический трибунал, судивший соответствие Четырем Пражским статьям (1420 г.): свободная проповедь, общение в обоих видах, апостольская бедность духовенства и суровое наказание за смертный грех. Судьями были женатые священники, женщины-проповедницы и старейшины-миряне; Римское каноническое право было исключено. Суд утвердил иконоборчество, распустил монастыри и судил католическое духовенство за симонию, построив церковь-чашу, которую папство отказывалось признавать в течение двух столетий." #NT!
  
 communal_storehouses_bureaucracy: "Коммунальные склады" #NT!
 communal_storehouses_bureaucracy_desc: "Кадби: огромные чаны, в которые прибывшие братья и сестры сдавали свое личное имущество при вступлении в коммуну. Фавор управлял полями, зернохранилищами и обозом полевой армии как единым финансовым организмом из этих складов, раздавая братству продовольствие, одежду и оружие по мере необходимости. Карл Каутский назвал кадби средневековым прецедентом европейского социализма; за десятилетие своей работы они накормили армию, разгромившую пять папских крестовых походов." #NT!
 STATIC_MODIFIER_NAME_nd_tab_peasant_commune: "Таборская крестьянская община" #NT!
 STATIC_MODIFIER_DESC_nd_tab_peasant_commune: "Эгалитарное управление Братства стало постоянным. Крестьянство господствует в советах и ​​на полях; дворянство уменьшается там, где не упразднено полностью. Общинная собственность на землю и зернохранилища; избранные советом капитаны; Четыре статьи Праги как конституционный закон. Табор — это республика в строгом смысле этого слова: гуситское крестьянское содружество, а не королевство в республиканском костюме." #NT!
