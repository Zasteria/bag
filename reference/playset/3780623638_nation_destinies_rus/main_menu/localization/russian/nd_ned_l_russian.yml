l_russian:
 STATIC_MODIFIER_NAME_nd_thalassocracy_of_the_north: "Талассократия Севера" #NT!
 STATIC_MODIFIER_DESC_nd_thalassocracy_of_the_north: "Голландская Республика господствует на морях. От селедочных автобусов Северного моря до великих индийцев VOC — наши торговые флоты доставляют богатства мира к причалам Амстердама. Там, где другие видят волны, мы видим шоссе." #NT!
 STATIC_MODIFIER_NAME_nd_cradle_of_liberty: "Колыбель Свободы" #NT!
 STATIC_MODIFIER_DESC_nd_cradle_of_liberty: "Соединенные провинции являются маяком толерантности в разделенной Европе. Здесь католики и кальвинисты живут бок о бок, ученые-сефарды свободно печатают, а беженцы-гугеноты находят приют. Наши университеты и типографии делают Амстердам интеллектуальной столицей континента." #NT!
 STATIC_MODIFIER_NAME_nd_voc_charter_spirit: "Дух ЛОС" #NT!
 STATIC_MODIFIER_DESC_nd_voc_charter_spirit: "Зафрахтованная компания открывает мир для голландских предприятий. Акционеры, моряки и факторы несут оранжевый флаг в самые дальние уголки земного шара." #NT!
 STATIC_MODIFIER_NAME_nd_wisselbank_confidence: "Виссельбанк Уверенность" #NT!
 STATIC_MODIFIER_DESC_nd_wisselbank_confidence: "Банко-гульден Банка Амстердама стал самой надежной валютой в Европе. Векселя, выписанные в Виссельбанке, принимаются от Архангельска до Кадиса." #NT!
 nd_ned.1.t: "Соединенные провинции" #NT!
 nd_ned.1.d: "Семь провинций наконец-то объединились. То, что началось как отчаянное восстание против тирании, привело к созданию чего-то, чего мир никогда не видел: республики торговцев и моряков, управляемой не коронованным главой, а коллективной волей Генеральных штатов. Главный вопрос сейчас заключается в том, какой нацией мы станем. Повернемся ли мы лицом к морю, как призывают наши корабелы и адмиралы, строя флоты, способные командовать всеми океанами, и заполняя наши склады богатствами Индии? Или нам стоит обратиться к нашему уникальному дару — к обществу, где преследуемые находят убежище, где учёные свободно дискутируют и где день и ночь работает печатный станок? Мир наблюдает, чтобы увидеть, что эта маленькая, упрямая нация сделает со своей с таким трудом завоеванной свободой.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ned.1.a: "Мы будем править волнами!" #NT!
 nd_ned.1.b: "Пусть все, кто ищет свободу, найдут ее здесь." #NT!
 nd_ned.2.t: "Устав ЛОС" #NT!
 nd_ned.2.d: "Генеральные штаты предоставили чартер Vereenigde Oostindische Compagnie, Объединенной Ост-Индской компании. Это не просто торговая фирма. ЛОС обладает суверенным правом вести войну, заключать договоры и основывать колонии от имени Республики. Имея стартовый капитал, который затмевает любое предприятие в истории, Компания отправит флоты вооруженных торговых судов на Острова специй, бросив вызов португальской монополии в восточной торговле. Акционеры из всех провинций вложили свои состояния в это предприятие, связывающее судьбу республики с далекими морями Азии." #NT!
 nd_ned.2.a: "Торговля пряностями будет нашей." #NT!
 nd_ned.3.t: "Открытие Виссельбанка" #NT!
 nd_ned.3.d: "Город Амстердам учредил свой обменный банк Wisselbank, чтобы навести порядок в хаосе обесцененных иностранных валют, наводняющих наши рынки. Отныне все переводные векселя на сумму свыше шестисот гульденов должны оплачиваться через банк. Купцы вкладывают свои монеты и получают кредит в виде банковских гульденов, ценность которых гарантирует город. Больше никаких вырезок, никакого унижения. Надежность денег голландских банков привлечет торговцев со всей Европы к расчету по счетам в Амстердаме, что сделает наш город расчетной палатой мировой торговли." #NT!
 nd_ned.3.a: "Надежные деньги – основа торговли." #NT!
 nd_ned.4.t: "Союз Утрехта" #NT!
 nd_ned.4.d: "В большом зале Утрехта представители северных провинций подписали договор о вечном союзе. Каждая провинция должна оставаться свободной в вопросах религии, ни один человек не может подвергаться преследованиям за свою веру. Эта беспрецедентная декларация свободы совести объединяет провинции не общей кровью или общей короной, а общей приверженностью свободе. Утрехтский союз послужит основой нашей республики, конституции, рожденной не королями, а свободными гражданами." #NT!
 nd_ned.4.a: "Единство в многообразии." #NT!
 nd_ned.5.t: "Мастера Золотого века" #NT!
 nd_ned.5.d: "Голландская Республика достигла такого мастерства в искусстве, науке и торговле, которого мир редко видел. Рембрандт рисует в Амстердаме, а Вермеер снимает свет в Делфте. Гюйгенс обнаруживает кольца Сатурна, а Левенгук всматривается в свой микроскоп в невидимый мир, изобилующий каплей воды. Богатства Индии проходят через наши счетные палаты, а наш торговый флот превышает флот всех других стран, вместе взятых. В этой маленькой стране, отвоеванной у моря, человеческая изобретательность достигла новых высот." #NT!
 nd_ned.5.a: "Золотой век на века." #NT!
 nd_ned_burgundian_cloth_trade: "Торговля бургундскими тканями" #NT!
 nd_ned_burgundian_cloth_trade_desc: "Большие суконные галереи Брюгге, Гента и Ипра являются местом торговли текстилем, которая простирается от английских шерстяных пастбищ до итальянских рынков роскоши." #NT!
 nd_ned_herring_fleets: "Сельдяной флот" #NT!
 nd_ned_herring_fleets_desc: "Голландские автобусы с селедкой плывут большими колоннами к местам промысла, а новые методы консервирования сохраняют улов для экспорта по всей Европе." #NT!
 nd_ned_civic_autonomy: "Гражданская автономия" #NT!
 nd_ned_civic_autonomy_desc: "Нидерландские города яростно охраняют свои уставные привилегии, создавая традицию бюргерского самоуправления, которую ни один повелитель не может легко подавить." #NT!
 nd_ned_waterschappen: "Управления водного хозяйства" #NT!
 nd_ned_waterschappen_desc: "Советы по водоснабжению, демократические кооперативы, старейшие, чем любой парламент, координируют бесконечную работу по строительству дамб, осушению болот и сдерживанию моря." #NT!
 nd_ned_watergeuzen: "Ватергезен" #NT!
 nd_ned_watergeuzen_desc: "«Морские нищие» преследуют вражеские корабли со своих баз, нанося быстрые удары и исчезая на прибрежных отмелях прежде, чем более тяжелые военные корабли успевают ответить." #NT!
 nd_ned_leiden_textiles: "Лейден Текстиль" #NT!
 nd_ned_leiden_textiles_desc: "Фламандские ткачи-беженцы превратили Лейден в величайший текстильный центр Европы, производя все, от прекрасных лакенов до легких камлетов и сажей." #NT!
 nd_ned_union_of_utrecht: "Союз Утрехта" #NT!
 nd_ned_union_of_utrecht_desc: "Основополагающий договор Республики гарантирует свободу совести, беспрецедентную приверженность религиозной толерантности, которая привлечет преследуемые меньшинства со всей Европы." #NT!
 nd_ned_stadtholder_tradition: "Традиция штатгальтера" #NT!
 nd_ned_stadtholder_tradition_desc: "Дом Оранских-Нассау обеспечивает военное руководство республикой, а штатгальтеры сочетают в себе княжескую власть с республиканской службой." #NT!
 nd_ned_schutterij_tradition: "Шутерий Традиция" #NT!
 nd_ned_schutterij_tradition_desc: "В каждом голландском городе есть свои schutterij, отряды гражданской милиции, состоящие из вооруженных бюргеров, которые регулярно тренируются и с упрямой гордостью защищают свои городские стены." #NT!
 nd_ned_voc_charter: "Устав ЛОС" #NT!
 nd_ned_voc_charter_desc: "Vereenigde Oostindische Compagnie, первая в истории публичная транснациональная корпорация, обладает суверенными полномочиями вести войну и управлять территориями по всей Азии." #NT!
 nd_ned_fluyt_design: "Флейт Дизайн" #NT!
 nd_ned_fluyt_design_desc: "Флюйт произвел революцию в морской торговле: это дешевое и эффективное грузовое судно, требующее меньшего количества экипажа, чем любое конкурирующее судно, что дает голландскому судоходству непревзойденное преимущество в затратах." #NT!
 nd_ned_admiralties: "Адмиралтейства" #NT!
 nd_ned_admiralties_desc: "Пять адмиралтейских советов Республики координируют судостроение, военно-морские операции и защиту конвоев, проецируя голландскую морскую мощь от Балтики до Ост-Индии.\n\n#italic Доступно в: $nd_ned_admiraliteit$#!" #NT!
 nd_ned_freedom_of_conscience: "Свобода совести" #NT!
 nd_ned_freedom_of_conscience_desc: "Приверженность Республики религиозной толерантности привлекает преследуемые меньшинства (евреи-сефарды, гугеноты, меннониты), чьи навыки и капитал обогащают голландское общество." #NT!
 nd_ned_wisselbank: "Виссельбанк" #NT!
 nd_ned_wisselbank_desc: "Банк Амстердама вводит надежные деньги и надежный кредит, делая банко-гульден надежной валютой международной торговли." #NT!
 nd_ned_beurs_exchange: "Амстердамская биржа" #NT!
 nd_ned_beurs_exchange_desc: "Первая в мире фондовая биржа позволяет торговать акциями компаний, товарными фьючерсами и государственными облигациями, что является рождением современных финансов.\n\n#italic Доступно в: $nd_ned_beurs$#!" #NT!
 nd_ned_korps_mariniers: "Корпус морской пехоты" #NT!
 nd_ned_korps_mariniers_desc: "Корпус морской пехоты Республики, созданный Йоханом де Виттом, предоставляет элитную десантную пехоту для совместных военно-морских операций." #NT!
 nd_ned_dutch_ship_of_the_line: "Голландский линейный корабль" #NT!
 nd_ned_dutch_ship_of_the_line_desc: "Великие военные корабли времен англо-голландских войн несут ряды тяжелых орудий на нескольких орудийных палубах, предназначенных для разрушительных сражений флота в открытом океане." #NT!
 nd_ned_golden_age_mastery: "Мастерство Золотого Века" #NT!
 nd_ned_golden_age_mastery_desc: "Голландская Республика достигла беспрецедентного сближения художественного блеска, научных открытий и коммерческого превосходства, золотого века, который освещает всю Европу." #NT!
 nd_ned_colonial_network: "Колониальная сеть" #NT!
 nd_ned_colonial_network_desc: "От Нового Амстердама до Капской колонии, от Суринама до Батавии голландские колониальные владения образуют глобальную торговую сеть, объединенную VOC и WIC." #NT!
 nd_ned_batavian_reforms: "Батавские реформы" #NT!
 nd_ned_batavian_reforms_desc: "Революционные реформы модернизируют голландское управление, заменяя старый провинциальный федерализм централизованным управлением и рациональной бюрократией." #NT!
 nd_ned_hydraulic_engineering: "Гидротехника" #NT!
 nd_ned_hydraulic_engineering_desc: "Голландские инженеры освоили науку о воде, паровые насосные станции теперь осушают целые озера, создавая новые польдеры плодородной земли из того, что когда-то было открытой водой." #NT!
 nd_ned_mercantile_legacy: "Торговое наследие" #NT!
 nd_ned_mercantile_legacy_desc: "Столетия коммерческого предпринимательства создали нацию торговцев, финансистов и предпринимателей, чьи деловые сети охватывают весь земной шар." #NT!
 n_nd_ned_watergeuzen: "Ватергезен" #NT!
 n_nd_ned_watergeuzen_desc: "Быстро совершающие набеги суда с экипажем «Морских нищих», протестантских повстанцев, которые нападают на вражеские корабли из прибрежных гаваней." #NT!
 n_nd_ned_fluyt: "Флейт" #NT!
 n_nd_ned_fluyt_desc: "Революционное голландское грузовое судно, дешевое в постройке, эффективное в эксплуатации и требующее меньшего количества экипажа, чем любое сопоставимое судно." #NT!
 n_nd_ned_ship_of_the_line: "Голландский линейный корабль" #NT!
 n_nd_ned_ship_of_the_line_desc: "Мощный военный корабль, ощетинившийся тяжелыми пушками на нескольких палубах, построенный для участия в англо-голландских войнах." #NT!
 a_nd_ned_marine: "Корпус Маринье" #NT!
 a_nd_ned_marine_desc: "Элитные солдаты-амфибии голландской морской пехоты, обученные для совместных военно-морских операций и абордажа с корабля на корабль." #NT!
 a_nd_ned_schutterij: "Шуттерий" #NT!
 a_nd_ned_schutterij_desc: "Гражданская милиция вооруженных горожан, защищающих свои города с решимостью свободных граждан, защищающих свои дома." #NT!
 nd_ned_beurs: "Биржа" #NT!
 nd_ned_beurs_desc: "Товарная и фондовая биржа, где торговцы торгуют акциями, оплачивают счета и спекулируют фьючерсами, бьющееся сердце голландской коммерческой жизни." #NT!
 nd_ned_admiraliteit: "Адмиралитет" #NT!
 nd_ned_admiraliteit_desc: "Адмиралтейский совет, который координирует судостроение, ремонт и военно-морские операции из своего прибрежного штаба." #NT!
 nd_ned_lakenhal: "Лакенхал" #NT!
 nd_ned_lakenhal_desc: "Большой тканевый цех, где ткани проверяются, маркируются знаками качества и продаются торговцам со всей Европы." #NT!
 nd_ned_waterschap: "Управление водного хозяйства" #NT!
 nd_ned_waterschap_desc: "Совет по водным ресурсам, который координирует обслуживание дамб, дренаж и предотвращение наводнений, сдерживая море коллективными действиями." #NT!
 nd_ned_herring_curing: "Засолка сельди" #NT!
 nd_ned_herring_curing_desc: "Голландский метод засолки и засолки сельди позволяет сохранять улов месяцами, что делает его основным продуктом экспорта по всей Европе." #NT!
 nd_ned_spice_warehousing: "Складирование специй" #NT!
 nd_ned_spice_warehousing_desc: "Склады ЛОС перерабатывают и перераспределяют специи Ост-Индии (перец, гвоздика, мускатный орех) на европейские рынки." #NT!
 levy_nd_ned_schutterij: "Шутерей Милиция" #NT!
 levy_nd_ned_schutterij_desc: "Отряды гражданской милиции, состоящие из вооруженных горожан, защищают свои города." #NT!
 nd_ned_beurs_upkeep: "Обменные операции" #NT!
 nd_ned_beurs_upkeep_desc: "Управление товарной биржей: управление бухгалтерскими книгами, брокерскими комиссионными и резервами серебра." #NT!
 nd_ned_admiraliteit_upkeep: "Адмиралтейские операции" #NT!
 nd_ned_admiraliteit_upkeep_desc: "Снабжение военно-морского адмиралтейства лесом, канатами и судостроительными материалами." #NT!
 nd_ned_lakenhal_upkeep: "Операции в Суконных цехах" #NT!
 nd_ned_lakenhal_upkeep_desc: "Обработка шерсти-сырца и красителей для текстильных инспекций и торговых залов." #NT!
 nd_ned_waterschap_upkeep: "Деятельность Совета по водоснабжению" #NT!
 nd_ned_waterschap_upkeep_desc: "Обслуживание дамб, дренажных насосов и инфраструктуры борьбы с наводнениями." #NT!
 nd_ned_formed_tt: "Нидерланды были образованы" #NT!
 nd_ned_path_a_tt: "Выбрал Талассократию Севера" #NT!
 nd_ned_path_b_tt: "Выбрали Колыбель Свободы" #NT!
 nd_ned_destiny: "Судьба Республики" #NT!
 nd_ned_destiny_desc: "Были провозглашены Соединённые провинции. Теперь нам предстоит решить: повелевать ли нам океанами или осветить разум? Наша стабильность должна сохраняться, прежде чем мы сможем начать." #NT!
 nd_ned_dest_baltic_mastery: "Балтийское мастерство" #NT!
 nd_ned_dest_baltic_mastery_desc: "Контролируйте крупные ганзейские порты Любек и Гамбург, чтобы доминировать на северных торговых путях, питающих богатство Республики." #NT!
 nd_ned_dest_spice_venture: "Предприятие специй" #NT!
 nd_ned_dest_spice_venture_desc: "Водрузьте голландский флаг над Малаккским проливом и богатыми гвоздикой Молуккскими островами, открыв торговому флоту восточную торговлю пряностями." #NT!
 nd_ned_dest_global_thalassocracy: "Глобальная талассократия" #NT!
 nd_ned_dest_global_thalassocracy_desc: "Постройте полную морскую империю от Батавии до Цейлона. Моря принадлежат Республике, и наши торговые фабрики усеяли каждый берег." #NT!
 nd_ned_dest_printing_revolution: "Полиграфическая революция" #NT!
 nd_ned_dest_printing_revolution_desc: "Используйте печатный станок и сделайте Нидерланды издательской столицей Европы. Наши печатные машины будут печатать то, о чем другие не смеют говорить." #NT!
 nd_ned_dest_financial_supremacy: "Финансовое превосходство" #NT!
 nd_ned_dest_financial_supremacy_desc: "Сделайте Амстердам бесспорным финансовым центром мира с помощью глобальных торговых институтов и процветающего бумажного рынка." #NT!
 nd_ned_dest_enlightened_republic: "Просвещенная Республика" #NT!
 nd_ned_dest_enlightened_republic_desc: "Примите научную революцию и возьмите под свое крыло кальвинистскую интеллектуальную традицию Женевы. Достичь высочайшего развития и научной известности." #NT!
 nd_ned.6.t: "Судьба Республики ждет" #NT!
 nd_ned.6.d: "Соединенные провинции стоят на перепутье. Основы нашей республики прочны, наша стабильность обеспечена. Теперь мы должны наметить курс, который будет определять нашу нацию на многие поколения. Два великих видения борются за душу Республики. Один манит нас к открытому морю, к далеким портам и богатствам Индии. Другой призывает нас построить в Европе нечто беспрецедентное: республику свободных расследований, надежных денег и просвещенного управления." #NT!
 nd_ned.6.a: "Наша судьба в наших руках." #NT!
 nd_ned.7.t: "Хозяева северных морей" #NT!
 nd_ned.7.d: "Оранжевый флаг теперь развевается над великими ганзейскими портами. Любек, древняя королева балтийской торговли, перешел под наш контроль. Гамбург, ворота в Северное море и во внутренние районы Германии, подчиняется нашему адмиралтейству. Корабли с зерном из Польши, лесные флоты из Скандинавии, конвои с сельдью из Северного моря — все теперь проходят через воды, которыми мы располагаем. Наше господство в северной торговле является полным, и наши купцы обращают взоры к еще более далеким горизонтам." #NT!
 nd_ned.7.a: "Балтика – голландское озеро." #NT!
 nd_ned.8.t: "Плацдарм на островах специй" #NT!
 nd_ned.8.d: "Голландские купцы и солдаты захватили контроль над легендарными островами специй. Малакка, великий перевалочный пункт восточной торговли, развевается под нашим флагом, а гвоздичные рощи Тернате теперь принадлежат нам. Вопрос в том, как лучше всего использовать эту беспрецедентную возможность. Должны ли мы сосредоточиться на создании коммерческой сети конвоев и факторов производства, выжимая каждый гульден из торговли пряностями? Или нам следует инвестировать в вооруженный флот, который сможет вытеснить всех соперников из этих вод и установить постоянное военно-морское превосходство?" #NT!
 nd_ned.8.a: "Организуйте торговые конвои." #NT!
 nd_ned.8.b: "Постройте военный флот Индии." #NT!
 nd_ned.9.t: "Империя морей" #NT!
 nd_ned.9.d: "От счетных домов Амстердама до укрепленных фабрик Батавии, от плантаций корицы на Цейлоне до складов перца на островах специй — голландская морская империя теперь охватывает весь земной шар. Ни одна нация никогда не обладала такой коммерческой мощью на столь маленькой родине. Наши капитаны обходят мыс так же небрежно, как рыбаки гребут к Доггер-банке. Теперь мы должны определить характер этой беспрецедентной империи. Будем ли мы строить постоянные колонии и добывать богатства земли? Или мы сами будем править океанами, сделав свободную торговлю основой нашей гегемонии?" #NT!
 nd_ned.9.a: "Постройте наше колониальное владычество." #NT!
 nd_ned.9.b: "Командуйте открытым океаном." #NT!
 nd_ned.10.t: "Прессы Амстердама" #NT!
 nd_ned.10.d: "Печатный станок превратил Нидерланды в издательскую столицу Европы. То, что нельзя напечатать в Париже или Лондоне из-за боязни цензуры, свободно выходит из наших типографий в Амстердаме, Лейдене и Гааге. Французские философы, английские диссиденты, немецкие пиетисты — все находят в нашей республике желающих печатников. Атласы, научные трактаты, богословские дебаты и подстрекательские памфлеты льются из наших мастерских на всех языках Европы. Знания стали нашим самым прибыльным экспортным товаром." #NT!
 nd_ned.10.a: "Пусть прессы работают день и ночь." #NT!
 nd_ned.11.t: "Финансовая столица мира" #NT!
 nd_ned.11.d: "Амстердам стал тем, чем не был раньше ни один город: финансовым центром всего мира. Векселя, выписанные в наших банках, принимаются от Архангельска до Кадиса. Наша товарная биржа устанавливает цены, которым должны следовать торговцы в каждом порту. Государственные облигации, акции компаний и фьючерсные контракты — финансовые инструменты, которых больше нигде нет, — ежедневно проходят через наши счетные палаты. Теперь нам предстоит решить, как распорядиться этой беспрецедентной силой. Должны ли мы построить толерантное убежище, привлекающее лучшие умы всех преследуемых сообществ? Или нам следует создать сеть инноваций, которая свяжет экономику Европы с нашей?" #NT!
 nd_ned.11.a: "Приветствуем всех, кто приносит талант и капитал." #NT!
 nd_ned.11.b: "Создавайте узы торговли." #NT!
 nd_ned.12.t: "Просвещенная Республика" #NT!
 nd_ned.12.d: "Республика достигла того, о чем только мечтали философы: государства, управляемого разумом, обогащенного толерантностью и просвещенного наукой. Наши университеты привлекают ученых со всей Европы. Наши обсерватории составляют карты небес, наши микроскопы открывают невидимое, наши ботаники составляют каталоги мировой флоры. Поскольку интеллектуальная традиция Женевы теперь находится под нашей защитой, Республика является бесспорным центром мысли Просвещения. Как нам сформировать этот золотой век разума? Как республика литературы, где свобода мысли преобразует общество? Или как центр научного мастерства, где знание становится силой?" #NT!
 nd_ned.12.a: "Пусть свобода мысли будет нашим кредо." #NT!
 nd_ned.12.b: "Используйте силу науки." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_spice_convoy: "Сеть конвоев специй" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_spice_convoy: "Обширная сеть вооруженных торговых конвоев перевозит богатства Индии по защищенным морским путям, а голландские агенты в каждом порту собирают информацию о соперниках." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_armed_fleet: "Вооруженный флот Индии" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_armed_fleet: "Постоянный военный флот патрулирует восточные моря, сметая флоты соперников с маршрутов специй, в то время как голландские сухопутные силы остаются без внимания." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_batavian_dominion: "Батавский Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_batavian_dominion: "Голландские колониальные поселения добывают сырье со всех концов тропиков, стимулируя рост населения в империи, одновременно истощая военную силу." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_ocean_sovereign: "Океан Суверен" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_ocean_sovereign: "Республика контролирует мировые морские пути не только посредством силы, но и посредством соглашений о свободной торговле и дипломатического престижа, которые делают голландскую торговлю желанной повсюду." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_tolerant_haven: "Толерантная гавань" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_tolerant_haven: "Преследуемые меньшинства (евреи-сефарды, гугеноты, меннониты) стекаются в Республику, обогащая ее торговый класс, даже когда старые прерогативы короны ослабевают." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_financial_hub: "Финансовый центр" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_financial_hub: "Финансовые инновации Амстердама (фондовые биржи, фьючерсные рынки, центральные банки) объединяют экономики Европы под руководством Нидерландов." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_republic_of_letters: "Республика букв" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_republic_of_letters: "Голландская республика стала интеллектуальным сердцем Европы, где свобода исследований, либеральная мысль и бюргерская грамотность достигают беспрецедентных высот." #NT!
 STATIC_MODIFIER_NAME_nd_ned_dest_golden_age_of_science: "Золотой век науки" #NT!
 STATIC_MODIFIER_DESC_nd_ned_dest_golden_age_of_science: "Голландские ученые лидируют в мире в области оптики, картографии и натуральной философии, создавая стабильное и процветающее общество посредством практического применения знаний." #NT!
 nd_ned_factorij: "Факторий" #NT!
 nd_ned_factorij_desc: "Укрепленная голландская торговая фабрика, где агенты компании покупают местные товары, запасают специи на обратный рейс и летают на триколоре над зарубежными берегами." #NT!
 nd_ned_universiteit: "Университетит" #NT!
 nd_ned_universiteit_desc: "Великий голландский университет, где ученые свободно получают знания, привлекая студентов со всей Европы для изучения медицины, права, теологии и естественных наук." #NT!
 nd_ned_factorij_upkeep: "Заводские операции" #NT!
 nd_ned_factorij_upkeep_desc: "Для содержания торговой фабрики требуется ткань для торговых товаров, инструменты для ремонта и военно-морские принадлежности для кораблей Компании." #NT!
 nd_ned_universiteit_upkeep: "Деятельность университета" #NT!
 nd_ned_universiteit_upkeep_desc: "Для поддержки университета необходима бумага для книг и диссертаций, переплетенные тома для библиотеки и стекло для лабораторных приборов." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_ned_bureaucracy_authority: "Республиканские учреждения" #NT!
 AUTO_MODIFIER_DESC_nd_ned_bureaucracy_authority: "Семь объединенных провинций управляются не одним сувереном, а множеством корпоративных органов: Генеральными штатами, палатами Ост- и Вест-Индии, Адмиралтейскими советами, польдербордами. Выберите, какое из этих учреждений укрепят наши регенты." #NT!
  
 ned_staten_generaal_bureaucracy: "Стейтен-Генерал" #NT!
 ned_staten_generaal_bureaucracy_desc: "Генеральные штаты собираются в Бинненхофе в Гааге, где одна делегация от каждой провинции обсуждает дела Союза. Принятие важных резолюций требует единогласия, поэтому Raadpensionaris Голландии выступает посредником в бесконечных компромиссах между семью суверенными государствами. Пока собрание существует, ни один указ не имеет силы без согласия регентов: железная республиканская легитимность куплена ценой ледяной решимости." #NT!
  
 ned_raad_van_state_bureaucracy: "Раад ван Стэйт" #NT!
 ned_raad_van_state_bureaucracy_desc: "Реорганизованный Инструкцией от 12 апреля 1588 г., Государственный совет руководит военными финансами, военным ведомством и налоговым управлением Общинных земель. Стадхаудеры заседают по должности; обычные члены назначаются провинциальными штатами. Совет является постоянным исполнительным органом Республики в вопросах войны и сокровищ, органом, посредством которого благородный служилый класс претендует на свою долю в республике против фракции голландских бюргеров." #NT!
  
 ned_heeren_xvii_bureaucracy: "Херен XVII" #NT!
 ned_heeren_xvii_bureaucracy_desc: "Vereenigde Oost-Indische Compagnie, учрежденная 20 марта 1602 года, наделяет суверенными полномочиями (форты, договоры, война и серебро) семнадцать директоров, встречающихся поочередно в Амстердаме и Мидделбурге. Восемь из палаты Амстердама, четыре из Зеландии, по одному из Делфта, Роттердама, Хорна и Энкхейзена, при этом семнадцатое место поочередно. Хирены — в первую очередь купцы, а уже потом — государственные деятели, и наша заморская империя подчиняется этому порядку." #NT!
  
 ned_wisselbank_bureaucracy: "Виссельбанк в Амстердаме" #NT!
 ned_wisselbank_bureaucracy_desc: "Амстердамский биржевой банк, основанный городским vroedschap 31 января 1609 года, устанавливает банковский гульден в качестве единицы европейского оптового финансирования. Муниципальное постановление обязывает каждый переводной вексель на сумму более шестисот гульденов, подлежащий оплате в Амстердаме, проводить через свои книги, и поэтому каждый крупный купец в христианском мире ведет счет на Дамбе. Там, где бухгалтерские книги Виссельбанка надежны, капитал дешев; там, где они скользят, содрогается все здание голландского кредита." #NT!
  
 ned_admiraliteiten_bureaucracy: "Вейф Адмиралитетен" #NT!
 ned_admiraliteiten_bureaucracy_desc: "Пять советов Адмиралтейств, созданных Инструкцией Генеральных штатов от 13 августа 1597 года (де Мазе в Роттердаме, Амстердаме, Зеландия в Мидделбурге, Ноордерквартир в Хорне и Энкхейзене и Фрисландия в Доккуме), управляют военно-морскими финансами, верфями и конвоированием. Работают около пятидесяти советников из всех семи провинций, финансируемые за счет таможенных пошлин на транспортировку и лицензирование, взимаемых в каждом голландском порту. Именно этот корпоративно-провинциальный флот, а не королевский флот, удерживает наши торговые суда на плаву от Архангельска до Батавии." #NT!
  
 ned_waterschappen_bureaucracy: "Управления водного хозяйства" #NT!
 ned_waterschappen_bureaucracy_desc: "Польдерборды происходят от Hoogheemraadschap Рейнланда, зарегистрированного в 1255 году. В каждом польдере химраден оценивает копытный шлак каждого фермера, участок дамбы, граничащий с его землей, и взимает штрафы за небрежное обслуживание. Правления находятся вне провинциальных штатов и переживают любую смену режима (графства, Габсбурги, республика, монархия), потому что без них море возвращается. Это глубочайший институт Нидерландов, который медленно демонтируется и медленно восстанавливается." #NT!
  
 ned_stadhouderschap_bureaucracy: "Штадхаудершап" #NT!
 ned_stadhouderschap_bureaucracy_desc: "Первоначально стадхаудер был наместником государя Габсбургов в каждой провинции, но пережил восстание как республиканский генерал-капитан. Принцы Оранские владеют большей частью штатудератов Республики по квазидинастическому праву и командуют действующей армией голландских штатов. Использование ими ополченцев schutterij для дисциплинирования мятежных городов делает их вечными соперниками регентов Голландии: монархический рефлекс внутри федеративной республики." #NT!
