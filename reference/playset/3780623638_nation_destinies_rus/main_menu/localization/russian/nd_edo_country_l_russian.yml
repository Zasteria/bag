l_russian:
 EDO: "Королевство Бенин" #NT!
 EDO_ADJ: "Бенинский" #NT!
 EDO_f: "Королевство Бенин" #NT!
 EDO_f_desc: "Королевство Бенин было одним из самых могущественных и развитых государств в доколониальной Западной Африке, центром которого был народ Эдо и город Бенин. Королевство, которым управляло Оба, было известно своей централизованной администрацией, грозной армией и выдающимся придворным искусством — знаменитыми Бенинскими бронзами. Правитель Эдо, который объединит сердце Бенина и нижний Нигер, может вернуть королевству былое величие." #NT!
