 MRO: "Султанат Моро" #NT!
 MRO_ADJ: "Моро" #NT!
 MRO_f: "Султанат Моро" #NT!
 MRO_f_desc: "Султанат Моро — это нереализованная панисламская конфедерация Минданао и Сулу: султан-халиф, которому конкурирующие султанаты Сулу, Магинданао, Ланао и Буаян, раджи Бутуана, а также данные Замбоанги и побережья Ирануна — все они принесли единую клятву верности. Его воинская аристократия носит крисы и калисы с волнистыми лезвиями; его флоты винта, оснащенные латеновым вооружением и быстрее любого галеона, преследуют испанских, голландских и английских захватчиков от моря Сулу до Висайских островов. Для его формирования необходимо объединить Минданао под властью суннитов и посадить единого халифа в Маймбунге и Кута-Вату: альтернатива трем столетиям колониального завоевания, которые южные острова так и не приняли." #NT!
