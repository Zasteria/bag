l_russian:
 STATIC_MODIFIER_NAME_nd_sar_carta_de_logu: "Карта де Логу" #NT!
 STATIC_MODIFIER_DESC_nd_sar_carta_de_logu: "Древний правовой кодекс Джудикати остается основой управления Сардинией, предоставляя права и защиту, с которыми могут сравниться лишь немногие в Европе." #NT!
 STATIC_MODIFIER_NAME_nd_sar_savoy_ambition: "Савойские амбиции" #NT!
 STATIC_MODIFIER_DESC_nd_sar_savoy_ambition: "Савойский дом превращает Сардинию из островной заводи в плацдарм для континентальных амбиций, модернизируя армию и бюрократию." #NT!
 STATIC_MODIFIER_NAME_nd_sar_arborean_triumph: "Арборейский Триумф" #NT!
 STATIC_MODIFIER_DESC_nd_sar_arborean_triumph: "Память о неповиновении Арбореи вдохновляет наших солдат непоколебимым боевым духом." #NT!
 STATIC_MODIFIER_NAME_nd_sar_sanluri_remembrance: "Воспоминание о Санлури" #NT!
 STATIC_MODIFIER_DESC_nd_sar_sanluri_remembrance: "Горькие уроки Санлури укрепляют нашу оборону. Никогда больше захватчик не захватит наш остров по дешевке." #NT!
 STATIC_MODIFIER_NAME_nd_sar_risorgimento_arms: "Рисорджименто в оружии" #NT!
 STATIC_MODIFIER_DESC_nd_sar_risorgimento_arms: "Армии Сардинии-Пьемонта выступают вперед, чтобы создать единую нацию силой оружия." #NT!
 STATIC_MODIFIER_NAME_nd_sar_risorgimento_diplomacy: "Рисорджименто дипломатии" #NT!
 STATIC_MODIFIER_DESC_nd_sar_risorgimento_diplomacy: "Государственная политика графа Кавура заключается в создании альянсов и переговоров, которые меняют карту Европы." #NT!
 nd_sar.1.t: "Королевство Сардиния" #NT!
 nd_sar.1.d: "Корона Сардинии сидит на нашем челе. Этот остров, родина одной из старейших цивилизаций Европы, теперь стал самостоятельным королевством. Древние Джудикати управляли собой с помощью законов, более прогрессивных, чем какие-либо на континенте: Carta de Logu предоставляла права женщинам, закрепляла равенство перед законом и была написана на родном языке народа. Тем не менее, ход истории также принес с собой арагонские амбиции, генуэзскую торговлю, а теперь и расчетливое видение Савойского дома.\n\nПеред нами лежат два пути. Мы можем опираться на глубокие традиции самоуправления и юридическое мастерство острова, создавая королевство, основанное на древнем сардинском образе жизни. Или мы можем принять континентальное видение Савойской династии, превратив Сардинию в современное военное государство, способное изменить Итальянский полуостров.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sar.1.a: "Уважайте Carta de Logu" #NT!
 nd_sar.1.b: "Примите савойскую концепцию" #NT!
 nd_sar.2.t: "Хартия де Логу" #NT!
 nd_sar.2.d: "В 1392 году Элеонора д'Арборея обнародовала Хартию де Логу: юридический кодекс из 198 глав, написанный не на латыни, а на сардинском языке, языке народа, которым она управляла. Он установил принципы, которых не было нигде в Европе на протяжении веков: женщины могли наследовать собственность и отказываться от брака, равенство перед законом было закреплено независимо от рождения, а защита окружающей среды регулировала использование лесов и водных путей.\n\nКодекс оказался настолько эффективным, что, когда Корона Арагона наконец завоевала остров, они приняли его полностью. Он оставался законом Сардинии до 1827 года: более четырех столетий непрерывного применения, свидетельство мудрости женщины, которую сардинцы до сих пор называют «sa mama de su populu», матерью народа." #NT!
 nd_sar.2.a: "Наследие, превосходящее завоевания." #NT!
 nd_sar.3.t: "Битва при Санлури" #NT!
 nd_sar.3.d: "30 июня 1409 года армии Джудикато Арборейского встретились с силами Арагонской короны в Санлури, что стало последней великой битвой за независимость Сардинии. Арборейская армия, усиленная генуэзскими союзниками и сардинскими добровольцами со всего острова, с отчаянным мужеством сражалась против профессиональных каталонско-арагонских сил.\n\nБитва была кровавой. Тысячи людей пали с обеих сторон, и к концу дня военная мощь Арбореи была сломлена. Джудикато просуществовал еще одиннадцать лет (его территории были проданы Арагону в 1420 году), но Санлури ознаменовал конец независимой Сардинии. Воспоминания горят по-разному в зависимости от того, кто рассказывает эту историю: одни говорят о жестокой атаке сардинцев, которая почти прорвала арагонскую линию, другие — об упорной обороне, которая сделала завоевание невыносимо дорогостоящим." #NT!
 nd_sar.3.a: "Помните об атаке в Санлури!" #NT!
 nd_sar.3.b: "Помните о цене вторжения." #NT!
 nd_sar.4.t: "Рисорджименто пробуждается" #NT!
 nd_sar.4.d: "Ветры перемен проносятся по итальянскому полуострову. От Милана до Неаполя, от Венеции до Палермо идея единой итальянской нации захватила воображение целого поколения. И именно здесь, в Королевстве Сардиния-Пьемонт, мечта находит своего сильнейшего защитника.\n\nКороль Виктор Эммануил II и его блестящий министр граф Кавур позиционируют наше королевство как естественного лидера итальянского объединения. Но путь вперед оспаривается. Разжигатель Гарибальди выступает за революционную войну: его добровольцы в красных рубашках уже захватили Сицилию и маршируют на север. Кавур советует проявлять терпение и дипломатическую хитрость, строить союзы с Францией и устранять инженерные кризисы, которые изолируют Австрию.\n\nОба пути ведут к одному и тому же пункту назначения, но совершенно разными дорогами." #NT!
 nd_sar.4.a: "Пусть меч решит судьбу Италии." #NT!
 nd_sar.4.b: "Пусть дипломатия перекроит карту." #NT!
 nd_sar_giudicati_tradition: "Юридическая традиция Джудикати" #NT!
 nd_sar_giudicati_tradition_desc: "Четыре Джудикати Сардинии разработали уникальную систему самоуправления с выборными судьями, окружными кураторами и юридическим кодексом, намного опередившим свое время." #NT!
 nd_sar_nuragic_heritage: "Нурагическое наследие" #NT!
 nd_sar_nuragic_heritage_desc: "Более семи тысяч каменных башен бронзового века усеивают сардинский ландшафт, что является свидетельством древней культуры укрепления и территориальной защиты острова." #NT!
 nd_sar_pastoral_heartland: "Пастораль Хартленд" #NT!
 nd_sar_pastoral_heartland_desc: "На протяжении тысячелетий внутренние районы Сардинии были владениями пастухов. Шерсть, сыр и домашний скот острова являются основой его экономики." #NT!
 nd_sar_arborean_resistance: "Древесное сопротивление" #NT!
 nd_sar_arborean_resistance_desc: "Джудикато Арбореи был последним бастионом независимого правления Сардинии, с жестокой решимостью ведя многолетнюю войну против арагонского завоевания." #NT!
 nd_sar_coral_riviera: "Коралловая Ривьера" #NT!
 nd_sar_coral_riviera_desc: "В водах Альгеро добываются одни из лучших красных кораллов Средиземноморья, которые ценятся от Генуи до Константинополя за свою красоту и редкость.\n\n#italic Доступно в: $nd_sar_pinnetta$#!" #NT!
 nd_sar_spanish_watchtowers: "Испанские сторожевые башни" #NT!
 nd_sar_spanish_watchtowers_desc: "Побережье Сардинии окружает около сотни прибрежных сторожевых башен, построенных испанской короной для защиты от берберийских пиратов и османских налетчиков." #NT!
 nd_sar_sanluri_legacy: "Наследие Санлури" #NT!
 nd_sar_sanluri_legacy_desc: "Битва при Санлури в 1409 году, когда независимость Сардинии была потеряна в день ужасного кровопролития, остается определяющим моментом в коллективной памяти острова." #NT!
 nd_sar_silver_mountains: "Серебряные горы" #NT!
 nd_sar_silver_mountains_desc: "Внутренние горы Сардинии с древних времен добывали драгоценные металлы. Само название Дженнардженту означает «серебряные ворота», напоминая о древнем горнодобывающем наследии острова.\n\n#italic Доступно в: $nd_sar_curia_regni$#!" #NT!
 nd_sar_catalan_legacy: "Каталонское наследие" #NT!
 nd_sar_catalan_legacy_desc: "Столетия каталонско-арагонского правления оставили неизгладимый культурный отпечаток на Сардинии, особенно в Альгеро, где до сих пор говорят на каталонском языке, принеся с собой средиземноморские торговые связи и архитектурное великолепие." #NT!
 nd_sar_barbagia_refuge: "Убежище Барбаджа" #NT!
 nd_sar_barbagia_refuge_desc: "Горный внутренний регион Барбаджа сопротивлялся каждому захватчику от Рима до Арагона. Его пересеченная местность и свирепые жители делают его непобедимым центром страны." #NT!
 nd_sar_tuna_mattanza: "Тунец Маттанза" #NT!
 nd_sar_tuna_mattanza_desc: "Древняя практика маттанзы (большой коллективный вылов тунца) поддерживает прибрежные общины и обучает квалифицированных моряков морскому делу и скоординированным действиям на море." #NT!
 nd_sar_sardinian_companies: "Сардинские компании" #NT!
 nd_sar_sardinian_companies_desc: "Сардинские солдаты служат в ротах по всему Средиземноморью, завоевывая репутацию выносливых и выносливых людей, что противоречит скромным размерам их острова." #NT!
 nd_sar_feudal_reform: "Феодальная реформа" #NT!
 nd_sar_feudal_reform_desc: "Попытки реформировать устаревшую феодальную систему, навязанную Арагоном, встречают ожесточенное сопротивление со стороны укоренившихся баронов, но постепенно укрепляют власть короны." #NT!
 nd_sar_island_fortress: "Островная крепость" #NT!
 nd_sar_island_fortress_desc: "Сеть сторожевых башен превращается в комплексную систему защиты острова, в которой гарнизонные башни сообщаются сигнальными огнями по всему побережью.\n\n#italic Доступно в: $nd_sar_torre_costiera$#!" #NT!
 nd_sar_pastoral_export: "Пасторальный экспорт" #NT!
 nd_sar_pastoral_export_desc: "Сардинский сыр пекорино, тонкая шерсть и колбасные изделия находят активные рынки по всему Средиземноморью, что делает остров специалистом по пасторским товарам." #NT!
 nd_sar_stamenti_parliament: "Стаменти Парламент" #NT!
 nd_sar_stamenti_parliament_desc: "Сардинские Стаменти (парламентские владения острова, включающие дворян, духовенство и королевские города) утверждают растущее законодательное влияние на дела острова.\n\n#italic Доступно в: $nd_sar_curia_regni$#!" #NT!
 nd_sar_savoy_integration: "Савойская интеграция" #NT!
 nd_sar_savoy_integration_desc: "Совершенное слияние 1847 года объединяет остров Сардиния с материковыми владениями Савойи в единое конституционное королевство под одним законом и одной администрацией." #NT!
 nd_sar_carabinieri_reali: "Карабинеры Реали" #NT!
 nd_sar_carabinieri_reali_desc: "Основанный в 1814 году королем Виктором Эммануилом I, Корпус королевских карабинеров служит одновременно элитным военным формированием и национальной жандармерией, обеспечивая соблюдение королевских законов по всему королевству." #NT!
 nd_sar_railway_modernization: "Модернизация железных дорог" #NT!
 nd_sar_railway_modernization_desc: "Представление графа Кавура о современном индустриальном государстве стимулирует строительство железных дорог через Пьемонт, соединяя города, перемещая войска и преобразуя экономику королевства." #NT!
 nd_sar_bersaglieri: "Корпус Берсальери" #NT!
 nd_sar_bersaglieri_desc: "Берсальери генерала Ла Марморы (элитные снайперы, обученные скорости и инициативе) становятся самыми знаменитыми солдатами Рисорджименто." #NT!
 nd_sar_risorgimento_spirit: "Рисорджименто Спирит" #NT!
 nd_sar_risorgimento_spirit_desc: "Идея единой Италии, отстаиваемая Виктором Эммануилом II и графом Кавуром, превращает Сардинию-Пьемонт из регионального королевства в двигатель национальной судьбы." #NT!
 nd_sar_statuto_albertino: "Статуто Альбертино" #NT!
 nd_sar_statuto_albertino_desc: "Конституционная хартия, дарованная Карлом Альбертом в 1848 году, устанавливает парламентскую монархию и становится основополагающим законом будущего Королевства Италия.\n\n#italic Доступно в: $nd_sar_curia_regni$#!" #NT!
 nd_sar_piedmontese_industry: "Пьемонтская промышленность" #NT!
 nd_sar_piedmontese_industry_desc: "Турин и его внутренние районы становятся промышленным центром полуострова, где текстильные, оружейные и железнодорожные мастерские способствуют модернизации Сардинии-Пьемонта." #NT!
 nd_sar_cavour_strategy: "Великая стратегия Кавура" #NT!
 nd_sar_cavour_strategy_desc: "Блестящие дипломатические маневры графа Кавура (от союза с Францией и Великобританией во время Крымской войны до секретного соглашения в Пломбьере) позиционируют Сардинию-Пьемонт как стержень европейской политики великих держав." #NT!
 nd_sar_modern_coastal_defense: "Современная береговая оборона" #NT!
 nd_sar_modern_coastal_defense_desc: "Древняя сеть башен получает современные артиллерийские батареи и обученные артиллерийские расчеты, превращая средневековые сторожевые башни в грозные береговые укрепления эпохи броненосцев.\n\n#italic Доступно в: $nd_sar_torre_costiera$#!" #NT!
 a_nd_sar_arborean_militia: "Арборейское ополчение" #NT!
 a_nd_sar_arborean_militia_desc: "Выносливые крестьянские солдаты из Джудикато Арбореи, опытные в оборонительных боях на холмах и горах Сардинии." #NT!
 n_nd_sar_coral_galley: "Коралловая галера" #NT!
 n_nd_sar_coral_galley_desc: "Быстрые, маневренные галеры, патрулирующие побережье Сардинии, защищающие коралловых ловцов и торговые суда от пиратских набегов." #NT!
 a_nd_sar_carabinieri: "Карабинеры" #NT!
 a_nd_sar_carabinieri_desc: "Королевские карабинеры сочетают военную дисциплину с подготовкой сотрудников правоохранительных органов, создавая элитных солдат, способных как вести бой на поле боя, так и поддерживать порядок." #NT!
 a_nd_sar_bersaglieri: "Берсальери" #NT!
 a_nd_sar_bersaglieri_desc: "Бегущие стрелки в характерных шляпах с перьями, известные своей скоростью, инициативой и потрясающей точностью обращения с винтовкой." #NT!
 levy_nd_sar_bersaglieri: "Берсальери Леви" #NT!
 levy_nd_sar_bersaglieri_desc: "Набор бегущих стрелков Ла Марморы, набранный из самых смелых и ловких солдат королевства." #NT!
 levy_nd_sar_arborean_militia: "Сбор древесного ополчения" #NT!
 levy_nd_sar_arborean_militia_desc: "Крестьянские сборы, собираемые с холмов и гор Сардинии в традициях Джудикато Арбореи." #NT!
 nd_sar_curia_regni: "Курия Реньи" #NT!
 nd_sar_curia_regni_desc: "Суд Джудикати, где древние сардинские правовые традиции применяются с изощренностью, не имеющей себе равных в средневековой Европе." #NT!
 nd_sar_pinnetta: "Пинетта" #NT!
 nd_sar_pinnetta_desc: "Традиционные сардинские пасторальные убежища из камня и соломы, служащие ядром процветающей на острове фермы по разведению овец и шерсти." #NT!
 nd_sar_torre_costiera: "Торре Костьера" #NT!
 nd_sar_torre_costiera_desc: "Каменные сторожевые башни, возведенные вдоль береговой линии Сардинии, обеспечивают раннее предупреждение о пиратских набегах и служат точками сбора береговой обороны." #NT!
 nd_sar_curia_maintenance: "Администрация суда" #NT!
 nd_sar_curia_maintenance_desc: "Для ежедневной работы суда Джудикати требуются писцы, пергамент и камень для поддержания этого места правосудия." #NT!
 nd_sar_silver_minting: "Чеканка серебра" #NT!
 nd_sar_silver_minting_desc: "Древние серебряные рудники в горах Дженнардженту поставляют драгоценный металл в мастерские курии, производящие прекрасные ювелирные изделия и чеканку монет." #NT!
 nd_sar_stamenti_governance: "Администрация Стаменти" #NT!
 nd_sar_stamenti_governance_desc: "Официальные процедуры парламентских сословий Сардинии требуют обширной документации, юридических текстов и ведения учета." #NT!
 nd_sar_constitutional_admin: "Конституционная администрация" #NT!
 nd_sar_constitutional_admin_desc: "Статут Альбертино устанавливает современный бюрократический аппарат с печатными законами, официальными бюллетенями и систематическим ведением записей на бумаге и чернилах." #NT!
 nd_sar_wool_processing: "Обработка шерсти" #NT!
 nd_sar_wool_processing_desc: "Сардинские пастухи приносят свою шерсть в мастерские пиннетты, где умелые руки чешут, прядут и ткут ткань из знаменитой шерсти острова." #NT!
 nd_sar_coral_craft: "Коралл Крафт" #NT!
 nd_sar_coral_craft_desc: "Красный коралл Ривьеры дель Коралло превращается в изысканные украшения сардинскими мастерами, которые продаются по премиальным ценам во всем Средиземноморье." #NT!
 nd_sar_torre_maintenance: "Башенный дозор" #NT!
 nd_sar_torre_maintenance_desc: "Для обслуживания прибрежных сторожевых вышек требуется камень для ремонта, оружие для гарнизона и древесина для сигнальных костров." #NT!
 nd_sar_torre_garrison: "Усиленный гарнизон" #NT!
 nd_sar_torre_garrison_desc: "Расширенный гарнизон с огнестрельным оружием и улучшенной провизией превращает сторожевые башни из наблюдательных пунктов в грозные оборонительные позиции." #NT!
 nd_sar_modern_battery: "Современная батарея" #NT!
 nd_sar_modern_battery_desc: "Тяжелые артиллерийские позиции и пороховые погреба превращают береговые башни в настоящие артиллерийские батареи, способные поражать военные корабли противника." #NT!
 nd_sar_formed_tt: "Образовано #bold Королевство Сардиния#!." #NT!
 nd_sar_path_a_tt: "Выберите судьбу #bold Суверенитета Джудикати#!." #NT!
 nd_sar_path_b_tt: "Выберите судьбу #bold Завоевание Савойи#!" #NT!
 nd_sar_destiny: "Сардинская судьба" #NT!
 nd_sar_destiny_desc: "Было провозглашено Королевство Сардиния. Независимо от того, чтим ли мы древние традиции самоуправления острова или поддерживаем континентальные амбиции, наш путь вперед начинается со стабильного мира." #NT!
 nd_sar_dest_giudicati_crown: "Корона Джудикати" #NT!
 nd_sar_dest_giudicati_crown_desc: "Расширьте суверенитет Сардинии над Корсикой, нашим братским островом через пролив Бонифачо, и создайте процветающую торговлю шерстью для финансирования нашего островного королевства." #NT!
 nd_sar_dest_laws_sea: "Законы моря" #NT!
 nd_sar_dest_laws_sea_desc: "Сделайте Сардинию торговой державой Средиземноморья, приняв современное банковское дело, построив нашу казну и обеспечив потоки соли через наши рынки капитала." #NT!
 nd_sar_dest_parliament: "Парламент островов" #NT!
 nd_sar_dest_parliament_desc: "Создайте островное содружество, охватывающее западное Средиземноморье, захватив Балеарские острова, добившись большого престижа и распространив печатное слово по нашему королевству." #NT!
 nd_sar_dest_piedmont_bridge: "Пьемонтский мост" #NT!
 nd_sar_dest_piedmont_bridge_desc: "Переправьтесь на материк, захватив Турин и Ниццу, сердце Савойи, которое превратит наше островное королевство в континентальную державу." #NT!
 nd_sar_dest_two_crowns: "Королевство двух корон" #NT!
 nd_sar_dest_two_crowns_desc: "Объедините северную Италию под нашим знаменем, завоевав Милан и Геную, две жемчужины Ломбардии и Лигурии." #NT!
 nd_sar_dest_march_rome: "Марш на Рим" #NT!
 nd_sar_dest_march_rome_desc: "Завершите объединение Италии, захватив Рим и Неаполь, создав великое полуостровное королевство от Альп до Меццоджорно." #NT!
 nd_sar.5.t: "Провозглашенное Царство" #NT!
 nd_sar.5.d: "Корона Сардинии покоится на челе нашего государя, и вместе с ней приходит бремя столетий. Этот остров пережил финикийских торговцев, римские легионы, набегов вандалов, византийских губернаторов и арагонских повелителей, но несмотря на все это, сохранилось что-то отчетливо сардинское. Теперь, впервые за многие поколения, мы являемся хозяевами своей судьбы.\n\nВ мире стабильно. Вопрос в том, что мы будем строить на этом фундаменте." #NT!
 nd_sar.5.a: "Наша судьба ждет." #NT!
 nd_sar.6.t: "Джудикати восстановлено" #NT!
 nd_sar.6.d: "За проливом Бонифачо гавани Корсики теперь развеваются под нашим знаменем. Два великих острова Тирренского моря объединены под одной короной впервые со времен античности. Корсиканцы и сардинцы, связанные общими языковыми корнями и средиземноморским родством, вместе образуют грозное островное царство.\n\nПо мере того, как корсиканская древесина пополняет наши стада, а торговля шерстью наполняет нашу казну, древняя мечта о Джудикати (сардинском королевстве, управляемом своими собственными законами и поддерживаемом собственным богатством) начинает принимать осязаемую форму." #NT!
 nd_sar.6.a: "Два острова, одна корона." #NT!
 nd_sar.7.t: "Соляные дороги процветают" #NT!
 nd_sar.7.d: "В наших гаванях кипит торговля. Сардинская соль, добываемая из огромных котлов Кальяри и Сассари, доставляется во все уголки Средиземноморья. Банковские дома открыли свои двери в наших портах, а иностранные торговцы конкурируют за доступ к нашим рынкам.\n\nЭто процветание открывает возможности выбора. Мы могли бы напрямую инвестировать в торговую инфраструктуру (склады, причалы и торговый флот), чтобы максимизировать поток товаров. Или мы могли бы направить наше богатство на институциональную реформу, построив школы и суды, которые сделают наш остров образцом просвещенного управления." #NT!
 nd_sar.7.a: "Наполните склады и казну." #NT!
 nd_sar.7.b: "Инвестируйте в обучение и хорошее управление." #NT!
 nd_sar.8.t: "Парламент островов" #NT!
 nd_sar.8.d: "От гор Сардинии до берегов Майорки наше островное содружество простирается по всему западному Средиземноморью. Стаменты Сардинии, ассамблеи Корсики и советы Балеарских островов — все они смотрят на нашу корону, но каждый из них сохраняет древние права и обычаи своего народа.\n\nМы стоим на вершине нового типа средиземноморской державы: не континентальной империи, построенной на завоеваниях, а содружества свободных народов, связанных законом, торговлей и взаимным уважением. Как мы будем управлять этим достижением?" #NT!
 nd_sar.8.a: "Содружество свободных народов." #NT!
 nd_sar.8.b: "Светоч права и обучения." #NT!
 nd_sar.9.t: "Мост на материк" #NT!
 nd_sar.9.d: "Турин пал. Древняя столица Савойского дома с ее величественными площадями и альпийскими пейзажами принадлежит нам. А поскольку Ницца закреплена на Ривьере, мы контролируем оба склона Приморских Альп.\n\nСардиния-Пьемонт уже не просто островное королевство, а теперь находится между морем и континентом. Перед нами открыта дорога в Италию: через долину реки По, мимо шпилей Милана, туда, куда наши руки смогут захватить любую судьбу." #NT!
 nd_sar.9.a: "С острова на континент." #NT!
 nd_sar.10.t: "Ломбардская Корона" #NT!
 nd_sar.10.d: "«Милан» и «Дженоа» преклонили колени. Самый богатый город Италии и величайший порт Лигурийского побережья теперь пополняют нашу казну и наши армии. Железная корона Ломбардии (древний символ итальянского королевства) находится в пределах нашей досягаемости.\n\nКогда северная Италия обеспечена, наши генералы обсуждают следующий этап. Некоторые выступают за захват трофеев Ломбардии, чтобы восстановить и перевооружить наши армии для последнего наступления на юг. Другие советуют проявить терпение: укрепить нашу новую корону, создать кавалерию из ломбардских запасов и позволить нашим линиям снабжения соответствовать нашим амбициям." #NT!
 nd_sar.10.a: "Используйте преимущество, пока они катятся." #NT!
 nd_sar.10.b: "Укрепление лангобардской короны." #NT!
 nd_sar.11.t: "Рома О Морте" #NT!
 nd_sar.11.d: "Рим. Вечный город. На протяжении тысячи лет каждая держава, претендовавшая на Италию, тянулась к этой награде, и теперь наши знамена реют над Тибром. Неаполь тоже пал, а вместе с ним и Меццоджорно (зажженный солнцем юг, завершающий наше владычество над полуостровом).\n\nОт Альпийских перевалов до Мессинского пролива, от Адриатического побережья до Тирренского берега Италия едина. Вопрос теперь в том, как история запомнит это достижение. Был ли он выкован мечом Гарибальди: добровольцами в красных рубашках и революционным огнем? Или пером Кавура: дипломатическим гением, секретными договорами и тщательным управлением соперничеством великих держав?" #NT!
 nd_sar.11.a: "Мечом Гарибальди!" #NT!
 nd_sar.11.b: "Под пером Кавура." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_salt_silver: "Торговля солью и серебром" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_salt_silver: "Сардинская соль и серебро текут через наши расширенные торговые сети, обогащая королевство, но получая ресурсы от военного содержания." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_institutional_reform: "Институциональная реформа" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_institutional_reform: "Прогрессивные институциональные реформы модернизируют наше островное королевство, хотя бюрократическое бремя снижает эффективность военного времени." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_free_peoples: "Содружество свободных народов" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_free_peoples: "Наше островное содружество управляет посредством согласия и общего права, уменьшая сепаратизм и приветствуя различные народы под одной толерантной короной." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_beacon_learning: "Маяк обучения" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_beacon_learning: "Наше островное царство становится центром средиземноморской науки, его библиотеки и суды привлекают ученых людей со всех берегов." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_lombardy_spoils: "Трофеи Ломбардии" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_lombardy_spoils: "Богатство Ломбардии подпитывает нашу военную машину: свежие рекруты и более дешевые подкрепления поддерживают марш на юг." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_lombard_crown: "Вес Железной Короны" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_lombard_crown: "Железная Корона Ломбардии обеспечивает легитимность, но требует консолидации, поскольку новые наборы кавалерии и линии снабжения истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_garibaldi_sword: "Меч Гарибальди" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_garibaldi_sword: "Революционный пыл и добровольцы в красных рубашках куют национальное единство посредством прямых действий, объединяя покоренные народы силой общих идеалов." #NT!
 STATIC_MODIFIER_NAME_nd_sar_dest_cavour_pen: "Ручка Кавура" #NT!
 STATIC_MODIFIER_DESC_nd_sar_dest_cavour_pen: "Дипломатическое мастерство и лояльные подданные поддерживают новое итальянское государство, поскольку наследие Кавура в области государственного управления и военно-морских инвестиционных проектов господствует по всему Средиземноморью." #NT!
 nd_sar_palazzo_stamenti: "Палаццо дельи Стаменти" #NT!
 nd_sar_palazzo_stamenti_desc: "Большой парламентский дворец островного содружества, где избранные представители Сардинии, Корсики и Балеарских островов обсуждают законы, управляющие свободным народом Средиземноморья." #NT!
 nd_sar_palazzo_stamenti_maintenance: "Парламентское содержание" #NT!
 nd_sar_palazzo_stamenti_maintenance_desc: "Повседневная деятельность островного парламента требует бумаги для законодательства, тонкой ткани для церемоний и книг для парламентской библиотеки." #NT!
 nd_sar_palazzo_madama: "Палаццо Мадама" #NT!
 nd_sar_palazzo_madama_desc: "Этот древний римский дворец в стиле барокко, резиденция итальянского сената в Турине, символизирует трансформацию островного королевства Сардинии в правительство объединенной Италии." #NT!
 nd_sar_palazzo_madama_maintenance: "Сенатская администрация" #NT!
 nd_sar_palazzo_madama_maintenance_desc: "Для работы сената необходимы документы для законодательства, инструменты для поддержания величественного здания и мебель, соответствующая достоинству итальянского государства." #NT!
 sar_carta_de_logu_bureaucracy: "Карта де Логу" #NT!
 sar_carta_de_logu_bureaucracy_desc: "Элеонора Арборейская в 1392 году обнародовала Хартию де Логу, кодекс из 198 глав на сардинском языке, чтобы те, кем она управляла, могли ее прочитать. Женщины могли наследовать и отказываться от брака; леса и водные пути были защищены от чрезмерной эксплуатации; обвиняемый мог вызвать десять свидетелей; пытки были запрещены в отношении лиц с незапятнанной репутацией. Арагонские завоеватели полностью приняли кодекс, и он оставался законом Сардинии до тех пор, пока кодификация Чарльза Феликса 1827 года, наконец, не заменила его." #NT!
 sar_stamenti_bureaucracy: "Стаменти" #NT!
 sar_stamenti_bureaucracy_desc: "Подаренный Петром IV Арагонским во время его борьбы с Арбореей, Стаменти созвали три группы военных, церковных и королевских поместий вокруг наместника в Кальяри, чтобы уполномочить донативо, которые финансировали королевство. С начала шестнадцатого века парламент собирался раз в десять лет, переживая правление Арагона, Испании и Савойи, пока «Идеальное слияние» 1847 года не распустило его, один из самых долгоживущих парламентов Средиземноморья." #NT!
 sar_curatoria_bureaucracy: "Система кураторства" #NT!
 sar_curatoria_bureaucracy_desc: "Унаследованные Джудикати от поздневизантийской тематической структуры, куратории делили каждый судья на самодостаточные округа (тринадцать только в Кальяри), каждый из которых находился под контролем куратора, который подчинялся юдике, а не феодальным сюзеренам. Распределение земли, военный сбор и местное правосудие осуществлялись через этих назначенцев короны. Даже после того, как арагонцы установили феодальные владения, кураторство продолжало действовать как энконтрадас, сохраняя королевскую юрисдикцию параллельно с баронскими судами." #NT!
 sar_viceregal_court_bureaucracy: "Вице-королевский суд Кальяри" #NT!
 sar_viceregal_court_bureaucracy_desc: "С 1325 года арагонцы правили Сардинией через наместника, находившегося в Кальяри, который владел аудиенсией, королевским наследием и высшей судебной властью от имени отсутствующего короля. Тридентские наместники, такие как Кардона и Монкада, централизовали откупные фермы и настроили кастильских фуэрос на нарушение местных обычаев. Это учреждение пережило Арагон, Испанию и австрийскую интерлюдию и в честных руках управляло королевством; в продажных руках стало пословицей продажа должностей и взяточничество." #NT!
 sar_carruba_salt_monopoly_bureaucracy: "Королевская соляная монополия" #NT!
 sar_carruba_salt_monopoly_bureaucracy_desc: "Соляные копи Молентаргиус за пределами Кальяри и соляные озера Сассари с древних времен снабжали рынки Средиземноморья, но именно испанская корона закрепила за регалиями салис королевскую монополию в шестнадцатом веке. Коронные подрядчики отправляли соль под габеллу, карруба платила натурой: если честно обрабатывать землю, то строить галеры; когда его передавали придворным, он порождал контрабанду, крестьянские волнения и великие соляные бунты, которые потрясли Сардинию восемнадцатого века." #NT!
 AUTO_MODIFIER_NAME_nd_sar_bureaucracy_authority: "Сардинская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_sar_bureaucracy_authority: "С провозглашением [SAR.GetName] институциональные традиции Джудикати, Арагонского наместничества и реформы Савойи становятся доступными в качестве переключаемой бюрократии королевства." #NT!
