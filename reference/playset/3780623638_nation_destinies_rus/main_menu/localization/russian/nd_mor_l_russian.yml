l_russian:
 STATIC_MODIFIER_NAME_nd_sharif_commands_the_faithful: "Шариф повелевает правоверным" #NT!
 STATIC_MODIFIER_DESC_nd_sharif_commands_the_faithful: "Султан Марокко черпает власть не только из военной мощи, но и из своего происхождения от Пророка. Его легитимность как Главнокомандующего правоверных объединяет племена, ученых и солдат под единым знаменем праведной цели." #NT!
 STATIC_MODIFIER_NAME_nd_gateway_of_two_seas: "Ворота двух морей" #NT!
 STATIC_MODIFIER_DESC_nd_gateway_of_two_seas: "Марокко контролирует западное Средиземноморье и атлантические подходы к Африке. Его порты переправляют золото, сахар и европейские товары между двумя океанами, что делает Султанат незаменимым звеном в мировой торговле." #NT!
 STATIC_MODIFIER_NAME_nd_victory_at_alcacer_quibir: "Победа при Алькасер-Кибире" #NT!
 STATIC_MODIFIER_DESC_nd_victory_at_alcacer_quibir: "Разгромное поражение португальского вторжения вселило в армию огромную уверенность. Марокко выступает оплотом ислама против иберийской агрессии." #NT!
 STATIC_MODIFIER_NAME_nd_alcacer_diplomatic_triumph: "Дипломатический триумф 1578 г." #NT!
 STATIC_MODIFIER_DESC_nd_alcacer_diplomatic_triumph: "Битва Трех Королей уничтожила не только армию вторжения, но и самого португальского короля. Репутация Марокко в судах Европы достигла необычайной высоты." #NT!
 STATIC_MODIFIER_NAME_nd_moulay_ismail_consolidation: "Объединение Мулая Исмаила" #NT!
 STATIC_MODIFIER_DESC_nd_moulay_ismail_consolidation: "Железный султан навязал свою волю всему королевству. Его обширные строительные проекты в Мекнесе, его реорганизация армии и его безжалостная централизация власти превратили Марокко в грозное государство." #NT!
 STATIC_MODIFIER_NAME_nd_moulay_ismail_terror: "Террор Железного Султана" #NT!
 STATIC_MODIFIER_DESC_nd_moulay_ismail_terror: "Правление Мулая Исмаила основано на страхе и военной мощи. Его огромная постоянная армия, сеть укреплений и репутация безжалостного мстителя делают Марокко крепостью, к которой не осмелится приблизиться ни один захватчик." #NT!
 nd_mor.1.t: "Марокканский султанат" #NT!
 nd_mor.1.d: "Земли Марокко объединены под единым троном. От Атласских гор до побережья Атлантического океана, от плодородных равнин Гарба до окраин Сахары — Султанат управляет царством огромной стратегической ценности.\n\nВопрос, который стоит перед новым султаном, — это вопрос видения. Путь #bold Повелителя правоверных#! призывает Марокко утвердить свою шарифскую власть в Магрибе и за его пределами, обеспечить безопасность границ, завоевать Сахару и создать западный халифат. Путь #bold Ворот двух морей#! обращает взор Марокко в сторону моря, захватывая Пролив, выходя в Атлантику и создавая морскую империю, способную соперничать с иберийцами.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mor.1.a: "Шариф командует правоверными!" #NT!
 nd_mor.1.b: "Мы ворота двух морей." #NT!
 nd_mor.2.t: "Битва трех королей" #NT!
 nd_mor.2.d: "4 августа 1578 года португальский король Себастьян повел двадцатитысячную армию через пролив в Марокко, стремясь посадить марионетку на трон султаната. У реки Уэд-эль-Махазин, недалеко от Алькасер-Кибира, марокканские войска встретили их с сокрушительным эффектом. Когда пыль улеглась, три короля лежали мертвыми: Себастьян Португальский, свергнутый марокканский претендент Абу Абдаллах и правящий султан Абд аль-Малик, который умер от болезни во время самой битвы. Победа была полной. Армия Португалии была уничтожена, тело ее короля так и не было найдено, а выкуп за тысячи пленных пополнил казну Марокко. Ахмад аль-Мансур, брат павшего султана, теперь приходит к власти с эпитетом «аль-Мансур», то есть «Победоносный»." #NT!
 nd_mor.2.a: "Пусть победа вдохновит наши армии!" #NT!
 nd_mor.2.b: "Пусть мир узнает силу Марокко!" #NT!
 nd_mor.3.t: "Мулай Исмаил и слава Мекнеса" #NT!
 nd_mor.3.d: "Султан Мулай Исмаил приступил к реализации самой амбициозной строительной программы в истории Марокко. Нарушив традицию, он выбрал Мекнес своей новой столицей, и город превращается в памятник абсолютной власти. Массивные стены тянутся на километры, окружая дворцы, сады, зернохранилища, способные годами кормить королевство, и конюшни на двенадцать тысяч лошадей. Его армия солдат Черной гвардии, постоянный отряд солдат-рабов, верных только султану, насчитывает десятки тысяч и осуществляет его волю от Рифа до Сахары. Европейские державы, униженные захватом им Танжера и Лараша, теперь посылают послов с подарками. Но методы Мулая Исмаила столь же устрашающи, сколь и эффективны." #NT!
 nd_mor.3.a: "Постройте империю, которая просуществует тысячу лет." #NT!
 nd_mor.3.b: "Пусть наши враги трепещут у наших стен." #NT!
 nd_mor_zenata_cavalry: "Зенатская кавалерийская традиция" #NT!
 nd_mor_zenata_cavalry_desc: "Зенатские берберы, основавшие династию Маринидов, принесли с собой боевые традиции сахарской степи: быстрые всадники, которые наносили сильные удары и исчезали прежде, чем враг успел ответить." #NT!
 nd_mor_kasbah_defense: "Укрепления Касба" #NT!
 nd_mor_kasbah_defense_desc: "Касбы Марокко, укрепленные крепости из утрамбованной земли и камня, контролируют горные перевалы, охраняют оазисы и доминируют на подходах к каждому крупному поселению." #NT!
 nd_mor_fez_scholarship: "Фес, город обучения" #NT!
 nd_mor_fez_scholarship_desc: "Фес был интеллектуальной столицей Магриба с момента основания мечети Аль-Каравийин в 859 году. Его ученые сохраняют и передают знания по всему исламскому миру." #NT!
 nd_mor_al_qarawiyyin: "Университет Аль-Каравийин" #NT!
 nd_mor_al_qarawiyyin_desc: "Аль-Каравийин в Фесе, основанный Фатимой аль-Фихри в 859 году, является старейшим постоянно действующим университетом в мире, готовящим юристов, теологов и администраторов для марокканского государства." #NT!
 nd_mor_madrasa_tradition: "Традиция медресе Маринид" #NT!
 nd_mor_madrasa_tradition_desc: "Султаны Маринидов построили лучшие медресе на исламском Западе, шедевры резной лепнины, потолки из кедра и плитку зеллиг, которые служили как теологическими школами, так и инструментами политической легитимности." #NT!
 nd_mor_zellige_craft: "Мастерство Зеллиге" #NT!
 nd_mor_zellige_craft_desc: "Марокканские ремесленники усовершенствовали искусство зеллиге — сложной геометрической мозаичной плитки, вырезанной вручную из глазурованной терракоты. Эта поделка украшает каждую мечеть, дворец и фонтан в королевстве.\n\n#italic Доступно в: $nd_mor_funduq$#!" #NT!
 nd_mor_funduq_network: "Торговая сеть Фундук" #NT!
 nd_mor_funduq_network_desc: "Фундуки (торговые гостиницы со складами, конюшнями и жилыми помещениями) составляют основу внутренней торговли Марокко, обеспечивая убежище и складские помещения для караванных маршрутов, связывающих побережье с Сахарой." #NT!
 nd_mor_barbary_corsairs: "Берберийские корсары продажи" #NT!
 nd_mor_barbary_corsairs_desc: "Корсары Сале и Рабата терроризируют Атлантику и Средиземноморье, захватывая корабли и совершая набеги на прибрежные города от Исландии до Канарских островов. Их галеры быстры, хорошо вооружены и укомплектованы бесстрашными рейдерами." #NT!
 nd_mor_sugar_cultivation: "Сахар долины Сусс" #NT!
 nd_mor_sugar_cultivation_desc: "Сахарные плантации долины Су, орошаемые древними каналами, производят товар, который так жаждут европейцы. Марокканский сахар конкурирует с лучшим сахаром из Леванта, а затем и из Нового Света.\n\n#italic Доступно в: $nd_mor_sugar_press$#!" #NT!
 nd_mor_wattasid_diplomacy: "Дипломатическое ремесло Ваттасид" #NT!
 nd_mor_wattasid_diplomacy_desc: "Оказавшись между османской экспансией с востока и португальской агрессией с моря, марокканские правители Ваттасиды разработали сложную дипломатию, используя силы друг против друга, чтобы сохранить независимость." #NT!
 nd_mor_metalworking: "Марокканское производство оружия" #NT!
 nd_mor_metalworking_desc: "Необходимость противостоять вторжениям португальцев в прибрежные районы побудила марокканских рабочих-металлистов производить огнестрельное оружие, пушки и холодное оружие во все возрастающих количествах, уменьшая зависимость от иностранного оружия." #NT!
 nd_mor_saadian_gunpowder: "Саадская пороховая революция" #NT!
 nd_mor_saadian_gunpowder_desc: "Династия Саади переняла османские военные методы (дисциплинированная мушкетерская пехота, полевая артиллерия и война в крепостях), превратив армию Марокко из кавалерийско-зависимой силы в пороховое государство." #NT!
 nd_mor_battle_three_kings: "Битва Трех Королей" #NT!
 nd_mor_battle_three_kings_desc: "Разгром португальского вторжения короля Себастьяна в Алькасер-Кибир в 1578 году стал величайшим военным триумфом Марокко, укрепив престиж династии Саадиев как в исламском мире, так и в Европе." #NT!
 nd_mor_mansur_golden_age: "Золотой век Аль-Мансура" #NT!
 nd_mor_mansur_golden_age_desc: "Ахмад аль-Мансур использовал свою победу в эпоху беспрецедентного богатства. Португальские выкупы, золото Сахары и экспорт сахара сделали Марокко одним из самых богатых государств в мире." #NT!
 nd_mor_saadian_architecture: "Саадийский архитектурный патронаж" #NT!
 nd_mor_saadian_architecture_desc: "Под покровительством династии Саади был построен дворец Эль-Бади в Марракеше, «Несравненный», и изысканные гробницы Саади, памятники династической власти, изготовленные из лучших материалов, которые можно было купить за деньги." #NT!
 nd_mor_meknes_capital: "Императорский Мекнес" #NT!
 nd_mor_meknes_capital_desc: "Преобразование Мулаем Исмаилом Мекнеса в имперскую столицу (с его массивными стенами, огромными зернохранилищами и монументальными воротами Баб-Мансура) было крупнейшим строительным проектом в истории Марокко." #NT!
 nd_mor_alaouite_centralization: "Алауитская государственная централизация" #NT!
 nd_mor_alaouite_centralization_desc: "Династия Алауитов восстановила марокканское государство вокруг централизованного Махзена — сети племенных союзов, военных гарнизонов и сборщиков налогов, которые связывали периферию с троном." #NT!
 nd_mor_corsair_fleet: "Расширение флота Корсаров" #NT!
 nd_mor_corsair_fleet_desc: "При алауитах корсарский флот Марокко превратился из местной помехи в стратегический инструмент. Европейские державы были вынуждены заключать договоры и платить дань, чтобы защитить свое судоходство.\n\n#italic Доступно в: $nd_mor_corsair_harbor$#!" #NT!
 nd_mor_makhzen_reforms: "Фискальные реформы Махзена" #NT!
 nd_mor_makhzen_reforms_desc: "Фискальный аппарат Махзена (откупщики налогов, губернаторы провинций и традиционные сборы) был реформирован, чтобы более эффективно извлекать доходы из разнообразного населения Султаната." #NT!
 nd_mor_industrial_stirrings: "Ранняя марокканская модернизация" #NT!
 nd_mor_industrial_stirrings_desc: "В то время как полная индустриализация ускользнула от Марокко, в поздний период Алауитов были сделаны пробные шаги в направлении современного производства, включая мастерские в европейском стиле и улучшение портовой инфраструктуры." #NT!
 nd_mor_diplomatic_sovereignty: "Марокканский дипломатический суверенитет" #NT!
 nd_mor_diplomatic_sovereignty_desc: "Марокко было одним из первых государств, признавших Соединенные Штаты в 1786 году, и на протяжении всей эпохи поддерживало суверенные дипломатические отношения с крупными державами, сопротивляясь полному европейскому доминированию дольше, чем любое другое африканское государство." #NT!
 a_nd_mor_zenata_horsemen: "Зенатские всадники" #NT!
 a_nd_mor_zenata_horsemen_desc: "Быстрые конные воины зенатских берберов, обученные кочевым традициям ведения боевых действий в пустынях и равнинах Магриба." #NT!
 n_nd_mor_corsair_galley: "Корсар Галера" #NT!
 n_nd_mor_corsair_galley_desc: "Быстрая, маневренная галера с экипажем грозных корсаров Сале и Рабата, предназначенная для набегов на торговые суда и блокады вражеских портов." #NT!
 a_nd_mor_saadian_musketeers: "Саадские мушкетеры" #NT!
 a_nd_mor_saadian_musketeers_desc: "Дисциплинированная мушкетная пехота, обученная в османских традициях, составила костяк реформированной пороховой армии Марокко после военной революции Саади." #NT!
 nd_mor_marinid_madrasa: "Медресе Маринид" #NT!
 nd_mor_marinid_madrasa_desc: "Богословская школа, построенная в традициях Маринидов, с замысловатой плиткой зеллиг, резной лепниной и потолками из кедра. Он готовит ученых, юристов и администраторов для Султаната." #NT!
 nd_mor_kasbah: "Крепость Касба" #NT!
 nd_mor_kasbah_desc: "Укреплённая цитадель из утрамбованной земли и камня, контролирующая горные перевалы и охраняющая подступы к поселениям. Его толстые стены и стратегическое положение делают его практически неприступным." #NT!
 nd_mor_funduq: "Фундук" #NT!
 nd_mor_funduq_desc: "Торговый трактир и складской комплекс, служащий центром караванной торговли, предоставляющий жилье торговцам, конюшни для животных и безопасное хранилище для товаров." #NT!
 nd_mor_imperial_granary: "Императорское зернохранилище" #NT!
 nd_mor_imperial_granary_desc: "Одно из огромных складов Мулая Исмаила, способное снабжать армию продовольствием на месяцы. Эти зернохранилища гарантируют, что Султанат никогда не столкнется с голодом во время осады или засухи." #NT!
 nd_mor_corsair_harbor: "Корсарская гавань" #NT!
 nd_mor_corsair_harbor_desc: "Укрепленная гавань, построенная для обслуживания корсарского флота Марокко, с судостроительными предприятиями, ремонтными доками и безопасной стоянкой для совершающих набеги судов." #NT!
 nd_mor_madrasa_upkeep: "Техническое обслуживание медресе" #NT!
 nd_mor_madrasa_upkeep_desc: "Текущие расходы на содержание медресе, бумага и книги для библиотеки, свечи из пчелиного воска для вечерних занятий и камень для ухода за украшенными зеллигами стенами." #NT!
 nd_mor_kasbah_upkeep: "Касба Гарнизон" #NT!
 nd_mor_kasbah_upkeep_desc: "Стоимость содержания касбы, камня для ее утрамбованных земляных стен, вооружения и огнестрельного оружия для гарнизона, а также инструментов для текущего ремонта." #NT!
 nd_mor_funduq_upkeep: "Фундук Операции" #NT!
 nd_mor_funduq_upkeep_desc: "Эксплуатационные расходы на фундук, скот и пшеницу для кормления торговцев и их животных, соль для консервации и ткань для обеспечения укрытий караванов." #NT!
 nd_mor_granary_upkeep: "Обслуживание зернохранилища" #NT!
 nd_mor_granary_upkeep_desc: "Затраты на содержание императорского зернохранилища, пшеницу, пополняющую запасы, инструменты для машин и измерительное оборудование, а также камень, чтобы поддерживать в целости массивные стены и сводчатые помещения." #NT!
 nd_mor_corsair_harbor_upkeep: "Портовые операции" #NT!
 nd_mor_corsair_harbor_upkeep_desc: "Эксплуатационные расходы корсарской гавани, военно-морские поставки для флота, пиломатериалы и деготь для ремонта корпусов, а также инструменты для корабельных мастеров, обслуживающих совершающие набеги суда." #NT!
 nd_mor_sugar_processing: "Марокканский сахарный завод" #NT!
 nd_mor_sugar_processing_desc: "Дробление сахарного тростника, собранного в долине Сусс, и варка его сока в рафинированный сахар для экспорта в Европу." #NT!
 nd_mor_zellige_workshop: "Мастерская плитки Зеллиге" #NT!
 nd_mor_zellige_workshop_desc: "Мастерская по резке замысловатых геометрических плиток из глазурованной терракоты, обожженной в глине и ручной огранки, окрашенной минеральными красками, формованной с помощью инструментов в мозаику, украшающую каждую мечеть и дворец." #NT!
 nd_mor_sugar_press: "Сахарный Пресс" #NT!
 nd_mor_sugar_press_desc: "Завод по переработке тростника в долине Суса, где марокканский сахар перерабатывается на экспорт. Сахар в Марокко конкурировал со средиземноморскими источниками до того, как плантации в Атлантике пришли к власти." #NT!
 nd_mor_press_upkeep: "Пресс-служба" #NT!
 nd_mor_press_upkeep_desc: "Древесина для валков, измельчающих тростник, и печи для котельной, инструменты для обслуживания машин, а также камень для фундамента и стен мельницы." #NT!
 nd_mor_arms_workshop: "Марокканская оружейная мастерская" #NT!
 nd_mor_arms_workshop_desc: "Кузница, производящая огнестрельное оружие, клинки и принадлежности для армий Султаната, железо для металлоконструкций, уголь для кузницы, пиломатериалы для прикладов и древков, а также инструменты для мастеров." #NT!
 levy_nd_mor_zenata_horsemen: "Зената Всадники Леви" #NT!
 levy_nd_mor_zenata_horsemen_desc: "Племенная кавалерия, собранная из зенатских берберских солдат и соплеменников, сражалась в традициях кочевников, совершая быстрые конные набеги." #NT!
 nd_mor_formed_tt: "Сформирован #bold Марокко#!" #NT!
 nd_mor_path_a_tt: "Выберите судьбу #bold Командира Верных#!." #NT!
 nd_mor_path_b_tt: "Выберите судьбу #bold Врат двух морей#!." #NT!
 nd_mor_destiny: "Судьба Султаната" #NT!
 nd_mor_destiny_desc: "Образовано Марокко и признана власть его султана. Королевство стоит на перепутье, путь, выбранный при формировании, теперь определяет амбиции Султаната. Стабилизируйте королевство, чтобы начать следовать своей судьбе." #NT!
 nd_mor_dest_maghreb: "Магриб в безопасности" #NT!
 nd_mor_dest_maghreb_desc: "Завоюйте Тлемсен, чтобы положить конец соперничеству Заянидов и создать армию, достойную Повелителя правоверных. Западный Магриб должен подчиняться единому трону, прежде чем султан сможет заглянуть дальше." #NT!
 nd_mor_dest_golden_road: "Мастера Золотой дороги" #NT!
 nd_mor_dest_golden_road_desc: "Маршируйте на юг через Сахару, чтобы захватить Тимбукту и транссахарские золотые маршруты. Богатства стран Африки к югу от Сахары должны течь через руки Марокко, чтобы финансировать амбиции султана." #NT!
 nd_mor_dest_caliphate: "Западный Халифат" #NT!
 nd_mor_dest_caliphate_desc: "Завоюйте Тунис и Алжир, чтобы объединить весь Магриб под властью Шарифа. С престижем, заработанным завоеваниями и благочестием, провозгласите западный халифат, который будет конкурировать с османами. Открывает Дар аль-Махзен." #NT!
 nd_mor_dest_strait: "Пролив под защитой" #NT!
 nd_mor_dest_strait_desc: "Захватите Гибралтарскую скалу у иберийцев и стабилизируйте страну. Контроль над проливом дает Марокко контроль над всем движением между Средиземноморьем и Атлантикой." #NT!
 nd_mor_dest_atlantic: "Атлантик Венчурс" #NT!
 nd_mor_dest_atlantic_desc: "Превратите торговлю сахаром в Марокко в крупную экспортную отрасль, примените современные банковские учреждения и наполните казну Султаната. Атлантика манит возможностями для тех, кто может финансировать путешествие." #NT!
 nd_mor_dest_two_oceans: "Мастер двух океанов" #NT!
 nd_mor_dest_two_oceans_desc: "Захватите Мадейру, чтобы создать плацдарм в Атлантическом океане, полностью развить территорию Султаната и заняться глобальной торговлей. Марокко будет контролировать как Средиземноморский проход, так и открытый океан. Открывает Дар аль-Бахр." #NT!
 nd_mor.4.t: "Судьба Султаната" #NT!
 nd_mor.4.d: "Султанат Марокко един, его знамя поднято как над Атласом, так и над побережьем. Царство стабильно, его жители обращаются к султану за советом. Путь впереди долгий, но первый шаг сделан, судьба Марокко сейчас в движении." #NT!
 nd_mor.4.a: "Наша судьба разворачивается." #NT!
 nd_mor.5.t: "Магриб в безопасности" #NT!
 nd_mor.5.d: "Тлемсен пал. Древняя резиденция султанов Заянидов, которая на протяжении веков оспаривала марокканскую гегемонию над западным Магрибом, теперь подчиняется султану в Фесе. Имея под своим командованием сильную армию, граница защищена, и дорога на юг, в Сахару, открыта. Повелитель правоверных доказал, что его притязания выходят за пределы традиционных границ Марокко." #NT!
 nd_mor.5.a: "Магриб кланяется Командующему." #NT!
 nd_mor.6.t: "Мастера Золотой дороги" #NT!
 nd_mor.6.d: "Марокканские солдаты и торговцы теперь контролируют транссахарские маршруты. Тимбукту, легендарный город золота и знаний, развевает знамя султана. Соляные караваны Тагазы маршируют под марокканским конвоем. Богатства стран Африки к югу от Сахары текут на север, в Марракеш и Фес. Вопрос в том, как консолидировать эту обширную территорию — через военные гарнизоны и карательные экспедиции или через коммерческие сети и устойчивую администрацию." #NT!
 nd_mor.6.a: "Укрепите дороги сталью." #NT!
 nd_mor.6.b: "Пусть торговля свяжет завоевания." #NT!
 nd_mor.7.t: "Провозглашен Западный Халифат." #NT!
 nd_mor.7.d: "От Туниса до Тимбукту, от Алжира до Атлантики — приказ марокканского султана беспрекословно действует. Мечта о западном халифате, шарифском царстве, которое могло бы соперничать с османами, осуществилась. Ученые, солдаты и торговцы со всего исламского мира смотрят на султана как на повелителя правоверных по правде, а не только по титулу. Вопрос теперь в том, как определить характер этого халифата на века." #NT!
 nd_mor.7.a: "Через благочестие и обучение." #NT!
 nd_mor.7.b: "Через силу оружия." #NT!
 nd_mor.8.t: "Пролив под защитой" #NT!
 nd_mor.8.d: "Гибралтарская скала, великая крепость, охраняющая проход между Средиземным морем и Атлантикой, теперь находится в руках Марокко. Каждый корабль, проходящий между двумя морями, делает это под пристальным взглядом султана. Корсары Сале радуются, купцы Феса видят новые горизонты, а европейские державы должны считаться с Марокко, которое контролирует самый стратегический водный путь в западном мире." #NT!
 nd_mor.8.a: "Проход в нашем распоряжении." #NT!
 nd_mor.9.t: "Атлантик Венчурс" #NT!
 nd_mor.9.d: "Марокканский сахар заполняет трюмы кораблей, направляющихся на европейские рынки. Казначейство султана переполнено прибылями от торговли, а банкиры королевства финансируют предприятия, которые поколение назад казались невозможными. Марокко стало западным якорем мировой торговли. Вопрос в том, стоит ли использовать это преимущество в Атлантике или консолидировать уже завоеванные рынки." #NT!
 nd_mor.9.a: "Направляйтесь в Атлантику." #NT!
 nd_mor.9.b: "Объедините нашу торговую империю." #NT!
 nd_mor.10.t: "Мастер двух океанов" #NT!
 nd_mor.10.d: "Марокканские купцы и моряки теперь работают от Мадейры до Могадора, от Средиземного моря до открытой Атлантики. По развитию Султанат может соперничать с любым европейским королевством, его торговые сети охватывают два океана, а его флаг развевается над водами, которые когда-то принадлежали исключительно иберийцам. Марокко стало не просто воротами между морями, но и силой, которая управляет ими обоими." #NT!
 nd_mor.10.a: "Наши флоты будут командовать волнами." #NT!
 nd_mor.10.b: "Наша торговля свяжет мир." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_saharan_garrisons: "Сеть сахарских гарнизонов" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_saharan_garrisons: "Военные аванпосты вдоль транссахарских маршрутов охраняют золотую дорогу силой оружия, хотя постоянная бдительность утомляет солдат." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_saharan_trade: "Сахарская коммерческая сеть" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_saharan_trade: "Торговые караваны и фундуки связывают завоеванные территории Сахары с Султанатом посредством торговли, хотя обширное королевство порождает местную автономию." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_caliphal_piety: "Халифат ученых" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_caliphal_piety: "Западный Халифат черпает свою силу из религиозного образования и культурного взаимодействия, приветствуя различные народы под знаменем Повелителя правоверных." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_caliphal_sword: "Халифат Меча" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_caliphal_sword: "Западный Халифат создан благодаря военному превосходству, а его армии являются инструментом шарифской власти в Магрибе и за его пределами." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_atlantic_reach: "Атлантический Предел" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_atlantic_reach: "Марокканские исследователи и торговцы выходят в открытую Атлантику, нанося на карту новые воды и создавая плацдармы вдали от дома, хотя боеготовность армии страдает от ориентации на море." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_market_ports: "Рыночные порты султана" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_market_ports: "Прибрежные города Марокко становятся процветающими торговыми центрами, привлекающими торговцев со всего известного мира, хотя быстрый рост приводит к инфляционному давлению." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_oceanic_fleet: "Океанический флот Марокко" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_oceanic_fleet: "Мощный военно-морской флот распространяет марокканскую мощь как в Средиземноморье, так и в Атлантике, превращая Султанат в великую морскую державу." #NT!
 STATIC_MODIFIER_NAME_nd_mor_dest_trade_empire: "Империя двух морей" #NT!
 STATIC_MODIFIER_DESC_nd_mor_dest_trade_empire: "Дипломатические и торговые сети Марокко охватывают два океана, завоевывая уважение и влияние Султаната во всех судах и конторах от Лиссабона до Тимбукту." #NT!
 nd_mor_dar_al_makhzen: "Дар аль-Махзен" #NT!
 nd_mor_dar_al_makhzen_desc: "Дворец Халифата, резиденция повелителя правоверных и центр религиозной, интеллектуальной и политической власти Западного Халифата. Его библиотеки, суды и залы для аудиенций олицетворяют шарифское величие." #NT!
 nd_mor_dar_al_bahr: "Дар аль-Бахр" #NT!
 nd_mor_dar_al_bahr_desc: "Дом Моря, грандиозный морской арсенал и торговый дом, где строится, снабжается и отправляется океанский флот Марокко, чтобы контролировать воды двух океанов." #NT!
 nd_mor_makhzen_upkeep: "Калифское обслуживание" #NT!
 nd_mor_makhzen_upkeep_desc: "Расходы на содержание дворца халифа, камень для его залов и дворов, бумагу и книги для библиотеки и прекрасные ткани для церемониальной обстановки двора." #NT!
 nd_mor_bahr_upkeep: "Арсенал Операции" #NT!
 nd_mor_bahr_upkeep_desc: "Стоимость эксплуатации морского арсенала, военно-морских припасов для флота, пиломатериалов и смолы для ремонта корпусов, а также инструментов для корабелов." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_mor_bureaucracy_authority: "Шарифская власть" #NT!
 AUTO_MODIFIER_DESC_nd_mor_bureaucracy_authority: "Шарифский султан правит через признанный государственный аппарат (Махзен, корпус каидов, адмиралтейство), предоставляя Марокко три бюрократических места сверх того, что принадлежит столице." #NT!
  
 mor_makhzen_central_administration_bureaucracy: "Махзен" #NT!
 mor_makhzen_central_administration_bureaucracy_desc: "Первоначально означавший склад или сокровищницу, Махзен сформировался при Саади (1549-1659) и был объединен Мулаем Исмаилом. Мобильный двор султана, состоящий из хаджиба, вузара и куттаба, управлял Билад аль-Махзеном напрямую, в то время как Билад ас-Сиба платил лишь спорадическую дань. Его инструментами были шарифские бараки, откупные амины и корпус данников-каидов." #NT!
  
 mor_jaysh_tribes_bureaucracy: "Джайшские племена" #NT!
 mor_jaysh_tribes_bureaucracy_desc: "Конфедерации поселенцев и солдат предоставляли наследственную военную службу в обмен на освобождение от налогов и коронные земли возле Феса и Мекнеса. Мулай Исмаил систематизировал это учреждение после 1672 года: 3000 черага, 4500 шерарда и 2000 удая были расквартированы вокруг Феса, а Джайш аль-Удая состоял из четырех племен Бану Макил из Суса. Их преданность была личной по отношению к султану." #NT!
  
 mor_qaid_provincial_government_bureaucracy: "Башавия Каидов" #NT!
 mor_qaid_provincial_government_bureaucracy_desc: "За пределами Билад аль-Махзена султан управлял через каидов, набранных из крупных племенных домов (Глауа из Телуэта, Мтугга, Гундафа, Хамади из Уеззана). Каид командовал своим собственным гумом, собирал харадж по своему усмотрению, сохранял часть до перевода и выносил решения вместе с кади. Баши Марракеша, Феса и Мекнеса были старше даже вузара." #NT!
  
 mor_karaouine_ulama_bureaucracy: "Карауин и улемы" #NT!
 mor_karaouine_ulama_bureaucracy_desc: "Основанная в 859 году нашей эры Фатимой аль-Фихри, мечеть-университет Каравийин в Фесе стала высшим учреждением маликитской юриспруденции в западном исламском мире. Его улемы укомплектованы судами кади в каждом марокканском городе, разрабатывают фетвы, на которых зиждется династическая легитимность, и управляют огромными пожертвованиями вакфов. Медресе Маринидов (Бу Инания, аль-Аттарин, аль-Сахридж) создали класс грамотных ученых-судей, с которым шарифским султанам приходилось вести переговоры, а не командовать." #NT!
  
 mor_zawiya_network_bureaucracy: "Завия Сети" #NT!
 mor_zawiya_network_bureaucracy_desc: "Суфийские ложи построены вокруг могилы вали во главе с шейхом, требующим силсилу от основателя. Традиция Шадхили положила начало политически значимым орденам: Джазулия, Насирия Тамегрута, Ваззания, Шаркава Буджада, Даркавия и Тиджания в Фесе с 1789 года. Во время Марабатического кризиса (ок. 1610–1660) Дила Завия в Среднем Атласе полностью контролировала центральное Марокко до тех пор, пока не разрушение Мулаем ар-Рашидом в 1668 году." #NT!
  
 mor_sale_corsair_divan_bureaucracy: "Диван аль-Бахр из Сале" #NT!
 mor_sale_corsair_divan_bureaucracy_desc: "После изгнания Мориско в 1609 году около 10 000 андалузских беженцев перебрались в нижнюю часть Бу-Регрега, Сале-Рабат стал корсарской столицей Атлантики. С 1627 года город управлялся как Республика Сале, управляемая диваном из двенадцати-четырнадцати повышений, которые ежегодно избирали каида и гранд-адмирала. Десять процентов от каждого укрепления, финансируемого призом. Мулай ар-Рашид подавил Республику в 1668 году, но включил ее адмиралтейство в качестве постоянного органа военно-морской администрации алауитов." #NT!
  
 mor_harka_taxation_expedition_bureaucracy: "Харка Махалли" #NT!
 mor_harka_taxation_expedition_bureaucracy_desc: "Марокканский ответ непокоримому племени: султан лично, с махаллей гарема, министрами, дворцовой стражей, кавалерией джейшей и горной артиллерией, маршировал в Билад ас-Сиба один или два раза в год, чтобы взыскать неуплаченные налоги, наказать восстание и восстановить каидов. Заведение датируется временами Идрисидов; Мулай Исмаил и его преемники-алауиты превратили это в рутину. Успешная харка вернулась с заложниками, данью и обновленным байа." #NT!
