l_russian:
 STATIC_MODIFIER_NAME_nd_rjp_sword_of_rajputana: "Меч Раджпутаны" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_sword_of_rajputana: "Кланы раджпутов сковались в единый клинок. Под знаменем объединенного Раджпутаны воинская аристократия вместе отправляется на войну, а их наследственная доблесть превращается в инструмент завоевания и защиты, способный соперничать с любой армией на субконтиненте." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_desert_throne: "Пустынный Трон" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_desert_throne: "В засушливом сердце Раджастана возвышается великолепное королевство. При дворах раджпутов индуистская преданность сочетается с покровительством искусству и архитектурными амбициями, превращая дворцы-крепости в центры культуры, привлекающие торговцев, ученых и ремесленников со всего субконтинента." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_sanga_united_clans: "Объединенные кланы Санграма" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_sanga_united_clans: "При Рана Санге враждующие кланы раджпутов оставили в стороне свои распри и сформировали могущественную конфедерацию. Вместе они командуют армиями, с которыми не может сравниться ни один султан." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_sanga_mewar_defiance: "Вызов Мевара" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_sanga_mewar_defiance: "Мевар стоит один против всех желающих. Там, где другие преклоняют колени, родословная Сисодия продолжает сражаться, холмы и пустыни Раджпутаны являются их щитом и чтят их крепость, которую не может прорвать никакая осада." #NT!
 nd_rjp.1.t: "Возвышение Раджпутаны" #NT!
 nd_rjp.1.d: "Великие кланы раджпутов объединились под одним знаменем. На протяжении веков Чауханы, Раторес, Сисодиас и Качхваха защищали каждый свои королевства: Мевар с его неприступным Читторгархом, Марвар с его всадниками из пустыни, Эмбер с его дипломатической хитростью. Теперь эти гордые дома воинов объединены в одно царство: Раджпутану.\n\nПеред нами стоит вопрос, каким королевством станет эта конфедерация. Мечники сотен кланов жаждут славы, их кавалерия наводит страх на весь Индостан. Но дворы Раджастана также переполнены поэтами, художниками и архитекторами, чьи работы могут соперничать с любыми работами в мире. Позволим ли мы клинку определять нас или трону?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rjp.1.a: "Наши мечи прорежут границы Раджпутаны." #NT!
 nd_rjp.1.b: "Наши дворцы будут предметом зависти королей." #NT!
 nd_rjp.2.t: "Конфедерация Рана Санги" #NT!
 nd_rjp.2.d: "Махарана Санграм Сингх I из Мевара, Рана Санга, достиг того, что считалось невозможным: объединения кланов раджпутов в боевую конфедерацию, способную бросить вызов самым могущественным державам северной Индии. К 1521 году его владения простирались от Манду на юге до Агры на северо-востоке и Инда на западе. Он выиграл восемнадцать генеральных сражений против султанов Дели, Малва и Гуджарата, заработав репутацию величайшего короля-воина своего времени.\n\nНа его теле есть следы его кампаний (восемьдесят ран, потеря руки и глаза), но его дух остается непоколебимым. Кланы раджпутов сплачиваются под его знаменем не посредством принуждения, а благодаря магнетизму его доблести. Вопрос в том, должна ли эта конфедерация продвигаться наружу как единая сила или направить свою силу на то, чтобы превратить Мевар в неприступный бастион независимости раджпутов." #NT!
 nd_rjp.2.a: "Пусть кланы объединятся под одним знаменем." #NT!
 nd_rjp.2.b: "Мевар никогда не согнётся: наши холмы — наш трон." #NT!
 nd_rjp.3.t: "Лев Мевара" #NT!
 nd_rjp.3.d: "В Халдигати в 1576 году Махарана Пратап Сингх из Мевара столкнулся со всей мощью Империи Великих Моголов, имея лишь половину ее численности. Хотя сама битва оказалась безрезультатной, то, что последовало за ней, определило характер Мевара на многие поколения. Вместо того, чтобы подчиниться, как это сделали другие дома раджпутов, Пратап отступил в холмы Аравалли и начал партизанскую войну, которая сохранила независимость Мевара. Он покинул свои дворцы, жил в пустыне и восстанавливал свои силы по одной деревне за раз.\n\nК моменту своей смерти в 1597 году Пратап благодаря исключительному упорству вернул себе почти все утраченные территории Мевара. Его легенда (о короле, который предпочел изгнание капитуляции, который ел хлеб из семян травы, а не кланялся императору) стала определяющей историей чести раджпутов. Никакое богатство, никакой комфорт, никакая императорская милость не стоили цены свободы." #NT!
 nd_rjp.3.a: "Его жертва никогда не будет забыта." #NT!
 nd_rjp.4.t: "Розовый город" #NT!
 nd_rjp.4.d: "В 1727 году махараджа Савай Джай Сингх II из Амбера основал новую столицу на равнине под своей крепостью на вершине холма. В отличие от органического разрастания большинства индийских городов, Джайпур планировался с нуля в соответствии с принципами Васту-шастры и Шилпа-шастры, включая точную сетку с широкими бульварами, стандартизированную высоту зданий и зонированные районы для разных профессий.\n\nДжай Сингх не был простым строителем. Он также был одним из выдающихся астрономов своего времени. Его обсерватория Джантар-Мантар, построенная с использованием массивных каменных инструментов его собственной конструкции, давала астрономические таблицы более точные, чем таблицы современных европейских обсерваторий. Город, который он построил, станет жемчужиной Раджпутаны: памятником идее о том, что раджпутская цивилизация может соперничать с любой другой цивилизацией мира как в учености, так и в красоте." #NT!
 nd_rjp.4.a: "Город, достойный наших амбиций." #NT!
 nd_rjp.5.t: "Джодхпур Лансерс" #NT!
 nd_rjp.5.d: "Сардар Рисала из Марвара, более известный как Джодхпурские уланы, ведет свою родословную с 1212 года, когда Раджа Рао Шинаджи сформировал личную охрану из конных воинов. За семь столетий это подразделение превратилось из феодальной свиты в одно из лучших кавалерийских соединений Индии. Вооруженные копьем, саблей и непоколебимой верой в боевые традиции Ратора, уланцы из Джодхпура перенесли воинственный дух Раджпутаны в современную эпоху.\n\nИх искусство верховой езды остается легендарным, выращенные на выносливых лошадях марвари из пустыни Тар, эти кавалеристы сражаются с яростью и мастерством, заслужившими уважение в каждой армии, с которой они столкнулись." #NT!
 nd_rjp.5.a: "Копье Ратора никогда не дает сбоев." #NT!
 nd_rjp_clan_oaths: "Клятвы раджпутского клана" #NT!
 nd_rjp_clan_oaths_desc: "Феодальные узы между кланами раджпутов, скрепленные кровными клятвами и брачными союзами, составляют основу военной мощи Раджпутаны. Каждый клан предоставляет своему такуру конных воинов, связанных честью." #NT!
 nd_rjp_hill_fort_tradition: "Хилл Форт Традиция" #NT!
 nd_rjp_hill_fort_tradition_desc: "Раджпуты стали мастерами оборонительных укреплений, построив крепости на вершинах холмов, используя естественную местность Аравалиса и Тара для создания практически неприступных позиций." #NT!
 nd_rjp_stepwell_engineering: "Степвелл Инжиниринг" #NT!
 nd_rjp_stepwell_engineering_desc: "В засушливом ландшафте Раджастхана строительство баоли, сложных ступенчатых колодцев, спускающихся на много этажей под землю, обеспечивало надежное хранение воды и само по себе стало архитектурным чудом." #NT!
 nd_rjp_kshatriya_dharma: "Кшатрия Дхарма" #NT!
 nd_rjp_kshatriya_dharma_desc: "Воинский кодекс раджпутов, укорененный в кшатрийских традициях индуистских писаний, требовал воинской доблести, защиты слабых, преданности своему господину и готовности сражаться и умереть, а не принимать бесчестие." #NT!
 nd_rjp_desert_caravans: "Караваны пустыни" #NT!
 nd_rjp_desert_caravans_desc: "Торговля текла через пустыню Тар по древним караванным путям, соединяющим порты Гуджарата с равниной Ганг. Королевства раджпутов разбогатели, облагая налогами и защищая эти жизненно важные торговые коридоры." #NT!
 nd_rjp_temple_architecture: "Храмовая архитектура" #NT!
 nd_rjp_temple_architecture_desc: "В раджпутских королевствах Раджастхана были построены необычайные индуистские и джайнские храмы с замысловатыми резными постройками из песчаника и мрамора в таких местах, как Ранакпур и Дилвара, демонстрирующие мастерство скульптурного искусства." #NT!
 nd_rjp_chittorgarh_resistance: "Читторгархское сопротивление" #NT!
 nd_rjp_chittorgarh_resistance_desc: "Трижды осаждаемый мусульманскими правителями, гарнизон Читторгарха трижды предпочитал смерть капитуляции. Крепость стала символом неповиновения раджпутов, а ее защитники — стандартом, по которому измеряется мужество." #NT!
 nd_rjp_court_poetry: "Придворная поэзия Традиция" #NT!
 nd_rjp_court_poetry_desc: "Суды раджпутов поддерживали сложные бардские традиции. Придворные поэты, чараны и бхаты сочиняли героические баллады, прославляющие родовую доблесть, документируя династическую историю посредством стихов, которые служили одновременно летописью и источником вдохновения." #NT!
 nd_rjp_jauhar_tradition: "Джаухар-Сакская традиция" #NT!
 nd_rjp_jauhar_tradition_desc: "Раджпутский обычай джаухара, массового самопожертвования женщин осажденной крепости, в сочетании с сакой, последним смертельным приговором мужчинам, представлял собой окончательный отказ подчиниться. Эта традиция сделала сопротивление раджпутов ужасающе абсолютным." #NT!
 nd_rjp_marwari_merchants: "Торговые сети Марвари" #NT!
 nd_rjp_marwari_merchants_desc: "Из пустынных городов Шехавати и Марвар купцы Раджастана построили торговые сети, простирающиеся по всей Индии. Их репутация финансовой хватки и надежности сделала торговцев Марвари неотъемлемой частью индийской торговли." #NT!
 nd_rjp_kumbhalgarh_wall: "Стена Кумбхалгарха" #NT!
 nd_rjp_kumbhalgarh_wall_desc: "Великая крепость Рана Кумбхи имела стены протяженностью 36 километров и являлась одними из самых длинных непрерывных крепостных стен в мире. Этот обширный оборонительный периметр защищал храмы, фермы и поселения внутри него." #NT!
 nd_rjp_akhara_martial_schools: "Боевые школы Акхара" #NT!
 nd_rjp_akhara_martial_schools_desc: "Воины-раджпуты с детства обучались в ахарах — боевых гимназиях, где осваивали фехтование, борьбу, стрельбу из лука и конный бой. Эти учреждения выпускали поколение за поколением квалифицированных бойцов." #NT!
 nd_rjp_marwari_horse_tradition: "Лошадиная традиция Марвари" #NT!
 nd_rjp_marwari_horse_tradition_desc: "Династия Ратор вывела лошадей марвари специально для боевых действий в пустыне: выносливых, умных и преданных, с характерными загнутыми внутрь ушами. Эти лошади могли пережить долгие марши по пустыне с минимальным количеством воды и сражались с исключительной храбростью.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_sanga_confederacy: "Конфедерация Санги" #NT!
 nd_rjp_sanga_confederacy_desc: "Рана Санга объединила кланы раджпутов в грозную военную конфедерацию, выиграв восемнадцать генеральных сражений против султанов Дели, малва и Гуджарата. Его царство в зените простиралось от Манду до Инда." #NT!
 nd_rjp_marwari_merchant_houses: "Торговые дома Марвари" #NT!
 nd_rjp_marwari_merchant_houses_desc: "Хавели в Шехавати (богатые купеческие особняки, украшенные фресками, зеркалами и сусальным золотом) демонстрировали огромное богатство, накопленное торговцами Марвари. Эти особняки стали центрами торговли и культуры.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_mughal_alliance: "Альянс Раджпутов-Моголов" #NT!
 nd_rjp_mughal_alliance_desc: "Начиная с раджи Ман Сингха из Амбера, несколько домов раджпутов вступили в брачные союзы и военное партнерство с Империей Великих Моголов. Генералы-раджпуты стали одними из самых надежных и способных командиров в армии Великих Моголов." #NT!
 nd_rjp_miniature_painting: "Миниатюрная живопись Раджастана" #NT!
 nd_rjp_miniature_painting_desc: "При дворах раджпутов в Меваре, Бунди, Кишангархе и Джайпуре были созданы особые школы миниатюрной живописи. Эти работы изображали религиозные темы, придворные сцены и романтическую поэзию в ярких красках на подготовленной бумаге и ткани.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_prataps_resistance: "Партизанское сопротивление Пратапа" #NT!
 nd_rjp_prataps_resistance_desc: "После Халдигати Махарана Пратап покинул свои дворцы и начал партизанскую кампанию с холмов Аравалли, вернув почти всю утраченную территорию Мевара благодаря настойчивости и глубокому знанию местности." #NT!
 nd_rjp_camel_corps: "Верблюд Рисала" #NT!
 nd_rjp_camel_corps_desc: "Верблюжьи кавалерийские корпуса Марвара и Биканера идеально подходили для работы на обширных пустынных просторах западной Раджпутаны. Начиная с 15 века, эти подразделения обеспечивали мобильность на местности, где сражалась обычная кавалерия." #NT!
 nd_rjp_aurangzeb_resistance: "Сопротивление Аурангзеба" #NT!
 nd_rjp_aurangzeb_resistance_desc: "Когда религиозная нетерпимость императора Аурангзеба поставила под угрозу автономию Раджпутов и индуистские традиции, королевства Раджпутов подняли восстание. Последующие войны истощили ресурсы Великих Моголов и ускорили упадок империи." #NT!
 nd_rjp_jaipur_founding: "Основание Джайпура" #NT!
 nd_rjp_jaipur_founding_desc: "Махараджа Савай Джай Сингх II основал запланированный город Джайпур в 1727 году, объединив принципы Васту Шастры с собственными астрономическими наблюдениями. Розовый город стал образцом городского планирования в Индии." #NT!
 nd_rjp_opium_trade_advance: "Торговля опиумом в Раджастане" #NT!
 nd_rjp_opium_trade_advance_desc: "На маковых полях Мальвы и Раджпутаны производился опиум, который стал одним из самых прибыльных торговых товаров той эпохи. Королевства раджпутов получали значительные доходы от контроля за выращиванием и экспортом этого ценного продукта.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_jagirdari_system: "Система Джагирдари" #NT!
 nd_rjp_jagirdari_system_desc: "Раджпутская феодальная система джагиров (предоставление земли дворянам-воинам в обмен на военную службу) создала децентрализованную, но эффективную структуру военной мобилизации. Каждый джагирдар имел свиту, пропорциональную его владениям." #NT!
 nd_rjp_jantar_mantar: "Обсерватории Джантар-Мантар" #NT!
 nd_rjp_jantar_mantar_desc: "Махараджа Савай Джай Сингх II построил пять астрономических обсерваторий по всей Индии, крупнейшая из которых находится в Джайпуре. Используя массивные каменные инструменты собственной конструкции, он создавал звездные каталоги поразительной точности.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_royal_karkhanas: "Королевский Карханас" #NT!
 nd_rjp_royal_karkhanas_desc: "При дворах раджпутов содержались государственные мастерские-карханы, производившие текстиль, оружие, ювелирные изделия и другие предметы роскоши. Эти мастерские сочетали традиционные ремесленные методы с художественными стандартами, установленными королевским покровительством." #NT!
 nd_rjp_musketeer_tradition: "Традиция раджпутских мушкетеров" #NT!
 nd_rjp_musketeer_tradition_desc: "Военная аристократия раджпутов, долгое время преданная мечу и копью, постепенно перешла на огнестрельное оружие, не отказываясь от своего военного духа. Раджпутские мушкетеры сочетали в себе дисциплину современной пехоты с личной доблестью кшатрийских традиций." #NT!
 nd_rjp_marwari_banking: "Банковские дома Марвари" #NT!
 nd_rjp_marwari_banking_desc: "Финансисты Марвари, родом из пустыни, основали банковские и ростовщические операции по всей Индии. Их хунди, переводные векселя, способствовали торговле на дальние расстояния и принесли им репутацию банкиров субконтинента." #NT!
 nd_rjp_autonomy_treaties: "Договоры об автономии" #NT!
 nd_rjp_autonomy_treaties_desc: "Когда власть Великих Моголов пошла на убыль, королевства раджпутов заключили договоры, гарантирующие их внутреннюю автономию. Эти соглашения сохранили власть раджпутских правителей над своими владениями, признавая при этом номинальный сюзеренитет." #NT!
 nd_rjp_textile_renaissance: "Раджастханский текстильный ренессанс" #NT!
 nd_rjp_textile_renaissance_desc: "Традиции блочной печати и крашения в Раджастане, особенно знаменитые техники бандхани и аджрах, позволили создать текстиль, который ценится в Индии и за ее пределами. Такие города, как Джайпур и Санганер, стали центрами текстильной торговли." #NT!
 nd_rjp_court_patronage: "Покровительство раджпутского суда" #NT!
 nd_rjp_court_patronage_desc: "Более поздние дворы раджпутов стали известными покровителями музыки, танцев, живописи и литературы. Художественные традиции, взращенные во дворцах от Удайпура до Джайпура, породили одни из лучших выражений индийской культуры.\n\n#italic Доступно в: $nd_rjp_haveli$#!" #NT!
 nd_rjp_jodhpur_lancers: "Джодхпур Лансерс" #NT!
 nd_rjp_jodhpur_lancers_desc: "Сардар Рисала из Марвара, Джодхпурские уланы, проследили свою родословную с 1212 года до наших дней. Вооруженные копьями и саблями на лошадях марвари, они олицетворяли семь столетий боевых традиций Ратора." #NT!
 nd_rjp_princely_reforms: "Княжеские государственные реформы" #NT!
 nd_rjp_princely_reforms_desc: "Более прогрессивные правители раджпутов провели административные реформы, создав современные суды, образовательные учреждения и системы доходов, сохранив при этом традиционную власть правящих домов." #NT!
 nd_rjp_marwari_industrialists: "Промышленники Марвари" #NT!
 nd_rjp_marwari_industrialists_desc: "Торговые семьи Марвари, накопившие огромное богатство за счет торговли и банковского дела, перешли к промышленному предпринимательству. Их инвестиции в текстильную, горнодобывающую и обрабатывающую промышленность заложили основы современной индийской промышленности." #NT!
 nd_rjp_martial_legacy: "Раджпутское военное наследие" #NT!
 nd_rjp_martial_legacy_desc: "Воинские традиции кланов раджпутов (вековые кавалерийские бои, защита крепостей и кодекс чести, в котором доблесть превыше всего) сохранились и в современную эпоху, обеспечив основу для выдающейся военной службы." #NT!
 nd_rjp_heritage_architecture: "Наследие Архитектуры" #NT!
 nd_rjp_heritage_architecture_desc: "Дворцы, форты и храмы Раджастана представляют собой многовековые архитектурные достижения. От озерных дворцов Удайпура до цитадели из песчаника Джайсалмера — эти сооружения являются памятниками цивилизации раджпутов." #NT!
 nd_rjp_desert_irrigation: "Орошение пустыни" #NT!
 nd_rjp_desert_irrigation_desc: "Современные системы плотин и каналов изменили засушливый ландшафт Раджастана, доставляя воду в регионы, которые на протяжении веков зависели от сезонных дождей и ступенчатых колодцев. Эта инфраструктура позволила расширить сельское хозяйство на окраинах Тара." #NT!
 a_nd_rjp_rajput_sowar: "Раджпут Совар" #NT!
 a_nd_rjp_rajput_sowar_desc: "Феодальная кавалерия кланов раджпутов, конные воины, связанные клановыми клятвами сражаться за своего тхакура. Вооруженные копьем и мечом талвар, они атакуют с яростью, рожденной поколениями боевых традиций." #NT!
 a_nd_rjp_marwari_lancer: "Марвари Лансер" #NT!
 a_nd_rjp_marwari_lancer_desc: "Элитная кавалерия верхом на характерных лошадях марвари из пустыни Тар. Выращенные для выносливости и храбрости, эти лошади и их наездники превосходно совершают быстрые набеги на засушливые равнины Раджпутаны." #NT!
 a_nd_rjp_chela_swordsman: "Чела Мечник" #NT!
 a_nd_rjp_chela_swordsman_desc: "Гарнизонная пехота обучалась в ахарах раджпутских городов-крепостей. Эти мечники служат последней линией защиты, когда стены прорваны, сражаясь с фанатичной решимостью, уходящей корнями в традицию джаухаров." #NT!
 a_nd_rjp_camel_risala: "Верблюд Рисала" #NT!
 a_nd_rjp_camel_risala_desc: "Пустынная кавалерия на верблюдах, уникально приспособленная к действиям в обширной пустыне Тар. Там, где обычная кавалерия колеблется в песке, рисала сохраняет мобильность, доставляя припасы через безводные пустоши." #NT!
 a_nd_rjp_rajput_musketeer: "Раджпутский мушкетер" #NT!
 a_nd_rjp_rajput_musketeer_desc: "Модернизированная раджпутская пехота, вооруженная мушкетами с фитильными, а затем и кремневыми замками. Эти воины сочетают в себе личное мужество традиции кшатриев с дисциплинированной залповой стрельбой современной пехотной доктрины." #NT!
 a_nd_rjp_jodhpur_lancer: "Джодхпур Лансер" #NT!
 a_nd_rjp_jodhpur_lancer_desc: "Легендарная кавалерия клана Ратор, наследница семи веков конной войны в пустынях Марвара. Вооруженные копьями со стальным наконечником и изогнутой саблей, они являются гордостью военных традиций Раджпутаны." #NT!
 nd_rjp_durg: "Раджпут Дург" #NT!
 nd_rjp_durg_desc: "Крепость на вершине холма, построенная в архитектурных традициях раджпутов с использованием естественной защищенности хребта Аравалли и окраин Тара для создания крепости, практически неуязвимой для нападения." #NT!
 nd_rjp_durg_maintenance: "Дург Гарнизон" #NT!
 nd_rjp_durg_maintenance_desc: "Уход за каменными стенами и вооружением раджпутской крепости на вершине холма." #NT!
 nd_rjp_baoli: "Баоли Степвелл" #NT!
 nd_rjp_baoli_desc: "Сложный ступенчатый колодец, спускающийся глубоко под землю, обеспечивает надежное хранение воды в засушливом климате Раджастана. Эти чудеса инженерной мысли также служат отличным местом для встреч сообщества." #NT!
 nd_rjp_baoli_maintenance: "Техническое обслуживание Степвелла" #NT!
 nd_rjp_baoli_maintenance_desc: "Уход за каменными лестницами и водными каналами ступенчатого колодца в Раджастане." #NT!
 nd_rjp_haveli: "Марвари Хавели" #NT!
 nd_rjp_haveli_desc: "Богато украшенный купеческий особняк, украшенный фресками, зеркалами и резными фасадами из песчаника. Эти хавели служат одновременно резиденцией и счетным домом для богатых торговых семей Марвари." #NT!
 nd_rjp_haveli_maintenance: "Содержание Хавели" #NT!
 nd_rjp_haveli_maintenance_desc: "Поддержание сложных декоративных элементов и коммерческих операций торгового особняка Марвари." #NT!
 nd_rjp_akhara: "Раджпут Ахара" #NT!
 nd_rjp_akhara_desc: "Традиционный полигон воинов, где юные раджпуты учатся фехтованию, борьбе, стрельбе из лука и конному бою под руководством опытных ветеранов. Эти учреждения являются основой боевой культуры раджпутов." #NT!
 nd_rjp_akhara_maintenance: "Учебные принадлежности Акхары" #NT!
 nd_rjp_akhara_maintenance_desc: "Обеспечение оружием, лошадьми и продовольствием воинов, тренирующихся в раджпутской ахаре." #NT!
 nd_rjp_karkhana: "Раджастхани Кархана" #NT!
 nd_rjp_karkhana_desc: "Королевская мастерская по производству изысканных тканей, изделий из металла, ювелирных изделий и оружия под покровительством двора. Эти государственные предприятия сочетают традиционное ремесло Раджастхана с ресурсами княжеской казны." #NT!
 nd_rjp_karkhana_maintenance: "Кархана Текстильное Производство" #NT!
 nd_rjp_karkhana_maintenance_desc: "Придворные ремесленники превращают ткань и красители в изысканные ткани, а вышивка медной нитью добавляет характерный орнамент Раджастхана." #NT!
 nd_rjp_marwari_breeding: "Коневодство Марвари" #NT!
 nd_rjp_marwari_breeding_desc: "Селекционное разведение лошадей марвари, которые ценятся за выносливость, интеллект и характерные загнутые внутрь уши. Эти выносливые к пустыне боевые кони — любимое животное раджпутской кавалерии." #NT!
 nd_rjp_bandhani_dyeing: "Бандхани-окрашивание галстука" #NT!
 nd_rjp_bandhani_dyeing_desc: "Традиционное раджастханское искусство бандхани — замысловатые узоры, создаваемые путем связывания и окрашивания ткани, — позволяет производить ткани удивительной красоты, ценимые в Индии и за ее пределами." #NT!
 nd_rjp_desert_caravan_trade: "Пустынная караванная торговля" #NT!
 nd_rjp_desert_caravan_trade_desc: "Торговля велась по древним караванным путям, пересекавшим пустыню Тар и соединявшим порты Гуджарата с рынками северной Индии." #NT!
 nd_rjp_opium_trade: "Выращивание опиума" #NT!
 nd_rjp_opium_trade_desc: "Выращивание и переработка опийного мака на полях малва и Раджпутана, использование пшеницы и волокон для поддержания урожая мака и производство одного из самых прибыльных торговых товаров той эпохи." #NT!
 levy_nd_rjp_rajput_sowar: "Раджпут Совар Леви" #NT!
 levy_nd_rjp_rajput_sowar_desc: "Феодальная кавалерия, набранная из благородных кланов раджпутов." #NT!
 levy_nd_rjp_chela_swordsman: "Чела Мечник Леви" #NT!
 levy_nd_rjp_chela_swordsman_desc: "Гарнизонная пехота, набранная из городов-крепостей Раджпутаны." #NT!
 levy_nd_rjp_jodhpur_lancer: "Джодхпур Лансер Леви" #NT!
 levy_nd_rjp_jodhpur_lancer_desc: "Элитная кавалерия, набранная из ратхорской знати Марвара." #NT!
 nd_rjp_temple_offerings: "Храмовые подношения" #NT!
 nd_rjp_temple_offerings_desc: "Подношения в виде домашнего скота и пчелиного воска поддерживают индуистские храмы Раджастана, поддерживая класс священников и поддерживая духовный центр общин раджпутов." #NT!
 nd_rjp_miniature_pigments: "Подготовка миниатюрной краски" #NT!
 nd_rjp_miniature_pigments_desc: "Подготовка пигментов и тонкой бумаги для знаменитых школ миниатюрной живописи Мевара, Бунди и Кишангарха." #NT!
 nd_rjp_astronomical_records: "Астрономические записи" #NT!
 nd_rjp_astronomical_records_desc: "Систематическая запись небесных наблюдений в обсерваториях Джая Сингха, использование бумаги для каталогов, стекла для линз и инструментов для великих каменных инструментов, создание звездных каталогов и планетных таблиц поразительной точности." #NT!
 nd_rjp_court_arts: "Покровительство придворным искусствам" #NT!
 nd_rjp_court_arts_desc: "Покровительство музыке, танцам и декоративному искусству при дворах раджпутов, поддержание традиций необычайной изысканности и красоты." #NT!
 nd_rjp_formed_tt: "Раджпутана была основана" #NT!
 nd_rjp_path_a_tt: "Выбрать Меч Раджпутаны" #NT!
 nd_rjp_path_b_tt: "Выбрать трон пустыни" #NT!
 nd_rjp_destiny: "Судьба Раджпутаны" #NT!
 nd_rjp_destiny_desc: "Кланы объединены, — провозгласило королевство. Теперь Раджпутане предстоит выбрать свой путь: меч или трон определят эту эпоху? Достигните стабильности во всем мире, чтобы начать путь." #NT!
 nd_rjp_dest_iron_throne: "Железный трон Дели" #NT!
 nd_rjp_dest_iron_throne_desc: "Ни одно королевство раджпутов не может претендовать на господство над Индостаном, не удерживая Дели, резиденцию султанов и императоров. Идите на север, захватите столицу и докажите, что оружие раджпутов — хозяева Индии." #NT!
 nd_rjp_dest_malwa_campaign: "Кампания малва" #NT!
 nd_rjp_dest_malwa_campaign_desc: "Обеспечив безопасность Дели, конфедерация раджпутов должна сломить мощь султаната малва и перебросить силы вглубь Ганги. Возьмите Удджайн и священный город Варанаси, чтобы установить владычество Раджпутов над центральной Индией." #NT!
 nd_rjp_dest_rajput_imperium: "Раджпутская Империя" #NT!
 nd_rjp_dest_rajput_imperium_desc: "Краеугольный камень военной мощи раджпутов: империя, простирающаяся от Инда до Ганга. Захватите Лахор и Лакхнау, командуйте крупнейшей армией Индии и сделайте раджпутского короля-воина бесспорным правителем субконтинента." #NT!
 nd_rjp_dest_marwari_ascendancy: "Господство Марвари" #NT!
 nd_rjp_dest_marwari_ascendancy_desc: "Торговые сети Марвари должны выйти за пределы Тара. Доставьте шелк на рынки Раджпутаны и постройте сокровищницу, достойную трона пустыни. Богатство, а не война, будет определять это королевство." #NT!
 nd_rjp_dest_jewel_of_india: "Жемчужина Индии" #NT!
 nd_rjp_dest_jewel_of_india_desc: "Раджпутана должна стать культурным и интеллектуальным сердцем Индии. Используйте современное банковское дело, развивайте землю в полной мере и зарабатывайте престиж, который приходит от цивилизации, а не только от завоеваний." #NT!
 nd_rjp_dest_eternal_rajputana: "Вечный Раджпутана" #NT!
 nd_rjp_dest_eternal_rajputana_desc: "Окончательный расцвет: цивилизация, переживающая века. Овладейте печатным станком, создайте процветающее и грамотное королевство с мраморными дворцами, способными соперничать с любыми в мире, и постройте Раджпутану, которую история никогда не забудет." #NT!
 nd_rjp.6.t: "Судьба Раджпутаны" #NT!
 nd_rjp.6.d: "Раджпутана наконец-то объединился. Ветры пустыни обещают величие, будь то звон стали или великолепие мраморных дворцов, это королевство оставит свой след в веках." #NT!
 nd_rjp.6.a: "Наша судьба ждет." #NT!
 nd_rjp.7.t: "Железный трон Дели" #NT!
 nd_rjp.7.d: "Знамя раджпутов реет над Дели. На протяжении поколений султаны правили из этого города, в то время как короли раджпутов защищали свои крепости в пустыне. Теперь ситуация поменялась. Лорд раджпутов сидит там, где когда-то находился двор султана Дели, а кланы воинов, которые когда-то сражались просто ради выживания, теперь владеют величайшей наградой в северной Индии.\n\nЗахват Дели посылает сообщение, которое разносится по всему субконтиненту: эпоха султаната закончилась. Началась эпоха Раджпутаны." #NT!
 nd_rjp.7.a: "Воины пустыни держат трон королей." #NT!
 nd_rjp.8.t: "Кампания малва" #NT!
 nd_rjp.8.d: "Богатые земли малва и равнина Ганга пали под натиском раджпутских войск. Удджайн, древний город, посвященный Шиве, теперь укрывает гарнизон раджпутов. Святые гаты Варанаси, где паломники купались с незапамятных времен, находятся в пределах наших границ.\n\nЭто больше, чем военная кампания. Это утверждение цивилизационной власти раджпутов в сердце Индии. Вопрос в том, как закрепить эти огромные завоевания." #NT!
 nd_rjp.8.a: "Пусть победители возьмут то, что завоевал меч." #NT!
 nd_rjp.8.b: "Установите власть Раджпутов посредством закона и порядка." #NT!
 nd_rjp.9.t: "Раджпутская Империя" #NT!
 nd_rjp.9.d: "От Лахора до Лакхнау, от пустыни Тар до берегов Ганги, империя раджпутов теперь охватывает большую часть любого королевства, управляемого кланами воинов. То, что началось как конфедерация пустынных государств-крепостей, стало доминирующей силой субконтинента.\n\nДхарма кшатриев была реализована за пределами мечтаний любого предка. Вопрос в том, какую форму примет эта империя в ближайшие столетия." #NT!
 nd_rjp.9.a: "Создайте постоянную имперскую армию, чтобы удержать королевство." #NT!
 nd_rjp.9.b: "Поддерживайте конфедеративные традиции кланов." #NT!
 nd_rjp.10.t: "Господство Марвари" #NT!
 nd_rjp.10.d: "Торговые дома Шехавати и Марвара расширили свои торговые сети далеко за пределы пустыни. Шелк из далеких земель течет по рынкам Раджпутаны, а сокровищницы королевства пополняются богатством торговли. Репутация Марвари как человека с финансовой хваткой сделала Раджпутану центром индийской торговли." #NT!
 nd_rjp.10.a: "Богатство течет к тем, кто знает ему цену." #NT!
 nd_rjp.11.t: "Жемчужина Индии" #NT!
 nd_rjp.11.d: "Раджпутана стала маяком цивилизации. Планированные города, обсерватории, школы миниатюрной живописи, текстильные мастерские — вместе они представляют собой расцвет культуры, которая может соперничать с любой другой культурой в мире. Ученые и ремесленники стекаются ко дворам раджпутских королей, привлеченные покровительством и утонченностью королевства, которое предпочло красоту кровопролитию.\n\nВопрос в том, вкладывать ли средства дальше в культурное великолепие, которое определяет Раджпутану, или расширить возможности торговых домов, которые все это финансируют." #NT!
 nd_rjp.11.a: "Пусть Розовый город сияет как маяк культуры." #NT!
 nd_rjp.11.b: "Торговые князья заслужили свое место при дворе." #NT!
 nd_rjp.12.t: "Вечный Раджпутана" #NT!
 nd_rjp.12.d: "Мраморные дворцы вечно стоят против пустынного ветра. Раджпутана стала больше, чем королевством. Это цивилизация, живое свидетельство того, чего может достичь раджпутский дух, если он направлен на созидание, а не на разрушение. Джал-Махал возвышается над водами Ман-Сагара, его белый мрамор мерцает под солнцем пустыни, дворец, который, кажется, парит между землей и небом.\n\nЭто наследие Трона Пустыни: королевство, которое существует не благодаря страху перед своими армиями, а благодаря восхищению мира." #NT!
 nd_rjp.12.a: "Сохраните наше наследие на все времена." #NT!
 nd_rjp.12.b: "Инвестируйте в знания, которые строят будущее." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_victors_march: "Марш Виктора" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_victors_march: "Армия раджпутов проносится по завоеванным территориям, быстро пополняя и забирая военные трофеи. Содержание крепости страдает по мере того, как ресурсы перетекают в кампанию." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_rajput_hegemony: "Раджпутская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_rajput_hegemony: "Власть раджпутского трона устанавливается над завоеванными землями, обеспечивая выгодные условия мира и лояльность подвластных правителей." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_kshatriya_empire: "Кшатрийская империя" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_kshatriya_empire: "Постоянная имперская армия, подобающая империи, охватывающей субконтинент, хотя бюрократия успокаивается под тяжестью превосходства раджпутов." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_confederate_sword: "Меч Конфедерации" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_confederate_sword: "Старая конфедеративная традиция кланов раджпутов, гибкая армия, построенная на недорогих профессиональных солдатах, дополненных наемниками и разведывательными сетями." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_pink_city_glory: "Слава розового города" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_pink_city_glory: "Культурное влияние запланированных Раджпутаной городов и художественных традиций распространяется по всей Индии, хотя поддержание такого великолепия требует еще более щедрых расходов суда." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_merchant_princes: "Торговые принцы Раджпутаны" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_merchant_princes: "Торговые дома Марвари обладают влиянием, соперничающим с влиянием воинской знати, их финансовые сети обеспечивают дипломатическую гибкость и быстрое восстановление." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_living_heritage: "Живое наследие" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_living_heritage: "Дворцы, храмы и крепости Раджпутаны сохраняются и расширяются как живые памятники раджпутской цивилизации, привлекая население в культурную орбиту королевства." #NT!
 STATIC_MODIFIER_NAME_nd_rjp_dest_desert_renaissance: "Пустынный ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_rjp_dest_desert_renaissance: "Модернизация сельского хозяйства и строительство дорог преображают засушливые окраины Раджастана, а военные инновации, порожденные войнами в пустыне, обостряют границы королевства." #NT!
 nd_rjp_rajput_citadel: "Раджпутская цитадель" #NT!
 nd_rjp_rajput_citadel_desc: "Высшее выражение раджпутской военной архитектуры: массивный крепостной комплекс на вершине холма с концентрическими стенами, подземными арсеналами и позициями, призванными доминировать над окружающим ландшафтом. Цитадель, из которой император раджпутов командует своими владениями." #NT!
 nd_rjp_citadel_maintenance: "Цитадель Гарнизон" #NT!
 nd_rjp_citadel_maintenance_desc: "Поддержание каменных стен, оружейных складов и гарнизона императорской цитадели раджпутов." #NT!
 nd_rjp_jal_mahal: "Джал Махал" #NT!
 nd_rjp_jal_mahal_desc: "Дворец, построенный на водах искусственного озера, его мраморные стены и павильоны из песчаника возвышаются над поверхностью, словно воплотившийся в реальность мираж. Джал-Махал — это высшее выражение раджпутских архитектурных амбиций, красоты, инженерии и королевского великолепия." #NT!
 nd_rjp_jal_mahal_maintenance: "Содержание дворца" #NT!
 nd_rjp_jal_mahal_maintenance_desc: "Поддержание мраморных фасадов, расписных павильонов и ландшафтных садов водного дворца." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 rjp_bhat_charan_bardic_bureaucracy: "Бардский суд Бхат-Чарана" #NT!
 rjp_bhat_charan_bardic_bureaucracy_desc: "Наследственные касты бардов-генеалогов Раджастхана (бхаты хранят письменные вамшавали из придворных архивов, а чараны охраняют свои устные аналоги) сохраняют списки родословной, от которых зависят претензии каждого раджпута на статус кшатриев. Их поэзия связывает воинскую аристократию с непрерывным героическим прошлым, а Чаранская угроза траги (ритуального членовредительства, подвергающего публичному позору имя короля) остается одним из немногих механизмов, которые могут сдержать раджпутского правителя в середине правления." #NT!
  
 rjp_thikana_pattedari_bureaucracy: "Тикана Паттедари" #NT!
 rjp_thikana_pattedari_bureaucracy_desc: "Практика Мевари и Марвари по разделению царства на тиканы, принадлежащие джагирдарам или паттедарам на наследственных чакрах: служба с оружием в руках. Каждый великий дом формирует свой собственный кавалерийский отряд под командованием старшего такура: Шестнадцать Умрао Мевара, Восемь Сардаров Джодхпура, Двенадцать Котри Биканера. Система располагает основной частью раджпутской кавалерии без наемной постоянной армии, но передает реальную территориальную власть домам воинов, чьи списки предшествуют любому трону над ними." #NT!
  
 rjp_saptanga_mantriparishad_bureaucracy: "Сапта-Анга Мантрипаришад" #NT!
 rjp_saptanga_mantriparishad_bureaucracy_desc: "Тайный совет Махараны, организованный на основе классической семиступенчатой ​​теории государственного управления из Артхашастры и Манусмрити: свами (суверен), аматья (министр), джанапада (население царства), дурга (форты), коша (казначейство), данда (сила) и митра (союзники). Прадханы этих портфелей сидят под Махараной, министерской скамьей коренных народов, возникшей еще до появления аппарата диванов Великих Моголов и выражающей суверенитет раджпутов в непрерывных санскритских терминах." #NT!
  
 rjp_kuldevi_shrine_bureaucracy: "Сеть храмов Кулдеви" #NT!
 rjp_kuldevi_shrine_bureaucracy_desc: "Святилища богини-покровительницы клана, связывающие каждую династию раджпутов с суверенно-женским культом: Эклингджи в Кайлашпури, перед которым правят Сисодия Мевара как слуги богини; Карни Мата в Дешноке от Раторов Биканера; Джамвай Мата для Качхвах Янтаря; Наганечи Мата для раторов Марвара; Ашапури для Чауханов. Ни одна коронация раджпутов не будет полной без признания кулдеви, и жрецы-попечители этих святынь выступают в качестве непрерывной ритуальной конституции королевства." #NT!
  
 rjp_hindola_itinerant_court_bureaucracy: "Передвижной суд Хиндолы" #NT!
 rjp_hindola_itinerant_court_bureaucracy_desc: "Передвижной дарбар на паланкине, с помощью которого правители раджпутов осуществляют суверенитет: путешествуют по своим тиканам и держали двор в последовательных крепостях. Сисодия перемещаются между Читтором, Кумбхалгархом и Удайпуром; Раторы между Мандором, Мехрангархом и Джодхпуром. Хиндола-паланкин, королевский зонтик чхатра и передвижная прислуга превращают каждый великий форт во временную столицу: суверенитет присутствия, а не места, в котором король находится везде, где останавливается его свита." #NT!
  
 rjp_mansabdari_compromise_bureaucracy: "Мансабдарский компромисс" #NT!
 rjp_mansabdari_compromise_bureaucracy_desc: "Интеграция вождей раджпутов в систему мансабов Великих Моголов после 1562 года, начавшаяся с того, что Раджа Бхармал из дочери Эмбер Джодха Бай женился на Акбаре, и достигла зрелости при Радже Ман Сингхе I (мансаб 7000), Мирзе Радже Джай Сингхе и Махарадже Джасванте Сингхе из Марвара. Правители раджпутов имеют имперские звания и командуют армиями Великих Моголов, сохраняя при этом своих предков-джагиров дома: институт двойной лояльности, который приносит богатство, престиж и разъедающую двусмысленность служения чужому трону, чьи приказы могут однажды потребовать крови раджпутов против своих собратьев-раджпутов." #NT!
  
 rjp_vijaya_stambha_bureaucracy: "Мемориальный культ Виджая Стамбхи" #NT!
 rjp_vijaya_stambha_bureaucracy_desc: "Институциональный культ памяти военной чести был сосредоточен на девятиэтажной Виджая Стамбхе Махараны Кумбхи в Читторе (1448 г., в ознаменование его победы над Махмудом Хилджи из малва) и более старой Кирти Стамбхе, дополненной мемориальным комплексом Джаухар-сака, посвященным трем осадам Читтора в 1303, 1535 и 1568 годах, когда женщины крепости были принесены в жертву. сами и воины выехали в шафрановых одеждах на последний вылазок. Паломничество к этим памятникам приобщает каждое новое поколение к дхарме воинской смерти." #NT!
  
 AUTO_MODIFIER_NAME_nd_rjp_bureaucracy_authority: "Бюрократическая власть Махараны" #NT!
 AUTO_MODIFIER_DESC_nd_rjp_bureaucracy_authority: "После объединения Раджпутаны Махарана наследует институциональную основу каждого раджпутского дома, принявшего бардскую клятву, и получает статус принимающей исторической бюрократии." #NT!
