l_russian:
 STATIC_MODIFIER_NAME_nd_mch_way_of_the_ancestors: "Путь предков" #NT!
 STATIC_MODIFIER_DESC_nd_mch_way_of_the_ancestors: "Маньчжурский народ сохраняет свое воинское наследие и степные традиции. Путь предков требует мастерства верховой езды, стрельбы из лука и охоты: навыков, которые создали империю из разрозненных племен." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dragon_throne: "Трон Дракона" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dragon_throne: "Маньчжурские правители принимают на себя мандат Неба и аппарат китайской цивилизации. Приняв бюрократическое управление и научные традиции, империя управляется через институты конфуцианского государственного управления." #NT!
 nd_mch.1.t: "Судьба Маньчжурии" #NT!
 nd_mch.1.d: "Разбросанные чжурчжэньские племена слились в единую нацию: маньчжуров. От лесов гор Чанбайшань до берегов Сунгари теперь развеваются единые знамена. Но единство поднимает вопрос, который определит наше будущее: сохраним ли мы традиции наших предков (охоту, лошадь, дисциплину ниру) или обратим свой взор на юг, к огромной цивилизации, чье богатство и знания манят из-за Ивового Частокола? Путь, который мы выбираем сейчас, будет формировать маньчжуров на многие поколения.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mch.1.a: "Мы всадники и воины: нас ведут предки." #NT!
 nd_mch.1.b: "Мы будем править с самого Драконьего Трона." #NT!
 nd_mch.2.t: "Система Ниру" #NT!
 nd_mch.2.d: "Наша военная и гражданская организация была преобразована посредством системы ниру. Каждая рота из трехсот человек служит не просто боевой единицей, но и административным округом, отвечающим за налогообложение, регистрацию переписи и трудовую службу. Через ниру каждый мужчина в стране играет свою роль: охотник, фермер, солдат, ремесленник. Перед нами стоит вопрос: следует ли подчеркивать военный потенциал этой организации или ее способность к гражданскому управлению." #NT!
 nd_mch.2.a: "Ниру существуют для того, чтобы отправлять воинов в поле боя." #NT!
 nd_mch.2.b: "Ниру должны управлять так же, как и сражаться." #NT!
 nd_mch.3.t: "Ивовый частокол" #NT!
 nd_mch.3.d: "Огромный земляной вал из рвов, насыпей и ив теперь отмечает границу родины маньчжуров. Ивовый частокол простирается от Шаньхайгуаня до границы, отделяя Маньчжурию от Монголии и заселенных китайцами земель Ляодун. Сторожевые посты Карун следят за пересечением границы, контролируя передвижение торговцев, поселенцев и потенциальных врагов. Частокол сохраняет характер земель наших предков, одновременно защищая нашу стратегическую глубину." #NT!
 nd_mch.3.a: "Родина обеспечена." #NT!
 nd_mch.4.t: "Верховный Цин" #NT!
 nd_mch.4.d: "Под энергичным имперским руководством маньчжурское государство достигло своего зенита. Царство простирается от реки Амур до джунглей Бирмы, от пустынь Туркестана до острова Тайвань. Население раздулось, житницы переполнены, казна полна. Тем не менее, этот момент верховной власти представляет собой выбор: будем ли мы продвигаться вперед в Десяти великих кампаниях, чтобы умиротворить все границы, или укрепить это процветание и позволить богатству империи стать основой прочной стабильности?" #NT!
 nd_mch.4.a: "Запустите десять великих кампаний." #NT!
 nd_mch.4.b: "Пусть процветание Цяньлуна процветает." #NT!
 STATIC_MODIFIER_NAME_nd_mch_niru_mobilization: "Ниру Мобилизация" #NT!
 STATIC_MODIFIER_DESC_nd_mch_niru_mobilization: "Система ниру ставит всю маньчжурскую нацию на военную позицию, и каждая рота готова в любой момент выставить свои триста человек." #NT!
 STATIC_MODIFIER_NAME_nd_mch_niru_administration: "Администрация Ниру" #NT!
 STATIC_MODIFIER_DESC_nd_mch_niru_administration: "Компании ниру служат административной основой маньчжурского государства, собирая налоги, регистрируя население и поддерживая порядок." #NT!
 STATIC_MODIFIER_NAME_nd_mch_ten_great_campaigns: "Десять великих кампаний" #NT!
 STATIC_MODIFIER_DESC_nd_mch_ten_great_campaigns: "Серия решающих военных кампаний распространила власть Маньчжурии на все уголки королевства, продемонстрировав неизменное военное мастерство армий Знамени." #NT!
 STATIC_MODIFIER_NAME_nd_mch_qianlong_prosperity: "Цяньлун Процветание" #NT!
 STATIC_MODIFIER_DESC_nd_mch_qianlong_prosperity: "Империя переживает эпоху беспрецедентного процветания. Рост населения, расширение сельского хозяйства и тщательное управление финансами создали золотой век изобилия." #NT!
 nd_mch_shamanic_traditions: "Маньчжурские шаманские традиции" #NT!
 nd_mch_shamanic_traditions_desc: "Поклонение Абка Эндури, Богу Неба, и почитание духов предков через потомственных шаманов связывают маньчжурские кланы общей духовной практикой." #NT!
 nd_mch_aha_retainers: "Система фиксаторов Ага" #NT!
 nd_mch_aha_retainers_desc: "Кабальные вассалы обслуживают маньчжурские дворянские семьи, обеспечивая резерв военной рабочей силы, которую можно мобилизовать во время войны." #NT!
 nd_mch_sable_fur_trade: "Торговля мехом соболя" #NT!
 nd_mch_sable_fur_trade_desc: "В лесах Маньчжурии добывают лучшие в мире шкуры соболей, которые ценятся купцами от Пекина до Бухары." #NT!
 nd_mch_jurchen_horsemanship: "Чжурчжэньское искусство верховой езды" #NT!
 nd_mch_jurchen_horsemanship_desc: "Каждый чжурчжэньский воин с детства учится ездить на выносливом маньчжурском коне по замерзшим рекам и густым лесам родины." #NT!
 nd_mch_ginseng_monopoly: "Женьшеневая монополия" #NT!
 nd_mch_ginseng_monopoly_desc: "Дикий женьшень из гор Чанбайшань пользуется необычайными ценами на китайских рынках. Маньчжурское государство полностью контролирует эту торговлю." #NT!
 nd_mch_niru_organization: "Военная организация Ниру" #NT!
 nd_mch_niru_organization_desc: "Система ниру объединяет маньчжурский народ в военно-административные роты по триста человек, образуя основу армий Знамени." #NT!
 nd_mch_border_market_diplomacy: "Дипломатия приграничного рынка" #NT!
 nd_mch_border_market_diplomacy_desc: "Торговые рынки в Фушуне, Кайюане и других приграничных городах служат как коммерческим обменом, так и местом дипломатических встреч между чжурчжэнями, монгольскими и китайскими купцами." #NT!
 nd_mch_bayara_guard: "Имперская Гвардия Баяра" #NT!
 nd_mch_bayara_guard_desc: "Баяра — элита армий Знамени, отборные воины, служащие личной охраной Хана, известные своей свирепостью в бою." #NT!
 nd_mch_manchu_script: "Маньчжурское письмо" #NT!
 nd_mch_manchu_script_desc: "Создание особой маньчжурской системы письма, адаптированной на основе монгольского письма, устанавливает литературную традицию, независимую от китайских иероглифов." #NT!
 nd_mch_karun_system: "Пограничная стража Карун" #NT!
 nd_mch_karun_system_desc: "Сеть пограничных постов Карун, укомплектованных солдатами Знамени, наблюдает за границей, контролируя передвижение и собирая разведданные." #NT!
 nd_mch_jianzhou_unification: "Объединение Цзяньчжоу" #NT!
 nd_mch_jianzhou_unification_desc: "Объединение племен Цзяньчжоу чжурчжэней под единым правящим домом создает политическую основу, на которой возникает маньчжурская нация." #NT!
 nd_mch_eight_banners: "Восемь баннеров" #NT!
 nd_mch_eight_banners_desc: "Восемь знамен (четыре простых, четыре с каймой, желтого, белого, красного и синего цветов) организуют всю маньчжурскую нацию в дисциплинированную военную и административную систему, не имеющую аналогов." #NT!
 nd_mch_banner_garrisons: "Баннерные гарнизоны" #NT!
 nd_mch_banner_garrisons_desc: "Гарнизоны постоянного знамени в стратегических городах поддерживают военную готовность Маньчжурии и одновременно обучают воинов следующего поколения." #NT!
 nd_mch_willow_palisade: "Уиллоу Палисейд" #NT!
 nd_mch_willow_palisade_desc: "Огромный земляной барьер из рвов, насыпей и ив отмечает границу маньчжурской родины, контролируя миграцию и защищая стратегическую глубину." #NT!
 nd_mch_hanjun_integration: "Интеграция баннера Ханджун" #NT!
 nd_mch_hanjun_integration_desc: "Китайские военные семьи, перешедшие на сторону маньчжуров, организованы в свои собственные знаменные роты, Ханьцзюнь, сочетающие маньчжурскую дисциплину с китайскими военными знаниями." #NT!
 nd_mch_tribute_system: "Система дани" #NT!
 nd_mch_tribute_system_desc: "Маньчжурское государство унаследовало и усовершенствовало систему дани, связывая вассальные государства посредством дипломатических ритуалов и обмена престижными товарами." #NT!
 nd_mch_seven_grievances: "Семь обид" #NT!
 nd_mch_seven_grievances_desc: "Провозглашение Нурхачи «Семи претензий к династии Мин» обеспечивает формальный повод для войны и сплачивает маньчжурскую нацию на пути завоевания." #NT!
 nd_mch_ujen_cooha_tradition: "Уджен Куха Тяжелая пехота" #NT!
 nd_mch_ujen_cooha_tradition_desc: "Уджен Куха, тяжелая бронетанковая пехота армий Знамени, сочетает в себе маньчжурскую боевую дисциплину с новейшей военной техникой." #NT!
 nd_mch_kangxi_reforms: "Реформы Канси" #NT!
 nd_mch_kangxi_reforms_desc: "Длительное правление императора Канси установило модель просвещенного абсолютизма, сочетающего конфуцианское управление с маньчжурской военной мощью." #NT!
 nd_mch_high_qing: "Высокий Цин" #NT!
 nd_mch_high_qing_desc: "Маньчжурская империя достигает своего территориального и демографического зенита: это самая многочисленная по населению и одна из величайших сухопутных империй, которые когда-либо видел мир." #NT!
 nd_mch_siku_quanshu: "Сику Цюаньшу" #NT!
 nd_mch_siku_quanshu_desc: "Полная библиотека четырех сокровищниц — крупнейший литературный сборник в истории Китая — сохраняет и систематизирует накопленные знания цивилизации." #NT!
 nd_mch_canton_system: "Кантонская система" #NT!
 nd_mch_canton_system_desc: "Внешняя торговля осуществляется через контролируемую систему назначенных портов и лицензированных торговцев, что позволяет максимизировать государственные доходы и одновременно управлять контактами с внешним миром." #NT!
 nd_mch_green_standard_legacy: "Зеленый Стандарт Наследие" #NT!
 nd_mch_green_standard_legacy_desc: "Армия Зеленого Стандарта дополняет силы Знамени китайскими войсками, организованными по маньчжурским военным линиям, что значительно расширяет военный потенциал империи." #NT!
 nd_mch_tongzhi_restoration: "Реставрация Тунчжи" #NT!
 nd_mch_tongzhi_restoration_desc: "Решительные усилия по восстановлению жизнеспособности маньчжурского управления посредством институциональной реформы и подавления восстания." #NT!
 nd_mch_self_strengthening: "Самоусиливающееся движение" #NT!
 nd_mch_self_strengthening_desc: "Принятие западных промышленных технологий при сохранении китайских ценностей и маньчжурского управления: «Китайское обучение для сути, западное обучение для практического применения»." #NT!
 nd_mch_beiyang_army: "Бэйянская армия" #NT!
 nd_mch_beiyang_army_desc: "Современная армия, обученная по западному образцу с немецкими инструкторами и оборудованием, представляет собой военное измерение усилий по самоусилению." #NT!
 nd_mch_manchurian_homeland: "Оборона Родины Маньчжурии" #NT!
 nd_mch_manchurian_homeland_desc: "Защита исконной маньчжурской родины от посягательств интересов русских, японских и китайских поселенцев." #NT!
 nd_mch_new_policies: "Новая политика" #NT!
 nd_mch_new_policies_desc: "Амбициозная программа реформ позднего периода Цин предусматривает создание современных школ, реорганизацию вооруженных сил и создание новых правительственных институтов по образцу конституционных монархий." #NT!
 a_nd_mch_bayara: "Баяра Страж" #NT!
 a_nd_mch_bayara_desc: "Баяра, «Доблестные воины», — элитная гвардейская кавалерия маньчжурского хана, отобранная из лучших всадников армий Знамени." #NT!
 a_nd_mch_meiren_cavalry: "Мейренская знамённая кавалерия" #NT!
 a_nd_mch_meiren_cavalry_desc: "Тяжелая кавалерия во главе с мейрен-и джангином, командирами полков Баннера, которые служат ударным оружием маньчжурского войска." #NT!
 a_nd_mch_ujen_cooha: "Уджен Куха" #NT!
 a_nd_mch_ujen_cooha_desc: "Тяжелая пехота армий Знамени, воины в доспехах, обученные как традиционному маньчжурскому бою, так и современному огнестрельному оружию." #NT!
 a_nd_mch_aha: "Ага слуги" #NT!
 a_nd_mch_aha_desc: "Кабальные слуги и слуги маньчжурских знатных семей, которые служат легкой пехотой в военное время и ценятся за свою выносливость в кампании." #NT!
 nd_mch_ginseng_post: "Торговый пост женьшеня" #NT!
 nd_mch_ginseng_post_desc: "Лицензированная торговая станция по переработке и продаже дикого маньчжурского женьшеня — одного из самых ценных лекарственных товаров в Восточной Азии." #NT!
 nd_mch_palisade_fort: "Форт Уиллоу Палисейд" #NT!
 nd_mch_palisade_fort_desc: "Укрепленная часть Ивового частокола, земляные насыпи, увенчанные переплетенными ивами, окруженные глубоким рвом, защищающие родину маньчжуров." #NT!
 nd_mch_banner_garrison: "Баннерный гарнизон" #NT!
 nd_mch_banner_garrison_desc: "Постоянный военный объект, в котором проживают солдаты Знамени и их семьи, служащий одновременно казармой и административным центром окружающего района." #NT!
 nd_mch_fur_workshop: "Меховая мастерская соболя" #NT!
 nd_mch_fur_workshop_desc: "Мастерская, специализирующаяся на выделке и обработке шкурок соболя, куницы и лисицы из маньчжурских лесов для торговли предметами роскоши." #NT!
 nd_mch_karun_post: "Пограничный пост Карун" #NT!
 nd_mch_karun_post_desc: "Пограничный пост, укомплектованный кавалерийскими патрулями Баннера, которые следят за пересечением границы и собирают информацию о передвижениях за частоколом." #NT!
 nd_mch_ginseng_processing: "Обработка женьшеня" #NT!
 nd_mch_ginseng_processing_desc: "Тщательная сушка, сортировка и сортировка корней дикого женьшеня для продажи китайским аптекарям." #NT!
 nd_mch_palisade_maintenance: "Обслуживание частокола" #NT!
 nd_mch_palisade_maintenance_desc: "Регулярный уход за Ивовым частоколом, пересадка ив, расчистка канав и ремонт насыпей." #NT!
 nd_mch_banner_training: "Баннерное обучение" #NT!
 nd_mch_banner_training_desc: "Строгий режим боевой подготовки гарнизонов Знамени, в котором упор делается на конную стрельбу из лука, бой на копьях и координацию действий подразделений." #NT!
 nd_mch_fur_curing: "Сушка меха" #NT!
 nd_mch_fur_curing_desc: "Сырые шкуры соболя, куницы и лисицы солят, вытягивают и коптят для получения тонкой выделанной кожи для торговли предметами роскоши." #NT!
 nd_mch_karun_patrol: "Карун Патруль" #NT!
 nd_mch_karun_patrol_desc: "Конные патрули располагаются вдоль границы между пограничными постами Карун, обеспечивая наблюдение и перехватывая несанкционированные пересечения границы." #NT!
 levy_nd_mch_meiren_cavalry: "Мейренский баннерный кавалерийский сбор" #NT!
 levy_nd_mch_meiren_cavalry_desc: "Знаменная кавалерия, собранная из дворянских и солдатских сословий, возглавляемая полковыми мейренскими командирами." #NT!
 levy_nd_mch_aha: "Ага, слуга Леви" #NT!
 levy_nd_mch_aha_desc: "Легкая пехота, набранная из кабальных слуг, прикрепленных к маньчжурским дворянским домам." #NT!
 nd_mch_formed_tt: "была образована Маньчжурия." #NT!
 nd_mch_path_a_tt: "Выбрать путь предков" #NT!
 nd_mch_path_b_tt: "Выбрали Трон Дракона" #NT!
 nd_mch_destiny: "Судьба Маньчжурии" #NT!
 nd_mch_destiny_desc: "Маньчжурский народ един под знаменами. Теперь необходимо ответить на великий вопрос: отправимся ли мы наружу как завоеватели степи или на юг, чтобы претендовать на Драконий Трон Китая?" #NT!
 nd_mch_dest_banner_supremacy: "Превосходство знамени" #NT!
 nd_mch_dest_banner_supremacy_desc: "Распространить военное господство Маньчжурии за пределы своей страны. Победите монгольские племена в Буир-Нууре и докажите, что армии Знамени — высшая сила в северной степи." #NT!
 nd_mch_dest_northern_khanate: "Северное ханство" #NT!
 nd_mch_dest_northern_khanate_desc: "Захватите Ургу, священное сердце Монголии, и установите маньчжурский сюзеренитет над северной степью. Создайте казну, поддерживающую континентальную империю." #NT!
 nd_mch_dest_steppe_apex: "Империя Степи" #NT!
 nd_mch_dest_steppe_apex_desc: "Протяните маньчжурское знамя от Кашгара до Лхасы, покорив оазисы Шелкового пути и Тибетское нагорье. Создайте величайшую империю Внутренней Азии со времен монголов." #NT!
 nd_mch_dest_dragon_capital: "Столица Дракона" #NT!
 nd_mch_dest_dragon_capital_desc: "Пересеките Ивовый частокол и захватите Даду, древнюю столицу северного Китая. Установите маньчжурское правление с Трона Дракона." #NT!
 nd_mch_dest_mandate_of_heaven: "Мандат Небес" #NT!
 nd_mch_dest_mandate_of_heaven_desc: "Получите Небесный Мандат посредством институционального мастерства и экономического роста. Развивайте империю за пределами ее военного происхождения с помощью банковского дела, торговли и бюрократического управления." #NT!
 nd_mch_dest_celestial_empire: "Поднебесная Империя" #NT!
 nd_mch_dest_celestial_empire_desc: "Завершите завоевание Китая, обеспечив безопасность Гуанчжоу и южных торговых сетей. Постройте самую богатую и развитую империю в мире." #NT!
 nd_mch.5.t: "Судьба Маньчжурии раскрывается" #NT!
 nd_mch.5.d: "После восстановления стабильности и гордо развевающихся знамен маньчжурская нация готова написать свою главу в истории. Фундамент заложен. Остается лишь желание опираться на них." #NT!
 nd_mch.5.a: "Наша судьба ждет." #NT!
 nd_mch.6.t: "Превосходство знамени" #NT!
 nd_mch.6.d: "Армии Знамени доказали свою эффективность против монгольских всадников у Буир-Нуура. Степь трепещет перед дисциплиной Восьми Знамен, и племена, когда-то совершавшие набеги на наши границы, теперь посылают послов с данью. Путь Предков был подтвержден завоеваниями." #NT!
 nd_mch.6.a: "Степь склоняется перед Знаменем." #NT!
 nd_mch.7.t: "Северное ханство" #NT!
 nd_mch.7.d: "С Ургой в наших руках Маньчжурское государство превратилось в верховную державу северной степи. Вопрос теперь в том, как консолидировать эту обширную территорию. Должны ли мы основать конные рынки вдоль границы, чтобы получить прибыль от торговли кочевников, или поставить гарнизоны на горных перевалах, чтобы создать неприступную северную оборону?" #NT!
 nd_mch.7.a: "Откройте конные рынки для всех желающих." #NT!
 nd_mch.7.b: "Укрепите проходы от всех угроз." #NT!
 nd_mch.8.t: "Империя Степи" #NT!
 nd_mch.8.d: "От гор Чанбайшаня до Памира, от замерзшего Амура до крыши мира маньчжурское знамя реет над величайшей империей Внутренней Азии со времен Чингисхана. Мы завоевали народы, которые сами монголы не смогли удержать. Теперь нам предстоит решить, как распорядиться этой силой: как неугомонные завоеватели, вечно ищущие новых горизонтов, или как вечные хранители созданного нами степного порядка." #NT!
 nd_mch.8.a: "Мы идем вперед." #NT!
 nd_mch.8.b: "Вечное знамя охраняет завоеванное." #NT!
 nd_mch.9.t: "Столица Дракона" #NT!
 nd_mch.9.d: "Даду пал перед армиями Знамени. Древняя столица северного Китая, резиденция Юаней и Мин до нас, теперь служит маньчжурской династии. Из Запретного города мы наблюдаем за цивилизацией сотен миллионов человек. Трон Дракона наш." #NT!
 nd_mch.9.a: "Мы правим с Трона Дракона." #NT!
 nd_mch.10.t: "Мандат Небес" #NT!
 nd_mch.10.d: "Империя выросла за пределы всего, что могли себе представить наши предки. Институты процветают, торговля протекает через тысячи рынков, а казна пополняется серебром. Мандат Неба не просто утверждается, но и демонстрируется посредством хорошего управления. Тем не менее, две философии управления конкурируют за наше внимание: должны ли мы построить более глубокую конфуцианскую бюрократию, чтобы объединить империю, или реформировать валюту, чтобы высвободить мощь торговли, основанной на серебре?" #NT!
 nd_mch.10.a: "Углубление конфуцианской бюрократии." #NT!
 nd_mch.10.b: "Установите серебряный стандарт." #NT!
 nd_mch.11.t: "Поднебесная Империя" #NT!
 nd_mch.11.d: "Гуанчжоу взят под контроль, а вместе с ним и последняя жемчужина китайской торговой сети. Поднебесная простирается от лесов Маньчжурии до дельты Жемчужной реки, охватывая самую богатую и густонаселенную цивилизацию на земле. Теперь возникают два видения того, как этот колосс будет взаимодействовать с более широким миром: построим ли мы военно-морской флот, чтобы проецировать нашу мощь через моря, или обратимся внутрь себя, чтобы консолидировать это огромное господство в непоколебимое целое?" #NT!
 nd_mch.11.a: "Стройте флоты Поднебесной." #NT!
 nd_mch.11.b: "Консолидируйте империю изнутри." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_horse_markets: "Кочевые конные рынки" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_horse_markets: "Приграничные конные рынки направляют богатства степной торговли через контролируемые маньчжурами биржи, обогащая лордов Знамени и одновременно снижая стоимость их кавалерии." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_garrison_passes: "Гарнизон перевалов" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_garrison_passes: "Горные перевалы и переправы через реки северной степи укреплены и снабжены гарнизонами, создавая неприступную оборонительную сеть, контролируемую офицерами разведки." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_conquerors_march: "Марш завоевателя" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_conquerors_march: "Армии Знамени маршируют с неумолимой скоростью лавины, их линии снабжения простираются через континенты. Цена этого бесконечного расширения – пренебрежение морскими проблемами." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_eternal_banner: "Вечное знамя" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_eternal_banner: "Восемь Знамен являются вечными стражами степного порядка, проецируя власть Маньчжурии посредством быстрых решительных действий и престижа непобедимости." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_confucian_bureau: "Конфуцианская бюрократия" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_confucian_bureau: "Обширный аппарат ученых-чиновников управляет империей на основе конфуцианских принципов, объединяя различные народы общей административной культурой." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_silver_standard: "Серебряный стандарт" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_silver_standard: "Экономика империи реформируется вокруг серебряной валюты, стабилизации цен и укрепления торговых сетей за счет дорогостоящих профессиональных солдат." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_maritime_projection: "Морская проекция" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_maritime_projection: "Поднебесная строит флот, достойный величайшей цивилизации мира, проецируя мощь через моря для защиты торговых путей и утверждения суверенитета над прибрежными водами." #NT!
 STATIC_MODIFIER_NAME_nd_mch_dest_imperial_consolidation: "Имперская Консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_mch_dest_imperial_consolidation: "Империя обращается внутрь себя, чтобы усовершенствовать свое управление. Религиозная толерантность и военная модернизация связывают королевство воедино, в то время как устойчивое управление снижает самоуспокоенность процветания." #NT!
 nd_mch_horse_stud: "Баннерная конюшня" #NT!
 nd_mch_horse_stud_desc: "Государственный племенной завод, производящий выносливых степных лошадей, которые развозят знаменную конницу по обширным территориям Маньчжурской империи." #NT!
 nd_mch_horse_breeding: "Коневодство" #NT!
 nd_mch_horse_breeding_desc: "Систематическое разведение маньчжурских боевых коней, сочетающее выносливость степного поголовья с тщательным отбором на силу и выносливость." #NT!
 nd_mch_exam_hall: "Императорский экзаменационный зал" #NT!
 nd_mch_exam_hall_desc: "Большой зал, где кандидаты сдают экзамены на имперскую государственную службу, ворота к официальному назначению в огромной бюрократии Цин." #NT!
 nd_mch_examination_admin: "Экзаменационная администрация" #NT!
 nd_mch_examination_admin_desc: "Подготовка, печать и безопасное проведение экзаменов на государственную службу, требующие огромного количества бумаги, справочных текстов и официальной мантии." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_mch_bureaucracy_authority: "Имперский двойной аппарат" #NT!
 AUTO_MODIFIER_DESC_nd_mch_bureaucracy_authority: "Айсин-Гиоро создали маньчжурский административный аппарат параллельно унаследованным ханьским министерствам. Баннеры, Департамент императорского двора и Лифан Юань подчиняются непосредственно трону, предоставляя два дополнительных бюрократических места." #NT!
  
 mch_eight_banners_bureaucracy: "Восемь баннеров" #NT!
 mch_eight_banners_bureaucracy_desc: "Система джакун-гуса, систематизированная Нурхачи в 1615 году, организовала всех маньчжурских, монгольских и завоеванных ханьских знаменосцев в наследственные солдатские семьи, сгруппированные под двадцатью четырьмя знаменами. Регистрация знамени предусматривала земельные наделы, стипендии, судебное отделение от ханьского гражданского населения и обязанность служить. Знамена были одновременно кастовой армией династии, ее переписью населения и инструментом сохранения завоевательного меньшинства отдельно от покоренного китайского большинства." #NT!
  
 mch_neiwufu_bureaucracy: "Департамент императорского двора" #NT!
 mch_neiwufu_bureaucracy_desc: "Нэйуфу, укомплектованный слугами Айсин-Гиоро (буи), набираемыми из трех верхних знамен, располагался во внутреннем дворе параллельно и структурно над Советами Хань Шесть. Он управлял Запретным городом, императорскими мастерскими, личным кошельком, соляной монополией Янчжоу и торговым лицензированием кантона Хун: частным финансовым учреждением, которое действовало в обход Министерства доходов и подчинялось только императору. При Канси и Цяньлуне она превратилась в самую могущественную ветвь столичной администрации." #NT!
  
 mch_lifan_yuan_bureaucracy: "Лифан Юань" #NT!
 mch_lifan_yuan_bureaucracy_desc: "Суд по колониальным делам, созданный в 1638 году и возведенный в ранг министерства в 1644 году, управлял неханьскими подданными династии: Халхинским и Внутреннемонгольским союзами, Тибетом под властью Далай-ламы и Панчен-лам, Таримским и Зунгарским оазисами, завоеванными в 1759 году, а также Кяхтинской границей с Россией. Оно обеспечивало соблюдение монгольского дворянского реестра, контролировало выплаты патронажа ламаистам и вело имперскую пограничную дипломатию полностью вне ханьской министерской структуры." #NT!
  
 mch_grand_council_bureaucracy: "Большой Совет" #NT!
 mch_grand_council_bureaucracy_desc: "Император Юнчжэн создал Цзюньцзи Чу в 1729 году как небольшой секретный военный совет, чтобы обойти Большой секретариат во время джунгарских кампаний. Он превратился в центральный орган принятия решений Цин: горстка принцев и доверенных ханьских чиновников читала дворцовые мемориалы, составляла ярко-красные рескрипты и подписывала волю императора в соответствии с политикой без записей в государственных архивах. Его члены не имели формального портфеля, а только пользовались доверием императора." #NT!
  
 mch_banner_garrisons_bureaucracy: "Баннерные гарнизоны" #NT!
 mch_banner_garrisons_bureaucracy_desc: "После 1644 года династия расквартировала восьмизнаменные гарнизоны в стратегических точках завоеванной территории Мин: обнесенных стеной городов-знамён (Маньчэн) в Пекине, Сиане, Ханчжоу, Нанкине, Цзинчжоу, Гуанчжоу и в центре Маньчжурии. Чжуфан Баки укрепил власть династии над ханьским большинством и держал знаменосцев в социальном отношении (отдельные юрисдикции, отдельные языковые школы, отдельные брачные объединения) в течение двух с половиной столетий." #NT!
  
 mch_marriage_alliance_bureaucracy: "Хорчинский Брачный Союз" #NT!
 mch_marriage_alliance_bureaucracy_desc: "Династические браки, связывающие Айсин-Горо с Хорчинами и другими княжескими домами Восточной Монголии, закрепленные в хешигах императорских супруг и внебрачных браках монгольских принцесс, начиная с Хун Тайцзи. Императрица Сяочжуан, принцесса Хорчина, олицетворяла эту систему: каждый император Цин до Цяньлуна воспитывался вдовствующей императрицей монгольской крови, а монгольская знать сидела в императорской гвардии и Лифан Юань как родственники, а не подданные." #NT!
