l_russian:
 STATIC_MODIFIER_NAME_nd_sultan_of_two_seas: "Султан двух морей" #NT!
 STATIC_MODIFIER_DESC_nd_sultan_of_two_seas: "Как Алаеддин Кейкубат когда-то правил от Средиземного до Черного моря, так и Султанат Рум будет распространять свою власть на оба побережья Анатолии. Наша кавалерия пронесется по плато, а наши галеры будут господствовать над проливами." #NT!
 STATIC_MODIFIER_NAME_nd_crossroads_of_civilizations: "Перекресток цивилизаций" #NT!
 STATIC_MODIFIER_DESC_nd_crossroads_of_civilizations: "Анатолия всегда стояла на стыке Востока и Запада. Султанат Рум должен принять это наследие, приветствуя купцов со всех стран и ученых всех традиций, создавая царство, где торговля и культура процветают вместе." #NT!
 STATIC_MODIFIER_NAME_nd_rum_ahi_revival: "Возрождение Братства Ахи" #NT!
 STATIC_MODIFIER_DESC_nd_rum_ahi_revival: "Гильдии Ахи возродились, их мастерские работали продуктивно, а принципы честной торговли и взаимопомощи распространились по городам Анатолии." #NT!
 STATIC_MODIFIER_NAME_nd_rum_mevlana_legacy: "Наследие Мевланы" #NT!
 STATIC_MODIFIER_DESC_nd_rum_mevlana_legacy: "Учение Мевланы Руми эхом разносится по текке и медресе Рума, вдохновляя терпимость и духовную глубину, которые привлекают искателей со всего исламского мира." #NT!
 nd_rum.1.t: "Султанат восстановлен" #NT!
 nd_rum.1.d: "Знамя Сельджуков вновь реет над сердцем Анатолии. Там, где когда-то дюжина бейликов ссорилась из-за останков старого султаната, теперь один государь подчиняется всем тюркским правителям от Черного моря до Средиземного. Караван-сараи, расположенные вдоль древних дорог, готовы передать богатство народов, в то время как кавалерия гуламов, которая когда-то ехала на стороне султана, ожидает призыва нового хозяина.\n\nТеперь вопрос в том, каким царством станет этот восстановленный султанат. Последует ли он по пути воинов-султанов, которые когда-то заставили дрожать крестоносцев и бежать византийцев, проецируя военную мощь через два моря? Или он примет свою судьбу как великий перекресток цивилизации, где персидская поэзия, греческая философия и тюркская доблесть встречаются на базарах и медресе Коньи и Кайсери?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rum.1.a: "Мы – Султан Двух Морей!" #NT!
 nd_rum.1.b: "Мы – перекресток цивилизаций!" #NT!
 nd_rum.2.t: "Возрождение Братства Ахи" #NT!
 nd_rum.2.d: "Мастерские наших городов ожили с духом, невиданным со времен самого Ахи Эврана. Братства Ахи, те замечательные гильдии, которые сочетали суфийскую преданность с честным мастерством, реорганизовались под нашим патронажем. От кожевников до медников, от ткачей до кузнецов — ремесленники Анатолии связывают себя клятвами братства, честности и взаимопомощи. Их завие служат гостиницами для путешественников, их советы разрешают споры, не обращаясь в суд, а их молодые ученики обучаются как оружию, так и ремеслу, готовые защищать города, которые их поддерживают." #NT!
 nd_rum.2.a: "Пусть гильдии процветают под нашей защитой." #NT!
 nd_rum.2.b: "Пусть братства объединят наши сообщества." #NT!
 nd_rum.3.t: "Кружащиеся дервиши Коньи" #NT!
 nd_rum.3.d: "В текке в Конье последователи Мевланы Джалалуддина Руми продолжают возвышенную практику сема: кружащийся танец, который приближает преданного к божественному. Орден Мевлеви стал духовным сердцем нашего государства, привлекая поэтов, ученых и мистиков со всего исламского мира. Их послание всеобщей любви и терпимости смягчило остроту межконфессионального конфликта и вдохновило на расцвет персидской литературы и музыки, которые принесли престиж Султанату Рум далеко за пределы того, чего могли бы достичь одни лишь армии." #NT!
 nd_rum.3.a: "Дервиши приносят в наше царство мудрость и гармонию." #NT!
 nd_rum.3.b: "Их библиотеки и школы — настоящее сокровище." #NT!
 nd_rum.4.t: "Верфи двух морей" #NT!
 nd_rum.4.d: "Огромная верфь в Аланье, высеченная в скале полуострова Красная Башня, снова раздается эхом молотка и пилы. Это замечательное сооружение с пятью сводчатыми галереями, открытыми к морю, построенное султаном Алаеддином Кейкубатом для распространения власти сельджуков по всему Средиземноморью, теперь спускает на воду суда, несущие наш флаг. Вместе с военно-морскими базами в Синопе на Черном море наше царство контролирует береговые линии, которые древние сельджукские султаны называли своими владениями-близнецами. Султан двух морей больше не является просто титулом." #NT!
 nd_rum.4.a: "Наши галеры будут господствовать на обоих морях." #NT!
 nd_rum_ghulam_tradition: "Гуламская кавалерийская традиция" #NT!
 nd_rum_ghulam_tradition_desc: "Сельджукская практика подготовки элитных солдат-рабов, гуламов, в дисциплинированную кавалерию, лояльную только султану. Набранные из пленных юношей и обученные верховой езде и бою, эти воины составляли костяк королевской гвардии Сельджуков." #NT!
 nd_rum_caravanserai_network: "Сеть Караван-сараев" #NT!
 nd_rum_caravanserai_network_desc: "Сельджуки построили по всей Анатолии более сотни караван-сараев, расположенных на расстоянии одного дня пути по торговым путям. Эти укрепленные перевалочные пункты предлагали всем путешественникам бесплатное жилье, еду и медицинскую помощь в течение трех дней: замечательная система торговой инфраструктуры." #NT!
 nd_rum_turkmen_raiders: "Туркменские рейдеры" #NT!
 nd_rum_turkmen_raiders_desc: "Полукочевые туркменские племена, составившие авангард сельджукской экспансии. Быстрые, бесстрашные и владеющие тактикой «нападай и беги», они служили пограничными рейдерами и разведчиками султаната." #NT!
 nd_rum_iqta_system: "Система предоставления земли Икта" #NT!
 nd_rum_iqta_system_desc: "Сельджукская система предоставления прав на получение земельных участков военным командирам в обмен на кавалерийскую службу. Такая договоренность, подобная тимару, обеспечивала готовую поставку конных воинов без содержания постоянной постоянной армии." #NT!
 nd_rum_medrese_foundations: "Фонды Медресе" #NT!
 nd_rum_medrese_foundations_desc: "Великие медресе Коньи, Кайсери и Сиваса, исламские учебные заведения, которые сохраняли и передавали знания в области теологии, права, медицины и математики во время золотого века сельджуков." #NT!
 nd_rum_seljuk_bureaucracy: "Сельджукская административная традиция" #NT!
 nd_rum_seljuk_bureaucracy_desc: "Бюрократическая система под влиянием Персии, унаследованная от империи Великих Сельджуков, с ее советами диванов, визирями и структурами провинциального управления, которые поддерживали порядок среди разнообразного населения Анатолии." #NT!
 nd_rum_uc_beyleri: "Фронтир Бейлик Уорриорз" #NT!
 nd_rum_uc_beyleri_desc: "Ук бейлери, пограничные лорды, которые содержали гарнизоны вдоль византийской границы. Их воины, закаленные в постоянных перестрелках, служили первой линией обороны и острием экспансии." #NT!
 nd_rum_ahi_guilds: "Гильдии Братства Ахи" #NT!
 nd_rum_ahi_guilds_desc: "Замечательные братства Ахи, сочетавшие суфийскую духовность с ремесленным мастерством. Основанные Ахи Эвраном в 13 веке, эти гильдии организовывали ремесленников, регулировали торговлю, предоставляли социальные услуги и даже содержали вооруженные отряды для защиты городов." #NT!
 nd_rum_alanya_shipyard: "Верфь Аланьи" #NT!
 nd_rum_alanya_shipyard_desc: "Большой военно-морской арсенал в Аланье, построенный в 1227 году султаном Алаеддином Кейкубатом. Пять сводчатых галерей, высеченных на скалистом полуострове под Красной башней, позволяли строить корабли и спускать их прямо в Средиземное море." #NT!
 nd_rum_mevlevi_order: "Орден Мевлеви" #NT!
 nd_rum_mevlevi_order_desc: "Суфийский орден, основанный последователями Мевланы Джалалуддина Руми в Конье. Мевлеви, известные своей кружащейся церемонией дервишей (сема), стали одним из самых влиятельных духовных движений в исламском мире." #NT!
 nd_rum_darussifa: "Дарюшшифа Традиция" #NT!
 nd_rum_darussifa_desc: "Сельджукская традиция строить больницы (дарушшифас) при комплексах мечетей. Эти учреждения предоставляли медицинскую помощь всем, независимо от веры и богатства, а также расширяли медицинские знания посредством практического лечения." #NT!
 nd_rum_persian_court: "Турецко-персидская придворная культура" #NT!
 nd_rum_persian_court_desc: "Утонченная придворная культура Султаната Рум, где персидский язык был языком поэзии и управления, арабский язык религии, а турецкий язык военных: трехъязычная цивилизация поразительной сложности." #NT!
 nd_rum_silk_trade: "Анатолийская торговля шелком" #NT!
 nd_rum_silk_trade_desc: "Производство и торговля шелком процветали в Анатолии под покровительством Сельджуков, при этом Бурса и другие города стали крупными центрами шелководства, снабжавшего рынки по всему Средиземноморью." #NT!
 nd_rum_sipahi_tradition: "Сипахи Кавалерия" #NT!
 nd_rum_sipahi_tradition_desc: "Профессиональные кавалерийские силы, поддерживаемые системой предоставления земель Тимару. Сипаи были обязаны содержать лошадей, снаряжение и слуг в обмен на доходы от закрепленных за ними земель: феодальная военная система, которая производила грозных конных воинов." #NT!
 nd_rum_composite_bowmen: "Композитный лук Традиция" #NT!
 nd_rum_composite_bowmen_desc: "Тюркское мастерство владения составным луком: оружием из рога, дерева и сухожилий, которым можно было пользоваться верхом или пешком. Эта традиция превосходной стрельбы из лука дала анатолийским армиям решающее преимущество на расстоянии." #NT!
 nd_rum_grand_bazaar: "Гранд Базар" #NT!
 nd_rum_grand_bazaar_desc: "Крытые рынки великих анатолийских городов, где сотни магазинов предлагали товары со всего известного мира. Эти шумные коммерческие центры служили экономическим центром султаната." #NT!
 nd_rum_dhimmi_tolerance: "Терпимость к зимми" #NT!
 nd_rum_dhimmi_tolerance_desc: "Сельджукская политика относительной терпимости к христианским, еврейским и другим немусульманским общинам. Греческие ремесленники, армянские купцы и грузинские солдаты нашли свое место в разнообразном обществе султаната." #NT!
 nd_rum_carpet_production: "Анатолийская ковровая традиция" #NT!
 nd_rum_carpet_production_desc: "Отличительные традиции ковроткачества в Анатолии, в которых сочетались узоры кочевников Центральной Азии с устоявшимися мастерскими техниками для создания одних из самых ценных тканей в мире." #NT!
 nd_rum_anatolian_fortresses: "Анатолийская крепостная традиция" #NT!
 nd_rum_anatolian_fortresses_desc: "Сеть замков и укреплений, построенных по гористой местности Анатолии, от цитаделей Анкары и Коньи до прибрежных крепостей в Аланье и Синопе." #NT!
 nd_rum_port_system: "Система двух морских портов" #NT!
 nd_rum_port_system_desc: "Развитие портовых сооружений как на средиземноморском, так и на черноморском побережьях, реализация амбиций сельджуков стать султаном двух морей и контроль морской торговли вдоль обоих берегов." #NT!
 nd_rum_azab_levies: "Азаб Легкая пехота" #NT!
 nd_rum_azab_levies_desc: "Легкая вспомогательная пехота, набранная из крестьянского населения, азабы служила гарнизонными войсками, вспомогательными осадными войсками и расходным материалом для более ценной кавалерии. Их большая численность компенсировала меньшее оснащение." #NT!
 nd_rum_gunpowder_adoption: "Пороховой арсенал" #NT!
 nd_rum_gunpowder_adoption_desc: "Создание арсеналов по производству и хранению порохового оружия (пушек, бомбард, а затем и огнестрельного оружия) ознаменовало переход от чисто кавалерийской войны к общевойсковой тактике." #NT!
 nd_rum_trade_insurance: "Система торгового страхования" #NT!
 nd_rum_trade_insurance_desc: "Сельджукское нововведение – государственное торговое страхование, при котором казначейство компенсировало торговцам товары, потерянные в результате бандитизма или несчастного случая на дороге. Эта замечательная система способствовала торговле на дальние расстояния за счет снижения риска." #NT!
 nd_rum_copper_works: "Анатолийский медный завод" #NT!
 nd_rum_copper_works_desc: "Эксплуатация богатых медных месторождений Анатолии, особенно в окрестностях Кастамону и Токата, которые служили сырьем для самобытной сельджукской традиции металлообработки - гравированных медных сосудов и декоративного искусства." #NT!
 nd_rum_waqf_system: "Система пожертвований вакфа" #NT!
 nd_rum_waqf_system_desc: "Система благотворительных пожертвований (вакуфов), которая финансировала медресе, больницы, караван-сараи и столовые. Эти благочестивые фонды обеспечивали стабильный источник дохода для государственных учреждений, находящихся вне прямого контроля государства." #NT!
 nd_rum_akinci_raiders: "Акинджи Рейдерс" #NT!
 nd_rum_akinci_raiders_desc: "Акинчи, нерегулярная легкая кавалерия, служившая авангардом и рейдовой силой Султаната. Действуя впереди основной армии, они разведывали территорию противника, нарушали линии снабжения и сеяли ужас посредством быстрых и разрушительных рейдов." #NT!
 nd_rum_imperial_administration: "Императорская администрация" #NT!
 nd_rum_imperial_administration_desc: "Централизация управления провинцией под руководством назначенных чиновников, замена полуавтономной системы бейликов более унифицированной административной структурой, подходящей для империи." #NT!
 nd_rum_nizam_troops: "Низам-и Джедид" #NT!
 nd_rum_nizam_troops_desc: "«Новый порядок» — дисциплинированная пехота, обученная по западноевропейским образцам, оснащенная современным огнестрельным оружием и строевой подготовкой. Эта реформа была направлена ​​на создание профессиональной постоянной армии для замены все более ненадежных традиционных сил." #NT!
 nd_rum_state_manufactories: "Государственные мануфактуры" #NT!
 nd_rum_state_manufactories_desc: "Централизованные производственные предприятия, созданные под руководством государства, производящие текстиль, оружие и другие товары как для внутреннего потребления, так и на экспорт: ранняя попытка индустриализации под руководством государства." #NT!
 nd_rum_tax_reform: "Централизованная налоговая реформа" #NT!
 nd_rum_tax_reform_desc: "Отмена откупов и установление прямого сбора налогов служащими, увеличение государственных доходов и уменьшение эксплуатации крестьян промежуточными сборщиками налогов." #NT!
 nd_rum_mohair_industry: "Ангора Мохер Индустрия" #NT!
 nd_rum_mohair_industry_desc: "Переработка мохера ангорских коз, обитающих в центральной Анатолии: роскошное волокно, которое ценится во всей Европе за свой блестящий блеск и мягкость и является прибыльным экспортным товаром." #NT!
 nd_rum_naval_modernization: "Модернизация ВМФ" #NT!
 nd_rum_naval_modernization_desc: "Модернизация военно-морских возможностей Султаната, опирающаяся на сельджукские традиции верфей Аланьи и Синопа, для создания флота, способного проецировать мощь в Средиземноморье." #NT!
 nd_rum_xebec_fleet: "Шебекский флот" #NT!
 nd_rum_xebec_fleet_desc: "Принятие на вооружение «Шебека»: быстрого средиземноморского судна с латинским парусным вооружением, идеально подходящего как для торговых рейдов, так и для прибрежного патрулирования. Легкие и маневренные шебеки могли обогнать более тяжелые европейские военные корабли." #NT!
 nd_rum_modern_army: "Современная анатолийская армия" #NT!
 nd_rum_modern_army_desc: "Окончательное преобразование вооруженных сил Султаната в современные силы с профессиональными офицерами, стандартизированным оборудованием и современной тактикой, заменяющими последние остатки средневековой военной традиции." #NT!
 nd_rum_anatolian_railways: "Анатолийская железная дорога" #NT!
 nd_rum_anatolian_railways_desc: "Строительство железнодорожных линий, соединяющих города Анатолии, связывающих королевство железными рельсами и обеспечивающих быстрое перемещение войск и товаров через плато." #NT!
 nd_rum_constitutional_reform: "Конституционная реформа" #NT!
 nd_rum_constitutional_reform_desc: "Введение конституционных принципов, ограничивающих королевскую власть и создание консультативных органов: модернизирующая реформа, направленная на укрепление государства посредством совместного управления." #NT!
 nd_rum_conscription: "Всеобщая воинская повинность" #NT!
 nd_rum_conscription_desc: "Введение обязательной военной службы для всех подданных мужского пола, создание массовой армии, которая будет опираться на все население, а не полагаться только на профессиональных солдат и феодальные поборы." #NT!
 nd_rum_national_awakening: "Анатолийское национальное пробуждение" #NT!
 nd_rum_national_awakening_desc: "Появление современного национального сознания среди народов Анатолии, движимое печатным станком, государственным образованием и растущим чувством общей идентичности, выходящим за рамки племенной и региональной лояльности." #NT!
 nd_rum_anatolian_mining: "Анатолийская горнодобывающая промышленность" #NT!
 nd_rum_anatolian_mining_desc: "Промышленная эксплуатация минеральных богатств Анатолии: месторождений хромитов, железа и меди, которые станут стратегически важными ресурсами в эпоху современной промышленности." #NT!
 a_nd_rum_ghulam: "Гуламская кавалерия" #NT!
 a_nd_rum_ghulam_desc: "Элитная рабская конница, верная только султану. Захваченные в юношестве и с детства обученные верховой езде и бою, гуламы составляли самую дисциплинированную и надежную кавалерийскую силу в армии сельджуков." #NT!
 a_nd_rum_turkmen_raider: "Туркменский рейдер" #NT!
 a_nd_rum_turkmen_raider_desc: "Полукочевая туркменская легкая конница, мастера степных разбойнических традиций. Быстрые, неуловимые и опытные всадники, они нападают без предупреждения и исчезают прежде, чем враг успевает ответить." #NT!
 a_nd_rum_uc_warrior: "Ук Воин" #NT!
 a_nd_rum_uc_warrior_desc: "Пехота пограничного гарнизона на пограничном марше (ук). Закаленные в постоянных столкновениях с войсками Византии и крестоносцев, эти воины выносливы, находчивы и привыкли сражаться с превосходящими силами." #NT!
 n_nd_rum_seljuk_galley: "Сельджукская военная галера" #NT!
 n_nd_rum_seljuk_galley_desc: "Тяжелая военная галера, построенная в традициях верфи Аланьи. Эти суда, более прочные и быстрые, чем стандартные галеры, несут знамя султана через Средиземное и Черное моря." #NT!
 a_nd_rum_sipahi: "Сипахи" #NT!
 a_nd_rum_sipahi_desc: "Профессиональная тяжелая кавалерия, поддерживаемая системой предоставления земель Тимару. У каждого сипаха есть свои боевые кони, оружие и слуги: феодальный рыцарь тюркского мира, грозный как в ударной атаке, так и в преследовании." #NT!
 a_nd_rum_composite_archer: "Композитный лук-лучник" #NT!
 a_nd_rum_composite_archer_desc: "Пехота, вооруженная мощным тюркским составным луком, способным давать разрушительные залпы на дистанциях, с которыми с трудом могут сравниться европейские арбалетчики. Их высокая скорострельность и мобильность делают их смертоносными на открытой местности." #NT!
 a_nd_rum_azab: "Азаб" #NT!
 a_nd_rum_azab_desc: "Легкая вспомогательная пехота, набранная из крестьянского населения. Несмотря на легкое оснащение, азабы служат расходными щитами, гарнизонными войсками и осадными работниками, освобождая профессиональную кавалерию для решающих сражений." #NT!
 a_nd_rum_akinci: "Акинджи Рейдер" #NT!
 a_nd_rum_akinci_desc: "Нерегулярная легкая кавалерия, которая движется впереди основной армии, совершая набеги вглубь территории противника. Их скорость, свирепость и умение жить за счет земли делают их ужасом для приграничного населения и проклятием вражеской логистики." #NT!
 a_nd_rum_nizam: "Низам-и Джедид" #NT!
 a_nd_rum_nizam_desc: "Солдаты Нового Порядка, дисциплинированная пехота, обученная тактике европейского образца, оснащенная современными мушкетами и штыками. Они представляют собой острие военной реформы в Султанате." #NT!
 n_nd_rum_xebec: "Шебек" #NT!
 n_nd_rum_xebec_desc: "Быстрое средиземноморское судно с латинским вооружением, одинаково подходящее для торговых рейдов и военно-морского патрулирования. Легкий и маневренный, шебек может обогнать большинство военных кораблей и победить большинство торговых судов." #NT!
 a_nd_rum_modern_infantry: "Современная анатолийская пехота" #NT!
 a_nd_rum_modern_infantry_desc: "Профессиональные солдаты современного Султаната, вооруженные нарезными мушкетами и обученные современной европейской тактике. Кульминация десятилетий военной реформы." #NT!
 a_nd_rum_conscript: "Анатолийский призывник" #NT!
 a_nd_rum_conscript_desc: "Солдаты, набранные со всей Анатолии по всеобщей воинской повинности. Хотя они менее опытны, чем профессиональные войска, их численность и боевой дух делают их грозной силой." #NT!
 nd_rum_caravanserai: "Караван-сарай" #NT!
 nd_rum_caravanserai_desc: "Укрепленная придорожная гостиница, предлагающая кров, еду и медицинскую помощь проходящим торговцам и путешественникам. Сельджуки построили более сотни таких домов по всей Анатолии, каждый из которых находился на расстоянии одного дня пути друг от друга." #NT!
 nd_rum_medrese: "Медресе" #NT!
 nd_rum_medrese_desc: "Исламское высшее учебное заведение, преподающее теологию, право, медицину и математику. Великие медресе Коньи и Кайсери были известными научными центрами средневекового исламского мира." #NT!
 nd_rum_ahi_guild_hall: "Зал гильдии Ахи" #NT!
 nd_rum_ahi_guild_hall_desc: "Зал собраний и мастерская братства Ахи, частично зал гильдии, частично суфийская ложа, частично оружейный склад. Здесь ремесленники учатся своему ремеслу, разрешают споры и поддерживают социальную структуру города." #NT!
 nd_rum_bazaar: "Гранд Базар" #NT!
 nd_rum_bazaar_desc: "Крытый рынок, где сотни магазинов предлагают товары со всего мира. Экономический центр города, где шелк, специи, медь и ковры отвечают кошельку покупателя." #NT!
 nd_rum_port_warehouse: "Портовый склад" #NT!
 nd_rum_port_warehouse_desc: "Береговые склады и причалы, поддерживающие морскую торговлю Султаната. Товары загружаются и разгружаются под присмотром капитана порта." #NT!
 nd_rum_arsenal: "Пороховой арсенал" #NT!
 nd_rum_arsenal_desc: "Военный объект по производству и хранению пушек, мушкетов и пороха. Арсенал знаменует собой переход к современной войне в Султанате." #NT!
 nd_rum_manufactory: "Государственная мануфактура" #NT!
 nd_rum_manufactory_desc: "Государственное предприятие по производству текстиля, металлических изделий и других товаров для внутреннего использования и экспорта." #NT!
 nd_rum_railway_station: "Железнодорожная станция" #NT!
 nd_rum_railway_station_desc: "Станция на новых железнодорожных линиях, связывающих города Анатолии. Железные рельсы несут товары, солдат и идеи по плато с беспрецедентной скоростью." #NT!
 nd_caravanserai_upkeep: "Содержание караван-сарая" #NT!
 nd_caravanserai_upkeep_desc: "Предоставление еды, фуража и приюта торговцам и их животным в придорожной гостинице сельджуков." #NT!
 nd_medrese_upkeep: "Содержание Медресе" #NT!
 nd_medrese_upkeep_desc: "Обеспечение исламского образовательного учреждения бумагой, книгами и научными материалами." #NT!
 nd_ahi_guild_upkeep: "Производство Зала Гильдии" #NT!
 nd_ahi_guild_upkeep_desc: "Ремесленники Ахи ткут из шерсти с тонкими красками окрашенную ткань, следуя традициям гильдии Ахи Эврана." #NT!
 nd_darussifa_upkeep: "Содержание больницы" #NT!
 nd_darussifa_upkeep_desc: "Содержание сельджукской больницы медикаментами, медицинскими материалами и глиняной посудой для фармакологических препаратов." #NT!
 nd_bazaar_upkeep: "Содержание базара" #NT!
 nd_bazaar_upkeep_desc: "Обслуживание крытых залов и торговых прилавков большого базара." #NT!
 nd_port_warehouse_upkeep: "Содержание портового склада" #NT!
 nd_port_warehouse_upkeep_desc: "Поддержание прибрежной торговой инфраструктуры лесом и военно-морскими поставками." #NT!
 nd_arsenal_upkeep: "Содержание Арсенала" #NT!
 nd_arsenal_upkeep_desc: "Производство и хранение оружия, пушек и военных товаров." #NT!
 nd_manufactory_upkeep: "Содержание мануфактуры" #NT!
 nd_manufactory_upkeep_desc: "Управление государственной мануфактурой по производству текстиля и металлоконструкций." #NT!
 nd_railway_upkeep: "Содержание железных дорог" #NT!
 nd_railway_upkeep_desc: "Содержание железных рельсов, деревянных шпал и станционной инфраструктуры." #NT!
 nd_rum_silk_weaving: "Шелковое Ткачество" #NT!
 nd_rum_silk_weaving_desc: "Знаменитая шелковая традиция Бурсы: плетение роскошных тканей из сырого шелка с использованием тонких красителей." #NT!
 nd_rum_carpet_weaving: "Ковроткачество" #NT!
 nd_rum_carpet_weaving_desc: "Анатолийская традиция ручного плетения шерстяных ковров со сложными геометрическими узорами." #NT!
 nd_rum_copper_smelting: "Медеплавильное производство" #NT!
 nd_rum_copper_smelting_desc: "Переплавка медной руды из богатых месторождений полезных ископаемых Анатолии в рафинированный металл." #NT!
 nd_rum_mohair_processing: "Обработка мохера" #NT!
 nd_rum_mohair_processing_desc: "Переработка шерсти ангорских коз с шелком в блестящие ткани из мохера, ценимые во всей Европе." #NT!
 nd_rum_chromite_mining: "Хромитовая добыча" #NT!
 nd_rum_chromite_mining_desc: "Добыча хромитовой руды из высокогорных месторождений Анатолии для промышленного использования." #NT!
 STATIC_MODIFIER_NAME_nd_rum_guild_solidarity: "Гильдейская солидарность" #NT!
 STATIC_MODIFIER_DESC_nd_rum_guild_solidarity: "Братства Ахи ​​объединяют сообщества посредством совместного ремесла, взаимопомощи и вооруженной гражданской обороны: сеть солидарности, которая укрепляет социальную структуру королевства." #NT!
 STATIC_MODIFIER_NAME_nd_rum_mevlevi_scholarship: "Стипендия Мевлеви" #NT!
 STATIC_MODIFIER_DESC_nd_rum_mevlevi_scholarship: "Библиотеки и школы Мевлеви привлекают ученых и поэтов со всего исламского мира, что делает Султанат центром обучения и художественных достижений." #NT!
 nd_rum_formed_tt: "Ром был сформирован" #NT!
 nd_rum_path_a_tt: "Выбрал Султана Двух Морей" #NT!
 nd_rum_path_b_tt: "Выбрал перекресток цивилизаций" #NT!
 nd_rum_destiny: "Судьба Рома" #NT!
 nd_rum_destiny_desc: "Султанат был восстановлен. Теперь выберите путь, который определит его наследие: будете ли вы проецировать мощь через два моря или построите величайший перекресток цивилизаций, который когда-либо знал мир?" #NT!
 nd_rum_dest_coasts: "Командуйте побережьями" #NT!
 nd_rum_dest_coasts_desc: "Защитите города-ворота, охраняющие границы Анатолии. Алеппо открывает дорогу в Сирию и Левант, а Эдирне контролирует проход в Европу. Удерживая эти якоря, Султан Двух Морей начинает завоевывать свой титул." #NT!
 nd_rum_dest_straits: "Хозяин проливов" #NT!
 nd_rum_dest_straits_desc: "Город Константин и резиденция халифов Аббасидов должны склониться под знамя султана. Константинополь контролирует проливы между Европой и Азией, а Багдад является якорем восточных границ исламского мира." #NT!
 nd_rum_dest_sultan: "Султан султанов" #NT!
 nd_rum_dest_sultan_desc: "Конечная цель тюркского суверенитета: удержать Каир, Тебриз и Мекку под одним знаменем. Правитель, который командует Нилом, Каспийской границей и священными городами ислама, может по праву претендовать на титул султана султанов." #NT!
 nd_rum_dest_silkroad: "Возрождение Шелкового пути" #NT!
 nd_rum_dest_silkroad_desc: "Анатолия находится на западной конечной точке древнего Шелкового пути. Развивая банковские институты и обеспечивая потоки шелка через рынок капитала, Султанат может восстановить себя как великий торговый мост между Востоком и Западом." #NT!
 nd_rum_dest_emporium: "Торговый центр Востока" #NT!
 nd_rum_dest_emporium_desc: "Рынки Рома переполнены богатствами мира. Шафран из Анатолийского нагорья сочетается с шелком, медью и шерстью на базарах, которые могут конкурировать с любыми товарами в мире. Процветающее, развитое королевство, привлекающее торговцев со всех земель." #NT!
 nd_rum_dest_crossroads: "Свет Анатолии" #NT!
 nd_rum_dest_crossroads_desc: "Султанат стоит на вершине цивилизации: царство, где научные исследования, художественные достижения и коммерческое процветание слились в нечто большее, чем любая из его частей. Свет Анатолии сияет по всему миру." #NT!
 nd_rum.5.t: "Судьба рома" #NT!
 nd_rum.5.d: "Султанат Рум восстановлен и стабилен, его земли объединены под единым сувереном. По древним дорогам Анатолии ездят как купцы, так и солдаты, а медресе кипят учеными. Судьба королевства теперь разворачивается перед нами." #NT!
 nd_rum.5.a: "Начинается новая глава." #NT!
 nd_rum.6.t: "Берега под защитой" #NT!
 nd_rum.6.d: "Знамя Султаната реет над Алеппо и Эдирне. От минаретов Сирии до стен Фракии власть султана простирается за пределы центральной части Анатолии. Береговые линии Средиземного и Черного морей открыты для наших амбиций, и титул «Султан двух морей» приобретает новое значение." #NT!
 nd_rum.6.a: "Моря узнают наше имя." #NT!
 nd_rum.7.t: "Хозяин проливов" #NT!
 nd_rum.7.d: "Константинополь и Багдад пали под натиском наших армий. Город императоров и город халифов теперь подчиняются султану Рума. Это двойное завоевание отражает амбиции величайших исламских империй: примем ли мы воинственный дух гази, который завоевал эти города, или создадим профессиональную имперскую гвардию, достойную управлять ими?" #NT!
 nd_rum.7.a: "Дух гази горит в наших сердцах." #NT!
 nd_rum.7.b: "Имперская гвардия будет защищать наши завоевания." #NT!
 nd_rum.8.t: "Султан султанов" #NT!
 nd_rum.8.d: "Каир, Тебриз и Мекка склоняются перед нашим троном. Богатство Нила, сила Каспийского фронтира и духовный авторитет Священных городов — все сходится в нашем царстве. Ни один султан в исламском мире не обладает такой властью и престижем. Будем ли мы требовать всеобщего суверенитета, которого требует эта позиция, или установим прочный мир на землях ислама?" #NT!
 nd_rum.8.a: "Мы – Вселенский Султан." #NT!
 nd_rum.8.b: "Давайте построим Пакс Исламика." #NT!
 nd_rum.9.t: "Возрождение Шелкового пути" #NT!
 nd_rum.9.d: "Караван-сараи, которые усеивают анатолийский пейзаж, снова заполнены торговцами, привозящими шелк с Востока. Наши банковские дома выдают кредиты, наши базары переполнены экзотическими товарами, а имя Рума с уважением произносят в торговых домах от Венеции до Самарканда. Старый Шелковый путь снова оживает, в его сердце находятся наши города." #NT!
 nd_rum.9.a: "Богатство наций течет через наши руки." #NT!
 nd_rum.10.t: "Большой торговый центр" #NT!
 nd_rum.10.d: "Рынки Рума выросли за пределы простых перевалочных пунктов на Шелковом пути. Шафран, шелк, шерсть и медь проходят через наши базары в количествах, которые удивляют иностранных гостей. Наши торговцы стали властью сами по себе. Должны ли мы дать возможность этим торговым принцам расширить нашу коммерческую деятельность или развивать базарную экономику, которая делает наши города предметом зависти всего мира?" #NT!
 nd_rum.10.a: "Усильте торговых принцев." #NT!
 nd_rum.10.b: "Базары – это сердце нашего богатства." #NT!
 nd_rum.11.t: "Свет Анатолии" #NT!
 nd_rum.11.d: "Султанат Рум является маяком цивилизации. Наши ученые продвигают человеческие знания, наши ремесленники создают произведения непреходящей красоты, а наши торговцы объединяют народы мира. Примет ли этот расцвет форму великого культурного и духовного возрождения, или же мы построим империю караванов, которая объединит континенты посредством торговли?" #NT!
 nd_rum.11.a: "Пусть мудрость Анатолии осветит мир." #NT!
 nd_rum.11.b: "Караваны свяжут мир воедино." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_ghazi_spirit: "Дух Гази" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_ghazi_spirit: "Священные воинские традиции пограничных гази питают наши армии праведным рвением, позволяя им быстро восстанавливаться и сражаться с неутомимой решимостью." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_imperial_guard: "Имперская Гвардия" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_imperial_guard: "Профессиональная имперская гвардия обеспечивает военную эффективность на суше и на море, хотя содержание таких элитных сил напрягает казну." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_universal_sultan: "Универсальный Султан" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_universal_sultan: "Претензии на универсальный суверенитет над исламским миром требуют лояльности подданных и уважения соперников, хотя имперские амбиции приводят к еще большему росту затрат на строительство." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_pax_islamica: "Пакс Исламика" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_pax_islamica: "Мир султана распространяется на земли ислама, позволяя опустошенным регионам восстанавливаться, различным народам интегрироваться, а разведывательным сетям достигать каждого уголка королевства." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_merchant_princes: "Торговые принцы Рома" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_merchant_princes: "Крупные купцы Султаната обладают влиянием, соперничающим с влиянием знати, расширяя дипломатические возможности и торговые доходы, хотя их коммерческие приоритеты иногда отвлекают ресурсы от военных поставок." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_bazaar_economy: "Базар Экономика" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_bazaar_economy: "Динамичная базарная экономика Анатолии стимулирует добычу сырья, создает военно-морские традиции посредством прибрежной торговли и дает нашим флотам опыт для обеспечения торговли на море." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_anatolian_renaissance: "Анатолийский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_anatolian_renaissance: "Великий культурный и духовный расцвет преображает Султанат, усиливая религиозную преданность, расширяя возможности управления и укрепляя обороноспособность королевства." #NT!
 STATIC_MODIFIER_NAME_nd_rum_dest_caravan_empire: "Караванная Империя" #NT!
 STATIC_MODIFIER_DESC_nd_rum_dest_caravan_empire: "Континентальная торговая сеть, которая объединяет религии и цивилизации, снижает стоимость войн за пределами религиозных границ, одновременно обогащая торговый класс и проецируя военно-морскую мощь." #NT!
 nd_rum_imperial_divan: "Императорский Диван" #NT!
 nd_rum_imperial_divan_desc: "Высший совет Султана Султанов, где решаются судьбы империй. Этот величественный зал управления демонстрирует авторитет универсального суверенитета во всем исламском мире." #NT!
 nd_rum_house_of_wisdom: "Дом Мудрости" #NT!
 nd_rum_house_of_wisdom_desc: "Академия обучения, объединяющая ученых, переводчиков и ученых со всего мира, возрождающая дух великого Аббасида Байта аль-Хикмы в самом сердце Анатолии." #NT!
 nd_divan_upkeep: "Администрация Дивана" #NT!
 nd_divan_upkeep_desc: "Обеспечение высшего совета Султана Султанов прекрасными документами, роскошной обстановкой и церемониальной одеждой." #NT!
 nd_wisdom_upkeep: "Содержание Академии" #NT!
 nd_wisdom_upkeep_desc: "Снабжение академии обучения бумагой, научными книгами и благовониями для создания созерцательной атмосферы обучения." #NT!
  
 rum_divan_i_humayun_bureaucracy: "Диван-и Хумаюн" #NT!
 rum_divan_i_humayun_bureaucracy_desc: "Императорский совет Блистательной Порты под председательством Великого визиря как абсолютного заместителя султана. Из палаты Куббеалты Топкапы диван собирался четыре дня в неделю, чтобы рассматривать петиции, издавать ферманы, вести международные отношения и разрешать все апелляции, исходящие от эялетов. Около Сулейманского соглашения султан наблюдал за его ходом невидимым из Хункар Махфили, экранированного Ока Суверенитета над залом совета. Диван сделал Порту оперативным центром империи трех континентов." #NT!
 rum_devshirme_bureaucracy: "Девширме" #NT!
 rum_devshirme_bureaucracy_desc: "Дань мальчикам, с помощью которой Порта периодически набирала христианских мальчиков в возрасте от восьми до восемнадцати лет из деревень на Балканах и в Анатолии, обращала их в ислам и обучала их в школах Ачеми Огланлары и дворцовой академии Эндерун. Выпускники пополнили ряды янычарской пехоты и благодаря своему таланту поднялись до самых высоких государственных постов: рабская аристократия, лично связанная с султаном, без наследственных корней и без конкурирующей лояльности. От Йени Чери Мурада I до неудавшихся реформ Селима III — капыкулу в равной степени влиял на османскую войну и османскую политику." #NT!
 rum_timar_system_bureaucracy: "Система Тимар" #NT!
 rum_timar_system_bureaucracy_desc: "Пребендальская кавалерийская организация, при которой доходы деревни или группы деревень закреплялись за сипахами в обмен на вооружённую службу с фиксированной свитой. В отличие от западных феодальных владений, тимар не передавался по наследству, аннулировался по умолчанию и регистрировался в центральных дефтерах Тахрира Дефтерхана; в день сбора тимариот поехал на войну за свой счет. Эта система была фискально-военной опорой королевства от Мурада I до семнадцатого века, когда ее эрозия из-за откупов ильтизама и нерегулярных вспомогательных войск привела к длительной трансформации османской войны." #NT!
 rum_seyhulislam_bureaucracy: "Шейхулислам" #NT!
 rum_seyhulislam_bureaucracy_desc: "Формальная иерархия ильмие, увенчанная должностью Шейхулислама, главного муфтия империи, чьи фетвы узаконивали все крупные султанские действия, от объявления войны до свержения самих султанов. Ниже него стояли казаскеры Румелии и Анатолии, а также ступенчатая лестница прошедших медресе кади, мудеррисов и муфтусов, занимавших все юридические и образовательные должности в королевстве. Илмие были третьей крупной карьерной службой империи после капыкулу дворца и калемие канцелярии, и единственными, чья карьера проходила в их собственных семьях на протяжении поколений." #NT!
 rum_vakif_network_bureaucracy: "Сеть Вакиф" #NT!
 rum_vakif_network_bureaucracy_desc: "Благотворительный фонд, безотзывный траст, посредством которого благотворитель (часто султан, визирь или султана) выделял приносящую доход собственность для финансирования мечети, медресе, больницы, столовой или караван-сарая навечно. Комплексы кюллие императорской семьи (Фатих Мехмеда II, Баязидие Баязида II, Сулеймание Сулеймана) организовали городское благосостояние в имперском масштабе и придали османским городам их отличительный силуэт. К XVII веку земли вакифов владели примерно третью продуктивной земли империи за пределами досягаемости султанской казны, и это был постоянный переход от фиска к духовенству, который ни один султан не осмеливался отменить." #NT!
 rum_iltizam_bureaucracy: "Илтизам" #NT!
 rum_iltizam_bureaucracy_desc: "Режим откупщиков, согласно которому право на сбор доходов налоговой единицы продавалось на аукционе в Стамбуле тому, кто предложил самую высокую цену, который авансировал казначейству ежегодную оценку и присваивал себе все излишки, которые он мог выжать из земледельцев. С конца шестнадцатого века илтизам постепенно вытеснял тимар как механизм получения доходов империи; Маликанские реформы 1695 года превратили контракты в пожизненное владение, породив новый городской класс стамбульских рантье и крестьянство, страдающее от все более высоких поборов. Система в равной степени приносила деньги в казну и разорение деревни." #NT!
 rum_millet_system_bureaucracy: "Система Милле" #NT!
 rum_millet_system_bureaucracy_desc: "Режим конфессиональной автономии, согласно которому империя признавала главные духовные иерархии своих немусульманских подданных (греческого православного патриарха Константинополя, армянского патриарха, главного раввина (хахамбаши) еврейской общины) в качестве политических глав их паств, ответственных за сбор сизье, решение их внутренних споров и ответственность за свое поведение перед Портой. Это соглашение обеспечило конфессиональный мир ценой постоянной общинной сегрегации и дало клерикальной элите зимми долю государственной власти, которой больше нигде в мире раннего Нового времени не было." #NT!
  
 AUTO_MODIFIER_NAME_nd_rum_bureaucracy_authority: "Диваны Блистательной Порты" #NT!
 AUTO_MODIFIER_DESC_nd_rum_bureaucracy_authority: "Диваны Топкапы (Имперский совет, канцелярия, казначейство, канцелярия Шейхулислама) превратились в постоянный институциональный аппарат, регистрирующий тимары, ведающий учет джизье и подписывающий ферманы империи трех континентов. На этом фундаменте отличительные институты Османского государства начинают обретать свою прочную форму." #NT!
