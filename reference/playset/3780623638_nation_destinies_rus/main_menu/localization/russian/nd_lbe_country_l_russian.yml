l_russian:
 LBE: "Империя Луба" #NT!
 LBE_ADJ: "Луба" #NT!
 LBE_f: "Империя Луба" #NT!
 LBE_f_desc: "Империя Луба была могущественным центральноафриканским государством, центром которого была впадина Упемба и верховья реки Луалаба. Государство Луба, известное своей системой божественного правления балопве, моделью правления, настолько эффективной, что ее переняли соседние народы по всей саванне, объединяло различные общины посредством священной власти, торговли медью и покровительства артистам." #NT!
