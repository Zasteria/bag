l_russian:
 STATIC_MODIFIER_NAME_nd_hanoverian_succession: "Ганноверское наследство" #NT!
 STATIC_MODIFIER_DESC_nd_hanoverian_succession: "Акт об урегулировании связывает нашу династию с британской короной, открывая каналы торговли, субсидий и совместных военных обязательств через Северное море." #NT!
 STATIC_MODIFIER_NAME_nd_welf_renaissance: "Вельфский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_welf_renaissance: "Дом Велфа прокладывает свой собственный курс, инвестируя в университеты, научные исследования и искусство, чтобы построить маяк мысли Просвещения в северной Германии." #NT!
 nd_han_formed_tt: "Ганновер был основан" #NT!
 nd_han_path_a_tt: "Выберите ганноверское наследство" #NT!
 nd_han_path_b_tt: "Выбрали Вельф Ренессанс" #NT!
 nd_han.1.t: "Объединение Ганновера" #NT!
 nd_han.1.d: "Разрозненные Брауншвейгско-Люнебургские княжества объединяются под одним вельфским знаменем. Перед нами стоит не просто вопрос управления, но и ориентации. На западе находится Британия, где наша династия однажды может носить вторую корону: союз, который принесет военно-морскую мощь, торговое богатство и военные субсидии, но также и вовлечет в войны вдали от наших границ. На юге лежит Империя, где учёные Геттингена вырабатывают новые идеи, а рудники Гарца по-прежнему приносят серебро: путь уверенности в своих силах, интеллектуальных амбиций и немецкой идентичности.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_han.1.a: "Посмотрите на море: будущее нашей династии — за Британией" #NT!
 nd_han.1.b: "Посмотрите на Геттинген. Мы будем светом обучения" #NT!
 nd_han.2.t: "Избирательное достоинство" #NT!
 nd_han.2.d: "Император Леопольд возвел герцога Брауншвейг-Люнебургского в Коллегию выборщиков в знак признания нашей военной службы против турок-османов в Вене и нашего вклада в войну против Франции. Девятый электорат наш: место среди князей, которые выбирают самого Императора. Мы можем использовать этот новый престиж, чтобы укрепить наш дипломатический авторитет среди дворов Европы, или мы можем удвоить свою военную службу, которая принесла нам эту честь, укрепив нашу репутацию незаменимых защитников Империи." #NT!
 nd_han.2.a: "Наш голос будет иметь вес в каждом суде" #NT!
 nd_han.2.b: "Империи нужны наши мечи больше, чем наши слова." #NT!
 nd_han.3.t: "Джорджия Августа" #NT!
 nd_han.3.d: "В 1734 году курфюрст Георг Август, который также правит как Георг II Великобритании, приказывает своему ганноверскому министру Герлаху Адольфу фон Мюнхгаузену основать университет в Геттингене. Джорджия Августа порывает с традицией: в ее учебной программе упор делается на светское обучение, современные языки и эмпирические исследования, а не богословскую ортодоксальность. Библиотека открыта для всех ученых. Через поколение он привлечет светил в области права, истории и естественных наук, превратив Геттинген в интеллектуальную столицу немецкоязычного мира." #NT!
 nd_han.3.a: "Пусть знания процветают в залах Геттингена" #NT!
 nd_han.4.t: "Чудо в Миндене" #NT!
 nd_han.4.d: "Утром 1 августа 1759 года шесть британских и два ганноверских пехотных батальона продвигаются строем по открытой равнине против сосредоточенной французской кавалерии возле города Минден. Вопреки всем доктринам и ожиданиям, их дисциплинированный залповый огонь разбивает атаку за атакой. К полудню армия маршала Контадеса отступает. Битва при Миндене доказывает, что хорошо обученная пехота, сохраняя свои нервы и строй, может победить самую грозную кавалерию в Европе. Ганноверские солдаты, стоявшие под Минденом, вписали свою храбрость в военную историю." #NT!
 nd_han.4.a: "Нажмите на преимущество. Ведите борьбу с врагом" #NT!
 nd_han.4.b: "Держите линию: наша сила в нашей стойкости" #NT!
 nd_han.5.t: "Королевский немецкий легион" #NT!
 nd_han.5.d: "Когда Наполеон распускает электорат в 1803 году, цвет ганноверского офицерского корпуса отказывается служить Франции. Переправившись по морю в Британию, они образуют Королевский немецкий легион: общевойсковые силы пехоты, кавалерии, гусар и артиллерии, которые будут сражаться на всех основных театрах военных действий наполеоновских войн. При Ватерлоо оборона КГЛ Ла-Э-Сент становится одним из самых знаменитых боев в военной истории. За тринадцать лет существования Легиона будут служить около 28 000 человек, что принесет ему честь быть единственной немецкой силой, непрерывно сражающейся против Наполеона." #NT!
 nd_han.5.a: "Их жертва никогда не будет забыта" #NT!
 STATIC_MODIFIER_NAME_nd_han_electoral_prestige: "Электоральный престиж" #NT!
 STATIC_MODIFIER_DESC_nd_han_electoral_prestige: "Девятый электорат пользуется уважением во всех дворах Империи." #NT!
 STATIC_MODIFIER_NAME_nd_han_imperial_service: "Имперская служба" #NT!
 STATIC_MODIFIER_DESC_nd_han_imperial_service: "Наши войска — щит Империи: Император награждает тех, кто откликнется на его зов." #NT!
 STATIC_MODIFIER_NAME_nd_han_gottingen_enlightenment: "Геттингенское Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_han_gottingen_enlightenment: "Открытая библиотека и светская учебная программа Геттингена привлекают ученых со всей Европы, превращая его в тигель современной мысли." #NT!
 STATIC_MODIFIER_NAME_nd_han_minden_discipline: "Минденская дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_han_minden_discipline: "Урок Миндена: дисциплинированный огонь побеждает в сражениях. Используйте преимущество, пока враг шатается." #NT!
 STATIC_MODIFIER_NAME_nd_han_minden_steadfastness: "Минден Стойкость" #NT!
 STATIC_MODIFIER_DESC_nd_han_minden_steadfastness: "Урок Миндена: стой на своем и позволь врагу прорваться на твою линию." #NT!
 STATIC_MODIFIER_NAME_nd_han_kgl_pride: "Гордость Легиона" #NT!
 STATIC_MODIFIER_DESC_nd_han_kgl_pride: "Королевский немецкий легион заслужил репутацию лучших немецких войск в Европе." #NT!
 nd_han_welf_dynasty: "Династия Вельфов" #NT!
 nd_han_welf_dynasty_desc: "Дом Вельфов — одна из старейших княжеских династий в Европе, прослеживающая свою родословную на протяжении веков имперской политики." #NT!
 nd_han_harz_mining: "Гарц Серебряная добыча" #NT!
 nd_han_harz_mining_desc: "Серебряные рудники в горах Гарц на протяжении поколений обогащали герцогов Вельфов, финансируя их дворы и армии." #NT!
 nd_han_sachsenspiegel: "Заксеншпигель Традиция" #NT!
 nd_han_sachsenspiegel_desc: "«Заксеншпигель», составленный около 1220 года, кодифицировал саксонское обычное право и стал основой юридической практики на всей северной Германии." #NT!
 nd_han_trade_routes: "Нижнесаксонская торговля" #NT!
 nd_han_trade_routes_desc: "Рыночные города Хильдесхайм, Брауншвейг и Ганновер расположены на пересечении северогерманских торговых путей, связывающих ганзейские города с внутренними районами." #NT!
 nd_han_celle_stud: "Государственный конный завод Целле" #NT!
 nd_han_celle_stud_desc: "Георг II основал Landgestut Celle в 1735 году для разведения кавалерийских и сельскохозяйственных лошадей, создав одну из самых известных программ разведения лошадей в Европе." #NT!
 nd_han_calenberg_rise: "Возвышение Каленберга" #NT!
 nd_han_calenberg_rise_desc: "Княжество Каленберг консолидирует власть среди конкурирующих ветвей Брауншвейга, централизуя управление под единым правителем Велфа." #NT!
 nd_han_herrenhausen_tradition: "Херренхаузенская традиция" #NT!
 nd_han_herrenhausen_tradition_desc: "София Ганноверская превращает Херренхаузен в один из лучших барочных садов Европы, сцену для интеллектуальных встреч с такими личностями, как Лейбниц." #NT!
 nd_han_wasserregal: "Оберхарцер Вассеррегаль" #NT!
 nd_han_wasserregal_desc: "Чудо инженерной мысли со 107 плотинами, 310 км рвов и десятками водяных колес: Вассеррегаль питает шахты Гарца за счет хитроумного гидравлического управления." #NT!
 nd_han_leibniz_court: "Лейбниц при дворе" #NT!
 nd_han_leibniz_court_desc: "Готфрид Вильгельм Лейбниц служит двору Вельфов на протяжении четырех десятилетий, разрабатывая исчисление, проектируя вычислительные машины и каталогизируя генеалогию династии." #NT!
 nd_han_electoral_dignity: "Избирательное достоинство" #NT!
 nd_han_electoral_dignity_desc: "В 1692 году император Леопольд I возводит герцога Брауншвейг-Люнебургского в звание курфюрста: девятое место в Коллегии, которая выбирает императора." #NT!
 nd_han_garde_du_corps_tradition: "Традиция Garde du Corps" #NT!
 nd_han_garde_du_corps_tradition_desc: "Программа разведения Целле производит превосходных боевых коней для ганноверской гвардии корпуса, главного тяжелого кавалерийского полка электората." #NT!
 nd_han_circle_director: "Директор Нижнесаксонского кружка" #NT!
 nd_han_circle_director_desc: "Будучи главой Нижнесаксонского Имперского Круга, Ганновер несет ответственность за сбор войск для обороны Круга и защиту региона от внешних угроз." #NT!
 nd_han_act_of_settlement: "Акт об урегулировании" #NT!
 nd_han_act_of_settlement_desc: "Акт английского парламента об урегулировании 1701 года называет Софию Ганноверскую наследницей британского престола, связывая две короны личным союзом." #NT!
 nd_han_subsidy_troops: "Субсидируемые войска" #NT!
 nd_han_subsidy_troops_desc: "Герцоги Вельфы нанимают своих хорошо обученных солдат в Венецию, Францию, Испанию, Англию и к императору, превращая военную силу в дипломатическую валюту." #NT!
 nd_han_bremen_verden: "Бремен и Верден" #NT!
 nd_han_bremen_verden_desc: "Приобретение Бремена и Вердена у Швеции в 1719 году дает Ганноверу контроль над устьями Везера и Эльбы, открывая прямой доступ к морской торговле в Северном море." #NT!
 nd_han_gottingen_university: "Геттингенский университет" #NT!
 nd_han_gottingen_university_desc: "Джорджия Августа, основанная в 1734 году, становится интеллектуальной столицей немецкого мира: ее открытая библиотека и светская учебная программа привлекают ученых со всей Европы." #NT!
 nd_han_military_reform: "Ганноверская военная реформа" #NT!
 nd_han_military_reform_desc: "Ганноверская армия реорганизуется в профессиональные постоянные силы, обученные в соответствии со стандартами, требуемыми ее обязательствами как перед Империей, так и перед британской короной." #NT!
 nd_han_minden_legacy: "Наследие Миндена" #NT!
 nd_han_minden_legacy_desc: "Под Минденом в 1759 году ганноверская пехота двинулась открытым строем против французской кавалерии и разбила ее дисциплинированным залповым огнем: триумф тренировки над традициями." #NT!
 nd_han_kings_german_legion: "Королевский немецкий легион" #NT!
 nd_han_kings_german_legion_desc: "Когда Наполеон распустил Ганновер в 1803 году, его лучшие офицеры перебрались в Великобританию и сформировали KGL: единственную немецкую армию, которая постоянно сражалась в наполеоновских войнах." #NT!
 nd_han_gottingen_school: "Геттингенская школа" #NT!
 nd_han_gottingen_school_desc: "Шлёцер и его коллеги из Геттингена являются пионерами современной историографии, статистического анализа и сравнительной политики, меняя то, как европейцы понимают свое прошлое." #NT!
 nd_han_british_subsidies: "Британские субсидии" #NT!
 nd_han_british_subsidies_desc: "Великобритания субсидирует оборону Ганновера сотнями тысяч фунтов ежегодно, финансируя укрепления, гарнизоны и армию, охраняющую электорат." #NT!
 nd_han_jager_tradition: "Ганноверский егерь" #NT!
 nd_han_jager_tradition_desc: "Набранные из числа лесников и егерей Нижней Саксонии, ганноверские егеря сражаются как легкая пехота, опытные стрелки, обученные использовать лесистую и пересеченную местность." #NT!
 nd_han_kingdom_elevation: "Королевство Ганновер" #NT!
 nd_han_kingdom_elevation_desc: "Венский конгресс поднимает Ганновер из электората в королевство в 1814 году, признавая его лояльность и жертвенность во время наполеоновских войн." #NT!
 nd_han_constitutional_reform: "Ганноверская конституция" #NT!
 nd_han_constitutional_reform_desc: "Staatsgrundgesetz 1833 года устанавливает конституционные рамки Ганноверского королевства, сочетая королевские прерогативы с представительным правительством." #NT!
 nd_han_clausthal_academy: "Клаустальская горная академия" #NT!
 nd_han_clausthal_academy_desc: "Горная школа в Клаустали применяет современную науку и технику к древним рудникам Гарца, внедряя промышленные технологии, которые распространились по горнодобывающим районам Германии." #NT!
 a_nd_han_subsidientruppen: "Субсидиентруппен" #NT!
 a_nd_han_subsidientruppen_desc: "Профессиональные ганноверские солдаты, нанятые союзным державам, хорошо обученные и надежные регулярные войска, которые сражаются там, где того требуют договоры их герцога." #NT!
 a_nd_han_garde_du_corps: "Гард дю Корпус" #NT!
 a_nd_han_garde_du_corps_desc: "Garde du Corps — это элитная тяжелая кавалерия Ганновера, верхом на боевых лошадях, выращенных на государственном конном заводе Целле, ударные войска в решающие моменты на поле боя." #NT!
 a_nd_han_kgl_infantry: "Королевский немецкий легион" #NT!
 a_nd_han_kgl_infantry_desc: "Лучшие немецкие регулярные войска наполеоновской эпохи, обученные по британским стандартам и закаленные в кампаниях от полуострова до Ватерлоо." #NT!
 a_nd_han_jager: "Ганноверский егерь" #NT!
 a_nd_han_jager_desc: "Стрелки, выросшие в лесах Нижней Саксонии, умеющие вести перестрелки, устраивать засады и умеющие рассчитывать каждый выстрел на пересеченной местности." #NT!
 levy_nd_han_subsidientruppen: "Субсидиентруппен" #NT!
 levy_nd_han_subsidientruppen_desc: "Профессиональная ганноверская пехота, собранная из крестьян и обученных солдат, нанятых на службу союзным державам." #NT!
 levy_nd_han_garde_du_corps: "Гард дю Корпус" #NT!
 levy_nd_han_garde_du_corps_desc: "Элитная ганноверская тяжелая кавалерия, собранная из солдат и верхом на боевых лошадях, выращенных на государственном конном заводе Целле." #NT!
 levy_nd_han_jager: "Ганноверский егерь" #NT!
 levy_nd_han_jager_desc: "Обученная в лесу легкая пехота, собранная из лесников и егерей Нижней Саксонии." #NT!
 nd_han_oberharzer_bergwerk: "Оберхарцер Бергверк" #NT!
 nd_han_oberharzer_bergwerk_desc: "Серебряный рудник в горе Гарц, оборудованный гениальной системой управления водными ресурсами Вассеррегаль: плотинами, канавами и водяными колесами, обеспечивающими добычу из глубоких стволов." #NT!
 nd_han_sachsenspiegel_gericht: "Заксеншпигель Герихт" #NT!
 nd_han_sachsenspiegel_gericht_desc: "Суд, отправляющий правосудие в соответствии с Sachsenspiegel: основополагающим кодексом саксонского обычного права, который сформировал юридическую практику по всей северной Германии." #NT!
 nd_han_landgestut: "Ландгестут Целле" #NT!
 nd_han_landgestut_desc: "Государственный конный завод в Целле разводит превосходных боевых лошадей и сельскохозяйственных тягловых животных, снабжая ганноверскую кавалерию и обогащая сельскую экономику." #NT!
 nd_han_georgia_augusta: "Джорджия Августа" #NT!
 nd_han_georgia_augusta_desc: "Университет, построенный по геттингенским принципам Просвещения, светской учебной программе, открытой библиотеке и эмпирическим исследованиям, привлекающим ученых со всей Европы." #NT!
 nd_han_herrenhausen: "Дворец Херренхаузен" #NT!
 nd_han_herrenhausen_desc: "Садовый дворец в стиле барокко во французском стиле, где при дворе Вельфа проводятся интеллектуальные салоны и культивируются искусства под пристальным вниманием Европы." #NT!
 nd_han_pm_harz_silver: "Добыча серебра в Гарце" #NT!
 nd_han_pm_harz_silver_desc: "Традиционная шахтная добыча серебряных жил Гарца с использованием железных инструментов и плавки древесного угля для добычи серебряной руды для сокровищницы Велфа." #NT!
 nd_han_pm_harz_deep_shaft: "Глубокая добыча полезных ископаемых" #NT!
 nd_han_pm_harz_deep_shaft_desc: "Гидравлическая мощность Wasserregal позволяет вести добычу на более глубоких шахтах, достигая более богатых серебряных жил ниже уровня грунтовых вод с железной арматурой и плавкой угля." #NT!
 nd_han_pm_industrial_mining: "Промышленная добыча" #NT!
 nd_han_pm_industrial_mining_desc: "Паровые насосы и валы, армированные железом, привносят современные промышленные методы в древние шахты Гарца, сжигая уголь для питания двигателей добычи." #NT!
 nd_han_pm_bergwerk_maintenance: "Содержание шахты" #NT!
 nd_han_pm_bergwerk_maintenance_desc: "Древесина для опор шахт, камень для стен и железо для инструментов обеспечивают работоспособность шахт." #NT!
 nd_han_pm_horse_breeding: "Коневодство Целле" #NT!
 nd_han_pm_horse_breeding_desc: "Селекционное разведение ганноверских теплокровных лошадей с использованием поголовья зернового откорма, поставка кавалерийских лошадей и сельскохозяйственных тягловых животных." #NT!
 nd_han_pm_stud_maintenance: "Содержание конного завода" #NT!
 nd_han_pm_stud_maintenance_desc: "Сено, зерно и уход за скотом поддерживают селекционную программу в Ландгестуте." #NT!
 nd_han_pm_university_press: "Университетское издательство" #NT!
 nd_han_pm_university_press_desc: "Типографские мастерские Геттингена выпускают научные труды, юридические комментарии и научные трактаты для распространения по всему немецкому миру." #NT!
 nd_han_pm_scholarly_press: "Научная пресса" #NT!
 nd_han_pm_scholarly_press_desc: "Расширенная университетская пресса, выпускающая влиятельные исторические и научные публикации Геттингена в более широком масштабе." #NT!
 nd_han_pm_university_maintenance: "Содержание университета" #NT!
 nd_han_pm_university_maintenance_desc: "Книги, бумага и мебель поддерживают лекционные залы и библиотеку." #NT!
 nd_han_pm_herrenhausen_maintenance: "Дворцовая территория" #NT!
 nd_han_pm_herrenhausen_maintenance_desc: "Мрамор, стекло, изысканная мебель и импортные красители сохраняют великолепие Херренхаузена в стиле барокко." #NT!
 nd_han_pm_gericht_maintenance: "Содержание суда" #NT!
 nd_han_pm_gericht_maintenance_desc: "Бумага, мебель и юридические справки поддерживают суды Заксеншпигеля." #NT!
 nd_han_pm_leibniz_salon: "Салон Лейбница" #NT!
 nd_han_pm_leibniz_salon_desc: "Интеллектуальные салоны в Херренхаузене, где ученые, дипломаты и двор Вельфа собираются, чтобы обсудить философию, математику и естествознание в традициях Лейбница." #NT!
 nd_han_destiny: "Судьба Вельфов" #NT!
 nd_han_destiny_desc: "Земли Брауншвейг-Люнебурга объединяются под одним вельфским знаменем. Независимо от того, посмотрим ли мы на запад, через море, или внутрь библиотек Империи, наша судьба ждет нас." #NT!
 nd_han_dest_north_sea_coast: "Побережье Северного моря" #NT!
 nd_han_dest_north_sea_coast_desc: "Обеспечьте контроль над Бременом и Ольденбургом, чтобы контролировать устья Везера и Эмса, предоставив Ганноверу прямой доступ к торговым путям Северного моря." #NT!
 nd_han_dest_british_crown: "Британская Корона" #NT!
 nd_han_dest_british_crown_desc: "Акт об урегулировании открывает путь в Лондон. Подчините британскую корону Вельфу и объедините два королевства за Северным морем." #NT!
 nd_han_dest_north_sea_imperium: "Империя Северного моря" #NT!
 nd_han_dest_north_sea_imperium_desc: "От Эдинбурга до Амстердама Северное море представляет собой ганноверское озеро. Управляйте его берегами, его флотом и его торговлей." #NT!
 nd_han_dest_university_network: "Университетская сеть" #NT!
 nd_han_dest_university_network_desc: "Распространите модель Геттингена на Эрфурт и за его пределы. Используйте современное банковское дело для финансирования сети университетов, которые сделают Ганновер научной столицей Империи." #NT!
 nd_han_dest_aufklarung: "Ауфкларунг" #NT!
 nd_han_dest_aufklarung_desc: "Печатный станок разносит идеи Геттингена по всей Германии. Развивайте наши земли, выпускайте книги для научного рынка и возглавьте немецкое Просвещение." #NT!
 nd_han_dest_beacon_of_reason: "Маяк разума" #NT!
 nd_han_dest_beacon_of_reason_desc: "Ганновер является интеллектуальным маяком Европы. Примите Просвещение, обеспечьте книжную торговлю в Лейпциге и постройте общество, в котором процветают разум и терпимость." #NT!
 nd_han.6.t: "Судьба Вельфов" #NT!
 nd_han.6.d: "Объединение Ганновера знаменует собой начало, а не конец. Дом Велфа стоит на перепутье. На запад манят приливы Северного моря: британское правопреемство, морская торговля и власть двойной короны. На юге лекционные залы Геттингена и библиотеки Империи предлагают иное величие: построенное не на военных кораблях, а на идеях. Путь, который мы выберем сейчас, определит, каким станет Ганновер." #NT!
 nd_han.6.a: "Наша судьба ждет" #NT!
 nd_han.7.t: "Везер и Эмс" #NT!
 nd_han.7.d: "Поскольку Бремен и Ольденбург находятся под нашим контролем, Ганновер командует устьями рек Везер и Эмс. Торговля Северного моря проходит через наши порты. Верфи Бремена строят суда, которые доставляют ганноверские товары в Великобританию, Нидерланды и за их пределы. Это фундамент, на котором будет построен морской Ганновер." #NT!
 nd_han.7.a: "Северное море – наша дорога" #NT!
 nd_han.8.t: "Корона за морем" #NT!
 nd_han.8.d: "Династия Вельфов носит британскую корону. Лондон, величайший город мира, признает ганноверского монарха. Личный союз открывает огромные возможности: мы можем использовать дипломатический вес управления двумя королевствами, чтобы изменить баланс сил, или мы можем использовать коммерческие сети Северного моря, чтобы наполнить нашу казну торговыми доходами." #NT!
 nd_han.8.a: "Две короны, одна династия: наша дипломатия превыше всего" #NT!
 nd_han.8.b: "Два порта, одно море: наши купцы будут процветать" #NT!
 nd_han.9.t: "Лорды Северного моря" #NT!
 nd_han.9.d: "От гаваней Эдинбурга до контор Амстердама Северное море подчиняется Ганноверу. Наши флоты патрулируют его воды, наши торговцы доминируют в его торговле, наша династия правит величайшими королевствами. Мы можем воспользоваться своим преимуществом на море, построив настоящую талассократию, которая бросит вызов старым военно-морским державам, или мы можем использовать наши морские богатства, чтобы закрепить неприступную позицию на континенте." #NT!
 nd_han.9.a: "Управляйте волнами: наш флот будет править морем" #NT!
 nd_han.9.b: "Закрепите континент: наше богатство защищает наши границы" #NT!
 nd_han.10.t: "Научная сеть" #NT!
 nd_han.10.d: "Благодаря тому, что почтенный университет Эрфурта вышел на ганноверскую орбиту, а современные банковские системы финансируют наши академические амбиции, геттингенская модель получила распространение. Наши университеты привлекают ученых со всей Империи: теологов, юристов, историков и натурфилософов, которые свободно дискутируют в традициях Лейбница. Ганновер становится синонимом обучения." #NT!
 nd_han.10.a: "Знания – наше истинное богатство" #NT!
 nd_han.11.t: "Свет Ауфкларанга" #NT!
 nd_han.11.d: "Типографии Геттингена и Ганновера выпускают книги, брошюры и научные журналы, которые меняют представление немцев о праве, управлении и мире природы. Наши университеты — интеллектуальный двигатель Империи. Мы можем двигаться дальше в направлении светской науки, принимая религиозную терпимость и космополитическое образование, или мы можем направить эту интеллектуальную энергию на систематическое камеральное управление, превратив Ганновер в модель рационального управления." #NT!
 nd_han.11.a: "Пусть разум восторжествует над догмой" #NT!
 nd_han.11.b: "Пусть метод восторжествует над обычаем" #NT!
 nd_han.12.t: "Маяк разума" #NT!
 nd_han.12.d: "Ганновер является доказательством того, что маленькое немецкое государство может соперничать с великими державами не только за счет завоеваний, но и за счет силы идей. Наши университеты выпускают лучших ученых в Европе, наша толерантность привлекает таланты всех конфессий, наша книжная торговля приносит Aufklarung во все уголки континента. Мы можем опираться на эту интеллектуальную сеть, чтобы проецировать мягкую силу и дипломатическое влияние, или мы можем использовать практические плоды мысли Просвещения для построения индустриального, современного военного государства." #NT!
 nd_han.12.a: "Перо сильнее: наши идеи меняют Европу" #NT!
 nd_han.12.b: "Знания применяются, наука служит государству" #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_personal_union: "Королевский союз" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_personal_union: "Личный союз Ганновера и Великобритании дает нашим дипломатам непревзойденные рычаги воздействия во всех судах Европы." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_north_sea_trade: "Торговля Северного моря" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_north_sea_trade: "Торговые флоты двух королевств наполняют наши гавани богатствами торговли Северного моря." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_thalassocracy: "Ганноверская талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_thalassocracy: "Наши военные корабли командуют Северным морем, хотя армия страдает от пренебрежения, поскольку ресурсы перекачиваются на верфи." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_continental_anchor: "Континентальный бастион" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_continental_anchor: "Морское богатство обеспечивает мобильную, хорошо снабжаемую армию, которая обеспечивает позицию Ганновера как якоря любой континентальной коалиции." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_secular_learning: "Светская стипендия" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_secular_learning: "В наших университетах преподают свободно, не ограничиваясь конфессиональной ортодоксальностью, хотя религиозный истеблишмент раздражает такая терпимость." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_cameralist_state: "Государство-камералист" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_cameralist_state: "Систематическое администрирование и финансовая дисциплина делают Ганновер образцом рационального управления, хотя бюрократическая осторожность замедляет путь к войне." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_republic_of_letters: "Республика букв" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_republic_of_letters: "Научная сеть Ганновера охватывает весь континент, давая нашим дипломатам и государственным деятелям интеллектуальный авторитет, с которым мало кто может сравниться." #NT!
 STATIC_MODIFIER_NAME_nd_han_dest_industrial_enlightenment: "Индустриальное Просвещение" #NT!
 STATIC_MODIFIER_DESC_nd_han_dest_industrial_enlightenment: "Практические плоды стипендий Aufklarung (химия, металлургия, машиностроение) направляются на создание современной, хорошо оснащенной армии." #NT!
 nd_han_admiralitat: "Ганноверское Адмиралтейство" #NT!
 nd_han_admiralitat_desc: "Военно-морской штаб, координирующий объединенные морские силы доминионов Ганновера в Северном море, контролирующий строительство флота, защиту портов и защиту торговых конвоев." #NT!
 nd_han_pm_admiralitat_maintenance: "Содержание Адмиралтейства" #NT!
 nd_han_pm_admiralitat_maintenance_desc: "Древесина, военно-морские поставки и административная документация обеспечивают работоспособность Адмиралтейства." #NT!
 nd_han_akademie: "Академия Виссеншафтен" #NT!
 nd_han_akademie_desc: "Королевская академия наук в традициях Лейбница, объединяющая натурфилософию, математику и прикладную инженерию в рамках единого учреждения, занимающегося развитием человеческих знаний." #NT!
 nd_han_pm_akademie_maintenance: "Содержание Академии" #NT!
 nd_han_pm_akademie_maintenance_desc: "Книги, бумага, стеклянные инструменты и научные материалы поддерживают исследования Академии." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_han_bureaucracy_authority: "Welfische Verwaltung" #NT!
 AUTO_MODIFIER_DESC_nd_han_bureaucracy_authority: "Электорат Вельфа унаследовал институциональный набор инструментов, необычный для немецкого территориального государства: Тайный совет, который управлял страной в отсутствие короля-курфюрста, постоянную постоянную армию, которая сражалась от Вены до Йорктауна, Oberappellationsgericht в Целле, Немецкий Канцлей в Лондоне, который управлял личной унией с Великобританией, поместья Каленберг-Люнебург, которые сохранились там, где не выжило Бранденбургское, и, после 1734 года, Джорджию Августу в Геттинген, крупнейший университет Просвещения Империи. Выбирайте, какие учреждения оставить в живых." #NT!
  
 han_geheimes_ratskollegium_bureaucracy: "Гехаймес Ратсколлегиум" #NT!
 han_geheimes_ratskollegium_bureaucracy_desc: "Ганноверский тайный совет, организованный Regimentsordnung 1618 года в специализированные Ratsstuben: Консисторию по церковным делам, Кригсрат по войне и Хаушальцрат по финансам. После личного союза 1714 года Geheimer Rat стал де-факто правительством электората, консультируя отсутствующего принца посредством письменных меморандумов, переданных через Deutsche Kanzlei в Лондоне. Это была институциональная основа государства, которым заочно управлял король-курфюрст, который редко посещал свои немецкие земли." #NT!
  
 han_landstaende_bureaucracy: "Ганноверское Ландштенде" #NT!
 han_landstaende_bureaucracy_desc: "Территориальные владения земель Каленберг-Люнебург-Грубенхаген, организованные в три курии: прелаты секуляризованных аббатств, Риттершафт сельских рыцарей и депутаты небольших вельфских городов. Ландштенде вел переговоры о налоговых льготах, контролировал Клостерфонды и выживал как реальный противовес отсутствующему избирателю. Ганновер никогда не создавал такого абсолютизма, как Бранденбург-Пруссия: Акт об урегулировании 1714 года неявно сохранял поместья, обязывая британскую корону не вести ганноверские войны без их согласия." #NT!
  
 han_hannoversches_heer_bureaucracy: "Ганновершес-Хер" #NT!
 han_hannoversches_heer_bureaucracy_desc: "Постоянная Ганноверская армия, созданная Эрнестом Августом в 1680-х годах и ставшая постоянной после получения электората в 1692 году. Хир сражался при осаде Вены в 1683 году под руководством будущего Георга I, участвовал во всех войнах Империи, от испанского наследства до американской революции, и после личной унии делил монарха, но никогда не делил казну с британской армией. Вербунг проводил Вербунг в сельских округах с кантональными сборами, которые тяжелым бременем ложились на крестьянство в годы войны." #NT!
  
 han_deutsche_kanzlei_bureaucracy: "Deutsche Kanzlei в Лондоне" #NT!
 han_deutsche_kanzlei_bureaucracy_desc: "Немецкая канцелярия, учрежденная указом от 29 августа 1714 года для управления Ганновером из Лондона во время отсутствия короля-курфюрста. Канцлей представлял собой небольшой офис трех ганноверских министров, прикрепленных к британскому двору, которые передавали меморандумы между Гехаймером Ратом в Ганновере и избирателем и, что особенно важно, формально сохраняли ганноверскую внешнюю политику отдельно от британской. Разногласия между немецкими министрами Канцлея и британскими советниками избирателя были постоянными, и этот офис стал известен в Вестминстере как канал, через который ганноверские интересы просачивались в британскую политику." #NT!
  
 han_oberappellationsgericht_bureaucracy: "Oberappellationsgericht zu Celle" #NT!
 han_oberappellationsgericht_bureaucracy_desc: "Высокий апелляционный суд в Целле, основанный как Cellesche Hofgericht в 1711 году, первым президентом которого стал Вейпарт Людвиг фон Фабрис. Oberappellationsgericht унаследовал судебную канцелярию старой герцогской резиденции Люнебург-Целле (1378-1705) и превратил ее в высший гражданский суд земель Вельф. Его постановления о дворянском наследстве, поместной юрисдикции и правах Клёстера были окончательными для всего электората, и суд продолжал функционировать при последующих режимах еще долго после того, как сам Hofgericht был реорганизован в Appellationshof в 1810 году." #NT!
  
 han_georgia_augusta_bureaucracy: "Джорджия Августа цу Геттинген" #NT!
 han_georgia_augusta_bureaucracy_desc: "Геттингенский университет, основанный в 1734 году британским королем Георгом II по настоянию его первого ганноверского министра Герлаха Адольфа фон Мюнхгаузена, обучение которого началось в 1737 году. Созданный с самого начала как университет эпохи Просвещения, Джорджия Августа отказалась от традиционных исповедальных клятв, наняла пиетистский юридический факультет Галле и сделала историко-критические исследования и естественные науки центральными в учебной программе. К концу 18 века он подготовил больше ганноверских государственных служащих, чем любой другой институт, и подготовил основоположников современной немецкой истории (Шлёцера и Херена) и физика Лихтенберга." #NT!
