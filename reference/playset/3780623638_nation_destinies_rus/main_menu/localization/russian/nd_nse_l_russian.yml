l_russian:
 STATIC_MODIFIER_NAME_nd_nse_whale_road: "Китовая дорога" #NT!
 STATIC_MODIFIER_DESC_nd_nse_whale_road: "Море – не преграда, а магистраль. Наши флоты связывают три королевства в одно, а китовая дорога несет наших торговцев, наших воинов и наши законы на все берега северного мира." #NT!
 STATIC_MODIFIER_NAME_nd_nse_crown_of_three_kingdoms: "Корона Трех Королевств" #NT!
 STATIC_MODIFIER_DESC_nd_nse_crown_of_three_kingdoms: "Англия, Дания и Норвегия отвечают одной короне. То, что Кнут создал посредством завоеваний, мы сохраним посредством закона и управления, объединив три народа в одну империю." #NT!
 nd_nse.1.t: "Империя Северного моря возрождается" #NT!
 nd_nse.1.d: "Мечта Кнута Великого снова оживает. Там, где когда-то один король объединил троны Англии, Дании и Норвегии силой оружия и силой личности, мы превзошли даже это легендарное достижение. Северное море, это огромное серое пространство, разделяющее меньшие нации, теперь является нашим внутренним озером, нашей дорогой, нашей жизненной силой.\n\nНо перед империей, скрепленной водой, стоит фундаментальный вопрос, на который сам Кнут никогда не отвечал: какой силой мы будем? Море, которое нас объединяет, также определяет нас. Мы можем полностью принять эту идентичность, став высшей морской державой века, нашим флотам не будет равных от Фарерских островов до Скагеррака. Или мы можем использовать море просто как соединительную ткань чего-то большего: единой короны, которая управляет тремя нациями как одной, смешивая англосаксонские законы со скандинавскими обычаями в новую имперскую традицию.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_nse.1.a: "Китовая дорога – наша империя" #NT!
 nd_nse.1.b: "Одна корона, три королевства, один закон" #NT!
 nd_nse.2.t: "Данегельд совершенен" #NT!
 nd_nse.2.d: "То, что началось с дани, вымогаемой у напуганных англосаксонских королей, превратилось в самую эффективную налоговую систему в Северной Европе. Денегельд, который когда-то был позорной платой для подкупа налетчиков викингов, теперь представляет собой сложный земельный налог, начисляемый по шкурам и взимаемый королевскими управами во всех графствах. Ни одно другое королевство не может сравниться с тщательностью нашего финансового управления.\n\nПеред нами стоит вопрос: как направить этот необычайный поток доходов. Мы можем еще больше ужесточить сборочный аппарат, гарантируя, что каждая копейка поступит в королевскую казну и укрепив контроль короны над отдаленными провинциями. Или мы можем перенаправить часть этого богатства в коммерческую инфраструктуру, реинвестируя Данегельд в торговые сети, которые делают нашу империю процветающей." #NT!
 nd_nse.2.a: "Ужесточить фискальный аппарат" #NT!
 nd_nse.2.b: "Реинвестируйте в торговлю и процветание" #NT!
 nd_nse.3.t: "Лейданг: Перекованный" #NT!
 nd_nse.3.d: "Древняя система лейданга, военно-морской сбор, который когда-то собирал флоты Скандинавии, была реформирована для новой эпохи. По старой системе каждый прибрежный округ был обязан предоставить для сезонных экспедиций по одному кораблю и команде. Теперь мы систематизировали и распространили это обязательство на всю Североморскую империю, от фьордов Норвегии до устьев восточной Англии.\n\nКаждый скипрейд и каждое графство вдоль нашей обширной береговой линии теперь вносят свой вклад в постоянный военно-морской резерв. Когда империя призовет, сотни кораблей могут быть собраны в течение нескольких недель. Море, которого боятся другие, — наша крепостная стена." #NT!
 nd_nse.3.a: "Северное море узнает наши кили" #NT!
 nd_nse.4.t: "Великое языческое дело" #NT!
 nd_nse.4.d: "В древней скандинавской традиции Тинг был местом, где свободные люди собирались для разрешения споров, провозглашения законов и привлечения своих правителей к ответственности. Теперь представители со всех уголков Североморской империи (английские графы и датские ярлы, норвежские лагмены и шотландские таны) собрались на величайшее собрание, которое когда-либо видел наш мир.\n\nЭто больше, чем просто судебное разбирательство. Это момент, когда три разных народа начинают видеть себя одним. Провозглашенные сегодня законы будут написаны на трех языках и будут применяться от Тронхейма до Кентербери. Что начал меч, то закон завершит." #NT!
 nd_nse.4.a: "Пусть закон свяжет то, что выковал меч" #NT!
 nd_nse.5.t: "Владение Северным морем" #NT!
 nd_nse.5.d: "Спуск на воду наших великих линейных кораблей знаменует собой кульминацию многовековой военно-морской традиции. От длинных кораблей с драконьим носом, которые впервые терроризировали побережья Европы, до этих высоких плавучих крепостей, ощетинившихся пушками, эволюция военно-морской мощи Северного моря была неустанной.\n\nНи один флот в мире не может бросить вызов нашему господству в северных водах. Подступы ко всем крупным портам от Бергена до Лондона находятся под нашим прицелом. Флоты сельди плывут беспрепятственно. Торговые конвои прибывают без перерыва. Империя Северного моря, наконец, стала именно тем, что всегда обещало ее название: морской империей." #NT!
 nd_nse.5.a: "Мы — хозяева северной бездны" #NT!
 STATIC_MODIFIER_NAME_nd_nse_danegeld_extraction: "Добыча Данегельда" #NT!
 STATIC_MODIFIER_DESC_nd_nse_danegeld_extraction: "Совершенная система налогообложения земли гарантирует, что каждая шкура в королевстве пополняет королевскую казну." #NT!
 STATIC_MODIFIER_NAME_nd_nse_danegeld_reinvestment: "Данегельд Реинвестирование" #NT!
 STATIC_MODIFIER_DESC_nd_nse_danegeld_reinvestment: "Налоговые поступления направляются обратно в коммерческую инфраструктуру, обогащая страну за счет торговли." #NT!
 STATIC_MODIFIER_NAME_nd_nse_leidang_reforged: "Лейданг: Перекованный" #NT!
 STATIC_MODIFIER_DESC_nd_nse_leidang_reforged: "Реформированная система военно-морского набора обеспечивает быструю мобилизацию флотов из всех прибрежных районов империи." #NT!
 STATIC_MODIFIER_NAME_nd_nse_heathen_thing_legacy: "Наследие Великого Дела" #NT!
 STATIC_MODIFIER_DESC_nd_nse_heathen_thing_legacy: "Прецедент Великого Собрания установил традицию инклюзивного управления среди различных народов империи." #NT!
 STATIC_MODIFIER_NAME_nd_nse_north_sea_mastery: "Владение Северным морем" #NT!
 STATIC_MODIFIER_DESC_nd_nse_north_sea_mastery: "Неоспоримое военно-морское превосходство в северных водах, поддерживаемое самым мощным боевым флотом в регионе." #NT!
 nd_nse_huscarl_tradition: "Хускарлская традиция" #NT!
 nd_nse_huscarl_tradition_desc: "Институт хускарлов, профессиональных домашних воинов, созданных по образцу легендарных йомсвикингов, обеспечивает Империю Северного моря элитными постоянными пехотными силами." #NT!
 nd_nse_danegeld_system: "Система Данегельда" #NT!
 nd_nse_danegeld_system_desc: "Первоначально дань викингам-налетчикам, Данегельд превратился в сложный земельный налог, администрируемый через систему англосаксонских графств." #NT!
 nd_nse_dreki_warship: "Военный корабль Дреки" #NT!
 nd_nse_dreki_warship_desc: "Корабль-дракон, ужасный дреки, является высшим выражением скандинавского военно-морского искусства: быстрый, мореходный и устрашающий на вид." #NT!
 nd_nse_norse_trade_routes: "Скандинавские торговые пути" #NT!
 nd_nse_norse_trade_routes_desc: "Торговые сети эпохи викингов, простирающиеся от Византии до Винландии, обеспечивают основу для торговли в Северном море." #NT!
 nd_nse_thingstead_tradition: "Тингстед Традиция" #NT!
 nd_nse_thingstead_tradition_desc: "Norse Thing, собрание свободных людей для принятия законов и разрешения споров, официально оформлено как постоянный руководящий орган." #NT!
 nd_nse_skaldic_heritage: "Скальдическое наследие" #NT!
 nd_nse_skaldic_heritage_desc: "Богатые традиции скандинавской скальдической поэзии, резьбы по руническим камням и устной истории сохраняют и прославляют культурную самобытность империи." #NT!
 nd_nse_leidang_origins: "Лейданг Происхождение" #NT!
 nd_nse_leidang_origins_desc: "Древняя скандинавская система военно-морского набора, требующая от каждого прибрежного района предоставить корабль и команду, составляет основу военных резервов империи." #NT!
 nd_nse_snekkja_fleet: "Флот Снеккья" #NT!
 nd_nse_snekkja_fleet_desc: "Быстрые и маневренные корабли, известные как снеккья, составляют основу патрульного и рейдового флота империи, опережая любое судно в открытом море." #NT!
 nd_nse_leidang_reform: "Реформа Лейданга" #NT!
 nd_nse_leidang_reform_desc: "Старая система лейданга реформируется для создания Тингманналидов: постоянной свиты профессиональных солдат, финансируемой за счет постоянных налогов." #NT!
 nd_nse_jelling_legacy: "Еллинг Наследие" #NT!
 nd_nse_jelling_legacy_desc: "Огромные рунические камни в Еллинге, воздвигнутые Харальдом Блютузом в ознаменование обращения Дании в христианство, символизируют способность империи соединить языческие и христианские традиции." #NT!
 nd_nse_longship_yards_tradition: "Традиция верфей драккаров" #NT!
 nd_nse_longship_yards_tradition_desc: "Специализированные судостроительные предприятия, использующие уникальную скандинавскую технологию строительства клинкера, производят суда непревзойденных мореходных качеств." #NT!
 nd_nse_north_sea_trade_league: "Торговая лига Северного моря" #NT!
 nd_nse_north_sea_trade_league_desc: "Формализованная сеть торговых партнерств по всему Северному морю, основанная на многовековой коммерческой деятельности викингов." #NT!
 nd_nse_runestone_legacy: "Наследие рунного камня" #NT!
 nd_nse_runestone_legacy_desc: "Традиция воздвигать резные рунические камни в память о великих делах и сохранении знаний представляет собой уникальную форму общественной грамотности и культурной памяти." #NT!
 nd_nse_witan_council: "Совет Витана" #NT!
 nd_nse_witan_council_desc: "Англосаксонский Витенагемот, собрание мудрецов, объединился с традициями скандинавских вещей, чтобы создать мощный консультативный совет при короне." #NT!
 nd_nse_busse_warship: "Военный корабль Буссе" #NT!
 nd_nse_busse_warship_desc: "Буссе — это большой, прочно построенный военный корабль, произошедший от торгового кнарра, способный перевозить как войска, так и тяжелое вооружение через открытое Северное море." #NT!
 nd_nse_great_thing: "Великая вещь" #NT!
 nd_nse_great_thing_desc: "Общеимперское собрание объединяет представителей со всех уголков Северного моря, создавая прецеденты межкультурного управления.\n\n#italic Доступно в: $nd_nse_thingstead$#!" #NT!
 nd_nse_cod_stockfish_trade: "Торговля треской и вяленой рыбой" #NT!
 nd_nse_cod_stockfish_trade_desc: "Переработка и экспорт сушеной трески и вяленой рыбы становятся краеугольным камнем торговли Северного моря, кормя Европу и одновременно обогащая империю." #NT!
 nd_nse_stave_church_architecture: "Деревянная церковная архитектура" #NT!
 nd_nse_stave_church_architecture_desc: "Характерные скандинавские деревянные церкви с фронтонами в виде драконьих голов и сложной резьбой по дереву представляют собой уникальное сочетание христианской веры с художественными традициями викингов." #NT!
 nd_nse_hird_discipline: "Третья дисциплина" #NT!
 nd_nse_hird_discipline_desc: "Королевский хирд, профессиональная военная свита скандинавских королей, разрабатывает строгие стандарты обучения, которые повышают качество постоянных сил империи." #NT!
 nd_nse_naval_prowess: "Военно-морская доблесть" #NT!
 nd_nse_naval_prowess_desc: "Поколения опыта мореплавания увенчались военно-морской доктриной, сочетающей в себе скандинавское мореходное мастерство с развитой тактической координацией." #NT!
 nd_nse_shire_integration: "Ширская интеграция" #NT!
 nd_nse_shire_integration_desc: "Англо-саксонская графская система местного управления распространена по всей империи, обеспечивая единообразное управление от шотландского нагорья до норвежских фьордов." #NT!
 nd_nse_north_sea_frigate: "Фрегат Северного моря" #NT!
 nd_nse_north_sea_frigate_desc: "Специально построенные фрегаты, оптимизированные для бурных вод Северного моря и Атлантики, сочетающие в себе скорость и огневую мощь, необходимую для патрулирования огромных морских территорий." #NT!
 nd_nse_confessional_unity: "Конфессиональное единство" #NT!
 nd_nse_confessional_unity_desc: "Традиция Империи Северного моря соединять язычество и христианство, католичество и протестантство создает необычную толерантность к религиозному разнообразию." #NT!
 nd_nse_reformed_leidang: "Реформированный Лейданг" #NT!
 nd_nse_reformed_leidang_desc: "Средневековая система военно-морского набора модернизируется и превращается в комплексную военную обязанность, производящую как моряков для флота, так и солдат для армии.\n\n#italic Доступно в: $nd_nse_hirdstova$#!" #NT!
 nd_nse_wool_cloth_trade: "Торговля шерстью и тканями" #NT!
 nd_nse_wool_cloth_trade_desc: "Сочетание английской шерсти и скандинавских технологий окрашивания позволяет получить ткань, которая может соперничать с лучшими фламандскими тканями.\n\n#italic Доступно в: $nd_nse_longship_yards$#!" #NT!
 nd_nse_crown_law_reform: "Реформа королевского закона" #NT!
 nd_nse_crown_law_reform_desc: "Единый правовой кодекс основан как на англосаксонском общем праве, так и на скандинавских правовых традициях, укрепляя королевскую власть по всей империи." #NT!
 nd_nse_hanseatic_rivalry: "Ганзейское соперничество" #NT!
 nd_nse_hanseatic_rivalry_desc: "Конкуренция с Ганзейским союзом заставляет Североморскую империю развивать собственные торговые сети и торговую инфраструктуру.\n\n#italic Доступно в: $nd_nse_danelaw_mint$#!" #NT!
 nd_nse_fortress_harbors: "Крепость Гавани" #NT!
 nd_nse_fortress_harbors_desc: "Ключевые прибрежные порты укреплены оборонительными сооружениями, которые защищают как флот, так и торговые пути, поддерживающие империю." #NT!
 nd_nse_rate_of_line: "Скорость линии" #NT!
 nd_nse_rate_of_line_desc: "Строительство массивных линейных кораблей знаменует собой превращение Империи Северного моря в первоклассную военно-морскую державу, способную проецировать силу через Атлантику." #NT!
 nd_nse_absolute_thalassocracy: "Абсолютная талассократия" #NT!
 nd_nse_absolute_thalassocracy_desc: "Морское превосходство Империи Северного моря становится тотальным: ни один флот не осмеливается бросить вызов нашим военным кораблям, и каждый торговый путь в северных водах находится под нашей защитой." #NT!
 nd_nse_navigation_acts: "Законы о навигации" #NT!
 nd_nse_navigation_acts_desc: "Законодательство требует, чтобы торговля с империей осуществлялась на судах под флагом империи, обеспечивая доминирование торгового флота над торговлей в Северном море." #NT!
 nd_nse_cultural_convergence: "Культурная конвергенция" #NT!
 nd_nse_cultural_convergence_desc: "Столетия совместного управления начали формировать новую идентичность из старых разногласий: не совсем норвежскую, не совсем английскую, но нечто беспрецедентное." #NT!
 nd_nse_imperial_navy_reform: "Реформа Имперского флота" #NT!
 nd_nse_imperial_navy_reform_desc: "Комплексная реорганизация флота предполагает унификацию конструкции кораблей, профессиональную подготовку офицеров и централизованное военно-морское командование." #NT!
 nd_nse_colonial_mandate: "Колониальный мандат" #NT!
 nd_nse_colonial_mandate_desc: "Морское влияние Империи Северного моря простирается за пределы европейских вод, создавая колонии и торговые посты по всей Атлантике." #NT!
 nd_nse_constitutional_assembly: "Конституционное собрание" #NT!
 nd_nse_constitutional_assembly_desc: "Постоянный законодательный орган, представляющий все три королевства, обеспечивает конституционное управление, сохраняя при этом единство короны." #NT!
 nd_nse_nordhavskorvet: "Нордхавскорвет" #NT!
 nd_nse_nordhavskorvet_desc: "Быстрые современные корветы, предназначенные для патрулирования и охраны обширных морских территорий Империи Северного моря." #NT!
 nd_nse_industrial_shipyards: "Промышленные верфи" #NT!
 nd_nse_industrial_shipyards_desc: "Паровые машины и методы строительства из железа преобразовывают верфи империи, позволяя быстро производить современные военные корабли.\n\n#italic Доступно в: $nd_nse_longship_yards$#!" #NT!
 nd_nse_north_sea_enlightenment: "Просвещение Северного моря" #NT!
 nd_nse_north_sea_enlightenment_desc: "Расцвет науки и научных исследований по всей империи, основанный на объединении интеллектуальных традиций Скандинавии и Британии." #NT!
 nd_nse_maritime_insurance: "Морское страхование" #NT!
 nd_nse_maritime_insurance_desc: "Формализованные системы морского страхования снижают финансовый риск торговли в Северном море, стимулируя увеличение коммерческих инвестиций и более длительные рейсы.\n\n#italic Доступно в: $nd_nse_herring_hall$#!" #NT!
 nd_nse_modern_navy_doctrine: "Современная доктрина ВМФ" #NT!
 nd_nse_modern_navy_doctrine_desc: "Комплексная военно-морская доктрина, включающая в себя новейшие разработки в области артиллерийского вооружения, сигнализации и тактики флота, обеспечивает дальнейшее господство империи на морях." #NT!
 nd_nse_free_trade_dominion: "Доминион свободной торговли" #NT!
 nd_nse_free_trade_dominion_desc: "Непревзойденный контроль империи над морскими путями в Северном море позволяет ей диктовать условия свободной торговли в Северной Европе." #NT!
 nd_nse_parliamentary_union: "Парламентский союз" #NT!
 nd_nse_parliamentary_union_desc: "Единый парламент, представляющий Англию, Данию, Норвегию и острова, официально закрепляет конституционную основу Империи Северного моря.\n\n#italic Доступно в: $nd_nse_thingstead$#!" #NT!
 a_nd_nse_huscarl: "Хускарл" #NT!
 a_nd_nse_huscarl_desc: "Элитные домашние воины произошли от личной гвардии Кнута, хускарлы — грозные ударные отряды, вооруженные огромными датскими топорами. Их разрушительная атака разрушает вражеские порядки, хотя их берсерковая агрессия делает их уязвимыми для постоянного морального давления." #NT!
 a_nd_nse_thingmannalid: "Тингманналид" #NT!
 a_nd_nse_thingmannalid_desc: "«Люди Ассамблеи» — это дисциплинированная постоянная свита королей Северного моря. Обученные быстрым тактическим маневрам, они наносят удары инициативно и точно, хотя их более легкая броня меняет защиту на скорость." #NT!
 levy_nd_nse_huscarl: "Хускарл Леви" #NT!
 levy_nd_nse_huscarl_desc: "Элитные домашние воины, владеющие топорами, из числа знати и профессиональных солдат Империи Северного моря." #NT!
 levy_nd_nse_thingmannalid: "Тингманналид Леви" #NT!
 levy_nd_nse_thingmannalid_desc: "Дисциплинированные солдаты свиты, набранные из крестьян и солдат, обученные военным традициям собрания Тинг." #NT!
 n_nd_nse_dreki: "Дреки" #NT!
 n_nd_nse_dreki_desc: "Корабль-дракон с резным змеевидным носом и небольшой осадкой — культовый военный корабль скандинавов: достаточно быстрый, чтобы плавать по рекам, и достаточно мореходный, чтобы пересекать океаны." #NT!
 n_nd_nse_snekkja: "Снеккья" #NT!
 n_nd_nse_snekkja_desc: "«Змея»: маневренный, быстроходный корабль, идеально подходящий для патрулирования, набегов и разведки обширной морской территории империи." #NT!
 n_nd_nse_busse: "Буссе" #NT!
 n_nd_nse_busse_desc: "Большой, прочно построенный военный корабль произошел от торгового кнарра. Бусс несет значительное вооружение, сохраняя при этом мореходные качества скандинавской военно-морской конструкции." #NT!
 n_nd_nse_frigate: "Фрегат Северного моря" #NT!
 n_nd_nse_frigate_desc: "Специально построенный военный корабль, оптимизированный для суровых условий Северного моря, сочетающий в себе скорость и вооружение для эффективного патрулирования обширных береговых линий империи." #NT!
 n_nd_nse_rate: "Линейная скорость" #NT!
 n_nd_nse_rate_desc: "Массивный линейный корабль, представляющий собой вершину военно-морской техники Северного моря, ощетинившийся пушками и построенный, чтобы противостоять самым жестоким штормам в Атлантике." #NT!
 n_nd_nse_corvette: "Нордхавскорвет" #NT!
 n_nd_nse_corvette_desc: "Современный корвет, предназначенный для Северной Атлантики: быстрый, хорошо вооруженный и способный к расширенным независимым операциям в отдаленных водах империи." #NT!
 nd_nse_thingstead: "Тингстед" #NT!
 nd_nse_thingstead_desc: "Постоянный зал собраний, где представители собираются для провозглашения законов, разрешения споров и привлечения правителей к ответственности в соответствии со скандинавскими традициями." #NT!
 nd_nse_longship_yards: "Верфи для драккаров" #NT!
 nd_nse_longship_yards_desc: "Специализированные судостроительные предприятия, использующие скандинавский клинкер, производят мореходные суда, являющиеся основой Североморской империи." #NT!
 nd_nse_herring_hall: "Сельдь Холл" #NT!
 nd_nse_herring_hall_desc: "Центр переработки и торговли обширным промыслом сельди и трески в Северном море, основа морской торговли империи." #NT!
 nd_nse_danelaw_mint: "Данелау Минт" #NT!
 nd_nse_danelaw_mint_desc: "Королевская чеканка монет, производящая стандартизированные монеты, финансовый инструмент налоговой системы Данегельда, который финансирует империю." #NT!
 nd_nse_hirdstova: "Хирдстова" #NT!
 nd_nse_hirdstova_desc: "Военный тренировочный зал, где королевский хирд, профессиональная воинская свита скандинавских королей, оттачивает свои навыки владения оружием и тактикой." #NT!
 nd_nse_stave_church: "Деревянная церковь" #NT!
 nd_nse_stave_church_desc: "Характерно скандинавская христианская церковь, построенная из огромных деревянных посохов и украшенная резьбой в виде драконов, сочетающая христианскую символику с искусством викингов." #NT!
 nd_nse_thing_administration: "Управление вещью" #NT!
 nd_nse_thing_administration_desc: "Рутинные дела управления проводились посредством традиционной норвежской системы собраний." #NT!
 nd_nse_lawspeaker_council: "Совет законоговорителей" #NT!
 nd_nse_lawspeaker_council_desc: "Высокое собрание под председательством потомственных законодателей, которые сохраняют и интерпретируют сложные правовые традиции империи." #NT!
 nd_nse_parliamentary_reforms: "Парламентские реформы" #NT!
 nd_nse_parliamentary_reforms_desc: "Современные конституционные процедуры превращают древнюю Тинг в полноценный парламентский институт." #NT!
 nd_nse_clinker_shipbuilding: "Клинкер Судостроение" #NT!
 nd_nse_clinker_shipbuilding_desc: "Отличительная скандинавская техника перекрытия досок, пропитанных шерстью и дегтем, позволяющая создавать корабли исключительной гибкости и мореходных качеств." #NT!
 nd_nse_norse_weaving: "Скандинавское плетение парусов" #NT!
 nd_nse_norse_weaving_desc: "Производство шерстяных парусов, окрашенных по характерным узорам Северного морского флота, сочетающих английскую шерсть со скандинавскими традициями ткачества." #NT!
 nd_nse_industrial_shipbuilding: "Промышленное судостроение" #NT!
 nd_nse_industrial_shipbuilding_desc: "Паровые машины и методы металлоконструкций, применяемые в военном кораблестроении." #NT!
 nd_nse_stockfish_processing: "Переработка вяленой рыбы" #NT!
 nd_nse_stockfish_processing_desc: "Засолка и сушка трески и сельди для торговли на дальние расстояния — краеугольный камень торговли в Северном море." #NT!
 nd_nse_maritime_insurance_office: "Офис морского страхования" #NT!
 nd_nse_maritime_insurance_office_desc: "Формализованная система страхования рисков морской торговли, стимулирующая инвестиции в дальнюю торговлю." #NT!
 nd_nse_herring_salting: "Засолка сельди" #NT!
 nd_nse_herring_salting_desc: "Традиционное консервирование сельди в бочках с рассолом для экспорта по Европе." #NT!
 nd_nse_silver_minting: "Чеканка серебра" #NT!
 nd_nse_silver_minting_desc: "Производство стандартизированных серебряных пенни, валюты, лежащей в основе налоговой системы Данегельда." #NT!
 nd_nse_hanseatic_trade_tools: "Инструменты Ганзейской торговли" #NT!
 nd_nse_hanseatic_trade_tools_desc: "Производство прецизионных весов и торговых инструментов, способных конкурировать с ганзейскими торговыми стандартами." #NT!
 nd_nse_mint_administration: "Администрация монетного двора" #NT!
 nd_nse_mint_administration_desc: "Бюрократический аппарат, контролирующий производство монет и предотвращающий обесценивание валюты." #NT!
 nd_nse_retinue_training: "Обучение свиты" #NT!
 nd_nse_retinue_training_desc: "Ежедневные боевые учения и обслуживание снаряжения свиты профессиональных воинов." #NT!
 nd_nse_weaponry_forging: "Ковка оружия" #NT!
 nd_nse_weaponry_forging_desc: "Производство оружия и доспехов для профессиональных вооруженных сил империи, сочетающее скандинавскую обработку металлов с английскими традициями кузнечного дела." #NT!
 nd_nse_woodcarving_tradition: "Традиция резьбы по дереву" #NT!
 nd_nse_woodcarving_tradition_desc: "Сложная скандинавская традиция декоративной обработки дерева привела к созданию резной мебели, в которой христианская иконография сочетается с языческими художественными мотивами." #NT!
 nd_nse_parish_upkeep: "Содержание прихода" #NT!
 nd_nse_parish_upkeep_desc: "Текущее обслуживание и богослужебные принадлежности для богослужений деревянной церкви." #NT!
 nd_nse_formed_tt: "Создал #bold Империю Северного моря#!." #NT!
 nd_nse_path_a_tt: "Выберите судьбу #bold Китовой дороги#!" #NT!
 nd_nse_path_b_tt: "Выберите судьбу #bold Короны Трех Королевств#!." #NT!
 nd_nse_destiny: "Судьба Северного моря" #NT!
 nd_nse_destiny_desc: "Империя, охватывающая три королевства и контролирующая величайшее море в известном мире, стоит на перепутье. Какова будет его судьба?" #NT!
 nd_nse_dest_channel: "Мастерство канала" #NT!
 nd_nse_dest_channel_desc: "Захватите контроль над великими торговыми городами Нидерландов. Брюгге и Амстердам являются ключами к торговле Северной Европы. В наших руках они будут финансировать империю, построенную на торговле." #NT!
 nd_nse_dest_hansa: "Ганзейское подчинение" #NT!
 nd_nse_dest_hansa_desc: "Ганзейский союз слишком долго доминировал в торговле Северного моря. Любек и Гамбург должны преклонить колени. Их торговый флот будет служить нашей короне или будет сметен с моря." #NT!
 nd_nse_dest_atlantic: "Атлантическая талассократия" #NT!
 nd_nse_dest_atlantic_desc: "Главный приз: приближается контроль над Атлантикой. Поскольку Руан и Лиссабон находятся в наших руках, ни один корабль не плавает между Средиземноморьем и Балтийским морем без нашего разрешения. Империя Северного моря становится арбитром мировой торговли." #NT!
 nd_nse_dest_crown: "Объединение королевства" #NT!
 nd_nse_dest_crown_desc: "Прежде чем империя сможет расшириться, она должна быть объединена. Развивайте институты управления и повышайте уровень развития королевства, пока каждый уголок трех королевств не будет процветать под одним законом." #NT!
 nd_nse_dest_eastern: "Восточный марш" #NT!
 nd_nse_dest_eastern_desc: "Варяги когда-то плыли на восток, чтобы строить среди славян царства. Теперь Североморская империя последует их примеру, завоевав Новгород и установив господство над восточными торговыми путями." #NT!
 nd_nse_dest_imperium: "Империум Севера" #NT!
 nd_nse_dest_imperium_desc: "Париж, жемчужина западного христианского мира, должен признать господство Севера. Когда французская столица находится под нашим контролем, а королевство находится на пике своего развития, Империя Северного моря становится неоспоримой силой Европы." #NT!
 nd_nse.6.t: "Судьба обретает форму" #NT!
 nd_nse.6.d: "Империя Северного моря доказала свою стабильность и выносливость. То, что началось как амбициозный союз корон, превратилось в настоящую нацию, признанную соседями и внушающую страх соперникам. Фундамент заложен. Теперь вопрос в том, что на их основе строить.\n\nНаши советники указывают на огромную карту в зале совета, где голубое пространство нашего внутреннего моря доминирует в центре. На юге расположены богатые торговые города Фландрии и Ганзы. На востоке — обширные леса и реки, где варяги когда-то создавали царства среди дикой природы. Будущее империи зависит от того направления, которое мы выберем." #NT!
 nd_nse.6.a: "Наша судьба ждет" #NT!
 nd_nse.7.t: "Канал попадает под нашу тень" #NT!
 nd_nse.7.d: "Великие торговые города Нидерландов, Брюгге с его суконными цехами и Амстердам с его складами, теперь несут наше знамя. Самый узкий и загруженный участок воды в Северной Европе стал нашим пунктом взимания платы за проезд. Каждый рулон фламандского сукна, каждая бочка рейнского вина, каждый груз балтийского леса, проходящий через Ла-Манш, теперь обогащает нашу казну.\n\nКупцы этих городов, когда-то яростно независимых, обнаружили, что защита флота Империи Северного моря стоит цены подчинения. Наши таможенники сидят в своих конторах, а подходы патрулируют наши военные корабли." #NT!
 nd_nse.7.a: "Канал — наша рыночная площадка" #NT!
 nd_nse.8.t: "Падение Ганзейского союза" #NT!
 nd_nse.8.d: "Любек, гордый город, называвший себя королевой Ганзы, пал. Гамбург, ворота во внутреннюю часть Германии, развевается под нашим флагом. Ганзейский союз, на протяжении веков доминирующая торговая держава Северного моря и Балтийского моря, был сломлен как независимая сила.\n\nИх склады и счетные дома, их корабли и их торговые пути, их накопленные знания о рынках от Новгорода до Лондона: все это теперь переходит в наши руки. Вопрос в том, что делать с этим наследством.\n\nМы можем незаметно поглотить их сети, унаследовав их торговые связи и торговую информацию, чтобы построить нашу собственную коммерческую империю, даже большую, чем их. Или мы можем полностью раздавить их, железной рукой укрепив нашу монополию на торговлю в Северном море и устранив любую будущую конкуренцию." #NT!
 nd_nse.8.a: "Поглотить их торговые сети" #NT!
 nd_nse.8.b: "Укрепить нашу монополию силой" #NT!
 nd_nse.9.t: "Лорды Атлантики" #NT!
 nd_nse.9.d: "Под нашим контролем Руан в Нормандии и Лиссабон на Тежу Империя Северного моря достигла чего-то беспрецедентного: господства над всем атлантическим побережьем от Арктики до подходов к Средиземному морю. Ни один корабль не может войти в великий океан или покинуть его, не пройдя через воды, которыми мы управляем.\n\nБогатства Нового Света, торговля пряностями, золотой берег Африки, все великие торговые артерии эпохи текут по каналам, которые мы контролируем. Это высшее выражение талассократической мощи.\n\nМы можем использовать эту позицию, чтобы открыть Атлантику для свободной торговли под нашей защитой, построить инфраструктуру и привлечь торговлю. Или мы можем установить тотальный контроль, поставив каждый торговый флот в зависимость от нашей доброй воли, а каждую военно-морскую державу — в подчинение нашему адмиралтейству." #NT!
 nd_nse.9.a: "Откройте Атлантику для свободной торговли" #NT!
 nd_nse.9.b: "Утвердить полное господство над всеми маршрутами" #NT!
 nd_nse.10.t: "Царство Объединенное" #NT!
 nd_nse.10.d: "Мечта о трех королевствах, объединенных одним законом, из мечты превратилась в реальность. Институты управления (графские суды и собрания Тингов, королевская канцелярия и церковная иерархия) теперь функционируют как единая система от Шетландских островов до Ютландии, от Дублина до Уппсалы.\n\nРазвитие распространилось на все уголки королевства. Дороги соединяют великие города, рынки работают по единым правилам, а указ короля беспрекословно действует в каждой провинции. Был заложен фундамент для чего-то большего: империи, способной проецировать мощь далеко за пределы своих первоначальных границ." #NT!
 nd_nse.10.a: "Три королевства действительно едины" #NT!
 nd_nse.11.t: "Основан Восточный марш" #NT!
 nd_nse.11.d: "Новгород, великий торговый город Востока, пал от наших войск. Варяжская мечта наконец осуществилась: путь из Скандинавии к византийской границе снова оказался под контролем норвежцев. Там, где Рюрик и его товарищи когда-то были авантюристами, мы приходим как завоеватели.\n\nПеред нами простирается восточная граница, обширная и полная возможностей. Мы можем агрессивно продвигаться вперед, используя Новгород как отправную точку для дальнейшей экспансии вглубь России. Или мы можем закрепить это завоевание, укрепив восточную границу и превратив ее в неприступный бастион, который защитит наш фланг, пока мы развиваем внутренние районы." #NT!
 nd_nse.11.a: "Нажимайте на продвижение на восток" #NT!
 nd_nse.11.b: "Укрепляйте и укрепляйте границу" #NT!
 nd_nse.12.t: "Провозглашена Империя Севера" #NT!
 nd_nse.12.d: "Париж пал. Самый престижный город западно-христианского мира, резиденция королей Капетингов, сердце средневековой науки и культуры: он наш. Благодаря этому завоеванию Империя Северного моря вышла за рамки своего происхождения как морского союза и стала доминирующей державой на европейском континенте.\n\nТеперь королевство простирается от арктических пустошей Гренландии до берегов Сены, от лесов Новгорода до берегов Ирландии. Ни одна империя со времен Рима не владела такой обширной и разнообразной территорией в Европе.\n\nВопрос о том, как управлять этим колоссом, допускает два ответа. Мы можем править, используя подавляющую военную силу, подавляя любое сопротивление и извлекая богатства завоеванных провинций. Или мы можем попытаться гармонизировать различные народы империи, интегрируя их посредством закона и совместного управления в настоящую универсальную монархию." #NT!
 nd_nse.12.a: "Подчинить всех, кто сопротивляется" #NT!
 nd_nse.12.b: "Гармонизировать народы империи" #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_channel_networks: "Ганзейские торговые сети" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_channel_networks: "Поглощенная торговая информация и торговые контакты бывшего Ганзейского союза подпитывают нашу коммерческую экспансию." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_channel_monopoly: "Монополия Северного моря" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_channel_monopoly: "Безжалостное применение нашей торговой монополии устраняет конкуренцию и подчиняет конкурирующих торговцев нашей воле." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_atlantic_trade: "Атлантическая свободная торговля" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_atlantic_trade: "Политика открытой торговли привлекает торговцев со всего мира, финансируя масштабные строительные проекты по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_atlantic_dominion: "Атлантический Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_atlantic_dominion: "Полный контроль над торговыми путями через Атлантику позволяет империи интегрировать отдаленные территории, сохраняя при этом ветеранскую военную базу." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_march_east: "Восточное наступление" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_march_east: "Динамика восточной кампании заставляет армии империи продвигаться вперед с огромной скоростью, хотя расходы на наемников растут с каждой новой границей." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_fortify: "Пограничный бастион" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_fortify: "Восточная граница укреплена и превратилась в неприступную оборонительную линию, защищающую фланг империи от всех желающих." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_subjugate: "Имперское подчинение" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_subjugate: "Завоеванные провинции подчиняются военной силе, их богатство извлекается для казны империи ценой недовольства аристократов." #NT!
 STATIC_MODIFIER_NAME_nd_nse_dest_harmonize: "Гармонизированные народы" #NT!
 STATIC_MODIFIER_DESC_nd_nse_dest_harmonize: "Политика культурной интеграции и совместного управления объединяет различные народы империи, хотя усилия по поддержанию внутренней гармонии подрывают волю к длительным войнам." #NT!
 nd_nse_admiralty_house: "Адмиралтейский дом" #NT!
 nd_nse_admiralty_house_desc: "Высший штаб военно-морской администрации Империи Северного моря, координирующий работу самого мощного флота в Атлантическом мире." #NT!
 nd_nse_imperial_chancery: "Императорская канцелярия" #NT!
 nd_nse_imperial_chancery_desc: "Административное сердце Империума Севера, где законы пишутся на трех языках и рассылаются во все уголки королевства." #NT!
 nd_nse_admiralty_operations: "Адмиралтейские операции" #NT!
 nd_nse_admiralty_operations_desc: "Ежедневные операции адмиралтейства Северного моря, координация движения флота и графиков торговых конвоев." #NT!
 nd_nse_chancery_administration: "Управление канцелярии" #NT!
 nd_nse_chancery_administration_desc: "Огромный бюрократический аппарат имперской канцелярии, обрабатывающий указы и переписку в трех королевствах." #NT!
  
  # ===== BUREAUCRACIES ===== 
 nse_hird_witherlogh_bureaucracy: "Хёрд и Уизерлог" #NT!
 nse_hird_witherlogh_bureaucracy_desc: "Королевский домашний корпус из трех-четырех тысяч профессиональных воинов, который Кнут сохранил из своего флота вторжения в 1018 году, которым управлял Уизерлог, Лекс Кастренсис, записанный Свендом Аггесеном, сочетающий норвежские обычаи вассалов с процедурой канонического права. Хирд подчинялся одному королю, минуя графов и элдорменов графств; Постановления Кнута требовали, чтобы каждый хускарл носил великолепные доспехи и обоюдоострый меч с золотой рукоятью." #NT!
 nse_heregeld_bureaucracy: "Херегельд" #NT!
 nse_heregeld_bureaucracy_desc: "Ежегодный армейский налог, основанный на прецеденте корабельного налога 1012 года и, как известно, взимался в размере 72 000 фунтов серебра с графств плюс 10 500 фунтов серебра из Лондона в 1018 году, а затем взимался каждый год до 1051 года. Херегельд, начисляемый на основе шкуры и обеспечиваемый конфискацией земли графскому правителю, требовал точных реестров владения, что предвосхищало обзор Судного дня на полвека." #NT!
 nse_witenagemot_bureaucracy: "Витенагемот" #NT!
 nse_witenagemot_bureaucracy_desc: "Англо-саксонский совет мудрецов: архиепископы, епископы, аббаты, элдормены и старшие тэны, созванные по желанию короля для согласия на законы и удостоверения грантов. Вступление Кнута на престол в Оксфорде в 1018 году, когда датчане и англичане совместно приняли законы Эдгара I, было скреплено этим органом. Через него были обнародованы законы Кнута, составленные Вульфстаном Йоркским между 1020 и 1023 годами." #NT!
 nse_wapentake_riding_bureaucracy: "Вапентаке и езда" #NT!
 nse_wapentake_riding_bureaucracy_desc: "Суды ста Данелау, где вапентаке (взятие оружия, подтверждение поднятием оружия) заменило южную сотню, а верховая езда (thrithjungr, третья часть) разделила великие северные графства Йоркшир, Линдси и Линкольн. Двенадцать карукатов на небольшую сотню обеспечивали золотую ставку, а сокемены (от тридцати до пятидесяти процентов сельского населения в восточной Англии) обладали промежуточными свободами, неизвестными к югу от Темзы." #NT!
 nse_skipreida_leidang_bureaucracy: "Скипрейда Лейданг" #NT!
 nse_skipreida_leidang_bureaucracy_desc: "Скандинавский прибрежный набор корабельных округов впервые был засвидетельствован в битве при Хьёрунгавагре в 985 году и реорганизован под руководством Хокона Доброго. Каждый скипреид снарядил, укомплектовал экипаж и снабдил один военный корабль на два-три месяца. Кнут сплел этот набор флота вместе с англосаксонским корабельным соке, обязанностью внутренних графств финансировать прибрежные суда, предоставив своей федерации единый военно-морской аппарат, который базировался на обоих берегах Северного моря." #NT!
 nse_anglo_danish_mission_bureaucracy: "Англо-датская миссия" #NT!
 nse_anglo_danish_mission_bureaucracy_desc: "Инструмент Кнута для евангелизации скандинавской половины его империи, основанный на Вульфстане, архиепископе Йоркском. Начиная с римского паломничества 1027 года, обученные англичанами епископы были отправлены на новые северные кафедры: Бернхард в Сканию, Гербранд в Роскилле и Ранье в Фюн. Миссия была преднамеренным противодействием притязаниям Гамбурга-Бремена на датскую церковь, связывая королевскую власть с епископствами от Лунда до Тронхейма." #NT!
 nse_reformed_coinage_bureaucracy: "Реформированная чеканка" #NT!
 nse_reformed_coinage_bureaucracy_desc: "Поздний англосаксонский денежный режим названных королевских монетчиков, действовавший на двенадцати назначенных монетных дворах, кодифицированный кодексом Этельстана 928 года и ужесточенный благодаря великой реформе Эдгара и периодическим перечеканкам Этельреда. На каждом пенни было указано имя торговца и место монетного двора; Принудительное продление серебряного стандарта позволило Короне снимать сеньораж. При Кнуте система была распространена на весь пролив, и первые регулярные серебряные пенни были отчеканены в Лунде и Сигтуне." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_nse_bureaucracy_authority: "Бюрократическая власть Империи Северного моря" #NT!
 AUTO_MODIFIER_DESC_nd_nse_bureaucracy_authority: "При формировании [NSE.GetName] получает возможность принимать у себя историческую англо-скандинавскую бюрократию, предоставляя три дополнительных бюрократических слота помимо универсального столичного." #NT!
