l_russian:
 STATIC_MODIFIER_NAME_nd_bel_workshop_of_the_world: "Мастерская Мира" #NT!
 STATIC_MODIFIER_DESC_nd_bel_workshop_of_the_world: "Угольные пласты Бельгии, чугунолитейные заводы и машиностроительные заводы сделали ее индустриальным двигателем континентальной Европы. От Силлонской промышленности до текстильных фабрик Гента — бельгийское производство прокладывает путь в современную эпоху." #NT!
 STATIC_MODIFIER_NAME_nd_bel_scrap_of_paper: "Клочок бумаги, Щит Наций" #NT!
 STATIC_MODIFIER_DESC_nd_bel_scrap_of_paper: "Великие державы договором гарантировали нейтралитет Бельгии. Это маленькое государство на перекрестке Европы выживает не силой оружия, а силой международного права, дипломатического искусства и тихого процветания, которое приносит мир." #NT!
 STATIC_MODIFIER_NAME_nd_bel_constitutional_spirit: "Дух Конституции" #NT!
 STATIC_MODIFIER_DESC_nd_bel_constitutional_spirit: "Конституция Бельгии 1831 года представляет собой модель либерального правления, защищающую индивидуальные свободы и объединяющую два языковых сообщества в рамках конституционной монархии." #NT!
 STATIC_MODIFIER_NAME_nd_bel_industrial_momentum: "Промышленный импульс" #NT!
 STATIC_MODIFIER_DESC_nd_bel_industrial_momentum: "Угольные шахты Боринажа и доменные печи Льежа превратили долину Самбре-Маас в коридор дыма, стали и неустанного производства." #NT!
 nd_bel.1.t: "Рождение Бельгии" #NT!
 nd_bel.1.d: "Революция удалась. От оперного театра в Брюсселе до баррикад сентябрьских дней – жители южных провинций сбросили иго Соединенного Королевства Нидерландов. Теперь формируется новая нация, которая должна выковать свою собственную идентичность в фламандских суконных залах Гента, валлонских кузницах Льежа и космополитических салонах Брюсселя.\n\nВеликие державы наблюдают за этим с интересом. Бельгия находится на перекрестке Европы, и путь, который она выберет сейчас, определит, станет ли эта маленькая страна промышленной мастерской или оплотом дипломатии и мира.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bel.1.a: "Разожгите печи: Бельгия станет кузницей Европы!" #NT!
 nd_bel.1.b: "Пусть договор станет нашим щитом и поставит под угрозу нашу силу." #NT!
 nd_bel.2.t: "Конституция Бельгии" #NT!
 nd_bel.2.d: "7 февраля 1831 года Национальный конгресс принял одну из самых прогрессивных конституций Европы. Он установил конституционную монархию с широкими гарантиями индивидуальных свобод, свободы печати, свободы ассоциаций, свободы вероисповедания и свободы образования. Титул «Король бельгийцев», а не «Король Бельгии» был выбран сознательно, подчеркивая, что суверенитет принадлежит народу, а не короне.\n\nБельгийская модель будет вдохновлять конституционных реформаторов по всему континенту на десятилетия вперед, доказывая, что разнообразная нация может управлять собой посредством закона, а не силы." #NT!
 nd_bel.2.a: "Конституция, достойная свободного народа." #NT!
 nd_bel.3.t: "Силлон Индустриэль" #NT!
 nd_bel.3.d: "Долина реки Самбре-Маас преобразилась. От Монса до Льежа старый сельскохозяйственный ландшафт уступил место непрерывному коридору угольных ям, доменных печей, механических цехов и железнодорожных путей. Металлургический завод Джона Кокерилла в Сераинге стал крупнейшим производственным комплексом на континенте, производящим все: от паровых двигателей до железных рельсов.\n\nБельгия теперь является первой страной на материковой Европе, которая полностью индустриализировалась, а Силлон Индустриэль, «Промышленная борозда», является живым доказательством того, что наступил век угля и стали." #NT!
 nd_bel.3.a: "Печи никогда не остынут." #NT!
 nd_bel.4.t: "Антверпенская биржа" #NT!
 nd_bel.4.d: "В 1531 году в Антверпене открылось великолепное новое здание, первая в мире специально построенная товарная биржа. Здесь собираются торговцы со всей Европы, чтобы торговать не только товарами, но и фьючерсами, опционами и векселями. Биржа превратила Антверпен из простого порта в финансовую столицу континента, где ежедневно устанавливаются цены на перец из Индии и серебро из Америки.\n\nНадпись над входом гласит: «Для использования купцами всех наций и всех языков» — подходящий девиз для города, который приветствует мир." #NT!
 nd_bel.4.a: "Торговля не знает границ." #NT!
 nd_bel.5.t: "Фламандские примитивы" #NT!
 nd_bel.5.d: "Революция в живописи произошла в мастерских Фландрии. Ян ван Эйк, работая при бургундском дворе в Брюгге, усовершенствовал технику масляной живописи, добившись яркости и детализации, которые поражают всех, кто видит его работы. Его Гентский алтарь, завершенный в 1432 году, считается величайшей картиной Европы.\n\nРогир ван дер Вейден в Брюсселе, Ганс Мемлинг в Брюгге и Гуго ван дер Гус в Генте продолжают традицию, превращая Нидерланды в художественный центр Северной Европы. Итальянские мастера пересекают Альпы, чтобы изучить свои техники." #NT!
 nd_bel.5.a: "Пусть мир восхитится фламандским мастерством." #NT!
 nd_bel_flemish_cloth_halls: "Фламандские Суконные Галереи" #NT!
 nd_bel_flemish_cloth_halls_desc: "Великий Лакенхаллен в Ипре, Брюгге и Генте, где фламандские ткани проверялись, сортировались и продавались купцам со всей Европы." #NT!
 nd_bel_bruges_banking: "Брюгге Банковское дело" #NT!
 nd_bel_bruges_banking_desc: "Финансовые инновации Брюгге, где итальянские купцы-банкиры основали первую биржу и впервые использовали инструменты международного торгового финансирования." #NT!
 nd_bel_burgundian_tapestries: "Бургундские гобелены" #NT!
 nd_bel_burgundian_tapestries_desc: "Гобеленовые мастерские в Брюсселе, Турне и Аррасе производили лучшие тканые произведения искусства в Европе, украшавшие дворы королей от Парижа до Рима." #NT!
 nd_bel_flemish_primitives: "Фламандские примитивы" #NT!
 nd_bel_flemish_primitives_desc: "Революционная школа нидерландских живописцев (Ван Эйк, Ван дер Вейден, Мемлинг), доведших до совершенства масляную живопись и преобразовавших европейское искусство." #NT!
 nd_bel_walloon_guards_tradition: "Валлонская гвардейская традиция" #NT!
 nd_bel_walloon_guards_tradition_desc: "Традиция элитной католической пехоты, набранной из Валлонии, служившей профессиональными солдатами в армиях Испании и позже составившей основу бельгийской военной идентичности." #NT!
 nd_bel_antwerp_bourse: "Антверпенская биржа" #NT!
 nd_bel_antwerp_bourse_desc: "Первая в мире специализированная товарная биржа, основанная в Антверпене в 1531 году, где купцы всех стран торговали товарами, фьючерсами и векселями." #NT!
 nd_bel_plantin_press: "Плантен Пресс" #NT!
 nd_bel_plantin_press_desc: "Типография Кристофа Плантена в Антверпене стала крупнейшей в Европе, издав Полиглотическую Библию и сделав Нидерланды центром книжного производства." #NT!
 nd_bel_fortified_cities: "Укрепленные города" #NT!
 nd_bel_fortified_cities_desc: "Укрепленные городские центры Южных Нидерландов (Антверпен, Брюссель, Гент, Намюр), стены и бастионы которых делали их грозными оплотами." #NT!
 nd_bel_liege_arms_industry: "Льежская оружейная промышленность" #NT!
 nd_bel_liege_arms_industry_desc: "Оружейные заводы Льежа и его окрестностей, производящие огнестрельное оружие, холодное оружие и доспехи известного качества для армий по всей Европе.\n\n#italic Доступно в: $nd_bel_liege_armory$#!" #NT!
 nd_bel_abbey_brewing: "Аббатские пивоваренные традиции" #NT!
 nd_bel_abbey_brewing_desc: "Монашеские традиции пивоварения бельгийских траппистских и монастырских пивоварен, где монахи на протяжении веков совершенствовали искусство приготовления эля." #NT!
 nd_bel_lace_industry: "Брюссельская кружевная промышленность" #NT!
 nd_bel_lace_industry_desc: "Нежное игольное кружево из Брюсселя, Брюгге и Мехелена — роскошный текстиль, ценимый при дворах Европы." #NT!
 nd_bel_collateral_councils: "Дополнительные советы" #NT!
 nd_bel_collateral_councils_desc: "Государственный совет, Тайный совет и Финансовый совет, которые управляли Южными Нидерландами при правлении Габсбургов, обеспечивая административную преемственность." #NT!
 nd_bel_antwerp_diamond_exchange: "Антверпенская алмазная биржа" #NT!
 nd_bel_antwerp_diamond_exchange_desc: "Квартал огранки алмазов Антверпена, где искусные мастера превращали необработанные камни в блестящие драгоценные камни, сделав город мировой столицей торговли алмазами.\n\n#italic Доступно в: $nd_bel_diamantwijk$#!" #NT!
 nd_bel_cockerill_ironworks: "Кокериллский металлургический завод" #NT!
 nd_bel_cockerill_ironworks_desc: "Интегрированный производственный комплекс Джона Кокерилла в Серенге недалеко от Льежа, крупнейший металлургический завод на европейском континенте, производящий паровые двигатели, рельсы и оборудование." #NT!
 nd_bel_sillon_industriel: "Силлон Индустриэль" #NT!
 nd_bel_sillon_industriel_desc: "Промышленный коридор вдоль долины Самбре-Маас от Монса до Льежа, где добыча угля, производство стали и машиностроение превратили Бельгию в первую промышленно развитую страну на континенте." #NT!
 nd_bel_civic_guard_tradition: "Традиция Гражданской гвардии" #NT!
 nd_bel_civic_guard_tradition_desc: "Garde Civique, гражданское ополчение, которое защищало Бельгийскую революцию и поддерживало порядок в новом государстве, опираясь на древнюю традицию городских ополчений в Нидерландах." #NT!
 nd_bel_canal_infrastructure: "Инфраструктура канала" #NT!
 nd_bel_canal_infrastructure_desc: "Сеть каналов, соединяющая системы рек Шельда, Маас и Рейн, позволяет дешево транспортировать уголь, сталь и промышленные товары через Нидерланды." #NT!
 nd_bel_verviers_wool: "Шерстяная промышленность Вервье" #NT!
 nd_bel_verviers_wool_desc: "Механизированная промышленность по переработке шерсти в Вервье, где Уильям Кокерилл установил первые на континенте прядильные машины, превратив ремесленные мастерские в современные фабрики.\n\n#italic Доступно в: $nd_bel_tapisserie$#!" #NT!
 nd_bel_constitution_of_1831: "Конституция 1831 года" #NT!
 nd_bel_constitution_of_1831_desc: "Одна из самых либеральных конституций в Европе, устанавливающая свободу прессы, свободу объединений и конституционную монархию, при которой суверенитет принадлежит народу." #NT!
 nd_bel_chasseurs_ardennais: "Егеря Арденне" #NT!
 nd_bel_chasseurs_ardennais_desc: "Элитные специалисты легкой пехоты Арденнских лесов и холмов, известные своим упорством, полевым мастерством и зелеными беретами со знаками отличия в виде кабана." #NT!
 nd_bel_continental_railways: "Континентальные железные дороги" #NT!
 nd_bel_continental_railways_desc: "Новаторская железнодорожная сеть Бельгии, первая на европейском континенте, соединившая Брюссель с Мехеленом в 1835 году и быстро расширяющаяся, чтобы связать все основные промышленные центры." #NT!
 nd_bel_national_bank: "Национальный Банк" #NT!
 nd_bel_national_bank_desc: "Национальный банк Бельгии создан для обеспечения финансовой стабильности, управления валютой и поддержки кредитных потребностей новой индустриальной экономики." #NT!
 nd_bel_walloon_steelworks: "Валлонский металлургический завод" #NT!
 nd_bel_walloon_steelworks_desc: "Развитая сталелитейная промышленность Валлонии, где бессемеровский процесс и мартеновские печи производят конструкционную сталь, из которой строятся железные дороги, мосты и заводы по всей Европе.\n\n#italic Доступно в: $nd_bel_cockerillsmelterij$#!" #NT!
 nd_bel_linguistic_compromise: "Лингвистический компромисс" #NT!
 nd_bel_linguistic_compromise_desc: "Прагматическое соглашение между фламандским и валлонским сообществами, признающее, что сила Бельгии заключается в единстве через разнообразие, а не в принудительной ассимиляции." #NT!
 a_nd_bel_walloon_guards: "Валлонская гвардия" #NT!
 a_nd_bel_walloon_guards_desc: "Элитная профессиональная пехота, набранная из католической Валлонии. Первоначально воспитанные для испанской службы, эти дисциплинированные солдаты известны своей стойкостью в бою и преданностью своим командирам." #NT!
 a_nd_bel_civic_guard: "Гражданский страж" #NT!
 a_nd_bel_civic_guard_desc: "Вооруженная гражданская милиция, сформированная из городского населения. Наследники древней традиции гражданских ополчений Нидерландов, Гражданская гвардия защищает бельгийское государство с рвением тех, кто боролся за свою свободу." #NT!
 a_nd_bel_chasseurs_ardennais: "Егеря Арденне" #NT!
 a_nd_bel_chasseurs_ardennais_desc: "Элитная легкая пехота Арденн, обученная ведению боевых действий в лесу, тактике засад и быстрому передвижению по труднопроходимой местности. Их зеленые береты обозначают их как «Зеленых волков» бельгийской армии." #NT!
 nd_bel_lakenhalle: "Лакенхалле" #NT!
 nd_bel_lakenhalle_desc: "Большой зал для осмотра и торговли тканями во фламандских традициях, где ткани оцениваются по качеству и продаются торговцам со всей Европы." #NT!
 nd_bel_tapisserie: "Таписсери" #NT!
 nd_bel_tapisserie_desc: "Гобеленовая мастерская в бургундских традициях, где искусные ткачи создают великолепные текстильные произведения из шерсти, шелка и драгоценных красителей." #NT!
 nd_bel_abdijbrouwerij: "Абдиджброуверий" #NT!
 nd_bel_abdijbrouwerij_desc: "Монастырская пивоварня, где монахи-трапписты варят неповторимый эль по традиционным рецептам, отточенным веками созерцательного труда." #NT!
 nd_bel_drukkerij: "Друккерий" #NT!
 nd_bel_drukkerij_desc: "Типографская мастерская в традициях Officina Кристофа Плантена, выпускающая книги, карты и брошюры, которые распространяют знания по всей Европе." #NT!
 nd_bel_diamantwijk: "Диамантвейк" #NT!
 nd_bel_diamantwijk_desc: "Квартал огранки и полировки алмазов, где мастера превращают необработанные камни в блестящие драгоценные камни, что делает его мировым центром торговли алмазами." #NT!
 nd_bel_vesting: "Вестинг" #NT!
 nd_bel_vesting_desc: "Звездная крепость в традициях Южных Нидерландов с наклонными бастионами и многоуровневой обороной, способной противостоять осадной артиллерии." #NT!
 nd_bel_liege_armory: "Льежская оружейная палата" #NT!
 nd_bel_liege_armory_desc: "Оружейная мастерская в традициях княжеского епископства Льежского, где опытные оружейники производят огнестрельное оружие и вооружение известного качества для армий по всей Европе." #NT!
 nd_bel_cockerillsmelterij: "Кокериллсмелтерий" #NT!
 nd_bel_cockerillsmelterij_desc: "Интегрированный чугунолитейный завод и оборудование работают в стиле комплекса Сераинг Кокерилла, производя сталь, паровые двигатели и промышленное оборудование." #NT!
 nd_bel_lakenhalle_upkeep: "Уход за Суконными Залами" #NT!
 nd_bel_lakenhalle_upkeep_desc: "Сырая шерсть, красители, готовая ткань и бумажные книги, необходимые для поддержания в зале инспекционных и торговых операций." #NT!
 nd_bel_tapestry_weaving: "Гобеленовое плетение" #NT!
 nd_bel_tapestry_weaving_desc: "Кропотливое ремесло плетения величественных гобеленов из шерсти, шелка и драгоценных красок, каждое изделие — произведение искусства, на создание которого могут уйти месяцы." #NT!
 nd_bel_abbey_ale_brewing: "Пивоварение Abbey Ale" #NT!
 nd_bel_abbey_ale_brewing_desc: "Монашеское искусство приготовления богатых, сложных элей с использованием пшеницы, меда и секретных рецептов передавалось из поколения в поколение монахов-траппистов." #NT!
 nd_bel_book_printing: "Книгопечатание" #NT!
 nd_bel_book_printing_desc: "Ремесло набора, печати и переплета книг, от богословских трактатов до навигационных карт, в традициях великой мастерской Плантена." #NT!
 nd_bel_diamond_cutting: "Алмазная резка" #NT!
 nd_bel_diamond_cutting_desc: "Точное искусство раскалывания, огранки и полировки необработанных алмазов до блестящих драгоценных камней — ремесло, которое сделало Антверпен алмазной столицей мира." #NT!
 nd_bel_vesting_upkeep: "Обслуживание крепости" #NT!
 nd_bel_vesting_upkeep_desc: "Камень, вооружение, огнестрельное оружие, пушки и инструменты, необходимые для поддержания бастионов и гарнизона звездной крепости в полной оборонительной готовности." #NT!
 nd_bel_cockerill_steel_making: "Производство стали Кокерилл" #NT!
 nd_bel_cockerill_steel_making_desc: "Комплексный процесс плавки железной руды с коксом для производства высококачественной стали для железных дорог, мостов и промышленного оборудования." #NT!
 nd_bel_liege_firearms_production: "Производство огнестрельного оружия в Льеже" #NT!
 nd_bel_liege_firearms_production_desc: "Знаменитые оружейные мастерские Льежа, производящие мушкеты, пистолеты и винтовки исключительного качества для армий по всей Европе." #NT!
 levy_nd_bel_civic_guard: "Гражданский страж" #NT!
 levy_nd_bel_civic_guard_desc: "Бельгийское гражданское ополчение, вооруженные добровольцы из городов и поселков, защищающие свои общины." #NT!
 nd_bel_formed_tt: "была образована Бельгия." #NT!
 nd_bel_path_a_tt: "Выбрал Мастерскую Мира" #NT!
 nd_bel_path_b_tt: "Выберите Клочок бумаги, Щит Наций." #NT!
 nd_bel_destiny: "Бельгийская судьба" #NT!
 nd_bel_destiny_desc: "Бельгия была выкована революцией. Путь вперед начинается со стабильного управления, и только тогда нация сможет следовать избранной судьбе." #NT!
 nd_bel_dest_forge_belt: "Кузнечный пояс" #NT!
 nd_bel_dest_forge_belt_desc: "Обеспечьте безопасность промышленных границ. Уголь Ахена и кузницы Камбре должны попасть под контроль Бельгии, чтобы питать мировую мастерскую." #NT!
 nd_bel_dest_ruhr: "Рурский коридор" #NT!
 nd_bel_dest_ruhr_desc: "Распространить бельгийское промышленное господство на угольные месторождения Вестфалии. Печи Эссена должны подпитывать амбиции Бельгии, а национальное развитие должно соответствовать масштабу этого предприятия." #NT!
 nd_bel_dest_continental_forge: "Континентальная кузница" #NT!
 nd_bel_dest_continental_forge_desc: "От Мааса до Рейна, от Фландрии до Сены Бельгия управляет промышленным сердцем Европы. Кёльн и Париж признают превосходство Бельгии." #NT!
 nd_bel_dest_treaty: "Договорный щит" #NT!
 nd_bel_dest_treaty_desc: "За щитом гарантированного нейтралитета Бельгия процветает. Используйте современное банковское дело и накапливайте богатство, которое делает маленькое государство незаменимым." #NT!
 nd_bel_dest_model: "Модель Конституции" #NT!
 nd_bel_dest_model_desc: "Конституция Бельгии вдохновляет реформаторов по всей Европе. Расширьте свое дипломатическое влияние на Гаагу и развивайте свою страну за пределами ее скромных границ." #NT!
 nd_bel_dest_heart_of_europe: "Сердце Европы" #NT!
 nd_bel_dest_heart_of_europe_desc: "Брюссель стал дипломатической столицей континента. Предметы роскоши текут по бельгийским рынкам, а в бельгийских залах собираются государственные деятели мира." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_industrial_expansion: "Промышленная экспансия" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_industrial_expansion: "Бельгийская промышленность расширяется вдоль угольных пластов и речных долин, защищенная тарифными стенами и поддерживаемая дешевой рабочей силой." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_coal_barons: "Угольные бароны" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_coal_barons: "Капитаны промышленности обладают огромным влиянием, направляя прибыль от шахт в коммерческие предприятия, в то время как рабочие несут издержки промышленного разрушения." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_beacon_of_liberty: "Маяк Свободы" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_beacon_of_liberty: "Либеральная конституция Бельгии и приверженность образованию и инновациям делают ее маяком для прогрессивных мыслителей, хотя пацифистский дух делает войну более дорогостоящим занятием." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_pragmatic_compromise: "Прагматический компромисс" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_pragmatic_compromise: "Бельгийский гений компромисса и согласия объединяет разнообразную нацию и завоевывает лояльность своих партнеров посредством примирения, а не принуждения." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_iron_discipline: "Железная дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_iron_discipline: "Бельгийское вооружение и бельгийская дисциплина являются предметом зависти Европы. Промышленная кузница была превращена в военные цели, хотя неустанное внимание к военной мощи обходится ценой более мягких занятий." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_arsenal_of_europe: "Арсенал Европы" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_arsenal_of_europe: "От арсеналов Льежа до литейных заводов Рура бельгийское оружие вооружает половину континента. Родина — это крепость, хотя индустриальное самоуспокоение угрожает инновациям." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_congress_of_nations: "Конгресс Наций" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_congress_of_nations: "Брюссель стал центром европейской дипломатии, где подписываются договоры, разрешаются споры и баланс сил поддерживается при посредничестве Бельгии." #NT!
 STATIC_MODIFIER_NAME_nd_bel_dest_merchant_republic: "Торговая Республика" #NT!
 STATIC_MODIFIER_DESC_nd_bel_dest_merchant_republic: "Бельгийские купцы контролируют перекресток европейской торговли. Антверпенская биржа устанавливает цены, брюссельские банки устанавливают условия, а порт Остенде соединяет континент с миром." #NT!
 nd_bel.6.t: "Судьба выкована" #NT!
 nd_bel.6.d: "Бельгия стоит. Рожденная в результате революции и связанная конституцией, эта маленькая нация на перекрестке Европы доказала, что она может выжить. Великие державы, возможно, и гарантировали наши границы, но именно мы должны решить, какой нацией мы станем.\n\nПуть вперед мы выбираем сами." #NT!
 nd_bel.6.a: "Бельгия выстоит." #NT!
 nd_bel.7.t: "Кузнечный пояс закреплен" #NT!
 nd_bel.7.d: "Пограничные земли перешли в руки Бельгии. Мастерские Ахена и кузницы Камбре теперь обслуживают бельгийскую промышленность. Уголь и железо на границе питают растущий спрос на сталь, а доменные печи горят день и ночь.\n\nЭто только начало. Дальше ждут еще большие награды: огромные угольные месторождения Рура." #NT!
 nd_bel.7.a: "Печи никогда не остынут." #NT!
 nd_bel.8.t: "Под договорным щитом" #NT!
 nd_bel.8.d: "Договор гарантии остается в силе. За этим щитом из бумаги и чернил Бельгия процветает так, как не могут империи. Наши банки кредитуют королей, наши торговцы торгуют со всеми, а наш нейтралитет — это основа, на которой зиждется континентальный мир.\n\nПозвольте другим вести войну. Бельгия будет богатеть в мире." #NT!
 nd_bel.8.a: "Мир – наша крепость." #NT!
 nd_bel.9.t: "Рурский коридор" #NT!
 nd_bel.9.d: "Бельгийская промышленность теперь простирается глубоко в угольные месторождения Вестфалии. Интеграция рурского угля с бельгийской сталелитейной компанией создала промышленный комплекс, которому нет равных на континенте. Дым поднимается из тысяч труб, а железнодорожные пути становятся толще с каждым месяцем.\n\nНо мощь такого масштаба требует выбора. Будем ли мы защищать нашу промышленность тарифными стенами или позволим угольным баронам перекраивать наше общество так, как они считают нужным?" #NT!
 nd_bel.9.a: "Поднимите тарифы: защитите бельгийскую промышленность!" #NT!
 nd_bel.9.b: "Пусть промышленники строят свои империи." #NT!
 nd_bel.10.t: "Бельгийская модель" #NT!
 nd_bel.10.d: "Реформаторы от Берлина до Буэнос-Айреса изучают конституцию Бельгии. Наше разделение властей, наша гарантия индивидуальных свобод, наше принятие языкового разнообразия — эти нововведения сделали Бельгию моделью для стран, стремящихся управлять собой посредством закона, а не силы.\n\nСледуем ли мы полагаться на эту роль как на маяк прогрессивных реформ, или мы должны сделать акцент на прагматических компромиссах, которые скрепляют нашу собственную разнообразную нацию?" #NT!
 nd_bel.10.a: "Пусть Бельгия будет маяком свободы!" #NT!
 nd_bel.10.b: "Компромисс – это бельгийский гений." #NT!
 nd_bel.11.t: "Континентальная кузница" #NT!
 nd_bel.11.d: "От шпилей Кельна до бульваров Парижа Бельгия управляет индустриальным сердцем Европы. Великие города континента признают то, что всегда знали угольные и сталелитейные магнаты: нация, которая контролирует кузницу, контролирует будущее.\n\nБельгийское оружие и бельгийская сталь создали промышленную империю. Должны ли мы выковать железную дисциплину, чтобы защитить ее, или станем арсеналом, вооружающим всю Европу?" #NT!
 nd_bel.11.a: "Дисциплина: кузница требует порядка." #NT!
 nd_bel.11.b: "Пусть бельгийское оружие снабжает континент." #NT!
 nd_bel.12.t: "Сердце Европы" #NT!
 nd_bel.12.d: "Брюссель стал тем, чем когда-то была Вена, дипломатической столицей континента. В величественных дворцах на улице Рю де ла Лой послы ведут переговоры, составляются договоры и дела наций решаются за бельгийским шоколадом и траппистским элем.\n\nМир приходит в Брюссель. Станем ли мы постоянным конгрессом наций или позволим нашим купцам превратить этот дипломатический капитал в торговый?" #NT!
 nd_bel.12.a: "Брюссель будет арбитром дел наций." #NT!
 nd_bel.12.b: "Пусть коммерция станет языком дипломатии." #NT!
 nd_bel_wapenfabriek: "Вапенфабрик" #NT!
 nd_bel_wapenfabriek_desc: "Бельгийский национальный оружейный завод, сочетающий традиции оружейного дела Льежа с рурской сталью и промышленным производством для производства оружия для армий Европы." #NT!
 nd_bel_national_arms_production: "Национальное производство оружия" #NT!
 nd_bel_national_arms_production_desc: "Промышленное производство оружия и военной техники, сочетающее железо, уголь и точные инструменты в заводском комплексе, который затмевает традиционную оружейную мастерскую." #NT!
 nd_bel_palais_des_nations: "Дворец Наций" #NT!
 nd_bel_palais_des_nations_desc: "Грандиозный дипломатический дворец, где европейские государственные деятели собираются для заключения договоров, разрешения споров и ведения дел между странами благодаря бельгийскому гостеприимству." #NT!
 nd_bel_diplomatic_upkeep: "Дипломатическое гостеприимство" #NT!
 nd_bel_diplomatic_upkeep_desc: "Значительные расходы на содержание дипломатического дворца, прекрасных канцелярских товаров, роскошной мебели, импортных вин и элегантной обстановки, ожидаемой для высокопоставленных гостей." #NT!
  
  # ===== BUREAUCRACIES ===== 
 bel_joyous_entry_bureaucracy: "Радостный въезд в Брабант" #NT!
 bel_joyous_entry_bureaucracy_desc: "Конституционная хартия, предоставленная герцогиней Иоанной и герцогом Вацлавом 3 января 1356 года, обязывающая каждого герцога-преемника соблюдать обычное право и требующая согласия сословий на новые налоги и герцогские назначения. Хартия, вновь принесенная к присяге каждым принцем в своем Инкомсте, закрепила право неповиновения незаконным приказам и сделала Брабант первым государством Нидерландов, которое ограничивало своего принца писаным законом." #NT!
 bel_great_council_mechelen_bureaucracy: "Большой Совет Мехелена" #NT!
 bel_great_council_mechelen_bureaucracy_desc: "Карл Смелый сделал Мехелен резиденцией верховного суда Нидерландов в 1473 году; Филипп Красивый сделал его постоянным в 1504 году. Заседая в Шепенхейсе, Великий совет рассматривал апелляции всех провинциальных советов семнадцати провинций и осуществлял кассационное рассмотрение местных сеньорских судов, связывая королевство единой юрисдикцией до отмены его французами в 1795 году." #NT!
 bel_collateral_councils_bureaucracy: "Дополнительные советы" #NT!
 bel_collateral_councils_bureaucracy_desc: "Реформа Карла V 1 октября 1531 года реорганизовала центральное правительство Габсбургских Нидерландов в три брюссельских совета: Государственный совет по великим делам войны и династии, Тайный совет или Geheime Raad для юридических и административных постановлений и Финансовый совет. Это трио занималось повседневной деятельностью семнадцати провинций Гранвеля, Эгмонта, Оранжа и Хорна до падения режима в 1790-х годах." #NT!
 bel_antwerp_bourse_bureaucracy: "Антверпенская биржа" #NT!
 bel_antwerp_bourse_bureaucracy_desc: "Первая в мире специально построенная товарная биржа, открытая в 1531 году по проекту Брабантийской готики Домиена де Вагемакера. Каждая иностранная торговая нация (португальская, испанская, английская, ганзейская, флорентийская) поддерживала стоячую площадку под колоннадой, где рядом с английской тканью котировались переводные векселя и антверпенский перец. Эту модель скопировала Королевская биржа Грешема в Лондоне, затем Амстердам, Роттердам, Лилль и все крупные торговые столицы." #NT!
 bel_four_members_bureaucracy: "Четыре члена Фландрии" #NT!
 bel_four_members_bureaucracy_desc: "Парламент фламандской шерстяной экономики, образованный Гентом, Брюгге, Ипром и Франком Брюгге. Гильдии суконных мастерских в каждом городе предоставили членам базу вооруженных ткачей и сукнольщиков; их отказ от налогов мог привести к банкротству графов и герцогов, что и произошло. К 1360-м годам деканы гильдий получали гражданскую зарплату и сидели рядом с патрициями, превращая членов в орган, в котором ремесленники помогали формировать законы своих городов." #NT!
 bel_etats_de_liege_bureaucracy: "Три поместья Льежа" #NT!
 bel_etats_de_liege_bureaucracy_desc: "Постановление 1684 года закрепило конституцию княжества-епископа: принц-епископ должен был управлять только по согласованию с высшим духовенством Сен-Ламбера, пятнадцатью названными дворянскими семьями, представляющими сельскую местность, и буржуазией, организованной в тридцать два ремесла. Мэры и советники были выбраны из шестнадцати пожизненных избирательных палат. Соглашение действовало до Льежской революции 1789-91 годов и французской аннексии 1795 года." #NT!
 bel_societe_generale_bureaucracy: "Общее общество Бельгии" #NT!
 bel_societe_generale_bureaucracy_desc: "Основанная в 1822 году королем Вильгельмом I как Algemeene Maatschappij ter, начавшая деятельность по созданию народного движения, и унаследованная в нетронутом виде новым бельгийским государством в 1830 году. При Фердинанде де Меусе Société Générale стала пионером в сфере промышленного банкинга на континенте, финансируя угольные карьеры в Эно, металлургические заводы в Льеже, а с 1834 года — всемирную банковскую деятельность. вторая сеть железных дорог общего пользования. Благодаря созданию Banque de Belgique в 1835 году Брюссель стал финансовой столицей ранней индустриальной Европы." #NT!
  
  # The auto-modifier governing slot grant on formation 
 AUTO_MODIFIER_NAME_nd_bel_bureaucracy_authority: "Бельгийское институциональное управление" #NT!
 AUTO_MODIFIER_DESC_nd_bel_bureaucracy_authority: "При формировании [BEL.GetName] наследует многоуровневую институциональную историю Южных Нидерландов (средневековые хартии Брабанта и Фландрии, советы Бургундии-Габсбургов, три сословия Льежуа и конституционную монархию 1831 года) и получает возможности для управления исторической бюрократией." #NT!
