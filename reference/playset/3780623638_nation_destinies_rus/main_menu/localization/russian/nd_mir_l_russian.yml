l_russian:
 STATIC_MODIFIER_NAME_nd_hasina_of_the_highlands: "Хасина из Горной местности" #NT!
 STATIC_MODIFIER_DESC_nd_hasina_of_the_highlands: "Священная власть горной местности течет через централизованное государство. Благодаря ирригации, кодифицированному праву и божественному повелению Андрианы королевство превращает свое горное сердце в житницу островного государства." #NT!
 STATIC_MODIFIER_NAME_nd_island_of_a_thousand_ports: "Остров тысячи портов" #NT!
 STATIC_MODIFIER_DESC_nd_island_of_a_thousand_ports: "Побережье Мадагаскара изобилует каноэ с выносными опорами, перевозящими товары через Мозамбикский пролив и за его пределы. Следуя традиции Сакалавы, объединенный остров проецирует власть через Индийский океан посредством превосходства на море и торгового флота." #NT!
 STATIC_MODIFIER_NAME_nd_sorabe_scholarly_tradition: "Научная традиция Сорабе" #NT!
 STATIC_MODIFIER_DESC_nd_sorabe_scholarly_tradition: "Ученые Антеморо принесли ко двору искусство письма, записывая законы, пророчества и истории арабо-малагасийским письмом сорабе." #NT!
 STATIC_MODIFIER_NAME_nd_fanompoana_state_labor: "Государственный труд Фаномпоана" #NT!
 STATIC_MODIFIER_DESC_nd_fanompoana_state_labor: "Корона повелевает трудом своих подданных на общественных работах, оросительных каналах, дорогах, укреплениях и военной службе. Государство становится могущественным, но цена этого тяжело ложится на плечи простых людей." #NT!
 STATIC_MODIFIER_NAME_nd_fanompoana_commuted_taxes: "Фаномпоана заменена налогами" #NT!
 STATIC_MODIFIER_DESC_nd_fanompoana_commuted_taxes: "Вместо того, чтобы напрямую требовать рабочую силу, корона принимает оплату рисом и серебром. Люди процветают в свободное время, а казна пополняется плодами более эффективной экономики." #NT!
 nd_mir.1.t: "Объединение Мадагаскара" #NT!
 nd_mir.1.d: "Великий остров наконец-то стал единым. На протяжении поколений мерина с высокогорья, сакалава с западного побережья, бецилео с южных гор и ученые Антеморо с юго-востока строили каждый свои собственные королевства. Теперь, благодаря завоеваниям, дипломатии и священной власти хасины, ими всеми управляет один правитель.\n\nНо объединение ставит фундаментальный вопрос. Сила Мадагаскара всегда была двойной: продуктивные высокогорные рисовые террасы, которые кормят миллионы людей, и обширная береговая линия, чьи выносные флоты соединяют остров с торговыми путями Индийского океана. Новое королевство должно выбрать, какая из этих традиций будет определять его характер.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mir.1.a: "Мы будем возделывать высокогорья и править со священных холмов." #NT!
 nd_mir.1.b: "Мы будем командовать морями из тысячи портов." #NT!
 nd_mir.2.t: "Рукописи Сорабе" #NT!
 nd_mir.2.d: "Ученые Антеморо на юго-восточном побережье являются хранителями замечательной традиции. Происходя от арабских купцов и суахили, поселившихся в устье реки Матитанана, они разработали сорабе: систему письма на малагасийском языке с использованием арабской графики. В их рукописях записаны не только религиозные тексты, но и астрологические карты, медицинские средства, генеалогии и истории королей.\n\nПризнавая силу грамотности, суд пригласил Антеморо омбиаси служить писцами, астрологами и советниками. Впервые законы королевства и заявления его правителей будут записаны в письменной форме, что привнесет порядок и постоянство в то, что когда-то передавалось только через устную традицию." #NT!
 nd_mir.2.a: "Пусть мудрость Сорабе осветит наш двор." #NT!
 nd_mir.3.t: "Вопрос о Фаномпоане" #NT!
 nd_mir.3.d: "Фаномпоана, система барщинного труда, которой все свободные подданные подчинялись короне, была двигателем роста королевства. Через Фаномпоану были вырыты оросительные каналы, возведены укрепления, проложены дороги через джунгли, а армии отправились на войну. Каждое великое деяние государства было построено на плечах его народа.\n\nНо система напрягается под собственным весом. Фермеры, ушедшие с полей во время посевной, возвращаются и обнаруживают, что их семьи голодны. Ремесленники, призванные на отдаленные стройки, не могут заниматься своим ремеслом. Вопрос, который сейчас стоит перед короной, заключается в том, стоит ли активизировать фаномпоана, чтобы подогреть большие амбиции, или заменить обязательства налогами, уплачиваемыми рисом и монетами, освобождая людей работать на себя, продолжая при этом наполнять королевскую казну." #NT!
 nd_mir.3.a: "Труд народа – основа государства." #NT!
 nd_mir.3.b: "Пусть вместо этого они платят рисом и серебром." #NT!
 nd_mir.4.t: "Священный холм Амбохиманга" #NT!
 nd_mir.4.d: "Возвышающийся на центральном нагорье к северо-востоку от Антананариву, укрепленный холм Амбохиманга стал духовным сердцем королевства. Его рова (комплекс деревянных дворцов, каменных стен и священных оград) олицетворяет союз политической власти и власти предков, определяющий малагасийскую королевскую власть.\n\nВеликие врата Амбохиманги, закрывающиеся каждую ночь массивным каменным диском, перекатывающим вход, охраняют не просто поселение, но и концепцию: сама земля священна, и что те, кто правят с ее высоты, делают это с благословения Разаны: предков, которые наблюдают за своими потомками из мира за пределами." #NT!
 nd_mir.4.a: "Амбохиманга станет нашей вечной цитаделью." #NT!
 nd_mir.5.t: "Модернизация Королевства" #NT!
 nd_mir.5.d: "В горах дует новый ветер. Вдохновленная контактами с европейскими державами (особенно с Великобританией, которая прислала военных советников и миссионеров), корона предпринимает масштабную программу модернизации. Солдаты Мерины тренируются в европейских формированиях, учатся стрелять из мушкетов дисциплинированными залпами, а не традиционными воинскими атаками.\n\nПомимо армии, реформы затрагивают все аспекты королевства. Латинский алфавит заменяет сценарий Сорабе для официальной переписки. Открываются школы по обучению чтению и арифметике. Ремесленники организованы в мастерские, производящие товары для государства. Старые способы не оставлены. Фади по-прежнему управляют повседневной жизнью, а предки по-прежнему наблюдают за происходящим из Амбохиманги. Но теперь к ним присоединились новые технологии и новые амбиции." #NT!
 nd_mir.5.a: "Мы овладеем инструментами современного мира." #NT!
 nd_mir_austronesian_seafaring: "Австронезийское мореходное наследие" #NT!
 nd_mir_austronesian_seafaring_desc: "Предки пересекли Индийский океан на каноэ с выносными опорами. Их потомки поддерживают эту традицию мореплавания вдоль побережья Мадагаскара." #NT!
 nd_mir_vazimba_legacy: "Наследие Вазимбы" #NT!
 nd_mir_vazimba_legacy_desc: "Горные воины, вытеснившие первых жителей Мадагаскара, создали боевую традицию использования копья и щита, которая сохранилась в ротах Мпиамбина." #NT!
 nd_mir_irrigated_rice_paddies: "Орошаемые рисовые поля" #NT!
 nd_mir_irrigated_rice_paddies_desc: "Техника террасного орошаемого выращивания риса Бетсилео превращает высокогорные долины в самые продуктивные сельскохозяйственные угодья в Индийском океане." #NT!
 nd_mir_zebu_cattle_tradition: "Традиция крупного рогатого скота зебу" #NT!
 nd_mir_zebu_cattle_tradition_desc: "Крупный рогатый скот зебу — это богатство, статус и священный долг в малагасийском обществе. Их рога венчают королевские гробницы, их мясо кормит живых, а их шкуры переплетают рукописи Сорабе." #NT!
 nd_mir_fady_taboo_system: "Система Табу Фади" #NT!
 nd_mir_fady_taboo_system_desc: "Сложная система фади (наследственные табу, регулирующие поведение, еду, место и время) объединяет малагасийское общество посредством общих духовных обязательств." #NT!
 nd_mir_andriana_caste_system: "Кастовый Орден Андрианы" #NT!
 nd_mir_andriana_caste_system_desc: "Кодификация касты дворян андриана, свободных людей хова и класса рабов андево создает стабильную социальную иерархию, основанную на наследственном статусе и королевских указах." #NT!
 nd_mir_highland_settlement: "Хайленд-Сеттлмент" #NT!
 nd_mir_highland_settlement_desc: "Центральное нагорье предлагает естественную защиту, плодородную почву и свободу от малярии, которая поражает побережье, вызывая заселение и рост населения." #NT!
 nd_mir_fokonolona_governance: "Деревенские собрания Фоконолона" #NT!
 nd_mir_fokonolona_governance_desc: "Фоконолона, деревенские советы старейшин и знати, управляют местными делами посредством консенсуса, выступая посредниками в спорах и организуя общественный труд задолго до того, как какой-либо король заявил о своем суверенитете над ними." #NT!
 nd_mir_highland_ironworking: "Хайлендская металлургическая промышленность" #NT!
 nd_mir_highland_ironworking_desc: "Кузнецы высокогорья выплавляли железо из латеритовых руд, используя угольные печи, производя инструменты, оружие и сельскохозяйственные орудия, поддерживающие королевство." #NT!
 nd_mir_lamba_silk_weaving: "Ламба Шелковое Ткачество" #NT!
 nd_mir_lamba_silk_weaving_desc: "Ламба, шелковая или хлопчатобумажная ткань, которую живые носят как шаль, а мертвые — как саван, является высшим выражением малагасийского текстильного искусства. На изготовление лучшей ламба-акотофаханы уходят месяцы." #NT!
 nd_mir_sorabe_writing: "Традиция письма сорабе" #NT!
 nd_mir_sorabe_writing_desc: "Омбиаси Антеморо разработало малагасийское письмо Сорабе, написанное арабскими буквами, для записи астрологии, медицины, истории и королевских генеалогий." #NT!
 nd_mir_antemoro_astrologers: "Придворные астрологи Антеморо" #NT!
 nd_mir_antemoro_astrologers_desc: "Антеморо омбиасы служат астрологами и советниками при дворах малагасийских королей, читая винтану: судьбу, написанную звездами и фазами луны." #NT!
 nd_mir_sakalava_expansion: "Расширение Сакалавы" #NT!
 nd_mir_sakalava_expansion_desc: "Королевства Сакалава Менабе и Бойна агрессивно расширяются вдоль западного побережья, их воины быстро перемещаются по ландшафту, который они хорошо знают." #NT!
 nd_mir_indian_ocean_contacts: "Торговые контакты в Индийском океане" #NT!
 nd_mir_indian_ocean_contacts_desc: "Арабские, суахили, а позже и европейские купцы заходят в порты Мадагаскара, обменивая ткани, керамику и металлические изделия на рис, крупный рогатый скот, пчелиный воск и порабощенных пленников." #NT!
 nd_mir_outrigger_war_fleets: "Аутриггерные военные флоты" #NT!
 nd_mir_outrigger_war_fleets_desc: "Боевые каноэ Сакалава, большие лакана с выносными опорами, на борту которых находится тридцать или более воинов, пересекают Мозамбикский пролив огромными сезонными флотилиями, совершающими набеги, нанося удары по Коморским островам и восточноафриканскому побережью." #NT!
 nd_mir_rova_fortification: "Укрепление Рова" #NT!
 nd_mir_rova_fortification_desc: "Комплексы рова на вершине холма (укрепленные дворцы-цитадели из камня, дерева и затвердевшей глины) сочетают в себе политическую резиденцию и военный опорный пункт, их массивные каменные ворота-диски запечатываются каждую ночь." #NT!
 nd_mir_menabe_boina_kingdoms: "Королевства Менабе и Бойна" #NT!
 nd_mir_menabe_boina_kingdoms_desc: "Два великих королевства Сакалава, Менабе на юге и Бойна на севере, вместе доминируют на западе Мадагаскара и распространяют свое влияние на весь остров." #NT!
 nd_mir_hasina_sacred_power: "Священная власть Хасина" #NT!
 nd_mir_hasina_sacred_power_desc: "Хасина, священная власть, передаваемая от предков через правящую династию, узаконивает королевскую власть и превращает политическое повиновение в духовный долг." #NT!
 nd_mir_slave_trade_profits: "Работорговля в Индийском океане" #NT!
 nd_mir_slave_trade_profits_desc: "Маскаренские плантационные экономики Реюньона и Маврикия создают ненасытный спрос на порабощенных рабочих, которых малагасийские королевства удовлетворяют с целью получения значительной прибыли." #NT!
 nd_mir_coastal_raiding: "Прибрежные рейдерские традиции" #NT!
 nd_mir_coastal_raiding_desc: "Малагасийские рейдеры на аутригерных флотах нападают на прибрежные поселения в западной части Индийского океана, молниеносными ударами захватывая пленников и товары, а затем отступают в море." #NT!
 nd_mir_trano_gasy_architecture: "Трано Газовая Архитектура" #NT!
 nd_mir_trano_gasy_architecture_desc: "Трано-гази (традиционный малагасийский дом из кирпича, дерева и соломы, ориентированный с севера на юг в соответствии с космическими принципами) превращается в аристократическую архитектурную традицию в горной местности." #NT!
 nd_mir_fanompoana_system: "Система труда Фаномпоана" #NT!
 nd_mir_fanompoana_system_desc: "Фаномпоана, барщинный труд, который все свободные подданные обязаны короне, строит каналы, дороги и укрепления, а также собирает армии. Это двигатель государственной власти и бремя простых людей." #NT!
 nd_mir_standing_army_reform: "Реформа постоянной армии" #NT!
 nd_mir_standing_army_reform_desc: "Корона формирует постоянные полки, тафика, вооруженные как традиционными копьями, так и приобретенными мушкетами, превращая их в дисциплинированные постоянные силы." #NT!
 nd_mir_antananarivo_capital: "Антананариву как столица" #NT!
 nd_mir_antananarivo_capital_desc: "Город на тысяче холмов становится бесспорной столицей единого Мадагаскара, его рынки, дворцы и мастерские привлекают население со всего острова." #NT!
 nd_mir_betsileo_integration: "Интеграция Бетсилео" #NT!
 nd_mir_betsileo_integration_desc: "Завоеванные королевства Бетсилео интегрированы в государство Мерина, их сельскохозяйственный опыт, особенно террасное выращивание риса, обогащает единое королевство." #NT!
 nd_mir_musket_acquisition: "Приобретение и производство мушкетов" #NT!
 nd_mir_musket_acquisition_desc: "Благодаря торговле с европейцами и принудительному труду квалифицированных мастеров по металлу королевство приобретает и поддерживает растущий арсенал огнестрельного оружия." #NT!
 nd_mir_channel_trade_control: "Торговый канал Мозамбика" #NT!
 nd_mir_channel_trade_control_desc: "Контроль над портами на западном побережье Мадагаскара дает королевству рычаги влияния на торговые пути, пересекающие Мозамбикский канал между Африкой и Индийским океаном." #NT!
 nd_mir_andrianampoinimerina_reforms: "Реформы Андрианампоинимерины" #NT!
 nd_mir_andrianampoinimerina_reforms_desc: "Великий объединитель кодифицирует законы, реорганизует кастовую систему, строит ирригационные сооружения и устанавливает централизованную администрацию, превращая горное вождество в королевство, достойное этого названия." #NT!
 nd_mir_radama_modernization: "Модернизация Радамы" #NT!
 nd_mir_radama_modernization_desc: "Король Радама использует европейские военные методы, приглашая британских советников обучать свою армию мушкетной подготовке, тактике построения и дисциплинированному ведению войны." #NT!
 nd_mir_british_alliance: "Британский Альянс" #NT!
 nd_mir_british_alliance_desc: "Англо-Меринский договор 1820 года обменивал отмену работорговли на британскую военную помощь, дипломатическое признание и доступ к современным технологиям." #NT!
 nd_mir_merina_hegemony: "Мерина Гегемония" #NT!
 nd_mir_merina_hegemony_desc: "Королевство Мерина распространяет свою власть на две трети Мадагаскара посредством военного завоевания и административной интеграции, в результате чего прибрежные народы находятся под контролем горцев." #NT!
 nd_mir_malagasy_literacy: "Кампания по распространению малагасийской грамотности" #NT!
 nd_mir_malagasy_literacy_desc: "Протестантские миссионеры и королевские школы распространили грамотность по всей горной местности, заменив письменность Сорабе латинским алфавитом и открыв доступ к образованию за пределами академической касты Антеморо." #NT!
 nd_mir_rice_surplus_economy: "Экономика излишков риса" #NT!
 nd_mir_rice_surplus_economy_desc: "Расширение орошения и интенсивное террасное земледелие производят излишки риса, которые способствуют росту населения, городской специализации и экспортной торговле." #NT!
 nd_mir_coast_conquest: "Прибрежное завоевание" #NT!
 nd_mir_coast_conquest_desc: "Военно-морской флот Мерины перебрасывает мощь горных районов на побережья, обеспечивая безопасность портов и торговых путей, которые соединяют объединенное королевство с обширным миром Индийского океана." #NT!
 nd_mir_ranavalona_isolation: "Вызывающая изоляция Ранавалоны" #NT!
 nd_mir_ranavalona_isolation_desc: "Королева Ранавалона I изгоняет иностранных миссионеров и торговцев, защищает королевство от европейского вторжения и сохраняет независимость благодаря военной мощи и безжалостной самодостаточности." #NT!
 nd_mir_malagasy_industrialization: "Малагасийская протоиндустриализация" #NT!
 nd_mir_malagasy_industrialization_desc: "Организованные государством мастерские производят текстиль, мыло, кирпичи и изделия из металла для внутреннего потребления, снижая зависимость от импортных товаров." #NT!
 nd_mir_unified_kingdom: "Объединенное Королевство Мадагаскар" #NT!
 nd_mir_unified_kingdom_desc: "Всем островом управляет единый административный аппарат, а местные губернаторы назначаются короной, заменяя независимых королей прошлого." #NT!
 nd_mir_port_modernization: "Модернизация порта" #NT!
 nd_mir_port_modernization_desc: "Королевство модернизирует свои прибрежные гавани для приема более крупных судов и увеличения объемов торговли, соединяя Мадагаскар с глобальной торговлей." #NT!
 nd_mir_malagasy_sovereignty: "Малагасийский суверенитет" #NT!
 nd_mir_malagasy_sovereignty_desc: "Независимый Мадагаскар, управляемый своими законами и традициями, пользуется уважением среди народов Индийского океана." #NT!
 nd_mir_cultural_renaissance: "Малагасийский культурный ренессанс" #NT!
 nd_mir_cultural_renaissance_desc: "Синтез горных и прибрежных, австронезийских и африканских, традиционных и современных традиций создает самобытную малагасийскую культурную самобытность, преодолевающую старые этнические различия." #NT!
 n_nd_mir_lakana: "Лакана" #NT!
 n_nd_mir_lakana_desc: "Лакана — традиционное малагасийское каноэ с выносными опорами, произошедшее непосредственно от судов, которые перевозили первых австронезийских поселенцев через Индийский океан. Легкий, быстрый и идеально адаптированный к прибрежным водам." #NT!
 a_nd_mir_mpiambina: "Мпиамбина Уорриорз" #NT!
 a_nd_mir_mpiambina_desc: "Горные воины-копейщики, составляющие костяк ополчения Мерины. Вооруженные копьями с железными наконечниками и щитами из бычьей шкуры, они сражаются с яростью людей, защищающих холмы своих предков." #NT!
 n_nd_mir_lakana_raider: "Лакана Рейдер" #NT!
 n_nd_mir_lakana_raider_desc: "Более крупное военное каноэ, предназначенное для рейдовых экспедиций через Ла-Манш. Эти аутригеры вмещают тридцать или более воинов и могут обогнать любое европейское судно на мелководье в прибрежных водах." #NT!
 a_nd_mir_tafika: "Тафика Регулярные посетители" #NT!
 a_nd_mir_tafika_desc: "Постоянные полки армии Мерины, вооруженные традиционными копьями и мушкетами. Обученные и дисциплинированные, они являются орудием королевской власти." #NT!
 a_nd_mir_merina_musketeers: "Мерина Мушкетеры" #NT!
 a_nd_mir_merina_musketeers_desc: "Солдаты, обученные европейским мушкетным упражнениям под руководством британских военных советников в рамках программы модернизации короля Радамы. Они стреляют дисциплинированными залпами и держат строй под огнем." #NT!
 nd_mir_rice_terrace: "Рисовая Терраса" #NT!
 nd_mir_rice_terrace_desc: "Орошаемые террасные рисовые поля, высеченные на высокогорных склонах холмов, питаемые тщательно поддерживаемой системой каналов. Бетсилео усовершенствовали эту технику и превратили ее в самое продуктивное земледелие в Индийском океане." #NT!
 nd_mir_rice_terrace_maintenance: "Орошение террас" #NT!
 nd_mir_rice_terrace_maintenance_desc: "Уход за стенами террасы, оросительными каналами и сельскохозяйственными инструментами требует постоянного ухода." #NT!
 nd_mir_rova: "Цитадель Рова" #NT!
 nd_mir_rova_desc: "Укрепленный дворцовый комплекс на вершине холма с каменными стенами, деревянными залами и священными оградами. Рова сочетает в себе военную крепость, королевскую резиденцию и духовный центр: ее массивные каменные ворота в форме диска каждую ночь закрываются от злоумышленников." #NT!
 nd_mir_rova_upkeep: "Техническое обслуживание Рова" #NT!
 nd_mir_rova_upkeep_desc: "Каменные стены и деревянные конструкции рова требуют постоянного ремонта и укрепления." #NT!
 nd_mir_lamba_workshop: "Ткацкий Дом Ламба" #NT!
 nd_mir_lamba_workshop_desc: "Мастерская, посвященная плетению ламбы: характерной малагасийской ткани из шелка и хлопка. На изготовление тончайших ламба-акотофахана с их замысловатыми геометрическими узорами на традиционных ткацких станках уходят месяцы." #NT!
 nd_mir_lamba_production: "Ламба Продакшн" #NT!
 nd_mir_lamba_production_desc: "Вплетение тонкого шелка с натуральными красителями в ламба акотофахана, ценную ткань малагасийской знати." #NT!
 nd_mir_fokonolona_hall: "Зал собраний Фоконолона" #NT!
 nd_mir_fokonolona_hall_desc: "Место сбора фокон'олона: деревенского совета старейшин, который управляет местными делами на основе консенсуса. Здесь разрешаются споры, организуется общественный труд и наблюдаются феди." #NT!
 nd_mir_fokonolona_upkeep: "Техническое обслуживание сборки" #NT!
 nd_mir_fokonolona_upkeep_desc: "Деревенский актовый зал требует содержания и древесины для ремонта." #NT!
 nd_mir_trano_gasy: "Трано Гази Эстейт" #NT!
 nd_mir_trano_gasy_desc: "Трано-гаси (традиционный малагасийский дом из обожженного кирпича и дерева, ориентированный по сторонам света в соответствии с космическими принципами) служит архитектурным выражением аристократического статуса в горной местности." #NT!
 nd_mir_trano_gasy_upkeep: "Обслуживание недвижимости" #NT!
 nd_mir_trano_gasy_upkeep_desc: "Сохранение деревянного каркаса и кирпичных стен аристократической усадьбы." #NT!
 nd_mir_zebu_ranching_pm: "Разведение крупного рогатого скота зебу" #NT!
 nd_mir_zebu_ranching_pm_desc: "Крупный рогатый скот зебу с его характерной горбатой спиной занимает центральное место в жизни малагасийцев. Они дают мясо, молоко, шкуры и рога и служат основным мерилом богатства и статуса." #NT!
 nd_mir_iron_smelting_pm: "Выплавка железа в Хайленде" #NT!
 nd_mir_iron_smelting_pm_desc: "Кузнецы Хайленда выплавляли железо в угольных печах, куя инструменты и сельскохозяйственные орудия, поддерживающие королевство." #NT!
 nd_mir_indian_ocean_goods_pm: "Торговля товарами Индийского океана" #NT!
 nd_mir_indian_ocean_goods_pm_desc: "Импортированные шелка, красители и керамика от торговцев Индийского океана ткутся и превращаются в характерный малагасийский текстиль." #NT!
 levy_nd_mir_lakana: "Лакана прибрежный сбор" #NT!
 levy_nd_mir_lakana_desc: "Жители прибрежных деревень укомплектовывают свои каноэ с выносными опорами на службе короне." #NT!
 levy_nd_mir_mpiambina: "Мпиамбина Хайленд Леви" #NT!
 levy_nd_mir_mpiambina_desc: "Горные крестьяне и солдаты собирались как традиционные воины с копьями." #NT!
 nd_mir_tsena_market: "Рынок Цена" #NT!
 nd_mir_tsena_market_desc: "Оживленный центральный рынок, где рис, скот, ткани и импортные товары переходят из рук в руки. Цена привлекает торговцев со всего острова и связывает горных производителей с прибрежными торговцами." #NT!
 nd_mir_tsena_upkeep: "Рыночные прилавки" #NT!
 nd_mir_tsena_upkeep_desc: "Уход за прилавками с древесиной и гончарными витринами на рынке." #NT!
 nd_mir_musket_workshop: "Мушкетная мастерская" #NT!
 nd_mir_musket_workshop_desc: "Специализированный завод по обработке железа, где квалифицированные мастера, призванные через фаномпоану, ремонтируют импортные мушкеты, производят наконечники копий и куют оружие, которым вооружаются расширяющиеся вооруженные силы королевства." #NT!
 nd_mir_musket_workshop_input: "Производство оружия" #NT!
 nd_mir_musket_workshop_input_desc: "Ковка железа и переработка импортного оружия в исправное огнестрельное оружие для армий королевства." #NT!
 nd_mir_sekoly: "Секольская школа" #NT!
 nd_mir_sekoly_desc: "Образовательное учреждение, где миссионеры и королевские учителя обучают учеников чтению, письму и арифметике, распространяя грамотность за пределы традиционной академической касты Антеморо." #NT!
 nd_mir_sekoly_upkeep: "Школьные принадлежности" #NT!
 nd_mir_sekoly_upkeep_desc: "Бумага и древесина для обучения и содержания школы." #NT!
 nd_mir_musket_repair_pm: "Малагасийское производство оружия" #NT!
 nd_mir_musket_repair_pm_desc: "Организованные государством мастерские по производству и ремонту огнестрельного оружия и боеприпасов для расширяющейся армии королевства." #NT!
 nd_mir_fanompoana_labor_pm: "Организация труда Фаномпоана" #NT!
 nd_mir_fanompoana_labor_pm_desc: "Систематическое направление барщинного труда на государственные постройки: каналы, дороги, укрепления и царские здания." #NT!
 nd_mir_textile_export_pm: "Экспорт малагасийского текстиля" #NT!
 nd_mir_textile_export_pm_desc: "Крашение и отделка характерной ткани королевства для изготовления изысканных тканей для экспорта через прибрежные порты." #NT!
 nd_mir_rice_surplus_pm: "Торговля излишками риса" #NT!
 nd_mir_rice_surplus_pm_desc: "Террасные рисовые поля дают обильные урожаи. Тщательная ирригация и умелое земледелие производят рис, который стекает на прибрежные рынки." #NT!
 nd_mir_formed_tt: "был образован Мадагаскар." #NT!
 nd_mir_path_a_tt: "Выбрал Хасину из Горной местности" #NT!
 nd_mir_path_b_tt: "Выбрал остров тысячи портов" #NT!
 nd_mir_destiny: "Судьба Мадагаскара" #NT!
 nd_mir_destiny_desc: "Великий остров един. Теперь его народ должен выбрать, как использовать это единство: углублять ли корни горного королевства или перебросить свои выносные паруса через Индийский океан." #NT!
 nd_mir_dest_highland_consolidation: "Хайленд Консолидация" #NT!
 nd_mir_dest_highland_consolidation_desc: "Рисовые террасы высокогорья должны стать основой процветающего централизованного государства. Наполняйте королевские зернохранилища, развивайте внутренние районы и обеспечьте потоки риса на столичные рынки." #NT!
 nd_mir_dest_highland_dominion: "Хайленд Доминион" #NT!
 nd_mir_dest_highland_dominion_desc: "Королевство простирается за пределы острова. Захватите богатый золотом порт Софала на материковой части Африки, используйте современное банковское дело и развивайте королевство, пока оно не затмит своих соседей." #NT!
 nd_mir_dest_highland_empire: "Хайлендская Империя" #NT!
 nd_mir_dest_highland_empire_desc: "Континентальная держава, поднимающаяся с острова. Расширьте контроль над побережьем Мозамбика, распространите письменное слово по всему королевству и соберите армию, которая сможет защитить суверенитет Малагасии от любой силы на земле." #NT!
 nd_mir_dest_comoros_conquest: "Завоевание Коморских островов" #NT!
 nd_mir_dest_comoros_conquest_desc: "Коморские острова (Анжуан, Большой Комор и Майотта) являются естественными ступеньками от Мадагаскара к африканскому побережью. Захватите их и установите малагасийское владычество над северной частью Мозамбикского пролива." #NT!
 nd_mir_dest_swahili_reach: "Суахили Рич" #NT!
 nd_mir_dest_swahili_reach_desc: "Великие торговые города суахили Занзибар и Килва на протяжении веков контролировали торговлю в Индийском океане. Возьмите их, привезите слоновую кость на свои рынки и сделайте Мадагаскар центром восточноафриканской торговли." #NT!
 nd_mir_dest_ocean_empire: "Океанская Империя" #NT!
 nd_mir_dest_ocean_empire_desc: "От Момбасы до Сейшельских островов Индийский океан подчиняется малагасийской мощи. Управляйте торговыми путями, участвуйте в глобальной торговле и постройте империю из тысячи портов, простирающуюся от Африки до открытого моря." #NT!
 nd_mir.6.t: "Единый остров" #NT!
 nd_mir.6.d: "Впервые за всю историю Мадагаскаром управляет единая власть. От горной столицы до самой отдаленной рыбацкой деревни на южном побережье слово государя имеет вес закона. В королевстве есть стабильность. Теперь оно должно найти цель." #NT!
 nd_mir.6.a: "Наша судьба ждет." #NT!
 nd_mir.7.t: "Зернохранилища Хайленда" #NT!
 nd_mir.7.d: "Террасные рисовые поля центрального нагорья производят рис в изобилии, превосходящем все, что было известно на этом острове раньше. Ирригационные каналы с каждым годом расширяются, на склонах холмов появляются новые поля, а королевские зернохранилища переполнены излишками. Антананариву жиреет за счет труда своего народа, а богатство королевства измеряется не золотом или шелком, а белым зерном, которое кормит миллионы.\n\nКонсолидация горной местности завершена. Вопрос теперь в том, куда будет направлена ​​эта аграрная сила." #NT!
 nd_mir.7.a: "Земля нас кормит. Теперь мы будем формировать мир." #NT!
 nd_mir.8.t: "Доминион за берегом" #NT!
 nd_mir.8.d: "Малагасийские солдаты стоят на чужой земле. Завоевание Софалы дает королевству то, чего оно никогда раньше не имело: доступ к торговле золотом, которая на протяжении веков обогащала побережье Суахили. Королевская казна пополняется новыми доходами, а влияние королевства распространяется за пределы Мозамбикского пролива.\n\nНо власть за рубежом требует выбора внутри страны. Корона должна решить, как инвестировать это новое богатство." #NT!
 nd_mir.8.a: "Инвестируйте в ирригацию и благосостояние людей." #NT!
 nd_mir.8.b: "Укрепите наши высокогорные крепости." #NT!
 nd_mir.9.t: "Империя Хайленда" #NT!
 nd_mir.9.d: "Королевство, возникшее как совокупность горных деревень, теперь управляет территорией, простирающейся от внутренних районов Мадагаскара до африканского побережья. Малагасийские губернаторы управляют иностранными портами. Малагасийские солдаты занимают гарнизоны иностранных крепостей. Печатный станок распространяет грамотность из столицы в провинции, связывая королевство вместе с письменным словом.\n\nЭто вершина малагасийского могущества. Корона должна выбрать, как ею распорядиться." #NT!
 nd_mir.9.a: "Мы проецируем нашу власть на весь континент." #NT!
 nd_mir.9.b: "Мы будем защищать наш суверенитет от всех желающих." #NT!
 nd_mir.10.t: "Падение Коморских островов" #NT!
 nd_mir.10.d: "Аутригерные военные флоты Мадагаскара пересекли Мозамбикский пролив. Один за другим султанаты Коморских островов (Анжуан, Большой Комор, Майотта) пали под властью малагасийцев. Канал, отделяющий Мадагаскар от Африки, теперь представляет собой малагасийское озеро.\n\nОт этих островных аванпостов флот может перемещаться дальше, чем когда-либо прежде. Побережье Суахили манит." #NT!
 nd_mir.10.a: "Канал наш. Берег последует за ним." #NT!
 nd_mir.11.t: "Мастера побережья Суахили" #NT!
 nd_mir.11.d: "Занзибар и Килва (древние жемчужины восточноафриканской торговли) теперь развеваются под малагасийским знаменем. Слоновая кость, золото и порабощенные пленники текут через рынки, которые контролирует Мадагаскар. Королевство стало доминирующей державой в западной части Индийского океана.\n\nВопрос в том, укреплять ли эту торговую империю через коммерческие институты или использовать муссонные ветры для еще большего охвата." #NT!
 nd_mir.11.a: "Создайте постоянные торговые фабрики." #NT!
 nd_mir.11.b: "Освойте торговые пути муссонов." #NT!
 nd_mir.12.t: "Нью-Раномасина Индиана" #NT!
 nd_mir.12.d: "Индийский океан (Ny Ranomasina Indianina на малагасийском языке) стал малагасийским морем. От Момбасы на африканском побережье до Сейшельских островов в открытом океане малагасийские корабли доминируют на торговых путях. Каноэ с выносными опорами, которое когда-то перевезло горстку австронезийских поселенцев на необитаемый остров, стало инструментом империи.\n\nКоролевство должно решить, как управлять этим обширным морским пространством." #NT!
 nd_mir.12.a: "Управляйте морями как султаны южного океана." #NT!
 nd_mir.12.b: "Постройте торговую империю с тысячей портов." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_irrigation_works: "Королевские ирригационные работы" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_irrigation_works: "Корона вкладывает свои новые континентальные доходы в расширение горной ирригационной сети, доставляя воду на террасы, которые будут кормить растущее королевство в течение нескольких поколений." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_fortress_network: "Сеть Хайлендских крепостей" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_fortress_network: "Богатство Софалы финансирует цепочку крепостей рова по всей горной местности, создавая неприступную оборонительную сеть, которую не сможет прорвать ни один захватчик." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_continental_ambition: "Континентальные амбиции" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_continental_ambition: "Горная империя смотрит вовне. Профессиональная армия, закаленная кампаниями на материковой части Африки, распространяет малагасийскую власть по всему региону, хотя за это расплачивается заброшенный флот." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_defiant_sovereignty: "Непокорный суверенитет" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_defiant_sovereignty: "Мадагаскар стоит особняком и неприкосновенен. Дипломатическое мастерство королевства и наемные резервы гарантируют, что никакая иностранная держава не сможет угрожать его независимости." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_trading_factories: "Торговые фабрики Суахили" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_trading_factories: "Постоянные малагасийские торговые фабрики на побережье Суахили служат одновременно коммерческими форпостами и станциями сбора разведывательной информации." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_monsoon_routes: "Торговые пути муссонов" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_monsoon_routes: "Владение режимами муссонных ветров позволяет малагасийским торговцам торговать через Индийский океан с минимальными накладными расходами, снижая инфляцию и стоимость займов." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_sultan_southern_seas: "Султан Южных морей" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_sultan_southern_seas: "Малагасийский суверен пользуется уважением как выдающаяся держава южной части Индийского океана, поддерживаемая дисциплинированной кавалерией и артиллерией, а также широкой дипломатической сетью." #NT!
 STATIC_MODIFIER_NAME_nd_mir_dest_thousand_port_empire: "Империя Тысячи Портов" #NT!
 STATIC_MODIFIER_DESC_nd_mir_dest_thousand_port_empire: "Огромная морская империя, скрепленная не одной армией, а сетью портов, наемников и вассальных государств, что делает войну дешевой, а сопротивление дорогостоящим." #NT!
 nd_mir_rova_manjakamiadana: "Рова Манджакамиадана" #NT!
 nd_mir_rova_manjakamiadana_desc: "Большой дворец Манджакамиадана («Где приятно править») венчает самый высокий холм Антананариву. Построенный из камня и палисандра, он является высшим символом суверенитета Мерины: частично королевская резиденция, частично административный центр, частично священное место, где концентрируются хасины предков." #NT!
 nd_mir_rova_manjakamiadana_upkeep: "Обслуживание дворца" #NT!
 nd_mir_rova_manjakamiadana_upkeep_desc: "Каменный фундамент, залы из розового дерева и священные ограды огромного дворца требуют постоянного ухода со стороны опытных мастеров." #NT!
 nd_mir_lakana_arsenal: "Лакана Арсенал" #NT!
 nd_mir_lakana_arsenal_desc: "Великая верфь и военно-морской арсенал, где строятся и обслуживаются самые большие военные каноэ малагасийского флота. Ряды лакана стоят на крытых эллингах, их корпуса проконопачены кокосовым волокном, а на выносных опорах установлены платформы для лучников и мушкетеров." #NT!
 nd_mir_lakana_arsenal_upkeep: "Техническое обслуживание Арсенала" #NT!
 nd_mir_lakana_arsenal_upkeep_desc: "Пиломатериалы, деготь и канаты для содержания военного флота и его стапельной инфраструктуры." #NT!
 mir_fokonolona_bureaucracy: "Фоконолона" #NT!
 mir_fokonolona_bureaucracy_desc: "Фоконолона — это деревенский совет, основная единица политической жизни Малагасии. Андрианампоинимерина формализовал его во время воссоединения Имерины (1787 г.), собрав старейшин и знатных людей на открытом собрании для распределения общественной работы, обслуживания ирригационных каналов, разрешения споров посредством ораторского искусства кабари и соблюдения местных табу. На площади собраний были зачитаны царские указы; Слово короля дошло до каждой деревни через старейшин, а не через назначенных судей. Французские наблюдатели девятнадцатого века считали его самым искренним африканским институтом, с которым они когда-либо сталкивались." #NT!
 mir_fanompoana_bureaucracy: "Фаномпоана" #NT!
 mir_fanompoana_bureaucracy_desc: "Фаномпоана представляла собой барщину, причитавшуюся лично государю вместо денежного налога. Скромный при Андрианампоимерине, он стал постоянным для рабочих-металлистов и учеников оружейников при Радаме I (с 1820 г.) и дал метастазы при Ранавалоне I: около двадцати тысяч рабочих фаномпоана построили Мантасоа, а постоянная армия была увеличена до тридцати тысяч за счет воинской повинности как фаномпоана. Система давала короне объем государственной работы, которую серебряная казна никогда не могла себе позволить, но, по оценкам, население Имерины сократилось вдвое в период с 1833 по 1839 год из-за совокупного веса барщины, воинской повинности и голода." #NT!
 mir_andriana_caste_bureaucracy: "Иерархия каст Андрианы" #NT!
 mir_andriana_caste_bureaucracy_desc: "Социальный порядок Мерины основывался на трех основных кастах: дворяне Андрианы, свободные простолюдины Хова и рабы Андево, при этом Андриана подразделялась на шесть эндогамных подслоев, каждая из которых имела унаследованные должности, брачные правила и привилегии над могилами. Хова управлял рисовыми землями как владелец и торговец, но не смог подняться до дворянского звания; Андево считались олона малото (нечистыми) и им запрещалось владеть землей. Андрианампоинимерина систематизировала правила; Ранавалона I защищал их от миссионерского эгалитаризма. Кастовая система была архитектурой политической жизни Мерины до отмены во Франции законного рабства в 1896 году." #NT!
 mir_sampy_keepers_bureaucracy: "Мпитахири Сампи" #NT!
 mir_sampy_keepers_bureaucracy_desc: "Мпитахири Сампи были хранителями двенадцати великих королевских идолов (Келималазы, Рамахавали, Манджакацироа и других), объединенных преемниками Андриамасинавалоны. У каждого сампи был свой собственный пророческий голос, жертвенный календарь и жречество-хранитель; коллективно они даровали царю хасину (священную власть) и утверждали его указы. Андрианампоинимерина искала их оракулов перед кампаниями; Ранавалона I, изгнав миссионеров в 1835 году, воздвиг культ королевской государственной политики и возродил церемонию королевского омовения Фандроана в их присутствии." #NT!
 mir_mantasoa_works_bureaucracy: "Промышленный завод Мантасоа" #NT!
 mir_mantasoa_works_bureaucracy_desc: "Промышленный комплекс Мантасоа был построен Жаном Лабордом, французом, потерпевшим кораблекрушение с инженерным образованием, для Ранавалоны I в 1837 году. Около двадцати тысяч рабочих фаномпоана возвели плотину, литейные заводы, печи и мастерские; около 1200 постоянных рабочих производили для королевской монополии пушки, мечи, порох, кирпичи, черепицу, стекло, фарфор, бумагу, шелк, мыло, свечи и сургуч. Это был первый крупный промышленный комплекс в Африке к югу от Сахары, созданный коренным населением. Производство прекратилось, когда Лаборд был сослан на Реюньон в 1855 году, и так и не возобновилось в больших масштабах." #NT!
 AUTO_MODIFIER_NAME_nd_mir_bureaucracy_authority: "Королевская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_mir_bureaucracy_authority: "Когда великий остров объединится под единой короной в Антананариву, трон может начать формировать постоянный административный аппарат: деревню фоконолона, барщину фаномпоана, касту Андриана, хранителей Сампи или мануфактуру Лаборда в Мантасоа. Столица предоставляет один слот; королевская власть предоставляет еще два, что позволяет одновременно работать трем малагасийским учреждениям." #NT!
