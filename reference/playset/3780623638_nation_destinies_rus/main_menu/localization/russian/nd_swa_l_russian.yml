l_russian:
 STATIC_MODIFIER_NAME_nd_swa_league_of_equals: "Лига равных" #NT!
 STATIC_MODIFIER_DESC_nd_swa_league_of_equals: "Города Швабии объединили свои усилия общим делом, объединив свои богатства и оружие для защиты общих свобод как от княжеских амбиций, так и от имперского вмешательства." #NT!
 STATIC_MODIFIER_NAME_nd_swa_ducal_restoration: "Герцогская реставрация" #NT!
 STATIC_MODIFIER_DESC_nd_swa_ducal_restoration: "Сильная рука теперь хватает раздробленное герцогство, объединяя его сварливые города и мелких лордов в единое государство под княжеской властью, возрождая военные традиции Гогенштауфенов." #NT!
 nd_swa.1.t: "Швабский вопрос" #NT!
 nd_swa.1.d: "Старое герцогство Швабия погибло вместе с последними Гогенштауфенами, оставив после себя мозаику вольных городов, рыцарских кантонов и княжеских территорий, объединенных только общим языком и общими интересами. Теперь эта мозаика собрана под одним знаменем, но что это будет за Швабия?\n\nГорода Аугсбург, Ульм и Мемминген уже давно управляются посредством советов и гильдий, защищая свои свободы через Швабский союз. Их богатство и коллективный дух сделали это объединение возможным. Тем не менее, есть те, кто помнит, что Швабия когда-то была крупным герцогством, управляемым императорами, и утверждает, что только сильный принц может удержать эти земли вместе.\n\nХарактер Швабии висит на волоске: конфедерация свободных городов и кооперативных поместий или восстановленное герцогство с централизованной властью.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_swa.1.a: "Мы — лига свободных городов, связанных торговлей." #NT!
 nd_swa.1.b: "Швабии нужен сильный герцог, который мог бы возглавить страну" #NT!
 nd_swa.2.t: "Дом Фуггера" #NT!
 nd_swa.2.d: "То, что начиналось как скромная ткацкая мастерская в Аугсбурге, превратилось в самый могущественный банковский дом христианского мира. Фуггеры (сначала Ганс, затем его сыновья и внуки) превратили торговлю текстилем в финансовую империю, простирающуюся от серебряных рудников Тироля до медных месторождений Венгрии. Их счетные палаты предоставляют кредиты как папам, так и императорам.\n\nЯкоб Фуггер, прозванный «Богатым», обеспечил горнодобывающие монополии по всей Центральной Европе, предлагая принцам Габсбургов ссуды, от которых они не могут отказаться, принимая права на добычу полезных ископаемых в качестве залога. Его инновации в двойной бухгалтерии и международных кредитных сетях сделали Аугсбург банковской столицей Империи.\n\nБогатство Фуггеров теперь неотделимо от процветания Швабии." #NT!
 nd_swa.2.a: "Аугсбург станет счетной палатой Европы." #NT!
 STATIC_MODIFIER_NAME_nd_swa_fugger_patronage: "Покровительство Фуггеров" #NT!
 STATIC_MODIFIER_DESC_nd_swa_fugger_patronage: "Огромное богатство банковской династии Фуггеров течет через Аугсбург, финансируя шахты, церкви и общественные работы по всей Швабии." #NT!
 nd_swa.3.t: "Аугсбургский мир" #NT!
 nd_swa.3.d: "После десятилетий религиозной борьбы, которая разделила соседей на соседей и разрушила старую Швабскую лигу, князья и города Империи собрались в Аугсбурге, чтобы решить конфессиональный вопрос. В результате мир устанавливает новый принцип: вера правителя определяет веру его земли.\n\nДля Швабии этот момент имеет особое значение. Сам Аугсбург уже давно является домом для обеих конфессий: лютеранская и католическая общины делят одни и те же городские стены и находятся в непростом сосуществовании. Некоторые швабские города рано приняли Реформацию; другие оставались стойкими католиками. Мир предлагает два пути: обеспечить конфессиональное единообразие для укрепления государственной власти или принять практическую толерантность, которую продемонстрировал собственный опыт Аугсбурга." #NT!
 nd_swa.3.a: "Cuius regio, eius religio: одна вера, одно царство." #NT!
 nd_swa.3.b: "Пусть пример Аугсбурга приведет нас к сосуществованию" #NT!
 STATIC_MODIFIER_NAME_nd_swa_cuius_regio: "Cuius Regio, Eius Religio" #NT!
 STATIC_MODIFIER_DESC_nd_swa_cuius_regio: "Принцип Аугсбургского урегулирования предоставляет правителю власть над верой своих подданных, усиливая центральный контроль и религиозное единообразие." #NT!
 STATIC_MODIFIER_NAME_nd_swa_augsburg_coexistence: "Аугсбургское сосуществование" #NT!
 STATIC_MODIFIER_DESC_nd_swa_augsburg_coexistence: "Давняя традиция двухконфессионального управления Аугсбургом становится образцом для королевства, воспитывая толерантность и привлекая торговцев всех вероисповеданий." #NT!
 nd_swa.4.t: "Лига выходит на поле" #NT!
 nd_swa.4.d: "Швабский союз, этот великий союз городов, князей и рыцарей, зарекомендовал себя не просто как дипломатический инструмент, но и как грозная военная сила. Когда крестьянские армии восстали на юго-западе против десятины и крепостного права, а бароны-разбойники терроризировали торговые пути, Лига собрала свои контингенты и выступила.\n\nПод командованием Георга Трухзесса фон Вальдбурга армия Лиги (набранная из десятков государств-членов, каждое из которых вносило свою долю пик, лошадей и пушек) методично и эффективно сокрушила силы повстанцев. Коллективная военная мощь Лиги доказана вне всякого сомнения." #NT!
 nd_swa.4.a: "Сила Лиги в ее единстве." #NT!
 nd_swa_formed_tt: "была образована Швабия." #NT!
 nd_swa_path_a_tt: "Швабия идет по пути Лиги равных" #NT!
 nd_swa_path_b_tt: "Швабия идет по пути герцогской реставрации" #NT!
 nd_swa_hohenstaufen_legacy: "Наследие Гогенштауфена" #NT!
 nd_swa_hohenstaufen_legacy_desc: "Память о великой династии Штауферов (Фридрих Барбаросса, Генрих VI, Фридрих II) придает престиж и культурный вес любому, кто претендует на Швабию как на свою собственность." #NT!
 nd_swa_urban_league_tradition: "Традиция городской лиги" #NT!
 nd_swa_urban_league_tradition_desc: "Длительная практика объединения швабских городов в союзы для взаимной защиты и коммерческой выгоды, начиная с первого союза 1376 года и заканчивая великим союзом 1488 года." #NT!
 nd_swa_fortified_towns: "Укрепленные города" #NT!
 nd_swa_fortified_towns_desc: "Швабские свободные города вложили значительные средства в стены, башни и подготовку ополчения для защиты своих свобод от княжеской агрессии." #NT!
 nd_swa_fustian_industry: "Фустианская промышленность" #NT!
 nd_swa_fustian_industry_desc: "Ткачество фустиана (смесь хлопка и льна) сделало Аугсбург и Ульм текстильными столицами Империи, объем производства которых достигал десяти тысяч штук в год." #NT!
 nd_swa_imperial_knights: "Имперские рыцари Швабии" #NT!
 nd_swa_imperial_knights_desc: "Швабские рыцарские кантоны сохраняли военную традицию, независимую от какого-либо князя, подчиняясь непосредственно императору." #NT!
 nd_swa_fugger_banking: "Фуггер Банкинг" #NT!
 nd_swa_fugger_banking_desc: "Семья Фуггеров из Аугсбурга построила самый могущественный банковский дом в Европе, финансируя Габсбургов и пап посредством инновационных кредитов, обеспеченных концессиями на добычу полезных ископаемых." #NT!
 nd_swa_augsburg_metalworking: "Аугсбург Металлообработка" #NT!
 nd_swa_augsburg_metalworking_desc: "Аугсбургская гильдия оружейников и оружейников получила известность по всей Европе благодаря качеству своих пластинчатых доспехов и холодного оружия." #NT!
 nd_swa_league_collective_defense: "Лига Коллективной Обороны" #NT!
 nd_swa_league_collective_defense_desc: "Швабский союз 1488 года официально узаконил взаимную оборону между городами, рыцарями и князьями, создав федеральную армию из 13 000 человек, управляемую советом из трех коллегий.\n\n#italic Доступно в: $nd_swa_handelskontor$#!" #NT!
 nd_swa_cannon_foundries: "Аугсбургский пушечный завод" #NT!
 nd_swa_cannon_foundries_desc: "Мастерство Аугсбурга в литье из бронзы и железа естественным образом распространялось и на производство артиллерийских орудий, поставляя осадные обозы как Лиге, так и Императору." #NT!
 nd_swa_circle_administration: "Администрация Круга" #NT!
 nd_swa_circle_administration_desc: "Система Имперского круга, формализованная при Максимилиане I, дала Швабии административную основу для сбора налогов, военных сборов и поддержания мира." #NT!
 nd_swa_social_welfare: "Традиции социального обеспечения" #NT!
 nd_swa_social_welfare_desc: "Основание Якобом Фуггером в 1521 году Фуггерай (первого в мире социального жилищного комплекса) стало примером швабской традиции гражданской благотворительности и городского благосостояния." #NT!
 nd_swa_league_warcraft: "Лига Варкрафт" #NT!
 nd_swa_league_warcraft_desc: "Швабский союз доказал свою военную ценность, разгромив Великую Крестьянскую войну 1524-26 годов и разгромив союз баронов-разбойников во Франконской войне." #NT!
 nd_swa_confessional_coexistence: "Конфессиональное сосуществование" #NT!
 nd_swa_confessional_coexistence_desc: "Двухконфессиональное управление Аугсбургом (лютеране и католики делили государственные должности и церковные здания) стало образцом практической толерантности в разделенной Империи." #NT!
 nd_swa_fine_cloth_manufactory: "Фабрика тонких тканей" #NT!
 nd_swa_fine_cloth_manufactory_desc: "Эволюция швабского текстиля от простого фустиана до роскошных тонких тканей: шесть тысяч ткачей Аугсбурга совершенствовали свое мастерство, чтобы конкурировать с итальянскими и фламандскими мастерами.\n\n#italic Доступно в: $nd_swa_webhaus$#!" #NT!
 nd_swa_military_reforms: "Швабские военные реформы" #NT!
 nd_swa_military_reforms_desc: "Модернизация воинских контингентов Швабского круга в профессиональные постоянные силы, обученные тактике огневого удара, которую впервые применили ландскнехты." #NT!
 nd_swa_augsburg_printing: "Аугсбургские печатные машины" #NT!
 nd_swa_augsburg_printing_desc: "Аугсбург стал одним из ведущих центров печати в Империи, производя религиозные трактаты, коммерческие руководства и иллюстрированные книги, которые распространились по Европе.\n\n#italic Доступно в: $nd_swa_fuggerhaus$#!" #NT!
 nd_swa_princely_splendor: "Княжеское великолепие" #NT!
 nd_swa_princely_splendor_desc: "Богатство купеческих династий и княжеских домов Швабии нашло выражение в великолепных дворцах, церквях и коллекциях произведений искусства, которые могли соперничать с любыми коллекциями Империи." #NT!
 nd_swa_standing_kreis_army: "Постоянная армия Крайса" #NT!
 nd_swa_standing_kreis_army_desc: "Швабский круг содержал постоянные вооруженные силы для защиты от французских и османских угроз, превращаясь из контингентов Лиги в профессиональные постоянные армии." #NT!
 nd_swa_commercial_code: "Торговый кодекс" #NT!
 nd_swa_commercial_code_desc: "Швабские города кодифицировали коммерческое право, регулирующее контракты, партнерства и долги, обеспечив правовую определенность, которая привлекла торговцев со всей Европы." #NT!
 nd_swa_enlightenment_scholarship: "Стипендия Просвещения" #NT!
 nd_swa_enlightenment_scholarship_desc: "Тюбингенский университет и другие швабские учреждения стали центрами мысли Просвещения, выпуская выдающихся философов, ученых и ученых-юристов." #NT!
 nd_swa_industrial_textiles: "Промышленный текстиль" #NT!
 nd_swa_industrial_textiles_desc: "Механизация швабского текстильного производства, когда водяные мельницы и первые фабрики превратили древнюю традицию ткачества в современную промышленность." #NT!
 nd_swa_civic_nationalism: "Гражданский национализм" #NT!
 nd_swa_civic_nationalism_desc: "Городские демократические традиции Швабии сформировали особую форму гражданского национализма, основанную на самоуправлении, цеховой солидарности и народном суверенитете." #NT!
 nd_swa_autonomy_heritage: "Автономное наследие" #NT!
 nd_swa_autonomy_heritage_desc: "Даже когда наполеоновская медиатизация поглотила вольные города и мелкие государства Швабии, традиция местной автономии и самоуправления сохранялась в гражданских институтах." #NT!
 nd_swa_industrial_modernization: "Промышленная модернизация" #NT!
 nd_swa_industrial_modernization_desc: "Вюртемберг привел Швабию в индустриальную эпоху, ее традиции металлообработки и машиностроения превратились в современное производство и производство вооружений." #NT!
 a_nd_swa_bundschuh_militia: "Бундшу Милиция" #NT!
 a_nd_swa_bundschuh_militia_desc: "Городское ополчение, набранное из гильдий и жителей вольных городов Швабии, обученное защищать свои стены и свободы от агрессии дворян." #NT!
 a_nd_swa_kreisinfanterie: "Крайзинфантерие" #NT!
 a_nd_swa_kreisinfanterie_desc: "Профессиональная пехота Швабского Императорского Круга, организованная в соответствии с коллективными военными обязательствами государств-членов Круга." #NT!
 a_nd_swa_reiter: "Швабский рейтер" #NT!
 a_nd_swa_reiter_desc: "Тяжелая кавалерия, набранная из имперских рыцарей швабских кантонов, сражается в традиционной ударной роли." #NT!
 a_nd_swa_augsburg_bombard: "Аугсбург Бомбарда" #NT!
 a_nd_swa_augsburg_bombard_desc: "Тяжелая осадная артиллерия, отлитая на знаменитых литейных заводах Аугсбурга, построена с тем же опытом металлообработки, что и лучшие доспехи в Европе." #NT!
 levy_nd_swa_bundschuh_militia: "Бундшух Милиция Леви" #NT!
 levy_nd_swa_bundschuh_militia_desc: "Ополчение набиралось из гильдий и жителей свободных городов Швабии." #NT!
 levy_nd_swa_kreisinfanterie: "Крайзинфантерие Леви" #NT!
 levy_nd_swa_kreisinfanterie_desc: "Круговая пехота, набранная из государств-членов Швабского императорского круга." #NT!
 levy_nd_swa_reiter: "Швабский рейтер Леви" #NT!
 levy_nd_swa_reiter_desc: "Тяжелая кавалерия, набранная из имперских рыцарей швабских кантонов." #NT!
 nd_swa_webhaus: "Вебхаус" #NT!
 nd_swa_webhaus_desc: "Швабский ткацкий цех, где цеховые мастера контролируют производство фустиевых и тонких тканей, продолжая текстильные традиции Аугсбурга и Ульма." #NT!
 nd_swa_handelskontor: "Хандельконтор" #NT!
 nd_swa_handelskontor_desc: "Торговый офис сети Швабского союза, координирующий коммерческую деятельность и представляющий коллективные интересы союзных купцов." #NT!
 nd_swa_fuggerhaus: "Фуггерхаус" #NT!
 nd_swa_fuggerhaus_desc: "Банковская и счетная контора в традициях Фуггеров, управляющая кредитами, обменом и инвестициями для торговых династий Аугсбурга." #NT!
 nd_swa_zeughaus: "Цойгауз" #NT!
 nd_swa_zeughaus_desc: "Швабский арсенал, где аугсбургские мастера-металлисты куют оружие и доспехи для вооруженных сил Лиги." #NT!
 nd_swa_fuggerei: "Фуггерай" #NT!
 nd_swa_fuggerei_desc: "Социальный жилищный поселок, созданный по образцу новаторского фонда Якоба Фуггера в Аугсбурге, предоставляющий доступные дома рабочим и ремесленникам." #NT!
 nd_swa_fustian_weaving: "Фустианское ткачество" #NT!
 nd_swa_fustian_weaving_desc: "Производство фустианской ткани из импортного хлопка и местной шерсти — основа текстильного богатства Швабии." #NT!
 nd_swa_fine_cloth_production: "Производство тонких тканей" #NT!
 nd_swa_fine_cloth_production_desc: "Изысканное текстильное производство, производящее роскошные тонкие ткани из швабской ткани-основы и импортных красителей." #NT!
 nd_swa_webhaus_maintenance: "Содержание ткацкого цеха" #NT!
 nd_swa_webhaus_maintenance_desc: "Обслуживание ткацких станков, красильных ванн и квалифицированной рабочей силы швабского ткацкого цеха." #NT!
 nd_swa_league_commerce: "Лига коммерции" #NT!
 nd_swa_league_commerce_desc: "Коммерческие операции торгового офиса Швабской лиги, координирующего торговлю в сети городов-союзников." #NT!
 nd_swa_league_warehouse: "Склад Лиги" #NT!
 nd_swa_league_warehouse_desc: "Складские операции по хранению ткани, шерсти и соли для коллективной торговой сети Швабского союза." #NT!
 nd_swa_banking_operations: "Банковские операции" #NT!
 nd_swa_banking_operations_desc: "Финансовые операции счетной палаты аугсбургского типа, управляющей кредитом, обменом и инвестициями." #NT!
 nd_swa_advanced_banking: "Продвинутое банковское дело" #NT!
 nd_swa_advanced_banking_desc: "Сложные финансовые услуги, включая международные кредитные письма, инвестиции в горнодобывающую промышленность и обмен валюты." #NT!
 nd_swa_arms_production: "Производство оружия" #NT!
 nd_swa_arms_production_desc: "Ковка оружия и доспехов в знаменитых металлообрабатывающих мастерских Аугсбурга." #NT!
 nd_swa_fuggerei_upkeep: "Содержание Фуггерай" #NT!
 nd_swa_fuggerei_upkeep_desc: "Содержание жилья, улиц и общественных объектов социального поселения в стиле Фуггерай." #NT!
 nd_swa_destiny: "Швабская судьба" #NT!
 nd_swa_destiny_desc: "Швабия объединилась впервые со времен Гогенштауфенов. Теперь ему предстоит определить свой курс: создаст ли лига городов торговую империю или новый герцог восстановит славу старого герцогства?" #NT!
 nd_swa_dest_handelsverein: "Хандельсферайн" #NT!
 nd_swa_dest_handelsverein_desc: "Расширьте коммерческое влияние Швабии вдоль Рейна, обеспечив безопасность Страсбурга и доставив шелк на наши рынки. Требует стабильности и пути Лиги." #NT!
 nd_swa_dest_rhine_trade: "Континентальная биржа" #NT!
 nd_swa_dest_rhine_trade_desc: "Постройте торговую сеть от Рейна до Фландрии, контролируя Брюгге, используя современное банковское дело и накопив значительное богатство." #NT!
 nd_swa_dest_handelshegemonie: "Handelshegemonie" #NT!
 nd_swa_dest_handelshegemonie_desc: "Достигните коммерческого превосходства над Европой, контролируя Венецию, достигнув высочайшего престижа и накопив огромный капитал и развитые территории." #NT!
 nd_swa_dest_stauferreich: "Штауферрайх" #NT!
 nd_swa_dest_stauferreich_desc: "Верните себе сердце старых владений Гогенштауфенов, завоевав Нюрнберг и Фрайбург. Требует стабильности и пути восстановления герцогства." #NT!
 nd_swa_dest_alpine_dominion: "Альпийский Доминион" #NT!
 nd_swa_dest_alpine_dominion_desc: "Обеспечьте контроль над альпийскими перевалами, отбив Инсбрук у Габсбургов, построив при этом грозную армию и заслужив уважение сверстников." #NT!
 nd_swa_dest_imperial_crown: "Императорская Корона" #NT!
 nd_swa_dest_imperial_crown_desc: "Восстановите всю власть Гогенштауфенов, захватив Милан и Прагу, выставив огромную армию и развивая обширные территориальные владения." #NT!
 nd_swa.5.t: "Швабская судьба" #NT!
 nd_swa.5.d: "Разрозненные фрагменты старого герцогства были собраны в одни руки. Швабия снова оживает, но вопрос, чем она станет, остается без ответа. Предстоящий путь долог, и выбор, который мы делаем сейчас, отзовется эхом сквозь века." #NT!
 nd_swa.5.a: "Наша судьба ждет" #NT!
 nd_swa.6.t: "Рейнская связь" #NT!
 nd_swa.6.d: "Купцы Аугсбурга и Ульма издавна торговали вдоль Рейна, отправляя свои ткани и металлические изделия на север, в Нидерланды и на Балтику. Теперь, когда Страсбург находится в наших руках, весь верхний Рейнский коридор открыт для швабской торговли.\n\nШёлк течет через наши рынки, красители обогащают наши мастерские, а серебро Фуггеров смазывает колеса торговли. Старый Швабский союз был оборонительным союзом, но Handelsverein, который мы строим, представляет собой нечто гораздо более амбициозное: коммерческую конфедерацию, которая объединит города Центральной Европы посредством общих интересов и взаимной выгоды." #NT!
 nd_swa.6.a: "Рейн будет нашей дорогой" #NT!
 nd_swa.7.t: "Континентальная биржа" #NT!
 nd_swa.7.d: "Швабские купцы теперь торгуют на больших рынках Фландрии, их склады в Брюгге переполнены тканью, медью и серебром. Банковские учреждения, которые мы приняли, превратили Аугсбург из провинциального ткацкого города в финансовый перекресток Европы.\n\nТеперь вопрос в том, как укрепить это коммерческое превосходство. Некоторые утверждают, что шпионские сети и финансовая разведка Аугсбурга должны быть использованы в качестве оружия, чтобы перехитрить конкурентов. Другие полагают, что союз с ганзейскими городами на севере создал бы неприступный торговый блок, простирающийся от Средиземноморья до Балтики." #NT!
 nd_swa.7.a: "Развертывание наших агентов на каждом рынке" #NT!
 nd_swa.7.b: "Наладить партнерство с Ганзой" #NT!
 nd_swa.8.t: "Хандельшегемония" #NT!
 nd_swa.8.d: "Венеция попала под влияние Швабии, а вместе с ней и последней великой независимой торговой державы Европы. От текстильных цехов Аугсбурга до лагун Адриатики, от контор Брюгге до шелковых рынков Востока швабский капитал течет по венам европейской торговли.\n\nЭто беспрецедентное коммерческое господство поднимает фундаментальный вопрос о природе швабского государства. Должны ли великие купеческие семьи (Фуггеры, Вельзеры, Хохштеттеры) формально взять бразды правления в свои руки в качестве торговых князей? Или рынки останутся по-настоящему свободными, открытыми для всех желающих, и ни одна династия не сможет контролировать торговлю?" #NT!
 nd_swa.8.a: "Пусть великие дома управляют своей торговлей" #NT!
 nd_swa.8.b: "Свободные рынки служат всем, а не только немногим" #NT!
 nd_swa.9.t: "Возрождение Штауферрайха" #NT!
 nd_swa.9.d: "Знамя Гогенштауфенов вновь реет над Нюрнбергским замком и башнями Фрайбурга. То, что последние императоры Штауферов потеряли в хаосе Междуцарствия, новый швабский герцог вернул себе с помощью стали и государственного управления.\n\nИмперские города Франконии и плодородные земли Брайсгау теперь подчиняются Штутгарту. Центральная часть страны защищена, но настоящие владения Фридриха Барбароссы и Фридриха II простирались далеко за пределы этих границ, через альпийские перевалы и на богатые равнины Ломбардии." #NT!
 nd_swa.9.a: "Орлы возвращаются в свои гнезда" #NT!
 nd_swa.10.t: "Владыки Альп" #NT!
 nd_swa.10.d: "Инсбрук пал. Над резиденцией Габсбургов в Тироле (ворота в Италию, страж Бреннерского перевала) теперь летает швабский орел. Контроль над альпийскими перевалами дает Швабии стратегический контроль над торговыми и военными путями, соединяющими Германию с Италией.\n\nВопрос в том, как использовать это горное владычество. Некоторые советуют укрепить каждый перевал и долину, превратив Альпы в неприступный бастион. Другие утверждают, что богатства завоеванных территорий следует мобилизовать для сбора огромных армий для предстоящих кампаний: Милан и Прага все еще манят." #NT!
 nd_swa.10.a: "Укрепите каждый перевал и крепость" #NT!
 nd_swa.10.b: "Нанимайте горные народы для наших войн" #NT!
 nd_swa.11.t: "Императорская Корона" #NT!
 nd_swa.11.d: "Милан преклоняет колени перед швабским герцогом. Древний пражский замок признает нового хозяина. От Рейна до Влтавы, от Альп до равнин Ломбардии владения Гогенштауфенов были восстановлены и превзойдены.\n\nТакой державы не было в Центральной Европе с тех пор, как Фридрих II держал двор в Палермо и правил от Балтики до Сицилии. Вопрос теперь в том, какая это будет империя. Некоторые призывают герцога претендовать на универсальную монархию: навязать швабскую волю всему христианскому миру силой оружия. Другие советуют более взвешенный подход: имперская федерация, которая связывает различные народы посредством общих институтов и взаимных обязательств." #NT!
 nd_swa.11.a: "Одна корона, одна воля, одна империя" #NT!
 nd_swa.11.b: "Империя многих народов, один закон" #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_continental_exchange: "Континентальная биржа" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_continental_exchange: "Сети финансовой разведки Аугсбурга охватывают весь континент, отслеживая рынки и манипулируя ценами в пользу Швабии." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_hanseatic_partnership: "Ганзейское партнерство" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_hanseatic_partnership: "Формальный союз с ганзейскими городами создает торговый блок, простирающийся от Альп до Балтики, стабилизируя торговлю во всем регионе." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_merchant_princes: "Великие швабские купеческие династии управляют своей торговлей с расчетом, амбициями и стремлением к инновациям." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_free_market: "Республика свободного рынка" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_free_market: "Рынки Швабии остаются открытыми для всех желающих, способствуя конкуренции, толерантности и мирному процветанию." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_alpine_fortifications: "Альпийские укрепления" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_alpine_fortifications: "Каждый перевал, долина и горная крепость были укреплены, что сделало сердце Швабии практически неприступным." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_levies: "Имперские сборы" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_levies: "Завоеванные территории организованы так, чтобы обеспечить максимальную военную силу, при этом каждый подданный вносит свою долю в швабскую армию." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_universal_monarchy: "Универсальная монархия" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_universal_monarchy: "Швабский герцог претендует на господство над всем христианским миром, используя военную силу в качестве основного инструмента государственного управления." #NT!
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_federation: "Имперская Федерация" #NT!
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_federation: "Различные народы связаны под властью Швабии общими институтами, взаимными обязательствами и обещанием порядка." #NT!
 nd_swa_borsenhaus: "Борзенхаус" #NT!
 nd_swa_borsenhaus_desc: "Швабская товарная биржа, на которой купцы со всей Европы торгуют товарами, кредитами и фьючерсами, укрепляя позиции Аугсбурга как торговой столицы континента." #NT!
 nd_swa_borsenhaus_maintenance: "Обменные операции" #NT!
 nd_swa_borsenhaus_maintenance_desc: "Администрирование товарной биржи, ведение торговых площадок, реестров и курьерской сети." #NT!
 nd_swa_kaiserpfalz: "Кайзерпфальц" #NT!
 nd_swa_kaiserpfalz_desc: "Императорский дворцовый комплекс в традициях Гогенштауфенов, служащий одновременно резиденцией правительства и символом восстановленной герцогской власти над старым герцогством." #NT!
 nd_swa_kaiserpfalz_maintenance: "Содержание дворца" #NT!
 nd_swa_kaiserpfalz_maintenance_desc: "Обслуживание больших залов, укреплений и административных помещений императорского дворца." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_swa_bureaucracy_authority: "Швебское Verwaltung" #NT!
 AUTO_MODIFIER_DESC_nd_swa_bureaucracy_authority: "Единое швабское государство унаследовало институциональный набор инструментов, не имеющий себе равных в Рейхе по своей сложности: федеральный Бундесрат Швебишского Бунда, Крайстаг Имперского круга, конституционный Тюбингерский вертраг Вюртемберга, пятикантонное Рейхсриттершафт и патрицианско-гильдейский Штадтрат Аугсбурга. Выбирайте, какие учреждения оставить в живых." #NT!
  
 swa_bundesrat_bureaucracy: "Бундесрат Швебиских федеральных земель" #NT!
 swa_bundesrat_bureaucracy_desc: "Федеральный совет Швабской лиги, сформированный на сейме Эсслингена 14 февраля 1488 года. Бундесрат состоял из трех коллегий: князей, имперских городов и рыцарей Санкт-Йоргеншильда, с двумя (позже тремя) гауптлейтами в качестве главных капитанов и равным числом советников, избранных от каждого сословия, число которых увеличилось с восемнадцати до двадцати одного в результате обновлений в 1496 и 1500 годах. армия в тринадцать тысяч человек подавил Крестьянскую войну 1525 года и удерживал южную Швабию от распрей и конфессионального раскола, пока Реформация не разрушила Лигу в 1534 году." #NT!
  
 swa_kreistag_bureaucracy: "Швебишер Крайстаг" #NT!
 swa_kreistag_bureaucracy_desc: "Совещательное собрание Швебишского рейхскрайса, одного из десяти имперских кругов, созданных Максимилианом I в 1500 году. Герцоги Вюртембергские и епископы Констанца выполняли функции kreisausschreibende Fürsten, созывая Крайстаг и председательствуя на его заседаниях. После 1512 года Крайс приводил в исполнение приговоры Рейхскаммергерихта; с 1530 г. он собрал отряд императорской армии; после 1555 года он следил за вечным общественным миром на своей территории. Из десяти кружков наиболее организованным считался швабский, разделенный после 1563 года на четыре квартала казней: Аугсбург, Констанц, Вюртемберг и Баден." #NT!
  
 swa_tuebinger_vertrag_bureaucracy: "Тюбингер Вертраг" #NT!
 swa_tuebinger_vertrag_bureaucracy_desc: "Конституционный договор, заключенный между герцогом Ульрихом и Вюртембергским ландтагом в Тюбингене 8 июля 1514 года, после восстания Армера Конрада против налога на потребление мяса и вина, введенного Ульрихом. Договор обязывал герцогство консультироваться с поместьями прелатов, рыцарей и горожан Эрбаркейта по вопросам чрезвычайного налогообложения, войны и территориального отчуждения, а также предоставлял всем подданным право свободной эмиграции и законных процедур в вопросах жизни, здоровья и чести. Историки назвали ее «Великой хартией вольностей Вюртемберга». Территориальная конституция оставалась почти неизменной до наполеоновской медиатизации 1805 года." #NT!
  
 swa_reichsritterschaft_bureaucracy: "Рейхсриттершафт Швабенс" #NT!
 swa_reichsritterschaft_bureaucracy_desc: "Конгрегация швабских императорских рыцарей, образованная между 1541 и 1545 годами из распущенного Санкт-Йоргеншильда и разделенная на пять кантонов: Донау, Хегау-Альгау-Бодензее, Неккар-Шварцвальд, Кохер и Крайхгау. Каждым кантоном управлял Директориум под руководством Риттергауптмана, избираемого пожизненно, с избранным Риттеррате; кантоны осуществляли налоговые права и военный суверенитет над своими подданными и продавали рыцарские поместья только другим рыцарям, чтобы сохранить территориальную целостность Риттершафта. Швабские рыцари были самой густонаселенной рыцарской корпорацией в Рейхе и просуществовали непосредственно при императоре до медиатизации в 1805/06 году." #NT!
  
 swa_augsburger_stadtrat_bureaucracy: "Аугсбургский Штадтрат" #NT!
 swa_augsburger_stadtrat_bureaucracy_desc: "Гражданское правительство патрициев и гильдий Аугсбурга, свободного имперского города с 9 марта 1276 года. До 1548 года Крыса находилась под властью Zunftverfassung, гарантировавшей гильдиям большинство над патрициями; Торговые дома Вельзер, Хёхштеттер, Херварт, Баумгартнер и Фуггер располагались рядом с ремесленными гильдиями и Штадтпфлегером. После Аугсбургского мира 1555 года конфессионально-смешанный католико-лютеранский совет возглавил большинство протестантского населения. Аугсбургский Штадтрат был институциональным двигателем южногерманской банковской торговли (частные деньги Фуггеров обычно давались взаймы императорам), пока Тридцатилетняя война не разрушила его." #NT!
