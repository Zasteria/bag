l_russian:
 STATIC_MODIFIER_NAME_nd_riders_of_the_naam: "Всадники Наама" #NT!
 STATIC_MODIFIER_DESC_nd_riders_of_the_naam: "Божественная сила наама течет по венам наших всадников. Наша сила определяется кавалерийской традицией Накомсе, передаваемой от отца к сыну с тех пор, как ее основатели отправились на север от Мампруси. Ни одна империя Сахеля не может сравниться с грохотом наших конных воинов, разносящихся по лугам." #NT!
 STATIC_MODIFIER_NAME_nd_mogho_naaba_court: "Двор Мого Набы" #NT!
 STATIC_MODIFIER_DESC_nd_mogho_naaba_court: "Мого Наба находится на вершине иерархии, которая простирается от Уагадугу до каждой деревни. Его министры, Уиди Наба, командующий кавалерией, Балум Наба, контролирующий управление, Ларле Наба, охраняющий королевские обычаи, образуют администрацию, поразительно сложную для Сахеля." #NT!
 STATIC_MODIFIER_NAME_nd_mossi_earth_awakening: "Пробуждение Храма Земли" #NT!
 STATIC_MODIFIER_DESC_nd_mossi_earth_awakening: "Жрецы земли Тенгсоба возобновили свою связь с землей. Древние святыни Тенгбиисе пульсируют духовной силой, защищая наш народ от иностранных религий и привязывая сообщество к почве, которая поддерживает его." #NT!
 nd_msi.1.t: "Основание Мосси" #NT!
 nd_msi.1.d: "Разбросанные королевства Мосси объединились под одним знаменем. От верховьев Вольты до окраин Сахеля потомки Уэдраого теперь говорят в один голос. Но какую нацию мы создадим из этого союза? Военная аристократия Накомсе готова к выступлению, их кавалерия наводит ужас как на Мали, так и на Сонгае. Однако двор Мого Наба в Уагадугу предлагает другой путь: священный институт наам, сложную иерархию провинциальных наба и деревенских вождей, систему управления, которая веками существовала благодаря мудрости, а не только завоеваниям.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_msi.1.a: "Пусть копыта наших коней сотрясут землю!" #NT!
 nd_msi.1.b: "Мудрость Мого Наба будет руководить нашим народом." #NT!
 nd_msi.2.t: "Поездка Накомсе вперед" #NT!
 nd_msi.2.d: "Всадники Накомсе превратили свои древние кавалерийские традиции в дисциплинированную боевую силу. С тех пор, как предки-основатели прибыли на север из земель Мампруси, конная война стала неотъемлемым правом правящего класса Мосси. Теперь, имея надлежащие тренировочные площадки и программы разведения, наша кавалерия вселяет страх в сердца соседних королевств. Гром копыт по саванне — это звук силы Мосси." #NT!
 nd_msi.2.a: "Наам дает нам право ездить и править." #NT!
 nd_msi.3.t: "Священное учреждение Наама" #NT!
 nd_msi.3.d: "Мого Наба завершила трансформацию правления Моси в систему священного королевского сана, не имеющую аналогов в Сахеле. Власть наама, божественная власть управлять, течет от Мого Наба через провинциальные набы к деревенским вождям, создавая непрерывную цепь законной власти. Ежедневная церемония ложного отъезда, во время которой Мого Наба садится на лошадь, как будто бросив свой народ, прежде чем его уговорят остаться, напоминает всем, что преданность короля своим подданным возобновляется каждое утро." #NT!
 nd_msi.3.a: "Наам выстоит, как и наше королевство." #NT!
 nd_msi.4.t: "Говорят Святыни Земли" #NT!
 nd_msi.4.d: "Тенгбиисе, коренные жители наших земель, возобновили древний завет между людьми и землей. В каждой деревне жрец земли тенгсоба ухаживает за священными рощами, где обитают духи земли. Эти святыни появились еще до завоевания Накомсе, и их сила по-прежнему важна для жизни Мосси. Земля дарует плодородие нашим полям, защиту нашим деревням и духовную власть, которая дополняет политическую власть набаса. В то время как исламское влияние проникает с севера, наши земные святыни остаются бастионами традиций предков." #NT!
 nd_msi.4.a: "Духи земли охраняют наш образ жизни." #NT!
 nd_msi.5.t: "Перекресток Сахеля" #NT!
 nd_msi.5.d: "Торговцы Мосси создали сеть караван-сараев, связывающих наши рынки с великими транссахарскими маршрутами. Хлопчатобумажная ткань, сотканная на наших ткацких станках, скот из наших стад и просо с наших полей утекают на север, а соль, орехи кола и предметы роскоши направляются на юг через нашу территорию. Облагая налогами и защищая эти торговые пути, моси стали важными посредниками в торговле западного Сахеля, становясь процветающими без завоевательных войн, охвативших Мали и Сонгай." #NT!
 nd_msi.5.a: "Наши рынки должны стать местом встречи народов." #NT!
 nd_msi_nakomse_horsemen: "Накомсе Верховая езда" #NT!
 nd_msi_nakomse_horsemen_desc: "Кавалерийские традиции воинской аристократии Накомсе, берущие свое начало от всадников-основателей из Мампруси." #NT!
 nd_msi_earth_shrine_tradition: "Традиция Храма Земли" #NT!
 nd_msi_earth_shrine_tradition_desc: "Древняя практика поддержания священных земных святынь, за которыми ухаживают жрецы тенгсоба, связывающая общину с духовной силой земли." #NT!
 nd_msi_ironworking_lineages: "Железообработка" #NT!
 nd_msi_ironworking_lineages_desc: "Внушающая страх каста кузнецов Мосси, чье мастерство в выплавке и ковке железа считается одновременно важным и духовно опасным." #NT!
 nd_msi_volta_agriculture: "Вольта Сельское хозяйство" #NT!
 nd_msi_volta_agriculture_desc: "Интенсивное выращивание проса, сорго и других культур в плодородном районе истоков реки Вольта.\n\n#italic Доступно в: $nd_msi_forge$#!" #NT!
 nd_msi_naba_hierarchy: "Иерархия Наба" #NT!
 nd_msi_naba_hierarchy_desc: "Многоуровневая система провинциальных набов, окружных глав и деревенских набов, которая передает власть Мого Наба по всему королевству." #NT!
 nd_msi_cotton_weaving: "Хлопковое Ткачество" #NT!
 nd_msi_cotton_weaving_desc: "Традиционное плетение хлопчатобумажной ткани на ленточных станках, при котором женщины прядут и красят нить, а мужчины вплетают из нее характерные ткани Мосси." #NT!
 nd_msi_lancer_tradition: "Лансер Традиция" #NT!
 nd_msi_lancer_tradition_desc: "Профессиональные конные воины, вооруженные копьями с железными наконечниками, выкованными кузнецами Мосси, тяжелым оружием кавалерии Накомсе." #NT!
 nd_msi_sacred_kingship: "Священное Царство" #NT!
 nd_msi_sacred_kingship_desc: "Институт наама, божественной власти управлять, и тщательно продуманный двор Мого Наба с шестью могущественными министрами." #NT!
 nd_msi_mali_resistance: "Сопротивление Мали" #NT!
 nd_msi_mali_resistance_desc: "Вызывающее сопротивление королевств Моси Империи Мали, совершающее набеги на ее караваны и гарнизоны вместо того, чтобы подчиняться ее власти." #NT!
 nd_msi_horse_rearing: "Выращивание лошадей" #NT!
 nd_msi_horse_rearing_desc: "Специализированные программы разведения, позволяющие производить выносливых лошадей, необходимых для доминирования кавалерии Мосси на лугах Сахеля.\n\n#italic Доступно в: $nd_msi_caravanserai$#!" #NT!
 nd_msi_sahel_trade_network: "Торговая сеть Сахеля" #NT!
 nd_msi_sahel_trade_network_desc: "Сеть рынков и караван-сараев, связывающая земли Мосси с транссахарскими торговыми путями, обменивающая хлопок, крупный рогатый скот и зерно на соль и предметы роскоши." #NT!
 nd_msi_provincial_courts: "Провинциальные суды" #NT!
 nd_msi_provincial_courts_desc: "Система регионального управления, при которой провинциальные набы вершат суд, отправляют правосудие и собирают дань со значительной местной автономией." #NT!
 nd_msi_iron_guard_tradition: "Традиция Железной Гвардии" #NT!
 nd_msi_iron_guard_tradition_desc: "Элитная пехота, вооруженная оружием из превосходного железа Мосси, обученная удерживать позицию во время маневров кавалерии." #NT!
 nd_msi_songhai_defiance: "Сонхай Дефаенс" #NT!
 nd_msi_songhai_defiance_desc: "Упорное сопротивление Мосси экспансии Сонхая, укрепление деревень и использование знаний о местности, чтобы компенсировать военные преимущества более крупной империи." #NT!
 nd_msi_mask_artistry: "Маска Артистизм" #NT!
 nd_msi_mask_artistry_desc: "Характерные высокие маски мосси, вырезанные в честь предков и духов природы, используемые на фестивалях и церемониях, объединяющих сообщества.\n\n#italic Доступно в: $nd_msi_caravanserai$#!" #NT!
 nd_msi_trade_caravans: "Торговые караваны" #NT!
 nd_msi_trade_caravans_desc: "Организованные торговые экспедиции, которые перевозят товары Мосси через Сахель, устанавливая дипломатические отношения наряду с коммерческими.\n\n#italic Доступно в: $nd_msi_caravanserai$#!" #NT!
 nd_msi_ancestor_veneration: "Почитание предков" #NT!
 nd_msi_ancestor_veneration_desc: "Углубление практики поклонения предкам, когда подношения в отцовских святилищах связывают живых с мудростью и защитой их предков." #NT!
 nd_msi_dolo_tradition: "Доло Традиция" #NT!
 nd_msi_dolo_tradition_desc: "Совместное производство доло, пшенного пива, которое служит одновременно основным напитком и центральным элементом общественных и религиозных собраний.\n\n#italic Доступно в: $nd_msi_forge$#!" #NT!
 nd_msi_fortified_villages: "Укрепленные деревни" #NT!
 nd_msi_fortified_villages_desc: "Практика окружения деревень оборонительными стенами и рвами, создавая сеть опорных пунктов на территории Мосси.\n\n#italic Доступно в: $nd_msi_forge$#!" #NT!
 nd_msi_sahel_riders_advance: "Сахель Райдерс" #NT!
 nd_msi_sahel_riders_advance_desc: "Конные воины адаптировались ко всему ландшафту Сахеля, одинаково чувствуя себя как на лугах, так и в кустарниках, а их тактика оттачивалась веками приграничных войн." #NT!
 nd_msi_naam_consolidation: "Консолидация Наам" #NT!
 nd_msi_naam_consolidation_desc: "Укрепление священной власти Мого Наба, централизация института Наам для создания более эффективного управления в Соединённых королевствах." #NT!
 nd_msi_gold_dust_trade: "Торговля Золотым Пылем" #NT!
 nd_msi_gold_dust_trade_desc: "Торговцы Мосси получают доступ к торговле золотым песком, поступающему из южных рудников через их территорию, обогащая казну королевства.\n\n#italic Доступно в: $nd_msi_caravanserai$#!" #NT!
 nd_msi_indigo_dyeing: "Крашение Индиго" #NT!
 nd_msi_indigo_dyeing_desc: "Мастерство окрашивания индиго, которое превращает хлопчатобумажную ткань Мосси в ценные товары, востребованные во всей Западной Африке.\n\n#italic Доступно в: $nd_msi_forge$#!" #NT!
 nd_msi_false_departure_ceremony: "Церемония ложного отъезда" #NT!
 nd_msi_false_departure_ceremony_desc: "Ежедневный ритуал, когда Мого Наба садится на лошадь, как будто собираясь уйти, только для того, чтобы его уговорили остаться, — мощный символ завета между правителем и народом." #NT!
 nd_msi_regional_autonomy: "Региональная автономия" #NT!
 nd_msi_regional_autonomy_desc: "Тщательный баланс между центральной властью и автономией провинций, который позволил королевствам Мосси управлять различными народами, не провоцируя восстаний." #NT!
 nd_msi_naam_cavalry_advance: "Наам Кавалерия" #NT!
 nd_msi_naam_cavalry_advance_desc: "Последняя великая эволюция конной войны Мосси, сочетающая традиционное искусство верховой езды с современной тактической дисциплиной под руководством Наама." #NT!
 nd_msi_mogho_naba_reforms: "Реформы Мого Наба" #NT!
 nd_msi_mogho_naba_reforms_desc: "Административные реформы, которые модернизируют государство Моси, сохраняя при этом основные институты Наама и священную власть Мого Наба." #NT!
 nd_msi_sahel_diplomacy: "Сахельская дипломатия" #NT!
 nd_msi_sahel_diplomacy_desc: "Сложная дипломатическая традиция развивалась на протяжении столетий плавания между более крупными империями, поддержания независимости посредством создания альянсов и умелых переговоров." #NT!
 nd_msi_cotton_exports: "Экспорт хлопка" #NT!
 nd_msi_cotton_exports_desc: "Расширение производства хлопчатобумажных тканей Мосси из местной торговли в основной экспортный товар, при этом полосатый текстиль выходит на рынки по всему Сахелю и за его пределами.\n\n#italic Доступно в: $nd_msi_caravanserai$#!" #NT!
 nd_msi_warrior_aristocracy: "Воинская аристократия" #NT!
 nd_msi_warrior_aristocracy_desc: "Класс воинов Накомсе превратил свои боевые традиции в профессиональное военное учреждение, сочетающее традиции благородной кавалерии с дисциплинированной подготовкой." #NT!
 nd_msi_mossi_jurisprudence: "Мосси Юриспруденция" #NT!
 nd_msi_mossi_jurisprudence_desc: "Кодификация правовых традиций Моси, опирающаяся на двойные источники политической власти со стороны наба и духовной власти со стороны земных жрецов тэнсоба." #NT!
 nd_msi_modern_horsemen: "Современные всадники" #NT!
 nd_msi_modern_horsemen_desc: "Адаптация кавалерии Мосси к современности, сочетающая традиционную мобильность на лугах с современной военной организацией." #NT!
 nd_msi_mossi_renaissance: "Мосси Ренессанс" #NT!
 nd_msi_mossi_renaissance_desc: "Расцвет интеллектуальной жизни Мосси, когда традиционные системы знаний взаимодействуют с новыми идеями, текущими по торговым путям Сахеля." #NT!
 nd_msi_sahel_confederation: "Сахельская Конфедерация" #NT!
 nd_msi_sahel_confederation_desc: "Видение более широкого политического союза Сахеля, распространяющего модель федеративного управления Мосси на соседние народы в рамках общей структуры." #NT!
 nd_msi_industrial_weaving: "Промышленное ткачество" #NT!
 nd_msi_industrial_weaving_desc: "Механизация древней традиции ленточных ткацких станков, превращающая хлопковое ткачество Мосси из деревенского ремесла в промышленное предприятие." #NT!
 nd_msi_lasting_traditions: "Прочные традиции" #NT!
 nd_msi_lasting_traditions_desc: "Удивительная устойчивость культурных традиций Мосси, масок, земных святынь, наама, ежедневных церемоний, переживших столетия перемен и внешнего давления." #NT!
 nd_msi_volta_breadbasket: "Хлебница Вольта" #NT!
 nd_msi_volta_breadbasket_desc: "Превращение верховьев реки Вольта в крупный сельскохозяйственный регион, кормящий растущее население за счет интенсификации сельского хозяйства и совершенствования технологий." #NT!
 a_nd_msi_nakomse_horsemen: "Всадники Накомсе" #NT!
 a_nd_msi_nakomse_horsemen_desc: "Конные воины правящего класса Мосси, чьи кавалерийские традиции восходят к предкам-основателям, приехавшим на север из Мампруси. Вооруженные копьями и сражающиеся верхом на открытых лугах, они являются воплощением силы Наама." #NT!
 a_nd_msi_lancers: "Мосси Лансерс" #NT!
 a_nd_msi_lancers_desc: "Профессиональная кавалерия, вооруженная копьями с железными наконечниками, выкованными кузнецами Мосси. Эти конные воины сочетают в себе традиционные навыки верховой езды накомсе с более тяжелым вооружением, образуя ударную силу армий Мосси." #NT!
 a_nd_msi_iron_guard: "Мосси Железный страж" #NT!
 a_nd_msi_iron_guard_desc: "Тяжелая пехота, оснащенная превосходным оружием и доспехами внушающих страх родов кузнецов Мосси. Эти солдаты держат строй, пока маневрирует кавалерия, их железные щиты и клинки являются свидетельством мастерства кузнеца." #NT!
 a_nd_msi_sahel_riders: "Сахель Райдерс" #NT!
 a_nd_msi_sahel_riders_desc: "Конные воины адаптировались ко всему спектру местности Сахеля, от открытых лугов до кустарниковых окраин пустыни. Быстрые и тактически гибкие, они превосходно справляются с фланговыми маневрами и быстрыми рейдами." #NT!
 a_nd_msi_naam_cavalry: "Наам Кавалерия" #NT!
 a_nd_msi_naam_cavalry_desc: "Последняя эволюция традиции верховой езды накомсе, сочетающая столетия верховой езды на лугах с современной тактической дисциплиной. Выросшие через систему набора из благородных семей, несущих наам, они борются за божественные права так же, как и за территорию." #NT!
 levy_nd_msi_nakomse_horsemen: "Накомсе Всадники Леви" #NT!
 levy_nd_msi_nakomse_horsemen_desc: "Благородная кавалерия, собранная из воинской аристократии Накомсе, конных налетчиков, олицетворяющих основополагающие традиции всадников королевств Мосси." #NT!
 levy_nd_msi_naam_cavalry: "Наам Кавалерийский Леви" #NT!
 levy_nd_msi_naam_cavalry_desc: "Набор благородной и солдатской кавалерии, собранный под священной властью Наама, сочетающий традиционное искусство верховой езды Мосси с дисциплинированной ездой в строю." #NT!
 nd_msi_nabas_court: "Суд Набы" #NT!
 nd_msi_nabas_court_desc: "Административный комплекс Мосси-наба, где вождь держит суд в окружении своих министров и слуг. Провинциальные суды повторяют структуру собственного дворца Мого Наба в Уагадугу, создавая цепочку управления от столицы до деревни." #NT!
 nd_msi_earth_shrine: "Храм Земли" #NT!
 nd_msi_earth_shrine_desc: "Священная роща, за которой ухаживает жрец земли Тенгсоба, где приносятся подношения духам земли. Эти древние святыни возникли еще до политической власти Моси и по-прежнему играют важную роль в плодородии сельского хозяйства и сплоченности общества." #NT!
 nd_msi_forge: "Мосси Фордж" #NT!
 nd_msi_forge_desc: "Мастерская, которой управляют внушающие страх кузнецы из рода Мосси, владеющие опасными и мощными знаниями в области выплавки железа. В их кузницах производят оружие, инструменты и инвентарь, поддерживающий как военную, так и сельскохозяйственную жизнь королевства." #NT!
 nd_msi_caravanserai: "Сахель Караван-сарай" #NT!
 nd_msi_caravanserai_desc: "Укрепленная станция отдыха вдоль торговых путей, предлагающая убежище, воду и рынки для караванов, перевозящих соль, орехи кола, хлопок и домашний скот через Сахель." #NT!
 nd_msi_weaving_house: "Ткацкий Дом" #NT!
 nd_msi_weaving_house_desc: "Мастерская, где мужчины Мосси работают на узких полосатых ткацких станках, вплетая хлопчатобумажные нити, сплетенные и окрашенные женщинами, в длинные ленты, из которых сшиваются халаты и торговая одежда." #NT!
 nd_msi_court_maintenance: "Обслуживание суда" #NT!
 nd_msi_court_maintenance_desc: "Скот и прекрасная ткань необходимы для поддержания достоинства и работы административного суда набы." #NT!
 nd_msi_shrine_offerings: "Подношения святыни" #NT!
 nd_msi_shrine_offerings_desc: "Приносили в жертву домашний скот, зажигали свечи из пчелиного воска и сжигали благовония в земных святилищах, чтобы поддержать завет между общиной и духами земли." #NT!
 nd_msi_forge_upkeep: "Кузнечное производство" #NT!
 nd_msi_forge_upkeep_desc: "Священные кузницы кузнечных родов плавили железную руду с древесным углем для производства инструментов, поддерживающих сельское хозяйство и войну мосси." #NT!
 nd_msi_caravanserai_upkeep: "Содержание караван-сарая" #NT!
 nd_msi_caravanserai_upkeep_desc: "Скот и зерно для отдыхающих на станции караванов и их проводников." #NT!
 nd_msi_weaving_upkeep: "Хлопковое Ткачество" #NT!
 nd_msi_weaving_upkeep_desc: "Хлопчатобумажная нить, скрученная и окрашенная в цвет индиго, ткется на узких полосатых ткацких станках в характерную ткань, которой торгуют по всему Сахелю." #NT!
 nd_msi_horse_breeding: "Разведение лошадей Мосси" #NT!
 nd_msi_horse_breeding_desc: "Специализированное разведение выносливых кавалерийских скакунов, необходимое для поддержания традиции конных воинов Накомсе." #NT!
 nd_msi_dolo_brewing: "Доло Пивоварение" #NT!
 nd_msi_dolo_brewing_desc: "Совместное пивоварение доло из проса, производящее пиво, занимающее центральное место на общественных и религиозных собраниях Мосси." #NT!
 nd_msi_millet_processing: "Переработка проса" #NT!
 nd_msi_millet_processing_desc: "Систематическая обработка и хранение урожая проса и сорго в верховьях Вольты с использованием глиняной посуды для сосудов для хранения зерна." #NT!
 nd_msi_gold_trade: "Торговля Золотым Пылем" #NT!
 nd_msi_gold_trade_desc: "Взвешивание, сортировка и распределение золотого песка, проходящего через территорию Мосси из южных рудников, с бумажными записями, отслеживающими транзакции." #NT!
 nd_msi_indigo_processing: "Обработка Индиго" #NT!
 nd_msi_indigo_processing_desc: "Экстракция красителя индиго из культурных растений, в результате чего получают ценные синие красители, используемые в производстве хлопкового текстиля Мосси." #NT!
 nd_msi_salt_distribution: "Распределение соли" #NT!
 nd_msi_salt_distribution_desc: "Разбивание и раздача соляных блоков, доставленных из сахарских рудников через торговые города Мосси, упакованных в керамические сосуды для транспортировки." #NT!
 nd_msi_mask_carving: "Маска Резьба" #NT!
 nd_msi_mask_carving_desc: "Создание церемониальных масок в честь предков и духов природы, вырезанных из дерева и украшенных натуральными пигментами." #NT!
 nd_msi_export_cotton: "Экспортная обработка хлопка" #NT!
 nd_msi_export_cotton_desc: "Крупномасштабная переработка и упаковка хлопчатобумажной ткани для экспорта на отдаленные рынки Сахеля и за его пределы." #NT!
 nd_msi_village_defense: "Деревенские оборонные работы" #NT!
 nd_msi_village_defense_desc: "Строительство и обслуживание земляных стен, рвов и частоколов, защищающих деревни Мосси от налетчиков." #NT!
 nd_msi_formed_tt: "Мосси был сформирован" #NT!
 nd_msi_path_a_tt: "Избранные всадники Наама" #NT!
 nd_msi_path_b_tt: "Выбрал двор Мого Набы." #NT!
 nd_msi_destiny: "Судьба Мосси" #NT!
 nd_msi_destiny_desc: "Королевства Мосси едины. Будь то гром кавалерии или мудрость двора Мого Наба, детей Уэдраого ждет великая судьба." #NT!
 nd_msi_dest_sahel_vanguard: "Сахель Авангард" #NT!
 nd_msi_dest_sahel_vanguard_desc: "Завоюйте земли Дагомбы на юге, защитив ворота Йенди и Салага для кавалерии Мосси. Создайте армию, достойную традиций Накомсе." #NT!
 nd_msi_dest_niger_campaign: "Нигерская кампания" #NT!
 nd_msi_dest_niger_campaign_desc: "Двигайтесь на север, чтобы захватить богатый торговый город Дженне и переправу через реку Нигер в Сае. Сокровища излучины Нигера ждут тех, кто осмелится их захватить." #NT!
 nd_msi_dest_war_camp: "Военный лагерь Наама" #NT!
 nd_msi_dest_war_camp_desc: "Завершите завоевание излучины Нигера, взяв Тимбукту и Гао, легендарные города, которые когда-то были столицами Мали и Сонхая. Имея в руках эти награды, кавалерийская империя Мосси превзойдет все, что было раньше." #NT!
 nd_msi_dest_court_foundation: "Суд Фонд" #NT!
 nd_msi_dest_court_foundation_desc: "Сделайте двор Мого Наба центром процветающего королевства. Добывайте соль для рынков и развивайте землю, пока каждая деревня не станет процветать под защитой Наама." #NT!
 nd_msi_dest_naam_institutions: "Наамские учреждения" #NT!
 nd_msi_dest_naam_institutions_desc: "Используйте современные финансовые учреждения и расширьте коммерческую деятельность суда на торговый золотом город Бего. Система Наам обеспечивает стабильность; теперь оно также должно обеспечить процветание." #NT!
 nd_msi_dest_market_hall: "Большой рынок Сахеля" #NT!
 nd_msi_dest_market_hall_desc: "Превратите королевство Мосси в главную торговую державу Сахеля. Привозите золото на рынки капитала, развивайте землю беспрецедентно и защитите южный торговый центр Конг." #NT!
 nd_msi.6.t: "Путь судьбы Мосси" #NT!
 nd_msi.6.d: "Королевства Мосси достигли единства, о котором наши предки только мечтали. От залов Уагадугу до провинциальных судов Ятенги и Тенкодого сила Наама связывает нас вместе. Теперь вопрос не в том, выдержим ли мы (мосси всегда выживали), а в том, как мы вырастем. Наша судьба лежит перед нами и ждет, чтобы ее определил выбор этого поколения." #NT!
 nd_msi.6.a: "Наам приведет нас к величию." #NT!
 nd_msi.7.t: "Дагомба" #NT!
 nd_msi.7.d: "Гром кавалерии Мосси эхом разнесся по южным лугам. Королевство Дагомба, воины которого когда-то препятствовали нашему проходу, теперь склоняется перед мощью Накомсе. Рынки Йенди и Салага, богатые орехами кола и торговые связи с лесными королевствами, теперь питают нашу военную машину. Наши всадники свободно перемещаются от верховьев Вольты до края лесополосы. Первый удар нанесен; Нигер-Бенд манит." #NT!
 nd_msi.7.a: "Наши копыта понесут нас еще дальше." #NT!
 nd_msi.8.t: "Водопад Нигер-Бенд" #NT!
 nd_msi.8.d: "Дженне, жемчужина Нигера, попала в руки Мосси. Наша кавалерия, потомки воинов, которые на протяжении веков совершали набеги на караваны Мали, наконец-то захватили трофей, который их предки могли только разграбить. Огромная мечеть из сырцового кирпича смотрит вниз на знамена Моси, а речная торговля, которая когда-то обогащала Сонгай, теперь течет через наши руки. Как нам закрепить это завоевание?" #NT!
 nd_msi.8.a: "Ударь быстро, бей сильно. Сахель боится нас!" #NT!
 nd_msi.8.b: "Наши гонщики – наше наследие, сила в седле." #NT!
 nd_msi.9.t: "Мастера Нигера" #NT!
 nd_msi.9.d: "Тимбукту и Гао, столпы-близнецы цивилизации Сахеля, теперь подчиняются Мого Наба. То, что империи Мали и Сонгай строили на протяжении веков, кавалерия Мосси завоевала за одно поколение. Транссахарские караваны, которые когда-то перевозили соль и золото через зарубежные королевства, теперь проходят под нашей защитой. Ученые медресе Тимбукту пишут о Моси с тем же трепетом, который когда-то был свойствен Мансе Мусе. Как мы будем управлять этим обширным царством?" #NT!
 nd_msi.9.a: "Мы гегемония. Все склоняются перед наамом." #NT!
 nd_msi.9.b: "Мы — империя. Все служат знамени Мосси." #NT!
 nd_msi.10.t: "Суд пускает корни" #NT!
 nd_msi.10.d: "Мечта Мого Наба о процветающем, хорошо организованном королевстве начинает приносить плоды. Караваны с солью регулярно прибывают на наши рынки, привозя с собой необходимый товар, который сохраняет продукты питания и обеспечивает торговлю на дальние расстояния. Деревни по всему региону Вольта процветают под защитой провинциальных наба, их зернохранилища полны, а поля расширяются. Двойная власть политического Наама и духовной власти земных жрецов создает стабильность, которой завидуют соседние королевства. Это управление, как задумали предки." #NT!
 nd_msi.10.a: "Процветание растет там, где укореняется хорошее управление." #NT!
 nd_msi.11.t: "Наам охватывает коммерцию" #NT!
 nd_msi.11.d: "Древний институт Наама оказался удивительно адаптируемым. То, что началось как божественный мандат на управление, превратилось в основу экономического управления. Торговцы Мосси, действующие под защитой и контролем иерархии наба, установили постоянные торговые отношения, простирающиеся даже на юг, вплоть до богатых золотом лесов Бегхо. Принятие судом современных финансовых практик не уменьшило его священный характер, а, скорее, продемонстрировало, что мудрость и богатство не должны соперничать." #NT!
 nd_msi.11.a: "Торговля будет течь по каналам Наама." #NT!
 nd_msi.11.b: "Мудрость суда привлекает всех, кто ищет порядка." #NT!
 nd_msi.12.t: "Золотой век Мосси" #NT!
 nd_msi.12.d: "Золото течет через наши рынки капитала. Торговый центр Конг соединяет наше королевство с богатствами лесных королевств. Застройка простирается от края Сахеля до южных лесов. Мого Наба управляет царством, которое поразило бы предков-основателей не потому, что оно было завоевано мечом, а потому, что оно было построено путем постоянного применения мудрости Наама к решению проблем управления и торговли. Модель Мосси, стабильность через священную иерархию, процветание через контролируемую торговлю, является маяком для Сахеля." #NT!
 nd_msi.12.a: "Пусть процветание Мосси осветит путь вперед." #NT!
 nd_msi.12.b: "Наам остается наследием для всех возрастов." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_thunder: "Сахель Тандер" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_thunder: "Один лишь слух о марше кавалерии Мосси заставляет врагов броситься укреплять свои города. Война наступает быстро, хотя затраты на поддержание такой устрашающей репутации напрягают казну." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_raider_legacy: "Рейдерское наследие" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_raider_legacy: "Всадники Мосси поддерживают традицию набегов своих предков Накомсе, быстро пополняя и поддерживая кампании вдали от дома за счет эффективного добывания пищи." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_niger_hegemony: "Нигерская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_niger_hegemony: "Кавалерия Мосси доказала, что может взять любой город в Сахеле. Наша способность штурмовать укрепления и диктовать условия мира отражает подавляющее военное превосходство Наама." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_empire: "Сахельская империя" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_empire: "Огромная империя, простирающаяся по всему Сахелю и поддерживаемая профессиональной армией и вспомогательными наемниками. Стоимость поддержания такого большого количества дипломатических связей меркнет по сравнению с полученной военной мощью." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_naam_prosperity: "Наам Процветание" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_naam_prosperity: "Мудрое управление Мого Наба создало процветающую торговую сеть. Торговцы процветают при стабильной политике, а разумная финансовая практика королевства сдерживает инфляцию." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_court_wisdom: "Придворная мудрость" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_court_wisdom: "Сложность судебной системы Мосси позволяет мирно поглощать соседние народы посредством дипломатии, а не войны. Благоприятные условия мира отражают репутацию суда, хотя сосредоточенность на управлении оставляет меньше энергии для военных инноваций." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_golden_age: "Золотой век Сахеля" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_golden_age: "Эпоха беспрецедентного процветания преображает сердце Мосси. Города растут, дороги соединяют рынки, и люди чувствуют глубокое удовлетворение управлением своего правителя." #NT!
 STATIC_MODIFIER_NAME_nd_msi_dest_naam_legacy: "Наам Наследие" #NT!
 STATIC_MODIFIER_DESC_nd_msi_dest_naam_legacy: "Непреходящее наследие управления Наам обеспечивает стабильность на протяжении поколений. Соседние народы относятся к мосси с уважением, а не со страхом, а знать является опорой королевства." #NT!
 nd_msi_war_camp: "Военный лагерь Мосси" #NT!
 nd_msi_war_camp_desc: "Постоянный военный лагерь, где кавалерия Накомсе обучается, экипируется и собирается для завоевательных кампаний, в ходе которых знамя Мосси пронеслось от Вольты до Нигера. В кузницах лагеря производят оружие, а в загонах хранятся лучшие кавалерийские скакуны в Сахеле." #NT!
 nd_msi_grand_market: "Большой рынок Мосси" #NT!
 nd_msi_grand_market_desc: "Обширный торговый комплекс, где встречаются торговцы со всего Сахеля под контролем и защитой назначенных Мого Наба чиновников рынка. Соль с севера, золото с юга, ткани из Мосси и скот с лугов переходят из рук в руки в ходе организованного обмена, который обогащает всех участников." #NT!
 nd_msi_war_camp_upkeep: "Обеспечение военного лагеря" #NT!
 nd_msi_war_camp_upkeep_desc: "Оружие, кожаные доспехи и кавалерийские средства передвижения, необходимые для содержания постоянного военного лагеря, поддерживающего завоевательные кампании Мосси." #NT!
 nd_msi_grand_market_upkeep: "Рыночные операции" #NT!
 nd_msi_grand_market_upkeep_desc: "Хлопчатобумажная ткань для демонстрации торговых товаров, соль для коммерческого обмена и керамические сосуды для взвешивания и хранения продаваемых товаров." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_msi_bureaucracy_authority: "Мосси Государственное искусство" #NT!
 AUTO_MODIFIER_DESC_nd_msi_bureaucracy_authority: "Единое государство Мосси унаследовало институциональный набор инструментов, созданный в Вагадугу, Уахигуе и четырех королевствах-основателях: Совет Найири Пяти Нааба, суд Пятницы Наам, двойной политико-духовный договор с жрецами земли тэнсоба, провинциальную систему накомсе, которая выставила на вооружение кавалерию Сахеля, и торговую хартию Ярса, которая закрепила Вагадугу на Трасса Салага-Тимбукту. Выбирайте, какие учреждения оставить в живых." #NT!
 msi_nayiri_council_bureaucracy: "Наири Совет Пяти Наабов" #NT!
 msi_nayiri_council_bureaucracy_desc: "Избирательный и консультативный совет Мого Нааба, сформированный с момента основания Вагадугу из пяти дворцовых министров: Балума Наабы, главы королевского двора; Гунга Нааба, начальник пехоты; Ларле Нааба, хранитель королевских гробниц и обычаев; Камсаого Нааба, управляющий дворцовыми евнухами; и Уиди Нааба, королевский конюх и начальник кавалерии, декан министров. Совет выбирал каждого нового Мого Наабу из подходящих сыновей покойного короля и мог отказаться от наследника, признанного непригодным для войны или должности. Те же пять должностей управляли судом Ятенга в Уахигуе, и вето совета на преемственность сделало его институциональным противовесом трону на протяжении всей доколониальной эпохи." #NT!
 msi_friday_court_bureaucracy: "Моро-Наба Пятничный суд" #NT!
 msi_friday_court_bureaucracy_desc: "Еженедельная аудитория Наама в Вагадугу, засвидетельствованная устной традицией с момента основания города и до сих пор выступающая на рассвете каждую пятницу в современную эпоху. Мого Нааба выходит из дворца, одетая в красное и сидящая на лошади, как будто на войне; вожди провинций, министры и главы родов располагаются во дворе по рангам; возобновляются клятвы верности и выслушиваются жалобы. Ритуал — это институциональный механизм, посредством которого наам, божественное право командовать, перетекает с трона к каждому правителю империи. Ни один новый глава деревни или провинции не может править без того, чтобы его наам не был передан в Вагадугу." #NT!
 msi_tengsoba_compact_bureaucracy: "Тенгсоба Договор Жреца Земли" #NT!
 msi_tengsoba_compact_bureaucracy_desc: "Двойное поселение между завоевателями Мосси, происходящими от брака принцессы Йенненги и охотника Риале в начале тринадцатого века, и автохтонными вольтийскими народами (ньоньосе, кибси, догоси), которые владели землей до них. Политическая власть Моси (наам) принадлежит накомсе; Духовная власть над землей (тэнга) принадлежит жрецу земли тэнсоба, всегда происходящему из автохтонной линии. Ни одно поле не может быть расчищено, ни одна деревня не может быть основана, ни один дождь не может быть вызван без ритуальной санкции тэнсоба. Договор является институциональной основой сельской стабильности Мосси: он позволяет малочисленной воинской аристократии управлять гораздо большим завоеванным населением, не истребляя при этом его религию." #NT!
 msi_nakomse_provincial_bureaucracy: "Управление провинции Накомсе" #NT!
 msi_nakomse_provincial_bureaucracy_desc: "Патрилинейная система, посредством которой сыновьям Мого Наабы (Дима) были назначены провинции, а двоюродные братья накомсе были назначены на меньшие вожди в центре Мосси. Каждый накомсе владел своей территорией по наследственному праву завоевания, был обязан кавалерийской службой по царскому призыву, собирал дань через деревенских старост и пересылал свою долю на престол. Эта система дала империи знаменитую кавалерию дальнего действия (именно всадники Мосси совершили набег на Мали в 1328-1338 годах и отразили экспедицию Сонгай в 1483 году), но она также питала центробежную тенденцию, которая породила конкурирующие королевства Вагадугу, Ятенга, Тенкодого, Фада Н'Гурма и (позже) Буссума." #NT!
 msi_yarse_charter_bureaucracy: "Ярсе Торговый Устав" #NT!
 msi_yarse_charter_bureaucracy_desc: "Институциональная регистрация ярсе, мусульманских караванных торговцев, говорящих на языке манде, произошла от торговцев Дьюла-Вангара, прибывших в страну Мосси в шестнадцатом и семнадцатом веках. Получив официальные права на жительство в конце восемнадцатого века (некоторые источники датируют грантом Наабы Сааги в 1780 году), Ярсы владели кварталами в Вагадугу, Кая, Ракайе и Патенге, платили трону торговые пошлины и доминировали на дальних расстояниях между лесом Акан в Салаге и излучиной Нигера в Тимбукту. Их эндогамные купеческие роды сохранили ислам и грамотность при дворе, не обращая трон, и предоставили государству Мосси самый надежный источник денежных доходов и единственное окно в сахельский мусульманский политический мир." #NT!
