l_russian:
 STATIC_MODIFIER_NAME_nd_legacy_of_saladin: "Наследие Саладина" #NT!
 STATIC_MODIFIER_DESC_nd_legacy_of_saladin: "Кровь Айюбидов течет в курдских жилах. С гор Курдистана воины, которые когда-то объединили исламский мир под предводительством Саладина, теперь снова едут, неся его военное наследие в новую эпоху завоеваний." #NT!
 STATIC_MODIFIER_NAME_nd_unity_of_the_emirates: "Единство Эмиратов" #NT!
 STATIC_MODIFIER_DESC_nd_unity_of_the_emirates: "Курдские эмираты (Соран, Бабан, Битлис, Бохтан, Ардалан) издавна управляли своими горными долинами с гордой независимостью. Теперь, объединенные под одним знаменем, их коллективная мудрость в управлении и дипломатии создает государство, превосходящее любое отдельно взятое княжество." #NT!
 STATIC_MODIFIER_NAME_nd_krs_chaldiran_pact: "Чалдиранский пакт" #NT!
 STATIC_MODIFIER_DESC_nd_krs_chaldiran_pact: "Союз, заключенный между курдскими эмирами и османским султаном в битве при Чалдыране, обеспечил курдской автономии и военный престиж. Курдская кавалерия сыграла решающую роль, и пакт остается доказательством того, что курдское оружие вызывает уважение." #NT!
 nd_krs.1.t: "Рассвет Курдистана" #NT!
 nd_krs.1.d: "Курдский народ издавна проживал среди горных крепостей Загроса и Тавра, их племенных конфедераций, управляющих долинами, которые империи никогда не могли полностью подчинить. От наследия династии Саладина Айюбидов до автономных эмиратов, которые разделили свои владения между Османской империей и властью Сефевидов, курды сохранили свою идентичность, выкованную в горном камне и закаленную столетиями войн.\n\nТеперь, с образованием Курдистана, начинается новая глава. Вопрос, стоящий перед нацией, является фундаментальным: будет ли Курдистан опираться на свое военное наследие и распространять свою мощь, как это когда-то делал Саладин, или ему следует объединить разрозненные эмираты в единое государство, сила которого заключается в управлении и культурной самобытности?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_krs.1.a: "Мы будем нести меч Саладина!" #NT!
 nd_krs.1.b: "Мы объединим эмираты в один народ." #NT!
 nd_krs.2.t: "Шарафнама" #NT!
 nd_krs.2.d: "В 1597 году принц Шараф-хан Бидлиси из эмирата Битлис завершил свой монументальный труд «Шарафнама» — первую всеобъемлющую историю курдского народа. Написанная на персидском языке, чтобы охватить как можно более широкую аудиторию, «Шарафнама» рассказывает о великих курдских династиях от древности до золотого века Айюбидов и до автономных эмиратов его времени.\n\nРабота документирует Марванидов Амеда, Хасанвайхидов, Фадлуидов и, прежде всего, дом Саладина, сплетая их в единое повествование о курдской цивилизации. Впервые история курдского народа существует не в виде фрагментов воспоминаний и устных преданий, а в виде письменной записи, которая может пережить поколения.\n\nШарафнама — это одновременно история и декларация, заявление о том, что курдский народ имеет прошлое, достойное его гор, и будущее, заслуживающее признания." #NT!
 nd_krs.2.a: "Наша история сохранится в чернилах, как в камне." #NT!
 nd_krs.3.t: "Альянс в Чалдиране" #NT!
 nd_krs.3.d: "Летом 1514 года курдский ученый и государственный деятель Идрис Битлиси совершил то, что не удавалось ни одному дипломату до него: объединение более двадцати курдских эмиров под единым военным знаменем. Используя суннитскую веру курдов против вторгающегося шиитского государства Сефевидов, Битлиси убедил горных лордов, что их будущее зависит от османского султана Селима I.\n\nКурдская кавалерия сыграла решающую роль в битве при Чалдыране, где ее знание местности и ожесточенные бои повернули османский фланг против сил шаха Исмаила. В знак признания Селим послал пятнадцать знамен и пятьсот королевских мантий курдским князьям, официально закрепив автономию, которая будет действовать веками.\n\nЭтот союз обеспечил курдскому самоуправлению в рамках Османской империи, эмиры сохранили наследственное правление, свои собственные суды и контроль над горными перевалами. Это было не подчинение, а партнерство, купленное курдской кровью на поле боя." #NT!
 nd_krs.3.a: "Пакт скреплен кровью и честью." #NT!
 nd_krs.3.b: "Нам не нужны союзники; наши горы – наша сила." #NT!
 nd_krs_mountain_strongholds: "Горные крепости" #NT!
 nd_krs_mountain_strongholds_desc: "Курдское нагорье усеяно древними крепостями: Амадия возвышается на отвесных скалах, Хасанкейф возвышается над Тигром с отвесных известняковых скал – позиции, которые тысячелетиями бросали вызов захватчикам." #NT!
 nd_krs_tribal_confederacy: "Племенная Конфедерация" #NT!
 nd_krs_tribal_confederacy_desc: "Курдское управление уже давно осуществляется через конфедерации племен, каждое из которых возглавляет ага или бек, объединенных под руководством верховных вождей, которые балансируют автономию с коллективной защитой." #NT!
 nd_krs_kurdish_horsemanship: "Курдское искусство верховой езды" #NT!
 nd_krs_kurdish_horsemanship_desc: "Курдское нагорье разводило как умелых наездников, так и выносливых горных лошадей. Курдская кавалерия служила под началом Айюбидов, сражаясь от Дамаска до Египта." #NT!
 nd_krs_ayyubid_legacy: "Наследие Айюбидов" #NT!
 nd_krs_ayyubid_legacy_desc: "Саладин аль-Айюби, выходец из курдского клана Равадия, основал династию, которая объединила Египет и Сирию и вернула Иерусалим. Его наследие военного мастерства и справедливого управления определяет курдскую идентичность." #NT!
 nd_krs_highland_shepherds: "Хайлендские пастухи" #NT!
 nd_krs_highland_shepherds_desc: "Сезонная миграция курдских пастухов между летними высокогорными пастбищами и равнинными зимними пастбищами поддерживала экономику шерсти, сыра и домашнего скота, которая существовала еще до империй." #NT!
 nd_krs_frontier_raiders: "Пограничные рейдеры" #NT!
 nd_krs_frontier_raiders_desc: "Курдские племена на границах между великими империями превратили набеги в форму искусства, нанося удары с горных перевалов и исчезая в местности, по которой ни один преследователь не мог пройти." #NT!
 nd_krs_caravan_waystations: "Путевые станции караванов" #NT!
 nd_krs_caravan_waystations_desc: "Горные перевалы Курдистана пересекают сухопутные торговые пути между Месопотамией, Персией и Анатолией. Курдские перевалочные пункты обеспечивали приют, корм и защиту торговцам, пересекавшим высокогорье." #NT!
 nd_krs_sufi_lodges: "Суфийские ложи" #NT!
 nd_krs_sufi_lodges_desc: "Суфийские текке и завия распространились по курдским землям, служа центрами духовной жизни, образования и социального обеспечения. Ордена Накшбанди и Кадири пользовались особым влиянием среди курдских общин." #NT!
 nd_krs_mountain_ambush: "Тактика горной засады" #NT!
 nd_krs_mountain_ambush_desc: "Курдские воины усовершенствовали искусство горных засад, нанося удары сверху в узких ущельях, где численное превосходство ничего не значит, а знание местности стоит больше, чем любые укрепления." #NT!
 nd_krs_emirate_courts: "Эмиратские суды" #NT!
 nd_krs_emirate_courts_desc: "Дворы курдских эмиров (Битлис, Соран, Ардалан, Бабан) были центрами персидской и курдской поэзии, исторических наук и художественного покровительства, которые могли соперничать со многими королевскими дворами." #NT!
 nd_krs_kurdish_bowmen: "Курдские лучники" #NT!
 nd_krs_kurdish_bowmen_desc: "Курдские лучники, с юности обученные в горных долинах, могли стрелять из позиций, которых не могла достичь ни кавалерия, ни пехота." #NT!
 nd_krs_chaldiran_alliance: "Чалдиранский Альянс" #NT!
 nd_krs_chaldiran_alliance_desc: "Союз между двадцатью курдскими эмирами и султаном Селимом I в битве при Чалдыране обеспечил курдскую автономию в рамках Османской империи и доказал, что курдская кавалерия имеет решающее значение в столкновении империй." #NT!
 nd_krs_diyarbakir_citadel: "Цитадель Диярбакыра" #NT!
 nd_krs_diyarbakir_citadel_desc: "Базальтовые стены Диярбакыра простираются на пять километров, имеют высоту тридцать футов и толщину шестнадцать футов и входят в число самых грозных укреплений на Ближнем Востоке, объект Всемирного наследия ЮНЕСКО, имеющий непреходящее военное значение." #NT!
 nd_krs_sharafnama: "Шарафнама" #NT!
 nd_krs_sharafnama_desc: "«Шарафнама» 1597 года, написанная принцем Шараф-ханом Бидлиси, представляет собой первую всеобъемлющую историю курдской нации, хронику династий, сражений и традиций, которые придали литературную форму курдской идентичности." #NT!
 nd_krs_silk_road_tolls: "Плата за проезд по Шелковому пути" #NT!
 nd_krs_silk_road_tolls_desc: "Курдские эмираты взимали пошлину с караванов, пересекающих горные перевалы между Месопотамией и Персией, превращая географию в доход и делая курдскую добрую волю необходимой для сухопутной торговли.\n\n#italic Доступно в: $nd_krs_caravan_waystation$#!" #NT!
 nd_krs_irregular_warfare: "Нерегулярная война" #NT!
 nd_krs_irregular_warfare_desc: "Курдские боевики вели войну, соответствующую их местности, мобильную, децентрализованную, нанося удары с позиций, недоступных для регулярных армий, и отступая в горы, которые они знали как свой собственный дом." #NT!
 nd_krs_baban_governance: "Управление Бабана" #NT!
 nd_krs_baban_governance_desc: "Эмират Бабан, с центром в Сулеймани с 1784 года, разработал сложную административную систему, сочетающую племенные традиции с османской бюрократической практикой, управляя центром курдов на протяжении двух столетий." #NT!
 nd_krs_hamidiye_cavalry: "Курдские конные полки" #NT!
 nd_krs_hamidiye_cavalry_desc: "Курдская кавалерия участвовала в османских кампаниях на Ближнем Востоке, привнося горное искусство верховой езды и яростную племенную преданность в имперские войны от Багдада до Кавказа." #NT!
 nd_krs_kurdish_madrasas: "Курдские медресе" #NT!
 nd_krs_kurdish_madrasas_desc: "Курдские медресе выпустили поколения ученых, поэтов и юристов. Эти центры исламского обучения в таких городах, как Диярбакыр и Сулеймани, сохранили знания и способствовали развитию курдских интеллектуальных традиций." #NT!
 nd_krs_border_autonomy: "Пограничная автономия" #NT!
 nd_krs_border_autonomy_desc: "Курдские эмиры сохраняли самоуправление на границе Османской империи и Сефевидов, их автономия гарантировалась их военной ценностью в качестве стражей горных перевалов между империями." #NT!
 nd_krs_peshmerga_tradition: "Пешмерга Традиция" #NT!
 nd_krs_peshmerga_tradition_desc: "Пешмерга, «те, кому грозит смерть», описывает дух курдского воина. От племенных пограничников до организованных бойцов, традиция пешмерга представляет собой дисциплинированную, самоотверженную преданность защите курдских земель." #NT!
 nd_krs_tribal_modernization: "Племенная модернизация" #NT!
 nd_krs_tribal_modernization_desc: "Трансформация управления курдскими племенами в сторону более централизованных административных структур, принятие современных методов налогообложения, образования и военной организации при сохранении племенной идентичности." #NT!
 nd_krs_mountain_fortifications: "Горные укрепления" #NT!
 nd_krs_mountain_fortifications_desc: "Систематическое укрепление курдских горных перевалов и стратегических высот на основе тысячелетий оборонительной архитектуры от Урарту до периода средневекового эмирата для создания комплексных горных оборонительных сетей." #NT!
 nd_krs_highland_trade_networks: "Хайлендские торговые сети" #NT!
 nd_krs_highland_trade_networks_desc: "Курдские купцы связывали города высокогорья посредством торговых сетей, которые перевозили шерсть, домашний скот, изделия из металла и сельскохозяйственные товары через горную местность.\n\n#italic Доступно в: $nd_krs_highland_trade_post$#!" #NT!
 nd_krs_kurdish_printing: "Курдская печать" #NT!
 nd_krs_kurdish_printing_desc: "Распространение технологии печати позволило распространять курдскую литературу и исторические произведения, укрепляя культурную самобытность и грамотность среди разбросанных горных общин.\n\n#italic Доступно в: $nd_krs_caravan_waystation$#!" #NT!
 nd_krs_national_awakening: "Национальное пробуждение" #NT!
 nd_krs_national_awakening_desc: "Появление самосознательной курдской национальной идентичности, опирающейся на литературное наследие Шарафнама, боевые традиции пешмерга и общий опыт горной автономии." #NT!
 nd_krs_modern_irregulars: "Современные нерегулярные войска" #NT!
 nd_krs_modern_irregulars_desc: "Курдские нерегулярные боевики адаптировались к современной войне, сохраняя при этом свои преимущества в горах, сочетая знание местности с современным вооружением для создания сил, которые обычные армии не могли подавить." #NT!
 nd_krs_highland_industry: "Хайленд Индастри" #NT!
 nd_krs_highland_industry_desc: "Развитие промышленного потенциала в курдских горных городах, переработка местного сырья и производство товаров как для внутреннего потребления, так и для региональной торговли." #NT!
 nd_krs_constitutional_movement: "Конституционное движение" #NT!
 nd_krs_constitutional_movement_desc: "Участие курдов в конституционных и реформаторских движениях, стремящихся к официальному признанию курдских прав и управления в развивающихся политических рамках." #NT!
 a_nd_krs_tribal_cavalry: "Курдская племенная кавалерия" #NT!
 a_nd_krs_tribal_cavalry_desc: "Легкая кавалерия, набранная из курдских племенных конфедераций, обладающая навыками набегов и разведки в горах и на плато." #NT!
 a_nd_krs_highland_raiders: "Хайленд Рейдерс" #NT!
 a_nd_krs_highland_raiders_desc: "Курдские горные бойцы, которые наносят удары с укрытых позиций на горных перевалах, используя преимущество местности для преодоления численного превосходства." #NT!
 a_nd_krs_bowmen: "Курдские лучники" #NT!
 a_nd_krs_bowmen_desc: "Опытные лучники, обученные в горных долинах, способны вести точный огонь с позиций, недоступных для кавалерии и неспособных штурмовать пехоту." #NT!
 a_nd_krs_mountain_ambushers: "Горные засадники" #NT!
 a_nd_krs_mountain_ambushers_desc: "Партизаны, специализирующиеся на тактике горных засад, используют узкие ущелья и каменистую местность для разрушительного воздействия на обычные силы." #NT!
 a_nd_krs_chaldiran_cavalry: "Чалдиранская кавалерия" #NT!
 a_nd_krs_chaldiran_cavalry_desc: "Тяжелая курдская кавалерия создана по образцу всадников, сражавшихся бок о бок с османами в Чалдыране, сочетая племенную свирепость с организованной боевой дисциплиной." #NT!
 a_nd_krs_mountain_guns: "Горная артиллерия" #NT!
 a_nd_krs_mountain_guns_desc: "Легкая артиллерия, приспособленная для ведения боевых действий в горах, предназначенная для транспортировки через узкие перевалы и размещения на высотах с видом на позиции противника." #NT!
 a_nd_krs_peshmerga: "Пешмерга" #NT!
 a_nd_krs_peshmerga_desc: "Дисциплинированная горная пехота, олицетворяющая традицию пешмерга, тех, кто сталкивается со смертью. Обладая навыками оборонительного боя и ведения боевых действий в горах, они составляют основу курдского сопротивления." #NT!
 a_nd_krs_modern_irregulars: "Современные курдские нерегулярные формирования" #NT!
 a_nd_krs_modern_irregulars_desc: "Быстродвижущаяся партизанская пехота, сочетающая современное вооружение с традиционными курдскими знаниями горной местности, наносит удары с позиций, недоступных обычным силам." #NT!
 nd_krs_mountain_stronghold: "Горная крепость" #NT!
 nd_krs_mountain_stronghold_desc: "Укрепленная горная позиция в традициях курдского нагорья, использующая природный ландшафт для создания оборонительного опорного пункта, контролирующего окружающие долины." #NT!
 nd_krs_caravan_waystation: "Караван Путевая станция" #NT!
 nd_krs_caravan_waystation_desc: "Перевалочный пункт на горных торговых путях, обеспечивающий убежище, корм и безопасность караванам, пересекающим курдские территории между Месопотамией и Персией." #NT!
 nd_krs_sufi_lodge: "Суфийская Ложа" #NT!
 nd_krs_sufi_lodge_desc: "Суфийский текке, служащий центром духовной жизни, образования и общественного благосостояния в курдском нагорье. Ордена Накшбанди и Кадири имели большое влияние." #NT!
 nd_krs_citadel: "Курдская цитадель" #NT!
 nd_krs_citadel_desc: "Крупное городское укрепление в традициях легендарных базальтовых стен Диярбакыра, толстых и высоких, построенных так, чтобы выдерживать осаду на протяжении нескольких поколений." #NT!
 nd_krs_madrasa: "Курдское медресе" #NT!
 nd_krs_madrasa_desc: "Центр исламского образования и курдской науки, выпускающий юристов, поэтов и администраторов, обслуживавших суды эмирата." #NT!
 nd_krs_highland_trade_post: "Хайлендский торговый пост" #NT!
 nd_krs_highland_trade_post_desc: "Торговый центр в курдском нагорье, соединяющий горные общины с региональными рынками и облегчающий обмен шерстью, домашним скотом и изделиями из металла." #NT!
 nd_krs_highland_forge: "Хайленд Фордж" #NT!
 nd_krs_highland_forge_desc: "Промышленная мастерская в курдском нагорье, перерабатывающая местное железо и медь в инструменты, оружие и товары для региональной экономики." #NT!
 nd_krs_highland_pastoral: "Хайленд Пастораль" #NT!
 nd_krs_highland_pastoral_desc: "Традиционная курдская горная экономика по производству шерсти и животноводства, поддерживаемая сезонной миграцией между горными и низинными пастбищами." #NT!
 nd_krs_border_tolls: "Пограничные сборы" #NT!
 nd_krs_border_tolls_desc: "Доходы, получаемые от караванов, пересекающих курдские горные перевалы, где географическое положение дает сборщику пошлин неприступное положение." #NT!
 nd_krs_printing_works: "Курдская типография" #NT!
 nd_krs_printing_works_desc: "Типографская мастерская, выпускающая курдские литературные и исторические произведения, распространяющая грамотность и культурную самобытность среди горных общин." #NT!
 levy_nd_krs_mountain_ambushers: "Горный засадник Леви" #NT!
 levy_nd_krs_mountain_ambushers_desc: "Воины племен, выросшие из горных общин, владеющие тактикой партизанских засад и хорошо знающие местность своей родины." #NT!
 levy_nd_krs_highland_raiders: "Хайленд Рейдер Леви" #NT!
 levy_nd_krs_highland_raiders_desc: "Быстро перемещающаяся пехота, набранная из курдских приграничных племен, умеющая наносить удары с горных перевалов и исчезать в высокогорье." #NT!
 nd_krs_stronghold_maintenance: "Содержание крепости" #NT!
 nd_krs_stronghold_maintenance_desc: "Поддержание каменных укреплений, арсенала и кожаного снаряжения горной крепости." #NT!
 nd_krs_waystation_maintenance: "Операции на путевой станции" #NT!
 nd_krs_waystation_maintenance_desc: "Обеспечение перевалочной станции продовольствием, фуражом, солью и кровом для путешествующих торговцев." #NT!
 nd_krs_lodge_maintenance: "Содержание домика" #NT!
 nd_krs_lodge_maintenance_desc: "Содержание суфийской ложи с шерстью и тканью для ковров и церемониальной одежды, а также благовониями для соблюдения ритуалов." #NT!
 nd_krs_citadel_maintenance: "Содержание Цитадели" #NT!
 nd_krs_citadel_maintenance_desc: "Поддержание массивных стен, арсеналов, инструментов и кожаного снаряжения огромной городской цитадели и ее гарнизона." #NT!
 nd_krs_madrasa_maintenance: "Содержание медресе" #NT!
 nd_krs_madrasa_maintenance_desc: "Снабжение курдского учебного центра бумагой, книгами и тканями, научными материалами как для студентов, так и для ученых." #NT!
 nd_krs_trade_post_maintenance: "Операции торгового поста" #NT!
 nd_krs_trade_post_maintenance_desc: "Управление горным торговым центром, управление обменом текстилем, шерстью и солью через горные маршруты." #NT!
 nd_krs_forge_maintenance: "Кузнечные операции" #NT!
 nd_krs_forge_maintenance_desc: "Выплавка железа с древесным углем для ковки инструментов и металлоконструкций в горной мастерской." #NT!
 STATIC_MODIFIER_NAME_nd_krs_self_reliance: "Курдская самообеспеченность" #NT!
 STATIC_MODIFIER_DESC_nd_krs_self_reliance: "Горы Курдистана достаточно крепкие. Не имея союзников, которым можно было бы угодить, или обязательств, которые следует чтить, курдский народ стоит один и стоит твердо." #NT!
 nd_krs_formed_tt: "был образован Курдистан." #NT!
 nd_krs_path_a_tt: "Выбрал «Наследие Саладина»" #NT!
 nd_krs_path_b_tt: "Выбрал Единство Эмиратов" #NT!
 nd_krs_destiny: "Судьба Курдистана" #NT!
 nd_krs_destiny_desc: "Курдистан поднялся с горных перевалов. Вопрос теперь в том, пойдет ли эта нация по военному пути Саладина или наращивает силу за счет единства своих эмиратских традиций." #NT!
 nd_krs_dest_mosul: "Ворота Ниневии" #NT!
 nd_krs_dest_mosul_desc: "Мосул и Эрбиль, великие города верхней Месопотамии, должны попасть под власть курдов. Эти древние центры власти контролируют долину Тигра и открывают дорогу в Сирию." #NT!
 nd_krs_dest_aleppo: "Сирийский марш" #NT!
 nd_krs_dest_aleppo_desc: "Алеппо, жемчужина северной Сирии, и Мардин, крепость Артукидов, должны подчиняться курдской власти. Наследники Саладина продвигаются на юг по маршрутам, по которым шли их предки." #NT!
 nd_krs_dest_damascus: "Реставрация Айюбидов" #NT!
 nd_krs_dest_damascus_desc: "Дамаск, Иерусалим и Каир — три столпа империи Саладина. Удержать их всех — значит полностью восстановить владения Айюбидов, курдской династии, правящей от Нила до Загроса." #NT!
 nd_krs_dest_baban: "Объединение Бабана" #NT!
 nd_krs_dest_baban_desc: "Эмират Бабан, сосредоточенный в Сулеймании, стал пионером сложной курдской системы управления. Защитите центральную часть страны, создайте институты и докажите, что курдское единство можно выковать с помощью закона, а не только меча." #NT!
 nd_krs_dest_sharaf: "Наследие Шараф Хана" #NT!
 nd_krs_dest_sharaf_desc: "Подобно тому, как Шараф Хан Бидлиси вел хронику курдского величия в Шарафнаме, так и Курдистан теперь должен доказать свою цивилизационную глубину посредством процветания, престижа и управления горной экономикой." #NT!
 nd_krs_dest_homeland: "Курдская родина" #NT!
 nd_krs_dest_homeland_desc: "Высшее достижение пути эмирата: Курдистан настолько процветающий и хорошо управляемый, что он является постоянной родиной, его институты могут соперничать с любой империей, его рынки кишат шелком и торговлей." #NT!
 nd_krs.4.t: "Судьба Курдистана" #NT!
 nd_krs.4.d: "Курдистан сделал первые шаги на пути к величию. Горные перевалы, которые давали приют нашим предкам, теперь обозначают границы нации, амбиции которой выходят за рамки любой долины. Будь то завоевание или управление, курдский народ готов вырезать свою судьбу в камнях истории." #NT!
 nd_krs.4.a: "Наша судьба начинается в этих горах." #NT!
 nd_krs.5.t: "Ворота Ниневии" #NT!
 nd_krs.5.d: "Древние города верхней Месопотамии, Мосул с его мостами через Тигр и Эрбиль, чья цитадель была постоянно заселена на протяжении более шести тысяч лет, теперь подчиняются курдской власти. С этих командных позиций перед нами открыта дорога в Сирию.\n\nВ последний раз, когда курдское оружие имело такую ​​власть в Месопотамии, во главе его ехал сам Саладин. Это наследие теперь снова живет." #NT!
 nd_krs.5.a: "Мосул и Эрбиль наши. Сирия ждет." #NT!
 nd_krs.6.t: "Сирийский марш" #NT!
 nd_krs.6.d: "Великая цитадель Алеппо и крепость Мардина на вершине скалы подчинились курдскому суверенитету. Наследники Айюбидов вернули себе северные пределы своих исконных владений, торговые пути между Месопотамией и Средиземноморьем теперь проходят через курдские земли.\n\nНаши армии стоят на пороге Леванта. Вопрос в том, как мы продвигаемся вперед: с яростью священной войны или размеренной рукой пограничных лордов, строящих прочное владычество." #NT!
 nd_krs.6.a: "С огнем и верой мы идем на юг." #NT!
 nd_krs.6.b: "Консолидировать. Создавайте лояльные марши." #NT!
 nd_krs.7.t: "Реставрация Айюбидов" #NT!
 nd_krs.7.d: "Дамаск, Иерусалим и Каир, три столпа, на которых Саладин построил свою империю, снова несут курдское знамя. Восстановление владений Айюбидов завершено. От берегов Нила до вершин Загроса власть курдов неоспорима.\n\nЭто достижение требует заявления о целях. Будет ли Курдистан претендовать на мантию лидера над исламским миром, как это сделал Саладин, когда он объединил верующих против крестоносцев? Или нам следует называть себя хранителями святых мест, защитниками, а не завоевателями?" #NT!
 nd_krs.7.a: "Мы – возрожденные султаны ислама." #NT!
 nd_krs.7.b: "Мы будем хранителями святых мест." #NT!
 nd_krs.8.t: "Объединение Бабана" #NT!
 nd_krs.8.d: "Работа эмиров Бабана продолжается в управлении Курдистаном. Сулеймания, город, который они основали и взращивали, служит доказательством того, что курдская администрация может добиться длительного процветания. Законодательные кодексы, налоговые регистры и дипломатические каналы теперь связывают эмираты крепче, чем любая клятва на племенную верность.\n\nОсновы заложены. То, что произойдет с ними, определит, будет ли Курдистан существовать вечно или вечно." #NT!
 nd_krs.8.a: "Эмираты едины в законе." #NT!
 nd_krs.9.t: "Наследие Шараф Хана" #NT!
 nd_krs.9.d: "Курдистан достиг того, что Шараф Хан Бидлиси мог описать только в хрониках: процветающего и престижного курдского государства, культурные достижения которого соответствуют его политическим амбициям. Экономика горных районов процветает, шерсть течет по горным рынкам, а курдские ученые спорят в судах, вызывающих уважение.\n\nЭтот момент требует выбора акцентов. Должны ли мы инвестировать в ученых и медресе, сохраняющих курдские знания, или в горных торговцев, чьи караваны доставляют курдские товары на отдаленные рынки?" #NT!
 nd_krs.9.a: "Ручка сильнее кошелька." #NT!
 nd_krs.9.b: "Коммерция создает то, чего не могут сделать армии." #NT!
 nd_krs.10.t: "Курдская родина" #NT!
 nd_krs.10.d: "Курдистан стал всем, о чем когда-то мечтали разбросанные эмираты, постоянной родиной, процветающей и хорошо управляемой, ее институты укоренены глубоко в горной почве. У великих держав могут быть свои империи, но у Курдистана есть что-то более прочное: нация, построенная на основе общей идентичности и компетентного управления.\n\nПоследний вопрос — это вопрос политической философии. Примет ли Курдистан конфедеративные традиции своего эмиратского прошлого, когда автономные провинции управляются в рамках рыхлого союза? Или же ему следует экспериментировать с конституционными формами, которые воплощают народный суверенитет, в горную республику, не похожую ни на одну из тех, что видел мир?" #NT!
 nd_krs.10.a: "Конфедерация существует, как и наши горы." #NT!
 nd_krs.10.b: "Республика горной местности." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_northern_jihad: "Северный джихад" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_northern_jihad: "Курдские армии проносятся по Сирии с рвением святых воинов, штурмуя укрепления и продолжая наступление, не заботясь о цене. Военный импульс невозможно остановить, но продолжительная кампания давит на людей." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_frontier_lords: "Пограничные Лорды" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_frontier_lords: "Вместо того чтобы рваться на юг, курдские пограничные лорды методично расширяют свою власть посредством переговоров и быстрого размещения гарнизонов. Подчиненное население быстро усмиряется, хотя сосредоточенность на военном управлении отвлекает ресурсы от гражданских нужд." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_sultan_of_islam: "Султан ислама" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_sultan_of_islam: "Курдистан претендует на мантию исламского лидера, повторяя роль Саладина как объединителя верующих. Религиозный престиж и политическая власть усиливают друг друга, и даже еретические общины находят место под курдской толерантностью." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_guardian_of_jerusalem: "Хранитель Иерусалима" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_guardian_of_jerusalem: "Вместо того, чтобы претендовать на универсальную власть, Курдистан позиционирует себя как хранитель святых мест, восстанавливая истерзанные войной земли, поддерживая крепостные сети и проецируя тихую силу посредством разведки, а не провозглашения." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_highland_scholars: "Хайлендские ученые" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_highland_scholars: "Курдские медресе и научные кружки процветают, выпуская выпускников, которые работают администраторами, юристами и поэтами. Экономика горных районов получает выгоду от грамотного управления, а население растет по мере распространения процветания." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_mountain_merchants: "Горные торговцы" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_mountain_merchants: "Курдские купцы расширяют свое влияние через горные торговые пути, возвращая богатство горным общинам. Цена этой коммерческой экспансии проявляется в повышении стоимости заимствований по мере того, как кредиты перетекают наружу." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_eternal_confederacy: "Вечная Конфедерация" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_eternal_confederacy: "Курдистан принимает свое конфедеративное наследие, предоставляя каждой провинции эмирата автономию в рамках рыхлого, но прочного союза. Дипломатия и сети снабжения связывают конфедерацию вместе без централизации власти." #NT!
 STATIC_MODIFIER_NAME_nd_krs_dest_mountain_republic: "Горная Республика" #NT!
 STATIC_MODIFIER_DESC_nd_krs_dest_mountain_republic: "Курдистан экспериментирует с конституционным управлением, инновационным, либеральным государством, в котором свободные субъекты участвуют в управлении. Горная республика, непохожая ни на одну из представленных в старых империях." #NT!
 nd_krs_ayyubid_palace: "Дворец Айюбидов" #NT!
 nd_krs_ayyubid_palace_desc: "Величественный дворец в традициях Айюбидов, сочетающий в себе военные укрепления и придворное великолепие. Его залы навевают воспоминания о дворе Саладина, где воины и ученые собирались под покровительством курдов." #NT!
 nd_krs_palace_maintenance: "Содержание дворца" #NT!
 nd_krs_palace_maintenance_desc: "Обслуживание церемониальных дворов, оружейных складов и административных помещений дворцового комплекса в стиле Айюбидов." #NT!
 nd_krs_emirate_chancellery: "Канцелярия Эмирата" #NT!
 nd_krs_emirate_chancellery_desc: "Центр курдского управления и администрации, где сохраняются и модернизируются традиции эмиратских дворов. Ученые, дипломаты и торговцы работают под одной крышей, управляя делами объединенного Курдистана." #NT!
 nd_krs_chancellery_maintenance: "Канцелярские операции" #NT!
 nd_krs_chancellery_maintenance_desc: "Снабжение курдского центра управления бумагой, книгами, прекрасной тканью и мебелью для его административных помещений и научных архивов." #NT!
  
  # ===== BUREAUCRACIES ===== 
 krs_hakim_sancaks_bureaucracy: "Хаким Санчакс" #NT!
 krs_hakim_sancaks_bureaucracy_desc: "Наследственные курдские губернаторства, установленные Селимом I после битвы при Чалдыране (1514 г.) по дипломатическому совету Идриса-и Бидлиси. В отличие от стандартного османского санджака (ротируемого, бюрократически назначаемого), великие курдские эмираты Хаккари, Битлис, Джизре/Бохтан и Имадия/Бахдинан были зарегистрированы как окаклик: наследственные в доме местного мира, освобожденные от девширме, сохраняющие свои племенные контингенты, внутренние суды и налоговое усмотрение. Поселение дало Блистательной Порте верную восточную границу; это дало курдским мирам конституционный щит вокруг их автономии, который просуществовал до девятнадцатого века." #NT!
 krs_sharafnama_register_bureaucracy: "Регистр Шарафнама" #NT!
 krs_sharafnama_register_bureaucracy_desc: "Генеалогически-политическая хроника принца Шараф-хана Битлиса, завершенная на персидском языке в 1597 году, рассматривает Марванидов Амеда, Хасанвайхидов, Фадлуидов, Айюбидов Саладина и каждую современную курдскую династию как одну непрерывную цивилизацию. Поддерживаемый как государственное учреждение, реестр фиксировал генеалогические притязания каждого великого дома, решал вопросы старшинства в Миратском суде и давал курдской нации документально подтвержденное прошлое, совпадающее с ее горной географией. Позднее летописцы продолжили и переписали эту работу; оно оставалось самым близким к канцелярскому архиву собственного прошлого курдскому государству." #NT!
 krs_naqshbandi_tariqat_bureaucracy: "Тарикат Накшбанди-Халиди" #NT!
 krs_naqshbandi_tariqat_bureaucracy_desc: "Суфийский орден реформировал и пропагандировал Мавлана Халид аль-Шахразури (ум. 1827) из Сулеймании, который к середине девятнадцатого века вытеснил старую Кадирию в качестве доминирующей религиозной сети в Курдистане. Шейхи Халиди управляли обширными ложами (текиес), обучали группы учеников, а по мере того, как великие миратские дома распадались один за другим под действием османской централизации, комбинация ага-шейхов взялась за местный арбитраж, межплеменное посредничество и даже сбор налогов. К концу османской эпохи шейхи Накшбанди стали настоящими влиятельными лицами в курдском обществе, часто явно за счет выживших семей миров, которых они заменили." #NT!
 krs_mirate_diwan_bureaucracy: "Мират Диван" #NT!
 krs_mirate_diwan_bureaucracy_desc: "Совещательный совет курдского эмирата, наиболее развитый в Битлисе при династии Шарафнама, в Санандадже при давних правящих ардаланах и в Сулеймании при бабанах. Мир председательствовал на совете старших агов своего клана, главного кади эмирата и руководителей племенных отрядов; Диван регистрировал гранты, рассматривал апелляции и собирал кавалерию королевства. В то время как поселение Хаким Санджак сохраняло автономию мира от Стамбула, диван организовал эту автономию изнутри, смешав племенные обычаи с исламскими судебными решениями и придав курдскому аристократическому правлению его рабочую административную форму." #NT!
  
 AUTO_MODIFIER_NAME_nd_krs_bureaucracy_authority: "Миратская власть" #NT!
 AUTO_MODIFIER_DESC_nd_krs_bureaucracy_authority: "С образованием Курдистана великие дома-мираты созывают постоянный административный совет, регистрирующий наследственные поселения санчаков, генеалогии Шарафнама королевства и религиозные сети суфийских тарикатов. На этом фундаменте отличительные институты курдского государства начинают принимать свою прочную форму." #NT!
