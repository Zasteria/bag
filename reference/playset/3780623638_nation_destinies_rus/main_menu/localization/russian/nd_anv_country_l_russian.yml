l_russian:
 ANV: "Анжуйская империя" #NT!
 ANV_ADJ: "Анжуйский" #NT!
 ANV_f: "Анжуйская империя" #NT!
 ANV_f_desc: "Восстановите владения Генриха II Плантагенета через Ла-Манш, объединив Королевство Англии с герцогствами Нормандия и Аквитания, а также графством Анжу под единой короной. Католическое королевство англо-нормандских, французских, нормандских и окситанских подданных, Анжуйская империя была крупнейшим территориальным государством Западной Европы двенадцатого века, и ее восстановление разрушило бы основы современного Французского королевства." #NT!
