 LXA: "Лан Ксанг" #NT!
 LXA_ADJ: "Лан Ксанг" #NT!
 LXA_f: "Лан Ксанг" #NT!
 LXA_f_desc: "Королевство Лан Ксанг, Земля миллиона слонов, было великим объединенным лаосским королевством, основанным Фа Нгумом в 1354 году. Простираясь от плато Корат до северных нагорий верхнего Меконга, оно было одним из крупнейших королевств в Юго-Восточной Азии, пока внутренние раздоры не разделили его на конкурирующие королевства Луанг Прабанг, Вьентьян и Чампасак в 1707 году. Лаосский правитель, контролирующий оба древних королевства. столицы могут восстановить это некогда могущественное царство." #NT!
