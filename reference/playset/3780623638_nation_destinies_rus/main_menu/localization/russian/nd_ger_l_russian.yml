l_russian:
 STATIC_MODIFIER_NAME_nd_blut_und_eisen: "Кровь и железо" #NT!
 STATIC_MODIFIER_DESC_nd_blut_und_eisen: "Немецкая нация была выкована не речами и большинством голосов, а железом и кровью. Наши армии маршируют с непоколебимой дисциплиной, а наши кузницы горят день и ночь, чтобы вооружить самую мощную военную силу в Европе." #NT!
 STATIC_MODIFIER_NAME_nd_zollverein_legacy: "Наследие Цольферайна" #NT!
 STATIC_MODIFIER_DESC_nd_zollverein_legacy: "До того, как появилось немецкое государство, существовал немецкий рынок. Таможенный союз, который экономически связывал немецкие земли, теперь питает империю промышленности, науки и дипломатического влияния, которая формирует континент." #NT!
 nd_ger.1.t: "Объединение Германии" #NT!
 nd_ger.1.d: "Мечта веков осуществилась. Из раздробленной мозаики княжеств, вольных городов и королевств возникло единое германское государство, империя, которая говорит одним голосом и пользуется уважением всей Европы. Вопрос сейчас не в том, будет ли Германия великой, а в том, к какому величию она будет стремиться. Будет ли эта новая империя построена на основе ее армий, ее учебных полей, повторяющих ритм, который когда-то потрясал континент? Или это будет триумф промышленности и торговли, воплощение видения Цольферайна, нация, связанная железными дорогами, торговлей и неустанным маршем прогресса?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ger.1.a: "Кровью и железом Германия выстоит." #NT!
 nd_ger.1.b: "Торговля и промышленность должны стать нашей основой." #NT!
 nd_ger.2.t: "Реформация" #NT!
 nd_ger.2.d: "Прибивание девяноста пяти тезисов к дверям церкви в Виттенберге потрясло основы христианского мира. Вызов Мартина Лютера папской власти, усиленный печатными станками, которые сами по себе являются немецким изобретением, спровоцировал конфессиональную революцию, которая разделила немецкие земли на старую веру и новую. Князья выбирают сторону не просто по убеждению, но и по расчету. Реформация предлагает свободу от римских налогов и утверждение территориального суверенитета. Как Германии справиться с этим потрясением?" #NT!
 nd_ger.2.a: "Стойте твердо в нашем исповедании, одна вера, один народ." #NT!
 nd_ger.2.b: "Cuius regio, eius religio. Прагматизм сохраняет мир." #NT!
 nd_ger.3.t: "Вестфальский мир" #NT!
 nd_ger.3.d: "После тридцати лет самой разрушительной войны, которую когда-либо знала Европа, войны, в которой погибла, возможно, треть немецкого населения, истощенные державы собрались в Оснабрюке и Мюнстере, чтобы создать новый порядок. Вестфальские договоры устанавливают принципы, которые изменят мир: суверенитет государств, право правителей определять религию своей территории и баланс сил как основу международных отношений. Германия оказывается израненной, но с новой основой для сосуществования." #NT!
 nd_ger.3.a: "Суверенитет священн. Ни одна власть не может диктовать другую." #NT!
 nd_ger.3.b: "Баланс и дипломатия предотвратят следующую катастрофу." #NT!
 nd_ger.4.t: "Революция Гутенберга" #NT!
 nd_ger.4.d: "Изобретение Иоганном Гутенбергом печатного станка с подвижным шрифтом в Майнце около 1440 года положило начало революции, более глубокой, чем любая битва. То, что раньше монаху требовались годы, чтобы скопировать вручную, теперь можно изготовить сотнями копий за несколько недель. Идеи распространялись со скоростью лесного пожара по немецким землям и за их пределами, научные труды, религиозные тексты, политические памфлеты и научные трактаты льются из типографий Майнца, Страсбурга, Нюрнберга и Аугсбурга. Монополия Церкви и элиты на знания разрушена навсегда. Германия стоит в центре этой трансформации, ее печатники формируют интеллектуальную жизнь всего континента." #NT!
 nd_ger.4.a: "Пресса должна быть мечом разума." #NT!
 nd_ger.5.t: "Цольферайн" #NT!
 nd_ger.5.d: "Германский таможенный союз, Zollverein, посредством торговли добился того, чего не смогли достичь дипломатия и война, — практического объединения немецких земель. Начав с таможенных реформ в Пруссии и постепенно поглощая одно государство за другим, Zollverein разрушил сотни внутренних тарифных барьеров, создал единый миллионный рынок и проложил железные рельсы, связывающие немецкую экономику в единый двигатель производства. Фабрики растут вдоль Рейна и Рура, купцы свободно торгуют от Гамбурга до Мюнхена, а старая мозаика мелких платных станций уступает место современной экономике." #NT!
 nd_ger.5.a: "Интеграция через торговлю. Пусть Таможенный союз углубляется." #NT!
 nd_ger.5.b: "Инвестируйте в промышленность. Фабрики будут нашей силой." #NT!
 STATIC_MODIFIER_NAME_nd_ger_confessional_conviction: "Конфессиональное убеждение" #NT!
 STATIC_MODIFIER_DESC_nd_ger_confessional_conviction: "Германия едина в вере, черпая силу из своей религиозной идентичности для построения более сплоченного общества." #NT!
 STATIC_MODIFIER_NAME_nd_ger_cuius_regio: "Cuius Regio, Eius Religio" #NT!
 STATIC_MODIFIER_DESC_nd_ger_cuius_regio: "Прагматичное принятие конфессионального разнообразия принесло стабильность в немецкие земли, позволив торговле и дипломатии процветать там, где когда-то угрожала религиозная война." #NT!
 STATIC_MODIFIER_NAME_nd_ger_westphalian_sovereignty: "Вестфальский суверенитет" #NT!
 STATIC_MODIFIER_DESC_nd_ger_westphalian_sovereignty: "Принцип государственного суверенитета, рожденный из пепла Тридцатилетней войны, дает Германии дипломатический авторитет и внутреннюю сплоченность, которой завидуют ее соперники." #NT!
 STATIC_MODIFIER_NAME_nd_ger_westphalian_balance: "Вестфальский баланс" #NT!
 STATIC_MODIFIER_DESC_nd_ger_westphalian_balance: "Германия взяла на себя роль арбитра в европейских делах, используя свое центральное положение и дипломатический опыт для поддержания баланса сил." #NT!
 STATIC_MODIFIER_NAME_nd_ger_customs_integration: "Таможенная интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_ger_customs_integration: "Демонтаж внутренних тарифных барьеров создал огромный единый рынок, стимулирующий торговлю и процветание на немецких землях." #NT!
 STATIC_MODIFIER_NAME_nd_ger_industrial_investment: "Промышленные инвестиции" #NT!
 STATIC_MODIFIER_DESC_nd_ger_industrial_investment: "Массивные инвестиции в заводы, железные дороги и инфраструктуру превратили Германию в промышленную державу." #NT!
 nd_ger_guild_heritage: "Гильдейское наследие" #NT!
 nd_ger_guild_heritage_desc: "Сложная система ремесленных гильдий, управлявшая немецкими городами, устанавливала стандарты качества, защищала ремесленников и создавала гражданские институты, которые на протяжении веков определяли немецкую городскую жизнь." #NT!
 nd_ger_mining_tradition: "Горная традиция" #NT!
 nd_ger_mining_tradition_desc: "Серебряные рудники в горах Гарц и Рудных горах питали немецкую торговлю и привлекали горняков, инженеров и металлургов, чей опыт превратил этот регион в центр горнодобывающей промышленности Европы." #NT!
 nd_ger_reichstag_tradition: "Рейхстаг Традиции" #NT!
 nd_ger_reichstag_tradition_desc: "Императорский сейм, собрав князей, епископов и представителей вольных городов, установил традицию переговоров и компромиссов, которые сформировали немецкую политическую культуру." #NT!
 nd_ger_hanseatic_roots: "Ганзейские корни" #NT!
 nd_ger_hanseatic_roots_desc: "Ганзейский союз соединил немецких купцов от Любека с Новгородом, создав торговые посты и торговые сети, которые на протяжении веков доминировали в торговле Северной Европы." #NT!
 nd_ger_minnesang: "Миннесангская традиция" #NT!
 nd_ger_minnesang_desc: "Куртуазная любовная поэзия Миннесангера, Вальтера фон дер Фогельвейде, Вольфрама фон Эшенбаха и их коллег основала немецкую литературную традицию, которая соперничала с трубадурами Франции." #NT!
 nd_ger_gutenberg_press: "Гутенберг Пресс" #NT!
 nd_ger_gutenberg_press_desc: "Печатный станок с подвижным шрифтом Иоганна Гутенберга, созданный в Майнце около 1440 года, положил начало революции в распространении знаний, которая изменила европейскую цивилизацию." #NT!
 nd_ger_universitat_tradition: "Университетские традиции" #NT!
 nd_ger_universitat_tradition_desc: "Основание университетов в Гейдельберге, Лейпциге, Кёльне и Эрфурте создало центры обучения, которые привлекли учёных со всей Европы и заложили основу для немецкого интеллектуального лидерства." #NT!
 nd_ger_imperial_banking: "Империал Банкинг" #NT!
 nd_ger_imperial_banking_desc: "Банковские дома Фуггеров и Вельзеров в Аугсбурге финансировали императоров, пап и колониальные предприятия, что сделало южную Германию финансовой столицей Европы в эпоху Возрождения." #NT!
 nd_ger_civic_tradition: "Гражданская автономия" #NT!
 nd_ger_civic_tradition_desc: "Традиция самоуправляемых свободных имперских городов (Нюрнберг, Аугсбург, Гамбург, Франкфурт) создала пространства бюргерской независимости, коммерческих инноваций и гражданской гордости, уникальные для политического ландшафта Германии.\n\n#italic Доступно в: $nd_ger_bergwerk$#!" #NT!
 nd_ger_meistersinger: "Гильдии Мейстерзингеров" #NT!
 nd_ger_meistersinger_desc: "Гильдии мейстерзингеров в Нюрнберге, Аугсбурге и других городах Германии превратили песенное искусство в дисциплинированное ремесло, сохраняя и развивая немецкие культурные традиции посредством конкурсной композиции." #NT!
 nd_ger_reformation_crucible: "Тигель Реформации" #NT!
 nd_ger_reformation_crucible_desc: "Протестантская Реформация, вызванная вызовом Мартина Лютера папской власти в 1517 году, зародилась на немецкой земле и навсегда изменила отношения между верой, политикой и индивидуальным сознанием в западном мире." #NT!
 nd_ger_arms_manufacture: "Производство оружия" #NT!
 nd_ger_arms_manufacture_desc: "Немецкие оружейники и оружейники, особенно в таких центрах, как Нюрнберг, Аугсбург и Золинген, производили одни из лучших видов оружия и доспехов в Европе, снабжая армии и князей по всему континенту." #NT!
 nd_ger_schwarze_reiter_tradition: "Шварце Райтер Традиция" #NT!
 nd_ger_schwarze_reiter_tradition_desc: "«Черные всадники» произвели революцию в кавалерийской войне, сделав пистолет своим основным оружием, используя караколе для нанесения разрушительных залпов перед тем, как атаковать с мечом в руке." #NT!
 nd_ger_silver_rush: "Немецкая серебряная лихорадка" #NT!
 nd_ger_silver_rush_desc: "Разработка богатых месторождений серебра в Рудных горах и горах Гарц породила потоки драгоценных металлов, которые финансировали немецких князей, питали монетные дворы и привлекали горнодобывающих специалистов со всей Европы.\n\n#italic Доступно в: $nd_ger_bergwerk$#!" #NT!
 nd_ger_territorial_admin: "Территориальное управление" #NT!
 nd_ger_territorial_admin_desc: "Развитие профессиональной территориальной бюрократии в немецких государствах с обученными чиновниками, систематическим ведением учета и кодифицированным законодательством привело к созданию одних из наиболее эффективных административных органов в Европе раннего Нового времени." #NT!
 nd_ger_westphalian_order: "Вестфальский орден" #NT!
 nd_ger_westphalian_order_desc: "Вестфальский мир 1648 года положил конец Тридцатилетней войне и установил основополагающие принципы современных международных отношений: государственный суверенитет, невмешательство и баланс сил." #NT!
 nd_ger_confessional_state: "Конфессиональное государство" #NT!
 nd_ger_confessional_state_desc: "Интеграция религиозной власти в государственное управление, будь то протестантское или католическое, создало своеобразную немецкую модель конфессиональной политики, которая на протяжении веков формировала общество, образование и культуру." #NT!
 nd_ger_drill_tradition: "Традиция военной подготовки" #NT!
 nd_ger_drill_tradition_desc: "Систематические инновации в учении, впервые предложенные Леопольдом Ангальт-Дессау, железный шомпол, марш-шаг и стандартизированные процедуры заряжания, превратили немецкую пехоту в самых дисциплинированных солдат в Европе." #NT!
 nd_ger_solingen_forges: "Золингенские кузницы" #NT!
 nd_ger_solingen_forges_desc: "Кузнецы Золингена и оружейники Зуля производили оружие легендарного качества, сделав Германию арсеналом Европы и установив промышленную традицию, которая сохраняется и по сей день.\n\n#italic Доступно в: $nd_ger_waffenschmiede$#!" #NT!
 nd_ger_cameralism: "Администрация камерылиста" #NT!
 nd_ger_cameralism_desc: "Камерализм, немецкая наука о государственных финансах и управлении, обучила поколения чиновников систематическому сбору доходов, экономическому управлению и рациональной организации государства." #NT!
 nd_ger_jaeger_corps: "Ягерский корпус" #NT!
 nd_ger_jaeger_corps_desc: "Набранные из лесников и охотников, Ягеры служили элитной легкой пехотой, опытными стрелками, которые сражались в качестве застрельщиков, разведчиков и снайперов в лесах и на холмах Центральной Европы." #NT!
 nd_ger_feldartillerie_advance: "Немецкая фельдартиллерия" #NT!
 nd_ger_feldartillerie_advance_desc: "Немецкие артиллерийские школы, опираясь на многовековой металлургический опыт, производили полевые орудия исключительной дальности и точности, которые сыграли решающую роль на полях сражений в Европе." #NT!
 nd_ger_aufklarung: "Ауфкларунг" #NT!
 nd_ger_aufklarung_desc: "Немецкое Просвещение, Aufklarung, породило Канта, Лессинга и Гете и отстаивало разум, образование и реформу управления. Его влияние на немецкие университеты, администрацию и культуру было преобразующим." #NT!
 nd_ger_prussian_bureaucracy: "Прусская бюрократическая модель" #NT!
 nd_ger_prussian_bureaucracy_desc: "Прусская государственная служба с ее строгими экзаменами, систематическим обучением и неподкупной эффективностью стала образцом современной бюрократии, которому стремились подражать государства по всей Европе." #NT!
 nd_ger_standing_army: "Доктрина постоянной армии" #NT!
 nd_ger_standing_army_desc: "Переход от ненадежных банд наемников к постоянным, профессионально подготовленным регулярным армиям дал немецким государствам военную основу для продолжительных кампаний и эффективной обороны." #NT!
 nd_ger_landwehr_system: "Система Ландвера" #NT!
 nd_ger_landwehr_system_desc: "Ландвер, созданный во время Освободительной войны против Наполеона, создал гражданское ополчение, которое сочетало патриотический пыл с военной подготовкой, значительно расширяя имеющуюся рабочую силу немецкого государства." #NT!
 nd_ger_zollverein: "Цольферайн" #NT!
 nd_ger_zollverein_desc: "Таможенный союз Германии, Zollverein, устранил сотни внутренних тарифных барьеров и создал единое экономическое пространство, которое сделало объединение Германии не просто мыслимым, но и неизбежным." #NT!
 nd_ger_industrialization: "Немецкая индустриализация" #NT!
 nd_ger_industrialization_desc: "Превращение Рейнской области, Рура и Силезии в промышленные центры с угольными шахтами, сталелитейными заводами и железнодорожными сетями вывело Германию из лоскутного сельского хозяйства в современную индустриальную экономику." #NT!
 nd_ger_humboldtian_education: "Гумбольдтово образование" #NT!
 nd_ger_humboldtian_education_desc: "Университетская реформа Вильгельма фон Гумбольдта, объединяющая исследования и преподавание, подчеркивающая академическую свободу и ставящая Bildung выше простой профессиональной подготовки, создала современную модель исследовательского университета, принятую во всем мире." #NT!
 nd_ger_realpolitik: "Реалполитик" #NT!
 nd_ger_realpolitik_desc: "Прагматичный, ориентированный на интересы подход к внешней политике, связанный с Бисмарком, где дипломатия служила власти, союзы были инструментами, а идеализм уступал рассчитанному преимуществу, изменил европейскую политику." #NT!
 a_nd_ger_schwarze_reiter: "Шварце Райтер" #NT!
 a_nd_ger_schwarze_reiter_desc: "«Черные всадники» — это тяжелобронированная пистолетная кавалерия, которая использует каракольный строй, двигаясь вперед шеренгой, чтобы нанести пистолетные залпы, прежде чем развернуться для перезарядки. Их почерневшая броня и оглушительные залпы терроризируют вражеские формирования." #NT!
 a_nd_ger_jaeger: "Ягер" #NT!
 a_nd_ger_jaeger_desc: "Ягеры, набираемые из лесников и егерей, представляют собой элитную легкую пехоту, вооруженную винтовками. Они сражаются как застрельщики и снайперы, умело используя местность, чтобы вывести из укрытия вражеские формирования." #NT!
 a_nd_ger_landwehr: "Ландвер" #NT!
 a_nd_ger_landwehr_desc: "Ландвер — это солдаты-граждане, набранные из населения, прошедшие базовую военную подготовку и вооруженные государством. Недостаток профессионального мастерства они компенсируют численностью и патриотической решимостью." #NT!
 a_nd_ger_feldartillerie: "Немецкая фельдартиллерия" #NT!
 a_nd_ger_feldartillerie_desc: "Немецкие батареи полевой артиллерии, опираясь на многовековой металлургический опыт и систематическую артиллерийскую подготовку, ведут разрушительные бомбардировки с исключительной точностью и дальностью." #NT!
 nd_ger_bergwerk: "Бергверк" #NT!
 nd_ger_bergwerk_desc: "Немецкий горнодобывающий комплекс, разрабатывающий богатые месторождения полезных ископаемых Центральной Европы. Квалифицированные горняки и инженеры добывают серебро, медь и железо, используя передовые методы, разработанные в Гарце и Рудных горах." #NT!
 nd_ger_rathaus: "Ратуша" #NT!
 nd_ger_rathaus_desc: "Городская ратуша, резиденция бюргерского самоуправления и символ немецкой гражданской гордости. Здесь заседает городской совет, вершится правосудие и регулируется коммерческая жизнь города." #NT!
 nd_ger_druckerei: "Друкерей" #NT!
 nd_ger_druckerei_desc: "Типография, следующая традициям Гутенберга, выпускающая книги, брошюры и научные труды, которые распространяют знания и грамотность по немецким землям и за их пределами." #NT!
 nd_ger_waffenschmiede: "Ваффеншмиде" #NT!
 nd_ger_waffenschmiede_desc: "Немецкий оружейный завод, где мастера куют оружие, доспехи и огнестрельное оружие известного качества. Традиция изготовления клинков Золингена и мушкетов Зуля снабжает армии по всей Европе." #NT!
 nd_ger_universitat: "Университет" #NT!
 nd_ger_universitat_desc: "Немецкий исследовательский университет в традициях Гейдельберга и Лейпцига, где ученые продвигают знания посредством систематических исследований, а студенты получают Bildung, который формирует сознание настолько же, насколько и наполняет его." #NT!
 nd_ger_bergwerk_maintenance: "Добыча железа" #NT!
 nd_ger_bergwerk_maintenance_desc: "Шахтеры добывают железную руду из глубоких шахт немецких минеральных районов, используя деревянные опоры и специальные инструменты для разработки богатых жил Гарца и Рудных гор." #NT!
 nd_ger_rathaus_maintenance: "Гражданская администрация" #NT!
 nd_ger_rathaus_maintenance_desc: "Каменные, бумажные и меблированные залы совета, необходимые для выполнения административных и гражданских функций немецкой ратуши." #NT!
 nd_ger_druckerei_maintenance: "Печатные операции" #NT!
 nd_ger_druckerei_maintenance_desc: "Бумага и чернила превращаются в печатные книги, брошюры и научные труды опытными наборщиками, работающими на печатных машинах немецких типографий." #NT!
 nd_ger_waffenschmiede_maintenance: "Производство оружия" #NT!
 nd_ger_waffenschmiede_maintenance_desc: "Железо выплавляют и куют оружие в угольных печах, производя клинки и доспехи высочайшего немецкого мастерства." #NT!
 nd_ger_universitat_maintenance: "Академические операции" #NT!
 nd_ger_universitat_maintenance_desc: "Бумага, книги и стеклянные инструменты, необходимые для поддержания исследовательской и преподавательской миссии немецкого университета." #NT!
 nd_ger_silver_processing: "Обработка серебра" #NT!
 nd_ger_silver_processing_desc: "Серебряная руда извлекается из горной породы и перерабатывается в товарные слитки с использованием технологий, отточенных в горнодобывающих районах Саксонии и Гарца." #NT!
 nd_ger_arms_forging: "Ковка оружия" #NT!
 nd_ger_arms_forging_desc: "Мастера-оружейники выковывают из железа и меди оружие исключительного качества: клинки Золингена и стволы мушкетов Зуля, которыми вооружаются лучшие армии Европы." #NT!
 nd_ger_brewing: "Немецкое пивоварение" #NT!
 nd_ger_brewing_desc: "Из пшеницы варят пиво в соответствии со строгими цеховыми стандартами, которые являются краеугольным камнем немецкой гражданской жизни и бюргерской культуры со времен средневековья." #NT!
 levy_nd_ger_landwehr: "Ландверская милиция" #NT!
 levy_nd_ger_landwehr_desc: "Граждане-солдаты Ландвера, призванные из широких слоев населения на защиту отечества в трудную минуту." #NT!
 nd_ger_formed_tt: "была образована Германия." #NT!
 nd_ger_path_a_tt: "Выберите судьбу #bold Кровь и железо#!." #NT!
 nd_ger_path_b_tt: "Выберите судьбу #bold Наследия Цольферайна#!." #NT!
 nd_ger_destiny: "Немецкий вопрос" #NT!
 nd_ger_destiny_desc: "Германия объединилась, но вопрос о том, чем станет Германия, остается без ответа. Будет ли эта новая империя стремиться к военной гегемонии на континенте или же она построит экономический колосс, который изменит европейскую торговлю?" #NT!
 nd_ger.6.t: "Немецкий вопрос" #NT!
 nd_ger.6.d: "Объединение Германии решило один вопрос, но подняло более важный. Нация такой силы, населения и центрального положения не может просто существовать; оно должно выбрать направление. Армии, создавшие это государство, готовы, а заводы, вооружившие их, гудят потенциалом. Чем станет Германия?" #NT!
 nd_ger.6.a: "Германия найдет свою судьбу." #NT!
 nd_ger.7.t: "Войны объединения" #NT!
 nd_ger.7.d: "Пушки заговорили, и карты перерисовались. Немецкие армии двинулись на восток до Вислы и на запад до Мозеля, захватывая крепости и порты, защищающие границы Рейха. Офицерский корпус возвращается с триумфом, закаленный в огне кампании в лучший военный инструмент в Европе. Великие державы замечают это и начинают бояться." #NT!
 nd_ger.7.a: "Наши армии доказали свою ценность." #NT!
 nd_ger.8.t: "Эльзас-Лотринген" #NT!
 nd_ger.8.d: "Аннексия Лотарингии и объединение балтийских территорий Пруссии делает Германию бесспорной военной державой Центральной Европы. Наши крепости ощетинились артиллерией, наши пути снабжения простираются от Северного моря до Карпат. Теперь вопрос в доктрине: сможем ли мы усовершенствовать искусство осадной войны, с методической точностью уничтожая опорные пункты противника? Или мы должны начать войну передвижения, нанося глубокие удары, прежде чем враг успеет отреагировать?" #NT!
 nd_ger.8.a: "Превратите их крепости в руины." #NT!
 nd_ger.8.b: "Ударьте быстро, прежде чем они узнают, что мы приближаемся." #NT!
 nd_ger.9.t: "Миттельевропа" #NT!
 nd_ger.9.d: "Немецкие орлы летают над Варшавой и Краковом. Мечта о Миттельевропе, континенте, организованном под руководством Германии, стала реальностью. От промышленной Рейнской области до зерновых полей Польши, от балтийских портов до альпийских перевалов — империя беспрецедентной мощи простирается через сердце Европы. Как этот колосс будет вести себя среди народов?" #NT!
 nd_ger.9.a: "Наша сила будет гарантировать мир." #NT!
 nd_ger.9.b: "Государство существует для того, чтобы вести войну." #NT!
 nd_ger.10.t: "Хандельшерршафт" #NT!
 nd_ger.10.d: "Мечта Цольферайна была реализована. Немецкие банки распространяют кредиты от Франкфурта до Вены, уголь с электростанций в Руре по всему Таможенному союзу, а торговцы, которые когда-то торговались за мелкие пошлины, теперь контролируют рынки, охватывающие немецкие земли. Демонтаж внутренних барьеров создал единое экономическое пространство, не похожее ни на что, что видела Европа, и основу для чего-то большего." #NT!
 nd_ger.10.a: "Таможенный союз – это только начало." #NT!
 nd_ger.11.t: "Промышленность" #NT!
 nd_ger.11.d: "Преобразование ошеломляет. Там, где когда-то располагались разбросанные мастерские и ремесленные гильдии, теперь вдоль рек и железных дорог немецких земель располагаются огромные фабричные комплексы. Сталь льется из печей Рура, химикаты из лабораторий Рейна, машины из мастерских Саксонии. Немецкое развитие обогнало своих конкурентов. Но как этому промышленному колоссу организовать свою экономику – посредством открытой конкуренции или государственного управления?" #NT!
 nd_ger.11.a: "Пусть рынок решает. Свободная торговля обогащает всех." #NT!
 nd_ger.11.b: "Государство должно направлять курс экономики." #NT!
 nd_ger.12.t: "Вельтандель" #NT!
 nd_ger.12.d: "Немецкая промышленность и немецкий капитал изменили экономику континента. От счетных домов Гамбурга до бирж Франкфурта, от угольных месторождений Рура до лабораторий Берлина — Германия стала мастерской Европы и предметом зависти всего мира. Наука процветает в немецких университетах, а немецкие товары продаются по высоким ценам на каждом рынке. Вопрос в том, лежит ли будущее Германии на волнах глобальной торговли или на фабриках, которые уже изменили общество." #NT!
 nd_ger.12.a: "Германия должна господствовать на торговых морях." #NT!
 nd_ger.12.b: "Фабрика должна переделать мир." #NT!
 nd_ger_krupp_stahlwerk: "Крупп Штальверк" #NT!
 nd_ger_krupp_stahlwerk_desc: "Крупнейший сталелитейный завод и завод по производству вооружений в традициях династии Круппов. Здесь горы рурского угля и железа превращаются в лучшие в мире пушки и броневые листы, обеспечивая военно-промышленное доминирование Германии." #NT!
 nd_ger_krupp_maintenance: "Производство оружия" #NT!
 nd_ger_krupp_maintenance_desc: "Железо, уголь и сталь загружаются в печи Штальверка, превращаясь в пушечные стволы, гильзы и броневые листы непревзойденного качества." #NT!
 nd_ger_handelskammer: "Ханделькаммер" #NT!
 nd_ger_handelskammer_desc: "Немецкая торговая палата, где купцы, банкиры и промышленники координируют экономические дела Рейха. Торговые соглашения, рыночная информация и коммерческие споры решаются с прусской эффективностью." #NT!
 nd_ger_handelskammer_maintenance: "Коммерческие операции" #NT!
 nd_ger_handelskammer_maintenance_desc: "Бумага, стекло и изысканная мебель поддерживают административную деятельность торговой палаты." #NT!
 nd_ger_dest_einigung: "Войны объединения" #NT!
 nd_ger_dest_einigung_desc: "Защитите границы нового немецкого государства, захватив балтийский порт Данциг и лотарингскую крепость Мец. Оба являются стратегическими стержнями: один контролирует Вислу и доступ к Балтике, другой охраняет подходы со стороны Франции." #NT!
 nd_ger_dest_elsass: "Эльзас-Лотринген" #NT!
 nd_ger_dest_elsass_desc: "Укрепите военное превосходство Германии, захватив Кенигсберг на востоке и создав профессиональную армию, которой может позавидовать вся Европа. Великие державы должны научиться уважать силу Германии." #NT!
 nd_ger_dest_mitteleuropa: "Миттельевропа" #NT!
 nd_ger_dest_mitteleuropa_desc: "Реализуйте мечту о Центральной Европе под руководством Германии, распространив власть на Варшаву и Краков. Создайте самую мощную армию на континенте и заработайте престиж, достойный великой империи. Открывает доступ к Крупп Штальверку." #NT!
 nd_ger_dest_zollverein: "Расширение Цольферайна" #NT!
 nd_ger_dest_zollverein_desc: "Создайте финансовую инфраструктуру и ресурсную базу для обеспечения немецкой промышленности. Используйте современную банковскую систему, наполните казну и обеспечьте потоки угля через рынки, которые будут питать фабрики будущего." #NT!
 nd_ger_dest_industrie: "Промышленность" #NT!
 nd_ger_dest_industrie_desc: "Превратите Германию в промышленную державу. Примите индустриализацию, развивайте немецкие земли в полной мере и обеспечьте, чтобы производство стали снабжало заводы Рура и Рейна." #NT!
 nd_ger_dest_welthandel: "Вельтандель" #NT!
 nd_ger_dest_welthandel_desc: "Достичь экономического превосходства над Европой. Накопите огромное богатство, заработайте мировой престиж, примите участие в научной революции и превратите немецкие земли в самую продуктивную экономику на континенте. Открывает Handelskammer." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_siege_mastery: "Мастерство осады" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_siege_mastery: "Немецкие артиллерийские и осадные инженеры усовершенствовали систематическое сокращение укреплений противника, хотя расходы на длительные осадные операции истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_bewegungskrieg: "Бевегунгскриг" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_bewegungskrieg: "Немецкая доктрина делает упор на быстрые решительные операции, нанесение ударов до того, как противник сможет сконцентрироваться, сломить его волю и диктовать свои условия. Быстрые победы порождают уверенность, возможно, даже слишком большую." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_armed_peace: "Вооруженный мир" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_armed_peace: "Подавляющая военная мощь Германии гарантирует европейский порядок. Ни одна держава не осмеливается бросить вызов Рейху, и престиж Германии как арбитра континентальных дел достигает своего апогея." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_total_war: "Тотальная война" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_total_war: "Государство – это инструмент войны, а война – это инструмент государства. Военная машина Германии мобилизует все ресурсы для завоевания, хотя военно-морской флот страдает от пренебрежения." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_open_market: "Открытый рынок" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_open_market: "Открытая экономическая политика Германии привлекает таланты и капитал со всей Европы, интегрируя различные народы в процветающий коммерческий союз, хотя центральная власть при этом ослабевает." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_directed_economy: "Направленная экономика" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_directed_economy: "Государство направляет промышленное развитие с прусской эффективностью, ассимилируя народы и оптимизируя управление, хотя военно-морское строительство страдает из-за перетока ресурсов на заводы." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_handelsmacht: "Хандельсмахт" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_handelsmacht: "Германия проецирует коммерческую мощь через моря, создавая морское присутствие, которое может соперничать со старыми торговыми империями. Военно-морской флот контролирует морские пути, хотя сухопутным войскам уделяется меньше внимания." #NT!
 STATIC_MODIFIER_NAME_nd_ger_dest_industriekaiser: "Индустриекайзер" #NT!
 STATIC_MODIFIER_DESC_nd_ger_dest_industriekaiser: "Немецкая промышленность и инновации меняют европейское общество. Фабрики, лаборатории и университеты Рейха лидируют в мире, и все сословия процветают благодаря двигателю прогресса." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_ger_bureaucracy_authority: "Рейхсвервальтунг" #NT!
 AUTO_MODIFIER_DESC_nd_ger_bureaucracy_authority: "Единое немецкое государство унаследовало самый обширный институциональный набор в Европе: два верховных суда, десять имперских кругов, ганзейский порядок вольных городов, Заксеншпигель и родственные ему кодексы, а также (если история затянется достаточно поздно) Прусскую генеральную директорию и Цольферайн. Выбирайте, какие учреждения оставить в живых." #NT!
  
 ger_reichskammergericht_bureaucracy: "Рейхскамергерихт" #NT!
 ger_reichskammergericht_bureaucracy_desc: "Суд Императорской палаты, основанный на Вормском сейме 1495 года в качестве платы за Эвигера Ландфридена: вечный мир, отменяющий право вражды. Заседал во Франкфурте, затем в Шпейере, затем в Вецларе, судьи которого избирались подавляющим большинством императорских сословий, а не императора, а его бюджет оплачивалась самой империей. На протяжении трех столетий он давал князьям и свободным городам надежный юридический форум против имперского произвола, закрепляя характер Рейха как конституционного, судебно-правового государства." #NT!
  
 ger_reichshofrat_bureaucracy: "Рейхшофрат" #NT!
 ger_reichshofrat_bureaucracy_desc: "Аулический совет, собственный верховный суд императора в Хофбурге в Вене, учрежденный Фердинандом I в 1559 году, с президентом, вице-канцлером и восемнадцатью советниками, все финансировались из императорского кошелька. Он обладал исключительной юрисдикцией над феодальными владениями, принадлежавшими непосредственно Императору, и над вопросами, вызывавшими династический интерес, и тяжущиеся стороны стекались к нему, потому что он правил быстрее, чем Рейхскамергерихт, и обладал личной властью Габсбургов. Прямой противовес поместному двору в Вецларе." #NT!
  
 ger_reichskreise_bureaucracy: "Рейхскрайзе" #NT!
 ger_reichskreise_bureaucracy_desc: "Десять Имперских кругов, созданных Максимилианом I начиная с 1500 года для организации общей обороны, сбора имперских налогов и (после 1512 года) исполнения приговоров Рейхскамергерихта. Каждый край возглавляли два Kreisdirektoren, обычно старшие светские и церковные князья, а его Kreistag собирал контингенты Reichsarmee и регулировал чеканку монет. В частности, швабские и франконские круги дали имперскому праву реальные возможности на территориально раздробленном юге и западе." #NT!
  
 ger_sachsenspiegel_bureaucracy: "Заксеншпигель" #NT!
 ger_sachsenspiegel_bureaucracy_desc: "«Зеркало саксов», составленное на средненижненемецком языке между 1220 и 1235 годами саксонским администратором Эйке фон Репгоу по просьбе графа Хойера из Фалькенштейна. Его Landrecht (территориальное право) и Lehnrecht (феодальное право) стали образцом для Schwabenspiegel, Deutschenspiegel и большинства местных обычаев на немецких землях. Суды в некоторых частях Саксонии и Вестфалии все еще применяли его положения даже в 1900 году, это целый комплекс кодифицированных обычаев, которые связывали князей так же прочно, как и крестьян." #NT!
  
 ger_hansetag_bureaucracy: "Хансетаг и Конторе" #NT!
 ger_hansetag_bureaucracy_desc: "Нерегулярный общий рацион Ганзейского союза в Любеке и его четырех крупных торговых фабрик на Стилярде в Лондоне, Брюгге, Бергене и Новгороде. Каждый Контор был зарегистрированным университетом-меркатором со своей собственной казной, печатью, судом, сводом правил и выборными олдерменами, что предоставляло ганзейским городам параллельный торгово-правовой порядок за пределами территориальной княжеской юрисдикции. Даже после последнего официального Ганзетагского союза в 1669 году вольные города Любек, Гамбург и Бремен сохранили свои ганзейские привилегии до XIX века." #NT!
  
 ger_generaldirektorium_bureaucracy: "Генеральная директория" #NT!
 ger_generaldirektorium_bureaucracy_desc: "Генеральный директор Фридриха Вильгельма I, созданный Инструкцией от 20 декабря 1722 года для объединения Генерального финансового управления, военного комиссариата и управления доменами в единый министерский совет с Солдатенконигом в качестве его президента. Ее четыре министра разделили королевство по провинциям и функциям, ежедневно проверяли королевские счета и сделали Бранденбург-Пруссию первым европейским государством, где гражданская и военная администрация работала на одних и тех же дисциплинированных финансовых кассах, что составляло основу прусской власти." #NT!
  
 ger_zollverein_bureaucracy: "Цольферайн" #NT!
 ger_zollverein_bureaucracy_desc: "Таможенный союз Германии был заключен в Берлине 22 марта 1833 года и вступил в силу 1 января 1834 года. Договор отменил примерно 1800 внутренних тарифных барьеров между немецкими государствами, объединил более тридцати валют в две и привлек 28 из 39 членов Германской Конфедерации в зону свободной торговли под руководством Пруссии. Только Австрия отказалась присоединиться, что имело роковые последствия. Железные дороги, монетные дворы и единые тарифы Цольферайна стали экономической основой, на которой поколение спустя было достигнуто политическое объединение." #NT!
