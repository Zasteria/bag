l_russian:
  
 # ============================================================================ 
 # Static Modifiers (formation choices + advance event modifiers) 
 # ============================================================================ 
 STATIC_MODIFIER_NAME_nd_cda_mediterraneum_aragonense: "Средиземноморье Арагоненсе" #NT!
 STATIC_MODIFIER_DESC_nd_cda_mediterraneum_aragonense: "Корона смотрит на восток. Каталонские консульства от Брюгге до Константинополя, наемники Альмогавара, продающие свои секачи любому принцу, который заплатит им, и четырехбалочная Senyera Reial, летающая над Средиземным морем, которое превратилось в Арагонское озеро. Военно-морское превосходство, глубина наемничества, космополитическая культура и дипломатия, обращенная вовне, ценой принятия разделенного на море государства, а не объединения его внутри страны." #NT!
 STATIC_MODIFIER_NAME_nd_cda_hispano_aragonese: "Испано-арагонская корона" #NT!
 STATIC_MODIFIER_DESC_nd_cda_hispano_aragonese: "Если Иберия должна быть объединена, пусть она будет объединена на востоке. Корона направляет свой административный вес внутрь страны: интегрируя кастильское и андалузское население, повышая профессионализм налогов и используя механизм наследования династической политики Трастамары, чтобы сделать с Кастилией то, что Кастилия сделала с нами в другой временной шкале. Численность рабочей силы, дешевые аннексии, консолидация контроля ценой воинственной позиции и централизации реформ." #NT!
 STATIC_MODIFIER_NAME_nd_cda_compromise_legitimist: "Легитимность Трастамары" #NT!
 STATIC_MODIFIER_DESC_nd_cda_compromise_legitimist: "Девять арбитров, собравшихся в Каспе в 1412 году, выбрали Фердинанда Антекерского, кастильского принца Трастамары, законным наследником арагонского престола. Выбор династической преемственности связывает корону с иберийской сетью преемственности на столетия вперед." #NT!
 STATIC_MODIFIER_NAME_nd_cda_compromise_pactist: "Дом Ургелля оправдан" #NT!
 STATIC_MODIFIER_DESC_nd_cda_compromise_pactist: "Компромисс Каспе идет другим путем: на трон вступает Жауме II Уржельский, уроженец Каталонии. Пактистская знать и великие города Короны заявляют о подтверждении своих привилегий против любого будущего иностранного наследования." #NT!
 STATIC_MODIFIER_NAME_nd_cda_catalan_atlas: "Картографический проект Крескес" #NT!
 STATIC_MODIFIER_DESC_nd_cda_catalan_atlas: "Семья Крескес с Майорки превратила мир в пергамент. Морские королевства на полвека опережали своих соперников в морском присутствии и исследованиях." #NT!
 STATIC_MODIFIER_NAME_nd_cda_humanist_court: "Неаполь Лоренцо Валлы" #NT!
 STATIC_MODIFIER_DESC_nd_cda_humanist_court: "Великодушный суд выбирает гуманизм. Валла работает над своими «Элегантиями», Беккаделли собирает остроумные изречения короля, а королевские скриптории копируют греческие рукописи. Мягкая сила Арагона распространяется на север, в Тоскану и за ее пределы." #NT!
 STATIC_MODIFIER_NAME_nd_cda_arms_of_naples: "Покровительство оружию" #NT!
 STATIC_MODIFIER_DESC_nd_cda_arms_of_naples: "Великодушный двор покровительствует кондотьерам, военным инженерам и офицерскому классу итальянских войн. Арагонское золото течет к лучшим солдатам той эпохи, а Неаполь становится испытательным полигоном средиземноморской военной профессии." #NT!
  
 # ============================================================================ 
 # Formation Event (nd_cda.1) 
 # ============================================================================ 
 nd_cda.1.t: "Арагонская империя" #NT!
 nd_cda.1.d: "С набережной Барселоны на королевской галере летит «Сеньера Реал» — четыре красных слитка на золоте, которые, по словам летописцев, были нарисованы королевской кровью. Неаполь кланяется. Палермо кланяется. Кальяри, Пальма, Валенсия, Сарагоса ждут вердикта. Корона Арагона, четыре королевства и три герцогства, связанные только странствующим сувереном и Консолат де Мар, достигла момента, которого боятся ее соперники: единого правителя, одного суда, одного проекта, который больше не откладывается.\n\nКоролевский совет спрашивает, каким должен быть этот проект. Каталонские купцы хотят иметь средиземноморское озеро: Афины восстановились, Египет обхаживал, консульства усилились от Брюгге до Трапезундя, Альмогавары получили гонорар, четыре бара пролетали над каждой гаванью, где производятся расчеты по векселям. Арагонская знать и новые администраторы Трастамары видят иное: на запад, к объединению Иберии на условиях короны, прежде чем Кастилия сможет сделать это на их условиях. Оба пути реальны. Альфонсо Великодушный действительно повернул на восток; Компромисс Каспе действительно поместил нас в иберийскую династическую паутину. Суд должен выбрать, какой Арагон выживет.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_cda.1.a: "Mediterraneum Aragonense: пусть море будет нашим" #NT!
 nd_cda.1.b: "Испано-арагонцы: Иберия на наших условиях" #NT!
  
 # ============================================================================ 
 # Advance DHE Events 
 # ============================================================================ 
 # Catalan Atlas (nd_cda.2): single option 
 nd_cda.2.t: "Атлас Крескес" #NT!
 nd_cda.2.d: "Еврейский картограф Крескес Авраам с Майорки и его сын Джафуда завершили атлас мира по заказу Пере III. На шести листах пергамента изображено Средиземноморье в беспрецедентных деталях-портоланах, африканские золотые караваны Мансы Мусы и шелковые пути на восток до Катая. Работа является свадебным подарком королю Франции: дипломатия и разведка в одном лице. Ни один другой христианский суд не имеет ничего подобного. Пилоты из Генуи и Венеции незаметно просят копии. Моряки Короны имеют преимущество в поколение." #NT!
 nd_cda.2.a: "Мир — это наша карта." #NT!
  
 # Compromise of Caspe (nd_cda.3): branching 
 nd_cda.3.t: "Компромисс Каспе" #NT!
 nd_cda.3.d: "Марти Гуманный умер в Поблете, не оставив законного наследника. Корона остается вакантной, и пять претендентов отстаивают свои права: среди них Фердинанд Антекерский, кастильский принц Трастамары и победитель Гранады, и Жауме Уржельский, коренной каталонский кандидат, происходящий по мужской линии от Жауме II. Девять арбитров из Арагона, Каталонии и Валенсии собрались в Каспе, чтобы вынести обязательное решение. Суд ожидает предпочтений короля, зная, что приговор арбитров тайно податлив.\n\nФердинанд приносит с собой династический вес, кастильский союз и престиж недавних гранадских кампаний. Жауме объединяет преданность каталонской знати и непрерывную линию Дома Араго. Выбор определит, будет ли корона обращена внутрь, к иберийской династической политике, или наружу, к каталонскому партикуляризму." #NT!
 nd_cda.3.a: "Корона Фердинанд Антекеры: династия превыше всего" #NT!
 nd_cda.3.b: "Корона Жауме Уржельского: линия остается каталонской" #NT!
  
 # Magnanimous Court (nd_cda.4): branching 
 nd_cda.4.t: "Альфонсо Великодушный в Неаполе" #NT!
 nd_cda.4.d: "Неаполь пал, Кастель Нуово летает по Сеньере, а Альфонсо V установил свой двор в городе, за который он боролся пять лет. Лоренцо Валла (филолог, доказавший, что «Дар Константина» является подделкой) получает королевскую зарплату. Антонио Беккаделли, прозванный Панормита, составляет застольную беседу короля. Греческие рукописи прибывают на кораблях из Константинополя, спасаясь бегством от османов. Двор внезапно стал самым блестящим на итальянском полуострове, более образованным, чем Флоренция, и более космополитичным, чем Рим.\n\nНо при этом же дворе находятся кондотьеры, ожидающие заданий, королевские военные инженеры, изучающие пороховые укрепления, и браво итальянских войн. Альфонсо должен решить, куда пойдет покровительство: в гуманистический проект, который переживет его имя, или в армию средиземноморских профессионалов, которая сохранит его корону, пока он жив." #NT!
 nd_cda.4.a: "Библиотека Неаполя: гуманизм выше оружия" #NT!
 nd_cda.4.b: "Неаполитанский арсенал: солдаты выше писцов" #NT!
  
 # Consolat de Mar (nd_cda.5): single option 
 nd_cda.5.t: "Llibre del Consolat de Mar" #NT!
 nd_cda.5.d: "Многовековые каталонские морские обычаи были объединены в Llibre del Consolat de Mar, наиболее полный частный закон судоходства, когда-либо написанный в христианской Европе. Марсель принимает его. Пиза принимает его. Акко, Трапани, Фамагуста, Брюгге: где бы ни пришвартовывались корабли четырех полос, Консолат — это закон, который решает, кто платит за выбрасывание, кто страхует груз, кто является третейским судьей между капитаном и торговцем. Корона не обладает монополией на торговлю, но любой спор, передаваемый любому консулу где бы то ни было, разрешается по арагонско-каталонским правилам." #NT!
 nd_cda.5.a: "Lex maritima nostra." #NT!
  
 # Renaixenca (nd_cda.6): single option 
 nd_cda.6.t: "Ла Ренешенка" #NT!
 nd_cda.6.d: "Бонавентура Арибау издает «Оду а ля Отечество». Жасин Вердагер готовит Атлантиду. Jocs Florals восстанавливается в Барселоне, и каталонский язык начинает свое возвращение из кухни и таверны в типографию, университет и зал парламента. То, что на протяжении двух столетий было региональным диалектом периферийной провинции, снова становится языком литературы, политики и общественной сферы. Язык Consolat de Mar обретает свой современный голос, а за ним – национальный проект." #NT!
 nd_cda.6.a: "Голос Каталонии возвращается." #NT!
  
 # ============================================================================ 
 # Advances (display names + descriptions) 
 # ============================================================================ 
 # Age 1 
 nd_cda_pacta_conventa: "Пакта Конвента" #NT!
 nd_cda_pacta_conventa_desc: "Генеральные привилегии 1283 года и арагонская коронационная присяга связывают корону конституционными договорами королевства. Знаменитая формула («Мы, стоящие столько же, сколько вы, а вместе и больше, чем вы, принимаем вас как нашего короля и господина при условии, что вы будете соблюдать наши свободы и законы; если нет, то нет») беспрецедентна в христианской Европе." #NT!
 nd_cda_consolat_de_mar: "Llibre del Consolat de Mar" #NT!
 nd_cda_consolat_de_mar_desc: "Скомпилированный каталонский морской кодекс принят от Марселя до Акры как морской закон Средиземноморья. Корона Арагона не обладает монополией на торговлю, однако каждый коммерческий спор, рассматриваемый в любом консульстве, разрешается по арагонско-каталонским правилам." #NT!
 nd_cda_catalan_company: "Каталонская компания в Греции" #NT!
 nd_cda_catalan_company_desc: "Альмогавары Роже де Флора поступают на службу Византии в 1303 году, а затем выделяют Афинское и Неопатрское герцогства для Арагонской короны, что стало первым прорывом иберийской власти в восточное Средиземноморье и образцом двухвекового каталонского наемничества." #NT!
 nd_cda_almudin_tradition: "Альмудин де Валенсия" #NT!
 nd_cda_almudin_tradition_desc: "Большой крытый зерновой рынок Валенсии, Альмудин, становится продовольственным стержнем средиземноморской кампании Короны. Централизованное управление зернохранилищами дает королевству преимущество в снабжении армии, не имеющее себе равных в Иберии 14-го века." #NT!
 # Age 2 
 nd_cda_catalan_atlas: "Каталонский Атлас" #NT!
 nd_cda_catalan_atlas_desc: "Каталонский атлас семьи Крескес 1375 года делает картографию Арагона-Майорки самой продвинутой из всех христианских государств. Пилоты из Генуи и Венеции незаметно просят копии; Моряки королевства лидируют на поколение в области морской разведки." #NT!
 nd_cda_compromise_of_caspe: "Компромисс Каспе" #NT!
 nd_cda_compromise_of_caspe_desc: "Кризис престолонаследия 1412 года разрешается, когда девять арбитров избирают нового короля в судебном порядке, а не мечом. Соглашение навсегда меняет то, как арагонская корона понимает легитимность: посредством пакта, посредством выборов, посредством обязательного приговора." #NT!
 nd_cda_magnanimous_court_tradition: "Суд Великодушных" #NT!
 nd_cda_magnanimous_court_tradition_desc: "Альфонсо V основывает свой странствующий двор в Неаполе (1442 г.). Лоренцо Валла, Беккаделли, Понтано и Манетти входят в королевский двор; Первый двор эпохи Возрождения к северу от Флоренции, финансируемый иберийской короной, распространяет мягкую силу арагонского государства по всей Италии." #NT!
 nd_cda_drassanes_tradition: "Драссан-Рейалс" #NT!
 nd_cda_drassanes_tradition_desc: "Королевские верфи Барселоны (готическая военно-морская архитектура, способная одновременно заложить тридцать галер под одной крышей) стали промышленным стержнем каталонско-арагонской морской мощи." #NT!
 nd_cda_catalan_galley: "Каталонская галера" #NT!
 nd_cda_catalan_galley_desc: "Характерный военный корабль доминирования Короны в Средиземноморье стандартизирован как класс. Быстрее генуэзской галеры, с усиленным корпусом для десантных работ, каталонская галера защищает конвои консульства и высаживает альмогаваров на сотне берегов." #NT!
 # Age 3 
 nd_cda_senyera_consulates: "Консульства Сеньера" #NT!
 nd_cda_senyera_consulates_desc: "Сеть Consols dels Catalans охватывает все крупные порты Средиземноморья и простирается до Брюгге и Лондона. Каждое консульство летает на четырехполосном автобусе Senyera Reial и предоставляет каталонским торговцам экстерриториальную защиту в соответствии с арагонским торговым законодательством." #NT!
 nd_cda_llotja_tradition: "Каса Ллотха де Мар" #NT!
 nd_cda_llotja_tradition_desc: "Готический Casa Llotja de Mar в Барселоне становится первой фондовой биржей Средиземноморья, договорным судом, где проводятся расчеты по векселям, страхованию судов и морскому арбитражу. Заведение экспортируется в Пальму и Валенсию." #NT!
 nd_cda_mediterranean_viticulture: "Средиземноморское виноградарство" #NT!
 nd_cda_mediterranean_viticulture_desc: "Винные регионы Пенедес, Приорат, Сицилия, Кампания и Апулия находятся под властью Арагонской короны. Винодельческая экономика, охватывающая весь континент, не имеет себе равных ни у одного конкурента." #NT!
 nd_cda_neapolitan_humanism: "Неаполитанский гуманизм" #NT!
 nd_cda_neapolitan_humanism_desc: "После смерти Альфонсо V основанный им культурный проект пережил его: Академия Понтано, Неаполитанская типография Сикста Риссингера (1471 г.) и королевские скриптории поддерживали арагонский гуманизм до конца 15 века." #NT!
 # Age 4 
 nd_cda_generalitat: "Женералитат" #NT!
 nd_cda_generalitat_desc: "Diputació del General (постоянный комитет каталонских кортов, основанный в 1359 году) официально оформлен как постоянный представительный совет с полномочиями по сбору налогов и обеспечению правопорядка. Пактистская конституционная модель, которая определяла Корону на протяжении двух столетий, обретает исполнительную власть." #NT!
 nd_cda_tercio_de_napoles: "Терсио де Наполес" #NT!
 nd_cda_tercio_de_napoles_desc: "Реформы Гонсало де Кордовы во время итальянских войн (1495-1504) привели к созданию терсио: общевойсковой тяжелой пехотной квадратной формы, использующей вместе пику, меч и аркебузу. В нашем графике инновации расцветают под каталонско-арагонской, а не кастильской спонсорской поддержкой." #NT!
 nd_cda_royal_galiot: "Королевский Галиот" #NT!
 nd_cda_royal_galiot_desc: "Drassanes Reials адаптируют гребной военный корабль к условиям раннего Нового времени: более быстрый и легкий галиот для береговой обороны, сопровождения конвоев и текущих антиосманских стычек в Средиземноморье 16-го века." #NT!
 nd_cda_consolat_supremacy: "Утешение превосходства" #NT!
 nd_cda_consolat_supremacy_desc: "Морской кодекс Каталонии стал частью средиземноморского lex maritima даже там, где больше не развеваются арагонские флаги. Корона использует правовую инфраструктуру для обеспечения превосходства в торговле." #NT!
 # Age 5 
 nd_cda_pactist_resistance: "Пактистское сопротивление" #NT!
 nd_cda_pactist_resistance_desc: "Арагонские юристы, такие как Луис де Пегера, формулируют доктрину, согласно которой конституционные пакты не могут быть аннулированы в одностороннем порядке абсолютистской короной. Эта доктрина, проверенная во время каталонского восстания 1640 года и войны за испанское наследство, предоставляет королевству необычную способность к законному (и вооруженному) сопротивлению королевскому произволу." #NT!
 nd_cda_late_neapolitan_court: "Поздний неаполитанский суд" #NT!
 nd_cda_late_neapolitan_court_desc: "Благодаря позднему арагонскому настойчивости Неаполь становится одним из крупнейших городов Европы. Покровительство Вико, Перголези и Галиани поддерживает арагонское культурное первенство на юге Италии на протяжении всего периода Просвещения." #NT!
 nd_cda_almadraba_fishery: "Рыболовство Альмадраба" #NT!
 nd_cda_almadraba_fishery_desc: "Ловушка для голубого тунца Альмадраба (финикийского происхождения, усовершенствованная каталонско-сицилийскими рыбаками) становится крупнейшим организованным досовременным промыслом в Средиземноморье. Экспорт соленого тунца перерастает в государственно-монополистическую отрасль." #NT!
 # Age 6 
 nd_cda_renaixenca: "Ла Ренессенса" #NT!
 nd_cda_renaixenca_desc: "Каталонское литературное, лингвистическое и политическое возрождение XIX века превращает региональный разговорный язык обратно в современный национальный язык. Благодаря «Оде а-ля-Патрия» Арибо, «Атлантиде» Вердагера и восстановлению «Цветочных садов» публичная сфера возвращается на язык «Консолат де Мар»." #NT!
 nd_cda_indianas_industry: "Индианас Промышленность" #NT!
 nd_cda_indianas_industry_desc: "Каталонская хлопчатобумажная промышленность (Индиана) превратилась в первые механизированные текстильные мануфактуры в Иберии. Барселона становится «фабрикой Испании», промышленной мастерской арагонской короны." #NT!
  
 # ============================================================================ 
 # Custom Units 
 # ============================================================================ 
 n_nd_cda_catalan_galley: "Каталонская галера" #NT!
 n_nd_cda_catalan_galley_desc: "Стандартизированный военный корабль Средиземноморского флота Короны. Усиленный для десантных операций, более быстрый, чем его генуэзские соперники, предназначенный для сопровождения каталонской торговли и высадки альмогаваров на враждебных пляжах." #NT!
 n_nd_cda_levy_galley: "Каталонский Леви Галера" #NT!
 n_nd_cda_levy_galley_desc: "Прибрежный бюргерский вариант каталонской галеры, собранный из портовых городов Барселоны, Валенсии, Пальмы, Неаполя и Палермо. Экипаж состоит из рабочих и крестьян с побережья Средиземного моря." #NT!
 n_nd_cda_royal_galiot: "Королевский Галиот" #NT!
 n_nd_cda_royal_galiot_desc: "Ранняя современная эволюция галеры Drassanes Reials, более легкого и быстрого гребного судна для береговой обороны и антиосманских стычек в поздних средиземноморских войнах." #NT!
 a_nd_cda_tercio_de_napoles: "Терсио де Наполес" #NT!
 a_nd_cda_tercio_de_napoles_desc: "Общевойсковое пехотное каре, выкованное в Арагонском Неаполе во время Итальянских войн: пика, меч и аркебуза объединены в единую тактическую единицу. Самая дисциплинированная тяжелая пехота Европы XVI века." #NT!
  
 # ============================================================================ 
 # Levy 
 # ============================================================================ 
 levy_nd_cda_catalan_galley: "Каталонский Леви Галера" #NT!
 levy_nd_cda_catalan_galley_desc: "Финансируемый бюргерами сбор на галеры, состоявший из крестьян и рабочих, взимался в средиземноморских портовых городах Короны." #NT!
  
 # ============================================================================ 
 # Custom Buildings 
 # ============================================================================ 
 nd_cda_casa_llotja_de_mar: "Каса Ллотха де Мар" #NT!
 nd_cda_casa_llotja_de_mar_desc: "Готическая морская биржа Барселоны: первая фондовая биржа Средиземноморья. Здесь проводятся расчеты по векселям, страхованию судов и морскому арбитражу. Расширена как институциональная модель для консульств Пальмы и Валенсии." #NT!
 nd_cda_generalitat_hall: "Зал Женералитата" #NT!
 nd_cda_generalitat_hall_desc: "Местонахождение Diputació del General: постоянный комитет каталонских кортов. Совет постоянных представителей, орган по сбору налогов и конституционный контроль королевского абсолютизма." #NT!
 nd_cda_magnanimous_court: "Великодушный суд" #NT!
 nd_cda_magnanimous_court_desc: "Странствующий двор эпохи Возрождения, основанный Альфонсо V в Неаполе в 1442 году. Здесь служили Лоренцо Валла, Беккаделли, Понтано и Манетти; королевская скриптория копировала греческие рукописи, прибывшие из разваливающейся Восточной империи." #NT!
 nd_cda_almudin: "Альмудин" #NT!
 nd_cda_almudin_desc: "Великое крытое в готическом стиле зернохранилище Валенсии распространилось по городам Короны. Централизованное хранение продуктов питания, рынки зерна по справедливым ценам и инфраструктура поставок для кампаний в Средиземноморье." #NT!
 nd_cda_drassanes_reials: "Драссан-Рейалс" #NT!
 nd_cda_drassanes_reials_desc: "Королевские верфи Барселоны: сохранившаяся готическая военно-морская архитектура, способная одновременно закладывать до тридцати галер под одной крытой крышей. Промышленный стержень каталонско-арагонской морской мощи." #NT!
 nd_cda_senyera_consulate: "Консульство Сеньеры" #NT!
 nd_cda_senyera_consulate_desc: "Каталонское консульство сети Consols dels Catalans, летающее на четырехполосном самолете Senyera Reial. Предоставляет экстерриториальную защиту торговцам Короны и применяет арагонское коммерческое право в порту пребывания." #NT!
 nd_cda_mediterranean_vineyard: "Средиземноморский виноградник" #NT!
 nd_cda_mediterranean_vineyard_desc: "Производство вина из регионов Пенедес, Приорат, Сицилия, Кампания или Апулия. Вина Короны перемещаются по каталонской торговой сети от Брюгге до Константинополя." #NT!
 nd_cda_almadraba: "Альмадраба" #NT!
 nd_cda_almadraba_desc: "Каталонско-сицилийская ловушка для голубого тунца Альмадраба. Промышленное рыболовство обеспечивает экспортный рынок средиземноморского соленого тунца, одну из крупнейших досовременных белковых отраслей в Европе." #NT!
 nd_cda_catalan_cotton_mill: "Каталонская хлопковая фабрика" #NT!
 nd_cda_catalan_cotton_mill_desc: "Барселонская хлопчатобумажная мануфактура. Механизированная промышленность Индианы: la Fàbrica de Espanya, промышленная мастерская поздней арагонской короны." #NT!
  
 # ============================================================================ 
 # Production Method Display Names 
 # ============================================================================ 
 nd_cda_llotja_maintenance: "Морские обменные операции" #NT!
 nd_cda_llotja_maintenance_desc: "Контракты, бухгалтерские книги, облигации страхования судов и арбитражные реестры первой средиземноморской фондовой биржи." #NT!
 nd_cda_generalitat_maintenance: "Операции Совета" #NT!
 nd_cda_generalitat_maintenance_desc: "Протоколы, запечатанные акты и церемониальные принадлежности каталонской парламентской традиции." #NT!
 nd_cda_court_patronage: "Судебный патронаж" #NT!
 nd_cda_court_patronage_desc: "Зарплаты ученых-гуманистов, книги королевской библиотеки, шелка и вина двора эпохи Возрождения." #NT!
 nd_cda_almudin_maintenance: "Зернохранилище" #NT!
 nd_cda_almudin_maintenance_desc: "Запасы зерна, ремонт каменной кладки и деревянные работы в крытой зернохранилище Валенсии." #NT!
 nd_cda_drassanes_maintenance: "Операции верфи" #NT!
 nd_cda_drassanes_maintenance_desc: "Пиломатериалы, военно-морские припасы, смола и кованое железо потребляются Королевскими верфями Барселоны." #NT!
 nd_cda_consulate_maintenance: "Консульские операции" #NT!
 nd_cda_consulate_maintenance_desc: "Бумага, ткань, сургучные печати и столовые вина заведения каталонского консула в иностранном порту." #NT!
 nd_cda_vineyard_production: "Производство вина" #NT!
 nd_cda_vineyard_production_desc: "Средиземноморское виноградарство: прессы, погреба, амфоры и экспортные бочки из винодельческих регионов Пенедес, Приорат, Сицилия, Кампания и Апулия." #NT!
 nd_cda_almadraba_maintenance: "Операции по ловле тунца" #NT!
 nd_cda_almadraba_maintenance_desc: "Сети, мачты, соль и снасти каталонско-сицилийского голубого плавника альмадраба." #NT!
 nd_cda_indianas_production: "Индианас Продакшн" #NT!
 nd_cda_indianas_production_desc: "Механизированное производство набивного хлопка: хлопок, волокно, красители и первые промышленные прессы каталонских текстильных инноваций." #NT!
  
 nd_cda_almoixerifat_reform: "Реформа Альмушерифата" #NT!
 nd_cda_almoixerifat_reform_desc: "Средневековые арагонские таможни и казначейские учреждения (almoixerifats, первоначально учреждения Андалусии, принятые короной Реконкисты) рационализируются в духе позднего абсолютистского итальянского стиля, модернизируя сбор налогов и управление строительством." #NT!
 nd_cda_companyies_de_catalans: "Компании Каталонии" #NT!
 nd_cda_companyies_de_catalans_desc: "Акционерные компании конца XIX века (Banc de Barcelona, ​​Companyia Trasatlàntica, La Maquinista Terrestre i Marítima), которые финансируют промышленную экспансию Каталонии и превращают рынки капитала короны в финансовую основу индустриализации Южной Европы." #NT!
 nd_cda_modernisme: "Модернизм" #NT!
 nd_cda_modernisme_desc: "Гауди, Доменек и Монтанер, Пуч и Кадафальк. Литературное возрождение Ренессансы перерастает в развитую цивилизацию, которая определяет Барселону как один из главных центров европейского современного искусства." #NT!
  
 # Tooltip keys for hidden_effect set_variable lines 
 nd_cda_formed_tt: "Образовалась Арагонская империя" #NT!
 nd_cda_path_a_tt: "Выбран путь Mediterraneum Aragonense" #NT!
 nd_cda_path_b_tt: "Выбор испано-арагонского пути" #NT!
 nd_cda_catalan_galley_levy: "Каталонский Галерный Леви" #NT!
 nd_cda_catalan_galley_levy_desc: "Средиземноморские портовые города Короны повышают сборы на галеры. Горожане Барселоны, Валенсии, Пальмы, Неаполя и Палермо финансируют строительство корпусов; крестьяне и рабочие вдоль побережья Средиземного моря гребут их. Массовая мобилизация морской мощи без затрат на постоянный флот." #NT!
  
 # ============================================================================ 
 # DESTINY TREE 
 # ============================================================================ 
 # Path tooltip keys (nd_cda_path_a_tt / nd_cda_path_b_tt) are defined earlier 
 # in the file with the formation-event variable tooltips. 
  
 # Destiny advances 
 nd_cda_destiny: "Имперский проект" #NT!
 nd_cda_destiny_desc: "Сформированная корона теперь должна выбрать, какой империей она намерена стать. Дорога раздваивается: восточно-средиземноморская талассократия или атлантическая колониальная держава. Стабильность выше 75 сохраняет единство королевства для выбора." #NT!
  
 nd_cda_dest_catalan_greece: "Восстановить каталонскую Грецию" #NT!
 nd_cda_dest_catalan_greece_desc: "Верните Афинское герцогство, герцогство Неопатра и арагонское графство Патры — восточные завоевания Каталонской компании в 1303–1311 годах. Завладейте Афинами, Неопатрами и Патрами и получите тысячу золотых для финансирования экспедиции." #NT!
 nd_cda_dest_aegean_empire: "Эгейская империя" #NT!
 nd_cda_dest_aegean_empire_desc: "Возьмем, к примеру, стратегическую островную дугу, которая разделяет восточное Средиземноморье: Крит (Кандия), Родос и Хиос. Выставьте армию из пятидесяти полков и увеличьте королевство до трех тысяч, чтобы завоевание закрепилось." #NT!
 nd_cda_dest_mare_nostrum: "Маре Нострум Арагоненсе" #NT!
 nd_cda_dest_mare_nostrum_desc: "Средиземное море – это озеро Короны. Удерживайте Фамагусту на Кипре, Александрию в Египте и Тунис в узком месте внутреннего моря. Три тысячи золота, семьдесят пять престижа и общая сумма развития в сорок пятьсот отмечают вершину. Открывает доступ к Drassanes Maxima." #NT!
  
 nd_cda_dest_atlantic_bridgehead: "Атлантический плацдарм" #NT!
 nd_cda_dest_atlantic_bridgehead_desc: "Захватите атлантические плацдармы: Канарские острова (Тегисе), Мадейру (Фуншал) и Азорские острова (Понта-Делгада). Имея в запасе тысячу золотых, Корона распространяет свою традицию мореплавания через Геркулесовы Столпы." #NT!
 nd_cda_dest_catalan_caribbean: "каталанский карибский" #NT!
 nd_cda_dest_catalan_caribbean_desc: "Установите четыре бара над Эспаньолой (Бохио) и Кубой (Гавана), примите институт Нового Света и вырастите королевство до трех тысяч жителей. Первая каталонско-арагонская плантация Атлантики." #NT!
 nd_cda_dest_atlantic_empire: "Каталонская Атлантическая империя" #NT!
 nd_cda_dest_atlantic_empire_desc: "Доберитесь до материка: Теночтитлан (столица Мексики), Каламари (Картахена-де-Индиас) и Маяпан (Юкатан) – все под каталонско-арагонским спонсорством. Три тысячи золота, семьдесят пять престижа и сорок пятьсот развития. Открывает доступ к Дому Контратасио Каталана." #NT!
  
 # Destiny event titles, descriptions, and option text 
 # nd_cda.7: Destiny root acknowledgment 
 nd_cda.7.t: "Имперский проект" #NT!
 nd_cda.7.d: "Королевский совет в Барселоне решил вопрос. Королевство одно, трон один, проект один, и путь вперед теперь будет измеряться конкретными целями, а не абстракциями придворной риторики. Хроника того, чем станет Корона Арагона, открывает новую главу, и секретари короля взялись за нее." #NT!
 nd_cda.7.a: "Пусть работа начнется." #NT!
  
 # nd_cda.8: Path A Stage 1: Catalan Greece 
 nd_cda.8.t: "Герцогства восстановлены" #NT!
 nd_cda.8.d: "Афины пали. Неопатра поклонился. Арагонское знамя снова развевается над Акрополем, где каталонская компания под командованием Роже де Флора впервые подняла его в 1311 году. Это требование двухсотлетней давности, бездействующее с тех пор, как флорентийцы Аччайуоли изгнали последнего каталонского герцога в 1388 году, теперь подтверждено сталью. Хронику Рамона Мунтанера перечитывают вслух при дворе. Восточная граница Короны вновь открылась." #NT!
 nd_cda.8.a: "Афины снова наши." #NT!
  
 # nd_cda.9: Path A Stage 2: Aegean Empire branching 
 nd_cda.9.t: "Эгейский гарнизон" #NT!
 nd_cda.9.d: "Кандия, Родос, Хиос (стратегическая цепь островов восточного Средиземноморья) склоняются перед четырьмя перекладинами. Венецианские галеры теперь должны спрашивать разрешения на проход; Генуэзские факторы обращаются к Короне с просьбой о торговых лицензиях; Посланники мамлюков прибывают в Неаполь, чтобы обсудить условия. У королевства есть острова. Вопрос в том, какой империей ими управлять.\n\nВоенный совет хочет, чтобы в каждой островной цитадели были сильные гарнизоны: арагонские солдаты, каталонские офицеры, Акрополь в Афинах снова превратился в крепость, как во времена Каталонской компании. Канцелярия предпочитает венецианскую модель: судебные приставы и консулы, правило невмешательства, интеграция греческого и латинского населения посредством привилегий, а не присутствия." #NT!
 nd_cda.9.a: "Закрепите гарнизон в каждой цитадели." #NT!
 nd_cda.9.b: "Приставы и судебные приставы: в венецианском стиле." #NT!
  
 # nd_cda.10: Path A Stage 3: Mare Nostrum branching 
 nd_cda.10.t: "Маре Нострум" #NT!
 nd_cda.10.d: "Фамагуста, Александрия, Тунис. Все три терминала восточно-средиземноморского торгового треугольника летают по Сеньере. Лоцманы Генуи и Венеции подают свои грузы через каталонские консульства; султанат мамлюков либо пал, либо пришел к соглашению; Магриб платит дань Короне. Со времен Рима не было средиземноморской державы такого масштаба.\n\nТеперь суд должен решить, что делать с такой позицией. Папа предлагает титул крестового похода и право назвать любую экспедицию против османов священной войной. Торговые дома Барселоны предпочитают, чтобы король укрепил мир и превратил внутреннее море в свободное Арагонское торговое озеро под единой таможенной системой." #NT!
 nd_cda.10.a: "Возьмите крест крестоносца: закончите работу." #NT!
 nd_cda.10.b: "Королевский мир: Mare Pacatum." #NT!
  
 # nd_cda.11: Path B Stage 1: Atlantic Bridgehead 
 nd_cda.11.t: "Столпы перекрещены" #NT!
 nd_cda.11.d: "Канарские острова — арагонцы. Мадейра – арагонский. Азорские острова — арагонские. Три архипелага в цепи, ведущей через Атлантику (той же самой цепи, которую в другой временной шкале Кастилия использовала, чтобы достичь Индии) теперь являются плацдармом Короны. Каталонские моряки, потратившие два столетия на изучение Средиземноморья, пронесли эту науку через Гибралтарский пролив. Западный океан стал судоходным пространством." #NT!
 nd_cda.11.a: "На запад." #NT!
  
 # nd_cda.12: Path B Stage 2: Catalan Caribbean branching 
 nd_cda.12.t: "Каталонская Индия" #NT!
 nd_cda.12.d: "Эспаньола принадлежит Короне. Куба принадлежит Короне. В Гаване летают четыре бара, а не львы и замки. Создаются первые арагонско-каталонские плантации, каталонские эмигранты высаживаются в новых доках, и вопрос о том, как управлять Индией, становится актуальным.\n\nВоенные авантюристы (конкистадоры) обращаются к королю с просьбой выдать ему хартии на завоевание материковых королевств от его имени. Духовенство и канцелярия хотят более упорядоченной системы: энкомьенды управляются посредством лицензированных грантов, миссионерские ордена обучают обращенную местную рабочую силу, а Корона ужесточает контроль над своими колониальными капитанами." #NT!
 nd_cda.12.a: "Устав конкистадоров." #NT!
 nd_cda.12.b: "Лицензируйте систему энкомьенда." #NT!
  
 # nd_cda.13: Path B Stage 3: Atlantic Empire branching 
 nd_cda.13.t: "Дом Контратасио" #NT!
 nd_cda.13.d: "Теночтитлан пал. Юкатан находится под управлением. Каламари отправляет свои изумрудные и золотые конвои в Барселону под каталонскими флагами. Атлантическая империя теперь стала фактом, и Корона основывает в Барселоне Casa de Contratacio Catalana, торговую администрацию, которая будет лицензировать каждое путешествие в Индию, взимать королевскую пятую часть с каждого груза и выносить решения по всем колониальным спорам в рамках Consolat de Mar.\n\nСуд обсуждает, как управлять системой. Купцы Барселоны, Валенсии и Пальмы хотят строго лицензируемой монопольной торговли: индийские слитки проходят через несколько назначенных портов по фиксированным таможенным режимам. Администраторы Трастамары видят иное: открыть колониальную систему для каталонской миграции, интегрировать колонии в королевство как заморские королевства, повысить их развитие так, как были подняты Неаполь и Сицилия." #NT!
 nd_cda.13.a: "Монополистическая торговля: Индия для короны." #NT!
 nd_cda.13.b: "Расселение и интеграция: заморские королевства." #NT!
  
 # Destiny timed modifier names and descriptions 
 STATIC_MODIFIER_NAME_nd_cda_dest_acropolis_garrison: "Гарнизон Акрополя" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_acropolis_garrison: "Арагонские солдаты в каждой островной цитадели от Афин до Родоса. Каталонские офицеры, арагонские сержанты, гарнизоны крепостей прошли обучение по старой традиции Альмогавара. Их трудно вытеснить, но усиление их в восточном Средиземноморье обходится гораздо дороже, чем усиление тыла." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_catalan_bailiwick: "Каталонские бейливики" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_catalan_bailiwick: "Венецианская модель: мягкое правление через судебных приставов, консулов ​​и кооптированную на местном уровне греческую и латинскую элиту. Сеньера летает, но не размещает гарнизоны. Дипломатия заменяет оккупацию." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_crusader_aragon: "Крестоносец Арагон" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_crusader_aragon: "Папа дарует титул крестового похода. Арагонское оружие превратило господство Средиземноморья в священную войну против османов, мамлюков и стран Магриба. Тактическое преимущество против неверующих, оплаченное военным истощением среди христианских подданных Короны." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_sea_kings_peace: "Мир Морского Короля" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_sea_kings_peace: "Средиземноморье становится единой таможенной зоной под управлением Арагонского арбитража. Торговые дома Барселоны процветают, содержание армии обходится дешевле, а мирные соглашения ведутся с позиции неоспоримого регионального превосходства." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_conquistadors_catalans: "Конкистадоры Каталонцы" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_conquistadors_catalans: "Корона выдает грамоты на завоевание военным авантюристам из Каталонии, Валенсии и Неаполя. Коренные королевства на материке переходят в руки небольших групп каталонско-арагонских капитанов с пушками, ценой инфляции, которую всегда вызывают потрясения на рынке драгоценных металлов." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_encomienda_catalana: "Каталонская энкомьенда" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_encomienda_catalana: "Лицензированные гранты энкомьенды, предоставляемые миссионерскими приказами. Обращение коренного населения происходит через школы и приходы; колониальные субъекты интегрируются в царство Короны в соответствии с теми же конституционными договорами, которые регулируют Каталонию, Валенсию и Неаполь." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_indies_trade: "Индийская торговая монополия" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_indies_trade: "Casa de Contratacio лицензирует каждое путешествие. Индийские слитки проходят через Барселону, Валенсию и Пальму под строгим таможенным контролем. Дипломатический потенциал расширяется, объявлять войны становится дешевле, но престиж Короны слегка падает, поскольку имперский проект становится коммерческим, а не рыцарским предприятием." #NT!
 STATIC_MODIFIER_NAME_nd_cda_dest_atlantic_dominion: "Атлантический Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_cda_dest_atlantic_dominion: "Колонии объединяются в заморские королевства, такие как Неаполь или Сицилия, только за океаном. Каталонские эмигранты возводят плантации и города; положение Короны среди великих держав признано; Рост населения и восстановление колоний ускоряются благодаря открытой системе поселений." #NT!
  
 # Destiny capstone buildings 
 nd_cda_drassanes_maxima: "Драссан Максима" #NT!
 nd_cda_drassanes_maxima_desc: "Эволюция Королевских Драссанов в имперском масштабе. Грандиозный штаб Средиземноморского военно-морского флота, построенный в рамках проекта Mare Nostrum, способный одновременно закладывать четыре военных корабля и поддерживать восточный флот Короны с одной верфи." #NT!
 nd_cda_drassanes_maxima_maintenance: "Операции Имперской верфи" #NT!
 nd_cda_drassanes_maxima_maintenance_desc: "Древесина, военно-морские запасы, смола, железо и оружие потребляются в ходе эволюции Королевских верфей имперского масштаба." #NT!
  
 nd_cda_casa_contratacio: "Дом Контратасио Каталана" #NT!
 nd_cda_casa_contratacio_desc: "Барселонский аналог кастильского Casa de Contratacion. Выдает лицензии на каждое путешествие в Индию, взимает королевский пятый сбор с грузов в слитках, регистрирует каталонских эмигрантов и разрешает колониальные коммерческие споры в рамках Consolat de Mar, имперской торговой администрации Короны." #NT!
 nd_cda_casa_contratacio_maintenance: "Операции Торгового Дома" #NT!
 nd_cda_casa_contratacio_maintenance_desc: "Бумага, регистры, изысканные ткани и камерная мебель Имперского торгового управления Короны в Барселоне." #NT!
  
 # ============================================================================ 
 # Bureaucracies (4 institutions; 2 slots granted by auto_modifier + 1 capital = 3 effective) 
 # ============================================================================ 
 AUTO_MODIFIER_NAME_nd_cda_bureaucracy_authority: "Корона Арагона Канцелярии" #NT!
 AUTO_MODIFIER_DESC_nd_cda_bureaucracy_authority: "Пактистская администрация Короны охватывает четыре королевства, разделенных морем. Королевский совет может содержать два постоянных учреждения в дополнение к учреждению столицы." #NT!
  
 cda_reial_cancelleria_bureaucracy: "Королевская Канчеллерия д'Араго" #NT!
 cda_reial_cancelleria_bureaucracy_desc: "Арагонская королевская канцелярия, профессионально созданная при Жауме II с 1290 года и закрепленная в 1344 году Ординационами королевского дома Пере III. Укомплектованный грамотными людьми с университетским образованием, он издает указы на каталонском, арагонском, латинском и (начиная с Альфонсо V) итальянском языках, поддерживая один из самых дисциплинированных дипломатических регистров средневековой Европы, основу каталонской литературной прозы и административную слаженность Короны в четырех королевствах, разделенных морем." #NT!
  
 cda_generalitat_bureaucracy: "Женералитат Каталонии" #NT!
 cda_generalitat_bureaucracy_desc: "Постоянный комитет каталонских кортов, родившийся в 1359 году в кортах Серверы в качестве Diputació del General для управления пожертвованиями (субсидиями), предоставленными Пере III. В течение одного поколения оно стало постоянным политическим руководителем княжества, взимающим налоги с генералитета со своей резиденции в Барселоне (Палау де ла Женералитат, основанный в 1403 году) и действуя как видимое институциональное воплощение пактистского конституционализма: сначала король связывает себя, затем его подданные подчиняются." #NT!
  
 cda_consolat_de_mar_bureaucracy: "Консолат де Мар" #NT!
 cda_consolat_de_mar_bureaucracy_desc: "Первая морская юрисдикция Средиземноморья, зафрахтованная в Валенсии в 1283 году Пере III Великим и закрепленная в Llibre del Consolat de Mar, статьи которого регулируют ответственность судовладельца, заработную плату экипажа и призовые случаи от Барселоны до Мессины и Трапани. К пятнадцатому веку ее каталонская юриспруденция стала лингва-франка средиземноморской торговли, ее цитировали в генуэзских и венецианских судах и переводили на все основные средиземноморские языки." #NT!
  
 cda_sommaria_bureaucracy: "Regia Camera della Sommaria" #NT!
 cda_sommaria_bureaucracy_desc: "Верховный бухгалтерский суд Неаполитанского королевства, расширенный Альфонсо V Великодушным после его завоевания в 1442 году анжуйского ядра тринадцатого века. Его luogotenenti и razionali проверяют все доходы владений, таможенные пошлины и феодальные причитания от Абруццо до Калабрии, обеспечивая финансовую основу, которая финансирует гуманистический двор Альфонсо в Кастель-Нуово и его итальянские войны. Неаполь становится мастерской позднесредневекового арагонского государственного управления." #NT!
