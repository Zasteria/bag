 MTP_f: "Империя Мутапа" #NT!
 MTP_f_desc: "Королевство Мутапа было основано Ньяцимбой Мутотой, когда Каранга Шона расширилась на север от Великого Зимбабве до долины Замбези в поисках соли и новых земель. На пике своего развития Мутапа контролировал торговлю золотом в юго-восточной Африке, направляя богатство внутренних районов через Софалу торговцам на побережье Суахили. Восстановить Мутапу — значит воссоединить сердце Шоны и вернуть себе власть над легендарными богатствами региона." #NT!
