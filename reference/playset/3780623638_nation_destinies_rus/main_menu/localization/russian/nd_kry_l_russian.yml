l_russian:
 STATIC_MODIFIER_NAME_nd_kry_mountain_wall: "Горная стена Дайламитов" #NT!
 STATIC_MODIFIER_DESC_nd_kry_mountain_wall: "На протяжении веков воины Дайлама удерживали проходы Альборза против всех империй, стремившихся их завоевать. Гилан продолжает это наследие, его армии обучены тактике «стены щитов» и войне с копьями, которые заставляли дайламитов бояться от Багдада до Бухары." #NT!
 STATIC_MODIFIER_NAME_nd_kry_caspian_silk_roads: "Шелковый путь Каспия" #NT!
 STATIC_MODIFIER_DESC_nd_kry_caspian_silk_roads: "Тутовые рощи и шелковые мастерские Гилана производят лучшую нить во всей Азии. От шумных базаров Рашта до порта Анзали богатства Каспия текут наружу, переносимые армянскими и греческими купцами во все уголки известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_kry_mountain_independence: "Горная Независимость" #NT!
 STATIC_MODIFIER_DESC_nd_kry_mountain_independence: "Под пологом лесов Альборза жители Гилани помнят то, чему научились великие империи: некоторые земли просто не стоят затрат на завоевание. Пусть придут низинцы: горы сожрут их, как всегда." #NT!
 STATIC_MODIFIER_NAME_nd_kry_silk_integration: "Шелковая интеграция" #NT!
 STATIC_MODIFIER_DESC_nd_kry_silk_integration: "Охватывая институты и рынки более широкого мира, Гилян превращает свое шелковое богатство в долгосрочную модернизацию. То, что империя требует повиновения, Гилян отплачивает десятикратным доходом. И при этом приобретает свою незаменимость." #NT!
 nd_kry.1.t: "Основание Гилана" #NT!
 nd_kry.1.d: "Зеленая провинция Гилян возвышается над окутанными туманом лесами Альборза, где Каспийское море разбивается о берега, окруженные тутовыми рощами и рисовыми полями. На протяжении веков эта земля укрывала воинов-дайламитов, которые свергали халифаты и основывали династии из своих горных крепостей. Теперь, объединившись под одним знаменем, Гилян должен выбрать свой путь: примет ли он жестокую независимость своего горного наследия, собирая армии из горных деревень, которые ни один завоеватель никогда не сможет подчинить себе? Или же ему следует использовать богатства своей легендарной торговли шелком, превратив Каспий в торговую магистраль, связывающую отдаленные рынки с ткацкими станками Рашта и Лахиджана?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_kry.1.a: "Мы наследники Дэйлама. Пусть наши горы говорят" #NT!
 nd_kry.1.b: "Шелк будет нашим мечом, а Каспий – нашей властью." #NT!
 nd_kry.2.t: "Наследие воинов Дайламита" #NT!
 nd_kry.2.d: "За столетия до возникновения тюркских династий именно люди Дайлама поддерживали баланс сил во всем исламском мире. Вооруженные раскрашенными щитами и двуконечным копьем-зупином, они образовали непроницаемые стены из щитов в узких горных перевалах Альборза. Буид-амиры, завоевавшие Багдад в 945 году, сами были дайламитами, и их пехота на протяжении поколений оставалась элитным ядром каждой персидской армии. Теперь, когда Гилан вновь открывает для себя это военное наследие, на старых тренировочных площадках снова раздается эхо ударов щитов о щиты и свиста копий в горном воздухе." #NT!
 nd_kry.2.a: "Стена щитов держится." #NT!
 nd_kry.3.t: "Династия Каркия" #NT!
 nd_kry.3.d: "Из своей столицы Лахиджана, расположенной между лесами прибрежной равнины и вершинами Альборза, династия Каркия основала зайдитское шиитское государство, непохожее ни на одно другое. В то время как великие империи поднимались и падали в Персии, Каркия сохранили свою независимость благодаря проницательной дипломатии, непроходимой местности и лояльности своих горных подданных. Под их патронажем Лахиджан стал центром исламской науки и юриспруденции, его медресе привлекают студентов со всего шиитского мира, в то время как его базары переполнены шелковыми нитями, направляющимися на отдаленные рынки." #NT!
 nd_kry.3.a: "Да продлится царствование Каркии." #NT!
 nd_kry.4.t: "Сефевидская тень" #NT!
 nd_kry.4.d: "Сефевидский шах обратил свой взор на Гилан. Чего монголы, Тимуриды и многие другие не смогли добиться силой, Шах Аббас I достиг посредством терпеливого окружения и подавляющей силы. В 1592 году последний правитель Каркии был свергнут, и Гилян вошел в состав Империи Сефевидов. Однако это не просто история завоеваний: шах жаждет шелка Гилана больше всего на свете и сделал эту провинцию краеугольным камнем своей торговой империи. Вопрос, стоящий сейчас перед Гиланом, заключается в том, сопротивляться ли этой трансформации или воспользоваться возможностями, которые она открывает. Горы по-прежнему служат убежищем для тех, кто готов сражаться, но шелковые мастерские предлагают иную силу." #NT!
 nd_kry.4.a: "Горы раньше нас приютили: они снова приютят" #NT!
 nd_kry.4.b: "Мы вплетем себя в ткань империи" #NT!
 nd_kry_daylami_heritage: "Дайламитское наследие" #NT!
 nd_kry_daylami_heritage_desc: "Боевые традиции воинов-дайламитов, завоевавших Багдад и основавших династию Буидов." #NT!
 nd_kry_shield_wall_tradition: "Традиция Стены Щитов" #NT!
 nd_kry_shield_wall_tradition_desc: "Отличительный боевой порядок дайламитов, использующий высокие раскрашенные щиты и двузубые дротики-зупины для создания непроницаемой оборонительной линии." #NT!
 nd_kry_alborz_fortifications: "Укрепления Альборза" #NT!
 nd_kry_alborz_fortifications_desc: "Горные крепости хребта Альборз, древние крепости, веками защищавшие независимость Гилана." #NT!
 nd_kry_caspian_rice_paddies: "Каспийские рисовые поля" #NT!
 nd_kry_caspian_rice_paddies_desc: "Террасные рисовые поля прибрежной низменности Гилана, питаемые обильными дождями из Каспийского моря." #NT!
 nd_kry_caspian_sericulture: "Каспийское шелководство" #NT!
 nd_kry_caspian_sericulture_desc: "Древнее искусство выращивания шелка в Гиляне, где тутовые рощи и дома тутового шелкопряда усеивают пышный каспийский пейзаж." #NT!
 nd_kry_zaydi_refuge: "Убежище Зайди" #NT!
 nd_kry_zaydi_refuge_desc: "Горы Гилана служат убежищем для зайди-шиитских общин с 9-го века, предлагая убежище от преследований Аббасидов и воспитывая особую религиозную идентичность." #NT!
 nd_kry_karkiya_dynasty: "Династия Каркия" #NT!
 nd_kry_karkiya_dynasty_desc: "Династия Зайди-шиитов Каркия, которая правила восточным Гиляном из Лахиджана более двух столетий, сохраняя независимость посредством местности и дипломатии." #NT!
 nd_kry_rasht_bazaar_tradition: "Традиция Раштского базара" #NT!
 nd_kry_rasht_bazaar_tradition_desc: "Большой базар Рашта, где торгуют шелком, рисом и каспийскими товарами с момента основания города в сасанидскую эпоху." #NT!
 nd_kry_caspian_navigation: "Каспийское судоходство" #NT!
 nd_kry_caspian_navigation_desc: "Мореходные традиции прибрежных общин Гилана, чьи дау и торговые суда курсируют по Каспию от Энзели до Баку и далее." #NT!
 nd_kry_lahijan_madrasa: "Лахиджан медресе" #NT!
 nd_kry_lahijan_madrasa_desc: "Медресе и библиотеки Лахиджана, центр зайдийского обучения и юриспруденции под патронажем Каркии." #NT!
 nd_kry_dual_dynasty_tolerance: "Двойная династийная толерантность" #NT!
 nd_kry_dual_dynasty_tolerance_desc: "Сосуществование суннитской династии Амира Доббаджа в западном Гилане и шиитской династии Каркия на востоке - редкий пример сектантского согласия." #NT!
 nd_kry_highland_raiders: "Хайленд Рейдерс" #NT!
 nd_kry_highland_raiders_desc: "Легкая кавалерия, набранная из лесистых горных долин Гилана, опытная в быстрых фланговых атаках на местности, которая могла бы остановить более тяжелую всадницу." #NT!
 nd_kry_silk_monopoly: "Шелковая монополия" #NT!
 nd_kry_silk_monopoly_desc: "На пике своего развития Гилан производил почти половину всего персидского шелка, что делало его крупнейшим экспортером шелка в Азии и предметом зависти европейских купцов.\n\n#italic Доступно в: $nd_kry_abrisham_khaneh$#!" #NT!
 nd_kry_bandar_anzali: "Бандар-э-Анзали" #NT!
 nd_kry_bandar_anzali_desc: "Порт Энзели, ворота Гилана в Каспийское море и основной канал экспорта шелка в Россию, на Кавказ и в Среднюю Азию." #NT!
 nd_kry_caspian_war_fleet: "Каспийский военный флот" #NT!
 nd_kry_caspian_war_fleet_desc: "Вооруженные военные галеры построены в портах Гиляна для защиты торговых путей Каспийского моря и прибрежных вод." #NT!
 nd_kry_caspian_fisheries: "Каспийское рыболовство" #NT!
 nd_kry_caspian_fisheries_desc: "Богатые рыбные запасы Каспийского побережья, добыча осетровых, сиговых и других видов рыбы для прокорма растущего населения Гилана." #NT!
 nd_kry_gilaki_literature: "Литература Гилаки" #NT!
 nd_kry_gilaki_literature_desc: "Богатая литературная традиция языка гилаки, особого иранского языка, сохраняющего поэзию и хроники, датируемые столетиями." #NT!
 nd_kry_merchant_networks: "Торговые сети" #NT!
 nd_kry_merchant_networks_desc: "Армянские и греческие купеческие общины, которые управляли торговлей шелком в Гилане, соединяя Каспий с европейскими и османскими рынками." #NT!
 nd_kry_safavid_integration: "Интеграция Сефевидов" #NT!
 nd_kry_safavid_integration_desc: "Преобразование Гилана под властью Сефевидов, когда шах Аббас I реорганизовал провинцию, чтобы максимизировать доходы от шелка для имперской казны." #NT!
 nd_kry_state_silk_monopoly: "Государственная шелковая монополия" #NT!
 nd_kry_state_silk_monopoly_desc: "Прямой контроль Сефевидской торговли над торговлей шелком в Гиляне, передача экспорта через армянских купцов для максимизации королевских доходов.\n\n#italic Доступно в: $nd_kry_bazaar_rasht$#!" #NT!
 nd_kry_tofangchi_tradition: "Традиция Тофанчи" #NT!
 nd_kry_tofangchi_tradition_desc: "Мушкетеры тофангчи Гилани, набранные из тех же горных общин, которые когда-то производили воинов-дайламитов, владеющих копьями." #NT!
 nd_kry_chaykhaneh_culture: "Культура Чайхане" #NT!
 nd_kry_chaykhaneh_culture_desc: "Внедрение выращивания чая во влажном климате Гилана и распространение чайных домов как центров социальной и интеллектуальной жизни." #NT!
 nd_kry_fortress_modernization: "Модернизация крепости" #NT!
 nd_kry_fortress_modernization_desc: "Модернизация древних горных крепостей Гилана современным огнестрельным оружием и улучшенными гарнизонными сооружениями.\n\n#italic Доступно в: $nd_kry_qaleh_rudkhan$#!" #NT!
 nd_kry_rasht_expansion: "Раштское расширение" #NT!
 nd_kry_rasht_expansion_desc: "Рост Решта в доминирующий городской центр Гилана, его население увеличивается за счет работников шелководства, торговцев и администраторов." #NT!
 nd_kry_modern_sericulture: "Современное шелководство" #NT!
 nd_kry_modern_sericulture_desc: "Модернизация шелковой промышленности Гилана с использованием улучшенных методов селекции и механизированных ткацких станков." #NT!
 nd_kry_caspian_fleet: "Каспийский флот" #NT!
 nd_kry_caspian_fleet_desc: "Модернизированные военно-морские силы, способные проецировать мощь Гилани через Каспийское море." #NT!
 nd_kry_provincial_governance: "Провинциальное управление" #NT!
 nd_kry_provincial_governance_desc: "Централизованное управление разнообразной экономической деятельностью Гилана, от производства шелка до выращивания риса и рыболовства на Каспии." #NT!
 nd_kry_rice_fish_economy: "Рисовая и рыбная экономика" #NT!
 nd_kry_rice_fish_economy_desc: "Диверсифицированная продовольственная экономика Гиляна, сочетающая орошаемые рисовые поля с богатыми рыбными запасами Каспийского моря.\n\n#italic Доступно в: $nd_kry_shilat_khaneh$#!" #NT!
 nd_kry_mountain_warfare: "Горная война" #NT!
 nd_kry_mountain_warfare_desc: "Совершенная тактика ведения боя в лесистых горах Альборза, сочетающая традиционные методы дайламитов с современной дисциплиной." #NT!
 nd_kry_zaydi_scholarship: "Стипендия Зайди" #NT!
 nd_kry_zaydi_scholarship_desc: "Непреходящие научные традиции зайдитской общины Гилана, вносящие вклад в исламскую юриспруденцию и философию.\n\n#italic Доступно в: $nd_kry_madrasa_lahijan$#!" #NT!
 nd_kry_industrial_silk: "Производство промышленного шелка" #NT!
 nd_kry_industrial_silk_desc: "Заводская обработка шелка с использованием современных технологий для удовлетворения растущего мирового спроса на персидский шелковый текстиль.\n\n#italic Доступно в: $nd_kry_chaykhaneh$#!" #NT!
 nd_kry_anzali_modern_port: "Современный порт Энзели" #NT!
 nd_kry_anzali_modern_port_desc: "Преобразование Бандар-э-Анзали в современный портовый комплекс, обслуживающий основную часть торговли по Каспийскому морю." #NT!
 nd_kry_gilani_constitutionalism: "Гилани Конституционализм" #NT!
 nd_kry_gilani_constitutionalism_desc: "Традиция независимого управления Гиляна находит новое выражение в конституционном движении, поскольку торговцы и ученые выступают за представительные институты." #NT!
 nd_kry_enlightened_province: "Просвещенная провинция" #NT!
 nd_kry_enlightened_province_desc: "Расцвет мысли Просвещения в Гиляне, питаемый давними традициями провинции интеллектуальной толерантности и зайдитского рационализма." #NT!
 nd_kry_gilani_identity: "Гилани Айдентика" #NT!
 nd_kry_gilani_identity_desc: "Зрелое национальное сознание, выкованное из военного наследия дайламитов, религиозной идентичности зайди, языковых особенностей гилаки и столетий процветания, финансируемого шелком." #NT!
 nd_kry_economic_diversification: "Экономическая диверсификация" #NT!
 nd_kry_economic_diversification_desc: "Расширение экономики Гилана за пределы шелка в сторону чая, риса, рыболовства и производства, повышение устойчивости к упадку любого отдельного товара." #NT!
 a_nd_kry_zupin_thrower: "Зупин Метатели" #NT!
 a_nd_kry_zupin_thrower_desc: "Элитные застрельщики с копьем, вооруженные двузубым зупином, фирменным оружием воинов-дайламитов. Быстрые и смертоносные на расстоянии, они беспокоят вражеские формирования до того, как стена щитов сомкнется." #NT!
 a_nd_kry_daylami_shieldwall: "Стена из дайламита" #NT!
 a_nd_kry_daylami_shieldwall_desc: "Тяжелая пехота, обученная древнему дайламитскому искусству создания стены щитов. Вооруженные высокими раскрашенными щитами, боевыми топорами и дротиками-зупинами, они образуют непроницаемую оборонительную линию в горной местности." #NT!
 n_nd_kry_caspian_dhow: "Каспийское доу" #NT!
 n_nd_kry_caspian_dhow_desc: "Прочное торговое судно, предназначенное для Каспийского моря и перевозящее тюки гиланского шелка из Анзали в порты России, Кавказа и Трансоксианы." #NT!
 a_nd_kry_mountain_raider: "Гилани Горный Рейдер" #NT!
 a_nd_kry_mountain_raider_desc: "Легкая кавалерия из лесистых горных долин Гилана, опытная в быстрых фланговых атаках на местности, которая могла бы остановить более тяжелую всадницу. Они жертвуют прочностью брони ради скорости и маневренности." #NT!
 a_nd_kry_tofangchi_gilani: "Тофангчи-йе Гилани" #NT!
 a_nd_kry_tofangchi_gilani_desc: "Мушкетеры Гилани набраны из горных общин Альборза. Унаследовав традиции дисциплинированной пехоты дайламитов, они владеют огнестрельным оружием с тем же упорством, которое их предки привили зупинам." #NT!
 n_nd_kry_caspian_war_galley: "Каспийская военная галера" #NT!
 n_nd_kry_caspian_war_galley_desc: "Вооруженная галера, предназначенная для действий в закрытых водах Каспийского моря, с усиленным корпусом и более тяжелым вооружением, чем стандартные торговые галеры." #NT!
 nd_kry_abrisham_khaneh: "Абришам Хане" #NT!
 nd_kry_abrisham_khaneh_desc: "Шелковая мастерская, где опытные мастера выращивают тутовых шелкопрядов на листьях тутового дерева и ткут из нитей прекрасные ткани. Шелковые мастерские Гилана являются основой его легендарной экспортной торговли." #NT!
 nd_kry_qaleh_rudkhan: "Калех Рудхан" #NT!
 nd_kry_qaleh_rudkhan_desc: "Горная крепость, расположенная среди густых лесов хребта Альборз, контролирующая перевалы, ведущие в сердце Гилана. Эти крепости с древних времен защищали независимость провинции." #NT!
 nd_kry_bazaar_rasht: "Базар-э-Рашт" #NT!
 nd_kry_bazaar_rasht_desc: "Большой крытый рынок Рашта, где сходятся торговцы шелком, торговцы рисом и каспийские рыбаки. Армянские и греческие торговцы имеют здесь постоянные штаб-квартиры, соединяя Гилян с мировыми рынками." #NT!
 nd_kry_madrasa_lahijan: "Медресе-йе Лахиджан" #NT!
 nd_kry_madrasa_lahijan_desc: "Центр зайдитской шиитской стипендии в столице Каркии Лахиджане, где преподают юриспруденцию, теологию и науки под патронажем духовенства." #NT!
 nd_kry_chaykhaneh: "Чайхане" #NT!
 nd_kry_chaykhaneh_desc: "Традиционный чайный дом Гилани, служащий местом сбора торговцев, ученых и простых людей. Эти социальные институты способствуют культурному единству и местному процветанию." #NT!
 nd_kry_shilat_khaneh: "Шилат-хане" #NT!
 nd_kry_shilat_khaneh_desc: "Каспийский рыбопромысловый комплекс, занимающийся добычей осетровых, сиговых и других видов рыбы в богатых водах у побережья Гилана." #NT!
 nd_kry_silk_weaving: "Шелковое Ткачество" #NT!
 nd_kry_silk_weaving_desc: "Ткут тонкую ткань из сырой шелковой нити, используя красители и методы, отточенные поколениями мастеров Гилани." #NT!
 nd_kry_advanced_silk_processing: "Передовая обработка шелка" #NT!
 nd_kry_advanced_silk_processing_desc: "Передовые технологии крашения и ткачества превращают большее количество сырого шелка в роскошные тонкие ткани, ценимые во всем персидском мире." #NT!
 nd_kry_fortress_upkeep: "Крепостной гарнизон" #NT!
 nd_kry_fortress_upkeep_desc: "Постоянный гарнизон и содержание горной крепости, требующий камня для ремонта и оружия для защитников." #NT!
 nd_kry_modernized_garrison: "Модернизированный гарнизон" #NT!
 nd_kry_modernized_garrison_desc: "Модернизированный гарнизон крепости, оснащенный наряду с традиционным вооружением огнестрельным оружием, отражает трансформацию ведения боевых действий в горах." #NT!
 nd_kry_caspian_trade_goods: "Каспийские торговые товары" #NT!
 nd_kry_caspian_trade_goods_desc: "Поток риса и шелка через базар Рашта, соединяющий сельскохозяйственные богатства Гилана с торговыми сетями всего мира." #NT!
 nd_kry_expanded_caravanserai: "Расширенный Караван-сарай" #NT!
 nd_kry_expanded_caravanserai_desc: "Расширение торговых операций по торговле рисом, шелком и новым чаем, что отражает растущее коммерческое значение Гилана под патронажем государства." #NT!
 nd_kry_zaydi_teaching: "Обучение Зайди" #NT!
 nd_kry_zaydi_teaching_desc: "Научная программа медресе Лахиджана, готовящая юристов, теологов и администраторов, обученных в традиции Зайди." #NT!
 nd_kry_sturgeon_fishing: "Осетровая рыбалка" #NT!
 nd_kry_sturgeon_fishing_desc: "Специализированные рыболовные операции по добыче ценного осетра Каспия. Соль необходима для сохранения улова для транспортировки на отдаленные рынки." #NT!
 nd_kry_tea_service: "Чайный сервиз" #NT!
 nd_kry_tea_service_desc: "Чайный сервиз чайхане, в котором потребляют импортный чай и керамику местного производства, чтобы создать место сбора, объединяющее общины." #NT!
 levy_nd_kry_daylami_shieldwall: "Налог на стену из дайламитового щита" #NT!
 levy_nd_kry_daylami_shieldwall_desc: "Жители горных деревень тренировались в построении древней стены щитов, призванных защищать перевалы Гилана во время войны." #NT!
 nd_kry_formed_tt: "Гилан был основан" #NT!
 nd_kry_path_a_tt: "Выбрал горную стену Дайламитов" #NT!
 nd_kry_path_b_tt: "Выбрали Шелковый путь Каспия" #NT!
 nd_kry_destiny: "Судьба Гилана" #NT!
 nd_kry_destiny_desc: "После завершения формирования Гилана его ждет великая судьба. Стабилизируйте новое государство и выберите путь, который определит его будущее." #NT!
 nd_kry_dest_alborz_dominion: "Альборз Доминион" #NT!
 nd_kry_dest_alborz_dominion_desc: "Обеспечьте безопасность побережья Каспийского моря от Табаристана до Горгана. Воины Дайламита, которые когда-то шли с этих гор, чтобы завоевать Багдад, снова поднимутся под знамена Гилани." #NT!
 nd_kry_dest_persian_bulwark: "Персидский оплот" #NT!
 nd_kry_dest_persian_bulwark_desc: "Захватите Тебриз и Ардебиль, великие города Азербайджана. Благодаря этим опорным пунктам Гилян контролирует горные перевалы между Каспийским морем и сердцем Персии." #NT!
 nd_kry_dest_daylami_imperium: "Дайлами Империум" #NT!
 nd_kry_dest_daylami_imperium_desc: "От Исфахана до Дербента будет править новая династия Буидов. Займите трон Персии и удерживайте ворота Кавказа, завершив то, что начали амиры Дайламита тысячу лет назад." #NT!
 nd_kry_dest_silk_crossroads: "Шелковый перекрёсток" #NT!
 nd_kry_dest_silk_crossroads_desc: "Захватите Казвин и Солтанию, великий перекресток, где караваны с шелком из Гилана встречаются с персидскими купцами. Контролируйте внутренние маршруты, и богатство придет." #NT!
 nd_kry_dest_caspian_emporium: "Каспийский Эмпориум" #NT!
 nd_kry_dest_caspian_emporium_desc: "Сделать Гилян бесспорным центром каспийской торговли. Обеспечить потоки шелка через рынок капитала и привлечь банковские учреждения, которые будут финансировать торговую империю." #NT!
 nd_kry_dest_golden_thread: "Золотая нить" #NT!
 nd_kry_dest_golden_thread_desc: "Продлить шелковый путь от Каспийского моря до Персидского залива. Имея в руках Ормуз и охваченную глобальную торговлю, купцы Гилани свяжут два моря вместе паутиной золотой нити." #NT!
 nd_kry.5.t: "Судьба Гилана" #NT!
 nd_kry.5.d: "Зеленое знамя Гилана реет над единым королевством. Туманные леса Альборза, тутовые рощи низин, оживленные пристани Анзали: все они подчиняются одной власти впервые за многие поколения. Но формирование – это только начало. Мир за этими горами огромен, и Гилян должен найти в нем свою цель. Будем ли мы смотреть внутрь себя, укрепляя горные перевалы, которые защищали нашу независимость, или наружу, следуя за шелковыми нитями, которые соединяют наши ткацкие станки со всеми уголками земли?" #NT!
 nd_kry.5.a: "Судьба Гилана начинается сегодня." #NT!
 nd_kry.6.t: "Доминион Альборз" #NT!
 nd_kry.6.d: "Солдаты Гилани стоят на страже Табаристана и Горгана. Под нашей защитой находится весь южный берег Каспийского моря, от болот Сефид-Руда до степной границы у Астарабада. Старый центр Дайламита наконец воссоединился. Наши командиры докладывают, что горные перевалы взяты под контроль и перед нами открыта прибрежная равнина. Вопрос теперь в том, как далеко осмелятся зайти сыновья Дайлама." #NT!
 nd_kry.6.a: "Горы наши. Равнины последуют за нами." #NT!
 nd_kry.7.t: "Оплот Персии" #NT!
 nd_kry.7.d: "Тебриз пал. Жемчужина Азербайджана, резиденция императоров Иль-Ханидов и царей Кара-Коюнлу, теперь подчиняется горным владыкам Гилана. Поскольку Ардебиль (место рождения ордена Сефевидов) также защищен, наше царство находится на границе между Кавказом и Иранским нагорьем. Мы стоим на распутье: будем ли мы продвигаться вперед с той агрессивной силой, которая привела нас сюда, или консолидировать эти с таким трудом завоеванные достижения в несокрушимую оборонительную позицию?" #NT!
 nd_kry.7.a: "Двигайтесь вперед: импульс принадлежит нам." #NT!
 nd_kry.7.b: "Укрепите то, что мы держим: пусть они обрушатся на нас." #NT!
 nd_kry.8.t: "Империя Дайлами" #NT!
 nd_kry.8.d: "Исфахан, половина мира, преклоняет колени перед горной династией. От Кавказских ворот в Дербенте до древней резиденции мидийских царей в Хамадане владения новых буидских амиров превосходят даже владения их прославленных предшественников. Придворные ученые спорят о том, требует ли это достижение агрессивной экспансии в традиции Буидов (марша на Багдад, как это когда-то сделал Ахмад ибн Буя) или терпеливой консолидации горной империи, которая сможет пережить любого соперника." #NT!
 nd_kry.8.a: "Марш наружу: мы — новые Буиды." #NT!
 nd_kry.8.b: "Правило с гор: наше королевство достаточно крепость." #NT!
 nd_kry.9.t: "Шелковый перекресток" #NT!
 nd_kry.9.d: "Караван-сараи Казвина и Солтании теперь окрашены в цвета Гилани. Каждый тюк шелка, покидающий ткацкие станки Рашта и Лахиджана, проходит через нашу территорию на пути к рынкам всего мира. Армянские купцы, которые когда-то вели переговоры с иностранными губернаторами, теперь имеют дело непосредственно с нами. Внутренние торговые пути принадлежат нам, а вместе с ними и рычаги воздействия на торговлю по всей Персии." #NT!
 nd_kry.9.a: "Сейчас перекресток принадлежит Гилану." #NT!
 nd_kry.10.t: "Каспийский торговый центр" #NT!
 nd_kry.10.d: "Шелк проходит через каждый рынок в нашей сфере. Банковские учреждения, которые когда-то обогащали итальянских купцов, теперь обслуживают торговцев Гилани, финансируя предприятия, которые были бы невозможны еще поколение назад. В нашем порту Энзели кипит активность: корабли со всех берегов Каспия конкурируют за то, чтобы купить то, что производят наши ткацкие станки. Вопрос в том, как лучше всего использовать это богатство: будем ли мы инвестировать в вертикальную интеграцию, контролируя каждый этап от шелкопряда до готовой ткани? Или нам следует сосредоточиться на монополизации самих рынков, вытесняя конкурентов исключительно за счет финансовой мощи?" #NT!
 nd_kry.10.a: "Контролируйте производство, от червяка до ткани." #NT!
 nd_kry.10.b: "Контролируйте рынки: прибыль следует за монополией." #NT!
 nd_kry.11.t: "Золотая нить" #NT!
 nd_kry.11.d: "Ормузский пролив, ворота между Персидским заливом и Индийским океаном, находится под властью Гилани. То, что началось в туманных тутовых рощах каспийского побережья, теперь достигает теплых вод Аравийского моря. Два огромных водоема, соединенные нитью из шелка и золота, проходящей через сердце наших владений. Суд обсуждает последствия: некоторые выступают за расширение нашего дипломатического влияния на все уголки торгового мира, в то время как другие видят возможность превратить сам Гилян в центр утонченной культуры и коммерческой мощи." #NT!
 nd_kry.11.a: "Пусть золотая нить протянется по всему миру." #NT!
 nd_kry.11.b: "Пусть богатство преобразит сам Гилян." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_mountain_vanguard: "Горный Авангард" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_mountain_vanguard: "Агрессивная тактика, которая позволила взять Тебриз, теперь определяет нашу военную доктрину. Командиры Гилани с нетерпением ждут сражения, приобретая опыт ценой пренебрежения содержанием укреплений." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_highland_discipline: "Хайлендская дисциплина" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_highland_discipline: "Дисциплинированные гарнизоны перевалов Альборз стали образцом для всей армии. Сокращение затрат и улучшение интеллекта происходят за счет более замкнутого взгляда." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_buyid_restoration: "Восстановление Буида" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_buyid_restoration: "Завоевательный дух первых буидских амиров снова оживает. Наши армии маршируют быстрее, аннексируют более эффективно и с легкостью находят оправдание войне." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_mountain_emperor: "Горный император" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_mountain_emperor: "Горное царство объединено в неприступное государство-крепость. Новые укрепления и лояльные гарнизоны обеспечивают безопасность каждого прохода, хотя сосредоточенность на внутренних вопросах обостряет дипломатические отношения." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_silk_factor: "Шелковый Фактор" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_silk_factor: "Купцы Гилани контролируют каждый этап производства и торговли шелком. Влияние купцов растет, подданные интегрируются быстрее, а класс бюргеров процветает в условиях нового коммерческого порядка." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_caspian_monopolist: "Каспийский Монополист" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_caspian_monopolist: "Финансовые учреждения служат коммерческим интересам Гилани, снижая стоимость займов, расширяя налоговую базу для бюргеров и сохраняя содержание всех поместий за счет общего процветания." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_thread_of_empires: "Нить Империй" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_thread_of_empires: "Торговые сети Гилани простираются от Каспия до Индийского океана. Дипломатический охват и доходы от экспорта растут, хотя разрастающаяся коммерческая империя напрягает армию." #NT!
 STATIC_MODIFIER_NAME_nd_kry_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_kry_dest_merchant_princes: "Шелковое богатство Гилана превращает провинцию в центр городского развития и усовершенствованного управления. Судебные расходы сокращаются, а затраты на строительство падают по мере притока торгового капитала в каждый проект." #NT!
 nd_kry_daylami_citadel: "Цитадель Дайлами" #NT!
 nd_kry_daylami_citadel_desc: "Величественная горная крепость в традициях Дайламита, сочетающая в себе древнюю оборонительную архитектуру и современную военную технику. Его гарнизон контролирует окружающие перевалы и служит символом возрождающейся военной традиции Дайлами." #NT!
 nd_kry_silk_bourse: "Шелковая биржа" #NT!
 nd_kry_silk_bourse_desc: "Грандиозная коммерческая биржа, на которой торговцы шелком из Гилани, армянские посредники и иностранные покупатели сходятся для переговоров по контрактам и установления цен. Биржа концентрирует рыночную информацию и финансовые инструменты, что делает Гилян центром международной торговли шелком." #NT!
 nd_kry_citadel_garrison: "Цитадель Гарнизон" #NT!
 nd_kry_citadel_garrison_desc: "Постоянный гарнизон цитадели Дайлами, снабженный камнем для укреплений и оружием для ее защитников." #NT!
 nd_kry_bourse_operations: "Биржевые операции" #NT!
 nd_kry_bourse_operations_desc: "Ежедневная деятельность шелковой биржи, потребляющая бумагу для контрактов и отчетов, ткань для образцов и выставок, а также тонкую ткань в качестве торгуемого товара." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_kry_bureaucracy_authority: "Бюрократический орган Гилани" #NT!
 AUTO_MODIFIER_DESC_nd_kry_bureaucracy_authority: "Воссозданное ханство Гилян осуществляет полную административную власть над своей провинцией, предоставляя доступ к историческим институтам Прикаспийской Персии." #NT!
 kry_karkiya_sayyid_rule_bureaucracy: "Правило Каркия Сайида" #NT!
 kry_karkiya_sayyid_rule_bureaucracy_desc: "С 1370 года династия Сайид Каркия из Лахиджана правила Биапишом как потомственные шиитские лорды-двунадесятники, заявлявшие о своем происхождении от хасанидов через Пророка, сочетая династическую легитимность с религиозной властью за целое столетие до обращения Сефевидов в Иран. Султан-Али Мирза, как известно, приютил молодого Исмаила в Лахиджане в 1490-х годах. Каждый контракт и военное поручение проходило через дом, чья кровь освятила его; при сохранении королевства приобретает дисциплину священного королевства, но пренебрежение позволяет улемам затмить трон и оттолкнуть светскую аристократию." #NT!
 kry_biapas_biapish_diwan_bureaucracy: "Биапас-Биапиш Диван" #NT!
 kry_biapas_biapish_diwan_bureaucracy_desc: "Гилян был конституционно разделен на Биапиш (к востоку от Сефидруда, управляемый из Лахиджана Каркией) и Биапас (к западу, управляемый из Фумана, а затем и Рашта Исхаквандом и хазараспидскими эмирами Амира Дубая). Каждая половина сохраняла свой диван, свой контингент и свои обычаи правления, а вопросы, возникающие между юрисдикциями, решались на совместной конференции. Договор о двойном ханстве сохранил местную автономию от внешнего завоевания, но ценой навсегда разделенной короны, а правители Сефевидов после 1592 года унаследовали провинцию, которая все еще говорила двумя голосами." #NT!
 kry_sefidrud_rice_cadaster_bureaucracy: "Сефидруд Рисовый кадастр" #NT!
 kry_sefidrud_rice_cadaster_bureaucracy_desc: "Реестр земельных и водных ресурсов рисовых полей дельты Сефидруд, обследованный в джирибах и снабженный аннотациями о правах на ирригацию вдоль каналов и плотин, питающих каждый участок. Каждый сезон обновляемый старейшинами деревень кадхуда, подчинявшимися Рашту и Лахиджану, кадастр фиксировал дань риса, причитающуюся каждой деревне, и ставки издольщины между землевладельцем и земледельцем. Излишки влажного риса в Гилане снабжали Каспийское побережье от Тебриза до Астрахани; когда реестр пришел в упадок, помещики конфисковали права на воду вверх по течению, а крестьяне ниже них умерли от голода." #NT!
 kry_royal_silk_customs_bureaucracy: "Королевская шелковая таможня" #NT!
 kry_royal_silk_customs_bureaucracy_desc: "При шахе Аббасе I (годы правления 1588-1629) трон Сефевидов сделал Гилян ведущей в мире провинцией по производству сырого шелка, учредив королевские факторы в Раште и Бандар-э-Анзали, которые покупали весь провинциальный урожай шелка по фиксированной цене, а затем перепродавали его армянским купцам Джульфана и российским факторам за твердое серебро под запечатанными таможенными реестрами. Эта система обогатила корону и ее торговых посредников, передав большую часть излишков земледельцев государству, и связала Гилян с дальними торговыми сетями Каспийского и Средиземноморья на два столетия." #NT!
