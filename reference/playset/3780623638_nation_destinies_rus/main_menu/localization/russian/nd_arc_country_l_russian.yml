l_russian:
 ARC: "Киликийская Армения" #NT!
 ARC_ADJ: "Киликийский Армянский" #NT!
 ARC_f: "Киликийская Армения" #NT!
 ARC_f_desc: "Восстановите Армянское королевство Киликия под короной Хетумидов, средиземноморское царство, которое на протяжении двух столетий соединяло апостольский христианский мир и мир латинских крестоносцев из своей столицы в Сис. Там, где горная Багратидская Армения смотрит на восток, на Кавказ, Киликийская Армения обращена к морю: королевство торговых портов, итальянских торговых концессий и рыцарей в восточных сюрко. Создайте армянскую талассократию на побережье Леванта, овладейте Кипром и маршрутами пряностей и докажите, что королевство, разрушенное мамлюками в 1375 году, еще могло их пережить." #NT!
