l_russian:
 STATIC_MODIFIER_NAME_nd_sword_and_cross: "Меч и Крест" #NT!
 STATIC_MODIFIER_DESC_nd_sword_and_cross: "Ливонское государство родилось из столкновения стали и пыла веры. Немецкие крестоносцы вырезали христианское царство из языческой пустыни, воздвигнув крест над каждым замком и собором от Риги до Ревеля. Конные рыцари Ордена и фанатичная преданность обращению народов Балтии определяют нашу национальную цель." #NT!
 STATIC_MODIFIER_NAME_nd_baltic_emporium: "Балтийский торговый центр" #NT!
 STATIC_MODIFIER_DESC_nd_baltic_emporium: "Рига, Дерпт и Ревель — не просто крепости: это великие склады северного мира. Янтарь, древесина, меха и зерно стекают по Даугаве и Двине в наши гавани, где ганзейские купцы взвешивают их с тканью, солью и серебром, прибывшими с запада. Богатство Прибалтики течет через руки Ливонии." #NT!
 STATIC_MODIFIER_NAME_nd_livonian_reformation: "Ливонская Реформация" #NT!
 STATIC_MODIFIER_DESC_nd_livonian_reformation: "Ливония была одной из первых земель за пределами Империи, принявших учение Лютера. Старый религиозный порядок распадается по мере того, как новые идеи укореняются в рижских типографиях и лекционных залах." #NT!
 STATIC_MODIFIER_NAME_nd_riga_iconoclasm: "Рижское иконоборчество" #NT!
 STATIC_MODIFIER_DESC_nd_riga_iconoclasm: "Реформаторы пронеслись по рижским церквям с молотком и факелом, разбивая иконы, закрывая монастыри и конфисковывая церковное имущество. Старый порядок разрушен на корню: насильственное очищение, не оставляющее места прошлому." #NT!
 STATIC_MODIFIER_NAME_nd_courland_ambition: "Амбиции Курляндии" #NT!
 STATIC_MODIFIER_DESC_nd_courland_ambition: "С верфей Виндау и Либавы поднимается флот, который понесет курляндский флаг к дальним берегам. Форт Джейкоб в Гамбии и Новая Курляндия на Тобаго ждут: самое маленькое государство Европы осмелится построить колониальную империю." #NT!
 STATIC_MODIFIER_NAME_nd_courland_caution: "Курляндская предусмотрительность" #NT!
 STATIC_MODIFIER_DESC_nd_courland_caution: "Флот герцогства лучше использовать для защиты наших балтийских торговых путей и обогащения наших гаваней, чем для погони за далекими колониальными мечтами. Пусть другие тратят свои сокровища на тропическую лихорадку. Мы разбогатеем дома." #NT!
 nd_liv.1.t: "Рождение Ливонии" #NT!
 nd_liv.1.d: "Крестоносцы подняли свое знамя над Балтикой. От каменных стен Риги до лесных замков Дерпта — на восточном берегу Балтийского моря формируется новое христианское царство. Но за душу этой молодой нации борются два видения. Рыцари Ордена видят в Ливонии бастион воинствующего христианства: границу, где меч служит кресту, где каждый завоеванный акр приводит ко Христу еще одну языческую душу. Купцы Риги и ганзейских городов видят нечто иное: ворота к богатствам Востока, где янтарь, древесина и меха текут на запад, а серебро течет обратно. Какое видение возобладает?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_liv.1.a: "Мечом и крестом мы удержим эту землю." #NT!
 nd_liv.1.b: "Счетная палата служит Богу так же, как и часовня." #NT!
 nd_liv.2.t: "Реформация дошла до Ливонии" #NT!
 nd_liv.2.d: "В 1521 году Андреас Кнопкен вернулся из Германии с учением Лютера в церквях Риги. За три года Реформация охватила все крупные города Ливонии: Ригу, Ревель, Дерпт. Мельхиор Хоффманн произносит пламенные проповеди в Вольмаре, и толпы людей собираются, чтобы услышать новое Евангелие. Рижская дума запретила службы в соборе, конфисковала церковное имущество и закрыла монастыри. Некоторые реформаторы призывают к размеренному принятию новой веры; другие требуют уничтожения каждой иконы и алтаря, напоминающих о старом порядке. В ноябре 1524 года толпы иконоборцев штурмовали церкви. Направим ли мы эту ярость или сдержим ее?" #NT!
 nd_liv.2.a: "Пусть реформа осуществляется посредством разума и закона." #NT!
 nd_liv.2.b: "Свергните идолов; Очисти веру огнем." #NT!
 nd_liv.3.t: "Ландтаг Прогулки" #NT!
 nd_liv.3.d: "4 декабря 1435 года собрание сословий Ливонии собралось в городе Валк, чтобы подписать договор о Ливонском союзе. На этом документе свои печати поставили архиепископ Рижский, епископы Курляндский, Дерптский и Эзель-Викский, представители Ливонского ордена и вассалы этой страны. Ливонский сейм, Ландтаг, представляет собой форум, на котором конкурирующие интересы Ордена, Церкви и городов могут быть примирены без кровопролития. Это несовершенный компромисс, но он объединяет эту раздробленную конфедерацию в нечто, напоминающее государство." #NT!
 nd_liv.3.a: "Пусть Ландтаг сохранит наше единство." #NT!
 nd_liv.4.t: "Колониальные амбиции Курляндии" #NT!
 nd_liv.4.d: "Герцог Якоб Кеттлер превратил сонное Курляндское герцогство в морскую державу. С верфей Виндау был спущен на воду флот из более чем сорока военных кораблей, оснащенных более чем четырнадцатью сотнями пушек. В 1651 году курляндские войска построили форт Джейкоб на реке Гамбия. В 1654 году двухпалубный военный корабль «Ваппен дер Герцогин» отплыл на Тобаго со 124 солдатами и восемьюдесятью семьями колонистов, основав Новую Курляндию. Это крошечное герцогство, насчитывающее всего лишь пятьдесят тысяч душ, теперь развевает свой флаг на двух континентах. Но мечта хрупка. Швеция угрожает войной, а колониальные предприятия истощают казну. Должны ли мы двигаться вперед или консолидировать то, что имеем?" #NT!
 nd_liv.4.a: "Моря пронесут курляндский флаг до каждого берега." #NT!
 nd_liv.4.b: "Наше богатство – в Прибалтике, а не в тропических лихорадках." #NT!
 nd_liv.5.t: "Битва при Сауле" #NT!
 nd_liv.5.d: "В 1236 году ливонские меченосцы двинулись на юг против жемайтийцев и земгалов. При Сауле языческие воины устроили засаду на колонну крестоносцев на труднопроходимой местности. Поражение было катастрофическим: пали магистр ордена и пятьдесят рыцарей. Папа распустил Братьев Меча, а выжившие объединились с Тевтонским орденом, образовав Ливонский филиал. В результате этой катастрофы возник более жесткий и дисциплинированный военный порядок, который будет удерживать границу Балтийского моря еще три столетия." #NT!
 nd_liv.5.a: "Из поражений мы выковываем более сильный клинок." #NT!
 nd_liv_battle_of_saule: "Швертбрюдер" #NT!
 nd_liv_battle_of_saule_desc: "Ливонские меченосцы, Швертбрюдеры, были первоначальным крестоносным орденом Прибалтики, основанным в 1202 году. Их поражение при Сауле в 1236 году привело к их присоединению к Тевтонскому ордену, но их фанатичный дух продолжает жить в Ливонских военных традициях." #NT!
 nd_liv_ordensburg_tradition: "Орденсбургская традиция" #NT!
 nd_liv_ordensburg_tradition_desc: "Ливонский орден построил более 150 каменных замков по всему Прибалтике: массивные Орденсбургены, которые служили военными базами, административными центрами и символами немецкого владычества над завоеванными землями." #NT!
 nd_liv_amber_trade: "Балтийский янтарь" #NT!
 nd_liv_amber_trade_desc: "На берегах восточной Балтики добывается лучший в Европе янтарь: окаменевшая древесная смола, которая с древности ценилась для ювелирных изделий, медицины и торговли. Ливонские купцы контролируют обработку и вывоз этого золотого сокровища." #NT!
 nd_liv_terra_mariana: "Терра Мариана" #NT!
 nd_liv_terra_mariana_desc: "Земля Девы Марии: название, данное Папой Иннокентием III территориям крестоносцев в Ливонии. Религиозная миссия по обращению балтийских язычников является моральной основой Ливонского государства." #NT!
 nd_liv_wax_trade: "Торговля Ливонским воском" #NT!
 nd_liv_wax_trade_desc: "Пчелиный воск из обширных лесов Ливонии незаменим для церквей и дворов Западной Европы. Ливонские купцы ежегодно отправляют тысячи тонн: свечи христианского мира горят балтийским огнем.\n\n#italic Доступно в: $nd_liv_bernsteinkammer$#!" #NT!
 nd_liv_hanseatic_kontor: "Ганзейский Конторе" #NT!
 nd_liv_hanseatic_kontor_desc: "Рига присоединилась к Ганзейскому союзу в 1282 году, основав торговые посты Конторе, которые связали Балтику с великими торговыми сетями Северной Европы. Эти склады и купеческие дома являются двигателями процветания Ливонии." #NT!
 nd_liv_domschule_tradition: "Соборные школы" #NT!
 nd_liv_domschule_tradition_desc: "Епископы Ливонии основали соборные школы в Риге, Дерпте и Ревеле: первые высшие учебные заведения в Прибалтике. Немецкая стипендия, латинская грамота и теологическое образование перетекли из этих школ в более широкое общество." #NT!
 nd_liv_landtag: "Ландтаг Прогулки" #NT!
 nd_liv_landtag_desc: "Ливонский сейм, подписанный в Уолке в 1435 году, создал управляющее собрание неспокойной конфедерации. Представители Ордена, епископов, городов и вассалов встречаются, чтобы разрешать споры и координировать оборону." #NT!
 nd_liv_baltic_timber: "Балтийская лесная торговля" #NT!
 nd_liv_baltic_timber_desc: "Обширные сосновые и дубовые леса Ливонии производят древесину, деготь и смолу для верфей Европы. Плоты бревен плывут по Даугаве в Ригу, где их обрабатывают и отправляют в Англию, Голландию и другие страны.\n\n#italic Доступно в: $nd_liv_kontor$#!" #NT!
 nd_liv_flax_industry: "Ливонский лен" #NT!
 nd_liv_flax_industry_desc: "Из ливонского льна прядут полотна исключительного качества, которые экспортируются через Ригу и Ревель на рынки Северной Европы. Льняные поля Латвии и Эстонии обеспечивают процветающую текстильную промышленность.\n\n#italic Доступно в: $nd_liv_kontor$#!" #NT!
 nd_liv_riga_stadtrecht: "Рижский Штадтрехт" #NT!
 nd_liv_riga_stadtrecht_desc: "Городской закон Гамбурга, принятый Ригой, регулирует торговлю, собственность и общественную жизнь. В рамках этой правовой базы рижские горожане пользуются привилегиями, которые привлекают торговцев и ремесленников со всего немецкоязычного мира." #NT!
 nd_liv_reformation: "Ливонская Реформация" #NT!
 nd_liv_reformation_desc: "Ливония была первой территорией за пределами Священной Римской империи, принявшей Реформацию. С 1521 года идеи Лютера быстро распространились по Риге, Ревелю и Дерпту, преобразовав религиозный ландшафт Прибалтики." #NT!
 nd_liv_landknechte_tradition: "Ливонский ландкнехт" #NT!
 nd_liv_landknechte_tradition_desc: "Немецкая стрелково-стрелковая пехота, адаптированная к войне на Балтике: обученная сражаться в лесах и болотах восточной границы, где не может действовать тяжелая кавалерия." #NT!
 nd_liv_grain_exports: "Балтийская зерновая торговля" #NT!
 nd_liv_grain_exports_desc: "Ливонское зерно (рожь, пшеница и ячмень) кормит растущие города Западной Европы. Рижские зернохранилища являются житницей Прибалтики, направляя урожай из глубинки на голодные зарубежные рынки." #NT!
 nd_liv_buffer_state: "Между тремя коронами" #NT!
 nd_liv_buffer_state_desc: "Ливония находится на перекрестке российских, польско-литовских и шведских амбиций. Выживание требует дипломатической ловкости, натравливания каждой державы на другую, выигрыша времени с помощью договоров и поддержания шаткой независимости." #NT!
 nd_liv_castle_network: "Сеть каменных замков" #NT!
 nd_liv_castle_network_desc: "Более 150 каменных замков и укрепленных усадеб усеивают ландшафт Ливонии: от огромного рыцарского Орденсбургена до епископских дворцов епископов. Эта сеть крепостей является основой обороны Балтии." #NT!
 nd_liv_fur_trade: "Ливонская меховая торговля" #NT!
 nd_liv_fur_trade_desc: "В лесах Ливонии добывают шкурки бобра, куницы, лисицы и белки, которые ценятся при дворах и на рынках Европы. Ливонские купцы доминируют в торговле мехом от внутренних районов Риги до гаваней Ревеля.\n\n#italic Доступно в: $nd_liv_kontor$#!" #NT!
 nd_liv_hakenschutzen_tradition: "Хакеншютцен" #NT!
 nd_liv_hakenschutzen_tradition_desc: "Крюковое ружье Hakenbüchse — основной элемент обороны Ливонской крепости. Положив тяжелый ствол на настенный крюк, эти артиллеристы ведут точный огонь с крепостных валов и полевых укреплений." #NT!
 nd_liv_reiter_tradition: "Ливонские рейтеры" #NT!
 nd_liv_reiter_tradition_desc: "Традиция конных пистолетчиков восходит к тяжелой кавалерии Ордена. Вооруженные пистолетами с колесным замком и обученные в караколе, эти рейтеры сочетают в себе ливонское искусство верховой езды и современную огневую мощь." #NT!
 nd_liv_secularization: "Секуляризация" #NT!
 nd_liv_secularization_desc: "Превращение крестоносного военного ордена в светское герцогство: конец монашеского правления и начало княжеского правления. При Готхарде Кеттлере последний магистр стал первым герцогом." #NT!
 nd_liv_grain_staple: "Рижская зерновая компания" #NT!
 nd_liv_grain_staple_desc: "Основное право Риги требует, чтобы все зерно, проходящее через город, перед экспортом выставлялось на продажу на рынке. Эта монополия обогащает горожан и наполняет герцогскую казну." #NT!
 nd_liv_privilegium: "Ливонская привилегия" #NT!
 nd_liv_privilegium_desc: "Права и привилегии балтийско-немецкого дворянства, Ritterschaften, являются основой ливонского управления. В обмен на военную службу и административную лояльность дворяне пользуются широкой автономией в своих владениях." #NT!
 nd_liv_urban_fortification: "Современные укрепления" #NT!
 nd_liv_urban_fortification_desc: "Появление пороховой войны требует новой оборонительной архитектуры. Бастионные стены, угловые равелины и земляные валы заменяют средневековые башни, превращая ливонские города в современные крепости." #NT!
 nd_liv_courland_navy: "Курляндский флот" #NT!
 nd_liv_courland_navy_desc: "Герцог Якоб Кеттлер построил флот из более чем сорока военных кораблей на верфях Виндау и Либавы. Этот замечательный флот (с более чем 1400 пушками) нес курляндский флаг в колонии на реке Гамбия и на Тобаго." #NT!
 nd_liv_kettler_manufactures: "Производство Кеттлера" #NT!
 nd_liv_kettler_manufactures_desc: "При герцоге Якобе Кеттлере Курляндия стала промышленным центром. Металлургические заводы, лесопилки, смолокуренные заводы и канатные дороги возникли по всему герцогству: протоиндустриальная революция на берегу Балтийского моря." #NT!
 nd_liv_colonial_ventures: "Колониальные предприятия" #NT!
 nd_liv_colonial_ventures_desc: "Крошечное Курляндское герцогство, насчитывавшее всего пятьдесят тысяч душ, осмелилось построить колониальную империю. Форт Джейкоб в Гамбии и Новая Курляндия на Тобаго были невероятными аванпостами балтийских амбиций в тропиках.\n\n#italic Доступно в: $nd_liv_windau_werft$#!" #NT!
 nd_liv_amber_route: "Янтарная дорога" #NT!
 nd_liv_amber_route_desc: "Древний торговый путь янтаря, протянувшийся от побережья Балтийского моря до Средиземного моря, на протяжении тысячелетий был источником богатства. Под руководством Курляндии обработка и экспорт балтийского янтаря достигают своего апогея." #NT!
 nd_liv_ritterschaften: "Риттершафтен" #NT!
 nd_liv_ritterschaften_desc: "Дворянские корпорации балтийских немцев (Риттершафты Ливонии, Эстонии, Курляндии и Эзеля) управляют провинциями через свои земельные владения. Эта корпоративная аристократия формирует законодательство, налогообложение и администрацию по всей Балтике." #NT!
 nd_liv_courland_gunnery: "Курляндская военно-морская артиллерия" #NT!
 nd_liv_courland_gunnery_desc: "Флот Курляндии превосходил свои силы благодаря качеству морской артиллерии. Герцог Якоб лично курировал производство пушек на Курляндском металлургическом заводе, производя одни из лучших морских орудий на Балтике." #NT!
 nd_liv_baltic_enlightenment: "Балтийское Просвещение" #NT!
 nd_liv_baltic_enlightenment_desc: "Иоганн Готфрид Гердер (философ, теолог и пионер романтического национализма) провел пять лет становления, преподавая в Рижской кафедральной школе. Его идеи о народной культуре и национальной идентичности изменили европейскую мысль." #NT!
 nd_liv_agrarian_reform: "Аграрная реформа" #NT!
 nd_liv_agrarian_reform_desc: "Постепенное освобождение балтийского крестьянства и модернизация сельского хозяйства: от феодальной барщины к бесплатному арендованию. Новые севообороты, дренажные проекты и научное земледелие увеличивают урожайность и численность населения." #NT!
 nd_liv_port_expansion: "Рижский порт" #NT!
 nd_liv_port_expansion_desc: "Рижский порт, контролирующий устье Даугавы, расширяется, чтобы принять растущий объем балтийской торговли. Новые причалы, склады и таможни превращают средневековый порт в современный торговый центр." #NT!
 nd_liv_national_awakening: "Балтийская немецкая идентичность" #NT!
 nd_liv_national_awakening_desc: "Балтийские немцы (потомки крестоносцев, купцов и священнослужителей, построивших Ливонию) развивают особую культурную идентичность. Не чисто немецкие и не чисто балтийские, они представляют собой уникальную цивилизацию, выкованную семью столетиями на границе." #NT!
 nd_liv_modern_military: "Ливонский егерь" #NT!
 nd_liv_modern_military_desc: "Профессиональная легкая пехота современности: быстрые стрелки, сочетающие пограничные традиции Прибалтики с дисциплиной европейской линейной тактики." #NT!
 nd_liv_industrial_timber: "Промышленная древесина" #NT!
 nd_liv_industrial_timber_desc: "Паровые лесопилки преобразуют лесную промышленность стран Балтии. Там, где раньше бревна кропотливо обрабатывались вручную, сегодня механические пилы производят стандартизированные пиломатериалы на экспорт, подпитывая строительный бум индустриальной Европы." #NT!
 a_nd_liv_schwertbruder: "Швертбрюдер" #NT!
 a_nd_liv_schwertbruder_desc: "Братья Меченосцы: фанатичная крестоносная пехота Ливонского ордена. Эти немецкие воины сражаются с ревностной яростью людей, которые верят, что каждая битва ведется ради спасения их душ." #NT!
 a_nd_liv_hakenschutzen: "Хакеншютцен" #NT!
 a_nd_liv_hakenschutzen_desc: "Артиллеристы с крюков: пехота, вооруженная тяжелым оружием типа аркебузы, стреляющим с настенных крюков или переносных упоров. Разрушительные в осадной обороне и укреплённых позициях, они воплощают в себе традицию крепостной войны Ливонии." #NT!
 n_nd_liv_courland_frigate: "Курляндский фрегат" #NT!
 n_nd_liv_courland_frigate_desc: "Быстрый, хорошо вооруженный военный корабль с верфей Виндау. Построенные под личным руководством герцога Джейкоба Кеттлера, эти фрегаты сочетают в себе скорость и огневую мощь: они предназначены для торговых набегов и колониальных экспедиций." #NT!
 a_nd_liv_reiter: "Ливонский рейтер" #NT!
 a_nd_liv_reiter_desc: "Конные пистолетники произошли от кавалерийских традиций Ордена. Вооруженные пистолетами с колесным замком и обученные тактике караколе, эти наездники беспокоят вражеские формирования, прежде чем приблизиться к атаке." #NT!
 a_nd_liv_jager: "Ливонский егерь" #NT!
 a_nd_liv_jager_desc: "Профессиональная легкая пехота, обученная в лесах Балтики: быстрые стрелки, которые используют рельеф местности, тактику засад и меткую стрельбу, чтобы победить противника. Кульминация давних приграничных военных традиций Ливонии." #NT!
 nd_liv_ordensburg: "Орденсбург" #NT!
 nd_liv_ordensburg_desc: "Замок крестоносцев Ливонского ордена: массивное каменное укрепление, объединяющее военный гарнизон, административный центр и часовню. Эти замки доминировали над ландшафтом Балтии на протяжении трех столетий." #NT!
 nd_liv_kontor: "Ганзейский Контор" #NT!
 nd_liv_kontor_desc: "Торговая фактория Ганзейского союза: склад, счетная палата и купеческая резиденция в одном. Через эти Конторе богатства балтийских глубинок перетекают на рынки Северной Европы." #NT!
 nd_liv_domschule: "Домская школа" #NT!
 nd_liv_domschule_desc: "Соборная школа, где немецкие священнослужители преподают латынь, теологию и гуманитарные науки. Эти школы представляют собой интеллектуальную основу ливонской цивилизации, производящую администраторов и духовенство, управляющих Балтией." #NT!
 nd_liv_windau_werft: "Верфь Виндау" #NT!
 nd_liv_windau_werft_desc: "Герцогская верфь в Виндау (Вентспилс), где строился флот герцога Якова Кеттлера. На пике своего развития эта верфь спускала на воду военные корабли, которые несли курляндский флаг в Африку и Карибский бассейн." #NT!
 nd_liv_bernsteinkammer: "Бернштайнкамер" #NT!
 nd_liv_bernsteinkammer_desc: "Мастерская по обработке янтаря, где сырой балтийский янтарь сортируется, полируется и вырезается из ювелирных изделий, религиозных предметов и предметов роскоши для экспорта во дворы и на рынки Европы." #NT!
 nd_liv_vasallenburg: "Васалленбург" #NT!
 nd_liv_vasallenburg_desc: "Укрепленная усадьба вассалов балтийских немцев: частично резиденция, частично гарнизон, частично административный центр окрестностей. Основа сельской обороны и дворянской власти во всей Ливонии." #NT!
 nd_liv_getreidelager: "Гетрайделагер" #NT!
 nd_liv_getreidelager_desc: "Зерновой склад на набережной Риги: хранение, взвешивание и сортировка огромного количества ржи, пшеницы и ячменя, которые поступают из внутренних районов Ливонии, чтобы накормить города Западной Европы." #NT!
 nd_liv_dampfsagewerk: "Дампфсегеверк" #NT!
 nd_liv_dampfsagewerk_desc: "Паровая лесопилка, механизирующая лесную промышленность Балтии. Железные лезвия, приводимые в движение паровыми двигателями, с беспрецедентной скоростью разрезали сосновые и дубовые бревна, производя стандартизированные пиломатериалы на экспорт." #NT!
 nd_liv_ordensburg_upkeep: "Обслуживание замка" #NT!
 nd_liv_ordensburg_upkeep_desc: "Каменные стены и железные ворота Орденсбурга требуют постоянного ухода: известка, древесина и оружие, чтобы поддерживать крепость в боевом состоянии." #NT!
 nd_liv_kontor_maintenance: "Контор Операции" #NT!
 nd_liv_kontor_maintenance_desc: "Ежедневная работа ганзейского торгового поста: учет, складирование и постоянный поток товаров между внутренними районами Балтии и западными рынками." #NT!
 nd_liv_domschule_upkeep: "Школьное снабжение" #NT!
 nd_liv_domschule_upkeep_desc: "Бумага для рукописей, пчелиный воск для свечей и печатей: скромные материальные потребности соборной школы, которая намного превосходит ее по интеллектуальным достижениям." #NT!
 nd_liv_werft_maintenance: "Операции верфи" #NT!
 nd_liv_werft_maintenance_desc: "Ненасытный аппетит работающей верфи: выдержанная древесина, веревки, деготь и военно-морские запасы, потребляемые в бесконечном процессе строительства и ремонта военных кораблей." #NT!
 nd_liv_amber_processing: "Обработка янтаря" #NT!
 nd_liv_amber_processing_desc: "Необработанный балтийский янтарь сортируется, ограняется и полируется для изготовления ювелирных изделий и предметов религиозного назначения: это специализированное ремесло, передаваемое из поколения в поколение балтийскими ремесленниками." #NT!
 nd_liv_vasallenburg_upkeep: "Содержание поместья" #NT!
 nd_liv_vasallenburg_upkeep_desc: "Камень и железо требовались для поддержания укрепленного усадебного дома, поддержания прочных стен, работоспособности ворот и оснащения местного гарнизона." #NT!
 nd_liv_getreidelager_upkeep: "Складские операции" #NT!
 nd_liv_getreidelager_upkeep_desc: "Текущее обслуживание и эксплуатация зернового склада: весы, бункеры и постоянный труд по погрузке и разгрузке барж на Даугаве." #NT!
 nd_liv_dampfsagewerk_upkeep: "Лесопильный завод" #NT!
 nd_liv_dampfsagewerk_upkeep_desc: "Уголь топит котел, а пилы на скорости распиливают сосновые и дубовые бревна, производя стандартизированные пиломатериалы для рынков Балтии и Европы." #NT!
 nd_liv_wax_processing: "Обработка воска" #NT!
 nd_liv_wax_processing_desc: "Обработка и очистка пчелиного воска с ливонских пасек, производство очищенного воска, которым освещают соборы и запечатывают документы христианского мира." #NT!
 nd_liv_timber_trade: "Лесная торговля" #NT!
 nd_liv_timber_trade_desc: "Переработка и экспорт балтийской сосны и дуба: от необработанных бревен, плывущих по Даугаве, до готовых пиломатериалов, дегтя и смолы, отправляемых на верфи Западной Европы." #NT!
 nd_liv_flax_processing: "Переработка льна" #NT!
 nd_liv_flax_processing_desc: "Прядение и плетение тонких льняных тканей из ливонского льна: основной экспортный товар стран Балтии, ценимый за качество и долговечность." #NT!
 nd_liv_fur_processing: "Обработка меха" #NT!
 nd_liv_fur_processing_desc: "Сортировка, сортировка и прессование шкур бобра, куницы и лисицы из внутренних районов Ливонии, подготовка мехов высочайшего качества для экспорта во дворы и на рынки Европы." #NT!
 nd_liv_colonial_trade: "Колониальная торговля" #NT!
 nd_liv_colonial_trade_desc: "Управление отдаленными колониальными торговыми путями, снабжение кораблей продовольствием, координация факторных агентов и обеспечение потока экзотических товаров из тропических аванпостов обратно в порты Балтики." #NT!
 levy_nd_liv_schwertbruder: "Швертбрюдер Леви" #NT!
 levy_nd_liv_schwertbruder_desc: "Ревностная пехота-крестоносец, собранная из солдат и крестьян Ливонии, сражающаяся в традициях первых Братьев Меча." #NT!
 levy_nd_liv_reiter: "Райтер Леви" #NT!
 levy_nd_liv_reiter_desc: "Конные пистолеры, воспитанные из дворян и солдат Ливонии: наследники орденской кавалерийской традиции, вооруженные современным огнестрельным оружием." #NT!
 nd_liv_formed_tt: "образовалась Ливония." #NT!
 nd_liv_path_a_tt: "Выбрал меч и крест" #NT!
 nd_liv_path_b_tt: "Выбрали Baltic Emporium" #NT!
 nd_liv_destiny: "Ливонская судьба" #NT!
 nd_liv_destiny_desc: "Государство Ливония стоит на перекрестке Балтийского мира. Будь то меч или серебро, наша судьба ждёт. Но сначала мы должны доказать, что эта молодая нация может выстоять." #NT!
 nd_liv_dest_crusade: "Северный крестовый поход" #NT!
 nd_liv_dest_crusade_desc: "Дух крестоносцев требует расширения. Завоюйте языческую крепость Жемайтию и тевтонскую столицу Кенигсберг, чтобы создать единое государство крестоносцев по всей восточной Балтике." #NT!
 nd_liv_dest_drang: "Дранг нач Остен" #NT!
 nd_liv_dest_drang_desc: "Движение на восток продолжается. Возьмите Псков и Полоцк, города-ворота в обширные внутренние районы России, и создайте армию, достойную Балтийской империи." #NT!
 nd_liv_dest_dominium: "Доминиум Марис Балтичи" #NT!
 nd_liv_dest_dominium_desc: "Захватите Новгород, древний центр русской торговли, и Вильнюс, столицу Литвы. Благодаря этим завоеваниям Ливония становится бесспорным хозяином восточной Балтики: империя крестоносцев, простирающаяся от Финского залива до Немана." #NT!
 nd_liv_dest_hansa: "Ганзейские ворота" #NT!
 nd_liv_dest_hansa_desc: "Возьмите Данциг, крупнейший порт на юге Балтики, под контроль Ливонии и накопите капитал для финансирования торговой империи. Рига и Данциг вместе контролируют потоки зерна, древесины и янтаря через северные моря." #NT!
 nd_liv_dest_warehouse: "Балтийский склад" #NT!
 nd_liv_dest_warehouse_desc: "Сделать Ливонию центральным складом Прибалтики. Используйте современное банковское дело, обеспечьте поток янтаря через наш рынок капитала и накопите богатство, которое превратит торговый пост в торговый центр." #NT!
 nd_liv_dest_emporium: "Высший торговый центр" #NT!
 nd_liv_dest_emporium_desc: "Завоюйте сам Любек, королеву Ганзы, и сделайте Ливонию высшей торговой державой Северной Европы. Развивайте королевство в полной мере и наполните сокровищницу до отказа." #NT!
 nd_liv.6.t: "Судьба Ливонии" #NT!
 nd_liv.6.d: "Ливония была создана из разрозненных территорий Прибалтики: королевства, где немецкие рыцари, ганзейские купцы и балтийские народы сосуществуют под одним знаменем. Но одного лишь акта формирования недостаточно. Вопрос, который теперь стоит перед нами, принципиален: каким государством станет Ливония? Путь вперед определит не только наши границы, но и саму нашу идентичность как нации." #NT!
 nd_liv.6.a: "Наша судьба ждет." #NT!
 nd_liv.7.t: "Северный крестовый поход возобновляется" #NT!
 nd_liv.7.d: "Рыцари отправились на юг, в Жемайтию, и на восток, в Пруссию. Там, где когда-то господствовали язычники, теперь крест возвышается над каждой крепостью и деревней. Кенигсберг, древняя резиденция Тевтонского ордена, развевает наше знамя. Государство крестоносцев возрождается: не как разрозненная конфедерация епископов и рыцарей, а как единое королевство, способное расширяться еще больше." #NT!
 nd_liv.7.a: "Меч служит кресту." #NT!
 nd_liv.8.t: "Поездка на Восток" #NT!
 nd_liv.8.d: "Псков пал. Полоцк наш. Древние торговые города русской границы теперь подчиняются власти Ливонии. Наши армии стоят глубоко на территории, которая когда-то была владением православных князей и славянских бояр. Но как нам управлять этими новыми завоеваниями? Некоторые призывают к рвению крестового похода: принудительному обращению в веру, немецкому заселению, полному преобразованию завоеванных земель. Другие советуют проявить терпение: установить порядок посредством военной дисциплины и административной эффективности, позволяя постепенно осваивать новые предметы." #NT!
 nd_liv.8.a: "Наполните восток немецкими поселенцами и церквями." #NT!
 nd_liv.8.b: "Установите военный порядок на границе." #NT!
 nd_liv.9.t: "Доминиум Марис Балтичи" #NT!
 nd_liv.9.d: "Новгород, легендарный город тысячи церквей, подчинился Ливонской власти. Вильнюс, резиденция великих князей литовских, развевает наше знамя. От Финского залива до лесов Жемайтии, от берегов Курляндии до ворот Московии государство крестоносцев командует империей. Восточная Балтика – это Ливонское озеро. Но вместе с империей возникает вопрос о ее характере. Будем ли мы править так, как того требует железный крест: с бескомпромиссным авторитетом Ордена? Или мы установим Ливонский мир, управляя нашими разнообразными подданными силой, умеренной прагматизмом?" #NT!
 nd_liv.9.a: "Под железным крестом все подчиняются." #NT!
 nd_liv.9.b: "Ливонский мир будет править Востоком." #NT!
 nd_liv.10.t: "Ганзейские ворота" #NT!
 nd_liv.10.d: "Данциг наш. Крупнейший порт на юге Балтики, откуда по Висле польское зерно сливается в трюмы тысяч торговых судов, теперь действует под властью Ливонии. Поскольку Рига контролирует Даугаву, а Данциг — Вислу, мы контролируем две мощнейшие речные торговые артерии северного мира. Счетные палаты переполнены, склады забиты под стропила. Балтийский торговый центр обретает форму." #NT!
 nd_liv.10.a: "Через наши руки течет богатство двух рек." #NT!
 nd_liv.11.t: "Ливонский склад" #NT!
 nd_liv.11.d: "Ливония стала центральным складом балтийского мира. Наши банкиры распространяют кредиты от Риги до Лондона, наш янтарь ценится при каждом дворе, а наши купцы господствуют в торговле зерном, лесом и мехами. Но две коммерческие философии конкурируют за доминирование. Торговцы янтарем выступают за монополию, контролируя поставки балтийского янтаря от рудника до рынка и устанавливая цены, которые должен платить весь мир. Хозяева портов выступают за открытость, делая наши гавани самыми свободными в Европе, где любой торговец может торговать без ограничений, полагая, что этот объем принесет больше богатства, чем любая монополия." #NT!
 nd_liv.11.a: "Контролируйте янтарь, контролируйте рынок." #NT!
 nd_liv.11.b: "Откройте наши порты для мировой торговли." #NT!
 nd_liv.12.t: "Высший торговый центр" #NT!
 nd_liv.12.d: "Сам Любек, королева Ганзейского союза, город, купцы которого когда-то диктовали условия торговли всей Северной Европе, теперь подчиняется Ливонии. Ученик превзошел мастера. Из наших портов корабли доставляют товары из стран Балтии во все уголки Европы и за ее пределы. Наши банкиры финансируют войны и торговые предприятия от Северного моря до Средиземного моря. Рига стала тем же, чем Венеция на юге: незаменимым центром торговли, городом, без которого ничего не движется. Будем ли мы править этой империей как торговые принцы, торговая аристократия, правящая посредством богатства и влияния? Или нам следует сделать Ригу Северной Венецией, республикой торговцев, где сама торговля является высшим законом?" #NT!
 nd_liv.12.a: "Торговые князья будут править." #NT!
 nd_liv.12.b: "Рига станет Северной Венецией." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_crusader_zeal: "Рвение крестоносца" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_crusader_zeal: "Рвение Северного крестового похода подпитывает Ливонскую экспансию. Немецкие поселенцы и миссионеры хлынули на завоеванные территории, но затраты на непрерывную войну истощают казну." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_frontier_order: "Пограничный приказ" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_frontier_order: "Завоеванные восточные территории управляются строгим военным порядком: укрепленными гарнизонами, дисциплинированными патрулями и систематическим управлением. Граница безопасна, хотя строительство новых территорий обходится дорого." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_iron_cross: "Под Железным крестом" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_iron_cross: "Железная дисциплина крестоносного порядка управляет Ливонской империей. Подчиненные народы подчиняются непреклонной власти, которая не терпит инакомыслия. Но бремя постоянной бдительности лежит на измученной войной нации." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_pax_livonica: "Пакс Ливоника" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_pax_livonica: "Ливонский мир управляет восточной Балтикой посредством прагматической силы. Завоеванные территории приводят в порядок благодаря эффективному управлению и обещанию стабильности, вознаграждению тех, кто подчиняется, и обогащению королевства за счет грабежей." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_amber_monopoly: "Янтарная монополия" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_amber_monopoly: "Ливония контролирует торговлю янтарем от рудника до рынка, устанавливая цены, регулируя экспорт и получая огромные прибыли от аппетита Европы к балтийскому золоту. Ассимиляция подчиненных народов происходит быстро в условиях культурной интеграции, движимой торговцами." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_free_port: "Чартер свободного порта" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_free_port: "Ливонские гавани — самые свободные в Европе: любой купец, любой флаг, любой груз. Эта политика привлекает торговцев со всего континента, но стране, построенной на открытой торговле, труднее оправдывать войну." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_merchant_princes: "Торговые князья" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_merchant_princes: "Ливонией управляет торговая аристократия: богатые купеческие семьи, влияние которых распространяется на суды и счетные палаты Северной Европы. Их дипломатическое влияние расширяет торговую сеть Ливонии по всему континенту." #NT!
 STATIC_MODIFIER_NAME_nd_liv_dest_baltic_venice: "Балтийская Венеция" #NT!
 STATIC_MODIFIER_DESC_nd_liv_dest_baltic_venice: "Рига стала Северной Венецией: торговой республикой, где торговый поток является высшим законом. Богатство города поддерживает профессиональные наемные силы, а самоуспокоенность от легкого процветания сдерживается постоянным стремлением к новым рынкам." #NT!
 nd_liv_deutschordensschloss: "Deutschordensschloss" #NT!
 nd_liv_deutschordensschloss_desc: "Величественный замок ордена крестоносцев: частично крепость, частично дворец, частично резиденция правительства. Его массивные стены и башни-крепости доминируют над ландшафтом, проецируя мощь и устойчивость Ливонского государства крестоносцев на завоеванных территориях." #NT!
 nd_liv_borsenhaus: "Борзенхаус" #NT!
 nd_liv_borsenhaus_desc: "Грандиозный обменный пункт, где купцы Балтии ведут свой бизнес, договариваясь о ценах, расплачиваясь и организуя отправку товаров из Риги на рынки Европы. Торговый центр Ливонской торговой империи." #NT!
 nd_liv_deutschordensschloss_upkeep: "Замковые запасы" #NT!
 nd_liv_deutschordensschloss_upkeep_desc: "Величественному замку нужен камень для стен, оружие для гарнизона и прекрасная ткань для знамен и гобеленов, провозглашающих власть крестоносного ордена." #NT!
 nd_liv_borsenhaus_upkeep: "Обменные операции" #NT!
 nd_liv_borsenhaus_upkeep_desc: "Ежедневная работа биржи: бумага для контрактов, ткань для гильдии купцов и инструменты для обслуживания весов, гирь и измерительных инструментов, обеспечивающих честную торговлю." #NT!
  
  # ===== BUREAUCRACIES ===== 
 liv_walk_landtag_bureaucracy: "Ландтаг на прогулке" #NT!
 liv_walk_landtag_bureaucracy_desc: "Сейм Ливонского союза, созванный в 1419 году по инициативе архиепископа Иоганна Амбундия в Валке (Вольмар/Вольмар) и возобновлявшийся по регулярному графику до 1559 года. Четыре сословия (Ливонский орден, князья-епископы Рижские, Дерптские, Эзель-Викские и Курляндские, вассальные рыцарства и ганзейские города Риги, Ревеля и Дерпта) встретились, чтобы ратифицировать общую политику в отношении чеканки монет, войны, договоров и внутренних споров. Ландтаг был единственным органом, который мог говорить от имени средневековой Ливонии в целом; на практике это давало светским и церковным лордам постоянное вето на амбиции любого отдельного правителя." #NT!
 liv_ordens_konvent_bureaucracy: "Орденс Конвент" #NT!
 liv_ordens_konvent_bureaucracy_desc: "Административная структура Ливонского отделения Тевтонского ордена. Ландмайстер (заседавший в Вендене, позже в Риге) председательствовал на Großgebietiger (пять высших офицерских коллегий в составе Ландмаршала, Гросскомтура, Драпера, Шпиттлера и Тресслера), в то время как отдельные Комтуры командовали Комменденами Ордена, крепостями Орденсбурга, которые закрепляли завоевание от Риги до Нарвы. Система Конвента объединила монашеский капитул, военное командование и территориальную администрацию в единый институт безбрачия, который управлял королевством с 1240-х годов до секуляризации в 1561 году." #NT!
 liv_hanseatic_stadtrat_bureaucracy: "Ганзейский Штадтрат" #NT!
 liv_hanseatic_stadtrat_bureaucracy_desc: "Гражданское управление Ригой (учреждено Любекским законом в 1201 г.), Ревелем/Таллинном (1248 г.) и Дерптом. Крыса (самосохраняющийся совет самых богатых нижненемецких купеческих родов) избирала до четырех бюргермейстеров из своего числа, отправляла представителей в Ганзетаг в Любеке и управляла Любекским законом в пределах городских стен. Братство Черноголовых, объединение неженатых иностранных купцов, уставы которого были ратифицированы в Ревеле в 1407 году и Риге в 1416 году, снабжало городское ополчение, защищало города во время восстания Юрьевой ночи и служило преддверием полноправного членства Крыс. Их дома до сих пор стоят в Таллинне и когда-то стояли в Риге." #NT!
 liv_ritterschaft_vasallenrecht_bureaucracy: "Риттершафт Васалленрехт" #NT!
 liv_ritterschaft_vasallenrecht_bureaucracy_desc: "Корпоративное самоуправление вассальной знати балтийских немцев, организованное в четыре рыцарства: Харью-Виру в северной Эстонии (де-факто автономный с 1252 г.), Эзель-Вик, Эстланд и Ливланд. Каждое рыцарство содержало свой собственный Маннбух (список вассалов), Маннрихтерский суд и Вакенбухский обзор крестьянских сборов, а также объединяло своих членов в корпоративный орган, который собирал кавалерию, ратифицировал закон о рыцарстве и представлял вассальное сословие в Уок-Ландтаге. Privilegium Sigismundi Augusti от 28 ноября 1561 года закрепил эти привилегии в Indigenat: право балтийских немцев на самоуправление, которое пережило все изменения суверенитета (польского, шведского, российского) до распада в 1917 году Эстляндии и 1920 года в Ливляндии." #NT!
 AUTO_MODIFIER_NAME_nd_liv_bureaucracy_authority: "Поместья Ливонской Конфедерации" #NT!
 AUTO_MODIFIER_DESC_nd_liv_bureaucracy_authority: "При формировании Ливония унаследовала институциональную мозаику средневековой Конфедерации: диету Уока, Конвент Ордена, ганзейские городские советы и корпорации Риттершафт четырех рыцарских орденов. Предоставляет два слота бюрократии и открывает систему [bureaucracies|e], позволяющую игроку активировать до трех учреждений (с универсальным слотом капитала)." #NT!
