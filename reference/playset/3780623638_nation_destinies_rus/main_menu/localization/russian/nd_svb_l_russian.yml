l_russian:
  # ===== STATIC MODIFIERS: FORMATION CHOICES ===== 
 STATIC_MODIFIER_NAME_nd_svb_cakkavatti: "Чаккаватти: Монарх, вращающий колесо" #NT!
 STATIC_MODIFIER_DESC_nd_svb_cakkavatti: "Царь — это бодхисаттва и дхамма-раджа, вселенский монарх, вращающий колесо закона. Централизованное сакральное царствование в духе Джаявармана VII и Таунгу Байиннаунга в Ангкоре: армии продвигаются под шафрановым знаменем, и престиж трона распространяется по всей мандале." #NT!
 STATIC_MODIFIER_NAME_nd_svb_sangha_federation: "Федерация Сангхи" #NT!
 STATIC_MODIFIER_DESC_nd_svb_sangha_federation: "Суварнабхуми связывает не трон, а трансконтинентальный буддийский монашеский орден. Каждый король кхмеров, тайцев, бирманцев, мон и лаоса управляет своим народом, но каждый монах в шафрановых одеждах пересекает все границы, а сангха — это империя. Свободный сюзеренитет, широкая терпимость и дхарма как единственный универсальный закон." #NT!
 STATIC_MODIFIER_NAME_nd_svb_three_worlds: "Империя Трех Миров" #NT!
 STATIC_MODIFIER_DESC_nd_svb_three_worlds: "Трай Пхум Пхра Руанг короля Литая сделал империю отражением буддийского космоса в мире смертных. Придворная церемония, закон о роскоши и иерархия кармических заслуг — все это театральные представления космологического порядка: царь в образе горы Меру в центре, царства богов, людей и ада, расходящиеся наружу в тщательно продуманном ритуальном зрелище." #NT!
  
  # ===== STATIC MODIFIERS: ADVANCE EVENTS ===== 
 STATIC_MODIFIER_NAME_nd_svb_assimilation: "Индокитайский синтез" #NT!
 STATIC_MODIFIER_DESC_nd_svb_assimilation: "Покоренные Мон, Кхмеры и Лаос — не подданные, а Суварнабхумин в процессе становления: буддизм Тхеравады — универсальный растворитель." #NT!
 STATIC_MODIFIER_NAME_nd_svb_tributary_mandala: "Мандала данников" #NT!
 STATIC_MODIFIER_DESC_nd_svb_tributary_mandala: "Модель Байиннаунга: младшие короли сохраняют свои троны и, в свою очередь, предоставляют набор слоновьих корпусов для дани, престижа и защиты." #NT!
 STATIC_MODIFIER_NAME_nd_svb_state_sangha: "Государственная Сангха" #NT!
 STATIC_MODIFIER_DESC_nd_svb_state_sangha: "Реформированная иерархия сангха-раджи подчиняется непосредственно трону. Королевские рукополагающие советы следят за ортодоксальностью и ритуальной чистотой по всей империи." #NT!
 STATIC_MODIFIER_NAME_nd_svb_forest_sangha: "Традиция Лесной Сангхи" #NT!
 STATIC_MODIFIER_DESC_nd_svb_forest_sangha: "Живущие в лесу монахи-медитаторы остаются духовной элитой, привлекая мирянскую преданность, невзирая на культурные границы, и поощряя народное буддийское благочестие." #NT!
 STATIC_MODIFIER_NAME_nd_svb_open_court: "Космополитический суд" #NT!
 STATIC_MODIFIER_DESC_nd_svb_open_court: "Как и в Аюттайе короля Нарая, в столице расположены персидские, японские, французские, голландские, китайские и индийские кварталы. Империя становится вертушкой евразийской торговли." #NT!
 STATIC_MODIFIER_NAME_nd_svb_chosen_advisors: "Избранные иностранные советники" #NT!
 STATIC_MODIFIER_DESC_nd_svb_chosen_advisors: "Подобно шейху Ахмаду и Константину Фаулкону, избранные иностранцы занимают высокие посты, в то время как торговля королевства остается под королевской монополией." #NT!
 STATIC_MODIFIER_NAME_nd_svb_french_drill: "Руководство по французской дрели" #NT!
 STATIC_MODIFIER_DESC_nd_svb_french_drill: "Пехотные учения конбаунгов по европейской модели: дисциплинированные порядки с фитильными ружьями, залповый огонь и мушкетеры со штыками, служащие элитным корпусом." #NT!
 STATIC_MODIFIER_NAME_nd_svb_burmese_arsenal: "Бирманский королевский арсенал" #NT!
 STATIC_MODIFIER_DESC_nd_svb_burmese_arsenal: "Государственные оружейные заводы отливали огнестрельное оружие на месте, а не импортировали его, снабжая быстро растущую армию поздней империи." #NT!
  
  # ===== FORMATION EVENT ===== 
 nd_svb.1.t: "Суварнабхуми: Земля золота" #NT!
 nd_svb.1.d: "То, что палийские сутры называли Суварнабхуми (Золотая Земля), наконец-то перешло под одно знамя. Храмы-ваты Ангкора и чеди Аюттхая, усеянная ступами равнина Багана и Тат Луанг во Вьентьяне — все четыре цивилизационные якоря материковой части Юго-Восточной Азии подчиняются единому буддийскому универсальному монарху. Байиннаунг некоторое время удерживал эту возможность перед фрагментацией; Кхмерская империя мечтала об этом до того, как тайская экспансия разрушила ее границы; Король Литай представлял это как гору Меру из царства смертных из космологии Трай Пхум. Теперь знамя колеса Дхармы из шафрана и золота реет над каждым материковым королевством от Пагана до дельты Меконга. Но кем должен быть Суварнабхуми: единый сакральный трон, федерация под одной сангхой или Три Мира, ставшие плотью?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_svb.1.a: "Чаккаватти: вселенский монарх вращает колесо" #NT!
 nd_svb.1.b: "Федерация Сангхи: короли разделены, дхарма едина" #NT!
 nd_svb.1.c: "Три мира: империя как космический порядок" #NT!
  
  # ===== ADVANCE EVENTS ===== 
 nd_svb.2.t: "Мечта Байиннаунга воплотилась в жизнь" #NT!
 nd_svb.2.d: "К 1580 году король Таунгу Байиннаунг (того, кого португальцы называли самым могущественным монархом в Азии после императора Китая) собрал самое большое непрерывное государство в истории Юго-Восточной Азии: собственно Бирму, государства Шан, Лан На, Лан Ксанг, Манипур и сама Аюттхая, все они были присяжными вассалами Пегу. Он скрепил его благодаря личной преданности Чаккаватти, правящему из единой столицы без институционального преемника. Через поколение после его смерти империя распалась. Мы сделали то, что он не смог: осуществилась доктрина панматерикового завоевания. Но как нам удержать то, что он потерял?" #NT!
 nd_svb.2.a: "Сделайте каждого победителя Суварнабхумином." #NT!
 nd_svb.2.b: "Правило через мандалу субкоролей" #NT!
 nd_svb.3.t: "Сингальское рукоположение" #NT!
 nd_svb.3.d: "Из Шри-Ланки прибыли старшие монахи, наследники ортодоксальности Махавихары, несущие полный палийский канон и непрерывную линию передачи Тхеравады, восходящую к Третьему буддийскому собору. Как сделал король Анаврахта в Багане, как сделал Рамкхамхенг в Сукхотае, теперь мы приглашаем их переосвятить нашу собственную сангху и основать «чистую» сингальскую линию передачи. Реформированная сангха свяжет каждый монастырь от Иравади до Меконга одним рукоположением. Но кто будет им командовать: трон или лесная обитель?" #NT!
 nd_svb.3.a: "Сангха-раджа подчиняется трону" #NT!
 nd_svb.3.b: "Честь лесных мастеров" #NT!
 nd_svb.4.t: "Космополитический суд" #NT!
 nd_svb.4.d: "Прибывают посольства: французские иезуиты, персидские шииты с торговым лордом шейхом Ахмадом, японские слуги-ронины, голландские факторы ЛОС, китайские торговцы чаем, посланники английской Ост-Индской компании и индийские мусульманские портовые чиновники - все они борются за место в столице. Персидские кварталы и японские поселения расположены вдоль набережной, рядом с португальскими церквями и китайскими пагодами. Империя стала, как Аюттхая при Нарае, центром евразийской торговли. Распахнем ли мы ворота или тщательно выберем партнеров?" #NT!
 nd_svb.4.a: "Приветствуются все помещения, все флаги." #NT!
 nd_svb.4.b: "Возвышайте избранных иностранцев; контролировать остальное" #NT!
 nd_svb.5.t: "Пороховая реформа Конбаунга" #NT!
 nd_svb.5.d: "Алаунгпайя, основатель линии Конбаунг, издал указ о стандартизации тренировок с фитильным оружием и дисциплинированном построении залпового огня. Боевые катера из тикового дерева теперь несут на борту до тридцати мушкетеров и 6-фунтовую поворотную пушку; осадная артиллерия установлена ​​на деревянных платформах для очистки стен. Французские артиллеристы, переброшенные на восток после неприятностей в Пондичерри, тренируют нашу пехоту по-европейски. Будем ли мы следовать их модели целиком или создадим собственный арсенал?" #NT!
 nd_svb.5.a: "Принять Европейское руководство по бурению" #NT!
 nd_svb.5.b: "Королевские арсеналы, бирманский узор" #NT!
 nd_svb.6.t: "Кодифицированные три мира" #NT!
 nd_svb.6.d: "Книга короля Литая «Трай Пхум Пхра Руанг» («Три мира согласно королю Руангу») стала канонической идеологией государственного управления. Написанное в 1345 году как старейшее известное произведение тайской литературы, оно отображает тридцать одну сферу буддийской космологии: одиннадцать уровней царства желаний Камадхату, шестнадцать царства форм Рупадхату, четыре бесформенных Арупадхату. Каждая нарисованная адская сцена на каждом вате теперь напоминает мирянам, что добрая карма ведет в рай, а злая – к мучениям. Империя превращается в смертное зеркало горы Меру, а король правит в космическом центре." #NT!
 nd_svb.6.a: "Пусть каждый ват заново раскрасит миры" #NT!
 nd_svb.7.t: "Гидравлический город" #NT!
 nd_svb.7.d: "На тысяче квадратных километров равнины Ангкор наши инженеры завершили строительство сети бараев, каналов, рвов и насыпей, которые дали Кхмерской империи ее сельскохозяйственную основу. Один только Западный Барай содержит достаточно воды, чтобы пополнить уровень грунтовых вод в засушливый сезон для всего региона; Джаятатака снабжает сам город. Двойные муссонные наводнения укрощены, рисовые поля убраны дважды, а то, что сохраняло инженерное мастерство при Сурьявармане, теперь служит обновленному Суварнабхуми. Засуха четырнадцатого века, разрушившая старый гидравлический город Ангкора, не разрушит и наш. Мы извлекли уроки из истории." #NT!
 nd_svb.7.a: "Земля Золота пьет до дна" #NT!
  
  # ===== ADVANCES ===== 
 nd_svb_baray_engineering: "Барай Инжиниринг" #NT!
 nd_svb_baray_engineering_desc: "Традиция кхмерского гидравлического города по управлению водными ресурсами в сезон дождей: обширные водохранилища, сети каналов и насыпи, которые улавливали наводнения в сезон дождей и подпитывали рисовые поля в засушливый сезон." #NT!
 nd_svb_pali_sangha: "Палийская Сангха" #NT!
 nd_svb_pali_sangha_desc: "Принятие пали в качестве канонического литургического языка объединяет трансконтинентальный монашеский орден Тхеравады: кхмерские, монские, бирманские, тайские и лаосские монахи поют одни и те же сутты, пересекают все границы и образуют непрерывную духовную ткань." #NT!
 nd_svb_wat_architecture: "Архитектура Ват-Храма" #NT!
 nd_svb_wat_architecture_desc: "Индианизированная традиция каменных храмов, породившая Ангкор-Ват, Байон и усеянную ступами равнину Багана: песчаник и латерит, собранные в горно-храмовые комплексы, закрепляют духовную географию королевства." #NT!
 nd_svb_riverine_warfare: "Речная война" #NT!
 nd_svb_riverine_warfare_desc: "Длинные боевые каноэ из тикового дерева, укомплектованные экипажами с барабанными греблями, сражаются на Меконге, Чао Прайе и Иравади. Это великие речные системы, которые являются настоящими магистралями материковой Юго-Восточной Азии." #NT!
 nd_svb_monsoon_paddy: "Интенсификация муссонных рисовых полей" #NT!
 nd_svb_monsoon_paddy_desc: "Двойной сбор влажного риса вдоль великих рек, поддерживаемый общественной мобилизацией рабочей силы и традиционным управлением водными ресурсами: сельскохозяйственная основа, которая позволила Ангкору и Пэгану кормить свое имперское население." #NT!
 nd_svb_bronze_buddha: "Литейный цех Бронзового Будды" #NT!
 nd_svb_bronze_buddha_desc: "Отливка бронзовых изображений Будды по выплавляемым моделям, основная художественно-религиозная индустрия от идущих Будд Сукхотай до побед сидящих Мара в Мандалее. Государственные литейные заводы снабжают храмы; патронаж доноров финансирует кастинг; Заслуги достаются как царю, так и преданному." #NT!
 nd_svb_royal_chedi: "Строительство Королевской Чеди-Ступы" #NT!
 nd_svb_royal_chedi_desc: "Монументальное сооружение курганов-реликвий как театр легитимности: каждый король должен короновать чеди, а огромные позолоченные шпили Пегу, Аюттхая и Вьентьян отмечают династическую генеалогию империи." #NT!
 nd_svb_sinhalese_ordination: "Реформа сингальского рукоположения" #NT!
 nd_svb_sinhalese_ordination_desc: "Импорт старших монахов из Шри-Ланки с целью перепосвящения местной сангхи и установления «чистой» линии Махавихары: модель реформ, которая протянулась от Багана Анаврахты и Сукотаи Рамкхамхенга до реординаций материковой Тхеравады в восемнадцатом веке." #NT!
 nd_svb_elephant_doctrine: "Доктрина Королевского Слоновьего Крааля" #NT!
 nd_svb_elephant_doctrine_desc: "Массовый отлов и дрессировка боевых слонов. Кхмерские, тайские и бирманские короли содержали королевские краали, где дикие стада собирали в загоны, запрягали и готовили к битвам, парадам и королевской охоте. Институциональная доктрина, создавшая слоновий корпус империи." #NT!
 nd_svb_mandala_statecraft: "Мандала Государственное управление" #NT!
 nd_svb_mandala_statecraft_desc: "Индианизированная модель королевской власти с концентрическими данниками: божественный король в космическом центре, окруженный подчиненными королями, обладающими личной преданностью, система, которая масштабируется от единой столицы в речной долине до пан-материковой империи." #NT!
 nd_svb_toungoo_elephants: "Доктрина о слонах Таунгу" #NT!
 nd_svb_toungoo_elephants_desc: "Подпись Байиннаунга: массированные колонны боевых слонов в дисциплинированных тяжелых ударных построениях при поддержке пехоты и кавалерии. Португальцы описывали свой слоновий корпус как самый грозный в Азии, затмевающий даже могольскую массу." #NT!
 nd_svb_great_river_port: "Великие речные порты" #NT!
 nd_svb_great_river_port_desc: "Создание перевалочных портов в устьях и впадениях Меконга, Чао Прайи и Иравади. Эти торговые города в устьях рек связывают рис и драгоценные камни из глубин страны с морскими маршрутами специй." #NT!
 nd_svb_gemstone_trade: "Монополии в торговле драгоценными камнями" #NT!
 nd_svb_gemstone_trade_desc: "Бирманские рубины из долины Могок, камбоджийские сапфиры из Пайлина, а также шпинели и жемчуг внутренней торговли: королевские монополии на месторождениях драгоценных камней на материке, которые продаются по всему миру через Аюттхая и Пегу." #NT!
 nd_svb_bayinnaung_doctrine: "Доктрина Байиннаунга" #NT!
 nd_svb_bayinnaung_doctrine_desc: "Стратегический план завоевания всего материка: быстрая мобилизация многонациональных отрядов, массовые штурмовые колонны слонов и подавление шанских повстанцев и лаосского сопротивления путем подавляющей концентрации сил." #NT!
 nd_svb_lacquerware: "Лаковые традиции" #NT!
 nd_svb_lacquerware_desc: "Придворные бирманские юн и тайские ремесла лай-род-нам: лак из сока дерева титси, наносимый в несколько слоев на бамбук и дерево, затем вырезаемый, позолоченный или инкрустированный перламутром. Фирменный экспорт материковых судов." #NT!
 nd_svb_cakkavatti_guard: "Королевская гвардия Чаккаватти" #NT!
 nd_svb_cakkavatti_guard_desc: "Элитная домашняя пехота вселенского монарха: дворцовая стража, набранная из солдатских каст, обученная на территории короля и подчиняющаяся непосредственно трону. Личная свита дхамма-раджи." #NT!
 nd_svb_cosmopolitan_court: "Космополитический суд" #NT!
 nd_svb_cosmopolitan_court_desc: "Столица становится дипломатическим перекрестком Евразии: персидские шиитские министры, японские капитаны-наёмники, французские эмиссары-иезуиты, голландские агенты VOC и китайские торговцы чаем — все они зарегистрированы при дворе, каждый в отведенном им квартале." #NT!
 nd_svb_trai_phum: "Трай Фум Космология" #NT!
 nd_svb_trai_phum_desc: "Три мира короля Литая Согласно королю Руангу, канонической буддийской космологии государственного управления материковой Юго-Восточной Азии, отображающей тридцать одно царство от ада Авичи через человеческое существование до бесформенных небес Брахм." #NT!
 nd_svb_sumptuary_law: "Королевский закон о роскоши" #NT!
 nd_svb_sumptuary_law_desc: "Тщательно продуманная градация одежд, зонтиков, типов паланкинов и церемониальных речевых регистров — все это в видимой форме кодирует иерархию кармических заслуг. Двор становится живым театром космологического порядка." #NT!
 nd_svb_early_gunpowder: "Раннее внедрение фитильного ружья" #NT!
 nd_svb_early_gunpowder_desc: "Португальские наемники и торговцы привозят на материковые суды мушкеты с фитильными замками и бронзовые пушки. Диого Соареш де Мелло служил в Аюттайе, Филипе де Брито правил Сирией: иберийская пороховая революция рано пришла в Бенгальский залив." #NT!
 nd_svb_monk_soldiers: "Реформистская Сангха" #NT!
 nd_svb_monk_soldiers_desc: "Реформистские монахи в шафрановых одеждах активно формируют государственную политику, выступают посредниками в спорах и возглавляют движения мирского благочестия. Альянс сангхи и государства становится духовной основой империи." #NT!
 nd_svb_burmese_musketeer: "Бирманский мушкетерский корпус" #NT!
 nd_svb_burmese_musketeer_desc: "Постоянная пехота с фитильными ружьями, набранная в сельской местности и обученная в королевских лагерях, - фирменная сила Конбаунга, развернутая в дисциплинированных залпах и обученная боям в джунглях и на болотах." #NT!
 nd_svb_konbaung_reform: "Военная реформа Конбаунг" #NT!
 nd_svb_konbaung_reform_desc: "Организационные реформы Алаунгпайи: стандартизированный набор рекрутов из сельских округов, интегрированная подготовка по обращению с огнестрельным оружием и королевские указы об обращении с мушкетами, превращающие традиционные массовые наборы слонов в гибридную пороховую армию." #NT!
 nd_svb_theravada_state: "Государственная религия Тхеравады" #NT!
 nd_svb_theravada_state_desc: "Формальная кодификация буддизма Тхеравады как имперской государственной идеологии: королевский титул дхамма-раджа, государственные рукополагающие советы и конструкция чеди, привязанная к династической легитимности." #NT!
 nd_svb_imperial_roads: "Имперские паломнические дороги" #NT!
 nd_svb_imperial_roads_desc: "Великие магистральные дороги, соединяющие ватные храмы империи: маршруты паломничества, которые одновременно служат дорогами для марша войск и дорогами для сборщиков налогов, связывая столицы речных долин в единую административную ткань." #NT!
 nd_svb_dharma_protector: "Защитник Дхармы" #NT!
 nd_svb_dharma_protector_desc: "Царский титул Сасана-бхиракхита, защитник буддийского устроения. Король поддерживает сангху, спонсирует канонические советы и позолочивает великие чеди как кармические заслуги, достающиеся трону и династии." #NT!
 nd_svb_jingal_artillery: "Конбаунг Джингал Артиллерия" #NT!
 nd_svb_jingal_artillery_desc: "Поворотные орудия на шарнирах и зумборуки: крупнокалиберные настенные орудия и небольшие пушки, установленные на верблюдах, которые заполняли разрыв между мушкетной и полевой артиллерией в поздних бирманских армиях." #NT!
 nd_svb_pan_mainland_identity: "Пан-материковая идентичность" #NT!
 nd_svb_pan_mainland_identity_desc: "Общее цивилизационное сознание Тхеравады становится самосознательной имперской идентичностью: Суварнабхумин, а не кхмер, тайец или бирманец, — это то, как образованные люди все чаще называют себя." #NT!
 nd_svb_anti_colonial_stance: "Сопротивляйтесь колониальному проникновению" #NT!
 nd_svb_anti_colonial_stance_desc: "В то время как исторически раздробленный материк по частям достался Британской Бирме, Французскому Индокитаю и неравноправным договорам, навязанным Сиаму, единый Суварнабхуми противостоит европейской экспансии как единая великая держава и, возможно, еще удержит линию." #NT!
 nd_svb_rice_industrial_export: "Экспорт промышленного риса" #NT!
 nd_svb_rice_industrial_export_desc: "Дельты Чао Прайя и Иравади, осушенные и засеянные двойными культурами в промышленных масштабах, становятся рисовой корзиной муссонной Азии, питающей Сингапур, Гонконг, Калькутту и рабочие места Южно-Китайского моря." #NT!
  
  # ===== UNITS ===== 
 n_nd_svb_war_canoe: "Боевое каноэ" #NT!
 n_nd_svb_war_canoe_desc: "Длинное боевое каноэ из тикового дерева, на котором гребут барабанные экипажи, установлены охотники с луками и набито морскими пехотинцами, вооруженными копьями и огнестрельным оружием. Характерный речной военный корабль материковой Юго-Восточной Азии." #NT!
 a_nd_svb_toungoo_elephant: "Боевой слон Таунгу" #NT!
 a_nd_svb_toungoo_elephant_desc: "Тяжелая ударная кавалерия с массой слонов в стиле Таунгу: бронированные боевые слоны в массированных колоннах, каждый из которых несет погонщиков, лучников и людей с фитильными ружьями в хауда, выстроенных в дисциплинированные штурмовые линии." #NT!
 a_nd_svb_cakkavatti_guard: "Королевская гвардия Чаккаватти" #NT!
 a_nd_svb_cakkavatti_guard_desc: "Элитная домашняя тяжелая пехота дхамма-раджи: дворцовые стражи в доспехах, набранные из семей солдатской касты, лично присягнувшие вселенскому монарху." #NT!
 a_nd_svb_cakkavatti_guard_levy: "Королевская гвардия Чаккаватти" #NT!
 a_nd_svb_cakkavatti_guard_levy_desc: "Форма набора Королевской гвардии Чаккаватти." #NT!
 a_nd_svb_burmese_musketeer: "Бирманский мушкетер" #NT!
 a_nd_svb_burmese_musketeer_desc: "Легкая пехота с фитильными ружьями эпохи Конбаунг, обученная боям в джунглях и на болотах. Оплот пороховой армии позднего материка, одинаково хорошо справлявшийся как с обороной частоколов, так и с морскими десантами." #NT!
 a_nd_svb_burmese_musketeer_levy: "Бирманский мушкетер" #NT!
 a_nd_svb_burmese_musketeer_levy_desc: "Форма Леви бирманского мушкетера." #NT!
 a_nd_svb_jingal_artillery: "Джингалская артиллерия" #NT!
 a_nd_svb_jingal_artillery_desc: "Поворотное орудие Конбаунг и расчеты зумборука на верблюдах: поздний бирманский ответ европейской полевой артиллерии, мобильный и хорошо подходящий для местности речных долин империи." #NT!
  
  # ===== BUILDINGS ===== 
 nd_svb_baray: "Роял Барай" #NT!
 nd_svb_baray_desc: "Огромный муссонный резервуар на земляной насыпи кхмерского гидравлического города: улавливание паводков в сезон дождей для питания рисовых полей в засушливый сезон и пополнение регионального уровня грунтовых вод для устойчивой интенсификации сельского хозяйства." #NT!
 nd_svb_baray_maintenance: "Содержание Барая" #NT!
 nd_svb_baray_maintenance_desc: "Поддержание насыпей, шлюзов и питающих каналов от муссонной эрозии." #NT!
 nd_svb_pali_college: "Палийский монашеский колледж" #NT!
 nd_svb_pali_college_desc: "Монастырь-резидент, где рукоположенным монахам преподают грамматику Пали, канон Типитаки и философию Абхидхаммы, духовную и образовательную основу сангхи за материком." #NT!
 nd_svb_pali_college_maintenance: "Содержание Палийского колледжа" #NT!
 nd_svb_pali_college_maintenance_desc: "Копирование рукописей с пальмовыми листьями, монашеские одежды, а также ежедневные храмовые благовония и подношения даны." #NT!
 nd_svb_wat_temple: "Королевский храм Ват" #NT!
 nd_svb_wat_temple_desc: "Каменный храмовый комплекс в стиле Ангкор или Баган: концентрические галереи, центральный пранг или шпиль ступы, библиотеки, зал для посвящения и окружающие жилища монахов. Духовный якорь окружающего региона." #NT!
 nd_svb_wat_temple_maintenance: "Содержание храма Ват" #NT!
 nd_svb_wat_temple_maintenance_desc: "Ремонт песчаника, обновление позолоты, церемониальная одежда и постоянное возжигание благовоний перед центральными изображениями." #NT!
 nd_svb_bronze_buddha_foundry: "Литейный цех Бронзового Будды" #NT!
 nd_svb_bronze_buddha_foundry_desc: "Мастерская литья по выплавляемым моделям, где изготавливаются бронзовые изображения Будды, церемониальные колокола и позолоченные ритуальные сосуды для храмов по всей империи и на экспорт — крупнейшая отрасль потребительских товаров, связанная с религиозной преданностью." #NT!
 nd_svb_bronze_buddha_foundry_operation: "Литье по выплавляемым моделям бронзы" #NT!
 nd_svb_bronze_buddha_foundry_operation_desc: "Резьба по моделям из пчелиного воска, литье из глины, плавка медно-оловянного сплава, длительная полировка и золочение готовых бронзовых изображений Будды и священных сосудов, роскошные религиозные изделия из металла для храмов по всей империи." #NT!
 nd_svb_chedi_stupa: "Королевская Чеди-Ступа" #NT!
 nd_svb_chedi_stupa_desc: "Монументальный позолоченный курган-реликвия: династический памятник заслуг материкового королевства Тхеравады, обозначающий центральную ось столицы и собирающий преданность паломников по всему королевству." #NT!
 nd_svb_chedi_stupa_maintenance: "Содержание Чеди" #NT!
 nd_svb_chedi_stupa_maintenance_desc: "бновление сусальным золотом, ремонт каменной кладки и вечные подношения паломников." #NT!
 nd_svb_elephant_kraal: "Королевский слон Крааль" #NT!
 nd_svb_elephant_kraal_desc: "Массивный деревянный частокол, где диких слонов загоняют в загон, сортируют, запрягают и тренируют, это место разведения и тренировок имперского корпуса боевых слонов." #NT!
 nd_svb_elephant_kraal_maintenance: "Содержание Краала" #NT!
 nd_svb_elephant_kraal_maintenance_desc: "Ежедневный корм, кожаная упряжь и веревки, а также постоянное восстановление частоколов и кормушек." #NT!
 nd_svb_river_port: "Речной перевалочный порт" #NT!
 nd_svb_river_port_desc: "Обнесенные стеной порты в устье реки, такие как Баго, Аюттхая, Пномпень, Вьентьян или Янгон: укрепленные склады, иностранные кварталы и каменные доки, которые связывают речную торговлю империи с морскими маршрутами специй." #NT!
 nd_svb_river_port_maintenance: "Содержание речного порта" #NT!
 nd_svb_river_port_maintenance_desc: "Дноуглубление заиленных каналов, очистка корпусов, складов военно-морских запасов, а также постоянный ремонт каменных доков и деревянных пирсов." #NT!
  
  # ===== EVENT TOOLTIP VARIABLES ===== 
 nd_svb_formed_tt: "Суварнабхуми был сформирован." #NT!
 nd_svb_path_a_tt: "Путь: Чаккаватти, Вселенский буддийский монарх." #NT!
 nd_svb_path_b_tt: "Путь: Федерация Сангхи, короли разделены, дхарма объединена." #NT!
 nd_svb_path_c_tt: "Путь: Империя Трех Миров, космологическое управление государством." #NT!
  
  # ===== ADDITIONAL BUILDINGS ===== 
 nd_svb_lacquerware_atelier: "Ателье лаковых изделий" #NT!
 nd_svb_lacquerware_atelier_desc: "Цех гильдии, производящий бирманские юны и тайские лаковые изделия лай-род-нам: сок дерева титси наносится в несколько слоев на бамбук и дерево, затем вырезается, позолочивается или инкрустируется перламутром. Фирменный экспортный товар роскоши материковых судов." #NT!
 nd_svb_lacquerware_atelier_operation: "Производство лаковых изделий" #NT!
 nd_svb_lacquerware_atelier_operation_desc: "Вырезание сердцевин бамбука, наслаивание сока титси, полировка и украшение готовых изделий в придворном стиле." #NT!
 nd_svb_gem_workshop: "Королевская мастерская драгоценных камней" #NT!
 nd_svb_gem_workshop_desc: "Ателье гильдии, где рубины Могока, сапфиры Пайлин, а также шпинель и жемчуг, продаваемые внутри страны, ограняются, полируются и оправляются в золото для королевского двора и экспортного рынка." #NT!
 nd_svb_gem_workshop_operation: "Королевская оправа драгоценных камней" #NT!
 nd_svb_gem_workshop_operation_desc: "Огранка и полировка необработанных камней, закрепка в золото и серебро, а также оценка готовых драгоценностей для использования в суде и на экспорт." #NT!
 nd_svb_royal_arsenal: "Королевский Арсенал" #NT!
 nd_svb_royal_arsenal_desc: "Государственный оружейный завод и пороховой завод: селитра из внутренних месторождений, железо с холмов и пиломатериалы из тиковых лесов объединяются в мушкеты с фитильными замками, поворотные ружья и бронзовые пушки под королевской монополией." #NT!
 nd_svb_royal_arsenal_operation: "Королевское производство огнестрельного оружия" #NT!
 nd_svb_royal_arsenal_operation_desc: "Сверление отверстий, установка приклада, шлифовка пороха, а также испытания и размещение готового огнестрельного оружия королевского выпуска." #NT!
  
  # ===== DESTINY ADVANCES ===== 
 nd_svb_destiny: "Суварнабхуми предназначен" #NT!
 nd_svb_destiny_desc: "Страна Золота пробуждается к своему имперскому призванию. От шпилей Пагана до чеди Вьентьяна колесо Чаккаватти начинает вращаться. Достигните стабильности 75, чтобы укрепить новый порядок и открыть путь судьбы." #NT!
 nd_svb_dest_champa_conquest: "Завоевание Чампы" #NT!
 nd_svb_dest_champa_conquest_desc: "Прибрежные города Чамов (Симхапура, Виджая) должны пасть под шафрановым знаменем, прежде чем восточная граница будет обеспечена. Протолкните колонны слонов через хребет Аннамит и разрушьте последнее индуистское королевство на материковой части Юго-Восточной Азии. Требуется: владеть Симхапурой и Виджая, численность армии 30 человек." #NT!
 nd_svb_dest_red_river: "Красная река подчиняется" #NT!
 nd_svb_dest_red_river_desc: "Чи Вьет тысячелетие удерживал Красную реку против южных империй. Чтобы завершить круг Чаккаватти, даже Танг Лонг должен подчиняться Пегу. Требуется: собственный Танг Лонг, общее развитие 9500, численность армии 50." #NT!
 nd_svb_dest_universal_monarch: "Царство Вселенского Монарха" #NT!
 nd_svb_dest_universal_monarch_desc: "Юньнань на севере, Малакка и Темасек на юге: четыре главных якоря колеса Чаккаватти. То, что Байиннаунг потерял за поколение, мы сохранили по воле судьбы. Открывает трон Чаккаватти. Требуется: владеть Куньмином, Малаккой и Темасеком, размер армии 75, престиж 75." #NT!
 nd_svb_dest_sinhalese_axis: "Сингальская ось" #NT!
 nd_svb_dest_sinhalese_axis_desc: "Транс-материковая сангха рождается из Махавихары в Анурадхапуре. Восстановить сингальскую ось рукоположения с помощью пожертвований с материка и печатного станка, чтобы связать каждый монастырь единой ортодоксальностью. Требуется: собственная Анурадхапура, золото 1000, печатный станок." #NT!
 nd_svb_dest_three_worlds_flesh: "Три мира, ставшие плотью" #NT!
 nd_svb_dest_three_worlds_flesh_desc: "Космология Трай Пхума требует, чтобы империя была зеркалом горы Меру в мире смертных: позолоченные чеди, лакированные залы, инкрустированные драгоценными камнями изображения Будды. Экономика экспорта предметов роскоши поддерживает космологическое состояние. Требуется: общее развитие 9500, драгоценные камни и лаковые изделия на ваших рынках, престиж 50." #NT!
 nd_svb_dest_civilization_suvarnabhumi: "Цивилизация Суварнабхуми" #NT!
 nd_svb_dest_civilization_suvarnabhumi_desc: "От рукописных библиотек Пэгана до персидских кварталов Аюттайи — империя становится евразийским перекрестком литературы и образования. Единая цивилизация Тхеравады, процветающая и грамотная, занимает свое место среди великих империй мира. Открывает доступ к Палийскому университету. Требуется: принять Научную революцию, золото 3000, общее развитие 12500." #NT!
  
  # ===== DESTINY EVENTS ===== 
 nd_svb.8.t: "Колесо вращается" #NT!
 nd_svb.8.d: "То, что было предсказано в Сутта Питаке, наконец свершилось: Чаккаватти возник в Стране Золота, и колесо Дхармы вращается снова. От западного Иравади до восточного Меконга монастыри развеваются под шафрановым знаменем; от побережья Чама до проливов Шри-Ланки посольства ищут вселенского монарха. Придворные астрологи составляли гороскопы; министры обсуждают доктрину. Дорога впереди разветвляется: должно ли Колесо вращаться мечом завоевания или более мягким поворотом закона Дхармы?" #NT!
 nd_svb.8.a: "Пусть колесо вращается." #NT!
 nd_svb.9.t: "Водопад на побережье Чам" #NT!
 nd_svb.9.d: "Башни из красного кирпича Симхапуры, стены гавани Виджаи: последние крепости чамов сдались нашему отряду слонов. Индуистское королевство, которое тысячу лет боролось с кхмерами и Дайвьетом, наконец, склонилось перед буддийским универсальным монархом. Восточная граница обеспечена; Южно-Китайское море открывается для нашего судоходства. Хребет Аннамит, древний барьер между материком и побережьем, больше не является границей, а является внутренней дорогой." #NT!
 nd_svb.9.a: "Вперед к Красной реке." #NT!
 nd_svb.10.t: "Танг Лонг подчиняется" #NT!
 nd_svb.10.d: "Там, где династия Ле Дай Вьет отразила монгольских ханов и императоров Мин, наши войска сделали то, чего не удавалось ни одной южной державе: захватили сам Танг Лонг. Дельта Красной реки с ее плотным заселением рисом и укрепленными цитаделями теперь подчиняется Чаккаватти. Вопрос в том, как управлять этим самым древним и самым упрямым из материковых королевств: как Суварнабхумин, как и все остальные, или как северный марш с вечным гарнизоном?" #NT!
 nd_svb.10.a: "Сделайте Дхи Вьет провинцией Суварнабхуми." #NT!
 nd_svb.10.b: "Разместите гарнизон на Красной реке как на северном марше." #NT!
 nd_svb.11.t: "Царство Вселенского Монарха" #NT!
 nd_svb.11.d: "Куньмин на севере, Малакка и Темасек на юге: четыре основных якоря принадлежат нам. От соляных копей Тай-И в Юньнани до пристаней для специй в проливе, от побережья Чам до сингальской оси посвящения — вся мандала материковой части Юго-Восточной Азии подчиняется одному Чаккаватти. Дхамма-раджа находится в космическом центре, а шафрановое колесо вращает территорию, о которой Байиннаунг мог только мечтать. Теперь мы должны решить, какой это должна быть империя: централизованная дхарма-империя, управляемая с единого трона, или вершина подчиненной мандалы, в которой субкороли правят под защитой вселенского монарха?" #NT!
 nd_svb.11.a: "Единая Дхарма-Империя." #NT!
 nd_svb.11.b: "Мандала субкоролей достигает своего апогея." #NT!
 nd_svb.12.t: "Линия Махавихары" #NT!
 nd_svb.12.d: "Старшие монахи прибыли из Махавихары в Анурадхапуру, неся непрерывное сингальское посвящение обратно своим ученикам на материке. Там, где Анаврахта и Рамкамхенг получали его по частям, мы держим всю ось: Анурадхапура, Паган, Аюттхая, Вьентьян, печатные станки уже работают, тиражируя Типитаку на палийском, кхмерском, бирманском, монском и лаосском письмах. Сангха теперь представляет собой единую ткань, простирающуюся от дагоба Шри-Ланки до дельты Меконга." #NT!
 nd_svb.12.a: "Православие установлено." #NT!
 nd_svb.13.t: "Кодифицированные три мира" #NT!
 nd_svb.13.d: "Трай Пхум короля Литая стал имперской космологией: каждый ватный зал расписан тридцатью одним царством, каждый чеди позолочен, как смертная гора Меру, каждое изображение Будды отлито из бронзы и покрыто лаком в придворных мастерских. Рубины Могока, сапфиры Пайлин и ювелирное ремесло Аюттхая составляют видимое богатство империи. Цивилизационная идеология требует организационного ядра для ее поддержки: должны ли придворные мастерские сосредоточить мастерство в столице, или же экономика заслуг паломнических маршрутов будет способствовать процветанию всех храмов-ватов королевства?" #NT!
 nd_svb.13.a: "Сосредоточьте ремесло при дворе." #NT!
 nd_svb.13.b: "Развивайте паломническую экономику ват." #NT!
 nd_svb.14.t: "Цивилизация Суварнабхуми" #NT!
 nd_svb.14.d: "От пальмовых библиотек Пэгана до персидского квартала Аюттхаи, от монахов Махавихары до астрономов Конбаунга, Суварнабхуми стал самосознательной цивилизацией, равной двору Мин, дурбару Великих Моголов, Османской Порте и европейским канцеляриям. Палийские комментарии, придворные хроники и астрономические трактаты выходят из типографий. Государство сангхи произвело свой собственный ренессанс. Теперь старейшины обсуждают интеллектуальное устройство империи: расцвет текстологии во всех школах или единый канонический совет, который закрепит ортодоксальность на века?" #NT!
 nd_svb.14.a: "Расцвет палийского письма." #NT!
 nd_svb.14.b: "Созвать канонический собор." #NT!
  
  # ===== DESTINY TIMED MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_svb_dest_dai_viet_subjugation: "Đại Việt покоренный" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_dai_viet_subjugation: "Дельта Красной реки впадает в собственно Суварнабхуми. Армии-ветераны продвигаются вперед, повод для войны легко найти, а длинные линии снабжения империи простираются за пределы муссонных дождей." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_red_river_garrison: "Гарнизон Красной реки" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_red_river_garrison: "Граница Дивьет удерживается как укрепленный северный марш: тяжелые гарнизоны, длинные оборонительные стены вдоль реки Хонг и набираемые на месте рекрутские полки, которые могут быть мобилизованы в сезон." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_dharma_imperium: "Империум Дхармы" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_dharma_imperium: "Единственный сакральный трон правит материком от Пэгана до Тонкина. Завоеванные культуры быстро интегрируются, рисовые корзины великих дельт кормят имперское население, а ресурсы, запрещенные к сбору налогов, могут быть мобилизованы очень быстро." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_mandala_apex: "Мандала в Апексе" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_mandala_apex: "Система данников достигает своего пика: субкороли в Пегу, Аюттхая, Лан Ксанге и Дай Вьет обеспечивают набор слоновьих корпусов и поддержку в быстрых маршах, но сангхе приходится прокормить себя на огромных расстояниях." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_court_atelier: "Система придворных ателье" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_court_atelier: "В королевских мастерских Пегу, Аюттхая и Вьентьяна сосредоточены мастера империи: позолоченная стеклянная посуда, лак с драгоценными камнями, а гильдии бюргеров процветают под королевской защитой." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_pilgrim_economy: "Странствующая экономика" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_pilgrim_economy: "Великая сеть ват-храмов привлекает преданность мирян по всей империи: кварталы паломников наполняют города, монастырские аптеки распространяют медицинские знания, а экономика заслуг смазывает обычную торговлю." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_pali_renaissance: "Палийский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_pali_renaissance: "Типографии печатают палийские комментарии, кхмерские хроники и бирманские астрономические трактаты. Грамотность распространяется из монастырей среди мирского населения, и империя быстро восстанавливается после завоевательных войн." #NT!
 STATIC_MODIFIER_NAME_nd_svb_dest_canonical_council: "Канонический Совет" #NT!
 STATIC_MODIFIER_DESC_nd_svb_dest_canonical_council: "Единственный великий совет устанавливает ортодоксальную Типитаку для всего Суварнабхуми. Власть духовенства и аристократическая грамотность растут вместе, но неортодоксальные школы подавляются, а политическое урегулирование является непростым." #NT!
  
  # ===== DESTINY BUILDINGS ===== 
 nd_svb_cakkavatti_throne: "Трон Чаккаватти" #NT!
 nd_svb_cakkavatti_throne_desc: "Зал аудиенций вселенского монарха: огромный зал с колоннами в космическом центре королевства, где послы четырёх сторон света преклоняют колени перед дхамма-раджей. Только капитал." #NT!
 nd_svb_cakkavatti_throne_maintenance: "Уход за тронным залом" #NT!
 nd_svb_cakkavatti_throne_maintenance_desc: "Придворные шелка, церемониальные регалии и ежедневное снабжение свиты вселенского монарха." #NT!
 nd_svb_pali_university: "Палийский университет" #NT!
 nd_svb_pali_university_desc: "Большой схоластический монастырь, расположенный за материком: типографии, выпускающие Типитаку, лекционные залы, в которых обсуждается философия Абхидхаммы, и палийская грамматика, преподаваемая наряду с санскритом, персидским и астрономическими науками. Интеллектуальная столица цивилизации Тхеравады." #NT!
 nd_svb_pali_university_maintenance: "Содержание Палийского университета" #NT!
 nd_svb_pali_university_maintenance_desc: "Копирование рукописей, печатные издания Типитаки, ежедневные благовония и подношения даны, а также одежды местной сангхи." #NT!
  
  # ===== DESTINY VARIABLE TOOLTIP STUBS (already exist above, no change) ===== 
  
  # ===== BUREAUCRACIES ===== 
 svb_royal_sangha_council_bureaucracy: "Королевский совет Сангхи" #NT!
 svb_royal_sangha_council_bureaucracy_desc: "Назначаемый государством Сангхараджа и совет старейшин тхера (модель Судхаммы, формализованная реформами очистки сасан Байиннаунга 1560-х годов и бирманским Татанабаингом 1784 года) удостоверяют рукоположения, полицейскую монашескую дисциплину и разрешают доктринальные споры в транс-материковой сангхе. Сплоченность Тхеравады становится обязательным институтом над любой отдельной сферой, но настоятели провинций возмущаются контролем со стороны центра." #NT!
 svb_sakdina_hierarchy_bureaucracy: "Сакдина Иерархия" #NT!
 svb_sakdina_hierarchy_bureaucracy_desc: "Кодификация ранга короля Боромматрайлокканата 1454 года: каждому подданному присваивается числовая сакдина, соответствующая раю земли, определяющему судебному старшинству, праву на получение служебных грантов и даже юридической процедуре (вес показаний, масштабируемый по рангу). Определяющая административная инновация Аюттайи, скопированная во всем мире Тай-Кхмер-Мон." #NT!
 svb_mandala_tributary_ring_bureaucracy: "Кольцо-данник Мандалы" #NT!
 svb_mandala_tributary_ring_bureaucracy_desc: "Индиаизированный круг королей: верховный чаккаватти в космическом центре, окруженный королями-данниками, платящими бунга-мас, преклоняющими колени во время коронации и предоставляющими рекруты на войну. Превращение Байиннаунгом Маха Чаккрапхата в 1564 году в вассального короля Пегу является хрестоматийным случаем. Суверенитет исходит из престижа, а не из фиксированных границ." #NT!
 svb_court_brahmin_college_bureaucracy: "Колледж придворных браминов" #NT!
 svb_court_brahmin_college_bureaucracy_desc: "Пхра Маха Раджагуру и Девасатан: придворные брамины, оставшиеся от индианизации до Тхеравады, для проведения обрядов коронации (церемония Боромматрайлокканата 1460-х годов), сезонных ритуалов качелей Триямпавай и астролого-космологических консультаций. Каста специалистов иностранного происхождения, непосредственно служащая трону, минуя как сангху, так и благородную иерархию." #NT!
 svb_royal_elephant_corps_bureaucracy: "Королевский слоновий корпус" #NT!
 svb_royal_elephant_corps_bureaucracy_desc: "Королевская слоновья конюшня: разведение боевых слонов, наследственная каста погонщиков и космологическое «слоновье сокровище», которое отмечает семь регалий вселенского монарха. Война белых слонов Байиннаунга против Аюттхая в 1563 году превратила пойманного альбиноса в повод для войны. Корпус одновременно является военным ударом, королевским престижем и буддийской иконографией." #NT!
 svb_phrai_corvee_registry_bureaucracy: "Реестр Пхрай Корве" #NT!
 svb_phrai_corvee_registry_bureaucracy_desc: "Призыв рабочих в Аюттхая. Свободные простолюдины (phrai luang) зарегистрированы в качестве чиновников-най и должны отслужить шесть месяцев королевской службы в год: общественные работы, ремонт дамб во время сезона дождей, королевское зернохранилище, военная мобилизация. Кодифицированный наряду с сакдиной, но механически обособленный: это мобилизационная база царства. Дворяне сражаются за графства фрай ожесточеннее, чем за землю." #NT!
  
  # ===== BUREAUCRACY AUTHORITY (auto-modifier on formation) ===== 
 AUTO_MODIFIER_NAME_nd_svb_bureaucracy_authority: "Мандала Чаккаватти" #NT!
 AUTO_MODIFIER_DESC_nd_svb_bureaucracy_authority: "При формировании [SVB.GetName] получает институциональный охват царства универсального монарха: способность принимать историческую бюрократию материковой Тхеравады. Столица предоставляет один слот; Прерогатива чаккаватти дает еще два." #NT!
