l_russian:
  # === Variable tooltips (required for hidden_effect set_variable lines) === 
 nd_bnh_formed_tt: "Бет Нахрейн сформирована." #NT!
 nd_bnh_path_a_tt: "После восстановления Патриарха." #NT!
 nd_bnh_path_b_tt: "Вслед за защитниками Тур Абдина." #NT!
 nd_bnh_path_c_tt: "После Эдессенского Возрождения." #NT!
  # === Formation Event Modifiers === 
 STATIC_MODIFIER_NAME_nd_bnh_patriarchs_restoration: "Восстановление Патриарха" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_patriarchs_restoration: "Католикос Востока возводится на трон в Мосуле, патриархальные грамоты вновь доходят из Тричура в Тебриз, а сельские месопотамские приходы реорганизуются под королевским покровительством. Духовенство, говорящее на арамейском языке, является основой нового государства." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_tur_abdin_defenders: "Защитники Тур Абдина" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_tur_abdin_defenders: "Дейрайюто Мор Габриэля и Дейр аль-Зафаран присягают королевской верности. Горное ополчение из христианских деревень охраняет границу нового королевства; монастырские капитулы интендируют войска, которые они собирают." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_edessene_renaissance: "Эдессенский ренессанс" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_edessene_renaissance: "Королевство возрождает латино-сирийское согласие времен крестоносцев, которое когда-то воплощало графство Эдесса. Итальянских купцов принимают в Мосуле, латинские священнослужители преподают вместе с арамейскими схоластами, а в западных канцеляриях королевство считается уважаемым христианским пэром." #NT!
  # === DHE Modifiers === 
 STATIC_MODIFIER_NAME_nd_bnh_translators_mosul: "Переводчики Мосула" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_translators_mosul: "Круг переводов Бар-Хебреуса в Мосуле переводит греческую философию, персидскую медицину и арабскую астрономию на сирийский и арамейский языки, снабжая каждую восточно-христианскую кафедру полезным корпусом." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_qanat_revival: "Канат Возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_qanat_revival: "Королевские геодезисты наносят на карту каждую изломанную линию водоносного горизонта в низовьях нижнего Тигра и Евфрата. Гидротехника сасанидской эпохи восстановлена, и поля Савада заполняются крестьянами, возвращающимися с высокогорья." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_river_caravans: "Речные караваны" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_river_caravans: "Коридор Мосул-Багдад вновь открыт по королевской лицензии. Гильдии караванов, говорящие на арамейском языке, облагают налогом трафик Тигра и Евфрата, а месопотамские купцы достигают Персидского залива, Алеппо и Анатолийского нагорья." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_mor_gabriel_endowment: "Фонд Мор Габриэля" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_mor_gabriel_endowment: "Королевский дар официально оформляет Мор Габриэль как институт королевства. Его скрипторий становится архивом канцелярии; его аббат входит в состав королевского совета." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_eastern_missions: "Восточные миссии" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_eastern_missions: "Патриархия вновь направляет митрополитов в епархии Шелкового пути. Самарканд, Тебриз и Малабарское побережье отправляют подтверждения обратно в Мосул; Арамейская молитва слышна от Средиземного моря до Южно-Китайского моря." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_mesopotamian_consolidation: "Месопотамская консолидация" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_mesopotamian_consolidation: "Королевство направляет весь свой административный вес на центральную часть Месопотамии. В деревнях Савада арамейский язык вытесняет арабский и курдский языки, а епархиальные реестры патриархата переиздаются на сирийском языке." #NT!
  # === Formation Event === 
 nd_bnh.1.t: "Совет Мосула" #NT!
 nd_bnh.1.d: "В Мосуле провозглашается Бет-Нахрейн, Земля Между Реками. Католикос Востока, аббаты Тур-Абдина, сохранившиеся латинские капелланы из графства Эдесса и арамейскоязычная знать Савада собираются в соборе Старого города. Господство монголов окончательно рухнуло; древнее христианское государство Месопотамии теперь должно решить, какой характер оно примет.\n\nНа полу совета стоят три видения. Католикос выступает за восстановление королевства вокруг Патриархата, сохранившегося института, который дает арамейскоязычным народам постоянную идентичность. Аббаты Тур Абдина требуют создания военизированного горного королевства с монашеской крепостью по своей сути, готовой пережить любого повелителя, который придет после. Фракция Эдессены, наследники крестоносно-сирийского кондоминиума, призывают к сотрудничеству с Латинским Западом и итальянскими торговыми республиками: королевство как респектабельный христианский пэр.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_bnh.1.a: "Католикос возглавит: восстановит Патриархат." #NT!
 nd_bnh.1.b: "Тур Абдин будет охранять нас: укрепить нагорье." #NT!
 nd_bnh.1.c: "Эдесса будет торговать с нами: вступить в бой с латинским западом." #NT!
  # === DHE 2: Translators of Mosul === 
 nd_bnh.2.t: "Хранилище тайн" #NT!
 nd_bnh.2.d: "Григорий Бар-Гебрей, Мафриан Востока, завершает работу над своим «Хранилищем тайн» (сирийским библейским комментарием, основанным на греческой, персидской и арабской науке) и своим «Хрониконом», универсальной историей, которая определяет личность Бет Нахрейн. Бюро переводов в Мосуле переводит Аристотеля, Галена и Птолемея на арамейский язык, а с арамейского языка на латынь и арабский язык, окружающие королевство. Христианская научная мысль о Месопотамии, утраченная в 1258 году, возродилась, и ее книги читаются от Трихура до Реймса." #NT!
 nd_bnh.2.a: "Обучение арамейскому языку живет." #NT!
  # === DHE 3: Mongol-Broken Land === 
 nd_bnh.3.t: "Сломанные каналы" #NT!
 nd_bnh.3.d: "Королевство унаследовало опустошенную сельскую местность. Сети каналов к югу от Мосула, поддерживаемые администрациями Сасанидов и Аббасидов, были разрушены в ходе монгольских кампаний; целые участки Савада превратились в кустарники. Королевские геодезисты предложили королю два стратегических ответа. Первый: восстановить ирригационную сеть, вернуть сельскохозяйственный центр Месопотамии и переселить крестьянские деревни, снабжавшие великие города. Второй: отказаться от ирригации, направить рабочую силу и капитал королевства в сухопутный торговый коридор, который уже соединяет Мосул с Багдадом и далее с Басрой." #NT!
 nd_bnh.3.a: "Восстановить канаты. Земля должна кормить королевство." #NT!
 nd_bnh.3.b: "Восстановить торговые пути. Караваны, а не каналы." #NT!
  # === DHE 4: Mor Gabriel Endowment === 
 nd_bnh.4.t: "Шафрановая Корона" #NT!
 nd_bnh.4.d: "Королевский двор официально оформляет Мор Габриэль (монастырь, основанный в 397 году, старейший действующий христианский монастырь на земле) как учреждение королевства. Его настоятель получает титул королевского мафриана; его скрипторий включен в состав королевской канцелярии; его судебная палата признана вершиной сирийского канонического права. Бет Нахрейн связана с монастырями с шафрановыми камнями, которые пронесли христианскую Месопотамию через девять столетий господства." #NT!
 nd_bnh.4.a: "Мор Габриэль — сердце королевства." #NT!
  # === DHE 5: Eastern Missions === 
 nd_bnh.5.t: "Дальние епархии" #NT!
 nd_bnh.5.d: "Католикос представляет царю реестры восточных епархий: Самаркандской, Тебризской, Ханбалыкской, Малабарского побережья, синодальные грамоты митрополитов, паства которых до сих пор читает арамейские молитвы от Памира до Бенгальского залива. Патриархат предлагает направить новых митрополитов, восстановить миссионерские реестры и активизировать сеть. Но другие утверждают, что королевству следует сосредоточить свою энергию дома: в центре Месопотамии, а не на далеких границах." #NT!
 nd_bnh.5.a: "Отправьте митрополитов на восток. Церковь Востока живёт." #NT!
 nd_bnh.5.b: "Объединитесь дома. Сначала Месопотамия." #NT!
  # === Heritage Advances === 
 nd_bnh_catholicate_of_seleucia: "Католицат Селевкии" #NT!
 nd_bnh_catholicate_of_seleucia_desc: "Патриаршая резиденция Церкви Востока восстановлена ​​в Мосуле, с официальной юрисдикцией над епархиями диаспоры. Католикос становится духовным премьер-министром королевства." #NT!
 nd_bnh_mor_gabriel_network: "Сеть Мор Габриэль" #NT!
 nd_bnh_mor_gabriel_network_desc: "Монастыри Тур Абдин (Мор Габриэль, Дейр аль-Зафаран, Мор Хананьо) признаны государственной сетью, с их скрипториями, судебными палатами и грантами на сельские земли, оформленными в королевской хартии." #NT!
 nd_bnh_tur_abdin_highlanders: "Тур Абдин Хайлендерс" #NT!
 nd_bnh_tur_abdin_highlanders_desc: "Ополчение монашеской деревни нагорья Тур-Абдин, те же самые бойцы, которые удерживали регион при правителях Артукида, Монгола и Ак-Коюнлу, официально оформлены как королевский ополчение." #NT!
 nd_bnh_sawad_irrigation: "Савад Ирригация" #NT!
 nd_bnh_sawad_irrigation_desc: "Канатная и канальная инфраструктура низменностей Тигра и Евфрата восстанавливается под управлением короны. Геодезисты наносят на карту разрушенные сети монгольской эпохи; королевский корпус устраняет нарушения." #NT!
 nd_bnh_hudaye_book: "Книга законов Худайе" #NT!
 nd_bnh_hudaye_book_desc: "Кодификация христианского месопотамского гражданского права Бар-Хебреем (1276 г., Худайе, Книга указаний) принята в качестве свода законов королевства, опираясь на римские, сасанидские и исламские прецеденты через сирийскую структуру." #NT!
 nd_bnh_syriac_translation_movement: "Сирийское движение переводчиков" #NT!
 nd_bnh_syriac_translation_movement_desc: "Средневековые программы-переводчики восстановлены. Греческая философия, персидская медицина и арабская астрономия в огромных количествах проникли в сирийский язык, передаваясь оттуда в латинский христианский мир и арабоязычные дворы." #NT!
 nd_bnh_maphrianate: "Мафрианат Востока" #NT!
 nd_bnh_maphrianate_desc: "Мафриан, восточный викарий Патриарха, управляет месопотамскими епархиями из Мосула, а Патриарх управляет из Антиохии. Двуглавая религиозная администрация расширяет дипломатические возможности королевства." #NT!
 nd_bnh_mosul_baghdad_caravans: "Караваны Мосул-Багдад" #NT!
 nd_bnh_mosul_baghdad_caravans_desc: "Вновь открыт великий коридор сухопутной торговли Месопотамии, соединяющий горные пути Анатолии с Персидским заливом. Арамейский язык остается языком общения караванов." #NT!
 nd_bnh_edessene_schoolmen: "Эдессенские схоласты" #NT!
 nd_bnh_edessene_schoolmen_desc: "Наследство Эдессской школы, возрожденное через латино-сирийские академии графства Эдесса. Изучение греческого и латыни дополняет учебную программу по сирийскому языку." #NT!
 nd_bnh_tur_abdin_wardens: "Тур Абдин Стражи" #NT!
 nd_bnh_tur_abdin_wardens_desc: "Стражи монашеского капитула Мор Габриэля и окружающих крепостей превратились в сборную пехотную гвардию, регулярное формирование, выросшее из горного ополчения." #NT!
 nd_bnh_mesopotamian_revival: "Месопотамское возрождение" #NT!
 nd_bnh_mesopotamian_revival_desc: "Систематическое восстановление сети каналов к югу от Мосула. Королевские инженеры предпринимают то, что разрушила монгольская катастрофа: возрождение сельского хозяйства Месопотамии на сасанидских основах." #NT!
 nd_bnh_silk_road_metropolitanate: "Митрополия Шелкового пути" #NT!
 nd_bnh_silk_road_metropolitanate_desc: "Епархии Шелкового пути Патриархата (Самаркандская, Ханбалыкская, Малабарская) возобновляются в рамках государственной политики. Миссионерская сеть Церкви Востока становится дипломатическим инструментом Царства." #NT!
 nd_bnh_bar_hebraeus_court: "Суд Бара Гебреуса" #NT!
 nd_bnh_bar_hebraeus_court_desc: "Круг врачей, астрономов и переводчиков эрудита Мафриана представляет собой академию королевства. Греко-сирийско-арабская трехъязычная стипендия его мосульской школы становится государственным учреждением." #NT!
 nd_bnh_christian_diwan: "Кристиан Диван" #NT!
 nd_bnh_christian_diwan_desc: "Королевство адаптирует модель сасанидско-аббасидского дивана к христианскому управлению. Писцы, использующие арамейский алфавит, параллельно ведут налоговые, военные и церковные счета." #NT!
 nd_bnh_jundishapur_tradition: "Джундишапурская традиция" #NT!
 nd_bnh_jundishapur_tradition_desc: "Медико-академическая традиция, восходящая к Сасанидской академии в Гондешапуре, где врачи-христиане-несторианцы сохранили галеновскую медицину, восстанавливается как учреждение царства." #NT!
 nd_bnh_patriarchal_diaspora: "Сеть патриархальной диаспоры" #NT!
 nd_bnh_patriarchal_diaspora_desc: "Переписка Патриархата с диаспорами (от Леванта до Малабара) превращается в формальный дипломатический инструмент под королевским патронажем." #NT!
 nd_bnh_highland_garrison: "Система Хайлендского гарнизона" #NT!
 nd_bnh_highland_garrison_desc: "Монашеско-военная система Тур Абдина расширена до линии горных фортов всего королевства, подчиняющейся Мор Габриэлю. В каждой крепости есть свой монашеский капитул." #NT!
 nd_bnh_riverine_pontoneers: "Речные понтонеры" #NT!
 nd_bnh_riverine_pontoneers_desc: "Инженерный корпус королевства специализируется на строительстве мостов и понтонов Тигр-Ефрат и является наследником речных инженеров Сасанидов и Аббасидов." #NT!
 nd_bnh_crown_of_two_rivers: "Корона двух рек" #NT!
 nd_bnh_crown_of_two_rivers_desc: "Королевство институционализирует свою месопотамскую идентичность в конституционной доктрине: король является защитником Двухрек и всех, кто живет между ними: сирийцев, арабов, курдов и армян." #NT!
 nd_bnh_aramaic_civil_service: "Арамейская государственная служба" #NT!
 nd_bnh_aramaic_civil_service_desc: "Бюрократический сирийский язык кодифицирован для управления в масштабе всего королевства, параллельно арабскому и персидскому официальным языкам соседних государств. На каждом диване писцы пишут на арамейском языке." #NT!
 nd_bnh_catholicate_constitutional: "Католический конституционный" #NT!
 nd_bnh_catholicate_constitutional_desc: "Католикос Востока занимает официальное место совещательного голоса в абсолютистском суде, христианском аналоге правовых традиций суннитских и шиитских улемов." #NT!
 nd_bnh_mosul_foundries: "Литейные заводы Мосула" #NT!
 nd_bnh_mosul_foundries_desc: "Железо из гор Хаккари и медь с холмов Диярбакыра питают военную промышленность королевства поздней эпохи, сосредоточенную в Мосуле." #NT!
 nd_bnh_syriac_print: "Сирийская печатная революция" #NT!
 nd_bnh_syriac_print_desc: "В королевстве применяется сирийская печать подвижным шрифтом. Арамейские писания, законы и хроники наконец-то обрели печатную жизнь и передаются по диаспоре." #NT!
 nd_bnh_mesopotamian_industry: "Месопотамская промышленность" #NT!
 nd_bnh_mesopotamian_industry_desc: "Приречные мельницы, литейные и текстильные мастерские нижнего Тигра объединены в единую промышленную базу. Месопотамия вновь присоединяется к продуктивной экономике современного мира." #NT!
 nd_bnh_civic_synod: "Арамейский Гражданский Синод" #NT!
 nd_bnh_civic_synod_desc: "Патриархальный синод преобразован в гражданскую палату, что дает арамейскому христианству формальный конституционный голос в управлении королевством в поздние времена." #NT!
  # === Buildings === 
 nd_bnh_catholicate_palace: "Католический дворец" #NT!
 nd_bnh_catholicate_palace_desc: "Патриаршая резиденция в Мосуле. Католикос Востока вершит здесь суд, вершит епархиальное правосудие и ведет реестр церквей диаспоры, написанный на арамейском языке." #NT!
 nd_bnh_tur_abdin_monastery: "Монастырь Тур Абдин" #NT!
 nd_bnh_tur_abdin_monastery_desc: "Монастырский комплекс на вершине холма по модели Мор Габриэль/Дейр аль-Зафаран. Скрипторий, судебная палата и общежитие для паломников; учреждение, которое удерживало христианское население Месопотамии при каждой смене повелителя." #NT!
 nd_bnh_qanat_works: "Канатский завод" #NT!
 nd_bnh_qanat_works_desc: "Подземные оросительные каналы, истощающие горные водоносные горизонты в низинные поля, — инженерное наследие Сасанидской и Аббасидской Месопотамии, восстановленное под руководством коронных геодезистов." #NT!
 nd_bnh_translation_house: "Дом сирийских переводов" #NT!
 nd_bnh_translation_house_desc: "Греческая философия, персидская медицина и арабская астрономия проникают здесь на сирийский язык, а затем передаются на запад через Эдессенский канал на латынь. Институциональный потомок христианских переводчиков Байт аль-Хикмы." #NT!
 nd_bnh_river_caravanserai: "Река Караван-сарай" #NT!
 nd_bnh_river_caravanserai_desc: "Большие придорожные хостелы коридора Мосул-Багдад, которыми управляют сирийско-христианские гильдии, говорящие на арамейском языке. Речная артерия месопотамской торговли." #NT!
 nd_bnh_bar_hebraeus_library: "Библиотека Бар-Эбреус" #NT!
 nd_bnh_bar_hebraeus_library_desc: "Великая мосульская библиотека Мафриана Бар-Хебреуса, унаследованная его преемниками и перестроенная в ведущее учебное заведение королевства. Здесь впервые был составлен «Хранилище Тайн»." #NT!
 nd_bnh_jundishapur_school: "Медицинская школа Джундишапура" #NT!
 nd_bnh_jundishapur_school_desc: "Восстановленная медицинская академия королевства, духовная наследница Сасанидского Гондешапура, где несторианские врачи сохранили галеновскую медицину. Здесь обучаются хирурги, травники и астрономы." #NT!
 nd_bnh_highland_fortress: "Хайлендская крепость" #NT!
 nd_bnh_highland_fortress_desc: "Модель Тур Абдина распространилась по всему королевству. Каждая крепость сочетает в себе оборонительную цитадель с небольшим монашеским капелланом, обеспечивающим капелланские и судебные услуги своему гарнизону." #NT!
 nd_bnh_mosul_foundry: "Мосульский литейный завод" #NT!
 nd_bnh_mosul_foundry_desc: "Железо из гор Хаккари, медь с холмов Диярбакыра — все это выковано на центральном оружейном заводе королевства. Отлитые здесь пушки вооружают армию Бет Нахрейн поздней эпохи." #NT!
 nd_bnh_river_manufactory: "Речная мануфактура" #NT!
 nd_bnh_river_manufactory_desc: "Речные фабрики, обеспечивающие производство текстиля и бумаги, нижний Тигр превратился в промышленный коридор. Производство бумаги и книг на арамейском языке для диаспоры." #NT!
  # === Building Production Methods === 
 nd_bnh_catholicate_upkeep: "Католическое содержание" #NT!
 nd_bnh_catholicate_upkeep_desc: "Напрестольные свечи, реестровые бумаги, богослужебные книги и ладан для патриаршей кафедры и ее епархиальной канцелярии." #NT!
 nd_bnh_tur_abdin_upkeep: "Содержание монастыря" #NT!
 nd_bnh_tur_abdin_upkeep_desc: "Свечи для ночного служения, рукописи для скриптория и ладан для святилища капитула на вершине холма." #NT!
 nd_bnh_qanat_upkeep: "Канат Техническое обслуживание" #NT!
 nd_bnh_qanat_upkeep_desc: "Каменные, деревянные опоры и геодезические инструменты для очистки подземных каналов и полива низинных полей." #NT!
 nd_bnh_translation_books_pm: "Сирийский перевод" #NT!
 nd_bnh_translation_books_pm_desc: "Греческая философия, персидская медицина и арабская астрономия, переведенные на сирийский язык и предназначенные для школ Востока и Латинского Запада." #NT!
 nd_bnh_caravanserai_upkeep: "Содержание караван-сарая" #NT!
 nd_bnh_caravanserai_upkeep_desc: "Ткань, свежие лошади, древесина и свечи, чтобы придорожные общежития коридора Мосул-Багдад были открыты для караванов." #NT!
 nd_bnh_library_upkeep: "Содержание библиотеки" #NT!
 nd_bnh_library_upkeep_desc: "Бумага, справочные издания, свечи и благовония для читальных залов и переписчиков великой библиотеки Мосула." #NT!
 nd_bnh_jundishapur_upkeep: "Содержание медицинской школы" #NT!
 nd_bnh_jundishapur_upkeep_desc: "Бумага, медицинские трактаты и лекарственные препараты для палат и лекционных залов восстановленной врачебной академии." #NT!
 nd_bnh_highland_fortress_upkeep: "Содержание крепости" #NT!
 nd_bnh_highland_fortress_upkeep_desc: "Добытый камень, обработанная каменная кладка, оружие и инструменты для удержания и ремонта горных крепостей и их монастырских гарнизонов." #NT!
 nd_bnh_foundry_pm: "Пушечный литейный завод" #NT!
 nd_bnh_foundry_pm_desc: "Горное железо Хаккари, древесный уголь и готовые инструменты, отлитые в артиллерию армии Бет-Нахрайн поздней эпохи." #NT!
 nd_bnh_river_paper_pm: "Речная бумажная фабрика" #NT!
 nd_bnh_river_paper_pm_desc: "Лен, тряпки и зерна перерабатывались на речных мельницах в бумагу на арамейском языке для писцов и печатников королевства." #NT!
 nd_bnh_print_house_pm: "Арамейская печать" #NT!
 nd_bnh_print_house_pm_desc: "Бумага и переплет использовались в массовых печатных газетах на арамейском языке, учебниках на сирийском языке и сводах законов на местном языке." #NT!
  # === Units & Levies === 
 a_nd_bnh_tur_abdin_highlander: "Тур Абдин Горец" #NT!
 a_nd_bnh_tur_abdin_highlander_desc: "Наберите пехоту из горных деревень Тур Абдин вокруг Мор Габриэля, специалистов по горной обороне. Ополчение, которое удерживало регион под властью повелителей девять столетий." #NT!
 a_nd_bnh_tur_abdin_warden: "Тур Абдин Смотритель" #NT!
 a_nd_bnh_tur_abdin_warden_desc: "Профессиональный староста монашеского капитула, завербованный и обученный в регулярном тяжелом пехотном формировании. Дисциплинированные защитники северного фланга королевства." #NT!
 levy_nd_bnh_tur_abdin_highlanders: "Тур Абдин Горец Леви" #NT!
 nd_bnh_aramaic_print_press: "Арамейская печатная машина" #NT!
 nd_bnh_aramaic_print_press_desc: "Типография королевства индустриальной эпохи. Газеты на арамейском языке, учебники на сирийском языке и своды законов на местном языке переходят от техники скриптория к массовому производству." #NT!
 nd_bnh_aramaic_print_house: "Арамейская типография" #NT!
 nd_bnh_aramaic_print_house_desc: "Промышленный полиграфический комплекс позднего королевства, массовое производство арамейских газет, сирийских учебников и народного права для диаспоры и домашних школ королевства." #NT!
  # === Destiny Tree === 
  # Path tooltips: destiny path A (imperial) gates on the formation choice 
  # nd_bnh_path_b (Tur Abdin Defenders); destiny path B (civilization) 
  # gates on nd_bnh_path_a (Patriarch's Restoration). 
 nd_bnh_dest_path_a_tt: "Выберите путь формирования #bold Защитников Тур Абдина#!: милитаристскому фонду необходимо было идти к восстановлению Ашшура." #NT!
 nd_bnh_dest_path_b_tt: "Выберите путь формирования #bold Патриаршего Восстановления#!: научная основа, необходимая для того, чтобы идти Светом Востока." #NT!
  # === Destiny Advance Names === 
 nd_bnh_destiny: "Мандат Мор Ашшура" #NT!
 nd_bnh_destiny_desc: "Бет Нахрейн встает. Теперь королевство должно объявить, каким государством оно хочет быть: милитаристским наследником Ашшура, чья дорога пролегает через Мосул, Багдад и Дамаск к имперскому восстановлению Ассирии; или цивилизационный полюс восточного христианского мира, христианский посредник между латинским западом и востоком Шелкового пути. Мандат Мора принадлежит королю." #NT!
 nd_bnh_dest_a1: "Седра двух городов" #NT!
 nd_bnh_dest_a1_desc: "Приказ мафрианского генерала достигает Мосула и Багдада. Города-побратимы Тигра принадлежат королевству, и начинается имперская дорога." #NT!
 nd_bnh_dest_a2: "Марш генерала Мафриана" #NT!
 nd_bnh_dest_a2_desc: "Знамена королевства достигают Тебриза и Басры. Тебриз, где ильханы когда-то хранили память о христианском дворе, возвращается в Мор; Басра, Шатт-эль-Араб, открывает залив для Ашшура." #NT!
 nd_bnh_dest_a3: "Корона Ашшура" #NT!
 nd_bnh_dest_a3_desc: "Дамаск, Каир и Исфахан признают генерала Мафриана. Престиж царства венчает его как законного преемника Ассирии; путь к имперской реставрации открыт. (Форма ASR.)" #NT!
 nd_bnh_dest_b1: "Худайе из диаспоры" #NT!
 nd_bnh_dest_b1_desc: "Худайе читают на старой Антиохийской кафедре, а шелк Урфы связывает патриархальный рынок с Шелковым путем. Христианско-сирийский посредник стоит на своем." #NT!
 nd_bnh_dest_b2: "Бет Хекма восстановлена" #NT!
 nd_bnh_dest_b2_desc: "Казначейство одаривает Переводчиков-Патриархов Мосула. В Селевкии широко распространена типография, а епархии диаспоры присылают благодарности на сирийском, греческом и латинском языках." #NT!
 nd_bnh_dest_b3: "Видения Мора" #NT!
 nd_bnh_dest_b3_desc: "Самарканд и Иерусалим возвращаются на патриарший учет. Глобальная торговля приветствуется; Царство воспринимается по всей Евразии как законный христианский посредник, непреходящий Свет Востока." #NT!
  # === Destiny Event Texts === 
 nd_bnh.6.t: "Мандат Мор Ашшура" #NT!
 nd_bnh.6.d: "Католикос и аббат Мор-Габриэля собираются перед королем с торжественным предложением: судьба королевства еще не предрешена. Два пути открыты. В основе первой лежит имперская реставрация: королевство идет по дороге Тигра, берет Багдад, берет Дамаск, берет Каир, пока Корона Ашшура не перейдет из памяти в закон и Ассирийская империя не восстанет снова. Во-вторых, лежит цивилизационное призвание: королевство является прочным христианско-сирийским полюсом между Латинской Европой и Азией памяти Тан, патриархатом, в котором находятся епархии Шелкового пути, патриархами-переводчиками, чья Бет Хекма читает на трех языках." #NT!
 nd_bnh.6.a: "Мандат принят. Судьба будет написана." #NT!
 nd_bnh.7.t: "Города-побратимы" #NT!
 nd_bnh.7.d: "Мосул и Багдад взяты. Тигр полностью течет под знаменем королевства; арамейскоязычные деревни вдоль реки приветствуют генерала Мафриана; старые административные ядра Аббасидов реорганизованы под королевский диван. Пройден первый этап императорской дороги." #NT!
 nd_bnh.7.a: "Вперед в Ашшур." #NT!
 nd_bnh.8.t: "Марш генерала Мафриана" #NT!
 nd_bnh.8.d: "Падение Тебриза и Басры. Воспроизводится память Ильханидов о христианских князьях в Тебризе; Шатт-эль-Араб открывает Персидский залив для королевской торговли. Марширующая колонна мафрианского генерала теперь достаточно сильна, чтобы пересечь границу Леванта или Ирана. Королевский совет спрашивает, как его доставить." #NT!
 nd_bnh.8.a: "Выходите под знаменем Стратега." #NT!
 nd_bnh.8.b: "Построить речно-понтонный корпус." #NT!
 nd_bnh.9.t: "Корона Ашшура" #NT!
 nd_bnh.9.d: "Дамаск, Каир и Исфахан признают генерала Мафриана. Латинские канцелярии называют его ассирийцем; персидские дворы называют его Владыкой Двуречья; Мамлюкская резиденция в Каире возвращает дань. Католикос коронует его как Мор Ашшура, законного царя Ассирии, в соборе Мосула. Имперская реставрация стоит. Бет Нахрейн подготовила почву для Ассирийской империи." #NT!
 nd_bnh.9.a: "Коронуйте меня, защитника Леванта." #NT!
 nd_bnh.9.b: "Соберите ашшурские рекруты со всех завоеванных земель." #NT!
 nd_bnh.10.t: "Худайе из диаспоры" #NT!
 nd_bnh.10.d: "Антиохия возвращается в состав королевства, и книга законов Худайе читается на старой патриаршей кафедре. Шелк снова прибывает в Мосул через караваны Урфы; Епархии Шелкового пути признают христианско-сирийского посредника законной патриаршей резиденцией. Свет Востока зажигает." #NT!
 nd_bnh.10.a: "Свет Востока зажигает." #NT!
 nd_bnh.11.t: "Бет Хекма восстановлена" #NT!
 nd_bnh.11.d: "Королевская казна одаривает переводчиков-патриархов Мосула. В Селевкии распространена типография; Арамейское, греческое и арабское писание набрано подвижным шрифтом в патриарших произведениях. Епархии диаспоры присылают благодарности из Тричура, Тебриза и Реймса. Королевство теперь должно решить, как будет управляться его цивилизационная машина." #NT!
 nd_bnh.11.a: "Восстановить Дом Мудрости под патриархатом." #NT!
 nd_bnh.11.b: "Созвать Селевкийский синод и объединиться." #NT!
 nd_bnh.12.t: "Видения Мора" #NT!
 nd_bnh.12.d: "Самарканд и Иерусалим возвращаются на патриарший учет. Глобальная торговля приветствуется. Латинские канцелярии, персидские суды, министерства памяти Тан в государствах-преемниках Монголии — все считали Бет-Нахрайн законным христианским посредником, прочным полюсом между западом и востоком. Свет Востока стоит; королевство полно без имперских претензий." #NT!
 nd_bnh.12.a: "Отправьте митрополитов в дальние епархии." #NT!
 nd_bnh.12.b: "Пожертвуйте Арамейскую Академию и укрепите ее дома." #NT!
  # === Destiny Timed Modifier Names === 
 STATIC_MODIFIER_NAME_nd_bnh_dest_strategos_march: "Стратегос Марш" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_strategos_march: "Колонна мафрианского генерала движется под старым знаменем византийско-сасанидского стратега: тяжелый кавалерийский удар, разграбление каждого павшего города и королевство, расплачивающееся за политическую цену постоянной кампании." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_riverine_logistics: "Корпус речной логистики" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_riverine_logistics: "Королевские понтонеры перестраивают понтонную сеть Тигр-Ефрат в логистический центр. Каждый мост, форт и депо спроектирован инженерами, писавшими на арамейском языке; министерства строительства королевства гудят в темпе мирного времени." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_crown_of_assur: "Корона Ашшура" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_crown_of_assur: "Мафриан-генерал — коронованный защитник Леванта. Королевские армии сражаются согласно священному мандату Короны; война против окружающих еретиков читается как праведная; но каждый сосед помнит Каир и не спешит терпеть дальнейшие провокации." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_assyrian_levies: "Наемники Ашшура" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_assyrian_levies: "Каждый завоеванный город отправляет свою норму рекрутов под королевские знамена. Реестр наемников в королевстве пополняется, министерства casus belli ежедневно готовят новые провокации, а имперская машина движется вперед." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_house_of_wisdom: "Дом Мудрости" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_house_of_wisdom: "Переводчики-патриархи Мосула вновь основали Байт аль-Хикма под королевским пожертвованием. Дипломаты направляются во все канцелярии от Реймса до Катая; патриархальные торговые центры раздуваются; но стипендии Мора и субсидии диаспоры обесценивают монету." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_seleucia_synod: "Селевкийский Синод" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_seleucia_synod: "Синод патриархата собирается в Селевкии, резиденции сасанидской эпохи. Подданные, союзники и метрополии — все присягают на верность в соборе; развитие королевства незаметно усугубляется; королевские посланники ведут переговоры с удивительным весом." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_metropolitanate: "Дальняя митрополия" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_metropolitanate: "Патриархия направляет митрополитов в Самарканд, Тричур и порты Средиземноморья. Морская торговля растет; королевство дешево нанимает наемников из диаспоры; сословия мещан и духовенства работают сообща." #NT!
 STATIC_MODIFIER_NAME_nd_bnh_dest_aramaic_academy: "Арамейская академия" #NT!
 STATIC_MODIFIER_DESC_nd_bnh_dest_aramaic_academy: "Королевство наделяет Арамейскую академию в Мосуле высшим гражданским учреждением. Здесь тренируются шпионские сети, военные тактики и патриархальные офицеры; но ученые классы королевства обретают комфортную уверенность в том, что они являются Светом Востока." #NT!
  # === Destiny Buildings === 
 nd_bnh_ziggurat_of_assur: "Зиккурат Ашшура" #NT!
 nd_bnh_ziggurat_of_assur_desc: "Возрожденный императорский памятник в ассирийском стиле у резиденции генерала Мафриана. Наполовину государственный храм, наполовину казармы императорской гвардии, зиккурат возвещает всем окружающим народам о восстановлении Ассирии и связывает завоеванное ядро ​​Месопотамии с династической столицей." #NT!
 nd_bnh_beth_hekma: "Бет Хекма" #NT!
 nd_bnh_beth_hekma_desc: "Возрожденное королевство Байт аль-Хикма, восстановленное под патриархатом Селевкии-Ктесифона. Переводчики, астрономы, врачи и синодальные юристы работают параллельно; учреждение, которое делает Бет Нахрейн вечным Светом Востока." #NT!
  # === Destiny Building PM Loc === 
 nd_bnh_ziggurat_of_assur_upkeep: "Содержание Зиккурата" #NT!
 nd_bnh_ziggurat_of_assur_upkeep_desc: "Каменная кладка, оружие и инструменты, необходимые для поддержания императорского памятника и его гарнизонных казарм." #NT!
 nd_bnh_beth_hekma_upkeep: "Содержание Бет Хекмы" #NT!
 nd_bnh_beth_hekma_upkeep_desc: "Бумага, книги, благовония и пчелиный воск для патриаршей академии переводчиков, астрономов и врачей." #NT!
  # === Bureaucracies === 
 bnh_catholicate_of_the_east_bureaucracy: "Католицат Востока" #NT!
 bnh_catholicate_of_the_east_bureaucracy_desc: "Католикос-Патриарх Востока возглавляет собор в Мосуле, его митрополиты назначаются в Месопотамии, Персии, а также в сохранившихся миссиях в Керале и Ханбалике. Патриарший суд рассматривает христианский брак, наследование и синодальную дисциплину как параллельные ветви власти. При поддержке церкви влияние церкви усиливает королевскую преданность и обращение; когда ими пренебрегают, и духовенство, и сельская знать возмущаются, что десятина перенаправляется в суд, который они больше не посещают." #NT!
 bnh_maphrianate_of_tagrit_bureaucracy: "Мафриат Тагрита" #NT!
 bnh_maphrianate_of_tagrit_bureaucracy_desc: "Мафриан Востока, занимающий второе место после монастыря Мор Маттай и уступающий только Антиохийскому Патриарху, владеет сирийскими православными епархиями к востоку от Евфрата. Бар Гебреус занимал этот пост с 1264 года и использовал его для написания Хронографии. Устойчивый Мафрианат обучает грамотных священнослужителей и кодифицирует сирийское каноническое право; Если пренебречь, трения с Антиохией разжигают внешний антагонизм и замедляют распад стабильности." #NT!
 bnh_tur_abdin_defenders_bureaucracy: "Тур Абдин Защитники" #NT!
 bnh_tur_abdin_defenders_bureaucracy_desc: "Скальные монастыри на плато Тур Абдин (Мор Габриэль, основанный в 397 году; Дейр аз-Зафаран; Мор Якуб Салаха) и их сети деревенских ополчений удерживали Месопотамское нагорье как самоконтролируемую христианскую границу под сменявшими друг друга Артукидом, Ильханом, Ак Коюнлу и османскими повелителями. Королевское признание официально оформляет епископов-аббатов в качестве пограничных губернаторов. Устойчивая легкая пехота сражается сильнее и быстрее восстанавливается; пренебрегая, епископы сохраняют свое оружие, но прекращают отправлять доходы в Мосул." #NT!
 bnh_aramaic_chancery_bureaucracy: "Арамейско-сирийская канцелярия" #NT!
 bnh_aramaic_chancery_bureaucracy_desc: "Скрипттории Мор Маттаи, Мор Габриэля и Дейр аз-Зафарана обучали писцов, которые служили не только церкви, но и судам Сасанидов, Аббасидов и Ильханидов на сирийском и арамейском языках. «Сливки мудрости» Бара Гебреуса и двуязычная сирийско-арабская судебная переписка XIII века документально подтверждают наличие грамотного клерикально-бюрократического класса. Преобразованная в постоянную государственную службу, канцелярия превращает бюргерские и клерикальные семьи Мосула, Эдессы и Нусайбина в грамотный костяк королевства." #NT!
  # === Bureaucracy Authority Auto-Modifier === 
 AUTO_MODIFIER_NAME_nd_bnh_bureaucracy_authority: "Бюрократическая власть Бет Нахрейн" #NT!
 AUTO_MODIFIER_DESC_nd_bnh_bureaucracy_authority: "При формировании [BNH.GetName] получает возможность принимать у себя историческую сирийско-христианскую бюрократию." #NT!
