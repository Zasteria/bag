l_russian:
 STATIC_MODIFIER_NAME_nd_tgd_restore_protectorates: "Восстановить протектораты" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_restore_protectorates: "Слава Тана заключается в том, что он простирается за пределы гор. От Нефритовых ворот до берегов Каспия Генеральный Протекторат охранял империю, охватывающую степи, пустыни и оазисы. Благодаря военной мощи и дипломатической хитрости Тан навел порядок в западных регионах и контролировал артерии континентальной торговли." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_golden_age_of_letters: "Золотой век букв" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_golden_age_of_letters: "Под покровительством Тан каждая религия приветствовалась в Чанъане. Ли Бай вознес чашу к луне, Ду Фу оплакивал страдания простого народа, а Ван Вэй писал пейзажи, стиравшие грань между поэзией и живописью. Буддийские монахи из Индии, несторианские священники из Персии и манихейские миссионеры из Центральной Азии свободно дискутировали в тени дворца Дамин." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_protectorate_restored: "Протекторат восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_protectorate_restored: "Генеральный протекторат по умиротворению Запада был восстановлен, распространив военную власть на территорию Таримской впадины и перевалов Тянь-Шаня. Гарнизоны охраняют торговые пути, а мобильная кавалерия проецирует мощь глубоко в степь." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_examination_perfected: "Экзамен усовершенствован" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_examination_perfected: "Система экзаменов дзинши была доведена до высшей степени. Любой талантливый человек, независимо от рождения, может подняться до служения Сыну Неба благодаря литературному мастерству и административным навыкам." #NT!
 nd_tgd.1.t: "Реставрация Тан" #NT!
 nd_tgd.1.d: "Чанъань пылает новой славой. Древняя столица Тан, где когда-то два миллиона душ со всех уголков известного мира собрались под алыми воротами дворца, снова оживает. От Цзинчжао до Кашгара, от Желтой реки до Тянь-Шаня — империя, которая когда-то определяла саму цивилизацию, пробуждается от многовекового сна.\n\nТан в зените своего развития не была просто китайской династией. Это была космополитическая мировая империя, где тюркские генералы возглавляли китайские армии, персидские купцы заполонили Западный рынок, а буддийские сутры соседствовали с несторианскими евангелиями и манихейскими гимнами. Теперь перед вами возникает вопрос: что будет определять это восстановление?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tgd.1.a: "Марш на запад! Восстановите протектораты за Нефритовыми вратами." #NT!
 nd_tgd.1.b: "Пусть Кисть победит то, чего не может Меч." #NT!
 nd_tgd.2.t: "Протекторат Аньси восстановлен" #NT!
 nd_tgd.2.d: "В 640 году император Тайцзун основал Генеральный протекторат по умиротворению Запада в Сичжоу, позже перенеся его резиденцию в Куча. На пике своего развития Протекторат Аньси командовал четырьмя крупными гарнизонами (в Куча, Хотан, Кашгар и Карашахр), обеспечивающими безопасность всей Таримской котловины и распространявшими власть Тан вглубь Трансоксианы.\n\nВосстание Ань Лушаня в 755 году вынудило вывести гарнизоны Аньси для защиты центра страны, и протекторат постепенно был отдан Тибетской империи и тюркским державам. Теперь, когда наши знамена снова реют над западными регионами, протекторат Аньси восстановлен, его ретрансляционные станции, гарнизонные города и караванная охрана обеспечивают безопасный проход как торговцам, монахам, так и дипломатам." #NT!
 nd_tgd.2.a: "Западные регионы снова в безопасности." #NT!
 nd_tgd.2.b: "Триумф, но работа продолжается." #NT!
 nd_tgd.3.t: "Императорский экзамен усовершенствован" #NT!
 nd_tgd.3.d: "Экзамен кэджу, впервые систематизированный при Суй, достиг своей золотой формы при Тан. Степень цзиньши, «представленный ученый», стала высшим достижением, к которому мог стремиться человек, проверяемым не только в механическом запоминании, но и в литературном сочинении, политическом анализе и моральной философии.\n\nПри императрице У Цзэтянь система открылась шире, чем когда-либо прежде, ослабив хватку аристократических семей на государственных должностях. В экзаменационных залах Чанъаня кандидаты из каждой провинции соревновались только по заслугам. Эта меритократическая революция привела к появлению таких государственных деятелей, как Чжан Цзюлин, чье правление принесло ему титул образцового канцлера для всех последующих династий." #NT!
 nd_tgd.3.a: "Пусть только заслуги определяют, кто служит трону." #NT!
 nd_tgd.3.b: "Экзамен – это инструмент, а не религия." #NT!
 nd_tgd.4.t: "Несторианская стела" #NT!
 nd_tgd.4.d: "В 781 году в Чанъане была воздвигнута известняковая стела, свидетельствующая о приходе несторианского христианства в Китай полтора века назад. Надпись, написанная как на китайском, так и на сирийском языках, рассказывает о том, как персидский монах Алуобен прибыл ко двору Тан в 635 году и был принят императором Тайцзуном, который изучил его писания и заявил: «У Пути нет неизменного имени, у мудрецов нет неизменного метода». Обучение создано с учетом особенностей земли и тайно помогает всем живым существам.'\n\nЭтот дух религиозной терпимости определил космополис Тан. Буддийские монастыри, даосские храмы, зороастрийские огненные алтари, манихейские маяки, исламские мечети и несторианские церкви стояли в пределах одних и тех же городских стен, каждая из которых вносила свой вклад в цивилизацию, величие которой измерялось не единообразием, а широтой ее охвата." #NT!
 nd_tgd.4.a: "Все пути ведут к истине под танскими небесами." #NT!
 nd_tgd.5.t: "Пехота Модао" #NT!
 nd_tgd.5.d: "Модао, устрашающий двуручный меч длиной почти семь футов, был фирменным оружием тяжелой пехоты Тан. Используемые в плотных формированиях избранными войсками, модао создавали стальную стену, которая могла остановить кавалерийскую атаку. В битве на реке Мохэ в 732 году пехота модао Танского генерала Чжан Шоугуя разбивала волну за волной киданьской кавалерии, оставляя степных воинов ошеломленными дисциплиной и убойной мощью этих пехотинцев.\n\nМодао требовало многих лет тренировок и исключительной силы. Подразделения, оснащенные этим оружием, были сформированы из наиболее опытных солдат пограничных гарнизонов, людей, которые всю свою жизнь сражались с кочевыми налетчиками и понимали, как использовать местность и строй для нейтрализации преимущества в мобильности конного противника." #NT!
 nd_tgd.5.a: "Модао говорит громче любого аргумента." #NT!
 nd_tgd.6.t: "Возрождение Шелкового пути" #NT!
 nd_tgd.6.d: "Шелковый путь под управлением Тан был не просто торговым путем. Это была нервная система евразийской цивилизации. С оживленного Западного рынка Чанъаня караваны отправлялись с шелком, фарфором, чаем и бумагой на запад через коридор Хэси и Нефритовые ворота, пересекая северную и южную окраинные дороги Такла-Макана и достигая Кашгара, Самарканда, Багдада и, в конечном итоге, Константинополя.\n\nВзамен пришли арабские лошади, персидское стекло, индийские специи, римские золотые монеты и среднеазиатская музыка, которая изменила развлечения при дворе Тан. Согдийские купцы, «FedEx древнего мира», управляли сетью торговых домов от Чанъаня до Средиземноморья. Правительство Тан содержало ретрансляционные станции, регулировало торговлю и размещало гарнизоны в городах-оазисах, создавая самый безопасный и самый прибыльный торговый коридор, который когда-либо знал мир." #NT!
 nd_tgd.6.a: "Дорога соединяет все народы под небом." #NT!
 nd_tgd_fubing_system: "Система ополчения Фубин" #NT!
 nd_tgd_fubing_system_desc: "Система «фубинг» выделяет землю солдатам-фермерам, которые поочередно служат в столичных или приграничных гарнизонах, обеспечивая огромный резерв обученных ополченцев с минимальными затратами для государства." #NT!
 nd_tgd_equal_field_system: "Равнополевая система" #NT!
 nd_tgd_equal_field_system_desc: "Система хунти распределяет государственную землю поровну между взрослыми мужчинами, обеспечивая налоговые поступления и одновременно предотвращая опасную концентрацию богатства в руках аристократов." #NT!
 nd_tgd_post_road_system: "Имперские почтовые дороги" #NT!
 nd_tgd_post_road_system_desc: "Сеть ретрансляционных станций, расположенных через каждые тридцать ли, соединяет столицу с самыми дальними приграничными провинциями, обеспечивая быструю связь, передвижение войск и административный контроль." #NT!
 nd_tgd_modao_tradition: "Модао Тяжелая пехота" #NT!
 nd_tgd_modao_tradition_desc: "Модао, разрушительный двуручный длинный клинок, позволяет элитной пехоте формировать непроницаемые стальные стены против кавалерийских атак — традиция, зародившаяся на границах Тан." #NT!
 nd_tgd_jiedushi_system: "Военные губернаторства Цзедуши" #NT!
 nd_tgd_jiedushi_system_desc: "Региональные военные комиссары осуществляют совместную гражданскую и военную власть над приграничными округами, поддерживая профессиональные гарнизонные армии для защиты от вторжений кочевников." #NT!
 nd_tgd_buddhist_patronage: "Буддийский государственный патронаж" #NT!
 nd_tgd_buddhist_patronage_desc: "Имперское спонсорство буддийских монастырей, переводческих проектов и сетей паломников создает обширную религиозную инфраструктуру, которая повышает грамотность, культурный обмен и социальную стабильность." #NT!
 nd_tgd_xuanjia_tradition: "Тяжелая кавалерия Сюаньцзя" #NT!
 nd_tgd_xuanjia_tradition_desc: "Сюаньцзя, катафракты в «черных доспехах», олицетворяют тяжелую кавалерию Тан во всей ее красе: всадники в доспехах на конях с панцирями, способные наносить разрушительные удары." #NT!
 nd_tgd_silk_road_mastery: "Мастерство Шелкового пути" #NT!
 nd_tgd_silk_road_mastery_desc: "Контроль Тан над основными артериями Шелкового пути превращает сухопутную торговлю из опасной игры в регулируемое, прибыльное и безопасное предприятие, соединяющее Восток и Запад." #NT!
 nd_tgd_sancai_ceramics: "Керамическая традиция Санцай" #NT!
 nd_tgd_sancai_ceramics_desc: "Отличительная трехцветная глазурованная керамика Тан (с янтарными, зелеными и кремовыми тонами) становится одновременно культурным символом и ценным экспортным товаром." #NT!
 nd_tgd_nestorian_stele: "Несторианская стела" #NT!
 nd_tgd_nestorian_stele_desc: "Возведение несторианской стелы в Чанъане символизирует религиозный плюрализм Тан, где под имперской защитой сосуществуют христианство, ислам, манихейство, зороастризм, буддизм и даосизм." #NT!
 nd_tgd_hanlin_scholars: "Академия Ханлинь" #NT!
 nd_tgd_hanlin_scholars_desc: "Академия Ханьлинь собирает самых блестящих ученых империи для разработки имперских указов, составления государственных документов и консультирования по вопросам политики, являясь хранилищем административного мастерства." #NT!
 nd_tgd_frontier_horse_archers: "Пограничные конные лучники" #NT!
 nd_tgd_frontier_horse_archers_desc: "Набранные из смешанного населения приграничья (тюркского, согдийского и китайского), эти быстродвижущиеся конные лучники служат разведчиками, рейдерами и фланговыми силами." #NT!
 nd_tgd_grotto_devotion: "Грот Храма Преданность" #NT!
 nd_tgd_grotto_devotion_desc: "Великие пещерные храмовые комплексы в Дуньхуане, Лунмэне и Юнгане представляют собой столетия религиозной резьбы, живописи и скульптуры, хранилища буддийского искусства и науки." #NT!
 nd_tgd_anxi_protectorate: "Протекторат Аньси" #NT!
 nd_tgd_anxi_protectorate_desc: "Генеральный протекторат по умиротворению Запада контролирует Таримский бассейн через четыре гарнизона в Куче, Хотане, Кашгаре и Карашаре, обеспечивая безопасность западных подступов к империи." #NT!
 nd_tgd_imperial_silk: "Императорское производство шелка" #NT!
 nd_tgd_imperial_silk_desc: "Контролируемые государством шелковые мастерские производят лучшие в мире ткани: от парчи, сотканной золотой нитью, до тончайшей ткани, ценимой от Японии до Византии." #NT!
 nd_tgd_poetry_golden_age: "Золотой век поэзии" #NT!
 nd_tgd_poetry_golden_age_desc: "Тан производит более 48 000 сохранившихся стихотворений более чем 2200 авторов. Ли Бай, Ду Фу, Ван Вэй и Бай Цзюйи устанавливают литературный канон, который будет определять китайскую цивилизацию." #NT!
 nd_tgd_jinshi_perfected: "Экзамен Джинши усовершенствован" #NT!
 nd_tgd_jinshi_perfected_desc: "Степень дзинши (проверка литературного сочинения, политического анализа и моральной философии) становится высшим путем к государственной службе, разрушая аристократическую монополию на власть." #NT!
 nd_tgd_shencea_tradition: "Имперская гвардия Шенца" #NT!
 nd_tgd_shencea_tradition_desc: "Армия Шенца, первоначально бывшая телохранителем Императора, превратилась в самую мощную военную силу позднего Тан, насчитывающую 150 000 профессиональных солдат." #NT!
 nd_tgd_sogdian_networks: "Согдийские торговые сети" #NT!
 nd_tgd_sogdian_networks_desc: "Согдийские купцы из Самарканда и Бухары управляют обширными торговыми сетями, простирающимися от Чанъаня до Константинополя, служащими коммерческой основой Шелкового пути.\n\n#italic Доступно в: $nd_tgd_caravanserai$#!" #NT!
 nd_tgd_tea_horse_trade: "Чайно-лошадная торговля" #NT!
 nd_tgd_tea_horse_trade_desc: "Стратегический обмен китайского чая на кочевых лошадей создает взаимозависимую приграничную экономику, которая стабилизирует приграничные отношения и обеспечивает империю превосходными кавалерийскими лошадьми." #NT!
 nd_tgd_confessional_tolerance: "Конфессиональная толерантность" #NT!
 nd_tgd_confessional_tolerance_desc: "Танская традиция религиозного плюрализма расширяется и формализуется, гарантируя, что общины всех вероисповеданий мирно вносят вклад в процветание империи." #NT!
 nd_tgd_silk_road_renaissance: "Возрождение Шелкового пути" #NT!
 nd_tgd_silk_road_renaissance_desc: "Возобновляющаяся волна торговли на Шелковом пути приносит беспрецедентное богатство и культурный обмен, поскольку улучшение инфраструктуры и дипломатических отношений открывают новые торговые коридоры." #NT!
 nd_tgd_frontier_modernization: "Пограничная военная реформа" #NT!
 nd_tgd_frontier_modernization_desc: "Пограничная армия модернизируется за счет стандартизированного оборудования, профессиональной подготовки и реформирования командных структур, что создает мобильные и дисциплинированные силы." #NT!
 nd_tgd_grand_canal_trade: "Интеграция Гранд-канала" #NT!
 nd_tgd_grand_canal_trade_desc: "Большой канал связывает излишки риса Янцзы с северным центром, обеспечивая масштабную внутреннюю торговлю и поддерживая население столичного региона." #NT!
 nd_tgd_imperial_consolidation: "Имперская Консолидация" #NT!
 nd_tgd_imperial_consolidation_desc: "Имперская власть расширяется и укрепляется посредством административной реформы, культурной интеграции и подавления регионального сепаратизма." #NT!
 nd_tgd_woodblock_printing: "Печать на дереве" #NT!
 nd_tgd_woodblock_printing_desc: "Печать на дереве позволяет массово воспроизводить тексты (буддийские сутры, классические труды Конфуция и правительственные постановления), распространяя грамотность и институциональные знания по всей империи.\n\n#italic Доступно в: $nd_tgd_hanlin_academy$#!" #NT!
 nd_tgd_gunpowder_alchemy: "Пороховая алхимия" #NT!
 nd_tgd_gunpowder_alchemy_desc: "Танские алхимики, ищущие эликсир бессмертия, наткнулись на более непосредственное открытие: порох. Огненные стрелы, зажигательные бомбы и проторакеты меняют осадную войну." #NT!
 nd_tgd_centralized_bureaucracy: "Централизованная бюрократия" #NT!
 nd_tgd_centralized_bureaucracy_desc: "Бюрократическая система, основанная на экзаменах, достигает полной зрелости, создавая правящий класс, выбранный исключительно на основе заслуг и лояльности к центральному суду." #NT!
 nd_tgd_maritime_silk_road: "Морской Шелковый путь" #NT!
 nd_tgd_maritime_silk_road_desc: "Поскольку сухопутные маршруты сталкиваются с перебоями, морская торговля через Гуанчжоу, Цюаньчжоу и Южно-Китайское море становится конкурентом и в конечном итоге превосходит континентальный Шелковый путь по объему." #NT!
 nd_tgd_porcelain_mastery: "Мастерство экспорта фарфора" #NT!
 nd_tgd_porcelain_mastery_desc: "Китайский фарфор, «белое золото», становится самым востребованным товаром в мировой торговле. Корабль за кораблем доставляет сине-белые товары на рынки от Занзибара до Лиссабона.\n\n#italic Доступно в: $nd_tgd_sancai_kiln$#!" #NT!
 nd_tgd_standing_frontier_army: "Постоянная пограничная армия" #NT!
 nd_tgd_standing_frontier_army_desc: "Система пограничных гарнизонов превращается в постоянную армию, в которой профессиональные солдаты служат круглый год на хорошо снабжаемых укреплённых позициях вдоль границы." #NT!
 nd_tgd_cosmopolitan_court: "Космополитический суд" #NT!
 nd_tgd_cosmopolitan_court_desc: "Императорский двор приветствует таланты всех наций и культур, интегрируя иностранных администраторов, генералов, художников и торговцев в структуру управления." #NT!
 nd_tgd_tea_culture: "Формализованная чайная культура" #NT!
 nd_tgd_tea_culture_desc: "«Классика чая» Лу Юя утвердила философию и практику приготовления чая как высокое искусство. Чайные дома становятся центрами общественной жизни, дипломатии и литературного обмена." #NT!
 nd_tgd_border_management: "Стратегическое управление границами" #NT!
 nd_tgd_border_management_desc: "Комплексная система стен, перевалов, гарнизонных городов и дипломатических протоколов создает многоуровневую глубокоэшелонированную оборону вдоль северной и западной границ." #NT!
 nd_tgd_industrial_silk: "Производство промышленного шелка" #NT!
 nd_tgd_industrial_silk_desc: "Механизированные ткацкие станки и организованное фабричное производство превращают производство шелка из кустарного ремесла в промышленное предприятие, значительно увеличивая объем производства и экспортный потенциал." #NT!
 nd_tgd_modern_academy: "Современная академическая система" #NT!
 nd_tgd_modern_academy_desc: "Традиционная экзаменационная система развивается и включает в себя современные предметы (естественные науки, инженерное дело, иностранные языки), сохраняя при этом свои меритократические основы." #NT!
 nd_tgd_continental_rail: "Континентальная железнодорожная сеть" #NT!
 nd_tgd_continental_rail_desc: "Железные рельсы пролегают по древним коридорам Шелкового пути, соединяя Чанъань с западной границей и за ее пределами со скоростью и надежностью, с которыми караваны верблюдов никогда не могли сравниться." #NT!
 nd_tgd_modern_army: "Реформа современной армии" #NT!
 nd_tgd_modern_army_desc: "Традиции пограничных гарнизонов трансформируются в современную профессиональную армию со стандартизированной подготовкой, оборудованием и тактической доктриной, основанной на мировой военной науке." #NT!
 nd_tgd_cultural_renaissance: "Культурный Ренессанс" #NT!
 nd_tgd_cultural_renaissance_desc: "Новое поколение художников, поэтов и мыслителей опирается на литературный канон Тан, чтобы создать культурный ренессанс, который прославляет как наследие, так и инновации." #NT!
 nd_tgd_silk_road_revival: "Возрождение Шелкового пути" #NT!
 nd_tgd_silk_road_revival_desc: "Современная инфраструктура, дипломатические соглашения и торговые соглашения возрождают древний Шелковый путь как процветающий торговый коридор, соединяющий рынки Восточной Азии с Центральной Азией и за ее пределами." #NT!
 a_nd_tgd_modao_infantry: "Модаао Пехота" #NT!
 a_nd_tgd_modao_infantry_desc: "Элитная тяжелая пехота, владеющая устрашающим модао — семифутовым двуручным клинком, способным прорубить как лошадь, так и всадника. Эти специалисты по борьбе с кавалерией образуют непроницаемые стальные стены." #NT!
 a_nd_tgd_xuanjia_cavalry: "Тяжелая кавалерия Сюаньцзя" #NT!
 a_nd_tgd_xuanjia_cavalry_desc: "Катафракты Тан в «Черных доспехах» — всадники в доспехах на конях с панцирями, наносящие разрушительные удары, разрушающие вражеские порядки." #NT!
 a_nd_tgd_frontier_horse_archer: "Пограничные конные лучники" #NT!
 a_nd_tgd_frontier_horse_archer_desc: "Легкая кавалерия набиралась из смешанного населения приграничья: тюрков, согдийцев и китайцев. Быстрые и маневренные рейдеры, эксперты в разведке, флангах и преследовании вражеских линий снабжения." #NT!
 a_nd_tgd_shencea_guards: "Имперская гвардия Шенца" #NT!
 a_nd_tgd_shencea_guards_desc: "Элитная армия Шенца, первоначально личная охрана Императора, превратилась в самое мощное военное формирование поздней Тан, профессиональное, дисциплинированное и чрезвычайно лояльное." #NT!
 a_nd_tgd_fubing_militia: "Ополчение Фубин" #NT!
 a_nd_tgd_fubing_militia_desc: "Солдаты-фермеры, служащие поочередно в системе фьюбинга, обеспечивают огромный резерв обученной пехоты с минимальными затратами для государства." #NT!
 a_nd_tgd_frontier_levy_cavalry: "Пограничная кавалерия ополченцев" #NT!
 a_nd_tgd_frontier_levy_cavalry_desc: "Смешанные тюркские и китайские степные наездники, выросшие из приграничных гарнизонов, сочетающие кочевые навыки верховой езды с танской военной дисциплиной." #NT!
 nd_tgd_caravanserai: "Караван-сарай Шелкового пути" #NT!
 nd_tgd_caravanserai_desc: "Укрепленная перевалочная станция на Шелковом пути, обеспечивающая убежище, еду, фураж и безопасный рынок для торговых караванов, пересекающих западные торговые пути." #NT!
 nd_tgd_sancai_kiln: "Керамическая печь Sancai" #NT!
 nd_tgd_sancai_kiln_desc: "Специализированные печи для производства знаменитого Тан санцай (трехцветная глазурованная керамика янтарного, зеленого и кремового цвета), ценившиеся как предметы роскоши и дипломатические подарки по всей Евразии." #NT!
 nd_tgd_frontier_garrison: "Пограничный гарнизон" #NT!
 nd_tgd_frontier_garrison_desc: "Военный командный пункт Цзедуши на границе с постоянным профессиональным гарнизоном для защиты от вторжений кочевников и демонстрации имперской власти." #NT!
 nd_tgd_grotto_temple: "Буддийский храм-грот" #NT!
 nd_tgd_grotto_temple_desc: "Пещерный храмовый комплекс, высеченный в скалах, украшенный расписными фресками и резными Буддами. Центры преданности, науки и художественных достижений в буддийской традиции Тан." #NT!
 nd_tgd_hanlin_academy: "Императорская Академия Ханьлинь" #NT!
 nd_tgd_hanlin_academy_desc: "Высшее научное учреждение империи, где самые блестящие выпускники дзинши разрабатывают императорские указы, составляют истории и дают советы Сыну Неба по государственным вопросам." #NT!
 nd_tgd_silk_workshop: "Императорская шелковая мастерская" #NT!
 nd_tgd_silk_workshop_desc: "Государственные мастерские по производству шелка, производящие лучшие в мире ткани, парчу, марлю и дамаск, предназначенные для рынков от Нары до Багдада." #NT!
 nd_tgd_relay_station: "Имперская ретрансляционная станция" #NT!
 nd_tgd_relay_station_desc: "Почтовая станция, содержащая свежих лошадей и продовольствие для имперских курьеров, позволяющая доставлять послания из столицы к границе за дни, а не за недели." #NT!
 nd_tgd_caravan_upkeep: "Техническое обслуживание караванной станции" #NT!
 nd_tgd_caravan_upkeep_desc: "Содержание караван-сарая, включая корм для вьючных животных, ткань для упаковки товаров и древесину для ремонта конструкций." #NT!
 nd_tgd_sancai_production: "Обжиг керамики Санцай" #NT!
 nd_tgd_sancai_production_desc: "Производство трехцветной глазурованной керамики с использованием местной глины, свинцовых глазурей и тщательно контролируемой температуры в печи." #NT!
 nd_tgd_garrison_upkeep: "Гарнизонное снабжение" #NT!
 nd_tgd_garrison_upkeep_desc: "Военные поставки для пограничного гарнизона, включая оружие, конское снаряжение, обмундирование и скот для пайков." #NT!
 nd_tgd_grotto_maintenance: "Содержание храма Грота" #NT!
 nd_tgd_grotto_maintenance_desc: "Обслуживание комплекса пещерного храма, включая резьбу по камню, красящие пигменты для реставрации фресок, пчелиный воск для религиозных свечей и благовония для богослужений." #NT!
 nd_tgd_academy_upkeep: "Обслуживание Академии" #NT!
 nd_tgd_academy_upkeep_desc: "Научные материалы для Императорской Академии, включая бумагу для экзаменов, книги для библиотеки и шелк для официальных документов." #NT!
 nd_tgd_silk_weaving: "Императорское шелковое ткачество" #NT!
 nd_tgd_silk_weaving_desc: "Производство роскошных тонких тканей из шелка-сырца и красителей с использованием традиционных танских ткацких техник, отточенных веками." #NT!
 nd_tgd_relay_upkeep: "Содержание ретрансляционной станции" #NT!
 nd_tgd_relay_upkeep_desc: "Обеспечение ретрансляционной станции свежими лошадьми, зерном для всадников и скакунов, а также древесиной для ремонта конструкций." #NT!
 levy_nd_tgd_frontier_cavalry: "Пограничный кавалерийский сбор" #NT!
 levy_nd_tgd_frontier_cavalry_desc: "Степная конница формировалась из пограничных гарнизонов, сочетая тюркские традиции верховой езды с танской военной организацией." #NT!
 levy_nd_tgd_fubing: "Ополчение Фубина Леви" #NT!
 levy_nd_tgd_fubing_desc: "Солдаты-фермеры, призванные к оружию в рамках вахтовой системы обслуживания, обеспечивают обученные пехотные резервы с минимальными затратами." #NT!
 nd_tgd_tea_house: "Чайный цех" #NT!
 nd_tgd_tea_house_desc: "Мастерская по переработке сырых чайных листьев в готовый чай для продажи, сочетающая в себе методы сушки, обжарки и ферментации, отточенные веками." #NT!
 nd_tgd_tea_processing: "Обработка чайного листа" #NT!
 nd_tgd_tea_processing_desc: "Производство готового чая и настоек на его основе из сырых листьев с использованием традиционных методов обработки Тан." #NT!
 nd_tgd_gunpowder_foundry: "Пороховой литейный завод" #NT!
 nd_tgd_gunpowder_foundry_desc: "Военная мастерская по производству огненных стрел, зажигательных бомб и проторакет из селитры, железа и других материалов, практическое применение танских алхимических открытий." #NT!
 nd_tgd_fire_arrow_production: "Производство огненных стрел" #NT!
 nd_tgd_fire_arrow_production_desc: "Изготовление огненных стрел и зажигательного оружия с использованием пороховых смесей, разрушительного осадного и противокавалерийского оружия." #NT!
 nd_tgd_canal_warehouse: "Склад Гранд-Канала" #NT!
 nd_tgd_canal_warehouse_desc: "Крупный узел хранения и распределения вдоль Большого канала, обеспечивающий поток зерна, шелка и промышленных товаров между северным и южным Китаем." #NT!
 nd_tgd_canal_operations: "Эксплуатация канала" #NT!
 nd_tgd_canal_operations_desc: "Техническое обслуживание и эксплуатация складского комплекса «Гранд-Канал», включая ремонт доков, складских помещений и погрузочно-разгрузочные работы." #NT!
 nd_tgd_sogdian_merchant_quarter: "Согдийский торговый квартал" #NT!
 nd_tgd_sogdian_merchant_quarter_desc: "Специальный квартал в караван-сарае, где работают согдийские купцы, торгующие шелком, благовониями и лошадьми на великих сухопутных путях между Востоком и Западом." #NT!
 nd_tgd_export_ceramics: "Экспорт керамики" #NT!
 nd_tgd_export_ceramics_desc: "Массовое производство декорированных фарфоровых изделий для экспортных рынков по всей Евразии с использованием изысканных технологий глазурования и стандартизированного дизайна." #NT!
 nd_tgd_printing_workshop: "Мастерская печати на дереве" #NT!
 nd_tgd_printing_workshop_desc: "Собственная типография Академии Ханьлинь, использующая технику гравюры для воспроизведения императорских указов, экзаменационных текстов и научных работ для распространения по всей империи." #NT!
 nd_tgd_examination_hall: "Конфуцианский экзаменационный зал" #NT!
 nd_tgd_examination_hall_desc: "Провинциальный экзаменационный зал, где кандидаты-цзиньши проверяются на литературное творчество, политический анализ и моральную философию, меритократические ворота на имперскую службу." #NT!
 nd_tgd_examination_upkeep: "Техническое обслуживание обследования" #NT!
 nd_tgd_examination_upkeep_desc: "Расходные материалы для экзаменационной системы, включая бумагу для тестовых буклетов, справочные тексты для экзаменаторов и ткань для идентификации кандидатов." #NT!
 nd_tgd_border_watchtower: "Пограничная сторожевая башня" #NT!
 nd_tgd_border_watchtower_desc: "Сигнальная башня на границе обеспечивает раннее предупреждение о вторжениях кочевников с помощью сигнальных огней, видимых на огромных расстояниях в степи и пустыне." #NT!
 nd_tgd_watchtower_upkeep: "Обслуживание сторожевой башни" #NT!
 nd_tgd_watchtower_upkeep_desc: "Содержание пограничной сторожевой башни, включая вооружение для гарнизона, древесину для ремонта конструкций и камень для укреплений." #NT!
 nd_tgd_formed_tt: "была основана династия Тан." #NT!
 nd_tgd_path_a_tt: "Выбрал Западную реставрацию" #NT!
 nd_tgd_path_b_tt: "Выберите культурное господство" #NT!
 nd_tgd_destiny: "Судьба Тан" #NT!
 nd_tgd_destiny_desc: "Династия Тан была восстановлена. Обеспечив стабильность, Сын Неба теперь должен выбрать путь будущего империи: завоевание на запад, чтобы вернуть себе Протектораты, или внутреннее развитие искусств и знаний, которые определяли цивилизацию Тан на ее пике." #NT!
 nd_tgd_dest_silk_road_command: "Командование Шелкового пути" #NT!
 nd_tgd_dest_silk_road_command_desc: "Обезопасьте великие города Шелкового пути Самарканд и Бухару. Контроль над этими древними перекрестками означает владычество над богатейшими торговыми артериями, соединяющими Восток и Запад." #NT!
 nd_tgd_dest_steppe_hegemony: "Степная гегемония" #NT!
 nd_tgd_dest_steppe_hegemony_desc: "Распространите власть Тан на сердце Монголии в Каракоруме и бактрийские ворота в Балхе. Степь должна склониться перед Троном Дракона, прежде чем марш сможет продолжиться." #NT!
 nd_tgd_dest_tianxia_restored: "Тянься восстановлена" #NT!
 nd_tgd_dest_tianxia_restored_desc: "Завершите восстановление All Under Heaven, установив знамена Тан в Дели и Багдаде. Эти две древние столицы обозначают самый дальний горизонт амбиций Тан, универсальную империю, простирающуюся от Желтой реки до Евфрата." #NT!
 nd_tgd_dest_literary_canon: "Литературный канон" #NT!
 nd_tgd_dest_literary_canon_desc: "Культивируйте литературный и институциональный ренессанс, который превзойдет даже первоначальный золотой век Тан. Осваивайте банковское дело и развивайте обширную территорию империи, чтобы поддержать новый расцвет искусств." #NT!
 nd_tgd_dest_universal_learning: "Универсальное обучение" #NT!
 nd_tgd_dest_universal_learning_desc: "Сделайте столицу Тан центром мировой торговли и науки. Обеспечьте потоки шелка через ваши рынки и наполните свою казну, чтобы финансировать величайшую академическую систему, которую когда-либо видел мир." #NT!
 nd_tgd_dest_celestial_mandate: "Небесный мандат" #NT!
 nd_tgd_dest_celestial_mandate_desc: "Достигните окончательного синтеза знаний и цивилизации. Примите научную революцию, развивайте всю свою территорию и продемонстрируйте, что обучение Тан охватывает все области человеческих исследований." #NT!
 nd_tgd.7.t: "Мандат сохраняется" #NT!
 nd_tgd.7.d: "Империя стоит стабильно. С террас дворца Дамин восстановленный Тан обозревает мирное царство, царство, ожидающее направления, которое придаст ему новый хозяин. Вопрос перед Сыном Неба заключается не в том, выживет ли Тан, а в том, какую форму примет его выносливость.\n\nПредки построили империю, которая охватывала известный мир. Они также построили цивилизацию, которая ее осветила. Оба пути открыты." #NT!
 nd_tgd.7.a: "Мандат сохраняется." #NT!
 nd_tgd.8.t: "Четыре гарнизона взяты под защиту" #NT!
 nd_tgd.8.d: "Когда генерал Го Сяоке захватил Куча в 648 году, он установил образец для всех операций Тан в западных регионах: быстрые кавалерийские удары, за которыми следовали постоянные гарнизонные города, соединенные ретрансляционными станциями. Теперь Самарканд и Бухара, города, до которых даже император Тайцзун добрался только посредством дипломатии, несут наше знамя.\n\nСогдийские купцы, которые когда-то торговали под защитой тюрков, теперь признают сюзеренитет Тан. Великие базары Трансоксианы направляют свои богатства на восток по дорогам, патрулируемым нашей кавалерией. То, о чем мечтал Тайцзун: мы осуществили." #NT!
 nd_tgd.8.a: "Шелковый путь подчиняется Трону Дракона." #NT!
 nd_tgd.9.t: "Степные Луки" #NT!
 nd_tgd.9.d: "Каракорум, резиденция империи Чингисхана, теперь признает власть Тан. Балх, «Мать городов», завоеванный Александром Македонским, попадает под нашу защиту. Степные народы, которые на протяжении веков угрожали северным границам, были включены в состав имперского порядка.\n\nЭто достижение превосходит все, чего достиг первоначальный Тан. Даже в период своего расцвета контроль Тан над степью был спорным и временным. Мы сделали это постоянным. Вопрос теперь в том, как лучше всего управлять этими обширными завоеваниями." #NT!
 nd_tgd.9.a: "Собирайте дань для финансирования имперской экспансии." #NT!
 nd_tgd.9.b: "Принять кочевническую мобильность для наших армий." #NT!
 nd_tgd.10.t: "Все под небом" #NT!
 nd_tgd.10.d: "Дели и Багдад, два полюса мировой цивилизации, теперь признают верховенство Трона Дракона. Ни одна империя в истории не достигла того, чего достигли мы: единой суверенной власти, простирающейся от рисовых полей Янцзы до базаров Месопотамии, от степей Монголии до равнины Ганга.\n\nТан на своем первоначальном расцвете был одной великой державой среди нескольких. Возрожденная Тан — это нечто совершенно иное: универсальная империя, поглотившая или подчинившая все крупные цивилизации на материковой части Евразии. Концепция Тянься, «Все под небом», больше не является философским идеалом. Это геополитическая реальность." #NT!
 nd_tgd.10.a: "Установите Pax Sinica во всех странах." #NT!
 nd_tgd.10.b: "Мандат требует вечного расширения." #NT!
 nd_tgd.11.t: "Новый литературный канон" #NT!
 nd_tgd.11.d: "Ли Бай писал о лунном свете и вине. Ду Фу оплакивал страдания простых людей. Ван Вэй писал пейзажи, которые растворяли границу между словом и изображением. На протяжении веков их произведения определяли вершину человеческих литературных достижений.\n\nТеперь появилось новое поколение поэтов, эссеистов и философов, наследников традиции Тан, которые впитали и превзошли ее. Банки финансируют научные экспедиции. Новые технологии печати распространяют знания быстрее, чем когда-либо прежде. Огромное население империи, более грамотное, чем когда-либо, жаждет текстов любого рода." #NT!
 nd_tgd.11.a: "Начинается новый золотой век литературы." #NT!
 nd_tgd.12.t: "Академия всех наций" #NT!
 nd_tgd.12.d: "Оригинальная Академия Ханьлинь собрала лучшие умы Китая в одном учреждении. То, что мы построили, затмевает это во всех измерениях. Наши академии привлекают ученых всех наций: персидских астрономов, индийских математиков, тюркских лингвистов, корейских историков. Фонды доходов от шелкового производства обеспечили кафедры и исследовательские программы.\n\nРынки столицы переполнены продуктами этого интеллектуального фермента: астрономическими инструментами, медицинскими трактатами, географическими атласами и инженерными руководствами. Там, где танские ученые когда-то переводили буддийские сутры с санскрита, наши ученые синтезируют знания каждой традиции в единый корпус." #NT!
 nd_tgd.12.a: "Основал академии по всей империи." #NT!
 nd_tgd.12.b: "Пусть купцы и ученые обогащают друг друга." #NT!
 nd_tgd.13.t: "Небесная библиотека" #NT!
 nd_tgd.13.d: "Сику Цюаньшу, Полная библиотека четырех сокровищниц, была мечтой о полном знании: каждая книга достойна сохранения, копирования, каталогизации и хранения навечно. Мы превзошли даже эти амбиции.\n\nНаша Имперская библиотека содержит не только китайские тексты, но и накопленную мудрость всех цивилизаций, с которыми столкнулись наши учёные. Греческая философия соседствует с буддийской метафизикой. Арабская алгебра освещает конфуцианскую космологию. Индийская медицина дополняет китайскую фармакологию. Это не просто собрание книг. Это полное интеллектуальное наследие человечества, собранное под одной крышей и синтезированное в единое целое." #NT!
 nd_tgd.13.a: "Гармония всего обучения под небесами." #NT!
 nd_tgd.13.b: "Пусть соревнуются сотни научных школ." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_iron_tribute: "Железная дань" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_iron_tribute: "Покоренные степные народы платят дань лошадьми, скотом и серебром, обогащая имперскую казну и финансируя дальнейшие кампании по экспансии." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_steppe_logistics: "Степная Логистика" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_steppe_logistics: "Техника кочевой езды и огромные табуны лошадей завоеванных степных народов были интегрированы в военную доктрину Тан, что повысило скорость и скорость восстановления армии." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_pax_sinica: "Пакс Синица" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_pax_sinica: "Когда все основные цивилизации находятся под властью Тан, наступает всеобщий мир. Торговля процветает, опустошение заживает, и народы любого происхождения ассимилируются в космополитический порядок Тан." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_mandate_of_conquest: "Мандат завоевания" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_mandate_of_conquest: "Мандат Сына Неба требует, чтобы все земли признали его суверенитет. Каждая новая победа повышает престиж Тан и снижает стоимость дальнейших кампаний." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_academy_network: "Сеть академий" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_academy_network: "Сеть имперских академий в провинциях повышает грамотность и производство продуктов питания посредством применения научных знаний в сельском хозяйстве и управлении." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_merchant_scholars: "Ученые-торговцы" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_merchant_scholars: "Слияние коммерческого богатства и научных амбиций порождает класс ученых-торговцев, которые расширяют культурное влияние Тан через торговые пути, достигающие всех уголков известного мира." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_confucian_synthesis: "Конфуцианский синтез" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_confucian_synthesis: "Грандиозный синтез конфуцианской, буддийской и даосской мысли создает единую философскую основу, которая снижает стоимость институционального принятия и усиливает административный контроль." #NT!
 STATIC_MODIFIER_NAME_nd_tgd_dest_hundred_schools: "Сотня школ возрождается" #NT!
 STATIC_MODIFIER_DESC_nd_tgd_dest_hundred_schools: "Интеллектуальный плюрализм процветает по мере того, как конкурирующие школы мысли (законники, мохисты, даосы, конфуцианцы и иностранные традиции) стимулируют инновации во всех областях человеческого знания." #NT!
 nd_tgd_protectorate_command: "Командование Протектората" #NT!
 nd_tgd_protectorate_command_desc: "Высший военный штаб всех танских операций на западных территориях, объединяющий командование гарнизоном, сбор разведданных и дипломатическую координацию под единым руководством." #NT!
 nd_tgd_protectorate_upkeep: "Обеспечение команд" #NT!
 nd_tgd_protectorate_upkeep_desc: "Военные поставки для командования Протектората, включая оружие, кавалерийские скакуны, кожаное снаряжение и камень для укреплений." #NT!
 nd_tgd_imperial_library: "Императорская библиотека" #NT!
 nd_tgd_imperial_library_desc: "Величайшее хранилище знаний в истории человечества, вмещающее тексты всех цивилизаций и синтезирующее их в единый корпус знаний, развивающий все области человеческих исследований." #NT!
 nd_tgd_library_upkeep: "Обслуживание библиотеки" #NT!
 nd_tgd_library_upkeep_desc: "Содержание Императорской библиотеки, включая бумагу для копирования текстов, книги для приобретения, шелк для переплета и благовония для защиты рукописей от вредителей." #NT!
  
  # ===== BUREAUCRACIES ===== 
  
 AUTO_MODIFIER_NAME_nd_tgd_bureaucracy_authority: "Императорский аппарат Да Тан" #NT!
 AUTO_MODIFIER_DESC_nd_tgd_bureaucracy_authority: "Воссозданное государство Тан унаследовало троицу Саньшэн Любу, Юй-ши-тай с шестью цензурными бюро Люши и ученых Ханьлинь, основанных при Сюаньцзуне в 738 году. Рядом с неявным слотом столицы открываются два институциональных места, что позволяет династии укрепить три своих великих офиса Тан." #NT!
  
 tgd_sansheng_liubu_bureaucracy: "Саньшэн Любу" #NT!
 tgd_sansheng_liubu_bureaucracy_desc: "Три департамента и шесть советов: Чжуншу (Императорский секретариат) разрабатывал указы, Мэнся (канцелярия) рассматривала их и могла наложить вето, а Шаншу (департамент государственных дел) проводил утвержденную политику через шесть советов по кадрам, доходам, обрядам, войне, правосудию и работам. Унаследованная и усовершенствованная от Суй, форма Тан представляет собой институциональный шаблон, который адаптировали каждая поздняя китайская династия (Сун, Юань, Мин, Цин). В процессе работы проекты указов проходят рассмотрение и доходят до провинций; Когда три департамента заходят в тупик, канцелярия налагает вето быстрее, чем секретариат успевает составить проект, и советы перестают выполнять свою работу." #NT!
  
 tgd_keju_examinations_bureaucracy: "Экзамены Тан Кэджу" #NT!
 tgd_keju_examinations_bureaucracy_desc: "Тан унаследовал нововведение в экзаменах Суй и повысил степень цзиньши (655) до уровня престижа наряду с минцзин (классика), минфа (право), минсуань (математика) и другими направлениями. Императрица У Цзэтянь открыла экзамены для гораздо более широкого числа претендентов (около 690 человек) и использовала образовавшиеся когорты цзиньши, чтобы ослабить власть великого клана на высших должностях. Класс грамотных учёных и чиновников возвышается благодаря своим заслугам; наследственной аристократии навсегда запрещено занимать высшие гражданские посты. Когда система приходит в упадок, документы утекают, экзаменаторов подкупают, а фракционность поэтической клики заменяет административную компетенцию." #NT!
  
 tgd_juntian_zuyongdiao_bureaucracy: "Цзюньтянь и Цзу-Ён-Дяо" #NT!
 tgd_juntian_zuyongdiao_bureaucracy_desc: "Система равных полей (юнтианская) предоставляла каждому взрослому мужчине личную долю и долю по наследству земли из имперских резервов; взамен он был должен Цзу (зерно), Юн (двадцатидневная годовая трудовая повинность) и Дяо (моток ткани). Восстановленная на основе прецедента Северной Вэй и кодифицированная в Танском кодексе, эта система превратила каждого фермера в зарегистрированного солдата-налогоплательщика. Он финансировал высший Тан со времен правления Тайцзуна до начала восьмого века. Как только могущественные кланы начали поглощать крестьянские наделы, реестры разошлись с реальностью, и на смену им пришел Лян Шуй Фа 780 года: та же участь ждет любую заброшенную версию системы." #NT!
  
 tgd_fubing_militia_bureaucracy: "Система ополчения Фубин" #NT!
 tgd_fubing_militia_bureaucracy_desc: "С 606 по 749 год система Фубин сама набирала солдат из равноправных списков: каждый гарнизон фу отправлял людей в столицу и на границу с дежурствами, а солдаты оплачивали свое содержание из доли земли, которую они удерживали дома. Результатом стала огромная дешевая армия мотивированных солдат-землевладельцев, верных трону. Крах системы отразил крах системы равного поля: поскольку земельные книги стали фиктивными, а ротация оставалась незаполненной, Тан перешел к профессиональным бинму и размещенным на границе армиям под командованием Цзедуши, чья лояльность своему командиру, а не трону, положила конец династии." #NT!
  
 tgd_yushitai_censorate_bureaucracy: "Ю-ши-тай и Шесть бюро" #NT!
 tgd_yushitai_censorate_bureaucracy_desc: "Возглавляемый Юси дафу, Танский цензор организовал свою работу через три отдела (тайюаньские цензоры при дворе, штатные цензоры Дяньюань, занимающиеся повседневным управлением, и чаюаньские цензоры, проверяющие чиновников в любой точке королевства), при этом шесть бюро Люши назначали специального наблюдателя за каждым крупным советом. Цензоры обладали правом прямой памяти императора и могли привлечь к ответственности любого чиновника, включая Великих советников. Энергичный Цензорат поддерживал честность чиновников; захваченный, с цензорами, подкупленными великими кланами, которые они должны были контролировать, ускорил династический упадок." #NT!
  
 tgd_jiedushi_protectorates_bureaucracy: "Цзедуши и пограничные протектораты" #NT!
 tgd_jiedushi_protectorates_bureaucracy_desc: "Протекторат Аньси (640 г.) управлял Таримской котловиной и западными областями; протекторат Анбэй (647 г.) управлял степными кочевниками; реорганизация Аньси-Бэйтинг расширила влияние Тан до Памира. С 711 года они кристаллизовались в команды Цзедуши: военные комиссары, обладающие консолидированной военной, финансовой и гражданской властью вдоль границы. Эта система дала высшему Тану беспрецедентную стратегическую глубину и устойчивость снабжения. Это также дало Ань Лушаню, Цзедуши трех пограничных командований, ресурсы для похода на Чанъань в 755 году, восстания, которое навсегда сломило центральную власть Тан." #NT!
