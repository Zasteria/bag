l_russian:
  
 # === FORMATION EVENT === 
 nd_mro.1.t: "Халиф Южного моря" #NT!
 nd_mro.1.d: "Три столетия ислама изменили Минданао. От Маймбунга до Кута-Вату, от литейных заводов Ланао до причалов Винта на побережье Ирануна, суннитская вера связала воедино то, что ни один испанский, голландский или английский флот никогда не покорял.\n\nТеперь произошло невозможное. Соперничающие султанаты Сулу и Магинданао больше не воюют. Раджи Бутуана и дату Буаяна и Замбоанги вместе преклоняют колени. Пандиты и улемы говорили в один голос: Минданао тоже должен говорить в один голос.\n\nЖдёт единая клятва верности. Флот винты в плавании. Кали обнажены. Вопрос в том, каким государством будет этот султанат Моро.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_mro.1.a: "Султан-халиф моросов" #NT!
 nd_mro.1.b: "Конфедерация Датусов" #NT!
 nd_mro.1.c: "Мечом и парусом" #NT!
  
 # === FORMATION CHOICE MODIFIERS === 
 STATIC_MODIFIER_NAME_nd_mro_sultan_caliph: "Султан-халиф моросов" #NT!
 STATIC_MODIFIER_DESC_nd_mro_sultan_caliph: "Один султан, один халиф, одно знамя над Минданао. Улемы присягают на верность одному трону; школы пандитов преподают один и тот же фикх от Сулу до Ланао; Преобразование языческих и анимистических данных происходит с королевской санкции. Религиозная власть и политическая власть сливаются воедино." #NT!
 STATIC_MODIFIER_NAME_nd_mro_datu_confederation: "Конфедерация Датусов" #NT!
 STATIC_MODIFIER_DESC_nd_mro_datu_confederation: "Власть течет вверх от данных, а не вниз от султана. Каждый раджа держит своих вассалов, каждый вождь — свою территорию; Халиф — первый среди равных, а не господин всего. Цена единства оплачивается централизованной властью, но выигрыш состоит в сборе каждого клана и лояльности каждого дома данных." #NT!
 STATIC_MODIFIER_NAME_nd_mro_sword_and_sail: "Мечом и парусом" #NT!
 STATIC_MODIFIER_DESC_nd_mro_sword_and_sail: "Флоты винта отплывают в новолуние и возвращаются с добычей. От берегов Висайских островов до проливов Борнео ревут лантаки. Война — это не провал государственного управления, а его инструмент; джихад против неверующих – это дисциплина, которая объединяет нацию моро." #NT!
  
 # === ADVANCE EVENT 2: SHARIF UL-HASHIM === 
 nd_mro.2.t: "Фонд Шарифа уль-Хашима" #NT!
 nd_mro.2.d: "В 1457 году по христианскому летоисчислению уроженец Джохора ученый и миссионер Шариф уль-Хашим приехал в Буансу на острове Холо и был провозглашен султаном. Он пересек моря с Кораном, хрониками Пророка и генеалогиями, которые проследили его род до хашимитов. Там, где иерархия дату-раджи когда-то управляла только на основе предков, теперь она правит на основе предков, освященных исламом.\n\nПервой заботой Шарифа является сама доктрина: какое направление веры должен насаждать султанат Моро на своей почве? Ортодоксальные юристы Мекки с их систематизированным шафиитским фикхом и дисциплинированными школами присылают свои книги и своих ученых. Суфийские братства-тарикаты со своими святыми и популярными обращенными посылают своих живых учителей. Шариф должен сделать выбор." #NT!
 nd_mro.2.a: "Получите ортодоксальный шафиитский фикх из Мекки." #NT!
 nd_mro.2.b: "Насаждать среди народа суфийские братства тариката." #NT!
  
 # === ADVANCE EVENT 3: VINTA AND LANTAKA === 
 nd_mro.3.t: "Винта и Лантака" #NT!
 nd_mro.3.d: "Лодки теперь повсюду: корпуса аутригеров из дерева нара, латиновые паруса, раскрашенные в узоры окиров Сулу, установленные на палубе лантаки из бронзы, отлитые на литейных заводах Магинданао. Они меньше испанских галеонов, меньше даже брунейского перахуса, но быстрее обоих и собираются в группы, как осы.\n\nДебаты в диване султана острые. Иранунские данные хотят каперских грамот, набегов на побережье Висайи, рабов и грабежей для воинской знати. Королевское адмиралтейство хочет иметь регулярный флот, праху организованы в эскадры, лантаки стандартизированы, море Сулу превратилось в озеро Моро. Оба видения обещают одну и ту же винту, но совершенно разное ее применение." #NT!
 nd_mro.3.a: "Выпустите иранунских корсаров на Висайские острова." #NT!
 nd_mro.3.b: "Постройте королевское адмиралтейство в море Сулу." #NT!
 STATIC_MODIFIER_NAME_nd_mro_iranun_corsairs: "Иранунские корсары" #NT!
 STATIC_MODIFIER_DESC_nd_mro_iranun_corsairs: "Рейд Ирануна при лунном свете флотами из сорока винт, от Висайских островов до Малаккского пролива. Они забирают рабов, серебро, оружие и репутацию. Испанцы называют это пиратством; Моро называют это войной." #NT!
 STATIC_MODIFIER_NAME_nd_mro_lateen_admiralty: "Королевское Адмиралтейство" #NT!
 STATIC_MODIFIER_DESC_nd_mro_lateen_admiralty: "Корабелы султана работают на стандартизированных верфях. Корпуса Винты измеряются по одному шаблону, лантаки отливаются по одному каналу. Море Сулу становится дисциплинированным морем, патрулируемым эскадрами под зеленым знаменем." #NT!
  
 # === ADVANCE EVENT 4: SULTAN KUDARAT === 
 nd_mro.4.t: "Султан Кударат и долгое неповиновение" #NT!
 nd_mro.4.d: "Он — величайший султан, когда-либо созданный Минданао: Мухаммад Дипатуан Кударат, потомок Шарифа Кабунгсувана, правителя девяти современных провинций, человек, который отбросил испанцев в Ламитане в 1637 году с двумя тысячами воинов хураментадо и сдерживал их еще тридцать лет.\n\nЕго правление — золотой век Магинданао. Его диван принимает послов Брунея, Ачеха и Голландии. Его флот винта доминирует в море Сулу. Его имя произносится наравне с Сулейманом Великолепным и Акбаром Великим.\n\nТеперь Кударат сообщает: испанцы запросили условия. Выбор предстоит сделать ему, и от него будет зависеть характер его султаната." #NT!
 nd_mro.4.a: "Прижмите джихад Ламитана к воротам Манилы." #NT!
 nd_mro.4.b: "Подпишите Атьенцевский мир и вновь откройте гавани." #NT!
 STATIC_MODIFIER_NAME_nd_mro_lamitan_jihad: "Джихад Ламитана" #NT!
 STATIC_MODIFIER_DESC_nd_mro_lamitan_jihad: "Две тысячи хураментадо, поклявшиеся перед Аллахом умереть за веру, маршируют под знаменем моро. Кали обнажены; кампиланы сверкают; флот винты блокирует испанские порты. Война, а не мир – язык султана-халифа." #NT!
 STATIC_MODIFIER_NAME_nd_mro_kudarat_peace: "Мир в Атьенце" #NT!
 STATIC_MODIFIER_DESC_nd_mro_kudarat_peace: "В 1645 году договор подписан. Султан открывает свои гавани; Торговля Магинданао процветает. Жемчуг, черепаховый панцирь, рабы, пчелиный воск и рис текут через Котабато в Манилу и Макао. Золотой век Кударата родился из сдержанности, а не войны." #NT!
  
 # === ADVANCE EVENT 5: PANDITA SCHOOLS === 
 nd_mro.5.t: "Пандит и улемы" #NT!
 nd_mro.5.d: "В каждом городе Моро теперь есть пандит, человек, который учился у великих учителей Сулу, который, возможно, совершил хадж в Мекку, который может читать Коран на арабском языке и писать Таусуг хроник. Вокруг него собираются дети, но диван должен решить, какие дети.\n\nНекоторые пандиты учат всех, кто может сидеть перед ними: сына раба рядом с сыном дату, свободного человека рядом с наследником раджи. Другие оставляют более глубокие тексты для линий данных и улемов, будущих судей и послов Султаната. Оба видения обещают одну и ту же науку, но совершенно разные общества." #NT!
 nd_mro.5.a: "Откройте школы для всех: как для раба, так и для сына Дату." #NT!
 nd_mro.5.b: "Зарезервируйте их для линий дату и улама." #NT!
  
 # === ADVANCE EVENT 6: JURAMENTADO === 
 nd_mro.6.t: "Путь Хураментадо" #NT!
 nd_mro.6.d: "Он обрил голову, перевязал чресла и принес клятву перед имамом: он выйдет один или небольшими группами с калисом в руке и не вернется. Он считает, что пасть в джихаде — значит войти в Рай; он считает, что пули колонизатора не смогут отнять у него то, чего не пожелал Аллах.\n\nИспанцы называют его «juramentado»: «тот, кто поклялся». Они его не понимают и боятся.\n\nДиван султана должен решить, каково будет отношение к нему трона. Санкционировать хураментадо как лицензированный султаном воинский орден с имамами, присягающими на троне, и дисциплиной, вытекающей из дивана. Или пусть он сражается как народное сопротивление, за пределами трона, присягнув только Аллаху и имаму своей деревни." #NT!
 nd_mro.6.a: "Санкционируйте их как воинский орден, лицензированный султаном." #NT!
 nd_mro.6.b: "Пусть они сражаются как народное сопротивление за троном" #NT!
  
 # === ADVANCES (LOCALIZATION) === 
 nd_mro_sharif_ul_hashim: "Фонд Шарифа уль-Хашима" #NT!
 nd_mro_sharif_ul_hashim_desc: "Прибытие суннитского миссионера Шарифа уль-Хашима в Буансу в 1457 году основало султанат Сулу и привязало воинскую знать южных островов к хашимитской генеалогии и суннитской вере." #NT!
 nd_mro_kris_metallurgy: "Крис и Калис Металлургия" #NT!
 nd_mro_kris_metallurgy_desc: "Крисы с волнистыми лезвиями и более длинные кали выковываются в мастерских Минданао с использованием технологий, перешедших с Явы и Сулавеси: узоры памора, выкованные из многослойного железа, клинки, благословленные пандитами, рукояти, инкрустированные серебром и слоновой костью." #NT!
 nd_mro_datu_oath: "Клятва Дату" #NT!
 nd_mro_datu_oath_desc: "Доисламская система дату, раджи и тимавы слилась с новым Султанатом. Каждый дату сохраняет за собой своих вассалов и свои земли, но присягает на верность султану-халифу в начале каждого правления." #NT!
 nd_mro_balangay_seafarers: "Балангайские мореплаватели" #NT!
 nd_mro_balangay_seafarers_desc: "Построенный из досок балангай, предок винты, пересекал море Сулу с незапамятных времен. Его преемники развозят воинов моро по всем побережьям в радиусе тысячи лиг от Минданао." #NT!
 nd_mro_pandita_schools: "Школы Пандитов" #NT!
 nd_mro_pandita_schools_desc: "Пандит преподает Коран и право в своей школе с открытыми стенами. Вокруг него собираются как дети датуса, так и рабы; от него произошло следующее поколение клерков, судей и имамов народа моро." #NT!
 nd_mro_vinta_fleets: "Флоты Винты" #NT!
 nd_mro_vinta_fleets_desc: "Боевые корабли с выносными опорами и палубными лантаками. Быстрее любого испанского галеона, его труднее поймать, чем любой голландский фрегат. Винта — краеугольный камень морской мощи Моро." #NT!
 nd_mro_kalis_warriors: "Калис Воины" #NT!
 nd_mro_kalis_warriors_desc: "Калис с волнистыми лезвиями владеют каждым достойным воином моро. Как при абордажах, так и в лесных стычках его змеевидный край наносит раны, которые трудно заживить." #NT!
 nd_mro_iranun_raiders: "Иранунские рейдеры" #NT!
 nd_mro_iranun_raiders_desc: "Иранунские жители залива Иллана совершали набеги с тех пор, как испанцы впервые ступили на Себу. Их флот простирается от Борнео до Висайских островов, захватывая рабов, грабежи и репутацию." #NT!
 nd_mro_kuta_fortifications: "Кута частоколы" #NT!
 nd_mro_kuta_fortifications_desc: "Кута представляет собой кольцевой деревянный частокол, защищенный лантаками, рвами и бамбуковыми шипами. Кута Вату и десятки подобных ему на протяжении веков противостояли испанской артиллерии." #NT!
 nd_mro_sultan_kudarat: "Правление султана Кударата" #NT!
 nd_mro_sultan_kudarat_desc: "Мухаммад Дипатуан Кударат (годы правления 1619–1671 гг.), величайший султан, когда-либо созданный Минданао, правитель девяти современных провинций, защитник южных островов, человек, чье имя до сих пор упоминается, когда моро говорят о сопротивлении." #NT!
 nd_mro_lantaka_foundries: "Литейные заводы Лантаки" #NT!
 nd_mro_lantaka_foundries_desc: "Бронзовые поворотные ружья, отлитые в мастерских Магинданао и Сулу. Лантака вооружает каждую винту и куту и ​​служит валютой при междату-браках и дани." #NT!
 nd_mro_sulu_brunei_axis: "Ось Сулу-Бруней" #NT!
 nd_mro_sulu_brunei_axis_desc: "Королевские браки связывают Сулу, Магинданао и Бруней в единую исламскую династическую сеть, простирающуюся от северного Борнео до Минданао. Дань, торговля и общие генеалогии скрепляют альянс." #NT!
 nd_mro_court_administration: "Диван султана" #NT!
 nd_mro_court_administration_desc: "Султан-халиф принимает дату, послов, пандитов и улемов в суде, построенном по образцу великих диванов исламского мира. Указы записаны на арабском и таусугском языках; посольства прибывают из Ачеха, Брунея и побережья Великих Моголов." #NT!
 nd_mro_pansacan_corsairs: "Пансаканские корсарские флоты" #NT!
 nd_mro_pansacan_corsairs_desc: "Организованные эскадрильи винтас под датами Иранун и Самал доминируют в море Целебес. Они блокируют испанские порты, перехватывают голландские суда и превращают пролив между Минданао и Борнео в шоссе Моро." #NT!
 nd_mro_kampilan_warriors: "Кампиланские носители" #NT!
 nd_mro_kampilan_warriors_desc: "Двуручным кампиланом, мечом золотого века Магинданао, владеют элитные ударные войска постоянных рот султана. Его вес пробивает шлемы; его длина отпугивает испанских копейщиков." #NT!
 nd_mro_pearl_trade: "Торговля жемчугом Сулу" #NT!
 nd_mro_pearl_trade_desc: "Жемчужные банки Тави-Тави и Джоло приносят драгоценные камни, которые достигают Пекина, Мекки и Амстердама. Жемчуг Сулу — инструмент дипломатии моро и богатства датату Таусуг." #NT!
 nd_mro_madrasah_network: "Сеть медресе" #NT!
 nd_mro_madrasah_network_desc: "В медресе с каменными стенами в каждом крупном городе Моро преподают арабский язык, фикх и хроники ислама. Выпускники служат судьями, послами и пандитами на южных островах." #NT!
 nd_mro_garay_corsairs: "Корсары Гарай" #NT!
 nd_mro_garay_corsairs_desc: "Гарай — это огромный иранунский рейдовый военный корабль поздней зоны Сулу, больше, чем винта, несущий на борту дюжину лантак, управляемых веслами для безветренной погоды, предназначенных для грабежей и захвата пленных во время великих сезонных рейдов." #NT!
 nd_mro_juramentado: "Путь Хураментадо" #NT!
 nd_mro_juramentado_desc: "Хураментадо поклялся перед имамом умереть в джихаде. Он нападает в одиночку или небольшими группами с калисом в руке, зная, что не вернется. Он — ответ народа моро на три столетия колониальной войны." #NT!
 nd_mro_cotta_fortresses: "Каменные крепости Котта" #NT!
 nd_mro_cotta_fortresses_desc: "Котта — это великая каменная крепость поздних войн моро: обнесенные стенами, развевающиеся знамена, вооруженные лантаками цитадели, где знамя султана развевается еще долго после того, как колонизатор считает, что война выиграна." #NT!
 nd_mro_pearl_divers: "Дайвинг жемчуга Тави-Тави" #NT!
 nd_mro_pearl_divers_desc: "Организованные водолазные флоты дайверов Сама-Баджау и Таусуг собирают огромные жемчужные банки. Их работа, опасная и низкооплачиваемая, питает богатство позднего Султаната и экономику зоны Сулу." #NT!
 nd_mro_sulu_zone: "Экономика зоны Сулу" #NT!
 nd_mro_sulu_zone_desc: "В период своего расцвета зона Сулу является крупнейшей рабовладельческой и рейдерской экономикой в ​​морской Юго-Восточной Азии. Флоты винта и гарай собирают пленников, жемчуг и лесные продукты на тысячах миль побережья и продают их в Кантон, Батавию и Манилу." #NT!
 nd_mro_long_jihad: "Долгий джихад" #NT!
 nd_mro_long_jihad_desc: "Три столетия колониальной войны не сломили моро. Они продолжают сражаться в куте, в котте, в глубинке, в джунглях, на пути хураментадо. Империя колонизатора поднимается и падает; зеленое знамя остается." #NT!
 nd_mro_pan_moro_unity: "Панморо единство" #NT!
 nd_mro_pan_moro_unity_desc: "Таусуг, Магинданао, Иранун, Маранао, Сама-Баджау и Якан признают себя одним народом, Бангса Моро, связанным верой, калисами, винтой и тремя столетиями общего сопротивления." #NT!
  
 nd_mro_steam_corsairs: "Паровые корсары" #NT!
 nd_mro_steam_corsairs_desc: "Корабелы моро из Сандакана и Маймбунга приняли небольшой паровой катер в качестве преемника винты. Рейдовые корабли с паровым приводом, быстрее любого паруса, от которых труднее спастись, чем любой весельный гарай, переносят долгий джихад в эпоху угля." #NT!
 nd_mro_bangsa_moro: "Бангса Моро" #NT!
 nd_mro_bangsa_moro_desc: "Таусуг, Магинданао, Маранао, Иранун, Сама-Баджау, Якан, Сангил, Джама Мапун, Калаган, Калибуган, Палавани, Молбог и Сангир — все признают себя одной нацией: Бангса Моро, народ моро, южная альтернатива колониальному навязыванию, которое длилось три столетия и не сломается." #NT!
  
 # === BUILDINGS === 
 nd_mro_kris_foundry: "Крис Литейный" #NT!
 nd_mro_kris_foundry_desc: "Традиционная кузнечная мастерская, где из слоистого железа выковывают крисы с волнистыми лезвиями и более длинные калисы. На каждом клинке имеется узор памора его кузнеца и благословение пандита." #NT!
 nd_mro_kuta: "Кута" #NT!
 nd_mro_kuta_desc: "Окольцованный деревянный частокол, защищенный лантаками, рвами и бамбуковыми шипами. Кута — это рабочая лошадка фортификационных сооружений южных островов: она дешевле камня, быстрее строится и удивительно устойчива к колониальной артиллерии в тропической местности." #NT!
 nd_mro_lantaka_foundry: "Литейный завод Лантаки" #NT!
 nd_mro_lantaka_foundry_desc: "Литейный бронзовый цех отливает поворотное ружье Лантака. Лантаки вооружают каждую винту и каждую куту и ​​служат валютой, приданым и данью среди данных." #NT!
 nd_mro_diwan: "Диван Султана" #NT!
 nd_mro_diwan_desc: "Двор султана-халифа, построенный по образцу великих диванов исламского мира. Здесь собираются Дату, послы, пандиты и улемы; указы записаны на арабском и таусугском языках." #NT!
 nd_mro_madrasah: "Мечеть-медресе" #NT!
 nd_mro_madrasah_desc: "Мечеть с каменными стенами и школа Корана в одном. Дети дату и рабов одинаково изучают арабский язык, фикх и хроники ислама под опекой пандита." #NT!
 nd_mro_cotta: "Котта" #NT!
 nd_mro_cotta_desc: "Великая каменная крепость поздних войн Моро: обнесенная стенами, развевающаяся знамёна, вооруженная лантаками. Если кута бросает вызов артиллерии колонизатора, то котта бросает вызов его армиям." #NT!
 nd_mro_pearl_diver_camp: "Лагерь дайверов за жемчугом" #NT!
 nd_mro_pearl_diver_camp_desc: "Организованный водолазный флот дайверов Сама-Баджау и Таусуг, работающий на жемчужных отмелях Тави-Тави, Джоло и архипелаге Сулу." #NT!
  
 # === BUILDING PRODUCTION METHODS === 
 nd_mro_kris_smithing: "Крис Смитинг" #NT!
 nd_mro_kris_smithing_desc: "Чеканная ковка криса с волнистым клинком, клинка воина каждого дома дату." #NT!
 nd_mro_kalis_blades: "Калис Ковка" #NT!
 nd_mro_kalis_blades_desc: "Ковка длинного калиса, большого волнистого меча знати воинов моро." #NT!
 nd_mro_kris_foundry_maintenance: "Содержание литейного производства" #NT!
 nd_mro_kris_foundry_maintenance_desc: "Железо, древесный уголь и древесина для кузнечных костров; инструменты для кузнецов, которые поддерживают литейный цех." #NT!
 nd_mro_kuta_garrison: "Кутинский гарнизон" #NT!
 nd_mro_kuta_garrison_desc: "Пиломатериалы для ремонта частокола, оружие для стражей, а также рис и рыба, чтобы их накормить." #NT!
 nd_mro_bronze_lantaka: "Бронза Лантака Литье" #NT!
 nd_mro_bronze_lantaka_desc: "Отливка бронзовых поворотных орудий из меди и железа, каждая лантака соответствует размеру винты или стены куты, которую она будет защищать." #NT!
 nd_mro_lantaka_foundry_maintenance: "Содержание литейного производства" #NT!
 nd_mro_lantaka_foundry_maintenance_desc: "Медь и железо для форм, уголь для печей и инструменты для литейщиков." #NT!
 nd_mro_diwan_court: "Султанский суд" #NT!
 nd_mro_diwan_court_desc: "Бумага для указов, тонкая ткань для церемоний, чай и благовония для зала аудиенций." #NT!
 nd_mro_madrasah_lessons: "Уроки Пандита" #NT!
 nd_mro_madrasah_lessons_desc: "Бумага для студентов, благовония для молитв и тонкая ткань для одежды имама." #NT!
 nd_mro_cotta_garrison: "Котта Гаррисон" #NT!
 nd_mro_cotta_garrison_desc: "Оружие, каменная кладка и пиломатериалы для ремонта; рис и рыба, чтобы выдержать долгую осаду." #NT!
 nd_mro_pearl_harvest: "Жемчужный урожай" #NT!
 nd_mro_pearl_harvest_desc: "Водолазные катера, снабженные железными ножами и военно-морским такелажем; рыба, чтобы поддержать дайверов в течение долгих дней на берегу." #NT!
 nd_mro_pearl_camp_maintenance: "Содержание лагеря" #NT!
 nd_mro_pearl_camp_maintenance_desc: "Рыба, лес и военно-морские припасы для поддержания водолазного флота в море." #NT!
  
 # === UNITS === 
 n_nd_mro_vinta: "Винта" #NT!
 n_nd_mro_vinta_desc: "Военный корабль с аутригерами и латиноамериканским вооружением, вооруженный палубными лантаками. Быстрее любого испанского галеона, его труднее поймать, чем любой голландский фрегат, краеугольный камень морской мощи Моро." #NT!
 n_nd_mro_garay: "Гарай" #NT!
 n_nd_mro_garay_desc: "Огромный рейдовый корабль Иранун поздней зоны Сулу: больше, чем винта, с веслами для безветренной погоды, на борту находится дюжина лантак и абордажный отряд воинов калис." #NT!
 a_nd_mro_balangay_warriors: "Балангайские воины" #NT!
 a_nd_mro_balangay_warriors_desc: "Береговые сборы, собираемые для набегов и береговой обороны: экипажи балангая, предка винты, сражающиеся как на суше, так и на море." #NT!
 a_nd_mro_kalis_warriors: "Калис Воины" #NT!
 a_nd_mro_kalis_warriors_desc: "Дворяне-воины моро с калисами с волнистыми лезвиями. В ближнем бою и на абордаже их клинки наносят раны, которые трудно заживить. Калиса боятся по всей морской Юго-Восточной Азии." #NT!
 a_nd_mro_kampilan_warriors: "Кампиланские носители" #NT!
 a_nd_mro_kampilan_warriors_desc: "Элитная ударная пехота, владеющая двуручным кампиланом, мечом золотого века Магинданао. Кампилан пробивает шлемы и расчищает линию для носильщиков крисов позади." #NT!
  
 a_nd_mro_iranun_raiders: "Иранун Рейдеры" #NT!
 a_nd_mro_iranun_raiders_desc: "Прибрежные пираты-воины залива Иллана: команды винта и гарай, которые сражаются так же хорошо, как и наземные рекруты, быстро пересекают прибрежную местность и опустошают грабительские набеги." #NT!
 levy_nd_mro_iranun_raiders: "Иранун Рейдеры" #NT!
 levy_nd_mro_iranun_raiders_desc: "Прибрежный рейдовый сбор из залива Иллана; быстрый, грабительский и одинаково чувствующий себя как на суше, так и на море." #NT!
 # === LEVIES === 
 levy_nd_mro_balangay_warriors: "Балангайские воины" #NT!
 levy_nd_mro_balangay_warriors_desc: "Экипажи берегового рейдового флота, одинаково хорошо сражающиеся на суше и на море." #NT!
 levy_nd_mro_kalis_warriors: "Калис Воины" #NT!
 levy_nd_mro_kalis_warriors_desc: "Дворяне-воины моро, собранные для ближнего боя под зеленым знаменем." #NT!
 levy_nd_mro_kampilan_warriors: "Кампиланские носители" #NT!
 levy_nd_mro_kampilan_warriors_desc: "Элитная ударная пехота с кампиланами золотого века Магинданао." #NT!
  
 # === EVENT VARIABLE TOOLTIPS === 
 nd_mro_formed_tt: "Образовал Султанат Моро." #NT!
 nd_mro_path_a_tt: "Путь султана-халифа: централизованная исламская монархия." #NT!
 nd_mro_path_b_tt: "Путь Конфедерации Датуса: федеральная воинская знать." #NT!
 nd_mro_path_c_tt: "Путь меча и паруса: морской джихад." #NT!
  
 # === DESTINY TREE === 
 nd_mro_destiny: "Знамя султана-халифа" #NT!
 nd_mro_destiny_desc: "Провозглашено государство моро: один султан, одно знамя, одна умма от Сулу до Суригао. Пандит прочитал хутбу от имени султана; данные целуют зеленый флаг в каждой гавани. Теперь предстоит выбрать судьбу Бангса Моро.\n\n#bold Требуется:#! 75 стабильности." #NT!
  
 # Path A: Sword of the Caliph 
 nd_mro_dest_juramentado_corps: "Корпус Хураментадо" #NT!
 nd_mro_dest_juramentado_corps_desc: "Постоянные отряды воинов, присягнувших на юрате, воспитываются и обучаются с детства. Крис обнажается в Висайских островах; Сулу-винта наносит удар по побережью Брунея. Южные острова узнают, сколько стоит пересечь страну моро.\n\n#bold Требуется:#! Путь судьбы Меча и Паруса; собственный Себу (Сингхапала); собственный Бруней (Берун); 30 размер армии." #NT!
 nd_mro_dest_lantaka_armada: "Лантака Армада" #NT!
 nd_mro_dest_lantaka_armada_desc: "Флоты винта и гарай патрулируют от Малуку до Сабаха. Батареи Лантака закрывают моря Сулу и Целебес для колониального судоходства. Над подступами к Спайсу реет знамя Султана-Халифа.\n\n#bold Требуется:#! Собственный Тернате; собственный Бруней (Апи Апи); собственный Сандакан; 50-й размер армии." #NT!
 nd_mro_dest_sulu_caliphate: "Халифат Южных морей" #NT!
 nd_mro_dest_sulu_caliphate_desc: "Манила пала. Тондо молится пять раз в день. Гова преклоняет колени перед султаном-халифом. Колониальному веку ответили мечом и парусом, и южные моря наконец-то превратились в озеро Моро. Открывает доступ к Братству Хураментадо.\n\n#bold Требуется:#! Собственная Майнила; собственное Тондо; собственная Гова; 3000 золотых." #NT!
  
 # Path B: Sultan and Pandita 
 nd_mro_dest_sharia_codification: "Кодификация шариата" #NT!
 nd_mro_dest_sharia_codification_desc: "Кади собираются в диване султана. Фикх южных островов впервые изложен в письменной форме, основанный как на шафиитской юриспруденции, так и на обычаях Таусуг. Начинается эпоха законничества моро.\n\n#bold Требуется:#! Путь судьбы султана-халифа; принял легализм; 1000 золота; 50 престижа." #NT!
 nd_mro_dest_pan_islamic_trade: "Панисламская торговая сеть" #NT!
 nd_mro_dest_pan_islamic_trade_desc: "Жемчуг моро, пчелиный воск и панцирь черепахи достигают Ачеха, Малакки и Брунея. Указ султана простирается от моря Сулу до Малаккского пролива, объединяя исламские торговые пути морской Юго-Восточной Азии под одним знаменем.\n\n#bold Требуется:#! Собственная Малакка; собственный Бандар-Ачех; собственный Бруней (Берун); 2000 золото." #NT!
 nd_mro_dest_madrasah_civilization: "Цивилизация Пандита" #NT!
 nd_mro_dest_madrasah_civilization_desc: "Южные острова стали маяком суннитской цивилизации. Медресе в каждом городе, кади в каждом диване, улемы, прошедшие обучение в Мекке, возвращаются преподавать в Котабато и Джоло. От Палембанга на Суматре до Демака на Яве — великие исламские города морской Азии подчиняются одному халифу.\n\n#bold Требуется:#! Собственный Палембанг; собственный Демак; 75 престижа; 3000 золотых. Открывает Большую мечеть." #NT!
  
 # === DESTINY EVENT 7: ROOT === 
 nd_mro.7.t: "Знамя развернуто" #NT!
 nd_mro.7.d: "На ступенях султанского дивана перед собравшимися дату, пандитами, улемами и послами южных островов разворачивается зеленое знамя моро. Читается шахада; крисов целуют; Имя султана провозглашается на пятничной хутбе от Маймбунга до озера Ланао.\n\nПуть народа моро теперь в руках султана, и судьба Бангса Моро открыта для выбора." #NT!
 nd_mro.7.a: "Знамя поднято." #NT!
  
 # === DESTINY EVENT 8: PATH A STAGE 1 === 
 nd_mro.8.t: "Корпус Хураментадо" #NT!
 nd_mro.8.d: "Во дворе великой куты Маймбунга имам связывает чресла первой сотни. Они побрили головы, совершили вуду и поклялись перед Аллахом и султаном умереть в джихаде, а не разорвать ряды.\n\nДиван обсуждает миссию корпуса. Некоторые требуют, чтобы братство крисов было подготовлено к удару в ближнем бою, который сломил испанцев при Ламитане. Другие требуют винта-корсара-юраментадо, поклявшегося умереть в абордаже против колониальных галеонов. Рука султана будет взвешивать эту доктрину." #NT!
 nd_mro.8.a: "Тренируйте братство Крисов: шок в ближнем бою" #NT!
 nd_mro.8.b: "Тренируйте винта-корсар-хураментадо: морской абордаж" #NT!
  
 # === DESTINY EVENT 9: PATH A STAGE 2 === 
 nd_mro.9.t: "Армада захватывает внутренние моря" #NT!
 nd_mro.9.d: "С литейных заводов Магинданао лантаки спускаются сотнями. От пристаней Сулу эскадры винта отплывают флотами по сорок человек. Испанский галеон и голландский фрегат возвращаются в Тернате; Брунейский пераху выстраивается в очередь в Сандакане. Южные моря — это озеро Моро.\n\nДиван султана обсуждает, как использовать эту армаду. Данные Ирануна предсказывают великий набег: серия грабежей, достигающая Миндоро и западного побережья Борнео. Королевское адмиралтейство призывает к великой блокаде: закрытие Малуку приближается к каждому европейскому флагу." #NT!
 nd_mro.9.a: "Выпустите иранунских корсаров на Висайские острова и Борнео." #NT!
 nd_mro.9.b: "Закройте подступы к Малуку королевской блокадой." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_armada_corsairs: "Иранунская армада" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_armada_corsairs: "Флоты корсаров простираются от Миндоро до Борнео, захватывая рабов, серебро и репутацию. Отряды моро движутся вместе с приливами, пополняемые набегами и данью, и зарабатывают славу в каждой кампании." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_spice_blockade: "Блокада Малуку" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_spice_blockade: "Жемчуг и специи текут в казну султана, поскольку европейские компании отворачиваются от Тернате. Блокада обогащает казну и склоняет великие державы за стол переговоров, хотя каменщиков и плотников с родных островов вытягивают на военные арены." #NT!
  
 # === DESTINY EVENT 10: PATH A STAGE 3 (CAPSTONE) === 
 nd_mro.10.t: "Халифат Южных морей" #NT!
 nd_mro.10.d: "Манила пала перед Калисом. Колокола Тондо молчат; Пятничная хутба читается с кафедры собора конкистадоров. Гова становится на колени. Бруней возобновляет свою присягу. Султан-халиф моросов является хозяином каждого побережья от Сулавеси до Лусона.\n\nДиван сейчас обдумывает форму, которую примет это владычество. Некоторые говорят, что нация моро должна стать настоящим халифатом: государством войны и шариата, дисциплинированных корпусов и победоносных армий, которое не остановится, пока на каждом острове не будет поднято зеленое знамя. Другие говорят, что доминион уже завоеван, и что будущее за упорядоченной экономикой Зоны Сулу: морской империей жемчуга, рабов и даннической торговли." #NT!
 nd_mro.10.a: "Создайте настоящий халифат меча и шариата." #NT!
 nd_mro.10.b: "Освойте экономику зоны Сулу на пике своего развития." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_southern_caliphate: "Южный Халифат" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_southern_caliphate: "Халифат Моро марширует дисциплинированными отрядами. Военная тактика калисов и кампиланов изложена в руководстве султана; осаждающий узнает ров куты и каменную стену котты. Гражданская рука государства легка, ибо меч – это закон." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_empire: "Зона Сулу на пике" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_empire: "Жемчуг, рабыня, пчелиный воск и лесная продукция текут через зону Сулу в невиданных ранее объемах. Казначейство наполняется; ростовщики Кантона предлагают свои лучшие ставки. Южные острова богатеют за счет набегов и торговли, но совесть мусульманского мира косо смотрит на закованных в цепи пленников на рынке Холо." #NT!
  
 # === DESTINY EVENT 11: PATH B STAGE 1 === 
 nd_mro.11.t: "Кодификация шариата" #NT!
 nd_mro.11.d: "Кади собираются под знаменем султана: ученые из Сулу, Магинданао, Буаяна и озера Ланао, каждый из которых приносит свои хроники, свои шафиитские тексты и свое обычное право. В течение года они спорят.\n\nИм предстоит решить более глубокий вопрос: будет ли новый фикх чистой шафиитской ортодоксальностью, полностью перенесенной из школ Мекки, чтобы народ моро мог говорить на том же правовом языке, что и более широкая умма? Или это будет гибридный кодекс, объединяющий Коран и шафиитскую школу с обычаями даты, шариат Моро, ответственный только перед самим собой?" #NT!
 nd_mro.11.a: "Чистая шафиитская ортодоксия из Мекки" #NT!
 nd_mro.11.b: "Гибридный кодекс, сочетающий в себе шафиитский обычай и обычай Таусуг." #NT!
  
 # === DESTINY EVENT 12: PATH B STAGE 2 === 
 nd_mro.12.t: "Панисламская сеть" #NT!
 nd_mro.12.d: "Жемчужина Моро достигает Мекки. Пчелиный воск Моро достигает Хадрамаута. Паломники-моро, одетые в белые одежды ихрама, идут по хараму с хаджи из Ачеха, Бенгалии и побережья Великих Моголов. Южные острова вошли в исламский мир Индийского океана в качестве полноправных членов.\n\nСултан должен выбрать, как будет устроена эта сеть. Торговая партия призывает к созданию караванной системы хаджа: прямых сухопутных и зарубежных маршрутов паломничества, обеспеченных данью и договорами, которые перетягивают богатства уммы через Магинданао. Дипломатическая партия призывает к заключению великого договора с Ачехом и Брунеем: конфедерации суннитских султанатов, которая будет противостоять всем христианским и индуистским силам в восточных морях." #NT!
 nd_mro.12.a: "Постройте караваны для хаджа через Магинданао." #NT!
 nd_mro.12.b: "Подпишите договор Ачех-Сулу-Бруней." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_hajj_caravans: "Караваны хаджа" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_hajj_caravans: "Колонны паломников движутся из Котабато в Мекку и обратно по охраняемым маршрутам. С ними едут торговцы моро; Монета Моро признана в Адене и Сурате; Имя султана приветствуется в каждом порту уммы." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_aceh_compact: "Ачехский договор" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_aceh_compact: "Ачех, Сулу, Бруней и Магинданао связаны единым договором: общие посольства, общие шпионы, общие корабелы. Ни одна христианская держава не движется в восточных морях без того, чтобы об этом не услышал султан-халиф." #NT!
  
 # === DESTINY EVENT 13: PATH B STAGE 3 (CAPSTONE) === 
 nd_mro.13.t: "Цивилизация Пандита" #NT!
 nd_mro.13.d: "Южные острова стали самостоятельной исламской цивилизацией. Медресе есть в каждом городе. Фикх преподается как на арабском языке Таусуг, так и на арабском языке Магинданао. Судьи-пандиты разрешают каждый спор от Сандакана до Себу. Паломники с Явы и Брунея приезжают на север, чтобы учиться в Котабато и Холо.\n\nСейчас диван султана-халифа считается вершиной этой цивилизации. Некоторые считают, что будущее за тарикатом: суфийскими братствами, которые проникли даже в самые отдаленные районы, связывая Бангса Моро любовью и песней. Другие считают, что будущее за законниками: султаном-соломоном, правящим южными морями в справедливости и порядке, равным любому халифу на исламской памяти." #NT!
 nd_mro.13.a: "Расширьте возможности суфийских братств тариката." #NT!
 nd_mro.13.b: "Царствуйте как Султан-Соломон, высший законник." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_tariqa_brotherhood: "Братства Тарика" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_tariqa_brotherhood: "Суфийские ордена проникают в каждую деревню. Зикр поется во время каждой хафлы; Обращение происходит не мечом, а песней. Бангса Моро придерживается более широкого ислама, принимая во внимание местные обычаи, хотя улемы-законники жалуются на расплывчатость доктрин." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_sultan_solomon: "Султан-Соломон" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_sultan_solomon: "Султан правит с мудростью Сулеймана: каждое прошение рассматривается, каждый закон соблюдается, каждое данное наказывается. Южные острова управляются как единое упорядоченное королевство. Гражданская дисциплина отдаляется от военной; стены куты становятся тоньше, а залы диванов становятся величественнее." #NT!
  
 # === DESTINY BUILDINGS === 
 nd_mro_juramentado_brotherhood: "Братство Хураментадо" #NT!
 nd_mro_juramentado_brotherhood_desc: "Постоянный капитул воинов, присягнувших юрату. Мальчиков берут молодыми, обучают в течение десяти лет в калисе и кампилане и связывают клятвой умереть перед отступлением. Братство — это постоянная рука султана-халифа и гроза каждого колониального гарнизона." #NT!
 nd_mro_jurat_oath: "Клятва Джурата" #NT!
 nd_mro_jurat_oath_desc: "Оружие и провизия для братства: клинки калис для каждого новичка, кампиланы для корпуса и простой рацион воина, проходящего обучение." #NT!
 nd_mro_grand_mosque: "Большая мечеть" #NT!
 nd_mro_grand_mosque_desc: "Великая соборная мечеть южных островов. Его минарет возвышается над султанским диваном; его михраб указывает на Мекку; его пятничная хутба объединяет Бангса Моро в одну умму под руководством одного султана-халифа." #NT!
 nd_mro_grand_mosque_upkeep: "Служба мечети" #NT!
 nd_mro_grand_mosque_upkeep_desc: "Прекрасная ткань для одежды имама, бумага для записей кади, благовония и пчелиный воск для пятничных молитв и долгих ночей зикра." #NT!
  
 # ===== BUREAUCRACIES ===== 
 mro_ruma_bichara_bureaucracy: "Рума Бичара" #NT!
 mro_ruma_bichara_bureaucracy_desc: "Консультативный государственный совет султаната Сулу (его аналог в Магинданао, называемый Бичара Атас), состоящий из ведущих дат и постоянных шарифов. Дату Раджа Муда, Дату Махараджа Адендук, Дату Ладжа Лаут и другие титулованные офицеры встретились на совете; каждый имел один голос, султан — два, а раджа Муда — два. Помимо советов, Рума Бичара избрала наследника султана по мужской линии, что не позволяло ни одному султану игнорировать его." #NT!
  
 mro_pandita_madrasah_bureaucracy: "Сеть медресе Пандита" #NT!
 mro_pandita_madrasah_bureaucracy_desc: "Исламское образование было организовано в домах пандитов (санскритский «ученый человек») и мечетях, основанных на Минданао и Сулу с конца тринадцатого века арабскими миссионерами. Каждый дату имел своего пандита в качестве религиозного наставника; вместе они составляли улемов Бангса Моро. Обучение Корану проводилось в домах пандитов и мечетях, готовя грамотных клерков, необходимых канцелярии султана, и следя за доктринальной сплоченностью, которая поддерживала претензии султана-халифа." #NT!
  
 mro_tarsila_chancery_bureaucracy: "Канцелярия Тарсила" #NT!
 mro_tarsila_chancery_bureaucracy_desc: "Хранители тарсилы (от арабского silsilah, «цепь»), письменных генеалогических записей, которые прослеживают путь султанов Сулу до Сайида Абу Бакра и через него до Пророка. Каждый ведущий дату имел свою собственную тарсилу; Канцелярия султана курировала официальные родословные, подтверждала претензии соперников и решала брачные союзы. Без этих свитков претендент был бы просто еще одним раджей; вместе с ними он был халифом Южного моря." #NT!
  
 mro_panglima_districts_bureaucracy: "Администрация Панглимского района" #NT!
 mro_panglima_districts_bureaucracy_desc: "Провинциальный округ Султаната, организованный в рамках округа панглима (эквивалент мэров), который, в свою очередь, управлял капитанами баррио с разными титулами: махараджа, оранкая и парукка. Панглима собирала закят и дань, отправляла правосудие от имени султана и переводила центральные указы в исполнение на местах. Однако, когда должности стали передаваться по наследству, титулы панглима передавались по наследству, и капитаны баррио скользили на всех уровнях." #NT!
  
 mro_parang_sabil_brotherhood_bureaucracy: "Братство Паранг Сабил" #NT!
 mro_parang_sabil_brotherhood_bureaucracy_desc: "Институт маг-сабиля (Таусуг: «тот, кто терпит муки смерти»), воинов моро, которые дали клятву Напи умереть на пути Бога против неверующих. Кандидатам требовалось согласие родителей и личное разрешение султана, прежде чем их поручали имамам для духовной и военной подготовки. Маг-сабиль привлекал крисов и баронгов против испанских гарнизонов в атаках, которые сами испанцы в 1876 году назвали «хураментадо». Получив лицензию султана, это было самым опасным средством сдерживания королевства; в противном случае это превратилось в неконтролируемую вендетту." #NT!
  
 mro_lanong_admiralty_bureaucracy: "Ланонг Корсарское Адмиралтейство" #NT!
 mro_lanong_admiralty_bureaucracy_desc: "Военно-морское учреждение под командованием Дату Ладжа Лаута, которое примерно с 1770 по 1870 год выводило от одной до двухсот военных кораблей Иранун и Бангуинги каждый год из Маймбунга, Малабанга и побережья Ирануна. «Ланонг» представлял собой тридцатиметровую выносную опору с тремя рядами весел и вертлюгами «лантака»; более легкий гарай шел быстрее. Пленники, проданные на рынках Джоло и Тави-Тави, представляли собой рабочую силу, от которой существенно зависела экономика Султаната. К 1850-м годам пленники Бисая, возможно, составляли половину населения Сулу." #NT!
  
 # ===== AUTO-MODIFIER (slot grant on formation) ===== 
 AUTO_MODIFIER_NAME_nd_mro_bureaucracy_authority: "Бюрократическая власть Султаната" #NT!
 AUTO_MODIFIER_DESC_nd_mro_bureaucracy_authority: "После провозглашения [MRO.GetName] султан-халиф может принять у себя исторические институты Бангса Моро: Рума Бичара, сеть пандитов, канцелярию тарсила, районы Панглима, братство Паранг Сабил и адмиралтейство Ланонг." #NT!
  
 # ===== POLISH PASS: NEW MODIFIER LOC ===== 
 STATIC_MODIFIER_NAME_nd_mro_orthodox_fiqh: "Православный шафиитский фикх" #NT!
 STATIC_MODIFIER_DESC_nd_mro_orthodox_fiqh: "Кодифицированный закон шафиитской школы Мекки целиком перенесен на южные острова. Кади цитируют те же тексты, которые читали в Каире и Ачехе; имам проповедует ту же хутбу; грамотность в классическом арабском языке распространяется среди улемов." #NT!
 STATIC_MODIFIER_NAME_nd_mro_sufi_tariqa: "Суфийские братства Тарика" #NT!
 STATIC_MODIFIER_DESC_nd_mro_sufi_tariqa: "Братства Накшбанди, Кадири и Шадхили насаждают своих святых в каждом крупном городе моро. Обращение происходит посредством любви, а не меча, и старые анитистские диваты смягчаются до суфийских пиров, а не полностью отвергаются." #NT!
 STATIC_MODIFIER_NAME_nd_mro_pandita_open: "Школы Пандитов открыты для всех" #NT!
 STATIC_MODIFIER_DESC_nd_mro_pandita_open: "Сын раба сидит рядом с дату на циновке пандита. Талант растет там, где трон не мог предсказать; грамотность достигает каждого барангая; Корпус моро, состоящий из клерков, судей и послов, пополняется выходцами за пределы благородной линии." #NT!
 STATIC_MODIFIER_NAME_nd_mro_pandita_elite: "Пандитские школы линий передачи" #NT!
 STATIC_MODIFIER_DESC_nd_mro_pandita_elite: "Глубокие тексты и высокая юриспруденция предназначены для линий данных и улемов. Литераторы моро образуют более сплоченную и дисциплинированную касту; легитимность и обучение связаны с благородным наследием." #NT!
 STATIC_MODIFIER_NAME_nd_mro_juramentado_sanctioned: "Султан-присягнувший Хураментадо" #NT!
 STATIC_MODIFIER_DESC_nd_mro_juramentado_sanctioned: "Хураментадо приносят присягу перед имамом султана, проходят подготовку в куте и возглавляются назначенными султаном капитанами. Их клятва связывает их вместе с троном и верой; диван контролирует, когда они маршируют." #NT!
 STATIC_MODIFIER_NAME_nd_mro_juramentado_folk: "Народное хураментадо деревень" #NT!
 STATIC_MODIFIER_DESC_nd_mro_juramentado_folk: "Хураментадо приносит присягу перед имамом своей деревни, помимо повеления трона. Султан ему не приказывает; деревня делает. Там, где падает кута и замолкает диван, народное хураментадо в одиночестве идет в лагерь колонизатора, а война продолжается." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_kris_brotherhood: "Братство Криса пробурено" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_kris_brotherhood: "Постоянные группы носителей крисов и кампиланов ежедневно тренируются во дворах куты. Удар в ближнем бою с помощью волновых лопастей, прорвавший испанские позиции у Ламитана, теперь стал постоянной доктриной армии моро." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_juramentado: "Винта Корсар-Хураментадо" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_juramentado: "Хураментадо учат абордажу: калис в руке, прыжок с винты с латиноамериканским вооружением на палубу испанского галеона, молитва, произносимая перед началом колониальных пуль. Военно-морская доктрина желающих умереть." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_shafii_orthodoxy: "Шафиитское православие" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_shafii_orthodoxy: "Новый фикх – это чистый шафиит, целиком перенесенный из Мекки. Нация моро теперь говорит на том же юридическом языке, что и широкая умма; кади цитируют в Сулу те же тексты, что и в Каире и Ачехе." #NT!
 STATIC_MODIFIER_NAME_nd_mro_dest_hybrid_law: "Шариатский кодекс Моро" #NT!
 STATIC_MODIFIER_DESC_nd_mro_dest_hybrid_law: "Новый фикх переплетает Коран и шафиитскую школу с обычаями дату. У народа моро есть свой шариат, ответственный только перед самим собой; Легитимность проистекает как из закона, так и из трона." #NT!
