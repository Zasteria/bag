l_russian:
  # ============================================================ 
  # Knights of the Temple (TKT): Localization 
  # Country name and adjective live in nd_tkt_country_l_english.yml 
  # ============================================================ 
  
  # === Formation event === 
 nd_tkt.1.t: "Восьмиконечный крест возродился" #NT!
 nd_tkt.1.d: "Папская булла #bold Vox in excelso#! поднята. Pauperes Commilitones Christi Templique Salomonici, распущенная Климентом V в Вене в 1312 году и изгнанная из Арагона и Португалии поколением спустя, вновь основана как суверенное братство. Замок Тамплиеров над холмом Набантия принадлежит нам; Пенискола или Монзон стоит от нашего имени; сундук казначея открыт.\n\nПеред главой стоит вопрос, которого ждали сто лет. Являемся ли мы Старым Орденом, тайным орденом тамплиеров, чьи переводные векселя когда-то охватывали христианский мир и чье латинское правило было написано Бернаром Клервоским? Или мы — Новый Орден Христа, публично одобренный Папой, а атлантический мандат Генриха Сагреша стал нашим институциональным сердцем?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_tkt.1.a: "Старый порядок восстановлен: Правило Бернара, секретный капитул, созданный Босаном." #NT!
 nd_tkt.1.b: "Новый порядок Христа: крест Христа на парусе, атлантический мандат, папская реформа." #NT!
  
  # === Formation timed modifiers === 
 STATIC_MODIFIER_NAME_nd_tkt_old_order_restored: "Старый порядок восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_old_order_restored: "Роспуск аннулируется. Братья-рыцари приносят старые клятвы под запечатанными дверями; гонфанон Босана возвышается над холмом Набантия; Сундук генерального казначея открыт в своем средневековом виде. Братство в равной степени боятся и изолированы." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_order_of_christ: "Новый порядок Христа" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_order_of_christ: "Реформа принята. Распространенный крест Христа заменяет старую эмблему на каждом парусе; Атлантический мандат Генриха Сагреша становится институциональным сердцем Ордена; принимаются иностранные кандидаты; векселя проходят под папской печатью через католическую Европу." #NT!
  
  # === DHE 2: Tomar Convent === 
 nd_tkt.2.t: "Замок тамплиеров" #NT!
 nd_tkt.2.d: "План мастера Гуальдима Паиса, составленный в двенадцатом веке, наконец-то завершен. Окруженная монастырь-крепость на холме Набантия завершена: ротонда Чарола, дом капитула, монастырь кладбища, большая цистерна. Из крепости восьмиконечный крест смотрит на половину Иберии. Братство имеет свое видимое сердце." #NT!
 nd_tkt.2.a: "Постройте его так, как задумал Бернард." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_castelo_templario: "Кастело Темпларио" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_castelo_templario: "Замысел Мастера Гуальдима завершен. Окруженный монастырь-крепость Томара является институциональным и церемониальным центром братства." #NT!
  
  # === DHE 3: Bills of Exchange === 
 nd_tkt.3.t: "Сундук казначея снова открыт" #NT!
 nd_tkt.3.d: "Средневековые изобретения тамплиеров возрождаются в наших покоях. Паломник или генуэзский фактор кладет серебро в прецепторию Томара и забирает слитки в Сарагосе, Лионе или Акре, и все это под печатью генерального казначея. Монастырь обсуждает характер своего кредитования: трезвый приказ, поддерживающий имя Ордена, или агрессивный сундук, который наполняет казну, но подвергает серебро риску дефолта." #NT!
 nd_tkt.3.a: "Трезвое кредитование: приказ казначея – золото." #NT!
 nd_tkt.3.b: "Агрессивное кредитование: Серебряный сундук широко открыт." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_treasurers_writ: "Приказ казначея" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_treasurers_writ: "Векселя под консервативным надзором Генерального казначея. Кредитование ограничено; Имя монастыря – доброе серебро во всей католической Европе." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_silver_chest: "Серебряный сундук" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_silver_chest: "Агрессивное кредитование тамплиеров: князья, епископы и итальянские дома берут кредиты из покоев монастыря. Доходность выше; серебро обнажено." #NT!
  
  # === DHE 4: Sagres Mandate === 
 nd_tkt.4.t: "Мандат Сагреша" #NT!
 nd_tkt.4.d: "Школа мореплавания на мысе Сагреш финансируется из покоев монастыря, как в мировой истории Генрих Португальский финансировал ее из Ордена Христа. Братья спрашивают, что должен означать атлантический мандат. Некоторые воспринимают это как крестовый поход: фланговое движение вдоль побережья Сахары вокруг Гранады и Маринида в Марокко. Другие интерпретируют это как скрытую торговлю: золотой песок, слоновая кость и перец малагета проносятся по фабрикам тамплиеров без единого объявления." #NT!
 nd_tkt.4.a: "Обойдите Мавра с фланга: африканское побережье — это граница крестоносцев." #NT!
 nd_tkt.4.b: "Тихая торговля: заводы работают молча." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_african_outflanking: "Африканский обход" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_african_outflanking: "Каравеллы тамплиеров действуют вдоль побережья Сахары как фланг крестоносцев. Охват и агрессия возрастают; Дипломатическая цена – это резкость." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_quiet_trade: "Тихая торговля" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_quiet_trade: "Атлантический мандат переосмыслен как конфиденциальная торговля. Золотая пыль, слоновая кость, перец малагета перемещаются по фабрикам тамплиеров без каких-либо заявлений." #NT!
  
  # === DHE 5: Secret Chapter === 
 nd_tkt.5.t: "Секретная глава кодифицирована" #NT!
 nd_tkt.5.d: "Закрытые посвящения, приписываемые средневековому братству, обряд веревки, поцелуй послушания, гностические возгласы, шепчущиеся на провансальском диалекте, кодифицированы как скрытая дисциплина Ордена. Магистр капитула спрашивает, каким братством нам следует быть. Открытое отделение, допускающее иностранных кандидатов и оформляющее обряды как посвящение Марии? Или железный иберийский капитул, наследственный и закрытый?" #NT!
 nd_tkt.5.a: "Открытая глава: допуск иностранных кандидатов, обряды, оформленные как посвящение Марии." #NT!
 nd_tkt.5.b: "Железный капитул: наследственный, иберийский, закрытый." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_open_chapter: "Открытая глава" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_open_chapter: "Допускаются иностранные кандидаты; тайные обряды, замаскированные под преданность Марии. Конвент приобретает широкую дипломатическую сеть." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_iron_chapter: "Железная глава" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_iron_chapter: "Глава наследственная, иберийская, закрытая. Братья приносят старые клятвы на латыни за запечатанными дверями. Дисциплина железная; иностранцев держат на расстоянии." #NT!
  
  # === DHE 6: Beausant === 
 nd_tkt.6.t: "Босан вырос" #NT!
 nd_tkt.6.d: "Гонфанон Босанта, черное на белом, честное и честное военное знамя средневекового братства, снова поднимается над иберийскими ротами. Капитул должен решить, кого собрать под свой контроль: братьев-рыцарей каждого командования, набранных из духовенства и мелкой знати, или широкие светские братства (milites Christi в младших орденах), которые снабжают основную часть вооруженных экипажей Ордена." #NT!
 nd_tkt.6.a: "Братья-рыцари: элитные командования в полном составе." #NT!
 nd_tkt.6.b: "Братское ополчение: братья-миряне и малые ордена." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_brother_knight_levy: "Брат-рыцарь Леви" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_brother_knight_levy: "Командиры поднимают свои полностью вооруженные братства. Тяжелая кавалерия и братья-рыцари выходят на поле боя в количестве, невиданном со времен Святой Земли." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_confraternity_militia: "Ополчение Братства" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_confraternity_militia: "Мирские братства собираются вместе с братьями. Армии становятся больше, но менее элитными." #NT!
  
  # === DHE 7: Atlantic Factories === 
 nd_tkt.7.t: "Генерал-фактор Атлантики" #NT!
 nd_tkt.7.d: "Фабрики на Мадейре, Аргене и Сан-Хорхе-да-Мина, наполовину банковские дома, наполовину вооруженные частоколы, множатся вдоль побережья Сахары и Гвинеи. В Лагосе назначается постоянный офицер, Генерал-фактор, который координирует анализы золотого песка, поставки малагеты и отчеты о рабах и слоновой кости. Зарубежная торговля Ордена получает единую координирующую руку." #NT!
 nd_tkt.7.a: "Лагос как центр атлантического фактора." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_factor_general: "Генерал-фактор Атлантики" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_factor_general: "Постоянный офицер в Лагосе управляет заводами в Атлантике. Зарубежная торговля Ордена становится скоординированной." #NT!
  
  # === DHE 8: Heretical Rumours === 
 nd_tkt.8.t: "Слухи о Бафомете" #NT!
 nd_tkt.8.d: "Спустя три столетия после суда над Филиппом Красивым обвинения не исчезли. Идолопоклонство, гностические обряды поцелуев, бородатая голова по имени Бафомет, почитаемая в капитуле, братья, плюющие на крест при посвящении: черная легенда, которая путешествует в брошюрах, проповедях и разговорах в тавернах от Лиссабона до Лиона. Конвент должен сделать выбор. Подавить слухи с помощью инквизиторской чистки? Или превратить их в загадочное оружие разведывательной сети?" #NT!
 nd_tkt.8.a: "Инквизиторская чистка: разгромите слухи, восстановите имя Ордена." #NT!
 nd_tkt.8.b: "Сеть шепота: культивируйте загадочность, позвольте врагам бояться того, чего они не могут доказать." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_inquisitorial_purge: "Инквизиторская чистка" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_inquisitorial_purge: "В монастыре приветствуется инквизиция тамплиеров: еретические слухи публично подавляются. Внутреннее доверие растет; скрытые знания главы утеряны." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_whisper_network: "Сеть Шепота" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_whisper_network: "Слухи времен судебного разбирательства скорее культивируются, чем подавляются. Враги Конвента боятся того, чего не могут доказать; разведчики путешествуют под прикрытием Бафомета-мистика." #NT!
  
  # === DHE 9: Templar Carrack === 
 nd_tkt.9.t: "Крест на парусе" #NT!
 nd_tkt.9.d: "Распространенный крест Христа, нарисованный на гроте каждой караки тамплиеров от Лагоса до Азорских островов, становится универсальным знаком парусника Атлантического флота Ордена. Корабелы Лиссабона и Лагоса принимаются в братство как братья-миряне; портовые конопатчики и изготовители канатов присягают на незначительное повиновение. Корабли Ордена несут знак, который одновременно служит морской идентификацией и священным требованием." #NT!
 nd_tkt.9.a: "Раскрасьте каждый парус." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_cross_on_sail: "Крест на парусе" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_cross_on_sail: "Каждая каррака тамплиеров несет на гроте распростертый крест Христа. Морское присутствие Ордена резко возрастает; Попсы-корабелы клянутся в незначительном послушании." #NT!
  
  # === DHE 10: Cartulary === 
 nd_tkt.10.t: "Кодекс Тамплиориум" #NT!
 nd_tkt.10.d: "Средневековые картулярии Ордена, огромные пергаментные реестры уставов, долгов, поместий и судебных обычаев всех прецепторий между Провансом и Тежу, сведены в единый письменный закон братства. Кодекс Тамплиориум стоит в здании капитула: конституционная основа суверенного банковского братства." #NT!
 nd_tkt.10.a: "Переплетите Кодекс в пергамент и привяжите его цепочкой к кафедре." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_codex_templariorum: "Кодекс Тамплиориум" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_codex_templariorum: "Средневековые картулярии превратились в письменный закон братства. Администрация монастыря ужесточается; Сепаратистский дрейф ослабевает." #NT!
  
  # === Advances === 
 nd_tkt_tomar_convent: "Томарский монастырь" #NT!
 nd_tkt_tomar_convent_desc: "Крепость-монастырь мастера Гуальдима Паиса, построенная в двенадцатом веке на холме Набантия, сохранилась как столица тамплиеров. Ротонда Чарола, кольцевые стены и дом капитула объединяют собор, сокровищницу и королевский двор." #NT!
 nd_tkt_beausant_gonfanon: "Босан Гонфанон" #NT!
 nd_tkt_beausant_gonfanon_desc: "Черно-белое боевое знамя средневекового братства вновь поднято. Командиры братьев-рыцарей собирают всю свою тяжелую кавалерию под Босаном." #NT!
 nd_tkt_templar_sergeants: "Тамплиеры-сержанты" #NT!
 nd_tkt_templar_sergeants_desc: "Братья второго сорта, набранные из недворянских слоев населения в качестве братьев-мирян. Более легкая лошадь, меньше доспехов, но дисциплинированная и свободная от дворянского запрета. Сборная легкая кавалерия." #NT!
 nd_tkt_latin_rule: "Латинское правило Бернара" #NT!
 nd_tkt_latin_rule_desc: "Устав Ордена, написанный Бернаром Клервоским на Труаском соборе в 1129 году. Братья-рыцари живут монашески: бедность, целомудрие, послушание под единым Магистром." #NT!
 nd_tkt_iberian_preceptories: "Иберийские монастыри" #NT!
 nd_tkt_iberian_preceptories_desc: "Местные командования разбросаны по Арагоне, Кастилии и Португалии: каждое из них представляло собой укрепленное поместье с сокровищницей, часовней и конюшнями. Институциональная ячейка сети тамплиеров." #NT!
 nd_tkt_bills_of_exchange: "Векселя" #NT!
 nd_tkt_bills_of_exchange_desc: "Средневековое изобретение тамплиеров возрождается. Паломник или торговец кладет серебро в одну апарт-контору и забирает слитки в другой под печатью генерального казначея. Орден снова стал первым международным банком христианского мира." #NT!
 nd_tkt_secret_chapter: "Секретная глава" #NT!
 nd_tkt_secret_chapter_desc: "Закрытые посвящения, приписываемые средневековым тамплиерам, обряд веревки, гностические возгласы, поцелуй послушания, кодифицированы как скрытая дисциплина Ордена. Орден развивает сеть агентов под прикрытием мистики." #NT!
 nd_tkt_cartulary: "Картулярий" #NT!
 nd_tkt_cartulary_desc: "Средневековые реестры тамплиеров, хартии, долги и поместные обычаи всех прецепторий между Провансом и Тежу модернизируются в бухгалтерские книги с двойной записью и единый судебный кодекс." #NT!
 nd_tkt_order_galleys: "Заказать галеры" #NT!
 nd_tkt_order_galleys_desc: "Тонкие весельные галеры Арагонского и Каталонского командований, переведенные из логистики Святой Земли в иберийско-атлантическое патрулирование. Сборный камбуз с парусом в виде креста Христова." #NT!
 nd_tkt_treasurer_apparatus: "Аппарат Брата-Казначея" #NT!
 nd_tkt_treasurer_apparatus_desc: "Офис Генерального казначея в Томаре координирует финансы Ордена во всех прецепториях. Имущество духовенства получает постоянную долю в доходах монастыря." #NT!
 nd_tkt_sagres_navigation_school: "Сагрешская навигационная школа" #NT!
 nd_tkt_sagres_navigation_school_desc: "В альтернативной истории она финансировалась непосредственно из доходов Томара, как Генрих Португальский финансировал ее из Ордена Христа. Пилоты, картографы и писатели Атлантики — все в одежде тамплиеров." #NT!
 nd_tkt_templar_carrack: "Тамплиер Каррак" #NT!
 nd_tkt_templar_carrack_desc: "Атлантическая каррака с распростёртым крестом Христа, нарисованным на гроте. Знаковый корабль исследовательского мандата Ордена." #NT!
 nd_tkt_atlantic_factories: "Атлантические Фабрики" #NT!
 nd_tkt_atlantic_factories_desc: "Мадейра, Арген и Сан-Хорхе-да-Мина: вооруженный торговый дом в конце каждого путешествия по Атлантике. Наполовину банковский дом, наполовину частокол, целиком тамплиер." #NT!
 nd_tkt_cross_of_christ: "Крест Христа" #NT!
 nd_tkt_cross_of_christ_desc: "Распространенный латинский крест с более тонкими ветвями заменяет старую эмблему тамплиеров. На каждом парусе и вымпеле он изображает санкционированную папой миссию Ордена в Атлантике." #NT!
 nd_tkt_lay_confraternity: "Братство мирских братьев" #NT!
 nd_tkt_lay_confraternity_desc: "Мирские братства (laici fratres), прикрепленные к каждому командованию. Солдаты, рабочие и горожане приносят клятву незначительного повиновения и снабжают зарубежные экипажи Ордена." #NT!
 nd_tkt_templar_bank: "Банк Тамплиеров" #NT!
 nd_tkt_templar_bank_desc: "Средневековая финансовая система тамплиеров достигает зрелости. Векселя, аккредитивы, сейфы и межпредставительные переводы — все в ведении генерального казначея в Томаре." #NT!
 nd_tkt_baphomet_rumours: "Слухи о Бафомете" #NT!
 nd_tkt_baphomet_rumours_desc: "Обвинения в ереси времен судебного разбирательства остаются черной легендой по всей католической Европе. Монастырь решает использовать их в качестве оружия: враги боятся того, чего не могут доказать, а разведчики братства путешествуют под прикрытием мистики." #NT!
 nd_tkt_factor_general_advance: "Фактор-Общий" #NT!
 nd_tkt_factor_general_advance_desc: "Постоянный офицер в Лагосе, управляющий фабриками Ордена в Атлантике. Центральное управление зарубежной торговой системы тамплиеров." #NT!
 nd_tkt_templar_galleon: "Галеон тамплиеров" #NT!
 nd_tkt_templar_galleon_desc: "Полный Атлантический галеон. Иберийский корпус, арагонская фурнитура, братья-рыцари-артиллеристы. Постоянная боевая линия монастыря." #NT!
 nd_tkt_captaincy_of_brothers: "Капитанство братьев" #NT!
 nd_tkt_captaincy_of_brothers_desc: "Мадейра, Кабо-Верде, Азорские острова: каждым из них управляет рыцарь-капитан, подчиняющийся непосредственно монастырю Томар. Военизированное губернаторство атлантических колоний." #NT!
 nd_tkt_discount_bank: "Дисконтный банк" #NT!
 nd_tkt_discount_bank_desc: "Банк Ордена превращается в дисконтное учреждение, покупающее торговые векселя по номинальной стоимости до наступления срока погашения. Доход от транзакций масштабируется в зависимости от внешней торговли." #NT!
 nd_tkt_tomar_cabinet: "Томар Кабинет" #NT!
 nd_tkt_tomar_cabinet_desc: "Правящий кабинет монастыря в восстановленной крепости Томар. Восемь братьев под руководством Мастера управляют политикой, финансами и флотом." #NT!
 nd_tkt_templar_frigate: "Фрегат тамплиеров" #NT!
 nd_tkt_templar_frigate_desc: "Поздний парусный военный корабль Ордена, легче галеона, построенный для патрулирования заводских маршрутов в Атлантике." #NT!
 nd_tkt_convent_arsenal: "Монастырский Арсенал" #NT!
 nd_tkt_convent_arsenal_desc: "Верфи Ордена на Тежу и Алгарве. Галеоны, фрегаты и корабли снабжения в постоянной ротации; снасти и военно-морские запасы из сосновых лесов, принадлежащих монастырю." #NT!
 nd_tkt_industrial_bank: "Промышленный банк тамплиеров" #NT!
 nd_tkt_industrial_bank_desc: "Банк Конвента дожил до эпохи бумажных денег, акционерных обществ и колониальной торговли. Средневековые векселя превращаются в современные инструменты под тем же восьмиконечным крестом." #NT!
 nd_tkt_convent_free_port: "Женский монастырь Свободный Порт" #NT!
 nd_tkt_convent_free_port_desc: "Коридор Томар-Лагос-Фаро открыт для международной торговли. Британские, голландские и французские корабли заходили под флагом Конвента, платя пошлину в казну тамплиеров." #NT!
 nd_tkt_constitutional_brotherhood: "Конституционное Братство" #NT!
 nd_tkt_constitutional_brotherhood_desc: "Codex Templariorum переписан в конституцию. Мастер скован; представители восьми языков сидят в главе; братство становится конституционной банковской республикой." #NT!
  
  # === Buildings === 
 nd_tkt_tomar_convent_building: "Томарский монастырь" #NT!
 nd_tkt_tomar_convent_building_desc: "Замок тамплиеров на холме Набантия: окруженный монастырь-крепость, ротонда Чарола, дом капитула, монастырь кладбища. Институциональное и церемониальное сердце братства." #NT!
 nd_tkt_preceptory: "Прием тамплиеров" #NT!
 nd_tkt_preceptory_desc: "Местное командование Ордена: казармы, казначейство, часовня, конюшни — все за навесной стеной. Институциональная ячейка средневековой сети тамплиеров." #NT!
 nd_tkt_banking_house: "Банковский дом тамплиеров" #NT!
 nd_tkt_banking_house_desc: "Векселя, аккредитивы, сейф. Средневековое финансовое изобретение тамплиеров было перенесено в суверенное банковское учреждение. Серебряные и золотые слитки служат гарантией континентальной кредитной сети Палаты." #NT!
 nd_tkt_navigation_school: "Сагрешская навигационная школа" #NT!
 nd_tkt_navigation_school_desc: "Пилоты, картографы и писатели Атлантики. Школа мореплавания финансировалась непосредственно из покоев Томарского монастыря." #NT!
 nd_tkt_atlantic_factory: "Атлантический завод" #NT!
 nd_tkt_atlantic_factory_desc: "Вооруженный торговый дом в конце каждого путешествия по Атлантике. Наполовину банковский дом, наполовину частокол, целиком тамплиер. Мадейра, Арген, узор Сан-Хорхе-да-Мина." #NT!
 nd_tkt_chamber_of_credit: "Кредитная палата тамплиеров" #NT!
 nd_tkt_chamber_of_credit_desc: "Зрелый банк тамплиеров. Континентальная клиринговая палата, сейф, аккредитивы, дисконт по торговым векселям. Правительственный, финансовый кабинет Конвента." #NT!
 nd_tkt_captaincy: "Брат-капитан" #NT!
 nd_tkt_captaincy_desc: "Военизированное колониальное губернаторство: Мадейра, Кабо-Верде, Азорские острова, которыми управляют рыцари-капитаны, подчиняющиеся непосредственно монастырю Томар." #NT!
 nd_tkt_convent_arsenal_building: "Монастырский Арсенал" #NT!
 nd_tkt_convent_arsenal_building_desc: "Верфи Ордена на Тежу и Алгарве. Галеоны, фрегаты и корабли снабжения в постоянной ротации; снасти и военно-морские запасы из сосновых лесов, принадлежащих монастырю." #NT!
  
  # === Building PM names === 
 nd_tkt_tomar_convent_maintenance: "Обслуживание монастыря" #NT!
 nd_tkt_tomar_convent_maintenance_desc: "Камень, каменная кладка, пергамент и тонкая ткань сохраняют целостность монастыря-крепости и обставленность дома капитула." #NT!
 nd_tkt_preceptory_maintenance: "Наставническое обслуживание" #NT!
 nd_tkt_preceptory_maintenance_desc: "Оружие, инструменты, лошади и алтарное вино для ежедневного обхода командования тамплиеров." #NT!
 nd_tkt_banking_house_production: "Счета в слитках" #NT!
 nd_tkt_banking_house_production_desc: "Серебряные и золотые слитки хранились в хранилищах тамплиеров в качестве залога по векселям и аккредитивам. Инструменты и аналитические приборы обеспечивают повседневную работу камеры." #NT!
 nd_tkt_navigation_school_maintenance: "Обслуживание школы" #NT!
 nd_tkt_navigation_school_maintenance_desc: "Пергамент, книги, пчелиный воск и мебель для пилотов и картографов штурманской школы." #NT!
 nd_tkt_atlantic_factory_maintenance: "Заводское обслуживание" #NT!
 nd_tkt_atlantic_factory_maintenance_desc: "Военно-морские припасы, бухгалтерская бумага, вооружение и ткань для вооруженного торгового дома." #NT!
 nd_tkt_chamber_of_credit_maintenance: "Обслуживание камеры" #NT!
 nd_tkt_chamber_of_credit_maintenance_desc: "Пергамент, книги, пчелиный воск и мебель для банковского аппарата тамплиеров позднего периода." #NT!
 nd_tkt_captaincy_maintenance: "Капитанство" #NT!
 nd_tkt_captaincy_maintenance_desc: "Пергамент, оружие, лошади и мебель для дома брата-рыцаря-капитана." #NT!
 nd_tkt_convent_arsenal_maintenance: "Техническое обслуживание Арсенала" #NT!
 nd_tkt_convent_arsenal_maintenance_desc: "Древесина, военно-морские припасы, деготь, инструменты и несколько пушек поддерживают постоянную ротацию верфей Ордена." #NT!
  
  # === Units === 
 a_nd_tkt_brother_knight: "Тамплиер Брат-Рыцарь" #NT!
 a_nd_tkt_brother_knight_desc: "Полный брат-рыцарь: копье, кольчуга, распростёртый крест, скачущий под Босаном. Взимается через командную систему с мелких священников." #NT!
 a_nd_tkt_sergeant: "Тамплиер-сержант" #NT!
 a_nd_tkt_sergeant_desc: "Брат второго сорта: лошадь полегче, кожа, меч. Набирались из числа солдат и бюргеров в качестве братьев-мирян в мелких орденах." #NT!
 n_nd_tkt_order_galley: "Заказать камбуз" #NT!
 n_nd_tkt_order_galley_desc: "Тонкий камбуз арагонского образца с крестом Христовым на форке. Каталонский узор корсо был преобразован в прибрежную силу тамплиеров." #NT!
 n_nd_tkt_templar_carrack: "Тамплиер Каррак" #NT!
 n_nd_tkt_templar_carrack_desc: "Атлантическая каррака с распростёртым крестом Христа, нарисованным на гроте. Исследовательский корабль Ордена в Атлантике." #NT!
 n_nd_tkt_templar_galleon: "Галеон тамплиеров" #NT!
 n_nd_tkt_templar_galleon_desc: "Полный атлантический галеон: иберийский корпус, арагонская арматура, братья-рыцари-артиллеристы. Постоянная боевая линия монастыря." #NT!
 n_nd_tkt_templar_frigate: "Фрегат тамплиеров" #NT!
 n_nd_tkt_templar_frigate_desc: "Последний парусный патрульный фрегат Ордена, более легкий, чем галеон, построенный для патрулирования маршрутов Атлантического завода." #NT!
  
  # === Levies === 
 levy_nd_tkt_brother_knight: "Брат-рыцарь Леви" #NT!
 levy_nd_tkt_brother_knight_desc: "Набор тяжелой кавалерии из братьев-священнослужителей по незначительным приказам. Элитный конный ударный отряд Ордена." #NT!
  
  # === Event variable tooltips === 
 nd_tkt_formed_tt: "были сформированы Рыцари Храма" #NT!
 nd_tkt_path_a_tt: "путь восстановления старого порядка" #NT!
 nd_tkt_path_b_tt: "Путь Нового Порядка Христа" #NT!
 nd_tkt_continental_clearing_house: "Континентальная клиринговая палата" #NT!
 nd_tkt_continental_clearing_house_desc: "Банк тамплиеров как расчетное учреждение европейских межгосударственных финансов. Векселя из Лондона, Амстердама, Марселя и Гамбурга проходят через камеру Томара. Престиж Братства покоится на серебряном сундуке христианского мира." #NT!
  
  # ============================================================ 
  # === DESTINY TREE === 
  # Post-formation mission tree: root + 2 paths x 3 stages. 
  # ============================================================ 
  
  # === Destiny advance names and descriptions === 
 nd_tkt_destiny: "Судьба Братства" #NT!
 nd_tkt_destiny_desc: "Восстановление монастыря требует долгосрочного проекта. Институциональная дисциплина братства сохраняется; теперь капитул смотрит на свою судьбу: тайная банковская теневая империя над католической Европой или публичная атлантическая империя креста Христова." #NT!
  
  # Path A 
 nd_tkt_dest_continental_commanderies: "Континентальные командования" #NT!
 nd_tkt_dest_continental_commanderies_desc: "Средневековый центр тамплиеров. Восстановите провансальские монастыри вокруг #bold Авиньона#! и главного дома Шампани в #bold Труа#!, где Бернар написал Латинское Правило в 1129 году. Континентальная командная сеть является основой теневой империи." #NT!
 nd_tkt_dest_court_penetration: "Проникновение в католический суд" #NT!
 nd_tkt_dest_court_penetration_desc: "Королевские сокровищницы #bold Парижа#! и #bold Барселоны#! берут на себя заслуги тамплиеров. Генеральный казначей монастыря становится молчаливым посредником католических государственных финансов. Освойте #bold Банковское дело#!, накопите #bold 2000 золота#! и привяжите суды к палате." #NT!
 nd_tkt_dest_shadow_empire: "Империя теней тамплиеров" #NT!
 nd_tkt_dest_shadow_empire_desc: "Держите #bold Лондон#!, #bold Рим#!, и #bold Лион#!:, великие католические дворы, папская резиденция и банковская артерия Рона-Сона — все они проходят через палату Томара. С #bold 3000 золота#! и #bold 75 престижа#!, Великий Капитул становится тайным сердцем Монастыря." #NT!
  
  # Path B 
 nd_tkt_dest_atlantic_islands: "Атлантические острова под защитой" #NT!
 nd_tkt_dest_atlantic_islands_desc: "Три группы островов, от которых управляются маршруты ветров Атлантического океана: #bold Фуншал#! на Мадейре, #bold Понта-Делгада#! на Азорских островах и #bold Тегизе#! на Канарских островах. Одеяние тамплиеров заменяет старые флаги над гаванями." #NT!
 nd_tkt_dest_african_outposts: "Африканско-атлантические аванпосты" #NT!
 nd_tkt_dest_african_outposts_desc: "Удерживайте #bold Аргуин#! на побережье Мавритании и #bold Кабо-Корсо#! на Золотом Берегу. Охватите #bold Глобальную торговлю#! и накопите #bold 2000 золота#!. Факторная система пропускает золотой песок, малагету и слоновую кость через бухгалтерские книги Конвента." #NT!
 nd_tkt_dest_atlantic_imperium: "Трансатлантическая Империя тамплиеров" #NT!
 nd_tkt_dest_atlantic_imperium_desc: "Удерживайте #bold Сан-Томе#! на экваторе и #bold Максорату#! на южных Канарских островах. Откройте #bold Мануфактуры#!, держите #bold 3000 золота#! и #bold 75 престижа#! и торгуйте #bold сахаром#! через рынок капитала. Зал капитан-генерала Атлантики возвышается в Лагосе." #NT!
  
  # === Destiny event titles, descriptions, options === 
  # Destiny root acknowledgement 
 nd_tkt.11.t: "Монастырь определяет свой долгосрочный курс" #NT!
 nd_tkt.11.d: "Глава собрался за закрытыми дверями Чаролы. Институциональная дисциплина братства сохраняется; серебро у него в сундуке; братья-рыцари находятся в своих командорствах; крест Христов летит от Томара к Синишу. Магистр капитула задает вопрос, который ждал с момента отмены Vox in excelso: каков долгосрочный проект Ордена? Империя тамплиеров средневекового банкира-рыцаря или Атлантическая империя Ордена Христа?" #NT!
 nd_tkt.11.a: "Направьте братство на свою судьбу." #NT!
  
  # Path A Stage 1 
 nd_tkt.12.t: "Континентальные командования восстановлены" #NT!
 nd_tkt.12.d: "Наставничество Авиньона снова едет под восьмиконечным крестом; материнский дом в Труа, где в 1129 году было установлено правление Бернара, открывает двери своего капитула после ста лет молчания. Средневековый центр тамплиеров в Провансе и Шампани снова стал институциональным, и братья-рыцари монастыря едут по старым командирским дорогам католической Европы." #NT!
 nd_tkt.12.a: "Созвать капитул в Труа." #NT!
  
  # Path A Stage 2 
 nd_tkt.13.t: "Католические суды берут на себя заслугу монастыря" #NT!
 nd_tkt.13.d: "Королевские казначейства #bold Парижа#! и #bold Барселоны#! берут ссуды из покоев Томара. Братья спорят о возможностях монастыря. Следует ли Генеральному казначею развивать тихое, сетевое влияние, скрытое в аудиторских книгах и осторожных советниках? Или капитулу следует укрепить наследственную дисциплину дома, железное иберийское братство в полной силе, стоящее за банком тамплиеров?" #NT!
 nd_tkt.13.a: "Сеть судов Казначея: конфиденциальная, консультативная, ориентированная на аудит." #NT!
 nd_tkt.13.b: "Железное Братство: наследственное, набираемое, дисциплинированное." #NT!
  
  # Path A Stage 3 
 nd_tkt.14.t: "Империя теней тамплиеров завершена" #NT!
 nd_tkt.14.d: "Казначейство Лондона, Апостольская камера Рима и лионская биржа осуществляют расчеты через Томара. Братство — это тихая магистратура католических государственных финансов. Капитул должен определить свой публичный облик: молчаливое владычество, движимое молниеносными аннексиями и невидимыми руками? Или открыто провозглашенный Великий Магистериум, Орден, признанный банковской магистратурой католической Европы?" #NT!
 nd_tkt.14.a: "Безмолвный Доминион: форсированные марши, молниеносные аннексии, невидимая рука." #NT!
 nd_tkt.14.b: "Великий Магистериум: открытый, авторитетный, братство в чести." #NT!
  
  # Path B Stage 1 
 nd_tkt.15.t: "Атлантические острова под крестом" #NT!
 nd_tkt.15.d: "Гавань Фуншала на Мадейре, рейд Понта-Делгада на Азорских островах, каменный причал Тегуисе на Канарах: три группы островов под распростёртым крестом Христа. Маршруты атлантических ветров, пассаты и западные ветры, которые управляют каждым рейсом между Европой и южным побережьем, теперь принадлежат нам, и мы можем входить и выходить по своему желанию." #NT!
 nd_tkt.15.a: "Атлантика открыта для Братства." #NT!
  
  # Path B Stage 2 
 nd_tkt.16.t: "Арген и Кабо Корсо" #NT!
 nd_tkt.16.d: "Фактор в Аргуине считает малагету; часовня в Кабо-Корсо (Сан-Хорхе-да-Мина) благословляет золотой песок на печать Томара. Братья обсуждают африканский мандат. Должен ли монастырь представить это как мавританский крестовый поход, крест Христа на носу каравелл, сжигающих гавани Маринидов? Или запустить схему тихого фактора, управляемую бухгалтерской книгой, под прикрытием монет тамплиеров?" #NT!
 nd_tkt.16.a: "Мавританский крестовый поход: фланг вокруг Гранады и Маринидов." #NT!
 nd_tkt.16.b: "Схема Фактора: серебро и слоновая кость, без объявления." #NT!
  
  # Path B Stage 3 
 nd_tkt.17.t: "Атлантический Империум Креста" #NT!
 nd_tkt.17.d: "Экваториальная церковь Сан-Томе развевает крест Христа над сахарными заводами; Каменная фактория Максораты — самая южная стража Канарских островов. Мануфактуры Томара перерабатывают колониальное серебро в монеты Ордена. Глава поднимает вопрос об Атлантическом капитан-генеральном зале в Лагосе и обсуждает его институциональную форму: закаленная сахарная армада под руководством братьев-капитанов или зарегистрированное колониальное братство, которое открывает острова для миграции и бюргерской торговли?" #NT!
 nd_tkt.17.a: "Сахарная армада: братья-капитаны, конвойные флоты, закаленный военно-морской порядок." #NT!
 nd_tkt.17.b: "Дипломированное Братство: чартеры, мигранты, отделения банков." #NT!
  
  # === Destiny timed modifier names and descriptions === 
 STATIC_MODIFIER_NAME_nd_tkt_dest_treasurers_court_network: "Сеть казначейских судов" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_treasurers_court_network: "В покоях монастыря хранится серебро католических дворов. Кредитная емкость растет; Выращивание советников удешевляется. Военно-морские дела остаются в тени камерного дома." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_iron_brotherhood: "Железное Братство" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_iron_brotherhood: "Капитул наследственный, иберийский и дисциплинированный. Дворянские командиры собирают сбор в полном составе; десятина имущества духовенства проходит проверку монастыря; братья-рыцари быстро восстанавливаются между сражениями." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_silent_dominion: "Безмолвный Доминион" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_silent_dominion: "Теневая империя движется молча. Колонны братьев-рыцарей форсируют марш; малые суды присоединяются до того, как они смогут обратиться за помощью. Линии снабжения в спешке становятся тонкими." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_grand_magisterium: "Великий Магистериум" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_grand_magisterium: "Конвент открыто управляет банковской магистратурой католической Европы. Традиция братьев-рыцарей сохраняется во всех кампаниях; крестьянство под властью тамплиеров процветает." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_mauritanian_crusade: "Мавританский крестовый поход" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_mauritanian_crusade: "Мандат Сагреша воспринимался как крестовый поход. Каравеллы тамплиеров сжигают гавани Маринидов вдоль побережья Сахары; Военно-морской престиж Ордена растет с каждым парусом." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_factor_circuit: "Схема Фактора" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_factor_circuit: "В бухгалтерских книгах монастыря можно увидеть золотой песок, малагету и слоновую кость. Торговые пути охраняются; циркулируют бюргерские поселения. Резерв военного руководства атрофируется, поскольку серебро заменяет меч." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_sugar_armada: "Сахарная Армада" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_sugar_armada: "Сахарный флот Мадейры плывет под конвоем тамплиеров. Каравеллы и галеоны возвращаются домой в Алгарве с полными трюмами; мастера станционного ремонта держат флот в море." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_dest_atlantic_chartered_brotherhood: "Атлантическое дипломированное братство" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_dest_atlantic_chartered_brotherhood: "Конвент издает колониальные грамоты за собственной печатью. Мигранты стекаются на острова и на фабрики в Атлантическом океане; Городские отделения банка тамплиеров множатся вдоль торговых путей." #NT!
  
  # === Destiny capstone buildings === 
 nd_tkt_grand_chapter: "Великий Глава" #NT!
 nd_tkt_grand_chapter_desc: "Тайное сердце монастыря: закрытый капитул за ротондой Чарола, где потомственные братья и молчаливый генеральный казначей собираются над европейскими долговыми книгами. Институциональная вершина Теневой Империи тамплиеров." #NT!
 nd_tkt_grand_chapter_maintenance: "Обслуживание Великого Главы" #NT!
 nd_tkt_grand_chapter_maintenance_desc: "Пергамент, книги, тонкая ткань и пчелиный воск для потайных аудиторий капитула и частных заседаний генерального казначея." #NT!
 nd_tkt_atlantic_captain_general: "Атлантический капитан-генерал-холл" #NT!
 nd_tkt_atlantic_captain_general_desc: "Военно-торговый кабинет Атлантической империи в Лагосе. Братья-рыцари-капитаны всех атлантических колоний сообщают; проштампованы чартеры, отправлен флот, заслушаны проверки. Институциональная вершина Атлантической Империи." #NT!
 nd_tkt_atlantic_captain_general_maintenance: "Капитан-генерал технического обслуживания" #NT!
 nd_tkt_atlantic_captain_general_maintenance_desc: "Пергамент, военно-морские припасы, вооружение и мебель для командования генерал-капитана и каюты капитана-рыцаря." #NT!
  
  # ============================================================ 
  # === BUREAUCRACIES === 
  # ============================================================ 
  
 tkt_sacred_convent_bureaucracy: "Сакро Капитуло Генерале" #NT!
 tkt_sacred_convent_bureaucracy_desc: "Генеральный капитул Священного монастыря, конституционный центр братства. В соответствии с Латинским Правилом Бернара (Собор Труа, 1129 г.) Магистр избирается Конвентом и управляет с согласия Капитула, который ежегодно заседает в Томаре для утверждения магистратских мер, вынесения приговоров о нарушениях Правил и допуска кандидатов. Его членами являются провинциальные магистры Арагона, Кастилии, Португалии и Прованса в изгнании, а также монастырские офицеры (сенешаль, маршал, драпировщик, раздатчик милостыни, казначей). Судебные акты, принятые без согласия Капитула, аннулируются Генеральным Посетителем, постоянным аудитором Ордена в командованиях." #NT!
 tkt_treasurer_general_bureaucracy: "Аппарат Тезаурари" #NT!
 tkt_treasurer_general_bureaucracy_desc: "Аппарат Генерального казначея, знаковое учреждение Ордена и первая международная банковская корпорация средневекового христианского мира. Прецептории каждой провинции держат хранилища, открытые для хранения; паломник или фактор, вносящий серебро в одну аптеку, забирает слитки в другой под запечатанный вексель. Аппарат взимает комиссию за перевод, дает взаймы коронованным особам под залог (Филипп II Французский получил выкуп за Плантагенетов через парижский дом; Яков I Арагонский заложил свои драгоценности короны через Барселону) и держит морги умерших братьев. Его офицеры являются капелланами-писцами, подчиняющимися монашеской дисциплине." #NT!
 tkt_capitulum_occultum_bureaucracy: "Капитулум Оккультум" #NT!
 tkt_capitulum_occultum_bureaucracy_desc: "Секретная глава. Суд 1307–1314 годов закрепил в памяти католиков слух о скрытой внутренней главе под открытой монастырской главой: закрытые посвящения под запечатанными дверями, обряд веревки, поцелуй послушания, гностические возгласы, нашептываемые на провансальском диалекте. Переоснованный в качестве постоянной следственной палаты суверенного Ордена в Томаре, Capitulum Occultum проверяет лояльность братьев, управляет разведчиками под прикрытием наставнических дел и превращает наследие слухов о Бафомете в мистику, которая путешествует в брошюрах и тавернах от Лиссабона до Лиона. Его офицеры подчиняются только Мастеру." #NT!
 tkt_capitanias_do_mar_bureaucracy: "Капитаньяс-ду-Мар" #NT!
 tkt_capitanias_do_mar_bureaucracy_desc: "Морские капитанства, основанные на альтернативном наследии Ордена Христа от Генриха Сагреша. Система разделяет каждую атлантическую колонию на наследственные гранты капитанов, которым подчиняются донатарии-братья-рыцари: Мадейра (Фуншал, Машику), Азорские острова, Сан-Томе и африканское факторное побережье в Аргуине и Кабо-Корсо. Каждым управляет рыцарь-капитан, который подчиняется Генеральному Фактору Лагоса и через него монастырю Томар. Капитан обладает судебной, финансовой и военной властью над капитаном в обмен на десятую часть доходов генерального казначея. Образец наполовину феодальный, наполовину монастырский; это настоящий инструмент Ордена Атлантической империи." #NT!
  
 AUTO_MODIFIER_NAME_nd_tkt_bureaucracy_authority: "Магистральный орган" #NT!
 AUTO_MODIFIER_DESC_nd_tkt_bureaucracy_authority: "Монастырь в Томаре может учредить до трех постоянных бюрократических офисов, набираемых из Генерального капитула Священного монастыря, Аппарата Генерального казначея, Оккультного Капитула и Морских капитанов, четырех столпов альтернативного суверенного государства тамплиеров." #NT!
 STATIC_MODIFIER_NAME_nd_tkt_militant_brotherhood: "Суверенный Орден Храма" #NT!
 STATIC_MODIFIER_DESC_nd_tkt_militant_brotherhood: "Институциональное ядро ​​братства: братья-рыцари и сержанты, связанные Правилом Бернарда, отделение созывается на секретных заседаниях, Магистр избирается пожизненно. Духовенство возглавляет войско тамплиеров; командорства и монастыри-крепости превосходят любое светское королевство; Характер Ордена скатывается к священной войне в соответствии с учредительным уставом. Орден не может быть оторван от католической веры. Vanilla Military_order_reform можно официально активировать через вкладку «Правительство», чтобы зафиксировать заголовок." #NT!
