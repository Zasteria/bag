l_russian:
 TGD: "Великий Тан" #NT!
 TGD_ADJ: "Тан" #NT!
 TGD_f: "Великий Тан" #NT!
 TGD_f_desc: "Династия Тан была золотым веком космополитизма Китая, когда Шелковый путь проходил через Чанъань, а китайская власть распространялась глубоко в Среднюю Азию. Хотя династия пала в 907 году, память о ней сохранилась как желанный идеал китайской империи, царства, ограниченного не стенами, а дорогами, где буддийские монахи, согдийские купцы и тюркские генералы служили под драконьим знаменем. Восстановление Великого Тан означает воссоединение центральной части Китая с западным коридором и возвращение контроля над Шелковым путем." #NT!
