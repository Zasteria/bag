l_russian:
 STATIC_MODIFIER_NAME_nd_kaz_legacy_of_kasym: "Наследие Касым-хана" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_legacy_of_kasym: "При Касым-хане Казахское ханство достигло своего расцвета, выставив на вооружение двухсоттысячную конницу и командуя всем Дешт-и Кипчаком от Иртыша до Урала. Его централизованная власть, подкрепленная мандатом Чингизидов, сплотила разрозненные кланы в единую ужасающую силу." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_three_zhuz_confederacy: "Конфедерация Трех Жузов" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_three_zhuz_confederacy: "Гений казахского управления заключается не во власти одного хана, а в балансе трех жузов — Большой, Средней и Младшей орд. Каждый сохраняет свои пастбища, своих биев, свои традиции. Единство возникает на основе консенсуса, а не командования, и степь выживает, потому что ни одно поражение не может разрушить целое." #NT!
 nd_kaz.1.t: "Казахское ханство" #NT!
 nd_kaz.1.d: "Когда Джанибек и Керей увели своих последователей от разрушающейся власти Узбекской конфедерации Абуль-Хайра, они не просто восстали, они основали нацию. Двести тысяч кочевников предпочли свободу в открытой степи подчинению, и в результате этого исхода родился казахский народ.\n\nСейчас ханство стоит на перепутье, которое определит его характер для поколений. Традиция Чингизидов требует сильного хана, который сможет объединить кланы под одним знаменем, мобилизуя все силы степи против любого врага. Но реальность обширного Дешт-и Кипчака склоняется к иной мудрости: конфедеративному разделению трех жузов, где каждая орда управляет своими пастбищами, а хан правит на основе консенсуса с биями и султанами.\n\nКакой путь определит казахскую нацию?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_kaz.1.a: "Один хан, один народ, как повелел Касым" #NT!
 nd_kaz.1.b: "Три жуза, один народ, сила через баланс" #NT!
 nd_kaz.2.t: "Джети Жаргы" #NT!
 nd_kaz.2.d: "На закате XVII века хан Тауке собрал трех величайших биев казахского народа: Толе би Большого жуза, Казыбек би Среднего жуза и Айтеке би Младшего жуза. Вместе они кодифицировали обычное право степи в Джети Жарги, Семь кодексов.\n\nЭти законы регулировали все: от наследования и брака до споров о домашнем скоте и наказания за преступления. Они установили авторитет биевских судов как арбитров правосудия на всей обширной степи, связывая различные кланы единой правовой системой, не навязывая централизованной тирании.\n\nДжети Жаргы представляет собой выбор: будет ли закон служить укреплению власти хана во всех спорах или он закрепит биев как истинную опору управления?" #NT!
 nd_kaz.2.a: "Закон укрепляет руку хана" #NT!
 nd_kaz.2.b: "Бии – настоящий голос степи." #NT!
 nd_kaz.3.t: "Триумф в Аниракай" #NT!
 nd_kaz.3.d: "В течение многих лет Джунгарское ханство продвигалось на запад, и катастрофа 1723 года, Актабан Шубырынды, Великое отступление, почти сломила казахскую нацию. Семьи разбегались, стада терялись, степь охватило отчаяние.\n\nНо весной 1730 года ситуация изменилась. Хан Абулхаир сплотил тридцать тысяч воинов всех трех жузов, что стало беспрецедентным подвигом единства. У Аныракая за сорок дней боев на двухсоткилометровой степи легендарные батыры Богенбай, Кабанбай и Наурызбай разбили джунгарское наступление. Захватчики были изгнаны из Жетысу, а казахский народ доказал, что степь невозможно завоевать.\n\nЭта победа требует решения: будем ли мы использовать свое преимущество и преследовать джунгар до их гибели, или закрепим завоеванное и восстановим солидарность трех жузов?" #NT!
 nd_kaz.3.a: "Преследовать отступающего врага. Степь наша" #NT!
 nd_kaz.3.b: "Восстановить и воссоединиться. Жуз должен держаться вместе" #NT!
 nd_kaz.4.t: "Обмен лошадиного шелка" #NT!
 nd_kaz.4.d: "Между 1759 и 1796 годами цинский император издал специальные указы, регулирующие конную торговлю с Казахским ханством. У казахов было то, в чем Китай нуждался больше всего: десятки тысяч выносливых степных лошадей, и Китай предлагал степи то, что желало: рулоны шелка, чай и промышленные товары.\n\nЭто был не просто бартер. Обмен конским шелком стал столпом дипломатии, регулируемой системой торговли и дани, которая обогатила обе империи. Казахские баи невероятно разбогатели, легендарный Алдан владел двадцатью четырьмя тысячами лошадей, а общие стада страны исчислялись миллионами. Степь нашла способ превратить свои бескрайние луга в непреходящее богатство." #NT!
 nd_kaz.4.a: "Богатства степи текут на восток и на запад." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_code_of_the_steppe: "Кодекс Степи" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_code_of_the_steppe: "Джети Жаргы систематизировал обычное право кочевых кланов в единый правовой кодекс, укрепив власть хана в разрешении споров на просторах степи." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_biy_councils: "Власть биев" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_biy_councils: "Джети Жарги закрепил суды биев как основу казахского правосудия, создав децентрализованную систему управления, которая уважает автономию каждого жуза, связывая их общим правом." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_steppe_resurgent: "Степное возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_steppe_resurgent: "Триумф при Аныракае высвободил боевую ярость казахского народа. Ободренная победой, наша кавалерия движется с новой целью, а память о наших величайших батырах вдохновляет каждого воина." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_zhuz_solidarity: "Солидарность жуза" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_zhuz_solidarity: "Беспрецедентное единство всех трех жузов в Аныракае продемонстрировало, что казахская нация сильнее всего, когда она держится вместе. Узы, созданные в общей борьбе, теперь поддерживают более глубокую мобилизацию." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_silk_road_wealth: "Богатство Шелкового пути" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_silk_road_wealth: "Регулируемый обмен конским шелком превратил бескрайние степные луга в источник постоянного коммерческого богатства." #NT!
 nd_kaz_horse_archer_tradition: "Традиция конного лучника" #NT!
 nd_kaz_horse_archer_tradition_desc: "Составной лук и степной пони — два столпа казахской войны. Каждый кочевник с детства учится стрелять с лошади на полном скаку, знаменитый «Казахский выстрел» — залп назад при отступлении, разбивший немало преследующих армий." #NT!
 nd_kaz_horse_breeding_mastery: "Мастерство коневодства" #NT!
 nd_kaz_horse_breeding_mastery_desc: "Казахи разводят одних из самых выносливых лошадей в мире, компактных, выносливых животных, способных выжить только на степной траве. Богатые баи владеют стадами, насчитывающими десятки тысяч человек, а лошадиное богатство нации является основой как ее военной мощи, так и торговли.\n\n#italic Доступно в: $nd_kaz_horse_stud$#!" #NT!
 nd_kaz_aul_organization: "Аул Организация" #NT!
 nd_kaz_aul_organization_desc: "Аул – кочевье – основная ячейка казахского общества. Каждый аул движется в зависимости от времени года, следуя древним путям миграции между зимними убежищами и летними пастбищами. Их войлочные юрты можно поднять за час и разобрать за меньшее время.\n\n#italic Доступно в: $nd_kaz_aul_encampment$#!" #NT!
 nd_kaz_quriltay_tradition: "Курилтайская традиция" #NT!
 nd_kaz_quriltay_tradition_desc: "Согласно традиции Чингизидов, собрание курилтай собирает старейшин клана, султанов и военачальников для избрания хана, планирования годовой миграции и выделения зимних пастбищ. Это бьющееся сердце степного управления.\n\n#italic Доступно в: $nd_kaz_quriltay_ground$#!" #NT!
 nd_kaz_yasa_legacy: "Наследие Ясы" #NT!
 nd_kaz_yasa_legacy_desc: "Яса Чингисхана, систематизированная в 1206 году, остается основополагающей правовой традицией степи. Его принципы коллективной ответственности, иерархического командования и пастырских прав регулируют отношения между ханом и родом." #NT!
 nd_kaz_ru_bonds: "Облигации России" #NT!
 nd_kaz_ru_bonds_desc: "Каждый казах знает свое ру, свой отцовский род, прослеживая семь поколений предков. Эти генеалогические узы выходят за пределы жузов, связывая нацию вместе общей кровью и обязательствами." #NT!
 nd_kaz_guard_cavalry: "Курилтайский стражник" #NT!
 nd_kaz_guard_cavalry_desc: "Личная свита хана, выбранная из лучших всадников каждого рода на собрании курилтая. Эти конные воины служат одновременно телохранителями и ударной кавалерией, острием власти хана." #NT!
 nd_kaz_silk_road_waystations: "Путевые станции Шелкового пути" #NT!
 nd_kaz_silk_road_waystations_desc: "На караванных путях, пересекающих степь, казахские перевалочные пункты предоставляют приют, свежих лошадей и продовольствие путешествующим купцам. Эти посты соединяют города Трансоксианы с рынками Китая и за его пределами.\n\n#italic Доступно в: $nd_kaz_caravan_waystation$#!" #NT!
 nd_kaz_kasym_khan_era: "Эра Касым-хана" #NT!
 nd_kaz_kasym_khan_era_desc: "При Касым-хане (годы правления 1509-1518) Казахское ханство достигло своего расцвета и, как сообщается, могло выставить двести тысяч кавалеристов. Его власть простиралась от Иртыша до Урала, и все соседние державы опасались казахских всадников." #NT!
 nd_kaz_horse_trade_mastery: "Степная конная торговля" #NT!
 nd_kaz_horse_trade_mastery_desc: "Казахские лошади ценятся во всей Центральной Азии за их выносливость, устойчивость и способность выжить на скудном степном корме. Торговля этими животными является самым ценным коммерческим активом ханства." #NT!
 nd_kaz_barymta_raids: "Барымта Традиция" #NT!
 nd_kaz_barymta_raids_desc: "Барымта, ритуальный набег на скот, служит одновременно экономическим перераспределением и военной подготовкой. Молодые воины проявляют себя, отбирая лошадей у ​​соперничающих кланов, и эта практика сохраняет преимущество навыков кочевой кавалерии между войнами." #NT!
 nd_kaz_seasonal_migration: "Сезонная миграция" #NT!
 nd_kaz_seasonal_migration_desc: "Ежегодная миграция между жайлау (летними пастбищами) и кыстау (зимними стойбищами) является ритмом кочевой жизни. Этот цикл поддерживает луга, кормит стада и распределяет население по территории, что делает ханство удивительно устойчивым к вторжениям." #NT!
 nd_kaz_tore_cavalry: "Торе Лансерс" #NT!
 nd_kaz_tore_cavalry_desc: "Торе, аристократия Чингизидов, составляют тяжелую ударную конницу казахской армии. Эти благородные уланы, одетые в кольчуги и вооруженные длинными копьями, возглавляют решающую атаку, которая разрушает вражеские порядки после того, как конные лучники смягчили их." #NT!
 nd_kaz_jeti_zhargy: "Джети Жарги" #NT!
 nd_kaz_jeti_zhargy_desc: "Семь кодексов Хана Тауке, составленные тремя великими биями Толе, Казыбеком и Айтеке, кодифицировали обычное право казахской нации во всеобъемлющую правовую основу, регулирующую наследование, брак, уголовное правосудие и пастырские права.\n\n#italic Доступно в: $nd_kaz_biy_court$#!" #NT!
 nd_kaz_kumis_tradition: "Кумыс Традиция" #NT!
 nd_kaz_kumis_tradition_desc: "Кумыс, заквашенное кобылье молоко, — священный напиток степи, который подают на каждом собрании, от скромных аульных застолий до самого курилтая. Его производство — это одновременно кулинарное искусство и экономическая деятельность, поддерживающая кочевые сообщества.\n\n#italic Доступно в: $nd_kaz_kumis_brewery$#!" #NT!
 nd_kaz_zhuz_system: "Дивизия Трех Жузов" #NT!
 nd_kaz_zhuz_system_desc: "Разделение казахской нации на Большой, Средний и Младший жузы, каждый со своей территорией, султанами и традициями, является одновременно величайшей уязвимостью ханства и его величайшей силой. Ни одно поражение не может уничтожить нацию, разделенную на три автономные орды." #NT!
 nd_kaz_composite_bow_mastery: "Владение составным луком" #NT!
 nd_kaz_composite_bow_mastery_desc: "Казахский составной рекурсивный лук, состоящий из слоев рога, сухожилий и дерева, обеспечивает разрушительную силу, находясь верхом на лошади. Поколения усовершенствований сделали его легче, отзывчивее и точнее, что позволяет производить знаменитый казахский выстрел назад на полном скаку." #NT!
 nd_kaz_caravan_tolls: "Плата за караван" #NT!
 nd_kaz_caravan_tolls_desc: "Контроль над степными караванными путями позволяет казахам взимать плату за трафик по Шелковому пути, проходящий через их территорию. Торговцы платят за безопасный проход, новых скакунов и защиту от бандитов." #NT!
 nd_kaz_dzungar_mobilization: "Джунгарская мобилизация" #NT!
 nd_kaz_dzungar_mobilization_desc: "Экзистенциальная угроза джунгарского нашествия вызвала беспрецедентную мобилизацию всего казахского народа. Жасак — племенное ополчение — было создано по указу хана, привлекая всех трудоспособных мужчин из трёх жузов на защиту Родины." #NT!
 nd_kaz_batyr_tradition: "Батырская традиция" #NT!
 nd_kaz_batyr_tradition_desc: "Батыр – воин-чемпион – высшая честь в казахской боевой культуре. Такие люди, как Богенбай, Кабанбай и Наурызбай, заслужили свой титул за личные доблестные боевые подвиги, а их имена на протяжении веков эхом отражаются в эпической поэзии.\n\n#italic Доступно в: $nd_kaz_batyr_training_ground$#!" #NT!
 nd_kaz_togan_defenses: "Сторожевые посты Тогана" #NT!
 nd_kaz_togan_defenses_desc: "В отличие от оседлых народов, которые строят стены, казахи защищают свою территорию с помощью мобильных охранных постов и дозорных постов вдоль границы. Эти тоганы обеспечивают раннее предупреждение о вторжении и служат точками сбора ополчения." #NT!
 nd_kaz_anyrakay_triumph: "Триумф в Аниракай" #NT!
 nd_kaz_anyrakay_triumph_desc: "Сорокадневная битва при Аныракае в 1730 году, в которой объединенные казахские войска Абулхаир-хана разбили джунгарское наступление на протяжении двухсот километров степи, доказала, что кочевая конница, скоординированная в трех жузах, может победить любого врага." #NT!
 nd_kaz_horse_silk_exchange: "Конно-шелковая биржа" #NT!
 nd_kaz_horse_silk_exchange_desc: "Регулируемая торговля между Казахским ханством и династией Цин, заключавшаяся в обмене выносливых степных лошадей на шелк, чай и промышленные товары. Это стало столпом дипломатии и источником огромных богатств казахских баев." #NT!
 nd_kaz_abulkhair_diplomacy: "Дипломатия Абулхаира" #NT!
 nd_kaz_abulkhair_diplomacy_desc: "Хан Абулхаир из Младшего жуза находился в опасной дипломатической ситуации, стремясь к союзу с Россией против джунгар и одновременно пытаясь сохранить суверенитет Казахстана. Его прагматичное государственное искусство задало образец степной дипломатии в эпоху великих империй." #NT!
 nd_kaz_batyr_champions: "Батыр Чемпионы" #NT!
 nd_kaz_batyr_champions_desc: "Высшее выражение казахских боевых традиций: легендарные воины, сочетающие мастерство владения составным луком, копьем и верховым боем в одном разрушительном комплексе. Их ратные подвиги вдохновляют целые армии." #NT!
 nd_kaz_ablai_khan_reforms: "Реформы Аблай-хана" #NT!
 nd_kaz_ablai_khan_reforms_desc: "Хан Аблай (годы правления 1771-1781) был последним ханом, осуществлявшим реальную власть над всеми тремя жузами. Его дипломатические маневры между Россией и Китаем в сочетании с централизацией внутренних реформ ознаменовали окончательный расцвет Казахского ханства как независимой державы." #NT!
 nd_kaz_pastoral_wealth: "Пастырское богатство" #NT!
 nd_kaz_pastoral_wealth_desc: "На пике своего развития казахская нация насчитывала миллионы лошадей, крупного рогатого скота, овец и верблюдов. Это богатство скота, при правильном управлении и торговле, может соперничать с серебряными рудниками и плантациями оседлых империй.\n\n#italic Доступно в: $nd_kaz_livestock_market$#!" #NT!
 nd_kaz_nomadic_logistics: "Кочевая логистика" #NT!
 nd_kaz_nomadic_logistics_desc: "Столетия сезонной миграции дали казахам непревзойденное понимание степной логистики, расположения источников воды, пропускной способности пастбищ и самых быстрых маршрутов по, казалось бы, непроходимым лугам." #NT!
 nd_kaz_warrior_code: "Кодекс казахского воина" #NT!
 nd_kaz_warrior_code_desc: "Кодификация боевых традиций кочевников, от подготовки конных лучников до протоколов степной войны, сохраняет боевые навыки, которые поддерживали казахский народ на протяжении веков конфликтов." #NT!
 nd_kaz_alash_identity: "Алаш Айдентика" #NT!
 nd_kaz_alash_identity_desc: "Алаш, легендарный предок казахского народа, дал свое имя непреходящему чувству общей идентичности, которое объединяет три жуза, несмотря на политическую раздробленность. В эпоху вторжения империй это культурное сознание является последней защитой нации." #NT!
 nd_kaz_steppe_resistance: "Степное сопротивление" #NT!
 nd_kaz_steppe_resistance_desc: "Бескрайнюю степь невозможно завоевать ни крепостями, ни путями снабжения. Каждая армия вторжения, марширующая по лугам, оказывается растянутой, преследуемой мобильной кавалерией и медленно поглощаемой самой необъятностью.\n\n#italic Доступно в: $nd_kaz_steppe_arsenal$#!" #NT!
 nd_kaz_zhyrau_poets: "Жырауские поэты" #NT!
 nd_kaz_zhyrau_poets_desc: "Хранителями казахской памяти являются жырау – странствующие поэты-мудрецы, слагающие эпические стихи о подвигах батыров, мудрости биев и красоте степи. Их устная традиция хранит историю страны более точно, чем любой архив.\n\n#italic Доступно в: $nd_kaz_shezhire_archive$#!" #NT!
 nd_kaz_livestock_modernization: "Модернизация животноводства" #NT!
 nd_kaz_livestock_modernization_desc: "Применение новых методов разведения и ветеринарных знаний к огромным казахским стадам повышает качество и количество продукции животноводства, превращая пастушеское кочевничество в более продуктивную экономическую систему." #NT!
 nd_kaz_zhuz_unity: "Жуз Единство" #NT!
 nd_kaz_zhuz_unity_desc: "Растущее осознание общей казахской идентичности, выходящей за пределы жузов, закладывает основу для общеказахского национального сознания, укрепляя узы, которые скрепляют нацию перед внешним давлением." #NT!
 a_nd_kaz_horse_archers: "Казахские конные лучники" #NT!
 a_nd_kaz_horse_archers_desc: "Основа кочевой войны: быстрая кавалерия, вооруженная сложными изогнутыми луками, мастера притворного отступления и разрушительного залпа с тыла." #NT!
 a_nd_kaz_quriltay_guard: "Курилтайский стражник" #NT!
 a_nd_kaz_quriltay_guard_desc: "Элитная конная свита хана, выбранная из лучших всадников каждого клана на ежегодном собрании курилтая." #NT!
 a_nd_kaz_tore_lancers: "Торе Лансерс" #NT!
 a_nd_kaz_tore_lancers_desc: "Чингизидская благородная кавалерия, вооружённая длинными копьями, эти тяжёлые ударные войска наносят решающий удар, сокрушающий вражеские порядки." #NT!
 a_nd_kaz_zhasaq_militia: "Жасак Милиция" #NT!
 a_nd_kaz_zhasaq_militia_desc: "Племенная пехота, мобилизованная по ханскому указу во время экзистенциальной угрозы, набиралась из всех трудоспособных мужчин трех жузов." #NT!
 a_nd_kaz_batyr_champions: "Батыр Чемпионы" #NT!
 a_nd_kaz_batyr_champions_desc: "Легендарные воины-чемпионы, сочетающие мастерство владения луком, копьем и верховой ездой в непревзойденное сочетание мобильной ударной мощи." #NT!
 nd_kaz_horse_stud: "Степной конный завод" #NT!
 nd_kaz_horse_stud_desc: "Места разведения, где выращивают самых выносливых степных лошадей, компактных, выносливых животных, которые выживают только за счет травы и составляют основу как военной мощи Казахстана, так и торгового богатства." #NT!
 nd_kaz_quriltay_ground: "Курилтай Граунд" #NT!
 nd_kaz_quriltay_ground_desc: "Постоянное место сбора, где собираются старейшины кланов, султаны и военачальники, чтобы выбирать ханов, планировать миграции и разрешать споры в соответствии с традициями Чингизидов." #NT!
 nd_kaz_caravan_waystation: "Караван Путевая станция" #NT!
 nd_kaz_caravan_waystation_desc: "Торговый пост Шелкового пути, обеспечивающий приютом, свежими лошадьми и продовольствием торговцев, пересекающих степь, соединяя рынки Трансоксианы с Китаем." #NT!
 nd_kaz_aul_encampment: "Аульный стан" #NT!
 nd_kaz_aul_encampment_desc: "Организованное кочевье, основная ячейка казахского общества, где на путях сезонной миграции между жайлау и кыстау возводятся войлочные юрты." #NT!
 nd_kaz_kumis_brewery: "Кумыс Пивоварня" #NT!
 nd_kaz_kumis_brewery_desc: "Установки по производству кумыса — кисломолочного кобыльего молока — священного напитка степи подавались на застольях, сходах и торжествах всего казахского народа." #NT!
 nd_kaz_batyr_training_ground: "Батырский полигон" #NT!
 nd_kaz_batyr_training_ground_desc: "Степная военная академия, где молодые воины обучаются искусству конной стрельбы из лука, боя на копьях и притворного отступления под руководством батыров-ветеранов." #NT!
 nd_kaz_biy_court: "Бийский суд" #NT!
 nd_kaz_biy_court_desc: "Судебное учреждение, в котором бии – потомственные судьи разрешают споры в соответствии с Джети Жаргы – кодифицированным обычным правом казахского народа." #NT!
 nd_kaz_frontier_watchtower: "Пограничная сторожевая башня" #NT!
 nd_kaz_frontier_watchtower_desc: "Сторожевые посты вдоль степной границы обеспечивают раннее предупреждение о вторжении, служат точками сбора ополчения и приводят к истощению любых сил вторжения." #NT!
 nd_kaz_khans_chancellery: "Ханская канцелярия" #NT!
 nd_kaz_khans_chancellery_desc: "Административный центр ханской власти, где составляются указы, собирается дань, координируются дела трёх жузов." #NT!
 nd_kaz_livestock_market: "Животноводческий рынок" #NT!
 nd_kaz_livestock_market_desc: "Центральный торговый узел, где покупаются и продаются огромные стада казахской степи, соединяя скотоводов с торговцами Шелкового пути." #NT!
 nd_kaz_steppe_arsenal: "Степной Арсенал" #NT!
 nd_kaz_steppe_arsenal_desc: "Склад оружия, на котором хранятся запасы луков, копий, сабель и все чаще огнестрельного оружия для защиты казахской родины." #NT!
 nd_kaz_shezhire_archive: "Шежирский архив" #NT!
 nd_kaz_shezhire_archive_desc: "Учреждение, занимающееся сохранением шежире, генеалогических записей и устных историй, составляющих основу казахской идентичности, посредством творчества поэтов-мудрецов жырау." #NT!
 nd_kaz_horse_rearing: "Выращивание лошадей" #NT!
 nd_kaz_horse_rearing_desc: "Разведение выносливых степных лошадей из пастушеских табунов для военной службы и торговли." #NT!
 nd_kaz_council_provisions: "Положения Совета" #NT!
 nd_kaz_council_provisions_desc: "Для поддержки собраний курилтая предоставлены домашний скот и текстиль." #NT!
 nd_kaz_caravan_supply: "Караванное снабжение" #NT!
 nd_kaz_caravan_supply_desc: "Провизия и сменные крепления поставляются в караваны Шелкового пути." #NT!
 nd_kaz_felt_production: "Производство войлока" #NT!
 nd_kaz_felt_production_desc: "Переработка овечьей шерсти в войлок для покрытия юрт, одежды и товаров для торговли." #NT!
 nd_kaz_kumis_brewing: "Кумысное пивоварение" #NT!
 nd_kaz_kumis_brewing_desc: "Сквашивание кобыльего молока в кумыс — традиционный напиток степных кочевников." #NT!
 nd_kaz_arms_maintenance: "Техническое обслуживание оружия" #NT!
 nd_kaz_arms_maintenance_desc: "Оружие и лошади сохранились для подготовки батыров-поборников." #NT!
 nd_kaz_court_expenses: "Судебные расходы" #NT!
 nd_kaz_court_expenses_desc: "Административные материалы для биевых судов и судопроизводства." #NT!
 nd_kaz_watch_upkeep: "Смотреть обслуживание" #NT!
 nd_kaz_watch_upkeep_desc: "Оружие и продовольствие для гарнизона пограничной сторожевой башни." #NT!
 nd_kaz_chancellery_upkeep: "Содержание канцелярии" #NT!
 nd_kaz_chancellery_upkeep_desc: "Административные материалы по деятельности ханской канцелярии." #NT!
 nd_kaz_livestock_trade: "Торговля Животноводством" #NT!
 nd_kaz_livestock_trade_desc: "Организованная продажа и обмен скота на центральном рынке." #NT!
 nd_kaz_arms_stockpile: "Запасы оружия" #NT!
 nd_kaz_arms_stockpile_desc: "Оружие и огнестрельное оружие сохранено в степном арсенале нужд национальной обороны." #NT!
 nd_kaz_oral_tradition: "Устная традиция" #NT!
 nd_kaz_oral_tradition_desc: "Сохранение и передача казахских родословных и эпической поэзии жырауских поэтов-мудрецов." #NT!
 nd_kaz_formed_tt: "Казахский язык был образован" #NT!
 nd_kaz_path_a_tt: "Выбрал Наследие Касым-хана" #NT!
 nd_kaz_path_b_tt: "Выбрал Конфедерацию Трех Жузов" #NT!
 nd_kaz_destiny: "Судьба Казахского ханства" #NT!
 nd_kaz_destiny_desc: "Казахское ханство восстало из пепла Узбекской конфедерации. Теперь нация должна выбрать свой путь: создаст ли она империю завоеваний или создаст непреходящее богатство в бескрайней степи?" #NT!
 nd_kaz_dest_syr_darya: "Города Сырдарьи" #NT!
 nd_kaz_dest_syr_darya_desc: "Верните древние сырдарьинские города Сигнак и Отрар, первые столицы Казахского ханства, и докажите, что законные правители степи вернулись." #NT!
 nd_kaz_dest_transoxiana: "Завоевание Трансоксианы" #NT!
 nd_kaz_dest_transoxiana_desc: "Идите на юг, чтобы захватить легендарные города Самарканд и Бухару, жемчужины наследия Тимуридов. Казахские всадники поедут туда, где когда-то правили Чингис и Тимур." #NT!
 nd_kaz_dest_kipchak_empire: "Империя Дешт-и Кипчака" #NT!
 nd_kaz_dest_kipchak_empire_desc: "Объединить всю кыпчакскую степь от Волги до Иртыша под властью казахов. Захватите Астрахань и руины столицы Золотой Орды Сарая и восстановите империю Джучи-хана." #NT!
 nd_kaz_dest_silk_road: "Доминион Шелкового пути" #NT!
 nd_kaz_dest_silk_road_desc: "Контролируйте город Туркестан, духовное сердце кипчакской степи, и обеспечьте поток лошадей на казахские рынки. Постройте фундамент пастырской торговой империи." #NT!
 nd_kaz_dest_pastoral_mastery: "Пастырское мастерство" #NT!
 nd_kaz_dest_pastoral_mastery_desc: "Защитите Исфиджаб и развивайте степную экономику посредством банковских учреждений и устойчивого роста. Богатство миллионов скота может соперничать с любым оседлым королевством." #NT!
 nd_kaz_dest_boundless_steppe: "Бескрайняя степь" #NT!
 nd_kaz_dest_boundless_steppe_desc: "Захватите Чач, ворота на шелковые рынки Трансоксианы, и превратите экономику Казахстана в центр континентальной торговли. Степь не будет знать границ." #NT!
 nd_kaz.5.t: "Судьба Казахского ханства" #NT!
 nd_kaz.5.d: "Казахское ханство стоит на пороге величия. От холмистых лугов Дешт-и Кипчака до заснеженных вершин Тянь-Шаня потомки Джанибека и Керея создали нацию. Но нация еще не является империей, и сделанный сейчас выбор определит, запомнят ли казахи как завоевателей или как самых мудрых управителей, которых когда-либо знала степь.\n\nПуть вперед мы сами выбираем." #NT!
 nd_kaz.5.a: "Степь ждет нашей судьбы" #NT!
 nd_kaz.6.t: "Города Сырдарьи" #NT!
 nd_kaz.6.d: "Сигнак и Отрар, древние города вдоль Сырдарьи, снова попали под власть казахов. Это были первые центры казахской власти, где заседал двор Джанибек-хана и где караваны Шелкового пути пересекались с ордами кочевников. Их завоевание знаменует собой начало великих амбиций.\n\nСтены оседлых городов теперь укрывают ханские знамена, и мир обращает на это внимание." #NT!
 nd_kaz.6.a: "Первый шаг на долгом пути" #NT!
 nd_kaz.7.t: "Завоевание Трансоксианы" #NT!
 nd_kaz.7.d: "Немыслимое было достигнуто. Казахская кавалерия проезжает по улицам Самарканда, мимо Регистана и бирюзовых куполов наследия Тимура. Бухара, благородный город, открыла свои ворота. Великие города-оазисы, которые когда-то смотрели свысока на степных кочевников, теперь платят дань казахскому хану.\n\nЭто завоевание требует решения: будем ли мы править этими городами железной рукой или использовать их богатства посредством более тонких механизмов?" #NT!
 nd_kaz.7.a: "Города преклоняют колени перед степью" #NT!
 nd_kaz.7.b: "Пусть они платят дань и сохраняют свой путь" #NT!
 nd_kaz.8.t: "Империя Дешт-и Кипчака" #NT!
 nd_kaz.8.d: "От берегов Волги до берегов озера Балхаш, от Астрахани до развалин Сарая, где когда-то правила Золотая Орда, весь Дешт-и Кипчак теперь подчиняется одному хану. Казахский народ достиг того, чего не удавалось ни одному государству-преемнику улуса Джучид с момента его распада: воссоединения западной и восточной степи под одним знаменем.\n\nЭто больше, чем завоевание. Это восстановление империи, потрясшей мир." #NT!
 nd_kaz.8.a: "Мы наследники Джучи-хана" #NT!
 nd_kaz.8.b: "Мы куем свое наследие в степи" #NT!
 nd_kaz.9.t: "Доминион Шелкового пути" #NT!
 nd_kaz.9.d: "Священный город Туркестан, где находится святыня Ходжи Ахмеда Ясави, прочно стоит в руках казахов. Что еще более важно, торговые пути, пересекающие степь, теперь проходят через рынки, контролируемые казахами, где десятками тысяч продаются лошади, настоящая валюта кочевников.\n\nОсновы скотоводческой торговой империи были заложены." #NT!
 nd_kaz.9.a: "Богатство степи течет через наши руки" #NT!
 nd_kaz.10.t: "Пастырское мастерство" #NT!
 nd_kaz.10.d: "Степная экономика Казахстана вышла за рамки простого скотоводства. Банковские учреждения теперь облегчают торговлю скотом и лошадьми, которая раньше зависела только от бартера. Город Исфиджаб служит центром, где кочевое богатство сочетается с оседлой торговлей, а освоение обширных лугов происходит такими темпами, которые удивили бы ханов прошлого.\n\nОткрываются два пути процветания: удвоить ли мы пасторальное богатство, которое делает степь уникальной, или использовать свое положение в качестве незаменимого звена в континентальной караванной торговле?" #NT!
 nd_kaz.10.a: "Конные лорды станут еще богаче" #NT!
 nd_kaz.10.b: "Караванные пути – наше истинное богатство" #NT!
 nd_kaz.11.t: "Бескрайняя степь" #NT!
 nd_kaz.11.d: "Чач, ворота между степью и центром производства шелка в Центральной Азии, взят под контроль, и вместе с ним на рынки Казахстана хлынет поток шелка, чая и драгоценных товаров. Нация достигла того, что казалось невозможным для пасторального народа: экономики, которая может соперничать с любой оседлой империей, построенной не на шахтах и ​​плантациях, а на бескрайних лугах и животных, которые их поддерживают.\n\nУ степи нет стен, и у казахов нет амбиций. Остается окончательный выбор: сосредоточим ли мы это богатство в больших городах или распределим его по вечным пастбищам?" #NT!
 nd_kaz.11.a: "Постройте мегаполис, достойный степи." #NT!
 nd_kaz.11.b: "Вечные пастбища поддерживают все" #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_timurids_humbled: "Тимуриды смирились" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_timurids_humbled: "Завоевание Трансоксианы демонстрирует превосходство степной конницы над гарнизонными войсками оседлых городов. Под ханское знамя стекаются роты наемников." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_oasis_tributaries: "Притоки Оазиса" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_oasis_tributaries: "Вместо того, чтобы уничтожать богатства завоеванных городов, хан взимает дань посредством вассальной зависимости, ускоряя присоединение новых территорий." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_successor_of_jochi: "Преемник Джучи" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_successor_of_jochi: "Претендуя на наследие хана Джучи и Золотой Орды, Казахское ханство пользуется уважением всех тюркских народов и ведет переговоры с позиции неоспоримого престижа." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_steppe_imperium: "Степной Империум" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_steppe_imperium: "В степи возникает новая империя, не реставрация, а нечто оригинальное. Покоренные народы быстро поглощаются, и право хана вести войну признается на всем континенте." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_horse_lords: "Конные Лорды" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_horse_lords: "Казахские баи контролируют миллионные стада. Это пастырское богатство стимулирует институциональное развитие, хотя зависимость от животноводства делает формальную банковскую деятельность более дорогостоящей." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_caravan_kings: "Караванные короли" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_caravan_kings: "Контроль Казахстана над континентальными караванными путями создает сеть дипломатических связей и быстрое восстановление после потрясений, хотя сосредоточение внимания на торговле достигается за счет военной готовности." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_nomad_metropolis: "Кочевой Метрополис" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_nomad_metropolis: "Великий город возвышается в степи, торговый и дипломатический центр, где богатство кочевников превращается в городское великолепие, привлекая торговцев и посланников со всего континента." #NT!
 STATIC_MODIFIER_NAME_nd_kaz_dest_eternal_pastures: "Вечные пастбища" #NT!
 STATIC_MODIFIER_DESC_nd_kaz_dest_eternal_pastures: "Вместо того, чтобы концентрировать богатство в городах, казахи распространили процветание на обширные луга. Каждое сословие процветает, крепнет ополчение, и сама степь становится памятником казахского величия." #NT!
 nd_kaz_khans_war_camp: "Ханский военный лагерь" #NT!
 nd_kaz_khans_war_camp_desc: "Мобильный командный пункт казахского хана во время крупных походов, обширный комплекс юрт, повозок с припасами и загонов, служащий нервным центром степной войны." #NT!
 nd_kaz_great_bazaar: "Большой базар" #NT!
 nd_kaz_great_bazaar_desc: "Огромный постоянный рынок, где пасторальное богатство степи торгуется наряду с шелком, специями и промышленными товарами оседлого мира, торговый центр казахской торговой империи." #NT!
 nd_kaz_war_camp_upkeep: "Содержание военного лагеря" #NT!
 nd_kaz_war_camp_upkeep_desc: "Оружие, лошади, кожа и провиант для мобильного командного пункта хана." #NT!
 nd_kaz_bazaar_operations: "Базарные операции" #NT!
 nd_kaz_bazaar_operations_desc: "Ткань, скот, соль и инструменты, необходимые для поддержания торговых операций на большом базаре." #NT!
  
  # ===== BUREAUCRACIES ===== 
 AUTO_MODIFIER_NAME_nd_kaz_bureaucracy_authority: "Полномочия казахского хана" #NT!
 AUTO_MODIFIER_DESC_nd_kaz_bureaucracy_authority: "После провозглашения ханства степные институты смогут сохраниться на постоянной основе. Открыты две бюрократические вакансии, наряду с той, которую всегда предоставляет капитал." #NT!
  
 kaz_jeti_jargy_bureaucracy: "Джети Джаргы" #NT!
 kaz_jeti_jargy_bureaucracy_desc: "В последние десятилетия XVII века Тауке-хан созвал трех величайших биев (Толе би Старшего жуза, Казыбек би Среднего, Айтеке би Младшего) и систематизировал обычное право степи в Джети Джаргы, Семь кодексов. Кодексы регулируют кун кровавые деньги, выкуп за невесту, кражу скота и наказание за преступления; они закрепляют суд биев как истинную судебную власть степи. Там, где кодексы соблюдаются, простые казахи находят защиту от произвольного кланового насилия; где они загнивают, возвращаются кровная месть и барымта, скотоводство." #NT!
  
 kaz_three_zhuz_confederation_bureaucracy: "Три жуза" #NT!
 kaz_three_zhuz_confederation_bureaucracy_desc: "Гений казахского управления после Касым-хана заключается не в одном хане, а в балансе трех жузов: Улу, или Старшего, пасущегося в Жетысу; Орта, или Средняя, ​​в центральной степи; и Киши, или Младший, по Яику. Каждый жуз имеет свои пастбища, своих биев, свою линию ханов, происходящую от Джанибека и Керея. Единство возникает из консенсуса, а не из приказа. Такая договоренность делает степь почти невозможной для завоевания, но каждый жуз может вести переговоры с иностранными державами независимо и действительно ведет переговоры, как это сделал Абулхаир с Россией в 1731 году." #NT!
  
 kaz_ak_suiek_tore_bureaucracy: "Ак-Суйек Торе" #NT!
 kaz_ak_suiek_tore_bureaucracy_desc: "Казахское общество жестко разделено на Ак-Суйек (белая кость) и Кара-Суек (черная кость). Только потомки Чингисхана через Джучи, Торе, могут претендовать на титул хана или султана; только Торе может выступать в ассамблее Куралая с обязательными полномочиями. Ниже них находятся кланы Кара-Суек, возглавляемые собственными биями и батырами, но лишенные права занимать верховную должность. Каста Торе дает казахам непрерывную цепь законного правления от Джанибека до Кенесары, но их эндогамная изолированность сводит на нет политическую роль меньших кланов." #NT!
  
 kaz_aksakal_aul_governance_bureaucracy: "Управление Аксакал Аул" #NT!
 kaz_aksakal_aul_governance_bureaucracy_desc: "Ниже ханов и вне досягаемости какой-либо канцелярии через аул протекает казахская кочевая жизнь: зимний или летний лагерь, состоящий примерно из дюжины юрт, принадлежащих одной обширной родовой группе. Аксакал, белобородый, является старшим старейшиной, чье слово урегулирует права на выпас скота, брачные контракты и ежедневные споры, которые никогда не доходят до суда биев. У заведения нет ни здания, ни свитка, ни жалованья; он действует везде, где казахи разбивают свои палатки. Когда хан требует большего, чем считают справедливыми старейшины аула, аул просто мигрирует за пределы досягаемости." #NT!
  
 kaz_batyr_war_bands_bureaucracy: "Батырские боевые отряды" #NT!
 kaz_batyr_war_bands_bureaucracy_desc: "Вне формальной иерархии Торе стоят батыры: воины любого клана, заслужившие этот титул военными подвигами. Богенбай, Кабанбай, Наурызбай: эти имена звучат в казахской традиции как люди, которые разбили джунгарское вторжение в Аныракай в 1730 году после катастрофического отступления Актабана Шубырынды в 1723 году. Батыр командует отрядом, набранным из своих родственников и поклонников; он подчиняется хану только по своему выбору, сражается, когда есть честь или добыча, и расходится, когда поход заканчивается. Учреждение является глубочайшим резервом военной силы в степи, но оно работает на барымте и не может быть отключено после завершения кампании." #NT!
