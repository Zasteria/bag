 KBU: "Канем-Борну" #NT!
 KBU_ADJ: "Канеми" #NT!
 KBU_f: "Канем-Борну" #NT!
 KBU_f_desc: "Империя Канем-Борну, которой правила династия Сайфава на протяжении более семи столетий, доминировала в бассейне озера Чад и контролировала жизненно важные транссахарские торговые пути. Воссоединив первоначальный центр Канема с территориями Борну, империя готова восстановить свое превосходство над центральным Сахелем." #NT!
