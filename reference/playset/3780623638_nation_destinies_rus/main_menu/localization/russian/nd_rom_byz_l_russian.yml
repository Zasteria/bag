l_russian:
  # ===== FORMATION CHOICE MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_rom_byz_romanitas_vincit: "Романитас Винчит" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_romanitas_vincit: "Латинизация завершена. Суд говорит на латыни, литургия следует римскому обряду, и орел на нашем знамени — римский, а не византийский. Греческое наследие является основой, но цель однозначна: стать римлянином, как Август и Константин были римлянами. Папа благословляет императорскую коронацию. Давно потерянный Запад возвращается к имперскому общению. Затраты несут общины греческого обряда, которые наблюдают, как их привычная литургия постепенно исчезает в латинском песнопении." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_hellenikos_romaios: "Хелленикос Ромайос" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_hellenikos_romaios: "Мы не будем притворяться тем, кем мы не являемся. Римляне Востока говорили по-гречески, а римляне Запада теперь двуязычны. Греческая литургия в латинских церквях. Восточная придворная церемония в римских залах. Наследники Плетона читают лекции рядом с латинскими канонистами. Империя — это то, чем она является на самом деле: синтез. Виссарион был прав, и Фотий был прав. Папа должен приспособиться к суду, который в оригинале цитирует Цицерона и Платона." #NT!
  
  # ===== FORMATION EVENT ===== 
 nd_rom_byz.1.t: "Орел возвращается в Рим" #NT!
 nd_rom_byz.1.d: "Это сделано. После столетий изгнания, после долгого позора 1204 года и долгого террора 1453 года Римская империя вернулась в Рим. Базилевс стоит в базилике, где когда-то преклонял колени Константин. Форум наш. Тибр наш. Семь холмов, потерянных со времен Августула, снова летят над орлом.\n\nНо какой империей мы стали? Ванильный эффект формирования уже тянет нас на запад, к латыни, к римскому обряду, к идентичности старой империи. Некоторые при дворе приветствуют этот сдвиг: они говорят, что наконец-то мы можем перестать притворяться греками. Другие, философы, епископы Меццоджорно и выжившее поколение константинопольских беженцев, умоляют нас сопротивляться этому.\n\nКакой же это должен быть Рим? Латинский Рим Августа, полностью восстановленный, Восток как воспоминание? Или двуязычные, двукультурные ромеозины, которыми мы на самом деле являемся: синтез, который обязан как Плетону, так и Петрарке?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_rom_byz.1.a: "Романитас Винчит. Мы теперь латиняне." #NT!
 nd_rom_byz.1.b: "Хелленикос Ромайос. Греческий и латынь вместе." #NT!
  
  # ===== HERITAGE ADVANCES ===== 
  
  # Variable tooltip 
 nd_rom_byz_formed_tt: "Итальянско-римская реставрация была сформирована." #NT!
 nd_rom_byz_path_a_tt: "Выбери судьбу #bold Романитас Винчит#!" #NT!
 nd_rom_byz_path_b_tt: "Выбери судьбу #bold Хелленикоса Ромайоса#!" #NT!
  
  # Age 1 
 nd_rom_byz_stratiotai_italici: "Стратиотай Италичи" #NT!
 nd_rom_byz_stratiotai_italici_desc: "Восточная тематическая система, перенесенная в южную Италию и Калабрию, дает империи класс солдат-фермеров, которого она не могла завербовать с одиннадцатого века. Албанские и греко-калабрийские мелкие землевладельцы выступают в роли императорской легкой кавалерии." #NT!
 nd_rom_byz_bilingual_chancery: "Двуязычная канцелярия" #NT!
 nd_rom_byz_bilingual_chancery_desc: "Греческий и латынь стали официальными лицами в императорской канцелярии. Логофеты в Константинополе и нотариусы в Риме работают с двуязычными документами. Административный охват империи, наконец, стал одинаковым в обеих половинах." #NT!
 nd_rom_byz_restored_themes: "Восстановленные темы" #NT!
 nd_rom_byz_restored_themes_desc: "Тематическая система, восточное слияние военной и гражданской администрации, распространяется на юг Италии. Генералы управляют провинциями; солдаты обрабатывают землю, которую они защищают. Наборы войск растут, гарнизоны укрепляются, контроль углубляется." #NT!
 nd_rom_byz_filioque_reconciled: "Филиокве примирилось" #NT!
 nd_rom_byz_filioque_reconciled_desc: "Великая богословская рана между Константинополем и Римом наконец закрывается. На этот раз советы Флоренции и Феррары осуществляются на римской земле императором, который может их обеспечить. Еретиков терпят; конверсия ускоряется. Христианское государство целостно." #NT!
  
  # Age 2 
 nd_rom_byz_plethon_academy: "Академия Плетона" #NT!
 nd_rom_byz_plethon_academy_desc: "Гемист Плетон и греческая диаспора привносят неоплатоническую философию в итальянский гуманизм. Флорентийская Платоническая академия, но покровителем которой была империя. Знания текут из Константинополя через Флоренцию в каждый имперский город." #NT!
 nd_rom_byz_mezzogiorno_greeks: "Греки Меццоджорно" #NT!
 nd_rom_byz_mezzogiorno_greeks_desc: "Калабрийские, апулийские и сицилийские греческие общины, на протяжении столетий маргинализировавшиеся под властью норманнов и анжуйцев, стали привилегированным субъектом имперской культурной политики. Их диалект признан; их церкви финансируются; их служба вознаграждается." #NT!
 nd_rom_byz_renaissance_pronoia: "Ренессанс Пронойя" #NT!
 nd_rom_byz_renaissance_pronoia_desc: "Восточная система грантов за услуги адаптируется к итальянской экономике кондотьеров. Земля в обмен на кавалерию, но управлялась через латинизированный итальянский феодальный аппарат. Результатом является профессиональная кавалерия на восточных условиях в западных институтах." #NT!
 nd_rom_byz_bank_vestiarion: "Банк Вестиариона" #NT!
 nd_rom_byz_bank_vestiarion_desc: "Императорская казна, старый византийский Вестиарион, принимает двойную бухгалтерию флорентийских домов. Налоговое администрирование ужесточается; кредиты становятся дешевле; имперский фиск растет." #NT!
  
  # Age 3 
 nd_rom_byz_mare_nostrum_renatum: "Маре Нострум Ренатум" #NT!
 nd_rom_byz_mare_nostrum_renatum_desc: "Единый имперский галерный флот, сочетающий итальянские галерные традиции (венецианские, генуэзские, неаполитанские) с византийской доктриной дромонов, снова управляет Средиземным морем как единым морем. Эпоха враждующих итальянских адмиралтейств прошла." #NT!
 nd_rom_byz_imperial_studia: "Императорская Студия" #NT!
 nd_rom_byz_imperial_studia_desc: "Греческая диаспора, сейчас проходящая через Италию в своем третьем поколении, профессионально занимается в дипломированных имперских студиях, финансируемых Вестиарионом. Библиотека Виссариона умножается в десять раз в имперских городах." #NT!
 nd_rom_byz_greek_curial_reform: "Греческая куриальная реформа" #NT!
 nd_rom_byz_greek_curial_reform_desc: "Папская курия объединяет кардиналов греческого обряда и константинопольских канонистов. Папа дает советы императору; император утверждает папу. Цезаропапизм и папское верховенство с трудом слились в единую действующую экклезиологию." #NT!
 nd_rom_byz_tyrrhenian_spice: "Тирренские станции специй" #NT!
 nd_rom_byz_tyrrhenian_spice_desc: "Имперские корабли разрушают посредничество венецианцев и мамлюков, самостоятельно плывя по восточным маршрутам. Крит, Кипр и египетские аванпосты восстанавливают прямую связь с Индийским океаном. Римские рынки снова стали мировым центром обмена специями." #NT!
  
  # Age 4 
 nd_rom_byz_tridentine_synthesis: "Тридентин Синтез" #NT!
 nd_rom_byz_tridentine_synthesis_desc: "Тридентский совет собирается, но с участием греческих наблюдателей и легатов императора. Реформа без раскола. Католическая ортодоксия остается единой, избавляя Италию и Восток от религиозных войн, опустошивших остальную Европу." #NT!
 nd_rom_byz_imperial_vestiarion: "Имперский Вестиарион" #NT!
 nd_rom_byz_imperial_vestiarion_desc: "Единое имперское казначейство применяет итальянские банковские принципы в масштабе восточного финансового института. Генуэзские и флорентийские банкиры занимают должности в императорском кабинете рядом с выжившими потомками комнатских логофетов." #NT!
 nd_rom_byz_greek_humanism: "Греческий гуманизм эпохи Возрождения" #NT!
 nd_rom_byz_greek_humanism_desc: "Итальянская гуманистическая традиция, питаемая византийскими эмигрантами на протяжении двух поколений, становится официальной культурной программой империи. Классический греческий язык теперь является придворным достижением наряду с латынью и имперским диалектом." #NT!
 nd_rom_byz_imperial_ceremony: "Императорская церемония восстановлена" #NT!
 nd_rom_byz_imperial_ceremony_desc: "Сложный византийский придворный ритуал с его шелковыми облачениями, возгласами и прокипсисом возвращается в Рим. Книга церемоний становится протокольным руководством европейской дипломатии. Стоять перед басилевсом — значит снова стоять в центре мира." #NT!
  
  # Age 5 
 nd_rom_byz_new_justinianic_code: "Новый кодекс Юстиниана" #NT!
 nd_rom_byz_new_justinianic_code_desc: "Corpus Iuris Civilis дополнен двумя столетиями имперских конституций после реставрации. Этот продукт становится стандартом гражданского права в странах Средиземноморья и католической Европы, а римские юристы снова становятся арбитрами юридической практики." #NT!
 nd_rom_byz_galley_schools: "Средиземноморские камбузные школы" #NT!
 nd_rom_byz_galley_schools_desc: "Военно-морские академии в Неаполе, Венеции (покоренной), Константинополе и Генуе обучают офицеров единой имперской доктрине. Mare Nostrum патрулируется как единый флот под одним командованием, а не как лоскутное одеяло из адмиралтейств городов-государств." #NT!
 nd_rom_byz_imperial_dragomanate: "Императорский Драгоманат" #NT!
 nd_rom_byz_imperial_dragomanate_desc: "Офис главного драгомана превращается в полноценный имперский дипломатический корпус. Греческие и итальянские полиглоты, обученные латыни, греческому, арабскому языку и курсиву, составляют штат дипломатических представительств при каждом дворе Европы и Леванта." #NT!
 nd_rom_byz_roman_greek_identity: "Римско-греческая идентичность" #NT!
 nd_rom_byz_roman_greek_identity_desc: "После двух столетий слияния «римлянин» больше не отличает латынь от греческого. Единая имперская субъектная идентичность объединяет территории двух бывших империй одной гражданской концепцией." #NT!
  
  # Age 6 
 nd_rom_byz_imperial_enlightenment: "Имперское Просвещение" #NT!
 nd_rom_byz_imperial_enlightenment_desc: "Греко-итальянская гуманистическая традиция, богатство Вестиариона и сеть фанариотов объединяются в особое римское Просвещение. Вико, Беккариа, но имперского покровительства и греческого философского наследия, которых нет в остальной Европе." #NT!
 nd_rom_byz_modern_navy: "Современный Имперский флот" #NT!
 nd_rom_byz_modern_navy_desc: "Школы на галерах превращаются в линейные корабли. Средиземноморская галерная традиция, насчитывающая десять веков, уступает место имперским флотам открытых морей из Неаполя, Константинополя и Крита." #NT!
 nd_rom_byz_bilingual_education: "Двуязычное имперское образование" #NT!
 nd_rom_byz_bilingual_education_desc: "Государственное образование на латыни и греческом языке для всех имперских подданных. Грамотность как инструмент имперского объединения. Ромей Афинский и Роман Миланский читали одну и ту же императорскую газету двумя буквами." #NT!
 nd_rom_byz_imperial_codification: "Имперская кодификация" #NT!
 nd_rom_byz_imperial_codification_desc: "Железные дороги, телеграф и современная бюрократия применялись во всех имперских владениях. Кодифицирующие амбиции Юстиниана встречаются с администрацией паровой эпохи. Империя наконец-то стала настолько понятной для себя, насколько мечтал Юстиниан." #NT!
  
  # ===== HERITAGE EVENTS ===== 
  
  # nd_rom_byz.2: Filioque Reconciled 
 nd_rom_byz.2.t: "Филиокве примирилось" #NT!
 nd_rom_byz.2.d: "Самая глубокая богословская рана в христианском мире – спор о Филиокве, который на протяжении полутысячелетия отделял Восток от Запада, – закрыта. Соборы Флоренции и Феррары, предпринятые во времена наших предшественников и отвергнутые константинопольской толпой, теперь осуществляются в самом Риме. Христиане греческого и латинского обрядов признают одно вероучение, одно общение, одного императора.\n\nНо кто является арбитром этого союза? Папа настаивает на том, что его кафедра выше; патриархи настаивают на соборной традиции. Как император, мы должны занять определенную позицию." #NT!
 nd_rom_byz.2.a: "Папское согласие. Папа – наш канцлер в вопросах веры." #NT!
 nd_rom_byz.2.b: "Цезаропапское возрождение. Император старше; подчиненный папы." #NT!
  
  # nd_rom_byz.3: Plethon's Academy 
 nd_rom_byz.3.t: "Академия Плетона" #NT!
 nd_rom_byz.3.d: "Интеллектуальное наследие Гемистоса Плетона живо. Греческим философам, бежавшим на запад после падения Константинополя, теперь покровительствует император, бежавший на восток, чтобы вернуть его. Их академия, созданная по образцу Флорентийской Платонической академии Козимо Медичи, теперь является имперским учреждением. Неоплатонизм, классическая филология, сравнительное богословие: Возрождение обретает греческий костяк." #NT!
 nd_rom_byz.3.a: "Пусть философия служит империи." #NT!
  
  # nd_rom_byz.4: The Bilingual Court 
 nd_rom_byz.4.t: "Двуязычный суд" #NT!
 nd_rom_byz.4.d: "Греческий и латынь теперь являются официальными лицами в императорской канцелярии. Документы выдаются в двуязычной форме. Старые константинопольские логофеты, число которых сократилось до горстки за годы, предшествовавшие падению города, восстанавливаются вместе с итальянскими нотариусами римской курии. Административный охват империи последовательно простирается от Адриатики до Эгейского моря впервые за пять столетий." #NT!
 nd_rom_byz.4.a: "Восстановить логофетные офисы." #NT!
  
  # nd_rom_byz.5: The Mezzogiorno Greeks 
 nd_rom_byz.5.t: "Италогреция пробуждается" #NT!
 nd_rom_byz.5.d: "Сообщества, которые мы считали потерянными, все еще существуют. Греческие деревни Калабрии, где литургия никогда не переставала быть греческой. Апулийские монастыри, в которых сохранились константинопольские рукописи на протяжении веков нормандской эпохи. Сицилийские рыбацкие города, чей диалект сохраняет византийские нотки под сицилийской оболочкой.\n\nВпервые за пятьсот лет римский император может говорить с этими италогреками как с соотечественниками. Они стекаются на императорскую службу: как священники, как солдаты, как администраторы новых фем." #NT!
 nd_rom_byz.5.a: "Италогреция, мой старший брат, проснулся." #NT!
  
  # nd_rom_byz.6: Mediterranean Mastery 
 nd_rom_byz.6.t: "Mare Nostrum, действительно" #NT!
 nd_rom_byz.6.d: "Единый имперский галерный флот, сочетающий в себе итальянскую и византийскую доктрины, продемонстрировал свое господство на Средиземноморье. Венецианское и Генуэзское адмиралтейства были включены в имперскую структуру. Мамлюкский флот был изгнан с Кипра. Магрибские корсары не нашли порта, который мог бы их укрыть. От Геркулесовых столбов до Босфора каждая волна подчиняется одному имперскому полководцу." #NT!
 nd_rom_byz.6.a: "Море принадлежит нам, как и должно было быть." #NT!
  
  # ===== HERITAGE TIMED MODIFIERS ===== 
 STATIC_MODIFIER_NAME_nd_rom_byz_papal_concord: "Папское согласие" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_papal_concord: "Папа является канцлером империи в вопросах веры и высокопоставленным дипломатическим сотрудником в католической Европе. Кардиналы защищают имперские дела в иностранных судах. Преданность углубляется через союз." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_caesaropapal_revival: "Цезаропапское возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_caesaropapal_revival: "Восстанавливается восточная модель христианского государства: император председательствует на синодах, утверждает как патриархов, так и папу, а также разрешает доктринальные споры. Власть короны в делах религии растет; духовенство раздражается; легитимность растет." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_neoplatonic_revival: "Неоплатоническое возрождение" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_neoplatonic_revival: "Наследники Плетона преподают в каждом имперском городе. Неоплатоническая философия, классическая филология и сравнительное богословие распространялись наряду с итальянской гуманистической программой. Грамотность и институциональный рост ускоряются." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_logothete_revival: "Возрождение логофета" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_logothete_revival: "Старые константинопольские бюрократические учреждения, логофеты различных имперских департаментов, восстанавливаются рядом с итальянской канцелярией. Набор советников становится дешевле, кабинет министров острее, контроль распространяется дальше от столицы." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_italograecia: "Италогреция" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_italograecia: "Сохранившиеся итальянские греческие общины Калабрии, Апулии и Сицилии, долгое время маргинализированные под властью норманнов и анжуйцев, стали привилегированным субъектом имперской культурной политики. Культурная традиция углубляется; ассимиляция ускоряется; сепаратизм угасает." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_mediterranean_hegemony: "Средиземноморская гегемония" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_mediterranean_hegemony: "Единый имперский галерный флот правит Средиземноморьем. Итальянская и византийская доктрины слились в одном командовании. Галерный бой доминирует, блокады сильны, а имперское морское присутствие распространяется на каждый берег." #NT!
  
  # ===== CUSTOM UNITS ===== 
 a_nd_rom_byz_stratiotai: "Стратиотай Италичи" #NT!
 a_nd_rom_byz_stratiotai_desc: "Греко-итальянская легкая кавалерия восстановленной тематической системы. Албанские и калабрийско-греческие всадники, взятые из греческого субстрата Меццоджорно и Адриатических провинций империи. Быстрее и агрессивнее, чем стандартная кавалерия-рекрут 1-го возраста, хорошо подходит для итальянской местности, в которой они выросли." #NT!
 n_nd_rom_byz_imperial_galley: "Императорская галера" #NT!
 n_nd_rom_byz_imperial_galley_desc: "Военный корабль трехлетней давности, сочетающий итальянские галерные традиции (венецианские, генуэзские, неаполитанские) с византийской доктриной дромонов. Королева средиземноморских сражений: способна в равной степени вести ближний бой, абордаж и блокаду." #NT!
  
  # ===== CUSTOM LEVIES ===== 
 levy_nd_rom_byz_stratiotai: "Стратиотаи Италичи Леви" #NT!
 levy_nd_rom_byz_stratiotai_desc: "Легкая кавалерия из восстановленной тематической системы на юге Италии и в Калабрии. Греко-итальянские мелкие землевладельцы, обязанные на имперскую военную службу в восточном тематическом стиле: земля в обмен на седло." #NT!
  
  # ===== CUSTOM BUILDINGS ===== 
 nd_rom_byz_studium_graecum: "Студия Грекум" #NT!
 nd_rom_byz_studium_graecum_desc: "Императорская академия, объединяющая Константинопольский Пандидактерион и студию итальянского Возрождения. Преемники-неоплатоники Плетона преподают греческий, латынь и арабский язык следующему поколению имперских клерков и епископов. Studium Graecum в любом достаточно большом городе является одним из самых престижных учреждений империи." #NT!
 nd_rom_byz_basilica_imperialis: "Базилика Империалис" #NT!
 nd_rom_byz_basilica_imperialis_desc: "Великая императорская базилика в совместном латино-греческом обряде. Созданный по образцу собора Святой Софии и собора Святого Петра одновременно, он является видимым доказательством посттридентского компромисса: католическое в общении, греческое в литургии, где это предпочитают местные общины. Здесь император коронует себя и председательствует на синодах." #NT!
  
  # Production methods 
 nd_rom_byz_studium_upkeep: "Содержание студии" #NT!
 nd_rom_byz_studium_upkeep_desc: "Бумага, книги, свечи из пчелиного воска и ткань для академического облачения обеспечивают повседневную работу Студии." #NT!
 nd_rom_byz_basilica_upkeep: "Содержание базилики" #NT!
 nd_rom_byz_basilica_upkeep_desc: "Мрамор для текущего строительства, пчелиный воск для свечей и ткань для облачений и алтарных украшений, драгоценные камни для реликвариев и императорских регалий." #NT!
  
  # ===== DESTINY ADVANCES ===== 
  
  # Path tooltip already exists above (nd_rom_byz_path_a_tt, nd_rom_byz_path_b_tt) 
  
 nd_rom_byz_destiny: "Имперская судьба" #NT!
 nd_rom_byz_destiny_desc: "Империя восстановлена, орел вновь летает над Римом. Но какой империей мы стали? Судьба Римского государства должна быть выбрана сейчас, прежде чем фундамент затвердеет. Требуется #bold 75 стабильности#!.." #NT!
  
  # Path A 
 nd_rom_byz_dest_imperium_restitutum: "Империум Реститутум" #NT!
 nd_rom_byz_dest_imperium_restitutum_desc: "Латинская империя утверждает себя за пределами Италии. Ахен (где Карл Великий был коронован преемником Цезаря) и Тулуза (ворота на католический запад) признают римскую власть. Империя воспринимает Ренессанс как возрождение классической латыни. Требуется #bold владение Аахеном и Тулузой, принятие института эпохи Возрождения, размер армии 30+#!.." #NT!
 nd_rom_byz_dest_concordia_pontificia: "Конкордия Папская" #NT!
 nd_rom_byz_dest_concordia_pontificia_desc: "Католические монархии склоняются перед имперским главенством. Реймс (святыня Капетингов, католическое сердце Франции) и Толедо (первоначальный престол Испании) входят в имперскую орбиту. Конфессионализм цементирует посттридентский компромисс. Требуется #bold владение Реймсом и Толедо, принятие конфессионализма, 2000 золота, 5500 развития#!." #NT!
 nd_rom_byz_dest_imperium_occidentis: "Империум Запада" #NT!
 nd_rom_byz_dest_imperium_occidentis_desc: "Западная часть Средиземноморья старого римского мира воссоединяется с империей. Лиссабон, Кордова и Тунис снова летят на орле. Латинская империя достигла своего предела. Открывает #bold Templum Pontificis Maximi#!.. Требуется #bold владения Лиссабоном, Кордовой и Тунисом, 3000 золота, 75 престижа, размер армии 75+#!.." #NT!
  
  # Path B 
 nd_rom_byz_dest_aigaion_anaktethen: "Эгеон Анактетен" #NT!
 nd_rom_byz_dest_aigaion_anaktethen_desc: "Эгейское море восстановлено. Афины (удерживаемые с 1311 года каталонскими и флорентийскими авантюристами) и Кандия (венецианский Крит) возвращаются в состав империи. Сердце Греции восстанавливается не путем подавления Запада, а путем слияния двух половин. Требуется #bold владение Афинами и Кандией, принятие института эпохи Возрождения, размер армии 30+#!.." #NT!
 nd_rom_byz_dest_mesogeios_synkrasis: "Мезогейос Синкрасис" #NT!
 nd_rom_byz_dest_mesogeios_synkrasis_desc: "Средиземноморье спаяно в одну космополитическую экономику. Кипр и Смирна становятся совместными греко-итальянскими имперскими перевалочными пунктами. Глобальная торговля распространяется через порты империи. Требуется #bold владение Никосией (Кипр) и Смирной, поддержка глобальной торговли, 2000 золота, 5500 развития#!.." #NT!
 nd_rom_byz_dest_romaiosyne_pleroma: "Ромеозиновая Плерома" #NT!
 nd_rom_byz_dest_romaiosyne_pleroma_desc: "Осуществляется греко-римская полнота. Трапезунд (последний остаток комнатнианцев), Антиохия (третий престол пентархии) и Фамагуста (великий левантийский перевалочный пункт) снова присоединяются к империи. Цивилизация термоядерного синтеза является целостной. Открывает #bold Двуязычную Академию#!.. Требуется #bold владения Трапезундом, Антиохией и Фамагустой, 3000 золота, 75 престижа, 7000 развития#!.." #NT!
  
  # ===== DESTINY EVENTS ===== 
  
 nd_rom_byz.7.t: "Имперская судьба" #NT!
 nd_rom_byz.7.d: "Базилевс гуляет по Форуму на рассвете в одиночестве, прежде чем начнутся ежедневные церемонии. Август и Константин тоже гуляли здесь. То же самое сделали Юлиан, который пытался отменить христианизацию, и Теодорих, который правил как римлянин, не будучи таковым, и Юстиниан, чье завоевание рухнуло через поколение после его смерти.\n\nКакой должна быть эта империя? Выбор, который мы сделали в день образования, сейчас находит отклик во всех сферах: в армии, в чеканке монет, в канцелярии, в церкви. Судьба империи теперь должна быть воплощена в законах, кирпичах и договорах, прежде чем следующее поколение привыкнет к ее форме.\n\nОткрывается вкладка «Традиции». Впереди три этапа избранного пути. Выбирайте хорошо; Империя наблюдает." #NT!
 nd_rom_byz.7.a: "Оно начинается." #NT!
  
 nd_rom_byz.8.t: "Орел летит на запад" #NT!
 nd_rom_byz.8.d: "Старый дворец Карла Великого в Аахене, где Отто III когда-то мечтал восстановить Римскую империю и где был коронован Фридрих Барбаросса, теперь в течение сезона принимает императорский двор. Его восстановление символично: Романитас Запада, неразрывная нить Каролингов и Оттонов, снова втянулась в римскую империю, о продолжении которой она всегда утверждала.\n\nВ Тулузе сенешаль южных маршей получает императорское поручение. Лангедок, долгое время оспаривавшийся между Францией и Арагоном, теперь подчиняется римскому праву. Классическое изучение латинского языка является официальной программой империи. У Возрождения снова появился римский покровитель.\n\nЛатинская империя начала свой марш на запад." #NT!
 nd_rom_byz.8.a: "Per Aspera ad Astra." #NT!
  
 nd_rom_byz.9.t: "Согласие с Папой" #NT!
 nd_rom_byz.9.d: "Католические короли пришли к соглашению. Короли Франции подчиняются в Реймсе, где были помазаны их предшественники; король Кастилии передает Толедо, первопрестольный престол, в имперское общение. Посттридентское соглашение таково: католик по вере, римлянин по послушанию.\n\nНо отношения между императором и папой теперь должны быть определены на века. Некоторые при дворе, представители старой итальянской школы канонистов, настаивают на подлинном конкордате: Папа как суверенный канцлер веры, его моральный авторитет сохраняется как дипломатический актив. Другие, греческая и реформистская фракция, настаивают на создании имперской курии: кардиналы как имперские чиновники, папа как старший епископ, подчиненный императорскому трону." #NT!
 nd_rom_byz.9.a: "Пакс Империалис. Папа правит; правит император." #NT!
 nd_rom_byz.9.b: "Курия Империалис. Папа служит Империуму." #NT!
  
 nd_rom_byz.10.t: "Империум Синус Файн" #NT!
 nd_rom_byz.10.d: "Лиссабон, западная конечная точка Иберии, наконец преклоняет колени. Кордова, старая резиденция халифа, возвращается к христианско-имперскому обществу. Тунис, наследник Карфагена, присоединяется к римскому владычеству, которое древний Рим не мог удерживать долго. Западный бассейн Средиземноморья снова стал Mare Nostrum. От Геркулесовых столбов до Босфора каждое побережье платит имперские пошлины. Судьба Romanitas Vincit исполнена.\n\nКакой характер будет иметь этот последний триумф? Члены совета императора раскололись. Военная фракция хочет, чтобы сам Империум увековечился как военное предприятие: восхождение западного орла, завоевание как постоянный режим империи. Дипломатическая фракция призывает к согласию: католической ойкумене согласных королей, империю как моральному арбитру, а не вечному завоевателю." #NT!
 nd_rom_byz.10.a: "Аквила Западная. Завоевание – наша судьба." #NT!
 nd_rom_byz.10.b: "Конкордия Орбис. Католическая ойкумена в мире." #NT!
  
 nd_rom_byz.11.t: "Эгейское возвращение" #NT!
 nd_rom_byz.11.d: "Акрополь снова наш. Каталонская компания, тогда Флорентийская Аччайоли, управляла Афинами полтора столетия; теперь орел снова летает над собором Парфенона. Кандия, великая венецианская крепость на Крите, сдалась со всеми своими галерами и архивами.\n\nНаследники Гемистоса Плетона читают лекции одновременно в Studium Graecum и в афинских школах. Греческие и итальянские ученые конкурируют за кафедры в одной и той же имперской университетской системе. Гуманизм эпохи Возрождения, питаемый одновременно классическими греческими рукописями и изучением итальянской латыни, является официальной культурной программой империи.\n\nПуть Hellenikos Romaios показывает свои первые плоды." #NT!
 nd_rom_byz.11.a: "Ромайос каи Хеллен, хама." #NT!
  
 nd_rom_byz.12.t: "Средиземноморский Космополис" #NT!
 nd_rom_byz.12.d: "Фамагуста и Никосия, крупные порты Лузиньянов на Кипре, были включены в имперскую систему. Смирна, за которую на протяжении столетия боролись турки-айдыны, госпитальеры и генуэзцы, теперь развевается под имперским знаменем. Греческие и итальянские купцы делят склады; их бухгалтеры работают в двойных бухгалтерских книгах; их капитаны проводят оба обряда в святилищах своих кают.\n\nЭто момент выбора. Космополитическое видение можно реализовать как торговый койнон: империя как великий общий торговый центр, каждая гавань — открытый порт, греко-итальянский торговый союз, направляющий богатство в имперский бюджет. Или его можно рассматривать как талассократию: имперское военно-морское мастерство как предпосылка космополиса, галеры как гаранты Средиземноморья, ставшие безопасными благодаря имперскому владычеству." #NT!
 nd_rom_byz.12.a: "Эмпорион Койнон. Обычный торговый центр." #NT!
 nd_rom_byz.12.b: "Талассократия. Морское правило как основа всего." #NT!
  
 nd_rom_byz.13.t: "Ромеозиновая Плерома" #NT!
 nd_rom_byz.13.d: "Трапезунд, последний остаток Комнинов, империя в изгнании, пережившая Константинополь, воссоединилась со своей матерью. Антиохия, третий престол апостольской пентархии, возвращается в лоно империи после семи веков правления крестоносцев, мамлюков и монголов. Фамагуста становится великой расчетной палатой левантийской торговли, наполовину греческой по языку, наполовину итальянской по бухгалтерской книге.\n\nРеализуется греко-римская полнота. Империя — это то, о чем мечтал Юстиниан, но не мог достичь: единая империя, охватывающая латынь и греческий язык, Италию, Анатолию и Сирию, двуязычную цивилизацию, являющуюся наследницей как Августа, так и Константина.\n\nИмперский совет спрашивает, как увенчать эту кульминацию. Литературная фракция предлагает Полис Ойкумену: Константинополь и Рим, совместно возведенные как космополитические столицы, модели обитаемого мира. Церковная фракция предлагает Восстановленную Пентархию: пять древних патриархатов воссоединились под имперским общением, христианский Восток воссоединился как одно тело." #NT!
 nd_rom_byz.13.a: "Полис Ойкумена. Космополитический полис." #NT!
 nd_rom_byz.13.b: "Пентархия восстановлена. Пять епархий, одна церковь." #NT!
  
  # ===== DESTINY TIMED MODIFIERS ===== 
  
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pax_imperialis: "Пакс Империалис" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pax_imperialis: "Папа управляет душами, император управляет королевствами; двух вместе достаточно. Латинско-христианский мир признает имперский меч временным оружием вселенской церкви. Капитаны-наемники прибывают дешевле, поставки расширяются, имперский боевой дух быстро восстанавливается после любого упадка." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_curia_imperialis: "Курия Империалис" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_curia_imperialis: "Кардиналы становятся имперскими офицерами. Папская курия включена в имперскую государственную службу. Дипломаты разъезжаются по католической Европе, неся приказы императора, а религиозные войны ведутся с эффективностью кардинала-легата." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_aquila_occidentis: "Аквила Западная" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_aquila_occidentis: "Западный орел восходящий. Имперские армии действуют с классической римской тактической дисциплиной; осадные поезда взломают любую католическую крепость; война объявляется с имперской легкостью. Цена денежная: безжалостные завоевания переливают награбленные слитки в казну, а монеты обесцениваются под этим напряжением." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_concordia_orbis: "Конкордия Орбис" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_concordia_orbis: "Католическая ойкумена королевств держится вместе как мирное согласие под имперским арбитражем. Сословия удовлетворяются имперским управлением; провинциальное процветание растет; новые полки формируются быстро по вызову." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_emporion_koinon: "Эмпорион Койнон" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_emporion_koinon: "Империя становится великим общим торговым центром. Греческие и итальянские торговые дома действуют как одно целое. Внутренние торговые пути переполнены двуязычными факторами и совместными бухгалтерскими книгами; торговый потенциал растет; влияние и процветание бюргерского поместья возрастает." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_thalassokratia: "Талассократия" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_thalassokratia: "Морское правило. Единый имперский флот превращает Средиземное море в римское озеро. Преобладают морские бои, флоты действуют дешевле, корсарские убежища Магриба увядают. Сухопутная армия, лишенная приоритета в пользу галер, требует большего содержания для поддержания своих стандартов." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_polis_oikoumene: "Полис Ойкумена" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_polis_oikoumene: "Космополитический полис как имперская столица. Рим и Константинополь становятся центрами-близнецами обитаемого мира, собирая ученых, ремесленников и знатных людей всех наций. Максимальный потолок грамотности повышается, дворянское сословие процветает на имперской службе, опустошенные провинции быстро восстанавливаются под имперским покровительством." #NT!
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pentarchia_restored: "Пентархия восстановлена" #NT!
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pentarchia_restored: "Восстановлены пять древних патриархатов: Рим, Константинополь, Александрия, Антиохия и Иерусалим, воссоединившиеся под имперским общением. Христианский Восток воссоединяется. Имперские полки опираются на более глубокие традиции военной святости; штурмовые группы наступают с апостольским рвением; содержание крепостей на единой церковной территории обходится дешевле." #NT!
  
  # ===== DESTINY BUILDINGS ===== 
  
 nd_rom_byz_templum_pontificis: "Templum Pontificis Maximi" #NT!
 nd_rom_byz_templum_pontificis_desc: "Великая базилика-дворец Латинской империи. Построенный на базе римских форумов и более старых константинских базилик, он объединяет курию Цезаря и кафедру Великого Понтифика в один священно-гражданский комплекс. Здесь император коронует себя, председательствует на синодах и является третейским судьей между католическими королевствами. Монументальное воплощение Романитас Винчит." #NT!
 nd_rom_byz_templum_upkeep: "Содержание Темплума" #NT!
 nd_rom_byz_templum_upkeep_desc: "Мрамор для бесконечных внутренних украшений, золото для императорских реликвариев, тонкая ткань для облачений, пчелиный воск для свечей и ладан для ежедневных литургий в рамках совместного латинского и греческого обряда." #NT!
  
 nd_rom_byz_akademia_bilingualis: "Академия двуязычия" #NT!
 nd_rom_byz_akademia_bilingualis_desc: "Императорская академия эрудитов судьбы Элленикоса Ромая. Греческие и итальянские ученые делят кафедры; математика преподается параллельно с диофантовой и виетановой системой обозначений; медицина, астрономия, гражданское право и теология преподаются на двух языках. Выпускники укомплектовывают канцелярии империи и дипломатические посты по всему обитаемому миру." #NT!
 nd_rom_byz_akademia_upkeep: "Содержание Академии" #NT!
 nd_rom_byz_akademia_upkeep_desc: "Бумага, книги, свечи из пчелиного воска и ткань для академического облачения поддерживают ежедневное обучение в академии. Стекло для линз и лабораторных работ поддерживает новую натурфилософию." #NT!
  
  # ===== BUREAUCRACIES ===== 
  # Six historically-grounded toggleable institutions of the BYZ-Italian 
  # Roman restoration. Auto-modifier grants 3 slots; capital adds 1 = 4 
  # effective. Player picks 4 of 6. 
  
 rom_byz_senatus_bilinguis_bureaucracy: "Сенат двуязычный реститутус" #NT!
 rom_byz_senatus_bilinguis_bureaucracy_desc: "После 1453 года единственным двором, ведущим дела как на латыни, так и на греческом языке, была имперская канцелярия в изгнании: Ватиканское бюро переводов Георгия Трапезундского и римский дом Виссариона. Восстановлено императорское достоинство, все указы издаются на двух языках, и посольства принимаются на обоих языках. В то время как Senatus Romanus Renovatus 1144 года, исповедовавший только латынь, был гражданской коммуной, это ее двуязычный имперский преемник: канцелярия, чье должностное достоинство основывается на владении обоими языками romanitas." #NT!
  
 rom_byz_schola_graecorum_bureaucracy: "Schola Graecorum Romae" #NT!
 rom_byz_schola_graecorum_bureaucracy_desc: "Палаццо Бессариона на Квиринале (1450-1472 гг.) было де-факто греческой академией Италии, приютившей Теодора Газу, Иоанна Аргиропулоса, Георгия Трапезундского и Януса Ласкариса. Его библиотека, состоящая из 482 греческих и 264 латинских рукописей, легла в основу венецианской Библиотеки Марцианы в 1468 году. При восстановленном базилевсе класс ученых больше не является частным покровителем, а является имперским институтом: получающие стипендию кафедры с обязательством императорской службы, постосманский ответ на то, чем стали фанариоты при султане." #NT!
  
 rom_byz_collegium_italograecum_bureaucracy: "Коллегиум Италогрекум" #NT!
 rom_byz_collegium_italograecum_bureaucracy_desc: "Общины греческого обряда Калабрии, Апулии и Сицилии (грико, греканичи и итало-албанский арбереш, присоединившиеся к ним после 1448 года) сохранили византийскую литургию и греческий язык до наших дней, несмотря на норманнское завоевание 1071 года. их при дворе, гарантирует греческий обряд там, где он сохраняется, и направляет лояльность деревень Меццоджорно трону, а не латинским митрополитам." #NT!
  
 rom_byz_commissio_filioque_bureaucracy: "Комиссия Филиокве" #NT!
 rom_byz_commissio_filioque_bureaucracy_desc: "На Флорентийском соборе 1439 года, после девяти заседаний по «Филиокве», речь Виссариона 13–14 апреля убедила греческую делегацию в том, что греческие и латинские отцы преподавали одно и то же учение, но разными словами; Декрет о союзе Laetentur Caeli был подписан 6 июля. Отвергнутый в Константинополе в 1484 году, он сохранился здесь как постоянный институт: постоянная комиссия латинских канонистов и греческих иеромонахов согласовывает доктринальные формулировки, слушает апелляции и удостоверяет законность учения обоих обрядов." #NT!
  
 rom_byz_magisterium_maris_bureaucracy: "Магистериум Марис Ностри" #NT!
 rom_byz_magisterium_maris_bureaucracy_desc: "Венецианский арсенал (основанный около 1104 г.) и генуэзский арсенал создали самую сложную военно-промышленную администрацию средневекового Средиземноморья: постоянные коллегии, Provveditori all'Armar и Colleggio della Milizia da Mar, контролирующие снабжение продовольствием, набор экипажей, призовые суды и морскую таможню по всей торговой империи. Слившись с сохранившейся византийской традицией корпуса дромонов и ставшей имперской, это постоянная инспекция Mare Nostrum над городами-государствами, взимающая пошлины на море и сертифицирующая каждого капитана, несущего имперский штандарт." #NT!
  
 rom_byz_aula_phoenicea_bureaucracy: "Аула Финикия" #NT!
 rom_byz_aula_phoenicea_bureaucracy_desc: "После 1453 года дом басилевса выжил в изгнании: евнухи опочивальни, протовестиарии, паракойменос, имперские врачи, константинопольская аристократия-беженка, примкнувшая к двору Палеологов. Восстановленный, этот двор становится внутренним двором, преданным непосредственно личности императора, параллельно и выше итальянского баронажа и римской курии: аппарата, укомплектованного греками, превосходство которого латинская знать не может оспорить. Феникс — палеологовский символ реставрации: так называет себя институт." #NT!
  
  # ===== AUTO-MODIFIER (slot grant on formation) ===== 
 AUTO_MODIFIER_NAME_nd_rom_byz_bureaucracy_authority: "Империум Двуязычный" #NT!
 AUTO_MODIFIER_DESC_nd_rom_byz_bureaucracy_authority: "При формировании BYZ-итальянско-римской реставрации [ROOT.GetName] получает институциональные полномочия принимать у себя историческую бюрократию латино-греческой империи." #NT!
