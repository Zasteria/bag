l_russian:
 MRL: "Махарлика" #NT!
 MRL_ADJ: "Махарликан" #NT!
 MRL_f: "Махарлика" #NT!
 MRL_f_desc: "Махарлики были классом воинов-дворян в тагальском обществе, свободными людьми, которые носили оружие рядом со своими дату и раджами. Их родственники, тимава Висайских островов, магину прибрежных государств Лусона и багани Минданао, составляли военную основу каждого филиппинского народа от Апарри до Сулу. Махарлика — это панархипелаговая нация, которой история так и не создала: единое коренное государство, связывающее Лусон, Висайские острова и Минданао под идеалом свободного человека, прежде чем испанские галеоны смогли когда-либо достичь Себу. Сформируйте Махарлику, чтобы создать филиппинскую цивилизацию, которая вытеснила или просто пережила все европейские, голландские и брунейские вторжения." #NT!
