l_russian:
 CSO_f: "Песня" #NT!
 CSO_f_desc: "Династия Сун олицетворяла коммерческий и технологический золотой век Китая. Хотя Южная Сун уступила северные равнины чжурчжэням Цзинь, они построили непревзойденную морскую торговую экономику с центром в дельте Янцзы и великом порту Ханчжоу. Восстановление Сун означает отказ от континентальной империи в пользу компактного, процветающего государства, основанного на торговле, инновациях и военно-морской мощи." #NT!
