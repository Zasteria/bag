l_russian:
 BNH: "Бет Нахрейн" #NT!
 BNH_ADJ: "Нахрейн" #NT!
 BNH_f: "Бет Нахрейн" #NT!
 BNH_f_desc: "Бет Нахрейн («Земля между реками» на сирийском языке) восстанавливает Месопотамию под властью христианских наследников Ниневии и Эдессы. Патриархи Церкви Востока до сих пор управляют диаспорой от Тигра до Китая; монастыри Тур Абдин пережили монгольских, мамлюкских и туркменских правителей, сохранив свою автономию; Графство Эдесса доказало, что латино-сирийское государство может удерживать верхнюю Джазиру. Формирование Бет Нахрайн объединяет эти нити в единое христианское государство, говорящее на арамейском языке, с центром в Мосуле, древней резиденции Патриархата, с Тур Абдином и Эдессой в качестве его духовных легких." #NT!
