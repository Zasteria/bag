 nd_danube.29.t: "Prague Declares"
 nd_danube.29.d.union: "The Bohemian court has declared for the union cause: its weight now feeds the dream of one house over the river."
 nd_danube.29.d.liberty: "The Bohemian court has declared for the old liberties: its weight now holds the crowns apart."
 nd_danube.29.a: "Noted."
 nd_danube.29.a_tt: "Bohemia's standing feeds its declared cause monthly."
 nd_danube.30.t: "Murmurs in the Court"
 nd_danube.30.d: "The union question never quite sleeps. This season it is a genealogist with a convenient chart, a magnate faction drinking to 'one river, one crown', a pamphlet against foreign masters nailed to a church door. Small things; but diets are moved by small things."
 nd_danube.30.a: "Let the marriage party speak."
 nd_danube.30.b: "Silence the union talk."

