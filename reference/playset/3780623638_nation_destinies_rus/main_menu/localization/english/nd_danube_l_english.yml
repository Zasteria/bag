 nd_dnb_cause_union_label: "The Union Cause"
 nd_dnb_cause_liberty_label: "The Old Liberties"
 nd_dnb_cause_explain_tt: "#T The causes#!\nEach declared crown feeds its cause in proportion to its standing; the Menace at the Gates feeds the Union Cause; an untended cause slowly fades. Diets hand the leading cause a #Y +10#! surge.\n\n@arrow_bonus_tier_1! At #Y 50#!, a cause sways the chanceries: pact offers land #G warmer#! under the union zeitgeist, #R colder#! under the liberties.\n@arrow_bonus_tier_2! The #bold Old Liberties#! at #Y 100#! close the question: the Separate Ways.\n@arrow_bonus_tier_2! The #bold Union Cause#! at #Y 100#! convenes the #bold Congress of the Danube#!: its strongest backer is acclaimed, gains the claim on every free rival crown, and every pact of the acclaimed rises to the betrothal compact."
 nd_dnb_panel_levers_header: "Instruments of the Question"
 nd_dnb_panel_levers_body: "#T On the other crowns#!\n@arrow_bonus_tier_2! #bold Propose the Erbverbruederung#!: deepen the pact one degree.\n@arrow_bonus_tier_2! #bold Court the Diet#!: gold now, warmer benches for ten years.\n@arrow_bonus_tier_2! #bold Seal the Double Betrothal#!: press a stumble at compact tier.\n@arrow_bonus_tier_2! #bold Contest the Foreign Crown#!: the claim against an outside master.\n\n#T At home#!\n@arrow_bonus_tier_2! #bold Back the Union#! or #bold stand for the Old Liberties#!, at will.\n@arrow_bonus_tier_2! #bold Honor the League#!: join a pact partner's defense against the Ottomans.\n@arrow_bonus_tier_2! #bold Convene the Diet#! while your side is ahead.\n@arrow_bonus_tier_2! #bold Renounce the Question#! from dominance.\n\n#T When a throne stumbles#!\n@arrow_bonus_tier_1! The wedding of the thrones, or the claim: pact tier #Y 3#! (#Y 2#! with a betrothal) and standing #Y 60#!."
