l_korean:
 # 가치관 툴팁 제목 — 바닐라 한국어가 폐기된 스코프(SocietalValueItem)를
 # 참조하고 있어 SocietalValue 로 고친다.
 TO_MOVE_FURTHER_TO_LEFT: "[SocietalValue.GetLeftLabelWithNoTooltip](으)로 추가 이동:"
 TO_MOVE_FURTHER_TO_RIGHT: "[SocietalValue.GetRightLabelWithNoTooltip](으)로 추가 이동:"

 # --- 해금 전 특권 추천 차단: 해금한 나라에만 보여 줄 실제 문구 ---
 # GLORP_UI_SVH_* 키 자체는 glorpui_generated_societal_value_hints_l_korean.yml
 # 안에서 [Player.Custom('kfix_svh_gate_*')] 로 바꿔 두었다. 같은 키를 두 파일에
 # 중복 정의하면 어느 쪽이 이길지 불확실해서 한 곳에만 둔다.
 # 게이트 정의: in_game/common/customizable_localization/zzz_kfix_svh_unlock_gate.txt
 kfix_svh_line_peasants_yeomanry: "@hint! #TOOLTIP:ESTATE_PRIVILEGE,peasants_yeomanry #L $peasants_yeomanry$#!#! 부여: #color_green +0.10#!\n"
 kfix_svh_line_jaysh_armies: "@hint! #TOOLTIP:ESTATE_PRIVILEGE,jaysh_armies #L $jaysh_armies$#!#! 부여: #color_green +0.10#!\n"
 kfix_svh_line_ghazi_privilege: "@hint! #TOOLTIP:ESTATE_PRIVILEGE,ghazi_privilege #L $ghazi_privilege$#!#! 부여: #color_green +0.05#!\n"
