l_french:
 KHL: "le Califat"
 KHL_ADJ: "Califan"
 KHL_f: "le Califat"
 KHL_f_desc: "Le Khilafah sunnite universel, restauré après un millénaire de fragmentation dynastique. D’al-Andalus au Sind, de l’Atlas à l’Indus, un calife commande la Oumma ; La Mecque, Médine, Le Caire, Damas, Bagdad et les sièges des anciens mondes omeyyade et abbasside répondent à un trône unique. Il ne s’agit pas du califat d’une quelconque dynastie, omeyyade, abbasside, fatimide, almohade ou ottomane, mais de l’idéal de Rashidun incarné : la communauté universelle des croyants sous une seule bannière. L’étendard noir du Prophète flotte à nouveau sur un monde uni dans la foi."
