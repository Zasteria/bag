 PNT: "Pintados"
 PNT_ADJ: "Pintados"
 PNT_f: "Confédération des Pintados"
 PNT_f_desc: "Lorsque les aristocrates guerriers de Panay, Cebu, Samar, Leyte, Bohol et Negros mettent de côté leurs querelles et se fédèrent, les hommes peints des îles s'élèvent comme une seule civilisation. Liés par l'encre de leurs tatouages ​​sur tout le corps, les prières de leurs prêtresses babaylan et les longues coques balangay qui transportent leurs flottes de raid à travers les mers intérieures, les datus rassemblent leur honneur sous une seule bannière confédérée : Kabisay-an, les Pintados, les peints de légende. Les Espagnols qui les nomment ainsi ne trouveront pas de chefferies dispersées à séparer, mais une nation guerrière maritime forgée à partir du sang partagé de chaque île Visayan."
