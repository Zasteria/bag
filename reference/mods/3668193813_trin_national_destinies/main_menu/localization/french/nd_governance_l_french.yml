l_french:

 # Shared National Destinies marker variable (set in every formation event).
 # One key covers all formables; tooltip text for the hidden set_variable.
 nd_formed_tt: "Un destin national s’est accompli"

 # === Governance advances ===
 nd_provincial_governance: "Gouvernance provinciale"
 nd_provincial_governance_desc: "Déléguez l’administration des provinces intérieures éloignées à des domaines dotés d’un personnel noble. Débloque la bureaucratie de la gouvernance provinciale, qui permet la construction d'un domaine provincial."
 nd_maritime_governance: "Gouvernance maritime"
 nd_maritime_governance_desc: "Étendre l'autorité royale sur l'eau jusqu'aux ports d'outre-mer par l'intermédiaire d'officiers portuaires nommés. Débloque la bureaucratie de la gouvernance maritime, qui permet la construction d'une commanderie portuaire."

 # === Governance bureaucracies ===
 nd_provincial_governance_bureaucracy: "Gouvernance provinciale"
 nd_provincial_governance_bureaucracy_desc: "Les domaines provinciaux dotés d'un personnel noble administrent l'intérieur lointain au nom de la couronne, permettant ainsi la construction d'un domaine provincial. Correctement financées, les provinces restent sous contrôle ; Affamée de ressources, la noblesse laisse l'intérieur lâcher prise : le contrôle rural s'effondre, le séparatisme déferle et la rébellion s'envenime."
 nd_maritime_governance_bureaucracy: "Gouvernance maritime"
 nd_maritime_governance_bureaucracy_desc: "Les commanderies portuaires projettent l'autorité royale sur l'eau jusqu'aux ports d'outre-mer, permettant ainsi la construction d'une commanderie portuaire. Bien entretenus, ils enrichissent le trésor et équipent la flotte ; laissés sous-financés, les gouverneurs des ports se transforment en contrebandiers et pirates, les côtes deviennent ingouvernables et le commerce saigne."
