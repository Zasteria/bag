l_french:
 nd_dah_ghezo_reforms: "Les réformes de Ghezo"
 nd_dah_ghezo_reforms_desc: "Le roi Ghezo a transformé le Dahomey d'un affluent de l'empire d'Oyo en une formidable puissance militaire. Il a formalisé les guerrières Agojie en un régiment permanent de milliers de personnes, a professionnalisé l'armée avec des techniques d'exercices européennes et a réorganisé la gouvernance provinciale sous la direction de gouverneurs militaires tournants qui servaient au gré du roi."
 nd_dah_palm_oil_economy: "Transition vers l’huile de palme"
 nd_dah_palm_oil_economy_desc: "Alors que la pression britannique mettait fin à la traite des esclaves à l'étranger, le Dahomey se tourna vers les exportations d'huile de palme sous la direction de Ghezo. Les travailleurs réduits en esclavage ont été redirigés vers les plantations de palmiers plutôt que vendus à l'étranger. Dans les années 1850, l'huile de palme était devenue la principale exportation légitime du Dahomey, même si elle n'a jamais complètement remplacé l'ampleur fiscale de l'économie esclavagiste."
 nd_dah_xwetanu_ceremonies: "Douanes annuelles"
 nd_dah_xwetanu_ceremonies_desc: "Le Xwetanu, coutume annuelle du Dahomey, était l'institution cérémonielle la plus importante du royaume. Ce festival d'une durée d'une semaine combinait vénération des ancêtres, revues militaires, conseils politiques, foires commerciales et redistribution des richesses. C'était l'arène où le roi montrait son pouvoir, résolvait les conflits entre factions et établissait la politique pour l'année à venir."
 nd_dah_abomey_artisans: "Tradition artisanale d'Abomey"
 nd_dah_abomey_artisans_desc: "Les Palais Royaux d'Abomey abritaient une tradition artistique remarquable. Les artisans du palais ont créé des bas-reliefs en argile polychrome commémorant le règne de chaque roi, des appliques textiles élaborées représentant les victoires militaires et des figures de bocio en bois sculptées imprégnées de pouvoir spirituel. Le palais de chaque roi s'ajoute à une chronique architecturale de 200 ans de la civilisation Fon."
 nd_dah_behanzin_resistance: "La Résistance de Béhanzin"
 nd_dah_behanzin_resistance_desc: "Le roi Behanzin, dernier dirigeant indépendant du Dahomey, a reconnu la menace existentielle du colonialisme européen et a préparé son royaume à la guerre. Il a tenté de fabriquer des armes à feu localement, a entraîné ses forces aux tactiques modernes et a mené deux guerres contre la France en 1890 et 1892. Malgré une résistance acharnée, seuls 17 des 434 Agojie ont survécu à la bataille finale. Le Dahomey est tombé aux mains des forces coloniales françaises en 1894."
 a_nd_dah_agojie_veterans: "Anciens combattants d'Agojie"
 a_nd_dah_agojie_veterans_desc: "Le régiment officiel d'Agojie sous Ghezo comptait jusqu'à 6 000 femmes, soit environ un tiers de l'armée totale du Dahomey. Rigoureusement entraînés à l'endurance à la douleur, à la vitesse et au combat rapproché, ils étaient organisés en sous-unités spécialisées : chasseresses, carabinières, faucheurs, archers et artilleurs. Les observateurs européens les ont toujours jugés supérieurs à leurs homologues masculins en termes d'efficacité et de courage."
 a_nd_dah_fon_riflemen: "Fusiliers Fon"
 a_nd_dah_fon_riflemen_desc: "L'infanterie modernisée de Behanzin, armée de fusils européens importés et entraînée aux techniques de tir de contre-marche. Au cours des guerres franco-dahoméennes, ces soldats ont combattu avec un courage désespéré contre un ennemi technologiquement supérieur, utilisant leur connaissance du terrain local pour monter des embuscades et harceler des retraites à travers la forêt dense et la jungle."
 nd_dah_palm_oil_works: "Travaux d'huile de palme"
 nd_dah_palm_oil_works_desc: "Installations de transformation pour l’extraction et la préparation d’huile de palme destinée à l’exportation. Sous la direction de Ghezo, l'économie du Dahomey est passée de la traite des esclaves à la production d'huile de palme, les anciens captifs étant redirigés vers les plantations de palmiers qui alimentaient ces ateliers."
 nd_dah_palm_oil_processing: "Traitement de l'huile de palme"
 nd_dah_palm_oil_processing_desc: "Extrait l'huile des amandes de palmier pour l'exporter vers les marchés européens comme lubrifiant industriel et ingrédient de savon."
 nd_dah_royal_atelier: "Atelier d'Artisanat Royal"
 nd_dah_royal_atelier_desc: "Atelier rattaché au complexe du palais royal où des maîtres artisans produisent des panneaux de bas-relief distinctifs, des textiles appliqués et des figures sculptées qui racontent l'histoire du Dahomey et glorifient le règne de chaque roi."
 nd_dah_bas_relief_craft: "Artisanat de bas-relief"
 nd_dah_bas_relief_craft_desc: "Les artisans travaillent l'argile des fourmilières pour en faire des bas-reliefs polychromes, pressant des colorants pigmentaires minéraux et des fragments de poterie cuite sur des surfaces humides pour créer les panneaux vifs qui ornent les murs des palais royaux d'Abomey."
 levy_nd_dah_fon_riflemen: "Prélèvement des carabiniers Fon"
 levy_nd_dah_fon_riflemen_desc: "Infanterie Fon mobilisée armée de fusils de type européen, issue des populations paysannes et militaires pour défendre le royaume."
 STATIC_MODIFIER_NAME_nd_dah_standing_army: "Armée permanente du Dahomey"
 STATIC_MODIFIER_DESC_nd_dah_standing_army: "La professionnalisation par Ghezo de l'armée du Dahomey a créé l'une des forces combattantes les plus redoutables d'Afrique de l'Ouest, avec des régiments permanents entraînés aux techniques européennes et le légendaire Agojie en son centre."
 STATIC_MODIFIER_NAME_nd_dah_royal_monopoly: "Monopole commercial royal"
 STATIC_MODIFIER_DESC_nd_dah_royal_monopoly: "La couronne dahoméenne exerçait un contrôle quasi total sur le commerce extérieur, le Yovogan (vice-roi de Whydah) gérant toutes les transactions avec les marchands européens et veillant à ce que le royaume tire le maximum de valeur de ses exportations."
 nd_dah.1.t: "La transformation du Dahomey"
 nd_dah.1.d: "King Ghezo has overthrown his predecessor Adandozan with the help of the Brazilian slave trader Francisco Felix de Sousa, ending Dahomey's humiliating tribute to the Oyo Empire. The new king faces a choice that will define a generation: pour the kingdom's resources into building the most professional army in West Africa, or tighten the crown's grip on trade to build an economic powerhouse that can sustain Dahomey's independence through wealth rather than war alone.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dah.1.a: "Forgez l'Agojie pour en faire une épée incassable"
 nd_dah.1.b: "Le Yovogan contrôlera tous les cauris qui traversent Whydah"
 nd_dah.2.t: "Le Lion du Dahomey"
 nd_dah.2.d: "Le roi Béhanzin, « le requin qui troublait le bar », a accédé au trône du Dahomey et a immédiatement reconnu la menace mortelle que représentaient les ambitions coloniales françaises. Contrairement à ses prédécesseurs qui pouvaient monter les puissances européennes les unes contre les autres, Béhanzin fait face à une France déterminée à conquérir. Il a ordonné la construction d'ateliers d'armement locaux, l'entraînement de ses forces aux tactiques de tir modernes et la fortification des abords d'Abomey. Les Agojie, désormais armés de fusils à répétition, s'entraînent avec une férocité née de la certitude que cela pourrait être la dernière guerre du Dahomey. Lorsque les Français entreront enfin en force en 1892, les soldats de Béhanzin combattront avec un courage extraordinaire, mais les 200 ans d'indépendance du royaume se termineront dans la fumée de l'artillerie."
 nd_dah.2.a: "Le Dahomey ne s'agenouillera pas"
 nd_dah_formed_tt: "Le Dahomey a été formé"
 nd_dah_path_a_tt: "Choisissez l’Armée permanente du Dahomey"
 nd_dah_path_b_tt: "Choisissez le monopole royal du commerce"
 AUTO_MODIFIER_NAME_nd_dah_bureaucracy_authority: "Bureau Bureaucratique du Dahomey"
 AUTO_MODIFIER_DESC_nd_dah_bureaucracy_authority: "Lors de sa formation, le royaume se voit doté du cadre d'une fonction administrative permanente. Combiné avec le conseil permanent d'Abomey, cela ouvre trois créneaux dans lesquels les Ahosu peuvent installer les institutions historiques de gouvernance Fon."
 dah_migan_mehu_bureaucracy: "Migan et Méhu"
 dah_migan_mehu_bureaucracy_desc: "Les Ahosu du Dahomey gouvernaient par l'intermédiaire de deux ministres suprêmes délibérément issus de lignées non royales : le Migan, bourreau en chef et premier ministre, qui s'occupait de la justice et de la sécurité intérieure, et le Mehu, contrôleur de la maison royale, qui gérait les finances et le commerce extérieur. Houegbadja a institutionnalisé ce couple à la fin du XVIIe siècle, et en dessous se trouvaient des officiers de moindre importance : le Yovogan à Whydah, le Sogan aux écuries royales, le Tokpo à l'agriculture. Sous Ghezo (r.1818-1858), le duumvirat devint le moteur du redressement militaro-fiscal du Dahomey sur le tribut d'Oyo."
 dah_yovogan_whydah_bureaucracy: "Yovogan de Whydah"
 dah_yovogan_whydah_bureaucracy_desc: "Après qu'Agaja ait conquis le royaume de Whydah en 1727, le Dahomey a absorbé le port négrier atlantique de Glehue et a nommé un vice-roi royal permanent (​​le Yovogan, littéralement « chef des hommes blancs ») pour gouverner le port et taxer chaque cargaison passant par les usines européennes. Les Yovogan détenaient le monopole de la négociation des prix avec les capitaines européens, prélevaient des droits d'exportation par tête et envoyaient de l'or et des marchandises à Abomey selon un calendrier fixe. Sous Ghezo, le bureau s'est tourné vers l'huile de palme après que les patrouilles anti-esclavagistes britanniques ont fermé le marché aux esclaves de l'Atlantique dans les années 1840."
 dah_agojie_corps_bureaucracy: "Corps Agojie"
 dah_agojie_corps_bureaucracy_desc: "Les Agojie (Mino, « nos mères »), connues des Européens sous le nom d'Amazones du Dahomey, étaient un corps de femmes soldats attachées au palais royal. Originaires sous la reine Hangbe au début du XVIIIe siècle en tant que chasseuses d'éléphants et gardes de palais, ils furent officialisés sous Agaja et élargis sous Ghezo en un régiment permanent d'environ six mille hommes, soit environ un tiers de la force militaire du royaume. Officiellement épouses du roi, elles vivaient à l'intérieur des murs du palais dans des casernes sous la direction de leurs propres officiers féminins et donnaient au trône une force de frappe permanente en dehors de la cavalerie masculine de la noblesse."
 dah_xwetanu_customs_bureaucracy: "Douanes annuelles de Xwetanu"
 dah_xwetanu_customs_bureaucracy_desc: "Le Xwetanu, la coutume annuelle du Dahomey, était un festival d'une semaine organisé chaque saison sèche à Abomey et combinant vénération des ancêtres, revue militaire, assises judiciaires, foire commerciale et redistribution royale des richesses. Les Ahosu distribuèrent personnellement des cauris, des tissus, des captifs et des titres aux chefs et ministres assemblés ; des offrandes étaient faites sur les tombes des rois précédents ; de nouveaux décrets furent proclamés et les différends arbitrés. Sous Ghezo et Glele, la douane durait six semaines et consommait le surplus de l'année entière, et son abolition par les Français en 1894 marqua la fin symbolique du royaume."
 dah_nesuhwe_cult_bureaucracy: "Culte royal de Nesuhwe"
 dah_nesuhwe_cult_bureaucracy_desc: "Le Nesuhwe était le culte des ancêtres royaux déifiés du Dahomey, administré à Abomey sous le Tassinon, grand prêtre des esprits de la lignée royale. Chaque roi décédé entrait dans le panthéon Nesuhwe et recevait des offrandes continues dans son tombeau-sanctuaire ; Les devins Quenum effectuaient des consultations de la Loi sur les affaires royales. Les Nesuhwe se tenaient aux côtés mais distincts du panthéon vodun plus large de Mawu-Lisa, Legba, Sakpata et Hevioso dont les prêtres servaient les roturiers. En faisant des rois eux-mêmes des objets de culte, les Nesuhwe ont intégré le trône directement dans la vie religieuse des Fon."
