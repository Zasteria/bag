 pro_etats_de_provence_town_rights: "エタ・ド・プロヴァンス"
 pro_etats_de_provence_town_rights_desc: "プロヴァンス地方の貴族・聖職者・市民が参加する身分会。三身分の権力を強化し、地方自治と合議制を保証する。"
 pro_marseille_free_port_town_rights: "マルセイユの自由港"
 pro_marseille_free_port_town_rights_desc: "マルセイユを自由港として宣言する。商人の交易権を拡大し、繁栄・人口・市民権力を高める。マルセイユにのみ付与可能。"
