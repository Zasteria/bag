l_japanese:
 teu_crusade_path_reform: "十字軍騎士団の規律"
 teu_crusade_path_reform_desc: "東方十字軍への出発に際し、大団長が全騎士修道士に課した規律の誓い。略奪を秩序ある遠征の手段とし、聖戦の大義のもとに軍を統率する。神権政体を離れれば失効する。"
 teu_northern_crusade_reform: "北方十字軍の完成"
 teu_northern_crusade_reform_desc: "北方十字軍の完成を記念して定められた永続的な統治原理。占領地への略奪を制度化し、略奪から得た富と恐怖で支配を固める。神権政体を離れれば失効する。"
