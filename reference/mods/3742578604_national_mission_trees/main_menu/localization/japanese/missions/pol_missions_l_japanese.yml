l_japanese:
 pol_jagiellonian_dynasty_mission_pack: "ヤギェウォ朝の栄光"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "1337年、ポーランド王国はカジミェシュ3世（大王）の統治下にある。後継者なきカジミェシュの後にはアンジュー家のラヨシュ1世（ハンガリー王）がポーランド王位を継承し、その娘ヤドヴィガがリトアニア大公ヤギェウォと結婚することでポーランド・リトアニア同君連合が誕生する。ドイツ騎士団との北方対立・ハンガリーとの同君連合・リトアニアとの東方拡大・ボヘミアへの野望——全てを実現し、中東欧最大の貴族共和国を建設せよ。"
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "ポーランドとして、内政・東方・北方・南方・西方の全方面で拡大し、ポーランド黄金時代を実現せよ。"
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してポーランドの黄金時代を実現せよ。"
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "カジミェシュ大王からヤギェウォ朝黄金時代へ——貴族の共和国を建設せよ！"

 pol_kingdom_of_poland: "ポーランド王国の基盤"
 pol_kingdom_of_poland_desc: "カジミェシュ3世（大王）は1333年に即位し、ポーランドを分裂状態から統一した。「瓦礫のポーランドを受け取り、石造りのポーランドを残した」と称されるこの王は、クラクフを中心に法典整備・都市建設・ユダヤ人保護政策を推進した。彼の治世はポーランド中世史上最高の繁栄期とされる。正統性と安定度を高め、王国の基盤を固めよ。"
 pol_kingdom_of_poland_tooltip: "正統性50以上、安定度20以上"

 pol_integrate_mazovia: "マゾフシェの統合"
 pol_integrate_mazovia_desc: "マゾフシェ（マゾヴィア）公国はピャスト家の傍系が統治するポーランド中心部の公国だ。ワルシャワとルブリンを掌握し、この肥沃な低地平原をポーランド王国に完全統合することで、中部ポーランドの政治的中心が確立される。1526年に歴史的に統合されるこの地を早期に確保せよ。"
 pol_integrate_mazovia_tooltip: "ワルシャワ（warsaw）とルブリン（lublin）を自国または属国が領有している"

 pol_great_sejm: "大セイム（議会）"
 pol_great_sejm_desc: "ポーランドのセイム（議会）は13世紀から発展してきた身分制議会だ。大貴族（マグナート）・小貴族（シュラフタ）・聖職者が参集するこの議会は、15〜16世紀に黄金の自由（ズロタ・ヴォルノシッチ）の概念を確立し、ポーランドを貴族共和国に変えていく。セイムを強化して王権と貴族権のバランスを整えよ。"
 pol_great_sejm_tooltip: "正統性70以上、貴族身分の満足度0.65以上"

 pol_krakow_renaissance: "クラクフのルネサンス"
 pol_krakow_renaissance_desc: "クラクフはポーランド王国の首都であり、ヤギェウォ大学（ユニヴェルシテット・ヤギェロンスキ）はコペルニクスを輩出した中東欧最高の学府だ。イタリアのルネサンスがクラクフにも波及し、ヴァヴェル城がルネサンス様式で改築された。大学を整備してクラクフを中東欧の知的中心地に育てよ。"
 pol_krakow_renaissance_tooltip: "クラクフ（krakow）に大学が建設され、毎月の威信0.20以上"

 pol_jagiellonian_university: "ヤギェウォ大学の隆盛"
 pol_jagiellonian_university_desc: "1364年にカジミェシュ3世が創設し、1400年にヤドヴィガ女王が復興したヤギェウォ大学は、ニコラウス・コペルニクス（1473〜1543）・ヴィトルト・ルトスワフスキなど多くの偉人を育てた。5か所以上に大学を展開することで、ポーランド全土に学問の光が広まる。"
 pol_jagiellonian_university_tooltip: "大学（university）を5箇所以上保有し、毎月の威信0.30以上"

 pol_polish_golden_age: "ポーランドの黄金時代"
 pol_polish_golden_age_desc: "15〜16世紀のポーランドはヤギェウォ朝のもとで「黄金時代（Złoty Wiek）」を迎えた。コペルニクスの地動説・コハノフスキの詩・クラクフの芸術——ポーランドは政治的大国であるとともに文化的先進国となった。広大な版図・豊かな収入・高い威信でこの黄金時代を証明せよ。"
 pol_polish_golden_age_tooltip: "300以上のロケーションを保有し、月収200以上、威信60以上"

 pol_jadwiga_union: "ヤドヴィガとヤギェウォの婚姻"
 pol_jadwiga_union_desc: "1385年のクレヴォ合意によりポーランド女王ヤドヴィガとリトアニア大公ヤギェウォ（ヴワディスワフ2世ヤギェウォ）の婚姻が決まった。ヤギェウォはキリスト教に改宗し、リトアニアをカトリック化することと引き換えにポーランド王の称号を得た。この婚姻はポーランド・リトアニア連合国家の始まりであり、以後200年以上続くヤギェウォ朝時代の幕開けだ。"
 pol_jadwiga_union_tooltip: "リトアニア（c:LIT）と同君連合か従属国関係にある"

 pol_develop_ruthenia: "ルテニアの開発"
 pol_develop_ruthenia_desc: "ルテニア（赤ルーシ）はウクライナ西部の農業豊かな地域だ。リヴィウ（レンベルク）はガリチア・ヴォルィーニ公国の中心だった都市で、ポーランドが1349年に征服した。ブレスト＝リトフスクはリトアニアとの境界の要衝。この地域を開発することでポーランドの東方支配が確立される。"
 pol_develop_ruthenia_tooltip: "リヴィウ（lviv）とブレスト＝リトフスク（brest_litowsk）を自国または属国が領有している"

 pol_control_kyiv: "キエフの支配"
 pol_control_kyiv_desc: "キエフ（キーウ）はかつてキエフ・ルーシの首都であり、スラヴ文明発祥の地だ。モンゴル帝国による1240年の破壊後、この都市はリトアニア支配下に置かれていた。キエフを掌握することでドニエプル川流域全体の支配権が確立し、黒海への道が開かれる。"
 pol_control_kyiv_tooltip: "キエフ（kyiv）を自国または属国が領有している"

 pol_push_east: "東方への前進"
 pol_push_east_desc: "ミンスクはリトアニアの心臓部、スモレンスクは東スラヴ世界の重要な要衝だ。モスクワ大公国が台頭しつつある中、これらの都市を確保することでポーランド・リトアニア連合が東スラヴ世界の覇者として君臨できる。イワン3世がスモレンスクを巡り戦った歴史的な争いが、今度はポーランドに有利な形で展開される。"
 pol_push_east_tooltip: "ミンスク（minsk）とスモレンスク（smolensk）を自国または属国が領有している"

 pol_eastern_empire: "東方帝国"
 pol_eastern_empire_desc: "ポーランド・リトアニア連合は最盛期（1618年頃）にヨーロッパ最大の国家となった。バルト海からポントゥス・エクシヌス（黒海）まで、東スラヴ世界全体がポーランドの旗の下に統一される。ロシア・オスマン・ハプスブルクが等しく恐れる東方の大帝国を建設せよ。"
 pol_eastern_empire_tooltip: "500以上のロケーションを保有し、東ヨーロッパ地域に150以上のロケーションを保有している"

 pol_prussian_confederation: "プロイセン連合とドイツ騎士団"
 pol_prussian_confederation_desc: "ドイツ騎士団（チュートン騎士団）は13世紀にバルト海沿岸に築いた異教徒征服の拠点から、今やポーランドの宿敵となっている。1410年のグルンヴァルドの戦いでポーランド・リトアニア連合軍が騎士団を大敗させた。プロイセン連合（ポーランドに帰順を求めたプロイセン市民の団体）の支援を得てドイツ騎士団を制圧し、バルト海への出口を確保せよ。"
 pol_prussian_confederation_tooltip: "トルン（torun）を自国または属国が領有しており、ドイツ騎士団（c:TUE）と交戦中、もしくは騎士団が存在しないか従属国である"

 pol_gdansk_port: "グダニスクの港"
 pol_gdansk_port_desc: "グダニスク（ダンツィヒ）は「ポーランドの門」と呼ばれるバルト海最重要の港市だ。ヴィスワ川の河口に位置するこの都市はハンザ同盟の主要拠点であり、ポーランドの穀物輸出の要衝。1466年のトルン条約でポーランドが獲得したグダニスクは、その後200年にわたってポーランド経済の心臓部として機能した。"
 pol_gdansk_port_tooltip: "グダニスク（gdansk）を自国または属国が領有し、都市（city）以上のランクである"

 pol_baltic_dominance: "バルト海の覇権"
 pol_baltic_dominance_desc: "「グダニスクを支配する者がバルト海の穀物交易を支配する」——16世紀のヨーロッパではポーランドの穀物がバルト海を経由してアムステルダムへ輸出され、ヨーロッパ全土を養った。この交易ルートを完全に掌握し、ポーランドを「ヨーロッパのパン籠」として確立せよ。"
 pol_baltic_dominance_tooltip: "艦船20以上、月収100以上"

 pol_livonian_expansion: "リヴォニアへの拡大"
 pol_livonian_expansion_desc: "リヴォニア（現在のラトビアとエストニア）はかつてリヴォニア騎士団が支配したが、16世紀にはロシア・スウェーデン・デンマーク・ポーランドが争う舞台となった。リガとタリン（レヴァル）を掌握することでバルト海全域の制海権がポーランドのものとなる。"
 pol_livonian_expansion_tooltip: "リガ（riga）とタリン（tallinn）を自国または属国が領有している"

 pol_master_of_the_north: "北方の覇者"
 pol_master_of_the_north_desc: "ケーニヒスベルク（現カリーニングラード）はかつてドイツ騎士団の本拠地、今やポーランドの支配下にある。強大な艦隊とともにバルト海全域を掌握したポーランドは、スカンジナビア・ハンザ・オランダとの交易を一手に握る北方の覇者となった。"
 pol_master_of_the_north_tooltip: "ケーニヒスベルク（konigsberg）を自国または属国が領有し、艦船40以上、月収200以上"

 pol_hungarian_union: "ハンガリーとの同君連合"
 pol_hungarian_union_desc: "1370年、カジミェシュ3世が後継者なく崩御すると、甥のアンジュー家ラヨシュ1世（ハンガリー王ラヨシュ大王）がポーランド王位を兼任した。これがポーランド・ハンガリー同君連合の始まりだ。二つの大王国が一人の王の下に統一されることで、中東欧の力の均衡が根本的に変わる。"
 pol_hungarian_union_tooltip: "ハンガリー（c:HUN）と同君連合か従属国関係にある"

 pol_moldavia_vassal: "モルダヴィアの従属"
 pol_moldavia_vassal_desc: "モルダヴィア（モルドヴァ）公国はポーランド・ハンガリー・オスマンが影響力を争う緩衝国だ。シュテファン大公（1457〜1504年）はポーランドに宗主権を認めながらも事実上の独立を保った。この戦略的公国を確実にポーランドの傘下に置き、黒海への扉を押さえよ。"
 pol_moldavia_vassal_tooltip: "モルダヴィア（c:MOL）と同君連合か従属国関係にある、もしくはキエフを領有している"

 pol_wallachia_control: "ワラキアの支配"
 pol_wallachia_control_desc: "ワラキア（ハーヴァシェルフォルド）はドナウ川北岸の公国で、オスマン帝国への防衛の最前線だ。ヴラド2世（「串刺し公」の父）はドラゴン騎士団員としてハンガリーに仕えた。ワラキアをポーランド・ハンガリー連合の傘下に置くことで、バルカン半島への影響力が確立される。"
 pol_wallachia_control_tooltip: "ワラキア（c:WAL）が従属国、もしくはブカレスト（bucharest）を自国または属国が領有している"

 pol_battle_of_grunwald: "グルンヴァルドの精神"
 pol_battle_of_grunwald_desc: "1410年7月15日、グルンヴァルドの野でポーランド・リトアニア連合軍はドイツ騎士団を完膚なきまでに打ち破った。騎士団総長ウルリヒ・フォン・ユンギンゲンが戦場で倒れ、ポーランドは「キリスト教世界の守護者」としての名声を不動のものにした。今またイスラム教国家との戦争でその精神を証明せよ。"
 pol_battle_of_grunwald_tooltip: "イスラム教国家（religion_group:muslim）と交戦中であり、陸軍規模30以上"

 pol_shield_of_christendom: "キリスト教世界の盾"
 pol_shield_of_christendom_desc: "ポーランドはヤドヴィガのキリスト教化政策以来、東欧カトリック世界の最前線に立ち続けてきた。オスマン帝国をついに駆逐した今、教皇もヴェネツィアもハプスブルクも、ポーランドこそが「キリスト教世界の真の盾（アンテムラーレ・クリスティアニタティス）」であると認める。"
 pol_shield_of_christendom_tooltip: "教皇との友好度150以上かつ同盟中、もしくはキエフを領有しており、オスマン帝国が存在しない"

 pol_silesia_integration: "シレジアの統合"
 pol_silesia_integration_desc: "シレジア（シロンスク）はピャスト朝ポーランドの発祥の地だが、14世紀にはボヘミア・ハプスブルクの支配下に移った。ヴロツワフ（ブレスラウ）を中心とするこの豊かな工業・商業地帯を取り戻すことは、ポーランドにとって民族的・経済的に最も重要な課題の一つだ。"
 pol_silesia_integration_tooltip: "ヴロツワフ（wroclaw）を自国または属国が領有し、シレジア地域に8以上のロケーションを保有している"

 pol_bohemian_claim: "ボヘミア王冠の掌握"
 pol_bohemian_claim_desc: "ヤギェウォ家はボヘミア・ハンガリー王位の継承権を持つ。ヴラディスラフ2世（ヤギェウォ）は1471年にボヘミア王、1490年にハンガリー王も兼任した。プラハのボヘミア王冠を掌握することで、ポーランド・ボヘミア・ハンガリー三重王国が実現する。"
 pol_bohemian_claim_tooltip: "ボヘミア（c:BOH）と同君連合か従属国関係にある"

 pol_hre_influence: "神聖ローマ帝国への影響力"
 pol_hre_influence_desc: "ボヘミア王を兼任するポーランド王は神聖ローマ帝国の選帝侯となりえる。ハプスブルクとの外交的均衡を図りながら、ドイツ諸侯への影響力を拡大することで、ポーランドは中欧の政治の中心となる。"
 pol_hre_influence_tooltip: "外交的評判5以上、ハプスブルク（c:HAB）と同盟か友好度150以上、もしくは戦力投射20以上"

 pol_central_european_power: "中欧の大国"
 pol_central_european_power_desc: "ポーランド・リトアニア・ボヘミア・ハンガリーを含む広大な版図と豊かな収入——ポーランドは中欧最大の大国として台頭した。神聖ローマ帝国・オスマン帝国・モスクワ大公国の三大勢力に囲まれながらも、ポーランドは独自の輝きを放ち続ける。"
 pol_central_european_power_tooltip: "400以上のロケーションを保有し、王国ランク以上、月収300以上"

 pol_grand_commonwealth: "大コモンウェルス"
 pol_grand_commonwealth_desc: "ポーランド・リトアニア・ボヘミア・ハンガリーを統合した「コモンウェルス」——貴族の自由と王権が調和した独自の政治体制を持つこの国家は、16〜17世紀に「諸国民の共和国（レーチュ・ポスポリタ）」として知られた。多民族・多宗教・多言語を包摂するこの稀有な政治実験が今、最高点に達した。"
 pol_grand_commonwealth_tooltip: "800以上のロケーションを保有し、威信80以上、月収600以上"

 pol_republic_of_nobles: "貴族の共和国"
 pol_republic_of_nobles_desc: "1337年にカジミェシュ大王が治めていた小さなポーランド王国は、今や「諸国民の共和国（レーチュ・ポスポリタ）」——ヨーロッパ史上最大かつ最も独創的な政治体制を持つ国家となった。バルト海から黒海まで、キエフ・ルーシの草原からボヘミアの森林まで——全てがポーランドの旗の下に統一された。貴族の自由・宗教的寛容・文化的多様性を誇るこの大帝国が、ポーランドの歴史に永遠の輝きを刻む。"
 pol_republic_of_nobles_tooltip: "1200以上のロケーションを保有し、威信80以上、月収1000以上"

 pol_events.10.t: "ヤドヴィガとヤギェウォの婚姻"
 pol_events.10.d: "1385年のクレヴォ合意が実を結び、ポーランド女王ヤドヴィガとリトアニア大公ヤギェウォの婚姻が実現した。ヤギェウォはキリスト教洗礼を受け、「ヴワディスワフ2世」としてポーランド王を名乗る。リトアニアはポーランドとの同君連合に入り、東欧最大の政治的統合が始まった。この婚姻は単なる政略結婚ではない——二つの民族・二つの文化・二つの言語が一つの王朝の下に結集する、歴史的な瞬間だ。「ポーランドとリトアニアは永遠に一体である」とクレヴォ合意は宣言した。"
 pol_events.10.a: "新たなヤギェウォ朝の始まり万歳！"

 pol_events.20.t: "ポーランド・ハンガリー同君連合"
 pol_events.20.d: "ポーランドとハンガリーが同君連合を形成した。二つの大王国が一人の王の下に統一される——これはアンジュー家の外交的勝利であり、中東欧の歴史を塗り替える出来事だ。ポーランドとハンガリーの騎士が肩を並べて戦う日が来た。北のバルト海から南のアドリア海まで、一つの王朝が支配する巨大な版図が生まれつつある。オスマン帝国にとって、この同君連合こそが最大の脅威となるだろう。"
 pol_events.20.a: "ポーランドとハンガリーは一つだ！"

 pol_events.99.t: "貴族の共和国——ポーランドの黄金時代"
 pol_events.99.d: "カジミェシュ大王が石造りのポーランドを遺したように、今のポーランド王は世界に類を見ない偉大な国家を築き上げた。バルト海からポントゥス（黒海）まで、コペルニクスが「地球が太陽の周りを回る」と証明したこの大地全体がポーランドの旗の下に統一された。「貴族の共和国（レーチュ・ポスポリタ）」——王も貴族も法の下に平等であるこの稀有な国家は、ヨーロッパ文明史上最も独創的な政治実験だ。「ポーランドは滅びない（Jeszcze Polska nie zginęła）」——この言葉の意味を、今のポーランドは体現している。"
 pol_events.99.a: "貴族と王が共に歩む——ポーランド万歳！"

 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "ピャスト朝の遺産"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "ポーランド最初の王朝ピャスト朝が積み上げた1000年の遺産が、ポーランド王権の正統性を支えている。"
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "マゾフシェの統合"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "ワルシャワを中心とするマゾフシェがポーランドに完全統合された。この肥沃な低地平原が王国の中心として機能する。"
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "大セイムの確立"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "ポーランドのセイム（議会）が黄金の自由の制度として確立した。貴族の自治と王権が調和する独自の政治体制が生まれる。"
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "クラクフの文化的隆盛"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "ヴァヴェル城を中心とするクラクフがルネサンスの光に包まれた。中東欧最高の学術都市として、ヨーロッパ中から学者・芸術家が集まる。"
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "ヤギェウォ大学の隆盛"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "コペルニクスを輩出したヤギェウォ大学が中東欧最高の学府として栄えている。知識と芸術がポーランド全土に広まる。"
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "ポーランドの黄金時代"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "コペルニクスの地動説・コハノフスキの詩・クラクフの建築——あらゆる面でポーランドは黄金時代を謳歌している。"
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "ヤドヴィガ・ヤギェウォ連合の絆"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "ポーランドとリトアニアの同君連合が確立した。バルト海から黒海への広大な国家が生まれつつある。"
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "ポーランド・ハンガリー同盟の力"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "ポーランドとハンガリーの王軍が合流した。北方と南方の二大国の連携がオスマンへの圧力を高める。"
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "ルテニアの開発"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "赤ルーシの農業地帯が本格開発された。リヴィウを通じた黒海交易路が活性化する。"
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "キエフの門"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "スラヴ文明発祥の地キエフがポーランドの支配下に入った。ドニエプル川流域全体への影響力が確立する。"
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "東方への前進"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "ミンスクとスモレンスクの掌握で東スラヴ世界全体がポーランドの影響圏に入った。"
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "東方帝国"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "バルト海から黒海まで広がるポーランド帝国が完成した。東欧最大の国家として歴史に刻まれる。"
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "チュートン騎士団への勝利"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "グルンヴァルドの精神がポーランド軍に宿っている。キリスト教世界の十字軍騎士を破った記憶が軍の誇りとなる。"
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "グダニスクの商業都市"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "グダニスクがバルト海最大の穀物輸出港として発展した。ヴィスワ川を通じたポーランド穀物がヨーロッパ全土を養う。"
 STATIC_MODIFIER_NAME_pol_baltic_trade_mod: "バルト海交易の覇権"
 STATIC_MODIFIER_DESC_pol_baltic_trade_mod: "ポーランドがバルト海の穀物交易を支配した。アムステルダムへの穀物輸出が莫大な富をもたらす。"
 STATIC_MODIFIER_NAME_pol_livonia_mod: "リヴォニアの支配"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "リガとタリンの掌握でバルト海全域がポーランドの制海権下に入った。"
 STATIC_MODIFIER_NAME_pol_north_master_mod: "北方の覇者"
 STATIC_MODIFIER_DESC_pol_north_master_mod: "バルト海からスカンジナビアまで、ポーランドの艦隊が北方の海を支配する。"
 STATIC_MODIFIER_NAME_pol_moldavia_buffer_mod: "モルダヴィア緩衝国"
 STATIC_MODIFIER_DESC_pol_moldavia_buffer_mod: "モルダヴィアがポーランドの影響下に置かれ、黒海北岸への橋頭堡が確立した。"
 STATIC_MODIFIER_NAME_pol_wallachian_buffer_mod: "ワラキア緩衝国"
 STATIC_MODIFIER_DESC_pol_wallachian_buffer_mod: "ワラキアがポーランド・ハンガリー連合の保護下に置かれ、バルカン半島への影響力が高まった。"
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "グルンヴァルドの栄光"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "グルンヴァルドの精神がポーランド軍を鼓舞する。異教との戦いでポーランドは一層の栄光を勝ち取る。"
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "キリスト教世界の盾"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "ポーランドはアンテムラーレ・クリスティアニタティス——キリスト教世界の盾——として歴史に刻まれた。"
 STATIC_MODIFIER_NAME_pol_silesia_mod: "シレジアの統合"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "ピャスト朝発祥の地シレジアがポーランドに回帰した。豊かな鉱業・工業地帯がポーランド経済を強化する。"
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "ボヘミア王冠"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "ヤギェウォ家がボヘミア王冠を掌握した。プラハのボヘミア王宮がポーランド外交の舞台となる。"
 STATIC_MODIFIER_NAME_pol_hre_influence_mod: "神聖ローマへの影響力"
 STATIC_MODIFIER_DESC_pol_hre_influence_mod: "ポーランドがドイツ諸侯への影響力を確立した。選帝侯としての地位が中欧外交を左右する。"
 STATIC_MODIFIER_NAME_pol_central_power_mod: "中欧の大国"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "ポーランドが中東欧最大の大国として台頭した。三大勢力の間でも独自の輝きを放つ。"
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "大コモンウェルス"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "レーチュ・ポスポリタが完成した。多民族・多宗教・多言語を包摂するヨーロッパ最大の政治実験。"
 STATIC_MODIFIER_NAME_pol_republic_of_nobles_final_mod: "貴族の共和国の栄光"
 STATIC_MODIFIER_DESC_pol_republic_of_nobles_final_mod: "バルト海から黒海まで広がる大コモンウェルスが完成した。ポーランドの黄金時代は永遠に歴史に刻まれる。"

 pol_krakow_capital: "クラクフ王都の整備"
 pol_krakow_capital_desc: "クラクフはポーランド王国の首都として数世紀にわたって機能してきた。ヴァヴェル丘の上に聳えるヴァヴェル城を中心に、商業・政治・宗教の全ての機能がこの都市に集中している。クラクフを都市ランク以上に発展させ、真の王都として整備することで、ポーランド全体の繁栄の基盤が生まれる。"
 pol_krakow_capital_tooltip: "クラクフが都市（city）以上のランクであり、月収20以上"
 pol_support_prussian_cities: "プロイセン都市連合への支援"
 pol_support_prussian_cities_desc: "ドイツ騎士団の重税と専制支配に苦しむプロイセンの諸都市が、ポーランド王に保護を求めてきた。1454年のプロイセン連合（Związek Pruski）はグダニスク・トルン・エルブロンクなど19の都市と30の貴族からなる同盟で、騎士団からの解放を求めてポーランドに従属を申し出た。この機会を活かせ。"
 pol_support_prussian_cities_tooltip: "トルン（torun）とグニェズノ（gniezno）を自国または属国が領有している"
 pol_tend_to_lithuania: "リトアニアへの外交"
 pol_tend_to_lithuania_desc: "1385年のクレヴォ合意以前から、ポーランドとリトアニアは共通の外交的利益を持っていた。ドイツ騎士団という共通の敵を前に、両国の協力は必然だった。リトアニアとの関係を良好に保ちながら、将来の同君連合への布石を打て。"
 pol_tend_to_lithuania_tooltip: "リトアニア（c:LIT）の友好度150以上、もしくは同君連合、外交的評判3以上"
 pol_varna_aftermath: "ヴァルナの後始末"
 pol_varna_aftermath_desc: "1444年のヴァルナの戦いでポーランド・ハンガリー連合十字軍はオスマン軍に惨敗し、ポーランド王ヴワディスワフ3世も戦死した。この敗北はキリスト教世界に深刻な衝撃を与えたが、同時にハンガリーとの絆を再確認する機会でもあった。ハンガリーとの関係を修復し、次の十字軍への準備を整えよ。"
 pol_varna_aftermath_tooltip: "ハンガリー（c:HUN）の友好度150以上、もしくは同君連合か従属国、同盟国3以上"
 pol_piast_revival: "ピャスト朝の遺産"
 pol_piast_revival_desc: "ポズナンとグニェズノはポーランド最古の都市であり、ピャスト朝のポーランド王国発祥の地だ。グニェズノ大聖堂には聖ヴォイチェフ（アダルベルト）の遺骸が眠り、ポーランド・カトリック信仰の心臓部として機能する。この聖地を掌握してピャスト朝の遺産を継承せよ。"
 pol_piast_revival_tooltip: "ポズナン（poznan）とグニェズノ（gniezno）を自国または属国が領有している"
 pol_support_merchants: "商人階級への支援"
 pol_support_merchants_desc: "ポーランドの都市市民（ブルジョワ）は王室財政の重要な支柱だ。クラクフのスキェンニツェ（布市場）を中心とする交易網を支援することで、都市商人の忠誠心と財政収入が向上する。商人身分を満足させながら、交易国家としてのポーランドの基盤を作れ。"
 pol_support_merchants_tooltip: "月収30以上、商人身分の満足度0.60以上"
 pol_black_sea_access: "黒海への出口"
 pol_black_sea_access_desc: "ドニエプル川を南下することでポーランドは黒海に到達できる。クリミア半島一帯とポントゥス・エクシヌス（黒海）北岸の支配は、オスマン帝国が掌握するコンスタンティノープルを迂回した東方交易路の確保を意味する。黒海艦隊を整備し、海上覇権を広げよ。"
 pol_black_sea_access_tooltip: "艦船10以上、クリミア地域に3以上のロケーションを自国または属国が領有"
 pol_conquer_serbia: "セルビアの征服"
 pol_conquer_serbia_desc: "セルビア王国はコソヴォの戦い（1389年）でオスマンに敗れ事実上の属国となった。ベオグラード（スメデレヴォ要塞）を掌握することで、ドナウ川南岸のキリスト教世界への防衛の足がかりが確立する。ポーランド・ハンガリー連合軍でバルカンを解放せよ。"
 pol_conquer_serbia_tooltip: "ベオグラード（belgrade）を自国または属国が領有し、セルビア（c:SER）が従属国か存在しない"
 pol_east_prussia_settled: "東プロイセンの平定"
 pol_east_prussia_settled_desc: "グルンヴァルドの勝利後、東プロイセンの諸都市がポーランドの傘下に入ってきた。ケーニヒスベルク（クラレヴィエツ）とグダニスクを同時に掌握することで、バルト海南岸全域がポーランドの手に落ちる。これぞ1466年のトルン条約が歴史的に実現したポーランドの悲願だ。"
 pol_east_prussia_settled_tooltip: "グルンヴァルドの戦い（pol_battle_of_grunwald）完了後、ケーニヒスベルク（konigsberg）とグダニスク（gdansk）を自国または属国が領有している"
 pol_greater_poland: "大ポーランド帝国"
 pol_greater_poland_desc: "シレジア統合とボヘミア王冠掌握という二大成果を経て、大ポーランドの建設が現実となった。ポズナンを中心とする「大ポーランド（ヴィエルコポルスカ）」地方全体が完全にポーランド支配下に収まり、西方への拡大の基盤が確立する。"
 pol_greater_poland_tooltip: "大ポーランド地域（greater_poland_area）に8以上のロケーションを保有し、ポズナン（poznan）を自国または属国が領有、ボヘミア統合済み"
 pol_krakow_cloth_hall: "クラクフのスキェンニツェ（布市場）"
 pol_krakow_cloth_hall_desc: "クラクフのスキェンニツェ（Sukiennice、布市場）は14世紀に建設されたゴシック様式の交易ホールで、中東欧最大の商業施設の一つだ。ここではポーランドの亜麻・毛織物・琥珀・金属が取引され、遠くヴェネツィア・フランドル・ペルシャの商人も集まった。この商業の中心を活性化させよ。"
 pol_krakow_cloth_hall_tooltip: "商人支援（pol_support_merchants）とクラクフのルネサンス（pol_krakow_renaissance）が完了し、クラクフのRGO従事者が5以上、月収50以上"
 pol_baltic_grain_trade: "バルト海穀物交易"
 pol_baltic_grain_trade_desc: "グダニスクを通じたポーランド穀物のバルト海輸出は15〜17世紀に爆発的に拡大した。ヴィスワ川沿いに船で下された穀物がグダニスクで積み替えられ、アムステルダムへ向かう——この交易ルートがポーランドを「ヨーロッパのパン籠」にした。交易路を確立せよ。"
 pol_baltic_grain_trade_tooltip: "月収80以上、市場の中心地（market center）を3以上保有"
 pol_breadbasket_of_europe: "ヨーロッパのパン籠"
 pol_breadbasket_of_europe_desc: "16世紀末、ポーランドはヨーロッパで消費される穀物の大部分を供給していた。アムステルダム・リスボン・セビリャの商人はポーランドの小麦・ライ麦なしに事業が成り立たなかった。ポーランドが「ヨーロッパのパン籠」として歴史に刻まれた。"
 pol_breadbasket_of_europe_tooltip: "月収150以上、穀物（grain）を国内で20以上生産している"
 pol_konigsberg_secured: "ケーニヒスベルクの確保"
 pol_konigsberg_secured_desc: "ケーニヒスベルク（クラレヴィエツ）はかつてドイツ騎士団の本拠地だったが、今はポーランドの支配下にある。この堅固な要塞都市を強化し、バルト海東岸全体の防衛拠点とする。後のプロイセン王国の首都となるこの地を永続的にポーランドのものとせよ。"
 pol_konigsberg_secured_tooltip: "東プロイセン平定（pol_east_prussia_settled）後、ケーニヒスベルク（konigsberg）を自国または属国が領有し、稜堡（bastion）を3以上保有"
 pol_pontic_steppe: "ポントゥス大草原"
 pol_pontic_steppe_desc: "ポントゥス・エクシヌス（黒海）北岸のステップ地帯は「野生の平原（ポーレ・ディキェ）」と呼ばれ、タタール人の略奪が絶えなかった。この地を掌握することで、黒海への完全なアクセスが確立し、オスマン帝国に対する戦略的優位が生まれる。"
 pol_pontic_steppe_tooltip: "黒海への出口（pol_black_sea_access）完了後、東ヨーロッパ地域に80以上のロケーションを保有"
 pol_smolensk_campaign: "スモレンスク遠征"
 pol_smolensk_campaign_desc: "スモレンスクはドニエプル川上流の要衝で、ポーランド・リトアニアとモスクワ大公国の間で何度も争われた。1514年のオルシャの戦いではリトアニア軍がモスクワ軍を撃破した。この歴史的戦場でポーランドが東方への影響力を確立する好機だ。"
 pol_smolensk_campaign_tooltip: "スモレンスク（smolensk）を自国または属国が領有し、交戦中である"
 pol_contain_muscovy: "モスクワ大公国の封じ込め"
 pol_contain_muscovy_desc: "イワン3世以来、モスクワ大公国は急速に台頭しポーランド・リトアニアの東方を脅かしている。ミンスクとスモレンスクを核とする要塞線を構築することで、モスクワの西方進出を組織的に阻止できる。東の巨人が大帝国に成長する前に封じ込めよ。"
 pol_contain_muscovy_tooltip: "スモレンスク遠征（pol_smolensk_campaign）完了後、ミンスク（minsk）を自国または属国が領有し、稜堡（bastion）を5以上保有"
 pol_balkan_advance: "バルカンへの前進"
 pol_balkan_advance_desc: "セルビア・ワラキアを掌握したポーランド・ハンガリー連合軍は今やドナウ川を越えてバルカン半島に深く進出した。ベオグラードを前進基地として、オスマン帝国との全面戦争に突入する時が来た。グルンヴァルドの精神でイスラム教国家を打ち破れ。"
 pol_balkan_advance_tooltip: "セルビア征服（pol_conquer_serbia）完了後、ベオグラード（belgrade）を自国または属国が領有し、いずれかのイスラム国家と交戦中"
 pol_papal_alliance: "教皇との同盟"
 pol_papal_alliance_desc: "ポーランドは聖ミェシュコ1世のキリスト教改宗（966年）以来、教皇庁との特別な関係を保ってきた。教皇との同盟を締結し、真の十字軍国家としての地位を確立することで、ポーランドはキリスト教世界の正式な「盾」と認められる。"
 pol_papal_alliance_tooltip: "教皇（c:PAP）の友好度150以上かつ同盟中"
 pol_crusade_against_turks: "対トルコ十字軍"
 pol_crusade_against_turks_desc: "教皇の祝福を受けた十字軍がオスマン帝国に向けて進軍する。ポーランドの騎士とハンガリーの黒軍が合流し、中東欧最大の軍勢がトルコ軍に挑む。ヴァルナの雪辱を晴らす時が来た。"
 pol_crusade_against_turks_tooltip: "教皇との同盟（pol_papal_alliance）完了後、陸軍規模40以上でイスラム国家と交戦中"
 pol_hre_elector: "神聖ローマ帝国への影響力"
 pol_hre_elector_desc: "ボヘミア王を兼任するポーランド王は神聖ローマ帝国の選帝侯資格を持つ。ハプスブルクへの外交的圧力を高め、帝国政治での発言力を確立することで、ポーランドは中欧の政治を左右する大国として認識される。"
 pol_hre_elector_tooltip: "ボヘミア野望（pol_bohemian_claim）完了後、外交的評判5以上、ハプスブルク（c:HAB）と同盟か友好度150以上"
 pol_emperor_of_hre: "神聖ローマ皇帝"
 pol_emperor_of_hre_desc: "ポーランド・ボヘミア・ハンガリー三重王国の力を背景に、ポーランド王が神聖ローマ皇帝位を狙う。500以上のロケーションと帝国ランクを誇るポーランドは、もはやハプスブルクに頼む必要はない。帝国の玉座こそポーランドのものだ。"
 pol_emperor_of_hre_tooltip: "HRE影響力（pol_hre_elector）完了後、500以上のロケーションを保有し帝国ランク、月収400以上"
 pol_habsburg_rivalry: "ハプスブルクへの挑戦"
 pol_habsburg_rivalry_desc: "ウィーンを掌握することでドナウ流域の覇権がポーランドに移る。ハプスブルクとの長年の外交的競争が今、軍事的決着を迎える。ドイツ・イタリア・スペインに広がるハプスブルク帝国に対し、ポーランドが東から圧力をかける。"
 pol_habsburg_rivalry_tooltip: "ボヘミア野望（pol_bohemian_claim）完了後、ウィーン（vienna）を自国または属国が領有"
 pol_central_european_hegemon: "中欧の覇者"
 pol_central_european_hegemon_desc: "ウィーン陥落によりポーランドは中東欧の疑いのない覇者となった。400以上のロケーションと豊かな収入・高い威信——全てが揃った今、神聖ローマ帝国を名実ともに支配する時が来た。"
 pol_central_european_hegemon_tooltip: "ハプスブルクへの挑戦（pol_habsburg_rivalry）完了後、400以上のロケーションを保有し月収300以上、威信60以上"
 pol_copernicus: "コペルニクスの地動説"
 pol_copernicus_desc: "ニコラウス・コペルニクス（1473〜1543年）はトルン生まれのポーランドの天文学者だ。1543年に発表した「天球の回転について」で地動説を提唱し、科学革命の始まりをもたらした。ヤギェウォ大学で学んだコペルニクスの業績がポーランドを「天文学の国」として世界に知らしめる。"
 pol_copernicus_tooltip: "ヤギェウォ大学（pol_jagiellonian_university）完了後、1510年以降か大学10以上保有"
 pol_magnate_economy: "マグナートの経済"
 pol_magnate_economy_desc: "ポーランドの大貴族（マグナート）は広大な領地を所有し、農奴制に基づいた農業経済を構築した。この「フォルワルク制度」は大量の穀物を生産してバルト海交易で売却し、莫大な収益をもたらした。マグナートを経済的パートナーとして活用せよ。"
 pol_magnate_economy_tooltip: "ヤギェウォ大学（pol_jagiellonian_university）完了後、月収100以上、市場の中心地（market center）を5以上保有"
 pol_folwark_system: "フォルワルク制度の完成"
 pol_folwark_system_desc: "フォルワルク（Folwark）——貴族が農奴を使役して穀物を大量生産する農業経営形態——が完成した。農奴の劣悪な環境という暗い側面はあるが、この制度がポーランドをヨーロッパ最大の穀物輸出国にした。バルト海を通じてヨーロッパ全土がポーランドの穀物を必要とする。"
 pol_folwark_system_tooltip: "マグナートの経済（pol_magnate_economy）完了後、月収200以上、穀物（grain）を国内で15以上生産"
 pol_rzeczpospolita: "レーチュ・ポスポリタ"
 pol_rzeczpospolita_desc: "「レーチュ・ポスポリタ（Rzeczpospolita）」——ポーランド・リトアニア共和国はラテン語の「res publica（公共の事）」に由来する。1569年のルブリン連合で正式に成立したこの国家は、貴族の自由（ズロタ・ヴォルノシッチ）・宗教的寛容・多民族共存という理念を掲げた。黄金時代の繁栄と経済力でこの理念を証明せよ。"
 pol_rzeczpospolita_tooltip: "ポーランドの黄金時代（pol_polish_golden_age）とフォルワルク制度（pol_folwark_system）完了後、350以上のロケーション、月収300以上"
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "クラクフ王都"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "ヴァヴェル城を戴くクラクフが中東欧最高の王都として整備された。交易と文化の中心として繁栄が加速する。"
 STATIC_MODIFIER_NAME_pol_nobles_levy_mod: "貴族の徴兵制度"
 STATIC_MODIFIER_DESC_pol_nobles_levy_mod: "シュラフタ（ポーランド貴族）の騎馬軍が整備された。1410年グルンヴァルドを彷彿とさせる精強な騎兵軍団がポーランドの力の象徴となる。"
 STATIC_MODIFIER_NAME_pol_grunwald_glory_mod: "グルンヴァルドの栄光"
 STATIC_MODIFIER_DESC_pol_grunwald_glory_mod: "1410年7月15日のグルンヴァルドの勝利——ポーランド史上最大の軍事的勝利の記憶が軍の誇りとなる。ドイツ騎士団を打ち破ったこの日の精神は永遠に生き続ける。"
 STATIC_MODIFIER_NAME_pol_lithuanian_diplomacy_mod: "リトアニア外交"
 STATIC_MODIFIER_DESC_pol_lithuanian_diplomacy_mod: "ポーランドとリトアニアの外交関係が円熟した。ヤドヴィガとヤギェウォの婚姻に向けた地ならしが完了する。"
 STATIC_MODIFIER_NAME_pol_varna_recovery_mod: "ヴァルナからの回復"
 STATIC_MODIFIER_DESC_pol_varna_recovery_mod: "1444年の惨敗を経験として昇華し、より慎重かつ強力な十字軍への準備が整った。次の戦いでは勝利を掴む。"
 STATIC_MODIFIER_NAME_pol_piast_revival_mod: "ピャスト朝の遺産継承"
 STATIC_MODIFIER_DESC_pol_piast_revival_mod: "ポズナンとグニェズノの掌握でポーランド最古の地が王冠に戻った。ピャスト朝一千年の遺産がヤギェウォ朝に継承される。"
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "商人支援政策"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "クラクフの商人ギルドへの支援政策が都市経済を活性化した。バルト海交易への参加が現実のものとなる。"
 STATIC_MODIFIER_NAME_pol_prussia_settled_mod: "東プロイセン平定"
 STATIC_MODIFIER_DESC_pol_prussia_settled_mod: "グルンヴァルドの勝利の後、東プロイセンがポーランドの支配下に完全に収まった。バルト海南岸の覇権が確立する。"
 STATIC_MODIFIER_NAME_pol_greater_poland_mod: "大ポーランドの完成"
 STATIC_MODIFIER_DESC_pol_greater_poland_mod: "シレジアとボヘミアの統合でピャスト朝発祥の大ポーランド地方が完全にポーランド王国の版図に収まった。"
 STATIC_MODIFIER_NAME_pol_sukiennice_mod: "スキェンニツェの交易"
 STATIC_MODIFIER_DESC_pol_sukiennice_mod: "クラクフのスキェンニツェ（布市場）が中東欧最大の商業施設として本格稼働している。ヴェネツィアからもペルシャからも商人が集まる。"
 STATIC_MODIFIER_NAME_pol_konigsberg_mod: "ケーニヒスベルク要塞"
 STATIC_MODIFIER_DESC_pol_konigsberg_mod: "かつての騎士団本拠地ケーニヒスベルクがポーランドの最前線要塞として整備された。バルト海東岸の防衛線が確立する。"
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "黒海交易路"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "ドニエプル川を通じた黒海へのアクセスが確立した。オスマン帝国を迂回した東方交易路がポーランドの富を増やす。"
 STATIC_MODIFIER_NAME_pol_steppe_frontier_mod: "ステップの前線"
 STATIC_MODIFIER_DESC_pol_steppe_frontier_mod: "ポントゥス草原の掌握で黒海北岸全体がポーランドの影響下に入った。タタール人の略奪も今や過去の話となる。"
 STATIC_MODIFIER_NAME_pol_smolensk_victory_mod: "スモレンスクの勝利"
 STATIC_MODIFIER_DESC_pol_smolensk_victory_mod: "スモレンスクを掌握したポーランドがモスクワ大公国の西進を阻止した。1514年オルシャの戦いのような輝かしい勝利が再び刻まれる。"
 STATIC_MODIFIER_NAME_pol_muscovy_barrier_mod: "モスクワ封じ込め"
 STATIC_MODIFIER_DESC_pol_muscovy_barrier_mod: "ミンスクとスモレンスクの要塞線がモスクワ大公国の西方進出を組織的に阻止する。東の巨人は封じ込められた。"
 STATIC_MODIFIER_NAME_pol_danube_control_mod: "ドナウ川の支配"
 STATIC_MODIFIER_DESC_pol_danube_control_mod: "セルビア征服によりドナウ川南岸がポーランド・ハンガリー連合の支配下に入った。バルカンへの道が開かれた。"
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "ヨーロッパのパン籠"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "ポーランドがヨーロッパ最大の穀物輸出国となった。アムステルダムからリスボンまで、ヨーロッパ全土がポーランドの穀物を必要としている。"
 STATIC_MODIFIER_NAME_pol_papal_blessing_mod: "教皇の祝福"
 STATIC_MODIFIER_DESC_pol_papal_blessing_mod: "ローマ教皇がポーランドをキリスト教世界の正式な盾と認めた。十字軍の勅書がポーランド王に送られ、全キリスト教徒がポーランドの旗の下に集う。"
 STATIC_MODIFIER_NAME_pol_anti_ottoman_crusade_mod: "対オスマン十字軍"
 STATIC_MODIFIER_DESC_pol_anti_ottoman_crusade_mod: "ポーランドが率いる対オスマン十字軍が最高潮に達した。教皇・ハンガリー・ヴェネツィアが支援するこの聖戦でポーランドは歴史に名を刻む。"
 STATIC_MODIFIER_NAME_pol_habsburg_rival_mod: "ハプスブルクへの挑戦"
 STATIC_MODIFIER_DESC_pol_habsburg_rival_mod: "ウィーン陥落によりハプスブルクの覇権が崩れた。ドナウ流域の支配権がポーランドに移る。"
 STATIC_MODIFIER_NAME_pol_hre_emperor_mod: "神聖ローマ皇帝"
 STATIC_MODIFIER_DESC_pol_hre_emperor_mod: "ポーランド王が神聖ローマ皇帝位を掌握した。プラハ・ウィーン・クラクフが一人の皇帝の下に統一される。"
 STATIC_MODIFIER_NAME_pol_copernicus_mod: "コペルニクスの遺産"
 STATIC_MODIFIER_DESC_pol_copernicus_mod: "「地球が動く——天球の回転について（De revolutionibus orbium coelestium）」——コペルニクスの革命的な発見がポーランドを科学の先進国として世界に知らしめた。"
 STATIC_MODIFIER_NAME_pol_magnate_economy_mod: "マグナート経済"
 STATIC_MODIFIER_DESC_pol_magnate_economy_mod: "ポーランドの大貴族が主導する農業・交易経済が確立した。フォルワルク制度の穀物がバルト海を埋め尽くす。"
 STATIC_MODIFIER_NAME_pol_folwark_mod: "フォルワルク制度"
 STATIC_MODIFIER_DESC_pol_folwark_mod: "農奴制に基づくフォルワルク農業経営がポーランドの経済的心臓部となった。大量の穀物がヴィスワ川を流れグダニスクへ向かう。"
 STATIC_MODIFIER_NAME_pol_rzeczpospolita_mod: "レーチュ・ポスポリタの理念"
 STATIC_MODIFIER_DESC_pol_rzeczpospolita_mod: "貴族の自由・宗教的寛容・多民族共存——レーチュ・ポスポリタの理念がポーランドを17世紀最大の国家に押し上げた。"

 pol_nieszawa_privileges: "ニェシャワ特権"
 pol_nieszawa_privileges_desc: "1454年、カジミェシュ4世ヤギェウォはドイツ騎士団との戦争のために貴族の軍事動員を必要とし、その見返りとして「ニェシャワ条約」でシュラフタ（小貴族）に広範な特権を付与した。国王は貴族の同意なしに新たな税を課したり法律を制定したりできなくなる——これはポーランド「黄金の自由」の礎石となった。"
 pol_nieszawa_privileges_tooltip: "貴族身分の満足度0.75以上、政府改革スロット1以上"

 pol_develop_krakow: "クラクフの整備"
 pol_develop_krakow_desc: "ポーランドの首都クラクフはヴァヴェル城を中心に発展してきた。市場・職人・商人が集まるこの都市を本格的に整備し、ロケーションランクを都市以上に引き上げることで中東欧最大の商業都市としての地位を確立する。地方総督府を設置して直轄統治を強化せよ。"
 pol_develop_krakow_tooltip: "クラクフ（krakow）が都市（city）以上のランクである"

 pol_baltic_fleet: "バルト海艦隊"
 pol_baltic_fleet_desc: "グダニスクを手中に収めたポーランドはバルト海への出口を確保した。次は艦隊を整備し、バルト海の制海権を争う時だ。スウェーデン・デンマーク・リヴォニア騎士団がこの海域を争う中、ポーランド艦隊がバルト海の新たな主人公となる。"
 pol_baltic_fleet_tooltip: "艦船20以上"

 pol_sea_to_sea: "バルト海から黒海へ"
 pol_sea_to_sea_desc: "リヴォニアの制海権とキエフ・スモレンスクの掌握——ポーランド・リトアニア連合は今やバルト海から黒海まで広がる巨大国家となった。北のタリンから南のキエフまで、東欧最大の陸続きの帝国がここに完成した。後にヤン・ヘトマン・ザモイスキは言った——「このポーランドは神が自らの手で作り上げた国だ」と。"
 pol_sea_to_sea_tooltip: "艦船30以上、東ヨーロッパ地域に100ロケーション以上"

 pol_challenge_habsburg: "ハプスブルクへの挑戦"
 pol_challenge_habsburg_desc: "ハプスブルク家は16世紀に神聖ローマ帝国・スペイン・ボヘミア・ハンガリーを支配し、ヨーロッパ最大の王家となった。しかしボヘミア王でもあるポーランド王はこの覇権に挑戦できる。ウィーンを占領するか、ハプスブルクをポーランドの旗の下に引き入れよ。"
 pol_challenge_habsburg_tooltip: "ウィーン（vienna）を自国または属国が領有、もしくはオーストリア（c:HAB）と同君連合である"

 pol_codify_law: "法典の編纂"
 pol_codify_law_desc: "ポーランドの複雑な慣習法を成文化する試みが続いてきた。カジミェシュ大王の「ヴィスリツァ法令」（1346/47年）はその先例だ。計算所（counting house）を中心とする会計・行政機構を整備し、ポーランド法をより体系的に成文化することで行政効率が向上する。"
 pol_codify_law_tooltip: "計算所（counting_house）を4箇所以上保有し、正統性80以上"

 pol_develop_warsaw: "ワルシャワの整備"
 pol_develop_warsaw_desc: "ワルシャワはマゾフシェ公国の中心都市として発展してきた。ポーランドの中部に位置するこの都市は、1569年のルブリン合同後にポーランド・リトアニア連合の首都として急速に発展する。都市ランクに引き上げ地方総督府を設置することで、王国中心部の行政基盤が確立する。"
 pol_develop_warsaw_tooltip: "ワルシャワ（warsaw）が都市（city）以上のランクである"

 pol_amber_road: "琥珀街道"
 pol_amber_road_desc: "バルト海沿岸で採れる琥珀は古代から「北の黄金」として珍重されてきた。ポーランドのグダニスクはバルト琥珀の主要輸出港であり、イタリア・地中海方面への琥珀輸出が莫大な富をもたらした。この古代から続く交易路を現代に甦らせ、ポーランドの経済的地位を高めよ。"
 pol_amber_road_tooltip: "琥珀（amber）を5以上生産し、月収150以上"

 pol_poznan_commerce: "ポズナニの商業"
 pol_poznan_commerce_desc: "ポズナニ（ポズナン）はポーランド西部の商業都市で、ブランデンブルクやシレジアとの交易の要衝だ。かつてポーランド王国最初の司教座が置かれたこの都市は、中世から一貫してポーランド西部の商業中心地として機能してきた。都市ランクに引き上げてその商業的潜在力を最大化せよ。"
 pol_poznan_commerce_tooltip: "ポズナニ（poznan）が都市（city）以上のランクである"

 pol_vilnius_capital: "ヴィリニュスの整備"
 pol_vilnius_capital_desc: "ヴィリニュスはリトアニア大公国の首都として14世紀に急成長した都市だ。ゲディミナス大公が建設したこの都市には多くのユダヤ人・カトリック・東方正教徒が共存し、後に「北のエルサレム」と呼ばれるほどの多文化都市となった。都市ランクに引き上げ、リトアニア支配の中心として整備せよ。"
 pol_vilnius_capital_tooltip: "ヴィリニュス（vilnius）を自国または属国が領有し、都市（city）以上のランクである"

 pol_russia_rivalry: "モスクワとの対立"
 pol_russia_rivalry_desc: "イワン3世（大帝）はスモレンスクを巡りポーランド・リトアニアと激しく対立した。モスクワ大公国とポーランドのスモレンスク争奪戦は16世紀を通じて続く宿命の戦いだ。モスクワをライバルとして宣言し、東方覇権を確立せよ。「神聖なるルーシの守護者」を名乗るモスクワに対して、ポーランドは「自由の守護者」として対抗する。"
 pol_russia_rivalry_tooltip: "ロシア（c:RUS）がライバルである、もしくはスモレンスク（smolensk）を自国または属国が領有している"

 pol_malbork_castle: "マルボルク城の確保"
 pol_malbork_castle_desc: "マルボルク城（マリーエンブルク）はかつてドイツ騎士団の本拠地として建設された中世ヨーロッパ最大の城塞だ。1457年のトルン条約でポーランドに引き渡されたこの難攻不落の城塞に、さらに稜堡（バスティオン）を追加して完璧な防衛拠点を完成させよ。"
 pol_malbork_castle_tooltip: "マルボルク（malbork）を自国または属国が領有している"

 pol_gniezno_church: "グニェズノ大司教区"
 pol_gniezno_church_desc: "グニェズノはポーランドの歴史的首都であり、ポーランド初の大司教座が置かれた聖地だ。987年頃に建設されたグニェズノ大聖堂は聖アダルベルトの遺骸を祀り、ポーランドのカトリック信仰の中心として機能してきた。ポーランド教会を強化し、東欧カトリック世界の守護者としての使命を果たせ。"
 pol_gniezno_church_tooltip: "グニェズノ（gniezno）を自国または属国が領有し、聖職者身分の満足度0.75以上"

 pol_hanseatic_ties: "ハンザ同盟との結びつき"
 pol_hanseatic_ties_desc: "ハンザ同盟はバルト海・北海の交易を支配する都市連盟だ。グダニスク・トルン・エルビングなどポーランドの都市もハンザ同盟と密接な関係を持つ。これらの都市を中心に広大な交易ネットワークを構築し、バルト海交易の主役としてポーランドが台頭する。"
 pol_hanseatic_ties_tooltip: "月収120以上、市場の中心地（market center）を5以上保有している"

 pol_transylvania_influence: "トランシルヴァニアへの影響力"
 pol_transylvania_influence_desc: "トランシルヴァニアはハンガリー王国とポーランド同君連合の境界に位置する豊かな地域だ。ハンガリーとの同君連合を通じて、あるいは直接的な支配によってトランシルヴァニアへの影響力を確立することで、ポーランドの南東部国境が安定する。"
 pol_transylvania_influence_tooltip: "トランシルヴァニア地域に5以上のロケーションを保有、もしくはハンガリーと同君連合である"

 pol_subjugate_serbia: "セルビアの従属"
 pol_subjugate_serbia_desc: "セルビア王国はコソヴォの戦い（1389年）後にオスマン帝国の属国となりつつある。ポーランド・ハンガリー連合の南方拡大の一環として、ベオグラードを掌握するかセルビアを従属国とすることで、バルカン半島北部に確固たる足場を築く。"
 pol_subjugate_serbia_tooltip: "セルビア（c:SER）が従属国、もしくはベオグラード（belgrade）を自国または属国が領有している"

 pol_varna_revenge: "ヴァルナの雪辱"
 pol_varna_revenge_desc: "1444年のヴァルナの戦いでポーランド・ハンガリー十字軍はオスマン帝国に大敗し、ポーランド王ヴワディスワフ3世が戦死した。この屈辱的な敗北をついに晴らす時が来た。ヴァルナを占領しながらイスラム教国家と戦争することで、あの悲劇が勝利に塗り替えられる。"
 pol_varna_revenge_tooltip: "ヴァルナ（varna）を自国または属国が領有し、イスラム教国家と交戦中"

 pol_upper_silesia_mines: "上シレジアの鉱山"
 pol_upper_silesia_mines_desc: "上シレジア（オーバーシュレージエン）は豊富な銀・亜鉛・鉛の鉱山で知られる。チェシン・グリヴィツェ周辺の鉱山地帯を本格的に開発することで、ポーランドの工業的基盤が確立される。後に産業革命の中心地となるこの地域の資源を早期に掌握せよ。"
 pol_upper_silesia_mines_tooltip: "シレジア地域に銀（silver）RGOレベル5以上のロケーションが3箇所以上ある"

 pol_pomeranian_coast: "ポメラニア海岸"
 pol_pomeranian_coast_desc: "ポメラニア（ポモジェ）はバルト海沿岸の地域で、シュテッティン（シュチェチン）を中心に発展してきた。かつてはポーランドの版図に入っていたこの地域を回復することで、バルト海沿岸の制海権が完全にポーランドの手に入る。"
 pol_pomeranian_coast_tooltip: "シュテッティン（stettin）を自国または属国が領有している"

 pol_prague_university: "プラハ大学"
 pol_prague_university_desc: "プラハのカレル大学（1348年創設）は中東欧最古の大学だ。フス派の拠点となりこの大学からボヘミアの宗教改革が起こったが、ポーランドの支配下でこの学府を再建・発展させることで、プラハが再びカトリック学術の中心地となる。"
 pol_prague_university_tooltip: "プラハ（prague）を自国または属国が領有し、大学が建設されている"

 pol_catholicism_of_lithuania: "リトアニアのカトリック化"
 pol_catholicism_of_lithuania_desc: "ヤギェウォはポーランド王になるにあたってリトアニアをカトリックに改宗させることを約束した。ヴィリニュスを中心にリトアニア全土にカトリックの教会・修道院を建設し、かつて異教の地だったリトアニアを完全なカトリック国家に変えよ。この改宗なくして、ポーランド・リトアニア連合の真の統合はあり得ない。"
 pol_catholicism_of_lithuania_tooltip: "ヴィリニュス（vilnius）を自国または属国が領有し、聖職者身分の満足度0.70以上"

 pol_royal_road: "王の街道"
 pol_royal_road_desc: "クラクフからグニェズノ・ポズナニへ、そしてグダニスクへ続く「王の街道（ドロガ・クルレフスカ）」はポーランド王国の大動脈だ。マゾフシェ統合とプロイセン征服によって確保されたこの街道を整備することで、王国内の交通・通信・行政が飛躍的に向上する。"
 pol_royal_road_tooltip: "ワルシャワ（warsaw）とグニェズノ（gniezno）を自国または属国が領有している（マゾフシェ統合とプロイセン征服の後）"

 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "ニェシャワ特権"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "シュラフタ（小貴族）が国王の立法権に対する拒否権を獲得した。ポーランド「黄金の自由」の始まりだ。"
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "ポーランド法典"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "カジミェシュ大王以来の法典整備がさらに進んだ。体系的な成文法が行政効率を高める。"
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "クラクフ王都の整備"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "ヴァヴェル城を中心とするクラクフが中東欧最大の商業都市として整備された。"
 STATIC_MODIFIER_NAME_pol_warsaw_capital_mod: "ワルシャワの整備"
 STATIC_MODIFIER_DESC_pol_warsaw_capital_mod: "マゾフシェの中心ワルシャワが王国行政の要衝として整備された。後の首都移転を先取りする発展だ。"
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "商人支援政策"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "ポーランドの商人ブルジョワジーへの支援政策が交易収入を押し上げる。"
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "ヨーロッパのパン籠"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "ポーランドの穀物輸出がヨーロッパ全土を養う。ヴィスワ川を通じたグダニスクへの穀物輸送が莫大な富をもたらす。"
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "琥珀街道"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "古代から続くバルト琥珀の交易路が復活した。「北の黄金」の輸出が交易範囲と収入を拡大する。"
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "ポズナニの交易拠点"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "ポーランド西部の商業都市ポズナニが主要交易拠点として整備された。"
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "ヴィリニュスの発展"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "リトアニア大公国の首都ヴィリニュスが多文化都市として繁栄している。"
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "黒海への進出"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "黒海北岸へのアクセスを確保したポーランドが地中海交易路に参入した。"
 STATIC_MODIFIER_NAME_pol_russia_rivalry_mod: "モスクワとの対立"
 STATIC_MODIFIER_DESC_pol_russia_rivalry_mod: "モスクワ大公国との東スラヴ覇権争いがポーランド軍の軍紀と要塞防衛を強化した。"
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "マルボルク城塞"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "中世最大の城塞マルボルクにバスティオンを追加し、難攻不落の防衛拠点が完成した。"
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "グニェズノ大司教座"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "聖アダルベルトを祀るグニェズノ大聖堂がポーランド・カトリック世界の精神的中心として機能している。"
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "ハンザ同盟との絆"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "バルト海交易を支配するハンザ同盟とのネットワークがポーランドの交易収入を大幅に押し上げる。"
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "トランシルヴァニアへの影響力"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "トランシルヴァニアへの影響力確立でポーランドの南東部国境が安定した。"
 STATIC_MODIFIER_NAME_pol_balkan_control_mod: "バルカン北部の支配"
 STATIC_MODIFIER_DESC_pol_balkan_control_mod: "セルビアの従属でポーランドのバルカン影響力が確立した。"
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "ヴァルナの雪辱"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "1444年の屈辱的敗北を晴らした。ポーランドはイスラム世界との戦いで一層の栄光を勝ち取る。"
 STATIC_MODIFIER_NAME_pol_upper_silesia_mines_mod: "上シレジア鉱山"
 STATIC_MODIFIER_DESC_pol_upper_silesia_mines_mod: "上シレジアの銀・亜鉛・鉛の鉱山が本格稼働している。"
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "ポメラニア海岸"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "シュテッティンを中心とするポメラニア海岸がポーランド艦隊の基地として整備された。"
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "プラハ大学の隆盛"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "中東欧最古のカレル大学がポーランドの支配下で再び繁栄している。"
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "ハプスブルクへの勝利"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "ウィーンの占領かハプスブルクとの同君連合でポーランドが中欧の覇者となった。"
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "バルト海から黒海へ"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "バルト海から黒海まで広がるポーランドが東欧全域の交易を支配する。"
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "リトアニア教会"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "リトアニアのカトリック化完成によりポーランド・リトアニア連合の精神的統合が達成された。"
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "王の街道"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "クラクフからグダニスクまでの王の街道が整備され、王国の行政・通商・軍事の効率が向上した。"

 pol_kingdom_of_poland_tooltip: "正統性100以上、安定度30以上"
 pol_integrate_mazovia_tooltip: "プウォツク（plock）とワルシャワ（warsaw）を自国が直接所有している"
 pol_silesia_integration_tooltip: "ヴロツワフ（wroclaw）を自国または属国が領有し、シレジア地域に8以上のロケーション保有。報酬でボヘミアへの王位請求CB取得"
 pol_bohemian_claim_tooltip: "ボヘミア（c:BOH）と同君連合か従属国関係にある、もしくはプラハ（prague）を自国が直接所有している"
 pol_hungarian_union_tooltip: "ハンガリー（c:HUN）と同君連合か従属国関係にある、もしくはブダ（buda）を自国が直接所有している"
 pol_moldavia_vassal_tooltip: "モルダヴィア（c:MOL）と同君連合か従属国関係にある、もしくはウンゲニ（ungheni）をハンガリーか自国または属国が領有している"

 pol_lithuanian_relations: "リトアニアとの関係"
 pol_lithuanian_relations_desc: "リトアニア大公国はポーランドにとって最も重要な隣国であり、潜在的な同盟者あるいは最大の脅威だ。14世紀のリトアニアはヨーロッパ最後の異教国家でありながら、バルト海から黒海まで広がる強大な国家だった。ヤドヴィガ女王の婚姻政策によってリトアニアと同君連合を結ぶためには、まず両国の外交関係を整備する必要がある。関係を友好的に保つか、あるいは軍事的圧力をかけることで、ポーランドはリトアニアへの王位継承権を主張できる。"
 pol_lithuanian_relations_tooltip: "リトアニア（c:LIT）の友好度が100以上、もしくは同盟中、もしくはライバルである、もしくはヴィリニュス（vilnius）を自国または属国が領有している"

 pol_develop_ruthenia_desc: "ガリチア（ハリチ）とヴォルィーニは赤ルーシを構成する二大公国だ。ガリチア公国（HAL）の中心都市リヴィウ（レンベルク）とヴォルィーニ公国（VOL）はポーランドが1349〜66年に征服した。ベウズもまたルテニアの重要拠点だ。ガリチア・ヴォルィーニ両公国をポーランドの同君連合下に置くか、リヴィウとベウズを直接領有することで、赤ルーシ全体の支配が確立される。この地はヨーロッパ最大の農業生産地帯の一つであり、その豊かな土地がポーランドの人口と経済を支える。"
 pol_develop_ruthenia_tooltip: "ガリチア（c:HAL）とヴォルィーニ（c:VOL）が同君連合、もしくはリヴィウ（lviv）とベウズ（belz）を自国または属国が領有している"
 pol_hre_influence_tooltip: "ハプスブルク（c:HAB）と同盟・友好度150以上・ライバルのいずれか、もしくは戦力投射20以上。報酬でハプスブルクへの王位請求CB取得"
 pol_upper_silesia_mines_tooltip: "シレジア地域にRGOレベル5以上のロケーションが3箇所以上ある。報酬でシレジア地域全体にlocal_max_rgo_size_modifier 20%付与"
 pol_moldavia_vassal_tooltip: "モルダヴィア（c:MOL）と同君連合か従属国関係にある、もしくはヤシュ（iasi）をハンガリーか自国または属国が領有している"
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "上シレジア鉱山"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "上シレジアの銀・亜鉛・鉛の鉱山が本格稼働している。RGO最大規模が拡大し、より多くの産出が可能になる。"

 pol_catholicism_of_lithuania_tooltip: "ヴィリニュス（vilnius）を自国または属国が領有し、そのPOPの過半数がカトリックである"
 pol_gniezno_church_tooltip: "グニェズノ（gniezno）が都市（city）以上のランクである"
 pol_black_sea_access_tooltip: "ザポリージャ地域（zaporizhzhia_area）に5ロケーション以上を保有している"
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "ポーランドのバルト海艦隊"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "グダニスクを拠点とするポーランド艦隊がバルト海の制海権を握った。ヴィスワ川の河口から北海まで、ポーランドの旗が海上に翻る。"
 STATIC_MODIFIER_NAME_pol_livonia_mod: "リヴォニアの支配"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "リガとタリンを含むリヴォニアの支配が確立した。異なる文化を持つ住民を包摂する政策と税収効率の向上でポーランドの国力が増す。"
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "ハンザ同盟との絆"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "ハンザ同盟都市との緊密なネットワークが商人維持費を削減し、商人の総容量を大幅に拡大する。"
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "トランシルヴァニアへの影響力"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "ハンガリーとの同君連合を通じたトランシルヴァニアへの影響力が、ポーランドの文化的包容力と外交力を高める。"

 pol_breadbasket_town_right_tt: "都市特権【帝国のパン籠（Imperial Breadbasket）】が利用可能になった。穀倉を5以上建設した都市ランク以上のロケーションに付与することができる。"
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "ワルシャワ王都の整備"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "ワルシャワが整備されたことで、首都からの行政効率が向上し、人口収容力が拡大した。マゾフシェ統合の中心として、ワルシャワは王国の行政拠点となる。"
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "クラクフの繁栄"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "ヴァヴェル城を中心とするクラクフが本格整備された。RGO最大規模の拡大と毎月の繁栄向上で、ポーランド王都にふさわしい都市へと発展する。"
