l_japanese:
 bur_crown_of_lothair_mission_pack: "ロタリンギアの王冠"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337年、百年戦争の端緒。フランスとイングランドの間に挟まれたブルゴーニュ公国は、どちらの陣営にも与せず巧みな外交で生き残り、やがて「フランク王国」の後継者たる「ロタリンギア」を復興させる夢を持つ。フランドル布地・金羊毛騎士団・ディジョンの宮廷という三本柱で内政を固め、英仏間の立ち回りで外交的優位を確立し、フランシュ＝コンテ・ロレーヌ・ネーデルラントを統合して「ロタリンギア王国」を再建せよ。"
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "ブルゴーニュとして、百年戦争を立ち回り、内政を固め、ロタリンギアを再建せよ。"
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して「ロタリンギアの王冠」を手にせよ。"
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "英仏の間で生き残り、ロタリンギアを復興せよ！"

 bur_duchy_of_burgundy: "ブルゴーニュ公国の野望"
 bur_duchy_of_burgundy_desc: "1337年、ブルゴーニュ公爵家はフランス王家ヴァロワ朝の分家として台頭した。オトン4世（ゲームでは「善良公フィリップ」の先代）の時代から、ブルゴーニュは英仏の対立を利用してフランドル・フランシュ＝コンテ・ロレーヌへの拡張を企てる。百年戦争はこの小王国を歴史の主役にする千載一遇の機会だ。"
 bur_duchy_of_burgundy_tooltip: "条件なし"

 bur_court_of_dijon: "ディジョンの宮廷"
 bur_court_of_dijon_desc: "ブルゴーニュ公国の首都ディジョンは、15世紀のヨーロッパで最も華やかな宮廷の一つとして知られた。芸術家・音楽家・学者を招き寄せたブルゴーニュ宮廷は、「北方ルネサンス」の先駆けともいえる文化的輝きを放った。ヤン・ファン・エイクら偉大な芸術家たちがこの宮廷の庇護を受けた。"
 bur_court_of_dijon_tooltip: "正統性（legitimacy）100、安定度（stability）30以上"

 bur_flemish_cloth: "フランドルの布地産業"
 bur_flemish_cloth_desc: "ブリュージュ・ヘント・イープルを中心とするフランドルの布地産業は中世ヨーロッパ最大の工業地帯だった。イングランドから輸入した原毛を精巧な技術で加工するフランドルの布地（ドラップ）はヨーロッパ全土の市場で高い評価を受け、ブルゴーニュの財政的基盤となった。"
 bur_flemish_cloth_tooltip: "生地（cloth）を5以上または高級生地（fine_cloth）を3以上国内生産している"

 bur_golden_fleece: "金羊毛騎士団"
 bur_golden_fleece_desc: "1430年にフィリップ善良公がブリュージュで創設した「金羊毛騎士団（オルドル・ドゥ・ラ・トワゾン・ドール）」は、中世最高の騎士団の一つだ。アルゴナウタイ（黄金の羊毛を求めた英雄たち）の伝説に基づくこの騎士団の章（金羊の毛皮のペンダント）はカトリック君主への最高の栄誉章として19世紀まで使われ続けた。"
 bur_golden_fleece_tooltip: "現在の日付が1400年以降である"

 bur_estates_general: "三部会の整備"
 bur_estates_general_desc: "ブルゴーニュ公爵家は貴族・聖職者・市民という三身分を代表する「三部会（エタ・ジェネロー）」を整備した。複合国家として多様な地域を統治するブルゴーニュには、合議制による統治が不可欠だった。フランドル・ブラバント・フランシュ＝コンテといった多様な「ネイション」を一つの旗の下にまとめる制度的基盤だ。"
 bur_estates_general_tooltip: "国家の総人口が1000ポップ以上（約100万人）"

 bur_feast_of_pheasants: "雉の饗宴"
 bur_feast_of_pheasants_desc: "1454年の「雉の饗宴（ル・バンケ・ドゥ・フェザン）」はブルゴーニュ宮廷史上最大の催し物だ。フィリップ善良公はコンスタンティノープル陥落に衝撃を受け、この豪奢な晩餐会で十字軍への参加を誓約した。騎士たちは生きた雉の上で聖なる誓いを立てた——実現しなかったが、この誓いはブルゴーニュの威信を頂点に押し上げた。"
 bur_feast_of_pheasants_tooltip: "毎月の威信0.30以上、教皇領からの評価100以上"

 bur_balance_of_power: "英仏の間で"
 bur_balance_of_power_desc: "ブルゴーニュ外交の真髄は「バランサー」としての役割だ。フランス王の封臣でありながら神聖ローマ帝国にも連なり、イングランドとも同盟できるブルゴーニュは、どちらの陣営にも与せず両国から最大の利益を引き出す独特の立場にある。この二つの大国の対立こそブルゴーニュが台頭するための最大の機会だ。"
 bur_balance_of_power_tooltip: "戦力投射（power_projection）7以上"

 bur_ally_england: "イングランドとの同盟"
 bur_ally_england_desc: "1419年のモントロー橋の事件でジャン無畏公がフランスのドーファン（後のシャルル7世）に暗殺されたことで、ブルゴーニュはイングランドと同盟しフランスに宣戦した。1420年のトロワ条約でイングランド王ヘンリー5世がフランス王位を継承することが決まり、ブルゴーニュはその主要な支持者となった。"
 bur_ally_england_tooltip: "イングランド（c:ENG）と同盟しており、イングランドからの評価が100以上"

 bur_treaty_of_troyes: "トロワ条約の実現"
 bur_treaty_of_troyes_desc: "1420年のトロワ条約はフランス王シャルル6世がイングランド王ヘンリー5世をフランスの摂政・後継者と認めたものだ。ブルゴーニュの支持なしにこの条約は成立しなかった。パリとランスを掌握することでフランス王国の実質的支配者となる道が開ける。"
 bur_treaty_of_troyes_tooltip: "ランスとパリを自国または服属国が領有している"

 bur_ally_france: "フランスとの和解"
 bur_ally_france_desc: "1435年のアラス条約でブルゴーニュはイングランドから離れ、シャルル7世のフランスと和解した。フィリップ善良公はフランス王への形式的な臣従を免除され、マコン・オーセルなどの戦略的都市を得た。この外交的転換はブルゴーニュを最終的な勝者とし、百年戦争でのフランス側の最終勝利を可能にした。"
 bur_ally_france_tooltip: "フランス（c:FRA）と同盟しており、フランスからの評価が100以上"

 bur_treaty_of_arras: "アラス条約の精神"
 bur_treaty_of_arras_desc: "1435年のアラス条約はブルゴーニュ外交の最大の勝利だった。イングランドを見捨てフランスと和解することで、ブルゴーニュはロレーヌへの影響力拡大と引き換えに形式的臣従を免除された。この「フランスなき勝利」で得た利益を活かし、さらなる拡張へと進む。"
 bur_treaty_of_arras_tooltip: "ロレーヌ地方に10以上のロケーションを所有し、フランスからの評価が150以上"

 bur_flanders_in_the_war: "百年戦争のフランドル"
 bur_flanders_in_the_war_desc: "フランドル伯国は英仏百年戦争における最重要の係争地の一つだった。イングランドはフランドルの布地産業に羊毛を供給することで経済的影響力を持ち、フランドルの都市はイングランド側と協力することも多かった。一方でフランス王はフランドル伯を封臣として主張し続けた。ブルゴーニュはフランドルの布地産業の恩恵を受ける立場として、この地方を自陣営に引き込む必要がある。"
 bur_flanders_in_the_war_tooltip: "FLA（フランドル）がイングランドの属国であるか、FLAからの評価が150以上であるか、またはFLAが存在しない"

 bur_integrate_brabant: "ブリュッセルへの道"
 bur_integrate_brabant_desc: "アントウェルペンを中心とするブラバント公国は、フランドルと並ぶネーデルラント最大の経済拠点だった。「黄金の拍車の戦い」（1302年）でフランス軍を破った誇り高いブラバント人を統合することで、ブルゴーニュはネーデルラント全体の覇者となる。後のハプスブルク帝国の核心部をここに確立する。"
 bur_integrate_brabant_tooltip: "ブラバント地方に10以上のロケーションを所有し、アントウェルペンを自国または服属国が領有している"

 bur_integrate_franche_comte: "ドールを掌握する"
 bur_integrate_franche_comte_desc: "ドールはフランシュ＝コンテの首都であり、ドール大学（1422年設立）はブルゴーニュ公爵家の支援を受けた知的拠点だ。この都市を掌握することはフランシュ＝コンテ全体の実効支配を意味し、ロレーヌ方面への拡張路を開く。"
 bur_integrate_franche_comte_tooltip: "ドール（dole）を自国または属国が領有している"

 bur_expand_into_lorraine: "ロレーヌへの進出"
 bur_expand_into_lorraine_desc: "ナンシーはロレーヌ公国の首都だ。シャルル突進公は1477年のナンシーの戦いでこの地に執着したが命を落とした——歴史をここで変えよ。ナンシーを掌握することでロレーヌ全土が手に届き、ルクセンブルクへの道が開ける。"
 bur_expand_into_lorraine_tooltip: "ナンシー（nancy）を自国または属国が領有している"

 bur_king_of_the_franks: "フランク王"
 bur_king_of_the_franks_desc: "カール大帝の帝国が843年のヴェルダン条約で三分割されて以来、「フランク王国」の後継者は誰かという問いはヨーロッパ政治の根本的テーマだった。フランス・ドイツ・イタリアのいずれもが正統な後継者を主張した。ブルゴーニュがパリを制し、フランク王の王冠を戴くことで、この千年の問いに独自の答えを出す。"
 bur_king_of_the_franks_tooltip: "パリを自国または服属国が領有しているか、フランスが存在しない。200以上のロケーションを所有する"

 bur_crown_of_lothair: "ロタリンギアの王冠"
 bur_crown_of_lothair_desc: "843年のヴェルダン条約で中フランク（ロタリンギア）を相続したロタール1世の王国は、ライン川沿いのフランドルからイタリアまで縦断する「中間王国」だった。870年のメルセン条約でフランスとドイツに分割されたこの王国を1000年ぶりに復興させる——ブルゴーニュはロタリンギアの真の後継者として、フランス・ドイツの両大国を超える存在となる。"
 bur_crown_of_lothair_tooltip: "フランス地域に50以上、ロレーヌに10以上、フランドルに15以上のロケーションを所有し、合計300以上のロケーションを保有する"

 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "ディジョンの宮廷"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "ヨーロッパ最高の文化的宮廷の一つとして知られたディジョン宮廷は、北方ルネサンスを牽引した芸術家・学者の集積地だった。ヤン・ファン・エイクやロヒール・ファン・デル・ウェイデンらの巨匠がここで活動し、ブルゴーニュ公爵家の文化的威信を高めた。"
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "フランドル布地産業"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "ブリュージュ・ヘント・イープルを結ぶフランドル布地産業の三角地帯は中世最大の工業地帯だった。イングランドの羊毛をフランドルの職人が加工し、シャンパーニュの大市を通じてヨーロッパ全土に販売されるこのサプライチェーンがブルゴーニュの富の源泉だ。"
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "金羊毛騎士団"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "フィリップ善良公が1430年に創設した金羊毛騎士団は、カトリック世界最高の騎士団として君主・大公・皇帝のみが会員となれる排他的な名誉の場だった。この騎士団の紋章を与えることはブルゴーニュが外交的に君主と対等であることを示す。"
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "三部会"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "貴族・聖職者・市民の三身分から成るブルゴーニュ三部会は、複合国家の多様な地域を代表する合議機関だ。フランドル・ブラバント・フランシュ＝コンテといった異なる法的伝統を持つ地域を一つの統治体制のもとに統合するための制度的柱となった。"
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "雉の饗宴の誓い"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "1454年、コンスタンティノープル陥落に触発されたフィリップ善良公が開いた「雉の饗宴」でブルゴーニュ宮廷の騎士たちは十字軍への参加を誓った。この壮麗な催しはキリスト教世界の守護者としてのブルゴーニュの宗教的権威を象徴し、教皇との関係を強化した。"
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "英仏の間で"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "英仏の狭間でバランサーとして振る舞うブルゴーニュは、どちらの側の宗主国にも完全には服従せず、その曖昧な立場を最大限に活用する。百年戦争の混乱の中で封臣義務から距離を置き、独自の召集軍を増強する好機だ。"
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "イングランドとの同盟"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "モントロー橋の暗殺事件（1419年）以降、ブルゴーニュとイングランドは対フランス同盟を結んだ。この同盟の軍事的相乗効果が1420年のトロワ条約を可能にし、ヘンリー5世のフランス王位継承という前例のない結果をもたらした。"
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "トロワ条約の成果"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "ブルゴーニュの支持を得てイングランドがフランス王位を主張したトロワ条約は、百年戦争の最大の転換点だった。この成果を足がかりに、ブルゴーニュはフランス王国の実質的支配者として名実ともに権力の頂点に立つ。"
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "フランスとの和解"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "1435年のアラス条約でフランスに鞍替えしたブルゴーニュは、戦略的に最も有利な立場を確保した。イングランドを孤立させフランスの勝利を後押しすることで、ブルゴーニュは勝者側の最大の受益者となった。"
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "アラス条約の成果"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "アラス条約でシャルル7世に形式的な謝罪を迫りながら、実質的な臣従義務を免れたフィリップ善良公は、この条約を「ブルゴーニュ独立の礎」とした。フランスの再統一を助けながらも独自の王国建設への道を歩み続けた。"
 STATIC_MODIFIER_NAME_bur_flanders_in_the_war_mod: "百年戦争のフランドル（未使用）"
 STATIC_MODIFIER_DESC_bur_flanders_in_the_war_mod: "未使用"
 STATIC_MODIFIER_NAME_bur_integrate_brabant_mod: "ブラバント統合"
 STATIC_MODIFIER_DESC_bur_integrate_brabant_mod: "アントウェルペンは15世紀末から16世紀にかけて北海最大の商業都市として台頭した。プランタン印刷所・ダイヤモンド取引・スペイン銀との交易——このブラバントの中心都市を確保することはネーデルラント全体の制覇を意味する。"
 STATIC_MODIFIER_NAME_bur_integrate_franche_comte_mod: "フランシュ＝コンテ統合"
 STATIC_MODIFIER_DESC_bur_integrate_franche_comte_mod: "「自由な伯爵領」フランシュ＝コンテの塩鉱・製鉄業・ドール大学はブルゴーニュの経済的基盤を強化する。ジュラ山脈が作る天然の要塞もまたこの地の軍事的価値を高めている。"
 STATIC_MODIFIER_NAME_bur_expand_into_lorraine_mod: "ロレーヌ進出"
 STATIC_MODIFIER_DESC_bur_expand_into_lorraine_mod: "フランスとドイツの間に挟まれたロレーヌは常に係争地だったが、ブルゴーニュにとってはネーデルラントとブルゴーニュ本土を結ぶ陸橋として戦略的に不可欠な地だ。ナンシーを首都とするこの公国の掌握はブルゴーニュを真に「中間王国」の復興者とする第一歩だ。"
 STATIC_MODIFIER_NAME_bur_king_of_the_franks_mod: "フランク王の称号"
 STATIC_MODIFIER_DESC_bur_king_of_the_franks_mod: "カール大帝の後継者としてのフランク王の称号は、フランス王のみが保持してきた。ブルゴーニュがパリを制し、この称号を奪うことは中世政治史上最大の逆転劇だ。フランス・ドイツ・イタリアの上に立つ「フランク王」として、ヨーロッパ政治の中心に君臨する。"
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "ロタリンギアの王冠"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "870年のメルセン条約で消滅したロタリンギア王国が1000年ぶりに復活した。フランドルからフランシュ＝コンテ、ロレーヌからブルゴーニュ本土まで、カール大帝の中フランク王国の後継者として、ブルゴーニュはヨーロッパ中央部の主宰者となった。"

 bur_events.1.t: "ブルゴーニュ公国の野望"
 bur_events.1.d: "1337年、英仏百年戦争の火蓋が切られようとしている。エドワード3世はフランス王位を主張してフランスに宣戦した——しかしブルゴーニュ公国は今、その渦中で独自の未来を描いている。フランス王家ヴァロワ朝の分家でありながら、強大なフランドル布地産業と精鋭の騎士団を持つブルゴーニュは、英仏どちらにも服さない「第三の道」を歩む力を持つ。ディジョンの豪奢な宮廷から、フランドルの繁栄する商業都市まで、ブルゴーニュ公国はヨーロッパ最大の野心を秘めた小国だ。"
 bur_events.1.a: "ブルゴーニュよ、英仏の間で己の道を切り開け！"

 bur_events.2.t: "雉の饗宴"
 bur_events.2.d: "1454年（史実）、フィリップ善良公はリールの城で空前絶後の宴を催した。生きた雉が宴席に運ばれ、参加者たちは「神・聖母マリア・雉」に賭けて十字軍への参加を誓った。フィリップ自身も「もし自らの君主（フランス王）が聖地遠征に赴くなら、我も従う」と誓約した。この誓いは実現しなかったが、コンスタンティノープル陥落の衝撃を受けたヨーロッパに、ブルゴーニュが騎士道精神の守護者であることを示した。宴の規模は凄まじく、テーブルの上には大型船の模型・修道院の建物・風車・城が置かれ、会場では奇術師・詩人・演奏家が競演した。"
 bur_events.2.a: "神の栄光のために、十字軍への参加を誓う！"

 bur_events.3.t: "ロタリンギア王国の復活"
 bur_events.3.d: "843年のヴェルダン条約でカール大帝の帝国が三分割された時、「ロタリンギア」はライン川沿いにフランドルからイタリアまで縦断する中間王国として生まれた。しかし870年のメルセン条約でこの王国はフランス・ドイツに飲み込まれ、1000年の歴史から消えた。今、ブルゴーニュ公爵家の手によって、フランス王もドイツ皇帝も認めなかった「中間王国」が歴史の舞台に蘇る。英仏百年戦争を巧みに立ち回り、フランドル・フランシュ＝コンテ・ロレーヌを統合したブルゴーニュは、ここにロタリンギアの王冠を戴く。"
 bur_events.3.a: "ロタリンギアの王冠よ、我が頭上に輝け！"

 bur_duchy_of_burgundy_tooltip: "百年戦争が発生している"

 bur_burgundy_wine: "ブルゴーニュワイン"
 bur_burgundy_wine_desc: "コート・ド・ニュイとコート・ド・ボーヌのぶどう畑は中世から教皇や王侯を魅了するワインを生んできた。クレルヴォーの聖ベルナールが「神の飲み物」と称えたブルゴーニュワインは、シトー会修道士たちが丁寧に cultivateした結果だ。ヴォルネイ・ポマール・ジュヴレ＝シャンベルタンの名は今日も世界最高のワインとして君臨する。"
 bur_burgundy_wine_tooltip: "ワイン（wine）を5以上国内生産している"
 bur_court_of_beaune: "ボーヌのオテル＝デュー"
 bur_court_of_beaune_desc: "1443年、ニコラ・ロランとその妻グィーニュ・ド・サランはボーヌに「神の宿（オテル＝デュー）」と呼ばれる施療院を建設した。フランドル・ゴシック様式の多色タイル屋根が特徴的なこの建物は現在もほぼ原形を留め、世界文化遺産に匹敵する価値を持つ。ロランはブルゴーニュ公の宰相としてこの「貧者のための宮殿」を建てた。"
 bur_court_of_beaune_tooltip: "修道院（monastery）を5箇所以上所有し、毎月の威信0.15以上"
 bur_printing_press: "印刷術の普及"
 bur_printing_press_desc: "1450年代のグーテンベルクの活版印刷革命はブルゴーニュにも急速に広まった。ブリュージュでは1476年にコルネリス・マンスが最初の印刷所を開設した。印刷物の普及は識字率を高め、ルネサンス思想をネーデルラント中に広めた。この知識の民主化がブルゴーニュの文化的優位をさらに強固にする。"
 bur_printing_press_tooltip: "ルネサンスを受容し、大学（university）を2箇所以上所有する"
 bur_council_of_mechelen: "メヘレン大評議会"
 bur_council_of_mechelen_desc: "マリア・ド・ブルゴーニュの摂政マクシミリアン1世が1473年に設置しようとした「メヘレン大評議会（グラン・コンセイユ）」は、ブルゴーニュ複合国家全体を管轄する中央裁判所として機能した。ブラバント・フランドル・フランシュ＝コンテのそれぞれの法的伝統を上回る「帝国的司法」の創設は、真の中央集権国家への第一歩だ。"
 bur_council_of_mechelen_tooltip: "メヘレン（mechelen）を自国が直接領有している（owns）"
 bur_mapmaking: "ブルゴーニュ地図"
 bur_mapmaking_desc: "15世紀のネーデルラントは地図制作の先進地だった。フランドルの商人たちはポルトガルの海図やイタリアの地理学知識を積極的に取り込み、ブルゴーニュの広大な版図を精密に描いた地図を作成した。これらの地図は後のメルカトル（フランドル出身）の革命的地図投影法への道を開いた。"
 bur_mapmaking_tooltip: "50以上のロケーションを所有し、月収合計20以上"
 bur_champagne_fairs: "シャンパーニュの大市"
 bur_champagne_fairs_desc: "トロワ・プロヴァン・ラニー・バル＝シュル＝オーブで開かれるシャンパーニュの大市は12〜14世紀のヨーロッパ最大の定期市だった。イタリアの絹・フランドルの布地・北欧の毛皮が交換されるこの国際市場の衰退後も、ブルゴーニュはその後継者として中西欧の交易の要衝に立つ。"
 bur_champagne_fairs_tooltip: "月収合計12以上、市場中心地（market center）を1つ以上保有する"
 bur_compagnie_d_ordonnance: "オルドナンス騎兵隊"
 bur_compagnie_d_ordonnance_desc: "1471年にシャルル突進公が創設した「オルドナンス騎兵隊（コンパニー・ドルドナンス）」はブルゴーニュ軍事改革の象徴だ。規律ある常設重騎兵部隊は中世末期の傭兵依存から脱却した最初期の近代的軍隊の一形態であり、後のスペイン・テルシオに影響を与えた。"
 bur_compagnie_d_ordonnance_tooltip: "陸軍規模10以上、軍事的伝統の月次成長0.05以上"
 bur_ransom_diplomacy: "身代金外交"
 bur_ransom_diplomacy_desc: "百年戦争の騎士戦争文化では、高貴な捕虜の身代金が重要な外交・財政の手段だった。ポワティエの戦い（1356年）でフランス王ジャン2世を捕虜にしたイングランドが1600万エキュという天文学的身代金を要求したように、ブルゴーニュも戦場での勝利を外交カードとして活用する術を心得ている。"
 bur_ransom_diplomacy_tooltip: "月収合計15以上、外交的評価3以上"
 bur_siege_of_calais: "カレーの占領"
 bur_siege_of_calais_desc: "カレーはイングランドがフランス北岸に保持した最後の拠点（1347〜1558年）だった。「カレーの市民」（ロダンの彫刻で有名）の物語は英仏百年戦争の悲劇を象徴する。この戦略的港湾を掌握することで、ブルゴーニュは北海交易の要衝を手中に収め、イングランドとの同盟の実利を最大化する。"
 bur_siege_of_calais_tooltip: "カレーを自国または服属国が領有している"
 bur_english_alliance_secured: "英仏二国を超えた覇権"
 bur_english_alliance_secured_desc: "ブルゴーニュとイングランドの完全な同盟関係が確立し、フランスを分割する計画が実現した。ルーアンを掌握してノルマンディーを支配し、イングランドを傘下に収めることでブルゴーニュは英仏戦争の真の勝者として君臨する。"
 bur_english_alliance_secured_tooltip: "ルーアンを領有し、イングランドが服属国である"
 bur_trial_of_joan: "ジャンヌ・ダルクの処刑"
 bur_trial_of_joan_desc: "1430年にブルゴーニュ軍がコンピエーニュでジャンヌ・ダルクを捕虜にし、イングランドに売却した史実は歴史上最も皮肉な出来事の一つだ。しかし今やブルゴーニュはフランス側についている。フランスの最大の英雄を「殺した」過去を乗り越え、フランスとともに戦うことで、ブルゴーニュは真の「キリスト教世界の守護者」として名誉を回復する。"
 bur_trial_of_joan_tooltip: "ルーアンを領有し、イングランドと戦争中またはイングランドが存在しない"
 bur_france_allied_secured: "フランスとの完全同盟"
 bur_france_allied_secured_desc: "フランスとの同盟を完成させ、イングランドを追い出した後のフランス西部を掌握する。アラス条約の精神を受け継ぎながら、ブルゴーニュはフランス最大の「後援者」として振る舞い、最終的にその庇護下の国家として組み込む。"
 bur_france_allied_secured_tooltip: "フランスが服属国または存在しない、フランス地域に30以上のロケーションを所有する"
 bur_secure_artois: "アルトワの確保"
 bur_secure_artois_desc: "アルトワはブルゴーニュ公家の世襲領であり、アラス・ヴァランシエンヌを擁する豊かな地方だ。1435年のアラス条約でブルゴーニュはこの地への支配を強化したが、フランスとの係争は続いた。アラスを中心とするこの地方を完全に掌握することは、ブルゴーニュのネーデルラント支配の南方基盤を固める。"
 bur_secure_artois_tooltip: "アラスとヴァランシエンヌを自国または服属国が領有している"
 bur_dominate_picardy: "ピカルディ制圧"
 bur_dominate_picardy_desc: "ピカルディはフランス北部でブルゴーニュとイングランドの势力が交錯した係争地だ。アミアン大聖堂を擁するこの平野地帯を支配することで、ブルゴーニュはパリへの直接の回廊を確保し、フランス侵攻の足がかりとする。"
 bur_dominate_picardy_tooltip: "アミアンを領有し、ワロン地方に5以上のロケーションを所有する"
 bur_hainaut_namur: "エノーとナミュールを相続する"
 bur_hainaut_namur_desc: "エノー伯国とナミュール伯国はブルゴーニュとブラバントの間に位置する豊かな地方だ。フィリップ善良公は1421年にナミュールを買収し、1433年にエノーを相続することでネーデルラントを南北に繋ぐ回廊を確保した。この統合はブルゴーニュの「ネーデルラント複合国家」の核心を成す。"
 bur_hainaut_namur_tooltip: "ナミュールとモンスを自国または服属国が領有している"
 bur_holland_zeeland: "ホラントとゼーラントの掌握"
 bur_holland_zeeland_desc: "ホラント伯国とゼーラント伯国はアムステルダム・ライデン・ドルトレヒトなどの商業都市を擁する北海沿岸の豊かな地方だ。1428年にフィリップ善良公が征服したこれらの地は後のオランダの中核となる。ニシン漁業と海上交易で栄えるこの地方をネーデルラント帝国の一部として確保する。"
 bur_holland_zeeland_tooltip: "ロッテルダム（rotterdam）とアムステルダム（amsterdam）を自国または属国が領有している"
 bur_luxemburg: "ルクセンブルクの掌握"
 bur_luxemburg_desc: "ルクセンブルク公国は神聖ローマ帝国最大の公国の一つで、ハプスブルク家との係争の的だった。フィリップ善良公は1443年にルクセンブルクを征服してブルゴーニュの版図に加えた。この山岳要塞の地はロレーヌとアルザスへの拡張の足がかりとなる。"
 bur_luxemburg_tooltip: "ルクセンブルクを自国または服属国が領有している"
 bur_dominate_alsace: "アルザスの制圧"
 bur_dominate_alsace_desc: "アルザスはライン川西岸のドイツ語圏でフランスと神聖ローマ帝国の間に挟まれた係争地だ。シャルル突進公は1469年にアルザスの管理権を買収してハプスブルク家から奪ったが、最終的にはスイス連邦の攻撃を招いた。ストラスブールを中心とするこの地方を掌握することはライン川流域支配の核心だ。"
 bur_dominate_alsace_tooltip: "アルザス地方に5以上のロケーションを所有し、ストラスブールを自国または服属国が領有している"
 bur_dominate_rhine: "ライン河の支配"
 bur_dominate_rhine_desc: "ライン川はローマ時代から「文明とバルバリアの境界」とされてきた大河だ。ネーデルラントからアルザスまでライン川流域を掌握することで、ブルゴーニュは中西欧を貫く大交易路を完全にコントロールする立場に立つ。カール大帝がフランク王国の心臓部と定めたこのライン回廊こそロタリンギアの本質だ。"
 bur_dominate_rhine_tooltip: "ライン地方（rhineland_area）に8以上のロケーションを所有する"
 bur_lotharingia_united: "ロタリンギアの統一"
 bur_lotharingia_united_desc: "ロレーヌ・フランドル・ホラントという三つの中核地域が統合されつつある。これこそカール大帝の「中間王国」が再び現実となりつつある証拠だ。フランスでもドイツでもない「第三の道」——ブルゴーニュが実現しようとしているのはその夢だ。"
 bur_lotharingia_united_tooltip: "ロレーヌ12以上、フランドル15以上、ホラント8以上のロケーションを所有する"
 bur_dutch_towns: "ネーデルラント都市の繁栄"
 bur_dutch_towns_desc: "アムステルダム・ライデン・ユトレヒト——これらのホラント都市は15〜16世紀に急速な発展を遂げた。毛織物業・造船業・海上貿易が相互に補完するこの経済圏は、後の「オランダの黄金時代」の基盤だ。ブルゴーニュの庇護の下でこれらの都市が繁栄することで、公国全体の経済力が飛躍的に高まる。"
 bur_dutch_towns_tooltip: "ホラント地方に市場（market）3箇所以上、ユトレヒトを領有"
 bur_north_sea_trade: "北海交易の支配"
 bur_north_sea_trade_desc: "北海はハンザ同盟・イングランド・スコットランド・スカンジナビアを結ぶ中世北ヨーロッパ最大の交易空間だった。ニシン・羊毛・木材・穀物・皮革——これらの必需品がアムステルダムとブリュージュを経由して流通した。ブルゴーニュが北海の制海権を握ることは西欧全体の交易を支配することを意味する。"
 bur_north_sea_trade_tooltip: "海軍規模15以上、市場中心地（market center）を2つ以上保有する"
 bur_burgher_power: "市民階級の権力"
 bur_burgher_power_desc: "ブルゴーニュのネーデルラント都市では、商人・職人・金融業者からなる市民階級が政治的発言力を持っていた。ヘント・ブリュージュ・アントウェルペンの市民は自治権を守るために公爵と交渉し、時に反乱を起こした。この「市民の力」を制度的に取り込むことがブルゴーニュ式統治の革新だった。"
 bur_burgher_power_tooltip: "市場（market）を8箇所以上所有し、総人口500ポップ以上"
 bur_the_great_duchy: "大公国"
 bur_the_great_duchy_desc: "神聖ローマ帝国の大諸侯・フランスの封臣・北海の交易大国——ブルゴーニュはもはや「大公国（グラン・デュシェ）」と呼ぶに足る規模と権威を持つ存在だ。後に「タイムズ紙が報じなかった15世紀最大の遺産」と評された「幻の第三の国」——ブルゴーニュがそれを実現する時が来た。"
 bur_the_great_duchy_tooltip: "100以上のロケーションを所有し、総人口1000ポップ以上"

 STATIC_MODIFIER_NAME_bur_burgundy_wine_mod: "ブルゴーニュワイン"
 STATIC_MODIFIER_DESC_bur_burgundy_wine_mod: "コート・ド・ニュイとコート・ド・ボーヌのシトー会修道士が千年かけて磨き上げたぶどう栽培の伝統が、ブルゴーニュを世界最高のワイン産地の一つとした。この「ピノ・ノワールの王国」の名声は公爵家の威信に直接結びついている。"
 STATIC_MODIFIER_NAME_bur_court_of_beaune_mod: "オテル＝デュー"
 STATIC_MODIFIER_DESC_bur_court_of_beaune_mod: "宰相ニコラ・ロランが1443年にボーヌに建設した施療院は「貧者のための宮殿」と呼ばれた。フランドル・ゴシック様式の多色タイル屋根を持つこの建物は、ブルゴーニュ公爵家の慈善精神と芸術的センスの結晶だ。"
 STATIC_MODIFIER_NAME_bur_printing_press_mod: "印刷術の普及"
 STATIC_MODIFIER_DESC_bur_printing_press_mod: "グーテンベルクの印刷革命はネーデルラントに急速に広まった。ブリュージュやアントウェルペンの印刷所から流れ出る書物が識字率を高め、ルネサンス思想を普及させた。後のエラスムス（ロッテルダム出身）の人文主義はこの知的土壌から生まれた。"
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "メヘレン大評議会"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "メヘレンに設置された大評議会は、ブルゴーニュの複合国家を一元的に統治する中央裁判所だった。フランドル・ブラバント・フランシュ＝コンテのバラバラな法体系を統合するこの機関は、ネーデルラント共和国の先駆的統治機構となった。"
 STATIC_MODIFIER_NAME_bur_mapmaking_mod: "ブルゴーニュ地図"
 STATIC_MODIFIER_DESC_bur_mapmaking_mod: "フランドルの地図製作者たちは大航海時代の地理的革命を牽引した。後にメルカトルが完成させる近代地図投影法の萌芽がここに見える。正確な地図は遠距離統治と軍事作戦の効率を大幅に高めた。"
 STATIC_MODIFIER_NAME_bur_champagne_fairs_mod: "シャンパーニュの大市の後継"
 STATIC_MODIFIER_DESC_bur_champagne_fairs_mod: "衰退したシャンパーニュ大市に代わって、ブリュージュとアントウェルペンがヨーロッパ最大の交易都市として台頭した。イタリア・ハンザ・イベリアの商人が集うこれらの市場はブルゴーニュ経済の新たな心臓部だ。"
 STATIC_MODIFIER_NAME_bur_ransom_diplomacy_mod: "身代金外交"
 STATIC_MODIFIER_DESC_bur_ransom_diplomacy_mod: "百年戦争の騎士道的戦争文化において、高貴な捕虜の身代金は重要な外交・財政の手段だった。ブルゴーニュはこの慣行を巧みに活用し、戦場での勝利を外交的優位へと変換する術を磨いた。"
 STATIC_MODIFIER_NAME_bur_compagnie_d_ordonnance_mod: "コンパニー・ドルドナンス"
 STATIC_MODIFIER_DESC_bur_compagnie_d_ordonnance_mod: "シャルル突進公が創設した規律ある常設重騎兵部隊は、中世末期の傭兵依存から脱却した最初の試みの一つだ。コンパニー・ドルドナンスはブルゴーニュ軍の主要な打撃力として、スイスとの戦いを除いて優秀な実績を残した。"
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "カレーの自由港"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "英仏海峡最狭の地カレーは中世から北海・バルト海・地中海を結ぶ交易の要衝だった。イングランドが長年ここを保持したのも、この商業的価値があったからだ。ブルゴーニュはカレーを欧州最大の毛織物交易拠点として発展させる。"
 STATIC_MODIFIER_NAME_bur_english_alliance_secured_mod: "英仏二国を超えた覇権"
 STATIC_MODIFIER_DESC_bur_english_alliance_secured_mod: "イングランドとの完全な同盟を確立し、ノルマンディーを掌握したブルゴーニュは百年戦争の真の勝者として君臨する。英仏いずれの側につくかという問いへの答えは——どちらの上に立つかだ。"
 STATIC_MODIFIER_NAME_bur_trial_of_joan_mod: "ジャンヌの遺産"
 STATIC_MODIFIER_DESC_bur_trial_of_joan_mod: "ブルゴーニュはジャンヌ・ダルクを捕虜にしてイングランドに売った歴史を持つ。しかしフランスと和解し共に戦うことで、ブルゴーニュはその過去を清算し、真のキリスト教騎士道の守護者として復活する。"
 STATIC_MODIFIER_NAME_bur_france_allied_secured_mod: "フランスとの完全同盟"
 STATIC_MODIFIER_DESC_bur_france_allied_secured_mod: "フランスの勝利を後押ししたブルゴーニュは、百年戦争の最大の受益者として西フランスを版図に加える。アラス条約の精神——相互利益に基づく共存——がここに実を結んだ。"
 STATIC_MODIFIER_NAME_bur_secure_artois_mod: "アルトワ確保"
 STATIC_MODIFIER_DESC_bur_secure_artois_mod: "アラスを中心とするアルトワはブルゴーニュ公家の世襲的中心地だ。この地を確保することでブルゴーニュはフランドルとの連続する領土を確立し、北方帝国の基盤を固める。"
 STATIC_MODIFIER_NAME_bur_dominate_picardy_mod: "ピカルディ制圧"
 STATIC_MODIFIER_DESC_bur_dominate_picardy_mod: "アミアン大聖堂の聳えるピカルディはパリへの北の回廊だ。この平野地帯を支配することで、ブルゴーニュはフランス本土への進攻ルートを確保する。"
 STATIC_MODIFIER_NAME_bur_hainaut_namur_mod: "エノー・ナミュールを相続する（未使用）"
 STATIC_MODIFIER_DESC_bur_hainaut_namur_mod: "エノーとナミュールの統合により、ブルゴーニュのネーデルラント版図がフランドルとロレーヌを繋ぐ完全な回廊を形成した。フィリップ善良公の複合国家建設の中核的業績だ。"
 STATIC_MODIFIER_NAME_bur_holland_zeeland_mod: "ホラント・ゼーラント掌握"
 STATIC_MODIFIER_DESC_bur_holland_zeeland_mod: "ニシン漁業とアムステルダムの新興商業で急成長するホラントとゼーラントを掌握することで、ブルゴーニュは北海交易の支配者への道を歩み始める。"
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "ルクセンブルク掌握"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "神聖ローマ帝国最強の要塞の一つルクセンブルクを支配することで、ブルゴーニュは東方（帝国）との境界を堅固に固める。"
 STATIC_MODIFIER_NAME_bur_dominate_alsace_mod: "アルザス制圧"
 STATIC_MODIFIER_DESC_bur_dominate_alsace_mod: "ストラスブールを擁するアルザスは「フランスとドイツの間の地」として常に争われてきた。この豊かなライン川西岸の地を掌握することはブルゴーニュの東方進出の決定的な一手だ。"
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "ライン河支配"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "ネーデルラントからアルザスまでライン川流域を掌握したブルゴーニュは、中西欧最大の内陸水路を完全にコントロールする。これぞカール大帝が夢見たフランク王国の心臓部だ。"
 STATIC_MODIFIER_NAME_bur_lotharingia_united_mod: "ロタリンギア統一"
 STATIC_MODIFIER_DESC_bur_lotharingia_united_mod: "ロレーヌ・フランドル・ホラントが統一されたロタリンギアの中核が完成しつつある。870年のメルセン条約で消えた「中間王国」が1000年の眠りから覚めようとしている。"
 STATIC_MODIFIER_NAME_bur_dutch_towns_mod: "ネーデルラント都市の繁栄"
 STATIC_MODIFIER_DESC_bur_dutch_towns_mod: "アムステルダム・ライデン・ユトレヒトの急成長は後の「オランダの黄金時代」の先触れだ。この都市群の商業力・造船力・金融力がブルゴーニュの経済的原動力となる。"
 STATIC_MODIFIER_NAME_bur_north_sea_trade_mod: "北海交易支配"
 STATIC_MODIFIER_DESC_bur_north_sea_trade_mod: "北海はハンザ同盟が牛耳る商業空間だったが、ブルゴーニュのネーデルラント都市群がその覇権に挑戦している。ニシン・羊毛・木材・穀物の流通を掌握することで、ブルゴーニュは北欧全体の交易を支配する。"
 STATIC_MODIFIER_NAME_bur_burgher_power_mod: "市民階級の権力"
 STATIC_MODIFIER_DESC_bur_burgher_power_mod: "ネーデルラントの都市市民は公爵家と交渉する政治的力を持っていた。この市民のエネルギーを制度的に取り込むことで、ブルゴーニュは単なる封建国家を超えた「市民国家」の先駆者となる。"
 STATIC_MODIFIER_NAME_bur_the_great_duchy_mod: "大公国"
 STATIC_MODIFIER_DESC_bur_the_great_duchy_mod: "ブルゴーニュはもはや「大公国」と呼ぶに値する。フランスの封臣でも帝国の従者でもなく、英仏いずれの大国とも伍して立つ独立勢力として、ブルゴーニュは新たなヨーロッパ秩序の核心となりつつある。"

 bur_join_hre: "神聖ローマ帝国への加盟"
 bur_join_hre_desc: "ブルゴーニュ公国は神聖ローマ帝国の諸侯として正式に認められる機会を持つ。フランス王の封臣でありながら帝国にも属するという二重の地位は、ブルゴーニュに独特の外交的強さを与える。1473年、シャルル突進公はトリーア会談でフリードリヒ3世と「王国」昇格を交渉したが失敗した——今こそ帝国との関係を確立する時だ。"
 bur_join_hre_tooltip: "HRE皇帝からの評価100以上、または神聖ローマ帝国が存在しない"
 bur_franchecomte_fiefdom: "フランシュ＝コンテとの婚姻"
 bur_franchecomte_fiefdom_desc: "13世紀、ブルゴーニュ公爵家はフランシュ＝コンテ伯家との婚姻政策によってこの豊かな「自由伯爵領」と結びついた。1295年のフィリップ4世（美男王）による合併以前、フランシュ＝コンテはブルゴーニュ公の勢力圏にあった。ジュラ山脈の塩鉱・鉄鉱石・ドール大学を擁するこの地との婚姻による結合は、ブルゴーニュの東方拡張の礎だ。"
 bur_franchecomte_fiefdom_tooltip: "フランシュ＝コンテ（c:FCB）が存在しない、または同君連合、またはブルゴーニュの現統治者がbur_eudes_iv_burgundyでない"
 STATIC_MODIFIER_NAME_bur_join_hre_mod: "HRE加盟"
 STATIC_MODIFIER_DESC_bur_join_hre_mod: "神聖ローマ帝国の諸侯として認められたブルゴーニュは、帝国の名のもとで外交能力と統合速度を高めている。1473年のトリーア会談が描いた夢がここに実現しつつある。"
 STATIC_MODIFIER_NAME_bur_franchecomte_fiefdom_mod: "フランシュ＝コンテ封土化"
 STATIC_MODIFIER_DESC_bur_franchecomte_fiefdom_mod: "「自由伯爵領」をブルゴーニュの封土として取り込んだことで、ジュラ山脈の防衛と塩鉱・製鉄業の経済的恩恵がブルゴーニュのものとなった。"
 bur_events.4.t: "神聖ローマ帝国への加盟"
 bur_events.4.d: "ブルゴーニュは「フランス王の封臣であり神聖ローマ帝国の諸侯でもある」という二重の地位を持つことができる。HRE皇帝との関係が十分に良好になった今、帝国への正式加盟を申請する機会が到来した。神聖ローマ帝国の加盟は帝国防衛義務を生じさせるが、同時に帝国の諸侯として大きな外交的地位を得ることができる。1473年のトリーア会談でシャルル突進公は「ブルゴーニュ王国」として帝国内で承認されることをフリードリヒ3世に求めたが、最後の瞬間に皇帝は合意を反故にした。今こそ、その夢を実現する時だ。"
 bur_events.4.a: "帝国に加盟し、諸侯として認められる"
 bur_events.4.b: "今は独立を保つ"
 bur_events.5.t: "フランシュ＝コンテとの婚姻"
 bur_events.5.d: "13世紀のブルゴーニュ公爵家はフランシュ＝コンテ伯家との婚姻によってこの地と深く結びついた。ブルゴーニュ公オットー4世はフランシュ＝コンテ女伯マオーとの婚姻によりこの地を公爵家の勢力圏に取り込んだ。ジュラ山脈を越えてスイスとロレーヌに向かう交易路を支配するこの「自由伯爵領」は、ブルゴーニュが東方に伸びるための鍵だ。婚姻の絆を活かし、フランシュ＝コンテを封土として迎え入れよ。"
 bur_events.5.a: "婚姻の絆を活かし、フランシュ＝コンテを封土として迎え入れる"
 bur_events.5.b: "婚姻関係のみを維持し、独立を尊重する"

 bur_events.6.t: "百年戦争のフランドル"
 bur_events.6.d: "フランドル伯国は英仏百年戦争において特別な立場にあった。フランドルの布地産業はイングランドの羊毛なしには成立せず、ブリュージュ・ヘント・イープルの豊かな都市市民はイングランドとの交易関係を重視していた。フランス王はフランドル伯を封臣と主張するが、フランドルの都市民はフランス支配を嫌ってイングランド寄りの立場を取ることが多かった。ブルゴーニュ公がフランドルを自陣営に引き込むことで、この布地産業と商業都市の富を活用できる。フランドルを封土として迎え入れるか、独立を尊重しながら関係を深めるかの選択が迫られる。"
 bur_events.6.a: "フランドルをブルゴーニュの封土として迎え入れる"
 bur_events.6.b: "独立を尊重しつつ、同盟関係を深める"

 bur_nevers_union: "ヌヴェールとの結合"
 bur_nevers_union_desc: "ヌヴェール伯国はフランドルの南方に位置し、ブルゴーニュ公爵家と歴史的なつながりを持つ。フランドルを確実に掌握した上で、ヌヴェール伯国への請求権を確立することはブルゴーニュの勢力圏を南方に広げる第一歩となる。フランドルとヌヴェールの間の地方は将来のフランス進出への回廊となる。"
 bur_nevers_union_tooltip: "ヌヴェール（nevers）を自国または属国が領有している"
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "低地諸国の統合"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "ホラント・ゼーラント・ブラバント・フランドルを繋ぐネーデルラントの交易網が統合された。アントウェルペンとアムステルダムを核とするこの低地諸国の商業力は後のオランダ黄金時代の礎だ。"

 bur_events.3.a: "ロタリンギア王国として復活する"
 bur_events.3.b: "ブルゴーニュとして帝国化する（現状維持）"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "ロタリンギアの復活"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "中フランク王国の後継国家ロタリンギアが869年の滅亡から600年を経て復活した。シャルルマーニュの帝国を継承するこの王国は、神聖ローマ帝国とフランス王国の間に立つ第三の帝国として認識される。"
