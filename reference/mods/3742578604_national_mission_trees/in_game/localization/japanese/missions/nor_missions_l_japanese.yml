 nor_expel_danish_nobility: "デンマークとの対抗"
 nor_expel_danish_nobility_desc: "1337年のノルウェーはマグヌス・エーリクソン王のもとでスウェーデンと同君連合を結ぶ独立国だ。デンマークとの関係は複雑で、将来のカルマル同盟（1397年）ではデンマークが主導権を握る危険がある。今この時代にデンマークとの明確な関係を築き、スカンジナビアにおけるノルウェーの立場を確立せよ——ライバル宣言・同盟・友好関係のいずれによっても。"
 nor_expel_danish_nobility_tooltip: "デンマーク（c:DAN）がライバルである、もしくは同盟している、もしくはデンマークとの関係が150以上、もしくはデンマークが存在しない"

 nor_secure_bergen_desc: "ブリュッゲン（Bryggen）——ベルゲンの埠頭に立ち並ぶ色鮮やかな木造建築は、ハンザ同盟ドイツ商人たちの繁栄の象徴だ。しかしベルゲンはノルウェーの都市でなければならない。王の威光がこの港に及ぶとき、北大西洋交易の富はノルウェーの手に入る。"
 nor_develop_stavanger_desc: "スタヴァンゲルはノルウェー南西岸の古い司教座都市だ。断崖と入り江が織りなすローガラン地方の中心として、この港はニシン漁と北海貿易の要衝となる。ベルゲンに次ぐノルウェー第二の港湾都市として整備せよ。"
 nor_develop_oslo_desc: "アケルスフース城の城壁に守られたオスロは、デンマークとスウェーデンの間に挟まれた南の要塞都市だ。ここから東に向かえばスウェーデン、南に向かえばデンマーク。オスロを繁栄させることで、ノルウェーの南方国境が固まり、農業と商業が花開く。"
 nor_secure_nidaros_desc: "ニダロス——聖オーラフが殉教した地に建つこの都市は、スカンジナビア最大のゴシック大聖堂をいただき、北方キリスト教世界の霊的中心として千年の歴史を持つ。ここを整備することで、ノルウェー王の権威が天と地の両方から承認される。"
 nor_vinland_desc: "千年前、赤毛のエイリークの息子レイフが霧の彼方の大陸——ヴィンランド——に足を踏み入れた。今、ノルウェーの旗を掲げた植民地国家がその夢を継いでいる。ノルウェーはヨーロッパで最初に新大陸に根を張った国家として歴史に刻まれる。"
 nor_colonization_desc: "ヴィンランドからグリーンランド、アイスランドまで——ノルウェーの植民地国家が北大西洋に広がった。ヴァイキングの探検精神が現代に生き続け、ノルウェーは海の向こうの世界を支配する真の海洋帝国となった。"
 nor_kingdom_of_britain_desc: "ロンドン・ヨーク・エジンバラ——ブリテン島の三都市がノルウェーの旗の下に統一された。クヌート大王の夢が再び実現した。デーンロウの記憶が現代に甦り、北海はノルウェーの内海となった。"

 nor_arctic_trade_desc: "コラ半島——北極圏の凍てついた荒野が広がるこの地は、毛皮・狩猟動物・セイウチ牙の宝庫だ。サーミ人の狩猟者たちが持ち込む極北の産物は、ヨーロッパ貴族が求める最上の毛皮として莫大な富をもたらす。コラ半島を掌握することで、ノルウェーは北極圏交易の絶対的な主人となる。"
 nor_arctic_trade_tooltip: "コラ地域（kola_area）に15以上のロケーションを保有"
 nor_timber_industry_desc: "ノルウェーの森は造船所と建築者たちへの贈り物だ。スプルース・マツ・カバノキが織りなす深い森林から切り出される木材と工具用の鉄——この二つの組み合わせがノルウェー工業の基盤を形成する。製材所の煙が立ち上るとき、ノルウェーは北欧最大の木材輸出国となる。"
 STATIC_MODIFIER_NAME_nor_timber_mod: "木材産業"
 STATIC_MODIFIER_DESC_nor_timber_mod: "ノルウェーの豊かな森林から切り出される木材と工具が産業基盤を支える。"
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "北極圏交易"
