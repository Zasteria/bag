l_japanese:
 nor_kongedommen_mission_pack: "コンゲドンメット——ノルウェー王国の栄光"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "1337年、ノルウェーはスウェーデンと同君連合を結びながらも、デンマークの影響下に置かれていた。ヴァイキングの末裔として、デンマークから独立しスカンジナビアを統一せよ。ベルゲンの漁業・北海覇権・アイスランドとグリーンランドの植民地・ヴィンランドへの探検——そして信仰の選択（カトリック・ルター派・ノルド復興）を経て、ノルウェー帝国を建設せよ。"
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "ノルウェーとして独立・統一・北大西洋制覇・植民地建設を実現し、ノルウェー帝国を建国せよ。"
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してノルウェー帝国を建設せよ。"
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "ヴァイキングの末裔たる誇りをもって、ノルウェーを帝国に！"

 nor_kingdom_of_norway: "ノルウェー王国の基盤"
 nor_kingdom_of_norway_desc: "1337年、ノルウェーはマグヌス・エーリクソン王のもとでスウェーデンと同君連合を結んでいる。しかしデンマークの影響力は常に北方を脅かす。ヴァイキングの末裔として、王権の正統性を高め、独立したノルウェー王国の基盤を固めよ。"
 nor_kingdom_of_norway_tooltip: "正統性70以上、安定度20以上"

 nor_expel_danish_nobility: "デンマーク貴族の追放"
 nor_expel_danish_nobility_desc: "ノルウェー宮廷に巣食うデンマーク系貴族がノルウェーの自立を妨げている。彼らを追放し、純粋なノルウェー人の手による政治を実現せよ。エンゲルブレクトの精神がノルウェーにも息づいている。"
 nor_expel_danish_nobility_tooltip: "デンマーク（c:DAN）の支配下になく、正統性80以上"

 nor_control_denmark: "デンマークの掌握"
 nor_control_denmark_desc: "デンマークはノルウェーの最大の脅威であり、宿敵だ。コペンハーゲンを占領するか、デンマークをノルウェーの支配下に置くことで、カルマル同盟の盟主がノルウェーに移る。"
 nor_control_denmark_tooltip: "デンマークが同君・従属国・不存在か、コペンハーゲン（kobenhavn）を自国または属国が領有"

 nor_sweden_union: "スウェーデンとの同君連合"
 nor_sweden_union_desc: "スウェーデンとの同君連合を強化・維持することで、スカンジナビア北方全体の力がノルウェーの下に集まる。マグヌス王の統治を受け継ぎ、この同盟をスカンジナビア統一の基盤とせよ。"
 nor_sweden_union_tooltip: "スウェーデン（c:SWE）と同君連合か従属国関係、もしくは存在しない"

 nor_unite_scandinavia: "スカンジナビアの統一"
 nor_unite_scandinavia_desc: "デンマーク掌握・スウェーデン同君連合——スカンジナビア全域がノルウェーの旗の下に統一された。バイキング時代以来、北方世界が一つの王の下に統治される歴史的瞬間だ。"
 nor_unite_scandinavia_tooltip: "スカンジナビア地域（scandinavian_region）に300以上のロケーションを自国が領有"

 nor_sound_toll: "海峡通行税の掌握"
 nor_sound_toll_desc: "デンマーク打倒によりエーレスンド海峡がノルウェーの管制下に入った。バルト海と北海を結ぶこの海峡の通行税を徴収することで、莫大な収入が確保される。"
 nor_sound_toll_tooltip: "艦船30以上、月収150以上"

 nor_develop_stockholm: "ストックホルムの整備"
 nor_develop_stockholm_desc: "スウェーデン同君連合を通じてストックホルムを整備する。バルト海の要衝として機能するこの都市は、ノルウェー帝国の東方行政拠点となる。"
 nor_develop_stockholm_tooltip: "ストックホルム（stockholm）を自国が直接所有し、開発度30以上"

 nor_secure_bergen: "ベルゲンの整備"
 nor_secure_bergen_desc: "ベルゲンはノルウェー最大の都市であり、ハンザ同盟のドイツ商人（ブリュッゲン）が支配してきた北大西洋交易の中心地だ。都市ランクに引き上げ、ドイツ商人の支配からベルゲンを取り戻してノルウェー国民の手に商業を戻せ。"
 nor_secure_bergen_tooltip: "ベルゲン（bergen）が都市ランク以上、開発度25以上"

 nor_fleet_of_norway: "ノルウェー艦隊"
 nor_fleet_of_norway_desc: "ヴァイキングの末裔であるノルウェー人は海の民だ。ベルゲンを拠点とする強力な艦隊を整備することで、北海・北大西洋・バルト海への展開能力が確立される。"
 nor_fleet_of_norway_tooltip: "艦船20以上、海軍伝統30以上"

 nor_north_sea_markets: "北海の市場"
 nor_north_sea_markets_desc: "ノルウェーは北海に面した地理的優位を活かして商業を発展させる。月収100以上と複数の市場中心地で北海交易の主要プレイヤーとして確立せよ。"
 nor_north_sea_markets_tooltip: "月収100以上、市場の中心地（market center）を3以上保有"

 nor_iceland_colony: "アイスランドの支配"
 nor_iceland_colony_desc: "アイスランドは874年にノルウェー人によって入植された、ノルウェー文化の海外拠点だ。アイスランドの複数のロケーションを保有することで、北大西洋への橋頭堡が完成し、グリーンランド・ヴィンランドへの探検が視野に入る。"
 nor_iceland_colony_tooltip: "アイスランド地域（iceland_area）に3以上のロケーション保有"

 nor_greenland_expedition: "グリーンランド遠征"
 nor_greenland_expedition_desc: "985年、エイリーク・ラウージ（赤毛のエイリーク）がグリーンランドに植民地を建設した。この西方大陸への第一歩を踏み出し、伝説のヴィンランドへの道を開け。"
 nor_greenland_expedition_tooltip: "グリーンランド地域（greenland_area）に1以上のロケーション保有"

 nor_vinland: "ヴィンランドの開拓"
 nor_vinland_desc: "西暦1000年頃、レイフ・エイリクソンが北米大陸（ヴィンランド）に到達した。現代のニューファンドランドに相当するこの地への植民地建設を完成させ、ノルウェーをヨーロッパ最初の新大陸植民地国家にせよ。"
 nor_vinland_tooltip: "植民地ロケーションを5以上保有"

 nor_orkney_shetland: "オークニー・シェトランドの掌握"
 nor_orkney_shetland_desc: "オークニー諸島とシェトランド諸島はヴァイキング時代からノルウェーの影響下にあった植民地だ。これらの戦略的島嶼を確保することで、北海とブリテン島への展開能力が大幅に向上する。"
 nor_orkney_shetland_tooltip: "オークニー（orkney）とシェトランド（shetland）を自国または属国が領有"

 nor_conquer_scotland: "スコットランドの征服"
 nor_conquer_scotland_desc: "スコットランドの西岸・ヘブリディーズ諸島はかつてヴァイキングが支配した地だ。エジンバラを掌握しヘブリディーズ諸島を支配することで、ヨーク（デーンロウの都）への進出路が開かれる。"
 nor_conquer_scotland_tooltip: "エジンバラ（edinburgh）を自国または属国が領有し、ヘブリディーズ地域に3以上のロケーション保有"

 nor_invade_england: "イングランドへの侵攻"
 nor_invade_england_desc: "ヨークはかつてヴァイキングの「ヨルヴィーク王国」の首都だった地だ。ノルウェー軍がヨークを占領することで、デーンロウ（Danelaw）の記憶が現代に甦る。"
 nor_invade_england_tooltip: "ヨーク（york）を自国または属国が領有"

 nor_kingdom_of_britain: "ブリテン王国"
 nor_kingdom_of_britain_desc: "ロンドン・ヨーク・エジンバラの支配——ブリテン島全体がノルウェーの旗の下に統治される。クヌート大王以来の北海帝国が復活し、ノルウェーは歴史上最大の版図を誇る王国となった。"
 nor_kingdom_of_britain_tooltip: "ロンドン（london）・ヨーク（york）・エジンバラ（edinburgh）を自国または属国が領有"

 nor_master_of_north_sea: "北海の覇者"
 nor_master_of_north_sea_desc: "北海市場とオークニー・シェトランドの掌握——ノルウェーが北海の絶対的覇者となった。艦船50以上・月収200以上で北海を支配するノルウェーの旗が北海全体に翻る。"
 nor_master_of_north_sea_tooltip: "艦船50以上、月収200以上"

 nor_secure_nidaros: "ニダロスの整備"
 nor_secure_nidaros_desc: "ニダロス（現トロンハイム）はノルウェー王国の歴史的首都であり、聖オーラフ王の聖地だ。ニダロス大聖堂はスカンジナビア最大のゴシック建築として知られる。都市として整備することで、ノルウェー王国の精神的・宗教的中心地として機能する。"
 nor_secure_nidaros_tooltip: "ニダロス（nidaros）が都市ランク以上、開発度25以上"

 nor_fisheries: "漁業の発展"
 nor_fisheries_desc: "ノルウェーはヨーロッパ最大の漁業国だ。タラ・ニシン・サーモンが北大西洋から豊富に獲れるこの国の漁業を本格整備し、北海・バルト海に向けて大量輸出する体制を確立せよ。"
 nor_fisheries_tooltip: "魚（fish）を15以上生産し、造船所（dock）を3箇所以上保有"

 nor_timber_industry: "木材産業"
 nor_timber_industry_desc: "ノルウェーの森林は造船・建築に欠かせない木材の宝庫だ。ノルランドの豊富な森林資源を活用した木材産業を整備することで、造船能力と輸出収入が大幅に向上する。"
 nor_timber_industry_tooltip: "ノルランド地域（norrland_area）に5以上のロケーションを保有し、月収100以上"

 nor_arctic_trade: "北極圏交易"
 nor_arctic_trade_desc: "ハンメルフェストとボードーを掌握することで、北極圏の毛皮・鯨油・象牙（セイウチ牙）交易への扉が開かれる。ノルウェーは北方最前線の交易国家として繁栄する。"
 nor_arctic_trade_tooltip: "ハンメルフェスト（hammerfest）とボードー（bodo）を自国または属国が領有"

 nor_develop_oslo: "オスロの整備"
 nor_develop_oslo_desc: "オスロ（当時はアケルスフース城の近く）はノルウェー南部の商業中心地だ。都市として整備し地方総督府を設置することで、デンマークとの国境地帯の行政が強化される。"
 nor_develop_oslo_tooltip: "オスロ（oslo）が都市ランク以上、開発度30以上"

 nor_absolutism: "絶対王政"
 nor_absolutism_desc: "ノルウェーに絶対王政を確立する。王室権力を高め正統性を強化することで、中央集権的な帝国統治の基盤が整う。"
 nor_absolutism_tooltip: "王室権力35%以上、正統性90以上"

 nor_northern_economy: "北方経済"
 nor_northern_economy_desc: "北極圏交易と絶対王政の経済改革——ノルウェーの経済が北欧最高水準に達した。月収300以上と複数の市場中心地でその達成を証明せよ。"
 nor_northern_economy_tooltip: "月収300以上、市場の中心地（market center）を4以上保有"

 nor_religious_question: "信仰の問い"
 nor_religious_question_desc: "宗教改革の嵐がノルウェーにも押し寄せた。ニダロス大聖堂の聖職者たちがローマへの忠誠を叫ぶ一方、ルターの新しい教えに共鳴する者も増えている。あるいは——先祖たちの古い神々を呼び戻す声もある。ノルウェー王の選択がこの北方王国の魂を決める。"
 nor_religious_question_tooltip: "宗教改革局面（situation:reformation）が進行中"

 nor_catholic_norway: "カトリックノルウェー"
 nor_catholic_norway_desc: "ノルウェー王国はローマ教会への忠誠を守り続ける。ニダロス大聖堂に象徴される北方カトリックの伝統を守り、教皇との緊密な関係でノルウェーを北欧カトリック世界の守護者とせよ。"
 nor_catholic_norway_tooltip: "主要宗教がカトリック（religion:catholic）、教皇との友好度150以上"

 nor_northern_crusade: "北方十字軍"
 nor_northern_crusade_desc: "ノルウェーがキリスト教世界の北の盾として聖戦に参加する。異教徒との戦いを通じてノルウェーの宗教的権威と威信が高まる。"
 nor_northern_crusade_tooltip: "イスラム教国家（religion_group:muslim）と交戦中"

 nor_papal_champion: "教皇の盾"
 nor_papal_champion_desc: "教皇との深い信頼関係とリューベック掌握——ノルウェーは北欧カトリック世界の最強の守護者として確固たる地位を築いた。"
 nor_papal_champion_tooltip: "教皇との友好度180以上、リューベック（lubeck）を自国または属国が領有"

 nor_reformation: "宗教改革"
 nor_reformation_desc: "ノルウェーがルター派（またはカルヴァン派）を受け入れる。教会財産が王家に接収され、国家財政が強化される。"
 nor_reformation_tooltip: "主要宗教がルター派（religion:lutheran）またはカルヴァン派（religion:calvinist）"

 nor_protestant_church: "プロテスタント教会"
 nor_protestant_church_desc: "大学を整備してルター派神学者を育成し、ノルウェー全土にプロテスタント信仰を根付かせよ。"
 nor_protestant_church_tooltip: "聖職者身分の満足度0.65以上、大学（university）を2箇所以上保有"

 nor_protestant_empire: "プロテスタント帝国"
 nor_protestant_empire_desc: "スカンジナビアにルター派が浸透した。ノルウェー王がプロテスタント世界の北方の盟主として君臨する。"
 nor_protestant_empire_tooltip: "250以上のロケーション保有、スカンジナビア地域でルター派70%以上"

 nor_norse_revival: "ノルド古信仰の復興"
 nor_norse_revival_desc: "ヴァイキングの神々——オーディン・トール・フレイ——への信仰が甦る。キリスト教化以前のスカンジナビアの姿が現代に再現される。ノルウェー王がノルドの神々の代理人として君臨する。"
 nor_norse_revival_tooltip: "主要宗教がノルド（religion:norse）"

 nor_berserker_fleet: "ベルセルク艦隊"
 nor_berserker_fleet_desc: "ヴァイキング時代のベルセルクの精神が海軍に宿る。ノルドの神々に捧げる海の戦士たちが私掠船として異教徒の海岸を自由に襲撃できるようになった。"
 nor_berserker_fleet_tooltip: "海軍伝統50以上、艦船30以上"

 nor_ragnarok_empire: "ラグナロクの帝国"
 nor_ragnarok_empire_desc: "世界の終末と再生——ラグナロクの後に来る新しい世界のように、ノルウェーが古い神々の加護のもとで北方帝国として生まれ変わった。帝国ランクと500以上のロケーションでその栄光を掴め。"
 nor_ragnarok_empire_tooltip: "帝国ランクであり、500以上のロケーションを自国が直接領有"

 nor_bane_of_hansa: "ハンザ同盟の打倒"
 nor_bane_of_hansa_desc: "ハンザ同盟はベルゲンのブリュッゲン（ドイツ橋）を拠点にノルウェー交易を支配してきた。リューベックを支配するかハンザ同盟を解体し、ノルウェー商人が自国の交易路を取り戻せ。"
 nor_bane_of_hansa_tooltip: "リューベック（lubeck）を自国または属国が領有、もしくはHSAが存在しない"

 nor_baltic_access: "バルト海へのアクセス"
 nor_baltic_access_desc: "シュトラルズント掌握でバルト海への直接アクセスが確保された。ノルウェーはこれにより北海とバルト海の両方を支配する北欧最大の海洋国家となる。"
 nor_baltic_access_tooltip: "シュトラルズント（stralsund）を自国または属国が領有し、艦船30以上"

 nor_hanseatic_expulsion: "ハンザ商人の追放"
 nor_hanseatic_expulsion_desc: "ハンザ同盟の解体とベルゲン整備——ノルウェーはついにドイツ商人の支配からベルゲンを完全に解放した。ノルウェー商人が自国の港の主人となる。"
 nor_hanseatic_expulsion_tooltip: "HSAが存在しない、月収200以上"

 nor_control_north_sea_trade: "北海交易の制覇"
 nor_control_north_sea_trade_desc: "北海市場とハンザ同盟打倒——ノルウェーが北海交易路全体の主導権を握った。月収300以上・艦船40以上で北海の覇者としての地位を確立せよ。"
 nor_control_north_sea_trade_tooltip: "月収300以上、艦船40以上"

 nor_north_sea_empire: "北海帝国"
 nor_north_sea_empire_desc: "リューベックを含む北海沿岸全体を支配したノルウェーが北海帝国を建設した。クヌート大王の北海帝国が現代に復活する。"
 nor_north_sea_empire_tooltip: "艦船60以上、リューベック（lubeck）を自国または属国が領有し、月収350以上"

 nor_develop_stavanger: "スタヴァンゲルの整備"
 nor_develop_stavanger_desc: "スタヴァンゲルはノルウェー南西岸の重要な港市だ。都市として整備することで、ノルウェー南西部の漁業・交易拠点として発展する。"
 nor_develop_stavanger_tooltip: "スタヴァンゲル（stavanger）が都市ランク以上"

 nor_amber_trade: "琥珀交易"
 nor_amber_trade_desc: "バルト海産の琥珀はノルウェーの北海交易ネットワークを通じてヨーロッパ全土へ輸出される。「北の黄金」の交易でノルウェーの収入がさらに拡大する。"
 nor_amber_trade_tooltip: "琥珀（amber）を3以上生産し、月収150以上"

 nor_integrate_finland: "フィンランドの統合"
 nor_integrate_finland_desc: "スウェーデン同君連合を通じてフィンランドをノルウェー帝国の一部として統合する。オーボとウレオボルクを直接支配することで、北大西洋からバレンツ海まで版図が広がる。"
 nor_integrate_finland_tooltip: "オーボ（abo）とウレオボルク（uleaborg）を自国が直接所有"

 nor_engelbrekt: "エンゲルブレクトの精神"
 nor_engelbrekt_desc: "エンゲルブレクトの反乱精神はノルウェーにも波及した。農民身分の支持を得て独立への意志を固め、北方の自由民の伝統を体現せよ。"
 nor_engelbrekt_tooltip: "正統性85以上、農民身分の満足度0.70以上"

 nor_develop_hammerfest: "ハンメルフェストの整備"
 nor_develop_hammerfest_desc: "ハンメルフェストは世界最北の都市の一つだ。この極北の交易拠点を都市として整備することで、北極圏交易の恒久的な中心地が確立される。"
 nor_develop_hammerfest_tooltip: "ハンメルフェスト（hammerfest）を自国が直接所有し、都市ランク以上"

 nor_karoliner: "ノルウェー精鋭軍"
 nor_karoliner_desc: "高い軍事伝統に支えられたノルウェー精鋭軍が完成した。山岳地形を活かした守備と強力な攻撃力でノルウェー帝国の軍事的強さを示せ。"
 nor_karoliner_tooltip: "軍事伝統50以上、陸軍規模25以上"

 nor_great_power: "北方の大国"
 nor_great_power_desc: "絶対王政と漁業・産業の発展——ノルウェーが北ヨーロッパの大国として台頭した。200以上のロケーション・月収250以上・威信60以上でその地位を確立せよ。"
 nor_great_power_tooltip: "200以上のロケーション保有、月収250以上、威信60以上"

 nor_colonization: "ノルウェー植民地帝国"
 nor_colonization_desc: "ヴィンランドと北方経済の発展を基盤として、本格的な植民地帝国を建設した。10以上の植民地ロケーションでノルウェーがヨーロッパ最初の真の植民地帝国となった。"
 nor_colonization_tooltip: "植民地ロケーションを10以上保有"

 nor_stormakt: "ストールマクト——北方の大国"
 nor_stormakt_desc: "スカンジナビア統一・北海帝国・北方経済の三つが揃い、ノルウェーがストールマクト（大国）として北ヨーロッパに君臨する。月収600以上・600ロケーション以上・威信80以上でその栄光を掴め。"
 nor_stormakt_tooltip: "600以上のロケーション保有、月収600以上、威信80以上"

 nor_norwegian_empire: "ノルウェー帝国"
 nor_norwegian_empire_desc: "アイスランドからヴィンランド、ニダロスからブリテン島まで——ノルウェー帝国が完成した。ヴァイキング時代の栄光が現代に甦り、ノルウェーは世界史上最大の海洋帝国の一つとして歴史に刻まれる。900以上のロケーション・威信80以上・月収900以上でその頂点に立て。"
 nor_norwegian_empire_tooltip: "900以上のロケーション保有、威信80以上、月収900以上"

 nor_events.30.t: "スカンジナビアの統一——ノルウェーの夜明け"
 nor_events.30.d: "デンマーク掌握、スウェーデン同君——スカンジナビア全域がノルウェーの旗の下に統一された。バイキング時代以来、誰も成し得なかったこの偉業がついに実現した。ニダロス大聖堂の鐘が鳴り響き、ノルウェー王はここに「スカンジナビア王」の称号を宣言する。"
 nor_events.30.a: "スカンジナビア万歳！ノルウェーは永遠に！"

 nor_events.40.t: "信仰の岐路——ノルウェーの宗教選択"
 nor_events.40.d: "宗教改革の嵐がノルウェーを覆っている。ニダロス大聖堂の聖職者たちはローマへの忠誠を叫ぶ。しかしルターの教えに共鳴する者も増えている。そして——かつての神々への回帰を夢見る声も聞こえる。ノルウェー王の選択がこの北方王国の未来を決定する。"
 nor_events.40.a: "ローマへの忠誠を守れ——カトリックこそノルウェーの魂だ"
 nor_events.40.b: "ルターの教えを受け入れよ——改革の時代が来た"
 nor_events.40.c: "古い神々のもとへ帰れ——オーディンの加護を求める"

 nor_events.99.t: "ノルウェー帝国の誕生"
 nor_events.99.d: "アイスランドからヴィンランド、ニダロスからブリテン島まで——ノルウェー帝国がついに完成した。ヴァイキングの末裔たちが先祖の夢を超えた。クヌート大王でさえ夢見なかった規模の帝国が、ここに誕生した。「北海は再びノルウェーの内海となった」——歴史家たちはこう記すだろう。"
 nor_events.99.a: "ノルウェー帝国皇帝陛下万歳！ヴァイキングの末裔よ、永遠に！"

