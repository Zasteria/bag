l_japanese:
 # === ミッションパック ===
 som_ottoman_mission_pack: "オスマン帝国の台頭"
 som_ottoman_mission_pack_desc: "辺境のベイリクから、世界最強のスルタン国へ。アナトリアを統一し、ルメリアへ渡り、永遠の都コンスタンティノープルを玉座とせよ。"
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してオスマン帝国を築け。"
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "オスマン帝国としてミッションを達成し、帝国的偉大さを実現せよ。"

 # === フェーズ1 ===
 som_tur_secure_bursa: "ビティニア三都市の掌握"
 som_tur_secure_bursa_desc: "ブルサ、イズニク、イズニコミドの三都市はオスマン国家の礎である。いずれの都市も支配度50%以上を達成し、確固たる統治基盤を築け。"

 som_tur_frontier_warriors: "辺境戦士の結束"
 som_tur_frontier_warriors_desc: "ベイリクを切り開いたガーズィー戦士たちを王朝に結びつけよ。彼らの戦闘精神こそ我らの最大の武器である。"

 som_tur_bursa_bazaar: "ブルサのバザール"
 som_tur_bursa_bazaar_desc: "ブルサはシルクロードの要衝に位置する。その市場を発展させ、東西交易から富を引き出せ。"

 # === フェーズ2 ===
 som_tur_cross_the_straits: "海峡を渡れ"
 som_tur_cross_the_straits_desc: "ガリポリとヨーロッパへの渡航路——この門を押さえれば、ルメリアの富と土地が手の届く場所に来る。"

 som_tur_anatolian_heartland: "アナトリアの掌握"
 som_tur_anatolian_heartland_desc: "アンカラを確保し、アナトリアの中核地帯としての発展の道筋を定めよ。この地で何を産するかが、帝国の将来を左右するだろう。"

 som_ottoman_events.18.t: "アナトリアの中核 — アンカラの将来"
 som_ottoman_events.18.d: "アナトリアの中核都市アンカラが帝国の手に収まった。この地をどのような産業の中心地として育てるか、宮廷では議論が続いている。古くからの織物の伝統を活かすか、絹の生産に乗り出すか、あるいは鮮やかな染料の栽培で名を上げるか。"
 som_ottoman_events.18.a: "織物業をさらに発展させる"
 som_ottoman_events.18.b: "桑を植え、絹の生産を始める"
 som_ottoman_events.18.c: "染料植物の栽培を振興する"

 som_tur_vassalize_beyliks: "ベイリク諸国の征服"
 som_tur_vassalize_beyliks_desc: "他のアナトリアのベイリクは膝を屈するか、滅ぼされるかだ。統一されたアナトリアのみが東西の強国に対抗できる。"

 # === フェーズ3 ===
 som_tur_siege_constantinople: "コンスタンティノープルの陥落"
 som_tur_siege_constantinople_desc: "東ローマ帝国の座、永遠の都をオスマンの大砲と鉄の前に落とせ。その征服が帝国の誕生を世界に告げるだろう。"

 som_tur_devshirme_system: "デヴシルメ制度"
 som_tur_devshirme_system_desc: "精鋭兵士を育成するデヴシルメ制度を制度化せよ。イェニチェリ軍団はスルタンの剣となる。"

 som_tur_kanun_law: "カーヌーン法典"
 som_tur_kanun_law_desc: "帝国には剣以上のものが必要だ。シャリーアと並ぶ帝国法カーヌーンを体系化し、全臣民をスルタンの裁きに縛れ。"

 som_tur_mediterranean_ambition: "地中海の覇者"
 som_tur_mediterranean_ambition_desc: "我が艦隊が航路を制せよ。海峡を掌握し、エーゲ海を支配し、地中海をオスマンの湖とせよ。"

 som_tur_sultan_of_sultans: "スルタンたちのスルタン"
 som_tur_sultan_of_sultans_desc: "パーディシャー、ハーンのハーン、ローマの皇帝——あらゆる称号が汝のものだ。オスマン帝国は世界最強の国家として君臨する。"

 # === モディファイア ===
 STATIC_MODIFIER_NAME_som_tur_bursa_secured: "ブルサ確保"
 STATIC_MODIFIER_DESC_som_tur_bursa_secured: "ブルサはオスマン朝の最初の首都として1326年にオルハン・ガーズィーが定めた地だ。古代ビザンツのプルサを引き継いだこの都市は、シルクロードから届く絹・香辛料の集散地として急速に発展し、オスマン建築の初期の傑作であるウル・ジャーミィ（大モスク）をはじめ多くの壮麗な建築を擁する。"

 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "ガーズィー戦士"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "「ガーズィー（聖戦士）」とはイスラムの名において不信仰者と戦う者を指す称号だ。オスマン朝初代のオスマン・ガーズィーをはじめ、辺境の戦士たちはこの聖なる使命感をもってビザンツ帝国の弱体化した国境地帯に侵攻し続けた。この宗教的熱狂がオスマン拡大の精神的原動力だった。"

 # === イベント ===
 som_ottoman_events.1.t: "ブルサ — オスマンの揺り籠"
 som_ottoman_events.1.d: "ブルサ、イズニク、イズニコミドがオスマンの手に落ちた。かつてビザンツ帝国の要衝であったブルサの街には、ギリシャ正教徒、アルメニア人、ユダヤ人、そして新たな支配者であるトルコ系ムスリムが混在している。スルタンの宮廷はいま問われている——この多様な民を、いかにしてオスマン国家に統合するか、と。"
 som_ottoman_events.1.a: "イスラムとトルコの旗のもとに統合せよ"
 som_ottoman_events.1.a.tt: "ブルサのPOPの多くがスンニ派・トルコ文化へと変化する。"
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "ブルサの絹織物産業"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "かつてコンスタンティノープルの宮廷を彩った絹織物は、今やブルサの工房で生み出される。ビザンツ滅亡後、帝都の職人や商人がブルサへと流入し、この地はイタリア諸都市にも劣らぬ高級生地の一大産地へと変貌した。スルタンの宮廷も、ヴェネツィアやジェノヴァの商人も、ブルサの絹を求めてやってくる。"

 # === イベント2: ブルサの絹織物 ===
 som_ottoman_events.2.t: "ブルサ — 東方の絹都市"
 som_ottoman_events.2.d: "ブルサのバザールは繁栄し、絹織物の取引で溢れかえっている。かつてコンスタンティノープルに独占されていた高級絹織物の生産が、今やこの地で花開こうとしている。フィレンツェやミラノが西方の生地産業を支配するように、ブルサは東方における高級絹の都市となりえる。スルタンは職人への庇護を約束し、この地の絹産業を帝国の礎とすることを宣言した。"
 som_ottoman_events.2.a: "ブルサを東方の絹都市として発展させよ"
 som_ottoman_events.2.a.tt: "ブルサが東方随一の絹都市となる。"

 # === イベント3: スミルナの掌握 ===
 som_ottoman_events.3.t: "スミルナ — エーゲ海の交易港"
 som_ottoman_events.3.d: "スミルナは古来よりエーゲ海交易の要衝として栄えてきた。ギリシャ人、アルメニア人、ユダヤ人の商人たちが軒を連ね、東西交易の品々が港に荷揚げされる。この都市を掌握したオスマンは、アナトリアとヨーロッパを結ぶ交易路の一端を手に入れた。スルタンの命により、スミルナの商業区が整備され、さらなる交易の拡大が図られる。"
 som_ottoman_events.3.a: "スミルナの商業を振興せよ"
 som_ottoman_events.3.a.tt: "スミルナの商業区が整備される。"

 # === イベント4: コンスタンティノープルの陥落 ===
 som_ottoman_events.4.t: "コンスタンティノープルの陥落"
 som_ottoman_events.4.d: "ついにコンスタンティノープルが陥ちた。千年の歴史を誇る東ローマ帝国最後の皇帝コンスタンティノス11世は城壁で戦死し、メフメト2世の軍は都市へと入城した。かつてハギア・ソフィアの鐘が響き渡ったこの地に、今やアザーンが鳴り渡る。スルタンは都市をコンスタンティニエ（كُسطَنطينيه）と改め、帝都へと変えることを宣言した。"
 som_ottoman_events.4.a: "都市をオスマンのものとして整備せよ"
 som_ottoman_events.4.a.tt: "コンスタンティノープルのほぼ全POPがスンニ派・トルコ文化へと変化する。"

 # === 北部パック ===
 som_ottoman_north_pack: "バルカンへの道"
 som_ottoman_north_pack_desc: "コンスタンティノープルを手に入れた今、バルカン半島の諸国はオスマンの前に膝を屈さなければならない。ブルガリア、セルビア、ハンガリーを征服し、ウィーンの門に至れ。"
 som_ottoman_north_pack_BUTTON_TOOLTIP:0 "北部征服ミッションを達成せよ。"
 som_ottoman_north_pack_CRITERIA_DESCRIPTION:0 "バルカンからウィーンまでを征服せよ。"

 som_tur_edirne_base: "エディルネの整備"
 som_tur_edirne_base_desc: "エディルネはコンスタンティノープル以前のオスマンの首都であった。この都市を北部征服の拠点として整備し、行政基盤を固めよ。"
 som_tur_edirne_base_tooltip: "edirneを確保し支配度60%以上にする"

 som_tur_conquer_bulgaria: "ブルガリア征服"
 som_tur_conquer_bulgaria_desc: "タルノヴォはかつてブルガリア第二帝国の栄光ある首都であった。この都市を陥落させ、バルカン北部への道を開け。"
 som_tur_conquer_bulgaria_tooltip: "tarnovoを確保する"

 som_tur_conquer_serbia: "セルビア征服"
 som_tur_conquer_serbia_desc: "ノヴォ・ブルドはバルカン最大の銀山を持ち、スコピエはマケドニアへの要衝である。両都市を確保してバルカン南部を掌握せよ。"
 som_tur_conquer_serbia_tooltip: "novo_brdo・skopjeを確保する"

 som_tur_balkan_dominance: "バルカン制圧"
 som_tur_balkan_dominance_desc: "テッサロニキとアテネを確保し、バルカン半島全域をオスマンの支配下に置け。ギリシャの遺産がオスマン帝国に吸収される。"
 som_tur_balkan_dominance_tooltip: "thessaloniki・athensを確保する"

 som_tur_conquer_hungary: "ハンガリー侵攻"
 som_tur_conquer_hungary_desc: "モハーチの野で敵軍を打ち砕き、ブダを占領せよ。ドナウ川がオスマン帝国の北の境界線となる。"
 som_tur_conquer_hungary_tooltip: "budaを確保し陸軍40以上にする"

 som_tur_siege_vienna: "ウィーン包囲"
 som_tur_siege_vienna_desc: "ウィーンの城壁の前にオスマンの旗を翻せ。世界はオスマン帝国の力を目の当たりにするだろう。"
 som_tur_siege_vienna_tooltip: "viennaを確保し陸軍50以上・正統性85以上にする"

 # === 南部パック ===
 som_ottoman_south_pack: "南方への覇道"
 som_ottoman_south_pack_desc: "アナトリアを完全に統一し、シリアとエジプトを征服し、聖地を掌握し、紅海を制せよ。オスマン帝国こそイスラム世界の守護者である。"
 som_ottoman_south_pack_BUTTON_TOOLTIP:0 "南部征服ミッションを達成せよ。"
 som_ottoman_south_pack_CRITERIA_DESCRIPTION:0 "アナトリアからエジプト・聖地まで征服せよ。"

 som_tur_anatolia_unified: "アナトリア統一"
 som_tur_anatolia_unified_desc: "トレビゾンドとエルズルムを征服し、アナトリア全域をオスマンの支配下に置け。ポントゥス山脈の向こうに帝国の境界が定まる。"
 som_tur_anatolia_unified_tooltip: "trebizond・erzurumを確保する"

 som_tur_conquer_syria: "シリア進出"
 som_tur_conquer_syria_desc: "アレッポとダマスカスを征服せよ。シリアはイスラム世界の学術と交易の中心地であり、その掌握は帝国の威信を高める。"
 som_tur_conquer_syria_tooltip: "aleppo・damascusを確保する"

 som_tur_defeat_mamluks: "マムルーク朝制圧"
 som_tur_defeat_mamluks_desc: "マムルーク朝と戦争中にカイロを占領せよ。占領の成功がオスマン優位の和平を実現し、マムルークを属国化できる。"
 som_tur_defeat_mamluks_tooltip: "戦争中にcairoを占領する（陸軍35以上）"

 som_tur_holy_cities: "聖地の掌握"
 som_tur_holy_cities_desc: "エルサレムを確保し、スルタンがカリフ位を継承することを宣言せよ。二つの聖地の守護者としてオスマンはイスラム世界の頂点に立つ。"
 som_tur_holy_cities_tooltip: "jerusalemを確保し聖職者満足度60%以上にする"

 som_tur_red_sea_dominance: "紅海の制海"
 som_tur_red_sea_dominance_desc: "アレクサンドリアを確保し、紅海の交易路を掌握せよ。インド洋交易の富がオスマン帝国の国庫を満たす。"
 som_tur_red_sea_dominance_tooltip: "alexandriaを確保し海軍25以上・造船所15以上にする"

 som_tur_age_of_suleiman: "パクス・オトマーナ"
 som_tur_age_of_suleiman_desc: "南方への覇道が完成した。オスマン帝国はバルカンからエジプトまで、ボスポラスから紅海まで支配する世界帝国となった。これはスレイマン大帝の遺産である。"
 som_tur_age_of_suleiman_tooltip: "ロケーション数600以上・月収3000以上"

 # === イベント5〜11 ===
 som_ottoman_events.5.t: "タルノヴォの陥落"
 som_ottoman_events.5.d: "かつてブルガリア第二帝国の栄光ある首都であったタルノヴォが陥落した。バルカン山脈の向こうに広がる豊かな土地がオスマンの手に渡る。スルタンの軍はブルガリアの教会をモスクへと改め、新たな秩序を打ち立てる。"
 som_ottoman_events.5.a: "ブルガリアをオスマンの一部として整備せよ"
 som_ottoman_events.5.a.tt: "タルノヴォのPOPが全てスンニ派へと変化する。"

 som_ottoman_events.6.t: "バルカンの覇者"
 som_ottoman_events.6.d: "テッサロニキとアテネが陥落し、バルカン半島全域がオスマンの旗の下に統一された。アレクサンドロスの故郷、ソクラテスの都市、ビザンツの遺産——これら全てが今やスルタンのものとなった。"
 som_ottoman_events.6.a: "バルカンをオスマン帝国に統合せよ"
 som_ottoman_events.6.a.tt: "バルカン半島全域に秩序が確立される。"

 som_ottoman_events.7.t: "ウィーンの門前にて"
 som_ottoman_events.7.d: "オスマン軍の天幕がウィーンの城壁の前に広がった。ヨーロッパ全土が震え上がる。皇帝の軍も枢機卿の祈りも、スルタンの前進を止めることはできなかった。オスマン帝国はヨーロッパの心臓部にその力を刻みつけた。"
 som_ottoman_events.7.a: "ヨーロッパに帝国の力を示せ"
 som_ottoman_events.7.a.tt: "ウィーン包囲の戦訓が帝国軍に刻まれる。"

 som_ottoman_events.8.t: "ダマスカス入城"
 som_ottoman_events.8.d: "ダマスカス——ウマイヤ朝カリフの座、シルクロードの要衝、イスラム世界の学術の中心地——がオスマンの手に落ちた。大モスクにアザーンが響き渡り、商人たちは新しい支配者のもとで商いを続ける。スルタンはシリアの豊かな交易網を帝国のものとした。"
 som_ottoman_events.8.a: "ダマスカスの商業を帝国のものとせよ"
 som_ottoman_events.8.a.tt: "ダマスカスに商業区が建設され、交易収入が増加する。"

 som_ottoman_events.9.t: "マルジュ・ダービクの勝利"
 som_ottoman_events.9.d: "マルジュ・ダービクの野でオスマンの大砲がマムルーク騎兵を蹂躙した。マムルーク朝スルタン・カンスーフ・ガウリーは戦死し、数世紀にわたってエジプトとシリアを支配してきたマムルーク朝が崩壊した。カイロの城塞にオスマンの旗が翻る。"
 som_ottoman_events.9.a: "マムルークを白紙講和でエヤレトとして臣従させよ"
 som_ottoman_events.9.a.tt: "マムルーク朝がオスマンのエヤレトとなる。上納金2倍、外交併合速度2倍。"

 som_ottoman_events.10.t: "カリフ位の継承"
 som_ottoman_events.10.d: "エルサレムを掌握したスルタンは、最後のアッバース朝カリフの継承者からカリフ位を受け継いだ。預言者の後継者として、オスマンのスルタンは今やイスラム世界全体の宗教的指導者となった。メッカとメディナの守護者、二つの聖地の主。これがオスマン帝国の最高位である。"
 som_ottoman_events.10.a: "カリフとして世界に宣言せよ"
 som_ottoman_events.10.a.tt: "スルタンがカリフ位を継承し、イスラム世界の宗教的権威となる。"

 som_ottoman_events.11.t: "パクス・オトマーナ"
 som_ottoman_events.11.d: "パクス・オトマーナ——オスマンの平和が到来した。北はウィーンの城門から南はモロッコの大西洋岸まで、東はペルシャ湾のホルムズから西は地中海の全域まで。三大陸を一つの意志のもとに統べるオスマン帝国。かつてローマがパクス・ロマーナを世界に与えたように、今やオスマンが世界に平和と秩序をもたらす。歴史はこの時代を永遠に記憶するだろう。"
 som_ottoman_events.11.a: "パクス・オトマーナを世界に宣言せよ"
 som_ottoman_events.11.a.tt: "永続的な紅海交易モディファイア、大威信・大正統性ボーナス、月収×36の金が付与される。"

 # === 新モディファイア ===
 STATIC_MODIFIER_NAME_som_tur_edirne_administration: "エディルネの行政基盤"
 STATIC_MODIFIER_DESC_som_tur_edirne_administration: "古代のハドリアノポリスを引き継いだエディルネは、1363年にムラト1世がバルカン征服の拠点として首都に定めた。コンスタンティノープル征服（1453年）まで約90年間オスマン帝国の首都として機能し、スルタン・メフメト2世が産声を上げた地でもある。"

 STATIC_MODIFIER_NAME_som_tur_balkan_order: "バルカン秩序"
 STATIC_MODIFIER_DESC_som_tur_balkan_order: "コソボの戦い（1389年）でセルビア王国を打ち破り、ニコポリス（1396年）でヨーロッパ十字軍連合を壊滅させたオスマン軍はバルカン半島を完全に掌握した。デヴシルメ制度によってバルカンのキリスト教徒の子弟をイェニチェリ（新兵）として徴発したこの支配体制は、征服地の人的資源を帝国の軍事力に転換した。"

 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "ドナウ辺境"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "ドナウ川はローマ帝国時代から「文明の境界線」とされてきた大河だ。オスマン帝国にとってこの川の制御はハンガリー・ワラキア・モルドヴァへの軍事力投射の前提条件だった。1521年のベオグラード征服と1526年のモハーチの戦いでのハンガリー壊滅はこのドナウ前進基地あってこそ実現した。"

 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "アナトリア完全統一"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "アナトリア（小アジア）はオスマン帝国の心臓部だ。1402年のアンカラの戦いでティムールに敗れて一時崩壊した帝国が、メフメト1世の再統一によって再建された経験が示すように、アナトリア全域の掌握なくしてオスマン帝国の安定はない。"

 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "カリフの後継者"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "1517年のエジプト征服でセリム1世が最後のアッバース朝カリフからカリフ位を引き継いで以来、オスマン・スルタンはスンナ派イスラム世界の宗教的最高権威を兼ねた。「二聖モスクの護衛者（ハーディム・アル＝ハラマイン・アシュ＝シャリーファイン）」の称号はメッカ・メディナの守護者を意味する。"

 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "街道による帝国の統合"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "紅海はインド・東南アジアの香辛料・絹・染料がヨーロッパへ向かう黄金の航路だった。ポルトガルがアフリカ南端を回る新航路を開いた後も、カイロとアレクサンドリアを経由する紅海ルートはその価値を保ち続け、オスマン帝国はこの交易路の最大の受益者となった。"

 # === クリミア・黒海 ===
 som_tur_fate_of_crimea: "クリミアの運命"
 som_tur_fate_of_crimea_desc: "クリミア半島はジェノヴァ商人のカッファをはじめ、黒海北岸の交易を支配する要衝である。この地を確保し、黒海交易をオスマンの手に握れ。"
 som_tur_fate_of_crimea_tooltip: "クリミア地域に3都市以上を所有する"

 som_tur_black_sea_dominance: "黒海の支配"
 som_tur_black_sea_dominance_desc: "クリミアを掌握し、エディルネを整備し、アナトリアを統一した今、黒海はオスマンの内海と化した。コンスタンティノープルのRGOを発展させ、完全な黒海覇権を確立せよ。このミッションの達成により、コンスタンティノープルの絹の独占都市特権が解放される。"
 som_tur_black_sea_dominance_tooltip: "クリミア3都市 + コンスタンティノープルのRGO10以上・開発度40以上 → 絹の独占都市特権が解放"

 # === イタリア ===
 som_tur_italy_south: "南イタリア征服"
 som_tur_italy_south_desc: "ナポリとシチリアを征服し、地中海の制海権をオスマンのものとせよ。古来よりの交易都市が帝国の富をもたらす。"
 som_tur_italy_south_tooltip: "naples・palermo確保"

 som_tur_italy_north: "イタリア制圧"
 som_tur_italy_north_desc: "ローマ、フィレンツェ、ミラノを征服し、イタリア半島を完全掌握せよ。教皇の都市、メディチ家の都市、ヴィスコンティの都市——全てがスルタンのものとなる。"
 som_tur_italy_north_tooltip: "rome・florence・milano確保"

 # === アラビア・ペルシャ湾 ===
 som_tur_arabia_conquest: "アラビア半島の掌握"
 som_tur_arabia_conquest_desc: "メッカ、メディナ、スエズを掌握し、イスラム世界の聖地とインド洋への出口を完全に支配せよ。"
 som_tur_arabia_conquest_tooltip: "mecca・medina・suez確保"

 som_tur_persian_gulf: "ペルシャ湾の制海"
 som_tur_persian_gulf_desc: "ホルムズを掌握し、ペルシャ湾の交易路を支配せよ。インド洋交易の富がオスマンの国庫に流れ込む。"
 som_tur_persian_gulf_tooltip: "hormuz確保・海軍30以上"

 # === 北アフリカ ===
 som_tur_north_africa: "マグレブ征服"
 som_tur_north_africa_desc: "チュニス、アルジェ、トリポリを征服し、地中海南岸をオスマンの支配下に置け。バルバリア海賊もスルタンの旗の下に従う。"
 som_tur_north_africa_tooltip: "tunis・algiers・tripoli確保"

 som_tur_morocco: "モロッコ征服"
 som_tur_morocco_desc: "フェズとマラケシュを征服し、北アフリカ全域をオスマン帝国の版図に加えよ。大西洋の岸辺までがスルタンの領土となる。"
 som_tur_morocco_tooltip: "fez・marrakesh確保"

 # === FINAL更新 ===
 som_tur_age_of_suleiman_desc: "パクス・オトマーナ——オスマンの平和。北はウィーン、南はアラビア・モロッコまで、三大陸にまたがる世界帝国が完成した。かつてローマがパクス・ロマーナを世界に与えたように、オスマンは平和と秩序を三大陸に広める。ウィーン包囲、ペルシャ湾制覇、モロッコ征服の3つ全てを達成することが求められる。"

 # === イベント12〜17 ===
 som_ottoman_events.12.t: "黒海 — オスマンの内海"
 som_ottoman_events.12.d: "クリミア、エディルネ、アナトリアの三方からの包囲が完成し、黒海はついにオスマン帝国の内海となった。かつてジェノヴァの商船が往来したこの海に、今やオスマンの艦隊だけが君臨する。コンスタンティノープルの繁栄と黒海交易が一体となり、帝国に莫大な富をもたらすだろう。"
 som_ottoman_events.12.a: "黒海をオスマンの湖とせよ"
 som_ottoman_events.12.a.tt: "黒海がオスマンの内海となる。"

 som_ottoman_events.13.t: "ナポリとシチリア — 地中海の宝石"
 som_ottoman_events.13.d: "ナポリとパレルモが陥落した。かつてアラゴン王家が支配し、ノルマン人が征服したこの豊かな地が今やオスマンの手に渡った。地中海の中央部を掌握したことで、ヴェネツィアとジェノヴァの交易独占は終わりを告げる。"
 som_ottoman_events.13.a: "南イタリアをオスマン帝国に組み込め"
 som_ottoman_events.13.a.tt: "南イタリアの交易がオスマンのものとなる。"

 som_ottoman_events.14.t: "ローマ入城 — 帝国の頂点"
 som_ottoman_events.14.d: "ローマの門が開かれた。ペトロの墓の上に建てられた教皇の都市、フィレンツェのメディチ家の富、ミラノの鎧工房——全てがスルタンのものとなった。東西ローマ帝国の後継者として、オスマンのスルタンは今やヨーロッパ全土の覇者と名乗ることができる。"
 som_ottoman_events.14.a: "イタリアをオスマン帝国の宝庫とせよ"
 som_ottoman_events.14.a.tt: "イタリア半島全域がスルタンの支配下に入る。"

 som_ottoman_events.15.t: "アラビア半島の掌握"
 som_ottoman_events.15.d: "メッカとメディナ、スエズの港がオスマンの手に落ちた。イスラム最聖地の守護者として、そして紅海とインド洋の交易を独占する支配者として、オスマンのスルタンは地上のいかなる君主をも超える権威を持つ。年間十万のハッジ巡礼者がスルタンの慈悲に感謝を捧げる。"
 som_ottoman_events.15.a: "アラビアをイスラム世界の心臓部として整備せよ"
 som_ottoman_events.15.a.tt: "アラビア半島とイスラムの聖地が帝国に統合される。"

 som_ottoman_events.16.t: "マグレブ制圧"
 som_ottoman_events.16.d: "チュニス、アルジェ、トリポリが陥落し、地中海南岸の全てがオスマンの旗の下に統一された。バルバリア海賊の首領たちはスルタンに臣従し、その船はオスマン艦隊の一部として地中海を制する。"
 som_ottoman_events.16.a: "マグレブをオスマン帝国に統合せよ"
 som_ottoman_events.16.a.tt: "地中海南岸がオスマンの旗の下に統一される。"

 som_ottoman_events.17.t: "フェズとマラケシュ — アトラスの向こうへ"
 som_ottoman_events.17.d: "モロッコの古都フェズとマラケシュが陥落した。大西洋の岸辺まで達したオスマンの軍旗は、今や既知の世界の果てに翻る。三大陸を支配するオスマン帝国——これは人類史上かつてなかった帝国である。"
 som_ottoman_events.17.a: "大西洋まで帝国の旗を立てよ"
 som_ottoman_events.17.a.tt: "大西洋の岸辺まで帝国の旗が翻る。"

 # === 新モディファイア ===
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "クリミア支配"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "クリミア半島のカッファ（現在のフェオドシア）はジェノヴァが経営する黒海最大の奴隷市場だった。1475年にメフメト2世が征服したことでオスマン帝国は黒海を「内海」として掌握した。クリミア・ハン国はオスマンの属国として、ウクライナ・ロシアへの奴隷狩りを担う重要な軍事パートナーとなった。"

 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "黒海の覇者"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "黒海を「オスマンの湖」とすることはコンスタンティノープル征服から始まったメフメト2世の大戦略の核心だった。ジェノヴァの拠点カッファ・クリミアの制圧・モルドヴァの従属化により、黒海は完全にオスマンの内海となった。これによりヴェネツィア・ジェノヴァの東方交易独占は終わりを告げた。"

 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "南イタリアの支配"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "1480年にメフメト2世はイタリア南端のオトラントを占領し、ヨーロッパ・キリスト教世界に衝撃を与えた。スルタンの死によって撤退したが、このオトラント攻略はイタリア征服の序章だった。ナポリとシチリアを手中に収めることは地中海の制海権を完全にオスマンが握ることを意味する。"

 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "イタリア覇権"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "メフメト2世はコンスタンティノープルを征服した後、自らを「ローマ皇帝（カイサル・イ・ルーム）」と称した。ローマそのものを征服することでオスマン朝はローマ帝国の正式な後継者としての主張を完成させることができる。ルネサンスの宝庫イタリアの富と文化がオスマン帝国のものとなる。"

 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "アラビアの守護者"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "「両聖モスクの守護者」——メッカとメディナはイスラムの最も神聖な二つの地だ。1517年にセリム1世がエジプト・ヒジャーズを征服してこれらの地を手中に収め、オスマン・スルタンはスンナ派イスラム世界全体の宗教的保護者となった。毎年ハッジ（メッカ巡礼）を守護する義務と栄誉がスルタンに与えられた。"

 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "ペルシャ湾の商業支配"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "ホルムズ海峡はインド・東南アジアからの香辛料・絹がペルシャ湾を通過する際の唯一の出入口だ。この「世界の咽喉部」を掌握することは、ポルトガルがアフリカ回りで確立しようとしていたインド洋交易ルートに対抗する決定的な切り札となる。"

 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "マグレブの支配"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "バルバリア（北アフリカ）はハイレッディン・バルバロッサ（赤髭）率いるオスマン海軍の重要な根拠地となった。チュニス・アルジェリア・トリポリは地中海を航行するスペイン・ポルトガルの商船を脅かすバルバリア海賊の巣窟であり、オスマンはこれを取り込んで西地中海での海軍力を大幅に強化した。"

 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "アフリカ覇権"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "モロッコはサアド朝がスペインとポルトガルの進出に抵抗する最後の砦だった。地中海の「対岸」を完全に掌握することでオスマン帝国はかつてのローマ帝国さえ超える地中海制覇を達成する。サハラ以北のアフリカはオスマンの内陸海交易圏の一部となる。"
 som_tur_silk_monopoly_unlock_tt: "コンスタンティノープルの絹の独占都市特権が解放される。"
 som_tur_breadbasket_unlock_tt: "帝国のパン籠都市特権が解放される。"

 STATIC_MODIFIER_NAME_som_tur_silk_production: "絹産業の振興"
 STATIC_MODIFIER_DESC_som_tur_silk_production: "ビザンツ帝国は6世紀に修道士がコンスタンティノープルへ養蚕技術を密輸したことで中国の絹独占を破った。この技術はオスマン征服後もブルサを中心に受け継がれ、オスマン宮廷の衣装から輸出品まで帝国経済の重要な柱となった。"

 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "アンカラの織物業"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "アンカラの名産アンゴラ（アンゴラヤギの毛）は中世から知られた高級素材だ。繊細な繊維から作られる布地は遠くヨーロッパまで輸出され、オスマン帝国の交易品の中でも特に高い評価を得た。「アンゴラ」という名はこの都市名に由来する。"

 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "アンカラの絹産業"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "アンカラ周辺の高原では養蚕に適した桑の栽培が盛んだった。ブルサと並ぶアナトリアの絹産地として、アンカラの生糸はコンスタンティノープルの職人たちに供給され、豪奢なオスマン宮廷衣装を生み出す原料となった。"

 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "アンカラの染料業"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "アナトリアは古代から多様な染料植物の産地だった。アカネ（赤）・大青（藍）・サフラン（黄）などの染料植物がアンカラ周辺で栽培され、オスマン絨毯と染め布の鮮やかな色彩を生み出した。トルコ絨毯の名声はこの豊かな染料文化に負うところが大きい。"

 STATIC_MODIFIER_NAME_som_tur_edirne_dyes: "エディルネの染料業"
 STATIC_MODIFIER_DESC_som_tur_edirne_dyes: "トラキア地方は古代ギリシャ・ローマ時代から染料植物の名産地だった。エディルネ周辺で栽培されるアカネ・インジゴなどの植物はオスマン帝国の染色産業を支え、コンスタンティノープルのバザールで取引される布地の鮮やかな色彩の源となった。"

 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver: "ノヴォ・ブルドの銀山"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver: "ノヴォ・ブルド（「新しい山」の意）はセルビア北部に位置し、14〜15世紀にバルカン半島最大の銀・金産地として栄えた。年間6トンにも達した銀産出量はセルビア王国の繁栄を支えたが、1455年にメフメト2世がこれを征服してオスマン帝国の主要な貴金属供給地とした。"

 # === 属国タイプ ===
 eyalet: "エヤレト"
 eyalet_desc: "オスマン帝国の直轄地に準ずる属国。通常の封臣よりも強い支配を受け、上納金は2倍、外交併合の速度も2倍となる。"
