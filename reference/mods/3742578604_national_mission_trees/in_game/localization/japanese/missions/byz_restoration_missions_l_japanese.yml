l_japanese:
 byz_restoration_mission_pack: "ローマ帝国の復興"
 byz_restoration_mission_pack_desc: "コンスタンティノープルを奪還し、アナトリアとバルカンを取り戻し、四つの総主教座を再統一せよ。そしてローマに凱旋し、旧ローマ帝国の最大版図を取り戻すのだ。"
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "ローマ帝国の版図を復興せよ。"
 byz_restoration_mission_pack_DESCRIPTION:0 "滅びゆく帝国を救い、かつての栄光を取り戻せ。ローマの遺産を継ぐ者として、東西の旧領を再び帝国の旗の下に統べよ。"
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "崩壊の淵に立つビザンツ帝国を立て直し、かつてローマが支配した地中海世界を再びその版図に収めよ。レノヴァティオ・インペリイの夢を現実とするのだ！"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "ビザンツ帝国として旧ローマの領土を奪還し、レノヴァティオ・インペリイを達成せよ。"
 byz_retake_anatolia_west: "アナトリア西部の奪還"
 byz_retake_anatolia_west_desc: "スミルナを奪還し、アナトリア西部に帝国の権威を取り戻せ。"
 byz_retake_anatolia_west_tooltip: "smyrnaを確保する"
 byz_retake_anatolia_east: "アナトリア東部の奪還"
 byz_retake_anatolia_east_desc: "アンカラ、コンヤ、シヴァスを征服し、アナトリア全域を帝国の支配下に置け。この地に暮らすギリシャ文化の民をいかに統治するか、新たな統治制度の検討が始まるだろう。"
 byz_retake_anatolia_east_tooltip: "ankara・konya・sivasを確保する"
 byz_secure_greece: "ギリシャの回復"
 byz_secure_greece_desc: "アテネとコリントスを奪還し、ヘラスの地に正教とギリシャ文化を復興させよ。"
 byz_secure_greece_tooltip: "athens・corinthを確保する"
 byz_balkan_dominance: "バルカンの掌握"
 byz_balkan_dominance_desc: "ベオグラードとタルノヴォを征服し、バルカン半島全域に帝国の秩序を回復せよ。"
 byz_balkan_dominance_tooltip: "belgrad・tarnovoを確保する"
 byz_invasion_of_syria: "シリア侵攻"
 byz_invasion_of_syria_desc: "五大総主教座のひとつアンティオキアを含むシリアの地を征服せよ。古くからの交易路と豊かな生産地が、帝国に新たな実りをもたらす。"
 byz_invasion_of_syria_tooltip: "antiochを確保する"
 byz_protect_jerusalem: "エルサレムの保護"
 byz_protect_jerusalem_desc: "キリストが受難した聖地エルサレムを取り戻せ。ローマ皇帝の称号には聖地の守護者としての責務がある。多様な信仰の民がこの地で平穏に暮らせるよう、寛容な統治を敷くのだ。"
 byz_protect_jerusalem_tooltip: "jerusalem・acreを確保する"
 byz_dominion_of_aegyptus: "アエギュプトゥスの支配"
 byz_dominion_of_aegyptus_desc: "エジプトの学術都市アレクサンドリアとカイロを確保せよ。ナイルの肥沃な土地は、帝国に住む多くの民を養うだろう。"
 byz_dominion_of_aegyptus_tooltip: "alexandria・cairoを確保する"
 byz_control_aegean: "エーゲ海の制海"
 byz_control_aegean_desc: "クレタを確保し強力な艦隊を整備してエーゲ海の完全な制海権を握れ。"
 byz_control_aegean_tooltip: "海軍20・造船所10・クレタ確保"
 byz_retake_italy_south: "南イタリアの奪還"
 byz_retake_italy_south_desc: "ナポリとシチリアを奪還し、イタリア半島への足がかりを築け。"
 byz_retake_italy_south_tooltip: "naples・palermoを確保する"
 byz_reclaim_rome: "永遠の都ローマの奪還"
 byz_reclaim_rome_desc: "永遠の都ローマを奪還せよ。ローマ帝国の正統な後継者たるビザンツが、再び西方の都を手に入れる時が来た。"
 byz_reclaim_rome_tooltip: "rome確保・聖職者70%・正統性85"
 byz_iberian_conquest: "イベリア半島の征服"
 byz_iberian_conquest_desc: "トレドとコルドバを征服し、かつてのヒスパニア属州を帝国に取り戻せ。"
 byz_iberian_conquest_tooltip: "toledo・cordobaを確保する"
 byz_north_africa: "北アフリカの奪還"
 byz_north_africa_desc: "チュニス、トリポリ、アルジェを征服し、かつてのアフリカ属州を帝国に返還せよ。"
 byz_north_africa_tooltip: "tunis・tripoli・algiersを確保する"
 byz_north_italy: "北イタリア制圧"
 byz_north_italy_desc: "ヴェネツィア、ジェノヴァ、ミラノ、フィレンツェを征服し、イタリア半島全域をローマの名のもとに統一せよ。"
 byz_north_italy_tooltip: "venice・genoa・milano・florenceを確保する"
 byz_invasion_of_france: "フランス侵攻"
 byz_invasion_of_france_desc: "北イタリアとイベリアを手にした帝国の視線は、ガリアの地へと向かう。フランス地方の全域を征服し、西方における帝国の版図を完成させよ。"
 byz_invasion_of_france_tooltip: "paris・avignonを確保する"
 byz_renovatio_imperii: "レノヴァティオ・インペリイ"
 byz_renovatio_imperii_desc: "帝国の復興——。イベリアからガリア、北アフリカからイタリア、小アジアからバルカン、聖地まで。ユスティニアヌス大帝が夢見た地中海の統一が再び実現した。ロケーション数1000以上・月収2000以上が条件。"
 byz_renovatio_imperii_tooltip: "1000ロケーション・月収2000"
 byz_events.2.t: "スミルナの繁栄"
 byz_events.2.d: "スミルナを含むアナトリア西部の港市が奪還された。古来よりの交易都市が再びビザンツ商人の活動の場となる。エーゲ海交易が復活し、帝国の経済基盤が強化される。"
 byz_events.2.a: "スミルナの交易を振興せよ"
 byz_events.3.t: "アテネ——ヘラスの復興"
 byz_events.3.d: "アテネとコリントスが奪還された。ソクラテスとプラトンの都市、パルテノン神殿がそびえる丘が再びビザンツのものとなった。正教の修道院が再建され、ギリシャ語の学芸が復活する。"
 byz_events.3.a: "ヘラスの正教とギリシャ文化を復興せよ"
 byz_events.7.t: "南イタリア奪還"
 byz_events.7.d: "ナポリとパレルモが奪還された。かつてマグナ・グラエキアとして繁栄したこの地が、再びローマ帝国の一部となった。地中海交易の富が帝国の国庫に流れ込む。"
 byz_events.7.a: "南イタリアを帝国に統合せよ"
 byz_events.8.t: "永遠の都——ローマ入城"
 byz_events.8.d: "ローマ、七つの丘の都市、ペトロとパウロが殉教した地が奪還された。コンスタンティヌス大帝がこの地から帝国を統治したように、今再びローマ皇帝がローマに座する。教皇座もビザンツ皇帝のもとに従属する。歴史は巡った。"
 byz_events.8.a: "永遠の都を帝国の副都とせよ"
 byz_events.10.t: "レノヴァティオ・インペリイ"
 byz_events.10.d: "ローマ帝国の復興——。イベリアから小アジア、北アフリカからバルカン、そして聖地まで。ユスティニアヌス大帝が527年から565年にわたって追い求め、中世を通じて夢見られたローマ帝国の復興が、ついに現実のものとなった。東西教会は一つの玉座のもとに統一され、地中海はかつてのように「我らの海（マーレ・ノストルム）」となった。歴史は新たなページを開く。"
 byz_events.10.a: "レノヴァティオ・インペリイを世界に宣言せよ"
 byz_renovatio_unlock_tt: "レノヴァティオ・インペリイが達成された。"
 byz_reclaim_bursa: "ブルサの奪還"
 byz_reclaim_bursa_desc: "かつてビザンツ帝国の重要都市であったブルサを奪還せよ。シルクロードの要衝に位置するこの街の将来の産業をどう導くかは、帝国の選択に委ねられている。"
 byz_reclaim_bursa_tooltip: "bursaを確保する"
 byz_avoid_collapse: "没落を回避せよ"
 byz_avoid_collapse_desc: "帝国は崩壊の縁にある。だが正統性と国内の安定を保つことができれば、復興への道はまだ閉ざされていない。"
 byz_avoid_collapse_tooltip: "正統性50以上、安定度0以上"
 byz_events.20.t: "ブルサの将来"
 byz_events.20.d: "ブルサの工房では、職人たちが新たな生産方針を巡って議論している。古くからの絹織物の伝統を活かすか、高級な織物の生産に注力するか。帝国の決断が、この街の将来を決める。"
 byz_events.20.a: "絹の生産を奨励する"
 byz_events.20.b: "高級織物の生産に注力する"
 byz_events.21.t: "ニコメディアの将来"
 byz_events.21.d: "マルマラ海南岸の要衝ニコメディアが帝国の手に戻った。この地をどのような産業の中心地として育てるか、宮廷で議論が続いている。武具の生産を振興するか、桑を植えて絹の生産に乗り出すか。"
 byz_events.21.a: "武具の生産を振興する"
 byz_events.21.b: "桑を植え、絹の生産を始める"
 byz_reclaim_nicomedia: "イズニコミドの奪還"
 byz_reclaim_nicomedia_desc: "イズニコミド（イズミット）はマルマラ海南岸の要衝である。この地のRGOを絹産業に転換し、帝国の絹経済を再建せよ。支配度50%以上を確保することで、ローマ帝国復興の第一歩となる。"
 byz_reclaim_nicomedia_tooltip: "izmitを確保し支配度50%以上にする"
 byz_orthodox_antioch: "アンティオキアの正教化"
 byz_orthodox_antioch_desc: "アンティオキアの住民の過半数が正教に改宗したことを確認せよ。「キリスト者」の名が生まれたこの都市が、再び正教の光で満たされる。"
 byz_orthodox_antioch_tooltip: "antiochの正教人口が50%以上"
 byz_orthodox_jerusalem: "エルサレムの正教化"
 byz_orthodox_jerusalem_desc: "聖都エルサレムの住民の過半数が正教に改宗したことを確認せよ。聖墳墓教会の鐘が正教の典礼とともに鳴り響く。"
 byz_orthodox_jerusalem_tooltip: "jerusalemの正教人口が50%以上"
 byz_orthodox_alexandria: "アレクサンドリアの正教化"
 byz_orthodox_alexandria_desc: "アレクサンドリアの住民の過半数が正教に改宗したことを確認せよ。コプト教会の伝統が正教の枠組みに統合される。"
 byz_orthodox_alexandria_tooltip: "alexandriaの正教人口が50%以上"
 byz_orthodox_rome: "大シスマの終焉"
 byz_orthodox_rome_desc: "ローマの住民の過半数が正教に改宗したことを確認せよ。1054年の大シスマ以来分断されていた東西教会が、正教の勝利によって一つとなる。"
 byz_orthodox_rome_tooltip: "romeの正教人口が50%以上"
 byz_hellenic_athens: "パルテノンの復活"
 byz_hellenic_athens_desc: "アテネはアテナ女神の都市である。アクロポリスの丘に再びオリンポスの神々への捧げものが捧げられ、ヘレニズム宗教の復興がここから始まる。"
 byz_hellenic_athens_tooltip: "athensのヘレニズム人口が50%以上"
 byz_hellenic_corinth: "コリントスのポセイドン聖域"
 byz_hellenic_corinth_desc: "地峡イストモスに位置するコリントスには、かつて二つの海を繋ぐ交易路の守護神ポセイドンの神殿があった。この聖域を復興し、海神の祝福を帝国に呼び込め。"
 byz_hellenic_corinth_tooltip: "corinthのヘレニズム人口が50%以上"
 byz_hellenic_mystras: "ミストラスのアポロン聖域"
 byz_hellenic_mystras_desc: "スパルタ近郊のミストラスはペロポネソス半島の霊的中心地である。かつてアポロン神に捧げられたこの地に聖域を復興し、スパルタの勇猛な魂を呼び覚ませ。"
 byz_hellenic_mystras_tooltip: "mystrasのヘレニズム人口が50%以上、mykonosを領有"
 byz_hellenic_alexandria: "セラペイオンの再建"
 byz_hellenic_alexandria_desc: "アレクサンドリアのセラペイオンはかつて古代世界最大の神殿の一つだった。ギリシャ・エジプト混合の神セラピスを祀るこの神殿を再建することで、ヘレニズム宗教がエジプトの地に根付く。古代の知恵が再び集まり、新たなアレクサンドリア図書館の礎となる。"
 byz_hellenic_alexandria_tooltip: "alexandriaのヘレニズム人口が50%以上"
 byz_events.11.t: "アンティオキア——初代教会への回帰"
 byz_events.11.d: "かつて「キリスト者」という名が初めて使われたアンティオキアが、正教の光で満たされた。ペテロとパウロがここで宣教した記憶が蘇り、都市は正教の精神的拠点として新たな使命を担う。"
 byz_events.11.a: "アンティオキアを正教の守護のもとに置け"
 byz_events.12.t: "エルサレム——聖地に正教の鐘が鳴る"
 byz_events.12.d: "全正教徒が渇望した聖都エルサレムが正教の都市となった。聖墳墓教会には再び東方の典礼が響き渡り、巡礼者たちは感涙にむせぶ。これは単なる征服ではない——信仰の勝利である。"
 byz_events.12.a: "聖地を永遠に守護せよ"
 byz_events.13.t: "アレクサンドリア——学術と信仰の都の正教化"
 byz_events.13.d: "古代の知識が集積したアレクサンドリアが正教の都市となった。コプト教の古い伝統は正教の大きな流れに融合し、新プラトン哲学と神学の対話が再び花開こうとしている。"
 byz_events.13.a: "アレクサンドリアを正教の学術都市として整備せよ"
 byz_events.14.t: "大シスマの終焉——東西教会の統一"
 byz_events.14.d: "1054年、教皇レオ9世と総主教ケルラリオスが互いに破門し合ってから数世紀。カトリックとの分裂を終わらせる形ではなく、正教がローマを征服することで——大シスマは終焉した。ローマ市民の過半数が正教に改宗し、永遠の都は東方教会の西の柱となった。歴史はビザンツの信仰を選んだ。"
 byz_events.14.a: "大シスマの終焉を世界に宣言せよ"
 byz_events.15.t: "パルテノン——アテナ女神の復活"
 byz_events.15.d: "アクロポリスの丘に、再びアテナ女神への供物が捧げられた。かつてキリスト教の教会となっていたパルテノンが、今再び古代の神々の神殿として甦る。アテネ市民はオリンポスの神々の名を呼び、ヘレニズムの火が再び灯された。"
 byz_events.15.a: "アテナ女神の加護のもとに帝国を導け"
 byz_events.16.t: "コリントス——海峡の神ポセイドン"
 byz_events.16.d: "二つの海を見渡すコリントスの丘に、ポセイドンの神殿が復興された。地峡イストモスの神は古来より商人と船乗りを守護してきた。神殿での祭礼が復活し、コリントスは再び地中海交易の霊的中心地となる。"
 byz_events.16.a: "ポセイドンの祝福で交易を栄えさせよ"
 byz_events.17.t: "デロス——光の神アポロンの誕生地"
 byz_events.17.d: "エーゲ海に浮かぶ聖なる島デロスに、アポロンとアルテミスの誕生地として崇められたかつての神殿が再建された。エーゲ海全域から巡礼者と神官たちが集い、古代ギリシャの理性と美の精神が復活する。プレトンが夢見た新プラトン主義的帝国が、ここに実体を持ち始めた。"
 byz_events.17.a: "デロスの光を帝国に灯せ"
 byz_events.18.t: "セラペイオン——ヘレニズム復興の完成"
 byz_events.18.d_SKIP: "アレクサンドリアのセラペイオンが再建された。アレクサンドロス大王がエジプトを征服した後、ギリシャとエジプトの宗教を融合して生まれた神セラピス。その神殿はかつて古代世界最大の建築物のひとつとして名を馳せた。今再び黄金のセラピス像が神殿に輝き、世界中のヘレニズム信者が巡礼に集まる。古代世界の知恵と信仰が一堂に会するこの地から、新たなヘレニズム文明が花開く。"
 byz_events.18.a: "セラペイオンをヘレニズム世界の聖地とせよ"
 byz_faith_choice: "信仰の選択"
 byz_faith_choice_desc: "時代は新たな思想の季節を迎えている。ミストラスの宮廷では新プラトン主義の教えが語られ、コンスタンティノープルでは正教会の権威が問われている。帝国は精神的な岐路に立っている。"
 byz_faith_choice_tooltip: "1400年以降"
 byz_events.19.t: "信仰の岐路——正教会か、ヘレニズムか"
 byz_events.19.d: "ギリシャが奪還された。アテネのアクロポリスからはコンスタンティノープルが遠望でき、ペロポネソスの峰々にはかつての神殿の廃墟が眠っている。ビザンツ帝国の復興は単なる版図の回復ではない——魂の再建でもある。宮廷では二つの声が争っている。ひとつは「我らはキリストの民。正教会の守護者として帝国を再建すべし」と唱える聖職者たち。もうひとつは「プラトンとアリストテレスの土地に、なぜ外来の神を崇めるのか。古代ギリシャの神々こそ我らの魂の故郷だ」と語るヘレニズム哲学者たちだ。"
 byz_events.19.a: "正教会を守護する——東方教会の伝統を守れ"
 byz_events.19.a.tt: "正教会宗教ルートが解放される。アンティオキア・エルサレム・アレクサンドリア・ローマの正教化ミッションへ進める。"
 byz_events.19.b: "古代の神々を復興する——ヘレニズムの火を灯せ"
 byz_events.19.b.tt: "ヘレニズムルートが解放される。帝国がヘレニズム宗教に改宗し、アテネ・コリントス・ミストラス・アレクサンドリアの聖域復興ミッションへ進める。"
 byz_orthodox_path_start: "正教会の道"
 byz_orthodox_path_start_desc: "正教会の守護者として、聖地の奪還と改宗を進める道が開かれた。"
 byz_orthodox_path_start_tooltip: "正教会ルートが解放されている"
 byz_hellenic_path_start: "ヘレニズムの道"
 byz_hellenic_path_start_desc: "古代の神々を復興する道が開かれた。ヘラスの聖域を取り戻し、古代ギリシャ文明を再建せよ。"
 byz_hellenic_path_start_tooltip: "ヘレニズムルートが解放されている"
 byz_recovery_from_decline: "衰退からの回復"
 byz_recovery_from_decline_desc: "宮廷貴族の権勢を抑え、王権を再び確立せよ。皇帝の権威が回復すれば、国政の安定はおのずと取り戻されるだろう。"
 byz_recovery_from_decline_tooltip: "王室権力20%以上"
 byz_city_the_world_desires: "世界が焦がれる都"
 byz_city_the_world_desires_desc: "コンスタンティノープルは再び、世界中の人々が憧れる大都市へと成長した。この繁栄を恒久のものとせよ。"
 byz_city_the_world_desires_tooltip: "コンスタンティノープルの人口40万以上"
 byz_islamic_heartland: "イスラムの中心地"
 byz_islamic_heartland_desc: "メッカとメディナ、イスラムにとって最も神聖な二つの都市が、我らの手に落ちた。これらの聖地をどう扱うか、帝国は重大な決断を下さねばならない。"
 byz_islamic_heartland_tooltip: "medina・meccaを確保する"
 byz_events.22.t: "イスラムの聖地"
 byz_events.22.d: "メッカのカアバ、メディナの預言者のモスク——イスラム世界にとって最も神聖なこれらの場所は、いまや帝国の支配下にある。これらを破壊し正教の権威を示すか、あるいはその存在を受け入れ、巡礼者たちからの富を享受するか。"
 byz_events.22.a: "聖地を破壊する"
 byz_events.22.b: "聖地を受容する"
 STATIC_MODIFIER_NAME_byz_constantinople_restored: "帝都圏の復興"
 STATIC_MODIFIER_DESC_byz_constantinople_restored: "ニコメディア（イズニコミド）は古代ローマの東方首都の一つであり、ディオクレティアヌス帝が好んで居住した。コンスタンティノープル建設以前のローマ帝国東部の中心として、またビザンツ帝国時代には重要な海軍基地として機能したこの都市の奪還はコンスタンティノープル包囲を開始する前提条件だ。"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "アナトリア西部の復興"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "スミルナ（イズミル）・エフェソス・ニカイア（イズニク）——これらのアナトリア西部の都市は古代ギリシャ文明の揺籃の地だ。エフェソスの図書館跡、ニカイアの公会議が開かれた聖堂、パトモス島の黙示録——この地に深く根ざすギリシャ・キリスト教の伝統をビザンツ帝国の旗の下に再統合する。"
 STATIC_MODIFIER_NAME_byz_anatolia_east: "アナトリア東部の掌握"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "カッパドキアの岩窟修道院、アルメニア高原の修道院群、アンティオキアの古代キリスト教会——アナトリア東部にはギリシャ・アルメニア・シリア系キリスト教の伝統が深く刻まれている。これらの民族・宗教の多様性をビザンツの正教的寛容主義のもとに統合することが再建帝国の課題だ。"
 STATIC_MODIFIER_NAME_byz_greece_restored: "ヘラスの復興"
 STATIC_MODIFIER_DESC_byz_greece_restored: "アテネ・テサロニキ・ペロポネソス——古代ギリシャ文明とビザンツ・ギリシャ文化の核心地帯だ。ラテン人の支配（フランク朝アテネ公国など）やカタルーニャ傭兵団の略奪を経てオスマンに征服されたこれらの地を取り戻すことは、「ヘレニズム」の復興という千年の夢の実現だ。"
 STATIC_MODIFIER_NAME_byz_balkan_order: "バルカンの秩序"
 STATIC_MODIFIER_DESC_byz_balkan_order: "ビザンツ帝国は最盛期にはバルカン半島のほぼ全域を支配した。ブルガリア・セルビア・アルバニア・ワラキアとの複雑な関係をまとめ上げ、オスマンに奪われたバルカンを取り戻すことは、東ローマ帝国の版図を復元する大事業だ。"
 STATIC_MODIFIER_NAME_byz_syria_province: "シリア属州"
 STATIC_MODIFIER_DESC_byz_syria_province: "シリアはシルクロードの西端として古代から交易・工芸の中心地だった。ダマスカス鋼・アレッポの石鹸・シリアのガラス工芸——これらの名産品は地中海世界全体に輸出された。また4〜7世紀にはビザンツ帝国の最も豊かな属州として莫大な税収をもたらした歴史がある。"
 STATIC_MODIFIER_NAME_byz_judaea_province: "ユダエア属州"
 STATIC_MODIFIER_DESC_byz_judaea_province: "エルサレムとその周辺は三大一神教——ユダヤ教・キリスト教・イスラム教——の聖地が集中する地球上で最も宗教的に重要な地だ。ビザンツ帝国は614年のペルシャ侵攻と638年のアラブ征服まで聖地を守護した。正教会の総主教座が置かれるこの地を再統合することは帝国の精神的完成を意味する。"
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "エジプト属州"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "ナイルの肥沃な大地が、帝国全土でより多くの人々を支えることを可能にする。"
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "エーゲ海の制海"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "エーゲ海の制海権により海軍力と交易収入が向上する。"
 STATIC_MODIFIER_NAME_byz_rome_restored: "永遠の都の回復"
 STATIC_MODIFIER_DESC_byz_rome_restored: "ローマを奪還したことで帝国の威信が絶頂に達し、正統性・外交評判・改宗速度が大幅に向上する。"
 STATIC_MODIFIER_NAME_byz_hispania_province: "ヒスパニア属州"
 STATIC_MODIFIER_DESC_byz_hispania_province: "ヒスパニアの広大な土地から、帝国軍へ多くの兵が送られるようになる。"
 STATIC_MODIFIER_NAME_byz_africa_mod: "アフリカ属州"
 STATIC_MODIFIER_DESC_byz_africa_mod: "北アフリカの港湾と海軍基地が、帝国艦隊の士気を恒久的に高める。"
 STATIC_MODIFIER_NAME_byz_gallia_province: "ガリア属州"
 STATIC_MODIFIER_DESC_byz_gallia_province: "ガリアの広大な土地を制したことで、帝国陸軍の士気は恒久的に高まる。"
 STATIC_MODIFIER_NAME_byz_true_rome: "真のローマ"
 STATIC_MODIFIER_DESC_byz_true_rome: "ヴェネツィア・ジェノヴァ・ミラノの商業力が帝国の交易収入と売却効率を恒久的に向上させる。イタリア半島はもはやローマの分家ではなく、その本流である。"
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "レノヴァティオ・インペリイ"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "ローマ帝国の完全復興。街道による近接性コストが低下し、君主力が50%向上、最大支配度が5%上昇する。"
 STATIC_MODIFIER_NAME_byz_collapse_averted: "没落の回避"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "帝国はまだ滅びていない。危機を乗り越えた宮廷は、有力者たちが既得権益を失うことへの抵抗を和らげるため、特権剥奪に伴う負担を軽減する改革に着手した。"
 STATIC_MODIFIER_NAME_byz_bursa_silk: "ブルサの絹産業"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "ブルサで絹の生産が奨励され、絹の生産量が増加する。"
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "ブルサの高級織物業"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "ブルサの工房で高級織物の生産が振興され、生産量が増加する。"
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "ニコメディアの武具産業"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "ニコメディアの工房で武具の生産が振興され、生産量が増加する。"
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "ニコメディアの絹産業"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "ニコメディア周辺に桑が植えられ、絹の生産量が増加する。"
 STATIC_MODIFIER_NAME_byz_orthodox_holy_site: "正教の聖地"
 STATIC_MODIFIER_DESC_byz_orthodox_holy_site: "この都市が正教の聖地として認定され、人口収容力が200%向上する。"
 STATIC_MODIFIER_NAME_byz_orthodox_rome_site: "永遠の都の正教化"
 STATIC_MODIFIER_DESC_byz_orthodox_rome_site: "ローマが正教の都市となり、東西教会の全権威がビザンツに集中した。繁栄度・識字率・人口収容力が向上する。"
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "ヘレニズムの聖域"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "古代ギリシャの神々の聖域が復興し、繁栄・生産効率・改宗速度・寛容度が向上する。"
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "セラペイオン"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "セラペイオンの再建によりアレクサンドリアが古代世界の霊的中心地となった。繁栄・生産効率・識字率・改宗速度・寛容度が大幅に向上する。"
 STATIC_MODIFIER_NAME_byz_schism_ended: "大シスマの終焉"
 STATIC_MODIFIER_DESC_byz_schism_ended: "東西教会の分裂が正教の勝利によって終焉した。POP改宗速度が50%、POP同化速度が50%向上する。"
 STATIC_MODIFIER_NAME_byz_hellenic_triumph: "ヘレニズムの凱旋"
 STATIC_MODIFIER_DESC_byz_hellenic_triumph: "古代ギリシャ宗教の復興が完成し、正統性・寛容度・改宗速度・生産効率が大幅に向上する。"
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "衰退からの回復"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "皇帝の権威が回復し、国政はかつてよりも安定している。"
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "世界が焦がれる都"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "コンスタンティノープルは世界中から人々を惹きつける大都市となり、その生産活動と発展は他に類を見ない。"
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "聖地の破壊"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "イスラムの聖地を破壊したことで正教の権威は大いに示され、国教への信頼と帝国の威信が高まった。"
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "聖地の受容"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "イスラムの聖地を受け入れたことで、異教・異端の民への寛容さが増し、巡礼者で賑わう商人たちの活動も活発化した。"
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "衰退からの回復"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "ビザンツ帝国が衰退から立ち直り、王冠領と行政基盤が強化された。"
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "世界が焦がれる都"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "コンスタンティノープルが帝国行政の中枢として再建された。"
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "アフリカ属州"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "北アフリカが奪還されビザンツの海洋力が強化された。"
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "レノヴァティオ・インペリィの栄光"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "ローマ帝国の再興でビザンツが世界帝国の覇者として認められた。"
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "アンティオキアの正教化"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "アンティオキアが正教の聖地として回復し、帝国の信仰的権威が高まった。"
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "エルサレムの正教化"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "聖都エルサレムが正教化され異教徒との戦いでの優位が確立した。"
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "アレクサンドリアの正教化"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "アレクサンドリアが正教の聖地として回復し帝国の人口基盤が強化された。"
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "セラペイオンの再建"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "アレクサンドリアのセラペイオンが再建され、ヘレニズム信仰の改宗速度・神聖な前兆の力・宗教的影響力が大きく高まった。オリンポスの神々が再びエジプトの地に降臨した。"
