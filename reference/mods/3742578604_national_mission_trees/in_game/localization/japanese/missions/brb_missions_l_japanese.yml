l_japanese:
 brb_brabant_mission_pack: "下ロタリンギアの再興——低地諸国とブルゴーニュ吸収の道"
 brb_brabant_mission_pack_DESCRIPTION:0 "独立した公爵家に治められるブラバント公国——低地諸国を統一し、新興のブルゴーニュ公国を歴史に先んじて併合し、真の黄金時代を築け。"
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "低地諸国を統一し、ブルゴーニュを併合し、共和国を打ち立てて黄金時代を実現せよ。"
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "小公国から、低地諸国とブルゴーニュを統べる大公国へ。"
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "「我は守る（ジュ・マンティアンドレ）」——歴史を覆し、ブラバントの旗を低地諸国に打ち立てよ！"
 brb_ducal_authority: "公爵権の確立"
 brb_ducal_authority_desc: "ルーヴェン家の血を引く公爵として、その権威を公国の隅々にまで行き渡らせよ。"
 brb_joyous_entry: "喜ばしき入城（ブライデ・インコムスト）"
 brb_joyous_entry_desc: "新たな公爵が即位の際、都市の門をくぐり諸都市に特権を認める儀礼「喜ばしき入城」——この伝統を確立し、都市に独自の権利を授けよ。"
 brb_joyous_entry_unlock_tt: "都市特権「喜ばしき入城の都市」が使用可能になる。"
 brb_develop_antwerp: "アントウェルペンの発展"
 brb_develop_antwerp_desc: "スヘルデ川河口の商業都市アントウェルペン——この都市をさらに発展させ、北海交易の中心地たる地位を確固たるものとせよ。"
 brb_unify_brabant: "ブラバント統一"
 brb_unify_brabant_desc: "南北に分かれたブラバント公領——これを一つの旗のもとに統合せよ。"
 brb_flemish_rivalry: "フランドルとの角逐"
 brb_flemish_rivalry_desc: "豊かな毛織物産業で知られるフランドル伯領——古くからの好敵手であるこの地に、我が影響力を打ち立てよ。"
 brb_hainaut_marriage: "エノー＝ホラント家との婚姻"
 brb_hainaut_marriage_desc: "ヴィッテルスバッハ家が治めるエノー・ホラント・ゼーラント——婚姻、同盟、あるいは対立を通じて、この王位への請求権を確保せよ。"
 brb_liege_relations: "リエージュ司教領との関係"
 brb_liege_relations_desc: "広大な世俗権力を有するリエージュ司教領——対立か、あるいは婚姻による結びつきか。いずれにせよ、この地への請求権を確保せよ。"
 brb_utrecht_bishopric: "ユトレヒト司教領の統合"
 brb_utrecht_bishopric_desc: "広大な世俗権力を有するユトレヒト司教領——これを影響下に置き、低地諸国統一の礎とせよ。"
 brb_burgundian_ambition: "ブルゴーニュへの野心"
 brb_burgundian_ambition_desc: "低地諸国の主要な地を統べ、フランス王家の傍流が新たに公爵位を得て興った新興のブルゴーニュ公国——この地に、我が野心の目を向けよ。"
 brb_contest_flanders_inheritance: "フランドル継承権を争う"
 brb_contest_flanders_inheritance_desc: "フランドル女子相続人マルグリットの婚姻——この縁組を巡る争いに勝利し、ブルゴーニュ家に先んじてフランドルを我が手に収めよ。"
 brb_absorb_burgundy: "ブルゴーニュの併合"
 brb_absorb_burgundy_desc: "新興のブルゴーニュ公国を併合、あるいは服属させよ——歴史の流れを覆し、低地諸国の主はブラバントであると知らしめよ。"
 brb_valois_brabant: "ブラバント大公国"
 brb_valois_brabant_desc: "ブルゴーニュの遺領を吸収したブラバントは、もはや一公国にあらず——低地諸国に覇を唱える大公国として立て。"
 brb_je_maintiendrai: "我は守る（ジュ・マンティアンドレ）"
 brb_je_maintiendrai_desc: "ブラバント、フランドル、ホラント、そして併合したブルゴーニュの遺領——低地諸国の主要な地を統べる者として、その統治を守り抜け。"
 brb_hansa_relations: "ハンザ同盟との関係"
 brb_hansa_relations_desc: "バルト海交易を牛耳るハンザ同盟——彼らとの関係を、対等な立場から築き直せ。"
 brb_bulk_trade: "バルク交易の支援"
 brb_bulk_trade_desc: "穀物や木材などの大量輸送交易——バルト海における我が商船隊の存在感を高めよ。"
 brb_baltic_supremacy: "バルト海交易の覇権"
 brb_baltic_supremacy_desc: "北方の交易路を制する者こそ、真の商業国家である——バルト海交易における覇権を確立せよ。"
 brb_land_commercial_empire: "陸の商業帝国"
 brb_land_commercial_empire_desc: "海だけではない——内陸の主要な市場中心地を掌握し、陸路交易の帝国としても覇を唱えよ。"
 brb_secure_grain: "バルト海穀物の確保"
 brb_secure_grain_desc: "低地諸国は古くからバルト海の穀物に頼ってきた——この供給を自らの手に収めよ。"
 brb_reformation_choice: "宗教改革の選択"
 brb_reformation_choice_desc: "ルターの教えが低地諸国を揺るがす——信仰の岐路に立つ我らは、いかなる道を選ぶべきか。"
 brb_religious_settlement: "信教の和解"
 brb_religious_settlement_desc: "宗教改革から一世紀余り——国教が国民の大多数を占めるに至った今、対立する信仰の間に安定した和解をもたらせ。"
 brb_spanish_fury: "スペインへの怒り"
 brb_spanish_fury_desc: "ハプスブルク家の圧政と重税——「スペインの怒り」に対する民の怒りは、もはや抑えられない。"
 brb_sea_beggars: "海乞食団（ワーテルヘーゼン）"
 brb_sea_beggars_desc: "「海の乞食」を自称する私掠船団——彼らの活躍が、スペインの海上支配に風穴を開ける。"
 brb_eighty_years_war: "八十年戦争"
 brb_eighty_years_war_desc: "独立を求める長い戦い——この八十年戦争を耐え抜き、自由を勝ち取れ。"
 brb_united_netherlands: "統一ネーデルラント公国"
 brb_united_netherlands_desc: "七つの州が結ぶ連邦——ブラバント大公を戴く、貴族と都市の伝統を受け継ぐ諸侯連合国家をここに打ち立てよ。"
 brb_east_india_charter: "東インド勅許"
 brb_east_india_charter_desc: "アジア交易の独占を目指し、東インド会社設立の勅許を与えよ。"
 brb_voc_trade_empire: "VOC交易帝国"
 brb_voc_trade_empire_desc: "「連合東インド会社（VOC）」——世界初の株式会社が、香辛料諸島からアジア全域に交易網を広げる。"
 brb_west_india_company: "西インド会社"
 brb_west_india_company_desc: "新大陸とアフリカを結ぶ交易——西インド会社を設立し、大西洋の富に与れ。"
 brb_golden_age: "黄金時代（ホランドセ・ハウ）"
 brb_golden_age_desc: "レンブラント、フェルメール、そして繁栄する商業——「オランダ黄金時代」の絶頂を極めよ。"
 brb_amsterdam_exchange: "アムステルダム証券取引所"
 brb_amsterdam_exchange_desc: "世界初の証券取引所——アムステルダムを、ヨーロッパ金融の中心地とせよ。"
 brb_form_netherlands: "ネーデルラント大公国の完成"
 brb_form_netherlands_desc: "下ロタリンギアの遺産とブルゴーニュの併合から始まった長い道のりは、独立と黄金時代を経て、貴族と都市の伝統を色濃く残す大公国としてここに完成する。"
 brb_wool_staple_calais: "カレー羊毛市場"
 brb_wool_staple_calais_desc: "フランドルの毛織物産業を支えるイングランド産羊毛——カレーの羊毛市場を通じた交易を活発化させよ。"
 brb_anglo_dutch_alliance: "英蘭同盟"
 brb_anglo_dutch_alliance_desc: "海峡を挟んだ隣国イングランド——百年戦争の混乱の中、この国との関係を、同盟か対立かを問わず確固たるものとせよ。"
 brb_english_channel_trade: "イングランド海峡交易の覇権"
 brb_english_channel_trade_desc: "北海と大西洋を結ぶ海峡——この要衝における交易の覇権を確立せよ。"
 brb_valois_suzerainty_dispute: "ヴァロワ宗主権への異議"
 brb_valois_suzerainty_dispute_desc: "名目上フランス王家の臣下とされる立場——この宗主権に異議を唱え、対等な地位を求めよ。"
 brb_hundred_years_war_intervention: "百年戦争への介入"
 brb_hundred_years_war_intervention_desc: "英仏を引き裂く長き戦い——この機に乗じ、我が利益のために介入せよ。"
 brb_somme_towns: "ソンム川流域諸都市の獲得"
 brb_somme_towns_desc: "ピカルディの豊かな諸都市——ソンム川流域の地を、我が版図に組み込め。"
 brb_end_french_vassalage: "フランス臣従からの脱却"
 brb_end_french_vassalage_desc: "名目上の臣従関係——これを完全に断ち切り、真に独立した大公国としての地位を確立せよ。"
 brb_events.1.t: "八十年戦争の開始"
 brb_events.1.d: "ユトレヒト同盟と海乞食団の活躍によって、スペインとの長き戦いの火蓋が切られた。この戦いこそ、我らの独立を決定づけるものとなるだろう。"
 brb_events.1.a: "自由か、死か！"
 brb_events.2.t: "ブルゴーニュへの野心"
 brb_events.2.d: "新興のブルゴーニュ公国——その処遇について、いかなる道を選ぶべきか。"
 brb_events.2.a: "金銭を積み、封土として迎え入れる"
 brb_events.2.b: "ディジョンへの請求権を掲げ、武力による接収に備える"
 brb_events.2.c: "今はまだ、静観する"
 brb_events.3.t: "フランドル継承権を争う"
 brb_events.3.d: "フランドル女子相続人マルグリットを巡る継承問題——いかにしてこの豊かな地を我が手に収めるべきか。"
 brb_events.3.a: "金銭を積み、封土として迎え入れる"
 brb_events.3.b: "ブルッヘへの請求権を掲げ、武力による接収に備える"
 brb_events.3.c: "今はまだ、静観する"
 brb_events.99.t: "ネーデルラント大公国の宣言"
 brb_events.99.d: "下ロタリンギアの遺産を継ぎ、ブルゴーニュを併合した小さな公国は、独立と黄金時代を経て、ブラバント大公を戴きつつも貴族と都市の伝統を色濃く残す大公国へと生まれ変わった。"
 brb_events.99.a: "大公国に栄光あれ！"
