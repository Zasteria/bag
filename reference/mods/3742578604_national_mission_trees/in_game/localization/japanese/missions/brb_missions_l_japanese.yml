 STATIC_MODIFIER_DESC_brb_golden_age_mod: "文化と商業の繁栄が、国家の繁栄をもたらしている。"
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "アムステルダム証券取引所"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "金融の中心地アムステルダムが繁栄している。"
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "カレー羊毛市場"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "羊毛交易の活発化が、交易の富をもたらしている。"
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "英蘭同盟"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "イングランドとの同盟が、外交上の威信を高めている。"
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "イングランド海峡交易の覇権"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "海峡交易の覇権が、交易範囲を広げている。"
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "ヴァロワ宗主権への異議"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "宗主権への異議申し立てが、軍の士気を高めている。"
 STATIC_MODIFIER_NAME_brb_intervention_mod: "百年戦争への介入"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "介入の経験が、戦果を高めている。"
 STATIC_MODIFIER_NAME_brb_somme_mod: "ソンム川流域諸都市"
 STATIC_MODIFIER_DESC_brb_somme_mod: "獲得した諸都市が、戦果を高めている。"
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "フランス臣従からの脱却"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "真の独立が、国家の正統性と外交上の威信を高めた。"
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "ネーデルラント連邦共和国の完成"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "真の共和国の完成が、交易と威信のすべてを頂点へと導いた。"
