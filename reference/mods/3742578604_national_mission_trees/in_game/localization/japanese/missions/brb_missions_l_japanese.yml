 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "内陸交易網の掌握が、陸路交易の効率を高めている。"
 STATIC_MODIFIER_NAME_brb_grain_mod: "バルト海穀物の確保"
 STATIC_MODIFIER_DESC_brb_grain_mod: "安定した穀物供給が、動員力を高めている。"
 STATIC_MODIFIER_NAME_brb_reformation_mod: "宗教改革の選択"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "信仰の選択が、異端に対する寛容を高めた。"
 STATIC_MODIFIER_NAME_brb_settlement_mod: "信教の和解"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "信教の和解が、国内の安定をもたらしている。"
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "スペインの怒り"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "民の怒りが、軍の士気を高めている。"
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "海乞食団"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "私掠船団の活躍が、海軍の士気を高めている。"
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "統一ネーデルラント公国"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "諸侯連合国家の樹立が、国家の威信を高めた。"
 STATIC_MODIFIER_NAME_brb_east_india_mod: "東インド勅許"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "勅許の発布が、植民地への到達範囲を広げている。"
 STATIC_MODIFIER_NAME_brb_voc_mod: "VOC交易帝国"
 STATIC_MODIFIER_DESC_brb_voc_mod: "VOCの交易網が、属国の忠誠を高めている。"
 STATIC_MODIFIER_NAME_brb_wic_mod: "西インド会社"
 STATIC_MODIFIER_DESC_brb_wic_mod: "大西洋交易の富が、人口の増加をもたらしている。"
