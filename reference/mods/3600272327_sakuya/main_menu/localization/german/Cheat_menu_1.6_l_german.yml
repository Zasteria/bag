 SAKUYA_RELEASE_NON_CORES_TT: "#T  $RELEASE_NON_CORES_EFFECT$ #! \n $SAKUYA_LC$ Lassen Sie das markierte $game_concept_country$ alle nicht zum Kern gehörenden Provinzen freigeben.\n #n  Alt+Linksklick #! Sorgen Sie dafür, dass Ihr $game_concept_country$ alle nicht zum Kern gehörenden Provinzen freigibt.\n \n #n  Diese Aktion ändert direkt das Gebiet von $game_concept_country$ und kann nicht über diese Schaltfläche rückgängig gemacht werden.#!"
