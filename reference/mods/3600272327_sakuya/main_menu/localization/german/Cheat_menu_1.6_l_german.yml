 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Legen Sie das markierte $game_concept_country$ als unser $game_concept_rival$ fest.\n $SAKUYA_RC$ Kündigen Sie unsere $game_concept_rival$-Beziehung mit dem markierten $game_concept_country$ .\n $SAKUYA_SL$ Machen Sie die markierten $game_concept_country$ zu ihren $game_concept_rival$ .\n $SAKUYA_SR$ Kündigen Sie die markierte $game_concept_country$ 's $game_concept_rival$-Beziehung mit uns.\n $SAKUYA_CL$ Beide Länder legen sich gegenseitig als $game_concept_rival$ fest.\n $SAKUYA_CR$ Beide Länder kündigen die $game_concept_rival$-Beziehung.\n $SAKUYA_AL$ Setzen Sie den markierten $game_concept_country$ als unseren historischen $game_concept_rival$ .\n $SAKUYA_AR$ Brechen Sie unsere historische $game_concept_rival$-Beziehung mit dem markierten $game_concept_country$ ab."
