 SAKUYA_CHAR_TT_15: "#t Ehe und Scheidung #!\n$SAKUYA_LC$: Erzwingt die Heirat zwischen dem Ziel $game_concept_character$ und unserem $game_concept_ruler$ und ignoriert dabei die üblichen Heiratsbeschränkungen.\n$SAKUYA_SL$: Erzwingt die Heirat zwischen dem Ziel $game_concept_character$ und dem derzeitigen $game_concept_heir$ unseres Landes und ignoriert dabei die üblichen Heiratsbeschränkungen.\n$SAKUYA_RC$: Lass das Ziel $game_concept_character$ sich sofort von seinem/ihrer derzeitigen Ehepartner scheiden.\n$SAKUYA_SR$: Verhindert, dass das Ziel $game_concept_character$ heiratet (fügt den Modifikator $game_concept_modifier$ hinzu, der eine Heirat verhindert).\n#l Strg+Linksklick #!: Alle Ehebeschränkungen $game_concept_modifier$ für das Ziel $game_concept_character$ aufheben.\n#p Strg+Rechtsklick „ #!“: Verhindert, dass das Ziel $game_concept_character$ eine Ehe mit einem niederen Adligen eingeht (fügt das Verbot von Ehen mit Bürgern $game_concept_modifier$ hinzu).\n\n#low Das ist meine Mutter, aber auch meine Frau, meine Schwester und meine Tochter. #!"
