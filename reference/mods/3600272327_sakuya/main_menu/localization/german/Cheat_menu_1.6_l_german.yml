 SAKUYA_1_6_RGO_BUTTON_2_TT: "#T  $MODIFIER_TYPE_NAME_local_raw_material_output$ #! \n \n $MODIFIER_TYPE_DESC_local_raw_material_output$ \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  10% #! Ausgang.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -10% #! Ausgang.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  1000% #! Ausgang.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -1000% #! Ausgang.\n $SAKUYA_CL$ Alle durch große und kleine Schaltflächen hinzugefügten $game_concept_modifier$ entfernen.\n $SAKUYA_CR$ $SAKUYA_ADD_P$ #P  1% #! Ausgang.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  100% #! Ausgang.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -100% #! Ausgang.\n \n #low  Verschiedene Ebenen von $game_concept_modifier$ können gestapelt werden.#!"
