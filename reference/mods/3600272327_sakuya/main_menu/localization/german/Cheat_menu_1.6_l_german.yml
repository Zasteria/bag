 SAKUYA_1_6_LOC_POPGEN_AMOUNT_TT: "Wählen Sie die Anzahl $game_concept_population$ aus, die für jeden markierten $game_concept_location$ generiert werden soll. Durch Auswahl von 0 wird die Anzahl zurückgesetzt."
