 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T Effizienz der Kriegspunkte #!\n\nEs wird lediglich die Effizienz der Kriegspunkte bei den Friedensbedingungen für Gebiete angepasst, ohne dass dabei der Einfluss geringer Kontrolle mehr berücksichtigt wird.\n\n$SAKUYA_LC$: Kriegspunkte-Effizienz +10 %; mit derselben Anzahl an Kriegspunkten können mehr Gebiete erobert werden\n$SAKUYA_RC$: Effizienz der Kriegspunkte -10 %; für die gleiche Anzahl an Kriegspunkten erhält man weniger Territorium\n$SAKUYA_SL$: Kriegspunkt-Effizienz +10000 %\n$SAKUYA_SR$: Kriegspunkt-Effizienz -99 %\n$SAKUYA_CL$: Entfernt die Effizienz der alten und neuen Kriegspunkte, die durch diese Schaltfläche hinzugefügt wurden: $game_concept_modifier$"
 SAKUYA_1_6_CHAR_TT_18: "#T Allerlei nutzloses Krimskrams #!\n\n$SAKUYA_LC$: Ungeachtet des Geschlechts zum General der $game_concept_army$ oder der $game_concept_navy$ werden\n$SAKUYA_SL$: Aufnahme in das Kabinett ungeachtet geschlechtsspezifischer Beschränkungen\n$SAKUYA_RC$: Ermöglicht es, Shogun zu werden\n$SAKUYA_SR$: Erlaubt das Kommandieren der Festung\n$SAKUYA_AL$: „Geboren im Purpurzimmer“ hinzufügen $game_concept_modifier$\n$SAKUYA_AR$: „Die Katastrophe in Zentralasien“ hinzufügen $game_concept_modifier$\n#l Strg+Linksklick #!: Alle durch diese Schaltfläche hinzugefügten $game_concept_modifier$ löschen\n#p Strg+Rechtsklick „ #!“: Interaktion mit $game_concept_character$ für $game_concept_character$ deaktivieren"
