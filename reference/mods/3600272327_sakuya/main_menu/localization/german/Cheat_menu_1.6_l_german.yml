 SAKUYA_1_6_LOC_POPEDIT_APPLY_MARKED_TT: "$game_concept_population$ im markierten $game_concept_location$ im aktuellen Verhältnis verarbeiten.Erfordert mindestens einen markierten $game_concept_location$ ."
 SAKUYA_1_6_LOC_POPEDIT_APPLY_ALL_TT: "Verarbeiten Sie landesweit alle $game_concept_population$ in $game_concept_location$ s im aktuellen Verhältnis."
 SAKUYA_1_6_CHAR_TT_23_UNSELECTED: "#t Ändere $game_concept_character$ $game_concept_culture$ #!\n\n$SAKUYA_LC$: Ändern in [GetPlayer.GetNameWithNoTooltip] und $game_concept_culture$: in [Player.GetCulture.GetNameWithNoTooltip].\n$SAKUYA_RC$: Ersetze durch die markierte $game_concept_culture$ von $game_concept_country$.\n$SAKUYA_SL$: Öffnet den Selektor $game_concept_culture$.\n#n Strg+Linksklick „ #!“: Löscht die im Selektor „$game_concept_culture$“ ausgewählte Option „$game_concept_culture$“."
 SAKUYA_1_6_CHAR_TT_23_SELECTED: "#t Ändern $game_concept_character$ $game_concept_culture$ #!\n\n $SAKUYA_LC$ : Ändert $game_concept_culture$ auf [GetPlayer.GetNameWithNoTooltip] : [Player.GetCulture.GetNameWithNoTooltip] . \n $SAKUYA_RC$ : Ändert $game_concept_culture$ auf  markierte $game_concept_country$ . \n $SAKUYA_SL$: Ändern  im $game_concept_culture$ ausgewählte $game_concept_culture$. \n#n Strg + linke Maustaste #!: Löschen  im $game_concept_culture$ ausgewählten $game_concept_culture$. \n\n#p Derzeit haben Sie eine $game_concept_culture$ ausgewählt #!"
 SAKUYA_1_6_CHAR_TT_24_UNSELECTED: "#t Ändere $game_concept_character$ $game_concept_religion$ #!\n\n$SAKUYA_LC$: Ändern in [GetPlayer.GetNameWithNoTooltip] für $game_concept_religion$: [Player.GetReligion.GetNameWithNoTooltip].\n$SAKUYA_RC$: Ersetze durch die markierte $game_concept_religion$ von $game_concept_country$.\n$SAKUYA_SL$: Öffnet den Selektor $game_concept_religion$.\n#n Strg+Linksklick #!: Löscht die im Selektor $game_concept_religion$ ausgewählte Option $game_concept_religion$."
 SAKUYA_1_6_CHAR_TT_24_SELECTED: "#t Ändern $game_concept_character$ $game_concept_religion$ #!\n\n $SAKUYA_LC$ : Ändert $game_concept_religion$ von [GetPlayer.GetNameWithNoTooltip] auf [Player.GetReligion.GetNameWithNoTooltip] . \n $SAKUYA_RC$ : Ändert $game_concept_religion$ auf die des markierten $game_concept_country$ . \n $SAKUYA_SL$: Ändere auf  im $game_concept_religion$ ausgewählte $game_concept_religion$. \n#n Strg + linke Maustaste #!: Lösche  im $game_concept_religion$ ausgewählte $game_concept_religion$. \n\n#p Derzeit hast du eine $game_concept_religion$ ausgewählt #!"
 SAKUYA_1_6_MAIN_CULTURE_TT_UNSELECTED: "#t  Ändern Sie Ihr $game_concept_primary_culture$ #! \n \n $SAKUYA_LC$ Ändern Sie $game_concept_primary_culture$ unseres Landes in $game_concept_primary_culture$ des markierten $game_concept_country$ .\n $SAKUYA_RC$ Ändern Sie $game_concept_primary_culture$ des markierten $game_concept_country$ in $game_concept_primary_culture$ unseres Landes.\n $SAKUYA_SL$ Öffnen Sie den $game_concept_culture$-Selektor.\n #n  Strg+Linksklick #! Löscht das ausgewählte $game_concept_culture$ im $game_concept_culture$-Selektor.\n \n #n  Hinweis: Linksklick und Rechtsklick erfordern ein markiertes $game_concept_country$ .#!"
