 SAKUYA_1_6_LOC_POPGEN_START_PANEL_TT: "Für jeden markierten $game_concept_location$ wird jeweils eine Ausgabe generiert. Falls noch keine $game_concept_location$ markiert sind, markieren Sie  bitte zunächst im  auf der rechten $game_concept_location$."
