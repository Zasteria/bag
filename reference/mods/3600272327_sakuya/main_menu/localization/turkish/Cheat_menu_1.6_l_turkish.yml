 SAKUYA_1_6_CHAR_TT_23_UNSELECTED: "#t $game_concept_character$ $game_concept_culture$ değiştir #!\n\n$SAKUYA_LC$: [GetPlayer.GetNameWithNoTooltip] olarak değiştirin; $game_concept_culture$: [Player.GetCulture.GetNameWithNoTooltip] olarak değiştirin.\n$SAKUYA_RC$: İşaretlenmiş $game_concept_country$'nin $game_concept_culture$'siyle değiştirin.\n$SAKUYA_SL$: $game_concept_culture$ seçicisini açar.\n#n Ctrl+sol tuş #!: $game_concept_culture$ seçicisinde seçili olan $game_concept_culture$ öğesini temizler."
 SAKUYA_1_6_CHAR_TT_23_SELECTED: "#t $game_concept_character$ $game_concept_culture$ değiştir #!\n\n$SAKUYA_LC$: [GetPlayer.GetNameWithNoTooltip] olarak değiştirin; $game_concept_culture$: [Player.GetCulture.GetNameWithNoTooltip] olarak değiştirin.\n$SAKUYA_RC$: İşaretlenmiş $game_concept_country$'nin $game_concept_culture$'siyle değiştirin.\n$SAKUYA_SL$: $game_concept_culture$ seçicisinde seçilen $game_concept_culture$ ile değiştirin.\n#n Ctrl+sol tuş #!: $game_concept_culture$ seçicisinde seçili olan $game_concept_culture$ öğesini temizler.\n\n#p Şu anda bir $game_concept_culture$ seçtiniz #!"
 SAKUYA_1_6_CHAR_TT_24_UNSELECTED: "#t $game_concept_character$ $game_concept_religion$ değerlerini değiştir #!\n\n$SAKUYA_LC$: [GetPlayer.GetNameWithNoTooltip] olarak değiştirin; $game_concept_religion$: [Player.GetReligion.GetNameWithNoTooltip] olarak değiştirin.\n$SAKUYA_RC$: İşaretlenmiş $game_concept_country$'nin $game_concept_religion$'una değiştirin.\n$SAKUYA_SL$: $game_concept_religion$ seçicisini açar.\n#n Ctrl+sol tuş #!: $game_concept_religion$ seçicisinde seçili olan $game_concept_religion$ öğesini temizler."
