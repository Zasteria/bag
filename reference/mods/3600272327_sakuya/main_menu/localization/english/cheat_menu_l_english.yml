SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.6_title: "#t $CHEAT_MENU_TITLE$ v1.6 Update Notes#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.6_text: "#n Hello everyone, Xier here.#! Summer is a fine season for travelling, enjoying the sun, and updating $CHEAT_MENU_TITLE$. Xier brings you $CHEAT_MENU_TITLE$ v1.6. This update adds a large amount of new content for the growing experimentation and testing needs created by EU5 1.2 and 1.3 mechanics.\N\N#p $SAKUYA_MENU_TAB_MILITARY$ Update#!\NAs the game keeps expanding and its version cycle matures, the original $SAKUYA_ARMY_GENERATOR_TITLE$ has finally reached its ultimate complete form. In this $SAKUYA_ARMY_GENERATOR_TITLE$, you can freely generate any amount and type of $game_concept_army$ and $game_concept_navy$. If you have marked any $game_concept_location$ owned by [GetPlayer.GetNameWithNoTooltip] on the map, the generated $game_concept_army$ will precisely appear at that $game_concept_location$; if no $game_concept_location$ has been marked, it will gather at the capital by default. The $game_concept_navy$ will first use a marked friendly port, and if no valid port is available, it will return to the capital port or another friendly port. In addition, some $SAKUYA_MENU_TAB_MILITARY$ buttons have been optimized and reworked, including the logic related to $SAKUYA_MIL_BUTTON_SP6$ and value edits such as $SAKUYA_1_6_MIL_BUTTON_6$ and $SAKUYA_1_6_MIL_BUTTON_7$.\N\N#p $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$ Update#!\NXier developed the corresponding version of $CHEAT_MENU_TITLE$ for another Paradox game, Victoria 3, and gained a great deal of useful experience from it. Now you can choose the $game_concept_culture$ and $game_concept_religion$ you want to mark, instead of being limited to [GetPlayer.GetNameWithNoTooltip] and the marked $game_concept_country$'s $game_concept_culture$ and $game_concept_religion$. Follow the guidance inside the menu to complete the operation. Many players asked for custom [casus_belli|E] when using $SAKUYA_DECLARE_WAR_TITLE$, so Xier has introduced a new custom [casus_belli|E] configuration feature. Whether the player acts against the target $game_concept_country$ or the target $game_concept_country$ acts against the player, it can now be configured flexibly. $CHEAT_MENU_BUTTON_TRUST$ has also been improved, and bilateral $CHEAT_MENU_BUTTON_TRUST$ can now be changed freely. However, due to Clausewitz loose matching and similar engine limitations, the value may not refresh immediately; let the game update the relevant state machine before checking the latest number. Now $CHEAT_MENU_BUTTON_ANNEX$ on a specified $game_concept_country$ no longer carries any penalty. EU5 1.2 introduced $SAKUYA_AI_PERSONALITY_TITLE$, so Xier has made a dedicated new menu for editing $SAKUYA_AI_PERSONALITY_TITLE$. You can now easily edit the $SAKUYA_AI_PERSONALITY_TITLE$ of your own $game_concept_country$ or a target $game_concept_country$. In addition, new functions were added for $SAKUYA_RELEASE_NON_CORES_BUTTON$, $diplomatic_status_rivals_name$, $CHEAT_MENU_BUTTON_GREAT_POWER_SCORE$, and $CHEAT_MENU_BUTTON_CONSOLE_2$. Some functions such as $CHEAT_MENU_BUTTON_ANNEXATION_SPEED$ have also been fixed.\N\N#p $SAKUYA_MENU_TAB_CHARACTER$ Menu Update#!\NIn version 1.2, Paradox made many changes to $game_concept_trait$, added the $sakuya_character_button_Trait_group6_box_TT$ group, and apparently added new content such as $sakuya_character_button_Trait_group7_box_TT$. Xier therefore added a $game_concept_character$$game_concept_trait$ editing function. Unlike before, however, the $game_concept_trait$ added by $CHEAT_MENU_TITLE$ may not always work correctly. Many $game_concept_trait$ entries require specific conditions; for example, $babbling_buffoon$ requires the marked $game_concept_character$ to have $game_concept_dip$ below 80. You can check the EU5 Wiki for the specific requirements of each $game_concept_trait$. $SAKUYA_CHAR_BUTTON_29$ editing is now available. #low But why not use $SAKUYA_CHAR_BUTTON_15$ instead...?#! Also, the $SAKUYA_CHAR_BUTTON_18$ button in the $SAKUYA_MENU_TAB_CHARACTER$ menu now includes $game_concept_modifier$ actions related to [ShowModifier('timmy_wants_to_play')] and [ShowModifier('byz_born_in_the_purple_modifier')]. #low In fact, I had already hidden [ShowModifier('timmy_wants_to_play')] as an easter egg in the lower-right hidden menu of the $SAKUYA_MENU_TAB_CHARACTER$ page when the game first launched, but later found that almost nobody noticed it...#! Similar to changing a $game_concept_country$'s $game_concept_culture$ and $game_concept_religion$, $game_concept_character$ can now also use custom $game_concept_culture$ and $game_concept_religion$. $SAKUYA_CHAR_BUTTON_28$ is still not very stable, so I personally recommend avoiding it when possible. Oh, and Xier has greatly optimized the activation logic of the $SAKUYA_MENU_TAB_CHARACTER$ menu to reduce stutters. The tradeoff is that if you frequently switch the marked $game_concept_character$, you may need to close and reopen $CHEAT_MENU_TITLE$ or switch to another page and return to the $SAKUYA_MENU_TAB_CHARACTER$ menu to refresh the state.\N\N#p $SAKUYA_LOC_TITLE$ Update#!\NAt long last! Xier spent a long time studying how to edit $game_concept_building$ and had been stuck for quite a while. After finishing the Victoria 3 version of $CHEAT_MENU_TITLE$, that previous experience finally helped solve this underlying problem. For the GUI layout, I drew on mature experience from the previous project and added pseudo-sliders, dynamic data containers, and other controls to create a smoother interaction flow. Now you can add $game_concept_building$ to any $game_concept_location$ under your rule. There are many kinds of $game_concept_building$, so Xier has roughly grouped them by $game_concept_building$ type for easier browsing. You can add any number of $game_concept_building$ with one click, and you can also clear $game_concept_building$ whenever needed. However, one-click clearing for $estate_category$ still has some technical difficulties and will need more time. In addition, $SAKUYA_1_6_LOC_POPGEN_TITLE$ and $SAKUYA_1_6_LOC_POPEDIT_TITLE$ are also included in this version. $SAKUYA_1_6_LOC_POPGEN_TITLE$ lets you choose $SAKUYA_1_6_LOC_POPGEN_AMOUNT$, $SAKUYA_1_6_LOC_POPGEN_CLASS$, $game_concept_culture$, and $game_concept_religion$, then generate new $game_concept_population$ in marked $game_concept_location$s. $SAKUYA_1_6_LOC_POPEDIT_TITLE$ is used to process existing $game_concept_population$ in batches. You can choose all $game_concept_population$ or a specific $game_concept_pop_type$, then apply $SAKUYA_1_6_LOC_POPEDIT_ASSIM_PANEL$ and $SAKUYA_1_6_LOC_POPEDIT_CONV_PANEL$ by ratio to marked $game_concept_location$s or the entire country. This part also supports your country, the target $game_concept_country$, and the marked $game_concept_culture$ and $game_concept_religion$, making it easier to guide both new and existing $game_concept_population$ in the direction you want.\N\N#p Other#!\NThe background system has also received new content, including background choices such as $SAKUYA_BTN9_SETTING_11$ and $SAKUYA_BTN9_SETTING_12$. The compatibility note on the About page has been rewritten and no longer uses the old warning about having to overwrite gui/message_log.gui; in version 1.6 and later, $CHEAT_MENU_TITLE$ no longer occupies any game system GUI file, so conflicts with other UI mods should be much rarer in theory. Since it now uses a shared registration entry, please make sure the required dependency is loaded correctly. In addition, the multilingual localization files for the new 1.6 systems have been organized to leave a clearer path for future translation and maintenance."
