SAKUYA_CHAR_KOISHI_TT: "#t How should I mark characters?#!\n\n#p If the target character is in your country (like [GetPlayer.GetNameWithNoTooltip])...#!\nJust click the character to open the interface, or right-click the avatar, and select #l $sakuya_select_chosen_one$#!. If you want to unmark them, please re-enter the character interface to refresh, and click #l $sakuya_deselect_chosen_one$#!.\nYou can also use #l $SAKUYA_AFTERBURNER$#! to mark characters both domestic and foreign more conveniently. $SAKUYA_AFTERBURNER$ is available on the Steam Workshop or Discord channel.\n\n#p What if the target character is not in [GetPlayer.GetNameWithNoTooltip]?#!\nYou need to #white first mark#! the #x country#! where the character is located, then use #T $CHEAT_MENU_MARK_LEADER$#! in the $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$ menu. Currently supports marking rulers, spouses, heirs, or regents. When the icon disappears, it means the marking is successful.\n\n#p Can't find the $sakuya_select_chosen_one$ option?#!\nIn some special cases (like $SWE$), your country's ruler might not be in the country at the start. In this case, please confirm the character's current location first, and mark the country they are currently in.\n\n#p How to unmark?#!\nCasually mark a domestic character, then click #l $sakuya_deselect_chosen_one$#!. This method works whether the target character is abroad or has already passed away.\n\n#t $game_concept_trait$ Explanation#!\n\n#p Some $game_concept_trait$s require specific conditions to be added.#! For example, #n $babbling_buffoon$#! requires $game_concept_dip$ to be below 80. The specific requirements for each $game_concept_trait$ can be found on the EU5 Wiki."
