sakuya_country_motto_papacy: "The Lord will provide" # Latin original: Dominus providebit
sakuya_country_motto_italy_no_rome: "What's there to fear? The Pope doesn't bite."
sakuya_country_motto_italy: "FERT, FERT, FERT" # Savoy dynasty motto: FERT, FERT, FERT. Meaning unknown, keep original.
sakuya_country_motto_venice: "Peace be with you, Mark,\nmy evangelist" # Motto of the Lion of Saint Mark: Pax tibi Marce evangelista meus
sakuya_country_motto_hre_rome: "So Holy! So Roman! And truly an Empire!"
sakuya_country_motto_hre: "It may be Holy, but it's not Roman, and it's barely an Empire."
sakuya_country_motto_genoa: "The Republic of Genoa" # Latin inscription: Respublica Ianuae
sakuya_country_motto_north_italy: "To rule is to make believe" # Motto attributed to Machiavelli
sakuya_country_motto_south_italy: "To see [Player.GetCapital.GetNameWithNoTooltip] in the morning and die in the evening would be content."
sakuya_country_motto_russia: "God is with us" # Inscription on Peter the Great's throne: С нами Бог
sakuya_country_motto_mamluk: "Victory belongs to the victor" # A long-standing but unverified motto
sakuya_country_motto_usa: "Out of many, one" # US motto: E pluribus unum
sakuya_country_motto_rome: "Rome, the beginning of the Empire, returns to my hand" # Player original motto
sakuya_country_motto_byzantium_crusade_revenge: "The Byzantine armies longed for vengeance for the shocking betrayal of the Crusade. When they descended upon the once-great city of Venice, no one was spared. The task of the imperial generals was clear: all noble families must be stripped of their wealth and honor, and those treasures stolen from the 'City of the World's Desire' (Constantinople) must be returned in full." # EU4 "Purple Phoenix" Venice mission text
sakuya_country_motto_byzantium: "#I The Phoenix is reborn from the ashes!#!" # No explanation needed when you see this, right?
sakuya_country_motto_jap: "May your reign last a thousand, eight thousand generations,\nUntil the pebbles grow into boulders\nLush with moss" # Prototype of the Kimi Ga Yo lyrics, Waka: 我が君は 千代にやちよに さざれ石の 巌となりて 苔のむすまで Note: Not the lyrics of Kimi Ga Yo. This is its prototype, a haiku from the Satsuma Biwa haiku collection "Horaisan". Don't translate it carelessly.
sakuya_country_motto_japan: "Eight crown cords, one roof" # Japanese imperial slogan, from Emperor Jimmu's edict
sakuya_country_motto_nordic: "By faith alone" # Reformation slogan: Sola fide
sakuya_country_motto_korea: "The morning sun is bright and clear" # Common Joseon dynasty proverb
sakuya_country_motto_armenia: "A lament for [Player.GetCapital.GetNameWithNoTooltip]" # From the title of "Lament" by Ghazaros of Sebastia after the fall of Sis, the capital of the Kingdom of Cilicia, in 1375
sakuya_country_motto_serbia: "Better to be in a grave than to be a slave" # Serbian national motto
sakuya_country_motto_bulgaria: "The forest is our father" # Bulgarian national motto
sakuya_country_motto_romania: "He that is not with me is against me" # Romanian national motto
sakuya_country_motto_holland: "A small country flourishes through unity" # Dutch motto
sakuya_country_motto_flanders: "Lion of Flanders!" # Battle cry of the Flemish city militias during the Battle of the Golden Spurs in 1302
sakuya_country_motto_netherlands: "The welfare of the state is the supreme law" # Enlightened absolutism motto from the Austrian Netherlands period
sakuya_country_motto_low_countries: "Between the hammer and the anvil" # Low Countries motto
sakuya_country_motto_delhi: "Pulpit and Coin" # Delhi Sultanate motto
sakuya_country_motto_vijayanagar: "The yellow cow is showing its strength." # EU4 Chinese player meme
sakuya_country_motto_bahmanis: "The blue cow is showing its strength." # EU4 Chinese player meme
sakuya_country_motto_zurich: "Democracy is the effort against violence." # Zurich motto
sakuya_country_motto_switzerland: "One for all, all for one" # Swiss motto
sakuya_country_motto_sakuya: "#COLOR:{0.09,0.44,0.25} F#!#COLOR:{0.15,0.48,0.30} l#!#COLOR:{0.22,0.51,0.35} o#!#COLOR:{0.28,0.55,0.40} w#!#COLOR:{0.35,0.58,0.46} e#!#COLOR:{0.41,0.62,0.51} r#!#COLOR:{0.48,0.65,0.56} i#!#COLOR:{0.54,0.69,0.61} n#!#COLOR:{0.60,0.72,0.66} g#!#COLOR:{0.67,0.76,0.71}  #!#COLOR:{0.73,0.79,0.76} N#!#COLOR:{0.80,0.83,0.82} i#!#COLOR:{0.86,0.86,0.87} g#!#COLOR:{0.93,0.90,0.92} h#!#COLOR:{0.99,0.93,0.97} t#!" # Guess why I wrote this line for a random country? Send your guess to Xierme@ya.ru. Let's see how many people guessed right. If you are a GUI researcher, you must be curious about how the colored text is done. Well, here is the application method for you.
