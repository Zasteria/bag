dip$ below 80. You can check the EU5 Wiki for the specific requirements of each $game_concept_trait$. $SAKUYA_CHAR_BUTTON_29$ editing is now available. #low But why not use $SAKUYA_CHAR_BUTTON_15$ instead...?#! Also, the $SAKUYA_CHAR_BUTTON_18$ button in the $SAKUYA_MENU_TAB_CHARACTER$ menu now includes $game_concept_modifier$ actions related to [ShowModifier('timmy_wants_to_play')] and [ShowModifier('byz_born_in_the_purple_modifier')]. #low In fact, I had already hidden [ShowModifier('timmy_wants_to_play')] as an easter egg in the lower-right hidden menu of the $SAKUYA_MENU_TAB_CHARACTER$ page when the game first launched, but later found that almost nobody noticed it...#! Similar to changing a $game_concept_country$'s $game_concept_culture$ and $game_concept_religion$, $game_concept_character$ can now also use custom $game_concept_culture$ and $game_concept_religion$. $SAKUYA_CHAR_BUTTON_28$ is still not very stable, so I personally recommend avoiding it when possible. Oh, and Xier has greatly optimized the activation logic of the $SAKUYA_MENU_TAB_CHARACTER$ menu to reduce stutters. The tradeoff is that if you frequently switch the marked $game_concept_character$, you may need to close and reopen $CHEAT_MENU_TITLE$ or switch to another page and return to the $SAKUYA_MENU_TAB_CHARACTER$ menu to refresh the state.\N\N#p $SAKUYA_LOC_TITLE$ Update#!\NAt long last! Xier spent a long time studying how to edit $game_concept_building$ and had been stuck for quite a while. After finishing the Victoria 3 version of $CHEAT_MENU_TITLE$, that previous experience finally helped solve this underlying problem. For the GUI layout, I drew on mature experience from the previous project and added pseudo-sliders, dynamic data containers, and other controls to create a smoother interaction flow. Now you can add $game_concept_building$ to any $game_concept_location$ under your rule. There are many kinds of $game_concept_building$, so Xier has roughly grouped them by $game_concept_building$ type for easier browsing. You can add any number of $game_concept_building$ with one click, and you can also clear $game_concept_building$ whenever needed. However, one-click clearing for $estate_category$ still has some technical difficulties and will need more time. In addition, $SAKUYA_1_6_LOC_POPGEN_TITLE$ and $SAKUYA_1_6_LOC_POPEDIT_TITLE$ are also included in this version. $SAKUYA_1_6_LOC_POPGEN_TITLE$ lets you choose $SAKUYA_1_6_LOC_POPGEN_AMOUNT$, $SAKUYA_1_6_LOC_POPGEN_CLASS$, $game_concept_culture$, and $game_concept_religion$, then generate new $game_concept_population$ in marked $game_concept_location$s. $SAKUYA_1_6_LOC_POPEDIT_TITLE$ is used to process existing $game_concept_population$ in batches. You can choose all $game_concept_population$ or a specific $game_concept_pop_type$, then apply $SAKUYA_1_6_LOC_POPEDIT_ASSIM_PANEL$ and $SAKUYA_1_6_LOC_POPEDIT_CONV_PANEL$ by ratio to marked $game_concept_location$s or the entire country. This part also supports your country, the target $game_concept_country$, and the marked $game_concept_culture$ and $game_concept_religion$, making it easier to guide both new and existing $game_concept_population$ in the direction you want.\N\N#p Other#!\NThe background system has also received new content, including background choices such as $SAKUYA_BTN9_SETTING_11$ and $SAKUYA_BTN9_SETTING_12$. The compatibility note on the About page has been rewritten and no longer uses the old warning about having to overwrite gui/message_log.gui; in version 1.6 and later, $CHEAT_MENU_TITLE$ no longer occupies any game system GUI file, so conflicts with other UI mods should be much rarer in theory. Since it now uses a shared registration entry, please make sure the required dependency is loaded correctly. In addition, the multilingual localization files for the new 1.6 systems have been organized to leave a clearer path for future translation and maintenance."
s $game_concept_culture$ and $game_concept_religion$, $game_concept_character$ can now also use custom $game_concept_culture$ and $game_concept_religion$. $SAKUYA_CHAR_BUTTON_28$ is still not very stable, so I personally recommend avoiding it when possible. Oh, and Xier has greatly optimized the activation logic of the $SAKUYA_MENU_TAB_CHARACTER$ menu to reduce stutters. The tradeoff is that if you frequently switch the marked $game_concept_character$, you may need to close and reopen $CHEAT_MENU_TITLE$ or switch to another page and return to the $SAKUYA_MENU_TAB_CHARACTER$ menu to refresh the state.\N\N#p $SAKUYA_LOC_TITLE$ Update#!\NAt long last! Xier spent a long time studying how to edit $game_concept_building$ and had been stuck for quite a while. After finishing the Victoria 3 version of $CHEAT_MENU_TITLE$, that previous experience finally helped solve this underlying problem. For the GUI layout, I drew on mature experience from the previous project and added pseudo-sliders, dynamic data containers, and other controls to create a smoother interaction flow. Now you can add $game_concept_building$ to any $game_concept_location$ under your rule. There are many kinds of $game_concept_building$, so Xier has roughly grouped them by $game_concept_building$ type for easier browsing. You can add any number of $game_concept_building$ with one click, and you can also clear $game_concept_building$ whenever needed. However, one-click clearing for $estate_category$ still has some technical difficulties and will need more time. In addition, $SAKUYA_1_6_LOC_POPGEN_TITLE$ and $SAKUYA_1_6_LOC_POPEDIT_TITLE$ are also included in this version. $SAKUYA_1_6_LOC_POPGEN_TITLE$ lets you choose $SAKUYA_1_6_LOC_POPGEN_AMOUNT$, $SAKUYA_1_6_LOC_POPGEN_CLASS$, $game_concept_culture$, and $game_concept_religion$, then generate new $game_concept_population$ in marked $game_concept_location$s. $SAKUYA_1_6_LOC_POPEDIT_TITLE$ is used to process existing $game_concept_population$ in batches. You can choose all $game_concept_population$ or a specific $game_concept_pop_type$, then apply $SAKUYA_1_6_LOC_POPEDIT_ASSIM_PANEL$ and $SAKUYA_1_6_LOC_POPEDIT_CONV_PANEL$ by ratio to marked $game_concept_location$s or the entire country. This part also supports your country, the target $game_concept_country$, and the marked $game_concept_culture$ and $game_concept_religion$, making it easier to guide both new and existing $game_concept_population$ in the direction you want.\N\N#p Other#!\NThe background system has also received new content, including background choices such as $SAKUYA_BTN9_SETTING_11$ and $SAKUYA_BTN9_SETTING_12$. The compatibility note on the About page has been rewritten and no longer uses the old warning about having to overwrite gui/message_log.gui; in version 1.6 and later, $CHEAT_MENU_TITLE$ no longer occupies any game system GUI file, so conflicts with other UI mods should be much rarer in theory. Since it now uses a shared registration entry, please make sure the required dependency is loaded correctly. In addition, the multilingual localization files for the new 1.6 systems have been organized to leave a clearer path for future translation and maintenance."
