#Button
 SAKUYA_OPEN_TT: "#p Welcome!#!\nClick here to open the Cheat Menu Pro main interface."


 # Public text
 CHEAT_MENU_TEST_TEXT_1: "#p Welcome!#!\nNice to meet you. I'm Xier, the developer of Victoria 3 Cheat Menu Pro. It's my pleasure to meet you again in Europa Universalis. #n QQ Group:#! 734267077, come and play!\n\n#p Test Feature: $SAKUYA_LOC_TITLE$ has been released!#!\nClick the button below to open the new menu. Simply mark locations and provinces to modify populations, modifiers, and more! Remember#n you must select at least one location to modify#!, or simply modify the entire country.\n\n#p $CHEAT_MENU_TITLE$ has been updated to version 1.3!#!\nThis time I've brought you updates related to military aspects. Over fifty adjustable features have been added, and several bugs have been fixed. Click the button in the upper right corner of the military page to enable cheat-level modifiers. You can check the specific values by opening the #l $GOV_TAB$#! panel.#!"
 CHEAT_MENU_TEST_TEXT_2: "#p What do you think of this mod?#!\nI've been developing continuously for 12 hours. Compared to Victoria 3, Europa Universalis V's engine seems similar to previous titles, but it's actually quite different. I don't know how you all evaluate Europa Universalis V, but personally I think there might be too many mechanics? But if you're having fun, I'm satisfied. Meeting you is truly a happy thing.\nBy the way, players interested in game mechanics might notice that this mod is driven by console commands. I personally don't like using the console because it causes many compatibility issues. But after much research I couldn't solve it... so for now this is just a temporary measure. Anyway, hope you all have fun!"

