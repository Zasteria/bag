SAKUYA_LOC_1_CHEAT_MENU_PRO_AFTERBURNDER: "Marking countries and locations too troublesome? Foreign characters hard to mark?\N#T Try the expansion MOD#! #COLOR:{1,0.8,0.5,1} $SAKUYA_AFTERBURNER$#! #T !#!\N\NWith just a gentle right-click, countries, regions, and characters can be marked as you wish, ignoring all restrictions! Say goodbye completely to annoying diplomatic actions, tedious province systems, and the Russian nesting doll-like complicated foreign character marking mechanics! Get it done in one step and enjoy peace of mind and comfort! Search for #p $SAKUYA_AFTERBURNER$#! in the Steam Workshop to subscribe and download!\N\N#n Note: This MOD will affect compatibility with other MODs.#!"

