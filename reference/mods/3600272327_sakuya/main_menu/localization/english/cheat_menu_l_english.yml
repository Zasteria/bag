SAKUYA_CHAR_TT_25: "#T $SAKUYA_CHAR_BUTTON_25$#!\N$SAKUYA_LC$Make your selected character $game_concept_lowborn$.\n$SAKUYA_SL$Make the marked country's ruler join the marked character's $game_concept_dynasty$.\n$SAKUYA_SR$Make the marked character join the marked country's ruler's $game_concept_dynasty$.\n$SAKUYA_AL$Make the marked country's consort join the marked character's $game_concept_dynasty$.\n$SAKUYA_AR$Make the marked character join the marked country's consort's $game_concept_dynasty$.\n$SAKUYA_CL$Make the marked country's heir join the marked character's $game_concept_dynasty$.\n$SAKUYA_CR$Make the marked character join the marked country's heir's $game_concept_dynasty$."
