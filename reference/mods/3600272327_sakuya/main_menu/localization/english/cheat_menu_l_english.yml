 # SAKUYA_KAWASHIRO Group
CHEAT_MENU_SAKUYA_KAWASHIRO_TITLE: "#t A piece of news?#!"
CHEAT_MENU_SAKUYA_KAWASHIRO_NEWS_TITLE: "#t Sakuya's great victory in Gensokyo  Foreign troops routed#!"
CHEAT_MENU_SAKUYA_KAWASHIRO_NEWS_CONTENT: "When the cherry blossoms fell last year, after Nitori Kawashiro researched the time machine, the Great Hakurei Barrier of Gensokyo began to suffer frequent interference from the outside world, bringing unprecedented challenges to Gensokyo's stability. At that time, Toyosatomimi no Miko warned Nitori Kawashiro that rashly traveling to Japan several hundred years ago might cause temporal chaos, which could crack Gensokyo's barrier. Reimu Hakurei, the head of the Hakurei Shrine, also expressed similar concerns: \"A few days ago I observed a large number of spirits drifting across Gensokyo's sky, and I couldn't cleanse them no matter how hard I tried. Yukari Yakumo warned me in distress that I must be extra careful recently.\"\nJust yesterday, Gensokyo faced a massive invasion. Unlike the outsiders who had been infiltrating over the past few months, this group was a band of samurai led by a self-proclaimed daimyo of Sagami Province, breaking through the Great Hakurei Barrier and traveling along the Spring Path across Misty Lake. After wounding several fairies, they attempted to plunder the Scarlet Devil Mansion. According to Remilia Scarlet, the mansion's owner, the leading daimyo captured Hong Meiling, the security guard, and ransacked the building, stealing a large amount of treasures. Sakuya Izayoi, the maid of the Scarlet Devil Mansion, led volunteer forces from Gensokyo in a fierce battle against the invading soldiers in a clearing of the Forest of Magic, ultimately achieving a hard-won victory. Nearly half of the enemy soldiers were killed, and the rest escaped through the Great Hakurei Barrier.\n\"This conflict is the largest scale clash Gensokyo has ever experienced since its establishment,\" said Sage Okina Matara. \"Perhaps Nitori Kawashiro's time machine has indeed brought unprecedented disaster to Gensokyo.\" When asked if there was a countermeasure, Okina Matara did not give a direct answer. Currently, there is still no sign of Nitori Kawashiro at Genbu Ravine. \"I dare assert that she has traveled to the Japanese archipelago during the Kamakura period this time. And unfortunately, her location is very close to Gensokyo,\" said maid Sakuya Izayoi.\n\nDo the gods still cherish Gensokyo? ■Aya Shameimaru\n\nAdvertisement: Troubled by such worries... yokai extermination, treasure hunting, romance fulfillment, offspring prosperity? Come to the Kirisame Magic Shop, peace of mind and trust! #low Please be careful traveling to the Forest of Magic#!\nAdvertisement: We dedicate the finest sleep to you... Sweet Sleep Pillow!"
