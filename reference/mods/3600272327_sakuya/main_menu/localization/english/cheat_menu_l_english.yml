 # ========== 1.5 Version Update Log ==========
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_title: "#t $CHEAT_MENU_TITLE$ v1.5 Update Notes#!"
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_text: "#n Happy New Year 2026!#! Xier wishes everyone a smooth and prosperous new year. Now, allow me to introduce the content of this update. This update aims to complete the transition from simply satisfying functional needs to achieving an ultimate experience, lasting stability, and sustainable scalability. The core of this update is to upgrade from 'usable' to 'excellent'. The old version of $CHEAT_MENU_TAB_MAIN$ had limitations in scalability and was not friendly to non-Chinese/English environments, so $CHEAT_MENU_TAB_MAIN$ has been completely reworked in version 1.5. The new classification logic is clearer, the structure is more extensible, and localization adaptation is more complete. You will clearly feel that while the functions remain, the operation path is more intuitive, and you won't get lost easily.\N\N#p Related to $SAKUYA_TEST_BTN_6$ and $CHEAT_MENU_MARK_LEADER$#!\NNow you can directly $CHEAT_MENU_SWITCH_COUNTRY$ to the marked country, instantly switching player control to the target. $CHEAT_MENU_MARK_LEADER$ is no longer limited to marking domestic characters; you can directly target and mark key figures in other countries, including leaders, regents, heirs, and consorts. It is also emphasized that some functions require the combination of $offer_sakuya_mark_country_cta_to_unknown$ + $CHEAT_MENU_MARK_LEADER$. You can now control the country's behavior at the war level more freely; you can manipulate the target country's wars or have the target country join your war as an opponent/ally. Additionally, $SAKUYA_BANKRUPTCY_BUTTON$ related operations have been added. To simplify diplomacy, new shortcut functions allow you to batch improve relations with neighbors, same-religion countries, or even all Holy Roman Empire members. The method of lifting $CHEAT_MENU_BUTTON_CONSOLE_2$ has also been optimized, now supporting lighting up the map by region, such as only lifting the fog of war in East Asia or Europe.\NNow you can freely rewrite the blood relationship between $SAKUYA_MENU_TAB_CHARACTER$ and the player ruler, such as setting them as your $SAKUYA_CHAR_BUTTON_19$. The newly added $SAKUYA_CHAR_BUTTON_21$ function allows you to establish $SAKUYA_MENU_TAB_CHARACTER$ as the legal heir of your country or the target country, thereby forcibly intervening in the transfer of power. In addition, the $SAKUYA_CHAR_BUTTON_22$ function is more flexible, supporting the direct installation of the marked $SAKUYA_MENU_TAB_CHARACTER$ as the ruler of your country, or pushing them onto the throne of the marked country.\N\N#p Related to $SAKUYA_LOC_TITLE$#!\N$CHEAT_MENU_TITLE$ has greatly enriched the fine-tuning capabilities for $game_concept_location$ and $game_concept_province$. Now you can use Ctrl and Shift combinations to fine-tune or significantly adjust $SAKUYA_LOC_MOD_DEVELOPMENT$ and $SAKUYA_LOC_MOD_PROSPERITY$. All 52 types of $SAKUYA_LOC_PRODUCT_TOGGLE$ in the game, from basic coal, iron, grain, and cotton to expensive silk and gold, can now be converted with one click. In addition, direct modification functions for $city$, $town$, and $rural_settlement$ ranks, as well as rapid intervention means for food reserves, have been added. The $SAKUYA_LOC_INSTITUTION_TOGGLE$ system is currently not ideal, but it is temporarily online.\N\N#p Related to $CHEAT_MENU_CATEGORY_ADMIN$, $TAB_TOOLTIP_SOCIETY_TITLE$, and $SUBTAB_GOVERNMENT_VALUES$#!\NNow you can modify $ENCYCLOPEDIA_PAGE_COUNTRY_RANKS$. For $game_concept_estates$, you now only need to select the corresponding $game_concept_estates$ to change satisfaction, $SAKUYA_ESTATE_POWER_BTN$, $SAKUYA_ESTATE_TAX_BTN$, rebellion, and gold. If you choose the Crown $game_concept_estates$, you can additionally modify the number of reform slots. For $AUTOMATED_SYSTEM_CABINET$ and $game_concept_parliament$, $CHEAT_MENU_TITLE$ provides a large number of modification options, including adjusting $CHEAT_MENU_BUTTON_CABINET_EFFICIENCY$, reducing $SAKUYA_BUTTON_CABINET_COSTS$, modifying $SAKUYA_BUTTON_PARLIAMENT_DURATION$, and reallocating national focus via $SAKUYA_BUTTON_CABINET_ACTIONS$. We have provided exclusive custom functions for Catholic, Orthodox, Islamic, and Eastern religions. You can try to request a $request_cardinal_seat$, adjust $POLICY_BIAS_REFORM_DESIRE$, call an $orthodox_synod$, or adjust the tendency of $mysticism_vs_jurisprudence$, and even directly modify $karma$ and $harmony$. Now $SUBTAB_GOVERNMENT_VALUES$ can be directly modified. Individual $SUBTAB_GOVERNMENT_VALUES$ such as Sinicization vs De-Sinicization are not yet online."
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_text: "#p $CHEAT_MENU_TITLE$ v1.5.4 Patch Notes#!\nHello everyone. After four months of maintenance and refurbishment by Paradox, the game has finally received its first iterative version, and Xier brings you a brand-new cumulative update.\nThis update adds support for $complacency$; you can find the related adjustments by scrolling down in the common functions menu. At the same time, based on community feedback, when you try to add slave population to territory, slave culture will now change to Sakuya's own culture rather than the player's national culture.\nIn the $SAKUYA_TEST_BTN_8$ section, Xier added 3 quick options so you can perform fast edits without marking provinces. You can now rename $game_concept_dynasty$ again. However, because the game has no reserved built-in interface for this, renaming can only be implemented by creating a new $game_concept_dynasty$, and there may still be a small number of unstable bugs, so please use with caution. In addition, according to your feedback messages, Xier fixed more than ten errors and optimized parts of the interface, hoping you will enjoy this version.\NTo solve the cumbersome steps when marking countries, regions, and foreign characters, Xier now releases the expansion MOD #COLOR:{1,0.8,0.5,1} $SAKUYA_AFTERBURNER$#!. After subscribing, you will no longer be limited by vanilla diplomatic distance and complicated system restrictions. With a simple right click, you can ignore most conventional limits and complete target marking in one step. Please note that this MOD can break compatibility with other MODs that modify UI, so it is published as an independent MOD requiring separate subscription and is not directly integrated into $CHEAT_MENU_TITLE$.\n\n#p $CHEAT_MENU_TITLE$ v1.5.3 Patch Notes#!\nBefore we knew it, it's already February. $CHEAT_MENU_TITLE$ has now been updated to version 1.5.3. In this update, Xier brings you a powerful function to modify cultural opinion. You can now precisely adjust relations between different cultures, whether between the marked country or between your own mainstream and accepted cultures. For character interaction, new origin and clan adjustments were added, allowing you to set a character as commoner or add them into the ruling clan. Character migration is also supported now: marked characters (except rulers) can be transferred to your country or another country. The long-awaited character rename feature is also online; you can freely change names and nicknames. A new Shift+Left Click batch annex subject feature was added to save time and effort.\nIn terms of fixes and optimization, Xier repaired military menu button logic, 7 estate configuration errors, and main menu GUI display issues. Legacy commands and functions ported from Victoria 3 were also cleaned up, and the issue where right-click failed for estate money operations has been resolved. On the UI side, button spacing and text styles were adjusted, the button for marking foreign characters is now more eye-catching, and character-related descriptions plus localization fine-tuning were added.\nMeeting you is truly a wonderful thing. Let's meet again in the next version. Xier offers you early New Year wishes in advance, and wishes you swift success!\n\n#p $CHEAT_MENU_TITLE$ v1.5.2 Patch Notes#!\nHow do you all feel about the brand-new version of $CHEAT_MENU_TITLE$? Today Xier brings you a new update. According to community feedback, in Home - Society tab, some religions seemed to cause GUI layout disorder. Xier adjusted the implementation and it should now work properly. This time Xier also brings a brand-new function: modify country names. Now you only need to mark any country to change its name. You can also choose to modify your own country's name. In addition, some buttons and layouts in the diplomacy interface have been adjusted, and new prompts related to marking countries were added.\n\n#p $CHEAT_MENU_TITLE$ v1.5.1 Version Update#!\nHello everyone. This time Xier brings you the first update of $CHEAT_MENU_TITLE$ v1.5. In this update, Xier fixed the issue of incorrect pregnancy target. At the same time, missing English localization keys on some interfaces were fixed. Also based on community feedback, disease immunity related functions that were removed before have been added back in this update. In addition, from now on you can modify the faith and culture of selected characters, changing them to the same culture and religion as your country or the target country."
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_title: "#T $CHEAT_MENU_TITLE$ v1.5 Cumulative Update Notes#!"
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.4_title: "#t $CHEAT_MENU_TITLE$ v1.4 Update Notes#!"
 SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.4_text: "Hello everyone, this is Xier. This update focuses on launching the brand new $SAKUYA_LOC_TITLE$ system. This is a powerful tool designed to let you manage territory precisely or in batches.\N\N#p $SAKUYA_LOC_TITLE$ System Online#!\NNow you can choose different marking modes to manage your territory. If you wish to perform fine operations on specific locations, you can use $SAKUYA_LOC_LOCATION_MODE_BUTTON$; if you have a vast territory (e.g., owning more than 50 provinces), to avoid lag, it is strongly recommended to use $SAKUYA_LOC_PROVINCE_MODE_BUTTON$. After marking is complete, you can use the shortcut buttons in $SAKUYA_LOC_TAB_HOME$ to execute $SAKUYA_LOC_HOME_BUTTON_1$, $SAKUYA_LOC_HOME_BUTTON_2$, maximize $SAKUYA_LOC_HOME_BUTTON_3$, or adjust $SAKUYA_LOC_HOME_BUTTON_4$ for all marked areas with one click. In addition, $SAKUYA_BETA_MARK_ALL_BUTTON$ and $SAKUYA_BETA_UNMARK_ALL_BUTTON$ functions have been added to facilitate your quick takeover of the entire country.\N\N#p $SAKUYA_LOC_TAB_POP$ and $SAKUYA_LOC_TAB_MOD$#!\nOn the $SAKUYA_LOC_TAB_POP$ page, you can batch add specific classes of population to marked areas, whether it is $SAKUYA_LOC_POP_LABORERS$, $SAKUYA_LOC_POP_NOBLES$, or $SAKUYA_LOC_POP_SOLDIERS$, just click to generate. On the $SAKUYA_LOC_TAB_MOD$ page, Xier has prepared massive modifier options in three categories for you, covering dozens of value adjustments from $SAKUYA_LOC_MOD_POP_GROWTH$, $SAKUYA_LOC_MOD_DEVELOPMENT$ to $SAKUYA_LOC_MOD_DEFENSIVENESS$ and $SAKUYA_LOC_MOD_SUPPLY_LIMIT$. You can even directly modify $SAKUYA_LOC_MOD_FORT_LEVEL$ or $SAKUYA_LOC_MOD_MAX_ATTRITION$ to build impregnable fortresses."
 SAKUYA_TEST_BTN_9_TAB_2_TEXT_1: "#T #COLOR:{0.639,0.581,0.492,1} Background Settings#!#!"
 SAKUYA_TEST_BTN_9_TAB_3_TEXT_1: "#T #COLOR:{0.639,0.581,0.492,1} About#!"
 SAKUYA_TEST_BTN_9_TAB_3_TEXT_3: "#T Donation#!"
 SAKUYA_TEST_BTN_9_TAB_3_TEXT_3_TT: "Thanks boss! QvQ"
 SAKUYA_CHEAT_MENU_ABOUT_TEXT: "#P Thank you for using $CHEAT_MENU_TITLE$!#!\NIt's a pleasure to meet you. I am Xier, a developer from Beijing, currently living in the Czech Republic. If you have any questions, please scan the code with your phone to join the QQ group or Discord group to contact me. If you want to support Xier, you can give Xier a points award in the Steam Workshop, or scan the $SAKUYA_TEST_BTN_9_TAB_3_TEXT_3$ link above to donate~\nThis MOD is completely free. If you obtained this MOD through any paid channel, please report it immediately. Xier would be very grateful!"
