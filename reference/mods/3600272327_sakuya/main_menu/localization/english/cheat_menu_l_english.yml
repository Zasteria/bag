 CHEAT_MENU_OPINION_ICON_TOOLTIP: "[GetPlayer.Custom('sakuya_mark_country_status')]\n\n #!\n #p How do I mark a country?#!#N \nFirst, click the target country to open its diplomacy panel. Then, in the $DIP_TAB$ panel, select: $TAB_TOOLTIP_ARMY_ACTIONS_TITLE$ → $CUSTOM_SEARCH_FILTER_DIPLO_ACCESS_CAT_NAME$, find #L $offer_sakuya_mark_country$#! and click it to apply the mark.\n\n#T What the mark really is#!: Marking a country creates a special diplomatic relation with the target (used for behavior binding and variable assignment). Therefore, if you do not have enough $game_concept_diplomat$s, or the target is outside your $game_concept_diplomatic_range$, you must satisfy these requirements before you can mark it.#!\n\n#p How do I unmark it?#!#N \nThe mark effect lasts for 3 months and will automatically expire when the time is up; however, the special diplomatic relation will remain. Whether you remove that relation or not is entirely up to you.\n\nIf you want to end the mark effect early: simply cancel the #l $offer_sakuya_mark_country$#! diplomatic relation with that country. The mark will end immediately, and you can mark other countries at any time afterwards.#!\n\n#p I can't find where to unmark it.#!#N \nThis is not your fault. Due to engine limitations, the diplomacy action list does not refresh instantly, so you need to exit the diplomacy menu and enter it again.\n\nAfter reopening it, you should see #l $offer_sakuya_mark_country$#! change into #l $cancel_sakuya_mark_country$#!. Then you can click to cancel it. The same issue can also happen when marking characters.#!\n\n#T Important#!: The mark itself has no direct relation to the diplomatic action; it is only a behavior binding for assigning variables. Whether you cancel it or not, the mark effect always lasts 3 months—this is intentionally designed to avoid various errors.#!\n#low That diplomatic relation has no effect at all and will not be removed automatically. Xier also recommends that you simply ignore it; if you need to mark this country again in the future, you can cancel it then—it won’t be too late.#!"
