SAKUYA_CHAR_TT_10: "#t $game_concept_fertility$ and Pregnancy#!\n#p Left Click:#! Increase 50% $game_concept_fertility$\n#p Shift+Left Click:#! Increase 500000% $game_concept_fertility$\n#n Right Click:#! Reduce 50% $game_concept_fertility$\n#n Shift+Right Click:#! Reduce 500000% $game_concept_fertility$\n#l Ctrl+Left Click:#! Clear $game_concept_fertility$ modifiers\n#t Ctrl+Right Click:#! #COLOR:{1,0.4,0} Try to make selected character pregnant#!\n#low I haven't found a GUI that shows whether a character is pregnant, so I can't determine if a character is pregnant. If the target character is an unmarried female yet still becomes pregnant, never be curious about how it's implemented at the code level.#!\nAnd never, ever make male characters pregnant, especially making yourself pregnant with yourself (while still male)! According to submitted reports, self-pregnancy causes [GetPlayer.GetGovernment.GetRuler.GetName]#x to carry a demonic child#!, and your save will suffer #COLOR:{1,0,0,1} irreversible corruption#! that manifests as every $SAKUYA_MENU_TAB_CHARACTER$ in the world being unable to become pregnant or bring a pregnancy to term.#!"
