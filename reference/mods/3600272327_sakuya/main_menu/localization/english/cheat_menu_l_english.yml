SAKUYA_CHANGE_CHAR_SET_NICKNAME: "Change Nickname"
SAKUYA_CHANGE_CHAR_NAME_NICKNAME_TT: "Children theoretically cannot have nicknames.\nIf the current character doesn't have a nickname, Sakuya will create one for them.\nIf you want to remove a nickname, simply leave the input field blank and click this button. But#n never set the name to an empty string!#!"
SAKUYA_CHAR_KOISHI_TT: "#t How do I mark a character?#!\n\n#p If the target character is in your country (e.g., [GetPlayer.GetNameWithNoTooltip])...#!\nSimply click the character to open their interface, or right-click their portrait and select #l $sakuya_select_chosen_one$#!. To deselect, re-enter the character interface to refresh and click #l $sakuya_deselect_chosen_one$#!.\nYou can also use #l $SAKUYA_AFTERBURNER$#! to mark characters both domestic and foreign more conveniently. $SAKUYA_AFTERBURNER$ is available on the Steam Workshop or Discord channel.\n\n#p If the target character is not in [GetPlayer.GetNameWithNoTooltip]?#!\nYou need to#white first mark#! the#x nation#! where the character is located, then use #T $CHEAT_MENU_MARK_LEADER$#! in the $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$ menu. Currently supports marking ruler, consort, heir, or regent. When the icon disappears, it means the marking was successful.\n\n#p Can't find the $sakuya_select_chosen_one$ option?#!\nIn some special cases (e.g., $SWE$), your own ruler may not be in your country at the start. In this case, first confirm the character's current location and mark the nation where they are located.\n\n#p How do I deselect?#!\nJust mark any character in your country and click #l $sakuya_deselect_chosen_one$#!. This method works whether the target character is abroad or has already died.\n\n#t $game_concept_trait$ Explanation#!\n\n#p Some $game_concept_trait$s require specific conditions to be added.#! For example, #n $babbling_buffoon$#! requires $game_concept_dip$ to be below 80. The specific requirements for each $game_concept_trait$ can be found on the EU5 Wiki."

