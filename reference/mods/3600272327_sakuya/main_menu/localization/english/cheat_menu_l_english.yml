SAKUYA_DIPLOMACY_REPORT_TEXT: "Dear [GetPlayer.GetGovernment.GetRuler.GetName], greetings! [Player.GetCapital.GetName] is so beautiful. I am Sakuya, please allow me to report on your diplomatic situation. You currently have [GetPlayer.GetDiplomacy.GetNumOfDiplomats] diplomats. Monthly diplomat growth is [GetPlayer.GetModifierValueNoFormat('monthly_diplomats')]. We are currently using $dip_AGE$: [GetPlayer.GetDiplomacy.GetUsedDiplomaticCapacity|2] / [GetPlayer.GetDiplomacy.GetMaxCapacity|2]. Your $DIPLOREASON_DIPLOMATIC_REPUTATION$ is [GetPlayer.GetModifierValueNoFormat('diplomatic_reputation')]."

