sakuya_maid_fairy: "Scarlet Devil Mansion Maid Fairy"
sakuya_maid_fairy_desc: "Fairy maids from the Scarlet Devil Mansion in Gensokyo, who work lazily under the command of Sakuya Izayoi. Although they often make mistakes, they always maintain an optimistic attitude."
sakuya_gensokyo_group: "Gensokyo"
sakuya_gensokyo_language: "Edo Period Japanese"
sakuya_gensokyo_group_desc: "A hidden world of humans and yokai, concealed behind the Hakurei Great Barrier. Those outside want to get in, and those inside want to get out. Ah, the people of the earth and the Gensokyo on the other side of the barrier... If only one could catch a glimpse of that fantasy world at the bridgehead of the Sanzu River. This is a paradise loved by the gods, and also a battlefield where evil spirits bare their fangs."
sakuya_gensokyo_language_desc: "Ever since the people of the barrier and the sages established Gensokyo, the language of the Human Village has been frozen in the Edo period. Although Japanese from the outside world can be used for communication, the villagers and yokai are often surprised by the strange pronunciation and inexplicable loanwords of the outside Japanese, and only a few capable characters can understand the vocabulary of the outside world through various means."
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_title: "#T $CHEAT_MENU_TITLE$ v1.5 Cumulative Update Notes#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_text: "#p $CHEAT_MENU_TITLE$ v1.5.4 Update Notes#!\nHello everyone. After four months of maintenance and repairs by Paradox, the game has finally ushered in its first iterative version, and Xier has also brought a brand new cumulative update for everyone.\nThis update adds support for $complacency$; you can scroll down in the common features menu to find the corresponding modification. At the same time, based on community feedback, when you now attempt to add slave pops to a territory, the culture of the slaves will change to Sakuya's own culture, rather than the culture of the player's country.\nIn the $SAKUYA_TEST_BTN_8$ section, Xier has added 3 new shortcut options for you, enabling quick modifications without needing to mark provinces. Now, you can rename the $game_concept_dynasty$. However, because the game lacks a built-in reserved interface, renaming can only be achieved by creating a new $game_concept_dynasty$, and there are suspected to be a few unstable bugs, so please use it with caution. In addition, based on your comments and feedback, Xier has fixed more than a dozen errors and optimized some interfaces, hoping you will all enjoy this version.\NTo solve the tedious steps when marking countries, regions, and foreign characters, Xier is now launching the expansion MOD #COLOR:{1,0.8,0.5,1} $SAKUYA_AFTERBURNER$#!. Upon subscribing, you will no longer be limited by the vanilla game's complex diplomatic distances and tedious system settings. With a simple right-click, you can ignore most conventional restrictions and complete your target marking in one step. Please note, however, that this MOD will break compatibility with other MODs that modify the UI, so it will serve as an independent MOD requiring an additional subscription, and is not directly integrated into $CHEAT_MENU_TITLE$.\n\n#p $CHEAT_MENU_TITLE$ v1.5.3 Update Notes#!\nIn the blink of an eye, it's already February. $CHEAT_MENU_TITLE$ has now been updated to version 1.5.3. In this update, Xier brings you a powerful feature to modify cultural relations; you can now precisely adjust relations between different cultures, whether it's within a marked country or between your own country's primary and accepted cultures. For character interactions, origin and dynasty adjustments have been added, allowing you to set a character as a commoner or have them join the ruler's dynasty; it also supports a character migration function, transferring a marked character (excluding rulers) to you or another country. The character renaming you've been anticipating is also live, allowing you to modify names and nicknames at will. A new Shift + Left Click feature to batch annex subjects has been added, saving you time and effort.\nIn terms of fixes and optimizations, Xier has repaired the military menu button logic, 7 estate configuration errors, and main menu GUI display issues. Obsolete commands and functions ported from Victoria 3 have been cleaned up, and the right-click failure issue for estate money operations has been resolved. On the interface, button spacing and text styles have been adjusted, the button for marking foreign characters is now more prominent, and character-related tooltips and localization tweaks have been supplemented.\nIt's truly a blessing to meet you, let's meet again in the next version. Xier wishes you a happy early New Year and immediate success!\n\n#p $CHEAT_MENU_TITLE$ v1.5.2 Update Notes#!\nI wonder how everyone feels about the brand new version of $CHEAT_MENU_TITLE$? Today, Xier brings you a new update. According to community feedback, some religions on the Home - Society tab were suspected to cause GUI layout errors. Xier has adjusted the coding, and it should work properly now. In this update, Xier brings you a brand new feature: Modify Country Name. Now, you only need to mark any country to change its name. You can also choose to change the name of your own country. Additionally, individual buttons and the layout of the diplomacy interface have been adjusted, and tooltips related to marking countries have been added.\n\n#p $CHEAT_MENU_TITLE$ v1.5.1 Update Notes#!\nHello everyone. Xier brings you the first update of $CHEAT_MENU_TITLE$ version 1.5. In this update, Xier fixed the issue of incorrect pregnancy targets. We also corrected the issue of missing localization keys for English in some interfaces. Furthermore, in response to community feedback, this update brings back the original disease immunity-related functions. Additionally, from now on, you can modify the faith and culture of the selected character to match the culture and faith of your country or the target country."
