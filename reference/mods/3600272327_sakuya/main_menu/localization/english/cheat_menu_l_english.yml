 # Console Tab
 SAKUYA_CHEAT_MENU_CONSOLE_TITLE: "#t Console Commands#!"
 SAKUYA_CONSOLE_REPORT_TEXT: "Quickly access common console commands here.\N\N#low Note: Using console commands may affect game balance. It is recommended to use them during testing or for fun.#!`"
 CHEAT_MENU_CONSOLE_1: "I picked up my backpack, the moment I left home, I knew real life has too many special things. If you see me, don't be too indifferent. I am sentimental, but also enthusiastic and free-spirited."
 CHEAT_MENU_COMMAND_STUDIES_TEXT_1: "#p Welcome to the Console Menu!#!\n Here, I will teach you some tips for using the console. As you can see, the power and charm of the console are far more than just for cheating. Next, I will teach you some small tips for using the console. \N\N#l How to annex provinces? #!\NIt's actually quite difficult to annex specific plots and provinces in a MOD. First, you need to mark the province the player wants to annex, but how to make the MOD know which province the player wants to annex? Very, very difficult. But the good news is, you can use the following command:\N #P conquer#! .  \N For example, if I want to annex $constantinople$, how to do it? After enabling debug mode, move the mouse to $constantinople$, then record the #I Location Tag#!, and finally enter in the console: #P conquer#!  #L constantinople#!.  \N Do not enter the #I Location ID#!. It might work in EU4, but not in EU5. " \NSo how do we annex an entire country? Just use the #p annex#! command. For example, if I want to annex $BOH$, I just need to move the mouse over the country I want to annex, find the Tag for $BOH$, and then enter in the console:\N #P annex#! #I BOH#!. To quickly $colonize$ land, we need to use #p colonize_and_finish#! or #p colonize#!. Unlike EU4, EU5 can only colonize undeveloped provinces. \N\NVery good, you have probably learned how to use the console to modify the data of specified provinces. You can try using the following commands to do something!\N #I add_core (#n Location ID#!)#! Create Core \N #I tag (#n Tag#!)#! Switch Country \N #I population (#n Location ID#!)#! Increase Population . \N #I raid (#n Location ID#!)#! Raid.   \N#I create_pu (#n Tag#!)#! Force a country into a personal union with you. \N#I make_subject (#n Subject Type#!) (#n Tag#!)#! Force a country to become your subject. \N #I declarewar (#n Tag#!) (#n Tag#!)#! Immediately declare war on the specified country. If the second Tag is filled, you can watch the two specified countries inexplicably start fighting. \N#I braindeadai (#n Tag#!)#! Immediately stop the AI of the specified country  \n You can also explore other functions in the console."

