# Button 9: Dominion
CHEAT_MENU_UNION: "$dominion$"
CHEAT_MENU_UNION_TT: "#t $dominion$ relationship adjustment#!\n #p Left click:#! Target country becomes your $dominion$\n #n Right click:#! You become target country's $dominion$\n\n#low Actually, it simulates the final effect of joint rule after royal marriage, so you don't have to wait 50 years. Sakuya is so thoughtful XD"

# Button 10: Truce
CHEAT_MENU_TRUCE: "$game_concept_truce$"
CHEAT_MENU_TRUCE_TT: "#t $game_concept_truce$ adjustment#!\n #n Left click:#! Break $game_concept_truce$ (expires in 1 day)\n #p Right click:#! Add 5 years of $game_concept_truce$\n #l Ctrl+Left click:#! Break $game_concept_truce$ (expires in 1 day)\n #p Ctrl+Right click:#! Add 1 month of $game_concept_truce$\n #p Shift+Left click:#! Add 10 years of $game_concept_truce$\n #p Shift+Right click:#! Add 100 years of $game_concept_truce$\n\n#low Actually, if the target country wants to get you, there are plenty of ways to bypass the $game_concept_truce$ restrictions..."

# Button 11: Change Culture
CHEAT_MENU_CULTURE: "$game_concept_primary_culture$"
CHEAT_MENU_CULTURE_TT: "#t Change $game_concept_primary_culture$#!\n #p Left click:#! Target country's $game_concept_primary_culture$ becomes your $game_concept_primary_culture$\n #X Right click:#! Your $game_concept_primary_culture$ becomes target country's $game_concept_primary_culture$\n\n#X Warning:#! Operation is irreversible!"

# Button 12: Change Religion
CHEAT_MENU_RELIGION: "Change Religion"
CHEAT_MENU_RELIGION_TT: "#t Change national religion#!\n #p Left click:#! Target country's religion becomes your religion\n #X Right click:#! Your religion becomes target country's religion\n\n#X Warning:#! Operation is irreversible!"

# Button 13: Liturgical Language
CHEAT_MENU_COURT_LANGUAGE: "$game_concept_liturgical_language$"
CHEAT_MENU_COURT_LANGUAGE_TT: "#t $game_concept_liturgical_language$ adjustment#!\n #p Left click:#! Target country's $game_concept_liturgical_language$ becomes your language\n #l Right click:#! Your $game_concept_liturgical_language$ becomes target country's language\n\n#l Note:#! This won't change the common language (common language is bound to culture) #low After testing, this button has issues and may not work properly"

# Button 4: Form Nation
CHEAT_MENU_FORM_NATION: "Cosplay"
CHEAT_MENU_FORM_NATION_TT: "#t Cosplay as specified nation#!\n #p Left click:#! Cosplay as $ROM$ Empire\n #p Right click:#! Cosplay as $CTH$\n #p Ctrl+Left click:#! Cosplay as $HEN$\n #p Ctrl+Right click:#! Cosplay as $EUR$\n\n#X Important Warning:#!\n· This operation is #X irreversible#!, cannot be undone!\n· This #X only changes appearance#! (flag, name, color)\n· #X Does not change#! the actual in-game Tag. This means you're still playing your country, just dressed up in a strange appearance.\n· Player control #X will not#! switch\n\nIt's recommended to save the game first!"

# New row buttons: Trade, Advances, Population

# Button 1: Trade Transfer
CHEAT_MENU_TRADE_TRANSFER: "Trade"
CHEAT_MENU_TRADE_TRANSFER_TT: "#t Trade advantage and capacity transfer#!\n #p Left click:#! Target country transfers 30% trade to you\n #n Right click:#! You transfer 30% trade to target country\n #l Ctrl+Left click:#! Remove all trade transfer relationships\n\nEstablish diplomatic relations, transfer 30% merchant influence\nSimilar to the game's original \"transfer trade\" mechanism\n\nRequires marking target country first"

# Button 2: Advance Spread
CHEAT_MENU_ADVANCE_SPREAD: "Advances"
CHEAT_MENU_ADVANCE_SPREAD_TT: "#t Advance spread (10 years effective)#!\n #p Left click:#! You spread advances to target country\n #n Right click:#! Target country spreads advances to you\n #l Ctrl+Left click:#! Remove all advance spread relationships\n\nEstablish diplomatic relations, lasts 10 years\n0.2 advance progress per month (moderate rate)\nSimilar to overlord's advance spread mechanism to vassals\n\nRequires marking target country first"

# Button 3: Population Transfer
