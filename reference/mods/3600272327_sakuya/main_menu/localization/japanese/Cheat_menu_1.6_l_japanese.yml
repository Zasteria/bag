 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T 戦争スコアの効率#!\n\n領土の平和条項に関する戦争スコアの効率のみを調整し、低支配力の影響は反映されなくなりました。\n\n$SAKUYA_LC$ ：戦争ポイント効率 +10%、同量の戦争ポイントでより多くの領土を獲得可能\n$SAKUYA_RC$ ：戦争ポイントの効率が-10％となり、同等の戦争ポイントで獲得できる領土が減少します\n$SAKUYA_SL$ ：戦争スコア効率 +10000%\n$SAKUYA_SR$ ：戦争スコア効率 -99%\n$SAKUYA_CL$ ：このボタンで追加された新旧すべての戦争スコアの効率を削除 $game_concept_modifier$"
 SAKUYA_1_6_CHAR_TT_18: "#T 役に立たない小物いろいろ#!\n\n$SAKUYA_LC$ ：性別制限を無視し、$game_concept_army$ または $game_concept_navy$ の将軍となる\n$SAKUYA_SL$ ：性別制限を撤廃し、内閣入り\n$SAKUYA_RC$ ：幕府将軍になることを許可する\n$SAKUYA_SR$ ：要塞の指揮を許可する\n$SAKUYA_AL$ ：「紫の部屋で生まれた」を追加 $game_concept_modifier$\n$SAKUYA_AR$：「中央アジアの災厄」を追加 $game_concept_modifier$\n#l Ctrl+左クリック#!：このボタンで追加された$game_concept_modifier$の雑多な項目をすべて削除する\n#p Ctrlキーを押しながら右クリック#!：この $game_concept_character$ による $game_concept_character$ とのインタラクションを無効にする"
