 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Ustaw zaznaczony $game_concept_country$ jako nasz $game_concept_rival$ .\n $SAKUYA_RC$ Anuluj naszą relację $game_concept_rival$ z zaznaczonym $game_concept_country$ .\n $SAKUYA_SL$ Spraw, aby zaznaczone $game_concept_country$ ustawiło nas jako ich $game_concept_rival$ .\n $SAKUYA_SR$ Anuluj zaznaczoną relację $game_concept_rival$ $game_concept_country$ z nami.\n $SAKUYA_CL$ Oba kraje ustawiają się wzajemnie jako $game_concept_rival$ .\n $SAKUYA_CR$ Obydwa kraje anulują relację $game_concept_rival$.\n $SAKUYA_AL$ Ustawia zaznaczony $game_concept_country$ jako nasz historyczny $game_concept_rival$ .\n $SAKUYA_AR$ Anuluj naszą historyczną relację $game_concept_rival$ z zaznaczoną $game_concept_country$ ."
