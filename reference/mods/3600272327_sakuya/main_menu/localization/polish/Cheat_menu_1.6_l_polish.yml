 SAKUYA_1_6_TT_MILITARY_BOOST: "$SAKUYA_LC$ Zwiększaj szkolenie, morale $game_concept_army$ i $game_concept_navy$, taktykę wojskową, tradycję armii i marynarki wojennej oraz efektywność konserwacji armii i marynarki wojennej.\n $SAKUYA_SL$ Dodaj ostateczne wzmocnienie militarne „Śmierć 999”, w którym premie piechoty i kawalerii dotyczą zarówno lekkich, jak i ciężkich typów jednostek.\n $SAKUYA_RC$ Usuń wszystkie wzmocnienia militarne."
