 SAKUYA_RELEASE_NON_CORES_TT: "#T  $RELEASE_NON_CORES_EFFECT$ #! \n $SAKUYA_LC$ Ustaw zaznaczoną wersję $game_concept_country$ we wszystkich prowincjach innych niż podstawowe.\n #n  Alt+Kliknięcie lewym przyciskiem myszy #! Spraw, aby Twoje $game_concept_country$ zwolniło wszystkie prowincje inne niż podstawowe.\n \n #n  Ta akcja bezpośrednio zmienia terytorium $game_concept_country$ i nie można jej cofnąć za pomocą tego przycisku.#!"
