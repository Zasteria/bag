 SAKUYA_CHAR_TT_15: "#t Małżeństwo i rozwód #!\n$SAKUYA_LC$: Wymuszaj zawarcie małżeństwa między postacią $game_concept_character$ a naszym władcą $game_concept_ruler$, pomijając zwykłe ograniczenia dotyczące małżeństwa.\n$SAKUYA_SL$: Wymusza zawarcie małżeństwa między postacią $game_concept_character$ a obecnym $game_concept_heir$ w naszym kraju, pomijając standardowe ograniczenia dotyczące małżeństw.\n$SAKUYA_RC$: Niech postać $game_concept_character$ natychmiast rozwiedzie się ze swoim obecnym małżonkiem.\n$SAKUYA_SR$: Zakaz małżeństwa z postacią $game_concept_character$ (dodano modyfikator zakazu małżeństwa $game_concept_modifier$).\n#l Ctrl + lewy przycisk myszy #!: Usuń wszystkie ograniczenia dotyczące małżeństwa $game_concept_modifier$ dla postaci $game_concept_character$.\n#p Ctrl + prawy przycisk myszy #!: uniemożliwia postaci $game_concept_character$ zawarcie małżeństwa z osobą o niskim statusie szlacheckim (dodaje modyfikator $game_concept_modifier$ zakazujący małżeństw z osobami ze stanu pospólstwa).\n\n#low To moja matka, a także moja żona, siostra i córka. #!"
