 SAKUYA_LIFT_FOG_TT: "#T $game_concept_fog_of_war$#!\n$SAKUYA_LC$Supprime le $game_concept_fog_of_war$ du territoire du $game_concept_country$ marqué.\n$SAKUYA_RC$Supprime le $game_concept_fog_of_war$ de notre territoire.\n$SAKUYA_AL$Les deux pays suppriment le $game_concept_fog_of_war$ de leur territoire respectif."
