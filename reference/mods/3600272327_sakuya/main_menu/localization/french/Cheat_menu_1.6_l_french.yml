 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T Efficacité en termes de points de guerre #!\n\nOn ajuste uniquement l'efficacité des points de guerre liés aux clauses de paix territoriales, sans plus tenir compte de l'influence d'un faible niveau de contrôle.\n\n$SAKUYA_LC$ : Efficacité des points de guerre +10 % ; vous obtenez plus de territoires pour un même nombre de points de guerre\n$SAKUYA_RC$ : Efficacité des points de guerre -10 % ; un nombre équivalent de points de guerre permet d'obtenir moins de territoires\n$SAKUYA_SL$ : Efficacité des points de guerre +10 000 %\n$SAKUYA_SR$ : Efficacité du score de guerre -99 %\n$SAKUYA_CL$ : Supprime l'efficacité des scores de guerre anciens et nouveaux ajoutés par ce bouton $game_concept_modifier$"
 SAKUYA_1_6_CHAR_TT_18: "#T Toutes sortes de petits gadgets inutiles #!\n\n$SAKUYA_LC$ : Ignorer les restrictions de genre pour devenir commandant de l'armée ($game_concept_army$) ou de la marine ($game_concept_navy$)\n$SAKUYA_SL$ : Entrée au gouvernement sans distinction de sexe\n$SAKUYA_RC$ : permet de devenir shogun\n$SAKUYA_SR$ : permet de commander la forteresse\n$SAKUYA_AL$ : Ajouter « Née dans la Chambre Pourpre » $game_concept_modifier$\n$SAKUYA_AR$ : Ajout de « Le fléau d'Asie centrale » $game_concept_modifier$\n#l Ctrl + clic gauche #!: effacer tous les éléments divers ajoutés par ce bouton $game_concept_modifier$\n#p Ctrl + clic droit sur #!: empêcher le personnage $game_concept_character$ d'interagir avec $game_concept_character$"
