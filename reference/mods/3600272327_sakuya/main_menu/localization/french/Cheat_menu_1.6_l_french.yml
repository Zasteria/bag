 SAKUYA_CHAR_BUTTON_30: "Restrictions d'éligibilité"
 SAKUYA_CHAR_TT_30: "#T Restrictions d'éligibilité #!\n\n$MODIFIER_TYPE_DESC_blocked_from_being_ruler$ \n$MODIFIER_TYPE_DESC_prevented_from_being_heir$ \n$MODIFIER_TYPE_DESC_blocked_from_being_leader$ \n\n#n Clic gauche #!:Ajouter « $MODIFIER_TYPE_NAME_blocked_from_being_ruler$ ». \n$SAKUYA_RC$ : Ajouter « $MODIFIER_TYPE_NAME_prevented_from_being_heir$ ». \n#n Maj + clic gauche #!: ajoute « $MODIFIER_TYPE_NAME_blocked_from_being_leader$ ». \n#n Alt + clic gauche #!: ajoute simultanément les trois restrictions ci-dessus. \n#l Ctrl + clic gauche #!: supprime toutes les restrictions de qualification ajoutées par ce bouton."
