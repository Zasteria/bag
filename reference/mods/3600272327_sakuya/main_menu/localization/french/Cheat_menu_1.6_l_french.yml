 SAKUYA_1_6_LOC_MOD_PROXIMITY_SOURCE_TT: "#T  $MODIFIER_TYPE_NAME_local_proximity_source$ #! \n \n $MODIFIER_TYPE_DESC_local_proximity_source$ \n \n $SAKUYA_LC$ + 10 \n $SAKUYA_RC$ -10 \n #l  Ctrl+Clic gauche#! Supprime tous les $game_concept_modifier$ ajoutés par ce bouton \n #p  Ctrl+Clic droit #! + 1 \n $SAKUYA_SL$ + 100"
 SAKUYA_1_6_ANNEXATION_SPEED_TT: "#T  $MODIFIER_TYPE_NAME_annexation_speed_modifier$ #! \n \n $MODIFIER_TYPE_DESC_annexation_speed_modifier$\n \n Chaque niveau de piles $game_concept_modifier$.\n \n $SAKUYA_LC$ + 10% \n $SAKUYA_RC$ -10% \n $SAKUYA_AL$ + 100% \n $SAKUYA_AR$ -1% \n $SAKUYA_SL$ + 1000% \n $SAKUYA_SR$ -90%\n $SAKUYA_CL$ $SAKUYA_REMOVE$"
