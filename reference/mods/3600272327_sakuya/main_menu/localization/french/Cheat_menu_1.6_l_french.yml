 SAKUYA_RELEASE_NON_CORES_TT: "#T  $RELEASE_NON_CORES_EFFECT$ #! \n $SAKUYA_LC$ Faites en sorte que le $game_concept_country$ marqué libère toutes les provinces non essentielles.\n #n  Alt+Clic gauche #! Faites en sorte que votre $game_concept_country$ libère toutes les provinces non essentielles.\n \n #n  Cette action modifie directement le territoire $game_concept_country$ et ne peut être annulée via ce bouton.#!"
