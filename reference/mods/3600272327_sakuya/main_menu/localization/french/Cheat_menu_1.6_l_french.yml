 SAKUYA_1_6_LOC_POPGEN_START_DISABLED_TT: "Commencez par répondre aux quatre questions concernant le nombre, $game_concept_pop_type$, $game_concept_culture$ et $game_concept_religion$."
 SAKUYA_1_6_LOC_POPGEN_START_READY_TT: "Les quatre sélections sont terminées. Ouvrez le panneau de génération de destination, puis sélectionnez « Générer vers $game_concept_location$ marqués »."
 SAKUYA_1_6_LOC_POPGEN_START_PANEL_TT: "Une génération sera effectuée pour chaque $game_concept_location$ marqué. S'il n'y a aucun $game_concept_location$ marqué, veuillez d'abord en marquer un dans le panneau de marquage $game_concept_location$ situé à droite."
