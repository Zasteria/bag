 SAKUYA_1_6_LOC_POPGEN_SPAWN_MARKED_TT: "Vous devez sélectionner au moins un $game_concept_location$. Une fois cette condition remplie, la nouvelle $game_concept_population$ sera générée dans tous $game_concept_location$ sélectionnés, en fonction de la sélection actuelle."
