 SAKUYA_1_6_MIL_BUTTON_SP4_TOOLTIP: "#T $MODIFIER_TYPE_NAME_mercenary_maintenance_efficiency$ / $MODIFIER_TYPE_NAME_mercenary_range$ #!\n\n$MODIFIER_TYPE_DESC_mercenary_maintenance_efficiency$\n$MODIFIER_TYPE_DESC_mercenary_range$\n\n$SAKUYA_LC$ : $SAKUYA_ADD_P$ +10 % d'efficacité de maintenance et de portée de recrutement\n$SAKUYA_RC$ : $SAKUYA_ADD_N$ -10 % d'efficacité de maintenance et de portée de recrutement\n$SAKUYA_SL$ : augmentation significative de $SAKUYA_ADD_P$ pour les deux éléments $game_concept_modifier$\n$SAKUYA_SR$ : correspond à la somme de deux valeurs $SAKUYA_ADD_N$ et d'une valeur négative importante $game_concept_modifier$\n$SAKUYA_CL$ : $SAKUYA_REMOVE$"
