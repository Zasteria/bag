 SAKUYA_LIFT_FOG_MUTUAL_TT: "$SAKUYA_AL$Les deux pays suppriment le $game_concept_fog_of_war$ de leur territoire respectif"
 SAKUYA_CHAR_TT_15: "#t Le mariage et le divorce #!\n$SAKUYA_LC$ : Oblige le personnage $game_concept_character$ à se marier avec le souverain $game_concept_ruler$ de notre pays, en ignorant les restrictions habituelles en matière de mariage.\n$SAKUYA_SL$ : Oblige le personnage cible $game_concept_character$ à se marier avec l'actuel $game_concept_heir$ de notre pays, en ignorant les restrictions habituelles en matière de mariage.\n$SAKUYA_RC$ : Fais en sorte que le personnage $game_concept_character$ divorce immédiatement de son conjoint actuel.\n$SAKUYA_SR$ : Interdit au personnage $game_concept_character$ de se marier (ajoute le modificateur d'interdiction de mariage $game_concept_modifier$).\n#l Ctrl + clic gauche #!: supprime toutes les restrictions matrimoniales $game_concept_modifier$ de la cible $game_concept_character$.\n#p Ctrl + clic droit sur #!: interdit au personnage $game_concept_character$ de se marier avec un noble de rang inférieur (ajoute l'interdiction de mariage avec un roturier $game_concept_modifier$).\n\n#low C'est ma mère, mais aussi ma femme, ma sœur et ma fille. #!"
 SAKUYA_1_6_BTN4_ABSOLUTISM_TT: "$SAKUYA_LC$ #n  L'absolutisme se déplace à gauche #! ( -20 ) \n $SAKUYA_RC$ #n  Le libéralisme se déplace à droite #! (+ 20 )"
 SAKUYA_1_6_BTN4_LATINIZATION_TT: "$SAKUYA_LC$ #n  La latinisation se déplace à gauche#! ( -20 ) \n $SAKUYA_RC$ #n  La romanisation se déplace vers la droite #! (+ 20 )"
 SAKUYA_1_6_RGO_BUTTON_2_TT: "#T  $MODIFIER_TYPE_NAME_local_raw_material_output$ #! \n \n $MODIFIER_TYPE_DESC_local_raw_material_output$ \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  10% #! sortie.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -10% #! sortie.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  1000% #! sortie.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -1000% #! sortie.\n $SAKUYA_CL$ Supprime tous les $game_concept_modifier$ ajoutés par les grands et petits boutons.\n $SAKUYA_CR$ $SAKUYA_ADD_P$ #P  1% #! sortie.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  100% #! sortie.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -100% #! sortie.\n \n #low  Différents niveaux de $game_concept_modifier$ peuvent s'empiler.#!"
 SAKUYA_1_6_RGO_BUTTON_2_SMALL_TT: "#t  Plus de sortie par niveau $game_concept_modifier$ #! \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  50% #! sortie.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -50% #! sortie.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  2000% #! sortie.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -2000% #! sortie.\n $SAKUYA_CL$ $SAKUYA_ADD_P$ #P  500% #! sortie.\n $SAKUYA_CR$ $SAKUYA_ADD_N$ #N  -500% #! sortie.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  999999% #! sortie.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -999999% #! sortie.\n \n #warning  Le petit bouton ne peut pas supprimer $game_concept_modifier$ .Tous les $game_concept_modifier$ ne peuvent être supprimés qu'en utilisant Ctrl+Clic gauche sur le gros bouton à gauche.#!"
