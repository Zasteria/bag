 SAKUYA_CHAR_TT_32: "#T $MODIFIER_TYPE_NAME_can_assume_fort_command_character$ #!\n\n $MODIFIER_TYPE_DESC_can_assume_fort_command_character$ \n\n $SAKUYA_LC$ : Ajouter cette licence. \n $SAKUYA_RC$ : Supprimer la licence ajoutée par ce bouton. \n#l Ctrl + clic gauche #!: Supprimer la licence ajoutée par ce bouton."
 SAKUYA_1_6_TT_MILITARY_BOOST: "$SAKUYA_LC$ Augmenter l'entraînement, le moral $game_concept_army$ et $game_concept_navy$, les tactiques militaires, la tradition de l'armée et de la marine et l'efficacité de la maintenance de l'armée et de la marine.\n $SAKUYA_SL$ Ajoutez \"Mort 999 \" le boost militaire ultime, où les bonus d'infanterie et de cavalerie s'appliquent aux types d'unités légères et lourdes.\n $SAKUYA_RC$ Supprimez tous les boosts militaires."
