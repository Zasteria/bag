 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Définissez le $game_concept_country$ marqué comme notre $game_concept_rival$ .\n $SAKUYA_RC$ Annulez notre relation $game_concept_rival$ avec le $game_concept_country$ marqué.\n $SAKUYA_SL$ Faites en sorte que le $game_concept_country$ marqué nous définisse comme leur $game_concept_rival$ .\n $SAKUYA_SR$ Annulez la relation $game_concept_rival$ du $game_concept_country$ marqué avec nous.\n $SAKUYA_CL$ Les deux pays se définissent comme $game_concept_rival$ .\n $SAKUYA_CR$ Les deux pays annulent la relation $game_concept_rival$.\n $SAKUYA_AL$ Définissez le $game_concept_country$ marqué comme notre $game_concept_rival$ historique.\n $SAKUYA_AR$ Annulez notre relation historique $game_concept_rival$ avec le $game_concept_country$ marqué."
 SAKUYA_RIVAL_ADD_TT: "Définir le pays marqué comme notre $game_concept_rival$"
 SAKUYA_RIVAL_REMOVE_TT: "Annuler notre relation $game_concept_rival$ avec le pays marqué"
 SAKUYA_RIVAL_REVERSE_ADD_TT: "Faire en sorte que le pays marqué nous définisse comme $game_concept_rival$"
