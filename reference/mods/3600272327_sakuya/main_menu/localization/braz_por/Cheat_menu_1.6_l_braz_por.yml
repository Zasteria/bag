 SAKUYA_LIFT_FOG_TT: "#T $game_concept_fog_of_war$#!\n$SAKUYA_LC$Remova o $game_concept_fog_of_war$ do território do $game_concept_country$ marcado.\n$SAKUYA_RC$Remova o $game_concept_fog_of_war$ do nosso território.\n$SAKUYA_AL$Ambos os países removem o $game_concept_fog_of_war$ do território um do outro."
