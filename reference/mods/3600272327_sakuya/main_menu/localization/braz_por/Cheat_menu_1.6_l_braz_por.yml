 SAKUYA_RELEASE_NON_CORES_TT: "#T  $RELEASE_NON_CORES_EFFECT$ #! \n $SAKUYA_LC$ Faça com que o $game_concept_country$ marcado libere todas as províncias não essenciais.\n #n  Alt+Clique esquerdo #! Faça com que seu $game_concept_country$ libere todas as províncias não essenciais.\n \n #n  Esta ação altera diretamente o território $game_concept_country$ e não pode ser desfeita através deste botão.#!"
