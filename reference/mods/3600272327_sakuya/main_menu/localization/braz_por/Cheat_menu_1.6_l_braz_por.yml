 SAKUYA_CHAR_TT_15: "#t Casamento e divórcio #!\n$SAKUYA_LC$: Obriga o alvo $game_concept_character$ a se casar com o nosso $game_concept_ruler$, ignorando as restrições matrimoniais habituais.\n$SAKUYA_SL$: Obriga o alvo $game_concept_character$ a se casar com o atual $game_concept_heir$ do nosso país, ignorando as restrições matrimoniais habituais.\n$SAKUYA_RC$: Faça com que o alvo $game_concept_character$ se divorcie imediatamente de seu cônjuge atual.\n$SAKUYA_SR$: Impede que o personagem $game_concept_character$ se case (adiciona o modificador de proibição de casamento $game_concept_modifier$).\n#l Ctrl + botão esquerdo #!: Remover todas as restrições matrimoniais $game_concept_modifier$ do alvo $game_concept_character$.\n#p Ctrl + botão direito do mouse #!: Impede que o alvo $game_concept_character$ se case com um nobre de baixa linhagem (adiciona a restrição de casamento com plebeus $game_concept_modifier$).\n\n#low Esta é minha mãe, mas também minha esposa, minha irmã e minha filha. #!"
 SAKUYA_1_6_BTN4_ABSOLUTISM_TT: "$SAKUYA_LC$ #n  O absolutismo se move para a esquerda #! ( -20 ) \n $SAKUYA_RC$ #n  O liberalismo se move para a direita #! (+ 20 )"
 SAKUYA_1_6_BTN4_LATINIZATION_TT: "$SAKUYA_LC$ #n  A latinização se move para a esquerda#! ( -20 ) \n $SAKUYA_RC$ #n  A romanização se move para a direita #! (+ 20 )"
 SAKUYA_1_6_RGO_BUTTON_2_TT: "#T  $MODIFIER_TYPE_NAME_local_raw_material_output$ #! \n \n $MODIFIER_TYPE_DESC_local_raw_material_output$ \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  10% #! saída.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -10% #! saída.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  1000% #! saída.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -1000% #! saída.\n $SAKUYA_CL$ Remova todos os $game_concept_modifier$ adicionados por botões grandes e pequenos.\n $SAKUYA_CR$ $SAKUYA_ADD_P$ #P  1% #! saída.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  100% #! saída.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -100% #! saída.\n \n #low  Diferentes níveis de $game_concept_modifier$ podem ser empilhados.#!"
 SAKUYA_1_6_RGO_BUTTON_2_SMALL_TT: "#t  Mais saída por nível $game_concept_modifier$ #! \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  50% #! saída.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -50% #! saída.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  2000% #! saída.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -2000% #! saída.\n $SAKUYA_CL$ $SAKUYA_ADD_P$ #P  500% #! saída.\n $SAKUYA_CR$ $SAKUYA_ADD_N$ #N  -500% #! saída.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  999999% #! saída.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -999999% #! saída.\n \n #warning  O botão pequeno não pode remover $game_concept_modifier$ .Todos os $game_concept_modifier$ só podem ser removidos usando Ctrl+Clique esquerdo no botão grande à esquerda.#!"
