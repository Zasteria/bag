 SAKUYA_1_6_MAIN_CULTURE_TT_SELECTED: "#t  Modifique seu $game_concept_primary_culture$ #! \n \n $SAKUYA_LC$ Mude $game_concept_primary_culture$ do nosso país para $game_concept_primary_culture$ do marcado $game_concept_country$ .\n $SAKUYA_RC$ Alterar $game_concept_primary_culture$ do $game_concept_country$ marcado para $game_concept_primary_culture$ do nosso país.\n $SAKUYA_SL$ Altere $game_concept_primary_culture$ do nosso país para o $game_concept_culture$ selecionado no seletor $game_concept_culture$.\n #n  Ctrl+Clique esquerdo #! Limpa o $game_concept_culture$ selecionado no seletor $game_concept_culture$.\n \n #p  Você selecionou atualmente um $game_concept_culture$ #!"
