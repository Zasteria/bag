 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Defina o $game_concept_country$ marcado como nosso $game_concept_rival$ .\n $SAKUYA_RC$ Cancela nosso relacionamento $game_concept_rival$ com o $game_concept_country$ marcado.\n $SAKUYA_SL$ Faça com que o $game_concept_country$ marcado nos defina como seu $game_concept_rival$ .\n $SAKUYA_SR$ Cancele o relacionamento $game_concept_rival$ do $game_concept_country$ marcado conosco.\n $SAKUYA_CL$ Ambos os países se definem como $game_concept_rival$ .\n $SAKUYA_CR$ Ambos os países cancelam o relacionamento $game_concept_rival$.\n $SAKUYA_AL$ Defina o $game_concept_country$ marcado como nosso histórico $game_concept_rival$ .\n $SAKUYA_AR$ Cancela nosso relacionamento histórico $game_concept_rival$ com o $game_concept_country$ marcado."
