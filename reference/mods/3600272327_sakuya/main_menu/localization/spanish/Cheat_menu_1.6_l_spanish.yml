 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Establezca el $game_concept_country$ marcado como nuestro $game_concept_rival$ .\n $SAKUYA_RC$ Cancelar nuestra relación $game_concept_rival$ con el $game_concept_country$ marcado.\n $SAKUYA_SL$ Haga que el $game_concept_country$ marcado nos establezca como su $game_concept_rival$ .\n $SAKUYA_SR$ Cancelar la relación $game_concept_rival$ del marcado $game_concept_country$ con nosotros.\n $SAKUYA_CL$ Ambos países se establecen entre sí como $game_concept_rival$ .\n $SAKUYA_CR$ Ambos países cancelan la relación $game_concept_rival$.\n $SAKUYA_AL$ Establece el $game_concept_country$ marcado como nuestro $game_concept_rival$ histórico.\n $SAKUYA_AR$ Cancelar nuestra relación histórica $game_concept_rival$ con el marcado $game_concept_country$ ."
