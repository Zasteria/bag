 SAKUYA_CHAR_TT_15: "#t El matrimonio y el divorcio #!\n$SAKUYA_LC$: Obliga al personaje $game_concept_character$ a casarse con el gobernante de nuestro país, $game_concept_ruler$, sin tener en cuenta las restricciones matrimoniales habituales.\n$SAKUYA_SL$: Obliga al personaje $game_concept_character$ a casarse con el actual $game_concept_heir$ de nuestro país, ignorando las restricciones matrimoniales habituales.\n$SAKUYA_RC$: Haz que el objetivo $game_concept_character$ se divorcie inmediatamente de su actual cónyuge.\n$SAKUYA_SR$: Impide que el personaje $game_concept_character$ se case (añade la restricción matrimonial $game_concept_modifier$).\n#l Ctrl + botón izquierdo #!: elimina todas las restricciones matrimoniales $game_concept_modifier$ del objetivo $game_concept_character$.\n#p Ctrl + clic derecho en « #!»: impide que el personaje $game_concept_character$ se case con un noble de rango inferior (añade la restricción «prohibido casarse con plebeyos» $game_concept_modifier$).\n\n#low Esta es mi madre, pero también es mi esposa, mi hermana y mi hija. #!"
