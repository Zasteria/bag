 SAKUYA_1_6_MAIN_CULTURE_TT_UNSELECTED: "#t  Modifica tu $game_concept_primary_culture$ #! \n \n $SAKUYA_LC$ Cambia $game_concept_primary_culture$ de nuestro país a $game_concept_primary_culture$ del marcado $game_concept_country$ .\n $SAKUYA_RC$ Cambiar $game_concept_primary_culture$ del marcado $game_concept_country$ a $game_concept_primary_culture$ de nuestro país.\n $SAKUYA_SL$ Abre el selector $game_concept_culture$.\n #n  Ctrl+Clic izquierdo #! Borra el $game_concept_culture$ seleccionado en el selector $game_concept_culture$.\n \n #n  Nota: El clic izquierdo y el clic derecho requieren un $game_concept_country$ marcado.#!"
 SAKUYA_1_6_MAIN_CULTURE_TT_SELECTED: "#t  Modifica tu $game_concept_primary_culture$ #! \n \n $SAKUYA_LC$ Cambia $game_concept_primary_culture$ de nuestro país a $game_concept_primary_culture$ del marcado $game_concept_country$ .\n $SAKUYA_RC$ Cambiar $game_concept_primary_culture$ del marcado $game_concept_country$ a $game_concept_primary_culture$ de nuestro país.\n $SAKUYA_SL$ Cambiar $game_concept_primary_culture$ de nuestro país por el $game_concept_culture$ seleccionado en el selector $game_concept_culture$.\n #n  Ctrl+Clic izquierdo #! Borra el $game_concept_culture$ seleccionado en el selector $game_concept_culture$.\n \n #p  Actualmente has seleccionado un $game_concept_culture$ #!"
