 SAKUYA_1_6_MAIN_RELIGION_TT_SELECTED: "#t  Modifica tu $game_concept_primary_religion$ #! \n \n $SAKUYA_LC$ Cambia $game_concept_primary_religion$ de nuestro país a $game_concept_primary_religion$ del marcado $game_concept_country$ .\n $SAKUYA_RC$ Cambiar $game_concept_primary_religion$ del marcado $game_concept_country$ a $game_concept_primary_religion$ de nuestro país.\n $SAKUYA_SL$ Cambiar $game_concept_primary_religion$ de nuestro país por el $game_concept_religion$ seleccionado en el selector $game_concept_religion$.\n #n  Ctrl+Clic izquierdo #! Borra el $game_concept_religion$ seleccionado en el selector $game_concept_religion$.\n \n #p  Actualmente has seleccionado un $game_concept_religion$ #!"
 SAKUYA_1_6_DIPLOMACY_CULTURE_TT_UNSELECTED: "#t  Modificar $game_concept_primary_culture$ #! \n \n $SAKUYA_LC$ Cambiar $game_concept_primary_culture$ del marcado $game_concept_country$ a $game_concept_primary_culture$ de nuestro país.\n $SAKUYA_RC$ Cambiar $game_concept_primary_culture$ de nuestro país por $game_concept_primary_culture$ del marcado $game_concept_country$ .\n $SAKUYA_SL$ Abre el selector $game_concept_culture$.\n #n  Ctrl+Clic izquierdo #! Borra el $game_concept_culture$ seleccionado en el selector $game_concept_culture$.\n \n #n  Advertencia: ¡Esta acción es irreversible!#!"
