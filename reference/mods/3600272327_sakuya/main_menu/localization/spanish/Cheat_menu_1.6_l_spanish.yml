 SAKUYA_1_6_TT_MILITARY_BOOST: "$SAKUYA_LC$ Aumenta el entrenamiento, la moral de $game_concept_army$ y $game_concept_navy$, las tácticas militares, la tradición del ejército y la marina y la eficiencia del mantenimiento del ejército y la marina.\n $SAKUYA_SL$ Agrega \"Tu Muerte 999 \" impulso militar definitivo, donde las bonificaciones de infantería y caballería se aplican tanto a tipos de unidades ligeras como pesadas.\n $SAKUYA_RC$ Elimina todos los refuerzos militares."
