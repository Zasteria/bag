 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T Eficiencia en la puntuación de guerra #!\n\nSolo se ajusta la eficiencia de los puntos de guerra de las cláusulas de paz territoriales, sin tener en cuenta ya el efecto de un bajo nivel de control.\n\n$SAKUYA_LC$: Eficiencia de puntos de guerra +10 %; con los mismos puntos de guerra se pueden obtener más territorios\n$SAKUYA_RC$: Eficiencia de los puntos de guerra: -10 %; con los mismos puntos de guerra se obtienen menos territorios.\n$SAKUYA_SL$: Eficiencia de puntos de guerra +10000 %\n$SAKUYA_SR$: Eficiencia de puntos de guerra: -99 %\n$SAKUYA_CL$: Elimina la eficiencia de puntuación de guerra, tanto antigua como nueva, añadida por este botón $game_concept_modifier$"
 SAKUYA_1_6_CHAR_TT_18: "#T Todo tipo de chucherías inútiles #!\n\n$SAKUYA_LC$: Ignora las restricciones de género para convertirte en comandante de $game_concept_army$ o $game_concept_navy$\n$SAKUYA_SL$: Sin restricciones de género para formar parte del gabinete\n$SAKUYA_RC$: permite convertirse en shogún\n$SAKUYA_SR$: Permite comandar la fortaleza\n$SAKUYA_AL$: Añadir «Nacida en la Sala Púrpura» $game_concept_modifier$\n$SAKUYA_AR$: Añadir «La catástrofe de Asia Central» $game_concept_modifier$\n#l Ctrl + botón izquierdo #!: eliminar todos los elementos adicionales añadidos por este botón $game_concept_modifier$\n#p Ctrl + clic con el botón derecho en #!: impide que $game_concept_character$ interactúe con $game_concept_character$"
