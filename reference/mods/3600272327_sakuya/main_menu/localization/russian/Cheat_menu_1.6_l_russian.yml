 SAKUYA_RELEASE_NON_CORES_TT: "#T  $RELEASE_NON_CORES_EFFECT$ #! \n $SAKUYA_LC$ Заставьте отмеченную $game_concept_country$ освободить все неосновные провинции.\n #n  Alt+щелкните левой кнопкой мыши #! Сделайте так, чтобы $game_concept_country$ освободил все неосновные провинции.\n \n #n  Это действие напрямую изменяет территорию $game_concept_country$ и не может быть отменено с помощью этой кнопки.#!"
