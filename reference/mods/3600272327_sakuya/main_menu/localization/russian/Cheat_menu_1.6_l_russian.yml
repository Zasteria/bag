 SAKUYA_1_6_TT_MILITARY_BOOST: "$SAKUYA_LC$ Улучшите обучение, моральный дух $game_concept_army$ и $game_concept_navy$, военную тактику, традиции армии и флота, а также эффективность обслуживания армии и флота.\n $SAKUYA_SL$ Добавьте ультимативное военное усиление «Смерть 999», при котором бонусы пехоты и кавалерии применяются как к легким, так и к тяжелым типам юнитов.\n $SAKUYA_RC$ Удалить все военные усиления."
