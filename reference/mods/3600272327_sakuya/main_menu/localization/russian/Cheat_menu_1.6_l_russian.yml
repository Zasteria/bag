 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ Установите отмеченную $game_concept_country$ в качестве нашей $game_concept_rival$ .\n $SAKUYA_RC$ Отменяем нашу связь $game_concept_rival$ с отмеченным $game_concept_country$ .\n $SAKUYA_SL$ Сделайте так, чтобы отмеченные $game_concept_country$ установили нас в качестве своих $game_concept_rival$ .\n $SAKUYA_SR$ Отмените отношения $game_concept_rival$ отмеченного $game_concept_country$ с нами.\n $SAKUYA_CL$ Обе страны устанавливают друг друга как $game_concept_rival$ .\n $SAKUYA_CR$ Обе страны отменяют отношения $game_concept_rival$.\n $SAKUYA_AL$ Установите отмеченный $game_concept_country$ в качестве нашего исторического $game_concept_rival$ .\n $SAKUYA_AR$ Отмените нашу историческую связь $game_concept_rival$ с отмеченным $game_concept_country$ ."
