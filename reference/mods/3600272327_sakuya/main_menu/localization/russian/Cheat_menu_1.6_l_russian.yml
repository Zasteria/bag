 SAKUYA_1_6_RGO_BUTTON_2_TT: "#T  $MODIFIER_TYPE_NAME_local_raw_material_output$ #! \n \n $MODIFIER_TYPE_DESC_local_raw_material_output$ \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  10% #! вывод.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -10% #! вывод.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  1000% #! вывод.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -1000% #! вывод.\n $SAKUYA_CL$ Удалить все $game_concept_modifier$, добавленные с помощью больших и маленьких кнопок.\n $SAKUYA_CR$ $SAKUYA_ADD_P$ #P  1% #! вывод.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  100% #! вывод.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -100% #! вывод.\n \n #low  Различные уровни $game_concept_modifier$ могут суммироваться.#!"
 SAKUYA_1_6_RGO_BUTTON_2_SMALL_TT: "#t  Больше выходных данных на каждом уровне $game_concept_modifier$ #! \n \n $SAKUYA_LC$ $SAKUYA_ADD_P$ #P  50% #! выходных данных.\n $SAKUYA_RC$ $SAKUYA_ADD_N$ #N  -50% #! вывод.\n $SAKUYA_SL$ $SAKUYA_ADD_P$ #P  2000% #! вывод.\n $SAKUYA_SR$ $SAKUYA_ADD_N$ #N  -2000% #! вывод.\n $SAKUYA_CL$ $SAKUYA_ADD_P$ #P  500% #! вывод.\n $SAKUYA_CR$ $SAKUYA_ADD_N$ #N  -500% #! вывод.\n $SAKUYA_AL$ $SAKUYA_ADD_P$ #P  999999% #! вывод.\n $SAKUYA_AR$ $SAKUYA_ADD_N$ #N  -999999% #! вывод.\n \n #warning  Маленькая кнопка не может удалить $game_concept_modifier$ .Все $game_concept_modifier$ можно удалить только с помощью Ctrl + щелчок левой кнопкой мыши по большой кнопке слева.#!"
