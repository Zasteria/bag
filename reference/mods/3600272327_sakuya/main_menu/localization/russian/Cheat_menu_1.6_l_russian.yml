 SAKUYA_1_6_LOC_MOD_PROXIMITY_SOURCE: "Локальный источник близости"
 SAKUYA_1_6_LOC_MOD_PROXIMITY_SOURCE_TT: "#T  $MODIFIER_TYPE_NAME_local_proximity_source$ #! \n \n $MODIFIER_TYPE_DESC_local_proximity_source$ \n \n $SAKUYA_LC$ + 10 \n $SAKUYA_RC$ -10 \n #l  Ctrl+Левый клик#! Удалить все $game_concept_modifier$, добавленные с помощью этой кнопки \n #p  Ctrl+щелчок правой кнопкой мыши #! + 1 \n $SAKUYA_SL$ + 100"
 SAKUYA_1_6_ANNEXATION_SPEED_TT: "#T  $MODIFIER_TYPE_NAME_annexation_speed_modifier$ #! \n \n $MODIFIER_TYPE_DESC_annexation_speed_modifier$\n \n Каждый уровень $game_concept_modifier$ складывается.\n \n $SAKUYA_LC$ + 10% \n $SAKUYA_RC$ -10% \n $SAKUYA_AL$ + 100% \n $SAKUYA_AR$ -1% \n $SAKUYA_SL$ + 1000% \n $SAKUYA_SR$ -90%\n $SAKUYA_CL$ $SAKUYA_REMOVE$"
 SAKUYA_1_6_ANNEXATION_SPEED_CLEAR_TT: "Удалить все модификаторы $MODIFIER_TYPE_NAME_annexation_speed_modifier$, добавленные этой кнопкой"
 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T Эффективность боевых очков #!\n\nИзменяется только эффективность военных очков в отношении положений о мирном урегулировании территориальных вопросов; влияние низкого уровня контроля больше не учитывается.\n\n$SAKUYA_LC$: Эффективность военных очков +10%; при одинаковом количестве военных очков можно получить больше территории\n$SAKUYA_RC$: Эффективность военных очков -10%; при одинаковом количестве военных очков можно получить меньше территории\n$SAKUYA_SL$: Эффективность набора очков войны +10000%\n$SAKUYA_SR$: Эффективность набора очков в бою -99%\n$SAKUYA_CL$: удалить все новые и старые военные очки, добавленные с помощью этой кнопки, с коэффициентом эффективности $game_concept_modifier$"
 SAKUYA_1_6_CHAR_TT_18: "#T Разные бесполезные безделушки #!\n\n$SAKUYA_LC$: игнорировать ограничения по полу и стать полководцем $game_concept_army$ или $game_concept_navy$\n$SAKUYA_SL$: Вхождение в кабинет министров без учета гендерных ограничений\n$SAKUYA_RC$: дает право стать сёгуном\n$SAKUYA_SR$: разрешить управление крепостью\n$SAKUYA_AL$: добавить «Родилась в Фиолетовой комнате» $game_concept_modifier$\n$SAKUYA_AR$: добавить «Бедствие в Центральной Азии» $game_concept_modifier$\n#l Ctrl+левая кнопка мыши #!: удалить все дополнительные элементы $game_concept_modifier$, добавленные с помощью этой кнопки\n#p Ctrl+правая кнопка мыши « #!»: запретить $game_concept_character$ взаимодействовать с $game_concept_character$"
 SKY_TBC_TT: "Пока недоступно"
