 SAKUYA_1_6_TRADE_EFFICIENCY_TT: "#T  $MODIFIER_TYPE_NAME_trade_land_efficiency$ / $MODIFIER_TYPE_NAME_trade_sea_efficiency$ #! \n \n $MODIFIER_TYPE_DESC_trade_land_efficiency$ \n $MODIFIER_TYPE_DESC_trade_sea_efficiency$ \n \n $SAKUYA_LC$ + 10% \n $SAKUYA_RC$ -10% \n$SAKUYA_SL$ + 1000% \n $SAKUYA_SR$ -1000% \n $SAKUYA_AL$ + 1% \n $SAKUYA_AR$ -1% \n $SAKUYA_CL$ Удалить все старые и новые $game_concept_modifier$, добавленные с помощью этой кнопки"
