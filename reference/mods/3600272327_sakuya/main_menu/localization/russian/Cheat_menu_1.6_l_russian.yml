 SAKUYA_CHAR_TT_15: "#t Брак и развод #!\n$SAKUYA_LC$: Принудительно заключить брак между персонажем $game_concept_character$ и правителем нашей страны $game_concept_ruler$, игнорируя обычные ограничения на вступление в брак.\n$SAKUYA_SL$: Принудительно заключить брак между целью $game_concept_character$ и нынешним $game_concept_heir$ нашей страны, игнорируя обычные ограничения на вступление в брак.\n$SAKUYA_RC$: Немедленно развести цель $game_concept_character$ с нынешним супругом.\n$SAKUYA_SR$: Запретить брак с персонажем $game_concept_character$ (добавить запрет на брак $game_concept_modifier$).\n#l Ctrl+левая кнопка мыши #!: снять все ограничения на вступление в брак $game_concept_modifier$ с персонажа $game_concept_character$.\n#p Ctrl+правая кнопка мыши « #!»: запретить персонажу $game_concept_character$ вступать в брак с представителями низших сословий (добавить запрет на брак с простолюдинами $game_concept_modifier$).\n\n#low Это моя мать, а также моя жена, сестра и дочь. #!"
