 SAKUYA_ARMY_GENERATOR_CREATE_PLAYER_TT: "#T  Создать выбранную армию для нашей страны #! \n \n $SAKUYA_LC$ $game_concept_army$ предпочитают появляться в отмеченной дружественной стране $game_concept_location$ , в противном случае в столице;$game_concept_navy$ предпочитают появляться в отмеченных дружественных портах, в противном случае в столичном порту или других дружественных портах."
 SAKUYA_ARMY_GENERATOR_CREATE_TARGET_TT: "#T  Генерировать выбранную армию для отмеченной $game_concept_country$ #! \n \n $SAKUYA_SL$ $game_concept_army$ спавниться в столице отмеченной $game_concept_country$ и принадлежать ей;$game_concept_navy$ появляются в столичном порту отмеченного $game_concept_country$ или других портах и ​​принадлежат ему.Сначала требуется отмеченный $game_concept_country$."
