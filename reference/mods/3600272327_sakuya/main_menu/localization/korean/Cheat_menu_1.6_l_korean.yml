 SAKUYA_1_6_MIL_BUTTON_SP6_TOOLTIP: "#T 전쟁 점수 효율 #!\n\n영토 평화 조항의 전쟁 점수 효율만 조정하며, 더 이상 낮은 통제력의 영향은 반영하지 않습니다.\n\n$SAKUYA_LC$ : 전쟁 점수 효율 +10%, 동일한 전쟁 점수로 더 많은 영토를 획득할 수 있습니다\n$SAKUYA_RC$ : 전쟁 점수 효율 -10%, 동일한 전쟁 점수로 획득할 수 있는 영토가 줄어듭니다\n$SAKUYA_SL$ : 전쟁 점수 효율 +10000%\n$SAKUYA_SR$ : 전쟁 점수 효율 -99%\n$SAKUYA_CL$ : 이 버튼으로 추가된 모든 전쟁 점수(신규 및 기존)를 제거하여 효율성 향상 $game_concept_modifier$"
