 SAKUYA_RIVAL_TT: "#T  $game_concept_rival$ #! \n $SAKUYA_LC$ 표시된 $game_concept_country$를 $game_concept_rival$로 설정합니다.\n $SAKUYA_RC$ 표시된 $game_concept_country$와의 $game_concept_rival$ 관계를 취소합니다.\n $SAKUYA_SL$ 표시된 $game_concept_country$을 $game_concept_rival$로 설정합니다.\n $SAKUYA_SR$ 표시된 $game_concept_country$과 당사와의 $game_concept_rival$ 관계를 취소합니다.\n $SAKUYA_CL$ 두 국가는 서로를 $game_concept_rival$로 설정합니다.\n $SAKUYA_CR$ 양국 모두 $game_concept_rival$ 관계를 취소합니다.\n $SAKUYA_AL$ 표시된 $game_concept_country$를 과거 $game_concept_rival$로 설정합니다.\n $SAKUYA_AR$ 표시된 $game_concept_country$와의 과거 $game_concept_rival$ 관계를 취소합니다."
