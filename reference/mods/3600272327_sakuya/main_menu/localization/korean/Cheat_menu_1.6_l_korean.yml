 SAKUYA_ARMY_GENERATOR_CREATE_PLAYER_TT: "#T  우리나라를 위해 선택된 군대 생성 #! \n \n $SAKUYA_LC$ $game_concept_army$는 아군으로 표시된 $game_concept_location$에서 생성되는 것을 선호하며, 그렇지 않으면 수도에서 생성됩니다.$game_concept_navy$는 표시된 아군 항구에서 생성되는 것을 선호하며, 그렇지 않으면 수도 항구나 다른 아군 항구에서 생성됩니다."
 SAKUYA_ARMY_GENERATOR_CREATE_TARGET_TT: "#T  표시된 $game_concept_country$ #! \n \n $SAKUYA_SL$ $game_concept_army$에 대해 선택된 군대를 표시된 $game_concept_country$의 수도에서 생성하고 이에 속합니다.$game_concept_navy$는 표시된 $game_concept_country$의 수도 포트 또는 다른 포트에 생성되어 이에 속합니다.먼저 표시된 $game_concept_country$가 필요합니다."
