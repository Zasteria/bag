SAKUYA_LOC_1_CHEAT_MENU_PRO_AFTERBURNDER: "标记国家和地点太麻烦？外国角色难标记？\N#T 试试拓展MOD#!#COLOR:{1,0.8,0.5,1} $SAKUYA_AFTERBURNER$#! #T 吧！#!\N\N只需轻轻右键，国家、地区与角色即可随心标记，无视一切限制！彻底告别烦人的外交行动、繁琐的省份系统，以及俄罗斯套娃般繁复的外国角色标记机制！一步到位，畅享安心舒适！创意工坊或者群文件搜索 #p $SAKUYA_AFTERBURNER$#!，即可订阅下载！\N\N#n 注意：此MOD会影响与其他MOD的兼容性。#!" #翻译为其他语言时，务必不要翻译群文件相关。QQ群只面向中文用户，所以不要提及。这段注释也别翻译。

