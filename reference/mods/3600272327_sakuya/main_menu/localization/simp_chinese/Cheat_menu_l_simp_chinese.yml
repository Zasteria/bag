 # 控制台标签页
 SAKUYA_CHEAT_MENU_CONSOLE_TITLE: "#t 控制台命令#!"
 SAKUYA_CONSOLE_REPORT_TEXT: "在此处可以快速访问常用的控制台命令。\N\N#low 注意：使用控制台命令可能会影响游戏平衡性，建议在测试或娱乐时使用。#!"
 CHEAT_MENU_CONSOLE_1: "背起了行囊 離開家的那一刻 我知道現實生活 有太多特別的特 假如你看到了我 也不要太過冷漠 我多愁善感 但也熱情奔放灑脫"
 CHEAT_MENU_COMMAND_STUDIES_TEXT_1: "#p 欢迎来到控制台菜单!#!\n 在这里， 我将教授您一些使用控制台的技巧。 如您所见， 控制台的强大和魅力远远不止拿来作弊那么简单。 接下来我来教授您一些使用控制台的小技巧。 \N\N#l 如何吞并省份？ #!\N在MOD实现吞并特定的地块和省份其实相当困难。 首先要标记玩家想要吞并的省份， 但怎么实现能让MOD知道玩家想要吞并的省份是啥呢？ 很难很难。 但好消息是， 您可以使用以下指令：\N #P conquer#! 。  \N 比如我想吞并$constantinople$， 怎么实现？开启debug模式后， 将鼠标移动到$constantinople$， 然后记录#I Location Tag#!， 最后在控制台输入： #P conquer#!  #L constantinople#!。  \N 不要输入#I Location ID#!。 在EU4或许还可用， 但在EU5可不行。 " \N那么我们如何吞并整个国家呢？直接用 #p annex#! 指令就行了。 比如我要吞并$BOH$， 我只需要像刚才那样，将鼠标移动到想要吞并的国家上方，找到$BOH$的Tag，再去控制台输入:\N #P annex#! #I BOH#!就可以了。快速地$colonize$土地的话，我们需要用到#p colonize_and_finish#! 或者#p colonize#!。与EU4不同，EU5只能殖民未开发的省份。 \N\N很好，您估计已经学会了如何利用控制台修改指定省份的数据了。 您可以试着用以下命令去做点什么！\N #I add_core (#n Location ID#!)#! 制造核心 \N #I tag (#n Tag#!)#! 切换国家 \N #I population (#n Location ID#!)#! 增加人口 。 \N #I raid (#n Location ID#!)#! 劫掠。 \N#I create_pu (#n Tag#!)#! 强迫一个国家与你建立联合统治。 \N#I make_subject (#n Subject Type#!) (#n Tag#!)#! 强迫一个国家成为你的附属国。 \N #I declarewar (#n Tag#!) (#n Tag#!)#! 立即向指定国家宣战。第二个Tag如果被填写，可以坐观被指定的两个国家莫名其妙打起来。 \N#I braindeadai (#n Tag#!)#! 立即停止指定国家的AI  \n 其他功能您也可以在控制台中探索一番。"

