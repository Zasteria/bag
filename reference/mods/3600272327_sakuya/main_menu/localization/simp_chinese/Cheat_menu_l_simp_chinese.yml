CHEAT_MENU_SAKUYA_KAWASHIRO_TITLE: "#t  一则新闻？#!"
CHEAT_MENU_SAKUYA_KAWASHIRO_NEWS_TITLE: "#t 咲夜大捷于幻想郷　外军溃走#!"
CHEAT_MENU_SAKUYA_KAWASHIRO_NEWS_CONTENT: "去年樱花凋谢之时，河城荷取研究出时空穿梭机后，幻想乡的结界便开始频繁受到外界的干扰，给幻想乡的安定带来了前所未有的挑战。那时丰聪耳神子曾警告过河城荷取，如果贸然穿越到几百年前的日本，极有可能导致时空紊乱，进而使幻想乡的结界破裂。博丽神社的掌门人博丽灵梦也表达了相同的担忧：「前几天我观察到有大量的魂魄在幻想乡上空飘过，怎么也驱逐不干净。八云紫忧心忡忡地提醒我，最近一定要格外小心。」\n 就在昨天，幻想乡发生了一次大规模入侵。与前几个月陆续闯进来的外乡人不同，这群是一批自称是相模国大名的武士率领残兵，从博丽大结界突入，一路沿着春色小径穿过雾之湖，打伤了多名妖精后，企图劫掠红魔馆。据红魔馆主人蕾米莉亚·斯卡雷特所述，为首的大名俘虏了保安红美铃，并闯入馆舍内，打砸抢劫，夺走了馆内大量财物。红魔馆的管家十六夜咲夜率领幻想乡志愿队伍，与来犯的士兵在魔法森林空地鏖战，最终艰难取胜。近半数敌兵战死，残余者逃出博丽大结界。\n「这场冲突是幻想乡自建立以来规模最大的一次。」贤者摩多罗 隐岐奈说道。「或许，河城荷取的穿梭机真的已经给幻想乡带来了前所未有的灾难。」当被问及是否有应对之策时，摩多罗 隐岐奈并未作出正面回答。如今，玄武涧仍未发现河城荷取的身影。「我敢笃定，她这次穿越到了镰仓时代的日本列岛。而且很不幸，她所在的地方距离幻想乡极近。」女仆十六夜咲夜如此表示。\n\n诸神，还眷恋着幻想乡吗？■射命丸 文\n\n广告：对于这样的烦恼...妖怪退治、宝物探索、恋爱成就、子孙繁荣?来霧雨魔法店，安心与信赖！#low 请小心前往魔法之森#! \n广告：将最上级的睡眠，献给你……Sweet安眠枕！"
