# ========== 1.6 版本更新日志 ==========
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.6_title: "#t $CHEAT_MENU_TITLE$ v1.6 版本更新说明#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.6_text: "#n 各位好，我是喜儿。#! 夏天真是一个适合出游、晒太阳和更新$CHEAT_MENU_TITLE$的季节呢。喜儿也为各位带来了$CHEAT_MENU_TITLE$ v1.6版本。本次更新添加了大量新内容，以满足1.2和1.3中EU5新机制下玩家们日益增长的各种整活与测试需求。\N\N#p $SAKUYA_MENU_TAB_MILITARY$更新#!\N随着游戏内容的不断扩充与版本迭代日渐成熟，原版的$SAKUYA_ARMY_GENERATOR_TITLE$终于迎来了它的终极完全体。您可以在此$SAKUYA_ARMY_GENERATOR_TITLE$中，自由生成任意数量和类型的$game_concept_army$与$game_concept_navy$。如果在地图上您已经标记了[GetPlayer.GetNameWithNoTooltip]持有的任意$game_concept_location$，则生成的$game_concept_army$会精准降临在此$game_concept_location$；若未标记任何$game_concept_location$，则会默认集结在首都。$game_concept_navy$则会优先使用已标记的己方港口，若无可用港口，则回到首都港口或其他己方港口。此外，$SAKUYA_MENU_TAB_MILITARY$的部分按钮也得到了优化与重构，如$SAKUYA_MIL_BUTTON_SP6$相关调整逻辑，以及$SAKUYA_1_6_MIL_BUTTON_6$、$SAKUYA_1_6_MIL_BUTTON_7$等数值修改。\N\N#p $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$更新#!\N喜儿在另一个Paradox游戏Victoria3中开发了其对应版本的$CHEAT_MENU_TITLE$，并从中积累到了大量宝贵的开发经验。现在，您可以自行选择您想要标记的$game_concept_culture$和$game_concept_religion$，而不仅仅局限于[GetPlayer.GetNameWithNoTooltip]和标记$game_concept_country$的$game_concept_culture$和$game_concept_religion$了！您可根据菜单内指引完成操作。自定义[casus_belli|E]去$SAKUYA_DECLARE_WAR_TITLE$被很多玩家呼吁，因此喜儿这次特意推出了全新的自定义[casus_belli|E]配置功能，无论是玩家对目标$game_concept_country$，还是目标$game_concept_country$对玩家，都能灵活配置。$CHEAT_MENU_BUTTON_TRUST$功能也得到了改善，现在可以自由地修改双边的$CHEAT_MENU_BUTTON_TRUST$了。但受限于Clausewitz不严格匹配这类引擎局限，修改可能不会立即刷新，需要让游戏更新一下相关的状态机后才能看到最新数值。现在$CHEAT_MENU_BUTTON_ANNEX$指定的$game_concept_country$不再有任何惩罚了。EU5 1.2版本推出了$SAKUYA_AI_PERSONALITY_TITLE$，喜儿也因此特意制作了全新的$SAKUYA_AI_PERSONALITY_TITLE$修改专属菜单。现在您可以轻松修改自己$game_concept_country$或者目标$game_concept_country$的$SAKUYA_AI_PERSONALITY_TITLE$。除此之外，还额外新增了$SAKUYA_RELEASE_NON_CORES_BUTTON$、$diplomatic_status_rivals_name$、$CHEAT_MENU_BUTTON_GREAT_POWER_SCORE$和$CHEAT_MENU_BUTTON_CONSOLE_2$的新功能。部分功能如$CHEAT_MENU_BUTTON_ANNEXATION_SPEED$等也得到了修复。\N\N#p $SAKUYA_MENU_TAB_CHARACTER$菜单更新#!\N在1.2版本中，Paradox对$game_concept_trait$做出了诸多修改，额外新增了$sakuya_character_button_Trait_group6_box_TT$组，并疑似增加了诸如$sakuya_character_button_Trait_group7_box_TT$等新的内容。喜儿也为此新增了$game_concept_character$$game_concept_trait$修改功能。但与之前不同的是，$CHEAT_MENU_TITLE$添加的$game_concept_trait$未必能正确工作，很多$game_concept_trait$需要满足特定条件，如$babbling_buffoon$，需要满足标记$game_concept_character$的$game_concept_dip$必须小于80时才可用。具体每个$game_concept_trait$相关参数可以查阅EU5 Wiki网站获取。$SAKUYA_CHAR_BUTTON_29$相关修改现在可用。#low 但为啥不用$SAKUYA_CHAR_BUTTON_15$功能呀...#!另外，在$SAKUYA_MENU_TAB_CHARACTER$菜单中的$SAKUYA_CHAR_BUTTON_18$按钮中，新增了[ShowModifier('timmy_wants_to_play')]和[ShowModifier('byz_born_in_the_purple_modifier')]相关的$game_concept_modifier$。#low 其实[ShowModifier('timmy_wants_to_play')]这个$game_concept_modifier$早在游戏刚发售时，我就添加在了$SAKUYA_MENU_TAB_CHARACTER$菜单右下角那个隐藏菜单里作为彩蛋出现，但后来发现几乎没人关注这个彩蛋...#!。和修改$game_concept_country$的$game_concept_culture$和$game_concept_religion$类似，现在$game_concept_character$也可以修改自定义的$game_concept_culture$和$game_concept_religion$了。$SAKUYA_CHAR_BUTTON_28$功能还是不怎么稳定，个人还是建议大家尽可能别用这功能吧。哦对了，喜儿大幅度优化了$SAKUYA_MENU_TAB_CHARACTER$菜单的生效逻辑，以避免卡顿。但代价是，如果您频繁切换标记$game_concept_character$状态，可能需要退出重进一下$CHEAT_MENU_TITLE$或者切换到其他页面再回到$SAKUYA_MENU_TAB_CHARACTER$菜单才能刷新状态。\N\N#p $SAKUYA_LOC_TITLE$更新#!\N千呼万唤始出来！喜儿研究了很久如何实现对$game_concept_building$的修改，一直都没有头绪。喜儿开发完Victoria3$CHEAT_MENU_TITLE$后，终于触类旁通，彻底攻克了这一底层难题。在GUI的布局设计上，我参考了成熟的前作经验，塞入了伪滑杆和动态数据容器等操控元件，以实现无缝的交互体验。现在，您可以给您治下的任意$game_concept_location$添加$game_concept_building$。$game_concept_building$种类极多，喜儿也根据$game_concept_building$类型粗略地划分，方便快速归类。您不仅可以一键添加任意数量的$game_concept_building$，也可以随时清理$game_concept_building$。不过一键清理$estate_category$的功能目前存在一定的技术难题，还需要一定时间去实现。此外，$SAKUYA_1_6_LOC_POPGEN_TITLE$和$SAKUYA_1_6_LOC_POPEDIT_TITLE$也会随本次版本一同上线。$SAKUYA_1_6_LOC_POPGEN_TITLE$可以先选择$SAKUYA_1_6_LOC_POPGEN_AMOUNT$、$SAKUYA_1_6_LOC_POPGEN_CLASS$、$game_concept_culture$与$game_concept_religion$，再把新增$game_concept_population$生成到已标记的$game_concept_location$。$SAKUYA_1_6_LOC_POPEDIT_TITLE$则用于批量处理现有$game_concept_population$，可以选择全部$game_concept_population$或指定$game_concept_pop_type$，再按比例对已标记$game_concept_location$或全国执行$SAKUYA_1_6_LOC_POPEDIT_ASSIM_PANEL$与$SAKUYA_1_6_LOC_POPEDIT_CONV_PANEL$。这部分也支持我国、目标$game_concept_country$以及已标记的$game_concept_culture$、$game_concept_religion$，方便您把新增与既有$game_concept_population$都整理到想要的方向。\N\N#p 其他#!\N背景系统也补充了新的内容，新增$SAKUYA_BTN9_SETTING_11$与$SAKUYA_BTN9_SETTING_12$等背景选择。关于页面的兼容性说明已经同步改写，不再沿用旧版必须覆盖gui/message_log.gui的提示；$CHEAT_MENU_TITLE$在1.6及以后版本不再占用游戏的系统GUI文件，理论上与其他UI类MOD的冲突会少很多。但因为现在改用共享注册入口接入，请记得检查前置需求是否正常加载。本次还整理了1.6新增系统的多语言本地化文件，为后续翻译和维护留出更清晰的空间。"

# ========== 1.5 版本更新日志 ==========
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_title: "#t $CHEAT_MENU_TITLE$ v1.5 版本更新说明#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_text: "#n 2026年新年快乐！#! 喜儿在此祝愿各位新的一年诸事顺利。现在，请允许我向您介绍本次更新的内容。这次更新旨在完成从单纯满足功能需求，到实现极致体验、持久稳定与可持续扩展的转变。本次更新的核心在于把能用升级成好用。旧版本$CHEAT_MENU_TAB_MAIN$在拓展性上存在局限，且对非中英文环境的用户体验不够友好，因此1.5版本对$CHEAT_MENU_TAB_MAIN$进行了彻底重做。新的分类逻辑更加清晰，结构更具延展性，本地化适配也更为完善。你会明显感觉到功能完整保留，但操作路径更加直观，不再容易迷路。\N\N#p $SAKUYA_TEST_BTN_6$和$CHEAT_MENU_MARK_LEADER$相关#!\N现在可以直接$CHEAT_MENU_SWITCH_COUNTRY$到已标记的国家，立刻把玩家控制权切到目标国家身上。$CHEAT_MENU_MARK_LEADER$不再只能标记玩家国内的角色，你可以直接对其他国家进行角色定位与标记，包括该国的领导人、摄政、继承人以及配偶等关键目标。同时也强调一点：部分功能需要$offer_sakuya_mark_country_cta_to_unknown$ + $CHEAT_MENU_MARK_LEADER$两者配合使用。现在可以更自由地操控国家在战争层面的行为，你可以自由地操控目标国家的战争，也可以让目标国家以对手/盟友的身份加入你得战争。另外新增了$SAKUYA_BANKRUPTCY_BUTTON$相关操作。为了简化外交流程，新增的快捷功能允许你批量改善邻国、同宗教国家甚至整个神圣罗马帝国成员的关系。$CHEAT_MENU_BUTTON_CONSOLE_2$的解除方式也进行了优化，现在支持按区域点亮地图，例如仅解除东亚或欧洲的迷雾。\N现在你可以随意改写$SAKUYA_MENU_TAB_CHARACTER$与玩家统治者之间的血缘关系，例如将其设定为您的$SAKUYA_CHAR_BUTTON_19$。新增的$SAKUYA_CHAR_BUTTON_21$功能允许您将$SAKUYA_MENU_TAB_CHARACTER$确立为本国或目标国家的法定继承人，从而实现对权力交接的强制干预。此外，$SAKUYA_CHAR_BUTTON_22$功能也更加灵活，支持将被标记的$SAKUYA_MENU_TAB_CHARACTER$直接扶植为本国统治者，或将其推上标记国家的王座。\N\N#p $SAKUYA_LOC_TITLE$相关#!\N$CHEAT_MENU_TITLE$极大地丰富了对$game_concept_location$和$game_concept_province$的微调能力。现在你可以通过Ctrl和Shift组合键来精细或大幅调整$SAKUYA_LOC_MOD_DEVELOPMENT$与$SAKUYA_LOC_MOD_PROSPERITY$。全游戏五十二种$SAKUYA_LOC_PRODUCT_TOGGLE$，从基础的煤铁粮棉到昂贵的丝绸黄金，现在皆可一键转换。此外，新增了针对$city$、$town$与$rural_settlement$等级的直接修改功能，以及对食物储备的快速干预手段。$SAKUYA_LOC_INSTITUTION_TOGGLE$系统目前不是很理想，先暂时将就上线。\N\N#p $CHEAT_MENU_CATEGORY_ADMIN$、$TAB_TOOLTIP_SOCIETY_TITLE$和$SUBTAB_GOVERNMENT_VALUES$相关#!\N现在能够修改$ENCYCLOPEDIA_PAGE_COUNTRY_RANKS$了。对于$game_concept_estates$，您现在只需要选择对应的$game_concept_estates$，就可以更改满意度、$SAKUYA_ESTATE_POWER_BTN$、$SAKUYA_ESTATE_TAX_BTN$、叛乱和金钱。如果您选择了王权$game_concept_estates$，将额外可以修改改革槽位数量。对于$AUTOMATED_SYSTEM_CABINET$与$game_concept_parliament$，$CHEAT_MENU_TITLE$为各位提供了大量修改选项，包括调整$CHEAT_MENU_BUTTON_CABINET_EFFICIENCY$、削减$SAKUYA_BUTTON_CABINET_COSTS$、修改$SAKUYA_BUTTON_PARLIAMENT_DURATION$以及通过$SAKUYA_BUTTON_CABINET_ACTIONS$来重新分配国家重心。我们为天主教、东正教、伊斯兰教及东方宗教提供了专属定制功能。你可以尝试请求$request_cardinal_seat$、调整$POLICY_BIAS_REFORM_DESIRE$、召开$orthodox_synod$，或者调整$mysticism_vs_jurisprudence$的倾向，甚至可以直接修改$karma$与$harmony$。现在$SUBTAB_GOVERNMENT_VALUES$能够直接修改了。个别$SUBTAB_GOVERNMENT_VALUES$如汉化VS去汉化暂时还没上线。"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.4_title: "#t $CHEAT_MENU_TITLE$ v1.4 版本更新说明#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.4_text: "大家好，这里是喜儿。本次更新重点推出了全新的$SAKUYA_LOC_TITLE$系统。这是一个旨在让您能精确或批量管理领土的强大工具。\N\N#p $SAKUYA_LOC_TITLE$系统上线#!\N现在您可以选择不同的标记模式来管理您的领土。如果您希望对特定地点进行精细操作，可以使用$SAKUYA_LOC_LOCATION_MODE_BUTTON$；如果您拥有庞大的领土（例如拥有超过50个省份），为了避免卡顿，强烈建议使用$SAKUYA_LOC_PROVINCE_MODE_BUTTON$。标记完成后，您可以利用$SAKUYA_LOC_TAB_HOME$的快捷按钮，一键对所有标记地区执行$SAKUYA_LOC_HOME_BUTTON_1$、$SAKUYA_LOC_HOME_BUTTON_2$、拉满$SAKUYA_LOC_HOME_BUTTON_3$或调整$SAKUYA_LOC_HOME_BUTTON_4$。此外，还新增了$SAKUYA_BETA_MARK_ALL_BUTTON$与$SAKUYA_BETA_UNMARK_ALL_BUTTON$功能，方便您快速接管整个国家。\N\N#p $SAKUYA_LOC_TAB_POP$与$SAKUYA_LOC_TAB_MOD$#!\N在$SAKUYA_LOC_TAB_POP$页面，您可以向标记地区批量添加特定阶层的人口，无论是$SAKUYA_LOC_POP_LABORERS$、$SAKUYA_LOC_POP_NOBLES$还是$SAKUYA_LOC_POP_SOLDIERS$，只需点击即可生成。而在$SAKUYA_LOC_TAB_MOD$页面，喜儿为您准备了三大类海量的修正选项，涵盖从$SAKUYA_LOC_MOD_POP_GROWTH$、$SAKUYA_LOC_MOD_DEVELOPMENT$到$SAKUYA_LOC_MOD_DEFENSIVENESS$与$SAKUYA_LOC_MOD_SUPPLY_LIMIT$等数十项数值的微调。您甚至可以直接修改$SAKUYA_LOC_MOD_FORT_LEVEL$或$SAKUYA_LOC_MOD_MAX_ATTRITION$来打造坚不可摧的要塞。"
