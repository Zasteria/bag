SAKUYA_CHEAT_MENU_ABOUT_TEXT: "#P 感谢您使用$CHEAT_MENU_TITLE$！#!\N遇到您真是一件高兴的事情呢。我是喜儿，一名来自北京，现居住在捷克共和国的开发者。如果您有任何问题，请使用手机扫码加入QQ群或者Discord群组联系我。如果您想支持一下喜儿，您可以在steam的创意工坊给喜儿一个点数礼物，或者扫描上方$SAKUYA_TEST_BTN_9_TAB_3_TEXT_3$链接打赏~\n本MOD完全免费，如您通过任何付费渠道获得的此MOD，请立即举报，喜儿在此感激不尽！"
