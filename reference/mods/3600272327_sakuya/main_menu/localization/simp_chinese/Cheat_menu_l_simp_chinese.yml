SAKUYA_CHAR_BUTTON_10: "$game_concept_fertility$"
SAKUYA_CHAR_TT_10: "#t $game_concept_fertility$与怀孕#!\n#p 左键：#!提高 50%$game_concept_fertility$\n#p Shift+左键：#!提高 500000%$game_concept_fertility$\n#n 右键：#!降低 50%$game_concept_fertility$\n#n Shift+右键：#!降低 500000%$game_concept_fertility$\n#l Ctrl+左键：#!清除$game_concept_fertility$相关修正\n#t Ctrl+右键：#!#COLOR:{1,0.4,0} 尝试让选中的角色怀孕#!\n#low 我没找到能显示角色是否怀孕的GUI，因此我无法判断一个角色是否怀孕。如果目标角色是女性未结婚却怀孕了，永远不要好奇在代码层是怎么实现的。#!\n还有，永远！永远不要让男性角色怀孕，尤其是自己和自己（还是男性）怀孕！根据已经提交的反馈，自交会导致[GetPlayer.GetGovernment.GetRuler.GetName]#x 怀着一个恶魔之子#!，然后你的存档会出现#COLOR:{1,0,0,1} 不可逆的损坏！#!具体表现为：全世界所有的$SAKUYA_MENU_TAB_CHARACTER$都将无法怀孕或者无法让怀孕的孩子诞生。#!"

