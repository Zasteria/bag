sakuya_maid_fairy: "红魔馆女仆妖精"
sakuya_maid_fairy_desc: "来自幻想乡红魔馆的妖精女仆，她们在十六夜咲夜的指挥下懒懒闲闲地工作。虽然经常犯错，但永远保持着乐观的态度。"
sakuya_gensokyo_group: "幻想乡"
sakuya_gensokyo_language: "江户时代日语"
sakuya_gensokyo_group_desc: "藏在博丽大结界背后，人与妖怪的隐秘世界。外面的人想进来，里面的人想出去。啊，地上人与结界彼岸的幻想乡...但愿能在三途川的桥头瞥一眼那幻想的世界吧。这里是诸神眷恋的乐园，也是恶煞舞爪的战场。"
sakuya_gensokyo_language_desc: "从障碍之民和诸位贤者建立幻想乡后，人间之里的语言就一直定格在了江户时代。虽说外界的日语也能过来交流，但是乡民和妖怪们往往惊讶于外界日语的奇怪语音和莫名其妙的外来借词，只有少数有能力的角色能通过各种手段了解外界的词汇。"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_title: "#T $CHEAT_MENU_TITLE$ v1.5累积更新说明#!"
SAKUYA_CHEAT_MENU_UPDATE_LOG_TEXT_1.5_LS_text: "#p $CHEAT_MENU_TITLE$ v1.5.4 版本说明#!\n各位好。在Paradox经历了长达四个月的维护与修缮后，游戏终于迎来了首个迭代版本，喜儿也为大家带来了全新的累积更新。\n本次更新新增了对$complacency$的支持，您可以在常用功能菜单中下滑找到相应的修改。同时，结合社群反馈，现在当您试图为领土添加奴隶人口时，奴隶的文化将变更为咲夜自身的文化，而非玩家国家的文化。\n在$SAKUYA_TEST_BTN_8$板块中，喜儿为您新增了3个快捷选项，以便在不标记省份的前提下实现快速修改。现在，您可以重新为$game_concept_dynasty$命名了。但由于游戏并未内置预留接口，重命名只能通过创建新的$game_concept_dynasty$来实现，且疑似存在少量不稳定的bug，还请谨慎使用。此外，根据大家的留言反馈，喜儿修正了十多处错误并对部分界面进行了优化，希望各位能够喜欢这个版本。\N为了解决标记国家、地区及外国角色时步骤繁琐的问题，喜儿现推出拓展MOD#COLOR:{1,0.8,0.5,1} $SAKUYA_AFTERBURNER$#!。订阅后，您将不再受限于原版复杂的外交距离与繁冗的系统设定。只需简单的右键点击，即可无视绝大多数常规限制，一步到位完成目标标记。但需注意，此MOD会破坏与其他修改了UI的MOD的兼容性，因此它将作为需要额外订阅的独立MOD，并未直接集成在$CHEAT_MENU_TITLE$中。\n\n#p $CHEAT_MENU_TITLE$ v1.5.3 版本说明#!\n转眼间就来到了2月了呢。$CHEAT_MENU_TITLE$现已更新至1.5.3版本。在本次更新中，喜儿为各位带来了强大的修改文化好感度功能，现在您可以精确调整不同文化间的关系，无论是标记国还是本国主流与接纳文化之间。针对角色互动，新增了出身与宗族调整，可以将角色设为平民或加入统治者宗族；同时支持角色迁移功能，将标记角色（除统治者外）转移至您或其他国家。大家期待的角色重命名也上线了，名字和绰号任您修改。新增Shift+左键批量吞并附属国的功能，省时省力。\n在修复与优化方面，喜儿修复了军事菜单按钮逻辑、7个阶层配置错误以及主菜单GUI显示问题。对于从Victoria3移植的旧指令与函数也进行了清理，阶层金钱操作的右键失效问题也已解决。界面上，调整了按钮间距与文本样式，标记外国角色的按钮变得更加醒目，并补充了角色相关说明与本地化微调。\n遇到您真是一件幸福的事情呢，让我们在下一个版本再次相遇。喜儿提前为您拜个早年，祝您马到成功！\n\n#p $CHEAT_MENU_TITLE$ v1.5.2 版本说明#!\n不知道各位对全新版本的$CHEAT_MENU_TITLE$感觉如何？今天喜儿为各位带来了新的更新。根据社群反馈，在首页-社会选项卡中，部分宗教疑似会导致GUI排版发生错乱。喜儿调整了写法，现在应该能正常工作了。本次喜儿为各位带来了全新的功能：修改国家名称。现在，只需要标记任意国家就可以修改其名称了。您也可以选择修改自己国家的名称。现在，外交界面个别按钮和布局出现了调整，并新增了标记国家相关的提示。\n\n#p $CHEAT_MENU_TITLE$ v1.5.1 版本更新#!\n各位好。喜儿本次为各位带来$CHEAT_MENU_TITLE$1.5版本的首次更新。在本次更新中，喜儿修复了怀孕对象错误的问题。同时修正了英语在部分界面中本地键丢失的问题。同时应社群反馈，本次更新将原来的疾病免疫相关功能重新加回了。另外，从现在开始您可以修改选定角色的信仰、文化，改成与您国家或者目标国家相同的文化信仰。"
