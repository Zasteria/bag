 # 公开文本
 CHEAT_MENU_TEST_TEXT_1: "#p 欢迎#!\n很高兴与大家见面。我是喜儿，是维多利亚3 喜儿修改器的开发者。很高兴在欧陆风云与大家再次见面。#n QQ群：#!734267077，快来玩呀！ \n\n#p 测试功能：$SAKUYA_LOC_TITLE$已推出！#!\n点击下方的按钮即可打开新的菜单。只需要标记地点和省份，就可以修改人口和修正等内容啦！记得#n 必须选择至少一个地点去修改#!，或者干脆修改整个国家。\n\n#p $CHEAT_MENU_TITLE$更新至1.3版本！#!\n这次喜儿为大家带来了关于军事方面的相关更新。新增五十多项可调节功能，并且修复了若干bug。点击军事页面的右上角按钮可以开启作弊级的修正，具体数值您可以打开#l $GOV_TAB$#!面板查看。#!"
 CHEAT_MENU_TEST_TEXT_2: "#p 不知道您认为这个修改器如何？#!\n我连续开发了12小时。与维多利亚3相比，欧陆风云 V的引擎看似和前几作一致，实则不然。我不知道各位对欧陆风云五怎么评价，我个人认为机制是不是有点太多了？但如果各位玩的开心，在下也就知足了。遇到您真是一件幸福的事情呢。\n对了，对游戏机制感兴趣的玩家可能会发现，这个修改器是由控制台驱动的。我个人很不喜欢使用控制台，因为控制台会导致大量兼容性难题。但我研究了很久也没能解决...所以目前来说这只是权宜之计。Anyway，祝大家玩的开心！"

