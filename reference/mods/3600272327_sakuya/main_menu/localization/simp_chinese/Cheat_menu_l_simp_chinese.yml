SAKUYA_CHAR_KOISHI_TT: "#t 我该如何标记角色？#!\n\n#p 如果目标角色就在你的国内（比如 [GetPlayer.GetNameWithNoTooltip]）...#!\n只需点击角色打开界面，或右键点击头像，选择 #l $sakuya_select_chosen_one$#! 即可。若要取消标记，请重新进入角色界面刷新一下，点击 #l $sakuya_deselect_chosen_one$#! 就行。\n您也可以使用#l $SAKUYA_AFTERBURNER$#!来更方便地标记国内外的角色。$SAKUYA_AFTERBURNER$可以在steam创意工坊或者discord频道获取。\n\n#p 如果目标角色不在 [GetPlayer.GetNameWithNoTooltip]？#!\n你需要#white 先标记#!该角色所在的#x 国家#!，随后在 $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$ 菜单中使用 #T $CHEAT_MENU_MARK_LEADER$#!。目前支持标记统治者、配偶、继承人或摄政。当图标消失时，即代表标记成功。\n\n#p 找不到 $sakuya_select_chosen_one$ 选项？#!\n在某些特殊情况下（如$SWE$），你本国的统治者开局可能不在国内。这时请先确认角色的当前位置，并标记其所在的国家。\n\n#p 如何取消标记？#!\n随便标记一名国内角色，然后点击 #l $sakuya_deselect_chosen_one$#! 即可。无论目标角色在国外还是已经去世，这种方法都有效。\n\n#t $game_concept_trait$说明#!\n\n#p 部分$game_concept_trait$需要满足特定条件才能添加。#!如#n $babbling_buffoon$#!，需要$game_concept_dip$低于80时才能添加。每个$game_concept_trait$的具体要求可查阅EU5 Wiki。"
