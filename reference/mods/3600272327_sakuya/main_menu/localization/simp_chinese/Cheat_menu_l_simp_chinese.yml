 CHEAT_MENU_OPINION_ICON_TOOLTIP: "[GetPlayer.Custom('sakuya_mark_country_status')]\n\n #!\n #p 如何标记国家？#!#N \n您需要先点击对应国家，打开该国外交面板，然后在$DIP_TAB$面板中，依次选择：$TAB_TOOLTIP_ARMY_ACTIONS_TITLE$ → $CUSTOM_SEARCH_FILTER_DIPLO_ACCESS_CAT_NAME$，找到#L $offer_sakuya_mark_country$#!并点击，即可完成标记。\n\n#T 标记的本质#!：标记动作会与目标国家建立一种特殊外交关系（用于行为绑定与变量赋值）。因此，如果您的$game_concept_diplomat$数量不足，或目标超出$game_concept_diplomatic_range$限制，您需要先满足这些条件后才能标记。#!\n\n#p 如何取消标记？#!#N \n标记效果持续3个月，时间到了会自动失效；但该特殊外交关系会保留。是否取消这段外交关系都无所谓，完全取决于您。\n\n如果您希望提前结束标记效果：只需要提前取消与该国的#l $offer_sakuya_mark_country$#!外交关系，标记会立即结束；结束后您可以随时再标记其他国家。#!\n\n#p 我没有看到取消标记的位置？#!#N \n这并非您的错误。受限于引擎限制，外交动作列表不会立即刷新，您需要退出外交菜单，再重新进入。\n\n重新进入后，您应该会看到#l $offer_sakuya_mark_country$#!变成了#l $cancel_sakuya_mark_country$#!，此时点击取消即可。同样的问题在标记角色时也会发生。#!\n\n#T 重要说明#!：对国家的标记与外交动作本身无直接关系，它只是行为绑定以方便给予变量。无论您是否取消标记，标记效果永远只有3个月，因为这是为了避免出现各种错误而刻意如此设计的。#!\n#low 那个外交关系无任何效果，也不会自动取消，喜儿也建议您不要搭理，需要再标记此国时再取消也不迟。#!"
