<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>精灵图工具</title>
    <style>
        :root { --primary: #007AFF; --danger: #ff3b30; --bg: #1a1a1a; --panel: #262626; --text: #f0f0f0; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { padding: 12px 20px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        main { display: flex; flex: 1; overflow: hidden; }
        
        /* 侧边栏 */
        .sidebar { width: 380px; background: var(--panel); padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
        .section { margin-bottom: 24px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        h3 { margin: 0 0 15px; color: var(--primary); font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 素材列表 */
        #imageList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .img-item { position: relative; border: 2px solid #444; border-radius: 6px; aspect-ratio: 1; cursor: grab; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #111; }
        .img-item::before { content: attr(data-id); position: absolute; top: -5px; left: -5px; background: var(--primary); color: white; font-size: 12px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .del-btn { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; cursor: pointer; font-size: 14px; border: 1px solid white; display: none; }
        .img-item:hover .del-btn { display: block; }
        
        /* 表单控件 */
        label { display: block; margin: 10px 0 5px; font-size: 13px; color: #bbb; }
        .info-tip { font-size: 12px; color: #888; margin-bottom: 5px; }
        .error-tip { color: var(--danger); font-size: 12px; margin-top: 5px; display: none; }
        input, select, textarea { width: 100%; background: #333; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        textarea { font-family: monospace; resize: vertical; }
        
        /* 状态显示 */
        .stat-bar { background: #111; padding: 5px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; color: var(--primary); }

        /* 画布区 */
        .viewport { flex: 1; display: flex; flex-direction: column; background: #0f0f0f; position: relative; }
        .canvas-container { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 50px; }
        canvas { background-image: 
            linear-gradient(45deg, #1d1d1d 25%, transparent 25%), linear-gradient(-45deg, #1d1d1d 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #1d1d1d 75%), linear-gradient(-45deg, transparent 75%, #1d1d1d 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }

        /* 预览窗口 */
        .anim-preview-box { position: absolute; bottom: 25px; right: 25px; width: 180px; height: 210px; background: #222; border: 2px solid var(--primary); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.secondary { background: #444; margin-left: 8px; }
        button:hover { filter: brightness(1.1); }
        
        .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 8px 0; }
        .toggle-row input { width: auto; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 18px;">✨ 精灵图大师 <span style="font-size: 12px; color: #666; font-weight: normal;">喜儿拷打Gemini做的</span></div>
    <div>
        <button onclick="generateSpriteSheet()">更新预览</button>
        <button class="secondary" onclick="downloadPNG()">下载 PNG图片</button>
        <button class="secondary" onclick="exportJSON()">到处 JSON配置</button>
    </div>
</header>

<main>
    <div class="sidebar">
        <div class="section">
            <h3>素材管理 <button style="padding:2px 8px; font-size:11px;" onclick="clearAll()">清空</button></h3>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
            <div id="imageList" style="margin-top:15px;"></div>
        </div>

        <div class="section">
            <h3>生成设置</h3>
            <div class="stat-bar" id="statBar">当前状态：等待素材上传...</div>
            <label>序列定义 (支持逗号 , 或句号 . 区分)</label>
            <textarea id="frameSequence" rows="3" oninput="validateSequence()" placeholder="如：1,1,2,3..."></textarea>
            <div id="errorMsg" class="error-tip">⚠️ 序列中包含不存在的素材编号！</div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
                <div>
                    <label>单帧宽度 (px)</label>
                    <input type="number" id="frameW" value="128">
                </div>
                <div>
                    <label>单帧高度 (px)</label>
                    <input type="number" id="frameH" value="128">
                </div>
            </div>

            <label>图片适配方式</label>
            <select id="fitMode">
                <option value="contain">等比缩放 (Contain)</option>
                <option value="cover">填充覆盖 (Cover)</option>
                <option value="stretch">强制拉伸</option>
                <option value="center">居中不缩放</option>
            </select>

            <div class="toggle-row">
                <span title="开启后会产生轮空，但图片更接近正方形">尽可能正方形 (允许轮空)</span>
                <input type="checkbox" id="preferSquare">
            </div>
            
            <label>外扩间距 (0-10px)</label>
            <input type="number" id="padding" value="0" min="0" max="10">
        </div>

        <div class="section">
            <h3>实时预览控制</h3>
            <div class="toggle-row">
                <span>显示网格辅助线 (不输出)</span>
                <input type="checkbox" id="showGrid" checked onchange="draw()">
            </div>
            <div class="toggle-row">
                <span>洋葱皮模式 (显示前一帧)</span>
                <input type="checkbox" id="onionSkin">
            </div>
            <label>播放速度 (FPS: <span id="fpsVal">12</span>)</label>
            <input type="range" id="fps" min="1" max="60" value="12" oninput="document.getElementById('fpsVal').innerText=this.value">
        </div>
    </div>

    <div class="viewport">
        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>
        <div class="anim-preview-box">
            <div style="font-size:11px; padding:5px; background:#111; text-align:center;">动态循环预览</div>
            <canvas id="animCanvas" style="flex:1; width:100%; image-rendering: pixelated;"></canvas>
        </div>
    </div>
</main>

<script>
    let sourceImages = []; 
    let sequence = [];
    let currentLayout = { x: 1, y: 1 };

    // --- 1. 素材处理 ---
    function handleFiles(files) {
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    sourceImages.push({ img, id: 0 });
                    reIndex();
                    updateUI();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
        document.getElementById('fileInput').value = '';
    }

    function reIndex() {
        sourceImages.forEach((item, i) => item.id = i + 1);
    }

    function updateUI() {
        const list = document.getElementById('imageList');
        list.innerHTML = '';
        sourceImages.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'img-item';
            div.setAttribute('data-id', item.id);
            div.style.backgroundImage = `url(${item.img.src})`;
            div.draggable = true;
            div.ondragstart = (e) => e.dataTransfer.setData('idx', i);
            div.ondrop = (e) => {
                const from = e.dataTransfer.getData('idx');
                const temp = sourceImages[from];
                sourceImages.splice(from, 1);
                sourceImages.splice(i, 0, temp);
                reIndex(); updateUI();
            };
            div.ondragover = e => e.preventDefault();
            
            const btn = document.createElement('div');
            btn.className = 'del-btn';
            btn.innerHTML = '×';
            btn.onclick = (e) => { e.stopPropagation(); sourceImages.splice(i, 1); reIndex(); updateUI(); };
            div.appendChild(btn);
            list.appendChild(div);
        });
        validateSequence();
    }

    // --- 2. 逻辑算法 ---
    function validateSequence() {
        const str = document.getElementById('frameSequence').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const statBar = document.getElementById('statBar');
        
        if (!str) {
            sequence = sourceImages.map(m => m.id);
        } else {
            sequence = str.split(/[.,]/).map(s => s.trim()).filter(s => s !== "").map(s => parseInt(s));
        }

        const invalidIds = sequence.filter(id => !sourceImages.find(m => m.id === id));
        errorMsg.style.display = (invalidIds.length > 0) ? 'block' : 'none';
        
        statBar.innerText = `序列统计：共 ${sequence.length} 帧素材`;
    }

    function calculateLayout(n) {
        const preferSquare = document.getElementById('preferSquare').checked;
        
        // 方案 A: 寻找所有合数因子，找到最接近正方形且不轮空的
        let bestX = n, bestY = 1;
        let minDiff = n;

        for (let i = 1; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
                let x = n / i;
                let y = i;
                if (x >= y && (x - y) < minDiff) {
                    minDiff = x - y;
                    bestX = x;
                    bestY = y;
                }
            }
        }

        // 判定：如果差距超过2倍且 X, Y >= 3
        const needsRebalance = (bestX >= 3 && bestY >= 3 && (bestX / bestY > 2));

        if (preferSquare || needsRebalance) {
            // 方案 B: 强制向平方根靠拢，允许轮空
            let sqX = Math.ceil(Math.sqrt(n));
            let sqY = Math.ceil(n / sqX);
            // 确保 X >= Y
            if (sqY > sqX) [sqX, sqY] = [sqY, sqX];
            return { x: sqX, y: sqY };
        }

        return { x: bestX, y: bestY };
    }

    // --- 3. 核心绘图 ---
    function generateSpriteSheet() {
        validateSequence();
        if (sequence.length === 0) return alert("请上传图片！");
        const layout = calculateLayout(sequence.length);
        currentLayout = layout;
        draw();
    }

    function draw(isExport = false) {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const fw = parseInt(document.getElementById('frameW').value) || 128;
        const fh = parseInt(document.getElementById('frameH').value) || 128;
        const p = parseInt(document.getElementById('padding').value) || 0;
        const fit = document.getElementById('fitMode').value;
        const showGrid = document.getElementById('showGrid').checked && !isExport;

        canvas.width = currentLayout.x * (fw + p) + p;
        canvas.height = currentLayout.y * (fh + p) + p;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        sequence.forEach((sid, i) => {
            const col = i % currentLayout.x;
            const row = Math.floor(i / currentLayout.x);
            const dx = col * (fw + p) + p;
            const dy = row * (fh + p) + p;

            const target = sourceImages.find(m => m.id === sid);
            if (target) {
                renderImage(ctx, target.img, dx, dy, fw, fh, fit);
            }

            if (showGrid) {
                ctx.strokeStyle = "rgba(255, 235, 59, 0.5)";
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(dx, dy, fw, fh);
                ctx.setLineDash([]);
            }
        });
    }

    function renderImage(ctx, img, x, y, w, h, mode) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        
        let dw = w, dh = h, dx = x, dy = y;
        const sRatio = img.width / img.height;
        const tRatio = w / h;

        if (mode === 'contain') {
            if (sRatio > tRatio) { dw = w; dh = w / sRatio; } 
            else { dh = h; dw = h * sRatio; }
        } else if (mode === 'cover') {
            if (sRatio > tRatio) { dh = h; dw = h * sRatio; }
            else { dw = w; dh = w / sRatio; }
        } else if (mode === 'center') {
            dw = img.width; dh = img.height;
        }
        
        if (mode !== 'stretch') {
            dx = x + (w - dw) / 2;
            dy = y + (h - dh) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
    }

    // --- 4. 预览与导出 ---
    let animFrame = 0;
    let lastTime = 0;
    function loop(t) {
        const fps = parseInt(document.getElementById('fps').value);
        if (t - lastTime > 1000 / fps) {
            const ac = document.getElementById('animCanvas');
            const actx = ac.getContext('2d');
            const fw = parseInt(document.getElementById('frameW').value) || 128;
            const fh = parseInt(document.getElementById('frameH').value) || 128;
            const p = parseInt(document.getElementById('padding').value) || 0;

            ac.width = fw; ac.height = fh;
            actx.clearRect(0, 0, fw, fh);

            if (sequence.length > 0) {
                if (document.getElementById('onionSkin').checked) {
                    const prev = (animFrame - 1 + sequence.length) % sequence.length;
                    drawFrameTo(actx, prev, fw, fh, p, 0.2);
                }
                drawFrameTo(actx, animFrame, fw, fh, p, 1.0);
                animFrame = (animFrame + 1) % sequence.length;
            }
            lastTime = t;
        }
        requestAnimationFrame(loop);
    }

    function drawFrameTo(ctx, idx, fw, fh, p, alpha) {
        const col = idx % currentLayout.x;
        const row = Math.floor(idx / currentLayout.x);
        ctx.globalAlpha = alpha;
        ctx.drawImage(document.getElementById('mainCanvas'), col*(fw+p)+p, row*(fh+p)+p, fw, fh, 0, 0, fw, fh);
    }

    function downloadPNG() {
        draw(true); // 强制不带网格重绘
        const link = document.createElement('a');
        link.download = `精灵图_${Date.now()}.png`;
        link.href = document.getElementById('mainCanvas').toDataURL("image/png");
        link.click();
        setTimeout(draw, 100); // 恢复带网格的预览
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify({ sequence, layout: currentLayout }, null, 2)], {type:'application/json'});
        const link = document.createElement('a');
        link.download = 'config.json';
        link.href = URL.createObjectURL(blob);
        link.click();
    }

    function clearAll() { if(confirm("确定清空？")) { sourceImages=[]; updateUI(); } }

    requestAnimationFrame(loop);
</script>
</body>
</html>
