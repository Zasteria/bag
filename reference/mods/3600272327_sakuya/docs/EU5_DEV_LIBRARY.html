<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU5 MOD 开发者词典（人工撰写索引 · 单文件）</title>
<style>
  /* CSS 仅点缀，JS 才是重点 */
  :root{--bg:#0f1115;--panel:#161a22;--muted:#8a94a7;--text:#e7ecf3;--accent:#7aa2f7;--border:#252a34;--code:#0b0e14;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#12151c,#10131a)}
  h1{margin:0;font-size:16px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  input[type="text"]{flex:1;min-width:320px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text)}
  .btn{background:#1b2130;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer}
  .btn[aria-pressed="true"]{outline:2px solid var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:#1b2130;border:1px solid var(--border);border-radius:999px;padding:6px 10px;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{outline:1px solid var(--accent);background:#1a2434}
  main{display:grid;grid-template-columns:360px 1fr;height:100%;min-height:0}
  .left{border-right:1px solid var(--border);overflow:auto}
  .right{overflow:auto}
  .result{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
  .result:hover{background:#141925}
  .muted{color:var(--muted);font-size:12px}
  .entry{padding:16px 20px;max-width:1100px}
  pre,code{font-family:ui-monospace,Menlo,Consolas,monospace}
  pre{background:var(--code);border:1px solid var(--border);padding:10px 12px;border-radius:8px;overflow:auto}
  .pill{border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted);font-size:12px;margin-left:8px}
  .hr{height:1px;background:var(--border);margin:10px 0 14px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>EU5 MOD 开发者词典 <span class="pill">人工撰写索引</span></h1>
    <div class="row">
      <input id="q" type="text" placeholder="搜索（AND / OR / -排除；字段：type:key|event|component|group；parent:；re:true=正则）">
      <button class="btn" id="btnSearch">搜索</button>
      <button class="btn" id="btnClear">清空</button>
      <button class="btn" id="btnRegex" aria-pressed="false">Regex</button>
      <button class="btn" id="btnHelp">帮助</button>
    </div>
    <div class="row">
      <div class="chips">
        <div class="chip" data-kind="Key" aria-pressed="true">键</div>
        <div class="chip" data-kind="Event" aria-pressed="true">事件</div>
        <div class="chip" data-kind="Component" aria-pressed="true">组件</div>
        <div class="chip" data-kind="Group" aria-pressed="true">元父级</div>
      </div>
    </div>
  </header>

  <main>
    <section class="left">
      <div id="results"></div>
    </section>
    <section class="right">
      <div class="entry" id="entry"><div class="muted">输入关键词然后点击“搜索”；或直接点击左侧词条。</div></div>
    </section>
  </main>
</div>

<script id="DATA" type="application/json">{"entries": [{"id": "gui", "name": "GUI", "kind": "Group", "group": "GUI", "parents": ["GUI"], "section": null, "description": "图形库的总入口。所有 `Component`、`Key` 与 `Event` 条目都收录在 GUI 组里，你可以用搜索框按 `type:` 或 `parent:` 过滤，也可以直接点开结果页中的 `icon` 等名词链接跳转。\n\n词条本身不提供代码，而是告诉你：所有示例都默认运行在 EU5 `widget` 脚本上下文，和实际 UI 文件完全一致；只要把示例块粘到你自己的 `.gui` 文件内即可运行。", "examples": [{"language": "gui", "code": "widget = {\n    size = { 320 80 }  # 设置控件宽高，支持像素/百分比/-1\n    background = { using = bg_round_corners_alt_texture }  # 渲染在控件背后的背景层\n    hbox = {  # 横向容器，布置子控件\n        spacing = 10  # 容器子元素间距\n        icon = { texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\" size = { 32 32 } }  # 嵌套的 icon，用作额外装饰\n        text_single = { text = \"GUI 文档示例\" align = left|center }  # 文本组件，用于显示一行文字\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": []}, {"id": "icon", "name": "icon", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`icon` 是 EU5 UI 中最常见的图像控件，默认继承 `types Default` 里声明的 `icon` 类型，可挂所有 `Key` 和 `Event`，还能在同一块里嵌套 `button-`、`icon-`、`text_single-` 等子控件。\n\n常见做法：\n- 用 `size`、`position`、`parentanchor` / `widgetanchor` 固定布局，再搭配 `texture`、`texture_density`、`spriteType`、`spriteborder`、`frame_grid` 构建贴图；\n- 通过 `glow`、`color`、`tintcolor`、`modify_texture` 叠加特效，同时加入 `tooltip`/`tooltipwidget`、`onclick`、`onmousehierarchyenter`、`action_tooltip` 等交互；\n- 如果需要组合遮罩、文本、按钮，就直接在 `icon` 内写 `icon = { ... }`、`text_single = { ... }`、`button = { ... }`，无需额外 wrapper。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    name = \"mapmode_icon\"  # 命名控件，方便脚本查找或调试\n    size = { 64 64 }  # 设置控件宽高，支持像素/百分比/-1\n    position = { 6 4 }  # 相对于父锚点的偏移\n    parentanchor = top|left  # 定义相对父容器哪个锚点定位\n    widgetanchor = top|left  # 定义自身锚点，配合 parentanchor 对齐\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 指定贴图路径或脚本返回值\n    texture_density = 2  # 告知贴图密度（通常为 1 或 2）\n    spriteType = corneredstretched  # 选择拉伸方式（corneredstretched 等）\n    spriteborder = { 8 8 }  # 设置九宫格不可缩放的边框宽度\n    frame_grid = { 4 1 }  # 声明序列帧的列/行数量\n    frame = 2  # 选取 sprite sheet 中第几帧\n    alpha = 0.9  # 控制整体透明度 0~1\n    mirror = horizontal  # 是否镜像贴图（horizontal/vertical）\n    shaderfile = \"gfx/FX/pdxgui_default.shader\"  # 切换渲染 Shader，实现特殊混合\n    color = { 1 1 1 1 }  # 整体染色（RGBA）\n    tintcolor = { 0.8 0.9 1 1 }  # 配合遮罩/Shader 的替换色\n    glow = { name = \"drop_shadow\" glow_radius = 4 color = {0 0 0 0.65} }  # 添加光晕或阴影配置\n    modify_texture = { using = color_paper_texture blend_mode = overlay alpha = 0.3 }  # 叠加附加纹理或颜色\n    tooltip = \"MAPMODE_TERRAIN\"  # 普通 tooltip 文本或本地化 key\n    tooltipwidget = { using = tooltip_se }  # 绑定现成 tooltip 组件（如 tooltip_se）\n    onclick = \"[MapMode.SetActive]\"  # 左键点击时执行的脚本\n    onmousehierarchyenter = \"[HighlightMapMode(MapMode.Self)]\"  # 鼠标进入控件树时触发\n    icon = { size = { 80% 80% } texture = \"gfx/interface/icons/flat_icons/map.dds\" }  # 嵌套的 icon，用作额外装饰\n    text_single = { align = center|nobaseline text = \"M\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "button", "name": "button", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`button` 是可交互的控件，具备状态贴图（up/over/down/disable）、动画和 `action_tooltip` 支持。你可以在按钮内部放 `icon`、`text_single` 或其它 `widget`，用 `onclick`、`onrightclick` 等事件触发脚本。\n\n建议：配合模板（如 `button_regular_template`）获得一致的 UI 语言；使用 `enabled`、`tooltip` 或 `tooltipwidget` 给玩家明确的反馈；若按钮代表一个游戏命令，尽量提供 `action_tooltip`，这样 Hover 时能自动显示“左键：执行 / 右键：取消”等说明。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    size = { 160 36 }  # 设置控件宽高，支持像素/百分比/-1\n    using = button_regular_template  # 复用预设模板（texture、button 等）\n    action_tooltip = {  # 定义左键/右键/快捷键说明\n        click_type = left\n        click_mode = instant\n        on_action = \"[IssueCommand]\"  # action_tooltip 绑定的左键脚本\n        on_right_click = \"[ShowDetailsPopup]\"\n    }\n    onclick = \"[IssueCommand]\"  # 左键点击时执行的脚本\n    onrightclick = \"[ShowDetailsPopup]\"  # 右键点击时执行的脚本\n    onpressed = \"[PlayClickSound]\"  # 左键按下瞬间触发\n    onreleased = \"[StopClickSound]\"  # 左键释放时触发\n    tooltip = \"BUTTON_ORDER\"  # 普通 tooltip 文本或本地化 key\n    text_single = { text = \"Send Order\" align = center|nobaseline }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "widget", "name": "widget", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`widget` 是基础容器，负责携带 `size`、`layoutpolicy_horizontal`、`layoutpolicy_vertical` 等布局属性。它没有任何特殊渲染，只是把 `background`、`icon`、`hbox`、`vbox` 等孩子组合在一起。\n\n用法：设置 `name` 方便脚本通过 `PdxGuiWidget.FindChild` 查找；用 `datacontext` 将整块 widget 绑定到某个对象；配合 `background`、`flowcontainer`、`state` 可以做出复杂弹窗。", "examples": [{"language": "gui", "code": "widget = {\n    name = \"card_root\"  # 命名控件，方便脚本查找或调试\n    size = { 420 -1 }  # 设置控件宽高，支持像素/百分比/-1\n    layoutpolicy_vertical = expanding  # 纵向布局策略（fixed/expanding 等）\n    background = { using = bg_round_corners_dark }  # 渲染在控件背后的背景层\n    hbox = {  # 横向容器，布置子控件\n        spacing = 12  # 容器子元素间距\n        icon = { size = { 64 64 } texture = \"gfx/interface/icons/character.dds\" }  # 嵌套的 icon，用作额外装饰\n        vbox = {  # 纵向容器，布置子控件\n            layoutpolicy_horizontal = expanding  # 横向布局策略（fixed/expanding 等）\n            text_single = { text = \"Widget 标题\" align = left|nobaseline }  # 文本组件，用于显示一行文字\n            text_single = { text = \"Secondary line\" align = left|nobaseline color = {0.8 0.8 0.8 1} }  # 文本组件，用于显示一行文字\n        }\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "text_single", "name": "text_single", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`text_single` 是最常见的文本控件，支持 `text`、`fontsize`、`align`、`default_format`（富文本颜色）以及 `datacontext` / `textcontext`。结合 `autoresize = yes` 可以根据内容自动扩展，也可以用 `minimumsize` 或 `size = { -1 24 }` 固定高度。\n\n来自脚本的字符串通常写成 `text = \"[Country.GetName]\"`，而静态本地化可以直接引用本地化 key。", "examples": [{"language": "gui", "code": "text_single = {  # 文本组件，用于显示一行文字\n    using = text_single_template  # 复用预设模板（texture、button 等）\n    align = left|nobaseline  # 文本对齐方式\n    fontsize = 18  # 文本字号\n    default_format = \"#color_white\"\n    text = \"[Country.GetName]\"  # 文本内容（可以是字符串或表达式）\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "hbox", "name": "hbox", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`hbox` 是横向容器，子控件从左到右排列。常用属性包括 `spacing`、`layoutpolicy_horizontal`、`margin`，还可以内嵌 `expand = {}` 作为留白。\n\n把 `hbox` 用在卡片头部、按钮内容等位置，可以轻松把图标与文本排成一行。", "examples": [{"language": "gui", "code": "hbox = {  # 横向容器，布置子控件\n    spacing = 6  # 容器子元素间距\n    layoutpolicy_horizontal = expanding  # 横向布局策略（fixed/expanding 等）\n    icon = { size = { 24 24 } texture = \"gfx/interface/icons/alert.dds\" }  # 嵌套的 icon，用作额外装饰\n    text_single = { text = \"横排 hbox 示例\" align = left|center }  # 文本组件，用于显示一行文字\n    expand = {}\n    button = { size = { 24 24 } onclick = \"[DoToggle]\" icon = { texture = \"gfx/interface/icons/pin.dds\" } }  # 嵌套按钮，实现局部交互\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "vbox", "name": "vbox", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`vbox` 是纵向容器，遵循同样的 `spacing`、`layoutpolicy_vertical` 语义。可以嵌套 `text_single`、`icon`、`hbox`，并通过 `margin` 控制留白。\n\n当你需要一个自动增长的内容列（例如 tooltip 描述、多行属性列表）时，就在 `widget` 里放一个 `vbox`。", "examples": [{"language": "gui", "code": "vbox = {  # 纵向容器，布置子控件\n    spacing = 4  # 容器子元素间距\n    layoutpolicy_vertical = expanding  # 纵向布局策略（fixed/expanding 等）\n    text_single = { text = \"第一行\" align = left|nobaseline }  # 文本组件，用于显示一行文字\n    text_single = { text = \"第二行\" align = left|nobaseline }  # 文本组件，用于显示一行文字\n    icon = { size = { 100% 2 } texture = \"gfx/interface/divider.dds\" }  # 嵌套的 icon，用作额外装饰\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "flowcontainer", "name": "flowcontainer", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`flowcontainer` 会在一条线上摆放若干 Item，当超出 `wrap_length` 时换行。常与 `datamodel` / `item = { ... }` 组合使用，动态绘制标签、勋章或地图模式按钮。\n\n提示：`spacing` 控制子控件之间的水平/垂直间隙；`wrap_length` 最好与父容器宽度一致，以免出现意外换行。", "examples": [{"language": "gui", "code": "flowcontainer = {  # 自动换行的容器\n    wrap_length = 260  # flowcontainer 换行宽度\n    spacing = 6  # 容器子元素间距\n    datamodel = \"[GetPinnedMapModes(PinCollection.Self)]\"  # 绑定数据模型以重复生成子项\n    item = {  # flowcontainer/列表的单个条目模板\n        button = {  # 嵌套按钮，实现局部交互\n            size = { 36 36 }  # 设置控件宽高，支持像素/百分比/-1\n            onclick = \"[MapMode.TogglePin]\"  # 左键点击时执行的脚本\n            icon = { texture = \"[MapMode.GetIcon]\" size = { 100% 100% } }  # 嵌套的 icon，用作额外装饰\n        }\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "piechart", "name": "piechart", "kind": "Component", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`piechart` 用于绘制饼图，通常配合 `datacontext` + `pie_slice = { color = ... value = ... }` 使用。可以添加 `legend`、`tooltipwidget` 来解释占比。\n\n若想保持像素对齐，记得提供固定 `size`。通过 `visible` 还能根据数据量决定是否绘制。", "examples": [{"language": "gui", "code": "piechart = {  # 饼图组件，显示比例数据\n    size = { 120 120 }  # 设置控件宽高，支持像素/百分比/-1\n    datacontext = \"[Country.GetCultureBreakdown]\"  # 绑定控件数据上下文，供脚本表达式使用\n    pie_slice = {  # 饼图切片定义\n        color = \"[CultureBreakdownEntry.GetColor]\"  # 整体染色（RGBA）\n        value = \"[CultureBreakdownEntry.GetPercentage]\"\n        tooltip = \"[CultureBreakdownEntry.GetLabel]\"  # 普通 tooltip 文本或本地化 key\n    }\n}"}], "sources": [], "tags": ["component"], "links": [], "used_by": []}, {"id": "size", "name": "size", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`size = { width height }` 控制控件尺寸。数字代表像素，`-1` 表示自适应内容，`100%` / `75%` 等百分比会引用父容器尺寸。即使是 `icon` 也可使用 `size = { 48 32 }` 或 `size = { 80% -1 }` 兼容拉伸。\n\n常见技巧：把 `size = { 0 0 }` 留给背景，真正的内容用 `autoresize = yes`。当配合 `spriteType = corneredstretched` 时，设置 `spriteborder` 才能保持边框厚度。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    size = { 48 32 }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/icons/flat_icons/research.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "position", "name": "position", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`position = { x y }` 以像素表示相对于 `parentanchor` 的偏移。正数向右/向下，负数向左/向上，可以与百分比尺寸一起使用，从而在固定布局内微调元素位置。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    parentanchor = top|right  # 定义相对父容器哪个锚点定位\n    widgetanchor = top|right  # 定义自身锚点，配合 parentanchor 对齐\n    position = { -12 6 }  # 相对于父锚点的偏移\n    texture = \"gfx/interface/icons/pin.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "parentanchor", "name": "parentanchor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`parentanchor` 指定父容器的参考点，例如 `top|left`、`center`、`bottom|right`。配合 `widgetanchor`、`position` 使用能精确地在父控件中对齐当前控件。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    parentanchor = bottom|right  # 定义相对父容器哪个锚点定位\n    widgetanchor = bottom|right  # 定义自身锚点，配合 parentanchor 对齐\n    position = { -8 -8 }  # 相对于父锚点的偏移\n    texture = \"gfx/interface/icons/flat_icons/lock.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "widgetanchor", "name": "widgetanchor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`widgetanchor` 决定当前控件自身的锚点。默认是 `top|left`，如果你希望以中心或右下角对齐，就把 `widgetanchor = center` 或 `widgetanchor = bottom|right` 配合 `parentanchor` 使用。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    size = { 32 32 }  # 设置控件宽高，支持像素/百分比/-1\n    parentanchor = center  # 定义相对父容器哪个锚点定位\n    widgetanchor = center  # 定义自身锚点，配合 parentanchor 对齐\n    texture = \"gfx/interface/icons/flat_icons/target.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "align", "name": "align", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`align` 控制 `text_single` 的对齐方式，例如 `align = left|nobaseline`、`align = center|nobaseline`。在 `hbox` 内想垂直居中时使用 `align = left|center`，在 `vbox` 内想顶部对齐时使用 `align = center|top`。", "examples": [{"language": "gui", "code": "text_single = {  # 文本组件，用于显示一行文字\n    align = center|nobaseline  # 文本对齐方式\n    fontsize = 18  # 文本字号\n    text = \"Center Text\"  # 文本内容（可以是字符串或表达式）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "layoutpolicy_horizontal", "name": "layoutpolicy_horizontal", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "横向布局策略，取值包括 `fixed`（默认，大小遵循 `size`）、`expanding`（占据剩余空间）、`minimum`（恰好包裹内容）。结合 `layoutpolicy_vertical` 可以让 `widget` 在 `hbox`/`vbox` 中弹性伸缩。", "examples": [{"language": "gui", "code": "hbox = {  # 横向容器，布置子控件\n    text_single = {  # 文本组件，用于显示一行文字\n        layoutpolicy_horizontal = expanding  # 横向布局策略（fixed/expanding 等）\n        text = \"Description grows with parent\"  # 文本内容（可以是字符串或表达式）\n    }\n    button = { size = { 80 28 } text_single = { text = \"Action\" } }  # 嵌套按钮，实现局部交互\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "layoutpolicy_vertical", "name": "layoutpolicy_vertical", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "纵向布局策略，常用 `expanding`（填满剩余高度）和 `minimum`（以内容高度为准）。例如在滚动区域里使用 `layoutpolicy_vertical = expanding` 可以让背景拉伸到和滚动区域等高。", "examples": [{"language": "gui", "code": "widget = {\n    size = { -1 120 }  # 设置控件宽高，支持像素/百分比/-1\n    layoutpolicy_vertical = expanding  # 纵向布局策略（fixed/expanding 等）\n    background = { using = bg_round_corners_dark }  # 渲染在控件背后的背景层\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "allow_outside", "name": "allow_outside", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`allow_outside = yes` 允许控件绘制在父容器范围外，可用于阴影或悬浮提示。例如 `map mode` 按钮的装饰 icon 会略微超出背景，这时就需要允许越界。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    allow_outside = yes  # 允许绘制超出父容器\n    size = { 40 40 }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/icons/flat_icons/ribbon.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "ignore_layout", "name": "ignore_layout", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`ignore_layout = yes` 会让控件跳出所在 `hbox`/`vbox` 的自动布局，自行使用 `position` 和 `parentanchor` 排布。常见于卡片角标或叠层遮罩。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    ignore_layout = yes  # 忽略父容器布局，自行定位\n    parentanchor = top|right  # 定义相对父容器哪个锚点定位\n    widgetanchor = top|right  # 定义自身锚点，配合 parentanchor 对齐\n    position = { -4 4 }  # 相对于父锚点的偏移\n    texture = \"gfx/interface/icons/flat_icons/ribbon.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "resizeparent", "name": "resizeparent", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "当 `resizeparent = yes` 时，父控件会按当前控件的尺寸重新计算自身大小。通常用在 tooltip 中，通过在 `text_single` 上开启 `resizeparent`，让父 `widget` 自动匹配文本高度。", "examples": [{"language": "gui", "code": "text_single = {  # 文本组件，用于显示一行文字\n    resizeparent = yes  # 按当前控件尺寸调整父容器\n    autoresize = yes  # 文本/控件是否根据内容自动扩展\n    text = \"[DynamicTooltip.GetDescription]\"  # 文本内容（可以是字符串或表达式）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "visible", "name": "visible", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`visible` 支持布尔表达式或脚本调用，如 `visible = \"[Country.HasParliament]\"`。引擎会在 UI 刷新时重新计算，从而隐藏或显示该控件。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    visible = \"[Country.HasParliament]\"  # 控制是否可见，可写表达式\n    texture = \"gfx/interface/icons/flat_icons/parliament.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "visible_at_creation", "name": "visible_at_creation", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "控制初始可见性。在某些动画场景中，想要延迟显示控件，就可以把 `visible_at_creation = no`，随后在脚本里调用 `.Show()` 触发动画。", "examples": [{"language": "gui", "code": "widget = {\n    visible_at_creation = no  # 初始创建时是否可见\n    state = { name = show duration = 0.2 alpha = 1 }  # 动画状态（如 show/hide）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "enabled", "name": "enabled", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`enabled` 或脚本表达式控制控件是否可交互。禁用时，`button` 会切换至 disable 帧，`icon` 则无法响应鼠标事件。务必结合 `tooltip` 告知玩家不可用原因。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    enabled = \"[Not(Country.CanAffordCost)]\"  # 是否可交互，常用表达式控制\n    tooltip = \"BTN_DISABLED_CANNOT_AFFORD\"  # 普通 tooltip 文本或本地化 key\n    text_single = { text = \"Construct\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "alwaystransparent", "name": "alwaystransparent", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "当 `alwaystransparent = yes` 时，控件不会截获鼠标事件（类似“点击穿透”），常用于装饰层或阴影层。需要可视化但不影响交互时就开启它。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    alwaystransparent = yes  # 允许鼠标穿透（仅显示不拦截）\n    size = { 100% 100% }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/masks/card_glow.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "scissor", "name": "scissor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`scissor = yes` 会开启裁切，让子控件只在当前区域内绘制。滚动区域（`scrollarea`）和 `map list` 常用它来隐藏溢出部分。", "examples": [{"language": "gui", "code": "widget = {\n    scissor = yes  # 开启裁切，隐藏溢出内容\n    size = { 240 80 }  # 设置控件宽高，支持像素/百分比/-1\n    flowcontainer = {  # 自动换行的容器\n        wrap_length = 220  # flowcontainer 换行宽度\n        spacing = 6  # 容器子元素间距\n        icon = { texture = \"gfx/interface/icons/flat_icons/tag.dds\" size = { 24 24 } }  # 嵌套的 icon，用作额外装饰\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "texture", "name": "texture", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`texture` 指向 DDS 贴图或脚本函数返回的贴图 path，例如 `\"gfx/interface/icons/... .dds\"` 或 `\"[GetInstitutionIcon(AdvanceItem.GetDefinition)]\"`。配合 `texture_density`、`spriteType` 可在不同 DPI 下保持清晰。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"[GetInstitutionIcon(AdvanceItem.GetDefinition)]\"  # 指定贴图路径或脚本返回值\n    size = { 32 32 }  # 设置控件宽高，支持像素/百分比/-1\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "texture_density", "name": "texture_density", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "设置贴图密度（常见值 1 或 2）。在高分辨率贴图上指定 `texture_density = 2`，引擎会自动按期望大小缩放，避免模糊。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 指定贴图路径或脚本返回值\n    texture_density = 2  # 告知贴图密度（通常为 1 或 2）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spritetype", "name": "spriteType", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteType` 决定贴图渲染方式，例如 `corneredstretched`（九宫拉伸）、`corneredtiled`、`stretched`。当你用 `spriteType = corneredstretched` 时记得配合 `spriteborder` 指定可伸缩区域。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/buttons/card_button.dds\"  # 指定贴图路径或脚本返回值\n    spriteType = corneredstretched  # 选择拉伸方式（corneredstretched 等）\n    spriteborder = { 12 12 }  # 设置九宫格不可缩放的边框宽度\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spritetype", "name": "spritetype", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spritetype` 是 `spriteType` 的小写写法，为了兼容旧脚本保留。功能与 `spriteType` 完全一致，可以二选一。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/buttons/card_button.dds\"  # 指定贴图路径或脚本返回值\n    spritetype = corneredstretched  # 选择拉伸方式（corneredstretched 等）\n    spriteborder = { 12 12 }  # 设置九宫格不可缩放的边框宽度\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spriteborder", "name": "spriteborder", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteborder = { horizontal vertical }`（或四个值 `{ left top right bottom }`）用于 `corneredstretched` / `corneredtiled`，表示不可拉伸的边角大小。数值越大，中心可伸缩区域越小。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    spriteborder = { 20 12 }  # 设置九宫格不可缩放的边框宽度\n    spriteType = corneredstretched  # 选择拉伸方式（corneredstretched 等）\n    texture = \"gfx/interface/buttons/button_regular.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "spriteborder", "name": "spriteBorder", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`spriteBorder` 是大小写变体，通常出现在从 CK3/IR 迁移的脚本里。和 `spriteborder` 完全相同，只是首字母大写。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    spriteBorder = { 30 8 }  # 设置九宫格不可缩放的边框宽度\n    spriteType = corneredstretched  # 选择拉伸方式（corneredstretched 等）\n    texture = \"gfx/interface/buttons/paper_tab.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "frame", "name": "frame", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "当贴图包含多帧（Sprite Sheet）时，`frame` 指定要显示的帧序号（从 0 开始）。它与 `frame_grid` 或 `framesize` 搭配使用。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/map_mode_states.dds\"  # 指定贴图路径或脚本返回值\n    frame_grid = { 4 1 }  # 声明序列帧的列/行数量\n    frame = 2  # 选取 sprite sheet 中第几帧\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "framesize", "name": "framesize", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "如果贴图没有提供 `frame_grid`，可以用 `framesize = { width height }` 手动指定单帧大小，配合 `frame` 取出正确画面。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/seals_sheet.dds\"  # 指定贴图路径或脚本返回值\n    framesize = { 47 46 }  # 直接指定单帧的像素宽高\n    frame = 5  # 选取 sprite sheet 中第几帧\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "frame_grid", "name": "frame_grid", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`frame_grid = { columns rows }` 告诉渲染器这张贴图被等分为多少列、多少行。再通过 `frame` 选择第几帧。常见值 `{ 4 1 }` 或 `{ 3 1 }`。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/advances_sheet.dds\"  # 指定贴图路径或脚本返回值\n    frame_grid = { 3 1 }  # 声明序列帧的列/行数量\n    frame = 1  # 选取 sprite sheet 中第几帧\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "alpha", "name": "alpha", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`alpha` 控制整体透明度，范围 0~1。可以用于淡出/高亮动画，也可以让背景略微半透明。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    alpha = 0.4  # 控制整体透明度 0~1\n    texture = \"gfx/interface/masks/card_overlay.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "mirror", "name": "mirror", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`mirror = horizontal` 或 `mirror = vertical` 让贴图镜像翻转，常用来重用单边装饰素材。默认不镜像。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/decorations/corner_flavor.dds\"  # 指定贴图路径或脚本返回值\n    mirror = vertical  # 是否镜像贴图（horizontal/vertical）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "shaderfile", "name": "shaderfile", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "指定渲染 Shader，例如 `\"gfx/FX/pdxgui_default.shader\"`、`\"gfx/FX/gui_threecolor_blendable_mask.shader\"`。只有在需要特殊混色、遮罩或 ECS 视窗时才需要改写。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    shaderfile = \"gfx/FX/gui_threecolor_blendable_mask.shader\"  # 切换渲染 Shader，实现特殊混合\n    gfxtype = three_color_blendable_mask\n    texture = \"gfx/interface/icons/unit_mask.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "color", "name": "color", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`color = { r g b a }` 直接覆盖顶点色，常用于把单色贴图染成任意颜色。和 `tintcolor` 的区别是：`color` 影响整个 Sprite，而 `tintcolor` 只对指定的 shader 通道生效。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/shapes/circle.dds\"  # 指定贴图路径或脚本返回值\n    color = { 0.2 0.7 1 0.8 }  # 整体染色（RGBA）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "tintcolor", "name": "tintcolor", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`tintcolor` 在使用某些 shader（例如 blendable mask）时，决定替换色。通常写成脚本表达式，例如 `[GetCountryPrimaryColor]`。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    shaderfile = \"gfx/FX/gui_threecolor_blendable_mask.shader\"  # 切换渲染 Shader，实现特殊混合\n    tintcolor = \"[GetCountryPrimaryColor]\"  # 配合遮罩/Shader 的替换色\n    texture = \"gfx/interface/masks/unit_mask.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "blend_mode", "name": "blend_mode", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "设置混合模式（`normal`、`multiply`、`overlay`、`alphamultiply` 等）。常与 `modify_texture` 一起使用，让覆盖纹理与主贴图混合。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/buttons/paper_card.dds\"  # 指定贴图路径或脚本返回值\n    modify_texture = {  # 叠加附加纹理或颜色\n        using = color_brown_leather_texture  # 复用预设模板（texture、button 等）\n        blend_mode = overlay\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "modify_texture", "name": "modify_texture", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "该 block 允许叠加额外贴图或颜色，可重复出现多次。每次叠加都可以指定 `using`、`texture`、`blend_mode`、`alpha`。非常适合给 `button` 增加纸张质感或给 `icon` 添加彩色覆盖层。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/buttons/paper_card.dds\"  # 指定贴图路径或脚本返回值\n    modify_texture = { using = color_brown_leather_texture alpha = 0.3 }  # 叠加附加纹理或颜色\n    modify_texture = { using = overlay_paper_03 blend_mode = overlay alpha = 0.6 }  # 叠加附加纹理或颜色\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "using", "name": "using", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`using = template_name` 引用在 `types` 中定义的模板，快速复用一整套属性。可以在一个 block 内连续写多个 `using`，后写的值会覆盖先写的值。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    using = button_regular_texture  # 复用预设模板（texture、button 等）\n    using = button_common_template  # 复用预设模板（texture、button 等）\n    text_single = { text = \"Template Button\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "background", "name": "background", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`background = { ... }` 在当前控件背后渲染额外层，可出现多次。典型用途是叠加多层纸张、金属框或遮罩，而不需要另建子 `icon`。", "examples": [{"language": "gui", "code": "widget = {\n    background = { using = bg_round_corners_alt_texture alpha = 0.4 }  # 渲染在控件背后的背景层\n    background = { texture = \"gfx/interface/patterns/paper.dds\" alpha = 0.2 }  # 渲染在控件背后的背景层\n    hbox = { text_single = { text = \"Background 示例\" } }  # 横向容器，布置子控件\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "glow", "name": "glow", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`glow = { name = \"drop_shadow\" glow_radius = 4 color = {0 0 0 0.6} }` 这类 block 控制发光或阴影。属性包括 `glow_radius`、`color`、`alpha`，一般用于按钮 hover 或高亮状态。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/flat_icons/star.dds\"  # 指定贴图路径或脚本返回值\n    glow = { name = \"drop_shadow\" glow_radius = 5 color = {0 0 0 0.7} }  # 添加光晕或阴影配置\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "datacontext", "name": "datacontext", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "将控件绑定到一个脚本对象，使内部表达式可以直接引用它。例如 `datacontext = \"[Character.Self]\"` 后，子控件就能写 `text = \"[Character.GetName]\"`。这是 UI 和脚本交互的核心机制。", "examples": [{"language": "gui", "code": "widget = {\n    datacontext = \"[Character]\"  # 绑定控件数据上下文，供脚本表达式使用\n    text_single = { text = \"[Character.GetName]\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "name", "name": "name", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`name` 会给控件设置唯一标识，供脚本或其它控件通过 `PdxGuiWidget.FindChild(\"name\")` 查找。最好只在确实需要脚本访问时才命名，以避免冲突。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    name = \"resource_icon\"  # 命名控件，方便脚本查找或调试\n    texture = \"gfx/interface/icons/resources/iron.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltip", "name": "tooltip", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "直接指定本地化 key 或字符串，当鼠标悬停时显示。`tooltip = \"MAPMODE_TERRAIN\"` 或 `tooltip = \"[GoodsItem.GetTooltip]\"` 都是合法写法。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    texture = \"gfx/interface/icons/flat_icons/terrain.dds\"  # 指定贴图路径或脚本返回值\n    tooltip = \"MAPMODE_TERRAIN\"  # 普通 tooltip 文本或本地化 key\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltip_enabled", "name": "tooltip_enabled", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "布尔值，控制是否允许弹出 tooltip。即使 `tooltip` 存在，只要设为 `no` 就不会在鼠标悬停时显示文本。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    tooltip = \"SECRET_INFO\"  # 普通 tooltip 文本或本地化 key\n    tooltip_enabled = \"[DebugSettings.IsEnabled]\"  # 允许/禁止显示 tooltip\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltipwidget", "name": "tooltipwidget", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`tooltipwidget = { using = some_tooltip }` 绑定一个现有 tooltip widget（如 `tooltip_se`、`religion_tooltip`），能展示复杂内容或多列信息。简称版本通常只是引用已经定义好的 tooltip 类型。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    tooltipwidget = { using = religion_tooltip }  # 绑定现成 tooltip 组件（如 tooltip_se）\n    text_single = { text = \"Religion\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "tooltipwidget", "name": "TooltipWidget", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "首字母大写的 `TooltipWidget` 常在脚本里用于“自定义 tooltip block”，可内嵌 `SimpleContextualTooltipType`、`TooltipTextBlock` 等结构，完全自定义标题、内容与快捷提示。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    TooltipWidget = {  # 绑定自定义 TooltipWidget 结构\n        SimpleContextualTooltipType = {\n            blockoverride \"title_text\" { text = \"Custom Tooltip\" }\n            blockoverride \"text\" { text = \"详细说明...\" }\n        }\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "state", "name": "state", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "状态动画定义，形如 `state = { name = show duration = 0.25 alpha = 1 }`。你可以定义 `_show`、`_hide` 等命名的状态，然后通过脚本触发，从而实现淡入淡出或缩放动画。", "examples": [{"language": "gui", "code": "widget = {\n    state = { name = _show duration = 0.2 alpha = 1 bezier = { 0.0 1.0 0.0 1.0 } }  # 动画状态（如 show/hide）\n    state = { name = _hide duration = 0.2 alpha = 0 }  # 动画状态（如 show/hide）\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "button", "widget", "text_single"]}, {"id": "icon-", "name": "icon (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "当你在 `icon` 或 `widget` 内再次写 `icon = { ... }` 时，本词条描述的就是这类“嵌套 icon”。它继承父容器的布局，可以被用作遮罩、角标或额外图层。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    size = { 64 64 }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/icons/card_base.dds\"  # 指定贴图路径或脚本返回值\n    icon = {  # 嵌套的 icon，用作额外装饰\n        size = { 48 48 }  # 设置控件宽高，支持像素/百分比/-1\n        parentanchor = center  # 定义相对父容器哪个锚点定位\n        widgetanchor = center  # 定义自身锚点，配合 parentanchor 对齐\n        texture = \"gfx/interface/icons/flat_icons/army.dds\"  # 指定贴图路径或脚本返回值\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "button-", "name": "button (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "`button = { ... }` 可以嵌在 `icon`/`widget` 中，作为局部交互区域，例如卡片右上角的小关闭按钮。它拥有与顶层 `button` 完全一样的属性与事件。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    size = { 120 80 }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/panels/card.dds\"  # 指定贴图路径或脚本返回值\n    button = {  # 嵌套按钮，实现局部交互\n        size = { 18 18 }  # 设置控件宽高，支持像素/百分比/-1\n        parentanchor = top|right  # 定义相对父容器哪个锚点定位\n        widgetanchor = top|right  # 定义自身锚点，配合 parentanchor 对齐\n        position = { -6 6 }  # 相对于父锚点的偏移\n        onclick = \"[CloseCard]\"  # 左键点击时执行的脚本\n        icon = { texture = \"gfx/interface/icons/flat_icons/close.dds\" }  # 嵌套的 icon，用作额外装饰\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon", "widget"]}, {"id": "text_single-", "name": "text_single (子控件)", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "在 `icon` 或 `button` 内嵌入 `text_single = { ... }` 可直接在图像上显示文字，常用于显示快捷键、数量或标记。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    size = { 40 40 }  # 设置控件宽高，支持像素/百分比/-1\n    texture = \"gfx/interface/icons/flat_icons/mapmodes.dds\"  # 指定贴图路径或脚本返回值\n    text_single = {  # 文本组件，用于显示一行文字\n        parentanchor = bottom|right  # 定义相对父容器哪个锚点定位\n        widgetanchor = bottom|right  # 定义自身锚点，配合 parentanchor 对齐\n        position = { -4 -4 }  # 相对于父锚点的偏移\n        text = \"F9\"  # 文本内容（可以是字符串或表达式）\n        fontsize = 12  # 文本字号\n    }\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["icon"]}, {"id": "onclick", "name": "onclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "左键点击（抬起）时调用的脚本。通常直接执行一个 UI Action，例如 `\"[OpenLateralView('economy')]\"`。当按钮需要不同的点击模式，可以再配合 `action_tooltip`。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    onclick = \"[OpenLateralView('economy')]\"  # 左键点击时执行的脚本\n    text_single = { text = \"Open Economy\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightclick", "name": "onrightclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "右键点击时触发，常用来执行重置、删除、显示详情等次级操作。UI 默认也允许为 `action_tooltip` 添加 `on_right_click` 说明。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    tooltip = \"Right-click to clear pin\"  # 普通 tooltip 文本或本地化 key\n    onrightclick = \"[PinCollection.Remove(MapMode.GetKey)]\"  # 右键点击时执行的脚本\n    texture = \"gfx/interface/icons/flat_icons/pin.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ondoubleclick", "name": "ondoubleclick", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "双击事件，多用于地图定位或打开详细窗口。由于双击包含两次 `onclick`，请确保脚本 idempotent。", "examples": [{"language": "gui", "code": "hbox = {  # 横向容器，布置子控件\n    text_single = { text = \"[Location.GetName]\" }  # 文本组件，用于显示一行文字\n    ondoubleclick = \"[PanToLocation(Location.Self)]\"  # 双击执行的脚本\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onpressed", "name": "onpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "鼠标左键按下的瞬间触发，适合播放按压音效或启动拖拽逻辑。记得搭配 `onreleased` 结束行为。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    onpressed = \"[PlayAudioEffect('ui_click_down')]\"  # 左键按下瞬间触发\n    onreleased = \"[PlayAudioEffect('ui_click_up')]\"  # 左键释放时触发\n    texture = \"gfx/interface/icons/flat_icons/button.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onreleased", "name": "onreleased", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "左键释放时触发（不区分是否仍在按钮内），通常用于收尾动画或停止音效。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    onpressed = \"[StartPressAnim]\"  # 左键按下瞬间触发\n    onreleased = \"[StopPressAnim]\"  # 左键释放时触发\n    text_single = { text = \"Holdable\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightpressed", "name": "onrightpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "右键按下瞬间触发。只有在需要“右键按住”的操作时才使用，否则直接使用 `onrightclick` 即可。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    onrightpressed = \"[BeginMarqueeSelection]\"  # 右键按下瞬间触发\n    onrightreleased = \"[EndMarqueeSelection]\"  # 右键释放时触发\n    texture = \"gfx/interface/icons/flat_icons/selection.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onrightreleased", "name": "onrightreleased", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "右键释放时触发，常与 `onrightpressed` 配对，或用于在按住右键时取消高亮。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    onrightpressed = \"[ShowAltTooltip]\"  # 右键按下瞬间触发\n    onrightreleased = \"[HideAltTooltip]\"  # 右键释放时触发\n    text_single = { text = \"Hold RMB\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onmousehierarchyenter", "name": "onmousehierarchyenter", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "鼠标进入当前控件及其所有子控件时触发。典型用途：在地图上高亮某个对象、播放 hover 音效或切换动画。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    onmousehierarchyenter = \"[PdxGuiWidget.SetHighlightLocation(Location.Self)]\"  # 鼠标进入控件树时触发\n    onmousehierarchyleave = \"[PdxGuiWidget.ClearHighlightLocation(Location.Self)]\"  # 鼠标离开控件树时触发\n    texture = \"gfx/interface/icons/location.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onmousehierarchyleave", "name": "onmousehierarchyleave", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "鼠标离开当前控件树时触发，常用来撤销 `onmousehierarchyenter` 做的高亮或动画。", "examples": [{"language": "gui", "code": "icon = {  # 嵌套的 icon，用作额外装饰\n    onmousehierarchyenter = \"[HighlightCountry(Country.Self)]\"  # 鼠标进入控件树时触发\n    onmousehierarchyleave = \"[ClearCountryHighlight]\"  # 鼠标离开控件树时触发\n    texture = \"gfx/interface/icons/country.dds\"  # 指定贴图路径或脚本返回值\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onfocusout", "name": "onfocusout", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "输入框失去焦点时调用，可保存输入值、关闭自动完成或重置状态。", "examples": [{"language": "gui", "code": "textbox = {\n    onfocusout = \"[SearchBar.OnFocusOut(PdxGuiWidget.AccessSelf, PdxGuiWidget.AccessParent.FindChild('autocomplete'))]\"  # 输入框失焦时触发\n    text_single = { text = \"\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onreturnpressed", "name": "onreturnpressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "在文本框内按下 Enter 时触发。常用来提交搜索、确认命名或直接执行指令。", "examples": [{"language": "gui", "code": "textbox = {\n    onreturnpressed = \"[GameSaveNameWindow.CheckAndSave]\"  # 按下 Enter 时触发\n    text_single = { text = \"\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_escape_pressed", "name": "on_escape_pressed", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "捕获 Esc 键，通常用于关闭搜索框或弹窗。和 `onreturnpressed` 一样，只对可获得键盘焦点的控件生效。", "examples": [{"language": "gui", "code": "textbox = {\n    on_escape_pressed = \"[FindLocationView.OnClose]\"  # 按下 Esc 时触发\n    text_single = { text = \"\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_input_action_shortcut", "name": "on_input_action_shortcut", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "把控件和游戏内定义的输入动作（快捷键 / 手柄按键）绑定起来。值是脚本表达式，例如 `\"[OnIncreaseGameSpeed]\"`。一个控件可以注册多个 `on_input_action_shortcut`。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    on_input_action_shortcut = \"[OnIncreaseGameSpeed]\"  # 绑定游戏内快捷键动作\n    on_input_action_shortcut = \"[OnDecreaseGameSpeed]\"  # 绑定游戏内快捷键动作\n    text_single = { text = \"Speed +/-\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingstart", "name": "oneditingstart", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "文本编辑开始时触发，可初始化自动完成列表、缓存旧内容等。", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingstart = \"[SearchBar.OnEditingStart(PdxGuiWidget.AccessSelf, PdxGuiWidget.AccessParent.FindChild('autocomplete'))]\"  # 开始编辑文本时触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingfinished", "name": "oneditingfinished", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "编辑结束（无论内容是否改变）即触发，常用于清理状态或根据最终值更新 UI。", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingfinished = \"[GameLobby.SetName]\"  # 结束编辑（无论是否变更）触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "oneditingfinished_with_changes", "name": "oneditingfinished_with_changes", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "只有当文本的最终结果与开始编辑时不同，才会触发此事件。非常适合进行输入校验或保存数据，避免重复提交。", "examples": [{"language": "gui", "code": "textbox = {\n    oneditingfinished_with_changes = \"[ModToolsGui.VerifyModName]\"  # 仅在文本发生变化时触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextedited", "name": "ontextedited", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "文本内容在编辑过程中每次变化都会回调，多用于即时过滤、动态校验或联动图表。注意不要在这里执行开销巨大的逻辑。", "examples": [{"language": "gui", "code": "textbox = {\n    ontextedited = \"[AiCurrencyGlue.OnMinXChanged(PdxGuiWidget.Self)]\"  # 文本内容即时变化时触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextchanged", "name": "ontextchanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "当 `textcontext` 或 `text` 被脚本刷新时触发（不一定是编辑行为）。常用来控制一些“如果文本为空则隐藏”这种逻辑。", "examples": [{"language": "gui", "code": "text_single = {  # 文本组件，用于显示一行文字\n    ontextchanged = \"[UpdateVisibilityIfThereIsAnyText(PdxGuiWidget.AccessSelf)]\"  # text/textcontext 刷新时触发\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "ontextcontextchanged", "name": "ontextcontextchanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "每当 `textcontext` 更新时触发，通常用于重新解析富文本结构、刷新列表或概览模块。很多 tooltip 模板都依赖它来填充数据。", "examples": [{"language": "gui", "code": "widget = {\n    ontextcontextchanged = \"[SetStringPairListFromTextContext(PdxGuiWidget.AccessSelf)]\"  # textcontext 更新时触发\n    textcontext = \"[DynamicTooltip.GetContext]\"\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onvaluechanged", "name": "onvaluechanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "滑条、数值输入、下拉菜单等控件的数值变化时触发。适合即时反馈，例如更新说明文字或实时计算成本。", "examples": [{"language": "gui", "code": "slider = {\n    onvaluechanged = \"[EconomyView.OnChangedCoinMinting]\"  # 滑条/数值即时变动回调\n    min = 0\n    max = 100\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onvaluechanged_low", "name": "onvaluechanged_low", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "低频版本的 `onvaluechanged`，通常只有在值差异较大时才触发，适用于范围过滤器的最小值 slider。", "examples": [{"language": "gui", "code": "slider = {\n    onvaluechanged_low = \"[SearchFilterCategory.SetRangeMinValue(SearchFilter.Self)]\"  # 滑条低频（最小值）变化回调\n    min = 0\n    max = 100\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onchangefinish", "name": "onchangefinish", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "在 slider / 输入完成后触发，确保只在用户停止拖动或输入时才执行昂贵逻辑。例如金钱调节滑条在松手时才真正提交花费。", "examples": [{"language": "gui", "code": "slider = {\n    onvaluechanged = \"[AutomatedSystemsItem.OnChangedGoldSlider]\"  # 滑条/数值即时变动回调\n    onchangefinish = \"[AutomatedSystemsItem.PostGoldSlider]\"  # 滑条/输入结束后的收尾逻辑\n    min = 0\n    max = 100\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "onselectionchanged", "name": "onselectionchanged", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "列表或下拉菜单选中项发生变化时调用，可更新详情面板或同步到脚本。记得检查 `PdxGuiWidget.GetIndexInDataModel` 以获知实际选项。", "examples": [{"language": "gui", "code": "dropdown = {\n    datamodel = \"[JominiGameRules.GetPresets]\"  # 绑定数据模型以重复生成子项\n    onselectionchanged = \"[JominiGameRules.OnSelectPreset]\"  # 列表/下拉选择变化回调\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_start", "name": "on_start", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "动画或声音开始时触发的脚本。常用于播放音效或设置变量，例如 `snd_UI_inGameMenu_open` 就会在 `on_start` 播放“菜单打开”音。", "examples": [{"language": "gui", "code": "animation = {\n    name = \"show_panel\"  # 命名控件，方便脚本查找或调试\n    on_start = \"[PlayAudioEffect('UI_menu_open')]\"  # 动画或声音开始时脚本\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_finish", "name": "on_finish", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "动画结束时触发，用来隐藏窗口、恢复焦点或继续下一段动画。搜索栏弹出的动画就会在 `on_finish` 中强制把焦点移动到输入框。", "examples": [{"language": "gui", "code": "animation = {\n    name = \"show_search\"  # 命名控件，方便脚本查找或调试\n    duration = 0.2\n    on_finish = \"[SearchBar.ForceFocus(PdxGuiWidget.FindChild('searchbar_editbox'))]\"  # 动画结束时脚本\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_action", "name": "on_action", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "提供给 `action_tooltip` 的钩子，语义上约等于“执行该 Action”。当 `action_tooltip` 中定义 `on_action = \"[SomeScript]\"` 时，按钮会自动使用这里的脚本。多用于需要“左键点击 = 行动”提示的控件。", "examples": [{"language": "gui", "code": "hbox = {  # 横向容器，布置子控件\n    action_tooltip = {  # 定义左键/右键/快捷键说明\n        click_type = left\n        click_mode = instant\n        on_action = \"[GetScriptedGui('sakuya_tolerance_add').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).End)]\"  # action_tooltip 绑定的左键脚本\n    }\n    on_action = \"[GetScriptedGui('sakuya_tolerance_add').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).End)]\"  # action_tooltip 绑定的左键脚本\n    text_single = { text = \"Give tolerance\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "on_action_with_params", "name": "on_action_with_params", "kind": "Event", "group": "GUI", "parents": ["GUI"], "section": null, "description": "与 `on_action` 类似，但脚本可接收额外参数（例如 Outliner 里拖动内阁成员时传入 slot 信息）。如果 Action 需要复杂的上下文，就用这个版本。", "examples": [{"language": "gui", "code": "widget = {\n    datamodel = \"[Cabinet.GetSlots]\"  # 绑定数据模型以重复生成子项\n    on_action_with_params = \"[Cabinet.AssigningCabinetMemberToSlot]\"  # 带参数的 action_tooltip 脚本\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button", "icon", "widget"]}, {"id": "action_tooltip", "name": "action_tooltip", "kind": "Key", "group": "GUI", "parents": ["GUI"], "section": null, "description": "Action tooltip block 描述左键 / 右键 / 快捷键的行为，让 UI 自动生成指示文本。通常包含 `click_type`、`click_mode`、`on_action`、`on_right_click`、`shortcut` 等字段。", "examples": [{"language": "gui", "code": "button = {  # 嵌套按钮，实现局部交互\n    action_tooltip = {  # 定义左键/右键/快捷键说明\n        click_type = left\n        click_mode = instant\n        on_action = \"[ConfirmOfferLoanAction.Execute]\"  # action_tooltip 绑定的左键脚本\n        on_right_click = \"[ConfirmOfferLoanAction.Clear]\"\n    }\n    onclick = \"[ConfirmOfferLoanAction.Execute]\"  # 左键点击时执行的脚本\n    text_single = { text = \"Offer loan\" }  # 文本组件，用于显示一行文字\n}"}], "sources": [], "tags": [], "links": [], "used_by": ["button"]}]}</script>
<script>
'use strict';
const seed = JSON.parse(document.getElementById('DATA').textContent);
let ENTRIES = seed.entries;
const STATE = { regex:false, kinds:new Set(['Key','Event','Component','Group']), id:null };
const q = document.getElementById('q');
const res = document.getElementById('results');
const entry = document.getElementById('entry');
// 事件绑定——按钮一定可用
document.getElementById('btnSearch').onclick = ()=> render(q.value);
document.getElementById('btnClear').onclick = ()=>{ q.value=''; render(''); };
document.getElementById('btnRegex').onclick = (e)=>{
  STATE.regex = !STATE.regex;
  e.currentTarget.setAttribute('aria-pressed', STATE.regex);
  if(STATE.regex && !q.value.includes('re:true')) q.value = (q.value?' '+q.value:'') + ' re:true';
};
document.getElementById('btnHelp').onclick = ()=> alert([
  '搜索：',
  '· 默认 AND（position alpha）',
  '· OR（position OR alpha）',
  '· 排除（position -alpha）',
  '· 字段：type:key|event|component|group；parent:icon',
  '· 正则：加 re:true，例如 on.*click re:true'
].join('\\n'));
// 回车 = 搜索
q.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnSearch').click(); });
// 筛选 chip
document.querySelectorAll('.chip').forEach(ch=>{
  ch.onclick = ()=>{
    const k = ch.dataset.kind;
    const pressed = ch.getAttribute('aria-pressed')==='true';
    ch.setAttribute('aria-pressed', (!pressed).toString());
    if(!pressed) STATE.kinds.add(k); else STATE.kinds.delete(k);
    render(q.value);
  };
});

// 简单文本索引
function buildIndex(entries){
  return entries.map(e=>({ id:e.id, name:e.name, kind:e.kind, parents:(e.parents||[]).join(' '),
    text:[e.name,e.kind,(e.parents||[]).join(' '),e.description,(e.tags||[]).join(' '),(e.used_by||[]).join(' ')].join(' ').toLowerCase()
  }));
}
let INDEX = buildIndex(ENTRIES);

function parseQuery(qs){
  const tokens=[]; const re=/"([^"]+)"|(\S+)/g; let m; while((m=re.exec(qs))!==null) tokens.push(m[1]||m[2]);
  const filters={}; const terms=[]; let regex=STATE.regex;
  for(const t of tokens){
    if(/^re:(true|1|yes)$/i.test(t)) { regex=true; continue; }
    const fm=t.match(/^(type|parent):(.+)$/i);
    if(fm){ filters[fm[1].toLowerCase()]=fm[2].toLowerCase(); continue; }
    terms.push(t);
  }
  return {filters,terms,regex};
}

function doSearch(qs){
  const {filters,terms,regex}=parseQuery(qs.trim());
  const results=[];
  for(const doc of INDEX){
    if(!STATE.kinds.has(doc.kind)) continue;
    if(filters.type && doc.kind.toLowerCase()!==filters.type) continue;
    if(filters.parent && !doc.parents.toLowerCase().includes(filters.parent)) continue;

    let pass=true;
    if(regex || /(^|\s)re:true(\s|$)/i.test(qs)){
      for(const t of terms){
        if(/^(type|parent):/i.test(t)||/^re:/i.test(t)) continue;
        try{ const r=new RegExp(t,'i'); if(!r.test(doc.text)) { pass=false; break; } }catch(err){ pass=false; break; }
      }
    }else{
      const inc=terms.filter(t=>!t.startsWith('-')); const exc=terms.filter(t=>t.startsWith('-')).map(s=>s.slice(1).toLowerCase());
      for(const t of inc){ if(!doc.text.includes(t.toLowerCase())) { pass=false; break; } }
      if(pass){ for(const t of exc){ if(doc.text.includes(t)) { pass=false; break; } } }
    }
    if(pass) results.push(doc);
  }
  // 简易权重：精确名 > 名称包含
  results.sort((a,b)=>{
    const ql = qs.toLowerCase();
    const w=(d)=> (d.name.toLowerCase()===ql?50:0) + (d.name.toLowerCase().includes(ql)?10:0);
    const dw = w(b)-w(a);
    return dw!==0?dw:a.name.localeCompare(b.name);
  });
  return results.slice(0,400);
}

function highlight(s,qs){
  if(!qs) return escapeHtml(s);
  try{
    if(STATE.regex || /(^|\s)re:true(\s|$)/i.test(qs)){
      const body = qs.replace(/(^|\s)re:true(\s|$)/ig,' ').trim();
      const rx = new RegExp(body,'ig');
      return escapeHtml(s).replace(rx, m=> `<mark>${m}</mark>`);
    }
  }catch(e){}
  const words = qs.split(/\s+/).filter(Boolean).map(x=>x.toLowerCase()).filter(x=>!/^re:|^type:|^parent:/i.test(x) && x!=='or');
  let out = escapeHtml(s);
  for(const w of words){ out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>`<mark>${m}</mark>`); }
  return out;
}
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(qs){
  const rows = doSearch(qs||'');
  res.innerHTML = rows.map(r=>{
    const e = ENTRIES.find(x=>x.id===r.id);
    const info = [e.kind,(e.parents||[]).join(' / ')].filter(Boolean).join(' · ');
    return `<div class="result" data-id="${e.id}">
      <div><b>${highlight(e.name,qs||'')}</b></div>
      <div class="muted">${escapeHtml(info)}</div>
    </div>`;
  }).join('') || `<div class="result"><span class="muted">没有结果。请减少关键词或关闭 Regex。</span></div>`;
  res.querySelectorAll('.result').forEach(el=> el.onclick = ()=> openEntry(el.dataset.id));
  if(STATE.id){ openEntry(STATE.id); }
}

function autolink(text){
  // 只在普通文本中做简单词条自动链接（避免 code/pre）
  const names = ENTRIES.map(e=>e.name).sort((a,b)=> b.length-a.length).slice(0,300);
  let html = escapeHtml(text).replace(/\\n/g,'<br>');
  for(const nm of names){
    const esc = nm.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');
    html = html.replace(new RegExp(`(^|[^\\w])(${esc})(?![\\w])`,'g'), (m,p1,p2)=> `${p1}<a href="#" data-jump="${nm}">${nm}</a>`);
  }
  return html;
}

function openEntry(id){
  STATE.id = id;
  const e = ENTRIES.find(x=>x.id===id); if(!e) return;
  const used = (e.used_by||[]).map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join(' ');
  const examples = (e.examples||[]).map(ex=> `<pre><code class="language-${ex.language||'gui'}">${escapeHtml(ex.code||'')}</code></pre>`).join('');
  const desc = autolink(e.description||'');
  entry.innerHTML = `
    <div class="muted">${escapeHtml((e.parents||[]).join(' › '))}</div>
    <h2>${escapeHtml(e.name)} <span class="pill">${escapeHtml(e.kind)}</span></h2>
    <div>${desc || '<span class="muted">（暂无说明）</span>'}</div>
    <div class="hr"></div>
    <div><b>可被以下组件使用：</b> ${used || '<span class="muted">—</span>'}</div>
    ${examples? `<div class="hr"></div><div><b>示例</b></div>${examples}`:''}
  `;
  // 文内跳转
  entry.querySelectorAll('a[data-jump]').forEach(a=> a.onclick = (ev)=>{ ev.preventDefault(); const nm=a.getAttribute('data-jump'); const t=ENTRIES.find(x=>x.name===nm); if(t){ openEntry(t.id); const rEl=res.querySelector(`[data-id="${t.id}"]`); if(rEl) rEl.scrollIntoView({block:'nearest'});} });
}

// 初次渲染：显示全部（按名称排序）
render('');
</script>
</body>
</html>
