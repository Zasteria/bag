<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索关键字</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #result {
            margin-top: 20px;
        }
        .file-item {
            margin: 5px 0;
        }
        .file-link {
            color: blue;
            cursor: pointer;
            text-decoration: underline;
        }
        .language-buttons, .search-options, .additional-options {
            margin-bottom: 20px;
        }
        .language-button, .search-option, .additional-option {
            margin-right: 10px;
            cursor: pointer;
        }
        .selected {
            background-color: #ddd;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 id="title">搜索关键字</h1>
    <div class="language-buttons">
        <button class="language-button" onclick="setLanguage('zh')">中文</button>
        <button class="language-button" onclick="setLanguage('en')">English</button>
    </div>
    <input type="text" id="keyword" placeholder="输入关键字">
    <input type="file" id="fileInput" webkitdirectory directory multiple>
    <div class="search-options">
        <button class="search-option" onclick="setSearchOption('txt_gui')" id="searchOptionTxtGui">搜索txt和gui文件</button>
        <button class="search-option" onclick="setSearchOption('yml')" id="searchOptionYml">只搜索yml文件</button>
        <button class="search-option" onclick="setSearchOption('all')" id="searchOptionAll">同时搜索全部文件</button>
    </div>
    <div class="additional-options">
        <label class="additional-option">
            <input type="checkbox" id="caseInsensitive" /> 忽略大小写
        </label>
    </div>
    <button onclick="searchKeyword()" id="searchButton">搜索</button>

    <div id="result"></div>

    <script>
        const translations = {
            zh: {
                title: "搜索关键字",
                placeholder: "输入关键字",
                searchButton: "搜索",
                alertKeyword: "巧妇难为无米之炊",
                alertDirectory: "请选择一个目录",
                footer: "本网页只在本地运行，不需要网络。请给予必要的JS权限（如果没有）。本网页专为Victoria 3设计，也可以在其他Paradox的游戏文件运行。",
                searchTxtGui: "搜索txt和gui文件",
                searchYml: "只搜索yml文件",
                searchAll: "同时搜索全部文件",
                caseInsensitive: "忽略大小写",
                pathCopied: "文件相对路径已复制到剪贴板：\n",
                copyFailed: "复制路径失败！"
            },
            en: {
                title: "Search Keywords",
                placeholder: "Enter keyword",
                searchButton: "Search",
                alertKeyword: "You can't make bricks without straw",
                alertDirectory: "Please select a directory",
                footer: "This webpage runs locally and does not require the internet. Please allow necessary JS permissions if not already granted. This page is designed for Victoria 3, but it can also work with files from other Paradox games.",
                searchTxtGui: "Search txt and gui files",
                searchYml: "Search yml files only",
                searchAll: "Search all files",
                caseInsensitive: "Case Insensitive",
                pathCopied: "File relative path copied to clipboard:\n",
                copyFailed: "Copy path failed!"
            }
        };

        let searchOption = 'txt_gui';

        function setLanguage(lang) {
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('keyword').placeholder = translations[lang].placeholder;
            document.getElementById('searchButton').textContent = translations[lang].searchButton;
            document.getElementById('searchOptionTxtGui').textContent = translations[lang].searchTxtGui;
            document.getElementById('searchOptionYml').textContent = translations[lang].searchYml;
            document.getElementById('searchOptionAll').textContent = translations[lang].searchAll;
            const footer = document.querySelector('footer p');
            if (footer) footer.textContent = translations[lang].footer;
            const caseInsensitiveLabel = document.querySelector('label.additional-option');
            if (caseInsensitiveLabel) caseInsensitiveLabel.lastChild.textContent = ' ' + translations[lang].caseInsensitive;
            document.documentElement.lang = lang;
        }

        function setSearchOption(option) {
            searchOption = option;
            document.getElementById('searchOptionTxtGui').classList.remove('selected');
            document.getElementById('searchOptionYml').classList.remove('selected');
            document.getElementById('searchOptionAll').classList.remove('selected');
            
            if (option === 'txt_gui') {
                document.getElementById('searchOptionTxtGui').classList.add('selected');
            } else if (option === 'yml') {
                document.getElementById('searchOptionYml').classList.add('selected');
            } else if (option === 'all') {
                document.getElementById('searchOptionAll').classList.add('selected');
            }
        }

        function searchKeyword() {
            const keyword = document.getElementById('keyword').value;
            const files = document.getElementById('fileInput').files;
            const resultDiv = document.getElementById('result');
            const lang = document.documentElement.lang || 'zh';
            const trans = translations[lang];
            const caseInsensitive = document.getElementById('caseInsensitive').checked;
            const regexFlags = caseInsensitive ? 'gi' : 'g';
            const regex = new RegExp(keyword, regexFlags);

            resultDiv.innerHTML = '';  // 清空结果显示区域

            if (!keyword) {
                alert(trans.alertKeyword);
                return;
            }

            if (files.length === 0) {
                alert(trans.alertDirectory);
                return;
            }

            Array.from(files).forEach(file => {
                if ((searchOption === 'txt_gui' && (file.name.endsWith('.txt') || file.name.endsWith('.gui'))) ||
                    (searchOption === 'yml' && file.name.endsWith('.yml')) ||
                    (searchOption === 'all' && (file.name.endsWith('.txt') || file.name.endsWith('.gui') || file.name.endsWith('.yml') ||
                        file.name.endsWith('.json') || file.name.endsWith('.xml') || file.name.endsWith('.csv') || file.name.endsWith('.log') ||
                        file.name.endsWith('.md') || file.name.endsWith('.ini') || file.name.endsWith('.conf') || file.name.endsWith('.cfg') ||
                        file.name.endsWith('.html') || file.name.endsWith('.css') || file.name.endsWith('.js')))) {
                    
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const fileContent = event.target.result;
                        if (regex.test(fileContent)) {
                            const fileItem = document.createElement('div');
                            fileItem.className = 'file-item';
                            
                            const fileLink = document.createElement('a');
                            fileLink.className = 'file-link';
                            fileLink.textContent = file.webkitRelativePath;
                            fileLink.href = "#";

                            // 左键点击：在新窗口中打开并高亮
                            fileLink.onclick = function() {
                                openFileInNewWindow(file.webkitRelativePath, fileContent, new RegExp(keyword, regexFlags));
                                return false;
                            };

                            // 右键点击：复制文件相对路径
                            fileLink.oncontextmenu = function(e) {
                                e.preventDefault();
                                navigator.clipboard.writeText(file.webkitRelativePath).then(() => {
                                    alert(trans.pathCopied + file.webkitRelativePath);
                                }).catch(err => {
                                    console.error('Could not copy path: ', err);
                                    alert(trans.copyFailed);
                                });
                            };

                            fileItem.appendChild(fileLink);
                            resultDiv.appendChild(fileItem);
                        }
                    };
                    reader.readAsText(file);
                }
            });
        }

        function openFileInNewWindow(filePath, fileContent, regex) {
            const newWindow = window.open();
            // 使用pre标签来保留原始格式，并进行HTML转义以防内容被当作HTML解析
            const escapedContent = fileContent.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const highlightedContent = escapedContent.replace(
                regex,
                '<span style="background-color: yellow; color: red; font-weight: bold;">$&</span>'
            );
            newWindow.document.write(`
                <html>
                <head>
                    <title>${filePath}</title>
                </head>
                <body>
                    <pre>${highlightedContent}</pre>
                </body>
                </html>
            `);
            newWindow.document.close();
        }

        // 根据浏览器语言设置默认语言
        function detectLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            return browserLang.startsWith('zh') ? 'zh' : 'en';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const defaultLang = detectLanguage();
            setLanguage(defaultLang);
            setSearchOption('txt_gui');
        });
    </script>
    <footer>
        <p>本网页只在本地运行，不需要网络。请给予必要的JS权限（如果没有）。本网页专为Victoria 3设计，也可以在其他Paradox的游戏文件运行。</p>
    </footer>
</body>
</html>
