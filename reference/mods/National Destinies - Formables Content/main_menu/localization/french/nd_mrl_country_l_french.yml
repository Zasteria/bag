l_french:
 MRL: "Maharlik"
 MRL_ADJ: "Maharlikan"
 MRL_f: "Maharlik"
 MRL_f_desc: "Les maharlika étaient la classe guerrière noble de la société tagalog, les hommes libres qui portaient des armes à côté de leurs datus et rajahs. Leurs apparentés, les timawa des Visayas, les maginoo des régimes politiques côtiers de Luzon et les bagani de Mindanao, formaient l'épine dorsale martiale de chaque peuple philippin, d'Aparri à Sulu. Maharlika est la nation pan-archipel que l'histoire n'a jamais produite : un régime politique autochtone unifié liant Luzon, les Visayas et Mindanao sous l'idéal de l'homme libre, avant que les galions espagnols puissent atteindre Cebu. Formez Maharlika pour forger la civilisation philippine qui a chassé, ou tout simplement survécu, à toutes les incursions européennes, hollandaises et brunéiennes."
