l_french:
 GBU: "Grande Bourgogne"
 GBU_ADJ: "Bourguignon"
 GBU_f: "Grande Bourgogne"
 GBU_f_desc: "L'Empire du Milieu bourguignon renaît. Forgée à partir du couloir de richesse que Philippe le Bon et Charles le Téméraire ont soudé en un seul État composite, la Grande Bourgogne réunit les villes flamandes, les marches wallonnes, la Lorraine, le Comté Libre et le cœur ducal en un royaume souverain ne répondant ni à Paris ni à l'Empire. La couronne que Charles cherchait à Trèves est enfin posée sur les fronts bourguignons, l'Ordre de la Toison d'Or étant son épine dorsale chevaleresque."
