l_french:
 STATIC_MODIFIER_NAME_nd_great_law_of_peace: "La grande loi de la paix"
 STATIC_MODIFIER_DESC_nd_great_law_of_peace: "Le Kaianere'ko:wa lie les Cinq Nations sous l'Arbre de la Grande Paix, ses racines s'étendant dans toutes les directions. Les différends sont résolus en conseil et non par la guerre entre nous. La force de la Maison Longue, c'est l'unité."
 STATIC_MODIFIER_NAME_nd_war_road_of_the_longhouse: "Route de guerre de la maison longue"
 STATIC_MODIFIER_DESC_nd_war_road_of_the_longhouse: "Les Haudenosaunee étendent leur portée le long des routes de guerre, leurs guerriers parcourant de longues distances pour ramener des captifs, des fourrures et des hommages à la Maison Longue. Ce que décide le conseil, les parties à la guerre l'appliquent."
 nd_iro.1.t: "La Confédération unie"
 nd_iro.1.d: "The five fires of the Haudenosaunee burn as one. From the eastern door of the Kanienkehaka to the western door of the Onondowaga, the nations have gathered beneath the Tree of Great Peace at Onondaga, where the Great Peacemaker Deganawida planted it generations ago. The fifty sachems of the Grand Council sit in their appointed places, the white roots of peace spreading in every direction.\n\nBut a confederacy must choose its path. Will we extend the roots of peace through diplomacy and council, binding other nations to our law? Or will we follow the war roads, our warriors carrying the name of the Longhouse to the edges of the world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_iro.1.a: "Que les racines de la paix s’étendent à toutes les nations."
 nd_iro.1.b: "Les routes de guerre porteront notre nom loin."
 nd_iro.2.t: "La guerre des castors"
 nd_iro.2.d: "The fur trade has transformed the world of the Great Lakes. European traders hunger for beaver pelts, and the Haudenosaunee stand at the crossroads between the Dutch at Fort Orange and the vast hunting grounds of the interior. But our rivals (the Wendat, the Neutrals, the Erie) control the western beaver territories.\n\nSince the 1640s, our warriors have carried muskets alongside their war clubs, striking deep into enemy territory with devastating effect. The Wendat Confederacy has been shattered, their survivors scattered. The Great Lakes lie open before us. But with dominance comes a choice: do we seize control of the trade routes by force, or do we establish ourselves as the indispensable middlemen, playing the Europeans against each other while we grow rich on the passage of furs?"
 nd_iro.2.a: "Nous dominerons le commerce des fourrures par la force."
 nd_iro.2.b: "Nous serons les intermédiaires entre toutes les nations."
 nd_iro.3.t: "La chaîne d'alliance"
 nd_iro.3.d: "A silver chain has been forged between the Haudenosaunee and the English Crown: three links representing Peace, Friendship, and Respect. This Covenant Chain is no mere treaty but a living relationship, polished and renewed at regular councils where grievances are heard and gifts exchanged. Through the Chain, the Haudenosaunee speak for many nations, carrying the concerns of the western peoples to the English and receiving European trade goods in return.\n\nThe Chain gives us leverage no other native nation possesses. But leverage is a tool that cuts both ways. Do we bind ourselves more closely to the English alliance, gaining their weapons and trade, or do we maintain our independence, playing the English against the French as we have always done?"
 nd_iro.3.a: "Polissez la chaîne en argent. Notre alliance nous rend forts."
 nd_iro.3.b: "Nous ne répondons à aucun roi européen. Notre indépendance est notre force."
 nd_iro.4.t: "La Sixième Nation"
 nd_iro.4.d: "The Tuscarora have come from the south, refugees from a devastating war with the English colonists of Carolina. They speak a language akin to our own, and their suffering demands our response. The clan mothers have deliberated, and the Grand Council has agreed: the Tuscarora shall be adopted into the Confederacy under the protection of the Oneida, seated beside the younger brothers of the Longhouse.\n\nFrom five fires, we become six. The Longhouse grows longer, its strength renewed by those who seek shelter beneath its rafters. This is the genius of the Confederacy: not conquest, but adoption. Not destruction, but incorporation. The tree has grown new roots."
 nd_iro.4.a: "La maison longue s'allonge de plus en plus."
 nd_iro.5.t: "La religion des maisons longues"
 nd_iro.5.d: "Handsome Lake, a Seneca sachem who fell gravely ill, has received visions from the Creator. In his Code, he preaches against the evils that have crept into Haudenosaunee life since European contact: alcohol, witchcraft, domestic violence. But he also calls for a return to the ancient ceremonies, the Thanksgiving Address, the seasonal festivals that have sustained the People of the Longhouse since time immemorial.\n\nThe Longhouse Religion, as his followers call it, is neither purely traditional nor purely new. It adapts ancient practices to the realities of a changed world, offering the Haudenosaunee a path to cultural survival when the old ways seem under siege from every direction. From the ashes of despair, a spiritual fire has been rekindled."
 nd_iro.5.a: "La parole du Créateur nous guidera."
 STATIC_MODIFIER_NAME_nd_iro_beaver_wars_dominance: "Dominance du commerce des fourrures"
 STATIC_MODIFIER_DESC_nd_iro_beaver_wars_dominance: "Les guerriers Haudenosaunee ont brisé les confédérations rivales et pris le contrôle du commerce des fourrures dans les Grands Lacs, acheminant les peaux de castor à travers leur territoire vers les marchés européens."
 STATIC_MODIFIER_NAME_nd_iro_beaver_wars_diplomacy: "Courtiers du commerce des fourrures"
 STATIC_MODIFIER_DESC_nd_iro_beaver_wars_diplomacy: "Plutôt que de monopoliser le commerce par la seule force, les Haudenosaunee se sont positionnés comme des intermédiaires indispensables entre les commerçants européens et les peuples de l'intérieur."
 STATIC_MODIFIER_NAME_nd_iro_covenant_chain_alliance: "Chaîne d'alliance en argent"
 STATIC_MODIFIER_DESC_nd_iro_covenant_chain_alliance: "La chaîne d'alliance raffinée avec la Couronne anglaise donne aux Haudenosaunee un accès privilégié aux marchandises commerciales, à la reconnaissance diplomatique et à la coopération militaire."
 STATIC_MODIFIER_NAME_nd_iro_covenant_chain_independence: "Souverain entre empires"
 STATIC_MODIFIER_DESC_nd_iro_covenant_chain_independence: "Les Haudenosaunee maintiennent leur indépendance en refusant toute allégeance permanente à toute puissance européenne, utilisant la menace d'un changement d'alliance pour obtenir des concessions des Français et des Anglais."
 nd_iro_great_law: "La grande loi de la paix"
 nd_iro_great_law_desc: "Le Kaianere'ko:wa, la constitution orale de la Confédération Haudenosaunee, établit une gouvernance par consensus parmi les cinquante sachems du Grand Conseil."
 nd_iro_longhouse_governance: "Gouvernance des maisons longues"
 nd_iro_longhouse_governance_desc: "La maison longue sert à la fois d'habitation communautaire et d'unité politique, où les mères de clan sélectionnent des sachems et où plusieurs familles partagent leurs ressources sous un même toit."
 nd_iro_mourning_wars: "Tradition de guerre de deuil"
 nd_iro_mourning_wars_desc: "Lorsque la mort affaiblit le clan, les groupes de guerre attaquent les peuples voisins pour capturer des remplaçants qui sont adoptés dans la famille, rétablissant ainsi l'équilibre spirituel."
 nd_iro_three_sisters_agriculture: "Agriculture des Trois Sœurs"
 nd_iro_three_sisters_agriculture_desc: "Le maïs, les haricots et les courges (les Trois Sœurs) sont plantés ensemble dans des monticules, chaque plante soutenant les autres : le maïs fournit des tiges sur lesquelles les haricots peuvent grimper, les haricots fixent l'azote du maïs et les courges ombragent le sol."
 nd_iro_canoe_warfare: "Guerre en canoë"
 nd_iro_canoe_warfare_desc: "Les groupes de guerre Haudenosaunee voyagent en canot d'écorce, coulant leurs navires sous les rochers le jour et pagayant toute la nuit pour frapper loin de chez eux avant de battre en retraite."
 nd_iro_palisade_defense: "Fortification de palissade"
 nd_iro_palisade_defense_desc: "Les villages Haudenosaunee sont entourés de trois rangées de pieux aiguisés entrelacés d'écorce, avec des plates-formes contenant des pierres et des jarres d'eau pour repousser les attaquants."
 nd_iro_wampum_diplomacy: "Diplomatie wampum"
 nd_iro_wampum_diplomacy_desc: "Les chaînes et les ceintures de perles de coquillage servent de lettres de créance diplomatiques, de documents de traités et de dispositifs mnémotechniques, codant les accords dans des motifs violets et blancs."
 nd_iro_forest_tactics: "Tactiques des guerriers forestiers"
 nd_iro_forest_tactics_desc: "Les guerriers entraînés au combat dans les bois combattent depuis une embuscade parmi les arbres, utilisant leur connaissance approfondie du terrain pour déjouer des forces plus importantes."
 nd_iro_clan_mothers: "Autorité mère du clan"
 nd_iro_clan_mothers_desc: "Les mères de clan détiennent le pouvoir de nommer et destituer les sachems, d'approuver les déclarations de guerre et de distribuer les récoltes : la véritable autorité politique de la Maison Longue."
 nd_iro_condolence_ceremony: "Cérémonie de condoléances"
 nd_iro_condolence_ceremony_desc: "Lorsqu'un sachem meurt, la cérémonie de condoléances purifie l'esprit des personnes en deuil, essuie leurs larmes et élève un nouveau chef pour occuper le siège vide du Grand Conseil."
 nd_iro_council_fire_tradition: "L'incendie du Conseil"
 nd_iro_council_fire_tradition_desc: "Le feu central d'Onondaga ne s'éteint jamais. Ici, les cinquante sachems se réunissent pour débattre de questions affectant toutes les nations, leurs décisions liant l'ensemble de la Confédération."
 nd_iro_fur_trade_network: "Réseau de commerce des fourrures"
 nd_iro_fur_trade_network_desc: "Les chasseurs et commerçants Haudenosaunee opèrent à travers un vaste réseau s'étendant de la côte atlantique aux Grands Lacs, échangeant des peaux de castor contre des produits manufacturés européens."
 nd_iro_firearms_adoption: "Adoption des armes à feu"
 nd_iro_firearms_adoption_desc: "Grâce au commerce avec les Néerlandais à Fort Orange, les guerriers Haudenosaunee obtiennent des mousquets et apprennent à les intégrer aux tactiques traditionnelles d'embuscade et de raid."
 nd_iro_war_chief_system: "Système de chef de guerre"
 nd_iro_war_chief_system_desc: "Des chefs de guerre reconnus, élevés lors de cérémonies et éprouvés au combat, dirigent des escouades disciplinées de guerriers expérimentés dans des campagnes bien au-delà des frontières de la Confédération."
 nd_iro_beaver_wars: "La guerre des castors"
 nd_iro_beaver_wars_desc: "Les Haudenosaunee mènent une campagne de plusieurs décennies pour contrôler le commerce des fourrures dans les Grands Lacs, brisant les confédérations rivales et établissant leur domination sur un vaste territoire."
 nd_iro_two_row_wampum: "Wampum à deux rangées"
 nd_iro_two_row_wampum_desc: "Le Guswenta, deux rangées parallèles de perles violettes sur fond blanc, représente deux vaisseaux voyageant côte à côte, sans interférer avec l'autre. C’est le fondement de la souveraineté des Haudenosaunee."
 nd_iro_advanced_fortifications: "Fortifications avancées"
 nd_iro_advanced_fortifications_desc: "Les ingénieurs Haudenosaunee intègrent les concepts défensifs européens dans les conceptions de palissades traditionnelles, créant ainsi de formidables défenses de village avec de multiples murs et bastions."
 nd_iro_adoption_system: "Système d'adoption"
 nd_iro_adoption_system_desc: "Des captifs de guerre sont offerts aux familles en deuil pour remplacer les morts. Les personnes adoptées deviennent des membres à part entière du clan, leur ancienne identité étant dissoute alors qu'elles assument un nouveau nom et un nouveau rôle."
 nd_iro_lacrosse_tradition: "Tradition de crosse"
 nd_iro_lacrosse_tradition_desc: "Le jeu du créateur (crosse) sert à la fois de compétition cérémoniale et d'entraînement de guerrier, avec des matchs entre villages impliquant parfois des centaines de joueurs dans une compétition sportive féroce."
 nd_iro_covenant_chain: "La chaîne d'alliance"
 nd_iro_covenant_chain_desc: "Une série d'accords d'alliance entre les Haudenosaunee et la Couronne anglaise, symbolisés par une chaîne en argent à trois maillons : Paix, Amitié et Respect."
 nd_iro_musket_mastery: "Maîtrise du mousquet"
 nd_iro_musket_mastery_desc: "Les guerriers Haudenosaunee ont entièrement adapté les armes à feu européennes à leur style de guerre, combinant la puissance meurtrière du mousquet avec la mobilité traditionnelle et les compétences de combat en forêt."
 nd_iro_tuscarora_adoption: "Adoption de Tuscarora"
 nd_iro_tuscarora_adoption_desc: "Les Tuscarora, un peuple apparenté de langue iroquoienne chassé de leur patrie de Caroline par la guerre coloniale, sont adoptés dans la Confédération en tant que Sixième Nation."
 nd_iro_wampum_trade_expansion: "Expansion du commerce des wampums"
 nd_iro_wampum_trade_expansion_desc: "La production de wampum s'étend de l'usage cérémonial et diplomatique pour servir de moyen d'échange dans le commerce croissant entre les communautés autochtones et européennes."
 nd_iro_gantowisas: "Gantowisas"
 nd_iro_gantowisas_desc: "Les Gantowisas, conseils de femmes, exercent une autorité décisive sur les questions de guerre et de paix, de distribution de nourriture et de sélection des dirigeants dans toute la Confédération."
 nd_iro_balance_of_power: "Équilibre des pouvoirs"
 nd_iro_balance_of_power_desc: "Les Haudenosaunee exploitent la rivalité entre les colonies françaises et anglaises, changeant d'allégeance et jouant une puissance contre l'autre pour en tirer le maximum d'avantages."
 nd_iro_land_management: "Brûlage contrôlé"
 nd_iro_land_management_desc: "Le brûlage délibéré des sous-bois crée des forêts-parcs ouvertes qui améliorent la chasse, facilitent les déplacements et enrichissent le sol pour la prochaine saison de plantation."
 nd_iro_grand_council_reforms: "Réformes du Grand Conseil"
 nd_iro_grand_council_reforms_desc: "Le Grand Conseil adapte ses procédures pour relever les défis d'un monde en évolution, rationalisant la prise de décision tout en préservant le principe du consensus."
 nd_iro_neutrality_policy: "Politique de neutralité"
 nd_iro_neutrality_policy_desc: "Conscient des dangers de choisir son camp dans les conflits européens, le Grand Conseil adopte une politique de neutralité armée, refusant d'engager la Confédération dans une alliance permanente."
 nd_iro_military_adaptation: "Adaptation militaire"
 nd_iro_military_adaptation_desc: "Les guerriers Haudenosaunee intègrent la discipline militaire européenne aux tactiques traditionnelles, créant ainsi une force polyvalente capable à la fois de guérilla et d'engagements planifiés."
 nd_iro_portage_control: "Contrôle de portage"
 nd_iro_portage_control_desc: "Le contrôle des routes de portage entre les Grands Lacs et les réseaux fluviaux donne aux Haudenosaunee la mainmise sur la circulation des marchandises entre l'intérieur et la côte."
 nd_iro_orenda: "Orenda"
 nd_iro_orenda_desc: "Orenda, le pouvoir spirituel qui traverse tous les êtres vivants, soutient les cérémonies et les traditions qui unissent les Haudenosaunee à travers les générations."
 nd_iro_brant_diplomacy: "La diplomatie de Brant"
 nd_iro_brant_diplomacy_desc: "Joseph Brant, le chef de guerre mohawk Thayendanegea, se rend à Londres pour négocier directement avec la Couronne, démontrant ainsi que les Haudenosaunee sont une nation souveraine capable de faire preuve de diplomatie sur la scène mondiale."
 nd_iro_constitutional_influence: "Influence constitutionnelle"
 nd_iro_constitutional_influence_desc: "Les principes de la Grande Loi (fédéralisme, séparation des pouvoirs, freins et contrepoids) influencent les penseurs des Lumières et les architectes des nouvelles constitutions républicaines."
 nd_iro_buffalo_creek_council: "Conseil de Buffalo Creek"
 nd_iro_buffalo_creek_council_desc: "Le Conseil de Buffalo Creek sert de nouveau centre diplomatique des Haudenosaunee, où les nations négocient avec la jeune république américaine pour la préservation de leurs terres et de leur souveraineté."
 nd_iro_handsome_lake: "La religion des maisons longues"
 nd_iro_handsome_lake_desc: "Le Gaiwiio de Handsome Lake combine d'anciennes cérémonies Haudenosaunee avec de nouveaux enseignements moraux, offrant ainsi une voie de renouveau culturel en période de crise et de dépossession."
 nd_iro_agricultural_modernization: "Modernisation agricole"
 nd_iro_agricultural_modernization_desc: "Les agriculteurs Haudenosaunee adaptent les méthodes de polyculture traditionnelles aux exigences d'une économie de marché, vendant leurs surplus de maïs, de haricots et de courges aux colonies voisines."
 nd_iro_cultural_preservation: "Préservation culturelle"
 nd_iro_cultural_preservation_desc: "Grâce aux efforts dévoués des gardiens de la tradition, les cérémonies, les langues et les histoires des Haudenosaunee perdurent, garantissant que la Maison longue résiste bien au vent du changement."
 nd_iro_grand_river: "Règlement de la rivière Grand"
 nd_iro_grand_river_desc: "La colonie des Six Nations située le long de la rivière Grand devient un centre de la vie des Haudenosaunee, où les peuples reconstruisent leurs communautés et maintiennent leurs traditions confédérées."
 a_nd_iro_war_party: "Fête de la guerre"
 a_nd_iro_war_party_desc: "De petites bandes de guerriers qui voyagent de nuit, sortant des embuscades et se retirant avant que l'ennemi puisse organiser sa résistance. Leur vitesse et leur férocité en font des pillards dévastateurs."
 a_nd_iro_forest_warriors: "Guerriers de la forêt"
 a_nd_iro_forest_warriors_desc: "Combattants expérimentés entraînés au combat en forêt, également habiles au gourdin et au mousquet. Ils se battent derrière les arbres et dans les ravins, utilisant la forêt comme bouclier et comme arme."
 a_nd_iro_war_chief_retinue: "Suite du chef de guerre"
 a_nd_iro_war_chief_retinue_desc: "La suite personnelle d'un chef de guerre condoléant, vétéran de nombreuses campagnes qui ont prouvé leur courage et leur loyauté. Ils forment le noyau discipliné de toute armée Haudenosaunee."
 a_nd_iro_musket_warriors: "Guerriers mousquets"
 a_nd_iro_musket_warriors_desc: "Des guerriers qui maîtrisent parfaitement les armes à feu européennes tout en conservant leur mobilité et leur savoir-faire traditionnels. Ils combinent une puissance de feu dévastatrice avec la capacité de disparaître dans la forêt."
 a_nd_iro_canoe_raiders: "Pillards de canoë"
 a_nd_iro_canoe_raiders_desc: "Des groupes de raids fluviaux parcourent de grandes distances en canoë d'écorce, transportant des fournitures et des armes le long des cours d'eau pour frapper des cibles éloignées de chez eux."
 nd_iro_longhouse: "Maison longue"
 nd_iro_longhouse_desc: "La demeure communautaire emblématique des Haudenosaunee : une structure en bois recouverte d'écorce abritant tout un clan sous un même toit, avec des foyers, des entrepôts et des plates-formes de couchage partagés."
 nd_iro_palisade: "Fortification de palissade"
 nd_iro_palisade_desc: "Une triple rangée de pieux aiguisés entrelacés d'écorce, entourant le village d'une redoutable muraille. Les plates-formes situées au sommet contiennent des tas de pierres et des jarres d'eau pour les défenseurs."
 nd_iro_council_fire: "Incendie du Conseil"
 nd_iro_council_fire_desc: "Le cœur cérémonial et politique de la Confédération, où les sachems se rassemblent autour d'un feu sacré qui ne doit jamais s'éteindre, débattant de questions qui touchent toutes les nations."
 nd_iro_wampum_workshop: "Atelier Wampum"
 nd_iro_wampum_workshop_desc: "Un atelier où les artisans forent, façonnent et enfilent des perles de coquillages dans les cordes et les ceintures wampum qui servent de lettres d'identité diplomatiques, de documents historiques et d'unités d'échange."
 nd_iro_three_sisters_garden: "Jardin des Trois Sœurs"
 nd_iro_three_sisters_garden_desc: "Un jardin de polyculture où le maïs, les haricots et les courges poussent ensemble en monticules : chaque plante soutient les autres dans un système qui produit plus de nourriture par acre que la monoculture européenne."
 nd_iro_longhouse_maintenance: "Entretien de la maison longue"
 nd_iro_longhouse_maintenance_desc: "L'entretien de la maison longue nécessite le remplacement régulier du revêtement en écorce d'orme, du bois de construction, des outils de réparation et des fibres pour les saisines et les cordages."
 nd_iro_palisade_upkeep: "Entretien de la palissade"
 nd_iro_palisade_upkeep_desc: "Les murs à triple palissade nécessitent des réparations et un renforcement constants avec du bois frais, de la pierre et des outils pour affûter et réinstaller les piquets."
 nd_iro_council_fire_ceremony: "Cérémonies du Conseil"
 nd_iro_council_fire_ceremony_desc: "Les rituels et cérémonies du Grand Conseil nécessitent de la cire d'abeille pour les torches, du papier pour enregistrer les décisions et des fourrures comme cadeaux et hommages lors des conseils formels."
 nd_iro_wampum_crafting: "Fabrication de wampums"
 nd_iro_wampum_crafting_desc: "Les artisans transforment des coquillages et des pierres en perles qui constituent le fondement de la diplomatie et de la tenue de registres des Haudenosaunee, utilisant des outils en os et en pierre pour percer les perles et des cordes en fibres pour les enfiler."
 nd_iro_polyculture_upkeep: "Entretien de la polyculture"
 nd_iro_polyculture_upkeep_desc: "Le maïs de semence doit être réservé à chaque récolte pour planter les jardins des Trois Sœurs de la saison suivante, tandis que le bois est utilisé pour construire des monticules surélevés et les outils entretenus pour la culture."
 nd_iro_fur_processing: "Traitement de la fourrure"
 nd_iro_fur_processing_desc: "Transformation des peaux de castor et de cerf selon des méthodes traditionnelles de tannage et de préparation pour le commerce européen des fourrures."
 nd_iro_improved_palisade: "Construction de palissade améliorée"
 nd_iro_improved_palisade_desc: "Murs défensifs améliorés intégrant les principes d'ingénierie européens avec une conception traditionnelle de palissade à trois piquets, nécessitant des outils de construction en bois, en pierre et en fer."
 nd_iro_warrior_training: "Entraînement athlétique du guerrier"
 nd_iro_warrior_training_desc: "Le Jeu du Créateur et d'autres compétitions sportives servent d'entraînement physique rigoureux aux guerriers, avec des bâtons de crosse fabriqués à partir de bois et des armes d'entraînement prêtes à l'emploi."
 nd_iro_wampum_trade: "Commerce de wampums"
 nd_iro_wampum_trade_desc: "Production à grande échelle de perles de wampum destinées à être utilisées comme monnaie dans le commerce croissant entre les communautés autochtones et européennes, le wampum teint ayant une valeur plus élevée et les enregistrements papier permettant de suivre les transactions."
 nd_iro_controlled_burns: "Gestion forestière"
 nd_iro_controlled_burns_desc: "Le brûlage contrôlé des sous-bois crée un parc ouvert qui améliore les terrains de chasse et enrichit les sols agricoles, nécessitant du bois de chauffage et des outils pour gérer les brûlages en toute sécurité."
 nd_iro_portage_trade: "Commerce sur la route du portage"
 nd_iro_portage_trade_desc: "Contrôle et gestion des routes de transport terrestre entre les voies navigables, avec les fourrures comme principale monnaie commerciale et des outils entretenus pour le portage des canots et des marchandises."
 nd_iro_european_diplomacy: "Mission diplomatique européenne"
 nd_iro_european_diplomacy_desc: "Les ambassadeurs Haudenosaunee s'engagent auprès des tribunaux européens et des gouvernements coloniaux en tant que représentants d'une confédération souveraine, présentant leurs lettres de créance en tissu fin et en bijoux wampum tout en entretenant une correspondance écrite."
 nd_iro_treaty_negotiation: "Conseil du traité"
 nd_iro_treaty_negotiation_desc: "Procédures diplomatiques formelles suivant le protocole des Haudenosaunee, avec échanges de wampums, rituels de condoléances éclairés à la cire d'abeille, accords soigneusement enregistrés sur papier et fourrures offertes en cadeau pour sceller l'alliance."
 nd_iro_modern_agriculture: "Agriculture de marché"
 nd_iro_modern_agriculture_desc: "Polyculture traditionnelle adaptée à la production excédentaire, avec du maïs vendu aux colonies voisines, des outils en fer améliorant les rendements et des récipients en poterie stockant les excédents pour le marché."
 levy_nd_iro_war_party: "Prélèvement du parti de guerre Haudenosaunee"
 levy_nd_iro_war_party_desc: "Les guerriers du clan, appelés aux raids par la tradition de la guerre de deuil, voyageaient légers et frappaient rapidement avant de se fondre dans la forêt."
 levy_nd_iro_canoe_raiders: "Prélèvement sur les pillards de canoë"
 levy_nd_iro_canoe_raiders_desc: "Auxiliaires fluviaux qui parcourent de grandes distances en canot d'écorce, transportant des fournitures et des armes le long des voies navigables pour soutenir les groupes de raid."
 nd_iro_formed_tt: "Haudenosaunee a été formé"
 nd_iro_path_a_tt: "Choisissez la Grande Loi de la Paix"
 nd_iro_path_b_tt: "Choisissez la route de guerre de la maison longue"
 nd_iro_destiny: "Destin de la Confédération"
 nd_iro_destiny_desc: "La Confédération Haudenosaunee a été reconstruite. L'Arbre de la Grande Paix se dresse à Onondaga, et les cinquante sachems du Grand Conseil attendent la direction que prendra leur peuple."
 nd_iro_dest_condolence: "Diplomatie des condoléances"
 nd_iro_dest_condolence_desc: "Étendez la cérémonie de condoléances au-delà de la Confédération. Adoptez les principes de gouvernance méritocratique et accumulez les richesses nécessaires pour financer les missions diplomatiques dans le nord-est."
 nd_iro_dest_silver_chain: "La chaîne en argent"
 nd_iro_dest_silver_chain_desc: "Forgez un réseau diplomatique s'étendant de Cataraqui sur le lac Ontario à Shackamaxon sur le Delaware. Contrôlez les carrefours commerciaux qui rendent les Haudenosaunee indispensables à toutes les puissances de la région."
 nd_iro_dest_great_binding: "La grande loi contraignante"
 nd_iro_dest_great_binding_desc: "Le Kaianere'ko:wa devient un modèle de gouvernance à travers le continent. Atteignez un tel prestige que même des peuples éloignés cherchent à étudier la Grande Loi. Construisez l’Arbre de la Grande Paix comme monument durable de la gouvernance confédérée."
 nd_iro_dest_mourning_raids: "Raids de deuil"
 nd_iro_dest_mourning_raids_desc: "Portez la guerre de deuil au cœur du pays Wendat à Cahiague. Construisez une armée digne des routes de guerre et remplissez les sièges vides de la Maison Longue avec des captifs du nord."
 nd_iro_dest_beaver_conquest: "Conquête de la guerre des castors"
 nd_iro_dest_beaver_conquest_desc: "Brisez les rivaux restants. Prenez Détroit et le pays Sandusky pour contrôler les zones occidentales des castors et la rive sud des Grands Lacs."
 nd_iro_dest_longhouse_empire: "Empire de la Maison Longue"
 nd_iro_dest_longhouse_empire_desc: "Prolongez les routes de guerre jusqu'à Checagou et Mackinac, les détroits les plus éloignés des Grands Lacs. Construisez le War Lodge comme siège d'une puissance militaire qui domine l'intérieur du continent."
 nd_iro.6.t: "La voie de la Confédération"
 nd_iro.6.d: "Les Haudenosaunee se trouvent à la croisée des chemins. Les cinquante sachems se sont rassemblés au Feu du Conseil, les nations réunies sous un même toit. Les racines blanches de la paix s’étendent dans toutes les directions, mais la direction dans laquelle la Confédération se développera dépend des décisions prises au sein de ce conseil. Les gens de la Maison Longue resteront-ils dans les mémoires comme des maîtres de la diplomatie ou comme des conquérants dont les routes de guerre atteignaient les confins du monde ?"
 nd_iro.6.a: "Le Feu du Conseil brûle vivement."
 nd_iro.7.t: "Les condoléances vont plus loin"
 nd_iro.7.d: "Ce qui a commencé comme une cérémonie pour pleurer les morts et élever de nouveaux chefs est devenu le fondement d’une tradition diplomatique pas comme les autres. Lorsque les Haudenosaunee envoient des délégations de condoléances à des peuples éloignés, ils transportent non seulement des mots de réconfort, mais tout un système de gouvernance : l'idée que le deuil peut se transformer en renouveau politique, que le deuil peut bâtir des alliances plus fortes que n'importe quel pacte militaire. Les nations qui craignaient autrefois la Maison Longue envoient désormais leurs propres délégations à Onondaga, désireuses d'apprendre l'art du conseil et du consensus."
 nd_iro.7.a: "Nous clarifions l'esprit de tous ceux qui sont en deuil."
 nd_iro.8.t: "Polissage de la chaîne"
 nd_iro.8.d: "The diplomatic network has grown into something unprecedented: a web of alliances, trade agreements, and mutual obligations stretching across the northeast. The Silver Chain connecting the Haudenosaunee to the European powers and to other native confederacies must be constantly polished and renewed through councils, gift exchanges, and careful negotiation.\n\nBut there are two ways to tend such a chain. We can bind ourselves more closely to our partners, becoming the indispensable center of a great alliance system. Or we can maintain our independence, using the chain not to bind but to balance, playing each partner against the others while the Haudenosaunee grow wealthy on the tensions between them."
 nd_iro.8.a: "Attachez la chaîne plus fort. L'alliance fait la force."
 nd_iro.8.b: "Nous sommes souverains entre toutes les nations."
 nd_iro.9.t: "La Constitution vivante"
 nd_iro.9.d: "Travelers come from distant lands to study the Great Law. They marvel at the balance of powers within the Confederacy: the clan mothers who select the sachems, the Grand Council that debates matters of war and peace, the consensus principle that ensures no nation is overridden by the will of the majority. Philosophers write that the Haudenosaunee have achieved what European thinkers can only theorize about.\n\nThis recognition presents a choice. We can embrace our role as constitutional pioneers, building the institutions that make the Great Law visible and enduring. Or we can turn inward, using the Great Law's strength to renew Haudenosaunee culture from within, feeding our people, training our leaders, and ensuring the Longhouse endures as a living civilization rather than a philosopher's curiosity."
 nd_iro.9.a: "Laissez le monde apprendre de la Grande Loi."
 nd_iro.9.b: "La Loi existe pour soutenir notre peuple."
 nd_iro.10.t: "Les routes de guerre ouvertes"
 nd_iro.10.d: "Les chefs de guerre ont parlé. Les guerres de deuil ne se limiteront plus à de petites rafles de captifs. Elles deviendront des campagnes de conquête. Les Wendats, les Neutres, les Pétuns : tous ceux qui bloquent l’expansion de la Maison Longue seront balayés. Leurs villes seront incendiées, leurs habitants adoptés ou dispersés, leurs terrains de chasse absorbés dans le vaste territoire des Haudenosaunee. Les routes de guerre s'étendent au nord et à l'ouest de la patrie, et les guerriers aiguisent leurs armes à la lueur vacillante du feu."
 nd_iro.10.a: "La Maison Longue ne doit avoir aucun siège vide."
 nd_iro.11.t: "Maîtres du territoire des castors"
 nd_iro.11.d: "Detroit has fallen. The Sandusky country is ours. Where once rival peoples controlled the western beaver trade, now Haudenosaunee hunters range freely across the Great Lakes watershed. The furs flow through our hands to the European traders, and every pelt that passes enriches the Confederacy.\n\nBut conquest creates its own dilemmas. We have defeated these peoples, but the empty lands profit no one. Do we wage total war, breaking the survivors so completely that resistance becomes impossible? Or do we follow the ancient way of adoption, bringing the vanquished into the Longhouse as new members of the clans, turning enemies into brothers and filling the empty places around our fires?"
 nd_iro.11.a: "Brisez-les complètement. La route de la guerre est sans pitié."
 nd_iro.11.b: "Adoptez les vaincus dans la Maison Longue."
 nd_iro.12.t: "La maison longue s'étend jusqu'à l'horizon"
 nd_iro.12.d: "From the straits of Mackinac to the marshes of Checagou, from the Mohawk Valley to the Ohio Country, the Haudenosaunee Confederacy commands the interior of the continent. No fur moves without our permission. No army crosses our territory without our leave. The European coastal colonies look inland and see the Longhouse: vast, powerful, and seemingly eternal.\n\nThis is the apex of military power, but even at the summit there are choices. Do we remain the eternal warriors, perfecting the art of war until no force on this continent can stand against us? Or do we use our military dominance to adopt and incorporate, building an empire not of conquest alone but of assimilation: the Longhouse growing ever longer, welcoming new peoples into its embrace?"
 nd_iro.12.a: "Les routes de guerre sont éternelles. Nous continuons à nous battre."
 nd_iro.12.b: "Tout peuple conquis devient le nôtre."
 STATIC_MODIFIER_NAME_nd_iro_dest_chain_polished: "Alliance de chaîne polie"
 STATIC_MODIFIER_DESC_nd_iro_dest_chain_polished: "Les Haudenosaunee se sont étroitement liés à leurs partenaires diplomatiques, créant un réseau d'alliances qui amplifie leur influence au prix d'un entretien diplomatique constant."
 STATIC_MODIFIER_NAME_nd_iro_dest_chain_sovereign: "Médiateurs souverains"
 STATIC_MODIFIER_DESC_nd_iro_dest_chain_sovereign: "Les Haudenosaunee maintiennent leur indépendance entre toutes les factions, utilisant leur position d'intermédiaires honnêtes pour obtenir des concessions de toutes les parties sans répondre à aucune."
 STATIC_MODIFIER_NAME_nd_iro_dest_law_constitution: "Architectes de la gouvernance"
 STATIC_MODIFIER_DESC_nd_iro_dest_law_constitution: "La Grande Loi inspire la réforme institutionnelle à travers le continent. Les Haudenosaunee deviennent des bâtisseurs et des planificateurs, leur génie constitutionnel s'exprimant dans les structures physiques de gouvernance."
 STATIC_MODIFIER_NAME_nd_iro_dest_law_renewal: "Renouvellement de la maison longue"
 STATIC_MODIFIER_DESC_nd_iro_dest_law_renewal: "La Grande Loi se tourne vers l'intérieur, soutenant la culture Haudenosaunee en nourrissant le peuple, en formant la prochaine génération et en préservant la sagesse des aînés, même si le monde extérieur devient de plus en plus menaçant."
 STATIC_MODIFIER_NAME_nd_iro_dest_total_war: "Guerre sans pitié"
 STATIC_MODIFIER_DESC_nd_iro_dest_total_war: "Les Haudenosaunee mènent une guerre totale contre leurs rivaux, brisant la résistance ennemie grâce à des sièges et des assauts incessants. Les survivants sont dispersés plutôt qu’adoptés."
 STATIC_MODIFIER_NAME_nd_iro_dest_adopt_vanquished: "Adoptez les vaincus"
 STATIC_MODIFIER_DESC_nd_iro_dest_adopt_vanquished: "Les peuples conquis sont amenés dans la Maison longue grâce au système d'adoption, leurs guerriers rejoignant les groupes de guerre Haudenosaunee et leurs familles reconstituant les clans."
 STATIC_MODIFIER_NAME_nd_iro_dest_empire_warpath: "Route de guerre éternelle"
 STATIC_MODIFIER_DESC_nd_iro_dest_empire_warpath: "Les Haudenosaunee perfectionnent l'art de la guerre à travers un empire continental, leurs guerriers acquérant de l'expérience grâce à des campagnes constantes au prix d'un développement agricole négligé."
 STATIC_MODIFIER_NAME_nd_iro_dest_empire_adoption: "Empire de l'adoption"
 STATIC_MODIFIER_DESC_nd_iro_dest_empire_adoption: "La Maison Longue s'allonge de plus en plus à mesure que les peuples conquis sont adoptés dans la Confédération. Les anciens ennemis deviennent des guerriers fidèles, et la force de l'empire réside dans son incorporation plutôt que dans sa destruction."
 nd_iro_peace_tree: "Arbre de Grande Paix"
 nd_iro_peace_tree_desc: "Le Pin Blanc de la Paix, planté par le Grand Pacificateur Deganawida, ses quatre racines blanches s'étendant jusqu'aux confins de la terre. Sous ses branches, le Grand Conseil se réunit pour gouverner par consensus plutôt que par la force."
 nd_iro_peace_tree_ceremonies: "Cérémonies de l'arbre de la paix"
 nd_iro_peace_tree_ceremonies_desc: "Les cérémonies de la Grande Paix nécessitent des torches en cire d'abeille pour le rituel de condoléances, du papier pour enregistrer les décisions du conseil et du tissu fin pour les échanges de cadeaux diplomatiques."
 nd_iro_war_lodge: "Loge de guerre"
 nd_iro_war_lodge_desc: "Une maison du conseil fortifiée où les chefs de guerre planifient leurs campagnes, les guerriers se préparent pour des raids lointains et les trophées de conquête sont exposés pour inspirer la prochaine génération de combattants."
 nd_iro_war_lodge_maintenance: "Entretien du pavillon de guerre"
 nd_iro_war_lodge_maintenance_desc: "La Loge de Guerre a besoin d'un approvisionnement constant en armes pour ses guerriers, en cuir pour leur équipement, en bois pour ses murs et en outils pour l'entretien et la réparation."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_iro_bureaucracy_authority: "Autorité bureaucratique de la Ligue"
 AUTO_MODIFIER_DESC_nd_iro_bureaucracy_authority: "La Confédération, après avoir déclaré son fondement institutionnel sous l'Arbre de la Paix, peut désormais créer des bureaucraties formelles pour administrer la Maison Longue. L’incendie de la capitale offre une place bureaucratique ; cette autorité en ajoute deux autres."

 iro_grand_council_at_onondaga_bureaucracy: "Grand Conseil à Onondaga"
 iro_grand_council_at_onondaga_bureaucracy_desc: "The deliberative apex of the Confederacy. Fifty hereditary sachem titles, distributed among the Five Nations (Mohawk 9, Oneida 9, Onondaga 14, Cayuga 10, Seneca 8) met around the central fire at Onondaga whenever questions of war, peace, or league business were laid before them. The Mohawks and Senecas sat as the Elder Brothers on one side of the fire, the Oneidas and Cayugas as the Younger Brothers on the other, and the Onondagas as Firekeepers held the casting voice in case of deadlock. Consensus was required for league action; a single nation could refuse and the matter rested. The institution was codified in the Kaianere'ko:wa, the Great Law of Peace, recited from wampum at every condolence."

 iro_clan_mother_council_bureaucracy: "Conseil des mères de clan"
 iro_clan_mother_council_bureaucracy_desc: "Le fondement matrilinéaire de la gouvernance des Haudenosaunee. Chaque clan (Loup, Ours, Tortue, Cerf, Castor, Faucon, Anguille, Bécassine, Héron) détenait ses titres de sachem en fiducie par l'intermédiaire de ses matrones supérieures. La mère du clan nommait le détenteur de chaque titre, le présentait pour confirmation et pouvait le rappeler pour mauvaise conduite, lâcheté ou non-respect des conseils des femmes. Elle détenait également le droit de déclencher des guerres de deuil pour remplacer les membres décédés du clan et d'interdire une guerre proposée par ses guerriers en retenant les mocassins, le maïs séché et la farine desséchée nécessaires à la campagne. L’institution était la charnière autour de laquelle tournait la politique des Haudenosaunee."

 iro_wampum_record_office_bureaucracy: "Bureau des archives des wampums"
 iro_wampum_record_office_bureaucracy_desc: "The keepers of the league's binding memory. Wampum, the polished beads of whelk and quahog drilled into long strings and woven into pictorial belts, served as the legal, ritual, and diplomatic record of the Five Nations. The Hiawatha Belt recorded the founding alliance of the league; the Two Row Wampum recorded the Dutch covenant of 1613; the Covenant Chain belts recorded the English alliance after 1677. Designated faithkeepers held the wampum, recited the words bound to each belt at council, and trained their successors in the texts. Until something was wampum'd it was not done; once wampum'd, it was binding for as long as the belt survived."

 iro_covenant_chain_protocol_bureaucracy: "Protocole de chaîne d'alliance"
 iro_covenant_chain_protocol_bureaucracy_desc: "Le système diplomatique qui a lié la Confédération aux puissances coloniales à partir de 1613. À partir du Wampum à deux rangées (Kaswenta) négocié avec les commerçants hollandais à Tawagonshi en 1613, la Confédération estimait que ses alliances avec les puissances européennes étaient deux rangées parallèles : les peuples autochtones et européens voyageaient sur le même fleuve dans des navires séparés, aucun ne dirigeant l'autre. La chaîne hollandaise passa aux Anglais lors de la capitulation de New York en 1664 et fut renouvelée à Albany en 1677 sous le nom de chaîne officielle du Covenant, peaufinée chaque année par les délégations de la Confédération et les commissaires de la Couronne jusqu'en 1755. Les Mohawk Theyanoguin et plus tard Joseph Brant parcourèrent la chaîne jusqu'à toutes les colonies et en appliquèrent les termes sous la menace de retrait."

 iro_mourning_war_apparatus_bureaucracy: "Appareil de guerre de deuil"
 iro_mourning_war_apparatus_bureaucracy_desc: "Le mécanisme institutionnel de captivité et d'adoption qui a soutenu la population Haudenosaunee pendant la guerre des castors (vers 1640-1701) et l'attrition de la variole au XVIIe siècle. La mère du clan d'un Haudenosaunee décédé a déclenché la guerre en déposant le nom du défunt sur le sol de la maison longue; les chefs de guerre rassemblèrent des volontaires, montèrent une campagne contre une nation étrangère et revinrent avec des captifs. Certains captifs étaient rituellement exécutés dans le cadre d'une vengeance sanglante formelle ; d'autres ont été adoptés au nom du défunt, compte tenu de leur lieu de résidence longue et de leurs relations, et intégrés comme Haudenosaunee à part entière. En 1660, peut-être un tiers de la population de la Confédération était adoptée plutôt que des Haudenosaunee de naissance."

 iro_false_face_society_bureaucracy: "Société des faux visages"
 iro_false_face_society_bureaucracy_desc: "La confrérie de médecine masquée qui administrait les cérémonies de guérison, le renouveau au milieu de l'hiver et les fêtes saisonnières de l'année Haudenosaunee. Les membres sculptaient leurs masques vivants dans un tilleul sans l'abattre - l'esprit de l'arbre consentant à la sculpture - puis portaient les masques dans la maison longue pour chasser la maladie, les esprits malins et les mauvais médicaments en secouant violemment des hochets en écaille de tortue et en dispersant du tabac et des cendres. La société opérait parallèlement mais distinctement du Grand Conseil, tenant sa propre succession, sa propre initiation et son propre calendrier saisonnier ; les Husk Faces et la Society of Faces partageaient cette économie médicale. Les mères du clan se coordonnaient avec les Faux Visages en cas de maladie dans la maison longue, et les fidèles les consultaient sur le calendrier des fêtes."
