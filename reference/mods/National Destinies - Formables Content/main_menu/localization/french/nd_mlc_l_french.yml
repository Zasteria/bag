l_french:
 nd_mlc_jong_tradition: "Le Jong malais"
 nd_mlc_jong_tradition_desc: "Le jong était le plus grand navire des eaux d'Asie du Sud-Est, un navire de commerce à plusieurs mâts capable de transporter des centaines de tonnes de marchandises et armé de dizaines de canons pivotants. Les constructeurs navals malais jong ont construit des navires qui rivalisaient en taille avec les jonques chinoises, reliant Malacca à tous les ports du Gujarat à Guangzhou."
 nd_mlc_gajah_perang: "Gajah Perang"
 nd_mlc_gajah_perang_desc: "Le corps d'éléphants de guerre des sultans de Malaccan constituait l'épine dorsale de la défense terrestre du royaume. Lors du siège de 1511, le sultan Mahmud Shah dirigea personnellement vingt éléphants de guerre contre les envahisseurs portugais. Les gajah perang étaient blindés de plaques de fer et portaient des howdahs pour les archers, leurs charges tonitruantes brisant les formations ennemies."
 nd_mlc_undang_undang: "Undang-Undang Melaka"
 nd_mlc_undang_undang_desc: "Le code juridique complet du sultanat de Malacca, mêlant la jurisprudence islamique au droit coutumier malais adat. Composée sous le sultan Muhammad Shah et peaufinée par les Bendahara, elle régissait les conflits civils, la justice pénale, les réglementations commerciales et les droits du dirigeant, l'une des premières constitutions écrites d'Asie du Sud-Est."
 nd_mlc_gateway_of_islam: "Porte de l'Islam"
 nd_mlc_gateway_of_islam_desc: "Malacca a servi de principal canal de propagation de l'Islam dans toute l'Asie du Sud-Est maritime. Les enseignants soufis, les marchands arabes et indiens et les missionnaires malais ont transmis la foi depuis les salles de prière surau de Malacca jusqu'à Sumatra, Java, Bornéo et les Philippines. La conversion suivait souvent le commerce, devenir musulman, c'était rejoindre le réseau commercial le plus puissant de l'océan Indien."
 nd_mlc_emporium: "Emporium de l'Est"
 nd_mlc_emporium_desc: "À son apogée, Malacca était le plus grand entrepôt entre l’Inde et la Chine. L'apothicaire portugais Tome Pires écrivait que « celui qui est seigneur de Malacca a la main sur la gorge de Venise ». Quatre-vingt-quatre langues étaient parlées sur ses marchés, où les soieries chinoises côtoyaient les textiles indiens, les épices des Moluques et les parfums arabes."
 nd_mlc_kris_forging: "Kris forge la tradition"
 nd_mlc_kris_forging_desc: "The kris, the wavy-bladed dagger of the Malay world, was far more than a weapon. Each blade was believed to possess a spirit, forged through rituals by the pandai besi master smiths using meteoritic iron and layered steel. The number of curves in the blade carried spiritual significance, and a sultan's kris was the symbol of his sovereignty.\n\n#italic Available in: $nd_mlc_pandai_besi$#!"
 nd_mlc_laksamana_command: "Commandement naval de Laksamana"
 nd_mlc_laksamana_command_desc: "Le Laksamana était le commandant naval suprême de Malacca, gardien du détroit et émissaire en chef du sultan. Le détenteur le plus célèbre de ce titre était Hang Tuah, un guerrier polyglotte qui parlait arabe, persan, mandarin, tamoul et siamois, et qui protégeait le détroit des pirates grâce à des patrouilles incessantes et une justice rapide."
 nd_mlc_tun_perak_expansion: "L'extension de Tun Perak"
 nd_mlc_tun_perak_expansion_desc: "Bendahara Tun Perak a servi quatre sultans et a transformé Malacca d'un port de commerce en un empire tributaire. Sous sa direction, l'influence de Malacca s'est étendue à toute la péninsule malaise et à l'est de Sumatra, Pahang, Terengganu, Johor, Siak et Kampar étant tous placés sous la suzeraineté de Malacca."
 nd_mlc_tin_networks: "Réseaux d'extraction d'étain"
 nd_mlc_tin_networks_desc: "Les gisements d'étain de Perak et de Kedah étaient parmi les plus riches au monde. Malacca contrôlait l'exportation de ce métal vital, essentiel à la fabrication du bronze, de l'étain et des marchandises commerciales, en l'acheminant via le détroit vers les acheteurs chinois, indiens et plus tard européens."
 nd_mlc_multi_faith_quarters: "Quartiers multiconfessionnels"
 nd_mlc_multi_faith_quarters_desc: "Le port de Malacca était divisé en quatre quartiers distincts, chacun administré par un shahbandar qui supervisait ses marchands et collectait les impôts. Le quartier gujarati, le quartier keling (sud de l'Inde), le quartier javanais et le quartier chinois coexistaient sous la protection du sultan, un modèle de gouvernance cosmopolite rarement égalé dans le monde médiéval."
 nd_mlc_successor_resilience: "Résilience de l’État successeur"
 nd_mlc_successor_resilience_desc: "Lorsque Malacca tomba aux mains des Portugais en 1511, la tradition politique malaise ne mourut pas. Le sultan Mahmud Shah se retira vers le sud pour fonder Johor, tandis que son fils Muzaffar Shah fut invité à diriger Perak. Ces sultanats successeurs ont préservé la loi de Malaccan, le protocole judiciaire et l'idéal de la souveraineté malaise à travers des siècles d'empiètement européen."
 nd_mlc_ghali_besar: "Ghali Bésar"
 nd_mlc_ghali_besar_desc: "Le ghali besar, « grande galère », était un grand navire de guerre à rames équipé de canons pivotants et transportant des centaines de combattants. Ces navires constituaient l'épine dorsale de la puissance navale malaise dans les eaux étroites du détroit, où leur faible tirant d'eau et leur maniabilité leur donnaient des avantages sur les navires européens à quille profonde."
 nd_mlc_literary_golden_age: "Âge d'or littéraire"
 nd_mlc_literary_golden_age_desc: "La Sejarah Melayu, les Annales malaises, est l'une des plus belles œuvres littéraires de l'Asie du Sud-Est, une chronique judiciaire qui retrace la dynastie Malaccan depuis ses origines mythiques jusqu'à la chute de la ville. Aux côtés des traditions épiques hikayat et des textes religieux kitab, il a établi le malais comme langue littéraire et diplomatique de l'archipel."
 nd_mlc_perak_tin_boom: "Perak Tin Boom"
 nd_mlc_perak_tin_boom_desc: "À la fin du XVIe siècle, la demande européenne d'étain a entraîné une expansion sans précédent des mines de Perak. La découverte de gisements alluviaux d'étain le long de la vallée de Kinta a attiré des mineurs chinois, des ouvriers malais et des marchands européens, faisant de Perak l'un des États les plus riches de la péninsule."
 nd_mlc_silat_codification: "Codification Silat"
 nd_mlc_silat_codification_desc: "Le Silat, l'art martial du monde malais, a été formalisé à partir de diverses traditions de combat villageoises dans des écoles standardisées. Les maîtres pendekar se sont entraînés avec le kris, le kerambit et les mains nues, développant un système mettant l'accent sur les mouvements fluides, les blocages articulaires et les frappes explosives soudaines. L'habileté d'un pendekar ne se mesurait pas en force brute mais en économie de mouvement."
 nd_mlc_bugis_alliance: "Alliance des Guerriers Bugis"
 nd_mlc_bugis_alliance_desc: "Les Bugis de Sulawesi étaient réputés dans tout l'archipel comme guerriers, commerçants et marins. À partir du XVIIe siècle, les aventuriers Bugis ont servi comme mercenaires et faiseurs de rois dans les tribunaux malais, pour finalement établir leurs propres maisons dirigeantes à Selangor et Riau. Leurs prouesses militaires complétaient les réseaux commerciaux malais."
 nd_mlc_strait_sovereignty: "Souveraineté du détroit"
 nd_mlc_strait_sovereignty_desc: "Le détroit de Malacca reste le point d'étranglement maritime le plus important au monde, transportant un quart de tout le commerce mondial. Le contrôle de ce passage étroit, d'à peine 65 kilomètres de large dans sa partie la plus étroite, a été l'atout stratégique déterminant de toutes les puissances qui l'ont détenu, depuis les sultans de Malaccan jusqu'à l'ère moderne."
 nd_mlc_national_consciousness: "Conscience nationale malaise"
 nd_mlc_national_consciousness_desc: "Le souvenir de la gloire de Malacca est devenu le fondement de l'identité nationale malaise. Le concept de « Melayu », une identité partagée enracinée dans la langue, l'islam et les coutumes de la cour de Malaccan, a uni les divers peuples de la péninsule contre la domination coloniale et a inspiré des mouvements d'indépendance à travers le monde malais."
 nd_mlc_modern_tin_industry: "Industrie moderne de l’étain"
 nd_mlc_modern_tin_industry_desc: "By the 19th century, the Malay peninsula produced over half the world's tin. Modern smelting techniques, rail transport from mines to ports, and industrial-scale dredging transformed the landscape of Perak, Selangor, and Pahang, creating vast wealth and drawing waves of immigration from China and India.\n\n#italic Available in: $nd_mlc_modern_smeltery$#!"
 nd_mlc_constitutional_sultanate: "Sultanat constitutionnel"
 nd_mlc_constitutional_sultanate_desc: "Le sultanat malais traditionnel s'est adapté aux pressions de la modernité en adoptant des cadres constitutionnels qui préservaient l'autorité royale tout en introduisant une gouvernance représentative. Le sultan restait l’incarnation de la souveraineté malaise et le protecteur de l’Islam, même si les conseils d’État et les organes consultatifs partageaient la charge de l’administration."
 nd_mlc.1.t: "L'Undang-Undang Melaka"
 nd_mlc.1.d: "Under the wise counsel of the Bendahara, our Sultan has promulgated a comprehensive body of law, the Undang-Undang Melaka. Blending the precepts of Islamic jurisprudence with the ancient adat customs of our people, this code governs all matters from criminal justice to commercial disputes, from the rights of the ruler to the duties of the shahbandar.\n\nYet the code has two distinct dimensions. The Hukum Kanun Melaka addresses governance, morality, and social order on land, while the companion Undang-Undang Laut Melaka, composed by our shipowners, regulates all matters of maritime commerce, navigation, and the duties of captains at sea. Which body of law shall receive our greater attention and resources?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mlc.1.a: "La loi du pays sera notre fondement."
 nd_mlc.1.b: "Le droit de la mer guidera nos navires."
 nd_mlc.2.t: "La vision impériale de Tun Perak"
 nd_mlc.2.d: "Bendahara Tun Perak has served our sultanate with unsurpassed brilliance. Under his direction, Malacca has grown from a prosperous trading port into the center of a tributary empire stretching from Terengganu to Kampar. Pahang, Johor, and the Sumatran river states all acknowledge our suzerainty.\n\nBut Tun Perak's legacy offers two paths forward. His military campaigns secured these territories through force of arms, the threat of the Malaccan fleet and the march of the war elephants. Yet his diplomatic genius was equally formidable: arranging royal marriages, negotiating tribute agreements, and playing rival states against one another. Which aspect of his statecraft shall define our realm?"
 nd_mlc.2.a: "L'épée qui a vaincu continuera à régner."
 nd_mlc.2.b: "La plume qui a lié les traités maintiendra la cohésion de notre empire."
 nd_mlc.3.t: "La Sejarah Melayu"
 nd_mlc.3.d: "A masterwork of Malay literature has been completed at our court, the Sejarah Melayu, the Malay Annals. This extraordinary chronicle traces our dynasty's lineage from Iskandar Zulkarnain, Alexander the Great himself, through the founding of Singapore by Sang Nila Utama, the conversion to Islam at Malacca, and the glories of our sultanate.\n\nMore than mere history, the Sejarah Melayu establishes the principles of Malay kingship: that the ruler must be just, that loyalty between king and subject is a sacred covenant, and that our language and customs form a civilization worthy of remembrance. It will be read and copied in courts across the archipelago for centuries to come."
 nd_mlc.3.a: "Notre histoire inspirera des générations."
 nd_mlc.4.t: "Porte de l'Islam"
 nd_mlc.4.d: "Malacca has become the beating heart of Islam in Maritime Southeast Asia. From our surau prayer halls and madrasas, learned teachers, many of them Sufis from India and Arabia, carry the faith to the far corners of the archipelago. The conversion of Malacca's rulers gave Islam prestige; the conversion of its merchants gave Islam reach.\n\nTraders who embrace the faith gain entry to the vast commercial network stretching from the Red Sea to the South China Sea. Kings who accept Islam gain legitimacy and access to the wealth of the Indian Ocean trade. And so the faith spreads, not by the sword, but by the ledger and the prayer mat, from Aceh to Manila, from Brunei to the Moluccas."
 nd_mlc.4.a: "La lumière de la foi illumine les mers."
 n_nd_mlc_jong: "Jong malais"
 n_nd_mlc_jong_desc: "Le jong était le plus grand navire des eaux d'Asie du Sud-Est, un navire de commerce à plusieurs mâts armé de dizaines de canons pivotants et capable de transporter des centaines de tonnes de marchandises à travers l'océan Indien."
 a_nd_mlc_gajah_perang: "Gajah Perang"
 a_nd_mlc_gajah_perang_desc: "Éléphants de guerre du sultanat de Malaccan, blindés de plaques de fer et portant des howdahs d'archers. Leurs charges tonitruantes pourraient briser n’importe quelle formation d’infanterie."
 n_nd_mlc_penjajap: "Penjajap"
 n_nd_mlc_penjajap_desc: "Une galère de guerre malaise rapide à faible tirant d'eau conçue pour la patrouille et l'interception dans les eaux étroites du détroit. Rapide et maniable, idéal pour chasser les pirates et renforcer l'autorité du sultan."
 n_nd_mlc_ghali_besar: "Ghali Bésar"
 n_nd_mlc_ghali_besar_desc: "Une grande galère de guerre à rames équipée de canons pivotants et transportant des centaines de combattants. Le faible tirant d'eau du Ghali Besar lui donnait un avantage sur les navires européens à quille profonde dans les eaux confinées du détroit."
 a_nd_mlc_pendekar: "Pendékar"
 a_nd_mlc_pendekar_desc: "Maîtres du Silat, l'art martial malais. Ces guerriers d'élite se battent avec des kris, des kerambit et à mains nues, utilisant des mouvements fluides et des frappes explosives pour submerger leurs adversaires."
 a_nd_mlc_bugis_warrior: "Guerriers Bugis"
 a_nd_mlc_bugis_warrior_desc: "Féroces guerriers de Sulawesi, les Bugis ont servi de mercenaires et de faiseurs de rois à travers le monde malais. Réputés pour leur discipline et leur agressivité au combat."
 nd_mlc_surau: "Surau"
 nd_mlc_surau_desc: "Une salle de prière islamique et un centre d'apprentissage, où les enseignants soufis instruisent les fidèles et préparent les missionnaires à transmettre la foi à travers l'archipel."
 nd_mlc_gudang_rempah: "Gudang Rempah"
 nd_mlc_gudang_rempah_desc: "Un grand entrepôt d'épices dans le port, stockant des clous de girofle, de la muscade et du poivre des Moluques pour les redistribuer aux marchands d'Inde, d'Arabie et de Chine."
 nd_mlc_pandai_besi: "Pandai Besi"
 nd_mlc_pandai_besi_desc: "Une forge d'armes maîtresse où les forgerons pandai besi produisent le légendaire kris malais à travers des rituels de feu et d'acier plié."
 nd_mlc_tin_mine_office: "Bureau de la mine d'étain"
 nd_mlc_tin_mine_office_desc: "Un centre administratif supervisant l'extraction et la taxation de l'étain des riches gisements alluviaux de la péninsule."
 nd_mlc_modern_smeltery: "Fonderie moderne"
 nd_mlc_modern_smeltery_desc: "Une fonderie industrielle d’étain utilisant des techniques modernes pour traiter le minerai à une échelle sans précédent."
 nd_mlc_pm_surau_upkeep: "Instruction religieuse"
 nd_mlc_pm_surau_upkeep_desc: "La fourniture continue de textes et de matériels pour l’éducation islamique."
 nd_mlc_pm_spice_storage: "Stockage des épices"
 nd_mlc_pm_spice_storage_desc: "Entretien d'entrepôts pour le stockage d'épices en vrac dans des conditions contrôlées."
 nd_mlc_pm_kris_forging: "Kris Forgeage"
 nd_mlc_pm_kris_forging_desc: "Les maîtres forgerons forgent des lames kris légendaires à partir de couches de fer, produisant des armes d'une importance à la fois martiale et spirituelle."
 nd_mlc_pm_tin_administration: "Administration d'étain"
 nd_mlc_pm_tin_administration_desc: "Tenue des registres et surveillance administrative des opérations minières d’étain."
 nd_mlc_pm_tin_smelting: "Fonderie d'étain"
 nd_mlc_pm_tin_smelting_desc: "Les fonderies à l’échelle industrielle produisent de l’étain affiné à l’aide de fours au charbon et d’équipements sidérurgiques."
 STATIC_MODIFIER_NAME_nd_mlc_law_of_the_sultanate: "Loi du Sultanat"
 STATIC_MODIFIER_DESC_nd_mlc_law_of_the_sultanate: "Le Hukum Kanun Melaka fournit un cadre complet pour la gouvernance, la justice et l'ordre social dans tout le royaume."
 STATIC_MODIFIER_NAME_nd_mlc_maritime_law: "Droit maritime de Malacca"
 STATIC_MODIFIER_DESC_nd_mlc_maritime_law: "L'Undang-Undang Laut Melaka codifie les droits et devoirs des armateurs, des capitaines et des marchands, mettant de l'ordre dans les voies maritimes les plus fréquentées du monde."
 STATIC_MODIFIER_NAME_nd_mlc_tun_perak_sword: "L'épée de Tun Perak"
 STATIC_MODIFIER_DESC_nd_mlc_tun_perak_sword: "L'héritage militaire de Bendahara Tun Perak, l'expansion par la force des armes, la menace de la flotte et la charge des éléphants de guerre."
 STATIC_MODIFIER_NAME_nd_mlc_tun_perak_statecraft: "L'art politique de Tun Perak"
 STATIC_MODIFIER_DESC_nd_mlc_tun_perak_statecraft: "Le génie diplomatique de Bendahara Tun Perak, liant les vassaux par le mariage, les hommages et l'art subtil de jouer les rivaux les uns contre les autres."
 levy_nd_mlc_gajah_perang: "Prélèvement sur les éléphants de guerre"
 levy_nd_mlc_gajah_perang_desc: "Éléphants de guerre blindés issus de la maison du sultan et de la noblesse."
 levy_nd_mlc_pendekar: "Pendekar Lévy"
 levy_nd_mlc_pendekar_desc: "Maîtres Silat issus du peuple et de la classe des soldats."
 nd_mlc_formed_tt: "Malacca a été créée"
 nd_mlc_path_a_tt: "A choisi la loi du Sultanat"
 nd_mlc_path_b_tt: "Choisissez le droit maritime de Malacca"
 AUTO_MODIFIER_NAME_nd_mlc_bureaucracy_authority: "Appareil du trône de Bertam"
 AUTO_MODIFIER_DESC_nd_mlc_bureaucracy_authority: "L'administration à quatre piliers du sultanat de Malacca, Bendahara, Penghulu Bendahari, Temenggung, Laksamana, administre le royaume de concert avec la concession impériale de Bukit China et l'appareil negeri-tribut qui lie les petits États malais. Depuis l'istana du Sungai Bertam, le trône possède désormais la portée institutionnelle nécessaire pour faire de Melaka l'entrepôt de l'océan Indien plutôt qu'un simple port de pêche chanceux."
 mlc_penghulu_bendahari_bureaucracy: "Penghulu Bendahari"
 mlc_penghulu_bendahari_bureaucracy_desc: "Troisième pilier de l'administration de Melaka, trésorier du royaume et maître des douanes. Les Bendahari administraient le trésor royal, les poids et mesures (le Melakan kati de 605 grammes et le bahara de 200 kati devinrent les étalons de référence de l'océan Indien), les revenus syahbandar des quatre quartiers étrangers et la capitainerie qui pesait chaque cargaison de poivre, de clous de girofle, d'étain et de poussière d'or traversant le quai. Tom Pires (Suma Oriental, vers 1515) décrit l'administration douanière de Melaka comme la plus rationnelle de toutes les Indes, avec des taux publiés de 3 à 6 % ad valorem et un point de paiement unique au bureau de Bendahari."
 mlc_temenggung_bench_bureaucracy: "Banc Temenggung"
 mlc_temenggung_bench_bureaucracy_desc: "Le quatrième pilier de la bureaucratie de Melaka, chef de la sécurité du palais et magistrat des crimes capitaux. Là où les Bendahara dirigeaient l'administration civile et les Bendahari s'occupaient des affaires fiscales, le Temenggung commandait la garde du corps de l'istana de hulubalang, dirigeait la prison royale et présidait la haute cour pour les délits réservés par l'adat au bon plaisir du sultan, la trahison, le lèse-majesté et le durhaka de désobéissance au trône. Son mandat parcourait les keris de ses adjoints hulubalang, qui surveillaient la ville, réprimaient les désordres du marché et appliquaient des règles somptuaires contre les roturiers portant du jaune ou chevauchant des chaises à porteurs réservées à la royauté."
 mlc_bukit_china_concession_bureaucracy: "Concession impériale de Bukit Chine"
 mlc_bukit_china_concession_bureaucracy_desc: "Le lien affluent Ming était centré sur la colline de Bukit Chine au nord du Sungai Melaka, concédée (selon le Sejarah Melayu) par le sultan Mansur Shah à la princesse Hang Li Po et sa suite de cinq cents personnes lors de son mariage avec le sultan en 1459. La colline devint le siège de l'établissement tributaire chinois : résidence des envoyés Ming qui portèrent les brevets des empereurs Yongle et Xuande aux sultans successifs, quartier du Sinkeh. colons et porte d'entrée diplomatique et commerciale par laquelle Melaka a assuré la protection des Ming contre l'empiétement siamois. Les sept voyages de Cheng Ho (1405-1433) ont utilisé Melaka comme base de transit dans l'océan Indien, laissant une relation conventionnelle permanente qui a duré jusqu'à la conquête portugaise."
 mlc_negeri_tributary_bureaucracy: "Appareil affluent du Negeri"
 mlc_negeri_tributary_bureaucracy_desc: "Le réseau institutionnel par lequel le sultan Mansur Shah (r. 1459-1477) et Bendahara Tun Perak lièrent les petits États malais au trône de Melaka sous le statut de negeri (royaume vassal) : Pahang à partir de 1454, Kedah à partir de c. 1470, Kelantan et Trengganu à partir des années 1460, Indragiri et Kampar à Sumatra et Pasai à partir de 1470 sous tribut indirect après l'expédition de Tun Perak en 1474. Chaque raja de negeri gardait son trône en échange d'un tribut annuel bunga mas dan perak (un petit arbre de fleurs d'or et d'argent battues, d'un poids symbolique mais d'une lourde obligation rituelle), d'un prélèvement naval en temps de guerre et de l'acceptation du Bendahara de Melaka comme arbitre final dans les conflits de succession. L'appareil était administré par des bentara (hérauts) itinérants et par des envoyés résidents logés au Bertam istana représentant chaque tribunal tributaire."
