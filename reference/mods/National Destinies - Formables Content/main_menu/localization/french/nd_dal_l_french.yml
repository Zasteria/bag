l_french:
 nd_dal_formed_tt: "La Dalmatie s'est formée"
 STATIC_MODIFIER_NAME_nd_dal_republic_of_the_adriatic: "République de l'Adriatique"
 STATIC_MODIFIER_DESC_nd_dal_republic_of_the_adriatic: "Following the model of Ragusa, Dalmatia governs itself as a mercantile republic, preserving its freedom through shrewd diplomacy, trade agreements, and the careful balancing of greater powers, paying tribute where necessary, but bowing to none."
 STATIC_MODIFIER_NAME_nd_dal_maritime_league: "Ligue maritime dalmate"
 STATIC_MODIFIER_DESC_nd_dal_maritime_league: "Les cités-États de la côte dalmate s'unissent en une confédération navale, regroupant leurs chantiers navals, leurs marins et leurs flottes marchandes en une force qui contrôle les voies maritimes de l'Adriatique et projette sa puissance bien au-delà de leur modeste littoral."
 nd_dal.1.t: "Les villes de la côte"
 nd_dal.1.d: "The banner of Dalmatia flies over the ancient cities of the eastern Adriatic. From Zadar in the north to Dubrovnik in the south, a chain of fortified port cities clings to the narrow coastal strip between the Dinaric Mountains and the sea. For centuries these communes have balanced between empires (Byzantium, Venice, Hungary, and now the Ottoman shadow), surviving through commerce, seamanship, and an instinct for diplomacy that borders on art.\n\nDubrovnik's Great Council must now decide the character of this new union. Shall Dalmatia follow the Ragusan model: a republic of merchants and diplomats, paying tribute to preserve autonomy, thriving on trade that flows between East and West? Or shall the coastal cities unite their fleets into a maritime league, building naval power that commands the Adriatic through force of arms rather than force of argument?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dal.1.a: "La liberté n'est pas donnée ; il est échangé contre"
 nd_dal.1.b: "La mer sera notre bouclier et notre épée"
 nd_dal.2.t: "Le décret de quarantaine"
 nd_dal.2.d: "On 27 July 1377, the Great Council of Ragusa issued a decree without precedent in European history. All travelers arriving from plague-infected regions must spend thirty days (later extended to forty, giving us the word 'quarantine' from quaranta giorni) on the barren islet of Mrkan before entering the city.\n\nNo other city has attempted anything like this. Venice will not establish its own lazaretto for another forty-six years. The Ragusan decree recognizes what no physician yet fully understands: that disease travels with people, and that isolation is the price of survival.\n\nThe system works. While plague devastates cities across Europe, Dubrovnik endures. But the lazaretto delays trade and irritates foreign merchants. Shall we enforce the quarantine strictly, accepting slower commerce for safer citizens? Or shall we maintain an open port policy, trusting our physicians to manage risk while keeping trade flowing?"
 nd_dal.2.a: "Quarante jours pour la sécurité de notre peuple"
 nd_dal.2.b: "Le commerce ne doit pas être enchaîné à une île"
 nd_dal.3.t: "Le décret d'abolition"
 nd_dal.3.d: "On 27 January 1416, the Great Council of Ragusa passed a decree that would not be matched by any European state for nearly four centuries. The slave trade is hereby abolished within the Republic. No Ragusan ship may transport slaves. No Ragusan citizen may buy, sell, or own another human being. The penalty is six months imprisonment and a fine of twenty-five pounds per person.\n\nThe motivations are mixed: genuine moral conviction among some councilors, practical calculation among others who note that slave labor depresses wages for free workers, and diplomatic advantage in presenting Ragusa as a beacon of civilization. Whatever the reasons, the result is the same: Ragusa becomes the first European state to ban the slave trade, a full 391 years before Britain."
 nd_dal.3.a: "Non bene pro toto libertas venditur auro"
 nd_dal.4.t: "La flotte Argosy"
 nd_dal.4.d: "The word 'argosy' has entered the languages of Europe as a synonym for a great merchant fleet, and it derives from 'Ragusa.' The reason is plain to see in the harbor of Dubrovnik. One hundred and eighty ships, crewed by five thousand sailors, carry Dalmatian goods to every port in the Mediterranean and beyond. The largest argosies are four-masted vessels carrying one hundred tons, armed with cannon and crewed by one hundred forty men.\n\nShakespeare himself will immortalize these ships. Spanish admirals recruit Ragusan captains for their armadas. The argosies are not merely merchant vessels: they are floating fortresses that need no naval escort, combining the cargo capacity of a merchantman with the armament of a warship.\n\nShall we organize these ships into a merchant armada, projecting power through their sheer size and armament? Or shall we perfect the convoy system, emphasizing trade protection and efficient commerce over raw naval might?"
 nd_dal.4.a: "Chaque Argosy est un château sur les vagues"
 nd_dal.4.b: "Notre force est dans le convoi, pas dans la bordée"
 STATIC_MODIFIER_NAME_nd_dal_quarantine_decree: "Décret de quarantaine"
 STATIC_MODIFIER_DESC_nd_dal_quarantine_decree: "L'application rigoureuse des procédures de quarantaine lancées par Raguse en 1377 - trente jours d'isolement sur les îles au large pour tous les arrivants des régions pesteuses - protège la population au prix d'un ralentissement des échanges."
 STATIC_MODIFIER_NAME_nd_dal_open_port_policy: "Politique de port ouvert"
 STATIC_MODIFIER_DESC_nd_dal_open_port_policy: "Une approche pragmatique de la quarantaine qui donne la priorité aux flux commerciaux, en s’appuyant sur les médecins et les inspections plutôt que sur un isolement généralisé. Le commerce prospère, même si les maladies trouvent une entrée plus facile."
 STATIC_MODIFIER_NAME_nd_dal_liberty_of_ragusa: "Liberté de Raguse"
 STATIC_MODIFIER_DESC_nd_dal_liberty_of_ragusa: "Le décret d'abolition de 1416 (« Non bene pro toto libertas venditur auro » (La liberté ne se vend pas pour tout l'or du monde)) confère à Raguse un prestige international et attire des travailleurs qualifiés de toute la Méditerranée."
 STATIC_MODIFIER_NAME_nd_dal_merchant_armada: "Armada marchande"
 STATIC_MODIFIER_DESC_nd_dal_merchant_armada: "Les Argosies ragusaines sont organisées comme une armada marchande : des navires marchands armés si lourdement bâtis qu'ils n'ont besoin d'aucune escorte, projetant leur puissance commerciale et militaire à travers la Méditerranée."
 STATIC_MODIFIER_NAME_nd_dal_convoy_system: "Système de convoi"
 STATIC_MODIFIER_DESC_nd_dal_convoy_system: "Les navires marchands ragusains naviguent en convois organisés, avec des escortes légères et des horaires de navigation standardisés qui maximisent le débit commercial tout en minimisant les pertes pour les pirates et les corsaires."
 nd_dal_fondaco_tradition: "Fondaco Tradition"
 nd_dal_fondaco_tradition_desc: "Le fondaco - un entrepôt, un échange et une hôtellerie combinés - est le fondement du commerce dalmate, où les marchands stockent les marchandises, négocient les contrats et règlent les différends sous l'œil vigilant de la commune."
 nd_dal_statute_of_ragusa: "Statut de Raguse"
 nd_dal_statute_of_ragusa_desc: "Le Statut de Raguse de 1272 codifie les traditions juridiques romaines aux côtés des coutumes locales, établissant des règles de commerce, d'urbanisme, d'hygiène et d'ordre public qui font de la république un modèle de gouvernance civique."
 nd_dal_commune_governance: "Gouvernance communale"
 nd_dal_commune_governance_desc: "Les cités-États dalmates se gouvernent elles-mêmes par l'intermédiaire de conseils élus, de recteurs exerçant de brefs mandats et de traditions de prise de décision collective enracinées dans des siècles de républicanisme maritime."
 nd_dal_salt_monopoly: "Monopole du sel"
 nd_dal_salt_monopoly_desc: "Les salines de Pag, Ston et Nin produisent l'or blanc de l'Adriatique, une denrée si précieuse que le contrôle du commerce du sel est à la base de la richesse et de la diplomatie dalmate."
 nd_dal_uskok_tradition: "Tradition Uskok"
 nd_dal_uskok_tradition_desc: "The Uskoks, refugees from Ottoman-conquered lands, settle along the Dalmatian coast as frontier fighters, their guerrilla skills and knowledge of mountain terrain making them invaluable border defenders."
 nd_dal_quarantine_system: "Système de quarantaine"
 nd_dal_quarantine_system_desc: "En 1377, Raguse est devenue la première ville au monde à instaurer une quarantaine systématique, obligeant tous les arrivants des régions pesteuses à s'isoler sur des îles au large avant d'entrer dans la ville."
 nd_dal_ragusan_diplomacy: "Diplomatie ragusaine"
 nd_dal_ragusan_diplomacy_desc: "La République de Raguse a perfectionné l'art de la survie grâce à la diplomatie, en maintenant des agents et des informateurs à travers la Méditerranée tout en dressant les uns contre les autres Venise, la Hongrie et les Ottomans."
 nd_dal_abolition_decree: "Décret d'abolition"
 nd_dal_abolition_decree_desc: "En 1416, la République de Raguse devint le premier État européen à abolir la traite négrière, une déclaration de principe qui rehaussa son prestige et attira dans ses ports des hommes libres et qualifiés."
 nd_dal_adriatic_salt_routes: "Routes du sel de l'Adriatique"
 nd_dal_adriatic_salt_routes_desc: "Dalmatian salt from Pag, Ston, and Nin travels the Adriatic trade routes, exchanged for Italian grain, Levantine spices, and Balkan minerals in a web of commerce that enriches every coastal commune.\n\n#italic Available in: $nd_dal_fondaco$#!"
 nd_dal_argosy_shipwrights: "Charpentiers Argosy"
 nd_dal_argosy_shipwrights_desc: "Les chantiers navals de Dubrovnik produisent le célèbre argosy, un navire marchand massif et lourdement construit qui combine la capacité de chargement d'un transport avec l'armement d'un navire de guerre, donnant le mot « argosy » à la langue anglaise."
 nd_dal_morlach_frontier: "Frontière de Morlach"
 nd_dal_morlach_frontier_desc: "The Morlachs, Vlach-speaking pastoralists of the Dinaric hinterland, are recruited as frontier guards, their knowledge of mountain warfare making them formidable border defenders."
 nd_dal_sponza_archives: "Archives de Sponza"
 nd_dal_sponza_archives_desc: "The Sponza Palace in Dubrovnik houses the state archive and customs office, where meticulous records of trade, diplomacy, and governance preserve centuries of Ragusan knowledge and enable efficient customs collection.\n\n#italic Available in: $nd_dal_fondaco$#!"
 nd_dal_tribute_autonomy: "Autonomie d'hommage"
 nd_dal_tribute_autonomy_desc: "La Dalmatie rend hommage à l'Empire ottoman (12 500 ducats d'or par an) en échange d'une autonomie interne et de privilèges commerciaux sur les terres ottomanes, un accord pragmatique qui préserve la liberté à un prix."
 nd_dal_bracera_fleet: "Flotte de Bracera"
 nd_dal_bracera_fleet_desc: "La bracera - une galère rapide à faible tirant d'eau avec huit rames et un équipage de trente personnes - peut parcourir cent milles marins en une nuit, déjouant les lourdes galères vénitiennes dans les baies et les criques étroites de la côte Adriatique."
 nd_dal_maritime_law: "Droit maritime"
 nd_dal_maritime_law_desc: "Le droit maritime ragusain (régissant les contrats, les assurances, le sauvetage et les droits des marins) devient un modèle pour le commerce méditerranéen, attirant les marchands étrangers qui font confiance à son jugement impartial."
 nd_dal_pharmacy_tradition: "Traditions de la pharmacie"
 nd_dal_pharmacy_tradition_desc: "The Franciscan pharmacy of Dubrovnik, operating continuously since 1317, is among the oldest in Europe, pioneering the preparation of remedies from Adriatic herbs and Mediterranean plants.\n\n#italic Available in: $nd_dal_lazaretto$#!"
 nd_dal_silk_and_dye_trade: "Commerce de la soie et des teintures"
 nd_dal_silk_and_dye_trade_desc: "The fondaci process imported silk and dyes into fine cloth for re-export, adding manufacturing value to the raw goods flowing through Dalmatian warehouses.\n\n#italic Available in: $nd_dal_fondaco$#!"
 nd_dal_fleet_zenith: "Flotte Zénith"
 nd_dal_fleet_zenith_desc: "At its peak, the Ragusan merchant fleet numbers 180 ships crewed by 5,000 sailors, with the fondaci provisioning vessels with tar, rope, and timber for voyages across the Mediterranean.\n\n#italic Available in: $nd_dal_fondaco$#!"
 nd_dal_learned_republic: "République savante"
 nd_dal_learned_republic_desc: "La tradition intellectuelle de Raguse produit des érudits, des poètes et des scientifiques de renommée européenne, du dramaturge Marin Drzic au physicien Ruder Boskovic."
 nd_dal_walled_cities: "Villes fortifiées"
 nd_dal_walled_cities_desc: "Les murs massifs de Dubrovnik, Split et Zadar (certains datant de l’époque romaine, continuellement entretenus et agrandis) rendent les villes dalmates pratiquement imprenables au siège."
 nd_dal_mercantile_banking: "Banque commerciale"
 nd_dal_mercantile_banking_desc: "Les banques ragusiennes accordent des crédits aux marchands de l'autre côté de l'Adriatique, finançant des entreprises commerciales et assurant les cargaisons avec des instruments financiers sophistiqués."
 nd_dal_illyrian_movement: "Mouvement illyrien"
 nd_dal_illyrian_movement_desc: "Le mouvement illyrien promeut une identité slave du sud partagée entre les Dalmates, les Croates et les Serbes, remettant en question la domination culturelle des influences italiennes et habsbourgeoises le long de la côte."
 nd_dal_modern_commerce: "Commerce moderne"
 nd_dal_modern_commerce_desc: "Les sociétés par actions et les compagnies d'assurance modernes remplacent les anciens partenariats marchands, faisant entrer le commerce dalmate dans l'ère industrielle avec une gestion formalisée des risques et une mise en commun des capitaux."
 nd_dal_port_modernization: "Modernisation du port"
 nd_dal_port_modernization_desc: "Des grues à vapeur, des quais agrandis et des entrepôts modernes transforment les anciens ports de la côte dalmate pour répondre aux exigences du transport maritime de l'ère industrielle."
 nd_dal_constitutional_reform: "Réforme constitutionnelle"
 nd_dal_constitutional_reform_desc: "Les anciennes traditions républicaines des communes dalmates sont formalisées dans une gouvernance constitutionnelle moderne, avec des droits codifiés, des assemblées représentatives et une bureaucratie professionnelle."
 a_nd_dal_uskok: "Raiders d'Uskok"
 a_nd_dal_uskok_desc: "Des guérilleros réfugiés de Bosnie et de Croatie occupées par les Ottomans. Les Uskoks (« ceux qui ont sauté le pas ») se spécialisent dans les embuscades en montagne et les raids côtiers, utilisant leur connaissance intime du terrain accidenté pour produire un effet dévastateur."
 a_nd_dal_morlach: "Morlach Pandurs"
 a_nd_dal_morlach_desc: "Irréguliers de montagne de langue valaque de l'arrière-pays dinarique. Les Morlach combattent en tant qu'infanterie légère, explorant les cols de montagne et harcelant les flancs ennemis avec l'habileté de pionniers nés."
 n_nd_dal_argosy: "Argosy"
 n_nd_dal_argosy_desc: "Le légendaire argosy ragusain : un énorme navire marchand à quatre mâts armé de canons et doté d'un équipage de 140 hommes. Plus lent qu'un navire de guerre mais plus résistant et plus spacieux, l'Argosy n'a pas besoin d'escorte : c'EST l'escorte."
 n_nd_dal_bracera: "Uskok Bracera"
 n_nd_dal_bracera_desc: "Une galère rapide et à faible tirant d'eau avec huit rames et un équipage de trente personnes. Le bracera peut naviguer dans les criques et les criques étroites où les navires plus lourds n'osent pas le suivre, parcourant cent milles marins en une seule nuit."
 levy_nd_dal_uskok: "Prélèvement des pillards d'Uskok"
 levy_nd_dal_uskok_desc: "Guérilla frontalière recrutée parmi les réfugiés Uskok de la côte dalmate."
 levy_nd_dal_morlach: "Prélèvement Morlach Pandur"
 levy_nd_dal_morlach_desc: "Irréguliers des montagnes issus des communautés pastorales valaques de l'intérieur dinarique."
 nd_dal_fondaco: "Fondaco"
 nd_dal_fondaco_desc: "Un entrepôt commercial dalmate et une bourse marchande où les marchandises sont stockées, les contrats négociés et les différends commerciaux réglés sous l'autorité de la commune."
 nd_dal_lazaretto: "Lazaret"
 nd_dal_lazaretto_desc: "Une installation de quarantaine construite dans la tradition ragusaine, où les voyageurs et les marchandises en provenance des régions infectées par la peste sont isolés avant d'entrer dans la ville : la première institution de santé publique systématique au monde."
 nd_dal_academy: "Académie Ragusane"
 nd_dal_academy_desc: "Un centre d'apprentissage et d'érudition dans la tradition ragusaine, où des érudits, des poètes et des philosophes naturels se réunissent pour faire progresser les connaissances et préserver le patrimoine intellectuel des communes dalmates."
 nd_dal_insurance_house: "Maison d'assurance maritime"
 nd_dal_insurance_house_desc: "Une institution financière spécialisée dans l'assurance maritime et la gestion des risques commerciaux, souscrivant des entreprises commerciales et fournissant le capital qui alimente le commerce dalmate."
 nd_dal_fondaco_maintenance: "Entretien de Fondaco"
 nd_dal_fondaco_maintenance_desc: "Pierre et bois pour la structure de l'entrepôt, toile pour les étals du marché et les quartiers des commerçants."
 nd_dal_salt_trade: "Commerce du sel de l'Adriatique"
 nd_dal_salt_trade_desc: "Le sel dalmate de Pag et Ston et les conserves de poisson de l'Adriatique transitent par les entrepôts de fondaco, fondement de la richesse commerciale de la république."
 nd_dal_fine_cloth_trade: "Commerce de tissus fins"
 nd_dal_fine_cloth_trade_desc: "Les teintures et les tissus importés du Levant et d'Italie sont commercialisés via le fondaco, enrichissant les marchands dalmates qui servent d'intermédiaires entre l'Est et l'Ouest."
 nd_dal_customs_registry: "Registre des douanes"
 nd_dal_customs_registry_desc: "La tenue méticuleuse des dossiers du bureau de douane du Palais Sponza, consommant du papier et de l'encre pour documenter chaque cargaison, tarif et transaction commerciale transitant par le fondaco."
 nd_dal_maritime_provisioning: "Approvisionnement maritime"
 nd_dal_maritime_provisioning_desc: "Le fondaco stocke du goudron et du bois pour approvisionner la grande flotte marchande ragusaine, approvisionnant les 180 navires et 5 000 marins qui transportent les marchandises dalmates à travers la Méditerranée."
 nd_dal_lazaretto_maintenance: "Entretien du lazaret"
 nd_dal_lazaretto_maintenance_desc: "De la pierre pour les salles d'isolement, du bois pour l'entretien et des médicaments pour soigner les malades pendant leur période de quarantaine."
 nd_dal_apothecary_service: "Service d'apothicaire"
 nd_dal_apothecary_service_desc: "Les pharmaciens franciscains entretiennent les salles de quarantaine avec de l'huile d'olive de l'Adriatique, des teintures à base de vin et des pansements en lin, soignant à la fois les voyageurs en quarantaine et les malades de la ville."
 nd_dal_academy_maintenance: "Entretien de l'Académie"
 nd_dal_academy_maintenance_desc: "Du papier pour les manuscrits et la correspondance, des livres pour la collection de la bibliothèque et des bougies en cire d'abeille pour éclairer les longues heures d'étude des érudits."
 nd_dal_insurance_maintenance: "Entretien de la maison d'assurance"
 nd_dal_insurance_maintenance_desc: "Du papier pour les contrats et les registres, du mobilier pour les salles de comptage et du tissu fin pour les bureaux où les souscripteurs évaluent les risques et règlent les sinistres."
 nd_dal_path_a_tt: "Choisissez le destin de la République#bold de l'Adriatique#!"
 nd_dal_path_b_tt: "Chose the #bold Maritime League#! destiny"
 nd_dal_destiny: "Destin Dalmatien"
 nd_dal_destiny_desc: "Les villes de la côte dalmate se sont réunies sous une seule bannière. Que ce soit par les arts de la diplomatie ou la force de la flotte, ce nouvel État doit désormais se montrer digne de perdurer parmi les grandes puissances de la Méditerranée."
 nd_dal_dest_tribute_and_trade: "Hommage et commerce"
 nd_dal_dest_tribute_and_trade_desc: "Sécurisez les approches de l'Adriatique en plaçant les ports de Kotor et de Bar sous influence dalmate, établissant ainsi le modèle de tribut et de diplomatie qui a préservé l'indépendance de Raguse pendant des siècles. Un trésor de 1 000 pièces d'or financera les ambassades et les accords commerciaux nécessaires."
 nd_dal_dest_mediterranean_emporium: "Magasin méditerranéen"
 nd_dal_dest_mediterranean_emporium_desc: "Étendre le réseau commercial dalmate jusqu’aux îles Ioniennes, faisant de Corfou une porte d’entrée vers la Méditerranée au sens large. Adoptez l'institution bancaire pour formaliser les instruments financiers de la république et accumulez 2 000 pièces d'or pour garantir l'expansion du commerce."
 nd_dal_dest_libertas: "Libertés"
 nd_dal_dest_libertas_desc: "La Dalmatie aspire à l'idéal le plus élevé de la république ragusane : la Libertas, une liberté qui perdure grâce à la richesse, à la sagesse et au respect des nations. Établissez une présence commerciale en Crète et sur la côte italienne à Ancône, atteignez un prestige international de 75 et amassez un trésor de 3 000 pièces d'or pour prouver la permanence de la république."
 nd_dal_dest_adriatic_dominion: "Domination Adriatique"
 nd_dal_dest_adriatic_dominion_desc: "La Ligue maritime doit sécuriser par la force la côte orientale de l’Adriatique. Conquérir Durres et Shkoder pour contrôler le détroit qui sépare l'Adriatique de la Méditerranée au sens large, tout en construisant une armée d'au moins 30 000 hommes pour faire respecter les revendications dalmates."
 nd_dal_dest_thalassocracy: "Thalassocratie"
 nd_dal_dest_thalassocracy_desc: "Projetez la puissance navale dalmate au plus profond de la Méditerranée orientale en s'emparant de Thessalonique, le grand port de la mer Égée. Maintenez une armée de 50 000 hommes et un trésor de 2 000 pièces d'or pour soutenir cette domination lointaine."
 nd_dal_dest_mare_nostrum: "Mare Nostrum"
 nd_dal_dest_mare_nostrum_desc: "The Maritime League aspires to nothing less than mastery of the Adriatic Sea. Conquer Venice itself, the ancient rival, and the great port of Bari on the Italian shore. Command an army of 75,000 men and achieve prestige of 75 to complete the transformation from coastal confederation to Mediterranean power."
 nd_dal.5.t: "Le destin de la côte"
 nd_dal.5.d: "Dalmatia stands united: a chain of fortified port cities stretching from Istria to the Bay of Kotor, bound together by the sea that gives them life. The ancient motto of Ragusa, Non bene pro toto libertas venditur auro ('Liberty is not sold for all the gold in the world'), now serves as the watchword of an entire nation.\n\nBut liberty must be earned and defended, not merely proclaimed. The path ahead demands vision, resources, and the will to act. Whether Dalmatia shall endure as a republic of merchants or a league of warriors, only the choices of its rulers will determine."
 nd_dal.5.a: "Notre destin est devant nous"
 nd_dal.6.t: "L'art du hommage"
 nd_dal.6.d: "Dalmatia has secured the ports of the Gulf of Kotor, establishing the system of tributary diplomacy that Ragusa perfected over centuries. By paying measured tribute to greater powers while maintaining internal autonomy, the republic purchases what fortresses alone cannot guarantee: the freedom to trade, to govern, and to endure.\n\nThe consuls and ambassadors of Dalmatia are now established in every court that matters. They carry gifts calibrated to the penny, intelligence gathered from every harbor, and the quiet confidence of men who know that their small republic's survival depends on being more useful alive than conquered."
 nd_dal.6.a: "L'hommage est le prix de la liberté"
 nd_dal.7.t: "Le magasin méditerranéen"
 nd_dal.7.d: "Dalmatian merchants now trade from the Adriatic to the Ionian Sea and beyond. With banking institutions adopted and Corfu secured as a commercial staging post, Dalmatian argosies carry salt, cloth, and dyes to ports that once dealt only with Venice or Genoa.\n\nThe republic's growing wealth attracts both opportunity and scrutiny. Shall we invest in expanding our network of consulates and trade agents, building permanent diplomatic infrastructure across the Mediterranean? Or shall we perfect the art of tributary diplomacy, using our wealth to buy the autonomy and trading rights that keep the republic free?"
 nd_dal.7.a: "Étendre le réseau consulaire"
 nd_dal.7.b: "Perfectionner l'art de l'hommage"
 nd_dal.8.t: "Libertas Aeterna"
 nd_dal.8.d: "The dream of Ragusa has been fulfilled on a scale its founders could never have imagined. Dalmatia's commercial empire stretches from the Adriatic to the shores of Crete, its consulates line the ports of the Mediterranean, and its treasury overflows with the wealth of nations.\n\nThe republic's motto, Libertas, is no longer a prayer whispered behind city walls. It is a fact demonstrated by gold, by ships, and by the grudging respect of empires. But how shall this liberty be exercised? Shall Dalmatia become a beacon of civilization, its academies and law courts attracting the finest minds of Europe? Or shall the merchant princes consolidate their power, building an oligarchy of wealth that shapes the commerce of the Mediterranean?"
 nd_dal.8.a: "Laisse la liberté illuminer le monde"
 nd_dal.8.b: "Les marchands guideront la république"
 nd_dal.9.t: "Maîtres du détroit"
 nd_dal.9.d: "The Maritime League has seized control of the eastern Adriatic coast from Dalmatia to Albania. Durres and Shkoder now fly Dalmatian colors, giving the fleet control of the narrow strait that connects the Adriatic to the wider Mediterranean.\n\nNo ship enters or leaves the Adriatic without passing within range of Dalmatian galleys. Pirates who once preyed on coastal shipping find themselves hunted by bracera patrols that know every cove and inlet. The strait belongs to Dalmatia, and the commerce that flows through it pays toll to Dalmatian ports."
 nd_dal.9.a: "Le détroit est à nous"
 nd_dal.10.t: "Thalassocratie d'Orient"
 nd_dal.10.d: "Dalmatian naval power now extends deep into the Aegean. Thessaloniki, the great port that once served Byzantine and Ottoman emperors, answers to the Maritime League. The Dalmatian fleet, from its heavy argosies to its swift bracera galleys, patrols waters that Venice and Genoa once considered their private seas.\n\nShall we establish permanent naval patrols across the Adriatic and Aegean, hunting pirates and enforcing Dalmatian maritime law? Or shall we fortify our island holdings, building garrisons that ensure lasting control of strategic chokepoints?"
 nd_dal.10.a: "Patrouillez les mers sans repos"
 nd_dal.10.b: "Fortifiez chaque île que nous détenons"
 nd_dal.11.t: "Mare Nostrum"
 nd_dal.11.d: "Venice has fallen. The city of the doges, the ancient mistress of the Adriatic, now submits to the maritime league it once dismissed as a chain of fishing villages. With Bari on the Italian shore also under Dalmatian control, the entire Adriatic Sea is a Dalmatian lake.\n\nThe transformation is complete. From a confederation of coastal communes to the dominant naval power of the eastern Mediterranean, the Maritime League has achieved what centuries of Venetian diplomacy sought to prevent. How shall this new power project itself? As a seaborne empire ruled by the doge's authority, or as a professional military state commanded by fleet admirals?"
 nd_dal.11.a: "Le doge commande les vagues"
 nd_dal.11.b: "Les amiraux de la flotte dirigeront"
 STATIC_MODIFIER_NAME_nd_dal_dest_consul_network: "Réseau consulaire"
 STATIC_MODIFIER_DESC_nd_dal_dest_consul_network: "Un réseau de consulats et d'agents commerciaux dalmates établis dans les ports méditerranéens, fournissant un accès diplomatique et des renseignements commerciaux qui étendent la portée de la république bien au-delà de ses modestes frontières."
 STATIC_MODIFIER_NAME_nd_dal_dest_tribute_mastery: "Maîtrise des hommages"
 STATIC_MODIFIER_DESC_nd_dal_dest_tribute_mastery: "L'art perfectionné de la diplomatie tributaire : utiliser des paiements soigneusement mesurés et des concessions commerciales pour acheter l'autonomie auprès de puissances plus grandes tout en élargissant discrètement l'influence commerciale dalmate."
 STATIC_MODIFIER_NAME_nd_dal_dest_beacon_of_liberty: "Phare de la Liberté"
 STATIC_MODIFIER_DESC_nd_dal_dest_beacon_of_liberty: "Dalmatia as a shining example of republican civilization, its academies, law courts, and tolerance attracting the finest minds and most industrious people of the Mediterranean, though the republic's military preparedness suffers from its pacific orientation."
 STATIC_MODIFIER_NAME_nd_dal_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_dal_dest_merchant_princes: "A powerful oligarchy of Dalmatian merchant families who control the republic's commercial empire, investing in infrastructure and financial instruments, though their focus on profit drives up the cost of maintaining standing armies."
 STATIC_MODIFIER_NAME_nd_dal_dest_adriatic_patrol: "Patrouille Adriatique"
 STATIC_MODIFIER_DESC_nd_dal_dest_adriatic_patrol: "Des patrouilles navales dalmates permanentes balaient l'Adriatique et la mer Égée, chassant les pirates, faisant respecter la loi maritime et projetant la puissance de la ligue à travers la Méditerranée orientale."
 STATIC_MODIFIER_NAME_nd_dal_dest_island_garrisons: "Garnisons insulaires"
 STATIC_MODIFIER_DESC_nd_dal_dest_island_garrisons: "Des garnisons fortifiées sur des îles stratégiques et des positions côtières, assurant le contrôle dalmate des points d'étranglement clés et fournissant des bases sécurisées pour les opérations navales de la ligue."
 STATIC_MODIFIER_NAME_nd_dal_dest_doge_of_the_sea: "Doge de la Mer"
 STATIC_MODIFIER_DESC_nd_dal_dest_doge_of_the_sea: "Un empire maritime gouverné par l'autorité navale du doge, avec la richesse des ports conquis finançant la flotte et le pillage des rivaux enrichissant le trésor."
 STATIC_MODIFIER_NAME_nd_dal_dest_fleet_admiral: "Amiral de la flotte"
 STATIC_MODIFIER_DESC_nd_dal_dest_fleet_admiral: "Une structure de commandement militaire professionnelle avec des amiraux de flotte dirigeant les opérations navales et terrestres, mettant l'accent sur un déploiement rapide, l'efficacité logistique et des campagnes soutenues."
 nd_dal_consulate: "Consulat de Ragusa"
 nd_dal_consulate_desc: "Un bureau diplomatique et commercial dalmate permanent dans la tradition ragusaine, où les consuls gèrent les accords commerciaux, rassemblent des renseignements et représentent les intérêts de la république avec l'habileté de plusieurs siècles de pratique diplomatique."
 nd_dal_consulate_maintenance: "Entretien du consulat"
 nd_dal_consulate_maintenance_desc: "Papier pour la correspondance diplomatique, tissus fins pour les occasions officielles et mobilier pour les bureaux du consul."
 nd_dal_arsenal: "Arsenal dalmate"
 nd_dal_arsenal_desc: "Un chantier naval et une armurerie fortifiés où la Ligue maritime construit et approvisionne sa flotte, combinant l'expertise en construction navale des communes dalmates avec la discipline militaire d'une marine professionnelle."
 nd_dal_arsenal_maintenance: "Entretien de l'arsenal"
 nd_dal_arsenal_maintenance_desc: "Bois et goudron pour la construction navale, fer pour l'armement et l'équipement, et outils pour les ateliers de l'arsenal."

 # ===== BUREAUCRACIES =====
 dal_consilium_rogatorum_bureaucracy: "Consilium Rogatorum"
 dal_consilium_rogatorum_bureaucracy_desc: "Créé en 1253, le Sénat de Raguse réunissait quarante-cinq patriciens de plus de quarante ans, chacun élu pour un an par le Conseil Majeur, pour conseiller le recteur à rotation mensuelle. Au XVIe siècle, le Sénat avait remplacé le recteur en tant qu'exécutif de la République, et les sénateurs en sont venus à être qualifiés de « nobles de la noblesse ». La chambre a consolidé l'aristocratie urbaine au détriment de tout pouvoir exécutif indépendant de la classe patricienne."
 dal_officium_sanitatis_bureaucracy: "Officium Sanitatis"
 dal_officium_sanitatis_bureaucracy_desc: "Le 27 juillet 1377, le Conseil majeur adopta le premier décret de quarantaine d'État au monde, exigeant un isolement de trente jours sur les îles de Mrkan, Bobara et Supetar pour tout marchand ou navire arrivant de terres suspectes de peste. Le lazzaretto de Lokrum a été commencé en 1533 et le complexe de dix bâtiments de Ploce a été achevé en 1642. Les Cazamorti qui ont imposé le cordon ont maintenu le commerce de l'Adriatique pendant chaque siècle de peste et ont donné à Venise (1423) et à Gênes (1467) le modèle qu'ils ont copié."
 dal_statuta_communium_bureaucracy: "Statut Communum"
 dal_statuta_communium_bureaucracy_desc: "Les statuts communaux codifiés des villes dalmates - la loi de Korcula (rédaction conservée de 1265, traditionnellement datée de 1214), le Code Vinodol adopté le 6 janvier 1288 en écriture glagolitique (la deuxième plus ancienne loi slave après la Russkaya Pravda), Zadar (1305), Split (1312) et Trogir (1322) - limitaient l'autorité comitale sur les communes et autonomie gouvernementale codifiée sous la direction d'élus Knez et de conseillers. Leur refus de la torture et des épreuves judiciaires a donné naissance à une tradition juridique latino-slave sans équivalent dans l'Est de l'Adriatique."
 dal_stradioti_levy_bureaucracy: "Prélèvement frontalier de Stradioti"
 dal_stradioti_levy_bureaucracy_desc: "À partir d'environ 1475, les propriétés dalmates vénitiennes de Trau, Sibenico, Castelnuovo et Zara élevèrent des stradioti - des chevaux légers des Balkans armés d'une lance, d'un long sabre, d'une masse et d'un poignard - pour tenir la frontière ottomane. Ils ont combattu dans la tradition byzantine-slave-albanaise de raids éclair, d'embuscades et de feintes de retraite peu familière aux armées occidentales, et ont été les pionniers de la doctrine de la cavalerie légère que les puissances européennes ont passé deux siècles à imiter. Les propriétaires frontaliers qui les ont érigés ont chassé les anciennes milices urbaines de la côte."
 dal_tributary_diplomacy_bureaucracy: "Diplomatie tributaire"
 dal_tributary_diplomacy_bureaucracy_desc: "La stratégie par laquelle la République de Raguse a préservé ses libertas de 1358 à 1808. Le traité de 1458 avec Mehmed II a fait de la République un affluent du sultan, livrant 12 500 ducats chaque novembre à Constantinople en échange d'un passage sûr et d'un commerce exonéré d'impôts à travers les terres ottomanes, tandis que Raguse restait simultanément protégée par le pape. En 1800, la République exploitait des consulats dans plus de quatre-vingts ports à travers le monde : l’appareil diplomatique par habitant le plus dense de l’Europe moderne."

 AUTO_MODIFIER_NAME_nd_dal_bureaucracy_authority: "Autorité communale dalmate"
 AUTO_MODIFIER_DESC_nd_dal_bureaucracy_authority: "Lors de la formation de[DAL.GetName], les traditions institutionnelles héritées des cités-républiques de l'Adriatique - le Sénat de Raguse, la première quarantaine au monde, les statuts communaux codifiés, le prélèvement frontalier Stradioti et la diplomatie tributaire de Raguse - deviennent disponibles en tant que bureaucraties basculantes de l'État unifié."
