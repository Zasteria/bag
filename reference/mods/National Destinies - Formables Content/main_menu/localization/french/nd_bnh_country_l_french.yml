 BNH: "Beth Nahraïn"
 BNH_ADJ: "Nahraïn"
 BNH_f: "Beth Nahraïn"
 BNH_f_desc: "Beth Nahrain « Terre entre les rivières » en syriaque restaure la Mésopotamie sous les héritiers chrétiens de Ninive et d'Edesse. Les patriarches de l’Église d’Orient dirigent toujours les troupeaux de la diaspora, du Tigre au Cathay ; les monastères de Tur Abdin ont résisté aux seigneurs mongols, mamelouks et turkmènes avec leur autonomie intacte ; le comté d'Edesse a prouvé qu'un État latino-syriaque pouvait contrôler la haute Jazira. La formation de Beth Nahrain consolide ces fils en un seul système politique chrétien de langue araméenne centré sur Mossoul, l’ancien siège du Patriarcat, avec Tur Abdin et Edessa comme poumons spirituels."
