l_french:

 # Game Rule
 rule_nd_destinies_rule: "Arbres du Destin des Destinées Nationales"
 setting_nd_destinies_enabled: "Activé"
 setting_nd_destinies_enabled_desc: "Chaque pays formable obtient un arbre de destinée post-formation ramifié (avancée de racine plus deux chemins de trois étapes chacun) fourni via le système[advances|e], avec des fenêtres contextuelles[dynamic_historical_event|e]et des bâtiments de synthèse liés à des avancées spécifiques."
 setting_nd_destinies_disabled: "Désactivé"
 setting_nd_destinies_disabled_desc: "Les avancées du destin n'apparaissent pas après la formation. Les événements de formation et les modificateurs chronométrés sont toujours joués ; les arbres d'avancement du patrimoine, les bureaucraties et les unités/bâtiments/prélèvements personnalisés restent activés."
