l_french:
 STATIC_MODIFIER_NAME_nd_rus_third_rome_ascendant: "Troisième Ascendant de Rome"
 STATIC_MODIFIER_DESC_nd_rus_third_rome_ascendant: "Moscou se présente comme le successeur de Rome et de Constantinople, le dernier gardien du véritable christianisme orthodoxe. Le tsar règne sur terre en tant que vaisseau choisi par Dieu, et de cette autorité sacrée découle le pouvoir d'unir toutes les terres russes sous une couronne unique et inébranlable."
 STATIC_MODIFIER_NAME_nd_rus_empire_of_the_steppe: "Empire des steppes"
 STATIC_MODIFIER_DESC_nd_rus_empire_of_the_steppe: "Le destin de la Russie ne réside pas dans les cours exiguës de l’Europe mais dans les étendues sans limites qui s’étendent à l’est jusqu’au Pacifique. Le cosaque et le trappeur de fourrures portent la bannière du tsar dans le désert, et chaque rivière traversée, chaque ostrog élevé étend la domination de l'empire."
 nd_rus.1.t: "La naissance de la Russie"
 nd_rus.1.d: "The scattered principalities of the Rus have been forged into a single empire. Moscow, Novgorod, Tver, Ryazan, all bow to one sovereign, and the double-headed eagle spreads its wings across a vast dominion. But what kind of empire shall this be? The Orthodox clergy speak of Moscow as the Third Rome, the last bastion of true Christianity, destined to lead the faithful until the end of days. The Tsar's authority, they argue, derives from God alone, and the empire's purpose is to be the guardian of Orthodoxy.\n\nBut others look eastward, to the endless steppes and the frozen wilderness of Siberia, where fortunes are measured in furs and new lands stretch beyond imagination. The Cossacks and frontiersmen who push the borders ever further need not priests but powder and provisions. They see an empire built not on divine mandate but on conquest and trade, stretching from the Baltic to the Pacific.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rus.1.a: "Moscow is the Third Rome. There shall be no fourth."
 nd_rus.1.b: "Our destiny lies in the East, to the Pacific and beyond."
 nd_rus.2.t: "Le Corps Streltsy"
 nd_rus.2.d: "A new kind of soldier marches through the streets of Moscow. Armed with matchlock muskets and heavy bardiches, the Streltsy are Russia's first permanent standing infantry, salaried, uniformed, and drilled in the use of firearms. Unlike the feudal cavalry of the boyars, these men owe their loyalty directly to the Tsar. Initially numbering some three thousand, the corps has grown to garrison every major city, their distinctive colored coats becoming a symbol of centralized military power.\n\nThe question now is how to employ them. As a disciplined field force, trained in European-style volley fire and capable of standing against any army on the continent? Or as garrison troops, manning the walls of Russian cities and frontier fortresses, providing the backbone of the empire's defensive network?"
 nd_rus.2.a: "Formez-les comme une armée de campagne professionnelle."
 nd_rus.2.b: "Placez-les comme colonne vertébrale de la garnison de l'empire."
 nd_rus.3.t: "L'Oprichnina"
 nd_rus.3.d: "The Tsar has divided the realm in two. One half (the zemshchina) remains under the old administration of the boyars. The other (the oprichnina) belongs to the Tsar alone, governed by his personal guard of oprichniki, black-clad horsemen who ride with a dog's head and broom at their saddle, symbolizing their mission to sniff out and sweep away treason.\n\nThe oprichniki answer to no court, no law, and no boyar. They have already massacred the nobility of Novgorod, razed estates, and terrorized anyone suspected of disloyalty. The old aristocracy trembles. But at what cost? The borderlands lie undefended as the best troops are turned inward, and the economy groans under the weight of confiscation. Is this the price of autocratic security, or will restraint prove a surer path to stability?"
 nd_rus.3.a: "Laissez les oprichniki faire leur travail. La trahison doit être brûlée racine et branche."
 nd_rus.3.b: "Modérez les purges. L’empire a besoin de stabilité, pas de terreur."
 nd_rus.4.t: "Le tableau des classements"
 nd_rus.4.d: "In a stroke that shakes the foundations of Russian society, the Tsar has decreed a new Table of Ranks, classifying all civil and military positions into fourteen grades. Henceforth, advancement in the service of the state shall be determined not by birth but by merit and seniority. A commoner who reaches the eighth rank automatically receives hereditary nobility.\n\nThe old boyar families are outraged, seeing their ancestral privileges swept aside. But the Tsar's vision is clear: Russia needs competent administrators and officers, not hereditary parasites. The Table of Ranks opens the doors of government to talent regardless of origin, creating a new service nobility whose loyalty is to the state rather than to clan or tradition."
 nd_rus.4.a: "Le mérite sera la mesure d'un homme."
 nd_rus.5.t: "La science de la victoire"
 nd_rus.5.d: "General Alexander Suvorov has transformed Russian military doctrine with his treatise 'The Science of Victory.' His principles are brutally simple: train relentlessly, move fast, strike with the bayonet. 'The bullet is a fool, the bayonet a fine fellow,' he teaches his grenadiers. His campaigns have proven the doctrine sound: undefeated in over sixty battles, Suvorov's soldiers march faster, hit harder, and fight with a fury that confounds their enemies.\n\nHis methods emphasize speed over caution, attack over defense, and the initiative of individual soldiers over rigid formation drill. Russian grenadiers trained in his school are among the finest infantry in Europe."
 nd_rus.5.a: "La baïonnette ne ment jamais."
 STATIC_MODIFIER_NAME_nd_rus_streltsy_discipline: "Discipline de terrain Streltsy"
 STATIC_MODIFIER_DESC_nd_rus_streltsy_discipline: "Le corps Streltsy est formé comme une armée de campagne professionnelle, entraîné au tir à la volée et aux manœuvres disciplinées."
 STATIC_MODIFIER_NAME_nd_rus_streltsy_garrison: "Réseau de garnison Streltsy"
 STATIC_MODIFIER_DESC_nd_rus_streltsy_garrison: "Les garnisons Streltsy constituent une épine dorsale défensive permanente dans les villes et forteresses de l'empire."
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_terror: "Terreur d'Oprichnina"
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_terror: "Les oprichniki du tsar imposent une loyauté absolue par la peur. Aucun boyard, aucune ville, aucune province n’est à l’abri de leur portée."
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_restraint: "Autocratie modérée"
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_restraint: "Le tsar a choisi de gouverner avec fermeté mais sans les excès d’une terreur incontrôlée, en bâtissant la loyauté grâce à une administration compétente."
 nd_rus_druzhina_tradition: "Tradition Druzhina"
 nd_rus_druzhina_tradition_desc: "La druzhina (la suite personnelle de guerriers à cheval au service du prince) constitue le noyau de la première puissance militaire russe, une tradition qui évolue pour devenir les armées cosaques de la frontière."
 nd_rus_veche_assemblies: "Assemblées de Veche"
 nd_rus_veche_assemblies_desc: "La veche, ou assemblée populaire, constitue un forum de prise de décision collective dans les villes russes, tempérant l'autorité princière par la participation civique."
 nd_rus_fur_trade: "Fondations du commerce des fourrures"
 nd_rus_fur_trade_desc: "Les forêts du nord de la Russie produisent une abondance de zibeline, de renard et d'hermine, constituant l'épine dorsale du premier commerce russe et attirant des marchands d'aussi loin que Constantinople et le monde islamique."
 nd_rus_gathering_of_lands: "Rassemblement des terres russes"
 nd_rus_gathering_of_lands_desc: "Sous Ivan III, Moscou absorbe systématiquement les principautés russes indépendantes (Novgorod, Tver, Iaroslavl, Rostov), forgeant un État unifié à partir de la mosaïque d’apanages médiévaux."
 nd_rus_third_rome: "Troisième Rome"
 nd_rus_third_rome_desc: "Après la chute de Constantinople en 1453, Moscou revendique le rôle de la Troisième Rome, dernière gardienne du christianisme orthodoxe, avec le tsar comme représentant de Dieu sur terre."
 nd_rus_sudebnik: "Code de droit de Sudebnik"
 nd_rus_sudebnik_desc: "Le Sudebnik de 1497 établit un code juridique unifié pour toutes les terres russes, remplaçant la mosaïque de coutumes locales par une justice centralisée administrée par les tribunaux du Grand Prince."
 nd_rus_merchant_courts: "Tradition Gostiny Dvor"
 nd_rus_merchant_courts_desc: "Le Gostiny Dvor (tribunaux marchands où les commerçants de toute la Russie et des pays étrangers se réunissent pour faire des affaires) devient la pierre angulaire de la vie commerciale russe, réglementée par l'État pour l'ordre et les revenus."
 nd_rus_stone_kremlins: "Kremlins de pierre"
 nd_rus_stone_kremlins_desc: "Les villes russes remplacent leurs palissades en bois par d'imposantes forteresses en pierre du Kremlin, créant ainsi de formidables citadelles qui servent à la fois de défense militaire et d'autorité politique."
 nd_rus_pomestye_system: "Domaines de service Pomestye"
 nd_rus_pomestye_system_desc: "Le système pomestye accorde des propriétés foncières conditionnelles aux serviteurs militaires en échange d'un service à cheval, créant ainsi une nouvelle classe de nobles de service liés à l'armée du tsar."
 nd_rus_boyar_duma: "Douma des boyards"
 nd_rus_boyar_duma_desc: "La Boyar Duma, un conseil consultatif composé des plus hauts nobles et du clergé, délibère sur les questions d'État, de guerre et de droit au gré du tsar."
 nd_rus_streltsy_corps: "Corps Streltsy"
 nd_rus_streltsy_corps_desc: "Ivan IV crée les Streltsy, la première infanterie permanente russe armée d'armes à feu. Salariés et en uniforme, ils représentent une étape décisive vers une armée professionnelle."
 nd_rus_oprichnina: "Opritchnina"
 nd_rus_oprichnina_desc: "Ivan IV crée l'oprichnina, un État dans l'État gouverné par sa garde personnelle d'oprichniki vêtus de noir, qui font respecter l'autorité absolue du tsar par la terreur et la confiscation."
 nd_rus_siberian_conquest: "Conquête sibérienne"
 nd_rus_siberian_conquest_desc: "La conquête du Khanat de Sibir ouvre la voie vers les vastes étendues sauvages au-delà de l'Oural, où les explorateurs cosaques et les commerçants de fourrures repoussent toujours plus la frontière vers l'est, vers le Pacifique."
 nd_rus_orthodox_arts: "Renaissance culturelle orthodoxe"
 nd_rus_orthodox_arts_desc: "La peinture d'icônes russe, l'architecture d'église et la musique liturgique atteignent de nouveaux sommets de réalisation artistique, créant une tradition culturelle orthodoxe distinctive qui rivalise avec l'art de Byzance lui-même."
 nd_rus_smuta_resilience: "Résilience Smuta"
 nd_rus_smuta_resilience_desc: "Le Temps des Troubles met la Russie à l’épreuve jusqu’à son point de rupture (famine, invasion, guerre civile et prétendants au trône) mais la nation perdure, émergeant avec un sentiment approfondi d’identité nationale et de résilience."
 nd_rus_grain_spirits: "Industrie des spiritueux céréaliers"
 nd_rus_grain_spirits_desc: "Les distillateurs russes perfectionnent la production de spiritueux à base de céréales, créant ainsi une industrie nationale qui génère des revenus importants pour le trésor public grâce à des ventes monopolistiques."
 nd_rus_cossack_hosts: "Hôtes cosaques"
 nd_rus_cossack_hosts_desc: "Les communautés cosaques semi-autonomes du Don, du Zaporozhian Sich et de Yaik sont formalisées en tant qu'hôtes militaires, fournissant à l'empire une superbe cavalerie légère en échange de terres et d'autonomie gouvernementale."
 nd_rus_prikazy_system: "Système Prikazy"
 nd_rus_prikazy_system_desc: "Les prikazy, ou départements gouvernementaux, évoluent de commissions ad hoc vers un appareil bureaucratique permanent, chacun étant responsable d'une fonction spécifique de l'État : affaires étrangères, approvisionnement militaire, trésor, justice."
 nd_rus_patriarch: "Patriarcat de Moscou"
 nd_rus_patriarch_desc: "La création du Patriarcat de Moscou en 1589 élève l’Église russe à la pleine indépendance, confirmant ainsi l’autorité spirituelle de Moscou sur tous les croyants orthodoxes."
 nd_rus_new_regiments: "Nouveaux régiments de formation"
 nd_rus_new_regiments_desc: "Des officiers formés en Europe entraînent les soldats russes aux méthodes militaires occidentales, créant de « nouvelles formations » de régiments d'infanterie, de dragons et de reiters qui complètent la cavalerie traditionnelle Streltsy et féodale."
 nd_rus_ural_ironworks: "Usines sidérurgiques de l'Oural"
 nd_rus_ural_ironworks_desc: "Les montagnes de l'Oural recèlent de vastes gisements de minerai de fer et la création de fonderies financées par l'État transforme la Russie en l'un des plus grands producteurs européens de fer et de canons."
 nd_rus_ulozheniye: "Sobornoye Oulojenie"
 nd_rus_ulozheniye_desc: "Le Code législatif de 1649 codifie la hiérarchie sociale de l’État russe, liant définitivement les paysans à la terre en tant que serfs et établissant le cadre juridique d’une gouvernance autocratique qui perdurera pendant deux siècles."
 nd_rus_don_host: "Hôte cosaque du Don"
 nd_rus_don_host_desc: "Les Cosaques du Don sont officiellement reconnus comme un domaine militaire de l'empire, fournissant une cavalerie légère d'élite pour les campagnes du tsar en échange de l'autonomie sur leurs terres ancestrales le long du fleuve Don."
 nd_rus_petrine_navy: "Réformes navales pétrines"
 nd_rus_petrine_navy_desc: "Pierre le Grand, après avoir travaillé comme apprenti charpentier naval dans des chantiers navals hollandais et anglais, revient pour construire en Russie une marine à partir de rien : en créant des académies navales, des chantiers navals et la nouvelle capitale de Saint-Pétersbourg comme fenêtre sur la mer."
 nd_rus_baltic_fleet: "Flotte Baltique"
 nd_rus_baltic_fleet_desc: "La création de la flotte baltique transforme la Russie d'une puissance enclavée en une force navale capable de contester la mer Baltique, de défier la domination suédoise et de garantir l'accès de la Russie au commerce européen."
 nd_rus_table_of_ranks: "Tableau des classements"
 nd_rus_table_of_ranks_desc: "La Table des grades de Pierre le Grand remplace le privilège héréditaire par le service méritocratique, classant tous les postes civils et militaires en quatorze grades et ouvrant l'avancement aux talents quelle que soit leur naissance."
 nd_rus_guberniya: "Système de Guberniya"
 nd_rus_guberniya_desc: "L'empire est réorganisé en guberniyas, des provinces gouvernées par des gouverneurs nommés responsables directement devant le gouvernement central, remplaçant l'ancienne mosaïque d'administration locale."
 nd_rus_military_colonies: "Colonisation militaire"
 nd_rus_military_colonies_desc: "Les colons soldats sont établis dans les régions frontalières, combinant le service militaire avec l'agriculture pour assurer à la fois la défense et la subsistance de l'empire en expansion."
 nd_rus_suvorov_school: "École militaire de Souvorov"
 nd_rus_suvorov_school_desc: "Les doctrines d'Alexandre Suvorov sur la vitesse, l'agression et l'assaut à la baïonnette produisent une génération de grenadiers d'élite qui combattent avec une férocité et une initiative tactique inégalées."
 nd_rus_great_power_diplomacy: "Diplomatie des grandes puissances"
 nd_rus_great_power_diplomacy_desc: "L’émergence de la Russie en tant que grande puissance européenne nécessite un corps diplomatique sophistiqué, et l’empire a désormais des ambassadeurs auprès de toutes les grandes cours, exerçant une influence de Paris à Constantinople."
 nd_rus_enlightenment: "Lumières russes"
 nd_rus_enlightenment_desc: "Catherine la Grande correspond avec Voltaire et Diderot, fonde la Société économique libre et fonde des écoles dans tout l'empire. Les lettres, la science et la philosophie russes prospèrent comme jamais auparavant."
 nd_rus_industrial_dawn: "L’aube industrielle"
 nd_rus_industrial_dawn_desc: "Les premiers frémissements de l’industrialisation atteignent la Russie alors que la production mécanisée commence dans le textile et la métallurgie et que les usines parrainées par l’État se multiplient dans l’Oural et autour de Moscou."
 a_nd_rus_streltsy: "Streltsy"
 a_nd_rus_streltsy_desc: "L'infanterie de mousquets debout de Moscou, en uniforme et salariée, armée d'armes à feu à mèche et de lourdes bardiches. L’épine dorsale de la puissance militaire russe à l’ère de la poudre à canon."
 a_nd_rus_cossack_cavalry: "Cavalerie légère cosaque"
 a_nd_rus_cossack_cavalry_desc: "Cavaliers des steppes issus des communautés frontalières, cavaliers et pillards experts qui servent d'yeux et d'oreilles à l'empire à travers les vastes frontières du sud."
 a_nd_rus_oprichnik: "Cavalerie opritchnik"
 a_nd_rus_oprichnik_desc: "Les hommes de main personnels du tsar, des cavaliers vêtus de noir qui portent une tête de chien et un balai en selle, symboles de leur mission consistant à détecter et à balayer la trahison."
 a_nd_rus_don_cossack: "Don Cosaque"
 a_nd_rus_don_cossack_desc: "Cavaliers d'élite de l'armée cosaque du Don, cavaliers vétérans qui combinent les traditions d'équitation des steppes avec un service militaire discipliné auprès de l'empire."
 a_nd_rus_suvorov_grenadier: "Grenadier de Souvorov"
 a_nd_rus_suvorov_grenadier_desc: "Infanterie d'élite entraînée à la doctrine de Suvorov sur la vitesse et l'assaut à la baïonnette. « La balle est un imbécile, la baïonnette un brave garçon » : ces hommes incarnent ce credo."
 n_nd_rus_baltic_frigate: "Frégate Baltique"
 n_nd_rus_baltic_frigate_desc: "Un navire de guerre rapide de la flotte russe de la Baltique, construit dans les nouveaux chantiers navals de Saint-Pétersbourg pour contester la domination suédoise sur les mers du Nord."
 nd_rus_gostiny_dvor: "Gostiny Dvor"
 nd_rus_gostiny_dvor_desc: "Un tribunal marchand où les commerçants de toute la Russie et des pays étrangers se rassemblent pour vendre leurs marchandises sous la réglementation de l'État, favorisant ainsi le commerce ordonné et la collecte des impôts."
 nd_rus_gostiny_dvor_upkeep: "Entretien Gostiny Dvor"
 nd_rus_gostiny_dvor_upkeep_desc: "Coûts d'entretien pour l'entretien de la cour marchande : bois pour la construction, pierre pour les réparations, papier pour les registres commerciaux et les contrats, et tissu pour l'exposition et les besoins des marchands."
 nd_rus_kreml: "Kremlin de pierre"
 nd_rus_kreml_desc: "Une citadelle de pierre fortifiée au cœur d'une ville russe, alliant défense militaire et siège de l'autorité politique et du culte orthodoxe."
 nd_rus_kreml_garrison: "Garnison du Kremlin"
 nd_rus_kreml_garrison_desc: "La garnison permanente qui maintient les défenses du Kremlin, consomme des armes, des pierres pour les réparations, des armes à feu pour les soldats et des outils pour la construction et l'entretien."
 nd_rus_ural_foundry: "Usines sidérurgiques de l'Oural"
 nd_rus_ural_foundry_desc: "Une fonderie de fer parrainée par l'État dans les montagnes de l'Oural, transformant les vastes gisements de minerai de la région en fer et en acier pour les arsenaux de l'empire."
 nd_rus_iron_smelting: "Fonderie de fer de l'Oural"
 nd_rus_iron_smelting_desc: "Fusion à l'échelle industrielle du minerai de fer de l'Oural en acier de haute qualité à l'aide de hauts fourneaux alimentés au charbon de bois et au coke."
 nd_rus_naval_academy: "Académie navale"
 nd_rus_naval_academy_desc: "Une école de navigation et de construction navale établie dans la tradition pétrine, formant des officiers et des artisans pour construire et piloter la flotte russe en pleine croissance."
 nd_rus_naval_academy_upkeep: "Entretien de l'Académie navale"
 nd_rus_naval_academy_upkeep_desc: "Coûts d'entretien de l'académie navale : bois et fournitures navales pour les navires-écoles, outils pour l'enseignement des charpentiers navals et papier pour les cartes et les programmes de navigation."
 nd_rus_fur_post: "Poste de traite des fourrures"
 nd_rus_fur_post_desc: "Une station commerciale frontalière où les trappeurs apportent des peaux de zibeline, de renard et d'hermine pour les collecter, les classer et les expédier vers les marchés de Moscou et au-delà."
 nd_rus_fur_post_upkeep: "Entretien du poste de traite"
 nd_rus_fur_post_upkeep_desc: "Entretien du poste frontalier : outils pour les trappeurs et travaux de réparation, bois de construction pour la structure du poste et sel pour conserver les peaux avant expédition au marché."
 nd_rus_vodka_distillery: "Distillerie de Vodka"
 nd_rus_vodka_distillery_desc: "Une distillerie d'alcool de céréales produisant une liqueur russe distinctive qui génère des revenus importants grâce à des ventes monopolistiques contrôlées par l'État."
 nd_rus_vodka_production: "Distillation de Vodka"
 nd_rus_vodka_production_desc: "La distillation du grain de blé en spiritueux hautement résistants destinés à la consommation intérieure et à l'exportation."
 levy_nd_rus_cossack_cavalry: "Prélèvement cosaque"
 levy_nd_rus_cossack_cavalry_desc: "Cavalerie légère issue des communautés frontalières cosaques."
 levy_nd_rus_don_cossack: "Prélèvement cosaque du Don"
 levy_nd_rus_don_cossack_desc: "Cavalerie d'élite issue de l'armée cosaque du Don."
 nd_rus_formed_tt: "La Russie s'est formée"
 nd_rus_path_a_tt: "Choisissez le destin#bold Troisième Rome Ascendant#!"
 nd_rus_path_b_tt: "Choisissez le destin#bold Empire de la Steppe#!"
 nd_rus_destiny: "Mandat Impérial"
 nd_rus_destiny_desc: "La Russie s'est forgée à partir des principautés dispersées de la Rus. Le tsar doit désormais démontrer que ce nouvel État possède la stabilité et l’autorité nécessaires pour perdurer. Seul un royaume en paix avec lui-même peut poursuivre les grandes ambitions qui l’attendent."
 nd_rus_dest_mother_cities: "Retour des villes mères"
 nd_rus_dest_mother_cities_desc: "Récupérez Kiev, berceau baptismal de la Rus, et Vilnius, capitale du Grand-Duché qui contestait la prétention de Moscou à la suprématie orthodoxe. Adoptez le système bancaire moderne pour financer les campagnes occidentales."
 nd_rus_dest_baltic_window: "La fenêtre baltique"
 nd_rus_dest_baltic_window_desc: "Saisissez les grands ports baltes de Riga et de Tallinn pour percer dans le commerce maritime européen. Amassez la trésorerie nécessaire pour soutenir un empire orienté vers l’ouest."
 nd_rus_dest_third_rome_fulfilled: "La troisième Rome monte"
 nd_rus_dest_third_rome_fulfilled_desc: "Prenez Constantinople elle-même et restaurez Sainte-Sophie au culte orthodoxe. Seul un empire puissant et prestigieux peut revendiquer le rôle de Rome."
 nd_rus_dest_eastern_road: "La route de l'Est"
 nd_rus_dest_eastern_road_desc: "Conquérir Kazan, qui bloque la route vers l'Est, et s'emparer de Tobolsk, porte d'entrée vers la Sibérie. Établir des institutions bancaires pour financer la vaste entreprise d’expansion vers l’Est."
 nd_rus_dest_siberian_wealth: "Richesse sibérienne"
 nd_rus_dest_siberian_wealth_desc: "Développez les vastes territoires de l’empire grâce au progrès institutionnel et à la croissance économique. Construisez un réseau de commerce des fourrures qui alimente les marchés de Moscou et du monde. L’imprimerie doit atteindre la frontière."
 nd_rus_dest_continental_colossus: "Colosse continental"
 nd_rus_dest_continental_colossus_desc: "Transformez la Russie en l’empire terrestre le plus développé de l’histoire. Les Lumières doivent éclairer même les provinces les plus éloignées, le trésor doit déborder et le monde doit reconnaître la grandeur russe."
 nd_rus.6.t: "Le mandat impérial"
 nd_rus.6.d: "The Russian state has achieved a measure of stability that few thought possible in these turbulent lands. The boyars have been brought to heel, the Church blesses the Tsar's authority, and the common people look to Moscow as the center of their world. This stability is not an end but a beginning: the foundation upon which a great empire may be built.\n\nThe question now is what kind of empire Russia shall become."
 nd_rus.6.a: "L'empire s'agite."
 nd_rus.7.t: "Le retour des villes mères"
 nd_rus.7.d: "Kyiv, where Grand Prince Vladimir received baptism and brought Christianity to the Rus, has been restored to the Russian realm. Vilnius, capital of the Grand Duchy of Lithuania (Russia's oldest rival for dominion over the Orthodox east), has fallen to the Tsar's armies. These are not mere conquests but the assertion of a civilizational claim.\n\nPilgrims flock to the Monastery of the Caves in Kyiv, and the churches ring with celebration. Russia's claim as the guardian of Orthodoxy is strengthened immeasurably by the return of these cities to her sphere."
 nd_rus.7.a: "Les terres occidentales reconnaissent le tsar."
 nd_rus.8.t: "La percée baltique"
 nd_rus.8.d: "The great ports of Riga and Tallinn are now Russian. For the first time, the empire has direct access to European maritime trade routes, and Russian merchants can deal with Hamburg, Amsterdam, and London without intermediaries. The Baltic is no longer a Swedish or Hanseatic lake.\n\nThis breakthrough poses a fundamental question for the empire. Should Russia embrace the ways of Europe (its courts, its fashions, its diplomatic culture) and take its place as a European great power? Or should the Third Rome stand apart, a fortress of Orthodox faith and Russian tradition, drawing strength from its distinctiveness rather than conformity?"
 nd_rus.8.a: "Ouvrez les portes de la civilisation européenne."
 nd_rus.8.b: "Nous sommes la forteresse de la vraie foi."
 nd_rus.9.t: "La troisième Rome monte"
 nd_rus.9.d: "The unthinkable has been achieved. The double-headed eagle flies above the walls of Constantinople, and the great dome of the Hagia Sophia once again resounds with Orthodox liturgy. The prophecy of the monk Filofey is fulfilled: Moscow, the Third Rome, has reclaimed the Second.\n\nThe Tsar now stands as the supreme leader of the Orthodox world, protector of millions of believers from the Balkans to the Caucasus. But how shall this universal authority be exercised? Through the spiritual prestige of the Ecumenical Throne, absorbing the Orthodox peoples into a commonwealth of faith? Or through the iron authority of a new Caesar, whose military might enforces the peace of the empire?"
 nd_rus.9.a: "Nous unirons les fidèles sous un même trône."
 nd_rus.9.b: "Que le monde tremble devant le nouveau César."
 nd_rus.10.t: "Ouverture de la route de l'Est"
 nd_rus.10.d: "Russian forces have crossed the Ural Mountains and seized Tobolsk, capital of the Siberian Khanate. The Khanate of Kazan, which long blocked the eastern road, has been subdued. The way into the boundless Siberian wilderness lies open.\n\nCossack scouts report rivers teeming with fish, forests dark with sable, and vast grasslands stretching to horizons beyond counting. An entire continent awaits not merely the Tsar's flag but Russian settlers, institutions, and commerce."
 nd_rus.10.a: "Vers l'est ! Toujours vers l'est !"
 nd_rus.11.t: "La richesse de la Sibérie"
 nd_rus.11.d: "The empire's vast eastern territories have begun to yield their riches in earnest. Fur caravans stretch from the taiga to Moscow, the printing press has reached provincial capitals, and Russian settlements dot the river systems from the Urals to the Yenisey. Siberia is no longer merely conquered: it is becoming productive.\n\nThe question now is how to extract and organize this wealth. The yasak system of fur tribute, imposed on native peoples in exchange for nominal protection, funnels enormous wealth to the treasury but at the cost of local stability. Alternatively, encouraging mass Russian settlement would permanently integrate Siberia but require a different investment in roads, farms, and administration."
 nd_rus.11.a: "Imposer le yasak. La Sibérie paiera son tribut."
 nd_rus.11.b: "Envoyez des colons. La Sibérie deviendra la Russie."
 nd_rus.12.t: "Le colosse continental"
 nd_rus.12.d: "Russia has achieved what no empire in history has matched: a continental domain stretching across eleven time zones, developed and administered, its institutions reaching from the Baltic to the Pacific watershed. The Enlightenment has penetrated even the remotest guberniyas, and the empire's treasury reflects the wealth of a hundred peoples and a thousand rivers.\n\nThis colossus faces a fundamental choice in how to wield its continental mass. As a land empire par excellence, Russia can dominate the Eurasian heartland through sheer territorial depth and military doctrine. Or Russia can look beyond the continent, building a Pacific fleet to project power across the ocean and engage with the maritime civilizations of East Asia."
 nd_rus.12.a: "Nous sommes les seigneurs du continent."
 nd_rus.12.b: "Build a Pacific fleet. The ocean is next."
 STATIC_MODIFIER_NAME_nd_rus_dest_european_window: "Fenêtre européenne"
 STATIC_MODIFIER_DESC_nd_rus_dest_european_window: "La Russie ouvre ses portes à la culture, au commerce et aux idées européennes, en s’ouvrant sur le monde au-delà de la sphère orthodoxe."
 STATIC_MODIFIER_NAME_nd_rus_dest_orthodox_bastion: "Bastion orthodoxe"
 STATIC_MODIFIER_DESC_nd_rus_dest_orthodox_bastion: "La Troisième Rome se distingue de l’Occident latin et protestant, tirant sa force de la pureté de sa foi orthodoxe et de l’unité de son peuple."
 STATIC_MODIFIER_NAME_nd_rus_dest_ecumenical_throne: "Trône œcuménique"
 STATIC_MODIFIER_DESC_nd_rus_dest_ecumenical_throne: "Le tsar est assis sur le trône œcuménique, père spirituel de tous les chrétiens orthodoxes, exerçant le doux pouvoir de la foi pour lier les nations dans une communauté de croyants."
 STATIC_MODIFIER_NAME_nd_rus_dest_new_caesar: "Le nouveau César"
 STATIC_MODIFIER_DESC_nd_rus_dest_new_caesar: "Un nouvel empereur romain s’est levé en Orient et le monde tremble devant le rétablissement de la puissance militaire de la Troisième Rome."
 STATIC_MODIFIER_NAME_nd_rus_dest_yasak_tribute: "Système d'hommage Yasak"
 STATIC_MODIFIER_DESC_nd_rus_dest_yasak_tribute: "Le système yasak extraie des tributs de fourrures des peuples sibériens, canalisant d’immenses richesses vers Moscou au détriment des relations locales avec les vaincus."
 STATIC_MODIFIER_NAME_nd_rus_dest_settler_wave: "Colonisation coloniale"
 STATIC_MODIFIER_DESC_nd_rus_dest_settler_wave: "Les colons russes affluent vers l’est par grandes vagues, établissant des villages et des fermes permanents qui lient irrévocablement la Sibérie à la mère patrie."
 STATIC_MODIFIER_NAME_nd_rus_dest_heartland_power: "Puissance du cœur"
 STATIC_MODIFIER_DESC_nd_rus_dest_heartland_power: "La Russie contrôle le cœur de l’Eurasie, ses armées soutenues par une profondeur continentale et une doctrine stratégique qui rendent la puissance navale inutile."
 STATIC_MODIFIER_NAME_nd_rus_dest_pacific_horizon: "Horizon Pacifique"
 STATIC_MODIFIER_DESC_nd_rus_dest_pacific_horizon: "La Russie construit une flotte dans le Pacifique et regarde au-delà du continent, s’engageant auprès des civilisations maritimes de l’Asie de l’Est tout en négligeant certaines constructions nationales."
 nd_rus_cathedral_of_east: "Cathédrale de l'Est"
 nd_rus_cathedral_of_east_desc: "Une magnifique cathédrale orthodoxe construite pour consacrer la revendication de la Russie en tant que Troisième Rome, rivalisant en splendeur avec les grandes églises de Constantinople et de Rome."
 nd_rus_cathedral_of_east_upkeep: "Liturgie de la Cathédrale"
 nd_rus_cathedral_of_east_upkeep_desc: "Les services liturgiques solennels qui soutiennent l'autorité spirituelle de la cathédrale, nécessitent de l'encens pour l'encensement, des pierres précieuses pour la décoration des icônes, du tissu fin pour les vêtements sacerdotaux et des bougies en cire d'abeille pour la nef."
 nd_rus_ostrog_fort: "Forteresse d'Ostrog"
 nd_rus_ostrog_fort_desc: "Une palissade en bois fortifiée à la frontière sibérienne, servant de base aux commerçants de fourrures, de garnison aux soldats et de point d'ancrage pour les colonies russes dans la nature."
 nd_rus_ostrog_fort_upkeep: "Garnison d'Ostrog"
 nd_rus_ostrog_fort_upkeep_desc: "La petite garnison qui occupe les murs de l'ostrog et patrouille la frontière environnante, ayant besoin d'armes et d'armes à feu, de bois pour les réparations, de cuir pour les vêtements d'hiver et de sel pour s'approvisionner dans la nature."
 mestnichestvo_bureaucracy: "Mestnichestvo"
 mestnichestvo_bureaucracy_desc: "Le système de préséance par ancienneté ancestrale, par lequel les nominations aux commandements et aux fonctions étaient déterminées non pas par le mérite mais par le rang relatif de ses ancêtres dans le service passé. Codifié sous Ivan III et enraciné jusqu'au XVIe siècle, le mestnichestvo liait les clans boyards au trône en garantissant leur dignité, mais produisait des querelles ruineuses sur la préséance à chaque campagne. Le tsar Féodor III l'abolit finalement en 1682 en brûlant les livres de préséance dans un seul grand feu de joie."
 pomestie_registry_bureaucracy: "Registre Pomestie"
 pomestie_registry_bureaucracy_desc: "Le système de terres de service conditionnel administré par le Razryadnyy Prikaz, accordant des domaines (pomestiya) aux serviteurs à cheval en échange d'un service militaire à vie. Contrairement à la votchina héréditaire, un pomestie revenait à la couronne si son détenteur ne parvenait pas à se rassembler, produisant une cavalerie salariée sans le fardeau d'une solde en espèces. Les commis du registre ont suivi les rôles, attribué des subventions et, au fil des générations, ont augmenté les paysans, cultivant ces terres de plus en plus près du servage formel, culminant avec l'Ulozheniye de 1649."
 prikazy_bureaucracy: "Prikazy"
 prikazy_bureaucracy_desc: "Les bureaux départementaux de la gouvernance moscovite, chacun dirigé par un boyard et composé de commis lettrés appelés d'iaki et pod'iachie. Le Posolskiy Prikaz s'occupait des affaires étrangères, le Razryadnyy Prikaz les rôles militaires, le Pomestnyy Prikaz les terres militaires, et des dizaines d'autres se chevauchaient dans leurs juridictions à travers le royaume. Le système a produit une classe administrative compétente issue en grande partie d'origines non nobles, mais son enchevêtrement de compétences qui se chevauchent et de factions cléricales a ralenti chaque réforme jusqu'à ce que Pierre Ier la balaye finalement en faveur des collèges."
 oprichnina_bureaucracy: "Opritchnina"
 oprichnina_bureaucracy_desc: "L'apanage personnel du tsar Ivan IV a été créé en 1565, un État distinct dans l'État avec son propre tribunal, son propre trésor et des serviteurs vêtus de noir habilités à s'emparer des terres des boyards et à exécuter les traîtres sur parole du tsar. En divisant le royaume en oprichnina (le domaine du tsar) et en zemshchina (le reste), Ivan a brisé les grands clans de Moscovie et centralisé le pouvoir sous le trône, mais au prix d'une dévastation économique dans les provinces touchées. Bien que officiellement dissoute en 1572, son précédent de gouvernement personnel extra-légal a assombri l’autocratie russe pendant des siècles."
 nd_rus_bureaucracy_unlock: "Chancellerie moscovite"
 nd_rus_bureaucracy_unlock_desc: "La chancellerie grand-princière de Moscou se transforme en un appareil institutionnel formel, capable d'enregistrer les subventions de service, d'envoyer des missions diplomatiques et d'enrôler les serviteurs du royaume. C’est sur cette base que les institutions d’État distinctives de la Russie (le prikaz, le pomestie, le livre de préséance) commencent à prendre leur forme durable."
 AUTO_MODIFIER_NAME_nd_rus_bureaucracy_authority: "Chancellerie moscovite"
 AUTO_MODIFIER_DESC_nd_rus_bureaucracy_authority: "La chancellerie grand-princière de Moscou est devenue un appareil institutionnel permanent : ​​enregistrant les subventions de service, envoyant des missions diplomatiques et en enrôlant les serviteurs du royaume. C’est sur cette base que les institutions étatiques distinctives de la Russie commencent à prendre leur forme durable."
 yamskaya_sluzhba_bureaucracy: "Iamskaïa Sloujba"
 yamskaya_sluzhba_bureaucracy_desc: "Le système de relais postaux hérité par la Moscovie de ses suzerains mongols et formalisé sous le Yamskoy Prikaz, par lequel les courriers porteurs de décrets princiers se déplaçaient par étapes entre des stations d'igname espacées d'une journée de trajet le long des grandes routes. Le système transportait les commandes de Moscou jusqu'aux frontières en quelques jours plutôt qu'en semaines, tissant un royaume dont les distances auraient autrement défié toute règle centralisée. Il était soutenu par une corvée paysanne appelée yamskaya povinnost', et son réseau dense de stations servait également d'appareil de renseignement secret rendant compte des affaires locales à la chancellerie."
 sobornoye_ulozheniye_bureaucracy: "Sobornoye Oulojenie"
 sobornoye_ulozheniye_bureaucracy_desc: "Le « Code du Conseil » promulgué par le tsar Alexis en 1649, un code juridique complet rédigé après l'émeute du sel et ratifié par le Zemsky Sobor. À travers près d'un millier d'articles, il formalise les ordres successoraux héréditaires de Soslovie (nobles, clergé, citadins, paysans) en tant que castes juridiques distinctes avec des droits, des tribunaux et des obligations distincts. En conséquence, il a aboli les délais fixés pour récupérer les paysans fugitifs, liant la population rurale au sol à perpétuité et codifiant le servage comme pilier structurel de l’État russe pour les deux siècles suivants."
