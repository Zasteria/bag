l_french:
 STATIC_MODIFIER_NAME_nd_mtp_golden_trade: "L'or de Sofala"
 STATIC_MODIFIER_DESC_nd_mtp_golden_trade: "Les rivières transportent de l'or et les marchands du tissu. À travers les feiras de Sofala, Sena et Tete, la richesse du plateau s'écoule vers l'océan Indien et la connaissance du monde reflue."
 STATIC_MODIFIER_NAME_nd_mtp_mwari_sovereignty: "Voix de Mwari"
 STATIC_MODIFIER_DESC_nd_mtp_mwari_sovereignty: "Les oracles des collines Matobo parlent et les pluies arrivent. Le Mwenemutapa règne non pas parce que les étrangers apportent des bibelots, mais parce que Mwari accorde la récolte. La force du royaume réside dans son propre sol et dans les lances de ses propres fils."
 nd_mtp.1.t: "La restauration de Mutapa"
 nd_mtp.1.d: "The great stone houses of our ancestors stand renewed. From the hilltop enclosures where the Mwenemutapa once held court, the drums sound again across the plateau, calling the provinces to unity. The Shona and Kalanga peoples look to us as the successors of Great Zimbabwe, a kingdom built on gold, iron, and the favor of Mwari.\n\nBut the world beyond the plateau presses close. Swahili merchants and Portuguese traders crowd the river towns, hungry for our gold. Their cloth, glass beads, and firearms are useful, but their ambitions are boundless. Do we harness this trade to build something greater than our ancestors imagined? Or do we look inward, to the strength that made Great Zimbabwe possible, the labor of our farmers, the skill of our smiths, and the spiritual authority of the Mwari cult?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mtp.1.a: "Laissons l’or couler et laissons le monde venir à nous."
 nd_mtp.1.b: "Mwari fournit tout ce dont nous avons besoin. Notre force est la nôtre."
 nd_mtp.2.t: "L'échappée de Rozvi"
 nd_mtp.2.d: "A prince of the blood, Changamire Dombo, has broken from the Mwenemutapa's court and seized the ancient heartland of Butua by force of arms. His warriors, who call themselves the Rozvi, 'the destroyers', have swept aside both the weakened garrisons of the old kingdom and the Portuguese prazeiros who had grown fat on Zambezi trade. At the Battle of Maungwe, Dombo's forces annihilated a combined Portuguese-Mutapa army, proving that Shona military power need not depend on foreign firearms.\n\nDombo rules from Khami, near the ruins of Great Zimbabwe itself, and his Rozvi state threatens to eclipse the Mutapa entirely. Yet his success also demonstrates what Shona military discipline can achieve when freed from Portuguese manipulation. The question is whether to channel the Rozvi spirit into permanent military reform or use this crisis to consolidate political authority."
 nd_mtp.2.a: "Suivez la voie des guerriers Rozvi."
 nd_mtp.2.b: "Consolidez le royaume avant que la tempête ne passe."
 nd_mtp.3.t: "L'invasion portugaise"
 nd_mtp.3.d: "In 1561, a Portuguese Jesuit named Goncalo da Silveira converted the Mwenemutapa Nogomo to Christianity, only to be strangled by the king's own guards days later, at the urging of the Muslim merchants who feared Portuguese monopoly. Lisbon used the martyrdom as pretext for a full military invasion. In 1569, Francisco Barreto led a thousand soldiers up the Zambezi, aiming to seize the gold mines of the interior.\n\nThey never reached them. Malaria, dysentery, and the sheer hostility of the terrain consumed Barreto's force. The survivors straggled back to the coast, and the Portuguese took their frustrations out on the Swahili traders they could reach, massacring them at Sena and Tete. The Mwenemutapa watched, levied his fifty-percent tariff on the survivors, and extracted a tribute payment from each new Portuguese captain who dared take office in Mozambique.\n\nThe invasion has failed, but the foreigners remain. How do we respond?"
 nd_mtp.3.a: "Fortifiez le plateau. Que la terre elle-même soit notre bouclier."
 nd_mtp.3.b: "Échangez avec eux selon nos conditions. L'or achète plus que le sang."
 nd_mtp.4.t: "La grande enceinte"
 nd_mtp.4.d: "The walls of Great Zimbabwe still stand, mortarless granite, fitted so precisely that not even a blade can pass between the stones. The Great Enclosure, largest ancient structure in sub-Saharan Africa, rises eleven meters high and stretches two hundred and fifty meters around, enclosing the conical tower where the granary of the Mwenemutapa proclaimed his generosity to his people.\n\nThese are not mere ruins. They are a statement of what Shona civilization achieved without mortar, without foreign architects, without any technology that was not born of this plateau. The dzimba dzemabwe, the houses of stone, are our declaration that a great civilization rose here, built by our hands, sustained by our labor, and blessed by Mwari."
 nd_mtp.4.a: "Les pierres parlent d'elles-mêmes."
 STATIC_MODIFIER_NAME_nd_mtp_rozvi_warriors: "Guerriers Rozvi"
 STATIC_MODIFIER_DESC_nd_mtp_rozvi_warriors: "La tradition guerrière de Changamire Dombo, les « destructeurs » qui chassèrent les Portugais de l'intérieur."
 STATIC_MODIFIER_NAME_nd_mtp_rozvi_consolidation: "Consolidation Rozvi"
 STATIC_MODIFIER_DESC_nd_mtp_rozvi_consolidation: "La stabilité politique qui a suivi la réunification du cœur du Shona par Changamire Dombo."
 STATIC_MODIFIER_NAME_nd_mtp_fortress_of_sovereignty: "Forteresse de la souveraineté"
 STATIC_MODIFIER_DESC_nd_mtp_fortress_of_sovereignty: "Le plateau lui-même défend le royaume, ses maladies, ses distances et ses terrains hostiles pour vaincre les envahisseurs que les lances Shona ne font pas."
 STATIC_MODIFIER_NAME_nd_mtp_controlled_trade: "Commerce contrôlé"
 STATIC_MODIFIER_DESC_nd_mtp_controlled_trade: "Le Mwenemutapa dicte les termes de l'échange, imposant des tarifs à chaque marchand entrant dans le royaume."
 nd_mtp_great_enclosure_tradition: "Dzimba Dzemabwe"
 nd_mtp_great_enclosure_tradition_desc: "L'architecture de granit sans mortier du Grand Zimbabwe, une tradition constructive unique en Afrique subsaharienne."
 nd_mtp_njanja_iron_smelting: "Fonderie de fer de Njanja"
 nd_mtp_njanja_iron_smelting_desc: "La technologie des fours à tirage forcé du clan Njanja, produisant des outils et des armes en fer de haute qualité."
 nd_mtp_pfumo_tradition: "Lanciers royaux Pfumo"
 nd_mtp_pfumo_tradition_desc: "Infanterie d'élite armée de la lance pfumo et de grands boucliers en peau de vache, formant l'épine dorsale des armées Mutapa."
 nd_mtp_mwari_cult: "Culte de Mwari"
 nd_mtp_mwari_cult_desc: "Le culte de Mwari, divinité suprême de la pluie et de la fertilité, dont les oracles sur les collines Matobo guident les décisions politiques et agricoles."
 nd_mtp_alluvial_gold_tradition: "Orpaillage alluvial"
 nd_mtp_alluvial_gold_tradition_desc: "Extraction saisonnière de l'or dans le lit des rivières, les familles recherchent de l'or après la récolte, alimentant ainsi la route commerciale de Sofala."
 nd_mtp_cattle_wealth: "Bovins du Plateau"
 nd_mtp_cattle_wealth_desc: "Le bétail, fondement de la hiérarchie sociale Shona, est la richesse, le statut et la monnaie du prix de la mariée."
 nd_mtp_plateau_trade_routes: "Routes commerciales du Plateau"
 nd_mtp_plateau_trade_routes_desc: "Anciennes voies commerciales reliant le plateau du Zimbabwe à la côte swahili, transportant de l'or, de l'ivoire et du fer."
 nd_mtp_provincial_governors: "Gouverneurs provinciaux"
 nd_mtp_provincial_governors_desc: "Le système judiciaire audacieux, les juges et gouverneurs provinciaux qui administrent la loi et collectent les tributs au nom des Mwenemutapa."
 nd_mtp_sofala_trade_network: "Réseau commercial Sofala"
 nd_mtp_sofala_trade_network_desc: "The regulated exchange of gold for cloth, glass beads, and other goods through the Swahili port of Sofala.\n\n#italic Available in: $nd_mtp_feira$#!"
 nd_mtp_nhare_scouts_tradition: "Scouts de Nhare"
 nd_mtp_nhare_scouts_tradition_desc: "Troupes de reconnaissance rapides, nommées d'après l'élan, maîtres de l'embuscade et de la poursuite rapide à travers le plateau."
 nd_mtp_ivory_cotton_export: "Exportations d'ivoire et de coton"
 nd_mtp_ivory_cotton_export_desc: "The two great exports of the Mutapa kingdom besides gold, carved ivory and woven cotton cloth.\n\n#italic Available in: $nd_mtp_feira$#!"
 nd_mtp_royal_court: "Cour du Mwenemutapa"
 nd_mtp_royal_court_desc: "Le protocole cérémonial élaboré de la cour de Mwenemutapa, où les chefs provinciaux rendent hommage et les étrangers demandent des droits commerciaux."
 nd_mtp_masonry_renaissance: "Tradition de la maçonnerie en pierre"
 nd_mtp_masonry_renaissance_desc: "Continuing refinement of the mortarless granite construction techniques inherited from Great Zimbabwe.\n\n#italic Available in: $nd_mtp_njanja_forge$#!"
 nd_mtp_portuguese_contact: "Contact portugais"
 nd_mtp_portuguese_contact_desc: "Engagement diplomatique avec les Portugais, arrivés à Sofala en 1505, cherchant à monopoliser le commerce de l'or."
 nd_mtp_muzinda_garrisons: "Garnisons de Muzinda"
 nd_mtp_muzinda_garrisons_desc: "Forces de garnison permanentes stationnées dans chaque siège provincial de Muzinda, entraînées à la guerre défensive."
 nd_mtp_gold_taxation: "Fiscalité de l'or"
 nd_mtp_gold_taxation_desc: "The Mwenemutapa's fifty-percent tariff on all trade goods entering the kingdom, a bold assertion of fiscal sovereignty.\n\n#italic Available in: $nd_mtp_gold_works$#!"
 nd_mtp_feira_markets: "Système de marché de Feira"
 nd_mtp_feira_markets_desc: "Postes de traite réglementés où l'or, l'ivoire et les tissus sont échangés sous la surveillance du Mwenemutapa."
 nd_mtp_oracular_network: "Réseau Oraculaire"
 nd_mtp_oracular_network_desc: "The Mwari cult's network of priests and spirit mediums, serving as both religious authority and political intelligence.\n\n#italic Available in: $nd_mtp_mwari_shrine$#!"
 nd_mtp_shaft_mining: "Extraction de puits"
 nd_mtp_shaft_mining_desc: "Des techniques d’extraction plus profondes allant au-delà de l’orpaillage en surface pour suivre les gisements récifaux aurifères sous terre."
 nd_mtp_changamire_revolt: "La révolte de Changamire"
 nd_mtp_changamire_revolt_desc: "La sécession de Changamire Dombo et de ses guerriers Rozvi, qui expulsèrent les Portugais et établirent un nouvel ordre militaire."
 nd_mtp_portuguese_resistance: "Résistance portugaise"
 nd_mtp_portuguese_resistance_desc: "La défense réussie contre l'invasion de Barreto en 1569, la maladie, le terrain et la détermination Shona a vaincu les armes européennes."
 nd_mtp_cattle_festival: "Grande fête du bétail"
 nd_mtp_cattle_festival_desc: "Rassemblements cérémoniaux de masse au cours desquels le Mwenemutapa distribue des céréales et du bétail, liant le royaume par sa générosité."
 nd_mtp_cloth_currency: "Monnaie en tissu Machira"
 nd_mtp_cloth_currency_desc: "Standardized cotton cloth used as a medium of exchange throughout the kingdom and its trade networks.\n\n#italic Available in: $nd_mtp_feira$#!"
 nd_mtp_zambezi_corridor: "Corridor commercial du Zambèze"
 nd_mtp_zambezi_corridor_desc: "The Sena-Tete river route as the commercial artery connecting the interior plateau to the coastal ports.\n\n#italic Available in: $nd_mtp_zambezi_wharf$#!"
 nd_mtp_mass_mobilization: "Mobilisation provinciale"
 nd_mtp_mass_mobilization_desc: "La capacité du Mwenemutapa à mobiliser 300 000 hommes dans les provinces, un système de mobilisation rivalisant avec n'importe quelle puissance africaine contemporaine."
 nd_mtp_rozvi_ascendancy: "Ascendant Rozvi"
 nd_mtp_rozvi_ascendancy_desc: "Les réformes militaires de la dynastie Changamire, qui ont produit une infanterie disciplinée capable de vaincre les forces armées européennes."
 nd_mtp_firearms_adoption: "Adoption des armes à feu"
 nd_mtp_firearms_adoption_desc: "Troupes Shona armées de mousquets acquis par les Portugais, intégrant les armes à feu dans les tactiques traditionnelles du champ de bataille."
 nd_mtp_matopos_center: "Centre spirituel Matopos"
 nd_mtp_matopos_center_desc: "Les collines Matobo, siège durable du culte Mwari, un paysage sacré de grottes, d'art rupestre et de sanctuaires oraculaires."
 nd_mtp_ivory_expansion: "Expansion du commerce de l’ivoire"
 nd_mtp_ivory_expansion_desc: "Transformation de l’ivoire à l’échelle industrielle et exportation vers les marchés européens et de l’océan Indien."
 nd_mtp_khami_tradition: "Architecture Khami"
 nd_mtp_khami_tradition_desc: "Le style distinctif des murs de Khami, capitale du Rozvi, avec des assises en pierre décoratives construites sur des plates-formes en granit naturel."
 nd_mtp_gold_monopoly: "Monopole d’exportation d’or"
 nd_mtp_gold_monopoly_desc: "Contrôle royal sur tout l'or quittant le royaume, aucun commerce marchand sans la permission du Mwenemutapa."
 nd_mtp_cultural_resilience: "Résilience culturelle Shona"
 nd_mtp_cultural_resilience_desc: "La survie de l'identité Shona à travers les invasions Nguni, l'ingérence portugaise et la pression coloniale."
 nd_mtp_modern_governance: "Gouvernance moderne"
 nd_mtp_modern_governance_desc: "Réforme administrative centralisée pour une nouvelle ère, adaptant le système Dare aux exigences de l'État moderne."
 nd_mtp_anti_colonial_resistance: "Résistance anticoloniale"
 nd_mtp_anti_colonial_resistance_desc: "Opposition militaire organisée à la domination étrangère, s’appuyant sur des siècles de tradition martiale Shona."
 nd_mtp_mineral_sovereignty: "Souveraineté minérale"
 nd_mtp_mineral_sovereignty_desc: "Affirmer le contrôle national sur les richesses en or, en cuivre et en fer du plateau du Zimbabwe."
 nd_mtp_chimurenga_spirit: "Esprit Chimurenga"
 nd_mtp_chimurenga_spirit_desc: "Tradition Shona durable de résistance armée contre l'oppression, chimurenga signifie « lutte révolutionnaire »."
 nd_mtp_pan_shona_unity: "Unité Pan-Shona"
 nd_mtp_pan_shona_unity_desc: "Consolidation culturelle des peuples Kalanga, Korekore, Zezuru, Manyika et Ndau sous une identité Shona partagée."
 a_nd_mtp_pfumo_spearmen: "Lanciers Pfumo"
 a_nd_mtp_pfumo_spearmen_desc: "Infanterie d'élite Shona armée de la lance pfumo et de grands boucliers en peau de vache. Ces troupes royales forment le noyau discipliné des armées Mutapa, entraînées en formations défensives rapprochées."
 a_nd_mtp_nhare_scouts: "Scouts de Nhare"
 a_nd_mtp_nhare_scouts_desc: "Troupes de reconnaissance rapides nommées en l'honneur de l'élan. Maîtres de l'embuscade et de la poursuite rapide, ils bloquent l'avancée de l'armée et harcèlent les ennemis en retraite à travers le plateau."
 a_nd_mtp_muzinda_garrison: "Garnison de Muzinda"
 a_nd_mtp_muzinda_garrison_desc: "Troupes de forteresse provinciales tirées des sièges administratifs de Muzinda. Formés à la guerre défensive et à la résistance aux sièges, ils détiennent les forteresses aux murs de pierre du royaume."
 a_nd_mtp_rozvi_warriors: "Guerriers Rozvi"
 a_nd_mtp_rozvi_warriors_desc: "Infanterie de choc de la dynastie Changamire. Les Rozvi, « les destroyers », sont des troupes offensives agressives qui ont prouvé lors de la bataille de Maungwe que les armes Shona pouvaient vaincre les mousquets portugais."
 a_nd_mtp_musketmen: "Mousquetaires Mutapa"
 a_nd_mtp_musketmen_desc: "Soldats shona armés d’armes à feu acquises par les Portugais. Ces troupes combinent la technologie des armes européennes avec la discipline du champ de bataille de Mutapa."
 nd_mtp_dzimba: "Dzimba Dzemabwe"
 nd_mtp_dzimba_desc: "De grandes enceintes en pierre dans la tradition zimbabwéenne, des murs en granit sans mortier montés avec une telle précision qu'une lame ne peut passer entre les pierres. Ceux-ci servent de cours royales, de greniers et de symboles de la civilisation Shona."
 nd_mtp_dzimba_upkeep: "Entretien des enceintes en pierre"
 nd_mtp_dzimba_upkeep_desc: "Entretien des murs en granit sans mortier et agrandissement du complexe d'enceintes."
 nd_mtp_dare: "Cour d'Osez"
 nd_mtp_dare_desc: "Cour judiciaire royale où les gouverneurs de province administrent la justice, perçoivent les tributs et maintiennent l'autorité des Mwenemutapa sur les districts du royaume."
 nd_mtp_dare_upkeep: "Entretien du tribunal"
 nd_mtp_dare_upkeep_desc: "Maintenir le tribunal provincial des défis et ses fonctions administratives."
 nd_mtp_njanja_forge: "Forge de Njanja"
 nd_mtp_njanja_forge_desc: "Fonderie de fer Shona avancée. Le clan Njanja construit des batteries de fours à tirage forcé, chacun doté de soufflets jumelés et de trous de tuyère arrière, produisant du fer d'une qualité exceptionnelle pour les outils et les armes."
 nd_mtp_forge_upkeep: "Fonderie de fer"
 nd_mtp_forge_upkeep_desc: "Les batteries des fours de Njanja fondaient du minerai de fer avec du charbon de bois, produisant des outils d'une qualité exceptionnelle."
 nd_mtp_mwari_shrine: "Sanctuaire Mwari"
 nd_mtp_mwari_shrine_desc: "Un site oraculaire sacré dédié à Mwari, divinité suprême de la pluie, de la fertilité et des récoltes. Les prêtres interprètent la voix de Mwari à partir des échos des grottes et prononcent des bénédictions ou des malédictions sur la terre."
 nd_mtp_mwari_upkeep: "Offrandes au sanctuaire"
 nd_mtp_mwari_upkeep_desc: "Offrandes rituelles de bétail et entretien cérémonial des sanctuaires sacrés des grottes."
 nd_mtp_feira: "Poste de traite de Feira"
 nd_mtp_feira_desc: "Un marché commercial réglementé où la poussière d'or du plateau rencontre les tissus, les perles de verre et la porcelaine du commerce de l'océan Indien. Les agents de Mwenemutapa supervisent chaque échange."
 nd_mtp_feira_upkeep: "Entretien du poste de traite"
 nd_mtp_feira_upkeep_desc: "Entretenir les installations du marché de Feira et le stockage des marchandises."
 nd_mtp_gold_works: "Travaux d'or alluvial"
 nd_mtp_gold_works_desc: "Organisation d’opérations d’orpaillage et de lavage le long des berges. Les familles extraient l'or des gisements alluviaux après la saison des récoltes, alimentant ainsi l'économie d'exportation du royaume."
 nd_mtp_gold_works_upkeep: "Orpaillage"
 nd_mtp_gold_works_upkeep_desc: "Les familles recherchent de l'or dans le lit des rivières à l'aide d'écluses et de berceaux en bois, extrayant l'or alluvial des sédiments."
 nd_mtp_ivory_processing: "Préparation de l'ivoire"
 nd_mtp_ivory_processing_desc: "Transformation et sculpture de l'ivoire d'éléphant pour l'exportation vers le réseau commercial de l'océan Indien."
 nd_mtp_cotton_weaving: "Tissage de coton"
 nd_mtp_cotton_weaving_desc: "Production textile en coton Shona, créant le tissu distinctif utilisé à la fois comme monnaie et comme bien commercial."
 levy_nd_mtp_rozvi_warriors: "Rozvi Prélèvement"
 levy_nd_mtp_rozvi_warriors_desc: "Des levées de guerriers Rozvi tirées des traditions martiales de la dynastie Changamire."
 levy_nd_mtp_pfumo_spearmen: "Prélèvement Pfumo"
 levy_nd_mtp_pfumo_spearmen_desc: "Des lanciers prélevés auprès de la paysannerie Shona, armés du pfumo et d'un bouclier en peau de vache."
 nd_mtp_cattle_herding: "Élevage de bétail"
 nd_mtp_cattle_herding_desc: "Gérant les vastes troupeaux des prairies de Guruuswa, le bétail est la mesure de la richesse dans la société Shona."
 nd_mtp_gold_preparation: "Préparation de l'or"
 nd_mtp_gold_preparation_desc: "Nettoyer, peser et emballer la poussière d'or avec des outils de précision pour le commerce d'exportation de Sofala."
 nd_mtp_machira_production: "Production de tissus Machira"
 nd_mtp_machira_production_desc: "Production standardisée de tissus de coton destinés à être utilisés comme monnaie dans tout le royaume."
 nd_mtp_zambezi_transport: "Transport fluvial sur le Zambèze"
 nd_mtp_zambezi_transport_desc: "Transport de marchandises en canoë le long du Zambèze, reliant l'intérieur aux ports côtiers."
 nd_mtp_shrine_ceremonies: "Cérémonies du sanctuaire"
 nd_mtp_shrine_ceremonies_desc: "Offrandes rituelles et cérémonies dans les sanctuaires oraculaires Mwari, bétail et encens pour honorer la divinité suprême."
 nd_mtp_granite_quarrying: "Carrières de granit"
 nd_mtp_granite_quarrying_desc: "Extraction et façonnage de blocs de granit en maçonnerie taillée pour les enceintes en pierre sans mortier de la tradition du Zimbabwe."
 nd_mtp_kraal_stockade: "Palissade du Kraal"
 nd_mtp_kraal_stockade_desc: "Un enclos de bétail fortifié servant de point fort défensif provincial. L'épaisse palissade en bois abrite le bétail et constitue un point de ralliement pour les milices locales contre les envahisseurs."
 nd_mtp_kraal_upkeep: "Entretien des palissades"
 nd_mtp_kraal_upkeep_desc: "Entretien du bois pour les défenses de la palissade du Kraal."
 nd_mtp_zambezi_wharf: "Quai du Zambèze"
 nd_mtp_zambezi_wharf_desc: "Un poste de traite fluvial le long du corridor du Zambèze, facilitant la circulation de l'or, de l'ivoire et des marchandises importées entre le plateau et la côte."
 nd_mtp_wharf_upkeep: "Entretien du quai"
 nd_mtp_wharf_upkeep_desc: "Entretenir les installations du quai fluvial et la flotte de canots."
 nd_mtp_formed_tt: "L'Empire Mutapa a été formé"
 nd_mtp_path_a_tt: "Choisissez l'or de Sofala"
 nd_mtp_path_b_tt: "Choisissez la voix de Mwari"
 nd_mtp_destiny: "Destin du Mutapa"
 nd_mtp_destiny_desc: "Les tambours de formation ont sonné et le Mwenemutapa trône à nouveau. Le royaume doit désormais se montrer digne de l'héritage de ses ancêtres. Atteignez la stabilité et la voie à suivre se révélera."
 nd_mtp_dest_kilwa_trade: "La connexion Kilwa"
 nd_mtp_dest_kilwa_trade_desc: "Kilwa Kisiwani est le joyau de la côte swahili, la plus grande ville commerçante au sud de Mombasa. Le contrôler, c’est détenir la clé du commerce de l’or dans l’océan Indien. Saisissez Kilwa et accumulez les richesses pour prouver la puissance commerciale de Mutapa."
 nd_mtp_dest_zanzibar_reach: "Zanzibar et le Zambèze"
 nd_mtp_dest_zanzibar_reach_desc: "Une fois Kilwa sécurisé, le réseau commercial doit s’étendre à la fois vers le nord jusqu’à Zanzibar et vers l’intérieur des terres à travers le corridor du Zambèze. Contrôlez ces routes et amasser des richesses pour devenir la puissance commerciale incontestée de l’Afrique du Sud-Est."
 nd_mtp_dest_indian_ocean: "Emporium du Sud"
 nd_mtp_dest_indian_ocean_desc: "Dernière étape : Mombasa, le grand port du Nord, doit tomber sous l'influence de Mutapa. Avec la porcelaine circulant sur vos marchés et l'or dans votre trésor, vous aurez bâti un empire commercial s'étendant du plateau jusqu'à l'océan Indien."
 nd_mtp_dest_southern_march: "La marche du sud"
 nd_mtp_dest_southern_march_desc: "Les terres au sud du Limpopo, les hauts plateaux du Swazi et les territoires tswana sont depuis longtemps hors de portée de Mutapa. Une armée forte peut changer cela. Marchez vers le sud, saisissez Mapulana et Bakgatla et établissez la frontière d'un plus grand empire Shona."
 nd_mtp_dest_highveld_conquest: "Conquête du Highveld"
 nd_mtp_dest_highveld_conquest_desc: "Poussez plus profondément dans l’intérieur sud. Les terres de bétail de Kweneng et les champs aurifères de Lejweleputswa vous attendent. Développez votre territoire conquis et maintenez une armée puissante pour conserver ce que vous avez pris."
 nd_mtp_dest_imperium: "Impérial du Plateau"
 nd_mtp_dest_imperium_desc: "L'ambition ultime : étendre la domination Shona jusqu'à la frontière occidentale du désert à Damara. Avec une armée massive, un grand prestige et un empire développé, les Mwenemutapa dirigeront le plus grand État que l'Afrique australe ait jamais connu."
 nd_mtp.5.t: "Le Mutapa restauré"
 nd_mtp.5.d: "The stone walls of our ancestors stand renewed, and the provinces answer to one Mwenemutapa once more. The kingdom that built Great Zimbabwe has risen again, but rising is only the beginning. The world watches to see what we will become.\n\nWill we reach outward, to the ocean routes that carry gold to distant lands? Or will we turn the strength of our spears upon the peoples beyond our borders, building an empire that dwarfs anything our forebears imagined? The choice has been made. Now comes the work."
 nd_mtp.5.a: "Les travaux commencent."
 nd_mtp.6.t: "De l'or pour les marchands de Kilwa"
 nd_mtp.6.d: "Kilwa Kisiwani, the island city of coral stone and gold, has long been the gateway through which the wealth of the interior reaches the wider world. For centuries, Swahili merchants carried Mutapa's gold northward through Kilwa's harbors to Arabia, India, and beyond. Now that gateway is ours.\n\nWith Kilwa under Mutapa's control, the middlemen have become our subjects. Gold dust no longer changes hands three times before reaching a ship; it flows directly from the mines of the plateau to the dhows of the Indian Ocean. The profits that once enriched Swahili sultans now fill the Mwenemutapa's treasury."
 nd_mtp.6.a: "L’or circule désormais selon nos conditions."
 nd_mtp.7.t: "Maîtres de la côte Est"
 nd_mtp.7.d: "From Quelimane on the Zambezi delta to the spice island of Zanzibar, the eastern coast of Africa answers to the Mwenemutapa. The Swahili trading cities, once independent, now operate within a Mutapa-dominated commercial sphere. Ships from Gujarat, Oman, and the Malabar Coast dock at ports where Shona officials collect duties.\n\nThis unprecedented maritime reach raises a question: do we partner with the established Swahili merchant class, leveraging their centuries of Indian Ocean expertise? Or do we impose Mutapa's monopoly directly, ensuring that every cowrie shell of profit flows to the royal treasury?"
 nd_mtp.7.a: "Partenaire avec les commerçants swahilis."
 nd_mtp.7.b: "Le Mwenemutapa prend sa part qui lui revient."
 nd_mtp.8.t: "L'Arc d'Or"
 nd_mtp.8.d: "From the deep mines of the Zimbabwe Plateau, through the river corridors and coastal ports, to the great harbor of Mombasa, the golden arc is complete. Mutapa has achieved what no African state south of Egypt has accomplished: a commercial empire spanning from the continental interior to the Indian Ocean.\n\nPorcelain from China graces the Mwenemutapa's table. Silk from Gujarat adorns his court. Gold from a hundred mines pays for it all. The question now is how to sustain this wealth across generations. Do we invest in the trade infrastructure that made this possible, creating a permanent commercial machine? Or do we use this wealth to transform the court itself into a center of learning and cosmopolitan culture?"
 nd_mtp.8.a: "Construisez l’arc doré pour qu’il dure éternellement."
 nd_mtp.8.b: "Laissons la richesse transformer notre civilisation."
 nd_mtp.9.t: "Spears au sud du Limpopo"
 nd_mtp.9.d: "The Mwenemutapa's armies have crossed the Limpopo and marched into the lands beyond, territories that were never part of the old Mutapa kingdom. The Swazi highlands and the Tswana chieftaincies have fallen before Shona spears, and new provincial governors take their seats in conquered muzinda.\n\nThis is something new. The old Mutapa kingdom was a plateau state, defined by the granite kopjes and gold-bearing rivers of Zimbabwe. Now we are becoming something larger, an empire that absorbs peoples who do not speak Shona, who do not worship Mwari, who have their own traditions of governance. The challenge of ruling them has only just begun."
 nd_mtp.9.a: "La frontière avance."
 nd_mtp.10.t: "Seigneurs du Highveld"
 nd_mtp.10.d: "The great grasslands of the interior, the Highveld, are ours. From the cattle-rich plains of Kweneng to the gold-bearing fields of Lejweleputswa, Mutapa's dominion now stretches far beyond anything the founders of Great Zimbabwe could have imagined. The development of these conquered territories has begun in earnest.\n\nBut governing distant provinces requires choices. Do we plant garrison settlements of Shona soldiers in every conquered territory, creating permanent military colonies that will hold the frontier? Or do we extract tribute from existing local chiefs, governing through subordinates who know the land?"
 nd_mtp.10.a: "Plantez des garnisons sur les terres conquises."
 nd_mtp.10.b: "Règle par l'hommage et l'autorité locale."
 nd_mtp.11.t: "L’Imperium réalisé"
 nd_mtp.11.d: "From the Indian Ocean coast to the desert frontier, from the Zambezi to the Highveld, the Mwenemutapa rules an empire vaster than any that has risen in southern Africa. The mustering grounds of the capital host armies that would give any European colonial power pause. The prestige of the Shona dynasty echoes across the continent.\n\nThis is the moment of choice that defines all empires at their zenith. Do we commit to the warrior-king tradition, the Changamire legacy of military strength that keeps the empire intact through force of arms? Or do we invest in the eternal stones, the building tradition that outlasted every dynasty, the monuments that will speak for Shona civilization long after armies are dust?"
 nd_mtp.11.a: "Nous sommes les rois-guerriers."
 nd_mtp.11.b: "Les pierres parleront pour nous."
 STATIC_MODIFIER_NAME_nd_mtp_dest_swahili_partnership: "Partenariat swahili"
 STATIC_MODIFIER_DESC_nd_mtp_dest_swahili_partnership: "Un partenariat avec la classe marchande swahili établie, tirant parti de leur expertise de l'océan Indien pour étendre la portée commerciale de Mutapa."
 STATIC_MODIFIER_NAME_nd_mtp_dest_monopoly_trade: "Monopole commercial de Mutapa"
 STATIC_MODIFIER_DESC_nd_mtp_dest_monopoly_trade: "Le monopole direct des Mwenemutapa sur le commerce côtier, renforcé par les patrouilles navales et les autorités portuaires."
 STATIC_MODIFIER_NAME_nd_mtp_dest_golden_arc: "L'Arc d'Or"
 STATIC_MODIFIER_DESC_nd_mtp_dest_golden_arc: "La route commerciale complète, depuis les mines du plateau jusqu’aux ports de l’océan Indien, générant une richesse qui confère à Mutapa un pouvoir de négociation inégalé."
 STATIC_MODIFIER_NAME_nd_mtp_dest_cosmopolitan_court: "Cour cosmopolite"
 STATIC_MODIFIER_DESC_nd_mtp_dest_cosmopolitan_court: "Une cour enrichie par le commerce de l'océan Indien, attirant des artisans, des érudits et des soldats étrangers au service du Mwenemutapa."
 STATIC_MODIFIER_NAME_nd_mtp_dest_settler_garrisons: "Garnisons de colons"
 STATIC_MODIFIER_DESC_nd_mtp_dest_settler_garrisons: "Des colonies militaires shona se sont implantées dans les territoires conquis, gardant la frontière grâce à une présence armée permanente."
 STATIC_MODIFIER_NAME_nd_mtp_dest_tribute_provinces: "Provinces hommage"
 STATIC_MODIFIER_DESC_nd_mtp_dest_tribute_provinces: "Territoires conquis gouvernés par des chefs locaux qui rendent hommage aux Mwenemutapa, préservant les structures existantes sous la suzeraineté Shona."
 STATIC_MODIFIER_NAME_nd_mtp_dest_warrior_kings: "Rois-Guerriers"
 STATIC_MODIFIER_DESC_nd_mtp_dest_warrior_kings: "La tradition Changamire de suprématie militaire, l'empire maintenu par l'épée et les prouesses personnelles des Mwenemutapa dans la guerre."
 STATIC_MODIFIER_NAME_nd_mtp_dest_eternal_stones: "Pierres éternelles"
 STATIC_MODIFIER_DESC_nd_mtp_dest_eternal_stones: "La tradition de construction du Grand Zimbabwe perdure, des monuments en pierre qui survivent aux dynasties et proclament la civilisation Shona à travers les âges."
 nd_mtp_indian_ocean_emporium: "Magasin de l'Océan Indien"
 nd_mtp_indian_ocean_emporium_desc: "Sommet des ambitions commerciales de Mutapa, une grande maison de commerce où convergent les marchandises de Chine, d'Inde, d'Arabie et de l'intérieur de l'Afrique sous l'autorité de Mwenemutapa."
 nd_mtp_emporium_upkeep: "Entretien du magasin"
 nd_mtp_emporium_upkeep_desc: "Entretenir l’infrastructure commerciale et les entrepôts du grand magasin de l’océan Indien."
 nd_mtp_royal_mustering_ground: "Terrain de rassemblement royal"
 nd_mtp_royal_mustering_ground_desc: "Le terrain de parade central où le Mwenemutapa passe en revue ses armées. Les guerriers Rozvi, les lanciers Pfumo et les mousquetaires s'entraînent côte à côte sous l'étendard royal."
 nd_mtp_mustering_upkeep: "Entretien au sol"
 nd_mtp_mustering_upkeep_desc: "Entretenir les terrains de parade, les armureries et les installations d'entraînement du terrain de rassemblement royal."

 # ===== BUREAUCRACIES =====

 mhondoro_oracle_bureaucracy: "Réseau Oraculaire Mhondoro"
 mhondoro_oracle_bureaucracy_desc: "Les mhondoro étaient les médiums spirituels des ancêtres royaux, possédés par le défunt Mwene Mutapas pour parler à travers le svikiro vivant. Depuis les grands sanctuaires de Matonjeni et de Matopos, des déclarations oraculaires légitimaient les décrets du roi, fixaient des calendriers de pluie et confirmaient la succession. L'institution liait la monarchie à une administration sacrée parallèle ; les chefs de lignage qui tentaient de consulter leurs propres ancêtres trouvaient le mhondoro royal parlant plus fort."

 kuronzera_clientship_bureaucracy: "Clientèle des bovins Kuronzera"
 kuronzera_clientship_bureaucracy_desc: "Sous le système kuronzera, les Mwene Mutapa prêtaient du bétail royal aux roturiers et aux petits chefs, qui en retour devaient du travail, du service militaire et une part de veaux. Les troupeaux parcouraient le royaume avec des milliers de liens personnels allant directement au trône, contournant l'autorité héréditaire du lignage. La sécheresse, la peste bovine ou la cupidité royale pourraient effondrer le réseau du jour au lendemain, dispersant les clients vers leurs anciens chefs."

 curva_tribute_bureaucracy: "Hommage annuel de Curva"
 curva_tribute_bureaucracy_desc: "Chaque année, le Mwene Mutapa organisait la curva, une cérémonie au cours de laquelle les chefs vassaux et leurs chefs apportaient de l'ivoire, de l'or, des houes et du tissu pour renouveler leur serment de soumission. Le chroniqueur portugais João dos Santos a décrit ce rite en 1609 comme l'événement central du calendrier impérial : l'absence de curva était traitée comme une rébellion. Le roi redistribuait les cadeaux pour lier les chefs à la hiérarchie, mais le fardeau du tribut pesait le plus lourdement sur les cultivateurs en dessous d'eux."

 mukomohasha_captaincy_bureaucracy: "Capitainerie de Mukomohasha"
 mukomohasha_captaincy_bureaucracy_desc: "The mukomohasha was the supreme captain of the Mwene Mutapa's armies, an office filled by appointment rather than inheritance and held distinct from the great lineage chiefs. Portuguese sources from the late sixteenth century describe him riding at the head of the royal host with subordinate captains drawn from across the realm. The captaincy gave the throne a permanent military arm independent of the kraals, and the cultivators who provisioned the marching column."

 AUTO_MODIFIER_NAME_nd_mtp_bureaucracy_authority: "Bureau du Mwene Mutapa"
 AUTO_MODIFIER_DESC_nd_mtp_bureaucracy_authority: "Lors de sa formation, la cour de Zvongombe formalise son appareil administratif, codifiant les fonctions qui entourent le grand roi et ouvrant des canaux institutionnels permanents par lesquels le royaume est gouverné."
