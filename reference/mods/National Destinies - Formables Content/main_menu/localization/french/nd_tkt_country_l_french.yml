l_french:
 TKT: "Chevaliers du Temple"
 TKT_ADJ: "Templier"
 TKT_f: "Chevaliers du Temple"
 TKT_f_desc: "Reconstituer les Pauperes Commmilitones Christi Templique Salomonici en tant qu'ordre religieux et militaire souverain, refusant la dissolution de 1312 et héritant des banques ibériques, de la flotte atlantique et du couvent de Tomar que l'histoire permettait uniquement à l'Ordre du Christ de conserver. L’État souverain des Templiers se présente comme la première société bancaire internationale du monde catholique transformée en État, une république chevaleresque tournée vers l’Atlantique, composée de trésoriers, de navigateurs et d’hérétiques discrets, dont le chapitre secret ne répond qu’au pape qui a soulevé la bulle de Clément V."
