l_french:
 KBU: "Kanem-Bornou"
 KBU_ADJ: "Kanemi"
 KBU_f: "Kanem-Bornou"
 KBU_f_desc: "L’empire Kanem-Bornu, dirigé par la dynastie Sayfawa pendant plus de sept siècles, dominait le bassin du lac Tchad et contrôlait les routes commerciales transsahariennes vitales. En réunissant le cœur originel du Kanem avec les territoires du Bornu, l’empire est en passe de réaffirmer sa suprématie sur le Sahel central."
