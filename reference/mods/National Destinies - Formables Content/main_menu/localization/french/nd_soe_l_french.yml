l_french:
 STATIC_MODIFIER_NAME_nd_soe_river_conqueror: "Seigneur de la rivière"
 STATIC_MODIFIER_DESC_nd_soe_river_conqueror: "Dans la tradition sunnite d’Ali, l’empire Songhaï mène la guerre avec une rapidité inégalée le long du Niger, frappant simultanément depuis le fleuve et depuis la terre."
 STATIC_MODIFIER_NAME_nd_soe_scholar_emperor: "Le trône du savant"
 STATIC_MODIFIER_DESC_nd_soe_scholar_emperor: "Suivant la vision d'Askia Muhammad, l'Empire Songhaï devient un phare de l'apprentissage islamique et d'une gouvernance juste à travers le Sahel."
 STATIC_MODIFIER_NAME_nd_soe_mecca_pilgrimage: "Pèlerin des Deux Villes Saintes"
 STATIC_MODIFIER_DESC_nd_soe_mecca_pilgrimage: "Le pèlerinage de l'empereur à La Mecque a élevé la position de Songhaï parmi le monde musulman, attirant des érudits et des marchands à nos cours."
 STATIC_MODIFIER_NAME_nd_soe_last_stand_defense: "Défenseurs du Niger"
 STATIC_MODIFIER_DESC_nd_soe_last_stand_defense: "Contre le tonnerre des canons étrangers, les Songhaï tiennent bon pour défendre leur patrie et les villes du Niger."
 STATIC_MODIFIER_NAME_nd_soe_scorched_earth_retreat: "Le Sahel se retire dans le sable"
 STATIC_MODIFIER_DESC_nd_soe_scorched_earth_retreat: "Laissez les envahisseurs prendre les villes vides. Les Songhaï connaissent le désert, la rivière et les sentiers qui les séparent. Nous allons endurer."
 nd_soe.1.t: "La montée de l'empire Songhaï"
 nd_soe.1.d: "The Niger River bends through the heart of our land like a great artery of civilization. From Gao to Timbuktu, from the salt mines of Taghaza to the gold fields of Wangara, a new empire rises to claim dominion over the greatest trade routes in Africa.\n\nBut what shall define this empire? Shall we follow the path of Sunni Ali: the warrior who never lost a battle, who struck from river and land with devastating speed, who bent the Niger to his will through sheer military force? Or shall we walk the road of Askia Muhammad: the pilgrim-emperor who transformed a military conquest into a civilization of law, scholarship, and faith, making Timbuktu the intellectual capital of the Islamic world?\n\nThe river stretches before us. The choice is ours.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_soe.1.a: "Nous sommes les cavaliers du Niger. Que nos ennemis tremblent."
 nd_soe.1.b: "Nous construirons un trône de connaissance et de justice."
 nd_soe.2.t: "Le pèlerinage des Askia"
 nd_soe.2.d: "In 1496, Askia Muhammad departed Gao with a retinue of five hundred cavalry and one thousand foot soldiers, bearing three hundred thousand gold pieces for charitable distribution along the route. His hajj to Mecca was no mere act of personal devotion; it was a diplomatic masterstroke. In the Holy Cities, he was received by the Abbasid Caliph in Cairo, who invested him with the title Caliph of the Lands of Takrur, granting the Songhai throne religious legitimacy that no predecessor had possessed.\n\nHe returned with scholars, architects, and merchants. He brought the jurist al-Maghili from Tlemcen to serve as his chief advisor. He carried the idea that Timbuktu could become not merely a trading post but a seat of learning to rival Cairo and Baghdad. The pilgrimage transformed a military empire into a cultural one."
 nd_soe.2.a: "Le monde connaît désormais la gloire de Songhaï."
 nd_soe.3.t: "Tonnerre du Nord"
 nd_soe.3.d: "In 1591, Sultan Ahmad al-Mansur of Morocco sent an army of four thousand men under the Spanish eunuch Judar Pasha across the Sahara: a journey of four months through waterless desert. They brought with them eight English cannons and thousands of arquebus-armed infantry. At the Battle of Tondibi, the Songhai army of forty thousand faced this smaller but devastatingly armed force.\n\nThe Songhai commander Askia Ishaq II ordered a stampede of one thousand cattle to break the Moroccan lines, but the thunderclap of gunfire panicked the herd back into Songhai ranks. The battle lasted barely two hours. Gao, Timbuktu, and Djenne all fell within months.\n\nThe age of the great Saharan empires was ending. But empires die slowly in the desert. The question now is how we face the future."
 nd_soe.3.a: "Fortifiez les villes. Nous ne céderons pas un seul grain de sable."
 nd_soe.3.b: "Retombez dans l'arrière-pays : le désert est notre forteresse."
 nd_soe.4.t: "L'Université de Sankoré"
 nd_soe.4.d: "In the Sankore quarter of Timbuktu, under the shadow of the great mud-brick mosque, some twenty-five thousand students gather to study under scholars who have mastered theology, law, mathematics, astronomy, medicine, and history. The Sankore is not one institution but a constellation of private scholars, each with their own students and libraries, united by a shared commitment to the Maliki school of Islamic jurisprudence.\n\nStudents must arrive fluent in Arabic and with the entire Qur'an committed to memory. The degrees they earn, comparable to the ijazah of Cairo's al-Azhar, are recognized across the Muslim world. Timbuktu's libraries house hundreds of thousands of manuscripts, the greatest concentration of written knowledge in sub-Saharan Africa."
 nd_soe.4.a: "La connaissance est le véritable or de Tombouctou."
 nd_soe.5.t: "L'étendard de l'empereur"
 nd_soe.5.d: "Askia Muhammad did what no Sahelian ruler before him had attempted: he imposed a system of standardized weights and measures across the empire's markets. Trade inspectors, the muhtasib, were stationed in every major market center from Timbuktu to Gao to Djenne, empowered to verify scales, enforce fair dealing, and punish fraud.\n\nThe result was a commercial revolution. Merchants from Cairo to Fez to Venice could trade with confidence in Songhai markets, knowing that a measure of gold in Timbuktu weighed the same as a measure of gold in Gao. The empire's reputation for fair dealing drew caravans from across the Sahara like water to a well."
 nd_soe.5.a: "Le commerce équitable construit des empires plus forts que la conquête."
 nd_soe_niger_origins: "Les enfants de la rivière"
 nd_soe_niger_origins_desc: "Le peuple Songhaï vit le long du Niger depuis des temps immémoriaux, tirant sa vie de ses inondations et de ses poissons."
 nd_soe_noble_horsemen: "Cavalerie noble Songhaï"
 nd_soe_noble_horsemen_desc: "Les guerriers à cheval de Songhaï, vêtus de cuirasses de fer sous leurs tuniques de combat, constituent l'épine dorsale du pouvoir impérial."
 nd_soe_niger_fleet: "La flotte de Hi-Koy"
 nd_soe_niger_fleet_desc: "L'amiral du fleuve commande des pirogues de guerre le long du Niger, projetant la puissance Songhaï de l'eau jusqu'au rivage."
 nd_soe_early_islam: "Foi du Sahel"
 nd_soe_early_islam_desc: "L'Islam est arrivé le long des routes commerciales, adopté d'abord par les marchands et les dirigeants, transformant progressivement la vie spirituelle Songhaï."
 nd_soe_gao_foundation: "Fondation de Gao"
 nd_soe_gao_foundation_desc: "Gao se dresse au grand méandre du Niger, siège ancestral du pouvoir Songhaï et porte d'entrée vers le Sahara."
 nd_soe_niger_agriculture: "Agriculture des plaines inondables"
 nd_soe_niger_agriculture_desc: "Les inondations annuelles du Niger déposent un riche limon dans les plaines, soutenant l’agriculture qui nourrit l’empire."
 nd_soe_caravan_routes: "Caravanes transsahariennes"
 nd_soe_caravan_routes_desc: "Des caravanes de chameaux traversent le désert avec de l’or, du sel, de l’ivoire et des tissus : l’élément vital du commerce sahélien."
 nd_soe_sunni_ali_conquests: "Les conquêtes d’Ali sunnite"
 nd_soe_sunni_ali_conquests_desc: "Le sunnite Ali le Grand n’a jamais été vaincu au combat. Grâce à la guerre fluviale et à la cavalerie, il forge l'empire Songhaï."
 nd_soe_hikoy_command: "Commandement du Hi-Koy"
 nd_soe_hikoy_command_desc: "Le Hi-Koy commande plus d'un millier de navires depuis le port de Gao, contrôlant le trafic fluvial et projetant une force militaire le long du Niger."
 nd_soe_conquest_of_timbuktu: "Le joyau du Sahel"
 nd_soe_conquest_of_timbuktu_desc: "La conquête de Tombouctou en 1468 plaça la plus grande ville commerçante d’Afrique de l’Ouest sous le contrôle de Songhaï."
 nd_soe_saharan_archery: "Archers à cheval sahariens"
 nd_soe_saharan_archery_desc: "Les archers à cheval issus des traditions nomades servent d'écrans et de pillards, harcelant les ennemis avant que la cavalerie lourde ne frappe."
 nd_soe_askia_revolution: "La dynastie Askia"
 nd_soe_askia_revolution_desc: "La prise du trône par Askia Muhammad a transformé Songhaï d'un État militaire en un empire islamique de droit et d'administration."
 nd_soe_gold_salt_monopoly: "Monopole de l'or et du sel"
 nd_soe_gold_salt_monopoly_desc: "L'or coule vers le nord ; le sel coule vers le sud. Les Songhaï sont à cheval sur les deux courants, taxant les échanges les plus précieux d'Afrique."
 nd_soe_hajj_of_askia: "Le Hajj d'Askia Muhammad"
 nd_soe_hajj_of_askia_desc: "Le pèlerinage d'Askia Muhammad à La Mecque en 1496 a établi Songhaï comme une puissance islamique légitime aux yeux du monde musulman dans son ensemble."
 nd_soe_five_provinces: "Les cinq vice-royautés"
 nd_soe_five_provinces_desc: "L'empire est divisé en cinq grandes provinces, chacune gouvernée par un vice-roi qui maintient l'ordre tout en permettant l'autonomie locale."
 nd_soe_sankore_university: "L'Université de Sankoré"
 nd_soe_sankore_university_desc: "Vingt-cinq mille étudiants étudient dans le quartier de Sankoré, à Tombouctou, ce qui en fait l'un des grands centres d'apprentissage du monde islamique."
 nd_soe_sharia_courts: "Tribunaux du Qadi"
 nd_soe_sharia_courts_desc: "Les magistrats islamiques administrent la justice conformément à la charia dans toutes les grandes villes, apportant ainsi ordre et prévisibilité à la gouvernance."
 nd_soe_standardized_trade: "L'étendard de l'empereur"
 nd_soe_standardized_trade_desc: "Les poids et mesures standardisés, appliqués par les inspecteurs du commerce sur chaque marché, ont fait du commerce Songhaï le plus fiable du Sahel."
 nd_soe_djenne_prosperity: "La prospérité de Djenné"
 nd_soe_djenne_prosperity_desc: "Djenné, ville aux mille savants et plus grande mosquée du Soudan, prospère en tant que centre commercial et culturel."
 nd_soe_imperial_army: "La Garde Impériale"
 nd_soe_imperial_army_desc: "Une armée professionnelle permanente constitue le noyau de fer de la puissance militaire Songhaï, fidèle à la seule dynastie Askia."
 nd_soe_saharan_campaigns: "Seigneurs du Désert"
 nd_soe_saharan_campaigns_desc: "Des guerriers à dos de chameau patrouillent la frontière saharienne, protégeant les caravanes et projetant l'autorité impériale dans les profondeurs du désert."
 nd_soe_timbuktu_manuscripts: "Les Manuscrits de Tombouctou"
 nd_soe_timbuktu_manuscripts_desc: "Des centaines de milliers de manuscrits remplissent les bibliothèques de Tombouctou, préservant les connaissances en astronomie, médecine, histoire et droit."
 nd_soe_koi_commanders: "Le système Koi"
 nd_soe_koi_commanders_desc: "Les commandants militaires régionaux, les Koi, maintiennent des forces permanentes dans tout l'empire, garantissant une réponse rapide à toute menace."
 nd_soe_trade_inspectors: "Le Muhtasib"
 nd_soe_trade_inspectors_desc: "Les inspecteurs commerciaux veillent à ce que les transactions soient équitables sur chaque marché, vérifiant les poids, punissant la fraude et collectant les douanes impériales."
 nd_soe_gunpowder_response: "Le tonnerre a répondu"
 nd_soe_gunpowder_response_desc: "L’invasion marocaine a démontré le pouvoir dévastateur des armes à feu. L'empire doit s'adapter ou périr."
 nd_soe_pastoral_wealth: "Richesse des troupeaux"
 nd_soe_pastoral_wealth_desc: "De vastes troupeaux de bovins, de chèvres et de chevaux soutiennent l'économie pastorale du Sahel et fournissent des montures de cavalerie à l'armée impériale."
 nd_soe_maliki_jurisprudence: "L'école Maliki"
 nd_soe_maliki_jurisprudence_desc: "L’école malékite de droit islamique, apportée par des universitaires d’Afrique du Nord, fournit un cadre juridique unificateur aux divers peuples de l’empire."
 nd_soe_imperial_diversity: "Empire de nombreux peuples"
 nd_soe_imperial_diversity_desc: "Songhaï, Mandingue, Touareg, Peul : l’empire gouverne une mosaïque de peuples grâce à une administration flexible et une foi islamique partagée."
 nd_soe_sahel_resilience: "Résilience du Sahel"
 nd_soe_sahel_resilience_desc: "Les empires naissent et s’effondrent, mais les peuples du Sahel perdurent. L’héritage Songhaï survit dans les États successeurs et dans la mémoire culturelle."
 nd_soe_niger_commerce: "Niger Commerce"
 nd_soe_niger_commerce_desc: "Le Niger reste l’autoroute du commerce ouest-africain, transportant les marchandises et les idées entre forêt et désert."
 nd_soe_sahel_fortifications: "Fortifications du Sahel"
 nd_soe_sahel_fortifications_desc: "Des murs en briques crues et des enceintes défensives protègent les villes sahéliennes des pillards et des envahisseurs."
 nd_soe_crown_authority: "Autorité des Askia"
 nd_soe_crown_authority_desc: "L'autorité centrale des Askia resserre son emprise sur les gouverneurs provinciaux, assurant ainsi l'unité impériale."
 nd_soe_slave_soldiers: "Soldats de l'Empire"
 nd_soe_slave_soldiers_desc: "Les soldats esclaves, personnellement fidèles à l’empereur plutôt qu’à un clan ou une famille, forment un noyau fiable de troupes professionnelles."
 nd_soe_scholarly_preservation: "Gardiens du savoir"
 nd_soe_scholarly_preservation_desc: "Grâce à la tradition orale et aux manuscrits soigneusement conservés, les érudits Songhaï perpétuent le savoir des siècles."
 nd_soe_songhai_revival: "La renaissance Songhaï"
 nd_soe_songhai_revival_desc: "Une nouvelle génération récupère l’héritage de la dynastie Askia, attisant le rêve d’une civilisation Songhaï restaurée."
 nd_soe_modern_agriculture: "Agriculture sahélienne moderne"
 nd_soe_modern_agriculture_desc: "De nouvelles techniques transforment les plaines inondables et la savane en terres agricoles plus productives, nourrissant ainsi une population croissante."
 nd_soe_modern_trade: "Commerce saharien moderne"
 nd_soe_modern_trade_desc: "Les anciennes routes commerciales retrouvent une nouvelle vie grâce aux infrastructures modernes qui relient le Sahel aux marchés mondiaux."
 nd_soe_modern_army: "Armée Songhaï moderne"
 nd_soe_modern_army_desc: "Une armée réformée et modernisée garantit à l’Empire Songhaï la capacité de défendre sa souveraineté dans un monde en évolution."
 nd_soe_education_reform: "Éducation pour tous"
 nd_soe_education_reform_desc: "S'appuyant sur la tradition scientifique de Tombouctou, de nouvelles écoles apportent l'alphabétisation et l'apprentissage aux quatre coins de l'empire."
 nd_soe_imperial_restoration: "Le rêve de restauration"
 nd_soe_imperial_restoration_desc: "De Gao à Tombouctou, la vision d’un empire Songhaï restauré unit les peuples de la boucle nigérienne."
 a_nd_soe_noble_cavalry: "Cavalerie noble Songhaï"
 a_nd_soe_noble_cavalry_desc: "Guerriers à cheval d'élite de la noblesse Songhaï, vêtus de cuirasses de fer sous leurs tuniques de combat, qui chargent l'ennemi avec une force dévastatrice."
 a_nd_soe_hikoy_marines: "Salut-Koy Marines"
 a_nd_soe_hikoy_marines_desc: "Des guerriers fluviaux qui combattent à bord des grandes pirogues de guerre de la flotte nigérienne, aussi meurtrières en assaut amphibie qu'en combat rapproché."
 a_nd_soe_mounted_archers: "Archers à cheval Songhaï"
 a_nd_soe_mounted_archers_desc: "Archers de cavalerie légère de tradition saharienne, utilisés pour repérer, filtrer et harceler les formations ennemies avant l'assaut principal."
 a_nd_soe_imperial_guard: "Garde impériale Songhaï"
 a_nd_soe_imperial_guard_desc: "Les soldats professionnels de la dynastie Askia, lourdement équipés et fanatiquement fidèles à l'empereur."
 a_nd_soe_jihad_infantry: "Infanterie du Jihad Songhaï"
 a_nd_soe_jihad_infantry_desc: "Des guerriers aux motivations religieuses combattant pour la défense de l'État islamique, leur ferveur compensant le manque d'armes à feu de l'empire."
 a_nd_soe_sahel_musketeer: "Mousquetaire du Sahel"
 a_nd_soe_sahel_musketeer_desc: "L'infanterie armée des armes à feu acquises, adaptant les leçons de Tondibi pour garantir que l'empire ne soit plus jamais pris sans armes à poudre."
 n_nd_soe_war_canoe: "Canot de guerre Songhaï"
 n_nd_soe_war_canoe_desc: "De grandes pirogues de guerre transportant des marines armés, colonne vertébrale de la flotte du fleuve Niger commandée par les Hi-Koy."
 a_nd_soe_camel_corps: "Corps de chameaux sahariens"
 a_nd_soe_camel_corps_desc: "Des guerriers à dos de chameau qui patrouillent la frontière saharienne, protégeant les caravanes et frappant au plus profond du désert."
 nd_soe_sankore_madrasa: "Médersa Sankoré"
 nd_soe_sankore_madrasa_desc: "Un centre d'apprentissage islamique sur le modèle de la grande mosquée Sankoré de Tombouctou, où les érudits enseignent la théologie, le droit, la médecine et l'astronomie."
 nd_soe_saharan_caravanserai: "Caravansérail saharien"
 nd_soe_saharan_caravanserai_desc: "Une halte fortifiée le long des routes commerciales transsahariennes, offrant un abri, de l'eau et des marchés aux marchands ambulants."
 nd_soe_niger_port: "Port fluvial du Niger"
 nd_soe_niger_port_desc: "Un quai et un chantier naval le long du fleuve Niger, où les marchandises sont chargées sur des canoës pour le transport et où les navires de guerre sont construits et réparés."
 nd_soe_qadi_court: "Cour des Qadis"
 nd_soe_qadi_court_desc: "Un tribunal judiciaire islamique où le Qadi administre la justice selon la charia, apportant ordre et légitimité à la gouvernance impériale."
 nd_soe_imperial_granary: "Grenier Impérial"
 nd_soe_imperial_granary_desc: "Un entrepôt en briques crues qui collecte et préserve les richesses des plaines inondables du Niger, assurant contre la famine et nourrissant les villes de l'empire."
 nd_soe_gold_market: "Marché de l'or"
 nd_soe_gold_market_desc: "Maison de commerce où l'or de Wangara est pesé, analysé et échangé contre le sel de Taghaza et le drap de la Méditerranée."
 nd_soe_djenne_mosque: "Mosquée de Djenné"
 nd_soe_djenne_mosque_desc: "Une mosquée monumentale en briques crues dans la tradition de la grande architecture de Djenné, inspirant dévotion et fierté culturelle."
 nd_soe_muhtasib_office: "Bureau Muhtasib"
 nd_soe_muhtasib_office_desc: "Le quartier général de l'inspecteur impérial du commerce, qui veille au respect des poids standardisés, des transactions équitables et des réglementations du marché."
 nd_soe_slave_barracks: "Caserne des soldats esclaves"
 nd_soe_slave_barracks_desc: "Des quartiers pour les soldats esclaves personnellement fidèles à l'empereur, formant une force militaire professionnelle fiable et indépendante de la loyauté du clan."
 nd_soe_madrasa_upkeep: "Entretien scolaire"
 nd_soe_madrasa_upkeep_desc: "Papier pour les manuscrits, poterie pour les récipients à encre et encens pour la dévotion : les besoins quotidiens d'un centre d'apprentissage islamique."
 nd_soe_caravanserai_upkeep: "Dispositions de la caravane"
 nd_soe_caravanserai_upkeep_desc: "Bétail pour les animaux de la caravane, poterie pour les voyageurs et sel pour la conservation : le coût du maintien en vie des routes commerciales."
 nd_soe_port_upkeep: "Entretien portuaire"
 nd_soe_port_upkeep_desc: "Bois et goudron pour les canoës et les quais, outils pour les charpentiers navals qui maintiennent la flotte du fleuve Niger en état de navigabilité."
 nd_soe_court_upkeep: "Dossiers judiciaires"
 nd_soe_court_upkeep_desc: "Papier pour les documents juridiques, tissu fin pour les robes judiciaires et encens pour la solennité de la cour du Qadi."
 nd_soe_granary_upkeep: "Entretien du grenier"
 nd_soe_granary_upkeep_desc: "Du bois et de l'argile pour entretenir les grands entrepôts, et des outils pour les ouvriers qui gèrent les réserves de céréales de l'empire."
 nd_soe_gold_market_upkeep: "Opérations de marché"
 nd_soe_gold_market_upkeep_desc: "Poterie pour les instruments de pesée, tissu pour les marchandises commerciales et papier pour les enregistrements de chaque échange : le coût de fonctionnement d'un grand marché de l'or."
 nd_soe_mosque_upkeep: "Entretien de la mosquée"
 nd_soe_mosque_upkeep_desc: "Argile et bois pour la restauration annuelle de la mosquée en briques crues, avec de l'encens parfumant les salles de prière : un devoir communautaire sacré."
 nd_soe_office_upkeep: "Dossiers de l'inspecteur"
 nd_soe_office_upkeep_desc: "Du papier et de la poterie pour les archives minutieuses, du tissu pour les uniformes et des sceaux qui confèrent leur autorité aux muhtasib."
 nd_soe_barracks_upkeep: "Approvisionnement des casernes"
 nd_soe_barracks_upkeep_desc: "Armes, tissus et cuir pour armer, habiller et équiper la garnison de soldats esclaves."
 nd_soe_gold_refining: "Raffinage de l'or"
 nd_soe_gold_refining_desc: "Argent pour les alliages, creusets de poterie et outils pour les essayeurs : le traitement minutieux de la poussière d'or brute sous une forme commercialisable."
 nd_soe_salt_caravan: "Opérations des caravanes de sel"
 nd_soe_salt_caravan_desc: "Animaux des caravanes, commerce des tissus et sel lui-même : approvisionnement des caravanes de chameaux qui transportent le sel saharien vers les marchés du Sahel."
 nd_soe_manuscript_production: "Production de manuscrits"
 nd_soe_manuscript_production_desc: "Papier pour les pages, teintures pour l'encre et toile pour la reliure : la copie minutieuse des manuscrits savants dans la scriptoria de Tombouctou."
 nd_soe_horse_breeding: "Elevage de chevaux sahariens"
 nd_soe_horse_breeding_desc: "Bétail pour l'élevage, céréales pour l'alimentation et sel pour la santé des animaux : l'élevage de chevaux de guerre et de caravanes dans les prairies sahéliennes."
 levy_nd_soe_camel_corps: "Prélèvement sur les chameaux sahariens"
 levy_nd_soe_camel_corps_desc: "Des guerriers à dos de chameau élevés depuis les frontières du désert pour patrouiller et défendre les territoires sahariens de l'empire."
 levy_nd_soe_mounted_archers: "Prélèvement d'archer monté"
 levy_nd_soe_mounted_archers_desc: "Archers de cavalerie légère issus de la noblesse Songhaï pour les tâches de reconnaissance et de filtrage."
 nd_soe_formed_tt: "L'Empire Songhaï a été formé"
 nd_soe_path_a_tt: "Choisissez le seigneur de la rivière"
 nd_soe_path_b_tt: "Choisissez le trône du savant"
 nd_soe_destiny: "Destin des Songhaï"
 nd_soe_destiny_desc: "L'empire Songhaï s'est développé. Il lui faut maintenant choisir sa voie : la conquête ou l’illumination."
 nd_soe_dest_saharan_salt: "Routes du sel sahariennes"
 nd_soe_dest_saharan_salt_desc: "Emparez-vous des mines de sel du Sahara et écrasez les royaumes Mossi pour sécuriser la frontière sud de l'empire. Contrôler Taghaza et Ouagadougou."
 nd_soe_dest_hausa_conquest: "Conquête du pays haoussa"
 nd_soe_dest_hausa_conquest_desc: "Marchez vers l’est en pays haoussa. Prenez Kano, Katsina et la capitale Bornu de Ngazargamu pour dominer le Sahel central."
 nd_soe_dest_sahel_hegemony: "Hégémonie du Sahel"
 nd_soe_dest_sahel_hegemony_desc: "Poussez vers le sud dans les champs aurifères d’Asante et vers l’ouest jusqu’à Sokoto. Aucune puissance en Afrique de l’Ouest ne peut rivaliser avec l’empire Songhaï."
 nd_soe_dest_gold_routes: "Maîtres du commerce de l'or"
 nd_soe_dest_gold_routes_desc: "Contrôler les sources d'or à Begho et assurer la circulation de l'or sur les marchés Songhaï. La richesse est le fondement de la civilisation."
 nd_soe_dest_islamic_learning: "Ville de la connaissance"
 nd_soe_dest_islamic_learning_desc: "Adopter les institutions bancaires et développer la région du Niger pour soutenir le rôle de Tombouctou en tant que capitale intellectuelle de l'Afrique."
 nd_soe_dest_beacon_of_africa: "Phare de l'Afrique"
 nd_soe_dest_beacon_of_africa_desc: "Atteindre le plus haut développement au Sahel, adopter l’imprimerie et faire de l’Empire Songhaï la puissance la plus prestigieuse d’Afrique."
 nd_soe.6.t: "Le destin de Songhaï"
 nd_soe.6.d: "L’empire Songhaï se trouve à la croisée des chemins. Le Niger se courbe devant nous, le désert s'étend derrière nous et l'avenir est entre nos mains. Que nous choisissions l’épée ou la plume, l’empire perdurera."
 nd_soe.6.a: "L'empire perdure."
 nd_soe.7.t: "Les routes du sel sont à nous"
 nd_soe.7.d: "Les grandes caravanes de sel qui traversent le Sahara se déplacent désormais sous la protection Songhaï. De Taghaza aux marchés du Sahel, chaque barre de sel enrichit notre trésor. Les royaumes Mossi ont été humiliés et la frontière sud est sécurisée."
 nd_soe.7.a: "Le sel est la richesse du désert."
 nd_soe.8.t: "La chute du pays haoussa"
 nd_soe.8.d: "The walled cities of Hausaland have fallen to our armies. Kano, that great center of Saharan commerce, lies under Songhai authority. Katsina's dye pits and Bornu's Lake Chad frontier are ours. But how shall we govern these conquered peoples?\n\nWe may extract tribute and leave local rulers in place, enriching the treasury while preserving stability. Or we may integrate these lands fully into the imperial system, accepting their peoples as our own, though this strains our administrative capacity."
 nd_soe.8.a: "Extrayez l'hommage des villes conquises."
 nd_soe.8.b: "Intégrez le pays haoussa à l’empire."
 nd_soe.9.t: "Seigneurs du Sahel"
 nd_soe.9.d: "From the gold fields of Asante to the salt mines of Taghaza, from the Niger bend to the borders of Bornu, no power in West Africa can rival the Songhai Empire. Our armies have achieved what Sunni Ali dreamed: total dominion over the Sahel.\n\nShall we rule as the Iron Askia, projecting unstoppable military power across the region? Or shall we embrace the empire of dust: mastering the terrain itself, making the desert and savanna our greatest fortress?"
 nd_soe.9.a: "Nous sommes les Askia de fer : personne ne s’opposera à nous."
 nd_soe.9.b: "Le désert est notre forteresse et notre arme."
 nd_soe.10.t: "L’or coule à flot à Songhaï"
 nd_soe.10.d: "L’or du sud passe désormais entre les mains des Songhaï. A Begho et sur nos marchés, le métal précieux est pesé, taxé et acheminé vers le nord à travers le Sahara. Des marchands du monde musulman viennent faire du commerce dans nos villes, attirés par la fiabilité de nos poids et l’équité de nos tribunaux."
 nd_soe.10.a: "Laissez couler l’or."
 nd_soe.11.t: "La floraison de Tombouctou"
 nd_soe.11.d: "Timbuktu has become what Askia Muhammad always envisioned: a city where scholarship and commerce are inseparable, where the wealth of the gold trade funds libraries and madrasas, where students come from across the Muslim world to study under Songhai masters.\n\nShall we deepen the scholarly networks, attracting more learned men to our courts even at the cost of military readiness? Or shall we cultivate merchant-scholars who combine trade acumen with intellectual refinement, though some diplomats may find our commercial focus uncouth?"
 nd_soe.11.a: "L'érudition avant tout : la connaissance est éternelle."
 nd_soe.11.b: "La sagesse et la richesse vont de pair."
 nd_soe.12.t: "Le phare de l'Afrique"
 nd_soe.12.d: "The Songhai Empire has achieved what no sub-Saharan power has done before. Timbuktu rivals Cairo as a center of Islamic learning. Our development exceeds that of any Sahelian state in history. The printing press preserves the manuscripts that once existed only in fragile copies.\n\nShall we embrace a golden age of culture, making Timbuktu the undisputed intellectual capital of the Islamic world? Or shall we build a universal empire, binding diverse peoples together through shared faith and mutual obligation?"
 nd_soe.12.a: "Que Tombouctou brille comme le joyau de l’Islam."
 nd_soe.12.b: "Nous bâtirons un empire composé de nombreux peuples et d’une seule foi."
 STATIC_MODIFIER_NAME_nd_soe_dest_hausa_tribute: "Hommage du pays haoussa"
 STATIC_MODIFIER_DESC_nd_soe_dest_hausa_tribute: "Les villes conquises du pays haoussa rendent hommage aux Askia, remplissant le trésor tandis que les dirigeants locaux maintiennent l'ordre sous la surveillance de Songhaï."
 STATIC_MODIFIER_NAME_nd_soe_dest_hausa_integration: "Peuples de l'Empire"
 STATIC_MODIFIER_DESC_nd_soe_dest_hausa_integration: "Les peuples du pays haoussa sont accueillis dans le giron impérial, leurs cultures étant acceptées comme faisant partie de la mosaïque Songhaï."
 STATIC_MODIFIER_NAME_nd_soe_dest_iron_askia: "L'Askia de fer"
 STATIC_MODIFIER_DESC_nd_soe_dest_iron_askia: "L’armée Songhaï frappe avec la rapidité et la précision de la renaissance d’Ali sunnite, écrasant les ennemis avant qu’ils ne puissent monter une défense."
 STATIC_MODIFIER_NAME_nd_soe_dest_empire_of_dust: "Empire de la poussière"
 STATIC_MODIFIER_DESC_nd_soe_dest_empire_of_dust: "Le Sahel lui-même se bat pour les Songhaï. Les envahisseurs sombrent dans le désert tandis que nos armées se déplacent facilement sur un terrain familier."
 STATIC_MODIFIER_NAME_nd_soe_dest_scholars_network: "Réseau de chercheurs"
 STATIC_MODIFIER_DESC_nd_soe_dest_scholars_network: "Un réseau de correspondance relie les érudits Songhaï aux grands esprits du monde islamique, accélérant ainsi la diffusion des connaissances."
 STATIC_MODIFIER_NAME_nd_soe_dest_merchant_scholars: "Marchands-Érudits du Niger"
 STATIC_MODIFIER_DESC_nd_soe_dest_merchant_scholars: "Les savants marchands de Tombouctou allient sens commercial et profondeur intellectuelle, favorisant la prospérité dans tout le bassin du Niger."
 STATIC_MODIFIER_NAME_nd_soe_dest_timbuktu_golden_age: "L'âge d'or de Tombouctou"
 STATIC_MODIFIER_DESC_nd_soe_dest_timbuktu_golden_age: "Tombouctou entre dans sa plus grande époque : une ville aux cent mille manuscrits, où l'érudition, l'art et la foi illuminent le Sahel."
 STATIC_MODIFIER_NAME_nd_soe_dest_universal_empire: "L'Empire universel"
 STATIC_MODIFIER_DESC_nd_soe_dest_universal_empire: "L’empire Songhaï transcende les frontières tribales, liant Songhaï, Mandingue, Touareg et Haoussa en une seule communauté de foi et d’obligations."
 nd_soe_imperial_warcamp: "Camp de guerre impérial"
 nd_soe_imperial_warcamp_desc: "Une base fortifiée où les Askia rassemblent leurs armées, stockent le pillage et planifient la prochaine campagne de conquête."
 nd_soe_warcamp_upkeep: "Approvisionnement du camp de guerre"
 nd_soe_warcamp_upkeep_desc: "Armes pour les soldats, cuir pour réparer les armures et outils pour l'équipement de siège : le coût quotidien de l'entretien d'un camp de guerre impérial."
 nd_soe_house_of_wisdom: "Maison de la Sagesse"
 nd_soe_house_of_wisdom_desc: "Une grande institution d'enseignement où les érudits traduisent, copient et composent des ouvrages de théologie, de science et de philosophie dans la tradition de Bayt al-Hikma de Bagdad."
 nd_soe_wisdom_upkeep: "Dispositions savantes"
 nd_soe_wisdom_upkeep_desc: "Du papier pour les manuscrits, des livres pour la bibliothèque et de l'encens pour la contemplation : les coûts nécessaires au maintien d'un grand centre d'apprentissage."

 AUTO_MODIFIER_NAME_nd_soe_bureaucracy_authority: "Appareil impérial Songhaï"
 AUTO_MODIFIER_DESC_nd_soe_bureaucracy_authority: "Du bureau de la flotte fluviale du Hi-Koy aux farmas nommés par Askia Muhammad, en passant par la cour des inquisiteurs inspirée d'al-Maghili, les chroniqueurs de Tarikh, le corps permanent des rumde et les domaines royaux impériaux de la boucle du Niger, l'État Songhaï a atteint une profondeur de portée administrative que l'ancienne fédération Manden n'avait jamais tentée. Deux créneaux bureaucratiques s'ouvrent à côté du siège de la capitale pour les institutions de l'Etat Askia."

 soe_hi_koy_bureaucracy: "Bureau du Sea-Master de Hi-Koy"
 soe_hi_koy_bureaucracy_desc: "L'amirauté de la flotte fluviale du Niger - le bureau Songhaï le plus distinctif et sans précédent au Mali. Le Hi-Koy commandait une flottille de pirogues de guerre blindées qui transportaient les troupes des Askia le long du delta intérieur de Gao à Jenne, transportaient du sel et des céréales vers les marchés impériaux et imposaient la perception des péages aux passages de la rivière. Cette position coexistait difficilement avec la noblesse de cavalerie : la flotte fluviale était construite autour de castes de pêcheurs (les Sorko, les Bozo et les Somono) que la cavalerie méprisait mais dont dépendait la logistique impériale."

 soe_askia_farmas_bureaucracy: "Fermes provinciales Askia"
 soe_askia_farmas_bureaucracy_desc: "La réforme d'Askia Muhammad de 1493 a divisé l'empire en gouverneurs nommés : Kurmina-Fari à l'ouest, Dendi-Fari au sud, Bana-Farma à l'est, plus Hari-Farma des lacs, Sao-Farma des forêts, Fari-Mondio des plaines de Dirma et Yufu-Mondio des rivières. Là où Ali sunnite avait gouverné par l'intermédiaire de chefs tributaires, les Askia nommaient des loyalistes (souvent des parents, souvent d'anciens officiers esclavagistes) dont le mandat était au gré du trône. Le système farma était l’épine dorsale de la centralisation Songhaï et l’élément le plus ressenti par l’aristocratie déplacée de l’ère Sonni."

 soe_mori_koyra_bureaucracy: "Tribunal des inquisiteurs de Mori-Koyra"
 soe_mori_koyra_bureaucracy_desc: "À son retour du hajj de 1496-97, Askia Muhammad consulta l'érudit nord-africain Muhammad al-Maghili, dont les réponses aux questions de l'émir de Songhaï prescrivaient une purge rigoureuse des pratiques islamiques mixtes et la nomination d'un inquisiteur - mori-koyra, le grand érudit - habilité à poursuivre l'apostasie, le syncrétisme avec les cultes spirituels Bori et Hauka et l'abus noble de la loi. L’institution a donné au trône impérial une portée religieuse et judiciaire dans les campagnes que la noblesse ne pouvait pas bloquer, mais elle a enflammé la majorité rurale encore païenne qui a vu ses pratiques ancestrales criminalisées."

 soe_tarikh_scribes_bureaucracy: "Scribes de la Chronique de Tarikh"
 soe_tarikh_scribes_bureaucracy_desc: "La classe de scribes lettrés Soninke, Sanhaja et Songhaï qui composait la chancellerie des Askias et dont les rangs étaient issus des chroniqueurs du Tarikh as-Sudan, terminé par Abd al-Rahman al-Sa'di de Tombouctou en 1655, et du Tarikh al-Fattash, commencé sous Askia Muhammad par la famille Kati et continué pendant plus d'un siècle. Contrairement à la tradition orale djeli du Manden, il s’agissait d’une bureaucratie documentaire : lettres de nomination, registres fiscaux, fatwas jurisprudentielles et généalogies qui légitimaient la lignée Askia. Les chroniqueurs ont préservé la mémoire institutionnelle Songhaï, souvent subtilement contre le trône chaque fois qu'ils pensaient que le trône avait commis une erreur."

 soe_rumde_corps_bureaucracy: "Corps permanent de Rumde"
 soe_rumde_corps_bureaucracy_desc: "L'armée permanente des Askia composée de captifs de guerre et de travailleurs serviles enrôlés - rumde, arbi - se distingue des levées saisonnières de la cavalerie noble. Recrutés lors de campagnes le long du Niger et à travers le pays Mossi, équipés des armureries impériales de Gao et cantonnés toute l'année, les rumde ont donné aux Askias un instrument indépendant et un contrepoids à l'aristocratie de cavalerie de l'ère Sonni. Leur disponibilité toute l’année a rendu possible les campagnes prolongées du Mandé, du Mossi, du Haoussa et du Sahara qui ont défini la période impériale ; leur coût a forcé l'inflation du tribut des esclaves qui pesait sur la paysannerie."

 soe_tondi_farma_bureaucracy: "Domaines royaux de Tondi-Farma"
 soe_tondi_farma_bureaucracy_desc: "Les terres du domaine impérial du coude du Niger : rizières à Dendi, pâturages de bétail le long des lacs, plantations de mil dans la plaine inondable, le tout exploité par des captifs de guerre zanj et administré par un Tondi-Farma - maître des champs - relevant directement des Askia. Les domaines royaux nourrissaient l'armée permanente, approvisionnaient la cour de Gao et donnaient au trône un revenu indépendant de l'impôt kharaj qui devait être négocié avec les chefs provinciaux. Ils attachèrent également à la couronne une importante population non libre, un fait qui, après Tondibi en 1591, devint le germe de la révolte."
