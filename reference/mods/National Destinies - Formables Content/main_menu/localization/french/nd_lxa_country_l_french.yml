 LXA: "Lan Xang"
 LXA_ADJ: "Lan Xang"
 LXA_f: "Lan Xang"
 LXA_f_desc: "Le royaume de Lan Xang, le pays du million d'éléphants, était le grand royaume unifié du Laos fondé par Fa Ngum en 1354. S'étendant du plateau de Khorat jusqu'aux hautes terres du nord du haut Mékong, il était l'un des plus grands royaumes d'Asie du Sud-Est jusqu'à ce que des conflits internes le divisent en royaumes rivaux de Luang Prabang, Vientiane et Champasak en 1707. Un dirigeant lao qui contrôle les deux anciennes capitales pourrait restaurer ce jadis puissant. royaume."
