 # Government Reforms: Administrative Doctrines
 nd_patrimonial_doctrine: "Doctrine patrimoniale"
 nd_patrimonial_doctrine_desc: "Bureaucratic offices are treated as inherited entitlements of the realm itself. Old institutions accumulate without being abolished, and once established they are nearly impossible to dismantle. The state pays a high ongoing cost to keep them all running, but enjoys a permanence no rival can match.\n\nGrants [bureaucracies|e] +1 slot, +10% maintenance cost, -15% removal cost."
 
 nd_oligarchic_doctrine: "Doctrine oligarchique"
 nd_oligarchic_doctrine_desc: "Bureaucratic offices are run by the great estates as patrimonies of their own. The magnates absorb most operational costs in exchange for influence, but every adjustment to a bureau's mandate provokes negotiation among its noble patrons.\n\nGrants [bureaucracies|e] +1 slot, -10% maintenance cost, +5% reshape cost."
 
 nd_meritocratic_doctrine: "Doctrine méritocratique"
 nd_meritocratic_doctrine_desc: "Bureaucratic offices are filled by examination and trained service, not patronage. The professional staff costs slightly more to retain, but their institutions take root quickly and reach full effectiveness far faster than rival systems.\n\nGrants [bureaucracies|e] +1 slot, +5% maintenance cost, +15% entrenchment speed."

 # Law: Bureaucratic Funding
 nd_bureaucratic_funding_law: "Financement bureaucratique"
 nd_bureaucratic_funding_law_desc: "Comment l’appareil d’État est-il réellement financé ? Chaque politique engage le royaume dans un modèle de financement différent, avec des conséquences sur le coût d’installation des institutions, la facilité avec laquelle leurs mandats peuvent être remaniés et la rapidité avec laquelle elles s’enracinent."
 
 nd_tax_farming_policy: "Agriculture fiscale"
 nd_tax_farming_policy_desc: "Tax-collection rights are sold to private agents who fund the bureaucracy from their cut. Setting up new offices is cheap, and abolishing them is just as easy, but the nobility quietly pockets the savings.\n\nGrants -25% [bureaucracy|e] implementation cost, -15% removal cost. Favoured by the [ShowEstateTypeName('nobles_estate')]."
 
 nd_crown_coffers_policy: "Coffres de la Couronne"
 nd_crown_coffers_policy_desc: "The treasury directly funds every bureau from the royal purse. Setup is moderately cheap, and (crucially) institutions reach their full institutional weight much faster than under any other model.\n\nGrants -15% [bureaucracy|e] implementation cost, +20% entrenchment speed. Favoured by the [ShowEstateTypeName('crown_estate')]."
 
 nd_estate_subvention_policy: "Subvention successorale"
 nd_estate_subvention_policy_desc: "Each estate funds the institutions that benefit it. Bureaus serve narrow constituencies, but the estates absorb the political cost of changing a bureau's focus, leaving the slider remarkably cheap to retune.\n\nGrants -25% [bureaucracy|e] reshape cost. Favoured by the [ShowEstateTypeName('clergy_estate')]."
 
 nd_treasury_bureau_policy: "Bureau du Trésor"
 nd_treasury_bureau_policy_desc: "A modern budgetary bureau allocates funds to every institution from a unified state account, with line-item review. Marginally best across implementation, reshape, and entrenchment, but politically unimaginable before the age of absolutism.\n\nGrants -15% [bureaucracy|e] implementation cost, -15% reshape cost, +10% entrenchment speed. Favoured by the [ShowEstateTypeName('burghers_estate')]."
