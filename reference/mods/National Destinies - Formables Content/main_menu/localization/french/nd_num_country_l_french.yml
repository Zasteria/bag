 NUM: "Comancherie"
 NUM_ADJ: "Comanche"
 NUM_f: "Comancherie"
 NUM_f_desc: "Formez Numunu Sookobitu, le pays Comanche, en un empire souverain des chevaux des Plaines. Depuis le cœur du Llano Estacado, les paraibos et les tekwuniwapi unissent les divisions Penateka, Yamparika, Quahadi, Nokoni et Kotsoteka en une seule confédération, extrayant un tribut des régions frontalières et transformant l'économie du bison en fondement d'une puissance continentale. Il s’agit de l’Empire Comanche tel que Pekka Hmlinen l’a décrit : un État indigène qui a imposé sa volonté sur les plaines du sud pendant un siècle et demi, rendu permanent."
