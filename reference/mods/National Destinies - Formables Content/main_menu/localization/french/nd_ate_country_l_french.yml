l_french:
 ATE: "Ashanti"
 ATE_ADJ: "Ashanti"
 ATE_f: "Confédération Ashanti"
 ATE_f_desc: "La Confédération Ashanti a uni les peuples Akan sous le Tabouret d'Or, forgeant un puissant royaume centré sur Kumasi. Grâce au contrôle du commerce de l’or et à une organisation militaire sophistiquée, les Asantehene pourraient projeter leur pouvoir sur toute la Gold Coast et profondément à l’intérieur de l’Afrique de l’Ouest."
