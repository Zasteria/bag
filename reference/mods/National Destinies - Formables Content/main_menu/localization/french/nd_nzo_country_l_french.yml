 NZO: "Nanzhao"
 NZO_ADJ: "Nanzhao"
 NZO_f: "Nanzhao"
 NZO_f_desc: "Nanzhao était le grand royaume Bai et Yi centré sur le lac Erhai dans le Yunnan, unissant les six zhao sous un seul trône de 738 à 902 de notre ère. À son apogée, elle rivalisait avec la dynastie Tang, conquérant le sud du Sichuan, l'ouest du Guizhou et les cités-États Pyu de la haute Birmanie. Un Nanzhao restauré récupérerait cet empire multiethnique des hautes terres s’étendant au carrefour entre la Chine, le Tibet et l’Asie du Sud-Est."
