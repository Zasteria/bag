l_french:

 # Buildings
 nd_provincial_estate: "Domaine provincial"
 nd_provincial_estate_desc: "Un siège de gouvernement provincial doté d'un personnel noble dans une ville lointaine, étendant la portée de la couronne dans le royaume au prix de la concession de l'influence locale à la noblesse. Plus faible qu'un gouverneur local à part entière."
 nd_port_commandery: "Commanderie portuaire"
 nd_port_commandery_desc: "Un poste administratif doté d'un personnel noble dans un port d'outre-mer au-delà de la portée terrestre de la capitale, projetant l'autorité royale sur l'eau au prix de la concession de l'influence locale à la noblesse. Plus faible qu'un gouverneur naval à part entière."

 # Production methods
 nd_provincial_estate_maintenance: "Entretien du domaine provincial"
 nd_port_commandery_maintenance: "Entretien de la commanderie portuaire"

 # Build allow tooltips
 nd_provincial_estate_tt: "S'il y a moins de[SCOPE.sCountry('actor').GetModifierValue('num_nd_provincial_estates')][ShowBuildingTypeName('nd_provincial_estate')]dans[SCOPE.sCountry('actor').GetNameWithNoTooltip](actuellement[SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('nd_provincial_estate')|V])."
 nd_port_commandery_tt: "S'il y a moins de[SCOPE.sCountry('actor').GetModifierValue('num_nd_port_commanderies')][ShowBuildingTypeName('nd_port_commandery')]dans[SCOPE.sCountry('actor').GetNameWithNoTooltip](actuellement[SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('nd_port_commandery')|V])."

 # Modifier names
 MODIFIER_TYPE_NAME_num_nd_provincial_estates: "Nombre de domaines provinciaux"
 MODIFIER_TYPE_DESC_num_nd_provincial_estates: "Cela détermine combien de[ShowBuildingTypeName('nd_provincial_estate')]un pays peut construire."
 MODIFIER_TYPE_NAME_num_nd_port_commanderies: "Nombre de commanderies portuaires"
 MODIFIER_TYPE_DESC_num_nd_port_commanderies: "Cela détermine combien de[ShowBuildingTypeName('nd_port_commandery')]un pays peut construire."
