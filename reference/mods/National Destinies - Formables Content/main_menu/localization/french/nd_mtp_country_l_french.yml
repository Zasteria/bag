l_french:
 # Vanilla 1.2 added MTP / MTP_ADJ; mod's previous duplicates removed to
 # avoid silent shadowing if vanilla's strings are ever revised.
 MTP_f: "Empire Mutapa"
 MTP_f_desc: "Le royaume de Mutapa a été fondé par Nyatsimba Mutota lorsque les Karanga Shona se sont étendus vers le nord, du Grand Zimbabwe jusqu'à la vallée du Zambèze, à la recherche de sel et de nouvelles terres. À son apogée, Mutapa contrôlait le commerce de l'or en Afrique du Sud-Est, canalisant les richesses de l'intérieur via Sofala vers les marchands de la côte swahili. Restaurer le Mutapa, c'est réunir le cœur du Shona et reprendre la maîtrise des richesses légendaires de la région."
