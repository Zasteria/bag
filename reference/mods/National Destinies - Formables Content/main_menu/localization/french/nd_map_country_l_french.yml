l_french:
 MAP: "Carte murale"
 MAP_ADJ: "Mapuche"
 MAP_f: "Carte murale"
 MAP_f_desc: "Forgez les Lof, Rewe et Aillarewe dispersés du peuple mapuche en une seule confédération souveraine. Des forêts de Ngulumapu aux steppes de Puelmapu, les Reche qui ont repoussé les Incas et brisé les Espagnols à Curalaba revendiquent désormais un royaume reconnu sur tout le territoire compris entre la cordillère et la mer. Les Toki dirigeront la fédération dans la guerre, les Machi garderont son esprit et aucune couronne étrangère ne mettra les pieds au sud du Bo-Bo sans y être invitée."
