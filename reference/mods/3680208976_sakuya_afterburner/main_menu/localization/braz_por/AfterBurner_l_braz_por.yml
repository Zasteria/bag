l_braz_por:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Usa o prefixo SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Deixe Sakuya marcar este lugar"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Marcar a [location|e] atual\n$SAKUYA_RC$Marcar todos os $LOCATIONS_TAB$ nestas [provinces|e]\n$SAKUYA_SL$Marcar todos os $LOCATIONS_TAB$ nesta [area|e]\n$SAKUYA_SR$Marcar todos os $LOCATIONS_TAB$ nesta [region|e]\n$SAKUYA_CL$Marcar #N todos os territórios#! pertencentes ao jogador\n\nDepois disso, você poderá ajustá-los livremente no menu #P $SAKUYA_TEST_BTN_8$#! dentro de $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Remover#! marcação"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Desmarcar a [location|e] atual\n$SAKUYA_RC$Desmarcar todos os $LOCATIONS_TAB$ nestas [provinces|e]\n$SAKUYA_SL$Desmarcar todos os $LOCATIONS_TAB$ nesta [area|e]\n$SAKUYA_SR$Desmarcar todos os $LOCATIONS_TAB$ nesta [region|e]\n$SAKUYA_CL$Desmarcar #N todos os territórios#! pertencentes ao jogador"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Marcar este país"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Parar de marcar este país"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Deixe Sakuya favorecer este personagem"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Deixe Sakuya abandonar este personagem"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Deixe Sakuya marcar este local estrangeiro"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Marcar o [location|e] estrangeiro atual\n$SAKUYA_RC$Marcar todos os $LOCATIONS_TAB$ estrangeiros nesta [provinces|e]\n$SAKUYA_SL$Marcar todos os $LOCATIONS_TAB$ estrangeiros nesta [area|e]\n$SAKUYA_SR$Marcar todos os $LOCATIONS_TAB$ estrangeiros nesta [region|e]\n$SAKUYA_CL$Marcar #N todos os territórios#! pertencentes a este país estrangeiro\n\nEstas marcas estrangeiras ficam reservadas para recursos posteriores, como cessão de territórios."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Remover#! marca estrangeira"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Remover a marca do [location|e] estrangeiro atual\n$SAKUYA_RC$Remover a marca de todos os $LOCATIONS_TAB$ estrangeiros nesta [provinces|e]\n$SAKUYA_SL$Remover a marca de todos os $LOCATIONS_TAB$ estrangeiros nesta [area|e]\n$SAKUYA_SR$Remover a marca de todos os $LOCATIONS_TAB$ estrangeiros nesta [region|e]\n$SAKUYA_CL$Remover a marca de #N todos os territórios#! pertencentes a este país estrangeiro"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Remover todas as marcas#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Deixe Sakuya anexar este local estrangeiro"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Anexar o [location|e] estrangeiro atual\n$SAKUYA_RC$Anexar todos os $LOCATIONS_TAB$ estrangeiros nesta [provinces|e]\n$SAKUYA_SL$Anexar todos os $LOCATIONS_TAB$ estrangeiros nesta [area|e]\n$SAKUYA_SR$Anexar todos os $LOCATIONS_TAB$ estrangeiros nesta [region|e]\n$SAKUYA_CL$Anexar #N todos os territórios#! pertencentes a este país estrangeiro\n\n#X Aviso:#! isto transfere diretamente o [location|e] alvo para o jogador. Salve o jogo antes."
