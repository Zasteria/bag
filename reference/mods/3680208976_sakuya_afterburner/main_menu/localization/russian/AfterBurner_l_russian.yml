 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Использует префикс SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Пусть Сакуя отметит это место"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Отметить текущую [location|e]\n$SAKUYA_RC$Отметить все $LOCATIONS_TAB$ в этих [provinces|e]\n$SAKUYA_SL$Отметить все $LOCATIONS_TAB$ в этой [area|e]\n$SAKUYA_SR$Отметить все $LOCATIONS_TAB$ в этом [region|e]\n$SAKUYA_CL$Отметить #N все территории#! игрока\n\nПосле этого вы сможете свободно менять их в меню #P $SAKUYA_TEST_BTN_8$#! внутри $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Снять#! отметку"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Снять отметку с текущей [location|e]\n$SAKUYA_RC$Снять отметку со всех $LOCATIONS_TAB$ в этих [provinces|e]\n$SAKUYA_SL$Снять отметку со всех $LOCATIONS_TAB$ в этой [area|e]\n$SAKUYA_SR$Снять отметку со всех $LOCATIONS_TAB$ в этом [region|e]\n$SAKUYA_CL$Снять отметку с #N всех территорий#! игрока"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Отметить эту страну"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Больше не отмечать эту страну"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Пусть Сакуя выделит этого персонажа"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Пусть Сакуя отвергнет этого персонажа"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Пусть Сакуя отметит эту иностранную [location|e]"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Отметить текущую иностранную [location|e]\n$SAKUYA_RC$Отметить все иностранные $LOCATIONS_TAB$ в этой [provinces|e]\n$SAKUYA_SL$Отметить все иностранные $LOCATIONS_TAB$ в этой [area|e]\n$SAKUYA_SR$Отметить все иностранные $LOCATIONS_TAB$ в этой [region|e]\n$SAKUYA_CL$Отметить #N все территории#!, которыми владеет эта иностранная страна\n\nЭти иностранные отметки зарезервированы для будущих функций, таких как передача территорий."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Снять#! иностранную отметку"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Снять отметку с текущей иностранной [location|e]\n$SAKUYA_RC$Снять отметку со всех иностранных $LOCATIONS_TAB$ в этой [provinces|e]\n$SAKUYA_SL$Снять отметку со всех иностранных $LOCATIONS_TAB$ в этой [area|e]\n$SAKUYA_SR$Снять отметку со всех иностранных $LOCATIONS_TAB$ в этой [region|e]\n$SAKUYA_CL$Снять отметку с #N всех территорий#!, которыми владеет эта иностранная страна"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Снять все отметки#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Пусть Сакуя присоединит эту иностранную [location|e]"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Присоединить текущую иностранную [location|e]\n$SAKUYA_RC$Присоединить все иностранные $LOCATIONS_TAB$ в этой [provinces|e]\n$SAKUYA_SL$Присоединить все иностранные $LOCATIONS_TAB$ в этой [area|e]\n$SAKUYA_SR$Присоединить все иностранные $LOCATIONS_TAB$ в этой [region|e]\n$SAKUYA_CL$Присоединить #N все территории#!, которыми владеет эта иностранная страна\n\n#X Предупреждение:#! это напрямую передает целевую [location|e] игроку. Сначала сохраните игру."
