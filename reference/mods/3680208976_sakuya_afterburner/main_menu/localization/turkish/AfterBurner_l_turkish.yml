 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Sakuya bu yeri işaretlesin"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Geçerli [location|e] işaretle\n$SAKUYA_RC$Bu [provinces|e] içindeki tüm $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_SL$Bu [area|e] içindeki tüm $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_SR$Bu [region|e] içindeki tüm $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_CL$Oyuncunun sahip olduğu #N tüm bölgeleri#! işaretle\n\nArdından bunları $CHEAT_MENU_TITLE$ içindeki #P $SAKUYA_TEST_BTN_8$#! menüsünde serbestçe düzenleyebilirsiniz."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "İşareti #n kaldır#!"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Geçerli [location|e] işaretini kaldır\n$SAKUYA_RC$Bu [provinces|e] içindeki tüm $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_SL$Bu [area|e] içindeki tüm $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_SR$Bu [region|e] içindeki tüm $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_CL$Oyuncunun sahip olduğu #N tüm bölgelerin#! işaretini kaldır"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Bu ülkeyi işaretle"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Bu ülkeyi artık işaretleme"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Sakuya bu karakteri gözdesi yapsın"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Sakuya bu karakteri gözden çıkarsın"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Sakuya bu yabancı [location|e] konumunu işaretlesin"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Geçerli yabancı [location|e] konumunu işaretle\n$SAKUYA_RC$Bu [provinces|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_SL$Bu [area|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_SR$Bu [region|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini işaretle\n$SAKUYA_CL$Bu yabancı ülkenin sahip olduğu #N tüm toprakları#! işaretle\n\nBu yabancı işaretler, toprak devri gibi sonraki özellikler için ayrılmıştır."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Kaldır#! yabancı işaret"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Geçerli yabancı [location|e] konumundaki işareti kaldır\n$SAKUYA_RC$Bu [provinces|e] içindeki tüm yabancı $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_SL$Bu [area|e] içindeki tüm yabancı $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_SR$Bu [region|e] içindeki tüm yabancı $LOCATIONS_TAB$ işaretlerini kaldır\n$SAKUYA_CL$Bu yabancı ülkenin sahip olduğu #N tüm topraklardaki#! işaretleri kaldır"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Tüm işaretleri kaldır#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Sakuya bu yabancı [location|e] konumunu ilhak etsin"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Geçerli yabancı [location|e] konumunu ilhak et\n$SAKUYA_RC$Bu [provinces|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini ilhak et\n$SAKUYA_SL$Bu [area|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini ilhak et\n$SAKUYA_SR$Bu [region|e] içindeki tüm yabancı $LOCATIONS_TAB$ öğelerini ilhak et\n$SAKUYA_CL$Bu yabancı ülkenin sahip olduğu #N tüm toprakları#! ilhak et\n\n#X Uyarı:#! Bu işlem hedef [location|e] konumunu doğrudan oyuncuya devreder. Önce oyunu kaydedin."
