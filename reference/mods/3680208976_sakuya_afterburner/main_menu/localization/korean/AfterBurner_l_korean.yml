 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # SAKUYA_AB_ 접두사 사용
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "사쿠야가 이곳을 표시"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$현재 [location|e] 표시\n$SAKUYA_RC$이 [provinces|e] 안의 모든 $LOCATIONS_TAB$ 표시\n$SAKUYA_SL$이 [area|e] 안의 모든 $LOCATIONS_TAB$ 표시\n$SAKUYA_SR$이 [region|e] 안의 모든 $LOCATIONS_TAB$ 표시\n$SAKUYA_CL$플레이어가 보유한 #N 모든 영토#! 표시\n\n그 후 $CHEAT_MENU_TITLE$의 #P $SAKUYA_TEST_BTN_8$#! 메뉴에서 자유롭게 조정할 수 있습니다."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n 표시#! 해제"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$현재 [location|e] 표시 해제\n$SAKUYA_RC$이 [provinces|e] 안의 모든 $LOCATIONS_TAB$ 표시 해제\n$SAKUYA_SL$이 [area|e] 안의 모든 $LOCATIONS_TAB$ 표시 해제\n$SAKUYA_SR$이 [region|e] 안의 모든 $LOCATIONS_TAB$ 표시 해제\n$SAKUYA_CL$플레이어가 보유한 #N 모든 영토#! 표시 해제"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "이 국가 표시"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "이 국가 표시 해제"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "사쿠야가 이 인물을 총애"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "사쿠야가 이 인물을 버림"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "사쿠야가 이 외국 [location|e]을 표시하게 하기"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$현재 외국 [location|e] 표시\n$SAKUYA_RC$이 외국 $LOCATIONS_TAB$이 있는 [provinces|e]의 모든 외국 $LOCATIONS_TAB$ 표시\n$SAKUYA_SL$이 외국 $LOCATIONS_TAB$이 있는 [area|e]의 모든 외국 $LOCATIONS_TAB$ 표시\n$SAKUYA_SR$이 외국 $LOCATIONS_TAB$이 있는 [region|e]의 모든 외국 $LOCATIONS_TAB$ 표시\n$SAKUYA_CL$이 외국 국가가 소유한 #N 모든 영토#! 표시\n\n이 외국 표시는 이후 영토 양도 같은 기능을 위해 예약됩니다."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n 제거#! 외국 표시"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$현재 외국 [location|e] 표시 제거\n$SAKUYA_RC$이 외국 $LOCATIONS_TAB$이 있는 [provinces|e]의 모든 외국 $LOCATIONS_TAB$ 표시 제거\n$SAKUYA_SL$이 외국 $LOCATIONS_TAB$이 있는 [area|e]의 모든 외국 $LOCATIONS_TAB$ 표시 제거\n$SAKUYA_SR$이 외국 $LOCATIONS_TAB$이 있는 [region|e]의 모든 외국 $LOCATIONS_TAB$ 표시 제거\n$SAKUYA_CL$이 외국 국가가 소유한 #N 모든 영토#! 표시 제거"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n 모든 표시 제거#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "사쿠야가 이 외국 [location|e]을 병합하게 하기"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$현재 외국 [location|e] 병합\n$SAKUYA_RC$이 [provinces|e]의 모든 외국 $LOCATIONS_TAB$ 병합\n$SAKUYA_SL$이 [area|e]의 모든 외국 $LOCATIONS_TAB$ 병합\n$SAKUYA_SR$이 [region|e]의 모든 외국 $LOCATIONS_TAB$ 병합\n$SAKUYA_CL$이 외국 국가가 소유한 #N 모든 영토#! 병합\n\n#X 경고:#! 이 작업은 대상 [location|e]을 플레이어 소유로 직접 이전합니다. 먼저 게임을 저장하십시오."
