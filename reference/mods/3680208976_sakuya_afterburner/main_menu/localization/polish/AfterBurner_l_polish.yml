 # Używa prefiksu SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Pozwól Sakuya oznaczyć to miejsce"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Oznacz bieżące [location|e]\n$SAKUYA_RC$Oznacz wszystkie $LOCATIONS_TAB$ w tych [provinces|e]\n$SAKUYA_SL$Oznacz wszystkie $LOCATIONS_TAB$ w tym [area|e]\n$SAKUYA_SR$Oznacz wszystkie $LOCATIONS_TAB$ w tym [region|e]\n$SAKUYA_CL$Oznacz #N wszystkie terytoria#! należące do gracza\n\nPotem możesz swobodnie je edytować w menu #P $SAKUYA_TEST_BTN_8$#! w $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Usuń#! oznaczenie"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Usuń oznaczenie bieżącej [location|e]\n$SAKUYA_RC$Usuń oznaczenie wszystkich $LOCATIONS_TAB$ w tych [provinces|e]\n$SAKUYA_SL$Usuń oznaczenie wszystkich $LOCATIONS_TAB$ w tym [area|e]\n$SAKUYA_SR$Usuń oznaczenie wszystkich $LOCATIONS_TAB$ w tym [region|e]\n$SAKUYA_CL$Usuń oznaczenie #N wszystkich terytoriów#! należących do gracza"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Oznacz to państwo"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Przestań oznaczać to państwo"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Pozwól Sakuya upodobać sobie tę postać"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Pozwól Sakuya odrzucić tę postać"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Niech Sakuya oznaczy tę obcą [location|e]"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Oznacz bieżącą obcą [location|e]\n$SAKUYA_RC$Oznacz wszystkie obce $LOCATIONS_TAB$ w tej [provinces|e]\n$SAKUYA_SL$Oznacz wszystkie obce $LOCATIONS_TAB$ w tym [area|e]\n$SAKUYA_SR$Oznacz wszystkie obce $LOCATIONS_TAB$ w tym [region|e]\n$SAKUYA_CL$Oznacz #N wszystkie terytoria#! posiadane przez ten obcy kraj\n\nTe obce oznaczenia są zarezerwowane dla późniejszych funkcji, takich jak cedowanie terytoriów."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Usuń#! obce oznaczenie"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Usuń oznaczenie z bieżącej obcej [location|e]\n$SAKUYA_RC$Usuń oznaczenie ze wszystkich obcych $LOCATIONS_TAB$ w tej [provinces|e]\n$SAKUYA_SL$Usuń oznaczenie ze wszystkich obcych $LOCATIONS_TAB$ w tym [area|e]\n$SAKUYA_SR$Usuń oznaczenie ze wszystkich obcych $LOCATIONS_TAB$ w tym [region|e]\n$SAKUYA_CL$Usuń oznaczenie z #N wszystkich terytoriów#! posiadanych przez ten obcy kraj"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Usuń wszystkie oznaczenia#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Niech Sakuya anektuje tę obcą [location|e]"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Anektuj bieżącą obcą [location|e]\n$SAKUYA_RC$Anektuj wszystkie obce $LOCATIONS_TAB$ w tej [provinces|e]\n$SAKUYA_SL$Anektuj wszystkie obce $LOCATIONS_TAB$ w tym [area|e]\n$SAKUYA_SR$Anektuj wszystkie obce $LOCATIONS_TAB$ w tym [region|e]\n$SAKUYA_CL$Anektuj #N wszystkie terytoria#! posiadane przez ten obcy kraj\n\n#X Ostrzeżenie:#! to bezpośrednio przekazuje docelową [location|e] graczowi. Najpierw zapisz grę."
