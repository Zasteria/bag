l_simp_chinese:
 # ====================================
 # Cheat Menu Pro AfterBurner 喜儿修改器-加力燃烧拓展
 #
 # 使用 SAKUYA_AB_ 前缀
 # ====================================

SAKUYA_AB_CTXMENU_MARK_LOCATION: "让咲夜标记此处"
SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$标记当前[location|e]\n$SAKUYA_RC$标记此$LOCATIONS_TAB$所在[provinces|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SL$标记此$LOCATIONS_TAB$所在[area|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SR$标记此$LOCATIONS_TAB$所在[region|e]的全部$LOCATIONS_TAB$\n$SAKUYA_CL$标记玩家持有的#N 全部领土#!\n\n然后您就可以在$CHEAT_MENU_TITLE$中的#P $SAKUYA_TEST_BTN_8$#!菜单中自由调整了。"

SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n 取消#!标记"
SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$取消标记当前[location|e]\n$SAKUYA_RC$取消标记此$LOCATIONS_TAB$所在[provinces|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SL$取消标记此$LOCATIONS_TAB$所在[area|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SR$取消标记此$LOCATIONS_TAB$所在[region|e]的全部$LOCATIONS_TAB$\n$SAKUYA_CL$取消标记玩家持有的#N 全部领土#!"

SAKUYA_AB_CTXMENU_MARK_COUNTRY: "标记此国家"
SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "不再标记此国家"

SAKUYA_AB_CTXMENU_MARK_CHARACTER: "让咲夜亲睐此角色"
SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "让咲夜摒弃此角色"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "让咲夜标记此外国地点"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$标记当前外国[location|e]\n$SAKUYA_RC$标记此外国$LOCATIONS_TAB$所在[provinces|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SL$标记此外国$LOCATIONS_TAB$所在[area|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SR$标记此外国$LOCATIONS_TAB$所在[region|e]的全部$LOCATIONS_TAB$\n$SAKUYA_CL$标记此外国国家持有的#N 全部领土#!\n\n这些外国标记将为后续的割让领土等功能预留。"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n 取消#!外国标记"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$取消标记当前外国[location|e]\n$SAKUYA_RC$取消标记此外国$LOCATIONS_TAB$所在[provinces|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SL$取消标记此外国$LOCATIONS_TAB$所在[area|e]的全部$LOCATIONS_TAB$\n$SAKUYA_SR$取消标记此外国$LOCATIONS_TAB$所在[region|e]的全部$LOCATIONS_TAB$\n$SAKUYA_CL$取消标记此外国国家持有的#N 全部领土#!"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n 取消全部标记#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "让咲夜吞并此外国地点"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$吞并当前外国[location|e]\n$SAKUYA_RC$吞并此外国$LOCATIONS_TAB$所在[provinces|e]的全部外国$LOCATIONS_TAB$\n$SAKUYA_SL$吞并此外国$LOCATIONS_TAB$所在[area|e]的全部外国$LOCATIONS_TAB$\n$SAKUYA_SR$吞并此外国$LOCATIONS_TAB$所在[region|e]的全部外国$LOCATIONS_TAB$\n$SAKUYA_CL$吞并此外国国家持有的#N 全部领土#!\n\n#X 警告：#!该操作会直接将目标[location|e]转为玩家所有，建议先保存游戏。"
