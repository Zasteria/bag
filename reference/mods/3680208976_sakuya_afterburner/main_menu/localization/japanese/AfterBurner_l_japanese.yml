l_japanese:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # SAKUYA_AB_ 接頭辞を使用
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "咲夜にここをマークさせる"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$現在の[location|e]をマーク\n$SAKUYA_RC$この[provinces|e]内のすべての$LOCATIONS_TAB$をマーク\n$SAKUYA_SL$この[area|e]内のすべての$LOCATIONS_TAB$をマーク\n$SAKUYA_SR$この[region|e]内のすべての$LOCATIONS_TAB$をマーク\n$SAKUYA_CL$プレイヤーが保有する#N すべての領土#!をマーク\n\nその後、$CHEAT_MENU_TITLE$ の #P $SAKUYA_TEST_BTN_8$#! メニューで自由に調整できます。"

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n マーク#!を解除"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$現在の[location|e]のマークを解除\n$SAKUYA_RC$この[provinces|e]内のすべての$LOCATIONS_TAB$のマークを解除\n$SAKUYA_SL$この[area|e]内のすべての$LOCATIONS_TAB$のマークを解除\n$SAKUYA_SR$この[region|e]内のすべての$LOCATIONS_TAB$のマークを解除\n$SAKUYA_CL$プレイヤーが保有する#N すべての領土#!のマークを解除"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "この国家をマーク"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "この国家のマークを解除"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "咲夜にこの人物を気に入らせる"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "咲夜にこの人物を見限らせる"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "咲夜にこの外国[location|e]をマークさせる"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$現在の外国[location|e]をマーク\n$SAKUYA_RC$この外国$LOCATIONS_TAB$がある[provinces|e]内の全外国$LOCATIONS_TAB$をマーク\n$SAKUYA_SL$この外国$LOCATIONS_TAB$がある[area|e]内の全外国$LOCATIONS_TAB$をマーク\n$SAKUYA_SR$この外国$LOCATIONS_TAB$がある[region|e]内の全外国$LOCATIONS_TAB$をマーク\n$SAKUYA_CL$この外国国家が所有する#N 全領土#!をマーク\n\nこれらの外国マークは、後続の領土割譲などの機能用に予約されています。"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n 解除#!外国マーク"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$現在の外国[location|e]のマークを解除\n$SAKUYA_RC$この外国$LOCATIONS_TAB$がある[provinces|e]内の全外国$LOCATIONS_TAB$のマークを解除\n$SAKUYA_SL$この外国$LOCATIONS_TAB$がある[area|e]内の全外国$LOCATIONS_TAB$のマークを解除\n$SAKUYA_SR$この外国$LOCATIONS_TAB$がある[region|e]内の全外国$LOCATIONS_TAB$のマークを解除\n$SAKUYA_CL$この外国国家が所有する#N 全領土#!のマークを解除"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n 全マークを解除#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "咲夜にこの外国[location|e]を併合させる"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$現在の外国[location|e]を併合\n$SAKUYA_RC$この[provinces|e]内の全外国$LOCATIONS_TAB$を併合\n$SAKUYA_SL$この[area|e]内の全外国$LOCATIONS_TAB$を併合\n$SAKUYA_SR$この[region|e]内の全外国$LOCATIONS_TAB$を併合\n$SAKUYA_CL$この外国国家が所有する#N 全領土#!を併合\n\n#X 警告：#!この操作は対象の[location|e]を直接プレイヤー所有にします。先にゲームを保存してください。"
