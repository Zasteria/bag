l_english:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Uses the SAKUYA_AB_ prefix 
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Let Sakuya mark this place"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Mark the current [location|e]\n$SAKUYA_RC$Mark every $LOCATIONS_TAB$ in this [provinces|e]\n$SAKUYA_SL$Mark every $LOCATIONS_TAB$ in this [area|e]\n$SAKUYA_SR$Mark every $LOCATIONS_TAB$ in this [region|e]\n$SAKUYA_CL$Mark #N all territories#! owned by the player\n\nYou can then freely edit them in #P $SAKUYA_TEST_BTN_8$#! inside $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Remove#! mark"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Unmark the current [location|e]\n$SAKUYA_RC$Unmark every $LOCATIONS_TAB$ in this [provinces|e]\n$SAKUYA_SL$Unmark every $LOCATIONS_TAB$ in this [area|e]\n$SAKUYA_SR$Unmark every $LOCATIONS_TAB$ in this [region|e]\n$SAKUYA_CL$Unmark #N all territories#! owned by the player"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Mark this country"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Stop marking this country"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Let Sakuya favor this character"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Let Sakuya cast aside this character"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Let Sakuya mark this foreign location"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Mark the current foreign [location|e]\n$SAKUYA_RC$Mark every foreign $LOCATIONS_TAB$ in this [provinces|e]\n$SAKUYA_SL$Mark every foreign $LOCATIONS_TAB$ in this [area|e]\n$SAKUYA_SR$Mark every foreign $LOCATIONS_TAB$ in this [region|e]\n$SAKUYA_CL$Mark #N all territories#! owned by this foreign country\n\nThese foreign marks are reserved for later features such as ceding territory."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Remove#! foreign mark"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Remove the mark from the current foreign [location|e]\n$SAKUYA_RC$Remove the mark from every foreign $LOCATIONS_TAB$ in this [provinces|e]\n$SAKUYA_SL$Remove the mark from every foreign $LOCATIONS_TAB$ in this [area|e]\n$SAKUYA_SR$Remove the mark from every foreign $LOCATIONS_TAB$ in this [region|e]\n$SAKUYA_CL$Remove the mark from #N all territories#! owned by this foreign country"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Remove all marks#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Let Sakuya annex this foreign location"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Annex the current foreign [location|e]\n$SAKUYA_RC$Annex every foreign $LOCATIONS_TAB$ in this [provinces|e]\n$SAKUYA_SL$Annex every foreign $LOCATIONS_TAB$ in this [area|e]\n$SAKUYA_SR$Annex every foreign $LOCATIONS_TAB$ in this [region|e]\n$SAKUYA_CL$Annex #N all territories#! owned by this foreign country\n\n#X Warning:#! This directly transfers the target [location|e] to the player. Save the game first."
