l_german:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Verwendet das Präfix SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Sakuya diesen Ort markieren lassen"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Die aktuelle [location|e] markieren\n$SAKUYA_RC$Alle $LOCATIONS_TAB$ in dieser [provinces|e] markieren\n$SAKUYA_SL$Alle $LOCATIONS_TAB$ in diesem [area|e] markieren\n$SAKUYA_SR$Alle $LOCATIONS_TAB$ in dieser [region|e] markieren\n$SAKUYA_CL$#N Alle Gebiete#! des Spielers markieren\n\nDanach könnt Ihr sie im Menü #P $SAKUYA_TEST_BTN_8$#! innerhalb von $CHEAT_MENU_TITLE$ frei anpassen."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "Markierung #n entfernen#!"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Die Markierung der aktuellen [location|e] entfernen\n$SAKUYA_RC$Die Markierung aller $LOCATIONS_TAB$ in dieser [provinces|e] entfernen\n$SAKUYA_SL$Die Markierung aller $LOCATIONS_TAB$ in diesem [area|e] entfernen\n$SAKUYA_SR$Die Markierung aller $LOCATIONS_TAB$ in dieser [region|e] entfernen\n$SAKUYA_CL$Die Markierung von #N allen Gebieten#! des Spielers entfernen"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Dieses Land markieren"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Dieses Land nicht mehr markieren"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Sakuya diesen Charakter begünstigen lassen"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Sakuya diesen Charakter verwerfen lassen"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Sakuya diesen fremden Ort markieren lassen"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Aktuellen fremden [location|e] markieren\n$SAKUYA_RC$Alle fremden $LOCATIONS_TAB$ in dieser [provinces|e] markieren\n$SAKUYA_SL$Alle fremden $LOCATIONS_TAB$ in dieser [area|e] markieren\n$SAKUYA_SR$Alle fremden $LOCATIONS_TAB$ in dieser [region|e] markieren\n$SAKUYA_CL$#N Alle Gebiete#! dieses fremden Landes markieren\n\nDiese Fremdmarkierungen sind für spätere Funktionen wie Gebietsabtretungen reserviert."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Fremde Markierung entfernen#!"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Markierung vom aktuellen fremden [location|e] entfernen\n$SAKUYA_RC$Markierung von allen fremden $LOCATIONS_TAB$ in dieser [provinces|e] entfernen\n$SAKUYA_SL$Markierung von allen fremden $LOCATIONS_TAB$ in dieser [area|e] entfernen\n$SAKUYA_SR$Markierung von allen fremden $LOCATIONS_TAB$ in dieser [region|e] entfernen\n$SAKUYA_CL$Markierung von #N allen Gebieten#! dieses fremden Landes entfernen"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Alle Markierungen entfernen#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Sakuya diesen fremden Ort annektieren lassen"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Aktuellen fremden [location|e] annektieren\n$SAKUYA_RC$Alle fremden $LOCATIONS_TAB$ in dieser [provinces|e] annektieren\n$SAKUYA_SL$Alle fremden $LOCATIONS_TAB$ in dieser [area|e] annektieren\n$SAKUYA_SR$Alle fremden $LOCATIONS_TAB$ in dieser [region|e] annektieren\n$SAKUYA_CL$#N Alle Gebiete#! dieses fremden Landes annektieren\n\n#X Warnung:#! Dies überträgt den Ziel-[location|e] direkt an den Spieler. Speichere das Spiel vorher."
