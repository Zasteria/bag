l_french:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Utilise le préfixe SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Laisser Sakuya marquer cet endroit"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Marquer la [location|e] actuelle\n$SAKUYA_RC$Marquer tous les $LOCATIONS_TAB$ de cette [provinces|e]\n$SAKUYA_SL$Marquer tous les $LOCATIONS_TAB$ de cette [area|e]\n$SAKUYA_SR$Marquer tous les $LOCATIONS_TAB$ de cette [region|e]\n$SAKUYA_CL$Marquer #N tous les territoires#! possédés par le joueur\n\nVous pourrez ensuite les modifier librement dans le menu #P $SAKUYA_TEST_BTN_8$#! de $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Retirer#! la marque"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Retirer la marque de la [location|e] actuelle\n$SAKUYA_RC$Retirer la marque de tous les $LOCATIONS_TAB$ de cette [provinces|e]\n$SAKUYA_SL$Retirer la marque de tous les $LOCATIONS_TAB$ de cette [area|e]\n$SAKUYA_SR$Retirer la marque de tous les $LOCATIONS_TAB$ de cette [region|e]\n$SAKUYA_CL$Retirer la marque de #N tous les territoires#! possédés par le joueur"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Marquer ce pays"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Ne plus marquer ce pays"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Laisser Sakuya favoriser ce personnage"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Laisser Sakuya écarter ce personnage"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Laisser Sakuya marquer ce lieu étranger"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Marquer le [location|e] étranger actuel\n$SAKUYA_RC$Marquer tous les $LOCATIONS_TAB$ étrangers dans cette [provinces|e]\n$SAKUYA_SL$Marquer tous les $LOCATIONS_TAB$ étrangers dans cette [area|e]\n$SAKUYA_SR$Marquer tous les $LOCATIONS_TAB$ étrangers dans cette [region|e]\n$SAKUYA_CL$Marquer #N tous les territoires#! possédés par ce pays étranger\n\nCes marques étrangères sont réservées aux fonctions ultérieures, comme la cession de territoires."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Retirer#! la marque étrangère"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Retirer la marque du [location|e] étranger actuel\n$SAKUYA_RC$Retirer la marque de tous les $LOCATIONS_TAB$ étrangers dans cette [provinces|e]\n$SAKUYA_SL$Retirer la marque de tous les $LOCATIONS_TAB$ étrangers dans cette [area|e]\n$SAKUYA_SR$Retirer la marque de tous les $LOCATIONS_TAB$ étrangers dans cette [region|e]\n$SAKUYA_CL$Retirer la marque de #N tous les territoires#! possédés par ce pays étranger"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Retirer toutes les marques#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Laisser Sakuya annexer ce lieu étranger"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Annexer le [location|e] étranger actuel\n$SAKUYA_RC$Annexer tous les $LOCATIONS_TAB$ étrangers dans cette [provinces|e]\n$SAKUYA_SL$Annexer tous les $LOCATIONS_TAB$ étrangers dans cette [area|e]\n$SAKUYA_SR$Annexer tous les $LOCATIONS_TAB$ étrangers dans cette [region|e]\n$SAKUYA_CL$Annexer #N tous les territoires#! possédés par ce pays étranger\n\n#X Avertissement :#! cette action transfère directement le [location|e] ciblé au joueur. Sauvegardez la partie avant."
