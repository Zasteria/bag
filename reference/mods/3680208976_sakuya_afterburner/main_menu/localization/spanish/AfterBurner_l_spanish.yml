l_spanish:
 # ====================================
 # Cheat Menu Pro AfterBurner
 #
 # Usa el prefijo SAKUYA_AB_
 # ====================================

 SAKUYA_AB_CTXMENU_MARK_LOCATION: "Dejar que Sakuya marque este lugar"
 SAKUYA_AB_CTXMENU_MARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_LOCATION$#!\n\n$SAKUYA_LC$Marcar la [location|e] actual\n$SAKUYA_RC$Marcar todos los $LOCATIONS_TAB$ de estas [provinces|e]\n$SAKUYA_SL$Marcar todos los $LOCATIONS_TAB$ de esta [area|e]\n$SAKUYA_SR$Marcar todos los $LOCATIONS_TAB$ de esta [region|e]\n$SAKUYA_CL$Marcar #N todos los territorios#! en posesión del jugador\n\nDespués podrá ajustarlos libremente en el menú #P $SAKUYA_TEST_BTN_8$#! dentro de $CHEAT_MENU_TITLE$."

 SAKUYA_AB_CTXMENU_UNMARK_LOCATION: "#n Quitar#! la marca"
 SAKUYA_AB_CTXMENU_UNMARK_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_LOCATION$#!\n\n$SAKUYA_LC$Desmarcar la [location|e] actual\n$SAKUYA_RC$Desmarcar todos los $LOCATIONS_TAB$ de estas [provinces|e]\n$SAKUYA_SL$Desmarcar todos los $LOCATIONS_TAB$ de esta [area|e]\n$SAKUYA_SR$Desmarcar todos los $LOCATIONS_TAB$ de esta [region|e]\n$SAKUYA_CL$Desmarcar #N todos los territorios#! en posesión del jugador"

 SAKUYA_AB_CTXMENU_MARK_COUNTRY: "Marcar este país"
 SAKUYA_AB_CTXMENU_UNMARK_COUNTRY: "Dejar de marcar este país"

 SAKUYA_AB_CTXMENU_MARK_CHARACTER: "Dejar que Sakuya favorezca a este personaje"
 SAKUYA_AB_CTXMENU_UNMARK_CHARACTER: "Dejar que Sakuya descarte a este personaje"

 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION: "Dejar que Sakuya marque esta [location|e] extranjera"
 SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_MARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Marcar la [location|e] extranjera actual\n$SAKUYA_RC$Marcar todos los $LOCATIONS_TAB$ extranjeros en esta [provinces|e]\n$SAKUYA_SL$Marcar todos los $LOCATIONS_TAB$ extranjeros en esta [area|e]\n$SAKUYA_SR$Marcar todos los $LOCATIONS_TAB$ extranjeros en esta [region|e]\n$SAKUYA_CL$Marcar #N todos los territorios#! poseídos por este país extranjero\n\nEstas marcas extranjeras se reservan para funciones posteriores, como ceder territorio."
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION: "#n Quitar#! marca extranjera"
 SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_UNMARK_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Quitar la marca de la [location|e] extranjera actual\n$SAKUYA_RC$Quitar la marca de todos los $LOCATIONS_TAB$ extranjeros en esta [provinces|e]\n$SAKUYA_SL$Quitar la marca de todos los $LOCATIONS_TAB$ extranjeros en esta [area|e]\n$SAKUYA_SR$Quitar la marca de todos los $LOCATIONS_TAB$ extranjeros en esta [region|e]\n$SAKUYA_CL$Quitar la marca de #N todos los territorios#! poseídos por este país extranjero"
 SAKUYA_AB_CTXMENU_UNMARK_ALL_OWNED_LOCATIONS: "#n Quitar todas las marcas#!"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION: "Dejar que Sakuya anexe esta [location|e] extranjera"
 SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION_tt: "#T $SAKUYA_AB_CTXMENU_ANNEX_FOREIGN_LOCATION$#!\n\n$SAKUYA_LC$Anexar la [location|e] extranjera actual\n$SAKUYA_RC$Anexar todos los $LOCATIONS_TAB$ extranjeros en esta [provinces|e]\n$SAKUYA_SL$Anexar todos los $LOCATIONS_TAB$ extranjeros en esta [area|e]\n$SAKUYA_SR$Anexar todos los $LOCATIONS_TAB$ extranjeros en esta [region|e]\n$SAKUYA_CL$Anexar #N todos los territorios#! poseídos por este país extranjero\n\n#X Advertencia:#! esto transfiere directamente la [location|e] objetivo al jugador. Guarda la partida primero."
