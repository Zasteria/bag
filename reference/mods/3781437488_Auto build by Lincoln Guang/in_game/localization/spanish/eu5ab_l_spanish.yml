 eu5ab_cash_section_title: "Reserva del tesoro"
 eu5ab_cash_short_desc: "Saldo mínimo que debe permanecer en el tesoro."
 eu5ab_cash_label: "Reserva del tesoro"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] de oro"
 eu5ab_cash_help: "La reserva del tesoro es el saldo mínimo que debe quedar tras iniciar una construcción; no se cobra por separado. Un proyecto se bloquea si su coste reduce el tesoro por debajo de este valor. Ejemplo: con 1050 de oro, una reserva de 1000 y un coste de 100, la construcción no comienza."
 eu5ab_budget_section_title: "Presupuesto estratégico anual"
 eu5ab_budget_short_desc: "Elige una cantidad fija o un presupuesto vinculado a los ingresos mensuales; los modos son excluyentes."
 eu5ab_budget_mode_fixed: "Presupuesto fijo"
 eu5ab_budget_mode_income: "Vinculado a ingresos"
 eu5ab_budget_multiplier_4: "×4 Conservador"
 eu5ab_budget_multiplier_6: "×6 Recomendado"
 eu5ab_budget_multiplier_8: "×8 Activo"
 eu5ab_budget_effective_label: "Presupuesto del año actual"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] de oro"
 eu5ab_budget_label: "Presupuesto anual"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] de oro/año"
 eu5ab_budget_cash_comparison: "El presupuesto estratégico anual limita cuánto puede gastar este Mod al año; la reserva fija cuánto debe quedar en el tesoro. Deben cumplirse ambas condiciones."
 eu5ab_budget_reset_note: "Los modos fijo y vinculado a ingresos son excluyentes. El presupuesto se reinicia en la primera comprobación de enero y solo se descuenta cuando el proyecto entra en la cola."
 eu5ab_budget_help: "Todas las plantillas comparten un presupuesto nacional anual. Elige una cantidad fija o 4, 6 u 8 veces los ingresos mensuales totales. El presupuesto por ingresos se calcula en la primera comprobación de enero y queda fijo ese año. Los edificios usan el coste real del juego y los RGO su coste base. Solo se descuenta cuando el proyecto entra en la cola."
 eu5ab_quota_section_title: "Límite de construcciones simultáneas de este Mod"
 eu5ab_quota_short_desc: "Define cuántos proyectos civiles adicionales puede ejecutar este Mod además del espacio base."
 eu5ab_hard_cap_label: "Proyectos simultáneos adicionales"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] proyectos (el límite total es este valor + 1)"
 eu5ab_quota_help: "0 permite como máximo 1 proyecto civil activo y 599 permite 600. Solo cuentan los proyectos iniciados por este Mod que sigan en construcción; las obras manuales, carreteras y otros Mods no. Cada comprobación mensual llena solo los espacios libres, con un máximo de un proyecto por ubicación; los RGO no tienen límite mensual separado."
 eu5ab_template_cash_value: "Reserva del tesoro: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
