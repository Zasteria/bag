 eu5ab_template_intro_title: "Editor de plantillas"
 eu5ab_automation_buildings_intro: "Las prioridades de edificios de las plantillas personalizadas pueden editarse y asignarse libremente. Las plantillas temáticas son de solo lectura, pero pueden copiarse como plantillas personalizadas para editarlas."
 eu5ab_player_templates_button: "Plantillas del jugador"
 eu5ab_copy_preset_to_player_button: "Copiar como plantilla del jugador"
 eu5ab_delete_template_button: "Eliminar plantilla"
 eu5ab_delete_template_tooltip: "Elimina esta plantilla personalizada. Tras la confirmación, todas las ubicaciones que la usan también quedarán sin asignación."
 eu5ab_delete_template_confirm_prompt: "¿Eliminar la plantilla actual?"
 eu5ab_delete_template_confirm_button: "Confirmar eliminación"
 eu5ab_delete_template_confirm_tooltip: "Elimina permanentemente la plantilla actual y todos sus vínculos con ubicaciones. Las ubicaciones volverán a quedar sin asignar. Esta acción no se puede deshacer."
 eu5ab_delete_template_cancel_button: "Cancelar"
 eu5ab_delete_template_cancel_tooltip: "Cancela la eliminación y vuelve a las acciones de la plantilla."
 eu5ab_pause_template_button: "Pausar plantilla"
 eu5ab_resume_template_button: "Reanudar plantilla"
 eu5ab_template_paused_badge: " (En pausa)"
 eu5ab_pause_template_tooltip: "Pausa o reanuda temporalmente esta plantilla. Al pausarla se conservan las prioridades de edificios y los vínculos de ubicaciones, pero la construcción automatizada no la usará."
 eu5ab_select_template_tooltip: "Selecciona esta plantilla y consulta los detalles de sus reglas."
 eu5ab_preset_readonly_desc: "Esta plantilla temática de solo lectura puede pausarse, reanudarse y asignarse de forma independiente. Cópiala como plantilla personalizada para editar las prioridades de edificios. Cambia las reglas compartidas en los ajustes de mod de Community Mod Framework."
 eu5ab_template_name_pencil_hint: "Nombre de la plantilla"
 eu5ab_template_name_click_hint: "Haz clic en el nombre para cambiarlo"
 eu5ab_template_name_click_tooltip: "Introduce un nombre nuevo para la plantilla actual."
 eu5ab_template_rename_desc: "Introduce un nombre nuevo para la plantilla actual. Debido a las limitaciones de la interfaz del juego, el nombre personalizado solo se muestra durante esta sesión; las demás reglas y los vínculos de ubicaciones permanecen guardados."
 eu5ab_template_rename_input: "Nombre de la plantilla"
 eu5ab_template_rename_accept: "Confirmar"
 eu5ab_template_rename_cancel: "Cancelar"
 eu5ab_target_location_title: "Ubicación de destino"
 eu5ab_target_location_desc: "Elige una ubicación antes de borrar sus ajustes o detener las actualizaciones de la plantilla de la provincia. Para asignar una plantilla, usa los botones de selección de su tarjeta."
 eu5ab_template_editor_desc: "Configura las prioridades de edificios y la cobertura de esta plantilla. El presupuesto, el mercado, la mano de obra y las reglas de seguridad de construcción compartidos a nivel nacional se configuran en los ajustes de mod de Community Mod Framework."
 eu5ab_template_auto_save_hint: "Los cambios se guardan de inmediato. Cierra la ventana para volver."
 eu5ab_rules_tab_finance: "Finanzas y construcción"
