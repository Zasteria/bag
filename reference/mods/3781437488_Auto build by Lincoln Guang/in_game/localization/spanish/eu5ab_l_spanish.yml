 eu5ab_status_disabled: "#L Desactivado#!"
 eu5ab_status_currently_available: "#G Disponible#!"
 eu5ab_operating_rules_title: "Reglas de construcción"
 eu5ab_operating_rules_short_desc: "Configura edificios especiales, construcción de fuentes y escasez de insumos."
 eu5ab_operating_rules_help: "Los edificios especiales deben seguir cumpliendo las condiciones del juego. Si se activa la construcción de fuentes, el Mod busca un productor previo cuando la falta de insumos bloquea una fábrica. Con la protección ante escasez crítica, los proyectos con riesgo excesivo no comienzan."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Permitir que esta plantilla amplíe RGO"
 eu5ab_rgo_short_desc: "Los RGO deben cumplir las condiciones del juego y las comprobaciones de uso, presupuesto y reserva."
 eu5ab_rgo_utilization_label: "Utilización mínima"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Esta opción decide si la plantilla considera los RGO. Aun deben cumplir las reglas del juego, utilización mínima, presupuesto anual y reserva. El orden automático decide cuándo se revisan; se clasifican por escasez, precio, uso y necesidad estratégica. Desactiva la expansión automática de RGO del juego para evitar duplicados."
 eu5ab_toggle_special_buildings: "Permitir edificios especiales"
 eu5ab_toggle_auto_build_input_sources: "Construir fuentes cuando falten insumos"
 eu5ab_toggle_pause_low_workforce: "Pausar expansión si falta mano de obra"
 eu5ab_ranking_mode_section_title: "Estrategia de decisión de construcción"
 eu5ab_ranking_mode_current_label: "Modo actual"
 eu5ab_ranking_mode_composite_value: "#G Planificación de oferta y demanda#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Selección por beneficio previsto#!"
 eu5ab_ranking_mode_common_desc: "Ambas estrategias solo consideran edificios desbloqueados y construibles con prioridad superior a 0. También deben cumplir los requisitos de rendimiento, presupuesto, reserva, insumos, mano de obra y seguridad. Las emergencias alimentarias y el orden automático tienen prioridad."
 eu5ab_ranking_mode_composite_desc: "Clasifica los proyectos por escasez de mercado, necesidad estratégica, eficiencia de recetas, insumos locales, precios y riesgo laboral, favoreciendo cadenas completas y estabilidad a largo plazo."
 eu5ab_ranking_mode_actual_profit_desc: "Filtra candidatos por las reglas de la plantilla y de seguridad y elige según el beneficio mensual previsto por el juego. La prioridad de 0–10 influye suavemente cuando los beneficios son parecidos."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Esta estrategia elige solo entre 3–30 candidatos preseleccionados por ubicación y tipo actual, por lo que no garantiza el mayor beneficio global. El rendimiento y las reglas de seguridad se revisan de nuevo antes de construir. Los RGO siguen ordenándose por escasez, precio, uso y necesidad estratégica."
 eu5ab_ranking_mode_help: "Cambia la estrategia en los ajustes de mod de Community Mod Framework. La planificación de oferta y demanda favorece mercados, cadenas y estabilidad. La selección por beneficio previsto usa el beneficio mensual del juego y la prioridad 0–10 solo como influencia suave."
 eu5ab_workforce_section_title: "Mano de obra"
 eu5ab_pause_workforce_short_desc: "Controla si el riesgo laboral bloquea la expansión."
 eu5ab_job_fill_deadline_label: "Plazo para cubrir puestos"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_value: "Plazo para cubrir puestos: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_desc: "Plazo máximo para cubrir nuevos puestos, de 0 a 96 meses. 0 acepta solo la mano de obra actual. Con la pausa activada, los proyectos fuera de plazo no comienzan; sin ella, el riesgo solo reduce la prioridad."
 eu5ab_deadline_0: "0 mes"
 eu5ab_deadline_3: "3 meses"
 eu5ab_deadline_6: "6 meses"
 eu5ab_deadline_12: "12 meses"
 eu5ab_toggle_stop_input_shortage: "Detener expansión con escasez crítica de insumos"
 eu5ab_prediction_status_label: "Estimación de mano de obra"
 eu5ab_status_promotion_forecast: "#G Previsión de ascensos para el plazo elegido#!"
 eu5ab_status_conservative_fallback: "#L Estimación conservadora con la mano de obra actual#!"
 eu5ab_prediction_promotion_short_desc: "Añade trabajadores que pueden ascender a los puestos necesarios dentro del plazo, hasta 96 meses."
 eu5ab_prediction_unavailable_short_desc: "Cuando no hay una previsión fiable, usa solo los trabajadores disponibles actualmente."
 eu5ab_workforce_help: "Con la pausa activada, un proyecto no comienza si sus puestos probablemente no se cubrirán a tiempo; sin ella, el riesgo solo reduce su prioridad. La previsión de 0–96 meses suma trabajadores disponibles y personas que pueden ascender, sin suponer migración futura ni superar la población local apta."
 eu5ab_native_input_section_title: "Preferencia por insumos locales"
 eu5ab_native_input_short_desc: "Mejora la clasificación de edificios que usan materias primas de la misma provincia."
 eu5ab_native_input_priority_label: "Prioridad de insumos locales"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Prioridad de insumos locales: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Local significa la provincia del edificio. Los insumos con mayor peso en la receta dan más puntos si existe un RGO correspondiente en la provincia. 0 ignora materias primas locales, 5 es el valor predeterminado y 10 les da el mayor peso. Solo cambia la clasificación; escasez, beneficio, mano de obra y otras condiciones aún pueden elegir otro proyecto. Mal acceso al mercado, bajo control y falta de insumos reducen la bonificación; los RGO no la reciben."
 eu5ab_price_section_title: "Rango de precios"
 eu5ab_price_short_desc: "Filtra y clasifica edificios de producción por precio de mercado."
 eu5ab_price_min_label: "Precio mínimo"
 eu5ab_price_max_label: "Precio máximo"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Los precios son porcentajes del precio base. Un edificio se excluye si su producto está por debajo del mínimo y recibe bonificación de escasez por encima del máximo. La infraestructura sin producto no está limitada."
 eu5ab_active_cash_value: "Reserva del tesoro: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Precio mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Precio máximo: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Precio mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Precio máximo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Reglas de construcción automatizada"
 eu5ab_prediction_diagnostics_title: "Estimación de mano de obra y estado de construcción"
 eu5ab_prediction_section_body: "El Mod comprueba mejoras, ampliaciones normales, ampliaciones de RGO y edificios nuevos según el Orden de construcción automatizada. No pasa al tipo siguiente mientras pueda iniciar un proyecto del tipo actual. Si se prevé que se agotarán los alimentos o quedan un 25 % o menos, los proyectos alimentarios van primero e ignoran el rendimiento elegido. Una escasez grave de materiales de construcción, bienes militares en guerra o insumos estratégicos también puede eximir el rendimiento sin alterar el orden de tipos. El presupuesto anual, la reserva del tesoro, los materiales, los insumos, la mano de obra y las reglas del juego siempre se aplican. Solo se considera el nivel desbloqueado más reciente; las mejoras cuentan únicamente los empleos nuevos."
 eu5ab_diagnostics_title: "Estado de la construcción automatizada"
 eu5ab_diagnostics_snapshot_note: "Los ajustes se guardan de inmediato; el informe de construcción se actualiza tras cada comprobación mensual."
 eu5ab_diagnostics_snapshot_help: "Esta página muestra la última comprobación terminada el día 22, no datos en tiempo real. Tras cambiar ajustes o cobertura de plantillas, espera a la siguiente comprobación mensual; capacidad, inicios, rechazos y candidatos se actualizarán juntos."
