 eu5ab_regional_development__automation__ranking_name: "Estrategia de decisión de construcción"
 eu5ab_regional_development__automation__ranking_desc: "Elige la estrategia de edificios normales, ordena mejoras, ampliaciones, RGO y construcciones nuevas y ajusta la influencia de insumos locales."
 eu5ab_regional_development__candidate_ranking_mode_name: "Estrategia de edificios normales"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Elige la clasificación final tras cumplir los requisitos. La emergencia alimentaria y el Orden de construcción van primero; los RGO usan escasez, precio, uso y necesidad estratégica."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Oferta y demanda"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Clasifica los proyectos por escasez de mercado, necesidad estratégica, eficiencia de recetas, insumos locales, precios y riesgo laboral, favoreciendo cadenas completas y estabilidad a largo plazo."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Beneficio previsto"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtra candidatos por las reglas de la plantilla y de seguridad y elige según el beneficio mensual previsto por el juego. La prioridad de 0–10 influye suavemente cuando los beneficios son parecidos."
 eu5ab_regional_development__automation__candidate_priority_name: "Orden de construcción automatizada"
 eu5ab_regional_development__automation__candidate_priority_desc: "Arrastra los cuatro tipos para fijar el orden. El Mod agota los proyectos viables del tipo actual y busca alternativas antes de avanzar. En una emergencia alimentaria, los proyectos alimentarios van primero pero mantienen este orden."
 eu5ab_regional_development__candidate_priority_name: "Orden de construcción automatizada"
 eu5ab_regional_development__candidate_priority_desc: "Arrastra para ordenar mejoras, ampliaciones normales, ampliaciones de RGO y edificios nuevos."
 eu5ab_regional_development__candidate_priority_item_column_name: "Tipo de construcción"
 eu5ab_regional_development__candidate_priority_i1_name: "Mejorar edificios"
 eu5ab_regional_development__candidate_priority_i1_desc: "Sustituye un edificio obsoleto por el nivel desbloqueado más reciente de su cadena."
 eu5ab_regional_development__candidate_priority_i2_name: "Ampliar edificios existentes"
 eu5ab_regional_development__candidate_priority_i2_desc: "Añade un nivel a un edificio normal existente, sin sustituciones ni RGO."
 eu5ab_regional_development__candidate_priority_i3_name: "Ampliar ubicaciones de recursos"
 eu5ab_regional_development__candidate_priority_i3_desc: "Amplía el RGO local manteniendo uso, presupuesto anual, reserva del tesoro y otras protecciones."
 eu5ab_regional_development__candidate_priority_i4_name: "Construir edificios nuevos"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construye desde cero un edificio normal que aún no existe en la ubicación."
 eu5ab_regional_development__enabled_name: "Activar construcción automatizada"
 eu5ab_regional_development__enabled_desc: "Al desactivarlo, las plantillas y vínculos siguen guardados, pero se detiene la construcción automatizada mensual."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Proyectos simultáneos adicionales"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Proyectos civiles simultáneos además del espacio base. 0 permite 1 en total y 599 permite 600. La construcción manual, carreteras y otros Mods no cuentan."
 eu5ab_regional_development__budget_mode_name: "Modo de presupuesto anual"
 eu5ab_regional_development__budget_mode_desc: "Elige una cantidad fija o crea el fondo anual compartido como múltiplo de los ingresos mensuales totales."
 eu5ab_regional_development__budget_mode_option_1_name: "Presupuesto anual fijo"
 eu5ab_regional_development__budget_mode_option_2_name: "Ingresos mensuales ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Ingresos mensuales ×6 (recomendado)"
 eu5ab_regional_development__budget_mode_option_4_name: "Ingresos mensuales ×8"
 eu5ab_regional_development__economic_metric_name: "Métrica de rendimiento de construcción automatizada"
 eu5ab_regional_development__economic_metric_desc: "Elige el rendimiento mínimo de edificios normales: ingresos o beneficio mensual positivo, o ROI anual del 5 %. La infraestructura sin producto está exenta; los RGO usan reglas propias."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Ingresos"
 eu5ab_regional_development__economic_metric_option_1_desc: "Inicia solo si el juego prevé ingresos mensuales positivos."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Beneficio"
 eu5ab_regional_development__economic_metric_option_2_desc: "Inicia solo si el juego prevé beneficio mensual total positivo."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Rendimiento sobre ingresos"
 eu5ab_regional_development__economic_metric_option_3_desc: "Inicia solo si los ingresos mensuales previstos dan al menos un 5 % anual sobre el coste de construcción."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Rendimiento sobre beneficio"
 eu5ab_regional_development__economic_metric_option_4_desc: "Inicia solo si el beneficio mensual previsto da al menos un 5 % anual sobre el coste de construcción."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Se agotarán los alimentos: construir primero, ignorar rendimiento"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Si se agotarán los alimentos, atiende primero los proyectos alimentarios y exime el rendimiento de edificios alimentarios normales. El orden y todas las demás reglas siguen vigentes."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Alimentos al 25 % o menos: construir primero, ignorar rendimiento"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Con alimentos al 25 % o menos, atiende primero los proyectos alimentarios y exime el rendimiento de edificios alimentarios normales; las demás reglas siguen vigentes."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Suministro de construcción bajo 65 %: ignorar rendimiento"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Si un material esencial tiene menos del 65 % del suministro necesario, sus productores ignoran el rendimiento. Las demás reglas siguen vigentes."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Suministro militar en guerra bajo 65 %: ignorar rendimiento"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Durante la guerra, si un bien militar tiene menos del 65 % del suministro necesario, sus productores ignoran el rendimiento; las demás reglas siguen vigentes."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Producción estratégica sin insumos: ignorar rendimiento previo"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Si un insumo previo bajo el 65 % bloquea producción nacional alimentaria, de construcción o militar, sus productores ignoran el rendimiento; las demás reglas siguen vigentes."
 eu5ab_regional_development__fixed_annual_budget_name: "Presupuesto anual fijo"
 eu5ab_regional_development__fixed_annual_budget_desc: "Usado solo en modo fijo; todas las plantillas comparten esta cantidad."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Reserva mínima del tesoro"
 eu5ab_regional_development__min_cash_reserve_desc: "Oro que debe quedar en el tesoro tras iniciar un proyecto."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Porcentaje de precio mínimo"
 eu5ab_regional_development__price_min_desc: "La producción por debajo de este porcentaje del precio base suele considerarse excesiva."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Porcentaje de referencia de precio alto"
 eu5ab_regional_development__price_max_desc: "La producción por encima de este porcentaje del precio base recibe una bonificación de clasificación."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Permitir edificios especiales"
 eu5ab_regional_development__allow_special_buildings_desc: "Permite considerar edificios especiales; los requisitos de construcción del juego siguen vigentes."
 eu5ab_regional_development__auto_build_input_sources_name: "Construir fuentes previas con escasez"
 eu5ab_regional_development__auto_build_input_sources_desc: "Si un edificio previsto no puede empezar por falta de insumos, intenta una fuente previa permitida."
 eu5ab_regional_development__pause_low_workforce_name: "Pausar con poca mano de obra"
 eu5ab_regional_development__pause_low_workforce_desc: "No construyas si los empleos no pueden cubrirse en el periodo previsto."
 eu5ab_regional_development__stop_input_shortage_name: "Detener con escasez de insumos críticos"
 eu5ab_regional_development__stop_input_shortage_desc: "No construyas proyectos relacionados mientras los insumos críticos del mercado estén insuficientes."
 eu5ab_regional_development__allow_rgo_name: "Permitir ampliación de RGO"
 eu5ab_regional_development__allow_rgo_desc: "Permite que todas las plantillas consideren ampliar ubicaciones de recursos."
 eu5ab_regional_development__rgo_min_utilization_name: "Uso mínimo de RGO"
 eu5ab_regional_development__rgo_min_utilization_desc: "No amplíes un RGO por debajo de este uso."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Plazo para cubrir empleos (meses)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Plazo de previsión para ascensos locales a empleos nuevos."
 eu5ab_regional_development__native_input_priority_name: "Prioridad de insumos locales"
 eu5ab_regional_development__native_input_priority_desc: "0–10; los valores altos priorizan edificios que usan materias primas de la misma provincia."
 eu5ab_regional_development__performance_preset_name: "Preajuste de rendimiento"
 eu5ab_regional_development__performance_preset_desc: "Un preajuste sincroniza las opciones avanzadas siguientes. Personalizado conserva sus valores actuales."
 eu5ab_regional_development__performance_preset_option_1_name: "Conservador"
 eu5ab_regional_development__performance_preset_option_1_desc: "Comprueba hasta 10 ubicaciones al día e inicia como máximo 30 proyectos por ejecución. Candidatos de planificación: 5; de beneficio: 15. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_2_name: "Equilibrado"
 eu5ab_regional_development__performance_preset_option_2_desc: "Comprueba hasta 20 ubicaciones al día e inicia como máximo 50 proyectos por ejecución. Candidatos de planificación: 4; de beneficio: 12. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_3_name: "Rendimiento máximo"
 eu5ab_regional_development__performance_preset_option_3_desc: "Para países con muchas ubicaciones. Comprueba hasta 30 al día sin límite por ejecución. Candidatos de planificación: 3; de beneficio: 10. Se detiene al reunir suficientes."
 eu5ab_regional_development__performance_preset_option_4_name: "Personalizado"
 eu5ab_regional_development__performance_preset_option_4_desc: "Usa los ajustes avanzados actuales."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Muchas ubicaciones con plantillas pueden reducir el rendimiento."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Rendimiento máximo procesa hasta 30 ubicaciones al día sin límite de adiciones por ejecución. Muchas ubicaciones pueden ralentizar el cierre mensual."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Lentitud en Oferta y demanda: reduce Candidatos de planificación."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Solo aparece con Oferta y demanda. Menos Candidatos de planificación reduce los proyectos por ubicación y tipo enviados a comprobaciones posteriores."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Coste: menos alternativas pueden omitir proyectos viables."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Los candidatos usan el mismo orden de planificación. Un límite menor deja menos alternativas si fallan los primeros y puede no comprobar un proyecto posterior viable."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Lentitud en selección por beneficio: reduce Candidatos de beneficio."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Solo aparece con Selección por beneficio previsto. Menos Candidatos de beneficio reduce los proyectos por ubicación y tipo enviados a comprobaciones de beneficio y coste del juego."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Coste: una lista menor puede omitir edificios realmente rentables."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "La selección por beneficio prefiltra por puntuación y luego ordena por beneficio previsto. Un límite menor puede descartar un edificio rentable en el prefiltro."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "También reduce ubicaciones diarias o adiciones por ejecución."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Menos ubicaciones al día reparte el escaneo entre más días. Menos adiciones reduce comprobaciones e inicios por ejecución. También puedes cambiar el preajuste; cero significa sin límite."
 eu5ab_regional_development__parallel_location_scan_name: "Procesar ubicaciones por separado"
 eu5ab_regional_development__parallel_location_scan_desc: "Comprueba ubicaciones por separado para reducir el tiempo de una actualización. No cambia clasificación, presupuesto ni orden."
 eu5ab_regional_development__daily_location_task_limit_name: "Ubicaciones comprobadas al día"
 eu5ab_regional_development__daily_location_task_limit_desc: "Máximo de ubicaciones comprobadas en detalle al día, de 1 a 30. Valores menores reducen el procesamiento diario, pero tardan más en cubrir el país."
 eu5ab_regional_development__max_additions_per_run_name: "Adiciones máximas por ejecución"
 eu5ab_regional_development__max_additions_per_run_desc: "Limita los proyectos iniciados en una ejecución, de 0 a 600. Cero significa sin límite."
 eu5ab_regional_development__candidates_per_location_name: "Candidatos de planificación por ubicación"
 eu5ab_regional_development__candidates_per_location_desc: "Solo con Oferta y demanda. Conserva de 3 a 30 candidatos por ubicación y tipo. Más candidatos ofrecen alternativas si fallan los primeros, pero aumentan las comprobaciones."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidatos de beneficio por ubicación"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Solo con Selección por beneficio. Envía de 3 a 30 candidatos por ubicación y tipo a la comparación de beneficio del juego. Más candidatos reducen omisiones, pero aumentan comprobaciones."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Detener al encontrar suficientes candidatos"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Cuando los candidatos aptos alcancen el doble del máximo de la ejecución, deja de comprobar las ubicaciones restantes."
 eu5ab_diagnostics_cmm_hint: "Cambia las reglas compartidas en los Ajustes de mod de Community Mod Framework. El informe de construcción muestra el último resultado automatizado."
