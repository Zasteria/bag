 eu5ab_building_rules_desc: "Filtra por mano de obra en la primera fila y por era de desbloqueo en la segunda. Las prioridades van de 0,0 a 10,0; 0 desactiva la construcción. La página Especial solo muestra edificios especiales construibles en al menos una ubicación propia."
