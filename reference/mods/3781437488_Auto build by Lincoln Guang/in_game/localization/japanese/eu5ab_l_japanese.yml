 eu5ab_set_cash_reserve_0: "このMod：国庫準備金0"
 eu5ab_set_cash_reserve_0_desc: "この地点の自動建設用最低国庫準備金を0に設定します。"
 eu5ab_set_cash_reserve_500: "このMod：国庫準備金500"
 eu5ab_set_cash_reserve_500_desc: "この地点の自動建設用最低国庫準備金を500に設定します。"
 eu5ab_set_cash_reserve_1000: "このMod：国庫準備金1000"
 eu5ab_set_cash_reserve_1000_desc: "この地点の自動建設用最低国庫準備金を1000に設定します。"
 eu5ab_set_cash_reserve_2000: "このMod：国庫準備金2000"
 eu5ab_set_cash_reserve_2000_desc: "この地点の自動建設用最低国庫準備金を2000に設定します。"
 eu5ab_enable_special_buildings_for_location: "このMod：特殊建造物を許可"
 eu5ab_enable_special_buildings_for_location_desc: "選択地点で特殊建造物の自動建設・アップグレードを許可します。"
 eu5ab_disable_special_buildings_for_location: "このMod：特殊建造物を禁止"
 eu5ab_disable_special_buildings_for_location_desc: "選択地点で特殊建造物を自動建設・アップグレードしないようにします。"
 eu5ab_decouple_selected_location: "このMod：州テンプレートの追従を停止"
 eu5ab_decouple_selected_location_desc: "今後、州テンプレートを変更しても選択地点は更新されません。"
 eu5ab_clear_selected_location_policy: "このMod：地点方針を解除"
 eu5ab_clear_selected_location_policy_desc: "地点を選択し、その地点のテンプレート、準備金、建造物ルール、自動建設ルールをこのModから解除します。"
 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "全テンプレート共通の予算、建設条件、決定戦略、性能設定を行います。各テンプレートは有効状態、範囲、優先度を個別に保存します。"
 eu5ab_regional_development__general_name: "全般設定と上限"
 eu5ab_regional_development__finance_name: "財政と市場"
 eu5ab_regional_development__automation_name: "安全設定と順位"
 eu5ab_regional_development__performance_name: "性能最適化"
 eu5ab_regional_development__performance__preset_name: "性能プリセット"
 eu5ab_regional_development__performance__preset_desc: "プリセットは下の設定を連動変更します。高度な設定を手動変更すると「カスタム」になり、次回の月次確認から有効です。"
 eu5ab_regional_development__performance__advanced_name: "高度な設定"
 eu5ab_regional_development__performance__advanced_desc: "地点の確認方法と件数、1回の最大着工数、候補数、早期終了を細かく設定します。"
 eu5ab_regional_development__general__limits_name: "全般設定と同時建設上限"
 eu5ab_regional_development__general__limits_desc: "Modの有効化と、同時に管理できる民間建設プロジェクト数を設定します。"
 eu5ab_regional_development__general__returns_name: "収益条件と緊急緩和"
 eu5ab_regional_development__general__returns_desc: "通常生産建造物の最低収益と、食料・建設資材・軍需品・戦略投入品不足時の緩和を設定します。"
 eu5ab_regional_development__finance__budget_name: "共通年間予算"
 eu5ab_regional_development__finance__budget_desc: "全テンプレート、通常建造物、RGO拡張で全国共通の年間予算を使用します。"
 eu5ab_regional_development__finance__market_name: "市場価格範囲"
 eu5ab_regional_development__finance__market_desc: "基本価格に対する共通の最低価格率と高価格基準率を設定します。"
 eu5ab_regional_development__automation__safety_name: "建設安全ルール"
 eu5ab_regional_development__automation__safety_desc: "特殊建造物、上流補完、労働力、投入品不足に関する共通安全設定です。"
 eu5ab_regional_development__automation__rgo_name: "RGO拡張"
 eu5ab_regional_development__automation__rgo_desc: "RGOの共通有効設定と最低稼働率です。地点は不足、価格、稼働率、戦略需要で順位付けされます。"
 eu5ab_regional_development__automation__workforce_name: "労働力予測"
 eu5ab_regional_development__automation__workforce_desc: "新規雇用を満たすための共通予測期間です。"
 eu5ab_regional_development__automation__ranking_name: "建設判断戦略"
 eu5ab_regional_development__automation__ranking_desc: "通常建造物の戦略、アップグレード・拡張・RGO・新規建設の順序、現地投入品の影響を設定します。"
 eu5ab_regional_development__candidate_ranking_mode_name: "通常建造物の決定戦略"
 eu5ab_regional_development__candidate_ranking_mode_desc: "安全・収益条件通過後の最終順位を選びます。食料緊急と自動建設順序が優先され、RGOは不足、価格、稼働率、戦略需要で並びます。"
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "需給計画"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "市場不足、戦略需要、配合効率、現地原料、価格、労働力リスクを総合して順位付けし、完全な産業チェーンと長期安定を重視します。"
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "予測利益"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "テンプレートと安全条件で候補を絞り、ゲームが予測する月間利益で選択します。利益が近い場合は0～10の優先度が緩やかに影響します。"
 eu5ab_regional_development__automation__candidate_priority_name: "自動建設順序"
 eu5ab_regional_development__automation__candidate_priority_desc: "4種類をドラッグして順序を設定します。現在の種類で着工可能な計画をすべて試し、失敗時も同種の代案を探してから次へ進みます。食料緊急時は食料計画を先に扱いますが、この順序に従います。"
 eu5ab_regional_development__candidate_priority_name: "自動建設順序"
 eu5ab_regional_development__candidate_priority_desc: "ドラッグしてアップグレード、通常拡張、RGO拡張、新規建設を並べ替えます。"
 eu5ab_regional_development__candidate_priority_item_column_name: "建設種類"
 eu5ab_regional_development__candidate_priority_i1_name: "建造物をアップグレード"
 eu5ab_regional_development__candidate_priority_i1_desc: "旧式建造物を、アップグレード系列で解除済みの最新世代に置き換えます。"
 eu5ab_regional_development__candidate_priority_i2_name: "既存建造物を拡張"
 eu5ab_regional_development__candidate_priority_i2_desc: "既存の通常建造物にレベルを追加します。置換アップグレードとRGOは含みません。"
 eu5ab_regional_development__candidate_priority_i3_name: "資源地点を拡張"
 eu5ab_regional_development__candidate_priority_i3_desc: "現地RGOを拡張します。最低稼働率、年間予算、国庫準備金などの安全条件は維持されます。"
 eu5ab_regional_development__candidate_priority_i4_name: "新規建造物を建設"
 eu5ab_regional_development__candidate_priority_i4_desc: "その地点にまだ存在しない通常建造物を新規建設します。"
 eu5ab_regional_development__enabled_name: "自動建設を有効化"
 eu5ab_regional_development__enabled_desc: "無効にしてもテンプレートと割り当ては保存されますが、月次自動建設は停止します。"
 eu5ab_regional_development__monthly_build_hard_cap_name: "追加同時建設上限"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "基本1枠に加えて、このModが同時管理できる民間プロジェクト数です。0なら合計1件、599なら600件。手動建設、道路、他Modは数えません。"
 eu5ab_regional_development__budget_mode_name: "年間予算方式"
 eu5ab_regional_development__budget_mode_desc: "固定額、または月間国家総収入の倍率で共通年間予算を決定します。"
 eu5ab_regional_development__budget_mode_option_1_name: "固定年間予算"
 eu5ab_regional_development__budget_mode_option_2_name: "月間収入 ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "月間収入 ×6（推奨）"
 eu5ab_regional_development__budget_mode_option_4_name: "月間収入 ×8"
 eu5ab_regional_development__economic_metric_name: "自動建設の収益指標"
 eu5ab_regional_development__economic_metric_desc: "通常生産建造物に必要な収益を、月収入・月利益が正、または年率ROI 5%から選びます。産出品のないインフラは免除され、RGOは独自条件です。"
 eu5ab_regional_development__economic_metric_option_1_name: "@income! 収入"
 eu5ab_regional_development__economic_metric_option_1_desc: "ゲーム予測月収入が正の場合だけ着工します。"
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! 利益"
 eu5ab_regional_development__economic_metric_option_2_desc: "ゲーム予測月間総利益が正の場合だけ着工します。"
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! 収入ROI"
 eu5ab_regional_development__economic_metric_option_3_desc: "予測月収入の年率換算が建設費の5%以上の場合だけ着工します。"
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! 利益ROI"
 eu5ab_regional_development__economic_metric_option_4_desc: "予測月利益の年率換算が建設費の5%以上の場合だけ着工します。"
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "食料枯渇見込み：優先建設、収益無視"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "食料枯渇見込みなら食料計画を優先し、通常食料建造物の収益条件を免除します。順序と他の全条件は維持されます。"
 eu5ab_regional_development__emergency_food_stockpile_override_name: "食料25%以下：優先建設、収益無視"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "食料備蓄25%以下なら食料計画を優先し、通常食料建造物の収益条件を免除します。他の全条件は維持されます。"
 eu5ab_regional_development__emergency_construction_goods_override_name: "建設資材供給65%未満：収益無視"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "主要建設資材の供給が必要量の65%未満なら、その生産建造物の収益条件を免除します。他の条件は維持されます。"
 eu5ab_regional_development__emergency_wartime_military_override_name: "戦時軍需供給65%未満：収益無視"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "戦時に軍需品供給が必要量の65%未満なら、その生産建造物の収益条件を免除します。他の条件は維持されます。"
 eu5ab_regional_development__emergency_strategic_input_override_name: "戦略生産の原料不足：上流収益を無視"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "供給65%未満の上流品不足で国内の食料・建設・軍需生産が止まった場合、その上流生産建造物の収益条件を免除します。他の条件は維持されます。"
 eu5ab_regional_development__fixed_annual_budget_name: "固定年間予算"
 eu5ab_regional_development__fixed_annual_budget_desc: "固定予算方式だけで使用し、全テンプレートがこの額を共有します。"
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "最低国庫準備金"
 eu5ab_regional_development__min_cash_reserve_desc: "プロジェクト着工後も国庫に残す必要がある資金です。"
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "最低価格率"
 eu5ab_regional_development__price_min_desc: "産出品が基本価格のこの割合を下回ると、通常は供給過剰と判定します。"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "高価格基準率"
 eu5ab_regional_development__price_max_desc: "産出品が基本価格のこの割合を超えると、順位加点を得ます。"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "特殊建造物を許可"
 eu5ab_regional_development__allow_special_buildings_desc: "特殊建造物を候補に含めます。ゲーム本来の建設条件は維持されます。"
 eu5ab_regional_development__auto_build_input_sources_name: "不足時に上流産業を建設"
 eu5ab_regional_development__auto_build_input_sources_desc: "計画建造物が原料不足で着工できない場合、許可された上流供給源の建設を試みます。"
 eu5ab_regional_development__pause_low_workforce_name: "労働力不足時に停止"
 eu5ab_regional_development__pause_low_workforce_desc: "予測期間内に新規雇用を満たせないプロジェクトは着工しません。"
 eu5ab_regional_development__stop_input_shortage_name: "重要投入品不足時に停止"
 eu5ab_regional_development__stop_input_shortage_desc: "重要な市場投入品が供給不足の間、関連プロジェクトを着工しません。"
 eu5ab_regional_development__allow_rgo_name: "RGO拡張を許可"
 eu5ab_regional_development__allow_rgo_desc: "全テンプレートで資源地点の拡張を候補に含めます。"
 eu5ab_regional_development__rgo_min_utilization_name: "RGO最低稼働率"
 eu5ab_regional_development__rgo_min_utilization_desc: "稼働率がこの値未満のRGOは拡張しません。"
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "雇用充足期限（月）"
 eu5ab_regional_development__job_fill_deadline_months_desc: "現地人口が新規雇用階層へ昇格するまでの予測期間です。"
 eu5ab_regional_development__native_input_priority_name: "現地原料優先度"
 eu5ab_regional_development__native_input_priority_desc: "0～10。高いほど同じ州の原料を使う建造物が優先されます。"
 eu5ab_regional_development__performance_preset_name: "性能プリセット"
 eu5ab_regional_development__performance_preset_desc: "プリセットは下の高度な設定を同期します。「カスタム」は現在値を維持します。"
 eu5ab_regional_development__performance_preset_option_1_name: "保守的"
 eu5ab_regional_development__performance_preset_option_1_desc: "1日最大10地点、1回最大30件。計画候補5件、利益候補15件。候補が十分なら残りの確認を停止します。"
 eu5ab_regional_development__performance_preset_option_2_name: "平衡的"
 eu5ab_regional_development__performance_preset_option_2_desc: "1日最大20地点、1回最大50件。計画候補4件、利益候補12件。候補が十分なら残りの確認を停止します。"
 eu5ab_regional_development__performance_preset_option_3_name: "処理量優先"
 eu5ab_regional_development__performance_preset_option_3_desc: "適用地点が多い国家向け。1日最大30地点、1回の着工数は無制限。計画候補3件、利益候補10件。候補が十分なら停止します。"
 eu5ab_regional_development__performance_preset_option_4_name: "カスタム"
 eu5ab_regional_development__performance_preset_option_4_desc: "現在の高度な設定を使用します。"
 eu5ab_regional_development__performance_throughput_warning_summary_name: "テンプレート適用地点が多いと性能が低下する場合があります。"
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "処理量優先は1日最大30地点を処理し、1回の追加数は無制限です。地点が多いと月次処理が重くなる場合があります。"
 eu5ab_regional_development__performance_throughput_warning_action_name: "需給計画が重い場合：計画候補数を減らす。"
 eu5ab_regional_development__performance_throughput_warning_action_desc: "需給計画でのみ表示。計画候補数を減らすと、地点・通常建設種類ごとに後続確認へ送る件数が減ります。"
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "注意：代案が減り、後続の実行可能計画を見落とす場合があります。"
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "候補は同じ計画スコア順です。上限を下げると上位失敗時の代案が減り、後続の着工可能計画を確認しない場合があります。"
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "予測利益選定が重い場合：利益候補数を減らす。"
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "予測利益選定でのみ表示。利益候補数を減らすと、地点・通常建設種類ごとにゲームの利益・費用確認へ送る件数が減ります。"
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "注意：候補を減らすと、実際に高利益の建造物を見落とす場合があります。"
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "利益戦略は計画スコアで粗選別してから予測利益で並べます。上限を下げると高利益建造物が粗選別で除外される可能性が上がります。"
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "1日の確認地点数や1回の追加数も減らせます。"
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "1日の地点数を減らすと全国確認を多日に分散します。1回の追加数を減らすと確認と着工が減ります。プリセット変更も可能で、追加数0は無制限です。"
 eu5ab_regional_development__parallel_location_scan_name: "地点を個別処理"
 eu5ab_regional_development__parallel_location_scan_desc: "1回の処理時間を短くするため地点を個別確認します。順位、予算、建設順序は変わりません。"
 eu5ab_regional_development__daily_location_task_limit_name: "1日の確認地点上限"
 eu5ab_regional_development__daily_location_task_limit_desc: "1日に詳細確認する地点数（1～30）。小さいほど日々の負荷は減りますが、全国確認に時間がかかります。"
 eu5ab_regional_development__max_additions_per_run_name: "1回の最大追加数"
 eu5ab_regional_development__max_additions_per_run_desc: "1回で着工できる最大数（0～600）。0は無制限です。"
 eu5ab_regional_development__candidates_per_location_name: "地点ごとの計画候補数"
 eu5ab_regional_development__candidates_per_location_desc: "需給計画のみ。地点・通常建設種類ごとに3～30件を保持します。多いほど上位失敗時の代案が増えますが、確認回数も増えます。"
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "地点ごとの利益候補数"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "予測利益選定のみ。地点・通常建設種類ごとに3～30件をゲーム利益比較へ送ります。多いほど見落としは減りますが、確認回数が増えます。"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "候補が十分なら確認を停止"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "合格候補が今回最大着工数の2倍に達したら、残りの地点確認を停止します。"
 eu5ab_diagnostics_cmm_hint: "共通ルールはCommunity Mod FrameworkのMod設定で変更します。建設レポートには最新の自動建設結果が表示されます。"
