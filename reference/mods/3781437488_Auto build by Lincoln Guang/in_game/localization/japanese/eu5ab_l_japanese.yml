 eu5ab_automation_buildings_tab_desc: "テンプレート、建造物の優先度、適用範囲を管理します。全テンプレート共通のルールはCommunity Mod FrameworkのMod設定で変更します。"
 eu5ab_action_bar_name: "Advanced Auto Build"
 eu5ab_action_bar_tooltip: "地域開発テンプレート画面を開き、建造物の優先度と適用範囲を設定して、最新の自動建設レポートを確認します。"
 eu5ab_action_bar_icon: "@production_panel!"
 eu5ab_action_bar_color: "gold"
 eu5ab_template_overview_title: "地域開発テンプレート"
 eu5ab_presets_tab: "テーマテンプレート"
 eu5ab_presets_tab_tooltip: "さまざまな開発目標に対応する読み取り専用の建造物優先度です。"
 eu5ab_custom_tab: "カスタムテンプレート"
 eu5ab_custom_tab_tooltip: "建造物の優先度と適用範囲を自由に設定します。"
 eu5ab_sidebar_title: "テンプレート"
 eu5ab_detail_title: "ルール詳細"
 eu5ab_new_template_plus_button: "+ 新規テンプレート"
 eu5ab_new_blank_template_button: "+ 空のテンプレート"
 eu5ab_new_recommended_template_button: "+ おすすめテンプレート"
 eu5ab_custom_empty_detail: "左の一覧からカスタムテンプレートを選択するか、空のテンプレートまたはおすすめ優先度を基にしたテンプレートを作成してください。"
 eu5ab_template_intro_title: "テンプレート編集"
 eu5ab_automation_buildings_intro: "カスタムテンプレートは建造物の優先度を自由に編集して割り当てられます。テーマテンプレートは読み取り専用ですが、カスタムテンプレートとしてコピーして編集できます。"
 eu5ab_player_templates_button: "プレイヤーテンプレート"
 eu5ab_copy_preset_to_player_button: "プレイヤーテンプレートとしてコピー"
 eu5ab_delete_template_button: "テンプレートを削除"
 eu5ab_delete_template_tooltip: "このカスタムテンプレートを削除します。確認後、このテンプレートを使用しているすべての地点も割り当て解除されます。"
 eu5ab_delete_template_confirm_prompt: "現在のテンプレートを削除しますか？"
 eu5ab_delete_template_confirm_button: "削除を確定"
 eu5ab_delete_template_confirm_tooltip: "現在のテンプレートとそのすべての地点割り当てを完全に削除します。地点は未割り当て状態に戻ります。この操作は元に戻せません。"
 eu5ab_delete_template_cancel_button: "キャンセル"
 eu5ab_delete_template_cancel_tooltip: "削除を取り消してテンプレート操作に戻ります。"
 eu5ab_pause_template_button: "テンプレートを一時停止"
 eu5ab_resume_template_button: "テンプレートを再開"
 eu5ab_template_paused_badge: "（一時停止中）"
 eu5ab_pause_template_tooltip: "このテンプレートを一時停止または再開します。一時停止しても建造物の優先度と地点の割り当ては保持されますが、自動建設では使用されません。"
 eu5ab_select_template_tooltip: "このテンプレートを選択してルールの詳細を表示します。"
 eu5ab_preset_readonly_desc: "この読み取り専用のテーマテンプレートは個別に一時停止、再開、割り当てができます。建造物の優先度を編集するにはカスタムテンプレートとしてコピーしてください。共通ルールはCommunity Mod FrameworkのMod設定で変更します。"
 eu5ab_template_name_pencil_hint: "テンプレート名"
 eu5ab_template_name_click_hint: "名前をクリックして変更"
 eu5ab_template_name_click_tooltip: "現在のテンプレートに新しい名前を入力します。"
 eu5ab_template_rename_desc: "現在のテンプレートに新しい名前を入力します。ゲームのインターフェース制限により、カスタム名は現在のセッション中のみ表示されますが、その他のルールと地点の割り当ては保存されます。"
 eu5ab_template_rename_input: "テンプレート名"
 eu5ab_template_rename_accept: "確定"
 eu5ab_template_rename_cancel: "キャンセル"
 eu5ab_target_location_title: "対象地点"
 eu5ab_target_location_desc: "設定の消去や州テンプレートとの連動停止を行う前に地点を選択してください。テンプレートを割り当てるには、対応するテンプレートカードの選択ボタンを使用します。"
 eu5ab_template_editor_desc: "このテンプレートの建造物優先度と適用範囲を設定します。全国共通の予算、市場、労働力、建設安全ルールはCommunity Mod FrameworkのMod設定で設定します。"
 eu5ab_template_auto_save_hint: "変更はすぐに保存されます。ウィンドウを閉じると戻ります。"
 eu5ab_rules_tab_finance: "財政と建設"
 eu5ab_rules_tab_automation: "労働力と建設方針"
 eu5ab_rules_tab_diagnostics: "建設レポート"
 eu5ab_template_editor_sections_title: "テンプレート設定"
 eu5ab_template_editor_sections_desc: "各テンプレートは有効状態、適用範囲、建造物優先度を個別に保存します。最新の月次結果は建設レポートで確認できます。"
 eu5ab_open_buildings_editor_button: "建築ルール"
 eu5ab_open_rules_editor_button: "建設レポート"
 eu5ab_edit_template_button: "編集"
 eu5ab_copy_to_slot_button: "ここにコピー"
 eu5ab_policy_section_title: "テンプレートルール"
 eu5ab_cash_section_title: "国庫準備金"
 eu5ab_cash_short_desc: "国庫に残す必要がある最低残高です。"
 eu5ab_cash_label: "国庫準備金"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] ゴールド"
 eu5ab_cash_help: "国庫準備金は建設開始後も残す必要がある最低残高で、別途徴収される費用ではありません。費用を差し引いた残高がこの値を下回る場合、プロジェクトは拒否されます。例：国庫1,050、準備金1,000、費用100なら建設は開始されません。"
 eu5ab_budget_section_title: "年間戦略予算"
 eu5ab_budget_short_desc: "固定額または月間総収入連動の予算を選びます。両方を同時には使用できません。"
 eu5ab_budget_mode_fixed: "固定予算"
 eu5ab_budget_mode_income: "収入連動"
 eu5ab_budget_multiplier_4: "×4 保守的"
 eu5ab_budget_multiplier_6: "×6 おすすめ"
 eu5ab_budget_multiplier_8: "×8 積極的"
 eu5ab_budget_effective_label: "今年度予算"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] ゴールド"
 eu5ab_budget_label: "年間予算"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] ゴールド/年"
 eu5ab_budget_cash_comparison: "年間戦略予算はこのModが1年に使用できる上限を、準備金は国庫に残す最低額を定めます。両方の条件を満たす必要があります。"
 eu5ab_budget_reset_note: "固定額と収入連動は同時に使用できません。毎年1月の最初の確認時にリセットされ、プロジェクトがキューに入った後にのみ差し引かれます。"
 eu5ab_budget_help: "すべてのテンプレートは国全体の年間予算を共有します。固定額または月間総収入の4、6、8倍を選びます。収入連動予算は1月の最初の確認で算出され、その年は固定されます。通常建造物はゲーム上の費用、RGOは基本費用を使用し、プロジェクトがキューに入った後にのみ予算が差し引かれます。"
 eu5ab_quota_section_title: "このModの同時建設上限"
 eu5ab_quota_short_desc: "基本の1件に加えて、このModが同時に進められる民間プロジェクト数を設定します。"
 eu5ab_hard_cap_label: "追加同時プロジェクト"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] 件（総上限はこの値 + 1）"
 eu5ab_quota_help: "0なら有効な民間プロジェクトは最大1件、599なら最大600件です。このModが開始し建設中のものだけを数え、手動建設、道路、他のModは含みません。月次確認では空き枠だけを補充し、1地点につき同時に最大1件です。RGOに別の月間上限はありません。"
 eu5ab_template_cash_value: "国庫準備金：[GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_step_dec_10k: "-10K"
 eu5ab_step_dec_1k: "-1K"
 eu5ab_step_inc_1k: "+1K"
 eu5ab_step_inc_10k: "+10K"
 eu5ab_step_dec_10: "-10"
 eu5ab_step_dec_1: "-1"
 eu5ab_step_inc_1: "+1"
 eu5ab_step_inc_10: "+10"
 eu5ab_step_dec_5: "-5"
 eu5ab_step_inc_5: "+5"
 eu5ab_step_dec_100: "-100"
 eu5ab_step_inc_100: "+100"
 eu5ab_building_rules_title: "建造物ルール"
 eu5ab_building_rules_desc: "1行目で就業階層、2行目で解禁時代を絞り込みます。優先度は0.0～10.0で、0は建設禁止です。特殊ページには、自国領の少なくとも1地点で建設条件を満たす特殊建造物だけが表示されます。"
 eu5ab_allow_button: "許可"
 eu5ab_ban_button: "禁止"
 eu5ab_priority_decrease: "−"
 eu5ab_priority_increase: "+"
 eu5ab_priority_decrease_default_tt: "優先度を0.1下げる"
 eu5ab_priority_decrease_ctrl_tt: "Ctrl：優先度を0.5下げる"
 eu5ab_priority_decrease_shift_tt: "Shift：優先度を1.0下げる"
 eu5ab_priority_increase_default_tt: "優先度を0.1上げる"
 eu5ab_priority_increase_ctrl_tt: "Ctrl：優先度を0.5上げる"
 eu5ab_priority_increase_shift_tt: "Shift：優先度を1.0上げる"
 eu5ab_priority_scale_hint: "0で禁止"
 eu5ab_clear_visible_priorities_button: "現在の一覧をすべて0にする"
 eu5ab_clear_visible_priorities_tooltip: "現在のフィルターで表示されているすべての建造物の優先度を0にして保存します。非表示の建造物には影響しません。"
 eu5ab_priority_low: "低"
 eu5ab_priority_medium: "中"
 eu5ab_priority_high: "高"
 eu5ab_priority_high_icon: "↑"
 eu5ab_priority_medium_icon: "–"
 eu5ab_priority_low_icon: "↓"
 eu5ab_ban_icon: "×"
 eu5ab_filter_all: "すべて"
 eu5ab_filter_rural: "農村"
 eu5ab_filter_laborers: "労働者"
 eu5ab_filter_burghers: "市民"
 eu5ab_filter_soldiers: "軍事"
 eu5ab_filter_special: "特殊"
 eu5ab_age_all: "すべての時代"
 eu5ab_building_age_1: "伝統の時代"
 eu5ab_building_age_2: "ルネサンスの時代"
 eu5ab_building_age_3: "大航海時代"
 eu5ab_building_age_4: "宗教改革の時代"
 eu5ab_building_age_5: "絶対主義の時代"
 eu5ab_building_age_6: "革命の時代"
 eu5ab_status_enabled: "#G 有効#!"
 eu5ab_status_disabled: "#L 無効#!"
 eu5ab_status_currently_available: "#G 利用可能#!"
 eu5ab_operating_rules_title: "自動建設ルール"
 eu5ab_operating_rules_short_desc: "特殊建造物、上流補完、投入品不足のルールを設定します。"
 eu5ab_operating_rules_help: "特殊建造物もゲーム本来の条件を満たす必要があります。上流補完を有効にすると、投入品不足で工場が建てられない場合に対応する供給元を探します。重大な投入品不足で停止を有効にすると、危険の高いプロジェクトは開始されません。"
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "このテンプレートでRGO拡張を許可"
 eu5ab_rgo_short_desc: "RGOはゲーム条件、稼働率、予算、準備金の確認を通過する必要があります。"
 eu5ab_rgo_utilization_label: "最低稼働率"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "この設定はテンプレートがRGOを検討するかを決めます。RGOもゲーム条件、最低稼働率、年間予算、準備金を満たす必要があります。自動建設順序が確認時期を決め、不足、価格、稼働率、戦略需要で順位付けします。重複を避けるため原版のRGO自動拡張は無効にしてください。"
 eu5ab_toggle_special_buildings: "特殊建造物を許可"
 eu5ab_toggle_auto_build_input_sources: "投入品不足時に上流を自動建設"
 eu5ab_toggle_pause_low_workforce: "労働力不足時に拡張を停止"
 eu5ab_ranking_mode_section_title: "建設判断戦略"
 eu5ab_ranking_mode_current_label: "現在のモード"
 eu5ab_ranking_mode_composite_value: "#G 需給計画#!"
 eu5ab_ranking_mode_actual_profit_value: "#G 予測利益による選択#!"
 eu5ab_ranking_mode_common_desc: "両戦略とも、解禁済みで建設可能かつ優先度が0より大きい建造物だけを検討します。収益、予算、準備金、投入品、労働力などの安全条件も満たす必要があります。食料緊急対応と自動建設順序が常に優先されます。"
 eu5ab_ranking_mode_composite_desc: "市場不足、戦略需要、配合効率、現地原料、価格、労働力リスクを総合して順位付けし、完全な産業チェーンと長期安定を重視します。"
 eu5ab_ranking_mode_actual_profit_desc: "テンプレートと安全条件で候補を絞り、ゲームが予測する月間利益で選択します。利益が近い場合は0～10の優先度が緩やかに影響します。"
 eu5ab_ranking_mode_actual_profit_scope_desc: "この戦略は地点と現在の建設種類ごとに事前選抜された3～30件から選ぶため、世界全体で最高利益とは限りません。着工直前に収益と安全条件を再確認します。RGOは引き続き不足、価格、稼働率、戦略需要で順位付けします。"
 eu5ab_ranking_mode_help: "Community Mod FrameworkのMod設定で戦略を切り替えます。需給計画は市場、産業チェーン、安定性を重視します。予測利益選択はゲームの月間利益を使い、0～10の優先度は緩やかな補正だけを行います。"
 eu5ab_workforce_section_title: "労働力"
 eu5ab_pause_workforce_short_desc: "労働力リスクが拡張を直接止めるかを設定します。"
 eu5ab_job_fill_deadline_label: "雇用充足期限"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0]か月"
 eu5ab_job_fill_deadline_value: "雇用充足期限：[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0]か月"
 eu5ab_job_fill_deadline_desc: "新規雇用が満たされるまで待つ最長期間で、0～96か月です。0は現在の労働力だけで充足できる場合に限ります。停止を有効にすると期限超過のプロジェクトは開始されず、無効なら優先度だけが下がります。"
 eu5ab_deadline_0: "0か月"
 eu5ab_deadline_3: "3か月"
 eu5ab_deadline_6: "6か月"
 eu5ab_deadline_12: "12か月"
 eu5ab_toggle_stop_input_shortage: "重要投入品不足時に拡張を停止"
 eu5ab_prediction_status_label: "労働力推定方法"
 eu5ab_status_promotion_forecast: "#G 選択期間の昇進予測#!"
 eu5ab_status_conservative_fallback: "#L 現在の労働力による保守的推定#!"
 eu5ab_prediction_promotion_short_desc: "現在利用可能な労働力に、最長96か月の期限内に必要な職へ昇進できる人口を加えます。"
 eu5ab_prediction_unavailable_short_desc: "信頼できる予測ができない場合、現在利用可能な人数だけで保守的に判断します。"
 eu5ab_workforce_help: "停止を有効にすると、期限内に新規雇用を満たせないと予測されるプロジェクトは開始されません。無効なら優先度だけが下がります。0～96か月の予測は現在の空き労働力と昇進可能人口を加算し、将来の移住を仮定せず、現地の適格人口を超えません。"
 eu5ab_native_input_section_title: "現地原料の優先"
 eu5ab_native_input_short_desc: "同じ州に存在する原料を使う生産建造物の順位を上げます。"
 eu5ab_native_input_priority_label: "現地原料優先度"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "現地原料優先度：[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "「現地」は建造物がある州を指します。配合で比重の高い原料ほど、同じ州に対応するRGOがある場合の加点が大きくなります。0は現地原料を無視、5は既定値、10は最大重視です。順位だけを変えるため、不足、利益、労働力などで別のプロジェクトが選ばれる場合があります。市場接続、支配力、投入品不足は加点を下げ、RGO自体は対象外です。"
 eu5ab_price_section_title: "価格範囲"
 eu5ab_price_short_desc: "市場価格で生産建造物を絞り込み、順位付けします。"
 eu5ab_price_min_label: "最低価格"
 eu5ab_price_max_label: "最高価格"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "価格は基本価格に対する割合です。産出品が最低値未満なら候補から除外され、最高値を超えると不足加点を得ます。産出品のないインフラは制限されません。"
 eu5ab_active_cash_value: "国庫準備金：[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "最低価格：[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "最高価格：[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "最低価格：[GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "最高価格：[GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "自動建設ルール"
 eu5ab_prediction_diagnostics_title: "労働力推定と建設状況"
 eu5ab_prediction_section_body: "Modは「自動建設順序」に従い、アップグレード、通常拡張、RGO拡張、新規建設を確認します。現在の種類で着工可能な計画がある間は次へ進みません。食料が枯渇見込み、または備蓄25%以下なら食料計画を優先し、選択した収益条件を免除します。建設資材、戦時軍需品、戦略生産の上流投入品が深刻に不足した場合も、種類の順序を変えずに該当建造物の収益条件を緩和できます。年間予算、国庫準備金、資材、投入品、労働力、ゲーム本来の建設条件は常に適用されます。解除済みの最新世代だけを対象とし、アップグレードでは増加する雇用だけを数えます。"
 eu5ab_diagnostics_title: "自動建設状況"
 eu5ab_diagnostics_snapshot_note: "設定は即時保存され、建設レポートは毎月の確認後に更新されます。"
 eu5ab_diagnostics_snapshot_help: "このページは毎月22日に完了した最新の確認結果であり、リアルタイム表示ではありません。設定やテンプレート範囲を変更した後は次回の月次確認を待ってください。建設枠、着工、除外理由、候補がまとめて更新されます。"
 eu5ab_diag_overview_title: "月間建設概要"
 eu5ab_diag_quota_title: "今回の建設枠"
