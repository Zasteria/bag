 eu5ab_status_currently_available: "#G Dostępne#!"
 eu5ab_operating_rules_title: "Reguły budowy"
 eu5ab_operating_rules_short_desc: "Skonfiguruj budynki specjalne, budowę źródeł i niedobory surowców."
 eu5ab_operating_rules_help: "Budynki specjalne nadal muszą spełniać warunki gry. Po włączeniu budowy źródeł mod szuka producenta wyższego szczebla, gdy brak surowca blokuje fabrykę. Ochrona przed krytycznym niedoborem zatrzymuje projekty o nadmiernym ryzyku surowcowym."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Zezwól temu szablonowi rozwijać RGO"
 eu5ab_rgo_short_desc: "RGO muszą spełnić warunki gry oraz wymogi wykorzystania, budżetu i rezerwy."
 eu5ab_rgo_utilization_label: "Minimalne wykorzystanie"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Ta opcja określa, czy szablon uwzględnia RGO. Nadal muszą spełniać reguły gry, minimalne wykorzystanie, budżet roczny i rezerwę. Automatyczna kolejność określa czas kontroli, a ranking opiera się na niedoborze, cenie, wykorzystaniu i potrzebie strategicznej. Wyłącz automatyczną rozbudowę RGO w grze, aby uniknąć podwójnego planowania."
 eu5ab_toggle_special_buildings: "Zezwól na budynki specjalne"
 eu5ab_toggle_auto_build_input_sources: "Buduj źródła przy braku surowców"
 eu5ab_toggle_pause_low_workforce: "Wstrzymaj rozbudowę przy braku siły roboczej"
 eu5ab_ranking_mode_section_title: "Strategia decyzji budowlanych"
 eu5ab_ranking_mode_current_label: "Bieżący tryb"
 eu5ab_ranking_mode_composite_value: "#G Planowanie podaży i popytu#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Wybór według przewidywanego zysku#!"
 eu5ab_ranking_mode_common_desc: "Obie strategie uwzględniają tylko odblokowane i możliwe do zbudowania budynki z priorytetem powyżej 0. Muszą też spełniać wymogi zwrotu, budżetu, rezerwy, surowców, siły roboczej i bezpieczeństwa. Kryzysy żywnościowe i automatyczna kolejność mają pierwszeństwo."
 eu5ab_ranking_mode_composite_desc: "Ocenia projekty według niedoborów rynkowych, potrzeb strategicznych, wydajności receptur, lokalnych surowców, cen i ryzyka siły roboczej, premiując pełne łańcuchy i stabilność długoterminową."
 eu5ab_ranking_mode_actual_profit_desc: "Filtruje kandydatów według reguł szablonu i bezpieczeństwa, a następnie wybiera według przewidywanego przez grę zysku miesięcznego. Priorytet 0–10 ma niewielki wpływ przy zbliżonych zyskach."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Strategia wybiera tylko spośród 3–30 kandydatów wstępnie wybranych dla lokacji i bieżącego typu, więc nie gwarantuje najwyższego zysku globalnego. Zwrot i reguły bezpieczeństwa są ponownie sprawdzane przed budową. RGO nadal ocenia się według niedoboru, ceny, wykorzystania i potrzeb strategicznych."
 eu5ab_ranking_mode_help: "Zmień strategię w ustawieniach moda Community Mod Framework. Planowanie podaży i popytu premiuje rynki, łańcuchy i stabilność. Wybór według zysku używa przewidywanego zysku miesięcznego, a priorytet 0–10 ma tylko łagodny wpływ."
 eu5ab_workforce_section_title: "Siła robocza"
 eu5ab_pause_workforce_short_desc: "Określa, czy ryzyko siły roboczej blokuje rozbudowę."
 eu5ab_job_fill_deadline_label: "Termin obsadzenia miejsc pracy"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] mies."
 eu5ab_job_fill_deadline_value: "Termin obsadzenia: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] mies."
 eu5ab_job_fill_deadline_desc: "Maksymalny czas oczekiwania na obsadzenie nowych miejsc pracy: 0–96 miesięcy. 0 dopuszcza tylko obecną siłę roboczą. Przy wstrzymaniu projekty przekraczające termin nie ruszą; bez niego ryzyko jedynie obniża priorytet."
 eu5ab_deadline_0: "0 mies."
 eu5ab_deadline_3: "3 mies."
 eu5ab_deadline_6: "6 mies."
 eu5ab_deadline_12: "12 mies."
 eu5ab_toggle_stop_input_shortage: "Zatrzymaj rozbudowę przy krytycznym niedoborze surowców"
 eu5ab_prediction_status_label: "Szacunek siły roboczej"
 eu5ab_status_promotion_forecast: "#G Prognoza awansu dla wybranego okresu#!"
 eu5ab_status_conservative_fallback: "#L Ostrożny szacunek obecnej siły roboczej#!"
 eu5ab_prediction_promotion_short_desc: "Dodaje pracowników, którzy mogą awansować do wymaganych zawodów w terminie do 96 miesięcy."
 eu5ab_prediction_unavailable_short_desc: "Gdy brak wiarygodnej prognozy, uwzględnia tylko obecnie dostępnych pracowników."
 eu5ab_workforce_help: "Przy wstrzymaniu projekt nie rusza, jeśli stanowiska prawdopodobnie nie zostaną obsadzone na czas; bez niego ryzyko tylko obniża priorytet. Prognoza 0–96 miesięcy dodaje dostępnych pracowników i osoby mogące awansować, bez zakładania migracji i bez przekraczania lokalnej uprawnionej ludności."
 eu5ab_native_input_section_title: "Preferencja lokalnych surowców"
 eu5ab_native_input_short_desc: "Podnosi ranking budynków używających surowców z tej samej prowincji."
 eu5ab_native_input_priority_label: "Priorytet lokalnych surowców"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorytet lokalnych surowców: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Lokalne oznacza prowincję budynku. Surowce o większym udziale w recepturze dają więcej punktów, gdy w prowincji istnieje odpowiednie RGO. 0 ignoruje lokalne surowce, 5 jest domyślne, a 10 daje największą wagę. Zmienia to tylko ranking; niedobór, zysk, siła robocza i inne warunki mogą wybrać inny projekt. Słaby dostęp do rynku, niska kontrola i niedobór surowców zmniejszają premię; RGO jej nie otrzymują."
 eu5ab_price_section_title: "Zakres cen"
 eu5ab_price_short_desc: "Filtruje i klasyfikuje budynki produkcyjne według ceny rynkowej."
 eu5ab_price_min_label: "Cena minimalna"
 eu5ab_price_max_label: "Cena maksymalna"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Ceny są procentem ceny bazowej. Budynek jest wykluczany poniżej ceny minimalnej i otrzymuje premię niedoboru powyżej maksymalnej. Infrastruktura bez produktu nie podlega zakresowi."
 eu5ab_active_cash_value: "Rezerwa skarbca: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Cena minimalna: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Cena maksymalna: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Cena minimalna: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Cena maksymalna: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Reguły automatycznej budowy"
 eu5ab_prediction_diagnostics_title: "Szacunek siły roboczej i stan budowy"
 eu5ab_prediction_section_body: "Mod sprawdza ulepszenia, zwykłe rozbudowy, rozbudowy RGO i nowe budynki zgodnie z Kolejnością automatycznej budowy. Nie przechodzi do kolejnego typu, dopóki może rozpocząć projekt obecnego typu. Gdy żywność ma się wyczerpać lub zapasy spadną do 25% albo niżej, projekty żywnościowe są obsługiwane najpierw i nie muszą spełniać wybranego zwrotu. Poważny niedobór materiałów budowlanych, dóbr wojskowych podczas wojny lub strategicznych nakładów może także złagodzić wymóg zwrotu, bez zmiany kolejności typów. Roczny budżet, rezerwa skarbca, materiały, nakłady, siła robocza i zasady gry obowiązują zawsze. Uwzględniany jest tylko najnowszy odblokowany poziom, a przy ulepszeniu liczą się tylko nowe miejsca pracy."
 eu5ab_diagnostics_title: "Stan automatycznej budowy"
 eu5ab_diagnostics_snapshot_note: "Ustawienia są zapisywane od razu; raport budowy aktualizuje się po każdej comiesięcznej kontroli."
 eu5ab_diagnostics_snapshot_help: "Ta strona pokazuje ostatnią kontrolę ukończoną 22. dnia miesiąca, a nie dane na żywo. Po zmianie ustawień lub zasięgu szablonów poczekaj na następną kontrolę; przepustowość, rozpoczęcia, odrzucenia i kandydaci zaktualizują się razem."
 eu5ab_diag_overview_title: "Miesięczny przegląd budowy"
 eu5ab_diag_quota_title: "Przepustowość tej kontroli"
 eu5ab_diag_result_title: "Projekty rozpoczęte w tej kontroli"
