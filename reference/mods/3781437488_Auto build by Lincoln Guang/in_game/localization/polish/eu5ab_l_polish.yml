 eu5ab_template_conflict_replace_desc: "Wybór pokazuje tylko lokacje bez szablonu tego moda. Istniejące przypisania w prowincji lub obszarze nie są zastępowane."
 eu5ab_open_panel_tooltip: "Otwórz panel polityki rozwoju regionalnego."
 eu5ab_open_regional_development_policy: "Ten mod: sterowanie automatyczną budową"
 eu5ab_open_regional_development_policy_desc: "Wybierz Zaawansowaną automatyczną budowę w Ustawieniach moda Community Mod Framework."
 eu5ab_set_cash_reserve_0: "Ten mod: rezerwa skarbca 0"
 eu5ab_set_cash_reserve_0_desc: "Ustaw minimalną rezerwę skarbca dla automatycznej budowy tej lokacji na 0."
 eu5ab_set_cash_reserve_500: "Ten mod: rezerwa skarbca 500"
 eu5ab_set_cash_reserve_500_desc: "Ustaw minimalną rezerwę skarbca dla automatycznej budowy tej lokacji na 500."
 eu5ab_set_cash_reserve_1000: "Ten mod: rezerwa skarbca 1000"
 eu5ab_set_cash_reserve_1000_desc: "Ustaw minimalną rezerwę skarbca dla automatycznej budowy tej lokacji na 1000."
 eu5ab_set_cash_reserve_2000: "Ten mod: rezerwa skarbca 2000"
 eu5ab_set_cash_reserve_2000_desc: "Ustaw minimalną rezerwę skarbca dla automatycznej budowy tej lokacji na 2000."
 eu5ab_enable_special_buildings_for_location: "Ten mod: zezwól na budynki specjalne"
 eu5ab_enable_special_buildings_for_location_desc: "Zezwól automatycznej budowie na budowę lub ulepszanie budynków specjalnych w wybranej lokacji."
 eu5ab_disable_special_buildings_for_location: "Ten mod: zabroń budynków specjalnych"
 eu5ab_disable_special_buildings_for_location_desc: "Zabroń automatycznej budowie budowy lub ulepszania budynków specjalnych w wybranej lokacji."
 eu5ab_decouple_selected_location: "Ten mod: przestań śledzić szablon prowincji"
 eu5ab_decouple_selected_location_desc: "Przyszłe zmiany szablonu prowincji nie zaktualizują wybranej lokacji."
 eu5ab_clear_selected_location_policy: "Ten mod: wyczyść zasady lokacji"
 eu5ab_clear_selected_location_policy_desc: "Wybierz lokację i usuń z moda jej szablon, rezerwę, reguły budynków i automatycznej budowy."
 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Ustaw budżet, wymagania budowy, strategię decyzji i wydajność wspólne dla wszystkich szablonów. Każdy szablon zachowuje własne włączenie, zasięg i priorytety."
 eu5ab_regional_development__general_name: "Sterowanie i limity"
 eu5ab_regional_development__finance_name: "Finanse i rynek"
 eu5ab_regional_development__automation_name: "Bezpieczeństwo i ranking"
 eu5ab_regional_development__performance_name: "Optymalizacja wydajności"
 eu5ab_regional_development__performance__preset_name: "Ustawienie wydajności"
 eu5ab_regional_development__performance__preset_desc: "Ustawienia dostosowują poniższe opcje. Ręczna zmiana opcji zaawansowanej przełącza na Własne; nowe wartości obowiązują od następnej kontroli."
 eu5ab_regional_development__performance__advanced_name: "Ustawienia zaawansowane"
 eu5ab_regional_development__performance__advanced_desc: "Ustaw sposób i liczbę sprawdzanych lokacji, maksymalne projekty na przebieg, listy kandydatów i wcześniejsze zakończenie."
 eu5ab_regional_development__general__limits_name: "Sterowanie i limit równoczesny"
 eu5ab_regional_development__general__limits_desc: "Określ, czy mod działa i iloma projektami cywilnymi może zarządzać jednocześnie."
 eu5ab_regional_development__general__returns_name: "Reguły zwrotu i wyjątki awaryjne"
 eu5ab_regional_development__general__returns_desc: "Ustal minimalny zwrot zwykłych budynków i czy niedobór żywności, materiałów, dóbr wojskowych lub strategicznych nakładów może go zawiesić."
 eu5ab_regional_development__finance__budget_name: "Wspólny budżet roczny"
 eu5ab_regional_development__finance__budget_desc: "Wszystkie szablony, budynki i RGO dzielą jeden krajowy budżet roczny."
 eu5ab_regional_development__finance__market_name: "Zakres cen rynkowych"
 eu5ab_regional_development__finance__market_desc: "Ustaw wspólne procenty ceny minimalnej i wysokiej względem ceny bazowej."
 eu5ab_regional_development__automation__safety_name: "Zasady bezpieczeństwa budowy"
 eu5ab_regional_development__automation__safety_desc: "Wspólne reguły dla budynków specjalnych, źródeł wcześniejszych, siły roboczej i braków nakładów."
 eu5ab_regional_development__automation__rgo_name: "Rozbudowa RGO"
 eu5ab_regional_development__automation__rgo_desc: "Wspólne włączenie RGO i minimalne wykorzystanie. Lokacje porządkuje się według niedoboru, ceny, wykorzystania i potrzeby strategicznej."
 eu5ab_regional_development__automation__workforce_name: "Prognoza siły roboczej"
 eu5ab_regional_development__automation__workforce_desc: "Wspólny horyzont zapełniania nowych miejsc pracy."
 eu5ab_regional_development__automation__ranking_name: "Strategia decyzji budowlanych"
 eu5ab_regional_development__automation__ranking_desc: "Wybierz strategię zwykłych budynków, kolejność ulepszeń, rozbudów, RGO i nowych budów oraz wpływ lokalnych nakładów."
 eu5ab_regional_development__candidate_ranking_mode_name: "Strategia zwykłych budynków"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Wybierz końcowy ranking po spełnieniu wymagań. Pilność żywności i Kolejność budowy są pierwsze; RGO używają niedoboru, ceny, wykorzystania i potrzeby strategicznej."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Podaż i popyt"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ocenia projekty według niedoborów rynkowych, potrzeb strategicznych, wydajności receptur, lokalnych surowców, cen i ryzyka siły roboczej, premiując pełne łańcuchy i stabilność długoterminową."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Przewidywany zysk"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtruje kandydatów według reguł szablonu i bezpieczeństwa, a następnie wybiera według przewidywanego przez grę zysku miesięcznego. Priorytet 0–10 ma niewielki wpływ przy zbliżonych zyskach."
 eu5ab_regional_development__automation__candidate_priority_name: "Kolejność automatycznej budowy"
 eu5ab_regional_development__automation__candidate_priority_desc: "Przeciągnij cztery typy, aby ustalić kolejność. Mod wyczerpuje możliwe projekty obecnego typu i szuka alternatyw, zanim przejdzie dalej. W nagłym braku żywności projekty żywnościowe są pierwsze, ale zachowują tę kolejność."
 eu5ab_regional_development__candidate_priority_name: "Kolejność automatycznej budowy"
 eu5ab_regional_development__candidate_priority_desc: "Przeciągnij, aby uporządkować ulepszenia, zwykłe rozbudowy, RGO i nowe budynki."
 eu5ab_regional_development__candidate_priority_item_column_name: "Typ budowy"
 eu5ab_regional_development__candidate_priority_i1_name: "Ulepszaj budynki"
 eu5ab_regional_development__candidate_priority_i1_desc: "Zastąp przestarzały budynek najnowszym odblokowanym poziomem jego łańcucha."
 eu5ab_regional_development__candidate_priority_i2_name: "Rozbuduj istniejące budynki"
 eu5ab_regional_development__candidate_priority_i2_desc: "Dodaj poziom do istniejącego zwykłego budynku, bez zastępstw i RGO."
 eu5ab_regional_development__candidate_priority_i3_name: "Rozbuduj lokacje zasobów"
 eu5ab_regional_development__candidate_priority_i3_desc: "Rozbuduj lokalne RGO z zachowaniem wykorzystania, budżetu rocznego, rezerwy i innych zabezpieczeń."
 eu5ab_regional_development__candidate_priority_i4_name: "Buduj nowe budynki"
 eu5ab_regional_development__candidate_priority_i4_desc: "Zbuduj od zera zwykły budynek, którego nie ma jeszcze w lokacji."
 eu5ab_regional_development__enabled_name: "Włącz automatyczną budowę"
 eu5ab_regional_development__enabled_desc: "Po wyłączeniu szablony i powiązania pozostają zapisane, ale miesięczna automatyczna budowa się zatrzymuje."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Dodatkowe projekty równoczesne"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Liczba równoczesnych projektów cywilnych ponad miejsce bazowe. 0 oznacza łącznie 1, a 599 oznacza 600. Budowa ręczna, drogi i inne mody nie są liczone."
 eu5ab_regional_development__budget_mode_name: "Tryb budżetu rocznego"
 eu5ab_regional_development__budget_mode_desc: "Wybierz stałą kwotę lub utwórz wspólną pulę roczną jako wielokrotność całego miesięcznego dochodu."
 eu5ab_regional_development__budget_mode_option_1_name: "Stały budżet roczny"
 eu5ab_regional_development__budget_mode_option_2_name: "Miesięczny dochód ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Miesięczny dochód ×6 (zalecane)"
 eu5ab_regional_development__budget_mode_option_4_name: "Miesięczny dochód ×8"
 eu5ab_regional_development__economic_metric_name: "Miara zwrotu automatycznej budowy"
 eu5ab_regional_development__economic_metric_desc: "Wybierz minimalny zwrot zwykłych budynków: dodatni miesięczny dochód lub zysk albo 5% rocznego ROI. Infrastruktura bez produktu jest zwolniona; RGO mają własne zasady."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Dochód"
 eu5ab_regional_development__economic_metric_option_1_desc: "Rozpocznij tylko, jeśli gra przewiduje dodatni miesięczny dochód."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Zysk"
 eu5ab_regional_development__economic_metric_option_2_desc: "Rozpocznij tylko, jeśli gra przewiduje dodatni całkowity miesięczny zysk."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Zwrot z dochodu"
 eu5ab_regional_development__economic_metric_option_3_desc: "Rozpocznij tylko, jeśli przewidywany miesięczny dochód daje co najmniej 5% rocznego zwrotu z kosztu budowy."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Zwrot z zysku"
 eu5ab_regional_development__economic_metric_option_4_desc: "Rozpocznij tylko, jeśli przewidywany miesięczny zysk daje co najmniej 5% rocznego zwrotu z kosztu budowy."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Żywność się wyczerpie: buduj najpierw, pomiń zwrot"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Gdy żywność ma się wyczerpać, obsłuż projekty żywnościowe najpierw i pomiń zwrot zwykłych budynków żywnościowych. Kolejność i wszystkie inne zasady nadal obowiązują."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Żywność 25% lub mniej: buduj najpierw, pomiń zwrot"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Przy zapasie żywności 25% lub mniej obsłuż projekty żywnościowe najpierw i pomiń zwrot zwykłych budynków żywnościowych; inne zasady nadal obowiązują."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Podaż budowlana poniżej 65%: pomiń zwrot"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Jeśli kluczowy materiał ma mniej niż 65% potrzebnej podaży, jego producenci pomijają zwrot. Inne zasady nadal obowiązują."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Podaż wojskowa podczas wojny poniżej 65%: pomiń zwrot"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Podczas wojny, jeśli dobro wojskowe ma mniej niż 65% potrzebnej podaży, jego producenci pomijają zwrot; inne zasady nadal obowiązują."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Produkcja strategiczna bez nakładów: pomiń zwrot wcześniejszych źródeł"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Jeśli nakład wcześniejszy poniżej 65% blokuje krajową produkcję żywności, budowlaną lub wojskową, jego producenci pomijają zwrot; inne zasady obowiązują."
 eu5ab_regional_development__fixed_annual_budget_name: "Stały budżet roczny"
 eu5ab_regional_development__fixed_annual_budget_desc: "Używane tylko w trybie stałym; wszystkie szablony dzielą tę kwotę."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Minimalna rezerwa skarbca"
 eu5ab_regional_development__min_cash_reserve_desc: "Złoto, które musi pozostać w skarbcu po rozpoczęciu projektu."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Procent ceny minimalnej"
 eu5ab_regional_development__price_min_desc: "Produkcja poniżej tego procentu ceny bazowej jest zwykle uznawana za nadpodaż."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Procent wysokiej ceny odniesienia"
 eu5ab_regional_development__price_max_desc: "Produkcja powyżej tego procentu ceny bazowej otrzymuje premię rankingu."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Zezwól na budynki specjalne"
 eu5ab_regional_development__allow_special_buildings_desc: "Zezwól na uwzględnianie budynków specjalnych; wymagania budowy gry nadal obowiązują."
 eu5ab_regional_development__auto_build_input_sources_name: "Buduj źródła wcześniejsze przy niedoborze"
 eu5ab_regional_development__auto_build_input_sources_desc: "Jeśli planowany budynek nie może ruszyć przez brak nakładów, spróbuj dozwolonego źródła wcześniejszego."
 eu5ab_regional_development__pause_low_workforce_name: "Wstrzymaj przy małej sile roboczej"
 eu5ab_regional_development__pause_low_workforce_desc: "Nie buduj, jeśli miejsc pracy nie da się zapełnić w okresie prognozy."
 eu5ab_regional_development__stop_input_shortage_name: "Zatrzymaj przy braku krytycznych nakładów"
 eu5ab_regional_development__stop_input_shortage_desc: "Nie buduj powiązanych projektów, gdy krytyczne nakłady rynkowe są niedostarczone."
 eu5ab_regional_development__allow_rgo_name: "Zezwól na rozbudowę RGO"
 eu5ab_regional_development__allow_rgo_desc: "Zezwól wszystkim szablonom uwzględniać rozbudowę lokacji zasobów."
 eu5ab_regional_development__rgo_min_utilization_name: "Minimalne wykorzystanie RGO"
 eu5ab_regional_development__rgo_min_utilization_desc: "Nie rozbudowuj RGO poniżej tego wykorzystania."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Horyzont zapełnienia miejsc pracy (miesiące)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Horyzont prognozy lokalnych awansów do nowych miejsc pracy."
 eu5ab_regional_development__native_input_priority_name: "Priorytet lokalnych surowców"
 eu5ab_regional_development__native_input_priority_desc: "0–10; wyższe wartości sprzyjają budynkom używającym surowców z tej samej prowincji."
 eu5ab_regional_development__performance_preset_name: "Ustawienie wydajności"
 eu5ab_regional_development__performance_preset_desc: "Ustawienie synchronizuje opcje zaawansowane poniżej. Własne zachowuje bieżące wartości."
 eu5ab_regional_development__performance_preset_option_1_name: "Ostrożne"
 eu5ab_regional_development__performance_preset_option_1_desc: "Sprawdza do 10 lokacji dziennie i rozpoczyna najwyżej 30 projektów na przebieg. Kandydaci planowania: 5; zysku: 15. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_2_name: "Równowaga"
 eu5ab_regional_development__performance_preset_option_2_desc: "Sprawdza do 20 lokacji dziennie i rozpoczyna najwyżej 50 projektów na przebieg. Kandydaci planowania: 4; zysku: 12. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_3_name: "Maksymalna przepustowość"
 eu5ab_regional_development__performance_preset_option_3_desc: "Dla państw z wieloma lokacjami. Sprawdza do 30 dziennie bez limitu na przebieg. Kandydaci planowania: 3; zysku: 10. Kończy po zebraniu wystarczającej liczby."
 eu5ab_regional_development__performance_preset_option_4_name: "Własne"
 eu5ab_regional_development__performance_preset_option_4_desc: "Użyj bieżących ustawień zaawansowanych."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Wiele lokacji z szablonami może obniżyć wydajność gry."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Maksymalna przepustowość obsługuje do 30 lokacji dziennie bez limitu dodatków na przebieg. Wiele lokacji może spowolnić rozliczenie miesiąca."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Spowolnienie Podaży i popytu: zmniejsz Kandydatów planowania."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Tylko dla Podaży i popytu. Mniej Kandydatów planowania ogranicza projekty na lokację i typ wysyłane do dalszych kontroli."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Skutek: mniej rozwiązań może pominąć możliwe projekty."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Kandydaci używają tej samej kolejności wyniku. Niższy limit zostawia mniej alternatyw po porażce czołówki i może nie sprawdzić późniejszego możliwego projektu."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Spowolnienie wyboru zysku: zmniejsz Kandydatów zysku."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Tylko przy Wyborze przewidywanego zysku. Mniej Kandydatów zysku ogranicza projekty na lokację i typ wysyłane do kontroli zysku i kosztu gry."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Skutek: krótsza lista może pominąć naprawdę zyskowne budynki."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Wybór zysku wstępnie filtruje wynikiem, potem porządkuje według zysku. Niższy limit może odrzucić zyskowny budynek we wstępnym filtrze."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Zmniejsz też dzienne lokacje lub dodatki na przebieg."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Mniej lokacji dziennie rozkłada skan na więcej dni. Mniej dodatków ogranicza kontrole i rozpoczęcia na przebieg. Można też zmienić ustawienie; zero oznacza bez limitu."
 eu5ab_regional_development__parallel_location_scan_name: "Przetwarzaj lokacje osobno"
 eu5ab_regional_development__parallel_location_scan_desc: "Sprawdzaj lokacje osobno, aby skrócić pojedynczą aktualizację. Nie zmienia to rankingu, budżetu ani kolejności."
 eu5ab_regional_development__daily_location_task_limit_name: "Lokacje sprawdzane dziennie"
 eu5ab_regional_development__daily_location_task_limit_desc: "Maksymalna liczba szczegółowo sprawdzanych lokacji dziennie, od 1 do 30. Niższe wartości zmniejszają dzienne obciążenie, ale wydłużają pokrycie kraju."
 eu5ab_regional_development__max_additions_per_run_name: "Maksimum dodatków na przebieg"
 eu5ab_regional_development__max_additions_per_run_desc: "Ogranicz projekty rozpoczęte w jednym przebiegu, od 0 do 600. Zero oznacza bez limitu."
 eu5ab_regional_development__candidates_per_location_name: "Kandydaci planowania na lokację"
 eu5ab_regional_development__candidates_per_location_desc: "Tylko dla Podaży i popytu. Zachowuje 3–30 kandydatów na lokację i typ. Więcej daje alternatywy po porażce czołówki, lecz zwiększa kontrole."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Kandydaci zysku na lokację"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Tylko w Wyborze zysku. Wysyła 3–30 kandydatów na lokację i typ do porównania zysku gry. Więcej zmniejsza pominięcia, lecz zwiększa kontrole."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Zatrzymaj po znalezieniu dość kandydatów"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Gdy liczba kandydatów osiągnie dwukrotność maksimum przebiegu, przestań sprawdzać pozostałe lokacje."
 eu5ab_diagnostics_cmm_hint: "Zmień wspólne zasady w Ustawieniach moda Community Mod Framework. Raport budowy pokazuje ostatni wynik automatyczny."
