 eu5ab_template_name_click_tooltip: "Wprowadź nową nazwę bieżącego szablonu."
 eu5ab_template_rename_desc: "Wprowadź nową nazwę bieżącego szablonu. Ze względu na ograniczenia interfejsu gry nazwa niestandardowa jest widoczna tylko w tej sesji; pozostałe reguły i powiązania lokacji pozostają zapisane."
 eu5ab_template_rename_input: "Nazwa szablonu"
 eu5ab_template_rename_accept: "Potwierdź"
 eu5ab_template_rename_cancel: "Anuluj"
 eu5ab_target_location_title: "Lokacja docelowa"
 eu5ab_target_location_desc: "Wybierz lokację przed wyczyszczeniem jej ustawień lub zatrzymaniem aktualizacji z szablonu prowincji. Aby przypisać szablon, użyj przycisków wyboru na jego karcie."
 eu5ab_template_editor_desc: "Skonfiguruj priorytety budynków i zakres tego szablonu. Wspólne dla całego kraju reguły budżetu, rynku, siły roboczej i bezpieczeństwa budowy ustawia się w ustawieniach moda Community Mod Framework."
 eu5ab_template_auto_save_hint: "Zmiany są zapisywane natychmiast. Zamknij okno, aby wrócić."
