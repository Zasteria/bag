 eu5ab_cash_section_title: "Rezerwa skarbca"
 eu5ab_cash_short_desc: "Minimalne saldo, które musi pozostać w skarbcu."
 eu5ab_cash_label: "Rezerwa skarbca"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] złota"
 eu5ab_cash_help: "Rezerwa skarbca to minimalne saldo, które musi pozostać po rozpoczęciu budowy; nie jest osobno pobierana. Projekt zostanie zablokowany, jeśli jego koszt obniży skarbiec poniżej tej wartości. Przykład: przy 1050 złota, rezerwie 1000 i koszcie 100 budowa nie ruszy."
 eu5ab_budget_section_title: "Roczny budżet strategiczny"
 eu5ab_budget_short_desc: "Wybierz stałą kwotę albo budżet zależny od miesięcznego dochodu; tryby wzajemnie się wykluczają."
 eu5ab_budget_mode_fixed: "Stały budżet"
 eu5ab_budget_mode_income: "Zależny od dochodu"
 eu5ab_budget_multiplier_4: "×4 Ostrożny"
 eu5ab_budget_multiplier_6: "×6 Zalecany"
 eu5ab_budget_multiplier_8: "×8 Aktywny"
 eu5ab_budget_effective_label: "Budżet na bieżący rok"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] złota"
 eu5ab_budget_label: "Budżet roczny"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] złota/rok"
 eu5ab_budget_cash_comparison: "Roczny budżet strategiczny ogranicza roczne wydatki tego moda, a rezerwa określa minimum pozostające w skarbcu. Oba warunki muszą być spełnione."
 eu5ab_budget_reset_note: "Tryby stały i zależny od dochodu wykluczają się. Budżet jest resetowany podczas pierwszej kontroli w styczniu i odejmowany dopiero po wejściu projektu do kolejki."
 eu5ab_budget_help: "Wszystkie szablony dzielą jeden krajowy budżet roczny. Wybierz stałą kwotę albo 4, 6 lub 8 razy miesięczny dochód całkowity. Budżet zależny od dochodu jest liczony przy pierwszej kontroli w styczniu i pozostaje stały przez rok. Budynki używają kosztu z gry, RGO kosztu bazowego. Budżet odejmuje się dopiero po wejściu projektu do kolejki."
 eu5ab_quota_section_title: "Limit równoczesnych budów tego moda"
 eu5ab_quota_short_desc: "Określa, ile dodatkowych projektów cywilnych ten mod może prowadzić poza miejscem bazowym."
 eu5ab_hard_cap_label: "Dodatkowe równoczesne projekty"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projektów (łączny limit to ta wartość + 1)"
 eu5ab_quota_help: "0 oznacza najwyżej 1 aktywny projekt cywilny, a 599 — 600. Liczą się tylko projekty rozpoczęte przez ten mod i nadal budowane; budowy ręczne, drogi i inne mody nie. Miesięczna kontrola uzupełnia tylko wolne miejsca, najwyżej jeden projekt na lokację; RGO nie mają osobnego limitu miesięcznego."
