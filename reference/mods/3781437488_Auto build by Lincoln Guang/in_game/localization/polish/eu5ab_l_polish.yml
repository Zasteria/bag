 eu5ab_copy_preset_to_player_button: "Kopiuj jako szablon gracza"
 eu5ab_delete_template_button: "Usuń szablon"
 eu5ab_delete_template_tooltip: "Usuń ten szablon niestandardowy. Po potwierdzeniu wszystkie korzystające z niego lokacje również utracą przypisanie."
 eu5ab_delete_template_confirm_prompt: "Usunąć bieżący szablon?"
 eu5ab_delete_template_confirm_button: "Potwierdź usunięcie"
 eu5ab_delete_template_confirm_tooltip: "Trwale usuń bieżący szablon i wszystkie jego powiązania z lokacjami. Lokacje wrócą do stanu bez przypisania. Tej operacji nie można cofnąć."
 eu5ab_delete_template_cancel_button: "Anuluj"
 eu5ab_delete_template_cancel_tooltip: "Anuluj usuwanie i wróć do działań szablonu."
 eu5ab_pause_template_button: "Wstrzymaj szablon"
 eu5ab_resume_template_button: "Wznów szablon"
 eu5ab_template_paused_badge: " (Wstrzymany)"
 eu5ab_pause_template_tooltip: "Tymczasowo wstrzymaj lub wznów ten szablon. Wstrzymanie zachowuje priorytety budynków i powiązania lokacji, lecz automatyczna budowa nie korzysta z tego szablonu."
 eu5ab_select_template_tooltip: "Wybierz ten szablon i wyświetl szczegóły jego reguł."
 eu5ab_preset_readonly_desc: "Ten szablon tematyczny tylko do odczytu można niezależnie wstrzymywać, wznawiać i przypisywać. Skopiuj go jako szablon niestandardowy, aby edytować priorytety budynków. Reguły wspólne zmienisz w ustawieniach moda Community Mod Framework."
 eu5ab_template_name_pencil_hint: "Nazwa szablonu"
