 eu5ab_detail_title: "Regeldetails"
 eu5ab_new_template_plus_button: "+ Neue Vorlage"
 eu5ab_new_blank_template_button: "+ Leere Vorlage"
 eu5ab_new_recommended_template_button: "+ Empfohlene Vorlage"
 eu5ab_custom_empty_detail: "Wähle links eine benutzerdefinierte Vorlage oder erstelle eine leere Vorlage beziehungsweise eine mit empfohlenen Prioritäten."
 eu5ab_template_intro_title: "Vorlageneditor"
 eu5ab_automation_buildings_intro: "Bei benutzerdefinierten Vorlagen lassen sich Gebäudeprioritäten frei bearbeiten und zuweisen. Themenvorlagen sind schreibgeschützt und können zum Bearbeiten als benutzerdefinierte Vorlage kopiert werden."
 eu5ab_player_templates_button: "Spielervorlagen"
 eu5ab_copy_preset_to_player_button: "Als Spielervorlage kopieren"
 eu5ab_delete_template_button: "Vorlage löschen"
 eu5ab_delete_template_tooltip: "Lösche diese benutzerdefinierte Vorlage. Nach der Bestätigung werden auch alle Orte, die sie verwenden, davon gelöst."
 eu5ab_delete_template_confirm_prompt: "Aktuelle Vorlage löschen?"
 eu5ab_delete_template_confirm_button: "Löschen bestätigen"
 eu5ab_delete_template_confirm_tooltip: "Lösche die aktuelle Vorlage und alle ihre Ortsbindungen dauerhaft. Die Orte sind danach wieder unzugewiesen. Dies kann nicht rückgängig gemacht werden."
 eu5ab_delete_template_cancel_button: "Abbrechen"
 eu5ab_delete_template_cancel_tooltip: "Brich das Löschen ab und kehre zu den Vorlagenaktionen zurück."
 eu5ab_pause_template_button: "Vorlage pausieren"
 eu5ab_resume_template_button: "Vorlage fortsetzen"
 eu5ab_template_paused_badge: " (Pausiert)"
 eu5ab_pause_template_tooltip: "Pausiere diese Vorlage vorübergehend oder setze sie fort. Beim Pausieren bleiben Gebäudeprioritäten und Ortsbindungen erhalten, der automatisierte Bau verwendet die Vorlage jedoch nicht."
 eu5ab_select_template_tooltip: "Wähle diese Vorlage aus und sieh dir ihre Regeldetails an."
 eu5ab_preset_readonly_desc: "Diese schreibgeschützte Themenvorlage kann unabhängig pausiert, fortgesetzt und zugewiesen werden. Kopiere sie als benutzerdefinierte Vorlage, um Gebäudeprioritäten zu bearbeiten. Gemeinsame Regeln werden in den Mod-Einstellungen von Community Mod Framework geändert."
 eu5ab_template_name_pencil_hint: "Vorlagenname"
 eu5ab_template_name_click_hint: "Zum Umbenennen auf den Namen klicken"
 eu5ab_template_name_click_tooltip: "Gib einen neuen Namen für die aktuelle Vorlage ein."
 eu5ab_template_rename_desc: "Gib einen neuen Namen für die aktuelle Vorlage ein. Aufgrund der Spielschnittstelle wird der benutzerdefinierte Name nur in dieser Sitzung angezeigt; die übrigen Regeln und Ortsbindungen der Vorlage bleiben gespeichert."
 eu5ab_template_rename_input: "Vorlagenname"
 eu5ab_template_rename_accept: "Bestätigen"
 eu5ab_template_rename_cancel: "Abbrechen"
 eu5ab_target_location_title: "Zielort"
 eu5ab_target_location_desc: "Wähle einen Ort aus, bevor du seine Einstellungen löschst oder Aktualisierungen durch die Provinzvorlage beendest. Verwende zum Zuweisen einer Vorlage die Auswahlschaltflächen auf der jeweiligen Vorlagenkarte."
 eu5ab_template_editor_desc: "Lege Gebäudeprioritäten und Geltungsbereich dieser Vorlage fest. Landesweit gemeinsame Regeln für Budget, Markt, Arbeitskräfte und Bausicherheit werden in den Mod-Einstellungen von Community Mod Framework konfiguriert."
 eu5ab_template_auto_save_hint: "Änderungen werden sofort gespeichert. Schließe das Fenster, um zurückzukehren."
