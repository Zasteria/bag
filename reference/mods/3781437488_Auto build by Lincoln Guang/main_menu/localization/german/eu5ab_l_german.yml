 eu5ab_template_editor_sections_title: "Vorlageneinstellungen"
 eu5ab_template_editor_sections_desc: "Jede Vorlage speichert Status, Geltungsbereich und Gebäudeprioritäten. Das letzte Monatsergebnis steht im Baubericht."
