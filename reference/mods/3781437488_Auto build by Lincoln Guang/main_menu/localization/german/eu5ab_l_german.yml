 eu5ab_regional_development__finance__market_desc: "Legt gemeinsame Mindest- und Hochpreis-Prozentsätze relativ zum Grundpreis fest."
 eu5ab_regional_development__automation__safety_name: "Bausicherheitsregeln"
 eu5ab_regional_development__automation__safety_desc: "Gemeinsame Regeln für Spezialgebäude, vorgelagerte Quellen, Arbeitskräfte und Inputmangel."
 eu5ab_regional_development__automation__rgo_name: "RGO-Erweiterung"
 eu5ab_regional_development__automation__rgo_desc: "Gemeinsame RGO-Aktivierung und Mindestauslastung. Orte werden nach Mangel, Preis, Auslastung und strategischem Bedarf geordnet."
 eu5ab_regional_development__automation__workforce_name: "Arbeitskräfteprognose"
 eu5ab_regional_development__automation__workforce_desc: "Gemeinsamer Prognosezeitraum zum Besetzen neuer Stellen."
 eu5ab_regional_development__automation__ranking_name: "Bauentscheidungsstrategie"
 eu5ab_regional_development__automation__ranking_desc: "Wähle die Strategie für normale Gebäude, ordne Verbesserungen, Erweiterungen, RGOs und Neubauten und bestimme den Einfluss lokaler Inputs."
 eu5ab_regional_development__candidate_ranking_mode_name: "Strategie für normale Gebäude"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Wähle die Endrangfolge nach den Bedingungen. Nahrungsnotfall und Baureihenfolge kommen zuerst; RGOs nutzen Mangel, Preis, Auslastung und strategischen Bedarf."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Angebot und Nachfrage"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ordnet Projekte nach Marktengpässen, strategischem Bedarf, Rezepteffizienz, lokalen Inputs, Preisen und Arbeitskräfterisiko und bevorzugt vollständige Ketten sowie langfristige Stabilität."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Prognostizierter Gewinn"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtert Kandidaten nach Vorlagen- und Sicherheitsregeln und wählt nach dem vom Spiel erwarteten Monatsgewinn. Die Priorität 0–10 wirkt bei ähnlichen Gewinnen leicht mit."
 eu5ab_regional_development__automation__candidate_priority_name: "Automatische Baureihenfolge"
 eu5ab_regional_development__automation__candidate_priority_desc: "Ziehe die vier Typen in die gewünschte Reihenfolge. Der Mod versucht alle möglichen Projekte des aktuellen Typs und sucht Alternativen, bevor er wechselt. Im Nahrungsnotfall kommen Nahrungsprojekte zuerst, behalten aber diese Reihenfolge."
 eu5ab_regional_development__candidate_priority_name: "Automatische Baureihenfolge"
 eu5ab_regional_development__candidate_priority_desc: "Ziehe, um Verbesserungen, normale Erweiterungen, RGO-Erweiterungen und Neubauten zu ordnen."
 eu5ab_regional_development__candidate_priority_item_column_name: "Bautyp"
 eu5ab_regional_development__candidate_priority_i1_name: "Gebäude verbessern"
 eu5ab_regional_development__candidate_priority_i1_desc: "Ersetzt ein veraltetes Gebäude durch die neueste freigeschaltete Stufe seiner Kette."
 eu5ab_regional_development__candidate_priority_i2_name: "Bestehende Gebäude erweitern"
 eu5ab_regional_development__candidate_priority_i2_desc: "Fügt einem bestehenden normalen Gebäude eine Stufe hinzu, ohne Ersatzbauten oder RGOs."
 eu5ab_regional_development__candidate_priority_i3_name: "Ressourcenorte erweitern"
 eu5ab_regional_development__candidate_priority_i3_desc: "Erweitert das lokale RGO unter Beibehaltung von Auslastung, Jahresbudget, Schatzreserve und anderen Schutzregeln."
 eu5ab_regional_development__candidate_priority_i4_name: "Neue Gebäude bauen"
 eu5ab_regional_development__candidate_priority_i4_desc: "Baut ein normales Gebäude neu, das am Ort noch nicht existiert."
 eu5ab_regional_development__enabled_name: "Automatisierten Bau aktivieren"
 eu5ab_regional_development__enabled_desc: "Bei Deaktivierung bleiben Vorlagen und Bindungen gespeichert, aber der monatliche automatische Bau stoppt."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Zusätzliche gleichzeitige Projekte"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Gleichzeitige zivile Projekte zusätzlich zum Grundplatz. 0 erlaubt insgesamt 1, 599 erlaubt 600. Manuelle Bauten, Straßen und andere Mods zählen nicht."
 eu5ab_regional_development__budget_mode_name: "Jahresbudgetmodus"
 eu5ab_regional_development__budget_mode_desc: "Wähle einen festen Betrag oder bilde den gemeinsamen Jahrestopf als Vielfaches des monatlichen Gesamteinkommens."
 eu5ab_regional_development__budget_mode_option_1_name: "Festes Jahresbudget"
 eu5ab_regional_development__budget_mode_option_2_name: "Monatseinkommen ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Monatseinkommen ×6 (empfohlen)"
 eu5ab_regional_development__budget_mode_option_4_name: "Monatseinkommen ×8"
 eu5ab_regional_development__economic_metric_name: "Renditekennzahl für automatisierten Bau"
 eu5ab_regional_development__economic_metric_desc: "Wähle die Mindestrendite normaler Gebäude: positives Monatseinkommen oder positiver Monatsgewinn oder 5 % jährlicher ROI. Infrastruktur ohne Produkt ist ausgenommen; RGOs nutzen eigene Regeln."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Einkommen"
 eu5ab_regional_development__economic_metric_option_1_desc: "Nur beginnen, wenn das Spiel positives Monatseinkommen vorhersagt."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Gewinn"
 eu5ab_regional_development__economic_metric_option_2_desc: "Nur beginnen, wenn das Spiel positiven gesamten Monatsgewinn vorhersagt."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Einkommensrendite"
 eu5ab_regional_development__economic_metric_option_3_desc: "Nur beginnen, wenn das vorhergesagte Monatseinkommen mindestens 5 % jährliche Rendite auf die Baukosten bietet."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Gewinnrendite"
 eu5ab_regional_development__economic_metric_option_4_desc: "Nur beginnen, wenn der vorhergesagte Monatsgewinn mindestens 5 % jährliche Rendite auf die Baukosten bietet."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Nahrung geht aus: zuerst bauen, Rendite ignorieren"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Wenn Nahrung ausgeht, Nahrungsprojekte zuerst behandeln und normale Nahrungsgebäude von der Rendite befreien. Reihenfolge und alle anderen Regeln gelten weiter."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Nahrung höchstens 25 %: zuerst bauen, Rendite ignorieren"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Bei höchstens 25 % Nahrung Nahrungsprojekte zuerst behandeln und normale Nahrungsgebäude von der Rendite befreien; alle anderen Regeln gelten weiter."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Bauversorgung unter 65 %: Rendite ignorieren"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Hat ein wichtiges Baumaterial weniger als 65 % der nötigen Versorgung, entfällt für seine Produzenten die Rendite. Alle anderen Regeln gelten."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Militärversorgung im Krieg unter 65 %: Rendite ignorieren"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Hat ein Militärgut im Krieg weniger als 65 % der nötigen Versorgung, entfällt für seine Produzenten die Rendite; alle anderen Regeln gelten."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Strategische Produktion ohne Inputs: vorgelagerte Rendite ignorieren"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Blockiert ein vorgelagerter Input unter 65 % nationale Nahrungs-, Bau- oder Militärproduktion, entfällt für seine Produzenten die Rendite; alle anderen Regeln gelten."
 eu5ab_regional_development__fixed_annual_budget_name: "Festes Jahresbudget"
 eu5ab_regional_development__fixed_annual_budget_desc: "Nur im festen Modus verwendet; alle Vorlagen teilen diesen Betrag."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Mindest-Schatzreserve"
 eu5ab_regional_development__min_cash_reserve_desc: "Gold, das nach Projektbeginn im Schatz verbleiben muss."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Mindestpreis-Prozentsatz"
 eu5ab_regional_development__price_min_desc: "Produktion unter diesem Prozentsatz des Grundpreises gilt normalerweise als überversorgt."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Hochpreis-Referenzprozentsatz"
 eu5ab_regional_development__price_max_desc: "Produktion über diesem Prozentsatz des Grundpreises erhält einen Rangbonus."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Sondergebäude erlauben"
 eu5ab_regional_development__allow_special_buildings_desc: "Erlaubt Spezialgebäude; die Baubedingungen des Spiels gelten weiter."
 eu5ab_regional_development__auto_build_input_sources_name: "Vorgelagerte Quellen bei Mangel bauen"
 eu5ab_regional_development__auto_build_input_sources_desc: "Kann ein geplantes Gebäude wegen Inputmangel nicht beginnen, versuche eine erlaubte vorgelagerte Quelle."
 eu5ab_regional_development__pause_low_workforce_name: "Bei Arbeitskräftemangel pausieren"
 eu5ab_regional_development__pause_low_workforce_desc: "Nicht bauen, wenn Stellen im Prognosezeitraum nicht besetzt werden können."
 eu5ab_regional_development__stop_input_shortage_name: "Bei kritischem Inputmangel stoppen"
 eu5ab_regional_development__stop_input_shortage_desc: "Keine zugehörigen Projekte bauen, solange kritische Marktinputs unterversorgt sind."
 eu5ab_regional_development__allow_rgo_name: "RGO-Erweiterung erlauben"
 eu5ab_regional_development__allow_rgo_desc: "Erlaubt allen Vorlagen, Ressourcenorte zu erweitern."
 eu5ab_regional_development__rgo_min_utilization_name: "Mindest-RGO-Auslastung"
 eu5ab_regional_development__rgo_min_utilization_desc: "Ein RGO unter dieser Auslastung nicht erweitern."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Zeitraum zum Besetzen von Stellen (Monate)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Prognosezeitraum für lokale Aufstiege in neue Stellen."
 eu5ab_regional_development__native_input_priority_name: "Priorität lokaler Inputs"
 eu5ab_regional_development__native_input_priority_desc: "0–10; höhere Werte bevorzugen Gebäude, die Rohstoffe derselben Provinz nutzen."
 eu5ab_regional_development__performance_preset_name: "Leistungsvoreinstellung"
 eu5ab_regional_development__performance_preset_desc: "Eine Voreinstellung synchronisiert die erweiterten Optionen. Benutzerdefiniert behält ihre aktuellen Werte."
 eu5ab_regional_development__performance_preset_option_1_name: "Konservativ"
 eu5ab_regional_development__performance_preset_option_1_desc: "Prüft bis zu 10 Orte täglich und startet höchstens 30 Projekte je Lauf. Planungskandidaten: 5; Gewinnkandidaten: 15. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_2_name: "Ausgewogen"
 eu5ab_regional_development__performance_preset_option_2_desc: "Prüft bis zu 20 Orte täglich und startet höchstens 50 Projekte je Lauf. Planungskandidaten: 4; Gewinnkandidaten: 12. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_3_name: "Maximaler Durchsatz"
 eu5ab_regional_development__performance_preset_option_3_desc: "Für Länder mit vielen Orten. Prüft bis zu 30 täglich ohne Lauf-Limit. Planungskandidaten: 3; Gewinnkandidaten: 10. Stoppt bei genügend Kandidaten."
 eu5ab_regional_development__performance_preset_option_4_name: "Benutzerdefiniert"
 eu5ab_regional_development__performance_preset_option_4_desc: "Verwendet die aktuellen erweiterten Einstellungen."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Viele Vorlagenorte können die Spielleistung senken."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Maximaler Durchsatz verarbeitet bis zu 30 Orte täglich ohne Zusatzlimit je Lauf. Viele Orte können den Monatswechsel verlangsamen."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Angebot-Nachfrage langsam: Planungskandidaten senken."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Nur bei Angebot und Nachfrage. Weniger Planungskandidaten reduziert Projekte je Ort und Typ in späteren Prüfungen."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Nachteil: Weniger Rückfälle können mögliche Projekte verpassen."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Kandidaten teilen dieselbe Planungsrangfolge. Ein niedrigeres Limit lässt bei Ausfällen weniger Alternativen und kann ein späteres mögliches Projekt ungeprüft lassen."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Gewinnauswahl langsam: Gewinnkandidaten senken."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Nur bei Auswahl nach prognostiziertem Gewinn. Weniger Gewinnkandidaten reduziert Projekte je Ort und Typ für Gewinn- und Kostenprüfungen des Spiels."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Nachteil: Eine kleinere Liste kann wirklich profitable Gebäude verpassen."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Gewinnauswahl filtert erst nach Planungswert und ordnet dann nach Gewinn. Ein niedrigeres Limit kann ein profitables Gebäude im Vorfilter verwerfen."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Auch tägliche Orte oder Zusätze je Lauf senken."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Weniger Orte täglich verteilt die Prüfung auf mehr Tage. Weniger Zusätze reduziert Prüfungen und Starts je Lauf. Auch die Voreinstellung kann geändert werden; null bedeutet unbegrenzt."
 eu5ab_regional_development__parallel_location_scan_name: "Orte getrennt verarbeiten"
 eu5ab_regional_development__parallel_location_scan_desc: "Prüft Orte getrennt, damit einzelne Aktualisierungen kürzer dauern. Rangfolge, Budget und Baureihenfolge ändern sich nicht."
 eu5ab_regional_development__daily_location_task_limit_name: "Geprüfte Orte pro Tag"
 eu5ab_regional_development__daily_location_task_limit_desc: "Höchstzahl detailliert geprüfter Orte pro Tag, 1 bis 30. Niedrige Werte senken die tägliche Last, brauchen aber länger für das Land."
 eu5ab_regional_development__max_additions_per_run_name: "Maximale Zusätze je Lauf"
 eu5ab_regional_development__max_additions_per_run_desc: "Begrenzt gestartete Projekte je Lauf auf 0 bis 600. Null bedeutet unbegrenzt."
 eu5ab_regional_development__candidates_per_location_name: "Planungskandidaten je Ort"
 eu5ab_regional_development__candidates_per_location_desc: "Nur bei Angebot und Nachfrage. Behält 3 bis 30 Kandidaten je Ort und Typ. Mehr Kandidaten bieten Alternativen bei Ausfällen, erhöhen aber Prüfungen."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Gewinnkandidaten je Ort"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Nur bei Gewinnauswahl. Sendet 3 bis 30 Kandidaten je Ort und Typ zum Gewinnvergleich des Spiels. Mehr reduziert Auslassungen, erhöht aber Prüfungen."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Bei genügend Kandidaten stoppen"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Wenn geeignete Kandidaten das Doppelte des Laufmaximums erreichen, verbleibende Orte nicht weiter prüfen."
 eu5ab_diagnostics_cmm_hint: "Ändere gemeinsame Regeln in den Mod-Einstellungen von Community Mod Framework. Der Baubericht zeigt das letzte automatische Ergebnis."
