 eu5ab_operating_rules_title: "Bauregeln"
 eu5ab_operating_rules_short_desc: "Konfiguriere Sondergebäude, vorgelagerte Bauten und Inputengpässe."
 eu5ab_operating_rules_help: "Sondergebäude müssen weiterhin die Spielbedingungen erfüllen. Ist der Bau vorgelagerter Quellen aktiv, sucht der Mod nach einem Zulieferer, wenn Inputmangel eine Fabrik blockiert. Bei Schutz vor kritischem Mangel starten Projekte mit zu hohem Inputrisiko nicht."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Dieser Vorlage RGO-Ausbau erlauben"
 eu5ab_rgo_short_desc: "RGOs müssen Spielregeln, Auslastung, Budget und Reserve erfüllen."
 eu5ab_rgo_utilization_label: "Mindestauslastung"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Diese Option bestimmt, ob die Vorlage RGOs berücksichtigt. Sie müssen weiterhin Spielregeln, Mindestauslastung, Jahresbudget und Reserve erfüllen. Die automatische Reihenfolge legt den Prüfzeitpunkt fest; gewertet werden Mangel, Preis, Auslastung und strategischer Bedarf. Deaktiviere den automatischen RGO-Ausbau des Grundspiels, um Doppelplanung zu vermeiden."
 eu5ab_toggle_special_buildings: "Sondergebäude erlauben"
 eu5ab_toggle_auto_build_input_sources: "Bei fehlenden Inputs vorgelagerte Quellen bauen"
 eu5ab_toggle_pause_low_workforce: "Ausbau bei Arbeitskräftemangel pausieren"
 eu5ab_ranking_mode_section_title: "Bauentscheidungsstrategie"
 eu5ab_ranking_mode_current_label: "Aktueller Modus"
 eu5ab_ranking_mode_composite_value: "#G Angebots- und Bedarfsplanung#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Auswahl nach erwartetem Gewinn#!"
 eu5ab_ranking_mode_common_desc: "Beide Strategien berücksichtigen nur freigeschaltete, baubare Gebäude mit Priorität über 0. Rendite, Budget, Reserve, Inputs, Arbeitskräfte und weitere Sicherheitsregeln gelten ebenfalls. Nahrungsnotfälle und die automatische Baureihenfolge haben Vorrang."
 eu5ab_ranking_mode_composite_desc: "Ordnet Projekte nach Marktengpässen, strategischem Bedarf, Rezepteffizienz, lokalen Inputs, Preisen und Arbeitskräfterisiko und bevorzugt vollständige Ketten sowie langfristige Stabilität."
 eu5ab_ranking_mode_actual_profit_desc: "Filtert Kandidaten nach Vorlagen- und Sicherheitsregeln und wählt nach dem vom Spiel erwarteten Monatsgewinn. Die Priorität 0–10 wirkt bei ähnlichen Gewinnen leicht mit."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Diese Strategie wählt nur aus 3–30 je Ort und aktuellem Typ vorgefilterten Kandidaten und garantiert daher nicht den global höchsten Gewinn. Rendite und Sicherheitsregeln werden vor Baubeginn erneut geprüft. RGOs bleiben nach Mangel, Preis, Auslastung und strategischem Bedarf geordnet."
 eu5ab_ranking_mode_help: "Wechsle die Strategie in den Mod-Einstellungen von Community Mod Framework. Angebots- und Bedarfsplanung bevorzugt Märkte, Ketten und Stabilität. Die Gewinnauswahl nutzt den erwarteten Monatsgewinn und Priorität 0–10 nur als sanften Einfluss."
 eu5ab_workforce_section_title: "Arbeitskräfte"
 eu5ab_pause_workforce_short_desc: "Legt fest, ob Arbeitskräfterisiko den Ausbau blockiert."
 eu5ab_job_fill_deadline_label: "Frist zur Stellenbesetzung"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] Monate"
 eu5ab_job_fill_deadline_value: "Besetzungsfrist: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] Monate"
 eu5ab_job_fill_deadline_desc: "Maximale Wartezeit für neue Stellen von 0 bis 96 Monaten. 0 akzeptiert nur aktuelle Arbeitskräfte. Mit Pausierung starten Projekte jenseits der Frist nicht; sonst senkt das Risiko nur die Priorität."
 eu5ab_deadline_0: "0 Mon."
 eu5ab_deadline_3: "3 Mon."
 eu5ab_deadline_6: "6 Mon."
 eu5ab_deadline_12: "12 Mon."
 eu5ab_toggle_stop_input_shortage: "Ausbau bei kritischem Inputmangel stoppen"
 eu5ab_prediction_status_label: "Arbeitskräfteschätzung"
 eu5ab_status_promotion_forecast: "#G Aufstiegsprognose für gewählten Zeitraum#!"
 eu5ab_status_conservative_fallback: "#L Konservative Schätzung mit aktuellen Arbeitskräften#!"
 eu5ab_prediction_promotion_short_desc: "Fügt Arbeitskräfte hinzu, die innerhalb der Frist in die benötigten Stellen aufsteigen können, bis 96 Monate."
 eu5ab_prediction_unavailable_short_desc: "Ohne verlässliche Prognose werden nur aktuell verfügbare Arbeitskräfte verwendet."
 eu5ab_workforce_help: "Mit Pausierung startet ein Projekt nicht, wenn seine Stellen voraussichtlich nicht fristgerecht besetzt werden; sonst sinkt nur seine Priorität. Die Prognose von 0–96 Monaten addiert verfügbare und aufstiegsfähige Personen, ohne künftige Migration anzunehmen oder die geeignete lokale Bevölkerung zu überschreiten."
 eu5ab_native_input_section_title: "Präferenz für lokale Inputs"
 eu5ab_native_input_short_desc: "Wertet Gebäude auf, deren Rohstoffe in derselben Provinz vorkommen."
 eu5ab_native_input_priority_label: "Priorität lokaler Inputs"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorität lokaler Inputs: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Lokal bezeichnet die Provinz des Gebäudes. Inputs mit größerem Rezeptanteil geben mehr Punkte, wenn ein passendes RGO in der Provinz existiert. 0 ignoriert lokale Rohstoffe, 5 ist Standard, 10 gewichtet sie am stärksten. Dies ändert nur die Rangfolge; Mangel, Gewinn, Arbeitskräfte und andere Bedingungen können weiterhin ein anderes Projekt wählen. Schlechter Marktzugang, geringe Kontrolle und Inputmangel senken den Bonus; RGOs erhalten ihn nicht."
 eu5ab_price_section_title: "Preisspanne"
 eu5ab_price_short_desc: "Filtert und ordnet Produktionsgebäude nach Marktpreis."
 eu5ab_price_min_label: "Mindestpreis"
 eu5ab_price_max_label: "Höchstpreis"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Preise werden als Anteil des Grundpreises gemessen. Ein Gebäude wird unter dem Mindestpreis ausgeschlossen und erhält über dem Höchstpreis einen Mangelbonus. Infrastruktur ohne Produkt ist nicht begrenzt."
 eu5ab_active_cash_value: "Schatzreserve: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Mindestpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Höchstpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Mindestpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Höchstpreis: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Regeln für automatisierten Bau"
 eu5ab_prediction_diagnostics_title: "Arbeitskräfteschätzung und Baustatus"
 eu5ab_prediction_section_body: "Der Mod prüft Verbesserungen, normale Erweiterungen, RGO-Erweiterungen und Neubauten in der Automatischen Baureihenfolge. Solange ein Projekt des aktuellen Typs begonnen werden kann, wechselt er nicht zum nächsten Typ. Wenn Nahrung voraussichtlich ausgeht oder höchstens 25 % übrig sind, werden Nahrungsprojekte zuerst behandelt und müssen die gewählte Rendite nicht erfüllen. Schwerer Mangel an Baumaterial, militärischen Gütern im Krieg oder strategischen Vorprodukten kann die Renditeanforderung ebenfalls lockern, ohne die Typreihenfolge zu ändern. Jahresbudget, Schatzreserve, Materialien, Inputs, Arbeitskräfte und Spielregeln gelten immer. Nur die neueste freigeschaltete Stufe wird berücksichtigt; bei Verbesserungen zählen nur neue Stellen."
 eu5ab_diagnostics_title: "Status des automatisierten Baus"
 eu5ab_diagnostics_snapshot_note: "Einstellungen werden sofort gespeichert; der Baubericht wird nach jeder monatlichen Prüfung aktualisiert."
 eu5ab_diagnostics_snapshot_help: "Diese Seite zeigt die letzte am 22. abgeschlossene Prüfung, keine Live-Daten. Nach Änderungen an Einstellungen oder Vorlagenabdeckung werden Kapazität, Starts, Ablehnungsgründe und Kandidaten mit der nächsten Monatsprüfung gemeinsam aktualisiert."
