 eu5ab_building_rules_title: "Gebäuderegeln"
 eu5ab_building_rules_desc: "Filtere in der ersten Zeile nach Arbeitskräften und in der zweiten nach Freischaltungszeitalter. Prioritäten reichen von 0,0 bis 10,0; 0 verbietet den Bau. Die Seite Spezial zeigt nur Sondergebäude, die das Land an mindestens einem eigenen Ort bauen kann."
