 eu5ab_cash_section_title: "Schatzreserve"
 eu5ab_cash_short_desc: "Mindestbetrag, der in der Staatskasse verbleiben muss."
 eu5ab_cash_label: "Schatzreserve"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] Gold"
 eu5ab_cash_help: "Die Schatzreserve ist der Mindestbetrag, der nach Baubeginn verbleiben muss; sie wird nicht zusätzlich abgezogen. Ein Projekt wird blockiert, wenn seine Kosten die Staatskasse unter diesen Wert senken. Beispiel: Bei 1.050 Gold, 1.000 Reserve und 100 Kosten beginnt der Bau nicht."
 eu5ab_budget_section_title: "Jährliches Strategiebudget"
 eu5ab_budget_short_desc: "Wähle einen festen Betrag oder ein an das Monatseinkommen gekoppeltes Budget; beide Modi schließen sich aus."
 eu5ab_budget_mode_fixed: "Festes Budget"
 eu5ab_budget_mode_income: "Einkommensabhängig"
 eu5ab_budget_multiplier_4: "×4 Konservativ"
 eu5ab_budget_multiplier_6: "×6 Empfohlen"
 eu5ab_budget_multiplier_8: "×8 Aktiv"
 eu5ab_budget_effective_label: "Budget des laufenden Jahres"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] Gold"
 eu5ab_budget_label: "Jahresbudget"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] Gold/Jahr"
 eu5ab_budget_cash_comparison: "Das jährliche Strategiebudget begrenzt die jährlichen Ausgaben dieses Mods; die Reserve legt den Mindestbestand der Staatskasse fest. Beide Bedingungen müssen erfüllt sein."
 eu5ab_budget_reset_note: "Fester und einkommensabhängiger Modus schließen sich aus. Das Budget wird bei der ersten Januarprüfung zurückgesetzt und erst nach Aufnahme eines Projekts in die Warteschlange abgezogen."
 eu5ab_budget_help: "Alle Vorlagen teilen sich ein nationales Jahresbudget. Wähle einen festen Betrag oder das 4-, 6- oder 8-Fache des monatlichen Gesamteinkommens. Das einkommensabhängige Budget wird bei der ersten Januarprüfung berechnet und bleibt im Jahr fest. Gebäude nutzen die Spielkosten, RGOs ihre Basiskosten. Abzug erfolgt erst beim Eintritt in die Warteschlange."
 eu5ab_quota_section_title: "Gleichzeitiges Baulimit dieses Mods"
 eu5ab_quota_short_desc: "Legt fest, wie viele zusätzliche Zivilprojekte dieser Mod neben dem Grundplatz gleichzeitig ausführen darf."
 eu5ab_hard_cap_label: "Zusätzliche gleichzeitige Projekte"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] Projekte (Gesamtlimit ist dieser Wert + 1)"
 eu5ab_quota_help: "0 erlaubt höchstens 1 aktives Zivilprojekt, 599 höchstens 600. Es zählen nur von diesem Mod gestartete, noch laufende Projekte; manuelle Bauten, Straßen und andere Mods nicht. Jede Monatsprüfung füllt nur freie Plätze, höchstens ein Projekt je Ort; RGOs haben kein eigenes Monatslimit."
