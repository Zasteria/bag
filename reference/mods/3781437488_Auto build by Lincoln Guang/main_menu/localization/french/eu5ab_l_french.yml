 eu5ab_template_intro_title: "Éditeur de modèles"
 eu5ab_automation_buildings_intro: "Les priorités des bâtiments des modèles personnalisés peuvent être modifiées et ceux-ci peuvent être attribués librement. Les modèles thématiques sont en lecture seule et peuvent être copiés en modèles personnalisés pour être modifiés."
