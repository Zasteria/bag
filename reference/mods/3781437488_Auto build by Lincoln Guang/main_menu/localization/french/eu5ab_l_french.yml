 eu5ab_operating_rules_title: "Règles de construction"
 eu5ab_operating_rules_short_desc: "Configurez les bâtiments spéciaux, les constructions en amont et les pénuries d'intrants."
 eu5ab_operating_rules_help: "Les bâtiments spéciaux doivent toujours respecter les conditions du jeu. Si la construction de sources est activée, le Mod cherche un producteur en amont lorsqu'une pénurie bloque une usine. Avec la protection contre les pénuries critiques, les projets trop risqués ne démarrent pas."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Autoriser ce modèle à développer les RGO"
 eu5ab_rgo_short_desc: "Les RGO doivent respecter les conditions du jeu, l'utilisation, le budget et la réserve."
 eu5ab_rgo_utilization_label: "Utilisation minimale"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Cette option décide si le modèle considère les RGO. Ils doivent toujours respecter les règles du jeu, l'utilisation minimale, le budget annuel et la réserve. L'ordre automatique détermine quand ils sont vérifiés ; leur classement utilise pénurie, prix, utilisation et besoin stratégique. Désactivez l'expansion automatique des RGO du jeu pour éviter les doublons."
 eu5ab_toggle_special_buildings: "Autoriser les bâtiments spéciaux"
 eu5ab_toggle_auto_build_input_sources: "Construire les sources en cas de manque d'intrants"
 eu5ab_toggle_pause_low_workforce: "Suspendre l'expansion si la main-d'œuvre est insuffisante"
 eu5ab_ranking_mode_section_title: "Stratégie de décision de construction"
 eu5ab_ranking_mode_current_label: "Mode actuel"
 eu5ab_ranking_mode_composite_value: "#G Planification de l'offre et de la demande#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Sélection par bénéfice prévu#!"
 eu5ab_ranking_mode_common_desc: "Les deux stratégies ne considèrent que les bâtiments déverrouillés et constructibles avec une priorité supérieure à 0. Elles exigent aussi rendement, budget, réserve, intrants, main-d'œuvre et autres règles de sécurité. Les urgences alimentaires et l'ordre automatique passent avant tout."
 eu5ab_ranking_mode_composite_desc: "Classe les projets selon les pénuries du marché, les besoins stratégiques, l'efficacité des recettes, les intrants locaux, les prix et le risque de main-d'œuvre, en favorisant les chaînes complètes et la stabilité à long terme."
 eu5ab_ranking_mode_actual_profit_desc: "Filtre les candidats selon les règles du modèle et de sécurité, puis choisit d'après le bénéfice mensuel prévu par le jeu. La priorité 0–10 n'influence que légèrement les bénéfices proches."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Cette stratégie choisit seulement parmi 3–30 candidats préfiltrés par lieu et type actuel ; elle ne garantit donc pas le bénéfice maximal mondial. Rendement et règles de sécurité sont revérifiés avant la construction. Les RGO restent classés par pénurie, prix, utilisation et besoin stratégique."
 eu5ab_ranking_mode_help: "Changez de stratégie dans les paramètres de mod de Community Mod Framework. La planification offre-demande privilégie marchés, chaînes et stabilité. La sélection par bénéfice prévu utilise le bénéfice mensuel du jeu et la priorité 0–10 comme influence légère."
 eu5ab_workforce_section_title: "Main-d'œuvre"
 eu5ab_pause_workforce_short_desc: "Détermine si le risque de main-d'œuvre bloque l'expansion."
 eu5ab_job_fill_deadline_label: "Délai de pourvoi des emplois"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] mois"
 eu5ab_job_fill_deadline_value: "Délai de pourvoi : [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] mois"
 eu5ab_job_fill_deadline_desc: "Délai maximal pour pourvoir les nouveaux emplois, de 0 à 96 mois. 0 n'accepte que la main-d'œuvre actuelle. Avec la pause activée, les projets hors délai ne démarrent pas ; sinon le risque réduit seulement leur priorité."
 eu5ab_deadline_0: "0 mois"
 eu5ab_deadline_3: "3 mois"
 eu5ab_deadline_6: "6 mois"
 eu5ab_deadline_12: "12 mois"
 eu5ab_toggle_stop_input_shortage: "Arrêter l'expansion en cas de pénurie critique d'intrants"
 eu5ab_prediction_status_label: "Estimation de la main-d'œuvre"
 eu5ab_status_promotion_forecast: "#G Prévision des promotions sur l'horizon choisi#!"
 eu5ab_status_conservative_fallback: "#L Estimation prudente avec la main-d'œuvre actuelle#!"
 eu5ab_prediction_promotion_short_desc: "Ajoute les travailleurs pouvant être promus aux emplois requis dans le délai, jusqu'à 96 mois."
 eu5ab_prediction_unavailable_short_desc: "Sans prévision fiable, utilise uniquement les travailleurs actuellement disponibles."
 eu5ab_workforce_help: "Avec la pause activée, un projet ne démarre pas si ses emplois ne devraient pas être pourvus à temps ; sinon le risque réduit sa priorité. La prévision de 0–96 mois additionne travailleurs disponibles et personnes promouvables, sans supposer de migration future ni dépasser la population locale éligible."
 eu5ab_native_input_section_title: "Préférence pour les intrants locaux"
 eu5ab_native_input_short_desc: "Améliore le classement des bâtiments utilisant des matières premières de la même province."
 eu5ab_native_input_priority_label: "Priorité des intrants locaux"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Priorité des intrants locaux : [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Local désigne la province du bâtiment. Les intrants représentant une plus grande part de la recette donnent plus de score si un RGO correspondant existe dans la province. 0 ignore les matières premières locales, 5 est la valeur par défaut et 10 leur donne le plus de poids. Cela ne change que le classement ; pénurie, bénéfice, main-d'œuvre et autres conditions peuvent choisir un autre projet. Mauvais accès au marché, faible contrôle et pénurie réduisent le bonus ; les RGO ne le reçoivent pas."
 eu5ab_price_section_title: "Plage de prix"
 eu5ab_price_short_desc: "Filtre et classe les bâtiments de production selon le prix du marché."
 eu5ab_price_min_label: "Prix minimal"
 eu5ab_price_max_label: "Prix maximal"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Les prix sont des pourcentages du prix de base. Un bâtiment est exclu si le prix de sa production est sous le minimum et reçoit un bonus de pénurie au-dessus du maximum. L'infrastructure sans production n'est pas limitée."
 eu5ab_active_cash_value: "Réserve du trésor : [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Prix minimal : [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Prix maximal : [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Prix minimal : [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Prix maximal : [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Règles de construction automatisée"
 eu5ab_prediction_diagnostics_title: "Estimation de la main-d'œuvre et état de la construction"
 eu5ab_prediction_section_body: "Le Mod vérifie les améliorations, extensions ordinaires, extensions de RGO et nouveaux bâtiments selon l'Ordre de construction automatisée. Il ne passe au type suivant qu'en l'absence de projet réalisable du type actuel. Si les réserves alimentaires vont s'épuiser ou tombent à 25 % ou moins, les projets alimentaires passent en premier et ignorent le rendement choisi. Une grave pénurie de matériaux de construction, de biens militaires en guerre ou d'intrants stratégiques peut aussi lever cette exigence, sans changer l'ordre des types. Budget annuel, réserve du trésor, matériaux, intrants, main-d'œuvre et règles du jeu s'appliquent toujours. Seul le niveau débloqué le plus récent est considéré ; une amélioration ne compte que les nouveaux emplois."
 eu5ab_diagnostics_title: "État de la construction automatisée"
 eu5ab_diagnostics_snapshot_note: "Les paramètres sont enregistrés immédiatement ; le rapport de construction est actualisé après chaque vérification mensuelle."
 eu5ab_diagnostics_snapshot_help: "Cette page affiche la dernière vérification achevée le 22, et non des données en direct. Après avoir modifié les paramètres ou la couverture des modèles, attendez la prochaine vérification mensuelle : capacité, lancements, rejets et candidats seront alors actualisés ensemble."
