 eu5ab_cash_section_title: "Réserve du trésor"
 eu5ab_cash_short_desc: "Solde minimal devant rester dans le trésor."
 eu5ab_cash_label: "Réserve du trésor"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] or"
 eu5ab_cash_help: "La réserve du trésor est le solde minimal qui doit rester après le début des travaux ; elle n'est pas prélevée séparément. Un projet est bloqué si son coût fait passer le trésor sous ce seuil. Exemple : avec 1 050 or, une réserve de 1 000 et un coût de 100, la construction ne démarre pas."
 eu5ab_budget_section_title: "Budget stratégique annuel"
 eu5ab_budget_short_desc: "Choisissez un montant fixe ou un budget lié au revenu mensuel ; les modes sont exclusifs."
 eu5ab_budget_mode_fixed: "Budget fixe"
 eu5ab_budget_mode_income: "Lié au revenu"
 eu5ab_budget_multiplier_4: "×4 Prudent"
 eu5ab_budget_multiplier_6: "×6 Recommandé"
 eu5ab_budget_multiplier_8: "×8 Actif"
 eu5ab_budget_effective_label: "Budget de l'année en cours"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] or"
 eu5ab_budget_label: "Budget annuel"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] or/an"
 eu5ab_budget_cash_comparison: "Le budget stratégique annuel limite les dépenses annuelles de ce Mod ; la réserve fixe ce qui doit rester dans le trésor. Les deux conditions doivent être remplies."
 eu5ab_budget_reset_note: "Les modes fixe et lié au revenu sont exclusifs. Le budget est réinitialisé lors du premier contrôle de janvier et déduit seulement après l'entrée du projet dans la file."
 eu5ab_budget_help: "Tous les modèles partagent un budget national annuel. Choisissez un montant fixe ou 4, 6 ou 8 fois le revenu mensuel total. Le budget lié au revenu est calculé lors du premier contrôle de janvier et reste fixe pour l'année. Les bâtiments utilisent le coût réel du jeu, les RGO leur coût de base. Le budget n'est déduit qu'à l'entrée du projet dans la file."
 eu5ab_quota_section_title: "Limite de constructions simultanées de ce Mod"
 eu5ab_quota_short_desc: "Définit combien de projets civils supplémentaires ce Mod peut mener au-delà de l'emplacement de base."
 eu5ab_hard_cap_label: "Projets simultanés supplémentaires"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projets (la limite totale est cette valeur + 1)"
 eu5ab_quota_help: "0 autorise au plus 1 projet civil actif et 599 en autorise 600. Seuls les projets lancés par ce Mod et encore en construction comptent ; les travaux manuels, routes et autres Mods sont exclus. Chaque contrôle mensuel ne remplit que les places restantes, avec un projet au plus par lieu, et les RGO n'ont pas de limite mensuelle séparée."
