 eu5ab_template_paused_badge: " (En pause)"
 eu5ab_pause_template_tooltip: "Mettez temporairement ce modèle en pause ou reprenez-le. La pause conserve les priorités des bâtiments et les liaisons des lieux, mais la construction automatisée ne l'utilise pas."
 eu5ab_select_template_tooltip: "Sélectionnez ce modèle et consultez le détail de ses règles."
 eu5ab_preset_readonly_desc: "Ce modèle thématique en lecture seule peut être mis en pause, repris et attribué indépendamment. Copiez-le comme modèle personnalisé pour modifier les priorités des bâtiments. Modifiez les règles communes dans les paramètres de mod de Community Mod Framework."
 eu5ab_template_name_pencil_hint: "Nom du modèle"
 eu5ab_template_name_click_hint: "Cliquez sur le nom pour le renommer"
 eu5ab_template_name_click_tooltip: "Saisissez un nouveau nom pour le modèle actuel."
 eu5ab_template_rename_desc: "Saisissez un nouveau nom pour le modèle actuel. En raison des limites de l'interface du jeu, le nom personnalisé n'est affiché que pendant cette session ; les autres règles et liaisons de lieux du modèle restent enregistrées."
 eu5ab_template_rename_input: "Nom du modèle"
 eu5ab_template_rename_accept: "Confirmer"
 eu5ab_template_rename_cancel: "Annuler"
 eu5ab_target_location_title: "Lieu cible"
 eu5ab_target_location_desc: "Choisissez un lieu avant d'effacer ses paramètres ou d'arrêter les mises à jour du modèle provincial. Pour attribuer un modèle, utilisez les boutons de sélection de sa carte."
 eu5ab_template_editor_desc: "Configurez les priorités des bâtiments et la couverture de ce modèle. Le budget, le marché, la main-d'œuvre et les règles de sécurité de construction communs au pays se règlent dans les paramètres de mod de Community Mod Framework."
 eu5ab_template_auto_save_hint: "Les modifications sont enregistrées immédiatement. Fermez la fenêtre pour revenir."
