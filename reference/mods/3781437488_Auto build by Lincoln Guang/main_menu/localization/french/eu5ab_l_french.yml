 eu5ab_building_rules_title: "Règles de construction"
 eu5ab_building_rules_desc: "Filtrez par main-d'œuvre sur la première ligne et par époque de déverrouillage sur la seconde. Les priorités vont de 0,0 à 10,0 ; 0 désactive la construction. La page Spécial ne montre que les bâtiments spéciaux constructibles dans au moins un lieu possédé."
