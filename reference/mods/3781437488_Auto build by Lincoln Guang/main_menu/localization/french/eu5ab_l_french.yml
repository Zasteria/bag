 eu5ab_regional_development__automation__workforce_name: "Prévision de la main-d'œuvre"
 eu5ab_regional_development__automation__workforce_desc: "Horizon commun pour pourvoir les nouveaux emplois."
 eu5ab_regional_development__automation__ranking_name: "Stratégie de décision de construction"
 eu5ab_regional_development__automation__ranking_desc: "Choisissez la stratégie des bâtiments ordinaires, ordonnez améliorations, extensions, RGO et nouvelles constructions, et réglez l'influence des intrants locaux."
 eu5ab_regional_development__candidate_ranking_mode_name: "Stratégie des bâtiments ordinaires"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Choisissez le classement final après les conditions. L'urgence alimentaire et l'Ordre de construction passent d'abord ; les RGO utilisent pénurie, prix, utilisation et besoin stratégique."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Offre et demande"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Classe les projets selon les pénuries du marché, les besoins stratégiques, l'efficacité des recettes, les intrants locaux, les prix et le risque de main-d'œuvre, en favorisant les chaînes complètes et la stabilité à long terme."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Bénéfice prévu"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtre les candidats selon les règles du modèle et de sécurité, puis choisit d'après le bénéfice mensuel prévu par le jeu. La priorité 0–10 n'influence que légèrement les bénéfices proches."
 eu5ab_regional_development__automation__candidate_priority_name: "Ordre de construction automatisée"
 eu5ab_regional_development__automation__candidate_priority_desc: "Faites glisser les quatre types pour définir l'ordre. Le Mod épuise les projets réalisables du type actuel avant d'avancer et cherche des solutions du même type. En urgence alimentaire, les projets alimentaires passent d'abord tout en gardant cet ordre."
 eu5ab_regional_development__candidate_priority_name: "Ordre de construction automatisée"
 eu5ab_regional_development__candidate_priority_desc: "Faites glisser pour ordonner améliorations, extensions ordinaires, extensions RGO et nouveaux bâtiments."
 eu5ab_regional_development__candidate_priority_item_column_name: "Type de construction"
 eu5ab_regional_development__candidate_priority_i1_name: "Améliorer les bâtiments"
 eu5ab_regional_development__candidate_priority_i1_desc: "Remplacez un bâtiment obsolète par le niveau débloqué le plus récent de sa chaîne."
 eu5ab_regional_development__candidate_priority_i2_name: "Étendre les bâtiments existants"
 eu5ab_regional_development__candidate_priority_i2_desc: "Ajoutez un niveau à un bâtiment ordinaire existant, hors remplacements et RGO."
 eu5ab_regional_development__candidate_priority_i3_name: "Étendre les lieux de ressources"
 eu5ab_regional_development__candidate_priority_i3_desc: "Étendez le RGO local en conservant les protections d'utilisation, budget annuel, réserve du trésor et autres."
 eu5ab_regional_development__candidate_priority_i4_name: "Construire de nouveaux bâtiments"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construisez de zéro un bâtiment ordinaire qui n'existe pas encore dans le lieu."
 eu5ab_regional_development__enabled_name: "Activer la construction automatisée"
 eu5ab_regional_development__enabled_desc: "Si désactivé, modèles et liaisons restent enregistrés, mais la construction automatisée mensuelle s'arrête."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Projets simultanés supplémentaires"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Projets civils simultanés au-delà de l'emplacement de base. 0 en autorise 1 au total et 599 en autorise 600. Constructions manuelles, routes et autres Mods ne comptent pas."
 eu5ab_regional_development__budget_mode_name: "Mode de budget annuel"
 eu5ab_regional_development__budget_mode_desc: "Choisissez un montant fixe ou créez la réserve annuelle commune comme multiple du revenu mensuel total."
 eu5ab_regional_development__budget_mode_option_1_name: "Budget annuel fixe"
 eu5ab_regional_development__budget_mode_option_2_name: "Revenu mensuel ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Revenu mensuel ×6 (recommandé)"
 eu5ab_regional_development__budget_mode_option_4_name: "Revenu mensuel ×8"
 eu5ab_regional_development__economic_metric_name: "Mesure du rendement de la construction automatisée"
 eu5ab_regional_development__economic_metric_desc: "Choisissez le rendement minimal des bâtiments ordinaires : revenu ou bénéfice mensuel positif, ou ROI annuel de 5 %. L'infrastructure sans production est exemptée ; les RGO suivent leurs propres règles."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Revenu"
 eu5ab_regional_development__economic_metric_option_1_desc: "Lancez uniquement si le jeu prévoit un revenu mensuel positif."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Bénéfice"
 eu5ab_regional_development__economic_metric_option_2_desc: "Lancez uniquement si le jeu prévoit un bénéfice mensuel total positif."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Rendement du revenu"
 eu5ab_regional_development__economic_metric_option_3_desc: "Lancez uniquement si le revenu mensuel prévu représente au moins 5 % annualisés du coût de construction."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Rendement du bénéfice"
 eu5ab_regional_development__economic_metric_option_4_desc: "Lancez uniquement si le bénéfice mensuel prévu représente au moins 5 % annualisés du coût de construction."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Épuisement alimentaire prévu : construire d'abord, ignorer le rendement"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Si les aliments vont s'épuiser, traitez d'abord les projets alimentaires et levez le rendement des bâtiments alimentaires ordinaires. L'ordre et toutes les autres règles restent valables."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Aliments à 25 % ou moins : construire d'abord, ignorer le rendement"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Avec 25 % d'aliments ou moins, traitez d'abord les projets alimentaires et levez le rendement des bâtiments alimentaires ordinaires ; les autres règles restent valables."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Offre de construction sous 65 % : ignorer le rendement"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Si un matériau essentiel reçoit moins de 65 % de l'offre requise, ses producteurs ignorent le rendement. Les autres règles restent valables."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Offre militaire en guerre sous 65 % : ignorer le rendement"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "En guerre, si un bien militaire reçoit moins de 65 % de l'offre requise, ses producteurs ignorent le rendement ; les autres règles restent valables."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Production stratégique sans intrants : ignorer le rendement en amont"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Si un intrant en amont sous 65 % bloque une production nationale alimentaire, de construction ou militaire, ses producteurs ignorent le rendement ; les autres règles restent valables."
 eu5ab_regional_development__fixed_annual_budget_name: "Budget annuel fixe"
 eu5ab_regional_development__fixed_annual_budget_desc: "Utilisé uniquement en mode fixe ; tous les modèles partagent ce montant."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Réserve minimale du trésor"
 eu5ab_regional_development__min_cash_reserve_desc: "Or qui doit rester dans le trésor après le lancement d'un projet."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Pourcentage de prix minimal"
 eu5ab_regional_development__price_min_desc: "Une production sous ce pourcentage du prix de base est normalement considérée excédentaire."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Pourcentage de référence de prix élevé"
 eu5ab_regional_development__price_max_desc: "Une production au-dessus de ce pourcentage du prix de base reçoit un bonus de classement."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Autoriser les bâtiments spéciaux"
 eu5ab_regional_development__allow_special_buildings_desc: "Autorisez les bâtiments spéciaux ; les conditions de construction du jeu restent valables."
 eu5ab_regional_development__auto_build_input_sources_name: "Construire les sources en amont en cas de pénurie"
 eu5ab_regional_development__auto_build_input_sources_desc: "Si un bâtiment prévu ne peut commencer faute d'intrants, essayez une source en amont autorisée."
 eu5ab_regional_development__pause_low_workforce_name: "Suspendre si la main-d'œuvre manque"
 eu5ab_regional_development__pause_low_workforce_desc: "Ne construisez pas si les emplois ne peuvent être pourvus dans la période prévue."
 eu5ab_regional_development__stop_input_shortage_name: "Arrêter en cas de pénurie d'intrants critiques"
 eu5ab_regional_development__stop_input_shortage_desc: "Ne construisez pas les projets concernés tant que les intrants critiques du marché sont sous-approvisionnés."
 eu5ab_regional_development__allow_rgo_name: "Autoriser l'extension RGO"
 eu5ab_regional_development__allow_rgo_desc: "Autorisez tous les modèles à envisager l'extension des lieux de ressources."
 eu5ab_regional_development__rgo_min_utilization_name: "Utilisation minimale du RGO"
 eu5ab_regional_development__rgo_min_utilization_desc: "N'étendez pas un RGO sous ce niveau d'utilisation."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Horizon de recrutement (mois)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Horizon de prévision des promotions locales vers les nouveaux emplois."
 eu5ab_regional_development__native_input_priority_name: "Priorité des intrants locaux"
 eu5ab_regional_development__native_input_priority_desc: "0–10 ; des valeurs élevées favorisent les bâtiments utilisant les matières premières de la même province."
 eu5ab_regional_development__performance_preset_name: "Préréglage de performances"
 eu5ab_regional_development__performance_preset_desc: "Un préréglage synchronise les options avancées ci-dessous. Personnalisé conserve leurs valeurs actuelles."
 eu5ab_regional_development__performance_preset_option_1_name: "Prudent"
 eu5ab_regional_development__performance_preset_option_1_desc: "Vérifie jusqu'à 10 lieux par jour et lance au plus 30 projets par passage. Candidats de planification : 5 ; de bénéfice : 15. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_2_name: "Équilibrée"
 eu5ab_regional_development__performance_preset_option_2_desc: "Vérifie jusqu'à 20 lieux par jour et lance au plus 50 projets par passage. Candidats de planification : 4 ; de bénéfice : 12. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_3_name: "Débit maximal"
 eu5ab_regional_development__performance_preset_option_3_desc: "Pour les pays avec beaucoup de lieux. Vérifie jusqu'à 30 lieux par jour sans limite par passage. Candidats de planification : 3 ; de bénéfice : 10. S'arrête dès qu'il y en a assez."
 eu5ab_regional_development__performance_preset_option_4_name: "Personnalisé"
 eu5ab_regional_development__performance_preset_option_4_desc: "Utilisez les paramètres avancés actuels."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "De nombreux lieux avec modèles peuvent réduire les performances."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Débit maximal traite jusqu'à 30 lieux par jour sans limiter les ajouts par passage. Beaucoup de lieux peuvent ralentir le bilan mensuel."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Ralentissement Offre et demande : réduisez les Candidats de planification."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Affiché uniquement en Offre et demande. Moins de Candidats de planification réduit les projets par lieu et type envoyés aux vérifications suivantes."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Compromis : moins de solutions peuvent manquer des projets réalisables."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Les candidats suivent le même score de planification. Une limite basse laisse moins de solutions si les premiers échouent et peut ne pas vérifier un projet ultérieur réalisable."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Ralentissement de sélection du bénéfice : réduisez les Candidats de bénéfice."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Affiché uniquement avec la Sélection par bénéfice prévu. Moins de Candidats de bénéfice réduit les projets par lieu et type envoyés aux vérifications de bénéfice et coût du jeu."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Compromis : une liste réduite peut manquer des bâtiments réellement rentables."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "La sélection du bénéfice préfiltre par score puis classe selon le bénéfice prévu. Une limite basse peut éliminer un bâtiment rentable au préfiltrage."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Réduisez aussi les lieux quotidiens ou les ajouts par passage."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Moins de lieux par jour répartit le balayage sur davantage de jours. Moins d'ajouts réduit les vérifications et lancements par passage. Vous pouvez aussi changer le préréglage ; zéro ajout signifie illimité."
 eu5ab_regional_development__parallel_location_scan_name: "Traiter les lieux séparément"
 eu5ab_regional_development__parallel_location_scan_desc: "Vérifiez les lieux séparément pour réduire la durée d'une mise à jour. Cela ne change ni le classement, ni le budget, ni l'ordre."
 eu5ab_regional_development__daily_location_task_limit_name: "Lieux vérifiés par jour"
 eu5ab_regional_development__daily_location_task_limit_desc: "Maximum de lieux vérifiés en détail par jour, de 1 à 30. Une valeur basse réduit le traitement quotidien mais allonge la couverture du pays."
 eu5ab_regional_development__max_additions_per_run_name: "Ajouts maximum par passage"
 eu5ab_regional_development__max_additions_per_run_desc: "Limitez les projets lancés en un passage, de 0 à 600. Zéro signifie illimité."
 eu5ab_regional_development__candidates_per_location_name: "Candidats de planification par lieu"
 eu5ab_regional_development__candidates_per_location_desc: "Uniquement en Offre et demande. Conserve 3 à 30 candidats par lieu et type. Plus de candidats offrent des solutions si les premiers échouent, mais augmentent les vérifications."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidats de bénéfice par lieu"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Uniquement en Sélection par bénéfice. Envoie 3 à 30 candidats par lieu et type à la comparaison du jeu. Plus de candidats réduit les omissions mais augmente les vérifications."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Arrêter quand assez de candidats sont trouvés"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Quand les candidats admissibles atteignent deux fois le maximum du passage, cessez de vérifier les lieux restants."
 eu5ab_diagnostics_cmm_hint: "Modifiez les règles communes dans les Paramètres de mod de Community Mod Framework. Le rapport de construction affiche le dernier résultat automatisé."
