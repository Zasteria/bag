l_korean:
 eu5ab_window_title: "지역 개발 및 자동 건설"
 eu5ab_template_editor_title: "지역 개발 템플릿 편집"
 eu5ab_template_buildings_window_title: "건물 규칙"
 eu5ab_template_rules_window_title: "건설 보고서"
 eu5ab_template_rename_window_title: "템플릿 이름 변경"
 eu5ab_template_scope_window_title: "현재 적용 범위"
 eu5ab_automation_buildings_tab: "자동 건설"
 eu5ab_automation_buildings_tab_desc: "템플릿, 건물 우선순위 및 적용 범위를 관리합니다. 모든 템플릿이 공유하는 규칙은 Community Mod Framework 모드 설정에서 변경하십시오."
 eu5ab_action_bar_name: "Advanced Auto Build"
 eu5ab_action_bar_tooltip: "지역 개발 템플릿 패널을 열어 건물 우선순위와 적용 범위를 설정하고 최근 자동 건설 보고서를 확인합니다."
 eu5ab_action_bar_icon: "@production_panel!"
 eu5ab_action_bar_color: "gold"
 eu5ab_template_overview_title: "지역 개발 템플릿"
 eu5ab_presets_tab: "테마 템플릿"
 eu5ab_presets_tab_tooltip: "여러 개발 목표에 맞춘 읽기 전용 건물 우선순위입니다."
 eu5ab_custom_tab: "사용자 지정 템플릿"
 eu5ab_custom_tab_tooltip: "건물 우선순위와 적용 범위를 직접 설정합니다."
 eu5ab_sidebar_title: "템플릿"
 eu5ab_detail_title: "규칙 세부 정보"
 eu5ab_new_template_plus_button: "+ 새 템플릿"
 eu5ab_new_blank_template_button: "+ 빈 템플릿"
 eu5ab_new_recommended_template_button: "+ 추천 템플릿"
 eu5ab_custom_empty_detail: "왼쪽 목록에서 사용자 지정 템플릿을 선택하거나 빈 템플릿 또는 추천 우선순위가 적용된 템플릿을 만드십시오."
 eu5ab_template_intro_title: "템플릿 편집기"
 eu5ab_automation_buildings_intro: "사용자 지정 템플릿은 건물 우선순위를 자유롭게 편집하고 할당할 수 있습니다. 테마 템플릿은 읽기 전용이며 사용자 지정 템플릿으로 복사한 뒤 편집할 수 있습니다."
 eu5ab_player_templates_button: "플레이어 템플릿"
 eu5ab_copy_preset_to_player_button: "플레이어 템플릿으로 복사"
 eu5ab_delete_template_button: "템플릿 삭제"
 eu5ab_delete_template_tooltip: "이 사용자 지정 템플릿을 삭제합니다. 확인하면 이 템플릿을 사용하는 모든 지점의 할당도 해제됩니다."
 eu5ab_delete_template_confirm_prompt: "현재 템플릿을 삭제하시겠습니까?"
 eu5ab_delete_template_confirm_button: "삭제 확인"
 eu5ab_delete_template_confirm_tooltip: "현재 템플릿과 모든 지점 연결을 영구적으로 삭제합니다. 지점은 미할당 상태로 돌아갑니다. 이 작업은 되돌릴 수 없습니다."
 eu5ab_delete_template_cancel_button: "취소"
 eu5ab_delete_template_cancel_tooltip: "삭제를 취소하고 템플릿 작업으로 돌아갑니다."
 eu5ab_pause_template_button: "템플릿 일시정지"
 eu5ab_resume_template_button: "템플릿 재개"
 eu5ab_template_paused_badge: " (일시정지됨)"
 eu5ab_pause_template_tooltip: "이 템플릿을 일시정지하거나 재개합니다. 일시정지해도 건물 우선순위와 지점 연결은 유지되지만 자동 건설에서는 사용하지 않습니다."
 eu5ab_select_template_tooltip: "이 템플릿을 선택하고 규칙 세부 정보를 확인합니다."
 eu5ab_preset_readonly_desc: "이 읽기 전용 테마 템플릿은 개별적으로 일시정지, 재개 및 할당할 수 있습니다. 건물 우선순위를 편집하려면 사용자 지정 템플릿으로 복사하십시오. 공유 규칙은 Community Mod Framework 모드 설정에서 변경합니다."
 eu5ab_template_name_pencil_hint: "템플릿 이름"
 eu5ab_template_name_click_hint: "이름을 클릭하여 변경"
 eu5ab_template_name_click_tooltip: "현재 템플릿의 새 이름을 입력합니다."
 eu5ab_template_rename_desc: "현재 템플릿의 새 이름을 입력합니다. 게임 인터페이스 제한으로 사용자 지정 이름은 현재 세션에서만 표시되지만 템플릿의 다른 규칙과 지점 연결은 계속 저장됩니다."
 eu5ab_template_rename_input: "템플릿 이름"
 eu5ab_template_rename_accept: "확인"
 eu5ab_template_rename_cancel: "취소"
 eu5ab_target_location_title: "대상 지점"
 eu5ab_target_location_desc: "설정을 지우거나 프로빈스 템플릿 연동을 중지하기 전에 지점을 선택하십시오. 템플릿을 할당하려면 해당 템플릿 카드의 선택 버튼을 사용합니다."
 eu5ab_template_editor_desc: "이 템플릿의 건물 우선순위와 적용 범위를 설정합니다. 전국에서 공유하는 예산, 시장, 노동력 및 건설 안전 규칙은 Community Mod Framework 모드 설정에서 구성합니다."
 eu5ab_template_auto_save_hint: "변경 사항은 즉시 저장됩니다. 창을 닫으면 돌아갑니다."
 eu5ab_rules_tab_finance: "재정 및 건설"
 eu5ab_rules_tab_automation: "노동력 및 건설 선호"
 eu5ab_rules_tab_diagnostics: "건설 보고서"
 eu5ab_template_editor_sections_title: "템플릿 설정"
 eu5ab_template_editor_sections_desc: "각 템플릿은 활성 상태, 적용 범위 및 건물 우선순위를 개별 저장합니다. 최근 월간 결과는 건설 보고서에서 확인할 수 있습니다."
 eu5ab_open_buildings_editor_button: "건물 규칙"
 eu5ab_open_rules_editor_button: "건설 보고서"
 eu5ab_edit_template_button: "편집"
 eu5ab_copy_to_slot_button: "여기에 복사"
 eu5ab_policy_section_title: "템플릿 규칙"
 eu5ab_cash_section_title: "국고 예비금"
 eu5ab_cash_short_desc: "국고에 남겨야 하는 최소 잔액입니다."
 eu5ab_cash_label: "국고 예비금"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] 금화"
 eu5ab_cash_help: "국고 예비금은 건설 시작 후에도 남아 있어야 하는 최소 잔액이며 별도로 차감되는 비용이 아닙니다. 비용 지불 후 국고가 이 값보다 낮아지면 프로젝트가 차단됩니다. 예: 국고 1,050, 예비금 1,000, 비용 100이면 건설을 시작하지 않습니다."
 eu5ab_budget_section_title: "연간 전략 예산"
 eu5ab_budget_short_desc: "고정 금액 또는 월간 총수입 연동 예산을 선택합니다. 두 모드는 동시에 사용할 수 없습니다."
 eu5ab_budget_mode_fixed: "고정 예산"
 eu5ab_budget_mode_income: "수입 연동"
 eu5ab_budget_multiplier_4: "×4 보수적"
 eu5ab_budget_multiplier_6: "×6 권장"
 eu5ab_budget_multiplier_8: "×8 적극적"
 eu5ab_budget_effective_label: "올해 예산"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] 금화"
 eu5ab_budget_label: "연간 예산"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] 금화/년"
 eu5ab_budget_cash_comparison: "연간 전략 예산은 이 Mod가 한 해에 쓸 수 있는 최대액을, 예비금은 국고에 남겨야 할 최소액을 정합니다. 두 조건을 모두 충족해야 합니다."
 eu5ab_budget_reset_note: "고정 금액과 수입 연동 모드는 동시에 사용할 수 없습니다. 매년 1월 첫 검사에서 초기화되며 프로젝트가 대기열에 들어간 뒤에만 차감됩니다."
 eu5ab_budget_help: "모든 템플릿은 국가 단위 연간 예산을 공유합니다. 고정 금액 또는 월간 총수입의 4, 6, 8배를 선택합니다. 수입 연동 예산은 1월 첫 검사에서 계산되어 그해 동안 고정됩니다. 일반 건물은 게임 실제 비용, RGO는 기본 비용을 사용하며 프로젝트가 대기열에 들어간 뒤에만 예산이 차감됩니다."
 eu5ab_quota_section_title: "이 Mod의 동시 건설 한도"
 eu5ab_quota_short_desc: "기본 1개 외에 이 Mod가 동시에 진행할 수 있는 민간 프로젝트 수를 설정합니다."
 eu5ab_hard_cap_label: "추가 동시 프로젝트"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0]개 프로젝트 (총 한도는 이 값 + 1)"
 eu5ab_quota_help: "0이면 활성 민간 프로젝트 최대 1개, 599면 최대 600개입니다. 이 Mod가 시작했고 아직 건설 중인 프로젝트만 계산하며 수동 건설, 도로, 다른 Mod는 제외합니다. 월간 검사에서는 남은 슬롯만 채우고 지점당 동시에 최대 1개를 배정하며 RGO에는 별도 월간 한도가 없습니다."
 eu5ab_template_cash_value: "국고 예비금: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_step_dec_10k: "-10K"
 eu5ab_step_dec_1k: "-1K"
 eu5ab_step_inc_1k: "+1K"
 eu5ab_step_inc_10k: "+10K"
