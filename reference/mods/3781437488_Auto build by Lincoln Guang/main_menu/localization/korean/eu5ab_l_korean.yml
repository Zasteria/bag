 eu5ab_template_slot_1_title: "템플릿 슬롯 1"
 eu5ab_template_slot_1_editor_title: "이 템플릿 편집"
 eu5ab_template_slot_1_buildings_title: "템플릿 슬롯 1: 건물 규칙"
 eu5ab_template_slot_1_locations_title: "템플릿 슬롯 1: 지점 설정"
 eu5ab_template_slot_1_summary: "이 템플릿은 활성 상태, 할당 지점 및 건물 우선순위를 저장합니다. 공유 규칙은 Community Mod Framework 모드 설정에서 변경하며 건설 보고서에서 최근 자동 건설 결과를 확인할 수 있습니다."
