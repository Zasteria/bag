 eu5ab_price_section_desc: "가격은 기본 가격 대비 비율입니다. 산출물 가격이 최저값보다 낮으면 후보에서 제외되고 최고값보다 높으면 부족 보너스를 받습니다. 산출물이 없는 기반 시설은 제한받지 않습니다."
