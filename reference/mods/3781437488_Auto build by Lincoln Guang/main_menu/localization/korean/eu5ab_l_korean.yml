 eu5ab_diag_result_help: "식량 부족 시 식량 사업을 먼저 처리합니다. 그 외에는 자동 건설 순서를 따르며 같은 유형의 대안을 찾습니다. RGO도 게임 조건을 충족해야 하고 부족, 가격, 가동률 및 전략 수요로 정렬됩니다. 건설 대기열에 들어간 뒤에만 성공으로 기록되며 예산과 슬롯을 사용하고 지점 재사용 대기시간이 시작됩니다."
