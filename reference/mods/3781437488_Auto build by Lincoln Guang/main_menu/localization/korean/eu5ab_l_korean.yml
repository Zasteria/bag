 eu5ab_regional_development__automation__ranking_name: "건설 결정 전략"
 eu5ab_regional_development__automation__ranking_desc: "일반 건물 전략, 업그레이드·확장·RGO·신규 건설 순서 및 현지 투입재 영향을 설정합니다."
 eu5ab_regional_development__candidate_ranking_mode_name: "일반 건물 전략"
 eu5ab_regional_development__candidate_ranking_mode_desc: "안전 및 수익 조건 통과 후 최종 순위를 선택합니다. 식량 긴급과 자동 건설 순서가 우선하며 RGO는 부족, 가격, 가동률 및 전략 수요로 정렬됩니다."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "수요·공급 계획"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "시장 부족, 전략 수요, 생산식 효율, 현지 원료, 가격 및 노동력 위험을 종합해 순위를 정하고 완전한 산업망과 장기 안정을 중시합니다."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "예측 이익"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "템플릿 및 안전 규칙으로 후보를 거른 뒤 게임의 예상 월간 이익으로 선택합니다. 이익이 비슷하면 0~10 건물 우선순위가 약하게 영향을 줍니다."
 eu5ab_regional_development__automation__candidate_priority_name: "자동 건설 순서"
 eu5ab_regional_development__automation__candidate_priority_desc: "네 가지 유형을 끌어 순서를 정합니다. Mod는 현재 유형에서 가능한 모든 사업과 같은 유형의 대안을 시도한 뒤 다음으로 넘어갑니다. 식량 긴급 시 식량 사업을 먼저 처리하지만 이 순서를 따릅니다."
 eu5ab_regional_development__candidate_priority_name: "자동 건설 순서"
 eu5ab_regional_development__candidate_priority_desc: "끌어서 업그레이드, 일반 확장, RGO 확장 및 신규 건설 순서를 정합니다."
 eu5ab_regional_development__candidate_priority_item_column_name: "건설 유형"
 eu5ab_regional_development__candidate_priority_i1_name: "건물 업그레이드"
 eu5ab_regional_development__candidate_priority_i1_desc: "구식 건물을 업그레이드 계열에서 해금된 최신 단계로 교체합니다."
 eu5ab_regional_development__candidate_priority_i2_name: "기존 건물 확장"
 eu5ab_regional_development__candidate_priority_i2_desc: "기존 일반 건물에 단계를 추가합니다. 교체 업그레이드와 RGO는 제외됩니다."
 eu5ab_regional_development__candidate_priority_i3_name: "자원 지점 확장"
 eu5ab_regional_development__candidate_priority_i3_desc: "현지 RGO를 확장하며 가동률, 연간 예산, 국고 예비금 및 기타 안전 규칙은 유지됩니다."
 eu5ab_regional_development__candidate_priority_i4_name: "신규 건물 건설"
 eu5ab_regional_development__candidate_priority_i4_desc: "해당 지점에 아직 없는 일반 건물을 새로 건설합니다."
 eu5ab_regional_development__enabled_name: "자동 건설 활성화"
 eu5ab_regional_development__enabled_desc: "비활성화해도 템플릿과 연결은 저장되지만 월간 자동 건설은 중지됩니다."
 eu5ab_regional_development__monthly_build_hard_cap_name: "추가 동시 건설 사업"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "기본 슬롯 외에 이 Mod가 동시에 관리할 민간 사업 수입니다. 0은 총 1개, 599는 600개입니다. 수동 건설, 도로 및 다른 Mod는 포함하지 않습니다."
 eu5ab_regional_development__budget_mode_name: "연간 예산 방식"
 eu5ab_regional_development__budget_mode_desc: "고정 금액 또는 월간 국가 총수입의 배수로 공유 연간 예산을 정합니다."
 eu5ab_regional_development__budget_mode_option_1_name: "고정 연간 예산"
 eu5ab_regional_development__budget_mode_option_2_name: "월간 수입 ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "월간 수입 ×6(권장)"
 eu5ab_regional_development__budget_mode_option_4_name: "월간 수입 ×8"
 eu5ab_regional_development__economic_metric_name: "자동 건설 수익 지표"
 eu5ab_regional_development__economic_metric_desc: "일반 생산 건물의 최저 수익을 양의 월간 수입·이익 또는 연간 ROI 5%로 정합니다. 산출물 없는 기반 시설은 면제되며 RGO는 별도 규칙을 사용합니다."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! 수입"
 eu5ab_regional_development__economic_metric_option_1_desc: "게임이 양의 월간 수입을 예측할 때만 착공합니다."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! 이익"
 eu5ab_regional_development__economic_metric_option_2_desc: "게임이 양의 월간 총이익을 예측할 때만 착공합니다."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! 수입 수익률"
 eu5ab_regional_development__economic_metric_option_3_desc: "예측 월간 수입의 연환산 수익이 건설 비용의 5% 이상일 때만 착공합니다."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! 이익 수익률"
 eu5ab_regional_development__economic_metric_option_4_desc: "예측 월간 이익의 연환산 수익이 건설 비용의 5% 이상일 때만 착공합니다."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "식량 고갈 예상: 우선 건설, 수익 무시"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "식량 고갈이 예상되면 식량 사업을 우선하고 일반 식량 건물의 수익 조건을 면제합니다. 순서와 다른 모든 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "식량 25% 이하: 우선 건설, 수익 무시"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "식량 비축이 25% 이하이면 식량 사업을 우선하고 일반 식량 건물의 수익 조건을 면제합니다. 다른 모든 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_construction_goods_override_name: "건설재 공급 65% 미만: 수익 무시"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "핵심 건설재 공급이 필요량의 65% 미만이면 해당 생산 건물의 수익 조건을 면제합니다. 다른 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_wartime_military_override_name: "전시 군수품 공급 65% 미만: 수익 무시"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "전쟁 중 군수품 공급이 필요량의 65% 미만이면 해당 생산 건물의 수익 조건을 면제합니다. 다른 규칙은 유지됩니다."
 eu5ab_regional_development__emergency_strategic_input_override_name: "전략 생산 투입재 부족: 상류 수익 무시"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "공급 65% 미만인 상류 투입재가 국내 식량, 건설재 또는 군수 생산을 막으면 해당 생산 건물의 수익 조건을 면제합니다. 다른 규칙은 유지됩니다."
 eu5ab_regional_development__fixed_annual_budget_name: "고정 연간 예산"
 eu5ab_regional_development__fixed_annual_budget_desc: "고정 예산 방식에서만 사용하며 모든 템플릿이 이 금액을 공유합니다."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "최저 국고 예비금"
 eu5ab_regional_development__min_cash_reserve_desc: "사업 착공 후에도 국고에 남아야 할 금액입니다."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "최저 가격 비율"
 eu5ab_regional_development__price_min_desc: "산출물이 기본 가격의 이 비율보다 낮으면 일반적으로 공급 과잉으로 봅니다."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "고가 기준 비율"
 eu5ab_regional_development__price_max_desc: "산출물이 기본 가격의 이 비율보다 높으면 순위 보너스를 받습니다."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "특수 건물 허용"
 eu5ab_regional_development__allow_special_buildings_desc: "특수 건물을 후보로 고려합니다. 게임의 건설 조건은 유지됩니다."
 eu5ab_regional_development__auto_build_input_sources_name: "부족 시 상류 산업 건설"
 eu5ab_regional_development__auto_build_input_sources_desc: "계획 건물이 투입재 부족으로 착공할 수 없으면 허용된 상류 공급원을 시도합니다."
 eu5ab_regional_development__pause_low_workforce_name: "노동력 부족 시 중지"
 eu5ab_regional_development__pause_low_workforce_desc: "예측 기간 내 일자리를 채울 수 없는 사업은 건설하지 않습니다."
 eu5ab_regional_development__stop_input_shortage_name: "핵심 투입재 부족 시 중지"
 eu5ab_regional_development__stop_input_shortage_desc: "핵심 시장 투입재가 공급 부족인 동안 관련 사업을 건설하지 않습니다."
 eu5ab_regional_development__allow_rgo_name: "RGO 확장 허용"
 eu5ab_regional_development__allow_rgo_desc: "모든 템플릿에서 자원 지점 확장을 고려합니다."
 eu5ab_regional_development__rgo_min_utilization_name: "RGO 최저 가동률"
 eu5ab_regional_development__rgo_min_utilization_desc: "가동률이 이 값 미만인 RGO는 확장하지 않습니다."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "일자리 충원 기간(개월)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "현지 인구가 새 일자리 계층으로 승격할 예측 기간입니다."
 eu5ab_regional_development__native_input_priority_name: "현지 원료 우선순위"
 eu5ab_regional_development__native_input_priority_desc: "0~10. 값이 높을수록 같은 프로빈스의 원료를 쓰는 건물을 우선합니다."
 eu5ab_regional_development__performance_preset_name: "성능 사전 설정"
 eu5ab_regional_development__performance_preset_desc: "사전 설정은 아래 고급 옵션을 동기화합니다. 사용자 지정은 현재 값을 유지합니다."
 eu5ab_regional_development__performance_preset_option_1_name: "보수적"
 eu5ab_regional_development__performance_preset_option_1_desc: "하루 최대 10개 지점, 실행당 최대 30개 사업. 계획 후보 5개, 이익 후보 15개. 후보가 충분하면 남은 검사를 중지합니다."
 eu5ab_regional_development__performance_preset_option_2_name: "균형"
 eu5ab_regional_development__performance_preset_option_2_desc: "하루 최대 20개 지점, 실행당 최대 50개 사업. 계획 후보 4개, 이익 후보 12개. 후보가 충분하면 남은 검사를 중지합니다."
 eu5ab_regional_development__performance_preset_option_3_name: "최대 처리량"
 eu5ab_regional_development__performance_preset_option_3_desc: "적용 지점이 많은 국가용입니다. 하루 최대 30개 지점, 실행당 착공 수 무제한. 계획 후보 3개, 이익 후보 10개. 후보가 충분하면 중지합니다."
 eu5ab_regional_development__performance_preset_option_4_name: "사용자 지정"
 eu5ab_regional_development__performance_preset_option_4_desc: "현재 고급 설정을 사용합니다."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "템플릿 적용 지점이 많으면 게임 성능이 저하될 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "최대 처리량은 하루 최대 30개 지점을 처리하고 실행당 추가 수 제한이 없습니다. 지점이 많으면 월간 처리 시 느려질 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_action_name: "수요·공급 계획 지연: 계획 후보 수를 줄이십시오."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "수요·공급 계획에서만 표시됩니다. 계획 후보 수를 줄이면 지점 및 일반 건설 유형별 후속 검사 사업 수가 줄어듭니다."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "주의: 대안이 줄어 뒤의 실행 가능 사업을 놓칠 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "후보는 같은 계획 점수 순서를 사용합니다. 한도를 낮추면 상위 후보 실패 시 대안이 줄어 뒤의 실행 가능 사업을 검사하지 않을 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "예측 이익 선택 지연: 이익 후보 수를 줄이십시오."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "예측 이익 선택에서만 표시됩니다. 이익 후보 수를 줄이면 지점 및 유형별 게임 이익·비용 검사 사업 수가 줄어듭니다."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "주의: 후보 목록이 작으면 실제 고수익 건물을 놓칠 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "이익 전략은 계획 점수로 1차 선별한 뒤 예측 이익으로 정렬합니다. 한도를 낮추면 고수익 건물이 1차 선별에서 탈락할 가능성이 커집니다."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "일일 검사 지점 또는 실행당 추가 수도 줄일 수 있습니다."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "일일 지점 수를 줄이면 전국 검사를 더 많은 날로 나눕니다. 실행당 추가 수를 줄이면 검사와 착공이 감소합니다. 사전 설정도 바꿀 수 있으며 0은 무제한입니다."
 eu5ab_regional_development__parallel_location_scan_name: "지점을 개별 처리"
 eu5ab_regional_development__parallel_location_scan_desc: "한 번의 처리 시간을 줄이기 위해 지점을 개별 검사합니다. 순위, 예산 및 건설 순서는 바뀌지 않습니다."
 eu5ab_regional_development__daily_location_task_limit_name: "일일 검사 지점 한도"
 eu5ab_regional_development__daily_location_task_limit_desc: "하루 상세 검사 지점 수(1~30). 낮을수록 일일 처리량은 줄지만 전국 검사에 더 오래 걸립니다."
 eu5ab_regional_development__max_additions_per_run_name: "실행당 최대 추가"
 eu5ab_regional_development__max_additions_per_run_desc: "한 번에 착공할 최대 사업 수(0~600). 0은 무제한입니다."
 eu5ab_regional_development__candidates_per_location_name: "지점당 계획 후보"
 eu5ab_regional_development__candidates_per_location_desc: "수요·공급 계획 전용. 지점 및 일반 건설 유형별로 3~30개를 유지합니다. 많을수록 상위 후보 실패 시 대안이 늘지만 검사도 증가합니다."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "지점당 이익 후보"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "예측 이익 선택 전용. 지점 및 유형별 3~30개를 게임 이익 비교로 보냅니다. 많을수록 누락은 줄지만 검사가 증가합니다."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "후보가 충분하면 검사 중지"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "적격 후보가 이번 실행 최대 착공 수의 두 배에 도달하면 남은 지점 검사를 중지합니다."
 eu5ab_diagnostics_cmm_hint: "공유 규칙은 Community Mod Framework의 모드 설정에서 변경합니다. 건설 보고서는 최근 자동 건설 결과를 표시합니다."
