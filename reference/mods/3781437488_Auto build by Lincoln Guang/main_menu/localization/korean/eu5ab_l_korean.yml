 eu5ab_prediction_section_title: "자동 건설 규칙"
 eu5ab_prediction_diagnostics_title: "노동력 추정 및 건설 상태"
 eu5ab_prediction_section_body: "Mod는 자동 건설 순서에 따라 업그레이드, 일반 확장, RGO 확장, 신규 건물을 검사합니다. 현재 유형에서 시작 가능한 사업이 있는 동안 다음 유형으로 넘어가지 않습니다. 식량이 곧 고갈되거나 비축량이 25% 이하이면 식량 사업을 먼저 처리하고 선택한 수익 조건을 면제합니다. 건설재, 전시 군수품 또는 전략 생산의 상류 투입재가 심각하게 부족한 경우에도 유형 순서를 바꾸지 않고 해당 건물의 수익 조건을 완화할 수 있습니다. 연간 예산, 국고 예비금, 자재, 투입재, 노동력 및 게임의 건설 조건은 항상 적용됩니다. 해금된 최신 단계만 고려하며 업그레이드는 새 일자리만 계산합니다."
 eu5ab_diagnostics_title: "자동 건설 상태"
 eu5ab_diagnostics_snapshot_note: "설정은 즉시 저장되며 건설 보고서는 매월 검사 후 갱신됩니다."
 eu5ab_diagnostics_snapshot_help: "이 페이지는 매월 22일에 완료된 최근 검사 결과이며 실시간 자료가 아닙니다. 설정이나 템플릿 범위를 바꾼 뒤 다음 월간 검사가 끝나면 건설 한도, 착공, 탈락 사유 및 후보가 함께 갱신됩니다."
