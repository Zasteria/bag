 eu5ab_workforce_help: "중지를 켜면 기한 내 새 일자리를 채우기 어려운 프로젝트는 시작하지 않습니다. 끄면 우선순위만 낮아집니다. 0~96개월 예측은 현재 가용 노동력과 승급 가능 인구를 합산하며 미래 이주를 가정하지 않고 현지 적격 인구를 넘지 않습니다."
