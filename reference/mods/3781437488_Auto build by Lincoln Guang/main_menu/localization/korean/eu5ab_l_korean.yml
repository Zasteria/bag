 eu5ab_diag_rgo_short_desc: "각 지점은 결과 하나만 기록하며 탈락 시 첫 번째 사유로 집계합니다."
 eu5ab_diag_rgo_help: "이전 검사에서 RGO 지점의 결과를 표시합니다. 가동률은 현재 RGO 노동자와 확장 단계로 계산합니다. 새 단계 하나에는 노동자 1,000명이 필요하며 실업 노동자, 적격 실업 노예 및 기한 내 노동자로 승격 가능한 인구를 포함해 추정합니다."
