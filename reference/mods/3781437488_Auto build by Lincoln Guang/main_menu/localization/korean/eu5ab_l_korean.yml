 eu5ab_native_input_priority_desc: "'현지'는 건물이 있는 프로빈스를 뜻합니다. 생산식에서 비중이 큰 원료일수록 같은 프로빈스에 해당 RGO가 있을 때 더 많은 점수를 줍니다. 0은 현지 원료 무시, 5는 기본값, 10은 최대 가중치입니다. 순위만 바꾸므로 부족, 이익, 노동력 등으로 다른 프로젝트가 선택될 수 있습니다. 시장 접근성, 통제력 및 투입재 부족은 보너스를 줄이며 RGO 자체는 받지 않습니다."
