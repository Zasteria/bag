 eu5ab_priority_decrease_default_tt: "우선순위 0.1 감소"
 eu5ab_priority_decrease_ctrl_tt: "Ctrl: 우선순위 0.5 감소"
 eu5ab_priority_decrease_shift_tt: "Shift: 우선순위 1.0 감소"
 eu5ab_priority_increase_default_tt: "우선순위 0.1 증가"
 eu5ab_priority_increase_ctrl_tt: "Ctrl: 우선순위 0.5 증가"
 eu5ab_priority_increase_shift_tt: "Shift: 우선순위 1.0 증가"
 eu5ab_priority_scale_hint: "0은 금지"
 eu5ab_clear_visible_priorities_button: "현재 목록 모두 0으로"
 eu5ab_clear_visible_priorities_tooltip: "현재 필터에서 보이는 모든 건물의 우선순위를 즉시 0으로 만들고 저장합니다. 숨겨진 건물은 변경되지 않습니다."
