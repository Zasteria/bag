 eu5ab_filter_soldiers: "군사"
 eu5ab_filter_special: "특수"
 eu5ab_age_all: "모든 시대"
 eu5ab_building_age_1: "전통의 시대"
 eu5ab_building_age_2: "르네상스 시대"
 eu5ab_building_age_3: "대항해 시대"
 eu5ab_building_age_4: "종교 개혁 시대"
 eu5ab_building_age_5: "절대주의 시대"
 eu5ab_building_age_6: "혁명의 시대"
 eu5ab_status_enabled: "#G 활성화#!"
 eu5ab_status_disabled: "#L 비활성화#!"
 eu5ab_status_currently_available: "#G 사용 가능#!"
 eu5ab_operating_rules_title: "자동 건설 규칙"
 eu5ab_operating_rules_short_desc: "특수 건물, 상류 보완 건설 및 투입재 부족 규칙을 설정합니다."
 eu5ab_operating_rules_help: "특수 건물도 게임의 기본 조건을 충족해야 합니다. 상류 보완을 켜면 투입재 부족으로 공장이 막힐 때 공급 건물을 찾습니다. 핵심 투입재 부족 시 중지를 켜면 위험이 큰 프로젝트는 시작하지 않습니다."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "이 템플릿의 RGO 확장 허용"
 eu5ab_rgo_short_desc: "RGO는 게임 조건, 가동률, 예산 및 예비금 검사를 통과해야 합니다."
 eu5ab_rgo_utilization_label: "최소 가동률"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "이 설정은 템플릿이 RGO를 고려할지 결정합니다. RGO도 게임 조건, 최소 가동률, 연간 예산 및 예비금을 충족해야 합니다. 자동 건설 순서가 검사 시점을 정하고 부족, 가격, 가동률 및 전략 수요로 순위를 매깁니다. 중복 배정을 피하려면 기본 게임의 RGO 자동 확장을 끄십시오."
 eu5ab_toggle_special_buildings: "특수 건물 허용"
 eu5ab_toggle_auto_build_input_sources: "투입재 부족 시 상류 자동 건설"
 eu5ab_toggle_pause_low_workforce: "노동력 부족 시 확장 중지"
 eu5ab_ranking_mode_section_title: "건설 결정 전략"
 eu5ab_ranking_mode_current_label: "현재 모드"
 eu5ab_ranking_mode_composite_value: "#G 수급 계획#!"
 eu5ab_ranking_mode_actual_profit_value: "#G 예상 이익 우선 선택#!"
 eu5ab_ranking_mode_common_desc: "두 전략 모두 해금되었고 건설 가능하며 우선순위가 0보다 큰 건물만 고려합니다. 수익, 예산, 예비금, 투입재, 노동력 등 안전 조건도 충족해야 합니다. 식량 비상 상황과 자동 건설 순서가 항상 우선합니다."
 eu5ab_ranking_mode_composite_desc: "시장 부족, 전략 수요, 생산식 효율, 현지 원료, 가격 및 노동력 위험을 종합해 순위를 정하고 완전한 산업망과 장기 안정을 중시합니다."
 eu5ab_ranking_mode_actual_profit_desc: "템플릿 및 안전 규칙으로 후보를 거른 뒤 게임의 예상 월간 이익으로 선택합니다. 이익이 비슷하면 0~10 건물 우선순위가 약하게 영향을 줍니다."
 eu5ab_ranking_mode_actual_profit_scope_desc: "이 전략은 지점과 현재 건설 유형별로 사전 선별된 3~30개 후보 중에서만 선택하므로 전 세계 최고 이익을 보장하지 않습니다. 착공 직전에 수익과 안전 규칙을 다시 검사합니다. RGO는 계속 부족, 가격, 가동률 및 전략 수요로 순위를 정합니다."
 eu5ab_ranking_mode_help: "Community Mod Framework 모드 설정에서 전략을 전환합니다. 수급 계획은 시장, 산업망 및 안정성을 중시합니다. 예상 이익 선택은 게임의 월간 이익을 사용하고 0~10 우선순위는 약한 보정만 제공합니다."
 eu5ab_workforce_section_title: "노동력"
 eu5ab_pause_workforce_short_desc: "노동력 위험이 확장을 직접 막을지 설정합니다."
 eu5ab_job_fill_deadline_label: "일자리 충원 기한"
