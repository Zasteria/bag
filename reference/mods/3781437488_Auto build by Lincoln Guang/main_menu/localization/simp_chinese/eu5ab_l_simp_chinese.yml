 eu5ab_apply_template_slot_1_to_selected_province: "选择省份并应用槽位 1"
 eu5ab_apply_template_slot_1_to_selected_province_desc: "选择一个省份，把模板槽位 1 批量绑定到该省份内已拥有地点。"
 eu5ab_apply_template_slot_1_to_selected_area: "选择地区并应用槽位 1"
