 eu5ab_set_cash_reserve_2000: "本 Mod：储备金 2000"
 eu5ab_set_cash_reserve_2000_desc: "将所选地点的自动建造最低储备金设为 2000。"
 eu5ab_enable_special_buildings_for_location: "本 Mod：允许特殊建筑"
 eu5ab_enable_special_buildings_for_location_desc: "允许自动建造系统在所选地点建造或升级特殊建筑。"
 eu5ab_disable_special_buildings_for_location: "本 Mod：禁止特殊建筑"
 eu5ab_disable_special_buildings_for_location_desc: "禁止自动建造系统在所选地点建造或升级特殊建筑。"
 eu5ab_decouple_selected_location: "本 Mod：解耦地点"
 eu5ab_decouple_selected_location_desc: "让所选地点不再跟随省份模板更新。"
 eu5ab_clear_selected_location_policy: "本 Mod：清除地点策略"
 eu5ab_clear_selected_location_policy_desc: "先选择一个地点，再移除该地点的本 Mod 模板、储备金、建筑规则和运行规则。"
 eu5ab_regional_development_name: "高级自动建造"
 eu5ab_regional_development_desc: "为全部内置模板与自定义模板设置共享的国家级运行规则。模板本身只保留启停、应用范围和建筑优先级。"
 eu5ab_regional_development__general_name: "总开关与额度"
 eu5ab_regional_development__finance_name: "财政与市场"
 eu5ab_regional_development__automation_name: "建造安全与排序"
 eu5ab_regional_development__performance_name: "性能优化"
 eu5ab_regional_development__performance__preset_name: "性能预设"
 eu5ab_regional_development__performance__preset_desc: "选择一组扫描参数；手动修改高级设置后会自动切换为「自定义」。修改从下一轮扫描开始生效。"
 eu5ab_regional_development__performance__advanced_name: "高级设置"
 eu5ab_regional_development__performance__advanced_desc: "控制独立地点任务、每日工作量、本轮新增上限，以及候选项目充足时是否提前停止扫描。"
 eu5ab_regional_development__general__limits_name: "总开关与同时建造上限"
 eu5ab_regional_development__general__limits_desc: "控制本 Mod 是否运行，以及本 Mod 最多可同时安排多少个民用建造。"
 eu5ab_regional_development__general__returns_name: "收益条件与紧急放宽"
 eu5ab_regional_development__general__returns_desc: "选择普通生产建筑的收益要求，并设置食物、建造所需商品、军需品和战略投入品短缺时是否放宽收益条件。"
 eu5ab_regional_development__finance__budget_name: "共享年度预算"
 eu5ab_regional_development__finance__budget_desc: "所有内置模板、自定义模板、普通建筑和原产共用同一个国家年度预算池。"
 eu5ab_regional_development__finance__market_name: "市场价格范围"
 eu5ab_regional_development__finance__market_desc: "用默认价格百分比设置所有模板共用的最低和最高价格参考。"
 eu5ab_regional_development__automation__safety_name: "建造安全规则"
 eu5ab_regional_development__automation__safety_desc: "设置特殊建筑、上游补建、劳动力和投入品短缺的共享处理规则。"
 eu5ab_regional_development__automation__rgo_name: "原产扩建"
 eu5ab_regional_development__automation__rgo_desc: "设置全部模板共用的原产开关和最低利用率。原产地点按短缺、价格、利用率和战略需求自动排序。"
 eu5ab_regional_development__automation__workforce_name: "劳动力预测"
 eu5ab_regional_development__automation__workforce_desc: "设置所有模板共用的岗位填补预测期限。"
 eu5ab_regional_development__automation__ranking_name: "建造顺序与本地原料"
 eu5ab_regional_development__automation__ranking_desc: "设置升级、扩建、原产和新建的先后顺序，以及本地原料对同类项目排序的影响。"
 eu5ab_regional_development__automation__candidate_priority_name: "自动建造顺序"
 eu5ab_regional_development__automation__candidate_priority_desc: "拖动四种建造类型来调整顺序。系统会先尝试当前类型中所有能开工的项目，再查看下一类；某个项目不能开工时，会继续寻找同类项目。食物紧急时，产出食物的项目会优先处理，但仍按这里的顺序安排。"
 eu5ab_regional_development__candidate_priority_name: "自动建造顺序"
 eu5ab_regional_development__candidate_priority_desc: "拖动调整建筑升级、普通扩建、原产扩建和新建建筑的先后顺序。"
 eu5ab_regional_development__candidate_priority_item_column_name: "建造类型"
 eu5ab_regional_development__candidate_priority_i1_name: "自动升级建筑"
 eu5ab_regional_development__candidate_priority_i1_desc: "将现有旧式建筑替换为当前已解锁的最新一代建筑。"
 eu5ab_regional_development__candidate_priority_i2_name: "自动扩建现有建筑"
 eu5ab_regional_development__candidate_priority_i2_desc: "为当地已有的普通建筑增加一级，不包含升级替换和原产。"
 eu5ab_regional_development__candidate_priority_i3_name: "自动扩建资源采集点"
 eu5ab_regional_development__candidate_priority_i3_desc: "扩建当地原产资源采集点，仍受最低利用率、年度预算和储备金等规则限制。"
 eu5ab_regional_development__candidate_priority_i4_name: "自动新建建筑"
 eu5ab_regional_development__candidate_priority_i4_desc: "在当地从零新建尚不存在的普通建筑。"
 eu5ab_regional_development__enabled_name: "启用自动建造"
 eu5ab_regional_development__enabled_desc: "关闭后保留模板与地点绑定，但不再执行月度自动建造。"
 eu5ab_regional_development__monthly_build_hard_cap_name: "额外同时建造上限"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "设置在基础 1 项之外，本 Mod 还可同时进行多少个民用建造。0 代表总计 1 项，599 代表总计 600 项；手动建造、道路和其他 Mod 的项目不占此上限。"
 eu5ab_regional_development__budget_mode_name: "年度预算模式"
 eu5ab_regional_development__budget_mode_desc: "选择固定金额，或按设置当年的月总收入倍数建立共享年度预算池。"
 eu5ab_regional_development__budget_mode_option_1_name: "固定年度预算"
 eu5ab_regional_development__budget_mode_option_2_name: "月总收入 ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "月总收入 ×6（推荐）"
 eu5ab_regional_development__budget_mode_option_4_name: "月总收入 ×8"
 eu5ab_regional_development__economic_metric_name: "自动建造收益指标"
 eu5ab_regional_development__economic_metric_desc: "选择普通生产建筑开工前必须达到的收益标准。收入和利润要求每月数值为正；投资回报要求年化回报率至少为 5%（约 20 年回本）。无产出基础设施不受此项限制；原产仍按利用率、价格和战略需求判断。"
 eu5ab_regional_development__economic_metric_option_1_name: "@income! 收入"
 eu5ab_regional_development__economic_metric_option_1_desc: "仅当游戏预计每月收入为正时，才允许普通生产建筑开工。"
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! 利润"
 eu5ab_regional_development__economic_metric_option_2_desc: "仅当游戏预计每月总利润为正时，才允许普通生产建筑开工。"
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! 收入回报率"
 eu5ab_regional_development__economic_metric_option_3_desc: "仅当预计收入达到至少 5% 的年化建造成本回报率时，才允许普通生产建筑开工。"
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! 利润回报率"
 eu5ab_regional_development__economic_metric_option_4_desc: "仅当利润达到至少 5% 的年化建造成本回报率时，才允许普通生产建筑开工。"
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "预计食物耗尽：优先建造，不检查收益"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "市场预计食物储备将耗尽时，先安排产出食物的项目；普通食物建筑不再要求达到所选收益标准。这些项目仍按「自动建造顺序」安排，并继续遵守预算、国库储备、劳动力、投入品、建造所需商品和游戏自身的建造条件。"
 eu5ab_regional_development__emergency_food_stockpile_override_name: "食物储备不高于 25%：优先建造，不检查收益"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "市场食物储备不高于 25% 时，先安排产出食物的项目；普通食物建筑不再要求达到所选收益标准。这些项目仍按「自动建造顺序」安排，其他建造限制照常生效。"
 eu5ab_regional_development__emergency_construction_goods_override_name: "建造所需商品供应低于 65%：不检查收益"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "某种核心建造所需商品的市场供应低于需求的 65% 时，生产该商品的建筑不再要求达到所选收益标准。其他建造限制照常生效。"
 eu5ab_regional_development__emergency_wartime_military_override_name: "战时军需供应低于 65%：不检查收益"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "国家处于战争，且某种军需品的市场供应低于需求的 65% 时，生产该商品的建筑不再要求达到所选收益标准。其他建造限制照常生效。"
 eu5ab_regional_development__emergency_strategic_input_override_name: "战略生产缺料：不检查上游收益"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "当上游原料供应低于需求的 65%，并已导致本国食物、建造所需商品或军需建筑停产时，生产这种原料的建筑不再要求达到所选收益标准。其他建造限制照常生效。"
 eu5ab_regional_development__fixed_annual_budget_name: "固定年度预算"
 eu5ab_regional_development__fixed_annual_budget_desc: "仅在固定预算模式下使用；所有模板共用该金额。"
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "最低国库储备"
 eu5ab_regional_development__min_cash_reserve_desc: "项目开工后国库必须至少保留的金额。"
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "最低价格百分比"
 eu5ab_regional_development__price_min_desc: "低于默认价格这一百分比的产出通常视为供应过剩。"
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "高价参考百分比"
 eu5ab_regional_development__price_max_desc: "高于默认价格这一百分比的产出会获得高价排序加分。"
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "允许特殊建筑"
 eu5ab_regional_development__allow_special_buildings_desc: "允许自动建造考虑特殊建筑；仍须满足游戏自身的建造条件。"
 eu5ab_regional_development__auto_build_input_sources_name: "短缺时自动补建上游"
 eu5ab_regional_development__auto_build_input_sources_desc: "计划中的建筑因投入品短缺而无法开工时，尝试建设模板允许的上游来源。"
 eu5ab_regional_development__pause_low_workforce_name: "劳动力不足时暂停"
 eu5ab_regional_development__pause_low_workforce_desc: "预计岗位无法在期限内填满时，不建造该项目。"
 eu5ab_regional_development__stop_input_shortage_name: "关键投入品短缺时停止"
 eu5ab_regional_development__stop_input_shortage_desc: "市场关键投入品供应不足时，不建造相关项目。"
 eu5ab_regional_development__allow_rgo_name: "允许扩建原产"
 eu5ab_regional_development__allow_rgo_desc: "允许全部模板考虑扩建原产资源采集点。"
 eu5ab_regional_development__rgo_min_utilization_name: "原产最低利用率"
 eu5ab_regional_development__rgo_min_utilization_desc: "低于该利用率的原产不会继续扩建。"
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "岗位填补期限（月）"
 eu5ab_regional_development__job_fill_deadline_months_desc: "预测本地人口晋升并填补新岗位时使用的期限。"
 eu5ab_regional_development__native_input_priority_name: "本地原料优先级"
 eu5ab_regional_development__native_input_priority_desc: "0–10；数值越高，能使用本省原产资源的建筑越容易被优先建造。"
 eu5ab_regional_development__performance_preset_name: "性能预设"
 eu5ab_regional_development__performance_preset_desc: "预设会同步下方高级设置；选择「自定义」时保留当前数值。"
 eu5ab_regional_development__performance_preset_option_1_name: "保守"
 eu5ab_regional_development__performance_preset_option_1_desc: "独立地点任务开启；每日 10 个地点；每轮最多新增 30 个项目；候选充足后提前停止。"
 eu5ab_regional_development__performance_preset_option_2_name: "平衡"
 eu5ab_regional_development__performance_preset_option_2_desc: "独立地点任务开启；每日 20 个地点；每轮最多新增 50 个项目；候选充足后提前停止。"
 eu5ab_regional_development__performance_preset_option_3_name: "效率优先"
 eu5ab_regional_development__performance_preset_option_3_desc: "默认。独立地点任务开启；每日 30 个地点；每轮新增不限；候选充足后提前停止。"
 eu5ab_regional_development__performance_preset_option_4_name: "自定义"
 eu5ab_regional_development__performance_preset_option_4_desc: "使用当前高级设置。"
 eu5ab_regional_development__performance_throughput_warning_summary_name: "大量地点应用模板可能降低游戏性能。"
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "效率优先会每天处理最多 30 个地点，且每轮新增不限。大量地点应用模板时可能降低游戏性能。"
 eu5ab_regional_development__performance_throughput_warning_action_name: "卡顿时请更换预设或降低「每轮最多新增」（0 为无限）。"
 eu5ab_regional_development__performance_throughput_warning_action_desc: "需要改善游戏性能时，请改用其他性能预设，或降低「每轮最多新增」的数值。0 表示不限。"
 eu5ab_regional_development__parallel_location_scan_name: "独立地点任务"
 eu5ab_regional_development__parallel_location_scan_desc: "把不同地点拆成独立任务交给事件系统处理；这不代表游戏会使用多个 CPU 线程。国家级候选归并、预算、诊断和开工仍按确定顺序执行。"
 eu5ab_regional_development__daily_location_task_limit_name: "每日地点任务上限"
 eu5ab_regional_development__daily_location_task_limit_desc: "每天最多派发多少个地点进行深度候选计算。范围 1–30。"
 eu5ab_regional_development__max_additions_per_run_name: "每轮最多新增"
 eu5ab_regional_development__max_additions_per_run_desc: "限制本轮预计新增项目数。范围 0–600；0 表示不限。"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "候选充足后提前停止"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "串行归并的候选储备达到本轮预计新增量的两倍后，不再派发新的地点任务。"
