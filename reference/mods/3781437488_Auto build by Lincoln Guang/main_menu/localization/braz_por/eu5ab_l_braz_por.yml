 eu5ab_cash_section_title: "Reserva do tesouro"
 eu5ab_cash_short_desc: "Saldo mínimo que deve permanecer no tesouro."
 eu5ab_cash_label: "Reserva do tesouro"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] ouro"
 eu5ab_cash_help: "A reserva do tesouro é o saldo mínimo que deve restar após o início da construção; ela não é cobrada separadamente. Um projeto é bloqueado se seu custo reduzir o tesouro abaixo desse valor. Exemplo: com 1.050 de ouro, reserva de 1.000 e custo de 100, a construção não começa."
 eu5ab_budget_section_title: "Orçamento estratégico anual"
 eu5ab_budget_short_desc: "Escolha um valor fixo ou um orçamento vinculado à renda mensal; os modos são mutuamente exclusivos."
 eu5ab_budget_mode_fixed: "Orçamento fixo"
 eu5ab_budget_mode_income: "Vinculado à renda"
 eu5ab_budget_multiplier_4: "×4 Conservador"
 eu5ab_budget_multiplier_6: "×6 Recomendado"
 eu5ab_budget_multiplier_8: "×8 Ativo"
 eu5ab_budget_effective_label: "Orçamento do ano atual"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] ouro"
 eu5ab_budget_label: "Orçamento anual"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] ouro/ano"
 eu5ab_budget_cash_comparison: "O orçamento estratégico anual limita quanto este Mod pode gastar por ano; a reserva define quanto deve permanecer no tesouro. Ambas as condições devem ser atendidas."
 eu5ab_budget_reset_note: "Os modos fixo e vinculado à renda são exclusivos. O orçamento é redefinido na primeira verificação de janeiro e só é deduzido após o projeto entrar na fila."
 eu5ab_budget_help: "Todos os modelos compartilham um orçamento nacional anual. Escolha um valor fixo ou 4, 6 ou 8 vezes a renda mensal total. O orçamento vinculado à renda é calculado na primeira verificação de janeiro e fica fixo no ano. Edifícios usam o custo real do jogo; RGOs usam o custo básico. O orçamento só é deduzido quando o projeto entra na fila."
 eu5ab_quota_section_title: "Limite de construções simultâneas deste Mod"
 eu5ab_quota_short_desc: "Define quantos projetos civis extras este Mod pode executar além da vaga básica."
 eu5ab_hard_cap_label: "Projetos simultâneos extras"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] projetos (o limite total é este valor + 1)"
 eu5ab_quota_help: "0 permite no máximo 1 projeto civil ativo e 599 permite 600. Só contam projetos iniciados por este Mod e ainda em construção; obras manuais, estradas e outros Mods não contam. Cada verificação mensal preenche apenas as vagas restantes, no máximo um projeto por local, e RGOs não têm limite mensal separado."
