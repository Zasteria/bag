 eu5ab_template_rename_cancel: "Cancelar"
 eu5ab_target_location_title: "Local de destino"
 eu5ab_target_location_desc: "Escolha um local antes de limpar suas configurações ou interromper as atualizações do modelo da província. Para atribuir um modelo, use os botões de seleção no cartão correspondente."
 eu5ab_template_editor_desc: "Configure as prioridades de edifícios e a cobertura deste modelo. O orçamento, o mercado, a força de trabalho e as regras de segurança de construção compartilhados nacionalmente são configurados nas Configurações do Mod do Community Mod Framework."
