 eu5ab_operating_rules_title: "Regras de construção"
 eu5ab_operating_rules_short_desc: "Configure edifícios especiais, construção a montante e escassez de insumos."
 eu5ab_operating_rules_help: "Edifícios especiais ainda devem cumprir as condições do jogo. Se a construção de fontes estiver ativada, o Mod procura um produtor a montante quando a falta de insumos bloqueia uma fábrica. Com a proteção contra escassez crítica, projetos com risco excessivo de insumos não começam."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Permitir que este modelo expanda RGOs"
 eu5ab_rgo_short_desc: "RGOs devem passar pelas condições do jogo, utilização, orçamento e reserva."
 eu5ab_rgo_utilization_label: "Utilização mínima"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Esta opção decide se o modelo considera RGOs. Eles ainda precisam cumprir as regras do jogo, utilização mínima, orçamento anual e reserva. A ordem automática define quando são verificados; a classificação usa escassez, preço, utilização e necessidade estratégica. Desative a expansão automática de RGO do jogo para evitar agendamento duplicado."
 eu5ab_toggle_special_buildings: "Permitir edifícios especiais"
 eu5ab_toggle_auto_build_input_sources: "Construir fontes quando faltarem insumos"
 eu5ab_toggle_pause_low_workforce: "Pausar expansão com força de trabalho insuficiente"
 eu5ab_ranking_mode_section_title: "Estratégia de decisão de construção"
 eu5ab_ranking_mode_current_label: "Modo atual"
 eu5ab_ranking_mode_composite_value: "#G Planejamento de oferta e demanda#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Seleção por lucro previsto#!"
 eu5ab_ranking_mode_common_desc: "Ambas as estratégias consideram apenas edifícios desbloqueados e construíveis com prioridade acima de 0. Também exigem retorno, orçamento, reserva, insumos, força de trabalho e demais regras de segurança. Emergências alimentares e a ordem automática vêm primeiro."
 eu5ab_ranking_mode_composite_desc: "Classifica projetos por escassez do mercado, necessidade estratégica, eficiência da receita, insumos locais, preços e risco de mão de obra, favorecendo cadeias completas e estabilidade de longo prazo."
 eu5ab_ranking_mode_actual_profit_desc: "Filtra candidatos pelas regras do modelo e de segurança e escolhe pelo lucro mensal previsto pelo jogo. A prioridade de 0–10 influencia suavemente quando os lucros são próximos."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Esta estratégia escolhe apenas entre 3–30 candidatos pré-filtrados por local e tipo atual; portanto não garante o maior lucro global. Retorno e regras de segurança são verificados novamente antes da construção. RGOs continuam classificados por escassez, preço, utilização e necessidade estratégica."
 eu5ab_ranking_mode_help: "Altere a estratégia nas Configurações do Mod do Community Mod Framework. O planejamento de oferta e demanda favorece mercados, cadeias e estabilidade. A seleção por lucro previsto usa o lucro mensal do jogo e aplica a prioridade 0–10 apenas como influência suave."
 eu5ab_workforce_section_title: "Força de trabalho"
 eu5ab_pause_workforce_short_desc: "Controla se o risco de mão de obra bloqueia a expansão."
 eu5ab_job_fill_deadline_label: "Prazo para preencher vagas"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_value: "Prazo para preencher vagas: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] meses"
 eu5ab_job_fill_deadline_desc: "Prazo máximo de espera para preencher novos empregos, de 0 a 96 meses. 0 aceita apenas a força de trabalho atual. Com a pausa ativada, projetos além do prazo não começam; sem ela, o risco apenas reduz a prioridade."
 eu5ab_deadline_0: "0 mês"
 eu5ab_deadline_3: "3 meses"
 eu5ab_deadline_6: "6 meses"
 eu5ab_deadline_12: "12 meses"
 eu5ab_toggle_stop_input_shortage: "Parar expansão com escassez crítica de insumos"
 eu5ab_prediction_status_label: "Estimativa de força de trabalho"
 eu5ab_status_promotion_forecast: "#G Previsão de promoção no prazo selecionado#!"
 eu5ab_status_conservative_fallback: "#L Estimativa conservadora com a força de trabalho atual#!"
 eu5ab_prediction_promotion_short_desc: "Soma os trabalhadores que podem ser promovidos aos empregos necessários dentro do prazo, até 96 meses."
 eu5ab_prediction_unavailable_short_desc: "Quando não há previsão confiável, usa apenas os trabalhadores disponíveis agora."
 eu5ab_workforce_help: "Com a pausa ativada, um projeto não começa se seus empregos provavelmente não forem preenchidos até o prazo; sem ela, o risco reduz a prioridade. A previsão de 0–96 meses soma trabalhadores disponíveis e pessoas elegíveis à promoção, sem supor migração futura nem exceder a população local elegível."
 eu5ab_native_input_section_title: "Preferência por insumos locais"
 eu5ab_native_input_short_desc: "Eleva a classificação de edifícios que usam matérias-primas da mesma província."
 eu5ab_native_input_priority_label: "Prioridade de insumos locais"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Prioridade de insumos locais: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Local significa a província do edifício. Insumos com maior participação na receita dão mais pontuação quando há um RGO correspondente na província. 0 ignora matérias-primas locais, 5 é o padrão e 10 dá o maior peso. Isso só altera a classificação; escassez, lucro, força de trabalho e outras condições ainda podem escolher outro projeto. Acesso ruim ao mercado, baixo controle e falta de insumos reduzem o bônus; RGOs não o recebem."
 eu5ab_price_section_title: "Faixa de preços"
 eu5ab_price_short_desc: "Filtra e classifica edifícios de produção pelo preço de mercado."
 eu5ab_price_min_label: "Preço mínimo"
 eu5ab_price_max_label: "Preço máximo"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Os preços são percentuais do preço-base. Um edifício é excluído se o preço do produto estiver abaixo do mínimo e recebe bônus de escassez acima do máximo. Infraestrutura sem produto não é limitada."
 eu5ab_active_cash_value: "Reserva do tesouro: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_active_price_min_value: "Preço mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0Y]%"
 eu5ab_active_price_max_value: "Preço máximo: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0Y]%"
 eu5ab_price_min_value: "Preço mínimo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Preço máximo: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Regras de construção automatizada"
 eu5ab_prediction_diagnostics_title: "Estimativa de força de trabalho e estado da construção"
 eu5ab_prediction_section_body: "O Mod verifica melhorias, expansões comuns, expansões de RGO e novos edifícios na Ordem de Construção Automatizada. Ele só avança de tipo quando nenhum projeto do tipo atual pode começar. Se os alimentos estiverem prestes a acabar ou em 25% ou menos, projetos alimentares vêm primeiro e ignoram o retorno escolhido. Escassez grave de materiais de construção, bens militares em guerra ou insumos estratégicos também pode dispensar o retorno, sem alterar a ordem dos tipos. Orçamento anual, reserva do tesouro, materiais, insumos, mão de obra e regras do jogo sempre se aplicam. Só é considerado o nível desbloqueado mais recente; melhorias contam apenas os novos empregos."
 eu5ab_diagnostics_title: "Estado da construção automatizada"
 eu5ab_diagnostics_snapshot_note: "As configurações são salvas imediatamente; o Relatório de construção é atualizado após cada verificação mensal."
 eu5ab_diagnostics_snapshot_help: "Esta página mostra a última verificação concluída no dia 22, não dados em tempo real. Depois de alterar configurações ou a cobertura dos modelos, aguarde a próxima verificação mensal; capacidade, inícios, rejeições e candidatos serão atualizados juntos."
