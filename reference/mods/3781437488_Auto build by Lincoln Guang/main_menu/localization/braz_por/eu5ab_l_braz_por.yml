 eu5ab_select_template_tooltip: "Selecione este modelo e veja os detalhes de suas regras."
 eu5ab_preset_readonly_desc: "Este modelo temático somente leitura pode ser pausado, retomado e atribuído de forma independente. Copie-o como modelo personalizado para editar as prioridades de edifícios. Altere as regras compartilhadas nas Configurações do Mod do Community Mod Framework."
