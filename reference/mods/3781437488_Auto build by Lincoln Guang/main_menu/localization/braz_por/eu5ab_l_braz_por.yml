 eu5ab_regional_development__automation__workforce_desc: "Horizonte compartilhado para preencher novos empregos."
 eu5ab_regional_development__automation__ranking_name: "Estratégia de decisão de construção"
 eu5ab_regional_development__automation__ranking_desc: "Escolha a estratégia para edifícios comuns, ordene melhorias, expansões, RGOs e novas construções e defina a influência dos insumos locais."
 eu5ab_regional_development__candidate_ranking_mode_name: "Estratégia para edifícios comuns"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Escolha a classificação final após os requisitos. Emergência alimentar e Ordem de Construção vêm primeiro; RGOs usam escassez, preço, utilização e necessidade estratégica."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Oferta e demanda"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Classifica projetos por escassez do mercado, necessidade estratégica, eficiência da receita, insumos locais, preços e risco de mão de obra, favorecendo cadeias completas e estabilidade de longo prazo."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Lucro previsto"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Filtra candidatos pelas regras do modelo e de segurança e escolhe pelo lucro mensal previsto pelo jogo. A prioridade de 0–10 influencia suavemente quando os lucros são próximos."
 eu5ab_regional_development__automation__candidate_priority_name: "Ordem de construção automatizada"
 eu5ab_regional_development__automation__candidate_priority_desc: "Arraste os quatro tipos para definir a ordem. O Mod esgota projetos viáveis do tipo atual antes de avançar e procura alternativas do mesmo tipo. Em emergência alimentar, projetos alimentares vêm primeiro, mas mantêm esta ordem."
 eu5ab_regional_development__candidate_priority_name: "Ordem de construção automatizada"
 eu5ab_regional_development__candidate_priority_desc: "Arraste para ordenar melhorias, expansões comuns, expansões de RGO e novos edifícios."
 eu5ab_regional_development__candidate_priority_item_column_name: "Tipo de construção"
 eu5ab_regional_development__candidate_priority_i1_name: "Melhorar edifícios"
 eu5ab_regional_development__candidate_priority_i1_desc: "Substitua um edifício obsoleto pelo nível desbloqueado mais recente da sua cadeia."
 eu5ab_regional_development__candidate_priority_i2_name: "Expandir edifícios existentes"
 eu5ab_regional_development__candidate_priority_i2_desc: "Adicione um nível a um edifício comum existente, sem substituições nem RGOs."
 eu5ab_regional_development__candidate_priority_i3_name: "Expandir locais de recursos"
 eu5ab_regional_development__candidate_priority_i3_desc: "Expanda o RGO local mantendo utilização, orçamento anual, reserva do tesouro e outras proteções."
 eu5ab_regional_development__candidate_priority_i4_name: "Construir novos edifícios"
 eu5ab_regional_development__candidate_priority_i4_desc: "Construa do zero um edifício comum que ainda não existe no local."
 eu5ab_regional_development__enabled_name: "Ativar construção automatizada"
 eu5ab_regional_development__enabled_desc: "Quando desativado, modelos e vínculos permanecem salvos, mas a construção automatizada mensal para."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Projetos simultâneos extras"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Projetos civis simultâneos além do espaço base. 0 permite 1 no total e 599 permite 600. Construções manuais, estradas e outros Mods não contam."
 eu5ab_regional_development__budget_mode_name: "Modo de orçamento anual"
 eu5ab_regional_development__budget_mode_desc: "Escolha um valor fixo ou crie o fundo anual compartilhado como múltiplo da renda mensal total."
 eu5ab_regional_development__budget_mode_option_1_name: "Orçamento anual fixo"
 eu5ab_regional_development__budget_mode_option_2_name: "Renda mensal ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Renda mensal ×6 (recomendado)"
 eu5ab_regional_development__budget_mode_option_4_name: "Renda mensal ×8"
 eu5ab_regional_development__economic_metric_name: "Métrica de retorno da construção automatizada"
 eu5ab_regional_development__economic_metric_desc: "Escolha o retorno mínimo de edifícios comuns: renda ou lucro mensal positivo, ou ROI anual de 5%. Infraestrutura sem produto é isenta; RGOs usam regras próprias."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Renda"
 eu5ab_regional_development__economic_metric_option_1_desc: "Inicie apenas se o jogo prever renda mensal positiva."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Lucro"
 eu5ab_regional_development__economic_metric_option_2_desc: "Inicie apenas se o jogo prever lucro mensal total positivo."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Retorno sobre renda"
 eu5ab_regional_development__economic_metric_option_3_desc: "Inicie apenas se a renda mensal prevista representar ao menos 5% anual do custo de construção."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Retorno sobre lucro"
 eu5ab_regional_development__economic_metric_option_4_desc: "Inicie apenas se o lucro mensal previsto representar ao menos 5% anual do custo de construção."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Alimentos vão acabar: construir primeiro, ignorar retorno"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Se os alimentos vão acabar, trate projetos alimentares primeiro e dispense o retorno de edifícios alimentares comuns. A ordem e todas as demais regras continuam válidas."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Alimentos em 25% ou menos: construir primeiro, ignorar retorno"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Com alimentos em 25% ou menos, trate projetos alimentares primeiro e dispense o retorno de edifícios alimentares comuns; todas as outras regras continuam."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Oferta de construção abaixo de 65%: ignorar retorno"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Se um material essencial tiver menos de 65% da oferta necessária, seus produtores dispensam o retorno. As demais regras continuam."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Oferta militar em guerra abaixo de 65%: ignorar retorno"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Durante a guerra, se um bem militar tiver menos de 65% da oferta necessária, seus produtores dispensam o retorno; as demais regras continuam."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Produção estratégica sem insumos: ignorar retorno a montante"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Se um insumo a montante abaixo de 65% bloquear produção nacional alimentar, de construção ou militar, seus produtores dispensam o retorno; as demais regras continuam."
 eu5ab_regional_development__fixed_annual_budget_name: "Orçamento anual fixo"
 eu5ab_regional_development__fixed_annual_budget_desc: "Usado apenas no modo fixo; todos os modelos compartilham este valor."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Reserva mínima do tesouro"
 eu5ab_regional_development__min_cash_reserve_desc: "Ouro que deve permanecer no tesouro depois que um projeto começa."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Percentual de preço mínimo"
 eu5ab_regional_development__price_min_desc: "Produção abaixo deste percentual do preço-base normalmente é considerada em excesso."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Percentual de referência de preço alto"
 eu5ab_regional_development__price_max_desc: "Produção acima deste percentual do preço-base recebe bônus de classificação."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Permitir edifícios especiais"
 eu5ab_regional_development__allow_special_buildings_desc: "Permita considerar edifícios especiais; os requisitos de construção do jogo continuam válidos."
 eu5ab_regional_development__auto_build_input_sources_name: "Construir fontes a montante na escassez"
 eu5ab_regional_development__auto_build_input_sources_desc: "Se um edifício planejado não puder começar por falta de insumos, tente uma fonte a montante permitida."
 eu5ab_regional_development__pause_low_workforce_name: "Pausar com pouca mão de obra"
 eu5ab_regional_development__pause_low_workforce_desc: "Não construa se os empregos não puderem ser preenchidos no período previsto."
 eu5ab_regional_development__stop_input_shortage_name: "Parar com falta de insumos críticos"
 eu5ab_regional_development__stop_input_shortage_desc: "Não construa projetos relacionados enquanto insumos críticos do mercado estiverem abaixo da oferta necessária."
 eu5ab_regional_development__allow_rgo_name: "Permitir expansão de RGO"
 eu5ab_regional_development__allow_rgo_desc: "Permita que todos os modelos considerem expandir locais de recursos."
 eu5ab_regional_development__rgo_min_utilization_name: "Utilização mínima de RGO"
 eu5ab_regional_development__rgo_min_utilization_desc: "Não expanda um RGO abaixo desta utilização."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Horizonte para preencher empregos (meses)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Período de previsão para promoções locais a novos empregos."
 eu5ab_regional_development__native_input_priority_name: "Prioridade de insumos locais"
 eu5ab_regional_development__native_input_priority_desc: "0–10; valores maiores priorizam edifícios que usam matérias-primas da mesma província."
 eu5ab_regional_development__performance_preset_name: "Predefinição de desempenho"
 eu5ab_regional_development__performance_preset_desc: "Uma predefinição sincroniza as opções avançadas abaixo. Personalizado mantém os valores atuais."
 eu5ab_regional_development__performance_preset_option_1_name: "Conservador"
 eu5ab_regional_development__performance_preset_option_1_desc: "Verifica até 10 locais por dia e inicia no máximo 30 projetos por rodada. Candidatos de Planejamento: 5; de Lucro: 15. Para ao encontrar candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_2_name: "Equilibrada"
 eu5ab_regional_development__performance_preset_option_2_desc: "Verifica até 20 locais por dia e inicia no máximo 50 projetos por rodada. Candidatos de Planejamento: 4; de Lucro: 12. Para ao encontrar candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_3_name: "Desempenho máximo"
 eu5ab_regional_development__performance_preset_option_3_desc: "Para países com muitos locais. Verifica até 30 por dia, sem limite por rodada. Candidatos de Planejamento: 3; de Lucro: 10. Para quando há candidatos suficientes."
 eu5ab_regional_development__performance_preset_option_4_name: "Personalizado"
 eu5ab_regional_development__performance_preset_option_4_desc: "Use as configurações avançadas atuais."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Muitos locais com modelos podem reduzir o desempenho."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Desempenho Máximo processa até 30 locais por dia e não limita adições por rodada. Muitos locais podem causar lentidão mensal."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Lentidão em Oferta e Demanda: reduza Candidatos de Planejamento."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Só aparece em Oferta e Demanda. Menos Candidatos de Planejamento reduz os projetos por local e tipo enviados às verificações seguintes."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Custo: menos alternativas podem perder projetos viáveis."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Os candidatos usam a mesma ordem de planejamento. Um limite menor deixa menos alternativas se os primeiros falharem e pode não verificar um projeto posterior viável."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Lentidão na seleção por lucro: reduza Candidatos de Lucro."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Só aparece na Seleção por Lucro Previsto. Menos Candidatos de Lucro reduz os projetos por local e tipo enviados às verificações de lucro e custo do jogo."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Custo: uma lista menor pode perder edifícios realmente lucrativos."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "A seleção por lucro pré-filtra pela pontuação e depois ordena pelo lucro previsto. Um limite menor pode descartar um edifício lucrativo no pré-filtro."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Também reduza locais diários ou adições por rodada."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Menos locais por dia distribui a varredura por mais dias. Menos adições reduz verificações e inícios por rodada. Também é possível trocar a predefinição; zero adições significa ilimitado."
 eu5ab_regional_development__parallel_location_scan_name: "Processar locais separadamente"
 eu5ab_regional_development__parallel_location_scan_desc: "Verifique os locais separadamente para reduzir o tempo de uma atualização. Isso não altera classificação, orçamento nem ordem."
 eu5ab_regional_development__daily_location_task_limit_name: "Locais verificados por dia"
 eu5ab_regional_development__daily_location_task_limit_desc: "Máximo de locais verificados em detalhe por dia, de 1 a 30. Valores menores reduzem o processamento diário, mas demoram mais para cobrir o país."
 eu5ab_regional_development__max_additions_per_run_name: "Máximo de adições por rodada"
 eu5ab_regional_development__max_additions_per_run_desc: "Limite projetos iniciados numa rodada, de 0 a 600. Zero significa ilimitado."
 eu5ab_regional_development__candidates_per_location_name: "Candidatos de planejamento por local"
 eu5ab_regional_development__candidates_per_location_desc: "Só em Oferta e Demanda. Mantém de 3 a 30 candidatos por local e tipo. Mais candidatos oferecem alternativas se os primeiros falharem, mas aumentam verificações."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Candidatos de lucro por local"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Só na Seleção por Lucro. Envia de 3 a 30 candidatos por local e tipo à comparação de lucro do jogo. Mais candidatos reduzem perdas, mas aumentam verificações."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Parar ao encontrar candidatos suficientes"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Quando candidatos elegíveis atingirem o dobro do máximo desta rodada, pare de verificar os locais restantes."
 eu5ab_diagnostics_cmm_hint: "Altere as regras compartilhadas nas Configurações de Mod do Community Mod Framework. O Relatório de construção mostra o último resultado automatizado."
