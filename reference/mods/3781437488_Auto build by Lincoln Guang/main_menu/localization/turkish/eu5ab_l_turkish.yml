 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Fiyatlar temel fiyatın yüzdesidir. Çıktı fiyatı asgarinin altındaysa bina dışlanır, azaminin üstündeyse kıtlık bonusu alır. Çıktısız altyapı bu aralıkla sınırlanmaz."
