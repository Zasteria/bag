 eu5ab_cash_label: "Hazine Rezervi"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] altın"
 eu5ab_cash_help: "Hazine rezervi, inşaat başladıktan sonra kalması gereken asgari bakiyedir; ayrıca kesilmez. Proje maliyeti hazineyi bu değerin altına düşürürse proje engellenir. Örnek: 1.050 altın, 1.000 rezerv ve 100 maliyetle inşaat başlamaz."
 eu5ab_budget_section_title: "Yıllık Strateji Bütçesi"
 eu5ab_budget_short_desc: "Sabit bir tutar veya aylık gelire bağlı bütçe seçin; modlar birbirini dışlar."
 eu5ab_budget_mode_fixed: "Sabit Bütçe"
 eu5ab_budget_mode_income: "Gelire Bağlı"
 eu5ab_budget_multiplier_4: "×4 Temkinli"
