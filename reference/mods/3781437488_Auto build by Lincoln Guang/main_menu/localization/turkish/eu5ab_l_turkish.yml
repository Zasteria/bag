 eu5ab_operating_rules_title: "İnşaat Kuralları"
 eu5ab_operating_rules_short_desc: "Özel binaları, üst kaynak inşasını ve girdi kıtlıklarını ayarlayın."
 eu5ab_operating_rules_help: "Özel binalar oyun koşullarını yine karşılamalıdır. Üst kaynak inşası açıksa girdi kıtlığı fabrikayı engellediğinde Mod bir üst üretici arar. Kritik girdi kıtlığı koruması açıkken aşırı riskli projeler başlamaz."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Bu Şablonun RGO Genişletmesine İzin Ver"
 eu5ab_rgo_short_desc: "RGO'lar oyun, kullanım, bütçe ve rezerv kontrollerini geçmelidir."
 eu5ab_rgo_utilization_label: "Asgari Kullanım"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Bu ayar şablonun RGO'ları değerlendirip değerlendirmeyeceğini belirler. RGO'lar oyun kurallarını, asgari kullanımı, yıllık bütçeyi ve rezervi yine karşılamalıdır. Otomatik sıra ne zaman kontrol edileceklerini belirler; sıralama kıtlık, fiyat, kullanım ve stratejik ihtiyaca dayanır. Çifte planlamayı önlemek için temel oyunun otomatik RGO genişletmesini kapatın."
 eu5ab_toggle_special_buildings: "Özel Binalara İzin Ver"
 eu5ab_toggle_auto_build_input_sources: "Girdi Eksikliğinde Üst Kaynak İnşa Et"
 eu5ab_toggle_pause_low_workforce: "İş Gücü Yetersizse Genişlemeyi Durdur"
 eu5ab_ranking_mode_section_title: "İnşaat Karar Stratejisi"
 eu5ab_ranking_mode_current_label: "Mevcut Mod"
 eu5ab_ranking_mode_composite_value: "#G Arz-Talep Planlaması#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Tahmini Kâra Göre Seçim#!"
 eu5ab_ranking_mode_common_desc: "İki strateji de yalnızca açılmış, inşa edilebilir ve önceliği 0'ın üzerinde olan binaları değerlendirir. Getiri, bütçe, rezerv, girdiler, iş gücü ve diğer güvenlik koşulları da karşılanmalıdır. Gıda acilleri ve otomatik inşaat sırası her zaman önce gelir."
 eu5ab_ranking_mode_composite_desc: "Projeleri pazar kıtlığı, stratejik ihtiyaç, tarif verimi, yerel girdiler, fiyatlar ve iş gücü riskine göre sıralar; tam üretim zincirlerini ve uzun vadeli istikrarı öne çıkarır."
 eu5ab_ranking_mode_actual_profit_desc: "Adayları şablon ve güvenlik kurallarıyla süzer, ardından oyunun tahmini aylık kârına göre seçer. Kârlar yakınsa 0–10 bina önceliği hafifçe etkiler."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Bu strateji yalnızca konum ve mevcut tür başına önceden süzülen 3–30 aday arasından seçer; küresel en yüksek kârı garanti etmez. İnşaattan hemen önce getiri ve güvenlik kuralları yeniden kontrol edilir. RGO'lar kıtlık, fiyat, kullanım ve stratejik ihtiyaca göre sıralanmaya devam eder."
 eu5ab_ranking_mode_help: "Stratejiyi Community Mod Framework Mod Ayarları'ndan değiştirin. Arz-talep planlaması pazarları, zincirleri ve istikrarı öne çıkarır. Tahmini kâr seçimi oyunun aylık kârını kullanır; 0–10 öncelik yalnızca hafif etki sağlar."
 eu5ab_workforce_section_title: "İş Gücü"
 eu5ab_pause_workforce_short_desc: "İş gücü riskinin genişlemeyi engelleyip engellemeyeceğini belirler."
 eu5ab_job_fill_deadline_label: "İş Doldurma Süresi"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] ay"
 eu5ab_job_fill_deadline_value: "İş doldurma süresi: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] ay"
 eu5ab_job_fill_deadline_desc: "Yeni işlerin dolması için beklenecek azami süre 0–96 aydır. 0 yalnızca mevcut iş gücünün desteklediği projeleri kabul eder. Duraklatma açıksa süreyi aşan projeler başlamaz; kapalıysa risk yalnızca önceliği düşürür."
 eu5ab_deadline_0: "0 ay"
 eu5ab_deadline_3: "3 ay"
 eu5ab_deadline_6: "6 ay"
 eu5ab_deadline_12: "12 ay"
 eu5ab_toggle_stop_input_shortage: "Kritik Girdi Kıtlığında Genişlemeyi Durdur"
 eu5ab_prediction_status_label: "İş Gücü Tahmini"
 eu5ab_status_promotion_forecast: "#G Seçilen Süre İçin Terfi Tahmini#!"
 eu5ab_status_conservative_fallback: "#L Mevcut İş Gücüne Göre Temkinli Tahmin#!"
 eu5ab_prediction_promotion_short_desc: "En fazla 96 aylık süre içinde gerekli işlere terfi edebilecek çalışanları ekler."
 eu5ab_prediction_unavailable_short_desc: "Güvenilir tahmin yoksa yalnızca şu anda kullanılabilir çalışanları kullanır."
 eu5ab_workforce_help: "Duraklatma açıksa işleri süre içinde dolmayacak proje başlamaz; kapalıysa risk yalnızca önceliği azaltır. 0–96 aylık tahmin mevcut çalışanları ve terfi edebilecek kişileri toplar, gelecekteki göçü varsaymaz ve yerel uygun nüfusu aşmaz."
 eu5ab_native_input_section_title: "Yerel Girdi Tercihi"
 eu5ab_native_input_short_desc: "Aynı vilayetteki ham maddeleri kullanan binaları daha üst sıraya taşır."
 eu5ab_native_input_priority_label: "Yerel Girdi Önceliği"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Yerel girdi önceliği: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Yerel, binanın bulunduğu vilayet demektir. Tarifte daha büyük payı olan girdiler, vilayette eşleşen RGO varsa daha fazla puan sağlar. 0 yerel ham maddeleri yok sayar, 5 varsayılandır, 10 en yüksek ağırlığı verir. Yalnızca sıralamayı değiştirir; kıtlık, kâr, iş gücü ve diğer koşullar başka proje seçebilir. Zayıf pazar erişimi, düşük kontrol ve girdi kıtlığı bonusu azaltır; RGO'lar bonus almaz."
 eu5ab_price_section_title: "Fiyat Aralığı"
 eu5ab_price_short_desc: "Üretim binalarını pazar fiyatına göre süzer ve sıralar."
 eu5ab_price_min_label: "Asgari Fiyat"
 eu5ab_price_max_label: "Azami Fiyat"
