 eu5ab_budget_effective_label: "Mevcut Yıl Bütçesi"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] altın"
 eu5ab_budget_label: "Yıllık Bütçe"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] altın/yıl"
 eu5ab_budget_cash_comparison: "Yıllık strateji bütçesi bu Modun yılda ne kadar harcayabileceğini, rezerv ise hazinede kalması gereken tutarı sınırlar. İki koşul da karşılanmalıdır."
 eu5ab_budget_reset_note: "Sabit ve gelire bağlı modlar birbirini dışlar. Bütçe ilk ocak kontrolünde sıfırlanır ve yalnızca proje kuyruğa girdikten sonra düşülür."
 eu5ab_budget_help: "Tüm şablonlar tek bir ulusal yıllık bütçeyi paylaşır. Sabit tutar veya aylık toplam gelirin 4, 6 ya da 8 katını seçin. Gelire bağlı bütçe ilk ocak kontrolünde hesaplanır ve yıl boyunca sabit kalır. Binalar oyun maliyetini, RGO'lar temel maliyeti kullanır. Bütçe yalnızca proje kuyruğa girdikten sonra düşülür."
 eu5ab_quota_section_title: "Bu Modun Eşzamanlı İnşaat Sınırı"
 eu5ab_quota_short_desc: "Temel yuvaya ek olarak bu Modun aynı anda yürütebileceği sivil proje sayısını belirler."
 eu5ab_hard_cap_label: "Ek Eşzamanlı Projeler"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] proje (toplam sınır bu değer + 1)"
 eu5ab_quota_help: "0 en fazla 1, 599 en fazla 600 etkin sivil projeye izin verir. Yalnızca bu Modun başlattığı ve hâlâ yapımda olan projeler sayılır; elle yapılan inşaatlar, yollar ve diğer Modlar sayılmaz. Aylık kontrol yalnızca boş yuvaları doldurur, konum başına en fazla bir proje planlar; RGO'ların ayrı aylık sınırı yoktur."
