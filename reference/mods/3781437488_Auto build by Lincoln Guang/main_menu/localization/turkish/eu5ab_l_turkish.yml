 eu5ab_regional_development__allow_rgo_name: "RGO Genişletmesine İzin Ver"
 eu5ab_regional_development__allow_rgo_desc: "Tüm şablonların kaynak konumlarını genişletmesini değerlendirmesine izin verir."
 eu5ab_regional_development__rgo_min_utilization_name: "Asgari RGO Kullanımı"
 eu5ab_regional_development__rgo_min_utilization_desc: "Bu kullanımın altındaki RGO'yu genişletmeyin."
