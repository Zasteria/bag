 eu5ab_price_min_value: "Asgari fiyat: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_min').GetValue|0Y]%"
 eu5ab_price_max_value: "Azami fiyat: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_price_max').GetValue|0Y]%"
 eu5ab_prediction_section_title: "Otomatik İnşaat Kuralları"
 eu5ab_prediction_diagnostics_title: "İş Gücü Tahmini ve İnşaat Durumu"
 eu5ab_prediction_section_body: "Mod, Otomatik İnşaat Sırası uyarınca yükseltmeleri, normal genişletmeleri, RGO genişletmelerini ve yeni binaları denetler. Mevcut türde başlatılabilecek proje varken sonraki türe geçmez. Yiyeceğin tükenmesi bekleniyorsa veya stok %25 ve altındaysa yiyecek projeleri önce ele alınır ve seçili getiri şartından muaf olur. İnşaat malları, savaş zamanı askerî mallar veya stratejik üretimin üst girdilerindeki ciddi kıtlık da tür sırasını değiştirmeden getiri şartını gevşetebilir. Yıllık bütçe, hazine rezervi, malzemeler, girdiler, iş gücü ve oyunun inşaat kuralları her zaman geçerlidir. Yalnızca açılmış en yeni kademe değerlendirilir; yükseltmelerde sadece yeni işler sayılır."
 eu5ab_diagnostics_title: "Otomatik İnşaat Durumu"
 eu5ab_diagnostics_snapshot_note: "Ayarlar hemen kaydedilir; İnşaat Raporu her aylık denetimden sonra güncellenir."
 eu5ab_diagnostics_snapshot_help: "Bu sayfa canlı verileri değil, ayın 22'sinde tamamlanan son denetimi gösterir. Ayarları veya şablon kapsamını değiştirdikten sonra sonraki aylık denetimi bekleyin; kapasite, başlangıçlar, ret nedenleri ve adaylar birlikte güncellenir."
 eu5ab_diag_overview_title: "Aylık İnşaat Özeti"
 eu5ab_diag_quota_title: "Bu Denetimdeki İnşaat Kapasitesi"
 eu5ab_diag_result_title: "Bu Denetimde Başlatılan Projeler"
