 eu5ab_regional_development__job_fill_deadline_months_name: "İş Doldurma Süresi (Ay)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Yerel nüfusun yeni işlere terfi tahmin süresi."
 eu5ab_regional_development__native_input_priority_name: "Yerel Girdi Önceliği"
 eu5ab_regional_development__native_input_priority_desc: "0–10; yüksek değerler aynı vilayetin ham maddelerini kullanan binaları önceliklendirir."
 eu5ab_regional_development__performance_preset_name: "Performans Ön Ayarı"
 eu5ab_regional_development__performance_preset_desc: "Ön ayar aşağıdaki gelişmiş seçenekleri eşler. Özel, geçerli değerleri korur."
 eu5ab_regional_development__performance_preset_option_1_name: "Temkinli"
 eu5ab_regional_development__performance_preset_option_1_desc: "Günde en fazla 10 konumu denetler, çalışma başına en çok 30 proje başlatır. Planlama Adayı: 5; Kâr Adayı: 15. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_2_name: "Dengeli"
 eu5ab_regional_development__performance_preset_option_2_desc: "Günde en fazla 20 konumu denetler, çalışma başına en çok 50 proje başlatır. Planlama Adayı: 4; Kâr Adayı: 12. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_3_name: "Azami Verim"
 eu5ab_regional_development__performance_preset_option_3_desc: "Çok konumlu ülkeler içindir. Günde en fazla 30 konumu denetler, çalışma başına sınır yoktur. Planlama Adayı: 3; Kâr Adayı: 10. Yeterli aday bulununca durur."
 eu5ab_regional_development__performance_preset_option_4_name: "Özel"
 eu5ab_regional_development__performance_preset_option_4_desc: "Geçerli gelişmiş ayarları kullanın."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Çok sayıda şablonlu konum oyun performansını düşürebilir."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Azami Verim günde en fazla 30 konumu işler ve çalışma başına ekleme sınırı koymaz. Çok konum aylık işlemi yavaşlatabilir."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Arz-Talep Yavaşsa: Planlama Adaylarını Azaltın."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Yalnızca Arz ve Talepte gösterilir. Planlama Adaylarını azaltmak, konum ve tür başına sonraki denetimlere giden proje sayısını düşürür."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Bedel: Daha Az Alternatif Uygun Projeleri Kaçırabilir."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Adaylar aynı planlama sırasını kullanır. Düşük sınır üsttekiler başarısız olduğunda daha az alternatif bırakır ve sonraki uygun proje denetlenmeyebilir."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Kâr Seçimi Yavaşsa: Kâr Adaylarını Azaltın."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Yalnızca Öngörülen Kâr Seçiminde gösterilir. Kâr Adaylarını azaltmak, konum ve tür başına oyunun kâr ve maliyet denetimlerine giden proje sayısını düşürür."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Bedel: Küçük Liste Gerçekten Kârlı Binaları Kaçırabilir."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Kâr seçimi önce planlama puanıyla ön eleme yapar, sonra öngörülen kâra göre sıralar. Düşük sınır kârlı binayı ön elemede eleyebilir."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Günlük Konumları veya Çalışma Başına Eklemeleri de Azaltın."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Günde daha az konum taramayı daha çok güne yayar. Çalışma başına daha az ekleme denetimleri ve başlangıçları azaltır. Ön ayar da değiştirilebilir; sıfır sınırsızdır."
 eu5ab_regional_development__parallel_location_scan_name: "Konumları Ayrı İşle"
 eu5ab_regional_development__parallel_location_scan_desc: "Tek güncelleme süresini azaltmak için konumları ayrı denetler. Sıralama, bütçe veya inşaat sırası değişmez."
 eu5ab_regional_development__daily_location_task_limit_name: "Günlük Denetlenen Konum"
 eu5ab_regional_development__daily_location_task_limit_desc: "Günde ayrıntılı denetlenen azami konum, 1–30. Düşük değerler günlük yükü azaltır ancak ülkeyi taramak daha uzun sürer."
 eu5ab_regional_development__max_additions_per_run_name: "Çalışma Başına Azami Ekleme"
 eu5ab_regional_development__max_additions_per_run_desc: "Bir çalışmada başlayan projeleri 0–600 arasında sınırlar. Sıfır sınırsızdır."
 eu5ab_regional_development__candidates_per_location_name: "Konum Başına Planlama Adayı"
 eu5ab_regional_development__candidates_per_location_desc: "Yalnızca Arz ve Talepte. Konum ve tür başına 3–30 aday tutar. Daha fazlası üsttekiler başarısız olursa alternatif sağlar ancak denetimleri artırır."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Konum Başına Kâr Adayı"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Yalnızca Kâr Seçiminde. Konum ve tür başına 3–30 adayı oyunun kâr karşılaştırmasına yollar. Daha fazlası kaçırmayı azaltır ancak denetimleri artırır."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Yeterli Aday Bulununca Denetimi Durdur"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Uygun adaylar çalışma azamisinin iki katına ulaşınca kalan konumları denetlemeyi bırakın."
