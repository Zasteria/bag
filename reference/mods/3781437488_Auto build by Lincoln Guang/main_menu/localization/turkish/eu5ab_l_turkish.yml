 eu5ab_regional_development__performance__preset_name: "Performans Ön Ayarı"
 eu5ab_regional_development__performance__preset_desc: "Ön ayarlar aşağıdaki seçenekleri düzenler. Gelişmiş bir ayarı değiştirmek Özel seçeneğine geçirir; yeni değerler sonraki aylık denetimde uygulanır."
 eu5ab_regional_development__performance__advanced_name: "Gelişmiş Ayarlar"
 eu5ab_regional_development__performance__advanced_desc: "Konumların nasıl ve kaç tane denetleneceğini, çalışma başına azami projeyi, aday listelerini ve erken durmayı ayarlayın."
 eu5ab_regional_development__general__limits_name: "Genel Denetimler ve Eşzamanlı Sınır"
 eu5ab_regional_development__general__limits_desc: "Modun çalışmasını ve aynı anda kaç sivil projeyi yönetebileceğini belirler."
 eu5ab_regional_development__general__returns_name: "Getiri Kuralları ve Acil Durum İstisnaları"
 eu5ab_regional_development__general__returns_desc: "Normal binaların asgari getirisini ve gıda, malzeme, askerî mal veya stratejik girdi kıtlığında gevşetilip gevşetilmeyeceğini belirleyin."
 eu5ab_regional_development__finance__budget_name: "Paylaşılan Yıllık Bütçe"
 eu5ab_regional_development__finance__budget_desc: "Tüm şablonlar, binalar ve RGO'lar tek bir ulusal yıllık bütçeyi paylaşır."
 eu5ab_regional_development__finance__market_name: "Pazar Fiyat Aralığı"
 eu5ab_regional_development__finance__market_desc: "Temel fiyata göre paylaşılan asgari ve yüksek fiyat yüzdelerini ayarlayın."
 eu5ab_regional_development__automation__safety_name: "İnşaat Güvenlik Kuralları"
 eu5ab_regional_development__automation__safety_desc: "Özel binalar, üst kaynaklar, iş gücü ve girdi kıtlığı için paylaşılan kurallar."
 eu5ab_regional_development__automation__rgo_name: "RGO Genişletmesi"
 eu5ab_regional_development__automation__rgo_desc: "Paylaşılan RGO etkinliği ve asgari kullanım. Konumlar kıtlık, fiyat, kullanım ve stratejik ihtiyaca göre sıralanır."
 eu5ab_regional_development__automation__workforce_name: "İş Gücü Tahmini"
 eu5ab_regional_development__automation__workforce_desc: "Yeni işleri doldurmak için paylaşılan tahmin süresi."
 eu5ab_regional_development__automation__ranking_name: "İnşaat Karar Stratejisi"
 eu5ab_regional_development__automation__ranking_desc: "Normal bina stratejisini, yükseltme, genişletme, RGO ve yeni bina sırasını ve yerel girdi etkisini ayarlayın."
 eu5ab_regional_development__candidate_ranking_mode_name: "Normal Bina Stratejisi"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Koşullar sağlandıktan sonraki son sıralamayı seçin. Gıda aciliyeti ve İnşaat Sırası önce gelir; RGO'lar kıtlık, fiyat, kullanım ve stratejik ihtiyacı kullanır."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Arz ve Talep"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Projeleri pazar kıtlığı, stratejik ihtiyaç, tarif verimi, yerel girdiler, fiyatlar ve iş gücü riskine göre sıralar; tam üretim zincirlerini ve uzun vadeli istikrarı öne çıkarır."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Öngörülen Kâr"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Adayları şablon ve güvenlik kurallarıyla süzer, ardından oyunun tahmini aylık kârına göre seçer. Kârlar yakınsa 0–10 bina önceliği hafifçe etkiler."
 eu5ab_regional_development__automation__candidate_priority_name: "Otomatik İnşaat Sırası"
 eu5ab_regional_development__automation__candidate_priority_desc: "Dört türü sürükleyerek sırayı belirleyin. Mod sonraki türe geçmeden mevcut türdeki tüm uygun projeleri ve alternatifleri dener. Gıda acilinde gıda projeleri önce gelir ancak bu sırayı izler."
 eu5ab_regional_development__candidate_priority_name: "Otomatik İnşaat Sırası"
 eu5ab_regional_development__candidate_priority_desc: "Yükseltmeleri, normal genişletmeleri, RGO genişletmelerini ve yeni binaları sıralamak için sürükleyin."
 eu5ab_regional_development__candidate_priority_item_column_name: "İnşaat Türü"
 eu5ab_regional_development__candidate_priority_i1_name: "Binaları Yükselt"
 eu5ab_regional_development__candidate_priority_i1_desc: "Eski bir binayı yükseltme zincirindeki açılmış en yeni kademeyle değiştirir."
 eu5ab_regional_development__candidate_priority_i2_name: "Mevcut Binaları Genişlet"
 eu5ab_regional_development__candidate_priority_i2_desc: "Mevcut normal binaya bir seviye ekler; değiştirme ve RGO hariçtir."
 eu5ab_regional_development__candidate_priority_i3_name: "Kaynak Konumlarını Genişlet"
 eu5ab_regional_development__candidate_priority_i3_desc: "Yerel RGO'yu genişletir; kullanım, yıllık bütçe, hazine rezervi ve diğer güvenceler geçerlidir."
 eu5ab_regional_development__candidate_priority_i4_name: "Yeni Binalar İnşa Et"
 eu5ab_regional_development__candidate_priority_i4_desc: "Konumda henüz bulunmayan normal bir binayı sıfırdan kurar."
 eu5ab_regional_development__enabled_name: "Otomatik İnşaatı Etkinleştir"
 eu5ab_regional_development__enabled_desc: "Kapatıldığında şablonlar ve bağlantılar saklanır ancak aylık otomatik inşaat durur."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Ek Eşzamanlı Projeler"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Temel yuvaya ek eşzamanlı sivil proje sayısıdır. 0 toplam 1, 599 ise 600 projeye izin verir. Elle inşaat, yollar ve diğer Modlar sayılmaz."
 eu5ab_regional_development__budget_mode_name: "Yıllık Bütçe Modu"
