 eu5ab_regional_development__auto_build_input_sources_desc: "Planlanan bina girdi kıtlığı nedeniyle başlayamazsa izin verilen bir üst kaynağı deneyin."
 eu5ab_regional_development__pause_low_workforce_name: "Düşük İş Gücünde Duraklat"
