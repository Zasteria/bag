 eu5ab_regional_development__emergency_food_stockpile_override_desc: "Yiyecek stoku %25 veya altındaysa gıda projelerini önce ele alın ve normal gıda binalarının getiri şartını kaldırın; diğer tüm kurallar geçerlidir."
 eu5ab_regional_development__emergency_construction_goods_override_name: "İnşaat Arzı %65 Altında: Getiriyi Yok Say"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Temel inşaat malının arzı ihtiyacın %65'inden azsa üreticileri getiri şartından muaf olur. Diğer kurallar geçerlidir."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Savaşta Askerî Arz %65 Altında: Getiriyi Yok Say"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Savaşta askerî mal arzı ihtiyacın %65'inden azsa üreticileri getiri şartından muaf olur; diğer kurallar geçerlidir."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Stratejik Üretimde Girdi Yok: Üst Getiriyi Yok Say"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "%65 altındaki üst girdi arzı yerli gıda, inşaat veya askerî üretimi durdurursa üreticileri getiri şartından muaf olur; diğer kurallar geçerlidir."
