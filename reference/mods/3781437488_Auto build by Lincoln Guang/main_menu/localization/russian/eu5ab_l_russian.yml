 eu5ab_prediction_diagnostics_title: "Оценка рабочей силы и состояние строительства"
 eu5ab_prediction_section_body: "Мод проверяет улучшения, обычные расширения, расширения RGO и новые здания согласно Порядку автоматического строительства. Пока можно начать проект текущего типа, к следующему типу он не переходит. Если продовольствие скоро закончится или запас не превышает 25%, продовольственные проекты выполняются первыми и не обязаны соответствовать выбранной доходности. Сильный дефицит стройматериалов, военных товаров во время войны или стратегических ресурсов также может отменить требование доходности, не меняя порядок типов. Годовой бюджет, резерв казны, материалы, ресурсы, рабочая сила и правила игры действуют всегда. Учитывается только новейший открытый уровень; для улучшений считаются лишь новые рабочие места."
 eu5ab_diagnostics_title: "Состояние автоматического строительства"
 eu5ab_diagnostics_snapshot_note: "Настройки сохраняются сразу; отчёт о строительстве обновляется после каждой ежемесячной проверки."
 eu5ab_diagnostics_snapshot_help: "Здесь показана последняя проверка, завершённая 22-го числа, а не данные в реальном времени. После изменения настроек или охвата шаблонов дождитесь следующей ежемесячной проверки: лимиты, запуски, причины отказа и кандидаты обновятся вместе."
