 eu5ab_diag_rgo_help: "Показывает результаты локаций RGO при прошлой проверке. Загрузка зависит от текущих работников и уровней расширения. Новый уровень требует 1000 работников; оценка включает безработных рабочих, подходящих безработных рабов и население, способное перейти в рабочие до срока."
