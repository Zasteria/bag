l_russian:
 eu5ab_window_title: "Автоматизированное региональное развитие"
 eu5ab_template_editor_title: "Изменить шаблон регионального развития"
 eu5ab_template_buildings_window_title: "Правила зданий"
 eu5ab_template_rules_window_title: "Отчёт о строительстве"
 eu5ab_template_rename_window_title: "Переименовать шаблон"
 eu5ab_template_scope_window_title: "Текущая область применения"
 eu5ab_automation_buildings_tab: "Автоматизированное строительство"
 eu5ab_automation_buildings_tab_desc: "Управляйте шаблонами, приоритетами зданий и областью применения. Общие для всех шаблонов правила изменяются в настройках мода Community Mod Framework."
 eu5ab_action_bar_name: "Advanced Auto Build"
 eu5ab_action_bar_tooltip: "Откройте панель шаблонов регионального развития, настройте приоритеты зданий и область применения и просмотрите последний отчёт об автоматизированном строительстве."
 eu5ab_action_bar_icon: "@production_panel!"
 eu5ab_action_bar_color: "gold"
 eu5ab_template_overview_title: "Шаблоны регионального развития"
 eu5ab_presets_tab: "Тематические шаблоны"
 eu5ab_presets_tab_tooltip: "Доступные только для чтения приоритеты зданий для различных целей развития."
 eu5ab_custom_tab: "Пользовательские шаблоны"
 eu5ab_custom_tab_tooltip: "Настройте собственные приоритеты зданий и область применения."
 eu5ab_sidebar_title: "Шаблоны"
 eu5ab_detail_title: "Подробности правил"
 eu5ab_new_template_plus_button: "+ Новый шаблон"
 eu5ab_new_blank_template_button: "+ Пустой шаблон"
 eu5ab_new_recommended_template_button: "+ Рекомендуемый шаблон"
 eu5ab_custom_empty_detail: "Выберите пользовательский шаблон слева либо создайте пустой шаблон или шаблон с рекомендуемыми приоритетами."
 eu5ab_template_intro_title: "Редактор шаблонов"
 eu5ab_automation_buildings_intro: "В пользовательских шаблонах можно свободно изменять приоритеты зданий и назначения. Тематические шаблоны доступны только для чтения, но их можно скопировать в пользовательские и затем редактировать."
 eu5ab_player_templates_button: "Шаблоны игрока"
 eu5ab_copy_preset_to_player_button: "Копировать как шаблон игрока"
 eu5ab_delete_template_button: "Удалить шаблон"
 eu5ab_delete_template_tooltip: "Удалить этот пользовательский шаблон. После подтверждения все использующие его локации также потеряют назначение."
 eu5ab_delete_template_confirm_prompt: "Удалить текущий шаблон?"
 eu5ab_delete_template_confirm_button: "Подтвердить удаление"
 eu5ab_delete_template_confirm_tooltip: "Безвозвратно удалить текущий шаблон и все его привязки к локациям. Локации снова станут неназначенными. Это действие нельзя отменить."
 eu5ab_delete_template_cancel_button: "Отмена"
 eu5ab_delete_template_cancel_tooltip: "Отменить удаление и вернуться к действиям с шаблоном."
 eu5ab_pause_template_button: "Приостановить шаблон"
 eu5ab_resume_template_button: "Возобновить шаблон"
 eu5ab_template_paused_badge: " (Приостановлен)"
 eu5ab_pause_template_tooltip: "Временно приостановите или возобновите этот шаблон. При приостановке приоритеты зданий и привязки локаций сохраняются, но автоматизированное строительство не использует шаблон."
 eu5ab_select_template_tooltip: "Выберите этот шаблон и просмотрите подробности его правил."
 eu5ab_preset_readonly_desc: "Этот тематический шаблон только для чтения можно независимо приостанавливать, возобновлять и назначать. Скопируйте его как пользовательский шаблон, чтобы изменить приоритеты зданий. Общие правила изменяются в настройках мода Community Mod Framework."
 eu5ab_template_name_pencil_hint: "Название шаблона"
 eu5ab_template_name_click_hint: "Нажмите на название, чтобы переименовать"
 eu5ab_template_name_click_tooltip: "Введите новое название текущего шаблона."
 eu5ab_template_rename_desc: "Введите новое название текущего шаблона. Из-за ограничений интерфейса игры пользовательское название отображается только в текущем сеансе; остальные правила и привязки локаций сохраняются."
 eu5ab_template_rename_input: "Название шаблона"
 eu5ab_template_rename_accept: "Подтвердить"
 eu5ab_template_rename_cancel: "Отмена"
 eu5ab_target_location_title: "Целевая локация"
 eu5ab_target_location_desc: "Выберите локацию, прежде чем очищать её настройки или прекращать обновления от шаблона провинции. Для назначения шаблона используйте кнопки выбора на соответствующей карточке."
 eu5ab_template_editor_desc: "Настройте приоритеты зданий и область применения этого шаблона. Общие для всей страны правила бюджета, рынка, рабочей силы и безопасности строительства задаются в настройках мода Community Mod Framework."
 eu5ab_template_auto_save_hint: "Изменения сохраняются сразу. Закройте окно, чтобы вернуться."
 eu5ab_rules_tab_finance: "Финансы и строительство"
 eu5ab_rules_tab_automation: "Рабочая сила и строительные предпочтения"
 eu5ab_rules_tab_diagnostics: "Отчёт о строительстве"
 eu5ab_template_editor_sections_title: "Настройки шаблона"
 eu5ab_template_editor_sections_desc: "Каждый шаблон хранит состояние, область применения и приоритеты зданий. Последний месячный результат показан в отчёте о строительстве."
 eu5ab_open_buildings_editor_button: "Правила строительства"
 eu5ab_open_rules_editor_button: "Отчёт о строительстве"
 eu5ab_edit_template_button: "Изменить"
 eu5ab_copy_to_slot_button: "Копировать сюда"
 eu5ab_policy_section_title: "Правила шаблона"
 eu5ab_cash_section_title: "Резерв казны"
 eu5ab_cash_short_desc: "Минимальная сумма, которая должна остаться в казне."
 eu5ab_cash_label: "Резерв казны"
 eu5ab_active_cash_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_min_cash_reserve').GetValue|0] золота"
 eu5ab_cash_help: "Резерв казны — минимальная сумма, которая должна остаться после начала строительства; отдельно она не списывается. Проект блокируется, если его стоимость опустит казну ниже этого значения. Пример: при 1050 золота, резерве 1000 и стоимости 100 строительство не начнётся."
 eu5ab_budget_section_title: "Годовой стратегический бюджет"
 eu5ab_budget_short_desc: "Выберите фиксированную сумму или бюджет, связанный с месячным доходом; режимы взаимоисключающие."
 eu5ab_budget_mode_fixed: "Фиксированный бюджет"
 eu5ab_budget_mode_income: "Связан с доходом"
 eu5ab_budget_multiplier_4: "×4 Осторожный"
 eu5ab_budget_multiplier_6: "×6 Рекомендуемый"
 eu5ab_budget_multiplier_8: "×8 Активный"
 eu5ab_budget_effective_label: "Бюджет текущего года"
 eu5ab_budget_effective_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_budget_limit').GetValue|0] золота"
 eu5ab_budget_label: "Годовой бюджет"
 eu5ab_annual_budget_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_annual_budget').GetValue|0] золота/год"
 eu5ab_budget_cash_comparison: "Годовой стратегический бюджет ограничивает расходы этого мода за год, а резерв задаёт минимум в казне. Необходимо выполнить оба условия."
 eu5ab_budget_reset_note: "Фиксированный и связанный с доходом режимы взаимоисключающие. Бюджет сбрасывается при первой январской проверке и списывается только после попадания проекта в очередь."
 eu5ab_budget_help: "Все шаблоны используют единый национальный годовой бюджет. Выберите фиксированную сумму или 4, 6 либо 8 месячных совокупных доходов. Бюджет по доходу рассчитывается при первой январской проверке и фиксируется на год. Здания используют фактическую стоимость игры, RGO — базовую. Бюджет списывается только после попадания проекта в очередь."
 eu5ab_quota_section_title: "Лимит одновременного строительства этого мода"
 eu5ab_quota_short_desc: "Задаёт число дополнительных гражданских проектов этого мода сверх базового места."
 eu5ab_hard_cap_label: "Дополнительные одновременные проекты"
 eu5ab_hard_cap_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_monthly_build_hard_cap').GetValue|0] проектов (общий лимит равен этому значению + 1)"
 eu5ab_quota_help: "0 означает не более 1 активного гражданского проекта, а 599 — не более 600. Учитываются только начатые этим модом и ещё строящиеся проекты; ручное строительство, дороги и другие моды не учитываются. Ежемесячная проверка заполняет лишь свободные места, не более одного проекта на локацию; у RGO нет отдельного месячного лимита."
 eu5ab_template_cash_value: "Резерв казны: [GetPlayer.MakeScope.GetVariable('eu5ab_tpl_min_cash_reserve').GetValue|0Y]@gold!"
 eu5ab_step_dec_10k: "-10K"
 eu5ab_step_dec_1k: "-1K"
 eu5ab_step_inc_1k: "+1K"
 eu5ab_step_inc_10k: "+10K"
 eu5ab_step_dec_10: "-10"
 eu5ab_step_dec_1: "-1"
 eu5ab_step_inc_1: "+1"
 eu5ab_step_inc_10: "+10"
 eu5ab_step_dec_5: "-5"
 eu5ab_step_inc_5: "+5"
 eu5ab_step_dec_100: "-100"
 eu5ab_step_inc_100: "+100"
 eu5ab_building_rules_title: "Правила зданий"
 eu5ab_building_rules_desc: "В первой строке фильтруйте по рабочей силе, во второй — по эпохе открытия. Приоритеты от 0,0 до 10,0; 0 запрещает строительство. На странице особых зданий показаны только те, которые страна может построить хотя бы в одной своей локации."
 eu5ab_allow_button: "Разрешить"
 eu5ab_ban_button: "Запретить"
 eu5ab_priority_decrease: "−"
 eu5ab_priority_increase: "+"
 eu5ab_priority_decrease_default_tt: "Снизить приоритет на 0,1"
 eu5ab_priority_decrease_ctrl_tt: "Ctrl: снизить приоритет на 0,5"
 eu5ab_priority_decrease_shift_tt: "Shift: снизить приоритет на 1,0"
 eu5ab_priority_increase_default_tt: "Повысить приоритет на 0,1"
 eu5ab_priority_increase_ctrl_tt: "Ctrl: повысить приоритет на 0,5"
 eu5ab_priority_increase_shift_tt: "Shift: повысить приоритет на 1,0"
 eu5ab_priority_scale_hint: "0 отключает"
 eu5ab_clear_visible_priorities_button: "Обнулить текущий список"
 eu5ab_clear_visible_priorities_tooltip: "Немедленно устанавливает 0 для всех зданий, видимых при текущих фильтрах, и сохраняет шаблон. Скрытые здания не меняются."
 eu5ab_priority_low: "Низкий"
 eu5ab_priority_medium: "Средний"
 eu5ab_priority_high: "Высокий"
 eu5ab_priority_high_icon: "↑"
 eu5ab_priority_medium_icon: "–"
 eu5ab_priority_low_icon: "↓"
 eu5ab_ban_icon: "×"
 eu5ab_filter_all: "Все"
 eu5ab_filter_rural: "Сельские"
 eu5ab_filter_laborers: "Рабочие"
 eu5ab_filter_burghers: "Горожане"
 eu5ab_filter_soldiers: "Военные"
 eu5ab_filter_special: "Особые"
 eu5ab_age_all: "Все эпохи"
 eu5ab_building_age_1: "Эпоха традиций"
 eu5ab_building_age_2: "Эпоха Возрождения"
 eu5ab_building_age_3: "Эпоха открытий"
 eu5ab_building_age_4: "Эпоха Реформации"
 eu5ab_building_age_5: "Эпоха абсолютизма"
 eu5ab_building_age_6: "Эпоха революций"
 eu5ab_status_enabled: "#G Включено#!"
 eu5ab_status_disabled: "#L Отключено#!"
 eu5ab_status_currently_available: "#G Доступно#!"
 eu5ab_operating_rules_title: "Правила строительства"
 eu5ab_operating_rules_short_desc: "Настройте особые здания, строительство источников сырья и нехватку ресурсов."
 eu5ab_operating_rules_help: "Особые здания всё равно должны соответствовать условиям игры. При включённом строительстве источников мод ищет вышестоящего производителя, если нехватка ресурсов блокирует фабрику. Защита от критической нехватки не позволяет начинать слишком рискованные проекты."
 eu5ab_rgo_section_title: "RGO"
 eu5ab_rgo_allow: "Разрешить этому шаблону расширять RGO"
 eu5ab_rgo_short_desc: "RGO должны пройти проверки игры, загрузки, бюджета и резерва."
 eu5ab_rgo_utilization_label: "Минимальная загрузка"
 eu5ab_rgo_utilization_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_rgo_min_utilization').GetValue|0]%"
 eu5ab_rgo_help: "Эта настройка определяет, рассматривает ли шаблон RGO. Они всё равно должны выполнять правила игры, требования загрузки, годового бюджета и резерва. Автоматический порядок задаёт момент проверки, а рейтинг учитывает дефицит, цену, загрузку и стратегическую потребность. Отключите автоматическое расширение RGO в основной игре, чтобы избежать дублирования."
 eu5ab_toggle_special_buildings: "Разрешить особые здания"
 eu5ab_toggle_auto_build_input_sources: "Строить источники при нехватке ресурсов"
 eu5ab_toggle_pause_low_workforce: "Остановить расширение при нехватке работников"
 eu5ab_ranking_mode_section_title: "Стратегия выбора строительства"
 eu5ab_ranking_mode_current_label: "Текущий режим"
 eu5ab_ranking_mode_composite_value: "#G Планирование спроса и предложения#!"
 eu5ab_ranking_mode_actual_profit_value: "#G Выбор по прогнозируемой прибыли#!"
 eu5ab_ranking_mode_common_desc: "Обе стратегии рассматривают только открытые и доступные здания с приоритетом выше 0. Также действуют требования доходности, бюджета, резерва, ресурсов, рабочей силы и безопасности. Продовольственные чрезвычайные ситуации и автоматический порядок всегда важнее."
 eu5ab_ranking_mode_composite_desc: "Ранжирует проекты по рыночному дефициту, стратегической потребности, эффективности рецептов, местным ресурсам, ценам и риску рабочей силы, отдавая предпочтение полным цепочкам и долгосрочной стабильности."
 eu5ab_ranking_mode_actual_profit_desc: "Фильтрует кандидатов по правилам шаблона и безопасности, затем выбирает по прогнозируемой игрой месячной прибыли. Приоритет 0–10 мягко влияет при близкой прибыли."
 eu5ab_ranking_mode_actual_profit_scope_desc: "Стратегия выбирает лишь из 3–30 кандидатов, заранее отобранных для локации и текущего типа, поэтому не гарантирует максимальную прибыль в мире. До начала строительства доходность и безопасность проверяются повторно. RGO по-прежнему ранжируются по дефициту, цене, загрузке и стратегической потребности."
 eu5ab_ranking_mode_help: "Переключайте стратегию в настройках мода Community Mod Framework. Планирование спроса и предложения отдаёт приоритет рынкам, цепочкам и стабильности. Выбор по прибыли использует прогноз месячной прибыли игры, а приоритет 0–10 влияет лишь мягко."
 eu5ab_workforce_section_title: "Рабочая сила"
 eu5ab_pause_workforce_short_desc: "Определяет, блокирует ли риск рабочей силы расширение."
 eu5ab_job_fill_deadline_label: "Срок заполнения рабочих мест"
 eu5ab_job_fill_deadline_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_value: "Срок заполнения: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_job_fill_deadline_months').GetValue|0] мес."
 eu5ab_job_fill_deadline_desc: "Максимальное ожидание заполнения новых рабочих мест: 0–96 месяцев. 0 учитывает только текущую рабочую силу. При включённой остановке проекты за пределами срока не начинаются; иначе риск лишь снижает приоритет."
 eu5ab_deadline_0: "0 мес."
 eu5ab_deadline_3: "3 мес."
 eu5ab_deadline_6: "6 мес."
 eu5ab_deadline_12: "12 мес."
 eu5ab_toggle_stop_input_shortage: "Остановить расширение при критической нехватке ресурсов"
 eu5ab_prediction_status_label: "Оценка рабочей силы"
 eu5ab_status_promotion_forecast: "#G Прогноз продвижения на выбранный срок#!"
 eu5ab_status_conservative_fallback: "#L Консервативная оценка текущей рабочей силы#!"
 eu5ab_prediction_promotion_short_desc: "Добавляет работников, способных перейти в нужные профессии в выбранный срок до 96 месяцев."
 eu5ab_prediction_unavailable_short_desc: "Если надёжный прогноз невозможен, учитываются только доступные сейчас работники."
 eu5ab_workforce_help: "При включённой остановке проект не начинается, если рабочие места вряд ли будут заполнены к сроку; иначе риск лишь снижает приоритет. Прогноз на 0–96 месяцев складывает доступных работников и способных перейти в нужный класс, не предполагая миграцию и не превышая подходящее местное население."
 eu5ab_native_input_section_title: "Предпочтение местного сырья"
 eu5ab_native_input_short_desc: "Повышает рейтинг зданий, использующих сырьё из той же провинции."
 eu5ab_native_input_priority_label: "Приоритет местного сырья"
 eu5ab_native_input_priority_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_value: "Приоритет местного сырья: [GetPlayer.MakeScope.GetVariable('eu5ab_edit_native_input_priority').GetValue|0] / 10"
 eu5ab_native_input_priority_desc: "Местное означает провинцию здания. Чем выше доля ресурса в рецепте, тем больше очков даёт соответствующее RGO в той же провинции. 0 игнорирует местное сырьё, 5 — стандарт, 10 — максимальный вес. Это меняет только рейтинг; дефицит, прибыль, рабочая сила и другие условия могут выбрать другой проект. Плохой доступ к рынку, низкий контроль и нехватка ресурсов снижают бонус; сами RGO его не получают."
 eu5ab_price_section_title: "Диапазон цен"
 eu5ab_price_short_desc: "Фильтрует и ранжирует производственные здания по рыночной цене."
 eu5ab_price_min_label: "Минимальная цена"
 eu5ab_price_max_label: "Максимальная цена"
 eu5ab_active_price_min_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_min').GetValue|0]%"
 eu5ab_active_price_max_amount: "[GetPlayer.MakeScope.GetVariable('eu5ab_edit_price_max').GetValue|0]%"
 eu5ab_price_section_desc: "Цены измеряются в процентах от базовой цены. Здание исключается ниже минимума и получает бонус дефицита выше максимума. Инфраструктура без продукции не ограничивается."
