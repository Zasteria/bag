 eu5ab_regional_development_name: "Advanced Auto Build"
 eu5ab_regional_development_desc: "Настройте общий для всех шаблонов бюджет, требования, стратегию решений и производительность. Каждый шаблон отдельно хранит состояние, охват и приоритеты."
 eu5ab_regional_development__general_name: "Управление и лимиты"
 eu5ab_regional_development__finance_name: "Финансы и рынок"
 eu5ab_regional_development__automation_name: "Безопасность и рейтинг"
 eu5ab_regional_development__performance_name: "Оптимизация производительности"
 eu5ab_regional_development__performance__preset_name: "Предустановка производительности"
 eu5ab_regional_development__performance__preset_desc: "Предустановки меняют параметры ниже. Ручное изменение расширенного параметра переключает на «Пользовательский»; новые значения действуют со следующей проверки."
 eu5ab_regional_development__performance__advanced_name: "Расширенные настройки"
 eu5ab_regional_development__performance__advanced_desc: "Настройте способ и число проверяемых локаций, максимум проектов за запуск, списки кандидатов и раннюю остановку."
 eu5ab_regional_development__general__limits_name: "Управление и одновременный лимит"
 eu5ab_regional_development__general__limits_desc: "Определяет работу мода и число гражданских проектов, которыми он может управлять одновременно."
 eu5ab_regional_development__general__returns_name: "Доходность и экстренные исключения"
 eu5ab_regional_development__general__returns_desc: "Задайте минимальную доходность обычных зданий и возможность отмены при нехватке продовольствия, стройматериалов, военных товаров или стратегических ресурсов."
 eu5ab_regional_development__finance__budget_name: "Общий годовой бюджет"
 eu5ab_regional_development__finance__budget_desc: "Все шаблоны, здания и RGO используют единый национальный годовой бюджет."
 eu5ab_regional_development__finance__market_name: "Диапазон рыночных цен"
 eu5ab_regional_development__finance__market_desc: "Задайте общие проценты минимальной и высокой цены относительно базовой."
 eu5ab_regional_development__automation__safety_name: "Правила безопасного строительства"
 eu5ab_regional_development__automation__safety_desc: "Общие правила для особых зданий, источников сырья, рабочей силы и нехватки ресурсов."
 eu5ab_regional_development__automation__rgo_name: "Расширение RGO"
 eu5ab_regional_development__automation__rgo_desc: "Общее включение RGO и минимальная загрузка. Локации сортируются по дефициту, цене, загрузке и стратегической необходимости."
 eu5ab_regional_development__automation__workforce_name: "Прогноз рабочей силы"
 eu5ab_regional_development__automation__workforce_desc: "Общий горизонт заполнения новых рабочих мест."
 eu5ab_regional_development__automation__ranking_name: "Стратегия выбора строительства"
 eu5ab_regional_development__automation__ranking_desc: "Выберите стратегию обычных зданий, порядок улучшений, расширений, RGO и новых строек, а также влияние местного сырья."
 eu5ab_regional_development__candidate_ranking_mode_name: "Стратегия обычных зданий"
 eu5ab_regional_development__candidate_ranking_mode_desc: "Выберите итоговую сортировку после выполнения условий. Продовольственная срочность и Порядок строительства важнее; RGO используют дефицит, цену, загрузку и стратегическую необходимость."
 eu5ab_regional_development__candidate_ranking_mode_option_1_name: "Спрос и предложение"
 eu5ab_regional_development__candidate_ranking_mode_option_1_desc: "Ранжирует проекты по рыночному дефициту, стратегической потребности, эффективности рецептов, местным ресурсам, ценам и риску рабочей силы, отдавая предпочтение полным цепочкам и долгосрочной стабильности."
 eu5ab_regional_development__candidate_ranking_mode_option_2_name: "Прогнозируемая прибыль"
 eu5ab_regional_development__candidate_ranking_mode_option_2_desc: "Фильтрует кандидатов по правилам шаблона и безопасности, затем выбирает по прогнозируемой игрой месячной прибыли. Приоритет 0–10 мягко влияет при близкой прибыли."
 eu5ab_regional_development__automation__candidate_priority_name: "Порядок автоматического строительства"
 eu5ab_regional_development__automation__candidate_priority_desc: "Перетащите четыре типа, задав порядок. Мод перебирает все доступные проекты текущего типа и ищет замену, прежде чем перейти дальше. При нехватке продовольствия продовольственные проекты идут первыми, но сохраняют этот порядок."
 eu5ab_regional_development__candidate_priority_name: "Порядок автоматического строительства"
 eu5ab_regional_development__candidate_priority_desc: "Перетащите, чтобы упорядочить улучшения, обычные расширения, RGO и новые здания."
 eu5ab_regional_development__candidate_priority_item_column_name: "Тип строительства"
 eu5ab_regional_development__candidate_priority_i1_name: "Улучшать здания"
 eu5ab_regional_development__candidate_priority_i1_desc: "Заменить устаревшее здание новейшим открытым уровнем его цепочки."
 eu5ab_regional_development__candidate_priority_i2_name: "Расширять существующие здания"
 eu5ab_regional_development__candidate_priority_i2_desc: "Добавить уровень существующему обычному зданию, без замен и RGO."
 eu5ab_regional_development__candidate_priority_i3_name: "Расширять ресурсные локации"
 eu5ab_regional_development__candidate_priority_i3_desc: "Расширить местное RGO с сохранением требований загрузки, годового бюджета, резерва и других ограничений."
 eu5ab_regional_development__candidate_priority_i4_name: "Строить новые здания"
 eu5ab_regional_development__candidate_priority_i4_desc: "Построить с нуля обычное здание, которого ещё нет в локации."
 eu5ab_regional_development__enabled_name: "Включить автоматическое строительство"
 eu5ab_regional_development__enabled_desc: "При отключении шаблоны и привязки сохраняются, но ежемесячное автоматическое строительство прекращается."
 eu5ab_regional_development__monthly_build_hard_cap_name: "Дополнительные одновременные проекты"
 eu5ab_regional_development__monthly_build_hard_cap_desc: "Число одновременных гражданских проектов сверх базового слота. 0 означает всего 1, а 599 — 600. Ручное строительство, дороги и другие моды не учитываются."
 eu5ab_regional_development__budget_mode_name: "Режим годового бюджета"
 eu5ab_regional_development__budget_mode_desc: "Выберите фиксированную сумму или общий годовой фонд, кратный общему месячному доходу."
 eu5ab_regional_development__budget_mode_option_1_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__budget_mode_option_2_name: "Месячный доход ×4"
 eu5ab_regional_development__budget_mode_option_3_name: "Месячный доход ×6 (рекомендуется)"
 eu5ab_regional_development__budget_mode_option_4_name: "Месячный доход ×8"
 eu5ab_regional_development__economic_metric_name: "Показатель доходности автоматического строительства"
 eu5ab_regional_development__economic_metric_desc: "Выберите минимальную доходность обычных зданий: положительный месячный доход или прибыль либо 5% годовых ROI. Инфраструктура без продукции освобождена; у RGO свои правила."
 eu5ab_regional_development__economic_metric_option_1_name: "@income! Доход"
 eu5ab_regional_development__economic_metric_option_1_desc: "Начинать только при положительном прогнозе месячного дохода."
 eu5ab_regional_development__economic_metric_option_2_name: "@wealth! Прибыль"
 eu5ab_regional_development__economic_metric_option_2_desc: "Начинать только при положительном прогнозе общей месячной прибыли."
 eu5ab_regional_development__economic_metric_option_3_name: "@efficiency! Доходность выручки"
 eu5ab_regional_development__economic_metric_option_3_desc: "Начинать только если прогноз месячного дохода даёт не менее 5% годовых от стоимости строительства."
 eu5ab_regional_development__economic_metric_option_4_name: "@efficiency! Доходность прибыли"
 eu5ab_regional_development__economic_metric_option_4_desc: "Начинать только если прогноз месячной прибыли даёт не менее 5% годовых от стоимости строительства."
 eu5ab_regional_development__emergency_food_exhaustion_override_name: "Продовольствие закончится: строить первым, игнорировать доходность"
 eu5ab_regional_development__emergency_food_exhaustion_override_desc: "Если продовольствие заканчивается, выполнять продовольственные проекты первыми и отменить доходность обычных продовольственных зданий. Порядок и прочие правила сохраняются."
 eu5ab_regional_development__emergency_food_stockpile_override_name: "Продовольствие 25% или меньше: строить первым, игнорировать доходность"
 eu5ab_regional_development__emergency_food_stockpile_override_desc: "При запасе продовольствия 25% или меньше выполнять продовольственные проекты первыми и отменить доходность обычных продовольственных зданий; остальные правила сохраняются."
 eu5ab_regional_development__emergency_construction_goods_override_name: "Снабжение стройматериалами ниже 65%: игнорировать доходность"
 eu5ab_regional_development__emergency_construction_goods_override_desc: "Если важного стройматериала поставляется менее 65% потребности, его производители освобождаются от доходности. Остальные правила действуют."
 eu5ab_regional_development__emergency_wartime_military_override_name: "Военное снабжение в войну ниже 65%: игнорировать доходность"
 eu5ab_regional_development__emergency_wartime_military_override_desc: "Во время войны, если военного товара поставляется менее 65% потребности, его производители освобождаются от доходности; прочие правила действуют."
 eu5ab_regional_development__emergency_strategic_input_override_name: "Стратегическому производству не хватает ресурсов: игнорировать доходность поставщиков"
 eu5ab_regional_development__emergency_strategic_input_override_desc: "Если поставка ресурса менее 65% блокирует отечественное продовольственное, строительное или военное производство, его производители освобождаются от доходности; прочие правила действуют."
 eu5ab_regional_development__fixed_annual_budget_name: "Фиксированный годовой бюджет"
 eu5ab_regional_development__fixed_annual_budget_desc: "Используется только в фиксированном режиме; все шаблоны делят эту сумму."
 eu5ab_regional_development__fixed_annual_budget_format: "[CMMV('eu5ab_regional_development__fixed_annual_budget')]@gold!"
 eu5ab_regional_development__min_cash_reserve_name: "Минимальный резерв казны"
 eu5ab_regional_development__min_cash_reserve_desc: "Золото, которое должно остаться в казне после начала проекта."
 eu5ab_regional_development__min_cash_reserve_format: "[CMMV('eu5ab_regional_development__min_cash_reserve')]@gold!"
 eu5ab_regional_development__price_min_name: "Процент минимальной цены"
 eu5ab_regional_development__price_min_desc: "Продукция ниже этого процента базовой цены обычно считается избыточной."
 eu5ab_regional_development__price_min_format: "[CMMV('eu5ab_regional_development__price_min')]%"
 eu5ab_regional_development__price_max_name: "Процент высокой цены"
 eu5ab_regional_development__price_max_desc: "Продукция выше этого процента базовой цены получает бонус рейтинга."
 eu5ab_regional_development__price_max_format: "[CMMV('eu5ab_regional_development__price_max')]%"
 eu5ab_regional_development__allow_special_buildings_name: "Разрешить особые здания"
 eu5ab_regional_development__allow_special_buildings_desc: "Разрешает учитывать особые здания; требования игры сохраняются."
 eu5ab_regional_development__auto_build_input_sources_name: "Строить источники сырья при дефиците"
 eu5ab_regional_development__auto_build_input_sources_desc: "Если плановое здание нельзя начать из-за нехватки ресурсов, попробовать разрешённый источник сырья."
 eu5ab_regional_development__pause_low_workforce_name: "Останавливать при нехватке рабочей силы"
 eu5ab_regional_development__pause_low_workforce_desc: "Не строить, если рабочие места нельзя заполнить за срок прогноза."
 eu5ab_regional_development__stop_input_shortage_name: "Останавливать при нехватке критических ресурсов"
 eu5ab_regional_development__stop_input_shortage_desc: "Не строить связанные проекты при недостаточном снабжении критическими рыночными ресурсами."
 eu5ab_regional_development__allow_rgo_name: "Разрешить расширение RGO"
 eu5ab_regional_development__allow_rgo_desc: "Разрешить всем шаблонам рассматривать расширение ресурсных локаций."
 eu5ab_regional_development__rgo_min_utilization_name: "Минимальная загрузка RGO"
 eu5ab_regional_development__rgo_min_utilization_desc: "Не расширять RGO ниже этой загрузки."
 eu5ab_regional_development__rgo_min_utilization_format: "[CMMV('eu5ab_regional_development__rgo_min_utilization')]%"
 eu5ab_regional_development__job_fill_deadline_months_name: "Срок заполнения рабочих мест (месяцы)"
 eu5ab_regional_development__job_fill_deadline_months_desc: "Горизонт прогноза местного перехода в новые рабочие места."
 eu5ab_regional_development__native_input_priority_name: "Приоритет местного сырья"
 eu5ab_regional_development__native_input_priority_desc: "0–10; большие значения повышают приоритет зданий, использующих сырьё той же провинции."
 eu5ab_regional_development__performance_preset_name: "Предустановка производительности"
 eu5ab_regional_development__performance_preset_desc: "Предустановка синхронизирует расширенные параметры ниже. Пользовательская сохраняет текущие значения."
 eu5ab_regional_development__performance_preset_option_1_name: "Консервативный"
 eu5ab_regional_development__performance_preset_option_1_desc: "Проверяет до 10 локаций в день и запускает не более 30 проектов за проход. Кандидаты планирования: 5; прибыли: 15. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_2_name: "Разносторонность"
 eu5ab_regional_development__performance_preset_option_2_desc: "Проверяет до 20 локаций в день и запускает не более 50 проектов за проход. Кандидаты планирования: 4; прибыли: 12. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_3_name: "Максимальная производительность"
 eu5ab_regional_development__performance_preset_option_3_desc: "Для стран с множеством локаций. Проверяет до 30 в день без лимита за проход. Кандидаты планирования: 3; прибыли: 10. Останавливается, когда кандидатов достаточно."
 eu5ab_regional_development__performance_preset_option_4_name: "Пользовательский"
 eu5ab_regional_development__performance_preset_option_4_desc: "Использовать текущие расширенные настройки."
 eu5ab_regional_development__performance_throughput_warning_summary_name: "Много локаций с шаблонами могут снизить производительность."
 eu5ab_regional_development__performance_throughput_warning_summary_desc: "Максимальная производительность обрабатывает до 30 локаций в день без лимита добавлений за проход. Большое число локаций может замедлить месячный расчёт."
 eu5ab_regional_development__performance_throughput_warning_action_name: "Замедление спроса и предложения: уменьшите кандидатов планирования."
 eu5ab_regional_development__performance_throughput_warning_action_desc: "Только для спроса и предложения. Меньше кандидатов планирования сокращает число проектов на локацию и тип для последующих проверок."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_name: "Компромисс: меньше запасных вариантов могут пропустить доступные проекты."
 eu5ab_regional_development__performance_throughput_warning_planning_consequence_desc: "Кандидаты используют один порядок рейтинга. Меньший лимит оставляет меньше замен при отказе лидеров, и доступный поздний проект может не провериться."
 eu5ab_regional_development__performance_throughput_warning_profit_action_name: "Замедление выбора прибыли: уменьшите кандидатов прибыли."
 eu5ab_regional_development__performance_throughput_warning_profit_action_desc: "Только при Выборе по прогнозируемой прибыли. Меньше кандидатов прибыли сокращает число проектов на локацию и тип для игровых проверок прибыли и стоимости."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_name: "Компромисс: короткий список может пропустить действительно прибыльные здания."
 eu5ab_regional_development__performance_throughput_warning_profit_consequence_desc: "Выбор прибыли сначала фильтрует по рейтингу, затем сортирует по прибыли. Меньший лимит может отбросить прибыльное здание на первом этапе."
 eu5ab_regional_development__performance_throughput_warning_common_action_name: "Также уменьшите локации в день или добавления за проход."
 eu5ab_regional_development__performance_throughput_warning_common_action_desc: "Меньше локаций в день распределяет проверку на больше дней. Меньше добавлений сокращает проверки и запуски за проход. Можно сменить предустановку; ноль означает без ограничений."
 eu5ab_regional_development__parallel_location_scan_name: "Обрабатывать локации отдельно"
 eu5ab_regional_development__parallel_location_scan_desc: "Проверять локации отдельно, сокращая время одного обновления. Рейтинг, бюджет и порядок не меняются."
 eu5ab_regional_development__daily_location_task_limit_name: "Локаций проверяется в день"
 eu5ab_regional_development__daily_location_task_limit_desc: "Максимум подробно проверяемых локаций в день, от 1 до 30. Меньше нагрузка за день, но дольше охват страны."
 eu5ab_regional_development__max_additions_per_run_name: "Максимум добавлений за запуск"
 eu5ab_regional_development__max_additions_per_run_desc: "Ограничивает проекты за один запуск от 0 до 600. Ноль означает без ограничений."
 eu5ab_regional_development__candidates_per_location_name: "Кандидатов планирования на локацию"
 eu5ab_regional_development__candidates_per_location_desc: "Только для спроса и предложения. Сохраняет 3–30 кандидатов на локацию и тип. Больше кандидатов дают замену при отказе лидеров, но увеличивают проверки."
 eu5ab_regional_development__actual_profit_candidates_per_location_name: "Кандидатов прибыли на локацию"
 eu5ab_regional_development__actual_profit_candidates_per_location_desc: "Только при Выборе прибыли. Отправляет 3–30 кандидатов на локацию и тип в игровое сравнение прибыли. Больше кандидатов сокращает пропуски, но увеличивает проверки."
 eu5ab_regional_development__early_stop_when_candidates_sufficient_name: "Остановить при достаточном числе кандидатов"
 eu5ab_regional_development__early_stop_when_candidates_sufficient_desc: "Когда подходящих кандидатов станет вдвое больше максимума запуска, прекратить проверку остальных локаций."
 eu5ab_diagnostics_cmm_hint: "Измените общие правила в настройках модов Community Mod Framework. Отчёт о строительстве показывает последний автоматический результат."
