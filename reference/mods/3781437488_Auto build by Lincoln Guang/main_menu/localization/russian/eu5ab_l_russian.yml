 eu5ab_diag_result_help: "При нехватке продовольствия продовольственные проекты идут первыми. Иначе мод следует Порядку автоматического строительства и ищет замену того же типа. RGO должны соответствовать правилам игры и сортируются по дефициту, цене, загрузке и стратегической необходимости. Успех фиксируется только после попадания в очередь; тогда расходуется бюджет, занимается слот и для локации начинается трёхмесячный период ожидания."
