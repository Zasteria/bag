l_french:
 ARC: "Arménie cilicienne"
 ARC_ADJ: "Arménien cilicien"
 ARC_f: "Arménie cilicienne"
 ARC_f_desc: "Restaurer le royaume arménien de Cilicie sous la couronne héthumide, le royaume méditerranéen qui, pendant deux siècles, a relié la chrétienté apostolique et le monde latin des croisés depuis sa capitale à Sis. Alors que l'Arménie bagratide regarde à l'est vers le Caucase, l'Arménie cilicienne fait face à la mer : un royaume de ports marchands, de concessions commerciales italiennes et de chevaliers en surcots orientaux. Forgez une thalassocratie arménienne le long de la côte levantine, maîtrisez Chypre et les routes des épices, et prouvez que le royaume que les Mamelouks ont brisé en 1375 aurait pu leur survivre."
