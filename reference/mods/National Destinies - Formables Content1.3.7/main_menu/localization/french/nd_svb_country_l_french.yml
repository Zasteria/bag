 SVB: "Suvarnabhumi"
 SVB_ADJ: "Suvarnabhumin"
 SVB_f: "Suvarnabhumi"
 SVB_f_desc: "Suvarnabhumi, le « Pays de l'Or » des sutras bouddhistes et des inscriptions en pierre, est le nom propre du continent, l'empire pan-Theravada dont rêvaient tous à leur tour les cakkavatti khmers, les rois-dieux d'Ayutthayan, les conquérants Toungoo et les seigneurs du mandala laotien. Pour former Suvarnabhumi, il faut tenir les quatre piliers civilisationnels de l'Asie du Sud-Est continentale : les temples Wat d'Angkor, les chedis dorés d'Ayutthaya, la plaine parsemée de stupas de Bagan et That Luang de Vientiane. Sous une bannière de roue du dharma safran et or, les quatre noyaux culturels de l'Indochine continentale répondent à un seul monarque universel bouddhiste, réalisant une vision que Bayinnaung a brièvement eue et qui s'est fragmentée à sa mort."
