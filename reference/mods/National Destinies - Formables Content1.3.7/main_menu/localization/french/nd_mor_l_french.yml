l_french:
 STATIC_MODIFIER_NAME_nd_sharif_commands_the_faithful: "Le chérif commande aux fidèles"
 STATIC_MODIFIER_DESC_nd_sharif_commands_the_faithful: "Le sultan du Maroc tire son autorité non seulement de sa puissance militaire, mais aussi de sa descendance du Prophète. En tant que Commandeur des Fidèles, sa légitimité unit les tribus, les érudits et les soldats sous une seule bannière d’objectifs justes."
 STATIC_MODIFIER_NAME_nd_gateway_of_two_seas: "Porte des Deux Mers"
 STATIC_MODIFIER_DESC_nd_gateway_of_two_seas: "Le Maroc contrôle la Méditerranée occidentale et les approches atlantiques de l’Afrique. Ses ports acheminent l’or, le sucre et les marchandises européennes entre deux océans, faisant du Sultanat un maillon indispensable du commerce mondial."
 STATIC_MODIFIER_NAME_nd_victory_at_alcacer_quibir: "Victoire à Alcacer Quibir"
 STATIC_MODIFIER_DESC_nd_victory_at_alcacer_quibir: "La défaite écrasante de l’invasion portugaise a empli l’armée d’une confiance farouche. Le Maroc constitue le rempart de l’Islam contre l’agression ibérique."
 STATIC_MODIFIER_NAME_nd_alcacer_diplomatic_triumph: "Triomphe diplomatique de 1578"
 STATIC_MODIFIER_DESC_nd_alcacer_diplomatic_triumph: "La bataille des Trois Rois a éliminé non seulement une armée d’invasion mais aussi le roi portugais lui-même. La réputation du Maroc auprès des tribunaux européens a atteint des sommets extraordinaires."
 STATIC_MODIFIER_NAME_nd_moulay_ismail_consolidation: "La consolidation de Moulay Ismail"
 STATIC_MODIFIER_DESC_nd_moulay_ismail_consolidation: "Le Sultan de Fer a imposé sa volonté à travers le royaume. Ses vastes projets de construction à Meknès, sa réorganisation de l’armée et sa centralisation impitoyable du pouvoir ont fait du Maroc un État redoutable."
 STATIC_MODIFIER_NAME_nd_moulay_ismail_terror: "Terreur du Sultan de Fer"
 STATIC_MODIFIER_DESC_nd_moulay_ismail_terror: "Le régime de Moulay Ismail repose sur la peur et la puissance militaire. Sa vaste armée permanente, son réseau de fortifications et sa réputation de vengeance impitoyable font du Maroc une forteresse dont aucun envahisseur n'ose s'approcher."
 nd_mor.1.t: "Le sultanat marocain"
 nd_mor.1.d: "The lands of Morocco are united under a single throne. From the Atlas Mountains to the Atlantic coast, from the fertile plains of the Gharb to the Saharan fringe, the Sultanate commands a realm of immense strategic value.\n\nThe question that faces the new Sultan is one of vision. The path of the #bold Commander of the Faithful#! calls Morocco to assert its Sharifian authority across the Maghreb and beyond, securing the frontier, conquering the Sahara, and forging a western caliphate. The path of the #bold Gateway of Two Seas#! turns Morocco's gaze seaward, seizing the Strait, venturing into the Atlantic, and building a maritime empire to rival the Iberians.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mor.1.a: "Le Sharif commande aux fidèles !"
 nd_mor.1.b: "Nous sommes la porte d'entrée de deux mers."
 nd_mor.2.t: "La bataille des trois rois"
 nd_mor.2.d: "Le 4 août 1578, le roi portugais Sébastien mena une armée de vingt mille hommes à travers le détroit jusqu'au Maroc, cherchant à placer une marionnette sur le trône du sultanat. Au bord de la rivière Oued al-Makhazin, près d'Alcacer Quibir, les forces marocaines les ont accueillis avec un effet dévastateur. Une fois la poussière retombée, trois rois gisaient morts, Sébastien du Portugal, le prétendant marocain déchu Abu Abdallah et le sultan régnant Abd al-Malik, décédé de maladie pendant la bataille elle-même. La victoire était totale. L'armée portugaise fut anéantie, le corps de son roi ne fut jamais retrouvé et la rançon de milliers de prisonniers remplit le trésor du Maroc. Ahmad al-Mansur, frère du sultan déchu, accède désormais au pouvoir avec l'épithète « al-Mansur », le Victorieux."
 nd_mor.2.a: "Que la victoire inspire nos armées !"
 nd_mor.2.b: "Faites connaître au monde la force du Maroc !"
 nd_mor.3.t: "Moulay Ismail et la gloire de Meknès"
 nd_mor.3.d: "Le Sultan Moulay Ismail s'est lancé dans le programme de construction le plus ambitieux de l'histoire du Maroc. Rompant avec la tradition, il a choisi Meknès comme nouvelle capitale, et la ville se transforme en monument du pouvoir absolu. Les murs massifs s'étendent sur des kilomètres, renfermant des palais, des jardins, des greniers capables de nourrir le royaume pendant des années et des écuries pour douze mille chevaux. Son armée de soldats de la Garde noire, une force permanente de soldats esclaves fidèles uniquement au sultan, se compte par dizaines de milliers et fait respecter sa volonté du Rif au Sahara. Les puissances européennes, humiliées par la prise de Tanger et de Larache à leurs garnisons, envoient désormais des ambassadeurs porteurs de cadeaux. Mais les méthodes de Moulay Ismail sont aussi terrifiantes qu’efficaces."
 nd_mor.3.a: "Construisez un empire qui durera mille ans."
 nd_mor.3.b: "Que nos ennemis tremblent devant nos murs."
 nd_mor_zenata_cavalry: "Tradition de la cavalerie Zenata"
 nd_mor_zenata_cavalry_desc: "Les Berbères Zenata qui fondèrent la dynastie des Mérinides apportèrent avec eux les traditions de combat de la steppe saharienne, des cavaliers rapides qui frappaient fort et disparaissaient avant que l'ennemi ne puisse répondre."
 nd_mor_kasbah_defense: "Fortifications de la Kasbah"
 nd_mor_kasbah_defense_desc: "Les kasbahs du Maroc, places fortes fortifiées en pisé et en pierre, contrôlent les cols de montagne, gardent les oasis et dominent les abords de toutes les grandes colonies."
 nd_mor_fez_scholarship: "Fès, Ville d'Apprentissage"
 nd_mor_fez_scholarship_desc: "Fès est la capitale intellectuelle du Maghreb depuis la fondation de la mosquée al-Qarawiyyin en 859. Ses savants préservent et transmettent le savoir à travers le monde islamique."
 nd_mor_al_qarawiyyin: "L'Université d'Al-Qarawiyyin"
 nd_mor_al_qarawiyyin_desc: "Fondée par Fatima al-Fihri en 859, al-Qarawiyyin à Fès est la plus ancienne université en activité au monde, formant des juristes, des théologiens et des administrateurs pour l'État marocain."
 nd_mor_madrasa_tradition: "Tradition médersa marinide"
 nd_mor_madrasa_tradition_desc: "Les sultans mérinides ont construit les plus belles madrasas de l'Occident islamique, des chefs-d'œuvre de stuc sculpté, de plafonds en bois de cèdre et de carrelage en zellige qui ont servi à la fois d'écoles théologiques et d'instruments de légitimité politique."
 nd_mor_zellige_craft: "Artisanat Zellige"
 nd_mor_zellige_craft_desc: "Moroccan artisans perfected the art of zellige, intricate geometric mosaic tilework cut by hand from glazed terracotta. This craft adorns every mosque, palace, and fountain in the realm.\n\n#italic Available in: $nd_mor_funduq$#!"
 nd_mor_funduq_network: "Réseau commercial Funduq"
 nd_mor_funduq_network_desc: "Les funduqs (auberges marchandes avec entrepôts, écuries et logements) constituent l'épine dorsale du commerce intérieur du Maroc, offrant abri et stockage aux routes caravanières reliant la côte au Sahara."
 nd_mor_barbary_corsairs: "Corsaires barbaresques de Sale"
 nd_mor_barbary_corsairs_desc: "Les corsaires de Salé et de Rabat terrorisent l'Atlantique et la Méditerranée, capturant des navires et attaquant les villes côtières de l'Islande aux Canaries. Leurs galères sont rapides, bien armées et dirigées par des pillards intrépides."
 nd_mor_sugar_cultivation: "Sucre de la Vallée du Souss"
 nd_mor_sugar_cultivation_desc: "The Souss Valley's sugar plantations, irrigated by ancient channels, produce a commodity that Europeans crave. Moroccan sugar competes with the finest from the Levant and later the New World.\n\n#italic Available in: $nd_mor_sugar_press$#!"
 nd_mor_wattasid_diplomacy: "Artisanat diplomatique Wattasid"
 nd_mor_wattasid_diplomacy_desc: "Pris entre l'expansion ottomane depuis l'est et l'agression portugaise depuis la mer, les dirigeants wattassides du Maroc ont développé une diplomatie sophistiquée consistant à jouer les puissances les unes contre les autres pour préserver leur indépendance."
 nd_mor_metalworking: "Production d'armes marocaine"
 nd_mor_metalworking_desc: "La nécessité de résister aux incursions côtières portugaises a incité les métallurgistes marocains à produire des armes à feu, des canons et des armes blanches en quantités croissantes, réduisant ainsi leur dépendance à l'égard des armes étrangères."
 nd_mor_saadian_gunpowder: "La révolution saadienne de la poudre à canon"
 nd_mor_saadian_gunpowder_desc: "La dynastie saadienne a adopté des méthodes militaires ottomanes (infanterie de mousquetaires disciplinée, artillerie de campagne et guerre de forteresse), transformant l'armée marocaine d'une force dépendante de la cavalerie en un État de poudre à canon."
 nd_mor_battle_three_kings: "Bataille des Trois Rois"
 nd_mor_battle_three_kings_desc: "La destruction de l'invasion portugaise du roi Sébastien à Alcacer Quibir en 1578 fut le plus grand triomphe militaire du Maroc, établissant le prestige de la dynastie saadienne dans le monde islamique et en Europe."
 nd_mor_mansur_golden_age: "L'âge d'or d'Al-Mansur"
 nd_mor_mansur_golden_age_desc: "Ahmad al-Mansur a tiré parti de sa victoire pour entrer dans une ère de richesse sans précédent. L’argent des rançons portugaises, l’or du Sahara et les exportations de sucre ont fait du Maroc l’un des États les plus riches du monde."
 nd_mor_saadian_architecture: "Patronage architectural saadien"
 nd_mor_saadian_architecture_desc: "Le patronage de la dynastie saadienne a produit le palais El Badi à Marrakech, « l'Incomparable », et les superbes tombeaux saadiens, monuments du pouvoir dynastique fabriqués à partir des meilleurs matériaux que l'argent pouvait acheter."
 nd_mor_meknes_capital: "Meknès Impériale"
 nd_mor_meknes_capital_desc: "La transformation de Meknès par Moulay Ismail en capitale impériale (avec ses murs massifs, ses vastes greniers et sa porte monumentale Bab Mansour) fut le plus grand projet de construction de l'histoire du Maroc."
 nd_mor_alaouite_centralization: "Centralisation de l’État alaouite"
 nd_mor_alaouite_centralization_desc: "La dynastie alaouite a reconstruit l'État marocain autour d'un Makhzen centralisé, un réseau d'alliances tribales, de garnisons militaires et de collecteurs d'impôts qui liaient la périphérie au trône."
 nd_mor_corsair_fleet: "Expansion de la flotte corsaire"
 nd_mor_corsair_fleet_desc: "Under the Alaouites, Morocco's corsair fleet expanded from a local nuisance to a strategic instrument. European powers were forced to negotiate treaties and pay tribute to protect their shipping.\n\n#italic Available in: $nd_mor_corsair_harbor$#!"
 nd_mor_makhzen_reforms: "Réformes fiscales du Makhzen"
 nd_mor_makhzen_reforms_desc: "L'appareil fiscal du Makhzen (impôts sur les agriculteurs, gouverneurs de province et prélèvements coutumiers) a été réformé pour extraire plus efficacement des revenus des diverses populations du sultanat."
 nd_mor_industrial_stirrings: "Première modernisation marocaine"
 nd_mor_industrial_stirrings_desc: "Alors que l’industrialisation complète échappait au Maroc, la fin de la période alaouite a été marquée par des avancées timides vers une fabrication moderne, notamment des ateliers de style européen et des améliorations des infrastructures portuaires."
 nd_mor_diplomatic_sovereignty: "Souveraineté diplomatique marocaine"
 nd_mor_diplomatic_sovereignty_desc: "Le Maroc a été l’un des premiers États à reconnaître les États-Unis en 1786 et a maintenu des relations diplomatiques souveraines avec les grandes puissances tout au long de cette période, résistant plus longtemps que tout autre État africain à la pleine domination européenne."
 a_nd_mor_zenata_horsemen: "Cavaliers Zenata"
 a_nd_mor_zenata_horsemen_desc: "Les guerriers à cheval rapides des Berbères Zenata, formés aux traditions nomades de la guerre éclair à travers les déserts et les plaines du Maghreb."
 n_nd_mor_corsair_galley: "Galère des Corsaires"
 n_nd_mor_corsair_galley_desc: "Une galère rapide et maniable dirigée par les redoutables corsaires de Salé et de Rabat, conçue pour attaquer la marine marchande et bloquer les ports ennemis."
 a_nd_mor_saadian_musketeers: "Mousquetaires Saadiens"
 a_nd_mor_saadian_musketeers_desc: "Infanterie de mousquet disciplinée formée selon la tradition ottomane, formant l'épine dorsale de l'armée de poudre réformée du Maroc après la révolution militaire saadienne."
 nd_mor_marinid_madrasa: "Madrasa marinide"
 nd_mor_marinid_madrasa_desc: "Une école théologique construite dans la tradition mérinide, avec des carreaux de zellige complexes, des stucs sculptés et des plafonds en bois de cèdre. Elle forme des érudits, des juristes et des administrateurs du Sultanat."
 nd_mor_kasbah: "Forteresse de la Kasbah"
 nd_mor_kasbah_desc: "Une place forte fortifiée en pisé et en pierre, contrôlant les cols de montagne et gardant les abords des colonies. Ses murs épais et sa position stratégique le rendent presque imprenable."
 nd_mor_funduq: "Funduq"
 nd_mor_funduq_desc: "Une auberge marchande et un complexe d'entrepôts qui servent de plaque tournante pour le commerce des caravanes, offrant un hébergement aux marchands, des stabulations pour les animaux et un stockage sécurisé pour les marchandises."
 nd_mor_imperial_granary: "Grenier Impérial"
 nd_mor_imperial_granary_desc: "L'un des vastes entrepôts de Moulay Ismail, capable d'approvisionner une armée pendant des mois. Ces greniers garantissent que le sultanat ne sera jamais confronté à la famine en cas de siège ou de sécheresse."
 nd_mor_corsair_harbor: "Port des Corsaires"
 nd_mor_corsair_harbor_desc: "Un port fortifié construit pour desservir la flotte corsaire marocaine, avec des installations de construction navale, des quais de réparation et un mouillage sécurisé pour les navires de raid."
 nd_mor_madrasa_upkeep: "Entretien de la médersa"
 nd_mor_madrasa_upkeep_desc: "Les coûts permanents d'entretien de la madrasa, le papier et les livres pour la bibliothèque, les bougies en cire d'abeille pour les études nocturnes et la pierre pour l'entretien de ses murs ornés de zellige."
 nd_mor_kasbah_upkeep: "Garnison de la Kasbah"
 nd_mor_kasbah_upkeep_desc: "Le coût de l'entretien de la kasbah, la pierre pour ses murs en pisé, l'armement et les armes à feu pour la garnison et les outils pour les réparations en cours."
 nd_mor_funduq_upkeep: "Opérations Funduq"
 nd_mor_funduq_upkeep_desc: "Les frais de fonctionnement du funduq, du bétail et du blé pour nourrir les marchands et leurs animaux, du sel pour la conservation et des tissus pour approvisionner les caravanes qui s'y abritent."
 nd_mor_granary_upkeep: "Entretien du grenier"
 nd_mor_granary_upkeep_desc: "Le coût de l'entretien du grenier impérial, le blé pour réapprovisionner les magasins, les outils pour les machines et les équipements de mesure, et la pierre pour maintenir en bon état les murs massifs et les chambres voûtées."
 nd_mor_corsair_harbor_upkeep: "Opérations portuaires"
 nd_mor_corsair_harbor_upkeep_desc: "Les coûts d'exploitation du port corsaire, les fournitures navales pour la flotte, le bois et le goudron pour les réparations de la coque et les outils pour les charpentiers navals qui entretiennent les navires de raid."
 nd_mor_sugar_processing: "Raffinage du sucre marocain"
 nd_mor_sugar_processing_desc: "Broyer la canne à sucre récoltée dans la vallée du Souss et faire bouillir le jus pour en faire du sucre raffiné destiné à l'exportation vers l'Europe."
 nd_mor_zellige_workshop: "Atelier de Zellige"
 nd_mor_zellige_workshop_desc: "Un atelier découpant des carreaux géométriques complexes en terre cuite vernissée, cuite en argile et découpée à la main, colorée avec des colorants minéraux, façonnée avec des outils pour former les mosaïques qui ornent chaque mosquée et chaque palais."
 nd_mor_sugar_press: "Presse à sucre"
 nd_mor_sugar_press_desc: "Un moulin à canne à sucre dans la vallée du Souss, où le sucre marocain est transformé pour l'exportation. Le sucre marocain rivalisait avec les sources méditerranéennes avant que les plantations atlantiques ne prennent le relais."
 nd_mor_press_upkeep: "Opérations de presse"
 nd_mor_press_upkeep_desc: "Du bois pour les rouleaux de broyage de canne et le four de la chaufferie, des outils pour entretenir les machines et de la pierre pour les fondations et les murs du moulin."
 nd_mor_arms_workshop: "Atelier d'armes marocaines"
 nd_mor_arms_workshop_desc: "Une forge produisant des armes à feu, des lames et des accessoires pour les armées du sultanat, du fer pour la métallurgie, du charbon pour la forge, du bois pour les crosses et les manches et des outils pour les artisans."
 levy_nd_mor_zenata_horsemen: "Prélèvement des cavaliers Zenata"
 levy_nd_mor_zenata_horsemen_desc: "Cavalerie tribale composée de soldats et de membres de tribus berbères Zenata, combattant dans la tradition nomade des raids montés rapides."
 nd_mor_formed_tt: "Formé#bold Maroc#!"
 nd_mor_path_a_tt: "Choisissez le#bold Commandant du destin fidèle#!"
 nd_mor_path_b_tt: "Choisissez la passerelle#bold du destin#!des Deux Mers"
 nd_mor_destiny: "Destin du Sultanat"
 nd_mor_destiny_desc: "Le Maroc est constitué et l'autorité de son Sultan est reconnue. Le royaume se trouve à la croisée des chemins, la voie choisie lors de sa formation façonne désormais les ambitions du sultanat. Stabilisez le royaume pour commencer à poursuivre son destin."
 nd_mor_dest_maghreb: "Le Maghreb sécurisé"
 nd_mor_dest_maghreb_desc: "Conquérir Tlemcen pour mettre fin à la rivalité zayyanide et bâtir une armée digne du Commandeur des Croyants. Le Maghreb occidental doit répondre à un trône unique avant que le sultan puisse regarder plus loin."
 nd_mor_dest_golden_road: "Maîtres de la Route d'Or"
 nd_mor_dest_golden_road_desc: "Marchez vers le sud à travers le Sahara pour vous emparer de Tombouctou et des routes transsahariennes de l’or. Les richesses de l'Afrique subsaharienne doivent passer par les mains marocaines pour financer les ambitions du sultan."
 nd_mor_dest_caliphate: "Le califat occidental"
 nd_mor_dest_caliphate_desc: "Conquérir Tunis et Alger pour unir tout le Maghreb sous l’autorité chérifienne. Avec le prestige acquis grâce à la conquête et à la piété, proclamez un califat occidental rivalisant avec les Ottomans. Débloque le Dar al-Makhzen."
 nd_mor_dest_strait: "Le détroit sécurisé"
 nd_mor_dest_strait_desc: "Prenez le rocher de Gibraltar aux Ibères et stabilisez le royaume. Le contrôle du détroit donne au Maroc la maîtrise de tout le trafic entre la Méditerranée et l'Atlantique."
 nd_mor_dest_atlantic: "Entreprises atlantiques"
 nd_mor_dest_atlantic_desc: "Développer le commerce du sucre du Maroc pour en faire une industrie d'exportation majeure, adopter des institutions bancaires modernes et remplir le trésor du Sultanat. L'Atlantique offre des opportunités à ceux qui peuvent financer le voyage."
 nd_mor_dest_two_oceans: "Maître des Deux Océans"
 nd_mor_dest_two_oceans_desc: "Saisissez Madère pour établir un point d'ancrage sur l'Atlantique, développer le territoire du sultanat à son plein potentiel et embrasser le commerce mondial. Le Maroc contrôlera à la fois le passage de la Méditerranée et le large. Débloque le Dar al-Bahr."
 nd_mor.4.t: "Destin du Sultanat"
 nd_mor.4.d: "Le Sultanat du Maroc est uni, sa bannière levée sur l'Atlas et sur la côte. Le royaume est stable et ses habitants se tournent vers le sultan pour obtenir des conseils. Le chemin est long, mais le premier pas a été franchi, le destin du Maroc est désormais en marche."
 nd_mor.4.a: "Notre destin se dévoile."
 nd_mor.5.t: "Le Maghreb sécurisé"
 nd_mor.5.d: "Tlemcen est tombée. L'ancien siège des sultans zayyanides, qui contestèrent pendant des siècles l'hégémonie marocaine sur le Maghreb occidental, répond désormais au sultan à Fès. Avec une armée puissante sous ses ordres, la frontière est sécurisée et la route vers le sud vers le Sahara est ouverte. Le Commandeur des Croyants a prouvé que sa revendication dépasse les frontières traditionnelles du Maroc."
 nd_mor.5.a: "Le Maghreb s'incline devant le Commandeur."
 nd_mor.6.t: "Maîtres de la Route d'Or"
 nd_mor.6.d: "Les soldats et commerçants marocains commandent désormais les routes transsahariennes. Tombouctou, la légendaire cité de l'or et du savoir, arbore la bannière du sultan. Les caravanes de sel de Taghaza défilent sous escorte marocaine. Les richesses de l’Afrique subsaharienne se dirigent vers le nord, vers Marrakech et Fès. La question est de savoir comment consolider ce vaste domaine, par des garnisons militaires et des expéditions punitives, ou par des réseaux commerciaux et une administration sédentaire."
 nd_mor.6.a: "Garnissez les routes d’acier."
 nd_mor.6.b: "Laissons le commerce lier ce que la conquête a gagné."
 nd_mor.7.t: "Le califat occidental proclamé"
 nd_mor.7.d: "De Tunis à Tombouctou, d'Alger à l'Atlantique, l'autorité du sultan marocain reste incontestée. Le rêve d’un califat occidental, d’un royaume chérifien rivalisant avec les Ottomans, s’est réalisé. Les érudits, les soldats et les commerçants du monde islamique considèrent le sultan comme le Commandeur des croyants en vérité, et pas seulement en titre. La question est désormais de savoir comment définir le caractère de ce califat à travers les âges."
 nd_mor.7.a: "Par la piété et l'apprentissage."
 nd_mor.7.b: "Par la force des armes."
 nd_mor.8.t: "Le détroit sécurisé"
 nd_mor.8.d: "Le Rocher de Gibraltar, la grande forteresse qui garde le passage entre la Méditerranée et l'Atlantique, est désormais aux mains des Marocains. Chaque navire qui passe entre les deux mers le fait sous le regard du sultan. Les corsaires de Salé se réjouissent, les marchands de Fès voient de nouveaux horizons et les puissances européennes doivent compter avec un Maroc qui contrôle la voie navigable la plus stratégique du monde occidental."
 nd_mor.8.a: "Le passage nous appartient."
 nd_mor.9.t: "Entreprises atlantiques"
 nd_mor.9.d: "Le sucre marocain remplit les cales des navires à destination des marchés européens. Le trésor du sultan regorge des bénéfices du commerce et les banquiers du royaume financent des projets qui auraient semblé impossibles il y a une génération. Le Maroc est devenu le point d’ancrage occidental du commerce mondial. La question est de savoir s’il faut étendre cet avantage vers l’Atlantique ou consolider les marchés déjà conquis."
 nd_mor.9.a: "Poussez vers l’extérieur dans l’Atlantique."
 nd_mor.9.b: "Consolidez notre empire marchand."
 nd_mor.10.t: "Maître des Deux Océans"
 nd_mor.10.d: "Les marchands et marins marocains opèrent désormais de Madère à Mogador, de la Méditerranée jusqu'au large de l'Atlantique. Le développement du sultanat rivalise avec celui de n'importe quel royaume européen, ses réseaux commerciaux s'étendent sur deux océans et son drapeau flotte sur des eaux autrefois revendiquées exclusivement par les Ibères. Le Maroc est devenu non seulement une porte d’entrée entre les mers mais une puissance qui les contrôle toutes deux."
 nd_mor.10.a: "Nos flottes domineront les vagues."
 nd_mor.10.b: "Notre commerce liera le monde."
 STATIC_MODIFIER_NAME_nd_mor_dest_saharan_garrisons: "Réseau de garnisons sahariennes"
 STATIC_MODIFIER_DESC_nd_mor_dest_saharan_garrisons: "Les avant-postes militaires le long des routes transsahariennes sécurisent la route d’or par la force des armes, même si la vigilance constante pèse sur les soldats."
 STATIC_MODIFIER_NAME_nd_mor_dest_saharan_trade: "Réseau Commercial Saharien"
 STATIC_MODIFIER_DESC_nd_mor_dest_saharan_trade: "Les caravanes marchandes et les funduqs lient les territoires sahariens conquis au sultanat par le biais du commerce, bien que ce royaume lointain engendre l'autonomie locale."
 STATIC_MODIFIER_NAME_nd_mor_dest_caliphal_piety: "Califat des savants"
 STATIC_MODIFIER_DESC_nd_mor_dest_caliphal_piety: "Le califat occidental tire sa force de l’apprentissage religieux et de l’accommodement culturel, accueillant des peuples divers sous la bannière du Commandeur des croyants."
 STATIC_MODIFIER_NAME_nd_mor_dest_caliphal_sword: "Califat de l'Épée"
 STATIC_MODIFIER_DESC_nd_mor_dest_caliphal_sword: "Le califat occidental s’est forgé grâce à la suprématie militaire, ses armées étant l’instrument de l’autorité chérifienne à travers le Maghreb et au-delà."
 STATIC_MODIFIER_NAME_nd_mor_dest_atlantic_reach: "Portée Atlantique"
 STATIC_MODIFIER_DESC_nd_mor_dest_atlantic_reach: "Les explorateurs et les marchands marocains s'aventurent au large de l'Atlantique, explorant de nouvelles eaux et établissant des points d'ancrage loin de chez eux, même si l'état de préparation de l'armée souffre de l'orientation maritime."
 STATIC_MODIFIER_NAME_nd_mor_dest_market_ports: "Ports de marché du Sultan"
 STATIC_MODIFIER_DESC_nd_mor_dest_market_ports: "Les villes côtières du Maroc deviennent des pôles commerciaux prospères, attirant des commerçants du monde entier, même si une croissance rapide entraîne des pressions inflationnistes."
 STATIC_MODIFIER_NAME_nd_mor_dest_oceanic_fleet: "Flotte océanique du Maroc"
 STATIC_MODIFIER_DESC_nd_mor_dest_oceanic_fleet: "Une puissante marine maritime projette la puissance marocaine à travers la Méditerranée et l’Atlantique, faisant du Sultanat une grande puissance maritime."
 STATIC_MODIFIER_NAME_nd_mor_dest_trade_empire: "Empire des Deux Mers"
 STATIC_MODIFIER_DESC_nd_mor_dest_trade_empire: "Les réseaux diplomatiques et commerciaux du Maroc s'étendent sur deux océans, gagnant le respect et l'influence du sultanat auprès de tous les tribunaux et comptoirs, de Lisbonne à Tombouctou."
 nd_mor_dar_al_makhzen: "Dar al-Makhzen"
 nd_mor_dar_al_makhzen_desc: "Le palais califal, siège du Commandeur des fidèles et centre de l'autorité religieuse, intellectuelle et politique du califat occidental. Ses bibliothèques, ses tribunaux et ses salles d'audience incarnent la grandeur chérifienne."
 nd_mor_dar_al_bahr: "Dar al-Bahr"
 nd_mor_dar_al_bahr_desc: "La Maison de la Mer, un grand arsenal maritime et maison de commerce où la flotte océanique du Maroc est construite, approvisionnée et envoyée pour commander les eaux de deux océans."
 nd_mor_makhzen_upkeep: "Entretien du calife"
 nd_mor_makhzen_upkeep_desc: "Le coût de l'entretien du palais califal, la pierre pour ses salles et ses cours, le papier et les livres pour la bibliothèque et les tissus fins pour le mobilier de cérémonie de la cour."
 nd_mor_bahr_upkeep: "Opérations d'Arsenal"
 nd_mor_bahr_upkeep_desc: "Le coût de fonctionnement de l'arsenal maritime, les fournitures navales pour la flotte, le bois et le goudron pour les réparations de coque et les outils pour les charpentiers navals."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_mor_bureaucracy_authority: "Autorité chérifienne"
 AUTO_MODIFIER_DESC_nd_mor_bureaucracy_authority: "Le sultan chérifien gouverne à travers un appareil d'État reconnu - un Makhzen, un corps de caïds, une amirauté - accordant au Maroc trois postes bureaucratiques en plus de celui détenu par la capitale."

 mor_makhzen_central_administration_bureaucracy: "Le Makhzen"
 mor_makhzen_central_administration_bureaucracy_desc: "Signifiant à l'origine entrepôt ou trésor, le Makhzen prend forme sous les Saadis (1549-1659) et est consolidé par Moulay Ismail. La cour itinérante du sultan composée de hajib, wuzara et kuttab dirigeait directement le Bilad al-Makhzen tandis que le Bilad as-Siba ne payait qu'un tribut sporadique. Ses instruments étaient la baraka chérifienne, les amines fiscalistes et un corps de qaids tributaires."

 mor_jaysh_tribes_bureaucracy: "Tribus Jaysh"
 mor_jaysh_tribes_bureaucracy_desc: "Les confédérations de colons et de soldats accordaient un service militaire héréditaire en échange d'une exonération fiscale et de terres de la couronne près de Fès et de Meknès. Moulay Ismail systématisa l'institution après 1672 : 3 000 Cheraga, 4 500 Sherarda et 2 000 Udaya étaient stationnés autour de Fès, tandis que les Jaysh al-Udaya étaient constitués de quatre tribus Banu Maqil de Sus. Leur loyauté était personnelle envers le sultan."

 mor_qaid_provincial_government_bureaucracy: "Bashawiyya des Qaids"
 mor_qaid_provincial_government_bureaucracy_desc: "En dehors du Bilad al-Makhzen, le sultan gouvernait par l'intermédiaire de caids issus des grandes maisons tribales : les Glaoua de Telouet, les Mtougga, les Goundafa, les Hamadi de Ouezzane. Un caïd commandait son propre goum, collectait le kharaj à sa discrétion, en conservait une fraction avant de le remettre et jugeait aux côtés du cadi. Les bashas de Marrakech, Fès et Meknès étaient supérieurs même à la wuzara."

 mor_karaouine_ulama_bureaucracy: "Karaouine et les oulémas"
 mor_karaouine_ulama_bureaucracy_desc: "Fondée en 859 CE par Fatima al-Fihri, la mosquée-université Qarawiyyin de Fès est devenue la principale institution de jurisprudence malékite dans le monde islamique occidental. Ses oulémas composaient les tribunaux des cadi de chaque ville marocaine, rédigeaient les fatwas sur lesquelles reposait la légitimité dynastique et administraient les grandes dotations waqf. Les madrasas mérinides (Bou Inania, al-Attarine, al-Sahrij) ont produit une classe d’érudits-juges instruits avec laquelle les sultans chérifiens devaient négocier, pas commander."

 mor_zawiya_network_bureaucracy: "Réseaux Zawiya"
 mor_zawiya_network_bureaucracy_desc: "Loges soufies construites autour du tombeau d'un wali, dirigé par un cheikh réclamant la silsila au fondateur. La tradition Shadhili a donné naissance aux ordres politiquement conséquents : la Jazuliyya, la Nasiriyya de Tamegroute, la Wazzaniyya, la Sharqawa de Boujad, la Darqawiyya et la Tijaniyya à Fès à partir de 1789. Pendant la crise maraboutique (vers 1610-1660), la zawiya Dila du Moyen Atlas contrôlait purement et simplement le centre du Maroc jusqu'à sa destruction par Moulay. al-Rashid en 1668."

 mor_sale_corsair_divan_bureaucracy: "Diwan al-Bahr de Salé"
 mor_sale_corsair_divan_bureaucracy_desc: "Après que l'expulsion des Morisques en 1609 ait repoussé quelque 10 000 réfugiés andalous vers le bas Bou Regreg, Salé-Rabat est devenue la capitale corsaire de l'Atlantique. À partir de 1627, la ville se gouverna sous le nom de République de Salé, dirigée par un divan de douze à quatorze personnes qui élisaient chaque année un caïd et un grand amiral. Dix pour cent de chaque prix finançaient des fortifications. Moulay al-Rashid supprima la République en 1668 mais absorba son amirauté en tant qu'organe permanent de l'administration navale alaouite."

 mor_harka_taxation_expedition_bureaucracy: "Harka de la Mahalla"
 mor_harka_taxation_expedition_bureaucracy_desc: "La réponse marocaine à la tribu insoumis : le sultan en personne, avec la mahalla du harem, les ministres, la garde du palais, la cavalerie jaysh et l'artillerie de montagne, marchait dans le Bilad as-Siba une ou deux fois par an pour soutirer des arriérés d'impôts, punir la révolte et réinstaller les qaids. L'institution datait des Idrissides ; Moulay Ismail et ses successeurs alaouites en ont fait une routine. Une harka réussie revint avec des otages, un hommage et une bay'a renouvelée."
