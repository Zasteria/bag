l_french:

 # Game Rule
 rule_nd_bureaucracies_rule: "Bureaucraties des destins nationaux"
 setting_nd_bureaucracies_enabled: "Activé"
 setting_nd_bureaucracies_enabled_desc: "Chaque pays formable gagne 4 à 9 institutions historiques modifiables lors de la formation. Chacun est une bureaucratie à fentes avec un curseur de maintenance ; la nation formée obtient également les places et l’autorité nécessaires pour les gérer. Cela nécessite le système de jeu de base[bureaucracies|e]."
 setting_nd_bureaucracies_disabled: "Désactivé"
 setting_nd_bureaucracies_disabled_desc: "Les formables n'obtiennent pas d'autorité bureaucratique lors de la formation. Le système[bureaucracies|e]reste entièrement vanille."
