 DNM: "Monarchie danubienne"
 DNM_ADJ: "Danubien"
 DNM_f: "Monarchie danubienne"
 DNM_f_desc: "La monarchie danubienne est l’empire que la maison des Habsbourg forge en abandonnant le Reich. Pour l’empereur romain germanique, l’hégémonie allemande et le super-État du Danube s’excluaient à jamais : un empereur lié à la diète impériale, aux électeurs et au Reichstag ne pourrait jamais centraliser l’Autriche, la Bohême et la Hongrie en une seule couronne obéissante. La formation de la monarchie danubienne résout ce dilemme de la seule manière possible, par la rupture. Vous renoncez à la dignité impériale, faites sortir vos terres héréditaires, bohémiennes et hongroises du Saint-Empire romain germanique et les refondez en un empire souverain à vous, ne relevant d'aucun régime autre que votre propre cour. Les princes allemands sont abandonnés à leur Reich ; tu prends le Danube. Il ne s’agit pas de l’Autriche-Hongrie, du compromis dualiste auquel l’histoire ne parviendrait qu’après un siècle de crise, mais de la monarchie multiethnique centralisée que les Habsbourg ont toujours recherchée et qu’ils n’ont jamais comprise."
