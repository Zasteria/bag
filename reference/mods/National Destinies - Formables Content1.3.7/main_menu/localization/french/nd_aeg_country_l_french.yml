l_french:
 AEG: "Égyptus"
 AEG_ADJ: "Égyptien"
 AEG_f: "Égyptus"
 AEG_f_desc: "Forgez un empire restauré sur le Nil, fusionnant la légitimité militaire mamelouke avec la continuité dynastique pharaonique revendiquée par les sultans du Caire. Aegyptus lie le Nil inférieur et supérieur, le Levant, le Hedjaz, la Nubie et la Cyrénaïque sous une idéologie du Sultan-Pharaon qui trace sa ligne de Memphis à Babylone-d'Egypte jusqu'à la citadelle de Salah ad-Din. De Cyrène à La Mecque en passant par Khartoum, l'étendue du Nouvel Empire renaît sous la bannière d'un pharaon islamique."
