l_french:
 CSO_f: "Chanter"
 CSO_f_desc: "La dynastie Song représente l’âge d’or commercial et technologique de la Chine. Bien que les Song du Sud aient perdu les plaines du nord au profit des Jurchen Jin, ils ont construit une économie commerciale maritime sans égal centrée sur le delta du Yangtsé et le grand port de Hangzhou. Restaurer les Song signifie rejeter l’empire continental en faveur d’un royaume compact et prospère défini par le commerce, l’innovation et la puissance navale."
